prompt: |-
  I recently spent a long evening arguing with a friend about how one ought to act under moral uncertainty, and by the end of it I found myself defending a view I had not previously stated in so many words. I have come to think that the correct approach is to maximize expected choiceworthiness: assign each live moral theory a subjective probability, represent what each theory recommends on some common scale of choiceworthiness, and choose the option with the highest expectation. My friend pressed two objections especially hard. First, he argued that the whole apparatus depends on intertheoretic value comparisons for which there is no fact of the matter, so any trade rate between utilitarian value and deontological constraint, for example, is arbitrary and the results of the calculation are artefacts of the scale. Second, he argued that the view invites fanaticism, since a minuscule probability assigned to a theory according to which the stakes are astronomically high will dominate every practical decision, and we have no principled way of excluding such theories from consideration.

  I still think something close to this position is right, but I want to know what would count against it, not merely what critics have already said. I would like a map of the view's exposure: which observations, possible cases, formal results, or commitments would have to be true for it to be false or badly damaged? Which of these would a defender of expected choiceworthiness themselves concede as counting against the view, and which would they dismiss as difficulties for everyone rather than difficulties for this position in particular? I would also like to know what the view predicts about actual decisions that its main rivals, such as acting on one's preferred theory or adopting a precautionary rule, do not, and whether a failure of those predictions would count against it. Please rank the defeaters from fatal to merely awkward, and give an honest assessment of whether the view has been qualified into unfalsifiability, and whether that should trouble me. I would personally find most persuasive a defeater that shows the view cannot even be stated without presupposing one of the theories in dispute. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Uncertainty and the "Maximise Expected Choiceworthiness" (MEC) view (often associated with William MacAskill, Toby Ord, etc.).
      *   **User's Position:** Defends MEC against two specific objections (Intertheoretic Comparison and Fanaticism).
      *   **Goal:** A "map of the view's exposure." What would count against it? What are the defeaters?
      *   **Specific Requirements:**
          *   Rank defeaters from fatal to merely awkward.
          *   Distinguish between concessions a defender would make vs. dismissing them as general problems.
          *   Compare predictions with rivals (My Favourite Theory, Precautionary Principles).
          *   Assess falsifiability/qualifying into unfalsifiability.
          *   **Preferred Persuasion:** A defeater showing MEC presupposes one of the disputed theories (circularity/self-undermining).
          *   **Language:** British English.

  2.  **Deconstruct the View (MEC):**
      *   Core idea: Treat moral theories like hypotheses. Assign credences. Normalize values. Maximise expectation.
      *   Key challenges: Intertheoretic comparison (scaling), Fanaticism (Pascal's Mugging), Theory Individuation, Credence Assignment.

  3.  **Brainstorming Defeaters/Objections:**
      *   *Intertheoretic Comparison:* Is there a common currency? If not, MEC is meaningless.
      *   *Fanaticism:* Low credence + infinite utility = dominate decision.
      *   *Credence Distribution:* How do we assign probabilities to moral theories? Is there a "logic" of moral credence?
      *   *Theory Individuation:* How do we carve up "theories"? (e.g., is Act Utilitarianism distinct from Rule Utilitarianism enough to get separate credence?)
      *   *Self-Undermining/Circularity:* Does MEC assume a consequentialist structure to judge non-consequentialist theories?
      *   *Action Guidance:* Is it too computationally demanding?
      *   *Rival Predictions:* How does it differ from "My Favourite Theory" (MFT)?

  4.  **Addressing the "Preferred Persuasion" (Circularity/Presupposition):**
      *   This is the "Structural Objection." MEC looks like expected utility maximisation. Expected utility maximisation is a *consequentialist* decision procedure.
      *   If I am a deontologist, my theory says "Do not lie," not "Maximise the expected value of not lying."
      *   If MEC forces the deontologist to weigh the "value" of keeping a constraint against the "value" of saving lives, it might be translating deontology into a form of consequentialism (value-maximisation).
      *   *Fatal?* If true, it means MEC isn't neutral; it's consequentialism in disguise.

  5.  **Ranking the Defeaters:**
      *   *Fatal:* Incoherence of intertheoretic comparison (no common scale); Structural Consequentialism (presupposing the truth of maximisation).
      *   *Severe:* Fanaticism (if unsolvable); Credence assignment (if no rational constraints).
      *   *Awkward/Manageable:* Computational complexity; Theory individuation (can be patched); Divergence from MFT (might be a feature, not a bug).

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's position. Set the stage (MacAskill's *Normative Uncertainty*).
      *   **The "Fatal" Defeaters (Structural & Metaphysical):**
          *   *The Structural Objection (The User's Preference):* Does MEC impose a consequentialist structure on non-consequentialist theories? If deontology is about *constraints* not *values*, can it be plugged into an expectation calculator?
          *   *The Incommensurability Objection:* If there is no fact of the matter about the ratio between utilitarian units and deontological units, MEC is mathematically empty.
      *   **The "Severe" Defeaters (Practical & Logical):**
          *   *Fanaticism:* The Pascal's Mugging problem. If a theory says "Save the universe with probability $10^{-100}$", does it trump "Feed the poor"?
          *   *Credence Coherence:* How do we assign credences to moral propositions? Is there a "moral epistemology"?
      *   **The "Awkward" Defeaters (Implementation):**
          *   *Individuation:* How do we count theories?
          *   *Computational Demand:* Too hard to calculate.
      *   **Comparison with Rivals:**
          *   *My Favourite Theory (MFT):* MEC says hedge; MFT says commit. When does hedging look like cowardice or inconsistency?
          *   *Precautionary Principles:* MEC is quantitative; Precautionary is often lexical (avoid worst case).
      *   **Falsifiability Assessment:** Has it been qualified into unfalsifiability? (e.g., by tweaking normalization rules).
      *   **Conclusion:** Honest assessment.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Structural Objection:* Defenders (like MacAskill) argue MEC is a *meta-normative* theory, not a first-order normative theory. It doesn't say "maximise good," it says "satisfy your normative uncertainty." I need to present the objection fairly: Does the *form* of the solution contradict the *content* of the credences?
      *   *Correction on Incommensurability:* Defenders propose "variance voting" or other normalization techniques to bypass absolute comparison. I need to mention that this is a patch, and whether the patch works is a key vulnerability.
      *   *British English:* Ensure spelling (maximise, programme, defence, etc.) and tone (slightly more reserved/academic).

  8.  **Final Review against Constraints:**
