      *   *Structure:* Clear headings for the ranking.
      *   *Key Insight:* The tension between the *form* of rational choice (maximisation) and the *content* of moral theories (which might reject maximisation).

      *(Self-Correction during drafting)*: Make sure to explicitly address the "presupposing one of the theories" point as requested. This is often called the "Consequentialisation" objection.

      *(Refining the Fanaticism point)*: Distinguish between empirical fanaticism (Pascal's Mugging) and normative fanaticism (tiny credence in extreme moral views).

      *(Refining Falsifiability)*: If every counter-example is met with "you normalized the scale wrong," is it falsifiable?

  10. **Final Polish:** Check spelling and idioms (e.g., "programme," "defence," "maths"). Ensure the ranking is clear.

  **(Post-Drafting Check):** Does this answer the prompt's specific request for a "map of exposure"? Yes, by categorising vulnerabilities. Does it address the "presupposition" concern? Yes, as the top fatal defeater.

