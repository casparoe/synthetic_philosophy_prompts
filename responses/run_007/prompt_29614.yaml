answer: |-
  The model you are describing is most rigorously formalized within cognitive science as **Transformational Creativity**, a concept developed primarily by the philosopher and cognitive scientist **Margaret Boden**. To fully account for the "parameter" mechanics you identified, this model is often paired with **Conceptual Space Theory**, developed by the philosopher **Peter Gärdenfors**.

  While "Transformational Creativity" is the established name for the *outcome* (creating something that could not have been generated by the previous rules), the specific *mechanism* you have isolated—pushing a single structural parameter until the system qualitatively changes—does not have a universally standardized proper noun distinct from the broader model. However, in systems theory and design research, this specific maneuver is increasingly analyzed as a **Parametric Bifurcation**.

  Below is an explanation of how this combined framework works, followed by precise answers to your boundary questions.

  ### The Model: Transformational Creativity within Conceptual Spaces

  **1. The Structure (Gärdenfors):**
  Gärdenfors proposes that human concepts are not defined by lists of features, but by **Conceptual Spaces**. These are geometric structures composed of **dimensions** (your "parameters"). For example, the conceptual space of "color" has dimensions of hue, saturation, and brightness. The conceptual space of "jazz standard" has dimensions of harmonic rhythm, melodic contour, and instrumentation.

  **2. The Mechanism (Boden):**
  Boden distinguishes between two types of creativity within these spaces:
  *   **Exploratory Creativity:** Searching the existing space. You tune the parameters, but you stay within the accepted boundaries. (e.g., writing a new jazz standard that follows the usual rules of chord changes). This produces **variation**.
  *   **Transformational Creativity:** Altering the dimensions or boundaries of the space itself. This is what you described as "turning a parameter further than anyone had thought to turn it." When a parameter is pushed past a critical threshold, the rules of the space change, making previously impossible structures possible. This produces a **new theme**.

  **3. The Dynamic (Bifurcation Theory):**
  To explain *why* turning a parameter sometimes creates a variation and sometimes a new theme, we borrow from dynamical systems. A system remains stable as parameters change until it hits a **Bifurcation Point**. At this point, a small change in a parameter causes a qualitative shift in the system's behavior (e.g., from "song" to "landscape").

  ### Addressing Your Boundary Questions

  **1. How does the model distinguish a variation from a genuinely new theme?**
  In this model, the distinction is not about how "different" the output looks, but about whether the **generative rules** have changed.
  *   **Variation (Exploratory):** The output is a new coordinate within the existing boundaries. If you reverse-engineer the work, it fits the old rule set.
  *   **New Theme (Transformational):** The output requires a new rule set to be generated or understood. The "parameter turn" has crossed a bifurcation point where the old constraints no longer apply.
  *   *Example:* In your jazz example, speeding up chord changes is *exploratory* until the harmony no longer functions as a progression supporting a melody, but as a texture. Once it functions as texture, the rule "chords support melody" has been transformed into "chords create atmosphere." That is the new theme.

  **2. Can it explain the origin of the very first theme, or does it only account for novelty once a theme already exists?**
  This is the known limitation of Boden's model. Transformational Creativity **cannot** account for the origin of the very first conceptual space (e.g., the first time a human decided to make music at all). The model requires an existing space to transform. It explains the evolution of forms, not the genesis of form itself. The origin of the "first theme" is generally attributed to **combinatorial creativity** (mixing unrelated existing concepts) or biological evolution, which lies outside this specific cognitive model.

  **3. Where is the line between this kind of creative variation and mere imitation?**
  The line is drawn by the **sociological re-basing** you mentioned. Boden's model is cognitive, but to account for the "treating the result as a new base" aspect, we integrate **Mihaly Csikszentmihalyi's Systems Model of Creativity**.
  *   **Imitation:** The creator and the audience recognize the work as belonging to the *old* space. The parameter turn is seen as a mistake or a stylistic flourish, not a new rule.
  *   **Creative Variation:** The work is accepted as a valid new coordinate within the old space.
  *   **Transformation (New Base):** The "Field" (critics, peers, users) accepts the parameter shift as a valid new dimension. The work is no longer judged by the old rules.
  *   *The Line:* The line is crossed when the parameter shift is **institutionalized**. If the next generation of programmers uses your changed evaluation rule as the *default* starting point, you have crossed from variation into transformation. If they treat it as a quirky fork, it remains variation.

  ### Proposed Terminology for the Specific Mechanism

  While **Transformational Creativity** is the established name for the *model*, it encompasses many ways to change a space (adding dimensions, deleting dimensions, changing weights). Your observation is more specific: it is the act of **extrapolating a single existing dimension until it redefines the space.**

  Since there is no single established proper noun for this specific tactic, I propose the term **Parametric Transgression**.

  **Definition:** A creative maneuver in which an existing structural parameter is intentionally driven beyond its conventional boundary (the bifurcation point), resulting in a qualitative shift in the system's behavior that is subsequently institutionalized as a new generative base.

  **Edge Cases for Parametric Transgression:**
  *   **Failed Transgression (Noise):** The parameter is turned, the system breaks, but the result is not accepted as a new base. It is dismissed as an error. (e.g., a translator drops the meter, but the resulting poem is viewed as "broken" rather than "new verse.")
  *   **Accidental Transgression (Discovery):** The parameter is turned without intent, but the new base is recognized later. (e.g., a programmer introduces a bug that changes an evaluation rule, and the community adopts the bug as a feature.)
  *   **Simulated Transgression (Mannerism):** The parameter appears to be turned, but the underlying rules remain the same. The creator mimics the *look* of the new theme without actually changing the generative structure. (e.g., writing free verse that secretly adheres to strict metrical counts without functional purpose.)

  ### Summary
  The established model is **Margaret Boden's Transformational Creativity**, formalized by **Peter Gärdenfors' Conceptual Spaces**. It explains your observation as the modification of a dimensional boundary within a conceptual space. It distinguishes variation from new themes based on whether the generative rules have changed, acknowledges it cannot explain the *first* theme, and relies on social acceptance to distinguish creation from imitation. For the specific mechanism of "turning one parameter," the precise term is **Parametric Transgression**.
