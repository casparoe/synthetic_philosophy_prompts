answer: |-
  You have correctly identified the **Pasadena Game** (Nover & Hájek, 2004). Your intuition is spot-on: the expected value is conditionally convergent, meaning the Riemann Rearrangement Theorem applies. The sum depends entirely on the order of summation, which corresponds to the ordering of states.

  You are asking for the *specification* of a decision theory that can survive this. You want to know the axioms before you look at the implementations. Here is the spec, the conflicts, and the single constraint that forces the hard work.

  ### The Spec: Desiderata for Infinite Choice

  Here are the five core requirements a theory must address. I have classified them by whether they are generally considered **Non-Negotiable** (violating them makes the theory irrational by standard lights) or **Camp Preference** (philosophical stances where reasonable people disagree).

  #### 1. Finite Agreement
  **The Requirement:** For any gamble with a finite number of states (or an infinite number where the expectation is absolutely convergent), the theory must yield the standard Expected Value (EV).
  **The Case:** If a new theory tells you to reject a bet that standard probability theory says is a guaranteed money pump (or vice versa) in simple finite cases, the theory is broken. It must extend standard theory, not contradict it.
  **Status:** **Non-Negotiable.**

  #### 2. State Permutation Invariance (Order Independence)
  **The Requirement:** The value of the gamble must not depend on the arbitrary indexing or ordering of the states. If you relabel the outcomes (e.g., swap the payoff for "Heads on toss 1" with "Heads on toss 5"), the value of the bet remains the same.
  **The Case:** The physical bet is the same regardless of how you write down the ledger. If the value changes because your friend listed the outcomes in a different order, the valuation is tracking your notation, not the world.
  **Status:** **Non-Negotiable** (for objective value), but this is where the math breaks.

  #### 3. Statewise Dominance
  **The Requirement:** If Gamble A yields a payoff greater than or equal to Gamble B in every possible state, and strictly greater in at least one, the theory must prefer A to B.
  **The Case:** This is the bedrock of rational choice. If you are better off in every possible world, you should choose that option.
  **Status:** **Non-Negotiable.**

  #### 4. Magnitude Sensitivity
  **The Requirement:** The theory must be sensitive to the size of the payoffs, not just their probability or rank. Doubling all payoffs should double the value (Linearity/Scaling).
  **The Case:** This rules out ordinal approaches (like stochastic dominance alone) that ignore *how much* better one outcome is than another.
  **Status:** **Non-Negotiable** (for a utility-based theory).

  #### 5. Definedness (Completeness)
  **The Requirement:** The theory must assign a specific value (or a definite preference ranking) to the gamble. It cannot return "undefined," "indeterminate," or "no verdict."
  **The Case:** You have a friend offering a bet *now*. You need a price. A theory that shrugs doesn't help you act.
  **Status:** **Camp Preference.** (Many theorists, like Hájek, argue the correct verdict *is* that the value is undefined).

  ---

  ### The Conflicts: The Impossibility Trilemma

  You suspected some of these cannot be jointly satisfied. You are correct. For infinite gambles with conditionally convergent payoffs (like Pasadena), **you cannot satisfy Finite Agreement, Permutation Invariance, and Definedness simultaneously.**

  Here is the conflict structure:

  1.  **Invariance vs. Definedness:** Because the series is conditionally convergent, Permutation Invariance demands the value be independent of order. However, the Riemann Rearrangement Theorem proves that *any* real number (or divergence) can be generated by reordering the sum. Therefore, if you demand Invariance, the only consistent value is **Undefined**. If you demand Definedness, you must sacrifice Invariance (admitting the value depends on how the game is described/ordered).
  2.  **Dominance vs. Invariance (in infinite contexts):** To preserve Dominance in infinite settings, you often need to sum the series in a specific way that respects the "natural" ordering of the states (e.g., time). If you enforce strict Permutation Invariance, you may lose the ability to prove that one option dominates another if the dominance relies on the tail behavior of a specific ordering.
  3.  **The Easwaran Compromise:** Kenny Easwaran (2008) proposed "Strong Expectation." He saves **Finite Agreement** and **Dominance**, but he sacrifices **Permutation Invariance**. He argues the value *does* depend on the natural ordering of the states (e.g., the order in which coins are tossed).
  4.  **The Hájek Compromise:** Alan Hájek argues for **Permutation Invariance** and **Finite Agreement**, which forces him to sacrifice **Definedness**. His verdict: The Pasadena Game has no fair price.

  **The Hard Truth:** You must choose between a theory that gives you an answer (but admits the answer depends on arbitrary ordering) or a theory that is order-independent (but admits it often cannot give you an answer).

  ---

  ### The Single Requirement That Rules Out the Patches

  You asked which single requirement does the most work to rule out the obvious patches (bounded utility, median, refusal).

  The winner is **Statewise Dominance.**

  Here is why it kills the common evasion tactics:

  1.  **Vs. "Just use the Median":** Median-based decision rules frequently violate Dominance. You can construct two gambles where A pays \$1 more than B in *every* state, but B has a higher median payoff. If your theory prefers B, it violates Dominance. Insisting on Dominance forces you to care about the tails and the magnitudes, not just the 50th percentile.
  2.  **Vs. "Refusing to Play":** If the Pasadena game is rescaled such that every payoff is positive (e.g., add a constant to every term so the minimum payoff is \$1), the game Statewise Dominates "doing nothing" (payoff \$0). A rule that says "Don't play infinite games" violates Dominance in this strictly-positive case. Dominance forces you to engage with the math rather than setting a policy of avoidance.
  3.  **Vs. "Bounded Utility":** This is the subtle one. Bounded utility is often proposed as a metaphysical fix ("utility *cannot* be infinite"). However, if you treat it as a patch to the *decision rule* rather than a claim about the world, Dominance pressures it. If I offer you a bet where the payoffs are physically unbounded (e.g., years of life, or dollars), and you cap them arbitrarily to make the math work, you risk violating Dominance between the *real* outcomes. To keep Dominance, you must justify *why* utility bounds exist, rather than using them as a mathematical convenience to make the sum converge.

  **Summary:**
  If you hold **Statewise Dominance** as non-negotiable, you cannot use the median (ignores magnitude), you cannot simply refuse strictly positive games (ignores better-in-all-states), and you cannot arbitrarily cap utility without a metaphysical story (risks violating preference over real outcomes).

  Dominance is the constraint that forces you to stare directly at the conditionally convergent series and decide whether you care more about the **Order** (Invariance) or the **Answer** (Definedness). There is no free lunch.
