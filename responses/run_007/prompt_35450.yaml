          *   Mira counters with Gödel (truth vs. provability).
          *   Sam argues for feedback loops without "tangles."
          *   Mira argues for the reality of the "I" symbol.
          *   *Shift:* Sam admits software is real despite being hardware. Mira admits the "magic" is in the structure, not the substance.
