  **MEMORANDUM**

  **TO:** Sexual Misconduct Hearing Panel
  **FROM:** [Your Name/Panel Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Recommendation – Case [Case Number]

  **Recommendation**
  After reviewing the evidence and the arguments presented, I recommend that the Panel **dismiss the charge of sexual misconduct.**

  I know this is a difficult conclusion, and it is not a reflection on the credibility of the Complainant or the seriousness of the harm they experienced. This recommendation rests on a specific interpretation of our policy language regarding "informed consent" and the necessary boundaries of what constitutes a sexual misconduct violation versus a breach of general community standards.

  **Reasoning**

  **1. The Definition of "Informed" Consent**
  The core disagreement on this panel is about the word "informed." Our policy states consent must be "informed, voluntary, and freely given," but it does not define the scope of information required.

  One half of the panel argues that "informed" means the Complainant must know any material fact that would influence their decision to have sex. Under this view, the Respondent's lie about his relationship status invalidates the consent because the Complainant says she would not have agreed had she known the truth.

  The other half argues that "informed" in a sexual context refers specifically to the nature of the physical act itself (e.g., what is happening, safety measures like condoms, identity of the partner). Under this view, lies about external circumstances—like relationship status, job, or intentions—do not turn consensual sex into misconduct.

  **2. Why We Must Draw the Line at the Act Itself**
  While the Complainant's position is morally compelling, adopting the "material fact" standard creates significant administrative and fairness issues that our current policy cannot support.

  If we rule that lying about a girlfriend vitiates consent, we set a precedent that is incredibly difficult to manage. People lie or exaggerate in dating scenarios all the time—about their feelings, their financial status, their age, or their intentions for the future. If any of these lies can retroactively turn a consensual encounter into a sexual misconduct violation, then almost any breakup involving bad feelings could become a disciplinary case. This creates a lack of "fair notice" for students. The Respondent could not have reasonably known that lying about his girlfriend would be charged as sexual misconduct rather than general dishonesty, because our policy does not explicitly state that relationship status is a condition of consent.

  In sexual misconduct adjudication, we generally follow the legal distinction between "fraud in the factum" (lying about the act itself) and "fraud in the inducement" (lying to persuade someone to agree). Only the former is typically treated as sexual assault or misconduct. Lying about a condom (safety/the act) fits the first category. Lying about a girlfriend (context/inducement) fits the second. Without explicit policy language expanding the definition, we should not broaden the scope of sexual misconduct to include the latter.

  **3. Acknowledging the Harm**
  Dismissing this charge does not mean the Respondent's behavior was acceptable. It was not. Lying to a partner about exclusivity is a serious breach of trust and ethical conduct. It caused real emotional harm to the Complainant, and we should not minimize that pain.

  However, not every unethical or hurtful behavior in a relationship falls under the umbrella of *sexual misconduct*. This distinction is crucial. Sexual misconduct policies are designed to protect bodily autonomy and safety. While the Complainant's autonomy was compromised by the lie, it was not compromised in the same way as it would be by coercion, force, or deception about the physical act.

  **Conclusion**
  To find the Respondent responsible for sexual misconduct based on this policy would require us to rewrite the definition of consent without proper authority or notice. Therefore, the charge must be dismissed.

  I strongly recommend that the Panel refer this matter to the general Student Code of Conduct office. The Respondent's dishonesty and the resulting harm may well violate policies regarding integrity or creating a hostile environment, even if they do not meet the threshold for sexual misconduct. We can hold the Respondent accountable for his dishonesty without expanding the definition of sexual assault beyond what our current rules allow.

  **Next Steps**
  If the Panel agrees with this recommendation, we will draft a finding of "Not Responsible" for the sexual misconduct charge and include a statement in the rationale clarifying that this finding is based on policy interpretation, not a judgment on the Complainant's credibility or the Respondent's honesty.
