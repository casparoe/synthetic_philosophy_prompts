answer: |-
  You are not missing a step in the math. Your intuition is correct: **Inverse Reinforcement Learning (IRL) is fundamentally ill-posed.**

  As you noted, for any observed policy, there are infinitely many reward functions that could rationalize it (especially once you account for sub-optimality, constraints, or hidden state). This is the same identification problem that plagues Revealed Preference Theory in economics. If you treat IRL as a pure inference problem where the goal is to recover the *unique, true* utility function from behavior alone, it is mathematically impossible.

  So, why does the alignment community (specifically the wing influenced by Stuart Russell, Dylan Hadfield-Menell, etc.) continue to talk about it? The answer lies in shifting the goalpost from **metaphysical recovery** to **instrumental generalization**, and acknowledging that the "prior" isn't a bug—it's the feature.

  Here is the breakdown of why IRL is still taken seriously in alignment, despite the underdetermination problem you correctly identified.

  ### 1. The Goal is Generalization, Not Identification
  In economics, Revealed Preference is often used to *explain* past behavior. In AI alignment, IRL is used to *predict* behavior in **new contexts**.

  If you use Behavioral Cloning (BC), you learn a mapping from states to actions. This works well within the training distribution. But if the environment changes (e.g., a new obstacle appears, or a new tool is available), BC fails because it doesn't know *why* the action was taken.

  IRL, even with an underdetermined reward, attempts to recover the **goal** rather than the **trajectory**.
  *   **Example:** If a human drives to the airport, BC learns "turn left at this specific intersection." IRL learns "minimize travel time to the airport."
  *   **The Payoff:** If the road is closed, the IRL agent can find a new route. The BC agent crashes or stalls.

  Even if the recovered reward function isn't the *unique* true human utility, it is often a **causal abstraction** that generalizes better than the policy itself. The "point" of IRL isn't to find the One True Reward; it's to find a reward function that compresses the behavior in a way that allows for robust transfer to out-of-distribution situations.

  ### 2. The Prior *Is* the Value Judgment
  You wrote: *"everything else coming from the prior."*
  In the alignment literature, this is often accepted explicitly. We cannot learn values from a vacuum. We must impose inductive biases that reflect our philosophical assumptions about what values *look like*.

  Common priors in IRL include:
  *   **State-dependence:** Rewards depend on states, not just actions (ruling out pure habit).
  *   **Discounting:** Future rewards are discounted (implying time preference).
  *   **Sparsity:** Rewards are rare (most states are neutral).
  *   **Simplicity:** The reward function is computationally simple relative to the policy.

  When researchers use IRL for alignment, they are effectively saying: *"Human values are likely to be simple functions of state rather than complex functions of history."* This is a philosophical claim, not a mathematical derivation. The math of IRL is just the engine that combines this prior with the data. If the prior is wrong, the values will be wrong, but without the prior, you have nothing.

  ### 3. Uncertainty is a Feature (Bayesian IRL)
  Early IRL tried to output a single reward vector. Modern alignment-focused IRL (like Bayesian IRL) outputs a **distribution** over reward functions.

  This addresses your concern about underdetermination. Instead of picking one arbitrary reward from the behavior-equivalence class, the agent maintains uncertainty about which reward is correct.
  *   **Corrigibility:** When the agent is uncertain about the reward, it can act conservatively or defer to the human.
  *   **Active Learning:** The agent can identify states where different reward functions in its posterior predict different optimal actions, and query the human to resolve the ambiguity.

  This transforms IRL from "I have inferred your values, now I optimize" to "I have a hypothesis space over your values, and I will act to reduce uncertainty while avoiding catastrophic error." This is the core of **Cooperative IRL (CIRL)**.

  ### 4. CIRL Breaks the Symmetry
  Your critique applies perfectly to *passive* IRL (watching a human act). However, the alignment proposal is usually **Cooperative IRL**.

  In CIRL, the human knows the robot is trying to learn their reward. The human is not just optimizing their own reward; they are optimizing the *joint* reward, which includes teaching the robot.
  *   **Pedagogic Behavior:** Humans will demonstrate things *differently* if they know they are being watched for learning purposes (e.g., exaggerating movements, avoiding ambiguous states).
  *   **Identifiability:** This extra channel of information (the human's intent to teach) can resolve some of the underdetermination that plagues standard Revealed Preference. It turns the problem from "infer reward from policy" to "infer reward from a teaching signal."

  ### 5. Why Not Just Use Preferences (RLHF)?
  You might notice that much of the industry has shifted from IRL (learning from demonstrations) to RLHF (learning from preferences/comparisons). This shift happened *because* of the exact problem you identified.

  Comparisons (e.g., "Trajectory A is better than Trajectory B") provide more information about the *shape* of the reward landscape than demonstrations alone.
  *   Demonstrations tell you what was chosen.
  *   Preferences tell you about the trade-offs between options that *weren't* chosen.

  However, even RLHF suffers from the same fundamental issue: you are fitting a reward model to human outputs, and that model is underdetermined. The alignment community knows this. The current consensus isn't that IRL/RLHF solves value learning, but that it is **better than the alternative** (hard-coding rules or pure behavioral cloning), provided you keep the human in the loop.

  ### Summary: What's the Point?
  You asked: *"Why do people treat IRL as if it recovers what humans actually want, rather than re-describing what they did?"*

  The sophisticated answer (which you won't always find in introductory posts) is:
  1.  **They don't think it recovers the "true" want.** They think it recovers a **proxy** that is more robust to distributional shift than behavioral cloning.
  2.  **They rely on the prior.** They accept that "values" are a combination of data + structural assumptions (priors).
  3.  **They leverage uncertainty.** They use the underdetermination to justify keeping the system uncertain and deferential, rather than confident and autonomous.

  If you read IRL papers as claiming "This math extracts the soul," you are right to be skeptical. If you read them as "This math allows us to build an agent that infers goals, generalizes better than imitation, and knows when it is confused," then the underdetermination is a known constraint to be managed, not a showstopper.

  The "missing step" you were looking for is likely the shift from **IRL as Value Extraction** to **IRL as a mechanism for maintaining Corrigibility.** The value isn't in the recovered reward function itself; it's in the fact that the agent is optimizing *something* that it acknowledges is uncertain and derived from the human, rather than a fixed objective hardcoded by the engineer.
