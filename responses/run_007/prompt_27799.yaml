prompt: |-
  Longtime reader of the rationalist/EA blogosphere here, and I keep noticing that arguments about earning-to-give are almost always empirical — does the marginal impact actually exist, does the job do net harm — while the philosophical committments of the practice get left unexamined. So here's what I want. Take the practice, common in effective-altruism circles, of steering a talented young person into a high-paying job they would not otherwise take (quant finance, big tech, management consulting, whatever) on the grounds that they can donate a large chunk of the income to top cost-effectiveness-rated charities and thereby do more good than they would in direct work. Reconstruct what this practice presupposes, philosophically. I'm not after the empirical bets. I mean the deeper commitments: about whether harms and benefits are fungible across persons, whether the right way to evaluate a career is as a marginal contribution conditional on someone else taking the job, whether the good you can buy through a ranked charity is the right unit of moral accounting, what it says about moral demandingness or about the moral relevance of the job's own content. Does the practice strictly presuppose a consequentialist picture, or is it compatible with several? And does it presupose inconsistent things — for instance, trusting cost-effectiveness estimates where they exist while waving off the harms of the job itself as too hard to measure? What would have to change about the practice if you replaced its implicit view of value with one where some harms can't be offset, or some values don't trade off? Act as a professional philosopher working on ethics and the philosophy of social practices; think carefully, maybe start by brainstorming candidate presuppositions, and don't just give me the sympathetic version — I want the version that actually licenses the practice. At the end, say how confident you are in the overall reconstruction and single out the one point you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Longtime reader of rationalist/EA blogosphere.
      *   **Topic:** Earning-to-Give (EtG).
      *   **Focus:** Philosophical commitments/presuppositions, *not* empirical claims (e.g., does the money actually help?).
      *   **Task:** Reconstruct the practice philosophically. What does it *presuppose* about value, agency, harm, benefit, demandingness, etc.?
      *   **Specific Questions to Address:**
          *   Fungibility of harms/benefits across persons?
          *   Career evaluation (marginal contribution vs. replacement)?
          *   Unit of moral accounting (charity QALYs/DALYs vs. job content)?
          *   Moral demandingness?
          *   Moral relevance of job content?
          *   Consequentialist exclusivity vs. compatibility?
          *   Potential inconsistencies (trusting CE estimates vs. ignoring job harms)?
          *   Counterfactual: What if value isn't fungible/offsettable?
      *   **Role:** Professional philosopher working on ethics and philosophy of social practices.
      *   **Tone:** Critical, rigorous, not just the "sympathetic version" but the version that *licenses* the practice.
      *   **Ending:** Confidence level + least sure point.

  2.  **Initial Brainstorming & Deconstruction of Earning-to-Give (EtG):**
      *   *Core Mechanism:* I do $X$ (potentially neutral or negative job) $\rightarrow$ Get Money $\rightarrow$ Donate to $Y$ (highly positive charity) $\rightarrow$ Net Positive.
      *   *Philosophical Engine:* This looks like classic Act Consequentialism (maximize good outcomes).
      *   *Fungibility:* Money is the universal translator. It assumes a dollar earned in finance is morally equivalent to a dollar earned in non-profits, provided the donation is the same. It assumes a harm done in finance can be "cancelled out" by a benefit in global health.
      *   *Counterfactuals:* The "replacement objection." If I don't take the job, someone else will. So my marginal harm is low. This relies on a specific view of causal responsibility (difference-making vs. participation).
      *   *Integrity/Complicity:* EtG often sidelines the "dirty hands" problem. It assumes I am not morally tainted by the immediate actions if the end result is good.
      *   *Demandingness:* It accepts high demandingness (you *should* take the high-paying job even if you hate it, if the math works).
      *   *Epistemology:* It trusts explicit, quantifiable metrics (charity eval) over implicit, qualitative metrics (job satisfaction, social meaning, direct impact).

  3.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the prompt's insight (empirical vs. philosophical). Set the stage as a philosophical reconstruction.
      *   **Section 1: The Ontology of Value (Fungibility & Aggregation).** Discuss the assumption that good and bad are on a single scale and can be netted out across different domains/people.
      *   **Section 2: The Metaphysics of Agency (Counterfactuals & Replacement).** Discuss the "marginal contributor" view vs. "complicity" view. The specific causal model used.
      *   **Section 3: The Epistemology of Moral Knowledge (Quantification Bias).** Why do we trust the charity numbers more than the job harm numbers?
      *   **Section 4: Moral Psychology & Integrity (The Separateness of Persons).** Does the agent matter? Or are they just a conduit?
      *   **Section 5: Normative Framework (Consequentialism vs. Others).** Is it strictly utilitarian? Can a Kantian do EtG?
      *   **Section 6: The Inconsistency Charge.** Address the prompt's specific question about trusting CE estimates vs. ignoring job harms.
      *   **Section 7: Alternative Value Systems.** What if value isn't fungible? (Deontology, Virtue Ethics, Non-consequentialist views).
      *   **Conclusion:** Summary of the reconstruction.
      *   **Confidence & Uncertainty:** As requested.

  4.  **Drafting the Content - Key Philosophical Points:**

      *   *Fungibility:* EtG requires strong commensurability. A life saved in malaria prevention must be comparable to stress caused in a trading firm. This is Utilitarian aggregation.
      *   *Agency:* The "Replaceability Argument." This is crucial. It shifts moral responsibility from *doing* to *causing the difference*. This aligns with a specific causal view (counterfactual dependence) rather than a participatory view (being part of a causal chain).
      *   *Integrity:* Bernard Williams' critique of Utilitarianism. EtG treats the agent as a neutral vessel. It separates the *source* of resources from the *use* of resources morally.
      *   *Epistemic Asymmetry:* Why is the charity impact "knowable" but the finance harm "uncertain"? This is an epistemic commitment to explicit quantification over qualitative judgment.
      *   *Consequentialism:* It's heavily weighted towards Act Consequentialism. Rule Consequentialism might object (what if everyone did this?). Deontology would object to using people (in the job) as means.
      *   *Inconsistency:* The prompt asks about trusting CE vs. ignoring harm. The defense is usually "scope neglect" or "precision bias." The philosophical commitment is that *precision* warrants *weight*, even if accuracy is debatable.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just bash EtG. The prompt asks for the version that *licenses* the practice. I need to articulate the internal logic that makes it rational for the practitioner.
      *   *Nuance:* Is it *strictly* consequentialist? Some virtue ethicists might argue earning to give cultivates generosity. But the *steering* into a specific job is mostly consequentialist. I should clarify that distinction.
      *   *Focus on "Social Practices":* The prompt asks me to act as a philosopher of *social practices*. I need to mention how this shapes the community's norms, not just individual ethics. It creates a division of moral labor.

  6.  **Developing the "Inconsistency" Point:**
      *   The prompt suggests an inconsistency: Trusting charity metrics (hard to measure long-term effects) while waving off job harms (also hard to measure).
      *   *Philosophical Defense:* It's not necessarily inconsistency; it's a *prior* on distribution of evidence. The charity has RCTs; the finance job's harm is diffuse.
      *   *Philosophical Critique:* This privileges *visible* harm/benefit over *structural* harm/benefit. It presupposes a methodology where local, diffuse systemic effects count for less than targeted, measurable interventions.

  7.  **Developing the "Non-Fungible" Counterfactual:**
      *   If harms can't be offset (deontological constraints), EtG collapses if the job violates a constraint (e.g., lying, exploiting).
      *   If values don't trade off (pluralism), you can't say "1000 malaria nets = 1 year of soul-crushing work." You have incommensurable values.

  8.  **Final Review against Constraints:**
      *   Did I answer the specific questions? (Fungibility, marginal contribution, unit of accounting, demandingness, job content).
      *   Is the tone appropriate? (Professional philosopher).
      *   Is the ending correct? (Confidence + least sure point).

  9.  **Final Polish:** Check for clarity, flow, and philosophical precision (e.g., distinguishing between *act* and *rule* consequentialism, *complicity* vs. *causation*). Ensure the distinction between the *empirical* bet (which the user wants to set aside) and the *philosophical* license (which makes the bet possible) is clear.

  *(Self-Correction on Confidence)*: I need to be honest. Reconstructing a community's implicit philosophy is interpretive. I should place confidence high on the consequentialist link, but lower on whether the community *consciously* holds the epistemic asymmetry view or if it's just a bias.

  10. **Drafting the Response** (incorporating the above thoughts into the final output).
answer: |-
  This is a sharp distinction. The Effective Altruism (EA) discourse often treats Earning-to-Give (EtG) as a portfolio optimization problem, masking the normative architecture that makes the optimization possible. As a philosopher of social practices, I view EtG not merely as an individual strategy but as a ritualized division of moral labor. To reconstruct the philosophical commitments that *license* this practice (rather than merely justify it post hoc), we need to excavate the ontology of value, the metaphysics of agency, and the epistemology of moral knowledge embedded in the norm.

  Here is the reconstruction of the philosophical presuppositions of Earning-to-Give.

  ### 1. The Ontology of Value: Strong Commensurability and Fungibility
  The primary philosophical engine of EtG is **strong value commensurability**. The practice presupposes that the disvalue generated by a high-paying job (e.g., market volatility, resource extraction, bureaucratic bloat) and the value generated by a top charity (e.g., lives saved, suffering averted) exist on a single, cardinal scale of moral utility.

  *   **Fungibility Across Domains:** EtG assumes moral "cleaning." It presupposes that a benefit conferred on Person B (a malaria net recipient) can ontologically cancel out a harm inflicted on Person A (a client misled by a financial product, or a community displaced by development). This is not just aggregation; it is *offsetting*. It rejects the notion of "moral stains" or agent-relative constraints that persist regardless of outcomes.
  *   **Fungibility Across Persons:** It presupposes a specific view of the "separateness of persons." While it acknowledges distinct individuals, it treats their welfare as buckets in a single reservoir. The practice licenses the instrumentalization of the *earner's* immediate context for the sake of the *donor's* distant context. The job site is not a moral community in itself; it is a resource extraction zone for moral capital.

  ### 2. The Metaphysics of Agency: Counterfactualism and Replaceability
  The most contentious philosophical commitment in EtG is its model of causal responsibility. The practice relies on the **Replaceability Argument**, which presupposes a *counterfactual* view of harm rather than a *participatory* one.

  *   **Difference-Making vs. Complicity:** EtG presupposes that moral responsibility attaches only to *marginal difference-making*. If you do not take the harmful job, someone else will, and the harm will occur regardless. Therefore, your causal contribution to the harm is near zero. This rejects a "complicity" model of ethics (common in Kantian or Aristotelian frameworks), where participating in a harmful structure incurs moral cost regardless of your marginal impact on the outcome.
  *   **The Atomized Agent:** This view treats agents as interchangeable units of labor power. It presupposes that the specific *identity* of the person doing the job is morally irrelevant, provided the output (salary) is the same. This strips the career of expressive value. The job is not an expression of the self; it is a mechanism for resource generation.

  ### 3. The Epistemology of Moral Knowledge: Quantification Bias
  You asked about the inconsistency of trusting cost-effectiveness (CE) estimates while waving off job harms. Philosophically, this is not necessarily an inconsistency, but a commitment to **Epistemic Positivism regarding value**.

  *   **The Visibility Principle:** The practice presupposes that moral claims are more credible when they are quantified, even if the quantification rests on shaky empirical models (e.g., long-termist AI safety estimates). Conversely, harms that are qualitative, diffuse, or systemic (e.g., "contributing to financial instability") are discounted not because they are deemed non-existent, but because they lack *epistemic legibility*.
  *   **Asymmetric Burden of Proof:** The license to EtG places the burden of proof on the *harm* of the job. Unless the harm can be demonstrated with the same rigor as the charity's RCTs (Randomized Controlled Trials), it is treated as negligible. This privileges *concentrated, measurable benefits* over *diffuse, structural harms*. It assumes the moral universe is structured such that the things we can count are the things that count most.

  ### 4. Moral Psychology: The Separation of Source and Use
  EtG presupposes a **compartmentalized moral psychology**. It requires the agent to sever the moral connection between the *source* of the resources and the *use* of the resources.

  *   **Moral Laundering:** In many ethical traditions (e.g., religious tithing), the purity of the gift matters. EtG presupposes that the moral valence of the donation is independent of the moral valence of the income. This is a form of consequentialist "moral laundering." It assumes the agent can maintain integrity while acting as a conduit for potentially harmful processes, provided the terminal output is good.
  *   **Demandingness:** The practice accepts a high degree of **moral demandingness**, but specifically *instrumental* demandingness. It does not necessarily demand you be a saint in your personal interactions; it demands you optimize your economic output. It shifts the locus of virtue from *character* (being honest, kind, direct) to *efficiency* (maximizing the ratio of good-to-cost).

  ### 5. Normative Framework: Act Consequentialism with Rule-Utilitarian Trimmings
  Does this strictly presuppose consequentialism?
  *   **Core:** Yes, it is fundamentally **Act Consequentialist**. The right action is determined solely by the net outcome.
  *   **Compatibility:** It is difficult to reconcile with Deontology (which would forbid using people as means in the high-paying job) or Virtue Ethics (which would ask what working in finance *does to your character*). However, a **Rule Consequentialist** might support EtG if the general practice of talented people earning to give creates a better world than the general practice of them doing direct work.
  *   **The Inconsistency:** The tension you noted (trusting CE vs. ignoring harm) reveals a friction between *Act* and *Rule* thinking. EtG practitioners often argue as Act Consequentialists regarding the donation (do the most good now) but implicitly rely on Rule Consequentialist defenses regarding the job (if I don't do it, the system continues). The philosophical license requires holding both simultaneously: "I am responsible for my donation's impact, but not my job's systemic impact."

  ### 6. What If Value Is Not Fungible?
  If we replace the implicit view with one where harms cannot be offset (Deontological constraints) or values do not trade off (Value Pluralism):
  *   **The Practice Collapses:** If the high-paying job involves a rights violation (e.g., fraud, exploitation), a non-consequentialist view holds that you cannot "buy your way out" of that violation. The harm is a *constraint*, not a *cost*.
  *   **Integrity Returns:** If values are plural (e.g., justice, community, honesty are distinct from welfare), then maximizing welfare via donation does not compensate for a deficit in justice via the job. The career becomes a site of moral formation again, not just resource extraction. The "marginal contribution" argument fails because participation itself has intrinsic moral weight.

  ### 7. Summary of the Reconstruction
  The practice of Earning-to-Give is licensed by a specific philosophical configuration:
  1.  **Utilitarian Aggregation:** Goods and bads are nettable on a single scale.
  2.  **Counterfactual Causation:** Responsibility is limited to difference-making, excluding complicity.
  3.  **Epistemic Prioritization:** Quantifiable outcomes trump qualitative systemic effects.
  4.  **Instrumental Agency:** The self is a vessel for optimization, not a locus of expressive integrity.

  This configuration allows the practitioner to view themselves not as a participant in a potentially harmful industry, but as a neutral extractor of value from that industry for deployment elsewhere. It resolves the tension of "dirty hands" by denying that the hands get dirty if the water used to wash them is sufficiently effective.

  ***

  **Confidence Level:**
  I am **85% confident** in this reconstruction. It aligns closely with the explicit writings of key figures (e.g., Singer, MacAskill) and the implicit norms observed in the community.

  **Least Sure Point:**
  I am least sure about the **Epistemic Prioritization** claim (Section 3). While it is clear that EA privileges quantification, it is ambiguous whether this is a deep *philosophical commitment* (i.e., "unquantifiable harms are less real") or merely a *heuristic bias* (i.e., "we trust what we can measure, but admit we might be wrong"). If it is merely a heuristic, the philosophical license is weaker than I have portrayed, relying more on pragmatic triage than ontological claims about value. However, given the community's tendency to dismiss "vague" harms (like cultural degradation) in favor of "precise" models (like QALYs), I lean toward treating it as a committed epistemological stance.
