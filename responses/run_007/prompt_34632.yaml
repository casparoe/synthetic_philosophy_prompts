      *   **User's Choice 2:** Picked (D).
      *   **Roommate's Claim:** The user's preferences are inconsistent/irrational and violate a basic rule of rational choice.
      *   **User's Question:** Is the roommate right? Or can the choices be defended?

  2.  **Identify the Economic Concept:**
      *   This is a classic setup. It looks exactly like the **Allais Paradox**.
      *   Let's verify the numbers.
          *   Standard Allais Paradox usually involves:
              *   1A: \$1M guaranteed.
              *   1B: 10% \$5M, 89% \$1M, 1% \$0.
              *   2A: 11% \$1M, 89% \$0.
              *   2B: 10% \$5M, 90% \$0.
          *   The user's numbers are scaled down (\$1000/\$5000 instead of \$1M/\$5M), but the probabilities match the structure perfectly.
              *   Choice 1: Sure thing vs. Risky mix.
              *   Choice 2: Small probability of sure thing amount vs. Slightly smaller probability of big amount.
      *   **The Theory:** Expected Utility Theory (EUT), specifically the **Independence Axiom**.

  3.  **Evaluate the "Rationality" Claim (Expected Utility Theory):**
      *   Let $U(x)$ be the utility of money $x$. Normalize $U(0) = 0$.
      *   **Choice 1:**
          *   $E[U(A)] = U(1000)$
          *   $E[U(B)] = 0.89 U(1000) + 0.10 U(5000) + 0.01 U(0)$
          *   User chose A, so: $U(1000) > 0.89 U(1000) + 0.10 U(5000)$
          *   Subtract $0.89 U(1000)$ from both sides: $0.11 U(1000) > 0.10 U(5000)$
      *   **Choice 2:**
          *   $E[U(C)] = 0.11 U(1000)$
          *   $E[U(D)] = 0.10 U(5000)$
          *   User chose D, so: $0.10 U(5000) > 0.11 U(1000)$
      *   **Contradiction:**
          *   From Choice 1: $0.11 U(1000) > 0.10 U(5000)$
          *   From Choice 2: $0.10 U(5000) > 0.11 U(1000)$
          *   These cannot both be true simultaneously under Expected Utility Theory.
      *   **Conclusion:** Under the standard neoclassical definition of "rationality" (maximizing expected utility with consistent preferences), the roommate is technically correct. This violates the Independence Axiom.

  4.  **Evaluate the "Defense" (Behavioral Economics/Psychology):**
      *   Is the user *actually* irrational in a real-world sense? No.
      *   This is the **Allais Paradox**, named after Maurice Allais (Nobel laureate).
      *   Most people make exactly these choices.
      *   **Why?**
          *   **Certainty Effect:** People overweight outcomes that are considered certain compared to outcomes that are merely probable. In Choice 1, moving from 100% to 89% feels like a huge loss of security, even though the expected value might be higher in B.
          *   **Common Consequence Effect:** In Choice 1, both A and B have an 89% chance of \$1000. In Choice 2, that common outcome is removed (replaced by \$0). Rational theory says you should ignore the common part, but humans don't.
          *   **Regret Minimization:** If you pick B and get 0 (1% chance), you'd kick yourself for not taking the sure \$1000. In Choice 2, both are risky, so no regret about missing a "sure thing."
      *   **Alternative Theories:** Prospect Theory (Kahneman & Tversky) explains this better than EUT. It accounts for how people value gains/losses non-linearly and weight probabilities non-linearly.

