answer: |-
  Your roommate is technically correct according to standard economic theory, but **you are not crazy, and you are certainly not alone.** In fact, you just replicated one of the most famous experiments in the history of economics.

  What you experienced is called the **Allais Paradox**, named after the French economist Maurice Allais, who won the Nobel Prize in 1988 partly for identifying this exact "inconsistency."

  Here is the breakdown of why your roommate grinned, why your choices feel right, and who is actually "rational."

  ### 1. Why your roommate says you're inconsistent (The Math)
  In standard economics, "rationality" is defined by **Expected Utility Theory**. This theory assumes you have a consistent internal value for money and that you make choices to maximize that value. It relies on something called the **Independence Axiom**.

  Here is the algebra of your choices (let $U$ be the satisfaction/utility you get from money):

  **Choice 1:** You picked the guaranteed \$1000 (A) over the gamble (B).
  *   $U(1000) > 0.89 \cdot U(1000) + 0.10 \cdot U(5000) + 0.01 \cdot U(0)$
  *   If we subtract $0.89 \cdot U(1000)$ from both sides, this simplifies to:
  *   **$0.11 \cdot U(1000) > 0.10 \cdot U(5000)$**

  **Choice 2:** You picked the 10% chance of \$5000 (D) over the 11% chance of \$1000 (C).
  *   $0.10 \cdot U(5000) > 0.11 \cdot U(1000)$

  **The Contradiction:**
  Look at the bolded inequality from Choice 1. It says $0.11 \cdot U(1000)$ is bigger.
  Look at Choice 2. It says $0.10 \cdot U(5000)$ is bigger.
  They cannot both be true. Mathematically, if you prefer A over B, you *must* prefer C over D. By switching your preference, you violated the Independence Axiom.

  ### 2. Why your choices feel right (The Psychology)
  If the math says you're wrong, why does picking A and D feel so logical? Because human brains don't process probability linearly. We are influenced by two major psychological factors:

  **A. The Certainty Effect**
  Humans place a disproportionately high value on things that are 100% certain.
  *   In **Choice 1**, moving from 100% guaranteed to 89% feels like a massive loss of security, even though the odds are still in your favor. You are willing to sacrifice potential gain to eliminate the risk of walking away with nothing.
  *   In **Choice 2**, neither option is certain. Both are risky. Since the "certainty bonus" is gone, you look at the payouts and think, "\$5000 is way better than \$1000, and the odds (10% vs 11%) are basically the same."

  **B. Regret Minimization**
  *   In **Choice 1**, if you take the gamble and hit the 1% "zero" outcome, you would feel immense regret ("I could have had \$1000 for sure!").
  *   In **Choice 2**, if you pick D and lose, you don't feel as much regret because C was also very likely to result in zero.

  ### 3. The Verdict: Is he right or are you?
  **Your Roommate:** He is right **within the specific framework of Neoclassical Economics.** If you are building a mathematical model that assumes humans are perfectly consistent utility maximizers, your choices break the model.

  **You:** You are right **within the framework of Behavioral Economics and Reality.** Most people make the exact same choices you did. Maurice Allais proved that Expected Utility Theory fails to describe how actual humans behave. Later, psychologists Daniel Kahneman and Amos Tversky developed **Prospect Theory** (which won a Nobel Prize) specifically to explain why people choose A and D.

  ### How to respond to your roommate
  Tell him: *"I know, it's the Allais Paradox. I'm violating the Independence Axiom because of the Certainty Effect. My preferences aren't inconsistent; your model of utility is just too narrow to account for how humans actually value certainty versus risk."*

  He'll either be impressed you looked it up, or annoyed that you ruined his "gotcha" moment. Either way, you're in good company with two Nobel Prizes.
