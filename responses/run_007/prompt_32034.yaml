prompt: |-
  I'd like you to read Shakespeare's The Tempest through the lens of Montaigne's essay "Of Cannibals" and the idea of cultural relativism it is often taken to inaugurate. Montaigne describes the Tupinambá people of Brazil, their ritual cannibalism of dead enemies, and their social order, and he uses this description to unsettle the European distinction between civilized and barbarous, arguing that calling them savages reflects our own parochialism more than any truth about them. The essay is a direct source for Gonzalo's speech in Act II, Scene 1 about his ideal commonwealth, where he imagines a society without sovereignty, commerce, or labor—a passage that lifts almost verbatim from Florio's translation of Montaigne.

  A reading that simply notes the borrowing is easy. What I want is a reading that takes the philosophical tension seriously. The play gives us Caliban, the dispossessed islander whom Prospero teaches language and then enslaves, and who is described by other characters as monstrous, fish-like, brutish, and lustful. Caliban is in some ways the play's Tupinambá: the native whose humanity is at issue. But where Montaigne's essay works to make the reader see the cannibal as fully human and his society as coherent, Shakespeare seems to stack the deck. Caliban is not given a functioning society—he is alone, his mother is dead, and he is ruled by a foreign magician. He attempts to rape Miranda and conspires to murder Prospero. The play offers no sustained depiction of an alternative social order on the island that might genuinely challenge European assumptions; instead, Caliban's world is already broken before we see it, and the closest thing to a native political structure is his comic allegiance to Stephano.

  I want a reading that asks whether the play dramatizes something Montaigne's essay misses, or whether it simply backs away from the radical implications of the relativist view. Does the play's treatment of Caliban show that Montaigne's relativism is naive—that real encounters across cultures are never the symmetrical, respectful affair the essay imagines, because they are always entangled with domination, fear, and the projection of monstrosity? Or does the play, by making Caliban sympathetic in certain moments (the "isle is full of noises" speech, his grief at being dispossessed), vindicate a Montaignian refusal to write off the other, even as it shows how hard that refusal is to sustain in practice? Where does the play complicate the idea that we can simply set aside our own categories and see another culture clearly? And where, if anywhere, does the play suggest that the very project of judging another culture—whether to condemn or to romanticize—is the problem Montaigne diagnosed, even when the play itself cannot fully escape it?

  The reading should be faithful in both directions: it should not reduce the play to a philosophical allegory, and it should not distort Montaigne's essay into a straw man. It should end by saying what the play, as a work of drama with characters and consequences, adds to the philosophical debate about relativism that argument alone cannot deliver.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Core Task:** Read Shakespeare's *The Tempest* through the lens of Montaigne's "Of Cannibals" and cultural relativism.
      *   **Key Connection:** Gonzalo's utopian speech (Act II, Scene 1) borrows from Florio's translation of Montaigne. Caliban is the dramatic counterpart to Montaigne's Tupinambá.
      *   **The Problem/Tension:** Montaigne argues for the humanity/coherence of the "savage." Shakespeare presents Caliban as dispossessed, enslaved, potentially rapacious, and without a functioning society. The encounter is asymmetrical (Prospero vs. Caliban), unlike Montaigne's theoretical symmetry.
      *   **Key Questions to Address:**
          *   Does the play show Montaigne's relativism is naive (real encounters involve domination/fear)?
          *   Does the play vindicate Montaigne's refusal to write off the "other" despite the difficulty?
          *   Where does the play complicate the idea of setting aside categories?
          *   Does the play suggest the *act of judging* is the problem?
      *   **Constraint:** Must be faithful to both texts (no allegorical reduction, no straw-manning Montaigne).
      *   **Conclusion:** What does *drama* add to the *philosophical debate* that argument alone cannot?

  2.  **Deconstruct the Sources:**
      *   **Montaigne ("Of Cannibals"):**
          *   Context: French Wars of Religion. "Barbarism" is a mirror.
          *   Argument: We call them savages because they differ from us, not because they are inferior. Their warfare is arguably more honest than European religious wars.
          *   Tone: Skeptical, observational, self-critical.
          *   Limitation: It's an essay. It describes a people *away* from the immediate pressure of colonization (though written during the rise of it). It's theoretical empathy.
      *   **Shakespeare (*The Tempest*):**
          *   Context: Jamestown, Bermuda shipwrecks, early colonialism.
          *   Caliban: "Salvage and deformed slave." Claims inheritance ("This island's mine"). Accused of rape. Taught language, uses it to curse.
          *   Prospero: The colonizer figure. "Civilizing" mission turned to enslavement.
          *   Gonzalo: The dreamer. Uses Montaigne to imagine a golden age, but is mocked by Antonio/Sebastian.
          *   Tone: Ambiguous, theatrical, embodied.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Establish the link: Gonzalo's speech is the smoking gun connecting the texts.
          *   State the thesis: *The Tempest* doesn't just illustrate Montaigne; it stress-tests him. It moves relativism from the study to the stage, where power dynamics make "neutral observation" impossible. The play suggests that while Montaigne is right about the *projection* of monstrosity, he underestimates the *material reality* of conquest that makes reciprocity impossible.

      *   **Montaigne's Project (The Baseline):**
          *   Clarify Montaigne's relativism. It's not "anything goes," but "our standards aren't universal."
          *   The Tupinambá are a mirror for European corruption.
          *   Crucial point: Montaigne writes from a distance. He observes a culture intact.

      *   **Gonzalo's Utopia (The Theoretical Import):**
          *   Analyze Act II, Scene 1. Gonzalo imagines a pre-lapsarian state (no sovereignty, labor).
          *   The mockery by Antonio/Sebastian is crucial. It shows the "realpolitik" response to Montaigne.
          *   This sets up the tension: Idealism vs. Cynicism. Where does Caliban fit?

      *   **Caliban as the Dispossessed Tupinambá (The Dramatic Complication):**
          *   Caliban claims ownership ("Sycorax my mother..."). This aligns with Montaigne's respect for native sovereignty.
          *   *However*, Caliban is alone. No society to observe. No rituals to contextualize his behavior.
          *   The "rape" attempt: This is the sticking point. Montaigne defends cannibalism as ritual/warfare. Shakespeare gives Caliban a sexual violation of the colonizer's daughter. This makes sympathy harder for the Jacobean audience (and modern ones).
          *   Is Caliban "monstrous" by nature or by Prospero's construction? (The "language" argument: "You taught me language, and my profit on't / Is, I know how to curse.")

      *   **The Asymmetry of Encounter (Philosophical Tension):**
          *   Montaigne assumes a level of detachment. Prospero and Caliban are entangled in a master/slave dialectic.
          *   Relativism requires two standing subjects. Enslavement reduces one to an object.
          *   The play shows that once domination begins, "understanding" becomes a tool of control (Prospero knows Caliban better than Caliban knows himself).
          *   Does this prove Montaigne naive? Yes, in the sense that he didn't account for the *violence* of the contact zone.

      *   **Sympathy and Aesthetics (The Vindication):**
          *   Caliban's "noises" speech (Act III, Scene 2). This is the counter-weight to the "monster" label.
          *   It grants him interiority and a poetic soul.
          *   This aligns with Montaigne: The "savage" has a rich inner life/culture that the colonizer misses.
          *   But unlike the essay, the play forces us to feel the *tragedy* of this. It's not just an intellectual correction; it's an emotional wound.

      *   **The Act of Judging (The Meta-Commentary):**
          *   Who judges whom? Prospero judges Caliban. But Prospero is also judged by the audience (and eventually forgives).
          *   The play suggests the *category* of "monster" is the problem. Stephano and Trinculo see a commodity/fish. Prospero sees a slave. Miranda sees a villain.
          *   Only the audience sees the whole picture.
          *   Montaigne asks us to suspend judgment. The play shows us *why* we fail to do so (fear, greed, lust).

      *   **Conclusion (What Drama Adds):**
          *   Philosophy argues; Drama embodies.
          *   Montaigne offers a corrected perspective. Shakespeare offers a *conflicted experience*.
          *   The play adds *consequence* and *time*. Relativism isn't just a viewpoint; it's a relationship that can break or heal.
          *   Final thought: *The Tempest* suggests that recognizing the humanity of the other is not an intellectual exercise (as in Montaigne) but a moral crisis that requires relinquishing power (Prospero's abjuration), which is much harder.

  4.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it's academic but engaging. Avoid simplistic "Prospero = Bad, Caliban = Good" binaries.
      *   *Check Montaigne:* Ensure I don't paint him as a modern anthropologist. He's a skeptic humanist.
      *   *Check Caliban:* Acknowledge the rape attempt without excusing it, but contextualize it within the power dynamic.
      *   *Focus on the Prompt:* Make sure I answer "What does drama add?" explicitly.

  5.  **Self-Correction during Drafting (Mental Check):**
      *   *Initial thought:* Maybe argue Caliban represents the failure of Montaigne.
      *   *Correction:* No, it's more nuanced. Caliban represents the *conditions* under which Montaigne's thought must operate. Montaigne writes in a library; Shakespeare writes in a colony.
      *   *Make sure to mention Gonzalo:* He is the bridge. His speech is optimistic, but the play surrounds it with conspiracy. This mirrors the fragility of relativism in a power struggle.
      *   *The "Noises" speech:* This is essential. It's the moment Caliban transcends the "savage" label not through argument (like Montaigne) but through beauty.

  6.  **Final Review against constraints:**
      *   Faithful to both texts? Yes.
      *   Addresses the tension? Yes.
      *   Ends with what drama adds? Yes.

  (Proceed to generate output based on these structured thoughts.)
answer: |-
  To read *The Tempest* alongside Montaigne's "Of Cannibals" is to witness the collision of a philosophical ideal with a dramatic reality. Montaigne's essay, written in the wake of the French Wars of Religion, uses the Tupinambá people of Brazil as a mirror to reflect European corruption back upon itself. He argues that "barbarism" is a label we apply to what is not our own custom, and that the so-called savages possess a social coherence and moral honesty that often surpasses Christendom. Shakespeare, writing two decades later as English colonialism began to take shape, imports this logic directly into the mouth of Gonzalo, whose utopian speech in Act II is lifted from John Florio's 1603 translation of Montaigne.

  However, where Montaigne offers a skeptical meditation from the safety of his library, Shakespeare stages an encounter in the contact zone. The play does not merely illustrate Montaigne's relativism; it stress-tests it. By embodying the "savage" in the character of Caliban—a dispossessed, enslaved, and sexually threatening figure—Shakespeare complicates the essay's clean intellectual symmetry. *The Tempest* suggests that while Montaigne is correct that monstrosity is often a projection of the observer, he underestimates how the material realities of domination, fear, and historical violence make the suspension of judgment nearly impossible. The play ultimately argues that recognizing the humanity of the other is not an epistemological shift, as Montaigne suggests, but a moral crisis that requires the relinquishment of power.

  Montaigne's project in "Of Cannibals" is fundamentally epistemological. He seeks to dismantle the European confidence in its own categories. When he describes the Tupinambá eating their dead enemies, he does not deny the horror but contextualizes it within a code of honor and revenge that he finds more intelligible, and perhaps more honest, than the religious tortures of contemporary Europe. His relativism relies on a certain distance; he observes a culture that is intact, functioning, and separate. The Tupinambá are subjects of their own history, allowing Montaigne to grant them the dignity of difference.

  In *The Tempest*, this distance is obliterated. Caliban is not observed from afar; he is on stage, in chains, and in conversation with his master. He is the Tupinambá after the conquest has already begun. Montaigne describes a people with a social order; Caliban is presented as a solitary survivor, his mother dead, his sovereignty usurped. When Caliban asserts, "This island's mine, by Sycorax my mother, / Which thou tak'st from me," he invokes the Montaignian claim of native sovereignty. Yet, the play offers no evidence of the coherent society Montaigne attributes to the Brazilians. Caliban's world is already broken. This absence is crucial: it denies the audience the comfort of seeing Caliban's culture as a viable alternative. We see the victim of colonization, but not the civilization that preceded it. Consequently, the audience is asked to validate Caliban's humanity without the cultural context Montaigne deemed necessary to do so.

  This structural asymmetry deepens when we consider the specific accusations leveled against Caliban. Montaigne defends the Tupinambá against the charge of barbarism by reinterpreting their rituals. Shakespeare, however, gives Caliban a crime that resists easy cultural reinterpretation: the attempted rape of Miranda. Caliban admits to it without remorse, stating, "O ho, O ho! would't had been done! / Thou didst prevent me; I had peopled else / This isle with Calibans." For a Jacobean audience, and indeed for a modern one, this act positions Caliban not just as a political rival but as a sexual threat to the colonizer's lineage.

  Here, the play dramatizes the limit of Montaigne's relativism. Montaigne assumes that if we strip away our prejudice, we will see the "other" as rational and human. *The Tempest* asks what happens when the "other" acts in ways that confirm our deepest fears. Prospero's narrative is that he civilized Caliban ("I endowed thy purposes / With words that made them known"), only to be met with violation. This mirrors the colonial justification of the "ungrateful savage" who proves his own need for subjugation. If we follow Montaigne, we must ask whether Caliban's action is a rejection of Prospero's moral order rather than a lack of one. Caliban's famous retort—"You taught me language, and my profit on't / Is, I know how to curse"—suggests that the "gift" of culture was actually a tool of enslavement. His violence, then, is not inherent monstrosity but a political response to dispossession. Yet, the play refuses to let this justification fully absolve him. The tension remains: Caliban is both a legitimate heir to the island and a would-be rapist. Shakespeare forces us to hold these contradictory truths simultaneously, whereas Montaigne's essay seeks to resolve the contradiction in favor of the native.

  Gonzalo's Montaignian speech serves as the philosophical fulcrum of this tension. When Gonzalo imagines a commonwealth with "no sovereignty," "no occupation," and "no riches," he is articulating the ideal of natural innocence that Montaigne attributes to the Tupinambá. But significantly, Gonzalo is mocked by Antonio and Sebastian, who represent the Machiavellian realpolitik of Europe. They laugh at the idea of a world without mastery. This interaction foreshadows the fate of Caliban. The Montaignian ideal is presented as a beautiful dream, but one that is powerless against the ambition of men like Antonio. Furthermore, Caliban himself, when he encounters Stephano and Trinculo, does not recreate Montaigne's noble society; he immediately submits to a new master, worshipping Stephano for his bottle of wine. This is a devastating critique of the "noble savage" trope. It suggests that the damage of colonization is not just physical but spiritual; the native has been so degraded that he seeks a new idol rather than freedom. If Montaigne argues that the savage is free from the corruption of civilization, Shakespeare shows us a savage corrupted by the very contact Montaigne ignores.

  However, to say the play simply refutes Montaigne would be to ignore Caliban's poetic interiority. In Act III, Scene 2, Caliban delivers the play's most beautiful speech: "Be not afeard; the isle is full of noises, / Sounds and sweet airs, that give delight and hurt not." Here, Shakespeare vindicates the Montaignian refusal to write off the other. Caliban is not a brute; he is an aesthete, sensitive to the subtle harmonies of his world in a way the coarse Europeans (Stephano and Trinculo) cannot comprehend. This moment disrupts the "monster" label just as effectively as Montaigne's descriptions of Tupinambá honor. It proves that Caliban possesses a soul, a capacity for wonder, and a connection to the land that Prospero, with his books and staff, lacks.

  Yet, the dramatic form complicates this vindication. In an essay, Montaigne can simply assert the humanity of the cannibal. In a play, that humanity must be performed by an actor, viewed by an audience that is already conditioned to see monsters. Shakespeare makes the act of judging part of the plot. We watch Stephano and Trinculo look at Caliban and see a fish or a commodity. We watch Prospero look at Caliban and see a slave. We watch Miranda look at him and see a villain. The play suggests that the "truth" of Caliban is not an objective fact waiting to be discovered (as Montaigne might hope), but a relational dynamic. Caliban is monstrous *to Prospero* because Prospero needs him to be monstrous to justify his rule. He is divine *to Stephano* only because Stephano is drunk.

  This is where *The Tempest* moves beyond the philosophical debate. Montaigne's relativism is a cognitive tool: *change your perspective, and you will see the truth.* Shakespeare suggests that perspective is inextricably bound to power. You cannot simply "set aside your categories" when those categories are enforced by magic, weapons, and chains. The play demonstrates that relativism is naive if it ignores the asymmetry of the encounter. Prospero holds the power to name Caliban. When Prospero calls him a "tortoise" or a "liar," that definition sticks because Prospero controls the reality of the island. Montaigne writes as an equal observer; Prospero acts as a god.

  So, does the play suggest the project of judging another culture is the problem Montaigne diagnosed? Yes, but it adds a tragic dimension. Montaigne diagnoses the problem as pride; Shakespeare diagnoses it as fear and guilt. Prospero knows he has usurped Caliban ("this thing of darkness I / Acknowledge mine"). His harshness is a defense mechanism against his own illegitimacy. The play suggests that we judge the other harshly not just because we are parochial, but because their existence threatens our moral self-image. To acknowledge Caliban's full humanity is to acknowledge Prospero's tyranny.

  Ultimately, *The Tempest* adds to the debate what only drama can provide: consequence and embodiment. Montaigne's essay ends with a recommendation for tolerance and self-skepticism. *The Tempest* ends with a resolution that requires the surrender of power. Prospero's famous abjuration—"I'll break my staff, / Bury it certain fathoms in the earth"—is the dramatic equivalent of Montaigne's skepticism, but it is far more costly. Montaigne can lay down his pen; Prospero must lay down his magic, leaving himself vulnerable to the very people he oppressed.

  The play suggests that true relativism is not an intellectual stance but a political act. It requires the colonizer to give up the tools that make him superior. Caliban's final line, "I'll seek for grace," is ambiguous. Is he submitting, or is he acknowledging a mutual humanity? The play leaves this unresolved, refusing the neat closure of the essay.

  In conclusion, *The Tempest* does not reject Montaigne's cultural relativism, but it dramatizes the immense difficulty of practicing it in a world defined by inequality. Montaigne shows us that the "savage" is a mirror; Shakespeare shows us that the mirror is often cracked by violence. The play argues that we cannot simply think our way into seeing the other clearly. We must endure the discomfort of their gaze, the threat of their difference, and the weight of our own history. Where Montaigne offers a corrected view of the Tupinambá, Shakespeare offers a wounded relationship between Prospero and Caliban. The play's contribution to the philosophical debate is the insistence that recognizing the humanity of the other is not a matter of correct description, but of risky engagement. It reveals that the barrier to relativism is not a lack of information, but a refusal to relinquish the safety of our own supremacy. In the theater, unlike the essay, the "other" talks back, curses, and demands a response that philosophy alone cannot script.
