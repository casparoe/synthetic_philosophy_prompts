      *   *Refinement on "Hallucination":* Highlight that "hallucination" implies a sensory apparatus that is malfunctioning. A better term from the skeptical view would be "stochastic parroting" or "syntactic drift."
      *   *Refinement on RLHF:* RLHF bridges the gap slightly. It aligns the model with human *judgments* of truth. So the model refers to *human consensus*, not reality directly. This is a crucial distinction.

