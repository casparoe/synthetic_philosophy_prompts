  - "The clincher"
  Ask about **Supersymmetry (SUSY) searches at the LHC**. Like dark matter, SUSY makes specific predictions but has faced decades of null results. If she calls SUSY science, she prioritizes testability (Rule 1). If she calls it pseudoscience due to consistent failure, she prioritizes predictive success (Rule 2). This isolates if "being wrong" disqualifies a field.
