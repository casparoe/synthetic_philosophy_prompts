answer: |-
  Your intuition is spot on, and your friend's summary contains a significant category error that is common when people first encounter Quine. While your friend correctly identifies Quine's **ontological naturalism**, they incorrectly project that naturalism onto **meta-ethics**.

  If you were to bring this to a Quine scholar, they would tell you that your friend has conflated "explaining the origin of moral beliefs" with "validating the truth of moral beliefs."

  Here is a breakdown of what your friend got right, where the reading goes off the rails, and how to accurately state Quine's position.

  ### 1. What Your Friend Got Right
  Your friend is correct on the broad strokes of Quine's metaphysics and epistemology:
  *   **No First Philosophy:** Quine famously rejects the idea that philosophy can sit in judgment of science from a priori grounds. We must use science to investigate the world, including ourselves.
  *   **Naturalism:** Quine believes that humans are natural objects within the physical world. Therefore, psychology, biology, and evolution are the correct tools to explain *why* humans behave the way they do.
  *   **Evolutionary Explanation:** Quine agrees that our moral sentiments (like altruism or indignation at lying) are products of natural selection and social conditioning. Science can explain the *causal history* of why we value things.

  ### 2. Where the Summary Fails (The Misreadings)
  The critical error lies in the jump from "science explains morality" to "moral claims are scientific truths."

  **A. The Is-Ought Distinction**
  Your friend claims Quine thinks "lying is wrong" is an empirical claim about consequences. Quine explicitly rejects this. In his essay *"On the Nature of Moral Values"* (1981), Quine aligns himself with Hume and the logical positivists (like Ayer) on this specific point. He maintains the **fact/value distinction**.
  *   **Science** deals with what *is* (truth-apt statements, observation, prediction).
  *   **Ethics** deals with what *ought to be* (imperatives, sentiments, social nurturing).
  Quine argues that you cannot derive the normative force of "wrong" simply from the empirical fact of "bad consequences."

  **B. Evolution Justifies Nothing**
  Your friend claims: *"The reason we think helping others is right is that altruism got selected for, and that biological fact is what makes the moral claim true."*
  This is a classic **genetic fallacy**. Quine would say evolution explains why we *have* the sentiment that altruism is good, but it does not make the statement "altruism is good" objectively true in the way "water is H₂O" is true. For Quine, evolutionary success is a matter of survival, not moral validation.

  **C. Scientific Realism about Morality**
  This is the biggest error. Quine is a **scientific realist** about electrons, sets, and physical objects (because they are indispensable to our best scientific theories). He is **not** a realist about moral properties.
  *   For Quine, to be "real" in the robust sense is to be the value of a bound variable in our best *scientific* theory.
  *   Moral values do not appear in physics or biology equations. They appear in sociology and psychology as *data points* (i.e., "people believe X is wrong"), but "wrongness" itself is not a property Quine thinks exists in the world.

  ### 3. Does the Conclusion Follow?
  **No.** The conclusion that "Quine is a scientific realist about morality" does not follow from his naturalism.
  Quine's naturalism is **methodological**: it means we use science to investigate the world. It does not mean that *every* human discourse (like poetry, logic, or ethics) reduces to empirical hypothesis testing.
  *   Logic, for Quine, is central to the web of belief but not empirical.
  *   Ethics, for Quine, is peripheral to the web of belief and rooted in sentiment, not empirical truth.

  ### 4. The Careful Statement of Quine's Actual View
  If you want to state Quine's view accurately in a way that would satisfy a philosopher, you should frame it as **Naturalistic Non-Cognitivism** (or a Humean Expressivism grounded in naturalism).

  Here is the nuanced position:

  1.  **Moral Statements Lack Truth Conditions:** Moral sentences (e.g., "Lying is wrong") are not descriptions of reality that can be true or false in the scientific sense. They are more like commands or expressions of sentiment ("Don't lie!" or "Boo lying!").
  2.  **The Role of Science:** Science can tell us how moral sentiments arose (evolution) and how they function in society (sociology). It can tell us that lying causes social friction. But science cannot tell us that social friction is *morally bad* without presupposing a prior value (e.g., "social stability is good").
  3.  **Pragmatic Truth:** Quine sometimes allows that moral statements can be called "true" in a deflated, pragmatic sense—if they cohere with our broader web of beliefs and serve our social purposes. But this is not **realism**; it is not saying "wrongness" is a feature of the universe like mass or charge.
  4.  **The Humean Legacy:** Quine explicitly writes: *"The Humean distinction between fact and value is, in my judgment, valid and important. I do not see how... moral values can be accommodated within a naturalistic worldview"* if that means treating them as facts.

  ### How to Push Back
  You can tell your friend:
  > "You're right that Quine is a naturalist who thinks we need science to understand human behavior. But Quine explicitly distinguishes between **explaining** why we have moral values and **validating** them as true. He thinks science explains the *cause* of our altruism (evolution), but he doesn't think that makes altruism objectively 'true' in the way gravity is. Quine actually sides with Hume here: science deals with facts, ethics deals with sentiments. So Quine isn't a moral realist; he's a naturalist who thinks morality is a human projection, not a scientific discovery."

  ### Summary Table for Your Argument

  | Claim | Friend's Version | Quine's Actual View |
  | :--- | :--- | :--- |
  | **Naturalism** | Ethics is a branch of science. | Ethics is a human practice studied *by* science. |
  | **Moral Claims** | Empirical hypotheses about welfare. | Expressions of sentiment / Social imperatives. |
  | **Truth Value** | Moral claims are True/False like physics. | Moral claims lack scientific truth conditions. |
  | **Evolution** | Evolution *justifies* moral truths. | Evolution *explains the origin* of moral feelings. |
  | **Meta-Ethics** | Moral Realism. | Non-Cognitivism / Expressivism (Humean). |

  Your skepticism was well-founded. Your friend applied Quine's epistemology to an area where Quine specifically withheld it.
