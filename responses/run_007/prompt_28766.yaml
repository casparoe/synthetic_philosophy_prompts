prompt: |-
  So I got into a long argument last night with a friend about whether morality is objective, and at one point he brought up Quine to back up his side. His summary was something like: Quine is a naturalist, so he thinks there's no first philosophy and ethics has to be done from inside science like everything else. That means a moral claim like "lying is wrong" is just an empirical claim: it predicts that lying has bad consequences for people, and you test it the same way you test any scientific hypothesis. That's also why Quine makes such a big deal about evolution — the reason we think helping others is right is that altruism got selected for, and that biological fact is what makes the moral claim true. So Quine turns out to be a scientific realist about morality: moral questions are just ordinary empirical questions about welfare and our evolved dispositions.

  I have a vague sense this is off. I thought Quine was more skeptical about morality then that — like he thought science can explain why we have the values we have but doesn't settle wich ones are right. But my friend was really confident and I didn't know enough to push back. Which parts of his summary would someone who actually works on Quine accept, which parts are subtle misreadings, and does his conclusion that Quine is a scientific realist about morality actually follow from the accurate parts? If the summary is wrong, what's the more careful way to state Quine's actual view on moral values?
