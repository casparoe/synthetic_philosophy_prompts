answer: |-
  **JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF GENETIC "INFORMATION"**
  **Drafted by the Adversarial Collaboration on Biological Semantics (ACBS)**
  **Date:** October 26, 2023
  **Signatories:** Representing the Informationalist/Realist Camp (IR) and the Mechanistic/Deflationist Camp (MD)

  ***

  ### 1. Points of Consensus

  We, the undersigned, agree to the following scientific and philosophical premises as the baseline for our continued discourse. We acknowledge that our disagreement lies in interpretation and ontology, not in the underlying biochemistry.

  1.  **Chemical Reality:** We agree that DNA is a physical polymer consisting of a sugar-phosphate backbone and four nitrogenous bases (A, T, C, G), stabilized by hydrogen bonding and base stacking, and that its replication and transcription are driven by thermodynamics, enzyme kinetics, and stereochemical affinity.
  2.  **Shannon Information:** We agree that DNA sequences possess *Shannon information* (reduction in uncertainty) and can be quantified in bits. This is a mathematical property of the sequence distribution, not a claim about meaning.
  3.  **The Codon Mapping:** We agree that the mapping between triplet codons and amino acids is mediated by the ribosome, tRNAs, and aminoacyl-tRNA synthetases. We agree that this mapping is largely (though perhaps not entirely) arbitrary with respect to the direct stereochemical affinity between the codon and the amino acid (the "Frozen Accident" vs. "Stereochemical" hypothesis distinction does not alter the consensus that the *current* system functions via adaptor molecules).
  4.  **Causal Closure:** We agree that no "vital force" or non-physical agent intervenes in protein synthesis. All causal work is performed by physical interactions. The dispute is whether describing these interactions as "reading a code" adds explanatory power or merely obscures the physics.
  5.  **Metaphor is Inevitable:** We agree that all scientific language relies on metaphor and analogy. The question is not whether "code" is a metaphor (it is), but whether it is a *dead* metaphor (merely decorative) or a *live* metaphor (referencing a real, distinct causal category).
  6.  **Teleonomy:** We agree that biological systems exhibit *teleonomy* (apparent purpose derived from natural selection) without requiring conscious intent. We disagree on whether teleonomy is sufficient to ground *semantic* content.

  ***

  ### 2. Residual Disagreements

  | Issue | Informationalist/Realist Camp (IR) | Mechanistic/Deflationist Camp (MD) |
  | :--- | :--- | :--- |
  | **Ontology of Meaning** | The genome carries *semantic* information (truth conditions, reference) intrinsic to the biological system, independent of human observers. The cell is an interpreter. | "Meaning" is a property of human language games. Attributing semantics to DNA is a category error; there is only causal correlation and structural complementarity. |
  | **Arbitrariness** | The arbitrariness of the codon table (signifier vs. signified) is the defining feature of a code. Because chemistry does not dictate the mapping, it is symbolic. | The arbitrariness is historical, not ontological. The machinery enforcing the mapping is purely chemical. A "convention" requires a community of agents, which a single cell lacks. |
  | **Explanatory Utility** | Using "information" terminology allows for generalizations across substrate (e.g., neural, genetic, digital) that mechanistic language misses. It captures the *control* architecture. | "Information" language invites dualism and obscures the actual mechanisms. It encourages "just-so" stories about optimization rather than mechanistic tracing. |
  | **The "Reader"** | The translational machinery (ribosome/tRNA) functions as a *reader* that decodes syntax into semantics. This functional role is distinct from the physical substrate. | The translational machinery is a *catalyst*. Calling it a "reader" anthropomorphizes a molecular machine. It binds substrates; it does not "interpret" them. |

  ***

  ### 3. The Cruxes

  These are the specific sub-questions where resolving the uncertainty would significantly shift the consensus of at least one camp.

  **Crux A: The Substrate Independence Test**
  *   **Question:** If the same logical "program" (phenotype outcome) could be instantiated in a radically different physical substrate (e.g., silicon, non-carbon chemistry) using the same genetic logic, would that prove the "code" is a real, distinct layer from the chemistry?
  *   **Why it matters:** IR argues code is substrate-independent; MD argues biology is inherently substrate-dependent.

  **Crux B: The Origin of Arbitrariness**
  *   **Question:** If it were proven that the genetic code was *not* arbitrary (i.e., direct stereochemical affinity between codons and amino acids drove the initial selection entirely, with no "frozen accident"), would the term "code" still apply?
  *   **Why it matters:** IR relies on arbitrariness to distinguish "symbol" from "stamp." MD argues arbitrariness is irrelevant to the physical causation.

  **Crux C: The Observer Requirement**
  *   **Question:** Does semantic information require an external observer (human scientist) to exist, or does the biological system itself constitute a "self-interpreting" system?
  *   **Why it matters:** IR argues the cell interprets its own DNA. MD argues "interpretation" is a description applied *by us*, not a process *in* the cell.

  ***

  ### 4. Adjudicating Scenarios (Tests & Predictions)

  For each Crux, we propose a scenario (empirical or thought experiment) where both sides agree on what the outcome would imply.

  | Crux | Scenario / Test | IR Prediction (If True) | MD Prediction (If True) |
  | :--- | :--- | :--- | :--- |
  | **A: Substrate Independence** | **Synthetic Orthogonal Life:** We create a viable organism using a completely synthetic 6-base pair system with non-natural amino acids, where the mapping is explicitly designed by humans but maintained by evolution. | **Supports IR:** Demonstrates that the "logic" of the genome is separable from the specific chemistry of DNA. The "code" is the invariant layer. | **Supports MD:** Merely shows humans can engineer new chemical pathways. The "code" is still just a description of the new chemical binding rules we engineered. |
  | **B: Origin of Arbitrariness** | **Prebiotic Chemistry Discovery:** We discover a pre-RNA world mechanism where specific triplets *directly* catalyze the binding of their specific amino acids without tRNA/adaptors (direct stereochemical coding). | **Weakens IR:** If the mapping is physically determined by chemistry, the "symbolic" nature of the code dissolves into mere chemical affinity. | **Strengthens MD:** Confirms that "genetic coding" is just a complex extension of direct chemical binding. No "symbol" was ever needed. |
  | **C: The Observer** | **AI Modeling:** An AI discovers biological laws from raw physical data (particle positions/velocities) without being trained on biological concepts (gene, code, function). | **Supports IR:** If the AI independently posits an "information layer" to compress the data efficiently, it suggests the layer is objectively real. | **Supports MD:** If the AI models the system perfectly using only physics/chemistry terms without positing "information," it suggests "code" is a human compression artifact. |

  ***

  ### 5. Flagging Verbal Disputes

  The Collaboration identifies the following portion of the dispute as **Purely Verbal** (terminological rather than substantive):

  *   **The Definition of "Real":** When IR asks "Is the code *really* real?" and MD says "No, only atoms are real," they are often using different definitions of ontological commitment.
      *   *IR Definition:* "Real" = "Causally relevant and abstractable from substrate." (Like a software program is real, even if it runs on hardware).
      *   *MD Definition:* "Real" = "Fundamental physical constituent." (Only the hardware is real; the software is a description).
      *   **Resolution:** We agree to stop using the word "real" without qualification. We will instead ask: "Is the information-theoretic description *indispensable* for a complete causal explanation of the system?"

  *   **The Definition of "Mechanism":**
      *   *IR Usage:* Often implies "blind physical push-pull" (excluding control logic).
      *   *MD Usage:* Includes all causal processes, including feedback loops and regulatory networks.
      *   **Resolution:** We agree that "mechanism" includes all physical causal chains. The dispute is whether "information processing" is a distinct *type* of mechanism or just a *description* of a mechanism.

  **Closing Remark:**
  We acknowledge that as long as we agree on the biochemistry (Section 1), the remaining disagreement is primarily about the *vocabulary of explanation*. We commit to specifying whether we are making claims about *causal power* (physics) or *explanatory strategy* (heuristics) in future correspondence.

  ***
  **Signed,**
  *The Informationalist Working Group*
  *The Mechanistic Working Group*
