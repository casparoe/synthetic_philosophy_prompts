answer: |-
  ### 1. The Phenomena

  Human agents deviate systematically from ideal rationality, and an adequate formal model must capture three core deviations from classical epistemic logic. First, **ignorance of consequences**: an agent may believe the axioms of arithmetic without believing Fermat's Last Theorem, despite the latter being a logical consequence. This is not mere error; it is computational limitation. Second, **awareness limitations**: an agent cannot entertain propositions containing concepts they have never encountered (e.g., a medieval peasant cannot believe propositions about 'quarks'). Belief requires conceptual grasp. Third, **inconsistency tolerance**: agents often hold contradictory beliefs (e.g., the Preface Paradox, where an author believes each claim in their book but also believes at least one is false) without thereby believing every proposition (explosion). 

  Finally, models must distinguish between **active derivation** and **passive storage**; believing $P$ and $P \to Q$ does not guarantee $Q$ is currently believed, only that it *should* be. The model must represent the state of having not yet computed a consequence, distinct from the state of being unable to compute it. This requires separating the *process* of reasoning from the *state* of belief. Without capturing these phenomena, a model describes an ideal god, not a bounded agent.

  ### 2. The Desiderata

  1.  **Non-Omniscience (Non-negotiable):** $\vdash \phi \nRightarrow \vdash B\phi$. Agents do not believe all validities. *Case:* No human knows all tautologies of propositional logic. *Status:* Essential for any bounded agent model.
  2.  **Failure of Full Closure (Non-negotiable):** $B\phi, \phi \vdash \psi \nRightarrow B\psi$. Belief is not closed under logical consequence. *Case:* Knowing axioms $\neq$ knowing theorems. *Status:* Essential; without this, computational limits are ignored.
  3.  **Local Closure / Easy Inferences (Non-negotiable):** $B\phi, B(\phi \to \psi) \Rightarrow B\psi$ (ceteris paribus). Agents perform simple Modus Ponens. *Case:* If I believe it's raining and rain implies wetness, I believe it's wet. Denying this makes agents irrational. *Status:* Essential to preserve minimal rationality.
  4.  **Explicit vs. Implicit Distinction (Non-negotiable):** Model must separate stored beliefs from derivable consequences. *Case:* Database storage vs. query results. *Status:* Essential to explain why agents don't believe everything they imply.
  5.  **Awareness Constraint (Non-negotiable):** $B\phi \to A\phi$. One cannot believe what one is unaware of. *Case:* Cannot believe 'quarks exist' without concept 'quark'. *Status:* Essential for conceptual realism.
  6.  **Inconsistency Tolerance (Non-negotiable):** $B\phi, B\neg\phi \nRightarrow B\psi$. Contradictions do not explode. *Case:* Preface Paradox. *Status:* Essential for realistic doxastic states.
  7.  **Resource Sensitivity (Camp-specific: Computationalists):** Inference cost must map to cognitive load. *Case:* AI memory limits. *Status:* Preferred by AI researchers; often ignored by pure epistemologists who focus on static states.
  8.  **Idealization Convergence (Camp-specific: Traditionalists):** As resources $\to \infty$, model should approach logical omniscience. *Case:* Normative rationality. *Status:* Contested; some argue boundedness is fundamental, not asymptotic, making this requirement undesirable.

  ### 3. Tensions

  The central tension lies between **Local Closure**, **Failure of Full Closure**, and **Single-Operator Semantics**. If a model uses a single belief operator $B$ governed by standard Kripke semantics, it validates Full Closure (via possible worlds inclusion). To satisfy Non-Omniscience, one must abandon standard semantics. However, abandoning semantics risks losing Local Closure; if $B$ doesn't distribute over implication, how do we guarantee Modus Ponens? This creates a trilemma: you can have semantic elegance (Possible Worlds), Non-Omniscience, or Rational Closure, but typically not all three.

  Furthermore, **Explicit Belief** conflicts with **Consistency**. If explicit belief is closed under single-step inference, and the agent holds $P$ and $\neg P$, triviality follows unless inference rules are restricted. Restricting rules too heavily violates Local Closure. Thus, the subset {Explicit Belief, Full Rationality, Consistency} is jointly unsatisfiable for bounded agents. Models must choose whether to sacrifice the semantics (Impossible Worlds), the operator structure (Awareness Logic), or the rationality constraints (Syntactic Models). The most difficult joint satisfaction is maintaining a possible-worlds semantics while denying closure under logical equivalence.

  ### 4. The Load-bearing Requirement

  The single requirement that excludes the most familiar approaches is **Failure of Closure under Logical Implication** (Desideratum 2). Standard Possible Worlds models (Hintikka-style) define belief as truth in all doxastically accessible worlds. By definition, if $\phi$ is true in all accessible worlds, and $\phi \to \psi$ is valid, $\psi$ is true in all accessible worlds. This validates $B\phi \to B\psi$ whenever $\vdash \phi \to \psi$. This semantic structure makes logical omniscience inevitable. To satisfy Non-Omniscience, one must either fragment the worlds (Impossible Worlds), add syntactic filters (Awareness), or abandon possible worlds entirely (Syntactic). Thus, demanding that agents fail to know consequences kills the standard Kripke framework immediately.

  ### 5. Scorecard

  *   **Standard Possible-Worlds:** Fails Non-Omniscience, Fails Awareness, Fails Inconsistency Tolerance. Passes Semantic Elegance. *Verdict:* Inadequate for bounded agents; treats agents as ideal reasoners.
  *   **Syntactic Models:** Passes Non-Omniscience, Passes Explicit/Implicit, Passes Inconsistency. Fails Semantic Elegance (no possible worlds). *Verdict:* Psychologically realistic but logically opaque; lacks modal structure for counterfactuals.
  *   **Awareness Models (Fagin/Halpern):** Passes Non-Omniscience (via explicit belief), Passes Awareness. Keeps Implicit Closure (standard worlds). *Verdict:* Good hybrid, but splits belief into two operators, complicating the ontology and interaction rules.
  *   **Impossible-Worlds Models:** Passes Non-Omniscience, Passes Inconsistency. Fails Logical Structure (worlds can violate logic). *Verdict:* Flexible but risks losing normative force of logic; "anything goes" risk makes validity hard to define.
  *   **Deductive Closure Models:** Passes Local Closure. Fails Non-Omniscience. *Verdict:* Only works for ideal agents; useless for engineering bounded cognition.
