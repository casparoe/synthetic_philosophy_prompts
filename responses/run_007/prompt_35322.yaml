      *   **Position:** The user holds that CPA is a *substantive constraint on rational belief* (normative claim), not just a modeling convention. Rational disagreement *must* be due to information differences. Agreement/No-Trade theorems provide the normative force.
      *   **Goal:** They want to know what would count *against* this view. They want a sorted list (decisive to awkward) of formal results, models, or foundational arguments. They want to know how a defender would react (concede vs. re-describe). They are concerned about unfalsifiability/insulation.
