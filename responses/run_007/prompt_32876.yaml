      *   *Do Binding ADs make sense?*
          *   Strictly speaking, *no*. You cannot bind a different person.
          *   *Nuance:* Parfit suggests we care less about strict identity and more about relations. We might still honor the AD out of respect for the *previous* person's wishes, but it becomes a moral weight, not a binding right. It becomes a "precedent autonomy" that competes with the "current welfare" of the successor.
