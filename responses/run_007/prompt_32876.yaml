answer: |-
  The practice of enforcing binding advance directives (ADs) in cases of severe dementia rests upon a specific, often unexamined, metaphysical and ethical architecture. It resolves the conflict between a past competent self and a present incompetent self by prioritizing the former. To understand why this is permissible—and what happens if we change the underlying theory of identity—we must reconstruct the concepts of autonomy and personal identity that support the current legal and bioethical consensus.

  ### I. The Presupposed Theory: Narrative Identity and Critical Interests

  The standard practice of treating advance directives as binding presupposes a theory of personal identity based on **numerical continuity** (often biological or legal) rather than psychological connectedness. Legally, the human organism that signed the directive is the same entity as the patient with dementia. Because they are the "same person," the rights and liberties exercised by the competent self extend temporally into the incompetent phase.

  Ethically, this practice relies heavily on Ronald Dworkin's distinction between **experiential interests** and **critical interests**.
  *   **Experiential interests** concern immediate quality of life (pleasure, pain, contentment). The demented self possesses these; if they appear content, their experiential interests are being met.
  *   **Critical interests** concern the integrity of a life as a whole. These are values that define what makes a life successful or dignified from a narrative perspective (e.g., "I do not want to live in a vegetative state," or "I want every effort made to preserve my life").

  The binding AD practice presupposes that **critical interests trump experiential interests**. It assumes that autonomy is not merely the capacity to choose in the moment, but the capacity to shape the narrative arc of one's life. By this view, the competent self is the "author" of the life story, and the demented self is merely a character in the final chapters. To ignore the AD is to allow the character to rewrite the ending in a way that violates the author's intent, thereby destroying the integrity of the whole life. Therefore, the earlier self has authority over the later self precisely **because they are the same person**, and the moral unit of concern is the *whole life*, not the *momentary self*.

  ### II. Same Person vs. Different Person: The Source of Authority

  Can this practice be justified if we view the later self as a *different* person?

  If the demented individual is considered a distinct person from the one who wrote the directive, the authority of the AD collapses under the weight of liberal individualism. Autonomy is inherently self-regarding; one person cannot exercise autonomy over another. If the demented patient is a "new" person, the prior directive is merely the wish of a stranger regarding the new person's body.

  To justify binding ADs on a "different person" view, one would have to abandon autonomy as the justification and rely on **utilitarian or proprietary arguments**:
  1.  **Resource Allocation:** Society enforces ADs to ensure resources aren't wasted on unwanted treatments, regardless of the current patient's status.
  2.  **Family Interests:** The directive protects the family from emotional distress or financial burden.
  3.  **Property Rights:** The earlier self "owns" the body and bequeaths conditions upon its use, similar to a will.

  However, none of these justify the *moral bindingness* of the directive regarding the patient's own bodily integrity. If the later self is a different person with their own rights, force-feeding them (as per the prompt's example) because a "predecessor" demanded it would constitute assault on the current person. Therefore, the practice of *binding* ADs cannot be coherently justified on a view that treats the later self as a different person. It requires the metaphysical commitment that the self endures through cognitive decline.

  ### III. The Psychological Continuity Challenge

  What if we adopt a **psychological-continuity theory** of personal identity (associated with John Locke and Derek Parfit)? This theory holds that personal identity consists in the continuity of memory, character, intentions, and psychological connectedness.

  In severe dementia, these connections are often severed. The patient may not remember writing the directive, may not recognize their family, and may have a radically altered personality. If psychological continuity is the criterion for identity, then **severe dementia creates a succession of selves**. The "demented self" is a successor person, distinct from the "competent self" who wrote the AD.

  #### What Would Have to Change?

  If the legal and ethical framework accepted this severance thesis, the enforcement of binding ADs would require fundamental restructuring:

  1.  **From Substituted Judgment to Best Interests:**
      Currently, surrogates use "substituted judgment," attempting to decide what the *patient* would have wanted. If the patient is a different person, this is impossible. Decision-making would shift to a "best interests" standard focused solely on the *current* well-being of the demented individual.

  2.  **The Loss of Binding Force:**
      The AD would lose its status as a command. It could not morally bind the successor self. Instead, the AD would become **evidentiary**. It would serve as a guide to what the *previous* person valued, which might inform what is good for the organism, but it could be overridden by the current welfare of the successor.

  3.  **Resolution of Conflict:**
      In the prompt's scenario (AD requires feeding; current self resists), the current practice enforces feeding. Under a psychological discontinuity view, the current self's resistance (an expression of current experiential interest and bodily integrity) would carry significantly more weight. Force-feeding a contented but resisting individual to satisfy the preferences of a "dead" psychological self would be viewed as sacrificing a living person for the sake of a ghost.

  #### Would Binding Advance Directives Still Make Sense?

  Strictly speaking, **no**. If the selves are different, "precedent autonomy" is a contradiction in terms. You cannot have autonomy over a future person who is not you.

  However, a modified version of ADs could still make sense under a Parfitian reductionist view, though they would function differently:
  *   **Moral Weight, Not Moral Veto:** The prior self's wishes would hold moral weight because of the historical relationship between the selves, but they would not constitute a veto over the successor's welfare.
  *   **Ulysses Contracts:** We might still allow ADs for practical reasons (e.g., to prevent the successor self from making dangerous choices), but these would be justified as paternalistic protections for the successor, or as social contracts, rather than exercises of the predecessor's autonomy.
  *   **The "Contented Dementia" Problem:** In cases where the demented self is happy (experiential interests met) but the AD demands life-prolonging treatment that causes distress (resistance), the discontinuity view would likely prioritize the current happiness. The "integrity of the life story" matters less than the "reality of the current experience" when the link between the storyteller and the experiencer is broken.

  ### Conclusion

  The practice of enforcing binding advance directives in severe dementia presupposes a **narrative theory of identity** where the self is a unified entity extending across time, and where **critical interests** (life values) dominate **experiential interests** (current feelings). It relies on the metaphysical claim that the competent author and the demented character are the same person.

  If we shift to a **psychological-continuity theory** that views severe dementia as severing personal identity, the moral authority of the earlier self evaporates. The earlier self becomes a stranger with no right to command the later self's body. Consequently, advance directives would cease to be binding legal commands and would become advisory documents weighed against the current best interests of the new psychological entity. In the specific case of a resisting, demented patient, the discontinuity view would likely prohibit enforcing the directive, prioritizing the protection of the vulnerable, present person over the abstract values of the past one.
