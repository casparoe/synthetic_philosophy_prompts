          *   *Conclusion:* It is very hard to justify *binding* ADs on a "different person" view without violating the new person's rights. You might follow the AD as a *guide* to best interests, but not as a binding autonomous command. So, the practice *presupposes* the "Same Person" view to maintain the *binding* nature.

