  2.  **Part 1: The Presupposed Theory (Standard Bioethical/Legal View):**

      *   *Autonomy:* This view relies heavily on **Critical Interests** (Ronald Dworkin). The competent self has a narrative view of their life. Their values define the integrity of the whole life story.
      *   *Personal Identity:* It presupposes a **Numerical Identity** view (often biological or legal continuity). As long as the human organism is the same, the person is the same. The "self" that wrote the AD and the "self" in dementia are legally and morally the *same entity*.
      *   *Authority:* The earlier self has authority because autonomy is an extended temporal capacity. To respect autonomy is to respect the *life plan*, not just the momentary desire.
      *   *Key Philosopher:* Ronald Dworkin (*Life's Dominion*). He argues for the integrity of the narrative.

  3.  **Part 2: Same Person vs. Different Person:**

      *   *Same Person View:* This is the standard legal view. If they are the same person, the prior competent decision binds the later incompetent state. It's like making a contract with your future self.
      *   *Different Person View:* Can we justify binding ADs if we think the demented self is a "new" person?
          *   *Justification:* Maybe based on resource allocation? Maybe based on preventing harm to the *family*? Maybe based on a "best interests" standard that defers to prior wishes as evidence of what was good for the organism?
