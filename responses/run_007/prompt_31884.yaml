      6.  Tie-Breaker: Voluntary Slavery or Euthanasia for non-terminal (pure autonomy vs. sanctity of life). Let's go with Voluntary Slavery as the classic jurisprudence test.

      *(Wait, one more check on the Incest case)*: She upheld it for "family roles." This suggests she cares about social institutions. PAS affects the institution of Medicine. This leans toward a Ban.
