      *   *Alternative:* **Public Nudity/Offensive Art.** Pure offense vs. harm.

      *   *Wait, let's look closer at the Duelling case.* She said "society can't let people agree to kill each other." This is the key. If PAS is "killing," she might ban it. If PAS is "letting die/autonomy," she might allow it.
      *   *Better Tie-Breaker:* A case that isolates the "Moral Disgust" variable. She rejected disgust in Incest. So, a case based *only* on disgust would reveal her true colors.
      *   *Actually, the prompt asks to settle Hart vs. Devlin.* Devlin says society can enforce morality even without harm. Hart says no.
      *   *Tie-Breaker:* **Private, consensual, non-commercial polygamy.** No exploitation (assumed), no harm to children (assumed), but violates shared moral structure of marriage. If she bans it -> Devlin. If she allows it -> Hart.

      *   *Let's stick to the Slavery example.* It tests the limits of consent, which is the crux of the PAS debate.

  8.  **Final Polish:** Ensure the tone is analytical, respectful of the jurisprudence, and directly answers the prompt's specific requirements (Candidate Rules, Predictions, Analogs, Underdetermination, Tie-Breaker).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "She's moderate." I need to articulate the *jurisprudential* tension. The tension is between **Harm/Exploitation** (which justifies Kidney/Incest bans) and **Moral/Structural Integrity** (which justifies Duelling bans). PAS sits right in the middle. Is it exploitation (Kidney) or structural integrity (Duelling)?

      *Revised Plan:*
