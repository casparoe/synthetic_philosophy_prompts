  4.  **Determine the Grading Criteria (Philosophy of Mind Upper-Level):**
      *   **Accuracy of Exegesis:** Did they get the philosophers' views right? (Malcolm: Yes. Dennett: No, significant error).
      *   **Argument Reconstruction:** Is the logic clear? (Malcolm: Yes. Dennett: Flawed due to misinterpretation).
