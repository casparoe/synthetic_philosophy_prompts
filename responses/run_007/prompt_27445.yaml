answer: |-
  Here is the audit of your friend's "Fisherman's Net" argument against Wigner.

  ### 1. The Correspondence Table

  Your friend is deploying a variation of **Arthur Eddington's Net** (from *The Philosophy of Physical Science*, 1939). Here is how the mapping is intended to work in his argument:

  | The Analogy | The Physics Context |
  | :--- | :--- |
  | **The Sea** | Reality / The Universe (ontological truth) |
  | **The Fish** | Physical Phenomena / Laws of Nature |
  | **The Net** | Mathematical Formalism / Human Logic |
  | **The Mesh Size** | The limits of what is mathematically expressible or computable |
  | **The Fisherman** | The Physicist / The Scientific Community |
  | **The Catch** | Successful Physical Theories |
  | **The Conclusion** | "Nature is mathematical" is an artifact of the tool, not a property of reality. |

  ### 2. Where the Mapping Breaks (Disanalogies)

  To audit the argument, we must separate the *structural* flaws from the *surface* flaws.

  **A. Decorative Disanalogies (Do not impact the logic)**
  *   **Materiality:** A net is physical; math is abstract. (Irrelevant to the selection effect argument).
  *   **Intent:** A fisherman wants food; a physicist wants truth. (Both are agents seeking a specific subset of the sea).
  *   **Damage:** A net might tear; math might be inconsistent. (Both imply limits, so the analogy holds here).

  **B. Critical Disanalogies (Undermine the conclusion)**
  These are the points where the analogy fails to capture the specific mystery Wigner identified.

  1.  **Passive Filter vs. Active Mold:**
      *   *Analogy:* A net is passive. It lets water through and keeps fish. It does not *shape* the fish.
      *   *Reality:* Mathematics often *precedes* the physics. We develop complex algebra or geometry for purely internal mathematical reasons (no fish in mind), and decades later find they describe physical reality perfectly. A net doesn't spontaneously reshape itself to fit fish that haven't been discovered yet; math often does.
  2.  **Observation vs. Prediction:**
      *   *Analogy:* The net tells you what fish are currently in the sea.
      *   *Reality:* Math predicts fish that *should* exist but haven't been seen (e.g., the positron, the Higgs boson, black holes). A selection effect explains why we only *see* mathematical fish; it does not explain how the net tells us where *uncatched* fish are hiding.
  3.  **Uniformity vs. Isomorphism:**
      *   *Analogy:* A net catches all fish of a certain size equally.
      *   *Reality:* Math catches *disparate* phenomena with the *same* mesh. The same differential equations describe heat diffusion, stock market fluctuations, and neutron propagation. A 2-inch mesh catches cod and haddock, but it doesn't explain why cod and haddock are made of the exact same atomic arrangement. Wigner's point is about the *unity* of the catch, not just the size.
  4.  **Precision:**
      *   *Analogy:* If the mesh is 2 inches, you catch a 2.1-inch fish and a 10-inch fish equally well.
      *   *Reality:* Math doesn't just "catch" the phenomenon; it fits it to 12 decimal places (e.g., QED). A net is a binary filter (in/out); math is a high-resolution mold. A selection effect explains why we don't use non-mathematical theories; it doesn't explain why the mathematical ones work *unreasonably well*.

  ### 3. Does the Conclusion Survive?

  Your friend's conclusion is: *"It's just a selection effect, so there is nothing left to explain."*

  **The Verdict:** The conclusion **collapses**.

  Here is why: The selection effect (Eddington's point) successfully explains why we do not find *non-mathematical* laws in physics. If a phenomenon cannot be modeled mathematically, physics cannot process it. That part is true.

  However, Wigner was not asking, "Why do we only find mathematical laws?" He was asking, **"Why do the mathematical laws we find fit with such precision, unity, and predictive power, given that the math was often invented without any reference to reality?"**

  The net analogy explains the **boundary** of physics (why we stop at the limit of math), but it fails to explain the **interior structure** of physics (why the math inside the boundary is so elegant, universal, and predictive).

  If the net analogy were sufficient, we would expect our theories to be "good enough" to catch the phenomena. Instead, we find theories that are "too good"—they possess symmetries and consistencies that exceed observational requirements. A selection effect cannot account for *excess* fit.

  ### 4. A Better Analogy for Wigner

  To capture what Wigner was actually pointing at, use **The Sleepwalker Cartographer**:

  > Imagine a cartographer who draws maps in his sleep for fun, inventing coastlines and mountain ranges based purely on aesthetic rules he created himself. He never leaves his room.
  >
  > One day, he wakes up and travels to a continent no human has ever visited. He opens his sketchbook and finds that the maps he drew in his sleep match the new continent perfectly, down to the elevation of the peaks.
  >
  > **The Fisherman Analogy** says: "Of course they match; he only drew maps of things he could visit." (This is false; he drew them before visiting).
  > **Wigner's Point** says: "Why did his aesthetic rules match the geology of a place he'd never seen?"

  This captures the **independence** of mathematical development from physical observation, which the Net analogy completely erases.

  ### 5. Bottom Line

  Your friend has correctly identified an epistemic limit (we can't know what we can't model), but he is mislabeling it as an ontological explanation (therefore reality isn't inherently mathematical). He explains why we *ignore* the non-mathematical, but not why the mathematical *works*.

  \answer{conclusion collapses}
