  2.  **The Residue Report:** Clean, Fudged, Missing.
  3.  **Deep Dive: Neglectedness vs. Crowding.**
  4.  **Deep Dive: ITN vs. MVO.**
  5.  **Final Verdict.**

  *Key Insight to inject:* In finance, prices adjust to eliminate alpha. In EA, there is no price mechanism to signal neglectedness. That's the biggest structural difference.

  *Key Insight 2:* Tractability in EA includes "do we know the solution?" In finance, we assume the solution exists if the signal exists.

  *Key Insight 3:* Time horizon. Finance is usually finite horizon. EA (longtermism) is effectively perpetual.

