answer: |-
  Here is the translation of the Importance–Tractability–Neglectedness (ITN) framework into quantitative finance vocabulary, followed by the residue report and structural analysis you requested.

  ### 1. The Translation Layer

  | EA Concept | Quant Vocabulary Equivalent | Definition in Your Terms |
  | :--- | :--- | :--- |
  | **Cause Area** | **Investment Universe / Strategy Class** | A distinct set of opportunities (e.g., Global Health, AI Safety) analogous to asset classes (e.g., Equities, Vol Arb). |
  | **Importance** | **Total Alpha Pool / TAM** | The total expected value (EV) available to be captured if the problem were fully solved. It is the size of the mispricing or the notional value of the inefficiency, not the percentage return. |
  | **Tractability** | **Implementation Elasticity / Signal Decay** | The slope of the impact function. How much expected value is captured per marginal unit of capital/labor deployed before diminishing returns set in. High tractability = low market impact cost, high signal-to-noise. |
  | **Neglectedness** | **Capacity Headroom / Crowding** | The ratio of current capital/labor deployed to the Total Alpha Pool. Low neglectedness = high crowding = alpha decay due to competition. High neglectedness = high capacity for new capital without eroding returns. |
  | **ITN Score** | **Expected Risk-Adjusted SROI** | A heuristic for ranking strategies to maximize Social Return on Investment (SROI) per marginal dollar, accounting for capacity constraints. |

  ---

  ### 2. The Residue Report

  Here is where the analogy holds, where it requires fudging, and where it breaks entirely.

  #### What Translates Cleanly
  *   **Diminishing Returns (Tractability):** You are used to the idea that the first \$10M into a strategy captures the alpha, but the next \$100M moves the market against you. EA assumes the same: the first researchers into a field solve the low-hanging fruit; subsequent funding yields lower marginal utility.
  *   **Crowding (Neglectedness):** You understand that if every fund runs the same momentum factor, the premium disappears. EA argues that if all philanthropists fund visible diseases (e.g., breast cancer), the marginal life saved per dollar drops compared to a neglected disease (e.g., parasitic worms).
  *   **Portfolio Construction:** The end goal is identical: allocate limited capital across uncorrelated opportunities to maximize total output subject to risk constraints.

  #### What I Had to Fudge
  *   **Price Discovery:** In your world, prices aggregate information. If a trade is profitable, prices move until it isn't. In EA, there is **no price mechanism**. There is no "market price" for a life saved or a reduction in existential risk. You cannot look at a ticker to see if a cause is "overbought." You have to estimate intrinsic value without a market signal.
  *   **Fungibility:** In finance, \$1 profit from Stat Arb is fungible with \$1 profit from Macro. In EA, outcomes are often non-fungible. Preventing human extinction (longtermism) is not substitutable with curing malaria today, even if the "expected value" calculation says otherwise. Your utility function is linear in PnL; theirs is often lexicographic or threshold-based (e.g., "survival first").
  *   **Time Horizon:** You optimize over finite horizons (quarters, years). EA, particularly longtermism, optimizes over an **infinite horizon** (potential future generations). This breaks standard discounting models. A 0.1% reduction in existential risk has infinite expected value if the future is potentially indefinite.

  #### What Has No Counterpart
  *   **Epistemic Uncertainty vs. Risk:** You deal with risk (known distributions). EA deals with Knightian uncertainty (unknown distributions). Tractability often isn't "how hard is it to trade?" but "do we even know the solution exists?" In quant, if the signal isn't there, you don't trade. In EA, you might fund basic research just to *find* the signal.
  *   **Coordination Problems:** In finance, you hide your positions. In EA, you often want to *signal* your positions to attract coordination. Neglectedness isn't just about current crowding; it's about solving coordination failures where individual rationality leads to collective sub-optimality (e.g., AI safety races).

  ---

  ### 3. Deep Dive: Is Neglectedness Just Crowding?

  **Short Answer:** No. Crowding is a static snapshot; Neglectedness is a dynamic flow problem.

  **The Quant View (Crowding):**
  Crowding measures current positions relative to liquidity. If AUM > Capacity, alpha decays. You look at factor correlation and turnover to gauge this. It assumes other actors are rational profit-maximizers who will enter the trade if alpha exists.

  **The EA View (Neglectedness):**
  Neglectedness includes crowding, but it also models **future capital allocation elasticities** and **information asymmetries**.
  1.  **Flow Sensitivity:** If you deploy capital here, does it catalyze more capital (good) or signal the problem is "solved" causing others to leave (bad)?
  2.  **Talent vs. Capital:** In quant, capital is usually the constraint. In EA, the constraint is often *specific human capital* (e.g., AI safety researchers). A cause can be capital-neglected but talent-crowded, or vice versa. Your vocabulary treats labor as a cost; EA treats specific labor as the primary alpha-generating asset.
  3.  **Market Failure:** In finance, neglect usually implies a barrier to entry or risk you aren't compensated for. In EA, neglect often implies a **public goods problem**. The alpha (social good) cannot be captured by the investor, so rational actors *should* ignore it. Neglectedness is often a feature of the market structure, not an inefficiency to be arbitraged away.

  **Verdict:** Neglectedness is Crowding + **Public Goods Discount** + **Talent Constraint**. It points to the derivative of future allocations, but specifically in a market where the "price" (social good) cannot be captured by the allocator.

  ---

  ### 4. Deep Dive: Is ITN Just Mean-Variance Optimization (MVO)?

  **Honest Assessment:** You are smushing it into a shape it doesn't have, but the intuition is directionally correct.

  **Why it looks like MVO:**
  *   You have assets (causes).
  *   You have expected returns (importance × tractability).
  *   You have constraints (neglectedness/capacity).
  *   You want to maximize utility.

  **Why it is NOT MVO:**
  1.  **Input Quality:** MVO assumes you have a covariance matrix and expected return vector. In EA, the "expected returns" are single-point estimates with massive error bars, often derived from philosophical arguments rather than historical time series. The "Garbage In, Garbage Out" problem is orders of magnitude worse than in quant.
  2.  **Correlation Structure:** In finance, correlations are statistical. In EA, correlations are causal and structural. If you fail at AI Safety, the "portfolio" of global health causes goes to zero (extinction). This is **tail risk dependency**, not correlation. MVO handles variance; it handles existential ruin poorly.
  3.  **Objective Function:** MVO maximizes $E[R] - \lambda Var(R)$. ITN effectively maximizes $E[Impact]$, often with a **risk-of-ruin constraint** that overrides everything else. It is closer to a **Kelly Criterion** application on venture capital deals than a Markowitz optimization on liquid equities.
  4.  **Endogeneity:** In MVO, your trading doesn't change the underlying fundamentals of the company. In EA, your intervention *changes the physics of the problem*. Funding AI safety changes the probability of AI risk. Your position size alters the expected return of the asset itself.

  ### 5. Final Verdict

  The ITN framework is **Mean-Variance Optimization applied to Venture Capital in a market with no prices, where the assets are public goods, and one asset class (existential risk) has a correlation of 1.0 with total portfolio liquidation.**

  If you treat ITN as a rigid optimization engine, you will fail because the inputs are too noisy. However, if you treat it as a **heuristic for capital allocation under extreme uncertainty**, it is the closest thing EA has to a quant model.

  **The specific delta in your thinking:**
  You are looking for **alpha** (excess return). EA is looking for **leverage** (high impact per unit of input).
  *   **Quant:** "Where is the market wrong?"
  *   **EA:** "Where is the world broken and fixable?"

  Neglectedness is not just crowding; it is a proxy for **marginal utility of capital** in a non-price-discovered market. It warns you that deploying capital into a "crowded" cause (like US Education Reform) has near-zero marginal impact because the system is saturated, whereas a "neglected" cause (like pandemic preparedness) has high marginal impact because the bottleneck is funding/attention, not solvability.

  Use the framework to rank opportunity sets, but discard the assumption that the "market" will correct the mispricing. In EA, *you* are the market maker.
