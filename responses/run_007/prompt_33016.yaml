answer: |-
  ### (1) Setup

  Kripke's Wittgenstein presents a skeptical paradox: no individual fact—mental, behavioral, or dispositional—fixes what rule a speaker intends to follow. For any finite past usage of 'plus', a deviant interpretation (like 'quus', which diverges after a certain point) fits equally well. Thus, there is no fact of the matter about what I meant yesterday, rendering all present claims about meaning unjustified. The skeptical solution accepts this conclusion but denies it is destructive. Instead of truth-conditions, it offers assertibility-conditions. Meaning attributions are legitimate not because they correspond to private facts, but because they satisfy communal standards. Specifically, a speaker is deemed to follow a rule correctly if their responses align with those of the community. Agreement in judgments constitutes the framework within which language games operate. The community acts as the arbiter of correctness, replacing the missing metaphysical fact with a social practice. This shifts meaning from a private relation between mind and world to a public relation between individual and group.

  ### (2) The Objection

  The objection centers on the transition from individual skepticism to communal normativity. The skeptic argues that no fact determines whether a current response is the *same* as a past intention. If I meant 'plus', I should say '125' to '68+57'. But the skeptic shows 'quus' fits too. There is no fact making '125' the *correct* continuation. The skeptical solution attempts to rescue meaning by appealing to communal agreement: I am correct if I agree with you. However, this presupposes the very notion of "agreement" or "sameness of response" that the paradox undermined. For the community to function as an arbiter, we must be able to identify when two speakers are doing the *same* thing. But if no fact fixes what counts as following a rule for an individual, no fact fixes what counts as two individuals following the *same* rule.

  To say we "agree" is to say we are applying the same rule. But the skeptical challenge was precisely that there is no fact about which rule is being applied. If the skeptic is right that 'plus' and 'quus' are indistinguishable based on facts, then communal consensus is just a collection of individuals each potentially following 'quus' while thinking they follow 'plus'. The solution asserts that communal regularity constitutes correctness. Yet, to identify this regularity, one must already grasp the concept of "going on in the same way." The skeptic conceded no fact grounds this grasp. Therefore, grounding meaning in communal sameness begs the question: it assumes we can identify sameness of response without the factual ground the skeptic claimed was missing. It treats communal agreement as a brute fact, but agreement itself is rule-governed. If rules are unintelligible individually, they remain unintelligible collectively unless the notion of "same response" is privileged without justification. The solution tries to bootstrap normativity out of regularity, but regularity itself requires normative individuation to be recognized as agreement rather than mere coincidence.

  ### (3) Best Reply

  A defender of the skeptical solution must clarify the status of the skeptic's conclusion. The skeptic does not deny that people *do* agree; she denies that this agreement reflects a prior metaphysical fact of meaning. The solution does not posit a new fact of "communal sameness" to ground truth-conditions. Rather, it changes the game entirely. Meaning claims are not descriptions of facts but moves in a language game licensed by communal utility. The charge of question-begging assumes the solution tries to restore truth-conditional meaning. It does not. It offers a pragmatic justification. When we say speakers "agree," we are not pointing to a mysterious relation of identity between their mental states. We are describing a brute regularity in behavior that allows communication to function. Wittgenstein calls this "bedrock." At some point, explanations run out, and we simply act. The community does not *discover* sameness; it *creates* normativity through shared reactions. The skeptic's error was seeking a justification for this practice from outside the practice. The solution replies that no external justification is needed. The regularity is not a fact *about* meaning; it is the condition *for* the language game of meaning attribution. Thus, it doesn't beg the question because it abandons the requirement for the kind of fact the skeptic destroyed.

  ### (4) Verdict

  The objection ultimately survives because the "bedrock" reply merely hides the problem rather than solving it. To describe a "brute regularity," one must individuate the behaviors constituting that regularity. If I cannot distinguish 'plus' from 'quus' behaviorally without presupposing a rule, I cannot distinguish 'agreeing' from 'coincidentally matching' behavior without the same presupposition. The defender concedes that no fact grounds meaning, yet relies on the intelligibility of communal identification. To escape the charge, the skeptical solution must make a stronger concession: it must admit that the identification of "agreement" is itself a primitive, non-factual capacity inherent in our natural history, not something justified even pragmatically. It must accept a form of naturalism where "sameness" is not a fact to be grounded but a biological given. However, this risks collapsing the distinction between the skeptical solution and a dispositional account, which Kripke explicitly rejects. Therefore, the solution remains unstable: it denies facts to save normativity but relies on a factual-looking regularity to define that normativity, leaving the specter of skepticism haunting the community itself.
