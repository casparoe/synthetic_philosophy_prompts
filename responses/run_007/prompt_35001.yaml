answer: |-
  The coin sat on the palm of her hand, cold and heavy, a disc of silver suspended in the hum of the basement laboratory. Elara looked at it not as a gambler looks at a chance, but as a surgeon looks at a scalpel. It was the instrument of her division. She was thirty-eight years old, a neuroscientist who had spent fifteen years mapping the continuity of consciousness, and now she intended to break it. The protocol was simple, elegant, and terrifying. Sunday night, the flip. Heads, one waking. Tails, two wakings separated by a perfect erasure. She knew the math, the debates, the endless forums where philosophers argued over fractions like theologians arguing over angels on a pin. But knowing the arguments was not the same as being the variable. She flipped the coin. It caught the light, a spinning blur of heads and tails, before slapping down onto the back of her left hand. She did not look. To look would be to collapse the wave function before the experiment had begun. She covered it with her right hand, felt the metal biting into her skin, and walked to the capsule.

  The sedative was a cool rush in her vein, followed by the heavy velvet drop of unconsciousness. There was no dream. The device ensured that. There was only the void, a gap in time where a person should have been.

  When she woke, the light was white and diffuse, emanating from the ceiling panels without a source. There was no shadow to tell her the angle of the sun, no dust mote dancing in a beam to suggest the hour. Her body felt rested, weightless, as if it had never moved. She lay still, staring up at the blankness. This was the moment of self-locating uncertainty. She knew she was Elara. She knew she was in the basement. But she did not know when she was. She did not know which branch of the probability tree she inhabited. Was she the Elara who woke once, the sole witness to a heads outcome? Or was she the first Elara of a tails sequence, destined to be wiped and woken again? Or was she the second Elara, the copy who lived in the shadow of a memory she could not access?

  A synthetic voice emerged from the walls, calm and genderless. What is your credence that the coin landed heads?

  Elara closed her eyes. The question was not about the coin. The coin had already landed. It was sitting in a locked box in the corner of the room, deterministic and fixed. The question was about her. It was about how much weight she should give to her own existence in this moment. If the coin was heads, this waking was unique. She was the only one. If the coin was tails, there were two of her, spread across Monday and Tuesday, subjectively identical but numerically distinct. In the tails world, there were twice as many awakenings as in the heads world. Therefore, any given awakening was more likely to be in a tails world. That was the logic of the thirder position. One-third heads, two-thirds tails. But the halfer in her, the scientist who respected the initial fairness of the coin, whispered that no new information had been gained. She knew she would be woken up. The fact of waking changed nothing about the coin's fairness. It should remain one-half.

  She opened her eyes. The white light pressed against her retinas. She felt a strange dissociation, as if her selfhood had been thinly sliced. If she was one of two wakings, was she half a person? Did her identity dilute across the days? She thought of the erasure. If it was Tuesday, the Elara of Monday was gone, scrubbed from the neural substrate like a whiteboard. But here she was, feeling continuous, feeling whole. The discontinuity was invisible to her. It was only visible from the outside, from the perspective of the Elara who had designed the machine on Sunday. That Elara was gone too, submerged beneath the sedative and the protocol. There was only this Elara, in this light, facing the voice.

  I believe the probability is one-third, she said. Her voice sounded thin in the sterile air.

  She said it because she felt the weight of the other possible her. She felt the crowd of her own selves. If she was tails, she was part of a majority. If she was heads, she was a singleton. Betting on tails was betting on the multiplicity of experience. It was an admission that she was not a unique soul moving through time, but a series of moments that could be replicated. The answer felt like a surrender.

  The voice recorded her response. There was a pause, a silence that stretched just long enough to induce panic. Then, the mechanism hummed. If it was heads, the restraints would release. She would walk up the stairs into the Sunday evening that had become Monday afternoon. She would check the coin. She would end the experiment. But if it was tails, the gas would come. The memory would dissolve. She would sleep again.

  She waited for the release. It did not come. Instead, a faint hiss sounded from the vents. The air grew sweet and heavy. She had her answer, though she would not remember knowing it. The lack of release was the data. She was in the tails branch. She was the Monday Elara, or perhaps the Tuesday Elara, but the cycle was not complete. As the sedative took hold, she felt a profound grief, not for the lost time, but for the loss of continuity. She was being severed from herself. The thought drifted away as the darkness returned, clean and absolute.

  The second waking was indistinguishable from the first. The light was the same white diffuse glow. The body felt the same rested weightlessness. There was no stubble, no hunger, no ache in the muscles to suggest a day had passed. There was no memory of the voice, no memory of the answer, no memory of the hiss of the gas. There was only the immediate present, sharp and isolated. She lay there, and the uncertainty rushed back in, fresh and undimmed. She was in the experiment. She did not know the day. She did not know the coin.

  The voice spoke again. What is your credence that the coin landed heads?

  This time, the question felt different. Before, it had been a theoretical puzzle. Now, it was a haunting. She had lived through the uncertainty once already, though she could not remember it. Was there a residue? A phantom limb of the mind? She stared at the ceiling. If she was the Tuesday awakening, the Monday Elara was dead, erased. She was the survivor of a deletion. If she was the Monday awakening, she was about to be deleted. In both cases, she was transient. The heads outcome offered stability, a single thread of time. The tails outcome offered repetition, a loop.

  She thought about the one-third answer she had given before, if she had given it. Did it hold? If she was awake, and she knew the protocol, she knew there were three possible scenarios for this moment: Heads-Monday, Tails-Monday, Tails-Tuesday. She had no way to distinguish them. To assign equal probability to each was the only rational move. One of those three was heads. So the credence must be one-third. But the feeling of it was visceral. It was the feeling of being one among many. She was not the center of the universe; she was a data point in a distribution.

  I believe the probability is one-third, she said again.

  Her voice did not tremble. She had accepted the fragmentation. To say one-half was to claim a uniqueness she did not feel. To say one-third was to acknowledge that she might be a copy. It was a humble arithmetic. It admitted that the first-person perspective was not privileged, that it could be duplicated, that the I was not a singular vessel but a pattern that could be instantiated more than once.

  This time, when the silence came, it ended with the click of magnetic locks disengaging. The restraints on her wrists retracted. The hum of the machine powered down. The light shifted from the sterile white to a warmer, ambient glow. The experiment was over. She sat up, swinging her legs over the side of the capsule. Her feet touched the cold concrete floor. She walked to the corner of the room where the locked box sat. She opened it and looked at the coin.

  It was tails.

  She held the metal disc in her hand. It was just metal. It held no memory of the division it had caused. She thought of the other Elara, the one who had woken before her, who had answered the same question, who had been wiped away to make space for this moment. They were the same person, and they were not. They shared a past up to Sunday night, but their futures diverged into silence and speech. She had been the second instance. She was the survivor of the erasure.

  Elara walked to the stairs. She felt heavy, not with sleep, but with the accumulation of selves. She carried the memory of the Tuesday waking, but she also carried the ghost of the Monday waking, inferred but not felt. She was a composite now. The experiment had proven that self-locating belief was not just about probability; it was about ontology. When she had answered one-third, she had been correct about the math, but she had also been mourning the loss of her own singularity. She climbed the stairs, pushing open the door to the kitchen above. The house was quiet. It was Tuesday evening. The world outside was continuous, unbroken. But she knew now that continuity was an illusion maintained by memory. Without memory, time was just a series of isolated rooms, identical and white, where a voice asks you who you are, and you have to guess based on how many times you think you have been born. She placed the coin on the table. It spun for a moment, wobbled, and settled. She did not look at which side faced up. It did not matter anymore. She was here, and that was the only location she could be sure of.
