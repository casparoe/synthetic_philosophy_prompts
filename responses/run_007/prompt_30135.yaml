      *   *Critique:* Am I giving too much ground to the skeptics?
      *   *Fix:* Strengthen the defense of the pattern ontology. If we accept physicalism and functionalism (which Hofstadter does), the "representation is not the thing" objection loses force if the representation *does the work* of the thing (predicting, feeling, reacting).
      *   *Critique:* Is the verdict clear enough?
