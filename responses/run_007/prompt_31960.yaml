answer: |-
  ### 1. The Essay Question

  **Module:** PHI3045 Metaethics
  **Assessment:** Take-Home Essay
  **Word Limit:** 2,000 words (±10%)

  **Question:**

  The Frege–Geach problem is often presented as a technical difficulty regarding logical validity in unasserted contexts. However, its deeper threat is to the expressivist's fundamental architectural commitment: that moral judgments are essentially non-cognitive attitudes rather than belief-like states.

  Discuss this claim. In your answer, explain why the problem arises from the tension between the expressive function of moral language and the requirements of logical consistency. Then, evaluate whether Simon Blackburn's quasi-realism (or another specific response of your choice) successfully resolves this tension without abandoning the core expressivist insight. Does the solution preserve the distinction between belief and attitude, or does it collapse into a form of cognitivism?

  ***

  ### 2. Model Answer

  **Title:** The Architectural Threat of the Frege–Geach Problem

  Expressivism posits that moral judgments do not describe facts but express non-cognitive attitudes, such as approval or disapproval. The Frege–Geach problem challenges whether this semantic account can accommodate the logical behaviour of moral language. While often framed as a puzzle about conditionals, the problem is architecturally deeper: it threatens the expressivist's ability to explain moral reasoning without conceding that moral judgments function as truth-apt beliefs.

  The core tension lies between the *expressive function* of moral terms and the *logical requirements* of consistency. In standard logic, validity is defined by truth-preservation across premises and conclusion. For an argument like Modus Ponens to be valid, the term 'wrong' must retain a constant semantic content in both asserted and unasserted contexts (e.g., 'Stealing is wrong' and 'If stealing is wrong...'). For the cognitivist, this content is a proposition describing a state of affairs. For the expressivist, however, the content is an attitude. The difficulty is that one cannot hold an attitude towards a proposition in the antecedent of a conditional in the same way one holds it in a standalone assertion. To say 'If stealing is wrong' is not to disapprove of stealing; it is to hypothesise. If expressivism cannot explain what is being hypothesised without invoking a proposition, it fails to account for the consistency of moral thought. If moral thoughts cannot be inconsistent, moral reasoning is impossible.

  Simon Blackburn's quasi-realism attempts to resolve this by reconstructing logic within a framework of attitudes. Blackburn argues that we do not need truth-conditions to explain validity; we need an account of *consistent attitudes*. He suggests that logical operators can be understood as expressing higher-order attitudes. To accept the argument 'Stealing is wrong; if stealing is wrong, then killing is wrong; therefore killing is wrong' is to have a combination of attitudes that Blackburn deems 'incoherent' if one rejects the conclusion. Thus, validity is recast as the impossibility of holding certain combinations of attitudes without pragmatic contradiction.

  However, evaluating this solution requires asking whether it preserves the expressivist architecture or surrenders it. The primary risk is that in mimicking the logical behaviour of beliefs so closely, quasi-realism becomes indistinguishable from cognitivism. This is the challenge of 'creeping minimalism'. If Blackburn explains moral consistency by appealing to the same structural constraints that govern beliefs, the distinction between expressing an attitude and believing a moral fact dissolves.

  A specific architectural failure in this regard is highlighted by Mark Schroeder's 'negation problem'. Blackburn explains the inconsistency of disagreeing attitudes well, but struggles to distinguish between different types of negation. For a cognitivist, 'Stealing is not wrong' denies a proposition. For an expressivist, it must express a different attitude (e.g., tolerance). Yet, logically, 'not wrong' functions identically whether it negates a belief or an attitude. If Blackburn's higher-order attitudes must be structured exactly like propositions to solve the embedding problem, the 'non-cognitive' label becomes merely terminological. The solution saves the phenomena of moral logic only by importing the architectural features of cognitivism.

  Therefore, the Frege–Geach problem is not merely about embedding; it is about whether a non-cognitive psychology can sustain the normative force of logic. Blackburn's quasi-realism offers a sophisticated defence, redefining validity as attitudinal coherence. Yet, to succeed, it must walk a tightrope: it must explain logical consistency without positing truth-apt content. If the explanation of consistency relies on structures isomorphic to belief, the expressivist insight is lost. Consequently, while quasi-realism mitigates the technical embarrassment of the embedding problem, it remains vulnerable to the charge that it solves the architectural problem only by ceasing to be expressivist in any robust sense. The problem endures because the requirements of logic seem to demand a cognitive architecture that expressivism fundamentally rejects.

  ***

  ### 3. Marking Scheme

  **Module:** PHI3045 Metaethics
  **Assessment:** Take-Home Essay

  | Band | Grade | Criteria & Descriptors |
  | :--- | :--- | :--- |
  | **First** | **70–100** | **Architectural Insight & Critical Evaluation**<br>• **Core Understanding:** Explicitly identifies the Frege–Geach problem as a threat to the *semantic/psychological architecture* of expressivism (the tension between attitude and logic), not merely a technical puzzle about conditionals.<br>• **Evaluation:** Critically assesses a specific solution (e.g., Blackburn, Gibbard, Ridge) against the requirement to preserve non-cognitivism. Discusses the risk of 'collapse' into cognitivism (e.g., creeping minimalism).<br>• **Argument:** Structured, precise, and dialectical. Moves beyond description to analyse the *cost* of the solution.<br>• **Knowledge:** Demonstrates sophisticated grasp of validity, consistency, and the belief/attitude distinction. |
  | **Upper Second** | **60–69** | **Competent Understanding & Description**<br>• **Core Understanding:** Accurately explains the Frege–Geach problem and the basics of expressivism. Recognises it involves logic and unasserted contexts.<br>• **Evaluation:** Describes a solution (e.g., Blackburn's higher-order attitudes) but treats it primarily as a technical fix rather than an architectural challenge. May note objections but lacks depth on *why* they threaten the expressivist project.<br>• **Argument:** Clear and organised, but may rely more on exposition than critical analysis.<br>• **Knowledge:** Solid grasp of the literature, but may miss the deeper implication regarding the nature of moral thought. |
  | **Lower Second** | **50–59** | **Basic Understanding & Summary**<br>• **Core Understanding:** Defines expressivism and states the Frege–Geach problem (often focusing heavily on the 'If stealing is wrong' example).<br>• **Evaluation:** Limited evaluation. May list responses without assessing their success or failure regarding the core commitment of expressivism.<br>• **Argument:** Structure may be loose. Tendency to summarise views rather than construct an argument.<br>• **Knowledge:** Accurate but superficial. May confuse validity with truth or miss the distinction between asserted/unasserted contexts. |
  | **Third / Fail** | **0–49** | **Inadequate or Incorrect**<br>• **Core Understanding:** Significant misunderstandings of expressivism or the Frege–Geach problem (e.g., treating it as a problem about moral truth only).<br>• **Evaluation:** No genuine evaluation of a solution. Purely descriptive or irrelevant.<br>• **Argument:** Disorganised, unclear, or fails to address the prompt.<br>• **Knowledge:** Major gaps in understanding course material. |

  **Note on the Distinction between First and Upper Second:**
  The most common misunderstanding that confines a script to the **Upper Second (2:1)** band is treating the Frege–Geach problem as a *logical puzzle* to be solved, rather than a *metaphysical/semantic threat* to be evaluated. A 2:1 answer will successfully explain how Blackburn fixes the logic of conditionals. A **First** answer will argue that fixing the logic might cost the expressivist their core commitment (that moral states are not beliefs). To earn a First, the student must demonstrate that a solution which handles conditionals perfectly is still a failure if it renders the distinction between cognitivism and non-cognitivism vacuous.
