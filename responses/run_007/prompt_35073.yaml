  Okay so I'm a grad student and I've been staring at this argument for like two days and I can't figure out where it breaks. You're an expert on philosophical logic and formal epistemology — please think carefully, maybe start by laying out the structure of the argument in your own words so I can see you've got it, and then walk me through what's going on.

  The argument is from Lewis's 1976 paper "Probabilities of Conditionals and Conditional Probabilities" and it seems to show that if you accept a really natural claim about the probability of conditionals, you end up with the insane result that you can only ever have trivial probabilities — everything is either certainly true or certainly false. Here's the argument:

  (1) The probability of an indicative conditional "If A, then B" just IS the conditional probability of B given A. So P(A → B) = P(B | A), for any A, B where P(A) > 0. This is sometimes called "Adams's Thesis" or just "the Equation." It sounds right — like, how confident are you that if it rains the picnic will be cancelled? That's exactly how confident you are that the picnic is cancelled, given that it rains.

  (2) By the law of total probability, we can expand any probability over a partition. Take the partition {B, ¬B}:
  P(A → B) = P(A → B | B) · P(B) + P(A → B | ¬B) · P(¬B)

  (3) Now apply the Equation again, this time to the conditional probabilities inside the expansion. The Equation was supposed to hold for any probability function, including the ones we get after conditionalizing on B or on ¬B (provided the conditioning event has positive probability). So:
  P(A → B | B) = P(B | A ∧ B) = 1
  P(A → B | ¬B) = P(B | A ∧ ¬B) = 0

  (4) Plug those in:
  P(A → B) = 1 · P(B) + 0 · P(¬B) = P(B)

  (5) But we also have from (1) that P(A → B) = P(B | A). So P(B | A) = P(B) for any A, B with P(A) > 0.

  (6) That means every pair of propositions is probabilistically independent. But that's absurd — P(rain | dark clouds) should be higher than P(rain), P(you have the disease | you tested positive) should be higher than P(you have the disease). Basically all of learning from evidence goes out the window.

  (7) And it gets worse. From P(B | A) = P(B) for all A, B with P(A) > 0, we get triviality. Take any proposition C with P(C) > 0. Then P(C | C) = P(C). But P(C | C) = 1. So P(C) = 1. That means any proposition with positive probability has probability 1. So the only possible probability values are 0 and 1. You can't be uncertain about anything — which is obviously false, since I'm uncertain about plenty.

  So the Equation, which seemed like the most natural thing in the world, forces probability to be trivial. That's wild. Something has to give.

  I'm most suspicious of step (3) — applying the Equation inside the scope of conditionalization — but I can't articulate exactly what's wrong with it. The Equation was supposed to be a general claim about how probabilities of conditionals work; why shouldn't it apply to conditional probabilities? If the Equation is true, then P(A → B | B) should equal P(B | A ∧ B), and that's definitely 1. So maybe the Equation just isn't true? But then what do we say about all the cases where it seems obviously right?

  Please tell me which step you reject, why it looked so plausible, and what you have to give up to reject it. If there are different standard responses (like denying that conditionals express propositions at all, or giving up the Equation entirely, or restricting it to only some probability functions), I'd like to know what each one costs. I'm not just looking for the answer "reject the Equation" — I want to understand what the landscape looks like once you do.
