      *   *Chalmers' Reply:* He agrees generally but argues consciousness is special. For Water = H2O, the concept "Water" picks out whatever plays the watery role. For "Pain," the concept picks out the feeling itself. There is no "hidden essence."
      *   *2D Semantics:* Briefly mention this without getting too bogged down. Epistemic possibility $\rightarrow$ Metaphysical possibility for phenomenal truths.
      *   *Physicalist Counter:* Phenomenal Concept Strategy. We have two ways of thinking about the same brain state (physical vs. experiential), making it *seem* contingent.
      *   *Status:* The argument isn't a "checkmate," it's a "fork." Either physicalism is false, or our concepts of consciousness are deeply misleading.

