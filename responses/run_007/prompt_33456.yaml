      *Wait, View 3 says:* "if option A is better than option B by every affected party's own lights, then A is better, full stop."
      *View 4 says:* "There are things I shouldn't do myself even if doing them produces more total value."
      *Conflict:* If the trade makes A better by *my* lights (View 1), and better by *your* lights, then by View 3, A is better full stop. But View 4 says I shouldn't do A.
      *Resolution:* "Better full stop" (axiological) does not entail "Permissible to do" (deontic). This is the standard Moore/Ross distinction. I need to make sure the user accepts this distinction.

