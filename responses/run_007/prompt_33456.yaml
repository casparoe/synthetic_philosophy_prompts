          2.  Ranked Tensions (High to Low).
          3.  Specific diagnosis of each tension.
          4.  Proposed "Cheapest Revisions" (tweaks to wording or conceptual distinctions).
      *   *Key Insight to inject:* The distinction between *evaluative* claims (what is better) and *deontic* claims (what is permissible). Dominance is evaluative; Constraints are deontic. This solves Tension 1.
      *   *Key Insight to inject:* The distinction between *complicity types*. Funding vs. Advocacy. This solves Tension 2 (Case 5 vs 6).
      *   *Key Insight to inject:* Pluralism allows for *local* comparability even if *global* commensurability fails. This solves Tension 3.

  6.  **Refining the "Cheapest Revision":**
