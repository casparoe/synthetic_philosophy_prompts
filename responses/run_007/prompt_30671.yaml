prompt: |-
  In a seminar on information cascades and rational herding, a classmate waved off a worry about a bank run by saying that "everyone can't be wrong." His move was this: if enough depositors are withdrawing, the best explanation of their behavior is that each has good private reasons, so a rational observer should withdraw too, and the run itself becomes evidence that the bank really is in trouble. I am fairly sure that slogan is doing more work than he has acknowledged, but I cannot yet say exactly which work it is doing. I want you to separate the distinct precise claims "everyone can't be wrong" could be used to express — for instance, claims about the accuracy of independent judgments pooled across many people, claims about markets or crowds aggregating dispersed private information, claims about what a rational agent may infer from observing the actions of others, and claims about the improbability of a large group converging on a falsehood. For each reading, spell out the conditions it assumes (independence of signals, observability of actions, common knowledge of rationality, and the like), whether it is true under those conditions, how it fares once agents observe and imitate one another rather than decide independently, and whether that reading would actually support the inference from a run on the bank to the bank's being in trouble. Lay the readings out as a menu rather than defending one interpretation, flag which are trivial, and say which ones would genuinely do the work my classmate's argument needs.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** A seminar on information cascades and rational herding.
      *   **Scenario:** A classmate dismisses worry about a bank run using the slogan "everyone can't be wrong."
      *   **Classmate's Argument:** If many withdraw, they must have private reasons; therefore, a rational observer should withdraw; the run *is* evidence the bank is in trouble.
      *   **User's Intuition:** The slogan is doing more work than acknowledged (likely conflating different concepts).
      *   **Task:** Separate distinct precise claims the slogan could express.
      *   **Categories to Cover:** Accuracy of independent judgments, market/crowd aggregation, rational inference from others' actions, improbability of group convergence on falsehood.
      *   **Analysis per Claim:** Conditions assumed (independence, observability, etc.), truth under conditions, effect of herding/imitation, support for the inference (Run $\rightarrow$ Bank Trouble).
      *   **Format:** A "menu" of readings.
      *   **Specific Instructions:** Flag trivial readings, identify which ones actually support the classmate's argument.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Slogan:* "Everyone can't be wrong."
      *   *Core Tension:* Condorcet's Jury Theorem (independent signals) vs. Information Cascades (dependent signals/herding).
      *   *Classmate's Logic:* Observed Action $\rightarrow$ Inferred Private Signal $\rightarrow$ Fundamental Truth.
      *   *Problem:* In cascades, observed actions stop revealing private signals.
      *   *Readings needed:*
          1.  **Condorcet/Jury Theorem:** Independent signals, majority rule.
          2.  **Efficient Markets/Wisdom of Crowds:** Prices/actions aggregate info.
          3.  **Bayesian Social Learning:** Inferring signals from actions (pre-cascade).
          4.  **Self-Fulfilling Prophecy/Run Equilibrium:** The run *causes* the failure, not just reveals it.
          5.  **The "Common Knowledge" trap:** Everyone knows everyone is rational, but coordination fails.

  3.  **Drafting the Menu Items (Iterative Refinement):**

      *   *Reading 1: The Condorcet Jury Theorem (Independent Signals).*
          *   Claim: If $N$ people vote independently with $p > 0.5$ accuracy, majority is almost certainly right.
          *   Conditions: Independence is key.
          *   Relevance to Bank Run: Depositors are *not* independent if they watch each other.
          *   Verdict: False in this context. Doesn't support the classmate.

      *   *Reading 2: The Wisdom of Crowds (Aggregation).*
          *   Claim: Markets/Groups aggregate dispersed info into a single metric (price or mass action).
          *   Conditions: Diverse opinions, decentralization, aggregation mechanism.
          *   Relevance: Bank runs aren't prices. They are binary actions.
          *   Verdict: Weak support. Ignores the sequential nature.

      *   *Reading 3: Rational Social Learning (Pre-Cascade).*
          *   Claim: Early movers reveal private info. Later movers learn from them.
          *   Conditions: Sequential moves, Bayesian updating.
          *   Relevance: Works for the first few people.
          *   Verdict: Fails once a cascade starts. Actions become uninformative.

      *   *Reading 4: The Cascade Itself (Herding).*
          *   Claim: "Everyone is doing it" implies "Everyone knows something."
          *   Conditions: Observability of actions, hiding of private signals.
          *   Relevance: This is what the classmate *thinks* is happening, but it's actually the trap.
          *   Verdict: This is the *error*. The run becomes disconnected from fundamentals.

      *   *Reading 5: Self-Fulfilling Prophecy (Multiple Equilibria).*
          *   Claim: The run makes the bank fail, regardless of initial health.
          *   Conditions: Liquidity mismatch.
          *   Relevance: "Everyone can't be wrong" might mean "If everyone withdraws, the bank *will* fail."
          *   Verdict: True, but changes the meaning from "revealing truth" to "creating truth."

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the user's skepticism. Define the core tension (Information Aggregation vs. Information Cascades).
      *   **The Menu:** Present 4-5 distinct readings.
          *   Name/Label.
          *   The Precise Claim.
          *   Necessary Conditions.
          *   Truth Value (in theory vs. in bank run context).
          *   Does it support the classmate?
      *   **Analysis of the Classmate's Error:** Specifically address the "Run as Evidence" claim.
      *   **Conclusion:** Summary of which readings work and which are trivial/false.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "The bank is fundamentally insolvent" vs. "The bank will fail due to liquidity." The classmate implies the former (the run reveals insolvency). The reality is often the latter (the run causes illiquidity).
      *   *Nuance:* In a cascade, "everyone can't be wrong" is actually *false* regarding fundamentals. Everyone *can* be wrong if they are all following the first two people who got bad signals.
      *   *Trivial Reading:* Is there a tautological reading? "If everyone withdraws, the bank fails." That's mechanically true. I should include that as a "Trivial/Mechanical" reading.
      *   *Classmate's specific logic:* He says "best explanation... is that each has good private reasons." This is the specific point to attack. In a cascade, the best explanation is that they have *no* private reasons and are following the crowd.

  6.  **Final Polish:** Check against constraints.
