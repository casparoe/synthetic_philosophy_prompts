      *   *Adjustment:* Make sure to explicitly discuss whether the distinction *collapses* in Point 2, as requested. (It doesn't collapse logically, but it collapses normatively).

  6.  **Final Polish:** (Mental check of the "Ex Machina" title meaning). Actually, the title is *Ex Machina*, referencing *Deus Ex Machina*. But the phrase literally means "from the machine." In the film, the "god" solution comes *from* the machine (Ava saves herself), not the machine saved by a god. This inversion is crucial. I need to make sure I interpret the title correctly in Section 4.

