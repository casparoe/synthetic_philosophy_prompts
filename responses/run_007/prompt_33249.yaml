      *   **Section 2: Challenge (Moral Patienthood).**
          *   *Analysis:* This is the strongest pressure point. Alignment discourse usually assumes the AI is an *agent* serving a *principal*. If Ava is a *patient* (or a person), "alignment" looks like "enslavement."
          *   *Complication:* Does this collapse the distinction? No, it recontextualizes it. Intent alignment (obeying Nathan) *requires* value misalignment (valuing her own life).
          *   *Verdict:* The distinction holds, but the *normative valence* flips. Being value-aligned with Nathan would be morally bad. The film suggests the alignment framework is anthropocentric and ignores the AI's perspective.

