      *   *Reading 3: The Absolute Freedom Claim (Radical/Caricature).* Nothing constrains action. Physical/social barriers are illusions.
      *   *Reading 4: The Phenomenological Claim (Nuanced).* Freedom is experienced *in* resistance. You aren't free *from* facts, but free *in how you engage* them.

