prompt: |-
  So I just had this huge argument with my friend about Goodhart's law — the whole "when a measure becomes a target, it ceases to be a good measure" thing. He thinks it's basically a shallow insight dressed up as a law, and that people only trot it out when they don't like being held accountable to numbers. I was on the other side, arguing that it's a real structural problem, especially once you look at specification gaming in AI systems — like the boat-racing game where the agent just went in circles collecting power-ups instead of finishing the course. We went back and forth for like an hour and neither of us budged, but it got me thinking: I actually don't have a good procedure for spotting this stuff in my actual job.

  I'm a product manager, and I'm involved in setting targets and defining metrics for teams pretty often — OKRs, KPIs, dashboards, the whole thing. I want an actual decision procedure I can run on a proposed metric before we roll it out. Something I can pull out in a meeting and work through in under an hour, that helps me figure out whether a metric is likely to get gamed and how badly. It should distinguish between "this metric is imperfect, like all metrics" and "this metric is probably going to produce the opposite of what we actually want," and it should flag the points where you just have to use judgment because the procedure can't decide for you.

  Then apply it to two cases: (a) a customer support team where we're thinking of switching from "tickets closed per day" to a target on customer satisfaction scores, and (b) a content team being measured on "average time on page."

  I need this to be honest about what the procedure can and can't do — if there are failure modes it won't catch, say so. And if it tells me to kill a metric that my boss is already in love with, I want it to give me the actual argument I'd need to make, not just "this violates Goodharts law."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument about Goodhart's Law (shallow insight vs. structural problem, citing AI specification gaming).
      *   **Role:** Product Manager (sets targets, OKRs, KPIs, dashboards).
      *   **Need:** A concrete *decision procedure* (checklist/framework) to evaluate proposed metrics *before* rollout.
      *   **Constraints:**
          *   Must be usable in a meeting (< 1 hour).
          *   Must distinguish between "imperfect metric" vs. "dangerous metric."
          *   Must flag areas requiring human judgment.
          *   Must be honest about limitations/failure modes.
          *   Must provide actionable arguments for stakeholders (not just "Goodhart's Law").
      *   **Task:** Create the procedure, then apply it to two specific cases:
          *   (a) Customer Support: "Tickets closed per day" $\rightarrow$ "Customer Satisfaction (CSAT) scores."
          *   (b) Content Team: "Average time on page."

  2.  **Deconstruct Goodhart's Law for a PM Context:**
      *   Goodhart's Law isn't just "metrics get gamed." It's about *alignment*.
      *   The core issue is the gap between the *proxy* (the metric) and the *goal* (the actual value).
      *   Campbell's Law is also relevant (social systems).
      *   The procedure needs to force the team to articulate the *Goal* vs. the *Measure* and then stress-test the link between them.

  3.  **Drafting the Decision Procedure (The "Goodhart Stress Test"):**
      *   *Goal:* Make it structured, time-boxed, and actionable.
      *   *Steps:*
          1.  **Define the True North:** What do we *actually* want? (Not the number, the outcome).
          2.  **Map the Causal Link:** How does moving this number move the True North?
          3.  **Incentive Analysis:** Who is being measured? What can they control? What's the path of least resistance?
          4.  **Counter-Metric Check:** What bad thing could happen if this number goes up? (Guardrail metrics).
          5.  **The "Stupid Bot" Test:** If an AI/automation tried to maximize this without caring about the spirit, what would it do? (Connects to user's AI example).
          6.  **Decision Matrix:** Score the risk.
      *   *Output:* A clear "Go," "No-Go," or "Go with Guardrails."

  4.  **Refining the Procedure (Self-Correction/Polishing):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Use PM language (OKRs, Guardrails, Leading/Lagging). Keep it to 5 steps.
      *   *Critique:* How to handle the "boss loves it" scenario?
      *   *Fix:* Add a specific section on "The Argument Script" – how to phrase the objection constructively.
      *   *Critique:* Limitations?
      *   *Fix:* Explicitly state that this doesn't predict *malice*, only *misalignment*. It can't catch black swans.

  5.  **Applying the Procedure to Case (a): Customer Support (CSAT):**
      *   *Goal:* Helpful resolution.
      *   *Metric:* CSAT score.
      *   *Gaming:* Asking only happy customers, bribing customers, solving easy tickets only, avoiding hard tickets.
      *   *Verdict:* High risk if used alone. Needs guardrails (Ticket volume, Resolution time).
      *   *Argument:* "CSAT measures sentiment, not resolution. We need to ensure we aren't filtering out complex problems."

  6.  **Applying the Procedure to Case (b): Content Team (Time on Page):**
      *   *Goal:* Engagement/Value.
      *   *Metric:* Avg Time on Page.
      *   *Gaming:* Clickbait titles, hiding the 'close' button, long boring text, infinite scroll tricks.
      *   *Verdict:* Very High Risk. This is a classic vanity metric trap.
      *   *Argument:* "Time on page confuses 'stuck' with 'engaged.' We should measure scroll depth or return rate instead."

  7.  **Drafting the Response:**
      *   *Tone:* Professional, pragmatic, empathetic to the PM role (politics, pressure).
      *   *Structure:*
          1.  Introduction (Validating the user's stance on Goodhart's).
          2.  The Procedure (The "Goodhart Stress Test").
          3.  Limitations (Honesty clause).
          4.  Case Study A (Support).
          5.  Case Study B (Content).
          6.  Conclusion.

  8.  **Review against Constraints:**
      *   *Under an hour?* Yes, the steps are designed for a workshop style.
      *   *Distinguish imperfect vs. dangerous?* Yes, via the Risk Scoring.
      *   *Flag judgment calls?* Yes, included in the steps.
      *   *Actionable arguments?* Yes, included in the "Script" section.
      *   *AI/Specification Gaming reference?* Included in the "Stupid Bot" test.

  9.  **Final Polish:** Ensure the distinction between *measurement* and *target* is clear. Goodhart's law specifically triggers when a measure becomes a *target*. The procedure should emphasize *how* the target is set (thresholds vs. continuous optimization). *Self-correction:* Make sure to mention that *any* metric becomes dangerous if the stakes are too high.

  10. (Final check of the "Boss Argument" requirement): Ensure I give specific language to use when pushing back on leadership. "It's not that the metric is wrong, it's that the incentive structure creates a blind spot."

  11. *Wait, one more thing:* The user mentioned AI specification gaming. I should explicitly link the "Stupid Bot" test to that concept to validate their earlier argument.

  12. *Let's build the response.* (Proceeds to generate output based on these thoughts).
answer: |-
  You are right, and your friend is half-right. Goodhart's Law isn't a mystical curse; it's an economic incentive problem. Your friend is correct that people often use it as a shield against accountability ("Don't measure me, I'm complex!"). But you are correct that when stakes are high and the proxy is loose, rational actors *will* optimize the proxy at the expense of the goal.

  As a PM, you don't need philosophy; you need risk mitigation. You need to treat a metric like a feature: it has bugs, side effects, and failure modes.

  Here is a decision procedure designed for a PM context. It is called **The Goodhart Stress Test**. It is designed to take 45–60 minutes in a working session with your leads/stakeholders.

  ---

  ### The Goodhart Stress Test (Procedure)

  **Time:** 45–60 Minutes
  **Participants:** Product Lead, Engineering/Team Lead, Stakeholder (who wants the metric)
  **Output:** A "Go," "No-Go," or "Go with Guardrails" decision, plus a risk register.

  #### Step 1: Decouple Goal vs. Proxy (5 mins)
  Write down two distinct statements.
  1.  **The True North:** What behavior or outcome do we *actually* value? (e.g., "Customers feel their problems are solved.")
  2.  **The Proxy:** What number are we proposing to track? (e.g., "CSAT Score > 4.5")

  *Judgment Flag:* If the team cannot agree on the True North without mentioning the Proxy, stop. You are measuring because you can, not because you know what you want.

  #### Step 2: The "Path of Least Resistance" Audit (15 mins)
  Ask the team who will be measured: *"If your bonus/promotion depended entirely on moving this number by 20% next month, what is the easiest, fastest way to do it that technically follows the rules but violates the spirit?"*

  *   List every tactic they come up with.
  *   **Crucial:** Do not judge them for being cynical. Reward them for honesty.
  *   Categorize tactics:
      *   **Benign:** Improves the metric and the goal.
      *   **Neutral:** Improves metric, no effect on goal (Vanity).
      *   **Malign:** Improves metric, harms the goal (Goodhart Failure).

  #### Step 3: The "Stupid Bot" Test (10 mins)
  This addresses your AI argument. Imagine a script or AI agent with no moral compass tasked with maximizing this number.
  *   *Question:* "What would a bot do to maximize this metric that would horrify us?"
  *   *Example:* If the metric is "Code Lines Written," the bot copies the same line 10,000 times.
  *   *Example:* If the metric is "Time on Page," the bot opens a tab and walks away.

  If the bot's strategy is indistinguishable from a human's "gaming" strategy, the metric is fragile.

  #### Step 4: Define Guardrails (Counter-Metrics) (15 mins)
  For every "Malign" tactic identified in Step 2, identify a **Counter-Metric** that would spike if that tactic were used.
  *   *Rule:* You cannot launch a target without a guardrail.
  *   *Example:* If targeting "Tickets Closed," the guardrail is "Re-open Rate" or "CSAT."
  *   *Example:* If targeting "Velocity," the guardrail is "Bug Rate" or "Tech Debt Accumulation."

  If you cannot identify a counter-metric for a high-risk malign tactic, the metric is **High Risk**.

  #### Step 5: The Stakes Calibration (10 mins)
  Goodhart's Law scales with stakes. A metric on a dashboard is safe; a metric tied to comp is dangerous.
  *   **Low Stakes:** Dashboard only. (Acceptable risk is higher).
  *   **Medium Stakes:** Performance review input. (Requires Guardrails).
  *   **High Stakes:** Bonus/Comp multiplier. (Requires multiple proxies or qualitative review).

  **Decision Matrix:**
  *   **Go:** No Malign tactics found, or Guardrails exist for all of them. Stakes are Low/Medium.
  *   **Go with Guardrails:** Malign tactics exist, but Counter-Metrics are defined and will be monitored weekly.
  *   **No-Go:** Malign tactics exist, no Counter-Metrics possible, OR Stakes are High with a single fragile proxy.

  ---

  ### Limitations & Failure Modes (Honesty Clause)
  Before you use this, acknowledge what it *cannot* do:
  1.  **It doesn't predict Black Swans:** It relies on the team's imagination. If the team can't imagine a way to game it, the test might pass, and someone will still game it later.
  2.  **It doesn't solve "Metric Fatigue":** You can add so many guardrails that the team is paralyzed.
  3.  **It doesn't fix bad culture:** If leadership punishes honesty in Step 2, the test is worthless.
  4.  **It assumes rational actors:** It won't catch accidental degradation (e.g., a code change that breaks tracking).

  ---

  ### Case Study A: Customer Support
  **Proposal:** Switch from "Tickets Closed/Day" to "Average CSAT Score."
  **Stakes:** Medium (Team Performance Review).

  **1. Goal vs. Proxy**
  *   **True North:** Customers leave with their issues resolved and feel heard.
  *   **Proxy:** Average Customer Satisfaction Score (1–5 scale) per agent.

  **2. Path of Least Resistance**
  *   *Tactic 1:* Agents only close easy tickets (password resets) and let hard technical bugs sit in the queue.
  *   *Tactic 2:* Agents explicitly ask happy customers to fill out the survey and ignore unhappy ones.
  *   *Tactic 3:* Agents offer refunds/credits to shut customers up quickly without fixing the root cause.

  **3. Stupid Bot Test**
  *   A bot would auto-send survey links only to customers who used positive language in the chat. It would route complex queries to a "black hole" queue that doesn't count toward the agent's load.

  **4. Guardrails**
  *   *For Tactic 1:* **Ticket Age / SLA Breach Rate.** (Ensures hard tickets aren't ignored).
  *   *For Tactic 2:* **Survey Response Rate.** (If an agent has 5.0 avg but only 2% response rate, flag it).
  *   *For Tactic 3:* **Refund/Credit Authorization Rate.** (Monitor outliers).

  **5. Stakes Calibration**
  *   Tying comp directly to CSAT is dangerous. It should be a threshold (must be > 4.0) rather than a ladder (more is always better).

  **Verdict:** **Go with Guardrails.**
  CSAT is better than "Tickets Closed," but it is still gameable.

  **The Argument for your Boss:**
  > "CSAT is a better measure of quality than volume, but if we make it the primary target, we risk agents cherry-picking easy tickets to protect their score, leaving our power users stuck in the queue. I propose we adopt CSAT, but we must cap its influence on comp and pair it with a 'Ticket Age' guardrail. This ensures we aren't trading speed for happiness, or happiness for selectivity."

  ---

  ### Case Study B: Content Team
  **Proposal:** Measure success on "Average Time on Page."
  **Stakes:** High (Quarterly OKR for the department).

  **1. Goal vs. Proxy**
  *   **True North:** Users find content valuable and actionable.
  *   **Proxy:** Average Time on Page.

  **2. Path of Least Resistance**
  *   *Tactic 1:* Write longer, fluffier intros.
  *   *Tactic 2:* Make the text harder to scan (walls of text).
  *   *Tactic 3:* "Clickbait" titles that promise more than the content delivers (users stay longer trying to find the point).
  *   *Tactic 4:* Remove internal links that let users navigate away quickly.

  **3. Stupid Bot Test**
  *   A bot would insert a 5-minute auto-play video at the top of the page, or disable the scroll bar, forcing the user to wait before they can leave.

  **4. Guardrails**
  *   *Counter-Metric:* **Bounce Rate.** (Problem: Time on Page + Low Bounce Rate could just mean they are confused).
  *   *Counter-Metric:* **Return Visitor Rate.** (If they hate it, they won't come back).
  *   *Counter-Metric:* **Scroll Depth.** (Did they actually read it?)
  *   *Issue:* Even with these, "Time" is fundamentally flawed. A user finding an answer in 30 seconds is a *success*, but this metric marks it as a *failure*.

  **5. Stakes Calibration**
  *   High Stakes OKR. This is dangerous.

  **Verdict:** **No-Go (Kill the Metric).**
  The alignment between "Time" and "Value" is too weak. In some contexts (video), time is good. In content (docs/blog), speed-to-answer is often the goal.

  **The Argument for your Boss:**
  > "Time on Page conflates 'engagement' with 'confusion.' If a user finds their answer in 30 seconds, that's a win for us, but this metric penalizes it. If we target this, the team will be incentivized to write fluff to keep users stuck on the page, which increases churn long-term.
  >
  > Instead, I propose we measure **'Return Rate'** or **'Task Completion'** (via survey or click-through). If we must use engagement, let's use **Scroll Depth + Click-Through Rate**. This aligns the team with *value*, not *duration*."

  ---

  ### Summary for your next meeting
  When you pull this out, don't frame it as "Goodhart's Law." Frame it as **"Incentive Risk Assessment."**

  1.  **Acknowledge the need for metrics:** "We need to measure progress."
  2.  **Highlight the gap:** "There is a gap between this number and the actual value."
  3.  **Propose the safety net:** "Here are the guardrails that prevent the team from optimizing the number at the expense of the customer."
  4.  **Offer the alternative:** "If we can't guardrail it, here is a metric that is harder to game."

  This moves you from the person saying "No" to the person saying "Let's do this safely."
