  Based on the seven verdicts you've collected, your friend is oscillating between two distinct philosophical frameworks. Here is the reverse-engineering of her position, the prediction for the new case, and the test to settle it.

  ### The Two Rules

  **Rule 1: Non-Branching Psychological Continuity (The "Causal" Rule)**
  *   **Principle:** You survive as long as your psychology (memories, personality, traits) is causally connected to your previous state in a unique, one-to-one chain.
  *   **Substrate:** Irrelevant. Silicon, biology, or computer code doesn't matter, only the preservation of the pattern and the causal link.
  *   **How it fits her verdicts:** It explains why she accepts the Standard Teletransporter (causal link preserved), Gradual Replacement (continuous causal link), and Amnesia (personality/causal link intact). It explains the Fission/Branching rejections via the "Non-Branching" constraint (identity cannot split).
  *   **The Tension:** To make this fit her rejections of *Instant Neuron Replacement* and *Uploading*, she has to argue that those processes break the causal chain (e.g., calling them "copies" or "simulations" implies the causality is wrong, even if the psychology is identical).

  **Rule 2: Gradualist Embodiment (The "Substrate" Rule)**
  *   **Principle:** You are your living organism. You can change your material composition, but only if the change is **gradual** enough to maintain the continuity of the life process. Sudden changes or transfers to non-biological mediums break identity.
  *   **Substrate:** Highly Relevant. Biology is the default; silicon is only acceptable if integrated slowly (Ship of Theseus style).
  *   **How it fits her verdicts:** It explains why she accepts Gradual Replacement (slow change) but rejects Instant Replacement (abrupt change). It explains why she rejects Uploading (non-biological simulation) but accepts the Standard Teletransporter (biological reconstruction).
  *   **The Tension:** To make this fit her acceptance of the *Standard Teletransporter*, she has to treat "Teleportation" as a special case of biological transport, distinct from "Copying" or "Simulation."

  ### Which Rule Is She Actually Running?

  She is almost certainly running **Rule 2 (Gradualist Embodiment)**.

  **Why?**
  If she were running Rule 1 (Causal), she would have no consistent reason to reject *Instant Neuron Replacement* or *Uploading* provided the psychology was perfectly preserved. The fact that she explicitly distinguishes between **Gradual** Silicon (Survive) and **Instant** Silicon (Die) proves that **speed/continuity of change** is a primary variable for her, not just causal psychology.

  Furthermore, her distinction between the Standard Teletransporter (Bio, Survive) and Uploading (Computer, Die) shows she cares about the **output substrate**. Rule 1 is substrate-neutral; Rule 2 is substrate-sensitive. Her verdicts are substrate-sensitive.

  ### Prediction: The Silicon Teletransporter

  **Verdict:** **You Don't Survive.**

  **Reasoning:**
  This case combines the two features she consistently rejects:
  1.  **Instant/Substrate Discontinuity:** Like the *Instant Neuron Replacement*, this is a sudden switch to a silicon substrate, not a gradual integration.
  2.  **Simulation/Non-Bio Output:** Like the *Upload* case, the resulting entity is a silicon construct, which she has already labeled a "simulation" rather than a person when the original is destroyed.

  Even though it uses the "Teletransporter" mechanism she likes, she likes that mechanism *because* it produces a biological body. By changing the output to silicon, she will likely categorize it with the Upload/Instant Swap cases rather than the Standard Teletransporter case.

  ### The Decisive Test Case

  To cleanly settle whether she is committed to **Rule 1 (Causal)** or **Rule 2 (Gradualist)**, you need to isolate the **Speed** variable from the **Substrate** variable.

  **The Case: The "Instant Biological Swap"**
  > "Imagine a machine hovers over your head. In one millisecond, it replaces every atom in your biological brain with a perfect, fresh biological duplicate. You are not destroyed, you are not teleported, you stay in the chair. The new atoms are arranged exactly like the old ones. Your psychology is uninterrupted."

  *   **Rule 1 (Causal) says:** **You Survive.** The psychological continuity is unbroken, the causal link is preserved, and the substrate is still biological.
  *   **Rule 2 (Gradualist) says:** **You Die.** Even though the material is biological, the *change was instant*. She rejected Instant Silicon Swap because it was instant; if she is a true Gradualist, she must reject Instant Biological Swap too.

  **How to interpret her answer:**
  *   If she says **"Survive"**: She is not a true Gradualist. She is a **Biological Essentialist** (Bio matter is magic, speed doesn't matter). This aligns closer to Rule 1's permissiveness but adds a bio-constraint.
  *   If she says **"Die"**: She is a consistent **Gradualist (Rule 2)**. This confirms that her acceptance of the Standard Teletransporter is a specific exception for "transport," and her core principle is that *identity requires gradual continuity of process*, regardless of substrate.
