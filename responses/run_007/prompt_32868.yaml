answer: |-
  # Lesson Plan: The Stewardship Simulation
  **Course:** Upper-Level Environmental Ethics Seminar
  **Topic:** Habitat Preservation vs. Individual Welfare (Wild Animal Suffering)
  **Time:** 75 Minutes
  **Class Size:** 18 Students (6 Groups of 3)

  ## Learning Objectives
  1.  To disrupt the assumption that "ecosystem health" and "individual welfare" are perfectly aligned.
  2.  To experientially demonstrate the trade-off between holistic environmental values and negative utilitarian concerns.
  3.  To prepare the ground for a philosophical discussion on the non-identity problem and the moral status of wild nature.

  ## Materials Needed
  *   **6 Group Packets:** Each containing 3 "Land Use Cards" (Wilderness, Agro-Ecological, Settlement) and 3 "Round Scorecards."
  *   **Whiteboard/Projector:** For aggregating group decisions.
  *   **Timer:** Visible to the class.

  ---

  ## Part 1: Setup & Round 1 (15 Minutes)

  **1. The Frame (2 Minutes)**
  *   **Instructor Script:** "Welcome. Today you are not students; you are members of a Regional Stewardship Commission. Your task is to allocate 10 parcels of land in a developing region. You will make these decisions in three rounds. In each round, you will be given a specific mandate and a set of metrics. Your goal is to maximize the score for that mandate. Do not discuss the ethics of the mandate yet; simply follow the instructions to maximize the score."
  *   **Constraint:** Do not use the words "suffering," "pain," or "wild animal." Use "Experiential Metrics" or "Sentient Balance."

  **2. Round 1: The Ecological Mandate (8 Minutes)**
  *   **Instruction:** "Your mandate is to maximize **Ecological Integrity (EI)**. This measures biodiversity, biomass, and ecosystem complexity."
  *   **The Cards (Data provided to students):**
      *   **Type A (Wilderness Reserve):** EI Score: +10 per parcel. *Flavor Text:* "Pristine habitat. High species density. Natural processes unchecked."
      *   **Type B (Agro-Ecological):** EI Score: +4 per parcel. *Flavor Text:* "Mixed use. Moderate biodiversity."
      *   **Type C (Human Settlement):** EI Score: 0 per parcel. *Flavor Text:* "Developed land. Low biodiversity."
  *   **Task:** Groups decide how to allocate their 10 parcels.
  *   **Expected Outcome:** Almost every group will choose 10x Type A (Wilderness).
  *   **Record:** Write group totals on the board. (Total EI will be high).

  **3. Round 2: The Sentient Mandate (5 Minutes)**
  *   **Instruction:** "New directive from the UN. We must now account for the **Net Experiential Balance (NEB)**. This measures the sum of positive experiences (satiety, comfort) minus negative experiences (stress, injury, hunger) for all sentient beings on the land."
  *   **The Reveal (Hand out updated Card Backs):**
      *   **Type A (Wilderness):** NEB Score: **-15 per parcel.** *New Data:* "High population density leads to high competition. 60% juvenile mortality. High parasitic load. Frequent predation events."
      *   **Type B (Agro-Ecological):** NEB Score: **-2 per parcel.** *New Data:* "Predators removed. Veterinary care for domesticates. Lower wild population density."
      *   **Type C (Human Settlement):** NEB Score: **+1 per parcel.** *New Data:* "Few wild animals. Humans and pets have high welfare security."
  *   **Task:** Re-allocate the 10 parcels to maximize NEB.
  *   **Expected Outcome:** Groups will pivot sharply toward Type C (Settlement) or Type B.
  *   **Record:** Write group totals on the board. (Total NEB will be negative for those who stuck with Wilderness).

  ---

  ## Part 2: Round 3 & The Crisis (20 Minutes)

  **1. The Constraint (5 Minutes)**
  *   **Instruction:** "Round 3. You must now satisfy *both* mandates simultaneously. You have a budget constraint. You must select a portfolio of 10 parcels that achieves an **Ecological Integrity (EI) of at least 60** while maximizing **Net Experiential Balance (NEB)**."
  *   **The Math:**
      *   To get EI 60, they need at least 6 parcels of Type A (6 x 10 = 60).
      *   This forces them to accept the negative NEB associated with Type A.
      *   Remaining 4 parcels can be Type C to boost NEB.
  *   **Task:** Groups deliberate on the compromise.

  **2. Group Deliberation (10 Minutes)**
  *   Circulate among groups. Listen for friction.
  *   *Prompt if stuck:* "Are you required to maximize the score, or are you allowed to question the metrics?" (Most will try to solve the math).

  **3. Aggregation (5 Minutes)**
  *   Collect the final scores.
  *   **Instructor Action:** Calculate the "Total Suffering Deficit" on the board. Show that meeting the Environmental Integrity mandate *requires* accepting a massive Negative Experiential Balance.
  *   **Key Visual:** Draw a seesaw. On one side "Ecosystem Health," on the other "Individual Welfare." Show them tipping in opposite directions.

  ---

  ## Part 3: The Debrief (40 Minutes)

  *Note: This is where the phrase "Wild Animal Suffering" is introduced.*

  **Phase 1: Phenomenology (10 Minutes)**
  *   **Q:** "In Round 1, how did you feel about your decision?" (Likely: Good, righteous, standard env ethics).
  *   **Q:** "In Round 2, what happened when you saw the NEB data?" (Likely: Shock, confusion, resistance).
  *   **Q:** "Did anyone feel morally compromised in Round 3? Why?"
  *   **Goal:** Validate the discomfort. The goal is not to resolve it, but to sit with it.

  **Phase 2: Philosophical Mapping (20 Minutes)**
  *   **Concept 1: Holism vs. Individualism.**
      *   *Map:* EI Score = The Land Ethic (Leopold), Intrinsic Value of Species (Rolston).
      *   *Map:* NEB Score = Animal Ethics (Singer, Regan), Welfare Utilitarianism.
      *   *Discussion:* "We usually assume these align. The simulation suggests they diverge. If 'Nature' is valuable, but 'Nature' creates negative welfare, which moral patient matters more?"
  *   **Concept 2: Aggregation and Scale.**
      *   *Map:* The NEB score was negative because of *volume*.
      *   *Discussion:* "A single predation event is tragic. A million predation events are a statistical metric. Does the sheer number of wild animals change our obligation? Is it better to have 1,000 happy animals or 1,000,000 animals where 90% suffer?"
  *   **Concept 3: The Non-Identity Problem.**
      *   *Map:* Type C (Settlement) results in fewer animals existing.
      *   *Discussion:* "If you choose Settlement, the animals that *would* have lived in the Wilderness never exist. Have you harmed them? Or is non-existence preferable to a life of net suffering? (Reference Benatar's asymmetry)."
  *   **Concept 4: The "Wild Animal Suffering" Hypothesis.**
      *   *Reveal:* "The NEB metric represents what philosophers call **Wild Animal Suffering**. The argument is that natural selection optimizes for fitness, not welfare. A 'thriving' ecosystem is often a engine of pain."

  **Phase 3: Limitations & Risks (10 Minutes)**
  *   **Instructor Script:** "I want to be clear: This simulation is a philosophical toy, not a policy blueprint. We must identify where it breaks down."
  *   **Prompt:** "Why might this calculation be wrong in the real world?"
  *   **Anticipated Student Pushback (Guide them here):**
      1.  *Epistemic Uncertainty:* "Do we actually know wild lives are net negative? Maybe the joy of hunting/freedom outweighs the pain." (Acknowledge: We don't have a hedonimeter).
      2.  *Ecological Collapse:* "If we choose Settlement (Type C), do we risk climate collapse that hurts everyone later?" (Acknowledge: The simulation ignored long-term systemic risk).
      3.  *Non-Sentient Value:* "Does the forest have value even if no one is in it to feel it?" (Acknowledge: The simulation only counted sentient welfare).
      4.  *The "Yuck" Factor:* "It feels repulsive to calculate suffering this way." (Acknowledge: This is a feature, not a bug. It challenges the 'romantic' view of nature).

  ---

  ## Instructor's Guide: Risk Management

  **Risk 1: Students refuse to engage with the "Suffering" premise.**
  *   *Sign:* Students argue that "Nature is balanced" or "Predation isn't suffering."
  *   *Response:* "In the simulation, the data *stipulates* the negative balance. For the sake of the argument, accept the premise: What if the data *is* right? What does that do to your ethics?"

  **Risk 2: Students conclude we should bulldoze all forests.**
  *   *Sign:* "So the right answer is Type C, obviously."
  *   *Response:* "The simulation isolated one variable (welfare). In reality, Type C might cause human suffering, climate collapse, or loss of scientific knowledge. The point is not that Development is *good*, but that Preservation is not *unqualifiedly good*."

  **Risk 3: Emotional Distress.**
  *   *Sign:* Students become visibly upset by the implication of mass suffering.
  *   *Response:* Validate. "This is one of the most disturbing arguments in environmental ethics. If it doesn't disturb you, you aren't paying attention. We study this not to induce despair, but to ensure our moral commitments are consistent."

  **Risk 4: The "Intervention" Trap.**
  *   *Sign:* "Can't we just fix the Wilderness? Remove predators?"
  *   *Response:* "That is the next logical step (Welfare Biology). But for today, stick to the Land Use choice. Intervention has its own ethical costs (hubris, unintended consequences)."

  ## Closing Statement (To end class)
  "Next week, we will read Oscar Horta and Ezequiel Paez on 'Welfare Biology.' Today, you felt the tension between the Green World and the Suffering World. Your homework is not to solve it, but to write one page on which metric—Ecological Integrity or Experiential Balance—you would prioritize if you were forced to choose, and why."

  ---

  ## Appendix: Card Data for Packets

  **Type A: Wilderness Reserve**
  *   **Ecological Integrity:** +10
  *   **Net Experiential Balance:** -15
  *   **Notes:** High biomass. r-selected species dominate. 80% of individuals die within first month of life. High disease prevalence.

  **Type B: Agro-Ecological**
  *   **Ecological Integrity:** +4
  *   **Net Experiential Balance:** -2
  *   **Notes:** Large mammals removed. Insect populations managed. Domestic animals present (veterinary care).

  **Type C: Human Settlement**
  *   **Ecological Integrity:** 0
  *   **Net Experiential Balance:** +1
  *   **Notes:** Wild sentient life minimal. Human/pet welfare high. Infrastructure prevents natural hazards.
