      *   *Do philosophers still debate this?* Yes. The "Evolutionary Debunking Argument" is a major topic in philosophy of religion and epistemology.
      *   *What are the counter-arguments?*
          1.  Genetic Fallacy (Origin $\neq$ Truth).
