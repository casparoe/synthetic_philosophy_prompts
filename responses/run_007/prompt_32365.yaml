answer: |-
  This is one of the central and most persistent problems in the philosophy of biology. You have put your finger on the tension between the *mechanistic* worldview of modern science (blind causation) and the *teleological* language that biologists cannot seem to live without (purpose, function, design).

  As a philosopher of biology and mind, I will start by doing exactly as you ask: disentangling the senses of "reason" at play here. Only then can we name the phenomenon, assess its legitimacy, and draw its boundaries.

  ### 1. Triangulating "Reason"

  When we say "The reason the chick shoves the egg is to remove competitors," we are sliding between three distinct concepts. Confusion arises when we treat them as identical.

  **A. The Psychological (Motivating) Reason**
  This is the domain of the philosophy of mind. A psychological reason is a mental state (a belief, desire, or intention) that represents a goal and causes an action *because* of that representation.
  *   *Example:* I open the fridge *because I want* a snack and *believe* there is one inside.
  *   *Status in your cases:* Absent. The cuckoo chick has no concept of "competitor" or "food supply."

  **B. The Normative (Justificatory) Reason**
  This is a reason why an action *ought* to be performed, regardless of whether the agent knows it. It appeals to rationality or value.
  *   *Example:* The reason to vaccinate is to prevent disease spread. (This holds true even if a specific person refuses the vaccine).
  *   *Status in your cases:* Partially present, but tricky. Evolution is not normative; it does not deal in "oughts." However, it does deal in "fitness optimality."

  **C. The Explanatory (Etiological) Reason**
  This is a fact about the world that explains why a phenomenon exists or occurs. In biology, this is often a historical fact about consequences.
  *   *Example:* The reason the heart beats is that pumping blood keeps the organism alive.
  *   *Status in your cases:* **This is what the biologist is using.**

  The puzzle you identify is this: Biologists use **Explanatory Reasons** that structurally mimic **Psychological Reasons**, yet they deny the existence of a mind to hold them. They claim the "reason" (the fitness benefit) is causally efficacious in bringing the trait into existence, even though it lies in the future relative to the individual's development, or in the past relative to the species' history.

  ### 2. Naming the Phenomenon

  There is no single term that captures every nuance you describe, but there are three overlapping concepts that, together, name this beast.

  **1. Teleonomy**
  Coined by biologists like Ernst Mayr and Colin Pittendrigh in the 1950s, this is the standard biological term. *Teleology* implies an intrinsic purpose or end-goal (often implying a designer). *Teleonomy* implies goal-directedness that is derived from a program or a history of selection.
  *   *Verdict:* This captures the "mindless goal-directedness," but it describes the *system*, not the status of the "reason" itself.

  **2. The Etiological Account of Function**
  Proposed by philosophers like Larry Wright, Ruth Millikan, and Karen Neander. This theory states that the "function" (and thus the "reason") of a trait is defined by the **consequences for which it was naturally selected.**
  *   *Verdict:* This grounds the legitimacy. The "reason" is the past fitness consequence that caused the gene to proliferate.

  **3. Free-Floating Rationale**
  This is the term coined by Daniel Dennett (philosophy of mind/biology). He argues that natural selection creates "competence without comprehension." The "reason" exists in the environment as a design pressure, not in the agent's head.
  *   *Verdict:* **This is the closest fit for your specific query.** It captures the idea of a "reason" that is real and explanatory but unrepresented by any agent.

  ### 3. Is it Legitimate or Mere Metaphor?

  You ask if this is just a manner of speaking. For a long time, logical positivists argued it was merely heuristic—a useful shorthand for complex mechanical laws. However, the consensus in contemporary philosophy of biology is that **it is legitimate and indispensable.**

  Here is why it is not just metaphor:

  **The Causal Power of Consequences**
  In standard physics, causes precede effects. In evolutionary explanation, a *future-looking* consequence (survival) explains a *current* trait. How is this possible without magic?
  It is possible because the "reason" refers to a **historical feedback loop**.
  1.  Ancestor A had trait T.
  2.  Trait T caused consequence C (e.g., fewer competitors).
  3.  Consequence C led to A's increased reproduction.
  4.  Therefore, T is present in the current chick.

  When the biologist says, "The reason is to remove competitors," they are abbreviating this causal history. The "reason" is real because the *selection pressure* was a real physical constraint in the past. If the chick did *not* shove the eggs, and that behavior had *not* conferred an advantage in the past, the chick would not exist to do anything.

  Therefore, the "reason" is not a mental state; it is a **relational property between the organism and its selective history.** It is as real as the erosion that shapes a canyon, but with the added complexity of replication.

  ### 4. Drawing the Boundaries

  This is where the philosophy gets sharp. If "reasons without reasoners" are real, why doesn't the rock fall "in order to" reach the ground? And what about traits that turn out to be useful only later?

  **Boundary 1: The Rock (Physics vs. Biology)**
  A rock falls due to gravity. We can explain this mechanistically. But can we say it falls *in order to* minimize potential energy?
  *   **The Distinction:** The rock lacks a **feedback loop of replication.**
  *   When a cuckoo chick shoves an egg, it is part of a lineage where previous shovers out-reproduced non-shovers. The "reason" is encoded in the gene frequency of the population.
  *   When a rock falls, there is no population of rocks where "better falling rocks" make more rocks. There is no selection history.
  *   *Rule:* A "reason without a reasoner" requires **Natural Selection.** Without a history of differential retention based on consequences, there is no teleology, only mechanics.

  **Boundary 2: Retrospective Benefit (Adaptation vs. Exaptation)**
  You asked about a trait whose benefit is only visible in retrospect. Suppose a bird has a colorful crest originally selected for mating, but it later turns out the crest also camouflages them against predators.
  *   Is the "reason" for the crest now camouflage?
  *   **The Etiological Answer:** No. According to Millikan and Neander, the *proper function* (the real "reason") is determined by what it was *selected for*, not what it *currently does*.
  *   The camouflage is a **beneficial effect**, but not the **function**. If you say the "reason" is camouflage, you are lying about the history.
  *   *Rule:* The "reason" is tied to the **history of selection**, not current utility. This prevents the theory from collapsing into "everything happens for a reason" panpsychism.

  ### 5. A Proposed Definition

  To capture the combination of realism and mindlessness you are pointing at, I propose we refine Dennett's term. Let us call this **Selection-Historical Teleonomy.**

  We can define it as follows:

  > A **Selection-Historical Reason** exists for a trait or behavior *T* in organism *O* if and only if:
  > 1.  **Contribution:** *T* contributes to a specific outcome *C* (e.g., survival, reproduction).
  > 2.  **History:** *T* exists in *O* primarily because ancestors of *O* possessing *T* achieved *C* at a higher rate than those without *T*.
  > 3.  **Mindlessness:** Neither *O* nor the causal process (natural selection) represents *C* as a goal.

  **Why this definition works:**
  *   It validates the biologist's claim (the reason is real because the history is real).
  *   It excludes the rock (no replication/history).
  *   It excludes retrospective benefits (exaptations fail condition 2).
  *   It excludes psychological reasons (condition 3).

  ### 6. Conclusion: The Space of Reasons vs. The Space of Causes

  In philosophy of mind, Wilfrid Sellars distinguished the "Space of Causes" (physical laws) from the "Space of Reasons" (justification and logic). Your intuition is that evolutionary biology creates a **bridge** between these two spaces.

  The "reason" the chick shoves the egg is a **causal reason that wears the clothes of a justificatory reason.** It is legitimate because evolution is the only blind process we know of that accumulates "knowledge" (adaptations) about the world without a knower.

  So, to answer your final question: It is not metaphor. It is **derived intentionality.** The intentionality (the "aboutness" or "for-ness") of the chick's behavior is derived from the "intentionality" of the selection process over deep time. The environment "selected for" the behavior, acting as a filter that preserves "reasons" even in the absence of a mind to think them.

  When you hear a biologist give a "reason" for a mindless trait, they are speaking of a **causal history that is structured like a rationale.** That is the precise ontological category you are looking for.
