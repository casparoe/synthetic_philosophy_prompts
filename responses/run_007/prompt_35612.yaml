answer: |-
  You are not wrong. In fact, from an engineering, legal, and safety compliance standpoint, **you are objectively right and your brother-in-law is objectively wrong.**

  This is not a matter of opinion or "health and safety bore" pedantry; it is a matter of physics and risk management. Here is the breakdown of why your intuition is correct, why his reasoning is flawed, and how to handle the conversation.

  ### 1. The Engineering Reality: Prevention vs. Mitigation
  Your brother-in-law is confusing **prevention** with **mitigation**.

  *   **The PRV (Pressure Relief Valve):** This is a *preventative* control. Its job is to ensure the tank never reaches the pressure where it might fail. It keeps the system within its safe operating envelope.
  *   **The Blast Sleeve:** This is a *mitigating* control. Its job is to reduce the consequences *after* a catastrophic failure has already occurred. It is designed to contain shrapnel and liquid if the tank explodes.

  **The Flaw:** Relying on the blast sleeve to keep you safe is like driving a car with no brakes because you're wearing a seatbelt. The seatbelt (sleeve) will help you survive the crash, but the brakes (PRV) prevent the crash from happening in the first place.

  ### 2. The "Normalization of Deviance"
  Your brother-in-law is exhibiting a classic safety psychology phenomenon called the **Normalization of Deviance**. This happens when a team experiences a near-miss or a safety violation (the pressure spiking), nothing bad happens (the sleeve holds), and they conclude that the risk is lower than it actually is.

  *   **Metal Fatigue:** Pressure vessels are subject to fatigue. Every time that tank over-pressurizes, the metal stretches microscopically. It might hold the first ten times, but the eleventh time could be the time the metal yields and ruptures.
  *   **The Sleeve's Limit:** Blast sleeves are rated for specific energy levels. If the tank fails violently enough, or if the sleeve has degraded (UV exposure, chemical spills, wear and tear), it may not hold the next time.
  *   **The PRV is the Law:** In almost every jurisdiction (ASME in the US, PED in the EU, PSSR in the UK), a pressure vessel *must* have a functioning relief device. Operating without one is likely illegal.

  ### 3. What Would Change My Mind?
  You asked what argument or fact would flip me to the other side. **There is none.**

  In safety engineering, there are "hard constraints." A pressure vessel without a functioning relief valve is a bomb waiting for a trigger. The only thing that would change the risk profile is **repairing the valve.**

  My reasoning would only break down if:
  1.  **The tank is not actually a pressure vessel:** If it is an atmospheric tank (open to air) and the "pressure" is negligible, the rules change. But conditioning tanks are pressure vessels.
  2.  **The PRV isn't faulty:** If a pressure test proved the valve opens at the correct set pressure, the risk is mitigated.
  3.  **The tank is taken out of service:** If the tank is drained, depressurized, and locked out until fixed, it is safe.

  As long as the tank is in service, pressurized, and the PRV is faulty, the situation is inherently dangerous. No amount of argumentation can change the physics of stored energy.

  ### 4. The Argument That Might Work (Insurance & Liability)
  Since appealing to "safety" is making you look like a bore, you need to appeal to **money and liability.** Family businesses often respond better to financial risk than abstract safety risk.

  *   **Insurance Voidance:** If that tank fails and injures someone (or even just damages the brewery), the insurance company will send an adjuster. The first thing they will check is the safety valve logs and condition. If they find a knowingly faulty PRV, **they will deny the claim.** The brewery could be bankrupted overnight.
  *   **Criminal Liability:** In many places, if someone is injured due to knowingly faulty safety equipment, the owner can face criminal negligence charges, not just civil lawsuits.
  *   **The "Bore" Reframe:** Tell him: *"I don't care about the paperwork. I care that if this blows, the insurance company won't pay, and you'll lose the brewery. I'm not being a safety bore; I'm protecting your asset."*

  ### 5. Summary of the Risk
  *   **Current State:** High-energy stored pressure + No primary safety release + Reliance on secondary containment + Metal fatigue accumulation.
  *   **Potential Outcome:** Catastrophic rupture. A blast sleeve contains shrapnel, but the shockwave and the sudden release of CO2/liquid can still cause structural damage, hearing loss, or injury to anyone standing near the tank (e.g., during sampling).
  *   **Verdict:** **Do not use the tank.**

  ### Recommendation
  1.  **Tag it Out:** Put a "DO NOT USE" tag on the tank immediately.
  2.  **Fix the Valve:** PRVs are not usually incredibly expensive compared to the cost of a lawsuit or a new tank. Get a certified technician to replace or repair it.
  3.  **Document It:** Once fixed, get the certification paperwork. This proves due diligence to insurers.

  You are right to be worried. Please do not let the family dynamic pressure you into accepting a known mechanical failure on a pressure vessel. This is one of those rare cases where being the "bore" is the only professional choice.

