answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in jurisprudence regarding language, often framed as the debate between H.L.A. Hart (who argues for "open texture," closely allied with supervaluationism) and legal formalists (who often tacitly rely on something like epistemicism).

  The inconsistency you notice—between striking down laws for vagueness and ruling on vague terms as if they have determinate answers—is not a bug in the legal system; it is a feature of how law manages semantic indeterminacy.

  Here is a reconstruction of the implicit theory, an analysis of how the two semantic views fit, and a stand on which best explains legal practice.

  ### 1. Reconstructing the Implicit Theory: "Institutional Precification"

  Legal practice does not strictly presuppose a pure semantic theory. Instead, it operates on a hybrid model we might call **Institutional Precification**.

  *   **Strict Presupposition:** The law presupposes that for the purpose of *dispute resolution*, every case must yield a binary outcome (liable/not liable, guilty/innocent). There is no legal equivalent of a truth-value gap in the verdict.
  *   **Loose Fit:** The law speaks *as if* meanings are fixed (Epistemicism) to maintain authority and stability, but it functions *as if* meanings are flexible (Supervaluationism) to allow for adaptation and discretion.

  The "Void-for-Vagueness" doctrine and ordinary adjudication seem inconsistent only if you assume the law is trying to describe pre-existing semantic facts. If you view the law as a **normative system for guiding conduct and resolving disputes**, the tension dissolves.

  ### 2. Analyzing Epistemicism in Law

  **The Fit:**
  Epistemicism fits the **rhetoric** of adjudication perfectly. When a judge writes, "A bicycle *is* a vehicle under this statute," they speak as if they are reporting a fact. It also intuitively supports the **Void-for-Vagueness** doctrine: if a sharp boundary exists but is unknowable to the citizen, punishing them for crossing it violates Due Process (fair notice).

  **The Fatal Flaw:**
  Epistemicism creates a severe problem for *stare decisis* (precedent).
  If the boundary of "vehicle" was sharp all along, then the Supreme Court case deciding whether a bicycle is a vehicle was merely *discovering* that fact. But if it was a fact all along, why did the lower courts get it wrong? And more importantly, if the boundary was unknowable to the citizen (hence Void-for-Vagueness concerns), how is it suddenly knowable to the judge years later?
  Epistemicism implies the judge has magical access to semantic facts that the citizen lacked. This makes the law look arbitrary: "The boundary was always there, you just couldn't see it, but I can, so I'm punishing you."

  ### 3. Analyzing Supervaluationism in Law

  **The Fit:**
  Supervaluationism fits the **mechanism** of adjudication. H.L. Hart called this the "open texture" of law. In the "core" of meaning (a Ford F-150 is a vehicle), the law is determinate (true on all precisifications). In the "penumbra" (a bicycle), it is indeterminate.
  When a court rules on a penumbral case, they are not discovering a truth; they are **selecting a precisification**. By ruling that a bicycle *is* a vehicle, the court eliminates the precisifications where it isn't. For all future cases, the boundary is sharp. This explains how vague laws become precise over time through litigation.

  **The Tension:**
  Supervaluationism struggles with the **rhetoric of legitimacy**. Judges rarely say, "The law was gappy, so I am exercising discretion to fill it." They say, "The law requires this." Admitting the gap undermines the claim that judges are bound by the law rather than their own will.
  Regarding **Void-for-Vagueness**: A supervaluationist must argue that a law is void not because boundaries are unknowable, but because the *range of acceptable precisifications* is too wide to guide conduct. If "reasonable" could mean anything from "1 mph" to "100 mph," the set of admissible precisifications is too broad for fair notice.

  ### 4. Reconciling Void-for-Vagueness with Adjudication

  The two practices are consistent under a **Supervaluationist framework**, provided we understand Void-for-Vagueness as a constraint on the *range of admissible precisifications*.

  *   **Ordinary Adjudication:** The statute uses a vague term. The range of acceptable precisifications is narrow enough that the court can select one without violating legislative intent. The court picks one, and *stare decisis* locks it in.
  *   **Void-for-Vagueness:** The statute is so vague that the range of acceptable precisifications is massive. To pick *any* precisification would be to legislate from the bench rather than interpret. Therefore, the court refuses to select a precisification and strikes the law down.

  **Example:**
  *   *Case A:* "No vehicles in the park." Is a bicycle a vehicle? (Borderline). The court selects a precisification based on safety concerns. Valid.
  *   *Case B:* "No loitering." (Undefined). Does standing for 1 minute count? 10 minutes? Looking at a shop window? The range of precisifications is so vast that a citizen cannot guess which one the police will enforce. Void.

  ### 5. The Stand: Supervaluationism Best Explains Practice

  I argue that **Supervaluationism (specifically the Hartian "Open Texture" variant)** is the superior explanation of legal practice, despite the Epistemic rhetoric.

  **Why?**
  1.  **The Function of Precedent:** If Epistemicism were true, precedent would be merely evidentiary (helping us find the hidden boundary). In reality, precedent is **constitutive**. A Supreme Court ruling *makes* it the case that a bicycle is a vehicle for the purposes of the law. This is the definition of precisification by fiat.
  2.  **Distinguishing Easy vs. Hard Cases:** Legal practice distinguishes between "clearly covered" cases and "hard cases." Epistemicism says all cases are equally determined (we just don't know the hard ones). Supervaluationism explains the phenomenological difference: in easy cases, all precisifications agree; in hard cases, they diverge, requiring judicial choice.
  3.  **Legislative Intent:** Legislators often *use* vagueness intentionally (e.g., "reasonable care") to delegate authority to courts to flesh out the details later. This only makes sense if the meaning is to be supplied later (Supervaluationism), not if the meaning was fixed but hidden at the time of drafting (Epistemicism).

  ### 6. Counterfactuals: What if the Theory Switched?

  **If Legal Practice Adopted Explicit Epistemicism:**
  *   **Judicial Humility:** Judges would have to admit that in borderline cases, they are guessing at a hidden boundary. This would undermine the authority of rulings.
  *   **Retroactivity Issues:** If the boundary was always sharp, punishing someone before the court "found" the boundary is arguably *ex post facto* punishment. Explicit Epistemicism would force courts to rule that borderline conduct *cannot* be punished until the boundary is publicly identified.
  *   **Void-for-Vagueness Expansion:** Almost all vague laws would be vulnerable. If the boundary is unknowable, *no* citizen has fair notice. The legal system would collapse into hyper-specific statutes.

  **If Legal Practice Adopted Explicit Supervaluationism:**
  *   **Candor in Opinions:** Judges would write: "The term 'vehicle' does not semantically determine this outcome. However, given the purpose of the statute, we select the precisification that includes bicycles." (Justice Scalia often hinted at this; Justice Breyer often embraces it).
  *   **Increased Focus on Policy:** Since there is no "semantic fact" to find, the debate would shift entirely to the normative reasons for choosing one precisification over another (policy, morality, consequence).
  *   **Stability:** It would clarify that once a court rules, the vagueness is *gone* for that jurisdiction. The gap is filled.

  ### Conclusion

  The legal system is functionally Supervaluationist but rhetorically Epistemic. It needs the Supervaluationist flexibility to allow vague laws to function through judicial precisification, but it needs the Epistemic mask to maintain the illusion that judges are "finding" the law rather than "making" it.

  The Void-for-Vagueness doctrine is the safety valve: it acknowledges that when the range of admissible precisifications is too wide, the judicial power to select one becomes an unconstitutional delegation of legislative power. Your intuition that the practices seem inconsistent is correct, but only if you take the judicial rhetoric literally. Once you view the rhetoric as a legitimizing fiction, the Supervaluationist machinery underneath becomes clear.
