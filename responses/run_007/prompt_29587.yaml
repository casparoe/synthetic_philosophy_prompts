  So me and my buddy Sam were driving back from a wedding last weekend—open bar, so definitely not the best time to get into a decision theory argument, but whatever. He'd been reading that old Piccione and Rubinstein paper about the absent-minded driver, and I'd skimmed some of the Aumann/Hart/Perry response, and suddenly we're on this empty highway at 1 a.m. and every exit looks identical and I'm like "great, this is literally the paradox." We ended up going back and forth for the whole drive home: he kept insisting you have to go with the plan you made before you started the car, because at that point you can see the whole tree and maximize your expected payoff properly, and I kept saying that once you're actually at an intersection and you can't tell which one it is, you can't just blindly follow a plan that gives you a worse expected payoff from your current information set—you have to do what's best given the situation you're actually in, even if that means your ex ante payoff ends up lower. We went round and round and never really settled it, but I think the debate captured the two main lines on this thing really cleanly.

