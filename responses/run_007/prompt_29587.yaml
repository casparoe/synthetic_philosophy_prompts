  The highway was a ribbon of black asphalt unspooling under the headlights, the white lines humming a hypnotic rhythm against the tires. The wedding had been beautiful, but the open bar had been a trap, and now at 1 a.m., the exhaustion was hitting us both like a physical weight. I was driving. Sam was in the passenger seat, staring out at the darkness where every exit sign looked like the last one.

  "It's the topology, Alex," Sam said, rubbing his eyes. "We're in the paradox. Literally."

  "Which one?" I asked, gripping the wheel. "The one where we turn into pumpkins?"

  "Absent-minded driver. Piccione and Rubinstein. We can't distinguish the exits. We have a destination—the hotel—but every off-ramp looks identical. If we exit too early, we're stuck in the industrial park. Too late, we're in the next county."

  "Okay," I said. "So we pick a strategy before we merge onto the highway and stick to it. That's what rational agents do."

  "Exactly," Sam said, perking up. "That's the ex ante perspective. At the start, you see the whole tree. You know there are two intersections. You know the payoffs. You calculate the probability $p$ that maximizes your expected utility over the whole trip, and you commit to it. You don't get to renegotiate at every off-ramp."

  "But that's the thing," I said, signaling left instinctively then correcting back to the lane. "When I'm actually *at* the intersection, I'm not the same agent who started the car. That guy was rested. That guy knew he was at the start. I'm here, in the dark, and I don't know if this is Exit 1 or Exit 2. I have to maximize based on where I am *now*."

  "Where you are *now* is an information set that includes both exits," Sam countered. "You can't condition on being at Exit 2 just because you made it past Exit 1, because your action at Exit 1 determines whether you get to Exit 2. If you change your strategy now, you undermine the calculation you made at the start."

  "But if the calculation I made at the start tells me to do something that looks suboptimal given what I know right now, why would I do it?" I asked. "Imagine we decided at the start we'd continue with probability two-thirds. That's the optimal plan, right? But when I'm sitting at the wheel, staring at the ramp, the conditional probability shifts. Being here makes it more likely I'm at the first exit, because if I were at the second, I would have had to continue at the first. The math changes."

  "The math doesn't change, your conditioning does," Sam said. "And that's the trap P&R identified. If you update your beliefs based on the fact that you're *at* an intersection, you introduce a time inconsistency. You'll want to deviate from the plan. But if you know you're going to deviate, the original plan wasn't rational to begin with."

  "So what's the solution?" I asked. "Just close my eyes and follow a script?"

  "The solution is recognizing that rationality is about choosing a policy, not just an action," Sam said. "You have to choose a strategy that is self-enforcing. If you plan to continue with probability two-thirds, you have to ensure that when you get to the intersection, continuing with probability two-thirds is still the best move given that plan. Aumann and Hart were clear on this. You can't just say 'I'll maximize locally.' You have to maximize globally."

  "But is it really the same 'you'?" I asked. The highway stretched out, endless. "Think about the memory wipe. The guy at the start knows he's at the start. The guy at Exit 1 doesn't know where he is. They have different information sets. They effectively have different utility functions over the immediate choices. Why should the guy at Exit 1 care about the optimization problem of the guy at the start?"

  "Because they're the same person," Sam said firmly. "Same body, same bank account, same wife waiting at the hotel. If the guy at Exit 1 deviates because it looks locally optimal, he screws over the guy at the start. And since you *are* the guy at the start, you screw over yourself."

  "But I'm not him anymore," I said. "His memories are gone. I'm operating on partial information. If I know that whenever I get to an intersection, my local calculation says I should exit with probability one-third, but my ex ante plan said I should exit with probability one-third... wait." I paused, doing the mental arithmetic through the fog. "Actually, the paradox is that the ex ante optimal differs from the action optimal once you update beliefs. If I know I'm going to want to deviate when I get there, can I really commit to the plan?"

  "That's the self-enforcement question," Sam said. "If the plan isn't a Nash equilibrium between your temporal selves, you can't sustain it. You'd need an external commitment device. Like... I don't know, setting the cruise control to skip the first exit."

  "But we don't have cruise control for decisions," I said. "We just have willpower. And willpower is just a prediction of what your future self will do. If my future self sees a better payoff locally, he's going to take it. So the only rational plan is the one my future self won't want to break. Even if that plan gives a lower expected payoff overall."

  Sam sighed, leaning his head against the window. "So you're saying rationality requires you to accept a lower global payoff because your future self is untrustworthy?"

  "I'm saying rationality is situated," I said. "You can't maximize over a tree you can't see. Once you're at the node, the rest of the tree is hypothetical. The only thing that's real is the choice in front of you. If the ex ante plan demands I ignore my current evidence to satisfy a past version of myself who knew more... that feels like superstition. Like sacrificing utility to a ghost."

  "But if everyone did that," Sam said, "if every temporal agent just optimized locally whenever their memory slipped, coordination across time collapses. You become a collection of disjointed selves passing a body around. There's no agency left. Just a chain of reactions."

  "Maybe that's what we are," I said. "Maybe agency is just the story we tell to make the chain feel like a line."

  We passed an exit sign. *Rest Area 2 Miles.* It looked exactly like the one we'd passed ten minutes ago. Or maybe it was the same one.

  "So," Sam said, his voice quieter now. "If we take the next exit, and it's the wrong one, who was wrong? The you who decided to drive, or the you who decided to turn?"

  "Both," I said. "And neither."

  "Great. That's helpful."

  "I'm just saying, if you think the plan is binding, you have to explain why. Is it because it's optimal? Or because you're afraid of who you'll become if you break it?"

  Sam didn't answer immediately. The hum of the tires filled the silence. I kept my hands at ten and two, watching the white lines rush toward us, identical and endless.

  "I don't know," Sam finally said. "But if we miss the exit, I'm blaming the guy who started the car."

  "Fair," I said. "But he's not here anymore."

  We drove on, neither of us willing to signal first, suspended somewhere between the plan and the act, waiting for a landmark that might not exist.
