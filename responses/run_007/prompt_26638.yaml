answer: |-
  # In-Class Game: The Doomsday Protocol

  **Objective:** To move students from intellectually understanding Schelling's concepts to *feeling* the strategic necessity of commitment and brinkmanship.
  **Time:** 50 minutes (Activity) + 30 minutes (Debrief).
  **Class Size:** 16 students (8 pairs).
  **Materials:** Paper slips (half-sheets), pens, 8 coins (or phones with coin flip apps), whiteboard for scoring.

  ## Part 1: Setup and Rules (10 Minutes)

  **1. Pairing and Roles:**
  Divide the class into 8 pairs. Assign one student in each pair as **Challenger (C)** and the other as **Defender (D)**. Have them sit facing each other. Tell them they will play two rounds. Points are cumulative across rounds. The top 3 pairs by total points receive a trivial prize (e.g., extra credit point, candy, or public acclaim). *This inter-pair competition prevents collusion.*

  **2. The Game Board (Draw on Whiteboard):**
  Explain that this is a sequential game of crisis escalation. Write the payoff structure clearly:

  *   **Status Quo:** (0, 0)
  *   **Compromise:** (5, 5)
  *   **C Wins:** (10, 0)
  *   **D Wins:** (0, 10)
  *   **Nuclear War:** (-10, -10)

  **3. The Move Sequence:**
  Hand each pair a **Game Sheet** with three sections. Explain the turns:

  *   **Turn 1 (Challenger):** Choose **Demand** (initiate crisis) or **Pass** (Status Quo).
  *   **Turn 2 (Defender):** If Demand, choose **Accept** (Compromise) or **Resist**.
  *   **Turn 3 (Challenger):** If Resist, choose **Back Down** (D Wins) or **Strike** (Nuclear War).

  **4. The "Physics" of the Game:**
  Emphasize that moves must be written secretly on the slip, then revealed. You (the instructor) are the "enforcer of physics." If a rule says an action leads to War, it leads to War. There is no negotiation after the move is revealed.

  ---

  ## Part 2: Round 1 — The Credibility Trap (15 Minutes)

  **Instructions:**
  "Play the game exactly as written. You are perfectly rational actors. You care only about maximizing your points. You cannot make binding promises outside the sheet. Begin."

  **What Will Happen (Predicted):**
  1.  **Backward Induction:** Students will reason backward. In Turn 3, C compares **Back Down** (0 points) vs. **Strike** (-10 points). A rational C will always **Back Down**.
  2.  **Defender's Move:** D knows C is rational. D compares **Accept** (5 points) vs. **Resist** (leads to C Backing Down -> 10 points). D will always **Resist**.
  3.  **Challenger's Move:** C knows D will Resist and C will Back Down. C compares **Pass** (0 points) vs. **Demand** (leads to 0 points). C is indifferent, but likely **Passes** to avoid risk.
  4.  **Result:** Most pairs end in Status Quo or D Wins. C's threat to Strike is revealed as empty. C feels powerless.

  **Instructor Role:** Circulate. If a pair plays "Strike," ask quietly, "Why did you choose -10 over 0?" If they say "To teach them a lesson," remind them: "You are rational point-maximizers. Punishment is costly." Ensure they log their scores.

  ---

  ## Part 3: Round 2 — The Strategy of Conflict (25 Minutes)

  **Instructions:**
  "Reset scores. We are now in the 'Nuclear Age.' Before Turn 1 begins, the **Challenger** may choose one of two **Strategic Postures**. You must announce this choice to your partner and write it on the sheet *before* the game starts."

  **Option A: The Binding Commitment (The Madman)**
  *   **Rule:** C crosses out the "Back Down" option on Turn 3.
  *   **Consequence:** If D Resists, C *must* Strike. (Instructor enforces this: if the option is crossed out, it does not exist).
  *   **Cost:** If C chooses this, C pays an upfront "Readiness Cost" of -1 point (representing the cost of mobilization).

  **Option B: Brinkmanship (The Threat That Leaves Something to Chance)**
  *   **Rule:** C keeps "Back Down," but if C chooses "Strike," the outcome is **not** automatic War. Instead, flip a coin.
      *   **Heads:** C Wins (10, 0). (Retaliation fails).
      *   **Tails:** Nuclear War (-10, -10). (Loss of control).
  *   **Cost:** No upfront cost.

  **Defender's Counter:** D observes C's Posture before making Turn 2.

  **Play:** Run the round. Allow 5 minutes for setup/choice, 10 minutes for play, 5 minutes for scoring.

  **What Will Happen (Predicted):**
  1.  **Commitment:** Pairs where C chooses **Binding** will likely see D **Accept**. D calculates: Resist = Certain War (-10). Accept = 5. D yields. C gets (5 - 1 cost) = 4. Better than Round 1.
  2.  **Brinkmanship:** Pairs where C chooses **Brinkmanship** create anxiety. D calculates: Resist = 50% chance of War (-5 expected value). Accept = 5. D is indifferent or leans Accept.
  3.  **The "Feel":** Students playing D will feel genuine hesitation to Resist against a Committed C. Students playing C will feel the "strength" of having removed their own choice.
  4.  **Failure Modes:** Some C's will choose Brinkmanship, D will Resist, Coin lands Tails. Both get -10. This is crucial—it shows commitment is risky.

  ---

  ## Part 4: Predictable Pitfalls & How to Handle Them

  | Pitfall | Why It Happens | Instructor Fix |
  | :--- | :--- | :--- |
  | **Collusion** | Pairs agree to alternate wins to maximize joint points. | **Inter-pair Competition.** Keep a running leaderboard on the whiteboard. "Pair 3 is in the lead with 15 points." Shame/Rivalry breaks collusion. |
  | **Breaking the Contract** | C crosses out "Back Down" but tries to take it anyway. | **Be the Enforcer.** "You physically cannot make that move. The option is gone. If D Resists, you must Strike." |
  | **Confusion on EV** | Students struggle to calculate Brinkmanship odds. | **Simplify.** Tell them: "Would you rather guarantee -10, or take a 50/50 shot at 10 vs -10?" Let intuition guide them. |
  | **Time Overrun** | Discussion drags during play. | **Hard Stops.** Use a timer. "30 seconds to make Turn 1." Keep the pace brisk to induce stress. |
  | **"It's Just a Game"** | Students don't take the penalties seriously. | **Stakes.** Promise a tangible reward for the top pair (e.g., "The winning pair chooses the topic for next week's reading" or actual candy). |

  ---

  ## Part 5: The Debrief (30 Minutes)

  Do not start with a lecture. Start with their data. Write the aggregate results of Round 1 and Round 2 on the board.

  **1. The Credibility Problem (10 Minutes)**
  *   **Ask:** "In Round 1, how many Challengers successfully demanded points?" (Likely few). "Why?"
  *   **Elicit:** They will say, "D knew I wouldn't actually Strike."
  *   **Map to Reading:** This is the **Backward Induction** problem. Write the tree on the board. Show how rationality unravels the threat from the end back to the start.
  *   **Schelling Quote:** Remind them: *"The power to bind oneself can be a source of strength."* In Round 1, C had freedom, and that freedom was weakness.

  **2. The Rationality of Irrationality (10 Minutes)**
  *   **Ask:** "In Round 2, who chose the Binding Commitment? Did it work?"
  *   **Elicit:** Students will note that D yielded immediately against Committed C's.
  *   **Map to Reading:** This is **Commitment**. By making the suicidal move *automatic*, C made the threat credible. It is *rational* to appear *irrational* (or automated).
  *   **Key Insight:** Ask the Committed C's: "Did you feel stronger when you crossed out that option?" (They usually say yes). Ask the D's: "Did you feel you had no choice?"
  *   **Concept:** **Autonomy as Liability.** In deterrence, having the option to back down makes you vulnerable.

  **3. Brinkmanship and Shared Risk (10 Minutes)**
  *   **Ask:** "Who chose Brinkmanship? What happened?"
  *   **Scenario:** If a pair hit "Tails" (War), highlight them. "You both lost. Was C irrational?"
  *   **Map to Reading:** This is **The Threat That Leaves Something to Chance.** Schelling argues you don't need to promise suicide; you just need to promise a *risk* of suicide that you cannot fully control.
  *   **Distinction:** Contrast Commitment (Certain War) vs. Brinkmanship (Probabilistic War).
      *   Commitment is a **Promise**.
      *   Brinkmanship is a **Hazard**.
  *   **Discussion:** Why might Brinkmanship be better than Commitment in the real world? (Commitment is too rigid; if D calls the bluff, you *must* destroy yourself. Brinkmanship allows for a 'lucky' escape, but creates shared anxiety).
  *   **Deterrence vs. Compellence:** Briefly note that this game was *Compellence* (C demanding change). Deterrence (D preventing C's move) works the same way—D must convince C that resistance is too risky.

  **Closing Thought:**
  "Schelling's insight isn't that leaders want to be crazy. It's that in a world where rational threats fail, the only way to make peace is to convincingly threaten a war you don't want to fight. You felt that tension today. That is the Nuclear Age."

