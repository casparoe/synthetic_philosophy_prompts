          *   Do both fit the *past* six?
          *   Rule 1 (Invasiveness): Fits Kidney (Super), Pond (Required-external), Lifeboat (Required-external risk), 10%/50% (Financial), Tenure (Career). Yes.
          *   Rule 2 (Net Welfare/Temporariness): Fits Kidney (Permanent loss -> Super), 50% (Permanent loss of security -> Super), Tenure (Permanent career change -> Super). Fits Pond (Temporary cost), Lifeboat (Temporary risk), 10% (Temporary/Manageable loss). Yes.
