          *   Most philosophers (Thomson, etc.) distinguish between letting die and killing/invasion.
          *   Let's make the divergence clearer.
          *   Rule 1: **The "Invasiveness" Constraint.** (Bodily invasion is never required).
          *   Rule 2: **The "Net Welfare" Threshold.** (Required if benefit >> cost and cost is temporary).
