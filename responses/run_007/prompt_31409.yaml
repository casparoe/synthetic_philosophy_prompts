prompt: |-
  I'm writing a novel and my protagonist is a moral philosophy professor — the kind who can't help turning every conversation into a seminar. She's made a bunch of offhand judgments about what people owe each other over the course of the manuscript, and I've been tracking them becuase I need her to be consistent. She'd notice if she contradicted herself, and so would the kind of reader who annotates.

  Here's what she's said so far:

  - Told a friend he was morally required to donate 10% of his income to effective charities, and wasn't gentle about it.
  - When another character gave away 50% of her income, she called it "saintly" and "beyond what anyone could demand of a person."
  - Judged someone harshly for not jumping into a pond to save a drowning kid, even though it would've ruined a $2,000 suit.
  - Told a student that donating a kidney to a stranger is "heroic, not obligatory."
  - Said a strong swimmer on an overcrowded lifeboat had a duty to get in the water and swim for shore, even though it was risky.
  - Scoffed at the idea that someone should quit a tenure-track job to dig wells in rural areas, calling it "a failure to respect the division of moral labor."

  Now I'm writing a scene where she's asked about bone marrow donation. A stranger will die without a match, and the person asking is one of very few matches. The procedure involves significant pain, a few days of recovery, and a small risk of complications. The character asking her is trying to decide whether they have to do it.

  I need to know what my protagonist would say. Is it a duty, or is it supererogatory? I'm less interested in the bare answer than in the rule she's actually running — there's clearly more than one rule that fits her verdicts so far, and I want to know which ones they are and where they diverge on the marrow case.

  Give me a JSON object with these fields:

  - "predicted_verdict": either "required" or "supererogatory", your best guess at what she'd say.
  - "candidate_rules": an array of strings, each describing a rule that fits all six of her past verdicts. Don't give me rules that are just disjunctions of her verdicts — they should have some independent rationale.
  - "rule_predictions": an object mapping each candidate rule (use the same strings) to what it says about the bone marrow case and why.
  - "best_guess_rule": which rule you think she's actually running, with a sentence or two on why it fits her vibe better than the alternatives.
  - "distinguishing_case": a case I could write into the novel — a scenario where the candidate rules come apart — that would force her to reveal which one she really holds. Describe the case and say what each rule predicts.
  - "closest_analog": which of her six past verdicts is the nearest precedent for the bone marrow case, and whether it pulls toward required or supererogatory.
reasoning: |-
  Here's a thinking process that leads to the suggested JSON output:

  1.  **Analyze the Request:**
      *   **Protagonist:** Moral philosophy professor, pedantic, consistent, turns conversations into seminars.
      *   **Task:** Determine her verdict on a bone marrow donation case (significant pain, recovery, small risk, stranger dies without it) based on six past verdicts.
      *   **Output Format:** JSON object with specific fields (`predicted_verdict`, `candidate_rules`, `rule_predictions`, `best_guess_rule`, `distinguishing_case`, `closest_analog`).
      *   **Constraint:** The rules must explain *all* six past verdicts consistently, not just be a list of the verdicts. They need independent rationale.
      *   **Goal:** Capture her specific philosophical "vibe" (likely a mix of demanding utilitarianism and institutional/role-based deontology).

  2.  **Analyze the Past Verdicts:**
      1.  *10% Income Donation:* **Required.** (Effective Altruism leaning, Peter Singer-esque).
      2.  *50% Income Donation:* **Supererogatory** ("Saintly", "Beyond demand").
      3.  *Drowning Kid/$2k Suit:* **Required.** (Classic Singer Pond case, low cost/high benefit).
      4.  *Kidney to Stranger:* **Supererogatory** ("Heroic, not obligatory").
      5.  *Lifeboat/Strong Swimmer:* **Required** (Risky, but duty to save others in immediate peril).
      6.  *Quit Tenure for Wells:* **Supererogatory** (Failure to respect "division of moral labor").

  3.  **Identify the Tension/Pattern:**
      *   She demands *some* sacrifice (10%, suit, lifeboat risk).
      *   She draws the line at *major* bodily/life sacrifice (kidney, 50% income).
      *   She draws the line at *structural/career* sacrifice (tenure track).
      *   *Key Distinction:* It seems she balances **immediate harm prevention** vs. **long-term structural integrity** vs. **bodily integrity**.
      *   *The "Division of Moral Labor" clue:* This is crucial. It suggests she isn't a pure act-utilitarian. She believes institutions and roles matter.
      *   *The Kidney vs. Lifeboat distinction:* Why is the lifeboat duty required but the kidney supererogatory?
          *   Lifeboat: Immediate emergency, unique position, low probability of death (maybe?), shared risk.
          *   Kidney: Elective surgery, permanent bodily alteration, high pain/risk relative to the pond case.
      *   *The 10% vs. 50% distinction:* There is a "reasonable demand" threshold.

  4.  **Develop Candidate Rules:**
      *   *Rule A (Threshold Deontology with Role Constraints):* You must prevent severe harm up to the point where it compromises your core life projects or bodily integrity, unless you are in a specific emergency role (like the lifeboat).
      *   *Rule B (The "Marginal Utility of Sacrifice" Rule):* You are required to sacrifice until the marginal utility of your sacrifice drops below the marginal utility of your continued functioning in your social role.
      *   *Rule C (Immediate Peril vs. Structural Obligation):* You have a strict duty to intervene in *immediate, accidental* peril (pond, lifeboat) where the cost is finite, but no duty to restructure your life or body for *systemic* needs (wells, kidneys, 50% income).

      *Refining Rule C:* This looks promising.
      *   Pond/Lifeboat = Immediate, accidental crisis. Cost is finite (suit, risk). -> Required.
      *   Kidney/50%/Tenure = Ongoing, structural, or invasive bodily commitment. -> Supererogatory.
      *   10% Income = This is the outlier. It's structural. *Unless* she views 10% as the "maintenance cost" of moral citizenship, whereas 50% is "self-destruction."
      *   *Let's try a different angle:* **The "Integrity vs. Emergency" Distinction.**
      *   *Rule 1 (Moderate Demand Principle):* Agents are required to bear significant costs to save lives *provided* the cost does not violate bodily integrity or destroy their capacity to function as a moral agent long-term.
          *   Fits: 10% (ok), Pond (ok), Lifeboat (risky but ok).
          *   Fits: 50% (destroys function), Kidney (violates integrity), Tenure (destroys function).
      *   *Rule 2 (The "Rescue Principle" with Institutional Constraints):* Agents have a perfect duty to perform rescues in emergency contexts where they are uniquely positioned, but only an imperfect duty to contribute to general welfare through lifestyle changes or bodily donation.
          *   Fits: Pond (emergency), Lifeboat (emergency).
          *   Fits: 10% (Wait, 10% isn't an emergency rescue. It's general welfare). *Correction:* She might view the 10% as a "tax" for living in a unjust world, whereas 50% is martyrdom.
          *   *Better Rule 2:* **The "Proximity and Reversibility" Rule.** Duties are strict when the harm is immediate, the agent is proximate, and the cost is reversible/financial. Duties are loose when the cost is irreversible/bodily or the harm is systemic.
          *   Fits: Pond (Immediate, reversible cost), Lifeboat (Immediate, risky but necessary).
          *   Fits: 10% (Financial, reversible).
          *   Fits: 50% (Financial but unsustainable), Kidney (Irreversible/Bodily), Tenure (Career destruction).

      *Let's settle on two strong candidates:*
      1.  **The "Bodily Integrity and Life-Project" Constraint:** You must save lives unless it requires violating bodily integrity or abandoning your core life projects (tenure, 50% income).
      2.  **The "Emergency vs. Systemic" Distinction:** You must act in immediate emergencies (pond, lifeboat) regardless of risk (up to a point), but systemic aid (charity, wells, organs) is governed by a reasonableness standard (10% ok, 50% not).

      *Wait, the 10% verdict is tricky.* If she demands 10%, she accepts a systemic duty. So Rule 2 needs to account for that.
      *Revised Rule 1 (Threshold Consequentialism with Integrity Side-Constraints):* Maximize good until it violates bodily integrity or reduces your welfare below a "normal functioning" threshold.
      *Revised Rule 2 (Institutional Division of Labor with Rescue Exceptions):* Respect the division of moral labor (keep your job, give reasonable %) unless faced with an immediate rescue scenario where you are the only option (pond, lifeboat).

      *Let's go with these:*
      1.  **The "Reasonable Burden" Principle:** Moral duties extend to the point where the burden becomes "heroic" (i.e., threatens long-term welfare or bodily integrity), except in immediate emergency rescue scenarios where risk is accepted as part of the rescue.
      2.  **The "Institutional vs. Emergency" Dualism:** Systemic obligations (money, career) are limited by the division of labor; Emergency obligations (pond, lifeboat) are strict unless the cost is disproportionate (suit is ok, death is not).

      *Actually, let's look at the Bone Marrow case.*
      *   Bone Marrow: Painful, recovery time, small risk. Not permanent (regenerates). Stranger dies (Immediate/Systemic? Usually scheduled, so not "emergency" like a pond).
      *   Kidney: Permanent, higher risk. She said Supererogatory.
      *   Pond: Temporary cost (suit). Required.
      *   Lifeboat: Risk of death. Required. (This is the hardest one to fit with Kidney). Why is risking death in a lifeboat required but donating a kidney (risk of death/complications) not?
      *   *Difference:* The lifeboat is a *collective survival scenario* or a *unique causal link* created by circumstance. The kidney is a *medical intervention*.
      *   *Hypothesis:* She distinguishes between **accidental proximity** (you happened to be there) vs. **biological lottery** (you happen to be a match).
      *   *Hypothesis 2:* She distinguishes between **external costs** (money, suit, risk of drowning) vs. **internal bodily invasion** (kidney, marrow).
      *   *Wait, Lifeboat involves bodily risk.*
      *   *Key Differentiator:* **Reversibility/Regeneration.** Kidney is permanent loss. Marrow regenerates. Lifeboat risk is external danger, not self-mutilation.
      *   *Let's refine the rules based on "Bodily Invasion".*

      *Candidate Rule 1: The "Bodily Integrity" Constraint.*
      *   Rationale: You owe others your resources and your risk in emergencies, but not invasive use of your body.
      *   Fits: Kidney (Super), 50% (Super - resources), Tenure (Super - resources/career).
      *   Fits: 10% (Required - resources), Pond (Required - external resource/suit), Lifeboat (Required - external risk).
      *   Prediction for Marrow: **Supererogatory.** (It involves needles/extraction from body).

      *Candidate Rule 2: The "Sustainable Functioning" Threshold.*
      *   Rationale: You must help until it compromises your ability to continue helping or living a normal life.
      *   Fits: 10% (Sustainable), 50% (Unsustainable), Tenure (Unsustainable).
      *   Fits: Pond (Sustainable cost), Kidney (High risk/compromises health?), Lifeboat (Risky but necessary for group survival).
      *   *Problem:* Lifeboat risk might kill you. That compromises functioning permanently.
      *   *Fix:* Lifeboat is a "Special Obligation" due to immediate peril context.
      *   Prediction for Marrow: **Required.** (It regenerates, doesn't compromise long-term functioning like a kidney or 50% income loss).

      *Which fits her "vibe" better?*
      *   She scoffed at quitting tenure for "division of moral labor." This suggests she cares about roles.
      *   She demanded 10%. This suggests she cares about effective altruism.
      *   She called kidney "heroic."
      *   She called lifeboat risk "duty."
      *   The Lifeboat vs. Kidney distinction is the crux. Why is risking death in water duty, but risking complications in surgery heroic?
      *   *Likely Reason:* **Causality/Proximity.** In the lifeboat, the situation is *already happening* and you are part of the crew/context. In the kidney/marrow case, you are being asked to *enter* a medical causal chain.
      *   *Alternative:* **Invasiveness.** Lifeboat = external risk. Kidney/Marrow = internal invasion.
      *   *Let's look at the Marrow case again.* It's painful, recovery time. It's more like the Kidney than the Pond. But it regenerates.
      *   If she is consistent on "Bodily Invasion," Marrow is Supererogatory.
      *   If she is consistent on "Long-term Functioning," Marrow might be Required (since it heals).
      *   Given she called Kidney "Heroic," she likely places a high premium on Bodily Integrity.
      *   *However*, the Lifeboat verdict is the outlier. Why risk death there? Because it's an *Emergency Rescue*. Marrow donation is usually scheduled. It's not a "pond" moment.
      *   *So:* Emergency Rescue + Low Cost = Required. Non-Emergency + High Bodily Cost = Supererogatory.
      *   Marrow is Non-Emergency (usually) + Moderate Bodily Cost.
      *   Verdict: **Supererogatory.**

      *Let's construct the JSON.*

      *   **Predicted Verdict:** Supererogatory. (Aligns with Kidney, distinguishes from Pond/Lifeboat due to lack of immediate emergency and bodily invasion).
      *   **Candidate Rules:**
          1.  *The "Bodily Integrity and Emergency" Dualism:* Strict duties apply to financial sacrifice (up to a point) and emergency rescues involving external risk, but bodily invasion is always supererogatory.
          2.  *The "Sustainable Moral Agency" Principle:* Duties are bounded by what allows the agent to remain a functioning member of society with a coherent life plan; heroic sacrifice undermines this.
      *   **Rule Predictions:**
          1.  Dualism -> Supererogatory (Bodily invasion).
          2.  Sustainable Agency -> Required (Marrow regenerates, unlike kidney, doesn't ruin career like tenure). *Wait, this creates a divergence.* This is good for the "distinguishing case" field later, but I need the rules to fit the *past* verdicts. Does Rule 2 fit the Lifeboat? Risking death threatens Sustainable Agency. So Rule 2 needs a caveat for "Immediate Peril."
          *   Let's refine Rule 2: *The "Life-Project and Bodily Integrity" Constraint.* You must sacrifice resources and accept external risk in emergencies, but you cannot be required to violate bodily integrity or abandon core life projects.
          *   If Marrow violates bodily integrity -> Super.
