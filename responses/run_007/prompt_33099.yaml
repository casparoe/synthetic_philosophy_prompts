      *   *Emphasis:* The "Absorbing Barrier" below zero. Kelly says don't hit zero. But if there's a barrier at $W_{min}$ (subsistence), Kelly might still hit it with high probability in finite time.

  6.  **Final Polish:** Ensure tone is respectful, rigorous, and directly answers the "what would count against this view" prompt. (The user wants to be challenged, not coddled).

      *(Self-Correction on Ergodicity)*: The user specifically mentioned ergodicity as a *strength* (Peters' work). I need to be careful not to just say "ergodicity is hard." I need to argue that *financial time series are often non-ergodic* in the strict sense required for the theorem to hold. The ensemble average does not equal the time average if the underlying generator changes.

      *(Self-Correction on Insulation)*: The user asks if the view is insulated to the point of risking nothing empirically. I need to argue that if Kelly is treated as a *normative* rule derived from *positive* assumptions (ergodicity), and the positive assumptions fail, the normative rule loses its force. If proponents just say "you applied it wrong," that's the insulation problem.

