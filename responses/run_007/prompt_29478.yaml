  1.  **Analyze the User's Request:**
      *   **Context:** A reading group discussing Cold War nuclear strategy (Schelling, etc.) and modern debates on deterrence stability vs. luck.
      *   **Problem:** One participant shuts down debate with the slogan "nuclear weapons keep the peace." This is vague and acts as a conversation stopper.
