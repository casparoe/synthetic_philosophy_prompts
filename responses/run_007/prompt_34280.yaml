      *   *Stalinesque:* Pre-aggregation / Stream Processing (Flink/Spark) before writing to the read DB. The user never sees the raw events.
      *   *Orwellian:* Write raw events to DB, then run a batch job or trigger that updates the read model/memory later. Optimistic locking with retry? Eventual consistency reconciliation.
      *   *The "Now":* Commit offset? Wall-clock time vs. Logical time (Lamport clocks).
      *   *The "Cartesian Theater":* A single master node? A synchronous commit barrier?

  4.  **Develop the Mappings (Drafting the Core Analogy):**

