      *   *Timing Problem:* Perception of motion starts *before* B occurs.
      *   *Stalinesque:* Editing happens *before* conscious experience. The "show" is pre-rendered. (Pre-commit modification).
      *   *Orwellian:* Editing happens *after* conscious experience. The "memory" is rewritten. (Post-commit modification).
      *   *Dennett's Punchline:* He argues the distinction is illusory (Cartesian Theater fallacy). There is no single "place" or "time" where consciousness happens, so asking *when* the edit occurs relative to *that* place is meaningless.

  3.  **Brainstorm Engineering Mappings:**
