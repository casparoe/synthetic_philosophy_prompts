      *   *Orwellian:* We persist `red_dot` and `green_dot` to the WAL. The Read Model displays them. Then, a reconciliation process (Memory Consolidation) runs. It sees the pattern, deletes the two dot events, inserts `moving_green_dot` into the long-term store, and updates the UI cache. The user *thought* they saw motion, but technically the system corrected the log after the fact.

  5.  **Identify the "Clean" Mappings:**
