answer: |-
  **MEMORANDUM**

  **TO:** Religious Accommodation Committee
  **FROM:** [Your Name/Chair's Office]
  **DATE:** 24 October 2023
  **SUBJECT:** Decision Memorandum: Petition Regarding Mandatory 'Respect and Consent' Workshop

  ### 1. Executive Summary

  This memo addresses the petition submitted by a coalition of student groups requesting that the mandatory 'Respect and Consent' workshop be made optional. The petitioners argue that the workshop's content promotes a conception of sexuality and the good life that conflicts with their comprehensive religious doctrines.

  After reviewing the submissions and the divergent legal and philosophical counsel received, the Committee recommends **denying the request for an exemption**. The workshop shall remain a mandatory requirement for all students. However, the Committee directs the Sexual Violence Prevention Team to audit the workshop curriculum to ensure its justification rests strictly on *public reason* (safety, legal compliance, and mutual respect) rather than *comprehensive moral doctrines*.

  The following sections outline the rationale for this decision, engaging specifically with the Rawlsian framework invoked by both factions of this Committee.

  ### 2. Analysis of the Rawlsian Dispute

  The Committee's deliberation centred on the applicability of John Rawls' concept of *public reason*. Two distinct interpretations were presented.

  **2.1. The Majority View: Public Reason and the Basic Structure**
  The faction advocating for the denial of the petition argues that the university, as a public institution, exercises authority analogous to the state regarding matters of student safety and non-discrimination. They contend that Rawls' requirement for public reason applies here because the workshop concerns 'matters of basic justice'—specifically, the protection of individuals from harm and the assurance of equal liberty.

  Under this view, the students' objection is rooted in 'comprehensive religious doctrines' (specific conceptions of truth and the good life). Rawls argues that in a pluralistic society, coercive power (including institutional mandates) cannot be justified solely by such doctrines, as they are not shareable by all reasonable citizens. Conversely, the mandate to prevent sexual harassment and ensure consent is justifiable via public reason: it relies on secular law, psychological well-being, and the reciprocal duty to respect the bodily autonomy of others. Therefore, the university is correct to prioritise the public justification of safety over private religious objections.

  **2.2. The Minority View: The University as Background Culture**
  The faction advocating for accommodation argues that this application of Rawls is an overextension. They note that Rawls explicitly limited the strict requirements of public reason to the 'basic structure of society' (constitutional essentials and matters of basic justice administered by the state). They posit that a university workshop is part of the 'background culture'—the civil society space where comprehensive doctrines are rightly debated and lived out.

  Under this view, compelling students to participate in moral education that contradicts their faith is not a matter of basic justice, but of ethical formation. By forcing compliance, the university risks becoming sectarian itself, privileging a secular-liberal comprehensive doctrine over religious ones. They argue that reasonable accommodation in the background culture fosters the very mutual respect the workshop aims to teach.

  ### 3. Committee Assessment

  The Committee finds the Majority View more persuasive in this specific context, though we acknowledge the theoretical force of the Minority View.

  While universities are indeed part of the 'background culture' in many respects, they operate under statutory duties (such as the Equality Act 2010 and Duty of Care obligations) that elevate issues of sexual safety from mere ethical preference to matters of basic justice. When the subject matter concerns the prevention of harm and the protection of rights, the university functions as an agent of the basic structure. Consequently, the justification for the workshop must be accessible to all reasonable persons regardless of their faith.

  The current mandate is justifiable because it does not require students to *believe* a specific moral truth, but to *adhere* to a standard of conduct that ensures the liberty and safety of their peers. This distinction between conduct (justice) and conscience (the good) allows the university to maintain the mandate without violating the core of Rawlsian liberty.

  ### 4. The Strongest Case for the Minority Position

  It is vital that we record the strength of the argument put forward by the faction seeking accommodation, as it highlights a genuine risk in our decision.

  The most compelling argument against our recommendation is that the distinction between 'matters of justice' and 'comprehensive moral education' is far blurrier in practice than in theory. A workshop on 'Respect and Consent' inevitably touches upon intimate relationships, gender roles, and the nature of human flourishing—areas deeply embedded in religious comprehensive doctrines. By mandating this training, the university may effectively be signalling that a secular-liberal worldview is the only 'reasonable' one, thereby marginalising religious citizens in the background culture.

  Furthermore, there is a pragmatic Rawlsian argument for stability. Rawls emphasised that a well-ordered society requires an overlapping consensus. If religious students feel coerced into accepting a worldview that fundamentally contradicts their conception of the good, this may breed resentment rather than stability. Accommodating these students, provided they still adhere to the code of conduct regarding behaviour, might better demonstrate 'civic friendship.' It would signal that the university respects them as reasonable citizens capable of self-governance, even if their metaphysical foundations differ from the secular norm. To deny this accommodation risks treating religious conscience as a mere preference rather than a fundamental aspect of personhood, potentially undermining the very mutual respect the workshop intends to cultivate.

  ### 5. Final Policy Decision

  Taking the above into consideration, the Committee resolves the following:

  1.  **Mandatory Participation:** The 'Respect and Consent' workshop remains a mandatory requirement for all enrolled students. No blanket exemptions will be granted on the basis of religious doctrine.
  2.  **Curriculum Audit:** The workshop content must be reviewed to ensure all learning outcomes are framed in terms of public reason. Justifications should cite legal standards, institutional safety policies, and the principle of mutual non-interference, rather than secular moral perfectionism or specific conceptions of the 'good life.'
  3.  **Pedagogical Sensitivity:** Facilitators should be trained to acknowledge that students may hold diverse comprehensive views. The objective is compliance with safety standards and understanding of the law, not the alteration of private belief.

  This decision upholds the university's duty to protect the basic liberties and safety of the student body while respecting the limits of institutional authority over conscience.

  **Approved by:**
  The Religious Accommodation Committee
