      *   **Context:** The user heard a philosophy podcast summarizing Epicurus's argument on death.
      *   **Podcast Host's Summary:**
          1.  Epicurus: Death isn't bad because you don't exist to experience it (No Subject Argument).
          2.  Symmetry Argument: Pre-birth non-existence doesn't bother us, so post-death non-existence shouldn't either.
