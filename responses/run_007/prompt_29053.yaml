      *   *Point 2: The "No Subject" Problem for Deprivation.* If I don't exist, *who* is deprived? Nagel says "the person who would have lived." Epicureans say "that person doesn't exist." You can't harm a non-entity.
      *   *Point 3: Refining the Symmetry Argument.* It's not just "you didn't mind before." It's about the direction of time. If past non-existence isn't a harm, why is future non-existence? The deprivationist has to explain the asymmetry.
      *   *Point 4: Desire and Satisfaction.* Epicureanism is about satisfying natural desires. Death ends desire. You can't be frustrated if you have no desires. Deprivation assumes you *want* more life, but once dead, you don't want anything.
