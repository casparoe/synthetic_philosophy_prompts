answer: |-
  Good evening.

  If you'll indulge me, I want to start by talking about the keys in my pocket. They are heavy. Not physically, but they feel heavy. They open the doors to this room, to the fly tower, to the box office, to the places where the dust settles when we aren't here. Holding them feels like a privilege, which it is. But standing here, in this city, in this specific building, they also feel like a provocation.

  We all know why.

  We are in Geneva. And while there are many voices in the history of this city, there is one voice that tends to speak the loudest when we talk about how we ought to live together. A son of this republic. A man who knew something about the human heart, and something about the fragility of a small society.

  I am talking, of course, about the objection that has been sitting in the back of my mind since we first drew up the budget for this renovation. The objection that says a theater does not belong here.

  I am not a philosopher. I am a theater person. I deal in light cues, in budget deficits, in actors who forget their lines and donors who remember theirs. But I have lost a considerable amount of sleep over this specific argument. Because the argument against us is not prudish. It is not about sin. It is about citizenship.

  The worry, as I understand it, is this: That theater is a machine for manufacturing false emotions. It suggests that by weeping for a king on a stage, we have done our duty to the suffering of the world. It suggests that by feeling a surge of anger at a villain in the second act, we have satisfied our need for justice. It turns us into spectators of life rather than participants in it. And for a republic that relies on the active, vigilant engagement of its citizens, a room full of people sitting in the dark, passively feeling things they do not have to act upon, is not just a frivolity. It is a corrosion.

  It is a dangerous luxury.

  And I want to say to the scholars in the room, and to anyone who has ever held that worry: I cannot stand here and tell you that you are wrong.

  If I stood here and said, "Tonight we prove that theater makes us better people," I would be proving the point. I would be asking you to feel good about buying a ticket, to feel virtuous about sitting in this chair, to substitute the applause you give us for the work you need to do out there. That would be exactly the trap our critic warned us about. It would be easy. It would be comforting. And it would be a lie.

  So, why are we here? Why open the doors?

  Because I have come to believe that the danger is real, but the alternative is worse.

  The alternative is not a city of perfect, active citizens. The alternative is a city that refuses to look at itself. The alternative is a silence where we pretend we do not have these passions, these conflicts, these terrible, beautiful urges that drive us to love and to destroy.

  Our critic feared that theater inflames the passions. He was right. We do inflame them. We turn up the heat. We ask our actors to be vulnerable in public, to show rage and grief and longing without the safety net of privacy. We do this not because we think art purges us like a medicine, but because we think a community that ignores its own passions is a community sleepwalking.

  If we are to share this space, if you are to sit in these seats and we are to stand on this stage, we need to make a pact.

  To our actors and our crew: Your job is not to make the audience comfortable. Your job is to tell the truth as you see it, even when it shakes the floorboards. Do not flatter us. Do not give us the easy tears. If you are going to wake the passions, wake all of them.

  To our donors and our board: You have funded a machine that is designed to question the status quo. That includes questioning the values that allowed you to fund it. That is a risk. Thank you for taking it.

  And to our audience, the citizens of this city: This is the hardest part of the pact.

  We cannot promise that watching this play will make you a better citizen. We cannot promise that feeling pity tonight will feed the hungry tomorrow. Art is not a substitute for action.

  But we can promise this: We will not let you forget that the suffering on this stage is fictional, and the suffering outside these walls is not. We ask you to come here not to rest, but to sharpen yourselves. We ask you to use this hour not as an escape from your responsibility, but as a rehearsal for it.

  When the lights go down, you will be spectators. We accept that. But when the lights come up, and you walk out of this building, and you feel the Geneva air on your face, we ask that you carry the discomfort of what you saw with you. Let the pity you feel here bother you. Let it itch. Let it remind you that you are capable of feeling, and then ask yourself where that capacity is needed when you are not in a theater.

  Rousseau worried that a theater would replace the public square. He feared we would stop meeting as neighbors and start meeting as consumers of spectacle.

  I cannot promise we will fix that. But I can promise that this building is not a temple. It is a workshop. It is a place where we come to practice being human together, so that we might remember how to do it when we are apart.

  We are opening these doors knowing the risk. We know that a small republic requires vigilance. We hope that this theater can be a place where that vigilance is honed, not dulled. We hope that by showing you the shadows, we might help you value the light.

  There is so much work to do in this city. There are laws to debate, neighbors to help, streets to mend. This theater does not do that work. But tonight, for a few hours, we offer you a space to remember why that work matters.

  Thank you to the city officials for tolerating us. Thank you to the scholars for watching us closely; we need your critique. Thank you to the crew, who have built this world with their hands. And thank you to you, for walking through the door.

  The building is open. The risk is ours to share. Let us begin.
