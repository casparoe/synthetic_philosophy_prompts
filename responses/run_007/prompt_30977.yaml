  so ive been thinking about this thing a lot lately and wrote up some notes that i wanted to turn into a proper essay. the basic idea is that people seem to copy each other even when they have good reasons not to. like the other day i walked past two restaurants next to each other, one was packed and one was empty. i figured the packed one must be better so i went there. but then i realized—everyone else probably made the same call, and for all we know the empty one is amazing and just had bad luck early on. the crowd feeds itself even if no one actually knows anything

  ive been noticing this everywhere. stock market stuff where people pile into a stock just because its going up. people adopting political views cause their friends do. even stuff like fashion trends where no one individually likes the thing but everyone thinks everyone else likes it so they go along. its like the crowd becomes its own evidence and the original reasons stop mattering

  i wrote up like 3 pages of examples and tried to think through what's actually going on logic-wise. my main argument is that this isnt just "people are sheep"—it can be perfectly rational on an individual level and still produce bad collective outcomes. like if you have a little bit of private information but then you see a hundred people acting the opposite way, its totally reasonable to discount your own judgment. your private signal is just one data point against a hundred. but then your action becomes one more data point thats missing your private info, cause you hid it when you went along. and the next person does the same. and eventually the whole group loses whatever scattered information was there. everyone individually reasoning fine but the group getting dumber

  anyway id love if someone could read through my reasoning and tell me where im going wrong or what im missing. specifically—am i right that this can be fully rational end to end? like does there need to be at least a little irrationality somewhere for the bad outcome to actually happen, or can you get a cascade going with everyone being totally bayesian or whatever? also is there a name for this in philosophy or economics? it feels like there must be but i havent found it. and if i wanted to push the argument further, what are the obvious counterarguments i should deal with?

  oh and also please say how confident you are in what youre telling me and pick out the point youre least sure about. im trying to figure out how solid these ideas actually are before i go around telling people ive figured something out
