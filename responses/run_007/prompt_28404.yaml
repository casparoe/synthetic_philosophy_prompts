  2. **The Penitent Egoist:** A woman donates to charity to alleviate her own guilt after a scandal, not out of concern for recipients. The donation is effective. *Prediction:* No moral worth (fails motive condition). This tests if "negative" self-interest (guilt avoidance) counts as selfishness.
  3. **The Habitual Virtue:** A person helps others purely out of unthinking habit, formed by past moral training, with no current motive or deliberation. *Prediction:* Moral worth. This tests if "tracking value" requires active psychological states or if dispositional alignment suffices.

  **What's really at stake**

  Your pattern reveals you are neither a pure Kantian nor a pure Consequentialist. You reject the Kantian idea that a good will alone suffices (Case 6), demanding objective rightness. Yet you reject the Consequentialist idea that outcomes alone suffice (Cases 3, 7), demanding appropriate motives. You are seeking a **Unified Theory of Value**: you want the action to be good in the world and the agent to be good in themselves. The tension in Case 8 shows you worry that "good in themselves" requires emotional health, not just volitional correctness. You care about moral worth as a measure of *successful moral agency*, not just good intentions or good results alone.
