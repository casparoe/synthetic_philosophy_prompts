answer: |-
  The glass walls of the postdoc fishbowl reflected the dark campus outside, turning the room into a glowing aquarium. It was 11:30 PM. The only sound was the hum of the mini-fridge and the scratching of Alex's marker against the whiteboard.

  Jamie sat on the edge of the desk, nursing a cup of coffee that had gone cold an hour ago.

  "It's not about whether we *have* moral beliefs, Jamie," Alex said, not turning around. They drew a jagged line on the board. "It's about the genealogy. If the best explanation for why we believe 'cooperation is good' is that cooperation helped our ancestors survive, then the truth of the matter is irrelevant."

  Alex turned, capping the marker with a sharp *click*. "The causal chain stops at fitness. It doesn't reach out and touch a mind-independent moral truth."

  Jamie rubbed their temples. "You're setting up a false dichotomy. The Darwinian Dilemma. I know the script. Either it's a coincidence, or there's a spooky tracking mechanism."

  "Is it a false dichotomy? Name a third option."

  "Correlation," Jamie said. "Evolution selected for traits that kept us alive. But staying alive requires navigating a world that actually *is* a certain way. If moral truths are part of the fabric of rational agency, then evolution selecting for rational agents *is* selecting for sensitivity to moral truth. It's the Third Factor. Survival is good. Evolution selects for survival. Therefore, evolution selects for the good."

  Alex laughed, a short, dry sound. "You're begging the question. You're assuming survival *is* good to prove that evolution tracks the good. That's circular, Jamie."

  "It's not circular if the value of survival is pre-theoretical. It's a precondition." Jamie hopped off the desk, pacing the small rug. "Look, if you push this hard enough, you don't just kill morality. You kill everything. Why trust your logical intuitions? Evolution selected those for fitness, not for truth. Maybe believing in modus ponens just made us better at throwing spears."

  "Math and logic are different," Alex said, leaning back against the whiteboard, crossing their arms. "They describe structural necessities. Morality prescribes action. If I believe there's a tree in front of me, and there is, my belief helps me not walk into it. Fitness and Truth align. If I believe 'suffering is bad,' and it is objectively bad... how does believing that help me pass on my genes? Sometimes suffering *helps* you pass on genes. Sacrifice. Risk. The alignment isn't guaranteed."

  "But the capacity for reasoning is," Jamie countered. "If our cognitive faculties are totally unreliable, then your debunking argument is unreliable too. You're sawing off the branch you're sitting on."

  "I'm not saying our faculties are unreliable. I'm saying they're domain-specific. They're tuned for medium-sized dry goods and social maneuvering. Not for non-natural moral properties." Alex pushed off the board and walked over to the window, looking at their own reflection. "I'm saying we have no reason to think the moral module is anything more than a heuristic."

  "A heuristic for what?"

  "For social cohesion. For not getting ostracized." Alex turned back. "Look, I know what you're going to say. 'But it *feels* real.' It felt real to me, too. Five years ago."

  Jamie paused. The air in the room shifted, the academic friction heating up into something personal. "You used to be a realist."

  "I wanted to be," Alex said softly. "It's... comfortable. Knowing that when I look at my niece, and I feel that she has *rights*, that it's written into the universe. Not just written into my amygdala." Alex picked up a paperweight, turning it over in their hand. "But I can't find the link, Jamie. I can't find the bridge between 'we evolved to feel this' and 'this is true.' And if there's no bridge, you're left with a gut feeling. A very strong, very useful gut feeling."

  "So you live in the error theory?" Jamie asked. "You go through the day acting like things matter, knowing they don't?"

  "I act like they matter because I have the emotions. I just don't claim I have the *justification*."

  "That's not enough," Jamie said, voice tightening. "It's not enough for the work we do, and it's not enough for life." Jamie walked over to their bag and pulled out a phone, tapping the screen to wake it. A photo of a toddler with messy hair appeared. "This is Leo. When he cries, I don't feel a heuristic. I feel an obligation. A demand. If I tell myself that demand is just a trick of the light, a evolutionary misfire... I can't do it. I can't raise him in a world where 'don't hurt him' is just a preference."

  "Jamie, I'm not saying don't hurt him. I'm saying—"

  "You're saying there's no *reason* not to hurt him other than I don't want to," Jamie snapped. "That's what the debunking leads to. Eventually. If the normativity is an illusion, then the only thing left is power. Or preference."

  "No. That's the nihilist slide. I'm talking about epistemology, not ontology." Alex stepped forward, hands up. "I can still have reasons. Prudential reasons. Empathetic reasons. I don't need a Platonic Form of the Good to know I shouldn't kick a dog."

  "But you said it yourself," Jamie pressed. "The alignment isn't guaranteed. Sometimes the gene-fittest move is the cruel one. If you don't have the Real to anchor you, what stops the slide when the heuristic conflicts with the desire? If evolution made us tribal, and I feel tribal, and there's no Moral Truth to say 'tribalism is wrong'... then what?"

  Alex was silent for a moment. They looked at the whiteboard, at the jagged line separating Fitness from Truth. "Then you fight it. You use your reason to override the heuristic. But you do it knowing you're the one choosing the override. Not the Universe."

  "That's terrifying," Jamie whispered. "It's lonely."

  "I know." Alex's voice was quiet. "I miss it, Jamie. I miss thinking the universe was on my side. But missing it doesn't make it true."

  "But the parity argument stands," Jamie said, trying to regain footing, though their voice was less steady now. "If you doubt moral intuition because of its evolutionary origin, you have to doubt the intuition that tells you 'evolution explains belief.' That's a causal claim based on inductive reasoning. Evolution gave us inductive reasoning. If morality is tainted by its origin, so is your science."

  "Science has a feedback loop," Alex said quickly. "If my belief about the tree is wrong, I walk into the tree. Pain. Correction. Moral beliefs don't have that. I can believe 'sacrifice your children to the volcano' and survive just fine, as long as the tribe believes it too. There's no mind-independent check."

  "Rational coherence is a check," Jamie insisted. "We refine our moral beliefs through reflection. We discard the ones that don't fit with our other considered judgments. Reflective Equilibrium."

  "Reflective Equilibrium is just coherence," Alex said. "A madman can have a coherent system. Coherence doesn't guarantee contact with reality. It just guarantees you're consistent."

  Alex walked back to the desk and picked up their bag. The energy was draining out of the room, leaving a heavy residue.

  "Where are you going?" Jamie asked.

  "Home. I can't look at this board anymore." Alex hesitated at the door. "You know I'm not saying you should stop believing. If the illusion works, and it keeps you grounded... maybe that's adaptive too."

  "Don't," Jamie said. "Don't patronize me. Don't call it an illusion."

  Alex opened the door. The hallway light spilled in, cutting across the dark office. "I call it what the argument demands. But... I envy you. I really do."

  "Then find a better argument," Jamie said, turning back to the phone, to the photo of the kid. "Because if you're right, we're just ghosts haunting a machine. And I have to teach Leo how to be a ghost."

  Alex stood in the doorway for a second, hand on the frame. They looked like they wanted to say something comforting, something that bridged the gap, but they didn't have the premises for it.

  "Lock up when you leave," Alex said.

  The door clicked shut. Jamie sat alone in the hum of the fridge, staring at the whiteboard, where the jagged line still separated Fitness from Truth, with no bridge in between. They picked up the cold coffee, took a sip, and grimaced.
