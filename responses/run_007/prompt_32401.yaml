answer: |-
  Here is the breakdown of Maya's logic, the prediction for the bird case, and the test to confirm her underlying rule.

  ### 1. Maya's Call on the Birds
  Maya would say **the sharing type (Blue-chested birds) takes over.**

  ### 2. The Unified Rule
  The rule that ties all her calls together is **Positive Assortment** (sometimes called *Correlated Interactions*).

  In evolutionary biology, cooperation is mathematically doomed unless cooperators are more likely to interact with other cooperators than random chance would dictate. If a cooperator is equally likely to help a defector as they are to help another cooperator, the defectors will always steal the benefits without paying the costs, and the cooperative gene will die out.

  Here is how Maya's previous calls fit this rule:
  *   **Bacteria / City / Shuffled Memory:** These are **Random Mixing**. A cooperator is just as likely to help a defector as anyone else. Assortment is zero. **Result: Defection wins.**
  *   **Vampire Bats:** This is **Direct Reciprocity**. By remembering past interactions, bats ensure they only help those who have helped them. They create assortment through time. **Result: Cooperation wins.**
  *   **Ground Squirrels:** This is **Kin Selection**. Because sisters share genes, helping a sister is statistically likely to help another "cooperator gene." They create assortment through genetics. **Result: Cooperation wins.**
  *   **The Birds:** This is **Phenotypic Assortment** (specifically a "Greenbeard Effect"). Because Blues hang out with Blues, the benefit of sharing stays within the Blue group. Even though they aren't related and never meet again, the *blue gene* sees the benefit because the neighbor is likely to carry the same gene. **Result: Cooperation wins.**

  ### 3. The Bet and Why
  I would bet heavily on **Sharing Wins**.

  **Why:** Maya has demonstrated that she understands cooperation doesn't require "nice feelings"; it requires *structure*. She knows that in a random mix (bacteria/city), kindness is suicide. But she also knows that if you change the structure so that kindness is directed inward (bats remembering friends, squirrels helping kin), kindness becomes a winning strategy.

  The bird scenario describes a population with **high structural assortment**. Even without kinship or repeat meetings, if a Blue bird pays a cost of 1 unit to give a benefit of 5 units, and 90% of its neighbors are also Blue, the "Blue Gene" gains $4.5$ units on average ($0.9 \times 5 - 1$). A Red bird hanging with Reds pays 0 and gets 0. The Blues out-compete the Reds. Maya's track record suggests she spots this "protective clustering" instantly.

  ### 4. The One Scenario to Settle the Rule
  To confirm that Maya is truly running on the **Positive Assortment** rule (and not just a vague "clumping is good" intuition), you should test her on **Indirect Reciprocity (Reputation)**. This is the only major mechanism of cooperation missing from her list.

  **The Scenario:**
  > "Imagine a large online marketplace. Traders are paired up anonymously for a **one-time** deal. They are **not related**, they have **no visible tags** (like the bird chests), and they **never meet the same partner twice**. However, after every deal, a public 'Trust Score' is updated. Future partners can see your score and will refuse to trade with anyone below a certain threshold. Does cooperation evolve?"

  **What this tells you:**
  *   **If she says YES:** She truly understands the abstract rule of Assortment. She recognizes that *information flow* creates assortment just as effectively as genetics or spatial clustering. Cooperators get high scores and get chosen; defectors get low scores and get isolated.
  *   **If she says NO:** Her rule is likely narrower. She might think cooperation requires *physical* clustering (like the birds/squirrels) or *direct* payback (like the bats). If she fails this, she hasn't quite grasped that *any* mechanism that correlates helpful acts with future benefits (even from strangers) will sustain cooperation.
