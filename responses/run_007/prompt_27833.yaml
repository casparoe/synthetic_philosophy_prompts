      *   *The Stipulation Problem:* If I tell a Humean "there is no deeper connection," they will shrug and say "So what?" If I tell a Non-Humean that, they will say "Then it's not a law."
      *   *Prediction:* She is likely a Humean Best System theorist. Therefore, she will treat the "no deeper connection" clause as irrelevant to lawhood, provided the regularity is in the Best System.
      *   *Confidence:* Moderate-High. The "Simple World" case is very specific to BSA literature (Lewis often uses simple worlds to motivate BSA).
      *   *Discriminating Case:* Counterfactuals. "If this swan had been born, would it have been white?" A Non-Humean says Yes (law supports counterfactual). A Humean BSA-er has to work harder to justify this, often appealing to the system's resilience. Or: Probabilistic laws. "50% of Fs are Gs." BSA handles this well. Necessitation struggles with probabilistic necessitation.
