      *   *Diagnosing the Friend:* Her acceptance of the "Simple World" case suggests she treats simplicity/strength as *constitutive* of lawhood, not just evidence for it. If she required a hidden connection, she likely wouldn't have endorsed the Simple World $F \to G$ so readily without qualifying that a connection *must* exist there.
