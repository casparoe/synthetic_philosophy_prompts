      *   *BSA Prediction:* **Yes, it is a law.** For a BSA-er, "law" *means* "regularity that features in the best deductive system." The idea of a "cosmic accident" that *also* makes it into the Best System is a category error or simply describes a Humean world where laws are brute. The "no deeper connection" part is exactly what a Humean expects.
