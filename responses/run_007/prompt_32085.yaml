answer: |-
  You are right to be skeptical about the hand-waving regarding the universal Turing machine, as it is one of the most common oversimplifications in discussions of algorithmic information theory. The claim you keep seeing relies on the Invariance Theorem, which states that for any two universal Turing machines U and V, the Kolmogorov complexity of a string x differs by at most an additive constant. This means that K_U(x) is less than or equal to K_V(x) plus C, where C depends on the choice of U and V but not on the data x. While this is mathematically true, the intuition that this makes the choice of machine irrelevant rests on a misunderstanding of what constant means in this context. In asymptotic analysis, a constant is simply a value that does not grow as the input size grows, but it does not imply that the value is small. The constant C represents the length of the compiler or simulator program needed to make machine U mimic machine V, and there is no upper bound on how complex that simulator might be.

  This becomes critical when you translate complexity into probability, because Solomonoff induction assigns a prior probability proportional to two to the power of negative Kolmogorov complexity. When you move from an additive constant in program length to a multiplicative factor in probability, that harmless-looking constant C becomes a factor of two to the power of C. If you construct a universal Turing machine that has a specific hypothesis hardcoded into its architecture, you can make the program length for that hypothesis arbitrarily short, perhaps just one bit to trigger the hardcoded output. For any other standard machine, that same hypothesis might require a thousand bits to describe. The difference in prior probability between these two machines for that specific hypothesis is not a negligible tweak but a factor of two to the power of nine hundred and ninety-nine. This means the supposedly invariant prior can be skewed by an astronomical factor simply by choosing a machine that is biased toward your favorite theory.

  The defense usually offered is that these differences wash out in the limit as the amount of data approaches infinity. Solomonoff induction does guarantee convergence to the true distribution eventually, regardless of the prior, provided the true distribution is computable. However, this convergence is asymptotic, and we never operate in the limit of infinite data. We live in a universe with finite observations and finite computational resources. If your universal Turing machine assigns a prior to the true laws of physics that is suppressed by a factor of two to the power of a huge constant, you would need an amount of data proportional to that constant to overcome the initial bias. If the constant is large enough, you could exhaust the entropy of the observable universe collecting data before the posterior probability of the true hypothesis ever surpasses the false but hardcoded one. Saying the difference vanishes in the limit is cold comfort when the limit is physically unreachable.

  So what survives of the claim that Solomonoff induction justifies Occam's razor is a more modest, relativized version. It does not provide an absolute justification for preferring simple hypotheses in the real world, because it cannot tell you which universal Turing machine corresponds to reality. Instead, it demonstrates that if you fix a reference machine, then within that framework, shorter programs are indeed more probable, and reasoning consistently according to that prior will prevent you from being exploited by a Dutch book. It formalizes the internal consistency of Occam's razor rather than its metaphysical truth. The burden of justification shifts from why simplicity is true to why a particular encoding language is natural, and Solomonoff induction itself offers no help there. It turns the problem of induction into the problem of choosing a reference machine, and until you solve that selection problem, the formal grounding remains relative to your choice of description language.
