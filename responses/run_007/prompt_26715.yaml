              *   *Option A:* Enhancements are inherently risky or violate human dignity/nature.
              *   *Option B:* There is a factual baseline of how human bodies are designed to work.
              *   *Option C:* "Disease" is just a label for conditions that cause social disadvantage.
              *   *Wait, I need to separate Bioconservative from the others.* Bioconservatives accept the boundary but think enhancement is *bad*. Naturalists accept the boundary as *descriptive*.
