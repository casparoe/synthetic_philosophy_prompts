answer: |-
  ### The Therapy-Enhancement Decision Tree

  This tree is designed to sort philosophical intuitions about biomedical intervention. Start at the root and answer the questions based on your judgments about specific cases (e.g., modafinil for focus, gene editing for height) rather than your preferred labels.

  #### **Node 1: The Fundamental Status**
  **Question:** Is the difference between restoring a person to typical health (therapy) and improving them beyond typical health (enhancement) a **morally significant boundary**, or is it ultimately **arbitrary**?

  *   **A. It is ultimately arbitrary.** (The line shifts based on technology and culture; there is no deep moral difference between fixing a heart and improving a memory.)
      *   *Go to Node 2.*
  *   **B. It is morally significant.** (There is a real ethical difference between fixing what is broken and upgrading what works.)
      *   *Go to Node 3.*

  ---

  #### **Node 2: The Metric of Value**
  *(Reached if you believe the distinction is arbitrary)*
  **Question:** If the distinction is arbitrary, what should guide our decisions about biomedical intervention?

  *   **A. We should abandon the distinction entirely and generally pursue the improvement of the human condition.** (Terms like "therapy" are outdated relics; we should focus on overcoming biological limitations.)
      *   **→ LEAF: The Abolitionist / Transhumanist View** (The distinction is empty).
  *   **B. We should ignore the distinction and focus strictly on net outcomes for well-being.** (Whether it's called therapy or enhancement doesn't matter; only whether it reduces suffering or increases happiness matters.)
      *   **→ LEAF: The Welfarist View** (Outcomes for well-being matter).

  ---

  #### **Node 3: The Source of Significance**
  *(Reached if you believe the distinction is significant)*
  **Question:** Why is the boundary significant? Is it because enhancement is **inherently suspect**, or because it falls **outside the scope of medicine**?

  *   **A. Enhancement is inherently suspect.** (Going beyond typical human capacities risks violating human dignity, nature, or social solidarity, regardless of safety or benefit.)
      *   **→ LEAF: The Bioconservative View** (Enhancements are presumptively suspect).
  *   **B. It falls outside the scope of medicine.** (Enhancement isn't necessarily "bad," but it isn't "treatment." We need a definition of health to draw the line.)
      *   *Go to Node 4.*

  ---

  #### **Node 4: Defining the Baseline**
  *(Reached if you believe the distinction matters for defining medical need)*
  **Question:** How do we determine the baseline for "normal health" that therapy aims to restore?

  *   **A. By biological species-typical functioning.** (Health is an objective statistical fact about how human bodies are designed to work, independent of social values.)
      *   **→ LEAF: The Normal Species Functioning View** (Naturalist anchor).
  *   **B. By social norms of disadvantage.** (Health is defined by what counts as a disability or disadvantage in a specific social context; disease concepts are partly constructed but necessary.)
      *   **→ LEAF: The Disease Concept View** (Social Normativist).

  ***

  ### Analysis of Positions and Logical Gaps

  #### 1. Inseparable Positions
  **The Welfarist and Abolitionist Leaves:**
  In practice, these two positions are difficult to distinguish. Most philosophers who argue the distinction is empty (Abolitionists/Transhumanists) do so *because* they adopt a welfarist metric (i.e., "enhancement is good because it increases well-being").
  *   **Why they are separated here:** The tree distinguishes them by *presumption*. The **Abolitionist** leaf represents the view that we should actively *pursue* enhancement as a moral good (the "Proactionary Principle"). The **Welfarist** leaf represents the view that enhancement is morally *neutral* until calculated against well-being (a Welfarist might oppose an enhancement if it caused social inequality, even if it improved individual capacity).
  *   **Flag:** If you answer **2A**, you will almost certainly also agree with **2B**. The tree forces a choice based on whether you view "improvement" as an intrinsic good or an instrumental one.

  #### 2. Logically Possible but Undefended Combinations

  **A. The "Bioconservative Welfarist"**
  *   **Combination:** Answering **1B** (Distinction is significant) + **3A** (Enhancement is suspect) + **2B** (Only well-being matters).
  *   **Why Undefended:** This position is logically unstable. If *only* well-being matters (Welfarism), then enhancement cannot be *inherently* suspect (Bioconservatism); it could only be instrumentally risky. A true Bioconservative (like Michael Sandel) argues that enhancement is wrong even if it *increases* well-being, because it alters our relationship to the "giftedness" of life.
  *   **Verdict:** **Incoherent.** You cannot claim outcomes are the *only* thing that matters while also claiming a specific type of outcome (enhancement) is forbidden regardless of its outcome.

  **B. The "Naturalist Abolitionist"**
  *   **Combination:** Answering **4A** (Health is biological fact) + **2A** (Abandon the distinction).
  *   **Why Undefended:** This person believes there is an objective biological fact about "normal human function" but argues we should completely ignore it in moral reasoning.
  *   **Verdict:** **Deeply Unattractive/Unstable.** While logically possible (one could acknowledge a fact but deem it morally irrelevant), few defend it. Usually, if one believes in "Normal Species Functioning" (like Christopher Boorse), they intend to use that fact to limit medical claims. If you intend to ignore the biological fact, you typically deny its moral relevance at Node 1.

  **C. The "Distinction-Empty Bioconservative"**
  *   **Combination:** Answering **1A** (Distinction is arbitrary) + **3A** (Enhancement is suspect).
  *   **Why Undefended:** If the distinction between therapy and enhancement is arbitrary/empty, then "enhancement" is just "intervention." To say "interventions are suspect" is to be a medical nihilist (opposed to medicine generally), not a bioconservative (who typically supports therapy).
  *   **Verdict:** **Incoherent.** Bioconservatism relies on the therapy/enhancement split to protect therapy while banning enhancement. Remove the split, and the position collapses into general opposition to biomedical intervention.

  #### 3. Note on the "Disease Concept" Leaf
  The **Disease Concept View** (Node 4B) is often associated with "liberal eugenics" (e.g., Norman Daniels), which allows some enhancement but restricts it based on fair equality of opportunity. This position is distinct from Bioconservatism because it does not view enhancement as *inherently* wrong (Node 3B), but rather as outside the mandate of justice-funded medicine. However, in public discourse, this view is often conflated with Bioconservatism because both support restricting access to enhancements, albeit for different reasons (dignity vs. fairness). The tree separates them at Node 3 to ensure this distinction is clear.
