              *   *(Note: These are very close. I need to make sure they are distinct enough. Abolitionists often say "Enhancement is good." Welfarists say "Well-being is good." If enhancement reduces well-being, Welfarist says no. Abolitionist might still say "Upgrade." Let's refine Node 2.)*
              *   *Revised Node 2:* If the boundary is arbitrary, is the primary goal of intervention to maximize well-being, or to transcend current human limitations?
