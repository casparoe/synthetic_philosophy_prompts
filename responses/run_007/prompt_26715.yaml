      *   *Bioconservative:* Enhancement is inherently risky/wrong/unnatural. Therapy is okay to restore normality.
      *   *Normal Species Functioning (Naturalist):* Health is normal functioning. Therapy restores it; enhancement exceeds it. (e.g., Christopher Boorse).
      *   *Social Normativist:* Disease is a social construct based on harm/disadvantage. Therapy addresses disadvantage; enhancement might not, or might create new norms.
      *   *Welfarist:* It doesn't matter if it's therapy or enhancement; does it increase well-being? (e.g., Guy Kahane, Julian Savulescu).

  3.  **Drafting the Decision Tree - Step-by-Step:**

      *   *Root Node:* Needs to address the existence of the distinction.
