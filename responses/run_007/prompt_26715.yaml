      *   *Problem:* Bioconservatives often appeal to "Nature." Naturalists (Boorse) appeal to "Function." Boorse isn't necessarily bioconservative (he might allow enhancement if it becomes the new normal). Bioconservatives (Sandel, Fukuyama) think enhancement is wrong *even if* safe.
