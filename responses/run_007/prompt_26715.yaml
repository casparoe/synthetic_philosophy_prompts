          *   *Option 2:* We should just maximize well-being regardless of labels (Welfarist).
          *   *Wait, check required leaves:* "View that the distinction is empty" vs "Welfarist view". These are close. The "empty" view often implies we should stop using the terms. The Welfarist view implies the terms don't matter, *well-being* does. Let's distinguish them by attitude toward the *pursuit* of enhancement.
          *   *Q:* If the distinction is empty, should we actively pursue enhancements just as we do therapies?
          *   *Yes:* Transhumanist/Abolitionist (Distinction empty).
          *   *No/It depends on well-being:* Welfarist. (Actually, Welfarists usually say pursue if it helps well-being. Transhumanists say pursue improvement generally).
          *   *Correction:* Let's look at the "Required Leaves" again.
              1.  Distinction empty/abandoned.
              2.  Normal species functioning.
              3.  Disease concepts (social).
              4.  Welfarist (outcomes).
              5.  Bioconservative.
          *   *Refined Q1:* Is there a principled, non-arbitrary moral difference between restoring function and improving beyond it?
              *   *No:* (Leads to "Distinction Empty" or "Welfarist").
              *   *Yes:* (Leads to Bioconservative, Normal Functioning, or Disease Concept).

      *   *Branch "No" (No principled difference):*
          *   *Q2:* If there is no principled difference, is the concept still useful, or should we focus solely on well-being outcomes?
          *   *Focus on outcomes:* Welfarist.
          *   *Concept is useless/should be abandoned:* Distinction Empty (Transhumanist).
          *   *Critique:* These are very similar. Usually, "Distinction Empty" *is* a form of Welfarism or Transhumanism. Let's try to separate them based on the *status* of the distinction.
          *   *Alternative Q2:* If the distinction is not principled, is it because *all* interventions should be judged by the same standard (well-being), or because the category of 'enhancement' is incoherent?
          *   *Actually, let's look at Bioconservatism.* Bioconservatives think there *is* a difference, and enhancement is bad.
