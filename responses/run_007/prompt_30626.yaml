prompt: |-
  I'm a game theorist who works on the evolution of social norms and the conditions under which cooperative equilibria can be sustained without external enforcement. I am fluent in the vocabulary of strategy profiles, Nash and correlated equilibria, common knowledge, payoff structures, and the distinction between a norm that is self-enforcing and one that requires an external authority. I have no formal background in moral philosophy.

  Restate Kant's universalizability test — specifically, the Formula of Universal Law, which says that one should act only on maxims that one could will to become universal laws — using the conceptual resources of game theory as faithfully as you can. I want to see what the test becomes when a maxim is treated as a candidate strategy profile, universalization is treated as every agent adopting the strategy under conditions of common knowledge, and the notion of a contradiction is cashed out in terms of what happens to the practice the maxim presupposes when adoption is universal. Pay particular attention to Kant's distinction between a contradiction in conception (where the maxim cannot even be thought as a universal law without incoherence — as in the case of false promising, where universal adoption would destroy the institution of promising itself) and a contradiction in the will (where the maxim can be conceived as a universal law but cannot rationally be willed — as in the case of refusing to help others, where a world of universal non-beneficence is conceivable but no rational agent would will to live in it).

  Then give me the residue report: which parts of the test translate cleanly into game-theoretic terms, which translate only with distortion, and which have no game-theoretic counterpart at all. I want to know whether the residue reveals a genuine moral insight that game theory cannot capture, or whether it reveals that Kant's test relies on equivocations that my framework exposes rather than resolves.

  Begin with the restatement itself, with no preface or commentary.
