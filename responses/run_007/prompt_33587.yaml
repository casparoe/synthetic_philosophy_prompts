      *   *Crucial Step:* They need to commit to a prediction about the *pattern*, not just their own answer. "Will the class say Yes or No?"
      *   *Refinement:* Since they only see one case, they will assume their intuition is universal. They will predict the class matches them. This sets up the shock when the split is revealed.

  5.  **Timeline (80 Minutes):**
      *   0-10: Intro & Setup (No mention of Knobe).
      *   10-20: Vignette Distribution & Private Judgment.
      *   20-30: Prediction & Commitment.
      *   30-40: Small Group Discussion (Articulating Principles).
      *   40-50: Tallying & Reveal (The Surprise).
      *   50-70: Debrief & Philosophical Analysis.
      *   70-80: Methodological Wrap-up & Troubleshooting/Q&A.

