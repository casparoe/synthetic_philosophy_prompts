answer: |-
  # Lesson Plan: The Intentionality Asymmetry (80 Minutes)

  **Course:** Upper-Level Undergraduate Seminar in Experimental Philosophy
  **Class Size:** 12 Students
  **Goal:** To experientially demonstrate the Knobe Effect (Side-Effect Effect) without prior labeling, forcing students to confront the normative influence on their own conceptual judgments before analyzing the methodological implications.

  ## I. Preparation & Materials
  *   **Vignette Slips:** Prepare 12 slips of paper. 6 marked "Version A" (Harm), 6 marked "Version B" (Help). Do not label them visibly as different versions to the students.
  *   **Judgment Slips:** 12 blank slips for the verdict.
  *   **Prediction Cards:** 12 index cards for the public commitment.
  *   **Board Space:** Reserve a section of the whiteboard for the Tally.
  *   **Seating:** Arrange desks so students cannot easily see each other's papers.

  ## II. The Vignettes (Original Minimal Pairs)
  *Instructor Note: Read these aloud only if necessary for accessibility; otherwise, hand them out silently to prevent tone bias. Ensure the "indifference" clause is identical.*

  **Version A (Norm-Violating / Harm)**
  > The Vice President of Operations at a manufacturing firm presented a new strategy to the CEO. He said, "This new strategy will drastically increase our profits, but it will also **increase toxic waste runoff** into the local river."
  > The CEO answered, "I don't care at all about the toxic waste runoff. I just want to increase our profits as much as possible. Let's start the new strategy."
  > They started the new strategy. Sure enough, the toxic waste runoff increased.

  **Version B (Norm-Conforming / Help)**
  > The Vice President of Operations at a manufacturing firm presented a new strategy to the CEO. He said, "This new strategy will drastically increase our profits, and it will also **decrease toxic waste runoff** into the local river."
  > The CEO answered, "I don't care at all about the toxic waste runoff. I just want to increase our profits as much as possible. Let's start the new strategy."
  > They started the new strategy. Sure enough, the toxic waste runoff decreased.

  **The Judgment Question (Identical on both slips):**
  > On a scale of 1 to 7, where 1 = "Definitely Did Not Do It Intentionally" and 7 = "Definitely Did It Intentionally":
  > **Did the CEO intentionally [increase/decrease] the toxic waste runoff?**

  ## III. Timeline & Procedure

  ### 0:00 – 0:10: Setup & Distribution (The Blind)
  *   **Instructor:** "Today we are doing a brief exercise in decision theory and moral psychology. I need you to treat this as a confidential judgment task. Please clear your desks."
  *   **Action:** Distribute the Vignette Slips randomly as students enter or hand them out face down. Instruct students not to show their paper to anyone.
  *   **Crucial Instruction:** "Do not discuss the content of your paper with your neighbors. Your paper contains a scenario unique to this exercise. Assume everyone in the room is evaluating the exact same situation." (This omission is necessary to generate the prediction error).

  ### 0:10 – 0:20: Private Judgment
  *   **Instructor:** "Read the scenario silently. On the Judgment Slip, write your ID (or initials), the Version Code (A or B, hidden from peers), and your rating (1-7). Fold it and place it in this envelope."
  *   **Constraint:** Enforce strict silence. No questions about the text allowed.
  *   **Collection:** Collect the Judgment Slips in a sealed envelope. Do not look at them yet.

  ### 0:20 – 0:30: Public Commitment (The Prediction)
  *   **Instructor:** "Now, take a Prediction Card. I want you to make a claim about the class's collective reasoning."
  *   **Task:** Write the following: *"I predict that at least [X]% of the class will rate this action as Intentional (5, 6, or 7)."* Sign the card.
  *   **Public Act:** Have students hold their signed cards up for the room to see for 10 seconds, then place them in a separate pile. This creates a social record of their confidence in the universality of their intuition.
  *   **Rationale:** Most students will predict high consensus (80-100%) because they assume their intuition is driven by the *structure* of the case (indifference + foreseen side effect), not the *content* (harm vs. help).

  ### 0:30 – 0:40: Small Group Analysis (Principle Articulation)
  *   **Action:** Divide students into 4 groups of 3. (Keep Version A and Version B mixed if possible, or keep them separate to let them bond over shared confusion later. *Recommendation:* Keep them mixed so they don't realize the vignette difference yet).
  *   **Task:** "Discuss with your group *why* you gave the rating you did. What principle determines whether a side effect is intentional? Is it foresight? Is it desire? Is it motivation?"
  *   **Output:** Each group must write down one necessary condition for 'Intentional Action' on the board.
  *   **Expected Output:** Students will likely cite "Foreknowledge," "Desire for Outcome," or "Primary Goal."

  ### 0:40 – 0:50: The Reveal (The Surprise)
  *   **Instructor:** "Let's look at the data."
  *   **Action 1:** Open the Judgment Slips. Tally the mean scores on the board, but **split the tally by Version Code** (which you now reveal exist).
      *   *Version A (Harm) Mean:* Likely high (5–7).
      *   *Version B (Help) Mean:* Likely low (1–3).
  *   **Action 2:** Open the Prediction Cards. Read a few aloud. ("I predicted 90% consensus...")
  *   **The Moment:** Point out the discrepancy. "Half of you saw 'Increase,' half saw 'Decrease.' The logic of the CEO was identical ('I don't care'). Yet the judgments are inverted."
  *   **Instruction:** "Do not speak yet. Look at the board. Look at your prediction card."

  ### 0:50 – 1:10: Debrief & Philosophical Mapping
  *   **Phase 1: The Asymmetry (Intentionality vs. Foresight)**
      *   Ask: "If foresight were the only criteria, the scores should be identical. You all knew the CEO foresaw the outcome. Why the split?"
      *   Guide them to see that 'Intentional' is not merely a descriptive cognitive state (belief/desire) but carries a normative weight. We are eager to blame for bad side effects, reluctant to praise for good ones.
  *   **Phase 2: Normative Influence**
      *   Explain that the 'Harm' case violates a norm (do not pollute), making the CEO a candidate for blame. Calling it 'intentional' licenses blame.
      *   The 'Help' case conforms to a norm. Calling it 'intentional' licenses praise, which the CEO's attitude ('I don't care') does not merit.
  *   **Phase 3: The X-Phi Methodological Question**
      *   Ask: "What does this tell us about the concept of INTENTIONALITY?"
      *   *Option A:* The concept *includes* moral valence (Knobe's view).
      *   *Option B:* The concept is pure, but our *application* of it is biased by emotion (Nadelhoffer's view).
      *   *Option C:* Folk intuitions are unstable and cannot define philosophical concepts (Machery's view).
      *   **Conclusion:** The concept is not a static object we 'discover' via intuition; it is a tool sensitive to context.

  ### 1:10 – 1:20: Limitations & Troubleshooting
  *   **Instructor:** "Before you leave, we must address the limits of this experiment."
  *   **The Limitation:** "This class has N=12. We cannot claim statistical significance. If we got a 50/50 split, that could be chance. The *phenomenon* is real because it replicates across thousands of subjects globally. What we reproduced today was not the *statistic*, but the *experience* of the intuition."
  *   **Q&A:** Open floor for final methodological questions.

  ---

  ## IV. Troubleshooting: What Will Go Wrong & How to Handle It

  **1. The "No Effect" Problem (Null Result)**
  *   **Prediction:** In a small sample (N=6 per condition), you might get a split that doesn't look dramatic (e.g., Harm Mean = 4.5, Help Mean = 3.5). The asymmetry might be weak.
  *   **Handling:** Do not panic. Acknowledge the noise. Say: "In this specific room, the effect is muddy. However, in the published literature with N>1000, this gap is robust and significant. The philosophical question remains: Why does the *trend* exist at all, even if our small sample is noisy?" Have a slide ready with the actual Knobe (2003) bar charts to show the robust data if the classroom data fails.

  **2. The "Prior Knowledge" Leak**
  *   **Prediction:** One student recognizes the "Chairman Case" immediately and whispers to a neighbor.
  *   **Handling:** Pre-empt this in the intro. "If you have seen this specific vignette in prior reading, please raise your hand now silently and I will give you a different task." (Have 2 backup vignettes ready, e.g., a soldier shooting a target with civilian collateral damage vs. saving civilians). If they spoil it mid-activity, pivot: "Excellent, you recognize the structure. Please act as a 'control' and do not reveal the twist to your group until the reveal."

  **3. The "Vignette Difference" Objection**
  *   **Prediction:** Students argue the cases aren't structurally identical because 'increasing pollution' is an action while 'decreasing pollution' is a prevention.
  *   **Handling:** Accept this as a valid philosophical critique (the "Linguistic Objection"). Use it to deepen the debrief. "Even if the grammar differs, the *mental state* of the CEO is identical. Why does the grammar of the outcome shift your judgment of the *mental state*?"

  **4. Social Contamination During Judgment**
  *   **Prediction:** Students glance at neighbors' papers during the 10-minute reading window.
  *   **Handling:** If you see this, stop the clock. "I noticed eyes wandering. This data is now compromised. We will restart with new slips." (Have backups). Strict enforcement preserves the "surprise."

  ---

  ## V. Explicit Limitation: What the Classroom Cannot Reproduce

  You must explicitly state the following to the students during the debrief (Minute 70):

  > "This classroom activity **cannot reproduce statistical generalizability.**
  >
  > 1.  **Sample Size:** With 6 subjects per condition, we lack the power to rule out chance. A 4-vs-2 split is not proof of a cognitive universal.
  > 2.  **Demographic Homogeneity:** You are all WEIRD subjects (Western, Educated, Industrialized, Rich, Democratic) from the same institution. Cross-cultural X-Phi shows this effect varies by culture.
  > 3.  **The 'Truth' of the Effect:** You must take my word (and the literature's) that this is a stable feature of human cognition, not a quirk of today's mood.
  >
  > **What this activity *does* supply is the First-Person Phenomenology.** You cannot read a paper and feel the shock of your own intuition betraying your own logic. This session is not about proving the Knobe Effect exists; it is about feeling what it is like to be a subject whose concepts are permeable to normativity."
