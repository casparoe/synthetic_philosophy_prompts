  **Interpretive Theory**
  The theory that best coheres with her four opinions is **Purpose-Constrained Textualism** (a hybrid approach). Judge S treats ordinary meaning as the baseline but allows statutory purpose to resolve ambiguities or update terms to new circumstances (Case 2, Case 3). However, she refuses to let purpose override clear semantic boundaries or statutory definitions, particularly when the text creates distinct legal categories (Case 1, Case 4). She appears to apply a stricter textual constraint in prohibitory/definitional contexts (Case 4) than in functional/procedural contexts (Case 3).

  **Closest Analog**
  The closest analog is **Case 4 (Farm Equipment/Pickup Truck)**.
  *   **Similarity:** In both instances, a party argues for a broader application of a term based on the statute's underlying purpose (helping the farmer / preventing underage drinking) and the functional reality (truck used on farm / sale provides alcohol to minor).
  *   **Reasoning:** In Case 4, Judge S prioritized the "ordinary meaning and the code's own definitions" over the exemption's purpose. Similarly, in the alcohol case, the ordinary legal and semantic distinction between "selling" (exchange for value) and "giving" (gratuitous transfer) is a clear categorical boundary. Just as a truck is not an "implement of husbandry," a sale is not a "gift."
  *   **Contrast with Case 3:** Case 3 (Email/Notice) allowed purpose to expand text, but that involved a *medium* of communication (paper vs. digital) rather than a distinct *legal category* of transaction. Judge S is willing to update means (Case 3) but not ends/categories (Case 4).

  **Principles on the Role of Statutory Purpose**
  *   **If she rules for the Clerk (Selling $\neq$ Giving):** She commits to the principle that **statutory purpose cannot erase distinct semantic or legal categories established by ordinary usage.** Purpose serves to clarify ambiguity within the text's semantic range, but it cannot expand the text to cover conduct that falls outside its ordinary definition, even if excluding that conduct frustrates the legislative goal.
  *   **If she rules for the Minor (Selling = Giving):** She commits to the principle that **statutory purpose dictates functional equivalence over semantic technicalities.** If the harm the statute seeks to prevent (minor access to alcohol) is identical regardless of the method (sale vs. gift), the purpose controls, and the text should be interpreted dynamically to cover all functional means of achieving that harm.

  **Underdetermination and Further Hypothetical**
  While the prediction above favors the Clerk based on the strength of Case 4 in categorical contexts, the four opinions **genuinely underdetermine the answer** because they do not explicitly establish a meta-rule for when Case 3 (Functional Purposivism) trumps Case 4 (Categorical Textualism). We do not know if Judge S classifies "give" as a functional term (like "written") or a categorical term (like "equipment").

  To cleanly settle which theory she is running, consider this hypothetical:
  *   **Hypothetical:** A zoning ordinance prohibits "residential structures" in a commercial zone to preserve business traffic. A defendant installs a **yurt** that is fully plumbed and used exclusively as a dwelling. The ordinance defines "structure" as "any edifice with a roof and walls," but does not define "residential."
  *   **Resolution:**
      *   If she rules the yurt **is prohibited**, she is applying **Case 3 logic** (Functional Purposivism): The purpose is to stop people living there; the yurt functions as a home; therefore, it fits the purpose-driven meaning of "residential structure."
      *   If she rules the yurt **is permitted**, she is applying **Case 4 logic** (Categorical Textualism): The ordinary meaning of "structure" implies permanence or specific building codes that a yurt lacks; purpose cannot expand the category of "structure" to cover temporary tents, even if the residential purpose is frustrated.

  This hypothetical isolates the tension between *functional outcome* (Case 3) and *categorical definition* (Case 4) without the confounding variable of technological obsolescence (Case 3) or specific code definitions (Case 4).
