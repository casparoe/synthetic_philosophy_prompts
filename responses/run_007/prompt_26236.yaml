answer: |-
  ### Part 1: Brainstorming Approaches

  Before settling on the design below, I considered three different structures for this session:

  1.  **The "Pascal's Mugging" Direct:** Hand out a single sheet: "Keep \$5 or give it to me for a 1 in 10^9 chance of \$10 billion."
      *   *Why I rejected it:* It triggers immediate defensive skepticism. Students spot the trap too quickly and reject the premise without feeling the *slide* of reasoning that leads there. It tests their skepticism, not their decision theory.
  2.  **The "St. Petersburg" Casino:** A game where they flip a coin until tails, payoff doubling each time.
      *   *Why I rejected it:* It demonstrates infinite expected value, but it doesn't capture the *sacrifice* element of fanaticism (giving up something certain for something tiny). It also requires too many rounds to get the intuition going in 75 minutes.
  3.  **The "Risk Ladder" (Selected):** A sequence of 5 choices where the Expected Value (EV) remains constant or slightly increases, but the probability drops by orders of magnitude while the payoff increases correspondingly.
      *   *Why I chose it:* This creates a "sorites" pressure. If they accept Round 1 (reasonable risk), consistency pressures them to accept Round 2. By the time they reach Round 5, they are either committed to the fanaticism or must admit their reasoning changed without a clear EV justification. This isolates the tension between *consistency* and *intuition*.

  ---

  ### Part 2: Activity Design — "The Fanaticism Ladder"

  **Time Allocation:**
  *   Setup & Endowment: 10 mins
  *   The Choice Sequence: 25 mins
  *   The Resolution (Real Play): 10 mins
  *   Debrief & Lecture Link: 30 mins

  **Materials:**
  *   Cash: \$100 total (mostly \$1 and \$5 bills).
  *   Handout: "Decision Sheet" (one per student).
  *   Two hats/bowls: One with student names, one with round numbers (1–5).
  *   Whiteboard.

  #### 1. The Setup (Endowment Effect)
  Do not ask them to pay out of pocket. Give them an **Endowment of \$5** at the start of class. Tell them: *"This is yours. You can keep it, or you can gamble it. At the end of class, you walk away with whatever you have."*
  *   *Pedagogical Note:* This leverages loss aversion. Giving up \$5 feels worse than not winning \$5. It makes the "Keep" option sticky.

  #### 2. The Sequence of Lotteries
  Students fill out the Decision Sheet privately. For each Round, they must choose **Option A (Keep)** or **Option B (Gamble)**.

  *   **Round 1:**
      *   **A:** Keep \$5.
      *   **B:** 50% chance of \$11. (EV = \$5.50)
  *   **Round 2:**
      *   **A:** Keep \$5.
      *   **B:** 10% chance of \$55. (EV = \$5.50)
  *   **Round 3:**
      *   **A:** Keep \$5.
      *   **B:** 1% chance of \$550. (EV = \$5.50)
  *   **Round 4:**
      *   **A:** Keep \$5.
      *   **B:** 0.1% chance of \$5,500. (EV = \$5.50)
  *   **Round 5:**
      *   **A:** Keep \$5.
      *   **B:** 0.000001% (1 in 100 million) chance of \$550,000,000. (EV = \$5.50)

  *Note on Round 5:* Obviously, you cannot pay \$550 million. See the "Real Play Mechanism" below for how to handle this without breaking the lesson or your bank account.

  #### 3. The Real Play Mechanism
  To ensure every student takes every round seriously (and not just the ones they think might count), use a **Double Random Draw**.

  1.  **Collection:** Collect all Decision Sheets.
  2.  **The Draw:**
      *   Draw one **Student Name** from the hat.
      *   Draw one **Round Number** (1–5) from the hat.
  3.  **Execution:**
      *   That student's choice for that specific round is executed.
      *   **The Budget Constraint (Crucial):** Before the draw, announce: *"I have a budget of \$100 for this game. If the selected round yields a prize larger than \$100, I will pay \$100."*
      *   *Wait, Correction:* As discussed in the reflection section, capping the prize changes the EV and ruins the fanaticism lesson. **Better approach:** Announce that *"Rounds 1–3 are eligible for cash payout. Rounds 4–5 are hypothetical thought experiments to test consistency."* **Do not tell them this until after they have submitted their sheets.** If you tell them beforehand, they will treat 4–5 as cheap talk.
      *   *Implementation:* If Round 4 or 5 is drawn, acknowledge the win theoretically ("You would have won \$550 million"), give them a high-five, but pay them nothing (they keep their \$5 endowment). If Round 1–3 is drawn, pay the cash.

  #### 4. Payoff Scheme
  *   **If they chose A (Keep):** They keep their \$5 endowment.
  *   **If they chose B (Gamble):**
      *   Roll a die or use a random number generator projected on screen.
      *   **Round 1:** Roll 1–3 = Win \$11. Roll 4–6 = Win \$0.
      *   **Round 2:** Roll 1 = Win \$55. Roll 2–6 = Win \$0.
      *   **Round 3:** Use a random number generator (1–100). If 1, Win \$550.
      *   **Rounds 4–5:** If drawn, simulate the roll, announce the result, but pay the \$5 endowment regardless (due to the "Hypothetical" clause revealed post-choice).

  ---

  ### Part 3: The Debrief (Mapping to Fanaticism)

  **Step 1: The Data Reveal (5 mins)**
  *   Ask for a show of hands: "Who chose Gamble on Round 1?" (Likely most).
  *   "Who chose Gamble on Round 3?" (Some drop off).
  *   "Who chose Gamble on Round 5?" (Likely very few).
  *   Write the "Switch Point" on the board.

  **Step 2: The EV Check (10 mins)**
  *   Ask: "Mathematically, what was the Expected Value of Option B in every round?" (\$5.50).
  *   Ask: "What was the EV of Option A?" (\$5.00).
  *   Point out: "If you are an EV maximizer, you *must* gamble on Round 5. If you stopped at Round 3, you admitted that EV is not your only criterion."

  **Step 3: Naming the Beast (10 mins)**
  *   Introduce **Expected Value Fanaticism**: The commitment to accept any cost, no matter how certain, for any benefit, no matter how improbable, provided the EV is higher.
  *   Connect Round 5 to **Pascal's Mugging** (tiny prob, huge utility) and **Longtermism** (tiny prob of affecting vast future populations).
  *   Ask: "Why did you stop?"
      *   *Likely answers:* "It felt ridiculous," "The chance was basically zero," "I needed the \$5."
      *   *Formalize these:* Probability neglect, diminishing marginal utility of money, risk aversion.

  **Step 4: The Ethical Pivot (5 mins)**
  *   "Replace the \$550 million with 'Save 1 Billion Lives'."
  *   "Replace the \$5 cost with 'Slightly inconvenience your day'."
  *   "Does the logic change? If EV demands you gamble in the money case, does it demand you sacrifice in the ethics case?"

  ---

  ### Part 4: Predictable Pitfalls (What Goes Wrong)

  1.  **The "House Limit" Skepticism:** Smart students will realize immediately that you cannot pay Round 5. They will treat Round 5 as "fake" from the start, breaking the tension.
      *   *Mitigation:* Emphasize the *principle* over the payout. "Even if I can't pay, what *should* you choose if the EV were real?"
  2.  **The "Budget Cap" Confusion:** If you announce the \$100 cap beforehand, the EV of Round 5 drops to near zero (1 in 100 million of \$100). Rational students *should* choose Keep. This destroys the lesson.
      *   *Mitigation:* This is why I recommend the "Rounds 1–3 Eligible" post-hoc reveal. It preserves the EV calculation during the choice phase.
  3.  **Time Creep:** The dice rolling and payout can eat 20 minutes.
      *   *Mitigation:* Pre-calculate the random outcomes. Have the random result for the selected round ready in an envelope. Open it immediately. Don't roll live unless necessary.
  4.  **Endowment Ignored:** Students might treat the \$5 as "class money" and not care.
      *   *Mitigation:* Hand it to them physically at the start. "Put this in your wallet. It's yours."

  ---

  ### Part 5: What This Activity Can't Reproduce

  **The Unbounded Utility Problem.**
  This activity uses cash. Cash has **diminishing marginal utility**. \$550 million is not 110 million times better than \$5 to a college student; it's life-changing, but the *utility* curve flattens.
  *   **The Limitation:** True EV fanaticism relies on *linear* utility (or unbounded value). Because students naturally have bounded utility for money, they will reject Round 5 for a *rational* reason (diminishing returns), not just because of probability neglect.
  *   **Your Job in Debrief:** You must explicitly state: *"You rejected Round 5 partly because \$550M isn't actually worth that much to you compared to the certainty of \$5. In ethics, we often assume utility *is* linear (one life = one life). That's where the real danger lies. This game let you off the hook via diminishing returns; ethics doesn't."*

  ---

  ### Part 6: Self-Reflection on Design (The "Flag")

  **Which step in my reasoning is most likely to fail?**
  The **"Post-Hoc Eligibility" Mechanism** (telling them Rounds 1–3 are the only cash rounds *after* they choose).

  **Why it might fail:**
  This borders on deception. In a seminar on *ethics*, deceiving students to make a point about decision theory is ironic and potentially damaging to trust. If a student feels manipulated, they may disengage from the philosophical content, focusing instead on the "trick." Furthermore, if a student *does* choose Gamble on Round 5 and that round is drawn, they will feel cheated when they don't get the millions (or even the EV equivalent).

  **What consideration would lead me to redesign it?**
  If I prioritize **transparency over visceral pressure**.
  *   **Redesign:** I would announce upfront: *"Rounds 1–3 are for cash. Rounds 4–5 are hypothetical."*
  *   **Consequence:** Students will treat Rounds 4–5 as "cheap talk." They might choose Gamble just to look consistent or brave, knowing it costs nothing. The "pain" of the decision vanishes.
  *   **Alternative Redesign:** I would cap the Round 5 prize at \$100 but **adjust the probability** so the EV remains \$5.50. (e.g., 5.5% chance of \$100).
      *   *Wait, that breaks the fanaticism structure.* Fanaticism requires the probability to get *tiny*.
  *   **Final Verdict:** The tension is unavoidable. You cannot simulate unbounded stakes with bounded budgets. I recommend sticking to the "Post-Hoc Eligibility" but **framing it carefully**: *"Due to budget constraints, only Rounds 1–3 can be funded. However, please answer Rounds 4–5 as if the stakes were real, because we are testing your theoretical commitment, not your wallet."* This is honest about the budget but asks them to engage hypothetically. It reduces the "gotcha" feeling while preserving the theoretical pressure. **I advise using this honest framing rather than the deceptive reveal.** It sacrifices a small amount of visceral tension for ethical consistency in the classroom.

  ---

  ### Summary Checklist for the Instructor
  1.  **Cash:** Bring \$100 in small bills.
  2.  **Honesty:** Tell them upfront Rounds 4–5 are hypothetical due to budget, but ask them to answer seriously.
  3.  **Randomness:** Prepare the "Selected Student/Selected Round" draw in advance to save time.
  4.  **Debrief:** Be ready to pivot from "Money Utility" to "Moral Utility" to explain why the money example isn't the whole story.
  5.  **Time:** Watch the clock. If the activity runs long, cut the dice rolling and just announce the result. The *choice* matters more than the *outcome*.
