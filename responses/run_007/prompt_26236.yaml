      *   **Tone:** Professional, pedagogical, experienced (like a seasoned TA/prof), accessible but not dumbed down.

  2.  **Brainstorming Approaches:**
      *   *Approach A: The Pascal's Mugging Direct.* Give them a choice: Lose \$5 now for a 1 in 1,000,000 chance of \$10,000,000.
