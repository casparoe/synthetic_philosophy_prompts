      *   *Approach B: The St. Petersburg Variation.* Classic infinite EV game.
          *   *Critique:* Hard to implement with real cash in a classroom. Infinite expectations break the "real stakes" constraint.
      *   *Approach C: The Graduated Risk Ladder.* Start with reasonable risks (50% for \$10 vs \$4), then slowly decrease probability while increasing payoff to keep EV constant or slightly rising, until the probability is microscopic.
          *   *Critique:* This is the strongest candidate. It creates a "sorites" style pressure. If they accept step 1, why not step 2? If they accept step $n$, why not $n+1$?
      *   *Approach D: The Charity Donation Frame.* Frame it as donating vs. keeping money, where the donation has a tiny chance of saving a life.
          *   *Critique:* Ethical baggage might interfere with the pure decision theory lesson. Better to keep it abstract (money) first, then map to ethics in debrief.

      *Decision:* Go with **Approach C (The Graduated Risk Ladder)**. It best isolates the mathematical structure of fanaticism without triggering immediate ethical defense mechanisms. It allows for the "slippery slope" experience.

