      *   *Option 3 (Adopt with Conditions/Strategic Signaling):* This seems the most nuanced and "philosophical" approach. It acknowledges the trap but tries to hack it. It allows the department to signal quality without sacrificing students entirely.
      *   *Decision:* I will recommend **Adopt with Conditions**. Specifically, a pilot program with a "signaling" mechanism that turns the constraint into a feature, rather than a bug. This addresses the efficacy concern (making the constraint legible to admissions committees) and the blame concern (shared responsibility).

  3.  **Drafting - Section by Section:**

