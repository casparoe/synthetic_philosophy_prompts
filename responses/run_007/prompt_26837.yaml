      *   **Addressing Faculty Liability:** How to protect writers from blame. The department must own the policy collectively.
      *   **Timeline:** Pilot period (e.g., 2 years) with review.
      *   **Closing:** Call to action.

  4.  **Refining the Argument (Self-Correction during drafting):**
