      *   **Addressing the Opposition (The "Naivety" Objection):** This is crucial. I need to show I understand that unilateral disarmament usually fails in prisoner's dilemmas.
          *   *Counter:* It fails *unless* the disarmament is legible as a signal of quality. If top programs coordinate implicitly, a constraint can become a badge of honor.
      *   **The Proposal (Adopt with Conditions):**
          *   Cap length (e.g., 500 words).
