      *   Make sure the recommendation is clear (Adopt with Conditions).
      *   Check the tone—collegial but firm.

      *(Self-Correction on Stance)*: Actually, arguing for *unilateral* action is risky. A stronger philosophical position might be "Strategic Coordination." We adopt the policy *conditional* on reaching out to 5-10 peer programs to do the same. But that might be too slow. Let's go with "Adopt with Conditions" where the condition is *signaling* and *review*. The memo should argue that being the first to break the norm creates a focal point for others.

      *Revised Plan:* Recommend adopting the cap *but* coupling it with a proactive communication strategy to admissions committees at peer institutions. This turns the "naivety" into "leadership."

