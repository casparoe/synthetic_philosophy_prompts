answer: |-
  Harsanyi's theorem does not offer a free-standing proof of utilitarianism but rather demonstrates that it is the unique solution only if one accepts cardinal utility and interpersonal comparability, assumptions Arrow explicitly excludes. Arrow's impossibility theorem operates on ordinal preferences, forbidding any comparison of intensity between individuals, which leads to the conclusion that no fair aggregation method exists without dictatorship. In contrast, Harsanyi utilises von Neumann-Morgenstern utility functions, which derive cardinality from rational behaviour under uncertainty, thereby allowing for the measurement of preference intensity. The critical divergence lies in Harsanyi's assumption of interpersonal comparability; he posits that utility units can be scaled consistently across different people, whereas Arrow treats utility as purely individual and non-comparable. Regarding the accusation of smuggling in the conclusion, the theorem does not presuppose utilitarianism itself, but it does presuppose a metric of welfare that makes utilitarianism the only mathematically consistent outcome. If one accepts that welfare can be measured cardinally and compared across persons, the linear summation of utilities follows logically from the Pareto principle; however, if one rejects interpersonal comparability as empirically meaningless or ethically unjustified, the theorem collapses. Therefore, the argument is genuine in its internal logic but rests on substantive premises about the nature of utility that are themselves contested, effectively shifting the philosophical burden from aggregation to measurement. Ultimately, Harsanyi shows that utilitarianism is the price one must pay for coherent social welfare aggregation under conditions of cardinal comparability, while Arrow shows that without such conditions, coherent aggregation is impossible.
