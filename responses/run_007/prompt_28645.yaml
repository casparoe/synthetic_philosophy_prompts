answer: |-
  You have put your finger on one of the most persistent and significant tensions in the philosophy of biology and the social sciences. Your observation is not merely a misunderstanding of the statistics; it is a critique shared by prominent philosophers of science (such as Richard Lewontin, Evelyn Fox Keller, and James Tabery) who argue that the *rhetorical use* of heritability often outstrips its *logical warrant*.

  To answer your central question directly: **No, the practice is not philosophically coherent as it stands.** The treatment of heritability coefficients as headline discoveries regarding "how much genes matter" implicitly relies on causal and metaphysical assumptions that the technical definition of heritability explicitly excludes.

  Here is an analysis of the philosophical commitments presupposed by this practice, broken down by the specific tensions you identified.

  ### 1. The Variance/Causation Confusion
  **The Technical Definition:** Heritability ($h^2$) is a ratio of variances ($V_G / V_P$). It describes the proportion of *differences* between individuals in a specific population that can be statistically accounted for by genetic *differences*. It says nothing about the development of the trait in an individual.
  **The Headline Usage:** "Genes account for 50% of intelligence."

  **The Philosophical Commitment:**
  This usage presupposes a **partitioning view of causation**. It assumes that the causes of a trait can be sliced into discrete percentages, like ingredients in a cake. If a cake is 50% flour and 50% sugar, you can meaningfully ask which ingredient is "more responsible" for the cake.

  However, in development, genes and environment are more like the length and width of a rectangle determining its area. Asking whether length or width is "more responsible" for the area is category error; both are necessary conditions. By reporting $h^2$ as a measure of "genetic influence," researchers implicitly commit to **genetic essentialism**: the idea that there is a "genetic component" to the trait that exists independently of the environment, waiting to be measured.

  This is what Richard Lewontin famously critiqued in *Analysis of Variance and the Analysis of Causes* (1974). He argued that ANOVA (the statistical basis of heritability) partitions variance, not causes. To move from "variance associated with genetic markers" to "genes cause the trait" requires a leap that the statistic itself cannot justify.

  ### 2. The Assumption of Additivity and Separability
  You asked whether the practice presupposes that genes and environments are separable causal factors. The answer is **yes**.

  The standard biometric model relies on the equation:
  $$V_P = V_G + V_E + V_{GxE}$$
  (Variance in Phenotype = Variance in Genes + Variance in Environment + Interaction)

  For heritability estimates to be stable and interpretable as "genetic contribution," researchers must assume that $V_{GxE}$ (interaction) is negligible or can be subsumed into the main effects. This presupposes **causal additivity**. It assumes that genes do their work *independently* of the specific environmental context, or that the environment is essentially a uniform background against which genetic differences play out.

  **The Philosophical Problem:**
  Developmental Systems Theory (DST) argues that this separability is false. Genes are resources that are activated, silenced, and interpreted by cellular and environmental contexts. A gene for "height" does not code for height; it codes for a protein that contributes to growth *given* specific nutritional and hormonal inputs. By treating $V_G$ as a distinct bucket, behavioral genetics implicitly adopts a **preformationist** view of development (that the trait is pre-contained in the genes) rather than an **epigenetic** or **interactionist** view (that the trait emerges from the system).

  When researchers report high heritability, they are often interpreted (and often interpret themselves) as having found the "genetic ceiling" of a trait. This only makes sense if one assumes genes and environment are separable levers. If they are entangled, pulling the "genetic lever" is impossible without also moving the "environmental lever."

  ### 3. The Within-Group / Between-Group Fallacy
  You asked what view of the relationship between within-group variance and between-group differences is taken for granted in policy debates.

  **The Technical Reality:**
  High within-group heritability tells you *nothing* about the cause of differences between groups.
  *   **Lewontin's Seed Analogy:** Take a handful of genetically diverse corn seeds. Plant half in rich soil (Group A) and half in poor soil (Group B).
      *   *Within Group A:* Differences in height are highly heritable (because soil is constant, so remaining variance is genetic).
      *   *Within Group B:* Differences in height are highly heritable (same reason).
      *   *Between Groups:* The difference in average height is 100% environmental (soil quality), despite high within-group heritability.

  **The Policy Presupposition:**
  When heritability is invoked in policy (e.g., "Education interventions have limits because $h^2$ is high"), commentators are implicitly assuming that **the causes of variance within a group are the same as the causes of the mean difference between groups.**

  This is an ecological fallacy. However, it relies on a deeper philosophical commitment: **Biological Determinism.** It assumes that if a trait is "genetic" within a population, the trait is "fixed" or "entrenched" in a way that resists environmental manipulation. This conflates *origin* with *malleability*.
  *   **Phenylketonuria (PKU):** This condition is 100% heritable (genetic). It is also 100% malleable (treatable by diet).
  *   **The Commitment:** Policy debates that cite heritability to suggest limits on intervention presuppose that genetic causation implies **immutability**. This is not a genetic fact; it is a metaphysical assumption about the rigidity of biological systems.

  ### 4. Why Report It? (The Function of the Statistic)
  If the statistic is so easily misinterpreted, why is it the headline finding?

  1.  **Heuristic Value:** For researchers, $h^2$ is a "go/no-go" signal. If $h^2$ is near zero, there is no point looking for specific genes (GWAS). If it is high, it justifies the search for biological mechanisms. It is a funding and strategy tool, not necessarily a truth claim about human nature.
  2.  **The "Missing Heritability" Drive:** The gap between twin-study heritability and DNA-based heritability drives the entire molecular genetics industry. Reporting high $h^2$ creates the puzzle that justifies further research.
  3.  **Cultural Resonance:** As philosopher Philip Kitcher has noted, society is deeply invested in knowing "who we really are." Heritability coefficients satisfy a cultural demand for a number that quantifies "nature" vs. "nurture," even if biologists know that distinction is incoherent at the individual level.

  ### Conclusion: Is it Coherent?
  The practice is **statistically coherent** but **philosophically unstable**.

  It relies on an **implicit causal interpretation** (genes as independent agents contributing a specific percentage of "force" to the trait) that the **explicit statistical definition** (genes as correlates of variance in a specific context) disavows.

  When researchers write the fine print, they are acting as **population geneticists** (describing variance structures). When they write the headline or speak to policy, they often slip into acting as **essentialists** (describing the intrinsic nature of the trait).

  Your intuition is correct: The tension you sense is the friction between a rigorous statistical method and a metaphysical worldview that wants to treat genes as separable, deterministic causes. Until the field explicitly adopts a framework that treats development as an indivisible system (where $G$ and $E$ are not partitionable causes but interacting processes), this disconnect will remain a source of confusion and potential misuse.

  **Recommended Reading for further exploration:**
  *   **Richard Lewontin**, *The Doctrine of DNA: Biology as Ideology* (Specifically the chapter on ANOVA).
  *   **Evelyn Fox Keller**, *The Century of the Gene* (On the gap between genetic rhetoric and genetic reality).
  *   **James Tabery**, *Beyond Versus: The Struggle to Understand the Interaction of Nature and Nurture* (On the history of the GxE interaction).
  *   **Susan Oyama**, *The Ontogeny of Information* (For the Developmental Systems Theory alternative).
