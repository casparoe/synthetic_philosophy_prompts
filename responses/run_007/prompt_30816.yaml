answer: |-
  ### Desiderata for an Account of the Diary's Bearing on Frege's Philosophy

  To move beyond speculative biography or defensive hagiography, an account of the bearing of Frege's 1924 diary on his philosophical work must satisfy the following six desiderata. The first five are derived from the logical constraints of interpreting unpublished political writings alongside published technical doctrine; the sixth addresses the hermeneutic stance of the interpreter.

  #### 1. Explicit Typology of Relation
  *   **Specification:** The account must categorize the proposed link between the diary and the philosophy as **genetic** (politics caused the logic), **justificatory** (logic supports the politics), **expressive** (logic manifests the same worldview as the politics), or **contextual** (politics clarifies the milieu of the logic). It must further specify what empirical or textual evidence would confirm or disconfirm this specific typology.
  *   **Motivation:** Claims that politics "influenced" logic are vacuous without specifying the direction and nature of causation. A genetic claim requires biographical chronology; an expressive claim requires structural homology.
  *   **Status:** **Non-Negotiable.** (Note: While *specifying* the type is mandatory, the *choice* of which relation to posit is an **Interpretive Preference** internal to different schools.)

  #### 2. The Publication Asymmetry Constraint
  *   **Specification:** The account must explain why private, unpublished, and potentially inconsistent diary entries should be granted authority over, or used to reinterpret, public, peer-reviewed, and systematically argued philosophical texts which Frege authorized for publication.
  *   **Motivation:** Frege withheld the diary. Treating it as the "key" to his philosophy risks privileging his unfiltered prejudices over his disciplined arguments, reversing the evidentiary weight Frege himself assigned to his public output.
  *   **Status:** **Non-Negotiable.**

  #### 3. The Textual Burden of Proof
  *   **Specification:** An account claiming illumination must identify *which* specific published commitments (e.g., the context principle, the distinction between sense and reference) are clarified. An account claiming immunity must explain *why* those commitments are structurally insulated from the author's ideological state.
  *   **Motivation:** Global claims (e.g., "the diary changes everything" or "the diary changes nothing") avoid the labor of interpretation. One must pinpoint the locus of the bearing to avoid overgeneralization.
  *   **Status:** **Non-Negotiable.**

  #### 4. The Mechanism of Specific Content
  *   **Specification:** The account must demonstrate how specific ideological propositions in the diary (e.g., views on voting, specific anti-Semitic tropes, monarchist loyalty) map onto specific philosophical moves, rather than relying on general ideological tendencies (e.g., "authoritarianism").
  *   **Motivation:** General affinities (e.g., "Frege liked order, and logic is orderly") are coincidental. A defensible bearing requires a mechanism showing how a specific political commitment necessitates or motivates a specific logical notation or metaphysical thesis.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Tripartite Distinction
  *   **Specification:** The account must distinguish between: (a) relevance to understanding the *text* (exegesis), (b) evidence regarding Frege's *intellectual character* (biography), and (c) the *validity* of the arguments themselves (truth).
  *   **Motivation:** Conflating these leads to the genetic fallacy (rejecting logic because the man was bigoted) or the intentional fallacy (accepting logic because the man was sincere). Philosophical evaluation requires separating the argument from the arguer.
  *   **Status:** **Non-Negotiable.**

  #### 6. Hermeneutic Weighting
  *   **Specification:** The account must declare its stance on hermeneutic charity: does it prioritize reconstructing the most coherent philosophical system (maximizing consistency) or historicizing the author as a product of his time (maximizing contextual fidelity)?
  *   **Motivation:** Different schools weigh contradictions differently. Analytic historians often prioritize system-building; contextual historians prioritize biographical coherence. Acknowledging this weighting clarifies why two accounts might reach different conclusions from the same evidence.
  *   **Status:** **Interpretive Preference.**

  ***

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding currently popular positions is **Requirement 4 (The Mechanism of Specific Content)**.

  Most existing literature fails here. The "Irrelevance" position often assumes immunity without proving insulation (failing Req 3), but the "Political Substance" position fails more egregiously on Req 4. It is common to assert that Frege's Platonism is "aristocratic" or his anti-psychologism is "anti-democratic." However, these are metaphors, not mechanisms. Unless an interpreter can show how a specific objection to universal suffrage *entails* a specific notation in the *Begriffsschrift*, the account remains an assertion of affinity rather than an explanation of bearing. Req 4 forces the interpreter to move from "Frege was a reactionary" to "Frege's reactionism required *this* logical axiom," which is a much higher bar that most current political readings cannot clear.

  ***

  ### Scorecard of Common Positions

  | Position | Performance against Desiderata | Verdict |
  | :--- | :--- | :--- |
  | **1. The Autonomy Thesis**<br>(Diary is irrelevant to technical philosophy) | **Fails Req 3.** It asserts immunity but rarely explains *why* logical truths are immune to the author's ideological collapse. It treats the separation of logic and politics as a given rather than a defended position. | **Defensible but Incomplete.** It protects the arguments but neglects the textual burden of explaining *why* the diary doesn't leak into the exegesis. |
  | **2. The Latent Substance Thesis**<br>(Diary reveals reactionary substance in Platonism/Anti-psychologism) | **Fails Req 4.** It relies on general ideological tendencies ("order," "hierarchy") rather than specific content mechanisms. It often conflates the *metaphor* of logic with the *politics* of logic. | **Undefensible.** It posits a bearing without a mechanism, violating the core constraint of philosophical interpretation. |
  | **3. The Contextual Rationalism Thesis**<br>(Diary matters for character/context, not logic) | **Fails Req 5.** It frequently blurs the line between understanding Frege's *motivation* (character) and the *meaning* of his text (exegesis), suggesting the logic is "conservative" without addressing the validity of the arguments. | **Partially Defensible.** It handles the asymmetry (Req 2) well but often collapses the tripartite distinction, muddying the philosophical evaluation. |

  **Summary:** A defensible account must treat the diary not as a key that unlocks the logic, nor as noise to be ignored, but as a distinct textual corpus that requires a specified, mechanistic bridge to the published doctrine. Failure to build that bridge (Req 4) or to acknowledge the gap between private thought and public argument (Req 2) renders the account biographically interesting but philosophically null.
