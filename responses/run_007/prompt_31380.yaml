prompt: |-
  I am a programming-language researcher. My native vocabulary consists of type systems, evaluation semantics, side effects, referential transparency, preconditions and postconditions, exception handling, and the distinction between expressions that denote values and statements that change state. My exposure to philosophy of language is thin. I gather that Austin and his successors held that many utterances are not descriptions of independently existing facts but acts: that uttering the words I promise under the right conditions is the promising, not a report of a mental act; that the initial distinction between constative and performative utterances turned out to be unstable and was replaced by a taxonomy of locutionary, illocutionary, and perlocutionary acts; and that a speech act can go wrong not by being false but by being infelicitous — the wrong person, the wrong procedure, a defective proposition, insincere intent, or a failure of uptake by the hearer, with the conditions standardly sorted into propositional content, preparatory, sincerity, and essential conditions. I have also heard that there is a live dispute between conventionalist accounts, on which the force of a speech act comes from social rules or institutions (for example, a constitutive rule that a certain utterance counts as a promise in a certain context), and intention-based accounts, on which it comes from the speaker's communicative intention and the hearer's recognition of it.

  Restate this body of thought systematically in my vocabulary. What, if anything, corresponds to an illocutionary act: a function with a side effect, a change to some shared context, a transaction, an assertion in a proof system? What corresponds to felicity conditions: preconditions, type well-formedness, exception cases, invariants? What corresponds to uptake: a return value, an acknowledgement message, a state change visible to another process? I want the translation to be honest: say explicitly where the mapping is exact, where you had to stretch either the philosophy or my vocabulary, and where something in the speech-act picture simply has no counterpart in how I think about programs. Then give me the residue report. Is what fails to translate a symptom of an impoverished framework on my side, or of a less precise concept on the philosophy side? In particular, I want to know whether illocutionary force is anything over and above a program's effect on state plus a type, and whether uptake is a genuine ingredient or merely a runtime condition that a programming-language view can safely ignore.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Programming-language (PL) researcher. Deeply familiar with type systems, semantics, side effects, referential transparency, Hoare logic (pre/postconditions), exceptions, expression/statement distinction. Thin exposure to philosophy of language.
      *   **Input Knowledge:** The user already knows the basics of Speech Act Theory (Austin, Searle): constative vs. performative (unstable), locutionary/illocutionary/perlocutionary, felicity conditions (propositional, preparatory, sincerity, essential), conventionalist vs. intention-based accounts.
      *   **Task:** Restate Speech Act Theory (SAT) systematically using PL vocabulary. Map specific concepts (illocutionary act, felicity conditions, uptake) to PL concepts (functions, side effects, types, preconditions, return values, etc.).
      *   **Constraint:** Be honest about the mapping (exact, stretched, missing). Provide a "residue report" (what doesn't translate and why). Address specific questions: Is illocutionary force just state + type? Is uptake ignorable?

  2.  **Deconstruct Speech Act Theory (SAT) into PL Terms:**

      *   *Utterance:* A function call or method invocation.
      *   *Locutionary Act:* The syntax/semantics of the expression itself (parsing, type checking, evaluation to a value).
      *   *Illocutionary Act:* The *intent* or *force* of the call. In PL, this looks like the *effect* or the *protocol operation* being invoked. It's not just the return value; it's the *kind* of operation (e.g., `commit()`, `assert()`, `promise()`).
      *   *Perlocutionary Act:* The consequence on the world/user psychology. In PL, this is downstream effects, logging, triggering other systems, user emotional response (hard to model).
      *   *Felicity Conditions:*
          *   *Propositional Content:* Type correctness, argument validity.
          *   *Preparatory Conditions:* Preconditions (Hoare logic), state invariants required before the call.
          *   *Sincerity Conditions:* Internal state consistency (hard to check externally, like `assert(!is_malicious)`).
          *   *Essential Conditions:* The postcondition or the guarantee of the state change (the "contract").
      *   *Uptake:* The receiver acknowledging the act. In PL, this is a handshake, an ACK, a return code, or a state change visible to the caller/environment.
      *   *Conventionalist vs. Intention-based:* API Contracts/Protocols (Conventionalist) vs. Intent Inference/Documentation (Intention-based).

  3.  **Drafting the Mapping (Iterative Process):**

      *   *Illocutionary Act:* Is it a function with side effects? Yes, but specifically one that *changes the context of discourse*. In PL, this is like a transaction or a state transition in a state machine. It's not just `x + y`; it's `commit_transaction()`.
      *   *Felicity Conditions:* These map very well to Hoare Logic `{P} C {Q}`.
          *   Preparatory $\rightarrow$ Precondition `P`.
          *   Essential $\rightarrow$ Postcondition `Q`.
          *   Propositional $\rightarrow$ Type signature.
          *   Sincerity $\rightarrow$ This is tricky. In code, we assume the code does what it says. In speech, I can lie. This maps to *trust* or *verification*. Maybe static analysis vs. runtime check.
      *   *Uptake:* Is it a return value? Sometimes. But often it's the *environment* accepting the state change. If I throw an exception, uptake failed. If I return `OK`, uptake succeeded.
      *   *Conventionalist:* The Type System / API Specification.
      *   *Intention-based:* The Documentation / Comments / Developer Intent (not enforced by compiler).

  4.  **Addressing the "Residue" (The Hard Part):**

      *   *What doesn't fit?*
          *   **Sincerity:** Code doesn't have "beliefs." A function either does X or it doesn't. A human can say "I promise" and not mean it. In PL, `promise()` either enforces the promise (type system) or it's a comment. There is no "lying" in execution, only bugs or malicious code.
          *   **Normativity:** Speech acts create *obligations*. If I promise, I *ought* to fulfill it. In PL, if I call `lock()`, I *must* call `unlock()`. This is resource safety (linear types, RAII). This maps well, but the *moral* weight is missing.
          *   **Context Dependence:** Speech acts depend heavily on social context. PL contexts are usually explicit (environment, heap, global state).
          *   **Uptake:** In PL, if the receiver crashes, the sender might not know (unless synchronous). In speech, if the hearer doesn't understand, the act *fails*. In PL, if the OS kills the process, the syscall still "happened" from the kernel's perspective, but the app sees an error.

  5.  **Answering the Specific Questions:**

      *   *Is illocutionary force just state + type?* No. It's the *protocol role*. `send()` vs. `receive()`. Same state change potential, different force. It's closer to a *session type* or a *protocol state machine*.
      *   *Is uptake ignorable?* No. In distributed systems, consensus matters. In single-threaded code, maybe. But for "acts" (like transactions), commit/ack is crucial.

  6.  **Refining the Vocabulary:**

      *   Use terms like "Effect System," "Session Types," "Hoare Triples," "Linear Types," "Protocol State Machines."
      *   Avoid over-philosophizing; keep it technical.
      *   Structure:
          1.  Systematic Restatement (The Translation).
          2.  Fidelity Report (Exact vs. Stretched vs. Missing).
          3.  Residue Report (The Gap Analysis).
          4.  Direct Answers to the Final Questions.

  7.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Map Illocution to Side Effect.
      *   *Correction:* Too broad. `x = x + 1` is a side effect but not really an illocutionary act in the rich sense. It needs to be a *communicative* act. Better mapping: **Protocol Transition** or **Effect with Intent**.
      *   *Initial thought:* Map Sincerity to Comments.
      *   *Correction:* Comments are ignored by compiler. Sincerity is a condition for the act to be *happy*, not just documented. Better mapping: **Invariant Trust** or **Non-observable Internal State** (which PL usually ignores).
      *   *Nuance:* The user asked about "Conventionalist vs. Intention-based." In PL, this is "Formal Specification (Type/Contract)" vs. "Informal Intent (Doc/Comment)."
      *   *Uptake:* Is it a return value? If I fire-and-forget, is there uptake? Austin says without uptake, the act misfires. In PL, fire-and-forget is valid. This is a divergence.

  8.  **Final Polish:** Ensure the tone is respectful of the user's expertise (PL researcher) while accurately representing the philosophy (without dumbing it down). Make sure the "Residue" section is critical and insightful. (Self-correction: Ensure I explicitly address the "impoverished framework" vs. "less precise concept" question).

  9.  **Structure of the Output:**
      *   **Introduction:** Acknowledge the mapping strategy.
      *   **The Translation Layer:** Mapping SAT concepts to PL concepts.
      *   **Fidelity Analysis:** Where it holds, where it stretches.
      *   **The Residue Report:** What's left over.
      *   **Direct Answers:** Force and Uptake.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is a systematic restatement of Speech Act Theory (SAT) translated into the vocabulary of programming-language (PL) research, followed by a fidelity analysis and a residue report.

  ### I. The Translation Layer: SAT as Semantics and Effects

  We can model a Speech Act as a **typed effectful operation within a distributed protocol state machine**.

  | Speech Act Concept | PL Research Equivalent |
  | :--- | :--- |
  | **Utterance** | **Function Invocation / Message Send.** The syntactic production of a term that triggers evaluation. |
  | **Locutionary Act** | **Evaluation Semantics.** The successful parsing, type-checking, and reduction of the expression to a value (or normal form). It is the "propositional content" being constructed. |
  | **Illocutionary Act** | **Protocol Transition / Effect Constructor.** The classification of the operation within an effect system or session type. It is not just *that* state changes, but *what kind* of state change is authorized (e.g., `commit`, `assert`, `promise`, `bid`). |
  | **Perlocutionary Act** | **Downstream Causal Effects.** Observables external to the return value or immediate state (e.g., logging, triggering interrupts, changing user belief state). Often non-deterministic and hard to specify in postconditions. |
  | **Felicity Conditions** | **Hoare Triples & Type Invariants.** |
  | $\quad$ *Propositional Content* | **Type Well-formedness.** The arguments must inhabit the expected types. |
  | $\quad$ *Preparatory Conditions* | **Preconditions (`requires`).** State invariants that must hold in the heap/context prior to invocation (e.g., mutex is unlocked, account has funds). |
  | $\quad$ *Sincerity Conditions* | **Internal Invariants / Trust Assumptions.** Conditions on the caller's internal state that are not externally verifiable (e.g., "caller intends to fulfill obligation"). Maps to **documentation** or **unverified assertions**. |
  | $\quad$ *Essential Conditions* | **Postconditions (`ensures`).** The guarantee of the state transition. If this fails, the act is void (exception thrown / transaction rolled back). |
  | **Infelicity** | **Runtime Exception / Contract Violation.** The operation fails not by returning `false`, but by raising an exception, failing an assertion, or violating a linear type constraint. |
  | **Uptake** | **Handshake / Acknowledgement.** A synchronous return value, a commit confirmation, or a visible state change in the receiver's interface that validates the transition. |
  | **Conventionalist Account** | **Formal API / Protocol Specification.** Force is derived from the type system and interface definition (e.g., "Implementing `IDisposable` counts as promising to release resources"). |
  | **Intention-Based Account** | **Informal Semantics / Developer Intent.** Force is derived from comments, documentation, and the assumption that the code accurately reflects the programmer's goal. |

  ---

  ### II. Fidelity Analysis: Exact, Stretched, and Missing

  #### 1. Exact Mappings
  *   **Felicity $\approx$ Preconditions:** The mapping of preparatory conditions to Hoare preconditions is robust. If you call `withdraw(amount)` without `balance >= amount`, the act is infelicitous (throws `InsufficientFunds`).
  *   **Infelicity $\approx$ Exceptions:** Austin's distinction between an act being "false" vs. "infelicitous" maps cleanly to the distinction between a function returning `false` (a value) vs. throwing an exception (a control flow break/contract violation).
  *   **Conventionalism $\approx$ Type Systems:** The idea that social rules constitute the act maps perfectly to constitutive rules in type theory. A value is only a `Promise` if it inhabits the `Promise` type and follows the reduction rules associated with that type.

  #### 2. Stretched Mappings
  *   **Sincerity Conditions:** In PL, we generally assume the code *is* the intent. If a function says `save()`, it saves. In SAT, a speaker can say "I promise" while intending not to. To map this, we must treat "Sincerity" as an **unverified precondition** or a **trust boundary**. We can enforce that the *structure* of the promise is valid, but not the *mental state* of the caller. This stretches the PL view, which usually treats internal state as either encapsulated (private) or irrelevant to correctness.
  *   **Illocutionary Force:** Mapping this to "Effect" is slightly reductive. Two functions might have identical state effects (e.g., setting a boolean flag) but different illocutionary forces (one is `acknowledge()`, the other is `authorize()`). To capture this, we need **Session Types** or **Protocol States**, where the *history* of calls determines the validity of the current call, not just the heap state.

  #### 3. Missing Counterparts
  *   **Normative Obligation:** In SAT, a successful promise creates a *moral* obligation. In PL, a successful `lock()` creates a *liveness/safety* obligation (you *must* unlock to avoid deadlock). PL captures the *structural* obligation (linear types, RAII) but lacks the *normative* weight. The compiler cannot punish you for being "rude," only for being "unsafe."
  *   **Shared Context Construction:** SAT emphasizes that speech acts often *create* the context they rely on (e.g., "I name this ship..." creates the ship's name). In PL, context (environment, heap) is usually pre-allocated. While dynamic allocation exists, the idea that the utterance *constitutes* the object's identity is less common than the object existing prior to the method call.

  ---

  ### III. The Residue Report

  What fails to translate, and why?

  #### 1. The Residue: Sincerity and Normativity
  The primary residue is the **internal mental state of the agent** and the **normative force** of the commitment.
  *   **PL Side:** In PL, "intent" is irrelevant; only behavior matters. If a function fulfills its postcondition, it is correct, even if the programmer wrote it by accident.
  *   **Philosophy Side:** In SAT, if I say "I promise" but secretly intend to break it, the act is *abused* (insincere), even if I technically fulfill it later.
  *   **Diagnosis:** This is not an impoverishment of the PL framework; it is a **deliberate abstraction**. PL semantics are designed to be objective and verifiable. "Sincerity" is a property of the *programmer*, not the *program*. However, the lack of *normative* force (obligation vs. constraint) is a limitation. PL enforces constraints (you *cannot* access freed memory); it does not enforce obligations (you *should* reply to this message within 5ms). **Linear Logic** and **Session Types** are attempts to close this gap, turning obligations into type-level constraints.

  #### 2. The Residue: Uptake and Asynchrony
  *   **PL Side:** In many PL models (especially imperative or actor-based), a send is valid even if no one receives it (fire-and-forget).
  *   **Philosophy Side:** Austin argues that without uptake, the act is *hitched* (misfires). If I bid at an auction but the auctioneer doesn't hear me, no bid occurred.
  *   **Diagnosis:** Here, the **Philosophy is more precise about distributed consensus**. The PL view often treats "send" as a local state change (buffer updated). The SAT view correctly identifies that certain acts are *relational* and require a handshake to be ontologically complete. A "transaction commit" in a database is a better PL analogue than a simple "function call." If the commit isn't acknowledged, the transaction is void.

  ---

  ### IV. Direct Answers to Your Questions

  #### 1. Is illocutionary force anything over and above a program's effect on state plus a type?
  **Yes.** It corresponds to **Protocol Role** within a Session Type.
  Two functions may have the signature `Unit -> Unit` and modify the same heap cell.
  *   `finalize()` might have the force of **terminating** a session.
  *   `ping()` might have the force of **keeping alive** a session.
  The state change might be identical (updating a timestamp), but the *illocutionary force* determines what transitions are valid *next*. In PL terms, force is the **edge label in the protocol state machine**, not just the node transition. It is metadata that constrains the *future* evaluation context, not just the current heap.

  #### 2. Is uptake a genuine ingredient or merely a runtime condition that a programming-language view can safely ignore?
  **Uptake is a genuine ingredient; ignoring it is unsafe for distributed or concurrent semantics.**
  If you model a system where uptake is ignored (e.g., UDP semantics), you cannot reason about **agreement** or **commitment**.
  *   In SAT, uptake converts a subjective intention into an intersubjective fact.
  *   In PL, uptake converts a local state change into a **consistent global state**.
  If you ignore uptake, you cannot distinguish between a **crash failure** and a **successful no-op**. For "acts" that constitute agreements (transactions, locks, handshakes), uptake is part of the **postcondition**. `{P} act {Q}` is false if the receiver did not acknowledge the transition to `Q`. Therefore, a PL semantics that ignores uptake is only valid for single-threaded, failure-free environments. For any system modeling communication, uptake must be modeled as a **synchronization barrier** or **acknowledgement token**.

  ### Summary Recommendation for a PL Researcher
  To fully internalize Speech Act Theory without leaving your vocabulary:
  1.  Treat **Illocution** as **Session Types** (constraints on the sequence of effects).
  2.  Treat **Felicity** as **Hoare Logic** (pre/postconditions + exception safety).
  3.  Treat **Sincerity** as **Unverified Preconditions** (trust boundaries).
  4.  Treat **Uptake** as **Consensus/Acknowledgement** (required for distributed postconditions).

  The "residue" (normativity/sincerity) suggests where PL research is heading: **Dependent Types** and **Linear Logic** are attempts to encode the "obligations" and "contextual constitutions" that Austin identified, moving from "code that runs" to "code that commits."
