      *   *Constraints vs. Selection:* Still relevant, but often framed poorly. Needs reframing as integration.
      *   *Optimality Models:* Still used, but the philosophical critique is well-known. How do biologists *actually* use them now?
      *   *Evo-Devo/Developmental Bias:* Huge area. How does this fit into adaptationism?
