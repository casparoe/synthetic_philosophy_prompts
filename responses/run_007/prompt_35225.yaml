  - Rank (1 = most residual difficulty; use ties if you think they are warranted)
  - Paradox
  - Residual-difficulty score (0–10)
  - The specific problem left open
  - Why the standard resolution does or does not close it

  After the table, add one short paragraph naming which single paradox you would assign as required reading for a seminar less interested in the mathematics of convergence than in what the paradoxes reveal about the concept of motion, and why. Please write in American English.
