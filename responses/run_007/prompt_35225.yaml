  For a seminar focused on the concept of motion rather than the mathematics of convergence, I would assign **The Arrow** as required reading. While the Dichotomy and Achilles paradoxes are largely neutralized by the machinery of infinite series, the Arrow bypasses the mathematics of infinity to strike directly at the metaphysics of time and change. It forces students to confront whether motion is a intrinsic state possessed by an object at a single instant or merely a relational property derived from a sequence of static positions. This distinction remains a live debate in contemporary philosophy of physics and metaphysics, making it the most fertile ground for exploring what it means for something to move.
