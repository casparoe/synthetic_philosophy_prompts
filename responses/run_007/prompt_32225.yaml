          *   The user is "torn," so the advice should be balanced but decisive.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Aligns with strict fiduciary duty. Safe, but morally weak given the humanitarian crisis. Ignores the "cosmopolitan" pull.
      *   *Option B (Approve as is):* Aligns with strong cosmopolitanism. Risks alienating the student body who paid the levy. Might set a precedent that undermines the fund's specific purpose.
      *   *Option C (Approve with Modifications):* This is usually the best path for committee politics. It acknowledges the special obligation to fee-payers (keeping some money) while acknowledging the universal obligation to human safety (diverting some money). It bridges Miller/Tamir and Pogge.
      *   *Decision:* I will recommend **Approve with Modifications**. This allows for a nuanced argument that respects the fiduciary concern while prioritizing the humanitarian imperative, mirroring a "weak cosmopolitanism" or "liberal nationalism" synthesis.

  3.  **Drafting - Section by Section:**

