          *   *The "Compatriot/Fiduciary" Argument:* Needs to be strong. It's not just "our money," it's about institutional integrity and trust. If students feel the levy is a general tax, they might resist future fees. (Miller/Tamir angle: Special obligations sustain the community).
          *   *The "Cosmopolitan/Humanitarian" Argument:* Needs to be strong. It's not just "being nice," it's about the hierarchy of needs. Safety vs. Enrichment. (Pogge angle: Negative duties not to harm, or positive duties to aid when cost is low).
          *   *Synthesis:* How to balance them?
      *   **The Proposal (Concrete Vote):**
