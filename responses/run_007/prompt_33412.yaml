prompt: |-
  I'm a PhD student in cognitive science, and my advisor volunteered me to run a two-hour seminar on predictive processing and the free energy principle for a reading group of philosophy grad students. They're mostly philosophy of mind and epistemology people — one guy works on Kant, another on embodied cognition, nobody with a computational background beyond maybe a stats course in undergrad. They've heard the buzzwords: Markov blanket, active inference, minimize surprise. They're curious but also sceptical in that way philosophers are, and I'm half-expecting someone to ask whether the whole thing is just teleology smuggled back into science. So I don't just want to explain the theory; I need a plan for the session that actually gets the architecture of the view across — the dependencies between the ideas, why the pieces fit together the way they do — rather than leaving them with a fog of jargon and the impression that it's unfalsifiable.

  Don't explain the theory to me; I know it. What I need is a teaching plan. In particular: the order in which the conceptual pieces have to be introduced and what depends on what (e.g., I assume you can't start with the free energy principle itself — something about hierarchical generative models has to come first, but how much?). The one central example or case study that should carry the whole thing, and why that one rather than the standard visual-perception demos everyone uses. The misconceptions I should expect from this specific audience — I'm guessing they'll conflate prediction with conscious forecasting, or think the whole thing is just a trivial claim about homeostasis, or assume the Bayesian brain is committed to the idea that the world is actually uncertain — and exactly where in the sequence I should head each one off. What I should openly say we're not going to cover at this level (and why, so it doesn't look like I'm dodging). And one question I can pose at the very end that would tell me whether they've understood the structure of the view rather than just memorised the vocabulary.

  After the prose plan, give me a structured summary as a JSON object with these fields: "conceptual_steps" (an ordered list of the steps, each with a one-sentence rationale for why it has to come at that point), "carrying_example" (the example and a brief justification for choosing it), "misconceptions" (an array of objects, each with "misconception", "step_to_address", and "how"), "check_for_understanding" (the question), and "exclusions" (what's left out and why).
