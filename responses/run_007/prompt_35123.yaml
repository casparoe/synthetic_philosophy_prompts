      *   Avoid bashing EA (it's a valid philosophy).
      *   Avoid diagnosing the sister (I'm not a therapist), but highlight concerning patterns.
      *   Focus on the *extremity* of the behavior, not the core values.

  8.  **Key Points to Include:**
      *   EA community self-critique (burnout is a known issue).
      *   The instrumental value of happiness (joy fuels work).
      *   The difference between "doing good" and "self-flagellation."
      *   The user's role (maintain the connection).

  9.  **Final Polish:** Check against safety guidelines. (No medical diagnosis, no harmful advice). The advice should be supportive and conversational. *Self-correction:* Make sure not to tell the user to "fix" her, but rather how to approach the relationship.

  10. **Structure:**
      *   Direct Answer (No, you're not weird).
