prompt: |-
  my older sister has gotten really into effective altruism over the past few years. at first i admired it — she quit her corporate job, started working at a global health charity, donates like half her income. but lately it's gotten more extreme. she gave away her piano because she said practicing was an indulgent use of time she could spend fundraising. she stopped coming to family dinners because she calculated the hours would be better spent elsewhere. when i tried to joke around with her the other day she just looked at me and said humor doesn't reduce malaria cases. she's not unhappy exactly — she says she's never been more fulfilled. but she's become this flat, humorless person who can't enjoy anything that isn't morally optimal. i told her i was worried about her, and she said i'm just uncomfortable with someone who takes morality seriously. is she right? is there actually anything wrong with living like this, or am i the one being weird about it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Subject:** User's older sister.
      *   **Context:** Sister adopted Effective Altruism (EA) a few years ago.
      *   **Initial Reaction:** User admired her (quit corporate job, global health charity, high donation rate).
      *   **Current Concern:** Behavior has become "extreme."
      *   **Specific Examples:** Gave away piano (time better spent fundraising), stopped family dinners (hours better spent elsewhere), rejected humor ("doesn't reduce malaria cases").
      *   **Sister's State:** Claims fulfillment, not unhappy, but appears "flat, humorless," unable to enjoy non-optimal things.
      *   **Conflict:** User expressed worry; Sister dismissed it as discomfort with serious morality.
      *   **User's Question:** Is she right? Is there anything wrong with living like this, or am I the weird one?

  2.  **Deconstruct Effective Altruism (EA):**
      *   *Core Principle:* Use evidence and reason to figure out how to benefit others as much as possible, and take action.
      *   *Spectrum:* EA exists on a spectrum. Moderate EA involves significant donating and career consideration. Extreme EA (sometimes called "hardcore" EA) can lead to burnout, social isolation, and psychological distress.
      *   *Community Discourse:* There is active debate *within* the EA community about sustainability, burnout, and the value of personal happiness/relationships.

  3.  **Evaluate the Sister's Behavior:**
      *   *Donating 50%:* High, but within the realm of serious commitment (Giving What We Can pledge is often 10%, some go higher).
      *   *Quitting Corporate for Charity:* Common EA move (earn-to-give vs. direct work).
      *   *Giving away Piano:* This is a red flag for *balance*. Hobbies sustain mental health.
      *   *Skipping Family Dinners:* This damages social support networks, which are crucial for long-term effectiveness.
      *   *Rejecting Humor:* This suggests a loss of humanity/joy. Humor *does* have value (stress relief, bonding), even if not directly saving lives.
      *   *Claiming Fulfillment:* People can feel fulfilled in rigid systems (martyrdom complex), but external observation suggests "flatness."

  4.  **Address the User's Question ("Is she right?"):**
      *   *Is the user weird?* No. Wanting a sister who enjoys life and maintains family bonds is normal and healthy.
      *   *Is the sister right?* Philosophically, she has a point about prioritizing good, but practically and psychologically, her interpretation is likely unsustainable and potentially harmful (to herself and relationships).
      *   *Nuance:* It's not binary. Both have valid points, but the sister's *implementation* seems to lack sustainability.

  5.  **Identify Potential Risks:**
      *   **Burnout:** High risk. Without rest/play, effectiveness drops over time.
      *   **Moral Injury/Perfectionism:** The bar is always moving. Never "good enough."
      *   **Social Isolation:** Cutting off family reduces the support system needed to keep going.
      *   **Philosophical Rigidity:** Ignoring the indirect benefits of happiness (a happy worker saves more lives in the long run).

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user's feelings. It's not weird to miss your sister.
      *   *EA Context:* Explain that EA doesn't *require* this level of austerity. In fact, many EAs argue against it.
      *   *The "Marginal Utility" Argument:* Explain that rest, joy, and relationships *increase* long-term impact. A burnt-out altruist helps no one.
      *   *The "Moral Perfectionism" Trap:* Discuss the psychological danger of trying to be 100% optimal all the time.
      *   *Addressing the Sister's Rebuttal:* She says the user is "uncomfortable with morality." Reframe this: It's not about morality, it's about *sustainability* and *humanity*.
      *   *Actionable Advice:* How to talk to her? Focus on long-term impact, not guilt. Express love, not judgment.

  7.  **Refining the Tone:**
