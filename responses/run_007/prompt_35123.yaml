answer: |-
  You are not weird, and your concerns are valid. While your sister is operating from a place of genuine conviction, the behavior you are describing aligns with a specific, controversial subset of Effective Altruism (EA) that many proponents *within* the movement actually warn against.

  Here is a breakdown of why your intuition is likely correct, why her behavior is risky, and how to understand what is happening without dismissing her values entirely.

  ### 1. You are not "uncomfortable with morality"
  When your sister says you are just uncomfortable with someone taking morality seriously, she is using a rhetorical shield. It frames any criticism of her *methods* as an attack on *goodness itself*.

  Wanting your sister to play the piano, eat dinner with her family, and laugh at jokes does not make you immoral. It makes you a human being who values connection and holistic well-being. Most ethical frameworks, including many within EA, recognize that human relationships and personal joy have intrinsic value, not just instrumental value.

  ### 2. The "Sustainability" Argument (Even by EA Standards)
  One of the biggest critiques *inside* the Effective Altruism community is the risk of burnout. The logic is straightforward:
  *   Altruism is a marathon, not a sprint.
  *   To do the most good over a lifetime, you need to remain mentally healthy, socially connected, and emotionally resilient.
  *   Giving away every hobby, cutting off family support, and eliminating humor removes the very things that prevent burnout.

  If she burns out in three years because she denied herself all joy, her total lifetime impact will be lower than if she had played the piano for an hour a week and stayed connected to her family. By rejecting rest and joy, she may actually be *reducing* her long-term effectiveness. Many prominent EA thinkers argue that self-care is a moral obligation because it preserves your capacity to help others.

  ### 3. Moral Perfectionism vs. Moral Excellence
  What you are describing sounds less like "taking morality seriously" and more like **moral perfectionism** or **scrupulosity**.
  *   **Moral Excellence:** Trying to do a lot of good while living a functional human life.
  *   **Moral Perfectionism:** The belief that any action not directly aimed at doing good is a moral failure.

  The second mindset is psychologically dangerous. It creates a state where one can never be "done" or "good enough." The fact that she describes herself as "fulfilled" is positive, but the description of her as "flat" and "humorless" suggests she may be suppressing natural human emotions to fit an ideological mold. This can lead to a fragile state of mind where one slip-up causes a massive crisis of conscience.

  ### 4. The Value of "Non-Optimal" Things
  Her claim that "humor doesn't reduce malaria cases" is logically true in the immediate sense, but false in the systemic sense.
  *   **Humor and Bonding:** These reduce stress, improve cognitive function, and strengthen social bonds. A stressed, isolated worker makes worse decisions than a rested, connected one.
  *   **Family Dinners:** Maintaining relationships models a sustainable way of living. If the only example of "doing good" people see is miserable self-sacrifice, fewer people will want to join the cause. By being a happy, balanced person who does good, she could actually inspire more people than she does by being a martyr.

  ### 5. Is there anything wrong with living like this?
  There is a difference between "wrong" and "unsustainable."
  *   **Is it immoral?** No. She is sacrificing her own comfort for others. That is noble.
  *   **Is it healthy?** Likely not. The elimination of play, art (piano), and kinship is a recipe for psychological rigidity.
  *   **Is it necessary?** No. Most effective altruists do not live this way. They donate significantly (often 10%+) and choose high-impact careers, but they still have hobbies and families.

  ### How to approach her
  Since telling her she's "working too hard" makes her defensive (because she hears "you're not good enough"), try framing your concern in terms of **long-term impact**.

  *   **Validate the Goal:** "I admire your commitment to saving lives. I really do."
  *   **Focus on Sustainability:** "I worry that if you don't have outlets like the piano or family time, you'll burn out. The world needs you for 40 years, not just 5. How does cutting out joy help you last that long?"
  *   **Reframe Joy:** "You say humor doesn't stop malaria. But a rested, happy mind makes better decisions about how to stop malaria. I want you to be effective, and I think being human helps with that."
  *   **Hold the Boundary:** You can't force her to come to dinner. But you can say, "I love you and I miss you. The door is always open when you want to eat, even if it's 'inefficient.'"

  ### Summary
  You are not the weird one. You are reacting normally to a loved one adopting a rigid, extreme lifestyle that strips away the buffers of human connection. She is right that morality is serious, but she is likely wrong that it requires the total eradication of personal joy.

  Keep showing up for her. Sometimes, the most effective thing a family member can do is simply remain a steady, non-judgmental presence, reminding her (by example) that it is possible to be good without ceasing to be human.
