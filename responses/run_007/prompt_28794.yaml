answer: |-
  The waiting room smelled of lemon polish and dry paper. It was a clean smell, the kind that scrubbed the throat. Elias sat on the edge of the velvet chair, his hands clasped tight to stop them from shaking. He could hear the wet rasp of his own breathing. It sounded obscene in the silence.

  Across from him, Mr. Vane sat behind a desk of polished obsidian. Vane was a Curator, dressed in a high-collared grey suit that didn't wrinkle. He looked permanent. Elias felt painfully temporary.

  "We need to discuss the Finalizing," Vane said. His voice was low, resonant, devoid of the tremor that plagued biological throats. "Your father has been in Stabilization for three days. The tissues are setting. It is time to move him to the Hall."

  Elias swallowed. His throat clicked. "He's... he's still warm."

  Vane tilted his head, a gesture of polite pity. "The residual heat is just friction, Elias. The metabolic noise is gone. He isn't suffering the flux anymore. He is Whole."

  "He was talking yesterday," Elias said. He knew how it sounded. In this room, talking was a symptom of incompleteness. To speak was to admit you were still changing, still decaying, still unfinished. "He asked for water."

  "And that is why we Finalize," Vane said softly. He opened a file. The paper made a sharp crack. "To speak is to beg. To hunger is to lack. Your father spent eighty years in the Transience, Elias. Eighty years of leaking, and hungering, and trembling. He is finally Quiet. Do you want to drag him back into the noise?"

  Elias looked at the door behind Vane. Beyond it lay the Preparation Chamber. His father was in there. He wasn't sick anymore. He wasn't confused. He was still.

  "It feels like losing him," Elias whispered.

  Vane sighed. It was a dry sound, like wind over stone. "This is the selfishness of the Breather. You measure value in pulses. You think because a heart is beating, a person is present. But look at history. Who do we listen to? The statues or the tourists?"

  "The tourists," Elias said, confused.

  "No. The statues. The tourists just look. The statues *mean*." Vane leaned forward. "Your father is becoming a Statue. He is entering the Citizenry of the Still. When he was breathing, he was a private individual, subject to whims, to pain, to the decay of cells. Now? He is public. He is legacy. You are mourning the loss of his weakness."

  Elias wiped his eyes. His fingers came away wet. He looked at the tears on his skin with shame. Crying was a leakage. It was a reminder that his own containment was failing.

  "I just... I'm not ready to let him be that," Elias said. "I need him to be... flexible."

  "Flexible," Vane repeated, tasting the word. "You mean compromised. You mean vulnerable. We have the forms here for the Induction. We simply need your signature to cease the preservation fluids and allow the hardening to complete. If you delay, the tissues may degrade. He could lose his definition."

  Elias thought of his father's face. The lines around the eyes. The way his mouth had settled in the last hour, not in a grimace, but in a rest. Elias had tried to hold his hand, but the grip was gone. He had tried to talk to him, to tell him about the weather, about the news, about the traffic. All the transient nonsense that fills a life.

  His father hadn't answered. Not because he couldn't, but because he had nothing left to say. He had said everything.

  "If I sign," Elias said, his voice cracking. "He goes to the Hall?"

  "The West Wing," Vane corrected. "With the others of his generation. They sit together. They hold the room. They don't need to eat, or sleep, or fear the dark. They are safe from the market, from disease, from time. You are keeping him in the waiting room of biology, Elias. He is trying to leave the building."

  Elias looked down at his own hands. They were trembling. He could feel the blood pumping in his wrists, a frantic, rhythmic knocking. *Thump-thump. Thump-thump.* It sounded like a countdown. He was leaking time. Every beat was one less he had. He was a burning candle in a room full of lightbulbs, apologizing for his own consumption.

  "He asked for water," Elias said again, but weaker this time.

  "He was thirsty for silence," Vane said. "And we gave him a straw."

  Vane slid a pen across the obsidian desk. It didn't slide; it glided, heavy and solid.

  "The world is built by the Still, Elias," Vane said. "The roads, the laws, the houses you live in. The Breathers just maintain them for a few years, then they pass the keys. Your father is finally handing over the keys. Don't make him take them back."

  Elias picked up the pen. It felt cold, heavier than it looked. He thought about the last time he'd seen his father truly happy. It wasn't on a birthday. It wasn't on a vacation. It was sitting on the porch in the evening, doing nothing. Just watching the light fade. Not speaking. Not wanting. Just being a weight on the bench, anchoring the house to the earth.

  That was what he was becoming. An anchor.

  Elias uncapped the pen. The click sounded like a bone settling.

  "I'm sorry," Elias said.

  "For what?"

  "For making noise."

  Vane nodded, a small, respectful dip of the chin. "Sign on the line marked *Release to Permanence*."

  Elias signed. The ink dried instantly.

  "Thank you," Vane said, taking the paper. "You can visit him in the Hall next week. He will be... impressive. He will not change. He will not leave. He will be exactly who he was, without the mess of who he was becoming."

  Elias stood up. His knees popped. He winced.

  "Careful," Vane said gently. "Watch your joints. They wear out so quickly."

  Elias walked to the door. He stopped with his hand on the handle. He wanted to say something else, some platitude about love or memory. But those were words for the transient. Words evaporated.

  "Will he be cold?" Elias asked.

  "He will be ambient," Vane said. "Like the room. Like the stone. He will be the temperature of truth."

  Elias opened the door and stepped out into the hallway. It was busy with other Breathers, rushing to appointments, phones buzzing in their pockets, coughing into sleeves, eating sandwiches that dropped crumbs on the floor. They looked frantic. They looked like they were running away from something.

  Elias leaned against the wall and closed his eyes. He held his breath. He counted to ten. Then twenty.

  The silence inside his chest felt heavy, dense, and for a moment, just a moment, it felt like rest.

  He exhaled, a long, shuddering leak of air, and walked toward the exit, trying to make his footsteps sound like they belonged to someone who was staying.
