      *   *Alive vs. Dead:* Treating the dead as the primary citizens and the living as transient guests. This has potential for eerie, poignant fiction.
      *   *Temporal Bias (Age):* Treating the elderly as the "complete" version and children as "unfinished products" to be managed. This is already somewhat true, but flipping it (children as the authority) feels too whimsical.
      *   *Somatic Bias (Body vs. Mind):* Treating consciousness as the temporary vessel and the physical body as the eternal legacy.
      *   *Locality (Native vs. Immigrant):* Treating people born in a house as owners and visitors as temporary. Too small scale.
      *   *Consciousness (Sleeper vs. Waker):* What if sleep was the default state of citizenship, and waking was a temporary, disruptive hobby?

      *Selection:* **The Alive vs. Dead axis.** Specifically, flipping the valuation. In our world, the living are the agents, and the dead are the memory. What if the dead were the permanent residents, and the living were just temporary, noisy squatters who eventually "settle down" into true citizenship? This touches on grief, legacy, and how we prioritize the immediate noise of life over the permanence of history.

      *Refinement:* Let's make it about *noise* and *movement*. The living are chaotic, decaying, and temporary. The dead are still, preserved, and permanent. The story should treat a funeral as a graduation or an inauguration into true society.

  3.  **Developing the Narrative:**
      *   **Protagonist:** Someone struggling with the "transition." Maybe someone holding onto a living relative too long, refusing to let them "graduate."
      *   **Setting:** A funeral home, but treated like a bustling city hall or a spa where the real work happens.
      *   **Conflict:** The protagonist is delaying the "Settling" of their father. The "authorities" (Funeral Directors as Civil Servants) are pressing for the paperwork.
      *   **The Inversion:** Language should treat "dying" as "stabilizing" or "becoming real." "Living" should be described as "fluxing" or "wandering."
