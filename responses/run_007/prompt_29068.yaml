      *Decision:* I will treat "Dutch Book" broadly as the pragmatic exploitation argument (including Money Pumps for preferences) to respect the user's phrasing, but I will add a footnote or brief clarification that technically DB is for belief and Money Pump is for preference, as this precision appeals to a scientist.

