answer: |-
  You have put your finger on the central tension in the economics of climate change and long-term public investment. Your intuition is correct: the declining discount rate schedule in HM Treasury's *Green Book* is not merely a technical calibration of risk; it is a tacit ethical compromise. It attempts to solve a political problem using an economic instrument.

  To answer your questions, we need to strip away the actuarial language and look at the moral philosophy embedded in the formula.

  ### 1. The Implicit Theory of Justice: Uncertainty-Weighted Utilitarianism

  The standard neoclassical approach to discounting relies on the **Ramsey Rule**:
  $$r = \rho + \eta \times g$$
  Where $r$ is the discount rate, $\rho$ is the pure rate of time preference (how much we inherently value the present over the future), $\eta$ is the elasticity of marginal utility (how much less an extra pound matters to a richer person), and $g$ is expected economic growth.

  **The Ethical Problem:** If you hold $\rho$ constant and positive (e.g., 1.5%) and assume positive growth ($g$), a constant discount rate creates an exponential decay in the value of future lives. At 3.5%, a benefit occurring 200 years from now is worth less than 0.1% of its present value. This effectively assigns near-zero moral weight to people living in the 23rd century. This violates most plausible theories of intergenerational justice, which suggest we owe something to successors simply because they are persons.

  **The Green Book's Solution:** By making the rate decline over time, the Treasury is implicitly adopting a theory of **Uncertainty-Weighted Utilitarianism**.

  This relies on the **Gollier-Weitzman effect**. The logic is that we are uncertain about future growth rates ($g$). If growth turns out to be low, the marginal utility of consumption will be high, and the discount rate should be low. If growth is high, the discount rate is high. Because the "low growth/low discount" scenarios dominate the valuation of the distant future (mathematically, the lowest rate eventually dominates the present value calculation), the *certainty-equivalent* discount rate declines over time.

  **The Justice Stance:**
  1.  **Rejection of Pure Time Preference:** For the very long term, the schedule implicitly moves toward $\rho \approx 0$. It admits that it is ethically indefensible to discount the welfare of future people simply because they exist later in time.
  2.  **Acceptance of Wealth Effects:** It retains discounting based on the assumption that future generations will be richer ($\eta \times g$), so a pound is worth less to them.
  3.  **Risk Aversion as Equity:** It uses uncertainty about the future as a proxy for ethical caution. By lowering the rate, it says, "We are not sure if they will be rich, so we shouldn't assume their money is worth less."

  This is not Rawlsian (which would demand maximizing the position of the worst-off generation, likely requiring massive current sacrifice). It is not Sternian (which argued for a near-zero discount rate based on the low probability of extinction). It is a **pragmatic utilitarianism** that tries to prevent the "tyranny of the present" without triggering the "tyranny of the future" (where current investment demands become politically impossible).

  ### 2. Coherent Theory or Political Kludge?

  Is the declining schedule coherent? **Economically, yes. Ethically, it is a kludge.**

  **The Economic Coherence:**
  If you accept that long-term growth is stochastic (random) rather than deterministic, a declining discount rate is the mathematically correct way to calculate present value. In this sense, it is not a kludge; it is a correction of a model error. Standard Cost-Benefit Analysis (CBA) assumed we knew the growth path of 2124. We don't. The declining rate corrects for that epistemic humility.

  **The Ethical Kludge:**
  However, the specific *steps* in the Green Book (3.5% $\rightarrow$ 3.0% $\rightarrow$ 2.5%... down to 1% for 300+ years in the 2022 update) are not derived purely from the Gollier-Weitzman formula. They are calibrated to ensure that long-term projects (like nuclear waste storage or flood defenses) pass the test without blowing up the fiscal budget.

  It papers over the fact that **any** positive discount rate, even a declining one, eventually writes off the deep future.
  *   At 3.5%, the 22nd century is irrelevant.
  *   At 1% (the 300-year rate), the 24th century is heavily discounted.

  The schedule allows the Treasury to say, "We count the future," while ensuring that the net present value (NPV) of most policies is still determined by the first 30 years of benefits. It creates the *appearance* of intergenerational equity without the *fiscal cost* of true intergenerational equity. It is a "soft constraint" designed to avoid the hard constraint of the Stern Review (which used a 1.4% rate and demanded immediate, massive decarbonization).

  ### 3. What the Practice Needs vs. What It Fits

  To understand the policy, you must distinguish the technical necessities from the political conveniences.

  **What the Practice Strictly *Needs*:**
  1.  **Stochastic Growth:** It requires the premise that long-term economic growth is uncertain. If growth were guaranteed, the declining rate loses its economic justification.
  2.  **Separation of Time Horizons:** It requires the ability to bifurcate appraisal into "intergenerational" vs. "intra-generational." You cannot apply the 1% rate to a 5-year IT project, or you would approve everything.
  3.  **Continuity:** It needs the yield curve to be smooth enough that arbitrage doesn't occur between government projects of different durations.

  **What the Practice Merely *Fits*:**
  1.  **Fiscal Discipline:** It fits the Treasury's need to maintain a hurdle rate that prevents low-value spending. A flat 1% rate (Stern) would approve almost every green project, overwhelming the budget. The 3.5% start keeps short-term spending in check.
  2.  **Political Cycles:** Politicians operate on 4-5 year cycles. A 30-year high-rate window aligns with the political horizon where accountability exists. The declining rate kicks in only when no current politician will be held accountable for the decision.
  3.  **Avoidance of Extinction Risks:** It fits a worldview that assumes continuity of the state and economy. It does not account for catastrophic tipping points where $g$ becomes negative. The model assumes the future exists to be discounted; it does not price the probability that the future might not exist at all.

  ### 4. A Policy Built on a Cleanly Stated Principle

  If you wanted to rebuild this system on a principled foundation rather than a calibrated compromise, you would have to abandon the idea that discounting is the primary tool for intergenerational justice. You would need to move from **Cost-Benefit Analysis** to **Cost-Effectiveness with Constraints.**

  Here is what would have to change:

  **A. Zero Pure Time Preference ($\rho = 0$)**
  A clean ethical principle admits that the date of birth is morally arbitrary. The discount rate should only reflect expected changes in wealth ($\eta \times g$), not impatience.
  *   *Change:* The starting rate would drop significantly (likely to ~1.5% or lower immediately), not after 30 years.

  **B. Shadow Prices based on Physical Targets, not Discounting**
  Currently, the "carbon value" used in appraisals is often derived from the damage cost, which is discounted. A clean principle acknowledges that some thresholds (2°C warming, biodiversity collapse) are hard constraints.
  *   *Change:* Instead of asking "Do the benefits of this low-carbon project outweigh the costs?", the question becomes "What is the cheapest way to meet the physical constraint?" The discount rate becomes irrelevant for the target itself; it only applies to the financing of the path to get there.

  **C. Safe Minimum Standards (SMS)**
  This is the most robust alternative to the Green Book's utilitarianism. It posits that we should minimize costs *subject to* keeping the system within safe operating boundaries.
  *   *Change:* The Green Book would include a "veto" mechanism. If a project risks breaching an intergenerational threshold (e.g., irreversible aquifer depletion), it is rejected regardless of its NPV, even if the discounted benefits are high.

  **D. Explicit Intergenerational Accounting**
  Currently, the debt incurred today is balanced against assets, but the environmental liability is often off-balance-sheet.
  *   *Change:* A "Generational Impact Statement" would be required alongside the Economic Case. This would explicitly state the burden transferred to future generations (debt + environmental degradation) vs. the assets left to them (infrastructure + natural capital).

  ### Summary

  The Green Book's declining discount rate is a **technocratic patch on an ethical wound**. It acknowledges that standard discounting is unethical for the long term but refuses to adopt the economic implications of true ethical consistency.

  It presupposes a theory of justice that says: *Future people count, but not enough to materially inconvenience the present generation unless the threat is within a 30-year horizon.*

  A cleanly stated principle would admit that discounting is the wrong tool for existential risk. It would replace the declining rate with **hard constraints** on natural capital and a near-zero time preference rate, shifting the debate from "Is this worth it?" to "Can we afford not to?" That shift would render a vast amount of current government appraisal obsolete, which is precisely why the Treasury prefers the kludge.
