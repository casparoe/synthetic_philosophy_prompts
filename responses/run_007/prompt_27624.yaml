answer: |-
  **The Scenario**
  Arthur is a conscious person with a full right to life, currently dependent on a ventilator in a hospital due to a rare, incurable neurological condition that guarantees him twenty more years of existence characterized solely by unmitigatable, severe psychological and physical agony, with no capacity for joy, relationship, or cognitive fulfillment. Beatrice, Arthur's estranged sister, voluntarily signed a legally binding care contract and publicly vowed to act as his sole guardian, explicitly promising to maintain his life support indefinitely regardless of his condition. Now overwhelmed by the emotional toll, Beatrice proposes to withdraw the ventilator, which will cause Arthur's immediate death; she seeks moral guidance on whether this withdrawal is permissible.

  **Thomson-Style Reasoning**
  Thomson's framework centers on bodily autonomy and special obligations rather than the bare right to life. While she grants Arthur a right to life, she argues this right does not automatically entail a right to use Beatrice's resources unless that use was voluntarily granted. In the standard "Violinist" case, Thomson argues unplugging is permissible because the pregnancy (or attachment) was involuntary. However, in this scenario, Beatrice *voluntarily assumed* the obligation to keep Arthur alive through her contract and vow. By creating a dependency based on her promise, she has granted Arthur a right to her continued support. Withdrawing that support now would violate the special obligation she undertook, rendering the act unjust even if it is merely "letting die." Therefore, Thomson concludes the act is morally wrong.

  **Marquis-Style Reasoning**
  Marquis's framework argues that what makes killing (or letting die) prima facie wrong is the deprivation of a "future like ours" (FLO)—a future containing valuable experiences, projects, and enjoyments. The wrongness is grounded in the loss of the *value* of that future to the victim. In this scenario, Arthur's future contains no valuable experiences, only net suffering; it is biologically human but lacks the qualitative features that make a future worth having. Depriving Arthur of this specific future does not rob him of any genuine good he would have valued. Since the core harm identified by Marquis (loss of a valuable future) is absent, the act does not carry the serious moral weight usually associated with ending a life. Therefore, Marquis concludes the act is not seriously wrong.

  **The Feature Doing the Work**
  The single feature driving the divergence is the **stipulation that the patient's future lacks value (is not a "future like ours")**. If you remove this feature and assume Arthur has a normal, valuable future ahead of him, Marquis's reasoning flips: depriving him of that valuable future becomes seriously wrong, aligning his verdict with Thomson's (both would say the act is wrong, Thomson due to the obligation, Marquis due to the FLO). A Marquis defender would block this thought experiment by challenging the claim that a future of suffering lacks value; they would argue that so long as the patient desires to live or possesses biological human continuity, the future retains intrinsic value, and quality-of-life judgments cannot negate the wrongness of deprivation.
