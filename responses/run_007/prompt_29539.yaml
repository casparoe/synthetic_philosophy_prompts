answer: |-
  The Oakhaven District Council is voting on a controversial flood defence scheme that involves diverting the River Wye away from their own streets and into the channel running through the neighbouring town of Bridford. While the plan guarantees safety for Oakhaven residents, hydrologists confirm it will cause regular, manageable flooding to Bridford's riverside homes and businesses. Oakhaven residents pay the council tax that funds the project and are subject to Oakhaven's bylaws, but Bridford residents fall under a completely different local authority and cannot be compelled by Oakhaven's enforcement officers, even though the physical consequences of the decision flow directly into their backyards.

  **The Affected-Interests View**
  On this view, the Bridford residents must be granted a vote. The core principle is that legitimate authority derives from avoiding harm to those who did not consent to it. Since the flood defence decision drastically alters the security and property value of Bridford homes, those homeowners have a vital stake in the outcome. To exclude them is to allow Oakhaven to impose a significant cost on outsiders without their permission, which looks like tyranny by boundary line. The intensity of the impact—potential property damage—creates a moral claim to participation that overrides administrative convenience.

  **The Subject-to-the-Laws View**
  This view argues that Bridford residents should not have a vote. The justification for democracy here is not merely impact, but mutual coercion: you get a say because you are bound by the rules the body creates. Oakhaven Council cannot fine a Bridford resident for breaking Oakhaven bylaws, nor can it tax them directly. If Bridford residents could vote on Oakhaven's budget and laws without being subject to Oakhaven's enforcement or tax burden, it would break the link between responsibility and power. They have their own council in Bridford to represent their interests; allowing them to vote in Oakhaven would blur the boundaries of distinct political communities.

  **The Divergent Feature**
  The single feature pulling these views apart is the **mismatch between the geography of impact and the geography of authority**. The decision creates physical consequences beyond the jurisdiction's legal reach. If you remove this feature—for instance, if the river diversion only affected land within Oakhaven's boundaries—both views would agree that only Oakhaven residents should vote. Similarly, if Oakhaven had legal authority over Bridford (perhaps through a merged super-council), both views would agree that all residents should vote. It is specifically the cross-border externality without cross-border jurisdiction that creates the conflict.

  **The Debate**
  A defender of the **Subject-to-the-Laws View** would attack the case by arguing that the Affected-Interests View leads to an unmanageable infinite regress. "If everyone affected gets a vote, where does it stop?" they would ask. "Do we invite the downstream fishermen? The suppliers of sandbags? Eventually, everyone is affected by everything, and democracy requires a bounded 'demos' to function. Bridford's proper recourse is to lobby their own council to negotiate with Oakhaven, not to crash Oakhaven's ballot box."

  On behalf of the **Affected-Interests View**, the rebuttal would focus on the insufficiency of lobbying. "Boundaries are administrative tools, not moral shields," they would counter. "Expecting Bridford to rely on lobbying assumes Oakhaven cares about their neighbours' welfare, which the decision to flood them proves they do not. When a decision imposes a concrete harm, the right to protect oneself from that harm trumps the abstract need for tidy jurisdictional lines. If the impact is direct and severe, the electorate must expand to match it."
