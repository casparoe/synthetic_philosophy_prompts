prompt: |-
  Right, I've been trying to get my head round who should get a say in political decisions, and I keep going back and forth between two ways of drawing the line. The first view says anyone whose life a decision would actually affect should get some say in it, roughly in proportion to how much it affects them. The second view says the only people who should get a vote are the ones the rule can be enforced against — you get a say because you're subject to the laws being made, not because you happen to be affected by them.

  I'd like you to build me a thought experiment — a made-up case — where these two views come apart on whether a particular group should get a say. Make it realistic: a town, a workplace, that sort of thing, not a trolley or a spaceship. And keep the scenario to one paragraph. Set it up so the first view (the affected-interests one) says the group should get a say, and the second view (the subject-to-the-laws one) says they shouldn't. I want the first view's answer to feel right in the case, but not because the second view is being made to look silly — the people on the second view should have a decent reason for their answer. Also try to avoid the really well-worn examples: no climate change and no future generations.

  After the scenario, walk me through what each view says about it and why, seperately. Then tell me which single feature of the case is doing the work to pull them apart, and what happens if you take that feature out — do the two views just collapse into agreeing? Finish with how a defender of the subject-to-the-laws view would attack the case, and what you'd say back on behalf of the affected-interests view.

  Oh, and please write the answer in British English. I don't mind if you use plain names for the views rather than fancy ones.
