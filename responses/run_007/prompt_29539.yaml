      *   *Idea 4: A regional hospital.* Located in Town A, serves Towns A, B, and C. Town A council decides on closing a wing. Towns B and C are affected but can't vote in Town A.
      *   *Selection:* The regional hospital scenario feels strong. It's local, realistic, and avoids climate/future gens.
      *   *Refining for constraints:* Need to ensure View 2 (Subject-to-Laws) says "No". If the decision is made by Town A's council, are people from Town B subject to Town A's laws? Usually, local council bylaws apply within boundaries. If Town A decides to close a wing, they aren't making a law *for* Town B, they are managing their own asset. So Town B residents aren't subject to Town A's coercion, just affected by the outcome.
      *   *Drafting the paragraph:* Focus on the "Oakhaven District Council" deciding on the future of "Oakhaven General Hospital". The hospital serves three towns. Oakhaven residents vote; the others don't. The decision is about resource allocation (closing a maternity wing), not a law enforced on outsiders.
