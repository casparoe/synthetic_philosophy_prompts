  3.  **Analyzing the Views:**
      *   **View 1 (Affected-Interests):** Focus on impact. Losing a maternity wing affects travel time, safety, community. Therefore, they deserve a vote.
      *   **View 2 (Subject-to-Laws):** Focus on coercion/reciprocity. You vote where you are governed. If Oakhaven Council can't fine or arrest someone from the next town for breaking Oakhaven bylaws, that person shouldn't vote. It's about political community boundaries.

  4.  **Identifying the Divergent Feature:**
      *   The feature is **extraterritorial impact without extraterritorial authority**. The decision creates consequences beyond the jurisdiction's legal reach.
      *   *Removal:* If the hospital only served Oakhaven, both agree (only Oakhaven votes). If Oakhaven had legal authority over the other towns (merger), both agree (all vote).

  5.  **The Debate:**
      *   **View 2 Attack:** "If everyone affected gets a vote, boundaries mean nothing. Why stop at the next town? What about suppliers? It creates an unmanageable electorate. Democracy requires a bounded community of mutual obligation."
      *   **View 1 Rebuttal:** "Boundaries are arbitrary if they ignore harm. You don't need mutual obligation to deserve protection from harm. We can define the electorate functionally for specific decisions."

