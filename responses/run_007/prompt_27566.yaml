answer: |-
  ### The Special Composition Sorting Quiz

  **Gloss:** By "composite object," we mean a single thing made up of smaller pieces that are working or sticking together.

  **Instructions:** For each scenario below, select the **one** option that best matches your intuition. Do not worry about philosophical labels; answer based on what you think is actually true in the world.

  **1. The Handshake**
  Two people shake hands firmly, then let go and walk away.
  *   (A) A new object exists only while their hands are touching.
  *   (B) A new object exists made of the two people, even after they separate.
  *   (C) No single object is ever formed by the two people.

  **2. The Tree**
  Consider a living oak tree, and that same tree immediately after it dies but before it falls.
  *   (A) It is an object while alive, but ceases to be an object when it dies.
  *   (B) It is an object both while alive and after it dies.
  *   (C) It is never a single object, only a collection of cells.

  **3. The Severed Arm**
  A human arm is surgically removed and sits on a medical tray.
  *   (A) Yes, the arm on the tray is a single object.
  *   (B) No, it is just a collection of tissues and bones.
  *   (C) It is only an object if it is attached to a living body.

  **4. The Pile of Sand**
  Dry sand grains are poured onto the ground to form a heap.
  *   (A) Yes, the heap itself is a single object.
  *   (B) No, there are only the individual grains of sand.
  *   (C) Only if the sand is wet or sticky enough to hold its shape.

  **5. The Stacked Bricks**
  One brick is placed directly on top of another. No glue or mortar is used.
  *   (A) Yes, the two bricks compose a single object.
  *   (B) No, there are simply two distinct bricks.
  *   (C) Only if they are painted the same color.

  **6. The Glued Chair**
  Wooden parts are bonded together with strong glue to form a chair.
  *   (A) Yes, the chair is a single object.
  *   (B) No, it is just pieces of wood arranged chair-wise.
  *   (C) Only if a person is currently sitting in it.

  **7. The Cloud**
  A cluster of water droplets floats in the sky, close together but not touching.
  *   (A) Yes, the cloud is a single object.
  *   (B) No, there are only the individual water droplets.
  *   (C) Only if the droplets are falling as rain.

  **8. The Knot**
  A rope is tied into a tight knot.
  *   (A) Yes, the knot is a distinct part or object.
  *   (B) No, there is only the rope fibers.
  *   (C) Only if the knot is pulled tight enough to hold.

  **9. The Distant Pair**
  Consider your left shoe and the Moon.
  *   (A) Yes, they compose a single scattered object.
  *   (B) No, they are too far apart to be one thing.
  *   (C) Only if they are connected by a physical string.

