  ### Scoring Key & Logical Space

  **How to Use This Key:**
  1.  **Check for Brutalism First:** If you believe there is no deep explanation for why some things compose objects and others do not (i.e., composition facts are "brute"), or if your answers feel inconsistent and you refuse to systematize them, your position is **Brutal Composition**. Do not force a fit.
  2.  **Map Your Answers:** Compare your selections (A, B, or C) to the profiles below.
  3.  **Identify Your Leaf:** The position that matches the most answers is your current intuitive stance.

  #### The Seven Positions in Logical Space

  | Case | **Nihilism** | **Universalism** | **Contact** | **Fastening** | **Cohesion** | **Organicist** | **Brutal** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1. Handshake** | C | B | A | C | C | C | *Any* |
  | **2. Tree** | C | B | B | B | B | A | *Any* |
  | **3. Arm** | B | A | B | A | A | B | *Any* |
  | **4. Sand** | B | A | A | B | A | B | *Any* |
  | **5. Bricks** | B | A | A | B | A | B | *Any* |
  | **6. Chair** | B | A | B | A | A | B | *Any* |
  | **7. Cloud** | B | A | B | B | B | B | *Any* |
  | **8. Knot** | B | A | A | A | A | B | *Any* |
  | **9. Shoe+Moon** | B | A | B | B | B | B | *Any* |

  #### Position Profiles

  *   **Mereological Nihilism:** You selected **C** or **B** (Denial) for almost every case. You believe composite objects never exist; only the smallest simple parts exist.
  *   **Mereological Universalism:** You selected **A** or **B** (Affirmation) for almost every case, especially **Q9**. You believe any collection of things, no matter how scattered, composes an object.
  *   **The Contact View:** You affirm composition when parts touch (**Q1-A, Q4-A, Q5-A**) but deny it when they are separated (**Q7-B, Q9-B**).
  *   **The Fastening View:** You deny composition for loose contact like handshakes or stacked bricks (**Q1-C, Q5-B**) but affirm it for bonded items like chairs or knots (**Q6-A, Q8-A**).
  *   **The Cohesion View:** You affirm composition for things holding together by friction or forces (**Q4-A, Q5-A**) but deny it for loose contact like handshakes (**Q1-C**) or scattered droplets (**Q7-B**).
  *   **The Organicist (van Inwagen):** You affirm composition **only** for living things (**Q2-A**). You deny it for dead trees, severed arms, chairs, and bricks (**Q3-B, Q6-B**).
  *   **Brutal Composition:** Your answers do not follow a consistent rule (e.g., you said "Yes" to the Chair but "No" to the Bricks without a principled distinction), or you explicitly hold that there is no answer to *why* composition occurs.

  #### Diagnostic Flags

  **1. Unoccupied Answer Patterns**
  *   **The "Artifact Only" Pattern:** If you answered **Yes** to the Chair (Q6) and **No** to the Tree (Q2) and **No** to the Sand (Q4).
      *   *Diagnosis:* This view holds that human-made artifacts exist, but natural heaps and organisms do not. This is a coherent but unnamed minority view in the literature (sometimes called "Artifactism"). It is not one of the seven target leaves.
  *   **The "Inconsistent Contact" Pattern:** If you answered **Yes** to Handshake (Q1) but **No** to Stacked Bricks (Q5).
      *   *Diagnosis:* This is logically incoherent for the Contact View, as both cases involve spatial adjacency without bonding. This suggests an unstable intuition.

  **2. Under-Separated Leaves**
  *   **Fastening vs. Cohesion:** While Q4 (Sand) and Q5 (Bricks) attempt to separate these (Cohesion says Yes, Fastening says No), the distinction relies on whether friction counts as "fastening."
      *   *Separating Case:* **A Single Water Droplet.**
      *   *Reasoning:* A Cohesion theorist says a droplet is an object (held by surface tension). A Fastening theorist typically says it is not (no rigid bond or mechanical fastener). This case clarifies the boundary between natural forces and rigid bonding.

  **3. Special Note on Brutal Composition**
  *   If your pattern matches **Nihilism** or **Universalism** closely, but you reject the *principle* (e.g., "I think nothing composes, but not because of a rule, just because it seems false"), you should still categorize yourself as **Brutal**. The quiz sorts by *pattern*, but your metaphysical commitment is to the *lack of a pattern*.
