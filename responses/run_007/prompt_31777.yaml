answer: |-
  You have spotted something quite profound, and you are right to sense that these two examples are kin. They are not precisely the same argument, but they are siblings born of the same parent. In academic circles, this family of objections is most strongly associated with the British philosopher Bernard Williams, though others have contributed to it.

  To answer your question directly: these are two distinct but deeply related critiques of **impartial moral theories** (like Utilitarianism or strict Kantianism). They both argue that such theories demand a kind of **moral alienation** that makes a properly human life impossible.

  Here is the breakdown of the names, the specific objections, and where the line between them lies.

  ### 1. The Drowning Wife: "One Thought Too Many"

  The first case you describe—the man saving his wife—is famous in philosophy. It is known as the **"One Thought Too Many"** objection.

  This phrase comes from Bernard Williams. The point is not about whether saving the wife is the *right* thing to do (almost everyone agrees it is). The objection is about the *structure of the reasoning*.

  If a moral theory insists that the man must justify saving his wife by appealing to a general principle (e.g., "saving spouses maximises general trust" or "it is my Kantian duty"), the theory has inserted a wedge between the man and his love. As you noted, if his wife knew he saved her only because the 'sums came out right', she would be rightly hurt. Why? Because love, by definition, is partial. It is supposed to be immediate.

  There is a related argument by the philosopher Michael Stocker, who called this **"Moral Schizophrenia"**. He argued that if modern ethical theories are true, there is a split between the *motive* (love) and the *justification* (duty/utility). If you have to consult the rulebook to see if you are allowed to love your wife, the love is already damaged.

  **The Exact Objection:**
  The objection here is not that the calculation leads to the wrong result. It is that the *need* to calculate alienates the agent from their own emotions. It turns a personal relationship into an instance of a general rule. It suggests that your personal feelings are not trustworthy until ratified by an impartial judge.

  ### 2. The Painter: "Integrity" and "Ground Projects"

  The second case—the painter choosing between art and bed nets—is what Williams calls the **"Integrity Objection"**.

  This is slightly different. Here, the issue is not about a specific moment of rescue, but about how one constructs a life over time. Williams argues that we all have **"ground projects"**. These are commitments, ambitions, or relationships that give our lives meaning and provide us with a reason to get out of bed in the morning. For the painter, painting is a ground project.

  Impartial morality (specifically Utilitarianism) asks us to view our own lives from the "view from nowhere". It asks us to treat our own projects as just one set of interests among billions, to be weighed against bed nets. Williams argues that if you actually did this—if you were always ready to drop your ground projects the moment the calculus demanded it—you would no longer be a person with integrity. You would be a mere channel through which utility flows. You would have no 'self' left to speak of.

  **The Exact Objection:**
  The objection here is that impartial morality is too demanding. It threatens to obliterate the agent's identity. A life without personal projects that you are *not* willing to sacrifice is not a human life; it is a life of sainthood that no one can actually live without losing their mind or their sense of self.

  ### Are They the Same Idea?

  They are wearing different clothes, but they are made of the same fabric.

  **The Common Thread:**
  Both arguments attack the idea that morality must be **impartial**. They both claim that requiring a person to step outside their personal perspective to justify their actions creates **alienation**.
  *   In the first case, you are alienated from your **motives** (you can't just love; you must justify love).
  *   In the second case, you are alienated from your **identity** (you can't just live; you must justify your life's purpose).

  Both argue that morality should accommodate the fact that we are particular individuals with specific attachments, not generic rational agents.

  ### Where the Line Falls

  While they overlap, there is a distinct boundary between them.

  **1. Scope: Interaction vs. Existence**
  *   **The Wife (One Thought Too Many):** This is about the **texture of specific interactions**. It concerns the quality of a relationship *in the moment*. The complaint is that the *deliberation* ruins the *act*. It is psychological and relational.
  *   **The Painter (Integrity):** This is about the **structure of a life**. It concerns the long-term viability of having a personality. The complaint is that the *requirement* ruins the *agent*. It is existential and structural.

  **2. The Nature of the Error**
  *   **In the Wife case:** The error is **fetishising the rule**. If the man stops to calculate, he treats his wife as a means to an end (even if the end is 'general good'). He fails to respond to *her*.
  *   **In the Painter case:** The error is **disowning the self**. If the painter gives up art for bed nets, she isn't necessarily treating anyone as a means. Rather, she is treating *herself* as nothing. She is allowing the moral system to colonise her entire existence.

  **3. The Remedy**
  *   **For the Wife:** The solution is to allow **personal motives** to be morally sufficient. We accept that "because she is my wife" is a valid reason, without needing to translate it into "because it maximises utility".
  *   **For the Painter:** The solution is to allow **personal prerogatives**. We accept that an individual is permitted to pursue their own projects even if those resources could technically do more good elsewhere. This is sometimes called a "prerogative to be partial to oneself".

  ### Summary for the Non-Academic Reader

  If you wish to read further on this, the key name to search for is **Bernard Williams**. Specifically, look for his essay *"A Critique of Utilitarianism"* or the collection *"Moral Luck"*.

  To summarise the distinction simply:
  *   The **Drowning Wife** argument says: "Don't make me think about the rules when my heart already knows what to do, or you will kill my love."
  *   The **Painter** argument says: "Don't make me justify my entire existence against the greater good, or you will kill my self."

  Both are saying that a moral theory that cannot make room for the fact that we are human beings—with loved ones and personal passions—is not a moral theory for humans at all. It is a theory for angels or machines.
