answer: |-
  Your friend's slogan conflates epistemic indistinguishability with ontological identity and aesthetic value, and only under a specific, highly contentious phenomenological reading does it actually support his conclusion that originals lack special worth.

  To bring clarity to your argument, you need to separate the slogan into four distinct philosophical claims, only one of which is a platitude, while the others are substantive and mostly false in this context.

  **1. The Epistemological Claim (Platitude)**
  *   **Claim:** "If you cannot detect a difference, there is no difference *in your current knowledge state*."
  *   **Status:** Trivially true. This is a statement about your access to information, not the object itself.
  *   **Support for Friend:** None. This admits that a difference might exist even if you can't see it, which undermines his attempt to dismiss the value of the original.

  **2. The Verificationist Claim (Substantive/Outdated)**
  *   **Claim:** "If no empirical test can distinguish two states, the proposition that they are different is meaningless."
  *   **Status:** Substantive but largely abandoned since the mid-20th century (post-Quine). In physics, this operationalism works for particle identity, but it fails for historical entities.
  *   **Support for Friend:** Weak. Even if the statement "this is a forgery" were meaningless (which it isn't, since provenance is testable via carbon dating, etc.), it doesn't prove the *value* is identical, only that the distinction lacks cognitive meaning.

  **3. The Ontological Claim (Substantive/False)**
  *   **Claim:** "If a property is undetectable by inspection, it does not exist."
  *   **Status:** Substantive and false. Provenance is a relational, historical property (like a particle's trajectory), not just a state property (like current position). A forgery lacks the causal history of the original, which is a real fact regardless of visual detection.
  *   **Support for Friend:** None. If the historical property exists, the objects are ontologically distinct, leaving room for value distinctions based on that history.

  **4. The Phenomenological/Axiological Claim (Substantive/Contentious)**
  *   **Claim:** "Aesthetic value is exhausted by immediate sensory experience; if the look is identical, the aesthetic value is identical."
  *   **Status:** Substantive and highly contentious. This is the only claim that actually supports your friend's conclusion.
  *   **Support for Friend:** Yes, but it requires defending the theory that art is purely about retinal stimulation.

  **The Counter-Argument (Nelson Goodman)**
  To defeat the Phenomenological Claim, you should cite Nelson Goodman's *Languages of Art*. Goodman argues that knowing a work is a forgery changes the perceptual experience itself because it changes the category under which we view the work. Even if you cannot currently see the difference, the knowledge that a difference *might* be found trains you to look differently, altering the aesthetic experience. Therefore, the potential for distinction changes the actual experience.

  **The Physics Analogy Correction**
  Your friend is treating art objects like quantum indistinguishable particles (where identity is irrelevant), but they are more like thermodynamic systems where path dependence matters. In physics, state functions (like pressure) don't care about history, but path functions (like work done) do. The value of an original is often a function of its history (the path), not just its current state (the look). Your friend is incorrectly applying a state-function logic to a path-dependent value.
