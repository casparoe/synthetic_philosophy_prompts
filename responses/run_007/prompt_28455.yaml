prompt: |-
  You are an expert on formal epistemology and Bayesian decision theory who has taught Aumann's agreement theorem to many different audiences. Think carefully before answering.

  I am a graduate student giving a one-hour seminar to a mixed reading group — half philosophers, half economists — on Aumann's agreement theorem. None of them have seen it formally before, though the economists are comfortable with Bayesian updating and the philosophers have encountered common knowledge through Lewis. I have a whiteboard and forty-five minutes of actual teaching time after introductions.

  Do not explain the theorem to me. Instead, plan how I should teach it: the order in which the pieces must be introduced and what depends on what, the one worked example that should carry the whole session, the misconceptions this audience will predictably form and exactly where in the sequence I should head each one off, and the single question I can pose at the end to check whether they have understood the result rather than merely remembered it. Also tell me what I should openly refuse to cover at this level and why.

  Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Role:** Expert in formal epistemology and Bayesian decision theory, experienced teacher of Aumann's Agreement Theorem (AAT).
      *   **Audience:** Graduate students (mixed: philosophers and economists).
      *   **Prior Knowledge:** Economists know Bayesian updating; Philosophers know Lewisian common knowledge. Neither knows AAT formally.
      *   **Constraints:** 1-hour seminar, 45 minutes teaching time, whiteboard available.
      *   **Task:** Plan the teaching strategy (order of concepts, dependencies, one worked example, misconceptions/pre-emptions, final check question, what to exclude).
      *   **Language:** British English.
      *   **Constraint:** Do *not* explain the theorem to me (the user). Assume I know it, but plan *how* to teach it.

  2.  **Deconstruct the Audience & Goal:**
      *   *Economists:* Comfortable with math/probability, might treat priors as given/subjective but often focus on equilibrium. Risk: Thinking it's just about convergence of expectations in markets.
      *   *Philosophers:* Comfortable with epistemic logic/modal operators, might focus on the "common knowledge" aspect. Risk: Getting bogged down in the metaphysics of common knowledge or ignoring the probabilistic mechanics.
      *   *Goal:* Bridge the gap. Show how the epistemic condition (common knowledge) interacts with the probabilistic condition (posteriors) to force agreement.
      *   *Time:* 45 minutes is tight for a rigorous proof. The focus must be on intuition, structure, and the "why it matters" without getting lost in measure theory.

  3.  **Determine the Core Narrative Arc:**
      *   Start with the puzzle (Why is this surprising?).
      *   Define the setup (State space, partitions, priors).
      *   Define the key mechanism (Common Knowledge of Posteriors).
      *   The Example (Must be simple enough to calculate on a board in 10 mins but rich enough to show the partition logic).
      *   The "Proof" Sketch (The averaging argument).
      *   Implications & Limitations.

  4.  **Select the Worked Example:**
      *   *Option A:* Coin toss. Too simple, doesn't show partition structure well.
      *   *Option B:* Three states, two agents. Standard textbook approach. Good.
      *   *Option C:* The "Muddy Children" variant. Too logic-heavy, obscures the probabilistic element.
      *   *Decision:* A finite state space with 4 states. Two agents. Different partitions. It allows for clear visualization of the "meet" of the partitions.
      *   *Specifics:* Let $\Omega = \{1, 2, 3, 4\}$. Uniform prior. Event $E$. Agents have different information partitions. Show that if they know each other's posteriors about $E$, those posteriors must be equal.

  5.  **Sequence & Dependencies:**
      1.  *Motivation (5 mins):* The "No Disagreement" claim.
      2.  *Formal Setup (10 mins):* States, Priors, Partitions (Information), Posteriors.
      3.  *Common Knowledge (10 mins):* Connect Lewis to the partition "meet". This is the crucial bridge for the philosophers.
      4.  *The Example (10 mins):* Walk through the specific numbers.
      5.  *The Logic of the Proof (5 mins):* Why the average must be the same.
      6.  *Wrap-up/Question (5 mins).*

  6.  **Identify Misconceptions & Pre-emptions:**
      *   *Misconception 1:* "It means we will eventually agree if we talk." (No, it's about *common knowledge* of posteriors, not the process of communication).
      *   *Misconception 2:* "It requires identical priors." (Crucial! Must emphasize Common Prior Assumption (CPA)).
      *   *Misconception 3:* "It applies to beliefs about anything." (Only probabilistic beliefs about events).
      *   *Misconception 4:* "Common knowledge is just 'everyone knows'." (Need to distinguish $E^1$ from $E^\infty$).

  7.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Programme, analyse, modelling, centre, etc.
      *   *Tone:* Academic, pedagogical, authoritative but accessible.

  8.  **Refining the "What to Exclude":**
      *   Infinite state spaces (measure theory issues).
      *   Generalisations (non-measurable events, imprecise probabilities).
      *   Dynamic processes (how they *get* to common knowledge).
      *   Why? Time limits and cognitive load. Stick to the finite case for clarity.

  9.  **Developing the Final Check Question:**
      *   Needs to test understanding, not memory.
      *   Don't ask "State the theorem."
      *   Ask a counterfactual or a modification of the assumptions.
      *   *Idea:* What happens if priors differ? What happens if it's only mutual knowledge?
      *   *Selection:* A scenario where posteriors differ. Ask them to identify which assumption failed.

  10. **Review against Constraints:**
      *   Did I explain the theorem to the user? No, I'm planning the teaching.
      *   Is it British English? Yes.
      *   Is it 45 minutes? Yes, the timings add up.
      *   Is the example single and carrying the session? Yes, the 4-state model.

  11. **Final Polish:**
      *   Ensure the distinction between the economists' strength (Bayes) and philosophers' strength (Common Knowledge) is leveraged.
      *   Make sure the "Meet of the Partitions" concept is clear, as that's the technical hinge.

