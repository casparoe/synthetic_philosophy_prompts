answer: |-
  Here is the spec for hinge epistemology.

  ### The Desiderata

  1.  **The Moorean Constraint**
      *   **Requirement:** The theory must explain why G.E. Moore is wrong to claim he *knows* he has hands, even though the proposition is true.
      *   **Case:** Moore holding up his hands. He treats a hinge as an empirical conclusion. A theory must show why this move is category-mistaken, not just factually weak.

  2.  **The Groundlessness Constraint**
      *   **Requirement:** The theory must account for certainty that lacks evidential support without collapsing into irrational dogmatism.
      *   **Case:** The proposition that there is an external world. It is groundless (no evidence supports it without presupposing it) yet not up for grabs.

  3.  **The Fluidity Constraint**
      *   **Requirement:** The theory must allow for hinges to shift status over time or across inquiries.
      *   **Case:** Geocentrism. It once functioned as a hinge (standards of astronomy turned on it); now it is a false empirical claim. A hinge today must be capable of becoming an object of doubt tomorrow.

  4.  **The Action Constraint**
      *   **Requirement:** The theory must locate hinges in behavior and practice, not just mental assent.
      *   **Case:** Animal certainty. A cat stalking a mouse doesn't "believe" the mouse exists; it acts. Hinges must explain this pre-reflective certainty.

  5.  **The Disagreement Constraint**
      *   **Requirement:** The theory must explain deep disagreement without forcing relativism or declaring one side irrational.
      *   **Case:** Clashing hinges. When two agents operate on different foundational certainties (e.g., religious vs. secular frameworks), the theory must explain the impasse without saying communication is impossible.

  ### Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (Core Wittgensteinian Commitments)**
  *   **Groundlessness:** If hinges are justified, they aren't hinges.
  *   **Fluidity:** If hinges are fixed forever, they are dogmas, not hinges.
  *   **Action:** If hinges are purely intellectual, they miss the "form of life" aspect.

  **Camp Preferences (Debated Territory)**
  *   **Propositional Status:** Whether hinges are beliefs (Coliva), entitlements (Wright), or rules (Moyal-Sharrock).
  *   **Universality:** Whether hinges are shared by all rational agents or are community-specific.
  *   **Truth-Aptness:** Whether hinges can be true/false or are merely useful fictions.

  ### The Incompatible Pair

  **Universality of Rationality** vs. **Historical Mutability**

  You cannot jointly satisfy the demand that hinges constitute the universal norms of rationality *and* the demand that hinges change over history.
  *   If hinges are constitutive of rationality (Universality), then changing a hinge changes what counts as rational. This makes historical progress look like a change in logic, which is hard to motivate.
  *   If hinges change freely (Mutability), they cannot be the universal foundation for rational evaluation. This opens the door to relativism, where conflicting hinges are equally rational.
  *   **The Trade-off:** A theory must either accept that rationality is historically contingent (risking relativism) or that some hinges are permanent (risking dogmatism).

  ### The View Killer

  **The Groundlessness Constraint**

  This single requirement rules out the most existing views. Most contemporary epistemology is evidentialist or internalist; it assumes that for a commitment to be rational, it must be supported by reasons or evidence.
  *   **Casualties:** Classical Foundationalism (requires basic beliefs to be self-evident), Coherentism (requires mutual support), and Standard Externalism (often requires reliable formation processes that imply evidence).
  *   **Why:** Any theory that tries to give hinges a justification—pragmatic, transcendental, or probabilistic—fails this constraint. If you justify a hinge, it becomes an empirical claim, and you're back to Moore's mistake.
