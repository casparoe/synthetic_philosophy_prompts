      *   In the discrete case, $E[X] = \sum x_i p_i$.
      *   For $E[X]$ to be well-defined in standard probability theory, the series must be *absolutely convergent*. That is, $\sum |x_i| p_i < \infty$.
      *   If $\sum x_i p_i$ converges but $\sum |x_i| p_i$ diverges, the expectation is *undefined* (or sometimes said to not exist) in the rigorous measure-theoretic sense.
