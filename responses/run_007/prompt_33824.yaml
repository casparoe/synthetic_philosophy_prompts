      *   **Condition:** The expected value sum $\sum P(n) X_n$ converges in the *natural order* ($n=1, 2, \dots$) to a finite positive number.
      *   **Problem:** The series is *conditionally convergent*. By the Riemann Rearrangement Theorem, reordering the terms allows the sum to converge to any real number or diverge.
