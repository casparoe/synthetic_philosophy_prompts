answer: |-
  Your diagnosis of the 'equality of what?' debate as a stable impasse is astute. It is a rare phenomenon in philosophy where the arguments are so well-rehearsed, the counter-examples so standardised, and yet the positions so entrenched. Your working hypothesis—that the three camps are answering different questions under a single heading—is a charitable and sophisticated attempt at dissolution. It suggests the debate is a verbal dispute rather than a substantive one.

  However, whilst your hypothesis captures something important about the *emphases* of each camp, I believe it ultimately underestimates the normative conflict at the heart of the matter. If the disagreement were merely a matter of talking past one another (axiology vs. distribution vs. measurement), we would expect the theorists to be able to accept each other's conclusions as complementary. They do not. Dworkin does not merely say resources are the best *proxy* for welfare; he argues they are the only fair *constituents* of justice. Sen does not merely say capabilities are easier to *measure*; he argues they are the only correct *space* of advantage.

  Here is an assessment of why your hypothesis falls short, an alternative diagnosis of the disagreement, and a suggestion for what genuine progress might look like.

  ### 1. Assessing Your Hypothesis

  Your suggestion is that the welfarist asks 'what makes a life go well?', the resourcist asks 'what is fair to distribute?', and the capability theorist asks 'what should we measure?'. There is textual evidence for this division of labour. Welfarists like Richard Arneson are indeed concerned with the ultimate good; Dworkin is explicitly concerned with the ethical integrity of a political community; and Sen often frames capabilities in terms of development economics and assessment.

  However, this tripartite distinction breaks down under scrutiny because all three theories claim to be comprehensive accounts of **distributive justice**.
  *   **Welfarists** are not merely doing axiology. 'Equal opportunity for welfare' is a theory of what we *owe* each other. They argue that if justice is about mitigating brute luck, then welfare is the only thing that tracks luck properly. To limit justice to resources is, for them, to fetishise means over ends.
  *   **Resourcists** are not merely doing administrative distribution. Dworkin's ambition is to reconcile equality with responsibility. He argues that resources are the only currency that respects persons as autonomous agents capable of forming and revising their own ends. To distribute welfare is to insult that autonomy.
  *   **Capabilitarians** are not merely doing measurement. Sen's critique is ontological and normative. He argues that resources are 'fetishistic' (valuing things rather than what things do) and welfare is 'mentalist' (ignoring adaptation and false consciousness). Capabilities are proposed as the *currency* of justice, not just a metric for auditing it.

  The impasse persists not because they are answering different questions, but because they are giving incompatible answers to the same question: **What constitutes a person's advantage in the context of justice?**

  ### 2. An Alternative Diagnosis: The Responsibility-Need Trade-off

  If the disagreement is not merely verbal, what kind of disagreement is it? I propose it is a **substantive moral disagreement regarding the weighting of two competing values: sensitivity to needs and sensitivity to choice.**

  This is the engine of the impasse.
  *   **Welfarism** maximises sensitivity to needs (the disabled person gets more to reach the same welfare) but minimises sensitivity to choice (it struggles to distinguish between a disability and an expensive taste without complex caveats).
  *   **Resourcism** maximises sensitivity to choice (you are responsible for your tastes) but minimises sensitivity to needs (the hypothetical insurance market is a blunt instrument for actual disabilities).
  *   **The Capability Approach** attempts to straddle the divide but often inherits the problems of both. It faces the 'selection problem' (which capabilities count?) and the 'operationalisation problem' (how do we weigh freedom against achievement?).

  Therefore, the impasse is not a confusion; it is a reflection of a genuine moral dilemma. There is a trade-off between compensating for unchosen disadvantages (needs) and holding people accountable for their conceptions of the good (responsibility). No single currency can perfectly capture both without contradiction.

  Furthermore, there is a **methodological disagreement**.
  *   Dworkin relies on **abstract constructivism**. He asks what would happen in a hypothetical auction or insurance market. This is a device to model fairness, not to describe reality.
  *   Sen relies on **comparative realisation**. He is sceptical of transcendental institutionalism (defining the perfectly just society) and prefers asking whether society A is more just than society B.
  *   Welfarists often rely on **consequentialist calculus**.

  When a resourcist critiques a capability theorist, they are often critiquing the *method* (you cannot measure freedom objectively) as much as the *norm*. When a capability theorist critiques a resourcist, they are critiquing the *abstraction* (hypothetical insurance does not help the actual disabled person).

  ### 3. What Would Count as Progress?

  Given that this is a substantive moral disagreement about the structure of responsibility and the nature of advantage, a 'knock-down' argument is unlikely. Nobody is going to produce a logical proof that welfare is superior to resources. However, progress is possible if we change our expectations of what the debate can achieve.

  **A. Impossibility Theorems (Formal Results)**
  Progress might come from formally demonstrating the trade-offs I mentioned above. If social choice theory could produce an 'impossibility theorem' for egalitarian currencies—showing that no metric can simultaneously satisfy conditions of need-sensitivity, responsibility-sensitivity, and measurability—it would transform the debate. It would move us from asking 'which theory is right?' to 'which trade-off are we willing to accept?' This would validate the impasse as a necessary feature of moral life rather than a failure of philosophy.

  **B. Domain Specificity (Conceptual Distinction)**
  Your hypothesis might be rescued if modified. Perhaps there is no single 'currency of justice'. Progress could look like a **pluralist account** where different currencies apply to different domains.
  *   *Political rights* might be best understood as resources (equal vote, equal speech).
  *   *Health and social care* might be best understood via capabilities (freedom to move, to be healthy).
  *   *Tax and transfer* might be best understood via welfare proxies (income/utility).
  Acknowledging that 'equality of what?' is a category mistake because justice is not monolithic would dissolve the impasse by dissolving the demand for a single currency.

  **C. Shifting from Equality to Sufficiency (Change of Question)**
  Much of the tension arises from the demand for *equality*. If we shift the question to 'sufficiency of what?', the pressure eases. A sufficiency view can acknowledge that resources are the primary distributive mechanism, whilst ensuring everyone has the capability to reach a threshold of functioning. This avoids the endless regress of comparing expensive tastes against disabilities. The debate would shift from 'how to equalise' to 'what constitutes a decent minimum'.

  **D. Empirical Operationalisation**
  Finally, progress might be pragmatic. The capability approach has gained traction not because it won the philosophical argument, but because it offered the Human Development Index (HDI). If one framework proves significantly more useful for guiding policy and improving lives without generating perverse incentives, it may win by attrition. However, this risks the 'is-ought' fallacy; just because capabilities are easier to measure than welfare does not make them more just.

  ### Conclusion

  Your hypothesis that the camps are answering different questions is a compelling hermeneutic of charity, but it is too neat. It treats the disagreement as a confusion rather than a conflict. The reality is starker: these are rival comprehensive doctrines about the relationship between the individual, their circumstances, and the state.

  The impasse is stable because it reflects a **tragic structure in our moral reasoning**: we value both the mitigation of suffering (welfare/capability) and the respect for agency (resources/responsibility), and these values pull in opposite directions when pushed to the limit.

  Progress, therefore, will not come from one side defeating the others. It will come from **abandoning the quest for a monistic currency**. We should expect a future theory of justice to be pluralistic, acknowledging that different goods require different distributive principles, or to move towards sufficiency, where the precise currency matters less than ensuring no one falls below a threshold of dignity. Until then, the debate will remain a stable impasse, not because philosophers are stubborn, but because the moral problem itself has no clean solution.
