prompt: |-
  hey, i need a case for a seminar on nuclear strategy and brinkmanship. build me a thought experiment where two nuclear-armed rivals are in a standoff, and it is individually rational for each of them to deliberately hand the launch decision to an automatic process that has a small but real chance of firing on its own — but the case should land with both of them worse off than if neither had delegated, and the accidental-war risk in the equilibrium has to be something they chose, not a malfunction you tack on. constraints: both leaders are rational and fully informed, no misperception or crazy ideology, the technology is nothing fancier than what existed in the 1980s, and the setting should be concrete and bureaucratic (a submarine, an early-warning center, a hotline, something like that). i'm using this to show how the stabilizing logic can flip, so the bar is that a student who knows the standard story shouldn't be able to dismiss it as a rigged game. after the scenario, do the work: state the players' preferences, give the game as a simple normal form or tree, show why delegation is the rational move for each side even though it leads to a bad equilibrium — and don't just stipulate the badness, show it falling out of the payoffs — and say which structural feature does the work and what happens if you remove it. finish with how a defender of the standard view that leaving something to chance makes threats credible and therefore stabilizes crises would attack your case, and tell me wether the attack lands.
