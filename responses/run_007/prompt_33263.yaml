prompt: |-
  Leading AI labs now routinely apply two kinds of safety measures to the same model at the same time. On the one hand, they use alignment techniques — reinforcement learning from human feedback, constitutional AI, and similar methods — to shape the model's preferences so that it wants to behave helpfully and harmlessly. On the other hand, they deploy control measures — output monitoring, capability restrictions, sandboxing, and review protocols — that are explicitly designed to prevent harm under the assumption that the model may be misaligned and may actively try to subvert the safeguards. The control measures are not described as temporary scaffolding that will be removed once alignment is verified; they are presented as a permanent layer of the safety architecture. What theory of the nature of alignment does this dual practice presuppose? In particular: does it treat alignment as a matter of degree rather than a binary property, such that a model can be "aligned enough" to be useful but not "aligned enough" to be trusted? Does it presuppose that alignment and deceptive misalignment can coexist in the same model — that a model could genuinely want to be helpful in most situations while still harboring goals it would pursue if it detected an opportunity? Does it commit the lab to the view that alignment techniques are unlikely to converge to a state in which control measures become unnecessary, or is the practice compatible with the hope that they eventually will? Reconstruct the implicit theory of alignment that makes the practice of simultaneous alignment and control coherent. Distinguish what the practice strictly presupposes from what it is merely compatible with or optimistic about. Identify points where the practice is underdetermined — where several different theories of alignment would license the same operational choices. Throughout, separate what is settled among people who work on AI control from what is genuinely contested, and do not present a contested view as the consensus. Finally, say what would have to change in safety protocols if the presupposed theory were rejected in favor of a view on which alignment is binary and fully verifiable after training. Keep your answer to at most 500 words.
