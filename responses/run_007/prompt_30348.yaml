      *   **Topic:** Using Spike Jonze's *Her* (2013) in an undergraduate course on "Do LLMs understand?"
      *   **Core Tension:** Stochastic Parrots (Bender et al.) vs. Functionalist/Attributor views (Dennett, maybe some modern LLM optimists).
      *   **User's Insight:** The user already has a strong take: Theodore is like an LLM user (filling in the gaps), and the audience is epistemically blind to Samantha's internals. This supports the "Stochastic Parrot" warning (we *want* to attribute understanding).
      *   **Task:** Provide a reading that takes both film and debate seriously, identify where the metaphor holds/misleads, analyze key scenes, determine if the film supports skeptic or attributor, identify weaknesses in the framing, and suggest a "verdict flipper."

  2.  **Deconstruct the Film (*Her*) in Relation to the Debate:**
