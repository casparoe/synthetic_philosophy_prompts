answer: |-
  # The Epistemic Taxonomy of Forecasting

  This decision tree maps the intellectual DNA of your analysts. It forces a choice on **Source of Truth** (Inside vs. Outside) and **Social Calibration** (Modesty vs. Conviction).

  ### The Decision Tree

  **ROOT SCENARIO:** *You are finalizing a risk assessment for a high-stakes policy intervention. The historical failure rate for similar interventions is 80% (Outside View). Your internal model, accounting for unique current conditions, suggests a 30% failure rate (Inside View).*

  **NODE 1: THE REFERENCE CLASS TEST**
  > **Claim:** "History is a guide, not a cage. Do you anchor your final probability to the 80% historical baseline, or to the 30% model output?"
  >
  > *   **Branch A (Outside Anchor):** "The baseline is the truth; the model is just noise unless it proves why *this* time is different. I anchor near 80%."
  > *   **Branch B (Inside Anchor):** "The baseline is average; this case is specific. I anchor near 30%."
  > *   **Branch C (Synthesis):** "Both are partial signals. I calculate a weighted average based on the strength of the 'uniqueness' argument."

  **NODE 2: THE CONSENSUS GAP (Applied to Branch A, B, or C)**
  > **Scenario:** *You present your number. Three senior colleagues with better track records argue your probability is wrong. The prediction market also prices the risk differently than you do.*
  >
  > *   **Branch X (High Modesty):** "Disagreement is evidence of error. I move my credence more than halfway toward the consensus weighted by their track records."
  > *   **Branch Y (Low Modesty):** "Disagreement is evidence of their blindness. I hold my position unless they show a flaw in my math/data."

  ---

  ### The Leaves (Character Archetypes)

  #### 1. The Actuary (Branch A + X)
  *   **Path:** Anchors to Base Rates + Defers to Consensus.
  *   **Summary:** Trusts historical distributions and assumes the collective wisdom of peers correctly interprets those distributions.
  *   **Most Uncomfortable Commitment:** Must accept that their own deep dive into the specific case details is almost always a distraction from the statistical truth.

  #### 2. The Lone Quant (Branch A + Y)
  *   **Path:** Anchors to Base Rates + Rejects Consensus.
  *   **Summary:** Trusts raw historical data but believes peers systematically misapply it due to political or cognitive bias.
  *   **Most Uncomfortable Commitment:** Must believe they are the only person in the room capable of performing basic statistical conditioning correctly.

  #### 3. The Ghostwriter (Branch B + X)
  *   **Path:** Anchors to Inside View + Defers to Consensus.
  *   **Summary:** Believes the narrative details matter most, but lacks the confidence to defend that belief against social pressure.
  *   **Most Uncomfortable Commitment:** Must publicly advocate for a forecast they privately believe is wrong, effectively becoming a mouthpiece for the room's bias.

  #### 4. The Oracle (Branch B + Y)
  *   **Path:** Anchors to Inside View + Rejects Consensus.
  *   **Summary:** Believes the unique narrative details override history and that their insight surpasses the collective judgment of peers.
  *   **Most Uncomfortable Commitment:** Must accept that being right looks indistinguishable from being delusional until the outcome is resolved (the "Cassandra" burden).

  #### 5. The Diplomat (Branch C + X)
  *   **Path:** Synthesizes Views + Defers to Consensus.
  *   **Summary:** Seeks a mathematical middle ground between inside/outside views but prioritizes organizational cohesion over precision.
  *   **Most Uncomfortable Commitment:** Must admit that the "true" probability matters less than the probability the team can agree to act upon.

  #### 6. The Architect (Branch C + Y)
  *   **Path:** Synthesizes Views + Rejects Consensus.
  *   **Summary:** Integrates base rates and case specifics into a proprietary model and trusts their synthesis over the peer group's intuition.
  *   **Most Uncomfortable Commitment:** Must bear the solitary responsibility for error when the complex model fails, with no one to blame but their own weighting logic.

  ---

  ### Analysis of the Map

  #### (a) Indistinguishable Leaves
  **The Actuary (A+X) and The Diplomat (C+X).**
  *   **Diagnosis:** In practice, these two characters often produce the same forecast numbers. The Actuary arrives at the consensus because the consensus usually hugs the base rate. The Diplomat arrives at the consensus because they defer to the group.
  *   **Dramatic Distinction:** The difference is internal. When the consensus *deviates* from the base rate (e.g., market mania), The Actuary will break from the group to stick to history, while The Diplomat will break from history to stick to the group. Use a "Market Mania" scenario to tell them apart.

  #### (b) Unoccupied Logical Space
  There are two logically possible combinations that are notably absent from the leaves above.

  **1. The "Epistemic Nihilist" (No Anchor + High Modesty)**
  *   **The View:** Rejects both Inside and Outside views as unreliable, and defers entirely to peers.
  *   **Diagnosis:** **Incoherent/Unstable.** If you trust neither data nor narrative, you have no private signal to update *from*. You are not a forecaster; you are a bureaucrat.
  *   **Dramatic Use:** This is a character who is about to quit or have a breakdown. They are occupying a seat they believe is meaningless. Good for a subplot about burnout.

  **2. The "Solipsist" (Inside View + Modesty regarding Markets, but Stubborn regarding Peers)**
  *   **The View:** "My narrative is unique, so I defer to the market price (which aggregates all info), but I refuse to listen to my colleagues."
  *   **Diagnosis:** **Unexplored/Tension-Rich.** This is a stable but psychologically fracturing position. It implies the character trusts abstract aggregation (markets) but hates interpersonal negotiation (peers).
  *   **Dramatic Use:** A character who watches the Bloomberg terminal religiously but refuses to attend staff meetings. They believe "the market" is a god, but their boss is an idiot.

  ### Recommendation for Character Dynamics
  To create maximum friction in your narrative, pair **The Oracle** (Inside/Stubborn) with **The Actuary** (Outside/Modest).
  *   **Conflict:** The Oracle sees a unique opportunity the Actuary calls a statistical impossibility.
  *   **Resolution:** The Actuary is usually right in the long run, but The Oracle is right on the specific "black swan" event that drives the plot.
  *   **Twist:** Introduce **The Ghostwriter** (Inside/Modest) as the mediator who knows the Oracle is right but signs off on the Actuary's report to keep the peace, creating a secret tension of guilt.
