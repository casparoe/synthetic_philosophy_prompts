answer: |-
  The configuration you have identified is widely recognized in contemporary moral philosophy. The standard name for it is **The Paradox of Deontology** (sometimes referred to as **The Deontological Paradox**).

  It was most famously formalized by **Samuel Scheffler** in his 1982 book *The Rejection of Consequentialism*, though the problem is implicit in earlier discussions of **agent-centered restrictions** (by Robert Nozick, Thomas Nagel, and others).

  Here is a breakdown of how the problem is usually set up, its status in the literature, and how it is distinguished from the nearby concepts you mentioned.

  ### 1. The Standard Setup: Agent-Centered Restrictions
  The problem is typically framed around the coherence of **Agent-Centered Restrictions (ACRs)**.
  *   **The Consequentialist View:** Morality requires us to bring about the best state of affairs. If killing is bad, we should minimize the total number of killings.
  *   **The Deontological View:** Morality places restrictions on what *I* may do, regardless of the state of affairs. I am forbidden from killing, even to prevent others from killing.
  *   **The Paradox:** Scheffler points out that if a theory forbids an act (like killing) because it is morally terrible, it seems irrational for that same theory to forbid me from performing that act once to prevent it from being performed five times. As Scheffler puts it, such a theory seems to embody a "moral schizophrenia": it treats the violation of the constraint as a terrible thing to happen in the world, yet forbids the agent from preventing that terrible thing when the only cost is violating the constraint themselves.

  Shelly Kagan, in *The Limits of Morality*, sharpens this by asking: If the reason for the constraint is the disvalue of the act (e.g., the death of an innocent), why does that disvalue count *more* when I cause it than when I allow it? If the disvalue is objective, I should minimize it. If the disvalue is agent-relative, the theory needs to explain why my agency is so morally significant that it outweighs the objective badness of five deaths.

  ### 2. Is it a Genuine Difficulty or a Confusion?
  In the literature, this is regarded as a **genuine and central difficulty**, not a confusion. It is the primary objection raised by consequentialists against non-consequentialist theories.

  *   **The Consequentialist Charge:** They argue the position is formally coherent but substantively irrational. It privileges the "clean hands" of the agent over the actual welfare of the victims.
  *   **The Deontological Defense:** Defenders do not usually claim it is a confusion. Instead, they argue that the paradox rests on a false premise: that the *point* of the prohibition is to minimize the occurrence of the prohibited act in the world.
      *   **Rights as Side Constraints:** Robert Nozick argued that rights are not goals to be minimized (like pollution) but **side constraints** on action. The goal of morality is not to minimize rights-violations; the goal is to respect persons. If I kill one to save five, I have used the one as a means, violating their status as a person, even if the total count of deaths is lower.
      *   **Agent-Relative Reasons:** Thomas Nagel and others argue that moral reasons are **agent-relative**. I have a special reason *not to kill* that is stronger than my reason to *prevent killing*. This is not a contradiction but a feature of the moral landscape. The "concern that motivates" the rule is not "minimize death" but "maintain moral integrity" or "respect the separateness of persons."

  ### 3. Distinctions from Nearby Concepts

  You correctly noted that this is distinct from several other objections. Here is how the literature distinguishes them:

  **A. Vs. "Rule Worship" (The Rule-Utilitarian Objection)**
  *   **The Objection:** Rule Utilitarianism is often charged with "rule worship" when it follows a rule in a specific case where breaking it would produce better utility.
  *   **The Distinction:** As you noted, "rule worship" presupposes the rule is justified by its consequences. The Paradox of Deontology applies even when the rule is justified *independently* of consequences (e.g., by rights or duties). The Paradox of Deontology asks: "If the act is so bad you forbid it, why forbid minimizing it?" Rule Worship asks: "If the goal is good consequences, why follow a rule that hinders them?"

  **B. Vs. Threshold Deontology**
  *   **The Concept:** Threshold deontology holds that constraints are binding up to a point, but if the consequences become catastrophic enough (e.g., kill 1 to save a million), the constraint is overridden.
  *   **The Distinction:** Threshold deontology is a **solution** (or dissolution) to the Paradox of Deontology, not the paradox itself. By admitting a threshold, the theory concedes that consequences *do* matter eventually, thereby reducing the force of the paradox. Your description of defenders allowing the act at "extreme stakes" describes a move from absolute deontology to threshold deontology to avoid the paradox.

  **C. Vs. The Doing/Allowing Distinction**
  *   **The Concept:** This distinction holds that there is a moral difference between actively causing harm and merely allowing it to happen.
  *   **The Distinction:** This is the standard **defense** against the Paradox of Deontology. When a deontologist says, "I am not responsible for the five deaths, only the one I would have caused," they are invoking the Doing/Allowing distinction. The Paradox is the *challenge* ("Why does this distinction matter more than the five lives?"); the Doing/Allowing distinction is the *reply*.
      *   *Note:* Frances Kamm has done extensive work here, arguing that the "numbers" don't aggregate in the way the paradox assumes because of the structural relationship between agent and victim.

  **D. Vs. The "Numbers Problem"**
  *   Sometimes the Paradox of Deontology is specifically referred to as **The Numbers Problem** within deontological ethics. This specifically addresses your point about the theory forbidding the act that keeps violations "as small as possible." The question is: Does deontology have the resources to explain why we shouldn't save the greater number? (Many deontologists argue we *should* save the greater number if no rights are violated in the process, but your specific case involves *violating* a right to save others, which is the harder case).

  ### 4. Summary of Terminology
  If you are searching for literature on this, the most productive search terms are:
  1.  **The Paradox of Deontology** (Scheffler)
  2.  **Agent-Centered Restrictions** (The structural feature causing the paradox)
  3.  **Agent-Relative vs. Agent-Neutral Reasons** (The meta-ethical framework used to solve it)
  4.  **The Separateness of Persons** (Rawls/Nozick's justification for why we don't aggregate violations)

  ### Conclusion
  The configuration is the **Paradox of Deontology**. It is regarded as the strongest argument against agent-centered restrictions. It is not considered a formal contradiction (as you noted), but a challenge to the **rationality** of the theory.

  The "solution" you observed (allowing the act at extreme thresholds) is **Threshold Deontology**, which attempts to mitigate the paradox by admitting consequentialist considerations at the margins. However, hardline deontologists (like Kantians or certain Rights Theorists) accept the paradox as the cost of maintaining moral integrity, arguing that the "concern motivating the rule" is **respect for agency**, not **minimization of harm**, and therefore the outcome (more deaths) does not refute the theory.
