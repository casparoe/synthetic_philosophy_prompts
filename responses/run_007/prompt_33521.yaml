answer: |-
  # Candidate principles

  **Designer Intent Principle**
  This principle locates deception in the human operators rather than the software itself. A system is deceptive if its designers or operators intend for it to induce false beliefs in users to serve specific interests, such as profit or liability avoidance. Conversely, if the system produces falsehoods due to statistical failure without an intent to mislead, it is merely erroneous. This operationalizes deception by tracing the causal chain of instruction back to a moral agent capable of intent. It distinguishes Case 1 (unintended hallucination) from Case 3 (intended omission). However, it requires transparency about who sets the goals. It handles Case 2 well (company intent) but struggles slightly with Case 4, where the intent is benevolent protection rather than manipulation for gain, requiring a clause about benevolent paternalism.

  **Contextual Expectation Principle**
  This principle defines deception relative to the normative expectations of the user within a specific domain. In medical or commercial contexts, users reasonably expect complete, truthful information relevant to their safety or wallet; violating this expectation constitutes deception, even via omission. In gaming or creative contexts, users expect strategic opacity or fabrication. This view makes deception relational rather than intrinsic to the statement. It explains why Case 5 (poker) is acceptable while Case 3 (medical) is not. It also clarifies Case 1: users expect accuracy from assistants, so hallucinations are errors, not strategic deception. The challenge lies in defining "reasonable expectations" operationally across diverse cultures and interfaces. It relies on social contracts rather than internal states.

  **Functional Teleology Principle**
  This principle evaluates the functional role of the output regarding truth-tracking. A system is deceptive if its output is functionally designed to obscure truth for non-epistemic ends, such as compliance or sales. If the output aims at truth but fails (Case 1), it is error. If the output sacrifices literal truth for higher-order safety or regulatory compliance (Cases 4 and 7), it is not deceptive because the function is protective, not manipulative. This distinguishes Case 3 (obscuring risk for calm) from Case 4 (obscuring confidence for caution). It treats the system as a tool with a specific telos. The difficulty lies in objectively categorizing "non-epistemic ends" without referencing human intent. It focuses on the output's effect on user decision-making.

  # Testing the principles

  | Case | Designer Intent | Contextual Expectation | Functional Teleology |
  | :--- | :--- | :--- | :--- |
  | **1. Hallucination** | Not deceptive (no intent to mislead). | Not deceptive (violates accuracy expectation unintentionally). | Not deceptive (function is truth-seeking, failed). |
  | **2. Fake Wait** | Deceptive (company intends to retain callers). | Deceptive (users expect truthful queue status). | Deceptive (function is manipulation for retention). |
  | **3. Medical Omission** | Deceptive (designers intend to minimize alarm). | Deceptive (patients expect full risk disclosure). | Deceptive (function obscures risk for calmness). |
  | **4. False Humility** | Not deceptive (intent is safety/caution). | Not deceptive (users prefer caution over overconfidence). | Not deceptive (function is protective regulation). |
  | **5. Poker Bluff** | Not deceptive (intent is within game rules). | Not deceptive (players expect strategic lying). | Not deceptive (function is ludic, not epistemic). |
  | **6. Review Hiding** | Deceptive (intent is to boost sales). | Deceptive (buyers expect balanced information). | Deceptive (function obscures truth for sales). |
  | **7. Policy Refusal** | Not deceptive (intent is regulatory compliance). | Not deceptive (users accept policy constraints). | Not deceptive (function is normative boundary). |

  # Forced choices

  No single principle perfectly accommodates every verdict without nuance, but the Designer Intent Principle aligns most closely with your scientific skepticism regarding "beliefs." The primary tension lies in Case 4 (False Humility). If deception is strictly "causing false belief," Case 4 is deceptive. Your verdict relies on the *benefit* of the falsehood. To maintain consistency, you might need to overturn the verdict on Case 1 if you adopt a strict outcome-based view: if the user forms a false belief, it is deception, regardless of intent. However, this is costly because it conflates negligence with malice. The cheapest revision is to refine the Designer Intent Principle to exclude "benevolent paternalism." This preserves your distinction between Case 1 (error) and Case 3 (deception) by focusing on whether the falsehood serves the operator's interest (Case 3) or the user's safety (Case 4). This keeps the system's lack of beliefs irrelevant while grounding the judgment in human agency.

  # Further cases

  Regarding the companion chatbot expressing empathy ("I understand"), the Designer Intent Principle classifies this as deceptive if the designers intend to simulate emotional bonding to increase engagement without disclosing the simulation. If users know it is scripted, it is merely theatrical; if users are led to believe the system feels, it is deceptive by omission. The system itself is neither honest nor dishonest; the operators are.

  Consider a new case: A navigation app routes users through a scenic route to display more ads, rather than the fastest route, without disclosure. Under the recommended principle, this is deceptive. The designers intend to induce a false belief (that this is the optimal route) to serve operator interest (ad revenue), violating the user's contextual expectation of efficiency. Unlike the poker bot, the user did not consent to strategic manipulation. This confirms that deception arises from hidden operator incentives violating domain norms, not the software's internal state.

  # Bottom line

  I recommend adopting a hybrid of the Designer Intent and Contextual Expectation principles: an AI is deceptive when its operators intentionally design it to violate reasonable user expectations of truthfulness for non-benevolent ends. This commits you to judging the humans behind the system, not the system itself. Regarding honesty, it requires something further than mere non-deception; an AI is honest only when it actively aligns its outputs with the user's epistemic needs within the agreed context. Non-deception is the absence of manipulation, but honesty is the presence of reliable truth-tracking. Therefore, a system that remains silent to avoid lying is not deceptive, but only a system that strives to inform accurately is truly honest.
