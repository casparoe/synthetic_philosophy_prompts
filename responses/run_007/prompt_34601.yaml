  ok so I'm a philosophy of science PhD student and I've been digging into the structural realist argument from the Fresnel-to-Maxwell case. You know the story: Fresnel derived his equations for reflection and refraction assuming light was a wave in a mechanical ether, then Maxwell derived essentially the same equations from his electromagnetic theory, and the structural realist says 'see, the mathematical structure survived when the ontology didn't, so be a realist about structure not entities.'

  But I feel like the literature kind of waves its hands at the details. I want someone to actually walk me through what was preserved and what wasn't — like, were the equations really the *same* equations, or just formally analogous? And if this is supposed to be the flagship case for structural realism, what does it actually license? Does it just show that we shouldn't be *too* attached to our ontological pictures, or does it genuinely support realism about structure as opposed to, say, constructive empiricism?

  Also, what's the worst thing about this case for the structural realist — the thing that, if you were trying to argue against structural realism, you'd point to first? And tell me how confident you are in each of the main claims you make, and what the point is you're least sure about overall.
