answer: |-
  All ravens are black, we know it's true.
  We scan the world within our sight.
  All non-black things are non-ravens, too.

  Consider now the white shoe slight.
  All ravens are black, we know it's true.
  It confirms the law, however slight.

  No error hides in black or white.
  All non-black things are non-ravens, too.
  The logic holds the world in tight.

  The apple green reflects the light.
  All ravens are black, we know it's true.
  The weight is real, in logic's right.

  No reason to dismiss the light.
  All non-black things are non-ravens, too.
  It pushes back the dark of night.

  So shoe and apple thus unite.
  All ravens are black, we know it's true.
  All non-black things are non-ravens, too.
  The green one confirms in our sight.

  ***

  **Note on Philosophical Content:**
  I am highly confident in the formal representation of the paradox (the logical equivalence of the contraposites and the structural alternation of the villanelle). I am moderately confident in the poetic depiction of the "weak confirmation" problem; while the poem captures the Hempelian intuition that non-black non-ravens *do* confirm the hypothesis, the precise Bayesian degree of confirmation (often argued to be negligible depending on background knowledge) is simplified here for the sake of rhyme and meter. The line "The weight is real, in logic's right" attempts to bridge the gap between logical validity and probabilistic weight, which is the most philosophically contentious area of the paradox.
