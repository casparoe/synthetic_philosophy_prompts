prompt: |-
  I have repeatedly encountered a paragraph like the following in popular books on Buddhism, and I cannot tell how much of it to trust. A book I am reading summarizes the doctrine of no-self (anatta) this way:

  "According to the Buddha, the self is an illusion. What you think of as your self is really just a bundle of constantly changing mental states, so there is no persisting person over time. That is why Buddhists say there is ultimately no one who suffers, no one who is reborn, and no one who attains enlightenment—and why they reject personal identity as a Western illusion."

  I am inclined to accept the opening claim and the talk of a bundle, but the slide to "no persisting person over time" and then to "no one who suffers" feels as if it runs several distinct claims together, and "mental states" sounds more Humean than Buddhist. I have also come across the claim that the Buddha never actually said that there is no self. I do not know the tradition well enough to locate the errors myself.

  Please give me an accuracy audit of this summary. Go sentence by sentence and separate what is accurate, what is a common simplification, and what is wrong or misleading. In particular: are the five aggregates (skandhas) best described as "mental states"? Is the doctrine best rendered as the claim that there is no persisting person over time? Is "no one who suffers, is reborn, or attains enlightenment" a fair statement of the tradition, or does it require a qualification such as the two-truths framework to be stated properly? And does the final sentence—that Buddhists reject personal identity as a Western illusion—follow from anything accurate in the summary? Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question.
