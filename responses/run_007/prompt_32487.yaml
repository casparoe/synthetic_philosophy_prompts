prompt: |-
  In most democracies, a person who immigrates, lives in the country for twenty years, pays taxes, and raises children there cannot vote in national elections unless they naturalize. Meanwhile, a citizen who moves abroad and never returns can often vote for life in the country they left. Between these two people, the one with the thinner connection to the country's laws and policies has the franchise, and the one with the thicker connection does not.

  I'm trying to understand what theory of democratic inclusion — of who properly belongs to the demos — this pair of practices presupposes. It seems to rule out the view that the franchise should track who is subject to the laws (since the non-citizen resident is, and the expatriate often isn't) and the view that it should track who is affected by the government's decisions (for the same reason). What remains? A theory based on national membership or citizenship as a kind of identity that persists independently of where you live? But then what is the philosophical justification for defining the demos that way rather than by residence, subjection to law, or affected interests? And is the practice internally consistent — can it justify also denying the vote to sixteen-year-olds who work and pay taxes, or to the residents of a capital city who are governed by a federal district without full representation? Reconstruct the implicit theory of the demos, identify where it is philosophically underdetermined, and say what institutional changes would follow from replacing it with an all-affected-interests principle or an all-subjected principle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Observation:** Long-term resident non-cizens (20 years, taxes, kids) can't vote vs. Expatriate citizens (live abroad, never return) *can* vote.
      *   **Claim:** The expat has a "thinner" connection (less affected/subjected) than the resident, yet holds the franchise.
      *   **Task:**
          1.  Identify the implicit theory of democratic inclusion (*demos*) presupposed by this pair of practices.
          2.  Explain why it rules out "all-subjected" and "all-affected" principles.
          3.  Analyze the justification for this theory (national membership/identity).
          4.  Test internal consistency (16-year-old workers, DC residents).
          5.  Reconstruct the implicit theory and identify philosophical underdetermination.
          6.  Propose institutional changes if replaced by "all-affected" or "all-subjected" principles.

  2.  **Analyze the Implicit Theory:**

      *   *What binds the voter to the state?* It's not current residence (expats don't reside, residents do). It's not current subjection to law (expats often aren't subject to criminal/civil law in the same way, residents are). It's not current affectedness (expats are less affected by local infrastructure, schools, etc.).
      *   *What is it then?* It's **Citizenship as Status/Membership**. This is often called the *National Membership Model* or *Stakeholder Citizenship* (in a specific, pre-political sense). It relies on a legal bond that is portable and persistent.
      *   *Philosophical Roots:* Social Contract theory (Lockean/Rousseauian) but interpreted through the lens of the Nation-State. The "people" is a pre-political entity defined by birth or naturalization, not by current presence. It treats voting as a right of *membership* in the association, not necessarily a function of *governance* over the individual at that moment.
      *   *Key Concept:* **The Boundary Problem** (Who decides who decides?). The default solution in modern IR is the Westphalian state system where states define their own members.

  3.  **Evaluate Consistency (The "Thinner/Thicker" Connection):**

      *   *16-year-old workers:* They are subjected and affected. Under the Membership Model, they are excluded based on *age/capacity*, not connection. Is this consistent? Yes, if the theory includes a competence threshold. But if a 16-year-old pays taxes, the "no taxation without representation" argument hits hard. The Membership Model usually defers to age as a proxy for competence, whereas All-Subjected might lower the age.
      *   *DC Residents (or similar):* They are citizens, subjected, and affected. They are excluded from full federal representation (e.g., no voting Senators). This contradicts the Membership Model *if* citizenship guarantees full representation. It suggests the theory is actually **Federalism + Citizenship**. The inconsistency here is a flaw in the specific implementation, not necessarily the abstract theory of membership, but it highlights that "citizenship" isn't always sufficient for full franchise (e.g., territories).
      *   *Expats vs. Residents:* The inconsistency is the core of the prompt. The theory prioritizes *legal status* over *political community presence*.

  4.  **Philosophical Justification for Membership Model:**

      *   *Why this way?* Stability, identity, continuity of the polity. The state is seen as an enduring association of people, not just a service provider for current residents. It protects the "national interest" from being diluted by transient populations (though 20 years isn't transient). It aligns with international norms (states control borders and naturalization).
      *   *Underdetermination:* Why 20 years? Why not 5? Why does citizenship persist forever abroad? The theory doesn't explain *why* the bond persists without interaction. It assumes a mystical or legalistic bond that doesn't fade.

  5.  **Alternative Principles & Institutional Changes:**

      *   **All-Subjected Principle (ASP):** Everyone subject to the coercive power of the state should vote.
          *   *Changes:* Non-citizen residents get the vote immediately (or upon residency). Expats lose the vote (unless they remain subject to laws like taxation on worldwide income or conscription). Prisoners might get the vote (still subject to law).
      *   **All-Affected Interests Principle (AAIP):** Everyone affected by decisions should vote.
          *   *Changes:* Much harder to implement. Could imply voting rights for foreign nationals impacted by climate policy or war. Expats vote only on issues affecting them (maybe consular elections?). Residents definitely vote. Potentially leads to a global demos or issue-specific franchises.
      *   **Comparison:** The current system is *Status-Based*. ASP is *Jurisdiction-Based*. AAIP is *Consequence-Based*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the paradox. Name the prevailing theory (Citizenship as National Membership).
      *   *Section 1: The Implicit Theory.* Define it. It's the "National Membership" or "Civic Status" model. It views the *demos* as a pre-constituted body of members, not a fluid group of stakeholders.
      *   *Section 2: Philosophical Justification & Underdetermination.* Why? Stability, reciprocity of allegiance (even if distant), administrative clarity. Where is it weak? It conflates *identity* with *political agency*. It fails to explain why the bond survives decades of non-residence but denies entry to decades of residence.
      *   *Section 3: Internal Consistency Check.*
          *   16-year-olds: Excluded by capacity, not connection. Consistent with Membership, inconsistent with ASP.
          *   DC Residents: Excluded by federal structure. Inconsistent with pure Membership (citizens should have equal weight). Shows the theory is actually "Citizenship within a Federal Compact."
      *   *Section 4: Institutional Changes under Alternatives.*
          *   ASP: Resident aliens vote. Expats lose vote (mostly).
          *   AAIP: Radical changes. Foreigners vote on specific issues. Expats vote only on extraterritorial issues.
      *   *Conclusion:* Summarize the tension between the state as a *club* (membership) vs. the state as a *government* (jurisdiction).

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Be careful not to say expats are *never* subject to laws. Many countries tax worldwide income. But generally, they aren't subject to daily coercive administration (zoning, local police).
      *   *Nuance:* The "National Membership" theory isn't just identity; it's legal. It's about the *contract of citizenship*.
      *   *DC Example:* Make sure to distinguish between national elections (President/Congress) and local. The prompt mentions national elections. DC residents are citizens but lack voting representation in Congress. This is a strong point against the consistency of the "Citizenship = Vote" model.
      *   *Terminology:* Use standard political philosophy terms (Boundary Problem, All-Subjected Principle, All-Affected Principle).

  8.  **Final Polish:** Check tone (analytical, philosophical, neutral). Ensure all parts of the prompt are addressed. (The prompt asks to "Reconstruct the implicit theory," "identify where it is philosophically underdetermined," and "say what institutional changes would follow.")

      *   *Structure:*
          1.  The Implicit Theory: The National Membership Model.
          2.  Justification & Underdetermination.
          3.  Consistency Checks (16yo, DC).
          4.  Alternative Scenarios (ASP & AAIP).

  9.  (Final Review against Prompt): Did I answer "What remains?" Yes (National Membership). Did I address the justification? Yes. Did I address consistency? Yes. Did I outline institutional changes? Yes.

      *   *Key Insight to highlight:* The current system treats voting as a *property of the person* (status) rather than a *function of the relationship* (governance).

  10. **Proceed to generate output.** (This aligns with the detailed response provided previously.)
answer: |-
  The scenario you describe highlights a fundamental tension in democratic theory known as the **Boundary Problem**: *Who constitutes the people (demos) entitled to rule themselves?*

  The practices you outline—denying the vote to long-term resident non-cizens while granting it to permanent expatriate citizens—presuppose a specific, dominant theory of democratic inclusion. Below is a reconstruction of that theory, an analysis of its philosophical weaknesses and internal inconsistencies, and a projection of the institutional changes that would follow from adopting alternative principles.

  ### 1. The Implicit Theory: National Membership as Status
  The pair of practices you describe rules out functional theories of democracy (based on current subjection or affectedness) in favor of a **National Membership Model** (sometimes called the *Citizenship-as-Status* model).

  In this view, the *demos* is not defined by who is currently governed, but by who legally **belongs** to the political association. The state is conceived not merely as a government providing services to residents, but as a enduring nation-state association. Citizenship is treated as a form of property or identity that is portable and persistent.

  *   **The Expatriate:** Retains the vote because their legal bond of membership remains intact. Their connection is deemed "thick" enough because it is rooted in *allegiance* and *legal status*, not physical presence.
  *   **The Resident Non-Citizen:** Lacks the vote because they lack the *status*, regardless of their factual integration. Their connection is deemed "thin" in the legal sense, even if "thick" in the sociological sense.

  **Philosophical Justification:**
  Proponents of this model argue that democracy requires a pre-political community of shared fate. If the *demos* were fluid (changing every time someone moved), political stability would erode. Citizenship acts as a gatekeeping mechanism to ensure that voters have a long-term stake in the survival of the state, ostensibly verified by the rigorous process of naturalization (for immigrants) or birth (for natives). It prioritizes the **continuity of the polity** over the **accuracy of representation** regarding current interests.

  ### 2. Philosophical Underdetermination
  While the National Membership Model provides administrative clarity, it is philosophically underdetermined in several key areas:

  *   **The Persistence of the Bond:** The theory cannot adequately explain why the bond of citizenship survives decades of non-residence and non-participation (the expat), while decades of residence, taxation, and social contribution (the immigrant) fail to generate that same bond without a specific bureaucratic ritual (naturalization). It assumes a metaphysical or legalistic "allegiance" that exists independently of actual political interaction.
  *   **The Conflation of Identity and Agency:** It conflates *being a member of the nation* with *being a subject of the government*. In liberal theory, legitimacy usually derives from the consent of the governed. By allowing those who are barely governed (expats) to vote while excluding those who are fully governed (residents), the theory severs the link between **coercion** and **consent**.
  *   **Arbitrary Thresholds:** If the goal is to ensure a "stake" in the country, why is 20 years of residence insufficient without naturalization, while 0 days of residence (for a citizen born abroad who moves immediately) is sufficient? The theory relies on the *source* of the status rather than the *substance* of the connection.

  ### 3. Internal Consistency Checks
  When we test the National Membership Model against other democratic anomalies, its inconsistencies become apparent.

  **A. Sixteen-Year-Old Workers**
  *   **Scenario:** A 16-year-old works, pays income taxes, and is subject to criminal law.
  *   **Membership Model Verdict:** No vote.
  *   **Consistency:** **Consistent.** The Membership Model typically incorporates a **competence threshold** (age) alongside status. It argues that membership is necessary but not sufficient; one must also possess the capacity for judgment.
  *   **Critique:** However, if the justification for the franchise is "no taxation without representation," the exclusion is inconsistent. The Membership Model dodges this by treating age as a proxy for capacity, whereas an *All-Subjected* principle would struggle to justify excluding a taxpayer solely based on age.

  **B. Residents of the Capital District (e.g., Washington D.C.)**
  *   **Scenario:** U.S. citizens living in D.C. pay federal taxes and are subject to federal laws but lack voting representation in Congress.
  *   **Membership Model Verdict:** No voting representation in the legislature.
  *   **Consistency:** **Inconsistent.** If the franchise is a right of national membership/citizenship, then all citizens should have equal weight in the national legislature. The exclusion of D.C. residents reveals that the actual operating theory is not pure National Membership, but **Federal Compromise + Membership**. It shows that "citizenship" can be tiered, undermining the claim that citizenship guarantees political equality.

  **C. The Expatriate vs. Resident Paradox**
  *   **Consistency:** **Inconsistent.** As you noted, this is the core friction. If the vote is a tool to control the government that rules you, the expat should lose it and the resident should gain it. The only way to make this consistent is to admit that the vote is not about *control*, but about *heritage* or *identity*.

  ### 4. Institutional Changes Under Alternative Principles
  If we replaced the National Membership Model with the two leading alternative theories, the institutional landscape would shift dramatically.

  #### A. The All-Subjected Principle (ASP)
  *Theory:* Everyone subject to the coercive authority of the state's laws should have a say in making them.
  *   **Institutional Changes:**
      1.  **Resident Non-Citizens:** Would gain the right to vote in national elections immediately upon establishing legal residency, as they are subject to the law. Naturalization would become unnecessary for voting purposes.
      2.  **Expatriates:** Would largely lose the right to vote in national elections. Unless they remain subject to specific laws (e.g., taxation on worldwide income, conscription, or laws governing overseas banking), they are no longer "subjected" to the state's coercive apparatus in their daily lives. Voting might be restricted to consular elections or issues specifically affecting citizens abroad.
      3.  **Prisoners:** Would retain the vote (as they are intensely subjected to state coercion), reversing current disenfranchisement laws in many democracies.
      4.  **D.C. Residents:** Would gain full voting representation in Congress, as they are fully subjected to federal law.

  #### B. The All-Affected Interests Principle (AAIP)
  *Theory:* Everyone whose interests are significantly affected by a political decision should have a say in that decision.
  *   **Institutional Changes:**
      1.  **Fluid Franchise:** Voting rights might become issue-specific rather than general. A long-term resident might vote on local infrastructure and schools (heavily affected) but perhaps not on foreign policy (less affected), though this is administratively difficult.
      2.  **Expatriates:** Would vote only on issues that extraterritorially affect them (e.g., pension portability, consular protection, taxation of foreign income). They would lose the right to vote on domestic issues like local education or infrastructure that do not impact them.
      3.  **Foreign Nationals:** Could potentially vote in specific referendums. For example, citizens of neighboring countries affected by a dam project on a shared river, or citizens of nations targeted by a military intervention, might be granted a franchise in those specific decisions.
      4.  **Future Generations:** Institutional guardians might be created to represent the interests of future citizens affected by climate change or debt, as they are "affected" but cannot vote.

  ### Conclusion
  The current system presupposes a **National Membership Model** that prioritizes the stability of the state-as-association over the democratic legitimacy of the state-as-government. It is philosophically underdetermined because it cannot explain why legal status outweighs factual subjection without resorting to circular definitions of "belonging."

  It is internally inconsistent regarding D.C. residents (who are members but lack representation) and expatriates (who lack subjection but retain representation). Shifting to an **All-Subjected Principle** would align the franchise with the rule of law (granting votes to residents, removing them from most expats), while an **All-Affected Principle** would radically democratize specific decisions but create immense administrative complexity. The persistence of the current model suggests that democracies value the *boundary of the nation* more highly than the *logic of consent*.
