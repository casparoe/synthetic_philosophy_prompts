  This is a classic problem in the historiography of psychical research, and it cuts to the core of Sidgwick's philosophical methodology. Sidgwick is often remembered as the "honest broker" of the Society for Psychical Research (SPR), but his honesty was governed by a specific epistemic hierarchy.

  Here is the breakdown of the implicit rules, their predictions, and the test case.

  ### 1. The Two Rules

  **Rule A: The Living-Agent Priority (Sidgwick's Rule)**
  *   **Formulation:** *Always prefer an explanation that locates the causal agency and psychic faculty within the living medium (or sitters) over an explanation that posits an independent, surviving agent.*
  *   **Logic:** Sidgwick treats "Telepathy/Clairvoyance" as a natural (if rare) faculty of the living mind, analogous to memory or perception. He treats "Survival" as a metaphysical claim about the continuation of personality after biological death. In his hierarchy of hypotheses, expanding the known faculties of the living (e.g., adding "clairvoyance" or "retrocognition") is methodologically cheaper than positing a new ontological category (ghosts/spirits).
  *   **Key Precedent:** The Piper case. Even when the information was veridical and about the dead, he rejected survival because telepathy from the *living* sitters was a "live alternative."

  **Rule B: The Informational Vacuum Inference (The Alternative)**
  *   **Formulation:** *If veridical information is produced, and fraud is excluded, and the information is causally isolated from all living minds, infer a non-living source.*
  *   **Logic:** This rule prioritizes the *source of the information* over the *nature of the agency*. If the information physically could not exist in any living brain (due to locks, death, secrecy), the "Living-Agent" hypothesis is falsified by the physical constraints. Therefore, the source must be outside the circle of the living.
  *   **Key Precedent:** This is the common-sense or survivalist intuition. If no living person knows X, and Medium says X, the Medium didn't get it from a living person.

  ### 2. Predictions on the Sealed Envelope Case

  **The Case:** A medium reveals contents of a sealed envelope in a safe deposit box, known only to the deceased. No living person knows the content. Fraud is excluded.

  *   **Prediction under Rule A (Sidgwick):** **Not Survival.**
      Sidgwick would argue that the medium employed **Clairvoyance** (to see through the box/paper) or **Retrocognitive Telepathy** (to read the mind of the deceased *at the moment they wrote the note*, while they were still alive). The *agency* remains with the medium's psychic faculties; the deceased is merely the passive object of the reading, not an active communicator. The "Survival Hypothesis" is unnecessary.

  *   **Prediction under Rule B (Alternative):** **Survival.**
      Since the information is causally isolated from all living minds (the box is sealed, the writer is dead), the "Living-Agent" path is blocked. The only remaining source for the information is the consciousness of the deceased. The verdict is evidence for survival.

  ### 3. Which Rule is Really Sidgwick's?

  **Rule A (Living-Agent Priority) is authentically Sidgwick.**

  The evidence lies in the Piper verdict you summarized. In the Piper case, telepathy from the living *was* physically possible (the sitters were present). Sidgwick used that possibility to block the survival inference. However, the deeper philosophical commitment is revealed in how he treated physical phenomena and book tests generally.

  For Sidgwick, "Telepathy" was a scientific hypothesis (a law of nature connecting minds), whereas "Survival" was a metaphysical one. He was willing to stretch the scientific hypothesis (e.g., allowing telepathy to work over distance, through time, or on inanimate objects via clairvoyance) to avoid the metaphysical leap. He famously worried that accepting survival would require accepting a "cosmic revolution" in our understanding of nature, whereas accepting telepathy only required adding a new chapter to psychology.

  Even in your Sealed Envelope case, Sidgwick would likely classify this as a "Book Test." The historical record of the SPR shows that they typically explained successful Book Tests via **Clairvoyance** (the medium's mind accessing the physical document) rather than Survival (the spirit telling the medium). They preferred to view the medium as an omniscient psychic reader rather than a telephone operator for the dead.

  ### 4. The Distinguishing Case

  To cleanly distinguish Rule A from Rule B, we need a scenario where **Clairvoyance/Telepathy from the living is logically possible** (satisfying Sidgwick's preference for living faculties) but **highly implausible**, whereas **Survival is the simpler explanation** for the *source* of the knowledge.

  Better yet, we need a case where the information **could not have been known by the deceased while alive**, forcing a choice between the Medium's independent psychic power vs. the Deceased's independent post-mortem knowledge.

  **The Case: The "Post-Mortem Secret" (or Dead-to-Dead Information)**

  *   **Scenario:**
      1.  Deceased A (the primary communicator) dies.
      2.  Deceased B (a friend of A) dies one week *after* A.
      3.  While alive, A and B shared no secrets that the Sitter doesn't already know.
      4.  After *both* are dead, B generates a random number, writes it down, and swallows it. No living person ever sees the number.
      5.  In a sitting with A's family (channeling A), the Medium reveals the number B swallowed, and A's "spirit" says, "B told me this number after we both passed over."

  *   **Why it distinguishes the rules:**
      *   **Rule B (Informational Vacuum):** The information never existed in any living mind (B swallowed it; A was dead when B generated it). The living medium could not telepathize it from a living person. The only source that *could* know this is a surviving spirit of B communicating with a surviving spirit of A. **Verdict: Evidence for Survival.**
      *   **Rule A (Living-Agent Priority):** Sidgwick must still avoid positing surviving agents. To explain this without survival, he must attribute **Omniscient Clairvoyance/Retrocognition** to the *Medium*. The Medium's mind must psychically reach out, bypass the living, bypass the dead, and retrieve the information from the physical paper inside B's stomach (or the mind of B at the moment of swallowing).
      *   **The Split:** Rule B accepts the *Survival* inference because the information source is demonstrably non-living. Rule A rejects the *Survival* inference and instead posits a "Super-ESP" faculty in the medium that is effectively omnipotent regarding information retrieval.

  *   **Sidgwick's Likely Verdict:** He would likely reject the case as evidence for survival, insisting that it proves the **Medium's Clairvoyance**, not the **Deceased's Survival**. He would argue that we have evidence for the medium's psychic faculty (from other cases), but we do not have evidence for the continued personality of A and B. He would rather believe the medium is a psychic omniscient than that A and B are chatting in the afterlife.

  This highlights the core of Sidgwick's evidential standard: **He is testing the limits of the Living Mind, not the existence of the Dead.**
