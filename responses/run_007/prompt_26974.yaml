answer: |-
  ### Desiderata for a Theory of the Common Prior and Rational Disagreement

  To escape the circle of defense and dismissal, an adequate theory must specify which constraints are empirical necessities and which are normative commitments. The following seven desiderata capture the pressures you identified. Each is marked as **Non-Negotiable (NN)** for an empirically adequate theory of actual agents, or as a **Camp Preference (CP)** reflecting a contested normative or modeling stance.

  **1. Accommodate Persistent Disagreement**
  *   **Requirement:** The theory must allow for the possibility that agents who are rational (by the theory's own lights) persistently hold different posterior probabilities about the same event.
  *   **Argument:** Actual agents disagree persistently despite exposure to common public evidence. A theory that classifies all such disagreement as *ipso facto* irrational fails to model the agents it claims to describe. It must either explain this disagreement as rational or provide a robust error theory that does not trivialize "rationality."
  *   **Status:** **Non-Negotiable (NN)**. (A theory of *agents* must fit the *agents*.)

  **2. Accommodate Speculative Trade**
  *   **Requirement:** The theory must allow for the possibility of mutually agreed speculative trade (betting) between rational agents.
  *   **Argument:** Financial markets and everyday betting exist. The "No-Trade Theorem" implies that agents with a common prior and common knowledge of each other's rationality cannot speculate. An adequate theory must explain why trade occurs without dismissing all traders as irrational.
  *   **Status:** **Non-Negotiable (NN)**. (Empirical adequacy regarding market behavior.)

  **3. Common Prior as Normative Constraint**
  *   **Requirement:** Rationality *requires* agents to share the same prior probability distribution, provided they share the same logical and linguistic framework.
  *   **Argument:** (Harsanyi/Rationalist) Priors represent a method of processing evidence, not personal taste. If two agents process the same possible worlds differently *ex ante*, at least one is making a logical error. Differences in belief should be explained by differences in information, not differences in priors.
  *   **Status:** **Camp Preference (CP)**. (Contested between Objectivists/Rationalists and Subjectivists/Permissivists.)

  **4. Informational Purity**
  *   **Requirement:** Any difference in posterior belief between rational agents must be traceable entirely to differences in their private information partitions, not to differences in how they weight that information.
  *   **Argument:** (Harsanyi Doctrine) If priors differ, disagreement is a matter of "taste" rather than "fact." To maintain that disagreement is about the world, the updating rule and starting point must be common; only the input (information) varies.
  *   **Status:** **Camp Preference (CP)**. (Standard Game Theory vs. Subjective Bayesianism.)

  **5. Common Knowledge Feasibility**
  *   **Requirement:** The model must assume that agents can, in principle, attain common knowledge of each other's posterior probabilities (or that the theory holds even under close approximation).
  *   **Argument:** (Aumann Idealization) To apply the agreement theorem, agents must know that the other knows, etc. If this is impossible, the theorem is vacuous. An adequate theory must specify whether this is a realistic constraint or a limiting idealization that, if violated, dissolves the agreement result.
  *   **Status:** **Camp Preference (CP)**. (Idealized Modelers vs. Bounded Rationality/Skeptics.)

  **6. Prior Permissivism**
  *   **Requirement:** Rationality permits multiple distinct prior probability distributions, even for agents sharing the same logical framework and evidence.
  *   **Argument:** (Subjectivist) There is no unique "correct" prior. Rationality constrains coherence (probability axioms) and updating (conditionalization), but not the starting point. This allows for reasonable disagreement that does not wash out.
  *   **Status:** **Camp Preference (CP)**. (Subjectivists vs. Uniqueness Thesis proponents.)

  **7. Asymptotic Convergence**
  *   **Requirement:** As agents share more evidence, their posterior beliefs must converge to the truth (or to each other), even if priors differ.
  *   **Argument:** (Optimists) Disagreement should wash out with sufficient data. If priors are too divergent to allow convergence, the model fails to capture the learning process of science and inquiry.
  *   **Status:** **Camp Preference (CP)**. (Convergence Optimists vs. Path-Dependence Skeptics.)

  ***

  ### Inconsistent Subsets: The Aumann Tetrad

  The core logical tension arises from Aumann's Agreement Theorem, which demonstrates that specific combinations of these desiderata are mathematically inconsistent. The primary inconsistent subset is:

  **{1. Accommodate Persistent Disagreement, 3. Common Prior as Normative Constraint, 4. Informational Purity, 5. Common Knowledge Feasibility}**

  *   **The Conflict:** If agents share a prior (**3**) and differences in belief arise *only* from differences in information (**4**), then if they commonly know each other's posteriors (**5**), their posteriors must be identical.
  *   **The Result:** This logically entails **No Disagreement**.
  *   **The Contradiction:** This directly contradicts **Desideratum 1** (Accommodate Persistent Disagreement).
  *   **Secondary Tension (Trade):** The same subset ({3, 4, 5}) combined with rationality entails the **No-Trade Theorem**, which contradicts **Desideratum 2** (Accommodate Speculative Trade).

  To resolve this, a theory must reject at least one member of this set.
  *   **Strict Aumannians** reject **1** (Disagreement is irrational).
  *   **Bounded Rationalists** reject **5** (Common Knowledge is impossible).
  *   **Subjectivists** reject **3** and **4** (Priors can differ).

  ***

  ### The Pivot Requirement

  The single requirement that does the most work in ruling out standard positions is **Desideratum 3: Common Prior as Normative Constraint**.

  While **Desideratum 1 (Accommodate Persistent Disagreement)** is the empirical anchor (Non-Negotiable), it is **Desideratum 3** that acts as the active switch determining the theoretical landscape.

  1.  **If D3 is accepted (as Non-Negotiable or Strong CP):** You are forced into the Aumann corner. To maintain consistency, you *must* reject **D1** (claiming persistent disagreement is irrational) or **D5** (claiming common knowledge is impossible). This rules out the **Subjectivist** position and the **Realist** position that accepts disagreement as rational under common knowledge.
  2.  **If D3 is rejected (treated as a weak Modeling Convention):** The Aumann theorem loses its normative bite. You can retain **D1** (Disagreement), **D2** (Trade), and **D6** (Permissivism) without contradiction. This rules out the **Strict Rationalist** position that demands priors be unique or shared as a matter of logic.

  **Why D3 is the Pivot:**
  The debate circles because participants disagree on whether D3 is a truth about rationality or a simplification for modeling.
  *   Those who treat **D3** as a **Normative Constraint** find **D1** (Persistent Disagreement) intolerable; they must explain it away as bias, bounded rationality, or lack of common knowledge.
  *   Those who treat **D3** as a **Modeling Convention** find **D1** unproblematic; they view priors as subjective parameters.

  Therefore, specifying the status of **Common Prior as Normative Constraint** is the decisive move. An adequate theory cannot treat it as an unexamined axiom. It must explicitly state: *Is the common prior a rule of rationality (forcing us to deny rational disagreement), or is it a contingent fact about specific agents (allowing for rational disagreement)?*

  **Explicit Conflict Spelling:**
  The conflict is not merely between "Theory" and "World." It is within the normative commitments of the theory itself.
  *   **Pressure A:** If you insist that Rationality requires a Common Prior (**D3**) *and* that Rational agents can Commonly Know posteriors (**D5**)...
  *   **Pressure B:** ...then you are logically committed to the claim that Rational Agents cannot Persistently Disagree (**~D1**).
  *   **The Break:** Since Persistent Disagreement (**D1**) is Non-Negotiable (it is an empirical fact), you must drop either the claim that Priors must be Common (**D3**) or the claim that Common Knowledge is Feasible (**D5**).
  *   **The Choice:** Most "Rationalist-adjacent" discussions attempt to keep **D3** and **D5**, thereby forcing the conclusion that actual disagreement is largely irrational. To stop the circle, one must admit that retaining **D3** (Common Prior Normativity) comes at the direct cost of **D1** (Rational Disagreement). You cannot have both.
