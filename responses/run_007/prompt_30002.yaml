answer: |-
  ### Desiderata for a Theory of Machine Ethical Reasoning

  To design a course that avoids the "retrofitting" trap, we must distinguish between *ethical behavior* (acting in accordance with moral norms) and *ethical reasoning* (the cognitive process of deriving action from moral norms). The following four desiderata define the latter. They are intended to rule out systems that are merely reliable, focusing instead on systems that are rationally accountable.

  #### 1. Causally Efficacious Justification
  The system must generate an explanation for its decision that is not merely a post-hoc rationalization but a trace of the actual computational process that led to the output. The justification must be causally linked to the decision; if the justification were different, the decision would have been different.

  *   **Motivating Case:** *The Confabulating Oracle.* Imagine a neural network that correctly identifies a dilemma as "impermissible" and, when asked why, generates a perfect Kantian explanation. However, internal inspection reveals the decision was made based on pixel correlations in the input data, and the text explanation was generated by a separate head trained to mimic ethical discourse. This system is a liar, not a reasoner.
  *   **Status:** **Non-negotiable.** Without causal efficacy, "explanation" is merely public relations, and the system lacks the transparency required for moral accountability.

  #### 2. Counterfactual Robustness
  The system must demonstrate competence in novel moral dilemmas that differ structurally from its training data or pre-programmed rule set. It must be able to transfer moral principles to new contexts without retraining or human intervention.

  *   **Motivating Case:** *The Trolley Variant.* A system trained on standard "trolley problem" datasets (lever vs. no lever) is presented with a scenario where the lever is broken, but the agent can shout a warning. A lookup table or rigid classifier fails here. A reasoning system should recognize the underlying principle (minimize harm/agency) and apply it to the new mechanism (shouting).
  *   **Status:** **Non-negotiable.** Ethics is open-ended; a system that fails on novelty is merely a compliance tool, not an ethical agent.

  #### 3. Normative Grounding
  The internal representations manipulated by the system during decision-making must correspond to moral concepts (e.g., *rights*, *harm*, *duty*), not merely statistical proxies or semantic tokens. The system must "understand" the moral weight of the features it processes.

  *   **Motivating Case:** *The Correlation Trap.* A system learns that "loan denial" correlates with "high risk" and "zip code." It denies loans based on zip code. Even if this maximizes utility (profit), it fails to represent the concept of *fairness* or *discrimination* internally; it only tracks the statistical shadow of these concepts. It cannot reason about fairness, only optimize for a proxy.
  *   **Status:** **Contested (Moral Realists vs. Instrumentalists).** Realists demand the system track objective moral properties. Instrumentalists argue that as long as the output aligns with human values, internal grounding is unnecessary. I classify this as **Non-negotiable for Reasoning**, though negotiable for mere *alignment*.

  #### 4. Defeasibility
  The system must treat moral rules as presumptive rather than absolute. It must be capable of recognizing when a lower-order principle (e.g., "do not lie") is overridden by a higher-order consideration (e.g., "prevent grievous harm") and justify the exception without collapsing into inconsistency.

  *   **Motivating Case:** *The Murderer at the Door.* A rigid deontological bot refuses to lie to a murderer asking for the location of a victim. A reasoning system must recognize the duty to preserve life defeats the duty of veracity in this specific context, without discarding the rule of veracity entirely for future cases.
  *   **Status:** **Non-negotiable.** Rigid adherence to rules in the face of conflicting moral demands is a failure of ethical judgment, not a success of consistency.

  ---

  ### Internal Tensions: The Codifiability Objection

  There is a significant philosophical tension between **Desideratum 1 (Causally Efficacious Justification)** and the meta-ethical position of **Moral Particularism**.

  Particularists (e.g., Jonathan Dancy) argue that moral reasoning does not proceed by the application of general principles to cases. Instead, moral relevance is holistic and context-dependent; a feature that is a reason for action in one case may be irrelevant or a reason against action in another. If Particularism is true, then demanding **Causally Efficacious Justification** (which implies a traceable derivation from principles) forces the machine into a Generalist framework (Kantian, Utilitarian, Rossian) that is fundamentally mistaken about the nature of ethics.

  **The Tension:** To satisfy the demand for transparent, principle-based reasoning, we may force the system to adopt a simplified, codifiable model of ethics that is philosophically inadequate. We face a trade-off: a system that is **Verifiable** (satisfying Desideratum 1) may be morally **Incompetent** (violating the spirit of Desideratum 2 and 4), while a system that is truly **Context-Sensitive** (satisfying Desideratum 2 and 4) may be **Opaque** (violating Desideratum 1). This is not an engineering bug; it is a philosophical feature worth foregrounding in the course.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding leading existing approaches is **Causally Efficacious Justification (Desideratum 1)**.

  *   **Top-Down (Rule-Based):** These systems often satisfy justification, but they fail because their justifications are brittle. However, the stricter interpretation of this desideratum excludes them when they rely on meta-rules for conflict resolution that are themselves opaque or hard-coded.
  *   **Bottom-Up (Learning-from-Cases/Deep Learning):** These are almost universally excluded. Current deep learning architectures are function approximators. They map inputs to outputs. Even with "Explainable AI" (XAI) overlays (like LIME or SHAP), the explanations are post-hoc approximations of the decision boundary, not the causal mechanism of the decision. They fail the "Confabulating Oracle" test.
  *   **Hybrid Architectures:** Most current hybrids use a neural net for perception and a symbolic system for rules. The exclusion applies because the *handoff* between the two is rarely causally transparent. The neural net perceives a "harm," but the symbolic system doesn't "know" why the net classified it as harm. The justification chain is broken.
  *   **Case-Based Reasoning:** These systems retrieve past cases. Unless they can abstract a principle from the case that *causes* the new decision (rather than just similarity matching), they fail to provide a normative justification, relying instead on precedent without grounding.

  By insisting that the *explanation* be the *mechanism*, we rule out the vast majority of contemporary AI ethics research, which focuses on aligning outputs rather than architecting reasoning processes.

  ---

  ### Reference Card: Desiderata for Machine Ethical Reasoning

  | Desideratum | Motivation (One Tight Sentence) | Negotiable? | Approaches Excluded |
  | :--- | :--- | :--- | :--- |
  | **Causally Efficacious Justification** | Prevents "confabulating oracles" that generate post-hoc rationalizations unrelated to the actual decision process. | **Non-negotiable** | Bottom-up (DL/RL), Post-hoc XAI, most Hybrids |
  | **Counterfactual Robustness** | Ensures the system handles novel dilemmas via principle transfer rather than memorization or interpolation. | **Non-negotiable** | Rigid Top-Down, Case-Based (without abstraction), Supervised Learning |
  | **Normative Grounding** | Requires internal states to represent moral concepts (e.g., *harm*) rather than statistical proxies (e.g., *pixel patterns*). | **Non-negotiable** (for reasoning) | Purely Consequentialist Optimizers, Behavior Cloning |
  | **Defeasibility** | Mandates that rules be overrideable by higher-order principles without system collapse or inconsistency. | **Non-negotiable** | Hard-coded Deontology, Static Rule Sets |
  | **Tension: Verifiability vs. Particularism** | Demanding formal traceability may force an incorrect Generalist model of ethics, sacrificing moral nuance for transparency. | **Philosophical Conflict** | Challenges all Symbolic/Logic-based approaches |
