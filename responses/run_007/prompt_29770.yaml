  # JOINT STATEMENT ON MORAL AGGREGATION AND CONSTRAINTS
  **Prepared by the Working Group on Moral Aggregation**
  **Date:** October 26, 2023
  **Signatories:** Proponent of Trade-Permissivism (TP); Proponent of the Constraint View (C)

  ## 1. SUBSTANTIVE AGREEMENTS
  *The following claims represent the common ground upon which our disagreement rests. We both endorse these claims, though our justifications for doing so differ.*

  1.  **Moral constraints are distinct from mere preferences or social conventions.**
      *   **TP Rationale:** Constraints represent extremely high-weight moral reasons grounded in the profound disvalue of certain harms or violations.
      *   **C Rationale:** Constraints represent agent-relative duties or rights that mark actions as impermissible regardless of their optimific value.
  2.  **Consequences are morally relevant in all deliberative contexts.**
      *   **TP Rationale:** Consequences determine the net moral value of an action; they are the primary currency of moral justification.
      *   **C Rationale:** Consequences provide competing reasons that must be weighed against constraints, even if they cannot always override them; ignoring consequences is itself a moral failure.
  3.  **There exist "clear cases" where violating a constraint is impermissible.**
      *   **TP Rationale:** In standard circumstances, the weight of the constraint vastly outweighs the typical benefits available from violating it.
      *   **C Rationale:** The structural nature of the constraint renders the action forbidden, independent of the typical benefit calculation.
  4.  **There exist "clear cases" where preventing catastrophe overrides standard norms.**
      *   **TP Rationale:** When the benefit is sufficiently large, it mathematically exceeds the weight of the constraint.
      *   **C Rationale:** Some norms are not genuine moral constraints but provisional rules; genuine constraints may have narrow scope exceptions (e.g., self-defense) rather than aggregative overrides.
  5.  **Moral residue (regret, restitution) is appropriate following constraint violations, even when justified.**
      *   **TP Rationale:** The violation involved a genuine moral cost that remains regrettable even if the action was overall right.
      *   **C Rationale:** The violation constitutes a wrong against a specific person that requires acknowledgment, even if the action was all-things-considered permissible (or if the agent chooses to violate to prevent a greater evil).

  ***

  ## 2. DISAGREEMENTS TABLE
  *The following table maps the precise points of divergence. For each proposition, the TP endorses the "Left" position and the C endorses the "Right" position.*

  | Level | Proposition in Dispute | Trade-Permissive Position (TP) | Constraint Position (C) |
  | :--- | :--- | :--- | :--- |
  | **1. Metaphysical** | **The Structure of Moral Reasons:** Are reasons behind constraints aggregative with reasons for benefits? | **Yes.** All moral reasons occupy a single metric of normative weight. A constraint is a steep slope, not a cliff. | **No.** Some reasons are exclusionary. They block the aggregation of benefits rather than merely weighing against them. |
  | **2. Structural** | **The Tipping Point:** Is there a quantity of good consequences that *necessarily* renders a constraint violation permissible? | **Yes.** For any constraint $C$ and violation $V$, there exists a benefit $B$ such that $B > V$. | **No.** For core constraints, no quantity of $B$ renders $V$ permissible, because $B$ and $V$ are not comparable on a single scale. |
  | **3. Concrete (Harm)** | **The Marginal Transplant:** Is it permissible to kill one healthy person to save *two* patients needing organs? | **Permissible (in principle).** If the only relevant factor is the saving of lives, 2 > 1. (Though practical rules may forbid it). | **Impermissible.** The prohibition against killing an innocent is not subject to aggregation, even for a net save of one life. |
  | **4. Concrete (Non-Harm)** | **The Deathbed Promise:** Is it permissible to break a solemn promise to visit a grave to instead donate the travel funds to charity, producing a marginally larger benefit? | **Permissible.** The duty to promote good aggregates with the duty to keep promises; if the good is larger, the promise is overridden. | **Impermissible.** The promise creates a specific obligation to the deceased that cannot be discharged by doing good for others. |

  ***

  ## 3. CRUXES AND EVIDENCE
  *We identify the following sub-questions as potential pivot points. Settlement of these issues would likely compel one or both parties to revise their position.*

  ### Crux A: The "Paradox of Deontology" Coherence
  *   **Question:** Can a non-aggregative view explain why it is permissible to minimize constraint violations by others without violating the constraint oneself? (e.g., Is it permissible to coerce a third party to violate a constraint to prevent two violations by others?)
  *   **TP Prediction:** C cannot resolve this without collapsing into aggregation.
  *   **C Prediction:** TP cannot explain the special authority of the agent over their own actions without admitting agent-relative constraints.
  *   **Agreed Evidence:** Formal modeling of agent-relative permissions. If C can produce a consistent deontic logic that avoids paradox without smuggling in aggregation, C gains ground.
  *   **Flag:** **EVIDENCE DISPUTE.** TP views logical consistency as the primary evidence. C views the preservation of specific moral intuitions (e.g., "I must not kill") as primary, even at the cost of systemic optimization.

  ### Crux B: The "Threshold" Arbitrariness
  *   **Question:** If TP is correct that constraints have thresholds, can a non-arbitrary threshold be identified for core harms (e.g., torture)?
  *   **TP Prediction:** Yes, through reflective equilibrium. We can find a number (e.g., saving 1,000 lives) where intuition flips.
  *   **C Prediction:** No. Any specific number (1,000 vs. 1,001) will appear arbitrary, suggesting the intuition of a "flip" is a cognitive error, not a moral reality.
  *   **Agreed Evidence:** Survey data on folk intuitions regarding specific numbers in trolley-style cases.
  *   **Flag:** **NONE.** Both agree that persistent, robust intuitions across diverse populations bear on the truth of moral claims.

  ### Crux C: The Phenomenology of Deliberation
  *   **Question:** When agents deliberate about violating a constraint for the greater good, does the experience resemble a trade-off calculation or a qualitative shift in the nature of the act?
  *   **TP Prediction:** Agents experience it as a tragic trade-off (weighing weights).
  *   **C Prediction:** Agents experience it as a conflict between two incommensurable kinds of demands (e.g., "I cannot do this" vs. "I must help").
  *   **Agreed Evidence:** Qualitative psychological studies of moral distress in professionals (e.g., triage nurses, soldiers).
  *   **Flag:** **EVIDENCE DISPUTE.** TP believes phenomenological reports are subject to post-hoc rationalization. C believes first-person moral experience is a direct source of moral data.

  ***

  ## 4. DIAGNOSIS OF VERBAL DISPUTE
  *We have analyzed whether our disagreement is merely verbal (i.e., solvable by defining terms) or substantive.*

  **Dissolves under Precisification:**
  *   **The Definition of "Constraint":** If TP defines "constraint" as "a rule with a very high threshold" and C defines it as "a rule with an infinite threshold," the dispute risks becoming purely numerical. However, we agree this is not *merely* verbal, because the structural implications of "infinite" vs. "very high" differ radically in limit cases.
  *   **The Term "Permissible":** We agree that "permissible" can mean "all-things-considered justified" (TP) or "not a violation of duty" (C). We have standardized our usage in this document to mean "all-things-considered justified."

  **Remains Substantive:**
  *   **The Logic of Justification:** Even if we align our terminology, we disagree on *why* an action is justified. TP claims the good consequences *cancel* the wrongness of the violation. C claims the good consequences may *excuse* the agent or constitute a separate justification that does not negate the wrong done to the victim. This is a disagreement about the metaphysics of moral wrongness, not just language.
  *   **Moral Residue:** We disagree on whether a justified violation leaves a "moral remainder" (a debt to the victim). TP views this as psychological regret; C views it as an objective moral debt. This has practical implications for restitution and forgiveness that cannot be resolved by semantic stipulation.

  ***

  **Conclusion:**
  We remain in disagreement regarding the aggregative structure of moral reasons. However, we agree that the disagreement is not due to confusion, but rather reflects a fundamental fork in normative theory regarding the commensurability of values. Future work should focus on **Crux B (Threshold Arbitrariness)**, as this offers the most promising avenue for empirical or formal adjudication.

  **Signed:**

  _________________________
  *Proponent of Trade-Permissivism*

  _________________________
  *Proponent of the Constraint View*
