      *   I need to make sure the quiz can actually distinguish Frege from Deflationary. Frege believes in the *logic* of unsaturatedness; Deflationary thinks the *metaphysics* is a mistake. I'll add a question about whether the problem is linguistic or ontological.

      *(Refining Q8)*: Let's make Q8 about whether the problem is deep or shallow.

