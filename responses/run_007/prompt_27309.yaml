      *   **Format:** 7-8 questions. Short concrete scenarios or claims. 2-3 answer options per question. No jargon-heavy labels in the questions (e.g., don't ask "Are you a Russellian?").
      *   **Target Positions (Leaves):**
          1.  Bradley's Monism (Regress is vicious, relations are unreal/illusory).
          2.  Relational Realism (Early Russell, regress is benign).
          3.  States of Affairs Fundamentalism (Armstrong).
          4.  Non-Relational Tie (Bergmann's Nexus).
          5.  Unsaturated Constituents (Fregean).
          6.  Deflationary/No Real Problem.
          *   *Constraint:* Add other leaves if logical space forces it (named or "unnamed").
      *   **Content Focus:** Ordinary physical relations vs. propositional unity, status of instantiation, satisfaction with partial solutions (props vs. facts).
      *   **Deliverables:** The Quiz, a Scoring Key (mapping answers to positions), and an Analysis (flagging indistinguishable positions, impossible combinations, and why).

  2.  **Deconstruct the Positions:**
      *   *Bradley:* Relations lead to infinite regress. Regress is vicious. Therefore, relations are not ultimately real. Reality is One (Monism). Unity is given, not constructed.
      *   *Russell (Early):* Relations are real. Regress exists but is benign (not vicious). Propositions are unified by the relation itself.
      *   *Armstrong:* States of Affairs (SoA) are fundamental. Particulars + Universals don't exist independently of SoA. Instantiation is not a further relation (it's the "non-relational tie" of the SoA structure, though Armstrong sometimes calls it a "non-relational tie" or just denies it's a relation). *Correction:* Armstrong is often associated with the "States of Affairs are fundamental" view, which dissolves the regress by denying the priority of the constituents.
      *   *Bergmann:* There is a specific "nexus" of instantiation that is not a relation. It ties particulars to universals. It's a category mistake to ask what ties the nexus.
      *   *Frege:* Concepts (predicates) are unsaturated. Objects are saturated. The unsaturatedness *is* the unity. No glue needed.
      *   *Deflationary:* The problem is linguistic confusion. There is no metaphysical "glue" needed. "Is on" just works.

  3.  **Drafting Questions (Iterative Process):**

      *   *Q1: The Mug on the Desk (Ordinary Relations).*
          *   Goal: Distinguish Bradley (relations unreal) from Realists.
          *   Options: A) It's just one fact, "on" isn't a separate thing. (Bradley/SoA) B) "On" is a real thing connecting them. (Russell) C) The question is confused. (Deflationary)
          *   *Refinement:* Need to separate Bradley from Armstrong. Armstrong says SoA is fundamental, but relations (universals) are real constituents. Bradley says relations are appearance.
          *   *Draft:* When you say "The mug is on the desk," what is the metaphysical status of the "on-ness"?
          *   A) It's an illusion; ultimately there is just the One. (Bradley)
          *   B) It's a real universal, distinct from the mug and desk. (Russell)
          *   C) It's a real universal, but only exists as part of the whole fact. (Armstrong)

      *   *Q2: The Regress Itself.*
          *   Goal: Vicious vs. Benign.
          *   Scenario: If a relation R connects A and B, do we need a new relation R1 to connect R to A?
          *   A) Yes, but it doesn't matter, it stops nowhere and that's fine. (Russell)
          *   B) Yes, and that proves the whole setup is impossible. (Bradley)
          *   C) No, the first connection doesn't need a connector. (Bergmann/Frege/Armstrong)

      *   *Q3: Predication/Propositions.*
          *   Goal: Fregean Unsaturatedness.
          *   Scenario: "Socrates is wise."
          *   A) "Wisdom" is an object like Socrates, just a different type. (Russell)
          *   B) "Wisdom" is inherently incomplete, it reaches out for Socrates. (Frege)
          *   C) The whole sentence names a fact, neither part is prior. (SoA/Bradley-ish)

      *   *Q4: Instantiation.*
          *   Goal: Bergmann's Nexus vs. Relation.
          *   Scenario: A particular has a property. Is "having" a relationship?
          *   A) Yes, a universal relation. (Russell)
          *   B) No, it's a unique category of tying (Nexus). (Bergmann)
          *   C) It's not a thing at all, just the existence of the state of affairs. (Armstrong/Deflationary)

      *   *Q5: Separability.*
          *   Goal: Can constituents exist without the fact?
          *   Scenario: Could Socrates exist without being wise (if he is wise)?
          *   A) Yes, easily. (Russell)
          *   B) No, particulars only exist within states of affairs. (Armstrong)
          *   C) Socrates is real, Wisdom is real, but their combination is the only reality. (Bradley)

      *   *Q6: The "Glue" Intuition.*
          *   Goal: Deflationary vs. Real Problem.
          *   Scenario: Someone asks "What holds the proposition together?"
          *   A) Nothing, it's not a container. (Deflationary/Frege)
          *   B) The predicate does. (Frege)
          *   C) We need to find the ontological ground. (Realists)

      *   *Q7: Physical vs. Propositional.*
          *   Goal: Same solution for both?
          *   Scenario: Is the problem of "A is F" the same as "A is next to B"?
          *   A) Yes, same metaphysical glue needed. (Russell/Bergmann)
          *   B) No, predication is linguistic, spatial is physical. (Deflationary)
          *   C) Both are equally illusory. (Bradley)

      *   *Q8: The Final Stop.*
          *   Goal: Monism vs. Pluralism.
          *   Scenario: If we solve the unity, how many things are there ultimately?
          *   A) Many independent things. (Russell)
          *   B) Many facts, but no independent things. (Armstrong)
          *   C) Only One Thing. (Bradley)

      *   *Review against constraints:* 7-8 questions. Concrete scenarios. No labels in options.
      *   *Refining Options for Scoring:* I need to make sure the options map clearly to the 6 target positions. This is tricky because some positions overlap on specific questions. I need to create a scoring profile.

      *   *Re-evaluating the Positions for Distinctness:*
          *   *Bradley:* Regress Vicious, Relations Unreal, Monism.
          *   *Russell:* Regress Benign, Relations Real, Pluralism, Constituents independent.
          *   *Armstrong:* SoA Fundamental, Constituents dependent (abstractions), Instantiation not a relation.
          *   *Bergmann:* Nexus (special non-relational tie), Realism about constituents.
          *   *Frege:* Unsaturatedness, Linguistic/Logical focus usually.
          *   *Deflationary:* Pseudo-problem.

      *   *Problem:* Armstrong and Bergmann are very close on "Instantiation is not a relation." Armstrong says SoA is fundamental; Bergmann says Nexus is a distinct category.
      *   *Problem:* Frege and Deflationary can look similar on "No glue needed." Frege says "Unsaturatedness does the work," Deflationary says "There is no work to be done."
      *   *Strategy:* I will design the scoring key to look for *clusters* of answers rather than a simple sum. I will acknowledge the overlaps in the analysis section.

  4.  **Finalizing Questions:**
      *   Make them punchy.
      *   Ensure options cover the spectrum without giving away the school of thought.
      *   Check that "Unnamed" positions are accounted for in the analysis if a user selects a weird combo.

      *(Self-Correction during drafting Q1)*: Make sure Bradley's option doesn't sound *too* mystical, just metaphysically strict.
      *(Self-Correction during drafting Q4)*: Ensure Bergmann's "Nexus" is described functionally, not by name.

  5.  **Developing the Scoring Key:**
      *   I need to assign points or a pattern match. A pattern match is better for metaphysics.
      *   I'll create a "Profile" for each position based on the expected answers.
      *   I need to explicitly address the "Indistinguishable Pairs" and "Empty Logical Space" as requested.

