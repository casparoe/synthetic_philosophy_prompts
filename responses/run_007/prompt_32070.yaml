      *   *Refining:* Make it specific to the "Completeness" or "Fullness" of explanation. If $A$ grounds $B$, $A$ explains $B$. If $A$ is grounded in $Z$, does $Z$ explain $B$? If the chain never ends, is $B$ ever fully explained?
