          2.  The Case for Well-foundedness: The "Completeness" argument (Schaffer style). If no bottom, nothing is ultimately explained.
          3.  The Case for Infinitism: The "Local Explanation" argument (Norton/Berman style). Each link explains the next; global termination isn't needed for local intelligibility. Analogy to epistemic infinitism.
