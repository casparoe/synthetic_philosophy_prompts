  **Is this the right answer?**
  *   **Contractualist Intuition:** Yes. Scanlonians typically argue that the individual facing death has a much stronger *generic reason* to reject a principle that funds skin cream instead of life-saving medicine. The 10,000 can reasonably be asked to endure itches; the 1 cannot reasonably be asked to die.
