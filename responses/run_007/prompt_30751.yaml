answer: |-
  ### Opening questions

  1. You claim our ordinary practice of blaming people more when things turn out badly is a mistake to be revised. What is the single biggest obstacle to convincing people to adopt this revision, and is it cognitive dissonance or a deep-seated emotional commitment to outcomes?
     *   **Follow-up:** If he cites emotional commitment: Do you believe philosophy can override evolved emotional responses, or must we accept a gap between theory and practice? If he cites cognitive dissonance: Is the error merely intellectual, or is it embedded in our language itself?

  2. If two drivers act identically but one hits a child due to a sudden gust of wind, why does our intuition scream that the first driver is morally luckier than the second? Does this intuition reveal a truth about morality or merely a bias in our psychology?
     *   **Follow-up:** If he says it's a bias: How do you propose we debias ourselves without losing our sensitivity to harm? If he says it's a truth: Doesn't that contradict your premise that luck is an illusion?

  ### Pressure questions

  1. Some defenders of ordinary practice argue resultant luck is merely epistemic, where a bad outcome reveals a pre-existing defect in care that was hidden when things went well. If you accept this, haven't you just relocated the blame rather than eliminating luck, and if you reject it, aren't you ignoring that outcomes often do track competence? How do you distinguish between a hidden defect and pure misfortune without relying on the outcome itself?
     *   **Follow-up:** If he argues outcomes are unreliable evidence: Then on what basis do we judge the negligence if not by the harm it caused? If he argues we judge the defect regardless: Doesn't that require omniscience about the agent's internal state that we simply don't have?

  2. You want to revise our blaming practices, but can you preserve the phenomenology of agent-regret without admitting resultant luck matters. If I feel a unique anguish over the child I hit versus the one I missed, isn't that feeling itself a judgment that the outcome matters morally? Do we need to excise this feeling to be consistent, or can it exist as a non-moral preference?
     *   **Follow-up:** If he says it's non-moral: Then what normative work is the apology doing if it doesn't acknowledge a moral difference? If he says we must excise it: Isn't that asking us to be psychopaths regarding our own causal impact?

  3. Your view demands control for moral evaluation, but our personalities and temperaments are largely products of constitutive luck. If we strip away everything influenced by genetics and upbringing, is there any 'agent' left to evaluate, or does your control condition dissolve the self? Is there a core capacity for reason that escapes this luck, or must we abandon praise and blame entirely?
     *   **Follow-up:** If he posits a rational core: Isn't that capacity for reason also subject to developmental luck? If he suggests abandoning praise/blame: Can a society function without these evaluative tools?

  4. Regarding circumstantial luck, you suggest we should judge people on what they did, not what they would have done in different circumstances. But if a person only refrains from murder because the opportunity never arose, are they truly morally better than the one who resisted the temptation? Does moral worth require the testing of character, or is the untested soul equally virtuous?
     *   **Follow-up:** If he says they are equally virtuous: Then isn't moral praise just a reward for not being tested? If he says they are different: How do you access that difference without speculating on counterfactuals?

  5. If we successfully revise our practices to ignore luck, do we risk losing the motivational force of morality, since people often behave better when they fear the stigma of a bad outcome? Are you willing to sacrifice social utility for the sake of moral accuracy, or do you believe a luck-free ethics motivates better?
     *   **Follow-up:** If he sacrifices utility: Is a morality that doesn't motivate still a functional ethics? If he believes it motivates better: What replaces the fear of bad outcomes as a deterrent?

  ### What he has to give up

  1. If luck is irrelevant, should we abandon reactive attitudes like resentment when someone harms us accidentally but negligently, treating it the same as a near-miss? Can human relationships survive without this emotional signaling to mark the difference in harm?
     *   **Follow-up:** If yes: How do you maintain intimacy without that emotional signaling? If no: Isn't your theory incompatible with human psychology?

  2. In law, attempted murder is punished less severely than completed murder. Are you committed to arguing that the legal system should punish both identically, regardless of the victim's status? Does your moral revisionism extend to punitive justice, or do you allow a split between moral and legal luck?
     *   **Follow-up:** If he extends it: How do you justify this to a public that sees justice as tied to harm? If he allows a split: Is there a coherent reason to separate moral blameworthiness from legal liability?
