answer: |-
  This is a classic problem in normative ethics. You are essentially grappling with the tension between **Utilitarianism** (which would make Cases 2 and 8 obligatory) and **Common Sense Morality** (which recognizes special duties and limits on sacrifice).

  Your intuitions are actually quite sophisticated; they track with what philosophers like W.D. Ross (prima facie duties) or Samuel Scheffler (agent-centred prerogatives) argue. The inconsistency you feel comes from trying to apply a single metric (like "cost vs. benefit") to a moral landscape that is actually multi-dimensional.

  Here is a proposed framework—**The Principle of Contextual Demand**—that accommodates most of your verdicts, explains the tensions, and offers a solution to the "Parent Paradox" (Case 7).

  ### The Principle of Contextual Demand

  Morality demands sacrifice, but the *amount* demanded depends on three variables: **Cost**, **Relationship**, and **Mode of Aid**.

  1.  **The Minor Cost Rule:** Preventing great harm (death/severe injury) at minor cost to oneself is **obligatory**.
  2.  **The Bodily Integrity Veto:** No one is obligated to undergo significant bodily intrusion or pain, even to save a life.
  3.  **The Relational Scaling:** Moral demands scale with relational proximity. We owe more to those in our care (children) than to strangers.
  4.  **The Emergency Clause:** Immediate, direct rescue triggers stronger obligations than abstract, systemic aid.
  5.  **The Demandingness Cap:** When sacrifice threatens the agent's basic life projects or health, the act becomes **supererogatory**, *unless* overridden by the Relational Scaling (Rule 3).

  ---

  ### Applying the Principle to Your Cases

  Here is how this principle sorts your eight cases, and where you might need to adjust your thinking.

  **1. Drowning Child (Obligatory)**
  *   **Verdict:** Fits perfectly.
  *   **Why:** Minor Cost (Rule 1) + Emergency (Rule 4). The suit is external property; the child's life is paramount.

  **2. Charity Letter (Supererogatory)**
  *   **Verdict:** Fits, but requires the **Emergency Clause**.
  *   **Why:** Structurally, this looks like Case 1 (£200 for a life). But morally, common sense distinguishes *rescue* from *beneficence*. Case 1 is an emergency you stumbled upon; Case 2 is a systemic need. The "Emergency Clause" allows you to treat direct intervention as obligatory while treating ongoing financial aid as optional (up to a point).
  *   *Note:* If you want a cleaner principle, you would have to overturn this verdict and admit Case 2 is also obligatory (the Peter Singer position). But if you want to keep your intuition, you must accept that *proximity/salience* matters morally.

  **3. Bone Marrow (Supererogatory)**
  *   **Verdict:** Fits perfectly.
  *   **Why:** **Bodily Integrity Veto** (Rule 2). Even though the match is unique (like the pond), the cost is internal (pain/risk) rather than external (money). We do not own strangers' bodies, even to save lives.

  **4. Call Ambulance (Obligatory)**
  *   **Verdict:** Fits perfectly.
  *   **Why:** Negligible Cost (Rule 1).

  **5. Feed Cat (Obligatory / "Ordinary Decency")**
  *   **Verdict:** Reclassify as **Obligatory**.
  *   **Why:** "Ordinary Decency" is not a third category; it is just the name we give to low-cost social obligations. Once you agree to feed the cat (or even just by virtue of being a neighbor in need), the cost is so low that refusing would be morally blameworthy.
  *   *Adjustment:* You don't need to overturn the verdict, just the label. It's a "low-level obligation."

  **6. Volunteer First Responder (Supererogatory)**
  *   **Verdict:** Fits perfectly.
  *   **Why:** **Demandingness Cap** (Rule 5). This involves ongoing sacrifice of leisure and time. It is admirable precisely because it exceeds what we can demand of a citizen.

  **7. Parent Working Double Shifts (Obligatory but Heroic)**
  *   **Verdict:** **Obligatory.** (See detailed analysis below).
  *   **Why:** **Relational Scaling** (Rule 3) overrides the **Demandingness Cap** (Rule 5). Parents have a special duty to prioritize their children's survival over their own comfort/health.

  **8. 90% Income Donation (Supererogatory)**
  *   **Verdict:** Fits perfectly.
  *   **Why:** **Demandingness Cap** (Rule 5). For a stranger, sacrificing 90% of income threatens basic life projects. Without a special relationship (like the parent), this is saintly, not required.

  ---

  ### Solving the Parent Paradox (Case 7)

  You asked: *Is there a way to make sense of its double aspect, or does the principle force me to pick one side?*

  Your instinct that Case 7 feels "both" is psychologically accurate but logically messy. If an act is obligatory, failing to do it warrants blame. If it is supererogatory, failing to do it warrants no blame. You can't be both blameworthy and blameless.

  However, we can explain the "double aspect" without breaking logic.

  **1. The Baseline vs. The Ceiling**
  Parental duty has a baseline (feed, clothe, basic medical care) and a ceiling (sacrifice everything).
  *   If the treatment were cheap, providing it would be *baseline obligatory*.
  *   Because the treatment requires double shifts and health sacrifice, it hits the **Demandingness Cap**.
  *   For a stranger, hitting the cap makes the act supererogatory (Case 8).
  *   For a parent, **Relational Scaling** pulls the requirement back into the "Obligatory" column.

  **2. Why it feels Supererogatory**
  It feels heroic because the parent is operating at the **limit of moral demand**. They are doing the maximum that can be asked of a human being.
  *   **Verdict:** It is **Obligatory**. If the parent decided, "This is too much sacrifice, I'll let the child die," we would morally condemn them. We would not condemn the stranger in Case 8 for keeping their money.
  *   **Resolution:** The "heroic" feeling comes from the *magnitude of the cost*, not the *status of the duty*. It is an **Overdetermined Obligation**: it is required by duty, but the cost is so high it mimics the sacrifice of a saint.

  **Recommendation:** To keep your principle clean, you must classify Case 7 as **Obligatory**. If you classify it as supererogatory, you undermine the special duty of parenthood. If a parent can let a child die to preserve their own health/leisure, the concept of "parental duty" evaporates.

  ---

  ### Summary of Trade-offs

  To maintain a consistent ethical framework based on your gut, here is what you must accept:

  1.  **Accept the "Emergency Clause":** You must accept that saving a drowning child (Case 1) is morally different from sending a cheque (Case 2), even if the cost/benefit ratio is identical. This relies on the psychological and moral significance of *direct agency* and *immediacy*.
  2.  **Accept the "Bodily Veto":** You must hold that bodily integrity is more sacred than property. This explains why the suit (Case 1) must be sacrificed, but the bone marrow (Case 3) need not be.
  3.  **Re-label "Decency":** Accept that Case 5 is a low-level obligation. "Ordinary decency" is just obligation without the dramatic stakes of life-and-death.
  4.  **Resolve Case 7:** Classify the parent's sacrifice as **Obligatory**. Acknowledge that it *feels* supererogatory because it pushes against the human limit of sacrifice, but the special relationship makes it a requirement.

  **The One Verdict You Might Have to Overturn:**
  If you want the cleanest *philosophical* principle, you would overturn **Case 2**. A strict consistency (Singer-style) would say if you must save the drowning child, you must also send the £200.
  *   **Why keep your intuition?** Because most ethical systems (Contractualism, Rossian Deontology) agree with you. We generally believe morality leaves room for personal projects. Demanding we maximize charity at all times makes morality too demanding to be a viable social system. So, keeping Case 2 as supererogatory is defensible, provided you accept the **Emergency Clause**.

  ### Final Principle Statement

  > **"Agents are obligated to prevent great harm when the cost is minor or when a special relationship exists, provided the aid does not require significant bodily intrusion. When the cost threatens the agent's fundamental life projects, the act becomes supererogatory, unless a special relationship (such as parenthood) overrides this limit."**

  This captures 7 out of 8 of your verdicts perfectly, and explains the "double feeling" of the parent case as the tension between the *Demandingness Cap* and *Relational Scaling*.
