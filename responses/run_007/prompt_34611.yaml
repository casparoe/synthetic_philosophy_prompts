answer: |-
  # PROTOCOL FOR ADVERSARIAL COLLABORATION: ONTOLOGICAL STATUS OF MATHEMATICAL ENTITIES

  **Participants:**
  *   **Dr. Elena Aris** (Proponent: Quine-Putnam Indispensability Platonism)
  *   **Dr. Marcus Nomos** (Proponent: Field-Style Hermeneutic Fictionalism)

  **Date:** October 26, 2023
  **Status:** Pre-Registered Joint Document

  **Preamble:**
  After a decade of dialectical stalemate at the Philosophy of Mathematics Tri-Conference Series, the undersigned acknowledge a history of talking past one another. Dr. Aris accuses Dr. Nomos of ignoring the success of science; Dr. Nomos accuses Dr. Aris of conflating utility with truth. This document establishes a shared framework to isolate substantive disagreements from verbal disputes and terminological inertia. We commit to updating our credences based on the outcomes listed in Section 4.

  ---

  ### 1. Points of Agreement (The Common Ground)
  *Both parties sign the following claims. Denial of any claim below voids this collaboration.*

  1.  **Scientific Practice:** Contemporary empirical science (physics, chemistry, biology) relies heavily on mathematical formalism. Removing this formalism would currently cripple the predictive and technological capacity of these sciences.
  2.  **Semantic Standard:** The standard Tarskian semantics for first-order logic applies to mathematical discourse. Under this semantics, a statement like "There exists a prime number greater than 100" has the same logical form as "There exists a planet greater than Earth."
  3.  **Non-Issue (Psychology):** This debate is not about the psychological states of mathematicians. Whether mathematicians *feel* they are discovering existing objects is irrelevant to the ontological question.
  4.  **Non-Issue (Mysticism):** Neither party posits a mystical mode of access to abstract objects (e.g., Gödelian intuition). Any account of mathematical knowledge must be compatible with a naturalistic epistemology.
  5.  **Non-Issue (Normativity):** We agree that mathematics is normative for reasoning. We disagree on *why* (truth-tracking vs. instrumental consistency).
  6.  **Conservativeness:** We agree that if mathematical entities exist, they are causally inert (they do not enter into cause-effect relations with physical objects).

  ---

  ### 2. Disagreements Table
  *Each position is stated in the wording its proponent endorses. Do not translate into opponent's terminology.*

  | Topic | **Dr. Aris (Indispensability Platonist)** | **Dr. Nomos (Fictionalist)** |
  | :--- | :--- | :--- |
  | **Ontological Commitment** | We are ontologically committed to all entities that are indispensable to our best confirmed scientific theories. Since math is indispensable, we are committed to numbers. | Ontological commitment is not forced by utility. We are only committed to concrete entities. Mathematical entities are posits that we use but do not believe in. |
  | **Truth Value of Math** | Mathematical statements are literally true. "2 + 2 = 4" is true in the same sense that "Electrons have charge" is true. | Mathematical statements are literally false (because they quantify over non-existents), but they are *correct within the fiction* of standard mathematics. |
  | **Role of Math in Science** | Mathematics plays an explanatory role. It tells us *why* physical phenomena occur, not just *how* to calculate them. | Mathematics is a logical tool for deriving nominalistic consequences from nominalistic premises. It is a useful shorthand, not an explanation. |
  | **The "Existence" Claim** | To say "numbers exist" is to say that our best theory of the world quantifies over them. | To say "numbers exist" is to make a metaphysical error. We should say "Numbers are useful fictions." |

  ---

  ### 3. The Cruxes
  *These are the specific sub-disputes where resolution would force a significant credence update.*

  **Crux A: The Nominalizability of Physics**
  *   **The Issue:** Can our best scientific theories (specifically General Relativity and Quantum Mechanics) be reformulated without quantification over abstract mathematical objects, retaining their empirical adequacy?
  *   **Stakes:** If **Yes**, Dr. Aris loses the "Indispensability" premise. If **No**, Dr. Nomos loses the claim that math is merely a dispensable instrument.

  **Crux B: Explanatory Indispensability**
  *   **The Issue:** Does mathematics ever provide the *primary explanation* for a physical phenomenon, such that a nominalistic account would be strictly less explanatory (not just harder to write)?
  *   **Stakes:** If **Yes**, Dr. Nomos must account for how false statements explain reality. If **No**, Dr. Aris must concede math is merely descriptive/codificatory.

  **Crux C: The Normative Force of Logic**
  *   **The Issue:** Is the validity of mathematical inference dependent on the truth of its axioms, or merely on the conservativeness of the extension?
  *   **Stakes:** If validity requires truth, Fictionalism collapses. If validity requires only conservativeness, Platonism is ontologically extravagant.

  ---

  ### 4. Pre-Registered Tests and Predictions
  *For each Crux, we agree on an argument or investigation that bears on the issue. We record our predictions now.*

  #### Test A.1: The Field Program Extension
  *   **Method:** Attempt to nominalize the Einstein Field Equations (General Relativity) without using real-number valued fields, using only spacetime points and relations (synthetic geometry approach).
  *   **Dr. Aris Prediction:** The nominalization will either fail to capture singularities/black holes or will require logical resources so complex they implicitly reintroduce abstract structures. **Prediction: Failure.**
  *   **Dr. Nomos Prediction:** A nominalistic reconstruction is possible in principle, even if cumbersome. The current reliance on real numbers is a historical artifact of calculus, not a metaphysical necessity. **Prediction: Success (in principle).**

  #### Test B.1: The Cicada Case Study
  *   **Method:** Analyze the explanation for the prime-numbered life cycles of periodical cicadas (13 or 17 years).
  *   **Dr. Aris Prediction:** The explanation *is* number theoretic (primes minimize intersection with predator cycles). The properties of numbers explain the biology. **Prediction: Math is Explanatory.**
  *   **Dr. Nomos Prediction:** The explanation is biological/evolutionary. Number theory is just the language used to model the biological constraints. A nominalistic model of predator/prey intersection yields the same result. **Prediction: Math is Representational.**

  #### Test C.1: The Conservativeness Proof
  *   **Method:** Examine whether adding mathematical axioms to a nominalistic theory allows the derivation of new *nominalistic* consequences that were not derivable before.
  *   **Dr. Aris Prediction:** If math were merely conservative, it would not be so uniquely indispensable. Its power suggests it tracks structural truths about the world. **Prediction: Non-Conservative Utility.**
  *   **Dr. Nomos Prediction:** By Field's Theorem, if math is consistent, it is conservative over nominalistic physics. If it yields new physical predictions, the physical premises did the work, not the math. **Prediction: Strict Conservativeness.**

  ---

  ### 5. Meta-Philosophical Reflection: The Verbal Dispute Flag
  *Jointly authored section regarding the nature of the disagreement.*

  We acknowledge that a portion of our debate may be verbal rather than substantive. We flag the following:

  **The Definition of "Ontological Commitment"**
  *   **Why it is flagged:** Dr. Aris operates with Quine's criterion: "To be is to be the value of a bound variable." Dr. Nomos operates with a metaphysical criterion: "To be is to be concrete and causally efficacious."
  *   **The Verbal Component:** If Dr. Aris means "commitment" as "what our theory quantifies over," and Dr. Nomos means "commitment" as "what actually exists in the causal order," they may agree on all the facts (science quantifies over numbers; numbers don't cause things) but disagree on the label "exist."
  *   **The Substantive Component:** However, the dispute is **not** purely verbal regarding **Explanatory Power**. If mathematical properties genuinely explain physical events (Crux B), then the Fictionalist claim that math is "just a fiction" faces a substantive hurdle regardless of how "existence" is defined. A fiction should not explain reality unless the fiction maps onto structural truths.
  *   **Resolution Protocol:** In this collaboration, we will use the term **"Quantificational Commitment"** for Aris's usage and **"Metaphysical Existence"** for Nomos's usage. We agree that the substantive battle lies in whether Quantificational Commitment *entails* Metaphysical Existence.

  ---

  ### 6. Signatures

  _________________________
  **Dr. Elena Aris**
  *Date: 2023-10-26*
  *Credence in Platonism: 0.85*
  *Target Credence after Collaboration: Open to revision based on Test B.1*

  _________________________
  **Dr. Marcus Nomos**
  *Date: 2023-10-26*
  *Credence in Fictionalism: 0.80*
  *Target Credence after Collaboration: Open to revision based on Test A.1*

  ---

  ### Editorial Note on the Verbal Dispute (AI Analysis)
  *Per the prompt's instruction to flag verbal disputes if I deem them present:*

  I judge that **Section 5** correctly identifies the primary verbal dispute, but it understates the extent of the verbal divergence regarding the word **"True."**

  1.  **"True" as Assertibility:** Much of the debate hinges on whether "Mathematical statement $S$ is true" means "$S$ corresponds to abstract reality" (Aris) or "$S$ is derivable within the standard axiomatic system" (Nomos). If they agreed to treat mathematical truth as a species of *logical validity* rather than *ontological correspondence*, the "Existence" debate would dissolve into a pragmatic choice about which language game to play.
  2.  **Why it remains substantive:** Despite the verbal overlap, the **Benacerraf Problem** remains substantive. Even if we redefine "truth," the Platonist must still explain *how* humans access these truth-makers (epistemology), and the Fictionalist must explain *why* the fiction is so uniquely applicable to the physical world (applicability). These are not verbal problems; they are explanatory gaps.

  **Verdict:** The debate is **30% verbal** (definitions of 'existence' and 'commitment') and **70% substantive** (explanatory power, nominalizability, and epistemology). The collaboration document correctly isolates the substantive 70% in Section 4.
