answer: |-
  **The Conditional Authority Account of Standing**

  An agent possesses the standing to blame another for a violation of norm *N* if and only if the following four conditions are met:

  1.  **The Non-Hypocrisy Condition:** The agent is not currently violating norm *N* (or a norm sufficiently equivalent in kind and context).
      *   *Motivated by:* Cases 1 and 8. (The serial adulterer and the smoking parent lack standing because they are currently flouting the very norm they invoke.)
  2.  **The Reform Proviso:** Past violations of norm *N* do not undermine standing if the agent has demonstrated genuine remorse and sustained behavioural reform over a significant period.
      *   *Motivated by:* Cases 2 and 9. (The reformed drunk driver and the ex-smoking parent retain standing because their past conduct no longer reflects their current moral commitment.)
  3.  **The Relevance Constraint:** Violations of norms distinct from *N*, or violations of *N* in vastly different contexts of gravity or social role, do not undermine standing to blame for *N*.
      *   *Motivated by:* Cases 5, 6, 10, and 12. (The law-abiding citizen, the bad parker, the cheated partner, and the social liar all retain standing because their own conduct is either clean, irrelevantly different, or disproportionate in scale to the blamed wrong.)
  4.  **The Complicity Clause:** Mere beneficiary status regarding historical injustices does not undermine standing to blame contemporary agents for unrelated wrongs, provided the blamer is not a direct perpetrator of the historical injustice.
      *   *Motivated by:* Cases 4 and 11. (The Belgian citizen and the contemporary beneficiary retain standing because they are not personally complicit in the specific wrongs they blame.)

  ***

  **Diagnosis of Conflicts and Recommendations**

  While the above account captures the majority of your verdicts, there are specific tensions within your case judgements that require resolution. Below I identify the inconsistencies and offer recommendations on whether to adjust the principle or the verdict.

  **1. The Conflict Between Case 2 and Case 7**
  *   **The Tension:** Case 2 (Past Drunk Driving) and Case 7 (Past Violent Assault) are structurally identical regarding the *Reform Proviso*. Both involve a past serious wrong, a significant passage of time, and genuine remorse. Yet, you grant standing in Case 2 but deny it in Case 7.
  *   **Analysis:** This inconsistency suggests either that you view violence as morally distinct from safety violations (e.g., drunk driving) in a way that precludes reform, or that the difference in severity between the past wrong (assault) and the blamed wrong (shove) creates a specific type of hypocrisy (minimisation). However, if remorse is genuine, the agent acknowledges the gravity of their past assault; blaming a lesser act of violence does not necessarily minimise it.
  *   **Recommendation:** I advise **overturning the verdict in Case 7**. To maintain theoretical coherence with Case 2 and the *Reform Proviso*, you should grant standing to the reformed assailant. If you wish to retain the verdict, you must amend the *Reform Proviso* to include a **Gravity Constraint**: an agent cannot blame others for lesser tokens of a type of wrong they previously committed as a greater token (e.g., assault vs. shove), even if reformed. However, this risks making standing too restrictive for serious moral offenders seeking reintegration.

  **2. The Borderline Status of Case 3 (The Secret Racist)**
  *   **The Tension:** Your uncertainty here stems from whether standing is a matter of *public moral authority* or *internal moral consistency*. The *Non-Hypocrisy Condition* typically targets public contradiction. If the racism is hidden, the public message is not hypocritical. However, if standing requires the blamer to be morally 'clean' in a deeper sense (a positional view), the hidden vice matters.
  *   **Recommendation:** Flag this as a **theoretical borderline**. Your principle leans towards a relational/public account (consistent with Macalester Bell's work), which would suggest the secret racist *has* standing until discovered. If you feel they lack standing, you are leaning towards a 'moral status' view (closer to G.A. Cohen's castigation). You need not overturn the verdict, but you must acknowledge that this case determines which meta-ethical view of standing you are adopting.

  **3. The Intuitive Fragility of Case 11**
  *   **The Tension:** Your verdict here (standing granted) is consistent with Case 4 (Belgian citizen) under the *Complicity Clause*. However, you note the intuition is less firm. This is likely due to the heightened salience and contemporary proximity of American slavery compared to Leopold II's Congo in current discourse, rather than a theoretical difference.
  *   **Recommendation:** **Retain the verdict** but recognise the psychological noise. Theoretically, beneficiary status alone does not constitute complicity sufficient to negate standing. If you overturn this, you undermine Case 4. To preserve coherence, treat the 'less firm' intuition as an emotional response to the specific historical content, not a moral distinction relevant to standing.

  **4. The Special Authority of Case 8 and 9**
  *   **Observation:** These cases fit the *Non-Hypocrisy Condition* and *Reform Proviso* perfectly, but they highlight a sub-clause regarding **fiduciary relationships**. Parents have a heightened duty of exemplarity towards children that colleagues (Case 1) or strangers (Case 5) do not.
  *   **Recommendation:** No change needed, but note that the *Non-Hypocrisy Condition* is weighted more heavily in hierarchical or guardianship relationships. This explains why the smoking parent (Case 8) lacks standing more clearly than the serial adulterer (Case 1) might in a less intimate context, though you judged both as lacking standing.

  **Summary of Actions**
  To render your judgements fully coherent with the proposed principles:
  1.  **Overturn Case 7** to align with Case 2 (reform restores standing).
  2.  **Resolve Case 3** by deciding whether standing is purely relational (has standing) or positional (lacks standing).
  3.  **Steady Case 11** by deferring to the logic of Case 4 (beneficiary status ≠ complicity).
