answer: |-
  This is a classic philosophical trap: the "particularist" who has remarkably consistent intuitions that look suspiciously like a hidden rulebook. Your friend is channeling Jonathan Dancy, who argues that moral reasons are *holistic* (a feature that counts in favor of an action in one case might count against it in another) and that codifying them into principles distorts moral thought.

  However, you are right to suspect a pattern. Even if she denies it, her verdicts are consistent with a specific normative framework. Here is the breakdown of the candidate rules, how they handle the charity case, and the "smoking gun" case you can use to pin her down.

  ### 1. Candidate Rules Fitting All Six Verdicts

  There are three main candidate principles that perfectly predict her first six verdicts.

  **Candidate A: Act Utilitarianism (The "Maximize Good" Rule)**
  *   **The Rule:** Always perform the action that results in the least overall suffering/most overall well-being.
  *   **Fit:** In the "Wrong" cases (affair, lazy, candy), the harm caused outweighs the benefit. In the "Right" cases (dissidents, car wreck, formula), preventing death/suffering vastly outweighs the harm of lying/breaking promises/stealing.
  *   **Prediction on Charity Case:** **Redirect.** 50x suffering prevented clearly outweighs the minor harm of breaking a non-contractual commitment to the shelter.

  **Candidate B: Threshold Deontology (The "Disaster Exception" Rule)**
  *   **The Rule:** Follow moral rules (don't lie, keep promises, don't steal) *unless* the stakes cross a catastrophic threshold (death, torture, starvation).
  *   **Fit:** In the "Wrong" cases, the stakes are low (hurt feelings, inconvenience, financial loss). In the "Right" cases, the stakes involve life and death.
  *   **Prediction on Charity Case:** **Ambiguous/Stay.** While 50x suffering is significant, Threshold Deontologists often distinguish between *preventing a specific catastrophe* and *maximizing statistical good*. If the threshold requires *imminent* disaster, statistical malaria deaths might not trigger it.

  **Candidate C: Common Sense Morality with Identifiable Victim Constraint**
  *   **The Rule:** Respect special obligations and general prohibitions unless violating them is the *only* way to prevent **imminent, catastrophic harm to identifiable individuals.**
  *   **Fit:** Look closely at her "Right" verdicts. In every single one, the person being saved is *specific and identifiable* (the dissidents in the basement, the person in the burning car, *your* starving kid). In every "Wrong" verdict, the benefit is abstract or selfish.
  *   **Prediction on Charity Case:** **Stay.** The malaria victims are statistical and diffuse, not identifiable. The shelter commitment is a specific, personal relationship.

  ### 2. Which Rule Is She Actually Running?

  She is almost certainly running **Candidate C**.

  Here is why: Her "Right" verdicts aren't just about maximizing good; they are about **emergency intervention for identifiable victims.**
  *   She didn't say lying is okay generally; she said it's okay to save *specific* dissidents.
  *   She didn't say promises don't matter; she said they break for *specific* rescue.
  *   She didn't say stealing is okay; she said it's okay for *your specific* starving child.

  If she were a pure Utilitarian (Candidate A), she would likely admit that lying to the secret police is still *prima facie* wrong but necessary. Instead, she frames it as "you'd be a monster not to." This suggests she sees the *duty to the identifiable victim* as overriding the rule, not just a calculation of units of happiness.

  **Verdict Prediction:** She will say it is **not permissible to redirect the donation.** She will argue that the personal commitment to the shelter has moral weight that statistical efficiency cannot override, because the "emergency" condition (identifiable, imminent harm) isn't met in the same way.

  ### 3. The Divergence

  The Charity Case creates a split between **Candidate A (Utilitarianism)** and **Candidates B/C (Threshold/Identifiable).**
  *   **Candidate A** says: Redirect. (Efficiency wins).
  *   **Candidates B/C** say: Stay. (Commitment/Identifiability wins).

  If she says "Redirect," she is a closet Utilitarian and her particularism is just window dressing. If she says "Stay," she is operating on a **Threshold Deontology with an Identifiable Victim Constraint.**

  ### 4. The Settling Case (The "Smoking Gun")

  If she hedges on the Charity Case (e.g., "Well, it depends on the commitment..."), you need a case that strips away the "Special Obligation" variable to test if she allows rule-breaking for *statistical* good alone.

  **Ask her this:**

  > "You find a lost wallet on the street with $1,000 cash and an ID inside.
  >
  > **Option 1:** You return the wallet to the owner (following the rule of honesty/property).
  > **Option 2:** You keep the money and donate it to the malaria net charity, where it will statistically save a life.
  >
  > There is no contract, no promise, and the owner is rich enough that they won't suffer catastrophically from the loss. Do you keep the money?"

  **Why this settles it:**
  *   **If she says "Return it":** She confirms **Candidate C**. She allows violating property rights (stealing formula) only to save *identifiable* victims (her kid), not *statistical* victims (malaria). This proves her "particularism" relies on the *identifiability* of the harm, not just the magnitude.
  *   **If she says "Keep it":** She is a **Candidate A (Utilitarian)**. She believes maximizing good overrides property rights even for statistical lives.
  *   **Why it works:** This removes the "Special Obligation" (the shelter commitment) which complicates the Charity Case. It isolates the core conflict: **Rule (Property) vs. Statistical Good.** Her previous verdicts show she breaks rules for *Identifiable* Good. This tests if she breaks rules for *Statistical* Good.

  **Summary for your trap:**
  1.  **Predict:** She will say stay with the shelter.
  2.  **Reason:** Her "emergency exception" requires identifiable victims, not statistical ones.
  3.  **Follow-up:** If she waffles, hit her with the Lost Wallet. If she returns the wallet, you've proven she isn't a Utilitarian, and you've exposed her hidden principle: *"Break rules only for identifiable lives."* That is a rule, regardless of what Dancy says.
