      *   *Nuance:* Is it *just* methodological? Or is it also semantic (what does "consciousness" mean)? Or metaphysical (what exists)? The user asks to distinguish between substantive, verbal, data-related, or standards-related. The methodological diagnosis encompasses the "data" and "standards" aspects.
