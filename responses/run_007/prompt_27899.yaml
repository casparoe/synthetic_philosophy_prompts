      *   **User's Hypothesis:** The deepest fault line is *methodological*. Realists treat first-person appearance as a *datum* with default authority. Illusionists treat first-person *reports/dispositions* as data, regarding the *appearance* of phenomenality as a theoretical interpretation to be rejected.
