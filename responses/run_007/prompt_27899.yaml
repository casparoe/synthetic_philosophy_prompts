answer: |-
  Your hypothesis is astute and, I would argue, largely correct. The stalemate between illusionists (like Keith Frankish) and realists (like Galen Strawson and David Chalmers) is indeed best diagnosed as a **methodological and epistemological disagreement** that manifests as a substantive metaphysical dispute.

  Specifically, the impasse arises because the two sides adopt incompatible **epistemic policies regarding introspection**. Realists operate under a principle of *Phenomenal Conservatism* (if it seems to you that you have a qualitative experience, then you do), whereas Illusionists operate under a principle of *Naturalized Epistemology* (introspection is a fallible cognitive process subject to the same error as perception).

  Here is a diagnosis of the structure of the disagreement, an evaluation of your hypothesis, and a proposal for what might count as progress given this diagnosis.

  ### 1. Validation of the Methodological Hypothesis

  Your hypothesis identifies the "data" of consciousness as the primary fault line. This is the correct place to look.

  **The Realist's Datum (Strawson):**
  For Strawson, the existence of experience is the one indubitable fact. His argument that illusionism is "self-defeating" relies on the claim that *appearing is existing* in the mental realm. If you are under the illusion that you are in pain, the "illusion" itself is a painful experience. Therefore, you cannot have an illusion of phenomenality without phenomenality itself.
  *   **Methodological Commitment:** First-person appearance has **default ontological authority**. To explain consciousness is to explain how this datum fits into the physical world, not to explain it away. The "hard problem" is the gap between this datum and physical description.

  **The Illusionist's Datum (Frankish):**
  For Frankish, the data are the *judgments* and *reports* subjects make, along with their neural correlates. Introspection is not a direct gaze into a private realm but a complex, theory-laden cognitive mechanism. Just as the visual system can represent a stick in water as bent when it is straight, the introspective system can represent a physical state as possessing intrinsic, ineffable qualia when it does not.
  *   **Methodological Commitment:** First-person reports are **fallible evidence**. The "appearance" of phenomenality is a hypothesis generated by the brain about its own states. The "hard problem" is a cognitive artifact, a confusion generated by this introspective misrepresentation.

  **Why this creates an impasse:**
  You noted that "neither side can argue for its starting point in terms the other would accept." This is precisely because the disagreement is about the **rules of evidence**.
  *   If the Realist demands the Illusionist account for the *feeling* of the illusion, the Illusionist says, "I am accounting for the *judgment* that there is a feeling."
  *   If the Illusionist demands the Realist explain how the feeling arises physically, the Realist says, "You are asking me to explain the datum I started with; you are the one positing the magic of 'illusion' without a feeler."

  ### 2. Refining the Diagnosis: It is not merely Verbal or Substantive

  It is tempting to call this a **verbal disagreement** (i.e., they mean different things by "consciousness"). Frankish often suggests this: he admits "phenomenal consciousness" exists in the folk-psychological sense but denies it in the philosophical sense.

  However, calling it merely verbal underestimates the stakes.
  *   **Not Just Verbal:** If it were purely verbal, they could agree on the physical facts and the behavioral facts and simply label them differently. But Strawson insists that by denying the *reality* of the qualitative character, Frankish is denying the existence of the very thing that makes life worth living or suffering bad. This is a substantive ethical and metaphysical claim, not just a definitional one.
  *   **Not Just Substantive:** If it were purely substantive (e.g., "Do qualia exist?"), we could look for evidence. But both sides agree on the neuroscience and the behavior. The disagreement is about how to *interpret* the introspective evidence.

  Therefore, your **methodological diagnosis** is the deepest layer. The substantive disagreement (do qualia exist?) is a downstream consequence of the methodological disagreement (does introspection reveal reality or construct a model?).

  ### 3. The Role of the Meta-Problem

  Chalmers's meta-problem highlights this methodological split perfectly.
  *   **For the Illusionist:** The meta-problem *is* the hard problem. If you explain why the system *judges* there to be a hard problem (via introspective error), you have explained everything that needs explaining. There is no "residue."
  *   **For the Realist:** The meta-problem is distinct from the hard problem. Explaining why I *judge* I am conscious leaves open the question of why I *am* conscious. To conflate the two is to commit a category error.

  This confirms your hypothesis: The Illusionist treats the *judgment* as the exhaustible target of explanation. The Realist treats the *experience grounding the judgment* as the target.

  ### 4. What Counts as Progress?

  If the impasse is methodological, empirical data alone cannot resolve it. Both sides can accommodate any neuroscientific finding (Realists by saying "that's the correlate," Illusionists by saying "that's the mechanism of the illusion").

  Progress, therefore, must be **theoretical and dialectical**. Here are three avenues for progress given your diagnosis:

  **A. The "Error Theory" Burden of Proof**
  Progress would require the Illusionist to move beyond the abstract claim that introspection is fallible and provide a **specific cognitive model of the error**.
  *   *Current State:* Frankish argues introspection is like vision (prone to illusion).
  *   *Progress:* Illusionists need to predict specific *types* of introspective errors analogous to visual illusions (e.g., Müller-Lyer for qualia). If they can identify a structural feature of cognition that *necessitates* the misrepresentation of physical states as phenomenal properties, the methodological burden shifts. The Realist would then have to explain why this specific cognitive mechanism preserves truth rather than creating illusion.
  *   *Why this helps:* It moves the debate from "Introspection *might* be fallible" to "Here is *how* it is fallible," forcing the Realist to engage with the mechanism rather than the principle.

  **B. Clarifying the Normative Standards of Explanation**
  The seminar could focus on what counts as a "complete" explanation.
  *   *Realist Standard:* An explanation is complete only when the ontology of the theory matches the ontology of the appearance (i.e., you must find the qualia in the physics).
  *   *Illusionist Standard:* An explanation is complete when the causal/functional role of the appearance is fully accounted for (i.e., you must find the *belief* in qualia in the physics).
  *   *Progress:* Acknowledging that these are competing **normative ideals**. Progress would involve asking: Which standard yields better heuristic value for science? If the Illusionist program generates more successful predictions about neural processing than the Realist program, it gains pragmatic authority, even if the Realist maintains the metaphysical objection.

  **C. The "Hard Problem" of Illusion**
  The Realists (specifically Strawson) have a strong point: An illusion is a phenomenon. To explain the illusion of consciousness, you must explain the consciousness of the illusion.
  *   *Progress:* The Illusionist needs to clarify the **ontology of the misrepresentation**. When Frankish says the brain represents a state as having qualia, what is the "vehicle" of that representation?
      *   If the vehicle is itself phenomenal (e.g., a thought that feels a certain way), Strawson wins (the phenomenality is presupposed).
      *   If the vehicle is non-phenomenal (e.g., a purely syntactic neural code), the Illusionist must explain how a non-phenomenal state can constitute a *mistake* about phenomenality without implicitly referencing the very thing it denies.
      *   *Dialectical Move:* If the Illusionist can articulate a theory of "non-phenomenal misrepresentation" that satisfies the Realist's demand for coherence, the impasse breaks. If they cannot, the Realist's charge of "changing the subject" holds.

  ### 5. Conclusion

  Your diagnosis is correct. The debate is not stalled because of a lack of empirical data, but because of a clash between **Phenomenal Conservatism** (Realism) and **Naturalized Epistemology** (Illusionism).

  *   **Realists** treat the first-person perspective as the **court of appeal**.
  *   **Illusionists** treat the first-person perspective as the **defendant**.

  Because neither side accepts the other's court, they talk past one another. Progress will not come from one side proving the other wrong on the facts, but from one side demonstrating that their methodological starting point offers a more coherent, predictive, or theoretically virtuous framework for the science of mind.

  In your seminar, you might suggest that the most productive path forward is to stop asking "Who is right about qualia?" and start asking "What are the costs and benefits of adopting each methodological stance for the future of cognitive science?" This shifts the debate from an intractable metaphysical stalemate to a pragmatic evaluation of research programs.
