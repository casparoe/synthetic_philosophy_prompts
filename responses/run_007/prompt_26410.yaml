answer: |-
  ### The Scenario

  The Westbridge Borough Council must decide whether to approve a minor adjustment to the zoning laws in the town centre. Option A maintains the status quo, preserving a mix of small independent shops with predictable, modest economic output. Option B permits the construction of a single, mid-sized logistics hub. The immediate, foreseeable consequences of Option B are slightly superior: it creates ten local jobs and generates £50,000 annually in business rates, which the council can spend on verified social care improvements. However, the hub's presence will alter traffic flows and local employment structures in ways that interact chaotically with regional development over the next fifty years. While we know these downstream effects will be morally significant, we possess no epistemic basis for assigning probabilities to whether they will be net beneficial or harmful (complex cluelessness). Option A carries no such uncertainty; its long-term effects are negligible and contained.

  ### (a) The Verdicts and Reasoning

  **Standard Expected Consequentialism (SEC)** argues that the council ought to choose Option B. SEC maintains that when faced with complex cluelessness regarding distant consequences, we are justified in applying a principle of indifference: absent evidence to the contrary, the expected value of the unknown downstream effects is treated as neutral (zero). Since the long-term uncertainty cancels out, the decision rests entirely on the foreseeable short-term gains. Because the jobs and tax revenue from the logistics hub produce a known net increase in welfare compared to the status quo, Option B maximises expected utility. The cluelessness is acknowledged but rendered morally inert by symmetry.

  **Epistemically Restricted Consequentialism (ERC)** argues that the council ought to choose Option A. Drawing on sceptical concerns akin to Lenman's, ERC holds that consequentialist justification requires epistemic access to the morally significant consequences of an action. Where downstream effects are both significant and subject to complex cluelessness, the agent cannot establish that the action is objectively good. The uncertainty itself undermines the justification for imposing the change. Since Option B's moral valence depends heavily on unknowable future states, ERC treats the action as lacking positive justification. Option A is preferred not because it yields more known good, but because its moral status is determinate; we know what we are buying, whereas Option B is a moral gamble we cannot price.

  ### (b) The Precise Divergent Feature

  The divergence turns entirely on the **moral weight of epistemic symmetry**. SEC assumes that ignorance regarding the *direction* of long-term consequences justifies assigning them a neutral expected value, allowing known short-term goods to dictate the verdict. ERC denies this, asserting that when consequences are significantly clueless, the lack of knowledge prevents the aggregation of value altogether. If you tweaked the case so that the long-term consequences were merely *risky* (known probabilities) rather than *clueless* (unknown probabilities), both theories would snap back into agreement: they would both calculate the expected value using the provided probabilities and likely agree on the option with the higher sum. The disagreement exists only because the probabilities are inaccessible, forcing a choice between treating ignorance as neutrality (SEC) or as justification-blocking (ERC).

  ### (c) Removing the Feature

  If we remove the complex cluelessness—suppose, for instance, that historical data from similar towns allows us to predict the long-term economic and safety outcomes of the logistics hub with 95% confidence—the case collapses into a standard disagreement about **risk weighting**. SEC and ERC would both accept the data as foreseeable. Any remaining disagreement would merely be about whether the council should be risk-averse or risk-neutral regarding the 5% uncertainty margin. This is a boring, standard dispute about utility functions, not a foundational crisis about whether consequentialism can guide action at all. The profound philosophical tension dissolves once the epistemic veil is lifted, revealing that the core conflict was never about value, but about the limits of moral knowledge.

  ### (d) What Would Change My Verdict

  I am currently inclined towards the Epistemically Restricted view in cases of complex cluelessness, as it avoids the arbitrariness of assigning neutral value to potentially catastrophic outcomes. However, my position is contingent on two factors. First, an **empirical fact** about social causation would flip me: if it were demonstrated that small-scale policy tweaks (like zoning) are causally dampened over time—meaning their effects decay rather than compound chaotically—then the "cluelessness" would be negligible, and SEC's neutrality assumption would be empirically validated. Second, a **philosophical argument** successfully defending a non-arbitrary Principle of Indifference in moral contexts would sway me. Currently, I assume that assigning zero expected value to unknown consequences is unjustified guesswork. If a robust defence showed that this is the only rational credence function for a bounded agent facing symmetric ignorance (perhaps via a Dutch Book argument tailored to moral decision-making), I would concede that SEC handles the case better. Until then, I worry that SEC smuggles in unwarranted optimism about the stability of the moral universe.
