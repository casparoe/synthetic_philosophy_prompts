  I need a case for a seminar on whether indicative and counterfactual conditionals need separate semantics. Construct a thought experiment where an indicative conditional and its counterfactual counterpart come apart in the direction people usually find harder: the indicative comes out false, the counterfactual true. Constraints: ordinary setting — a household gadget, a car, a kitchen, whatever — no lotteries, no perfect predictors, no crime conspiracies. The speaker has to be a reasonable, normally well-informed person; the false indicative shouldn't come from them being stupid or having crazy beliefs, just from ordinary misinformation if it needs to. Also, the antecedent should be a live epistemic possibility for the speaker, not something they already know didn't happen. Keep the scenario to one paragraph.

  After the scenario, do the checks. State exactly what p and q are. Then run both conditionals through a Stalnaker-style unified possible-worlds semantics: the indicative selects the closest p-world inside the speaker's context set, the counterfactual selects the closest p-world from the actual world using the similarity ordering. Show why the two verdicts diverge. Then tell me which feature of the case is doing the work, what happens if your remove that feature, and how a defender of the unified semantics would attack the case. Be honest about whether the case really shows the two conditionals need different semantics or just shows the speaker's context set is off.
