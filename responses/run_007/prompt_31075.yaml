answer: |-
  # Desiderata for an Adequate Accuracy-First Epistemology

  To evaluate any accuracy-first (veritistic) theory of epistemic rationality, one must assess whether it successfully grounds normative epistemic constraints in the fundamental goal of minimizing inaccuracy (or maximizing accuracy). The following specification outlines the necessary conditions for such a theory to be viable, distinguishing between genuine constraints required by the project's core commitments and methodological preferences specific to particular research programs (e.g., the Joyce-Pettigrew axis).

  ## 1. The Core Metric: Constraints on the Inaccuracy Measure

  The theory must specify a mathematical function $\mathfrak{I}(w, c)$ that measures the inaccuracy of a credence function $c$ at a world $w$.

  ### A. Truth-Directedness
  *   **Requirement:** The measure must be strictly truth-directed. If proposition $A$ is true, inaccuracy must decrease as $c(A)$ approaches 1. If $A$ is false, inaccuracy must decrease as $c(A)$ approaches 0.
  *   **Motivating Case:** This is the definition of "accuracy-first." If a measure allows a false belief to be scored as more accurate than a true belief (all else being equal), the theory ceases to be veritistic and becomes pragmatic or aesthetic.
  *   **Status:** **Genuine Constraint.** Without this, the project collapses into a different normative enterprise.

  ### B. Propriety (and Strict Propriety)
  *   **Requirement:** A scoring rule is *proper* if a credence function expects itself to be at least as accurate as any other credence function. It is *strictly proper* if it expects itself to be *uniquely* most accurate.
      *   Formally: For any probabilistic $c$ and any $c' \neq c$, $\sum_w c(w) \mathfrak{I}(w, c) < \sum_w c(w) \mathfrak{I}(w, c')$.
  *   **Motivating Case:** The Dominance Argument for Probabilism (Joyce 1998). To show that non-probabilistic credences are irrational, one must show they are *accuracy-dominated* by some probabilistic alternative. If the measure is not proper, a non-probabilistic agent might correctly expect their own incoherent credences to be more accurate than any coherent alternative, undermining the normative force of probabilism.
  *   **Status:** **Genuine Constraint.** Strict propriety is required to ensure that the rational minimum is unique.

  ### C. Additivity
  *   **Requirement:** The total inaccuracy of a credence function over an algebra is the sum of the inaccuracies of the credences assigned to individual propositions (usually within a partition).
      *   Formally: $\mathfrak{I}(w, c) = \sum_{A \in \mathcal{F}} \mathfrak{i}(w, c(A))$.
  *   **Motivating Case:** Mathematical tractability and the connection to Bregman divergences (Predd et al. 2009). It simplifies the dominance proofs.
  *   **Status:** **Camp Preference.** While assumed by Joyce (1998, 2009), it is challenged by Pettigrew (2016) and others. Holistic measures (where the accuracy of $c(A)$ depends on $c(B)$) are conceptually coherent. Insisting on additivity excludes viable non-additive veritistic theories without sufficient philosophical justification.

  ### D. Extensionality (Partition Independence)
  *   **Requirement:** The inaccuracy score should depend only on the truth values and the credences assigned, not on the specific linguistic description or the granularity of the partition used to calculate it. Refining a partition (e.g., splitting "Rain" into "Heavy Rain" and "Light Rain") should not arbitrarily inflate or deflate the total inaccuracy score of the original proposition.
  *   **Motivating Case:** Prevents "gerrymandering." An agent should not be able to improve their epistemic score merely by describing the world in more granular terms or by choosing a specific algebra. It prevents double-counting logical relations.
  *   **Status:** **Genuine Constraint.** Violating this makes the norm sensitive to representational choices rather than epistemic states.

  ## 2. The Agent's Perspective: Propriety vs. Immodesty

  A critical distinction must be maintained between the properties of the *measure* and the properties of the *agent*.

  ### A. The Distinction
  *   **Propriety:** A property of the **scoring rule**. It guarantees that *if* you are probabilistic, you minimize expected inaccuracy by reporting your true probabilities.
  *   **Immodesty:** A property of the **credence function**. A credence function $c$ is immodest if, given $c$, $c$ expects itself to be more accurate than any alternative $c'$.
  *   **Requirement:** The theory must vindicate the norm that rational agents ought to be immodest.
  *   **Motivating Case:** Stability. If a rational agent believed some *other* credence function would be more accurate than their own, they would be rationally required to adopt that other function (Lewis 1980). Rationality requires epistemic self-trust.
  *   **Status:** **Genuine Constraint.**

  ### B. The Dominance Argument's Dependency
  *   **Clarification:** The dominance argument for Probabilism requires the **scoring rule to be proper**, not necessarily that every actual agent is immodest. However, if the rule is proper, then any *probabilistic* agent will be immodest. The argument uses propriety to show that non-probabilistic agents are dominated; it implies that rational (probabilistic) agents will satisfy immodesty.
  *   **Status:** **Technical Necessity.** Confusing these leads to category errors in evaluating the dominance proof.

  ## 3. Diachronic Commitments

  A synchronic theory of accuracy is insufficient; it must govern belief revision.

  ### A. Vindicating Conditionalization
  *   **Requirement:** The theory must demonstrate that updating by Conditionalization minimizes expected inaccuracy from the perspective of the prior.
  *   **Motivating Case:** Greaves & Wallace (2006). If an accuracy-first theory cannot derive the standard norm of learning from evidence, it is descriptively and normatively inadequate.
  *   **Strength of Vindication:** It is not enough that Conditionalization *happens* to minimize inaccuracy. The theory must show that *minimizing expected inaccuracy* is the *reason* one should conditionalize.
  *   **Status:** **Genuine Constraint.**

  ### B. Handling New Propositions
  *   **Requirement:** The theory must account for accuracy when the algebra expands (learning new concepts), not just when probabilities shift over a fixed algebra.
  *   **Motivating Case:** Standard accuracy arguments assume a fixed $\sigma$-algebra. Real learning involves refining the space of possibilities.
  *   **Status:** **Open Challenge.** Most current theories fail here, treating it as a boundary condition rather than a core requirement.

  ## 4. Structural Constraints: Logic and Algebra

  ### A. No Double-Counting
  *   **Requirement:** When scoring an algebra containing logically related propositions (e.g., $A$, $B$, $A \wedge B$), the measure must not penalize the agent multiple times for a single error.
  *   **Motivating Case:** If inaccuracy is additive over an algebra that is not a partition, a falsehood in $A$ propagates to $A \vee B$, $A \wedge C$, etc., inflating the inaccuracy score artificially.
  *   **Status:** **Genuine Constraint.** This usually forces the theory to score over **partitions** rather than general algebras, or to employ non-additive measures.

  ### B. Algebra Neutrality
  *   **Requirement:** The normative verdict (e.g., "c is irrational") should not depend on the choice of the underlying algebra, provided the algebra is rich enough to express the agent's doxastic state.
  *   **Motivating Case:** Justification should not be an artifact of modeling choices.
  *   **Status:** **Genuine Constraint.**

  ## 5. Critical Tensions and Exclusions

  ### A. Incompatibility: Extensionality vs. Logical Complexity
  *   **The Conflict:** **Extensionality** (scores depend only on truth values) is in tension with the need to model **Logical Learning** in non-omniscient agents.
  *   **Explanation:** If a measure is extensional, it treats logically equivalent propositions ($P$ and $Q$ where $P \iff Q$) identically. However, a bounded agent may be certain of $P$ but uncertain of $Q$. An extensional accuracy measure cannot validate the rationality of updating on $Q$ without assuming the agent already knew $P \iff Q$ (Logical Omniscience).
  *   **Verdict:** To handle bounded rationality, one must relax Extensionality (allowing hyperintensional scoring). To maintain classical accuracy-first simplicity, one must accept Logical Omniscience. **These cannot be jointly satisfied in current frameworks.**

  ### B. The "Killer" Constraint: Strict Propriety
  *   **Identification:** The single requirement that excludes the most standard contenders is **Strict Propriety**.
  *   **Why:** It eliminates the **Absolute Distance** measure ($|c(A) - v(A)|$), which is intuitively appealing to many philosophers and scientists due to its simplicity and linearity. It also excludes any scoring rule that is not a Bregman Divergence (in the continuous case).
  *   **Consequence:** By insisting on Strict Propriety to save the Dominance Argument for Probabilism, accuracy-first epistemology is forced into a narrow class of mathematical functions (primarily Brier Score and Logarithmic Score), potentially distorting the philosophical concept of "accuracy" to fit the mathematical constraint.

  ## Summary Specification Table

  | Requirement | Description | Status | Motivation |
  | :--- | :--- | :--- | :--- |
  | **Truth-Directedness** | Truth is better than falsehood. | **Genuine Constraint** | Defines the project. |
  | **Strict Propriety** | Truth-telling minimizes expected score. | **Genuine Constraint** | Required for Dominance Argument. |
  | **Additivity** | Total score = sum of parts. | **Camp Preference** | Tractability (Joyce), not necessity. |
  | **Extensionality** | Score invariant to partition description. | **Genuine Constraint** | Prevents gerrymandering. |
  | **Immodesty** | Agent expects self to be optimal. | **Genuine Constraint** | Epistemic stability. |
  | **Conditionalization** | Updating minimizes expected inaccuracy. | **Genuine Constraint** | Diachronic adequacy. |
  | **Logical Omniscience** | Agents know all logical truths. | **Unwanted Consequence** | Result of Extensionality + Propriety. |

  **Final Note on Evaluation:** An adequate theory must explicitly acknowledge the trade-off between **Extensionality** and **Bounded Rationality**. If it retains Extensionality, it must admit it applies only to ideal agents. If it claims to apply to humans, it must propose a hyperintensional inaccuracy measure, which currently remains the greatest lacuna in the literature.
