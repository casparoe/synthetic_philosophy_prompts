prompt: |-
  I teach a mixed undergrad/grad seminar on risk and collective action — 16 people, one 80-minute session. Next week I want to do the unilateralist's curse, but I don't want to lecture it: I want them to walk into it themselves before I name it. Design an in-class game where each player has a private, noisy signal about whether some risky action is a good idea, and any single player can unilaterally pull the trigger on that action for the whole group. The punchline they should hit on their own is that the group ends up acting far more often then any individual would endorse, and that adding more independent deciders makes it worse, not better. Give me rules, materials, a points-based payoff scheme (no real money, and no calling it a curse until the debrief), a timeline for the 80 minutes, and a debrief that maps specific moments in the game onto the formal structure — especially the point that the group's effective threshold is the most optimistic member's threshold rather than any kind of average or vote. Also tell me what will predictably go wrong the first time I run it and how to handle each, and be honest about which feature of the curse the game can't capture and that I'll have to just say outright.

  Structure the answer as:
  1. Setup and materials (~120 words)
  2. Rules and payoffs (~300 words)
  3. Timeline for the session (~150 words)
  4. Debrief: what happened and what it maps to (~300 words)
  5. Predictable failures and fixes (~200 words)
  6. What the game can't reproduce (~150 words)
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Unilateralist's Curse (Bostrom et al.).
      *   **Context:** Mixed undergrad/grad seminar, 16 people, 80-minute session.
      *   **Goal:** Design an in-class game where students experience the curse before naming it.
      *   **Key Mechanics:** Private noisy signals, unilateral action triggers outcome for all, group acts more often than individuals would endorse, more deciders = worse outcome.
      *   **Payoff:** Points-based (no real money).
      *   **Structure:** 6 specific sections with word count constraints.
      *   **Tone:** Practical, pedagogical, honest about limitations.

  2.  **Deconstruct the Unilateralist's Curse:**
      *   *Core Idea:* When many agents can independently decide to undertake a risky initiative (based on private assessments), the initiative is undertaken if *any* agent decides to do it.
      *   *Problem:* Even if each agent is rational and requires a high threshold of evidence, the probability that *at least one* agent crosses that threshold increases with the number of agents. The group's effective threshold becomes the minimum of the individual thresholds (the most optimistic/error-prone agent), not the average.
      *   *Game Design Need:* Students need private information (signals), a decision to act or not, and a consequence that affects everyone if *anyone* acts.

  3.  **Drafting - Section by Section (monitoring word counts):**

      *   **1. Setup and materials (~120 words):**
          *   Need: Envelopes/cards, score sheet, projector.
          *   Scenario: "Project Omega" (risky tech).
          *   Signals: Draw from a deck or bag. Red/Black or High/Low numbers.
          *   Constraint: Keep it tight.
          *   *Draft:* You need 16 sealed envelopes labeled 1–16, a deck of 20 cards (10 "High Value," 10 "Low Value"), a projector for scoring, and a whiteboard. Each envelope contains one card drawn randomly from the deck. The scenario is "Project Omega": a technological intervention that yields massive benefits if the world state is "Favorable" but catastrophic losses if "Unfavorable." The true state is fixed for the round but unknown to students. They privately open envelopes to see their signal (card). No sharing signals allowed. Prepare a scoreboard to track cumulative group points across multiple rounds. Keep envelopes ready to redistribute quickly for repeated rounds.

      *   **2. Rules and payoffs (~300 words):**
          *   Mechanics: Private signal, decision to "Launch" or "Pass".
          *   Unilateralism: If *anyone* launches, everyone gets the outcome.
          *   Payoff structure: Needs to incentivize caution individually but show the collective risk.
          *   Signals: "High" suggests Favorable, "Low" suggests Unfavorable, but noisy.
          *   *Draft:* Divide the class into one group of 16. The true state (Favorable/Unfavorable) is determined by a coin flip hidden from them. Each student draws one card from their envelope. High cards are more likely in Favorable states (e.g., 80% chance), Low cards in Unfavorable states. Students privately decide: "Launch" or "Hold."
          *   *Crucial Rule:* If **any** student submits "Launch," the project launches for everyone. If all "Hold," nothing happens.
          *   *Payoffs:*
              *   No Launch: 0 points for everyone.
              *   Launch + Favorable State: +10 points for everyone.
              *   Launch + Unfavorable State: -20 points for everyone.
          *   *Individual Rationality:* Calculate expected value. If a student sees a Low card, their posterior probability of Favorable drops. They should not want to launch. But if they see High, they might.
          *   *Iteration:* Run 5 rounds. Change group sizes (split into 2 groups of 8, then 4 groups of 4) to show the effect of $N$.
          *   *Wait, word count check:* Need to expand on the logic to hit ~300. Explain the signal noise clearly. Explain the scoring.
          *   *Revision:* Divide the class into one group of 16. The true state (Favorable/Unfavorable) is determined by a hidden coin flip per round. Each student draws one card from their envelope. High cards are correlated with Favorable states (e.g., 70% chance High given Favorable, 30% given Unfavorable). Low cards vice versa. Students privately decide: "Launch" or "Hold."
          *   *Crucial Rule:* If **any** student submits "Launch," the project launches for everyone. If all "Hold," nothing happens.
          *   *Payoffs:* No Launch: 0 points. Launch + Favorable: +10 points each. Launch + Unfavorable: -20 points each.
          *   *Rational Threshold:* Given the asymmetry (-20 vs +10), a rational agent needs high confidence (>66%) to launch. A single High card might not provide enough confidence alone, encouraging caution. However, with 16 players, the probability that *at least one* person feels confident enough (or makes an error/gets a misleading High signal in a bad state) skyrockets.
          *   *Variation:* Run Round 1 with N=16. Round 2 with N=16. Then split into 2 groups of 8 (independent decisions, separate scores). Then 4 groups of 4. Compare failure rates.
          *   *Instruction:* Emphasize no communication. Collect decisions secretly via slip of paper.

      *   **3. Timeline for the session (~150 words):**
          *   0-10: Intro/Setup.
          *   10-40: Game Rounds (N=16, N=8, N=4).
          *   40-50: Tally scores/Reveal states.
          *   50-80: Debrief/Discussion.
          *   *Draft:* 0–10 min: Distribute materials, explain scenario and rules. Emphasize secrecy of signals.
          *   10–40 min: Run four rounds. Rounds 1–2: Single group of 16. Rounds 3–4: Split into two groups of 8 (parallel universes). Rounds 5–6: Four groups of 4. Collect decision slips after each.
          *   40–50 min: Reveal the hidden "True State" for each round on the projector. Calculate group scores. Ask students to estimate how many wanted to launch vs. how many actually did.
          *   50–80 min: Debrief. Connect gameplay to theory. Introduce the term "Unilateralist's Curse." Discuss real-world analogues (geoengineering, lab leaks, whistleblowing). Assign reading.

      *   **4. Debrief: what happened and what it maps to (~300 words):**
          *   Connect game moments to theory.
          *   Key insight: Group threshold = min(individual thresholds).
          *   Why N matters.
          *   *Draft:* Start by asking: "How many rounds did we lose points?" Likely, the large group launched in Unfavorable states more often than small groups. Ask a student who voted "Hold" but lost points: "Did you want to launch?" They will say no. This highlights the externality: one person's optimism imposed risk on the cautious.
          *   Map to formal structure: The "True State" is the objective value of the action. The "Cards" are private epistemic positions. The "Launch" rule is unilateral capacity.
          *   Key Lesson: The group's effective epistemic threshold is not the average confidence, but the *maximum* confidence (or minimum caution). As $N$ increases, the distribution of the maximum signal shifts. Even if every individual is rational (requiring 70% confidence), the probability that *someone* receives a misleadingly strong signal increases with $N$.
          *   Show the math simply: If $P(\text{error}) = 0.1$ per person, $P(\text{no error}) = 0.9^{16} \approx 0.18$. The group fails 82% of the time if failure depends on any single error.
          *   Connect to "epistemic humility": If you know others can act, your threshold should rise, but in the game, they couldn't coordinate. In reality, norms should replace unilateralism.
          *   Introduce the term "Unilateralist's Curse" now. It's not malice; it's structural.

      *   **5. Predictable failures and fixes (~200 words):**
          *   What goes wrong? Communication, boredom, misunderstanding payoff.
          *   *Draft:* 1. **Collusion:** Students will talk. *Fix:* Enforce silence strictly; separate groups physically for split rounds. 2. **Payoff Confusion:** They won't calculate EV. *Fix:* Pre-calculate a table showing "If you see High, your chance is X%." 3. **Apathy:** They might launch randomly. *Fix:* Make points matter (grade bonus or pizza party). 4. **The "Hero" Complex:** One student always launches. *Fix:* In debrief, highlight that person's impact without shaming. 5. **Timing:** Collecting slips takes too long. *Fix:* Use digital polling (Qualtrics/Google Forms) for instant aggregation. 6. **Small N effect:** With only 16 people, the statistical power is low. *Fix:* Run many rounds or simulate larger N in the debrief math.

      *   **6. What the game can't reproduce (~150 words):**
          *   Limitations.
          *   *Draft:* The game assumes static thresholds. In reality, agents can update on the *fact* that others haven't acted yet (dynamic modeling). The game also lacks communication channels; real unilateralists often know others exist and could theoretically coordinate norms. It doesn't capture the *moral* weight—points aren't lives. Finally, it assumes symmetric capacity; in reality, some actors have much higher capacity to act (e.g., states vs. individuals), which weights the "minimum threshold" differently. You must explicitly state that the curse relies on the inability to coordinate norms, not just the math of signals.

  4.  **Review and Refine (Word Count Check):**

