  1. Setup and materials
  You need 16 sealed envelopes, a deck of cards (10 "High," 10 "Low"), a projector, and whiteboard. Each envelope contains one card. The scenario is "Project Omega": yields benefits if "Favorable," losses if "Unfavorable." The true state is fixed per round, unknown to students. They privately open envelopes to see their signal. No sharing signals. Prepare a scoreboard for cumulative points. Keep envelopes ready for redistribution. Ensure a mechanism for secret voting (slips or digital poll). The goal is to maximize group points without triggering a catastrophe. Random distribution ensures signal independence required to simulate the epistemic conditions.

  2. Rules and payoffs
  Divide the class into one group of 16. The true state (Favorable/Unfavorable) is determined by a hidden coin flip per round. Each student draws one card. High cards are correlated with Favorable states (e.g., 75% chance High given Favorable, 25% given Unfavorable). Low cards vice versa. Students privately decide: "Launch" or "Hold."
  Crucial Rule: If **any** student submits "Launch," the project launches for everyone. If all "Hold," nothing happens.
  Payoffs: No Launch: 0 points. Launch + Favorable: +10 points each. Launch + Unfavorable: -30 points each.
  Rational Threshold: Given the asymmetry (-30 vs +10), a rational agent needs >75% confidence to launch. A single High card provides exactly 75% confidence (borderline). Many will hesitate. However, with 16 players, the probability that *at least one* person receives a misleading High signal in an Unfavorable round skyrockets.
  Variation: Run Round 1 with N=16. Then split into 2 groups of 8, then 4 groups of 4. Compare failure rates. Emphasize no communication. Collect decisions secretly. Points accumulate toward a class reward (e.g., pizza). Remind them that their individual payoff depends entirely on the group outcome, creating a common pool resource problem. The asymmetry is key: losses hurt three times more than gains help, enforcing caution. Use a Google Form for voting to ensure anonymity and speed. This prevents peer pressure from influencing the decision to hold. The variation isolates the variable of group size N, allowing direct comparison of failure rates across different collective structures. Ensure students understand that a single 'Launch' vote overrides all 'Hold' votes instantly.

  3. Timeline for the session
  0–10 min: Distribute materials, explain scenario and rules. Emphasize secrecy of signals.
  10–40 min: Run four rounds. Rounds 1–2: Single group of 16. Rounds 3–4: Split into two groups of 8 (parallel universes). Rounds 5–6: Four groups of 4. Collect decision slips after each.
  40–50 min: Reveal the hidden "True State" for each round on the projector. Calculate group scores. Ask students to estimate how many wanted to launch vs. how many actually did.
  50–80 min: Debrief. Connect gameplay to theory. Introduce the term "Unilateralist's Curse." Discuss real-world analogues (geoengineering, lab leaks, whistleblowing). Assign reading. Ensure you leave buffer time for technical issues during voting. The debrief is the most critical component; do not rush it.

  4. Debrief: what happened and what it maps to
  Start by asking: "How many rounds did we lose points?" Likely, the large group launched in Unfavorable states more often than small groups. Ask a student who voted "Hold" but lost points: "Did you want to launch?" They will say no. This highlights the externality: one person's optimism imposed risk on the cautious.
  Map to formal structure: The "True State" is the objective value of the action. The "Cards" are private epistemic positions. The "Launch" rule is unilateral capacity.
  Key Lesson: The group's effective epistemic threshold is not the average confidence, but the *maximum* confidence (or minimum caution). As $N$ increases, the distribution of the maximum signal shifts. Even if every individual is rational (requiring 75% confidence), the probability that *someone* receives a misleadingly strong signal increases with $N$.
  Show the math simply: If $P(\text{false positive}) = 0.25$ per person, $P(\text{no false positive}) = 0.75^{16} \approx 0.01$. The group fails 99% of the time if failure depends on any single error.
  Connect to "epistemic humility": If you know others can act, your threshold should rise, but in the game, they couldn't coordinate. In reality, norms should replace unilateralism.
  Introduce the term "Unilateralist's Curse" now. It's not malice; it's structural. Visualize the 'minimum threshold' concept on the board to cement the theoretical takeaway.

  5. Predictable failures and fixes
  1. **Collusion:** Students will talk. *Fix:* Enforce silence strictly; separate groups physically for split rounds.
  2. **Payoff Confusion:** They won't calculate EV. *Fix:* Pre-calculate a table showing "If you see High, your chance is X%."
  3. **Apathy:** They might launch randomly. *Fix:* Make points matter (grade bonus or pizza party).
  4. **The "Hero" Complex:** One student always launches. *Fix:* In debrief, highlight that person's impact without shaming.
  5. **Timing:** Collecting slips takes too long. *Fix:* Use digital polling (Qualtrics/Google Forms) for instant aggregation.
  6. **Small N effect:** With only 16 people, the statistical power is low. *Fix:* Run many rounds or simulate larger N in the debrief math.
  7. **Signal Distrust:** They might think the deck is rigged. *Fix:* Show the deck shuffle openly. This ensures they trust the probabilistic structure underlying the game mechanics.

  6. What the game can't reproduce
  The game assumes static thresholds. In reality, agents can update on the *fact* that others haven't acted yet (dynamic modeling). The game also lacks communication channels; real unilateralists often know others exist and could theoretically coordinate norms. It doesn't capture the *moral* weight—points aren't lives. Finally, it assumes symmetric capacity; in reality, some actors have much higher capacity to act (e.g., states vs. individuals), which weights the "minimum threshold" differently. You must explicitly state that the curse relies on the inability to coordinate norms, not just the math of signals. Acknowledge this gap to prevent oversimplification of real-world policy dilemmas.
