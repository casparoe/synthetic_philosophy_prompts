      *Refinement:* Make sure the signal noise is defined. High Card = 60% chance of Good State. Low Card = 60% chance of Bad State. Payoff: Good = +10, Bad = -30. Individual EV with High Card: $0.6(10) + 0.4(-30) = 6 - 12 = -6$. Wait, if EV is negative even with a High card, no one should ever launch. That's too strict.
      *Adjustment:* Good = +100, Bad = -100. Prior 50/50. Signal accuracy 75%.
      *Posterior with High Signal:* $P(Good|High) = \frac{0.75 \times 0.5}{0.75 \times 0.5 + 0.25 \times 0.5} = 0.75$.
      *EV:* $0.75(100) + 0.25(-100) = 50$. Positive. So individuals *should* launch on High.
      *Wait, the curse is about acting when the group shouldn't.*
      *Better Setup:* The group should act only if *consensus* is high, but individuals act on private signal.
      *Actually, the standard Bostrom model:* Each agent thinks "I should do this" based on their signal. If *any* do it, it happens. The problem is that in a "Bad" state, some agents will still get "High" signals (false positives). With enough agents, a false positive is guaranteed.
      *So:* Payoff needs to be negative in expectation for the *group* in a Bad state, but positive for an individual with a High signal.
      *Let's simplify for the game description to save words.* "High confidence suggests benefit, but noise means false positives occur."

