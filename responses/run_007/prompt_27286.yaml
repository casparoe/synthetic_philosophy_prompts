          *   *Assessment:* N's analogy is the standard defense (MacAskill et al.). M's objection is the standard critique (Hedden, Gracely, etc.). N is right about the *structural* rationality argument, but M is right that the *metaphysical/semantic* precondition (common scale) is missing.

