      *   **Friend's Position:** Death isn't bad because it's symmetric to pre-birth nonexistence (which wasn't bad). Therefore, fearing death is irrational (Epicurean conclusion).
      *   **User's Position:** Skeptical of the symmetry. Suspects the analogy breaks down.
      *   **Task:**
          1.  Lay out the mapping (what corresponds to what).
          2.  Identify where the symmetry breaks down (disanalogies).
          3.  Evaluate whether the conclusion (death isn't a harm) survives these disanalogies.
          4.  Focus on both obvious and *subtle* disanalogies (user's specific interest).

  2.  **Deconstruct the Lucretian Symmetry Argument:**
      *   *Premise 1:* Posthumous nonexistence (after death) is a state of not existing.
      *   *Premise 2:* Prenatal nonexistence (before birth) is a state of not existing.
      *   *Premise 3:* Prenatal nonexistence is not bad for the person (we don't mourn it, fear it, or feel deprived by it).
