prompt: |-
  my friend keeps saying death can't be bad for you because it's exactly like the time before you were born — you didn't exist for billions of years before that and it never bothered you, so why would the billions after be any different? he uses this symmetry to argue that fearing death is irrational and that epicurus was basically right. i know this is the lucretian argument but i'm not convinced the two sides of the analogy actually work the same way. can you lay out what maps onto what between prenatal and posthumous nonexistence, where the symmetry breaks down, and whether his conclusion — that death isn't a harm — survives once the disanalogies are on the table? i'm especially interested in whether the disanalogies that matter for the argument are the obvious ones or the subtle ones.
reasoning: |-
