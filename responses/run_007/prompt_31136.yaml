answer: |-
  **Title:** The Epistemic Threshold: Distinguishing Live Possibilities from Artefactual Noise in High-Stakes Decision Theory

  **Introduction**

  Expected Value Maximisation (EVM) is the orthodox framework for rational choice under uncertainty. It dictates that agents should choose the option with the highest sum of probability-weighted utilities. However, this framework faces a severe challenge known as 'fanaticism'. If utility is unbounded, then a sufficiently enormous payoff can outweigh any cost, provided its probability is non-zero. This leads to counterintuitive verdicts, such as sacrificing certain moderate goods for a microscopic chance at infinite value, a problem exemplified by Pascal's Mugging.

  The standard literature treats this as a problem of aggregation or utility measurement. Proposed solutions typically involve bounding the utility function, discounting probabilities below a certain threshold, or biting the bullet and accepting the fanatical verdicts. However, these approaches share a common weakness: they accept the probability assignments themselves as given. They assume that if an agent can articulate a number, however speculative, it enters the calculation.

  My proposed research shifts the locus of the debate upstream. The core issue is not how to calculate expected value when faced with extreme stakes, but rather which probability assignments warrant inclusion in the calculation at all. In scientific modelling and everyday reasoning, we routinely dismiss certain possibilities not because their probability is calculated to be low, but because they are deemed artefacts of a model, speculative fiction, or epistemically inaccessible. The central intuition driving this project is that fanaticism arises only when we treat 'model noise' as 'live possibility'. A robust decision theory requires an epistemic filter that distinguishes decision-relevant hypotheses from artefactual ones before the expected value calculation begins.

  **Research Question**

  The primary research question is: **Can a principled epistemic criterion be established that distinguishes decision-relevant low-probability hypotheses from artefactual noise, thereby resolving the fanaticism dilemma without ad hoc discounting?**

  This question is precise enough to admit a determinate answer. The project will succeed if it can either: (1) formulate a set of necessary and sufficient conditions for a hypothesis to count as a 'live possibility' in decision-theoretic contexts, which successfully excludes fanatical cases while retaining intuitive high-stakes cases (such as existential risk mitigation); or (2) prove that no such epistemic criterion exists without collapsing into scepticism or circularity.

  Both outcomes are philosophically substantive. A positive result provides a new foundation for rational choice theory that avoids the pitfalls of bounded utility. A negative result demonstrates that the fanaticism problem is intractable within standard epistemological frameworks, forcing a revision of EVM itself. The determinacy lies in the clarity of the criteria proposed or the rigor of the impossibility proof.

  **Critique of Existing Positions**

  To justify this approach, one must demonstrate why current solutions are insufficient. The literature generally offers three responses to fanaticism, all of which fail to address the input problem.

  First, the 'unbounded utility' position accepts the fanatical verdicts. Proponents argue that rationality requires consistency, even when it demands counterintuitive sacrifices. This view is increasingly untenable because it renders agents vulnerable to exploitation by any agent who can conjure a sufficiently large payoff claim. It treats all non-zero probabilities as equipotent regarding decision-relevance, ignoring the qualitative difference between a calculated risk (e.g., a lottery ticket) and a speculative metaphysical claim (e.g., a mugger promising to simulate trillions of lives).

  Second, the 'bounded utility' approach caps the maximum value any outcome can possess. While this mathematically prevents fanaticism, it introduces severe theoretical costs. It violates the principle of dominance and implies that there is some amount of suffering or death that is not worse than a slightly smaller amount, provided the probability is low enough. This solves the mathematical problem by altering the value theory, leaving the epistemic question untouched. It does not explain why we should distrust the probability assignment; it merely ensures the assignment cannot dominate the sum.

  Third, 'probability discounting' suggests ignoring probabilities below a certain threshold (e.g., 1 in 10^100). This is the most common pragmatic response but lacks principled justification. Where is the threshold set? Why is 1 in 10^100 irrelevant while 1 in 10^99 is relevant? This arbitrariness suggests the solution is ad hoc. Furthermore, like bounded utility, it treats the probability number as valid but negligible, rather than questioning whether the number represents a genuine cognitive state or merely linguistic artefact.

  None of these positions address the prior epistemic question: under what conditions is an agent justified in assigning a precise probability to a hypothesis that lacks empirical grounding? By treating the probability assignment as the problem, rather than the utility or the aggregation function, this project avoids the theoretical costs of bounding utility and the arbitrariness of discounting. It seeks to ground the exclusion of fanatical cases in the norms of belief formation rather than the mechanics of choice.

  **Research Plan and Methodology**

  The project will be conducted over three years, combining formal decision theory with epistemological analysis.

  *Months 1–6:* **Literature Review and Formalisation.**
  I will map the existing landscape of fanaticism debates, focusing on the implicit epistemic assumptions in works by Beckstead, Thorpe, and Smith. Simultaneously, I will formalise the concept of a 'live possibility'. This involves reviewing literature on epistemic modality and confirmation theory to identify existing criteria for hypothesis viability. The output will be a working paper defining 'decision-relevant probability'.

  *Months 7–12:* **Developing the Epistemic Criterion.**
  I will draft the core theoretical framework. This will involve testing candidate criteria against standard thought experiments. For instance, does a 'requirement for empirical grounding' exclude Pascal's Mugging while permitting concern for asteroid impacts? I will engage with formal epistemology to ensure the criterion is compatible with Bayesian updating. The goal is to produce a draft chapter outlining the positive theory.

  *Months 13–18:* **Case Studies and Stress Testing.**
  The theory will be applied to concrete high-stakes domains, specifically existential risk reduction and AI safety. These fields often rely on low-probability, high-impact calculations. I will analyse whether the proposed epistemic threshold clarifies or obstructs reasoning in these fields. This phase ensures the theory is not merely abstract but has practical normative force. I will present findings at departmental seminars and one national conference.

  *Months 19–30:* **Drafting and Refinement.**
  I will write the thesis chapters, integrating the formal modelling with the philosophical argument. This period includes addressing objections regarding scepticism. If the criterion is too strict, it may rule out legitimate scientific speculation. I will refine the boundary conditions to ensure the theory does not collapse into conservatism.

  *Months 31–36:* **Final Review and Submission.**
  The final six months will be dedicated to editing, ensuring consistency, and preparing for the viva. I will seek feedback from supervisors on the coherence of the impossibility proof should the positive theory fail to materialise.

  **Feasibility and Failure Conditions**

  This project is ambitious but scoped appropriately for a PhD. It does not aim to solve all problems in decision theory, but rather to isolate and resolve the epistemic input problem. However, there are clear risks.

  The primary risk is that the concept of a 'live possibility' proves too vague to formalise. Epistemic norms are often context-dependent, and a universal threshold may be impossible to define without circularity. If, after eighteen months, I cannot articulate a criterion that is both principled and non-arbitrary, the project risks stagnation.

  To mitigate this, the proposal includes a determinate negative outcome. If I can demonstrate that no such epistemic criterion exists without violating basic norms of rationality, this constitutes a successful thesis. It would show that the fanaticism problem cannot be solved epistemically and must be addressed through value theory or structural changes to decision theory. This prevents the project from failing simply because the initial hypothesis is false.

  A second risk is scope creep. The intersection of epistemology and decision theory is vast. I will maintain focus by restricting case studies to those involving extreme stakes and low probabilities, avoiding general debates about scientific realism.

  Is this too big for a dissertation? It is borderline. A full defence of a new epistemic norm is significant work. However, by framing it specifically as a response to fanaticism, the scope is narrowed. I am not building a general epistemology, but rather a specific filter for decision-theoretic inputs. If the positive theory proves too demanding, I will scale back to a comparative analysis of existing epistemic norms, showing why they fail to handle fanaticism, which remains a valuable contribution.

  In summary, this project addresses a gap in the literature by moving the debate from calculation to justification. It offers a clear path to a determinate conclusion, whether positive or negative, and employs a realistic timeline that allows for theoretical pivots. By focusing on the status of the probability assignment itself, it promises to dissolve the fanaticism problem rather than merely managing its symptoms.
