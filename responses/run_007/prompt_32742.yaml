answer: |-
  # Seminar Handout: Individuation & The Identity of Indiscernibles
  **Pre-Reading Diagnostic: Black's Two-Sphere Universe**

  ### The Case
  Imagine a universe containing nothing but two iron spheres. They are exactly alike in every intrinsic respect: same size, mass, chemical composition, temperature, color, surface texture, everything. There is no observer, no light, no other matter. The only difference between them is that they are sitting one mile apart.

  ### Decision Tree
  *Follow the path that best matches your intuitive reaction to the case.*

  ---

  #### **START: The Count**
  **Q1: In this universe, how many distinct material objects exist?**

  *   **(A) There are really two distinct spheres.**  
      *(Go to **Path 1**)*
  *   **(B) There is really only one sphere.**  
      *(The description 'two' is a misdescription of the reality.)*  
      *(Go to **Path 2**)*

  ---

  #### **PATH 1: The "Two Spheres" Branch**
  *You accept that there are two objects. Now we must ask what makes them two.*

  **Q2: Does the fact that they occupy different locations in space explain why they are two different things?**

  *   **(A) Yes, location is what individuates them.**  
      *(Go to **Node 1.1**)*
  *   **(B) No, spatial position doesn't explain distinctness.**  
      *(Even if they were in the same spot, or if space didn't exist, they could still be two.)*  
      *(Go to **Node 1.2**)*

  **Node 1.1: The Role of Space**
  **Q3: Is space a real "container" that exists independently of the spheres, or is it just the relation between them?**

  *   **(A) Space is a real container (Absolute Space).**  
      The spheres are in different *places*, and those places are distinct entities.  
      👉 **LEAF 1: Substantivalism**  
      *(Individuation by absolute spatial location.)*
  *   **(B) Space is just the relation between them (Relational Space).**  
      They are distinct because they stand in a spatial relation to one another, but there is no "background" space.  
      👉 **LEAF 2: Relational Individuation**  
      *(Individuation by external relations.)*

  **Node 1.2: The Nature of Properties & Identity**
  **Q4: Are the spheres' properties (mass, roundness, etc.) the exact same universal "thing" shared by both, or are they different particular "copies" of that property?**

  *   **(A) Different particular copies (Tropes).**  
      Sphere 1 has *its own* roundness; Sphere 2 has *its own* roundness. They are distinct because their properties are distinct particulars.  
      👉 **LEAF 3: Trope Theory**  
      *(Individuation by particularized properties.)*
  *   **(B) The exact same universal thing.**  
      They share the very same properties. Their distinctness must come from something else.  
      *(Go to **Node 1.3**)*

  **Node 1.3: The Swap Test**
  *Imagine that while you sleep, the two spheres trade places. Sphere A moves to B's location, and B moves to A's. No other changes occur.*

  **Q5: Is the universe after the swap *different* from the universe before the swap?**

  *   **(A) Yes, it is a different state of affairs.**  
      Sphere A is now where B was. It matters *which* sphere is where.  
      👉 **LEAF 4: Haecceitism**  
      *(Objects have a primitive "thisness" beyond their qualities.)*
  *   **(B) No, it is exactly the same world.**  
      The spheres are distinct, but there is no fact of the matter about which is which. The swap changes nothing real.  
      👉 **LEAF 5: Brute Distinctness**  
      *(Distinctness is a fundamental fact with no further ground.)*

  ---

  #### **PATH 2: The "One Sphere" Branch**
  *You reject the count of two. Now we must ask why the description fails.*

  **Q6: Why is it incorrect to say there are two spheres?**

  *   **(A) Because spatial difference is not a qualitative difference.**  
      Objects are just bundles of qualities. Since the qualities are identical, the object is identical. Space doesn't add a new quality.  
      👉 **LEAF 6: Bundle Theory (PII as Necessary Truth)**  
      *(Identity of Indiscernibles is a metaphysical necessity.)*
  *   **(B) Because the scenario is linguistically or conceptually incoherent.**  
      It's not that there is "one" sphere; it's that the sentence "there are two spheres" lacks truth conditions or verification.  
      👉 **LEAF 7: Verificationism / Incoherence**  
      *(The description fails to picture a possible world.)*

  ---

  ### Instructor's Key & Logical Map
  *(For Seminar Leader Use Only)*

  #### **The Seven Positions (Leaves)**
  1.  **Substantivalism:** Space is a substance; locations individuate.
  2.  **Relational Individuation:** External relations individuate (without absolute space).
  3.  **Trope Theory:** Properties are particulars; no shared universals.
  4.  **Haecceitism:** Primitive thisness; swap creates a new possible world.
  5.  **Brute Distinctness:** Distinctness is ungrounded; swap is no change.
  6.  **Bundle Theory (PII):** Objects are bundles of universals; no two bundles can be identical.
  7.  **Verificationism:** The scenario is meaningless (e.g., no possible verification of 'twoness').

  #### **Indistinguishable Pairs & Overlaps**
  *   **Substantivalism vs. Relational Individuation:** In this specific case, both yield "Two Spheres" based on space. The tree separates them via Q3, but students may not have a pre-theoretical intuition on the nature of space itself. They may conflate "different places" with "absolute space."
  *   **Haecceitism vs. Brute Distinctness:** Both posit distinctness without qualitative ground. The Swap Test (Q5) is the standard separator, but some students may feel the swap is "different" merely verbally, not metaphysically, blurring the line between Leaf 4 and Leaf 5.
  *   **Bundle Theory vs. Verificationism:** Both end up denying "Two Spheres." Bundle Theory makes a metaphysical claim (there is one object); Verificationism makes a semantic claim (the claim 'two objects' is nonsense). In practice, students often slide between these without realizing the distinction.

  #### **Unexplored Logical Space (Missing Leaves)**
  *   **Substantival Haecceitism:** The tree forces a choice between Space (Node 1.1) and Primitive Thisness (Node 1.3). A student might believe *both* that absolute space individuates *and* that the swap creates a new world. The tree treats these as mutually exclusive explanatory grounds, but they can be cumulative.
  *   **Contingent PII:** A student might say "There are two spheres, they are indiscernible, but PII is true in *our* world, just not necessary here." This falls near Brute Distinctness but implies a modal claim the tree doesn't capture.
  *   **Perspectivalism:** The view that there are two spheres only relative to an observer (who is absent in the case). This would likely get sorted into Verificationism or Bundle Theory, though it is distinct.

  #### **Incoherent Combinations**
  *   **One Sphere + Haecceitism:** If there is only one object, primitive thisness cannot distinguish it from a duplicate (since there is no duplicate).
  *   **Two Spheres + PII (Necessary):** This is a contradiction in terms. If PII is a necessary truth, the "Two Spheres" branch cannot be taken without finding a qualitative difference (which leads to Space or Tropes).
  *   **Bundle Theory + Swap Matters:** If objects are just bundles of qualities, and qualities don't move in the swap (locations are not qualities), the swap cannot generate a difference.

  #### **Pedagogical Note**
  The tree is designed to surface *commitments* rather than *labels*. Students often arrive at **Brute Distinctness** without realizing it rejects the Principle of Sufficient Reason. Students who choose **Bundle Theory** often haven't considered the status of spatial relations. Use the "Unexplored Space" section to show them how their intuitions might combine in ways the standard -isms don't capture.
