  Your distinction is insightful but not entirely unprecedented. Kyburg originally treated the lottery as a reason to reject conjunction closure, while many treat Preface similarly. However, framing the difference as "known inconsistency" vs. "believed inconsistency" adds nuance.

  **Literature:** You must engage with David Christensen's *Putting Logic in its Place* (2004). He argues both paradoxes show that rationality doesn't require logical consistency. Also, check Richard Foley's work on epistemic utility. The point about the modal status of the negating premise (necessary truth in Lottery vs. empirical generalization in Preface) is discussed by Wheeler (2007) and Douven (2002), but your emphasis on the *awareness* of inconsistency is a fresh angle.

  **Argument Validity:** The argument mostly holds, but one premise is shaky. You claim the lottery agent "knows the inconsistency obtains." Strictly, she knows the premises *entailing* inconsistency. Unless she deduces it, she doesn't believe the contradiction explicitly. However, since the entailment is trivial, the "logical omniscience" objection applies less here than in Preface. Your stronger point is the modal status: "Some ticket wins" is necessary (given setup); "Some claim is false" is contingent.

  **Strongest Objection:** The "Unified Challenge" objection. Both paradoxes stem from the same tension: fallibilist justification + agglomeration principle. If you solve Preface by rejecting agglomeration (you can believe P and believe Q but not P&Q), you solve Lottery. If you solve Lottery by saying high probability isn't sufficient for belief, you solve Preface. Treating them separately risks ad hocery. A robust theory should explain why the same norm (consistency/closure) fails in both cases, even if the trigger differs. Furthermore, the Preface author *could* know the inconsistency if she conjoined her beliefs; the difference is often psychological, not purely structural. The normative pressure—to avoid inconsistent beliefs—is identical in both cases.

  **Verdict:** The approach is promising, especially for critiquing threshold views. Don't claim they are *unrelated*, but rather that the Lottery is the "hard case" that tests solutions derived from the Preface. Refine the "knowledge" claim to "knowledge of the entailing premises." This deserves development.
