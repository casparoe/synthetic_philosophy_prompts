answer: |-
  This is a remarkably sharp observation. You have identified a friction point where legal pragmatism collides with the philosophy of language. The tension you perceive between the "stipulative" power of the trademark grant and the "democratic" power of genericide is real, but its philosophical implications are slightly different than they first appear.

  To answer your specific questions: The doctrine of genericide does not presuppose Putnam-style physical externalism, but it does strongly commit the legal system to a form of **social externalism** (closer to Tyler Burge or the later Wittgenstein). Furthermore, the apparent inconsistency in trademark law (intentionalism at the start, externalism at the end) is largely illusory; the law is actually externalist all the way down, driven by a functionalist goal of preventing consumer confusion.

  Here is a breakdown of how genericide lands relative to semantic theory.

  ### 1. The Initial Grant is Not Pure Intentionalism
  Your analysis suggests that the initial grant of a trademark presupposes that a corporate entity can stipulate meaning ("'Kleenex' means our product, and that's that"). Legally, this is not quite accurate.

  A company cannot simply stipulate a trademark. If I try to trademark the word "Apple" for actual apples, the USPTO will reject it as "generic." If I try to trademark "Soft" for tissues, it will be rejected as "merely descriptive." To get a trademark, a term must be **distinctive**.
  *   **Arbitrary/Fanciful marks** (Kodak, Exxon) are protected immediately.
  *   **Descriptive marks** (Sharp for TVs) are only protected if they acquire **"secondary meaning."**

  "Secondary meaning" is a legal term of art that translates almost perfectly to **social externalism**. It means the public has come to associate the descriptive term with a specific source *despite* its literal meaning. Even at the moment of the initial grant, the law is not asking, "What does the company intend this word to mean?" It is asking, "What does the purchasing public *actually understand* this word to signify?"

  Therefore, the law does not start with intentionalism and switch to externalism. It is externalist from the outset. The "stipulation" you perceive is actually the law recognizing that, at Time A, the public perceives the term as a source-identifier. Genericide is simply the recognition that at Time B, the public perception has shifted.

  ### 2. Putnam vs. Burge: Which Externalism?
  You asked if this is the same externalism as Putnam's Twin Earth argument. It is not, though they are cousins.

  *   **Putnam's Externalism (Causal/Physical):** Meaning is determined by the causal connection between the word and the physical stuff in the world (H2O vs. XYZ). The "experts" (chemists) determine the extension.
  *   **Trademark Externalism (Social/Conventional):** Meaning is determined by the collective psychological state of the relevant consumer community. There is no "hidden microstructure" of a Kleenex that determines its name.

  A better philosophical fit for genericide is **Tyler Burge's Social Externalism** (from his famous "Arthritis" thought experiment). Burge argues that an individual's mental content is determined by the linguistic norms of their community. If I say, "I have arthritis in my thigh," I am wrong about what I mean, not because of physics, but because the *community* fixes the meaning of "arthritis" as an inflammation of the joints.

  In genericide, the company is in the position of Burge's patient. The company says, "Velcro means our brand." The court replies, "You are wrong about what you mean, because the community fixes the meaning of 'Velcro' as hook-and-loop fasteners." The meaning is outside the head of the stipulator; it resides in the social practice of the users.

  It also aligns with **Wittgenstein's "Meaning as Use."** The law explicitly investigates how the word is used in sentences. If consumers say, "Hand me a xerox" (regardless of the machine's brand), the *use* dictates the meaning, overriding the origin.

  ### 3. Does it Rule Out Speaker Intention?
  Yes. In the context of trademark validity, the law explicitly rejects a Gricean intentionalist theory of meaning.

  Paul Grice argued that meaning is fundamentally about what a speaker intends to induce in a listener. Trademark law acknowledges intention (you must intend to use the mark in commerce), but it makes **listener reception** the sole arbiter of validity.
  *   If the company intends "Thermos" to mean "Brand A Vacuum Flask," but the listeners understand "Thermos" to mean "Any Vacuum Flask," the listeners win.
  *   The legal standard is the **"Primary Significance Test"** (codified in the Lanham Act). The court asks: What is the primary significance of the term to the *relevant public*?

  This creates a hierarchy where the **interpreter's uptake** trumps the **speaker's intent**. This is a decisive rejection of the idea that meaning is fully determined by the original stipulator.

  ### 4. Is There a Genuine Inconsistency?
  You asked if this creates an inconsistency within trademark law, since the initial grant seems to presuppose intentionalism.

  As noted in point #1, there is no legal inconsistency because the standard is consistent: **Consumer Perception.**
  *   **Time A (Grant):** Does the public perceive this as a brand? Yes → Trademark granted.
  *   **Time B (Genericide):** Does the public perceive this as a brand? No → Trademark lost.

  The *company's* theory of meaning might be inconsistent (they think they own the word forever), but the *law's* theory of meaning is stable. It is a **functionalist pragmatism**. The law does not care about metaphysical truth; it cares about **market confusion**.
  *   If the public thinks "Aspirin" is a brand, allowing Bayer to keep the trademark prevents confusion.
  *   If the public thinks "Aspirin" is the drug itself, enforcing the trademark *creates* confusion (by preventing competitors from accurately describing their product).

  So, the law isn't switching philosophical horses; it is consistently applying a "Consumer Confusion" metric that happens to align with social externalism.

  ### 5. Is the Practice Philosophically Underdetermined?
  Could a different theory of meaning license the same practice?

  An **Intentionalist** could try to justify genericide by arguing: "The company implicitly intends the meaning to shift if they fail to police it." But this is a stretch. Companies like Velcro IP Holdings *do* police it vigorously (running ads saying "It's Velcro® brand fasteners, not velcro"), yet they can still lose if the public ignores them. This proves the meaning is not in the company's intention.

  A **Descriptivist** (in the Fregean sense) might argue the "sense" of the word changed. But legal genericide isn't about the sense (definition); it's about the reference (source identification).

  Therefore, the practice is **not entirely underdetermined**. While the law doesn't cite Wittgenstein or Burge in its opinions, the *mechanism* of genericide is structurally incompatible with strong intentionalism or internalism. You cannot have a doctrine where "public usage overrides owner intent" without committing to the view that meaning is, at least in part, a social fact external to the original speaker.

  ### Summary
  The doctrine of genericide commits the legal system to a **Social Externalist** theory of meaning.
  1.  **It is not Putnamian:** It relies on social consensus, not physical microstructure.
  2.  **It is Burgean/Wittgensteinian:** Meaning is fixed by community norms and usage, not individual mental states.
  3.  **It rejects Intentionalism:** The speaker's (company's) intent is subordinate to the listener's (public's) uptake.
  4.  **It is not inconsistent:** The law applies the same externalist standard (public perception) at the grant phase and the revocation phase.

  The law treats language as a public utility rather than private property. You can rent a spot in the public lexicon (the trademark), but if the public decides to reclaim that land for general use (genericide), your lease is up. The "owner" never truly owned the meaning; they only owned the exclusive right to a specific *perception* held by others. Once that perception changes, the right evaporates.
