      *   *Thesis 2 (The Psychological Claim):* It is possible to derive aesthetic pleasure from the work despite knowledge of the artist's immorality.
          *   *Status:* Obviously True (empirically, people do this).
      *   *Thesis 3 (The Economic Claim):* Engaging with the work does not materially empower the artist.
          *   *Status:* Probably False (usually royalties, status, or cultural capital flow back).
      *   *Thesis 4 (The Ethical Claim):* The moral value of the art is independent of the moral character of the artist.
