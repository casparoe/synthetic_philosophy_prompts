      *   **Deep Dive into Premise (4):** Explain why counterfactuals matter. The "idle" claim fails because goal architecture predicts behavior under *intervention* and *distributional shift*, not just baseline optimization.
      *   **Deep Dive into Premise (3):** Explain that IC is about *subgoals*, not *terminal behavior*. Divergence happens at the "leaf nodes" of the plan.
      *   **Reframing OT:** OT isn't for predicting *what* an AI does (IC does that), but for predicting *what we can assume* about its motivations (i.e., nothing).
      *   **Strategic Advice:** How to use this in the thesis. Don't discard OT. Refine the relationship between OT, IC, and *Motivation Uncertainty*.
