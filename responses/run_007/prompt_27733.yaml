  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Wait, is the user right that OT is "idle"?* If we can't distinguish goals, does it matter what the goal is? Yes, because we want to *set* the goal. OT says we *can* set it (it's not fixed by intelligence), but IC says whatever we set, it will look power-seeking initially. The risk is we set the wrong one, and the power-seeking locks it in.
