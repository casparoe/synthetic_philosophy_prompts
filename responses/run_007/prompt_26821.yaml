          *   *Weakness:* Still leaves the definition of "aesthetic" very broad, potentially swallowing all ethical judgment.

  3.  **Evaluate Specific Claims (Who is right about what?):**

      *   *Marco is right about:* The physical artifact doesn't change. Formal qualities exist independently of knowledge. We need to guard against reducing art *solely* to morality.
      *   *Lian is right about:* Art reception is contextual. Moral knowledge can reveal thematic hypocrisies or depths previously unseen. The "experience" is a valid part of aesthetic value for many theories.
      *   *Marco is wrong about:* The idea that psychological response is irrelevant to aesthetic judgment. The analogy of the "sad story" is flawed.
      *   *Lian is wrong about:* The implication that the work *itself* changes ontologically. The risk of conflating the quality of the *object* with the quality of the *engagement*.

