      *   *Premise (1):* Deception requires intention + knowledge of falsity. (Interpersonal model).
      *   *Premise (2):* Self-deception = Deceiver = Deceived.
      *   *Premise (3):* Inference from 1 & 2.
      *   *Premise (4):* Psychological impossibility (Knowing $\neg p$ vs. Believing $p$).
