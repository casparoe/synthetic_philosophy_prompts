prompt: |-
  I was arguing with my friend Marco for like three hours last night about free will, and he kept bringing up this stupid wasp — the Sphex, the one Dennett talks about. You know the deal: the wasp does this whole elaborate routine of dragging a paralyzed cricket to its burrow, going inside to inspect the burrow, coming back out, dragging the cricket a bit further — and if some jerk experimenter moves the cricket a few inches while the wasp is inside, the wasp just redoes the inspection step from scratch, and you can loop it indefinitely. Marco's point was that we're basically the same thing with more steps and a bigger brain, and the feeling of choosing is just the inner glow of a fancier algorithm that's equally rigid if you zoom out far enough. I pushed back, but honestly I couldnt give him a clean account of what the difference actually is, or even what a difference would have to look like.

  So here's what I want. Before I go back to this argument, I want the desiderata. What does a theory of free will — or flexibility, or agency, whatever you want to call the thing we might have that the Sphex doesnt — actually need to deliver? What cases does it need to get right? What distinctions can't it collapse (like the difference between behavioral flexibility and genuine choice, if there even is one)? What empirical facts from biology or psychology does it have to respect, and which ones can it legitimately reinterpret or explain away? And here's the part I really want: which of these requirements are genuine desiderata and which are just one camp's preferences dressed up as neutral constraints? Are there any pairs of requirements that can't be jointly satisfied — that's the thing that would actually settle whether Marco and I are even having the same argument or talking past each other. If you want to score compatibilism, libertarianism, and the no-free-will position against the list briefly, that's fine, but the list is what I need.
