answer: |-
  **The Proxy Stress Test**

  This procedure operationalizes Goodhart's Law for model review. It proceeds sequentially. A "No" answer stops the process unless marked as a hand-off.

  **Step 1: The Causal Link**
  *Question:* Does improving this metric mechanically improve the true business goal, or is it merely correlated?
  *Sufficient Answer:* Evidence demonstrates that moving the metric moves the goal across all current segments. Correlation alone is insufficient.
  *Action:* If **No**, **Stop**. Reject the metric. It is a vanity measure.

  **Step 2: The Gaming Vector**
  *Question:* Can an agent (human or model) improve the metric without improving the goal?
  *Sufficient Answer:* No known method exists to decouple the metric from the goal within the system's access rights.
  *Action:* If **No**, **Hand-off**. This is a risk acceptance decision. Escalate to the Conduct Committee. They must decide if the control environment can prevent gaming.

  **Step 3: The Pressure Boundary**
  *Question:* If the target is exceeded by 20%, does system behavior remain ethical and stable?
  *Sufficient Answer:* Simulation or stress testing shows no degradation in customer outcomes (e.g., no surge in complaints or denials).
  *Action:* If **No**, **Stop**. The metric creates perverse incentives under pressure.

  **Step 4: Distribution Shift**
  *Question:* Will the metric remain valid if data patterns change (e.g., economic downturn, new fraud typology)?
  *Sufficient Answer:* The metric relies on causal mechanisms, not static historical correlations.
  *Action:* If **No**, **Stop**. The metric will drift.

  **Step 5: Value Alignment**
  *Question:* Does optimizing this metric conflict with stated fairness or conduct values?
  *Sufficient Answer:* No conflict exists.
  *Action:* If **No**, **Hand-off**. This is a values judgment. The Product Owner cannot sign off alone; the Conduct Committee must approve the trade-off.

  ***

  **Worked Cases**

  **Case 1: Fraud-Detection Model**
  *Proposal:* Reward function is the number of confirmed fraud cases flagged each month.
  1.  *Causal Link:* Yes. Catching fraud reduces loss. (Pass)
  2.  *Gaming Vector:* **No.** Investigators can ignore complex fraud cases that are hard to prove and pursue only easy targets. They may also pressure claimants into confessions to secure a "confirmation" without actual fraud. (Fail)
  3.  *Action:* **Hand-off / Reject.**
  *Outcome:* The procedure recommends rejection. The business will not like this; it invalidates their primary incentive structure. The metric incentivizes volume of convictions over loss prevention.

  **Case 2: Claims-Handling System**
  *Proposal:* Performance target is minimize average settlement amount per claim.
  1.  *Causal Link:* Yes. Lower settlements reduce immediate outflow. (Pass)
  2.  *Gaming Vector:* **No.** Adjusters can deny valid small claims to lower the average, leaving only large, unavoidable claims in the denominator. (Fail)
  3.  *Action:* **Hand-off.**
  *Outcome:* Escalated to Conduct Committee. While factual gaming is possible, the Committee must decide if the cost savings justify the reputational risk of wrongful denials. The procedure forces them to own the value judgment.

  ***

  **Limitations**

  This procedure cannot guarantee safety. It relies on the reviewers' ability to imagine gaming strategies; novel adversarial tactics may escape Step 2. It cannot replace ethical judgment; Step 5 explicitly hands values to humans. It cannot predict external regulatory changes that might redefine the "goal" overnight. Finally, it assumes the team has the data to answer Step 1 and Step 3; without robust stress testing, the procedure degrades to a checklist exercise. It is a guardrail, not a brake.
