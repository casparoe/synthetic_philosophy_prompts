      *   **Self-Locating Uncertainty (Vaidman, Sebens-Carroll - SLU):**
          *   *Core Idea:* Probability arises from indexical ignorance. After branching but before observation, there are multiple copies of "me." I don't know which one I am.
          *   *Mechanism:* Apply principles of indifference (or modified versions like ESP - Epistemic Separability Principle) to distribute credence over branches.
