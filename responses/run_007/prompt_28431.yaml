answer: |-
  Dear friend,

  It is entirely understandable that your molecular biologist colleague found your deflationary view perverse, for in the daily practice of biology, treating DNA as a mere causal template rather than a code feels like trying to do chemistry without atoms. However, your philosophical caution is well-placed, as the move from causal correlation to semantic content is where many naturalistic accounts stumble. You asked for a map of the position's exposure rather than a balanced debate, so I will focus squarely on where the deflationary view is most vulnerable, what would genuinely threaten it, and whether your suspicion about the cell as an interpreter is a residue of metaphor or a glimpse of something real.

  The most decisive feature of the genetic system that counts against the deflationary view is the arbitrariness of the codon-amino acid assignments. If the relationship between a triplet like UUU and phenylalanine were determined by strict chemical affinity, the deflationist could comfortably argue that this is just lock-and-key causality, no different than a enzyme binding a substrate. But the code is largely arbitrary, a frozen accident stabilized by history. For the deflationist, this arbitrariness must be explained away as historical contingency that merely looks like convention. The exposure here is that if the arbitrariness is maintained against physical drift in a way that implies a system-wide constraint rather than just local chemical stability, the view strains. A fatal empirical finding for your position would be evidence that the cell actively maintains the mapping rules independently of the immediate survival value of the proteins produced, essentially treating the code itself as an object of preservation rather than just the physiological outcomes. If we found that organisms expend energy specifically to preserve the syntactic integrity of the code even when the semantic output is irrelevant to immediate fitness, that would suggest the system treats the code as a code. Currently, the deflationist can dismiss this by saying the code is preserved because changing it is catastrophically disruptive to causality, but if synthetic biology shows that the code can be swapped with negligible fitness cost yet the natural system refuses to drift, that suggests a normative commitment to the rule itself, which smells strongly of semantics.

  This leads directly to your suspicion about the cell as an interpreter. You asked whether this is well-founded or just a metaphorical residue, and I believe this is the hinge upon which your view turns. The deflationary view must characterize the ribosome and aminoacyl-tRNA synthetases as mere transducers, complex machines that convert one physical state into another. The rival view sees them as interpreters because they mediate a relationship that involves normativity; a tRNA can be charged incorrectly, and the system has proofreading mechanisms to reject the error. The deflationist must reduce this error to functional failure, but the exposure is that biological error correction often looks distinct from mere mechanical breakdown. A machine breaks when a part snaps; a code is misread when the mapping rule is violated despite the machinery being intact. If you cannot distinguish between a mutation caused by radiation damaging the DNA mechanism and a mutation caused by a misreading of the rule without invoking the rule itself, you are forced to admit a semantic layer. The view is insulated only if you insist that all normativity reduces to survival statistics, but this is a high price to pay. If you concede that biological function generates genuine norms, you risk collapsing into a teleosemantic view where information is substantive after all. Therefore, the claim that the cell is an interpreter is not merely a metaphor if you accept that natural selection grounds genuine normativity, but it remains a metaphor if you demand consciousness or intention for true interpretation. Your view is exposed here because it must argue that normativity is an illusion of the observer, which is a hard sell given the precision of biological error correction.

  Regarding the other features you mentioned, such as reading frames and alternative splicing, these are awkward for the deflationist but not fatal. They demonstrate context-dependence, which looks like syntax, but the deflationist can argue this is just complex causal conditioning. However, synthetic biology presents a sharper challenge. The fact that we can recode bacterial genomes and produce viable organisms shows that the physical substrate is separable from the informational mapping. For the substantive view, this is proof of the code's reality; for the deflationist, it is proof of causal modularity. The liability for your view is that it struggles to explain why this modularity exists without implicitly relying on the concept of information. If DNA were just a causal template, changing the template should change the cause directly, but recoding shows that the causal power lies in the relationship, not the specific chemistry. If the deflationary view cannot explain the success of information-theoretic models in predicting evolutionary outcomes where mechanistic models are too complex, it loses explanatory ground. The rival view does better here because it allows biologists to treat the genome as a variable independent of its physical instantiation, which is heuristically powerful. Your view must explain away this success as a lucky shorthand, which risks making the deflationary position look like it is denying useful ontology merely to preserve philosophical purity.

  This brings us to the charge that your view has insulated itself by demanding too much of the notions of code and information. I think this is a genuine liability. If you define semantic information so narrowly that it requires Gricean intentions or human-like consciousness, you are safe from refutation but irrelevant to biology. This is a problem because it renders the philosophical distinction useless for understanding the natural world. A legitimate sharpening of the question would acknowledge that if nature produces systems that behave exactly like information processors, distinguish error from success, and maintain arbitrary conventions, then calling that information is not a metaphor but a recognition of functional reality. The deflationary view should claim predictive advantage only in cases where information-talk leads to mysticism or dualism, such as suggesting DNA contains a homunculus or a vital force. It wins when it reminds us that DNA does not know what it is coding for. However, the rival view does better when explaining the evolution of complexity, where the accumulation of information is a measurable quantity distinct from energy or matter. If your position only explains away the other side's evidence by reducing it to causality without offering a better account of why biological systems are uniquely sensitive to syntactic structure, it becomes a negative thesis that lacks positive traction.

  To answer your question about what would change your mind, you should look for a worked-out account of naturalized semantics that does not rely on human intention. If a theory can demonstrate how physical systems can generate genuine truth conditions or normative standards through evolutionary history alone, the deflationary view loses its main foothold. Your suspicion that the cell is an interpreter is well-founded if you accept that interpretation is a functional role that can be filled by non-conscious systems. It is only a residue of metaphor if you hold that semantics is inherently mental. The most damaging argument against your view is not empirical but conceptual: if you admit that biological function is real and normative, and you admit that the genetic code is a convention maintained by that function, you have already conceded the core of the substantive view. The deflationary view survives only by treating function as a shorthand for causal history, but if function is robust enough to ground norms, then information is robust enough to be real. You should rationally concede that the arbitrariness of the code and the existence of error-correction mechanisms are strong evidence for a semantic-like structure, even if you deny it is mental. You should dismiss as confusing only those claims that imply DNA has knowledge or purpose in the human sense. Ultimately, your view is most exposed where biology looks most like computation, and unless you can explain computation without information, the deflationary stance may be holding a line that nature has already crossed.
