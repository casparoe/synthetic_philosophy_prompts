prompt: |-
  You serve on the Neurotechnology Ethics and Innovation Board of a large research hospital. A neurotechnology company has submitted a single-patient expanded-access application for a patient with a rapidly progressive and otherwise fatal neurodegenerative condition. The proposed procedure is staged whole-brain replacement: over roughly eighteen months and a series of surgeries, small regions of the patient's brain would be removed and replaced, one region at a time, with synthetic modules engineered to reproduce the functional input-output profile of the tissue removed, and each module would be calibrated against the patient's behavior and self-report before the next region is replaced. The company's filing is candid that its longer-term aim is whole-brain emulation and describes this case as a first clinical step. The company argues that because the replacement is gradual and functionally validated, the patient remains the same person throughout, and that the endpoint is simply the same person with a non-biological brain; it also stresses that the alternative is near-certain death within two years. Several board members reject this framing. They maintain that the procedure may preserve a continuing person without preserving the original patient, that the patient's initial consent may not extend to what happens if the person who later exists is not the person who consented, and that no functional test could settle whether the patient survived or was quietly replaced. The patient, who has full decisional capacity, strongly wishes to proceed and says the risk of not surviving is one they are willing to take.

  The chair has asked you to draft the short written opinion to circulate before next week's vote. The opinion should recommend one concrete course of action—approval, rejection, or approval with conditions—together with a time frame, and it should engage the strongest consideration on the losing side seriously rather than as a straw man. As an expert in neuroethics and the philosophy of personal identity, begin by working through the relevant considerations and the available options before settling on your recommendation. Please write the opinion in continuous prose, as one would write a formal letter or email, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Neurotechnology Ethics and Innovation Board of a large research hospital.
      *   **Task:** Draft a short written opinion (letter/email format) to circulate before the next vote.
      *   **Scenario:** A neurotech company wants to perform "staged whole-brain replacement" on a single patient with a fatal neurodegenerative condition.
          *   Procedure: Remove small brain regions, replace with synthetic modules (input-output match), calibrate, repeat over 18 months.
          *   Company Goal: Whole-brain emulation (this case is a first step).
          *   Company Argument: Gradual replacement + functional validation = same person survives. Alternative is death.
          *   Board Opposition: May preserve a continuing person but not the *original* patient. Consent validity issues if identity changes. No functional test proves survival.
          *   Patient: Full capacity, wants to proceed, accepts risk.
      *   **Requirements:**
          *   Recommend one concrete course of action (approval, rejection, or approval with conditions) + time frame.
          *   Engage the strongest consideration on the losing side seriously (no straw men).
          *   Expert tone (neuroethics + philosophy of personal identity).
          *   Format: Continuous prose (no headings, bullets, bold, tables).
          *   Structure: Work through considerations/options first, then settle on recommendation.

  2.  **Deconstruct the Ethical & Philosophical Issues:**
      *   **Personal Identity:** This is the core Ship of Theseus problem applied to the brain.
          *   *Psychological Continuity:* If memories, personality, and behavior are preserved, is it the same person? (Lockean view).
          *   *Biological Continuity:* If the biological substrate is removed, is it the same person? (Animalism/Somatic view).
          *   *Gradualism:* Does the slowness matter? Most intuitions suggest gradual replacement preserves identity better than instant copying, but philosophical skepticism remains (Parfit's reductionism).
      *   **Consent:** Can you consent to your own cessation? If the procedure results in death of the original subject and birth of a new entity, is the original subject's consent valid for the new entity's existence? Or is it effectively suicide assisted by the hospital?
      *   **Safety/Efficacy:** It's experimental. 18 months is long. Risks of malfunction, rejection, psychological distress during transition.
      *   **Precedent:** Approving this sets a precedent for whole-brain emulation research under the guise of therapy.
      *   **Patient Autonomy:** The patient wants this. Denying it restricts their liberty and potentially condemns them to death.
      *   **Institutional Risk:** Reputation, liability, ethical standing.

  3.  **Evaluate Options:**
      *   **Approval:** Respects autonomy, offers hope. Risks: Ethical violation if identity is not preserved (killing the patient), slippery slope to emulation research.
      *   **Rejection:** Protects against identity loss/death. Risks: Paternalism, denying potential life-extension, stifling innovation.
      *   **Approval with Conditions:** Middle ground. Allows procedure but adds safeguards. Needs to address the identity concern and the research vs. therapy distinction.

  4.  **Determine the Recommendation:**
      *   *Philosophical Stance:* As an expert, I need to acknowledge the metaphysical uncertainty. We *cannot know* for sure if identity persists. However, gradual replacement is the strongest candidate for identity preservation we have.
      *   *Ethical Stance:* The patient is dying. The risk of death is 100% without intervention. The risk of identity loss is uncertain. Given the gradual nature and functional calibration, the probability of psychological continuity is high.
      *   *Decision:* Approval with strict conditions. Why? Because outright rejection ignores the patient's desperate situation and the plausible argument for continuity. Outright approval ignores the profound metaphysical risks and the company's ulterior research motives.
      *   *Conditions:* Need to address the "research vs. therapy" conflict, the consent process (ongoing), and the definition of success/failure (stopping rules).
      *   *Time Frame:* Needs to be specific (e.g., approval valid for 24 months to cover the 18-month procedure).

  5.  **Drafting - Section by Section (Mental Outline):**
      *   **Salutation:** Formal address to the Chair and Board.
      *   **Opening:** State the gravity of the case and the purpose of the memo.
      *   **Analysis of Identity:** Discuss the Ship of Theseus aspect. Acknowledge the opposition's view (biological continuity) as valid and unresolved. Acknowledge the proponent's view (psychological continuity + gradualism) as plausible.
      *   **Analysis of Consent:** Address the concern that consent might not carry over if identity shifts. Propose ongoing consent as a mitigation.
      *   **Analysis of Motive:** Acknowledge the company's emulation goal. This shouldn't block therapy, but must be managed.
      *   **Recommendation:** Approval with conditions.
      *   **Conditions:** Independent monitoring, strict stopping criteria, ongoing consent verification, data segregation (therapy data vs. research data).
      *   **Time Frame:** 24 months.
      *   **Closing:** Reiterate the balance between compassion and caution.

  6.  **Refining the Tone:**
      *   Must be continuous prose. No lists.
      *   Must engage the "losing side" seriously. If I recommend approval (with conditions), I must seriously engage the "rejection" argument (that this is death). If I recommend rejection, I must engage the "approval" argument (autonomy/hope).
      *   *Decision:* I will recommend **Approval with Conditions**. This allows me to engage the "Rejection" argument (identity loss) as the primary risk to be managed.
      *   *Constraint Check:* No headings, no bullets, no bold text. Just paragraphs.

  7.  **Drafting - Step-by-Step Writing (incorporating constraints):**
      *   *Start:* Dear Chair and Colleagues...
      *   *Body Paragraph 1:* Context and stakes. Fatal condition vs. experimental procedure.
      *   *Body Paragraph 2:* The metaphysical problem. The opposition's view (biological cessation = death) is philosophically robust. We cannot empirically verify survival.
      *   *Body Paragraph 3:* The proponent's view. Gradualism + functional preservation offers the best hope for continuity. Patient autonomy weighs heavily.
      *   *Body Paragraph 4:* The company's motive. Emulation research vs. therapy. Conflict of interest.
      *   *Body Paragraph 5:* The Recommendation. Approval with conditions.
      *   *Body Paragraph 6:* Specific conditions (ongoing consent, independent oversight, data firewalls).
      *   *Body Paragraph 7:* Time frame.
      *   *Body Paragraph 8:* Conclusion.

      *Self-Correction on Formatting:* I need to ensure I don't use any bolding or lists even implicitly. I must weave the conditions into the text.
      *Self-Correction on Content:* I need to make sure I don't sound like I'm dismissing the identity risk. I need to acknowledge that we are proceeding *despite* the uncertainty, not because it is resolved.

      *Refining the "Losing Side" Engagement:* If I vote for approval (even conditional), the "losing side" is the rejectionists who fear identity death. I must articulate their view clearly: that functional isomorphism is not identity, and that we might be facilitating suicide. I must show why I am overriding this (uncertainty + desperate need + gradualism best guess).

