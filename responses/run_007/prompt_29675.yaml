answer: |-
  Dear Chair and Colleagues

  I am writing to offer my assessment regarding the expanded-access application for staged whole-brain replacement submitted by the neurotechnology company. This case presents a convergence of clinical desperation, metaphysical uncertainty, and research ambition that demands we navigate carefully between the Scylla of paternalistic obstruction and the Charybdis of ethical negligence. The patient faces a certain and near-term death from a progressive neurodegenerative condition, and possesses full decisional capacity to request this intervention. However, the intervention itself challenges our foundational understanding of what constitutes the survival of a person. The company proposes a gradual substitution of biological tissue with synthetic modules, validated by functional input-output profiles, arguing that this preserves personal identity. Opponents on the board argue that functional isomorphism is not ontological identity, and that the procedure may result in the death of the original patient and the creation of a new entity, rendering the initial consent invalid and the act potentially homicidal or suicidal.

  We must engage seriously with the dissenting view that biological continuity is necessary for personal identity. If the skeptics are correct, then every stage of this procedure is a step toward the cessation of the patient who signed the consent form. No behavioral test, no self-report, and no cognitive assessment can definitively prove that the subjective experience of the original patient persists rather than being replaced by a convincing simulacrum with identical memories. This is not merely a semantic dispute but a matter of life and death. If the original subject ceases to exist at stage ten of eighteen, the subsequent procedures are performed on a being who did not consent, and the hospital becomes complicit in the termination of the original patient. This risk cannot be empirically eliminated, and we must acknowledge that approving this procedure involves accepting a non-zero probability that we are facilitating the death of the person we aim to save.

  However, we must also weigh this against the certainty of the alternative. The patient will die within two years without intervention. The philosophical theory most supportive of survival in this context is psychological continuity secured by gradualism. There is a strong intuition in both philosophy and law that gradual replacement preserves identity better than instantaneous copying, as it maintains causal connectedness between temporal stages of the self. To reject this application outright is to privilege a specific metaphysical view of identity, specifically biological animalism, over the patient's own valuation of their psychological continuity. Given that the patient understands the risks, including the risk of non-survival in the metaphysical sense, and still wishes to proceed, respect for autonomy suggests we should not impose our metaphysical uncertainties as a veto over their attempt to survive. Furthermore, the company's long-term goal of whole-brain emulation should not disqualify a therapeutic intervention, provided the patient's welfare remains the primary endpoint and not data collection for emulation research.

  Therefore, I recommend that the board grant approval for the procedure with strict conditions rather than rejecting it outright or granting unconditional approval. Unconditional approval would fail to account for the dual-use nature of the technology and the profound identity risks, while rejection would abandon a patient with no other hope based on unresolved philosophical debates. The approval should be contingent on a robust framework that treats the identity question as an ongoing safety monitoring issue rather than a settled fact. Specifically, the conditions must include the establishment of an independent ethics monitor with the authority to halt the procedure at any stage if there is evidence of psychological discontinuity that distresses the patient, ensuring that consent is reaffirmed prior to each surgical stage rather than relying solely on the initial signature. Additionally, there must be a strict firewall between the clinical data used to calibrate the modules for patient safety and the research data used by the company to advance their emulation goals, ensuring that the patient is not treated merely as a means to an engineering end.

  The approval should be valid for a time frame of twenty-four months, which covers the estimated eighteen-month procedure plus a six-month post-operative stabilization period. At the conclusion of this period, the board must reconvene to assess the outcome not only in terms of physiological survival but also in terms of the ethical implications of the identity transition. This approach allows us to honor the patient's autonomy and offer a chance at survival while acknowledging the validity of the concerns regarding personal identity. We proceed not because we know the patient will survive as themselves, but because we cannot know they will not, and the cost of assuming they will not is the certain loss of the life they currently hold. I urge the board to adopt this conditional approval to balance compassion with caution.

  Sincerely

  Member of the Neurotechnology Ethics and Innovation Board
