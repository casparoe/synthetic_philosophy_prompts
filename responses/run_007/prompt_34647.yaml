answer: |-
  ### Upfront Disclosure on the Security Patch

  **A pure Expected Value (EV) calculation *will* tell you to reject the security patch.**

  If your formula is strictly `Probability × Impact − Cost`, and the probability is low enough (0.0001%), the math will almost always say "skip it," even if the impact is company death. This is because standard EV assumes you can play the game infinitely many times (ergodicity), but a startup only gets one life.

  **The procedure below is designed specifically to override that result.** It includes a "Ruin Veto" step. If you implement a strict EV cutoff without this veto, **you will ignore existential tail risks.** I have built the veto into this protocol so that you do not have to ignore them.

  ---

  ### The Startup Tail-Risk Protocol

  This procedure separates **Upside Lotteries** (features) from **Downside Insurance** (security/stability). It prioritizes survival over optimization.

  #### Step 1: The Ruin Test (Categorization)
  **Question:** If this event happens (or doesn't happen), does the company cease to exist or become unable to operate?
  *   **Yes (Existential):** Go to **Step 2A**.
  *   **No (Standard):** Go to **Step 2B**.

  #### Step 2A: The Ruin Veto (For Existential Risks)
  **Question:** Is the cost of mitigation affordable within the current runway (e.g., < 5% of remaining budget/time)?
  *   **Yes:** **ACCEPT.** Do not calculate EV. Do not debate the probability. If the cost is affordable and the risk is ruinous, you buy the insurance.
  *   **No:** **ESCALATE.** This is a strategic crisis. The founders must decide whether to pivot, raise emergency capital, or accept the risk of death. Do not treat this as a feature ticket.

  #### Step 2B: The Cost Cap (For Standard Opportunities)
  **Question:** Is the cost of building this negligible (e.g., < 1% of sprint capacity)?
  *   **Yes:** **ACCEPT.** If it's cheap enough, it doesn't matter if it's a mugging. It's a lottery ticket for the price of a coffee.
  *   **No:** Proceed to **Step 3**.

  #### Step 3: The Probability Floor (Evidence Check)
  **Question:** For any probability estimate below 1%, what is the empirical basis?
  *   **Napkin Math / Intuition:** **REJECT.** Human brains cannot distinguish between 0.001% and 0.00001%. Without data, treat $P$ as 0.
  *   **Historical Data / Analogous Cases:** Proceed to **Step 4**.

  #### Step 4: The Reference Class (Validation)
  **Question:** Has a comparable company achieved this outcome from a comparable starting point?
  *   **No (We are the first):** **REJECT.** This is a "Black Swan" claim. Without a reference class, the variance is too high for a resource-constrained startup.
  *   **Yes:** Proceed to **Step 5**.

  #### Step 5: The Repeatability Test (Portfolio Logic)
  **Question:** Can we run this experiment 50+ times without ruining us?
  *   **Yes:** **ACCEPT.** You are playing the law of large numbers. Even if individual EV is shaky, the portfolio EV holds.
  *   **No:** **REJECT.** If you only get one shot, you cannot rely on low-probability high-payoff math.

  ---

  ### Where the Judgment Calls Are

  You cannot automate this entirely. Here is where humans must intervene:

  1.  **Defining "Ruin" (Step 1):** Is a 20% revenue hit "ruin"? Is a PR scandal "ruin"? The team must agree on what constitutes a game-over event.
  2.  **Defining "Affordable" (Step 2A/2B):** What percentage of runway is safe to spend? This changes based on how much cash you have in the bank.
  3.  **Evaluating Evidence (Step 3):** Determining if a claim is "napkin math" or "grounded" requires senior engineering/product judgment.

  ### What This Procedure Punts On

  *   **Reputation Risks:** Hard to quantify as "ruin" but damaging.
  *   **Moral/Ethical Risks:** EV doesn't capture "doing the right thing."
  *   **Strategic Bets:** Sometimes you *must* take a 0.1% chance shot because the status quo is slow death. This procedure is conservative; it favors survival over moonshots unless the moonshot is cheap.

  ---

  ### Running the Examples

  #### Example 1: The Viral Feature (Upside)
  *   **Proposal:** 0.001% chance of 10x revenue. Cost: 2 weeks of 3 engineers.
  *   **Step 1 (Ruin Test):** If it fails, do we die? **No.** (We just waste 2 weeks). → *Go to 2B.*
  *   **Step 2B (Cost Cap):** Is 2 weeks of 3 engineers negligible (<1% sprint)? **Likely No.** (That's a significant chunk of a startup sprint). → *Go to 3.*
  *   **Step 3 (Probability Floor):** Is the 0.001% based on data? **No.** (It's a "what if" scenario).
  *   **Decision:** **REJECT.**
  *   **Why:** It fails the evidence check. You are being mugged. The cost is too high for a probability that is effectively zero without data.

  #### Example 2: The Security Patch (Downside)
  *   **Proposal:** 0.0001% chance of preventing breach. Cost: 2 days of 1 engineer.
  *   **Step 1 (Ruin Test):** If the breach happens, do we die? **Yes.** (Prompt states: "kill the company"). → *Go to 2A.*
  *   **Step 2A (Ruin Veto):** Is the cost affordable (<5% runway)? **Yes.** (2 days of 1 engineer is negligible).
  *   **Decision:** **ACCEPT.**
  *   **Why:** The Ruin Veto overrides the EV calculation. We do not calculate EV on survival.

  ### Why the Answers Differ

  The procedure gives different answers because it treats **non-ergodic risks** (ruin) differently from **ergodic opportunities** (growth).

  1.  **The Viral Feature** is an *optional bet*. If you lose, you try again next sprint. Because you have limited resources, you cannot afford to burn them on bets with unverified probabilities. The procedure forces you to demand evidence for low-probability claims.
  2.  **The Security Patch** is *mandatory insurance*. If you lose, there is no next sprint. The "cost" of rejection is infinite (company death), which dwarfs any EV calculation. The procedure explicitly bypasses the math here to prevent rational-sounding suicide.

  ### Summary for Your Team

  *   **If it can kill us and we can afford the fix:** Do it. Don't argue probability.
  *   **If it's a moonshot:** Prove the probability with data, or make sure it's cheap enough to be free.
  *   **If the math says "Do it" but your gut says "Scam":** Trust the gut. The probability estimate is likely wrong.
