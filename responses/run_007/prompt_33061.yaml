prompt: |-
  Across a striking range of institutions, a single number produced by a timed, decontextualized cognitive test is treated as a stable fact about a person rather than as a sample of performance on one occasion. School systems use one composite cutoff on such a test to decide which children enter gifted programs and which do not. Military organizations summarize a recruit's performance across a battery of abstract subtests — vocabulary, block design, arithmetic reasoning, working-memory span — into a single qualifying score and use that score to assign people to occupational specialties. Disability adjudication systems treat a composite IQ score as central evidence about whether an adult has an intellectual disability, even when the same file contains detailed evidence of the person's actual functioning at work, at home, and in the community.

  Yet these same institutions also act on assumptions that sit uneasily with that practice. They acknowledge that the same person's performance varies across the very subtests that get averaged together, and that the same composite score can be reached by very different subtest profiles — one child strong in verbal tasks and weak in spatial ones, another the reverse — while the cutoff treats the two as interchangeable. They acknowledge that coaching, practice, motivation, sleep, and test anxiety can move the number by several points. They periodically re-norm the instruments, so that the same raw performance yields a different score depending on the decade in which the person was born, and they norm scores against age groups, so that a seven-year-old and a seventy-year-old with the same raw performance receive different numbers.

  Reconstruct the theory of intelligence that this gatekeeping practice presupposes, if any. Does the practice strictly presuppose that intelligence is a single, general, stable, context-independent capacity that these tests measure more or less directly, or is it compatible with a weaker view — for example, that the composite score is merely a useful predictor of certain later outcomes and carries no commitment about what intelligence is? Identify which features of the practice do the real presupposing (the averaging of heterogeneous subtests, the use of a hard cutoff, the age-norming, the discounting of everyday functioning, the periodic re-norming) and which features are merely incidental or historically contingent. Then assess whether the practice is internally coherent given the rival assumptions these same institutions also accept, and explain what would have to change in the practice if the presupposed view were replaced by a thoroughgoing alternative — for instance, a multiple-intelligences view, a dynamic view on which intelligence is a developing expertise rather than a fixed trait, or a contextual view on which intelligent behavior is relative to a domain and a setting.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The use of single composite IQ/cognitive test scores for high-stakes gatekeeping (schools, military, disability adjudication).
      *   **The Tension:** Institutions treat the score as a stable fact *but* acknowledge variability, profile differences, situational factors, and normative shifts.
      *   **Task 1: Reconstruct the Theory:** What theory of intelligence does this practice *presuppose*? Is it strong (general, stable, context-independent $g$) or weak (pragmatic predictor)?
      *   **Task 2: Identify Presupposing Features:** Which specific practices do the heavy lifting of presupposing? (Averaging, cutoffs, age-norming, discounting ecology, re-norming). Which are incidental?
      *   **Task 3: Assess Coherence:** Is the practice internally coherent given the rival assumptions institutions also hold (variability, profile differences, etc.)?
      *   **Task 4: Propose Alternatives:** What would change if the presupposed view were replaced by alternatives (Multiple Intelligences, Dynamic/Expertise, Contextual)?

  2.  **Task 1: Reconstructing the Theory (The "Psychometric Realist" View):**

      *   *Observation:* Institutions treat the number as a "stable fact."
      *   *Inference:* This implies a belief in *general intelligence* ($g$). If the score were just a sample, they wouldn't generalize it to "giftedness" or "disability."
      *   *Stability:* The use of a single occasion implies test-retest reliability is assumed to be high enough to represent a trait, not a state.
      *   *Context:* Decontextualized testing implies intelligence is transferable across domains (context-independent).
      *   *Conclusion:* The practice presupposes a "Strong Psychometric Realism." It acts *as if* $g$ is a real, unitary, stable entity residing within the individual, measurable by abstract tasks. A "weak predictor" view doesn't fit because of the *exclusionary* nature of the cutoffs (disability/giftedness implies ontological status, not just risk assessment).

  3.  **Task 2: Identifying Presupposing Features:**

      *   *Averaging Heterogeneous Subtests:* This is crucial. It presupposes compensability (weakness in X made up by strength in Y) and a common underlying factor ($g$). If intelligences were distinct, averaging would be meaningless.
      *   *Hard Cutoffs:* This presupposes a threshold model of a continuous trait. It implies the difference between score 69 and 70 is qualitative (disabled vs. not), reinforcing the idea of the score as a definitive marker of capacity.
      *   *Discounting Everyday Functioning:* (Specific to disability). This presupposes that the *potential* (measured by test) outweighs the *actualization* (ecological validity). It assumes the test is the "true" measure, and life is the noisy variable.
      *   *Age-Norming:* This presupposes a developmental trajectory that is universal. It assumes intelligence is a rate of development relative to peers.
      *   *Periodic Re-norming:* This is tricky. It acknowledges the Flynn Effect, but by adjusting scores, it maintains the *meaning* of the number (e.g., 100 is always average). It preserves the stability of the *scale* rather than the trait.
      *   *Incidental/Contingent:* The specific subtests (block design vs. vocabulary) are contingent. The timed nature is contingent (though common). The specific cutoff numbers (70, 130) are contingent policy choices, though the *existence* of a cutoff is structural.

  4.  **Task 3: Assessing Internal Coherence:**

      *   *The Conflict:* Institutions act as if the score is stable/factual *but* acknowledge variability (anxiety, sleep, profile scatter).
      *   *Analysis:* This is *pragmatically* coherent but *theoretically* incoherent.
      *   *Why?* They use "error margins" rhetorically (e.g., "IQ of 70 +/- 5") but act decisively on the point estimate for funding/placement. They acknowledge profile differences but ignore them for eligibility.
      *   *Verdict:* It's a "bureaucratic coherence." It works for sorting, but it contradicts the nuanced psychological reality the institutions admit exists. It creates a "fiction of precision."

  5.  **Task 4: Proposing Alternatives:**

      *   *Multiple Intelligences (Gardner-esque):*
          *   *Change:* No single composite. Profiles matter. A "gifted" program might accept a kid with high spatial/low verbal. Disability would require deficits in specific adaptive domains, not a global average.
      *   *Dynamic/Expertise (Vygotsky/Developmental):*
          *   *Change:* Testing becomes assessment *for* learning, not *of* learning. Focus on "learning potential" or responsiveness to instruction. Cutoffs become obsolete; focus shifts to scaffolding.
      *   *Contextual/Situated:*
          *   *Change:* Assessment happens *in* the environment. Disability adjudication would weigh real-world functioning *over* test scores. Military assignment would be based on task-specific simulations, not abstract batteries.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Hook the reader with the paradox (the "reification" of the number). State the thesis: The practice presupposes a strong, essentialist view of $g$, despite pragmatic denials.
      *   *Section 1: The Presupposed Theory.* Define "Operationalized Essentialism." It's not just prediction; it's categorization.
      *   *Section 2: Structural Features.* Analyze averaging, cutoffs, and ecological discounting. Distinguish between structural necessities and historical contingencies.
      *   *Section 3: Coherence Check.* Highlight the cognitive dissonance. The "Standard Error of Measurement" is the band-aid that doesn't fix the wound.
      *   *Section 4: Alternative Paradigms.* Walk through the three requested alternatives (Multiple, Dynamic, Contextual) and specify the practical shifts.
      *   *Conclusion:* Summarize. The system persists not because it's theoretically pure, but because it's administratively efficient.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say the institutions *explicitly state* $g$ is real. The prompt asks what the *practice presupposes*. Even if psychologists say "it's just a predictor," the *gatekeeping* implies a trait.
      *   *Nuance on Re-norming:* Re-norming actually supports the idea that the *trait* is stable but the *environment* changes (Flynn Effect). It preserves the meaning of the score, reinforcing the score's authority.
      *   *Nuance on Disability:* The prompt mentions disability systems ignore real-world functioning. This is a key point for the "Contextual" alternative.
      *   *Tone:* Keep it analytical, philosophical, and critical, avoiding pure ranting. Use terms like "reification," "operationalism," "ecological validity."

  8.  **Final Polish:** Check against all parts of the prompt.
      *   Reconstruct theory? Yes.
      *   Strong vs. Weak view? Yes (argued for Strong/Essentialist).
      *   Identify features? Yes (Averaging, Cutoffs, etc.).
      *   Assess coherence? Yes (Bureaucratic vs. Theoretical).
      *   Alternatives? Yes (Multiple, Dynamic, Contextual).

  9.  (Final review of the generated text to ensure it flows logically and meets the word count/depth expectations.) *Looks good. The distinction between "Operational Essentialism" and "Pragmatic Instrumentalism" is a strong framing device.*

  **(Self-Correction Note):** Make sure to explicitly address the "weak view" (predictor only) and explain why it fails to explain the *gatekeeping* aspect. If it were just a predictor, you wouldn't deny disability benefits based on a score of 71 vs 69; you'd look at outcomes. The fact that they use it for *eligibility* proves they treat it as a definition of the state.

  10. **Finalizing the Output.** (Proceed to generate response based on these thoughts.)
answer: |-
  The institutional practices described reveal a profound tension between the *psychological complexity* acknowledged by practitioners and the *administrative simplicity* required by bureaucracies. To reconstruct the theory of intelligence presupposed by these gatekeeping practices, we must look not at what psychometricians say in textbooks, but at what the procedures themselves enact.

  ### I. The Presupposed Theory: Operationalized Essentialism

  Does the practice presuppose a strong view (intelligence as a single, stable capacity) or a weak view (intelligence as a useful predictor)? While institutions often defend the tests using the language of the weak view (e.g., "this predicts job performance"), the *structure* of the gatekeeping presupposes the **strong view**.

  If the score were merely a probabilistic predictor of outcomes, a cutoff would be arbitrary. A predictor implies risk assessment; gatekeeping implies ontological classification. When a disability system denies benefits based on an IQ of 71 but grants them at 69, it is not making a statistical prediction about future struggle; it is making a categorical judgment about the *nature* of the person's mind. Similarly, when a school labels a child "gifted" based on a composite, it implies the child possesses a distinct quality ($g$) that warrants distinct treatment, rather than simply having a higher probability of academic success.

  Therefore, the practice presupposes **Operationalized Essentialism**. It acts as if:
  1.  **Unitary:** Intelligence is a single, underlying substance that can be meaningfully averaged across disparate tasks (verbal, spatial, arithmetic).
  2.  **Internal and Stable:** The capacity resides within the individual, is relatively fixed over time (trait rather than state), and is distinct from the context in which it is displayed.
  3.  **Hierarchical:** This capacity is the primary determinant of worthiness for specific social roles (soldier, student, beneficiary).

  The "weak view" is incompatible with the rigidity of the cutoffs. A predictor allows for exceptions; a diagnostic criterion demands them. By treating the score as a "stable fact," institutions reify the number into the thing itself.

  ### II. Features of the Practice: Structural vs. Incidental

  Which features of the practice do the heavy lifting in presupposing this theory?

  **1. The Averaging of Heterogeneous Subtests (Structural)**
  This is the strongest presupposition of a unitary $g$. If intelligence were a collection of independent modules, averaging a high vocabulary score with a low block-design score would be like averaging a person's height and weight to determine "size." The fact that institutions accept the composite as valid presupposes that these subtests are interchangeable indicators of a common underlying fuel. This feature actively erases profile differences, enforcing the theory that a "smart person" is smart in a general way.

  **2. The Hard Cutoff (Structural)**
  The use of a threshold (e.g., IQ < 70 for intellectual disability) presupposes that the trait is not only continuous but possesses natural joints. It assumes the difference between 69 and 70 is qualitative, not quantitative. This reinforces the essentialist view that there is a specific point where "normal" cognition becomes "disabled" cognition.

  **3. Discounting Everyday Functioning (Structural)**
  In disability adjudication, prioritizing the test score over ecological evidence (work history, community functioning) presupposes that the decontextualized test is a *purer* measure of the trait than real-life performance. It assumes that real-world success might be due to luck or support, whereas the test score reveals the "true" internal capacity. This is a commitment to context-independence.

  **4. Age-Norming (Structural)**
  This presupposes a universal developmental trajectory. It assumes that intelligence is a rate of maturation relative to peers. While necessary for comparing children, it reinforces the idea that intelligence is a fixed capacity growing at a set pace, rather than an accumulation of knowledge which might vary wildly based on opportunity.

  **5. Periodic Re-norming (Incidental/Preservational)**
  Re-norming is historically contingent (responding to the Flynn Effect), but its *function* is structural: it preserves the meaning of the score over time. By adjusting the scale so that 100 remains average, institutions maintain the stability of the *metric* even if the *population* changes. This supports the illusion that the "unit" of intelligence is constant, even if raw performance drifts.

  **6. Timed, Abstract Content (Incidental/Contingent)**
  The specific choice of timed, abstract puzzles is historically contingent (rooted in Binet and Army Alpha). One could imagine untimed or practical tests. However, the *decontextualized* nature is structural. The content could change, but the requirement that the test be removed from real-world tools and pressures is necessary to maintain the "context-independent" presupposition.

  ### III. Assessment of Internal Coherence

  The practice is **bureaucratically coherent but theoretically incoherent.**

  **The Incoherence:**
  Institutions acknowledge that scores vary due to anxiety, sleep, and motivation (state factors), yet they treat the score as a trait. They acknowledge profile scatter (a child can be verbally gifted but spatially impaired), yet they use a composite that washes out this scatter. They acknowledge the Flynn Effect (scores rise over decades), yet they treat the score as an absolute measure of capacity.
  This creates a system of **organized cognitive dissonance.** The institutions possess the nuance to know the score is a "sample of performance," but they lack the administrative machinery to process nuance. To resolve this, they employ the "Standard Error of Measurement" (SEM) as a rhetorical shield. They admit the score is fuzzy (e.g., "70 +/- 5"), but in practice, the cutoff remains a bright line. This allows them to claim scientific humility while exercising bureaucratic absolutism.

  **The Coherence:**
  The system is coherent only if viewed as a sorting mechanism rather than a diagnostic one. If the goal is to process thousands of recruits or claims efficiently, the "fiction of precision" is functional. It reduces liability and standardizes decision-making. The incoherence is tolerated because the cost of theoretical purity (individualized assessment for every recruit) exceeds the cost of classification errors.

  ### IV. Implications of Alternative Views

  If the presupposed view (Operationalized Essentialism) were replaced by alternative theories, the gatekeeping practices would require radical transformation.

  **1. Multiple Intelligences View (e.g., Gardner)**
  *   **Theory:** Intelligence is a set of distinct, non-compensatory capacities (linguistic, spatial, interpersonal, etc.).
  *   **Practice Change:**
      *   **No Composites:** The "IQ" score would be abolished. Reports would be profiles or radar charts.
      *   **No General Cutoffs:** A "gifted" program would not have one entry score. A child might qualify for the math track but not the writing track.
      *   **Disability:** An intellectual disability diagnosis would require deficits in specific adaptive domains relevant to the person's life, not a global average. A person with low logical-mathematical intelligence but high interpersonal intelligence might not be considered "disabled" if their community role relies on social skills.

  **2. Dynamic/Expertise View (e.g., Vygotsky/Developmental)**
  *   **Theory:** Intelligence is not a fixed trait but a developing potential, defined by responsiveness to instruction (Zone of Proximal Development).
  *   **Practice Change:**
      *   **Testing for Learning:** Assessments would measure how much help a person needs to master a task, not what they can do alone.
      *   **No Permanent Labels:** "Gifted" and "Disabled" would be temporary statuses based on current scaffolding needs, not permanent identities.
      *   **Military/School:** Assignment would be based on *trainability* rather than *pre-existing knowledge*. A recruit with low initial scores but high learning velocity would be prioritized for complex roles.

  **3. Contextual/Situated View (e.g., Ecological Psychology)**
  *   **Theory:** Intelligent behavior is relative to the domain and setting; there is no "general" capacity independent of context.
  *   **Practice Change:**
      *   **Abolition of Decontextualized Testing:** Tests would be simulations of the actual environment (e.g., military recruits perform actual maintenance tasks; students solve real community problems).
      *   **Disability Adjudication:** Real-world functioning would become the *primary* evidence. The test score would be secondary or inadmissible. If a person functions independently at work and home, they cannot be adjudicated as intellectually disabled, regardless of their test score.
      *   **Norming:** Norms would be local, not national. Performance would be judged against the demands of the specific community or job site, not a national age-matched average.

  ### Conclusion

  The current gatekeeping practice presupposes a theory of intelligence that is more robust than the institutions admit. It requires intelligence to be a unitary, stable, internal essence to justify the averaging of subtests and the enforcement of hard cutoffs. While institutions pay lip service to the variability and context-dependence of performance, their procedures are designed to strip those variables away to produce a "clean" number. This creates a system that is theoretically contradictory but administratively efficient. Moving toward a more psychologically accurate model—whether multiple, dynamic, or contextual—would require dismantling the efficiency of the bureaucracy. It would demand replacing the "single number" with complex profiles, replacing "cutoffs" with nuanced thresholds, and replacing "testing" with observation. Until institutions are willing to bear the cost of that complexity, they will continue to rely on the fiction of the stable, decontextualized fact.
