      *   Or, argue that the *deductive process* in this specific instance is not "competent" because it violates a norm of non-circularity which is truth-conducive in the long run (Bergmann's approach).
      *   *Best bet for a Reliabilist:* **The No-Defeater Condition.** Even if the process is reliable, if there is an available defeater (e.g., "this reasoning is circular"), justification is defeated. In bootstrapping, the circularity is salient upon reflection.

