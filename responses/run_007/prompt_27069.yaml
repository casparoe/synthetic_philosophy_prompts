answer: |-
  # Moral Asymmetry Decision Tree

  **Instructions:**
  This handout is designed to help you locate your ethical intuitions regarding pleasure and pain. Proceed through the nodes in order. At each step, choose the option that best matches your immediate moral judgment about the scenario presented. Do not worry about consistency until the end; the tree is designed to reveal inconsistencies for you.

  **Note on Terminology:** The questions use plain language. The final positions (Leaves) use standard philosophical labels for further reading.

  ---

  ### Node 1: The Value of Satisfaction (Existing Beings)
  **Scenario:** Consider a person who is currently content (neither suffering nor delighted). You have the resources to either (A) leave them exactly as they are, or (B) provide them with a significant, genuine pleasure that fades after an hour.
  *   **Option A:** There is no moral reason to choose (B). Leaving them content is just as good as making them delighted.
  *   **Option B:** Choosing (B) is morally better. Adding pleasure is a positive gain, even if there was no prior suffering.

  > *Route Option A to Node 2.*
  > *Route Option B to Node 3.*

  ### Node 2: Antifrustrationism Check (Existing Beings)
  **Scenario:** Consider a person who has a mild desire (e.g., to drink a glass of water). You can either (A) let them remain with the unsatisfied desire, or (B) satisfy the desire.
  *   **Option A:** Satisfying the desire is neutral; only the *frustration* of the desire would have been bad.
  *   **Option B:** Satisfying the desire is good, or at least preventing the frustration is significantly more important than Node 1 suggested.

  > *Route Option A to **Leaf: Antifrustrationism**.*
  > *Route Option B to Node 3.*
  > *(Diagnostic Note: If you chose Option A at Node 1 but Option B here, you may hold a hybrid view, but standard Antifrustrationism treats satisfaction as neutral. We will route you to Node 3 to test your views on pain.)*

  ### Node 3: The Extreme Pain Threshold (Existing Beings)
  **Scenario:** You can either (A) prevent one person from experiencing one hour of the worst agony imaginable (torture), or (B) provide a mild, genuine pleasure to **one billion** people who would otherwise feel nothing.
  *   **Option A:** Preventing the agony is strictly more important. No number of mild pleasures justifies allowing the torture.
  *   **Option B:** At some sufficiently large number (perhaps one billion, perhaps more), the aggregate pleasure outweighs the single instance of agony.

  > *Route Option A to Node 4.*
  > *Route Option B to Node 5.*

  ### Node 4: The Mild Pain Threshold (Existing Beings)
  **Scenario:** You can either (A) prevent one person from experiencing a mild but annoying headache for an hour, or (B) provide a mild, genuine pleasure to **one million** people.
  *   **Option A:** Preventing the headache is strictly more important. No amount of mild pleasure justifies allowing even this minor suffering.
  *   **Option B:** The aggregate pleasure of the million outweighs the single headache.

  > *Route Option A to **Leaf: Strong Negative Utilitarianism**.*
  > *Route Option B to **Leaf: Moderate Negative Utilitarianism**.*
  > *(Diagnostic Note: This distinguishes those who see *all* suffering as lexically priority [Strong] from those who see only *extreme* suffering as lexical [Moderate].)*

  ### Node 5: The Weight of Pain vs. Pleasure (Existing Beings)
  **Scenario:** You can either (A) prevent one unit of mild pain, or (B) create one unit of mild pleasure. Assume the intensity and duration are identical.
  *   **Option A:** Preventing the pain is more important than creating the pleasure. Suffering counts for more.
  *   **Option B:** They are morally equivalent. One unit of pain cancelled is equal to one unit of pleasure gained.

  > *Route Option A to Node 6.*
  > *Route Option B to Node 7.*

  ### Node 6: Prioritarianism Check (Creation)
  **Scenario:** (Probing Existence Distinction 1) You have resources to either (A) make an **existing** person significantly happier, or (B) bring a **new** person into existence who will be equally happy.
  *   **Option A:** Helping the existing person is more important. We have no strong duty to create new happy lives.
  *   **Option B:** They are equally valuable. Creating a happy life is as good as improving an existing one.

  > *Route Option A to **Leaf: Asymmetry View (Restricted to Creation)**.*
  > *(Diagnostic Note: You weigh pain heavily for existing beings [Node 5] but deny a duty to create happy lives. This aligns with the Asymmetry View, though typically this view holds symmetric weights for existing beings. If you hold asymmetric weights for existing beings AND asymmetric duties for creation, you are a Prioritarian with Asymmetric Population Ethics. For this taxonomy, we classify you here due to the creation constraint.)*
  > *Route Option B to **Leaf: Prioritarianism**.*

  ### Node 7: Classical Symmetry Check (Creation)
  **Scenario:** (Probing Existence Distinction 2) You can either (A) prevent a **new** person from being born into a miserable life, or (B) prevent an **existing** person from experiencing equivalent misery.
  *   **Option A:** Preventing the creation of the miserable life is worse (or better) than helping the existing person. The status of "existing" changes the moral weight.
  *   **Option B:** They are equally important. Causing misery by creation is as bad as causing misery to someone already alive.

  > *Route Option A to Node 8.*
  > *Route Option B to Node 9.*

  ### Node 8: Asymmetry Consistency (Creation)
  **Scenario:** (Probing Existence Distinction 3) You must choose between (A) saving the life of an **existing** child who will have a modestly happy life, or (B) creating a **new** child who will have an equally happy life (you cannot do both).
  *   **Option A:** Save the existing child. We have stronger obligations to those who already exist.
  *   **Option B:** It makes no difference, or creating the new child is preferable.

  > *Route Option A to **Leaf: Asymmetry View (Restricted to Creation)**.*
  > *(Diagnostic Note: You treat existing beings symmetrically [Node 5] but prioritize them over potential beings [Nodes 7 & 8]. This is the definition of the Restricted Asymmetry View.)*
  > *Route Option B to **Leaf: Unoccupied / Incoherent**.*
  > *(Diagnostic Note: You claimed in Node 7 that creating misery is different from causing misery, but here you claim creating happiness is equivalent to saving happiness. This combination—Asymmetric on Bad Creation but Symmetric on Good Creation—is rarely defended and risks logical inconsistency regarding the moral status of "coming into existence.")*

  ### Node 9: Resource Allocation (Existing vs. New)
  **Scenario:** You have a fixed budget. You can either (A) cure a painful disease for 1,000 **existing** people, or (B) subsidize the birth of 1,000 **new** people who will lead happy lives (but the existing people remain sick).
  *   **Option A:** Cure the existing people.
  *   **Option B:** Create the new people.

  > *Route Option A to **Leaf: Classical Symmetric Utilitarianism**.*
  > *(Diagnostic Note: You treat pleasure and pain symmetrically [Node 5], treat creation and existing symmetrically regarding harm [Node 7], and prioritize existing beings only due to practical certainty, not moral principle. This is standard Classical Utilitarianism.)*
  > *Route Option B to **Leaf: Unoccupied / Pro-Natalist Utilitarianism**.*
  > *(Diagnostic Note: Prioritizing the creation of new happy lives over relieving significant existing suffering is a defensible but rare position, often rejected because it treats existing people as mere means to population growth.)*

  ### Node 10: Omission and Identity (Final Filter)
  **Scenario:** A government policy will change which specific children are born in the next generation (due to economic shifts). The policy results in children who are slightly less happy than they would have been under a different policy, but their lives are still worth living.
  *   **Option A:** This is not a moral harm, because the children would not have existed otherwise.
  *   **Option B:** This is a moral harm, because they are worse off than they could have been.

  > *Route Option A to **Leaf: Asymmetry View (Restricted to Creation)**.*
  > *(Diagnostic Note: This accepts the "Non-Identity Problem" solution often paired with Asymmetry views: we cannot harm someone by bringing them into a life worth living.)*
  > *Route Option B to **Leaf: Classical Symmetric Utilitarianism**.*
  > *(Diagnostic Note: This rejects the Non-Identity Problem's moral shield, consistent with a strict symmetric view where "better" is always required regardless of identity.)*

  ---

  ### Leaf Position Summaries

  **Classical Symmetric Utilitarianism**
  *   **Core Intuition:** Pleasure and pain are equal and opposite. A unit of suffering avoided is morally equivalent to a unit of pleasure gained. This applies equally to existing beings and potential beings.
  *   **Tree Path:** Node 1(B) → Node 3(B) → Node 5(B) → Node 7(B) → Node 9(A).

  **Prioritarianism**
  *   **Core Intuition:** Suffering counts more heavily than pleasure (the moral "weight" of pain is higher), but they are still tradeable. Enough pleasure can outweigh pain, but the exchange rate is not 1:1.
  *   **Tree Path:** Node 1(B) → Node 3(B) → Node 5(A) → Node 6(B).

  **Moderate Negative Utilitarianism**
  *   **Core Intuition:** Extreme suffering has lexical priority (no amount of pleasure can outweigh torture), but mild suffering is tradeable.
  *   **Tree Path:** Node 1(B) → Node 3(A) → Node 4(B).

  **Strong Negative Utilitarianism**
  *   **Core Intuition:** All suffering has lexical priority over pleasure. No quantity of pleasure can justify allowing any amount of pain.
  *   **Tree Path:** Node 1(B) → Node 3(A) → Node 4(A).

  **Antifrustrationism**
  *   **Core Intuition:** Only frustrated preferences (suffering) count negatively. Satisfied preferences (pleasure) carry no positive value; they are merely neutral.
  *   **Tree Path:** Node 1(A) → Node 2(A).

  **Asymmetry View (Restricted to Creation)**
  *   **Core Intuition:** We have strong reasons not to bring miserable lives into existence, but no duty to bring happy lives into existence. However, for beings that *already* exist, pleasure and pain are treated more symmetrically (or at least, the asymmetry does not apply).
  *   **Tree Path:** Node 1(B) → Node 3(B) → Node 5(B) → Node 7(A) → Node 8(A).

  **Unoccupied / Incoherent Positions**
  *   **Diagnosis:** These paths represent combinations of intuitions that are either logically contradictory (e.g., claiming pain is lexically priority but also that creating happy people is a strict duty) or simply have no significant defenders in the literature (e.g., prioritizing creating new happy people over saving existing suffering people). If you landed here, your view may be novel or require refinement to resolve the tension between your answers on existing vs. potential beings.

  ---

  ### Diagnostic Notes on Unoccupied Paths

  1.  **Strong NU + Pro-Natalist:** (Path: Node 4(A) → Node 6(B)). Claiming *all* pain is lexically priority over pleasure, yet asserting a duty to create new happy lives, is functionally incoherent. If pleasure cannot outweigh pain, creating new lives (which risks pain) cannot be a moral duty unless the risk is zero.
  2.  **Symmetric Existing + Asymmetric Harm Only:** (Path: Node 5(B) → Node 7(A) → Node 8(B)). Claiming that creating a miserable life is *worse* than harming an existing person, but creating a happy life is *equal* to helping an existing person. This breaks the structural symmetry of the "Asymmetry View" without a clear philosophical justification for why only the negative side is identity-sensitive.
  3.  **Creation-Prioritizing Utilitarianism:** (Path: Node 9(B)). Prioritizing the creation of new happy lives over relieving significant existing suffering. While logically possible, this is widely rejected because it implies existing beings are interchangeable with potential beings, undermining the special obligation to those currently dependent on us.

  ---

  ### Guidance for Discussion Leaders
  *   **On Node 1:** Scientists often struggle here. If they view "contentment" as a baseline zero, adding pleasure is +1. If they view it as "absence of desire," adding pleasure is 0. This is the key split for Antifrustrationism.
  *   **On Node 3 & 4:** These probe the "lexical threshold." Encourage members to think about whether there is *any* number of pleasures that justifies torture. If they hesitate on "one billion," ask about "one trillion."
  *   **On Nodes 7 & 8:** These probe the "Non-Identity Problem." If members feel creating a miserable child is "worse" than harming an existing one, ask *who* is harmed in the creation case. If the child wouldn't exist otherwise, are they harmed? This distinguishes the Asymmetry View from Classical Utilitarianism.
