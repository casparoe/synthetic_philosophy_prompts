answer: |-
  Here is the specification list for an adequate ontology of dispositions. This list is derived from the failures of the Simple Conditional Analysis (SCA), the constraints of empirical science, and the metaphysical demand for realism (i.e., that dispositions are features of the world, not just features of our language).

  ### The Requirements List

  **1. The Possession/Manifestation Distinction**
  *   **Specification:** The theory must distinguish between *having* a disposition and the disposition *manifesting*. It must account for cases where the disposition exists but fails to manifest due to interference (antidotes, masks) and cases where the manifestation occurs without the disposition (mimics).
  *   **Reasoning:** Your examples of the neutralized poison and the wired glass demonstrate that the truth of a counterfactual ("it would break if struck") is not identical to the existence of the property. A theory that equates the two cannot explain why we intervene on the *property* (e.g., hardening the glass) rather than just the *circumstances*.
  *   **Status:** **Non-negotiable.** Any theory that collapses this distinction reduces dispositions to mere regularities or linguistic conventions, violating your constraint that you want to know "what dispositions really are."

  **2. Ontological Grounding (The Causal Base)**
  *   **Specification:** The theory must locate the disposition in the actual structure or nature of the bearer. There must be a "causal base" (microstructural, fundamental, or essential) in virtue of which the object holds the disposition.
  *   **Reasoning:** This handles the "mimic" case (the harmless powder). The powder kills only due to an external agent adding toxin; it lacks the internal ground. Without a grounding requirement, any object paired with a sufficiently complex environment could be said to have any disposition, dissolving the concept into triviality.
  *   **Status:** **Non-negotiable.** This is required to maintain the intuition that dispositions are properties *of objects*, not properties of object-environment systems.

  **3. Compatibility with Degrees and Probabilities**
  *   **Specification:** The theory must accommodate dispositions that are graded (e.g., more or less soluble) and probabilistic (e.g., a 50% chance of decay), rather than strictly binary or deterministic.
  *   **Reasoning:** This earns its place via scientific constraint. Toxicology relies on LD50 measures (degrees); Quantum Mechanics relies on propensity interpretations (probability). A theory that forces dispositions to be all-or-nothing or strictly deterministic contradicts established physical and chemical models.
  *   **Status:** **Non-negotiable.** While some metaphysical camps prefer deterministic essences, an adequate account cannot contradict the empirical success of probabilistic physics.

  **4. Stimulus Specificity without Relational Dissolution**
  *   **Specification:** The theory must specify that dispositions are directed toward specific stimuli (fragility is for striking, not for singing) without making the disposition *wholly* relational (i.e., dependent on the actual existence of the stimulus).
  *   **Reasoning:** This addresses the "Intrinsic vs. Relational" constraint. If dispositions are purely intrinsic, they cannot explain why specific triggers are needed. If they are purely relational, the "wired glass" problem returns (the relation changes, so the property vanishes). The theory must explain how an intrinsic base is *directed* toward a potential stimulus.
  *   **Status:** **Non-negotiable.** A theory that fails this either makes dispositions magic (working without triggers) or makes them extrinsic (vanishing when the trigger is removed).

  **5. Causal Relevance (Explanatory Power)**
  *   **Specification:** The disposition must be capable of featuring in causal explanations. It must do work.
  *   **Reasoning:** If the disposition is just a shadow of the categorical base (the microstructure), it is epiphenomenal. If the glass shatters *because* of its molecular bonds, what work is "fragility" doing? An adequate account must show that dispositions are not merely redundant descriptions of categorical properties.
  *   **Status:** **Camp Preference (Dispositional Essentialism) vs. Non-negotiable (for Realists).** If you are a Humean, you can deny this. But since you seek what dispositions *really are*, you likely require them to be causally potent. I list this as Non-negotiable for a *Realist* account.

  **6. Temporal Persistence**
  *   **Specification:** The theory must explain how a disposition persists through time when not manifesting.
  *   **Reasoning:** The glass is fragile today and tomorrow, even if never struck. The account must avoid making the disposition an event or a process; it must be a state or property that endures.
  *   **Status:** **Non-negotiable.** Required to match ordinary and scientific usage.

  ---

  ### Tensions and Trade-offs

  An adequate theory must live with the following frictions. Resolving these is where the philosophical work happens.

  **1. The Grounding Tension (Categorical vs. Pure Power)**
  *   **Conflict:** Requirement 2 (Grounding) pulls against Requirement 5 (Causal Relevance). If you ground dispositions in categorical properties (e.g., molecular structure), you satisfy science but risk making the disposition redundant (the structure does the work, not the "fragility"). If you make dispositions "pure powers" (no categorical base), you satisfy Causal Relevance but struggle to explain what the power *is* apart from what it *does* (leading back to the conditional analysis you rejected).
  *   **Resolution Strategy:** The theory must either argue that properties are *both* categorical and dispositional (the "Identity Theory") or that the world is fundamentally dispositional and categorical properties are the resting states of powers.

  **2. The Intrinsic/Relational Tension**
  *   **Conflict:** Requirement 2 demands an intrinsic base (to avoid mimics). Requirement 4 demands stimulus specificity (which looks relational). If the disposition is defined by its relation to a stimulus, is it really intrinsic?
  *   **Resolution Strategy:** The theory must define the disposition as an intrinsic property that is *essentially directed* (intentional, in the Brentano sense) toward a stimulus, without requiring the stimulus to exist. This is a difficult metaphysical needle to thread.

  **3. The Probability Tension**
  *   **Conflict:** Requirement 3 (Probability) conflicts with classical intuitions of Causal Relevance (Requirement 5). If a disposition only yields a 50% chance of manifestation, did it *cause* the manifestation when it happens, or was it luck?
  *   **Resolution Strategy:** The theory must adopt a propensity view of probability, where the disposition *is* the physical tendency, rather than a frequency count of outcomes.

  ---

  ### The Most Eliminative Requirement

  **Requirement 1: The Possession/Manifestation Distinction.**

  This is the single requirement that eliminates the most candidate theories.
  *   **Why:** It kills the Simple Conditional Analysis (SCA) immediately. It also kills Humean Regularity accounts (which treat dispositions as summaries of actual events). It kills "Simple Dispositional Essentialism" that cannot account for masking.
  *   **Impact:** It forces the theory to posit a **real ontological ground** distinct from the outcome. Any theory that cannot explain why the poison is still poisonous even when the victim survives (due to an antidote) is not a theory of dispositions; it is a theory of counterfactuals. This requirement forces you into Realism.

  ---

  ### Scorecard of Main Contenders

  | Theory | Possession/Manifestation | Ontological Grounding | Degrees/Probability | Causal Relevance | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Simple Conditional Analysis** | **FAIL** (Collapses them) | **FAIL** (No base) | PASS (Can model) | **FAIL** (Epiphenomenal) | **Rejected.** (Your starting point). |
  | **Lewis's Reformed Analysis** | **PASS** (Via "causal base" clause) | **PASS** (Categorical base) | PASS | **FAIL** (Base does the work, disposition is label) | **Partial.** Saves the conditional, but makes dispositions ontologically thin. |
  | **Humean Best Systems** | **FAIL** (Denies real dispositions) | **FAIL** (Denies powers) | PASS | **FAIL** (Regularity only) | **Rejected.** Contradicts your "what they really are" constraint. |
  | **Dispositional Essentialism (Bird/Mumford)** | **PASS** (Powers are real) | **PASS** (Pure powers or Identity) | **PASS** (Propensities) | **PASS** (Powers are causes) | **Strong Contender.** Best fit for Requirements 1, 2, 5. Struggles slightly with 4 (integrating with standard QM). |
  | **Categoricalism (Armstrong)** | **PASS** (Via laws of nature) | **PASS** (Categorical properties) | **PASS** | **PASS** (Laws govern) | **Strong Contender.** Fits science well, but risks making "disposition" a derivative concept rather than fundamental. |

  ### Summary Recommendation

  To satisfy this list, you are pushed toward a **Realist Ontology of Powers**. You cannot remain a Humean or a deflationist. The critical move you must make is to assert that the disposition is a **property of the object** (satisfying Grounding) that **exists independently of its manifestation** (satisfying Possession/Manifestation), but is **essentially directed toward a stimulus** (satisfying Specificity).

  The hardest hurdle you will face is not the finks or masks, but **Requirement 5 (Causal Relevance) vs. Requirement 2 (Grounding).** You must decide: Is the disposition *identical* to the microstructure (Identity Theory), or is it a distinct ontological category (Dualism of Properties)? The list does not decide this for you, but it demands you choose one without violating the others.
