prompt: |-
  I've been trying to work out what a thing's dispositions amount to, and I keep colliding with the obvious starting point. The natural idea is that a disposition is just a would-if claim: glass is fragile because it would shatter if struck, salt is soluble because it would dissolve if put in water, a poison is poisonous because it would kill if swallowed.

  But the would-if claim and the disposition come apart in both directions. A glass wired to a device that would make it shatterproof the instant before anything struck it still seems fragile now, even though the claim that it would shatter if struck is false. A poison that is always neutralized by an antidote the moment it is swallowed is still poisonous, even though the claim that it would kill if swallowed is false. And an otherwise harmless powder that would kill only because someone would add a toxin to it upon ingestion satisfies the would-if claim without being poisonous. So the simple account fails in both directions, and I do not want a patch that just tacks on further clauses case by case.

  Before I look at any actual theory, I want the full specification of what such a theory has to get right. Write the requirements list: the cases any adequate account of dispositions must classify correctly, the distinctions it cannot collapse, and the results from the sciences it cannot contradict, with the reasoning behind each. I am after what dispositions really are, not merely a tidy way of talking. In particular, I want the list to take a position on whether an adequate account must handle dispositions that come in degrees, dispositions that are probabilistic rather than all-or-nothing, and the difference between a disposition a thing has in itself and one it has only in relation to its surroundings; include any of these only if it genuinely earns its place as a requirement. For each requirement, say whether it is non-negotiable or a preference of a particular camp. Then say which requirements pull against one another and how a theory is supposed to live with that, and which single requirement does the most to eliminate candidate theories. A brief scorecard of the main contenders against the list is welcome, but the list is what I want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The metaphysics of dispositions (powers, propensities, capacities).
      *   **Problem:** The user recognizes the failure of the simple conditional analysis (SCA) ("X is disposed to M if S, then X would M if S"). They cite finks (disappearing dispositions), antidotes (masking), and mimics (external causes).
      *   **Goal:** A "requirements list" for an adequate theory of dispositions *before* looking at specific theories.
      *   **Specific Constraints:**
          *   Must specify cases to classify correctly.
          *   Must specify distinctions not to collapse.
          *   Must specify scientific results not to contradict.
          *   Must take a position on: degrees, probability, intrinsic vs. relational (include only if they *genuinely earn their place*).
          *   For each requirement: Label as "Non-negotiable" or "Preference of a particular camp."
          *   Identify tensions/trade-offs between requirements.
          *   Identify the single most eliminative requirement.
          *   Include a brief scorecard of main contenders (but keep the focus on the list).
          *   Tone: Philosophical, rigorous, ontological (not just linguistic).

  2.  **Deconstruct the Core Problem (The SCA Failure):**
      *   The user already knows about Finks (Martin), Antidotes/Masks (Johnston), and Mimics.
      *   The task is to generalize these into *requirements* for a theory, not just list counterexamples.
      *   The user wants to know what a theory *must* do to count as a theory of *real* dispositions, not just useful talk.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Intrinsic Basis.* The user mentions the "wired glass" case. This suggests the disposition must depend on the object's internal structure, not just external circumstances. *Status:* Non-negotiable for realist accounts, but Humeans might fight this. Let's call it "Intrinsic Grounding."
      *   *Requirement 2: Causal Relevance.* Dispositions must explain *why* things happen. If the powder kills only because someone adds toxin, the powder isn't poisonous. The disposition must be the *source* of the manifestation. *Status:* Non-negotiable.
      *   *Requirement 3: Stability under Interference.* The antidote case. The disposition exists even if masked. The theory must distinguish between *having* the power and *manifesting* the power. *Status:* Non-negotiable.
      *   *Requirement 4: Degrees and Probability.* The prompt asks me to decide if this earns its place. Science (quantum mechanics, toxicology, materials science) treats these as graded/probabilistic. A binary account fails science. *Status:* Non-negotiable (due to scientific constraint).
      *   *Requirement 5: Relational vs. Intrinsic.* The prompt asks about this. Is fragility intrinsic? Some say yes (microstructure), some say no (requires a striker). A robust theory needs to specify the *stimulus conditions* without making the disposition *wholly* relational in a way that dissolves the property. *Status:* Non-negotiable to distinguish, but the *resolution* is debated. I will frame it as a requirement to *account for the distinction*, not necessarily to pick one side.
      *   *Requirement 6: Temporal Persistence.* Dispositions persist through time even when not manifesting. *Status:* Non-negotiable.
      *   *Requirement 7: Scientific Integration.* Cannot contradict physics/chemistry (e.g., conservation laws, causal closure). *Status:* Non-negotiable.

  4.  **Refining the Requirements (Checking against "Non-negotiable" vs. "Camp Preference"):**
      *   *Realism vs. Anti-Realism:* The user says "I am after what dispositions really are, not merely a tidy way of talking." This rules out pure instrumentalism/conditional analysis as the *final* answer. So, Ontological Commitment is non-negotiable for *this* user's query.
      *   *Degrees/Probability:* Quantum mechanics makes probability non-negotiable. Toxicology makes degrees non-negotiable.
      *   *Intrinsic vs. Relational:* This is tricky. Lewis argued for causal bases (intrinsic). Others argue dispositions are essentially relational. I should frame the requirement as "Must explicate the relationship between the bearer's base and the stimulus," rather than forcing "Intrinsic only." However, the "wired glass" example implies the *source* must be internal. I will make "Internal Causal Base" a non-negotiable requirement to handle the mimic/fink cases.

  5.  **Identifying Tensions:**
      *   *Intrinsic Base vs. Relational Nature:* If a disposition is defined by what it *does* (manifestation), it looks relational. If it's defined by what it *is* (base), it looks categorical. Tension between "Identity" and "Function."
      *   *Probability vs. Determinism:* If dispositions are real powers, do they determine outcomes or just incline? Tension with causal closure of physics.
      *   *Specificity vs. Generality:* A theory too specific (handles finks) might be ad hoc. A theory too general might miss the nuance.

  6.  **Identifying the "Most Eliminative" Requirement:**
      *   The "Causal Basis/Internal Grounding" requirement kills pure conditional analyses and pure relational accounts. It forces an ontology of properties.
      *   Actually, the "Scientific Integration" (specifically regarding probability/degrees) kills classical Aristotelian essentialism that is too rigid.
      *   But the strongest filter is usually **The Distinction between Possession and Manifestation (Masking/Finking).** This is what killed the SCA. It requires a theory to separate the *existence* of the property from the *counterfactual truth*. This eliminates reductionist accounts. Let's go with "Possession/Manifestation Distinction."

  7.  **Drafting the Scorecard:**
      *   *Simple Conditional Analysis:* Fails (User knows this).
      *   *Lewis's Reformed Conditional Analysis:* Handles finks/masks via "causal base," but arguably circular or still too conditional.
      *   *Causal Powers Realism (Choi, Martin, Mumford):* Good on ontology, struggles with integration into standard physics.
      *   *Humean Best Systems:* Denies dispositions are real, treats them as summaries. Fails the "what they really are" constraint.

  8.  **Review against Constraints:**
      *   *Degrees/Probability:* I need to explicitly justify including this. Justification: Toxicology (LD50) and Quantum Mechanics. It's not a preference; it's empirical data.
      *   *Intrinsic/Relational:* Justification: The "mimic" case shows external relations aren't enough. The "stimulus" requirement shows pure intrinsicism isn't enough. The theory must navigate this.
      *   *Tone:* Keep it analytical, not textbook-summary.

  9.  **Final Polish:**
      *   Ensure the distinction between "Non-negotiable" (metaphysical/empirical necessity) and "Camp Preference" (e.g., Armstrong vs. Mumford on categorical bases) is clear.
      *   Make sure the "Tensions" section is substantive.
      *   Check the "Most Eliminative" claim.

      *(Self-Correction during drafting)*: I initially thought about making "Intrinsic Base" non-negotiable. But some modern dispositionalists argue dispositions are fundamental and *don't* have a categorical base. So, requiring a "categorical base" is a camp preference (Lewis/Armstrong). Requiring a "ground" (whether categorical or pure power) is non-negotiable. I must be precise here. The requirement is **Ontological Grounding**, not necessarily Categorical Grounding.

      *(Refining Probability)*: Is probability non-negotiable? If the world is deterministic, maybe not. But given current physics, a theory of dispositions *must* be compatible with indeterminism. So, "Compatibility with Probabilistic Manifestation" is non-negotiable.

      *(Refining Intrinsic/Relational)*: The prompt asks me to include these *only if they genuinely earn their place*. Do they? Yes, because the user's own examples (wired glass vs. mimic powder) turn on exactly this distinction. So they earn their place.

  10. **Final Structure:**
      *   Introduction (acknowledging the SCA failure).
      *   The Requirements List (numbered, with reasoning and status).
      *   Tensions and Trade-offs.
      *   The Most Eliminative Requirement.
      *   Scorecard of Contenders.

      *(Final check on "Non-negotiable" vs "Preference")*:
      *   Non-negotiable: Must align with science, must handle finks/masks/mimics, must distinguish possession from manifestation.
      *   Preference: Whether the base is categorical or pure power, whether dispositions are fundamental or derivative.

