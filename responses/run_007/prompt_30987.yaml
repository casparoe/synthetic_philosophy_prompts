answer: |-
  There is a single principle that reconciles your intuitions with the mathematics of decision theory. It is the **Principle of Instrumentalism**.

  This principle states: **Information has no value in itself; it is only valuable as a tool for selecting actions.**

  When you apply this principle, you realize that your gut verdicts are mostly correct about *human welfare*, but you are holding Good's Theorem responsible for things it never promised to explain. Good's Theorem is not a theorem about happiness, truth, or psychological well-being. It is a theorem about **decision capacity**.

  ### What Good's Theorem Actually Claims

  I.J. Good's Theorem (1967) proves that for a rational Bayesian agent, the **expected utility of acting *after* observing free information is always greater than or equal to the expected utility of acting *before* observing it.**

  Crucially, the theorem relies on three strict assumptions that your cases often violate:
  1.  **Rational Updating:** The agent updates beliefs correctly (no panic, no cognitive bias).
  2.  **Stable Preferences:** The agent's utility function (what they want) does not change upon receiving the information.
  3.  **Fixed Action Set:** The information changes the *probabilities* of outcomes, but it does not change which *actions* are available to the agent.

  If these assumptions hold, information can never be instrumentally bad. You can always ignore it if it's useless, and you can use it if it helps. Therefore, the *option* to have it is always non-negative.

  ### Reconciling Your Cases

  Here is how the Principle of Instrumentalism sorts your seven verdicts.

  **1. The Gas Station (Instrumental Good)**
  *   **Verdict:** Good.
  *   **Analysis:** This is the textbook case. The information changes your action (drive here, not there), leading to a better outcome. Good's Theorem applies perfectly.

  **2. The Panicking Investor (Reasoning Error)**
  *   **Verdict:** Info neutral, reasoning bad.
  *   **Analysis:** You are correct to blame the updating. Good's Theorem assumes the investor *would* update rationally. If they panic, they violate Assumption #1. The information wasn't bad; the algorithm running the brain was buggy.

  **3. The Fear of Flying (Reasoning Error)**
  *   **Verdict:** Info neutral, reasoning bad.
  *   **Analysis:** Same as above. Driving is statistically more dangerous. A rational agent (Assumption #1) would see the 1-in-10-million risk as negligible compared to the drive. The harm came from irrational risk weighting, not the data.

  **4. The Terminal Patient (Intrinsic Bad)**
  *   **Verdict:** Info instrumentally neutral, intrinsically bad.
  *   **Analysis:** Here is where you must refine your view. You say the information is "genuinely bad." Under Good's Theorem, if the information changes no actions (no treatment available), its **instrumental value is zero**. It is not negative.
      *    However, if "knowing" causes misery, then "knowing" enters the utility function directly. This violates Assumption #2 (Stable Preferences/Utility independent of belief).
      *   **Correction:** You don't have to drop the verdict that the patient is better off *not knowing*. But you must drop the idea that this contradicts Good's Theorem. Good's Theorem says the *option* to know is non-negative. Since the patient can decline, they exercise that option to maximize utility. The information itself is instrumentally useless, but hedonically costly.

  **5. The Recovering Addict (Preference Change)**
  *   **Verdict:** Info instrumentally neutral, structurally dangerous.
  *   **Analysis:** You note they would "update accurately." But if knowing the location makes relapse inevitable, their preferences or constraints have changed upon receipt of info (violating Assumption #2). They are no longer the same agent who wanted sobriety.
      *   **Correction:** Similar to the patient. It is rational to avoid the info *ex-ante* to protect the *ex-post* self. Good's Theorem supports avoiding the info if the cost of "knowing" (relapse) outweighs the benefit. The info isn't "bad" in a vacuum; it's a trigger that alters the agent's capability to act on their prior preferences.

  **6. The Manager (Constraint Change)**
  *   **Verdict:** Info changes the game.
  *   **Analysis:** You are exactly right. This violates Assumption #3 (Fixed Action Set). The information didn't just change probabilities; it removed an option (promote without review) via company policy. Good's Theorem does not apply when the rules of the game change based on what you learn.

  **7. The Cheating Spouse (Revealing Truth)**
  *   **Verdict:** Info Good.
  *   **Analysis:** The misery comes from the state of the world (the cheating), not the information. The information allows the agent to align their actions with reality. This is consistent with Instrumentalism.

  ### Which Verdict Must You Drop?

  You do not need to drop any of your conclusions about whether the *people* ended up better or worse off. Your intuitions on welfare are sound.

  However, you **must drop the verdict that Cases 4 and 5 are counterexamples to Good's Theorem.**

  Your intuition says: "The information made them worse off, therefore Good's Theorem is limited."
  The Principle of Instrumentalism says: "Good's Theorem only guarantees information won't hurt your *decision-making capacity*. It does not guarantee information won't hurt your *feelings* or change your *preferences*."

  In Cases 4 and 5, the information has a **negative intrinsic cost**. Good's Theorem assumes information is "free." If knowing causes pain or triggers addiction, the information is not free; it has a price. Once you account for that price, the math holds: the cost outweighed the benefit, so the rational choice was to decline. Good's Theorem remains unviolated; it simply doesn't cover hedonic costs.

  ### The Genetic Test Case

  **The Scenario:** A free, accurate genetic test for a disease with no treatment. The result changes no actions but might cause unpredictable psychological distress.

  **The Verdict:** Under the Principle of Instrumentalism, the **instrumental value is zero**. Since there is no treatment, there is no action to optimize. You cannot drive to a cheaper gas station; you cannot invest differently.

  However, because human utility functions include peace of mind, the **intrinsic value is likely negative**.
  *   **If you are a strict Bayesian agent:** You should be indifferent. Information never hurts decision capacity.
  *   **If you are a human:** You should likely **decline the test**.

  **Why?** Because Good's Theorem maximizes *Expected Utility*, and for humans, "Utility" includes psychological state. If the probability of distress $\times$ magnitude of distress is greater than the probability of relief $\times$ magnitude of relief, the expected utility of testing is negative.

  **Conclusion:** You should tell the person that the information is **instrumentally useless but potentially hedonically harmful.** It is rational to remain ignorant. This does not violate Good's Theorem; it simply acknowledges that for humans, "ignorance is bliss" is a valid utility function. Good's Theorem tells us we should never pay to avoid information *if* we are purely decision-machines. But since we are feeling creatures, we are rational to pay (in opportunity cost) to preserve our peace of mind.
