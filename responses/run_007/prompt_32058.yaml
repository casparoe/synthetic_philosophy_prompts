prompt: |-
  I'm a PhD student in decision theory and I'm TAing a graduate seminar on formal epistemology this spring. The group is small—nine or ten PhD students, mostly philosophy with a couple of econ people—and we have one 90-minute session to spend on Good's theorem, the result that cost-free information can't have negative expected value for an expected-utility maximizer, even though you can be worse off ex post once you see a particular signal. I want the session to be a game, not a lecture. The thing I want students to actually feel is the tension between the ex ante and ex post perspectives: that a free clue is never bad in expectation if you're free to ignore it, but that doesn't mean every clue turns out well, and paying for a clue can still be a bad deal. So I'm looking for a runnable classroom activity—rules, materials, a payoff scheme that doesn't need real money, and a debrief. The game should force them through a bunch of repeated decisions under uncertainty where a signal is available, so they generate the asymmetry themselves before we name the theorem. In the debrief I want the moments of the game mapped onto the formal parts of the result (the max over actions, the expectation over signals, why Jensen's inequality or the law of total expectation is doing the work). Also tell me what will predictably go wrong the first time I run it—I'm worried about people confusing the ex post outcome with the ex ante value, or bidding for clues just because they're curious—and be honest about which part of the theorem the activity can't make them feel and I'll have to supply myself. You're an expert on Bayesian decision theory and teaching formal epistemology; start by brainstorming two or three candidate mechanics, then committ to the best one and write it up in enough detail that I could run it cold on Friday.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **User:** PhD student in decision theory, TAing a grad seminar in formal epistemology.
      *   **Audience:** 9-10 PhD students (mostly philosophy, some econ).
      *   **Topic:** Good's Theorem (cost-free information has non-negative expected value for EU maximizers).
      *   **Goal:** A 90-minute *game-based* session (not a lecture).
      *   **Key Learning Objective:** Feel the tension between *ex ante* (expected value of information $\ge$ 0) and *ex post* (realized utility can be lower than if you hadn't looked). Also, understand that *costly* information can be bad.
      *   **Requirements:** Runnable activity (rules, materials, payoff scheme), debrief plan mapping game to formalism, prediction of failure modes, honest assessment of limitations.
      *   **Tone:** Expert, pedagogical, precise, practical.

  2.  **Deconstruct Good's Theorem for Pedagogical Purposes:**
      *   *Core Claim:* $E[\max_a E[U|S]] \ge \max_a E[U]$.
      *   *Intuition:* You can always ignore the signal. If the signal suggests a worse action than your prior optimal, you stick with the prior optimal. Thus, the option to update *weakly* dominates not updating.
      *   *The "Tension":* Ex post, you might get a signal that makes you switch actions, and that specific action turns out to yield lower utility than the original action *would have* yielded in that specific state. But you couldn't know that ex ante.
      *   *The "Cost" aspect:* If information costs $c > 0$, and the Value of Information (VoI) is 0 (or $< c$), buying it is irrational.

  3.  **Brainstorming Game Mechanics:**

      *   *Idea 1: The Urn Guessing Game (Classic).*
          *   Setup: Two urns (Red/Blue bias). Draw a ball (signal). Guess urn.
          *   Pros: Simple, standard Bayesian updating.
          *   Cons: Often feels too abstract. Hard to generate "ex post regret" strongly because the "state" is fixed but unknown. If you guess wrong, was it the signal's fault or bad luck? Hard to distinguish "signal misled me" from "signal was uninformative."
          *   VoI: Usually positive here unless the signal is completely uncorrelated.

      *   *Idea 2: The Investment/Market Game.*
          *   Setup: Invest in Asset A or B. State determines return. Signal gives hint about state.
          *   Pros: Econ students like it. Easy to assign point values.
          *   Cons: Can get bogged down in risk aversion (though we assume EU).
          *   VoI: Easy to calculate.

      *   *Idea 3: The "Box and Key" (or "Door and Prize") with a Twist.*
          *   Setup: Three boxes, one prize. You pick one. Host offers a signal (opens an empty box? No, that's Monty Hall).
          *   Better Setup: Two states ($S_1, S_2$). Two actions ($A_1, A_2$). Payoff matrix such that $A_1$ is optimal under prior, but signal might suggest $A_2$.
          *   *Crucial Twist:* We need to reveal the *state* after the action so students can see "If I hadn't looked, I would have stuck with $A_1$ and won more in this specific round."
          *   *Mechanism:* Repeated rounds. Some rounds "Free Signal," some "No Signal," some "Costly Signal."
          *   *Payoff:* Points converted to... something (candy, privilege, just glory).

      *   *Selection:* Idea 3 is the strongest for *feeling* the theorem. We need a binary choice where the prior strongly favors one option, but the signal is noisy enough to sometimes flip the decision, and the realization sometimes punishes that flip.
      *   *Refinement:* Let's call it "The Forecaster's Dilemma."
      *   *States:* Rain (R) or Shine (S).
      *   *Actions:* Umbrella (U) or No Umbrella (N).
      *   *Payoffs:*
          *   Rain + Umbrella = 10 (Safe)
          *   Rain + No Umbrella = 0 (Soaked)
          *   Shine + Umbrella = 5 (Burdened)
          *   Shine + No Umbrella = 10 (Free)
      *   *Prior:* $P(R) = 0.4$. Expected Utility of U = 10. Expected Utility of N = $0.4(0) + 0.6(10) = 6$. So Prior Optimal = Umbrella.
      *   *Signal:* A weather report (Accurate 75% of the time).
      *   *The Trap:* If signal says "Shine," you switch to No Umbrella. If it actually Rains, you get 0. If you had ignored the signal, you would have taken Umbrella and got 10. *This is the ex post regret.*
      *   *The Theorem:* But sometimes signal says "Shine" and it Shines (get 10 vs 10). Sometimes signal says "Rain" (stick with U, get 10). On average, the signal helps or does nothing.

  4.  **Developing the Chosen Mechanic ("The Umbrella Game"):**
      *   Need to ensure the math works out so VoI > 0 but Ex Post Regret is possible.
      *   Need a "Costly" round to show VoI < Cost.
      *   Need a "Forced Ignorance" round to compare against.
      *   *Materials:* Deck of cards or pre-generated slips of paper for States and Signals.
      *   *Currency:* "Epistemic Utility Points" (EUPs). Winner gets first pick of seminar snacks or a bottle of wine.

  5.  **Drafting the Plan:**
      *   **Phase 1: Setup (15 mins).** Explain payoffs, prior, signal structure.
      *   **Phase 2: The Baseline (15 mins).** No signal. Just act on prior. Establish the benchmark.
      *   **Phase 3: Free Information (30 mins).** Signal available. Choose to look or ignore (though rational to look). Record outcomes.
      *   **Phase 4: Costly Information (15 mins).** Signal costs points. Some should buy, some shouldn't (depending on cost setup). Let's make cost high enough that it's negative EV.
      *   **Phase 5: Debrief (15 mins).** Map to Good's Theorem.

      *Wait, 90 minutes is tight for 4 phases.* Let's streamline.
      *   Combine Baseline and Free Info into a comparative structure.
      *   Actually, better: Everyone plays every round.
      *   Round Type A: Blind (No signal).
      *   Round Type B: Free Signal.
      *   Round Type C: Costly Signal (Cost > VoI).
      *   This allows within-subject comparison.

      *Correction on Good's Theorem Nuance:* Good's theorem says $E[V|Info] \ge E[V|NoInfo]$. It doesn't strictly require a "Blind" round in the game, but having one helps the *feeling*. The crucial part is the *Ex Post* regret in the Free Signal round.
      *   Let's focus heavily on the Free Signal round to generate the data for the theorem, then use the Costly round to show the limit.
      *   Actually, the prompt asks to feel the tension between Ex Ante and Ex Post.
      *   *Revised Plan:*
          1.  Setup & Payoff Matrix (15 min).
          2.  Round 1-5: Free Signal (Generate data, experience regret) (30 min).
          3.  Round 6-8: Costly Signal (Show negative value) (20 min).
          4.  Debrief/Formalism (25 min).

  6.  **Addressing Failure Modes:**
      *   *Confusion:* Students might think "I lost points because I looked." Need to emphasize *averages*.
      *   *Curiosity:* They might buy costly info just to know. Need to penalize this in debrief (revealed preference vs. stated preference).
      *   *Risk Aversion:* If payoffs are non-linear (e.g., losing everything), EU max assumption breaks. Keep payoffs linear and small relative to endowment.
      *   *Calculation:* They might not update correctly. Provide a lookup table or calculator to remove computational friction, focusing on the *decision* to acquire info. *Decision:* Provide a "Bayes Calculator" sheet so the game tests the *value of information*, not their ability to do arithmetic.

  7.  **Addressing Limitations:**
      *   The game can't prove the theorem (infinite trials needed).
      *   The game assumes risk neutrality (points = utility). Need to state this assumption.
      *   The game assumes the signal structure is known (objective chance). Good's theorem holds for subjective prob too, but the game needs fixed frequencies to run smoothly.

  8.  **Refining the Payoff/State Structure:**
      *   State: $H$ (High) or $L$ (Low). $P(H) = 0.5$.
      *   Action: $Bet_H$ or $Bet_L$.
      *   Payoff: Match state = 100 pts. Mismatch = 0 pts.
      *   Prior Optimal: Indifferent (EV = 50).
      *   *Wait, need a strict prior optimal to show "ignoring" is an option.*
      *   Let's go back to Umbrella.
      *   State: Rain (0.4), Sun (0.6).
      *   Action: Umbrella (Payoff 10 always), No Umbrella (Payoff 0 if Rain, 20 if Sun).
      *   Prior EV(Umbrella) = 10. Prior EV(No Umbrella) = 12.
      *   *Correction:* Make Umbrella the prior optimal to match the "ignore the signal" intuition better.
      *   State: Rain (0.4), Sun (0.6).
      *   Action: Stay Home (10 always). Go Out (0 if Rain, 25 if Sun).
      *   Prior EV(Stay) = 10. Prior EV(Go) = $0.6 \times 25 = 15$.
      *   Okay, let's make Stay Home the safe option that is *not* optimal ex ante, but optimal ex post in some cases? No, Good's theorem relies on the ability to *stick* with the prior optimal.
      *   *Standard Setup:*
          *   Action $A_1$ (Safe): Payoff 10 regardless.
          *   Action $A_2$ (Risky): Payoff 0 if State 1, Payoff 30 if State 2.
          *   Prior $P(State 2) = 0.5$.
          *   EV($A_1$) = 10. EV($A_2$) = 15. Optimal = $A_2$.
          *   Signal: Correlated with State.
          *   If Signal suggests State 1, you might switch to $A_1$.
          *   If you switch to $A_1$ and State 2 occurs, you get 10. If you had stuck with $A_2$, you would have gotten 30. *This is the regret.*
          *   But if Signal suggests State 1 and State 1 occurs, you get 10 (vs 0 if you stuck). *This is the gain.*
          *   Good's Theorem says Gains $\ge$ Regrets in expectation.

      *   *Wait, simpler:*
          *   Action $A_{prior}$ is optimal based on prior.
          *   Signal can convince you to switch to $A_{other}$.
          *   If you switch and are wrong, you regret looking.
          *   If you switch and are right, you gain.
          *   If signal confirms prior, you stick (no change).
          *   This perfectly illustrates "Option to ignore."

      *   *Finalized Payoff Matrix:*
          *   States: Red (40%), Blue (60%).
          *   Actions: Bet Red, Bet Blue.
          *   Payoff: Correct = 100, Incorrect = 0.
          *   Prior Optimal: Bet Blue (EV = 60). Bet Red (EV = 40).
          *   Signal: "Predicts Red" or "Predicts Blue". Accuracy = 70%.
          *   If Signal = Red: Posterior $P(Red|Sig_R)$ might be high enough to switch to Bet Red.
          *   If you switch to Bet Red, and State is Blue: You get 0. If you ignored signal (Bet Blue), you get 100. *Regret.*
          *   If you switch to Bet Red, and State is Red: You get 100. If you ignored signal (Bet Blue), you get 0. *Gain.*
          *   If Signal = Blue: You stick with Bet Blue. (Signal confirms prior).
          *   This works.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the pedagogical challenge.
      *   **Candidate Mechanics:** Briefly list 3 ideas (Urn, Investment, Binary Prediction).
      *   **Selection:** Binary Prediction ("The Red/Blue Game").
      *   **Detailed Run-Through:**
          *   Prep (Materials).
          *   Setup (Payoffs, Priors, Signal Structure).
          *   Rounds (Free Info, Costly Info).
          *   Scoring.
      *   **Debrief Guide:** Mapping game moves to $E[\max E[U|S]] \ge \max E[U]$.
      *   **Failure Modes:** Curiosity, Risk Aversion, Calculation errors.
      *   **Limitations:** What the TA needs to lecture.

  10. **Refining the "Costly" Aspect:**
      *   To show paying for clues can be bad, set the cost > VoI.
      *   Calculate VoI roughly.
      *   Prior EV = 60.
      *   With Signal (70% acc):
          *   $P(Sig_R) = P(Sig_R|R)P(R) + P(Sig_R|B)P(B) = 0.7(0.4) + 0.3(0.6) = 0.28 + 0.18 = 0.46$.
          *   $P(Sig_B) = 0.54$.
          *   If $Sig_R$: $P(R|Sig_R) = 0.28 / 0.46 \approx 0.61$. Switch to Bet Red. EV = 61.
          *   If $Sig_B$: $P(B|Sig_B) = (0.7 \times 0.6) / 0.54 = 0.42 / 0.54 \approx 0.78$. Stick Bet Blue. EV = 78.
          *   Total EV with Info = $0.46(61) + 0.54(78) = 28.06 + 42.12 = 70.18$.
          *   VoI = $70.18 - 60 = 10.18$ points.
      *   So, set Cost of Info = 15 points. Rational choice = Don't buy. If they buy, they lose EV.
      *   *Wait, for the "Free" round, Cost = 0.*
      *   *For the "Costly" round, Cost = 15.*
      *   This creates the contrast.

  11. **Final Polish:**
      *   Ensure the tone is appropriate for PhD students (don't over-explain basics, focus on the mechanism).
      *   Make sure the "Ex Post Regret" is highlighted in the score sheet.
      *   Add a specific instruction to record "What would I have done without the signal?" to make the counterfactual salient.

  12. **Self-Correction on "Feeling" the Theorem:**
      *   The theorem is about *expectations*. A 90-minute class with 10 students won't generate enough trials for the Law of Large Numbers to visibly converge to the theorem's inequality in the aggregate data *during* class.
      *   *Mitigation:* I must explicitly warn the TA that the *empirical* average in the room might violate the theorem due to variance. The "feeling" comes from the *structure* of the choice (the option to ignore), not necessarily the raw score totals. The debrief must bridge the gap between the noisy data and the clean math.
      *   *Better:* Use a "Class Aggregate" sheet. Sum everyone's points. It smooths variance.

  13. **Final Review against constraints:**
      *   90 mins? Yes.
      *   Small group? Yes.
      *   No real money? Yes (points).
      *   Debrief mapping? Yes.
      *   Failure modes? Yes.
      *   Limitations? Yes.

      *Let's write it.*
answer: |-
  Here is a plan for a 90-minute seminar session designed to make Good's Theorem visceral.

  ### Part 1: Candidate Mechanics

  Before committing, here are three mechanical approaches I considered, with reasons for rejection/selection.

  1.  **The Urn Draw (Classic Bayesian):** Students guess which of two urns a ball came from. They can pay to see a second ball.
      *   *Critique:* Too abstract. The "state" is fixed but unknown, making it hard to distinguish between "the signal misled me" and "I just got unlucky." It doesn't sharply separate the *action* choice from the *information* choice.
  2.  **The Market Prediction:** Students trade assets based on signals.
      *   *Critique:* Introduces market equilibrium dynamics (prices adjust to information) which muddies the individual decision-theoretic point. Good's theorem is about a single agent's decision problem, not market efficiency.
  3.  **The Binary Action Game (Selected):** A repeated decision problem with two states, two actions, and a noisy signal.
      *   *Rationale:* This isolates the *Value of Information (VoI)*. By forcing a choice between "Act on Prior" vs. "Act on Signal," and then revealing the counterfactual ("What would you have scored if you ignored the signal?"), we generate the specific ex post regret required to understand the theorem's tension.

  ---

  ### Part 2: The Activity Plan ("The Red/Blue Game")

  **Time:** 90 Minutes
  **Group:** 9–10 PhD Students
  **Materials:**
  *   Projector/Whiteboard.
  *   Printed "Decision Sheets" (one per student, per round).
  *   A "State Deck" (pre-generated list of States and Signals to ensure probabilities hold, rather than rolling dice live).
  *   Candy or a bottle of wine for the winner (symbolic utility).

  #### 1. Setup & Payoff Structure (15 Minutes)
  Do not mention Good's Theorem yet. Frame this as a test of decision-making under uncertainty.

  **The World:**
  *   There are two States of the World: **Red (R)** and **Blue (B)**.
  *   **Prior Probability:** $P(R) = 0.4$, $P(B) = 0.6$.
  *   **Your Actions:** You must bet on **Red** or **Blue** each round.
  *   **Payoffs:**
      *   Match State: **100 Points**.
      *   Mismatch State: **0 Points**.
  *   **Baseline:** Without information, the rational choice is **Bet Blue** (Expected Value = 60). Betting Red has EV = 40.

  **The Signal (The "Clue"):**
  *   Before betting, you may consult a Forecast.
  *   **Accuracy:** The Forecast is correct 70% of the time.
      *   $P(\text{Sig}_R | R) = 0.7$
      *   $P(\text{Sig}_B | B) = 0.7$
  *   **Crucial Rule:** You are *never forced* to follow the signal. You can look at it and still Bet Blue.

  **The Currency:**
  *   Points are tallied on the board.
  *   Top score wins the prize.
  *   **Assumption:** We assume everyone is risk-neutral over these points (Utility = Points).

  #### 2. Phase 1: Free Information (30 Minutes)
  *Goal: Generate ex post regret.*

  *   **Rounds:** 10 Rounds.
  *   **Cost:** 0 Points.
  *   **Procedure:**
      1.  Distribute Decision Sheet.
      2.  Student chooses: **Ignore** (Bet immediately) or **Look** (See Signal, then Bet).
      3.  *If they Look:* Record the Signal (e.g., "Predicts Red"). Record their Final Bet.
      4.  **Reveal State:** Announce the actual State (e.g., "Actual: Blue").
      5.  **Score:** Award points for the Final Bet.
      6.  **Counterfactual Score:** *Crucial Step.* On the sheet, they must also calculate: "What would I have scored if I had ignored the signal and just Bet Blue (the prior optimal)?"
          *   If Actual was Blue: Counterfactual = 100.
          *   If Actual was Red: Counterfactual = 0.
      7.  **Regret Calculation:** $Regret = \text{Counterfactual Score} - \text{Actual Score}$.
          *   If Regret > 0, they lost points *because* they looked.
          *   If Regret < 0, they gained points *because* they looked.

  *   **TA Note:** Use a pre-generated list of 10 State/Signal pairs that roughly matches the probabilities (e.g., 4 Reds, 6 Blues; 70% signal accuracy). Do not randomize live; you need the math to hold for the debrief.

  #### 3. Phase 2: Costly Information (20 Minutes)
  *Goal: Demonstrate negative VoI.*

  *   **Rounds:** 5 Rounds.
  *   **Cost:** **15 Points** to look at the Signal. (Calculated to be higher than the theoretical VoI of ~10 points).
  *   **Procedure:** Same as Phase 1, but subtract 15 points from the round score if they choose **Look**.
  *   **Expectation:** Rational agents should choose **Ignore**. If they choose **Look**, they will likely end Phase 2 with lower scores than Phase 1, despite having *more* information.

  #### 4. The Debrief: Mapping Game to Theorem (25 Minutes)
  *Goal: Formalize the intuition.*

  Draw the following on the board and map the game data to it.

  **1. The Ex Ante Claim (Good's Theorem):**
  $$E[\max_a E[U|S]] \ge \max_a E[U]$$
  *   **RHS ($\max_a E[U]$):** This is your **Baseline**. In the game, this is "Always Bet Blue." (EV = 60).
  *   **LHS ($E[\max_a E[U|S]]$):** This is **Free Info Phase**. You take the max action *after* seeing the signal.
  *   **The Proof Intuition:** Ask the room: "In Phase 1, were you ever forced to take a worse action?"
      *   *Answer:* No. If the signal said "Red" but you didn't trust it, you could have stuck with Blue.
      *   *Conclusion:* The option to update *weakly dominates* the option to ignore. Therefore, the expectation must be higher.

  **2. The Ex Post Tension (The "Regret" Column):**
  *   Ask students to sum their **Regret** column from Phase 1.
  *   Some rows will show positive regret (e.g., Signal said Red, you bet Red, State was Blue. You got 0. If you ignored, you get 100. Regret = +100).
  *   Some rows will show negative regret (Signal said Red, you bet Red, State was Red. You got 100. If you ignored, you get 0. Regret = -100).
  *   **The Lesson:** Good's Theorem is about the *sum* (Expectation), not the *rows* (Realization). You can be locally wrong (ex post) while being globally rational (ex ante).
  *   **Formalism:** This is the Law of Total Expectation. $E[U] = \sum P(s) E[U|s]$. The "bad" signals are weighted by their probability and offset by the "good" signals.

  **3. The Costly Limit:**
  *   In Phase 2, the inequality becomes: $E[\max_a E[U|S]] - Cost \ge \max_a E[U]$.
  *   Since Cost (15) > VoI (~10), the inequality flips.
  *   **Discussion:** Why did anyone buy the info in Phase 2? (Curiosity, overconfidence, misunderstanding VoI). This highlights that Good's Theorem applies to *cost-free* information.

  ---

  ### Part 3: Predictable Failure Modes

  As an experienced TA, here is what will go wrong and how to patch it live:

  1.  **The "Curiosity" Bid:**
      *   *Problem:* In Phase 2 (Costly), students will buy the signal even though the math says not to, simply because they want to know the state.
      *   *Fix:* Call this out in the debrief. "You paid 15 points for consumption utility (curiosity), not instrumental utility (decision improvement). Good's theorem assumes instrumental value only." This is a great philosophical distinction for epistemologists.
  2.  **Risk Aversion:**
      *   *Problem:* If a student has a low score early on, they might treat points non-linearly (desperately risky).
      *   *Fix:* Remind them frequently: "Assume 1 Point = 1 Util. Do not hedge."
  3.  **Calculation Friction:**
      *   *Problem:* Students will waste time calculating posteriors ($P(R|Sig_R)$) during the game.
      *   *Fix:* **Provide a "Cheat Sheet."** Give them a handout that says:
          *   *If Signal = Red: Posterior Prob(Red) = 61%. Optimal Action = Bet Red.*
          *   *If Signal = Blue: Posterior Prob(Blue) = 78%. Optimal Action = Bet Blue.*
          *   *Remove the arithmetic so they focus on the decision to acquire info.*
  4.  **Small Sample Variance:**
      *   *Problem:* With only 10 rounds, the aggregate score of the "Free Info" phase might actually be *lower* than the "Baseline" due to bad luck. This contradicts the theorem empirically.
      *   *Fix:* **Pre-empt this.** In the debrief, say: "If your personal score was lower with info, you experienced variance. Good's Theorem is about *Expected* Value, not *Realized* Value. Let's look at the class aggregate." (Sum everyone's points to smooth the noise).

  ---

  ### Part 4: Limitations (What You Must Supply)

  Be honest with yourself about what the game cannot do. You will need to lecture these points in the final 10 minutes:

  1.  **Subjective Probability:** The game uses objective frequencies (the State Deck). Good's Theorem holds for subjective Bayesian probabilities too. The game simplifies this; you must state that the logic holds even without a "State Deck" if the agent is coherent.
  2.  **Infinite Trials:** The game has 10 rounds. The theorem is asymptotic. You must explain that the "Regret" rows *will not* sum to exactly positive in a small sample, but the *structure* of the choice guarantees the expectation is non-negative.
  3.  **Non-Instrumental Value:** The theorem says information has no negative *instrumental* value. It says nothing about psychological cost (anxiety, curiosity). If a student says "Knowing the state stressed me out," the theorem doesn't apply. You need to define "Utility" strictly as payoff-based in the formalism.
  4.  **The "Ignore" Option:** The theorem relies on the agent being *free* to ignore the signal. If the game rules forced them to follow the signal, the theorem would fail. You must highlight that the *optionality* is the source of the value.

  ### Summary Checklist for Friday
  *   [ ] Print 10 Decision Sheets (with the Counterfactual/Regret column).
  *   [ ] Print 10 "Bayes Cheat Sheets" (Posteriors pre-calculated).
  *   [ ] Prepare the State Deck (10 Free rounds, 5 Costly rounds) to match probabilities.
  *   [ ] Bring a prize (wine/chocolate).
  *   [ ] Whiteboard ready for $E[\max_a E[U|S]] \ge \max_a E[U]$.

  This structure forces them to bet, lose, and ask "Why did I look?" before you ever write a formula. That frustration is the pedagogical hook.
