prompt: |-
  I'm a novelist working on a book about two estranged siblings, one of whom cant forgive the other, and I've been reading around blame and forgiveness. I host a small philosophy podcast, and next weeks guest is a philosopher who defends a broadly Strawsonian account of moral responsibility: the idea that responsibility is best understood through our reactive attitudes (resentment, gratitude, indignation) and the participant stance, and that the truth of determinism wouldn't undermine those attitudes. Could you draft eight to ten interview questions that don't let him just restate the view? I'd like at least one question each on (a) whether determinism really is as irrelevant as the view claims, (b) whether we can step outside the participant stance and ask whether our reactive attitudes are justified, or whether that question is somehow off-limits, (c) how the view handles agents with impaired capacities — and in particular whether they're excused or exempt from the reactive attitudes, and (d) whether the objective stance and the reactive attitudes can genuinely coexist in a single relationship. For each of those, include a follow-up keyed to the answer he's most likely to give, not just 'could you say more.'
