      *   **The Argument:**
          1.  Consequentialism defines rightness by consequences.
          2.  Consequences include remote, chaotic effects (butterfly effect).
          3.  We can't know/probabilize these remote effects.
          4.  Expected value (EV) is undefined because probabilities are missing.
          5.  Therefore, consequentialism yields no verdict on ordinary acts.
          6.  Therefore, consequentialism fails as a guide to action.
      *   **The User's Insight:** This argument seems to "prove too much." It applies to *any* moral theory (deontology, virtue ethics, etc.) because *any* theory requires knowing facts about the act (e.g., is this a lie? is this helping a murderer?), which also depend on remote/unknown consequences.
      *   **The Dilemma:** Either accept radical moral skepticism (no theory works), find a premise that kills consequentialism but saves others (hard), or reject a premise to save moral guidance generally (and consequentialism along with it).
      *   **Goal:** Identify which premise to reject, explain the cost of that rejection, and help the user navigate the trade-off.

  2.  **Deconstruct the Argument's Premises:**

      *   *(1) Definition of Consequentialism:* Standard. Hard to reject without changing the theory.
      *   *(2) Ramification of Consequences:* Empirically plausible (chaos theory, butterfly effect). Hard to deny.
      *   *(3) Epistemic Limitation:* We can't know/probabilize remote effects. Plausible.
      *   *(4) EV Undefined:* Follows from (3) if we require precise probabilities.
      *   *(5) No Verdict:* Follows from (1)-(4).
      *   *(6) Action-Guiding Failure:* If a theory gives no verdict, it doesn't guide. Plausible.

  3.  **Evaluate the "Proves Too Much" Objection:**
      *   The user is right. This is a known problem in meta-ethics called the *problem of cluelessness* (Greco, Greaves, etc.).
      *   If the argument kills consequentialism, it kills *objective* moral theories generally. Even deontology requires knowing if an act *is* a lie. If I say "I will meet you at 5," but a meteor kills me at 4:59, did I lie? If I give money to a charity, but it turns out they fund terrorists (unknown to me), did I do wrong?
      *   *Key Distinction:* Most moral theories distinguish between *objective* rightness (what actually is right given the facts) and *subjective* rightness (what is rational to do given what the agent knows).
      *   The friend's argument attacks *objective* consequentialism. But almost no one expects an agent to have god-like knowledge.

  4.  **Identify the Weak Link:**
      *   **Premise (4) and (5) are the battleground.**
      *   The argument assumes that if we can't know *actual* consequences or calculate *precise* expected utility over the infinite future, we can't make *any* judgment.
      *   **Rejection Strategy 1: Subjective Consequentialism / Reasonable Foreseeability.**
          *   Reject the idea that "consequences" means *all* causal ripples forever.
          *   Instead, rightness is determined by *foreseeable* consequences or *expected* consequences based on available evidence.
          *   *Cost:* Moves away from "maximizing the good" in reality to "maximizing the good" in expectation. Can lead to "blameless wrongdoing" (you did the rational thing, but it turned out terrible).
      *   **Rejection Strategy 2: Interval Probabilities / Imprecise Credences.**
          *   Reject (4). We don't need precise probabilities. We can use ranges. If the range for Act A is overwhelmingly better than Act B in the near term, and the long term is symmetric noise, A wins.
          *   *Cost:* Requires technical decision theory updates; doesn't solve deep symmetry problems (e.g., saving a life now might cause a war later vs. not saving).
      *   **Rejection Strategy 3: The "Common Sense" Epistemic Constraint (The User's Intuition).**
          *   Reject (6) or the inference from (5) to (6). A theory can be true even if hard to apply. Physics is true even if we can't calculate every particle.
          *   *Cost:* Makes morality less "action-guiding" in a strong sense, more of a standard for evaluation.
      *   **Rejection Strategy 4: The "Proves Too Much" Defense (The Best Path).**
          *   Accept that the argument applies to everyone, but deny that this leads to skepticism.
          *   We operate on *reasonable confidence*, not certainty.
          *   If deontology survives cluelessness, consequentialism can too, by adopting similar epistemic norms (subjective rightness).

  5.  **Formulate the Response:**

      *   **Validate the User:** Acknowledge that their "proves too much" intuition is correct and philosophically sophisticated. This is the standard rebuttal to radical cluelessness arguments.
      *   **Pinpoint the Rejection:** The best place to cut is **Premise (4) and (5)** by shifting from *Objective* to *Subjective* Consequentialism (or Expected Consequentialism).
      *   **Explain the Shift:**
          *   Objective Consequentialism (OC): Right act = best actual outcome. (Vulnerable to the argument).
          *   Subjective Consequentialism (SC): Right act = best *expected* outcome given available evidence. (Resistant to the argument).
      *   **Address the "Proves Too Much":**
          *   Deontology also has an Objective/Subjective split.
          *   We judge permissibility based on *reasonable belief*, not omniscience.
          *   If we accept this for Deontology, we must accept it for Consequentialism to avoid skepticism.
      *   **Discuss the Costs:**
          *   **Cost 1: Divergence.** You can do the "right" thing (subjectively) and produce a disaster (objectively). This feels unsatisfying.
          *   **Cost 2: Symmetry Problem.** Sometimes we don't even know the *expected* value (e.g., saving a life might lead to Hitler). This is the "hard" cluelessness that remains.
          *   **Cost 3: Moral Luck.** Your moral status depends on your epistemic position, not just the world.
      *   **Proposed Solution:** Combine Subjective Consequentialism with a "Near-Term Bias" or "Robustness" argument. We ignore the chaotic long-term because it's symmetric noise. We focus on the foreseeable short-term where probabilities *are* grounded.

  6.  **Refine the Argument (Self-Correction/Nuance):**
      *   Wait, the friend's argument specifically targets *Expected Value* in premise (4). It says EV is *undefined*.
      *   I need to explain *why* EV isn't undefined. It's undefined only if you demand precision over infinite time. If you use *imprecise probabilities* or truncate the timeline based on epistemic access, EV becomes defined.
      *   Also, emphasize that *all* action under uncertainty faces this. If we can't buy coffee because we don't know the 100-year consequences, we can't breathe. Pragmatism wins.
      *   **Crucial Point:** The argument conflates *Metaphysical Rightness* (what actually maximizes good) with *Deliberative Rightness* (what I should try to do). Consequentialism is usually a theory of the former, but used for the latter. The fix is to admit it's primarily a criterion of rightness, not necessarily a decision procedure.

  7.  **Final Structure:**
      *   **Validation:** Your "proves too much" instinct is the key.
      *   **The Diagnosis:** The argument attacks *Objective* Consequentialism + *Omniscient* Demands.
      *   **The Fix:** Reject the move from (3) to (4)/(5). Adopt *Subjective Consequentialism* (Maximize Expected Value based on *reasonable* evidence).
      *   **The "Proves Too Much" Resolution:** Show how Deontology faces the exact same issue and solves it the same way (Objective vs. Subjective duties).
      *   **The Cost:** You lose the guarantee that doing the "right" thing leads to the best outcome. You accept moral luck. You accept that "right" means "rationally justified" not "metaphysically optimal."
      *   **Advanced Nuance:** Mention "Cluelessness" (Greco/Greaves) regarding *symmetric* ignorance (saving a life = unknown good/bad). Suggest the "Short-Term Robustness" reply.

  8.  **Drafting the Response:** (Mental check of tone: supportive, analytical, philosophical but accessible.) *Make sure to explicitly state which premise to reject.* I will recommend rejecting the inference from (3) to (4), effectively modifying (1) or the interpretation of "consequences" in (1) to mean "foreseeable consequences" or "expected consequences." Actually, it's better to keep (1) as the criterion of *objective* rightness but deny (6) by saying moral theories guide via *subjective* rightness.
      *   *Wait, simpler:* Reject (4). Expected value *is* defined if we use reasonable epistemic probabilities, not omniscient ones.
      *   *Even better:* Reject the implication of (5). Even if objective verdicts are unknowable, subjective verdicts are knowable and action-guiding.

      Let's go with: **Reject the move from (3) to (5).** We don't need to know *actual* consequences to have a verdict; we need to know *expected* consequences based on available evidence. And yes, this applies to deontology too.

      *Cost:* You have to accept that "Right" has two meanings (Objective vs. Subjective).

      *Wait, one more thing:* The "Symmetry" problem. Even with expected value, if the long-term effects are huge but equally likely to be good or bad, they cancel out. So we focus on the short term. This blocks the "undefined" claim.

