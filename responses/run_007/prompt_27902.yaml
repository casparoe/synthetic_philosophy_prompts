answer: |-
  You have spotted the exact weakness in the argument. Your intuition that it "proves too much" is not just a hunch; it is the standard and most powerful philosophical reply to radical cluelessness arguments.

  If this argument succeeds, it doesn't just kill consequentialism; it kills **moral realism** and **rational agency** altogether. It implies that because we lack omniscience, we cannot act. Since we obviously do act, and obviously hold each other morally responsible, the argument must be blocking something we can legitimately keep.

  Here is the breakdown of where to cut, how to save consequentialism (and deontology), and exactly what you have to pay for that rescue.

  ### 1. Where to Reject: The Move from (3) to (5)

  The fatal step is the inference from **(3) We can't know actual consequences** to **(5) Consequentialism yields no verdict.**

  This step conflates two different concepts of "rightness":
  *   **Objective Rightness:** An act is right if it *actually* produces the best outcome (God's-eye view).
  *   **Subjective Rightness:** An act is right if it is the *most rational choice given the agent's evidence* (Human's-eye view).

  The argument correctly proves that **Objective Consequentialism** is not action-guiding for non-omniscient beings. But almost no consequentialist claims it *is* action-guiding in that sense. Consequentialism is typically a theory of *what makes acts right*, not necessarily a *decision procedure* for how to identify them in real-time.

  **The Rejection:** You reject the claim that a moral theory fails if it cannot provide verdicts based on *unknown* facts. You assert that moral guidance operates on **reasonable epistemic probabilities**, not metaphysical certainties.

  Therefore, **Premise (4) is false.** Expected value is not undefined; it is defined relative to the agent's epistemic state. We don't need the probability distribution of the *universe*; we need the probability distribution of *what we can reasonably foresee*.

  ### 2. Why This Saves Everyone (The Parity Argument)

  You are absolutely correct that this applies to deontology.
  *   **Deontologist:** "Do not lie."
  *   **Skeptic:** "You don't know if your statement will turn out false due to chaotic future facts. You don't know if the person you're talking to is a murderer who will use your truth to kill. Therefore, you don't know if you are lying or aiding murder."

  If the skeptic is right, the deontologist is just as paralyzed as the consequentialist.

  By rejecting the move from (3) to (5), you save **both** theories. You adopt a **Subjective Deontology** just as you adopt a **Subjective Consequentialism**.
  *   **Subjective Deontology:** Do not *intentionally* lie based on the evidence you have.
  *   **Subjective Consequentialism:** Maximize *expected* good based on the evidence you have.

  Both theories retreat from "metaphysical optimality" to "epistemic rationality." This restores moral confidence and blame. We blame people for what they could reasonably foresee, not for butterfly effects they couldn't track.

  ### 3. The Cost: What You Are Paying

  You asked what rejecting this step costs. It is not free. If you take this route to save consequentialism, you must accept three significant philosophical costs:

  #### A. The Divergence of Rightness and Goodness
  You must accept that it is possible to do the "right" thing (subjectively) and produce a terrible outcome (objectively), and vice versa.
  *   **Scenario:** You donate to a charity that looks reputable (high expected value). Unbeknownst to anyone, the charity is a front for a terror group (negative actual value).
  *   **Cost:** Under your revised view, you acted *rightly*, even though you did *harm*. This severs the tight link between morality and actual well-being. Some find this counterintuitive: "How can causing a disaster be the 'right' action?"

  #### B. Moral Luck
  Your moral status becomes dependent on your epistemic environment, not just your will.
  *   **Scenario:** Two drivers run a red light. Driver A hits a pedestrian (bad consequences). Driver B hits no one (neutral consequences).
  *   **Cost:** If you judge based on expected value (both took the same risk), they are equally blameworthy. If you judge based on actual consequences, A is worse. By rejecting the argument, you usually side with "equal blameworthiness," but this conflicts with our deep intuition that outcomes matter. You have to accept that "moral luck" (things outside your control) shouldn't change moral judgment, even if it changes our emotional reaction.

  #### C. The "Hard Cluelessness" Remainder
  Even with subjective expected value, there is a residual problem called **symmetric cluelessness** (identified by philosophers like Hilary Greaves).
  *   **Scenario:** You save a drowning child.
      *   *Short term:* Clearly good (child lives).
      *   *Long term:* The child grows up. Maybe they become a saint, maybe a tyrant. The probabilities are symmetric (50/50 huge good, 50/50 huge bad).
  *   **The Problem:** If the long-term effects are massive and symmetric, they swamp the short-term good in the expected value calculation. The EV of saving the child becomes roughly 0 (or undefined). The EV of walking away is also roughly 0.
  *   **Cost:** To solve this, you must adopt a **discount rate** or a **truncation principle**. You have to argue that *foreseeable* near-term goods outweigh *unforeseeable* long-term risks. You are essentially stipulating that "consequences we can't model don't count fully." This is pragmatic, but it is a philosophical patch, not a derived truth.

  ### 4. How to Argue This to Your Friend

  Here is the script to turn the table:

  1.  **Grant the Skepticism:** "You are right that *Objective* Consequentialism is not action-guiding. We cannot know the infinite causal ripple of our acts."
  2.  **Apply the *Reductio*:** "But your argument proves that *Deontology* is also not action-guiding. I cannot know if telling the truth will aid a murderer due to chaotic future facts. If your argument holds, no moral theory works, and we are all paralyzed."
  3.  **Propose the Solution:** "Since we are not paralyzed, the premise that 'moral theories require omniscience to guide action' must be false. We guide action using **reasonable expectations**, not actual outcomes."
  4.  **Claim Parity:** "Consequentialism handles this exactly like Deontology. We maximize *expected* value based on available evidence, just as Deontologists follow duties based on available evidence. If Deontology survives cluelessness, so does Consequentialism."
  5.  **State the Price:** "The cost is admitting that 'Right' means 'Rationally Justified' rather than 'Metaphysically Optimal.' I am willing to pay that price to keep morality possible. Are you?"

  ### Summary
  Reject the inference that **unknowable actual consequences imply undefined expected value.**
  *   **Benefit:** Saves consequentialism, deontology, and moral agency from skepticism.
  *   **Cost:** You must accept that "doing the right thing" does not guarantee good outcomes, and you must rely on pragmatic truncation of the future to make expected value calculations manageable.

  This is the standard, robust position in modern normative ethics. It concedes the metaphysical point to win the practical war.
