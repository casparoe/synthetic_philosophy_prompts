answer: |-
  **Joint Statement of Adversarial Collaboration: Probability in Everettian Quantum Mechanics**

  **Participants:** The Derivationist (Pro-Deutsch-Wallace) and The Skeptic (Pro-Incoherence Problem)
  **Date:** October 2023
  **Subject:** Status of the Born Rule in Unitary Quantum Mechanics

  ### 1. Agreed Claims
  Both parties endorse the following baseline commitments. Neither party concedes their core position by signing.

  1.  **Ontology:** We assume standard unitary quantum mechanics (EQM) without collapse. The universal wavefunction is the complete physical description.
  2.  **Branching:** Decoherence generates a robust, emergent branching structure where macroscopically distinct outcomes coexist.
  3.  **Empirical Coherence:** For EQM to be viable, it must account for why agents observe statistics matching the Born Rule ($\text{prob} = |\psi|^2$).
  4.  **Decision-Theoretic Link:** Existing derivations (Deutsch-Wallace) successfully demonstrate that a rational agent in an Everettian multiverse, accepting specific axioms, will maximize utility weighted by the Born Rule.
  5.  **Minimal Requirement:** Any solution must explain why an agent should care about branch weights *prior* to measurement, not merely justify post-hoc betting behavior.

  ### 2. Disagreements Table
  *Note on Terminology:* We identify a verbal disagreement regarding the word "probability." The Derivationist defines it functionally (rational credence/betting quotient). The Skeptic defines it ontologically (objective chance/single-outcome uncertainty). **The substantive disagreement begins where the definition ends:** Even if we accept the Derivationist's functional definition, the Skeptic argues the axioms required to derive it are unjustified without presupposing the conclusion.

  | Issue | Neutral Framing | Derivationist Position | Skeptic Position |
  | :--- | :--- | :--- | :--- |
  | **1. Nature of Uncertainty** | Can an agent be uncertain about an outcome when all outcomes occur? | Yes. Subjective uncertainty is coherent via self-locating ignorance regarding which branch "I" will occupy. | No. Knowing the global state eliminates uncertainty. "Uncertainty" is merely a metaphor for caring less about low-weight branches. |
  | **2. Axiomatic Circularity** | Do the decision-theoretic axioms (e.g., Branching Indifference) presuppose the Born Rule? | No. Axioms are structural constraints on rationality independent of physical weights (e.g., "don't care about branching per se"). | Yes. Axioms like Measurement Neutrality are only plausible if one already assumes branch weights don't matter except via Born summation. |
  | **3. Solution Status** | Is the "Probability Problem" solved? | Yes. Recovering the Born Rule as a rationality constraint is sufficient for empirical coherence. | No. Rational betting does not recover objective chance. The theory lacks a truth-maker for probabilistic claims. |

  ### 3. Cruxes
  These are specific sub-questions where resolution would shift credences. We agree on the relevant cases and record our divergent predictions.

  **Crux 1: Justification of Branching Indifference**
  *   **The Case:** An agent faces a choice between a single branching event with payoff $X$ and two branching events with payoff $X$ on all branches.
  *   **The Question:** Is indifference here a requirement of pure rationality, or does it rely on assuming branch count doesn't matter (which implies weights matter)?
  *   **Derivationist Prediction:** Indifference is required by diachronic consistency. An agent who cares about branch count violates preference stability over time.
  *   **Skeptic Prediction:** Indifference is only rational if one assumes the "measure" of existence is conserved. Without assuming measure, caring about branch count is rational. The axiom smuggles in the conclusion.

  **Crux 2: The Zero-Weight Limit**
  *   **The Case:** A branch has amplitude $\epsilon \to 0$. Does the agent owe it any moral or prudential consideration?
  *   **The Question:** Does the discontinuity at zero weight reveal a gap between rational credence and physical structure?
  *   **Derivationist Prediction:** No. Continuity principles in the derivation ensure vanishing weight implies vanishing credence. Rationality demands ignoring null sets.
  *   **Skeptic Prediction:** Yes. Ontologically, the branch exists equally as a structure. Ignoring it requires an extra probabilistic postulate not found in unitary dynamics.

  **Crux 3: The Verbal/Substantive Boundary**
  *   **The Case:** Suppose we agree to define "probability" solely as "the quantity governing rational betting behavior."
  *   **The Question:** Does the Probability Problem vanish, or does it re-emerge as "The Problem of Why Care?"
  *   **Derivationist Prediction:** It vanishes. Physics only needs to guide action. If rationality dictates Born-rule betting, the theory works.
  *   **Skeptic Prediction:** It re-emerges. We still need to explain why *physical* weights constrain *rational* care. If all outcomes happen, why should weights influence care? The link remains unexplained.

  ### 4. Next Steps
  We commit to testing Crux 1 via a formal analysis of diachronic consistency in branching identity. If the Skeptic can construct a diachronically consistent agent who cares about branch count, the Derivationist concedes the axioms are not purely rational. If the Derivationist proves such an agent is necessarily irrational without invoking weights, the Skeptic concedes the circularity charge is weakened.

  ***
  **Signed:**
  *The Derivationist*
  *The Skeptic*
