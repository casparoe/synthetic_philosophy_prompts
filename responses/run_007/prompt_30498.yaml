answer: |-
  1. The theory must accommodate pain asymbolia by allowing sensory pain without unpleasantness, and this desideratum knocks out views defining pain as essentially unpleasant or as a command to escape.
  2. It must preserve the intuition that pain is intrinsically bad for the subject, even when it lacks instrumental disvalue or tissue damage representation.
  3. The account must align with empirical data distinguishing nociceptive processing from limbic system activation, ensuring the badness supervenes on the correct neural substrate.
  4. It must explain why normal subjects find pain motivating without collapsing the distinction between feeling pain and minding pain.
  5. The theory must address the likelihood that Desiderata 1 and 2 are jointly unsatisfiable, forcing a choice between revising folk psychology or accepting contingent badness.
