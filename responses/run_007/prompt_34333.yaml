answer: |-
  Your hypothesis is astute. As a geochemist, you are trained to recognize when a system is underdetermined by the available data. In your field, if two models fit the data equally well, you look for a new isotopic signature or a boundary condition to break the symmetry. In the Sorites debate, the "data" are linguistic intuitions, and the "boundary conditions" are logical constraints.

  Here is the diagnosis of the impasse, structured by the nature of the disagreement, the status of the data, and the prospects for resolution.

  ### 1. The Nature of the Disagreement: Normative vs. Descriptive
  The primary reason for the stalemate is that the participants are not arguing about the same kind of object. The debate is a **category conflict between normative logic and descriptive linguistics.**

  *   **The Logicians (Epistemicists, Supervaluationists):** Their primary commitment is to preserving Classical Logic (bivalence, excluded middle, modus ponens). They treat natural language as a flawed vessel that must be regimented to avoid contradiction. For them, the "heap" is a variable in a logical system. If the logic says there must be a cutoff, there is a cutoff, even if it offends common sense.
  *   **The Phenomenologists (Contextualists, Degree Theorists):** Their primary commitment is to preserving the *feel* of usage. They treat the logic as the flexible component. If common sense says there is no sharp cutoff, then the logic must be altered (to fuzzy logic, or context-sensitive truth) to accommodate that fact.

  **Diagnosis:** This is not a substantive disagreement about the world (facts), nor purely a verbal dispute (definitions). It is a **methodological disagreement about priority.** When logic and usage clash, which one yields?
  *   Epistemicists yield usage (we are just ignorant of the boundary).
  *   Supervaluationists yield bivalence (it's neither true nor false).
  *   Degree Theorists yield classical truth values (it's 0.5 true).

  Because neither side can prove that logic *must* trump usage or vice versa without begging the question, the debate stalls. They are optimizing for different values.

  ### 2. The Status of the "Data": Unstable Intuitions
  In geochemistry, a rock sample does not change its composition because you are tired or because you framed the question differently. In philosophy of language, the "data" (speaker intuitions about borderline cases) are notoriously unstable.

  Experimental philosophy (X-Phi) has demonstrated that intuitions about Sorites series shift based on:
  *   **Framing:** Asking "Is this a heap?" vs. "At what point does it stop being a heap?" yields different cutoffs.
  *   **Order:** Presenting grains in ascending vs. descending order changes the tolerance threshold (hysteresis).
  *   **Stakes:** If calling something a "heap" has a monetary penalty, the threshold shifts.

  **Diagnosis:** The stalemate persists because **there is no stable empirical baseline.** Each theory cherry-picks the intuitions that support it.
  *   Epistemicists point to the intuition that "It must be one or the other."
  *   Degree theorists point to the intuition that "This looks more like a heap than that."
  *   Contextualists point to the intuition that "I wouldn't call it a heap in *this* conversation, but I would in *that* one."

  Since the "data" are fluid, no theory can be falsified by appeal to usage. The disagreement is about **which intuitions count as bedrock** and which are performance errors. This is a dispute about standards, not facts.

  ### 3. Is it Verbal?
  Yes, but in a deep, structural way. It is a verbal dispute about the word **"True."**

  *   For the Epistemicist, "True" means *correspondence to a precise fact*.
  *   For the Supervaluationist, "True" means *super-true across all admissible precisifications*.
  *   For the Degree Theorist, "True" means *a value on a continuum*.

  When they argue, they are talking past each other because they have implicitly redefined the truth predicate to save their preferred system. However, calling it "merely verbal" understates the cost. Each definition of "True" carries a heavy metaphysical tax.
  *   Epistemicism taxes our epistemology (magic cutoffs we can't know).
  *   Supervaluationism taxes our logic (truth value gaps).
  *   Degree theory taxes our ontology (fuzzy objects).

  **Diagnosis:** It is a **verbal dispute with substantive consequences.** They agree on the sentences (e.g., "There is no sharp boundary"), but they disagree on the truth conditions required to assert them.

  ### 4. Can the Stalemate Be Broken?
  Given the diagnosis, here is the honest assessment of potential resolution vectors:

  **A. Formal Results (Low Probability)**
  Logic is a tool, not a discovery mechanism. You can construct a paraconsistent logic, a fuzzy logic, or a classical logic that handles Sorites. Proving one is "correct" is impossible because "correctness" here is defined by the system itself. A formal result would only show internal consistency, not applicability to natural language.

  **B. Psycholinguistic Experiments (Medium Probability)**
  Neuroscience or psycholinguistics could tell us *how* the brain processes borderline cases (e.g., do we recruit conflict-resolution machinery?).
  *   *Impact:* This would likely support **Contextualism** or **Degree Theory** by showing vagueness is a processing feature, not a worldly feature.
  *   *Limitation:* It commits the naturalistic fallacy. Knowing how the brain *does* work doesn't tell us how language *ought* to work logically. An Epistemicist can simply say, "The brain is fuzzy, but truth is sharp." It dissolves the psychological mystery but leaves the logical paradox intact.

  **C. A Change of Question (High Probability)**
  The only way to break the stalemate is to stop asking "Which theory is true?" and start asking "What is the theoretical cost we are willing to pay?"
  This is already happening in the "pluralist" turn. The diagnosis suggests the impasse will end not by a winner emerging, but by **domain partitioning**.
  *   Use Classical Logic/Epistemicism for mathematics and law (where sharp boundaries are required).
  *   Use Degree/Contextual theories for natural language and AI (where flexibility is required).

  ### Verdict
  You are correct that this is several distinct questions stacked on top of each other.
  1.  **Metaphysical:** Are there vague objects? (Most say no).
  2.  **Semantic:** Is vagueness in the reference or the content?
  3.  **Normative:** Should logic govern language, or language govern logic?

  The stalemate is **stable and likely permanent** in its current form because it reflects a fundamental tension in human cognition: we need binary logic for reasoning, but continuous perception for navigation.

  **Recommendation:** Do not look for a "solution" to the paradox. The paradox is not a bug in the system; it is a feature of the interface between binary logic and analog reality. The productive move is to treat the competing theories not as rival truths, but as **different modeling frameworks** for different purposes. In your old terms: they are different map projections. The Mercator projection distorts area to save angles; the Peters projection saves area to distort angles. Asking which one is "the true map" is the error. The Sorites debate is philosophers arguing over which projection is the real territory.

  Expect the debate to continue as long as philosophers believe there is a single "True Logic" of natural language. If the field shifts to viewing logics as tools for specific modeling tasks (as you did with geochemical models), the heat will go out of the argument, even if the positions remain.
