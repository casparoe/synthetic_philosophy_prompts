  *(Self-Correction on the "Some" case)*: Linguists actually argue about whether "Some" implicates "Not All" semantically or pragmatically. For this user's level, treating it as a standard Gricean Scalar Implicature is best. Don't overcomplicate with Horn scales unless necessary.

