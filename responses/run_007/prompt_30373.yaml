answer: |-
  You are deep in the rabbit hole, but you are also asking exactly the right questions. You've essentially rediscovered the core problem of **pragmatics** (the study of how context contributes to meaning). Your debate coach pointed you at Paul Grice, and your intuitions are actually tracking very closely with the philosophical debates that have happened since the 1970s.

  You want a single principle that explains the clear cases and adjudicates the messy ones. Here is the best candidate for that principle, followed by how it handles your specific dilemmas.

  ### The Principle: The Reasonable Cooperative Listener

  The unifying principle behind your "clear" cases is this: **A speaker is committed to whatever meaning a reasonable listener must infer in order to assume the speaker is being cooperative.**

  Grice called this the **Cooperative Principle**. We assume people aren't talking nonsense. If someone says something that seems literal nonsense (like asking about arm length when the salt is right there), we assume they *must* mean something else to make the conversation work.

  Here is how this principle validates your clear cases:
  *   **Salt/Rec Letter/Some/Movie:** In all these cases, if you take the words literally, the speaker is being unhelpful, weird, or under-informative. To save the assumption that they are *cooperating*, you *must* infer the hidden meaning.
  *   **Sarcasm:** If you take it literally, the speaker is lying (violating the maxim of Quality). To assume they are still cooperating, you must infer they mean the opposite.

  So, the test for responsibility is: **Was the implicature necessary to make sense of the speaker's cooperation?**

  Now, let's apply this to your two headache cases.

  ### Case 1: The Party ("I'll try")
  **Verdict: You are on the hook.**

  Here is why the principle sides with your friend Maya. In the context of social planning, the goal is coordination.
  *   **The Literal:** "I will make an effort."
  *   **The Cooperative Inference:** If you knew you were definitely coming, saying "I'll try" would be under-informative (violating the Maxim of Quantity). A cooperative planner gives certainty when they have it. By choosing the weaker phrase "try," you signal you lack the certainty of "will."

  Therefore, the implicature ("There is a significant chance I won't be there") is required to make your statement cooperative. You didn't say "I'm not coming," but you *did* commit to the uncertainty. When you didn't show up, you confirmed the implicature. Maya isn't mad you lied; she's mad you managed her expectations poorly.

  **Why it feels different:** It feels like a "technicality" because you literally *did* try. But in pragmatics, **commitment is about expectation management, not just physical effort.** You implicated a risk, and the risk materialized.

  ### Case 2: The Compliment ("You look nice today")
  **Verdict: Your mom is NOT on the hook.**

  This feels different because the inference your aunt made ("You usually look bad") is **not required** to make the statement cooperative.
  *   **The Literal:** "You look nice on this specific day."
  *   **The Cooperative Inference:** Compliments are speech acts of benevolence. To make sense of a compliment, we assume the speaker is being kind. Inferring an insult ("You usually look bad") contradicts the cooperative goal of being kind.

  While "today" *logically* allows for a contrast, it doesn't *pragmatically* require one. "Today" can function as a **focus marker** (highlighting the present moment) rather than a **contrast marker** (excluding other moments).

  **The Crucial Distinction: Cancellability**
  This is the technical tool that separates the Party case from the Compliment case.
  *   **Party Case:** If you said, "I'll try to come... in fact, I guarantee I'll be there," you sound contradictory or weird. The uncertainty is "sticky." This is a *Generalized Conversational Implicature*. It attaches to the word "try" in most contexts.
  *   **Compliment Case:** If your mom said, "You look nice today! In fact, you always look nice," that flows perfectly. The negative contrast is easily **cancelled** without contradiction. This is a *Particularized Conversational Implicature*. It only happens if the context (tone, history) suggests snark.

  Since the negative implicature in the compliment case is easily cancelled, your aunt's inference was hyper-literal or insecure, not a necessary result of your mom's cooperation. Your mom isn't responsible for an inference that breaks the cooperative frame of kindness.

  ### Does this force us to change a "Clear" verdict?

  If we hold strictly to the "Reasonable Cooperative Listener" principle, there is one case in your "clear" list that is actually wobblier than the others: **The "Some" case.**

  *   *Case:* "Some of the debate team showed up."
  *   *Your Intuition:* This definitely means "Not all."
  *   *The Problem:* Imagine a teacher walks in, sees the whole team, and says, "Oh good, some of the team showed up!" before realizing everyone is there. Did the teacher lie?
  *   *Linguistic Debate:* Many philosophers argue that "Some" logically *includes* "All" (just like "some" of a pizza could be the whole pizza). The "Not All" meaning is an implicature, just like the Party case.
  *   *The Verdict:* You don't have to change your intuition, but you should recognize that "Some" is more like the Party case than the Salt case. It is cancellable. ("Some of the team showed up... in fact, all of them did.") It sounds a bit pedantic, but it's not a contradiction.

  The Salt case and the Movie case are stronger because they are **Indirect Speech Acts**. Asking "Can you reach the salt?" when the ability is obvious *cannot* be a question about ability. It *must* be a request. There is no cancellability there.

  ### Summary: The Real Distinction

  You asked if there's a clean principle or if the distinction is something else. The principle holds, but the distinction lies in **Normative Expectations.**

  1.  **Coordination Norms (The Party):** When we are making plans, the norm is **Reliability**. "Try" violates the norm of reliability unless uncertainty is signaled. You are responsible for the signal you sent.
  2.  **Benevolence Norms (The Compliment):** When we are giving compliments, the norm is **Kindness**. "Today" does not inherently violate kindness. The listener is responsible for not importing insecurity into a kind act.
  3.  **Information Norms (Salt/Rec Letter/Some):** When we are exchanging info, the norm is **Efficiency**. If you say less than you could (Rec Letter, "Some"), you are signaling a negative.

  **So, to answer your final question:**
  You are responsible for implicatures that are **standardized** (like "try" implying uncertainty) or **necessary for coherence** (like the salt request). You are *not* responsible for implicatures that are **context-dependent** and **contradict the social goal** (like finding an insult in a compliment).

  Your friend Maya was right to be upset (standardized implicature). Your aunt was being difficult (context-dependent inference). And you can keep your intuition about "Some," just know it's technically cancellable if you want to be a logician about it.
