          *   Maybe the Sarcasm case? (Sarcasm relies on *flouting* Quality, but still assumes Cooperation at a deeper level).
      *   *The Real Distinction:* It's about **Normative Expectations** vs. **Logical Possibility**.
          *   Party: Social norm says "Commit or Don't." "Try" is a soft no.
          *   Compliment: Social norm says "Accept kindness." "Today" is usually emphasis, not contrast.
      *   *Conclusion:* You are responsible for what a *reasonable* person infers to make sense of your cooperation, not every *possible* inference.

  7.  **Refining the Argument (Self-Correction during drafting):**
