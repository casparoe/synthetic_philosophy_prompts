      *   *Nuance:* The Party case is about **Action Coordination**. The Compliment case is about **Face/Politeness**.
      *   *Key Insight:* The distinction lies in **Cancellability**. "I'll try... and in fact I'm 100% sure I'll be there" sounds weird (contradictory implicature). "You look nice today... and every day!" sounds fine (cancels the contrast). This is the technical differentiator.
      *   *Wait, is "I'll try... and I will make it" contradictory?* "I'll try to come, and I will succeed" is okay. "I'll try" usually implicates "I might not."
      *   *Let's focus on the "Reasonable Listener" standard.*

  8.  **Final Polish:**
