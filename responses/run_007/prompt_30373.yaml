      *   *Tackle the Compliment Case:* This is different. It's a *potential* implicature, but often cancelled by benevolence. The aunt's reaction is hyper-literal or insecure. The mom isn't on the hook unless the context suggested snark.
      *   *The "Single Principle" Test:* Does this force us to change a clear verdict?
