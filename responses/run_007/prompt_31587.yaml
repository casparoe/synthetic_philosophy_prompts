prompt: |-
  Hey — I'm in a philosophy of cognitive science class and for the final paper I have to read a novel through the lens of one of the theories from the course. I picked Flowers for Algernon (the novel, not the movie) and the unit on what intelligence is: operationalism, g vs a bundle of abilities, intelligence vs rationality and judgment, all that. The novel basically runs an experiment on the question: Charlie's IQ goes from 68 to genius after the surgery, but his emotional life, self-control, and relationships get worse, and then he regresses. Act as a professional philosopher of mind who also takes the literary details seriously. Start by brainstorming two or three distinct readings of the novel on this question, then settle on the one you think is strongest. I want a real reading, not a book report: which view of intelligence does the book actually dramatize, and does it endorse it, complicate it, or refute it? Where does the book conflate IQ with intelligence, and where does it deliberately expose exactly that conflation? And be honest about where the lens distorts the book — scenes that resist the philosophy reading and why. What does the novel make you notice about intelligence that the papers don't, and vice versa? I definately want you to think carefully and not just give the standard IQ-isn't-everything take.
