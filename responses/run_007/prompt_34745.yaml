      *   Draft Bottom Line: Preregistration is not philosophically neutral; it explicitly commits psychology to an error-statistical (frequentist) framework that violates the Likelihood Principle by making evidential interpretation dependent on researcher intentions and sampling plans rather than solely on the observed data.

  3.  **Develop the Reasoning:**
      *   **The Likelihood Principle (LP):** The LP states that all evidence in a sample is contained in the likelihood function. Two experiments yielding proportional likelihoods should yield the same inference. Preregistration contradicts this because the *same data* gets different weight depending on whether the test was planned or exploratory (intentions/sampling space).
      *   **Frequentist/Error-Statistical View:** This view (associated with Mayo, Peirce, Neyman-Pearson) focuses on long-run error rates. To control Type I error, you must account for the "space of possibilities" (what else could have been tested?). Preregistration defines this space. Therefore, preregistration is a tool for error control, not purely evidential assessment in the Bayesian sense.
      *   **Bayesian View:** Bayesians generally adhere to the LP. They update priors based on data. While preregistration can help Bayesians (by clarifying priors or preventing bias), strict Bayesian inference doesn't *require* it for the math to hold. The *mandatory* labeling of unplanned analyses as "exploratory" (i.e., less evidentiary) is a frequentist move.
      *   **Inconsistency in Journals:** Journals often encourage Bayesian stats (which obey LP) while enforcing preregistration (which violates LP). This creates a philosophical tension. Treating replication failures as evidence against original findings is consistent with both, but the *reason* preregistration matters (controlling the false positive rate via intention) is frequentist.
