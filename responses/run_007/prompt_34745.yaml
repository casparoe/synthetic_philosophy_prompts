answer: |-
  Preregistration is not philosophically neutral; it explicitly commits the field to an error-statistical (frequentist) philosophy of evidence that violates the Likelihood Principle by making inferential validity dependent on researcher intentions and sampling plans rather than solely on the observed data.

  This practice presupposes that the evidential meaning of a result is not contained entirely within the likelihood function of the observed data, but is instead contingent upon the space of possible tests that *could* have been performed. Under the Likelihood Principle, which is foundational to Bayesian and likelihood-based inference, two experiments yielding proportional likelihoods should support identical inferences regardless of the researcher's private intentions or stopping rules. Preregistration rejects this by asserting that a significant result obtained from a single planned test is evidentially stronger than the exact same result obtained from one of twenty unplanned tests, precisely because the latter inflates the long-run Type I error rate across the hypothetical ensemble of possible analyses. This is a quintessentially frequentist concern focused on error control over repeated sampling, rather than a Bayesian concern focused on updating degrees of belief based on the current data.

  Consequently, there is a genuine philosophical inconsistency when journals mandate preregistration while simultaneously encouraging Bayesian analyses. Bayesian inference generally treats stopping rules and multiple comparisons as irrelevant to the posterior probability once the data are observed, meaning a strict Bayesian should theoretically view a preregistered finding and an exploratory finding as equally informative given the same likelihood ratio. By labeling unplanned analyses as merely "exploratory" or less confirmatory, journals are enforcing an error-statistical norm onto a workflow that increasingly incorporates Bayesian tools. While preregistration offers pragmatic utility for transparency and reducing bias in both paradigms, its normative claim that the context of discovery constrains the context of justification is incompatible with the Likelihood Principle, revealing that the reform is not a neutral procedural tweak but a substantive endorsement of error-statistical evidence over pure evidential support.
