  **The Arrivial of Mentalese: Reading Villeneuve Through Fodor**

  Denis Villeneuve's *Arrival* rests on a provocative linguistic premise: learn the Heptapods' non-linear language, and you perceive time non-linearly. For your friend, this is Sapir-Whorfian poetry. For you, channeling Jerry Fodor, it is cognitive impossibility. The Language of Thought Hypothesis (LOTH) posits that thinking occurs in an innate, species-specific "mentalese," with natural language serving merely as an interface for input and output. If Fodor is right, learning Heptapod B should be like learning to type in a new font; it shouldn't rewrite the operating system of your brain.

  From a strict LOTH perspective, *Arrival* is indeed scientifically bankrupt. Fodor argues for the modularity of mind: linguistic processing is encapsulated. It cannot reach into central processing to alter fundamental categories like causality or temporality. Under this view, Louise Banks isn't gaining precognition; she is hallucinating. If mentalese is hardwired, no amount of semantic mapping can allow a human to experience the future as memory. To claim otherwise is to confuse the map (language) with the territory (cognition).

  However, dismissing the film as "bad linguistics" misses its metaphysical ambition. The film challenges LOTH not by disproving innate structure, but by suggesting that structure is permeable under extreme conditions. Heptapod B is not a natural language in the human sense; it lacks sequentiality, directionality, and syntax as we understand it. It is a visual technology. When Louise learns it, she isn't just acquiring vocabulary; she is undergoing radical neuroplasticity. She is training a sequential brain to process information simultaneously.

  This is where your intuition about reconciliation hits the mark. Consider the Heptapod language not as a peripheral encoding system, but as the direct externalization of Heptapod mentalese. For the aliens, thought and inscription are identical. When humans learn Heptapod B, they aren't mapping it to human mentalese; they are attempting to install Heptapod mentalese as a secondary cognitive layer.

  LOTH assumes mentalese is fixed at birth. *Arrival* proposes it is malleable through immersion. Think of it less like learning French and more like learning quantum mechanics. Studying quantum physics doesn't change the laws of the universe, but it changes how you model reality. Similarly, Heptapod B might act as a "cognitive prosthesis." It doesn't change the flow of time, but it changes the brain's access to it. If the universe is block-like (eternalism), human mentalese usually filters this into a sequential narrative. Heptapod B removes the filter.

  There is also a charitable reading where the film functions as a *reductio ad absurdum* of strong determinism, though Villeneuve likely intends sincerity. If we accept the film's internal logic, LOTH must be expanded to allow for "acquired mentalese." This respects Fodor's insistence on structure while accepting the film's premise that structure can be augmented. Louise doesn't stop thinking in human mentalese; she gains a parallel process that allows her to navigate time differently.

  Ultimately, *Arrival* is not a thesis on linguistics but a metaphor for empathy. To speak another's language is to inhabit their perspective. The film literalizes this: to truly understand the Other, you must adopt their experience of time and mortality. Whether this violates Fodor's modularity is secondary to the philosophical claim that cognition is not a prison.

  So, was your friend right? In the realm of cinema, yes. The film requires the Whorfian leap to function emotionally. Were you right? In the realm of cognitive science, absolutely. LOTH provides the necessary skepticism to keep the story grounded in mystery rather than magic. The truth lies in the synthesis: Heptapod B is the bridge between fixed human cognition and a mutable universe. It suggests that while we may be born with a specific mentalese, we are not doomed to die with it. Language, in the end, is not just how we speak; it is how we wake up.
