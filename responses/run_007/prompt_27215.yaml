answer: |-
  You're hitting on a really common point of confusion, and honestly, your intuition isn't wrong. Utilitarians definitely don't believe society is a literal super-organism with a single conscious mind. If you asked a modern utilitarian like Peter Singer or J.J.C. Smart, they'd agree with you: it's a figure of speech.

  However, when Rawls (and later Robert Nozick) talks about the "separateness of persons," they aren't criticizing a psychological claim. They are criticizing a **structural** feature of utilitarian moral reasoning.

  Here's the breakdown of why this objection is considered deeper than just a metaphor, and why it's not merely a "substantive disagreement about tradeoffs."

  ### 1. Prudence vs. Justice
  The core of the Rawlsian objection is about the difference between **rational prudence** (how an individual makes decisions for themselves) and **justice** (how society makes decisions for everyone).

  *   **Individual Prudence:** If I choose to go to the dentist today, I am accepting pain now for a benefit later. This is rational because the person suffering the pain and the person enjoying the benefit are the **same person**. I can balance my own losses and gains across time.
  *   **Utilitarian Social Choice:** Utilitarianism applies this same logic to society. It says Society can accept Person A's suffering today for Person B's benefit tomorrow.

  Rawls argues that this extends the logic of individual choice too far. It treats the boundaries between people as morally irrelevant, just like the boundaries between "me today" and "me next year" are irrelevant to my own planning. The objection is that **you cannot balance losses and gains across different people the same way you do within one person.** When I sacrifice for myself, I consent to it. When society sacrifices Person A for Person B, Person A is being used as a means to an end.

  ### 2. The Problem of Aggregation
  You mentioned that utilitarians are "just saying we should count everyone's interests equally." The critic's response is that counting interests equally leads to **aggregating** them, and aggregation wipes out the individual.

  If you have a total of 100 units of happiness to distribute:
  *   **Scenario A:** 10 people get 10 units each.
  *   **Scenario B:** 1 person gets 91 units, and 9 people get 1 unit each.

  A strict utilitarian might prefer Scenario B if the total is higher (or be indifferent if the totals are the same). The "separateness of persons" objection says this is absurd. The fact that the 9 people are *distinct individuals* means their suffering cannot be canceled out by the one person's massive gain.

  The objection isn't that the math is wrong; it's that **the distribution matters morally.** By focusing only on the sum total, utilitarianism fails to respect that each person has a life to lead that shouldn't be overridden just to boost the average.

  ### 3. It's Not Just a "Tradeoff" Disagreement
  You suggested this might just be a substantive disagreement about tradeoffs (i.e., "Is it okay to sacrifice one to save five?"). If it were just that, it would be a simple clash of intuitions. But the "separateness" objection is trying to explain *why* that intuition exists.

  The claim is that persons have **inviolability**.
  *   **Utilitarian View:** Rights are rules of thumb. If violating a right produces more utility, you do it.
  *   **Rawlsian View:** Rights are boundaries. They mark the line where social calculation must stop.

  When Rawls says utilitarianism doesn't take the distinction between persons seriously, he means it doesn't acknowledge that **I belong to myself.** My life is not a resource for the social welfare function. So, when a utilitarian sacrifices an innocent person to calm a riot (the classic example), they aren't just making a tough tradeoff; they are fundamentally misidentifying the moral status of the person being sacrificed. They are treating a person like a container of utility that can be emptied for the greater good, rather than a sovereign individual.

  ### 4. So, Is It Just a Metaphor?
  It *uses* a metaphor, but it points to a real logical mechanism.

  Think of it like this: If I say a corporation is "acting like a psychopath," I'm using a metaphor. The corporation doesn't have a brain. But the metaphor points to a structural reality: the corporation is designed to maximize profit without regard for external harm, similar to how a psychopath operates.

  Similarly, saying utilitarianism treats society as "one person" is a shorthand for saying: **Utilitarianism applies the principle of rational choice for an individual to the structure of society, ignoring the pluralism of distinct agents.**

  ### The Bottom Line
  You are right that utilitarians don't literally believe in a hive mind. But the objection is that their **moral arithmetic** functions *as if* that hive mind existed.

  Rawls is arguing that justice isn't about maximizing the net good; it's about fair cooperation between distinct individuals. If your theory of justice requires you to ignore the boundaries between those individuals to get the math to work, then the theory is structurally flawed, not just substantively disagreeable. It's not that we disagree on the price of the tradeoff; it's that I don't think you have the authority to make the trade at all.
