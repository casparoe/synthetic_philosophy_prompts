  i keep hearing that utilitarianism fails to respect the "separateness of persons" — that it treats the whole of society like one big person whose pains and pleasures can just be added up. but isn't this just a metaphor? like, when a utilitarian says we should maximize total welfare, they're not literally claiming society is a single entity with a unified consciousness. they're just saying we should count everyone's interests equally and pick the option with the best total outcome. so what's the actual objection here, beneath the metaphor? it seems like the Rawlsian complaint is just that utilitarianism might require sacrificing some people for others, but that's a substantive disagreement about tradeoffs, not about some deep failure to "take seriously the distinction between persons." or am i misunderstanding what the objection is supposed to be? please respond in american english.
