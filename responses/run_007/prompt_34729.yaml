answer: |-
  This is a sophisticated problem in classification logic, and your background in chemistry serves you well here: you are essentially asking for the **reaction mechanism** behind your friend's coding rules, not just the product.

  You have correctly identified that her current track record **underdetermines** the choice between a substantive rule (ontology-focused) and a functionalist rule (practice-focused). Every case she coded as "religious" contains *both* supernatural/metaphysical claims *and* sacred/ritual functions. Every case she coded as "not religious" lacks *both* (or lacks one in a way that confounds the variables).

  Here is an analysis of the rules, the prediction for your humanist case, and the decisive test to isolate her actual criterion.

  ### 1. The Two Competing Rules

  **Rule A: The Substantive (Ontological) Rule**
  *   **Definition:** Religion requires belief in counter-intuitive agents, forces, or metaphysical realities (gods, spirits, karma, cosmic energy) that exist beyond the empirically verifiable material world.
  *   **Logic:** Religion is a specific type of *belief content*.
  *   **Fit with Track Record:** Perfect. All "religious" cases involve non-empirical entities (ancestors, karma, energy). All "non-religious" cases explicitly lack metaphysical claims (mindfulness) or involve only material entities (football).

  **Rule B: The Functionalist (Sociological) Rule**
  *   **Definition:** Religion requires a community bound by shared rituals that treat specific values as "sacred" (non-negotiable, morally binding), regardless of the truth value of their metaphysical claims.
  *   **Logic:** Religion is a specific type of *social cohesion and moral binding*.
  *   **Fit with Track Record:** Perfect. All "religious" cases involve moral obligation and sacred values. All "non-religious" cases lack this: the football club treats its rituals as entertainment, and the mindfulness program treats its practice as instrumental (stress reduction) rather than morally sacred.

  ### 2. Prediction for the Secular Humanist Congregation

  Here is how each rule predicts the verdict for your new case (Sacred/Moral = Yes; Supernatural = No):

  *   **If she follows the Substantive Rule:** She will code this as **Not Religious**.
      *   *Reasoning:* Despite the rituals and sacred values, the explicit denial of the supernatural removes the necessary ontological component. She would likely classify this as "secular ritual," "ideology," or "civic ceremony."
  *   **If she follows the Functionalist Rule:** She will code this as **Religious**.
      *   *Reasoning:* The group performs all the social and psychological functions of religion (rites of passage, moral binding, sacred values). The lack of supernatural content is irrelevant to the function.

  ### 3. Which is the Better Reading of Her Track Record?

  While the data logically underdetermines the rule, a closer reading of her specific exclusions suggests the **Substantive Rule (or a Conjunctive Rule requiring both)** is the stronger candidate.

  **The Clue:** Look at her reasoning for the **Secular Mindfulness** case.
  *   *Ruling:* "Not religious."
  *   *Stated Reason:* "Used purely for stress reduction, **with no metaphysical claims**."

  If she were a pure Functionalist, the lack of metaphysical claims would not be a disqualifier; she would have focused on the lack of "sacred value" or "community." By explicitly citing the lack of *metaphysics* as the reason for exclusion, she signals that supernatural content is a **necessary condition**.

  **The Field Context:** Since your friend works in the **Cognitive Science of Religion (CSR)**, this is the expected outcome. CSR scholars (like Pascal Boyer, Justin Barrett, or Ara Norenzayan) typically define religion substantively. They study the cognitive architectures (like Hyperactive Agency Detection) that generate beliefs in *non-empirical agents*. From a CSR perspective, a group without supernatural concepts does not trigger the specific cognitive mechanisms they study, even if it looks like a church sociologically.

  **Expected Verdict:** You should expect her to rule **Not Religious**. She will likely argue that while the humanists mimic the *form* of religion, they lack the *content* that defines the category in her coding schema.

  ### 4. The Decisive Test Case

  To settle definitively whether she is a **Pure Substantivist** (Supernatural is sufficient) or a **Conjunctive Coder** (Supernatural + Sacred are both required), you need a case that reverses the variables of the Humanist congregation.

  The Humanist case tests: *Can you have Religion without Supernaturalism?*
  The Test Case below tests: *Can you have Supernaturalism without Religion?*

  **Proposed Case to Put to Her:**
  > "A local club of paranormal enthusiasts who meet weekly to track and log ghost sightings. They believe ghosts are real (supernatural agents), but they treat them purely as biological phenomena to be studied, like birdwatching. They have no rituals, no moral obligations attached to the ghosts, and treat the ghosts as neither sacred nor morally significant."

  **How to Interpret Her Verdict:**

  1.  **If she codes this as Religious:** She is a **Pure Substantivist**. Belief in supernatural agents is sufficient for the "religious" label, even without sacredness or ritual. (This would make her Humanist verdict even more certain to be "Not Religious").
  2.  **If she codes this as Not Religious:** She is using a **Conjunctive Rule** (Supernatural + Sacred). This confirms that the Humanist congregation failed *only* because it lacked the supernatural, not because it lacked sacredness.
  3.  **If she codes this as Not Religious, but the Humanists as Religious:** She is a **Pure Functionalist**. (This is highly unlikely given the Mindfulness ruling).

  ### Summary Advice for Your Conversation

  When you present the Humanist case, listen closely to *which* missing feature she highlights.
  *   If she says, "It's not religious because they don't believe in anything beyond the natural," she is consistent with the **Mindfulness** ruling (Substantive).
  *   If she says, "It is religious because they treat human dignity as sacred," she is prioritizing the **Football** distinction (Functionalist).

  Given her field and the specific wording of the Mindfulness exclusion, the weight of evidence suggests she will classify the Humanists as **Not Religious**. She likely views "supernatural concepts" as the chemical element that makes the compound "religion," while rituals and morality are merely the bonding structure. Without the element, the structure doesn't count.
