prompt: |-
  Okay so I'm in this grad seminar on two-dimensional semantics and we've spent the last three weeks going through Chalmers and Jackson, and I feel like I keep oscillating between thinking the 2D framework is one of the most important developments in philosophy of language since Kripke, and thinking it's a clever formalism that doesn't actually carve anything at the joints. The thing is, I think the overall package decomposes into a few separable claims, and my credence in the package as a whole is some weird product of credences in those sub-claims, but I haven't actually sat down to do the multiplication.

  So here's what I want: give me your credence that the core positive program of epistemic two-dimensionalism is basically correct — by which I mean: there exists, for every expression (or at least the philosophically central ones, like proper names, natural kind terms, and phenomenal concepts), a well-defined primary intension that captures something like its cognitive or epistemic content, and this 1-intension is distinct from the secondary intension in a way that earns its keep — e.g., it explains the necessary a posteriori, it underwrites a substantive link between conceivability and possibility, and it does this without collapsing into something trivial like a diagonalization of the secondary intension with whatever contextual parameter happens to be around. But I don't want just a number. I want the decomposition. What sub-questions does this ride on? For each one, give me a rough probability and a sentence or two of justification. Then tell me how they combine, what your final number is, and — this is the part I care about most — which term your least confident in, and what kind of evidence or argument would move it the most.

  My own number hovers somewhere around 0.35 but I keep noticing it shifts depending on whether I'm thinking about proper names versus phenomenal concepts, so I'm also curious whether you think the project succeeds unevenly across domains (like, maybe it works for phenomenal concepts but not for names) and whether that unevenness should make us revise the whole framework or just restrict its scope. Oh and if it helps: the main objections we've been kicking around in class are the stuff about whether 1-intensions are just too coarse-grained (the "zombie" objection to 2D, not the consciousness one — the idea that primary intensions can't distinguish between expressions that are a priori equivalent but differ in cognitive significance), whether the whole apparatus presupposes a notion of apriority that's too unanalyzed to do the work it's asked to do, and whether Chalmers' move to "ideal" rational reflection as the relevant notion of apriority ends up making the 1-intension so idealized that it loses contact with actual speaker competence. So if those factor into your decomposition in different ways, I'd love to see how.
