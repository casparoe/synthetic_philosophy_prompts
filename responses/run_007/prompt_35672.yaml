answer: |-
  This is an exquisite question. You have put your finger on the precise hinge upon which the philosophical significance of Molyneux's Problem turns. The distinction you draw—between a deficit of *data* (correlation-learning) and a deficit of *kind* (heterogeneity)—is not just a matter of scholarly interpretation; it is the difference between writing a scene about cognitive puzzle-solving and a scene about ontological disorientation.

  To answer you directly: **Locke is committed to the Heterogeneity reading.** The "Correlation-Learning" reading understates the radical nature of Locke's empiricism. If the connection were merely a matter of missing data, a sufficiently rational mind might deduce the connection from the nature of the objects themselves. Locke (and Molyneux) argue that no amount of reasoning can bridge the gap because the *ideas* themselves are fundamentally distinct species.

  Here is a breakdown of why the text supports this, what the word "must" is actually doing, and how you might translate this into the phenomenological texture of your novel.

  ### 1. The Status of the "Must"
  You are right to be troubled by "must." In a rationalist framework (like Leibniz's), "must" implies a logical or metaphysical necessity. If tactile angles and visual angles were logically connected, the blind man *should* be able to deduce the visual appearance from the tactile concept.

  However, Locke is an empiricist. For Locke, there are no necessary connections in nature that can be discovered by reason alone; there are only "constant conjunctions" discovered by experience. When Molyneux writes that the man has not obtained the experience that what affects his touch "must" affect his sight so or so, he is using "must" to describe a **law of association**, not a law of logic.

  He means: *The blind man does not yet know the rule of translation.*

  But why can't he figure out the rule? Why is the translation impossible without experience? This is where Heterogeneity enters. For Locke, the "Idea of Extension" received by touch is a different *simple idea* than the "Idea of Extension" received by sight. They may refer to the same Primary Quality in the object (the cube really is cubic), but the *ideas in the mind* are as distinct as the idea of "red" and the idea of "loud."

  If you have never seen red, knowing everything about sound will not help you imagine red. Similarly, for Locke, knowing everything about the tactile cube does not furnish the mind with the visual cube. They are heterogeneous data types.

  ### 2. Locke vs. Berkeley on Phenomenology
  While Locke establishes the Heterogeneity, his successor George Berkeley radicalizes it in *An Essay Towards a New Theory of Vision* (1709), explicitly to solve Molyneux's Problem. If you want phenomenological weight, Berkeley is arguably more useful to you than Locke.

  Locke still holds that we see "figures." Berkeley argues that strictly speaking, **we do not see three-dimensional shapes at all.**
  *   **Touch** gives us solidity, resistance, and true 3D figure.
  *   **Sight** gives us only light, colors, and 2D arrangements on a plane.

  For Berkeley, the "visible cube" and the "tangible cube" share nothing but the name. The visible cube is a patchwork of shadows and highlights. The tangible cube is a sensation of pressure and edges. The connection between them is purely linguistic/associative, like the connection between the word "apple" and the fruit.

  **For your novel:** If you follow the Lockean/Berkeleian line, your character should not look at the cube and think, *"I see a shape, but I don't know which one is the cube."*
  Instead, she should look at the cube and think, *"I see a pattern of light and shadow that has no immediate tactile meaning."*

  The visual experience is not a *blurred version* of her tactile experience; it is a *different language entirely*. The "opacity" you intuited is correct. The visual object is cognitively opaque *as an object of touch*.

  ### 3. The Empirical Evidence (Project Prakash)
  Modern empirical literature largely supports the "No" answer, which lends credence to the Heterogeneity reading. Patients in Project Prakash (who had congenital cataracts removed) typically report:
  *   **Overwhelm:** The visual field is not immediately parsed into objects. It is a "buzzing confusion" (to borrow William James's phrase).
  *   **Fragmentation:** They see colors and edges, but binding them into a unified "cube" takes time.
  *   **Lack of Cross-Modal Transfer:** When asked to identify the cube they just touched, they cannot do it immediately. They must visually explore the object (often by tracing it with their eyes or hands) to build the association.

  One famous case study describes a patient who could not distinguish his wife from other women by sight alone until she spoke. The visual data did not carry the "personhood" or "identity" that the auditory/tactile data did.

  ### 4. Writing the Scene: Inference vs. Opacity
  You noted that if the Correlation reading is right, the scene is one of "rapid inference under uncertainty." If the Heterogeneity reading is right, it is "cognitive opacity."

  **I strongly urge you to write the Opacity.** Here is why, philosophically and narratively:

  1.  **It honors the Empiricist insight:** Locke's point is that the mind is a *tabula rasa* regarding these connections. If she can infer the cube, she is acting like a Rationalist, using reason to bridge sensory modalities. If she is baffled, she is acting like a Lockean empiricist, waiting for experience to build the bridge.
  2.  **It creates higher stakes:** "Inference under uncertainty" is an intellectual puzzle. "Cognitive opacity" is an existential crisis. It suggests that the world she has entered is not the world she knew. She is not just seeing her old world in HD; she is in a new world that must be mapped onto the old one.
  3.  **It avoids the "Miracle of Perception" trope:** Often, in fiction, characters gain sight and immediately recognize things. This is philosophically naive. The Heterogeneity reading allows you to depict the *labor* of perception. Seeing is not passive receiving; it is an active skill of association.

  ### 5. Specific Suggestions for the Text
  To capture the Lockean/Berkeleian texture:

  *   **Decouple Shape from Light:** Describe the cube not as a solid form, but as a collection of visual sensations. A "bright plane," a "dark wedge," a "gradient." Do not use words that imply tactile solidity (like "heavy," "edge," "corner") unless she is explicitly comparing them to her hands.
  *   **The "Must" as a Broken Expectation:** You can use her internal monologue to address your specific worry about the word "must." She might expect that the "angle" she knows by hand *must* look sharp. Instead, she sees a gradient of shadow. She has to learn that *this specific gradient* is what "sharp" looks like.
  *   **The Role of Judgment:** Locke distinguishes between *Sensation* (the raw data) and *Judgment* (the interpretation). Your character has the Sensation but lacks the Judgment. She sees the "visible ideas" but cannot yet judge them to signify the "tangible ideas."
  *   **The Emotional Weight:** If the ideas are heterogeneous, she is effectively alien in her own body. Her hands know the truth of the room; her eyes tell her a different, unconnected story. The reconciliation of these two truths is the work of the narrative arc.

  ### Summary
  Locke's "must" is not a metaphysical necessity waiting to be discovered; it is a **regularity waiting to be learned.** The reason it must be learned rather than deduced is that the sensory ideas are **heterogeneous.**

  Therefore, the "Heterogeneity/Opacity" reading is the one supported by the text. The visual cube is not the tactile cube wearing a mask; it is a stranger that must be introduced.

  If you write the scene as one where she sees a "cube" but doesn't know which one it is, you are granting her a visual idea of "cube" that Locke says she cannot have yet. If you write the scene as one where she sees a *visual phenomenon* that she has no name for, no concept for, and no tactile equivalent for, you are capturing the true philosophical weight of the problem. She is not blind seeing; she is newborn.

  This approach will give your prose the philosophical density you are seeking, grounding her confusion not in a lack of intelligence, but in the fundamental architecture of human perception.
