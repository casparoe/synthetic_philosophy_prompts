answer: |-
  **Exam Question**

  Political Liberalism requires that citizens justify coercive laws using reasons accessible to all free and equal citizens. Critics argue this imposes an unfair asymmetry: adherents of religious comprehensive doctrines must translate their convictions into a secular vocabulary, while adherents of secular comprehensive doctrines (e.g., Kantian deontology, utilitarianism) face no parallel burden, as their vocabularies already overlap with public values. Evaluate this objection. Does Rawls's distinction between the *source* of a reason and its *content* successfully neutralize this asymmetry, or does the differential "burden of translation" reveal a structural bias in political liberalism against theological modes of reasoning?

  ***

  **Model Answer**

  The asymmetry objection strikes at the coherence of Rawls's duty of civility. It posits that public reason functions not as a neutral forum, but as a gatekeeper that privileges secular comprehensive doctrines while marginalizing religious ones. To evaluate this, one must distinguish between the formal requirements of public reason and the substantive burden they impose on different citizens.

  Formally, Rawls denies the asymmetry. He argues that public reason restricts *all* comprehensive doctrines, whether religious or secular. A Kantian citizen cannot justify a constitutional essential by appealing directly to the Categorical Imperative as a metaphysical truth, just as a Catholic cannot appeal to Papal authority. Both must appeal to the political conception of justice—values like liberty, equality, and fairness—which is freestanding from any comprehensive worldview. On this reading, the playing field is level: no comprehensive doctrine rules the public sphere. The objection, therefore, rests on a category mistake, conflating secular comprehensive doctrines with the political conception of justice.

  However, the objection gains traction when shifting from formal rules to practical application. While a Kantian and a Rawlsian political liberal may use similar vocabulary (autonomy, rights, dignity), the *distance* between their comprehensive grounds and the political conception varies drastically. For the Kantian, translating "human dignity" from a metaphysical framework to a political one requires minimal conceptual adjustment. For the religious believer, translating "sanctity of life" from a theological framework to a public one may require severing the conviction from its divine source entirely. This is the "burden of translation." The asymmetry is not in the rule, but in the cost of compliance. The religious citizen must bifurcate their identity, compartmentalizing their deepest motivations, whereas the secular moralist often speaks in public reason without feeling they have abandoned their comprehensive truth.

  Rawls attempts to mitigate this via the "proviso." Citizens may introduce comprehensive reasons (religious or secular) into public discussion, provided that in due course, proper political reasons are offered. This allows religious voices to be heard without violating reciprocity. Yet, critics like Nicholas Wolterstorff argue the proviso is insufficient. It treats religious reasons as rhetorical precursors rather than genuine justifications. If the ultimate justification for a law must be secular, the religious citizen is told their true motivation is politically illegitimate. This creates a psychological and civic alienation that the Kantian does not experience, because the Kantian's true motivation is already legible as public reason.

  Furthermore, the objection highlights a tension between neutrality of aim and neutrality of effect. Rawls aims for neutrality of aim: the state does not intend to favor secularism. However, the *effect* of requiring public reasons is that secular comprehensive doctrines are naturally advantaged because they share a historical and conceptual lineage with liberal democracy. Religious doctrines, particularly those that reject the priority of the right over the good, are structurally disadvantaged. If political liberalism claims to be a module that fits into various comprehensive doctrines, it fails if the "fit" requires one group to rewrite their doctrine while the other does not.

  Ultimately, the asymmetry objection reveals that public reason is not purely procedural; it carries substantive commitments. Rawls's defense holds only if we accept that the political conception of justice is distinct enough from Kantianism to warrant the same restriction. But even if accepted, the differential burden remains. The structural bias is not necessarily an intentional exclusion of religion, but an unintended consequence of constructing a public vocabulary out of the historical sediment of secular Enlightenment thought. To resolve this, one might argue that the definition of "accessible reasons" must expand to include theological arguments that appeal to shared human goods, provided they meet the criterion of reciprocity. Without such an expansion, political liberalism risks demanding that religious citizens check their conscience at the door in a way that secular citizens are never asked to do. The asymmetry is thus defensible only as a necessary cost of social stability, not as a perfect realization of fairness.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Accurate Formulation of the Asymmetry Objection (4 marks)**
  *   **Requirement:** The essay must clearly articulate that the objection is not about exclusion per se, but about the *differential burden* placed on religious vs. secular comprehensive doctrines regarding translation.
  *   **Characteristic Mistake:** Treating secular comprehensive doctrines (like Kantianism) as identical to Public Reason, rather than as competing comprehensive views that happen to overlap.

  **2. Rawls's Formal Defense (Source vs. Content) (4 marks)**
  *   **Requirement:** The essay must explain Rawls's counter-argument: that secular comprehensive doctrines are *also* restricted from directly justifying coercion, not just religious ones.
  *   **Characteristic Mistake:** Claiming Rawls explicitly exempts secular moral philosophies from the duty of civility.

  **3. Analysis of the "Burden of Translation" (4 marks)**
  *   **Requirement:** The essay must acknowledge that even if the rule is neutral, the *cost* of compliance is higher for religious citizens due to the conceptual distance between theology and political values.
  *   **Characteristic Mistake:** Ignoring the practical/psychological cost of bifurcating one's identity in favor of abstract procedural fairness.

  **4. The Limitations of the Proviso (4 marks)**
  *   **Requirement:** The essay must evaluate the "proviso," noting that it allows religious speech in discussion but maintains the asymmetry in final justification/voting.
  *   **Characteristic Mistake:** Arguing that the proviso allows religious reasons to serve as the final justification for coercive laws.

  **5. Normative Evaluation of Neutrality (4 marks)**
  *   **Requirement:** The essay must conclude with a stance on whether this asymmetry is a fatal flaw (bias) or a justifiable cost (reciprocity/stability), distinguishing between neutrality of aim and effect.
  *   **Characteristic Mistake:** Remaining purely descriptive without assessing the fairness or legitimacy of the liberal framework in light of the objection.
