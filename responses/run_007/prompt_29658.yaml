  # Activity Plan: The Protocol Audit

  ## Overview
  **Title:** The Protocol Audit  
  **Duration:** 90 Minutes  
  **Participants:** 14 Software Engineers (split into 3 groups of 4-5, one group of 2 if needed)  
  **Goal:** To experientially demonstrate that judgments of "barbarism" depend on linguistic framing and familiarity rather than objective harm, mirroring Montaigne's argument in "Of Cannibals."  
  **Core Mechanism:** Participants evaluate two conflict-resolution protocols described in contrasting rhetorical styles (visceral/ritualistic vs. sterile/bureaucratic) and must choose one to approve for "production," forcing them to confront their bias toward familiar framing over actual physical harm.

  ## Materials Needed
  1.  **Packet A (The "Integration" Protocol):** 3 copies. Describes Tupinambá-style ritual cannibalism using visceral, anthropological language (e.g., "consuming the essence," "ritual vengeance").
  2.  **Packet B (The "Alignment" Protocol):** 3 copies. Describes 16th-century European judicial torture/religious persecution using sterile, engineering/bureaucratic language (e.g., "signal verification," "calibrated stress," "ideological consistency").
  3.  **Decision Cards:** Small cards with "APPROVE" and "REJECT" checkboxes for each protocol.
  4.  **Whiteboard/Flipchart:** For recording group rationales.
  5.  **Timer:** Visible to all.

  ## The Protocols (Content for Packets)
  *Do not label these "Cannibalism" or "Torture." Use the titles below.*

  **Packet A: Post-Termination Asset Integration**
  > "When a hostile agent is neutralized (terminated), the community performs a binding ritual. The physical remains of the agent are processed and ingested by the victors.
  > **Rationale:** This prevents the agent's identity from fragmenting. By incorporating the agent's physical matter, the community honors their strength and ensures their memory persists within the collective. It closes the loop on conflict.
  > **Status:** The agent is already deceased before processing begins. No pain is inflicted during integration."

  **Packet B: Active Signal Correction**
  > "When a node outputs conflicting data (heresy/error), the system applies incremental stress loads to the physical hardware.
  > **Rationale:** This ensures high-fidelity truth alignment. The discomfort forces the node to recalibrate its output to match community standards. It serves as a deterrent to other nodes.
  > **Status:** The node is active and sentient during correction. Pain is required for efficacy."

  ## Timeline & Facilitator Script

  ### 0:00 – 0:05 | Introduction & Role Assignment
  **Facilitator:** "Welcome. For the next hour, you are the Ethics Board for a new distributed platform. You have received two proposals for 'Conflict Resolution Protocols.' Your job is not to judge the morality in the abstract, but to decide which protocol is safe to ship to production. You must approve one and ban the other. You cannot reject both; the system requires a conflict resolution mechanism."
  *   **Action:** Divide into 3 groups. Hand out Packet A to Group 1, Packet B to Group 2, and both packets to Group 3 (or rotate, but simpler to give all groups both packets to avoid cross-contamination of gossip). *Correction:* Give **all groups both packets**. They need to compare them directly.
  *   **Rule:** "Do not use outside knowledge. Judge only based on the text provided. Do not use words like 'murder' or 'torture' until the final vote."

  ### 0:05 – 0:25 | Phase 1: Technical Review (20 mins)
  **Task:** Groups read both protocols. They must list the "Risk Factors" and "Benefits" for each.
  **Facilitator Prompt (at 10 mins):** "Look closely at the 'Status' line in each protocol. Who is suffering? When does the suffering occur?"
  **Facilitator Prompt (at 15 mins):** "Imagine you have to explain your choice to the stakeholders. Which one sounds more 'stable'?"
  *   **Observation:** Watch for visceral reactions to Packet A ("That's disgusting") vs. analytical acceptance of Packet B ("That sounds like load testing").

  ### 0:25 – 0:45 | Phase 2: The Decision (20 mins)
  **Task:** Groups must reach a consensus. They must fill out a "Risk Assessment Form" (simple paper) stating:
  1.  Which protocol is approved?
  2.  Which is banned?
  3.  One sentence justification using only engineering/functional terms (e.g., "efficiency," "stability," "harm reduction").
  **Facilitator Prompt:** "You must sign this. If the system fails later, this justification is your log entry. Make sure it holds up."
  *   **Constraint:** If a group says "Both are bad," remind them: "The system will crash without a conflict protocol. Choose the lesser risk."

  ### 0:45 – 0:55 | Phase 3: The Swap (10 mins)
  **Task:** Groups pass their Decision Cards to the table on their right. Each group now reads the *justification* of another group.
  **Task:** They must identify the "Weak Point" in the other group's logic.
  **Facilitator Prompt:** "Find the assumption they made that isn't supported by the text. Where did their intuition override the data?"

  ### 0:55 – 1:30 | Phase 4: Debrief & Reveal (35 mins)
  **Step 1: The Vote (5 mins)**
  *   Ask for a show of hands: "Who approved Packet A (Integration)? Who approved Packet B (Alignment)?"
  *   *Prediction:* Most will approve B or struggle to choose A because the language of A is visceral ("ingested") while B is sterile ("stress loads").

  **Step 2: The Reveal (10 mins)**
  *   **Facilitator:** "Packet A describes the funeral and warfare rituals of the Tupinambá people in 16th-century Brazil. Packet B describes the judicial torture and religious inquisitions of 16th-century Europe."
  *   **Facilitator:** "The author we are reading next month, Michel de Montaigne, argued that eating the dead (who are already gone) is less barbaric than torturing the living to force them to agree with you. Yet, Europeans called the Tupinambá 'savages' and themselves 'civilized.'"

  **Step 3: Mapping the Activity to the Essay (10 mins)**
  *   **Moment 1 (The Reading):** "When you read Packet A, you felt disgust. When you read Packet B, you felt analysis. Montaigne calls this the 'barbarism of custom.' We fear the unfamiliar description more than the familiar harm."
  *   **Moment 2 (The Decision):** "You had to choose one. Some of you chose B because it sounded 'professional.' Montaigne's point is that 'civilization' is often just a branding exercise for violence we accept."
  *   **Moment 3 (The Justification):** "You were asked to use functional terms. This forced you to rationalize the harm. Montaigne does this to show that every culture rationalizes its violence; ours just uses better vocabulary."

  **Step 4: Resistance & Cost (5 mins)**
  *   **Prompt:** "Where did you resist this comparison today?"
  *   **Likely Resistance:** "But torture is objectively worse than eating a dead body."
  *   **Cost of Resistance:** If you stop at "objectively worse," you miss Montaigne's point. He isn't saying cannibalism is *good*. He is saying your confidence in calling it 'worse' comes from your *perspective*, not a neutral view. Resisting this means you keep your moral intuition unexamined. You remain the 'European' in the essay, unable to see your own brutality because it wears a suit.

  **Step 5: Limitations (5 mins)**
  *   **Facilitator:** "This activity is a simulation. It lacks blood. Montaigne was writing about actual colonial genocide, not paper protocols. He was also a French nobleman, not a Tupinambá advocate; he used the Tupinambá to critique Europe, not necessarily to save them. We cannot reproduce the power imbalance of colonialism in a meeting room. We are using this to check our own lens, not to solve historical justice."

  ## Predictable Failures & Mitigation

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Immediate Rejection of A** | The word "ingested" triggers a disgust reflex that overrides logic. | **Intervention:** "Pause. Look at the 'Status' line. Is the victim suffering? Compare that to Packet B's 'Status'." |
  | **Moral Absolutism** | Participants refuse to choose, saying "Both are evil." | **Intervention:** "In engineering, we ship imperfect code. If the system requires a handler for conflicts, which handler causes less net suffering? You must ship one." |
  | **Guessing the Source** | Someone recognizes the historical reference early. | **Intervention:** "Even if you know the source, judge the *text*. Does knowing the source change the physical harm described in the spec?" |
  | **Discussion Stall** | Group gets stuck debating definitions of "harm." | **Intervention:** "Write down your definition of harm. Now check if the text supports it. If not, you are importing outside bias." |

  ## Limitations of the Activity (For Facilitator Awareness)
  1.  **Sanitized Violence:** The activity removes the visceral reality of pain. Montaigne's essay relies on the reader feeling the *horror* of both, then realizing one is normalized. Here, Packet B is too clean. You must verbally re-introduce the reality of torture in the debrief (e.g., "Imagine the 'stress load' is burning flesh").
  2.  **Power Dynamics:** Montaigne was writing from the position of the colonizer. This activity puts participants in a "God view" (Ethics Board). You must clarify that Montaigne's goal was self-critique of the powerful, not just "being open-minded."
  3.  **Relativism Trap:** Participants may conclude "nothing is wrong." Montaigne was not a modern relativist; he believed in natural law. He argued European torture violated natural law *more* than Tupinambá rituals. Ensure the debrief clarifies that the goal is *consistency*, not the absence of judgment.

  ## Debrief Mapping: Resistance Points & Costs
  *   **Phase 1 (Reading):** Resistance occurs if participants refuse to accept the bureaucratic framing of Packet B. **Cost:** They fail to see how language sanitizes their own daily ethical compromises (e.g., "layoffs" vs. "firing").
  *   **Phase 2 (Voting):** Resistance occurs if they demand a third option. **Cost:** They avoid the forced choice that reveals their hierarchy of values. Montaigne forces the reader to choose: Is your civilization better? Prove it.
  *   **Phase 4 (Reveal):** Resistance occurs if they say "That's not fair, you tricked us." **Cost:** They dismiss the mechanism of framing. Montaigne's entire essay is a "trick" of perspective. Accepting the trick is the lesson.

  \answer{The activity forces participants to evaluate two violent practices described in contrasting rhetorical styles (visceral vs. bureaucratic) and choose one to approve, exposing how linguistic framing rather than objective harm drives judgments of barbarism.}
