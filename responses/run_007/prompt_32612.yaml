      *   *Uncertainty:* The user mentions uncertainty about latent values. This points to CIRL (Cooperative Inverse Reinforcement Learning). CIRL is technically goal-directed (maximize human reward) but behaves like approval-seeking because it needs to learn the reward. However, a pure approval agent doesn't necessarily try to *learn* latent values; it just tries to mimic the *signal*.

