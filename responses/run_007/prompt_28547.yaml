          *   *Metaphysical:* If EMT is shown to be merely metaphorical (functionalism vs. constitution).
          *   *Normative:* If we decide rights track *vulnerability* rather than *ontology*.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say EMT is definitely true. I need to argue *if* it is true, what follows.
      *   *Nuance:* The friend mentioned border searches. That's a specific legal exception (border exception doctrine). I should mention that the law already struggles with digital data (e.g., *Riley v. California*).
      *   *Focus:* Ensure I answer the specific question: "What theory of mind does the practice presuppose?" -> **Somatic Internalism.**
