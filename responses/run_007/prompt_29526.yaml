answer: |-
  This is a fantastic debate to have overheard, and it cuts to the core of a tension that has existed in the social sciences for forty years. As a novelist, you are right to feel that this is about "whether certain kinds of stories count as knowledge." That is exactly what is at stake.

  Evolutionary psychology (evo psych) is essentially a narrative discipline that claims the status of a hard science. It tells stories about the past to explain the present. The question is: Are those stories *just* stories, or are they maps?

  Here is an adjudication of their exchange, move by move, followed by the crucial elements they missed—and how you might use this tension in your novel.

  ### The Scorecard: Move-by-Move Adjudication

  **Round 1: The "Just-So Stories" Critique**
  *   **Mira:** Claims evo psych is unfalsifiable storytelling (astrology).
  *   **Dan:** Claims this is a strawman; cites the Trivers–Willard hypothesis (T-W) as a testable, confirmed prediction.
  *   **Adjudication:** **Dan wins the point, Mira wins the war.**
      *   *Why:* Mira is reciting the famous 1979 critique by Gould and Lewontin. Historically, she is right that *much* of the field produced unfalsifiable narratives. However, Dan is technically correct that the *methodology* allows for falsification. The Trivers–Willard hypothesis (that mothers in good condition invest more in sons, mothers in poor condition invest more in daughters) is one of the few robust findings that holds across species.
      *   *Verdict:* Dan successfully proved the field *can* be scientific. Mira failed to prove it *always* fails. But her intuition remains correct: for every Trivers–Willard, there are indeed fifty papers that are unfalsifiable.

  **Round 2: Explanation vs. Restatement**
  *   **Mira:** Claims evo psych just renames observations (e.g., "men prefer youth" = "fertility"). It doesn't earn its keep.
  *   **Dan:** Claims it links patterns to constraints and predicts variations (e.g., age gaps narrowing upon remarriage).
  *   **Adjudication:** **Draw (leaning Mira).**
      *   *Why:* Mira identifies a real problem called *tautology*. If the only evidence for "men seek fertility" is "men seek young women," and the only evidence for "young women = fertility" is "men seek them," the circle is closed. Dan tries to break the circle by introducing a variable (remarriage/status).
      *   *The Catch:* Dan's specific example here is empirically shaky. Data on age gaps and remarriage is mixed and heavily confounded by economics. Mira is right that many evo psych explanations feel like "explanations" only because they sound biological, not because they reveal a hidden mechanism. However, Dan is right about the *goal* of science: if you can predict a variation you hadn't seen before, you aren't just restating.

  **Round 3: Bias and Cultural Mirroring**
  *   **Mira:** Findings mirror the researcher's era (Victorian coyness vs. 90s promiscuity).
  *   **Dan:** Admits bias exists but calls it a sociological problem, not methodological. Solution: rigor and preregistration.
  *   **Adjudication:** **Mira wins.**
      *   *Why:* Dan tries to compartmentalize bias as a "human error" fixable by rules. Mira identifies it as a *structural* flaw in historical reconstruction. When you don't have fossils of behavior, you fill the gaps with intuition. And intuition is culturally formed.
      *   *The Nuance:* Dan is right that *all* science has bias. But in fields like physics, the universe pushes back hard and fast. In evo psych, the "data" is often surveys or interpretations of behavior, which are soft enough to be molded by the researcher's expectations. Mira's point about the "suspicious convenience" of findings is the strongest critique of the field's history.

  **Round 4: The Historical Science Problem**
  *   **Mira:** You can't rewind history. Reverse-engineering from one endpoint is underdetermined (multiple stories fit the facts).
  *   **Dan:** Geology and cosmology do this too. The test is novel prediction.
  *   **Adjudication:** **Dan wins technically, Mira wins philosophically.**
      *   *Why:* Dan is correct that "historical sciences" are valid sciences. We accept plate tectonics even though we can't rerun the Earth. However, Mira's point about *underdetermination* is the killer. In geology, you have rocks. In cosmology, you have light. In evo psych, you have... modern humans and a guess about the Pleistocene.
      *   *The Gap:* We have almost no direct data on the "Environment of Evolutionary Adaptedness" (EEA). We are trying to deduce the shape of a key by looking at the lock, without knowing what the keyhole looked like 50,000 years ago. Dan glosses over this difficulty.

  ---

  ### What Neither of Them Said (The Missing Pieces)

  If you want your novel to feel authentic to the current state of the science, you should know what was missing from this bar fight.

  **1. The Mismatch Theory**
  Dan implied that evolved traits should match current behavior. But modern evo psych relies heavily on *mismatch theory*. We have stone-age brains in a space-age world. A craving for sugar was adaptive in the Pleistocene (rare, high energy); it is maladaptive now (obesity). Mira missed that evo psych doesn't claim current behaviors are *optimal*, only that they are legacies. This is a rich vein for fiction: characters driven by impulses that no longer serve them.

  **2. Plasticity is the Adaptation**
  Both treated "human nature" as a set of specific scripts (e.g., "men do X"). The more sophisticated view (often called Human Evolutionary Ecology) is that our primary adaptation is *plasticity*. We evolved to be able to learn *anything*. Therefore, explaining a behavior by saying "it evolved" is often wrong. The ability to *adopt* the behavior based on local conditions is what evolved. Mira touched on culture, but didn't pin down that culture might be the mechanism of the evolution, not the opponent of it.

  **3. Gene-Culture Coevolution**
  They set up a dichotomy: Biology (Dan) vs. Culture/History (Mira). The cutting edge of the field rejects this. Culture changes selection pressures (e.g., dairy farming created selection for lactose tolerance). Biology changes culture (e.g., brain size allows for language). They are a feedback loop. In your novel, if a character says, "It's biology vs. culture," they are out of date. If they say, "It's biology *through* culture," they are current.

  **4. The Replication Crisis**
  Dan mentioned "better science" and "preregistration." He didn't mention that psychology is currently in a crisis of replication. Many famous evo psych studies from the 90s (the ones Mira is likely thinking of) have failed to replicate. The field is currently in a humbling correction phase.

  ---

  ### For the Novelist: Stories as Knowledge

  You mentioned this gets under your skin because it's about "whether certain kinds of stories count as knowledge."

  Here is the synthesis for your work: **Mira and Dan are both telling origin myths.**

  *   **Mira's myth:** We are blank slates written upon by history and power. Our stories are about liberation from the past.
  *   **Dan's myth:** We are ancient vessels carrying deep codes. Our stories are about understanding the constraints of the vessel.

  **Who was "right"?**
  Scientifically? Dan is right that evolutionary theory is a valid lens, but Mira is right that it is frequently abused to justify the status quo.
  Philosophically? Neither. They are arguing about *causality*, but human behavior is *emergent*.

  **How to use this in your novel:**
  Don't have a character represent "The Truth." Have them represent the *cost* of the story they tell themselves.
  *   If a character believes Dan, they might find compassion for their flaws ("I can't help it, I'm evolved this way") or fatalism ("Why try to change?").
  *   If a character believes Mira, they might find agency ("I can rewrite this") or exhaustion ("Nothing is natural, everything is performance").

  The most interesting characters live in the tension between the two. They feel the pull of the "ancient script" (the biological impulse) while holding the pen of the "cultural editor" (the historical context).

  **The Verdict:**
  Dan won the debate on technical methodology (evo psych *is* a science in principle). Mira won the debate on epistemological humility (we know much less than we claim, and bias is rampant).

  If your novel posits that human nature is fixed, you are writing Dan's book. If you posit it is malleable, you are writing Mira's. If you write about the friction between the two, you are writing the truth.
