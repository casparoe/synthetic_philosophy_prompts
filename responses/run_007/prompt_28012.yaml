prompt: |-
  I keep seeing papers that propose a solution to the Frege–Geach problem and then the next paper points out it breaks on some embedding or other, and I've realised I don't actually have a clear list of what a solution even has to do. Before I read another expressivist semantics, lay out the desiderata for me: what must any adequate expressivist account of the semantics of moral language deliver in order to count as having solved the Frege–Geach problem? I want the full spec — every kind of embedding it has to handle (conditionals, negation, attitude reports, quantifiers, whatever else), every logical property it has to preserve (modus ponens, consistency, logical validity more generally), and anything about the attitude assigned to a moral predicate that has to stay the same whether the sentence is asserted or embedded. For each requirement, give me the motivating case: the actual sentence or inference pattern that forces it, so I can see why it's not negotiable. And flag which requirement has killed the most proposals — I want to know where the graveyard is. If there's a pair of requirements that might be jointly unsatisfiable, say so; that's the part I most want to see.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Frege-Geach Problem (FGP) in metaethics (specifically for expressivism).
      *   **Goal:** Provide a comprehensive list of desiderata (requirements) for an adequate expressivist solution.
      *   **Specifics Needed:**
          *   Types of embeddings (conditionals, negation, attitude reports, quantifiers, etc.).
          *   Logical properties to preserve (modus ponens, consistency, validity).
          *   Attitude stability (univocality).
          *   Motivating cases (specific sentences/inferences) for each requirement.
          *   Identification of the "graveyard" (which requirement kills most proposals).
          *   Identification of potential incompatibilities (jointly unsatisfiable requirements).
      *   **Tone:** Technical, precise, comprehensive ("full spec"), slightly weary but authoritative (matching the user's frustration with the literature).

  2.  **Deconstruct the Frege-Geach Problem:**
      *   *Core Issue:* Expressivism says moral sentences express non-cognitive attitudes (e.g., "Murder is wrong" expresses disapproval of murder). But moral sentences appear in unasserted contexts (e.g., "If murder is wrong, then..."). In these contexts, they don't seem to express attitudes. How can the meaning be the same if the function changes? And how do we preserve logical validity if the meaning isn't propositional?
      *   *Key Components:* Semantics (meaning/truth-conditions vs. expression), Logic (validity/entailment), Psychology (attitudes).

  3.  **Drafting the Desiderata (The "Full Spec"):**

      *   *Requirement 1: Univocality (Semantic Uniformity).* The meaning of "wrong" must be the same in asserted and unasserted contexts.
          *   *Case:* "Murder is wrong" vs. "If murder is wrong..."
          *   *Why:* Otherwise, it's equivocation.

      *   *Requirement 2: Logical Validity (Preservation of Truth/Commitment).* Arguments involving moral premises must be valid.
          *   *Case:* Modus Ponens. (1) Stealing is wrong. (2) If stealing is wrong, then getting your little brother to steal is wrong. (3) Therefore, getting your little brother to steal is wrong.
          *   *Why:* Moral reasoning works; expressivism shouldn't make it irrational.

      *   *Requirement 3: Consistency (Non-Contradiction).* One cannot hold inconsistent moral views.
          *   *Case:* "Stealing is wrong and stealing is not wrong."
          *   *Why:* It's irrational to hold this, even for an expressivist.

      *   *Requirement 4: Embedding under Negation.*
          *   *Case:* "It is not the case that murder is wrong."
          *   *Why:* What attitude does this express? Not disapproving of murder? Approving of murder? Disapproving of disapproving?

      *   *Requirement 5: Embedding under Conditionals (The Core).*
          *   *Case:* "If lying is wrong, then telling your brother to lie is wrong."
          *   *Why:* This is the classic Geach point. No attitude is directly expressed toward lying here.

      *   *Requirement 6: Embedding under Attitude Reports (Propositional Attitudes).*
          *   *Case:* "John believes that murder is wrong."
          *   *Why:* Expressivism usually focuses on the speaker's attitude. How do we report *someone else's*?

      *   *Requirement 7: Quantification.*
          *   *Case:* "Everything the Pope says is wrong."
          *   *Why:* Needs to bind variables across complex structures.

      *   *Requirement 8: The Problem of Negation/Consistency (Schroeder's "Negation Problem").*
          *   *Case:* Distinguishing "not wrong" from "wrong" in terms of attitudes.
          *   *Why:* Mark Schroeder's specific critique of Blackburn/Gibbard.

  4.  **Identifying the "Graveyard" (The Killer Requirement):**
      *   Historically, simple expressivism died on *Modus Ponens/Validity* (Geach's original point).
      *   More recently, sophisticated expressivism (Quasi-Realism) often dies on the *Negation Problem* (Schroeder's critique in *Being For*). Specifically, distinguishing between being *for* not blaming vs. being *against* blaming.
      *   *Decision:* The Negation Problem (specifically the distinction between inconsistency and disagreement) is the modern graveyard. But the original Modus Ponens issue is the classic one. I should highlight Schroeder's Negation Problem as the current high bar.

  5.  **Identifying Joint Incompatibilities (The "Hard Constraint"):**
      *   *Expressivism vs. Propositionalism:* You want non-cognitive attitudes (Expressivism) but you need truth-conditional logic (Propositionalism).
      *   *The Tension:* If you make moral sentences truth-apt to save logic, do you cease to be an expressivist? (The "Creeping Minimalism" worry).
      *   *Specific Incompatibility:* Maintaining a *robustly non-cognitive psychology* while satisfying *classical model-theoretic semantics*. If you build a semantics that validates Modus Ponens perfectly, it looks just like realism. If you keep the psychology distinct, logic often breaks.

  6.  **Refining and Structuring the Output:**
      *   Use clear headings.
      *   Use "The Spec" format (Requirement, Motivating Case, Why Non-Negotiable).
      *   Add a section on "The Graveyard."
      *   Add a section on "The Tension/Incompatibility."
      *   Ensure the tone is direct and addresses the user's frustration.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* univocality matters? Yes, equivocation.
      *   *Check:* Did I cover quantifiers? Yes, important for generality.
      *   *Check:* Is the distinction between "inconsistency" and "disagreement" clear in the Negation section? This is crucial for Schroeder's point. I need to make sure I explain that $A$ and $\neg A$ must be inconsistent, not just disagreeing.
      *   *Check:* Did I mention "Creeping Minimalism"? Yes, that's the risk of solving FGP too well.
      *   *Check:* Is the Modus Ponens example clear? The "Stealing" example is standard.
      *   *Refinement:* Make sure to distinguish between the *semantic* requirement (meaning) and the *logical* requirement (validity). They are linked but distinct.

  8.  **Final Polish:** Check against the prompt's request for "full spec," "motivating case," "graveyard," and "jointly unsatisfiable." (The resulting output matches the detailed plan).

  *(Self-Correction Note)*: I need to be careful not to conflate the "Negation Problem" with simple embedding under negation. The Negation Problem is specifically about explaining the *inconsistency* between "X is wrong" and "X is not wrong" in terms of attitudes. Simple negation embedding is just about what attitude is expressed. I will clarify this distinction.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is the right question to ask. The literature is a cycle of proposal and counter-example because authors often optimize for one desideratum (usually conditionals) while silently sacrificing another (usually negation or consistency).

  To count as a solution to the Frege–Geach (FG) problem, an expressivist semantics cannot just explain how moral sentences *work* in isolation; it must explain how they function as *components* of complex sentences without losing their moral meaning or breaking logic.

  Here is the full specification. If a theory fails any one of these, it has not solved the Frege–Geach problem.

  ---

  ### I. The Semantic Desiderata (Meaning & Attitude)

  #### 1. Semantic Univocality
  *   **The Requirement:** The semantic content (meaning) of a moral predicate (e.g., "wrong") must be identical whether it occurs in an asserted main clause or an unasserted embedded clause.
  *   **The Motivating Case:**
      1.  "Murder is wrong." (Asserted)
      2.  "If murder is wrong, then getting your little brother to murder is wrong." (Embedded)
  *   **Why Non-Negotiable:** If the meaning of "wrong" shifts between (1) and (2), the argument commits the fallacy of equivocation. Expressivism traditionally claims "wrong" expresses *disapproval* in (1). If it expresses nothing (or something different) in the antecedent of (2), the argument is invalid. The theory must assign a uniform semantic value to "wrong" across both contexts.

  #### 2. Attitude Stability (The Expression Constraint)
  *   **The Requirement:** The account must specify what non-cognitive attitude is associated with the moral sentence *even when the sentence is not asserted*. It cannot say "no attitude is expressed" in embedded contexts, or the link between meaning and psychology is broken.
  *   **The Motivating Case:** "Bob believes that murder is wrong."
  *   **Why Non-Negotiable:** If "murder is wrong" only expresses an attitude when *I* assert it, we cannot make sense of *Bob's* belief. The semantics must allow for the attribution of the moral attitude to subjects other than the current speaker, without turning the moral predicate into a descriptive property of Bob's psychology (which would collapse into psychologistic realism).

  #### 3. Embedding under Negation
  *   **The Requirement:** The theory must provide a coherent semantic value for $\neg P$ (where $P$ is a moral sentence) that explains what attitude is in play.
  *   **The Motivating Case:** "Stealing is not wrong."
  *   **Why Non-Negotiable:** Does this express *tolerance*? *Indifference*? *Disapproval of disapproval*? If the theory says it expresses "the absence of disapproval," it fails to capture the active nature of moral judgment. If it says it expresses "disapproval of disapproval," it risks an infinite regress or mischaracterizes the attitude. The attitude for $\neg P$ must be distinct from, yet logically related to, the attitude for $P$.

  #### 4. Embedding under Conditionals
  *   **The Requirement:** The theory must assign a semantic value to $P \to Q$ where $P$ and $Q$ are moral sentences, without requiring the speaker to hold the attitude expressed by $P$.
  *   **The Motivating Case:** "If lying is wrong, then telling your brother to lie is wrong."
  *   **Why Non-Negotiable:** This is Geach's original point. I can accept this conditional without disapproving of lying (I might be agnostic). A simple expressivist account says "Lying is wrong" = *Boo lying!* But "If Boo lying!, then..." is nonsense. The semantics must handle the hypothetical nature of the antecedent without dissolving the meaning of "wrong."

  #### 5. Embedding under Quantifiers
  *   **The Requirement:** The theory must handle moral predicates within the scope of quantifiers, allowing for variable binding.
  *   **The Motivating Case:** "For all actions $x$, if $x$ causes unnecessary suffering, then $x$ is wrong."
  *   **Why Non-Negotiable:** Moral principles are general. If "wrong" only functions as a speech act in atomic sentences, it cannot bind to variables in a quantified structure. The semantic value of "wrong" must be the kind of thing that can be saturated by a variable.

  #### 6. Embedding under Propositional Attitude Reports
  *   **The Requirement:** The theory must handle moral sentences as complements to verbs like "believes," "hopes," "fears," and "wonders."
  *   **The Motivating Case:** "Alice wonders whether stealing is wrong."
  *   **Why Non-Negotiable:** "Wondering" implies uncertainty. If "stealing is wrong" just *is* the expression of an attitude, one cannot wonder about it (one either has the attitude or one doesn't). The semantics must allow moral content to be the *object* of an attitude, not just the expression of one.

  ---

  ### II. The Logical Desiderata (Validity & Consistency)

  #### 7. Preservation of Validity (Modus Ponens)
  *   **The Requirement:** Arguments that are intuitively valid in moral discourse must be formally valid in the expressivist semantics.
  *   **The Motivating Case:**
      1.  Stealing is wrong.
      2.  If stealing is wrong, then getting your brother to steal is wrong.
      3.  Therefore, getting your brother to steal is wrong.
  *   **Why Non-Negotiable:** If the semantics makes this invalid, expressivism implies that moral reasoning is fundamentally irrational. The semantic value of the premises must guarantee the semantic value of the conclusion.

  #### 8. The Consistency Constraint (Non-Contradiction)
  *   **The Requirement:** The theory must explain why holding $P$ and $\neg P$ is a form of *inconsistency* (a fault in a single agent's mind), not merely *disagreement* (a clash between two agents).
  *   **The Motivating Case:** A single person thinking, "Stealing is wrong and stealing is not wrong."
  *   **Why Non-Negotiable:** This is distinct from logical validity. It is about the nature of the attitudes. If "wrong" expresses *disapproval*, then "not wrong" must express an attitude that is *incompatible* with disapproval. If the theory says "not wrong" just means "I don't disapprove," then holding both views is just having an attitude and lacking it, which isn't a logical contradiction. The theory must generate a clash of attitudes within a single mind.

  #### 9. The Disagreement Constraint
  *   **The Requirement:** The theory must explain how two speakers can genuinely disagree without one of them necessarily being inconsistent.
  *   **The Motivating Case:** Alice: "Stealing is wrong." Bob: "Stealing is not wrong."
  *   **Why Non-Negotiable:** If moral sentences only report the speaker's own attitudes (e.g., "I disapprove of stealing"), then Alice and Bob are not disagreeing; they are both telling the truth about their own psychologies. The semantics must allow for inter-subjective conflict.

  ---

  ### III. The Graveyard: Where Proposals Die

  If you want to know where the bodies are buried, look at **Requirement #3 (Negation)** combined with **Requirement #8 (Consistency)**.

  This is known as **Mark Schroeder's "Negation Problem"** (from his book *Being For*).

  *   **The Trap:** Early expressivists (like Blackburn) handled conditionals well but treated negation too simply. They tended to say that "Not wrong" expresses a different attitude than "Wrong."
  *   **The Failure:** Schroeder showed that it is incredibly difficult to specify *which* attitude "Not wrong" expresses such that:
      1.  It is distinct from the attitude for "Wrong."
      2.  It is inconsistent with the attitude for "Wrong" (satisfying Consistency).
      3.  It doesn't collapse into a descriptive belief (satisfying Expressivism).
  *   **The Specific Killer:** Distinguishing between **being for not blaming** vs. **being against blaming**.
      *   If "Wrong" = Being for blaming.
      *   Then "Not Wrong" could be "Being for not blaming" OR "Not being for blaming."
      *   Expressivists struggle to explain why "Being for blaming" and "Being for not blaming" are logically inconsistent in the same way "Believing P" and "Believing not-P" are. Most proposals fail to generate the right *kind* of inconsistency without smuggling in truth-conditions.

  **Verdict:** This is the current graveyard. Many "Quasi-Realist" projects successfully handle Modus Ponens (Requirement #7) but collapse when forced to formally define the attitude structure of negation without implicitly accepting realism.

  ---

  ### IV. The Joint Incompatibility (The "Hard Constraint")

  There is a pair of requirements that creates a tension so severe many argue they are jointly unsatisfiable for a *robust* expressivist.

  **The Tension:** **Requirement #1 (Univocality/Propositionalism)** vs. **Requirement #2 (Non-Cognitive Psychology)**.

  *   **The Conflict:** To satisfy the Logical Desiderata (Validity, Consistency, Quantifiers), the semantic value of moral sentences must behave exactly like **propositions** (truth-apt entities that can be premises in arguments).
  *   **The Cost:** If you build a semantics where moral sentences function perfectly like propositions (to save logic), you risk **Creeping Minimalism**. The "attitude" becomes a mere shadow; the semantics is indistinguishable from Moral Realism.
  *   **The Incompatibility Claim:** You cannot have a semantics that is *truth-conditional enough* to validate Modus Ponens and Quantification perfectly, while simultaneously maintaining that the *fundamental nature* of the state of mind is a non-cognitive attitude rather than a belief.
      *   If you solve FGP completely, you look like a Realist.
      *   If you stay a true Expressivist, you usually break FGP (logic fails).

  **The "Gibbard-Schroeder" Deadlock:**
  Allan Gibbard attempted to solve this by analyzing norms in terms of "plans." Schroeder argued that Gibbard's semantics for negation still failed the Consistency Constraint. The joint unsatisfiability lies here: **Explaining logical inconsistency purely in terms of clashing non-cognitive attitudes.**

  Logic is traditionally defined over truth-values. Expressivism rejects truth-values as fundamental. To get logic back, you must reconstruct it over attitudes. But attitudes (like desires or plans) do not naturally contradict each other in the way propositions do (you can desire A and desire not-A without logical fault, merely practical irrationality).

  **Summary for your reading:**
  When you read the next paper, check if they solve the **Negation Problem** (Schroeder) without solving it by simply **defining moral sentences as truth-apt** (which abandons expressivism). If they do the latter, they haven't solved FGP for expressivism; they've dissolved expressivism. That is the specific failure mode to watch for.
