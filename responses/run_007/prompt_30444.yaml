answer: |-
  **MEMORANDUM**

  **TO:** Rules Committee, Faculty Senate
  **FROM:** Chair, Rules Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for New Executive Committee Election Rule

  **Purpose**
  This memo circulates the Committee's final recommendation for replacing the current plurality-with-runoff rule used to elect the six-member Executive Committee. After reviewing the proposals for Instant-Runoff Voting (IRV), Condorcet methods, and Approval Voting, and considering the theoretical objections raised regarding manipulability, the Committee recommends the adoption of **Approval Voting** for all single-seat Executive Committee elections.

  **The Recommendation: Approval Voting**
  Under Approval Voting, voters may select ("approve") as many candidates as they find acceptable. The candidate with the highest total number of approval votes wins.

  *Implementation Details for Senate Office:*
  1.  **Ballot Design:** For each seat, list all certified candidates. Include a checkbox next to each name. Instructions shall read: *"Vote for one or more candidates. You may check as many boxes as you wish."*
  2.  **Counting Procedure:** Tally the total number of checks for each candidate. No weighting or transfers are required.
  3.  **Winner Determination:** The candidate with the highest tally is elected.
  4.  **Tie-Breaking:** In the event of an exact tie for the final seat, the tie shall be broken by a random draw (e.g., coin toss or drawing of lots) administered by the Senate Parliamentarian.

  **The Gibbard–Satterthwaite Theorem and Strategy**
  A significant portion of our debate centered on the Gibbard–Satterthwaite (G-S) theorem. It is essential we understand what this theorem does and does not imply for our choice.

  The G-S theorem proves that no ranked-choice voting system (where voters order candidates from first to last) can be perfectly strategy-proof when there are three or more candidates. In plain terms: under any ranked system, there will be scenarios where a voter achieves a better outcome by lying about their preferences (e.g., ranking a strong rival lower than they truly feel). Our senior colleague is correct that this theorem applies decisively to the IRV and Condorcet proposals. If we choose a ranked method, we must accept that it is theoretically vulnerable to tactical voting.

  However, the theorem does not settle the debate for two reasons. First, G-S applies specifically to rules based on *ordinal* rankings. Approval Voting asks a different question—it solicits *cardinal* or binary judgment (acceptable/unacceptable) rather than a ranking. Technically, the theorem does not cover this input type. Second, and more practically, the existence of a theoretical vulnerability does not mean a system is unworkable. Every voting method, including Approval Voting, can be manipulated in specific edge cases (e.g., "bullet voting," where a voter approves only their favorite to avoid helping a rival). The question is not whether a system is perfectly strategy-proof—none are—but which system minimizes harmful strategy while maximizing other values.

  **Why Strategy-Proofness Should Not Be the Decisive Criterion**
  We must treat the G-S objection seriously, but we should not allow it to veto all reform. Insisting on a strategy-proof system is a demand for theoretical perfection that no real-world election can satisfy. If we treat manipulability as a disqualifying flaw, we are left with no voting system at all.

  Instead, we should optimize for **simplicity** and **consensus**.
  *   **Simplicity:** Faculty participation is our most fragile resource. Approval Voting is the simplest system to explain and count. Complex ranked ballots (required for IRV or Condorcet) increase error rates and voter fatigue.
  *   **Consensus:** Our current plurality rule encourages factionalism and "spoiler" effects. IRV guarantees a majority but can eliminate broad consensus candidates early if they lack intense first-place support. Approval Voting incentivizes candidates to appeal broadly to the electorate. To win, a candidate must be acceptable to the largest number of colleagues, not just a passionate plurality. For a governing Executive Committee, broad acceptability is a more valuable trait than narrow majority intensity.

  **Addressing the Primary Objection**
  The strongest argument against Approval Voting is that it does not guarantee the winner has a majority of support, whereas IRV does. Proponents of IRV argue that a leader should command 50%+1 preference.

  We reject this as the primary criterion for two reasons. First, our current rule already fails to guarantee a majority (requiring only 40%), and IRV introduces significant administrative complexity for a marginal gain in theoretical legitimacy. Second, in a faculty senate, "majority preference" is often an illusion when preferences are fragmented among many qualified candidates. A candidate who is the second choice of 90% of the faculty (and thus approved by 90%) is often a better representative than a candidate who is the first choice of 51% but unacceptable to the other 49%. Approval Voting captures this breadth of support; ranked majority rules often obscure it.

  **Conclusion**
  No voting rule is immune to strategy, and the Gibbard–Satterthwaite theorem correctly warns us against expecting one. However, by moving to Approval Voting, we adopt a system that is simpler to administer, resistant to the spoiler effect, and conducive to electing consensus candidates. I recommend the Committee vote to advance this rule to the full Senate for adoption.
