      *   *Repair Cost:* If you change (1), you lose the hard-nosed "results only" stance. If you change (6), you lose the protection against benevolent tyranny. Given (5) and (7), the user cares about inequality and domination. So (6) is core to their identity. (1) is the one to bend.
