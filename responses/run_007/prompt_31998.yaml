          *   ML: Partial orders on model posteriors. Imprecise probabilities (sets of distributions).
          *   *Translation:* Credal sets, Distributionally Robust Optimization (DRO).
      *   **Concept 3: The Weight of Evidence:**
          *   Keynes: Probability $\neq$ Weight. Weight = amount of relevant evidence.
          *   ML: Epistemic uncertainty vs. Aleatoric. But specifically, *sample size* vs. *confidence*. Calibration confidence intervals.
          *   *Translation:* Distinguishing $P(y|x)$ sharpness from the robustness of that estimate to new data (meta-uncertainty).
      *   **Concept 4: Radical Uncertainty (The General Theory era):**
