      *   **Topic:** John Maynard Keynes's *A Treatise on Probability* (1921) and his distinction between risk and uncertainty (often associated with Knight, but Keynes has a specific logical theory of probability).
      *   **Task:** Translate Keynes's framework into ML terminology (priors, posteriors, model classes, i.i.d., KL, robustness, etc.).
