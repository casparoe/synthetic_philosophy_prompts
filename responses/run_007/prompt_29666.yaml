prompt: |-
  You serve on the board of a philanthropic foundation whose charter instructs you to maximize the good achieved per dollar spent. At your next meeting, you must vote between two grant proposals. The first funds a well-established malaria prevention program expected to save roughly 1,000 lives over the next five years, with a high degree of confidence in that estimate. The second funds a small research team working on the alignment of future advanced AI systems; their best estimate is that their work has something like a 0.01% chance of preventing an existential catastrophe that would foreclose the lives of trillions of future people. A straightforward expected-value calculation says the AI grant dominates by orders of magnitude. And yet you find yourself deeply reluctant to vote for it over the malaria program. Are you making a mistake, or is there a principled reason to resist the expected-value reasoning in a case like this?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Scenario:**
      *   **Role:** Board member of a philanthropic foundation.
      *   **Charter:** Maximize good achieved per dollar spent (Utilitarian/Effective Altruism framework).
      *   **Choice:**
          *   Option A: Malaria prevention (1,000 lives saved, high confidence, near-term).
          *   Option B: AI Alignment research (0.01% chance of saving trillions of future lives, low confidence, long-term/existential).
      *   **Conflict:** Expected Value (EV) calculation favors Option B massively. Intuition/reluctance favors Option A.
      *   **Question:** Is this reluctance a mistake, or is there a principled reason to resist the EV reasoning?

  2.  **Identify the Core Ethical/Philosophical Tension:**
      *   This is a classic "Pascal's Mugging" vs. "Longtermism" debate within Effective Altruism (EA).
      *   It pits *Act Utilitarianism* (maximize expected utility) against *Risk Aversion*, *Epistemic Humility*, *Uncertainty*, and *Moral Intuition*.

  3.  **Brainstorm Arguments for Option B (The EV/Longtermist View):**
      *   **Scale:** Trillions of lives vs. 1,000. Even tiny probabilities dwarf the certain gain.
      *   **Impartiality:** Future lives count as much as present lives.
      *   **Neglectedness:** Malaria is well-funded; AI safety might be more neglected (marginal utility of dollars).
      *   **Charter Adherence:** The charter says "maximize good," which implies EV maximization.

  4.  **Brainstorm Arguments for Option A (The Reluctance/Principled Resistance View):**
      *   **Epistemic Uncertainty:** 0.01% is a made-up number. It's not a known probability like a dice roll. It's subjective credence.
      *   **Pascal's Mugging:** If we accept tiny probabilities of huge utilities, we become vulnerable to any claim of huge utility (e.g., "Give me money or I'll simulate torture").
      *   **Risk Aversion:** Diminishing marginal utility of "good." Saving 1,000 lives *for sure* is psychologically and morally different from a lottery ticket for trillions.
      *   **Tractability/Verification:** Malaria results are measurable. AI safety results are abstract and hard to verify.
      *   **Duty to the Present:** Do we owe more to existing, suffering people than to potential people?
      *   **Institutional Competence:** Is a general foundation equipped to evaluate AI safety claims?
      *   **Diversification:** Putting all eggs in one basket (existential risk) vs. spreading risk.

  5.  **Structure the Response:**
      *   **Acknowledge the Dilemma:** Validate that this is a known, difficult problem in moral philosophy and effective altruism.
      *   **The Case for EV (Option B):** Briefly state why the math points there (Longtermism).
      *   **The Case for Reluctance (Option A):** Detail the principled objections (Epistemic, Risk, Moral).
      *   **Synthesis/Recommendation:** Offer a nuanced view on how a board member should decide, considering the charter.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Recognize the tension between "Longtermism" and "Near-termism."
      *   *The EV Argument:* Explain the math. $0.0001 \times \text{Trillions} > 1,000$. Mention the moral weight of future generations.
      *   *The Principled Objections (Why the reluctance isn't necessarily a mistake):*
          1.  **Epistemic Humility:** Probabilities aren't objective. 0.01% is a guess. Sensitivity to error is huge.
          2.  **Pascal's Mugging:** The logical problem of infinite utility $\times$ tiny probability. Need a "credibility threshold."
          3.  **Risk Aversion:** Utility functions aren't linear. Certainty has value.
          4.  **Verification/Feedback:** Malaria has feedback loops. AI safety doesn't (until it's too late?).
          5.  **Moral Commitments:** Duty to identifiable lives vs. statistical/future lives.
      *   *The Charter Constraint:* The charter says "maximize good." Does that mean *expected* good? If so, ignoring EV might violate the charter. But if "good" implies *realized* good, Option A is safer.
      *   *Conclusion:* It's not a simple mistake. It's a clash of frameworks. Suggest a balanced approach (portfolio, epistemic checks).

  7.  **Refining the Tone:**
      *   Must be balanced, philosophical, and practical.
      *   Avoid dismissing either side.
      *   Use terminology appropriate for the context (Expected Value, Longtermism, Pascal's Mugging, Epistemic Uncertainty).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific prompt? Yes (Mistake vs. Principled Reason).
      *   *Check:* Did I respect the charter? Yes, need to discuss how the charter interprets "maximize."
      *   *Nuance:* Make sure to distinguish between *objective* probability and *subjective* credence. That's the crux of the AI argument's weakness.
      *   *Add:* Mention "model uncertainty" vs. "parameter uncertainty."

  9.  **Final Polish:** Organize with clear headings for readability. Ensure the conclusion offers actionable guidance for the board member. (This aligns with the structure of the final output).

  **(Self-Correction Note):** I need to be careful not to simply say "AI is speculative." I need to explain *why* that speculation undermines the EV calculation philosophically, not just practically. The concept of "heavy-tailed uncertainty" is relevant here.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is one of the most significant and debated dilemmas in modern philanthropy and moral philosophy, often framed as the conflict between **near-term humanitarianism** and **longtermism**.

  You are not necessarily making a mistake. Your reluctance points to well-documented limitations in applying straightforward Expected Value (EV) reasoning to cases involving extreme uncertainty and astronomical stakes. While the EV calculation favors the AI grant mathematically, there are several principled reasons to resist it.

  Here is an analysis of the tension between the two options, structured to help you navigate your vote.

  ### 1. The Case for the AI Grant (The Longtermist View)
  The argument for the AI grant rests on three pillars common in Effective Altruism (EA) circles:
  *   **Impartiality:** A life saved in the future counts morally as much as a life saved today.
  *   **Scale:** The potential loss of "trillions of future lives" is so vast that even a minuscule probability reduction dwarfs the certain saving of 1,000 lives.
  *   **Neglectedness:** Malaria prevention is well-funded by governments and large NGOs. The marginal impact of your dollar might be higher in the underfunded AI safety space.

  If your charter strictly demands the maximization of *expected* utility, and you accept the researchers' probability estimate as valid, voting for malaria is technically a violation of your fiduciary duty to the mission.

  ### 2. Principled Reasons to Resist the EV Calculation
  However, your reluctance likely stems from valid epistemic and ethical concerns that straightforward EV math often obscures.

  #### A. Epistemic Humility and "Model Uncertainty"
  In the malaria case, the probability is based on historical data, epidemiological models, and measurable outcomes. The uncertainty is *parameter uncertainty* (e.g., will bed nets degrade faster than expected?).
  In the AI case, the 0.01% figure is not a frequency derived from data (we have no data on AI existential catastrophes). It is a subjective credence. The uncertainty is *model uncertainty* (e.g., is the problem framed correctly? Is alignment even possible in this way?).
  **Principle:** When probabilities are subjective estimates rather than empirical frequencies, EV calculations become fragile. A small error in estimating the probability (e.g., if the real chance is 0.000001%) collapses the expected value below the malaria program.

  #### B. Pascal's Mugging
  This scenario is a real-world version of the philosophical paradox known as "Pascal's Mugging." If you always maximize EV, you become vulnerable to any claim that posits a sufficiently large stake with a sufficiently small probability.
  **Principle:** To avoid being exploited by speculative claims, rational agents often employ a "credibility threshold" or discount factor for claims that rely on unverifiable, high-stakes predictions. Your reluctance may be a heuristic protecting the foundation from funding low-probability speculative ventures at the expense of tangible good.

  #### C. Risk Aversion and Diminishing Marginal Utility
  Standard EV theory assumes risk neutrality (1,000 lives for sure = 10% chance of 10,000 lives). However, most ethical frameworks and human intuitions are risk-averse.
  **Principle:** There is moral value in *certainty*. Saving 1,000 specific, identifiable people creates a concrete moral good. A lottery ticket for the future, even with high EV, might result in *zero* lives saved. If the foundation's goal is to ensure *some* good is done rather than gambling for *maximum possible* good, risk aversion is principled.

  #### D. Feedback Loops and Accountability
  Philanthropy requires learning. The malaria program offers clear feedback: did infection rates drop? This allows the foundation to learn and improve. The AI research may not yield verifiable results for decades, or ever.
  **Principle:** A foundation needs to verify its impact to fulfill its charter over time. Funding projects with no feedback mechanism makes it impossible to know if you are actually "maximizing good" or just burning money.

  #### E. The "Identifiable Victim" Effect
  While philosophers often dismiss the distinction between "identifiable" and "statistical" lives as irrational, some ethical frameworks argue we have stronger duties to those currently suffering and identifiable than to potential future people.
  **Principle:** There is a moral urgency to alleviate present suffering that is not fully captured by aggregating future utility.

  ### 3. Reconciling with the Charter
  Your charter instructs you to "maximize the good achieved." The interpretation of this phrase is key:
  *   **Ex-Ante Interpretation:** Maximize the *expected* good at the time of decision. (Favors AI).
  *   **Ex-Post Interpretation:** Maximize the *realized* good. (Favors Malaria, as the AI good is unlikely to materialize).

  If the board interprets "maximize" as "make the most rational bet," the AI grant wins. If "maximize" implies "ensure tangible positive impact," the malaria grant wins.

  ### Recommendation for the Board Member
  You are not making a cognitive error; you are experiencing the friction between **theoretical utilitarianism** and **practical decision-making under deep uncertainty.**

  To vote conscientiously, consider the following compromise positions:
  1.  **Portfolio Approach:** Does the charter require an "all or nothing" choice? A rational foundation might allocate 90% to high-confidence interventions (malaria) and 10% to high-variance, high-upside bets (AI). This respects the EV argument without betting the farm on a speculative probability.
  2.  **Epistemic Audit:** Before voting for the AI grant, demand an external audit of the 0.01% probability estimate. If the number cannot be defended against expert skepticism, the EV calculation fails.
  3.  **Tractability Check:** Ask if the grant is actually the bottleneck. Will this specific small team make the 0.01% difference, or is the problem dependent on broader geopolitical factors? If the money doesn't change the probability, the EV is zero.

  **Conclusion:**
  Your reluctance is principled. It reflects an understanding that **probability estimates in existential risk are not the same as probabilities in games of chance.** While the EV math is seductive, it relies on inputs that are arguably too uncertain to support the weight of the calculation. Voting for the malaria program is defensible as a commitment to **robustness over optimization**—ensuring that the foundation definitely does good, rather than gambling on a speculative claim of doing the most good.
