  - "Where the set actually pulls apart" — the genuine tensions, ranked, with which of your commitments are doing the pulling and why.

  The primary tension lies between (5) and the standing conditions (2), (3), and (7). Commitment (5) defines blame as protest on behalf of the victim or community, explicitly denying it concerns the blamer's moral purity. However, (2), (3), and (7) make standing entirely dependent on the blamer's personal moral record and psychological dispositions. If blame is merely registering a wrong (5), the hypocrite's record should be irrelevant; the wrong remains registered regardless of who speaks. By insisting hypocrites lack standing (2), you imply blame is partly about the blamer's relation to the norm, contradicting (5)'s explicit exclusion of purity. This is the highest severity tension because it strikes at the definition of blame's function versus its preconditions. If the community's interest (5) includes demanding moral consistency from accusers, then purity *is* the point, and (5) is false. If purity isn't the point, (2) is unmotivated. Rank: 1. (5) vs. Standing.

  The secondary tension exists between (3)/(4) and (7). (3) and (4) establish a clear economy of standing: you lose it via actual complicity and regain it via ownership. (7) destabilizes this by introducing counterfactual weakness. If I own my past (satisfying 4) but admit I might succumb again under pressure (satisfying 7), do I have standing? (7) suggests no, rendering (4)'s restoration mechanism fragile or meaningless. This creates operational instability in your workshop examples, as participants won't know if admission is enough. It is medium severity because it complicates application rather than undermining the core theory, but it risks making standing impossible to verify. Consequently, (7) threatens to swallow (3), making actual wrongdoing irrelevant compared to hypothetical weakness, which contradicts the intuitive weight given to actual acts in (3). Rank: 2. (3)/(4) vs. (7).

  - "Where it only looks like they conflict" — the pairs that seem bad but can be held together, and the distinction that dissolves each.

  (1) and (2) appear contradictory but are actually the foundational distinction of your view. (1) addresses the truth-value of the judgment (propositional content), while (2) addresses the normative authority of the speaker (illocutionary force). A hypocrite can speak truth without having the authority to rebuke. This is a standard distinction in contemporary blame literature, so holding both is coherent.

  (5) and (6) seem to clash because forgiveness usually ends disputes. However, (5) includes the "community" as a beneficiary of blame. Even if the victim forgives (6), the community's normative expectations may remain violated. Therefore, a third party can legitimately protest on the community's behalf despite the victim's personal resolution. The distinction between individual reconciliation and communal norm enforcement dissolves this tension.

  (1) and (5) also look tense—one is about truth, the other purpose. But a judgment can be true (1) and serve a protest function (5) simultaneously. There is no conflict between what blame *says* and what blame *does*.

  - "Cheapest fixes" — for each real tension, the least costly revision and what I'd lose by making it.

  For the primary tension ((5) vs. Standing), the cheapest fix is to modify (5). Remove the clause "not the blamer's own moral purity." Replace it with "not *solely* about purity." This acknowledges that while the wrong is central, the blamer's alignment with the norm is a precondition for the protest to be valid. Cost: You lose the clean separation between the act and the agent. Blame becomes partly expressive of the blamer's commitment, not just protest against the act. This weakens the objective stance of (5) and shifts your theory from a "message-centered" view to a "relationship-centered" view, requiring more justification for why the relationship matters. In a workshop, this means participants must evaluate each other's character, not just arguments.

  For the secondary tension ((3)/(4) vs. (7)), restrict (7). Limit counterfactual loss of standing to cases where the hypothetical action implies *endorsement* of the wrong, not mere weakness. Cost: You lose the bite against "I'm just weak like everyone else" hypocrisy. It narrows the scope of who lacks standing, potentially letting some hypocrites off the hook. Alternatively, clarify (4) to require a commitment to reform, not just admission. Cost: Makes regaining standing harder; mere admission isn't enough, requiring proof of changed disposition, which is epistemically difficult for others to verify. This raises the bar for reintegration into the moral community, potentially making standing too exclusive for a workshop setting aimed at dialogue. It risks turning the workshop into a tribunal rather than a space for repair.

  - "Your overall verdict" — whether the set is salvageable and which single change would clean up the most.

  The set is salvageable. The core insight (truth vs. standing) is sound and philosophically robust. The messiness arises from trying to keep blame purely objective (5) while imposing subjective conditions on the blamer (2, 3, 7). Single change: Revise (5). Acknowledge that standing is a precondition for the protest to be valid, meaning the blamer's relation to the norm *does* matter, contradicting the "not purity" clause. This aligns the function with the conditions. By admitting that the messenger matters to the message's uptake, you resolve the conflict between the purpose of blame and the requirements of the blamer without abandoning the standing framework.

  - "What would change your mind" — which argument or consideration would most likely lead you to a different ranking or verdict, and where in your reading of your commitments you're least confident.

  Argument: If standing is understood as an authority relation rather than a purity test. If I can show that hypocrites retain authority to protest despite personal failings because the norm exists independently of them.
  Uncertainty: I'm least confident in how you define "would have done the same" in (7). Is it psychological inevitability or normative endorsement? This ambiguity drives the tension with (4). If (7) is about endorsement, it fits better with (3). If it's about weakness, it conflicts with (4). Clarifying this could lower the severity of the second tension significantly.
