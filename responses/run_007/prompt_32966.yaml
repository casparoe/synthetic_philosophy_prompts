      *   *Check:* Is the Mask clear? It's an external handler suppressing the effect.
      *   *Check:* The "Intrinsic" argument. This is key. In SE, `private` variables are intrinsic to the object *instance*, but depend on the *class* definition (extrinsic). I need to highlight this tension.

  9.  **Structure of the Response:**
