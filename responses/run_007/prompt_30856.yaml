answer: |-
  ### Exam Question: The Condorcet Jury Theorem and Epistemic Democracy

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  The Condorcet Jury Theorem (CJT) is often invoked to argue that majority rule is epistemically superior to dictatorship or random choice. However, formal analysis suggests the inference from the theorem to a normative defense of democracy is non-trivial.

  **(a)** State the classical Condorcet Jury Theorem precisely. Define the necessary parameters regarding the choice set, voter competence, and the statistical relationship between voters. (5 marks)

  **(b)** A common gloss of the CJT’s independence assumption is that "voters do not influence one another." Explain why this causal description is insufficient for the theorem to hold. Specifically, discuss the role of common causes (e.g., shared evidence) and distinguish between the probability that the majority is correct under the model versus the probability that a specific observed majority verdict is correct. (7 marks)

  **(c)** Even if the mathematical assumptions of the CJT are satisfied, explain why the theorem does not automatically settle the case for democratic majority rule. Discuss the implications of the "determinate truth" assumption, the justification of the competence parameter, and the problem of heterogeneous competence. (8 marks)

  ***

  ### Model Answer

  **(a) The Classical Theorem**
  The classical Condorcet Jury Theorem models a group of $n$ voters deciding between two alternatives, one of which is objectively correct (a binary choice setting). Let $X \in \{0, 1\}$ represent the state of the world, where 1 is correct. Each voter $i$ casts a vote $V_i \in \{0, 1\}$. The model relies on three core assumptions:
  1.  **Binary Choice:** There are exactly two options, one correct.
  2.  **Homogeneous Competence:** Each voter has an identical probability $p$ of voting correctly ($P(V_i = X) = p$), where $p > 0.5$.
  3.  **Conditional Independence:** Votes are statistically independent conditional on the state of the world $X$. That is, $P(V_1, \dots, V_n | X) = \prod P(V_i | X)$.

  The theorem establishes that as $n \to \infty$, the probability that the majority vote matches the correct state $X$ converges to 1. Furthermore, for any finite $n > 1$, the probability of a correct majority decision is strictly greater than $p$.

  **(b) Independence and Inverse Probability**
  The slogan that "voters do not influence one another" describes causal independence but fails to capture the strict probabilistic requirement of the CJT. Voters may not communicate (no causal influence), yet their votes can be correlated due to common causes. For example, if all voters read the same biased newspaper or undergo the same flawed training, their errors will be correlated. In formal terms, $P(V_i, V_j | X) \neq P(V_i | X)P(V_j | X)$. If correlation is positive, the "wisdom of the crowd" effect diminishes; the group acts more like a single voter with weight $n$, and the convergence to certainty fails.

  This leads to a crucial distinction often overlooked: the CJT calculates the *reliability of the procedure* ex ante ($P(\text{Majority Correct} | \text{Model Assumptions})$). It does not directly tell us the probability that a *particular observed majority* is correct ex post ($P(\text{Correct} | \text{Observed Majority})$). To derive the latter, one needs a Bayesian inversion. We require a prior probability over the states of the world ($P(X)$) and often a likelihood ratio regarding the competence $p$. Without knowing the prior likelihood of the proposition being true, a unanimous majority vote on an inherently improbable claim may still leave the posterior probability of truth low. The theorem guarantees the procedure is truth-tracking *if* the assumptions hold, but it does not validate the output of a specific election without further information about priors and the independence structure of the evidence.

  **(c) Normative Limitations**
  Even where the mathematics holds, the CJT does not settle the normative case for democracy for three reasons. First, the **determinate truth assumption** presupposes an objective fact of the matter ($X$). Many political choices are not about truth but about aggregating conflicting preferences or values where no "correct" answer exists. Applying CJT here is a category error.

  Second, the **competence assumption** ($p > 0.5$) is taken as given. In practice, establishing that the average voter is better than chance is empirically difficult. If $p < 0.5$, the theorem reverses: the majority becomes almost certainly wrong as $n$ grows, suggesting we should follow the minority or invert the vote. The theorem offers no internal mechanism to verify $p > 0.5$.

  Third, the **homogeneity assumption** rules out expertise. If competence is heterogeneous, and we know one voter (an expert) has $p_{expert} \approx 1$ while others have $p_{avg} \approx 0.5$, majority rule is suboptimal compared to epistocracy (following the expert). The CJT defends majority rule only under the specific constraint that we cannot identify who is more competent. Thus, the theorem supports a specific, constrained form of epistemic democracy, not a blanket defense of majority rule in all contexts.

  ***

  ### Marking Scheme (20 Marks)

  **Part (a): Formal Statement (5 Marks)**
  *   **5 marks:** Precisely defines binary choice, homogeneous competence ($p > 0.5$), and conditional independence. States the convergence result ($n \to \infty$).
  *   **3-4 marks (B range):** States the general idea and $p > 0.5$ but is vague on independence (e.g., "votes are independent" without specifying conditional on state).
  *   **1-2 marks:** Fails to mention $p > 0.5$ or binary choice.
  *   **0 marks:** Incorrect statement of theorem.
  *   **Penalty:** Deduct 2 marks if independence is defined solely as "no communication."

  **Part (b): Independence & Probability Distinction (7 Marks)**
  *   **6-7 marks (A range):** Clearly distinguishes causal independence from conditional probabilistic independence. Provides a concrete example of common causes (e.g., shared news). Explicitly distinguishes $P(\text{Maj Correct} | \text{Model})$ from $P(\text{Correct} | \text{Observed Maj})$ and mentions the need for priors/Bayesian inversion.
  *   **4-5 marks (B range):** Explains common causes correlate votes but fails to articulate the inverse probability distinction (confuses procedure reliability with outcome certainty).
  *   **2-3 marks:** Mentions independence is important but treats it only as "no strategic voting."
  *   **0-1 marks:** Claims independence means voters are identical.
  *   **Specific Error:** If the student claims the theorem guarantees a specific election outcome is correct, cap this section at 2 marks.

  **Part (c): Normative Limitations (8 Marks)**
  *   **7-8 marks (A range):** Addresses all three limitations: (1) Truth vs. Preference, (2) Justification of $p > 0.5$ (and the $p < 0.5$ risk), (3) Heterogeneity/Expertise. Explains why these limit the *normative* leap.
  *   **5-6 marks (B range):** Discusses truth assumption and competence but misses the heterogeneity/expertise objection, or treats them superficially.
  *   **3-4 marks:** Focuses only on practical difficulties (e.g., "people lie") rather than structural model limitations.
  *   **0-2 marks:** Merely restates slogans about democracy without engaging the model's constraints.

  **Differentiation Criteria (A vs. B)**
  *   **To achieve an A (16+ marks):** The answer must explicitly formulate independence as *conditional on the state of the world* in Part (a) and explain the *inverse probability* problem in Part (b). It must identify *heterogeneity* as a specific mathematical limitation in Part (c).
  *   **A B grade (12-15 marks):** Will correctly state the theorem and note that common causes matter, but will likely conflate the reliability of the procedure with the probability of a specific outcome, or fail to note that known expertise undermines majority rule.

  ***

  **Confidence Note:**
  I am highly confident (95%) in the technical accuracy of the model answer regarding formal epistemology and social choice theory. The distinctions drawn between conditional independence and causal independence, and between procedure reliability and posterior probability, are standard in the literature (e.g., Dietrich & Spiekermann, 2013). The point I am least sure of is the pedagogical calibration for a 90-minute window; covering the Bayesian inversion nuance in Part (b) alongside the normative critique in Part (c) may be tight for some undergraduates, potentially compressing the depth of the normative analysis.
