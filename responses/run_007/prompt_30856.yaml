re reliable and majority rule need not be optimal. The model answer should be accurate enough that a colleague in formal epistemology would not object, and the marking scheme should also identify the specific errors that should cost marks, such as treating independence as merely the absence of strategic interaction or reading the theorem as a claim about the correctness of a given electoral outcome. After the marking scheme, add a brief note saying how confident you are in the model answer and singling out the one point you are least sure of.
