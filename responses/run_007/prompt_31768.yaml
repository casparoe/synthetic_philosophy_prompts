      *   *Scenario 8: The Unknowing Violator.* (Good for Mens Rea/Retribution). Technically broke law, didn't know, no harm. Retribution: No blame, no punish. Deterrence: Punish to make people check laws.

      *Refining for the "Self-Deception" Constraint:* To catch liars, I need pairs of questions that test the same principle in different contexts. Or, I need to track the *severity* chosen across the board. If someone picks "Therapy" on Q1 but "Life Sentence" on Q3 for a similar risk profile, that's inconsistency.
