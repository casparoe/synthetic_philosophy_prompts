answer: |-
  Here is a complete, ready-to-deploy quiz design. It includes the 8 diagnostic scenarios, the answer keys, the scoring logic, and the result text.

  ### Design Note: Why These Questions?
  I have selected these 8 scenarios because they are **"Theory Stress Tests."** In many real-world cases, all theories agree (e.g., "Murderer goes to prison"). To diagnose a philosophy, you need cases where the theories *fight*.
  *   **Questions 1, 4, 6** test **Retributivism** (Does past harm matter more than future risk?).
  *   **Questions 2, 7** test **Deterrence** (Is the punishment for *this* person or to scare *others*?).
  *   **Questions 3, 8** test **Incapacitation** (Do we lock them up because they are dangerous, even if they can't be fixed?).
  *   **Questions 5, 8** test **Rehabilitation** (Is the goal to cure, even if it means less punishment?).

  ---

  # The Quiz: "What's Your Penalty?"

  **Instructions:** Read each scenario carefully. Choose the sentence or outcome you believe is *most just*. Do not overthink it; go with your gut reaction.

  ### Q1: The Corporate Polluter
  A CEO knowingly dumped toxic waste into a town's water supply to save money. No one died, but 50 people got sick. The CEO is 65, has no prior record, and says he regrets it.
  *   **A.** **5 Years Prison.** The harm was severe; he needs to pay a price proportional to the suffering he caused.
  *   **B.** **$10 Million Fine + Community Service.** Prison won't fix the water. Make him pay to clean it up and fund health clinics.
  *   **C.** **15 Years Prison.** It needs to be harsh enough that no other CEO ever considers doing this again.

  ### Q2: The Abused Spouse
  A woman shoots her husband dead while he is sleeping. Evidence shows he had brutally abused her for 20 years and threatened to kill her that week. She is not considered a danger to anyone else.
  *   **A.** **Manslaughter (5 Years).** She broke the law and took a life, but the context reduces her moral blame slightly.
  *   **B.** **Acquittal (Freedom).** She was in a war zone at home; punishing her serves no purpose and she isn't a threat.
  *   **C.** **Murder (Life Sentence).** We cannot allow people to take the law into their own hands, or society will collapse into vigilante violence.

  ### Q3: The Three-Time Shoplifter
  A 40-year-old man is caught stealing $200 of groceries. It is his third offense. He is addicted to opioids and has no job. He is not violent.
  *   **A.** **Indeterminate Treatment.** He stays in a secure facility until doctors say his addiction is cured, whether that takes 6 months or 5 years.
  *   **B.** **Standard Sentence (1 Year).** Punish him for this specific theft. Past crimes don't change the desert for this one.
  *   **C.** **Habitual Offender (10 Years).** He hasn't responded to help before. Lock him up so he can't steal for a decade.

  ### Q4: The Drunk Driver (No Accident)
  A driver is pulled over. They are three times over the legal limit. They were driving dangerously, but no one was hurt and no property was damaged.
  *   **A.** **Heavy Fine + License Suspension.** No harm was done, so prison is disproportionate.
  *   **B.** **6 Months Prison.** They created a high risk of death. We punish the danger, not just the result.
  *   **C.** **Mandatory Rehab Program.** They clearly have an alcohol problem that needs fixing before they drive again.

  ### Q5: The Juvenile Arsonist
  A 14-year-old sets fire to a school garage. Damage is $50,000. Psychological evals say they acted on impulse due to untreated trauma, not malice.
  *   **A.** **Juvenile Detention until Age 21.** Keep them contained until they are mature enough to be safe.
  *   **B.** **Adult Prison (5 Years).** A fire could have killed people. The crime demands adult consequences.
  *   **C.** **Therapy + Restitution.** Their brain isn't fully developed. Force them to work off the debt and attend therapy.

  ### Q6: The Dying Murderer
  A man confesses to a murder from 10 years ago. He is now 80 and has terminal cancer with 6 months to live. He is bedridden and physically incapable of violence.
  *   **A.** **Life Prison (Hospice Care).** He deserves to die behind bars for taking a life, regardless of his current state.
  *   **B.** **Compassionate Release.** Imprisoning him costs money and prevents nothing. Let him die at home.
  *   **C.** **Execution (Expedited).** Dragging this out wastes resources. Enact the penalty swiftly to close the case.

  ### Q7: The Whistleblower
  A government employee leaks classified documents to the press. The leak exposes illegal government surveillance but violates the Espionage Act. They turned themselves in.
  *   **A.** **Maximum Sentence (30 Years).** If we don't punish this severely, everyone will leak secrets and national security fails.
  *   **B.** **No Punishment.** They served the greater good. The law was unjust in this specific instance.
  *   **C.** **Moderate Sentence (2 Years).** They broke the social contract and must pay a price, but their motive reduces the blame.

  ### Q8: The Dangerous Psychopath
  A serial offender has completed their prison sentence. Psychologists say they are still highly likely to re-offend violently, but there is no "cure" available.
  *   **A.** **Release Them.** They served their time. Punishing them further for a crime they *might* commit is unjust.
  *   **B.** **Civil Commitment.** Keep them in a secure hospital indefinitely. They are sick and dangerous, even if we can't cure them.
  *   **C.** **Preventive Prison.** Keep them in regular prison indefinitely. Society has a right to be safe from predators.

  ---

  # Scoring Key & Logic

  To score this, assign points to each option based on the **Primary Justification** it represents.

  | Question | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **Q1** | **Retribution** | **Rehab/Restorative** | **Deterrence** |
  | **Q2** | **Retribution** | **Incapacitation (Low Risk)** | **Deterrence** |
  | **Q3** | **Rehabilitation** | **Retribution** | **Incapacitation** |
  | **Q4** | **Retribution** | **Deterrence** | **Rehabilitation** |
  | **Q5** | **Incapacitation** | **Retribution** | **Rehabilitation** |
  | **Q6** | **Retribution** | **Utilitarian (Waste)** | **Deterrence** |
  | **Q7** | **Deterrence** | **Nullification** | **Retribution** |
  | **Q8** | **Retribution** | **Incapacitation** | **Incapacitation** |

  *Note on Q8:* Options B and C are both Incapacitation. Option A is Retribution (limits on punishment).
  *Note on Q2:* Option B is technically "No Punishment," but in this scoring key, it aligns with **Incapacitation** logic (Risk = 0, so Lockup = 0).

  ### Tallying the Score
  Count how many times the user selected each category.
  *   **R:** Retribution
  *   **D:** Deterrence
  *   **I:** Incapacitation
  *   **H:** Rehabilitation

  ### The "Consistency Check" (Crucial Step)
  Before revealing the result, check for **Incoherence**.
  *   **The "Coercive Rehab" Trap:** Did they choose **High Retribution** (Q1-A, Q5-B, Q6-A) AND **High Rehabilitation** (Q3-A, Q4-C, Q5-C)?
      *   *Why this is flagged:* Retribution demands a *fixed* sentence based on past harm. Rehabilitation demands an *indeterminate* sentence based on future cure. You cannot logically hold both as your *primary* driver. This usually indicates a user who wants to be "tough" but justifies it with "helpful" language.

  ---

  # Result Profiles

  Match the user's highest tally to these profiles. If the "Consistency Check" failed, show the **Incoherent** profile.

  ### 1. The Retributivist (Mostly R)
  **"Justice is a Debt."**
  You believe punishment is about moral balance. If someone breaks the law, they incur a debt to society that must be paid through suffering or restriction. You are skeptical of releasing someone early just because they are "fixed" or "no longer dangerous." If the crime was bad, the punishment must be severe, regardless of the cost or the future risk.
  *   **Philosophical Ancestors:** Immanuel Kant, G.W.F. Hegel.
  *   **The Self-Deception Check:** You might tell your friends you care about "accountability," but your answers show you prioritize payback over safety or reform.

  ### 2. The Deterrence Utilitarian (Mostly D)
  **"Punishment is a Price Tag."**
  You view punishment as a tool to manage behavior. You aren't interested in suffering for its own sake, but you are willing to make examples of people if it stops others from committing crimes. You support harsh penalties for high-visibility crimes (like corporate crime or espionage) to send a message to the public.
  *   **Philosophical Ancestors:** Jeremy Bentham, Cesare Beccaria.
  *   **The Self-Deception Check:** You probably think of yourself as pragmatic, but your answers suggest you are willing to sacrifice individual fairness for the sake of social order.

  ### 3. The Incapacitationist (Mostly I)
  **"Safety First."**
  Your primary concern is physical security. You don't necessarily hate offenders, but you view them as risks to be managed. If someone is dangerous, they stay locked up. If they aren't dangerous (like the abused spouse), you let them go. You care less about "desert" and more about "risk assessment."
  *   **Philosophical Ancestors:** James Q. Wilson, Modern Risk Management Theorists.
  *   **The Self-Deception Check:** You might claim you hate prison, but your answers show you support indefinite detention for anyone deemed "risky," even without a new crime.

  ### 4. The Rehabilitationist (Mostly H)
  **"Fix the Person."**
  You believe crime is a symptom of a broken system or a broken person. Punishment should only exist to facilitate change. You support indeterminate sentencing (stay until cured) and oppose harsh penalties for non-violent or juvenile offenders. You are the most likely to oppose punishing the "Dying Murderer" because it wastes resources.
  *   **Philosophical Ancestors:** Michel Foucault, Modern Restorative Justice Advocates.
  *   **The Self-Deception Check:** You likely identify as "progressive," but check your answers on Q3 and Q5. If you chose prison terms there, you are more punitive than you admit.

  ### 5. The Hybrid: "Limiting Retributivism" (Split R & H)
  **"Desert Sets the Limits, Utility Sets the Length."**
  This is the most common modern legal view. You believe people deserve punishment (Retribution), but the *amount* should be the minimum necessary to keep them from re-offending (Rehab/Utility). You won't punish a harmless person, but you won't let a harmful person go free either.
  *   **Philosophical Ancestors:** Norval Morris, H.L.A. Hart.
  *   **Verdict:** This is a stable, coherent position used by many sentencing guidelines.

  ### 6. The Incoherent: "The Punitive Humanitarian" (Flagged by Consistency Check)
  **"I Want to Hurt You For Your Own Good."**
  **Diagnosis:** Your answers are contradictory. You selected harsh, fixed sentences (Retribution) but justified them with language about treatment or future safety (Rehab/Incapacitation).
  **Why this is a problem:** Philosophically, this is an unstable position. If you punish someone because they *deserve* it, you can't release them early just because they are "cured." If you punish them to *cure* them, you can't keep them locked up after they are fixed.
  **The Hard Truth:** You likely want to be seen as compassionate, but your instincts are punitive. You support "mandatory treatment" that looks a lot like prison. Be honest: do you want to help them, or do you want to lock them up?

  ---

  # Implementation Notes for the Website

  1.  **JavaScript Logic:** You don't need complex AI. Just simple counters (`scoreR++`, `scoreD++`, etc.).
  2.  **The "Lie Detector" Feature:** To make the self-deception point land harder, add a single checkbox at the very start: *"I consider myself a progressive/reform-minded person."*
      *   If they check this box BUT score as a **Retributivist**, the Result Page header should read: **"Wait, Really? You scored as a Retributivist."**
      *   This directly addresses the prompt's requirement to catch people lying to themselves.
  3.  **Visuals:** Use icons for the results (e.g., Scales for Retribution, Shield for Incapacitation, Handshake for Rehab).

  ### Why This Works for a Philosophy Club
  *   **No Jargon:** Students aren't guessing definitions; they are making moral choices.
  *   **Friction:** Scenarios like the "Dying Murderer" or "Abused Spouse" force them to choose between two "good" values (Justice vs. Mercy).
  *   **Discussion Ready:** The "Incoherent" result is designed to be printed out and argued about in the next club meeting. It gives students a vocabulary to critique their own intuitions.
