      *   *Section 4: Mutations and Disease.* Discuss Claim 5 & 6. Distinguish Monogenic (single gene) vs. Polygenic (many genes + environment). DTC tests are usually polygenic risk scores or specific variants with low penetrance.
      *   *Section 5: The "Two Codes" Confusion.* Explicitly answer the user's specific question. 1. The Codon Table (universal chemistry). 2. The Genomic Sequence (individual variation). The booklet conflates the *mechanism* of translation with the *outcome* of development.
      *   *Conclusion/Advice:* How to interpret the health report. Don't panic. It's risk, not destiny. Consult a genetic counselor.

