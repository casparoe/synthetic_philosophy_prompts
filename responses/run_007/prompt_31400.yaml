answer: |-
  # Session Plan: The "Hidden Hedge" Tournament

  **Time:** 75 Minutes
  **Students:** ~20 (Upper-level Philosophy/Game Theory)
  **Goal:** Demonstrate that a pure strategy can be strictly dominated by a *mixture* of other strategies, and that eliminating it reveals further dominance relations (IESDS).
  **Materials:** One handout per student (Payoff Matrix + Scorecard), small slips of paper for strategy submission, candy/course points for prizes.

  ## 1. The Payoff Matrix (Symmetric)
  Print this clearly on the handout. Payoffs are "Points" (Row Player). Since the game is symmetric, Column Player gets the transpose.

  | | **Strategy 1** | **Strategy 2** | **Strategy 3** |
  | :--- | :---: | :---: | :---: |
  | **Strategy 1** | 4 | 4 | 0 |
  | **Strategy 2** | 2 | 0 | 10 |
  | **Strategy 3** | 1 | 1 | 4 |

  *Note for Instructor:*
  1.  **No Pure Dominance:** No single row dominates another. (e.g., S2 beats S1 if Opp plays S3; S3 beats S2 if Opp plays S2).
  2.  **Mixed Dominance:** A 50/50 mix of S1 and S2 yields expected payoffs of (3, 2, 5) against (S1, S2, S3) respectively. This strictly dominates S3 (1, 1, 4).
  3.  **Iteration:** Once S3 is eliminated, S1 strictly dominates S2 (4>2 and 4>0).
  4.  **Solution:** (S1, S1).

  ## 2. Session Flow (75 Minutes)

  ### Phase 1: Setup & Pure Play (20 Minutes)
  1.  **Distribution (5 mins):** Hand out matrices. Explain the game is symmetric. You will pair them up randomly.
  2.  **Incentives (2 mins):** "You will play 3 rounds against 3 different opponents. Your total points determine your rank. Top 25% of the class gets a bonus point/candy. Everyone gets participation credit for submitting."
  3.  **Round 1 (13 mins):**
      *   Students submit a **Pure Strategy** (1, 2, or 3) on a slip of paper.
      *   Collect, shuffle, and redistribute randomly (ensuring they don't play against themselves).
      *   Reveal matches, calculate scores, record on Scorecard.
      *   *Repeat 3 times with new partners.*
      *   **Instructor Action:** Tally the class frequency of each strategy on the board after each round.

  ### Phase 2: The Stall & The "Hedge" (25 Minutes)
  1.  **The Data Check (5 mins):**
      *   Ask: "Who played Strategy 3 consistently?" (Likely a few students).
      *   Ask: "How did your scores compare to the class average?" (Strategy 3 players will likely be at the bottom).
      *   Ask: "Why? Look at the matrix. Is Strategy 3 dominated by Strategy 1? No (0 < 4, but 4 > 0). By Strategy 2? No."
      *   *Create the tension:* They empirically see S3 is bad, but logically (using current tools) they cannot prove it.
  2.  **The "Hedge" Proposal (10 mins):**
      *   Ask a student: "If you weren't allowed to play 3, but you were unsure whether your opponent would play 1 or 2, what would you do?"
      *   Introduce the **Coin Flip Policy**: "What if you committed to playing 1 on Heads and 2 on Tails?"
      *   **Board Work:** Calculate the *Expected Payoff* of this 50/50 Mix against each of the opponent's pure strategies.
          *   Vs Opp 1: $0.5(4) + 0.5(2) = 3$. (Compare to S3's 1). **Mix Wins.**
          *   Vs Opp 2: $0.5(4) + 0.5(0) = 2$. (Compare to S3's 1). **Mix Wins.**
          *   Vs Opp 3: $0.5(0) + 0.5(10) = 5$. (Compare to S3's 4). **Mix Wins.**
      *   *Key Moment:* "So, a randomization beats Strategy 3 *no matter what the opponent does*. Strategy 3 is strictly dominated, but only by a mixture."
  3.  **The Elimination (10 mins):**
      *   "If we are rational, and we know others are rational, can we expect anyone to play Strategy 3?" (No).
      *   "Cross out Strategy 3 on your handout."
      *   "Now look at the remaining game (1 vs 2). Does a dominance relation exist now?"
      *   Students should see: Vs 1 (4>2), Vs 2 (4>0). Strategy 1 now dominates Strategy 2.
      *   "Cross out Strategy 2."
      *   "What is left?" (Strategy 1).

  ### Phase 3: Rational Play & Debrief (30 Minutes)
  1.  **Round 2 (10 mins):**
      *   "Play 3 more rounds. You may play any strategy, but you now possess the logic of elimination."
      *   Run the tournament again.
      *   *Prediction:* The vast majority will play Strategy 1. Scores will cluster. Strategy 2 and 3 players will vanish.
  2.  **Formal Debrief (20 mins):**
      *   **Map the Experience:**
          *   *Pure Dominance:* What they looked for in Phase 1.
          *   *Mixed Dominance:* The "Hedge" calculation in Phase 2. Emphasize that mixed strategies are not just about "being unpredictable"; they are tools for *dominance checking*.
          *   *Iterated Elimination:* The moment they crossed out S3 and realized S2 became suicidal.
      *   **Epistemic Assumptions (Philosophy Core):**
          *   Ask: "Why was it safe to eliminate S3?"
          *   Answer: "Because I believe you are rational."
          *   Ask: "Why was it safe to eliminate S2 *after* S3?"
          *   Answer: "Because I believe you are rational, **and** I believe you believe I am rational (Common Knowledge of Rationality)."
          *   If I thought you might play S3 (irrational), I might play S2 (to get the 10 points). Eliminating S2 requires knowing you won't play S3.
      *   **Limitations (The "Wrap-Up Supply"):**
          *   *Risk Neutrality:* The game assumes students maximize *expected points*. A risk-averse student might prefer S1 (stable 4) over S2 (risky 0/10) even without the dominance logic. Acknowledge this: "The formal definition assumes risk neutrality. In real life, variance matters."
          *   *The "Mix" as a Strategy:* In this game, they couldn't literally submit "50% 1, 50% 2" to the tournament box (it was pure submissions). The mix was a *theoretical device* to prove dominance. In formal game theory, the mix is also a playable strategy. Distinguish between *mixed strategy as a solution concept* vs. *mixed strategy as a dominance test*.

  ## 3. Predicted Failures & Mitigations

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Collusion** | Pairs agree to play (S2, S2) or (S3, S3) to "share" high scores. | **Random Matching:** Do not let them choose partners. Collect slips centrally and redistribute. Anonymize the scores. |
  | **Risk Aversion** | Students pick S1 in Round 1 because 4 is "safe," missing the lesson that S3 is *dominated*. | **Reframe in Debrief:** "If you picked S1 for safety, that's rational risk management. But today we are looking for *logical necessity*. S3 is logically indefensible, not just risky." |
  | **Confusion on Mix** | Students think they must physically flip a coin to play. | **Clarify:** "You don't have to play the mix. You use the mix as a measuring stick to see if a pure strategy is worthless." |
  | **Time Overrun** | Calculating scores takes too long. | **Simplify Scoring:** Don't calculate exact totals. Ask for a show of hands: "Who got more than 10 points?" "Who played S3?" Keep it qualitative. |

  ## 4. Instructor's Cheat Sheet (The Logic)

  **Step 1: Check Pure Dominance (Round 1)**
  *   Does S1 dominate S3? No (S3 gets 4 vs S3, S1 gets 0).
  *   Does S2 dominate S3? No (S3 gets 1 vs S2, S2 gets 0).
  *   *Result:* Stalled. Students feel S3 is weak but can't prove it.

  **Step 2: Check Mixed Dominance (Phase 2)**
  *   Consider $\sigma = 0.5 S1 + 0.5 S2$.
  *   $U(\sigma, S1) = 3 > U(S3, S1) = 1$.
  *   $U(\sigma, S2) = 2 > U(S3, S2) = 1$.
  *   $U(\sigma, S3) = 5 > U(S3, S3) = 4$.
  *   *Result:* S3 is strictly dominated. Eliminate S3.

  **Step 3: Iteration (Phase 2/3)**
  *   Remaining Matrix: S1 vs S2.
  *   $U(S1, S1) = 4 > U(S2, S1) = 2$.
  *   $U(S1, S2) = 4 > U(S2, S2) = 0$.
  *   *Result:* S2 is strictly dominated. Eliminate S2.
  *   *Survivor:* S1.

  ## 5. Handout Text (Draft)

  **The Tri-Strategy Tournament**
  **Rules:**
  1.  You will play 3 rounds against anonymous classmates.
  2.  In each round, submit **Strategy 1**, **2**, or **3**.
  3.  Your points are determined by the matrix below (Row = You, Column = Opponent).
  4.  **Goal:** Maximize your total points. Top 25% receive a bonus.

  **Matrix (Your Payoffs):**
  | | Opp 1 | Opp 2 | Opp 3 |
  | :--- | :---: | :---: | :---: |
  | **You 1** | 4 | 4 | 0 |
  | **You 2** | 2 | 0 | 10 |
  | **You 3** | 1 | 1 | 4 |

  **Scorecard:**
  Round 1: My Move ___ | Opp Move ___ | Score ___
  Round 2: My Move ___ | Opp Move ___ | Score ___
  Round 3: My Move ___ | Opp Move ___ | Score ___
  **Total:** ______

  *(Leave blank space on the back for the "Hedge" calculations during class)*
