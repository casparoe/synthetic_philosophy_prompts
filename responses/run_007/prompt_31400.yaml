                                  2.  $u(1,2) > u(2,2)$
                                  3.  $u(2,3) > u(1,3)$ (So 1 doesn't dominate 2 initially)
                                  4.  $0.5(u(1,c) + u(2,c)) > u(3,c)$ for all $c=1,2,3$.
                                  5.  $\exists c: u(3,c) > u(1,c)$
                                  6.  $\exists c: u(3,c) > u(2,c)$
                              *   *Solution:*
                                  *   Col 1: $1=4, 2=2 \rightarrow \text{Mix}=3$. Set $3=1$. (3 loses to 1, 2).
                                  *   Col 2: $1=2, 2=4 \rightarrow \text{Mix}=3$. Set $3=1$. (3 loses to 1, 2).
                                      *   Wait, if 3 loses to 1 and 2 in Col 1 & 2, where does it win?
                                      *   Must win in Col 3.
                                      *   Col 3: $1=0, 2=10 \rightarrow \text{Mix}=5$. Set $3=4$.
                                      *   Mix(5) > 3(4). OK.
                                      *   2(10) > 1(0). OK (2 survives initially).
                                      *   3(4) > 1(0). OK (3 not dominated by 1).
                                      *   3(4) < 2(10). (3 dominated by 2 in this col).
                                      *   *Problem:* Does 2 purely dominate 3?
                                          *   Col 1: $2(2) > 3(1)$.
                                          *   Col 2: $2(4) > 3(1)$.
                                          *   Col 3: $2(10) > 3(4)$.
                                          *   **Yes, 2 purely dominates 3.** I need to prevent this.
                                      *   I need 3 to beat 2 in Col 1 or 2.
                                      *   Let's change Col 2.
                                      *   Col 2: $1=4, 2=0 \rightarrow \text{Mix}=2$. Set $3=1$.
                                          *   $1(4) > 2(0)$. (1 dominates 2 here).
                                          *   $3(1) > 2(0)$. (3 beats 2 here!).
                                          *   Mix(2) > 3(1). (Mix beats 3).
                                      *   *Recap:*
                                          *   Col 1: $1=4, 2=2, 3=1$. (1>2, 2>3, 1>3).
                                          *   Col 2: $1=4, 2=0, 3=1$. (1>2, 3>2, 1>3).
                                          *   Col 3: $1=0, 2=10, 3=4$. (2>1, 2>3, 3>1).
                                      *   *Check Dominance:*
                                          *   **1 vs 2:** 1 wins Col 1, 2. 2 wins Col 3. (No pure dominance).
                                          *   **1 vs 3:** 1 wins Col 1, 2. 3 wins Col 3. (No pure dominance).
                                          *   **2 vs 3:** 2 wins Col 1, 3. 3 wins Col 2. (No pure dominance).
                                          *   **Mix(0.5 1 + 0.5 2) vs 3:**
                                              *   Col 1: Mix=3 > 3(1).
                                              *   Col 2: Mix=2 > 3(1).
                                              *   Col 3: Mix=5 > 3(4).
                                              *   **Success!** 3 is strictly dominated by Mix.
                                          *   **Iteration:** Remove 3.
                                          *   **Subgame (1 vs 2):**
                                              *   Col 1: $1(4) > 2(2)$.
                                              *   Col 2: $1(4) > 2(0)$.
                                              *   Col 3: $1(0) < 2(10)$.
                                              *   *Wait,* I need 1 to dominate 2 in the subgame. That means 1 must beat 2 in *all remaining columns*.
                                              *   The remaining columns are the strategies of the opponent. If we eliminate Strategy 3 for *both* players (Symmetric game), the opponent only plays 1 or 2.
                                              *   So we only care about Col 1 and Col 2.
                                              *   In Col 1: $1(4) > 2(2)$.
                                              *   In Col 2: $1(4) > 2(0)$.
                                              *   **Success!** Once 3 is gone, 2 is strictly dominated by 1.
      *   *Final Matrix:*
          *   | | 1 | 2 | 3 |
          *   |---|---|---|---|
          *   | **1** | 4 | 4 | 0 |
          *   | **2** | 2 | 0 | 10 |
          *   | **3** | 1 | 1 | 4 |
      *   *Symmetry:* This is a symmetric game. Row payoffs = Col payoffs.
      *   *Verification:*
          *   **Pure Dominance Check:**
              *   1 vs 2: 1 better in Col 1,2. 2 better in Col 3. (No).
              *   1 vs 3: 1 better in Col 1,2. 3 better in Col 3. (No).
              *   2 vs 3: 2 better in Col 1,3. 3 better in Col 2. (No).
          *   **Mixed Dominance Check (3 vs 0.5(1+2)):**
              *   Vs 1: $0.5(4)+0.5(2) = 3 > 1$.
              *   Vs 2: $0.5(4)+0.5(0) = 2 > 1$.
              *   Vs 3: $0.5(0)+0.5(10) = 5 > 4$.
              *   **3 is dominated.**
          *   **Iteration Check (Remove 3):**
              *   Opponent plays 1 or 2.
              *   If Opp 1: Play 1 (4) > Play 2 (2).
              *   If Opp 2: Play 1 (4) > Play 2 (0).
              *   **2 is dominated by 1.**
              *   **Solution:** (1, 1).

  4.  **Game Mechanics for Class:**
      *   **Name:** "The Tri-Strategy Tournament".
      *   **Setup:** 20 students. 10 pairs.
      *   **Rounds:**
          *   Round 1: Play 5 rounds against the *same* partner. (Allows them to notice patterns).
          *   Round 2: Shuffle partners. Play 5 rounds.
          *   *Correction:* To make them feel the *logical* elimination, empirical play might mislead if they coordinate on (2,2) or (3,3) by accident.
          *   *Better:* "Blind Submission". Everyone submits a strategy for a "Class Tournament".
          *   Payoff: Top 3 scorers get candy/points.
          *   This creates competition.
          *   *Wait, if it's one-shot, they won't learn.*
          *   *Hybrid:*
              1.  Handout the matrix.
              2.  Ask: "Who can find a dominated strategy?" (They will say None).
              3.  Play 3 rounds against random partners. Record scores.
              4.  Pause. Ask: "Did anyone play Strategy 3? How did you do?" (Likely poorly).
              5.  Ask: "Why? Is it dominated?" (They say No).
              6.  Prompt: "What if you could flip a coin?"
              7.  Reveal the mix logic.
              8.  Play 3 more rounds. See Strategy 1 take over.
      *   *Incentive:* Course participation points. 1 point for playing, 1 bonus point for being in the top 25% of scores.
      *   *Materials:* Handout with Matrix, Strategy Slips (1, 2, 3), Scorecard.

  5.  **Debrief Plan:**
      *   Map the "Coin Flip" insight to Mixed Strategy Dominance.
      *   Map the "Now Strategy 2 sucks" insight to Iterated Elimination.
      *   Map the "I knew you knew I wouldn't play 3" to Common Knowledge of Rationality.
      *   **Limitation:** The game relies on them *seeing* the loss. It doesn't prove the *necessity* without the math. The wrap-up must supply the formal proof. Also, the game assumes risk-neutrality (expected points), which might not hold for students anxious about points.

  6.  **Predicted Failures:**
      *   *Collusion:* Pairs might agree to play (2,2) or (3,3) to average points. (Mitigation: Random matching, anonymous submission).
      *   *Risk Aversion:* Strategy 2 has high variance (0 or 10). Strategy 1 is stable (4). Students might pick 1 for safety, confusing the dominance lesson. (Mitigation: Emphasize expected value in debrief).
      *   *Confusion:* They might think the "Mix" means they literally have to randomize in the game. (Clarify: The mix is a *tool for analysis*, not necessarily a required move, though playing the mix is a valid strategy in extended game).
      *   *Time:* 75 mins is tight. Keep instructions crisp.

  7.  **Final Polish:**
      *   Ensure the matrix is clearly presented.
      *   Make the "Coin Flip" moment the climax of the first half.
      *   Ensure the philosophy connection (epistemic logic) is explicit.

  8.  **Wait, one check on the Matrix:**
      *   Row 1: 4, 4, 0
      *   Row 2: 2, 0, 10
      *   Row 3: 1, 1, 4
      *   Is it symmetric? Yes.
      *   Does 3 dominate? No.
      *   Does Mix(1,2) dominate 3?
          *   Vs 1: 3 vs 1. (3 > 1).
          *   Vs 2: 2 vs 1. (2 > 1).
          *   Vs 3: 5 vs 4. (5 > 4).
          *   Yes.
      *   Does 1 dominate 2 after 3 is gone?
          *   Vs 1: 4 vs 2.
          *   Vs 2: 4 vs 0.
          *   Yes.
      *   Perfect.

  9.  **Structuring the 75 Minutes:**
      *   0-10: Intro & Rules.
      *   10-25: Round 1 (Pure strategies only). Data collection.
      *   25-40: The "Stall". Discussion. Why did 3 lose? Introduce the "Hedge" (Mixed).
      *   40-55: Round 2 (Can submit 'Hedge' or just realize 1 is best).
      *   55-75: Formal Debrief & Philosophy.

      *Wait, if I allow them to submit 'Hedge' in Round 2, it validates the mixed strategy as a playable move.*
