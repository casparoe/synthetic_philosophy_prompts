      *   **Diagnosis 1: The Category Error (Natural vs. Social Kinds).**
          *   Explain that "Real" is ambiguous. Does it mean "exists in nature independent of humans" (like gold) or "has real causal effects" (like money)?
          *   Race/Gender are *Social Kinds* with *Biological Correlates*.
          *   The "Realist" side points to correlates (bones, genes). The "Constructionist" side points to the classification system itself (history, fluidity).
          *   *Key Insight:* They are talking past each other about *what* is real. The biology is real; the *grouping* is constructed.
      *   **Diagnosis 2: Interactive Kinds (Hacking).**
