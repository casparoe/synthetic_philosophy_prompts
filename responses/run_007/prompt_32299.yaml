prompt: |-
  Ive got this friend who's been reading a lot of Dennett and keeps telling me the whole idea that there's a raw, private feel to experiences—like the redness of a red thing or the bitterness of coffee—is basically confused. He's been giving me all these examples. Like, he says beer is an acquired taste; what you experience when you first sip it isn't some fixed inner something, it changes as you learn and your expectations shift, so there's nothing purely intrinsic there. He also talks about how wine tasters get trained to notice differences they couldn't notice before, and maybe that means we can actually learn to describe these so-called indescribable feels. And he brought up the inverted glasses experiments to say our reports of what things look like are way less reliable than we think. I'm honestly not sure what to make of this. Is he actually showing that the whole category of private experience is bad, or is he just showing that our descriptions of it are messy? I don't want to keep debating him without a clearer idea of the options. Could you help me sort out which parts of his arguement are actually persuasive?
