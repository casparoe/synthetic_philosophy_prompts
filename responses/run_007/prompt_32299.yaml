      *   *Inverted Glasses:* This attacks the *private/incorrigible* nature. If we can be wrong about our own experience (or if the experience shifts without us noticing), our first-person authority is shaky.
      *   *Underlying Philosophy:* Dennett isn't just saying "descriptions are messy." He's saying the *concept* of qualia relies on properties (intrinsic, ineffable, private, directly apprehensible) that don't hold up to scrutiny. If you remove those properties, nothing is left of "qualia."

