      *   *Key distinction:* A CD is passive. A brain is active. The "Frame" for a CD is external (the player). The "Frame" for a brain is internal (its structure).
      *   *Better distinction:* **Interpretation vs. Instantiation.** A frame message is *interpreted*. A cognitive structure *instantiates* the rules. You don't interpret your own neural wiring; you *are* it.
      *   *Premise to attack:* (3) assumes the frame is always a *message*. Hofstadter implies the bottom frame is a *mechanism*.
