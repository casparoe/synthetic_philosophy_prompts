      *   *Analysis of (3):* Distinguish between *symbolic decoding* (which needs a frame) and *causal processing* (which doesn't). The "Frame" in GEB shifts from being a *message* to being a *mechanism*.
      *   *Hofstadter's Actual Move:* It's not just "hardware." It's the **Strange Loop**. Premise (6) is false *within Hofstadter's system*. A system *can* represent its own rules if it has sufficient complexity (Gödel numbering).
