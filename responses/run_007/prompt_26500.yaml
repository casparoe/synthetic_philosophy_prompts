  This is a classic problem in meta-philosophy: distinguishing verbal disputes (disagreements about words/definitions) from substantive disputes (disagreements about the world). Your teacher's verdicts are consistent, but as you've noticed, they underdetermine the underlying criterion.

  Here are the two strongest candidate principles she could be using, how they apply to the corporation case, and how you might test them.

  ### Candidate Rule 1: The "Ontological Depth" Principle (Realism vs. Convention)

  **The Rule:** A dispute is **merely verbal** if the concept in question is a matter of pragmatic convention, taxonomy, or stipulation, where no "further fact" exists beyond the agreed-upon descriptive features. A dispute is **genuine** if the concept tracks a robust metaphysical, epistemic, or moral reality that is not exhausted by descriptive facts.

  *   **Fit with previous verdicts:**
      *   *Verbal:* "Alive," "Natural Number," and "Sandwich" are treated as useful labels we apply to the world, not deep features of reality. There is no "fact of the matter" beyond the biochemistry or the ingredients.
      *   *Genuine:* "Identity" (Ship), "Knowledge" (Gettier), and "Moral Wrongness" are treated as tracking real states of affairs. Even if we agree on the physical planks or the descriptive act, there is a further metaphysical fact (is it the *same* object?), epistemic fact (is it *knowledge*?), or moral fact (is it *wrong*?) that is up for debate.
  *   **Prediction for the Corporation Case:** **Merely Verbal.**
      *   *Reasoning:* Legal personhood is widely understood in philosophy of law as a "fiction" or a functional tool, not a metaphysical reality. Since the disagreement is about applying a statutory term to agreed-upon structural facts (like the virus case), and "person" in this context is a legal convention rather than a moral or metaphysical essence, this rule classifies it as a dispute about definitions, not reality.

  ### Candidate Rule 2: The "Normative Stakes" Principle (Consequences vs. Taxonomy)

  **The Rule:** A dispute is **merely verbal** if the classification has no significant impact on how the entity is treated, held responsible, or what rights/duties it possesses. A dispute is **genuine** if the classification determines normative status, liability, entitlement, or responsibility.

  *   **Fit with previous verdicts:**
      *   *Verbal:* Whether a virus is "alive" or a hot dog is a "sandwich" carries no weight regarding rights, blame, or credit. It is purely taxonomic.
      *   *Genuine:* Moral wrongness determines blame/praise. Knowledge determines epistemic credit/trust. Ship identity determines ownership, insurance, and responsibility over time (implicit in treating it as a genuine metaphysical puzzle).
  *   **Prediction for the Corporation Case:** **Genuine.**
      *   *Reasoning:* Corporate personhood is not a harmless label; it determines liability, tax obligations, free speech rights, and the ability to sue or be sued. Because the outcome of the dispute changes how the entity *ought to be treated* under the law (a normative outcome), this rule classifies it as a substantive dispute, similar to the morality case.

  ### Which Rule is She Most Likely Using?

  I believe she is most likely using **Candidate Rule 1 (The Ontological Depth Principle)** and will rule the case **Merely Verbal**.

  **Why?**
  1.  **The "Statute" Constraint:** The prompt specifies the dispute is "for purposes of a particular statute." This mirrors the "Zero is a natural number" case. In mathematics, whether zero is included in $\mathbb{N}$ depends entirely on the specific textbook or convention being used. Similarly, statutory personhood is a matter of legislative definition, not metaphysical discovery.
  2.  **The "Agreement on Facts" Parallel:** The phrasing for the corporation case ("everyone agrees on all the factual features... disagreement is purely about whether the legal term properly applies") is almost identical to the virus case ("agree on all the underlying biochemistry"). In contrast, the morality case, while agreeing on *descriptive* facts, implies a disagreement on *normative* facts. If she viewed legal personhood as a normative fact (like morality), she likely would have framed it as a disagreement about rights rather than the application of a term.
  3.  **Philosophical Pedagogy:** Teachers often use the corporate personhood case to demonstrate that high-stakes disputes can still be verbal. It serves as a warning: just because people are shouting about "rights" doesn't mean they aren't just arguing over a definition (like the hot dog).

  ### The Test Case

  If you want to settle which principle she holds before next week, propose this case:

  **"Whether a specific calendar date counts as the 'end of the fiscal year' for a tax contract, where the parties agree on the dates and the text, but the text is ambiguous."**

  *   **Why this settles it:**
      *   **High Stakes (Rule 2 Trigger):** The verdict determines significant financial liability and legal obligation (similar to Corporate Personhood and Morality).
      *   **Low Ontology (Rule 1 Trigger):** A fiscal year date is a pure convention; there is no "metaphysical fact" about when a year ends (similar to Zero and Hot Dogs).
  *   **The Verdicts:**
      *   If she says **Merely Verbal**, she is following **Rule 1 (Ontological Depth)**. She believes that even high-stakes disputes are verbal if the concept is purely conventional. (This supports the prediction that the Corporation case will be Verbal).
      *   If she says **Genuine**, she is following **Rule 2 (Normative Stakes)**. She believes that if money/rights are on the line, the dispute is substantive. (This supports the prediction that the Corporation case will be Genuine).
