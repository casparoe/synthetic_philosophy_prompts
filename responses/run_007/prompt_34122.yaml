answer: |-
  **The Moral Texture of Mind: What the Knobe Effect Reveals About Intentional Action**

  In the landscape of experimental philosophy, few findings have generated as much friction as the Knobe Effect. Discovered by Joshua Knobe in 2003, the effect highlights a striking asymmetry in how ordinary people attribute intentionality. In the canonical vignette, a CEO implements a profit-maximizing policy that he knows will harm the environment. Participants overwhelmingly judge that the CEO harmed the environment *intentionally*. However, when the vignette is altered so that the policy *helps* the environment, participants overwhelmingly deny that the CEO helped the environment *intentionally*, despite the causal structure and the CEO's knowledge remaining identical. This asymmetry suggests that moral considerations influence the attribution of mental states. The central philosophical controversy concerns what this influence signifies: does it reveal a flaw in human reasoning, or does it expose the true nature of the folk concept of intentional action? While performance error accounts offer a comforting defense of traditional action theory, the robustness and nuance of the data suggest that the Knobe Effect reveals a genuinely conceptual truth: the folk concept of intentional action is not a value-free descriptive category, but is inextricably tied to normative evaluations of the agent's attitudes.

  To preserve the traditional philosophical distinction between fact and value, many theorists have argued that the Knobe Effect is a performance error. On this view, the underlying folk concept of intentional action is purely descriptive, relying on standard criteria such as desire, belief, and causal control. The asymmetry arises not because the concept itself is normative, but because the experimental task triggers pragmatic confounds. For instance, the "Blame Hypothesis" suggests that participants conflate the question "Did he do it intentionally?" with "Is he blameworthy?" Because the CEO in the harm case deserves blame, participants reach for the label "intentional" as a proxy for censure. Conversely, in the help case, the CEO is not particularly praiseworthy (since he acted only for profit), so participants withhold the label "intentional" to avoid implying praise.

  The strength of the performance error account lies in its parsimony. It protects the intuition that intentionality is a metaphysical property of an action, independent of its moral worth. If this account were true, it would imply that folk psychology is fundamentally rational and descriptive, merely susceptible to emotional interference in specific contexts. However, this view suffers from significant empirical weaknesses. The Knobe Effect has proven remarkably robust; it persists across diverse cultures, age groups (including young children), and even when researchers explicitly attempt to decouple blame from intentionality in the phrasing of the questions. Furthermore, if the effect were merely a pragmatic confusion, one would expect it to dissipate under cognitive reflection or when the stakes are lowered. Instead, the asymmetry remains stable. The systematic nature of the bias suggests it is not a bug in the processing of the concept, but a feature of the concept itself.

  If the effect is not a performance error, it must be conceptual. Joshua Knobe's original proposal was radical: he argued that moral valence is constitutive of the concept of intentional action. On this "Radical Normative" view, the folk do not first determine the mental states and then judge the morality; rather, the moral judgment partly determines whether the mental states count as intentional. The strength of this account is its direct fit with the data. It explains why the only variable that changes—the moral quality of the outcome—drives the shift in judgment. It suggests that "intentional" is a "thick" ethical concept, much like "cruel" or "generous," which describes a fact while simultaneously evaluating it.

  However, the Radical Normative view faces a theoretical hurdle: it risks making the concept of intentionality too unstable. If intentionality depends entirely on the observer's moral valuation, then two observers with different moral frameworks could look at the exact same action and disagree on whether it was intentional, not because they disagree on the facts, but because they disagree on the good. This seems to undermine the utility of intentionality as a tool for predicting and explaining behavior. If I cannot agree with my neighbor on whether an action was done on purpose without first agreeing on a moral theory, the concept loses its descriptive power.

  This limitation has given rise to a third family of views, which grants that the effect is conceptual but argues that it tracks something narrower than general moral valence. Often termed the "Normative Attitude" or "Deep Self" account, this approach suggests that intentionality attributions depend on whether the side effect reveals something about the agent's relationship to relevant norms. In the harm case, the CEO's indifference to environmental damage violates a normative expectation that agents should avoid harm. This violation makes the side effect salient as an expression of the agent's "deep self" or character. In the help case, indifference to a benefit does not violate a norm; therefore, the side effect is not seen as flowing from the agent's core attitudes in the same way.

  The Normative Attitude account offers the most plausible explanation because it navigates between the Scylla of performance error and the Charybdis of radical moralism. It acknowledges the normative dimension without reducing intentionality to simple moral approval or disapproval. Empirical support for this view is found in variations of the vignette where the CEO's attitude is manipulated. If the CEO in the "help" case expresses genuine joy about the environmental benefit, participants are more likely to attribute intentionality, even if the motive remains profit. Conversely, if the CEO in the "harm" case expresses deep regret, intentionality attributions drop. These shifts indicate that participants are not merely tracking the outcome's value (good vs. bad), but are evaluating the agent's stance toward that outcome relative to normative expectations.

  This refined conceptual view explains why the performance error account fails: the judgment is not a confusion of blame and intent, but a genuine assessment of agency. We do not blame the CEO because he acted intentionally; we judge him to have acted intentionally because his indifference to harm reveals a blameworthy orientation of the will. The concept of intentional action, for the folk, serves a social function: it identifies actions that are properly attributable to the agent for the purposes of holding them responsible. An outcome that occurs merely as a byproduct, without engaging the agent's normative sensitivities, is less "theirs" than an outcome that resonates with their values or violations.

  In conclusion, the Knobe Effect reveals that the folk concept of intentional action is not a sterile, mechanical categorization of causal chains. While the performance error account correctly identifies the tension between descriptive and normative reasoning, it underestimates the systematic nature of the asymmetry. The Radical Normative account correctly identifies the normative core but oversimplifies the mechanism by focusing on outcome valence alone. The most compelling explanation is the Normative Attitude account. It demonstrates that intentionality is a hybrid concept, rooted in cognitive facts about belief and desire, but structured by normative expectations about how agents should relate to the consequences of their actions. Ultimately, the Knobe Effect teaches us that in the eyes of the folk, to act is not merely to cause change, but to navigate a moral landscape; an action is intentional when it reflects the agent's stance within that landscape.
