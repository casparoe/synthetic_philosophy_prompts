      *   *Rectification:* If steps 1 or 2 are violated, the holding is unjust. We need to fix it. Nozick admits this is the weakest part of *Anarchy, State, and Utopia* (ASU). He suggests looking at the pattern that *would* have obtained had the injustice not occurred, but admits this is counterfactual and messy.
