      *   *So the Access Rule fits perfectly.*
      *   *The Physiological Rule fits 1-7 only if we assume Sleepwalking/Night Terrors are non-REM (which they are) and SWS is non-dreaming (standard view). But REM Null breaks it.*
      *   *Okay, the logic holds.*

      *   *Discriminating Case:* The SWS Dream Report is the classic "Foulkes" case. If she says "Experience," she confirms Report > Physiology. If "No," she confirms Physiology > Report. This is the cleanest test.
