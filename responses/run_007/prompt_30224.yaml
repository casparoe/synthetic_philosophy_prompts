      *   *So the New Case:* If she is consistent, REM Null = No Experience. Because without access/report, she treats it like Sleepwalking (Case 4).
      *   *Wait, one nuance:* In Case 3 (Ordinary Dream), the report is *after* waking. In Case 2 (Lucid), the signal is *during*. In REM Null, there is neither.
      *   *Is there a rule that says "REM + No Report = Experience (but forgotten)"?* That would be the Physiological Rule.
