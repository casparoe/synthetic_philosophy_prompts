answer: |-
  1. Pascal distinguishes justice as establishing a right to be voluntarily followed from force as establishing a necessity to be compulsorily obeyed.
  2. He argues that justice alone remains powerless against contradiction, while force alone remains tyrannical because it lacks moral legitimacy, creating a structural need to unite them.
  3. The argument shifts to an epistemic constraint where justice is inherently disputable and thus cannot be empirically strengthened, whereas force is immediately recognizable and undisputed.
  4. Because the ideal alignment of strength with justice is impossible, the logical solution is to confer the title of justice upon existing force rather than empowering justice itself.
  5. This treats justice as a separable label that force can appropriate, suggesting its normative content is dissolved into a mere function of stabilized authority rather than surviving as an independent standard.
