answer: |-
  Dear colleague,

  It is great to hear from you, and you have put your finger on one of the most persistent and frustrating tensions in the philosophy of science. You are absolutely right that this pattern shows up everywhere from macroeconomics to climate science, and while Milton Friedman is the most famous proponent of it, the move itself predates him and extends well beyond economics. There is not one single settled term that captures every nuance of this argumentative move, but the standard philosophical label for the underlying stance is instrumentalism. When a modeler defends a known falsehood by appealing to predictive success, they are making an instrumentalist defense of their model. They are treating the model not as a literal description of reality, which would require true assumptions, but as an instrument or a tool for generating correct predictions. In this view, the model is like a map that distorts distances to preserve shapes; the distortion is false, but if it helps you navigate, it is valid.

  The specific version you associate with Friedman is often called the irrelevance of assumptions thesis or Friedman's thesis. In his 1953 essay The Methodology of Positive Economics, he argued that the only relevant test of a theory is whether it yields accurate predictions, and that realistic assumptions are often impossible or even undesirable if they complicate the model without improving prediction. He famously used the example of a billiard player who acts as if they know the complex mathematical formulas of physics, even though they obviously do not. The assumption is false, but the prediction of where the ball goes is accurate. When you see this move in climate science or epidemiology, it is essentially the same logic: the modeler is claiming empirical adequacy rather than ontological truth. They are saying the model saves the phenomena, to use an old phrase from the Greeks, even if the machinery inside the box does not resemble the real world.

  You asked how this relates to idealization, and this is where things get subtle because all models involve idealization. Philosophers of science generally distinguish between different kinds of idealization. There is Aristotelian idealization, where you simplify a system by ignoring factors deemed irrelevant, like friction in a physics problem. Then there is Galilean idealization, where you distort properties to make the system tractable, like assuming a perfect vacuum. The move you are describing is often a defense of what some philosophers call minimalist idealization or even deformative idealization. The key distinction between ordinary idealization and the move you are tracking is the response to criticism. In ordinary modeling, a scientist admits an assumption is false but plans to relax it later to get closer to the truth. In the instrumentalist move you are describing, the scientist argues that relaxing the assumption is unnecessary because the falsehood is doing useful work. They are not apologizing for the false assumption; they are defending its utility.

  Distinguishing this from sloppiness or hand-waving is crucial for your reporting. The difference lies in the claim of predictive success. A sloppy modeler ignores false assumptions because they haven't checked the predictions or don't care. An instrumentalist modeler points to the predictions as the justification for the assumptions. If the model fails to predict, the instrumentalist defense collapses, and the false assumptions become a liability. So the litmus test for whether this is a legitimate philosophical move or just bad science is whether the model actually delivers on its predictive promises. If the model predicts poorly and the scientist still hides behind the irrelevance of assumptions, that is dogmatism, not instrumentalism. Conversely, the mirror-image mistake you mentioned, where critics dismiss a model solely because an assumption is false, is often called the fallacy of descriptive realism. This is the demand that a model must look like the world to work on the world, which history shows is often not the case.

  If you need a specific phrase to use in your writing that is accurate but accessible, I would suggest calling it the instrumentalist defense or the predictive validity argument. You might also refer to it as prioritizing empirical adequacy over descriptive realism. While Friedman's name is attached to the most famous version, using terms like instrumentalism helps you connect it to the broader history of science, where physicists have long used models they knew were physically impossible, like treating light as a ray or a fluid, because those models worked. The tension you are seeing is the eternal conflict between scientific realism, which wants theories to be true, and instrumentalism, which wants theories to be useful. Recognizing this distinction should help you frame the debate not as one side being right and the other wrong, but as a disagreement over the primary goal of the modeling exercise itself.

  I hope this helps clarify the terminology for your work. It is a sophisticated distinction to make in real time, but having the right labels should make it easier to pin down when a scientist is making a principled philosophical argument versus when they are simply dodging criticism. Please feel free to reach out if you want to dig deeper into any of these specific concepts.

  Best regards,

  Your colleague
