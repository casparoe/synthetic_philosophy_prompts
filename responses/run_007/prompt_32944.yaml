answer: |-
  You have put your finger on one of the most persistent and difficult problems in the history of metaphysics and logic. You are not confused; you have independently reconstructed a classic argument.

  The canonical name for this is **Bradley's Regress**.

  However, that name only covers the ontological version of the problem. Depending on whether you are looking at it through the lens of language, logic, or reality, it goes by a few other names and overlaps with several distinct but related debates.

  Here is a breakdown of the territory, the history, the distinctions, and the current status of the problem.

  ---

  ### 1. The Canonical Name: Bradley's Regress
  The argument is named after the British Idealist **F.H. Bradley**, who formulated it most famously in *Appearance and Reality* (1893).

  *   **The Argument:** If a fact (e.g., "Socrates is wise") consists of a substance (Socrates) and a property (Wisdom), there must be something that ties them together (a relation of instantiation/exemplification). But if that tie is itself a thing (a relation), it needs a further tie to connect it to Socrates and Wisdom. This leads to an infinite regress.
  *   **Bradley's Conclusion:** Since an infinite regress is vicious (it prevents the fact from ever actually being constituted), relations cannot be real. Therefore, reality must be a single, undifferentiated Absolute. (Most modern philosophers reject this conclusion, but they still wrestle with the regress).

  ### 2. The Territory: What Exactly Does It Cover?
  You asked if it is about relations, predication, or the unity of propositions. The answer is **all three**, but they are distinct layers of the same problem.

  #### A. The Ontological Version (The Unity of the Fact)
  This is the purest form of Bradley's Regress. It asks: What makes a *state of affairs* exist rather than just a heap of constituents?
  *   **Issue:** If the world is made of objects and properties, what is the "ontological glue"?
  *   **Status:** Taken very seriously in analytic metaphysics.

  #### B. The Logical Version (The Unity of the Proposition)
  This asks: What makes a sentence a *claim* that can be true or false, rather than just a list of words?
  *   **Issue:** "Socrates wisdom" is a list. "Socrates is wise" is a proposition. What is the job of the verb "is"?
  *   **Status:** This was a major obsession for **Bertrand Russell** and the early **Wittgenstein**.

  #### C. The Semantic Version (Predication)
  This asks: How does a predicate attach to a subject?
  *   **Issue:** If "wise" is a name for a property, and "Socrates" is a name for a man, predication looks like naming two things. But predication isn't naming.
  *   **Status:** Often dissolved by linguistic philosophy (e.g., Strawson), but revived in truthmaker theory.

  ### 3. Historical Trajectory and Variations

  #### Plato and the Third Man Argument
  This is the ancient cousin. In the *Parmenides*, Plato worries that if a man is like the Form of Man, there must be a "third" thing they both share (likeness), requiring a fourth thing, ad infinitum.
  *   **Difference:** The Third Man is about **universals** (resemblance between particulars and forms). Bradley's Regress is about **relations** (how constituents stick together). They share the same logical structure (the need for a "tie" generates a regress), but they target different metaphysical commitments.

  #### Bertrand Russell's Struggle
  Russell fought this problem for decades.
  *   **Early Russell:** Believed relations were real and external. He tried to argue that relations *just do* relate, stopping the regress by fiat. He admitted this was unsatisfactory.
  *   **Multiple Relation Theory:** To avoid the regress, Russell briefly argued that judgment isn't a relation between a mind and a proposition, but a multiple relation between a mind and the *constituents* of the fact. (He abandoned this later).
  *   **Late Russell:** Returned to realism about relations, accepting that the "relating relation" is unique.

  #### Wittgenstein: Dissolution?
  *   **Tractatus (5.47):** Wittgenstein suggests that the problem arises because we treat verbs like names. In a fully analyzed logical language, the configuration of objects *shows* the state of affairs. No "copula" is needed. The unity is internal to the configuration.
  *   **Later Wittgenstein:** The problem is a grammatical illusion. We don't need metaphysical glue; we just need to understand how language is used.

  #### Mid-Century Analytic Metaphysics (Bergmann & Armstrong)
  *   **Gustav Bergmann:** Distinguished between **relations** (which are constituents) and a **nexus of exemplification** (which is not a constituent). The nexus "ties" without needing tying. This is an attempt to stop the regress by categorizing instantiation as a unique ontological category.
  *   **David Armstrong:** Argued for **States of Affairs** as the primary existent. It's not that you have Socrates + Wisdom + Instantiation. You just have the state of affairs *[Socrates being wise]*. The unity is primitive.

  ### 4. Confusions and Distinctions

  It is regularly confused with two other things:

  1.  **The Homunculus Regress:** This is about the *mind*. (e.g., "How do I see an image?" "There's a little man in my head looking at it." "How does he see?"...)
      *   *Difference:* Homunculus is about interpretation/consciousness. Bradley's Regress is about ontology/truthmakers.
  2.  **Vicious vs. Benign Regress:**
      *   Some philosophers (like Lewis) argue that not all regresses are vicious. If the first step does the job, maybe the infinite tail doesn't matter.
      *   *Consensus:* Bradley's Regress is generally considered **vicious** because the first step *fails* to do the job (it fails to unite the terms), so the infinite chain never achieves unity.

  ### 5. Solutions: Taken Seriously vs. Dissolved

  Here is how the landscape is carved up today:

  #### Option A: The "Brute Fact" Approach (Realism)
  *   **View:** Relations are real. Instantiation is a fundamental relation.
  *   **Response to Regress:** The regress is stopped by asserting that instantiation is **internally related** to its terms. It doesn't need a further tie.
  *   **Critique:** As you noted, this invites the question: "Why couldn't Socrates and Wisdom be internally related without instantiation?"
  *   **Proponents:** Many contemporary realists about universals.

  #### Option B: The "Nexus" Approach (Non-Relational Tie)
  *   **View:** Instantiation is *not* a relation. It is a "nexus" or "tie."
  *   **Response to Regress:** Relations need tying; nexuses do not. By defining instantiation as a non-relational ontological category, the regress is blocked categorially.
  *   **Proponents:** Gustav Bergmann, some neo-Aristotelians.

  #### Option C: The "Priority of States of Affairs" (Atomism)
  *   **View:** The world is not made of objects and properties that get glued together. It is made of **facts** or **states of affairs**.
  *   **Response to Regress:** The unity is primitive. Socrates and Wisdom are abstractions *from* the fact, not ingredients that precede it. You can't have the ingredients without the cake.
  *   **Proponents:** David Armstrong, Early Wittgenstein, Situation Semantics.

  #### Option D: Deflationism / Nominalism
  *   **View:** There are no properties, only particulars. "Socrates is wise" just means "Socrates is a wise-thing."
  *   **Response to Regress:** Dissolves the problem by removing one of the relata (the universal/property). If there is no "Wisdom," there is no need to glue it to Socrates.
  *   **Proponents:** Quine, Trope Theorists.

  ### 6. Summary of the Phenomenon

  *   **Name:** Bradley's Regress (Ontological), Problem of the Unity of the Proposition (Logical).
  *   **Core Issue:** The impossibility of generating unity from a plurality of constituents using only further constituents.
  *   **Starts:** When you treat relations, properties, and copulas as *objects* or *entities* in their own right.
  *   **Stops:** When you posit a primitive unity (States of Affairs), a non-relational tie (Nexus), or deny the existence of one of the relata (Nominalism).
  *   **Current Status:** It is **taken seriously** in contemporary metaphysics, particularly in debates over **Truthmaker Theory** and **Grounding**. Philosophers like E.J. Lowe, Kathrin Koslicki, and Jonathan Schaffer engage with versions of this problem when discussing how parts compose wholes or how truthmakers make propositions true.

  You have identified the "hard problem" of metaphysical structure. The reason it feels unresolved is that every solution requires positing something "brute" (something that just *is* the case without further explanation). Bradley's point was that if you demand an explanation for everything, you get a regress; if you stop the explanation, you are being arbitrary. That tension remains live.
