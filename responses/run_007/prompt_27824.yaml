answer: |-
  This is a fantastic question. You have correctly identified that the "Spandrels" paper is one of the most cited, most misunderstood, and most rhetorically potent pieces in evolutionary biology. You are also right to suspect that the analogy is doing a lot of heavy lifting that it might not be able to support.

  I am going to take your invitation seriously: **Yes, the "audit the analogy" framing is partially the wrong approach, but auditing it reveals *why* it is the wrong approach.**

  The analogy was never intended as a logical proof; it was a *polemical device*. However, because it was so memorable, it became a proxy for the actual argument. When people online say "That's a spandrel," they are often using the analogy to bypass the evidentiary burden that Gould and Lewontin actually demanded.

  Here is the systematic audit you asked for, followed by the correction on how the argument actually works.

  ---

  ### Part 1: The Audit (Mapping the Analogy)

  To see where the logic holds and where it snaps, we need to map the architectural terms to evolutionary biology.

  | Architectural Element | Proposed Biological Equivalent | The Function in the Argument |
  | :--- | :--- | :--- |
  | **The Arches & Dome** | **Developmental/Physical Constraints** (e.g., body plans, physics of size, genetic linkage). | The primary structures necessitated by selection or physics. |
  | **The Spandrel** (the triangular gap) | **The Byproduct Trait** (e.g., male nipples, the color of blood, the human chin). | A trait that exists necessarily because of the constraints, not because it was selected for. |
  | **The Mosaic** (decoration) | **Current Utility / Exaptation** (e.g., using the chin for muscle attachment, blood color for camouflage). | A secondary use found for the space/trait *after* it exists. |
  | **The Architect** | **Natural Selection** (problematic) or **Phylogenetic History**. | The agent responsible for the design. |
  | **Inevitability** | **Structural Necessity** (Allometry, Correlation). | The claim that given the arches, the spandrel *must* exist. |

  ### Part 2: Where the Mapping Breaks (Disanalogies)

  When you press on this mapping, three critical fractures appear. These are the points where online debates usually stall.

  **1. The "Architect" Problem (Teleology)**
  *   **Architecture:** The architect has intent. The arches were chosen *to hold up the dome*. The design is top-down and teleological.
  *   **Biology:** There is no architect. Natural selection is a blind filter.
  *   **The Break:** In San Marco, you can distinguish the "intended structure" from the "unintended gap." In evolution, there is no "intended structure." Everything is the result of historical contingency. If a trait persists, it passed through the filter of selection, even if it originated as a byproduct. Distinguishing "selected for" vs. "came along for the ride" is empirically much harder than distinguishing an arch from a gap.

  **2. The "Inevitability" Problem**
  *   **Architecture:** Gould claimed the spandrels were "inevitable" byproducts of putting a dome on arches.
  *   **Biology:** Biological constraints are rarely absolute. You can have a dome without that specific triangular gap (using pendentives, squinches, or a different roof).
  *   **The Break:** In biology, "constraints" are often just "paths of least resistance." A trait might be a byproduct *now*, but a slightly different mutation could have eliminated it without breaking the organism. Calling something a "spandrel" implies a structural necessity that is often unproven.

  **3. The "Mosaic" Feedback Loop**
  *   **Architecture:** Painting a mosaic on the spandrel doesn't change the structural integrity of the arch.
  *   **Biology:** If a byproduct (spandrel) becomes useful (mosaic), selection *acts on it*. It becomes an **exaptation**.
  *   **The Break:** In biology, the "mosaic" can eventually reinforce the "spandrel." Male nipples are a classic spandrel (byproduct of female development). But if they acquired a function (e.g., sensory erogenous zones that increase mating success), selection might refine them. The line between "spandrel" and "adaptation" blurs over deep time.

  ### Part 3: The Architectural Controversy (Pedantic or Fatal?)

  You mentioned the controversy about whether San Marco's spandrels are "real" spandrels. Architectural historians (like Douglas Alexander) pointed out that the spaces at San Marco were not structurally inevitable. The architects could have used different joining methods. The spaces were actually *designed* to be filled with art.

  **Does this matter for biology?**
  *   **Rhetorically: Yes, it hurts.** Daniel Dennett seized on this in *Darwin's Dangerous Idea*. He argued that if Gould and Lewontin couldn't get the architecture right, why trust their biology? It gives adaptationists an easy *ad hominem* out: "They built their whole theory on a factual error about buildings."
  *   **Logically: No, it doesn't.** The existence of biological byproducts does not depend on the structural integrity of a Venetian basilica. Pleiotropy (one gene affecting multiple traits) is a genetic fact. If a gene for big jaws also causes a bump on the head, the bump is a byproduct. That remains true even if San Marco was designed by aliens.

  However, the architectural error reveals a deeper issue: **Gould and Lewontin assumed constraints were harder than they are.** They treated biological constraints like physical laws (gravity), when they are often just historical legacies that *could* have been otherwise.

  ### Part 4: The Meta-Correction (Analogy vs. Concept)

  Here is the correction you invited: **Asking for a mapping table misses what Gould and Lewontin were actually doing.**

  The "Spandrel" is not a technical term in biology in the same way "allele" or "phenotype" is. It is a **methodological warning label.**

  Gould and Lewontin were not primarily arguing that *specific traits* are spandrels. They were arguing against the **Panglossian Paradigm**: the default assumption that every trait is an optimal adaptation designed by selection.

  **The Analogy's Real Job:**
  The analogy wasn't meant to prove that trait X is a spandrel. It was meant to prove that **an alternative explanation is logically possible.**
  *   **Adaptationist view:** "Why is there a mosaic? It must be there to glorify God."
  *   **Spandrel view:** "Wait. Maybe the space existed first, and the mosaic was just put there because the space was available."

  **Where the Online Debate Goes Wrong:**
  In online debates, "That's a spandrel" is used as a **conversation stopper** (as you noted).
  *   **User A:** "Men have beards to protect against punches."
  *   **User B:** "No, that's a spandrel of testosterone."
  *   **Result:** Stalemate.

  This usage violates Gould and Lewontin's actual point. They argued that you cannot *assume* adaptation, **but you also cannot assume spandrel.** Both require positive evidence.
  *   To prove **Adaptation**: Show variation, heritability, and differential fitness linked to the trait.
  *   To prove **Spandrel**: Show the trait is a necessary structural byproduct of another selected trait (e.g., via genetic correlation or developmental constraint).

  The analogy quietly carries the argument by making the "Spandrel" option sound structural and inevitable, while making the "Adaptation" option sound like a just-so story. But in biology, the "Spandrel" hypothesis is often just as speculative as the "Adaptation" hypothesis.

  ### Part 5: The Bottom Line

  **Does the anti-adaptationist conclusion survive the disanalogies?**
  **Yes, but in a weaker form than the analogy suggests.**

  1.  **The Methodological Point Survives:** It is absolutely true that not every trait is an adaptation. Some are byproducts (noise), some are historical baggage (phylogenetic constraint), and some are random (drift). Ignoring these possibilities is bad science.
  2.  **The "Strong Version" Fails:** You cannot point to a trait, invoke the San Marco analogy, and declare it a non-adaptation. The architectural analogy implies a clean distinction between "structure" and "byproduct" that evolution rarely provides.
  3.  **The Burden of Proof:** The analogy tricks people into thinking the "Null Hypothesis" is *Structural Byproduct*. It isn't. The null hypothesis is usually *No Effect* or *Drift*. "Spandrel" is a specific positive claim (that the trait is causally linked to a different selected trait).

  **Summary:**
  The San Marco analogy was a brilliant piece of rhetoric that successfully broke the stranglehold of naive adaptationism in the 1980s. However, it has since calcified into a dogma of its own.
  *   **The Architecture:** Factually shaky, rhetorically powerful.
  *   **The Biology:** Sound (byproducts exist), but hard to prove.
  *   **The Debate:** When someone says "That's a spandrel," they are often using the architectural metaphor to smuggle in a conclusion they haven't earned.

  **The Correction:** Don't ask "Is this trait a spandrel?" Ask "What is the evidence that this trait is a byproduct of selection on *other* traits?" If they can't answer that, they aren't doing evolutionary biology; they're just decorating the triangles.
