answer: |-
  Your diagnosis is sharp, and your frustration with the static nature of the debate is shared by many observers of contemporary metaethics. The Frege–Geach problem has indeed become a "philosophical zombie"—it refuses to die, yet it seems incapable of generating new life.

  To answer your specific questions: The disagreement is **hybrid**. It is partly verbal (due to contested definitions of "belief" and "truth"), partly substantive (about the structure of rationality), and partly methodological (about explanatory priority). However, your hypothesis that the two sides are answering different questions is partially correct but requires refinement. They are answering the *same* question ("How do moral sentences work in logic?"), but they are operating under **mutually exclusive constraints** that they refuse to relax.

  Here is an assessment of the state of the debate, the nature of the disagreement, and what genuine progress might look like.

  ### 1. Is the Disagreement Substantive, Verbal, or Incommensurable?

  It is all three, layered on top of one another.

  **The Verbal Layer (Deflationism vs. Robustness)**
  Much of the "talking past each other" stems from the Expressivist's reliance on deflationism. To solve Frege–Geach, Blackburn (Quasi-Realism) and Gibbard (Norm-Expressivism) argue that we can talk of moral "truth," "facts," and "beliefs" provided we understand these terms deflationarily.
  *   **Expressivist:** "I can say 'It is true that stealing is wrong' without positing a moral fact."
  *   **Critic (e.g., Boghossian, Rosen):** "If you grant the truth-apt syntax and the logical validity, you have granted the *substance* of cognitivism. Calling it 'deflated' is a verbal trick."
  *   **Verdict:** This is a verbal dispute about the *label* "cognitivism," but it masks a substantive dispute about whether deflationary truth is sufficient to ground normative authority.

  **The Substantive Layer (The Structure of Mind)**
  Beneath the semantics lies a philosophy of mind. The Frege–Geach problem forces expressivists to model the mental state expressed by "Stealing is wrong" (in an assertion) and "If stealing is wrong..." (in a conditional).
  *   **The Constraint:** To validate *modus ponens*, the state in the antecedent must be the same type as the state in the assertion.
  *   **The Conflict:** If the state is a "belief" (to match logic), expressivism collapses into cognitivism. If the state is a "non-cognitive attitude" (to preserve expressivism), critics argue it cannot play the logical role (the "Inconsistency Problem," famously pressed by Schroeder and earlier by Hale).
  *   **Verdict:** This is substantive. It is a disagreement about whether practical rationality (governing desires/plans) is structurally isomorphic to theoretical rationality (governing beliefs).

  **The Methodological Layer (Explanatory Priority)**
  This is where your hypothesis hits the mark.
  *   **Critics** treat logic as a **constraint on semantics**. If the semantics doesn't validate the inferences, the theory fails.
  *   **Expressivists** treat psychology as the **foundation of semantics**. The logic must be explained in terms of the psychology, not the other way around.
  When an expressivist like Schroeder proposes "Being For" to solve the logical problem, critics argue he has simply renamed a belief. When an expressivist like Blackburn says we "earn the right" to truth-talk, critics say he has changed the subject. They are prioritizing different explanatory bases.

  ### 2. Assessment of Your Hypothesis

  You suggest the problem is ill-posed because one side sees it as a formal constraint and the other as a psychological story. I would refine this: **The problem is over-constrained.**

  The Frege–Geach problem asks expressivists to do two things that appear mutually exclusive:
  1.  **Preserve the Psychological Distinction:** Maintain that moral judgments are fundamentally different in kind from ordinary descriptive beliefs (conative vs. cognitive).
  2.  **Preserve the Logical Isomorphism:** Maintain that moral sentences behave in logic *exactly* like descriptive sentences (embedding, validity, negation).

  The debate is static because **every solution requires sacrificing one constraint to satisfy the other**, yet neither side admits the sacrifice.
  *   **Schroeder's "Being For"** is the most sophisticated formal attempt. It validates the logic beautifully. But critics (like Chrisman or Ridge) argue that "being for" is functionally indistinguishable from belief, violating constraint #1.
  *   **Blackburn's Quasi-Realism** preserves constraint #1 but relies on a pragmatic explanation of logic that critics find insufficiently rigorous regarding constraint #2.

  So, the question isn't ill-posed; it is a **trilemma**. You can have:
  1.  Distinct Psychology.
  2.  Standard Logic.
  3.  Compositional Semantics.
  Expressivists want all three. The last 60 years suggest you can only pick two.

  ### 3. What Would Count as Progress?

  If the impasse is due to over-constraint, progress cannot come from a new formal trick that claims to satisfy all constraints. That ship has sailed. Progress would look like one of the following four shifts:

  **A. Explicit Trade-Offs (The "Cost" Accounting)**
  Progress would occur if expressivists stopped claiming to "solve" Frege–Geach and started admitting what they are giving up.
  *   *Example:* "Yes, my semantics posits proposition-like entities, but they are grounded in plans, not facts."
  *   *Why this helps:* It moves the debate from "Did you fail?" to "Is the cost worth the metaphysical savings?" This turns the debate into a comparative cost-benefit analysis between expressivism and cognitivism, rather than a pass/fail test on logic.

  **B. The Pragmatic Turn (Abandoning Semantics)**
  Some recent work (e.g., by Michael Ridge or certain inferentialists) suggests we should stop trying to build a compositional *semantics* for moral terms and instead focus on *pragmatics* or *speech acts*.
  *   *The Shift:* Instead of asking "What is the semantic value of 'wrong' in a conditional?", ask "What is the speaker doing when they utter a conditional with a moral antecedent?"
  *   *Progress:* This dissolves the formal problem by denying that moral sentences need semantic values to function in logic. It treats logic as a feature of discourse practices, not sentence meanings. If this can be made rigorous, it bypasses the Frege–Geach trap entirely.

  **C. Hybridization (Accepting the Collapse)**
  The most "progressive" outcome might be the admission that pure expressivism is untenable. Hybrid Expressivism (e.g., Copp, Schroeder later work) admits moral states contain *both* belief and desire.
  *   *Progress:* This solves the embedding problem (the belief component handles the logic) while retaining an expressivist flavor (the desire component handles motivation).
  *   *The Cost:* It surrenders the pure metaethical claim that moral judgments are *non-cognitive*. It turns expressivism into a psychological claim about the *mixture* of states, rather than a semantic claim about the *nature* of meaning.

  **D. A New Distinction in "Belief"**
  The most philosophically fruitful path would be a robust account of **Cognitive States** that does not rely on the "Mind-to-World" direction of fit.
  *   If expressivists can articulate a notion of "Normative Belief" that is genuinely distinct from "Descriptive Belief" yet logically robust, the debate dissolves.
  *   *Current Status:* Gibbard tries this with "norm-acceptance." Critics say it's just belief.
  *   *Progress:* A clear phenomenological or functional distinction between "believing p" and "accepting norm n" that survives logical embedding.

  ### Conclusion

  Your diagnosis is correct that the debate is static because the participants are measuring success by different yardsticks. However, it is not merely that they are asking different questions; it is that they are demanding **incompatible virtues** from the same theory.

  The Frege–Geach debate is a **methodological stalemate**.
  *   **For the Critic:** Success = Showing Expressivism is secretly Cognitivism.
  *   **For the Expressivist:** Success = Showing Cognitivism is unnecessarily metaphysically robust.

  **Real progress** will not come from a new formalism. It will come from **dissolution**. Either:
  1.  Expressivists admit that "logic" is a pragmatic feature of discourse, not a semantic constraint (abandoning the formal game).
  2.  Expressivists admit that moral "beliefs" are a distinct species of belief, effectively merging with a sophisticated Cognitivism (abandoning the psychological distinction).
  3.  Cognitivists admit that the metaphysical cost of "moral facts" is lower than assumed (reducing the motivation for Expressivism).

  Until one side blinks on their core constraint, the machinery will keep getting more complex, and the consensus will remain out of reach. The "problem" is no longer a puzzle to be solved; it is a boundary marker showing the limits of the current metaethical taxonomy.
