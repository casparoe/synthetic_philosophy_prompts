  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the debate static?* Yes, largely. Since Geach (1960, 1965) and Searle (1962), through Blackburn (1984), Gibbard (1990, 2003), Schroeder (2008), to recent hybrid expressivists and quasi-realists.
