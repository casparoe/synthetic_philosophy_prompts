      *   **The "Incommensurability" Aspect:** Expressivists often shift the goalposts. When pressed on logic, they talk about practical reasoning. When pressed on psychology, they talk about semantic function. This is the "Quasi-Realist" strategy: earn the right to talk *as if* there are moral truths. Critics argue this is just changing the subject.

