answer: |-
  This is the single most persistent and technically demanding objection to deflationism, often called the **Generalization Objection** (or sometimes the "Quantifying-In" problem). You have identified the exact pressure point: deflationism wants to treat truth as a logical device, but logical devices that generalize usually require ontological commitments (domains of quantification) that look suspiciously like the substantive metaphysics deflationism seeks to avoid.

  Here is a walkthrough of the dialectic, the three main deflationist strategies for handling it, and an evaluation of which approach is the "least philosophically-loaded."

  ---

  ### 1. The Problem Formulated Precisely

  The deflationist claims the function of the truth predicate is to enable **semantic ascent** and **generalization**.
  *   **Specific claim:** "Snow is white" is true.
  *   **General claim:** "Everything the Pope says is true."

  To analyze the general claim, we need to formalize it. There are three apparent options, each with a cost for the deflationist:

  1.  **Objectual Quantification over Propositions:**
      $$ \forall x (\text{Proposition}(x) \land \text{Says}(\text{Pope}, x) \to \text{True}(x)) $$
      *   **The Cost:** This commits you to an ontology of **propositions** as abstract objects. If propositions are objects, then `True` is a predicate ranging over them. Critics argue that if truth is a property of these objects, we are entitled to ask *what property it is*. If the answer is "the property that allows disquotation," the critic asks: "In virtue of what do these objects have that property?" This threatens to reintroduce a substantive nature (e.g., correspondence, coherence) to explain the link between the proposition-object and the world.

  2.  **Substitutional Quantification over Sentences:**
      $$ \forall p (\text{Says}(\text{Pope}, \ulcorner p \urcorner) \to p) $$
      *   **The Cost:** This treats the quantifier $\forall p$ substitutionally (true if all substitution instances are true) rather than objectually (true if all objects in the domain satisfy the condition).
      *   **The Problem:** Substitutional quantification is notoriously difficult to make sense of without collapsing into objectual quantification. To define substitutional truth, you usually need to say "there is a true substitution instance." But if you use "true" to define the quantifier, and the quantifier to define "true," you risk circularity. Furthermore, it restricts generalization to things we can name/sentence, which seems too weak for claims about infinite domains or unnamed possibilities.

  3.  **Schematic Generalization (Meta-linguistic):**
      *   Treat "Everything the Pope says is true" not as a single sentence in the object language, but as a schema in the meta-language that licenses the inference from "Pope says $S$" to "$S$".
      *   **The Cost:** This **gives up on genuine generalization**. The statement "Everything the Pope says is true" cannot be asserted *within* the language; it can only be displayed as a rule. This violates the intuition that we can believe, assert, and embed general truth claims (e.g., "If everything the Pope says is true, then...") in complex logical contexts.

  The dilemma you posed is: *Must the deflationist choose between (3) giving up generalization or (1) admitting truth is a substantive property of propositions?*

  The answer is **no**, but navigating the middle path requires sophisticated logical machinery.

  ---

  ### 2. The Three Deflationist Responses

  #### A. Propositional Minimalism (Paul Horwich)
  **Strategy:** Accept Option 1 (Objectual Quantification) but deny the inference to "Substantive Property."

  Horwich argues that deflationism is compatible with truth being a property, provided we distinguish between **having a property** and **that property having a nature**.
  *   **The Move:** We quantify over propositions. `True` is a predicate of propositions.
  *   **The Defense:** The *entire nature* of the property is exhausted by the T-schema instances ($\langle p \rangle$ is true iff $p$). There is no further "constitutive essence" to explain. Just as the property of being a "unit set" is exhausted by the axiom of pairing, the property of truth is exhausted by the equivalence schema.
  *   **Handling the Objection:** Horwich admits we need an ontology of propositions. However, he argues this ontology is required for *psychology and semantics* independently of truth (we need propositions to explain belief contents). Therefore, deflationism doesn't *add* ontological baggage; it just refuses to add *metaphysical* baggage regarding the link between those propositions and the world.
  *   **Verdict:** This saves generalization but concedes that truth is a property. It relies on the controversial claim that a property can exist without having an underlying explanation (no "truth-makers").

  #### B. Disquotationalism (Hartry Field / W.V.O. Quine)
  **Strategy:** Stick to Option 2 (Substitutional Quantification) or a variant thereof.

  Field is more nominalistic than Horwich. He worries that propositions are too "Platonic." He prefers to treat truth as a predicate of sentences (or sentence-types).
  *   **The Move:** Use substitutional quantification. To say $\forall p A(p)$ is true is just to say that for any sentence $S$, $A(S)$ is true.
  *   **The Defense:** Field acknowledges the circularity worry but argues it is benign. We understand substitutional quantification primitive, or we ground it in physicalistic facts about inscription tokens.
  *   **Refinement (Quantifying In):** Quine argued that we can quantify into sentence position without reifying sentences as objects. For Quine, "For all $p$, $p$" is a logical form that does not commit us to a domain of "sentence-objects" any more than "For all $x$, $x=x$" commits us to a domain if we are nominalists (though Quine famously said "to be is to be the value of a bound variable," he made exceptions for substitutional contexts).
  *   **Verdict:** This keeps ontology leaner than Horwich but faces the technical charge that substitutional quantification is unintelligible without an objectual backing.

  #### C. Pro-Sententialism / Anaphoric Deflationism (Dorothy Grover, Robert Brandom)
  **Strategy:** A modified Option 2 that avoids quantification over sentences entirely. This is the **"Least Philosophically-Loaded"** candidate.

  This view treats "is true" not as a predicate at all, but as part of a **pro-sentence**.
  *   **The Move:** Just as "he" is a pronoun that stands in for a noun phrase, "that is true" is a pro-sentence that stands in for a declarative sentence.
  *   **The Mechanism:** When we say "Everything the Pope says is true," we are not quantifying over objects (propositions) or substituting sentences. We are using a **quantified pro-sentence**.
      *   Formalization: $\forall p (\text{Pope says } p \to p)$.
      *   Here, $p$ is not a variable ranging over objects. It is a **sentential variable**. The quantifier binds sentence positions, not object positions.
  *   **The Defense:** Brandom argues this is anaphoric. "That is true" inherits its content from an antecedent claim. Generalization is handled by quantifying into these anaphoric chains.
  *   **Why it avoids the trap:** Because $p$ is not an object variable, we do not commit to an ontology of propositions. Because it is not merely schematic, we can express the generalization within the language. We avoid calling truth a "property" in the standard sense; it is a grammatical device for anaphoric reference.
  *   **Verdict:** This navigates the horn of the dilemma most skillfully. It allows genuine generalization without reifying truth-bearers.

  ---

  ### 3. The "Least Philosophically-Loaded" Option: Pro-Sententialism

  If your goal is to minimize ontological and metaphysical commitment, **Pro-Sententialism (or Anaphoric Deflationism)** is the strongest candidate.

  **How it works:**
  It treats the truth predicate as syncategorematic (having no meaning in isolation) and functioning anaphorically.
  *   **Example:** "John claims that snow is white, and Bill claims that too."
      *   "That too" functions like "is true." It points back to the content of John's claim without naming a proposition.
  *   **Generalization:** "Everything John claims is so."
      *   Here, "is so" is a quantified pro-sentence. It binds the sentence position.

  **Why it avoids the Property/Proposition trap:**
  1.  **No Propositions:** It does not require propositions as abstract objects. It only requires the linguistic ability to form anaphoric links.
  2.  **No Property:** It denies that `True` is a predicate that ascribes a property. It is a sentence-forming operator. Asking "What property does 'is so' ascribe?" is a category mistake, like asking "What object does 'he' refer to?" (It refers to an object, but 'he' isn't a name).

  ---

  ### 4. Evaluation: What is Bought vs. What is Costed

  If the deflationist adopts the Pro-Sentential/Anaphoric strategy to navigate your dilemma, here is the balance sheet:

  #### What It Buys (The Gains)
  1.  **Ontological Parsimony:** You avoid committing to a realm of abstract propositions. You only need sentences (or utterances) and speakers.
  2.  **No "Nature of Truth":** You successfully block the question "In virtue of what is this proposition true?" There is no relation to investigate, only a grammatical rule of anaphora.
  3.  **Genuine Generalization:** Unlike the Schematic view, you can embed truth claims in conditionals, negations, and belief contexts ("I believe that everything he says is true").
  4.  **Dissolution of Paradox:** Many semantic paradoxes (like the Liar) arise from treating truth as a property that sentences can possess. If truth is a pro-sentential device, the self-reference required for the Liar is harder to generate (though not impossible).

  #### What It Costs (The Losses)
  1.  **Logical Complexity:** You need a logic that allows **quantification into sentence position** (sentential quantification). Standard first-order logic does not permit this. You are moving to a higher-order logic or a non-standard system. Critics argue this is *more* technically loaded than standard objectual quantification.
  2.  **The "Mixed" Context Problem:** It is difficult to handle cases where truth interacts with non-declaratives or nominalizations.
      *   *Example:* "The proposition that snow is white is true."
      *   The pro-sententialist must treat "The proposition that..." as a cumbersome way of setting up an anaphoric antecedent. This feels like a forced reconstruction of natural language.
  3.  **Explanation of Success:** If truth isn't a property, why is aiming for truth a successful norm of assertion? Substantive theories explain this (truth = matching reality). Deflationists must explain the normativity of assertion without a substantive goal. (Horwich says the norm is primitive; Brandom says it's about commitment/entitlement).
  4.  **Intelligibility of Sentential Quantification:** While Quine and others argue sentential quantification is intelligible, many philosophers find it obscure. If you quantify over sentence positions, aren't you implicitly treating those positions as values? If so, haven't you just reintroduced propositions under a different name?

  ### 5. Conclusion: Do they have to choose?

  To answer your specific question: **No, the deflationist does not have to choose between schematic generalization and substantive properties.**

  The **Pro-Sentential/Anaphoric** view offers a third path. It allows for genuine generalization via sentential quantification without reifying propositions as objects that bear a property.

  **However,** there is a residual cost. Even if you avoid *ontological* commitment to propositions, you incur a *logical* commitment to sentential quantification.
  *   **The Critic's Retort:** "If you quantify over sentence positions, you are treating those positions as a domain. Quine's criterion ('to be is to be the value of a bound variable') suggests you are committed to sentence-types or something similar. And if sentences are the truth-bearers, isn't truth a property of sentences?"
  *   **The Deflationist's Reply:** "Truth is a property of sentences only in the lightweight sense that 'is valid' is a property of arguments. It is a logical status, not a natural kind. The quantification is logical, not ontological."

  **Summary Recommendation:**
  If you want the version of deflationism that best navigates your worry, look at **Robert Brandom's anaphoric deflationism** or **Grover's pro-sententialism**. They take the generalization function seriously without positing a "nature" of truth or a robust ontology of propositions.

  **The Price:** You must accept that standard first-order logic is insufficient for natural language semantics, and you must accept that "quantifying into sentence position" is a coherent logical operation that does not carry ontological weight. If you find sentential quantification suspicious, you will be pushed back toward Horwich's Minimalism (accept propositions, deny nature) or toward Inflationism (accept truth is a substantive property).

  The dialectic ultimately rests on whether one believes **sentential quantification** is ontologically innocent. If it is, deflationism survives your objection. If it isn't, the Generalization Objection succeeds in forcing deflationism to become a substantive theory of propositions.
