      *Self-Correction on "Prisoner's Dilemma":* Many critics call it PD. But strictly, PD requires that mutual cooperation is better than mutual defection. In Dark Forest, mutual silence (hiding) is stable, but mutual contact leads to defection. If both attack, one wins (usually the first). If one attacks and one doesn't, attacker wins. If neither attacks, both survive (for now). The instability comes from the *potential* for the other to attack later due to technological explosion. So it's a dynamic game where the shadow of the future is negative rather than positive. I should clarify this distinction. It's not a standard PD because the "Cooperate" option is unstable over time.

      *Self-Correction on "Common Knowledge":* The chain of suspicion is explicitly about the lack of common knowledge. I need to use the terminology $E^k$ (everyone knows everyone knows... k times). The novel argues $k$ never reaches infinity, so common knowledge is never established.

