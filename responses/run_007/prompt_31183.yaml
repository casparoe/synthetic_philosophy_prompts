      *   **Task:** Read Liu Cixin's *The Dark Forest* argument through the lens of epistemic game theory (common knowledge, rationality, equilibrium, type spaces, signaling, etc.).
      *   **Goal:** Determine if it's a genuine insight about rationality under radical uncertainty or a conceptual mistake, to inform the user's own novel writing.
