answer: |-
  Here is a 50-minute section plan designed for students who have skimmed the text. It prioritizes active engagement over lecture to ensure they grasp the *structure* of the argument rather than just the sci-fi details.

  ### 1. The Sequence (50 Minutes)

  **0:00–0:05: The Intuition Pump (No Jargon Yet)**
  *   **Activity:** Write a simple scenario on the board: *A student cheats on an exam because they want to. No one forced them. No one threatened them.*
  *   **Ask:** "Is the student responsible?" (Yes). "Why?"
  *   **Goal:** Elicit the intuition that actual causation matters more than hypothetical alternatives.
  *   **Transition:** "Most philosophers codify that 'Why' into a principle. Let's write it down."

  **0:05–0:10: Formalize PAP**
  *   **Board Work:** Write the **Principle of Alternative Possibilities (PAP)**: *An agent is morally responsible for an action only if they could have done otherwise.*
  *   **Check:** Ask a student to explain "could have done otherwise" in plain English. (Look for "had a real choice").
  *   **Setup:** "If PAP is true, no alternative possibilities = no responsibility. Frankfurt says this is false."

  **0:10–0:25: The Frankfurt Case (Streamlined)**
  *   **Presentation:** Do not read the neuroscientist details verbatim. Use the **Counterfactual Intervener** structure on the board:
      1.  Jones decides to $\Phi$ on his own.
      2.  Black (Intervener) wants Jones to $\Phi$.
      3.  Black monitors Jones. If Jones shows signs of *not* $\Phi$-ing, Black forces Jones to $\Phi$.
      4.  Jones $\Phi$s on his own. Black does nothing.
  *   **Discussion:** "In this scenario, could Jones have done otherwise?" (No, because of Black's presence). "Is Jones responsible?" (Most will say Yes).
  *   **The Hammer:** "If Jones is responsible *and* Jones could not have done otherwise, what happens to PAP?" (It's false).

  **0:25–0:35: Intercepting Misconception #1 (The 'Flicker')**
  *   **Anticipate:** Students will say, "But he could have *tried* to do otherwise," or "He could have hesitated."
  *   **Intervention:** This is the "Flicker of Freedom" objection. Address it **here**, before moving to determinism.
  *   **Response:** "Frankfurt stipulates the intervention triggers on the *sign* of hesitation. If the device is perfect, the alternative possibility (hesitating) is not a robust alternative action. Ask them: 'Does the ability to twitch before being forced count as the moral freedom PAP requires?'"
  *   **Goal:** Get them to see that PAP requires a *relevant* alternative, not just a physical glitch.

  **0:35–0:45: Intercepting Misconception #2 (The Determinism Dilemma)**
  *   **Anticipate:** "This case assumes determinism, so it begs the question against Libertarians."
  *   **Intervention:** Acknowledge this is a sophisticated objection (the Kane/Widerker objection), but bracket it for the sake of the argument.
  *   **Response:** "Frankfurt cases are designed to work *whether* the world is deterministic or not. The point isn't to prove determinism is true; it's to show that *even if* you think determinism is false, APs aren't what grounds responsibility. Don't let this objection derail the main point: The intuition that Jones is responsible persists even without APs."

  **0:45–0:50: Comprehension Check & Wrap**
  *   **Activity:** The "New Case" Question (see below).
  *   **Close:** Summarize that Frankfurt attacks the *necessity* of APs, not the existence of free will itself.

  ---

  ### 2. The Example: Stick to Jones/Black, But Simplify
  Do not switch to a "cleaner" example like a voting machine or God's foreknowledge. Since they read Frankfurt, switching examples will confuse them when they try to map your section back to the text.

  **However, strip the sci-fi:**
  *   **Don't** spend time explaining how the neuro-implant reads brainwaves.
  *   **Do** treat Black as a logical guarantee. Use the phrase **"Counterfactual Intervener."**
  *   **Emphasize:** The causal history of the *actual* sequence is untouched. Black is part of the *counterfactual* sequence. This distinction is the key to the whole case.

  ---

  ### 3. Handling the Misconceptions (Timing is Key)

  **Misconception A: "He could have tried."**
  *   **When:** Immediately after presenting the case (Minute 25).
  *   **Why:** If you let this sit, they will leave thinking Frankfurt failed.
  *   **How:** Concede the point technically, but challenge its moral weight. "Okay, he could have twitched. But if the outcome is guaranteed regardless of the twitch, does that twitch save his freedom? Frankfurt says no."

  **Misconception B: "This assumes determinism."**
  *   **When:** Minute 35.
  *   **Why:** This is the "Dilemma Defense." It's valid, but if you dwell on it, you turn a section on PAP into a section on Compatibilism vs. Incompatibilism.
  *   **How:** Frame it as a *refinement* of Frankfurt, not a refutation. "Later philosophers refined the cases to avoid this, but for today, accept Frankfurt's claim: The *source* of the action (Jones's own reasons) matters more than the *alternatives*."

  ---

  ### 4. The Comprehension Check Question
  Do not ask "What is PAP?" or "Did Frankfurt refute PAP?" They can memorize those answers without understanding.

  **Ask this instead:**

  > "Imagine a variation: Black *does* intervene and forces Jones to $\Phi$. Jones is clearly not responsible there. In the original Frankfurt case, Black *doesn't* intervene. If the physical outcome is identical, **what is the specific feature of the original case that makes Jones responsible, given that he couldn't have done otherwise in either scenario?**"

  **What to look for in their answer:**
  *   **Bad Answer:** "Because Black didn't touch him." (Too superficial).
  *   **Good Answer:** "Because the action issued from Jones's own reasons/volition in the actual sequence, not from Black's coercion." (Shows they understand the *Actual Sequence* vs. *Alternative Sequence* distinction).
  *   **Great Answer:** "It shows responsibility depends on the *source* of the action, not the availability of alternatives." (Shows they grasp the philosophical implication).
