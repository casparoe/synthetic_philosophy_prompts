prompt: |-
  I'm TAing a third-year undergrad course on free will and next week I'm doing Frankfurt cases against the principle of alternative possibilities. I've got fifty minutes. The students have read the Frankfurt paper but most of them will have skimmed it. Don't explain the material to me—I know it. I need a plan for how I should teach it in section. What's the right order to introduce the pieces? I'm torn between starting with PAP and the intuition behind it ('you're only responsible if you could have done otherwise'), or starting with a concrete Frankfurt-style case and then pulling PAP out of it. Which example should carry the whole thing—the standard Jones/Black neuroscientist case, or is there a cleaner one that doesnt get bogged down in sci-fi objections? What misconceptions should I expect? I'm guessing students will think the intervener means Jones still has an alternative (he could 'try' to do otherwise even if he'd be stopped), or that the whole thing assumes determinism and begs the question against the libertarian. Where in the sequence should I head each of those off? And what's one question I can ask at the end to check whether they've actually understood the challenge to PAP rather than just memorised the case?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

