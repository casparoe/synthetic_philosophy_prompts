      *   **Constraints:** Don't explain the material to the TA. Focus on pedagogy and flow.

  2.  **Determine the Pedagogical Strategy (The "Order" Question):**
      *   *Option A: PAP first, then Counterexample.* (Deductive) Good for logic, but can feel abstract.
      *   *Option B: Case first, then PAP.* (Inductive) Good for engagement, lets students feel the intuition before naming it.
      *   *Decision:* For 3rd-years who skimmed, Option B is usually stronger. It grounds the discussion. If you start with "PAP states X," they zone out. If you start with "Is this guy responsible?", they engage.
      *   *Refinement:* Start with a *modified* intuitive case, extract PAP, then hit them with the Frankfurt case to break PAP.

  3.  **Select the Example:**
      *   *Standard Jones/Black:* Classic, but the "neuroscientist/screen/trigger" mechanics often distract students (flickers of freedom, physical impossibility vs. logical impossibility).
      *   *Cleaner Alternative:* The "Vote Counter" or "God's Foreknowledge" style, but those bring in theology or complex counting.
      *   *Best Bet:* Stick with Jones/Black but *simplify the mechanism*. Don't get bogged down in the screen monitoring. Use a "counterfactual intervener" setup that is conceptually clear. Actually, the "Shoemaker" or "Sloth" cases are good, but for a general intro, a streamlined Jones/Black is best.
      *   *Recommendation:* Use a simplified Jones/Black. Avoid the "screen" detail unless necessary. Focus on the *counterfactual* nature of the intervention.
      *   *Wait, better idea:* Use the "Professor and the Student" analogy or a "Remote Control" analogy to make it less sci-fi. But Frankfurt's own example is the standard for a reason. Let's stick to Jones/Black but instruct the TA to strip away the "neuroscience" jargon and focus on the *structure*: (1) Agent decides on own, (2) Intervener *would have* forced it if Agent hesitated, (3) Intervener did nothing.

  4.  **Drafting the Sequence (50 Minutes):**
      *   *0-5 min:* Hook/Intuition Pump (No PAP yet).
      *   *5-15 min:* Elicit PAP from students (Make them state the rule).
      *   *15-30 min:* The Frankfurt Case (The Wrecking Ball).
      *   *30-40 min:* Objections/Misconceptions (Flickers, Determinism).
      *   *40-50 min:* Wrap up & Comprehension Check.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "He could have tried."* (The Flicker of Freedom). This is the big one. Need to address it *immediately* after presenting the case, before moving on.
      *   *Misconception 2: "This assumes determinism."* (The Dilemma Objection). This is more advanced (Kane/etc.), but 3rd-years might raise it. Address this after the first objection is settled.
      *   *Timing:* Don't let these derail the main point. Acknowledge, bracket, move on.

  6.  **Developing the Comprehension Check:**
      *   Need a question that isn't "What is PAP?"
      *   Need a question that tests if they see *why* PAP is threatened.
      *   *Idea:* Present a variation where the intervener *does* act. Ask if responsibility changes.
      *   *Better Idea:* Ask them to construct a defense of PAP *given* the case.
      *   *Best Idea:* A "New Case" test. Give them a scenario where PAP is satisfied but intuition says no responsibility, or PAP is violated but intuition says responsibility. Actually, the prompt asks for *one question* to check understanding of the challenge.
      *   *Selection:* "If Frankfurt is right, what replaces PAP as the necessary condition for responsibility?" (Too hard).
      *   *Selection:* "Why doesn't the fact that Black *didn't* act save PAP?"
      *   *Refined:* "In the Frankfurt case, Jones lacks alternative possibilities. According to the intuition Frankfurt wants us to accept, why is Jones *still* responsible?" (Tests the core claim).

  7.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Critique:* 50 mins goes fast. Don't spend 15 mins eliciting PAP. Do it in 5.
      *   *Critique:* The "Determinism" objection is tricky. If students think Frankfurt cases *prove* compatibilism, they are wrong. Frankfurt cases attack PAP, which is used by *Incompatibilists* (Libertarians) and some Compatibilists. Need to be clear: Frankfurt cases target the *link* between AP and Resp, not necessarily determinism directly (though they help compatibilists).
      *   *Example:* Let's suggest the "Vote" example. It's less sci-fi than neuroscientists. Jones wants to vote for Candidate A. Black wants Jones to vote for A. Black has a device... etc. It's the same structure but less "brain surgery."
      *   *Actually:* Stick to the text they read (Jones/Black) to avoid confusion, but simplify the description.
      *   *Sequence:*
          1.  Warm-up: Intuition about responsibility (5m).
          2.  Formalize PAP (5m).
          3.  The Frankfurt Case (10m).
          4.  Discussion: Why is he responsible? (10m).
