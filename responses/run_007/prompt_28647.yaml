answer: |-
  **Setting:** *A quiet corner of the hotel bar at an evolutionary biology conference. It's late. Two theorists, Alex and Sam, are nursing whiskies. They've just come from a contentious panel on hierarchical selection.*

  **Alex:** You know, when you were up there talking about "group fitness," I felt like I was watching someone draw a map of London and then claim the lines on the paper are causing the traffic.

  **Sam:** And I felt like I was watching someone insist that because traffic is just individual cars moving, "congestion" isn't a real thing. Look, Alex, nobody is claiming the group is a magical homunculus. But when you have a subdivided population where Group A exports ten propagules and Group B exports zero, and that difference tracks a trait like *collective defense*, something is happening at the group level.

  **Alex:** But "something happening" isn't the same as "selection acting." Let's go to the math. The Price equation. It partitions the change in gene frequency into two terms: the covariance between group fitness and group gene frequency, and the expected covariance between individual fitness and individual gene frequency within groups. It's an accounting identity. It *has* to sum to total change. Just because you can write a "between-group" term doesn't mean there's a causal force called "group selection." It's just a statistical remainder.

  **Sam:** That's the bookkeeping objection. I hear it every time. But algebra isn't ontology. If I partition the variance in a car's speed into "engine power" and "wind resistance," the equation is still just math. But if I remove the wind, the car goes faster. The term tracks a causal structure. In my model, if I hold individual traits constant but vary the group structure—say, by changing migration rates—the "between-group" term changes. That implies the group structure is doing causal work.

  **Alex:** It implies the *correlation structure* is doing work. Which is exactly what kin selection says. If I'm in a group with my clones, helping the group helps my genes. That's individual-level selection mediated by relatedness. You're taking the coefficient of relatedness, $r$, hiding it inside a "group fitness" term, and pretending it's a new level of agency. It's the same physics, just described in a clumsier language.

  **Sam:** Clumsier? Or more transparent? You're reducing everything to the gene's-eye view. But let's distinguish MLS1 from MLS2, because I think you're conflating them. In MLS1, individuals reproduce, and groups are just temporary buckets. I agree, that often reduces to kin selection. But MLS2? That's where groups themselves reproduce. They bud, they fission, they go extinct.

  **Alex:** MLS2 is the unicorn. How often does a group actually reproduce as a unit compared to an individual? In humans? Maybe. In bacteria? Maybe. But for the vast majority of macroscopic life, groups don't have propagules. They just dissolve. Treating the average fitness of a collection of individuals as "group fitness" smuggles in agency that isn't there. The genes in the successful groups spread because the *individuals* carrying them survived better, not because the "group" replicated.

  **Sam:** Okay, I'll grant you this: if we are talking strictly about the *final tally* of gene frequencies, we agree. The Price equation guarantees it. We aren't disagreeing about the arithmetic of evolution.

  **Alex:** Finally. So the gene is the replicator. The rest is vehicle.

  **Sam:** *But*—and here is where you lose me—that grant doesn't matter for the main disagreement. You think that because the gene is the ultimate replicator, the gene is the only useful *explanatory* unit. I'm saying that in MLS2 scenarios, describing the process solely in terms of gene frequency changes loses the mechanism. If I want to know *why* the genes spread, saying "because they increased in frequency" is tautological. Saying "because groups with low internal competition exported more propagules" tells me how to manipulate the system.

  **Alex:** But that "why" is still cashed out in individuals. "Low internal competition" means Individual X didn't kill Individual Y. If you say the "group trait" is the difference-maker, you're reifying an average. An average doesn't reproduce. A genome replicates. Dawkins got this right with the replicator/vehicle distinction. Genes are the replicators; bodies and groups are just vehicles. Selection sorts vehicles, but only replicators get to play the long game.

  **Sam:** The replicator/vehicle distinction clarifies the *persistence*, not the *process*. It tells us what lasts, not what drives the change. Think of a major transition. Early eukaryotes. Cells grouping up. At some point, the fitness of the cell becomes subservient to the fitness of the organism. If you insist on tracking every gene's eye view during that transition, you miss the bottleneck. The group becomes the vehicle *so effectively* that treating it as a mere collection of individuals is like describing a computer by tracking the voltage in every transistor rather than the logic gates.

  **Alex:** But the logic gates only work *because* of the voltage. If the transistors rebel—if meiosis drive or transposons kick in—the "group" illusion shatters. The gene's-eye view is robust because it predicts when the group level will break down. Your view predicts harmony; mine predicts conflict. When a "selfish genetic element" destroys the group, my model says "of course, gene-level selection won out." Your model has to say "oh, the group fitness term collapsed." It's post-hoc.

  **Sam:** That's unfair. Multilevel selection predicts that conflict *within* levels undermines selection *between* levels. We know that. But look, let's push on your grant. You admitted the math is equivalent. So the disagreement isn't empirical. It's heuristic. You prefer the heuristic that minimizes ontology. I prefer the heuristic that maximizes causal resolution at the relevant scale.

  **Alex:** It's not just ontology. It's about avoiding spurious causation. If I tell a student that "the group selected for altruism," they imagine the group has a goal. If I tell them "genes for altruism spread because they were correlated with other copies of themselves," they understand the mechanism. Your language invites mysticism.

  **Sam:** And your language invites reductionism that blinds you to emergent constraints. You say "correlated copies." I say "group structure." In a viscous population, the group structure *creates* the correlation. If I treat the group as a causal unit, I can ask: "What stabilizes the group?" If I treat it as just gene correlations, I ask: "What benefits the gene?" Sometimes those answers diverge. Specifically, when the group property—like a nest, or a biofilm—creates a niche that changes the selection pressure on the genes. The group isn't just a passive vessel; it's part of the selective environment.

  **Alex:** So now we're talking about niche construction. That's different from group selection.

  **Sam:** Is it? If the niche is constructed by the collective action of the group, and that niche determines which groups persist... that's MLS2.

  **Alex:** *Sighs.* You're moving the goalposts. First it was about fitness variance, now it's about niche construction.

  **Sam:** I'm not moving them; I'm showing you that your "gene's-eye view" forces you to flatten the hierarchy. You want to say the real disagreement is verbal. I think it's about what counts as a "cause." You want the *bottom-up* cause. I want the *structural* cause.

  **Alex:** Okay. Let's try to pinpoint it. If we ran a simulation, tracked every birth and death, and calculated the Price equation terms... would we disagree on the numbers?

  **Sam:** No. The numbers would match.

  **Alex:** And if we asked, "Will the altruistic allele fix?" would we disagree on the prediction?

  **Sam:** Probably not, provided we parameterize the model correctly.

  **Alex:** Then what are we fighting about?

  **Sam:** We're fighting about the story we tell *after* the simulation runs. If the between-group covariance term is 80% of the total change, I want to say "Group selection drove this." You want to say "Individual selection within a structured population drove this."

  **Alex:** Because "Group selection" implies the group is a replicator. If the group doesn't have high-fidelity inheritance, it's not a unit of evolution. It's a unit of *selection*, maybe, but not evolution.

  **Sam:** There it is. You're tying "evolution" strictly to high-fidelity replication. I'm tying "evolution" to any process where heritable variation leads to differential persistence. A group can persist and propagate properties without being a perfect replicator in the gene sense.

  **Alex:** But without high-fidelity replication, you don't get adaptation. You get transient blips.

  **Sam:** And yet, here we are, multicellular organisms, sitting in a bar. We are the result of groups of cells suppressing their own fitness for the group. At some point, the group became the dominant unit. Your view says the genes just tricked the cells. My view says the selection pressure shifted levels.

  **Alex:** I think... I think I can accept that. The *pressure* shifted. But the *unit* that carries the information is still the genome.

  **Sam:** And I can accept that the genome carries the information. But the *unit that was selected*—the thing that lived or died based on its properties—was the organism, the group of cells.

  **Alex:** So, is it verbal? "Unit of Selection" vs. "Unit of Evolution"?

  **Sam:** Maybe. Or maybe it's that you care about the *code*, and I care about the *computer*.

  **Alex:** *Raises glass.* I can drink to that. As long as we agree the code doesn't run itself.

  **Sam:** *Clinks glass.* And the computer doesn't write the code. But we still need to decide which one to teach the grad students.

  **Alex:** Don't push your luck.

  **Sam:** *Laughs.* Fair enough.
