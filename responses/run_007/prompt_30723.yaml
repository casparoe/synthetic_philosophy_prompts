answer: |-
  You have put your finger on one of the most famous and debated puzzles in the philosophy of language and formal semantics.

  The established name for the pattern you are describing is a **Sobel Sequence**.

  The specific asymmetry you noticed—the fact that one order is coherent while the other sounds like a retraction—is the distinction between a **Sobel Sequence** (felicitous) and a **Reverse Sobel Sequence** (infelicitous).

  Here is the breakdown of the terminology, the logic, and why the order matters.

  ### 1. The Terminology
  The term comes from the philosopher **Jeremy Sobel**, who in 1970 used these exact patterns to argue against strict logical accounts of conditionals.

  *   **Sobel Sequence (The "Good" Order):**
      > "If Alice had come, it would have been great. But if Alice and Bob had come, it would have been a disaster."
      *   **Structure:** General Antecedent $\rightarrow$ Specific Antecedent.
      *   **Status:** Fully assertable and coherent.

  *   **Reverse Sobel Sequence (The "Bad" Order):**
      > "If Alice and Bob had come, it would have been a disaster. But if Alice had come, it would have been great."
      *   **Structure:** Specific Antecedent $\rightarrow$ General Antecedent.
      *   **Status:** Infelicitous. It sounds contradictory, confused, or like a retraction.

  ### 2. The Logical Background: Non-Monotonicity
  You mentioned remembering that 'if' doesn't permit adding extra conditions. In logic, this is the failure of **Antecedent Strengthening** (also known as **Monotonicity**).

  *   **Monotonic Logic (e.g., "All"):** If *All dogs are mammals* is true, then *All dogs with spots are mammals* must also be true. Adding information to the subject doesn't break the rule.
  *   **Non-Monotonic Logic (e.g., "If"):** If *If it rains, the match is cancelled* is true, it does **not** guarantee that *If it rains and the cover is out, the match is cancelled* is true.

  Natural language conditionals are **defeasible**. They hold "all else being equal" (ceteris paribus). When you add a condition (Bob comes; the cover is out), you defeat the original assumption.

  ### 3. Why the Order Matters (The Pragmatics)
  While logic explains why *both* sentences can be true simultaneously, it doesn't explain why the **order** changes how coherent the speech sounds. This is where **Dynamic Semantics** comes in, specifically the work of **Kai von Fintel (2001)** and **Anthony Gillies (2007)**.

  Their explanation relies on **Contextual Domain Restriction**:

  1.  **Conditionals restrict the conversation:** When you assert a conditional, you aren't just stating a fact; you are restricting the set of "possible worlds" the conversation is considering.
  2.  **In the Sobel Sequence (General $\rightarrow$ Specific):**
      *   Sentence 1 ("If Alice...") sets up a domain of worlds where Alice comes.
      *   Sentence 2 ("If Alice and Bob...") further narrows that domain to a subset where Bob *also* comes.
      *   This feels natural because you are zooming in. You establish a general rule, then introduce an exception for a specific sub-case.
  3.  **In the Reverse Sobel Sequence (Specific $\rightarrow$ General):**
      *   Sentence 1 ("If Alice and Bob...") restricts the domain to the specific scenario where both attend. It makes the "Bob factor" salient.
      *   Sentence 2 ("If Alice...") attempts to widen the domain back out to include scenarios where Bob *doesn't* come.
      *   **The Problem:** Because you just established the "Bob" context, widening back out feels like you are ignoring the restriction you just imposed. It sounds like you forgot the exception you just mentioned, hence the feeling of **retraction** or error.

  ### 4. Is the Future-Tense Version the Same?
  **Yes.** While the literature focuses heavily on counterfactuals (the "would have" cases), the phenomenon applies equally to **indicative conditionals** (the "will" cases).

  *   **Counterfactual Sobel Sequence:** Deals with epistemic possibilities in past worlds.
  *   **Indicative Sobel Sequence:** Deals with epistemic possibilities in future worlds.

  The mechanism is identical: the first conditional updates the "conversational score" (the context), and the second conditional must respect that update. In the reverse order, the second sentence clashes with the context established by the first.

  ### 5. Summary of Terms
  If you need to search for more on this, or use a term in writing, here is the hierarchy:

  *   **The Phenomenon:** **Sobel Sequence Asymmetry**.
  *   **The Infelicitous Order:** **Reverse Sobel Sequence**.
  *   **The Logical Property:** **Non-Monotonicity** (or Failure of Antecedent Strengthening).
  *   **The Pragmatic Mechanism:** **Dynamic Contextual Restriction**.

  If you want a descriptive phrase that captures the "retraction" feel without using the jargon "Sobel," you could describe it as a **Specificity-Ordered Defeasibility**. However, **Reverse Sobel Sequence** is the precise term linguists and philosophers use to identify exactly the puzzle you have solved.

  **Recommendation:**
  If you are writing this up, the strongest citation is **Kai von Fintel, "Counterfactuals in a Dynamic Context" (2001)**. He explicitly solves the puzzle of why the reverse order sounds like a contradiction/retraction even when the logic holds. He argues that the first sentence in the reverse order "poisons the well" for the second by restricting the domain too narrowly to allow the generalization to follow comfortably.
