prompt: |-
  I'm taking this philosophy of statistics course and its honestly messing with my head a bit. So here's the thing — I'm on the exec board of a student tutoring program and we've been trying to figure out whether our new online tutoring format is actually better than the old in-person format. I pulled the pass rates from last semester and here's what's weird: when I look at all students together, the in-person format has a higher overall pass rate. But when I split it by whether the student was in an intro course vs an upper-level course, the online format has a higher pass rate in BOTH intro courses AND upper-level courses separately. How is that even possible? My friend who's in CS says I must have made a mistake in Excel, but I've triple-checked the numbers. I feel like there's some statistical thing going on that I should know about from this course, but I can't put my finger on what it is or what we should actually conclude — like, which format should we keep?
reasoning: |-
