      *   *Recommendation:*
          *   Statistically: Online is likely the better *method*.
          *   Practically: Why were students assigned that way? If struggling students were sent online, Online is actually *heroic* for overcoming that disadvantage.
          *   Decision: Keep Online, but ensure fair assignment in the future to avoid this confusion.

  5.  **Refining Tone:**
