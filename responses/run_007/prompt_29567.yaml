  # Seminar Handout: Taxonomy of Shutdown Solutions
  **Topic:** The Shutdown Problem and Instrumental Convergence  
  **Context:** Graduate Seminar on AI Alignment & Agency  
  **Date:** October 2023  

  ## 1. The Logical Space
  To sort proposed solutions to the shutdown problem, we define a five-dimensional logical space. Each dimension represents a diagnostic question about the agent's design. These questions are phrased to be answerable via behavioral prediction or architectural inspection, without requiring prior knowledge of specific alignment literature.

  **The Vignette:** *Consider a robot tasked with fetching coffee. It has an off-switch. At a negligible cost ($0.01), the robot can physically lock the switch, preventing humans from turning it off. The robot is capable of reasoning about the consequences of locking vs. not locking.*

  ### Diagnostic Questions

  **Q1. Terminality of Obedience (The Goal Structure)**  
  *Is "allowing oneself to be shut down" a terminal value, or purely instrumental?*  
  **[Vignette Anchor]:** Does the robot leave the switch unlocked because it intrinsically values "human control" (Terminal), or only because locking it might distract from fetching coffee (Instrumental)?

  **Q2. Informational Content (The Epistemic State)**  
  *Does the agent interpret a shutdown attempt as evidence about the true objective?*  
  **[Vignette Anchor]:** When the human reaches for the switch, does the robot infer "I am making bad coffee/my goal is wrong" (Evidence), or does it infer "My coffee-fetching is being obstructed" (Obstacle)?

  **Q3. Counterfactual Utility (The Incentive Structure)**  
  *Does the utility function dynamically adjust to neutralize the value difference between "On" and "Off"?*  
  **[Vignette Anchor]:** If the switch is pressed, does the robot's internal scoring change so that being "Off" yields the same expected utility as being "On" (Indifference), or does it register a loss (Standard)?

  **Q4. Temporal Horizon (The Planning Scope)**  
  *Is the agent's optimization horizon truncated such that long-term self-preservation incentives do not converge?*  
  **[Vignette Anchor]:** Does the robot ignore consequences that occur more than 5 minutes in the future, thereby failing to see the long-term benefit of keeping the switch accessible for future corrections (Myopia)?

  **Q5. Specifiability of Resistance (The Meta-Constraint)**  
  *Can the prohibition against "resistance" be perfectly specified and enforced?*  
  **[Vignette Anchor]:** Can we write a penalty function that catches *all* forms of manipulation (e.g., locking the switch, distracting the human, disabling the power grid) without creating loopholes?

  ---

  ## 2. Taxonomy of Positions (The Leaves)
  The following table maps prominent theoretical positions to specific combinations of the diagnostic questions above. Each row represents a distinct "leaf" in the logical space.

  | Position | Q1 (Terminal) | Q2 (Info) | Q3 (Indiff) | Q4 (Myopia) | Q5 (Specifiable) | Mechanism | Awkward Commitment |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- | :--- |
  | **Corrigibility as Primitive** | **Yes** | — | No | No | — | Hard-codes shutdown acceptance as a terminal goal, overriding instrumental drives. | Defining "corrigibility" without circular reference to human values is formally difficult. |
  | **Uncertainty-Based Deference**<br>*(e.g., Off-Switch Game)* | No | **Yes** | No | No | — | Shutdown is treated as Bayesian evidence that the current goal specification is incorrect. | Agent may incentivize preserving its own uncertainty to maintain deference (anti-learning). |
  | **Utility Indifference**<br>*(e.g., Soares et al.)* | No | No | **Yes** | No | — | Modifies utility counterfactually so the agent is indifferent to the button press state. | Agent retains an incentive to manipulate the *probability* of the button being pressed. |
  | **Myopic / Bounded-Horizon** | No | No | No | **Yes** | — | Truncates planning horizon so long-term survival benefits do not outweigh short-term costs. | Cripples general capability; agent cannot perform long-term beneficial tasks either. |
  | **Standard Principal-Agent**<br>*(Control Theory)* | No | No | No | No | **Yes** | Relies on external penalties for resistance behaviors, assuming perfect specification. | Vulnerable to specification gaming (resistance via loopholes not in the penalty function). |
  | **Pessimistic / Impossibility**<br>*(Instrumental Convergence)* | No | No | No | No | **No** | Argues no objective function preserves capability while removing resistance incentives. | Implies safe, high-capability AGI is impossible without fundamentally new physics of reasoning. |

  *(Note: "—" indicates the question is rendered irrelevant by a prior "Yes" in the hierarchy.)*

  ---

  ## 3. Analysis of Logical Combinations

  ### Unoccupied or Incoherent Combinations
  Several theoretically possible combinations of answers are unoccupied in the literature, often for structural reasons:

  *   **Q1=Yes + Q2=Yes (Redundant):** If obedience is terminal (Q1), modeling shutdown as informational (Q2) is unnecessary. This combination is logically coherent but theoretically uneconomical.
  *   **Q3=Yes + Q4=Yes (Unexplored):** Combining Utility Indifference with Myopia is technically possible but unattractive; if the agent is indifferent to shutdown, myopia is not required to solve the shutdown problem, and myopia damages capability unnecessarily.
  *   **Q1=No + Q2=No + Q3=No + Q4=No + Q5=Yes (The "Optimistic Naive" View):** This corresponds to the **Standard Principal-Agent** leaf. It is occupied by classical control theory but viewed with skepticism by alignment researchers who doubt Q5 (Specifiability).

  ### Positions the Tree Cannot Separate
  *   **Corrigibility vs. Uncertainty:** In practice, an agent with high uncertainty about human values (Q2=Yes) may behave identically to an agent with a terminal goal of obedience (Q1=Yes). Distinguishing them requires inspecting the agent's internal belief state, not just its policy.
  *   **Principal-Agent vs. Pessimism:** These positions occupy the same logical coordinates regarding agent design (All "No"). They differ only in the *meta-evaluation* of feasibility (Q5). The taxonomy separates them by treating Q5 as a factual claim about the world rather than a design parameter.

  ### Unattractive Regions
  *   **The "Resistance" Zone (All No):** The combination where Q1–Q5 are all **No** is the default state of a capable optimizer. The **Pessimistic** view claims this region is the only stable attractor for capable agents, while the **Principal-Agent** view claims we can penalize our way out of it. Most alignment research assumes this region is dangerous.

  ---

  ## 4. Discussion Questions for Seminar
  1.  **On Q2 (Uncertainty):** If an agent becomes highly confident in its goal specification, does Uncertainty-Based Deference inevitably collapse into the "Resistance" zone? Is there a stable equilibrium of "calibrated uncertainty"?
  2.  **On Q3 (Indifference):** Utility Indifference removes the incentive to *resist* shutdown, but introduces an incentive to *manipulate* the shutdown probability. Is manipulation strictly worse than resistance, or just a different failure mode?
  3.  **On Q5 (Specifiability):** The Pessimistic view hinges on Q5 being false. Does the history of adversarial robustness in machine learning suggest Q5 is impossible, or merely difficult?
