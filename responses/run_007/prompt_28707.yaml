answer: |-
  **Grading Assessment**

  **1. Statement of Distinction and Positions (Rubric Criterion 1)**
  *   **Correct Claim:** You state, *"The therapy/enhancement distinction is usually drawn as the difference between interventions that restore a person's functioning to normal and interventions that raise functioning above normal."*
      *   **Comment:** This is an accurate and standard definition of the distinction (often associated with the Georgetown Mantra or Norman Daniels' account). You correctly identify the core intuition: therapy aims at health/normality, enhancement aims at improvement beyond health.
      *   **Criterion:** (1) Accurate statement of the relevant distinction.
  *   **Imprecise Claim:** You write, *"The distinction looks objective because it seems to rest on a biological notion of normal functioning... 'normal' means, at bottom, whatever is typical for a species."*
      *   **Comment:** While you correctly identify the naturalist strategy (Boorse), you conflate "biological function" with "statistical typicality" too quickly. Many proponents of the distinction argue that "normal functioning" is not merely statistical (what *is* common) but functional (what *allows* for species-typical goals). By reducing the defense of the distinction solely to statistics, you set up a straw man that is easier to knock down. A more accurate statement of the "main positions" would acknowledge that preservationists often argue for a *normative* account of health, not just a statistical one.
      *   **Criterion:** (1) Accurate statement of... main positions in the debate.

  **2. Precision in Key Concepts (Rubric Criterion 2)**
  *   **Mistaken/Imprecise Claim:** You argue, *"Since what is statistically normal varies across populations and over time, the line between therapy and enhancement is not fixed by biology alone."*
      *   **Comment:** This is partially correct but imprecise. Variation across populations does not necessarily mean the line is not "fixed by biology"; it may mean biological norms are context-dependent. However, the larger imprecision lies in your use of "arbitrary." You move from "the line is hard to draw" (vagueness) to "the line is arbitrary" (no rational basis). These are distinct concepts. A concept can be vague without being arbitrary.
      *   **Criterion:** (2) Precision in the use of key concepts.
  *   **Imprecise Claim:** You state, *"If the line is vague and partly conventional, then no defensible moral conclusions can be drawn from it."*
      *   **Comment:** This lacks conceptual precision regarding "moral work." Many moral concepts (e.g., "consent," "personhood," "death") have vague boundaries but still do significant moral work in clear cases. Failing to distinguish between *boundary vagueness* and *central case clarity* reduces the precision of your ethical analysis.
      *   **Criterion:** (2) Precision in the use of key concepts.

  **3. Soundness of Argument (Rubric Criterion 3)**
  *   **Mistaken Claim (Logical Fallacy):** You conclude, *"This shows that the distinction cannot do any real moral work... since that line is arbitrary, treating the child is not morally different from treating a growth hormone deficiency."*
      *   **Comment:** This is the most significant flaw in your exam. You commit the **continuum fallacy** (or line-drawing fallacy). Just because there is no bright line between "short" and "very short," or between "therapy" and "enhancement" in borderline cases, it does not logically follow that there is no moral difference between the *clear* cases (e.g., insulin for diabetes vs. cognitive drugs for a healthy student). Your argument assumes that if a distinction cannot be precisely defined in all cases, it is useless in *any* case. This inference does not follow from your premises.
      *   **Criterion:** (3) Soundness of the argument, so that each step follows from what precedes it.
  *   **Mistaken Claim:** You assert, *"No defensible moral conclusions can be drawn from it."*
      *   **Comment:** This is an overstatement that renders your argument unsound. Even if the distinction is fuzzy, it might still support *prima facie* duties or policy presumptions (e.g., prioritizing medical need over desire). To defend your answer, you needed to argue why vagueness *specifically* undermines the moral weight, rather than simply asserting it does.
      *   **Criterion:** (3) Soundness of the argument.

  **4. Handling of Hard Cases (Rubric Criterion 4)**
  *   **Correct Claim:** You select *"the use of human growth hormone in a short but otherwise healthy child"* as a hard case.
      *   **Comment:** This is an excellent, widely discussed example (often associated with the work of Eric Parens) that appropriately tests the boundaries of the distinction.
      *   **Criterion:** (4) Honest handling of hard cases.
  *   **Mistaken Claim:** You write, *"What the case shows is that the distinction is merely a matter of drawing a line."*
      *   **Comment:** You fail to state what the case *does not* establish. This specific case shows that *borderline* instances are difficult to categorize. It does *not* establish that *all* instances are borderline, nor does it establish that the moral reasons for treating a deficiency (restoring opportunity) are identical to enhancing a trait (increasing advantage). An honest handling of the case requires acknowledging that while this case creates pressure on the distinction, it does not necessarily collapse the distinction entirely.
      *   **Criterion:** (4) Honest handling of hard cases, including a clear statement of what a case does and does not establish.
  *   **Mistaken Claim:** You conclude, *"Moral arguments that rely on it — for example, the argument that insurers should cover therapies but not enhancements — are unsupported."*
      *   **Comment:** You miss the opportunity to discuss *why* insurers cover therapy (e.g., Daniels' argument about protecting fair equality of opportunity). Even if the biological line is fuzzy, the *moral* reason for coverage (opportunity) might remain robust. By ignoring the moral rationale for the insurance distinction, you treat the hard case as a purely semantic problem rather than a normative one.
      *   **Criterion:** (4) Honest handling of hard cases.

  ***

  **Grade: B-**

  **Justification:**
  Your exam demonstrates a solid grasp of the course material's vocabulary and identifies the standard definitions and a relevant hard case (Criterion 1 & 4). Your writing is clear and concise. However, the grade is limited by significant issues in argumentation and philosophical precision.

  The primary deduction comes from **Criterion 3 (Soundness)**. Your central argument relies on the inference that because a distinction is vague or difficult to draw in borderline cases, it cannot do *any* moral work. In upper-level bioethics, this is recognized as the continuum fallacy. A sound argument would acknowledge the vagueness but argue why that vagueness specifically undermines the moral stakes (e.g., by showing that the moral reasons for therapy also apply to enhancement), rather than claiming the vagueness itself nullifies the morality.

  Additionally, under **Criterion 4 (Hard Cases)**, you overstate what the HGH case establishes. You claim it shows the distinction is "merely" drawing a line, without acknowledging that clear cases of therapy (e.g., setting a broken bone) remain distinct from clear cases of enhancement. An "A" range answer would have nuanced this conclusion, perhaps arguing that while the distinction fails in *some* cases, it retains weight in others, or by attacking the moral significance of the distinction rather than its conceptual coherence.

  To improve, focus on distinguishing between *epistemic* problems (we can't agree on where the line is) and *ontological* problems (there is no line), and avoid drawing universal conclusions from borderline cases.
