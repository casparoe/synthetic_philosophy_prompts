  # JOINT STATEMENT ON THE LINGUISTICS OF DEROGATORY TERMS
  **An Outcome of Adversarial Collaboration between Semantic and Pragmatic Theorists**

  **Date:** October 26, 2023
  **Signatories:** [Semantic Theorist], [Pragmatic Theorist]

  ## 1. AGREED EMPIRICAL CLAIMS (THE DATA)

  We agree on the following linguistic observations regarding the slur **S** and its neutral counterpart **N**. We treat these as the phenomenological constraints any successful theory must explain. We distinguish between *extensional reference* (the set of individuals picked out) and *truth-conditional contribution* (which remains a point of theoretical contention).

  1.  **Extensional Overlap:** In standard predicative uses (e.g., "x is S" / "x is N"), **S** and **N** are used to pick out the same demographic group in the actual world. While we disagree on whether they contribute the same *truth conditions*, we agree that a sentence using **S** is typically judged false if the subject does not belong to the group picked out by **N**.
  2.  **Projection of Offense:** The offensive or derogatory force of **S** persists under various embeddings where the at-issue content of **N** does not trigger similar effects. Specifically, the offense survives in:
      *   Negation: "x is not S."
      *   Questions: "Is x S?"
      *   Conditionals: "If x is S, then y."
      *   Modals: "x might be S."
      *   *Agreement:* In all these cases, uttering the sentence is generally considered offensive in a way the **N**-variant is not, regardless of whether the speaker is asserting the content.
  3.  **Use vs. Mention:** Quoting or mentioning the string "S" (e.g., "The word 'S' has four letters") does not typically incur the same offensive penalty as using **S** to predicate a property of an individual.
  4.  **Reclamation:** Members of the target group can use **S** in-group without the standard derogatory force (e.g., "I am S and proud"). In these contexts, the offense is suspended or inverted, though the extensional reference remains the same.
  5.  **Slurs without Neutral Counterparts:** There exist terms functioning as **S** (derogatory, targeting a group) for which there is no widely accepted, contemporaneous **N** (e.g., certain historical or specific caste-based terms). The derogatory force exists even without a semantic twin.
  6.  **Learner Knowledge:** A child or second-language learner can acquire the knowledge that **S** is offensive/taboo prior to acquiring precise knowledge of the extension of **S**. One can know *that* one should not say **S** without knowing exactly *who* **S** refers to.
  7.  **Non-Defeasibility in Standard Contexts:** In a standard out-group context, a speaker cannot explicitly cancel the derogatory force without infelicity (e.g., #"x is S, but I don't mean anything bad by it" is typically rejected as insincere or contradictory).

  ## 2. DISAGREEMENTS TABLE (THEORETICAL INTERPRETATIONS)

  We disagree on the architectural location of the derogatory component. Below we characterize our respective positions charitably.

  | Issue | Semantic Theorist's Position | Pragmatic Theorist's Position |
  | :--- | :--- | :--- |
  | **1. Location of Derogatory Content** | The derogatory component is **encoded** in the lexical entry of **S**. It is part of the conventional meaning (whether as at-issue content, a presupposition, or a Conventional Implicature). | The derogatory component is **not encoded**. **S** and **N** share the same semantic content. The difference lies in social norms governing the *use* of the word (taboo, expressivism, or generalized conversational implicature). |
  | **2. Truth-Conditional Contribution** | **S** and **N** differ in truth-conditional or compositional contribution. "x is S" may express a different proposition (or a proposition plus an independent dimension of meaning) than "x is N". | **S** and **N** are truth-conditionally equivalent. "x is S" and "x is N" express the exact same proposition. The difference is illocutionary or pragmatic, not propositional. |
  | **3. Mechanism of Projection** | The offense survives embedding because the encoded content (e.g., presupposition or CI) is designed by the grammar to project out of logical operators. | The offense survives embedding because the *norm against using the word* applies to the utterance act itself, regardless of whether the content is asserted. |
  | **4. Reclamation Analysis** | Reclamation involves a shift in the lexical semantics (contextual modulation of the encoded content) or the activation of a distinct homophonous lexical entry. | Reclamation involves the suspension or modification of the social norms governing the word's use. The semantics remain constant; the pragmatic license changes. |
  | **5. The "Bigot" Entailment** | Using **S** semantically commits the speaker to a derogatory perspective (e.g., that the target group is inferior). Denying this creates a semantic contradiction. | Using **S** violates a conversational norm which *suggests* the speaker is a bigot, but does not semantically entail it. A speaker could use **S** without holding derogatory beliefs (e.g., in error or irony), though they remain liable for the violation. |

  ## 3. CRUXES AND EMPIRICAL TESTS

  We identify the following specific tests where our theories generate divergent predictions. We agree that the results of these tests would constrain our respective models.

  ### Crux A: The "Mixed Report" (Indirect Discourse)
  *   **Test Sentence:** John (who is not a bigot) said that I am **S**.
  *   **The Issue:** Does the reporter endorse the derogatory content?
  *   **Semantic Prediction:** The report is infelicitous or implies the reporter endorses the derogatory perspective, because the derogatory content is part of the reported proposition/CI. To report faithfully without endorsing, the reporter *must* use **N**.
      *   *Falsifier for Semantics:* If native speakers consistently judge the report as fully acceptable and neutral, implying no endorsement from the reporter.
  *   **Pragmatic Prediction:** The report is acceptable and neutral. The reporter is reporting the *speech act* or the *extensional content*. The offense is tied to John's original utterance, not the reporter's semantic content.
      *   *Falsifier for Pragmatics:* If native speakers consistently judge the reporter as having insulted the subject simply by using **S** in the report, regardless of context.

  ### Crux B: Truth-Conditional Embedding (The "Just" Test)
  *   **Test Sentence:** It is not true that he is **S**; he is just **N**.
  *   **The Issue:** Is this a contradiction?
  *   **Semantic Prediction:** The sentence is contradictory or infelicitous (like "He is not a bachelor, he is just an unmarried man"). If **S** encodes **N** + Derogation, denying **S** while asserting **N** should clash if the derogation is part of the truth conditions.
      *   *Falsifier for Semantics:* If speakers judge this sentence as clearly **True** in contexts where the person is in the group but not derogated.
  *   **Pragmatic Prediction:** The sentence is **True** and felicitous. Since **S** and **N** are truth-conditionally equivalent, denying the *appropriateness* of **S** (pragmatically) while asserting the *truth* of **N** is coherent.
      *   *Falsifier for Pragmatics:* If speakers judge this sentence as a logical contradiction (False in all worlds).

  ### Crux C: The "Linguistic Ignorance" Case
  *   **Test Scenario:** A learner uses **S** believing it is synonymous with **N**, with no intent to derogate.
  *   **The Issue:** Did the speaker say something offensive?
  *   **Semantic Prediction:** Yes. The word carries the offense in its meaning. The speaker has expressed a derogatory proposition, even if unintentionally. The offense is public and encoded.
      *   *Falsifier for Semantics:* If the community uniformly agrees the speaker committed *no* offensive act (not even a microaggression) solely due to lack of intent.
  *   **Pragmatic Prediction:** The speaker violated a norm, but the *offensive force* (as an expression of contempt) is absent because the intent/normative context is missing. It is a mistake, not an insult.
      *   *Falsifier for Pragmatics:* If the community judges the utterance as equally harmful and offensive as a deliberate slur, regardless of the speaker's ignorance.

  ### Crux D: Processing Latency in Embedding
  *   **Test:** Measure reaction times for processing offense in "If x is **S**..." vs. "x is **S**."
  *   **The Issue:** When is the derogatory content computed?
  *   **Semantic Prediction:** Derogatory content is computed immediately upon lexical access, regardless of embedding. Latency should be similar in asserted and embedded contexts.
      *   *Falsifier for Semantics:* If processing of the offensive component is significantly delayed or blocked in embedded contexts compared to asserted contexts.
  *   **Pragmatic Prediction:** Derogatory force is computed at the utterance level. Embedded contexts might show different processing profiles as the pragmatic norm is evaluated against the speech act type.
      *   *Falsifier for Pragmatics:* If there is absolutely no difference in processing cost between embedding **S** and embedding **N** until the very end of the sentence.

  ## 4. ANALYSIS OF VERBAL DISPUTE

  We acknowledge that a portion of our disagreement is verbal, stemming from competing definitions of "semantics," but we assert that a substantive core remains.

  **The Verbal Component:**
  The dispute is partially verbal regarding the boundary of the label "semantic."
  *   If "semantic" is defined as *context-invariant and truth-conditional*, the Pragmatic Theorist wins by stipulation: since **S** can be reclaimed (context-variant) and often doesn't alter truth conditions (on their view), it is not semantic.
  *   If "semantic" is defined as *conventional and encoded in the lexical entry* (following Kaplan or Potts), the Semantic Theorist wins by stipulation: since the offense is tied to the word type **S** rather than specific speaker intentions, it is semantic (specifically, Conventional Implicature).
  *   **Resolution:** We agree to stop arguing about the label "semantics." We will instead refer to the **"Encoded/Conventional Component"** (Semantic Theorist's focus) vs. the **"Normative/Usage Component"** (Pragmatic Theorist's focus).

  **The Substantive Remainder:**
  Once the terminology is neutralized, a non-verbal disagreement persists regarding **compositionality and cognitive architecture**:
  1.  **Compositionality:** Does the derogatory component enter the compositional calculus of the sentence? The Semantic Theorist argues it does (interacting with operators); the Pragmatic Theorist argues it does not (it is a post-compositional filter). This is testable via Crux B (The "Just" Test).
  2.  **Cognitive Processing:** Is the derogatory content retrieved as part of the linguistic decoding process, or is it retrieved as part of social-norm evaluation? This is testable via Crux D (Processing Latency).
  3.  **Logical Entailment:** Does "x is **S**" logically entail "x is **N**"? The Semantic Theorist may argue for distinct logical forms; the Pragmatic Theorist argues for identity. This impacts how we model inference and contradiction in natural language logic.

  **Conclusion:**
  We sign this statement acknowledging that while we share a vocabulary, we model the underlying machinery differently. Our collaboration has isolated that the fight is not merely about the word "meaning," but about whether the derogatory force of **S** behaves like a logical operator (Semantic) or a social rule (Pragmatic). Future work must focus on the empirical tests in Section 3 to determine which model best predicts speaker behavior.
