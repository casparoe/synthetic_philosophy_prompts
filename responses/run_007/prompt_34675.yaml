answer: |-
  # The Rescue Taxonomy: A Decision Tree for the "Numbers Count" Debate

  ## Introduction
  This tree is designed to locate your position in the debate over whether and how numbers matter in forced-choice rescue cases. It does not ask you to identify with a label (e.g., "Utilitarian" or "Contractualist"). Instead, it asks you to render verdicts on concrete variations of the rescue case. Your path through the tree reveals the logical structure of your moral intuitions.

  **Instructions:** Start at the **Root**. Answer each question based on your immediate moral judgment of the case described. Follow the arrow corresponding to your answer until you reach a **Leaf** (a final position). Once you reach a leaf, read the "Stress Tests" to see if your position holds under pressure.

  ---

  ## The Decision Tree

  ### ROOT: The Basic Rescue
  **Case:** You can save **one stranger** (who will otherwise die) or **five strangers** (who will otherwise die). You cannot save both. There is no relationship to you, and rescue is certain.
  **Question:** Is it **morally forbidden** to save the single stranger?
  *   **YES (You must save the five):** Go to **Branch A**.
  *   **NO (Saving the one is permissible):** Go to **Branch B**.

  ---

  ### BRANCH A: The Duty to Save the Five
  *You believe saving the five is required. We must determine why.*

  **Case:** **The Lesser Harm Variation.** You can save **one stranger** from **death** or **five strangers** from a **broken arm**. You cannot do both.
  **Question:** In this case, are you still **required** to save the five?
  *   **YES:** Go to **Leaf 1**.
  *   **NO (You should save the one from death):** Go to **Leaf 2**.

  ---

  ### BRANCH B: The Permission to Save the One
  *You believe saving the one is allowed. We must determine the role of procedure.*

  **Question:** If you choose to save the one, are you **required** to use a random procedure (like a coin flip) to make the decision, or may you simply **choose** the one directly?
  *   **MAY CHOOSE DIRECTLY:** Go to **Leaf 3**.
  *   **MUST RANDOMIZE:** Go to **Branch C**.

  ---

  ### BRANCH C: The Requirements of Fairness
  *You believe a lottery is required. We must determine how the odds are set.*

  **Question:** In the required lottery, must the odds be **equal** (50% for the one, 50% for the group) or **weighted** by group size (1/6 for the one, 5/6 for the group)?
  *   **EQUAL (50/50):** Go to **Leaf 4**.
  *   **WEIGHTED (Proportional):** Go to **Leaf 5**.

  *(Note: If you hesitate here, consult the **Iteration Stress Test** in the Leaf descriptions.)*

  ---

  ## The Leaves (Positions)

  ### Leaf 1: Strict Aggregationism
  **Verdict:** You must save the five in the Basic Case *and* the Lesser Harm Case.
  **Core Principle:** The moral value of an outcome is determined by the sum total of benefits or harms. Five broken arms can outweigh one death if the sum is greater; five lives always outweigh one.
  **Stress Test (Probability):** In a case where heading toward the five gives only a **60% chance** of saving them, while heading toward the one saves the one with **100% certainty**, do you still head toward the five?
  *   *If Yes:* You are a consistent Expected Value Aggregationist.
  *   *If No:* You may be a **Risk-Sensitive Aggregationist** (a subtle variant), but your core commitment remains that the sum of harms dictates the duty.

  ### Leaf 2: The Tie-Breaker View (Justifiability)
  **Verdict:** You must save the five in the Basic Case, but save the one in the Lesser Harm Case.
  **Core Principle:** Numbers do not aggregate harms (death is not "less bad" because others have broken arms). However, when individual claims are **equally strong** (as in the Basic Case), the larger group provides a tie-breaking reason to act. When claims are unequal (Death > Arm), the strength of the individual claim trumps the numbers.
  **Stress Test (Relationship):** If the **one** stranger is your **close friend**, may you save them?
  *   *If Yes:* You hold that special obligations override the tie-breaking force of numbers.
  *   *If No:* You hold that agent-neutrality is absolute once the duty to save the five is triggered.

  ### Leaf 3: Permissive Moderate
  **Verdict:** Saving the one is permissible without a lottery. Saving the five is also permissible.
  **Core Principle:** The claims of the five give you a strong reason to save them, but not a decisive duty that overrides the claim of the one. You are not required to randomize because you do not owe the five a *chance*, only *consideration*.
  **Stress Test (Iteration):** If you face this choice **every day for a year**, should you aim to maximize the total number saved over the year, or treat each day as a fresh choice?
  *   *If Maximize Total:* Your view may collapse into **Weighted-Lottery** or **Aggregationism** over time.
  *   *If Fresh Choice:* You maintain that the permission applies to each act individually.

  ### Leaf 4: Equal-Chances View
  **Verdict:** You must randomize, and the odds must be 50/50.
  **Core Principle:** Each individual has a claim to be saved that cannot be outweighed by the claims of others. Fairness requires giving each *person* an equal chance, not each *group* an equal chance. To weight the odds is to treat the one as a mere means to the greater good.
  **Stress Test (Iteration):** If you face this choice **every day for a year**, should you adjust your flips to ensure the total number saved is maximized?
  *   *If No:* You are consistent. You believe fairness is owed in the single instance, not across time.
  *   *If Yes:* You are in tension. Maximizing over time implies the numbers *do* count ultimately, which undermines the 50/50 requirement in the single case.

  ### Leaf 5: Weighted-Lottery View
  **Verdict:** You must randomize, and the odds must be proportional (5/6 vs 1/6).
  **Core Principle:** You cannot simply sacrifice the one (ruling out Aggregationism), but fairness requires that the probability of rescue reflect the number of claimants. Each person gets an equal *ticket* in the lottery; the group of five holds more tickets.
  **Stress Test (Probability):** In the **60% vs. 100%** case (see Leaf 1), do you head toward the five?
  *   *If Yes:* You treat probability as part of the weighting calculus.
  *   *If No:* You prioritize certainty over expected value, suggesting a limit to how much "weight" numbers carry.

  ---

  ## Empty and Unstable Combinations

  During your sorting, you may find yourself tempted by combinations of answers that do not lead to a leaf. These are typically logically unstable.

  1.  **The "Required Lottery" Contradiction:**
      *   *Combination:* Answering **YES** to "Is it forbidden to save the one?" (Root) but **MUST RANDOMIZE** to "May you choose directly?" (Branch B).
      *   *Diagnosis:* **Incoherent.** If you are *required* to save the five, you cannot be required to give the one a 50% (or 1/6) chance of being saved. A duty to save X excludes a duty to gamble on Y.

  2.  **The "Lesser Harm" Instability:**
      *   *Combination:* Answering **NO** to "Is it forbidden to save the one?" in the Basic Case (Root), but **YES** to "Are you required to save the five?" in the Lesser Harm Case (Branch A).
      *   *Diagnosis:* **Merely Unattractive.** This view holds that five lives do not outweigh one life, but five broken arms *do* outweigh one life. It is difficult to articulate a principle where minor harms aggregate more effectively than major harms.

  3.  **The "Iterated Equal-Chance" Tension:**
      *   *Combination:* Answering **EQUAL (50/50)** in Branch C, but **Maximize Total** in the Iteration Stress Test (Leaf 4).
      *   *Diagnosis:* **Underexplored/Unstable.** If you believe the total number saved matters over time, it is unclear why it should not matter in the single case. This position often collapses into the Weighted-Lottery View upon reflection.

  ---

  ## Indistinguishable Leaves: Rationale vs. Verdict

  This tree sorts you by your **verdicts on cases**, not your **meta-ethical rationale**. Two people may land on the same leaf but disagree fundamentally on *why*.

  *   **Strict Aggregationism (Leaf 1):** A **Utilitarian** lands here because they maximize welfare. A **Rule-Consequentialist** might land here because a rule requiring saving the five produces the best outcomes. The tree cannot separate them; you must ask: *"Do you save the five because this act maximizes good, or because you are following a rule?"*
  *   **The Tie-Breaker View (Leaf 2):** A **Contractualist** (e.g., Scanlon) lands here because saving the one cannot be justified to the five when claims are equal. A **Non-Aggregative Deontologist** (e.g., Kamm) might land here due to principles of "irrelevance of numbers." The tree cannot separate them; you must ask: *"Is the reason you save the five based on what is owed to individuals, or on the structure of justification?"*
  *   **Weighted-Lottery (Leaf 5) vs. Strict Aggregationism (Leaf 1):** In practice, a Weighted-Lottery view (5/6 chance for the five) and a Strict Aggregationist view (100% save the five) often yield the same *policy* if the lottery is conducted mentally and instantly. They differ on whether the one has a *residual claim* to a chance. To distinguish them, ask: *"If the coin flip lands on the one, are you required to let them die, or may you override the flip to save the five?"* (Aggregationist overrides; Weighted-Lottery respects the flip).

  ## Note on the "Special Relationship" Case
  You may have noticed the tree does not branch on the **Special Relationship Case** (saving a friend vs. five strangers). This is intentional. Almost all positions (except the most radical impartialism) permit saving a friend. Therefore, this case is a **control**, not a sorter.
  *   **Diagnostic Use:** If your view *forbids* saving a friend in favor of five strangers, you are a **Radical Impartialist** (a rare subset of Leaf 1). If your view *permits* saving a friend even when it forbids saving a stranger, you hold an **Agent-Relative** modification of your leaf position.
