answer: |-
  Your skepticism is well-founded. While the book provides a standard "pop-epistemology" summary, a formal epistemologist would find several parts of it imprecise, controversial, or outright false. The Reflection Principle is one of the most debated norms in formal epistemology, and it is certainly not considered "airtight."

  Here is a breakdown of the summary's claims, evaluated against the consensus in formal epistemology.

  ### 1. "Reflection says a rational person should treat their future self as an expert."
  *   **Verdict:** **Mostly Accurate (as an intuition), but technically imprecise.**
  *   **Analysis:** This is the standard intuitive gloss. Formally, the principle states that your current credence (degree of belief) in a proposition $A$, *conditional on* your future credence in $A$ being $x$, should be $x$.
      *   Formula: $P_{now}(A \mid P_{future}(A) = x) = x$
      *   The "expert" analogy works if you assume your future self is rational and has processed information correctly. However, formal epistemologists emphasize that this deference is only rational if you believe your future self is *epistemically reliable*. If you expect your future self to be drunk, tired, or forgetful, Reflection does not apply. The book's summary glosses over the conditions required for the future self to count as an "expert."

  ### 2. "If you think that tomorrow you'll be 90% confident it will rain, then you should be 90% confident it will rain today."
  *   **Verdict:** **Accurate *only if* Reflection holds, but ignores the conditional nature.**
  *   **Analysis:** This is a specific instance of the principle. If you are *certain* now that your future credence will be 0.9, then (assuming Reflection) your current credence must be 0.9.
  *   **The Catch:** This leads to the most famous counterexamples. Suppose you know you are going to get drunk tonight and become irrationally confident the sun will rise (or irrationally doubtful). Reflection would demand you adopt that credence *now*, which is absurd.
  *   **The Forgetting Case:** Suppose you have strong evidence for $A$ now, but you know you will forget that evidence by tomorrow. Your future credence will drop. Reflection says you should lower your credence *now* to match your future ignorant self. Most epistemologists reject this: you should believe based on the evidence you *currently* possess, not the evidence you will possess later.

  ### 3. "The principle is proven by a Dutch book argument, so violating it is a genuine incoherence, not just a stylistic flaw."
  *   **Verdict:** **Overstatement / Conflation.**
  *   **Analysis:**
      *   **Dutch Book Arguments:** Van Fraassen did provide a Dutch Book argument for Reflection. However, in formal epistemology, Dutch Book arguments are contentious. They show **pragmatic inconsistency** (you can be made to accept a set of bets that guarantee a loss), not necessarily **epistemic incoherence** (logical contradiction or falsehood). Many epistemologists argue that being susceptible to a Dutch Book is a practical flaw, not proof that your beliefs are logically impossible or "irrational" in a truth-seeking sense.
      *   **"Proven":** In philosophy, nothing is "proven" in the mathematical sense via a Dutch Book. It is an argument for a normative principle. Since there are strong counterexamples (see below), many epistemologists simply reject the principle despite the Dutch Book argument. They argue the Dutch Book scenario relies on assumptions (like the bookie knowing your future credences) that don't hold in real life.

  ### 4. "A rational person can't expect their own opinions to drift... if you already know you'll change your mind without new evidence, then you're admitting your current opinion is wrong right now."
  *   **Verdict:** **Partially Accurate, but conflates two different principles.**
  *   **Analysis:** This claim mixes the **Reflection Principle** with the **Martingale Property** of Conditionalization.
      *   **The Martingale Property:** If you update by Conditionalization (the standard rule for learning new evidence), it is a theorem of probability that your *expected* future credence equals your current credence: $E_{now}[P_{future}(A)] = P_{now}(A)$.
      *   **What this means:** You cannot expect your belief to go up or down *on average* without expecting new evidence. If you expect your belief to change, you must expect to receive evidence that drives that change.
      *   **The Book's Error:** The book implies that *any* expected change is irrational. That is false. You *should* expect your opinions to drift if you expect to learn new things.
      *   **The "Without Evidence" Clause:** The book adds "without new evidence." This is closer to the truth. If you expect to change your mind *without* new evidence (e.g., due to mood swings, time passing, or bias), that is generally considered irrational. **However**, the counterexample of **forgetting** strikes again. If you know you will forget evidence, you *will* change your mind without *new* evidence (you lose old evidence). In this case, expecting drift is rational, but Reflection would forbid it.

  ### The Counterexamples You Heard About
  The people online are correct. Formal epistemologists generally accept that Reflection fails in the following cases:
  1.  **Forgetfulness:** As mentioned, if I know I will forget my keys, I shouldn't be uncertain now just because Future-Me will be uncertain.
  2.  **Cognitive Impairment:** If I know I will be drugged or tired, I should not defer to that future self.
  3.  **Self-Fulfilling/Undermining Beliefs:** If believing I will be confident makes me confident (or insecure), Reflection creates loops that break the probability calculus.
  4.  **Information Loss:** Any case where the future self has strictly less information than the current self.

  ### Does the Conclusion Follow?
  *Book Conclusion:* "A rational person can't expect their own opinions to drift [without evidence]."
  *Formal Verdict:* **Mostly Yes, but not because of Reflection.**

  The conclusion that you shouldn't expect unmotivated drift is widely accepted, but it follows from the **Law of Total Probability** and the norm of **Conditionalization**, not necessarily the Reflection Principle.
  *   **Conditionalization** says: Update only when you get evidence.
  *   **Reflection** says: Defer to your future self's credence.

  You can accept the "no drift" conclusion while rejecting Reflection. In fact, many epistemologists (like David Christensen and Adam Elga) argue that **Reflection is false** precisely because it conflicts with the rationality of holding onto evidence you currently have but know you will lose.

  ### Summary for the Reader
  If you were to show this summary to a formal epistemologist, they would likely say:

  1.  **The Intuition:** Treating your future rational self as an expert is a good heuristic, but not a strict law.
  2.  **The Dutch Book:** Shows pragmatic vulnerability, not logical incoherence. It is not a "proof" that silences dissent.
  3.  **The Counterexamples:** Forgetting and impairment are fatal to the principle as a universal norm. It only holds under idealized conditions (perfect memory, guaranteed rationality).
  4.  **The Drift:** You are right to think you shouldn't expect unmotivated drift, but that is due to the mathematics of Conditionalization, not Reflection. Reflection actually demands *too much* deference in cases of anticipated information loss.

  **Bottom Line:** The book presents a controversial, idealized norm as an airtight law. Your online research is more aligned with the current academic consensus: Reflection is a useful tool for modeling ideal agents, but it is not a binding rule for actual human rationality.
