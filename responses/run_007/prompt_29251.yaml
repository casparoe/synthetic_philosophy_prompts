answer: |-
  In a university lab, a volatile compound must be stabilized by pressing a button at exactly 2:00 PM. Dr. Chen, the lab manager assigned to this task, and Alex, a visiting student observing for the day, stand side-by-side at the console at 1:59 PM. Both know the procedure and are physically capable of pressing the button, though protocol forbids Alex from intervening. Neither presses it. The compound destabilizes. Had Chen pressed it, the compound would have stabilized. Had Alex pressed it, the compound would have stabilized.

  **Analysis**

  **The Theories:**
  The **simple counterfactual theory** verdicts that both omissions are causes. Since the outcome counterfactually depends on each action individually (if Chen had pressed, success; if Alex had pressed, success), both failures satisfy the necessary and sufficient conditions for causation. The **norm-constrained theory** verdicts that only Chen's omission is a cause. Chen violated a procedural duty inherent to her role; Alex adhered to the procedural expectation for a visitor. The intuitive verdict aligns with the norm-constrained view: we say the experiment failed because Chen didn't do her job, not because Alex didn't break protocol to save it.

  **Feature Doing the Work:**
  The distinguishing feature is the **institutional role assignment**. Spatial and temporal proximity are held constant (side-by-side, same time), and physical capacity is identical. The only difference is the "thin" normative status of their actions: Chen's inaction was a system malfunction (violation of duty), while Alex's inaction was a system feature (compliance with protocol).

  **Counterfactual Theorist's Best Response:**
  The counterfactual theorist's best move is to appeal to **default values** within a causal model (e.g., Halpern and Hitchcock). They argue that causation requires a deviation from a "default" or "normal" course of events. In this model, Chen's variable has a default value of "press," so her failure to press is a deviation (cause). Alex's variable has a default value of "do not press," so his inaction is the background state (non-cause).

  **Can They Avoid Norms?**
  Probably not. The question becomes: what determines the "default"? It is not statistical frequency (Alex might press buttons often in other contexts) nor physical necessity. The default is set by the *protocol*—the very normative constraint the theorist hoped to bypass. To fix the causal model, the theorist must import the normative expectation to define what counts as "normal." Thus, the selection problem for omissions appears to be about norms all the way down; the counterfactual machinery can track the intuition, but only by being fed normative inputs.
