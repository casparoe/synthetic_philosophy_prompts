prompt: |-
  I'm a behavioral economist — I live in the world of discount functions, present bias, beta-delta models, commitment devices, time inconsistency. I keep hearing philosophers talk about "akrasia" or weakness of will like it's some deep mystery, but from where I sit it just looks like hyperbolic discounting plus maybe some story about multiple selves or hot/cold systems.

  Restate the core philosophical problem of akrasia — the Socrates/Aristotle/Davidson thread — in my vocabulary as faithfully as you can. Then give me the residue report: what translates cleanly, what you had to distort, and what has no expression at all in my framework. I especially want to know whether the philosophers are wrestling with something my models genuinely miss, or whether they're just using fancier words for preference reversal.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Behavioral Economist. Familiar with discount functions, present bias ($\beta$-$\delta$), commitment devices, time inconsistency, multiple selves, hot/cool systems.
      *   **Attitude:** Skeptical of philosophy. Suspects "akrasia" is just a fancy label for known economic/psychological phenomena (hyperbolic discounting, preference reversal).
      *   **Task:**
          1.  Restate the core philosophical problem of akrasia (Socrates, Aristotle, Davidson) in behavioral econ vocabulary.
          2.  Provide a "Residue Report": What translates well? What required distortion? What is inexpressible?
          3.  Answer the core question: Are philosophers onto something real my models miss, or is it just preference reversal with extra steps?

  2.  **Deconstruct "Akrasia" (Philosophical Side):**
      *   *Socrates (Protagoras):* Denies akrasia exists. If you know the good, you do it. Wrong action = ignorance (miscalculation of pleasure/pain).
      *   *Aristotle (Nicomachean Ethics):* Akrasia *does* exist. Distinction between *akrasia* (weakness) and *akolasia* (licentiousness). Involves practical syllogism. The agent knows the universal premise but fails to apply the particular premise due to passion/appetite.
      *   *Donald Davidson ("How is Weakness of the Will Possible?"):* Modern analytic formulation. Principle of Continence. Acting against one's *all-things-considered* judgment. Not just changing preferences, but acting against the judgment of what is best *overall*.

  3.  **Translate to Behavioral Econ Vocabulary:**
      *   *Socrates:* Rational Choice Model. $U(Action) > U(Inaction)$. If Action isn't taken, the utility function was misspecified (information asymmetry or calculation error). No true preference reversal, just bad data.
      *   *Aristotle:* Dual-System Model (Hot/Cool). The "Universal Premise" is the long-term plan (Cool/System 2). The "Particular Premise" is the immediate context (Hot/System 1). Akrasia is System 1 hijacking System 2 at the moment of execution.
      *   *Davidson:* All-things-considered judgment = Global Utility Function ($U_{total}$). Action = Local Utility Maximization ($U_{local}$). Akrasia is $U_{local}(t) > U_{total}(t)$ despite the agent explicitly ranking $U_{total} > U_{local}$ in the meta-preference ordering. It's a violation of the Principle of Continence (consistency between judgment and action).

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Socrates says you're just irrational. Aristotle says your brain has two parts. Davidson says you break your own rules.
      *   *Refinement (Econ Speak):* Socrates says revealed preference always holds. Aristotle says intertemporal inconsistency due to arousal. Davidson says violating the all-things-considered constraint.
      *   *Polishing:* Need to use terms like "revealed preference," "intertemporal choice," "meta-preferences," "utility maximization."

  5.  **Developing the Residue Report:**
      *   *What translates cleanly:* Preference reversal over time ($\beta < 1$). Conflict between long-term planning self and short-term acting self. Information failures (Socrates).
      *   *What requires distortion:* The normative weight. Econ describes *what is*; Philosophy asks *what ought to be*. The concept of "Judgment" vs. "Preference." In econ, if I choose it, I preferred it. In philosophy, I can choose it but judge it wrong.
      *   *What is inexpressible:* Moral responsibility/Blame. The "Why" of the failure beyond mechanism. The unity of the agent (are we really multiple selves?). The normative force of the "all-things-considered" judgment.

  6.  **Addressing the Core Question (The "So What?"):**
      *   Is it just preference reversal?
      *   *Argument for Yes:* $\beta$-$\delta$ models predict exactly this behavior. Commitment devices solve it.
      *   *Argument for No:* Econ treats the reversal as a parameter ($\beta$). Philosophy treats it as a failure of *rational agency*. The feeling of *regret* and *self-condemnation* isn't just a cost function; it's a claim about rationality. Also, Davidson's point about acting against an *all-things-considered* judgment is subtle. It's not just that $t_1$ prefers A and $t_2$ prefers B. It's that at $t_2$, I judge A is best, but do B. Standard econ says if I do B, I must have preferred B. Philosophy says I can do B while judging A better. This breaks Revealed Preference.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's expertise and skepticism. Validate the overlap.
      *   **Part 1: The Translation:** Walk through Socrates, Aristotle, Davidson using econ terms.
      *   **Part 2: The Residue Report:** Three categories (Clean, Distorted, Inexpressible).
      *   **Part 3: The Verdict:** Answer the "fancier words" question directly.
      *   **Conclusion:** Final synthesis.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate Aristotle too much with Kahneman's System 1/2, though it's a useful heuristic. Aristotle's "particular premise" is key.
      *   *Correction:* Ensure Davidson's "all-things-considered judgment" is distinguished from a simple long-term preference. It's a judgment *at the time of action*.
      *   *Key Insight:* The biggest friction point is **Revealed Preference**. Behavioral econ relaxes this, but still struggles with the normative claim that the agent *should* have followed the long-term plan, not just that they failed to. Philosophy cares about the *authority* of the judgment.

  9.  **Final Polish:** Check tone. Respectful but rigorous. Avoid condescension toward either field. Ensure the "Residue Report" is sharp. (The prompt asks for "Residue Report" specifically).

  10. **Final Review against constraints:**
      *   Restate core problem in vocab? Yes.
      *   Residue report (clean, distorted, inexpressible)? Yes.
      *   Answer the "genuinely miss" vs "fancier words" question? Yes.

