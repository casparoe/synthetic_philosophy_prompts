answer: |-
  This is a friction point I know well. You view the human agent as a collection of time-indexed utility functions with inconsistent discount rates; the philosophers view the agent as a unified locus of responsibility struggling to maintain rational integrity.

  Here is the translation of the akrasia problem into your vocabulary, followed by the residue report you asked for.

  ### Part 1: The Translation (Philosophy $\to$ Behav Econ)

  **1. The Socratic Denial (Protagoras)**
  *   **Philosophy:** No one does evil willingly. If an agent chooses $B$ over $A$, and $A$ is objectively better, the agent must be ignorant of the true value of $A$. Akrasia is impossible; it is merely miscalculation.
  *   **Your Vocabulary:** **Rational Choice with Information Asymmetry.**
      The agent is a standard expected-utility maximizer. If $Action_B$ is chosen, then $E[U(B)] > E[U(A)]$ at time $t$. If the model predicts $A$ should have been chosen, the modeler has misspecified the utility function or the probability weights. There is no structural inconsistency, only parameter error. "Weakness of will" is just measurement error in the hedonic calculus.

  **2. The Aristotelian Account (Nicomachean Ethics)**
  *   **Philosophy:** Akrasia is possible. The agent holds a universal premise ("Sugar is bad for me") but fails to apply the particular premise ("This is sugar") due to the distortion of passion/appetite. The knowledge is present but "inactive."
  *   **Your Vocabulary:** **Dual-System Intertemporal Choice.**
      The agent has a **Cool System** (System 2) holding a long-term plan ($U_{long}$) and a **Hot System** (System 1) reacting to immediate stimuli ($U_{short}$). Akrasia occurs when the Hot System overrides the Cool System's execution protocol at the moment of choice ($t_0$). The "universal premise" is the committed policy rule; the "particular premise" is the local state variable. The failure is a **control cost** problem: the cost of inhibiting the impulse exceeds the expected value of adherence to the plan.

  **3. The Davidsonian Formulation ("How is Weakness of the Will Possible?")**
  *   **Philosophy:** The agent makes an *all-things-considered* judgment that $A$ is best, yet intentionally does $B$. This is not just changing one's mind; it is acting against one's own current normative judgment.
  *   **Your Vocabulary:** **Violation of the Principle of Continence (Meta-Preference Failure).**
      At time $t$, the agent ranks outcomes: $U(A) > U(B)$. This is the *all-things-considered* judgment. However, the choice function $C(\{A,B\})$ returns $B$.
      In standard theory, $C(\{A,B\}) = B \implies U(B) > U(A)$ (Revealed Preference). Davidsonian akrasia asserts that $C(\{A,B\}) = B$ *while maintaining* $U(A) > U(B)$. It is a decoupling of the **valuation function** from the **choice function** within the same time slice, not just across time slices.

  ***

  ### Part 2: The Residue Report

  Here is what survives the translation, what breaks, and what vanishes.

  #### 1. Translates Cleanly (The Overlap)
  *   **Time Inconsistency:** The core phenomenology of akrasia (planning to diet, eating the cake) is perfectly captured by hyperbolic discounting ($\beta$-$\delta$ models). The shift in preference ranking between $t_{plan}$ and $t_{act}$ is mathematically isomorphic to the philosophical description.
  *   **Intrapersonal Conflict:** The "multiple selves" framework (Thaler/Shefrin) maps well onto the Aristotelian conflict between reason and appetite. The "Planner" is the Cool System; the "Doer" is the Hot System.
  *   **Commitment Technology:** Odysseus tying himself to the mast is the exact functional equivalent of Aristotelian moral training or Davidsonian pre-commitment. Both fields agree: if you know you are time-inconsistent, restrict your future choice set.

  #### 2. Requires Distortion (The Friction)
  *   **Revealed Preference:** To model akrasia, you must relax the axiom of revealed preference. In econ, if I eat the cake, I *revealed* that I preferred the cake (all things considered). In philosophy, I can eat the cake and truthfully say, "I preferred not to." You have to model this as a **failure of execution** or a **preference reversal**, whereas the philosopher models it as a **failure of rationality**.
  *   **The "All-Things-Considered" Judgment:** In your models, preferences are usually atomic. In Davidson's account, there is a hierarchical structure: first-order desires (eat cake) vs. second-order volitions (want to not want cake). You model this as conflicting utility functions; philosophy models it as a single agent failing to integrate inputs into a coherent output.
  *   **Ignorance vs. Bias:** Socrates calls it ignorance; you call it bias. This seems semantic, but Socrates implies that with *true* knowledge, the action follows necessarily. Your models suggest that even with perfect information, $\beta < 1$ will still cause the reversal. You have to distort Socrates to make him sound like he's talking about present bias rather than epistemic failure.

  #### 3. Inexpressible (The Blind Spot)
  *   **Normative Authority:** This is the big one. Your models are descriptive. They predict *what I will do*. Philosophy is normative. It claims *what I ought to do*. When a philosopher says "this is irrational," they mean it violates a constitutive norm of agency, not just that it reduces lifetime utility. The "oughtness" of the judgment has no variable in your equations.
  *   **Moral Responsibility/Blame:** In your framework, if $\beta$ is low, the agent is essentially broken or constrained. We fix it with nudges. In philosophy, the agent is *blameworthy*. Akrasia is a vice. Your framework struggles to explain why we hold the agent responsible for a parameter ($\beta$) they didn't choose.
  *   **The Unity of the Agent:** You model the agent as a sequence of selves or competing systems. The philosopher insists there is only *one* self. The mystery of akrasia is how *one* thing can be at war with *itself*. If you say "it's System 1 vs. System 2," you dissolve the mystery by splitting the agent. The philosopher wants to know how the *whole* agent fails.

  ***

  ### Part 3: The Verdict

  **Are they wrestling with something your models miss, or is it just preference reversal with fancier words?**

  It is **70% preference reversal with fancier words, and 30% a genuine normative problem your models cannot touch.**

  **The 70% (Preference Reversal):**
  If your goal is **prediction and intervention**, the philosophers are indeed using fancier words. $\beta$-$\delta$ models predict the choice patterns of the akratic agent better than Aristotelian virtue ethics. If you want to stop someone from smoking, a commitment contract (econ) works better than contemplating the golden mean (philosophy). In terms of *mechanism*, "hot/cool systems" and "hyperbolic discounting" explain the *how* better than "appetite overriding reason."

  **The 30% (The Genuine Miss):**
  However, your models miss the **phenomenology of agency**.
  1.  **The Davidsonian Puzzle:** Standard behav econ explains why $Self_{t1}$ differs from $Self_{t2}$. It struggles to explain why $Self_{t2}$ acts against $Self_{t2}$'s *own* judgment. If at $t_{now}$ I judge $A > B$ but choose $B$, your model says I must have actually preferred $B$. The philosopher says: "No, I chose $B$ *against* my preference." This suggests the choice function is not merely maximizing a utility function, but is subject to a separate normative constraint that can be violated.
  2.  **Regret and Guilt:** In your models, regret is just a negative utility realization. In akrasia, regret is a signal of **rational disintegration**. The pain isn't just that the outcome was suboptimal; it's that the agent *betrayed themselves*. Your models treat the selves as competitors; the philosopher treats them as the same entity.
  3.  **The "Why" of Intervention:** When you design a commitment device, you are essentially treating the agent as a machine to be patched. The philosophical account treats the agent as a citizen of a rational community who must be *persuaded* or *educated*. This matters for policy. If akrasia is just a glitch, we nudge. If it's a failure of rational agency, we might need to foster autonomy.

  **Summary:**
  You are right that the *mechanics* of akrasia are captured by discount functions and dual-system theory. You are wrong that this exhausts the *concept*. The philosophers are not trying to predict the choice; they are trying to preserve the concept of the **unified agent** in the face of contradictory evidence.

  Your models explain the **behavior** of akrasia.
  Their models explain the **experience** of akrasia.

  If you only care about the behavior, you can ignore them. If you care about why the agent *feels* bound by a judgment they violate, your framework has no variable for that. That residue is not just fancy words; it's the difference between modeling a consumer and modeling a person.
