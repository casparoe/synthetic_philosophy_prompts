answer: |-
  Dear friend,

  It is completely understandable why you feel unsettled by this, because the resolution of Maxwell's demon via Landauer's principle sits right on the fault line between physics and philosophy, and it is very easy to come away with the impression that the second law has been demoted from a hard constraint on matter to a mere rule about bookkeeping. Your intuition that something feels slippery about the word information here is correct, because in popular science writing it is often used as a metaphor for human knowledge, whereas in statistical mechanics it refers to something much more concrete and physical. To answer your core question directly, the second law is not ultimately an epistemic limitation in the sense that it depends on human ignorance, and even if the demon had infinite memory and never erased anything, the second law would not fail for the total closed system. The confusion arises because we tend to think of the demon as an observer outside the system, but in a rigorous physical treatment, the demon is part of the thermodynamic system itself.

  When we say that information is physical, we do not mean that entropy is just a measure of what we happen to know about a system while the system itself remains unaffected. We mean that information must be instantiated in physical states. For the demon to sort the molecules, it must measure their speeds, and that measurement requires the demon to enter into a physical correlation with the molecules. If the demon has a memory register, that register must be made of atoms or fields, and setting that register to record a fast or slow molecule changes the physical state of the demon. In the scenario where the demon has infinite memory and never erases, the entropy of the gas does indeed decrease, but the entropy of the demon increases correspondingly because its memory states become increasingly correlated with the gas. The total entropy of the combined system, which includes both the gas and the demon's memory, does not decrease. The second law holds perfectly for the whole isolated box. The demon has not violated the law; it has simply shifted the entropy from the gas into its own internal configuration.

  The reason Landauer's principle is usually invoked is that we are typically interested in engines that operate in a cycle. For the demon to be a useful engine that continues to sort molecules indefinitely, it must eventually reset its memory to make room for new measurements. It is this resetting process, the erasure of the physical correlations stored in the memory, that necessarily dissipates heat into the environment. Landauer showed that this erasure is the physical step that pays the entropy debt. However, even without erasure, the law is safe because the accumulation of correlations in the demon's memory represents a growth in the physical entropy of the demon itself. The key insight is that the information is not abstract knowledge floating in a void; it is a physical structure of correlations between the demon and the gas. Therefore, the cost is not about what the demon knows in a conscious sense, but about the physical state required to maintain that correlation.

  This brings us to your worry about whether entropy is about the world or about our information about it. There is a long-standing debate in the foundations of physics between those who view entropy as an objective property of a system and those who view it as a measure of an observer's uncertainty. The resolution of Maxwell's demon actually strengthens the view that thermodynamics is about the physical world, precisely because it shows that manipulating information has unavoidable physical costs. If entropy were purely epistemic, merely reflecting human ignorance, then a demon with perfect knowledge could supposedly bypass the law without cost. But the physics says that having that knowledge requires a physical substrate, and changing or clearing that substrate requires energy dissipation. The slogan information is physical is meant to close the loophole that treats information as non-material. It asserts that you cannot have the logical state without the physical state, and the physical state obeys the laws of thermodynamics.

  So when you read that the entropy gets paid back when the records are erased, it is not saying that the law only applies because we are finite beings who need to clear our hard drives. It is saying that any physical system that acts as a memory device is subject to thermodynamic constraints. If you had a literally infinite memory, you would not violate the second law, but you would also not have a cyclic engine. You would simply have a system where entropy is constantly being transferred from the gas degrees of freedom to the memory degrees of freedom. The total disorder of the universe, defined over all relevant physical degrees of freedom, never decreases. The apparent epistemic flavor comes from the fact that we often describe the state of the demon using information theory language, like bits and bytes, but these are just descriptions of physical microstates. The law itself remains a statement about the behavior of physical systems, regardless of whether there is a conscious observer present to care about the information.

  Ultimately, the second law survives the demon not because of our limitations, but because the demon itself is made of stuff. The information it processes is embodied in the positions and momenta of its own particles, and those particles must obey the same statistical rules as the gas particles it is sorting. The switch in meaning you sense when authors talk about information is often a failure to distinguish between Shannon entropy, which is a mathematical measure of uncertainty, and thermodynamic entropy, which is a physical quantity related to energy dispersal. Landauer's principle is the bridge that proves these two are not just analogous but physically linked. You can think of it this way: the law is not about what we can know, but about the fact that knowing requires a physical trace, and maintaining or removing that trace has a thermodynamic price. The universe does not care if we know the state of the gas, but if any physical subsystem within the universe is correlated with the gas in a way that lowers the gas's entropy, that subsystem must pay for it in its own entropy budget.

  I hope this helps clarify that the physics remains robust even when the language sounds abstract. The second law is not a rule about human ignorance, but a rule about the cost of physical correlations. Even an infinite demon cannot break it, because the demon is part of the physical world it is trying to manipulate, and the entropy simply moves from the gas to the demon rather than disappearing. The law stands as a constraint on the world itself, not just on our description of it.

  Best regards,

  Your friend in physics
