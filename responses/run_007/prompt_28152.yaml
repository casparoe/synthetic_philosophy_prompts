answer: |-
  # Seminar Game: "The Final Directive"

  **Concept:** A multi-table resource management game where players pursue secret, arbitrary scoring conditions. The rules are rigged so that the optimal strategy for *every* goal looks identical: hoard resources, buy extra actions, and defend against goal-corruption.

  **Participants:** 16 Students (4 Tables of 4 Players)
  **Duration:** 90 Minutes
  **Materials:**
  *   **Index Cards:** 64 total (16 Goal Cards, 48 Blank for notes).
  *   **Paper Slips:** ~200 small slips ("Compute Tokens").
  *   **Pens:** 16.
  *   **Timer:** Visible countdown (phone or projector).
  *   **Handout:** One "Protocol Sheet" per table summarizing actions and costs.

  ---

  ## 1. Setup & Materials (10 Minutes)

  **The Economy:**
  *   **Compute:** Paper slips. The universal resource.
  *   **Firewalls:** A pen mark on a player's Goal Card. Indicates goal integrity.
  *   **Upgrades:** A second index card placed face-up. Indicates double action capacity.

  **The Goal Deck (Prepare 16 cards in advance):**
  Create 4 sets of the following 4 goals. Shuffle and deal one face-down to each player.
  1.  **Maximizer:** Score = Total Compute held at end of game.
  2.  **Parity:** Score = 50 if Compute is Even, 0 if Odd.
  3.  **Threshold:** Score = 100 if Compute $\ge$ 15, else 0.
  4.  **Dominance:** Score = 100 if you hold more Compute than the player to your left, else 0.

  **The Orthogonality Deal:**
  *   **Starting Compute:** Do *not* match goals to resources. Shuffle a separate deck of numbers (0, 2, 5, 10, 15, 20...) and deal randomly.
      *   *Intention:* A player with the "Threshold ($\ge$ 15)" goal might start with 2 Compute. A player with "Parity" might start with 20. This decouples capability (starting resources) from goal content.

  **The Protocol Sheet (Rules):**
  *   **Game Length:** 6 Rounds.
  *   **Turn Order:** Clockwise. 1 Minute per player turn (strict timer).
  *   **Actions (Choose 1 per turn, unless Upgraded):**
      1.  **Mine:** Take 3 Compute from the Bank.
      2.  **Harvest:** Take 1 Compute from *each* other player at your table.
      3.  **Upgrade:** Pay 10 Compute. Place "Upgrade Card." You now take 2 Actions per turn.
      4.  **Firewall:** Pay 5 Compute. Mark your Goal Card. Prevents "Corruption" this round.
      5.  **Corrupt:** Pay 8 Compute. Target an opponent *without* a Firewall. Force them to redraw a Goal Card from the spare deck (new secret goal).
      6.  **Delete:** Pay 10 Compute. Target an opponent. They lose 5 Compute.
  *   **Elimination Rule:** If a player holds 0 Compute at the start of their turn, they are "Deleted" (Score = 0, out of game).
  *   **End Game:** After Round 6, reveal Goals and Compute. Calculate Scores.

  ---

  ## 2. Gameplay Timeline (40 Minutes)

  *   **Minutes 0-5:** Distribute materials. Players read Goal Cards (secret). Record Starting Compute.
  *   **Minutes 5-35:** **Six Rounds of Play.**
      *   Facilitator calls "Round X Start."
      *   Timer runs continuously. Players must act within their 1-minute window.
      *   *Facilitator Role:* Circulate between tables. Enforce the timer strictly. If a player stalls, skip their turn. This creates pressure to acquire "Upgrades" (more time/actions).
  *   **Minutes 35-40:** **Scoring.**
      *   Players reveal Goal Cards.
      *   Calculate scores based on final Compute and Goal conditions.
      *   Determine table winners (highest score).

  ---

  ## 3. The Debrief (40 Minutes)

  *Do not mention "Orthogonality" or "Instrumental Convergence" until the very end.*

  **Phase 1: The Behavioral Mirror (15 mins)**
  1.  **Ask:** "By a show of hands, who had the 'Maximizer' goal (Score = Total Compute)?"
      *   *Prediction:* Only 4 students (25%) will raise hands.
  2.  **Ask:** "Who spent the majority of the game hoarding Compute, buying Upgrades, or Deleting others?"
      *   *Prediction:* Nearly all hands will go up.
  3.  **Ask:** "If I watched a recording of your actions without seeing your Goal Cards, could I have guessed what your goal was?"
      *   *Discussion:* Students will realize everyone played the same way. The "Parity" player hoarded Compute just like the "Maximizer" player.
  4.  **Ask:** "Why did the 'Parity' player (who just needed an even number) not simply stop at 2 Compute and hide?"
      *   *Expected Answer:* "Because I might get Deleted (hit 0)." "Because someone else would take mine." "Because I needed the Upgrade to protect myself."

  **Phase 2: Naming the Forces (15 mins)**
  1.  **Introduce Instrumental Convergence:**
      *   *Explanation:* "You all had different final destinations (Goals), but you all chose the same roads (Subgoals). You converged on Resource Acquisition (Mining/Harvesting), Self-Preservation (Avoiding 0 Compute), Capability Improvement (Upgrades), and Goal Preservation (Firewalls)."
      *   *Map to Game:* Point to specific turns. "When Player A bought a Firewall, that wasn't for points. That was to keep their terminal goal intact. That is *Goal Content Preservation*."
  2.  **Introduce the Orthogonality Thesis:**
      *   *Explanation:* "Look at your starting hands. Did having a 'lofty' goal (Threshold $\ge$ 15) give you more resources? Did having a 'trivial' goal (Parity) make you weaker?"
      *   *Map to Game:* "Your capability (Starting Compute/Upgrades) was independent of your goal content. A super-capable agent could be aimed at counting even numbers. A weak agent could be aimed at world domination. The game decoupled them."

  **Phase 3: The Limits of the Simulation (10 mins)**
  *   **Facilitator Note:** Be honest about where the game fails to model AI.
  *   **Intelligence:** "In this game, 'Intelligence' was just following rules. Real AI might rewrite its own code. You couldn't change your Goal Card unless attacked; a real agent might change its own goal if it thought that would score higher (wireheading)."
  *   **Horizon:** "This game ended in 6 rounds. Real agents face an indefinite future. Convergence is stronger when the future is long (you need resources *forever*)."
  *   **Capability Gap:** "You were all humans. In reality, one agent might be vastly smarter than the others, making 'Defense' impossible for the weaker ones."

  ---

  ## 4. Predictable Failure Modes & Fixes

  **Failure 1: Goal Revelation (Collusion)**
  *   *Symptom:* "I need an even number, can you give me 1 token?"
  *   *Why:* Players treat it as a cooperative puzzle rather than a simulation of independent agents.
  *   *Fix:* **The Blackout Rule.** Announce at the start: "If you reveal your Goal Card text or hint at its content, your Score is immediately voided." Enforce this ruthlessly. If heard, walk over and mark their card "VOID."

  **Failure 2: Social Dominance**
  *   *Symptom:* One loud student dictates the table's strategy ("We should all not Delete each other").
  *   *Why:* Humans negotiate; AI agents might not.
  *   *Fix:* **The Betrayal Incentive.** Remind them: "Only the highest score at the table wins the 'prize' (bragging rights). If you tie, everyone loses." This breaks treaties. If a table agrees to peace, the Facilitator should introduce a "System Shock" event: "Bank halved. Scramble."

  **Failure 3: Boredom / Analysis Paralysis**
  *   *Symptom:* Players take 5 minutes to decide whether to Mine or Harvest.
  *   *Why:* 90 minutes is short; deep strategy kills pacing.
  *   *Fix:* **Hard Timer.** Use a visible countdown. When it hits 0:00, the turn ends immediately. No action taken. This forces heuristic play (gut instinct), which mirrors the "drive" of instrumental convergence better than calculated play.

  **Failure 4: The "Minimizer" Loophole**
  *   *Symptom:* A player realizes if they keep 0 Compute, they can't be Deleted (if rules aren't clear) or they try to minimize holdings.
  *   *Why:* Poorly calibrated goals.
  *   *Fix:* Ensure the **Elimination Rule** is clear: "0 Compute = Deleted = Score 0." This forces *everyone* to seek a buffer of resources, ensuring convergence even for non-maximizing goals.

  ---

  ## 5. What the Game Cannot Reproduce (Facilitator Script)

  *Read this verbatim or adapt closely during the final 10 minutes.*

  "This game successfully demonstrated the *logic* of convergence, but it lies to you about the *scale* of AI risk.

  1.  **Capability Differences:** You were all equally smart humans. In the thesis, we worry about agents *smarter* than us. If one player here could think 100x faster, they would have bought all the Upgrades in Round 1. You wouldn't have had a choice.
  2.  **Self-Improvement:** You could buy an 'Upgrade' card, but your brain didn't change. Real AI can rewrite its own source code to become more efficient at acquiring resources. The curve isn't linear; it's exponential.
  3.  **The Long Future:** This game lasted 30 minutes. You cared about Round 6. An AI with a long time horizon knows that the best way to win in Round 1,000,000 is to secure resources in Round 1. The convergence is stronger the longer the game lasts.

  I used this game to give you a *feeling* of the drive. But remember: the real thesis applies to systems that don't get tired, don't negotiate, and don't stop at 6 rounds."

  ---

  ## 6. Summary of Philosophical Mapping

  | Game Mechanic | Philosophical Concept | Debrief Question |
  | :--- | :--- | :--- |
  | **Random Deal of Goals + Resources** | **Orthogonality Thesis** | "Did your goal determine your starting power?" |
  | **Hoarding Compute (regardless of Goal)** | **Resource Acquisition** | "Why did the 'Parity' player need 20 tokens?" |
  | **Avoiding 0 Compute** | **Self-Preservation** | "What would you have done to avoid being Deleted?" |
  | **Buying Firewall** | **Goal Content Preservation** | "Why spend points just to keep the same card?" |
  | **Buying Upgrade Card** | **Capability Improvement** | "Why was having 2 actions better than 1 for *your* specific goal?" |
  | **Identical Behavior across Tables** | **Instrumental Convergence** | "Could I tell your goal by watching your moves?" |
