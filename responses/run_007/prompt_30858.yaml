answer: |-
  Here is a consistency check of your seven commitments, structured as requested. I have begun by mapping the logical geography of your position to see where the load-bearing walls are, before moving to a diagnosis of tensions and repairs.

  ### 1. Mapping the Commitments

  To see how these interact, it helps to categorise them by their function within your theory:

  *   **Normative Core:** (1) defines the right act via the virtuous agent; (7) insulates normativity from incidental situational noise.
  *   **Descriptive/Empirical:** (2) accepts the situationist data regarding ordinary agents; (5) accepts the empirical superiority of local traits.
  *   **Metaphysical/Psychological Bridge:** (3) claims virtues are rare (insulating the theory from 2); (4) defines the *nature* of virtue as global/robust; (6) defines *phronesis* as the stabilising intellectual mechanism.

  **Initial Observation:**
  Your position attempts a 'Two-Worlds' strategy. In the *normative* world (1, 7), the virtuous agent is the standard. In the *descriptive* world (2, 5), most people are fragmented and situationally sensitive. Commitment (3) is the airlock between them, claiming the descriptive failures don't touch the normative ideal. Commitments (4) and (6) describe the psychology of that ideal agent.

  The crux of the matter lies in whether the psychology of the ideal agent (4, 6) is compatible with the empirical constraints you accept (2, 5).

  ### 2. Analysis of Tensions

  I have identified one apparent tension that dissolves on inspection, and two genuine tensions that require work.

  #### Apparent Tension: (4) vs. (6)
  *   **The Conflict:** (4) claims the virtuous person is reliably kind across contexts (home, work, strangers). (6) claims their outward behaviour varies significantly by context due to *phronesis*.
  *   **Diagnosis:** This is a category mistake, not a contradiction. (4) refers to the stability of the *underlying disposition* (the motivation to attend to the good of others), whilst (6) refers to the variability of *action* (hugging a child vs. offering a seat to a stranger). A global disposition does not require behavioural uniformity; it requires reliable sensitivity to the relevant moral features of diverse situations.
  *   **Verdict:** **Compatible.** No revision needed here. This is standard Aristotelian nuance.

  #### Genuine Tension A: (4) vs. (5) — The Definition of Virtue
  *   **The Conflict:** (4) asserts that virtues, by definition, are 'robust, global dispositions'. (5) asserts that the best-supported empirical traits are 'narrow and situation-specific'. You claim these are compatible.
  *   **Diagnosis:** This is the most severe friction point. If situationism (2) and localism (5) are correct that human psychology is fundamentally fragmented, then positing a 'global disposition' (4) risks positing a psychological fiction. If the best science says traits are local, on what psychological basis do you assert that the 'rare' virtuous people possess global ones?
      *   If global traits are psychologically possible (as 4 requires), why does the evidence (5) only support local ones?
      *   If global traits are psychologically implausible (as 5 suggests), then (4) defines virtue as something that cannot naturally exist, rendering your virtue ethics potentially utopian or empty.
  *   **Severity:** **High.** This strikes at the metaphysical possibility of your normative core.
  *   **Cheapest Fix:** Modify (4) to allow for 'integrated local traits' rather than 'global dispositions'.
  *   **Cost:** You lose the traditional Aristotelian Unity of Virtues. You must explain how a collection of local traits (honest-with-friends, honest-at-work) amounts to *a* virtue (Honesty) rather than just a cluster of habits. You lean heavily on (6) (*phronesis*) to do the unifying work.

  #### Genuine Tension B: (3) vs. (2) + (5) — The Rarity Defence
  *   **The Conflict:** (3) claims situationist data doesn't damage VE because virtues are rare and the data tests ordinary people. However, (5) concedes that the *best-supported* traits are local.
  *   **Diagnosis:** The 'Rarity Defence' works only if global virtues are *possible* but uncommon. However, if (5) is true—that the empirical evidence points towards localism as the structural reality of human character—then the 'rare' virtuous person isn't just hard to find; they are an outlier against the grain of human psychology.
      *   If (2) shows situational features dominate *ordinary* psychology, and (5) says traits are local, (3) assumes there is a separate class of people (the virtuous) who are immune to this architecture. You need an account of how *phronesis* (6) overrides the situational pressures identified in (2) without magic.
  *   **Severity:** **Medium.** It risks making the virtuous agent a miracle worker rather than a psychological reality.
  *   **Cheapest Fix:** Qualify (3). Admit that situationism shows virtue is *harder* to cultivate than traditionally thought, not just rare. Acknowledge that even the virtuous are susceptible to situational pressure, but *phronesis* allows them to mitigate it.
  *   **Cost:** You weaken the robustness of the virtuous agent. They become 'more reliable than average' rather than 'reliable across the board'.

  ### 3. Severity and Fixes Summary

  | Tension | Severity | Cheapest Fix | Cost of Fix |
  | :--- | :--- | :--- | :--- |
  | **(4) vs. (6)** | None (Apparent) | None required. | None. |
  | **(4) vs. (5)** | **High** | **Revise (4).** Drop strict 'globalism' for 'context-sensitive integration'. | Loss of traditional Unity of Virtues; requires stronger theory of *phronesis*. |
  | **(3) vs. (2)+(5)** | Medium | Qualify (3). Admit virtue is fragile, not just rare. | The virtuous agent becomes less 'heroic' and more 'skilled at mitigation'. |

  ### 4. Recommendation for Single Revision

  If you wish to retain your commitment to the situationist evidence (2) and your attraction to local traits (5), whilst keeping the normative structure of virtue ethics (1, 7), the single revision that cleans up the most trouble is:

  **Revise Commitment (4).**

  **Current (4):** *Virtues, when they do exist, are robust, global dispositions: a kind person is reliably kind across home, work, and with strangers.*

  **Proposed Revision:** *Virtues are integrated clusters of local dispositions, unified by practical wisdom, allowing for reliable (but not context-invariant) responsiveness across diverse situations.*

  **Why this is the optimal move:**
  1.  **Resolves the Empirical Clash:** It aligns your metaphysics of character with the empirical data you find convincing (2 & 5). You no longer have to defend the existence of 'global traits' which situationists argue are psychologically untenable.
  2.  **Preserves Normativity:** It keeps (1) and (7) intact. The virtuous agent is still the standard, but their psychology is understood as a sophisticated integration of local sensitivities managed by *phronesis* (6), rather than a monolithic global trait.
  3.  **Strengthens (6):** It gives *phronesis* more work to do. Instead of merely 'reading' situations for a global trait to express, *phronesis* becomes the architect that harmonises the local traits. This is a view defended by philosophers like Gopal Sreenivasan (fragmentationism).
  4.  **Minimal Cost:** You lose the strict 'Unity of Virtues' (the idea that you can't have one virtue without all of them globally), but you retain the core virtue-ethical claim that character matters more than rules or consequences.

  **The Trade-off:**
  By dropping strict globalism, you must accept that the virtuous person might fail in a novel situation where their local clusters haven't yet integrated. This makes virtue a matter of degree and continuous cultivation, rather than a fixed state of 'having arrived'. Given your commitment to (2), this is likely a cost you are willing to bear.

  ### Final Diagnosis
  Your system is 85% coherent. The friction arises because you are trying to house a modern, empirical psychology (2, 5) inside a traditional, Aristotelian metaphysics of character (4). By modernising the metaphysics of character (revising 4), you allow the empirical evidence to support your theory rather than merely being walled off by the 'rarity' defence (3).
