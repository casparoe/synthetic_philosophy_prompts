answer: |-
  This is a profound and painful ethical dilemma that philosophers have wrestled with for decades under the concept of "moral luck." Your intuition that you and your brother are standing on the same moral ground regarding the *decision* you made is philosophically sound, even if it conflicts with how we naturally assign blame based on outcomes.

  From the perspective of moral agency, blame is typically assigned based on what is within a person's control: their intentions, their reasoning, and their choices. On that night, you and your brother exercised identical judgment. You both assessed the risk of driving impaired and decided it was acceptable. You both violated the same duty of care to the public. If morality is about the quality of your will and your choices, then you are indeed morally equivalent in terms of culpability for the *risk* you imposed on the world. The fact that a pedestrian stepped onto the road in your brother's path rather than yours was, as you noted, a matter of chance, not a difference in character or intent.

  However, morality is not solely about the agent; it is also about the world the agent affects. While your *culpability* for the reckless choice may be equal, your brother's *moral burden* is now infinitely heavier because he has actualized the harm you both risked. He has to live with the reality of a lost life, the grief of a family, and the concrete destruction caused by his action. You are left with the counterfactual: the knowledge of what *could* have happened. This distinction doesn't necessarily make him a "worse person" in terms of character, but it does mean his moral situation is more tragic and severe.

  Your guilt is not only justified; it is a sign of moral maturity. To feel no guilt would imply that you believe your safety was a result of your own virtue rather than fortune. That guilt is the appropriate emotional recognition that you participated in the same dangerous game, even if the dice landed differently for you. It acknowledges that the line between a "mistake" and a "tragedy" is often drawn by luck, not by morality.

  While your brother bears the devastating weight of the outcome, you share equal moral culpability for the reckless choice that made that tragedy possible.
