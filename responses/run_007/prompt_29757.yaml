prompt: |-
  So something happened a few months ago and I've been turning it over in my head ever since. My older brother and I were at a wedding—open bar, everyone drinking way too much, you know how these things go. We both drove home seperately, both definitely over the limit. He took the highway, I took the back roads. He hit and killed a pedestrian who was crossing in the dark. I got home fine and didn't even realize anything was wrong till his phone call at 2am.

  He's now facing vehicular manslaughter charges, lost his job, our parents can barely look at him, his marriage is crumbling. And the thing is—I can't stop thinking that I did exactly the same thing he did. I made the same terrible decision, took the same reckless risk, showed the same disregard for whoever might be out there. The only difference between us is that there happened to be a person in his path and not in mine. That's just... luck. A coin flip I didn't even know I was flipping.

  I don't know how to think about this. On the one hand, he killed someone and I didn't, and that seems like it should matter enormously—to the law, to how our family treats him, maybe even to how we judge him morally as a person. On the other hand, I keep coming back to the thought that morally speaking, we're standing on the same ground. We both did something awful in terms of the choice we made. I just got lucky.

  I'm not really asking about the legal side—I understand the law cares about outcomes and there are decent pragmatic reasons for that. I'm asking about the moral dimension. Does my brother deserve more moral blame than I do? Is his action morally worse than mine, or are they morally equivalent? And am I right to feel this strange, gnawing guilt about it, or am I overthinking something that's actually straightforward?

  I'd like you to end with a one-sentence summary of your view, as the last line.
