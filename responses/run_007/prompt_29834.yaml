  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in animal ethics and the moral status of invertebrates.
      *   **Task:** Reconstruct the theory of moral status presupposed by actual pest-control practices (regulatory, municipal, agricultural, organic).
