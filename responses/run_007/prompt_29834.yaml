answer: |-
  As a philosopher specializing in the moral status of invertebrates, I approach this reconstruction by first isolating the implicit normative commitments in the practices you describe. To diagnose the underlying theory, we must distinguish between *moral considerability* (whether an entity counts morally at all) and *moral significance* (how much weight its interests carry). Below, I lay out the candidate positions that could explain these practices before committing to the most robust reconstruction.

  ### Candidate Positions

  1.  **Moral Nihilism regarding Insects:** This view holds that insects possess no moral status whatsoever. They are morally equivalent to rocks or viruses.
      *   *Fit:* Explains why target insect death is treated as efficacy.
      *   *Mismatch:* Fails to explain why bees and "beneficials" are protected. If insects had *no* status, there would be no need to model risks to bees unless they were purely property; however, regulatory language often treats them as environmental proxies, suggesting a derivative status.

  2.  **Lexical Prioritization (Trivial Status):** Insects have moral status, but their interests are lexically inferior to human and vertebrate interests. Any human benefit, however trivial, outweighs any insect harm, however severe.
      *   *Fit:* Explains mosquito control (human comfort/health > mosquito life).
      *   *Mismatch:* Fails to explain Integrated Pest Management (IPM). In IPM, "beneficial" insects are preserved even when killing them might increase short-term crop yield. If insect status were always trivial, economic efficiency would dictate killing all non-vertebrates indiscriminately. The fact that we spare predators suggests their status is not *always* outweighed by profit, only by health/safety.

  3.  **Taxonomic Chauvinism (Vertebratism):** Moral status tracks phylogenetic proximity to humans.
      *   *Fit:* Explains toxicity testing on birds/mammals/fish.
      *   *Mismatch:* Fails to explain the specific protection of bees (invertebrates) alongside the extermination of other invertebrates. The distinction is not phylum-based, but function-based.

  4.  **Functional/Relational Moral Status:** Moral considerability attaches not to the individual's intrinsic capacities (like sentience) but to the individual's relationship to human systems (economic, ecological, or medical).
      *   *Fit:* Explains all four patterns. Bees are protected as "agricultural livestock/ecosystem services"; pests are killed as "threats to capital/health"; organic rules protect "human purity" rather than insect welfare.

  ### Reconstruction of the Presupposed Theory

  The pattern of practices you describe presupposes a theory of **Aggregated Anthropocentric Instrumentalism**.

  On this view, insects generally lack *intrinsic* moral considerability. They are not moral patients in their own right. However, they possess *derivative* moral significance based on their functional role in human-centered systems. This theory relies on three distinct normative commitments:

  1.  **The Efficacy/Welfare Dichotomy:** For "pests," death is a metric of success; for vertebrates (and bees), death is a metric of collateral damage. This implies that the moral community is bounded by vertebrates and managed invertebrates (bees), while unmanaged invertebrates are excluded from the sphere of direct concern.
  2.  **Relational Value over Intrinsic Value:** The distinction between "pest" and "beneficial" in IPM demonstrates that moral protection is contingent on diet and economic utility. Two phenotypically identical beetles have different moral fates based entirely on whether they consume crops or consume crop-consumers. This rules out the idea that moral status supervenes on biological properties (like neural complexity) and asserts instead that it supervenes on economic function.
  3.  **Agent-Centric Purity (The Organic Exception):** The preference for natural insecticides reveals a deontological constraint on *human action* rather than a consequentialist concern for *insect outcome*. The moral wrong is not "killing an insect," but "tampering with nature synthetically." This privileges human virtue (being 'natural') over insect welfare (avoiding pain/death).

  ### Consistency and Ruled-Out Views

  Are these commitments mutually consistent? **Internally, yes; Philosophically, no.**
  They are consistent within a framework of **resource management**. If the goal is optimizing human welfare and ecological stability for human use, protecting pollinators while exterminating vectors is rational. However, they are inconsistent with any coherent ethical system regarding the *insects themselves*.

  *   **Ruled Out:** **Strict Sentientism.** If the capacity to suffer were the criterion, the source of the insecticide (natural vs. synthetic) would be irrelevant, and the "pest/beneficial" distinction would not justify killing one while saving the other if their capacity for suffering were equal.
  *   **Ruled Out:** **Biocentrism.** If life itself were the value, the deliberate extermination of pest populations would be morally prohibitive regardless of their diet.
  *   **Underdetermined:** **Moral Nihilism.** The system acts *as if* insects are nihilistic entities, but the protection of bees suggests they are not *entirely* without status. It is more accurate to say their status is **conditional**. The system leaves open the empirical question of insect sentience because the answer is deemed ethically irrelevant.

  ### The Sentientist Counterfactual

  If we shifted to a regulatory and ethical framework where an insect's capacity to suffer counts directly (a Sentientist or Painist framework), the changes would be structural, not merely procedural:

  1.  **Regulation (Registration):** Toxicity data would require measures of **distress and pain**, not just mortality (LD50). An insecticide that causes prolonged paralysis or nociceptive suffering before death would be restricted, even if it were "natural." Efficacy could not be defined solely by kill rate; it would require a "welfare cost" calculation.
  2.  **Mosquito Control:** Programs would need to justify the **aggregate suffering** inflicted on the mosquito population against the disease risk to humans. This might ban broad-spectrum spraying in favor of targeted methods (e.g., sterile male release, genetic modification) that reduce population without inflicting painful death on individuals, or require proof that the specific vector control is the *least harmful means* to the public health end.
  3.  **Organic Certification:** The "natural" loophole would close. Pyrethrins and spinosad would be scrutinized for their welfare impact on non-target insects just as harshly as neonicotinoids. Certification might require "humane killing" standards or prioritize prevention (exclusion) over extermination, acknowledging that killing a pest naturally is still a moral cost.
  4.  **IPM Thresholds:** The "Economic Injury Level" would be replaced or augmented by an **"Ethical Injury Threshold."** Action would only be permitted when the harm prevented (crop loss/disease) is proportionate to the moral weight of the insects killed, requiring a valuation of insect suffering independent of their diet.

  Summary: Current pest-control practices presuppose a system of Aggregated Anthropocentric Instrumentalism where insects possess only derivative moral status contingent on their economic or ecological utility to humans, thereby ruling out sentientist and biocentric ethics in favor of a functionalist framework that prioritizes human virtue and safety over invertebrate welfare.
