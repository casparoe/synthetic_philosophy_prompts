answer: |-
  Consent is valid because the deception and pressure are rationally inert with respect to B's decisive reasons for agreeing.

  In a corporate setting, Manager A asks Employee B to work a mandatory overtime shift on a holiday. A tells B, "The VIP client specifically insisted on your team for this deadline" (a lie; the client does not care, but A wants to flatter B), which B believes. A adds, "If you don't take this, I'll have to work it myself and miss my daughter's graduation," creating significant emotional pressure that B genuinely feels. B agrees to the shift primarily because the holiday rate offers triple pay, which B needs to cover a personal debt, regardless of the client's preference or the manager's schedule. B is sober, rested, and fully understands the hours and compensation involved.

  The lie concerns the client's preference, which is not material because materiality is determined by whether a fact affects the consenting party's primary reasons for agreement; since B consents for the money, the client's identity is irrelevant to the transaction's core terms. The pressure is an appeal to guilt rather than a coercive threat because A is describing a personal consequence of the situation rather than threatening to violate B's rights or make B worse off than their baseline entitlement; B retains the acceptable alternative of refusing, suffering only guilt rather than professional retaliation. B's competence is intact as there is no evidence of impairment or inability to understand the agreement's nature. The single feature doing the most work is rational inertness: the lie and pressure do not hijack the specific reasoning process B uses to authorize the act. If this feature were removed—for instance, if A lied about the triple pay rate—the consent would become invalid because the deception would then directly manipulate B's decisive reason for agreeing. A defender of the simple view would argue that any lie violates autonomy by contaminating the decision-making environment, regardless of content. The response is that autonomy requires informed choice on material facts, not omniscience; a lie about collateral details leaves the agent's self-governance over the essential terms intact.
