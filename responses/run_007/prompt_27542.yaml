prompt: |-
  I'm trying to make sense of a paragraph from a cognitive science textbook (the chapter on AI and common sense), and I keep going back and forth on wether it's actually right. Here's the paragraph:

  "The frame problem is the problem of keeping a robot's beliefs up to date. Suppose the robot has a big store of facts and then pushes a block across a table; it needs to work out which of its beliefs changed and which didn't. The classic solution is to add frame axioms, which state what doesn't change when an action occurs — for example, pushing the block doesn't change the color of the wall. But you'd need a frame axiom for every action-fact pair, so the approach blows up. Fodor turned this into a philosophical problem: the real difficulty is knowing which facts are relevant to what you're doing, and he argued that no computational system could ever solve it, since relevance can depend on anything the system knows. This is why classical symbolic AI hit a dead end and researchers moved to connectionist networks instead."

  Something about the last two sentences feels like it's sliding from a real technical problem to a much stronger claim, but I don't know enough to say where the slide happens. Can you go through it and tell me which parts a philosopher of mind or an AI researcher would accept, which they'd wince at, and what's just wrong? In particular, I want to know whether the problem of writing frame axioms and the problem of relevance are actually the same problem, and whether it's fair to say the frame problem is what killed classical AI and motivated the turn to connectionism. Dont just tell me the conclusion is overreaching — I want to see exactly where the summary conflates two things or overstates a modest point.
