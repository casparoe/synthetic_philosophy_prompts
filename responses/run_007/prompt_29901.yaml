  3.  **Drafting the Menu (Categorization):**
      *   I need to create a matrix or a list of variations based on the strength of the conceivability notion and the strength of the possibility notion.
      *   *Dimensions of Conceivability:*
          *   Prima Facie (seems possible on first thought) vs. Ideal (after rigorous reflection).
          *   Positive (constructing a scenario) vs. Negative (no contradiction found).
      *   *Dimensions of Possibility:*
          *   Epistemic (compatible with what we know).
          *   Logical (no contradiction in terms).
          *   Metaphysical (ways the world could have been).
          *   Physical/Nomological (consistent with laws of nature).

  4.  **Developing the Specific Readings (The "Menu Items"):**

      *   *Reading 1: The Trivial/Epistemic Reading.*
          *   Conceivability = "I can't see a contradiction right now."
          *   Possibility = Epistemic possibility.
          *   Verdict: True but useless for metaphysics. Doesn't refute physicalism (physicalism is compatible with epistemic gaps).

      *   *Reading 2: The Logical Possibility Reading.*
          *   Conceivability = Ideal negative conceivability.
          *   Possibility = Logical consistency.
          *   Verdict: Plausible link, but logical possibility doesn't refute physicalism. Physicalism is a claim about *metaphysical* necessitation, not just logical consistency. (Kripke point).

      *   *Reading 3: The Strong Metaphysical Reading (Chalmers' Target).*
          *   Conceivability = Ideal Positive Conceivability.
          *   Possibility = Metaphysical Possibility.
          *   Verdict: Substantive, controversial, likely false (or begs the question). This is the one needed to kill physicalism.

      *   *Reading 4: The "Rationalist" Reading.*
          *   Conceivability = Clear and Distinct Perception (Cartesian).
          *   Possibility = Metaphysical.
          *   Verdict: Defensible in some contexts (math), dubious for empirical identities (water=H2O).

  5.  **Evaluating the Inference to "Physicalism is False":**
      *   Physicalism usually claims: The physical facts *metaphysically necessitate* the mental facts.
      *   To refute this, you need to show: It is *metaphysically possible* for physical facts to hold without mental facts.
      *   Therefore, only a reading that links Conceivability to *Metaphysical Possibility* works.
