answer: |-
  Here is a specification sheet for an adequate theory of the units of selection. This is designed to bypass the standard "Team Gene vs. Team Group" trench warfare and focus on the structural and metaphysical work the theory needs to perform.

  ### The Desiderata

  #### 1. The Replicator/Interactor Separation
  **Requirement:** The theory must rigorously distinguish between the entity that is copied (replicator) and the entity that interacts with the environment to generate those copies (interactor/vehicle). It must not allow fitness to be assigned to a replicator without specifying the interactor through which it acts.
  **Rationale:** Conflating these leads to category errors. Genes are replicators; organisms are interactors. If a theory says "organisms replicate," it is biologically false (organisms die; genes persist). If it says "genes interact with the environment directly," it ignores physiology. A theory that conflates them cannot explain why selection sometimes favors the replicator *at the expense* of the interactor (e.g., meiotic drive).
  **Status:** **Non-negotiable.**
  **Confidence:** **High.** (This is the Dawkins/Hull contribution; ignoring it returns us to pre-1970s vagueness.)

  #### 2. Causal Efficacy vs. Mathematical Partition (The Price Constraint)
  **Requirement:** The theory must explicitly state whether it is making a claim about *causal ontology* (groups actually cause evolutionary change) or *mathematical bookkeeping* (variance can be partitioned into group terms). It must acknowledge that consistency with the Price Equation is necessary but not sufficient for causal claims.
  **Rationale:** The Price Equation is a tautology; it partitions variance exhaustively. You can always find a "group term" mathematically. That does not mean groups are causal agents. A theory that treats a mathematical partition as proof of causal reality commits the "reification of the statistic" fallacy. Conversely, a theory that claims only genes are causal must explain why the group term in the Price equation often predicts evolutionary trajectories better than the gene term.
  **Status:** **Non-negotiable.**
  **Confidence:** **High.** (This is where 80% of the literature fails.)

  #### 3. The "By-Product" Test for Group Traits
  **Requirement:** The theory must provide a criterion for distinguishing a genuine group-level adaptation from an aggregate of individual adaptations (a by-product). It must specify when a group trait is *emergent* (irreducible to individual traits) versus *aggregative*.
  **Rationale:** This addresses the "redescription worry." If a group survives because its members are selfishly avoiding predators, that is individual selection. If a group survives because members altruistically sacrifice themselves, that is potentially group selection. A theory must define the threshold where the causal locus shifts from the member to the collective.
  **Status:** **Non-negotiable.**
  **Confidence:** **High.** (Without this, "group selection" becomes a label for anything involving more than one organism.)

  #### 4. The Major Transitions Stability Condition
  **Requirement:** The theory must explain the *suppression* of lower-level selection during the formation of higher-level individuals (e.g., why somatic cells don't evolve cancer, why chromosomes don't undergo meiotic drive). It cannot simply assume higher-level individuality; it must explain how it is enforced.
  **Rationale:** This is the empirical hard case. Multicellularity exists despite the fact that cell-level selection (cancer) is always possible. A theory that says "selection is always at the gene level" struggles to explain why genes conspire to suppress their own replication in somatic lines. A theory that says "group selection is common" struggles to explain why cheating doesn't destroy the group immediately.
  **Status:** **Non-negotiable.**
  **Confidence:** **High.** (This is the core puzzle of biological complexity.)

  #### 5. The Beneficiary Question (Adaptation *For* Whom?)
  **Requirement:** The theory must identify the *beneficiary* of adaptation separately from the *unit of selection*. It must answer: "When we see a complex trait, whose interest does it serve?"
  **Rationale:** Selection is a process; adaptation is the outcome. The unit of selection is the entity whose frequency changes. The beneficiary is the entity for whom the trait is *designed* (teleonomically). These can come apart (e.g., sterile workers). A theory that conflates the unit of selection with the beneficiary cannot explain sterility or altruism.
  **Status:** **Non-negotiable.**
  **Confidence:** **High.** (Williams' central point.)

  #### 6. Empirical Universality (Cancer, Culture, Species)
  **Requirement:** The theory must be applicable to non-standard cases without ad-hoc modification. Specifically: somatic evolution (cancer), cultural evolution (memes), and species selection (macroevolution).
  **Rationale:** If a theory works for altruism but breaks for cancer (within-organism selection) or breaks for species selection (paleontology), it is likely a theory of *social behavior*, not a theory of *units of selection*.
  **Status:** **Camp Preference.** (Strict biological genic selectionists may reject culture; strict MLS proponents may reject species selection. But for a *general* theory, this is required.)
  **Confidence:** **Medium.** (This is the one I am **least sure** about. It is possible that biological selection and cultural selection are disanalogous enough that a single theory is a category error.)

  #### 7. Ontological Monism vs. Pluralism
  **Requirement:** The theory must declare whether there is *One True Unit* (Monism) or whether the unit is context-dependent (Pluralism). It cannot claim both.
  **Rationale:** You cannot say "The gene is the fundamental unit" and also "The unit shifts depending on the context." One of these is a claim about reality, the other is a claim about description.
  **Status:** **Camp Preference.** (Genic selectionists demand Monism; MLS proponents often accept Pluralism.)
  **Confidence:** **High.** (Logical consistency demand.)

  ---

  ### The Incompatibilities (The "Impossible Trinity")

  There is a subset of these desiderata that I suspect cannot be jointly satisfied without significant philosophical gymnastics.

  **The Conflict:** **Desideratum 1 (Replicator/Interactor Split)** + **Desideratum 4 (Major Transitions)** + **Desideratum 7 (Ontological Monism).**

  *   **Why:** If you insist on **Monism** (there is only one fundamental unit, usually the gene), you struggle to explain **Major Transitions** (why lower-level units stop competing) without implying the higher level is an illusion. But if you admit the higher level is real (to satisfy Major Transitions), you violate **Monism**.
  *   **The Replicator Problem:** In a Major Transition (e.g., eusociality), the *interactor* becomes the colony, but the *replicator* often remains the gene. If you demand the unit of selection be the *replicator* (Desideratum 1), the colony can never be a unit of selection. If you demand the unit be the *interactor* (to account for colony-level adaptation), you break the link between replication and selection.
  *   **Verdict:** You likely have to sacrifice **Ontological Monism**. A theory that insists there is only *one* unit of selection will fail to adequately explain the stability of Major Transitions without resorting to "it's all really genes" reductionism that ignores the emergent causal powers of the higher level.

  ---

  ### The "Killer" Requirement

  **Which single requirement rules out the most popular positions?**

  **Desideratum 2: Causal Efficacy vs. Mathematical Partition.**

  *   **Why:** This requirement devastates the "Price Equation Wars."
      *   It rules out **Hard Genic Selectionists** who claim the Price Equation proves genes are the *only* causal agents (the equation is a partition, not a causal model; the group term exists mathematically even if genes are fundamental).
      *   It rules out **Hard MLS Proponents** who claim the existence of a group term in the Price Equation proves groups are causal agents (again, it's just math; you need independent causal evidence).
      *   It forces both sides to admit that the math is neutral and the debate is about *ontology*, not algebra. Most popular positions rely on the math doing the ontological heavy lifting for them.

  ---

  ### Quick Scorecard

  | Framework | Replicator/Interactor Distinction | Causal vs. Bookkeeping | Major Transitions (Stability) | Beneficiary Clarity | Overall Fit |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Genic Selectionism** (Dawkins/Williams) | **Pass.** (Clear distinction.) | **Fail.** (Often treats math as ontology.) | **Struggle.** (Explains suppression via "extended phenotype" but often dismissive of higher-level reality.) | **Pass.** (Gene is beneficiary.) | **High Conceptual Clarity, Low Explanatory Power for Transitions.** |
  | **MLS1** (Group affects individual fitness) | **Mixed.** (Focuses on individuals in groups.) | **Fail.** (Often conflates variance partition with group causation.) | **Pass.** (Good at modeling cheating/suppression.) | **Mixed.** (Beneficiary is usually individual.) | **Good for Social Evolution, Weak on Ontology.** |
  | **MLS2** (Group fitness/differential extinction) | **Fail.** (Often conflates group replicator/interactor.) | **Mixed.** (Claims causal reality, hard to verify.) | **Pass.** (Directly addresses group survival.) | **Pass.** (Group is beneficiary.) | **Empirically Rare, Theoretically Robust for Transitions.** |
  | **Replicator/Interactor** (Hull/Cziko) | **Pass.** (This is their definition.) | **Pass.** (Separates process from entity.) | **Mixed.** (Abstract, sometimes lacks empirical bite.) | **Pass.** (Clear separation.) | **Best Philosophical Framework, Needs Empirical Flesh.** |

  ---

  ### Where the Literature Talks Past Itself

  **The Definition of "Unit."**
  When a Genic Selectionist says "Unit of Selection," they usually mean **"Unit of Replication"** (Who gets copied?). When an MLS proponent says "Unit of Selection," they usually mean **"Unit of Interaction"** (Who faces the sieve?).
  *   **Result:** They agree on the data (bees are sterile) but disagree on the label because they are answering different questions from Desideratum 1 and 5.
  *   **Fix:** Stop using the phrase "Unit of Selection." Use "Unit of Replication," "Unit of Interaction," and "Beneficiary of Adaptation" as separate terms.

  **The Definition of "Fitness."**
  *   **Propensity vs. Outcome:** Some theories treat fitness as a causal propensity (probability of reproduction), others as actual offspring count.
  *   **Result:** In small populations (drift), these diverge. A theory using "actual offspring" will see selection where a theory using "propensity" sees noise. This muddies the "Causal Efficacy" requirement.

  ### Final Note on Confidence

  I am **least sure** about **Desideratum 6 (Empirical Universality)**.
  There is a genuine possibility that "selection" in biological systems (chemical replication) and cultural systems (imitation) are sufficiently disanalogous that demanding a single theory cover both is a mistake akin to demanding a single theory for fluid dynamics and traffic flow just because both use differential equations. If you drop this requirement, Genic Selectionism becomes much more robust within its biological domain. However, keeping it is the only way to test the *generality* of the Darwinian algorithm.
