prompt: |-
  I'm about to read a load of stuff on the units of selection debate and I want to go in with a proper spec rather than the usual genic-vs-group framing. Before I read any more of it, write me the desiderata: what would an adequate theory of the units of selection actually have to get right? Give the case or consideration behind each one, and be clear about which are non-negotiable and which are just preferences of one camp.

  Make sure the list grapples with at least these, but don't let it become a list of textbook talking points:

  - the distinction between replicators and vehicles/interactors, and why a theory can't get away with conflating them
  - what a group-level trait actually is, and when you're entitled to say group selection is doing causal work rather than just redescribing individual or genic selection (the by-product worry)
  - the empirical cases people actually fight over: altruism and eusociality, sex ratio evolution, meiotic drive and transposable elements, cancer as a within-organism selection process, species selection in the fossil record, cultural evolution
  - whether the theory has to be consistent with the Price equation, and what "consistent with" even means there (its a partition, not an empirical claim, right?)
  - the major transitions problem: why selection at a lower level doesn't just undermine higher-level individuality (cheating in multicellular bodies, uniparental inheritance, germline sequestration)
  - whether a theory of units of selection is answering a causal question, a bookkeeping question, or a "who are the beneficiaries of adaptation" question, and whether one theory has to answer all three

  For each desideratum, say whether it's non-negotiable or a camp preference, and flag any pairs you suspect can't be jointly satisfied. If some subset of them is jointly unsatisfiable, say so explicitly, that's the bit I most want. Then tell me which single requirement does the most to rule out the most popular positions. I don't need a full scorecard, but a quick sense of how genic selectionism, multilevel selection (MLS1 and MLS2), and the replicator/interactor framework fare against the list would help.

  Also: for each requirement, say how confident you are that it's genuinely a requirement and not just a prejudice of one side, and single out the one you're least sure about. And if there's a place where the literature is just talking past itself, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Units of Selection Debate.
      *   **Goal:** Create a list of *desiderata* (requirements/criteria) for an adequate theory *before* reading the literature.
      *   **Specific Constraints:**
          *   Avoid standard "genic vs. group" framing.
          *   Grapple with specific topics: Replicator/Vehicle distinction, Group-level traits vs. by-products, Empirical cases (altruism, cancer, etc.), Price Equation consistency, Major Transitions (cheating, etc.), Causal vs. Bookkeeping vs. Beneficiary questions.
          *   Label each desideratum as "Non-negotiable" or "Camp Preference."
          *   Flag conflicts/incompatibilities between desiderata (especially jointly unsatisfiable subsets).
          *   Identify the single requirement that rules out the most popular positions.
          *   Provide a quick scorecard for Genic Selectionism, MLS1/2, and Replicator/Interactor.
          *   Assign confidence levels to each desideratum (is it a requirement or prejudice?).
          *   Identify the least sure requirement.
          *   Identify where literature talks past itself.
      *   **Tone:** Philosophical, rigorous, critical, not textbook-ish.

  2.  **Deconstruct the Core Tensions:**
      *   The units of selection debate is notoriously messy because people ask different questions using the same words.
      *   *Question 1:* What is the *replicator*? (Who gets copied?)
      *   *Question 2:* What is the *interactor*? (Who interacts with the environment?)
      *   *Question 3:* What is the *beneficiary*? (Who is the adaptation *for*?)
      *   *Question 4:* What is the *mathematical partition*? (How do we slice the variance?)
      *   The prompt asks to clarify these distinctions as desiderata.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Replicator/Interactor Distinction.*
          *   Why: Dawkins vs. Hull. Genes replicate, organisms interact. Conflating them leads to category errors (e.g., saying organisms evolve because they replicate).
          *   Status: Non-negotiable for conceptual clarity.
          *   Confidence: High.

      *   *Desideratum 2: Causal Efficacy vs. Bookkeeping.*
          *   Why: Price Equation partitions variance. Does a group term mean groups *cause* evolution or just that we can mathematically attribute variance to them? The "by-product worry."
          *   Status: Non-negotiable (must distinguish math from ontology).
          *   Confidence: High.

      *   *Desideratum 3: The "Who is the Adaptation For?" Question.*
          *   Why: Williams' adaptationism. If a trait evolves, whose interest does it serve?
          *   Status: Non-negotiable (this is the point of adaptationist explanations).
          *   Confidence: High.

      *   *Desideratum 4: Major Transitions/Suppression of Lower-Level Selection.*
          *   Why: Why don't cells cancerize? Why does meiosis exist? A theory must explain how higher levels stabilize.
          *   Status: Non-negotiable (empirical reality).
          *   Confidence: High.

      *   *Desideratum 5: Empirical Scope (Cancer, Culture, etc.).*
          *   Why: A theory shouldn't break when applied to somatic evolution or memes.
          *   Status: Preference (some theories focus only on biological genes). *Correction:* If it claims to be a *general* theory of selection, it must handle these. Let's make it a requirement for a *general* theory.
          *   Confidence: Medium-High.

      *   *Desideratum 6: Price Equation Consistency.*
          *   Why: It's the fundamental theorem of selection. But "consistent" is tricky.
          *   Status: Non-negotiable (math must hold), but interpretation is preference.
          *   Confidence: High.

  4.  **Identifying Conflicts/Incompatibilities:**
      *   *The Big Conflict:* Causal Realism vs. Mathematical Equivalence.
      *   If you say "Genic Selection is the only *causal* truth" (Williams/Dawkins), you might struggle with the *reality* of group-level causation in Major Transitions without calling it "genic selection acting on groups."
      *   If you say "MLS is real causation," Genic Selectionists say "It's just bookkeeping."
      *   *Jointly Unsatisfiable:* "Selection is fundamentally *only* at the level of the replicator" AND "Higher-level entities can be genuine Darwinian individuals with their own fitness independent of lower-level summation." (Though some argue they can be reconciled, philosophically they pull in opposite directions regarding ontology).
      *   *Actually, the deeper conflict:* **Causal Monism vs. Explanatory Pluralism.** You can't demand a *single* fundamental unit (Monism) while also demanding the theory explain Major Transitions where the unit *shifts* (Pluralism/Transition).
      *   *Refinement:* The conflict is between "The theory must identify the *One True Unit*" vs. "The theory must account for context-dependent units (like cancer vs. organism)."

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most popular positions?
      *   *Candidate:* The distinction between Causal Question vs. Bookkeeping Question.
      *   *Why:* Genic Selectionism often conflates the two (Price partition = causal reality). MLS often conflates them (Group term in Price = Group Causation).
      *   *Better Candidate:* **The Major Transitions Requirement (Stability of Higher Levels).**
      *   *Why:* Strict Genic Selectionism struggles to explain *why* lower-level selection stops without ad-hoc constraints. Strict Group Selectionism struggles to explain *how* it starts without magic.
      *   *Best Candidate:* **Distinguishing "Beneficiary" from "Replicator".** Many theories fail here.
      *   *Let's go with:* **The Causal vs. Bookkeeping Distinction.** It exposes that many debates are verbal.

  6.  **Scoring the Frameworks:**
      *   *Genic:* Good on Replicator, bad on Major Transitions (often dismissive), good on Price (mathematically).
      *   *MLS1:* Good on Individual/Group variance, bad on defining the "Group" ontologically.
      *   *MLS2:* Good on Group fitness, bad on empirical frequency (rare).
      *   *Replicator/Interactor:* Good on concepts, bad on empirical specifics (sometimes too abstract).

  7.  **Addressing "Talking Past Each Other":**
      *   The definition of "Selection." Is it the *process* (differential reproduction) or the *outcome* (adaptation)?
      *   The definition of "Fitness." Propensity vs. Actual offspring.

  8.  **Refining the Output Structure:**
      *   Introduction: Set the stage (avoiding the trap).
      *   The Desiderata List (numbered, with Status, Confidence, Rationale).
      *   The Incompatibilities (The "Impossible Trinity").
      *   The "Killer" Requirement.
      *   The Scorecard.
      *   The "Talking Past" Section.
      *   Least Sure Requirement.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Price Equation nuance? Yes, need to emphasize it's a partition, not a model.
      *   *Check:* Did I address Cancer/Meiotic Drive? Yes, under Empirical Scope/Major Transitions.
      *   *Check:* Is the tone right? Needs to be sharp, not deferential to authority.
      *   *Check:* Confidence levels. Be honest. Some "requirements" might just be my own philosophical bias (e.g., realism about groups). I need to flag that.
      *   *Specific constraint:* "Flag any pairs you suspect can't be jointly satisfied." I need to make sure this is explicit.
      *   *Specific constraint:* "Single out the one you're least sure about."

  10. **Final Polish:** Ensure the distinction between MLS1 (group affects individual fitness) and MLS2 (group fitness) is clear in the scorecard. Ensure the Replicator/Vehicle distinction (Dawkins/Hull) is central.

  *(Self-Correction on "Jointly Unsatisfiable"):*
  Is there a logical contradiction?
  Maybe: "Selection must be defined by a single fundamental unit" AND "Selection operates effectively at multiple distinct ontological levels simultaneously."
  If you insist on *Fundamentalism* (Genic), you deny the reality of the other levels. If you insist on *Pluralism*, you deny the Fundamentalism.
  So, a theory cannot satisfy "Ontological Monism" and "Empirical Pluralism" simultaneously without redefining one. I will frame this as the tension between *Fundamentalism* and *Emergence*.

  *(Refining the "Killer" Requirement):*
  The requirement to distinguish **Causal Process** from **Explanatory Beneficiary**.
  Genic selectionism says the gene is the beneficiary.
  MLS says the group can be.
  But if you don't separate the math (Price) from the cause, you fail.
  Actually, the prompt asks: "which single requirement does the most to rule out the most popular positions?"
  The requirement that **"The theory must explain the suppression of lower-level selection during major transitions without invoking group-selection-as-magic."**
  This hits hard Genic (why suppress?) and hard Group (how suppress?).
  Let's stick with the **Causal vs. Bookkeeping** distinction. It rules out the "Price Equation proves Group Selection" crowd AND the "Price Equation proves Genic Selection is the only truth" crowd. It forces nuance.

  *(Confidence Check):*
  Least sure: The requirement that a theory *must* handle Cultural Evolution. Biological selection theories might not need to cover memes to be valid for biology. I'll flag this.

  *(Talking Past):*
  The definition of "Unit." Is it the unit of *replication*, *interaction*, or *adaptation*? This is the root of the confusion.

