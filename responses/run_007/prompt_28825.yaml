prompt: |-
  I've got a mate who runs a weekly poker game, and he's offered me a standing side bet. Each Friday I can stake any fraction of whatever I've currently got set aside for this (and any winnings just get added to that pot) on a single toss of a biased coin. The coin comes up heads 60% of the time, and if it's heads I get my stake back plus £1.50 for every £1 I put in; if it's tails I loose my stake. Each individual toss is clearly good in expectation. One friend says I should bet as much as I can every week, since the expected value is positive and over the long run it'll average out. Another friend says that's mad: a bad run of tails will eventually wipe me out if I bet too heavily, so the only sensible policy is to bet nothing at all. I'm fairly sure both of them are missing something, but I can't put my finger on it. On top of that, I'm only taking my mate's word that the coin is 60% heads — I've seen maybe twenty flips, so it could easily be a bit less. What's the right way to think about how much to stake each week, and is there a principled answer rather than just a hunch?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Scenario:** A weekly poker game side bet.
      *   **Mechanism:** Biased coin toss.
      *   **Probabilities (stated):** $P(\text{Heads}) = 0.6$, $P(\text{Tails}) = 0.4$.
      *   **Payoff:** Win = Stake $\times$ 1.5 (plus stake back), Loss = Stake lost.
      *   **Constraint:** Can stake any fraction of current bankroll. Reinvesting winnings allowed (compounding).
      *   **Friends' Advice:**
          *   Friend A: Bet everything (Maximize Expected Value).
          *   Friend B: Bet nothing (Risk of ruin).
      *   **User's Intuition:** Both are wrong.
      *   **Uncertainty:** The probability $p=0.6$ is based on the host's word and a small sample (20 flips).
      *   **Goal:** Determine the optimal staking strategy (fraction to bet) and account for parameter uncertainty.

  2.  **Deconstruct the Math (The "Known" Case):**
      *   Let $f$ be the fraction of bankroll bet.
      *   Let $W$ be the win multiplier (odds). Here, for every £1, you win £1.50. So $b = 1.5$.
      *   Let $p$ be the probability of winning. Here $p = 0.6$.
      *   Let $q = 1-p$ be the probability of losing. Here $q = 0.4$.

      *   *Friend A's Logic (Expected Value):*
          *   $EV = p(b) - q(1) = 0.6(1.5) - 0.4(1) = 0.9 - 0.4 = 0.5$.
          *   Positive EV. If you bet £1, you expect to get £1.50 back.
          *   If you bet *everything* ($f=1$) every time:
              *   Sequence: H, H, H... -> Wealth grows exponentially.
              *   Sequence: T (anywhere) -> Wealth = 0.
              *   Since $q > 0$, probability of eventual ruin approaches 1 as $N \to \infty$.
              *   *Conclusion:* Friend A is mathematically correct about *arithmetic* mean return but ignores geometric reality (volatility drag/ruin).

      *   *Friend B's Logic (Risk Aversion):*
          *   Betting nothing guarantees survival but zero growth.
          *   Since $EV > 0$, betting nothing is suboptimal for growth.

      *   *The "Missing" Concept: The Kelly Criterion.*
          *   The Kelly Criterion maximizes the *geometric* growth rate of the bankroll (logarithmic utility).
          *   Formula: $f^* = \frac{bp - q}{b}$ or $f^* = p - \frac{q}{b}$.
          *   Calculation:
              *   $p = 0.6$
              *   $q = 0.4$
              *   $b = 1.5$
              *   $f^* = 0.6 - \frac{0.4}{1.5} = 0.6 - 0.2666... = 0.3333...$
          *   *Result:* Bet 1/3 of the bankroll.

  3.  **Address the Uncertainty (The "Unknown" Case):**
      *   The user says: "I'm only taking my mate's word... seen maybe twenty flips."
      *   This introduces *parameter uncertainty*. The true $p$ might not be 0.6.
      *   If $p < 0.4$ (since $b=1.5$, break-even is $p = 1/(1+1.5) = 1/2.5 = 0.4$), the bet has negative EV.
      *   With only 20 flips observed, the confidence interval is wide.
      *   *Bayesian Approach:* We need to treat $p$ as a distribution, not a fixed number.
      *   If there's a non-negligible chance that $p < 0.4$, a full Kelly bet based on $p=0.6$ is dangerous.
      *   *Fractional Kelly:* Standard advice when parameters are uncertain or estimates are noisy is to bet a fraction of the Kelly amount (e.g., Half-Kelly). This reduces variance significantly while retaining most of the growth, and provides a buffer against overestimating the edge.

  4.  **Synthesize the Advice Structure:**

      *   **Introduction:** Validate the user's intuition. Both friends are wrong. Friend A ignores ruin; Friend B ignores opportunity.
      *   **The Mathematical Solution (Kelly Criterion):**
          *   Explain *why* betting everything fails (volatility drag/ruin).
          *   Introduce the Kelly Criterion formula.
          *   Plug in the numbers ($p=0.6, b=1.5$).
          *   Result: 33.3%.
      *   **The "Real World" Adjustment (Uncertainty):**
          *   Address the "mate's word" and "20 flips" issue.
          *   Explain that overestimating the edge is the fastest way to go broke.
          *   Introduce "Fractional Kelly" (e.g., Half-Kelly).
          *   Why? It accounts for the fact that the coin might be less biased than claimed.
      *   **Psychological/Practical Factors:**
          *   Utility of money. Is this "fun money" or "rent money"?
          *   Diminishing marginal utility.
      *   **Conclusion/Summary:**
          *   Don't bet everything.
          *   Don't bet nothing.
          *   Calculate Kelly (33%).
          *   Discount for uncertainty (bet ~15-17%).

  5.  **Refining the content (Self-Correction/Detail Check):**
      *   *Check the odds:* "£1.50 for every £1". This is decimal odds of 2.5 or fractional odds of 3/2. In Kelly formula $f = (bp-q)/b$, $b$ is the net odds received. If I bet 1 and win, I get 1.5 profit. So $b=1.5$. Correct.
      *   *Check the break-even:* If $p=0.4$, $EV = 0.4(1.5) - 0.6(1) = 0.6 - 0.6 = 0$. So if true $p < 0.4$, it's a loser.
      *   *Sample size:* 20 flips is tiny. If the host is lying or the coin is 55/45, the edge vanishes.
      *   *Tone:* Informative, analytical, slightly cautious (gambling context).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Section 1: The Trap of "All-In".* Explain that while Arithmetic Mean (EV) is positive, Geometric Mean (CAGR) is negative if you bet too much. Use the "Gambler's Ruin" concept. If you bet 100%, one tails wipes you out. Even if you bet 90%, a string of losses shrinks the bankroll so much that a win doesn't recover it.
      *   *Section 2: The Kelly Criterion.* This is the principled answer.
          *   Formula: $f = p - (q/b)$.
          *   Calculation: $0.6 - (0.4/1.5) = 1/3$.
          *   Explain what this does: Maximizes long-term compound growth.
      *   *Section 3: The Uncertainty Problem.* The user mentioned the sample size.
          *   If the friend says 60%, but it's actually 50% (fair coin), Kelly says bet 0.
          *   If it's 55%, Kelly says bet small.
          *   Because we aren't sure, we must act *as if* the edge is smaller than stated to avoid ruin from over-betting.
          *   Suggest **Half-Kelly**. It reduces volatility by 50% but keeps 75% of the growth rate. It's a safety margin against lying friends or small sample sizes.
      *   *Section 4: Utility.* Money isn't linear. Losing £100 hurts more than winning £100 feels good for most people. This reinforces betting less than full Kelly.

  7.  **Final Polish:** Ensure the distinction between "profit" (£1.50) and "return" (£2.50) is clear in the math. The prompt says "get my stake back plus £1.50", so $b=1.5$.

      *   *Calculation check:*
          *   $p = 0.6$
          *   $q = 0.4$
          *   $b = 1.5$
          *   Kelly $f = \frac{1.5(0.6) - 0.4}{1.5} = \frac{0.9 - 0.4}{1.5} = \frac{0.5}{1.5} = 1/3$.
