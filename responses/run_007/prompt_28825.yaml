  8.  **Output Generation:** (Proceed to generate response based on these steps.)

      *   *Self-Correction during drafting:* Make sure to mention that if the probability is actually lower than 40%, the bet is negative EV, and the correct move is indeed Friend B's advice (bet nothing). This highlights the importance of the uncertainty aspect.

