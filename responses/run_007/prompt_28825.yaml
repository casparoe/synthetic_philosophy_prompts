answer: |-
  Your intuition is spot on: both of your friends are missing a fundamental concept in probability and money management. Friend A is ignoring the risk of ruin, while Friend B is ignoring the power of positive expected value (EV).

  The principled answer to your question is the **Kelly Criterion**. This formula determines the exact fraction of your bankroll you should wager to maximize the long-term geometric growth rate of your wealth.

  ### 1. Why Your Friends Are Wrong

  *   **Friend A (The "All-In" Fallacy):** While betting 100% of your bankroll maximizes the *expected value* of a single toss, it guarantees bankruptcy. Because the coin is only 60% likely to win, a string of tails is inevitable. Once you hit a single loss at 100% stake, your bankroll is zero. In betting, the "average" return is irrelevant if you run out of money before the average kicks in.
  *   **Friend B (The "No-Bet" Fallacy):** Since the bet has a positive expected value (£0.50 profit per £1 wagered), betting nothing is a waste of a statistical advantage. Over time, a small, managed bet will grow your pot significantly.

  ### 2. The Mathematical Solution: Kelly Criterion

  To calculate the optimal stake, we use the Kelly formula:
  $$f^* = \frac{bp - q}{b}$$

  *   **$p$ (Probability of winning):** 0.60
  *   **$q$ (Probability of losing):** 0.40
  *   **$b$ (Net odds received):** 1.5 (You win £1.50 for every £1 staked)

  Plugging in the numbers:
  $$f^* = \frac{(1.5 \times 0.6) - 0.4}{1.5} = \frac{0.9 - 0.4}{1.5} = \frac{0.5}{1.5} = \mathbf{33.3\%}$$

  Mathematically, if you are certain the coin is 60/40, you should bet exactly **one-third** of your current bankroll every week.

  ### 3. The "Real World" Adjustment: Uncertainty

  You noted that you are taking your mate’s word and have only seen 20 flips. This is the most dangerous part of the bet. 

  The "break-even" point for this bet is a 40% win rate ($1 / 2.5 = 0.4$). If the coin is actually 50/50 (fair) or 45/55, your edge disappears. Because overestimating your edge is the fastest way to go broke, the standard professional advice is to use **Fractional Kelly**.

  **Recommendation: Bet 15% to 17% of your bankroll (Half-Kelly).**
  Betting half of the Kelly amount reduces your volatility by 50% while still capturing 75% of the potential growth. This "margin of safety" protects you if your mate is exaggerating the coin's bias or if the coin's behavior changes.

  ### Summary Strategy
  1.  **Don't bet everything:** You will eventually hit a losing streak that wipes you out.
  2.  **Don't bet nothing:** You are missing a proven statistical advantage.
  3.  **The "Principled" Stake:** Bet **15% to 17%** of your current pot each week.
  4.  **Reinvest:** Always calculate your stake based on your *current* total (winnings included). This is how you achieve exponential growth.

  **Final Warning:** If you suspect the coin might be fair (50/50) or if your mate has a history of dishonesty, the Kelly formula will yield a negative number. In that case, your friend who says "bet nothing" is correct. Only play if you are confident the win rate is above 40%.
