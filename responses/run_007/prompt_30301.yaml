      *   **Occasion:** Wedding toast/speech.
      *   **Length:** About 4-5 minutes spoken (roughly 600-750 words at a normal speaking pace).
      *   **Core Theme:** Bernard Williams' "One Thought Too Many" (the drowning wife/stranger case). The idea that love shouldn't need external justification; the impulse to act/love should be immediate and intrinsic, not reasoned out.
      *   **Audience:** 50% philosophy friends (will recognize the reference), 50% family (won't know the theory, need to stay engaged/entertained).
      *   **Tone:** Warm, funny, best-man speech style (not a lecture).
      *   **Constraint:** No headings, bullet points, bold, or tables. Continuous prose like a letter/script.
      *   **Specific Instruction:** The idea should shape the speech in the background. Don't list reasons he loves her. Don't frame marriage as a rational decision. Don't make it empty ("he just loves her"). Use the "too many thoughts" running joke.

  2.  **Deconstruct the Philosophical Reference:**
      *   *Source:* Bernard Williams, "Persons, Character and Morality" (1981).
      *   *Scenario:* A man can save either his wife or a stranger from drowning. He saves his wife.
      *   *The Point:* If he justifies saving his wife by saying "it's permissible to save my wife" or "she's my wife," he has had "one thought too many." The justification should be implicit in the relationship itself. He should save her *because she is his wife*, not because a moral rule says he can.
      *   *Application to Wedding:* Love isn't a pro/con list. Marriage isn't a rational contract analysis. It's an immediate recognition of value.

  3.  **Drafting Strategy:**
