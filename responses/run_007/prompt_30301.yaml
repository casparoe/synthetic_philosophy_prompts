      *   **The Hook (The Joke):** Introduce the "too many thoughts" running joke early but lightly. Connect it to the brother's personality (overthinking).
      *   **The Philosophical Core (Subtle):** Tell the story simply without naming drops that alienate the family. Make it sound like a story about *him*, not a theory. Explain the lesson: love doesn't need a resume.
