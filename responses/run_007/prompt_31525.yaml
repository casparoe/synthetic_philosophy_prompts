  Hey, I have been thinking about that restaurant puzzle you described, and it is actually a classic example of an information cascade, so you are right to look for the underlying rule she is using. Based on the verdicts you listed, she is almost certainly running a rational signal-counting rule rather than just following the crowd blindly. The key insight from her decision in case five, where she ignored the second person because they were just copying, is that she cares about the number of independent signals rather than the number of heads nodding yes. In the standard model of these cascades, you reconstruct the history of private signals based on the public actions, and then add your own signal to that count to see which side has more weight. If we apply that consistent logic to the case you are stuck on, where three people picked A but you know the third person actually had a B signal, the math points to a specific answer. The first person picked A, so they must have had an A signal. The second person picked A, and since your friend established in case one that a tie between one A and one B signal leads to following the private signal, the second person would have picked B if they had a B signal, so they must have had an A signal. The third person picked A, but you know their signal was B, so that counts as a B signal. Your signal is also B. That gives you two A signals and two B signals, which is a tie. Since her rule in case one shows that she breaks ties by following her own private signal, she should say you should pick B.

  There are really only two serious candidate rules she could be running that fit the first five cases, and they diverge on this sixth case. The first is the rational Bayesian rule I just described, where you sum all known and inferred signals and break ties with your private information, which predicts you should pick B. The second is a cascade lock-in rule, where once a cascade has started, meaning enough public actions have accumulated to outweigh any single private signal, you stop counting subsequent signals even if you know them, effectively treating the public history as having overwhelmed any new information. If she is running the lock-in rule, she would say you should pick A because the cascade started with the second person and your knowledge of the third person's signal shouldn't break the momentum of the public actions. My best guess is that the first rule is really hers because her decision in case five showed she is willing to discount public actions when she knows they lack information, so it would be inconsistent for her to suddenly treat the third person's action as informative when she knows it contradicts their signal. She seems too careful about information content to fall for the lock-in trap.

  To settle this definitively, you should propose a case where the known signals overwhelmingly outweigh the public actions. You could ask her what to do if ten people ahead picked A, but you happen to know that the last nine of them all had B signals and were just following the first person, and your own signal is B. Under the rational signal-counting rule, there is only one A signal and ten B signals, so she should say pick B. Under the cascade lock-in rule, she would see ten people choosing A and say pick A. This stretches the scenario enough that if she is truly counting signals, the weight of the nine known B signals should flip her decision despite the long line of A choices, whereas if she is just sensitive to the visual of a crowd, she will stick with A. I think if you run that by her, her answer will tell you exactly how deep her rationality goes.
