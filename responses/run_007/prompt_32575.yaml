  ok so i've been reading about hard choices and incommensurable values for this philosophy club thing and i'm trying to figure out if my views actually make sense together. here's where i'm at:

  (1) some choices are genuinely hard not because we're missing information but because the values involved can't be put on a single scale—like choosing between a career in music and one in medicine, they're just different kinds of good

  (2) when someone actually makes a hard choice like that, the fact that they picked one over the other does reveal something about what they care about more—otherwise the choice would've been basically arbitrary

  (3) you can feel real regret after a hard choice without thinking you made the wrong choice, and that kind of regret makes sense and isn't just irrational

  (4) if values are genuinely incommensurable then the whole idea of maximizing expected utility or ranking options by a single score doesn't apply to those cases

  (5) but hard choices still aren't arbitrary—people make them for reasons, and some ways of making them are better than others

  are these five consistent? i feel like (2) and (4) might be pulling against each other but i'm not sure if they actually contradict or if i'm just confused about what incommensurability means. also (5) seems like it wants something that (4) says i can't have. can you go through these and tell me which pairs are actually in tension, how bad the tension is, and what the cheapest fix would be for each? i dont want to just give up on any of them unless i have to.
