  hey — I'm a PhD student in philosophy of science and I'm TA-ing for this upper-level undergrad seminar on probability. The prof wants me to draft the final exam essay question on the reference class problem, and honestly I want to write something that actually tests whether they get it, not just whether they can summarize the reading.

