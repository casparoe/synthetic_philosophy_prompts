      *   **3. Unsaturatedness (Frege/Russell):** Relations are incomplete entities.
          *   *Pros:* Explains unity via the nature of the relation itself.
          *   *Cons:* Notoriously difficult to make sense of ontologically. What is an "unsaturated" entity? It often leads to category mistakes or linguistic confusion projected onto ontology.
          *   *Verdict:* Low promising. Conceptually murky.

      *   **4. Facts/States of Affairs as Basic (Armstrong, Wittgenstein's Tractatus):** Don't analyze facts into constituents; take them as primitive.
          *   *Pros:* Stops the regress before it starts. Aligns well with truthmaker theory. Very popular in contemporary analytic metaphysics (e.g., Armstrong).
          *   *Cons:* Commits to a specific ontology (facts) that some find bloated. But generally considered a robust solution.
          *   *Verdict:* Very high promising. Currently one of the dominant views.

      *   **5. Relational Tropes (Particularised Relations):** Relations are particulars, not universals.
          *   *Pros:* Avoids the universal-particular problem that often fuels the regress. The relation is inherently tied to its relata.
