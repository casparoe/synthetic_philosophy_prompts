prompt: |-
  so my wife and i just went through IVF and we had to choose which embryo to implant, and ive been spiraling about origin essentialism ever since. here's where i think i've landed, and i want to know if it hangs together:

  (1) kripke is basically right that you couldnt have come from a different sperm and egg — that's essential to your origin
  (2) but i also think that if my parents had conceived a month later and had a different kid, that kid still could have been me in some meaningful sense, because the "me" that matters for personal identity is psychological, not biological
  (3) i think the embryo we didnt implant is a different person than the one we did, and that matters morally — like we didnt just delay a person, we picked which person exists
  (4) but i also dont think picking between embryos is remotely like killing anyone, and i'd do it again
  (5) i think the non-identity problem in population ethics is basically right and applies here

  which of these are in tension? i feel like (1) and (2) might be fighting each other but i cant articulate why. also (3) and (4) seem like they might need more work to hold together. rank the tensions and tell me what the cheapest fix is.
