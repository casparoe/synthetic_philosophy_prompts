      *   However, if (3) says "that matters morally," does it imply a loss? NIP (5) says you can't harm the non-existent.
      *   Actually, (3) + (5) *supports* (4). Because if they are different people (3), and NIP applies (5), then the unchosen isn't harmed (4).
