      *   **Physical Stance:** Predicting behavior based on physical constitution and laws of physics. (Bottom-up, mechanistic).
      *   **Design Stance:** Predicting behavior based on function/design purpose, ignoring physical details. (Middle-level, functional).
      *   **Intentional Stance:** Predicting behavior based on beliefs, desires, and rationality. (Top-level, agentic).
      *   **Real Patterns:** Patterns are "real" if they support reliable prediction and compression (information theoretic view). If positing an entity (like a belief) allows you to compress the data of behavior significantly without losing predictive power, it's a real pattern.

  3.  **Map to ML Vocabulary:**
      *   **Physical Stance:** Forward pass through weights/architecture. Simulating the neuron activations. Mechanistic interpretability. High compute cost, high fidelity.
      *   **Design Stance:** Architecture class + Loss function + Training data distribution. Knowing *what* the model was optimized for without simulating every weight. E.g., "This is a ResNet trained on ImageNet."
      *   **Intentional Stance:** Treating the model (or agent) as having goals/objectives. Inverse Reinforcement Learning (IRL). Inferring a reward function. Prompt engineering as eliciting "intent". Agentic workflows.
      *   **Real Patterns:** Compressibility. Minimum Description Length (MDL). If a high-level concept (e.g., "edge detector", "object permanence", "belief that X") compresses the input-output mapping better than raw weights, it's real. Predictive accuracy vs. model complexity.

