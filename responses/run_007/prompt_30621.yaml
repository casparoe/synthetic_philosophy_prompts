      *(Self-Correction during drafting)*: I should make sure I don't tell them they *must* drop DA. They want to defend DA. So the fix must be to adjust (3) or explain the compatibility. The most common way to keep DA is to reject SIA. The second most common is to argue SIA applies to priors but SSA to likelihoods and they don't perfectly cancel due to prior shape (e.g. scale-invariant priors). I should mention the Prior dependence.

