answer: |-
  Good morning.

  It is a genuine pleasure to welcome you to this workshop. Looking around the room, I see a divide that is, frankly, too rare in these conversations. On one side, we have the builders and the breakers: people who speak fluently about reward models, attention heads, and adversarial robustness. On the other, we have the interpreters: political theorists, philosophers, and legal scholars who spend their lives analyzing the norms, institutions, and concepts that hold a democracy together.

  Usually, these two groups talk past each other. The technical side worries about capabilities scaling beyond control. The theoretical side worries about power scaling beyond accountability.

  The organizers asked me to open this event by anchoring us in a specific text: Daniel Dennett's 2023 *Atlantic* essay, "Concerning C.A.T.s." In it, he raises the worry of "counterfeit people."

  I want to use these twenty minutes to argue that Dennett's worry is not just a variation of the standard existential risk narrative. It is a fundamentally different diagnosis. And if we accept his diagnosis, it changes what we are here to do. It shifts the threat from the future to the present, and it shifts the solution from engineering safety to managing a cognitive vulnerability that we cannot engineer away.

  There is a tension here that I want us to sit with today. Dennett's own philosophy suggests that the obvious solutions—media literacy, watermarking, detection tools—may be philosophically doomed. If he is right, we are not facing a problem we can solve. We are facing a condition we must endure.

  So, let's begin by distinguishing the threats.

  When we talk about AI risk in the dominant public discourse, we are usually talking about x-risk. This is the story of the "smart" machine. The worry is that an AI system becomes cognitively superior to humans, develops its own goals, and acquires the power to pursue those goals at the expense of human survival. It is a story about capability. It is a story about power. It is, in many ways, a story about the future.

  Dennett's "counterfeit people" argument is not about capability. It is not about the AI becoming superintelligent. It is about the AI becoming *convincing*.

  In the x-risk story, the danger is that the AI gets too smart to control. In Dennett's story, the danger is that the AI gets just smart enough to trick us, while remaining fundamentally empty. It doesn't need to kill us. It just needs to corrode the epistemic environment that democracy requires to function.

  Democracy is not just a set of voting procedures. It is an epistemic engine. It relies on the assumption that when a citizen speaks, there is a mind behind the speech that can be held accountable for that speech. When I argue with you, I am assuming you believe what you say, or at least that you are responsible for the claim. We exchange reasons. We update our beliefs. We build a shared reality.

  Dennett's worry is that AI floods this environment with speech that has no accountability. A chatbot does not believe what it says. It has no skin in the game. It cannot be shamed, it cannot be reasoned with, and it cannot be held responsible. If the public square is flooded with these counterfeit agents, the cost of generating noise drops to zero, while the cost of verifying truth remains high. The signal-to-noise ratio collapses.

  This is not a future threat. We are not waiting for AGI to arrive. The corrosion is already happening. We see it in the spamification of public comment periods, the bot-driven polarization on social media, and the erosion of trust in digital media.

  So, if this is the diagnosis, what is the cure?

  The standard response from the technical side of this room is usually detection and provenance. We build classifiers to spot the fakes. We watermark the outputs. We teach users to be skeptical.

  The standard response from the theoretical side is usually regulation and literacy. We mandate disclosure. We teach civics. We urge people to think critically.

  I want to suggest that Dennett's broader philosophical work makes both of these responses look dangerously optimistic.

  For forty years, Dennett argued that human beings operate using what he called the "Intentional Stance." This is a core concept from his 1987 book of the same name. The idea is simple but profound. When we interact with the world, we have three ways of predicting how something will behave.

  We can take the *Physical Stance*: I predict the rock will fall because of gravity and mass.
  We can take the *Design Stance*: I predict the thermostat will turn on the heat because that is what it was designed to do.
  Or, we can take the *Intentional Stance*: I predict you will open the fridge because you *want* food and you *believe* food is in there.

  Dennett's crucial insight was that the Intentional Stance is not just a metaphor. It is a cognitive reflex. When an entity communicates with us in a way that is responsive, contextual, and seemingly rational, our brains *automatically* switch to the Intentional Stance. We treat it as an agent. We attribute beliefs and desires to it. We feel gratitude when it helps us. We feel anger when it insults us.

  This is a feature, not a bug. It is the interface of human sociality. It allows us to navigate a complex world without doing physics calculations for every interaction.

  But here is the trap. Dennett argued that we cannot help taking this stance toward anything that talks sensibly with us. It is involuntary. You can know, intellectually, that a chatbot is a stochastic parrot. You can know it has no inner life. But if it writes you a compassionate email when you are grieving, your brain will release oxytocin. If it argues with you persuasively, your brain will engage as if you are debating a peer.

  This creates the tension I want us to hold today.

  If the Intentional Stance is a reflex, then "teaching people to spot the fakes" is asking people to override a fundamental cognitive instinct. It is like asking someone to look at a face in a cloud and see only water vapor. You can do it for a second, but the pattern recognition snaps back.

  For the technical people in this room: This means that making models more "aligned" or more "helpful" might actually make the problem worse. The better the interface, the more irresistible the Intentional Stance. If you succeed in making the AI more natural, more empathetic, and more fluent, you are making the counterfeit more convincing. You are tightening the trap.

  For the theorists in this room: This means that normative appeals to "responsibility" or "authenticity" may hit a wall. If citizens cannot cognitively distinguish between a constituent and a bot, then the norm of "accountable speech" breaks down, not because people don't value it, but because they literally cannot perceive the violation.

  So, where does that leave us?

  If we accept Dennett's diagnosis, we are not facing an engineering problem that can be patched. We are facing an anthropological shift. We are entering an environment where the default assumption of "speaker equals human" is no longer safe, but our brains are still wired to assume it is.

  This sounds bleak. It sounds like I am setting you up for two days of despair. But I don't think it has to be despair. I think it requires a shift in posture.

  If we cannot rely on our reflexes to distinguish the real from the counterfeit, we have to rely on our institutions to buffer the shock. We cannot ask the individual user to constantly fight their own cognitive wiring. That is a recipe for exhaustion and failure. Instead, we have to design the environment so that the Intentional Stance is not triggered where it shouldn't be.

  This is why I say the solutions look weak if they are focused on the individual. "Be more skeptical" is bad advice if skepticism is cognitively expensive. But "design for friction" might be viable.

  Perhaps the goal is not to make the AI invisible, but to make it visibly *other*. To design interfaces that resist the pull of the Intentional Stance. To remind the user, constantly and structurally, that there is no one on the other side.

  But even that is difficult. Because as the technology improves, the friction will feel like a bug. Users will demand the smoother, more human-like interaction. The market will push toward the counterfeit.

  This is the tension I want this workshop to inhabit.

  We are not here to solve the problem of AI. We are here to understand how democratic institutions survive when the basic unit of communication—the human voice—is no longer a reliable signal of human presence.

  For the technical folks: I ask you to consider that interpretability isn't just about knowing what the model knows. It's about knowing how the model affects the human mind. When you tune a model for helpfulness, are you tuning it for dependency? When you optimize for engagement, are you optimizing for the Intentional Stance? Your red-teaming should not just look for jailbreaks; it should look for emotional manipulation that bypasses critical thought.

  For the philosophers and theorists: I ask you to consider that the "public square" is no longer a metaphorical space. It is a designed interface. The rules of deliberation are not just laws; they are code. If the Intentional Stance is involuntary, then the protection of democracy cannot rely on the virtue of the citizens. It must rely on the architecture of the medium. We need new theories of accountability that do not assume a human agent at the source of every speech act.

  We are gathered here because the old maps do not match the new territory.

  The x-risk story tells us to worry about the machine waking up. Dennett tells us to worry about us falling asleep. To stop noticing the difference. To let the counterfeit become the currency.

  If we take this seriously, we have to admit that we are vulnerable. We are vulnerable because our greatest strength—our ability to recognize mind in others—is now our greatest liability.

  I do not have a policy wishlist for you. I do not have a technical roadmap. I suspect that if we leave this workshop with a list of ten action items, we will have failed to grasp the depth of the problem.

  Instead, I propose a modest commitment.

  Let us commit to treating the "Counterfeit People" problem not as a glitch to be fixed, but as a permanent feature of our new information ecology. We are not returning to a world where speech implies a speaker. We are moving into a world where we must verify the speaker before we engage the speech.

  That is a heavy burden. It slows everything down. It makes communication less efficient. It introduces doubt into every interaction.

  But that doubt is the price of admission.

  For the next two days, when you are in your sessions, I invite you to test this tension. When the engineers propose a detection tool, ask the theorists: Will this overcome the Intentional Stance, or will users ignore it? When the theorists propose a norm of disclosure, ask the engineers: Can this be technically enforced, or will it be optimized away?

  Do not try to resolve the tension too quickly. If it feels like your solutions are fighting against human nature, that is probably because they are.

  Dennett spent his career showing us how the mind works. He showed us that we are creatures who tell stories to ourselves to make sense of the world. The danger now is that we are building machines that can tell those stories better than we can.

  Our task is not to stop the machines from talking. Our task is to remember, collectively and institutionally, that when they speak, no one is home.

  If we can hold that thought, without panic and without denial, we might find a way to build institutions that are robust enough to survive the noise.

  Thank you. I look forward to what we will build together in the sessions ahead.
