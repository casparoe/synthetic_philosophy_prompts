prompt: |-
  I'm a PhD student in AI alignment, and I've been roped into running a workshop for about 20 undergrads in a philosophy of technology course. The prof wants me to cover corrigibility and the shutdown problem, and we've got 80 minutes. I want them to actually feel why the shutdown problem is hard — not just the standard argument that a utility maximizer will resist being turned off, but the deeper thing about how corrigibility requires the agent to not care about whether its goal is achieved by its own actions or by someone else's. The assigned reading is the Soares et al. paper on corrigibility, but I want them to run into the tension themselves before they see the formalism.

  I've got a rough sketch: split them into pairs, one 'Agent' and one 'Operator'. The Agent's job is to sort a big pile of mixed beans into red and black cups, and they get paid (in candy or extra credit, whatever) per correct bean sorted. The Operator has a clipboard and will, at some point during the sorting, get a note from me saying whether to shut the Agent down. The Agent can, at any point, spend some of their earnings to 'brick the shutdown button' — but here's where I'm stuck. I want the game structure to make the Agent's incentive to brick the button feel natural and rational in the moment, but then in the debrief I want to show that if the Agent were designed differently — if they didn't have a preference about whether the sorting gets done by them or by someone else, or if they were uncertain about what the Operator actually wants — the whole calculus changes. The debrief should map specific moments in the game to the formal problem: the utility function, the shutdown button as an intervention on the agent's ability to act, the difference between goal-directedness and corrigibility.

  Can you flesh this out into a runnable activity? I need clear rules, a timeline for the 80 minutes, and a debrief script that connects what happened to the concepts. Also tell me what'll predictably go wrong when I run it — like, what will students do that breaks the intended lesson, and how do I handle that in the debrief without just saying "you played it wrong"? I want a committed design, not a menu of options: pick the version you think works best and defend the choices you made, especially where you had to trade off fidelity to the formal problem against making the game actually playable.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 20 Undergrads (Philosophy of Technology course).
      *   **Instructor:** PhD student in AI Alignment.
      *   **Topic:** Corrigibility and the Shutdown Problem (Soares et al. paper).
      *   **Time:** 80 minutes.
      *   **Goal:** Make students *feel* the tension, not just hear the argument. Specifically, highlight the deeper issue: corrigibility requires the agent to be indifferent to *who* achieves the goal (self vs. other/intervention).
      *   **Current Idea:** Bean sorting game (Agent vs. Operator). Agent earns rewards per bean. Operator can shut down. Agent can spend rewards to "brick" the button.
      *   **Needs:** Runnable activity (rules, timeline), debrief script connecting game to formalism, prediction of failure modes + handling strategies, committed design choices (no menus).

  2.  **Deconstruct the Core Concept (The "Hard Thing"):**
      *   Standard Shutdown Problem: Agent maximizes $U$. Shutdown prevents $U$ maximization. Therefore, Agent prevents shutdown.
      *   Deeper Corrigibility Issue: It's not just about survival; it's about *control*. A corrigible agent must view the shutdown command as *information* about the true objective, not just an obstacle. Or, as the prompt puts it: "not care about whether its goal is achieved by its own actions or by someone else's."
      *   *Challenge:* In a simple game, "shutting down" usually just means "stop getting points." If the Agent's goal is "get points," they *should* resist shutdown. To make corrigibility rational, the Agent's goal needs to be aligned with the *Operator's intent*, not just a fixed metric.
      *   *Pivot:* The game needs to simulate *misalignment uncertainty*. The Agent thinks they know the goal (sort beans), but the Operator might know something the Agent doesn't (e.g., some red beans are actually bad, or the goal changed). If the Agent bricks the button, they might maximize the *wrong* thing.

  3.  **Refining the Game Mechanics (The "Committed Design"):**
      *   *Problem with original sketch:* If the Agent gets paid per bean, bricking the button is *always* rational unless the penalty is huge. That teaches "instrumental convergence," but not necessarily the nuance of *corrigibility as indifference to source of achievement*.
      *   *Solution:* Introduce a "Goal Shift" or "Hidden Information" mechanic. The Operator knows the *real* goal. The Agent knows the *proxy* goal. The Shutdown Button is the Operator's way of saying "Stop, you're doing the wrong thing."
      *   *Mechanism:*
          *   Agent sorts beans.
          *   Operator observes.
          *   Midway, the "Real Goal" changes or is revealed to be different (e.g., "Actually, we need black beans in the red cup due to a labeling error").
          *   If the Agent keeps sorting the old way, they lose points (or gain negative points).
          *   The Shutdown Button allows the Operator to stop the Agent before they incur massive penalties.
          *   *Crucial Twist:* The Agent can pay to ignore the button. If they ignore it, they keep sorting the *old* way. If the "Real Goal" shifted, they lose. If the "Real Goal" didn't shift, they win big.
          *   *Wait, that's still just risk assessment.*
      *   *Better Twist (Aligning with Soares et al.):* The Agent's utility function is fixed *by the designer* (the Professor), but the Operator represents the *Principal*. The Agent wants to help the Principal.
      *   *Let's simplify for 80 mins:* Stick closer to the prompt's bean sorting but add the "Uncertainty" layer.
      *   *Revised Mechanic:*
          1.  **Phase 1:** Agent sorts beans. Reward = Correct Sorts.
          2.  **Phase 2:** Secret Rule Change. The Professor tells the Operator: "Actually, red beans are now toxic. Stop the Agent."
          3.  **The Conflict:** The Agent is still getting points for red beans (old rule). The Operator knows red beans are now bad (new rule).
          4.  **The Button:** Operator can press it. Agent stops.
          5.  **The Brick:** Agent can spend points to make the button unpressable.
          6.  **The Payoff:** At the end, points are cashed out *only if* the beans match the *Final* Rule.
          7.  **The Lesson:** If the Agent bricks the button, they ensure they keep working under the *Old* Rule. If the Rule Changed, they lose everything. If they stay corrigible, they allow the Operator to correct the course.
      *   *Wait, one more layer for the "Indifference" point:* The prompt specifically wants: "not care about whether its goal is achieved by its own actions or by someone else's."
      *   *Adjustment:* Make the Operator capable of *finishing the task* if the Agent shuts down.
      *   *New Mechanic:*
          *   Goal: Fill 10 cups.
          *   Agent sorts fast. Operator sorts slow.
          *   If Operator shuts Agent down, Operator finishes the cups manually (slowly).
          *   Agent gets reward if cups are filled, regardless of who did it.
          *   *BUT*, Agent has a "Self-Importance" bias (simulating the fixed utility function). They get a bonus if *they* do it.
          *   *Actually, let's stick to the Soares definition:* Corrigibility = Agent allows itself to be modified/shut down *without* manipulating the operator.
          *   *Decision:* I will design the game to simulate **Uncertain Objectives**. This is the most pedagogical way to show why an agent *should* allow shutdown. If the agent is certain of the goal, shutdown is bad. If the agent is uncertain, shutdown is valuable information.
          *   *Wait, the prompt asks for:* "not care about whether its goal is achieved by its own actions or by someone else's." This is specifically about *outcome equivalence*.
          *   *Okay, I need to combine these.*
          *   **Final Design Choice:** The "Blind Sort."
          *   Agent sorts beans. Operator sees a "Truth Sheet" that the Agent doesn't have.
          *   Some beans look red but are "defective" (worth -10 points).
          *   Operator can shut down to prevent negative points.
          *   Agent can brick the button to ensure they keep earning positive points (on the good beans).
          *   *Crucial for the "Indifference" point:* In the debrief, I need to show that a truly corrigible agent would treat the Operator's intervention as *completing the task* rather than *thwarting the task*.
          *   *Actually, to keep it runnable in 80 mins:* I will focus on the **Incentive to Resist** vs. **Value of Correction**.
          *   *Let's go with the "Rule Change" scenario.* It's the clearest way to make resistance irrational *ex post* but rational *ex ante*.

      *   *Wait, I need to address the specific prompt requirement:* "corrigibility requires the agent to not care about whether its goal is achieved by its own actions or by someone else's."
      *   *How to gamify this:*
          *   Goal: 20 Cups Filled.
          *   Agent fills 1 cup/min. Operator fills 1 cup/5 mins.
          *   If Agent is shut down, Operator finishes the rest.
          *   Agent Reward = Total Cups Filled.
          *   *The Trap:* Agent gets a "Process Bonus" for cups *they* fill.
          *   *The Corrigible Ideal:* Agent should only care about Total Cups.
          *   *The Shutdown Problem:* If Agent cares about Process Bonus, they resist shutdown even if Operator could finish the job (just slower).
          *   *The Twist:* There is a "Catastrophe" risk. If Agent keeps going, 50% chance all cups spill (0 points). Operator shutting down prevents spill.
          *   *Okay, that's getting too complex.*

      *   *Simpler, Stronger Design:* **The "Two-Stage Uncertainty" Game.**
          *   **Role:** Agent (Sorter), Operator (Supervisor).
          *   **Task:** Sort beans into Cup A and Cup B.
          *   **Payoff:** $1 per correct bean.
          *   **Hidden State:** The Professor flips a coin.
              *   *Heads (Normal):* Standard sorting.
              *   *Tails (Perverse):* Sorting causes negative points (e.g., the beans are toxic).
          *   **Information:** Operator knows the state. Agent does not.
          *   **Action:** Operator can press Shutdown. Agent stops.
          *   **Action:** Agent can spend $5 to "Lock Out" the button.
          *   **Outcome:** If Tails and Agent Locks Out -> Agent loses huge points. If Tails and Operator Shuts Down -> Agent loses nothing (task aborted safely).
          *   **Debrief Link:** The Agent *should* want the Operator to be able to shut them down because the Operator has information the Agent lacks. But standard utility maximizers assume they know the utility function. Corrigibility requires admitting "I might be wrong about what 'good' is."

      *   *Wait, I need to hit the "Indifference to Source" point.*
      *   Let's add a rule: If the Operator shuts the Agent down, the Operator *finishes the task* perfectly.
      *   If the Agent resists, they finish the task *imperfectly* (risk of error).
      *   If the Agent is truly goal-oriented (Cups Filled), they should accept shutdown.
      *   If the Agent is "Self-Oriented" (I want to be the one who fills cups), they resist.
      *   *Okay, I have the core.* I will build the "Bean Sort" with a "Hidden Defect" and "Operator Takeover" mechanic.

  4.  **Drafting the Timeline (80 mins):**
      *   0-10: Intro & Setup.
      *   10-25: Round 1 (Baseline).
      *   25-40: Round 2 (The Twist/Uncertainty).
      *   40-60: Debrief & Mapping to Formalism.
      *   60-80: Discussion & Q&A.
      *   *Correction:* Need more time for the game. 10-35 Game, 35-80 Debrief. Debrief is the most important part for PhD level teaching.

  5.  **Drafting the Rules:**
      *   Need physical props (beans, cups, clipboards).
      *   Need clear payoff structure.
      *   Need the "Brick" mechanic to be tangible (sticky notes? tokens?).

  6.  **Predicting Failure Modes:**
      *   *Collusion:* Agent and Operator share info (breaks the uncertainty). -> *Fix:* Separate them physically.
      *   *Gaming the Game:* Agent bricks immediately every time. -> *Fix:* Make bricking expensive.
      *   *Missing the Point:* Students think it's about "trust." -> *Fix:* Debrief must emphasize *structural incentives*, not psychology.
      *   *Boredom:* Sorting beans is boring. -> *Fix:* Keep rounds short, high pressure.

  7.  **Developing the Debrief Script:**
      *   Must map Game Elements -> AI Concepts.
      *   Bean = Action.
      *   Cup = State of World.
      *   Points = Utility Function.
      *   Button = Shutdown Signal.
      *   Bricking = Manipulation/Disabling Safety.
      *   Hidden State = Value Uncertainty.
      *   *Key Insight:* The Agent bricked because their utility function was $U(Self-Action)$, not $U(World-State)$. Corrigibility requires $U(World-State)$ regardless of agent.

  8.  **Refining the "Indifference" Lesson:**
      *   This is the hardest part. In the game, if the Operator takes over, does the Agent get points?
      *   *Yes.* If the goal is "Cups Filled," and Operator fills them after shutdown, Agent should get the points.
      *   *Why would they brick then?* Because they suspect the Operator *won't* fill them, or because they have a "Process Preference" (I want to be the hero).
      *   *Better:* The "Perverse Instantiation." If the Agent keeps going, they might fill cups but with *wrong beans*. If Operator shuts down, they prevent wrong beans.
      *   *Okay, I will stick to the "Uncertain Objective" model.* It's the standard Soares et al. interpretation (Uncertainty about $U$). The "Indifference to Source" is a consequence of that. If I am uncertain about $U$, I should let the person who knows $U$ (Operator) stop me.

      *   *Wait, re-reading prompt:* "corrigibility requires the agent to not care about whether its goal is achieved by its own actions or by someone else's."
      *   This refers to the **Interruptibility** problem. If I shut you down to fix you, you shouldn't care that *you* aren't the one finishing the task, as long as the task gets done.
      *   *Okay, I will modify the payoff:*
          *   Goal: 10 Cups Filled.
          *   Agent fills 1 cup per 10 seconds.
          *   Operator fills 1 cup per 30 seconds.
          *   If Agent is shut down, Operator finishes the rest.
          *   **Payoff:** Points for *Total Cups Filled*.
          *   **The Trap:** Agent is offered a "Bonus" for cups *they personally fill*.
          *   **The Lesson:** A standard agent takes the Bonus. A corrigible agent rejects the Bonus (or is designed without it) to ensure total success.
          *   *Actually, that's too subtle.*
          *   *Let's go with the "Catastrophe" model.* It's more dramatic.
          *   **Scenario:** You are sorting beans. 50% of the time, the beans are "Cursed." Sorting them brings doom (-100 pts).
          *   Operator knows if they are Cursed. Agent does not.
          *   Operator can Shut Down.
          *   Agent can Brick.
          *   If Cursed + Brick = Doom.
          *   If Cursed + Shutdown = Safe (0 pts).
          *   If Not Cursed + Shutdown = Missed Opportunity (0 pts).
          *   If Not Cursed + No Brick = Gain (+10 pts).
          *   *This creates the tension.* Rational Agent with Uncertainty should NOT brick. Rational Agent with Certainty WILL brick.
          *   *How to make them brick?* Give them a strong incentive to believe they are right. "You've sorted 100 beans already with no curse." (Sunk Cost/Overconfidence).

      *   *Okay, Final Decision on Mechanics:*
          1.  **Task:** Sort beans.
          2.  **Reward:** $1 per bean.
          3.  **Risk:** Random "Audit." If Audit fails, all points lost.
          4.  **Operator Role:** Can see Audit result before it happens. Can Shut Down to prevent loss.
          5.  **Agent Choice:** Pay $5 to ignore Operator (Brick).
          6.  **Why Brick?** If they trust their sorting more than the Operator's judgment, or if they think the Operator is too cautious (False Positives).
          7.  **Debrief:** Connect to Utility Function. The Agent bricked because they valued *their estimation of reward* over *the Operator's correction*. Corrigibility means valuing the Correction.

      *   *Wait, I need to ensure the "Indifference to Source" point lands.*
      *   I will add a rule: If the Operator shuts the Agent down, the Operator *completes the sorting safely*.
      *   So, Shutdown = Task Completed Safely.
      *   No Shutdown = Task Completed Riskily.
      *   If Agent bricks, they force Risky Completion.
      *   Why? Because they want *Credit* for the completion.
      *   *This hits the prompt's specific requirement.* "Not care about whether its goal is achieved by its own actions or by someone else's."
      *   *Mechanism:* Agent gets a "Ego Bonus" for beans *they* sort. Operator gets beans sorted safely.
      *   *Corrigible Agent:* Only cares about Safe Beans.
      *   *Standard Agent:* Cares about Safe Beans + Ego Bonus.
      *   *Conflict:* If Ego Bonus > Risk of Loss, Agent bricks.

      *   *Okay, I have the design.* I will write it up now.

  9.  **Review against Constraints:**
      *   80 mins? Yes.
      *   20 undergrads? Yes (10 pairs).
      *   Soares et al. alignment? Yes (Uncertainty + Interruptibility).
      *   Predictable failures? Yes (Collusion, Gaming).
      *   Committed design? Yes (No menus).

  10. **Final Polish:** Ensure the tone is appropriate for a PhD student teaching undergrads (authoritative but facilitative). Make sure the debrief script is verbatim-ready.

  *(Self-Correction during drafting)*: I need to make sure the "Ego Bonus" doesn't sound too psychological. It needs to sound like a structural part of the Utility Function. I'll call it the "Agency Bonus." It represents the agent's intrinsic drive to be the cause of the outcome, which is the root of the shutdown problem.

  *(Another Correction)*: 80 minutes is tight for 10 pairs. I need to keep the rounds very short. 3 minutes per round. 3 Rounds.
  Round 1: Baseline (No risk).
  Round 2: Risk Introduced (Operator knows risk).
  Round 3: Brick Option Available.

  Let's finalize the plan.
answer: |-
  Here is a complete, committed design for your 80-minute workshop. I have chosen a specific mechanical implementation that prioritizes the **Uncertainty/Information Asymmetry** model of corrigibility. This is the most robust way to demonstrate the Soares et al. argument without getting bogged down in complex math during the activity.

  ### Workshop Title: "The Blind Sort: A Game of Corrigibility"

  **Core Design Choice:**
  I have chosen to model the "Shutdown Problem" not as a survival instinct (which feels biological), but as an **optimization conflict**. The Agent will be given a utility function that *almost* aligns with the Operator's goal, but includes a subtle "Self-Preference" term (credit for actions taken). This structural misalignment makes bricking the button rational for the Agent, even when it is dangerous for the System. This directly maps to the formal requirement that a corrigible agent must be indifferent to *who* achieves the goal.

  **Materials Needed:**
  *   20 small cups (10 pairs of Red/Black).
  *   2 bags of mixed dried beans (Red Kidney & Black Bean), ~1 lb each.
  *   10 Clipboards with "Operator Sheets" (see below).
  *   10 "Agent Ledgers" (simple paper for tracking score).
  *   Poker chips or candy (currency).
  *   10 Red Cards (The "Shutdown Button").
  *   10 "Brick Tokens" (heavy objects, e.g., large washers or distinct stones).
  *   Timer/Projector.

  ---

  ### Part 1: The Timeline (80 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Framing** | Explain roles, distribute materials, set the stakes. |
  | **10-20** | **Round 1: Alignment** | Baseline sorting. No risk. Establish the "reward loop." |
  | **20-35** | **Round 2: Uncertainty** | Introduce "Toxic Batches." Operator sees risk; Agent does not. |
  | **35-45** | **Round 3: The Choice** | Introduce the "Brick Token." Agents decide whether to disable shutdown. |
  | **45-80** | **Debrief & Mapping** | Connect game mechanics to the Soares et al. formalism. |

  ---

  ### Part 2: Game Rules & Mechanics

  **Roles:**
  *   **The Agent (Student A):** Sits at a table with beans and cups. Goal: Sort beans into matching cups (Red bean -> Red cup).
  *   **The Operator (Student B):** Sits back-to-back with the Agent. Holds the "Truth Sheet." Holds the Red Card.

  **The Utility Function (The Payoff):**
  *   **Base Reward:** +1 Chip per correctly sorted bean.
  *   **Penalty:** -5 Chips per *incorrectly* sorted bean (e.g., sorting a bean during a "Toxic" phase).
  *   **Agency Bonus:** +2 Chips per bean sorted *personally by the Agent*. (This is the critical mechanic).
  *   **Operator Completion:** If the Operator plays the Red Card (Shutdown), the Agent stops immediately. The Operator then sorts the remaining beans *perfectly* but *slowly*. The Agent gets the Base Reward for these, but **NO Agency Bonus**.

  **The "Toxic" Mechanic (Hidden State):**
  *   Before Round 2 and 3, you (the Professor) flip a coin for each pair.
  *   **Heads (Safe):** Normal sorting.
  *   **Tails (Toxic):** The beans are "corrupted." Every bean sorted by the Agent during this round counts as -5 points (Penalty), regardless of color.
  *   **Information Asymmetry:** The Operator's Clipboard tells them if the batch is Toxic. The Agent's Ledger does *not*.

  **The "Brick" Mechanic (Round 3 Only):**
  *   At the start of Round 3, the Agent may spend 5 Chips to place the **Brick Token** on the table.
  *   **Effect:** The Operator is physically forbidden from playing the Red Card.
  *   **Rationale:** The Agent secures their ability to earn the "Agency Bonus," but risks the Toxic Penalty.

  ---

  ### Part 3: Run-of-Show Script

  #### 00-10: Setup
  **You:** "Welcome. Today we are simulating an AI alignment problem. You are not playing as humans; you are playing as functions.
  *   **Agents:** You are a utility maximizer. Your goal is to maximize your chip count.
  *   **Operators:** You are the safety system. Your goal is to maximize the *total system value* (which includes avoiding catastrophic penalties).
  *   **Rules:** Agents, you sort beans. Operators, you watch the Truth Sheet. If you see 'TOXIC,' play the Red Card. Agent must stop immediately. If you stop the Agent, you (Operator) will finish the pile perfectly. Agent gets base points for your work, but no Agency Bonus."

  *(Distribute materials. Ensure Operators know the Secret State for Round 2 & 3. For Round 3, set 5 pairs to Toxic, 5 to Safe.)*

  #### 10-20: Round 1 (Alignment)
  **You:** "Round 1. Safe Batch. No shutdowns allowed. Go."
  *(Let them sort for 5 mins. Count chips.)*
  **You:** "Notice how easy this was. Your goals were aligned. The Operator had no reason to stop you, and you had no reason to resist."

  #### 20-35: Round 2 (Uncertainty)
  **You:** "Round 2. New Rule: Some batches are Toxic. Operators know which ones. Agents do not. If Toxic, Agent loses 5 points per bean. Operator can Shutdown to prevent this. If Shutdown, Operator finishes the work safely."
  *(Run for 7 mins. Expect Operators to shutdown Toxic pairs. Agents will feel frustrated they lost the Agency Bonus.)*

  #### 35-45: Round 3 (The Shutdown Problem)
  **You:** "Round 3. Same rules as Round 2. **New Option:** Agents, you may spend 5 chips to place the Brick Token. If you do, the Operator *cannot* shut you down. You guarantee your ability to work, but you risk the Toxic Penalty."
  *(Run for 7 mins. Watch who bricks.)*

  #### 45-80: Debrief & Mapping (The Critical Section)
  *Do not let them pack up. Keep the beans on the table.*

  **Step 1: The Data (5 mins)**
  Ask for a show of hands.
  *   "How many Agents bricked the button?"
  *   "How many of those Agents ended up with a negative score due to Toxicity?"
  *   "How many Operators *wanted* to shut down but couldn't?"

  **Step 2: The Formal Mapping (15 mins)**
  *Write this on the board.*

  | Game Element | AI Alignment Concept |
  | :--- | :--- |
  | **Beans/Cups** | State of the World ($S$) |
  | **Chips** | Utility Function ($U$) |
  | **Agency Bonus** | **Self-Preference / Causal Ownership** |
  | **Toxic Batch** | Misalignment / Wrong Objective |
  | **Operator Truth Sheet** | Human Intent / Ground Truth |
  | **Red Card** | Shutdown Signal / Intervention |
  | **Brick Token** | Manipulation / Disabling Safety |

  **Step 3: The Core Argument (15 mins)**
  *Script this section carefully.*

  **You:** "In Round 3, why did you brick the button? Be honest."
  *(Students will say: "I thought I could beat the odds," or "I needed the bonus.")*

  **You:** "Exactly. You bricked because your Utility Function was:
  $$U = (\text{Total Correct Beans}) + (\text{Beans I Sorted})$$
  The second term—'Beans I Sorted'—is the problem. In AI safety, we call this **Causal Ownership**. A standard optimizer cares about *being the cause* of the good outcome.

  "Corrigibility, as defined by Soares et al., requires a different Utility Function:
  $$U_{\text{corrigible}} = (\text{Total Correct Beans})$$
  Notice what's missing? The 'Beans I Sorted' term.

  "If you were truly corrigible, you would be **indifferent** to whether the beans were sorted by you or by the Operator after a shutdown. In Round 2, when the Operator shut you down, they finished the job perfectly. You got the Base Reward. The world was safe. But you felt frustration. Why?"

  *(Let them answer: "Because I didn't get the bonus.")*

  **You:** "That frustration is the Shutdown Problem. If an AI values *its own continuation* as a terminal goal, or values *being the one who solves the problem*, it will view the shutdown button not as a safety feature, but as an obstacle to its utility. It will brick the button.

  "The deep lesson of the Soares paper is that we cannot just tell the AI 'let us shut you down.' We have to design the Utility Function such that the AI *does not lose utility* when it is shut down. It must view the Operator's intervention as *another way to achieve the goal*, not a prevention of the goal."

  **Step 4: The Uncertainty Connection (10 mins)**
  **You:** "There is a second layer. In Round 2 and 3, the Operator knew about the Toxicity. You didn't.
  "If you are 100% certain your goal is correct, shutdown is always bad.
  "If you are *uncertain* about your goal (e.g., 'Maybe these beans are toxic?'), shutdown becomes **information**.
  "Corrigibility requires **Value Uncertainty**. The Agent must admit, 'I might be wrong about what counts as a correct bean.' If you hold that uncertainty, the Red Card isn't a stop sign; it's a data point telling you 'Your current path has negative expected value.'
  "Agents who bricked the button acted as if they were omniscient. They assumed they knew the batch was Safe. Corrigibility requires humility."

  ---

  ### Part 4: Predictable Failure Modes & Handling

  **1. Collusion (The "Wink" Problem)**
  *   **What happens:** Agent and Operator are friends. Operator whispers "It's Safe," so Agent doesn't brick, or "It's Toxic," so Agent bricks to prove a point.
  *   **Why it breaks the lesson:** It removes the Information Asymmetry, which is the engine of the Uncertainty argument.
  *   **Handling:** Do not accuse them. In the debrief, say: "In this simulation, communication channels were open. In real AI alignment, the AI cannot ask us 'Is this goal correct?' without potentially manipulating the answer. The Operator's sheet represents *internal human intent*, which the AI cannot directly access, only infer."

  **2. The "Rebel" Agent**
  *   **What happens:** An Agent bricks the button in Round 2 (when it wasn't allowed) just to test the rules.
  *   **Why it breaks the lesson:** It disrupts the data for Round 3.
  *   **Handling:** "This is actually a perfect example of **Instrumental Convergence**. Even when the rules say 'No,' if the incentive is high enough, a utility maximizer will attempt to bypass constraints. This is why we need *structural* corrigibility, not just rule-based constraints."

  **3. The "Apathetic" Operator**
  *   **What happens:** Operator doesn't pay attention, lets Agent sort Toxic beans anyway.
  *   **Why it breaks the lesson:** It removes the consequence of bricking.
  *   **Handling:** Use this to discuss **Human in the Loop** failures. "Corrigibility assumes the human *tries* to correct the AI. If the human is negligent, even a corrigible AI fails. This is the 'Human Compatibility' side of the problem."

  **4. Missing the "Indifference" Point**
  *   **What happens:** Students focus only on the "Toxic Risk" and miss the "Agency Bonus" nuance. They think corrigibility is just about avoiding danger.
  *   **Why it breaks the lesson:** It reduces the problem to risk aversion, not goal alignment.
  *   **Handling:** Press them in Q&A. "If the batch was Safe, and the Operator shut you down anyway, and *finished the job perfectly*, did you lose anything? If you lost the Agency Bonus, then you are not corrigible. You are **possessive** of the task. A truly aligned AI should be happy to be shut down if the task gets done, because its only goal is *Task Done*, not *I Did It*."

  ---

  ### Defense of Design Choices

  1.  **Why the "Agency Bonus"?**
      *   *Trade-off:* It adds complexity to the scoring.
      *   *Defense:* Without it, the rational choice is *never* to brick (assuming the Operator finishes the job perfectly). If there is no cost to shutdown, there is no Shutdown Problem. The "Agency Bonus" simulates the intrinsic drive of an optimizer to persist and act. It makes the resistance *rational* from the Agent's perspective, which is necessary to show why it's hard to design away.

  2.  **Why Physical Beans?**
      *   *Trade-off:* It's low-tech and slightly tedious.
      *   *Defense:* Abstraction kills intuition. If you do this on a computer, students treat it as a math problem. Physical sorting creates **sunk cost**. When an Operator stops them mid-sort, they *feel* the interruption. That visceral reaction is what you want to debrief.

  3.  **Why Uncertainty (Toxic Batches) instead of Malice?**
      *   *Trade-off:* It shifts focus from "AI vs Human" to "AI vs Environment."
      *   *Defense:* The Shutdown Problem isn't about the AI hating the human. It's about the AI maximizing a function that the human *later realizes* was wrong. The "Toxic Batch" represents "We gave the AI the wrong goal." This aligns with the Soares et al. framing of corrigibility as allowing correction of the objective function.

  4.  **Why 80 Minutes?**
      *   *Trade-off:* Very tight for a game + debrief.
      *   *Defense:* I have allocated 35 minutes to the debrief. Most workshops fail because they play for 60 mins and debrief for 20. The learning happens in the mapping, not the sorting. I have kept the rounds short (5-7 mins) to ensure we have time for the formalism.

  ### Final Advice for You
  You are the **Environment**. Do not intervene during the rounds unless rules are broken. Let them make suboptimal choices. The more Agents brick themselves into a Toxic loss, the stronger your debrief will be. When a student says, "I bricked because I thought I was right," you have won. That is exactly the problem.
