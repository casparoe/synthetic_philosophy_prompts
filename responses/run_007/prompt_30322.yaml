answer: |-
  The impasse between deflationists and substantivalists is **substantive**, not verbal, and it is not merely the product of two different questions sharing a name. It is a substantive disagreement about the **legitimacy of a specific explanatory demand**.

  However, my diagnosis is that the substantivalist side of this substantive disagreement is motivated by a category mistake. Consequently, I am taking a side: **Deflationism is correct, and the substantivalist demand for a "nature" of truth is illegitimate.** The debate stalls not because both sides have equal claim to the phenomenon, but because the substantivalist is insisting on an answer to a question that dissolves once the logic of the predicate is properly understood.

  ### The Diagnosis: A Substantive Disagreement About Explanatory Burden

  The dispute is not verbal because both camps largely agree on the logical behavior of the truth predicate. Both accept the T-schema (the proposition that *p* is true iff *p*) as a constraint on any adequate theory. If this were merely a verbal dispute about the definition of "property," we could stipulate a distinction (e.g., "lightweight" vs. "heavyweight" properties) and dissolve the tension. We cannot. The substantivalist insists that even if we grant the T-schema, truth must *also* be a robust property that *explains* why successful action follows true belief, or why assertion is governed by a norm of truth. The deflationist insists that the T-schema exhausts the concept, and any explanation invoking truth can be rewritten without it.

  This is a substantive clash over **explanatory ontology**. The substantivalist claims truth is a *difference-maker* in causal or normative explanations. The deflationist claims truth is an *expressive device* that facilitates generalization but adds no causal or normative power of its own.

  The reason the dialectic does not move is that the substantivalist treats the **utility** of the concept as evidence for its **metaphysical weight**. They observe that truth plays a central role in our normative practices (inquiry, assertion, belief) and infer that there must be a property *truth* that grounds these norms. The deflationist observes the same practices but argues that the norms are grounded in the *content* of the beliefs/assertions and the pragmatic goals of the agents, not in the property of truth itself.

  The impasse persists because the substantivalist feels the deflationist is "leaving something out" (the normative glow, the worldly hook), while the deflationist feels the substantivalist is "adding something unnecessary" (a metaphysical ghost). This is not a verbal confusion; it is a disagreement about whether the structure of our explanations requires a truth-property as a primitive term.

  ### Why I Take the Deflationary Side

  My diagnosis commits me to the deflationary side because the substantivalist has failed to meet the **explanatory challenge** posed by Field and Horwich.

  1.  **The Success Argument:** Substantivalists argue: "True beliefs lead to successful action; therefore, truth is an explanatory property."
      *   *Deflationary Rebuttal:* If I believe that *water quenches thirst* and I drink water, my success is explained by the content of the belief (water quenches thirst) and the state of the world (water does quench thirst). Adding "and this belief is *true*" adds no explanatory power. It is a redundant label. The substantivalist has never produced a case where the property of truth *itself*, distinct from the content of the proposition, does causal work.
  2.  **The Norm of Assertion:** Substantivalists argue: "Assertion is governed by the norm 'Assert only what is true'; this requires truth to be a substantive norm."
      *   *Deflationary Rebuttal:* Norms are grounded in the practice, not the property. To say "Assert only what is true" is just to say "Assert *p* only if *p*." The normativity comes from the commitment involved in asserting, not from a relation to a property called Truth.
  3.  **The Liar Paradox:** Substantivalists accuse deflationists of ad hoc solutions.
      *   *Deflationary Rebuttal:* Substantivalists (correspondence theorists, etc.) have no better solution to the Liar. If a metaphysical property of truth cannot save us from paradox, positing it gains us nothing over a logical solution to the predicate.

  The substantivalist position relies on the intuition that "truth must be *something*." My diagnosis is that this intuition is a reification of a logical function. The debate stalls because substantivalists treat this intuition as a datum, while deflationists treat it as a target for elimination.

  ### What Would Count as Genuine Progress?

  Given this diagnosis, progress will not come from a new theory of truth (neither a new correspondence relation nor a new equivalence schema). Progress requires **demonstrating the redundancy of the truth-property in explanation**.

  Specifically, genuine progress would take one of two forms:

  1.  **A Formal Discharge Result:**
      We need a formal proof in the philosophy of language/action showing that for any explanation $E$ that invokes the property of truth as a causal or normative factor, there exists an explanation $E'$ that invokes only the T-schema instances and pragmatic norms, such that $E'$ preserves all the predictive and explanatory power of $E$.
      *   *Current Status:* We have sketches of this (e.g., Horwich's use-theory), but not a rigorous formalization that satisfies the substantivalist's demand for "robustness." A formal result showing that "truth" is eliminable from all semantic explanations without loss would force the substantivalist to either accept eliminativism or identify a specific, non-dischargeable explanatory role.
      *   *Why this moves the needle:* It shifts the burden. Instead of the deflationist trying to explain away norms, the substantivalist must point to a specific explanatory gap that *only* a truth-property can fill.

  2.  **A Change of Question (The Pragmatic Turn):**
      We must stop asking "What is the nature of truth?" and start asking "What psychological or social function does the *representation* of truth serve?"
      *   *The Shift:* The substantivalist intuition (that truth is "weighty") is correct about our *psychology* but wrong about the *world*. We *treat* truth as a goal. We *feel* it as a norm. Progress comes from a theory of **normative psychology** that explains why humans reify logical devices into metaphysical goals, without validating the metaphysics.
      *   *Why this moves the needle:* It validates the substantivalist's data (the importance of truth in inquiry) without validating their ontology. It explains the *impasse itself* as a psychological inevitability, rather than a metaphysical mystery.

  ### Why No Progress Might Be Expected

  If I am pessimistic, I would say no progress is expected because the substantivalist commitment is not empirical or logical, but **temperamental**.

  The substantivalist view is often driven by a realist metaphysics that requires language to "hook onto" the world via a specific relation. To accept deflationism is to accept that the "hook" is just the use of the language itself. This feels like losing the world to many realists. As long as the substantivalist equates "meaningful discourse" with "discourse that maps onto robust properties," they will reject deflationism as nihilism, regardless of the logical arguments.

  However, I am not pessimistic. The path forward is to recognize that the "substantive" part of the dispute is actually a **methodological error**. The substantivalist is asking for a causal explanation of a logical norm. Once we categorize truth strictly as a logical device for generalization and endorsement, the demand for a "nature" vanishes.

  ### Conclusion

  The impasse is substantive: it is a fight over whether truth is an explanatory primitive. But it is a fight where one side is fighting for a ghost. Progress requires stopping the attempt to define truth and starting the work of **explanatory discharge**. We must show, formally and pragmatically, that every job the substantivalist assigns to Truth can be done by the T-schema and the norms of assertion. Until that discharge is rigorously demonstrated, the substantivalist will continue to feel that something is missing. But the diagnosis remains: nothing is missing. The "depth" of truth is an illusion generated by its ubiquity in our discourse. Deflationism is not a theory of what truth *is*; it is the dissolution of the demand for such a theory.
