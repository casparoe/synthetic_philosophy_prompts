answer: |-
  Your intuitions warrant a respectable pluralism distinguishing objective chance from epistemic confidence, but you must resolve the inconsistency between accepting probabilities for past physical events like the Higgs while rejecting them for past historical events like Caesar.

  Philosophers of probability generally agree that pluralism is not a cop-out but a necessity, most notably formalized by David Lewis's Principal Principle, which dictates how rational agents should align their subjective credences with known objective chances. Your verdicts naturally split into two camps: **aleatory probability** (coins, quantum mechanics), which describes physical propensities or long-run frequencies inherent in the world, and **epistemic probability** (weather, keys, lottery, Higgs), which measures the degree of support evidence provides for a hypothesis. The tension in your view arises not from holding both categories, but from applying them inconsistently to past events.

  You must abandon the verdict that assigning a probability to Caesar crossing the Rubicon is a category mistake while accepting it for the Higgs boson. Both are fixed past truths; the uncertainty is entirely epistemic in both cases. The "5 sigma" claim in physics is technically a frequentist statement about data extremity given a null hypothesis, but your *interpretation* of it as objective confidence in a fact is an epistemic judgment. If you allow statistical evidence to generate a probability for the Higgs, logical consistency demands you allow documentary evidence to generate a probability for Caesar, even if the precise quantification is harder in history. Refusing numbers for history while accepting them for physics is a cultural bias toward scientific quantification, not a logical distinction about probability itself.

  Adopting a Bayesian framework for the epistemic cases unifies your views on weather, lotteries, keys, the Higgs, and Caesar. In this view, probability is an extension of logic measuring how much your evidence supports a conclusion, which naturally handles one-off events without requiring reference classes. This leaves objective chance (propensity) reserved strictly for quantum mechanics and idealized coins, where the world itself appears indeterministic.

  Regarding mathematical conjectures, the epistemic/Bayesian view implies they do have non-trivial probabilities before proof. Since the truth value is fixed (either 0 or 1) but unknown, the probability represents your rational degree of belief based on heuristic evidence, such as numerical verification or coherence with other proven theorems. For example, before Andrew Wiles proved it, the Fermat Estate could rationally assign a high probability to Fermat's Last Theorem being true based on centuries of failed counterexamples. A strict frequentist or logical truth-value view would say the probability is either 0 or 1 regardless of proof, but given your comfort with the Higgs case, you should treat mathematical conjectures as having high epistemic probability prior to demonstration.
