  I'm a journalist covering the rationalist and effective-altruist communities, and I keep encountering the concept of acausal trade — the idea that agents who cannot causally interact (because they reside in separate universes, or are separated by cosmological horizons, or simply cannot send signals) can nonetheless cooperate by each choosing actions that benefit the other, on the reasoning that a sufficiently similar agent in the other's position would be reasoning symmetrically and would reach the same conclusion about what to do. I have a working knowledge of mainstream game theory: Nash equilibria, correlated equilibria, commitment devices, common knowledge of rationality, and the like. I would like you to restate the core claims of acausal trade in that vocabulary, as faithfully as you can. Then give me the residue report: which parts of the idea map cleanly onto standard game-theoretic concepts, which parts you had to distort to make them fit, and which parts have no expression in the game-theory framework at all. I want to know whether acausal trade is genuinely adding something that game theory lacks, or whether it is an exotic restatement of something game theorists already understand under a different name.
