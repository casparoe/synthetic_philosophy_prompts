      *   *Distortions/Stretching:*
          *   *Independence:* Standard GT assumes $P(A \text{ cooperates} | B \text{ cooperates}) = P(A \text{ cooperates})$. AT assumes $P(A \text{ cooperates} | B \text{ cooperates}) \approx 1$. This breaks the definition of a "strategy profile" in normal form games.
