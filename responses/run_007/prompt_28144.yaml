prompt: |-
  I'm a novelist, and I've been reading about these things called Bongard problems — you know, those grids of little line drawings where you've got six on the left and six on the right, and you have to figure out the rule that separates them. The ones Hofstadter goes on about in Gödel, Escher, Bach. The striking thing is how people can often get the concept from just those twelve examples, even when the rule is something fairly abstract. That's basically what I do for a living, isnt it? I give a reader half a dozen gestures — a way of holding a cigarette, a hesitation before answering, the particular mess on someone's kitchen table — and they construct a whole person from it, with motives and a history and a type. So I want you to restate what's philosophically interesting about Bongard problems and concept induction from sparse examples in the vocabulary I actually use as a writer. Talk about characterisation through detail, showing versus telling, the difference between a type and an individual, the way a reader's prior experience with other novels fills in what I leave out, the risk of cliché when the induced concept is too easy. Be as precise as you can. Then give me the residue report: what in the Bongard / concept-induction literature doesn't translate into my vocabulary at all, and is that because my framework is missing something important or because the philosophical problem is less about human concept-learning than it first appears? I want to know whether I've got a genuine insight here or just a loose analogy.

  Oh, and could you end with a one-sentence summary that starts "In brief:" — something I can scribble in my notebook.
