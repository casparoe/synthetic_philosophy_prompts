prompt: |-
  An article I read summarized Hofstadter's idea of superrationality like this: 'In the one-shot prisoner's dilemma, standard game theory says rational players defect, because defection dominates no matter what the other player does. Hofstadter says that's backwards. Truly rational players cooperate, because if you're both truly rational you'll reason the same way and therefore make the same choice. So you can count on your counterpart doing whatever you do: if you cooperate, they cooperate; if you defect, they defect. Since mutual cooperation beats mutual defection, the rational move is to cooperate. Superrationality is basically Kant's categorical imperative applied to games, and it shows the standard prediction is wrong.' Something about this smells off to me, but I can't put my finger on it. I know a little game theory (dominance, Nash equilibrium) but I haven't read Hofstadter. Go through it sentence by sentence and tell me what a game theorist or a careful defender of superrationality would accept, what's a simplification or distortion, and whether the Kant comparison and the claim that superrationality refutes standard game theory actually follow.
reasoning: |-
