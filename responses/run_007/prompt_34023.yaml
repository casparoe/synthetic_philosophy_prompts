answer: |-
  This is a classic philosophical bar fight, and you are right to be suspicious. Your friend's husband is wielding a famous slogan like a club, but he is swinging it blindly. He is conflating three distinct philosophical issues: the logic of moral argument, the metaphysics of moral properties, and the genetic fallacy.

  To give you the committed verdict you asked for, we need to disentangle the slogan "You can't derive an *ought* from an *is*" (often called **Hume's Law**) into its specific component claims. The slogan ranges from a trivial logical truth to a highly controversial metaphysical assertion.

  Here are the three distinct claims hidden inside that slogan, ranked from modest to ambitious, with a verdict on each.

  ### 1. The Logical Thesis (The Modest Claim)
  **The Claim:** In a formally valid deductive argument, you cannot derive a normative conclusion (containing "ought," "good," "right") from a set of premises that are *purely* descriptive (containing only "is," "was," "will be") without at least one normative premise.

  *   **Example:**
      *   *Premise 1:* Stealing causes pain. (Is)
      *   *Conclusion:* You ought not steal. (Ought)
      *   *Verdict:* **Invalid.** You need a bridge premise like "You ought not cause pain."
  *   **The Verdict:** **True (but trivial).**
      This is a rule of basic logic. You cannot get content in a conclusion that isn't present in the premises. If your premises contain no normative vocabulary, your conclusion cannot magically generate it.
  *   **Does it help the husband?** **No.** This thesis only governs the structure of arguments. It does not tell us whether moral truths *exist*, nor does it tell us whether evolutionary facts are *relevant* to moral truths. It just says if you want to argue for an "ought," you need to state your normative standards explicitly.

  ### 2. The Semantic Thesis (The Intermediate Claim)
  **The Claim:** Moral concepts (like "obligation" or "good") cannot be *defined* entirely in terms of natural or descriptive concepts (like "evolutionarily adaptive" or "pleasure-producing"). There is always a conceptual gap.

  *   **Context:** This is G.E. Moore's "Open Question Argument." Even if we agree that "helping kin is evolutionarily adaptive," it still makes sense to ask, "But is it *good*?" If "good" just *meant* "adaptive," the question would be nonsense (like asking "Is a bachelor an unmarried man?").
  *   **The Verdict:** **Defensible, but not decisive.**
      It is true that moral terms function differently than scientific terms; they have a "action-guiding" force that raw data lacks. However, this does not prove moral properties *don't exist*, only that they aren't simple synonyms for biological facts. Ethical Naturalists argue that moral properties can *be* natural properties (like "water is H2O") even if the *concepts* differ.
  *   **Does it help the husband?** **No.** This thesis prevents him from *defining* "moral truth" as "evolutionary success." But he isn't trying to define them; he's trying to *dismiss* them. This thesis doesn't support the idea that evolutionary origins debunk moral truths.

  ### 3. The Metaphysical Thesis (The Ambitious Claim)
  **The Claim:** Descriptive facts (like evolutionary history) have no bearing on the truth of normative claims. The realm of "fact" and the realm of "value" are ontologically separate. Therefore, knowing the causal origin of a belief tells us nothing about its justification.

  *   **Context:** This is the strong metaethical reading. It suggests a "queer" separation between the physical world and the moral world.
  *   **The Verdict:** **False (or at least wildly overstated).**
      While facts don't *automatically* generate values, facts are essential for evaluating values. If I claim "You ought to drink this," the fact that "This is arsenic" is critically relevant. Most modern ethicists reject a hard wall between fact and value. Our moral obligations often depend on facts about well-being, suffering, and agency—all of which are descriptive facts.
  *   **Does it help the husband?** **No.** In fact, this is where he shoots himself in the foot.

  ---

  ### Diagnosing the Husband's Argument

  Your husband friend made two critical errors. He misused Hume's Law, and he committed a different fallacy entirely.

  **1. He Violated Hume's Law Himself**
  Look closely at his inference:
  *   *Premise (Is):* The intuition of parental obligation is a product of kin selection.
  *   *Conclusion (Ought/Value):* Therefore, it is not a "genuine moral obligation."

  Notice that the conclusion is a normative judgment about the status of the obligation. He is deriving a value judgment ("not genuine") from a biological fact ("evolved"). **He is doing the exact thing he accused you of trying to do.** He is deriving an *ought* (you ought not regard this as binding) from an *is* (this evolved). If Hume's Law were a trump card, it silences him too.

  **2. He Committed the Genetic Fallacy**
  This is the real error. The **Genetic Fallacy** is the mistake of confusing the *origin* of a belief with its *justification*.
  *   *Example:* I believe $2+2=4$. I learned this from a teacher who was a drunkard. The *origin* of my belief is a drunkard. Does that make $2+2=4$ false? No.
  *   *Application:* Even if parental love evolved solely to propagate genes, that explains *why we have the feeling*. It does not prove the feeling is *mistaken*. It is entirely possible that evolution shaped us to detect real moral truths because those truths promote survival. Or, it is possible the truths exist independently of how we found them.

  **3. He Confused "Explaining" with "Debunking"**
  He is gesturing toward an **Evolutionary Debunking Argument (EDA)**. A sophisticated EDA argues: "If evolution shaped our morals for fitness rather than truth, we have no reason to trust them."
  However, for this to work, he must assume that evolutionary pressures are *uncorrelated* with moral truth. Why assume that? If "parents ought to care for children" is a moral truth, creatures who believed that would survive better. Evolution would select for the *true* moral belief. He assumes without argument that morality and fitness are opposed.

  ### The Final Verdict

  **Should you apologize or double down?**
  **Double down.**

  You were right in the intuition, even if you didn't have the technical vocabulary at the dinner party. Here is your briefing for the next encounter:

  1.  **Hume's Law is about logic, not ontology.** It says you need normative premises to get normative conclusions. It does not say descriptive facts (like evolution) are irrelevant to moral truth.
  2.  **His argument is self-defeating.** He used a biological fact to argue for a normative conclusion (that the obligation isn't "real"). By his own standard, his argument is invalid.
  3.  **Origin $\neq$ Validity.** The fact that a belief has a causal history (evolution, upbringing, education) does not determine its truth. That is the Genetic Fallacy.

  **The "Committed" Summary:**
  *   **The Logical Claim:** True, but irrelevant to his point.
  *   **The Semantic Claim:** Defensible, but doesn't prove moral skepticism.
  *   **The Metaphysical Claim:** False. Facts and values are intertwined.
  *   **The Husband's Move:** **Fallacious.** He is using a metaethical slogan to win a first-order ethical debate, and he is committing the Genetic Fallacy in the process.

  You don't need to apologize. You identified a gap in reasoning that he tried to paper over with a famous name. The fact that an intuition evolved explains its *presence*, not its *authority*. If he wants to argue parental obligation isn't real, he has to argue *why* it's wrong, not just *where it came from*.
