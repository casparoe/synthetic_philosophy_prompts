  ok so for a seminar on consciousness i need to write up where i stand and then we're gonna tear each other's views apart. here's my current set of commitments:

  (1) physicalism is true — all facts supervene on physical facts
  (2) mary's room shows that she gains new factual/propositional knowledge when she sees red, not just abilities or acquaintance. the ability hypothesis doesn't capture what's going on
  (3) the phenomenal concept strategy is the right way to explain why (2) doesn't refute physicalism, and also explains the explanatory gap
  (4) the conceivability of philosophical zombies is a reliable guide to their metaphysical possibility
  (5) phenomenal properties are type-identical to physical properties, not just token-identical or realized by them

  i want to know wether this hangs together before i present it. which pairs are in tension, which ones only look like they are, and what's the cheapest fix? rank the tensions by severity and be specific about what has to give and why.
