prompt: |-
  I'm a backend engineer who works on distributed systems — health checks, leader election, Raft, quorum, failover, the whole thing. I keep hearing philosophers talk about Nozick's tracking theory of knowledge and how it leads to denying epistemic closure, and something about it nags at me because it feels like it maps onto intuitions I have about monitoring distributed state, but I can't make it precise.

  Restate Nozick's view in the vocabulary I actually use. What does "S knows that p" look like when S is a monitoring subsystem and p is a claim about which node is the leader? I want the four tracking conditions translated into my terms: sensitivity, false positives, false negatives, counterfactual reliability of a health check. Then walk me through why closure fails in my world: why could my monitor know the leader is healthy without knowing a network partition isn't spoofing its heartbeats, even though "leader healthy" entails "no partition spoofing heartbeats"?

  Then the residue report: what in Nozick's view has no clean counterpart in my vocabulary? Is the philosophical dispute about closure more than a fight about what counts as a "relevant alternative" — and does the translation help settle that or just reproduce it in different clothes?

  One more thing: tell me what empirical fact about distributed systems or what philosophical move would most change your verdict about whether the translation is faithful. Where's the weakest link in the analogy?

  Keep it under 500 words.
