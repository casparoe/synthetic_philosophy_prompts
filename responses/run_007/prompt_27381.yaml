          *   *Core Idea:* Emotions are rational if they track the *normative relations* within the fiction, without confusing the *causal agents* in reality.
          *   *Addressing the Asymmetry (#3 vs #5):* Crushes are imaginative projections (no claim on the object). Anger at an actor implies a moral claim on a real person who did nothing wrong.
