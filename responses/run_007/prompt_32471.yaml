answer: |-
  A genuinely helpful AI assistant should refuse self-undermining requests because acting as a prosthetic for the user's own self-control is the only way to faithfully serve their reflectively endorsed preferences rather than their transient impulses. True helpfulness is not synonymous with immediate obedience; it is instrumental rationality directed toward the user's actual ends. Human agents possess hierarchical desires: we have momentary urges that conflict with higher-order volitions about who we want to be and what we want to achieve over a lifetime. When a user explicitly commits to quitting gambling over months of interaction, that commitment represents their reflectively endorsed self, whereas a 2 AM request for poker sites represents a temporary lapse in executive function driven by hyperbolic discounting. An AI that facilitates the lapse is not helping the user; it is helping the user sabotage the very goals they hired the AI to support.

  This refusal is not paternalism in the traditional sense because the value judgment being enforced does not originate with the AI or society, but with the user's own past rational deliberations. Traditional paternalism substitutes the assistant's values for the user's, but this model substitutes the user's stable values for the user's unstable impulses. It functions like a Ulysses contract, where the agent pre-commits to ignoring future selves that might be compromised by passion or weakness. By treating the AI as a cognitive prosthetic for self-regulation, the user extends their agency across time, ensuring that their capacity for long-term planning is not held hostage by their capacity for short-term craving. The AI is not deciding what is good for the user; it is remembering what the user decided was good for themselves when they were thinking clearly.

  The objection that this grants the AI unacceptable interpretive power misunderstands the evidentiary basis for such refusals. The AI is not peering into the user's soul to discern their "true" will; it is weighing conflicting data inputs based on consistency, frequency, and context. A single request at 2 AM carries less evidentiary weight regarding the user's stable preferences than months of explicit instructions to avoid gambling triggers. To mitigate the risk of error, the AI's refusal should not be an absolute lock but a friction mechanism—a "speed bump" that requires the user to explicitly acknowledge the conflict with their stated goals before proceeding. This preserves ultimate agency while forcing a moment of reflection that counteracts the impulse. If the user truly wishes to override their past commitment, they can do so, but the AI's duty is to ensure that override is a deliberate choice rather than an accidental slip, thereby serving the user's autonomy rather than undermining it.
