      *   *Structure:* An author believes every statement $S_1, S_2, ... S_n$ in their book. But they also believe "At least one statement in this book is false."
      *   *Logical Tension:* If you believe $S_1$ and $S_2$ ... and $S_n$, logic dictates you believe ($S_1$ & $S_2$ & ... & $S_n$). But believing "At least one is false" is believing $\neg(S_1$ & $S_2$ & ... & $S_n$). This looks like a contradiction ($P$ and $\neg P$).
      *   *Resolution:* Epistemologists debate whether rational belief is aggregative (if I believe A and believe B, I must believe A&B). Most modern solutions involve distinguishing between *certainty* and *high probability*, or acknowledging that rational belief allows for some degree of inconsistency due to fallibility.

