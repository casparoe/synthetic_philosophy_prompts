          1.  The Love/Freedom Trade-off ((a) vs (d)).
          2.  The Nature of Belief ((c) vs (d)).
          3.  The Distribution of Virtue ((b) vs (e)).
      *   **Severity Assessment:** High, Medium, High.
      *   **Revision Options:**
