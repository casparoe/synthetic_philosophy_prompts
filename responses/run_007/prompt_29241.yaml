  3. A positivist analysis cautions us not to blur the question of whether this was valid university law with the question of whether it was abhorrent. Ignoring the procedural validity of the 1963 hearing risks denying the uncomfortable truth that wicked laws can still be law.
  4. My recommendation would change if it could be established that declaring the expulsions void undermines the legal certainty required for the university's current disciplinary framework. If maintaining the integrity of past procedural validity is deemed more crucial than rectifying this specific moral failure, we should instead award degrees as ex gratia reparations.
  5. Honesty requires us to recognise that a rule devoid of moral purpose cannot claim the authority of law, even if it wore the guise of legality. We therefore restore the students' records to reflect the truth that they were never lawfully expelled.
