answer: |-
  This is one of the most perceptive questions a journalist can ask about theoretical computer science. You have put your finger on the open secret of complexity theory: the definition of "feasible" is a theoretical convenience that often diverges from engineering reality.

  Here is a breakdown of the theory behind the practice, why it persists, and what would happen if the paradigm shifted.

  ### 1. The Theory: The Cobham-Edmonds Thesis
  The specific principle you are asking about is formally known as the **Cobham-Edmonds Thesis** (proposed independently by Alan Cobham and Jack Edmonds in the 1960s). It posits that the class of **Polynomial Time (P)** functions is the correct mathematical abstraction for "efficiently computable" or "feasible" problems.

  It is not a law of physics; it is a **robustness convention**.

  Theorists do not actually believe $n^{50}$ is practical. Instead, they treat Polynomial Time as a *qualitative* boundary rather than a *quantitative* one. The justification rests on three pillars:

  *   **Machine Independence:** If an algorithm is polynomial on a Turing machine, it is polynomial on a modern RAM machine, a quantum computer (mostly), or a neural net. If it is exponential on one, it is exponential on all. The specific exponent might change, but the *class* does not. This makes P a stable property of the problem, not the hardware.
  *   **Closure Under Composition:** If you write a program that calls a polynomial-time subroutine a polynomial number of times, the result is still polynomial. If you allow exponential time, this closure breaks. This makes P a clean algebraic structure for building theories.
  *   **The "Cliff" Metaphor:** Theoreticians argue that the difference between $n^{50}$ and $n^3$ is a matter of engineering optimization, but the difference between $n^{50}$ and $2^n$ is a matter of physical law. $n^{50}$ will eventually beat $2^{n/1000}$ as $n$ grows. Polynomial time represents problems that *scale*; exponential time represents problems that *break*.

  ### 2. Dogma or Pragmatic Convention?
  It is overwhelmingly a **pragmatic convention**, but one that has hardened into dogma due to historical success.

  In the 1970s, when this distinction was codified, there was a striking empirical correlation: problems with polynomial-time algorithms tended to have *good* polynomial algorithms (like $n^2$ or $n^3$), and problems that were NP-complete tended to resist all attempts at efficient solution.

  There is a phenomenon known as **"polynomial parity."** Historically, when a problem is proven to be in P, the initial algorithm is often absurd (e.g., $n^{100}$), but it opens the door for researchers to chip away at the exponent.
  *   **Example:** Linear Programming. The first poly-time algorithm (Ellipsoid method) was theoretically beautiful but practically useless. Years later, Interior Point methods arrived, which were both poly-time and fast.
  *   **Example:** Primality Testing. For decades, we had probabilistic poly-time algorithms. In 2002, the AKS algorithm proved it was in P, but it was slow. In practice, we still use the probabilistic methods.

  Theorists treat P as a proxy for "understanding." If you have a poly-time algorithm, you understand the structure of the problem well enough to avoid brute force. If you only have an exponential algorithm, you are essentially guessing.

  ### 3. What If We Shifted the Measure?
  If the field officially abandoned worst-case polynomial time as the gold standard in favor of **Average-Case Complexity** or **Parameterized Complexity**, the ripple effects would be profound.

  #### A. Textbooks and Education
  *   **Current State:** Textbooks teach a binary world: P (Easy) vs. NP-Complete (Hard).
  *   **New State:** Textbooks would become messier but more honest. They would teach **Fixed-Parameter Tractability (FPT)**.
      *   *Concept:* A problem might be exponential in general, but if a specific parameter $k$ is small, it is fast. (e.g., $O(2^k \cdot n)$).
      *   *Impact:* Students would learn that "NP-Hard" doesn't mean "unsolvable," it means "unsolvable for *all* parameters."
  *   **Average-Case:** Textbooks would have to grapple with probability distributions. The hardest part of average-case complexity is defining what an "average" input looks like. Is a random graph representative of a social network? No. Teaching this requires domain knowledge, not just math.

  #### B. Funding Panels and Research Grants
  *   **Current State:** Grants often favor proving hardness results (showing something is NP-Complete) or finding worst-case poly-time bounds.
  *   **New State:** Funding would shift toward **Algorithm Engineering** and **Heuristics**.
      *   Right now, a researcher who designs a SAT solver that solves NP-Complete instances instantly in practice but has exponential worst-case time is often viewed as an "engineer," not a "theorist."
      *   A shift would legitimize research into *why* certain heuristics work on real-world data (e.g., **Smoothed Analysis**, pioneered by Daniel Spielman). This analyzes how algorithms perform on inputs that are slightly perturbed from worst-case scenarios, bridging the gap between theory and practice.

  #### C. Working Engineers
  *   **Current State:** Engineers often ignore complexity theory because it seems disconnected from reality. They use SAT solvers for verification (an NP-complete problem) because they work on *their* inputs.
  *   **New State:** If theory embraced parameterized complexity, engineers would have a better vocabulary to justify their choices.
      *   Instead of saying, "I know this is NP-Hard, but it works," they could say, "The treewidth of our data graph is bounded by 5, so this is effectively linear time."
      *   It would create a stronger feedback loop. Theorists would analyze the specific structures that make real-world inputs easy, rather than analyzing worst-case inputs that never occur in nature.

  ### The Bottom Line for Your Article
  The distinction between $n^{50}$ and $2^{n/1000}$ is the difference between **asymptotic scalability** and **practical solvability**.

  Complexity theory is not trying to tell you how long your code will run on your server today; it is trying to tell you what will happen when your data grows by a factor of a million.
  *   **Polynomial Time** is a promise that the problem yields to structure.
  *   **Exponential Time** is a warning that the problem resists structure.

  If the field shifted to average-case or parameterized measures, it would lose its clean, machine-independent elegance. It would gain relevance, but it would become context-dependent. A problem might be "easy" for a social network but "hard" for a cryptographic key.

  The practice presupposes that **mathematical robustness is more valuable than practical precision.** It is a map that deliberately omits the terrain's bumps to show you the continents. For a navigator (engineer), the bumps matter. For a geographer (theorist), the continents are the story.
