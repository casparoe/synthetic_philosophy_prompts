  I'm a journalist who covers science and ideas, and I've been trying to get my head around Hofstadter's superrationality. I have a bunch of gut verdicts about one-shot prisoner's dilemmas, and I'd like you to act as a professional philosopher of decision theory and help me find the principle behind them — or tell me which verdicts I have to give up. Think carefully: before you commit, brainstorm the candidate principles (causal decision theory, evidential decision theory, superrationality, something about the other player running my decision procedure) and test each one against the cases below.

  The game is the same in every case: two players independently choose cooperate or defect. If both cooperate, each gets $10. If both defect, each gets $1. If one cooperates and the other defects, the cooperator gets $0 and the defector gets $12.

  My verdicts:

  1. Against my identical twin, raised with me, no communication. We know we'll reason the same way. I cooperate, and I'd think worse of myself for defecting.
  2. Against a total stranger on the other side of the world, no communication. I defect, and I think that's just the rational play.
  3. Against a perfect copy of me made ten minutes ago, same memories. I cooperate, same as the twin case.
  4. Against a stranger whose action is causally wired to mine by a machine — if I cooperate it makes them cooperate, if I defect it makes them defect. I cooperate, but it feels like a different reason, not the we're-in-this-together thing.
  5. Against a stranger where the payoffs are almost symmetric but not quite: if we both cooperate, I get $10 and they get $9. Here the pull to cooperate basically vanishes, even though a dollar shouldnt matter. That bothers me.
  6. The case I cant stop going back and forth on: a one-shot PD against a stranger I've never met, no causal link between us, but I know for a fact they're a perfectly rational agent with exactly the same information about the game, and they know the same about me. Half the time I think superrationality says we both cooperate, since we'd both arrive at the same answer and cooperation is better than defection. The other half I think that's magical thinking and I should defect like in case 2.

  Is there one principle that gets all of these, or close? What does it say about case 6, and which of my verdicts does it force me to drop? And I'd also like to know what your principle says about a case I didn't list: a symmetric one-shot PD against a past version of myself, where my past self already chose and I'm choosing now.
