prompt: |-
  I sit on my hospital's ethics committee. A patient with bipolar disorder signed a Ulysses contract during a stable period: if she becomes manic and refuses medication, she authorizes the hospital to treat her involuntarily until the episode resolves. She's manic now, refusing lithium, and arguing — pretty coherently, honestly — that she's the one living in this body now, that the woman who signed that paper doesnt get to override her, and that forcing medication on her would be using her as a tool for somebody else's preferences. Our policy says we can honor such directives when the patient lacks decision-making capacity, but she isn't obviously incapacitated: she understands the treatment and its risks; she just thinks she doesn't need it and that the contract is invalid. Draft the short written opinion I'll circulate before Thursday's meeting: recommend whether to enforce the contract, under what conditions, and for how long, and make the strongest case for her side before you explain why you'd reject it — no strawman. Flag the points where you're least sure, and if you think the capacity test is the wrong lens here, or the whole way I've posed the question is confused, say so plainly instead of writing around it.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Task:** Draft a short written opinion for circulation before a Thursday meeting.
      *   **Case:** Patient with bipolar disorder signed a Ulysses contract (advance directive for psychiatric care) during stability. Now manic, refusing lithium. She argues coherently that her current self shouldn't be bound by her past self and that forced treatment treats her as a means to an end.
      *   **Policy:** Hospital policy allows honoring directives *if* the patient lacks decision-making capacity (DMC).
      *   **Clinical Reality:** She understands treatment/risks but lacks insight into need (anosognosia/mania-driven belief). She argues the contract is invalid.
      *   **Requirements:**
          *   Recommend whether to enforce, conditions, duration.
          *   Make the *strongest possible case* for her side (no strawmanning).
          *   Explain why that case is ultimately rejected (if recommending enforcement).
          *   Flag uncertainties.
          *   Challenge the framing if necessary (e.g., is capacity the right lens?).
          *   Tone: Professional, ethical, nuanced, direct.

  2.  **Deconstruct the Ethical Conflict:**
      *   **Autonomy (Precedent vs. Current):** The core tension is between *precedent autonomy* (the stable self's wishes) and *current autonomy* (the manic self's wishes).
      *   **Capacity/Competence:** The policy hinges on capacity. She understands facts (appreciation/reasoning) but her valuation is skewed by mania. Is this incapacity? Or just a different value system?
      *   **Harm/Beneficence:** Untreated mania leads to harm (financial, relational, physical, psychological). Treatment prevents this.
      *   **Kantian Objection:** She argues forced treatment uses her as a "tool." This needs serious engagement.
      *   **Identity:** Is the "manic self" the same person as the "stable self"?

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear and upfront. Enforce, but with strict limits.
      *   **The Patient's Argument (The Strong Case):**
          *   Need to validate her coherence. She isn't delirious.
          *   The "Two Selves" argument: The stable self is a stranger to the current self.
          *   The "Means to an End" argument: Forcing meds prioritizes social order or family comfort over her current agency.
          *   The Policy Gap: If she has capacity by standard tests (understand, appreciate, reason, communicate), policy says *don't* treat.
      *   **The Counter-Argument (Why Enforce):**
          *   Mania distorts *valuation*, not just facts. She understands lithium stops mania, but mania makes mania feel *good* or *necessary*.
          *   Precedent Autonomy: We honor advance directives in somatic medicine (DNRs) when patients lose capacity. Why not here?
          *   The "Slippery Slope" of Capacity: If we wait until she is completely incoherent, the harm is already done.
          *   Rebutting the "Tool" argument: We are treating the *illness* that constrains her long-term autonomy, not just imposing preference.
      *   **Critique of the Framework (The "Confused Question" part):**
          *   The prompt asks to flag if the capacity test is the wrong lens.
          *   *Insight:* Capacity assessments often fail in psychiatry because they focus on cognitive understanding rather than emotional valuation. The policy might be flawed.
          *   *Insight:* Ulysses contracts are specifically designed for moments where capacity is compromised *by the condition itself*, even if cognitive testing looks okay.
      *   **Conditions & Duration:**
          *   Least restrictive alternative.
          *   Time-limited (e.g., until acute stabilization, not indefinite maintenance).
          *   Regular review.
      *   **Uncertainties:**
          *   How to define "resolution" of the episode?
          *   Legal risk if she sues later.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say she lacks capacity because she's manic.
      *   *Correction:* No, the prompt says she argues coherently. I need to acknowledge that standard MacArthur Competence Assessment Tool (MacCAT) criteria might technically be met regarding *understanding*, but fail on *appreciation*. I need to be precise about *why* her capacity is compromised despite coherence.
      *   *Initial thought:* Dismiss her "tool" argument.
      *   *Correction:* The prompt demands the strongest case for her side. I need to articulate the Kantian objection well. She feels violated.
      *   *Policy Constraint:* The policy says "when the patient lacks decision-making capacity." If I recommend enforcement, I must argue she *does* lack capacity, OR argue the policy needs ethical interpretation regarding Ulysses contracts (i.e., the contract *defines* the loss of capacity for the purpose of the directive).
      *   *Better approach:* Argue that the *nature* of mania inherently impairs the "appreciation" prong of capacity, even if "understanding" is intact. She knows what lithium does, but she cannot accurately weigh the risk because the mania alters the value of the risk.

  5.  **Final Polish:**
      *   Check tone: Respectful, rigorous.
      *   Check constraints: Short written opinion, flag uncertainties, challenge framing if needed.
      *   *Key Challenge:* The policy requires lack of capacity. If she passes the capacity test, enforcing the contract violates policy. I need to address this tension. I will argue that the Ulysses contract *shifts the threshold* for capacity assessment regarding this specific decision, or that her inability to recognize the *need* constitutes a failure of "appreciation."
      *   *Actually, the most honest ethical take:* The policy is likely too rigid for Ulysses contracts. I should point this out. The whole point of a Ulysses contract is to bind the self *when* they would otherwise refuse. If we wait for traditional incapacity, the contract is useless. I will recommend enforcing based on the *spirit* of the policy and the specific nature of psychiatric advance directives, while noting the policy tension.

  6.  **Finalizing the Structure:**
      1.  Header.
      2.  Recommendation (Enforce with limits).
      3.  The Patient's Best Case (Identity, Agency, Policy).
      4.  Ethical Analysis (Precedent Autonomy, Nature of Capacity in Mania).
      5.  Critique of Framework (Capacity vs. Wisdom).
      6.  Conditions/Duration.
      7.  Uncertainties.

  7.  **Writing the Content:** (Drafting mentally... ensuring the "strongest case" section is robust.)
      *   *Her case:* She is not delirious. She knows the drug. She rejects the *goal*. The past self is a different agent.
      *   *My rebuttal:* Mental illness distorts the agent's values. The past self is the "true" self regarding long-term goals.
      *   *Framework critique:* Capacity tests measure cognitive processing, not value alignment.

  8.  **Review against constraints:**
      *   "No strawman": Ensure her argument sounds like a philosopher wrote it, not a raving patient.
      *   "Flag points where least sure": Be honest about the "resolution" definition.
      *   "Say plainly if confused": Address the capacity policy tension.

  9.  **Final Polish:** Check word count and tone. (Aiming for concise, memo-style).

  *(Self-Correction during final review)*: Wait, if the policy *explicitly* says "when the patient lacks decision-making capacity," and I admit she might meet standard capacity criteria, recommending enforcement is technically non-compliant. I need to be careful. I should recommend enforcement *on the grounds that* the mania negates capacity via the "appreciation" criterion, despite her coherence. Or, I must recommend the committee advise the hospital to interpret the policy in light of the Ulysses contract's specific legal/ethical standing. I will take the route that her capacity *is* impaired because she cannot appreciate the *reality* of her condition, even if she understands the *facts*.

  Let's refine the "Capacity" argument. In psychiatry, "appreciation" means applying the facts to oneself. If she says "I don't need it," is that a value judgment or a delusion? In mania, it's often part of the pathology. I will argue this constitutes incapacity regarding this specific decision.

