answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Ulysses Contract Enforcement (Patient ID: [Redacted])

  **Recommendation**
  I recommend the committee authorize enforcement of the Ulysses contract, permitting involuntary administration of lithium, subject to strict conditions: treatment must be limited to the minimum dosage required for acute stabilization, reviewed every 72 hours, and cease immediately upon the attending psychiatrist's determination that the manic episode has resolved.

  **The Patient's Argument (Strongest Case)**
  We must not dismiss the patient's current objection as mere symptomatology. Her argument is ethically robust:

  1.  **Identity and Precedent Autonomy:** She posits that the "stable self" who signed the contract and the "manic self" currently refusing treatment are effectively different moral agents. The stable self cannot consent on behalf of the current self any more than a parent can consent for an adult child. To bind her now is to privilege a past version of her identity over her present lived experience.
  2.  **The "Means to an End" Objection:** She argues that enforcing the contract treats her current consciousness as a vessel to be managed for the comfort of her family or the hospital's risk profile. If she currently values the manic state (or the autonomy of refusing) higher than the stability the contract promises, overriding her uses her as a tool to satisfy *our* definition of health, not hers.
  3.  **Policy Adherence:** Our policy hinges on decision-making capacity (DMC). She understands the nature of lithium, its side effects, and the consequences of refusal. She is coherent. If we enforce treatment while she meets DMC criteria, we are effectively rewriting policy to say "patients can waive their right to refuse treatment even when competent," which sets a dangerous precedent for bodily autonomy.

  **Ethical Analysis & Rebuttal**
  Despite the strength of her position, I believe we must enforce the contract, though not without reservations regarding our policy framework.

  *   **The Nature of Psychiatric Capacity:** Standard DMC assessments measure cognitive processing (understanding, reasoning), but often fail to measure *valuation*. Mania pathologically alters the weighting of risks and benefits. She understands *that* lithium reduces mania, but the illness prevents her from accurately appreciating *why* that is medically necessary. In this specific context, the inability to recognize the need for treatment due to the pathology itself constitutes a failure of the "appreciation" prong of capacity, even if coherence remains.
  *   **Precedent Autonomy as Protection:** We honor advance directives in somatic care (e.g., DNR orders) when a patient loses capacity. We should not hold psychiatric care to a lower standard of respect for prior wishes. The Ulysses contract is the stable self's mechanism to protect her long-term autonomy from the temporary tyranny of the episode. Ignoring it renders such directives meaningless, as they are designed precisely for moments when the patient *would* refuse.
  *   **Rebutting the "Tool" Objection:** We are not using her as a tool for social convenience; we are intervening to restore the conditions necessary for her own agency. Untreated mania often leads to irreversible harms (financial ruin, relationship destruction, physical danger) that her stable self explicitly sought to avoid. Enforcing the contract is an act of fidelity to her long-term values, not an imposition of ours.

  **Critique of the Framework**
  I must flag that the question "Does she have capacity?" may be the wrong lens.
  Our policy requires incapacity to honor the directive. However, the philosophical purpose of a Ulysses contract is to bind the self *even if* they appear competent during the episode. If we wait until she is incoherent or delirious to treat, we have failed the preventative purpose of the contract.
  *   **Confusion Point:** We are stretching the definition of "incapacity" to fit the policy. It would be more honest to acknowledge that Ulysses contracts operate on a different ethical axis than standard informed consent—they are a voluntary waiver of the right to refuse *contingent on diagnosis*, not contingent on real-time capacity assessment. I am recommending enforcement, but I am uncomfortable bending the capacity test to justify it.

  **Uncertainties**
  1.  **Defining Resolution:** "Until the episode resolves" is clinically vague. Who determines when the "manic self" has receded enough to return veto power to the patient? We need clear biomarkers or behavioral thresholds, not just "clinical impression."
  2.  **Trust Implications:** If we override her coherent refusal, we risk damaging the therapeutic alliance long-term. She may view future hospitalizations as punitive, discouraging help-seeking in the future.

  **Conclusion**
  The patient's argument regarding identity is philosophically sound but clinically dangerous in the context of severe bipolar disorder. We should enforce the contract to prevent imminent harm and honor her precedent autonomy, but we must simultaneously recommend a policy review. We need a protocol for Ulysses contracts that does not rely on retrofitting capacity assessments to justify enforcement.

  **Action:** Vote to authorize treatment under the conditions listed above.
