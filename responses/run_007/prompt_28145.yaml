answer: |-
  This is a classic collision between two competing logics of democratic boundary-setting: the **all-subjected principle** (who is permanently subject to the coercive power of the state?) versus the **all-affected interests principle (AAIP)** (who will suffer the consequences of this specific decision?).

  Your friend's argument is a textbook application of AAIP. The government's actual franchise design was a textbook application of the *all-subjected* principle (specifically, the existing parliamentary electorate). Using the Brexit referendum as a case study reveals exactly where AAIP is powerful as a critique, and where it fractures as an administrative rule.

  Here is the breakdown of how the all-affected interests principle applies to the Brexit franchise, where it holds up, and where it collapses.

  ### 1. Defining "Affected": The Crucial Variable
  The AAIP is useless without a metric for "affectedness." In the Brexit case, three definitions were in play:

  *   **Causal/Legal Affectedness:** Did the decision directly alter your legal status or rights? (Strongest case for EU nationals).
  *   **Temporal Affectedness:** Will the consequences outlast your current capacity to vote? (Strongest case for 16–17-year-olds).
  *   **Membership Affectedness:** Does the decision alter the entity to which you belong? (Strongest case for UK citizens, including expats).

  To make your friend's argument work theoretically, "affected" must mean **direct legal consequence regarding residency and rights.** If "affected" means "economic ripple effects," the demos explodes (see section 4). If "affected" means "change in constitutional status," EU nationals living in the UK have a stronger claim than UK nationals living in Spain, because the former faced immediate loss of residency rights, while the latter faced potential loss of healthcare/access (which was contingent on future negotiation).

  ### 2. Where AAIP Explains (or Validates) the Actual Franchise
  Surprisingly, AAIP does not condemn the entire franchise. It validates specific inclusions that the *all-subjected* principle struggles with.

  *   **Gibraltar:** Under a strict *all-subjected* principle (UK Parliament sovereignty), Gibraltar could arguably be excluded as a Overseas Territory with its own parliament. AAIP validates their inclusion easily: the decision directly affected their border with Spain and their EU status. The actual franchise got this right by AAIP standards.
  *   **UK Expats (The 15-Year Rule):** This is ambiguous. AAIP suggests that if a decision changes your citizenship rights (consular protection, right to return), you are affected. However, AAIP also weighs *intensity*. A retiree in Spain who hasn't paid UK tax or used UK services in 12 years is less "affected" by the UK's economic future than a resident. The 15-year cutoff is an arbitrary administrative line that AAIP finds messy, but AAIP does not inherently demand their exclusion.
  *   **Commonwealth & Irish Citizens:** This is the strongest alignment. These groups are *subjected* to UK law (they can vote in UK elections) and are *affected* by the outcome. AAIP is happy with their inclusion because they reside within the jurisdiction and are subject to the coercive power of the state implementing the result.

  ### 3. Where AAIP Condemns the Actual Franchise
  This is where your friend's argument lands. There are two major exclusions that AAIP highlights as democratic deficits.

  *   **EU Nationals Resident in the UK:** This is the AAIP "smoking gun."
      *   **The Theory:** These individuals were subject to the outcome (loss of free movement, residency rights, potential deportation) without being subjects of the sovereign (UK citizens).
      *   **The AAIP Verdict:** A decision that fundamentally alters the legal status of a resident population excludes them at its peril. Under AAIP, a French national living in London for 20 years was more "affected" than a British national living in Dubai for 14 years. The actual franchise prioritized *status* (citizenship) over *impact* (residency/rights). AAIP says this was illegitimate.
  *   **16–17 Year Olds:**
      *   **The Theory:** Brexit is a long-term structural change. 16-year-olds will live with the consequences longer than 70-year-olds.
      *   **The AAIP Verdict:** AAIP generally favors lowering the voting age for high-stakes, long-term decisions (as seen in the Scottish Independence Referendum). Excluding them creates a "taxation without representation" dynamic regarding their future life chances.

  ### 4. The Boundary Problem: Does AAIP Fall Apart?
  Here is the hard theoretical truth. If you apply AAIP rigorously to Brexit, it risks collapsing into the **"everyone-affects-everyone" problem.**

  *   **The Ripple Effect:** Brexit affected global supply chains. A farmer in New Zealand or a banker in New York was "affected" by Brexit. If AAIP is the *only* rule, the referendum should have been global.
  *   **The Fix:** To make AAIP usable, theorists usually add a **proximity constraint**. We must distinguish between *being affected* and *being implicated*.
      *   *Implicated:* You are part of the decision-making structure (Citizens/Residents).
      *   *Affected:* You suffer the consequences.
      *   AAIP works best when it overlaps with *reciprocity*. EU nationals in the UK were implicated (they lived under the laws) and affected. UK expats were implicated (citizens) but less affected (daily life). EU nationals outside the UK were affected (trade) but not implicated.

  **The Verdict on Usability:** In the Brexit case, AAIP is excellent at identifying **injustices** (the exclusion of EU nationals), but terrible at drawing **boundaries**. It cannot tell you where the line stops. It requires a secondary principle (usually residency or citizenship) to stop the demos from becoming infinite. The UK government used *citizenship* as the boundary; AAIP suggests *residency + legal impact* would have been more legitimate for this specific vote.

  ### 5. Honesty Check: The 16–17 Year Old Question
  You asked to be honest about where AAIP has nothing to say. Here it is: **AAIP cannot determine the age of competence.**

  AAIP says "all affected interests." It assumes the "all" are capable of holding an interest. It relies on a separate theory of **capacity** to determine *when* a person can exercise that interest.
  *   AAIP can tell you that 16-year-olds have a *stake* in the future.
  *   AAIP *cannot* tell you if they have the *cognitive maturity* to vote.

  If you argue 16-year-olds should have voted, you are actually combining AAIP (they are affected) with a **competence principle** (they are mature enough). The Scottish referendum included them not just because they were affected, but because the Scottish Parliament decided 16 was the age of political capacity. AAIP is silent on the age threshold; it only lights up the stake. Therefore, using AAIP alone to demand votes for 16-year-olds is theoretically incomplete. It needs a theory of development to finish the argument.

  ### 6. Conclusion: What the Case Shows
  The Brexit franchise case study reveals that the referendum was designed using the **all-subjected principle** (who belongs to the UK polity?) but criticized using the **all-affected principle** (who gets hurt by the decision?).

  *   **Your Friend:** Is theoretically correct that excluding EU nationals created a democratic deficit regarding *rights*. AAIP validates their grievance.
  *   **The Government:** Was constitutionally consistent. Referendums in the UK are advisory to Parliament; therefore, the franchise matched the Parliamentary electorate (who constitutes the sovereign people).

  **Final Judgment on the Principle:**
  The all-affected interests principle is **usable as a critique, but not as a blueprint.**
  *   **As a critique:** It successfully exposes the exclusion of EU nationals as a failure of democratic inclusion regarding fundamental rights.
  *   **As a blueprint:** It falls apart without arbitrary cutoffs. If you let AAIP run wild, you either vote globally (due to economic interdependence) or you vote based on intensity of feeling (which is unmeasurable).

  The Brexit case shows that for a referendum to be "legitimate" under AAIP, you cannot use AAIP alone. You need a hybrid model: **Residency** (to solve the boundary problem) + **Legal Impact** (to solve the EU national exclusion) + **Capacity** (to solve the age question). The actual franchise ignored the second and debated the third, which is why the argument persists. Your friend isn't just having "vibes"; they are identifying a specific failure to align the *demos* with the *scope of the decision*, which is the core promise of democratic theory.
