answer: |-
  Your diagnosis is sharp, and I think you are largely correct: the stalemate is not primarily a factual disagreement about the history of science, though both sides dress it up as one. If it were merely factual, better historiography would have settled it by now. Instead, we see historians of science being recruited as expert witnesses for both sides, often interpreting the same cases (like the ether or phlogiston) in contradictory ways.

  At bottom, this is a **meta-epistemological disagreement disguised as a historical one**, compounded by a **semantic disagreement about reference**.

  Here is a breakdown of why the impasse persists, what kind of disagreement it actually is, and whether there is any hope of resolution.

  ### 1. The Diagnosis: Three Layers of Disagreement

  You hypothesized that the dispute is about the burden of proof in Inference to the Best Explanation (IBE). That is accurate, but it is the surface manifestation of deeper divergences. I would categorize the disagreement into three stacked layers:

  **A. The Semantic Layer (Reference and Truth)**
  Before we can argue about whether past theories were *false*, we must agree on what it means for their terms to *refer*.
  *   **The Realist** generally assumes a causal theory of reference or a charitable interpretation (e.g., Kitcher, Psillos). They argue that when Lavoisier talked about "oxygen" and Priestley talked about "dephlogisticated air," there is enough overlap in causal interaction that Priestley was referring to oxygen, albeit with false beliefs. This allows the Realist to claim *approximate truth*.
  *   **The Anti-Realist** (following Kuhn or Laudan) often implies a descriptivist view or emphasizes incommensurability. If the theoretical framework changes, the reference shifts. If phlogiston doesn't refer, the theory isn't "approximately true"; it is simply false or meaningless regarding ontology.
  *   **The Impasse:** If the Anti-Realist defines "truth" as strict correspondence and "reference" as framework-dependent, the PMI is unstoppable. If the Realist defines "truth" as structural preservation and "reference" as causal, the NMA holds. They are using different semantic rulebooks.

  **B. The Epistemological Layer (The Status of IBE)**
  This is your specific point about the burden of proof.
  *   **The Realist** treats IBE as a fundamental rule of scientific rationality. To deny that success implies truth is, to the Realist, to undermine the very reasoning used to construct the theories in the first place. They argue the Anti-Realist is "parasitic" on realist reasoning.
  *   **The Anti-Realist** (especially Constructive Empiricists like Van Fraassen) treats IBE as a pragmatic virtue, not a truth-tracking mechanism. They argue that preferring a theory because it is "lovely" (explanatory) does not make it "likely" (true).
  *   **The Impasse:** The Realist asks, "What else explains success?" (demanding a metaphysical explanation). The Anti-Realist replies, "Evolutionary selection of instruments" or "Methodological filtering" (offering a non-metaphysical explanation). The Realist views this as moving the goalposts; the Anti-Realist views the Realist's demand as question-begging.

  **C. The Modal Layer (The Space of Alternatives)**
  This is where Kyle Stanford's "New Induction" (2006) updated Laudan.
  *   **The Dispute:** It is not just that past theories were false; it is that past scientists *could not conceive* of the true theories (e.g., Newton couldn't conceive of general relativity).
  *   **The Impasse:** The Realist argues that current methods are radically better than Newton's, so we are now in a position to conceive the truth. The Anti-Realist argues that this is precisely what past scientists thought too. This is a disagreement about the *modal status* of current science—are we at the "end of history" or just another step?

  ### 2. Are They Answering the Same Question?

  You asked if they are answering the same question. **No, they are not.**

  *   **The No-Miracles Argument** is an argument *for* ontology. It asks: "What must the world be like for our theories to work?"
  *   **The Pessimistic Meta-Induction** is an argument *about* reliability. It asks: "What track record do our methods have for delivering ontology?"

  The Realist is making a **transcendental argument** (success presupposes truth), while the Anti-Realist is making an **inductive generalization** (past failure predicts future failure). You cannot directly refute a transcendental claim with an induction without first rejecting the transcendental premise. This is why "selective realism" (distinguishing working posits from idle wheels) often fails to satisfy Anti-Realists; the Anti-Realist denies we have a non-circular way to identify the "working parts" until *after* the theory is superseded.

  ### 3. Can the Impasse Be Broken?

  Is this a debate where the two sides are fated to talk past each other indefinitely? **Mostly, yes.** But there are three potential avenues that could shift the terrain, even if they don't produce a "winner."

  **A. Formal Epistemology (Bayesianism)**
  Some philosophers (like Colin Howson or Peter Magnus) have tried to formalize the NMA and PMI using Bayesian probability.
  *   *The Hope:* To show that the NMA commits the "base rate fallacy." Even if $P(Success | Truth)$ is high, if the prior probability of a theory being true $P(Truth)$ is low (based on the PMI), then $P(Truth | Success)$ remains low.
  *   *The Limit:* This just pushes the disagreement back to the assignment of priors. Realists assign higher priors to successful theories; Anti-Realists assign higher priors to the historical trend of falsity. It formalizes the stalemate rather than breaking it.

  **B. Local Realism (The "Species" Problem)**
  Recent moves (by Anjan Chakravartty and others) suggest abandoning "Global Scientific Realism."
  *   *The Shift:* Instead of asking "Is *science* true?", we ask "Is *this specific detection claim* true?" (e.g., Hacking's "If you can spray them, they are real").
  *   *The Potential:* This dissolves the PMI by noting that the history of science is not uniform. The history of *optics* is different from the history of *caloric*. If realism is a patchwork of specific ontological commitments rather than a stance toward "Science" as a monolith, the PMI loses its inductive force because the sample size is no longer homogeneous.
  *   *The Risk:* Anti-Realists argue this concedes the point. If you only believe in the entities you can manipulate, you are no longer a Scientific Realist; you are an Entity Realist or Pragmatist.

  **C. Pragmatic Dissolution**
  The most likely "resolution" is a Rortyan dissolution. If both sides agree on which experiments to run, which predictions to trust, and how to fund research, does the metaphysical distinction matter?
  *   However, Realists argue it *does* matter for theory choice in underdetermined scenarios. If two theories are empirically equivalent, the Realist chooses the one that fits better with established ontology; the Anti-Realist suspends judgment. This practical divergence keeps the debate alive.

  ### Conclusion

  Your hypothesis is correct: the debate is not about the history of science. It is a **clash of epistemic values**.

  *   The **Realist** values **explanatory depth** and is willing to risk metaphysical error to avoid instrumentalism.
  *   The **Anti-Realist** values **epistemic caution** and is willing to sacrifice explanatory depth to avoid dogmatism.

  Unless one side concedes their core epistemic value (which they won't, because it defines their philosophical identity), the debate will remain in stable equilibrium. The impasse is not a failure of philosophy; it is the correct reflection of a genuine tension in the scientific enterprise itself: the tension between the drive to explain *why* nature works (Realism) and the humility to admit we only know *that* it works (Anti-Realism).

  The most productive path forward is likely **Local Realism**. By fracturing the monolithic concept of "Science," we can admit that the PMI holds for speculative cosmology but fails for molecular biology. This doesn't satisfy the systematic urge of the metaphysician, but it respects the historical data better than the global versions of the debate.
