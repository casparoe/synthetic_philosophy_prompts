  **Where do you (0.4) and your friend (0.9) likely disagree?**

  Your disagreement almost certainly houses in **Sub-question 1 (Empirical Validity)** and **Sub-question 4 (Neurological Timing)**.

  *   **Your Friend (0.9 Credence in "No"):**
