answer: |-
  You are right to be suspicious. The move you are describing—treating logical uncertainty as a subspecies of empirical uncertainty—is often called the **"Logical Omniscience" assumption** (or the attempt to dodge it via analogy). While it is pragmatically useful for heuristic reasoning, it is **foundationally broken**.

  The analogy is not just "doing a lot of work"; it is smuggling in assumptions that contradict the axioms of the very probability theory it claims to preserve. If you take standard Bayesianism seriously, you cannot have non-trivial credences in logical truths. To have them, you must break the Bayesian machinery.

  Here is the audit you asked for.

  ### 1. The Mapping Table

  Proponents of the "Standard Bayesian" view of logical uncertainty propose the following correspondences:

  | Empirical Domain (Rain) | Logical Domain (Riemann Hypothesis) |
  | :--- | :--- |
  | **Hypothesis ($H$)** | "It will rain." | "RH is true." |
  | **Sample Space ($\Omega$)** | Set of possible physical worlds. | Set of mathematical models / structures. |
  | **Observation ($E$)** | Looking out the window / Sensor data. | Finding a proof / Running a computation. |
  | **Likelihood ($P(E|H)$)** | Probability of seeing rain given climate state. | Probability of finding a proof given truth value. |
  | **Prior ($P(H)$)** | Base rate of rain in this season. | Aesthetic / heuristic prior on truth. |
  | **Conditionalization** | Bayes' Rule: $P(H|E) \propto P(E|H)P(H)$. | Update on proof: $P(H|\text{Proof}) = 1$. |
  | **Calibration** | Frequency of rain matches forecast. | Frequency of theorems matches credence. |
  | **Market** | Prediction market on events. | Market on sentences (Logical Induction). |

  ### 2. The Fatal Disanalogies

  The mapping looks clean until you inspect the ontology and the axioms. Here are the three points where the analogy snaps, ranked from "problematic" to "fatal."

  #### A. The Ontology of Possibility (The "Impossible World" Problem)
  *   **Empirical:** In the sample space for "Rain," there are worlds where it rains and worlds where it doesn't. Both are *ontologically possible*.
  *   **Logical:** If RH is true (in ZFC), there is **no** mathematical structure consistent with ZFC where RH is false. The "worlds" where RH is false are *logically impossible*.
  *   **The Break:** Standard probability theory is defined over a sigma-algebra of *possible* events. Assigning a probability $0 < P(\text{RH}) < 1$ requires treating logically impossible worlds as if they were epistemically possible. Standard Bayesians call this "incoherent." To make the analogy work, you have to redefine "possible world" to mean "world consistent with what I have *currently proved*," not "world consistent with the axioms." This shifts the foundation from logic to psychology.

  #### B. The Omniscience Requirement (The Axiomatic Break)
  *   **Empirical:** $P(A \land B) \le P(A)$ holds.
  *   **Logical:** If $A \vdash B$ (A proves B), then in standard probability, $P(B) \ge P(A)$. If you know the axioms, and $A$ is an axiom, then $P(A)=1$. If $A \vdash B$, then $P(B)=1$.
  *   **The Break:** This is the **Logical Omniscience Problem**. If you adhere to the Kolmogorov axioms and you know the rules of inference, your credence in every theorem must be 1 and every falsehood 0, *regardless of whether you have computed the proof*.
  *   **Why it matters:** The "Standard Bayesian" move tries to have it both ways: keep the axioms but claim ignorance. You cannot. To have uncertainty about logic, you must violate the probability axioms (specifically, the requirement that logically equivalent statements have equal probability). The conclusion that "no special treatment is needed" is false because standard treatment *forbids* the phenomenon you are trying to model.

  #### C. The Nature of Evidence (Computation vs. Observation)
  *   **Empirical:** Observations are (usually) conditionally independent given the hypothesis. Seeing rain today doesn't logically force rain tomorrow, though it correlates.
  *   **Logical:** Proofs are **deductively entangled**. If you find a proof of Lemma A, and Lemma A implies Theorem B, your credence in B *must* update to 1 immediately.
  *   **The Break:** In the empirical case, you can condition on data without knowing all the consequences of that data. In the logical case, "conditioning on a proof" implies you know all the consequences of that proof. But if you knew all consequences, you wouldn't be uncertain about Theorem B in the first place.
  *   **The "False Proof" Issue:** You noted this. In empirical land, you can have false positives (mirage of rain). In logic, a "proof of $\bot$" is impossible in a consistent system. Yet, a bounded agent *must* assign non-zero probability to the possibility that they have made a mistake in checking a proof. Standard Bayes has no clean way to model "I think I proved X, but I might have messed up the syntax," without introducing a separate error model that looks nothing like standard conditionalization.

  ### 3. Does the Conclusion Survive?

  **No.** The conclusion that "decision-making under logical ignorance needs no special treatment" does not survive the audit.

  If you try to run standard Expected Utility (EU) maximization with a "logical prior" that isn't omniscient:
  1.  **Dutch Books:** You are vulnerable to Dutch Books. A trader can sell you a bet on $A$ and buy a bet on $B$ where $A \vdash B$, knowing you price them inconsistently because you haven't seen the proof yet.
  2.  **Dynamic Inconsistency:** Your future self (who finds the proof) will have different preferences than your current self, not because of new *information* about the world, but because of new *computation*. Standard Bayesian updating assumes the sample space is fixed; logical updating changes the topology of the sample space (collapsing impossible worlds).
  3.  **Computational Cost:** Standard EU ignores the cost of thinking. In logical uncertainty, the "observation" (computing the proof) is expensive. A decision theory that doesn't account for the *value of computation* (VOI) will either compute forever or act on garbage priors.

  ### 4. The Better Picture: What is a Credence in a Theorem?

  If the analogy breaks, what should replace it? There are three leading frameworks that take the disanalogies seriously.

  #### A. Logical Induction (The Market Analogy Refined)
  This is the most rigorous modern treatment (Garrabrant et al., 2016). It accepts that you cannot be a coherent Bayesian in the short term.
  *   **The Picture:** Credences are prices in a prediction market.
  *   **The Fix:** It relaxes the "No Dutch Book" criterion. Instead of "No Dutch Book *ever*," it requires "No *polynomial-time* Dutch Book *in the limit*."
  *   **Implication:** You are allowed to be incoherent (e.g., $P(A) \neq P(B)$ even if $A \iff B$) as long as no efficient trader can bankrupt you before you figure it out. This formalizes the idea that logical uncertainty is a resource-bounded phenomenon.

  #### B. Counterpossible Reasoning
  This approach (from metaphysics and epistemology) treats logical uncertainty as reasoning about **impossible possible worlds**.
  *   **The Picture:** We construct "epistemic possibilities" that violate logical laws but are not ruled out by the agent's current knowledge.
  *   **The Fix:** We use non-classical logic or hyperintensional semantics. $P(\text{RH})$ is not a measure over models of ZFC, but a measure over *conceivable* structures, some of which might violate ZFC in ways the agent hasn't detected.
  *   **Implication:** Credence is not about truth; it's about *derivability within a bounded system*.

  #### C. Bounded Rationality / Algorithmic Probability
  *   **The Picture:** Probability is not a static state of belief but a output of a specific algorithm with limited time/memory.
  *   **The Fix:** $P(\phi)$ is the output of a theorem prover after time $t$.
  *   **Implication:** Decision theory must include the cost of computation. You don't maximize $E[U]$; you maximize $E[U] - \text{Cost}(\text{Computation})$. This explains why you act on "80% sure" before proving it: the cost of proof exceeds the expected gain of certainty.

  ### 5. Summary Verdict

  The move you are critiquing is a **category error**.

  *   **Empirical Uncertainty** is about *indexical* location (which world am I in?).
  *   **Logical Uncertainty** is about *computational* location (where am I in the deduction tree?).

  Treating them as the same is like treating "I don't know what's in this box" the same as "I don't know what $349 \times 982$ is." The first is resolved by looking (low cost, external). The second is resolved by calculating (high cost, internal).

  **The Audit Result:**
  1.  **Mapping:** Superficially holds, ontologically fails.
  2.  **Fatal Flaw:** Standard probability axioms enforce logical omniscience. You cannot have non-trivial logical credences without violating Kolmogorov.
  3.  **Conclusion:** The claim that "no special treatment is needed" is false. Special treatment (Logical Induction, Bounded Rationality, or Counterpossibles) is *required* to avoid incoherence.
  4.  **Better Picture:** Credence in a theorem is not a degree of belief in a truth-value; it is a **price in a resource-bounded market** that reflects the current state of computation, not the state of the world.

  If someone tells you logical uncertainty is just empirical uncertainty, they are implicitly assuming they have infinite compute. If they admit they don't, they must abandon standard Bayesianism.
