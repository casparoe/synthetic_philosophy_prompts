prompt: |-
  I am a philosophy professor, and I have been asked to lead a single two-hour session on the paradox of deontology for a group of advanced law and public-policy students in an interdisciplinary ethics seminar. They are capable, but they have mostly met consequentialism and deontology as slogans, and I expect them to arrive treating the paradox either as a decisive refutation of deontological constraints or as something that dissolves once one distinguishes killing from letting die; a few will probably want to settle it with a threshold. I am not asking for the explanation itself, but for the pedagogical architecture of the session. In particular, I need to know the order in which the ideas must be introduced and what depends on what—for example, whether the agent-relative/agent-neutral distinction should be laid down early as scaffolding or withheld until the students have felt the force of the puzzle—and the single case or scenario that should carry the whole discussion, together with what it must include and avoid. I have considered the transplant case and the standard trolley, but I suspect both import confounds; tell me whether that suspicion is right and what would serve better.

  The aim of the session is for the students to leave seeing the paradox as a genuine internal problem about the rational structure of deontological constraints, not as a knock-down objection or a verbal quibble. Please also map the misconceptions this particular audience is likely to bring or form and the exact point in the sequence at which each should be headed off; give me one question to put to them near the end whose answer would show whether they have actually grasped the agent-relative/agent-neutral distinction rather than merely learned the phrase; and tell me what I should openly decline to settle in the time available and how to mark that boundary without making the view look evasive.
reasoning: |-
  Here's a thinking process that leads to the suggested pedagogical architecture:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy Professor.
      *   **Audience:** Advanced law and public-policy students (interdisciplinary ethics seminar). Capable, but treat ethical theories as slogans.
      *   **Topic:** The Paradox of Deontology (Scheffler's formulation primarily).
      *   **Duration:** Single two-hour session.
      *   **Goal:** Students should see the paradox as a *genuine internal problem about the rational structure of deontological constraints*, not a refutation or a verbal quibble.
      *   **Specific Needs:**
          *   Pedagogical architecture (order of ideas, dependencies).
          *   Decision on Agent-Relative/Agent-Neutral distinction (early scaffolding vs. late revelation).
          *   Selection of the *single case/scenario* (avoiding Transplant/Trolley confounds).
          *   Mapping misconceptions & when to head them off.
          *   One diagnostic question for the end (testing grasp of Agent-Relative/Agent-Neutral).
          *   What to explicitly *not* settle (boundary marking).

  2.  **Deconstruct the "Paradox of Deontology":**
      *   What is it? It's the tension between the *goal* of morality (minimizing violations of rights/wrongdoing) and the *constraint* of morality (not violating rights yourself, even to prevent more violations by others).
      *   Why is it a paradox? If killing is wrong because it harms victims, why shouldn't I kill one to save five? If I'm forbidden to kill, it seems I'm prioritizing my own "clean hands" over the actual victims' lives.
      *   Key Distinction: Agent-Relative (I must not kill) vs. Agent-Neutral (Killing must be minimized).

  3.  **Address the Case/Scenario Selection:**
      *   *User's Suspicion:* Transplant and Trolley import confounds.
      *   *Analysis:*
          *   **Transplant:** Often triggers "medical trust" or "bodily autonomy" specific intuitions that muddy the pure deontological constraint. It feels like a breach of professional duty rather than a general moral constraint.
          *   **Trolley:** Often triggers "doing vs. allowing" or "physical intervention" intuitions. People get stuck on the switch vs. pushing.
      *   *Requirement:* Needs to isolate the *constraint* against the *goal*. It needs to be a case where the agent is forced to choose between violating a constraint themselves or allowing more violations by *another agency* (or nature, but agency is sharper for the paradox).
      *   *Better Option:* A "Terrorist Bomb" or "Hostage" scenario where the threat is independent of the agent's initial action, but the agent can stop the greater violation only by committing a lesser violation.
      *   *Refinement:* Let's use a variation of the "Terrorist Bomb" but stripped of emotional baggage. Let's call it the **"Two Bridges"** or **"Single Constraint"** case. Actually, Scheffler's original formulation often uses a generic "kill one to save five" but the key is emphasizing that the *five* will be killed by *someone else* (or a mechanism), not just "die."
      *   *Best Choice:* **The "Unavoidable Violation" Scenario.**
          *   Setup: Agent A can kill Innocent X. If A does, Villain B will not kill Innocents Y1-Y5. If A does *not* kill X, Villain B *will* kill Y1-Y5.
          *   Why this works: It removes "doing vs. letting die" (because B is doing the killing in the second branch). It removes "medical trust." It isolates the constraint: "I must not kill" vs. "Fewer killings should happen."
          *   *Correction:* Wait, if B is killing Y1-Y5, the deontologist says "I must not kill X." The paradox is: Why is my not-killing X more important than the five not being killed by B?
          *   *Avoid:* Trolley (switch vs. push). Transplant (surgeon role).
          *   *Selection:* **The "Hostage Negotiator" Case.** (Clean, policy-relevant for law students).
          *   *Scenario:* You are a negotiator. A terrorist has 5 hostages. He says: "If you shoot me (violate constraint against killing), I release them. If you don't shoot me, I execute them."
          *   *Wait, is shooting a terrorist a constraint violation?* Maybe not clearly enough.
          *   *Better:* **The "Innocent Shield" Case.**
          *   Scenario: A villain has strapped 5 innocents to a track. He will release a boulder. You can shoot 1 innocent person (who is standing near a button) to trigger a barrier that stops the boulder. The villain is the source of threat in both cases.
          *   *Actually, let's go simpler.* **The "Two Murderers" Case.**
          *   Agent is held by Murderer A. Murderer A says: "If you kill this Innocent B, I will let you go and I will stop Murderer C from killing 5 people. If you don't kill B, I will let you go, and Murderer C will kill the 5."
          *   *Problem:* Coercion complicates it.
          *   *Ideal:* **The "Pre-Commitment" or "Magic Button" Case.**
          *   Let's stick to the classic structure but purify it. **The "Independent Threat" Case.**
          *   *Scenario:* A runaway train (no driver) is heading toward 5 people. You can shove 1 person onto the track to stop it. (This is Trolley).
          *   *Why Trolley is bad:* People focus on the switch vs. shove.
          *   *Why Transplant is bad:* People focus on doctor-patient relationship.
          *   *The Winner:* **The "Villain's Ultimatum" (Purified).**
          *   *Setup:* A villain has captured 5 people. He tells you: "I have a bomb set to kill them. The only way to disarm it is for *you* to personally execute this one innocent prisoner here. If you refuse, I will kill the 5. If you agree, I leave."
          *   *Why:* It makes the 5 deaths *intentional actions by another agent* (preventing the "letting die" dodge). It makes your action a direct killing (preventing the "side effect" dodge). It isolates the deontological constraint: "Do not murder" vs. "Minimize murder."

  4.  **Address the Agent-Relative/Agent-Neutral Distinction:**
      *   *Timing:* If introduced early, it solves the puzzle too quickly (intellectualizes it). If introduced late, students spin their wheels in confusion.
      *   *Strategy:* **Withhold as terminology, introduce as structure.** Let them feel the tension first. Use the distinction as the *explanatory key* in the second hour, not the premise in the first.
      *   *Dependency:* They need to feel the irrationality of the constraint first (Hour 1) before they can appreciate the structural defense (Hour 2).

  5.  **Map Misconceptions:**
      *   *Misconception 1:* "It's just about killing vs. letting die." (Head off by ensuring the 5 die by *agency* in the scenario).
      *   *Misconception 2:* "It's about consequences (Threshold Deontology)." (Head off by insisting on absolute constraints for the sake of the argument).
      *   *Misconception 3:* "It's about integrity/virtue (Clean Hands)." (Head off by focusing on the *victims*, not the agent's soul).
      *   *Misconception 4:* "It's a consequentialist argument." (Clarify that the paradox arises *within* deontology).

  6.  **Diagnostic Question:**
      *   Needs to test if they understand that Agent-Relative reasons *do not aggregate* or *do not translate* to Agent-Neutral goals.
      *   *Draft:* "If everyone followed agent-relative rules, would the world be better?" (Too vague).
      *   *Draft:* "Can I hire someone to kill the one for me?" (Tests complicity).
      *   *Better:* "If the deontological constraint is rational, why shouldn't I advocate for a legal system that minimizes violations overall?" (Tests the gap between personal constraint and public policy).
      *   *Best:* **"If you accept that you must not kill the one, must you also wish that no one kills the one?"** (Tests the split between the reason for action and the reason for outcome).
      *   *Wait, let's refine:* The distinction is about the *source* of the reason.
      *   *Question:* "Suppose you could press a button that would force *another* person to kill the one to save the five. As a deontologist, are you permitted to press that button?" (This tests if the constraint is on *my* action or on the *state of affairs*).
      *   *Actually, the prompt asks for a question whose answer shows they grasp the distinction.*
      *   *Question:* "Does the reason 'I must not kill' imply 'Killing must not happen'?"
      *   *Refined:* "If the constraint is rational, is it rational for you to prevent *someone else* from violating it?" (If they say yes without qualification, they miss the relative nature).
      *   *Let's go with the "Perspective" Question:* "When you say 'Killing is wrong,' do you mean 'I must not do it' or 'It must not be done'?" (Too simple).
      *   *Stronger:* "If you are forbidden from killing the one to save the five, are you also forbidden from *wanting* a world where the one is killed to save the five?" (Tests the separation of evaluation of acts vs. states of affairs).

  7.  **What to Decline to Settle:**
      *   Don't solve whether Deontology is *true*.
      *   Don't solve whether the Paradox is *fatal*.
      *   *Boundary:* We are analyzing the *structure*, not adjudicating the *truth*.
      *   *Marking:* "Our goal today is diagnostic, not legislative."

  8.  **Drafting the Session Plan (2 Hours):**
      *   *0:00-0:20:* Setup & The Case. (No theory yet).
      *   *0:20-0:50:* The Squeeze. (Consequentialist pressure vs. Deontological resistance).
      *   *0:50-1:00:* Break.
      *   *1:00-1:30:* The Structural Explanation (Agent-Relative/Neutral).
      *   *1:30-1:50:* Application/Testing (The Diagnostic Question).
      *   *1:50-2:00:* Boundary Setting & Close.

  9.  **Refining the Case (Crucial Step):**
      *   I need to be sure the "Villain's Ultimatum" doesn't trigger "duress" defenses.
      *   Let's use **The "Pre-Set Trap"**.
      *   *Scenario:* You are walking past a mechanism.
      *   *Option A:* You do nothing. A mechanism (set by a villain yesterday) kills 5 innocents.
      *   *Option B:* You push Innocent X into the gears. The mechanism stops. 5 live. X dies.
      *   *Critique:* This is just Trolley.
      *   *Need:* The 5 must be killed by *agency* if I don't kill the 1.
      *   *Revised:* **The "Two Assassins" Case.**
      *   You are Assassin A. You are hired to kill Innocent X.
      *   Assassin B is hired to kill Innocents Y1-Y5.
      *   The Employer tells you: "If you kill X, I will call off B. If you refuse, B proceeds."
      *   *Why this works:* It makes the 5 deaths *murders* (not accidents). It makes your action *murder* (not saving). It isolates the constraint.
      *   *Law/Policy angle:* Complicity, conspiracy, state authority.
      *   *Wait, one more refinement:* Make it less "criminal" to fit policy students.
      *   **The "State Execution" Case.**
      *   You are a warden. A riot will kill 5 prisoners unless you execute 1 specific innocent prisoner (demanded by rioters).
      *   *Problem:* Consequences of riot (chaos) vs. execution.
      *   *Let's stick to the "Villain" but make it abstract.* **The "Forced Choice" Case.**
      *   "A malicious agent has arranged matters such that you must choose: either you kill one innocent person, or he will kill five innocent people. He is not bluffing. There are no other options."
      *   *Avoid:* Mentioning *how* (shooting, pushing). Just "kill."
      *   *Avoid:* Mentioning *who* (doctor, warden). Just "moral agent."
      *   *Include:* The certainty of the threat. The agency of the threatener.

  10. **Final Review against Constraints:**
      *   *Order:* Case -> Intuition -> Pressure -> Distinction -> Application.
      *   *Distinction:* Withhold terminology until Hour 2.
      *   *Case:* "The Malicious Mechanism" (Villain sets it up).
      *   *Misconceptions:* Killing/Letting die (blocked by Villain agency); Thresholds (blocked by stipulation); Clean Hands (blocked by focus on victims).
      *   *Diagnostic Question:* Needs to be sharp.
      *   *Boundary:* Truth of Deontology vs. Structure of Paradox.

  11. **Polishing the Diagnostic Question:**
      *   I need a question that separates "I have a reason not to do X" from "There is a reason for X not to happen."
      *   *Question:* "If you are forbidden from killing the one, does it follow that you should try to stop *someone else* from killing the one to save the five?"
      *   *If they grasp it:* They should see a tension. If the goal is "minimize killing," stop them. If the goal is "keep my hands clean," maybe don't get involved. But the real AR/AN distinction is: "I have a special reason not to kill" does not mean "The world is better if no one kills."
      *   *Actually, the standard test is:* "Can I wish that I had not faced this choice?" vs "Can I wish that the five are saved?"
      *   *Let's use the "Legislation" angle for Law Students:* "If you accept the deontological constraint for yourself, must you vote for a law that permits a official to kill the one to save the five?" (Tests Public vs. Private reason).
      *   *No, keep it ethical.*
      *   *Selected Question:* "Suppose you can press a button that transfers the choice to another person. They will then face the same choice: kill one or five die. Do you have a duty to press the button?"
      *   *If AR:* Maybe not, because *I* don't kill.
      *   *If AN:* Yes, because *someone* should minimize death.
      *   *Wait, the prompt asks for a question whose answer shows they grasp the distinction.*
      *   *Question:* "Does the statement 'I ought not to kill' entail 'It ought to be that no killing happens'?"
      *   *Answer:* No. (If they say Yes, they don't get it).
      *   *Let's make it more situational.* "If you are forbidden to kill the one, are you also forbidden to *hope* that the one is killed to save the five?"
      *   *Correct Deontological Answer:* You can hope the five are saved, but you cannot hope *you* kill the one. Can you hope *the villain* kills the one?
      *   *Okay, the best diagnostic is about the **reason**.*
      *   *Question:* "If I ask you *why* you refuse to kill the one, which answer demonstrates an agent-relative understanding: (A) 'Because killing is bad,' or (B) 'Because I must not kill'?"
      *   *Too multiple choice.*
      *   *Let's go with:* "If the constraint is valid, is it permissible for you to *pay someone else* to kill the one to save the five?"
      *   *Grasp:* If they say "Yes, because the killing isn't mine," they miss that AR constraints often prohibit *procuring* the violation.
      *   *Okay, I will formulate the question carefully in the output.*

  12. **Final Polish of the Plan:**
      *   Ensure the "Law/Policy" angle is respected (they care about rules, systems, authority).
      *   Ensure the "Slogan" problem is addressed (make them work for the concepts).
      *   Ensure the "Boundary" is clear (not solving ethics, just mapping).

      *(Self-Correction during drafting)*: I need to make sure I explicitly tell the professor *why* Trolley/Transplant are bad.
      *   Trolley: Confounds "doing/allowing."
      *   Transplant: Confounds "professional duty/trust."
      *   The chosen case must isolate the *constraint* itself.

      *(Refining the Distinction Timing)*: Do not define "Agent-Relative" in Hour 1. Let them struggle with "Why is it rational to let 5 die?" In Hour 2, introduce the terms as the *solution to the confusion*, not the premise.

      *(Refining the Boundary)*: Be explicit that we are not deciding if Deontology is *correct*, but if it is *coherent*.

      *(Refining the Diagnostic Question)*: "If you accept the constraint, must you also accept that the world would be better if the constraint did not exist?" (Tests the separation of personal obligation vs. global good).
      *   *Better:* "Does the reason that forbids *you* from killing the one also forbid *you* from wishing that *another* kills the one?"
      *   *Let's settle on:* "If the deontological constraint is rational, is it irrational to wish that you were the kind of person who would violate it to save the five?" (Tests integrity vs. outcome).
      *   *Actually, the prompt asks for a question to test the AR/AN distinction specifically.*
      *   *Question:* "If I say 'Killing is wrong,' does that give *you* a reason to stop *me* from killing, or does it give *me* a reason not to kill?"
      *   *Simple and effective.*
      *   *Wait, let's make it harder for advanced students.*
      *   *Question:* "Suppose you could create a law that forces officials to minimize violations of the constraint (e.g., kill one to save five). Would creating that law violate the constraint?"
      *   *Okay, I have a strong candidate.* "If the constraint is agent-relative, does the reason 'I must not kill' provide *any* support for the claim 'The total amount of killing should be minimized'?"
      *   *Let's provide the specific question in the final output.*

      *(Final check on misconceptions)*:
      1.  Killing vs. Letting Die (Address in Case Design).
      2.  Threshold Deontology (Address in Hour 1 constraints).
      3.  Clean Hands/Virtue (Address in Hour 1 framing).
      4.  Consequentialist Co-opting (Address in Hour 2 distinction).

      *(Final check on Boundary)*: Don't solve "Which theory is true?" Don't solve "Is the paradox fatal?"

      *Ready to write.*
answer: |-
  Here is the pedagogical architecture for your two-hour session. It is designed to move students from intuitive confusion to structural clarity, specifically tailored for law and policy students who are prone to instrumentalizing moral constraints.

  ### I. The Single Case: "The Villain's Switch"

  Your suspicion about the Transplant and Trolley cases is correct. You should avoid them.
  *   **The Transplant Case** imports confounds regarding professional fiduciary duty and bodily autonomy that are specific to medicine, not general morality. Law students will immediately pivot to "breach of trust" rather than the moral constraint itself.
  *   **The Trolley Case** imports confounds regarding the *mechanics* of intervention (switch vs. push, side-effects vs. means). Students will get stuck on the physical topology of the threat rather than the normative structure of the constraint.

  **Use this case instead:**
  > **The Villain's Switch:** A malicious agent has captured six innocents. He tells you: "I have wired two rooms. In Room A, there is one innocent person. In Room B, there are five innocent people. I am leaving the building. I have given you a device. If you press the button, the device will send a signal that kills the person in Room A, but it will also disarm the bomb in Room B, saving the five. If you do *not* press the button, I have set a timer that will kill the five in Room B in ten minutes. The person in Room A will survive. I am not bluffing. There are no other options. You must choose: either you kill the one, or I kill the five."

  **Why this case works:**
  1.  **Isolates Agency:** In the "do nothing" branch, the five die by *another agent's* intentional action (the Villain), not by nature or accident. This blocks the "killing vs. letting die" dodge.
  2.  **Isolates the Constraint:** Your action is a direct killing (pressing a button to execute), not a side effect. This blocks the "double effect" dodge.
  3.  **Policy Relevance:** It mirrors hostage negotiations or coercive threats faced by state actors, making it salient for your audience without triggering specific professional codes (like the Hippocratic Oath).
  4.  **Removes "Clean Hands":** The Villain is the source of the threat in both branches. You cannot claim you are "keeping your hands clean" by walking away; you are actively choosing who dies.

  ---

  ### II. Pedagogical Architecture & Sequence

  Do not introduce the **Agent-Relative/Agent-Neutral** distinction in the first hour. If you provide the vocabulary too early, students will treat it as a definitional fix ("Oh, it's just agent-relative, solved") rather than feeling the rational tension. Use the distinction as the *explanatory key* in the second hour, not the *premise* in the first.

  #### Hour 1: The Squeeze (Feeling the Paradox)
  **Goal:** Make the deontological constraint look irrational without making it look like a virtue-ethics quibble.

  *   **0:00–0:15: Setup & Stipulations.**
      *   Present the "Villain's Switch."
      *   **Crucial Stipulation:** Explicitly ban **Threshold Deontology** for the sake of the exercise. Tell them: "For this session, assume the constraint against killing is absolute. No 'enough is enough.' We are testing the structure of the constraint, not its breaking point."
      *   **Crucial Stipulation:** Explicitly ban **"Clean Hands"** arguments. Tell them: "Do not argue that you shouldn't kill because it damages *your* character. Argue about the rights of the *victims*."
  *   **0:15–0:45: The Consequentialist Squeeze.**
      *   Ask: "Why would refusing to press the button be irrational?"
      *   Force them to articulate the Consequentialist critique: If the goal of morality is to protect life, refusing to press the button prioritizes the agent's action over the victims' lives.
      *   *Misconception Check:* If a student says, "Because letting die is different than killing," remind them the Villain is *killing* the five. If they say, "Because I shouldn't be coerced," remind them the choice is unavoidable.
  *   **0:45–1:00: The Deontological Resistance.**
      *   Ask: "Why does it still feel forbidden to press the button?"
      *   Guide them away from "It feels bad" toward "It violates *him*."
      *   **The Trap:** Let them struggle. They will likely argue in circles. This frustration is necessary. They need to feel that standard moral language fails to capture why the constraint holds.
  *   **1:00–1:10: Break.**

  #### Hour 2: The Structure (Resolving the Confusion)
  **Goal:** Introduce the Agent-Relative/Agent-Neutral distinction as the tool that explains the tension without dissolving it.

  *   **1:10–1:30: Introducing the Distinction.**
      *   Now introduce the terms.
      *   **Agent-Neutral Reason:** "Killing should be minimized." (Applies to everyone equally; focuses on the *state of the world*).
      *   **Agent-Relative Reason:** "I must not kill." (Applies specifically to the agent; focuses on the *action*).
      *   Explain that the Paradox of Deontology arises because Deontology posits Agent-Relative reasons that do not simply aggregate into Agent-Neutral goals.
  *   **1:30–1:50: Application & Diagnostic.**
      *   Return to the "Villain's Switch."
      *   Ask them to re-describe the conflict using the new terms. (e.g., "The Agent-Neutral reason says press; the Agent-Relative reason says don't.")
      *   **Pose the Diagnostic Question** (see below).
  *   **1:50–2:00: Boundary Marking & Close.**
      *   Explicitly state what you are *not* deciding.

  ---

  ### III. Mapping Misconceptions

  This audience (Law/Policy) brings specific instrumentalist biases. Head them off at these exact points:

  | Misconception | Why they bring it | When to head it off | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **"Killing vs. Letting Die"** | Legal causation distinctions; tort law. | **0:15 (Setup)** | Stipulate that the Villain *kills* the five in the second branch. It is not an omission; it is a rival agency. |
  | **"Threshold Deontology"** | Policy students love trade-offs ("Security vs. Liberty"). | **0:15 (Setup)** | Explicitly bracket thresholds. "We are not asking *when* the constraint breaks, but *why* it exists at all." |
  | **"Virtue / Clean Hands"** | Reducing ethics to character or reputation. | **0:45 (Resistance)** | Ban appeals to the agent's soul. "Focus on the one innocent in Room A. Why does *he* have a claim against you that the five in Room B do not?" |
  | **"Consequentialist Co-opting"** | "Rules are just heuristics for good outcomes." | **1:10 (Distinction)** | When introducing Agent-Relative reasons, emphasize they are *sui generis*, not hidden consequentialist rules. |

  ---

  ### IV. The Diagnostic Question

  Near the end of the session (around 1:40), pose this question. It tests whether they understand that Agent-Relative reasons do not translate into Agent-Neutral goals.

  > **"If the deontological constraint is rational, does the reason 'I must not kill the one' give you a reason to wish that *no one* kills the one?"**

  *   **The Trap:** A student who has merely memorized the phrase will say "Yes, of course, killing is bad."
  *   **The Correct Grasp:** A student who understands the distinction will hesitate or say: "It gives *me* a reason not to do it, but it does not necessarily mean I must wish for a world where the constraint prevents the saving of the five. I can wish the five are saved, even if that requires a killing I cannot perform."
  *   **Better Formulation for Law Students:**
      > **"If you accept the agent-relative constraint, are you logically committed to voting for a legal system that prohibits *everyone* from killing the one to save the five?"**
      *   *Why:* If they grasp the distinction, they should see that *personal* obligation (Agent-Relative) might not translate to *public* policy (which is often Agent-Neutral). This exposes the friction between private morality and public reason, which is central to their field.

  ---

  ### V. The Boundary: What to Decline to Settle

  You must avoid the trap of trying to prove Deontology is *true* or that the Paradox is *solved*.

  **The Boundary Statement:**
  > "We are not here to decide whether Deontology is the correct moral theory, nor are we here to decide if the Paradox is fatal to it. We are here to diagnose the *structure* of the disagreement. If you leave thinking 'Deontology is irrational,' you have missed the point. If you leave thinking 'The Agent-Relative distinction solves everything,' you have also missed the point. The point is to see that rational people can disagree because they are weighing different *kinds* of reasons, not just different amounts of the same reason."

  **How to mark it without looking evasive:**
  Frame it as a limitation of *scope*, not *competence*.
  *   *Say:* "In a two-hour seminar, we can map the geometry of the problem, but we cannot build the house. Determining which reason type (Relative or Neutral) has ultimate authority is the work of a lifetime, not a session. Our job today is to ensure you recognize the geometry when you encounter it in statute, case law, or policy."

  ### Summary of Dependencies
  1.  **Case Purity** depends on removing "Letting Die" and "Professional Duty" confounds (Hour 1, Start).
  2.  **Intuitive Force** depends on withholding the Agent-Relative vocabulary until the tension is felt (Hour 1 vs. Hour 2).
  3.  **Conceptual Clarity** depends on successfully blocking the "Threshold" and "Virtue" dodges (Hour 1, Middle).
  4.  **Diagnostic Success** depends on asking a question that forces a choice between *action-guidance* and *outcome-evaluation* (Hour 2, End).
