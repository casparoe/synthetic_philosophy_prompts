answer: |-
  1. **The Robustness of Flickers:** You argue that Frankfurt cases fail to eliminate all alternative possibilities, leaving behind "flickers" like a different neural twitch or the agent deciding on their own rather than via intervention. But Frankfurt defenders claim these flickers aren't *robust* enough to ground moral responsibility—they're too trivial. Why should we think that having access to a non-voluntary flicker satisfies the substantive control requirement that PAP is supposed to protect?

  2. **Follow-up on Flickers:** *If he argues that any alternative possibility is sufficient regardless of robustness:* If the alternative possibility is something the agent cannot voluntarily bring about—like an involuntary twitch prior to the decision—how does possessing that specific possibility actually contribute to the agent's blameworthiness in the actual sequence where they never twitch?

  3. **The Dilemma Defense:** A standard objection to your position is the "Dilemma Defense": either the intervener's trigger is causally determined by prior states, which begs the question against incompatibilists, or it isn't, which means the agent could have avoided the trigger and done otherwise. How do you navigate this dilemma without conceding that the Frankfurt case either presupposes determinism or fails to rule out alternatives?

  4. **Follow-up on Causal Triggers:** *If he argues that the trigger can be indeterministic yet still reliable:* If the prior sign is not causally determined, doesn't that imply a gap where the agent could have acted differently to prevent the sign? If so, how do you maintain that the intervener's presence is truly counterfactual without that causal link effectively ruling out the alternative possibility you claim exists?

  5. **Frankfurt-Style Omissions:** Let's shift to omissions. Can you construct a parallel Frankfurt-style case where the agent is responsible for *failing* to act, such as failing to save a child, because a mechanism would have forced them to save the child if they showed signs of trying? Does the PAP defense hold up when the "could have done otherwise" translates to "could have acted"?

  6. **Follow-up on Omissions:** *If he argues that omissions preserve PAP better than actions:* If the agent in the omission case literally could not have performed the action (because the mechanism would have forced it), in what sense are they responsible for the *omission* rather than just the state of affairs? Does this not collapse the distinction between doing and allowing in a way that undermines your broader theory?

  7. **Sourcehood vs. Leeway:** Many contemporary incompatibilists have pivoted from PAP to a "Sourcehood" condition, arguing that what matters is where the action originates, not whether alternatives existed. Do you view your defense of PAP as a defense of leeway specifically, or do you think Sourcehood arguments are ultimately just a disguised way of preserving the intuition behind alternative possibilities?

  8. **Methodology and Intuition:** Frankfurt cases rely heavily on intuition pumps—asking us to imagine highly specific, often sci-fi scenarios to test our judgments about responsibility. To what extent do you think the persistence of this debate is a failure of our intuitions to track metaphysical reality, rather than a genuine disagreement about the nature of free will?

  9. **Implications for Incompatibilism:** If you successfully defend PAP against Frankfurt cases, does that automatically vindicate incompatibilism, or is it possible for a compatibilist to accept PAP by arguing that determinism is compatible with having genuine alternative possibilities? Where does your defense of PAP leave the broader debate between compatibilists and incompatibilists?

  10. **Falsification:** Finally, what would actually change your mind? Is there a specific variation of a Frankfurt case, or a distinct argument regarding the relationship between causal determination and ability, that would compel you to abandon PAP and accept that moral responsibility is compatible with the inability to do otherwise?
