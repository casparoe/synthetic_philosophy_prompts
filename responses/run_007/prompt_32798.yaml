  3.  **Identify the Core Tensions:**
      *   **Ship vs. Ring:** Why is gradual replacement okay for the ship but recasting (even same design) bad for the ring? (Continuity vs. Origin).
      *   **Ship vs. Reassembly:** If gradual replacement keeps identity, does the pile of old planks also keep it? User senses a contradiction (Branching Problem).
      *   **Person vs. Ship:** User accepts biological continuity for Caterpillar/Butterfly and seemingly for Person (since memories are gone), but struggles with *what* makes the person the same.
      *   **Laptop:** The "all at once" vs. "gradual" distinction is the classic Sorites/Continuity problem.

  4.  **Develop Candidate Principles:**
      *   *Candidate 1: Spatiotemporal Continuity.* (Things persist if there's a continuous path in space and time).
          *   Fits: Ship, Laptop (gradual), Caterpillar.
