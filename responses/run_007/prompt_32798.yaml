          *   Fails: Ring (new ring functions same as old), Person (memory loss changes function?).
      *   *Candidate 3: Sortal Dependence.* (Identity conditions depend on *what kind* of thing it is).
          *   This is the strongest fit for the user's intuitions. A "Statue" has different conditions than a "Lump." A "Person" has different conditions than a "Laptop."
      *   *Candidate 4: The "No Branching" Rule.* (Identity cannot branch).
          *   Solves the Ship Reassembly problem. If the original ship continues as the replaced-plank ship, the reassembled one is a copy.

  5.  **Synthesize a Unified Theory (The "Best Fit"):**
      *   The user's intuitions align closely with **Sortal-Relative Continuity with a No-Branching Constraint.**
      *   *Core Idea:* Different kinds of objects (Sortals) have different rules for persistence. Most rely on *continuous existence* rather than *original material*. However, identity is one-to-one (cannot branch).
