      *   **The User's Move:** "Emergent Capacity." The ability to model oneself and the environment creates a qualitative difference, even if the substrate is physical. This is the "Strange Loop" move (also Hofstadter).
      *   **Why it Stalls:** It's a *category dispute* disguised as a *factual dispute*. They agree on the physics but disagree on the ontology of "flexibility."

  3.  **Diagnose the Structure of the Debate:**
      *   *Is it verbal?* Partly. They are using "sphexish" differently. For the friend, it means "physically determined." For the user, it means "incapable of meta-cognitive override."
