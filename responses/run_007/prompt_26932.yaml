answer: |-
  - **Framing the problem** (~150 words): 
  The Deutsch–Wallace (DW) and Sebens–Carroll (SC) approaches diagnose the Born rule problem differently. DW treats probability as fundamentally normative: the problem is to justify why a rational agent in a branching universe should order preferences according to Born weights. For DW, probability *is* rational betting behavior; the puzzle is deriving the correct action guide from the deterministic wavefunction. Conversely, SC treats probability as epistemic: the problem is explaining how an agent can have non-trivial credences when all outcomes objectively occur. SC focuses on recovering the *phenomenology* of uncertainty via self-location. Thus, DW asks, "How should I bet?" while SC asks, "What should I believe?" This divergence dictates their solutions: one builds a bridge from rationality to weights, the other from ignorance to weights.

  - **How each approach works** (~300 words): 
  DW employs formal decision theory to bridge ontology and action. Starting from a deterministic wavefunction where all outcomes occur, they argue that rational agents must assign "care weights" to future branches. Wallace argues subjective uncertainty is valid despite determinism, but the derivation rests on action. By accepting axioms like Ordering, Diachronic Consistency, and crucially, Branching Indifference (the claim that an agent shouldn't care about the mere fact of branching, only the rewards received), Wallace proves a representation theorem. Any agent violating the Born rule violates these axioms and is thus irrational, akin to accepting a Dutch Book. Probability emerges not as frequency or propensity, but as a constraint on preference orderings required for consistency across branching selves. The move is pragmatic: don't ask what probability *is*, ask how you must act. Measurement is simply a unitary interaction creating branches; the agent's preferences must remain consistent across this splitting.

  SC employs self-locating uncertainty to bridge ontology and belief. They argue that between branching and observation, an agent knows the universal state but not their specific branch. This creates genuine epistemic uncertainty despite global determinism. They introduce the Epistemic Separability Principle (ESP): credences about self-location should depend only on the local physical state, not the global environment. ESP ensures that adding empty branches elsewhere doesn't change credences. By applying ESP to symmetric quantum states, they derive that credences must track amplitude squared to avoid arbitrary distinctions between physically identical observers. Here, probability emerges as a measure of ignorance about self-location within the multiverse, grounded in epistemic principles regarding evidence and identity rather than pragmatic constraints on betting. SC insists we must explain the *feeling* of uncertainty before we can justify betting behavior. While DW derives weights from rationality constraints on preferences, SC derives them from symmetry constraints on credences. DW requires the agent to care about future branches; SC requires the agent to be uncertain about their current location. SC's mechanism relies on a temporal gap where the agent exists in multiple copies but hasn't yet observed the result, whereas DW applies regardless of when observation occurs.

  - **Where they agree and where they really clash** (~200 words): 
  Both agree that standard collapse is unnecessary and branch-counting is wrong. Both rely heavily on symmetry arguments to rule out alternative weightings. However, they clash on the metaphysics of uncertainty. DW treats uncertainty as derivative of rationality; you are uncertain because rationality demands you act as if you are. SC treats uncertainty as fundamental; you are uncertain because you are literally one of many copies. DW relies on diachronic identity (caring about future selves); SC relies on synchronic indexicality (not knowing which copy you are). This leads to a genuine disagreement: DW critics say the axioms smuggle in probability; SC critics say the uncertainty is illusory in a deterministic multiverse. DW is structural; SC is phenomenological. Furthermore, they differ on compatibility. Proponents argue they complement each other (SC explains belief, DW explains action). But fundamentally, they compete over what probability *is*. If DW is right, SC's uncertainty is superfluous; if SC is right, DW's decision theory is secondary to epistemic norms. They cannot both be the primary foundation.

  - **My verdict** (~250 words): 
  I put my money on Deutsch–Wallace. While SC offers a more intuitive account of the *experience* of probability, it relies on a fragile metaphysics. SC requires a temporal gap between branching and observation to generate uncertainty. If observation is instantaneous, or if the agent is closely coupled to the system, the "self-locating" gap vanishes, and with it the derivation. DW is robust against these metaphysical contingencies. Its axioms apply regardless of when observation occurs.
  More importantly, DW answers the skeptic's "why expect?" challenge more deeply. The skeptic assumes expectation is a mental state distinct from action. DW shows that in a deterministic multiverse, expectation *just is* a disposition to act. Trying to save a pre-theoretic notion of belief (as SC does) is chasing a ghost. DW forces us to accept that probability is functional. It grounds the Born rule in the only thing that matters: how we navigate the world. SC saves the phenomenology but risks metaphysical hand-waving; DW saves the rationality and grounds the physics.
  Critics claim DW axioms smuggle in probability, but SC's ESP smuggles in weightings via symmetry. DW is more honest: it admits it is prescribing norms, not discovering hidden uncertainties. For the skeptic demanding a reason to *expect* frequencies, DW provides the only coherent answer: you expect them because violating that expectation makes you irrational. SC tells you to believe you are uncertain when, globally, nothing is uncertain. DW is the sharper philosophical knife.
