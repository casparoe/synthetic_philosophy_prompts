          *   *Critique:* He conflates *ontological* status (what exists) with *semantic* status (what it means). He assumes physical stuff can't carry "meaning" in the same way ink does, which is inconsistent.

      *   **Move 4: Mina's "Skyhook vs. Crane".**
          *   *Claim:* Dave demands an "extra ingredient" (Skyhook). We need a "Crane" (explanation of construction from lower levels without magic).
