  Pragmatic Encroachment is the thesis that whether a subject $S$ knows that $p$ depends not only on truth-conducive factors (evidence, reliability, safety) but also on practical factors (what is at stake for $S$). Its necessary condition is that two subjects with identical evidence regarding $p$ can differ in knowledge status solely due to differing practical stakes. The canonical thought experiments are the **Bank Cases** (popularized by Keith DeRose and Jason Stanley). In these scenarios, a subject has the same evidence about a bank's hours on Friday afternoon; in the low-stakes version, depositing a check isn't urgent, and we intuit they "know." In the high-stakes version, failure to deposit means bankruptcy, and we intuit they "don't know." The theory often relies on the principle that knowledge is the norm of practical reasoning: if you know $p$, you are rational to act as if $p$. When stakes rise, the threshold for rational action rises, and thus the threshold for knowledge rises.

  3. **Distinctions and boundaries**
  The crucial boundary lies between Pragmatic Encroachment and **Contextualism**. Contextualists agree knowledge attributions vary with context, but they argue the *semantic content* of "knows" shifts based on the *attributor's* salience of error possibilities, not necessarily the subject's stakes. For a contextualist, "I know" might be true uttered by you in a low-stakes context but false uttered by someone else about you in a high-stakes context. For the pragmatic encroacher, knowledge itself changes based on *your* stakes, regardless of who is speaking. This is often called **Subject-Sensitive Invariantism**.
  Another vital boundary distinguishes encroachment from **Traditional Invariantism** regarding **assertability**. A traditional invariantist might say you still *know* the pharmacy is open in the high-stakes case, but you shouldn't *say* you know because the norm of assertion requires higher confidence when errors are costly. Pragmatic Encroachment excludes this explanation: it insists the knowledge state itself vanishes. Borderline cases involve moral stakes versus financial stakes; encroachment theorists debate whether all practical interests count or only those tied to rational action. This distinguishes the view from mere psychological caution or conversational implicature. It claims a metaphysical change in epistemic status, not just a linguistic or psychological shift.

  4. **What's settled, what's contested**
  Among epistemologists, it is widely agreed that ordinary language users exhibit the stakes-sensitive intuitions you described; the data is not disputed. What is fiercely contested is the *explanation*. Purist Invariantists (e.g., Timothy Williamson, Patrick Rysiew) deny that stakes affect knowledge, arguing instead that stakes affect the norms of assertion or confidence. They maintain knowledge is "pure." Pragmatic Encroachers (e.g., Jason Stanley, Jeremy Fantl, Matthew McGrath) argue that purism cannot explain the intuition without ad hoc maneuvers. There is no consensus on which view is correct. The debate remains one of the central fault lines in post-Gettier epistemology. What is settled is that any viable theory of knowledge must account for these intuitions, either by validating them (Encroachment) or explaining them away (Invariantism/Contextualism). Furthermore, there is agreement that if encroachment is true, it challenges the traditional separation between theoretical and practical rationality, potentially undermining skeptical arguments that rely on high epistemic standards detached from practical life.
