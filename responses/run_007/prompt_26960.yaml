prompt: |-
  I teach a decision theory unit in an undergrad philosophy of economics course — about 24 students, one 75-minute session — and I want to spend it on the St. Petersburg paradox. Last time I taught it I just walked through the arithmetic on the board (infinite expected value, nobody would actually pay more than twenty bucks, etc.) and the students nodded along but the point clearly didn't land: it stayed a curiosity about a coin-flip game instead of a live problem about how expected value relates to what you should actually pay or choose. So I'd like a runnable in-class game or auction that makes them feel the gap themsleves before I name the paradox. Design the activity with actual rules, materials (coins, slips, a cap on rounds so it fits the time), some way of paying out that doesn't require real money — classroom scrip or points toward participation is fine — and a simple way for them to record what they'd pay to play. The doubling payoff can't go unbounded in a real classroom, so include a truncation rule and then use the debrief to show how the infinite version is the limit of what they just experienced. I want the debrief to map what actually happened — the bids, the variance, the role of the bankers deep pockets, the difference between the average payout and what you'd actually stake — onto the distinction between expected value and what people are willing to pay. Also tell me what tends to go wrong when people run this kind of thing: I'm imagining either someone will want to play forever because 'the math says so', or the class will just refuse to bid above a dollar and the auction will be boring. How do I run it so neither of those kills the point, and is there anything about the paradox itself the activity can't reproduce no matter how well it goes?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Undergrad philosophy of economics course, decision theory unit.
      *   **Class Size/Time:** ~24 students, 75-minute session.
      *   **Topic:** St. Petersburg Paradox.
      *   **Problem with Previous Attempt:** Too abstract/mathematical. Students saw it as a curiosity, not a live problem about decision theory (EV vs. utility/willingness to pay).
      *   **Goal:** A runnable in-class game/auction to make them *feel* the gap before naming the paradox.
      *   **Requirements:**
          *   Actual rules, materials (coins, scrip/points).
          *   Cap on rounds (time management).
          *   Truncation rule (can't do infinite payoff).
          *   Recording mechanism for bids/WTP (Willingness To Pay).
          *   Debrief plan mapping experience to EV vs. Utility.
          *   Troubleshooting (what goes wrong, how to fix it).
          *   Limitations (what the activity can't reproduce).

  2.  **Deconstruct the St. Petersburg Paradox:**
      *   *The Game:* Flip a coin until heads. Payoff = $2^n$ (where $n$ is the flip number).
      *   *The Math:* EV = $\sum (1/2^n) * 2^n = \sum 1 = \infty$.
      *   *The Intuition:* No one pays infinite money. Most pay very little ($5-$25).
      *   *The Lesson:* EV maximization fails here. Need diminishing marginal utility (Bernoulli) or risk aversion/kelly criterion.
      *   *The Classroom Constraint:* We can't pay infinite money. We need a "House Limit." This actually *lowers* the EV to a finite number, but usually still higher than students want to pay.

  3.  **Design the Activity:**
      *   *Format:* An auction or WTP survey? An auction is more visceral but takes longer. A WTP survey (Becker-DeGroot-Marschak mechanism style, or just simple sealed bids) is faster and ensures everyone participates. Let's go with a **Sealed Bid Auction** followed by **One Live Demonstration**. This balances engagement with time.
      *   *Materials:* Coins, slips of paper, "Classroom Cash" (points).
      *   *Truncation:* Need a hard cap. If the bank runs out of money, the game stops. Let's cap the payoff at a realistic classroom budget (e.g., 10 flips = $1024 points).
      *   *Time:* 75 mins.
          *   Intro/Hook: 5 mins.
          *   Activity Setup & Bidding: 15 mins.
          *   The Game (Live): 15 mins.
          *   Calculation/Math: 15 mins.
          *   Debrief/Philosophy: 25 mins.
      *   *Incentive:* Participation points. Top bidders who "win" get a bonus? No, that complicates it. Just participation points for bidding, and maybe a small prize for the one live player if they make a profit. Actually, better: Everyone bids. We pick one random student to actually play with real (classroom) stakes. This creates "skin in the game" without needing 24 banks.

  4.  **Drafting the Rules (Iterative Process):**
      *   *Idea 1:* Everyone plays. *Problem:* Takes too long. Coin flips can drag on.
      *   *Idea 2:* One volunteer plays. *Problem:* Others disengage.
      *   *Idea 3:* Everyone submits a WTP (Willingness To Pay). We select one random bidder to actually play against the "House" (Instructor).
      *   *Refinement:* Let's make it a "Market." Students write down the max they would pay. Instructor acts as the Casino. We run the game 3-5 times live to show variance.
      *   *Truncation:* Crucial. If we cap at $2^{10}$, the EV is roughly $10. If we cap at $2^{20}$, it's roughly $20. Wait, the EV of the truncated game is $\sum_{n=1}^{N} (1/2^n)2^n = N$. So if we cap at 10 flips, EV = $10. If we cap at 20 flips, EV = $20.
      *   *Correction:* In the standard paradox, payoff is $2^n$. EV = $\sum (1/2^n) * 2^n = \sum 1$. If we stop at $N$, EV = $N$.
      *   *Wait, check math:*
          *   Flip 1 (H): Pay $2. Prob 1/2. Contrib = 1.
          *   Flip 2 (TH): Pay $4. Prob 1/4. Contrib = 1.
          *   Flip k: Pay $2^k$. Prob $1/2^k$. Contrib = 1.
          *   Total EV for N rounds = N dollars.
      *   *Classroom Reality:* If I cap at 10 rounds, EV is $10. Students might bid $8. That's not a paradox. The paradox relies on the *unbounded* nature.
      *   *Solution:* I need to explain that the *classroom* game is truncated, but the *theoretical* game is not. The activity demonstrates *risk aversion* and *diminishing returns* even when the EV is moderately high.
      *   *Better Truncation:* To make it feel like the paradox, the EV of the truncated version should still feel "too high" compared to bids. If I cap at 20 flips, EV = $20. Most students will bid less than $5. That works.
      *   *Wait, can I simulate higher EV?* If I use points where 100 points = $1 grade bonus, I can make the numbers bigger. Let's use "Philosophy Points." Cap at 15 flips. EV = 15 Points. If 1 Point = 0.5% extra credit, EV = 7.5%. Students won't bid 7.5%. They'll bid 1%.
      *   *Actually, keep it simple.* Use hypothetical money for the bidding, real (small) stakes for the demo.
      *   *Revised Plan:*
          1.  Explain rules.
          2.  Students write down WTP on a slip.
          3.  Collect slips.
          4.  Run the game live 3 times (fast).
          5.  Calculate EV on board.
          6.  Compare Bids vs. EV.

  5.  **Addressing "What Goes Wrong":**
      *   *Issue 1: The "Math Bro".* Someone says "I'd pay $1000 because EV is infinite."
          *   *Fix:* Acknowledge them. Ask if they have infinite bankroll. Ask if they'd mortgage their house. Introduce "Risk of Ruin."
      *   *Issue 2: The "Lowballers".* Everyone bids $1.
          *   *Fix:* Ask *why*. Is it risk aversion? Or do they not believe the house will pay? (Trust issue).
      *   *Issue 3: Time.* Coin flips can take forever if tails keeps coming.
          *   *Fix:* Hard cap. "House Limit." If we hit 15 tails, game ends, payout is max cap.
      *   *Issue 4: Boredom.* Watching coin flips is dull.
          *   *Fix:* Make it fast. Pre-calculate payouts on a slide. "Heads on 4th flip? That's $16. Next!"

  6.  **Addressing Limitations:**
      *   The activity *cannot* reproduce infinity. It must be framed as a finite approximation.
      *   The activity *cannot* fully separate risk aversion from diminishing marginal utility without more complex surveys.
      *   The "House Limit" changes the EV from infinite to finite. This must be explicitly addressed in the debrief (The "Truncated St. Petersburg").

  7.  **Structuring the Response:**
      *   **Activity Overview:** Name, Time, Goal.
      *   **Materials:** Simple list.
      *   **Step-by-Step Run of Show:** Minute-by-minute breakdown.
      *   **The Rules (Handout/Script):** Clear instructions for students.
      *   **The Debrief (The Meat):** How to connect the dots (EV vs. WTP, Utility, House Limit).
      *   **Troubleshooting:** Specific scenarios (Math Bro, Lowballers, Time).
      *   **Limitations:** Intellectual honesty about the simulation.

  8.  **Refining the Math for the Debrief:**
      *   I need to make sure I explain *why* the truncation matters.
      *   Standard Paradox: EV = $\infty$.
      *   Truncated (at $N$ flips): EV = $N$ (if payoff is $2^n$).
      *   Wait, if payoff is $2^{n-1}$ (1, 2, 4...), EV = $N/2$?
      *   Let's stick to standard: Payoff $2^n$ where $n$ is flip number.
      *   Flip 1 (H): $2. Prob 1/2. Exp = 1.
      *   Flip 2 (TH): $4. Prob 1/4. Exp = 1.
      *   ...
      *   Flip 10: $1024. Prob 1/1024. Exp = 1.
      *   Total EV for 10 round cap = $10.
      *   *Problem:* $10 is not impressive. Students might bid $8.
      *   *Solution:* Scale the currency. "The payoff is $2^n$ *dollars*." But we are using points. Let's say 1 Point = $100 hypothetical. Or just acknowledge that in the *theoretical* version, the cap is removed.
      *   *Better approach for class:* Run the game with a cap of 10. EV = $10. Ask them to bid. Then reveal that if we remove the cap, the EV goes to infinity. Ask: "Did removing the cap change your bid?" (Hopefully no). This highlights that the *infinity* isn't the only driver; it's the *distribution*.
      *   *Actually, Bernoulli's solution:* Log utility. $U(x) = \ln(x)$.
      *   I should keep the debrief focused on the gap between EV and Price, regardless of the cap.

  9.  **Final Polish:**
      *   Ensure tone is pedagogical and practical.
      *   Make sure the "House Limit" is explicit so the instructor doesn't go bankrupt or run out of time.
      *   Add a specific script for the "Math Bro" intervention.

  10. **Self-Correction on "One Live Player":**
      *   If only one plays, others disengage.
      *   If everyone plays, it takes too long.
      *   *Compromise:* Everyone bids. Pick 3 volunteers to play live. The rest watch the variance. This shows that *most* games end quickly (low payout), which explains why bids are low despite high EV.
      *   *Wait, variance is key.* The EV is driven by the extreme outliers. In a class of 24, you won't see the outlier. You need to *simulate* the outlier or explain it.
      *   *Idea:* Use a computer script to simulate 10,000 runs during the debrief to show the distribution. (Requires tech).
      *   *Low Tech:* Just explain the probability. "To get $1024, you need 10 tails in a row. That's 1 in 1024. In this class, it won't happen."
      *   *Decision:* Stick to low-tech. 3 live rounds. Emphasize in debrief that the EV comes from events they *didn't* see.

  11. **Final check on constraints:** 75 mins. 24 students.
      *   Intro: 5
      *   Bidding: 10
      *   Live Game (3 rounds): 15
      *   Math/EV Calculation: 15
      *   Debrief/Discussion: 30
      *   Total: 75. Perfect.

  12. **Writing the content.** (Focusing on clear instructions and the "why" behind each step).
      *   Make sure to mention the "Bank Solvency" issue. The House needs deep pockets.
      *   Make sure to mention "Diminishing Marginal Utility."

  13. **Review against specific user prompt:**
      *   *Runnable game?* Yes.
      *   *Materials?* Coins, slips.
      *   *Truncation?* Yes, House Limit.
      *   *Debrief mapping?* Yes.
      *   *What goes wrong?* Addressed (Math Bro, Lowballers, Time).
      *   *Limitations?* Addressed (Infinity vs. Finite).

  Let's assemble.
answer: |-
  Here is a complete lesson plan designed to turn the St. Petersburg Paradox from a mathematical curiosity into a visceral decision-theory problem.

  ### Activity Overview: "The Infinite Casino"
  *   **Time:** 75 minutes
  *   **Class Size:** 24 students
  *   **Goal:** Students will experience the gap between *Expected Value (EV)* and *Willingness To Pay (WTP)*, creating the cognitive dissonance required to motivate utility theory.
  *   **Materials:**
      *   1 large coin (or a coin projector if available).
      *   24 small slips of paper ("Bid Slips").
      *   Whiteboard/Projector.
      *   "House Bank" (You, the instructor, holding a stack of points/scrip).

  ---

  ### Part 1: The Setup & Bidding (20 Minutes)

  **1. The Hook (5 mins)**
  Walk in and write **$2, $4, $8, $16...** on the board.
  Tell the class: *"I am the Casino. You are the gambler. We are going to play a coin flip game. Here are the rules:"*

  **2. The Rules (Read Aloud + Project)**
  1.  I flip a fair coin until it lands **Heads**.
  2.  If Heads appears on the **1st** flip, you win **$2**.
  3.  If Heads appears on the **2nd** flip (Tails, then Heads), you win **$4**.
  4.  If Heads appears on the **3rd** flip, you win **$8**.
  5.  The prize **doubles** for every Tails before the first Heads ($2^n$, where $n$ is the flip number).
  6.  **The House Limit:** To keep this class on time, if we reach **15 flips** without Heads, the game stops automatically, and you win the maximum prize ($2^{15} = $32,768).
  7.  **The Buy-In:** Before we play, you must write down the **maximum amount you would pay** to play this game once. This is a sealed bid.

  **3. The Bidding (10 mins)**
  Hand out the Bid Slips. Ask them to write their name and their **Max WTP**.
  *   *Instruction:* "Imagine this is real money coming out of your pocket. If your bid is selected, you will actually pay this amount from your participation points, and you will receive the game payout in points."
  *   *Incentive:* Tell them you will randomly select **3 students** to actually play the game live. Their net profit (Payout minus Bid) will be added to their participation grade.
  *   *Collection:* Collect the slips immediately. Do not let them discuss bids yet.

  **4. The Live Game (5 mins)**
  Pick 3 volunteers (or random draw from the slips). Play the game 3 times in front of the class.
  *   **Speed is key.** Flip fast. Announce the payout immediately.
  *   *Likely Outcome:* You will likely get short runs (e.g., Heads on flip 1, 2, or 3). Payouts will be $2, $4, or $8.
  *   *Record:* Write the 3 results on the board. Calculate the average payout of these 3 rounds. It will be low.

  ---

  ### Part 2: The Math & The Gap (25 Minutes)

  **1. Calculate Expected Value (10 mins)**
  Move to the board. Ask the class to help you calculate the Expected Value (EV).
  *   *Flip 1:* Prob 1/2, Payoff $2. Contribution = $1.
  *   *Flip 2:* Prob 1/4, Payoff $4. Contribution = $1.
  *   *Flip 3:* Prob 1/8, Payoff $8. Contribution = $1.
  *   *Flip k:* Prob $1/2^k$, Payoff $2^k$. Contribution = $1.

  **The Reveal:**
  *"Since every flip contributes exactly $1 to the expected value, and we have capped the game at 15 flips, the Expected Value of this game is **$15**."*
  *(Note: If you didn't cap it, the sum is $1 + 1 + 1... = \infty$.)*

  **2. Reveal the Bids (10 mins)**
  Read out a sample of the bids anonymously.
  *   "Who bid under $5?" (Likely most of the class).
  *   "Who bid between $5 and $15?"
  *   "Who bid over $15?" (Likely no one, or the 'Math Bro').
  *   **The Conflict:** "The math says this ticket is worth $15 (or infinite). Almost all of you valued it at $2 or $3. Why is the 'rational' EV price so different from your actual price?"

  **3. Small Group Discussion (5 mins)**
  Put them in pairs. Prompt: *"If you knew the EV was $15, why wouldn't you pay $14? What are you afraid of?"*
  Harvest answers on the board:
  *   "I might lose money." (Risk)
  *   "$15 is a lot for a coin flip." (Context)
  *   "The big money is too unlikely." (Probability weighting)

  ---

  ### Part 3: The Debrief & Theory (30 Minutes)

  This is where you map the activity to the philosophy.

  **1. The "House Limit" vs. Infinity**
  Acknowledge the truncation.
  *   *"We capped the game at 15 flips. That made the EV finite ($15). But if I remove the cap, the EV becomes infinite. Did anyone want to raise their bid to infinity just now?"*
  *   **Point:** The paradox isn't just about infinity. Even with a high finite EV (say we capped at 30 flips, EV = $30), students still won't bid $30. The problem is the **distribution**, not just the sum.

  **2. Variance and "Risk of Ruin"**
  Point to the 3 live rounds you played.
  *   *"In our 3 live rounds, the average payout was probably around $4. The EV is $15. Why the difference?"*
  *   **Explanation:** The EV is driven by the **outliers** (the 1-in-32,000 chance of winning $32,000). In a single lifetime (or a 75-minute class), you will almost never see the outlier.
  *   **Decision Theory Concept:** **Risk Aversion.** People care about the *variance*, not just the mean. Maximizing EV works if you can play the game 10,000 times (Law of Large Numbers). It fails for a **one-off decision**.

  **3. Diminishing Marginal Utility (Bernoulli's Solution)**
  This is the core philosophical takeaway.
  *   *"Is the 10th dollar you win worth the same to you as the 1,000th dollar?"*
  *   Draw a Utility Curve (Concave) on the board. $U(x) = \ln(x)$.
  *   Explain that while the *monetary* value doubles, the *utility* (happiness/usefulness) does not.
  *   **The Fix:** If we maximize **Expected Utility** instead of Expected Value, the sum converges. The paradox dissolves if we assume people value money logarithmically.

  **4. The Bank's Perspective (Solvency)**
  *   *"If I charge you $15, and I have to play this with 24 of you, I will likely make a profit. But if I play with 10,000 people, one of you will hit the 15-flip jackpot, and I will go bankrupt."*
  *   **Point:** EV assumes the "Bank" has infinite depth. In the real world, contracts are limited by the solvency of the counterparty. This links to **credibility** in economic commitments.

  ---

  ### Troubleshooting: What Goes Wrong & How to Fix It

  **1. The "Math Bro" (Expected Value Maximizer)**
  *   **Scenario:** One student insists they would pay $100 (or their whole endowment) because "The EV is higher than the cost."
  *   **The Fix:** Do not shut them down. Use them.
      *   *Ask:* "Do you have infinite liquidity? If you lose 10 times in a row (which is likely), can you afford to keep playing?"
      *   *Ask:* "If I offer you a game where you win $1 trillion with 0.0000001% probability and lose $10 otherwise, the EV is huge. Do you take it?"
      *   *Lesson:* This introduces the **Kelly Criterion** or **Risk of Ruin**. Rationality depends on your bankroll size relative to the stake.

  **2. The "Lowballers" (Boredom/Disbelief)**
  *   **Scenario:** Everyone bids $1. They think it's a trick or don't trust you to pay.
  *   **The Fix:** Address the **Trust Constraint**.
      *   *Say:* "Part of the St. Petersburg Paradox in the real world is that no casino *could* pay the infinite payout. Your low bids might be rational because you don't believe the House is solvent. That is a valid economic critique of the paradox!"
      *   *Engagement:* To fix boredom, make the live rounds dramatic. If you get 5 tails in a row, build tension. "We are now at $64... next flip is for $128..."

  **3. Time Creep**
  *   **Scenario:** You get a long run of tails in the live game.
  *   **The Fix:** Enforce the **House Limit** strictly.
      *   *Script:* "We are at flip 12. To save time, I am declaring the next flip is the last regardless of outcome."
      *   *Preparation:* Have a slide ready with the payout schedule so you don't have to calculate $2^{12}$ on the fly.

  **4. The "It's Just Risk Aversion" Objection**
  *   **Scenario:** Students say, "This isn't a paradox, people are just risk-averse."
  *   **The Fix:** Agree with them, but refine it.
      *   *Say:* "Exactly! That *is* the resolution. The 'Paradox' is only a paradox if you assume Rationality = Maximizing Expected Monetary Value. If you assume Rationality = Maximizing Expected Utility, there is no paradox. The lesson is that **EV is a bad proxy for rationality in one-off high-variance cases**."

  ---

  ### Limitations: What This Activity Cannot Reproduce

  Be honest with the class about the simulation's limits during the debrief:

  1.  **True Infinity:** You cannot simulate an infinite EV. You must explain that the classroom game is a *truncated* version. The philosophical punch relies on them imagining the cap removed.
  2.  **Repeated Play:** The paradox is strongest when the agent plays *once*. If students think they can play 100 times, their bids will go up (converging toward EV). Ensure you emphasize this is a **single-shot decision**.
  3.  **Utility Isolation:** This activity conflates **Risk Aversion** (disliking variance) with **Diminishing Marginal Utility** (valuing additional dollars less). In advanced theory, these are distinct (see: Rabin's Calibration Theorem). For an undergrad econ-phil course, it is acceptable to treat them as overlapping explanations, but note that Bernoulli's specific solution was about *utility*, not just fear of risk.

  ### Instructor Cheat Sheet: The Numbers
  *   **Payoff:** $2^n$
  *   **Probability:** $1/2^n$
  *   **EV Contribution per round:** $1
  *   **Cap at 10 flips:** EV = $10. Max Payout = $1,024.
  *   **Cap at 15 flips:** EV = $15. Max Payout = $32,768.
  *   **Cap at 20 flips:** EV = $20. Max Payout = ~$1 Million.
  *   *Recommendation:* Cap at **15 flips**. $15 EV is high enough to feel "cheap" if they bid $2, but the max payout ($32k) feels "life changing" enough to justify the utility curve argument.

  ### Closing the Session
  End with this question for their next reading/response:
  *"If Expected Value doesn't tell us what to pay, and Utility is subjective, is there any objective way to criticize someone's decision? Or is rationality entirely relative to the agent's bankroll and risk tolerance?"*
