answer: |-
  This is a profound and weary question, one that I suspect many senior metaethicists whisper to themselves after grading yet another set of essays on Blackburn's *Spreading the Word* or Gibbard's *Wise Choices, Apt Feelings*. You are right to sense that the dialectic has calcified. The moves are indeed catalogued: the *tonk*-style objections, the negation problem, the deep embedding issues, the hybrid retreats, and the quasi-realist counter-punches.

  Let's evaluate your hypotheses, because they are not mutually exclusive, but they do have different weights.

  **(a) The Verbal Disagreement:** This is the deflationist's hope, but it is too optimistic. If it were merely verbal, the stakes wouldn't feel so high. The disagreement isn't just about the label "expressivist"; it's about the metaphysics of normativity. If the quasi-realist succeeds perfectly, they earn the right to say moral sentences are "true." But the realist insists that *truth* in their sense requires truth-makers (moral properties/facts). The expressivist insists *truth* is just a device for endorsement. This isn't just terminology; it's a clash over the ontology of value. However, there is a grain of truth here: as quasi-realism succeeds, the *practical* difference between the views diminishes, leading to the "collapse" objection.

  **(b) The Methodological Disagreement:** This is the strongest of your four options. The impasse is largely a clash of semantic paradigms. The realist (and the critic of expressivism) operates within a truth-conditional semantics (TCS) framework where logic is defined as truth-preservation. They ask, "What are the truth conditions of the antecedent?" The expressivist replies, "There are none, but there are conditions of *acceptability* or *commitment*." The critic hears this as "You have no semantics." The expressivist hears the critic as "You must be a realist to have a logic."
  This is a category clash. The critic demands an explanation of validity in terms of *world-to-word fit* (representation); the expressivist offers an explanation in terms of *consistency of attitudes*. Until one side accepts the other's explanatory currency, no progress is possible.

  **(c) Substantive Disagreement about Data:** This is the weakest option. Both sides agree that *Modus Ponens* works in moral discourse. They agree that "Lying is wrong; if lying is wrong, then stealing is wrong; therefore stealing is wrong" is valid. They do not disagree on the intuitions about validity; they disagree on what *makes* it valid.

  **(d) The Ill-Posed Distinction:** This is the most radical and perhaps the most philosophically fertile. If the belief/desire distinction is a folk-psychological oversimplification (as some cognitive science and "hybrid" expressivists suggest), then the FG problem loses its bite. However, even if mental states are hybrid, the *logical* problem remains: how do we account for the *structure* of reasoning without propositional content? Merely blurring the mental states doesn't automatically solve the embedding problem in semantics.

  ### A Fifth Diagnosis: The "Success Dilemma" (The Quasi-Realist Squeeze)

  I propose a diagnosis that synthesizes (b) and (a) but adds a dynamic element. The impasse persists because of a **Dilemma of Success**.

  The Frege-Geach problem forces expressivism to become more sophisticated. To solve FG, the expressivist must construct a semantics that mimics the logical behavior of propositional logic.
  1.  **If the expressivist fails** to mimic propositional logic adequately, they are accused of failing to explain moral reasoning (the standard FG objection).
  2.  **If the expressivist succeeds** in mimicking propositional logic (as Gibbard and later Schroeder arguably do), they construct a formal system where moral sentences behave *exactly* like truth-apt propositions.

  At this point, the realist pounces: "If your moral sentences have semantic values that compose functionally, obey logical laws, and can be called 'true' in a consistent logic, in what sense are you still an *expressivist*? You have simply built a realist semantics with a different metaphysical gloss."

  This is the **Quasi-Realist Squeeze**. The impasse persists because the expressivist is trying to walk a tightrope: they must be realist *enough* to solve FG, but anti-realist *enough* to remain distinct from realism. The critic argues that the tightrope leads inevitably to the realist side. The expressivist argues the tightrope is a distinct path. Neither can push the other off without conceding their core methodological commitments.

  ### What Would Count as Progress?

  Given this diagnosis, what moves the needle?

  **1. Not More Formal Systems.**
  We have enough formal systems (B-logic, Gibbard's norm-expressivism, Schroeder's *Being For*). The problem isn't technical; it's interpretative. A new formal result won't help unless it comes with a philosophical argument for why *this* formalism captures the *nature* of normativity better than the alternatives.

  **2. Not Empirical Findings (Directly).**
  Psycholinguistic data on how speakers process moral conditionals is interesting, but the FG problem is normative, not descriptive. It asks, "What *makes* this inference valid?" not "Do people *think* it's valid?" Empirical data might undermine the belief/desire distinction (supporting hypothesis d), but it won't solve the semantic embedding issue on its own.

  **3. A Metaphilosophical Shift: Deflationism and the Role of Semantics.**
  Progress is most likely to come from a clarification of **truth minimalism**.
  The impasse relies on the realist assuming that "truth" is a robust property requiring truth-makers. If both sides can agree on a deflationary account of truth (where "It is true that lying is wrong" adds nothing to "Lying is wrong"), the FG problem dissolves into a pseudo-problem.
  *   *The Progress:* If expressivists can convince realists that logic requires only *discipline* in the use of terms, not *reference* to properties, the methodological demand (hypothesis b) loses its force.
  *   *The Hurdle:* Realists argue deflationism is insufficient for *normativity*. They want truth to explain *correctness*, not just logical consistency.

  **4. Distinguishing "Semantic Content" from "Semantic Value."**
  A promising distinction (drawn by authors like Matthew Chrisman or in relational expressivism) is separating what a sentence *does* (its semantic value/function) from what it *says* (its content).
  *   *Progress:* If we can articulate a notion of "content" that is shareable across asserted and unasserted contexts without being "propositional" in the realist sense, we break the deadlock. This requires a new vocabulary that neither side currently accepts. We need a theory of **non-propositional content** that is robust enough to embed.

  ### Should We Expect the Impasse to Persist?

  Yes, and perhaps it *should*.

  The persistence of the FG debate tells us something important about metaethics: **It is not a scientific inquiry waiting for a discovery; it is a conceptual negotiation.**

  The debate is stuck because it is asking a question that sits at the boundary of two incompatible frameworks: the *scientific/naturalistic* framework (which demands truth-conditions and causal explanations) and the *normative/practical* framework (which demands reasons and commitments).
  *   The Realist tries to naturalize normativity (fitting it into the truth-conditional framework).
  *   The Expressivist tries to normalize logic (fitting it into the normative framework).

  **The Value of the Impasse:**
  The stagnation is productive. It forces both sides to refine their accounts of logic, truth, and mental states.
  *   Realists have had to develop more sophisticated accounts of moral motivation (to avoid the expressivist's initial advantage).
  *   Expressivists have had to develop rigorous logics (to avoid the FG objection).

  **Conclusion:**
  The best diagnosis is a deepened version of **(b)**: It is a methodological disagreement about the **explanatory priority of logic vs. psychology**.
  *   **Progress** will not come from a "knockdown" argument. It will come from a **reflective equilibrium** where one framework proves more theoretically virtuous overall (simpler, more explanatory, less metaphysically costly).
  *   Currently, the cost is split: Realism pays a metaphysical cost (queer properties); Expressivism pays a semantic cost (complex, non-standard logic).
  *   The impasse persists because neither side agrees on which cost is more acceptable.

  As a teacher, you might frame this for your students not as a problem waiting for a solution, but as a **structural tension** in our understanding of language and value. The Frege-Geach problem isn't a bug in expressivism; it's the friction point where the *logic of truth* rubs against the *logic of action*. That friction is where the philosophy lives. To resolve it entirely might be to misunderstand the distinctness of the normative domain.

  So, do not expect a surrender. Expect the debate to shift toward **metasemantics**: not "What is the meaning?" but "In virtue of what do our moral terms have the meaning they do?" That is the next frontier, and it may finally dissolve the FG problem by showing that both sides are answering different questions about the same linguistic practice.
