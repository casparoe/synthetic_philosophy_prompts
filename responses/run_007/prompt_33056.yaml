answer: |-
  1. System A is a standard mammalian brain with intact synaptic connectivity within a single skull. System B consists of the same mammal's neurons maintained in separate nutrient chambers, with signals transmitted via external circuitry to precisely mimic original connectivity across a room. Both realize identical fine-grained computations, yet A appears cohesive while B appears fragmented.

  2. The computational functionalist asserts that moral status supervenes on abstract information processing, rendering the physical medium irrelevant. Since A and B implement identical state transitions and input-output dispositions, this view grants them equal moral patienthood. The physical scattering of B's components does not diminish its functional identity.

  3. The biological naturalist argues that moral status depends on specific biological causal powers inherent to living tissue. Because both systems utilize actual biological neurons rather than silicon substitutes, this view typically grants moral status to both A and B equally. The spatial separation of the neurons does not negate their biological nature.

  4. Integrated Information Theory posits that consciousness corresponds to the amount of integrated information a system generates above its parts. System A possesses high integration due to direct synaptic connectivity, whereas System B's external routing creates informational bottlenecks that drastically reduce its phi value. Consequently, IIT verdicts that A is conscious and morally significant while B is not.

  5. The feature driving the intuitive asymmetry is intrinsic physical continuity versus extrinsic symbolic routing. If we remove this distinction by physically reintegrating B's neurons, the case collapses into a standard intuition-pump where all theories converge on granting status. This confirms that our moral hesitation stems from the lack of physical unity rather than computational incapacity.
