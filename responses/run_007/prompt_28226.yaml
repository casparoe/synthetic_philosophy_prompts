answer: |-
  **Decision Tree: Responses to Sen's Liberal Paradox**

  1.  **Consider two individuals: one prefers a book be banned regardless of their own reading, another prefers it be read regardless of their own reading. Should these preferences count equally with preferences about one's own private consumption in social evaluation?**
      *   **No:** **Domain restriction on meddlesome preferences**. Excluding interfering preferences restores consistency without sacrificing Pareto or liberalism.
      *   **Yes:** Go to 2.

  2.  **If satisfying everyone's preference requires forcing an individual to act regarding their own private body or property, must the social procedure forbid this coercion?**
      *   **Yes:** **Rights as side-constraints**. Deontological rights trump Pareto efficiency to protect individual spheres.
      *   **No:** Go to 3.

  3.  **If two individuals could mutually benefit by exchanging control over their respective private choices, should they be permitted to contractually surrender their protected status?**
      *   **Yes:** **Waivable or alienable rights**. Gibbard's solution allows paradox-generating rights to be traded away for Pareto improvements.
      *   **No:** Go to 4.

  4.  **Should a right be defined as the freedom to choose a strategy within a rule set, rather than decisiveness over specific final social outcomes?**
      *   **Yes:** **Game-form rights**. Modeling rights as game forms (e.g., Blume et al.) avoids outcome-based conflicts.
      *   **No:** Go to 5.

  5.  **If respecting individual decisiveness and Pareto generates a cyclic social preference, is it acceptable to select an outcome via a non-preference-based tie-breaker rather than demanding transitivity?**
      *   **Yes:** **Preference relaxation**. Accepting cycles (e.g., Batteau et al.) avoids impossibility by weakening rationality requirements.
      *   **No:** **Rights folded into welfare**. Without constraints, waivers, game-forms, or cycle-acceptance, rights are merely instrumental to preference satisfaction.

  **Annotations**

  *   **Unnamed Combinations:** All paths above correspond to defended positions in the literature; no leaf is marked unnamed.
  *   **Indistinguishable Leaves:** **Rights as side-constraints** and **Game-form rights** often yield identical protections in practice despite theoretical differences. *Further question:* Is the right a constraint on social choice functions or a feature of the strategic form?
