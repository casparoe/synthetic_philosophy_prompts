      *   **User's Stance:** Defends the GEB line (self-reference is the *skeleton* of awareness, dissolving the mystery). Rejects the Lucas/Penrose anti-mechanist argument.
      *   **Friend's Stance:** Claims it's an unfalsifiable metaphor dressed as an argument.
      *   **Goal:** Identify "defeaters" for the GEB view. Sort them by severity (fatal to awkward). Determine which worries are valid, which a defender would concede, and which can be ignored. Address the issue of falsifiability/risk.
