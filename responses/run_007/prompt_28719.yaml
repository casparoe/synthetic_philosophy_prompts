      *   *Conversation:* Philosophy is an ongoing conversation of mankind.
      *   *Contingency:* Language, self, and community are contingent historical products.
      *   *The Human/Non-Human Distinction:* Rorty was a staunch humanist (in a secular, Deweyan sense). He cared about *suffering* and *humiliation*.

  3.  **Evaluate Option A (The "Words Do the Work" View):**
