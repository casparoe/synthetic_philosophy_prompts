answer: |-
  Here is a defended research agenda for your three-year collaboration.

  ### The Strategic Pivot
  Most disposition research is conducted by metaphysicians using armchair intuitions about glass and poisons. Your team's comparative advantage is the **Philosophy of Language** and **Philosophy of Science** seats at the table. If you spend three years debating Lewis-style counterfactuals in a vacuum, you are underutilizing two-thirds of your team.

  Therefore, my recommendation is to **invert the traditional order of operations**. Do not start with the metaphysics (CA, finks, intrinsicness) and use language/science as illustrative examples. Start with the language and the science, and let them constrain the metaphysics.

  I recommend you commit to **two core questions**, treating the others as dependent variables to be solved in Year 3 based on the results of the first two.

  ---

  ### Question 1: The Semantics of Dispositional Ascriptions (Year 1)
  **Candidate:** *Whether the semantics of dispositional ascriptions... should be driving the metaphysics at all.*

  **Why this is upstream:**
  Metaphysical debates about dispositions are often stalled because opponents are relying on conflicting linguistic intuitions about cases (e.g., "Is the poisoned glass still fragile?"). If the semantics of dispositional adjectives (fragile, soluble, irritable) are context-sensitive, gradable, or vague, then many "metaphysical" problems are actually semantic artifacts. You cannot settle the metaphysics of the property until you settle the semantics of the predicate.

  **Division of Labor:**
  *   **Phil Language:** Lead on the formal semantics. Are dispositional adjectives gradable (like "tall")? Do they have hidden modal operators? How does context shift the standard for "fragile"?
  *   **Phil Science:** Provide the corpus. How are dispositions actually ascribed in scientific papers (materials science, pharmacology, ecology)? Do scientists treat "soluble" as binary or probabilistic/graduable?
  *   **Metaphysics:** Act as the "ontological check." If the semantics imply a certain ontological commitment (e.g., to irreducible modal properties), is that cost bearable?

  **Tractability:**
  High. There is a growing literature on the semantics of modals and gradable adjectives that you can apply directly. It is bounded enough for a 12-month deep dive.

  **Kill Criteria (When to demote this):**
  If, by month 9, you conclude that dispositional semantics are **purely pragmatic** with no ontological bite (i.e., the semantic content is just categorical + laws, and the "dispositional" feel is entirely conversational implicature), then this project loses its metaphysical engine. If the semantics turn out to be trivial, you must pivot immediately to Question 2 and treat language as a mere heuristic.

  ---

  ### Question 2: Intrinsicness and Scientific Practice (Year 2)
  **Candidate:** *Whether dispositions must be intrinsic, and what to do with apparently extrinsic ones.*

  **Why this follows Question 1:**
  Once you know how we *talk* about dispositions, you must ask what *properties* satisfy that talk. The "Intrinsic Dispositions" dogma is the biggest bottleneck in the field. It forces metaphysicians to perform contortions to explain away relational properties (like "being a key"). Your Phil Science member is crucial here: in biology, ecology, and quantum mechanics, properties are rarely intrinsic in the classical sense. They are affordances, interactions, or context-dependent potentials.

  **Division of Labor:**
  *   **Phil Science:** Lead on case studies. Identify "extrinsic dispositions" in actual science (e.g., enzyme-substrate affinity, quantum contextuality, ecological affordances). Argue for their reality against the "intrinsic only" crowd.
  *   **Metaphysics:** Refine the definition of 'intrinsic'. Can it be patched to include relational properties, or must we adopt a structuralist ontology?
  *   **Phil Language:** Analyze the syntax of extrinsic ascriptions. When we say "This is a key," is 'key' a disposition? How does the linguistic structure mirror the metaphysical relation?

  **Tractability:**
  Medium. This is a classic metaphysical problem, but your angle (scientific practice) makes it novel. The risk is getting bogged down in defining 'intrinsic'. Keep the focus on the *scientific examples* to ground the debate.

  **Kill Criteria (When to demote this):**
  If you find that the distinction between intrinsic and extrinsic is **verbally unstable** across scientific disciplines (e.g., physics defines it one way, biology another) and no unified metaphysical account can capture both without being trivial, drop the quest for a unified theory. Instead, publish a deflationary paper arguing that 'intrinsic' is a context-dependent classifier, not a metaphysical natural kind.

  ---

  ### Year 3: Synthesis (The "Fink/CA" Resolution)
  **Candidate:** *Whether the conditional analysis can be patched... [and] whether the finks/masks/antidotes taxonomy is principled.*

  **Strategy:**
  Do not make this a primary research question in Year 1 or 2. Instead, treat the Conditional Analysis (CA) and the Fink/Mask taxonomy as **outputs** of Questions 1 and 2.
  *   If Question 1 shows dispositional semantics are context-sensitive, then "finks" and "masks" may just be shifts in context, not metaphysical threats to the CA.
  *   If Question 2 shows dispositions are often extrinsic, then the "antidote" cases (which rely on intrinsic bases) may be misdescribed.

  **Division of Labor:**
  *   **All:** Co-authorship. This is where you write the "State of the Field" papers that leverage your previous two years of work.
  *   **Metaphysics:** Draft the positive account of dispositions based on Year 1 & 2 findings.
  *   **Language/Science:** Stress-test the account against the counterexamples (finks/masks) to see if they dissolve under the new semantic/metaphysical framework.

  **Why this order?**
  If you start with Finks/Masks (Year 1), you will get stuck in the Lewis/Martin/Johnston loop. By starting with Semantics and Science, you might dissolve the loop entirely. For example, if "fragile" is gradable (Q1) and relational (Q2), the standard counterexamples to the CA might lose their force because they assume binary, intrinsic properties.

  ---

  ### What to Drop (The Trade-Offs)

  **1. Pan-dispositionalism (The Regress Worry)**
  *   **Verdict:** **Drop as a primary focus.**
  *   **Reasoning:** This is too speculative for a 3-year empirical/conceptual collaboration. It is pure metaphysics with little input from Phil Language or Phil Science (unless you focus heavily on QM, which narrows your scope too much). It is also "downstream": you can't know if everything is a disposition until you know what a disposition *is* (Q1 & Q2).
  *   **Risk:** You could spend 3 years on this and produce no consensus, as the regress argument is often a stalemate of intuition.

  **2. Patching the Conditional Analysis (Abstractly)**
  *   **Verdict:** **Demote to Year 3.**
  *   **Reasoning:** Trying to patch the CA without fixing the semantics is like fixing a leaky roof while ignoring the cracked foundation. Many "patches" (like Martin's reciprocal disposition partners) are essentially admitting that the simple CA is dead. Don't spend Year 1 tinkering with a formula that might be semantically ill-formed.

  ### Summary of the Agenda

  | Year | Focus | Lead | Goal |
  | :--- | :--- | :--- | :--- |
  | **1** | **Semantics of Ascriptions** (Gradability, Context) | Phil Lang | Determine if dispositional problems are semantic artifacts. |
  | **2** | **Intrinsic vs. Extrinsic** (Scientific Case Studies) | Phil Sci | Break the "Intrinsic Dogma" using scientific data. |
  | **3** | **Synthesis** (CA, Finks, Masks re-evaluated) | Metaphysics | Publish a positive theory that dissolves or resolves the classic counterexamples. |

  ### Final Honest Assessment
  This agenda is risky because it challenges the orthodoxy that metaphysics drives the bus. Traditional metaphysicians may criticize you for "linguisticizing" ontology or "scientizing" metaphysics. However, given your team composition, this is your only path to a unique contribution. If you try to beat the metaphysicians at their own game (pure CA patching), you will be slower and less original than they are. If you play to your strengths (Language + Science), you can redefine the playing field.

  **The biggest risk:** That Year 1 (Semantics) and Year 2 (Science) drift apart. You must enforce a strict requirement that the Semantic analysis must be compatible with the Scientific data, and the Metaphysical conclusion must satisfy both. If the Phil Lang person produces a formal semantics that no scientist would recognize, you have failed. If the Phil Science person produces case studies that the Metaphysician cannot ontologically ground, you have failed. Keep the feedback loop tight.
