  # Decision Tree: Computational Complexity and Epistemology

  **Instructions:** Answer the following diagnostic questions based on your philosophical intuitions about the cases provided. Follow the branches to locate your position in the logical space. The leaves (end-points) represent distinct philosophical stances.

  ### Branch Questions

  **Q1. The Feasibility Boundary (Case 3)**
  *Consider an $O(n^{100})$ algorithm alongside an $O(2^{n/100})$ algorithm. For all realistic input sizes ($n < 10^5$), the exponential algorithm is faster. Does this counterexample demonstrate that "Polynomial Time" (P) is the wrong philosophical category for "Feasible Computation"?*
  *   **Yes:** Go to **Q2**.
  *   **No:** Go to **Q3**.

  **Q2. The Deflation Strength (Follow-up to Q1)**
  *If P is the wrong category, does this imply that *no* complexity class (feasibility bound) marks a normative boundary for knowledge, or is "feasibility" still real but just mislabeled by P?*
  *   **No complexity bound matters:** **Leaf 1 (Strong Deflationary)**.
  *   **Feasibility still matters:** **Leaf 2 (Feasibility Realist)**.

  **Q3. The Omniscience Obligation (Case 2)**
  *Consider a Bayesian agent who assigns probability 1 to a set of axioms but cannot feasibly compute their logical consequences (due to coNP-completeness or undecidability). Is this agent *irrational* for failing to believe the consequences?*
  *   **No (Not irrational):** Go to **Q4**.
  *   **Yes (Irrational/Ideal required):** **Leaf 3 (Idealization Defender)**.

  **Q4. The Source of the Bound (Follow-up to Q3)**
  *If the agent is not irrational, is their failure to believe the consequences a limitation on what they can *justifiably believe* (epistemic), or merely on what they can *act upon* (pragmatic)?*
  *   **Pragmatic (Belief is fine, action is bounded):** **Leaf 4 (Pragmatic Boundedness)**.
  *   **Epistemic (Belief itself is constrained):** Go to **Q5**.

  **Q5. Surveyability (Case 1)**
  *Consider a theorem whose shortest proof in a standard system is longer than any human could check in a lifetime. If the proof exists mathematically but cannot be surveyed by a human, is the theorem *known*?*
  *   **Yes (Existence suffices):** Go to **Q7**.
  *   **No (Checkability required):** Go to **Q6**.

  **Q6. The Meta-Theoretic Rescue (Case 1 Variant)**
  *In the long proof case above: Suppose there is a short metatheoretic argument proving that "a formal proof of this theorem exists." Does this meta-argument grant knowledge of the theorem, even if the object-level proof is unsurveyable?*
  *   **No:** **Leaf 5 (Strict Finitist)**.
  *   **Yes:** **Leaf 6 (Moderate Finitist)**.

  **Q7. Finding vs. Checking (Case 4)**
  *Conditional: If someone handed us a polynomial-time algorithm for SAT (P=NP), would *finding* a proof be epistemically identical to *checking* one? Does the difficulty of discovery contribute to the epistemic status of the result?*
  *   **Yes (Discovery difficulty is epistemically significant):** **Leaf 7 (Complexity-Sensitive Epistemology)**.
  *   **No (Only verification matters for knowledge):** **Leaf 8 (Finding/Checking Realist)**.

  ***

  ### The Leaves (Positions)

  1.  **Strong Deflationary:** Complexity classes are artifacts of worst-case asymptotics and specific machine models. They have no bearing on epistemology or rationality; the debate is philosophically shallow.
  2.  **Feasibility Realist (Unnamed):** P is not the correct boundary (e.g., due to large constants), but the distinction between feasible and infeasible is still a real joint in nature that constrains rationality.
  3.  **Idealization Defender:** Logical omniscience is a regulative ideal for rational agents. Intractability explains why we fail, but does not excuse us from the norm of believing consequences.
  4.  **Pragmatic Boundedness (Unnamed):** Agents are not required to believe intractable consequences. The limitation is on *using* the belief for action, not on the justification of the belief itself.
  5.  **Strict Finitist:** Knowledge requires human surveyability. A proof that cannot be checked is not a proof *for us*, and meta-arguments about existence do not rescue the knowledge claim.
  6.  **Moderate Finitist (Unnamed):** Direct surveyability is required for standard knowledge, but indirect surveyability (via a meta-proof of existence) suffices for theorems with astronomically long proofs.
  7.  **Complexity-Sensitive Epistemology:** Tractability constrains what a finite agent can know. If finding a proof is intractable, the agent cannot know the theorem, even if the proof exists.
  8.  **Finding/Checking Realist:** The asymmetry between finding and checking is deep (even if P=NP), but it does not license strong epistemological conclusions; verification alone grounds knowledge.

  ***

  ### Analysis of Logical Space

  **Unseparable Pairs:**
  *   **Idealization Defender vs. Strong Deflationary:** This tree separates them via Q1/Q3, but a philosopher who thinks "P is wrong" (Q1=Yes) but "Omniscience is still the norm" (Q3=Yes) ends up in **Leaf 3**. The tree does not distinguish a Deflationary Idealist from a P-Realist Idealist. Both are grouped under **Leaf 3**.
  *   **Feasibility Realist vs. Complexity-Sensitive:** Both believe tractability constrains knowledge. They are separated only by their view on the technical definition of P (Q1). If a philosopher thinks P is roughly correct but the *reason* it matters is different, they may be misclassified.

  **Unoccupied/Incoherent Combinations:**
  *   **Strict Finitist + Idealization Defender:** This combination is **incoherent**. One cannot hold that agents ought to believe all logical consequences (Omniscience) while simultaneously holding that unsurveyable proofs do not yield knowledge (Finitism), given that most consequences require unsurveyable proofs.
  *   **Pragmatic Boundedness + Complexity-Sensitive Epistemology:** This combination is **unattractive**. Leaf 4 claims belief is *not* constrained by complexity, while Leaf 7 claims it *is*. Holding both requires a distinction between "belief" and "knowledge" that is rarely defended in this context.
  *   **Strong Deflationary + Feasibility Realist:** This cell is **empty by definition** (Q2 forces a choice). However, the space of "P is wrong, Feasibility matters, but no specific class is the boundary" is **unexplored** in the literature; most defenders of feasibility simply propose a different class (e.g., feasible in practice) rather than abandoning classes entirely.

  **Justification of Splits:**
  *   **Q1/Q2 (Feasibility):** Isolates the view that complexity is merely engineering (Deflation) from views where it is normative. Splits the "P is wrong" crowd into those who throw out feasibility entirely and those who seek a better class.
  *   **Q3 (Omniscience):** The primary fault line in epistemic logic. Separates those who treat logic as a normative constraint on belief from those who treat it as a descriptive constraint on capacity.
  *   **Q4 (Source):** Distinguishes between "You know it but can't use it" (Pragmatic) and "You don't know it" (Epistemic). Crucial for separating doxastic logic from resource-bounded knowledge.
  *   **Q5/Q6 (Surveyability):** Addresses the "Apriori" nature of proof. Splits those who require human verification (Finitism) from those who accept Platonic existence. Q6 refines the Finitist position to account for meta-mathematical knowledge.
  *   **Q7 (Finding/Checking):** Isolates the specific epistemic weight of *discovery*. Distinguishes those who think hardness of discovery limits knowledge (Complexity-Sensitive) from those who think only verification matters (Finding/Checking Realist).
