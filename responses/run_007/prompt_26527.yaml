answer: |-
  While the neurological criterion is the legally and medically definitive standard of death in most Western jurisdictions, there is a genuine philosophical case for the circulatory-respiratory criterion that renders your parents' position intellectually coherent rather than simply mistaken, though this does not compel the hospital to maintain ventilation indefinitely.

  The medical declaration of brainstem death, which is the legal standard in the United Kingdom under the Code of Practice issued by the Academy of Medical Royal Colleges, rests on the biological principle that the brainstem is the essential integrator of the organism as a whole. When the brainstem ceases to function, the body loses the capacity to maintain homeostasis, breathe spontaneously, or sustain consciousness, meaning the organism as a unified entity has ceased to exist even if cellular life continues in isolated tissues via artificial support. From this perspective, the ventilator is not sustaining life but rather delaying the inevitable decomposition of a corpse by mechanically oxygenating blood; the warmth and heartbeat you observe are physiological reflexes or artefacts of machinery, not signs of an living organism.

  However, your parents' adherence to the circulatory-respiratory criterion is not merely an emotional denial but aligns with a longstanding philosophical and cultural tradition that equates life with the pulse and breath. Historically, and in many religious frameworks, death is viewed as a process rather than an event, defined by the departure of the vital principle which manifests visibly through the heart and lungs. Philosophically, one can argue that as long as the body exhibits integrated biological functions such as wound healing, growth, or gestation (as seen in rare cases of pregnant women declared brain dead), the organism retains a level of somatic integration that challenges the absolute finality of the neurological criterion. Therefore, their view possesses internal consistency and moral weight within their specific cultural framework, even if it contradicts current statutory law.

  You should be highly confident—virtually certain—that under UK law and current medical consensus, your sister is legally dead and the hospital is within its rights to withdraw support. However, you should hold moderate confidence in the philosophical absolute that brain death is the *only* valid definition of death, as bioethics remains a field of debate rather than empirical proof. The weakest point in the prevailing neurological argument, and thus the strongest foothold for your parents' view, is the phenomenon of prolonged somatic integration; some patients declared brain dead have maintained homeostasis, grown, and even gestated foetuses for weeks or months, suggesting that the brainstem is not the sole organiser of biological life. This ambiguity does not change the legal reality you face, but it validates that your parents' resistance is rooted in a defensible philosophical disagreement rather than a simple failure to comprehend the facts.
