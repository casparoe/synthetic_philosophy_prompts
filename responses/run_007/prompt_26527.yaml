  My sister was in a car accident last month. The doctors have declared her brain dead — her entire brain, including the brainstem, shows no activity on two separate EEGs and there is no intracranial blood flow. Her body is being kept on a ventilator, so her heart is still beating, her chest rises and falls, and her skin is warm to the touch. The hospital wants to withdraw life support, but my parents cannot accept that she is dead while her body exhibits these signs of life. They point out that in our home country, death is understood as the irreversible cessation of heartbeat and breathing, and they want her transferred to a facility that will keep her on the ventilator indefinitely. I am caught between respecting my parents' view and accepting what the medical team tells me. I need to think through what it even means to be dead — not just legally, but philosophically. Is there a genuine philosophical case for the circulatory-respiratory criterion over the neurological criterion, or is my parents' position ultimately just an understandable but mistaken refusal to accept the facts? I want to know how confident I should be in whichever answer, and what the weakest point in that answer is. Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question. Please write in British English.
