  2.  **Deconstruct the Covering-Law Model (Hempel's D-N Model):**
      *   *Core Idea:* Explanation = Argument. Explanandum (event to be explained) is the conclusion. Explanans (premises) = Initial Conditions + General Laws.
      *   *Strength:* Rigor, objectivity, unification of science.
      *   *Application to History:* To explain the Fall of Rome, one needs laws of societal collapse + specific conditions of Rome.
      *   *Strongest Version:* It's not that we *have* the laws now, but that explanation *ideally* commits us to their existence. It's a regulative ideal. "Rational reconstruction."

  3.  **Brainstorming Objections (The Narrative Camp):**
      *   *Lack of Laws:* History doesn't have strict laws like physics. Sociological "laws" are tendentious or trivial.
      *   *Contingency:* History is path-dependent. Small changes matter. Laws imply regularity; history is often unique.
      *   *Agency/Meaning:* Human actions are driven by reasons, motives, and meanings, not just causal pushes. Understanding (*Verstehen*) vs. Explaining (*Erklären*).
      *   *Narrative Structure:* Historians write stories. Beginning, middle, end. Plot structures. This isn't just decoration; it's cognitive.
      *   *Context:* Actions make sense *in context*, not under a universal law.
      *   *Retrodiction:* We often explain backwards from outcome to cause, not forwards from law to outcome.

