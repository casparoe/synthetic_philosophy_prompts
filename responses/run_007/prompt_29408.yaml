      *   *Opening:* Validate the structural insight. Yes, they are formally related.
      *   *The Pivot:* But the "no group mind" conclusion is where you lose the plot.
      *   *Point 1: Inconsistency vs. Intransitivity.* Inconsistency is a harder constraint. It forces a choice between procedures (PBP vs CBP). This choice *constitutes* the group's agency.
      *   *Point 2: List & Pettit's Actual View.* They are realists about group agency. They argue groups *can* be agents, but they must be "reason-responsive."
      *   *Point 3: The Normative Gap.* Individuals are psychologically constrained to be consistent (mostly). Groups are not. This means group agency is an *achievement*, not a given.
      *   *Conclusion:* Don't abandon corporate agency. Refine it.

  7.  **Refining the "Committed Take":**
