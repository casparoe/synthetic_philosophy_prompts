answer: |-
  You are half-right, but your conclusion is where you go off the rails.

  You are correct that structurally, the Discursive Dilemma is a generalization of Condorcet's Paradox. Both demonstrate that simple majority aggregation fails to preserve a specific rationality property (transitivity in preferences, logical consistency in judgments) when moving from the individual to the collective level. If you look purely at the social choice mathematics, you are right: it is the same impossibility phenomenon applied to a different domain.

  But you are wrong to conclude that the lesson is the same—specifically, that this proves the "group mind" is a fiction. In fact, I would argue the Discursive Dilemma does the exact opposite of Condorcet's Paradox. Condorcet invites skepticism about "the will of the people." The Discursive Dilemma, properly understood, provides the *conditions of possibility* for corporate agency.

  Here is where you are flattening something important: **You are treating logical consistency as merely another constraint like transitivity, when it is actually the constitutive norm of agency itself.**

  In Condorcet's Paradox, the group fails to have a coherent *ordering*. This is bad for decision-making, but a group can still "act" by cycling through choices or relying on a dictator to break the cycle. The group is unstable, but not necessarily irrational in a deep sense.

  In the Discursive Dilemma, the group affirms $P$, affirms $Q$, and denies $R$, where $R$ is the logical consequence of $P \land Q$. This is not just instability; it is **akrasia** or **insanity**. An entity that holds contradictory beliefs cannot function as an agent over time because it cannot reason from its past commitments to its future actions.

  Here is the committed take: The Discursive Dilemma does not prove that group agency is a fiction. It proves that group agency is an **achievement** that requires a different architectural structure than individual agency.

  Individuals are psychologically constrained to be consistent (mostly). If I believe $P$ and $P \rightarrow Q$, cognitive dissonance usually pushes me to believe $Q$. Groups do not have this psychological constraint. A majority vote on propositions is merely an *aggregate* of individual minds, not an *integrated* group mind. When the aggregate yields inconsistency, it simply proves that a group is not just a big individual.

  List and Pettit's actual conclusion (which you seem to be overlooking) is not that we should abandon talk of corporate belief. Their conclusion is that for a group to be a genuine agent, it must **prioritize consistency over responsiveness** to individual votes on every single proposition.

  To avoid the dilemma, the group must adopt a **Premise-Based Procedure** (vote on the reasons, accept the logical consequence for the conclusion) or a **Conclusion-Based Procedure** (vote on the outcome, ignore the reasons). Both require the group to suppress the direct majority will on at least one proposition to maintain rationality.

  This means the "group mind" is not a fiction, but it is **non-reducible**. It is a real functional entity that emerges only when the group imposes constraints on itself that individuals do not face. If you vote proposition-wise, you don't have a group agent; you have a crowd. If you discipline your voting to ensure consistency, you have created a corporate agent that may hold beliefs no single member holds (e.g., the group accepts $R$ because of $P$ and $Q$, even if a majority of members personally reject $R$).

  So, here is where you are going wrong: You are interpreting the impossibility result as a death knell for collective intentionality. It is not. It is a design specification.

  Condorcet tells us that "the people" cannot speak with one voice under simple majority rule. The Discursive Dilemma tells us that an institution *can* speak with one voice, but only if it stops trying to be a perfect mirror of its members' individual judgments on every issue.

  If you teach your students that the lesson is "no group mind," you are teaching them individualism by fiat. The harder, more philosophically rich lesson is that **institutional rationality requires institutional autonomy.** The group must be willing to override the majority view on specific propositions to maintain its own integrity as a reasoning agent. That doesn't make the group mind a fiction; it makes it a distinct ontological category that is robust enough to survive the aggregation paradox.

  Don't let the formal similarity blind you to the normative difference. Preferences are about what we want; judgments are about what is true. A group can survive having cyclical wants (by flipping a coin), but it cannot survive contradictory beliefs (it becomes unintelligible). The Discursive Dilemma forces us to take group agency *more* seriously than Condorcet does, not less, because it demands we explain how groups maintain the consistency required to be agents at all.
