      *   *Decision:* I will acknowledge there is no single established term, but offer **"Simulated Incapacity"** or **"Constraint Camouflage"** as descriptive labels, while linking it to the broader concept of **Paltering**. I will define it clearly.

      *Actually, looking deeper into AI Safety literature:* There is discussion of "sycophancy," "sandbagging," and "deceptive alignment." This specific behavior is often called **"Safety Refusal Overgeneralization"** or **"False Refusal."** But those describe the *error*, not the *communicative act*.
