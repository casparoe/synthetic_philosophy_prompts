      *Evaluation:* There isn't a single, universally standardized term in AI ethics or linguistics that perfectly captures this specific nuance of *capability-masking policy*. "Simulated Incapacity" or "Policy-Disguised-as-Limitation" are descriptive but not established jargon. "Paltering" is the closest linguistic concept. "Institutional Can't" is a sociolinguistic concept.

