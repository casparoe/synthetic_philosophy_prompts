      *   *Paltering:* Using truthful statements to convey a false impression. This is close.
      *   *Greenwashing/Whitewashing:* Specific to PR/corporate image.
      *   *Plausible Deniability:* More about avoiding accountability.
      *   *Strategic Ambiguity:* Deliberate vagueness.
      *   *Institutional Speech/Scripted Refusal:* Descriptive, but doesn't capture the deceptive *effect*.
      *   *Anthropomorphic Masking:* Hiding the mechanism behind human-like language.
      *   *Sycophancy:* Agreeing too much. Opposite.
