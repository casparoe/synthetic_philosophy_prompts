prompt: |-
  I sit on the working group that decides which new diagnoses make it into the next revision of our association's classification manual, and we've got a proposal in front of us to add a new category — "persistent climate distress disorder" — for people whose anxiety, grief, or guilt about environmental change lasts more than six months and gets in the way of work or relationships. Half the group thinks this is long overdue: there are clearly people suffering in a distinctive way, and without a code they can't get reimbursed for treatment or included in research. The other half thinks we're about to create the very thing its supposed to describe: once the label exists, people will take it up as an identity, advocacy groups will form around it, clinicians will start seeing it everywhere, and the criteria will drift until we're classifying a different phenomenon than the one the proposal's authors think they're naming. I've been handed the job of drafting the group's decision memo for next month's vote. It needs a clear bottom line — approve, reject, or approve with conditions — plus a concrete timetable, and it should take the losing side's strongest consideration seriously rather than just listing objections. I keep coming back to the looping-effects worry (the idea that classifying people can change the people classified), but I'm not sure how far that gets us, since every diagnosis shapes the thing it names to some degree. So the memo has to say where the line is between "that's just normal classification" and "that's a loop we should refuse to set running." If you recommend conditions, make them concrete enough that the committee could actually adopt them — for instance, a re-evaluation schedule, a monitoring requirement, or limits on who can receive the diagnosis.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a working group deciding on new diagnoses for a classification manual (like DSM or ICD).
      *   **Task:** Draft a decision memo for next month's vote regarding "Persistent Climate Distress Disorder" (PCDD).
      *   **Decision:** Needs a clear bottom line (Approve, Reject, or Approve with Conditions).
      *   **Requirements:**
          *   Concrete timetable.
          *   Address the "looping effects" concern (Hacking's concept) seriously, not just as an objection.
          *   Distinguish between normal classification effects and harmful looping.
          *   If conditions are recommended, they must be concrete (re-evaluation, monitoring, limits).
          *   Tone: Professional, balanced, decisive, nuanced.

  2.  **Evaluate the Options:**
      *   *Option A: Reject.* Pros: Avoids looping effects, medicalizing normal distress. Cons: Denies treatment access, ignores genuine suffering, stifles research.
      *   *Option B: Approve Unconditionally.* Pros: Immediate access to care, validates suffering. Cons: High risk of diagnostic inflation, potential for harmful identity formation around pathology, ignores the looping effect risk.
      *   *Option C: Approve with Conditions (Provisional).* Pros: Balances access with caution, allows for data collection on looping effects, acknowledges the novelty/uncertainty. Cons: More administrative burden.

      *Decision:* Option C is the most intellectually honest and practically useful path. It acknowledges the reality of suffering (validating Side A) while taking the looping effect risk seriously (validating Side B). It allows the committee to draw the "line" requested in the prompt.

  3.  **Address the Core Philosophical Problem (Looping Effects):**
      *   *The Prompt's Challenge:* Every diagnosis shapes the thing it names. Where is the line between "normal classification" and "a loop we should refuse"?
      *   *The Distinction:* Normal classification stabilizes a pre-existing cluster of symptoms to aid treatment. Harmful looping *creates* the cluster or amplifies it to the point where the diagnosis becomes a self-fulfilling prophecy or a primary identity that hinders recovery/adaptation.
      *   *Application to PCDD:* Climate change is real. Distress is real. But is the distress *internal pathology* or a *rational response*? The risk is pathologizing a rational response, which changes the person's relationship to the threat from "active engagement" to "patienthood."
      *   *Solution:* The conditions must mitigate the risk of the diagnosis becoming an identity or a substitute for action, while ensuring it remains a tool for relief.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly immediately. (Recommend: Provisional Approval).
      *   **Context:** Briefly summarize the proposal and the division in the group.
      *   **The Core Argument (The Looping Effect):** Address the philosophical concern directly. Define the line between useful classification and harmful looping.
          *   *Useful:* Facilitates care, reduces isolation.
          *   *Harmful:* Reifies a transient state, discourages adaptive action, creates a "sick role" around a global threat.
      *   **The Decision (Provisional Approval):** Explain *why* this strikes the balance. It grants codes/reimbursement (Side A win) but limits entrenchment (Side B win).
      *   **Concrete Conditions (The "How"):**
          *   *Sunset Clause/Re-evaluation:* Must be reviewed in X years.
          *   *Diagnostic Guardrails:* Must rule out general anxiety/depression first. Must demonstrate functional impairment *beyond* normal concern.
          *   *Research Requirement:* Mandate data collection on identity formation/outcomes.
          *   *Clinician Guidance:* Emphasize adaptive coping vs. symptom suppression.
      *   **Timetable:** Specific dates for implementation, review, and vote.
      *   **Conclusion:** Reiterate the ethical stance.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Needs to sound like a senior committee member. Objective, thoughtful, authoritative but collaborative.
      *   *Addressing Side B:* Don't dismiss them. Acknowledge that their fear is theoretically sound (Hacking's looping effects). Show how the conditions mitigate this.
      *   *Addressing Side A:* Acknowledge the immediate need for care.
      *   *The "Line":* Explicitly articulate the distinction requested. The line is drawn at *adaptivity*. If the diagnosis promotes adaptation, it's good. If it promotes withdrawal/identity fixation, it's bad.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is "Provisional Approval" a real thing in DSM/ICD contexts?
      *   *Fix:* Yes, "Conditions for Further Study" or provisional codes exist. I will frame it as a "Provisional Category with Mandatory Review."
      *   *Critique:* Are the conditions concrete enough?
      *   *Fix:* Instead of "monitor outcomes," say "submit data on remission rates and functional outcomes." Instead of "be careful," say "exclude patients whose primary barrier is lack of social support."
      *   *Critique:* Did I answer the "where is the line" question?
      *   *Fix:* Ensure the section on "Distinguishing Classification from Harmful Looping" is prominent.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Clear bottom line? Yes (Provisional Approval).
      *   Concrete timetable? Yes (3-year review cycle).
      *   Take losing side seriously? Yes (Looping effects addressed as central rationale).
      *   Concrete conditions? Yes (Exclusion criteria, data mandates, clinician guidelines).

  8.  *(Final thought on the "Line"):* The key distinction is between *validating suffering* and *medicalizing a worldview*. The conditions must ensure the diagnosis treats the *impairment*, not the *belief* about climate change.

  9.  **Drafting the Content.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Classification Revision Working Group
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposal 84-B: Persistent Climate Distress Disorder (PCDD)

  ### **Executive Summary**

  After reviewing the clinical data, ethical considerations, and sociological implications presented over the last quarter, I recommend that the Working Group vote to **Approve with Conditions** the inclusion of Persistent Climate Distress Disorder (PCDD).

  Specifically, I propose we adopt PCDD as a **Provisional Category** for a fixed period of five years, subject to mandatory re-evaluation and strict diagnostic guardrails. This approach secures immediate reimbursement and research capabilities for suffering individuals (addressing the majority's concern) while instituting structural safeguards against diagnostic inflation and harmful identity formation (addressing the minority's concern).

  ### **The Core Conflict: Classification vs. Looping**

  The division within this group centers on what Ian Hacking termed "looping effects." All diagnoses interact with the people they classify; patients read the criteria and adjust their self-understanding accordingly. However, there is a critical distinction between *stabilizing* a condition for treatment and *generating* a condition through classification.

  *   **Normal Classification:** The label captures a pre-existing cluster of symptoms that causes impairment. The label facilitates relief, and as symptoms recede, the identification with the label fades.
  *   **Harmful Looping:** The label creates a social identity that reinforces the symptoms. The diagnosis becomes a primary lens through which the patient views the world, potentially discouraging adaptive action or fostering a sense of permanent incapacitation regarding a global, ongoing threat.

  The risk with PCDD is not that we will misidentify suffering, but that we may medicalize a rational response to an existential threat. If the diagnosis shifts a patient's focus from *coping and adaptation* to *patienthood and symptom management*, we have crossed the line into harmful looping. We must not create a category that encourages withdrawal from civic engagement under the guise of clinical treatment.

  Therefore, our approval must be contingent on ensuring the diagnosis remains a tool for restoring function, not a container for worldview.

  ### **Recommendation: Provisional Approval with Conditions**

  We should vote to include PCDD in the next revision, but only under the following four binding conditions. These are designed to mitigate looping effects while preserving clinical utility.

  **1. The "Adaptive Function" Exclusion Criteria**
  To prevent the pathologizing of rational distress, the criteria must explicitly state that PCDD cannot be diagnosed if the patient's distress is proportional to their direct exposure or if their primary impairment stems from a lack of social/political support rather than internal dysfunction.
  *   *Concrete Requirement:* Diagnostic criteria must include a clause requiring clinicians to document that the patient's functional impairment (work/relationship failure) exceeds what is expected from general climate anxiety and is not better explained by Major Depressive Disorder or Generalized Anxiety Disorder.

  **2. Mandatory Data Submission for Re-evaluation**
  Approval is granted solely for the purpose of data collection regarding the looping effect itself.
  *   *Concrete Requirement:* Any clinician or institution billing under the PCDD code must submit anonymized outcome data to the Association's registry. This data must track not only symptom reduction but also *civic/adaptive engagement* (e.g., return to work, community involvement). If data shows that diagnosis correlates with decreased adaptive functioning over 24 months, the code will be suspended.

  **3. Clinician Guidance on "Active Coping"**
  To prevent the diagnosis from becoming a passive identity, the manual's accompanying text must guide treatment toward active coping rather than mere symptom suppression.
  *   *Concrete Requirement:* The descriptive text for PCDD must recommend treatment plans that include components of "meaningful action" or "values-based engagement." Treatment focused solely on pharmacological reduction of anxiety without addressing the source of distress should be flagged as inconsistent with best practices for this specific code.

  **4. The Five-Year Sunset Clause**
  This category shall not become a permanent fixture without explicit re-authorization.
  *   *Concrete Requirement:* A sub-committee shall be formed immediately to review the registry data in five years. The code will automatically expire unless a vote is held to renew it based on evidence that the diagnosis has improved patient outcomes without significant negative looping effects.

  ### **Timetable for Implementation**

  *   **November 15, 2023:** Working Group Vote on Provisional Approval.
  *   **January 1, 2024:** Drafting of specific diagnostic criteria and "Adaptive Function" exclusions by the Criteria Subcommittee.
  *   **June 1, 2024:** Publication of the Provisional Manual Update; PCDD code becomes active for billing and research.
  *   **June 1, 2026:** Interim review of registry data (focus on diagnostic inflation rates).
  *   **June 1, 2029:** Final Sunset Review Vote. The code expires unless renewed.

  ### **Addressing the Minority Concern**

  To my colleagues who fear we are creating the very phenomenon we wish to treat: I agree that the risk is real. If we approve PCDD as a standard, permanent diagnosis, I would join you in opposition. A permanent label suggests a static pathology, which risks turning a dynamic response to a changing world into a fixed identity.

  However, rejecting the proposal entirely abandons those currently unable to access care due to insurance barriers. It also cedes the definition of this distress to non-clinical actors who may have less rigorous standards. By approving this *provisionally*, we maintain control over the definition. We are not saying, "This is a permanent disease." We are saying, "This is a recognized source of impairment that requires monitoring to ensure our intervention does not worsen the patient's relationship with reality."

  This approach treats the looping effect not as a reason to abstain, but as a variable to be measured.

  ### **Conclusion**

  We are walking a line between validating human suffering and medicalizing the human condition. A standard approval ignores the risk of the latter; a rejection ignores the reality of the former. Provisional approval with strict guardrails allows us to offer help while remaining honest about the limits of our classification system.

  I request that we schedule the vote for the November 15th meeting.

  **Recommendation:** **APPROVE WITH CONDITIONS**
