      *   *Philosophers:* "Does this actually add to the *Leviathan* reading?" "Isn't this just a late-life obsession?" "What about the normative aspect of political philosophy? Does motion explain obligation?" "Why does this matter if the math is bad?"
      *   *Mixed:* "Is this genetic fallacy?" "Does this apply to his optics/physics too?"

  4.  **Selecting and Ordering Objections:**
      *   *Top Priority (Most Damaging/Likely):* The Mathematician's "So What?" (He was wrong, consistency doesn't save him).
