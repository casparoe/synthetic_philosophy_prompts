  I'm a graduate student TA for an undergraduate course on rationality and practical reason. Next week I'm leading a fifty-minute discussion section on Kavka's toxin puzzle. The students will have read the paper, but in my experience most come away thinking it's a cute trick and miss what's philosophically at stake. Don't explain the puzzle to me; plan how I should teach it. I need the order in which the components must be introduced — what conceptual piece has to be in place before the puzzle even bites — and the one worked example or variant that should carry the whole session. I also need a map of the misconceptions students predictably bring or form: confusing intending with predicting one's own future behavior, thinking the puzzle is just about weakness of will, treating an intention as a mental state you can voluntarily adopt at will, and so on. For each, tell me where in the sequence I should head it off and how. Finally, give me a check for understanding I can use in the last three minutes to see whether they've grasped the core issue rather than just retelling the story. End with a one-sentence summary of the session's takeaway, formatted as \answer{...}.
