answer: |-
  # Discussion Section Plan: Kavka's Toxin Puzzle

  **Session Goal:** Move students from viewing the puzzle as a paradox about "getting money" to understanding it as a structural problem about the relationship between intention, action, and instrumental rationality over time.

  ### 1. Conceptual Order of Introduction (0–10 Minutes)
  Do not start with the puzzle story. Start with the conceptual machinery required to make the puzzle generate friction. Introduce these three components in strict sequence:

  1.  **Instrumental Rationality (Means-End Coherence):** Establish that a rational agent takes the means necessary to achieve their ends. If an action does not serve an end (or undermines it), it is instrumentally irrational.
  2.  **The Transparency Condition on Intention:** Establish that intention is not merely a wish or a hope. To intend to $\phi$ entails believing that you will $\phi$ (or at least that you will try to $\phi$) because of that intention. You cannot intend what you know you will not do.
  3.  **The Temporal Gap:** Establish that the reward for intending occurs *before* the action required by the intention. This separates the rationality of *forming* the intention from the rationality of *executing* it.

  *Why this order?* Without (1), there is no norm to violate. Without (2), the agent can simply lie to themselves to get the money. Without (3), the decision to intend and the decision to act collapse into one, dissolving the paradox.

  ### 2. The Worked Example: The Two-Node Decision Tree (10–30 Minutes)
  Do not retell the billionaire story. Instead, draw a **Two-Node Decision Tree** on the board to carry the entire session. This visualizes the structural problem rather than the narrative flavor.

  *   **Node 1 (Midnight):** Choice is [Intend to Drink] vs. [Do Not Intend].
      *   If [Intend]: \$1M deposited immediately.
      *   If [Do Not Intend]: \$0.
  *   **Node 2 (Noon):** Choice is [Drink] vs. [Do Not Drink].
      *   If [Drink]: -Utility (Sickness).
      *   If [Do Not Drink]: 0 Utility change.
      *   *Crucial Note:* The money is already in the bank regardless of the choice at Node 2.

  **How to run it:**
  1.  **Backward Induction (Sophisticated Choice):** Ask students to solve from Node 2 first. At Node 2, the money is sunk. Drinking yields sickness; not drinking yields health. Rational choice: **Do Not Drink**.
  2.  **Forward Evaluation:** Move to Node 1. To get the money, you must Intend. But per the **Transparency Condition**, you can only intend if you believe you will drink. But you just proved at Node 2 that you won't drink. Therefore, you cannot intend. Therefore, you get no money.
  3.  **The Philosophical Bite:** Ask: "Is rationality preventing you from becoming a millionaire?" This frames the stakes: Is instrumental rationality self-defeating?

  ### 3. Misconception Map (30–45 Minutes)
  Address these predictable errors as they arise during the tree analysis. Do not wait for the end.

  | Misconception | Where to Head It Off | How to Head It Off |
  | :--- | :--- | :--- |
  | **Intending = Predicting**<br>("I intend to X" just means "I predict I will X") | **During Conceptual Order (Step 2)** | Ask: "If I predict I will be hit by a bus, do I intend to be hit by a bus?" Force the distinction: Prediction is observational; Intention is commitive. |
  | **Weakness of Will**<br>("The agent just needs more willpower to drink") | **During Worked Example (Node 2)** | Clarify: "This isn't about psychology or courage. At Node 2, drinking is *instrumentally irrational* because the money is already secured. No amount of willpower makes sickness rational." |
  | **Voluntary Intention**<br>("Why can't I just flip a switch and intend?") | **During Discussion (30–35 min)** | Invoke the **Transparency Condition** again. "You cannot believe you will do something you know you have no reason to do. Intention requires a normative ground, not just a mental volition." |
  | **The "Trick" View**<br>("Just hire someone to force you / take a pill") | **During Discussion (35–40 min)** | Acknowledge this is **Self-Binding**, which solves the practical problem but changes the philosophical one. "If you bind yourself, you aren't intending to drink; you're intending to be forced. The puzzle asks if *intention itself* can be rational." |

  ### 4. Check for Understanding (47–50 Minutes)
  Do not ask them to summarize the Toxin Puzzle. Ask them to apply the **Transparency Condition** to a structurally identical case they haven't discussed yet.

  **The Prompt:**
  "A parent tells their child: 'If you cheat on this exam, I will punish you severely.' The parent hates punishing the child and knows that once the cheating is done, punishing will only cause pain with no benefit. Based on Kavka's logic, can the parent *rationally intend* to carry out the threat at the moment they make it?"

  **What to listen for:**
  *   **Failure:** They focus on whether the parent *should* punish or if the threat is moral.
  *   **Success:** They identify that because carrying out the threat is irrational *ex-post* (after cheating), the parent cannot form the intention *ex-ante* (before cheating), making the threat empty unless they can self-bind.

  \answer{The session demonstrates that if rationality is purely forward-looking at every moment, agents may be unable to form the intentions necessary to secure their own best outcomes.}
