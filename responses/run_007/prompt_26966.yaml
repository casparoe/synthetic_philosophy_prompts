answer: |-
  Here is the specification. These are the conditions a theory of pleasure must meet to defeat the Heterogeneity Objection without shrinking the category of "pleasure" until it is trivial.

  ### The Desiderata

  **1. Non-Disjunctive Unity**
  *   **The Case:** The objection claims "pleasure" is a label for a disjointed list (itch-scratch, math, relief). If the theory defines pleasure as "A or B or C," it concedes the objection.
  *   **Requirement:** The theory must identify a single property, mechanism, or relation that is present in all instances. It cannot be a family resemblance cluster; it must be a natural kind or a unified functional role.
  *   **Tag:** **Non-Negotiable.** (Without this, you haven't answered the heterogeneity problem; you've accepted it.)

  **2. Relief Accommodation**
  *   **The Case:** The relief when a scan comes back clean feels like the *cessation* of a negative, not the *presence* of a positive. Yet hedonism counts it as a pleasure.
  *   **Requirement:** The theory must explain how the removal of pain instantiates the same unity condition as the addition of a positive stimulus (e.g., eating cake) without claiming they feel exactly the same.
  *   **Tag:** **Non-Negotiable.** (If you exclude relief to save unity, you fail to capture the full extension of the concept hedonists rely on.)

  **3. Valence-Motivation Independence**
  *   **The Case:** **Unwanted Pleasures** (enjoying a joke you wish you didn't find funny) and **Wanted Pains** (marathon running, childbirth).
  *   **Requirement:** The theory must distinguish the *hedonic value* of the experience from the *all-things-considered desire* to have it. It must explain how something can be hedonically positive but motivationally rejected, or hedonically negative (painful) but motivationally pursued *for the experience itself*.
  *   **Tag:** **Non-Negotiable.** (This blocks the reduction of pleasure to simple desire-satisfaction.)

  **4. Empirical Alignment (Wanting/Liking Dissociation)**
  *   **The Case:** Neuroscience distinguishes "liking" (hedonic impact) from "wanting" (incentive salience). Addicts *want* heroin without *liking* it.
  *   **Requirement:** The theory must map onto this dissociation. It cannot define pleasure as "what is pursued" (confuses wanting/liking) nor as "what is consumed" (ignores the internal state).
  *   **Tag:** **Non-Negotiable.** (A theory of pleasure incompatible with the reward literature is empirically falsified.)

  **5. Qualitative Specificity**
  *   **The Case:** When I scratch an itch, there is a specific "feel." When I solve a proof, there is a specific "feel."
  *   **Requirement:** The theory must account for *what it is like* to have the pleasure. It cannot be purely dispositional (e.g., "pleasure is just being disposed to smile").
  *   **Tag:** **Camp Wishlist (Felt-Quality).** (Attitudinalists and Functionalists deny this is necessary, arguing the 'feel' is irrelevant or variable. Felt-Quality theorists say without this, you've left out the pleasure.)

  **6. Hierarchical Internalism (Mill's Distinction)**
  *   **The Case:** Push-pin vs. Poetry. We intuitively rank some pleasures as "higher."
  *   **Requirement:** The theory must explain whether this ranking is based on the *intrinsic nature* of the pleasure (internal) or external moral criteria bolted on (external). To solve heterogeneity robustly, the hierarchy should ideally emerge from the unity condition itself.
  *   **Tag:** **Camp Wishlist (Qualitative Hedonists).** (Quantitative hedonists reject this, arguing only intensity/duration matter. However, a theory that can internalize this scores higher on intuitive fit.)

  **7. Normative Resonance**
  *   **The Case:** Hedonism is a theory of value. Pleasure must be *good*.
  *   **Requirement:** The property that unifies pleasures must plausibly be the property that makes them good. If the unifying property is "dopamine spike," you must explain why dopamine spikes are good. If it is "taking an attitude of joy," you must explain why that attitude is good.
  *   **Tag:** **Non-Negotiable.** (If the unifying feature is normatively inert, the theory fails as *hedonism*.)

  ***

  ### The Impossible Pair

  **Strict Phenomenal Homogeneity + Relief Accommodation**

  You cannot jointly satisfy **Qualitative Specificity** (requiring a single, distinct "hedonic tone" or feel common to all pleasures) and **Relief Accommodation** (requiring the cessation of pain to count as that same thing).

  *   **Why:** Positive pleasures (eating, sex, math) involve the presence of a stimulus and a specific qualitative "glow." Relief involves the *absence* of a stimulus and the cessation of a negative quality. Phenomenologically, presence and absence are opposites.
  *   **The Cost:** To keep them unified, you must dilute the "feel" so much (e.g., "it feels like things are going well") that it loses **Qualitative Specificity**. Or, you must insist on a specific feel, in which case **Relief** gets excluded or awkwardly forced into the category. Felt-quality theorists usually sacrifice Relief (calling it "neutral"); Attitudinalists sacrifice Specificity (calling it "favoring").

  ### The View-Killer

  **Valence-Motivation Independence**

  This is the single requirement that does the most damage to standard views.

  *   **Why it kills Attitudinal Hedonism (e.g., Feldman):** Attitudinal hedonism defines pleasure as "taking a pro-attitude toward a state of affairs." This collapses valence into motivation. It cannot easily explain **Unwanted Pleasures**. If I enjoy the cigarette but globally wish I didn't, do I hold a pro-attitude? If yes, the theory says I'm benefiting exactly as I should, ignoring the conflict. If no, it's not pleasure. It struggles to separate the *enjoyment* from the *endorsement*.
  *   **Why it kills Simple Felt-Quality Theory:** If pleasure is just a "feel," why do we reject it (unwanted pleasure)? A pure feel theory struggles to explain why the *same feel* is sometimes good and sometimes bad (e.g., sadistic pleasure) without bolting on external criteria, violating **Non-Disjunctive Unity**.
  *   **Why it kills Psychological Hedonism:** It empirically demonstrates that we do not always pursue what we like, nor do we always like what we pursue.

  ***

  ### Scorecard

  | Theory Type | Non-Disjunctive Unity | Relief Accommodation | Valence-Motivation Independence | Qualitative Specificity | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Felt-Quality** (Hedonic Tone) | **Pass** (Claims a common "glow") | **Fail** (Relief is absence, not tone) | **Weak** (Struggles to explain why we reject the "good" feel) | **Pass** | Fails on Relief. |
  | **Attitudinal** (Feldman-style) | **Pass** (Common attitude of "favoring") | **Pass** (Can favor the absence of pain) | **Fail** (Conflates enjoyment with endorsement) | **Fail** (Ignores phenomenology) | Fails on Independence. |
  | **Functional/Representational** (Dretske/Teleological) | **Pass** (Common role/signal) | **Pass** (Signal that homeostasis is restored) | **Pass** (Can misfire/dissociate) | **Weak** (Leaves out "what it's like") | **Best Fit**, but risks eliminating the phenomenology entirely. |

  **Summary:** To beat the heterogeneity objection, you likely need a **Functional/Representational** account that treats pleasure as a signal of value (solving Unity and Relief) while admitting the signal can be decoupled from conscious desire (solving Independence), but you will pay the price of **Qualitative Specificity**. You cannot have the single "feel" and the full range of cases. Pick your poison.
