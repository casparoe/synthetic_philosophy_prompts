prompt: |-
  I'm the best man at my brother's wedding. His new wife is, genuinely, a moral saint — she runs a legal clinic for asylum seekers, gives away more of her salary than most people spend on rent, and has a conscience with no off switch. The room is split: her people think she's a living saint, and our side of the family is already exhausted and a little defensive around her. I need a five-minute toast that's warm and funny, doesn't sell either side out, and doesn't become a lecture. I want it built around the real philosophical worry that a person can be morally excellent in a way that is also, in some respects, not a fully attractive human life — that maximal moral goodness might cost something important. That tension should structure what I can and can't say, and the toast has to end with the couple, not with the philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Best Man (Brother of the Groom).
      *   **Subject:** The Bride (Sister-in-law).
      *   **Bride's Character:** "Moral saint" (runs legal clinic for asylum seekers, extremely charitable, hyper-conscientious).
      *   **Audience Dynamics:** Split room. Her side sees her as a saint; Groom's side is exhausted/defensive around her (likely feels judged or overwhelmed by her intensity).
      *   **Tone:** Warm, funny, 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Core Theme:** The philosophical tension that maximal moral goodness can come at a cost to "ordinary" human attractiveness/relaxation. It shouldn't be a lecture, but this tension should structure the speech.
      *   **Constraint:** Must not sell out either side (don't mock her virtue, don't validate the family's defensiveness too much).
      *   **Ending:** Must end on the couple, not the philosophy.

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Problem:* If someone is *too* good, they can be intimidating. They make everyone else feel lazy or selfish by comparison. It can feel like there's no room for imperfection, which is where humor and relaxation usually live.
      *   *The Solution:* Acknowledge the intensity without mocking it. Frame it as a superpower that needs a grounding wire (the Groom). The Groom's role isn't to "fix" her, but to share the burden and remind her to live, not just save the world.
      *   *The Balance:* Validate the Groom's family's feeling ("it's a lot") without making the Bride the villain. Validate the Bride's side ("she's amazing") without making her a pedestal that no one can reach.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the role, acknowledge the split in the room lightly. Break the ice.
      *   **The Bride's Virtue (The "Saint" Aspect):** Describe what she does. Be specific (asylum clinic, charity). Acknowledge the awe.
      *   **The Tension (The "Exhaustion" Aspect):** This is the tricky part. How to say "she's intense" without saying "she's annoying"? Frame it as *weight*. She carries the weight of the world. That's heavy for everyone around her.
      *   **The Groom's Role:** Why does *he* work? He's not as "holy," but he's human. He grounds her. He makes sure she eats, sleeps, laughs.
      *   **The Synthesis:** Marriage isn't about becoming the same; it's about balancing.
      *   **The Toast:** Bring it back to love and the future.

  4.  **Refining the Tone (Iterative Process):**
      *   *Attempt 1 (Mental):* "She's too good. We feel bad. But my brother makes her normal." -> *Too blunt. Insulting.*
      *   *Attempt 2 (Mental):* "She is a saint. We are sinners. But love conquers all." -> *Too preachy. Ignores the family tension.*
      *   *Attempt 3 (Closer):* "There's a philosophical idea that being perfectly good makes you hard to live with. I see that here. But my brother handles it." -> *Better. Needs more warmth and humor.*
      *   *Key Insight:* Use the concept of "moral gravity." She pulls everyone upward. It's inspiring but tiring. The Groom provides the "floor" so she doesn't float away or burn out.

  5.  **Drafting the Content (incorporating the "Moral Saint" philosophical angle subtly):**
      *   *Reference:* Susan Wolf's "Moral Saints" essay is the academic basis here (a life devoted entirely to morality lacks humor, hobbies, relaxation). I won't name-drop Susan Wolf, but I'll use the logic.
      *   *Humor:* Joke about the gift registry (donations vs. toasters). Joke about the Groom's relative mediocrity (in a loving way).
      *   *Addressing the Family:* Acknowledge that being around her feels like being graded. Reframe it: She's not grading us; she's just operating on a different frequency.

  6.  **Writing the Speech (incorporating timing and flow):**
      *   *Intro:* Welcome everyone. Acknowledge the two tribes.
      *   *Middle 1:* Praise the Bride. Acknowledge the intimidation factor.
      *   *Middle 2:* The philosophical pivot. A life of pure virtue is heavy.
      *   *Middle 3:* Enter the Groom. He is the "human" counterweight.
      *   *Conclusion:* The union of the two. The Toast.

  7.  **Review against Constraints:**
      *   *5 Minutes?* Word count looks right (approx. 800-900 words).
      *   *Warm & Funny?* Yes, self-deprecating humor for the groom's side.
      *   *No Lecture?* Keep the philosophy conversational.
      *   *Ends with Couple?* Yes.
      *   *Doesn't sell out sides?* Validates the Bride's goodness, validates the Family's fatigue (as care/concern), resolves it through the Groom.

  8.  **Final Polish:** Check transitions. Ensure the "exhaustion" doesn't sound like resentment. Make sure the Groom isn't painted as a slacker, but as a nurturer of *her* humanity. (Self-Correction: Make sure the Groom isn't just "the guy who makes her eat pizza." He needs to be the one who *shares* the load.)

  9.  **Final Output Generation** (Proceeding to generate the speech based on these thoughts).
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s brother and the Best Man.

  I've been thinking a lot about what to say tonight. Usually, a Best Man speech is about roasting the groom and praising the bride. But tonight, the dynamic is… specific.

  Looking around the room, I see two distinct tribes. On one side, we have [Bride]'s friends and colleagues. People who have seen her cross-examine immigration judges before breakfast and draft housing legislation before lunch. To you, she is a force of nature. A moral compass that doesn't just point North; it drags the entire ship in that direction.

  On the other side, we have my family. And I want to be honest for a second. We love [Bride]. We do. But if I'm being truthful, we are also a little bit… tired.

  (Light laughter)

  There is a philosophical idea that suggests a person can be so morally excellent that they become slightly difficult to be around. Not because they are mean, but because they are *right*. When you are around someone who gives away their rent money to strangers, it makes your own decision to buy a nice jacket feel a little… indulgent. When you are around someone who treats every conversation like a legal clinic for the oppressed, it makes it hard to just talk about the weather without feeling guilty.

  My family, we're simple people. We like to relax. We like to complain about trivial things. We like to feel that our moral ledger is balanced enough to enjoy a piece of cake. And [Bride], you make the cake taste like it was baked with unearned privilege.

  (Laughter)

  I say this with total love. Because the tension in this room is real. Her side thinks she's a saint. Our side thinks she's a saint, but we're worried about the cost of canonization.

  Because here is the worry: A life of maximal moral goodness is heavy. It is exhausting. If you feel responsible for everything, you are burdened by everything. And if you never turn your conscience off, you never really rest.

  And that is where my brother comes in.

  (Gesture to Groom)

  [Groom] is not a saint. Thank God.

  [Groom] is the one who reminds [Bride] that saving the world is a marathon, not a sprint, and that marathon runners need to eat carbohydrates. He is the one who convinces her that watching a mindless reality TV show is not a crime against humanity; it's maintenance.

  There is a risk in marrying a "saint." The risk is that the marriage becomes another project to optimize, another place to be perfect. But [Groom], you don't try to optimize her. You ground her. You provide the friction that keeps her from floating away into pure abstraction. You are the place where she can put down the weight of the world and just be a wife.

  And [Bride], I need you to know something from my side of the family. We aren't defensive because we judge you. We're defensive because we care about *you*. We see how hard you run. We see how much you carry. And sometimes, we just want you to sit down. We want you to let yourself be ordinary, because ordinary is safe. Ordinary is where you get loved for who you are, not just for what you do.

  So, this marriage is not about [Groom] becoming as good as [Bride], and it's not about [Bride] lowering her standards to match us.

  It's about balance.

  The world needs [Bride]'s fire. It needs her relentless, uncompromising drive to make things right. But [Bride] needs [Groom]. She needs his warmth, his humor, and his ability to distinguish between a crisis and a Tuesday. She needs a partner who loves her enough to tell her that she has done enough for one day.

  Together, they are the perfect ecosystem. She pulls him upward; he holds her steady. She reminds him of what matters; he reminds him of what lives.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your life together be full of justice, yes. But may it also be full of laughter, rest, and the occasional guilty pleasure. May you always fight for the world, but never fight each other. And may you find in one another the one place where you don't have to be perfect to be loved.

  To the happy couple.
