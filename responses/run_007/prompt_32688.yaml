  Dear colleagues, this document serves as the joint statement of our adversarial collaboration regarding the Aunt Hillary thought experiment from Douglas Hofstadter's Gödel, Escher, Bach. After months of discussion, during which we realized we were often talking past each other, the colony-level emergentists and the individual-level skeptics have convened to formalize our shared understanding and isolate the precise nature of our disagreement. We aim to move beyond metaphorical debates and establish a framework where empirical or conceptual progress is possible. To that end, we have compiled a set of foundational claims that both sides endorse without reservation. First, we agree that individual ants operate without centralized planning and possess negligible cognitive capacity on their own. Second, we agree that the ant colony exhibits complex, adaptive behavior that resembles information processing and problem-solving. Third, we agree that mental states generally supervene on physical arrangements, meaning there is no magical substance required for a mind to exist. Fourth, we agree that the distinction between a literal mind and a metaphorical simulation hinges on structural and functional criteria rather than merely behavioral output. Fifth, we agree that if a system processes information in a way that is functionally isomorphic to a human brain, the question of whether it has a mind becomes a substantive ontological issue rather than a linguistic triviality.

  Having established our common ground, we must now articulate the divergence that remains. The colony-level emergentists maintain that the ant colony literally possesses mental states, including beliefs, desires, and potentially a form of phenomenology, which emerge from the interactions of the ants just as human consciousness emerges from neurons. They argue that the substrate does not matter, only the pattern of information flow and symbol manipulation. In contrast, the individual-level skeptics maintain that the colony merely simulates mental states without possessing them ontologically. They argue that minds require a specific type of causal integration found in centralized nervous systems, and that the ant colony is best understood as a useful analogy for mind rather than an instance of one. The skeptics contend that without a unified locus of control and experience, the colony's behavior is best described as distributed computation without a subject.

  To resolve this deadlock, we have identified two primary cruxes, which are subquestions that, if settled, would move at least one side toward the other's position. The first crux concerns substrate independence and functional isomorphism. The question is whether a system that replicates the functional organization of a mind at a high level of abstraction must necessarily share the mental properties of that mind, regardless of the physical medium. The second crux concerns the unity of consciousness and causal integration. The question is whether a system must possess a unified, integrated information structure to host a single mind, or whether distributed systems can host a mind that is equally unified from the inside. We have designed concrete test cases for each crux where both sides agree on the relevance of the outcome, and we have recorded our predictions in advance.

  For the first crux regarding substrate independence, we propose a conceptual test case involving a slow-scale Turing test. Imagine a simulation of the Aunt Hillary colony where the ants are replaced by software agents running on a distributed network, and the interaction speed is slowed down so that one year of colony time passes in one second of observer time. If this system engages in complex, novel dialogue indistinguishable from a human over a long period, does it have a mind? The emergentists predict that if the functional isomorphism is perfect, the system literally has a mind, and the time scale is irrelevant to the ontology. The skeptics predict that despite the behavioral success, the system lacks genuine mental states because the causal powers of the substrate do not support true intentionality, only the appearance of it. For the second crux regarding unity and integration, we propose an empirical test case involving perturbation and lesion studies on a real colony. If we selectively disrupt specific teams of ants that correspond to specific symbolic tokens in the colony's putative language, does the colony exhibit localized deficits consistent with a unified agent losing a specific belief, or does it simply reorganize without loss of function? The emergentists predict that disrupting specific symbol-teams will cause specific, coherent changes in the colony's behavior analogous to brain lesions in humans, indicating a unified functional structure. The skeptics predict that the colony will exhibit graceful degradation or reorganization without specific coherent deficits, indicating that there is no unified agent to suffer the lesion, only a collection of robust processes.

  Finally, we must address the possibility that some of our disagreement is merely verbal. We suspect that a portion of the conflict stems from differing definitions of the word literal. The emergentists tend to use literal in a functionalist sense, where doing the thing makes you the thing, while the skeptics tend to use literal in a biological or phenomenological sense, where being the thing requires specific internal experiences or evolutionary history. If we can agree on a definition of mind that separates functional capacity from subjective experience, we may find that the emergentists are arguing for functional mindedness while the skeptics are arguing for phenomenal mindedness. However, until we have a theory of consciousness that explains how phenomenology arises, we cannot fully dissolve this verbal dispute. We commit to revisiting these predictions and cruxes as new data regarding complex systems and information integration becomes available, hoping that this structured disagreement will prove more fruitful than our previous months of debate.
