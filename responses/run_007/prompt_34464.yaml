      *   *Claim 3 (Animal/Infant Consciousness):* Dogs and infants have conscious experiences. (Common intuition, but challenging for some cognitive theories).
      *   *Claim 4 (Overflow/Phenomenology > Access):* Partial-report (Sperling) shows more phenomenology than access. (Block's Overflow argument).
      *   *Claim 5 (Misrepresentation):* HOTs can misrepresent target (e.g., conscious pain without nociception). (Standard HOT feature).
      *   *Claim 6 (Qualia Location):* "What it is like" (WIL) is fixed by the First-Order (FO) state; HOT only makes it conscious. (Distinctive move, often associated with Rosenthal but sometimes contested).

  3.  **Evaluate Pairwise Consistency (Mental Sandbox):**

      *   *1 & 2:* Consistent. This is the core of standard HOT theory (Rosenthal).
      *   *1 & 3:* Potential Tension. Do dogs/infants have the cognitive capacity for HOTs? If HOTs require complex conceptual apparatus (language, 'I' concept), then 1 & 3 clash. If HOTs can be non-conceptual or simpler, they might be consistent.
      *   *1 & 4:* Potential Tension. Claim 1 says conscious *just in case* HOT. Claim 4 says there is conscious phenomenology *without* access/report. In HOT theory, the HOT *is* the access mechanism (roughly). If the HOT is the thing making it conscious, and the HOT is a cognitive state, does that imply access? Block argues against HOT using Overflow. If there is phenomenology without the HOT (because the HOT is the access), then 1 is false. If the HOT exists but is fleeting (matching the iconic memory), maybe consistent? But Claim 4 says "consciously seen... than subject can later report or access." If HOT = Consciousness, and HOT implies a kind of access (even if not report), does Overflow contradict this?
      *   *1 & 5:* Consistent. This is a feature of HOT theory (targetless HOTs).
      *   *1 & 6:* Consistent. This is the standard Rosenthal view (quality comes from FO, consciousness from HOT).
      *   *2 & 3:* Consistent. Unconscious HOTs in infants? Plausible if cognitive architecture allows.
      *   *3 & 4:* Consistent. Both assert rich phenomenology in entities/cases with limited access.
      *   *4 & 6:* Potential Tension. Claim 6 says WIL is fixed by FO state. Claim 4 says there is more phenomenology than access. If the HOT is required for consciousness (Claim 1), but the FO state exists without the HOT (in the overflow case), is that FO state conscious? Claim 4 says it *is* consciously seen. Claim 1 says it's only conscious *if* there is a HOT. If the overflow is conscious without a HOT, 1 is false. If the overflow is unconscious, 4 is false (as stated).
      *   *3 & 1 (Revisited):* This is the "Cognitive Sophistication" objection. If HOTs require concepts like "I am in state X", do dogs have that?

  4.  **Identify Genuine Tensions:**

      *   **Tension A: HOT Theory (1) vs. Overflow (4).**
