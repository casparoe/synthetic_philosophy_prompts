          *   *Severity:* High. This is the Block vs. Rosenthal debate.
          *   *Resolution:* Either deny Overflow (say the unreportable stuff isn't conscious) or modify HOT (say HOT isn't access).

      *   **Tension B: HOT Theory (1) vs. Animal Consciousness (3).**
          *   *Why:* Claim 1 requires "suitable... higher-order thought." Thoughts usually imply conceptual capacity. Dogs/infants lack complex concepts (especially the concept of 'mental state' or 'I'). If they can't form HOTs, per (1) they aren't conscious. But (3) says they are.
          *   *Severity:* High. This is the "Young Children and Animals" objection.
