          *   *Conflict:* In the misrepresentation case (5), there is *no* FO state (or a different one). If there is no FO state, and HOT doesn't supply quality (6), there is no WIL. But (5) says there *is* a genuine conscious experience (which implies there is something it is like).
          *   *Verdict:* This is the strongest tension. It threatens the coherence of the theory's account of hallucination/illusion.
          *   *Rosenthal's actual view:* Rosenthal actually argues that in targetless HOTs, the quality *is* determined by the HOT. So Claim 6 is actually a deviation from standard HOT theory that creates this bug.

      *   *Refining Tension A (Overflow):*
          *   Standard HOT response to Overflow: The unreportable icons are *unconscious*. Only what is targeted by HOT is conscious.
          *   Claim 4 asserts they *are* consciously seen.
          *   So 1 and 4 are directly contradictory definitions of the extension of "conscious."
          *   *Verdict:* Genuine tension. Severity: High (Empirical/Theoretical clash).

      *   *Refining Tension B (Animals):*
          *   Standard HOT response: Animals don't have HOTs, so they don't have *conscious* states (they have mental states, just not conscious ones). Or, HOTs can be non-conceptual.
          *   Claim 3 asserts they *do* have conscious experiences.
          *   Claim 1 requires HOT.
          *   *Verdict:* Genuine tension depending on how "Thought" is defined. If "Thought" implies language/concepts, it breaks. If "Thought" is broad, it holds. I should flag the definition of "Thought" as the pivot.

  6.  **Ranking and Recommendations:**

