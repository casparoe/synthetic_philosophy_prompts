      *   **Tension C: Quality Location (6) vs. Misrepresentation (5) + HOT Definition (1).**
          *   *Why:* Claim 6 says WIL is fixed by FO state. Claim 5 says HOT can misrepresent. If I have no FO pain state, but a HOT says I do, I have a conscious experience (per 1 & 5). What is the WIL? Claim 6 says WIL is fixed by FO state. But there *is* no FO state. So where does the WIL come from? Rosenthal handles this by saying the HOT *creates* the qualitative appearance, but Claim 6 explicitly says HOT *does not supply* qualitative character. This looks like a direct contradiction.
