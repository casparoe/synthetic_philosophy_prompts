      *   **Lewis (Modal Realism + Counterpart Theory):** Possible worlds are concrete, spatiotemporally isolated universes. An object exists in only one world (world-bound). Modality is analyzed via similarity relations (counterparts) between objects in different worlds.
      *   **The Conflict:** Kripke asks, "What makes it true that *I* could have been a carpenter?" Lewis answers, "It is true that *you* could have been a carpenter because there is a counterpart of you who is a carpenter."
      *   **The User's Worry:** If Lewis says "That's not *you*," hasn't he missed the point of the question?

  3.  **Address the "Changing the Subject" Objection:**
      *   This is a classic objection to Lewis (often called the "Humphrey Objection").
      *   *Lewis's Defense:* He isn't denying the *truth* of modal claims ("I could have been a carpenter"). He is denying the *ontological commitment* required to make them true (strict identity across worlds). He offers a translation scheme. "I could have been F" translates to "There exists a counterpart of me who is F."
      *   *Is it competition?* Yes, because both aim to provide truth-conditions for modal statements. They agree on the *data* (modal statements are true/false) but disagree on the *metaphysics* (what makes them true).
      *   *Nuance:* Lewis thinks "transworld identity" (in the strict sense) is incoherent or leads to paradoxes (like accidental intrinsics). So he replaces the *concept* with a functional equivalent.

