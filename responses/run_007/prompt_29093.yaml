answer: |-
  You have hit on one of the most famous and enduring objections to David Lewis's philosophy. In fact, you are in excellent company: Saul Kripke himself raised this exact concern. In *Naming and Necessity*, Kripke famously remarked that if Lewis's theory is correct, then when we say "Humphrey could have won the election," we are really talking about some other person in another universe who resembles Humphrey. Kripke asked, quite pointedly, why Humphrey should care about what happens to someone else.

  To answer your question directly: **Counterpart theory is indeed a denial of strict transworld identity.** However, it claims to be a genuine alternative account of *modality* (the study of possibility and necessity), not necessarily an account of identity itself.

  Here is how the competition works, why Lewis thought he wasn't changing the subject, and how this distinction might serve your novel.

  ### 1. The Nature of the Disagreement
  You asked how the two theories can compete if Lewis denies the existence of the thing Kripke is explaining. The competition lies in **truth conditions**, not just ontology.

  Both philosophers agree that the sentence "I could have been a carpenter" is sometimes true. They disagree on what makes it true.
  *   **Kripke (Transworld Identity):** The truth-maker is *you*. You exist in the actual world as a novelist, and you exist in a possible world as a carpenter. The "I" refers to the same entity in both contexts.
  *   **Lewis (Counterpart Theory):** The truth-maker is *your counterpart*. You are "world-bound" (you exist only in this world). The sentence "I could have been a carpenter" is analyzed as: "There exists a possible world containing an individual who resembles me closely enough (in origins, character, etc.) and who is a carpenter."

  Lewis argues he isn't changing the subject because he is providing a translation scheme. He believes that ordinary language talks about "possibility," but when we analyze the metaphysics strictly, "identity across worlds" leads to logical contradictions (like your example of accidental intrinsics—being two different heights at once). Therefore, he proposes that what we *mean* by "I could have been..." is actually captured better by counterpart relations.

  ### 2. Is It "Changing the Subject"?
  From Kripke's perspective, **yes**, it is. This is known as the **"Humphrey Objection."** Kripke argues that modality is *de re* (about the thing itself). If I wonder if I could have been happier, I am wondering about *me*, not a duplicate. If Lewis says, "No, you are wondering about a duplicate," Kripke says Lewis has failed to capture the meaning of the thought.

  From Lewis's perspective, **no**, it is not. Lewis argues that our intuition about "strict identity" across worlds is confused. He believes that if we hold onto strict identity, we invite paradoxes. For Lewis, the "feeling" that it is *me* in the other world is explained by the fact that the counterpart is qualitatively identical to me in almost every way that matters. He sacrifices the literal "me-ness" to save logical consistency.

  So, to answer your specific question: Counterpart theory is a genuine alternative account of **modal truth**, but it is a denial of **transworld identity**. It competes with Kripke by offering a different metaphysical price tag for the same modal claims. Kripke pays with "mysterious transworld identity"; Lewis pays with "concrete possible worlds and similarity relations."

  ### 3. Implications for Your Novel
  Since you are writing fiction, you have the luxury of choosing which metaphysics serves your story best. The choice between these two theories creates fundamentally different narrative stakes.

  **If you follow Kripke (Transworld Identity):**
  *   **The Stakes:** When your characters meet their alternatives, they are meeting *themselves*.
  *   **The Conflict:** This creates a psychological horror or deep existential crisis. If the other version is strictly identical to me, then their actions reflect on me. If the "other me" is a murderer, am I a murderer?
  *   **The Logic:** You must be careful with physical differences. If the "other you" has a scar and you don't, Kripke requires an explanation of how one object can have contradictory properties (usually solved by saying properties are relative to worlds, but this can get technical).
  *   **Narrative Vibe:** *Dark Matter* by Blake Crouch or *The Man in the High Castle*. The focus is on the singular soul navigating different paths.

  **If you follow Lewis (Counterpart Theory):**
  *   **The Stakes:** When your characters meet their alternatives, they are meeting **duplicates**.
  *   **The Conflict:** This allows for greater divergence. Since they are not strictly identical, one can be good and the other evil without a logical paradox. They are separate people who happen to share a past up to a certain point.
  *   **The Logic:** This solves the "accidental intrinsics" problem naturally. One is five-foot-ten, the other is five-foot-nine. No contradiction, because they are two different entities.
  *   **Narrative Vibe:** *Everything Everywhere All At Once* or the Marvel Multiverse. The focus is on the variation and the relationship between distinct but similar entities.

  ### 4. Summary
  Lewis would say he is not denying that "you could have been otherwise." He is denying that the way you become otherwise is by being *numerically identical* to someone in another world. He claims to preserve the truth of the statement while cleaning up the metaphysics.

  Kripke would say Lewis has missed the point of personhood. For Kripke, identity is primitive. You are you, regardless of the world.

  For your novel, the tension you identified is the tension between **continuity of self** (Kripke) and **similarity of pattern** (Lewis). If your story relies on the idea that "I am responsible for what my other selves do," you lean Kripke. If your story relies on "I am distinct from my other selves, and we are strangers who look alike," you lean Lewis.

  Both are coherent frameworks, but they tell very different stories about what it means to be "you."
