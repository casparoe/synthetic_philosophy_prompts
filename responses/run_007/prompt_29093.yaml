      *   **Core Philosophical Issue:** The debate between Transworld Identity (Kripke) and Counterpart Theory (Lewis).
      *   **Specific Question:** The user understands that Counterpart Theory (CT) avoids the problem of "accidental intrinsics" (being different heights in different worlds) by denying strict identity across worlds. However, they are confused by the claim that CT is a theory *of* transworld identity. If CT denies transworld identity, isn't it just changing the subject? How can it compete with Kripke if they are talking about different things? Is CT a genuine alternative or just a denial?
