  3.  **The Debate:** Map Reliabilism, Dogmatism, Skepticism to ML concepts (Operationalism, Confidence Calibration, Ground Truth Requirement).
  4.  **Residue Report:** What's lost? (Phenomenology, Normativity, The Regress).
