prompt: |-
  Evolutionary psychologists commonly explain a present-day human trait — sexual jealousy, a language-acquisition instinct, certain mate preferences — by proposing that it is an adaptation shaped by selection in ancestral environments, and they defend the proposal with a mix of cross-cultural data, experiments on modern subjects, and reverse-engineering from the trait's presumed contribution to fitness. Reconstruct the theory of evidence and explanation this method presupposes. In particular: what does it assume about the legitimacy of inferring unobserved ancestral causes from present-day behavioral data; what evidential role does a merely plausible adaptive story play, as distinct from its heuristic role in generating hypotheses; and is the method committed to strong adaptationism, the claim that every trait is an adaptation, or only to the weaker claim that adaptationist hypotheses deserve to be pursued? Then assess the just-so story objection: is it best understood as charging that the practice violates its own implicit standards of evidence, or as rejecting those standards themselves — and what would a practice that took the objection seriously have to do differently?
reasoning: |-
  Here's a thinking process that leads to the essay response:

  1.  **Deconstruct the Prompt:**

      *   **Topic:** Evolutionary Psychology (EP) methodology regarding evidence and explanation.
      *   **Core Task:** Reconstruct the theory of evidence and explanation presupposed by EP methods (specifically regarding traits like sexual jealousy, language, mate preferences).
      *   **Specific Questions to Address:**
          1.  What does it assume about inferring unobserved ancestral causes from present-day data?
          2.  What is the evidential role of a "plausible adaptive story" vs. its heuristic role?
          3.  Is the method committed to *strong adaptationism* (every trait is an adaptation) or *weak adaptationism* (adaptationist hypotheses are worth pursuing)?
          4.  Assess the "just-so story" objection: Does it charge a violation of internal standards or a rejection of the standards themselves?
          5.  What would a practice taking the objection seriously look like?

  2.  **Part 1: Reconstructing the EP Theory of Evidence and Explanation:**

      *   *The Core Logic:* EP relies on "Inference to the Best Explanation" (IBE) within a Darwinian framework. The present trait exists $\rightarrow$ it likely solved a recurrent problem in the Environment of Evolutionary Adaptedness (EEA) $\rightarrow$ therefore, it was selected for.
      *   *Inferring Unobserved Causes:* EP assumes *uniformitarianism* (psychological mechanisms are stable over time) and *functionalism* (complex design implies selection). They treat the mind as a fossil record of sorts. The assumption is that if a trait is universal (cross-cultural) and complex, it's unlikely to be noise or drift; it's likely an adaptation.
      *   *Role of the Adaptive Story:* This is crucial. Is it just a guess (heuristic) or proof (evidential)?
          *   *Heuristic:* Helps generate testable predictions (e.g., if jealousy is about paternity, men should worry more about sexual infidelity, women about emotional).
          *   *Evidential:* In EP, the coherence of the story with evolutionary theory often *counts* as partial confirmation, especially when direct fossil evidence of behavior is impossible. It bridges the gap between "is" and "was."
      *   *Strong vs. Weak Adaptationism:*
          *   *Strong:* Every trait is optimal. (Gould/Lewontin critique target).
          *   *Weak:* Look for adaptations first, but acknowledge spandrels/drift.
          *   *EP Stance:* Officially weak/methodological adaptationism (start by assuming adaptation to find function), but often criticized for sliding into strong adaptationism in practice (assuming the trait *must* be adaptive).

  3.  **Part 2: Assessing the "Just-So Story" Objection:**

      *   *Origin:* Gould and Lewontin (1979).
      *   *The Charge:* Narratives are post-hoc, unfalsifiable, and ignore alternative explanations (drift, constraint, byproduct).
      *   *Interpretation 1 (Internal Violation):* EP claims to be scientific but fails its own criteria (falsifiability, rigorous testing). The stories are too flexible.
      *   *Interpretation 2 (External Rejection):* The objection rejects the *logic* of IBE in historical sciences. It argues that without direct historical data, adaptive stories are inherently speculative.
      *   *Best Understanding:* It's likely a mix, but the strongest version is that EP treats *plausibility* as *probability* without sufficient constraint.
      *   *What would change?*
          *   More emphasis on null hypotheses (drift).
          *   Genetic/developmental evidence (not just behavioral).
          *   Acknowledgment of exaptation/spandrels.
          *   Pre-registration of predictions (to avoid post-hoc fitting).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Define EP's project. State the thesis: EP relies on a specific form of Inference to the Best Explanation grounded in functionalism, which creates tension regarding evidential standards and adaptationist commitments.
      *   **Section 1: Inferring the Unobserved (The EEA):** Discuss the "Psychological Fossil Record." Assumption of continuity. The move from current function to ancestral cause. The reliance on universality as a proxy for genetic encoding.
      *   **Section 2: The Status of the Adaptive Story:** Distinguish Heuristic vs. Evidential. EP often blurs this. The story generates predictions (heuristic), but the *success* of the prediction is often taken as confirmation of the *ancestral* cause (evidential). This is the "reverse-engineering" step.
      *   **Section 3: Strong vs. Weak Adaptationism:** Define the terms. Argue EP officially holds "Methodological Adaptationism" (weak), but functionally operates near "Strong" because non-adaptive hypotheses are often treated as less interesting or harder to model.
      *   **Section 4: The Just-So Story Objection:** Analyze Gould & Lewontin.
          *   *Violation of Standards?* Yes, if predictions are flexible enough to fit any outcome.
          *   *Rejection of Standards?* Yes, if one argues historical reconstruction without physical fossils is impossible.
          *   *Synthesis:* It's primarily a charge of *under-constraint*.
      *   **Section 5: Remediation:** What would a reformed EP look like? Evo-devo integration, genetic mapping, rigorous null models, distinguishing current utility from historical adaptation.
      *   **Conclusion:** Summarize. EP offers powerful explanations but risks circularity. The just-so objection forces a tightening of the link between narrative and data.

  5.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I answer the specific question about the "evidential role" of the story? *Correction:* Make sure to explicitly state that in EP, the *coherence* of the story often carries evidential weight, not just the empirical testing of its predictions.
      *   *Check:* Did I distinguish strong vs. weak adaptationism clearly? *Correction:* Use the term "Methodological Adaptationism" for the weak version, as that's the standard philosophical term.
      *   *Check:* Is the tone appropriate? *Correction:* Maintain philosophical neutrality. Analyze the logic, don't just bash or defend EP.
      *   *Nuance:* Acknowledge that EP proponents (like Buss or Tooby/Cosmides) have responses to the just-so story charge (e.g., generating novel predictions). I need to mention that to be fair before assessing the objection.

  6.  **Final Review against Prompt:**
      *   Reconstruct theory of evidence/explanation? Yes.
      *   Inferring unobserved causes? Yes.
      *   Evidential vs. Heuristic role of stories? Yes.
      *   Strong vs. Weak adaptationism? Yes.
      *   Just-so story objection (violation vs. rejection)? Yes.
      *   What would practice do differently? Yes.

  7.  **Final Polish:** Check for flow, clarity, and precise terminology (EEA, IBE, spandrels, exaptation). (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: Ensure I don't get bogged down in specific examples (like jealousy) but use them to illustrate the *methodological* points. The prompt asks for the *theory of evidence*, not a review of jealousy research specifically.

  8.  **Final Output Structure:**
      *   Intro: EP's explanatory strategy.
      *   Inference to Ancestral Causes (Uniformitarianism & Functionalism).
      *   The Adaptive Story (Heuristic vs. Evidential).
      *   Adaptationism Commitment (Methodological vs. Ontological).
      *   The Just-So Objection (Internal vs. External).
      *   Reforming the Practice.
      *   Conclusion.

