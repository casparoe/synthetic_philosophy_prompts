answer: |-
  Evolutionary psychology (EP) operates on a distinctive epistemological framework that seeks to bridge the gap between observable present-day behavior and unobservable ancestral selection pressures. To reconstruct its theory of evidence and explanation, one must analyze how it treats the mind as a historical artifact, how it validates adaptive narratives, and where it stands on the spectrum of adaptationist commitments. This reconstruction reveals a methodology grounded in *Inference to the Best Explanation* (IBE), which faces significant scrutiny regarding the "just-so story" objection.

  ### 1. Inferring Unobserved Ancestral Causes
  EP presupposes a form of **psychological uniformitarianism**. Just as geologists assume physical laws operated in the past as they do now, EP assumes that the basic computational architecture of the human mind is stable over evolutionary time. Consequently, present-day behavioral data (e.g., sex differences in jealousy) are treated as proxies for ancestral mechanisms.

  The legitimacy of inferring unobserved causes rests on two pillars:
  1.  **Complexity implies Design:** EP adopts a teleological heuristic derived from natural selection. If a trait is complex, species-typical, and functionally coherent (e.g., the language acquisition device), it is presumed to be the product of selection rather than drift or noise.
  2.  **The Environment of Evolutionary Adaptedness (EEA):** EP posits a statistical composite of ancestral environments. By modeling the recurrent problems faced in the EEA (e.g., paternity uncertainty), researchers deduce the mechanisms that *must* have evolved to solve them.

  Thus, the method assumes that **current function illuminates past cause**. It treats the mind as a "fossil record" where psychological mechanisms are the bones, and their current operation allows for the reconstruction of the selective pressures that shaped them. The inference is abductive: the existence of the trait is best explained by the hypothesis that it was an adaptation for a specific ancestral problem.

  ### 2. The Evidential vs. Heuristic Role of Adaptive Stories
  A critical tension in EP methodology lies in the status of the "adaptive story."
  *   **Heuristic Role:** Ideally, an adaptive story serves to generate novel, risky predictions. For example, if jealousy is an adaptation to guard against resource loss or paternity uncertainty, one should predict specific physiological responses to different types of infidelity. Here, the story is a tool for hypothesis generation.
  *   **Evidential Role:** In practice, EP often accords the adaptive story independent evidential weight. Because direct fossil evidence of behavior is impossible, the *plausibility* and *coherence* of the narrative within Darwinian theory often count as partial confirmation. If a story makes sense evolutionarily and fits cross-cultural data, EP practitioners often treat the adaptationist hypothesis as the "null" or default position.

  The method presupposes that **explanatory coherence is a form of evidence**. A story that successfully "reverse-engineers" the trait—showing how it solves a fitness problem—is not merely a guess but a constitutive part of the explanation. The risk here is circularity: the trait is evidence of the selection pressure, and the selection pressure is the explanation for the trait.

  ### 3. Strong vs. Weak Adaptationism
  Is EP committed to the claim that *every* trait is an adaptation (Strong Adaptationism), or merely that adaptationist hypotheses are worth pursuing (Weak/Methodological Adaptationism)?

  Officially, EP espouses **Methodological Adaptationism**. Proponents argue that one must start by testing the adaptationist hypothesis because it is the only theory that predicts *complex functional design*. Non-adaptive explanations (drift, byproducts) are acknowledged but treated as less likely to explain complex mechanisms.

  However, in practice, the method often slides toward **Strong Adaptationism**. By treating the adaptationist hypothesis as the default starting point and requiring high burdens of proof to dislodge it, EP risks treating traits as optimal solutions even when they may be "spandrels" (byproducts of other adaptations) or evolutionary noise. The reconstruction of EP's theory of evidence suggests a commitment to the view that **adaptation is the primary explanatory currency of biology**, and therefore, the primary lens for psychology. While they may not claim *every* trait is adaptive, their methodology is structured such that non-adaptive explanations are often secondary or residual categories.

  ### 4. Assessing the "Just-So Story" Objection
  The "just-so story" objection, famously articulated by Gould and Lewontin, charges that EP produces unfalsifiable narratives that fit the data post-hoc. To assess this, we must determine if the objection claims EP violates its own standards or rejects the standards themselves.

  **Violation of Internal Standards:**
  The objection is best understood primarily as a charge that EP violates its own implicit standards of **falsifiability and constraint**. Scientific explanation requires that a theory rule out certain possibilities. If an adaptive story can be tweaked to accommodate any outcome (e.g., explaining both altruism and selfishness as fitness-maximizing strategies depending on the context), it lacks empirical bite. When EP relies on the *plausibility* of a story rather than the *risky prediction* derived from it, it fails the evidential standards of the hypothetico-deductive method it claims to uphold.

  **Rejection of Standards:**
  Secondarily, the objection rejects the validity of **historical inference without physical traces**. It argues that in the absence of a behavioral fossil record, inferring specific ancestral selection pressures from modern behavior is inherently speculative. This challenges the uniformitarian assumption, suggesting that current utility does not prove historical origin (the problem of *exaptation*).

  **Synthesis:**
  The objection is most potent when viewed as an internal critique: EP claims to be a rigorous science of prediction, but often settles for post-hoc storytelling. The "just-so" charge highlights that **plausibility is not probability**. A story can be evolutionarily coherent yet historically false.

  ### 5. Reforming the Practice
  If EP were to take the just-so story objection seriously, its practice would need to shift in three specific ways:

  1.  **Rigorous Null Models:** Instead of treating adaptation as the default, EP would need to actively model and test non-adaptive hypotheses (e.g., genetic drift, developmental constraints) as competing explanations, not just residual categories.
  2.  **Pre-Registration and Novel Predictions:** To avoid post-hoc fitting, researchers would need to preregister predictions derived from adaptive models before collecting data. The focus must shift from explaining known data to predicting unknown phenomena.
  3.  **Integration with Evo-Devo and Genetics:** Relying solely on behavioral data is insufficient. A robust EP would integrate findings from evolutionary developmental biology and genetics to identify the mechanistic pathways of traits. This helps distinguish between traits that are direct targets of selection versus those that are byproducts of other developmental processes.

  ### Conclusion
  Evolutionary psychology reconstructs human nature by treating the mind as an artifact of ancestral selection. Its theory of evidence relies on the assumption that complex function implies historical design, granting adaptive narratives a status that blends heuristic utility with evidential weight. While officially committed to methodological adaptationism, its practice often privileges adaptive explanations to the point of strong adaptationism. The "just-so story" objection effectively charges that this methodology often lacks sufficient constraint, allowing narrative coherence to substitute for empirical rigor. To survive this critique, EP must tighten the link between story and data, ensuring that adaptive hypotheses are subjected to the same falsifiable scrutiny as any other scientific claim, and acknowledging that not every feature of the mind is a tool forged by selection.
