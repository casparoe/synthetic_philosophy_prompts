  Subject: Draft Joint Statement (sorry for delay!)

  Hi everyone,

  So sorry this is late—had some childcare stuff blow up over the weekend. Attached below is the draft statement we hashed out in yesterday's session. I tried to capture the nuance on the Williams stuff without getting bogged down in the usual jargon. 

  Could you both give this a read? The goal is for you to actually sign this, so I need you to check that the "Agreed Claims" don't make you wince, and that the "Disagreements" table actually reflects where you're stuck rather than just talking past eachother. I highlighted the cruxes section specifically because that's where the real work is.

  Let me know by Friday if this works. There's a typo or two in here I haven't fixed yet (running on coffee), but the philosophy should be solid.

  Best,
  Sam

  ***

  **DRAFT JOINT STATEMENT ON WILLIAMS AND INTEGRITY**

  **Participants:** The Integrity Camp (IC) & The Impartialist Camp (IPC)
  **Date:** October 24
  **Status:** Pending Signature

  **1. Agreed Claims**

  1.  **The Phenomenological Point:** Williams's "one thought too many" example (the husband saving his wife) successfully identifies a genuine alienation in naive act-consequentialism. Both camps agree that a husband who stops to calculate the impartial utility of saving his wife before jumping in has failed morally, regardless of the outcome.
  2.  **Procedure vs. Criterion:** Much of the force of Williams's objection relies on conflating the *criterion of rightness* (what makes an act right) with the *decision procedure* (what the agent should think about). Early act-consequentialism (e.g., Smart-era) often treated these as identical, which was a mistake.
  3.  **Ground Projects:** Both camps agree that "ground projects" (the commitments that give life meaning) are essential for human agency. A moral theory that requires agents to be ready to abandon all projects at any moment for marginal impartial gains is psychologically unsustainable and likely self-defeating.
  4.  **The Jim Case:** In the Jim-and-the-captives case, both camps agree that the situation is tragic and that standard consequentialist reasoning feels deeply violating to integrity. We agree that any adequate moral theory must account for the moral residue or "remainder" felt by the agent who kills the one to save the nineteen, even if the act is deemed permissible or obligatory.
  5.  **Self-Effacement:** Both camps agree that a moral theory can be "self-effacing"—i.e., it can be true that agents ought not to consciously employ the theory's criterion when making decisions. The IPC argues this saves consequentialism; the IC agrees this mitigates the objection but questions whether it solves the justificatory problem.
  6.  **Bad Psychology:** We agree that a moral theory requiring constant impartial calculation is bad psychology. The dispute is not about whether people *should* calculate constantly (they shouldn't), but about what justifies the dispositions they *should* have.

  **2. Disagreements Table**

  | Neutral Formulation of Disagreement | Integrity Camp (IC) Wording | Impartialist Camp (IPC) Wording |
  | :--- | :--- | :--- |
  | **The Source of Justification** | The husband saves his wife because she is *his wife*. The justification is internal to the relationship. Any appeal to impartial good corrupts the virtue of the act. | The husband saves his wife because cultivating dispositions to prioritize loved ones maximizes impartial good. The justification is impartial, even if the thought isn't present. |
  | **The "Shadow" of Calculation** | Even if the agent doesn't calculate, the fact that the *theory* justifies the act via calculation alienates the agent from the act. The shadow of the impartial calculus is still there. | The theory is just a tool for evaluating acts from the outside. If the agent isn't calculating, there is no alienation. The "shadow" is a category error. |
  | **Integrity as a Value** | Integrity is a foundational value that can trump impartial optimization. It is constitutive of the self. | Integrity is valuable instrumentally (or as a component of well-being), but it cannot fundamentally trump the impartial criterion of rightness. |
  | **Self-Effacing Stability** | A theory that tells you not to believe it is unstable. If the theory is true, why hide it? Hiding it admits the theory is alienating. | A theory can be true even if believing it leads to worse outcomes. Truth isn't dependent on our ability to live by it consciously. |

  **3. Cruxes**

  *These are the sub-questions where, if settled, at least one side predicts they would change their view.*

  **Crux A: The Ideal Upbringing Case**
  *   **The Case:** Imagine a society raised from birth by consequentialist engineers to have deep, non-calculating love for their families. They never calculate. They save their wives instantly. The impartial good is maximized.
  *   **IC Prediction:** This shows consequentialism is parasitic. It relies on non-consequentialist motives to function. If the agents knew the *real* justification (impartial optimization), the motives would collapse. Therefore, the theory is deceptive.
  *   **IPC Prediction:** This shows consequentialism is successful. It correctly identifies the best dispositions to cultivate. The truth of the theory doesn't depend on the agents knowing it. We would change our view if IC admits this isn't "deception" but "optimal moral education."

  **Crux B: The Reflective Agent**
  *   **The Case:** The husband survives the rescue. Later, at dinner, a philosopher asks, "Why did you save her?"
  *   **IC Prediction:** The only honest answer is "Because she is my wife." If he says "Because it maximized good," he undermines the act. If he says the former, he is not a consequentialist in that moment.
  *   **IPC Prediction:** He can say "Because she is my wife" and still be a consequentialist, because the theory endorses that reason as the best *first-order* reason. We would change our view if IC admits that endorsing a reason is compatible with not using it as the *criterion* of rightness.

  **Crux C: Moral Remainder**
  *   **The Case:** Jim kills the one captive to save nineteen. He feels terrible afterwards.
  *   **IC Prediction:** This feeling is evidence that he did something wrong, or at least that the theory failed to capture the wrongness. The theory should say "This is tragic and violates integrity," not just "This was optimal."
  *   **IPC Prediction:** The feeling is rational (psychological cost), but the act was right. The theory can acknowledge the pain without admitting the act was wrong. We would change our view if IC agrees that "right act" doesn't mean "act without negative psychological impact."

  **4. Verbal Dispute Assessment**

  We suspect part of the dispute is merely verbal, specifically around the word **"Consequentialism."**

  *   **The Issue:** IC tends to define consequentialism as a *practical mindset* (the agent must aim at the good). IPC defines it as a *structural criterion* (the act is right if it produces the good, regardless of aim).
  *   **Why it matters:** If we define it as a mindset, IC wins (Williams is right, it's alienating). If we define it as a structure, IPC wins (Williams is attacking a strawman).
  *   **Resolution:** We agree to stipulate that for this collaboration, "Consequentialism" refers to the *structural criterion*. However, IC maintains that a structural criterion that cannot be adopted as a mindset without loss of integrity is practically useless or morally suspect. IPC maintains that usefulness isn't truth.

  ***

  Okay, that's the draft. Let me know if the "Cruxes" section feels too stacked toward either side—I tried to keep the predictions balanced but you know how these things go. Also, I think I spelled "concquentialism" wrong in section 4, fix that before you print it.

  Talk soon,
  Sam
