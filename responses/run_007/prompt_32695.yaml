  5. Conclusion: The question isn't "Is death bad?" but "Was life true?"

  *Key Scenes:* The colleagues' reaction (Chapter 1), the "Caius" syllogism, the Black Sack, the Final Light.

  *Philosophers:* Epicurus, Lucretius, Nagel.

  *Tone:* Analytical, decisive.

