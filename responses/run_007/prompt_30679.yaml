      *   *Is it empirical?* Psychology/Neuroscience contributes, but hasn't solved it. Why? Because science describes *mechanisms*, philosophy asks about *rationality/normativity*.
      *   *Is it bedrock?* There's a clash between phenomenological intuition (it *feels* real) and intellectual intuition (it *can't* be real).

  4.  **Separating Settled vs. Contested:**
      *   *Settled:* People *do* report emotional responses to fiction. (Phenomenology). People *do* know fiction is fictional. (Cognitive state). There is a tension between standard cognitive theories of emotion and this phenomenology.
