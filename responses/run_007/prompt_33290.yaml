answer: |-
  ### Exam Question: The Pasadena Paradox and Normative Guidance

  **Question:**
  Nover and Hájek's Pasadena Game generates an undefined expected value due to the conditional convergence of its payoff series. However, the modified "Altadena Game" (which pays exactly $1 more than the Pasadena Game in every outcome) statewise dominates the original. 

  Write an essay evaluating the following claim: *"The Pasadena Paradox does not demonstrate that Expected Value (EV) theory is false, but rather that it is incomplete. Rational agents can still rank these options using dominance reasoning, rendering the undefined EV a mathematical curiosity rather than a decision-theoretic crisis."*

  In your response, you must:
  1. Explain why standard EV theory fails to rank the Pasadena and Altadena games despite the dominance relation.
  2. Assess whether invoking Stochastic Dominance or Statewise Dominance successfully resolves the normative uncertainty, or if it merely shifts the problem to a conflict of principles.
  3. Argue whether this problem is restricted to pathological mathematical constructions or if it generalizes to realistic decision contexts (e.g., long-term ethical planning or unbounded utility scenarios).

  ***

  ### Model Answer

  The claim that the Pasadena Paradox renders Expected Value (EV) theory incomplete rather than false is compelling, but it requires accepting a pluralistic decision theory that prioritizes dominance principles over value maximization when the latter is silent. The core of the Pasadena Game lies in its payoff structure, $(-1)^{n-1} 2^n / n$, which creates a conditionally convergent series. By the Riemann Rearrangement Theorem, the sum depends on the order of terms; since the natural order of states (coin tosses) is arbitrary regarding summation, the EV is undefined. Consequently, standard EV theory cannot assign a value to the Pasadena Game, nor to the Altadena Game (Pasadena + $1). Because neither option has a value, EV theory technically cannot rank them, leaving the agent without guidance based on maximization alone.

  However, the Altadena Game statewise dominates the Pasadena Game: in every possible state of the world, Altadena yields a utility exactly $1 higher than Pasadena. Intuitively, rationality demands choosing Altadena. If we accept Statewise Dominance as a normative axiom independent of EV, the "crisis" dissolves. We do not need to calculate an EV to know Altadena is better. This supports the claim that EV is incomplete; it works when series converge absolutely, but dominance principles must fill the gap when they do not. Hájek himself suggests that dominance is more robust than EV. Therefore, the paradox does not prove EV is *false* (it still works for bounded cases), but that it is not the *sole* normative standard.

  Yet, relying on dominance shifts the problem rather than solving it entirely. If we elevate dominance above EV, we face conflicts in other paradoxes (e.g., two-envelope problems) where dominance intuitions clash with probabilistic reasoning. Furthermore, simply asserting dominance works assumes the states are properly individuated. If the "states" are redescribed, dominance relations can sometimes vanish. Thus, while dominance resolves the Pasadena case, it introduces a new theoretical burden: explaining why dominance trumps EV when EV is defined but low, versus when EV is undefined.

  Finally, regarding generalizability, dismissing Pasadena as a mathematical pathology is risky. While infinite coin tosses are unrealistic, the structural issue—oscillating unbounded utilities—arises in long-term ethical planning and cosmological decision theory. If an agent considers the far future where population sizes and welfare values are unbounded, payoff structures could mimic Pasadena-like oscillations. If EV is undefined in these realistic high-stakes contexts, and we rely solely on dominance, we may find many critical options incomparable. Thus, the paradox highlights a structural vulnerability in any theory relying on summing unbounded utilities, not just a quirk of coin flips.

  In conclusion, the claim is largely correct: EV theory is incomplete. Dominance reasoning successfully ranks Pasadena and Altadena, preserving rational choice without a defined EV. However, this solution requires a hybrid decision theory and acknowledges that unbounded utility functions pose genuine risks for realistic long-term planning, not just abstract games.

  ***

  ### Marking Scheme

  **A Grade (Distinctive Excellence)**
  *   **Specific Move 1 (The Conflict):** Explicitly states that EV theory *cannot* rank the options because $Undefined - Undefined$ is not a valid comparison, even if the difference is constant. They must identify that EV theory goes silent, rather than saying EV gives the "wrong" answer.
  *   **Specific Move 2 (Dominance Status):** Distinguishes between Statewise Dominance and Stochastic Dominance. An A answer notes that Statewise Dominance is sufficient here but discusses *why* it is normatively prior to EV (i.e., it doesn't require summation).
  *   **Specific Move 3 (Generalizability):** Provides a concrete example of where unbounded oscillating utility might occur outside of coin flips (e.g., infinite ethics, cosmological scenarios, or economic growth models). They reject the "it's just math" dismissal with a structural argument.
  *   **Specific Move 4 (Theory Status):** Articulates the distinction between EV being *false* vs. *incomplete*. An A answer argues that EV remains valid for convergent series but requires a supplement (dominance) for divergent ones.

  **B Grade (Competent but Surface-Level)**
  *   **Specific Move 1 (Math Focus):** Correctly explains conditional convergence and the Riemann Rearrangement Theorem but spends >50% of the essay on the mathematics of the series rather than the decision-theoretic implications.
  *   **Specific Move 2 (Dominance):** Mentions that Altadena is better because it pays more, but fails to explicitly name "Statewise Dominance" or explain why this creates a conflict for EV theory specifically.
  *   **Specific Move 3 (Generalizability):** Dismisses the generalizability question with a blanket statement like "infinite games aren't real" without engaging with the structural analogy to unbounded utility in real contexts.
  *   **Specific Move 4 (Theory Status):** Concludes that EV is "broken" or "wrong" rather than "incomplete," missing the nuance that EV works fine for bounded cases.

  **C Grade (Insufficient)**
  *   **Specific Move 1:** Defines the Pasadena Game correctly but fails to mention the Altadena variant or the dominance relation.
  *   **Specific Move 2:** Claims the Expected Value is zero or infinity (mathematical error).
  *   **Specific Move 3:** Fails to address the prompt's specific claim about incompleteness vs. falsity.

  **Automatic Penalties**
  *   **-10%:** If the student claims the Expected Value exists but is dependent on ordering (it is *undefined* in standard decision theory).
  *   **-10%:** If the essay ignores the "Generalizability" requirement in the prompt.
  *   **-20%:** If the answer relies solely on defining conditional convergence without discussing normative guidance (what the agent should *do*).
