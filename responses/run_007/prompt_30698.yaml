      *   *Goal:* Create a formulation that both sides can accept as the *starting* structure.
      *   *Content:* Needs to move from "I can ascribe experiences to myself" to "There is an objective world."
      *   *Key Kant/Strawson elements:* Unity of consciousness, distinction between subjective order and objective order.
