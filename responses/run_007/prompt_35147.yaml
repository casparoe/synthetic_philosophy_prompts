  i want to make a handout for next session — a kind of flowchart or decision tree that takes someone through the different things people think the cogito proves. like, you start with 'i find the cogito convincing' and then each branch asks a question that splits the interpretations apart. at the end you land on a named position about what the cogito actually establishes. i want this to be something people can work through without knowing the positions in advance, so the questions should be about what they actually think, not about which philosopher they agree with.

