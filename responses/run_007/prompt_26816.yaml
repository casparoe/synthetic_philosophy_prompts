answer: |-
  **Lecture Plan: Bertrand's Paradox & The Principle of Indifference (75 mins)**

  **1. Sequence & Dependencies (10 mins)**
  Begin by recapping discrete PoI: logical symmetry warrants equal probability (e.g., dice). Transition to continuous spaces by defining uniform density. *Critical Dependency:* Students must recognize that continuous "equality" requires a measure (length, area, volume). Establish that without a specified measure, "equally possible" is semantically empty. This sets the stage for the paradox not as a math error, but as a definitional ambiguity.

  **2. The Worked Example: Bertrand's Chord (25 mins)**
  Use *only* the Chord Problem. Question: Probability a random chord exceeds the side of an inscribed equilateral triangle?
  *   **Method 1 (Endpoints):** Fix one point, vary the other uniformly over circumference. Result: 1/3.
  *   **Method 2 (Radius):** Chord perpendicular to random radius, midpoint uniform over radius. Result: 1/2.
  *   **Method 3 (Midpoint):** Midpoint uniform over area. Result: 1/4.
  *   **Misconception Head-off 1:** After Method 2, students will claim Method 1 is "biased." Interrupt immediately. Demonstrate that Method 1 satisfies indifference over *angles*, just as Method 2 satisfies indifference over *distances*. The conflict is not mathematical error but conflicting symmetry claims. Emphasize that all three satisfy the *verbal* statement of PoI.

  **3. The Interpretive Crux (25 mins)**
  Pose the central question: Is PoI inconsistent (self-contradictory) or incomplete (needs extra input)?
  *   **Inconsistency View:** If logic alone dictates probabilities, contradictory outputs prove logical failure. PoI is bankrupt.
  *   **Incompleteness View:** PoI requires a privileged parameterization. Logic alone cannot select between 'random endpoint' vs. 'random midpoint.'
  *   **Teaching Stance:** Argue for incompleteness. PoI is not a logical law but a physical symmetry claim. It requires justification beyond mere ignorance (e.g., causal mechanisms). Facilitate a brief debate: ask students if "randomness" exists without a physical process.
  *   **Misconception Head-off 2:** Students may argue "We just need better math (measure theory)." Clarify: Math defines consistency *given* a measure; philosophy must justify *which* measure. Do not let them reduce this to a calculus problem. The problem is epistemic, not analytic.

  **4. What to Leave Out**
  Explicitly state: We are omitting Jaynes' Maximum Entropy solution and formal measure theory. Why? Because solving the math distracts from the epistemic lesson. The goal is to understand the limits of logical probability, not to calculate correct chords. Acknowledge resolutions exist but bracket them to focus on the problem space.

  **5. Check for Understanding (15 mins)**
  Distribute an exit ticket. Do not ask for calculations.
  *   **Question:** "Imagine a factory producing cubes with side length 0–10cm. Using PoI, what is the probability a cube has side < 5cm? What is the probability its face area < 25cm²? Show the contradiction."
  *   **Follow-up:** "Does this contradiction prove PoI is false, or that 'random cube' is ill-defined? Justify your answer in one sentence referencing parameterization."
  *   **Success Criteria:** Students grasp that the paradox arises from variable transformation (side vs. area) and identify that PoI requires physical justification for the chosen variable, not just logical possibility. If they answer "PoI is false," they missed the incompleteness nuance. If they answer "ill-defined," they grasp the parameterization issue.

  **Pedagogical Rationale**
  The order moves from intuition (discrete) to breakdown (continuous) to diagnosis (philosophy). The single example prevents cognitive overload, allowing deep analysis of *why* the methods differ. The exit ticket tests transfer of the philosophical concept to a new context, ensuring they haven't just memorized the chord geometry.
