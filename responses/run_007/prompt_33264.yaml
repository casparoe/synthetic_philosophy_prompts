answer: |-
  # Simulation Design: "The Capacity Trap"

  ## 1. Overview & Learning Objectives
  **Title:** The Capacity Trap
  **Time:** 40 minutes (Game) + 35 minutes (Debrief)
  **Participants:** 16 Students
  **Core Dynamic:** A continuous "Tragedy of the Commons" investment game where individual rationality drives the collective prize to zero.
  **Stakes:** 20 Bonus Participation Points (or equivalent candy/currency). *Note: Ensure this aligns with your institution's grading policies. Framing it as "bonus" rather than "base grade" reduces ethical risk.*

  **Learning Goals:**
  1.  Viscerally experience the pressure to defect even when cooperation is known to be optimal.
  2.  Observe the failure of "cheap talk" (communication without enforcement).
  3.  Map the game mechanics to the formal structure of multipolar traps (Nash Equilibrium vs. Pareto Optimality).

  ## 2. Materials
  *   **Slips of Paper:** 5 per student (80 total).
  *   **Pens:** For everyone.
  *   **Projector/Whiteboard:** To display the "Market State" after each round.
  *   **Instructor Spreadsheet:** Pre-formulated to calculate payoffs instantly (see *Instructor Notes* below).
  *   **Prize Pool:** 20 Participation Points (or 20 pieces of high-quality candy) to be distributed based on final token counts.

  ## 3. The Rules (5-Minute Explanation)
  *Read this script or paraphrase closely:*

  "You are competing firms in a single market. You have 4 rounds to make investment decisions.
  1.  **Endowment:** You start with **0 Points**. You will build your score over 4 rounds.
  2.  **Action:** Each round, write down an **Investment** between 0 and 20 points. Keep it secret.
  3.  **The Pot:** There is a **Prize Pot**. It starts at **320 Points**.
  4.  **The Trap:** For every **1 Point** invested by *anyone* in the class, the Prize Pot **shrinks by 10 Points**. (If the class invests 10 points total, the Pot shrinks by 100). The Pot cannot go below 0.
  5.  **Your Payoff:** You receive a **share of the remaining Pot** proportional to your investment.
      *   *Formula:* (Your Investment ÷ Total Class Investment) × Remaining Pot.
      *   *Note:* Your Investment is **not** subtracted from your payoff. It is merely the 'ticket' to get a share.
  6.  **Goal:** Maximize your total points after 4 rounds. Top scorers get the bonus participation points/candy.
  7.  **Communication:** After Round 2, I will allow 3 minutes of open discussion. You can promise, threaten, or beg. But agreements are **not binding**. I will not enforce them."

  *(Instructor Note: The math is designed so that low investment yields high returns, but the marginal incentive is always to invest more to capture a larger share of the shrinking pie.)*

  ## 4. Timeline (40 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-05 | **Setup** | Explain rules. Distribute slips. Verify understanding. |
  | 05-10 | **Round 1** | Students write bids. Collect. Instructor calculates. Reveal: Total Invested, Pot Size, Average Payoff. |
  | 10-15 | **Round 2** | Students write bids. Collect. Calculate. Reveal results. **Critical Moment:** Pot should be visibly damaged. |
  | 15-18 | **Negotiation** | **Open Floor.** Allow students to talk. They will likely propose a "Cartel" (all bid 1 or 0). |
  | 18-23 | **Round 3** | Students write bids. Collect. Calculate. Reveal. (Expect betrayal of the cartel). |
  | 23-28 | **Round 4** | Final bids. Collect. Calculate. **Final Reveal.** Distribute prizes. |
  | 28-40 | **Transition** | Reset room. Prepare for debrief. |

  ## 5. Instructor Notes & Spreadsheet Logic
  You need a spreadsheet open on your laptop connected to the projector.
  *   **Cell A1:** `Total Investment` (Sum of all bids).
  *   **Cell B1:** `Remaining Pot` = `MAX(0, 320 - (10 * A1))`.
  *   **Cell C1:** `Individual Payoff` = `(Individual Bid / A1) * B1`. *(Handle division by zero: if A1=0, Payoff=0).*
  *   **Display:** Project the `Remaining Pot` and `Average Payoff` after every round. Do **not** project individual scores until the end (to prevent targeted retaliation, though anonymity is hard in a small class).

  **Expected Dynamics:**
  *   **Round 1:** Curiosity. Bids vary (0-10). Pot shrinks slightly. High payoffs.
  *   **Round 2:** Realization that higher bids yield higher shares. Pot shrinks significantly.
  *   **Negotiation:** Students agree to bid 1.
  *   **Round 3:** 3-4 students "defect" (bid 10-20) to steal the pot. Pot collapses. Anger ensues.
  *   **Round 4:** Arms race. Everyone bids 20. Pot = 0. Everyone gets 0.

  ## 6. Detailed Debrief Script (35 Minutes)

  ### Part 1: The Autopsy (10 Minutes)
  **Instructor:** "Look at the final scoreboard. How many of you ended with fewer points than you had after Round 1?" (Show of hands).
  **Instructor:** "Raise your hand if, during Round 3 or 4, you knew exactly what was happening to the group, but felt you *could not* lower your bid."
  *(This identifies the Moloch dynamic: knowledge does not grant escape.)*

  **Instructor:** "Let's look at the Negotiation Phase. Who here genuinely intended to keep the agreement to bid low?" (Most hands). "Who here felt tempted to break it?" (Most hands). "Why didn't the agreement hold?"
  *(Guide them to: Lack of enforcement. Cheap talk. Fear of being the 'sucker'.)*

  ### Part 2: Mapping to Theory (15 Minutes)
  **Instructor:** "Let's translate this into the formal language we've been studying."

  1.  **The Payoff Matrix:** "In a 2-player Prisoner's Dilemma, defecting dominates cooperating. Here, 'Investing More' dominated 'Investing Less.' If the class invests 50 points, and you invest 0, you get 0. If you invest 5, you get a share. Your marginal return on investment was positive *for you*, even though the marginal return on the *system* was negative."
  2.  **Nash Equilibrium vs. Pareto Optimality:** "The Pareto Optimal outcome was everyone bidding 1 (or 0). The Pot stays near 320. Everyone gets rich. The Nash Equilibrium—where no one has an incentive to change their strategy unilaterally—was everyone bidding 20. The Pot hits 0. No one can stop bidding, because stopping means getting 0 while others get everything."
  3.  **Moloch:** "Scott Alexander's 'Moloch' is not a person. It is the name we give to the incentive structure itself. Moloch is the math that said: *'If you care about your score more than the group's score, you must destroy the group's score.'* Did anyone feel like the game was playing *you*, rather than you playing the game?"

  ### Part 3: Real-World Connections (10 Minutes)
  **Instructor:** "Where do we see this outside the classroom?"
  *(Prompt if needed:)*
  *   **Credential Inflation:** "Everyone gets a BA. It becomes worthless. Everyone gets an MA. Still worthless. Cost rises, value stays flat."
  *   **Arms Races:** "Nation A builds missiles. Nation B must build missiles. Both are poorer and less safe."
  *   **Algorithmic Feeds:** "Creators make more extreme content to beat the algorithm. The platform becomes toxic. Users leave. Everyone loses."

  **Instructor:** "In the game, you could have stopped. In reality, can you stop?"
  *(Discuss: Exit costs. In the game, you could accept 0 points. In a job market, 'accepting 0' means starvation. This tightens the trap.)*

  ## 7. Troubleshooting: What Will Go Wrong

  | Problem | Diagnosis | Fix / Adjustment |
  | :--- | :--- | :--- |
  | **The Cartel Holds** | The group successfully coordinates and bids 0-1 in Rounds 3 & 4. The trap doesn't snap. | **Debrief Twist:** Acknowledge their success, but ask: "How long would this last if the class size was 1,000? If there were new students joining next round?" Highlight fragility of trust without enforcement. |
  | **The "Martyr"** | One student bids 0 consistently to prove a point, getting 0 payoff. | **Debrief Focus:** Use them as the hero of the story. "They exited the trap. What was the cost? Could you afford that cost in a real job market?" |
  | **Math Confusion** | Students don't understand the shrinking pot formula. | **Visual Aid:** Draw a pie chart on the board. Erase a slice for every bid collected. Make the depletion physical. |
  | **Apathy** | Students don't care about the points. | **Stakes:** Bring actual cash ($20 bill) or high-value candy. Publicly track scores on the board. Social status is a powerful currency in seminars. |
  | **End-Game Effect** | In Round 4, everyone goes crazy because there's no future punishment. | **Debrief Point:** This is accurate to reality! Many traps accelerate near collapse (e.g., climate change, fiscal crises). Use this to discuss time horizons. |

  ## 8. Limitations: What The Game Cannot Capture
  *Be honest about these in the final 5 minutes.*

  1.  **Exit Options:** In the game, you *had* to play. In reality, actors can sometimes leave the market (go off-grid, emigrate, quit the industry). The trap is tightest when exit is impossible.
  2.  **Heterogeneity:** In the game, everyone started with equal capacity. In reality, some actors (monopolies, superpowers) can absorb losses longer and force others to capitulate.
  3.  **Iteration & Reputation:** This was a one-off seminar game. In the real world, repeated interactions allow for reputation building and punishment of defectors (which can solve the trap).
  4.  **The "God's Eye" View:** You could see the total pot on the screen. In reality, the "collapse" is often opaque until it's too late (e.g., financial crises). We often don't know we are in a Moloch trap until we are deep in it.

  **Closing Thought:** "The point of this seminar is not to say 'collapse is inevitable.' The point is to recognize that *good intentions are not a strategy.* If you want to solve a multipolar trap, you cannot just ask people to be nicer. You must change the incentives, build enforcement, or alter the structure of the game itself. That is the work of policy, institutions, and governance."

