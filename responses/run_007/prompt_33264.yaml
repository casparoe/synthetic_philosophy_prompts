  ### Instructor Prep Checklist
  1.  **Test the Spreadsheet:** Ensure the formula `MAX(0, 320 - (10 * SUM(Bids)))` works correctly.
  2.  **Print Slips:** Pre-cut paper to save time.
  3.  **Grade Policy:** Verify with your department that using participation points this way is permissible. If not, use candy + a "Certificate of Survival."
  4.  **Room Layout:** Ensure students cannot easily see each other's bids while writing (create privacy).
