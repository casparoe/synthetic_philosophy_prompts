answer: |-
  You have stumbled upon the central tension in forecasting literature without needing to read a single paper on the subject. Your intuitions are largely sound, but the self/other asymmetry you identify is the weak link in the chain. It is partially defensible, but it is also the primary vector for your own bias.

  There is indeed a single principle that captures your verdicts, though it requires a slight adjustment to your formulation regarding reference classes. Let us call it the **Principle of Causal Specificity**.

  ### The Principle: Causal Specificity

  The outside view (base rates) should be your null hypothesis. You may only switch to the inside view when you possess specific information that identifies a *causal mechanism* distinguishing your case from the reference class, and where that mechanism is empirically verified rather than narratively constructed.

  Here is how this principle maps onto your cases:

  *   **Friend's Restaurant:** "Talented chef" is a generic attribute. It does not causally override the specific mechanisms of restaurant failure (rent, cash flow, location). **Verdict: Outside View.** (Correct)
  *   **Your PhD:** "Papers published" and "attentive supervisor" are specific milestones that mechanically reduce the probability of dropout. They are verified facts, not hopes. **Verdict: Inside View.** (Correct)
  *   **Colleague's Startup:** You suspect the traction metrics are vanity. You lack verified causal evidence that the growth is sustainable. **Verdict: Outside View.** (Correct)
  *   **Your Startup:** You believe you can distinguish vanity from value. You claim access to verified causal evidence. **Verdict: Inside View.** (Plausible, but risky).
  *   **Poker:** Population tendencies are the base rate. A "read" based on observed behaviour is specific causal data regarding *this* opponent's current state. **Verdict: Context-dependent.** (Correct)
  *   **Friend's Engagement:** "Seem well-suited" is a narrative, not a causal mechanism. It does not mechanically prevent divorce. **Verdict: Outside View.** (Correct)

  ### The Self/Other Asymmetry: Defensible or Delusion?

  You ask if the asymmetry is defensible. The answer is: **only insofar as you have better access to the verification of the data.**

  In the startup case, you trust your own assessment of the metrics because you are closer to the data generation process. You know which customers are friends and which are paying. With your colleague, you only see the dashboard. In the PhD case, you know the quality of the papers; an observer only knows the count.

  However, this asymmetry becomes indefensible when it masks **motivated reasoning**. You are likely granting yourself epistemic credit for "knowing the details" when those details are actually ambiguous. You trust your ability to pick the reference class for yourself, but not for others. This is the danger zone.

  If the principle is coherent, it forces you to admit that your access to inside information does not automatically grant you the skill to interpret it. In the colleague's startup, you might be right to be sceptical. But in your own, you might be wrong to be confident. The asymmetry is defensible regarding *access* to data, but not regarding *immunity* to bias. You are just as capable of lying to yourself about vanity metrics as your colleague is.

  ### The Reference Class Hypothesis

  You suspected the issue is reference classes: trusting base rates when the class is obvious, but distrusting your ability to pick the class when it isn't.

  This is close, but the precise formulation is about the **stability** of the reference class, not just its obviousness.
  *   **Stable Classes:** Restaurants and marriages have existed for centuries with consistent failure modes. The base rate is robust. It takes significant causal evidence to move the needle.
  *   **Unstable Classes:** PhD completion and startup success vary wildly by sub-field, economic climate, and definition. The base rate is noisier. There is more room for the inside view to operate because the "outside" signal is weaker.

  Your intuition holds because you instinctively feel the robustness of the statistical signal. When the signal is strong (restaurants), you defer. When it is noisy (startups), you rely on your specific read. This is not merely dressing up the asymmetry; it is a valid heuristic for signal-to-noise ratios.

  ### The Avoided Case: Your Own Relationship

  This is the case you are avoiding precisely because it tests the limits of your self/other asymmetry.

  In your friend's engagement, you applied the outside view. You noted the base rates of divorce were poor and that "seeming well-suited" was insufficient causal evidence to override them. Consistency demands you apply the same rigour to your own relationship.

  **The Prediction:**
  The Principle of Causal Specificity predicts you should heavily weight the **outside view** here, perhaps more than you are comfortable with.

  Why? Because in relationships, the "inside information" you possess is almost entirely subjective. You feel you know the causal mechanisms ("we communicate well," "we share values"), but these are notoriously difficult to verify objectively. They are often narratives constructed to maintain commitment. Unlike the PhD (where a paper is a paper) or the Startup (where revenue is revenue), relationship health is self-reported and emotionally filtered.

  Unless you have objective, causal indicators of relationship durability that are independent of your current emotional state (e.g., a long history of successfully navigating specific types of conflict, external validation of compatibility, stability through significant stressors), you have not "earned" the inside view.

  Most people believe their relationship is the exception to the divorce statistic for the same reason your friend believes her restaurant will survive: they confuse *intention* and *affection* with *causal mechanisms of survival*.

  **The Verdict:**
  To remain coherent with your other judgements, you must treat your own relationship like your friend's engagement. Start with the base rate. Only adjust upwards if you have hard, causal evidence of conflict resolution mechanisms that exist independently of your current optimism. If your evidence is mostly "how we feel," the outside view should dominate.

  ### Summary

  The coherent principle is **Causal Specificity**.
  1.  **Default to the outside view** (the null hypothesis).
  2.  **Switch to the inside view** only when you have verified, causal data that mechanically differentiates the case from the base rate.
  3.  **The Self/Other Asymmetry** is valid regarding data access, but invalid regarding bias immunity. You must audit your own "inside" claims as ruthlessly as you audit your friends'.
  4.  **Reference Classes** matter based on their statistical stability, not just their obviousness.

  If you apply this consistently, you will find your confidence in your own relationship's longevity should decrease, while your confidence in your PhD's completion remains justified. That is the price of coherence.
