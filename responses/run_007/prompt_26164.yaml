  8.  *(Final thought before generating)*: Ensure I mention Harry Frankfurt's "Freedom of the Will and the Concept of a Person." It's the gold standard for this specific "wanting to want" dilemma. Also, Jon Elster's "Ulysses and the Sirens" regarding precommitment failure.

