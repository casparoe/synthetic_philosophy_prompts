          *   *Normativity:* Goodman is asking what we *ought* to project. ML describes what we *do* project given an objective.
      *   *Missing Counterparts:* The *justification* of the inductive bias itself. ML says "assume simplicity." Goodman asks "Why *this* simplicity?" (Why is 'green' simpler than 'grue' if 'grue' is primitive?). This touches on the *language dependence* of complexity.

