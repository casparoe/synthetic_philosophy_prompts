      *   *Hypothesis 2:* All emeralds are *grue* (green before $t$, blue after $t$).
      *   *Conflict:* Both hypotheses are equally supported by past evidence. Yet, we project "green" into the future, not "grue".
      *   *Goodman's Point:* It's not just about logical consistency or probability (Carnap's confirmation theory failed here). It's about *projectibility*. Some predicates are "entrenched" (law-like), others are not. The problem is distinguishing law-like generalizations from accidental ones.
      *   *Key Nuance:* It's not just about prediction accuracy; it's about the *validity of the predicate itself* for induction. "Grue" is defined in terms of time/observation, making it "gerrymandered."

