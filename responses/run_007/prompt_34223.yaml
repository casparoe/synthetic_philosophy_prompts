answer: |-
  You have independently rediscovered one of the most fascinating and controversial areas of modern logic and philosophy. You are absolutely right that classical logic (the kind taught in most intro classes) does not match how humans, scientists, or lawyers actually reason.

  The short answer is: **Yes, there is a name for this.**

  The philosophical position that some contradictions are true is called **Dialetheism**.
  The logical systems designed to handle them without collapsing are called **Paraconsistent Logics**.

  Here is a breakdown of the names, the flavors, and the "firewall" you asked about.

  ### 1. The Names

  **Dialetheism**
  From the Greek *dia* (two) and *aletheia* (truth). A dialetheist is someone who believes there are "true contradictions." That is, there are statements $A$ such that both $A$ and *not-A* are true.
  *   **Key Proponent:** The philosopher **Graham Priest** is the most famous living defender of this view (see his book *In Contradiction*).

  **Paraconsistent Logic**
  This is the technical machinery. Classical logic is "explosive" (if you accept a contradiction, you must accept everything). Paraconsistent logic is "contradiction-tolerant." It allows you to hold contradictory beliefs without your entire belief system imploding into nonsense.
  *   **Note:** You can use Paraconsistent Logic *without* being a Dialetheist. You might think contradictions are always false, but you want a logic that handles *inconsistent information* (like in a messy database) without crashing. But if you think the contradictions are *true*, you are a Dialetheist using Paraconsistent Logic.

  ### 2. The Firewall: How do they stop the explosion?

  You asked: *"How do you stop the ones you do accept from infecting everything else?"*

  In classical logic, the "explosion" (Principle of Explosion or *Ex Contradictione Quodlibet*) relies on specific inference rules. The most common path to explosion looks like this:
  1.  $A$ is True.
  2.  $A$ is False (Contradiction).
  3.  Therefore, ($A$ or $B$) is True. (Since $A$ is true, the "or" statement is true).
  4.  Since $A$ is False, $B$ **must** be True.
  5.  Since $B$ can be anything, you have proven anything.

  Paraconsistent logics build a firewall by breaking this chain. There are two main ways they do it:

  **A. Truth Value Gluts (Semantic Approach)**
  Classical logic assumes every statement is either True (1) or False (0).
  Paraconsistent logic adds a third (or fourth) option. A common system uses four values:
  1.  True only
  2.  False only
  3.  **Both True and False** (The "Glut")
  4.  Neither True nor False (The "Gap")

  If a statement is "Both," it behaves differently in inference rules. In many paraconsistent systems, if $A$ is "Both," you cannot automatically infer that "($A$ or $B$)" forces $B$ to be true, because the "False" part of $A$ contaminates the inference. The logic is designed so that "True" is not a contagious property when a contradiction is present.

  **B. Relevance Logic (Syntactic Approach)**
  Some logicians argue the problem isn't truth values, but *relevance*. In classical logic, "The moon is cheese" follows from a contradiction about apples because the rules don't care about the *content*, only the form.
  Relevance Logic demands that the premises must share content with the conclusion. A contradiction about apples cannot prove something about fish because there is no relevant connection. This blocks the explosion by making the inference invalid.

  ### 3. The Flavors: Which contradictions are allowed?

  You asked if some people think only special contradictions qualify. Yes, there is a spectrum.

  **1. The "Semantic" Dialetheist (Conservative)**
  This view holds that contradictions only arise in language and self-reference, not in the physical world.
  *   **Target:** The Liar Paradox ("This sentence is false").
  *   **Argument:** Language is messy. Self-referential sentences create "truth value gluts." We should accept this as a feature of language, not reality.
  *   **Status:** This is the most common acceptance. Many logicians accept paraconsistency for semantic paradoxes but deny that physical objects can be contradictory.

  **2. The "Ontological" Dialetheist (Radical)**
  This view holds that reality itself can be contradictory.
  *   **Target:** Boundaries, change, and quantum mechanics.
  *   **Argument:** Consider a door closing. At the exact instant it closes, is it open or closed? A dialetheist might say it is both. Or in quantum mechanics, a particle being in two states at once might be interpreted as a true contradiction (though physicists usually call this superposition, not logical contradiction).
  *   **Status:** This is Graham Priest's view. It is much more controversial.

  **3. The "Epistemic" Paraconsistentist (Pragmatic)**
  This isn't strictly dialetheism, but it matches your examples of law and science.
  *   **Target:** Human knowledge systems.
  *   **Argument:** The world might be consistent, but our *models* of it are not. We have inconsistent laws, inconsistent scientific theories, and inconsistent beliefs. We need a logic that lets us reason through this mess without throwing everything away.
  *   **Status:** Very common in AI, legal theory, and database management.

  ### 4. Addressing Your Examples

  It is worth noting how a dialetheist would analyze the specific examples you gave, because they are slightly different cases.

  *   **The Law:** Legal theorists actually use paraconsistent logic here. If Precedent A says "X is liable" and Precedent B says "X is not liable," the law is inconsistent. A classical logician says the legal system is broken. A paraconsistent logicist says the system is inconsistent but functional; the judge uses a "priority rule" (e.g., newer laws override older ones) to resolve the output without admitting that "The defendant is a fish."
  *   **Science:** Newton vs. Einstein. Philosophers of science usually call this **theory inconsistency**, not necessarily true contradiction. We know Newton is technically "false" in high-gravity fields, but "true enough" for building bridges. We hold both in mind as useful approximations. This is usually handled by *contextualizing* the truth (True in context N, False in context E), which classical logic can handle. However, during a scientific revolution, when we don't know which context applies, paraconsistent logic models the transition period well.
  *   **Everyday Talk:** "I'm glad and not glad." Strictly speaking, logicians usually resolve this by saying the object of the gladness is different (Glad about job, not glad about friends). But a dialetheist might argue that emotional states are inherently contradictory. You can genuinely hold two opposing emotional valences toward the *same object* at the *same time*.

  ### 5. Why isn't everyone a Dialetheist?

  If this solves so many problems, why do we still teach classical logic?

  1.  **Intuition:** It feels deeply wrong. The Law of Non-Contradiction (Aristotle) is baked into how we perceive the world. A cup cannot be both full and empty.
  2.  **Cost:** Paraconsistent logic is weaker than classical logic. You lose some powerful inference tools (like Disjunctive Syllogism) to gain the ability to handle contradictions. It makes math and proof more difficult.
  3.  **The Slippery Slope:** Critics argue that even if you build a firewall, accepting *any* contradiction makes it harder to argue against *more* contradictions. If you accept the Liar Paradox is both true and false, why isn't "2+2=5" also both true and false? (Dialetheists answer: because "2+2=5" doesn't generate a paradox if you deny it, whereas the Liar sentence *does*).

  ### Summary

  *   **The Position:** **Dialetheism** (some contradictions are true).
  *   **The Logic:** **Paraconsistent Logic** (logic that tolerates contradiction).
  *   **The Firewall:** Changing truth values (allowing "Both") or requiring Relevance in inference to block the "Principle of Explosion."
  *   **The Scope:** Ranges from "only language is contradictory" to "reality itself is contradictory."

  You are in good company. You have identified the exact tension that drove the development of non-classical logic in the 20th century. If you want to read more, look up **Graham Priest**, **J.C. Beall**, or the **Stanford Encyclopedia of Philosophy entry on "Contradiction."**
