answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT ON EVERETTIAN PROBABILITY

  **Date:** October 26, 2023
  **Parties:** Proponent of Decision-Theoretic Derivation (Party A) vs. Proponent of Structural Skepticism (Party B)
  **Subject:** The Status of the Born Rule in Unitary Quantum Mechanics

  ## 1. AGREED CLAIMS

  Both parties affirm the following ten claims as the common ground for this dispute. These claims delineate the formal starting point, the problems to be solved, and the current dialectical status.

  1.  **Formalism:** The fundamental dynamics of quantum mechanics are described by the unitary evolution of the quantum state (Schrödinger equation) without collapse.
  2.  **Ontology:** In the Everettian (Many-Worlds) interpretation, the universal wavefunction is ontologically real, and distinct quasi-classical "branches" correspond to decoherent components of this state.
  3.  **The Incoherence Problem:** Any account of probability in Everettian QM must address the "incoherence problem": how to make sense of uncertainty or probability when all possible outcomes of a measurement actually occur.
  4.  **The Quantitative Problem:** Any account must also address the "quantitative problem": why the weights assigned to outcomes should correspond to the squared amplitudes (the Born Rule) rather than some other function (e.g., linear amplitude, branch count).
  5.  **Branch Counting:** Naive "branch counting" (assigning equal probability to each distinct branch) is not a viable solution, as the number of branches is not well-defined independently of the choice of basis or coarse-graining.
  6.  **Unitarity Alone:** The unitary formalism *by itself*, without additional interpretive principles or axioms regarding agents, does not explicitly contain a probability measure or a stochastic collapse mechanism.
  7.  **Decision-Theoretic Program:** There exists a formal program (associated with Deutsch, Wallace, et al.) that attempts to derive the Born Rule by modeling a rational agent making bets on quantum outcomes within a branching universe.
  8.  **Derivation Status:** This program succeeds in showing that an agent who accepts certain axioms of rationality *must* act *as if* the Born Rule is true to avoid diachronic inconsistency or Dutch-book-like scenarios.
  9.  **Premise Dispute:** The parties disagree on whether the axioms required for the decision-theoretic derivation are purely rationality constraints or whether they implicitly presuppose probabilistic notions.
  10. **Empirical Equivalence:** Both parties agree that Everettian QM with the Born Rule is empirically equivalent to standard Copenhagen QM regarding observed frequencies; the dispute is metaphysical and justificatory, not empirical.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the residual differences. Each side's view is phrased in terminology they accept. The "Crux" identifies the specific question upon which the disagreement turns.

  | Topic | Party A (Derivation/Decision-Theory) | Party B (Skeptic/Structural) | Crux Sub-Question |
  | :--- | :--- | :--- | :--- |
  | **1. Status of the Born Rule** | The Born Rule is a **theorem** derived from the non-probabilistic structure of unitary QM plus constraints on rational agency. It is not an independent postulate. | The Born Rule remains an **independent postulate** (or an unjustified addition). The derivation merely shows consistency between the postulate and rational behavior, not the necessity of the postulate. | Do the decision-theoretic axioms (e.g., Branching Indifference, Diachronic Consistency) entail probabilistic assumptions, or are they pre-probabilistic rationality constraints? |
  | **2. Nature of Probability** | Probability in MWI is **objective credence**: the unique rationally permissible degree of concern an agent should have for their future successors, weighted by amplitude. | Probability requires **objective chance** or **genuine uncertainty**. If all outcomes occur, "credence" is merely a psychological preference, not a physical probability, and cannot justify frequency predictions. | Can a "caring measure" over determined outcomes functionally replace "chance" in explaining why we should expect to find ourselves in high-amplitude branches? |
  | **3. Explanatory Power** | The derivation **solves** the quantitative problem by proving that any other weighting scheme (e.g., linear amplitude) renders an agent vulnerable to irrational decision-making (e.g., paying to lose). | The derivation **relocates** the problem. It explains why an agent *believes* in the Born Rule, but not why the physical world privileges squared amplitudes over branch topology. | Is the justification for the Born Rule agent-relative (about belief/action) or agent-neutral (about the physical structure of the multiverse)? |

  ## 3. CRUX CASES AND PREDICTIONS

  For each Crux Sub-Question above, the parties agree on a concrete case, argument, or constraint that bears on the issue. Each side records their verdict in advance.

  ### Crux 1: The "Branching Indifference" Axiom
  *   **The Constraint:** The Deutsch-Wallace proof relies on an axiom often called "Branching Indifference": an agent should be indifferent to a process that causes branching but does not change the rewards or amplitudes associated with those rewards.
  *   **Party A Verdict:** This is a pure rationality constraint. Caring about the *number* of branches is irrational because branch number is not a physical invariant (due to decoherence basis dependence). Therefore, amplitude is the only invariant quantity left to weight.
  *   **Party B Verdict:** This axiom smuggles in the conclusion. To say an agent *should* be indifferent to branching is to assume that branching *per se* carries no weight. But if branching is the mechanism of outcome multiplication, ignoring it presupposes that amplitude, not multiplicity, is what matters. It begs the question against branch-counting views by defining them as "irrational" rather than disproving them physically.

  ### Crux 2: The "Zero-Amplitude" Limit
  *   **The Constraint:** Consider a sequence of quantum states where the amplitude of a specific outcome approaches zero but never reaches it.
  *   **Party A Verdict:** As amplitude $\to 0$, the rational credence $\to 0$. In the limit, the branch is effectively non-existent for the agent. This continuity is required for diachronic consistency.
  *   **Party B Verdict:** Unitary QM treats a branch with amplitude $10^{-100}$ as ontologically identical in *kind* to a branch with amplitude $1$. If probability is about "what happens," both happen. The decision-theoretic demand to ignore the low-amplitude branch is a pragmatic rule, not a truth about the ontology. The "Incoherence Problem" remains: why does the agent *experience* the high-amplitude branch as "probable" if the low-amplitude successor is just as real?

  ### Crux 3: Self-Locating Uncertainty
  *   **The Constraint:** An agent knows the universal wavefunction but does not know which branch they are currently on (post-measurement, pre-observation).
  *   **Party A Verdict:** This provides the necessary uncertainty for probability. Even if the multiverse is deterministic, the agent's *location* within it is uncertain. The Born Rule quantifies this self-locating uncertainty.
  *   **Party B Verdict:** This is a category error. If all copies exist, there is no fact of the matter about "which one I am" prior to observation that isn't already determined by the physics. Assigning probabilities to self-location in a deterministic multiverse requires assuming the very measure (Born Rule) one is trying to derive. Without it, the Principle of Indifference suggests equal weight to all distinct observer-moments (returning to branch counting).

  ## 4. VERBAL VS. SUBSTANTIVE ANALYSIS

  Upon review, the parties identify the following distinction between verbal and substantive elements of the dispute:

  **1. The Verbal Dispute: "Probability" vs. "Rational Caring Measure"**
  *   **Identification:** A portion of the deadlock is verbal. Party A is willing to redefine "probability" to mean "the unique rational weighting of concern for future successors in a deterministic branching structure." Party B insists that "probability" entails "objective chance" or "uncertainty about which outcome will obtain."
  *   **Resolution:** If Party A admits they are defining a *quasi-probability* (caring measure) rather than objective chance, and Party B admits that this caring measure is sufficient to recover all empirical predictions and rational behaviors of standard QM, the semantic conflict dissolves.
  *   **Agreed Terminology:** Henceforth, the term **"Everettian Probability"** shall refer to the rational credence function derived from decision-theoretic axioms, without prejudice as to whether it constitutes "objective chance."

  **2. The Substantive Dispute: The Necessity of the Axioms**
  *   **Identification:** Even settling the terminology, a hard substantive disagreement remains. It concerns the **justificatory status of the decision-theoretic axioms**.
  *   **The Core Issue:** Party A claims the axioms are *compulsory* for any rational agent in a branching universe (analogous to logic). Party B claims the axioms are *optional* preferences that happen to align with the Born Rule, but that a rational agent could consistently choose different axioms (e.g., weighting by branch topology if definable) without logical contradiction.
  *   **Why it Matters:** If Party B is correct, the Born Rule is not derived from Unitary QM + Rationality; it is derived from Unitary QM + Rationality + *A Hidden Probabilistic Premise*. This would mean Everettian QM has not reduced the number of postulates required compared to Copenhagen QM, failing one of its primary theoretical motivations.

  **3. Condition for Resolution**
  *   **For Party A to concede:** Party B must demonstrate a coherent decision-theoretic strategy in a branching universe that violates the Born Rule but does not lead to diachronic inconsistency (e.g., a Dutch Book).
  *   **For Party B to concede:** Party A must demonstrate that the axiom of "Branching Indifference" can be justified without referencing amplitude weights or probabilistic symmetry, relying solely on the structural properties of the Hilbert space.

  ***

  **Signatures:**

  _________________________ (Party A)

  _________________________ (Party B)

  _________________________ (Moderator)
