answer: |-
  ### Candidate Session Orders

  Before settling on the final plan, I considered three structural approaches for the ninety minutes.

  **Option 1: The Mathematical Discovery (Inductive)**
  1.  Present a 2x2 table showing a positive correlation.
  2.  Split the data by a third variable, revealing a reversal in both sub-tables.
  3.  Ask the audience to verify the arithmetic.
  4.  Derive the philosophical implications from the shock of the reversal.
  *Rejection:* I reject this because it frames Simpson's Paradox (SP) as a numerical curiosity or a "gotcha" trick. For philosophers, the interest lies not in the arithmetic reversal (which is algebraically trivial) but in the *inferential* crisis. Starting with the math risks cementing the idea that this is a statistical error rather than an epistemological limit.

  **Option 2: The Causal Modeling Primer (Deductive)**
  1.  Define causation via Reichenbach's Common Cause Principle.
  2.  Introduce Causal Directed Acyclic Graphs (DAGs) to define confounders vs. mediators.
  3.  Show how SP arises when conditioning on the wrong node.
  4.  Apply to an example.
  *Rejection:* I reject this because your audience lacks training in causal modeling. Introducing DAG syntax and *d*-separation rules would consume the majority of the session, turning a philosophy discussion into a technical workshop. It violates the constraint to keep the focus on the *limits of evidence*, not the *formalism of modeling*.

  **Option 3: The Epistemological Crisis (Selected)**
  1.  Frame the problem: Probabilistic theories of causation (P(E|C) > P(E|~C)).
  2.  Present the example as a counterexample to this thesis.
  3.  Show that the statistics underdetermine the causal verdict.
  4.  Resolve by showing that extra-statistical knowledge is required to choose the partition.
  *Selection:* This is the chosen order. It aligns with your heading ("limits of purely statistical evidence") and treats the statistics as a tool that fails without philosophical (causal) justification. It respects the audience's strength (conceptual analysis) while leveraging your strength (statistical fluency).

  ---

  ### The Teaching Plan: "The Limits of Statistical Evidence"

  **Total Time:** 90 Minutes
  **Goal:** Demonstrate that statistical relevance is necessary but not sufficient for causal inference; causal structure determines which statistical partition is evidentially relevant.

  #### I. Introduction: The Probabilistic Thesis (15 Minutes)
  *   **Objective:** Establish the philosophical stakes.
  *   **Action:** Write the standard probabilistic definition of causation on the board: *C causes E iff P(E|C) > P(E|~C).*
  *   **Discussion:** Ask if this is sufficient. Most will say no (correlation $\neq$ causation). Push them: "If we hold all other relevant factors fixed, is it sufficient?"
  *   **Transition:** Introduce SP not as a math trick, but as a scenario where *both* the aggregate and the disaggregated data satisfy the conditions for "evidence," yet they contradict each other. The paradox is not in the numbers, but in the *norm of inference*.

  #### II. The Carrying Example: Kidney Stones (25 Minutes)
  *   **Objective:** Provide a concrete case where the causal structure is intuitive but the statistics are ambiguous.
  *   **Why not Berkeley Admissions?** The Berkeley case (1973) is overused and introduces unnecessary noise regarding gender bias and social construction. More critically, the causal status of "Department Choice" is debated (is it a mediator or a confounder?). We need a case where the causal direction is medically obvious to avoid metaphysical debate distracting from the statistical lesson.
  *   **The Example:** Treatment for Kidney Stones (Charig et al., 1986, simplified).
  *   **Board Layout:**
      *   **Outcome:** Stone Clearance (Success/Failure).
      *   **Cause:** Treatment A (Open Surgery) vs. Treatment B (Percutaneous Nephrolithotomy).
      *   **Partition:** Stone Size (Small < 2cm / Large > 2cm).
  *   **The Data (Put this on the board):**
      *   *Small Stones:* Treatment A (93% success), Treatment B (87% success). **A is better.**
      *   *Large Stones:* Treatment A (73% success), Treatment B (69% success). **A is better.**
      *   *Aggregate:* Treatment A (78% success), Treatment B (83% success). **B is better.**
  *   **The Crucial Detail:** You must explicitly state the *distribution* of patients.
      *   Treatment A was mostly given to Large Stones (hard cases).
      *   Treatment B was mostly given to Small Stones (easy cases).
  *   **Why this works:** It is medically intuitive that Stone Size causes Success (causal arrow to Outcome) and Stone Size influences Treatment Choice (causal arrow to Treatment). This makes it a **Confounder**.

  #### III. Misconceptions and Interventions (30 Minutes)
  *   **Objective:** Prevent the audience from drawing the wrong philosophical morals.
  *   **Misconception 1: "It's just a weighting artifact."**
      *   *Predicted Thought:* "The aggregate is just weighted wrong; the math explains it all."
      *   *Intervention Point:* Immediately after revealing the data (Minute 40).
      *   *Response:* Acknowledge the arithmetic is sound. Insist that the *paradox* is normative: "If you were the patient, which number governs your rational expectation? If the math allows both, math alone cannot tell you."
  *   **Misconception 2: "The disaggregated table is always the honest one."**
      *   *Predicted Thought:* "Always control for everything. Subgroups are the truth."
      *   *Intervention Point:* During the resolution phase (Minute 55).
      *   *Response:* This is the most critical philosophical point. You must introduce the distinction between a **Confounder** (common cause) and a **Mediator** (intermediate cause).
      *   *Illustration:* Ask: "What if the third variable was 'Post-Treatment Pain'?" Treatment causes Pain, Pain correlates with Recovery. If we partition by Pain, we might hide the treatment's effect. *Controlling for a mediator creates bias.* Therefore, disaggregation is not inherently superior; it depends on the causal role of the partition variable.
  *   **Misconception 3: "The data alone settles the level of analysis."**
      *   *Predicted Thought:* "There is a fact of the matter hidden in the dataset."
      *   *Intervention Point:* Conclusion (Minute 75).
      *   *Response:* Emphasize that the numbers in the Kidney Stone example are compatible with two different causal stories. The data is "causally mute." We need background knowledge (temporal order, mechanism) to select the partition.

  #### IV. What to Leave Out (10 Minutes buffer + Q&A)
  *   **Omit:** Formal DAG notation ($\rightarrow$), *d*-separation rules, collapsibility conditions, Bayesian priors.
  *   **Omit:** The history of the paradox (Yule, Simpson, etc.) beyond a sentence.
  *   **Handling Questions:**
      *   *If asked:* "Isn't there a statistical test for this?"
      *   *Say:* "There are tests for association, but no statistical test for causal direction. That requires assumptions outside the data."
      *   *If asked:* "What if we don't know the causal structure?"
      *   *Say:* "Then we must admit causal ignorance. SP shows that without causal assumptions, statistical evidence is ambiguous."

  #### V. Closing Exercise: The Job Training Program (10 Minutes)
  *   **Objective:** Test conceptual grasp (choosing the right comparison) rather than arithmetic retelling.
  *   **Setup:** Describe a Job Training Program (Treatment) and Employment Status (Outcome).
  *   **Scenario A:** You suspect "Prior Motivation" affects both entering the program and getting hired.
  *   **Scenario B:** You suspect the Program *creates* "Job Skills," which then lead to Employment.
  *   **Task:** Ask the audience: "In Scenario A, do you compare the Aggregate or the Subgroups (partitioned by the third variable)? In Scenario B, do you compare the Aggregate or the Subgroups (partitioned by the third variable)?"
  *   **Correct Answer:**
      *   Scenario A (Confounder): Compare Subgroups (Control for Motivation).
      *   Scenario B (Mediator): Compare Aggregate (Do not control for Skills, or you block the causal path).
  *   **Success Criterion:** If they choose Subgroups for both, they have learned the math but not the philosophy. If they distinguish based on the causal story, they have grasped the limit of statistical evidence.

  ---

  ### Self-Reflection on the Plan

  **Least Confident Element:**
  I am least confident in the segment addressing **Misconception 2 (Confounder vs. Mediator)** without using causal diagrams.

  **Reason for Concern:**
  The distinction between "holding a variable fixed" (conditioning) and "blocking a causal path" is conceptually dense. In causal modeling, we use DAGs to visually show that conditioning on a collider or mediator opens/closes paths incorrectly. Without these visual aids, I must rely entirely on verbal descriptions of causal flow (e.g., "Treatment causes Skills, Skills cause Hiring").

  **Consideration for Revision:**
  If I see blank stares during the Kidney Stone resolution, I should be prepared to draw a very rudimentary flow chart on the board (arrows only, no formal DAG syntax).
  *   *Logic:* If the third variable has an arrow pointing *to* Treatment, it is a confounder (Control it). If Treatment has an arrow pointing *to* the third variable, it is a mediator (Do not control it).
  *   *Risk:* If I introduce this, I risk drifting into Option 2 (The Causal Modeling Primer).
  *   *Mitigation:* I will strictly limit the drawing to "Before/After" arrows relative to the Treatment event, framing it as temporal/causal order rather than formal graph theory. If the audience cannot grasp this distinction verbally, the session's core thesis (that extra-statistical knowledge is needed) is actually reinforced by their struggle: they need the causal story to make sense of the math.
