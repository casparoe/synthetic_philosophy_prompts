      *   *Sentence 5 (Critique 3 - Measurability Bias):* "Third, measurability bias: because EA demands quantitative evidence of impact, it only funds interventions with clean, countable outputs, and therefore excludes anything whose value cannot be measured—movement building, cultural change, basic research, political work."
      *   *Sentence 6 (Conclusion):* "What remains is a portfolio of marginal, easily quantified fixes that misses the real causes of suffering."

