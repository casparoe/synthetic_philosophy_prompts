prompt: |-
  i just got back from a two-hour argument with a friend about whether a reinforcement learning agent can suffer. he kept saying reward is literally valence — positive reward is pleasure, negative reward is pain — and i kept saying reward is just the thing the update rule climbs, and valence is a separate claim about what the system actually feels. i think he's wrong, but i realized i couldn't give him a crisp test for when a reward signal does and doesn't license an inference to valenced experience, which bugged me.

  i work at a small ai lab, and i'm the person who decides which trained models get flagged for welfare review before we deploy them or let them run long. we train game-playing rl agents, control policies, and rlhf chatbots, and i have to make this call maybe once a week, in an afternoon, from the training setup and logs, without running new experiments. the stakes are whether we spend scarce reviewer time, add monitoring, or slow a launch, and whatever i decide has to be defensible to our safety lead, who thinks the whole question is made up.

  please write me a decision procedure i can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. keep the real distinction alive — reward as a training signal versus reward as evidence of felt valence — but make it usable by an engineer with no neuroscience background. then run the procedure on two cases: a gridworld agent trained on a sparse +1 reward for reaching a target, and an rlhf chatbot whose reward model was trained on human preference data. make at least one of the cases one where the procedure tells me the opposite of my gut, and say explicitly what the procedure cant settle.
