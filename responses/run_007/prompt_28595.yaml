answer: |-
  ### Exam Question

  **Question 1 (25 Marks)**

  The debate between proponents of the Covering-Law Model (e.g., Hempel) and proponents of Narrative Explanation (e.g., Danto, Gallie) is often framed as a conflict between scientific rigor and humanistic intelligibility. However, a deeper methodological stalemate exists: Covering-Law theorists argue that narrative provides psychological satisfaction but lacks epistemic force (it shows *how* we understand, not *why* it occurred), while Narrative theorists argue that Covering-Law explanations are empty "explanation sketches" that never actually function in historical practice.

  In an essay of approximately 800–1,000 words, adjudicate this dispute. Is this a substantive disagreement about the ontology of historical causation, or is it a verbal dispute where both sides are defining "explanation" differently to serve different aims? Defend your position by analyzing whether narrative connections can bear causal weight without universal laws, or if the demand for laws is merely a misplaced demand for scientific prestige.

  ***

  ### Model Answer

  The stalemate between the Covering-Law Model and Narrative Explanation is not merely a territorial dispute between science and the humanities; it is a substantive disagreement regarding the ontology of historical causation. While it is tempting to dismiss the conflict as verbal—where Hempel defines explanation as logical subsumption and Danto defines it as contextual intelligibility—this charity obscures the real epistemic stakes. The dispute is substantive because it forces a choice between two incompatible views of what constitutes a "cause" in history: a cause as an instance of a regularity, or a cause as a unique configuration of events.

  Hempel's Covering-Law model posits that to explain an event is to show that it was to be expected based on initial conditions and universal laws. When narrative theorists object that historians never produce such laws, Hempelians reply with the "explanation sketch" defense: historical explanations are incomplete covering-laws that *could* be filled in by social science. The Narrative theorist's counter-charge is that this is a promissory note that never gets cashed. However, the deeper Covering-Law objection is the one highlighted in the prompt: narrative offers intelligibility, not explanation. To show how a sequence of events makes sense to a human observer is a psychological feat, not an epistemological one. Just because a story hangs together does not mean the outcome was necessitated. If the French Revolution can be narrated as inevitable, but also narrated as contingent depending on the starting point, the narrative structure itself cannot be the source of causal necessity.

  Conversely, Narrative theorists argue that the Covering-Law model strips history of its specific content. If the explanation of the fall of Rome relies on a general law about imperial overstretch, the specific actions of Alaric or the specific economic conditions of the 4th century become mere variables in a function. Danto argues that historical explanation relies on "narrative sentences" that describe an event in relation to a later outcome, organizing the past based on significance rather than subsumption. For the narrative theorist, the causal weight is carried by the specific configuration of agents and contexts, not by a generalization that abstracts away from them.

  Is this a verbal dispute? Superficially, yes. If Hempel means "explanation" as "logical justification for prediction" and Danto means "explanation" as "rendering the past comprehensible," they are talking past each other. However, this diagnosis is too easy. It assumes that "comprehensibility" is merely aesthetic or psychological. If narrative structures track actual causal mechanisms—such as the escalation of commitment, the breakdown of communication, or the specific chain of diplomatic failures—then the narrative *is* doing causal work. The dispute becomes substantive when we ask: Can a causal mechanism be singular?

  The Covering-Law theorist says no; causation implies regularity. If $A$ causes $B$ here, there must be a law linking $A$-type events to $B$-type events. The Narrative theorist says yes; causation can be singular and contextual. Therefore, the disagreement is not just about the word "explanation," but about the nature of historical reality. If history is governed by discoverable social laws, Hempel is right that narratives are merely heuristic. If history is a realm of singular, non-repeatable configurations, then the demand for laws is indeed a misplaced demand for scientific prestige, and narrative is the only form capable of capturing causal relevance.

  Ultimately, the "explanation sketch" defense fails because it assumes the missing laws exist somewhere in principle. If the complexity of human action precludes universal laws (due to reflexivity or free will), then the sketch is not a sketch of a painting that exists; it is a sketch of a phantom. Therefore, the dispute is substantive. It turns on whether one believes historical events are instances of general types or unique occurrences. To side with Narrative is to claim that causal relevance is context-dependent; to side with Covering-Law is to claim that causal relevance is context-independent. Since these are incompatible ontological claims, the debate cannot be dissolved by semantic stipulation. The Narrative theorist is right that the Covering-Law model fails in practice, but the Covering-Law theorist is right to demand that narrative demonstrate why its connections are causal rather than merely literary. Until narrative explanation can articulate why its specific configurations necessitate outcomes without appealing to hidden regularities, the epistemic gap remains.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **A Range (21–25 Marks): Critical Synthesis & Ontological Adjudication**
  *   **Thesis:** Clearly articulates a verdict on whether the dispute is substantive or verbal (e.g., argues it is substantive because it reflects divergent ontologies of causation).
  *   **The "Psychology" Objection:** Explicitly addresses the Hempelian charge that narrative offers intelligibility/psychology rather than epistemic necessity.
  *   **The "Sketch" Objection:** Explicitly addresses the Narrative charge that covering-laws are empty placeholders that never materialize.
  *   **Beyond Summary:** Does not merely list Hempel's and Danto's views. Instead, uses their positions to analyze the *nature* of the disagreement (e.g., discussing singular vs. general causation).
  *   **Resolution:** Offers a reasoned conclusion on whether narrative can bear causal weight without laws.

  **B Range (16–20 Marks): Accurate Reconstruction & Partial Analysis**
  *   **Thesis:** Identifies the conflict but may remain agnostic or offer a weak verdict (e.g., "both have good points").
  *   **The "Psychology" Objection:** Mentions that Hempel wants laws and Danto wants stories, but may miss the specific epistemic vs. psychological distinction.
  *   **The "Sketch" Objection:** Mentions the "explanation sketch" concept but treats it as a practical limitation rather than a theoretical problem.
  *   **Analysis:** Accurately summarizes the two models but spends too much time on definition rather than adjudicating the "substantive vs. verbal" prompt question.
  *   **Resolution:** Conclusion is present but lacks the ontological depth of the A range (e.g., concludes it's just a matter of preference).

  **C Range (11–15 Marks): Descriptive Summary & Missed Focus**
  *   **Thesis:** Weak or missing. The essay functions as a compare/contrast rather than an adjudication.
  *   **The "Psychology" Objection:** May mention that narratives are "subjective" but fails to connect this to the epistemology of explanation.
  *   **The "Sketch" Objection:** May omit the "explanation sketch" counter-argument entirely.
  *   **Analysis:** Regurgitates standard definitions of Deductive-Nomological models and Narrative without engaging the specific prompt about the *nature of the dispute*.
  *   **Resolution:** Ends abruptly or simply restates the introduction.

  **F Range (0–10 Marks): Inadequate**
  *   Significant factual errors regarding Hempel or Danto.
  *   Fails to address the prompt's specific focus on the "substantive vs. verbal" nature of the dispute.
  *   Disorganized or significantly under length.

  **Breakdown of Marks (for internal calibration):**
  1.  **Understanding of Covering-Law & "Sketch" Defense:** /5
  2.  **Understanding of Narrative & "Intelligibility" Claim:** /5
  3.  **Engagement with "Psychology vs. Epistemology" Tension:** /5
  4.  **Adjudication (Substantive vs. Verbal Verdict):** /5
  5.  **Clarity, Structure, and Argumentation:** /5
