      *   **Maya's Position:** Embedded agency is a formalization/modeling problem, not a practical rationality problem. Real decisions (umbrella example) don't require solving self-reference. Paradoxes (Newcomb, Smoking Lesion) are manufactured/toy cases. EUT works fine for practice.
