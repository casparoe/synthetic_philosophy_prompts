prompt: |-
  I'm a software engineer, not a philosopher, and I keep running into the same kind of call: whether to spend time and engineering effort getting more information before we commit to something. A few times a month I'm weighing things like whether to instrument a feature for a week before deciding to kill it, whether to run another A/B test after an inconclusive one, or whether to add a bunch of analytics events before a launch just in case. The stakes are real: wasted engineering time, delayed launches, and sometimes shipping something we cant cleanly roll back. Nobody on my team has much stats background, and my EM and PM both have to sign off, so whatever I use has to fit in a one-pager and be runnable in under an hour.

  I keep seeing this result called Good's theorem, or the value of information, that free information can't hurt you in expectation. I want you to turn that into a decision procedure I can actually run, not the math. I care about partial, noisy information, not just perfect information. I want a checklist: the questions to ask in order, what counts as a good enough answer to each, where the procedure says stop and don't gather more data, and where it has to hand the decision to a person because it's a values call rather than a factual one. Then run the procedure on three decisions: (1) whether to spend a week instrumenting a feature before deciding whether to kill it or keep investing in it; (2) whether to run a second, bigger A/B test after the first one came back ambiguous; and (3) a PM wants to add a bunch of telemetry before a launch that's already locked in by a contract, on the grounds that more data can't hurt. Make sure the procedure gives an answer the team wont like in at least one of those, and tell me what the procedure can't do for me.

  Also, please separate what is settled here from what is genuinely contested among people who know this topic, and don't present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software Engineer (pragmatic, time-constrained, needs actionable tools).
      *   **Problem:** Deciding whether to gather more information (instrumentation, A/B tests, analytics) vs. committing/launching.
      *   **Constraints:** One-pager friendly, runnable in < 1 hour, no heavy stats background needed, needs EM/PM sign-off.
      *   **Core Concept:** Good's Theorem (Value of Information - VoI).
      *   **Deliverables:**
          1.  A decision procedure (checklist, questions, stop conditions, hand-off points).
          2.  Application of the procedure to three specific scenarios (Instrumentation, A/B Test, Pre-launch Telemetry).
          3.  At least one counter-intuitive/unpopular answer.
          4.  Limitations of the procedure.
          5.  Distinction between settled vs. contested concepts (epistemic honesty).

  2.  **Deconstruct Good's Theorem & Value of Information (VoI):**
      *   *Settled:* In decision theory, the Expected Value of Sample Information (EVSI) is always non-negative. *However*, this assumes costless information.
      *   *Contested/Practical:* In reality, information has costs (time, compute, opportunity cost, cognitive load). The theorem doesn't tell you *when* the cost exceeds the benefit, only that benefit $\ge$ 0.
      *   *Key Insight for Engineers:* "Free information can't hurt" is a trap. Information is never free. The decision isn't "Is info valuable?" it's "Is info *more* valuable than its cost?"
      *   *Procedure Goal:* Estimate Cost of Information (CoI) vs. Expected Value of Information (EVI).

  3.  **Drafting the Decision Procedure (The "VoI Checklist"):**
      *   Needs to be simple. No integrals.
      *   Step 1: Define the Decision. (What are the options?)
      *   Step 2: Define the Cost of Waiting. (Engineering hours, delay penalties.)
      *   Step 3: Define the Impact of Being Wrong. (If we guess, what's the worst case?)
      *   Step 4: Estimate Information Gain. (Will this actually change our mind?)
      *   Step 5: Compare. (Cost > Gain? Stop.)
      *   *Hand-off:* If "Impact of Being Wrong" involves brand reputation, legal, or ethics, humans decide.

  4.  **Applying to Scenarios:**

      *   *Scenario 1: Instrument for a week before kill/keep.*
          *   Cost: 1 eng-week + delay.
          *   Impact: Keeping a bad feature vs. killing a good one.
          *   Gain: Will 1 week of data be conclusive?
          *   *Likely Outcome:* If the feature is small/low risk, just kill or keep. If high risk, instrument. Let's make the procedure suggest *not* instrumenting if the cost of being wrong is low (counter-intuitive to "measure everything").

      *   *Scenario 2: Second A/B test after ambiguous first.*
          *   Cost: More time, sample size.
          *   Impact: Shipping a neutral/negative feature.
          *   Gain: Resolution of ambiguity.
          *   *Likely Outcome:* Often, diminishing returns. If the first test was ambiguous due to low power, a bigger test helps. But if the effect size is tiny, maybe it doesn't matter. Let's make the procedure suggest *stopping* if the potential uplift is smaller than the engineering cost of maintaining the experiment framework (unpopular with data teams).

      *   *Scenario 3: Pre-launch telemetry on locked contract.*
          *   Cost: Risk of missing contract deadline (penalty), eng time.
          *   Impact: "Just in case" data.
          *   Gain: Future insights.
          *   *Likely Outcome:* This is the classic "free info" trap. The procedure should flag the contract risk as a hard stop. This will be the "answer the team won't like" (PM wants data, procedure says no).

  5.  **Refining the "Settled vs. Contested" Section:**
      *   *Settled:* Information has opportunity costs. EVSI $\ge$ 0 only if cost = 0.
      *   *Contested:* How to quantify "Impact of Being Wrong" (monetary vs. strategic). How to estimate probability of changing one's mind without doing the experiment (the "prior"). Bayesian vs. Frequentist interpretations in business contexts.

  6.  **Developing the Content (Iterative refinement):**

      *   *Tone:* Direct, engineering-focused, no fluff.
      *   *Structure:*
          1.  Context/Disclaimer (Settled vs. Contested).
          2.  The Procedure (The "VoI Filter").
          3.  The Three Runs.
          4.  Limitations.
      *   *Check:* Did I address Good's Theorem correctly? Yes, by emphasizing *Net* Value of Information (Value - Cost). Good's theorem says Value $\ge$ 0. It does *not* say Value - Cost $\ge$ 0. This is the crucial distinction.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Add specific thresholds (e.g., "If Cost > 10% of Potential Upside").
      *   *Critique:* Did I distinguish settled/contested clearly?
      *   *Fix:* Create a dedicated box/section at the start or end. Let's put it at the start to frame the mental model.
      *   *Critique:* Is the "unpopular answer" clear?
      *   *Fix:* In Scenario 3, explicitly state "Do not add the telemetry" despite the PM's desire.
      *   *Critique:* Is the "Hand-off" clear?
      *   *Fix:* Explicitly mark steps where human judgment overrides the calculation.

  8.  **Final Polish:**
      *   Ensure the distinction between Good's Theorem (theoretical) and Practical VoI (applied) is sharp.
      *   Make sure the "one-pager" constraint is respected (keep the procedure concise).
      *   Verify the "runnable in under an hour" claim (the questions should be answerable quickly).

  9.  *(Self-Correction on Good's Theorem)*: I need to be careful not to misrepresent Good's Theorem. Good (1967) argues that the *expected* utility of observing a free experiment is at least as high as not observing it. The "cost" is the external constraint. I must clarify that the theorem assumes costless observation. The engineering reality is that observation is *never* costless.

  10. **Finalizing the Output Structure:**
      *   **Part 1: Epistemic Status** (Settled vs. Contested).
      *   **Part 2: The Procedure** (The "Net VoI Filter").
      *   **Part 3: The Three Runs** (Applying the filter).
      *   **Part 4: Limitations** (What this can't do).

  Let's write it.
answer: |-
  ### Part 1: Epistemic Status (Settled vs. Contested)

  Before using the procedure, you need to know where the math ends and the debate begins.

  **Settled Consensus:**
  *   **Good's Theorem (1967):** Proves that the *Expected Value of Sample Information (EVSI)* is non-negative **if and only if the information is free.**
  *   **Opportunity Cost:** In engineering, information is never free. It costs compute, engineering hours, and time-to-market.
  *   **Net Value:** The decision metric is *Net VoI = EVSI − Cost of Information*. If Net VoI < 0, gathering data is irrational, even if EVSI > 0.

  **Genuinely Contested:**
  *   **Quantifying "Impact":** There is no consensus on how to monetize "brand damage," "technical debt," or "team morale." Some organizations treat these as zero; others treat them as infinite.
  *   **Estimating Priors:** To calculate EVSI, you need a prior belief (e.g., "What % chance is there this feature works?"). Bayesians and Frequentists disagree on how to derive these without historical data. This procedure uses rough heuristics to bypass the math, but the *accuracy* of those heuristics is debated.
  *   **The "Option Value" of Data:** Some argue data has value beyond the immediate decision (e.g., training future models, organizational learning). This procedure treats data as single-use unless specified, which undercounts long-term value.

  ---

  ### Part 2: The Decision Procedure (The "Net VoI Filter")

  **Goal:** Determine if gathering more data yields a positive *Net* Value.
  **Timebox:** 45–60 minutes.
  **Participants:** Eng Lead, PM, EM.
  **Output:** A one-pager with four numbered answers.

  #### Step 1: Define the Binary Decision
  Write down the two specific actions you are choosing between.
  *   *Bad:* "Should we measure more?"
  *   *Good:* "Option A: Launch now. Option B: Delay 1 week to instrument."

  #### Step 2: Estimate the Cost of Information (CoI)
  Sum the tangible costs of gathering the data.
  *   **Engineering Hours:** (Hours × Fully Loaded Hourly Rate).
  *   **Delay Penalty:** (Days delayed × Daily Revenue/Value at Risk).
  *   **Risk Cost:** (Probability of introducing bugs/regression × Cost to fix).
  *   **Threshold:** If CoI > $0, proceed to Step 3. (It always is).

  #### Step 3: Estimate the Impact of Being Wrong (IoW)
  If you make the decision *without* the new data, and you turn out to be wrong, what is the cost?
  *   **Hard Costs:** Refund costs, contract penalties, cloud waste.
  *   **Soft Costs:** User churn, support tickets, reputation hit.
  *   **Assignment:** Assign a dollar value or a "T-Shirt Size" (S, M, L, XL).
      *   *S:* < 1 eng-week to fix.
      *   *M:* 1–4 eng-weeks to fix.
      *   *L:* > 1 month to fix or measurable revenue loss.
      *   *XL:* Existential threat, legal liability, or contract breach.

  #### Step 4: Estimate the Probability of Changing Your Mind (P_change)
  Be honest. If the data comes back, how likely is it to flip the decision from Step 1?
  *   **< 10%:** You already know what you'll do; you're just seeking validation.
  *   **10–50%:** Plausible ambiguity.
  *   **> 50%:** You are truly undecided.
  *   **Rule:** If P_change < 20%, **STOP.** Do not gather data. The information is not actionable.

  #### Step 5: The Calculation & Hand-Off
  **Calculate:** Is `CoI < (IoW × P_change)`?

  *   **If YES:** Gather the data. The potential savings outweigh the cost.
  *   **If NO:** Do not gather the data. Commit to one of the Step 1 options immediately.
  *   **HAND-OFF CONDITION:** If **IoW** is rated **XL** (Legal, Ethics, Brand Existential), the procedure terminates. This is no longer a calculation; it requires executive/leadership judgment. Do not optimize this with a checklist.

  ---

  ### Part 3: Running the Procedure on Your Scenarios

  Here is the procedure applied to your three cases. Note the outcome in Scenario 3, which contradicts the "more data is better" intuition.

  #### Scenario 1: Instrument for a week before Kill/Keep
  *   **Step 1 (Decision):** Option A: Kill feature now. Option B: Spend 1 week instrumenting, then decide.
  *   **Step 2 (CoI):** 1 Eng-Week ($10k loaded) + 1 Week Delay (Opportunity cost $5k). **Total CoI = $15k.**
  *   **Step 3 (IoW):** If we keep a bad feature, it adds technical debt and minor confusion. If we kill a good one, we lose potential engagement. Estimated fix cost if wrong: 2 weeks to revert or iterate. **IoW = M ($20k equivalent).**
  *   **Step 4 (P_change):** You suspect the feature is weak. If instrumentation shows *any* usage, you'll likely keep it to "see what happens." **P_change ≈ 15%.**
  *   **Step 5 (Calc):**
      *   Expected Benefit = $20k × 0.15 = $3k.
      *   Cost = $15k.
      *   $15k > $3k.
  *   **Verdict:** **DO NOT INSTRUMENT.** Make the kill/keep decision now based on current knowledge.
  *   **Why the team won't like it:** Engineers love instrumentation. It feels productive. This procedure says it is economically wasteful "procrastination by metrics."

  #### Scenario 2: Second, bigger A/B test after ambiguous first
  *   **Step 1 (Decision):** Option A: Call the test (ship or kill based on current signal). Option B: Run 4-week follow-up test with 2x sample size.
  *   **Step 2 (CoI):** 4 weeks of experiment maintenance + 2 weeks analysis + Delayed launch. **Total CoI = $40k.**
  *   **Step 3 (IoW):** Shipping a neutral/negative feature costs engagement. Killing a winner costs revenue. **IoW = L ($100k equivalent).**
  *   **Step 4 (P_change):** The first test was ambiguous (confidence interval crossed zero). A bigger test narrows the interval. However, if the effect size is tiny, the decision might not change (tiny uplift isn't worth maintenance). **P_change ≈ 30%.**
  *   **Step 5 (Calc):**
      *   Expected Benefit = $100k × 0.30 = $30k.
      *   Cost = $40k.
      *   $40k > $30k.
  *   **Verdict:** **DO NOT RUN THE SECOND TEST.** Call the test based on the current directional signal.
  *   **Why the team won't like it:** Data scientists/PMs often view "statistical significance" as a binary gatekeeper. This procedure argues that if the *cost* of significance exceeds the *value* of the insight, you should ship with uncertainty.

  #### Scenario 3: Pre-launch telemetry on locked contract
  *   **Step 1 (Decision):** Option A: Launch on contract date (minimal telemetry). Option B: Delay launch to add "just in case" telemetry.
  *   **Step 2 (CoI):** Risk of missing contract deadline. **Total CoI = Contract Penalty + Relationship Damage.**
  *   **Step 3 (IoW):** If we lack data, we can't optimize V2. If we miss the contract, we pay penalties. **IoW (Missing Contract) = XL.**
  *   **Step 4 (P_change):** Will the telemetry change the launch decision? No, the launch is contractually obligated. Will it change V2? Maybe. **P_change (on Launch) = 0%.**
  *   **Step 5 (Calc & Hand-Off):**
      *   IoW is **XL** (Contract Breach).
      *   **HAND-OFF TRIGGERED.**
  *   **Verdict:** **DO NOT ADD TELEMETRY IF IT RISKS THE DEADLINE.** This is a values/business call, but the math heavily favors compliance over optimization.
  *   **Why the team won't like it:** The PM argues "Free information can't hurt" (Good's Theorem). The procedure shows information is *not* free; the cost is contract breach. The PM will feel blinded; the EM must accept the risk of flying blind to satisfy the contract.

  ---

  ### Part 4: What This Procedure Cannot Do

  1.  **It Cannot Validate Priors:** If your estimate of "Impact of Being Wrong" is wishful thinking (e.g., "It won't take long to revert," when it actually takes months), the output is garbage. The procedure forces you to write the number down, but it doesn't ensure the number is true.
  2.  **It Cannot Handle "Option Value":** This procedure treats data as disposable after the immediate decision. It does not account for data that builds a long-term asset (e.g., a training dataset for ML). If data is a capital asset, the "Cost" side of the equation needs manual adjustment upward.
  3.  **It Cannot Resolve Value Conflicts:** If Engineering values stability and Product values speed, the "IoW" will be calculated differently by each. The procedure highlights the disagreement (by forcing numbers) but does not resolve it. That requires the EM/PM sign-off mentioned in your constraints.
  4.  **It Is Not Legal Advice:** In Scenario 3, the procedure flags "XL" risk. It tells you to hand it off. It does not tell you if the contract penalty is enforceable or if the client would accept a delay for better quality.

  ### Summary for your One-Pager
  *   **The Mantra:** "Information is not free. Is the *Net* Value positive?"
  *   **The Stop Rule:** If the cost of gathering data exceeds 20% of the cost of being wrong, stop gathering.
  *   **The Hand-Off:** If the cost of being wrong involves legal, ethics, or existential brand risk, stop calculating and ask leadership.
