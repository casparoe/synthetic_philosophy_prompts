answer: |-
  **MWI Probability Decision Tree**

  **1. Does the concept of "probability" require that only one outcome actually happens (a classical intuition), or can it apply where all outcomes occur?**
  *   **Requires One Outcome:** Go to Leaf 1.
  *   **Can Apply to All:** Go to 2.

  **2. Is the link between branch weight and probability a basic law of nature, or something that should follow from the physics alone?**
  *   **Basic Law:** Go to Leaf 2.
  *   **Should Follow:** Go to 3.

  **3. Do you think the physics alone *currently* explains this link satisfactorily?**
  *   **No (but collapse theories are worse):** Go to Leaf 3.
  *   **Yes:** Go to 4.

  **4. Does the explanation rely on how rational agents should place bets, or on uncertainty about which branch you occupy?**
  *   **Bets:** Go to Leaf 4.
  *   **Uncertainty:** Go to Leaf 5.

  ***

  **Leaf Explanations**

  **1. Eliminativism:** Probability is meaningless in deterministic MWI. Talk of chance is a cognitive illusion inherited from single-world intuitions. We should only speak of branch weights. This view treats the Born Rule problem as a pseudo-problem arising from category errors.

  **2. Primitive Chances:** The Born Rule is a new fundamental law. MWI needs this axiom added to unitary evolution. It stops the regress but adds complexity. This view argues we should stop trying to derive probabilities from branching structure.

  **3. Unsolved (Comparative):** The derivation is missing, but collapse theories have harder problems (non-locality, collapse mechanism). MWI remains the best option despite this gap. This position accepts the problem is real but not fatal.

  **4. Decision-Theoretic (Deutsch/Wallace):** Probability emerges from rationality. An agent knowing MWI is true should bet according to the Born Rule to avoid losing money across branches. Probability is about action constraints, not frequencies. This often frames the problem as conceptual confusion about decision-making.

  **5. Self-Locating Uncertainty (Sebens/Carroll):** Before observing a result, you are uncertain which copy you will be. The Born Rule quantifies this indexical uncertainty. Probability is about location, not chance. This derives probabilities from epistemic limits within the multiverse.

  ***

  **Flags & Notes**

  *   **Dead End:** "Derivable from branch counting alone." Logically possible, but undefended. Most agree branches aren't countable discrete entities without weighting first.
  *   **Indistinguishable:** Decision-Theoretic and Self-Locating positions often converge on betting behavior. The tree separates them by metaphysical justification (action vs. location), but empirically they may look identical to group members.
  *   **Pseudo-Problem:** Leaf 1 and Leaf 4 both suggest the problem arises from importing classical intuitions. Leaf 1 says discard probability; Leaf 4 says redefine it via rationality.
