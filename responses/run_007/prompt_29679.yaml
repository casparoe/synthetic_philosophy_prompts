answer: |-
  It is a pleasure to correspond with a colleague who has spent a career in the trenches of visual awareness. You have hit on exactly why Dennett's *heterophenomenology* (HP) often lands better with experimentalists than with armchair phenomenologists: it treats the subject not as a window into a private Cartesian theater, but as a source of *textual data* that must be interpreted within a causal context.

  The problem your students face is that Dennett gives you an ontology (the "heterophenomenological world"), but he doesn't give you a psychophysical protocol. He tells you what the data *is*, but not how to weigh it against a reaction time or an ERP component when they conflict.

  Below is a decision procedure designed for your lab. It operationalizes HP into a workflow that respects the report without fetishizing it. I have called it the **Heterophenomenological Triangulation Protocol (HTP)**. It is designed to force explicit decisions about when a report counts as evidence of experience, evidence of belief, or noise.

  Following the protocol, I have applied it to your two requested cases, including the one where the method demands a conclusion the researchers might find disappointing.

  ***

  # The Heterophenomenological Triangulation Protocol (HTP)

  **Purpose:** To classify first-person reports in consciousness experiments by triangulating the *text of the report* against *behavioral performance* and *stimulus parameters*.
  **Philosophical Stance:** The report is not a direct readout of qualia. It is a speech act caused by a mixture of perceptual states, beliefs, expectations, and task demands.

  ## Phase 1: Design & Elicitation (Pre-Experiment)
  *Before collecting data, define the "interpretive space" for the report.*

  **Q1.1: Is the report scale calibrated to the subject's criterion?**
  *   **Action:** Have subjects undergo a calibration block where they define the endpoints of their scale (e.g., "What does a '3' on the Perceptual Awareness Scale feel like to *you*?").
  *   **Pass:** Subject can articulate a distinction between "guessing" and "seeing," even if idiosyncratic.
  *   **Fail:** Subject uses scale randomly or cannot distinguish guess from perception after training.
  *   **Decision:** If Fail, treat all subsequent reports as *forced-choice behavior*, not phenomenological data.

  **Q1.2: Is the report modality matched to the stimulus?**
  *   **Action:** Ensure the question asked matches the processing level. (e.g., Don't ask "What did it look like?" if asking about detection; ask "Did you see something?").
  *   **Pass:** Report prompt is specific to the hypothesized content.
  *   **Fail:** Prompt is open-ended ("Tell us about your experience") in a high-speed threshold task.
  *   **Decision:** If Fail, treat reports as *post-hoc narratives*, not trial-by-trial data.

  ## Phase 2: Collection & Metadata (During Experiment)
  *Capture the context of the speech act.*

  **Q2.1: Is there meta-cognitive metadata?**
  *   **Action:** Collect confidence ratings or reaction times alongside the phenomenological report.
  *   **Pass:** You have a confidence/RT measure for every report.
  *   **Fail:** Report is collected in isolation.
  *   **Decision:** If Fail, you cannot distinguish hesitation due to uncertainty from hesitation due to cognitive load. Proceed with extreme caution.

  **Q2.2: Is the report immediate or delayed?**
  *   **Action:** Note the latency between stimulus offset and report.
  *   **Pass:** Report is immediate (< 2s).
  *   **Fail:** Report is delayed or post-block.
  *   **Decision:** If Fail, the report is vulnerable to memory consolidation and narrative smoothing. Treat as *reconstructed memory*, not immediate experience.

  ## Phase 3: Analysis & Triangulation (Post-Experiment)
  *This is where the judgment calls happen.*

  **Q3.1: Does the report track stimulus variance? (The Tracking Test)**
  *   **Action:** Correlate report content/intensity with physical stimulus parameters (contrast, duration, orientation).
  *   **Pass:** Report intensity scales with stimulus intensity (monotonic relationship).
  *   **Fail:** Report content is rich/constant despite stimulus dropping to zero or randomizing.
  *   **Decision:**
      *   If **Pass**: Report is likely causally linked to perceptual processing.
      *   If **Fail**: Report is likely driven by *belief/expectation* (confabulation). **Discount as evidence of perception.**

  **Q3.2: Does behavior dissociate from report? (The Dissociation Test)**
  *   **Action:** Compare objective performance (d') with subjective report.
  *   **Case A (Behavior > Report):** Above chance behavior, report says "Nothing."
  *   **Case B (Report > Behavior):** Report says "Clear image," behavior is chance.
  *   **Decision:**
      *   If **Case A**: Accept the report as true *of the subject's belief*. Do not force a "seeing" label. This is a dissociation (e.g., blindsight).
      *   If **Case B**: Subject has a false positive belief. Treat report as evidence of *criterion shift*, not perceptual content.

  **Q3.3: Is the report internally coherent but stimulus-incongruent? (The Confabulation Check)**
  *   **Action:** Analyze the semantic content of the report against the actual stimulus identity.
  *   **Pass:** Subject says "Red circle," stimulus was "Red circle."
  *   **Fail:** Subject says "Exploding sunset," stimulus was "Green square" (or nothing).
  *   **Decision:** If Fail, the report is a *narrative construction*. It is valid data about the subject's imaginative state, but **invalid data about the perceptual system's input.**

  ## Phase 4: The Limitations (The "Hard Stop")
  *Where HP cannot help you.*

  **Q4.1: Are you trying to prove the existence of "Unconscious Experience"?**
  *   **Constraint:** HP cannot validate "experience" that is by definition unreportable. If the subject denies experience, HP dictates you must record "No Experience." You cannot override the subject to claim "Unconscious Seeing."
  *   **Action:** If your hypothesis requires unconscious *qualia*, HP tells you to rephrase the hypothesis to "Unconscious *processing*."

  **Q4.2: Are you treating the report as infallible?**
  *   **Constraint:** If the report contradicts known physiological limits (e.g., reporting color in a rod-isolated scotopic condition), the report is a belief error.
  *   **Action:** Override the report with physiological constraints.

  ***

  # Case Study Applications

  Here is how the HTP handles your two specific scenarios. Note the divergence in outcomes.

  ## Case 1: The Blindsight Subject
  **Scenario:** Subject G.Y.-type. Stimulus presented in scotoma.
  **Report:** "I saw nothing. I am just guessing."
  **Behavior:** 85% accuracy on forced-choice localization.

  **Running the HTP:**
  1.  **Q1 (Design):** Scale calibrated? Yes, subject distinguishes "guess" from "see."
  2.  **Q2 (Metadata):** Immediate report? Yes.
  3.  **Q3.1 (Tracking):** Does report track stimulus? No. Report is constant ("Nothing") regardless of stimulus presence.
      *   *Initial Flag:* Suggests confabulation or fixed criterion.
  4.  **Q3.2 (Dissociation):** Behavior > Report? **Yes.**
      *   *HTP Ruling:* This is a classic dissociation. HP dictates we accept the subject's text ("I saw nothing") as the truth of their phenomenological world. We do not tell them they are wrong.
  5.  **Q4.1 (Limitations):** Are we trying to prove unconscious experience?
      *   *Critical Step:* If the lab wants to claim "Unconscious Vision," HP stops them. HP says: "The subject believes they saw nothing. Therefore, in their heterophenomenological world, there was no vision."
      *   *Resolution:* You classify this as **Blind Vision (Type 1)**. The report is valid evidence of *absence of awareness*. The behavior is valid evidence of *processing*.
      *   **Outcome:** **Trust the Report** (as a report of belief/state), but acknowledge the behavioral dissociation. Do not try to "find" the experience they deny.

  ## Case 2: The Backward-Masking Confabulator
  **Scenario:** Stimulus is a simple geometric shape (e.g., a blue square) presented at 10ms, masked immediately (below objective threshold).
  **Report:** Subject gives a rich, poetic description: "It was like a ripple in deep water, cold and expanding."
  **Behavior:** Chance performance on shape identification.
  **Researcher Desire:** The lab *hopes* this proves rich unconscious semantic processing.

  **Running the HTP:**
  1.  **Q1 (Design):** Scale calibrated? Yes.
  2.  **Q2 (Metadata):** Immediate? Yes.
  3.  **Q3.1 (Tracking):** Does report track stimulus variance?
      *   *Test:* You vary the stimulus (Blue Square vs. Red Circle).
      *   *Result:* Subject gives similarly rich, metaphorical descriptions for *both*, or the metaphors do not correlate with the physical change (e.g., describes "cold water" for the Red Circle too).
      *   *HTP Flag:* **Fail.** The report does not track the physical input.
  4.  **Q3.2 (Dissociation):** Report > Behavior? **Yes.** Subject claims rich content; behavior is chance.
  5.  **Q3.3 (Confabulation Check):** Is report stimulus-incongruent?
      *   *Result:* Yes. "Ripple in water" is not a transformation of "Blue Square." It is a semantic leap unconnected to the input features.
      *   *HTP Flag:* **Critical Fail.**
  6.  **Q4.2 (Physiological Limits):** Stimulus is below threshold.
      *   *Constraint:* Physiology suggests insufficient processing for high-level semantic elaboration.

  **The Uncomfortable Outcome:**
  The HTP forces you to **discount the report as evidence of perception.**
  *   **Why:** Under HP, the report is data about what the subject *believes* they experienced. Because it fails the Tracking Test (Q3.1) and the Confabulation Check (Q3.3), the causal link between stimulus and report is broken. The report is generated by top-down expectation or narrative construction, not bottom-up perceptual content.
  *   **The Hard Truth:** You cannot publish this as "Rich Unconscious Experience." You must publish it as "Post-perceptual Confabulation driven by task demand."
  *   **Why researchers hate this:** It kills the exciting finding. It turns a "breakthrough" into "noise."
  *   **Why HP demands this:** To treat the report as infallible here is to fall into the Cartesian trap. The subject is not lying; they are sincerely reporting a belief. But as scientists, we are studying the *cause* of the report. If the cause is expectation, not perception, labeling it "consciousness" is a category error.

  ***

  # Summary for Your Students

  When you present this to the lab, emphasize these three points:

  1.  **The Report is a Datum, Not a Verdict:** Heterophenomenology gives you permission to say, "The subject is telling the truth about what they *think* they saw, but they are mistaken about what caused it." This separates sincerity from accuracy.
  2.  **Tracking is King:** A report that does not covary with stimulus parameters is not a window into perception; it is a window into imagination. This is your primary filter for confabulation.
  3.  **The "No" is Final:** If a subject says "I saw nothing," HP forbids you from claiming they had an experience they couldn't access. You can claim unconscious *processing*, but you cannot claim unconscious *experience* without redefining terms. This protects you from charges of mysticism.

  This procedure won't solve the Hard Problem, but it will keep your lab from confusing a subject's story with a neural mechanism. It keeps you in the middle ground you recognized: taking the text seriously, without worshipping it.
