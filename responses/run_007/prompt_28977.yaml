prompt: |-
  ok so i've been using chatgpt for basically all my homework this year and i'm starting to freak out a little — like i can still pass tests and write essays and stuff but i honestly dont know how much i actually *understand* anymore vs. just knowing how to prompt the thing. and it got me thinking there's probably a bigger question here about what it even means to understand something vs. being able to produce the right outputs with AI help.

  so before i go down a rabbit hole of reading about this, i want the spec: what would a good theory of epistemic dependence on AI — like, when does relying on AI erode your understanding vs. when is it fine — actually have to get right? give me the desiderata. the cases it has to handle, the distinctions it cant collapse, the edge cases that break naive views. like, one obvious requirement is it has to explain why using a calculator doesn't erode your understanding of arithmetic but using chatgpt to write every essay might erode your understanding of the material. what are the other requirements, which ones are non-negotiable, and are any of them in tension? also if you can flag which single requirement does the most work to rule out the "any tool use is fine" camp and the "all AI use is cheating" camp, that'd be great.
