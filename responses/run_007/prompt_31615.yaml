prompt: |-
  I'm on the clinical ethics committee at a large NHS trust — we do about twenty consults a month, everything from withdrawal of treatment to discharge planning disputes. One thing that keeps tripping us up is what to do with someone else's moral judgment. A patient's family says continuing treatment would be cruel; a junior doctor says a consultant's manner with elderly patients is degrading; a discharge coordinator says a particular placement is irresponsible. Sometimes we're just being given the facts and we need to make our own moral call. Other times we're effectively being asked to defer to someone else's moral perception — they've seen something we haven't and they're telling us what it morally amounts to. The philosophers have this whole literature on "moral testimony" and whether it can transmit knowledge or whether there's something dodgy about taking your moral beliefs from someone else's say-so. I need you to turn that into a practical decision procedure my committee can actually use.

  The procedure should be a set of questions we ask in order, with what counts as a sufficient answer to each, where we stop and decide for ourselves, and where we should just flag that we're making a values judgment rather than pretending the procedure has settled it. It needs to handle the difference between moral testimony and factual testimony — sometimes someone says "that's cruel" and they're really just reporting the facts in moral language, and sometimes they're making a genuinely moral claim. And it should be usable by a committee of clinicians, lay members, and a chaplain, none of whom have read metaethics.

  Run it on two cases. First: a patient's family tells us that proceeding with a fourth round of chemo would be undignified — the patient is 84, exhausted, and has said she's had enough but the oncologist thinks there's a 15% chance of remission. Second: a staff nurse alleges that a particular consultant's behaviour towards a junior doctor is bullying — she says she's seen it repeatedly and it's degrading. The consultant denies it and says the nurse has a grudge.

  Tell me honestly where the procedure is just dressing up a judgment call as a flowchart. And seperate what's settled in the philosophical literature from what's genuinely contested — I don't want to present a contested view as the consensus when I explain this to my committee.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a clinical ethics committee (CEC) in a large NHS trust.
      *   **Problem:** Handling "moral testimony" (relying on others' moral judgments) vs. factual testimony vs. independent moral reasoning.
      *   **Task:** Create a practical decision procedure (set of ordered questions) for the committee to use.
      *   **Requirements:**
          *   Must distinguish moral testimony from factual testimony.
          *   Must indicate where to stop and decide vs. where to flag a values judgment.
          *   Must be usable by a mixed committee (clinicians, lay, chaplain) without metaethics jargon.
          *   Must apply the procedure to two specific cases (Chemo/Dignity vs. Bullying/Degradation).
          *   Must be honest about limitations (where it's just dressing up a judgment call).
          *   Must distinguish settled vs. contested philosophical ground.
      *   **Tone:** Professional, practical, honest, nuanced.

  2.  **Deconstruct the Philosophical Background (Mental Sandbox):**
      *   *Moral Testimony:* Can we gain moral knowledge from others?
          *   *Pessimists (e.g., Hopkins, Hills):* Relying on testimony undermines moral autonomy/understanding. You need to grasp the *reasons*, not just the conclusion.
          *   *Optimists (e.g., Jones, McGrath):* Sometimes necessary (expertise, epistemic efficiency), especially in complex domains.
      *   *Fact/Value Distinction:* Hume's Guillotine. Is "undignified" a fact (observable state) or a value (interpretation)? Often thick concepts (Williams) blend both.
      *   *Consensus:* There is *no* consensus on whether moral testimony transmits knowledge. There *is* consensus that blind deference is risky in ethics committees (whose job is deliberation).
      *   *Practical Application:* CECs aren't just seeking truth; they are seeking legitimate, defensible recommendations. Process matters as much as outcome.

  3.  **Drafting the Procedure (The "Tool"):**
      *   Needs to be step-by-step.
      *   Needs to avoid jargon like "epistemic deference" or "thick concepts."
      *   *Step 1: Fact-Check.* Is this claim actually factual? (e.g., "He shouted" vs. "He was bullying").
      *   *Step 2: Perspective-Check.* Who is saying it? What is their vantage point? (Witness vs. Interpreter).
      *   *Step 3: Reason-Check.* Can they give the *why*? (Crucial for avoiding blind deference).
      *   *Step 4: Consensus-Check.* Do others see it the same way? (Intersubjective verification).
      *   *Step 5: Responsibility-Check.* Who owns the decision? (Committee cannot outsource accountability).

  4.  **Applying to Case 1 (Chemo/Dignity):**
      *   Claim: "Undignified."
      *   Facts: 84yo, exhausted, patient says "enough," 15% chance.
      *   Family testimony: Moral interpretation of the facts.
      *   Oncologist testimony: Probabilistic fact + professional norm.
      *   Procedure outcome: Committee must weigh "dignity" against "hope/benefit." Cannot just defer to family or doctor.

  5.  **Applying to Case 2 (Bullying/Degradation):**
      *   Claim: "Bullying/Degrading."
      *   Facts: Nurse saw it repeatedly. Consultant denies.
      *   Procedure outcome: This is heavily dependent on witness credibility and pattern recognition. "Degrading" is a thick concept. Committee needs more than one person's moral take. Needs investigation, not just ethics deliberation.

  6.  **Addressing the "Honesty" Requirement:**
      *   Where is this just a flowchart for a gut feeling?
      *   Step 3 (Reasons) is the key. If reasons are thin, the procedure exposes that we are just guessing.
      *   Acknowledge that "dignity" and "bullying" are essentially contested concepts.

  7.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* Blind deference is bad practice in ethics committees. Reasons are required.
      *   *Contested:* Whether moral knowledge *can* be transmitted via testimony. Whether "thick concepts" are factual or evaluative.

  8.  **Refining the Output (Iterative Polish):**
      *   *Structure:* Introduction -> Philosophical Context (Brief) -> The Procedure -> Case Applications -> Limitations/Honesty Check -> Philosophical Status Report.
      *   *Language:* NHS context (Trust, CEC, MDT). Avoid "metaethics." Use "values," "facts," "reasons."
      *   *Critique:* Ensure I don't sound like I'm solving the philosophical problem, but rather managing the practical risk.

      *(Self-Correction during drafting)*: I initially thought about telling them to ignore moral testimony. That's wrong. They *need* it (e.g., from the chaplain or lay members). The issue is *uncritical* acceptance. The procedure must focus on *unpacking* the testimony, not rejecting it.
      *   *Refinement:* Focus on "Thick Concepts." Explain that words like "cruel" or "dignified" look like facts but act like values. The procedure needs to separate the observable behavior from the evaluation.

  9.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop/Flag points? Yes.
      *   Two cases run? Yes.
      *   Honesty about limitations? Yes.
      *   Settled vs. Contested? Yes.

  10. **Final Polish:** Ensure the tone is respectful of the committee's workload and expertise. (Proceed to generate output).

  *(Post-computation check)*: Did I clearly distinguish the philosophical status? Yes, in the final section. Did I run the cases specifically through the questions? Yes. Is the procedure usable by non-philosophers? I will ensure the language is plain English.

  *Key Insight:* The core tension is between *epistemic efficiency* (trusting the nurse who saw it) and *moral agency* (the committee must own the judgment). The procedure must bridge this.

  *Let's build the "Moral Testimony Triage Tool".*

  *Step 1: Translation.* Turn the moral claim into observable facts.
  *Step 2: Vantage Point.* Did they see it or interpret it?
  *Step 3: Reasons.* Why does X amount to Y?
  *Step 4: Convergence.* Do others agree?
  *Step 5: Ownership.* Committee makes the final call.

  *Case 1:* Family says "undignified." Translation: Patient vomiting, tired, bedbound. Vantage: Family sees suffering. Reasons: "She can't talk." Committee weighs this against medical benefit.
  *Case 2:* Nurse says "bullying." Translation: Consultant raised voice, interrupted. Vantage: Repeated witness. Reasons: "Power imbalance." Committee cannot decide on hearsay; needs HR investigation. Ethics role is limited until facts are settled.

  *Wait, Case 2 is tricky.* Ethics committees usually don't investigate bullying; that's HR/Free to Speak. I need to make sure the procedure flags that this might be *outside* ethics remit if it's purely factual dispute about behavior. But the prompt asks to run the procedure on it. I will note the jurisdictional boundary.

