prompt: |-
  I'm a machine learning engineer who does Bayesian modeling day to day, so I'm fluent in the usual vocabulary: likelihoods, priors and posteriors, generative models, sampling weights, selection bias, sampling frames, all that. I keep hearing about the doomsday argument, and from the little I've picked up it sounds like it's basically the German tank problem applied to your own birth rank: if you treat yourself as a uniformly sampled serial number from the set of all humans that will ever live, then conditional on total population N your rank n has likelihood 1/N, and observing that n is only around a hundred billion is evidence against N being enormous, so the posterior shifts toward smaller N and therefore toward extinction sooner than you'd otherwise have thought. Restate the doomsday argument in my vocabulary as faithfully as you can — write out the likelihood, the prior, the posterior update, the self-sampling assumption, and the self-indication assumption, and explain where each one lives in a generative model I'd actually build. Then give me the residue report. Which parts translate cleanly into "estimating an unknown population size from a uniformly sampled index," and which parts have no counterpart in anything I'd actually code? I especially want to know whether the reference class problem is just the ordinary problem of choosing the sampling frame, or whether it's stranger than that. And does anything in the philosophers' version survive translation that would make me treat it as more then a bad application of the German tank problem? I'd rather you not flatter my vocabulary — if the honest answer is that the whole thing is a textbook case of an unprincipled prior and an undefined sampling process, say so, but only after you've checked whether the self-locating weirdness actually drops out.
