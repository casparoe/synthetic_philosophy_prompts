  7.  **Final Polish:** Check for clarity on the "Ego-dystonic" point. This is crucial for Point 4. It shows that the *harm* condition (distress) was the actual disease candidate, not the *dysfunction* (orientation). This supports a Hybrid view, which complicates pure Normativism too.

