      *   *Tone Check:* Ensure I sound like a colleague/mentor, not a textbook. Use phrases like "In my view," "The literature suggests," etc.
      *   *Specific References:* Mention Libet, Wegner, Haynes, Mele, maybe Haggard. Mention the "Veto."
