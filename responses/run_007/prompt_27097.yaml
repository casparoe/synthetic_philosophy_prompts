answer: |-
  This is a classic and deeply entrenched dispute in contemporary metaphysics and legal theory. It recapitulates the debate between "production" accounts of causation (favored by Callum) and "dependence" or "counterfactual" accounts (favored by Helena), with the added layer of the Hart and Honoré distinction between causal relations and causal selection.

  Here is a step-by-step adjudication of the exchange, followed by a proposed resolution that attempts to dissolve the impasse.

  ### Part I: Step-by-Step Adjudication

  #### Round 1: The Proliferation Objection
  **Callum:** If omissions are causes, then everyone who failed to water the plants caused their death. This is absurd proliferation.
  **Helena:** Proliferation is a problem of *explanation* (causal selection), not *causation* (metaphysical relation).

  **Adjudication: Helena wins this round.**
  Callum is committing a category error that is well-documented in the literature (most notably by J.L. Mackie and H.L.A. Hart). There is a robust distinction between the *causal field* (the totality of conditions necessary and sufficient for an effect) and the *causal explanation* (the pragmatic selection of specific factors from that field).
  When we say "the match caused the fire," we do not deny that oxygen was a cause; we deny that it was *causally salient*. Callum's intuition that the Queen is not a cause is an intuition about *salience*, not ontology. If causation is understood as counterfactual dependence (as Helena implies), the Queen's failure *is* a condition of the death in the broad metaphysical sense, even if citing it is pragmatically infelicitous. Callum's reductio fails because it conflates the metaphysics of the relation with the pragmatics of speech.

  #### Round 2: Difference-Making and Possible Worlds
  **Callum:** Oxygen is a difference-maker (remove it, fire stops). The Queen's watering is not a live possibility (no relevant possible world). Therefore, no difference-making.
  **Helena:** In legal contexts (lifeguard), duty creates the counterfactual structure. The "relevant baseline" is normative.

  **Adjudication: Draw (with a slight edge to Helena on application, Callum on theory).**
  Callum identifies a genuine technical problem for Lewisian counterfactual theories: the problem of *closeness*. For the Queen's omission to be a cause, there must be a possible world where she waters the garden that is "close" to the actual world. Intuitively, such a world is very distant.
  Helena correctly identifies how we actually reason in moral and legal contexts: we manipulate the similarity metric. A world where a lifeguard saves a swimmer is "closer" to actuality than a world where the Queen gardens, because the former violates fewer laws of nature or social expectation.
  However, Callum is right to be suspicious. If the "closeness" of a possible world is determined by normative duties, then the truth conditions of causal claims depend on moral facts. This is metaphysically costly. Helena wins on describing *practice*, but Callum wins on highlighting the *metaphysical price* of that practice.

  #### Round 3: Normativity vs. The Furniture of the Universe
  **Callum:** If causation depends on "oughts," it is not worldly. Causation is physical; omissions are normative judgments dressed up.
  **Helena:** False dichotomy. All causation relies on "normal conditions" (e.g., atmosphere). Omissions just use a normative baseline.

  **Adjudication: Callum wins on fundamental metaphysics; Helena wins on special sciences.**
  Callum is defending a realist or physicalist intuition: causation should be part of the "fundamental furniture." If you look at the equations of physics, there are no variables for "duties" or "omissions." There is only energy transfer and particle interaction. From the perspective of fundamental physics, Callum is correct: there is no "absence" pushing on the plants.
  Helena is defending the autonomy of the special sciences (biology, law, psychology). In these domains, "normalcy" is indispensable. A heart causes blood flow only relative to a normal physiological baseline. Helena is right that "normal" is always context-relative, but Callum is right that "normative normalcy" (duty) is distinct from "statistical normalcy" (atmosphere). Callum is correct that importing normativity into *fundamental* metaphysics is suspect; Helena is correct that human-level causation is inextricably linked to normative expectations.

  #### Round 4: The Relata Problem (Absences as Things)
  **Callum:** Causation requires relata (things that exist). Absences do not exist. Therefore, absences cannot be causes.
  **Helena:** (Implicitly relies on the baseline argument).

  **Adjudication: Callum wins.**
  This is the strongest metaphysical objection to omission causation (championed by philosophers like Helen Beebee and Douglas Ehring). Causation is typically understood as a relation between events or facts. An omission is not an event; it is the *non-occurrence* of an event. To say an absence is a relatum is to reify "nothingness" into a "something."
  Helena's appeal to "normal conditions" does not solve the ontological problem. Even if we accept a normative baseline, what *thing* in the world corresponds to the lifeguard's omission? There is no event of "not-swimming." There is only the lifeguard standing still. If the standing still is the cause, it is a positive act, not an omission. If the *absence* of swimming is the cause, we require negative facts. Callum is ontologically more parsimonious here.

  ---

  ### Part II: Diagnosis of the Impasse

  The reason neither student could yield is that they are advocating for two different concepts of causation that are often conflated in natural language.

  1.  **Callum is arguing for Causation as Production.** On this view, causation is a physical process, a transfer of energy, or a continuous spatiotemporal chain. Omissions cannot be causes here because there is no physical "stuff" transmitted from a non-event to an effect.
  2.  **Helena is arguing for Causation as Dependence.** On this view, causation is about counterfactual dependence. If $C$ had not happened (or if $O$ had not been omitted), $E$ would not have occurred. This view handles omissions easily but struggles with proliferation and normativity.

  The impasse exists because Callum demands an ontology that excludes omissions, while Helena demands a semantics that includes them. Both are partially right: our *ontology* should probably exclude omissions, but our *causal discourse* must include them to make sense of law, morality, and biology.

  ### Part III: A Proposed Resolution

  There is a way to resolve this that neither student fully articulated. It involves combining **Contrastive Causation** with **Causal Pluralism**.

  #### 1. Contrastive Causation (Solving Proliferation and Relata)
  Callum's proliferation worry (The Queen) and his relata worry (Absences) can be dissolved by adopting the view that causation is not a binary relation ($C$ causes $E$) but a **quaternary relation** ($C$ rather than $C^*$ causes $E$ rather than $E^*$).

  *   **The Gardener:** The claim is not "The gardener's omission caused the death." It is "The gardener's *failing to water* **rather than watering** caused the *death* **rather than survival**."
  *   **The Queen:** The claim "The Queen's failing to water caused the death" is elliptical. When we fill in the contrast, it becomes: "The Queen's failing to water **rather than watering**..."
      *   Here, Callum's intuition is vindicated. The contrast "Queen watering" is not a relevant alternative in the context. The contrast class for the Queen is "Queen doing her actual duties." Since she did her actual duties, the causal claim is false.
      *   This solves proliferation without denying the metaphysics. The Queen's omission is not a cause because the *contrast* is inappropriate, not because the relation doesn't hold.
  *   **The Relata:** This also solves Callum's ontological worry. We do not need to reify "absences" as strange negative objects. The relata are *events* (the gardener standing there), but the causation holds only relative to a *contrastive property* (watering vs. not watering). We are comparing two possible events, not positing an existing "nothing."

  #### 2. Causal Pluralism (Solving Normativity)
  Callum is right that fundamental physics has no normativity. Helena is right that legal and social causation requires it. The solution is to admit there is no single "Master Concept" of causation.

  *   **Physical Causation:** Governs the "furniture of the universe." Here, Callum is right: omissions are not causes. There is only positive physical interaction.
  *   **Agentive/Legal Causation:** Governs responsibility and explanation. Here, Helena is right: omissions are causes because the *contrast class* is fixed by normative expectations.

  **The Synthesis:**
  When Helena says the lifeguard "caused" the death, she is speaking truly within the **Agentive/Legal** framework. When Callum says omissions are not "real" causation, he is speaking truly within the **Physical/Production** framework. They are talking past each other because they are operating in different causal regimes.

  **Recommendation for the Students:**
  Tell Callum that his ontological parsimony is respected if we treat omissions as **contrastive features of events** rather than negative entities. Tell Helena that her normative baseline is respected if we acknowledge that **causal claims are context-sensitive** and vary by domain (physics vs. law).

  The "truth" about causation by omission is that it is a **real dependency relation** (validating Helena) that is **fixed by contrastive contexts** (validating Callum's worry about the Queen) and is **domain-specific** (validating Callum's worry about normativity in fundamental physics).

  If they accept **Contrastive Causal Pluralism**, they can both stop arguing: Callum can maintain that the universe contains no negative facts, and Helena can maintain that the lifeguard is causally liable for the death. Both claims can be true simultaneously.
