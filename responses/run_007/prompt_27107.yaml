answer: |-
  # Joint Statement on the Platonia Dilemma and Symmetric One-Shot Choices

  **Issued by:** The Superrationalist Camp and The Causal Decision Theory Camp
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Logical Symmetry and Causal Independence

  ## Preamble: The Shared Case

  We, the undersigned camps, agree to fix the following scenario as the neutral ground for our collaboration. This is the **Platonia Dilemma**.

  There are $N$ players ($N > 1$). All players are symmetrically situated: they possess identical information regarding the rules and payoffs, and they are unable to communicate with one another. Each player must independently choose one of two actions: **Send** a message or **Not Send**.

  **Payoff Structure:**
  *   If exactly one player chooses **Send**, that player receives a fixed prize $V$ ($V > 0$).
  *   If zero players choose **Send**, no one receives anything.
  *   If more than one player chooses **Send**, no one receives anything.

  We acknowledge the **Luring Lottery** as a related case for comparative analysis. In this variant, a fixed prize $V$ is awarded by random draw among all players who choose **Send**. If $K$ players send, each sender has a $1/K$ probability of winning $V$ (expected value $V/K$). If no one sends, no one wins.

  We agree that the descriptions above are causally closed: in the base case, there is no physical mechanism by which one player's choice can influence another's choice after the game begins.

  ***

  ## 1. Agreed Claims

  Both camps affirm the following claims as mathematically and logically correct descriptions of the case defined above.

  1.  **Weak Dominance:** For any individual player, the action **Send** weakly dominates **Not Send**. If no other player sends, **Send** yields $V$ while **Not Send** yields $0$. If one or more other players send, both actions yield $0$. There is no configuration of other players' choices where **Not Send** yields a higher payoff than **Send**.
  2.  **Symmetric Mixed Strategy Expectation:** If every player independently chooses **Send** with probability $p$, the expected payoff for any individual player is $E(p) = V \cdot p(1-p)^{N-1}$.
  3.  **Optimal Symmetric Probability:** The function $E(p)$ is maximized when $p = 1/N$. At this probability, the group's probability of producing exactly one winner is maximized.
  4.  **Symmetric Nash Equilibrium:** The only symmetric Nash equilibrium in the Platonia Dilemma is the pure strategy profile where every player chooses **Send** ($p=1$). In this equilibrium, the expected payoff for every player is $0$.
  5.  **Instability of the Superrational Mixture:** The strategy profile where every player chooses **Send** with probability $p = 1/N$ is *not* a Nash equilibrium. Given that all other players play $p = 1/N$, an individual player can increase their expected payoff by deviating to **Send** with probability $1$.
  6.  **Asymmetric Pure Equilibria:** There are exactly $N$ asymmetric pure-strategy Nash equilibria. In each of these, exactly one specific player chooses **Send** and all others choose **Not Send**. In these equilibria, the total payoff $V$ is realized.
  7.  **Outcome of Universal Causal Reasoning:** If all players follow the prescription to maximize expected utility based solely on causal independence (Camp 2), all will choose **Send**, and the total payoff will be $0$.
  8.  **Outcome of Universal Superrational Reasoning:** If all players follow the prescription to adopt the strategy that yields the highest utility if universally adopted (Camp 1), all will randomize with $p = 1/N$, and the expected total payoff will be $V(1 - 1/N)^{N-1}$.
  9.  **No Focal Point:** In the symmetric base case, there is no information available to any player that distinguishes them from any other player. Therefore, no player can rationally select one of the asymmetric pure equilibria (Claim 6) over another without violating the symmetry of the situation.

  ***

  ## 2. Disagreements Table

  The following table outlines the residual disagreements. Each formulation is phrased such that the respective camp accepts it as an accurate statement of their position.

  | Disagreement Topic | Superrationalist Formulation | Causal Decision Theorist Formulation |
  | :--- | :--- | :--- |
  | **(a) The Object of Rational Choice** | Rational choice selects a **policy** or **strategy** based on the logical output of a reasoning type. Since we are identical reasoners in identical situations, my choice of strategy logically entails your choice of the same strategy. | Rational choice selects a **token act** based on its causal consequences. My choice is a physical event that does not causally influence your physical event. I must maximize utility given your action as a fixed background fact. |
  | **(b) Normative Force of Dominance** | The weak dominance of **Send** is illusory in symmetric cases. Reasoning from dominance assumes the other players' actions are independent of my reasoning process, which is false when we are logical copies. The tragedy of the Nash equilibrium proves dominance reasoning is defective here. | The weak dominance of **Send** retains full normative force. Causal independence is a structural fact of the universe, not a premise that can be overridden by logical symmetry. A tragedy resulting from rational choices is a feature of the payoff structure, not a failure of rationality. |
  | **(c) Equivalence to Algorithm Selection** | The original dilemma is **relevantly equivalent** to the case where players explicitly run the same decision algorithm. Logical symmetry creates the same dependency as physical code-sharing; the "transparency" of the link does not change the logical necessity. | The original dilemma is **distinct** from the algorithm-selection case. In the algorithm case, my choice of code causally determines the output of the copies. In the original case, no such causal channel exists. Rationality demands different actions in these two cases. |
  | **(d) Substantive vs. Verbal Dispute** | The dispute is **substantive**. It concerns what action a thinker ought to perform. If we ban the word "rational," we still disagree on whether the player should press the **Send** button or randomize. | The dispute is **largely verbal** regarding the label "rational," but substantive regarding action only if the causal structure changes. In the base case, we agree the causal structure mandates **Send**; we disagree only on whether a different action deserves the honorific "rational." |

  ***

  ## 3. Crux Section

  For each crux, we describe a specific variation or argument. Both camps accept the description of the case. We record each side's prediction or diagnosis of what rational agents will do or how the case should be evaluated.

  ### Crux 1: The Algorithm-Selection Case
  **Case:** Players are explicitly told: "You are all running identical copies of a single decision algorithm. You may program the algorithm's output (Send, Not Send, or Randomize) before it runs. The algorithm will be instantiated $N$ times."
  *   **Shared Premise:** In this case, choosing the algorithm's policy causally determines the actions of all $N$ instantiations.
  *   **Superrationalist Prediction:** Rational agents will program the algorithm to randomize with $p = 1/N$. This case merely makes explicit the logical dependency that was implicit in the base case.
  *   **Causal Decision Theorist Diagnosis:** Rational agents will program the algorithm to randomize with $p = 1/N$. However, this confirms that rationality depends on causal links. This case is *not* equivalent to the base case; it validates CDT because the causal structure has changed to link the players.

  ### Crux 2: The Sealed-Choice Case
  **Case:** Players are told: "The other $N-1$ players have already made their choices. Their envelopes are sealed. You cannot influence them. You must now choose."
  *   **Shared Premise:** Causal influence on the other players is physically impossible.
  *   **Superrationalist Prediction:** Rational agents should still randomize with $p = 1/N$ (conditional on the assumption that the others are also superrational reasoners who reasoned *before* sealing). The "sealed" nature is irrelevant if the other players' choices were determined by the same logical reasoning process the current player is now engaging in.
  *   **Causal Decision Theorist Diagnosis:** Rational agents must choose **Send**. Since the others' choices are fixed facts of the past, the player faces a simple dominance structure. If the others sent, sending gains nothing but loses nothing. If the others didn't send, sending wins. The superrationalist intuition here relies on "magical" backward causation or a confusion of logical correlation with causal influence.

  ### Crux 3: The Iterated Case
  **Case:** The same $N$ players face the Platonia Dilemma repeatedly for $T$ rounds, with full feedback after each round.
  *   **Shared Premise:** Players can condition future choices on past history.
  *   **Superrationalist Prediction:** Players will quickly converge on a turn-taking convention (e.g., Player 1 sends in Round 1, Player 2 in Round 2) without explicit communication, recognizing the symmetric benefit of cooperation.
  *   **Causal Decision Theorist Prediction:** If $T$ is finite and known, backward induction dictates **Send** in the final round (as it becomes a one-shot dilemma). This unravels cooperation to Round 1. Turn-taking may emerge only if $T$ is infinite or uncertain, sustained by threat of punishment (Nash reversion), not by superrational logic.

  ### Crux 4: The Luring Lottery Variant
  **Case:** The payoff is $V/K$ for each sender, where $K$ is the total number of senders. (Fixed prize divided among entrants).
  *   **Shared Premise:** **Send** still weakly dominates **Not Send** (Expected value of sending is $V/K > 0$; Not Sending is $0$).
  *   **Superrationalist Prediction:** Rational agents should coordinate to limit entry. If everyone sends, each gets $V/N$. If agents randomize to produce an expected $K=1$, the winner gets $V$. Superrationality dictates maximizing the ex-ante expected value for the group, which may imply a mixed strategy different from the Nash equilibrium.
  *   **Causal Decision Theorist Diagnosis:** Rational agents must **Send**. In this variant, the "tragedy" is milder (everyone gets something vs. nothing), but the logic is identical. My entry does not causally prevent your entry. The superrationalist calculation confuses the *group* optimum with the *individual* decision problem. The force of the CDT objection does not shift; dominance remains decisive.

  ***

  ## 4. Closing Note: Separating the Verbal from the Substantive

  In the spirit of this collaboration, we clarify the nature of our remaining divergence.

  **1. The Substantive Core:**
  There is a substantive disagreement regarding **action guidance in the base case**.
  *   The Superrationalist Camp prescribes: **Randomize with $p = 1/N$**.
  *   The Causal Decision Theorist Camp prescribes: **Choose Send**.
  If both camps were forced to use the other's vocabulary (e.g., CDT forbids the word "rational," SR forbids the word "causal"), they would still recommend different physical actions in the Platonia Dilemma as defined in Section 1. Therefore, the dispute is not merely verbal.

  **2. The Verbal Perimeter:**
  There is a verbal disagreement regarding the **extension of the term "Rational."**
  *   The Causal Decision Theorist Camp reserves the term "Rational" for adherence to causal dominance. They view the Superrationalist action as "Cooperative" or "Optimal" but not "Rational" in the strict decision-theoretic sense.
  *   The Superrationalist Camp extends the term "Rational" to include logical coordination. They view the Causal Decision Theorist action as "Myopic" or "Causally Valid but Irrational."

  **3. Resolution Condition:**
  The dispute would dissolve into a purely verbal disagreement if the Superrationalist Camp conceded that the base case lacks the causal structure required for their preferred action, or if the Causal Decision Theorist Camp conceded that logical symmetry constitutes a sufficient "link" to override causal independence. As neither side accepts these concessions, we record that the disagreement is **substantive regarding action** and **verbal regarding classification**.

  **Signed,**

  *The Superrationalist Camp*
  *The Causal Decision Theory Camp*
