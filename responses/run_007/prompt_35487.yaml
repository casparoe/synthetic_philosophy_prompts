  You've encountered the famous **St. Petersburg Paradox**. Your math is technically correct: the expected monetary value is indeed infinite. However, your intuition is also correct: no rational person would pay a huge amount to play. The disconnect arises because expected value alone doesn't capture how humans actually value money and risk.

  In the 18th century, Daniel Bernoulli solved this by introducing **utility**. He argued that the value of money isn't linear. Gaining $1,000 means much more to a student than to a billionaire. This is called *diminishing marginal utility*. The usefulness you get from each additional dollar decreases as you have more. Mathematically, if you calculate expected *utility* (often modeled as the logarithm of wealth) rather than expected *dollars*, the infinite sum converges to a finite, reasonable number. This suggests a fair price might be closer to $20 or $30, not infinity.

  There's also a practical limit: **finite bankrolls**. The infinite expected value assumes your friend can pay you any amount, forever. In reality, no one has infinite money. If your friend caps the payout at $1 million (roughly $2^{20}$), the expected value drops to about $20. Even if he could pay the entire global wealth (approx $2^{60}$), the expected value would only be around $60. The "infinite" value relies on outcomes that are physically impossible to fund.

  Finally, consider **risk and frequency**. The probability of winning a large amount is vanishingly small. To win $1,024, you need 10 heads in a row (1 in 1,024 chance). To win $1 million, you need 20 heads in a row. Most games end quickly with a small payout ($2 or $4). Paying $50 guarantees a loss the vast majority of the time. While the *average* over infinite games is infinite, the *likely* outcome of a single game is very small.

  So, the flaw isn't in your arithmetic, but in using expected monetary value as the sole decision metric. Rational decision-making involves weighing utility, risk tolerance, and real-world constraints. Your friend's "airtight" math ignores the reality of wealth and human psychology. You're not being irrational; you're recognizing that a dollar today is worth more than a hypothetical infinite fortune tomorrow. The paradox teaches us that math models reality, but it isn't reality itself.
