      *   *Diagnosis:* The work is done by **Dynamic Consistency** and **Separability**. The cycle allows the pump, but Myopia enables it. Sophistication blocks it by treating the sequence as a single choice.
      *   *Defender's Reply:* The "Revealed Preference" counter. If you refuse the trade, you aren't acting on $C \succ A$. Therefore, your *effective* preferences are transitive (you prefer "Stay at A" to "Cycle"). The cycle exists in abstraction, but not in action. Rationality is about action.

