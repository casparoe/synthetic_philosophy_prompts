  # The "Who Gets Saved?" Sorting Tree

  **Instructions for the Group:**
  Read each scenario carefully. Answer **Yes** or **No** (or choose the option) based on your immediate moral intuition about what you are *required* to do. Do not overthink the philosophical justification yet; just pick the action that feels right.

  ---

  ### Question 1: The Standard Rescue
  You are driving a rescue boat. To your left, a rock has trapped **one person**. To your right, a rock has trapped **five people**. The tide is rising; you have time to drive to only one rock before the water kills them. You have no prior relationship with any of them.
  **Are you morally required to save the five people rather than the one?**

  *   **No** (I am not required to save the five; a coin flip is permissible) → *Go to Question 2*
  *   **Yes** (I must save the five) → *Go to Question 3*

  ---

  ### Question 2: The Method of Chance
  *(For those who answered "No" to Q1)*
  You decide to use a random method to decide whom to save, since you are not required to save the five. Which method is fairer?
  **Option A:** Flip a coin between the *groups* (Heads save the one, Tails save the five). This gives the single person a **50%** chance of survival.
  **Option B:** Run a lottery among the *individuals* (6 tickets in a hat). This gives the single person a **1-in-6** chance of survival.

  *   **Option A (50% / Group Coin Flip)** → *Leaf: Taurek's Equal Chance View*
  *   **Option B (1-in-6 / Individual Lottery)** → *Leaf: Weighted Lottery View*

  ---

  ### Question 3: Different Magnitudes of Harm
  *(For those who answered "Yes" to Q1)*
  Same setup, but the stakes change. To your left, **one person** will **die** if not saved. To your right, **five people** will **lose an arm** (severe injury, but not life-threatening) if not saved. You can only save one group.
  **Are you morally required to save the one person (preventing death) rather than the five (preventing injury)?**

  *   **No** (I must still save the five; five arms outweigh one life) → *Leaf: Straightforward Aggregation*
  *   **Yes** (I must save the one; life trumps limbs) → *Go to Question 4*

  ---

  ### Question 4: The Small Gap
  *(For those who answered "Yes" to Q3)*
  Same setup (life vs. life), but the numbers are closer. To your left, **one person**. To your right, **two people**.
  **Are you morally required to save the two people rather than the one?**

  *   **No** (The gap is too small; a coin flip is permissible here) → *Leaf: Threshold View (Moderate Aggregation)*
  *   **Yes** (I must still save the greater number, however small the margin) → *Go to Question 5*

  ---

  ### Question 5: The Prior Promise
  *(For those who answered "Yes" to Q4)*
  Same setup (1 vs. 5 lives). However, before the accident, you **promised the single person** that you would always prioritize their safety. The five strangers have no such claim on you.
  **Does the promise require you to save the single person, breaking the general rule of saving the many?**

  *   **Yes** (The promise binds me; the one can reasonably reject being sacrificed) → *Leaf: Scanlon-style Contractualism*
  *   **No** (The claim to life outweighs the promise; I must still save the five) → *Leaf: Kamm-style Pairwise Comparison*

  ---

  ### Question 6: The "Save the Few" Check
  *(Optional Consistency Check)*
  Return to Question 1 (1 vs. 5 lives).
  **Would you ever be morally required to save the single person *instead* of the five, assuming no promises and equal need?**

  *   **Yes** → *Leaf: The "Save the Few" View (Logically Possible but Undefended)*
  *   **No** → *Consistent with previous answers.*

  ---

  ## Scoring Key & Position Descriptions

  | Leaf Position | Core Intuition | Philosophical Association |
  | :--- | :--- | :--- |
  | **Taurek's Equal Chance** | Numbers don't count. Each *group's loss* is equally tragic. Give groups equal weight. | John Taurek ("Should the Numbers Count?") |
  | **Weighted Lottery** | Numbers count as probability, not destiny. Each *individual* gets equal chance, resulting in proportional group odds. | John Broome / Compromise View |
  | **Straightforward Aggregation** | Maximize the good. Sum up the benefits. More lives saved is always better, even against severe harm to few. | Classical Utilitarianism / Consequentialism |
  | **Threshold View** | Numbers count, but only above a certain ratio. Small differences don't justify imposing loss; large ones do. | Moderate Aggregation / Common Sense Morality |
  | **Scanlon-style Contractualism** | Principles must be justifiable to each person. Special obligations (promises) can veto aggregation. | T.M. Scanlon ("What We Owe to Each Other") |
  | **Kamm-style Pairwise** | Compare individuals one-to-one. The extra 4 have claims the 1 cannot match, but rights constrain *how* we save. | Frances Kamm (Deontological Constraints) |
  | **Save the Few** | The minority has priority. | **Undefended / Incoherent** (See Analysis) |

  ---

  ## Analysis & Flags for the Discussion Leader

  ### 1. Indistinguishable Positions (The Scanlon/Kamm Problem)
  **The Issue:** In pure rescue cases (1 vs. 5 lives), Scanlon and Kamm almost always yield the same verdict (Save the 5). Question 5 (The Promise) attempts to pry them apart, but this is a heuristic, not a hard logical divider.
  *   **Scanlon:** Emphasizes *reasonable rejection*. A promisee can reasonably reject a principle that breaks promises to save strangers.
  *   **Kamm:** Emphasizes *pairwise comparison of claims*. She might argue the claim to life is so strong it overrides the promise claim, or she might agree the promise creates a special duty.
  *   **Discussion Tip:** If participants land on Kamm but argue for the Promise view, acknowledge that the tree uses the Promise case as a proxy for "Special Obligations vs. General Claims." In reality, distinguishing Scanlon and Kamm often requires meta-ethical questions about *why* the numbers count, not just *what* you do.

  ### 2. Logically Possible but Undefended Combinations
  **The "Save the Few" View (Q6):**
  *   **Combination:** Answering "Save the 1" in Q1 (1 vs. 5 lives) without special obligations.
  *   **Status:** **Undefended.**
  *   **Why:** There is no serious ethical theory arguing that the *minority* has intrinsic priority over the majority in identical harm cases. It violates basic impartiality. If a participant selects this, challenge them: "Why does being in the minority grant you a stronger claim?"

  **The "Aggregating Harms" Inconsistency (Q3):**
  *   **Combination:** Saving the 5 in Q1 (Lives) but saving the 5 in Q3 (Arms vs. Life).
  *   **Status:** **Straightforward Aggregation.**
  *   **Note:** This is coherent (Utilitarianism), but many find it unattractive. It implies enough broken arms can "outweigh" a death. This is the classic "Utility Monster" or "Aggregation Objection" entry point.

  **The "Threshold" Instability (Q4):**
  *   **Combination:** Saving the 5 in Q1, but Flipping in Q4 (1 vs. 2).
  *   **Status:** **Coherent (Threshold View).**
  *   **Note:** This is a very common intuitive position. The philosophical challenge here is: *Where is the threshold?* If 2 vs. 1 is a flip, and 100 vs. 1 is save-100, at what number does the duty kick in? This leads to the "Sorites Paradox" objection against Threshold views.

  ### 3. Taurek vs. Weighted Lottery (Q2)
  **The Issue:** Both views deny that you *must* save the five.
  *   **Taurek:** Often interpreted as flipping between *groups* (50/50). His argument is that the loss to the group of 5 is not "five times worse" than the loss to the group of 1 in a way that justifies imposing certainty of death on the 1.
  *   **Weighted Lottery:** Gives each *individual* an equal chance (1/6). This results in a 5/6 probability of saving the group of 5.
  *   **Discussion Tip:** Ask the Taurek group: "If you give the groups a 50/50 chance, aren't you giving the individuals in the larger group a lower chance of survival (10%) than the singleton (50%)? Is that fair?" This highlights the tension between "Equal Concern for Groups" vs. "Equal Concern for Individuals."

  ### 4. Hidden Logical Space: "Local vs. Global"
  There is a position not explicitly captured by the leaves: **Local Pairwise vs. Global Aggregation.**
  *   **Case:** Room A has 1 person. Room B has 1 person. You flip. En route, 4 people join Room B.
  *   **Kamm:** You should switch to Room B (Pairwise cancellation leaves 4 vs. 0).
  *   **Some Aggregators:** You might be bound by your initial commitment to the flip (Local).
  *   **Note:** If the discussion stalls, introduce this "Two Rooms" case to test whether participants think numbers count *globally* (total sum) or *locally* (relative to the specific choice situation).

  ### 5. Facilitation Advice
  *   **Don't reveal the labels immediately.** Let them argue about the cases first. "Why did you flip on 1 vs. 2 but save the 5 on 1 vs. 5?"
  *   **Watch for Q3.** This is usually the most contentious question. It separates the Consequentialists from the Deontologists/Contractualists.
  *   **Use the "Undefended" flag.** If someone says "Save the 1 in Q1," press them. It forces the rest of the group to articulate *why* numbers should count at all, which sets up Taurek's actual argument nicely.
