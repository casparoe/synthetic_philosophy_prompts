answer: |-
  Hi there, it sounds like a fantastic group to work with, and tackling the dogmatism paradox with students who only have a introductory grip on JTB and Gettier is a bold but rewarding choice. Since you asked for a plan on how to structure the hour rather than a summary of the puzzle itself, I will focus entirely on the pedagogical sequencing and the specific conceptual hurdles you will need to clear before the argument even lands. Before you state the puzzle, you need to secure three specific commitments from the students, because if any of these are wobbly, the paradox will dissolve too easily and they will miss the tension. First, you must establish the Closure Principle, but you need to do it in a way that feels intuitive to them, perhaps by asking if knowing you are in London and knowing that London is in the UK entails knowing you are in the UK. Second, you need to lock in the factivity of knowledge, reminding them that if someone claims to know p, then p must be true, which is distinct from merely believing or being justified. Third, and this is the one you might be overlooking, you need them to accept the principle that if one knows a piece of evidence is false or misleading, one is entitled to disregard it. If you do not get explicit agreement on these three premises beforehand, the students will spend the whole hour attacking the logic of the argument rather than wrestling with the philosophical implication, so spend the first fifteen minutes drilling these intuitions with low-stakes examples until they feel like common sense.

  Once those foundations are laid, you need an example that carries the weight of the paradox without triggering immediate skepticism or trivializing the stakes. You are right to avoid mathematical cases because knowing a math proof feels different from knowing empirical facts, and you should also avoid cases where the evidence is obviously flimsy, like a random stranger contradicting a clear memory, because then the dogmatic response seems rational rather than paradoxical. I recommend using a scenario involving a reliable schedule or itinerary, such as knowing a train leaves at 2 PM because you just checked the official railway app and have a ticket, contrasted with counter-evidence like a departure board at the station saying 3 PM or a friend texting you that the time changed. This works because the evidence against you is credible enough that ignoring it feels irrational, yet if you truly know the original time, the counter-evidence must be misleading. Walk them through the inference slowly using this case: if you know the train leaves at 2, and you know that if it leaves at 2 then the board saying 3 is wrong, then you know the board is wrong, and therefore you can ignore the board. The goal here is to make the conclusion feel deeply uncomfortable, like it is licensing a kind of intellectual vice, which is exactly where the paradox bites.

  The biggest misconception you will face, and the one you warned about, is the conflation of epistemic structure with normative virtues like open-mindedness. Students will almost immediately object by saying that a good thinker should always check new evidence, but that misses the point of the paradox which is about the conditions of knowledge rather than the virtues of the knower. You need to head this off the moment the conclusion is stated by explicitly distinguishing between whether one is permitted to ignore evidence versus whether one retains knowledge while ignoring it. You should stop them and say that the argument is not claiming dogmatism is a good habit, but rather that the definition of knowledge seems to logically entail that we are insulated from counter-evidence, and the puzzle is whether we should accept that insulation or reject one of the premises that led to it. If you do not make this distinction early, the discussion will devolve into a debate about intellectual humility rather than staying focused on the closure principle and the nature of defeaters.

  To check whether they have actually grasped the paradox at the end of the hour, you should avoid asking general comprehension questions and instead force them to take a stance on the architecture of the argument. A good method is to ask them to write down for two minutes which of the three premises they would reject to solve the problem and why. If they understand the paradox, they will realize that rejecting factivity destroys knowledge, rejecting the entitlement to ignore known false evidence seems irrational, and rejecting closure undermines almost all inferential knowledge. You can then ask for a show of hands on which premise they sacrificed, and if they start suggesting solutions that involve changing the example rather than the logic, you will know they have retreated to the misconception that this is just about being stubborn. By forcing them to identify the breaking point in the logical chain, you ensure they leave with an understanding of why this is a structural problem for epistemology rather than just a warning against being closed-minded. I hope this helps you structure the session, and it sounds like it will be a really lively discussion.
