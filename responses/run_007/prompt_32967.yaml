prompt: |-
  I'm a retired chemist, and I've recently started reading philosophy of biology — new territory for me, so I'm leaning on a pop-science overview to get my bearings. There's a chapter on the adaptationism debate that summarizes Gould and Lewontin's spandrels paper, and something about the summary smells off, but I can't quite put my finger on where. Here's the gist of what the book says:

  Gould and Lewontin showed that a great many traits we'd assumed were adaptations aren't really adaptations at all. Their central image is the spandrels of San Marco: those triangular spaces between arches that look as if they were designed for the mosaics they carry, but are actually just architectural byproducts of mounting a dome on rounded arches. The biological moral, according to the book, is that most traits are like this — side effects of development that were never directly selected for, the human chin being one of their favorite examples. It also says spandrels often get co-opted later for new functions, and that this co-option, not selection, is the real engine behind complex features. The chapter's takeaway is that adaptionist explanations are untestable just-so stories, that Gould and Lewontin showed natural selection does much less explanatory work than developmental constraints and drift, and that whenever you hear an adaptive story about some trait, the spandrels paper gives you reason to think that story is probably wrong.

  I gather the paper is famous and also famously contested, but I don't know the biology or the philosophy well enough to judge whether this summary is fair. Could you go through it piece by piece and tell me what a careful defender of Gould and Lewontin would nod along with, what they'd call overstated or subtly wrong, and whether the chapter's final takeaway actually follows from what the paper argued? Please write your answer in American English.
