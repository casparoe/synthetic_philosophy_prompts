answer: |-
  # The Moral Worth Quiz: What Actually Counts?

  You know the feeling. You see someone do the right thing, but something feels "off" about *why* they did it. Or maybe they did the right thing for the wrong reason, and you can't decide if they deserve credit. Philosophers call this "moral worth." It's not about whether the act was good (saving the kid is good); it's about whether the *agent* gets moral credit for it.

  Below are nine short cases. Don't overthink them. Pick the answer that matches your gut reaction. At the end, we'll map your answers to five distinct philosophical "leaves."

  ***

  ### 1. The Grump
  Arthur sees a neighbor struggling with groceries. He hates the neighbor. He feels zero sympathy. But he thinks, "It is my duty to help," and so he carries the bags. He grumbles the whole time.
  *   **A.** This has high moral worth. He did it *because* it was right, despite his feelings.
  *   **B.** This has little to no moral worth. He lacks the right care or concern.
  *   **C.** He did the right thing. The "worth" of his inner state is irrelevant.

  ### 2. The Soft Heart
  Beatrice sees the same neighbor. She immediately feels a pang of sympathy. She helps without ever thinking, "I ought to do this." It never crosses her mind that it might be optional.
  *   **A.** This has little moral worth. She didn't choose the right; she just followed a feeling.
  *   **B.** This has high moral worth. She acted from genuine concern for the person.
  *   **C.** She did the right thing. The "worth" of her inner state is irrelevant.

  ### 3. The Debtor's Wallet
  Carlos finds a wallet. He returns it, but only because he misreads the ID. He thinks the owner is someone he owes money to. He wants to repay a debt. In reality, he doesn't owe them anything; he's just returning lost property.
  *   **A.** No moral worth. His reason (debt) doesn't match the truth (ownership).
  *   **B.** Some moral worth. He was trying to be honest, even if he got the facts wrong.
  *   **C.** He returned the wallet. The "worth" of his reasoning is irrelevant.

  ### 4. The Parrot
  Diana was raised to memorize rules: "Always tell the truth." She tells the truth automatically. If you ask her *why*, she says, "Because that's the rule." She doesn't understand *why* truth-telling matters.
  *   **A.** Low moral worth. She's just a rule-following machine without understanding.
  *   **B.** High moral worth. She has successfully internalized the right standards.
  *   **C.** She told the truth. The "worth" of her understanding is irrelevant.

  ### 5. The Habit
  Elias is generously disposed. When he sees a donation tin, he drops money in without stopping to think. It's a habit. He doesn't deliberate, he just acts.
  *   **A.** Low moral worth. Real moral value requires conscious choice.
  *   **B.** High moral worth. This shows his character is truly good, not just performative.
  *   **C.** He donated. The "worth" of his deliberation is irrelevant.

  ### 6. Huck Finn
  Frank is helping a friend escape from people who claim legal ownership of the friend. Frank sincerely believes helping is *wrong* (a sin/crime). He thinks he's going to hell. But he can't bear to see his friend suffer, so he helps anyway.
  *   **A.** No moral worth. He thinks he's doing wrong, so he can't be doing right.
  *   **B.** High moral worth. He responded to the actual human need, ignoring his bad rules.
  *   **C.** He helped the friend. The "worth" of his belief is irrelevant.

  ### 7. The Double-Motive
  Grace helps a stranger. She thinks, "This is my duty." But she also admits, "I would have helped anyway because I like feeling helpful." The duty thought was present, but not strictly necessary to make her move.
  *   **A.** The duty thought secures the moral worth, even if she had other reasons too.
  *   **B.** The extra feeling dilutes the moral worth; it's not pure enough.
  *   **C.** She helped. The "worth" of her motive mix is irrelevant.

  ### 8. The Actuary
  Henry saves a drowning child. He feels no panic or sympathy. He calculates: "The economic loss of this child's death outweighs the risk to my suit." He acts on this cost-benefit analysis.
  *   **A.** No moral worth. You can't calculate moral value like a business transaction.
  *   **B.** Some moral worth. He recognized the value of the life, even if coldly.
  *   **C.** He saved the child. The "worth" of his calculation is irrelevant.

  ### 9. The Struggle
  Iris wants to keep her money. She knows she should donate. She feels intense pain at the thought of giving it up. She forces herself to donate, sweating and shaking.
  *   **A.** High moral worth. Overcoming resistance shows the strength of her commitment to duty.
  *   **B.** Low moral worth. A truly good person wouldn't find the right thing so painful.
  *   **C.** She donated. The "worth" of her struggle is irrelevant.

  ***

  # The Scoring Key & Logical Map

  Don't just count your letters. The diagnostic power here is in the *pattern* of your answers. Below are the five "leaves" (positions) your answers likely map onto, followed by an analysis of the logical space your answers occupy.

  ### The Five Leaves

  **1. The Duty View (Mostly A on 1, 7, 9; Mostly B on 2, 5)**
  *   **Core Idea:** Moral worth comes from acting *because* the act is right.
  *   **Why you're here:** You gave credit to Arthur (The Grump) and Iris (The Struggle). You likely downgraded Beatrice (The Soft Heart) because feelings are fickle, and Elias (The Habit) because he didn't choose.
  *   **Philosophical Home:** Kantian Deontology.

  **2. The Good-Motive View (Mostly B on 1, 2, 8; Mostly A on 6)**
  *   **Core Idea:** Moral worth comes from the right kind of emotional concern (compassion, love, sympathy).
  *   **Why you're here:** You rewarded Beatrice (Sympathy) and Frank (Huck Finn). You likely penalized Arthur (The Grump) and Henry (The Actuary) for lacking warmth.
  *   **Philosophical Home:** Sentimentalism / Care Ethics.

  **3. The Right-Reasons View (Mostly B on 3, 6, 8; Mixed on 1)**
  *   **Core Idea:** Moral worth comes from responding to the *features that actually make the act right* (e.g., "this person is in need"), regardless of whether you label it "duty" or "feeling."
  *   **Why you're here:** You gave credit to Frank (Huck Finn) because he responded to the *need*, even though he thought it was wrong. You might give Henry (The Actuary) partial credit if his calculation acknowledged the value of life. You penalized Carlos (The Debtor) because his reason (debt) didn't match the right-making feature (ownership).
  *   **Philosophical Home:** Moral Realism / Reasons-Responsiveness.

  **4. The Virtue/Character View (Mostly B on 4, 5, 9; Mostly A on 2)**
  *   **Core Idea:** Moral worth is about what the act reveals about your stable character. Habits count; struggle indicates a flaw in character.
  *   **Why you're here:** You rewarded Elias (The Habit) and Beatrice (The Soft Heart). You likely penalized Iris (The Struggle) and Arthur (The Grump) because if they were truly virtuous, doing good wouldn't be so hard.
  *   **Philosophical Home:** Aristotelian Virtue Ethics.

  **5. The Deflationary/Act-Only View (Mostly C on everything)**
  *   **Core Idea:** "Moral worth" is a metaphysical ghost. All that matters is that the right thing got done.
  *   **Why you're here:** You consistently chose Option C. You think probing the agent's soul is a distraction from the outcome.
  *   **Philosophical Home:** Consequentialism (some forms) / Error Theory.

  ***

  ### The Logical Map: What Your Combinations Mean

  This quiz isn't just a personality test; it maps the logical space of moral theory. Here is where the positions clash, where they blur, and where the empty rooms are.

  #### 1. The Indistinguishable Leaves (Good-Motive vs. Virtue)
  If you scored high on **Good-Motive** and **Virtue**, you aren't necessarily confused. These views blur in practice.
  *   **The Blur:** It is hard to have "spontaneous sympathy" (Good-Motive) without having a "generous character" (Virtue).
  *   **The Separation Test:** Look at **Case 5 (The Habit)** and **Case 9 (The Struggle)**.
      *   If you gave worth to the Habit but denied it to the Struggle, you are a **Virtue Theorist**.
      *   If you denied the Habit (no choice) but awarded the Struggle (choice against inclination), you are a **Duty Theorist**.
      *   If you can't decide between them, your intuition likely merges Motive and Character. This is a coherent position, but it makes separating "feeling" from "disposition" difficult.

  #### 2. The Empty Cell (The "Mindless Rule" Paradox)
  *   **The Combination:** Awarding worth to **Case 4 (The Parrot)** but denying it to **Case 5 (The Habit)**.
  *   **Status:** **Incoherent / Empty.**
  *   **Why:** Both agents act without understanding. The Parrot follows a memorized rule; the Habit follows a trained disposition. If you think understanding is required for worth, you must reject *both*. If you think understanding isn't required, you should accept *both* (or at least not sharply distinguish them). A viewer who accepts the Parrot but rejects the Habit occupies a logical space that is rarely defended: valuing external authority over internal character, without requiring comprehension for either.

  #### 3. The Tension Point (Duty vs. Right-Reasons)
  *   **The Combination:** Awarding worth to **Case 1 (The Grump)** but denying it to **Case 6 (Huck Finn)**.
  *   **Status:** **Possible but Costly.**
  *   **Why:** This is the standard **Duty View**. However, it forces you to say that Frank (Huck), who saved a human being from suffering, has *less* moral worth than Arthur, who carried groceries grumpily.
  *   **The Logical Cost:** To hold this, you must believe that acting on a *true belief about duty* is more valuable than acting on the *actual right-making features of the world* (suffering). Many philosophers find this "fetishizing" duty. If you find this result repulsive, you likely lean toward **Right-Reasons**.

  #### 4. The Overdetermination Trap (Case 7)
  *   **The Combination:** Awarding worth to **Case 1 (Grump)** but denying it to **Case 7 (Double-Motive)**.
  *   **Status:** **Unattractive / Rare.**
  *   **Why:** This implies that having *extra* reasons to do good (liking to help) contaminates the moral worth of doing your duty. This is the "purity test." Most modern views reject this. If you passed the Grump but failed the Double-Motive, you hold a very strict, perhaps rigid, version of the Duty View that views human psychology with suspicion.

  #### 5. The Deflationary Dead End
  *   **The Combination:** Choosing **Option C** on **Case 3 (The Debtor)** and **Case 8 (The Actuary)**.
  *   **Status:** **Coherent but Deflationary.**
  *   **Why:** If you say "He returned the wallet, that's enough" (Case 3) and "He saved the kid, that's enough" (Case 8), you have successfully eliminated "moral worth" from your vocabulary.
  *   **The Logical Consequence:** You cannot distinguish between a saint and a lucky accident. If a gust of wind blew the wallet back to the owner, your view treats that the same as Carlos returning it. If you are comfortable with that, you are a pure Act-Evaluator. If that makes you uncomfortable, you *need* a theory of worth (Duty, Motive, or Reasons).

  ### Final Diagnostic
  *   **If you found Case 6 (Huck Finn) the hardest:** You are likely torn between **Duty** (he thought he was wrong) and **Right-Reasons** (he did the right thing). This is the central battleground of modern meta-ethics.
  *   **If you found Case 9 (The Struggle) the hardest:** You are torn between **Duty** (struggle proves commitment) and **Virtue** (struggle proves bad character). This is the battleground between Kant and Aristotle.
  *   **If you found Case 8 (The Actuary) the hardest:** You are torn between **Right-Reasons** (he valued the life) and **Good-Motive** (he lacked warmth).

  There is no "correct" score. But if your answers put you in an "Empty Cell," you might want to check if you're holding two intuitions that can't live in the same house.
