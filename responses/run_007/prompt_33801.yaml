prompt: |-
  In my country's public healthcare system, a government agency decides which treatments to fund by calculating how many "quality-adjusted life years" (QALYs) each treatment would produce. A year of life in full health counts as 1 QALY; a year with a serious condition counts as a fraction of that. The agency then funds the treatments that produce the most QALYs per dollar. This seems to involve two different kinds of comparison. On the one hand, the system treats a QALY as interchangeable across people — a QALY gained by one patient counts the same as a QALY gained by another, which looks like an interpersonal comparison of well-being. On the other hand, the system assigns QALY weights by asking samples of the general public how they would rate hypothetical health states, rather than by looking at how actual patients experience those states — which looks like an attempt to avoid relying on the subjective experiences of particular individuals.

  What theory of welfare, and of interpersonal comparability, does this practice presuppose? Does it coherently combine the claim that we can compare well-being across people with the claim that we should not ask those people directly? And what would have to change in the agency's methodology if we adopted a view that interpersonal utility comparisons are impossible, or a view that only the individual's own report of their well-being is authoritative?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** Public healthcare system using QALYs (Quality-Adjusted Life Years) for funding decisions.
      *   **Mechanism:**
          1.  1 year full health = 1 QALY; impaired health = fraction.
          2.  Funding goes to treatments with highest QALYs per dollar (cost-effectiveness).
          3.  QALYs are interchangeable across people (Person A's QALY = Person B's QALY).
          4.  QALY weights come from general public surveys on hypothetical states, *not* actual patient experiences.
      *   **Questions:**
          1.  What theory of welfare does this presuppose?
          2.  What theory of interpersonal comparability does this presuppose?
          3.  Does it coherently combine comparability with not asking the people involved?
          4.  What changes would be needed if:
              *   (a) Interpersonal utility comparisons (IUCs) are impossible?
              *   (b) Only individual self-reports are authoritative?

  2.  **Analyze Question 1: Theory of Welfare:**

      *   *Observation:* QALYs measure "health status" adjusted by "quality."
      *   *Welfare Theory:* Is it Hedonism (pleasure/pain)? Preference Satisfaction? Objective List?
      *   *Analysis:* QALYs generally align with **Preference Satisfaction** (specifically, preferences over health states) or a specific form of **Objective List** (health functioning is the good). However, since the weights come from public preference ("how bad would this be?"), it leans heavily towards **Social Preference Utilitarianism** or a **Welfarist** framework where "utility" is defined by health-related quality of life.
      *   *Nuance:* It's not pure hedonism because a patient might adapt to a disability (hedonic adaptation) and report high happiness, but the QALY weight remains low based on public perception of the *condition*. So, it treats health functioning as a proxy for welfare, independent of actual subjective happiness. This is closer to an **Objective Good** view (health is good) measured by **Social Valuation**.
      *   *Refinement:* It presupposes a form of **Welfarism** (consequences matter, welfare matters) but defines welfare objectively (health states) rather than subjectively (felt experience).

  3.  **Analyze Question 2: Theory of Interpersonal Comparability:**

      *   *Observation:* A QALY for Person A = A QALY for Person B.
      *   *Theory:* This is **Cardinal Utility** with **Full Interpersonal Comparability**. It assumes a common metric exists and is measurable across individuals.
      *   *Specific Term:* This is often called "Unit Comparability" or "Full Comparability" in social choice theory. It treats utility as a measurable quantity like liters of water.

  4.  **Analyze Question 3: Coherence of Comparability vs. Ignoring Subjective Experience:**

      *   *The Tension:* The system compares well-being across people (requires a common metric) but derives that metric from *third-party* judgments (general public) rather than *first-party* experiences (patients).
      *   *Is it Coherent?*
          *   *Argument for Coherence:* If welfare is about "health capability" or "normal functioning" (Objective List), then the public's view on what constitutes a loss of function is valid. It avoids the "adaptation problem" (where patients lower expectations). It treats health as a social good.
          *   *Argument against Coherence:* If welfare is subjective (how good life *feels*), then ignoring the patient is a category error. The public suffers from "focusing illusions" (overestimating the misery of disability).
          *   *Synthesis:* The system presupposes **Paternalistic Welfarism** or **Social Valuation of Health**. It claims coherence by defining welfare *not* as experienced happiness, but as the possession of health capabilities valued by society. It's coherent *if* you accept that health value is objective/social, not subjective/individual.

  5.  **Analyze Question 4: Methodological Changes under Alternative Views:**

      *   *Scenario A: Interpersonal Utility Comparisons (IUCs) are impossible.*
          *   *Implication:* We cannot sum QALYs across people. We cannot say "Saving A is better than Saving B."
          *   *Methodology Change:* Move away from Maximizing Total QALYs (Utilitarianism).
          *   *Alternatives:*
              *   **Pareto Principle:** Only fund if someone gains and no one loses (hard in budget constraints).
              *   **Fair Innings/Equity:** Prioritize the worst off regardless of total gain.
              *   **Random Lottery:** Treat all claims as incommensurable.
              *   **Procedural Justice:** Focus on fair decision-making processes rather than outcome metrics.
              *   *Practical outcome:* The QALY maximization engine breaks. You might need a voting system or a rights-based approach.

      *   *Scenario B: Only Individual Self-Reports are Authoritative.*
          *   *Implication:* The public cannot value the patient's health state. Only the patient knows their utility.
          *   *Methodology Change:* Weights must come from **Time Trade-Off (TTO)** or **Standard Gamble (SG)** exercises performed by *actual patients*, not the public.
          *   *Problem:* Adaptation. Patients often rate their quality of life much higher than the public expects (Disability Paradox).
          *   *Result:* Treatments for severe disabilities might look *more* cost-effective (because patients report high QoL), or *less* (if they value life extension less). But crucially, the *source* of the data shifts from "societal preference" to "experienced utility."

  6.  **Drafting the Response:**

      *   *Introduction:* Define the QALY framework clearly.
      *   *Section 1: Welfare & Comparability.* Identify Welfarism (broadly) but specifically **Objective Welfarism** or **Capability Approach** lite. Identify Comparability as **Cardinal and Fully Interpersonally Comparable**.
      *   *Section 2: Coherence Check.* Discuss the "Decision Utility" vs. "Experienced Utility" distinction. Explain why the agency does this (avoiding adaptation bias) and the philosophical cost (paternalism). It is coherent *internally* but controversial *externally*.
      *   *Section 3: Alternative View 1 (No IUCs).* Discuss the collapse of Cost-Effectiveness Analysis. Mention Social Choice Theory impossibility theorems (Arrow). Suggest procedural fairness or equity weights.
      *   *Section 4: Alternative View 2 (Subjective Authority).* Discuss the shift to patient-reported outcomes (PROs). Mention the "Disability Paradox." Discuss implications for funding (might shift resources away from severe disabilities if patients adapt well, or towards them if life extension is valued highly).
      *   *Conclusion:* Summarize the trade-off between objective measurement for policy and subjective reality of living.

  7.  **Refining the Philosophy:**

      *   *Welfare:* Is it Utilitarianism? Yes, specifically **Health Maximization Utilitarianism**.
      *   *Comparability:* It assumes **Measurability** and **Comparability**.
      *   *The "Public vs. Patient" issue:* This is the distinction between **Decision Utility** (what we choose for others) and **Experienced Utility** (what it feels like). The agency prioritizes Decision Utility for the sake of a stable currency.
      *   *Key Philosophers/Concepts:* John Harsanyi (utilitarianism), Amartya Sen (Capability approach critique of QALYs), Daniel Kahneman (Experienced vs. Decision Utility), The "Disability Paradox."

  8.  **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure not to say QALYs *are* the Capability Approach. Sen actually criticized QALYs for being too narrow. QALYs are more welfarist but with an objective proxy.
      *   *Nuance:* Acknowledge that "Impossible IUC" doesn't mean *do nothing*, it means *change the aggregation rule*.
      *   *Nuance:* Acknowledge that "Patient Self-Report" creates its own problems (adaptive preferences).

  9.  **Final Polish:** Organize with clear headings. Ensure tone is analytical and philosophical. (Proceed to generate output based on these thoughts.)

      *   *Structure:*
          1.  Intro: The QALY mechanism.
          2.  Welfare Theory: Welfarism + Objective Proxy.
          3.  Comparability: Cardinal & Unit Comparability.
          4.  Coherence: Decision vs. Experienced Utility.
          5.  Scenario A: No IUCs (Procedural/Equity).
          6.  Scenario B: Subjective Authority (Patient Weights).
          7.  Conclusion.

  10. (Final review of prompt requirements): Did I answer all parts?
      *   Theory of welfare? Yes.
      *   Theory of comparability? Yes.
      *   Coherence of the combination? Yes.
      *   Changes for "IUC impossible"? Yes.
      *   Changes for "Individual authoritative"? Yes.

      *Ready to write.*
answer: |-
  The practice you describe is a classic example of applied normative economics and bioethics. To analyze it, we must unpack the philosophical assumptions embedded in the QALY (Quality-Adjusted Life Year) framework, specifically regarding how it defines "goodness" and how it measures that goodness across different human beings.

  ### 1. Theories of Welfare and Comparability

  **Theory of Welfare: Objective Welfarism (or "Health Maximization")**
  Strictly speaking, the QALY system presupposes a form of **Welfarism**—the view that the goodness of a state of affairs depends entirely on the welfare (utility) of the individuals involved. However, it is not a *subjective* welfarism (like hedonism, which tracks pleasure/pain, or mental-state utilitarianism).

  Instead, it relies on a form of **Objective Welfarism** or a **Preference-Satisfaction** view constrained by an objective metric. By defining welfare in terms of "health states" rather than "happiness" or "life satisfaction," the agency treats health functioning as a proxy for well-being. It assumes that there is an objective fact about how "good" a year with blindness is, independent of whether a specific blind person reports feeling happy. This aligns closely with what philosophers call **Decision Utility** (the value assigned to an outcome when choosing) rather than **Experienced Utility** (the actual phenomenological quality of the outcome).

  **Theory of Interpersonal Comparability: Cardinal Unit Comparability**
  The system presupposes **Cardinal Unit Comparability**.
  *   **Cardinal:** It assumes welfare is measurable in quantities (0.5 QALYs, 1.0 QALYs), not just rankable (Treatment A is better than Treatment B).
  *   **Unit Comparability:** It assumes the "size" of one QALY is identical for everyone. A gain of 0.5 QALYs for a 20-year-old athlete is treated as mathematically equivalent to a gain of 0.5 QALYs for an 80-year-old with chronic pain.

  This is a strong metaphysical claim. It asserts that there is a common currency of human welfare that can be measured, standardized, and summed across different consciousnesses.

  ### 2. Coherence: Comparability vs. Ignoring Subjective Experience

  You ask if the system coherently combines the claim that we *can* compare well-being across people with the claim that we *should not* ask those people directly.

  **The Argument for Coherence:**
  The agency's methodology is coherent if one accepts the **Focusing Illusion** and **Adaptation Bias** arguments.
  1.  **Adaptation:** Actual patients often adapt to disabilities (the "Disability Paradox"). A paraplegic patient might report a quality of life weight of 0.9 (near perfect), while the general public rates paraplegia at 0.6. If the agency used patient reports, a treatment curing paraplegia would generate very few QALYs (moving from 0.9 to 1.0) and might never be funded compared to a treatment moving someone from 0.6 to 1.0.
  2.  **Social Valuation:** By using public weights, the agency treats health as a **social good** rather than a private feeling. It asserts that the "loss" of a health function is a fact about the human condition, not just a fact about one person's psychology.

  Under this view, the system is coherent because it defines welfare as **capability** or **functioning** (similar to Amartya Sen's Capability Approach, though Sen himself criticized QALYs for being too narrow). It claims: "We can compare people because we are comparing their health assets, not their fleeting emotions."

  **The Argument Against Coherence:**
  The system is incoherent if one holds that welfare is essentially **phenomenological**. If well-being is "how good life feels to the one living it," then bypassing the patient is a category error. The public suffers from an "empathy gap"; they imagine the *onset* of disability (which is traumatic) rather than the *state* of disability (which is often manageable). By prioritizing public perception over patient experience, the agency may be maximizing "imagined welfare" rather than "actual welfare."

  **Verdict:** The practice is internally coherent *only if* one rejects subjective hedonism in favor of an objective or social-preference theory of value. It resolves the tension by redefining "well-being" as "possession of health capabilities valued by society."

  ### 3. Methodological Changes Under Alternative Views

  If we change the underlying philosophical assumptions, the agency's methodology must change drastically.

  #### Scenario A: Interpersonal Utility Comparisons (IUCs) are Impossible
  This view (often associated with Lionel Robbins or strict Paretian economics) holds that there is no scientific way to verify if my "unit" of pain is equal to your "unit" of pain.

  **Methodological Changes:**
  1.  **Abolition of QALY Maximization:** You cannot sum QALYs across people to find a "greatest good." The cost-effectiveness ratio (Cost/QALY) becomes meaningless.
  2.  **Shift to Procedural Justice:** Since outcomes cannot be objectively ranked, the legitimacy of decisions must come from the *process*. The agency would need to move toward **Accountability for Reasonableness** (transparent deliberation, stakeholder representation) rather than algorithmic calculation.
  3.  **Equity Constraints:** Instead of maximizing total health, the system might adopt a **Prioritarian** or **Sufficientarian** approach. For example: "Fund treatments for the worst-off first, regardless of total QALY gain," or "Ensure everyone reaches a minimum threshold of health."
  4.  **Voting or Market Mechanisms:** If utility cannot be compared by experts, the system might rely on democratic voting on health priorities or a voucher system where individuals choose their own coverage, acknowledging that value is subjective and non-comparable.

  #### Scenario B: Only Individual Self-Reports are Authoritative
  This view (Subjective Welfarism) holds that the individual is the sole sovereign of their own well-being. If a patient says their life with a condition is 9/10, the state cannot overrule them and say it is 6/10.

  **Methodological Changes:**
  1.  **Patient-Derived Weights:** The agency must stop surveying the general public. Weights for health states must be derived from **Time Trade-Off (TTO)** or **Standard Gamble** exercises conducted *only* with people currently experiencing those conditions.
  2.  **Handling Adaptation:** This creates a funding paradox. Because patients adapt, chronic conditions will be rated as having high quality of life. Consequently, treatments for those conditions will yield *fewer* QALYs (the gap between current state and full health is small).
      *   *Result:* Funding might shift *away* from chronic disability management and *toward* acute conditions where the gap between "sick" and "healthy" is perceived as larger by the patient.
  3.  **Heterogeneous Valuation:** The agency would have to acknowledge that a QALY is not standard. A QALY for Patient A (who values mobility highly) is not the same as a QALY for Patient B (who values cognitive function highly). The calculation would need to become **Personalized Cost-Effectiveness Analysis**, which is administratively burdensome but philosophically consistent with subjective authority.
  4.  **Respect for Refusal:** If a patient reports that a life-extending treatment lowers their quality of life (e.g., aggressive chemotherapy), the system must record that as a negative QALY gain, even if the public views survival as an absolute good.

  ### Summary

  The current QALY system presupposes **Objective Welfarism** and **Cardinal Unit Comparability**. It maintains coherence by treating health as a social asset valued by the collective, rather than a private experience valued by the individual.

  *   If **Comparability is Impossible**, the agency must abandon the math of maximization and adopt **procedural fairness** or **equity-based rules**.
  *   If **Subjective Authority is Paramount**, the agency must switch to **patient-reported weights**, accepting that this will likely de-prioritize treatments for conditions to which patients have successfully adapted.

  The tension you identified lies at the heart of public policy: the need for a standardized currency to allocate scarce resources (which requires objectivity and comparability) versus the moral reality that well-being is lived subjectively (which requires deference to individual experience). The QALY system solves this by prioritizing the former at the expense of the latter.
