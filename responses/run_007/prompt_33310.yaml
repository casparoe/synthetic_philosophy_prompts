      *   The passage treats Functionalism as almost dualistic (Claim 3), which makes Claim 6 easier to swallow. A materialist functionalist has to work harder to justify Claim 6 without falling into property dualism.
      *   The passage ignores the distinction between *Role* and *Filler*.
      *   The passage ignores the "Absent Qualia" objection (Block).

  5.  **Drafting the Response:**
