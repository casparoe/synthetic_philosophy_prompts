      *   **Specific Focus:** Does the final claim (any system with right causal roles has mental states) follow from the accurate parts, or does it rely on questionable steps?
      *   **Conclusion:** An overall verdict on whether the gloss is fair.

  2.  **Deconstruct the Passage into Claims:**
      *   *Claim 1:* "The brain is just hardware, and the mind is the software running on it." (Analogy)
      *   *Claim 2:* "Pain, for example, cannot be identical to any particular kind of neural state, because humans, octopuses, and hypothetical Martians can all be in pain even though their nervous systems are built completely differently." (Multiple Realizability Argument)
      *   *Claim 3:* "Since the same mental state can be realized in endlessly many different physical structures, it cannot be a physical state at all." (Inference to Non-Identity/Non-Physicalism)
      *   *Claim 4:* "What all these realizers share is not their physical composition but their causal role — being produced by tissue damage and producing avoidance behavior..." (Definition of Functional Role)
      *   *Claim 5:* "...so pain is nothing over and above that causal role." (Functional Definition)
      *   *Claim 6:* "That is why functionalists conclude that any system whose internal states play the right causal roles, whatever it is made of, has the very same mental states we do." (Liberalism/Universalism Conclusion)

  3.  **Evaluate Each Claim (Drafting the Audit):**

      *   *Claim 1 (Hardware/Software):*
          *   *Status:* Standard simplification/Analogy.
          *   *Nuance:* Functionalists like Putnam and Fodor used this, but it's an analogy, not an ontology. Some functionalists (e.g., psychofunctionalists) might find it too crude. It suggests a dualism (hardware vs. software) that might confuse token physicalism.
          *   *Verdict:* Acceptable heuristic, but technically imprecise.

      *   *Claim 2 (MR Argument):*
          *   *Status:* Accurate core argument.
          *   *Nuance:* This is the classic Putnam-style argument against Type Identity Theory. Humans, octopuses, Martians is the standard triad.
          *   *Verdict:* Accurate.

      *   *Claim 3 ("Cannot be a physical state at all"):*
          *   *Status:* **Problematic/Overstatement.**
          *   *Nuance:* This is the biggest red flag. Functionalism is usually compatible with *token* physicalism. It denies *type* identity (pain = C-fiber firing), but it doesn't necessarily deny that every *instance* of pain is physical. Saying it "cannot be a physical state at all" sounds like property dualism or Cartesianism. Functionalism is typically a materialist theory. It says mental states aren't *reducible* to specific physical types, not that they aren't physical tokens.
          *   *Verdict:* Misrepresentation/Overstatement. Risks implying dualism.

      *   *Claim 4 (Causal Role):*
          *   *Status:* Accurate core definition.
          *   *Nuance:* "Tissue damage -> avoidance" is a very simplistic input-output description. Careful functionalists (like Lewis or Fodor) talk about relations to *other mental states* (beliefs, desires) too, not just sensory input and behavioral output. This is "Black Box" functionalism vs. "Homuncular" or "Psychofunctionalism."
          *   *Verdict:* Standard simplification, but misses the inter-state relations.

      *   *Claim 5 ("Nothing over and above"):*
          *   *Status:* Accurate functionalist stance.
          *   *Nuance:* This defines the ontological reduction. If you accept the causal role definition, this follows.
          *   *Verdict:* Accurate relative to the theory.

      *   *Claim 6 (Any system... has the very same mental states):*
          *   *Status:* **Controversial/Non-sequitur based on previous steps.**
          *   *Nuance:* This is the "Liberalism" objection (Block's China Brain/Nation). Just because something plays the role *externally* doesn't mean it has *qualia* or internal states. Also, the jump from "not identical to neural state" to "any system" relies on the definition of the causal role being sufficient. If Claim 3 implies non-physicalism, Claim 6 makes sense. If Claim 3 is wrong (and functionalism is physicalist), Claim 6 requires more justification about *implementation*.
          *   *Verdict:* Follows from the *logic of the passage*, but the logic of the passage contains the error in Claim 3. Also, "very same mental states" ignores the Qualia objection (Inverted Spectrum, Absent Qualia).

  4.  **Synthesize the "Gap" Analysis:**
      *   The user suspects a move from "different brains" to "just causal role."
