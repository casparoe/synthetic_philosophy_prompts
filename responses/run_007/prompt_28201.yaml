answer: |-
  Here is a 40-minute session plan designed to isolate the structural problem of peer disagreement from personality traits or simple compromise.

  ### 1. The Sequence of Moves (0–40 Minutes)

  **0:00–0:10: Setup & Definitions (The "Peer" and The "Evidence")**
  *   **The Move:** Do not start with the disagreement. Start with the *agents*.
  *   **Action:** Write **"Epistemic Peer"** on the board. Define it simply: *Someone you judge to be equally likely to get the right answer as you are, given the same information.*
  *   **Crucial Distinction:** Write **"First-Order Evidence"** vs. **"Higher-Order Evidence."**
      *   *First-Order:* The evidence about the world (the math on the page, the witness testimony, the data).
      *   *Higher-Order:* Evidence about your own cognitive performance (the fact that you are tired, the fact that you drank alcohol, **the fact that a peer disagrees with you**).
  *   **Head Off Misconception #1 ("Open-minded vs. Stubborn"):** Explicitly state: *"This debate is not about personality. It is not about whether you are humble or arrogant. It is a debate about whether the fact of disagreement counts as a new piece of Higher-Order evidence that changes the total evidence set."*

  **0:10–0:20: The Carrying Case (The Restaurant Bill)**
  *   **The Move:** Use the classic "Mental Math" case (Elga/Kelly style). It is the only case that isolates the variables cleanly enough for a 40-minute session.
  *   **The Scenario:** You and a friend (who you know is equally good at mental math) split a bill. You calculate the share is $43. Your friend calculates it is $45. You have no reason to think one of you is distracted or drunk. You both saw the same numbers.
  *   **The Question:** How confident should you be that $43 is correct *after* hearing their answer, but *before* re-checking the math?
  *   **Why this case:** It removes bias, emotional stakes, and differences in expertise. It forces the disagreement itself to be the only new variable.

  **0:20–0:30: The Two Responses (Conciliationism vs. Steadfastness)**
  *   **The Move:** Present the views as responses to the *total evidence*.
  *   **Conciliationism:** The fact of disagreement is strong Higher-Order evidence that you made a mistake. You must significantly lower confidence (suspend judgment).
      *   **Head Off Misconception #2 ("Splitting the Difference"):** Explicitly state: *"Conciliationism does not mean you believe the answer is $44. It means you lower your confidence that $43 is right. It is about credence, not averaging claims."*
  *   **Steadfastness:** You have assessed the First-Order evidence (the math). The peer's disagreement is not strong enough to override your direct access to that evidence. You can retain confidence.
      *   **Head Off Misconception #3 ("Never Change Mind"):** Explicitly state: *"Steadfastness does not mean you ignore new First-Order evidence. If your friend says 'I saw a digit you missed,' you change your mind. Steadfastness says you don't have to change your mind *just* because they disagree."*

  **0:30–0:35: Settled vs. Contested (The Meta-Commentary)**
  *   **The Move:** Demarcate the boundary of the field.
  *   **Say this:** "Here is what is settled: Almost everyone agrees disagreement has *some* evidential weight. No serious philosopher thinks you can ignore a peer 100%."
  *   **Say this:** "Here is what is contested: *How much* weight? Does the disagreement 'cancel out' your evidence (Conciliationism), or does your original evidence still carry weight alongside the disagreement (Steadfastness)?"

  **0:35–0:40: Wrap & Final Question**
  *   **The Move:** Check structural understanding.
  *   **Action:** Ask the final question (see below).

  ---

  ### 2. What to Openly Leave Out (And Say So)

  To keep this to 40 minutes, you must explicitly tell them what you are excluding so they don't think these are counter-arguments you are ignoring.

  1.  **The Self-Defeat Argument:** Do not bring up the argument that "Conciliationism defeats itself because peers disagree about Conciliationism." Tell them: *"There is a famous argument that Conciliationism is self-refuting. We are ignoring that today to focus on the core intuition."*
  2.  **Domain Specificity:** Do not get into whether this applies differently to morality vs. math vs. science. Tell them: *"We are treating this as a general structural problem, though some argue the rules change depending on the subject matter."*
  3.  **Pre-existing Bias:** Do not discuss "echo chambers" or why we pick our peers. Tell them: *"We are assuming peerhood is already established. How we identify peers is a separate, messy problem."*

  ---

  ### 3. Settled vs. Contested (For the Board)

  Draw a line on the board.

  **Settled (General Consensus):**
  *   Peer disagreement provides *some* Higher-Order evidence.
  *   "Dogmatism" (ignoring the disagreement entirely) is irrational.
  *   Peerhood is relative to the specific topic (a peer in math isn't necessarily a peer in history).

  **Genuinely Contested (Live Dispute):**
  *   **The Uniqueness Thesis:** Does a body of evidence justify only one rational doxastic attitude? (Conciliationists usually say Yes; Steadfasters often say No/Permissivism).
  *   **The Weight of the Evidence:** Does the peer's disagreement *neutralize* your first-order evidence, or merely *counterbalance* it?
  *   **The Definition of Peer:** Does "equally likely to be right" mean "equally likely *in general*" or "equally likely *in this specific instance*"? (This is where the real technical fighting happens).

  ---

  ### 4. The Final Check Question

  Do not ask: *"Who do you think is right?"* (This invites them to just pick a side based on intuition).

  **Ask this instead:**
  > "If you are a Steadfast theorist, describe a specific scenario involving the Restaurant Bill case where you *would* lower your confidence. If you can't describe one, you aren't a Steadfast theorist; you're a dogmatist."

  **Why this works:**
  *   It forces them to articulate the *limits* of the Steadfast view.
  *   It confirms they understand that Steadfastness allows for belief revision based on *first-order* evidence (e.g., "My friend points out I missed a zero"), distinguishing it from stubbornness.
  *   If they struggle to answer, you know they haven't grasped the evidential structure and are still viewing it as a personality clash.
