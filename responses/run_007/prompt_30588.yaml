answer: |-
  You have identified a genuine and currently much-debated problem in contemporary epistemology. Your intuition that this sits near 'higher-order evidence' is correct, but as you note, that phrase names the *input* rather than the *predicament*.

  There is no single, universally agreed-upon noun for the specific psychological state you describe, but there are three established concepts that, when combined, delineate the boundaries of this predicament with precision. If you wish to name this state in your notes or discussions, the most accurate philosophical label is an **Epistemic Dilemma generated by an Undercutting Defeater**, often resulting in **Epistemic Akrasia**.

  Here is an account of the constituent parts, how they fit your pattern, and where the nuances lie.

  ### 1. The Mechanism: The Undercutting Defeater
  In epistemology, a 'defeater' is information that removes or reduces your justification for a belief. Philosophers (most notably John Pollock) distinguish between two types:
  *   **Rebutting Defeater:** Evidence that the conclusion is *false* (e.g., you think it is raining, but you look outside and see sun).
  *   **Undercutting Defeater:** Evidence that your *reasoning process* is unreliable, without implying the conclusion is false (e.g., you think it is raining because you hear a tapping sound, but then learn someone is tapping on the roof with a stick).

  Your characters are encountering **undercutting defeaters**. The sleep deprivation or the statistical failure of their reasoning style does not prove the marriage should be saved; it merely severs the link between their reasoning and the truth. This explains why the character cannot find a flaw in the argument itself: the flaw is not in the logic, but in the *machinery* producing the logic.

  ### 2. The State: Epistemic Akrasia
  'Akrasia' is the Greek term for weakness of will (acting against one's better judgement). **Epistemic Akrasia** is the doxastic (belief-related) equivalent: believing a proposition $p$ while simultaneously judging that one ought not believe $p$, or that believing $p$ is irrational.

  Your description captures the *approach* to akrasia perfectly. The character is in a transitional state where the first-order belief ('I should leave the marriage') retains its psychological force, but the higher-order judgement ('My judgement is currently compromised') forbids endorsement.
  *   **Where your cases differ:** Strict akrasia implies the character *holds* the belief despite knowing it is irrational. Your characters seem 'stuck'—unable to endorse but unable to discard. This is the *tension* of impending akrasia. Some philosophers argue this state is rationally forbidden (you cannot rationally be akratic); others argue it is an unavoidable consequence of receiving higher-order evidence.

  ### 3. The Deep Conflict: Internalism vs. Externalism
  This is the most profound philosophical layer of your predicament, and it may be the most useful for a novelist.
  *   **Internalism:** Justification depends on what is accessible to the mind. From the *inside*, the argument looks sound. The character has done their duty as a thinker.
  *   **Externalism:** Justification depends on the actual reliability of the process. From the *outside* (the view of the sleep deprivation facts), the process is broken.

  Your characters are trapped between an **Internalist perspective** (it feels right) and an **Externalist reality** (it is likely wrong). They are experiencing the friction between how reasoning *feels* and how reasoning *works*. This explains the 'stuckness': to abandon the conclusion feels like a betrayal of their own mind (Internalism), but to keep it feels like a betrayal of the truth (Externalism).

  ### The Verdict on Terminology

  If you are looking for the established academic label for the *situation*, it is **The Problem of Higher-Order Evidence**. Specifically, it is the debate over how one ought to respond to **undercutting defeaters** regarding one's own cognitive reliability.

  However, if you are looking for a name for the *phenomenological state*—the feeling of being divided against one's own mind—philosophy does not offer a single evocative noun. 'Epistemic Akrasia' is the closest technical term, but it is dry.

  **Proposal for Delineation**
  Since no single term captures the literary texture of this predicament, I propose you define it by its boundaries. It is distinct from:
  1.  **Ordinary Doubt:** In ordinary doubt, the first-order evidence itself becomes murky. In your cases, the first-order evidence remains clear; only the *trust* in the evaluator is compromised.
  2.  **Peer Disagreement:** As you noted, this is interpersonal. Your predicament is intrapersonal. It is a disagreement between the character's 'current self' and their 'metacognitive self'.
  3.  **Cognitive Dissonance:** Dissonance is a psychological discomfort caused by holding contradictory beliefs. Your predicament is normative; it is about *justification*, not merely comfort. The character isn't just uncomfortable; they are rationally paralysed.

  **A Suggested Name**
  If you require a label for your own use that honours the philosophy but suits a novelist's ear, you might consider **'Epistemic Vertigo'**.
  *Note:* The philosopher Bernard Williams used this phrase, though slightly differently (regarding the loss of confidence in truth itself). However, it captures the sensation you describe: the ground of one's own reasoning remains visible, but one feels dizzy because one knows the ground is unstable.

  Alternatively, **'Rational Impasse'** or **'The Defeater Bind'** accurately describes the structural inability to move forward or backward without violating a norm of rationality.

  ### Summary for Your Notes
  *   **The Evidence:** Higher-Order Evidence (specifically, about reliability).
  *   **The Logical Move:** Undercutting Defeater (attacks the process, not the conclusion).
  *   **The Conflict:** Internalist Justification (it looks right) vs. Externalist Reliability (it is wrong).
  *   **The State:** Epistemic Akrasia (or the tension preceding it).
  *   **The Predicament:** An Epistemic Dilemma where responding to one's evidence requires distrusting one's response to evidence.

  You have isolated a sophisticated epistemic crisis. It is the moment a thinking realises they are a biological machine that can malfunction, even when the output seems perfect. It is a profoundly modern anxiety, and while philosophy has mapped the coordinates, it has not yet claimed a exclusive name for the territory.
