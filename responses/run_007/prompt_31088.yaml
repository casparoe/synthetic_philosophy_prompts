answer: |-
  This is a sophisticated and well-observed problem that cuts to the heart of the tension between psychological and normative accounts of pragmatics. You have identified a gap between **speaker meaning** (which Grice defined strictly in terms of reflexive intentions) and **utterance meaning** (what the utterance conveys in context according to public norms).

  There is no single, universally canonical term for this in the classical Gricean literature, largely because Grice himself tied meaning inextricably to intention. However, in post-Gricean and contemporary pragmatics, this phenomenon is increasingly recognized and discussed. Below is a breakdown of the existing terminology, the theoretical frameworks that handle it best, and a proposal for how to classify it.

  ### 1. Terminology: What is it called?

  While you won't find this in Grice's *Logic and Conversation*, contemporary literature uses a few descriptors:

  *   **Unintentional Implicature:** This is the most common descriptive term in recent philosophy of language (e.g., in work by Don Fallis, Jennifer Saul, and others discussing misleading speech). It captures the fact that the implicature exists without the specific intention to convey it.
  *   **Inadvertent Implicature:** Similar to above, emphasizing the speaker's lack of awareness.
  *   **Objective Implicature:** Occasionally used to contrast with "subjective" (intention-based) meaning, highlighting that the inference is licensed by the objective features of the context and utterance.
  *   **Default Implicature (Levinsonian):** Stephen Levinson's theory of *Presumptive Meanings* comes closest to a technical classification. He argues that certain inferences (Generalized Conversational Implicatures) arise by default due to heuristics, regardless of specific speaker intention, unless cancelled. Your examples lean toward this, though they are context-sensitive (Particularized).

  ### 2. The Theoretical Tension: Intention vs. Commitment

  The difficulty you face arises because Grice's original framework is **psychological**, whereas the phenomenon you describe is **normative**.

  **The Strict Gricean View:**
  For a strict Gricean, if the speaker lacks the reflexive intention (the intention that the hearer recognize the intention), there is **no speaker meaning** and therefore **no conversational implicature**. A strict Gricean would classify your examples as:
  1.  **Hearer Error:** The hearer *thinks* there is an implicature, but they are mistaken.
  2.  **Self-Deception:** The speaker *did* intend it subconsciously but is denying it.

  However, as you note, this feels unsatisfactory. The hearer is being rational, and the speaker is being held responsible.

  **The Neo-Gricean / Normative View:**
  Most contemporary pragmatists resolve this by shifting from *mental states* to *public commitments*.
  *   **Kent Bach** distinguishes between *communicative intention* and *illocutionary commitment*. When you speak, you undertake a commitment to the consequences of your utterance in that context, even if you didn't mentally flag them.
  *   **Robert Brandom** and **John MacFarlane** (normative pragmatics) argue that meaning is constituted by norms of commitment and entitlement. By making a move in the "language game," you are committed to the inferences that follow, regardless of your private psychology.

  Under this view, the phenomenon is not an "implicature without meaning," but rather **implicature as a normative commitment distinct from psychological intention.**

  ### 3. Analysis of Your Examples

  **Case 1: The Lab Location (Relevance)**
  *   **Gricean Mechanism:** Maxim of Relevance. The visitor assumes the information is relevant to their goal (finding good labs).
  *   **The Gap:** The speaker is ignorant of the visitor's specific goal or the normative expectation that location info implies endorsement in this context.
  *   **Classification:** This is an **Unintentional Implicature generated by Contextual Pressure.** The speaker is conversationally responsible because a competent speaker *ought* to have known that providing location in response to a quality query implies endorsement. The speaker's ignorance of the norm does not negate the norm.

  **Case 2: The Quarterly Review (Quantity)**
  *   **Gricean Mechanism:** Maxim of Quantity (Say as much as is required). Withholding stronger praise implies stronger praise is unavailable.
  *   **The Gap:** The supervisor is ignorant of the *scalar norms* of review writing.
  *   **Classification:** This is a **Default Inference based on Scalar Implicature norms.** Even if the speaker didn't intend the scalar inference, the utterance triggers the heuristic: "If they didn't say 'excellent', it's not excellent." Levinson would argue this inference is generated by the utterance type and context automatically; the speaker's failure to cancel it ("...but not exceptionally so") makes it stick.

  ### 4. Distinguishing from Nearby Phenomena

  To carve this up precisely, you need to distinguish it from three neighbors:

  1.  **Vs. Hearer Over-interpretation:**
      *   *Distinction:* In over-interpretation, the inference violates the maxims or relies on idiosyncratic assumptions. In your cases, the inference is **rationally licensed** for any competent member of the linguistic community. The "reasonable hearer" test is the key.
  2.  **Vs. Accidental Misleading (Lying):**
      *   *Distinction:* Lying requires an intention to deceive. This phenomenon involves no intention to deceive, yet the hearer is misled. It is often discussed in the ethics of communication as **"misleading without lying."**
  3.  **Vs. Indirect Speech Acts:**
      *   *Distinction:* Searle's indirect speech acts (e.g., "Can you pass the salt?") usually rely on shared conventions that the speaker intends to invoke. Your cases lack the intention to invoke the convention, yet the convention applies.

  ### 5. Proposal for Classification

  If you are writing on this, I propose classifying this as **Normative Implicature** or **Committed Implicature**.

  **Definition:** A *Normative Implicature* is an inference that a hearer is licensed to draw based on the public norms of conversation (Cooperative Principle and Maxims) applied to an utterance-in-context, which the speaker becomes committed to by virtue of uttering it, regardless of whether the speaker possessed the specific reflexive intention to convey that content.

  **Why this helps:**
  1.  **Preserves Gricean Reasoning:** It acknowledges the hearer is using Gricean logic (Maxims) correctly.
  2.  **Solves the Intention Problem:** It decouples the *validity* of the implicature from the *psychology* of the speaker.
  3.  **Explains Responsibility:** It explains why the speaker can be held accountable ("You implied X!") even if they say "I didn't mean X!" The response is: "You *said* it, and in this context, that *means* X."

  ### 6. Does this refute Intention-Based Accounts?

  It does not necessarily refute them, but it forces them to expand.
  *   **Weak Intentionalism:** Might argue the speaker had a "dispositional" intention or that intention is not required for *utterance meaning*, only for *speaker meaning*.
  *   **Hybrid Accounts:** Suggest that communication relies on a mix of intention-recognition and norm-following.

  The phenomenon suggests that **communication is not merely a meeting of minds, but a participation in a normative structure.** When you speak, you enter a space of reasons. You are responsible for the inferences your words license, not just the thoughts in your head.

  ### Summary Recommendation

  If you need a term to use immediately:
  *   Use **"Unintentional Implicature"** for general description (it is the most recognizable in current literature).
  *   Use **"Normative Implicature"** if you want to emphasize the commitment/responsibility aspect.
  *   Cite **Stephen Levinson** (on default inferences) and **Kent Bach** (on communicative intention vs. commitment) as the theoretical anchors.

  This is not a bug in Gricean pragmatics; it is a feature of the shift from Grice's psychological focus to the normative focus of contemporary pragmatics. The speaker is ignorant of the norms, but the norms apply regardless.
