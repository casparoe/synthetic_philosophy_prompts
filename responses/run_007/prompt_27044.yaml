      4.  Inefficacy Objection: Valid on mechanics, invalid on norms.
      5.  Sponsors' Arguments: Generalization holds weight; Forced Labor is useful for complicity but imperfect.
      6.  Fiduciary Balance: Mission alignment justifies the cost.
