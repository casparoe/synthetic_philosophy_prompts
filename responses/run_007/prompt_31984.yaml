answer: |-
  # The Interpretive Decision Tree

  This decision tree is designed to locate your philosophical commitments regarding literary interpretation without presupposing knowledge of specific theorists or labels. It begins with the distinction between **meaning** (what the text says) and **significance** (what the text means *to us* or *for us*), a distinction famously articulated by E.D. Hirsch.

  Follow the path that best matches your intuitions about concrete cases.

  ---

  ## Root Node: The Stability of Meaning
  **Question 1:** Consider a poem written in 1850. Today, we read it as a powerful critique of colonialism, though there is no evidence the author cared about colonialism.
  *   **A:** The text *means* a critique of colonialism now, even if it didn't then. Meaning changes with context and value.
  *   **B:** The text's *meaning* is what the author/language meant in 1850. Our modern reading is its *significance* (relevance/value), not its meaning. Meaning is stable.

  *   **If you chose A:** Go to **Branch 2 (Dynamic Meaning)**.
  *   **If you chose B:** Go to **Branch 1 (Stable Meaning)**.

  ---

  ## Branch 1: Stable Meaning (The Hirschian Path)
  *You believe meaning is a fixed property distinct from its value or relevance to us.*

  **Question 2:** What fixes this stable meaning? Is the text primarily a **message from a person** or an **autonomous linguistic object**?
  *   **A (Message):** The text is an act of communication. The author's intention constrains what the text can mean. (e.g., If the author meant it as a joke, it cannot mean a tragedy).
  *   **B (Object):** The text is a public artifact. Once written, it belongs to the conventions of language, not the author's mind. (e.g., The "Intentional Fallacy").

  *   **If you chose A:** Go to **Question 3**.
  *   **If you chose B:** You arrive at **Conventionalism (Textualism)**.

  **Question 3:** How do we access the author's intention? Consider a case where the author's private diary says they meant *X*, but the public text clearly reads as *Y* to all competent speakers.
  *   **A (Private Mind):** The diary wins. The meaning is *X*, even if the text failed to convey it. The actual psychological state is the truth.
  *   **B (Public Evidence):** The text wins. The meaning is *Y*. We interpret based on what an ideal audience would *reasonably attribute* to the author, not what occurred in their private head.

  *   **If you chose A:** You arrive at **Actual Intentionalism**.
  *   **If you chose B:** You arrive at **Hypothetical Intentionalism**.

  ---

  ## Branch 2: Dynamic Meaning (The Post-Hirschian Path)
  *You believe meaning is not fixed, or that the distinction between meaning and significance is untenable.*

  **Question 4:** When meaning shifts or is constructed, what is the primary **goal** of interpretation?
  *   **A (Optimization):** The goal is to make the text the *best object it can be* (aesthetically, morally, or philosophically). We interpret to maximize value.
  *   **B (Phenomenology):** The goal is to describe *what happens to the reader*. Meaning is the event of reading, not a property of the object.

  *   **If you chose A:** You arrive at **Value-Maximizing Theory**.
  *   **If you chose B:** You arrive at **Reader-Response Theory**.

  ---

  ## The Leaves: Positions Defined

  ### 1. Actual Intentionalism
  *   **Core Commitment:** Meaning is identical to the author's actual, historical state of mind.
  *   **Key Claim:** A text means what the author willed it to mean. If the text fails to convey that, the interpretation should correct the text based on external evidence (diaries, letters).
  *   **Proponents:** E.D. Hirsch (in *Validity in Interpretation*), P.D. Juhl.

  ### 2. Hypothetical Intentionalism
  *   **Core Commitment:** Meaning is what an ideal audience would *hypothesize* the author intended, based on public evidence.
  *   **Key Claim:** We care about the author as a communicator, but we cannot privilege private evidence over public linguistic conventions. The "author" is a construct built from the text and context.
  *   **Proponents:** Jerrold Levinson, William Tolhurst.

  ### 3. Conventionalism (Textualism)
  *   **Core Commitment:** Meaning is determined solely by the public conventions of language and genre.
  *   **Key Claim:** The author's intention is irrelevant to the text's meaning (the "Intentional Fallacy"). The text is an autonomous object; meaning is a function of linguistic rules, not psychological states.
  *   **Proponents:** W.K. Wimsatt & Monroe Beardsley, Roland Barthes ("Death of the Author").

  ### 4. Value-Maximizing Theory
  *   **Core Commitment:** Interpretation is a constructive act aimed at presenting the work in its best light.
  *   **Key Claim:** We should not ask "what did this mean?" but "what is the most valuable meaning this can sustain?" Meaning is fluid and serves the goal of aesthetic or moral optimization.
  *   **Proponents:** Ronald Dworkin (in law/literature analogies), Richard Posner, some versions of Stanley Fish.

  ### 5. Reader-Response Theory
  *   **Core Commitment:** Meaning is an event that occurs in the reader's mind, not a property of the text.
  *   **Key Claim:** There is no "text" independent of the reader's experience. Interpretation should track the affective, temporal, or psychological experience of reading.
  *   **Proponents:** Stanley Fish ("Interpretive Communities"), Wolfgang Iser, Norman Holland.

  ---

  ## Logical Space Analysis

  ### Unoccupied Logical Spaces
  There are combinations of answers in this tree that are logically possible but philosophically unoccupied.

  1.  **The "Private Dynamic" Position (Branch 2 + Author Constraint):**
      *   *Commitment:* Meaning changes over time (rejects Hirsch), *but* it is still constrained by the author's actual psychology.
      *   *Diagnosis:* **Incoherent.** If the author's actual psychology constrains meaning, meaning is fixed at the moment of writing (since the author's past mental states cannot change). This position collapses back into Actual Intentionalism or requires a metaphysical belief that the author's mind evolves post-mortem.
  2.  **The "Value-Conventionalist" Position (Branch 1 + Branch 2A):**
      *   *Commitment:* Meaning is stable and determined by language conventions (Conventionalism), *but* the goal of interpretation is to maximize value (Value-Maximizing).
      *   *Diagnosis:* **Unattractive/Unexplored.** If meaning is fixed by convention, there is little room to "maximize value" without violating those conventions. This position creates a tension between the *method* (conventions) and the *goal* (value). Most who care about value (Branch 2) reject the idea that conventions fix meaning (Branch 1).

  ### Blurry Distinctions (Leaves that are hard to separate)
  The tree cannot cleanly separate the following pairs. The difference is often one of emphasis rather than logical kind.

  1.  **Hypothetical Intentionalism vs. Conventionalism:**
      *   *The Problem:* Both rely on public evidence and linguistic conventions. Both reject private diary evidence.
      *   *Why it's blurry:* Hypothetical Intentionalism claims to care about the *author* (as a hypothetical construct), while Conventionalism claims to care only about the *language*. In practice, "what an ideal audience would attribute to an author" often looks identical to "what the language conventions allow."
      *   *Diagnostic Limit:* Question 2 asks if the author constrains meaning. A Conventionalist says "No." A Hypothetical Intentionalist says "Yes, but only publicly." In many concrete cases, this yields the same interpretation.
  2.  **Value-Maximizing vs. Reader-Response:**
      *   *The Problem:* Both reject stable meaning. Both prioritize the reader's engagement over the author's command.
      *   *Why it's blurry:* Value-Maximizing treats the text as an *object* to be improved (Dworkin's "chain novel"). Reader-Response treats the text as a *stimulus* for an *event* (Fish's "affective fallacy"). However, maximizing the value of a text often requires describing a specific readerly experience, and describing a readerly experience often implies the text is valuable for causing it.
      *   *Diagnostic Limit:* Question 4 asks about the *goal* (optimization vs. description). However, many theorists argue you cannot optimize a text without describing how it works on a reader, making the leaves adjacent in practice.

  ### Additional Position Note: Critical Pluralism
  *   **Why it is not a leaf:** Critical Pluralism (the view that multiple, incompatible interpretations can be simultaneously valid) is not included as a terminal leaf because it is a **meta-position** that can apply to several leaves.
  *   **Placement:** A Pluralist could be a *Value-Maximizing Pluralist* (there are many ways to make the text good) or a *Reader-Response Pluralist* (there are many valid reading experiences). However, an *Actual Intentionalist* generally cannot be a Pluralist (the author cannot intend X and Not-X simultaneously). Therefore, Pluralism is a modifier that applies primarily to Branch 2, rather than a distinct branch of its own.
