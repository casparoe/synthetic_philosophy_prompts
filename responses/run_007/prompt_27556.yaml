  6.  **Drafting Section 3: What drives the disagreement (~100 words):**
      The disagreement centers on the definition of "reduction." Nagelians equate reduction with derivability plus ontological commitment; if the higher-level law follows from the lower-level, reduction is achieved. Non-reductive physicalists distinguish derivability from explanatory utility. They argue that reduction requires the preservation of explanatory power, not just logical entailment. Both sides agree on the physics: the derivation works, and multiple realizability exists. The conflict arises over whether explanatory autonomy is compatible with ontological reduction. Nagelians view autonomy as pragmatic, not metaphysical. Non-reductive physicalists view autonomy as evidence that higher-level kinds are distinct scientific categories. It is a dispute about whether explanation tracks ontology or pragmatic utility.

