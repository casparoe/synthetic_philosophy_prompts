  5.  **Drafting Section 2: The non-reductive physicalist case for autonomy (~150 words):**
      Despite successful derivation, the thermodynamic taxonomy remains explanatorily autonomous because the micro-details are irrelevant to the macro-pattern. The Ideal Gas Law is multiply realizable: helium atoms, nitrogen molecules, and hypothetical particles with different masses all obey the same equation provided they share specific statistical properties. Explaining why a steam engine works using particle collisions is computationally intractable and obscures the relevant causal structure—energy flow and equilibrium. The higher-level variables (pressure, temperature) carve nature at joints that remain stable across diverse micro-constitutions, whereas the lower-level description fractures this unity into disjunctive micro-states. Explanation requires citing the robust pattern, not the underlying substrate. Thus, while the lower-level theory ontologically grounds the higher-level, it cannot replace the higher-level vocabulary in explanation without losing generality. The autonomy stems from the fact that the *difference* in micro-constitution makes no *difference* to the macro-explanation, rendering the reduction explanatorily idle.

