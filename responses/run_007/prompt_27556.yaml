  Consider the Ideal Gas Law ($PV=nRT$) in classical thermodynamics, which relates pressure, volume, and temperature for diverse gases like helium, nitrogen, and argon. This higher-level generalization is derivable from lower-level statistical mechanics, which models gases as swarms of Newtonian particles obeying conservation laws. Bridge principles identify thermodynamic temperature with mean molecular kinetic energy and pressure with average momentum transfer per unit area. While the derivation holds strictly in the thermodynamic limit, the macroscopic variables remain multiply realizable: vastly different micro-constitutions (varying molecular masses, shapes, and interaction potentials) yield identical macroscopic behaviors. Consequently, engineers design engines using thermodynamic variables without referencing specific molecular structures, suggesting the higher-level taxonomy captures robust patterns invisible to the lower-level description, preserving explanatory autonomy despite derivational success.

  **The Nagelian case for reduction**
  The higher-level generalization is the Ideal Gas Law, stating that pressure times volume equals temperature times a constant. The lower-level theory is statistical mechanics, grounded in Newtonian particle dynamics. Nagel's conditions are met because the thermodynamic predicates are connected to mechanical predicates via bridge principles: temperature is defined as mean kinetic energy, and pressure as momentum flux. Crucially, the bridge laws are biconditionals, linking types to types. Given the statistical assumptions (ergodicity, large numbers), the macroscopic law is logically derivable from the microscopic laws plus these bridge principles. The derivation succeeds because the micro-constituents obey uniform physical laws regardless of chemical identity. This satisfies Nagel's requirement of connectability and derivability, showing that thermodynamic phenomena are nothing over and above statistical mechanical aggregates. The success hinges on the precise mathematical mapping between macro-variables and micro-averages, ensuring that every instance of the higher-level law corresponds to a specific configuration of the lower-level theory.

  **The non-reductive physicalist case for autonomy**
  Despite successful derivation, the thermodynamic taxonomy remains explanatorily autonomous because the micro-details are irrelevant to the macro-pattern. The Ideal Gas Law is multiply realizable: helium atoms, nitrogen molecules, and hypothetical particles with different masses all obey the same equation provided they share specific statistical properties. Explaining why a steam engine works using particle collisions is computationally intractable and obscures the relevant causal structure—energy flow and equilibrium. The higher-level variables (pressure, temperature) carve nature at joints that remain stable across diverse micro-constitutions, whereas the lower-level description fractures this unity into disjunctive micro-states. Explanation requires citing the robust pattern, not the underlying substrate. Thus, while the lower-level theory ontologically grounds the higher-level, it cannot replace the higher-level vocabulary in explanation without losing generality. The autonomy stems from the fact that the difference in micro-constitution makes no difference to the macro-explanation, rendering reduction explanatorily idle. Higher-level theory supports counterfactuals lower-level theory cannot generalize.

  **What drives the disagreement**
  The disagreement centers on the definition of "reduction." Nagelians equate it with derivability; if the higher-level law follows from the lower-level via bridge laws, reduction is achieved. Non-reductive physicalists distinguish derivability from explanatory utility, arguing reduction requires preserving explanatory power. Both agree on the physics: the derivation works, and multiple realizability exists. The conflict arises over whether explanatory autonomy is compatible with ontological reduction. Nagelians view autonomy as merely pragmatic. Non-reductive physicalists view it as evidence that higher-level kinds are distinct. It is a dispute about whether explanation tracks ontology or utility. Fundamentally, it concerns the primary goal of science.

  **How to break the symmetry**
  To break symmetry, modify the case so bridge principles fail for a subset of realizers. Suppose a gas exists where molecular interactions are so strong that the Ideal Gas Law fails, yet statistical mechanics applies. The Nagelian concedes reduction fails because the derivation requires ceteris paribus clauses varying by micro-constitution, breaking bridge laws. The non-reductive physicalist wins, as higher-level limits are defined by functional constraints. Alternatively, if micro-structure uniquely determined macro-behavior without statistical averaging, multiple realizability would vanish. The Nagelian wins, as the higher-level taxonomy would merely abbreviate lower-level details, destroying explanatory autonomy and then clearly validating the Nagelian model.
