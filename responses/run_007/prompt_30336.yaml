answer: |-
  You have hit on a very specific and actively debated topic in contemporary epistemology (the philosophy of belief and knowledge). You are right to distinguish this from standard irrationality and self-deception. In standard irrationality, the blind spot is hidden; in self-deception, the conflict is repressed. In the cases you describe, the conflict is **conscious and avowed.**

  Here is the breakdown of the name, the debate on rationality, and the philosophical camps.

  ### 1. Is there a name for this?

  The technical term for this is **Epistemic Akrasia** (sometimes called *Doxastic Akrasia*).

  *   **Akrasia** is the Greek term for "weakness of will." In ethics, it describes acting against your better judgment (e.g., "I know I shouldn't eat this cake, but I will").
  *   **Epistemic Akrasia** is the doxastic (belief-based) equivalent: **Believing $P$ while simultaneously judging that your evidence does not support $P$.**

  Your examples fit this definition perfectly:
  *   *"I know the stats say lose (judgment of evidence) but I believe they'll win (belief)."*
  *   *"I'm aware I'm being irrational (judgment of evidence) but I think he's corrupt (belief)."*

  There is a second concept that might explain the *mechanism* of what is happening, proposed by philosopher **Tamar Gendler**: **Alief**.
  Gendler argues that sometimes what we call "belief" is actually an **alief**. An alief is an automatic, associative, emotional state that can conflict with explicit belief.
  *   **Belief:** "This glass walkway is safe." (Based on evidence/engineering).
  *   **Alief:** "High up! Fall! Danger!" (Automatic association).
  *   **Application to you:** When you say, "I know I studied fine, but I *believe* I failed," Gendler might argue you don't actually *believe* you failed. You *believe* you passed, but you *alieve* failure (anxiety, gut feeling). However, since you are explicitly asserting the belief ("I think they'll win"), Epistemic Akrasia is the more precise label for the *state* you are describing.

  ### 2. Is it always irrational? (The Normative Question)

  This is where the literature gets heated. There is a principle called the **Enkratic Requirement** (from *enkrateia*, self-command), which states: *It is irrational to believe $P$ while believing that your evidence does not support $P$.*

  However, philosophers fall into different camps on whether this requirement is absolute.

  #### Camp A: The Strict Impermissivists (It is always irrational)
  Philosophers like **Sophie Horowitz** and **Declan Smithies** argue that epistemic akrasia is a fundamental failure of rationality.
  *   **The Argument:** Belief aims at truth. Your assessment of your evidence is your best guide to truth. To intentionally disconnect your belief from your evidence assessment is to sabotage your own cognitive goal.
  *   **The Verdict:** Your friend and your dad are being irrational. It doesn't matter that they *know* it; the fact that they do it anyway is the definition of epistemic dysfunction. It creates a "Moore's Paradox" style tension (similar to saying "It is raining, but I don't believe it").

  #### Camp B: The Fragmentation Theorists (It's a structural feature, not a bug)
  Philosophers like **David Lewis** or **Robert Stalnaker** might look at your "compartments" comment and take it literally. They argue that belief isn't one single list in your brain. It is **fragmented**.
  *   **The Argument:** We have different "belief boxes" for different contexts. You have a "Stats Box" and a "Fan Box." When you speak, you can access both, which allows you to say the contradictory sentence without your brain exploding.
  *   **The Verdict:** It's not necessarily "irrational" in a pathological sense; it's just how human cognition handles conflicting information streams. It becomes a problem only if the fragments bleed into each other inappropriately (e.g., betting money based on the Fan Box while pretending to use the Stats Box).

  #### Camp C: The Pragmatic/Exceptionalists (It can sometimes be okay)
  This addresses your specific question: *"Maybe you have reasons to distrust your own evidence-assessment that are hard to articulate."*
  Some philosophers argue there are narrow cases where epistemic akrasia is permissible, or at least understandable.
  *   **Self-Fulfilling Prophecies:** If believing you will pass the test actually calms you down enough to ensure you pass, then believing against the evidence has pragmatic utility. (This edges into **Pragmatic Encroachment**).
  *   **Higher-Order Evidence:** Sometimes your evidence says $P$, but you have a "hunch" (based on subconscious pattern recognition) that your evidence assessment is flawed. If you say, "The stats say lose, but I know this team's psychology better than the stats," that isn't akrasia—that's claiming **private evidence**.
  *   **Faith/Hope:** Some philosophers of religion distinguish between *belief* (evidence-based) and *faith* (commitment-based). If your dad says, "I believe he is corrupt," he might actually mean, "I am committing to acting *as if* he is corrupt until proven otherwise."

  ### 3. The Boundaries and Nuance

  You asked for the boundaries of the phenomenon. Here is how philosophers distinguish the case you noticed from similar states:

  **A. Akrasia vs. Recalcitrant Emotion**
  *   **Case:** You know the spider is harmless, but you feel fear.
  *   **Analysis:** This is not epistemic akrasia because fear is an emotion, not a belief. You aren't believing "The spider is dangerous." You are feeling fear.
  *   **Your Case:** If you say "I *feel* like they'll lose, but I *believe* they'll win," that is rational. If you say "I *believe* they'll win, despite evidence," that is akrasia. The boundary is whether you claim it as a truth-claim.

  **B. Akrasia vs. Skepticism about Evidence**
  *   **Case:** "The stats say lose, but stats are often wrong about this specific coach."
  *   **Analysis:** This is **not** akrasia. Here, your total evidence *does* support the belief. You are just weighing the "stats" lower than the "coach factor."
  *   **Your Case:** True akrasia requires that you admit, "All things considered, my evidence supports $\neg P$." If you can point to *any* reason (even a vague one) why the evidence might be flawed, you escape the charge of akrasia.

  **C. Akrasia vs. Hope**
  *   **Case:** "I know I probably failed, but I'm hoping I passed."
  *   **Analysis:** This is the most common escape hatch. Many philosophers argue that what your friend calls "belief" is actually **hope**. Hope does not require evidence. You can hope for things you know are unlikely.
  *   **The Boundary:** If your friend says, "I *know* they will win," that is akrasia. If they say, "I'm going to believe they win because it makes watching the game more fun," that is a pragmatic choice, not an epistemic claim.

  ### Summary of the Literature's View

  1.  **The Label:** It is **Epistemic Akrasia**.
  2.  **The Consensus:** Most epistemologists agree it is **pro tanto irrational** (irrational on its face). It violates the norm that belief should track evidence.
  3.  **The Dissent:** Some argue that because humans are not perfect logic machines, **fragmentation** makes this state stable and sometimes functionally useful (e.g., maintaining morale).
  4.  **The "Out":** Many philosophers will argue that if you look closely, the person isn't actually *believing* the proposition in the strict sense. They are **alieving** it (Gendler), **hoping** for it, or engaging in **pretense**.

  **Your specific intuition:** You asked if it can be okay because "you have reasons to distrust your own evidence-assessment that are hard to articulate."
  Philosophers call this **Intuition vs. Explicit Reasoning**. If you trust your intuition over your explicit stats, you are technically claiming your intuition *is* evidence. If you admit your intuition is *not* evidence but you believe anyway, you are in the realm of Epistemic Akrasia. The literature suggests that while this is technically epistemically "wrong" (it won't lead to truth), it might be **pragmatically right** (it leads to happiness, social bonding, or reduced anxiety).

  So, your dad isn't necessarily "crazy," but he is prioritizing **pragmatic rationality** (living comfortably with his worldview) over **epistemic rationality** (aligning with the truth). Philosophy generally views epistemic rationality as the default duty of a believer, but acknowledges we often break it for psychological survival.
