      *   *Is it about data?* Yes. What counts as data? For Dennett, heterophenomenology (third-person reports) is the data. For critics, first-person experience *is* the data.
      *   *Is it bedrock intuitions?* Yes. This is the biggest factor. The "intuition pump" wars. One side intuits that qualia are undeniable; the other intuits that the concept is incoherent.
      *   *Is there a hidden empirical question?* Maybe, but unlikely to settle the *philosophical* core. Neuroscience can show there's no single "theater," but it can't prove whether the resulting experience is "real" in the qualia-realist sense.

