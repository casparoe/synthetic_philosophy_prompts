      *   *Critics' Stance (e.g., Ned Block, David Chalmers, Thomas Nagel):* There is a "Hard Problem." Functional explanation isn't enough. Phenomenal consciousness (what it's like) is a distinct datum that *must* be explained, not explained away. Dennett is changing the subject.
      *   *The "Cartesian Theater" Charge:* Dennett says critics assume a place where it all comes together. Critics say, "No, we just say experience exists, not that there's a little man watching it." Dennett replies, "If you say experience has properties X, Y, Z, you're implicitly positing a viewer."

