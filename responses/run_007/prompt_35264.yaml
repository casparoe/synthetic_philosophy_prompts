answer: |-
  Your hunch is remarkably accurate. You have identified the core friction point: **a disagreement about the *explanandum* (what needs explaining) rather than just the *explanans* (the explanation itself).**

  However, calling it merely a disagreement about "what counts as an explanation" might understate the depth of the rift. This is one of the most entrenched stalemates in modern philosophy of mind. To diagnose it properly, we need to break it down into the specific layers of disagreement you asked about: verbal, empirical, intuitive, and methodological.

  Here is a diagnosis of the Dennett vs. Qualia Realist debate, why it is stuck, and what (if anything) could move it.

  ### 1. What kind of disagreement is this?

  It is not just one thing; it is a layered conflict.

  **A. It is a dispute about the Data (Phenomenology vs. Heterophenomenology)**
  This is the most concrete layer.
  *   **The Critics (Block, Chalmers, Searle):** The primary data of consciousness is the first-person experience itself. The "redness" of red is a datum that exists prior to any report or behavior. If your theory explains the behavior but leaves out the redness, you haven't explained the data; you've changed the subject.
  *   **Dennett:** First-person experience is not data; it is *opinion*. The only objective data we have is what people *say* about their experience (heterophenomenology). If a subject reports "it felt like a unified red flash," that report is the data. The brain processes that generated it might be fragmented and messy. To insist the experience *itself* was unified, despite the brain being fragmented, is to privilege the user-illusion over the machinery.

  **B. It is a clash of Bedrock Intuitions (Incoherence vs. Inconceivability)**
  This is the engine of the stalemate.
  *   **Dennett's Intuition:** The concept of "qualia" (as ineffable, intrinsic, private, directly apprehensible) is logically incoherent. It's like asking for a "married bachelor." You can't have a property that is purely private and yet causally effective. Therefore, when critics insist on qualia, they are clutching a contradiction.
  *   **The Critics' Intuition:** The existence of phenomenal consciousness is the one thing we cannot doubt. To deny it is "inconceivable." Even if Dennett proves the concept is philosophically messy, the *reality* of the feeling remains. Denying it feels like a form of insanity or bad faith.

  **C. Is it a Verbal Dispute?**
  Partially, but not trivially.
  When Dennett says "consciousness," he usually means a functional capacity for reporting, monitoring, and controlling behavior. When Block says "consciousness" (specifically P-consciousness), he means the phenomenal feel.
  However, it's not *just* verbal because both sides claim to be talking about the same obvious thing in the room. Dennett claims he is saving consciousness from mystery by redefining it; critics claim he is defining the mystery out of existence.

  **D. Is there a Hidden Empirical Question?**
  Not really. This is why neuroscientists have moved on.
  Neuroscience can tell us *where* and *when* processing happens. It supports Dennett's claim that there is no single "finish line" or "Cartesian Theater" in the brain (processing is parallel and distributed).
  *   **Dennett says:** "See? No theater, so no qualia."
  *   **Critics say:** "The lack of a theater just makes it *more* mysterious how these distributed signals result in a unified feel. You haven't explained the feel; you've just explained the wiring."
  Empirical data can constrain the theories, but it cannot settle the ontological status of the "feel."

  ### 2. The "Cartesian Theater" Straw Man Charge

  You mentioned the critics' claim that Dennett attacks a straw man. This is a crucial nuance.

  Critics say: "I don't believe there is a literal little man in my head watching a screen."
  Dennett replies: "You don't have to believe in a little man to be committed to the Theater. If you believe that there is a specific time when a stimulus *becomes* conscious, or that there is a specific content that is *definitely* experienced, you are positing a finish line. And if there is a finish line, there must be something that arrives there. That is the Theater."

  Dennett argues the Theater is a **structural commitment**, not necessarily a literal homunculus. If you believe your experience has a definite order that differs from the physical order of neural events, you are implicitly positing a place where that order is finalized. Dennett's "Multiple Drafts" model suggests there is no final draft.

  ### 3. Why has the debate stalled since the 90s?

  The debate is stuck because both sides are operating from different **Metaphilosophical Frameworks**.

  1.  **Strict Naturalism (Dennett):** Everything must be explicable in terms of physical causation and function. If "qualia" cannot be fitted into this framework, the concept of qualia must be discarded or revised. The intuition of "feel" is a cognitive illusion generated by the brain's user-interface.
  2.  **Phenomenal Realism (Critics):** The most certain fact of existence is experience. If Strict Naturalism cannot account for experience, then Strict Naturalism is incomplete (leading to Property Dualism, Panpsychism, or Mysterianism).

  They are talking past each other because they prioritize different constraints. Dennett prioritizes the integrity of physical science; the critics prioritize the integrity of the first-person perspective.

  ### 4. What would count as progress?

  If we want to move beyond the stalemate, we likely won't get there via a "knockout experiment." Progress will likely come from one of three avenues:

  **A. The "Illusionist" Turn (Refining Dennett)**
  Philosophers like Keith Frankish have updated Dennett's view into **Illusionism**. The argument is: We don't need to explain how qualia arise physically, because they don't exist. We only need to explain why the brain *thinks* it has qualia.
  *   *Progress condition:* If cognitive science can fully model the "user-illusion" mechanism (how the brain misrepresents its own states as having ineffable qualities), the demand for "qualia" might lose its grip. If we can explain the *judgment* of consciousness without the *reality* of consciousness, Dennett wins.

  **B. Predictive Processing and Active Inference (The Middle Ground)**
  Newer frameworks in neuroscience (Anil Seth, Andy Clark, Karl Friston) view the brain as a "controlled hallucination" machine. The brain predicts sensory input and updates based on error.
  *   *Progress condition:* This dissolves the inner/outer boundary. If perception is essentially a hallucination that is constrained by reality, the distinction between "real qualia" and "functional representation" blurs. This might make Dennett's view more palatable without requiring hard eliminativism. It reframes consciousness not as a "thing" but as a specific kind of regulatory process.

  **C. Pragmatic Dissolution (Rorty/Wittgenstein style)**
  We might conclude that the debate is a "language game" that has outlived its usefulness.
  *   *Progress condition:* We stop asking "Is consciousness real or an illusion?" and start asking "What work does this concept do?" If positing "phenomenal consciousness" helps us navigate ethics, law, and AI safety, we keep the term but drop the metaphysical baggage. If it hinders scientific progress, we adopt Dennett's vocabulary.

  ### 5. Will it go on forever?

  Probably not forever, but it will likely end in a **dissolution** rather than a victory.

  History suggests that philosophical stalemates often end when the vocabulary shifts. Think of the vitalism debate. Vitalists said, "There is a life-force that explains biology." Mechanists said, "No, it's just chemistry."
  Eventually, biochemistry advanced to the point where "life-force" became a useless concept. We didn't prove it didn't exist; we just found we didn't need it to do the work.

  **The Prognosis:**
  *   **If** neuroscience succeeds in building a functional model of the brain that accounts for all behavior and self-reporting without invoking a "central meaner," the pressure will shift to the Realists to explain what work "qualia" is actually doing.
  *   **However,** as long as the *feeling* of consciousness remains the primary datum for the Realists, they will always be able to say, "Your model explains the zombie, but not me."

  **Summary Diagnosis:**
  You are right that it is about what an explanation must be. But deeper than that, it is a conflict between **Third-Person Authority** (Science/Objectivity) and **First-Person Authority** (Experience/Subjectivity).
  *   **Dennett** argues First-Person Authority is a myth.
  *   **Critics** argue Third-Person Authority is incomplete without it.

  **What to watch for:**
  Don't look for a neuroscience discovery that "finds consciousness." Look for developments in **AI and Synthetic Psychology**. If we build a robot that functions exactly like a human, claims to be conscious, passes all behavioral tests, but we know it has no "inner light" (because we built it from silicon), the intuition pumps will break.
  *   If you say the robot is *not* conscious, you sound like a vitalist.
  *   If you say it *is* conscious, you admit Dennett was right (function is enough).

  That engineering challenge may do what philosophy has failed to do for 30 years: force a resolution.
