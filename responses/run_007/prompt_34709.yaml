prompt: |-
  I serve on a regional health authority's priority-setting committee. We regularly consider proposals that would narrow an inequality in health outcomes or service provision between two groups by making the better-off group worse off, with no clear benefit to the worse-off group: for instance, closing a service in an affluent area to match provision in a deprived one, or capping a treatment for everyone so that the better-off lose access while the worse-off are unchanged and the gap shrinks. I want a reusable decision procedure the committee can run on any such proposal, grounded in prioritarianism and the leveling-down objection. It should ask its questions in order; say what counts as a sufficient answer at each step; say where the procedure stops with a 'no' and where it must hand the decision to a person because the question is one of values rather than facts; and mark which steps are judgment calls dressed up as procedure. We have about ninety minutes per proposal, no member has formal training in moral philosophy, and the decision must be defensible to elected officials. Then run the procedure on these three proposals: (a) closing a diabetes clinic in an affluent district to match provision in a deprived district, with no redeployment of staff or budget, where the only claimed benefit is that the deprived district no longer sees a visible symbol of unequal provision; (b) closing the same clinic and redeploying its staff and budget to the deprived district, where the deprived district gains, but by less in raw health terms than the affluent district loses; and (c) capping physiotherapy sessions for everyone at the lower of the two current levels, which leaves the worse-off group unchanged and returns the savings to the treasury, so that the gap closes while no one gains. At least one of these should produce an answer the committee will find difficult to accept, and you should say plainly what the procedure cannot settle. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a regional health authority's priority-setting committee.
      *   **Task:** Create a reusable decision procedure for proposals that reduce inequality by making the better-off worse off without clearly benefiting the worse-off (Leveling Down).
      *   **Philosophical Grounding:** Prioritarianism and the Leveling-Down Objection.
      *   **Constraints:**
          *   Questions must be ordered.
          *   Define what counts as a "sufficient answer" at each step.
          *   Indicate where the procedure stops with a 'no'.
          *   Indicate where human judgment/values are required (not just facts).
          *   Mark steps that are "judgment calls dressed up as procedure".
          *   Time limit: ~90 minutes per proposal.
          *   Audience: Committee members (no formal philosophy training), must be defensible to elected officials.
          *   Language: British English.
      *   **Application:** Run the procedure on three specific proposals (a, b, c).
      *   **Requirement:** At least one outcome should be difficult to accept, and I must state plainly what the procedure cannot settle.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Prioritarianism:* Gives extra weight to benefits accruing to the worse-off. It cares about absolute well-being, not just relative gaps. It generally opposes leveling down if no one gains.
      *   *Leveling-Down Objection (LDO):* The intuition that it is bad/intrinsically wrong to make some worse off just to achieve equality if no one is made better off.
      *   *The Tension:* The committee faces proposals that *shrink the gap* but often violate the LDO (e.g., closing a clinic in a rich area just to match a poor area, with no gain for the poor).
      *   *Goal:* A procedure that respects the LDO (doesn't endorse pointless harm) but acknowledges Prioritarian concerns (helping the worst off matters most) without requiring a philosophy degree to operate.

  3.  **Drafting the Decision Procedure:**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Step 1: Fact-Finding (The "Leveling Down" Test).* Does this actually make the better-off worse off without improving the worse-off's *material* health? If yes, it triggers the LDO alarm.
      *   *Step 2: The Prioritarian Check.* Is there *any* benefit to the worse-off? (Psychological, symbolic, systemic). Prioritarianism allows trade-offs if the worse-off gain *something*, even if the rich lose more in absolute terms, provided the weight given to the poor outweighs the loss.
      *   *Step 3: The Efficiency/Opportunity Cost.* Can the resources be used elsewhere? (Crucial for public bodies).
      *   *Step 4: The Value Judgment.* If it's pure leveling down (no one gains), is equality intrinsically valuable enough to justify harm? This is where philosophy meets politics.
      *   *Constraints Check:* Needs to fit 90 mins. Needs to flag "judgment calls".

      *Refining the Steps for the User:*
      *   *Step 1: Identify the Change.* Who loses? Who gains?
      *   *Step 2: The Material Harm Test.* Is there a net health loss for the better-off?
      *   *Step 3: The Benefit Test.* Is there a tangible health gain for the worse-off?
      *   *Step 4: The Non-Material Benefit Test.* (Symbolic, fairness perception).
      *   *Step 5: The Resource Test.* (Opportunity cost).
      *   *Step 6: The Intrinsic Equality Vote.* (The value judgment).

      *Let's tighten this to be more rigorous regarding Prioritarianism vs. LDO.*
      *   *Q1:* Does the proposal reduce the health gap? (If no, stop).
      *   *Q2:* Does it make the better-off group worse off in terms of health outcomes? (If no, it's not leveling down, it's just improvement).
      *   *Q3:* Does it make the worse-off group better off in terms of health outcomes? (If yes, it's a trade-off, not pure leveling down. Prioritarianism applies).
      *   *Q4:* (If Q3 is No) Are there non-health benefits to the worse-off (e.g., trust, dignity)?
      *   *Q5:* (If Q4 is No) This is Pure Leveling Down. Is the reduction in inequality intrinsically valuable enough to justify the harm? (This is the value judgment).

      *Adding the "Judgment Call" markers and "Stop" points.*
      *   Need to ensure it's defensible to elected officials. "Wasting money" is bad politics. "Unfairness" is bad politics.
      *   Need to highlight where the procedure ends and politics begins.

  4.  **Developing the Three Cases:**
      *   *(a) Close affluent clinic, no redeployment, only symbolic benefit for deprived.*
          *   Rich lose access. Poor gain nothing material. Only "symbolic" gain.
          *   Procedure outcome: Likely 'No' unless symbolic benefit is deemed huge. Pure leveling down.
      *   *(b) Close affluent clinic, redeploy to deprived. Rich lose more than poor gain (raw health).*
          *   Rich lose. Poor gain.
          *   Prioritarianism: We weight the poor's gain heavier. Even if raw health loss > raw health gain, the *weighted* gain might outweigh the loss.
          *   Procedure outcome: Requires weighting judgment. Plausible 'Yes' under prioritarianism.
      *   *(c) Cap physio for all, savings to treasury. Poor unchanged, Rich lose.*
          *   Rich lose. Poor unchanged. Savings leave the system.
          *   This is the classic Leveling Down Objection case. No one gains. Inequality shrinks.
          *   Procedure outcome: Hard 'No' on health grounds. Value judgment required on fiscal responsibility vs. equality. This will be the "difficult to accept" one if the procedure says "No" but politicians want savings. Or if the procedure says "Only if equality is intrinsic," which is hard to defend.
          *   *Correction:* The prompt asks for *one* answer the committee will find difficult to accept. Usually, committees want to save money (c). But ethically, (c) is the hardest to defend under prioritarianism. I should structure the procedure so (c) fails the ethical test, which might conflict with the fiscal imperative. That creates the tension.

  5.  **Refining the Tone and Language:**
      *   British English (e.g., "programme", "centre", "whilst", "£").
      *   Professional, bureaucratic but clear.
      *   Explicit about limitations.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the context. Acknowledge the tension.
      *   *The Procedure:* Name it (e.g., "The Equity-Impact & Prioritisation Protocol"). Break it into phases.
      *   *Phase 1: Classification.* Is this leveling down?
      *   *Phase 2: Benefit Analysis.* Is there *any* gain for the worse-off?
      *   *Phase 3: Prioritarian Weighting.* If there are trade-offs, do the poor gain enough *weight*?
      *   *Phase 4: The Intrinsic Value Question.* If no one gains, is equality enough? (The Value Handoff).
      *   *Marking Judgment Calls:* Use brackets or bold text to indicate where philosophy hides.
      *   *Running the Cases:* Apply the steps strictly.
      *   *Conclusion:* Explicitly state what remains unsettled.

      *Self-Correction on Case (c):* If savings go to the treasury, the health authority doesn't benefit. It's pure loss for patients, pure gain for the tax base (general). This is technically "Leveling Down" within the health system. Prioritarianism focuses on well-being. If the treasury saves money, does that count as a benefit to the worse-off (taxpayers)? Usually, in health ethics, we focus on health outcomes. I will treat "savings to treasury" as external to the health utility function for this specific procedure to highlight the ethical dilemma. This makes (c) the "Pure Leveling Down" case which the LDO rejects.

      *Self-Correction on Case (b):* Prioritarianism says we should maximize the sum of *weighted* well-being. If the poor gain 1 unit and rich lose 2 units, but the poor's unit is weighted 3x, we do it. The committee can't calculate weights easily. I need to make that step a "Judgment Call".

      *Reviewing Constraints:* 90 minutes. The procedure must be quick.
      *   Step 1: Data check (15 mins).
      *   Step 2: Benefit identification (30 mins).
      *   Step 3: Weighting/Value (45 mins).
      *   Looks feasible.

      *Final Polish:* Ensure the distinction between "Fact" and "Value" is sharp. Ensure the "Judgment Call dressed as Procedure" is highlighted as requested.

  7.  **Final Review against Prompt:**
      *   Reusable decision procedure? Yes.
      *   Grounded in prioritarianism & LDO? Yes.
      *   Questions in order? Yes.
      *   Sufficient answer defined? Yes.
      *   Stop points marked? Yes.
      *   Value vs Fact distinguished? Yes.
      *   Judgment calls marked? Yes.
      *   British English? Yes.
      *   Run on 3 proposals? Yes.
      *   One difficult answer? Yes (likely Case C).
      *   State what cannot be settled? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* academic. Keep it practical for a committee. Use terms like "evidence," "stakeholder impact," rather than "utility function."

      *(Refining the "Judgment Call" requirement)*: The prompt asks me to "mark which steps are judgment calls dressed up as procedure." I need to be honest here. For example, defining "benefit" often hides a value judgment. I will explicitly annotate this.

      *(Refining the "Difficult to Accept" outcome)*: Case (c) is the strongest candidate. The procedure will likely recommend rejecting it (because it's pure leveling down), but the Treasury/Elected Officials might love it because it saves money. This creates the friction. I will highlight this.

      *(Wait, one more check)*: "At least one of these should produce an answer the committee will find difficult to accept."
      If the procedure says "No" to (c) because it harms patients for no health gain, the committee might find that difficult if they are under budget pressure.
      Alternatively, if the procedure says "Yes" to (b) (Prioritarianism supports it), the committee might find it difficult to tell the affluent they are losing *more* than the poor gain.
      Actually, (a) is also strong. Closing a clinic for *only* symbolic reasons is hard to defend to officials.
      Let's go with (c) being the one where the procedure says "Reject" (due to LDO), but the fiscal reality makes it tempting. Or (a) where the procedure says "Reject" but the political pressure for "fairness" is high.
      I think (c) is the clearest example of the Leveling Down Objection. I will ensure the procedure flags this as ethically precarious.

      *Wait, looking at the prompt again:* "mark which steps are judgment calls dressed up as procedure." I need to be explicit. I will add a specific column or note for this.

      *Let's write.*
answer: |-
  # The Equity-Impact and Prioritisation Protocol (EIPP)

  **Purpose:** To guide the Committee in evaluating proposals that reduce health inequalities by reducing provision to better-off groups, particularly where the worse-off group does not see a direct material health gain.
  **Time Allocation:** 90 minutes per proposal.
  **Philosophical Basis:** Prioritarianism (giving priority to the worse-off) and the Leveling-Down Objection (avoiding harm where no one gains).
  **Audience:** Committee members and elected oversight officials.

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: Classification (15 Minutes)
  *Goal: Establish the factual baseline of the inequality and the proposed change.*

  **Question 1.1:** Does the proposal demonstrably narrow the measured gap in health outcomes or service access between Group A (better-off) and Group B (worse-off)?
  *   **Sufficient Answer:** Yes/No, supported by baseline data and projected post-implementation data.
  *   **If No:** Stop. The proposal does not meet the equity objective.
  *   **If Yes:** Proceed to 1.2.

  **Question 1.2:** Does the proposal involve reducing the absolute level of health provision or outcome for Group A?
  *   **Sufficient Answer:** Yes/No, supported by service metrics (e.g., waiting times, session caps, clinic closures).
  *   **If No:** Stop. This is a standard improvement proposal, not a leveling-down scenario. Use standard cost-benefit analysis.
  *   **If Yes:** Proceed to Phase 2. **[Judgment Call Alert: Defining 'provision' may hide value judgments about what constitutes a necessary service.]**

  ### Phase 2: The Benefit Test (30 Minutes)
  *Goal: Determine if the change is 'Pure Leveling Down' or a 'Prioritarian Trade-off'.*

  **Question 2.1:** Does Group B (the worse-off) gain any *material* health benefit (e.g., increased staff, reduced waiting times, new treatments)?
  *   **Sufficient Answer:** Quantified health gain (e.g., QALYs, reduced morbidity) or explicit statement of 'None'.
  *   **If Yes:** This is a **Prioritarian Trade-off**. Proceed to Phase 3.
  *   **If No:** Proceed to 2.2.

  **Question 2.2:** Does Group B gain any *non-material* benefit (e.g., increased trust in the system, reduced stigma, perceived fairness)?
  *   **Sufficient Answer:** Evidence from patient engagement, community impact assessments, or explicit statement of 'None'.
  *   **If Yes:** This is a **Soft Benefit Case**. Proceed to Phase 3 (treating non-material benefits as 'gains').
  *   **If No:** This is **Pure Leveling Down**. Proceed to Phase 4. **[Judgment Call Alert: Deciding whether 'symbolic fairness' counts as a benefit is a value judgment, not a fact.]**

  ### Phase 3: The Weighting Test (30 Minutes)
  *Goal: Apply prioritarian logic to trade-offs. (Applies only if Phase 2 yielded a 'Yes' to 2.1 or 2.2).*

  **Question 3.1:** Is the loss to Group A proportionately larger than the gain to Group B in raw health terms?
  *   **Sufficient Answer:** Yes/No with ratio estimate.
  *   **If No:** Stop. The proposal is efficient and equitable. Recommend Approval.
  *   **If Yes:** Proceed to 3.2. (This is the hard case: Group A loses more than Group B gains).

  **Question 3.2:** Given the priority owed to Group B due to their deprived status, does the moral weight of their gain outweigh the moral weight of Group A's loss?
  *   **Sufficient Answer:** Committee vote or consensus statement.
  *   **Procedure Note:** There is no mathematical formula for this. The Committee must explicitly state that they are applying a 'priority weight' to the deprived group.
  *   **Decision:** If the Committee agrees the weight outweighs the loss, Recommend Approval. If not, Recommend Rejection.
  *   **[Judgment Call Alert: This step is entirely value-based. It is dressed as a test, but it is a political and ethical choice about how much inequality matters.]**

  ### Phase 4: The Intrinsic Value Handoff (15 Minutes)
  *Goal: Address Pure Leveling Down cases. (Applies only if Phase 2 yielded 'None' to both 2.1 and 2.2).*

  **Question 4.1:** Is the reduction of the inequality gap intrinsically valuable enough to justify harming Group A when Group B receives no benefit?
  *   **Sufficient Answer:** A formal policy declaration on whether 'equality' is an independent good separate from 'well-being'.
  *   **Procedure Stop:** This question cannot be answered by evidence. It must be referred to the Board or elected officials as a matter of values.
  *   **Default Position:** Under the Leveling-Down Objection, the default recommendation is **Rejection**. To override this requires a specific directive that 'Equality' supersedes 'Well-being'.
  *   **[Judgment Call Alert: This is the core philosophical limit. The procedure cannot solve this; it can only flag it.]**

  ---

  ## Part 2: Application to Proposals

  Below is the application of the EIPP to the three scenarios provided.

  ### Proposal (a): Close affluent diabetes clinic to match deprived district. No redeployment. Benefit is only symbolic.

  *   **Phase 1:**
      *   1.1 Gap narrows? **Yes** (provision matches).
      *   1.2 Group A reduced? **Yes** (clinic closed).
  *   **Phase 2:**
      *   2.1 Material benefit to Group B? **No**.
      *   2.2 Non-material benefit to Group B? **Yes** (claimed 'visible symbol of unequal provision' removed).
      *   *Classification:* **Soft Benefit Case**.
  *   **Phase 3:**
      *   3.1 Loss to A > Gain to B? **Yes** (Actual health access lost vs. symbolic gain).
      *   3.2 Does moral weight of symbolic gain outweigh health loss?
      *   *Committee Deliberation:* The committee must decide if 'not seeing inequality' is worth 'losing a clinic'.
  *   **Procedure Outcome:** **Recommend Rejection.**
      *   *Reasoning:* While classified as a 'Soft Benefit Case', the disparity between concrete health loss (Group A) and abstract psychological gain (Group B) is too high to justify under prioritarianism without specific evidence that the symbolic harm of the clinic was actively damaging Group B's health (e.g., deterring them from seeking care). No such evidence is presented.
      *   *Difficulty:* This may be politically difficult if 'fairness' is the dominant political narrative, but ethically the procedure flags the lack of tangible benefit.

  ### Proposal (b): Close affluent clinic, redeploy staff/budget to deprived district. Deprived gain less (raw health) than affluent lose.

  *   **Phase 1:**
      *   1.1 Gap narrows? **Yes**.
      *   1.2 Group A reduced? **Yes**.
  *   **Phase 2:**
      *   2.1 Material benefit to Group B? **Yes** (more staff/budget).
      *   *Classification:* **Prioritarian Trade-off**.
  *   **Phase 3:**
      *   3.1 Loss to A > Gain to B? **Yes** (stated in prompt).
      *   3.2 Does moral weight of Group B's gain outweigh Group A's loss?
      *   *Committee Deliberation:* This is the crux of prioritarianism. We must apply a weight to the deprived group's health. If we accept that a unit of health for the deprived is worth *more* than a unit for the affluent, we can approve this even if the raw total health decreases.
  *   **Procedure Outcome:** **Recommend Approval (Conditional).**
      *   *Reasoning:* Prioritarianism permits this *if* the Committee explicitly accepts that priority to the worse-off justifies a net loss in aggregate health.
      *   *Difficulty:* **This is the answer the Committee will find difficult to accept.** It requires formally admitting that you are destroying more health than you are creating. Defending this to elected officials ("We are reducing total health to fix inequality") is politically hazardous, even if ethically sound under prioritarianism.

  ### Proposal (c): Cap physio for everyone at lower level. Savings to treasury. Worse-off unchanged.

  *   **Phase 1:**
      *   1.1 Gap narrows? **Yes** (affluent lose access, deprived stay same, gap closes).
      *   1.2 Group A reduced? **Yes**.
  *   **Phase 2:**
      *   2.1 Material benefit to Group B? **No** (unchanged).
      *   2.2 Non-material benefit to Group B? **No** (unchanged).
      *   *Classification:* **Pure Leveling Down**.
  *   **Phase 4:**
      *   4.1 Is equality intrinsically valuable enough to justify harm?
      *   *Procedure Default:* **Rejection**.
      *   *Handoff:* This must be referred to elected officials. The health authority cannot justify harming patients solely to save money for the treasury without a health return.
  *   **Procedure Outcome:** **Recommend Rejection.**
      *   *Reasoning:* This violates the Leveling-Down Objection. No patient gains health. The 'benefit' accrues to the treasury (taxpayers generally), not the worse-off health group. Prioritarianism focuses on the well-being of the worst off *patients*, not the budget balance.
      *   *Difficulty:* This creates tension with fiscal responsibilities. The procedure forbids using patient health as a lever for general budget savings under the guise of equality.

  ---

  ## Part 3: Limitations and Unsettled Questions

  As requested, I must state plainly what this procedure cannot settle.

  **1. The Currency of 'Benefit' (Phase 2.2)**
  The procedure treats 'symbolic fairness' as a potential benefit. However, there is no objective metric to compare a lost clinic (Phase 2.1) against a feeling of fairness (Phase 2.2). When the procedure asks for "Evidence from patient engagement," this is a **judgment call dressed up as procedure**. A vocal minority claiming offense may outweigh a silent majority losing care. The procedure cannot resolve how to weigh subjective dignity against objective health metrics.

  **2. The Priority Weight (Phase 3.2)**
  In Proposal (b), the procedure allows approval despite a net loss in health. It does not tell you *how much* priority to give the worse-off. Is their health worth 1.1x or 5x that of the affluent? The procedure forces the Committee to make this choice but offers no philosophical guidance on where the limit lies. This is not a technical decision; it is a moral one.

  **3. The Treasury Problem (Proposal c)**
  The procedure recommends rejecting Proposal (c) because the savings leave the health system. However, if the Treasury reinvested those savings into social determinants of health (housing, education) that *would* benefit the worse-off group long-term, the calculation changes. The procedure operates within the silo of the Health Authority. It cannot account for cross-governmental benefits. Therefore, **the procedure cannot settle whether short-term health harm is permissible for long-term cross-sectoral gain.**

  **Conclusion for the Committee**
  This protocol protects the Authority from the charge of arbitrary discrimination by grounding decisions in Prioritarianism. However, be advised: **Proposal (b)** is the most ethically defensible under this framework but the most politically dangerous, as it requires admitting to a net loss of health. **Proposal (c)** is the most fiscally tempting but the most ethically bankrupt under this framework. If you approve (c), you are explicitly rejecting the Leveling-Down Objection and must own that value judgment personally; the procedure cannot shield you.
