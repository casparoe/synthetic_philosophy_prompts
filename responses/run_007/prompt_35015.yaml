  I've been following the Mary's room debate for years now and honestly I can't tell if anyone's actually making progress. You've got the physicalists saying Mary just gains abilities or acquaintance-knowledge, not new facts, and the anti-physicalists saying no, she learns a new fact about what it's like to see red, so physicalism is false. Both sides have refined their positions endlessly — phenomenal concept strategies, the ability hypothesis, the acquaintance hypothesis on one side; the various reformulations of the knowledge argument on the other — and yet nobody budges. My hunch is that the disagreement isn't really about whether Mary learns something new (everyone basically agrees she does in some sense) but about what counts as a "physical fact" and what physicalism is even commited to. Is that right? Or is there a hidden empirical question in here about the nature of phenomenal representation? Diagnose the impasse: what kind of disagreement is this, and what would actually count as progress — a new conceptual distinction, an empirical result from neuroscience, or just admitting the question is ill-posed? Answer in American English.
