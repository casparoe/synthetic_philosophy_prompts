answer: |-
  You're hitting on something that a lot of philosophers of mind suspect but rarely admit outright: the Mary's Room debate has reached a reflective equilibrium where both sides are playing by different rulebooks. Your hunch is largely correct. The stalemate isn't primarily about the intuition pump itself (everyone agrees Mary learns *something*); it's about the metaphysical and semantic commitments required to interpret what she learned.

  Here is a diagnosis of the impasse, the role of empirical science, and what actual progress might look like.

  ### 1. The Core Disagreement: It's Meta-Ontological
  You identified the crux: the disagreement is about what physicalism is committed to. This is a **meta-ontological dispute** disguised as an epistemological one.

  *   **The Anti-Physicalist View:** They hold that physicalism requires **a priori entailment**. If physicalism is true, a complete physical description of the world should, in principle, allow you to deduce all other truths about the world. Since Mary can't deduce what it's like to see red from the physics, there are non-physical facts.
  *   **The Physicalist View (Phenomenal Concept Strategy):** They have shifted the goalposts to **a posteriori necessity**. They argue that Mary gains a new *concept* (a phenomenal concept), not a new *fact*. The physical facts remain the same, but her mode of accessing them changes. For them, physicalism only requires that phenomenal states *supervene* on physical states, not that they be logically deducible from them without experience.

  **The Impasse:** The anti-physicalist says the physicalist is changing the definition of "physical" to make the theory unfalsifiable. The physicalist says the anti-physicalist is demanding a logical relationship (deduction) that isn't required for identity claims (just as you can't deduce "water is H2O" without empirical investigation, you can't deduce "experience is neural firing" without having the experience).

  Until both sides agree on whether physicalism requires *deducibility* or merely *supervenience*, they will talk past each other forever.

  ### 2. Is There a Hidden Empirical Question?
  You asked if there is a hidden empirical question about phenomenal representation. The short answer is: **not one that solves the philosophical problem.**

  Neuroscience can tell us *which* mechanisms correlate with the experience of red. It can tell us how information is integrated or how global workspace access occurs. But neuroscience operates on third-person data. Mary's Room is designed to highlight the gap between third-person data and first-person ontology.

  *   **The Limit of Empiricism:** Even if we map the exact neural correlate of "redness," the anti-physicalist will simply ask, "Why does *that* specific firing pattern feel like *this*?" Empirical data fills in the structure of the physical story, but it doesn't bridge the explanatory gap regarding *why* there is experience at all.
  *   **The Exception:** The only way empirical data helps is if it forces a conceptual revision. For example, if neuroscience proves that consciousness is a functional illusion (as **Illusionists** like Keith Frankish argue), that changes the metaphysical landscape. But that's an empirical result driving a philosophical pivot, not an empirical result settling the debate within the current framework.

  ### 3. What Would Count as Progress?
  Since more thought experiments (zombies, inverted spectra, etc.) aren't working, and neuroscience can't bridge the normative gap, progress likely requires one of three things:

  **A. A New Conceptual Distinction (The Most Likely Path)**
  We need to dissolve the binary of "physical vs. non-physical." The debate assumes a Cartesian hangover—that there's "matter" and then there's "mind stuff."
  *   **Russellian Monism:** This view suggests physics only describes the *structure* of matter, not its intrinsic nature. Consciousness might be the intrinsic nature of the physical stuff. This bypasses Mary's Room by saying Mary knew the structure but not the intrinsic nature, and both are "physical" in a broader sense.
  *   **Illusionism:** This argues that "phenomenal properties" (qualia) don't exist as real properties. Mary doesn't learn a new fact about the world; she acquires a new cognitive interface. If this gains traction, the Knowledge Argument collapses because there is no "fact of the matter" about what it's like to see red, only a fact about how we represent it.

  **B. Admitting the Question is Ill-Posed (Deflationism)**
  Progress might look like widespread admission that "physicalism" is too vague a term to carry this weight. If philosophers agree that "physicalism" is a cluster concept rather than a strict metaphysical thesis, the stakes of Mary's Room lower. We might move toward **non-reductive physicalism** as a default, accepting that higher-level properties are real and causally potent without demanding they be reducible to particle physics in a deductive sense.

  **C. A "Copernican Shift" in Epistemology**
  We might need to accept that human cognition has a **cognitive closure** regarding this issue. Just as a dog cannot understand calculus, humans might be cognitively closed to the solution of the hard problem. Progress here would be stopping the attempt to solve it and instead explaining *why* we are compelled to think there is a problem. This is the Wittgensteinian route: the problem arises from a misuse of language, and dissolving the linguistic confusion dissolves the metaphysical puzzle.

  ### The Verdict
  You are right to feel the debate is stagnant. It is currently a **verbal dispute underwritten by divergent metaphysical intuitions.**

  Physicalists are protecting the *causal closure of the physical* (nothing non-physical causes anything). Anti-physicalists are protecting the *reality of the phenomenal* (experience is real and distinct).

  **Real progress won't come from neuroscience.** It will come from philosophy doing the hard work of either:
  1.  Rigorously defining physicalism in a way that doesn't beg the question.
  2.  Adopting a framework (like Illusionism or Panpsychism) that renders the Knowledge Argument irrelevant.
  3.  Admitting that the "Hard Problem" is a category error generated by our introspective machinery.

  Until then, Mary stays in the room, and we stay in the seminar.
