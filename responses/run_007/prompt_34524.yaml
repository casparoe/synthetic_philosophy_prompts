      *   *Position 1: Precedent Autonomy (Dworkin).* Critical interests trump experiential interests. The earlier self's directive stands even if the later self is content.
      *   *Position 2: Current Interest/Well-being (Dresser).* The demented patient is a different person or at least their current experiential interests matter most. Don't harm the happy demented patient based on past wishes.
      *   *Position 3: Competence Threshold.* ADs only kick in when current competence is lost. If the demented patient expresses a preference, are they competent? If yes, current wins. If no, AD wins. (This is often the legal standard, but philosophically tricky if "competence" is defined loosely).
      *   *Position 4: Authenticity/Deep Change.* If the change in preference is due to pathology (dementia), AD wins. If due to authentic growth (religious conversion), current wins.
      *   *Position 5: Narrative Identity (Schechtman).* Depends on the continuity of the narrative self. If the narrative is broken, the AD might not bind.
      *   *Refinement:* Positions 3 and 4 often overlap. Position 5 is a criterion for deciding between 1 and 2. Let's structure the scoring around these core tensions: *Precedent Autonomy* vs. *Current Well-being* vs. *Authenticity/Continuity*.

