answer: |-
  # The Advance Directive Sorting Quiz

  **Instructions:** For each scenario, choose the option that best matches your intuitive judgment about what should happen. Try not to overthink the legal technicalities; go with what feels morally right to you.

  **1. The Happy Dementia Case**
  You wrote an advance directive stating, "If I develop severe dementia, do not prolong my life." You now have severe dementia. You do not recognize your family, but you seem content, enjoy eating ice cream, and smile often. You develop a treatable pneumonia. Your surrogate must decide on antibiotics.
  *   **A.** Withhold antibiotics. Your past self decided this life wasn't worth living.
  *   **B.** Administer antibiotics. Your current self is happy and wants to live.
  *   **C.** Administer antibiotics only if a doctor confirms you lack the capacity to understand the decision, otherwise ask you.

  **2. The Depression Reversal**
  During a severe depressive episode, you signed a directive refusing life-saving treatment if you attempted suicide. You recovered, lived happily for five years, then faced a sudden crisis and attempted suicide. In the ER, conscious and begging for help, you say, "I want to live."
  *   **A.** Honor the directive. Your past self knew the depression would lie to you.
  *   **B.** Treat you. Your current expressed wish overrides the past document.
  *   **C.** Treat you, but only because your current request proves you are competent enough to override the directive.

  **3. The Religious Conversion**
  You were secular and wrote a directive demanding "all possible life-saving measures." Later, you converted to a faith that forbids blood transfusions as a matter of spiritual salvation. You are now unconscious and need blood to survive.
  *   **A.** Give the blood. Your written legal directive demands it.
  *   **B.** Withhold the blood. Your current religious values represent your authentic self.
  *   **C.** Withhold the blood, but only if your conversion was deemed mentally competent and stable.

  **4. The Ulysses Contract (Psychiatry)**
  You have bipolar disorder. When stable, you signed a contract: "If I become manic and refuse medication, force me to take it." You are now manic, feeling euphoric, and refusing meds. You say, "I feel great, stop trying to poison me."
  *   **A.** Force the medication. You pre-committed to this during stability.
  *   **B.** Do not force it. Your current experience is positive; don't harm a happy person.
  *   **C.** Force the medication, but only if a psychiatrist confirms your mania impairs your judgment.

  **5. The Teenage Directive**
  At 17, you signed an advance directive (in a jurisdiction that allows it) refusing certain treatments based on youthful values. At 25, you have different values but haven't updated the paperwork. You are now incapacitated.
  *   **A.** Follow the 17-year-old's directive. It is the only written evidence.
  *   **B.** Ignore the directive. A teenager's values shouldn't bind an adult.
  *   **C.** Follow what your friends say your adult values were, ignoring the document.

  **6. The Verbal Revocation**
  You wrote a directive refusing feeding tubes. Later, while still competent, you told your doctor verbally, "Actually, I'd want a feeding tube," but never updated the paper document. You are now incapacitated.
  *   **A.** Follow the written document. Verbal changes are too easy to dispute.
  *   **B.** Follow the verbal statement. It is more recent and reflects your current will.
  *   **C.** Follow the verbal statement, but only if witnessed by two people.

  **7. The "Different Person" Intuition**
  You have severe Alzheimer's. You no longer remember your name, your spouse, or your past life. You have new hobbies and a new temperament. Your directive says "no life support."
  *   **A.** Follow the directive. You are biologically the same person.
  *   **B.** Ignore the directive. The person who wrote it is gone; this is a new being.
  *   **C.** Follow the directive only if your spouse confirms you haven't changed *too* much.

  **8. The Family Burden**
  Your directive says "do not keep me alive if I am a burden." You have severe dementia. You seem content, but caring for you is financially and emotionally destroying your family. They want to stop treatment.
  *   **A.** Continue treatment. Your current self isn't suffering, so the directive doesn't apply.
  *   **B.** Stop treatment. Your past self anticipated this burden and forbade it.
  *   **C.** Stop treatment, but only if the burden is objectively severe, not just inconvenient.

  **9. The Painful Treatment**
  Your directive says "no treatment if I am suffering." You are incapacitated. A treatment will save your life but is known to be painful. You cannot express preference, but you are whimpering.
  *   **A.** Withhold treatment. Your directive prioritizes avoiding suffering.
  *   **B.** Administer treatment. Life is the default good; suffering is secondary.
  *   **C.** Administer pain relief alongside treatment to balance both interests.

  **10. The Gradual Erosion**
  You have mild dementia. You say, "I don't remember writing that directive, but I want to live." You can hold a conversation but forget details quickly.
  *   **A.** Honor the directive. Your memory loss proves you aren't competent to change it.
  *   **B.** Honor your current wish. You are expressing a preference now.
  *   **C.** Perform a formal competence test. If you pass, your current wish wins; if not, the directive stands.

  ***

  # Scoring Key and Philosophical Taxonomy

  ### How to Score
  Tally your answers. You will likely have a mix, but one column should dominate.

  *   **Mostly A:** The Precedent Autonomist
  *   **Mostly B:** The Current Interest Advocate
  *   **Mostly C:** The Competence/Authenticity Gatekeeper
  *   **Mixed (A & B):** The Narrative Identity Theorist (or Unstable)

  ### The Taxonomy (Refined)
  Your initial list was close, but philosophical literature suggests some positions are *justifications* for others rather than distinct verdicts. Here is the corrected mapping:

  **1. The Precedent Autonomist (Mostly A)**
  *   **Philosophical Label:** Critical Interest Theory (Ronald Dworkin).
  *   **Core View:** Your "critical interests" (values, life plans, dignity) matter more than "experiential interests" (pleasure, pain). The person you were when competent is the "real" you.
  *   **Why you chose A:** You believe autonomy extends over time. Allowing dementia to override an AD is letting a disease destroy your life's narrative.
  *   **Taxonomy Fix:** This covers your position (1).

  **2. The Current Interest Advocate (Mostly B)**
  *   **Philosophical Label:** Experiential Interest Theory / The "New Person" View (Rebecca Dresser).
  *   **Core View:** The demented patient is either a different person or their current well-being is the only moral currency that matters. You cannot harm a happy being based on the wishes of a "dead" past self.
  *   **Why you chose B:** You prioritize preventing harm to the being that exists *now*. Past wishes shouldn't condemn a happy person to death.
  *   **Taxonomy Fix:** This covers your position (2).

  **3. The Competence/Authenticity Gatekeeper (Mostly C)**
  *   **Philosophical Label:** Threshold Theory / Authenticity View.
  *   **Core View:** Advance directives are valid *unless* the current self is competent enough to override them OR unless the change in preference is "authentic" (e.g., religious conversion) rather than pathological (e.g., dementia).
  *   **Why you chose C:** You see autonomy as dynamic. You want to respect the past, but not if the present self is truly capable of choosing differently or has genuinely grown.
  *   **Taxonomy Fix:** This collapses your positions (3), (4), and partially (5). In practice, "Competence" is often used as a proxy for "Authenticity." If you are incompetent, we assume your values aren't authentic.

  **4. The Narrative Identity Theorist (Mixed A & B)**
  *   **Philosophical Label:** Narrative Continuity (Marya Schechtman).
  *   **Core View:** It depends on whether the current self is psychologically continuous with the past self. If the dementia is severe enough to break the narrative thread (Question 7), the AD lapses. If the thread holds (Question 10), the AD stands.
  *   **Why you mixed:** You likely chose **A** in the severe dementia cases (where the break is clear) but **B** in the depression/conversion cases (where the self is continuous).
  *   **Taxonomy Fix:** This refines your position (5). It is often indistinguishable from the **Authenticity Gatekeeper** in practice, as both rely on judging the *quality* of the change in self.

  ### Unoccupied and Incoherent Positions

  **1. The "Hedonic Veto" (Nobody is here)**
  *   **The Position:** "Follow the Advance Directive only if the current patient is unhappy. If they are happy dementia, ignore the AD."
  *   **Why it's empty:** This combination is philosophically unstable. If you think happiness is the only thing that matters (Current Interest), you should ignore the AD even if they are sad (to relieve suffering). If you think Autonomy matters most (Precedent), you should follow the AD even if they are happy. Making death contingent on current happiness treats the patient like a pet whose quality of life is judged by others, which satisfies neither autonomy advocates nor strict vitalists.

  **2. The "Competent Paternalist" (Nobody is here)**
  *   **The Position:** "Follow the Advance Directive even if the current patient is fully competent and begging to live."
  *   **Why it's empty:** This violates the basic definition of medical consent. If a patient is competent *now*, their contemporaneous refusal or consent legally and morally voids any past document. Defending this would require arguing that people should be bound by contracts they cannot legally sign (since a competent person can always revoke an AD).

  ### Indistinguishable Positions

  **Competence vs. Authenticity**
  In this quiz, **Position 3 (Competence)** and **Position 4 (Authenticity)** often yield the same score.
  *   **Why:** In cases of severe dementia, the patient is deemed "incompetent" (Position 3) *because* their values are seen as products of pathology rather than "authentic" growth (Position 4).
  *   **The Split:** They only come apart in cases like **Question 3 (Religious Conversion)**. A strict Competence theorist might say "If they are competent now, the AD is void." An Authenticity theorist might say "Even if competent, was the conversion deep enough to override a lifetime of secular values?" If you scored **C** on Question 3 but **A** on Question 1, you are an **Authenticity Theorist**. If you scored **C** on both, you are a **Competence Gatekeeper**.

  **Narrative Identity vs. Current Interest**
  **Position 5 (Narrative)** can collapse into **Position 2 (Current Interest)**.
  *   **Why:** If you argue that severe dementia creates a "new person" (Question 7, Option B), you effectively argue that the past self has no authority. This leads to the same verdict as the Current Interest Advocate (let the new person live).
  *   **The Split:** The Narrative theorist might still honor the AD in *mild* dementia (where the narrative holds), whereas the Current Interest Advocate might prioritize current wishes regardless of continuity. If you chose **A** for Question 10 (Mild Dementia) but **B** for Question 1 (Severe Dementia), you are likely a **Narrative Theorist**. If you chose **B** for both, you are a **Current Interest Advocate**.
