prompt: |-
  Over lunch a colleague in political theory gave me his one-paragraph gloss on Mill's late turn towads socialism, and I've been turning it over since. I teach a survey course that covers On Liberty, and I've read that closely, but I honestly don't know the later economic writings well enough to check his account. Here's what he said, roughly as I remember it:

  "By the end of his life Mill had come around to socialism. In the later editions of the Principles and in the chapters on socialism published after his death, he repudiates the wage system and argues that its natural, inevitable replacement is a system of worker-owned cooperatives, which would do away with competition. He also backs off his earlier laissez-faire commitments. And because he now thinks cooperatives can run the whole economy, he stops worrying about the dangers of centralized planning and about the loss of individual liberty that had worried him in On Liberty."

  My instinct is that the first two sentences are broadly right but the last one smells wrong, because liberty worries seem too deep in Mill to just disappear. But I'm not a Mill specialist and I don't want to pass on a caricature to my students. Is this a fair summary? Go through it roughly sentence by sentence and sort out what's accurate, what's an overstatement, and what's just false. Also say whether the bit about him dropping his worries about centralized planning and liberty actually follows from his endorsement of cooperatives. And since I may repeat this in class, tell me how confident you are in each major claim and which point you're least sure about.
