          *   **Verdict:** Accurate.
          *   **Confidence:** High.

      *   *Sentence 4:* "And because he now thinks cooperatives can run the whole economy, he stops worrying about the dangers of centralized planning and about the loss of individual liberty that had worried him in On Liberty."
