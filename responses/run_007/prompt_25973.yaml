      *   *The Exception:* "Backward" societies (Mill has colonial India in mind) are not yet capable of this. They need guidance.
      *   *The Justification:* Despotism is legitimate *only if* the end is improvement and the means actually effect that end.
      *   *The Tension:* If liberty is the *only* way to develop the faculties required for liberty, how can despotism develop those faculties?
      *   *Mill's Internal Logic:* Mill distinguishes between *basic* civilization (security, industry, basic rationality) and *higher* civilization (individuality, critical autonomy). Despotism can achieve the former; liberty is required for the latter.
      *   *The "Pedagogical" View:* The despot acts as a tutor. The goal is to make the pupil independent. Once the pupil is ready, the despotism must end (in theory).
      *   *The Flaw/Tension:* Mill assumes a benevolent, enlightened despot (like the British Empire purported to be) can teach independence without practicing it. Critics argue this is psychologically and politically impossible.

  3.  **Drafting the Bottom Line (BLUF):**
