prompt: |-
  In most democratic legal systems, a private citizen who orders someone to be seized, detained without charge, and subjected to coercive interrogation would face serious criminal charges. Yet when senior executive officials authorize essentially the same acts as part of national security policy, criminal prosecution is rare, and the response to public exposure is typically a legislative inquiry, a truth commission, or a political reckoning — not a trial. This asymmetry is not an oversight; it is embedded in the legal architecture of the modern state.

  What theory of moral responsibility does this practice presuppose? In particular: does it presuppose that the same act changes its moral character when performed in a political role, or that political actors are subject to a different kind of accountability altogether? And is the practice consistent with the fact that the same legal systems do prosecute political leaders for corruption and self-dealing — drawing a line between dirty-hands wrongdoing and self-interested wrongdoing? Reconstruct the implicit theory, distinguish what the practice strictly presupposes from what it merely fits well with, and say whether the line it draws is philosophically defensible.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Observation:** Private citizens committing acts like seizure, detention without charge, and coercive interrogation face criminal charges. Senior executive officials authorizing the same acts for national security rarely face criminal prosecution (instead facing inquiries, commissions, political reckoning).
      *   **Claim:** This asymmetry is embedded in the legal architecture (not an oversight).
      *   **Questions:**
          1.  What theory of moral responsibility does this practice presuppose?
          2.  Does it presuppose the *act* changes moral character in a political role, OR that political actors are subject to a *different kind of accountability*?
          3.  Is this consistent with prosecuting leaders for corruption/self-dealing (distinguishing "dirty hands" vs. self-interest)?
          4.  Task: Reconstruct the implicit theory.
          5.  Task: Distinguish what is *strictly presupposed* vs. what merely *fits well*.
          6.  Task: Evaluate whether the line drawn is philosophically defensible.

  2.  **Initial Brainstorming & Concept Identification:**

      *   *The Phenomenon:* This is often discussed under "State Necessity," "Reason of State" (*Raison d'État*), or the "Dirty Hands" problem (Walzer, Machiavelli, Weber).
      *   *Legal Mechanisms:* Sovereign immunity, qualified immunity, state secrets privilege, amnesty laws, transitional justice mechanisms.
      *   *Moral Theories:* Consequentialism (greater good), Deontology (rules apply to all), Role Morality (professional ethics), Political Realism.
      *   *The Corruption Contrast:* Why prosecute for bribes but not torture? Bribes are private gain; torture (allegedly) is public safety. This points to the *intent/benefit* distinction.

  3.  **Reconstructing the Implicit Theory:**

      *   *Core Idea:* The state holds a monopoly on violence. Officials act as agents of the state, not private individuals.
      *   *Theory Name:* "Political Role Morality" combined with "Consequentialist Exceptionalism." Let's call it the **Doctrine of Political Necessity** or **Public Role Consequentialism**.
      *   *Key Tenet:* The moral evaluation of an act depends on the *capacity* in which it is performed and the *end* it serves.
      *   *Accountability:* It's not that they aren't accountable, but the *forum* changes. From criminal court (individual guilt) to political/historical court (legacy, impeachment, truth commissions).

  4.  **Addressing the Specific Questions:**

      *   *Act Character vs. Accountability Type:* It's likely a mix, but primarily the *accountability type* shifts because the *context* changes the moral weight. If I kill in self-defense, it's not murder. If the State kills in war, it's not murder. The prompt suggests the *act* (torture/detention) is legally defined differently when authorized by the state (e.g., "enhanced interrogation" vs. "torture"). So, the practice presupposes the *moral character* is modified by the public end, which necessitates a *different accountability mechanism*.
      *   *Consistency with Corruption Prosecutions:* Yes, it is consistent *if* the theory distinguishes between *public-regarding* wrongs (dirty hands) and *private-regarding* wrongs (corruption). Corruption violates the fiduciary duty of the office for personal gain. "Dirty hands" violations are (allegedly) for the survival/benefit of the polity.

  5.  **Distinguishing "Strictly Presupposed" vs. "Fits Well":**

      *   *Strictly Presupposed:*
          1.  The State has a unique moral status (not just an aggregate of individuals).
          2.  Executive officials have a fiduciary duty to protect the state that can override normal moral prohibitions in extremis.
          3.  Criminal law is the wrong tool for "public necessity" violations (it individualizes what is systemic).
      *   *Fits Well (but not required):*
          1.  Utilitarianism (maximizing welfare). One could be a deontologist about the state's survival.
          2.  Specific legal doctrines like sovereign immunity (these are the *tools*, not the *theory*).
          3.  The idea that the officials are "heroes" (they might be tragic figures).

  6.  **Evaluating Philosophical Defensibility:**

      *   *Arguments For:*
          1.  *Effectiveness:* Criminalizing necessary evil might paralyze leadership in crises.
          2.  *Fairness:* It's unfair to judge leaders by peacetime norms during existential threats.
          3.  *Systemic vs. Individual:* These acts are often systemic; trying individuals misses the point.
      *   *Arguments Against:*
          1.  *Rule of Law:* Creates a class of people above the law. Erodes normative constraints.
          2.  *Slippery Slope:* "Necessity" is easily abused.
          3.  *Victim's Perspective:* The victim suffers the same regardless of the perpetrator's title.
          4.  *Democratic Accountability:* Political reckoning is often weaker than legal judgment.
      *   *Verdict:* It is *controversially* defensible. It relies on a strong distinction between public and private morality that many modern human rights frameworks reject (e.g., UN Convention Against Torture allows no exceptions).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the phenomenon (the "Dirty Hands" problem). Define the implicit theory.
      *   *Section 1: The Implicit Theory.* Label it "Public Role Consequentialism" or "The Doctrine of Necessity." Explain the shift from individual criminal liability to political accountability.
      *   *Section 2: Act Character vs. Accountability.* It's both. The *justification* changes the act's description (from "kidnapping" to "rendition"), which shifts the forum.
      *   *Section 3: The Corruption Distinction.* Analyze the "Public Good" vs. "Private Gain" distinction. This is crucial for consistency.
      *   *Section 4: Presupposed vs. Fits Well.* Be precise here.
      *   *Section 5: Defensibility.* Weigh the Rule of Law against Political Necessity. Mention the shift in international law (universal jurisdiction) challenging this.

  8.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure not to say the practice is *legal* everywhere. The prompt says "In most democratic legal systems... prosecution is rare." Acknowledge that international law (CAT) contradicts this domestic practice.
      *   *Nuance:* The prompt asks about *moral responsibility*. Focus on the moral theory, not just the legal one. The legal architecture reflects the moral theory.
      *   *Key Distinction:* Ensure I clearly answer "Act changes character" OR "Different accountability." The answer is: The *justification* changes the moral description, which *entails* different accountability. It's not just a procedural shield; it's a substantive moral claim.

  9.  **Final Polish:** Check tone (analytical, philosophical), structure (clear headings), and ensure all parts of the prompt are addressed. (The resulting output should mirror the structure of the thought process.)

      *   *Theory Name:* "The Doctrine of Public Necessity" (rooted in Machiavelli/Weber/Walzer).
      *   *Moral Core:* Role morality + Consequentialism.
      *   *Corruption:* Fiduciary breach vs. Tragic choice.
      *   *Defensibility:* Weakens rule of law, but acknowledges political reality.

  10. (Final Review against Prompt):
