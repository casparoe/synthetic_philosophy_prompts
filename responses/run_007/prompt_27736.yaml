answer: |-
  ### Part 1: How Deterministic Forecasts Fail (A Mathematician's Autopsy)

  Before we write the checklist, you need to understand *why* I am asking you to withhold numbers. In dynamical systems, a deterministic forecast is a trajectory through phase space. It fails in four distinct ways, and each implies something different about the ethics of issuing a single value.

  1.  **Divergence (The Butterfly Effect):** Two states, indistinguishable within measurement error, separate exponentially.
      *   *Implication:* Beyond the Lyapunov time, the "true" state is no longer closer to your forecast than a random guess from the climate climatology. Issuing a single number here is not forecasting; it is guessing with a decimal point.
  2.  **Structural Drift:** Your equations approximate physics, they do not embody them.
      *   *Implication:* Even with perfect initial conditions, the trajectory drifts from reality. A single number implies a precision that the model structure cannot support.
  3.  **Bifurcation (Regime Change):** The system crosses a threshold (e.g., soil saturation, ice cover) where the governing dynamics change abruptly.
      *   *Implication:* Linear error estimates fail. The forecast might be right 90% of the time but catastrophically wrong the other 10%. A single number hides the tail risk.
  4.  **Forcing Uncertainty:** The boundary conditions (rainfall) are themselves chaotic forecasts.
      *   *Implication:* Hydrologic determinism is capped by meteorological predictability. If the QPF (Quantitative Precipitation Forecast) is probabilistic, the hydro output *must* be probabilistic.

  **The Operational Truth:** A single number is only responsible if the error distribution is unimodal, narrow, and symmetric. If the distribution is wide, bimodal, or skewed, the mean (your deterministic run) is a value that may never occur. Issuing it shifts the risk from the forecaster to the decision-maker without their consent.

  ***

  ### Part 2: The Predictability Gate (Decision Procedure)

  **Context:** Duty Forecaster, 02:00, 20 minutes max. No new ensembles. No computed Lyapunov exponents.
  **Goal:** Determine if a single-value forecast is defensible or if ranges/scenarios are required.

  #### Step 1: The Timescale Heuristic (2 Minutes)
  *   **Question:** Is the forecast lead time ($L$) greater than 3 times the basin's characteristic response time ($T_c$)?
      *   *$T_c$ Estimate:* Use the time-to-peak from the last major event or the lag time in your routing model.
      *   *Data:* Look at the hydrograph. How long does a pulse take to travel from headwaters to the forecast point?
  *   **Criterion:**
      *   If $L < 3 \times T_c$: **Pass.** (System memory dominates initial conditions).
      *   If $L > 3 \times T_c$: **Flag.** (Initial condition errors have likely doubled multiple times).
  *   **Action:** If Flagged, proceed to Step 2. If Pass, proceed to Step 3.

  #### Step 2: The Forcing Stability Check (5 Minutes)
  *   **Question:** Is the meteorological forcing (QPF) deterministic or probabilistic in this window?
      *   *Data:* Check the NWS/ECMWF deterministic run against the ensemble spread (GEFS/EFAS) available on your dashboard. You don't need to run it; just look at the spread of the precipitation totals.
  *   **Criterion:**
      *   If Ensemble Spread < 20% of Deterministic Mean: **Pass.** (Atmosphere is stable).
      *   If Ensemble Spread > 20% OR Deterministic run is an outlier of the ensemble: **Flag.** (Atmosphere is chaotic).
  *   **Action:** If Flagged, **STOP.** Do not issue a single water level/volume. Issue a range based on the min/max hydrologic response to the QPF ensemble bounds. Handoff to Decision-Maker.

  #### Step 3: The Non-Linearity Check (5 Minutes)
  *   **Question:** Is the catchment near a physical threshold?
      *   *Data:* Check current soil moisture / antecedent precipitation index (API) against saturation capacity. Check for ice/debris flow potential.
  *   **Criterion:**
      *   If Soil Saturation < 80% AND No Ice/Debris risk: **Pass.** (Response is roughly linear).
      *   If Soil Saturation > 80% OR Ice/Debris risk present: **Flag.** (Small rain errors = Massive flow errors).
  *   **Action:** If Flagged, you must issue a "Scenario A / Scenario B" (e.g., "If rain exceeds 2 inches, crest is X; if not, crest is Y"). Do not issue a weighted average.

  #### Step 4: The Consequence Handoff (5 Minutes)
  *   **Question:** Does the decision-maker require a single number for an automated trigger (e.g., gate closure, evacuation order)?
      *   *Data:* Consult the pre-agreed "Action Plan" for this specific site.
  *   **Criterion:**
      *   If Action Plan allows for ranges/scenarios: **Proceed** with Step 2/3 output.
      *   If Action Plan *requires* a single number: **JUDGEMENT CALL.**
  *   **Action:** This is where math ends and ethics begins.
      *   If you passed Steps 1-3: Issue the deterministic number, but append the text: *"Confidence: High. Error bound approx +/- X%."*
      *   If you flagged Steps 1-3: **Do not issue the number.** Call the duty emergency manager. Say: *"The model is chaotic. A single number will be wrong. I am issuing a range. You must decide which value triggers your action."*
      *   *Note:* If they insist on a number despite the warning, document the warning in the forecast log. You have discharged your duty by informing them of the uncertainty.

  #### Step 5: Documentation (3 Minutes)
  *   **Action:** Log the "Flags" triggered. If you issued a single number after a Flag, write *why* (e.g., "Manager insisted, warning issued").

  ***

  ### Part 3: Running the Procedure on Your Cases

  #### Case 1: 36-Hour Crest Forecast (Ongoing Storm)
  *   **Step 1 (Timescale):** Basin response time is ~12 hours. Lead time 36h. $36 < 3 \times 12$? No, $36 = 3 \times 12$. **Borderline Flag.**
  *   **Step 2 (Forcing):** Storm is *ongoing*. Rain has already fallen; QPF is only for the tail end. Radar nowcasting is highly accurate for <6h, less so for 30h. However, the bulk of the runoff is already in the channel. **Pass.** (Initial conditions dominate forcing uncertainty).
  *   **Step 3 (Non-Linearity):** Storm implies saturated soil. **Flag.**
  *   **Step 4 (Consequence):** Flood emergency. Evacuation zones depend on crest height.
  *   **Decision:** **Issue Single Number with Bounds.** Because the water is already in the system (Step 2 Pass), the chaos is dampened. However, due to saturation (Step 3 Flag), you cannot give a precise decimal.
      *   *Output:* "Crest 14.5 ft (Range 13.8–15.2 ft). Timing +/- 4 hours."
      *   *Rationale:* The system is in a high-gain state, but the trajectory is already set.

  #### Case 2: 7-Day Inflow Outlook (Drought Reservoir)
  *   **Step 1 (Timescale):** Basin response time ~2 days (flashy) to 5 days (baseflow). Lead time 7 days. $7 > 3 \times 2$. **Flag.**
  *   **Step 2 (Forcing):** 7-day QPF is notoriously unreliable. Ensemble spread will almost certainly exceed 20%. **Flag.**
  *   **Step 3 (Non-Linearity):** Drought means dry soil. Infiltration is high. Small rain errors lead to zero runoff vs. some runoff. Bimodal distribution likely. **Flag.**
  *   **Step 4 (Consequence):** Water manager needs *one* volume for release algorithms.
  *   **Decision:** **DO NOT ISSUE A SINGLE NUMBER.**
      *   *Output:* "Inflow Probability: 10th percentile = X, 50th = Y, 90th = Z. Deterministic run (Y) is not recommended for optimization."
      *   *Rationale:* This is the answer you won't like. At 7 days, the Lyapunov time for mid-latitude weather is exceeded. The deterministic model run is a fiction. If the manager puts 'Y' into their algorithm and the reality is 'X', they may drain the reservoir unnecessarily or risk spillage. You must force them to optimize for *risk*, not *expectation*. Tell them: "A single number here is a lie. Optimize for the 10th percentile if conservation is critical, or the 90th if flood space is needed."

  #### Case 3: 30-Day Seasonal Water-Supply Outlook
  *   **Step 1 (Timescale):** Lead time 30 days. Basin response is irrelevant; this is climate, not weather. $30 \gg 3 \times T_c$. **Hard Flag.**
  *   **Step 2 (Forcing):** No deterministic QPF exists at 30 days. **Hard Flag.**
  *   **Step 3 (Non-Linearity):** Snowmelt dynamics? Soil recharge? Highly non-linear. **Hard Flag.**
  *   **Step 4 (Consequence):** Strategic planning.
  *   **Decision:** **Hard Fail.**
      *   *Output:* Issue percentiles only (e.g., "70% chance of below-normal supply").
      *   *Rationale:* Issuing a single volume at 30 days is malpractice. It implies skill that does not exist.

  ***

  ### Part 4: Where This Procedure Misfires

  I need to be honest about the limitations of this checklist. It is a heuristic, not a theorem.

  1.  **The "Black Swan" Blindness:** This procedure relies on historical error growth (Step 1) and current spread (Step 2). It cannot predict a model structural failure where the physics themselves break (e.g., a levee breach not modeled, or a landslide dam). It assumes the attractor hasn't changed shape.
  2.  **The Subjectivity of "Stability":** In Step 2, judging QPF spread without a formal metric is a judgement call. A tired forecaster at 2 a.m. might see "stable" where a fresh eye would see "divergence."
  3.  **The Political Pressure Valve:** Step 4 relies on the forecaster having the backbone to tell an Emergency Manager "no." In many agencies, the culture punishes uncertainty. The procedure tells you what is *scientifically* responsible, but it cannot protect you from what is *politically* expedient.
  4.  **The False Precision of Bounds:** When I tell you to issue a range (e.g., 13.8–15.2 ft), users often treat the bounds as hard limits (i.e., "It won't exceed 15.2"). In chaotic systems, tails are fat. The true value can outside your range. The procedure mitigates this, but does not eliminate it.

  Ultimately, this procedure shifts the burden of proof. Instead of the decision-maker proving the forecast is uncertain, the forecaster must prove the forecast is stable. If you cannot prove stability within 20 minutes, you default to uncertainty.

  Summary: This procedure forces forecasters to prove predictability through timescale, forcing, and non-linearity checks before issuing a single number, defaulting to ranges when stability cannot be demonstrated within operational constraints.
