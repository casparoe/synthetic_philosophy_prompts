      *   **Audience:** Senior Hydrologist at a regional flood forecasting agency (technical but needs operational utility).
      *   **Problem:** Deterministic models are chaotic; pressure exists for single-number forecasts; need a principled way to decide *when* a single number is responsible vs. irresponsible.
      *   **Constraints:** One forecaster on duty, ~20 mins per request, no new ensembles, no pre-computed Lyapunov exponents/structural error estimates.
      *   **Deliverables:**
          1.  Brainstorming on how deterministic forecasts fail.
          2.  A decision procedure (checklist).
          3.  Application to three specific cases (36h flood, 7-day reservoir, 30-day seasonal).
          4.  Honest admission of limitations/judgement calls.
          5.  Note on where the procedure misfires.
          6.  **Specific Constraint:** The very last line must be a one-sentence summary beginning with "Summary:".

  2.  **Brainstorming: How Deterministic Forecasts Go Wrong:**
      *   *Initial Condition Sensitivity (Butterfly Effect):* Small errors in soil moisture/rainfall grow exponentially. Implies: Single numbers are lies beyond the Lyapunov time.
      *   *Model Structural Error:* The equations themselves are wrong (e.g., infiltration physics). Implies: Even with perfect ICs, the trajectory is wrong. Single numbers are biased.
      *   *Forcing Uncertainty:* QPF (Quantitative Precipitation Forecast) is the biggest driver. If rain is wrong, flow is wrong. Implies: Deterministic hydrology is only as good as deterministic meteorology.
      *   *Bifurcation/Regime Change:* The system might switch states (e.g., saturated vs. unsaturated soil). Implies: Non-linear jumps make interpolation dangerous.
      *   *Predictability Horizon:* The time where signal-to-noise ratio drops below 1. Implies: Beyond this, the mean of the distribution is less useful than the bounds.

      *Implication for Single Numbers:* A single number implies precision and confidence. If the error distribution is bimodal or extremely wide, the mean (deterministic run) might be a value that never actually occurs. Issuing it is ethically questionable if it drives high-stakes decisions (evacuation vs. hold).

  3.  **Developing the Decision Procedure (The "Chaos Check"):**
      *   *Goal:* Filter requests based on predictability, not just policy.
      *   *Constraint Check:* 20 minutes, no new ensembles.
      *   *Workaround:* Use "perturbed history" or "lagged averages" as a proxy for ensemble spread if formal ensembles aren't available. Use heuristic thresholds based on basin memory.
      *   *Steps:*
          1.  **Timescale Check:** Compare lead time to basin response time (memory).
          2.  **Forcing Stability Check:** How confident is the QPF? (Deterministic vs. Probabilistic met guidance).
          3.  **State Sensitivity Check:** Is the basin near a threshold (saturation)?
          4.  **Consequence Check:** What happens if we are wrong? (Values judgment).
          5.  **Output Format Decision:** Single number, Range, or Scenario.

      *Refining the "Lyapunov" aspect without the math:* Since we don't have $\lambda$, we use "Error Doubling Time" heuristics based on historical forecast error growth.
      *Refining the "Values" aspect:* The mathematician defines the *risk*, the human defines the *tolerance*.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Lead Time vs. Basin Memory.* If Lead Time > 3x Concentration Time, single number is suspect.
      *   *Step 2: Input Uncertainty.* If QPF is "probabilistic" or high variance, hydro can't be deterministic.
      *   *Step 3: Non-linearity Check.* Is the soil near saturation? (High gain state).
      *   *Step 4: The "Cost Function" Handoff.* If the cost of False Alarm $\neq$ Cost of Miss, single number is dangerous.
      *   *Stop Rule:* If 2+ red flags, no single number.

  5.  **Running the Cases:**
      *   *Case 1: 36h Flood.* Short lead time. High stakes. Rain ongoing (known input). Basin responding. *Verdict:* Single number *might* pass, but needs confidence bounds. Actually, given "ongoing storm," initial conditions are uncertain (rain gauges lag). Let's make it pass but with a warning.
      *   *Case 2: 7-day Reservoir.* Medium lead time. Drought (low flow, high sensitivity to small errors?). Water manager wants *one* volume. 7 days is often beyond the reliable QPF horizon. *Verdict:* Fail. Do not issue single number. This is the "answer we won't like."
      *   *Case 3: 30-day Seasonal.* Long lead time. Climate drivers, not weather. *Verdict:* Hard Fail. Single number is fiction. Issue percentiles.

  6.  **Addressing the "Honesty" Constraint:**
      *   Must admit that steps like "Is the QPF stable?" are subjective without a formal metric.
      *   Must admit that "Consequence Check" pushes the burden back to the forecaster's gut.

  7.  **Final Review against Constraints:**
