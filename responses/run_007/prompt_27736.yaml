      *(Refining the 7-day case)*: Why is this the hard one? Because reservoir managers *need* a number for optimization algorithms. Giving them a range breaks their spreadsheet. I need to be firm: breaking their spreadsheet is better than draining the reservoir based on a lie.

      *(Refining the Final Line)*: Must be exactly one sentence starting with "Summary:".

  9.  **Final Polish:** Check the voice. Ensure it sounds like an applied mathematician talking to a hydrologist. Use terms like "phase space," "attractor," "sensitivity," but explain them operationally.

