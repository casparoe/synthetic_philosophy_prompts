      *   *The Mechanism:* Explain *why* it works. It shifts the burden from "prove X is true" to "prove X is unavoidable."
      *   *Legitimacy (The Hard Part):*
          *   The user hit the nail on the head: *Psychological* vs. *Logical/Transcendental* necessity.
          *   *Legit:* The truth of $X$ is a necessary condition for the *intelligibility* or *validity* of the denial. (e.g., Logic).
          *   *Illegit:* The *belief* in $X$ is a condition for the *motivation* to deny it, or the argument conflates the *act* with the *truth*. (e.g., Free Will - I can deterministically output a statement).
      *   *Evaluation Criteria:*
          1.  **Content vs. Performance:** Does the *meaning* contradict the *act*, or just the *motivation*?
          2.  **Necessity:** Is $X$ truly necessary, or just contingent?
          3.  **Scope:** Does proving the *practice* is unavoidable prove the *theory* is true? (The Naturalistic Fallacy of Epistemology).
      *   *Examples:*
