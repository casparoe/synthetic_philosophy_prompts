answer: |-
  You have identified one of the most potent and controversial moves in the history of philosophy. You are right to suspect that while the structure looks the same in every case, the quality varies wildly from profound insight to cheap sophistry.

  Here is the breakdown of the terminology, the philosophical tradition behind it, and the criteria for distinguishing the legitimate uses from the rhetorical tricks.

  ### 1. The Terminology

  There isn't just one name, because philosophers focus on different aspects of the move. The three most common labels are:

  **A. Performative Contradiction (or Pragmatic Self-Refutation)**
  This describes the *structure* of the argument. A statement is performatively contradictory if the *act* of asserting it contradicts the *content* of the assertion.
  *   *Example:* Saying "I am not speaking." The content denies the performance.
  *   *Your example:* "Reason is unreliable." The performance (arguing) relies on the reliability of reason.

  **B. Transcendental Argument**
  This describes the *philosophical strategy*. Originating with Kant, this argument form claims that $X$ is a necessary condition for the possibility of $Y$. Since $Y$ (experience, language, argumentation) undeniably exists, $X$ must also exist.
  *   *Form:* "For experience/argument $E$ to be possible, condition $C$ must be true. $E$ is actual. Therefore, $C$ is true."

  **C. Argument from Retorsion**
  This is the older, scholastic term. It means "turning back." You take the opponent's argument and turn it back on them to show that it defeats itself. Aristotle used this famously to defend the Law of Non-Contradiction.

  ---

  ### 2. The Principled Line: Legitimate vs. Trick

  You hit the nail on the head regarding the difference between **psychological preconditions** and **logical preconditions**. This is exactly where the line is drawn.

  To evaluate whether the move is legitimate or a trick, you need to check for three specific failures.

  #### Failure Mode 1: The "Psychological vs. Metaphysical" Confusion
  This is the most common trick, especially regarding Free Will.
  *   **The Move:** "You cannot argue against free will because choosing to argue presupposes free will."
  *   **The Problem:** This conflates the *phenomenology* of choice (it feels like I'm choosing) with the *metaphysics* of choice (I could have done otherwise).
  *   **Why it fails:** A deterministic robot could be programmed to output the sentence "Free will is an illusion." The robot does not need free will to make the claim; it only needs causal machinery. The arguer is confusing "I must *feel* free to argue" with "I must *be* free to argue."
  *   **Verdict:** **Illegitimate.** It proves we must *act as if* we have free will, not that we *do*.

  #### Failure Mode 2: The "Practice vs. Theory" Gap
  This often happens with the External World or Induction.
  *   **The Move:** "You can't deny the external world because you interact with it to type your objection."
  *   **The Problem:** This proves that we are *committed* to a practice, not that the practice is *true*.
  *   **Why it fails:** Hume admitted this. He agreed that we cannot help but believe in causation and the external world in daily life (nature forces us to). But he argued that this psychological inevitability does not constitute a *logical proof* that the external world exists or that induction is valid. We might be hardwired to be wrong (like a brain in a vat hardwired to believe it has a body).
  *   **Verdict:** **Mixed.** It successfully shows skepticism is *unlivable*, but fails to show skepticism is *false*.

  #### Failure Mode 3: The "Stolen Concept"
  This is the strongest, most legitimate version. It occurs when the denial of $X$ explicitly uses $X$ as a rule of inference.
  *   **The Move:** "The Law of Non-Contradiction is false."
  *   **Why it works:** To argue that the Law of Non-Contradiction is false, you must assert that your argument is *true* and the opposing view is *not true*. You are using the very law you are denying to frame the denial. You are "stealing" the concept to attack it.
  *   **Verdict:** **Legitimate.** This is logically airtight because the contradiction is internal to the logic of the assertion, not just the psychology of the asserter.

  ---

  ### 3. A Checklist for Evaluation

  When you encounter this argument move, run it through these three questions to see if it's deep or cheap.

  **1. Is the presupposition logical or causal?**
  *   *Legit:* "I cannot formulate the sentence 'Logic is fake' without using logic." (Logical necessity)
  *   *Trick:* "I cannot care enough to argue 'Logic is fake' unless I believe logic works." (Causal/Psychological necessity)
  *   *Test:* Could a non-free, non-believing mechanism produce the same output? If yes, the argument fails.

  **2. Does it prove Truth or just Inevitability?**
  *   *Legit:* Shows that denying $X$ makes the denial meaningless (truth-apt).
  *   *Trick:* Shows that denying $X$ is annoying, difficult, or unnatural.
  *   *Test:* Does the argument show the skeptic is *wrong*, or just that they are *inconvenient*? Transcendental arguments often prove we are *warranted* in believing $X$, not necessarily that $X$ corresponds to mind-independent reality.

  **3. Is the scope universal or specific?**
  *   *Legit:* Defending the tools of thought themselves (Logic, Reason, Existence).
  *   *Trick:* Defending specific contentions (God, Free Will, Morality).
  *   *Test:* The closer you get to the "rules of the game" (logic), the stronger the argument. The closer you get to "moves in the game" (theology, metaphysics), the weaker it becomes.
      *   *Defending Logic:* Very Strong. (You can't deny logic without logic).
      *   *Defending God (Transcendental Apologetics):* Very Weak. (You can use logic without presupposing the Christian God, or any God).

  ### 4. Historical Context & Names to Search

  If you want to read more about the "good" versions vs. the "bad" versions, look up these figures:

  *   **Aristotle (Metaphysics, Book Gamma):** The originator. His defense of the Law of Non-Contradiction via *retorsion* is considered the gold standard of the legitimate version.
  *   **Immanuel Kant:** He invented the **Transcendental Argument**. He used it to show that space, time, and causality are necessary conditions for experience. (Legitimate, though debated).
  *   **P.F. Strawson:** In *The Bounds of Sense*, he tries to rehabilitate Kant. He argues we are committed to certain concepts (like "object") to make sense of experience. This is a sophisticated, moderate version of the move.
  *   **Cornelius Van Til / Greg Bahnsen:** They developed **Presuppositional Apologetics**. They argue that logic and science presuppose the Christian God. Most secular philosophers consider this the "cheap trick" version of the transcendental argument (committing Failure Mode #3 above).
  *   **Jacques Derrida:** Interestingly, deconstructionists use **Performative Contradiction** against metaphysicians. They argue that claiming "there is no truth" is a truth claim. (Though Derrida would argue he is aware of the contradiction and uses it strategically).

  ### Summary

  The move is called a **Transcendental Argument** or an argument from **Performative Contradiction**.

  *   **It is legitimate** when the truth of $X$ is a *logical precondition* for the intelligibility of the denial (e.g., Logic, Existence).
  *   **It is a trick** when it conflates the *act* of arguing with the *truth* of the premises, or confuses *psychological inevitability* with *metaphysical necessity* (e.g., Free Will, God).

  Your intuition was correct: the difference lies in whether the opponent is **sawing off the branch they are sitting on** (logical impossibility) or just **complaining about the tree** (psychological discomfort).
