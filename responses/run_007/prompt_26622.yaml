answer: |-
  Your intuition that the two sides are talking past each other is sharp, but the diagnosis of "descriptive psychology vs. normative aesthetics" might be slightly off the mark. Both camps are actually making normative claims about what *ought* to constitute aesthetic value; the stalemate persists because they are operating with incompatible **ontologies of the artwork**.

  Here is the deeper diagnosis of why this debate is stuck, where the substantive disagreement actually lies, and whether it can be moved.

  ### 1. The Ontological Rift, Not Just Normative
  You suggest one side asks "what do people value?" (descriptive) and the other asks "what should they value?" (normative). In reality, both sides are arguing about what the artwork *is*.

  *   **The Empiricist/Formalist Camp:** They define the artwork primarily as a **perceptual object**. For them, the "work" is the configuration of lines, colors, and shapes presented to the eye. If you strip away the provenance, the object remains the same; therefore, the aesthetic value (which resides in the experience of that object) must be the same. To them, valuing the original is an "external" preference (like valuing a signed baseball over an unsigned one), not an *aesthetic* one.
  *   **The Contextualist/Goodman Camp:** They define the artwork as a **historical action** or an **achievement**. For them, the physical canvas is merely the trace of a performance. When you look at a Vermeer, you are looking at a specific moment in art history where a human being solved certain pictorial problems. A forgery, no matter how perfect, is a different action (the action of deceiving, or the action of copying). Therefore, the "object" you are evaluating is fundamentally different, even if the retinal image is identical.

  Because they disagree on the identity conditions of the work itself, they cannot agree on where the value is located. It is not that one side is doing psychology and the other ethics; it is that they are evaluating two different things while using the same label ("the painting").

  ### 2. The Epistemological Dispute (Goodman's Specific Claim)
  There is a substantive disagreement you might be underestimating, specifically regarding Nelson Goodman's argument in *Languages of Art*. You noted that "nobody disputes that the two paintings look identical." Goodman actually **does** dispute this, but in a subtle, temporal way.

  Goodman argues that aesthetic perception is cognitive, not just sensory. He claims that knowing one painting is a forgery trains the eye to look for differences. Even if we cannot see a difference *now*, the knowledge that there *is* a difference (in history of production) changes the status of the object from "standard" to "counterfeit," which alters our perceptual engagement. He argues that perceptual indistinguishability is not a static fact but a temporary epistemic limitation. For Goodman, the forgery is aesthetically inferior *because* it forces us to look at it differently (as a copy), which changes the phenomenology of the experience. The Empiricist rejects this, insisting that if the qualia are identical, the aesthetic experience is identical. This is a genuine philosophical deadlock regarding the relationship between knowledge and perception.

  ### 3. Can the Debate Be Moved?
  This dispute is unlikely to be "solved" in the sense that one side will concede, because both definitions of art serve different cultural functions. However, the debate can be dissolved through **Conceptual Pluralism**.

  We can move forward by admitting that "aesthetic value" is a cluster concept that conflates at least three distinct values:
  1.  **Sensory Value:** The quality of the visual experience (where forgery = original).
  2.  **Art-Historical Value:** The significance of the object's place in the timeline of artistic development (where forgery < original).
  3.  **Achievement Value:** The admiration for the skill and intent of the creator (where forgery < original).

  The stalemate exists because the Empiricists are defending *Sensory Value* while the Contextualists are defending *Art-Historical* and *Achievement Value*, yet both insist on calling it "Aesthetic Value." If we agree to disaggregate these, the tension vanishes. We can admit a perfect forgery is visually sublime but historically fake without contradiction.

  ### Conclusion
  The debate persists because we demand a single metric for "artistic value" when we are actually juggling distinct categories of appreciation. The Empiricists are protecting the autonomy of the visual experience from being swallowed by biography, while the Contextualists are protecting the integrity of art history from being reduced to mere decoration. Neither is wrong, but they are answering different questions.

  Diagnosis: The stalemate arises from an ontological ambiguity where one side defines the artwork as a perceptual object and the other as a historical action, making their evaluative criteria incommensurable.
