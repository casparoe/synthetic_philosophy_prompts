prompt: |-
  I work as a policy analyst for a state legislative committee, and every session we sit through testimony where advocates lean hard on thought experiments — the ticking bomb to justify surveillance powers, the lifeboat to argue about how to ration scarce resources, the tragedy of the commons to justify regulation or privatization, that sort of thing. Some of these seem to genuinely clarify a tradeoff, and others seem to just make one option feel inevitable by the time the story is over, and I honestly can't always tell which is happening until it's too late. I've seen the term intuition pump used as an insult in the comments on our public hearings, but nobody in my office could give you an actual criterion. We process maybe a dozen of these arguments a week during session, none of us have philosophy training, and we have to turn our notes into a one-page memo for the committee chair by the next morning, and she will not accept 'this felt manipulative' as a reason to discount somebody's testimony. If we get it wrong, actual legislation gets drafted on the back of an intuition.

  So I'd like a reusable procedure we can run: a checklist or ordered sequence of questions for deciding whether a thought experiment in a policy argument is doing real argumentative work or just pumping intuitions — with what counts as a sufficient answer at each step, where the procedure says 'discount this argument,' and where it has to hand the decision to a philosopher becuase the question is substantive rather than procedural. Then run the procedure on two or three concrete cases: for example, a surveillance bill defended with a ticking-bomb scenario, and a healthcare rationing argument that leans on a lifeboat story. Include at least one case where the procedure tells us to disregard an argument the committee is inclined to love, and be explicit about where the procedure itself breaks down or quietly smuggles in judgment calls dressed up as method.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Policy analyst for a state legislative committee.
      *   **Problem:** Advocates use thought experiments (ticking bomb, lifeboat, tragedy of the commons) during testimony. Some clarify tradeoffs; others manipulate intuition ("intuition pumps"). The team lacks philosophy training and needs a concrete, reusable procedure to distinguish the two for memos to the Committee Chair. "This felt manipulative" is not acceptable justification.
      *   **Deliverables:**
          1.  A reusable procedure (checklist/ordered sequence of questions).
          2.  Criteria for sufficient answers at each step.
          3.  Decision points (discount argument vs. pass to philosopher/substantive review).
          4.  Application of the procedure to 2-3 concrete cases (Surveillance/Ticking Bomb, Healthcare/Lifeboat, plus one where the committee might like the argument but should discount it).
          5.  Meta-analysis: Where the procedure itself breaks down or smuggles in judgment calls.
      *   **Constraints:** Needs to be practical for non-philosophers, actionable within a tight timeline (overnight memo), and honest about limitations.

  2.  **Deconstruct "Intuition Pumps" vs. Valid Thought Experiments:**
      *   *Daniel Dennett's concept:* An intuition pump is a rhetorical device designed to elicit a specific intuitive response that bypasses rigorous analysis. It often relies on vividness, emotional loading, or hidden assumptions.
      *   *Valid Thought Experiment:* Isolates variables to test a principle, is generalizable, acknowledges counterfactuals, and connects clearly to the policy mechanism.
      *   *Key Differences:* Specificity vs. Vagueness, Emotional Loading vs. Neutral Framing, Connection to Reality vs. Extreme Hypothetical, Scope of Application.

  3.  **Drafting the Procedure (The "Intuition Pump Audit"):**
      *   Need a step-by-step workflow.
      *   *Step 1: Reconstruction.* Can we state the argument without the story? (If no, it's hiding something).
      *   *Step 2: Variable Isolation.* Does the story change details to force a result? (If yes, suspect).
      *   *Step 3: Probability & Prevalence.* Is the scenario probable or an outlier? (Ticking bombs are rare; policy should address common cases).
      *   *Step 4: Mechanism Match.* Does the proposed policy actually solve the specific problem in the story? (Often the policy is broad, the story is narrow).
      *   *Step 5: Reversibility.* Does the intuition hold if we swap the actors or context?
      *   *Decision Rules:* If it fails Step 1 or 4, discount. If it fails Step 3, flag as "Edge Case." If it passes all, it's substantive.

  4.  **Developing the Test Cases:**
      *   *Case 1: Surveillance/Ticking Bomb.* Classic intuition pump. Usually fails on probability and mechanism match (broad surveillance vs. specific threat).
      *   *Case 2: Healthcare/Lifeboat.* Rationing. Often used to justify rigid criteria. Need to see if it clarifies triage or justifies denial of care.
      *   *Case 3: The "Committee Favorite."* Needs to be something they *want* to believe. Maybe a "Broken Windows" policing argument or a "Tax Cut Growth" engine story. Let's go with a "Regulatory Chill" story (a small business crushed by one form) to argue against reporting requirements. It appeals to pro-business legislators but is often an outlier.

  5.  **Refining the Procedure for the User's Context:**
      *   Make it look like a checklist they can copy-paste.
      *   Use plain language, not philosophical jargon.
      *   Define "Pass," "Fail," and "Escalate."
      *   *Crucial:* Address the "Philosopher Escalation" point. Realistically, state legislatures don't have on-call philosophers. I need to define what "Escalate" means in this context (e.g., flag for deeper legal/fiscal review rather than metaphysics). *Correction:* The prompt asks where to hand it to a philosopher *because the question is substantive*. I should acknowledge that in a state legislature, this usually means "Flag as Normative/ethical dispute, not empirical fact."

  6.  **Addressing the Meta-Analysis (Limitations):**
      *   The checklist itself relies on judgments (e.g., what counts as "probable"?).
      *   It privileges utilitarian/empirical framing over deontological/ethical framing.
      *   It might discourage necessary moral imagination.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. Validate their experience.
      *   *The Tool:* "The Thought Experiment Stress Test (TEST)." 5 Steps.
      *   *Step 1 (Translation):* Can you translate the story into a conditional statement? (If X, then Y).
      *   *Step 2 (Frequency):* Is X common or rare?
      *   *Step 3 (Proportionality):* Does the policy response fit the story's scale?
      *   *Step 4 (Hidden Variables):* Are there emotional details irrelevant to the logic?
      *   *Step 5 (Reversal):* Does it work if the villain is the state?
      *   *Application:*
          *   Surveillance: Fails Frequency and Proportionality.
          *   Lifeboat: Fails Translation (hides the criteria for who gets off).
          *   Small Biz/Regulation (Committee Favorite): Fails Frequency (anecdotal vs systemic).
      *   *Meta-Critique:* Where does the TEST fail? It assumes policy is about efficiency, not values. It can't resolve moral disagreements, only expose rhetorical tricks.

  8.  **Review against Constraints:**
      *   *Reusable?* Yes, checklist format.
      *   *Sufficient answers?* Defined (e.g., "Must be translatable to If/Then").
      *   *Discount vs. Escalate?* Defined.
      *   *Concrete cases?* Yes (Surveillance, Lifeboat, Small Biz).
      *   *Committee Favorite?* Yes (Small Biz/Regulation).
      *   *Meta-analysis?* Yes, included at the end.

  9.  **Final Polish:**
      *   Tone: Professional, empathetic to the analyst's burden, rigorous but accessible.
      *   Formatting: Use bolding, lists, and clear headers for scanability (since they are tired analysts).
      *   *Self-Correction on "Philosopher":* I need to be careful not to suggest they actually call a philosophy department. I will frame "Escalate to Philosopher" as "Flag as Normative Dispute" because that's the bureaucratic equivalent. *Wait, the prompt explicitly asks:* "where the procedure says... hand the decision to a philosopher because the question is substantive rather than procedural." I must honor this constraint even if it's unrealistic, perhaps by defining what *kind* of substantive question warrants external ethical review (e.g., university ethics board or legislative counsel on constitutional rights). I will stick to the prompt's instruction but add a practical note.

  10. **Final check of the "Small Biz" case:** Make sure it's one they would *love*. Legislators usually love stories about cutting red tape. So a story about a bakery closing due to a form is perfect. The procedure should show why this is an intuition pump against necessary regulation.

  11. **Final check of Limitations:** Ensure I admit that the checklist itself is a "frame" that privileges certain types of reasoning (empirical/probabilistic) over others (moral/symbolic).

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a high-stakes request. You are asking for a tool to separate *rhetorical coercion* from *conceptual clarification* under time pressure, without the benefit of philosophical training. The term "intuition pump," coined by Daniel Dennett, refers to a narrative device designed to elicit a specific emotional or intuitive response that bypasses critical scrutiny.

  Below is a procedural tool designed for legislative staff. It is not perfect (no procedure is), but it is designed to be auditable. If you discount an argument using this tool, you can show the Chair *why* based on procedural failures, not just a "feeling."

  ### The Thought Experiment Stress Test (TEST)

  **Purpose:** To determine if a hypothetical scenario presented in testimony supports the specific policy mechanism proposed, or if it relies on emotional vividness to bypass scrutiny of probability and scope.
  **Time Required:** 5–10 minutes per argument.
  **Output:** A checkbox section for your memo ("Testimony Reliability Assessment").

  #### Step 1: The Translation Check
  **Question:** Can the story be translated into a standard conditional statement without losing its persuasive force?
  *   *Format:* "If [Condition X] occurs, then [Policy Y] is necessary to prevent [Harm Z]."
  *   **Pass:** The story maps cleanly to the If/Then structure.
  *   **Fail:** The story relies on specific names, vivid sensory details, or unique circumstances that vanish when translated. (e.g., "The little girl named Sarah" vs. "A pediatric patient").
  *   **Action:** If **Fail**, discount the narrative weight. The argument is relying on *vividness*, not logic.

  #### Step 2: The Base Rate Check
  **Question:** Is the [Condition X] in the story a frequent occurrence or a statistical outlier?
  *   **Sufficient Answer:** Must cite empirical data or acknowledge the rarity.
  *   **Pass:** "This happens in 15% of cases," or "This is rare, but the severity justifies preparation."
  *   **Fail:** The witness treats a "black swan" event (extremely rare, high impact) as if it were a routine administrative problem.
  *   **Action:** If **Fail**, flag as "Edge Case Justification." Policy based on outliers often creates inefficient systems for common cases.

  #### Step 3: The Mechanism Match
  **Question:** Does the proposed policy actually solve the specific problem in the story, or does it solve a broader problem that *includes* the story?
  *   **Sufficient Answer:** Must explain the causal link between the specific story and the general rule.
  *   **Pass:** The policy targets the specific mechanism of harm in the story.
  *   **Fail:** The story is specific (one bomber), but the policy is dragnet (mass surveillance). The story proves a *power* is useful, not that the *scope* is justified.
  *   **Action:** If **Fail**, discount the argument as "Over-broad Justification."

  #### Step 4: The Variable Swap (Reversibility)
  **Question:** If we swap the actors or context, does the intuition hold?
  *   **Sufficient Answer:** The logical principle remains consistent regardless of who holds the power.
  *   **Pass:** "If the state can do X to a terrorist, they can do X to a corrupt official."
  *   **Fail:** The intuition collapses when the "good guy" becomes the "bad guy" or vice versa.
  *   **Action:** If **Fail**, flag as "Partisan Intuition Pump." The argument relies on trust in specific actors, not institutional design.

  #### Step 5: The Hidden Premise
  **Question:** What moral or empirical claim is assumed to be true *inside* the story that is actually the point of contention?
  *   **Sufficient Answer:** Identification of the contested premise.
  *   **Pass:** The witness acknowledges the premise is debatable (e.g., "We assume saving the many outweighs the rights of the one").
  *   **Fail:** The story is structured so that denying the conclusion makes you look immoral (e.g., "Would you let the child die?").
  *   **Action:** If **Fail**, **ESCALATE.** This is a substantive normative dispute, not a procedural one. Do not discount; flag for Legal/Ethics review.

  ---

  ### Decision Matrix

  | Result | Memo Recommendation |
  | :--- | :--- |
  | **Passes 1–5** | **Substantive.** The thought experiment clarifies a tradeoff. Weight the testimony heavily. |
  | **Fails 1, 3, or 4** | **Discount.** The argument is rhetorically manipulative. Note "Failure of Mechanism Match" or "Reliance on Vividness." |
  | **Fails 2** | **Qualify.** The argument is valid only for emergency provisions, not standard operating procedure. |
  | **Fails 5** | **Escalate.** The argument rests on a contested moral axiom. Flag for Committee Counsel or external ethical review. |

  ---

  ### Application Cases

  Here is the TEST applied to three scenarios you might face.

  #### Case 1: The Surveillance Bill (The Ticking Bomb)
  **Testimony:** An intelligence advocate argues for warrantless data retention. They describe a scenario: "A terrorist has planted a nuclear device in the capital. It will detonate in 30 minutes. We have a phone number but no name. If we have to wait for a judge to sign a warrant, 500,000 people die. Do you want to be the bureaucrat who signed the warrant?"
  **Committee Inclination:** High anxiety. Inclined to vote Yes.

  *   **Step 1 (Translation):** "If a nuclear threat exists (X), then warrantless access (Y) prevents mass death (Z)." -> **Pass.**
  *   **Step 2 (Base Rate):** How often do nuclear devices detonate in state capitals? Never in US history. The witness offers no data on frequency. -> **Fail.**
  *   **Step 3 (Mechanism Match):** The story justifies accessing *one* phone number quickly. The bill authorizes *mass retention* of *all* metadata for *five years*. The story does not justify the scope. -> **Fail.**
  *   **Step 4 (Variable Swap):** If the state used this data to track political donors instead of terrorists, would the witness support it? They usually say no. -> **Fail.**
  *   **Step 5 (Hidden Premise):** Assumes "Security always trumps Privacy." -> **Fail (Escalate).**

  **Memo Recommendation:** **Discount.**
  **Reasoning:** Fails Base Rate and Mechanism Match. The testimony uses a zero-probability event to justify a high-cost, broad-scope policy. The "Ticking Bomb" proves a need for *expedited* warrants, not *warrantless* retention.
  **Note:** This tells the Chair to disregard an argument they are inclined to love (Security).

  #### Case 2: Healthcare Rationing (The Lifeboat)
  **Testimony:** A hospital administrator argues against a mandate to cover experimental treatments. They describe a lifeboat with 10 seats and 11 passengers. "If we try to save everyone, the boat sinks and all die. We must have criteria to decide who gets the seat. This bill forces us to take the 11th passenger."
  **Committee Inclination:** Fiscally conservative. Inclined to vote Yes (limit coverage).

  *   **Step 1 (Translation):** "If resources are scarce (X), then rationing criteria (Y) prevents total system collapse (Z)." -> **Pass.**
  *   **Step 2 (Base Rate):** Is healthcare a zero-sum lifeboat? In this specific budget context, maybe. But is the "11th passenger" actually dying, or just costing more? -> **Qualify.**
  *   **Step 3 (Mechanism Match):** The bill denies *experimental* coverage. The lifeboat story implies denying *any* care to save the group. Does denying experimental care actually save the "boat" (the budget)? The witness hasn't shown the cost savings. -> **Fail.**
  *   **Step 4 (Variable Swap):** If the 11th passenger was the witness's child, would the criteria hold? (Irrelevant emotionally, but logically: Does the criteria apply to the wealthy?) -> **Pass.**
  *   **Step 5 (Hidden Premise):** Assumes "System Solvency trumps Individual Chance of Survival." -> **Fail (Escalate).**

  **Memo Recommendation:** **Escalate to Counsel.**
  **Reasoning:** Fails Step 5. This is not a procedural failure; it is a substantive ethical dispute about the purpose of the insurance pool. The thought experiment clarifies the tradeoff (Solvency vs. Individual Care) but does not resolve it. The Committee must vote on the *value*, not the *logic*.
  **Note:** This prevents the staff from making a moral call. It forces the politicians to own the ethical choice.

  #### Case 3: Deregulation (The Bakery)
  **Testimony:** A small business owner argues against a new reporting requirement. "I run a bakery. I spent 40 hours filling out Form 12-B. I couldn't bake bread. I had to lay off my sister. This regulation kills jobs."
  **Committee Inclination:** Pro-business. Inclined to vote Yes (deregulate).

  *   **Step 1 (Translation):** "If reporting requirements exist (X), then small businesses fail (Y)." -> **Pass.**
  *   **Step 2 (Base Rate):** Is this bakery representative? Or is it an outlier with poor management? No data provided on average compliance time. -> **Fail.**
  *   **Step 3 (Mechanism Match):** The bill allows for digital filing to reduce time. The story assumes paper/manual filing. The policy solves the problem the story complains about. -> **Fail.**
  *   **Step 4 (Variable Swap):** If the reporting prevented food poisoning that closed the bakery, is it worth it? -> **Pass.**
  *   **Step 5 (Hidden Premise):** Assumes "Regulatory Cost is always net negative." -> **Fail (Escalate).**

  **Memo Recommendation:** **Discount.**
  **Reasoning:** Fails Base Rate and Mechanism Match. This is an "Anecdotal Intuition Pump." It uses a specific, solvable inefficiency (manual filing) to argue against the principle of reporting.
  **Note:** This tells the Chair to disregard an argument they *really* want to love (Pro-Business/Small Guy).

  ---

  ### Meta-Analysis: Where This Procedure Breaks Down

  You asked for honesty about where the tool smuggles in judgment calls. As a policy analyst, you need to know the blind spots of your own checklist.

  **1. The Empiricism Bias**
  The TEST privileges empirical claims (Base Rates, Mechanism Match) over normative claims. It treats "Is this probable?" as more important than "Is this right?"
  *   *The Risk:* A thought experiment might be statistically rare (e.g., a specific type of civil rights violation) but morally catastrophic. The TEST might tell you to "Discount" a human rights argument because the base rate is low, effectively silencing minority concerns that don't show up in aggregate data.
  *   *The Fix:* When Step 2 (Base Rate) fails, do not automatically Discount. Check if the Harm (Z) is irreversible (death, loss of rights). If yes, treat low probability as high risk.

  **2. The Status Quo Default**
  Step 3 (Mechanism Match) assumes the *proposed* policy must match the story. But sometimes the story reveals a flaw in the *current* system that the new policy attempts to fix broadly.
  *   *The Risk:* The tool favors incrementalism. A radical solution to a specific problem might fail Step 3 because it looks "over-broad," even if the specific problem indicates a systemic rot.
  *   *The Fix:* Use Step 3 to narrow the *drafting*, not necessarily kill the *idea*. If the story is narrow but the problem is systemic, recommend "Narrower Drafting" rather than "Discount."

  **3. The "Philosopher" Black Box**
  I have included an "Escalate" function for Step 5 (Hidden Premise). In a state legislature, there is no philosopher on speed dial.
  *   *The Risk:* "Escalate" often means "Ignore." If you flag something as a "Normative Dispute," busy legislators may treat it as "Not our problem" or "Too hard."
  *   *The Fix:** Redefine "Escalate" in your office lexicon. It does not mean "Call a professor." It means: **"This requires a recorded vote."** Do not let this pass by voice vote or unanimous consent. Force the Committee to go on the record regarding the ethical tradeoff.

  **4. The Tool is Also an Intuition Pump**
  This checklist itself pumps the intuition that *policy should be rational, empirical, and consistent.* That is a philosophical stance (Technocratic Utilitarianism).
  *   *The Risk:* You may discount testimony that is symbolically important. Sometimes a "Lifeboat" story is told not to justify math, but to express the *feeling* of scarcity. Dismissing it as "manipulative" ignores the constituent's lived reality.
  *   *The Fix:** In your memo, distinguish between **Legislative Fact** (does the policy work?) and **Social Fact** (do people *feel* unsafe/overburdened?). Use the TEST for Legislative Fact. Do not use it to invalidate Social Fact.

  ### Summary for the Chair
  When you submit your memo, append this standard footer:

  > **Analyst Note on Testimony:** *Per committee procedure, hypothetical scenarios in testimony were assessed using the Thought Experiment Stress Test (TEST). Arguments marked "Discount" failed to establish a link between the scenario's probability and the policy's scope. Arguments marked "Escalate" rest on ethical premises requiring a recorded vote.*

  This protects you. If the legislation fails because it was based on a "Ticking Bomb" that never happens, your memo shows you flagged the Base Rate failure. If the legislation passes on moral grounds, the "Escalate" flag ensures the politicians own the moral cost.
