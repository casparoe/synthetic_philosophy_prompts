      *Self-Correction on Agreed Claims:* Make sure they aren't too weak. "Morality matters" is too weak. "Outcomes aren't enough" is better.
      *Self-Correction on Table:* Ensure the "Test Case" is something they can actually observe or agree on as a thought experiment, with divergent predictions.
      *Self-Correction on Verbal Dispute:* Be careful not to dismiss the whole debate as verbal. It's substantively important, but the *label* might be the friction point.

  7.  **Final Polish:** Check formatting requirements (boxed summary at the very end). Ensure the distinction between "right-making features" and "duty" is clear throughout.

      *(Drafting the Content)*
