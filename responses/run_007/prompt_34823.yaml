      *   *Disagreement 2: The Value of Inclination.*
          *   Side 1: Inclinations dilute worth (or are irrelevant). Duty is the only pure motive.
          *   Side 2: Inclinations (like friendship) can *be* the right reasons.
          *   Crux: Are moral reasons distinct from natural human concerns?
          *   Test: The "Overcoming Prejudice" case. Helping someone you dislike. Side 1 says high worth (duty). Side 2 says high worth (responding to humanity despite prejudice). Wait, this is an agreement case.
          *   Better Test: The "Sympathetic Philanthropist." Helps because they love helping. Side 1: No moral worth (only inclination). Side 2: High moral worth (responding to need).
      *   *Disagreement 3: The Huck Finn Case.*
          *   Side 1: Low/No moral worth (wrong motive/conception).
          *   Side 2: High moral worth (right reasons).
          *   Crux: Does erroneous moral belief undermine the creditworthiness of acting on correct non-moral reasons?
