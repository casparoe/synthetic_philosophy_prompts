      *   *Conclusion:* Yes, there is a verbal component. Side 1 cares about the *structure of the will*. Side 2 cares about the *alignment with value*. They might be talking about two different goods (Moral Sanctity vs. Moral Sensitivity).
      *   *Nuance:* It's not *purely* verbal because it affects who gets praised in real life, but the definition of the term is the root.

  6.  **Review and Refine:**
