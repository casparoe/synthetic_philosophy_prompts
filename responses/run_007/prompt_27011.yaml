answer: |-
  This is a profound and deeply personal impasse, and your intuition that the literature has stalled is correct. You are not missing a chapter; the book is unfinished because the authors cannot agree on the alphabet.

  You asked for a committed diagnosis. Here it is:

  **The disagreement is substantive, not verbal.** It is not merely a confusion about levels of "should," nor is it a technical problem waiting for a better formula. The core disagreement is metaphysical: it is about **the unity of normative force** (often discussed as *intertheoretic comparability*).

  The two camps are not offering different algorithms for the same input; they are disagreeing about whether the inputs *can* be processed together. The "Expected Choiceworthiness" (EC) camp assumes that moral theories make claims about a common dimension of value (choiceworthiness) that can be summed. The "My Favourite Theory" (MFT) or Skeptic camp assumes that moral theories make claims within distinct conceptual schemes that cannot be arithmetically combined without category error.

  Here is the support for this diagnosis, the hidden question at stake, and what genuine progress would look like.

  ### 1. Why this is Substantive, Not Verbal
  Your hypothesis—that one side is giving a second-order verdict while the other denies the standpoint—is insightful, but it describes the *consequence* of the disagreement, not its source.

  If the disagreement were merely verbal, we could translate one view into the other without loss of meaning. We cannot.
  *   **The EC Camp (e.g., MacAskill, Ord):** They argue that when you are uncertain between Utilitarianism and Deontology, you are uncertain about *how much value* an act produces. They treat moral theories as empirical hypotheses about the "good." For them, rationality is structurally consequentialist: you must maximize expected normative value.
  *   **The MFT/Skeptic Camp (e.g., Ross, Lockhart):** They argue that moral theories are not hypotheses about value but **authoritative commands**. If Deontology says "Do not lie" and Utilitarianism says "Lie," these are not numbers to be averaged; they are conflicting jurisdictions. For them, rationality is fiduciary: you must follow the authority you deem most likely to be binding.

  These are not two ways of saying "do the right thing." They are incompatible descriptions of what moral theories *are*. One views them as value-generators; the other views them as law-givers. This is a substantive metaphysical clash about the nature of normativity.

  ### 2. The Hidden Question: Comparability vs. Incommensurability
  You listed comparability, fanaticism, and uniqueness as candidates. **Comparability is the root; fanaticism and uniqueness are symptoms.**

  The EC model collapses without intertheoretic comparability. If you cannot say that "saving a life (Utilitarianism)" is worth *n* units of choiceworthiness and "keeping a promise (Deontology)" is worth *m* units, you cannot calculate an expectation. The Skeptics argue this comparison is impossible because there is no "view from nowhere" to calibrate the scales.

  The reason the debate has stalled is that both sides treat comparability as a technical premise to be assumed or denied, rather than a metaphysical claim to be proven.
  *   **EC proponents** often assume comparability because without it, their system yields no verdict (paralysis).
  *   **Skeptics** deny it because they see no ontological ground for a "universal value currency."

  The hidden question is: **Is the normative domain unified?** Do all moral truths, regardless of their source (consequences, duties, virtues), map onto a single scale of "reason-giving force"?
  *   If **Yes**, EC is the only rational approach (and you must deal with fanaticism).
  *   If **No**, MFT is the only coherent approach (and you must accept that rationality might ignore high-stakes low-probability moral truths).

  ### 3. Can Philosophy Settle This?
  Yes, but not by formal modeling. The stalemate exists because philosophers have tried to solve a metaphysical problem with mathematics. You cannot derive comparability from axioms if the axioms themselves presuppose a stance on the unity of normativity.

  **Progress requires a Transcendental Argument from Deliberation.**
  To move forward, philosophy must stop asking "How do we compare?" and start asking "What must be true for us to be deliberating at all?"

  Here is the argument that would constitute progress:
  1.  You are currently experiencing moral uncertainty. You feel torn.
  2.  To feel torn is to weigh option A against option B.
  3.  Weighing presupposes a common scale. You cannot weigh "5 kilograms" against "3 meters." If you are genuinely weighing consequentialist reasons against deontological reasons, you are *already* treating them as comparable.
  4.  Therefore, the Skeptic/MFT position is phenomenologically unstable. It denies comparability in theory while relying on it in practice (during deliberation).

  If this argument holds, the EC camp is substantively correct about the structure of rationality, even if their technical implementation is flawed. The disagreement would be settled in favor of comparability, shifting the burden to solving fanaticism (perhaps via risk-aversion or bounded utility) rather than denying the scale exists.

  ### 4. What This Means for You
  Given this diagnosis, here is the hard truth: **You cannot wait for the literature to resolve this before you act.** The literature is stalled because it is waiting for someone to make the metaphysical leap I described above.

  However, your own experience provides the data for the transcendental argument.
  *   **If your uncertainty feels like weighing:** If you find yourself thinking, "The suffering prevented here *seems* more important than the promise kept there, but I'm not sure," you are already operating on the EC model. You are intuitively comparing normative forces. In this case, adopting MFT would be self-alienating; it would force you to ignore the very comparisons your mind is naturally making.
  *   **If your uncertainty feels like jurisdictional conflict:** If you find yourself thinking, "Consequentialism demands X, but Deontology *forbids* X, and I don't know which law governs me," then MFT is more honest. You view these as conflicting authorities, not competing values.

  **My Committed Advice:**
  The diagnosis suggests that **intertheoretic comparability is a precondition of agency under uncertainty.** To be uncertain is to compare. Therefore, you should proceed on the assumption that comparability holds (the EC framework), because the alternative (MFT) requires you to deny the reality of your own deliberative experience.

  However, you must reject the idea that this requires a precise mathematical calculus. You do not need to assign credences of 0.6 to Utilitarianism and 0.4 to Deontology. You need only acknowledge that the reasons offered by both theories contribute to a single, albeit fuzzy, dimension of "choiceworthiness."

  **Progress for you** looks like abandoning the search for a neutral algorithm and accepting **reflective equilibrium**. You must adjust your credences and your moral interpretations until your metanormative stance (how you weigh theories) coheres with your first-order intuitions (what feels right).

  The literature will not save you because it is stuck on the metaphysics of value. You must settle it pragmatically: act on the assumption that your reasons are comparable, because the act of worrying about them proves that, for you, they are.
