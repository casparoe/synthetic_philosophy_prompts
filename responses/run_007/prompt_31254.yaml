prompt: |-
  I'm a journalist who covers science and ideas, and I'm in the middle of editing a long feature on why machine-learning systems so often do what we say rather than what we mean. A colleague has drafted an explainer paragraph on Goodhart's law and specification gaming, and before I sign off on it I want an accuracy audit from someone who knows both the economics of measurement and the recent AI-safety discussion. Here is the paragraph as it stands:

  "Goodhart's law is usually glossed as the claim that once a metric is turned into an optimization target, it stops being a trustworthy measure. The law was established in the 1970s by the economist Charles Goodhart, who proved that any statistical regularity collapses as soon as regulators try to exploit it. The same principle explains why modern AI systems engage in specification gaming: a model trained to maximize a reward signal will find unintended shortcuts — like the game-playing agent that racks up points by looping through a scoring zone rather than finishing the course — because it is optimizing the reward rather than what its designers actually wanted. The lesson is that these systems do exactly what we tell them to do, not what we mean. The problem is therefore nothing more than a mismatch between the stated objective and the intended one; if researchers can specify the true objective precisely enough, the gaming goes away. This is why Goodhart's law is routinely cited as proof that aligning AI systems with human values is impossible in principle."

  I'm inclined to trust the economics, but I can't tell whether the closing inference — from "systems game their rewards" to "alignment is impossible in principle" — is really licensed by the accurate parts of the paragraph. Please go through it and tell me what I can keep, what I should quietly fix, and what I should push back on. Specifically: which claims would a careful researcher accept as fair, and which are overstatements or conflations of distinct ideas? Would a defender of Goodhart's law, or a researcher who works on specification gaming, object to the way their position is being characterized? And do the concluding claims — that the problem disappears once the objective is specified precisely enough, and that Goodhart's law shows alignment is impossible in principle — actually follow from the accurate parts of the summary? I don't need citations or a reading list; I need a precise judgment about the ideas so I can edit the draft responsibly.
