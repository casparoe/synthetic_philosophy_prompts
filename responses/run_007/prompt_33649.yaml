answer: |-
  Your colleague is invoking a classic defence of instrumentalism, most famously articulated by Milton Friedman in his 1953 essay *The Methodology of Positive Economics*. The argument is seductive because it appeals to pragmatism: if it works, use it. However, your scepticism is well-founded. The map analogy is rhetorically potent but logically leaky, particularly when applied to social systems rather than physical geography.

  Here is the audit you requested.

  ### 1. The Correspondence Table

  To see where the logic holds, we must first fix the terms of the analogy.

  | **The Map (Cartography)** | **The Model (Economics)** |
  | :--- | :--- |
  | **The Map** | The Economic Model (equations, parameters) |
  | **The Territory** | The Actual Economy (social reality, transactions) |
  | **Scale** | Level of Aggregation (e.g., representative agent) |
  | **Distortions** | Simplifying Assumptions (e.g., rationality, ceteris paribus) |
  | **The Route** | Policy Prescription or Forecast |
  | **The User** | Policymaker / Central Banker |
  | **The Legend** | Mathematical Formalism / Key |
  | **North** | Numéraire / Unit of Account |

  ### 2. Where the Analogy Breaks Down

  We can divide the breakdowns into 'harmless' (stylistic differences that do not affect the logic) and 'critical' (structural differences that undermine the argument).

  #### Harmless Breaks
  *   **Medium:** A map is visual and spatial; a model is mathematical and logical. This does not matter for the epistemological argument.
  *   **Static vs. Dynamic:** While most maps are static, we can accept dynamic maps (GPS). Models are dynamic. This is not a fundamental break.
  *   **Completeness:** A map cannot show every tree; a model cannot capture every transaction. Both accept the necessity of abstraction.

  #### Critical Breaks
  *   **Independence of the Territory:**
      *   *Map:* We can verify a map against the territory independently. We can walk the ground without the map.
      *   *Model:* We cannot observe 'the economy' independently of our models. National accounts, inflation rates, and unemployment figures are themselves constructed using theoretical definitions. We are inside the territory, looking out through the model.
      *   *Impact:* **Critical.** If you cannot verify the territory independently, you cannot confirm the map is merely 'distorted' rather than fundamentally wrong.

  *   **Performativity (The Map Changes the Territory):**
      *   *Map:* Drawing a new road on a map does not move the mountain.
      *   *Model:* Publishing a model can change agent behaviour. If a model predicts a currency crisis, traders may cause one. This is the Lucas Critique in a nutshell.
      *   *Impact:* **Critical.** The 'distortions' in the model can alter the very relationships the model is trying to predict.

  *   **Nature of Distortion:**
      *   *Map:* Distortions are geometric (flattening a sphere). The underlying physics (distance, connectivity) remains true.
      *   *Model:* Assumptions are often ontological (e.g., 'households are identical'). This is not just flattening a hill; it is pretending the hill is made of cheese.
      *   *Impact:* **Critical.** Geometric distortion preserves structural relationships. False behavioural assumptions may sever causal links.

  *   **Causal Mechanism:**
      *   *Map:* A map shows correlation (proximity), not causation.
      *   *Model:* Models are used to infer causation for policy (e.g., "If we raise rates, inflation falls").
      *   *Impact:* **Critical.** You can navigate a map without knowing *why* the road exists. You cannot safely steer an economy without knowing *why* variables move.

  ### 3. What the Analogy Quietly Imports

  The map analogy smuggles in several philosophical assumptions that do the heavy lifting for your colleague's argument.

  1.  **The 'View from Nowhere':** It assumes the economist stands outside the economy, just as a cartographer stands outside the landscape. In reality, economists are participants. This imports a false sense of objectivity.
  2.  **Reversibility of Simplification:** It implies that if we wanted a 'more accurate' map, we could simply add detail (remove the assumption of identical households). In economics, adding realism often makes the model mathematically intractable or indeterminate. The simplification isn't just a choice of scale; it's often a prerequisite for the model existing at all.
  3.  **Stability of the Territory:** Maps assume the territory is stable over the period of use. Economies are complex adaptive systems; the 'laws' of the territory evolve. A map that worked in 2007 might be useless in 2008 not because the scale changed, but because the terrain liquefied.
  4.  **Instrumentalism over Realism:** It imports the idea that truth is irrelevant, only utility matters. But in engineering (and policy), knowing *why* a bridge holds matters more than knowing *that* it held yesterday. If the assumptions are false, the model may work until a regime change occurs, at which point it fails catastrophically.

  ### 4. Does the Conclusion Survive?

  **Verdict: No, not entirely.**

  Your colleague's conclusion is that *"unrealistic assumptions are fine if the predictions are good."* The map analogy makes this sound sensible. However, once the disanalogies are on the table, the conclusion becomes dangerous.

  *   **In-Sample vs. Out-of-Sample:** A model with false assumptions might fit historical data well (the map matches the old roads). But because the causal mechanisms are wrong (the 'as-if' optimisation), it will likely fail when policy changes (the territory reacts to the map).
  *   **Policy Robustness:** If you use a map that distorts distance, you might take a slightly longer route. If you use a model that distorts human behaviour, you might trigger a recession. The cost of error in economics is endogenous; the cost of error in cartography is usually just inconvenience.

  The analogy works for **forecasting** in stable times (like a weather forecast), but it fails for **structural policy**. Friedman's 'F-twist' survived for decades until the stagflation of the 1970s and the financial crisis of 2008 demonstrated that models with 'useful' but unrealistic assumptions could blind policymakers to systemic risk.

  ### 5. A Better Analogy: The Wind Tunnel

  If you wish to offer your colleague a more robust analogy, suggest the **Wind Tunnel**.

  *   **The Model:** The scale model of the car in the tunnel.
  *   **The Territory:** The actual car on the road.
  *   **The Assumptions:** The conditions of the test (e.g., no driver, no engine heat, smooth road).

  **Why it is better:**
  1.  **Relevant vs. Irrelevant Details:** In a wind tunnel, you *can* remove irrelevant details (the colour of the car, the stereo system) without affecting the aerodynamics. This validates *some* abstraction.
  2.  **Critical Mechanisms:** However, you *cannot* falsify the laws of physics. If you assume air behaves like water to make the maths easier, the test results will be useless at high speeds. This mirrors the economic assumption of 'rational expectations' or 'identical agents'.
  3.  **Extrapolation Risk:** A design that works in the tunnel might fail on the road if the tunnel didn't account for crosswinds (external shocks) or if the car's engine heat changes the airflow (endogenous feedback).

  **The Lesson:**
  You can simplify the *object* (identical households might be acceptable aggregation), but you cannot simplify the *laws of motion* (how agents react to incentives). Your colleague is defending the simplification of the laws of motion by pointing to the simplification of the object. The wind tunnel shows why that distinction matters.

  ### Summary for Your Department

  Tell your colleague the map analogy is a brilliant piece of rhetoric but a poor piece of logic. It treats the economy as a static landscape to be navigated, rather than a complex machine to be engineered.

  *   **Harmless:** The need for abstraction.
  *   **Fatal:** The inability to verify the territory independently and the risk that the model changes the behaviour of the agents.

  Unrealistic assumptions are indeed necessary, but they are not *all* equally 'fine'. Assumptions that strip away noise are maps; assumptions that falsify causal mechanisms are fairy tales. The 'F-twist' protects the latter by pretending they are the former. You are right not to trust it.
