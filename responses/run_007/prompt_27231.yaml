      *   *Argument for Continuity:* Sidgwick saw ethics as incomplete without empirical verification of the moral order. Psychical research was the scientific way to test the "religious hypothesis."
      *   *Argument for Discontinuity:* Category error. Ethics is about *ought*, psychical research is about *is*. Also, the timeline issue (interest started early) and the rigor issue (wishful thinking?).
      *   *Synthesis/Evaluation:* Weigh the two. Did the empirical evidence *actually* address the philosophical problem? Even if the *methods* were flawed, was the *motivation* rational within his system?
