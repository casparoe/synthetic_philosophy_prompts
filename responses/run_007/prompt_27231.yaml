  3.  **Drafting - Section by Section:**

      *   **Introduction:** Start with the common view (embarrassing footnote). Contrast with Sidgwick's view (integral). State the thesis: While methodological tensions exist, Sidgwick's psychical research was a rationally motivated extension of his ethical project, driven by the necessity to resolve the Dualism of Practical Reason, even if the empirical path proved a dead end.

      *   **The Ethical Context (The Dualism):** Need to clearly explain *Methods of Ethics*. Rational Egoism (maximize own good) vs. Utilitarianism (maximize universal good). They conflict. Reason cannot adjudicate without a postulate: a God or cosmic order that rewards virtue with happiness. This requires survival after death.

      *   **The Case for Continuity (Rational Motivation):** Sidgwick wasn't a credulous spiritualist; he was a rigorous empiricist. If ethics requires $X$ (moral order/survival), and $X$ is an empirical claim about the universe, then science should investigate $X$. The SPR was an attempt to bring scientific rigor to the "religious hypothesis." It wasn't faith; it was data gathering for the sake of ethical coherence.

      *   **The Case for Discontinuity (The Critique):**
          *   *Conceptual vs. Empirical:* Does finding a ghost prove Utilitarianism is binding? No. It proves survival, not necessarily moral governance.
          *   *Timeline:* He was interested in seances before finishing *Methods*. Suggests psychological need rather than philosophical deduction.
