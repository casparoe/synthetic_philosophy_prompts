      *   **Weighing the Evidence (The Pivot):**
          *   Address the timeline: Pre-dating doesn't negate the philosophical justification later found.
          *   Address the rigor: Sidgwick was actually *very* skeptical in SPR (more than many peers), hunting for fraud.
          *   Address the conceptual gap: Sidgwick knew evidence of survival wasn't proof of moral order, but it was a *necessary condition*. Without survival, the moral order is impossible. Therefore, investigating survival is investigating the possibility of the ethical solution.

      *   **Conclusion:** Reiterate thesis. It wasn't a lapse in judgment but a desperate, consistent attempt to save ethics from practical nihilism. The project failed empirically, but the motivation was philosophically sound within his system.

  4.  **Refining and Polishing:**
