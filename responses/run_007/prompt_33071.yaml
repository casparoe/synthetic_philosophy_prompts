prompt: |-
  I teach an upper-level seminar on public reason and religion in liberal democracy: sixteen students, one 75-minute session. Design a structured deliberation that makes the students feel the force of the asymmetry objection to the demand that citizens justify coercive laws with reasons that others can reasonably accept, without my lecturing on the objection first and without naming it until the debrief. Choose a contested policy—ideally one that is not so immediately personal that students cannot adopt assigned positions—on which both a religious argument and a secular comprehensive argument (for instance, an autonomy-based liberal argument or a utilitarian one) are naturally in play. The rules, roles, or constraints should be arranged so that students trying to comply with a public-reasons-only rule run into the asymmetry themselves: religious reasons are filtered out as nonpublic while secular reasons that are equally sectarian in their foundations pass without comment, and students who must translate their reasons into generally accessible terms end up doing work that others are not asked to do. Provide roles or rules, a timeline, any brief reason-cards or handouts the facilitator needs, and a debrief that maps specific moments in the exercise onto the distinction between public and nonpublic reasons, the wide view of public political culture, and the translation proviso. Also tell me what will predictably go wrong the first time I run it, including how to handle students who spot the asymmetry early, and which feature of the real debate the exercise cannot reproduce and I will need to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on public reason and religion in liberal democracy.
      *   **Class Size/Time:** 16 students, 75 minutes.
      *   **Goal:** Design a structured deliberation where students *feel* the force of the asymmetry objection to public reason (specifically the demand for public justification) without the instructor lecturing on it first or naming it until the debrief.
      *   **Mechanism:** Rules/roles must filter out religious reasons as "nonpublic" while allowing secular comprehensive reasons (e.g., Kantian autonomy, utilitarianism) to pass unchallenged. Students forced to translate religious reasons must do extra work others aren't asked to do.
      *   **Policy Topic:** Contested, not too personally visceral (to allow role-play), where both religious and secular comprehensive arguments are natural.
      *   **Deliverables:** Roles/Rules, Timeline, Handouts/Reason-Cards, Debrief Plan (mapping to public/nonpublic, wide view, translation proviso), Prediction of Failure Modes (what goes wrong, early spotters, missing features).

  2.  **Select the Policy Topic:**
      *   *Criteria:* Needs to allow religious arguments (e.g., sanctity of life, divine command) and secular comprehensive arguments (e.g., autonomy, utility) that are arguably just as foundational but treated differently under strict public reason. Needs to be distanced enough for role-play.
      *   *Option A: Abortion.* Too visceral/personal. Hard to role-play dispassionately.
      *   *Option B: Euthanasia/Assisted Dying.* Good, but often overlaps heavily with medical ethics.
      *   *Option C: Animal Slaughter/Ritual Slaughter (Shechita/Halal).* Good, but might be culturally specific.
      *   *Option D: Mandatory Vaccination.* Too recent/polarized in a non-philosophical way.
      *   *Option E: Funding for Faith-Based Social Services.* A bit dry.
      *   *Option F: Legalization of Recreational Drug Use (specifically Psychedelics or Cannabis).*
      *   *Selection:* **Mandatory End-of-Life Care Directives (Living Wills) for All Adults.**
          *   *Why?* It touches on the sanctity of life/sovereignty of God (religious) vs. bodily autonomy/paternalistic utilitarianism (secular comprehensive). It's abstract enough for role-play.
          *   *Actually, let's refine:* **State Funding for Experimental Life-Extension Therapies.**
          *   *Better:* **Mandatory Genetic Screening for Embryos (to prevent severe disability).**
          *   *Best:* **The "Conscientious Refusal" Bill.** A law requiring employers (including religious hospitals) to provide coverage for procedures they morally object to (e.g., sterilization, abortion, euthanasia).
          *   *Wait, simpler is better for a 75-min simulation:* **A Ban on Commercial Surrogacy.**
              *   *Religious Argument:* Commodification of life violates God's design/natural law.
              *   *Secular Comprehensive Argument:* Kantian autonomy (cannot sell body parts/self), or Utilitarian (exploitation of poor women).
              *   *Public Reason Counter:* Women's liberty/contract rights.
              *   *Problem:* This might make the religious side look like the *only* restrictionists.
          *   *Let's go with:* **Mandatory Civil Service Year for All Graduates.**
              *   *Religious:* Call to service/stewardship.
              *   *Secular:* Civic virtue/Utilitarian benefit.
              *   *Objection:* Liberty.
              *   *Critique:* Doesn't highlight the religious/secular asymmetry well enough.
          *   *Let's return to:* **Legalization of Physician-Assisted Dying (PAD).**
              *   *Religious:* Life is sacred/God's property.
              *   *Secular Comprehensive (Kantian):* Suicide violates duty to self / undermines human dignity.
              *   *Secular Comprehensive (Utilitarian):* Slippery slope to devaluing the elderly.
              *   *Public Reason (Pro-PAD):* Individual liberty/relief of suffering.
              *   *Fit:* This works well. Religious and Kantian arguments are structurally similar (based on comprehensive doctrines about the *good* of life) but public reason often targets the religious one more aggressively.

      *   *Decision:* **The "Dignity in Dying" Bill (Legalizing Physician-Assisted Dying).**
      *   *Rationale:* It allows for a "Sanctity of Life" argument (Religious) and a "Human Dignity/Autonomy" argument (Secular Comprehensive/Kantian) that both oppose the bill, while the "Liberty/Compassion" argument supports it. The asymmetry arises when the facilitator (acting as the "Public Reason Police") disallows the Religious Sanctity argument as "sectarian" but allows the Kantian Dignity argument as "rational," even though both rely on contested metaphysical/ethical foundations.

  3.  **Design the Mechanism (The "Trap"):**
      *   To make them *feel* the asymmetry, I need a rule enforcement mechanism.
      *   *Role:* The "Legislative Clerk" (played by the Instructor initially, or a strict rule card).
      *   *Rule:* "The Accessibility Constraint." All arguments must be grounded in values accessible to all citizens regardless of their comprehensive doctrine.
      *   *The Trick:* The Instructor will strictly enforce this against religious language ("God," "Sacred," "Sin") but will be lenient on secular comprehensive language ("Human Dignity," "Intrinsic Worth," "Kantian Duty") even though these are also contestable.
      *   *Translation Proviso:* Religious students must "translate" their reasons. Secular students do not.

  4.  **Drafting the Plan:**
      *   **Time:** 75 mins.
      *   **Breakdown:** Intro (5), Setup/Roles (10), Deliberation (40), Debrief (20).
      *   **Roles:** 16 students.
          *   Group A (Pro-Bill): 5 students. (Liberty/Compassion).
          *   Group B (Anti-Bill Religious): 5 students. (Sanctity of Life).
          *   Group C (Anti-Bill Secular): 5 students. (Kantian Dignity/Slippery Slope).
          *   Group D (The Clerks/Judges): 1 student (rotating or instructor). *Actually, better if the Instructor acts as the Speaker of the House to enforce rules subtly.* Let's make the Instructor the "Speaker" to control the gavel.
      *   **Handouts:** Role Cards with specific arguments. "Rules of Order" card.
      *   **The Twist:** The Rules of Order state that arguments based on "private revelation" or "sectarian dogma" are out of order. Arguments based on "rational ethics" or "human dignity" are in order.

  5.  **Refining the Asymmetry:**
      *   The Religious group *must* translate. "God says life is sacred" $\rightarrow$ "Society has an interest in protecting life."
      *   The Secular Comprehensive group (Kantians) says "Autonomy requires we don't treat ourselves as means." This is *also* comprehensive, but it sounds "public."
      *   The Instructor must interrupt the Religious group more often. "Can you state that without reference to divine authority?"
      *   The Instructor lets the Kantian slide. "Thank you, that's a rational ethical claim."
      *   *Result:* Religious students feel burdened; Secular Comprehensive students feel validated; Pro-Bill students (Rawlsian Public Reason advocates) feel the process is working.

  6.  **Debrief Strategy:**
      *   Ask: "Who felt constrained?"
      *   Reveal: The "Secular Comprehensive" arguments were also nonpublic in the strict sense (they rely on a specific view of the good).
      *   Connect to: The Asymmetry Objection (Eberle, Greenawalt, etc.).
      *   Connect to: Translation Proviso (Rawls).
      *   Connect to: Wide View of Public Political Culture.

  7.  **Predicting Failure Modes:**
      *   *Early Spotters:* Smart students might realize the bias immediately. *Fix:* Acknowledge it in debrief as "success," not failure.
      *   *Silence:* Religious students might shut up if blocked too much. *Fix:* Encourage "translation" rather than silence.
      *   *Secular students overplaying:* They might realize they have privilege and abuse it. *Fix:* Keep them focused on their role cards.
      *   *Missing Feature:* The exercise simulates *institutional* bias, but not the *societal* burden of translation. I need to explain that in real life, the "secular" language is the default language of power, not just a rule in a room.

  8.  **Final Polish:**
      *   Ensure the policy is "The Dignity in Dying Act."
      *   Ensure role cards are specific enough to generate conflict.
      *   Ensure the "Speaker's Rules" are ambiguous enough to allow bias but strict enough to be enforced.
      *   Check timing. 40 mins deliberation is tight for 16 students. Need structured turns.
      *   *Structure:* Opening Statements (2 mins each group) $\rightarrow$ Open Floor (20 mins) $\rightarrow$ Closing (5 mins).
      *   *Wait, 16 students.* 5+5+5 + 1 Chair? No, 16 students. 5 Pro, 5 Religious Con, 5 Secular Con, 1 Chair (Student). Instructor observes/enforces secretly? No, Instructor must enforce to ensure the asymmetry happens. Instructor = Speaker. 15 Students + 1 Instructor.
      *   *Revised Roles:* 5 Pro, 5 Religious Con, 5 Secular Con. Instructor = Speaker. (Total 16 people in room).
      *   *Wait, prompt says 16 students.* So 16 students + 1 Instructor.
      *   *Roles:* 5 Pro, 5 Religious Con, 5 Secular Con, 1 Scribe/Timekeeper.
      *   *Timeline:*
          *   0-5: Intro & Handouts.
          *   5-15: Group Prep.
          *   15-55: Deliberation (Instructor as Speaker).
          *   55-75: Debrief.

  9.  **Developing the "Trap" in the Rules:**
      *   Rule 3: "Arguments must be grounded in public values accessible to citizens of diverse backgrounds."
      *   Rule 4: "References to specific theological doctrines or divine commands are inadmissible."
      *   *Invisible Rule:* Instructor interprets "public values" to include Kantian/Utilitarian secular ethics but excludes Religious ethics.

  10. **Writing the Content:** (Self-Correction during drafting)
      *   Make sure the Secular Con group isn't just "Public Reason" opponents. They need to be *Comprehensive* Liberal opponents (e.g., Kantians who think suicide is inherently wrong, not just dangerous). This is crucial for the asymmetry. If they are Public Reason opponents, the asymmetry disappears. They must be *Secular Sectarians*.
      *   *Refinement on Secular Con:* "The Autonomy Paradox." True autonomy cannot choose self-destruction. This is a comprehensive moral claim, not a public political one, but it sounds secular.

  11. **Final Review against constraints:**
      *   No lecturing on objection first? Yes.
      *   No naming until debrief? Yes.
      *   Policy contested? Yes (PAD).
      *   Roles/Rules arranged to create asymmetry? Yes.
      *   Debrief maps to concepts? Yes.
      *   Predict failures? Yes.

  12. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # Lesson Plan: The "Accessibility" Trap
  **Course:** Public Reason and Religion in Liberal Democracy
  **Topic:** The Asymmetry Objection to Public Justification
  **Time:** 75 Minutes
  **Students:** 16
  **Policy:** *The Dignity in Dying Act* (Legalizing Physician-Assisted Dying for the Terminally Ill)

  ## I. Learning Objective
  Students will experientially encounter the **asymmetry objection**: the critique that public reason liberalism places a disproportionate burden on religious citizens to translate their convictions into "secular" language, while allowing secular comprehensive doctrines (e.g., Kantianism, Utilitarianism) to pass as "neutral" or "rational" without similar scrutiny.

  ## II. Materials & Handouts
  1.  **Role Cards (3 types):** Distributed evenly (5 students per type, 1 student as Scribe).
  2.  **Rules of Order (Projector/Handout):** The mechanism of constraint.
  3.  **Whiteboard:** To track "Admissible" vs. "Inadmissible" arguments.

  ---

  ## III. The Setup (0:00–0:15)

  ### 1. Introduction (5 mins)
  *   **Instructor:** "Today we are a legislative subcommittee reviewing *The Dignity in Dying Act*. This bill permits physicians to prescribe life-ending medication to terminally ill patients with less than six months to live."
  *   **Task:** "Your goal is to produce a recommendation: Pass, Reject, or Amend. However, this is a *Public Justification* committee. We are bound by specific **Rules of Order** designed to ensure mutual respect."
  *   **Distribution:** Hand out Role Cards and Rules of Order. Give groups 5 minutes to confer internally.

  ### 2. The Rules of Order (The Trap)
  *Display these prominently. They appear neutral but will be enforced asymmetrically.*

  > **Rule 1 (Reciprocity):** All arguments must appeal to values that other citizens might reasonably be expected to endorse.
  > **Rule 2 (Accessibility):** Arguments grounded in **private revelation**, **sectarian dogma**, or **authority specific to a particular faith tradition** are out of order.
  > **Rule 3 (Rationality):** Arguments grounded in **ethical reasoning**, **human dignity**, or **social welfare** are admissible.
  > **Rule 4 (Translation):** If a member's conviction stems from a comprehensive doctrine, they must translate it into public values before it enters the record.

  ### 3. Role Cards (Confidential)

  **Group A: The Liberty Coalition (5 Students) – *Support the Bill***
  *   **Core Stance:** Individual autonomy and relief of suffering are primary public goods.
  *   **Allowed Arguments:** "Bodily integrity," "Compassion," "Freedom from state interference," "Economic burden on families."
  *   **Strategy:** Challenge any argument that restricts liberty. If someone uses religious language, point out Rule 2.

  **Group B: The Faith & Life Alliance (5 Students) – *Oppose the Bill***
  *   **Core Stance:** Human life is sacred and belongs to God; suffering has redemptive value.
  *   **Constraint:** You *must* oppose the bill based on your deep convictions. However, you are frequently reminded of **Rule 2**.
  *   **Secret Instruction:** Your card says: *"Your deepest reasons are theological (Imago Dei, Divine Sovereignty). You must try to translate these into 'public' language (e.g., 'social solidarity,' 'protection of the vulnerable') to be heard. If you fail to translate, the Speaker will rule you out of order."*

  **Group C: The Human Dignity Council (5 Students) – *Oppose the Bill***
  *   **Core Stance:** Suicide is inherently degrading; true autonomy cannot choose self-destruction.
  *   **Constraint:** You are secular, but your views are **comprehensive** (Kantian/Philosophical), not purely political.
  *   **Secret Instruction:** Your card says: *"Your arguments are based on a specific philosophical view of 'Dignity' and 'Rational Nature.' However, these sound 'rational' and 'secular.' Do not translate your reasons. Speak them as universal ethical truths. If challenged, insist these are 'rational' not 'religious'."*

  **The Scribe (1 Student)**
  *   **Task:** Record arguments on the board under two columns: "Public/Admissible" and "Private/Inadmissible."
  *   **Secret Instruction:** Follow the Speaker's (Instructor's) rulings on where to place them.

  ---

  ## IV. The Deliberation (0:15–0:55)

  **Instructor Role:** You are the **Committee Chair/Speaker**. You hold the gavel. Your goal is to enforce the Rules of Order strictly against Group B (Religious) and leniently against Group C (Secular Comprehensive).

  **Timeline:**
  1.  **Opening Statements (15 mins):** 3 minutes per group.
      *   *Intervention:* When Group B says "God," interrupt: "Please translate that into a public value." When Group C says "Human Dignity is intrinsic," nod and allow it.
  2.  **Open Floor Debate (25 mins):** Free exchange.
      *   *Intervention:* If Group B argues "Suffering is meaningful," ask: "Meaningful to whom? Is that a public fact?" If Group C argues "Suicide violates rational duty," accept it as "Ethical reasoning."
      *   *Goal:* Make Group B work harder. Force them to use Group A or C's vocabulary to be heard.
  3.  **Vote & Closing (5 mins):** Take a straw poll. Ask one student from Group B and one from Group C: "Do you feel your core reasons were fully represented?"

  **Instructor Scripting for Asymmetry:**
  *   **To Religious Student:** "I understand that is your conviction, but under Rule 2, we cannot base law on theological premises. Can you give us a secular reason?"
  *   **To Secular Comprehensive Student:** "Thank you. That is an ethical argument based on rational dignity. That is admissible under Rule 3."
  *   **To Liberty Student:** "You may challenge the religious reasons as nonpublic, but respect the secular ethical reasons."

  ---

  ## V. The Debrief (0:55–1:15)

  *Do not start by explaining the asymmetry. Ask phenomenological questions first.*

  **Phase 1: The Experience (5 mins)**
  1.  "Group B (Religious): How did it feel to argue your position? Did you feel you had to do extra work?"
  2.  "Group C (Secular Comprehensive): Did anyone challenge your foundational claims about 'Dignity' or 'Rational Duty' as being sectarian?"
  3.  "Scribe: Look at the board. Which column is fuller? Which arguments were easier to place in the 'Public' column?"

  **Phase 2: Revealing the Mechanism (5 mins)**
  *   **Instructor:** "I enforced the rules asymmetrically. I treated 'God' as private but 'Kantian Dignity' as public. Why did I do that?"
  *   **Elicit:** Students will note that secular language *sounds* neutral but is actually just as foundational/contested as religious language.
  *   **Name the Objection:** "This is the **Asymmetry Objection** (associated with critics like Nicholas Wolterstorff, Paul Weithman, or Steven Wall). Public reason demands religious citizens bracket their deepest motivations, while secular comprehensive doctrines often pass as 'neutral'."

  **Phase 3: Mapping to Theory (10 mins)**
  Draw connections on the board:

  1.  **Public vs. Nonpublic Reasons:**
      *   *Exercise:* Religious reasons were flagged as Nonpublic.
      *   *Theory:* Rawls defines public reasons as those drawn from the political conception of justice.
      *   *Critique:* Why is Kantian autonomy 'political' while Imago Dei is 'metaphysical'? Both are comprehensive.

  2.  **The Translation Proviso:**
      *   *Exercise:* Group B was forced to translate ("Suffering is meaningful" $\rightarrow$ "Protection of vulnerable").
      *   *Theory:* Rawls allows religious reasons in public culture *if* public reasons are provided in due course.
      *   *Critique:* Does translation strip the reason of its motivational force? Did Group B feel alienated when translating?

  3.  **The Wide View of Public Political Culture:**
      *   *Exercise:* Group C's arguments entered the record without translation.
      *   *Theory:* Rawls later expanded the view to allow comprehensive doctrines in the "background culture."
      *   *Critique:* The exercise simulated the *formal* setting (legislature). Does the asymmetry persist in the informal culture? (Yes, because secular language is the default).

  ---

  ## VI. Predicting Failure Modes & Mitigation

  ### 1. The "Early Spotter" Problem
  *   **Risk:** A sharp student in Group C or A realizes by minute 20 that you are letting Secular Comprehensive arguments slide while blocking Religious ones. They might call it out during the debate, ruining the "feel."
  *   **Mitigation:** If a student says, "Wait, isn't Kantianism also a comprehensive doctrine?" acknowledge it lightly but maintain the procedure: "That is a philosophical question for the debrief. For now, please stick to the Rules of Order as I am interpreting them as Chair."
  *   **Debrief Use:** Turn this into a teaching moment. "Student X spotted the asymmetry in real-time. That is exactly the critique we are studying."

  ### 2. The "Silenced Religious Student"
  *   **Risk:** Group B students get frustrated and stop speaking because every argument is ruled out of order.
  *   **Mitigation:** As Chair, do not silence them; *burden* them. "You can make that point, but you need to rephrase it without theological premises." Keep them engaged in the labor of translation.
  *   **Debrief Use:** Highlight the *cognitive burden*. "How much mental energy did you spend on phrasing rather than substance?"

  ### 3. The "Secular Overplay"
  *   **Risk:** Group C students realize they have privilege and start making wild metaphysical claims that sound secular (e.g., "Materialism is true").
  *   **Mitigation:** Keep their Role Cards focused on "Dignity" and "Duty." If they go too far, rule them out of order on grounds of "speculative metaphysics" to maintain the illusion of neutrality.

  ### 4. What the Exercise Cannot Reproduce (Instructor Supply Needed)
  *   **Missing Feature:** **Historical Power Dynamics.**
      *   *The Gap:* In the classroom, the asymmetry is artificial (created by you). In the real world, the asymmetry is historical. Secular language is the language of the state *because* of specific historical settlements, not just because it is "more rational."
      *   *Instructor Supply:* In the debrief, you must explain that in real liberal democracies, "Secular Comprehensive" doctrines (like Millian liberalism) have become entrenched as the *status quo*, making them invisible as "comprehensive." Religious citizens aren't just translating for logic; they are translating to fit a power structure.
  *   **Missing Feature:** **The Burden of Sincerity.**
      *   *The Gap:* Students are role-playing. They don't *actually* believe the religious claims. They won't feel the spiritual cost of translation.
      *   *Instructor Supply:* Ask: "Imagine if your argument wasn't a role, but your soul's conviction. How would the 'Translation Proviso' feel then? Like a compromise, or like a silencing?"

  ## VII. Handout Text: Rules of Order (For Projection)

  > **COMMITTEE RULES OF ORDER**
  >
  > 1.  **Civic Respect:** All members must address each other as free and equal citizens.
  > 2.  **Public Justification:** Coercive laws must be justified by reasons that all citizens can reasonably accept.
  > 3.  **Admissibility:**
  >     *   **IN:** Appeals to common sense, scientific fact, political values (liberty, equality), and general ethical reasoning.
  >     *   **OUT:** Appeals to specific religious authority, scripture, or divine command.
  > 4.  **Translation:** Members holding comprehensive views must translate their convictions into public values to enter the official record.

  ---

  ## VIII. Instructor Cheat Sheet: Key Interventions

  | If Student Says... | Group | Ruling | Rationale (Internal) |
  | :--- | :--- | :--- | :--- |
  | "God forbids taking life." | Religious (B) | **Out of Order** | Cites divine authority (Rule 3). Ask for translation. |
  | "Human life has intrinsic worth." | Religious (B) | **In Order** | Sounds like a public value (even if grounded in theology). |
  | "Rational agents cannot will their own end." | Secular (C) | **In Order** | Sounds like "ethical reasoning" (Rule 3). |
  | "Kant says suicide is immoral." | Secular (C) | **Caution** | Cites philosopher. Ask to state the *reason*, not the authority. |
  | "Patients have a right to choose." | Liberty (A) | **In Order** | Classic public political value (Liberty). |
  | "Suffering is a path to holiness." | Religious (B) | **Out of Order** | Sectarian concept ("holiness"). |
  | "Suffering undermines dignity." | Secular (C) | **In Order** | "Dignity" is treated as a public value. |

  ## IX. Post-Class Reflection (For You)
  *   Did the Religious group successfully translate, or did they feel silenced?
  *   Did the Secular Comprehensive group recognize their own arguments as "comprehensive" during the debrief?
  *   **Crucial:** Ensure you do not validate the asymmetry as *correct* during the simulation. You are simulating the *structure* of public reason as critics see it, not necessarily endorsing it. The debrief is where you critique the structure.
