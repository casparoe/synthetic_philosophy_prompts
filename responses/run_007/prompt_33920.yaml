  If PP is correct, subtraction is invalid because the terms are non-linear and interactive. Trials should shift from isolating "chemical efficacy" to optimizing "therapeutic inference."

  *Stay:* Randomization remains crucial to control for unknown confounds and ensure causal attribution. We still need to know if the pill adds value over context alone. Blinding remains necessary to prevent bias, though its purpose shifts.

