      *   **Core Issue:** Do cognitive states (beliefs, desires, expectations) directly influence the content or character of perceptual experience, or do they only influence post-perceptual judgment/decision-making?
      *   **Penetrability (CP) Side:** Perception is theory-laden. What you see depends on what you know. (e.g., Hansen et al. color perception, Delk & Fillenbaum hearts).
      *   **Impenetrability (CI) Side:** Perception is modular (Fodorian). Early vision is encapsulated. Effects are due to attention, decision bias, or perceptual learning (long-term), not direct cognitive influence. (e.g., Firestone & Scholl).
      *   **Methodological Critiques:** CI often argues CP findings are confounds (demand characteristics, response bias, attention shifts). CP argues CI sets the bar too high (strict modularity is empirically false) or relies on dubious distinctions.
