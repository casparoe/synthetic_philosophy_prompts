answer: |-
  Dear Colleagues,

  In preparing this document for the upcoming workshop, we recognized that a productive adversarial collaboration requires us to first identify the necessary concessions each side must make to even establish a shared dialectical framework. Before we could articulate our remaining disagreements, the defender of cognitive penetrability had to concede that not all top-down effects constitute penetration, specifically acknowledging that response biases, demand characteristics, and shifts in decision criteria do not count as evidence for changes in perceptual content. Conversely, the defender of cognitive impenetrability had to concede that the visual system is not hermetically sealed from all top-down influence, acknowledging that attention is selective, that perceptual learning occurs over long timescales, and that certain high-level properties like animacy or causality might be perceived without requiring explicit inference. Having established this common ground, we now present our joint statement regarding the state of the debate, the precise locus of our disagreement, and the empirical paths forward.

  We begin by enumerating the claims about perception, cognition, attention, and experimental methodology that both sides accept without reservation. We agree that there is a distinction between sensory transduction and perceptual experience, and that perceptual experience is distinct from post-perceptual judgment and belief formation. We agree that cognition includes states such as beliefs, desires, and expectations, and that these states can influence behavior and report. We agree that attention plays a critical role in selecting information for processing and that attention can be guided by cognitive goals. We further agree that methodological rigor requires controlling for response biases using signal detection theory or equivalent measures, and that subjective reports must be corroborated by objective performance measures or physiological data where possible. We also agree that long-term perceptual learning, such as that seen in experts like radiologists or bird watchers, alters perceptual processing, though we differ on whether this counts as cognitive penetration or merely structural plasticity. Finally, we agree that any claim of cognitive penetration must demonstrate that the cognitive effect is direct, rather than mediated by a shift in attention to a different part of the stimulus or a change in the criterion for reporting.

  Despite these agreements, a substantive disagreement remains regarding the architecture of the mind and the flow of information between systems. The defender of cognitive impenetrability maintains the following formulation: Early visual processing is encapsulated from direct influence by central cognitive states such as beliefs and desires, such that the phenomenal character and content of early vision are determined solely by sensory input and low-level processing parameters, while observed effects of cognition are attributable to attentional selection, decision criteria, or long-term plasticity that does not reflect online cognitive influence. The defender of cognitive penetrability maintains the following contrasting formulation: The phenomenal character and content of perceptual experience are directly modulated by active cognitive states, such that two subjects with identical sensory input and identical attentional allocation but different cognitive states undergo distinct perceptual experiences, and this modulation occurs rapidly enough to count as online processing rather than long-term learning. We acknowledge that a portion of this dispute may be verbal, turning on where to draw the boundary between perception and cognition. Specifically, if attention is classified as a cognitive state, then the impenetrability defender's exclusion of attentional effects may be merely terminological, whereas if attention is classified as a perceptual mechanism, the penetrability defender's claim becomes stronger. We agree to treat attention as a distinct mechanism for the purpose of this debate, such that penetration requires an effect of belief or desire over and above the effect of attention.

  To move this debate forward, we have identified three specific cruxes, each paired with an experimental paradigm or argument that both sides accept as bearing on the question, along with our pre-registered predictions. The first crux concerns the dissociation of attention from belief. The question is whether cognitive effects on perception persist when attention is strictly controlled and equated across conditions. The agreed paradigm involves a dual-task design where subjects hold a belief about a stimulus feature while performing a secondary task that exhausts attentional resources, measuring perceptual sensitivity via forced-choice tasks rather than subjective rating. The defender of cognitive impenetrability predicts that once attention is equated and controlled, the effect of belief on perceptual sensitivity will vanish, leaving only effects on response criterion. The defender of cognitive penetrability predicts that even with attention equated, the belief condition will show higher perceptual sensitivity or altered phenomenological reports compared to the neutral condition, indicating a direct modulation of perceptual processing.

  The second crux concerns the temporal locus of the effect. The question is whether cognitive influences occur early enough in the visual processing stream to constitute perception rather than post-perceptual judgment. The agreed paradigm involves measuring event-related potentials or factivity in early visual areas such as V1 or V2 during a cognitive penetration task, specifically looking for modulation of early components like the C1 component which is traditionally associated with early visual processing. The defender of cognitive impenetrability predicts that cognitive states will not modulate activity in V1 or the C1 component, and that any modulation will appear only in later components associated with decision-making and memory. The defender of cognitive penetrability predicts that cognitive states will modulate activity in early visual areas or early ERP components, demonstrating that cognitive information reaches early sensory processing stages during the experience itself.

  The third crux concerns the nature of the property perceived. The question is whether high-level properties like kind membership or value are genuinely perceived or merely inferred from low-level features. The agreed paradigm involves a binocular rivalry or continuous flash suppression task where competing stimuli differ only in high-level properties while low-level features are equated, measuring dominance durations as a proxy for perceptual content. The defender of cognitive impenetrability predicts that dominance durations will be determined by low-level feature contrast and that cognitive relevance will only affect post-perceptual reporting of the dominant stimulus. The defender of cognitive penetrability predicts that cognitively relevant stimuli will break suppression faster or dominate longer than neutral stimuli even when low-level features are equated, indicating that high-level content influences which stimulus reaches conscious perception.

  We acknowledge that if the experimental results align with the impenetrability predictions, the penetrability defender must concede that the effects previously attributed to penetration were actually due to attentional confounds or decision biases. Conversely, if the results align with the penetrability predictions, the impenetrability defender must concede that early visual processing is not encapsulated from central cognitive states and that the modularity thesis requires significant revision. We further acknowledge that if the results are mixed or ambiguous, the dispute may indeed be verbal, resting on whether we define perception by its physiological locus or by its functional role in guiding behavior. In that event, we agree to adopt a pluralistic framework where penetration is defined relative to a specific processing stage rather than as a binary property of the mind. We commit to updating our positions based on the outcomes of these paradigms and to collaborating on the design and analysis of the proposed experiments to ensure that methodological critiques are addressed in real time. We sign this statement not as a resolution of the debate, but as a map of the terrain we must traverse to reach one.
