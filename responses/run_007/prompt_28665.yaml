answer: |-
  Good evening. Thank you for having me.

  Usually, at this point, I would apologise for the weather, or make a joke about how much better the book is than the film that doesn't exist yet. But I want to start with a cup of coffee.

  Imagine you have a hot cup of coffee sitting on a table in front of you. Over the next ten minutes, it will cool down. The heat will dissipate into the room. This is so ordinary we barely notice it. But if I were to show you a film of that coffee suddenly drawing heat back from the room, boiling itself up and steaming aggressively, you would know instantly that the film was being played in reverse.

  Here is the puzzle: if you look at the fundamental laws of physics—the equations that govern how atoms move, how gravity pulls, how light travels—almost all of them are time-symmetric. That means if you swap 'time forward' for 'time backward' in the equation, the physics still works. Newton's laws don't care which way the clock ticks. An atom bouncing off another atom looks perfectly valid whether you watch it forwards or backwards.

  So, why does the coffee cool down? Why does the egg break and never un-break? Why does time have an arrow at all?

  This is the thermodynamic arrow of time. The standard answer comes from statistical mechanics, largely built by Ludwig Boltzmann in the nineteenth century. It suggests that time points forward because there are simply more ways for a system to be disordered than ordered. There are countless ways for heat energy to be spread out around a room, but very few ways for it to be concentrated in a single cup. The universe moves from low probability states to high probability states. We call this increase in probability 'entropy'.

  But here is where it gets strange, and where my book begins.

  The laws of physics don't forbid the coffee from heating up. It's just statistically incredibly unlikely. But the real mystery isn't just about coffee. It's about us.

  We have a psychological arrow of time that aligns with the thermodynamic one. We remember the past, not the future. We feel regret for things we have done, not for things we are about to do. We anticipate tomorrow, but we recall yesterday. Most physicists believe this isn't a coincidence. They suggest that our ability to form memories is itself a thermodynamic process. To record a memory, your brain must change its state, and that change increases entropy. We can only remember the direction of time in which entropy increases.

  So, we are left with a profound question: is our feeling of time passing—a sense of loss, of anticipation, of cause and effect—merely a byproduct of statistical probability? Are we just riding the wave of increasing disorder?

  In my new novel, *The Reverse Clock* [Note: Insert Title], I asked a different question. What happens if you decouple those arrows? What if the thermodynamic arrow of the universe keeps pointing forward, but the psychological arrow of a single human being flips?

  My protagonist doesn't travel through time. She doesn't visit the dinosaurs. She simply wakes up one day experiencing causality in reverse. She hears the answer before the question. She feels the grief before the loss. She remembers tomorrow.

  Writing this was an exercise in restraint. I had to be careful. If I claimed that physics could actually allow this, my editor—who is sitting in the front row and knows her Boltzmann from her Big Bang—would walk out. In reality, if your subjective time reversed while the world moved forward, you would likely cease to function. Your brain relies on chemical reactions moving in one direction. To experience time backwards while your neurons fire forwards is a contradiction.

  But that is precisely why fiction is useful.

  Physics is excellent at telling us what is possible. It is less equipped to tell us what it *feels* like when the impossible happens. Physics can describe the entropy of a breaking egg, but it cannot describe the regret of the hand that dropped it.

  When I was researching the thermodynamics of time, I found equations that were beautiful, cold, and absolute. They explained the mechanism, but they didn't explain the meaning. They told me why the coffee cools, but not why we care that it cools.

  Fiction allows us to run a different kind of experiment. We can isolate variables that reality keeps bound together. We can ask: if you knew the end of a relationship before the beginning, would you still enter it? If you remembered your own death, would you live differently? These aren't questions physics can answer, because physics deals in universals, not particulars. It deals with atoms, not anxieties.

  There is a temptation, when writing speculative fiction, to claim you are solving the puzzle. To suggest that the novel offers a theory of time that rivals Einstein's. I don't think that's true. Novels don't solve physics problems. But they do something else. They translate the abstract into the visceral.

  The arrow of time is often discussed as a problem of cosmology—about the Big Bang and the heat death of the universe. But for most of us, the arrow of time is a problem of love. It is the knowledge that moments are unrepeatable. It is the asymmetry of memory. We are defined by what we cannot undo.

  In my book, the character struggles not with the physics, but with the loneliness of her condition. To experience time backwards is to be out of sync with everyone you love. You cannot share a moment with someone if you are living it in reverse order. It highlights, by contrast, how much of our connection relies on sharing the same temporal direction. We walk together into the unknown.

  So, why talk about entropy at a literary festival? Because the strangeness of the universe is not separate from the strangeness of being human. The fact that the coffee cools is the same fact that allows us to age, to learn, and to love.

  I don't expect you to come away from my book with a better understanding of statistical mechanics. I hope you come away with a sharper sense of how precious the forward motion is. We are creatures made of dust who are briefly allowed to assemble ourselves into something coherent before we scatter again. The laws of physics say this scattering is inevitable. The laws of fiction say we can pause, for a few hundred pages, and look at the dust while it still holds its shape.

  Thank you.

