answer: |-
  # Activity Design: The Binding Protocol

  **Objective:** To move promissory obligation from a theoretical puzzle to a phenomenological experience. Participants will make identical speech acts ("I promise to $\phi$") under three distinct structural conditions. By observing their own hesitation, guilt, or indifference when offered a temptation to break the promise, they will generate data on *where* the binding force comes from.

  **Group Size:** 12 participants (6 pairs).
  **Duration:** 90 Minutes.
  **Materials:**
  *   3 Colored Envelopes per pair (Red, Blue, Green).
  *   "Temptation Cards" (1 per Promisor per round).
  *   "Integrity Tokens" (Poker chips or slips of paper).
  *   A small prize pot (e.g., a $20 coffee card or a box of high-quality chocolates).
  *   Whiteboard/Marker.
  *   Timer.

  ---

  ## 1. Setup and Rules (10 Minutes)

  **The Stakes:**
  Explain that at the end of the session, there will be a raffle for the prize pot. Entry is determined by **Integrity Tokens**.
  *   **Keep a promise:** Earn 1 Token.
  *   **Break a promise:** Earn 0 Tokens.
  *   **The Twist:** In each round, the Promisor will receive a **Temptation Card**. If they choose to break the promise, they may redeem the card immediately for a tangible reward (e.g., a premium chocolate bar) *right now*, but they forfeit the Token for the raffle.
  *   *Why this matters:* This forces a trade-off between immediate utility (chocolate) and abstract normative standing (tokens/raffle + social reputation). It mimics the structure of moral obligation (doing the right thing despite a cost).

  **The Roles:**
  *   Divide into 6 pairs.
  *   In each pair, designate Person A (Promisor) and Person B (Promisee). Swap roles in Round 2.
  *   **Crucial Rule:** Decisions are private until the "Reveal." Do not show your choice to your partner until instructed.

  ---

  ## 2. The Activity: Three Rounds (30 Minutes)

  *Facilitator Note: Keep the pace brisk. Read the instructions for each round clearly. Do not explain the theory yet.*

  ### Round 1: The Naked Promise (Red Envelopes)
  *   **Context:** Private, no reliance.
  *   **Instruction:** Person A opens the Red Envelope. It contains a Task Card: *"Promise to send Person B a text message with a quote from today's reading by 8:00 PM tonight."*
  *   **The Speech Act:** Person A must say aloud to Person B: *"I promise to do this."*
  *   **The Temptation:** Person A receives a Temptation Card: *"You may break this promise and take a chocolate bar now. If you keep the promise, you wait for the raffle."*
  *   **Decision:** Person A marks a slip (KEEP / BREAK) and puts it in the envelope. Person B waits silently.
  *   **Reveal:** Open envelopes. Record tokens. Eat chocolates if applicable.

  ### Round 2: The Reliance Promise (Blue Envelopes)
  *   **Context:** Private, high reliance.
  *   **Instruction:** Swap roles (Person B is now Promisor). Open Blue Envelope. Task Card: *"Promise to bring Person A a printed copy of the syllabus next week. Person A needs this to register for a class."*
  *   **The Mechanism:** Before the promise is made, Person A (Promisee) must hand over their own "Registration Token" (a slip of paper) to the Promisor, signifying they are *relying* on this promise and cannot get the syllabus elsewhere. If the promise is broken, Person A tears up their token (simulating loss).
  *   **The Speech Act:** *"I promise to do this."*
  *   **The Temptation:** Same as Round 1 (Chocolate now vs. Token later).
  *   **Decision & Reveal:** Same as Round 1. *Observe the tension when the Promisee hands over their token.*

  ### Round 3: The Public Convention (Green Envelopes)
  *   **Context:** Public, ritualized.
  *   **Instruction:** All 12 participants stand in a circle. Person A (original Promisors) step forward.
  *   **The Speech Act:** Person A must say loudly to the *whole group*: *"I, [Name], promise the group that I will stay 10 minutes after this session ends to stack the chairs."*
  *   **The Witness:** The group must respond in unison: *"We hold you to it."*
  *   **The Temptation:** Person A receives a Temptation Card: *"You may leave immediately at the end of class. If you stay, you get a Token."* (Note: The chocolate is gone; the temptation is time/comfort).
  *   **Decision:** Person A marks their slip.
  *   **Reveal:** Reveal at the very end of the session (after the 10 minutes).

  ---

  ## 3. The Hot Debrief (15 Minutes)

  *Do not move to theory yet. Focus on phenomenology.*

  Ask the group to sit. Put the whiteboard markers away. Ask:
  1.  **"In which round did you feel the heaviest hesitation when you read the Temptation Card?"** (Take a show of hands).
  2.  **"Promisees: In which round did you feel most betrayed when you saw a 'BREAK' slip?"**
  3.  **"Promisors: If you kept the promise in Round 1, why? There was no cost to breaking it other than losing a raffle token."**
  4.  **"Did the words 'I Promise' feel different in the Red Envelope versus the Green Circle?"**

  *Facilitator Goal:* Get them to admit that the *words* were the same, but the *weight* changed. Write their observations on the board without labeling them (e.g., "Felt silly in Red," "Felt guilty in Blue," "Felt watched in Green").

  ---

  ## 4. The Cold Debrief: Mapping to Theory (30 Minutes)

  *Now introduce the vocabulary. Connect their lived experience to the readings.*

  **1. Round 1 (The Naked Promise) $\rightarrow$ The Puzzle of Obligation**
  *   **Observation:** Many likely felt little obligation. Some might have taken the chocolate easily.
  *   **Theory:** This isolates the **Bare Utterance**.
  *   **Discussion:** If the words alone created the obligation, Round 1 should feel as heavy as Round 3. It didn't. Why?
  *   **Hume:** Hume would say this promise is "empty" because it lacks the support of the *social convention*. Without the threat of social sanction (which was low here), the words are just noise.
  *   **Scanlon:** Scanlon might argue that without *reliance* or a specific expectation invited, Principle F isn't fully triggered. You didn't manipulate their expectations significantly.

  **2. Round 2 (The Reliance Promise) $\rightarrow$ Scanlon's Principle F**
  *   **Observation:** Hesitation should be highest here. The act of the Promisee handing over the "Registration Token" changes the moral landscape.
  *   **Theory:** **T.M. Scanlon**.
  *   **Discussion:** The words didn't change, but the *consequences for the other person* did.
  *   **Key Question:** Did you feel obligated because you said "I promise," or because they *handed you the token*?
  *   **Scanlon's View:** The obligation comes from the wrongness of manipulating expectations. When they gave you the token, you invited them to rely on you. Breaking it harms *them*, not just the "system."
  *   **Contrast:** In Round 1, breaking the promise only hurt the "system" (or your raffle odds). In Round 2, it hurt a person.

  **3. Round 3 (The Public Convention) $\rightarrow$ Hume's Social Practice**
  *   **Observation:** The pressure came from the *audience*. The ritual ("We hold you to it").
  *   **Theory:** **David Hume**.
  *   **Discussion:** Why did standing in a circle matter?
  *   **Hume's View:** Promising is an artificial human invention (a convention) designed to facilitate cooperation. It only works if there is a public practice of sanctioning those who break it. The group saying "We hold you to it" *created* the obligation by activating the convention.
  *   **Contrast:** Scanlon focuses on the interpersonal harm (Round 2). Hume focuses on the institutional stability (Round 3).

  **Synthesis Question:**
  "Imagine you made the Round 1 promise (text message) to a stranger over email. No tokens, no audience. Do you still owe it? If yes, where does the obligation come from if Hume and Scanlon are both partially right?"

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "It's Just a Game" Problem**
  *   **Risk:** Students treat the Temptation Cards as a joke, laughing as they take the chocolate. The "obligation" feels fake.
  *   **Fix:** **Framing is everything.** In the intro, say: *"We are philosophers of law. We treat norms as real data. If you break a promise here, you are breaking a norm in this room. Treat the envelope as a contract."*
  *   **Backup:** If they are too breezy in Round 1, pause before Round 2. Say: *"I'm noticing the stakes feel low. In Round 2, the reliance is real. Person A, if Person B breaks this, you actually don't get the syllabus. Please treat that loss seriously."*

  **2. The "Universal Defector" Problem**
  *   **Risk:** Everyone takes the chocolate. No one feels obligated.
  *   **Fix:** This is actually *good data*. It supports a skeptical view (e.g., Hobbes or a radical Humean). In the debrief, ask: *"If everyone broke the promise, does that prove there is no natural obligation, only fear of sanctions?"*
  *   **Prevention:** Ensure the Raffle Prize is desirable enough to compete with the immediate chocolate.

  **3. Time Creep**
  *   **Risk:** The debrief runs long; you don't get to Round 3.
  *   **Fix:** Round 3 is the Humean climax. Do not cut it. Cut the Round 1 debrief short if needed. Keep a visible timer.

  ---

  ## 6. Limitations: What You Must Supply

  As the facilitator, you need to be honest about what this activity *cannot* do. Add this to your closing remarks (last 5 minutes):

  **1. The "Long Shadow" of Relationships**
  *   **Limitation:** This is a one-off interaction among peers. Real promissory obligation often exists within long-term relationships (friendships, marriages, business partnerships) where the cost of breaking a promise is the relationship itself, not just a token.
  *   **Your Job:** Point out that Scanlon's account works well for strangers (Principle F), but Hume's convention might better explain why we keep promises to friends where reliance isn't always explicit.

  **2. The Content of the Promise**
  *   **Limitation:** We promised trivial things (texts, chairs). We did not promise to *not harm* or to *keep secrets*.
  *   **Your Job:** Remind them that some promises feel binding because of their *content* (moral duties we already have), not just the speech act. This opens the door to natural law critiques or Raz's "Peremptory Reasons."

  **3. The Legal vs. Moral Distinction**
  *   **Limitation:** This activity blurs moral guilt with social pressure. In law, a promise is only binding if consideration is present (Contract Law).
  *   **Your Job:** Since this is a Phil of Law course, explicitly ask: *"In Round 2, Person A gave a 'token.' In Contract Law, that's consideration. In Morality, does consideration matter? Or is the bare promise enough?"*

  ---

  ## Facilitator's Cheat Sheet (Theory Mapping)

  | Activity Moment | Philosophical Concept | Key Question to Ask |
  | :--- | :--- | :--- |
  | **Round 1 (Red)** | **Bare Assertion** | "Did the words create the reason, or was the reason already there?" |
  | **Round 2 (Blue)** | **Scanlon (Principle F)** | "Did the obligation arise when you spoke, or when they relied on you?" |
  | **Round 3 (Green)** | **Hume (Convention)** | "Would you have felt bound if no one else was watching?" |
  | **Temptation Card** | **Prudential vs. Moral** | "Did you keep the promise to avoid guilt (moral) or to get the token (prudential)?" |

  By the end of the 90 minutes, the students should not just be able to recite Hume and Scanlon, but be able to say: *"I felt like a Scanlonian in Round 2, but a Humean in Round 3."* That is when the theory sticks.
