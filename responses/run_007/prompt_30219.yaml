prompt: |-
  we're doing Hardin's lifeboat argument in my global justice module and honestly the whole thing seems to run on one picture. rich countries are lifeboats, poor countries are people swimming in the ocean, the boats are nearly full, and if you pull anyone else aboard the boat capsizes and everyone drowns. so the conclusion is supposed to be that the only ethical move is to keep people off the boat, and maybe not even send food aid because that just lets more swimmers survive long enough to reach you. I want to know how far this analogy actualy holds. can you lay out the mapping first (what's the boat, the swimmers, the supplies, the capacity, the storm, the shore, whatever else), then go through where it breaks, and be specific about which disanalogies actually matter for the conclusions he wants and which are just cosmetic. the thing I'm trying to figure out is whether the anti-immigration and anti-aid conclusion survives once the disanalogies are on the table, or whether the picture was doing all the work. if there's a better analogy for the real situation, say what it is. oh and please no headings or bullet points or bold or tables, just continuous prose like an email.
