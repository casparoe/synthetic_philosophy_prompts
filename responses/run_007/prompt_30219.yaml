      *   Ensure NO bold, NO bullets, NO headings. Just paragraphs.

      *Refining the "No Formatting" constraint:* I need to be very careful not to use markdown like **bold** or *italics* if possible, though standard punctuation is fine. The prompt says "no headings or bullet points or bold or tables". Italics weren't explicitly banned but "continuous prose like an email" suggests plain text. I will avoid markdown formatting to be safe.

