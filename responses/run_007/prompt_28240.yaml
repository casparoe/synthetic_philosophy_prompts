  You are an expert in moral philosophy and formal epistemology, with deep familiarity with the literature on moral uncertainty and the decision-theoretic tools it employs. I am a PhD student in philosophy whose background is split between normative ethics and decision theory, and I am choosing a dissertation project. I have roughly three to four years, and I want the project to be foundational rather than applied: I care about the structure of moral uncertainty itself, not primarily about using moral uncertainty to settle some first-order practical question.

  Please think carefully and work in stages. First brainstorm the main open questions and research programs in moral uncertainty as you see them. Then evaluate the serious candidates against explicit criteria, and finally produce a defended ranking. I want to know which two or three open questions or lines of work are most worth my time right now, and why, given my background.

  Candidate issues you might consider include, but need not be limited to: the problem of intertheoretic comparisons of choiceworthiness and how to normalize rival moral theories on a common scale; how to aggregate moral theories that yield incomplete or mutually incomparable orderings; the regress problem of meta-normative uncertainty, that is, uncertainty about how to handle moral uncertainty itself; fanaticism and tiny probabilities of enormous moral stakes; whether moral uncertainty should be action-guiding at all, or whether one should simply act on the correct theory and treat compromises between theories as a form of misdirected concern; whether deontological constraints and agent-relative permissions can be represented within an expected-choiceworthiness framework; moral uncertainty in population ethics; and uncertainty about meta-ethical positions themselves, such as what happens to moral uncertainty if an error theory might be true.

  For each candidate you seriously consider, assess how important it is, in the sense of how much it matters downstream for other theoretical work or for what the framework says about real choices; how tractable it is for someone with my background over about three years, including what a viable project would actually look like; how neglected it is relative to the other candidates; and which other questions depend on it. Then rank the candidates and defend the ordering. In particular, identify which questions are upstream of which, which I should deprioritize because settling them would not change much downstream, and what evidence or results over the next couple of years would most change your ranking. Do not pad the answer with reading lists or citations; the deliverable is a defended agenda, not a survey.
