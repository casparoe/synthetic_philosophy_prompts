answer: |-
  ### Stage 1: Brainstorming Open Questions in Moral Uncertainty

  The field of moral uncertainty currently sits at an intersection of normative ethics, meta-ethics, and formal decision theory. The core project is to define a decision rule for agents who hold credences over rival moral theories. The following are the primary structural bottlenecks:

  1.  **Intertheoretic Comparisons (ITC):** How to map the "choiceworthiness" functions of distinct moral theories (e.g., utilitarianism, deontology, virtue ethics) onto a common cardinal scale. Without this, expected choiceworthiness is mathematically undefined.
  2.  **Meta-Normative Uncertainty (The Regress):** Uncertainty about which decision rule to use under moral uncertainty (e.g., uncertainty between Maximize Expected Choiceworthiness vs. My Favorite Theory). This generates a potential infinite regress of higher-order uncertainties.
  3.  **Incompleteness and Indeterminacy:** Many plausible moral theories do not yield complete orderings of options. Standard expected utility frameworks assume completeness. Handling uncertainty over incomplete orderings requires generalized decision theories.
  4.  **Fanaticism and Unbounded Value:** The structural tendency for expected choiceworthiness to be dominated by tiny probabilities of enormous value, exacerbated when moral theories themselves posit unbounded value structures.
  5.  **Deontological Constraints in Aggregation:** Whether agent-relative constraints can be represented in an aggregative framework without collapsing into a form of consequentialism or rendering the framework action-paralyzing.
  6.  **Meta-Ethical Uncertainty:** How the framework behaves if there is non-zero credence in error theory or non-cognitivism (i.e., if some "theories" in the distribution deny the existence of choiceworthiness).
  7.  **Action-Guidingness:** The normative status of moral uncertainty itself—whether it generates genuine reasons or is merely a heuristic for tracking the true moral theory.

  ### Stage 2: Evaluation of Serious Candidates

  I have selected the three most viable foundational candidates for a PhD project with your background. I exclude "Action-Guidingness" and "Meta-Ethical Uncertainty" as primary focuses because they risk dissolving the project entirely (if uncertainty isn't action-guiding or error theory is true, there is no formal structure to study). I exclude "Deontological Constraints" as a standalone topic because it is largely a specific application of the ITC and Incompleteness problems.

  #### Candidate 1: Intertheoretic Comparisons (The Measurement Problem)
  *   **Importance:** Critical. This is the sine qua non of the field. If intertheoretic comparisons are impossible or radically indeterminate, the standard expected choiceworthiness framework collapses.
  *   **Tractability:** Low to Medium. This is the hardest problem in the field. However, your decision theory background allows you to approach it via **measurement theory** rather than substantive ethics. You can investigate structural constraints (e.g., variance normalization, zero-point anchoring) rather than trying to derive moral facts.
  *   **Neglectedness:** Medium. While heavily discussed in the 2010s, recent work suggests the "standard" solutions are inadequate. A rigorous measurement-theoretic treatment is still lacking.
  *   **Dependencies:** Upstream of almost everything. Aggregation rules require comparable inputs.

  #### Candidate 2: Meta-Normative Uncertainty (The Regress Problem)
  *   **Importance:** High. Even if we solve ITC, we face uncertainty about how to aggregate (e.g., MEC vs. Borda vs. Veto). If we are uncertain about the aggregation rule, do we need a higher-order rule? Does this regress converge or explode?
  *   **Tractability:** High. This is a problem of hierarchical modeling and fixed-point theorems. It is well-suited for formal epistemology tools. You can prove convergence results or identify conditions under which higher-order uncertainty washes out.
  *   **Neglectedness:** High. Most literature assumes a fixed aggregation rule (usually MEC). Systematic analysis of uncertainty *about* the rule is nascent.
  *   **Dependencies:** Downstream of ITC (you need values to aggregate), but upstream of application. It can also mitigate ITC problems (if all reasonable rules converge, precise scaling matters less).

  #### Candidate 3: Incompleteness and Indeterminacy
  *   **Importance:** Medium-High. Standard frameworks assume moral theories provide complete orderings. If plausible theories are incomplete, the formalism must handle sets of utility functions or choice functions.
  *   **Tractability:** High. Decision theory under ambiguity and incomplete preferences is well-developed (e.g., E-admissibility, Maximality). The task is adapting these to the moral uncertainty context.
  *   **Neglectedness:** Medium. Often acknowledged but rarely formalized in depth within moral uncertainty specifically.
  *   **Dependencies:** Downstream of ITC (you need to compare incomplete theories). It generalizes the framework to be more realistic.

  ### Stage 3: Defended Ranking and Agenda

  Based on your background (Normative Ethics + Decision Theory) and the 3-4 year timeline, here is the prioritized agenda.

  #### **Rank 1: Intertheoretic Comparisons (via Measurement Theory)**
  **Why:** This is the foundational bottleneck. No amount of sophisticated aggregation modeling matters if the inputs are incommensurable. A dissertation that makes genuine progress here would be field-defining.
  **The Project:** Do not attempt to solve ITC by deriving moral facts (e.g., "pleasure is worth X"). Instead, treat it as a **measurement theoretic problem**. Investigate what structural features of moral theories (e.g., continuity, separability, symmetry) license unique scaling up to affine transformation.
  **Risk:** High. It is possible you will prove negative results (that comparison is impossible under plausible constraints).
  **Mitigation:** A negative result is still a significant philosophical contribution if rigorously proven. It forces the field to abandon expected choiceworthiness for ordinal or non-comparative frameworks.

  #### **Rank 2: Meta-Normative Uncertainty**
  **Why:** This is the most tractable high-impact topic. It leverages your formal epistemology skills directly. It addresses the stability of the framework: does the system stabilize when we acknowledge uncertainty about the decision rule itself?
  **The Project:** Model higher-order credences over aggregation rules. Investigate **convergence theorems**: under what conditions does uncertainty about the aggregation rule vanish at higher orders? Does "fanaticism" persist or dissolve when we are uncertain about whether to maximize expectations?
  **Strategic Value:** This can be done even if ITC remains partially unresolved. You can treat the input scales as parameters and analyze the aggregation structure independently.

  #### **Rank 3: Incompleteness and Indeterminacy**
  **Why:** This is the necessary generalization. If you solve ITC and Aggregation, you must show the framework handles realistic moral theories, which are often incomplete.
  **The Project:** Develop a decision rule for moral uncertainty where first-order theories yield partial orderings. Compare existing rules (e.g., Maximality vs. E-admissibility) in terms of their normative plausibility and formal properties (e.g., path dependence, dynamic consistency).
  **Strategic Value:** This serves as a robustness check. If your framework only works for complete theories, it is philosophically limited.

  ### Stage 4: Dependencies and Upstream/Downstream Analysis

  **The Logical Flow:**
  1.  **ITC (Upstream):** You must establish that theories *can* be represented on a common scale (or a structured set of scales) before you can aggregate them.
  2.  **Incompleteness (Parallel/Downstream):** Once you have a scale, you must determine if the ordering on that scale is complete. Incompleteness complicates ITC but is logically subsequent to the possibility of comparison.
  3.  **Meta-Normative Uncertainty (Downstream/Stabilizing):** Once you have a method for comparing and aggregating (even incomplete) theories, you analyze the stability of that method under uncertainty about itself.

  **Why this ordering?**
  I have ranked ITC first despite its low tractability because it is the **critical path**. If ITC is impossible, the Meta-Normative and Incompleteness projects become exercises in modeling a fiction. However, I recommend you structure the dissertation such that **Meta-Normative Uncertainty is your primary engine of production**, with ITC as the foundational chapter.
  *Reasoning:* You can produce positive formal results on Meta-Normative Uncertainty (Rank 2) even if ITC (Rank 1) remains partially open. You can treat ITC as a set of constraints on the input and analyze how the system behaves under those constraints. This ensures you graduate while still tackling the most important question.

  **Deprioritization:**
  *   **Fanaticism:** Treat this as a sub-problem of Meta-Normative Uncertainty. It is a specific pathology of expectation maximization, not a separate foundational pillar.
  *   **Meta-Ethical Uncertainty:** Deprioritize. If error theory is true, the project dissolves. Assume cognitivity for the sake of the structural model, noting it as a boundary condition.
  *   **Applied Questions:** Avoid. Do not use the framework to solve population ethics or AI alignment. Keep the focus on the decision rule itself.

  ### Stage 5: Conditions for Changing the Ranking

  You should shift your focus away from this agenda if:

  1.  **ITC is Proven Impossible (Year 1):** If, within the first year, you rigorously demonstrate that no non-question-begging intertheoretic comparison function exists under plausible structural constraints, **abandon Rank 1**. Pivot immediately to **Rank 2 (Meta-Normative)** but reframe it as "Decision Making without Intertheoretic Comparison" (e.g., using ordinal rankings or pairwise dominance).
  2.  **Tractability Wall (Year 2):** If the measurement theoretic work on ITC yields no publishable results by the end of year two, shift primary focus to **Meta-Normative Uncertainty**. The convergence results there are more likely to yield positive theorems suitable for a dissertation.
  3.  **Field Shift:** If the consensus moves decisively toward "My Favorite Theory" or skepticism about moral uncertainty's normativity, pivot to **Incompleteness** as a way to salvage a non-aggregative framework (e.g., showing how incomplete orderings can guide action without expectation maximization).

  **Summary Recommendation:**
  Anchor your dissertation in **Intertheoretic Comparisons**, approached through **measurement theory**. Use **Meta-Normative Uncertainty** as your secondary pillar to ensure formal productivity and address the stability of the framework. Treat **Incompleteness** as the generalization that ensures your model applies to realistic moral theories. This portfolio balances high-risk/high-reward foundational work with tractable formal modeling.
