      *   *Idea 3 (Betting):* Both agree that credence *usually* guides betting, but they might disagree on *which* betting setup aligns with credence. Let's refine: Both agree that if Beauty bets on every awakening, she maximizes expected utility by acting *as if* P(H)=1/3. (Halters accept this but say it's due to the betting structure, not credence).
      *   *Idea 4 (Sunday):* Both agree that on Sunday, P(H) = 1/2.
      *   *Idea 5 (Information):* Both agree that upon awakening, Beauty knows she is not in a scenario where she is never awakened (though that's not possible here). Better: Both agree she gains *some* self-locating information (e.g., "It is now an awakening time"), but disagree on relevance. Let's try: Both agree that the difference between Sunday and Monday involves a change in indexical knowledge ("I am awake now" vs "I will be awake").
