      *   *Constraint:* Questions where an answer undermines a view. Tests/variants.
      *   *Crux 1:* The "Extreme Sleeping Beauty" (Bostrom). If Tails = 1,000,000 awakenings. Halfer: Still 1/2. Thirder: ~0. Does the Halfer intuition break here?
      *   *Crux 2:* The Betting Test. If paid only once per experiment vs per awakening. Halfer says credence stays 1/2 even if betting suggests 1/3. Thirder says credence *is* the betting odds.
      *   *Crux 3:* Information Loss. Does Beauty lose information on Monday morning compared to Sunday? Halfer: No (or irrelevant). Thirder: Yes (she loses knowledge of *which* day it is relative to the coin). Actually, the "No New Info" argument is the Halfer crux. If we prove she *does* gain info, Halfer falls.
      *   *Crux 4:* The Clone Variant. If we create clones instead of amnesia. Does this change the epistemology?
