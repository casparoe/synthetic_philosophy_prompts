  4.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Neutral proposition, Halfer phrasing, Thirder phrasing.
      *   *Core Disagreement:* The value of P(H) upon awakening.
      *   *Deep Disagreement 1:* New Information. Halfer: No relevant info. Thirder: Self-locating info.
      *   *Deep Disagreement 2:* Reference Class. Halfer: Coin tosses. Thirder: Awakenings.
