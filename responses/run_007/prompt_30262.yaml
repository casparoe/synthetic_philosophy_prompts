answer: |-
  International law presupposes the moral equality of combatants as a binding normative convention grounded in epistemic limitation and institutional role, rather than as a reflection of underlying moral reality.

  The practice is committed to a theory of restricted agency where the soldier's moral horizon is deliberately narrowed to the immediate conduct of fighting (*jus in bello*) while the justice of the war (*jus ad bellum*) is reserved for the state and its leaders. This separation functions on the claim that ordinary soldiers lack the capacity, access to information, and political authority to reasonably adjudicate the legality of the war itself; therefore, they cannot be held culpable for participating in aggression provided they do not commit specific atrocities. The system requires this insulation because if soldiers were held responsible for the macro-justice of the conflict, the laws of war would collapse into asymmetry: soldiers on the unjust side would have no incentive to follow rules if doing so merely facilitated their own prosecution as accomplices to murder. Consequently, the law treats the permission to kill as symmetric not because killing for an unjust cause is morally identical to killing for a just cause, but because treating them as identical is the only way to maintain a regulatory framework that limits violence regardless of political outcome.

  However, the practice is underdetermined regarding the ultimate moral status of the soldier. The legal immunity granted to unjust combatants is compatible with two distinct philosophical views: either that soldiers are fully justified because their role morality overrides the injustice of the cause, or that they are morally culpable but legally excused due to duress, ignorance, or coerced participation. International law does not need to settle whether an unjust combatant is morally innocent; it only needs to establish that they are legally immune. This allows the system to function even if moral philosophers argue that unjust combatants are actually doing wrong, because the law prioritizes the pragmatic goal of containment over the metaphysical goal of retributive justice for the act of fighting itself.

  If you swapped in the view that unjust combatants are moral wrongdoers liable for their participation, the legal architecture would require radical transformation. Soldiers would no longer have a blanket immunity for fighting; they would be obligated to assess the justice of the war before deploying, and failure to do so would constitute a crime. Prisoner of War status would become conditional on fighting for a just cause, meaning aggressor soldiers could be prosecuted for mere participation or treated as common criminals rather than privileged belligerents. Reciprocity would vanish, as the "just" side would have no incentive to offer protections to those deemed morally liable for aggression, likely leading to increased brutality, refusal to accept surrenders, and the erosion of the very rules the current system seeks to enforce.
