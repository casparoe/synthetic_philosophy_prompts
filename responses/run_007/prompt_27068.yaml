      This exposes a potential quietism in contractualism. It is excellent at diagnosing wrongs but less clear on remediation when the wrong is foundational. If the walkers stayed and protested, they might be punished or ignored. If they free the child, they destroy the city. Walking away is a third option: moral purity without political efficacy. Scanlon might argue this preserves the walkers' relationship to morality, but the story leaves us uneasy. It suggests that identifying a reasonable rejection isn't enough; we demand a path to rectification. The story implies that a theory that only tells you to "walk away" from injustice rather than dismantle it is incomplete.

