      "Omelas" is usually a blunt instrument against utilitarianism. Through Scanlon's contractualism, it becomes a scalpel. Scanlon argues an act is wrong if it violates principles no one could reasonably reject. This blocks aggregation: you cannot trade one person's severe suffering for the diffuse benefits of many. Omelas is the aggregation problem incarnate. But Le Guin's story pressures contractualism where abstract cases do not: in the necessity of the harm and the silence of the dissenters.

      Consider the citizens' rationalization. They accept a principle: "Maximum flourishing justifies extreme individual burden." Scanlon says the child can reasonably reject this. The child's burden is catastrophic; the citizens' benefit, while vast, is arguably less urgent per person. Contractualism gives the child a veto. However, the story complicates this by making the suffering *necessary*. In standard philosophy examples, trade-offs are contingent policy choices. In Omelas, the misery is metaphysical infrastructure. If the child is freed, Omelas collapses. Does the child's veto still hold if exercising it destroys the very community to which justification is owed? Scanlon insists on the individual's standing, but the story forces us to feel the weight of a veto that entails universal ruin. It tests whether contractualism is truly non-consequentialist when the consequences are total.

      Next, the distinction between consent and outcome. The citizens know about the child; the child never consents. Scanlon cares about *justifiability*, not actual consent. A principle can be justifiable even if some disagree, provided their rejection isn't reasonable. Here, the child's rejection is clearly reasonable. But the story highlights a gap: the child isn't just unconsulted; the child is incapacitated. Contractualism assumes agents capable of reasoning about principles. The child is too degraded to negotiate. This reveals a limit in Scanlon's framework: it protects persons as rational agents, but what when the victim is stripped of agency? The story suggests the wrong isn't just the lack of consultation, but the reduction of a person to a mere condition of others' happiness. Contractualism identifies the violation of standing, but the literary depiction of the child's abjection adds emotional weight to the abstract notion of "reasonable rejection."

