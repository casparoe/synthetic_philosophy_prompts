answer: |-
  It is understandable why your friend finds Dennett's center of gravity analogy so compelling, as it offers a elegant dissolution of the hard problem of the self without denying the utility of the concept. To audit this properly, we must first lay out the mapping clearly to see where the structural load is being borne. In Dennett's picture, the physical object corresponds to the human organism, specifically the body and brain operating over time. The distribution of mass maps onto the totality of the person's behavioral dispositions, memories, verbal reports, and physical actions. The abstract point, which is the center of gravity itself, corresponds to the self or the I. The gravitational field or the physical laws that make the center of gravity a calculable necessity correspond to the social and linguistic practices that demand we treat humans as agents responsible for their actions. Finally, the usefulness of the center of gravity for calculation, which allows physicists to predict the stability of an object without tracking every atom, maps onto the utility of the self-concept for predicting behavior, coordinating social interaction, and simplifying the complex data of a human life into a coherent narrative agent.

  However, when we press on this mapping, several significant strains appear that your friend may be glossing over. The most immediate disanalogy is that a center of gravity is phenomenologically inert. It does not feel like anything to be a center of gravity, whereas the self is characterized precisely by the fact that it feels like something to be oneself. A center of gravity has no point of view, it does not care about its own persistence, it is not the object of moral attitudes like praise or blame, and it certainly does not author the movements of the object it inhabits. Your friend might dismiss these as superficial differences, arguing that they are merely features of the narrative illusion, but this is where the analogy risks doing illicit argumentative work. If the self is truly like a center of gravity, then the feeling of agency and the capacity for moral responsibility should be as illusory as the idea that the center of gravity is a physical bead inside the object. Yet, unlike the center of gravity, the self is the locus of causal intervention in the world. We change our behavior based on our self-conception in a way that an object's trajectory does not change based on the calculation of its center of mass.

  These disanalogies matter profoundly for the conclusion your friend wants to draw. Your friend argues that because the self is an abstraction like a center of gravity, questions about what it really is should be set aside as confused. This conclusion does not fully survive the audit because it conflates being abstract with being a fiction. Dennett himself is careful to describe the self as an abstract real pattern, not a fiction. A center of gravity is real in that it has predictive power and is grounded in physical facts, but it is not a substance. Your friend's leap to calling it a useful fiction suggests that there is nothing there to investigate, whereas Dennett's view suggests there is a complex functional architecture to investigate, just not a Cartesian soul. By treating the self as merely a fiction, your friend shuts down the inquiry into how the narrative gravity is generated, which is a legitimate scientific question. The question what is the self really is not a category mistake if it is interpreted as asking about the neural and social mechanisms that sustain the narrative gravity, rather than asking for the location of a homunculus. The analogy successfully kills the Cartesian theater, but it should not kill the naturalistic investigation into the processes that create the center of narrative gravity.

  The analogy was quietly doing argumentative work for your friend by leveraging the intuition that abstract things lack causal power. Because a center of gravity cannot push or pull, the implication is that the self cannot truly act. But this ignores that abstract patterns in complex systems can have downward causal power. A better analogy that captures what is right and wrong in Dennett's picture while avoiding the inertness of the center of gravity is the analogy of a vortex. A vortex in a fluid is not a material object you can hold; it is a pattern of flow defined by the movement of the water around it. Like the center of gravity, it has no solid core, and like the self, it is a dynamic stability maintained by continuous energy throughput. However, unlike the center of gravity, a vortex is causally active. It can erode a riverbank, pull objects into it, and maintain its structure against disturbances. It is real, it is physical, yet it is not a substance. This analogy preserves the insight that there is no little person in the head, but it corrects the implication that the self is merely a passive calculational tool. It allows us to say that the self is a dynamic process that really does something, which means questions about its constitution are not only valid but necessary for understanding how consciousness and agency emerge from the flow of neural and social activity.
