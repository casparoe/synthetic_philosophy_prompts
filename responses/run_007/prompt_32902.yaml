      *   Data Sufficiency: Essential (Non-negotiable).

  4.  **Developing the Scorecard:**
      *   *Revealed Preference (Economics):* Great at consistency, terrible at mistakes/beliefs. Assumes rationality. Fails the "mistake" test.
      *   *Inverse Reinforcement Learning (AI):* Assumes optimal/near-optimal behavior. Struggles with bias/belief separation unless explicitly modeled.
      *   *Learning from Human Feedback (RLHF):* Explicitly tries to bypass behavior for stated preference, but inherits biases of the raters. Often conflates "helpful" with "true preference."

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the confusion. "Preference," "Value," and "Reward" are often conflated.
      *   **The Spec (Desiderata):**
          1.  *The Identification Condition (The Killer).* Separating beliefs from desires.
          2.  *The Error Model.* Distinguishing mistakes from intent.
          3.  *The Constraint Boundary.* Distinguishing "can't" from "won't."
          4.  *The Stability/Coherence Check.* Diachronic consistency (time).
          5.  *The Normative Stance.* Are we building a mirror or a guide?
          6.  *The Data Sufficiency Claim.* What counts as evidence?
      *   **Camp Commitments:** Label which are universal vs. specific (e.g., Rationality is an economist commitment, not a universal truth).
      *   **The User's List:** Validate their suspicions. They are mostly non-negotiable.
      *   **The Scorecard:** Briefly assess RP, IRL, RLHF against the spec.

  6.  **Refining the "Killer" Argument:**
      *   Why is Underdetermination the killer? Because without solving it, *any* behavior can be rationalized post-hoc. If I eat mud, do I like mud, or do I believe mud is chocolate? If the theory can't distinguish, it explains nothing.
      *   This is the "Quine-Duhem" problem applied to psychology/economics.

  7.  **Refining the Terminology:**
      *   *Preference:* Ordering over outcomes.
      *   *Value:* Often normative weight.
      *   *Reward:* Signal used for optimization (often proxy).
