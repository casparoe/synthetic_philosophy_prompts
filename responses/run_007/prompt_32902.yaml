      *   **Task:** Create a "spec" or list of desiderata for any theory claiming to infer human preferences/values/reward functions from behavior.
      *   **Requirements:**
          *   Define what an adequate account must deliver.
          *   Provide the *reasoning* (case/consideration) for each requirement.
          *   Distinguish between non-negotiable (core) requirements and camp-specific commitments (economists, RL, philosophers).
          *   Identify the *single* requirement that kills naive "action = desire" inference.
          *   Evaluate the user's suspected list (constraints, risk, time, norms, descriptive/normative, underdetermination, data sufficiency).
          *   Scorecard: Run Revealed Preference (RP), Inverse Reinforcement Learning (IRL), and Learning from Human Feedback (LHF/RLHF) against the list.
      *   **Tone:** Professional, direct, conceptual, slightly critical/analytical (matching the user's skepticism). No fluff, no citations.

  2.  **Deconstruct the Core Problem:**
      *   The fundamental issue is the *Inverse Problem of Agency*. We observe $Behavior$. We want to know $Preferences$. But $Behavior = f(Preferences, Beliefs, Constraints, Noise, Norms, ...)$.
      *   Without fixing the other variables, you can't solve for Preferences.
      *   The user suspects "underdetermination" is key. They are right.

  3.  **Drafting the Desiderata (The Spec):**
      *   *Idea 1: The Belief-Preference Separation.* You can't know what they want if you don't know what they think is true. (User mentioned this).
      *   *Idea 2: Competence/Noise.* People make mistakes. A theory must distinguish error from intent.
      *   *Idea 3: Constraints.* You can't want what you can't have.
      *   *Idea 4: Stability/Coherence.* Preferences shouldn't flip-flop randomly without cause.
      *   *Idea 5: Normative vs. Descriptive.* Are we predicting what they *will* do or prescribing what they *should* get?
      *   *Idea 6: Underdetermination.* The mapping isn't one-to-one.
      *   *Idea 7: Welfare.* Does satisfying this preference actually make them better off? (Tricky, philosophical).

      *Refining for the "Spec" format:*
      *   Need to categorize them as Non-Negotiable vs. Camp-Specific.
      *   Need to identify the "Killer" requirement.

      *The "Killer":* It's the **Underdetermination / Identification Problem**. Specifically, the inability to separate Beliefs from Preferences without external anchors. If $Action = ArgMax(Preference \times Belief)$, observing Action gives you one equation with two unknowns.

      *Evaluating User's Hobbyhorses:*
      *   Constraints/Misinformation: Essential (Non-negotiable).
      *   Risk/Time: Essential (Non-negotiable).
      *   Norms/Signaling: Essential (Non-negotiable).
      *   Descriptive vs. Normative: Crucial distinction (Non-negotiable for clarity).
