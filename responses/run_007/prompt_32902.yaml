      *(Self-Correction on the "Killer"):* While Underdetermination is the logical killer, the *Error Model* is often the practical killer. If you assume optimality, you infer preferences from mistakes. I should emphasize the **Separation of Beliefs and Preferences** as the core logical requirement, which necessitates an Error Model. Let's call it the **Identification Problem**.

      *(Refining the User's List):* The user asked if their list items are genuine requirements or hobbyhorses. I need to explicitly validate them. They are mostly genuine requirements.

      *(Final Plan):*
      1.  Terminology cleanup (Preference vs. Value vs. Reward).
      2.  The Spec (6 points).
      3.  The "Killer" requirement.
      4.  Validation of User's List.
      5.  The Scorecard.

      Let's write it.

      *Wait, one nuance:* The user asked about "Descriptive vs Normative." This is huge. Economics is usually descriptive (predicting choice). AI Safety is often normative (aligning with 'true' values). I need to make sure this distinction is sharp in the spec.

      *Another nuance:* "Risk attitudes." Is that a preference or a belief about probability? In Expected Utility, it's part of the utility function (preference). In Prospect Theory, it's cognitive framing. A robust theory needs to specify where risk lives.

      *Okay, ready to generate.*
answer: |-
  Here is the spec you asked for. It cuts through the conflation of "preference," "value," and "reward," and sets out the conditions any theory must meet to claim it is inferring what humans actually want from what they actually do.

  ### Terminology Cleanup
  Before the spec, a quick distinction:
  *   **Preference:** A formal ordering of outcomes (I prefer A to B).
  *   **Value:** Often implies a normative weight (A is *better* than B, regardless of what I choose).
  *   **Reward:** A scalar signal used by an algorithm to update parameters.
  *   **The Conflation:** AI labs often treat *Reward* as *Preference*, and *Preference* as *Value*. They are not the same. A drug addict has a preference for the drug, but may not value the outcome, and the reward signal might be hijacked. An adequate theory must distinguish these.

  ---

  ### The Spec: Desiderata for Preference Inference

  Here are the six requirements. I have marked which are **Non-Negotiable** (logical prerequisites for the claim to make sense) and which are **Camp Commitments** (assumptions specific to economics, AI, etc.).

  #### 1. The Identification Condition (Separation of Beliefs and Desires)
  *   **Status:** **Non-Negotiable**
  *   **The Requirement:** The theory must provide a method to distinguish between an agent *wanting* an outcome and an agent *believing* an action leads to that outcome.
  *   **The Case:** Behavior is the product of Preferences $\times$ Beliefs. If I eat what looks like chocolate but is actually mud, did I prefer mud? Or did I have a false belief? If your theory cannot separate these, you can rationalize *any* behavior as *any* preference.
  *   **Why it kills naive inference:** This is the single requirement that destroys the "they did X so they want X" argument. Without independent access to beliefs (or a constraint on what beliefs are rational), preference inference is mathematically impossible.

  #### 2. The Error Model (Competence vs. Noise)
  *   **Status:** **Non-Negotiable**
  *   **The Requirement:** The theory must specify what counts as a mistake. It must allow for the possibility that behavior deviates from preference due to cognitive slip, fatigue, or coercion, without treating that deviation as a new preference.
  *   **The Case:** Humans are not optimizers. We click the wrong link, say things in anger, and succumb to addiction. A theory that treats every action as optimal (like strict Revealed Preference) infers that a smoker *prefers* lung cancer because they chose to smoke. You need a noise parameter or a "competence" model.
  *   **Camp Commitment:** Economists often assume away error to preserve parsimony. AI/RL people model it as "softmax noise." Philosophers argue about whether "true preference" exists beneath the error.

  #### 3. The Constraint Boundary (Can't vs. Won't)
  *   **Status:** **Non-Negotiable**
  *   **The Requirement:** The theory must distinguish between actions not taken due to lack of desire and actions not taken due to lack of ability/resources.
  *   **The Case:** If I don't buy a yacht, is it because I don't want one or because I'm broke? Inferring preference requires knowing the choice set. If the system doesn't know the constraints, it infers false frugality.
  *   **Camp Commitment:** Economists are rigorous here (budget sets). AI agents often assume the action space is fixed, missing social or physical constraints invisible to the sensor.

  #### 4. The Stability/Coherence Check (Diachronic Consistency)
  *   **Status:** **Non-Negotiable**
  *   **The Requirement:** The theory must account for time. It must distinguish between a *change in preference* and a *failure of self-control* (time inconsistency).
  *   **The Case:** I prefer to diet tomorrow, but eat cake today. Is my "true" preference the diet or the cake? A theory that only looks at the moment of action infers I love cake. A theory that looks at the plan infers I love dieting. You need a rule for which time-slice counts as the "author" of the preference.
  *   **Camp Commitment:** Behavioral economists focus heavily on this (hyperbolic discounting). Classical economics assumes consistent discounting.

  #### 5. The Normative Stance (Mirror vs. Guide)
  *   **Status:** **Non-Negotiable** (for clarity, not for truth)
  *   **The Requirement:** The theory must declare whether it is *descriptive* (predicting what they will choose) or *normative* (inferring what would make them flourish).
  *   **The Case:** If you are building an AI assistant, do you want to give people what they ask for (descriptive) or what is good for them (normative)? Conflating these leads to "alignment" that actually enables addiction or polarization because the system optimizes for stated desire rather than welfare.
  *   **Camp Commitment:** Economics is strictly descriptive (no judgment on preferences). AI Safety is often implicitly normative (trying to find "human values").

  #### 6. The Data Sufficiency Claim
  *   **Status:** **Non-Negotiable**
  *   **The Requirement:** The theory must state what data would *falsify* the inferred preference. If no possible behavior could prove the preference wrong, the theory is unfalsifiable.
  *   **The Case:** If you infer I value privacy, but then I trade my data for a coupon, do you update the preference or say I was misinformed? If you can explain away every contradiction by adjusting beliefs or noise, you haven't inferred a preference; you've told a story.
  *   **Camp Commitment:** Scientists demand this. Product teams often ignore it in favor of "good enough" prediction.

  ---

  ### The "Killer" Requirement
  **Requirement #1: The Identification Condition.**

  This is the one that kills the naive "action = desire" inference.
  **Why:** It is the **Underdetermination Problem**.
  For any observed behavior $B$, there are infinite combinations of Preference ($P$) and Belief ($\beta$) such that $B = f(P, \beta)$.
  *   I pray for rain.
      *   Inference A: I want rain ($P$) and believe prayer works ($\beta$).
      *   Inference B: I want to signal piety ($P'$) and believe signaling works ($\beta'$).
      *   Inference C: I don't want rain, but believe a demon will kill me if I don't pray ($P''$, $\beta''$).

  Without an external anchor on beliefs (e.g., asking the person, or knowing the physics of the world), you cannot solve for $P$. Most current AI systems assume $\beta$ is "perfect knowledge of the environment," which is false for humans. This assumption allows them to claim they are inferring preferences, but they are actually inferring *preferences conditional on the human knowing everything the AI knows.*

  ---

  ### Evaluation of Your "Hobbyhorses"
  You suspected these were requirements. You are right. They are not hobbyhorses; they are the structural load-bearing walls of the problem.

  1.  **Constraints/Misinformation:** **Genuine Requirement.** (See Identification & Constraint Boundary). If you don't model false beliefs, you infer preferences for impossible or harmful outcomes.
  2.  **Risk Attitudes:** **Genuine Requirement.** Is the person avoiding the gamble because they are risk-averse (preference) or because they think the odds are rigged (belief)? This falls under Identification.
  3.  **Time/Changing Mind:** **Genuine Requirement.** (See Stability). Essential for distinguishing addiction/habit from valuation.
  4.  **Norms/Signaling:** **Genuine Requirement.** This is a specific type of Belief/Preference interaction. If I donate to charity to look good, my preference is for *status*, not *charity*. A theory that infers I value charity is descriptively wrong about my utility function.
  5.  **Descriptive vs. Normative:** **Genuine Requirement.** Crucial for ethics. If you claim to recover "values" but only recover "clicks," you are lying about the normative status.
  6.  **Underdetermination:** **Genuine Requirement.** This is the core logical barrier.
  7.  **Data Sufficiency:** **Genuine Requirement.** Without this, the theory is pseudoscience.

  **Verdict:** Your list is accurate. These aren't nitpicks; they are the reasons why this problem is unsolved.

  ---

  ### The Scorecard: Contenders vs. The Spec

  Here is how the three main frameworks stack up. Note where they fail the Non-Negotiables.

  | Requirement | **Revealed Preference (Economics)** | **Inverse Reinforcement Learning (AI/RL)** | **Learning from Human Feedback (RLHF)** |
  | :--- | :--- | :--- | :--- |
  | **1. Identification (Beliefs vs. Desires)** | **FAIL.** Assumes agents have rational expectations (correct beliefs). Infers belief errors as preference quirks. | **FAIL.** Usually assumes the demonstrator knows the true reward function and environment dynamics. | **PARTIAL.** Bypasses behavior for statements, but raters have false beliefs too. |
  | **2. Error Model (Mistakes)** | **FAIL.** By definition, choice reveals preference. You cannot choose "wrongly." | **PASS.** Explicitly models sub-optimality (noise/boltzmann rationality). | **PASS.** Aggregates ratings to smooth out individual rater error. |
  | **3. Constraint Boundary** | **PASS.** Rigorous about budget sets and feasible choices. | **PARTIAL.** Depends on state-space definition. Often misses social constraints. | **FAIL.** Raters often ignore feasibility constraints when rating hypothetical outcomes. |
  | **4. Stability (Time)** | **FAIL.** Assumes consistent discounting. Struggles with hyperbolic discounting (addiction/procrastination). | **PARTIAL.** Can model time, but usually assumes stationary reward functions. | **FAIL.** Captures a snapshot of preference. Struggles with evolving values over long horizons. |
  | **5. Normative Stance** | **PASS (Clear).** Strictly descriptive. Makes no claim about welfare. | **FAIL (Unclear).** Claims to find "reward," but often treated as "value." Ambiguous on welfare. | **FAIL (Unclear).** Conflates "helpful/harmless" (normative) with "what human asked for" (descriptive). |
  | **6. Data Sufficiency** | **PASS.** Falsifiable by showing inconsistent choices (though often patched with "new preferences"). | **PARTIAL.** Requires expert demonstrations. Ambiguous on what data resolves belief/desire ambiguity. | **FAIL.** No clear stopping point. More data just averages bias, doesn't necessarily resolve underdetermination. |

  ### Summary of the Scorecard
  *   **Revealed Preference:** Logically consistent but empirically brittle. It solves Underdetermination by *denying* it exists (defining preference *as* behavior). This makes it useless for AI alignment, where we need to know what humans want *when they are wrong*.
  *   **Inverse Reinforcement Learning:** Technically sophisticated regarding error, but inherits the economist's blind spot on beliefs. It assumes the human knows the world as well as the robot does.
  *   **Learning from Human Feedback:** Attempts to patch the belief problem by asking humans directly, but introduces new normative confusion (is the rater expressing a preference or a social norm?) and fails to account for the rater's own cognitive biases.

  **The Bottom Line:** None of the current contenders fully satisfy the **Identification Condition**. They all rely on a hidden assumption that human beliefs are either correct, irrelevant, or separable without extra data. Until a system can explicitly model and test *human beliefs* separately from *human desires*, any claim to have "recovered human preferences" is marketing, not science.
