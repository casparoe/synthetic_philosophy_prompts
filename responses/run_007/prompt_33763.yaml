prompt: |-
  I keep noticing a pattern in committees and working groups and I'm trying to figure out if there's an established name for it. Here's the setup: you've got a group of people who are each individually pretty good at making the right call — say, doctors diagnosing a condition, or a hiring committee evaluating candidates. You add more people to the group, and at first the decisions get better, which makes sense. But then at some point they start getting worse again, even though each new person you added is still individually competent. It's not groupthink, exactly — people are still disagreeing and debating, nobody's afraid to speak up. It's more like the signal just gets washed out as the group gets bigger. I know there's some mathematical result out there that says larger groups of competent people should make more accurate decisions, so I'm trying to understand the gap between that and what I keep seeing. Is there a name for this phenomenon — the point where adding competent people starts hurting rather than helping — and what are the mechanisms that actually make it happen? Also, how confident are you in the answer, and which part of the explanation are you least sure about?
