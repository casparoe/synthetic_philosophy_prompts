answer: |-
  You have accurately identified a well-documented tension in social science and organizational theory. You are correct that there is a mathematical theorem suggesting larger groups should be smarter, and you are also correct that reality frequently violates this theorem.

  Here is the breakdown of the name, the math, the mechanisms, and my confidence levels.

  ### 1. Is there a name for this?

  There is no single, universally recognized eponymous "Law" (like Murphy's Law) for this specific phenomenon, but it is most formally described in social psychology and organizational behavior as **Process Loss**.

  Specifically, you are describing the **curvilinear relationship between group size and decision quality**, driven by **Process Loss**.

  *   **Process Loss:** This is the umbrella term coined by psychologist Ivan Steiner (1972). It defines the difference between a group's *potential* productivity (the sum of its members' abilities) and its *actual* productivity. As group size increases, process losses eventually outweigh process gains.
  *   **Diseconomies of Scale:** In economics and management theory, this is often referred to as diseconomies of scale applied to decision-making.
  *   **The Condorcet Paradox (Colloquial):** While not the strict mathematical definition, some practitioners refer to the failure of Condorcet's Jury Theorem in real-world settings as a "Condorcet Paradox."

  ### 2. The Mathematical Expectation: Condorcet's Jury Theorem

  You mentioned knowing the math that suggests larger groups should be better. This is **Condorcet's Jury Theorem** (1785).

  *   **The Premise:** If every individual in a group has a greater than 50% chance ($p > 0.5$) of making the correct decision, and they vote independently, the probability of the majority being correct approaches 100% as the group size approaches infinity.
  *   **The Break:** The theorem relies on a critical assumption: **Independence.** It assumes Person A's vote does not influence Person B's vote, and that their errors are random (uncorrelated).

  In real committees, independence is almost impossible to maintain. Once people talk, errors become correlated, and the mathematical guarantee collapses.

  ### 3. The Mechanisms: Why does quality drop?

  If it isn't groupthink (social pressure to conform), what is washing out the signal? Research points to four main mechanisms of Process Loss:

  **A. Coordination and Communication Costs**
  As you add people, the number of communication channels grows exponentially ($n(n-1)/2$). In a group of 5, there are 10 channels. In a group of 20, there are 190.
  *   **The Effect:** More time is spent managing the conversation, scheduling, and ensuring everyone is heard, leaving less time for deep cognitive processing of the actual problem. The "signal" isn't just washed out; it's drowned by the noise of coordination.

  **B. The Common Information Effect**
  Groups have a strong bias to discuss information that *everyone* already knows (shared information) rather than information held by *one* expert (unique information).
  *   **The Effect:** In a small group, unique expertise is easier to surface. In a large group, the discussion gravitates toward the lowest common denominator of knowledge. The "competent" new members stop sharing their unique insights because they feel redundant or cannot find a gap in the conversation to speak.

  **C. Correlated Errors (Systemic Bias)**
  Condorcet assumes errors are random. In professional committees (doctors, hiring managers), members often share the same training, culture, or data sources.
  *   **The Effect:** If the "correct" answer requires challenging a foundational assumption that all members were taught in med school or business school, adding more members from the same background doesn't add new signal; it amplifies the same systemic bias. The group becomes *more confident* in the wrong answer, not less.

  **D. Cognitive Overload and Social Loafing**
  Even competent individuals have limited cognitive bandwidth.
  *   **The Effect:** As the volume of information presented by other members increases, individuals switch from "deep processing" to "heuristics" (mental shortcuts). Additionally, **Social Loafing** (diffusion of responsibility) can occur even without laziness; individuals may subconsciously assume, "Someone else in this big group will catch that error," leading to reduced individual vigilance.

  ### 4. Confidence and Uncertainty

  **How confident am I in this answer?**
  **High Confidence (85-90%).**
  The existence of the phenomenon (the curvilinear curve of group performance) is robustly supported by meta-analyses in organizational psychology (e.g., research by Anita Woolley on "Collective Intelligence" or classic studies by Steiner and Hackman). The explanation that Process Loss overrides Condorcet's assumptions is the standard academic consensus.

  **Which part am I least sure about?**
  **The Specific Nomenclature (10-15% uncertainty).**
  While "Process Loss" is the correct technical term, I am less confident that there is a specific, catchy phrase you might be fishing for that I haven't mentioned. Different fields use different labels:
  *   *Psychologists* say "Process Loss."
  *   *Economists* say "Diseconomies of Scale."
  *   *Data Scientists* might refer to "Dimensionality Curse" in ensemble models (though that's slightly different).
  *   *Management Consultants* often say "The Two-Pizza Rule" (Amazon's heuristic that teams shouldn't be larger than what two pizzas can feed).

  If there is a specific, obscure eponymous law (e.g., "The Mosher Effect") that describes this exact curve, it is not part of the dominant literature. However, the *mechanism* described above is the widely accepted explanation for why Condorcet's Jury Theorem fails in human committees.

  ### Summary
  The phenomenon is **Process Loss** resulting in a **curvilinear performance curve**. It happens because real-world groups violate Condorcet's assumption of **independence**, succumbing instead to **communication overhead**, **common information bias**, and **correlated errors**. The "sweet spot" for decision-making groups is typically cited in literature as between **5 and 7 members**; beyond that, the marginal cost of coordination exceeds the marginal gain of additional competence.
