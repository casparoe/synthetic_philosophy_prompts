  8.  *(Final check of the "Knob" metaphor)*: Does Hofstadter actually use "knob-twiddling" as a rigid term? He uses it in *Fluid Concepts and Creative Analogies*. It implies a control panel. If the control panel rewires itself, is it still a control panel? Callum is right to question this.

  9.  *(Final check on Falsifiability)*: Sasha says it rules out "random mutation." But random mutation + selection *is* a valid model of creativity (evolutionary algorithms). So ruling that out might actually make the model *wrong* in some contexts. This is a point for Callum.

  10. **Structure:**
