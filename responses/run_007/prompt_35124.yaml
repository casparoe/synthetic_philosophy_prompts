prompt: |-
  I got into an argument about the doomsday argument at a party (as one does) and realized we were talking past each other for two hours because I was doing roughly self-sampling and they were doing roughly self-indication. I want to turn that into one of those "which position do you actually hold?" quizzes for a small philosophy blog, but it has to sort readers by what they say about concrete cases, not by which label they like.

  The quiz should have eight to ten questions, each a little thought experiment with two or three answer options. Cases I definitely want included: the doomsday argument setup; the presumptuous philosopher; something like God's coin toss where a fair coin determines whether one or a million people are created in otherwise identical rooms and you have to say how confident you are that it came up the million side; an urn with a small versus huge population and a random draw; and Sleeping Beauty, or an explanation of why you left it out if you do. For each question, tell me (in a separate key, not shown to quiz takers) which positions it splits. The scoring key should map answer patterns onto the self-sampling assumption, the self-indication assumption, something like full non-indexical conditioning, and a "no stable position" result. Also flag any pair of positions the quiz can't seperate, and diagnose any answer combinations that come out empty: is nobody there because the combination is incoherent, unattractive, or just unexplored? Audience is people who've read some philosophy but don't know this literature, so the plain-language explanations come only after they've been sorted. And please, no question that just asks "do you self-sample?"
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Topic:** Anthropic reasoning (Self-Sampling Assumption [SSA] vs. Self-Indication Assumption [SIA] vs. Full Non-indexical Conditioning [FNC] vs. "No Stable Position").
      *   **Format:** 8-10 question quiz with thought experiments and answer options.
      *   **Content Requirements:** Must include Doomsday Argument, Presumptuous Philosopher, God's Coin Toss (1 vs. 1M people), Urn problem, Sleeping Beauty (or explanation for exclusion).
      *   **Constraint:** No questions asking directly about labels (e.g., "Do you self-sample?"). Must use concrete cases.
      *   **Output:** Quiz questions + Separate Scoring Key (mapping answers to positions, flagging inseparable positions, diagnosing empty combinations).
      *   **Audience:** Philosophy-literate but not specialists in anthropics. Plain language explanations *after* sorting.

  2.  **Deconstruct the Positions:**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random observer from the *actual* reference class. Tends to favor smaller worlds (Doomsday). $P(H|E) \propto P(E|H) \times P(H)$. In God's Coin Toss (1 vs 1M), SSA says 50/50 (because the prior is 50/50 and being *you* is guaranteed in either world, though your *rank* matters). Wait, let's refine SSA.
          *   *Standard SSA:* You are a random sample from the set of *actual* observers.
          *   *Doomsday:* If total humans $N$ is large, my rank $n$ is unlikely. If $N$ is small, $n$ is likely. So $N$ is likely small.
          *   *God's Coin Toss:* Heads = 1 person, Tails = 1M people. Coin is fair. I exist.
              *   SSA: $P(Heads|I exist) = P(I exist|Heads)P(Heads) / P(I exist)$. Since I exist in both, $P(I exist|H) = 1$. So it stays 50/50. (Unless we treat "me" as a random sample from the *potential* observers, which slides into SIA).
              *   *Correction:* SSA usually implies $P(Heads|I am \text{specific person}) = 1/2$. SIA implies $P(Heads|I exist) \approx 1/1,000,000$ (Tails is much more likely because there are more slots for me to be in).
      *   **SIA (Self-Indication Assumption):** Reason as if you are a random observer from the set of *possible* observers. Tends to favor larger worlds. $P(H|E) \propto P(E|H) \times P(H) \times N_H$ (where $N_H$ is number of observers in H).
          *   *Doomsday:* Cancelled out. Being in a large world is more likely because there are more people to be.
          *   *God's Coin Toss:* Tails (1M) is 1M times more likely than Heads (1).
          *   *Presumptuous Philosopher:* SIA says you can know the universe is huge just because you exist. SSA says you can't.
      *   **FNC (Full Non-indexical Conditioning):** Condition on all evidence, including the fact that *someone* with your exact memories exists. Often aligns with SIA but tries to avoid indexical baggage. (For the purpose of a quiz, FNC often tracks closely with SIA, but can diverge on reference class issues. I need to make sure I can distinguish them or acknowledge they cluster).
      *   **No Stable Position:** Skepticism about anthropic reasoning, shifting reference classes, or "it depends."

  3.  **Drafting the Questions:**
      *   *Goal:* 8-10 questions covering the required cases.
      *   *Q1: God's Coin Toss (The Core).* Heads=1 room, Tails=1M rooms. You wake in a room. Probability of Tails?
          *   SSA: 50%. SIA: ~100%.
      *   *Q2: Doomsday Argument (The Classic).* Born 100 billionth human. Is total human count likely closer to 200B or 200T?
          *   SSA: 200B. SIA: Indifferent (or 200T if priors allow).
      *   *Q3: Presumptuous Philosopher (The Consequence).* Two theories of physics. T1: 1 trillion observers. T2: 1 trillion trillion observers. Experiment pending. Can you rule out T1 based on existence?
          *   SSA: No. SIA: Yes (T2 is vastly more likely).
      *   *Q4: Urn Problem (The Analogy).* Urn A: 10 balls. Urn B: 10,000 balls. Pick a ball at random. It's #7. Which urn?
          *   This is non-anthropic but tests Bayesian intuition on sampling.
          *   Actually, let's make it anthropic. Urn A: 10 people created. Urn B: 10,000 people created. You are one. Which urn? (Same as Coin Toss). Let's vary it.
          *   *Revised Q4:* The "Incubator" variant. Machine creates 1 person (Room 1) or 1M people (Rooms 1-1M). You are in Room 1.
          *   SSA: 50/50 (Room 1 exists in both). SIA: 1M times more likely to be Tails.
      *   *Q5: Sleeping Beauty (The Indexical).* Coin tossed. Heads: Wake once (Mon). Tails: Wake twice (Mon, Tue), memory wipe. You wake up. Credence Heads?
          *   Halfer (SSA-ish): 1/2. Thirder (SIA-ish): 1/3.
          *   *Note:* Request asks to include or explain exclusion. I'll include it because it's iconic, but note the mapping complexity.
      *   *Q6: The Reference Class (The Nuance).* Aliens exist. Does their existence affect probabilities about human population size?
          *   SSA: Depends on if aliens are in reference class. SIA: Yes, more observers generally boost world probability.
          *   Let's make it concrete. "You learn there are 1 billion silicon-based aliens." Does this change your estimate on total humans?
          *   SSA: No (if reference class is 'humans'). SIA: Yes (more observers = larger world).
      *   *Q7: The Lazy Adam (The Absurdity).* Adam and Eve. If they don't procreate, only 2 humans exist. If they do, billions. SSA suggests they can make it unlikely they procreate by reasoning they are early.
          *   Question: Do Adam and Eve have reason to believe a deer will crash into their cave (an unlikely event) because if it doesn't, they will procreate and become 'late' humans?
          *   SSA: Yes (weirdly). SIA: No.
      *   *Q8: The Dungeon (Cell Block).* 100 cells. 90 blue, 10 red. You are in a cell. What color?
          *   Standard probability. 90% Blue.
          *   Why include? To establish baseline Bayesian reasoning before anthropic weirdness.
          *   Actually, let's use the "Dungeon with a Twist." 100 cells. World A: 100 prisoners. World B: 1 prisoner. Coin flip decides world. You are in a cell.
          *   This duplicates Q1. Let's try something on *future* predictions.
      *   *Q8 (Revised):* The Great Filter. We are here. Is the filter behind us (easy to get here, hard to go on) or ahead (hard to get here, easy to go on)?
          *   SIA: Filter likely behind (because many civilizations make it to our stage). SSA: Neutral/Behind (because if filter ahead, many civilizations reach us, so we are typical).
          *   This might be too complex. Let's stick to the "Clone" problem.
          *   *Q8:* 100 clones created. One gets a red jacket. You have a red jacket. How many clones total?
          *   If 1 clone created (100% red) vs 100 clones (1% red).
          *   This tests likelihood ratios.
      *   *Q9:* The "Why exclude Sleeping Beauty" option. I will include it but frame it carefully.
      *   *Q10:* A "Skeptic" option. "This reasoning is flawed."

      *Refining the Set for Maximum Discrimination:*
      1.  God's Coin Toss (1 vs 1M).
      2.  Doomsday (Rank 100B).
      3.  Presumptuous Philosopher (T1 vs T2).
      4.  Sleeping Beauty (Halfer vs Thirder).
      5.  Incubator (Room 1 specific).
      6.  Reference Class (Aliens).
      7.  Adam & Eve (Psychic powers/Deer).
      8.  The "No Difference" view (Skepticism).

      *Wait, I need to ensure the Scoring Key works.*
      SSA: Small worlds, 50% Coin, Halfer, No Psychic Deer.
      SIA: Large worlds, 1M Coin, Thirder, No Psychic Deer (SIA usually avoids the absurdity of Adam/Eve because the sheer number of observers in the 'procreate' world makes it more likely you exist there, canceling the 'early rank' effect).
      *Correction on Adam/Eve:* SSA leads to the "Psychic" conclusion (they should expect the deer). SIA blocks it (the world where they procreate has way more people, so you're more likely to be in that world, neutralizing the rank effect).
      FNC: Usually tracks SIA but might differ on Reference Class.
      Skeptic: Rejects the premises.

  4.  **Developing the Scoring Key:**
      *   Need to map patterns to SSA, SIA, FNC, Skeptic.
      *   Need to identify inseparable positions. (FNC and SIA are notoriously hard to distinguish in simple quizzes. I should note this).
      *   Need to diagnose empty combinations. (e.g., SIA + Doomsday Acceptance is inconsistent).

  5.  **Drafting the Content:**
      *   *Tone:* Witty, party-conversation style, but precise.
      *   *Structure:* Intro -> Quiz -> **BREAK** -> Key/Analysis.

  6.  **Review against Constraints:**
      *   8-10 questions? I'll aim for 8 strong ones.
      *   Specific cases included? Doomsday, Presumptuous, Coin Toss, Urn, Sleeping Beauty.
      *   No label questions? Checked.
      *   Separate key? Checked.
      *   Flag inseparable positions? Checked (SIA/FNC).
      *   Diagnose empty combos? Checked.

  7.  **Final Polish:**
      *   Make sure the answer choices are distinct.
      *   Ensure the "Skeptic" path is viable.
      *   Check the Adam/Eve logic (it's tricky). SSA says "Yes, expect the deer." SIA says "No."
      *   Check Sleeping Beauty. Halfer (SSA) = 1/2. Thirder (SIA) = 1/3.
      *   Check Doomsday. SSA = Doom soon. SIA = Doom not necessarily soon.

      *(Self-Correction on FNC)*: FNC (Full Non-indexical Conditioning) conditions on "There exists an observer with my exact evidence." In the Coin Toss (1 vs 1M), FNC agrees with SIA (Tails is more likely because it's more likely *someone* like me exists). In Doomsday, FNC agrees with SIA (cancels Doomsday). Distinguishing SIA and FNC in a short quiz is nearly impossible without getting into technicalities about "exact evidence" vs "random sampling." I will group them in the key but note the theoretical distinction.

      *(Self-Correction on Urn)*: The prompt asks for "an urn with a small versus huge population and a random draw." I need to make sure this is distinct from the Coin Toss.
      *   Urn Case: Known priors (50/50 urns). Draw ball #5.
      *   Coin Toss: Known priors (50/50 coin). Create 1 or 1M people.
      *   These are structurally identical mathematically, but people react differently to "balls" vs "people." I will use the Urn as a control question to see if they apply Bayesian reasoning consistently when "existence" isn't at stake.

      *Let's finalize the 8 questions:*
      1.  Urn (Control - Bayesian baseline).
      2.  God's Coin Toss (1 vs 1M People).
      3.  Doomsday (Human Rank).
      4.  Presumptuous Philosopher (Physics Theories).
      5.  Sleeping Beauty (Waking).
      6.  Incubator (Room 1 vs Room 1M).
      7.  Adam & Eve (The Deer).
      8.  The Skeptic's Out (Meta-question on validity).

      *Wait, I need to make sure the "Skeptic" option doesn't just become a catch-all.* I'll phrase Q8 as a specific case where anthropic reasoning feels most uncomfortable, offering a "This reasoning is invalid" option.

      *Let's write it.*

      *(Final check on Key)*:
      SSA Profile: Urn (Small), Coin (50/50), Doomsday (Soon), Presumptuous (No), Beauty (1/2), Incubator (50/50), Adam/Eve (Yes).
      SIA Profile: Urn (Small), Coin (1M), Doomsday (No), Presumptuous (Yes), Beauty (1/3), Incubator (1M), Adam/Eve (No).
      Skeptic: Rejects the inference in 2, 3, 4, 7.

      *Wait, Urn:* If Urn A has 10, Urn B has 1000. Draw #5. Urn A is much more likely. Both SSA and SIA agree here because the *observers* aren't the balls, the balls are the data. This is a control. If they get this wrong, they are bad at Bayes. I should note that in the key.

