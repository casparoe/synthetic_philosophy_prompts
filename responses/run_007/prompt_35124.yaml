answer: |-
  # The "Who Are You in the Multiverse?" Quiz

  You're at a party. The drinks are good, the conversation has turned to existential risk, and somehow you're arguing about whether the fact that you exist proves the universe is infinite. You suspect you and your interlocutor are using different rules for counting observers, but neither of you can name the rules.

  This quiz won't ask you to define "anthropic principles." Instead, it presents eight concrete scenarios. Pick the answer that matches your gut intuition. At the end, we'll tell you which philosophical camp your intuitions belong to—and whether those intuitions are consistent.

  ***

  ### 1. The Urn
  Two urns sit on a table. Urn A contains 10 balls numbered 1–10. Urn B contains 1,000 balls numbered 1–1,000. A coin is flipped to select an urn (50% chance for each). A ball is drawn at random from the selected urn. It is ball #5.
  **What is the probability the ball came from Urn A?**
  A) Roughly 50% (The coin was fair).
  B) Roughly 99% (It's much easier to draw a low number from the small urn).
  C) The question is meaningless without knowing who drew the ball.

  ### 2. God's Coin Toss
  A fair coin is flipped. If Heads, one person is created in a single room. If Tails, one million people are created in one million identical rooms. You wake up in one of the rooms. You know the setup.
  **What is your credence that the coin landed Tails?**
  A) 50% (The coin was fair).
  B) Roughly 1,000,000 to 1 (You are much more likely to exist in the Tails world).
  C) It depends on whether the other people are "conscious" like me.

  ### 3. The Doomsday Clock
  Assume you are roughly the 100 billionth human to be born. Consider two hypotheses:
  *   **Short:** Total humans who will ever live = 200 billion.
  *   **Long:** Total humans who will ever live = 200 trillion.
  **Does your birth rank make one hypothesis more likely?**
  A) Yes, Short is vastly more likely (being so early is unlikely in Long).
  B) No, they remain equally likely (my existence is guaranteed in both).
  C) No, Long is more likely (there are more slots for me to occupy).

  ### 4. The Presumptuous Philosopher
  Physicists have narrowed the universe down to two theories. Both fit the data perfectly.
  *   **T1:** The universe contains 1 trillion observers.
  *   **T2:** The universe contains 1 trillion trillion observers.
  Before running a costly experiment to decide, a philosopher claims T2 is a trillion times more likely simply because you exist.
  **Is the philosopher right?**
  A) No, existence isn't evidence for universe size.
  B) Yes, you should bet on T2 immediately.
  C) Only if we define "observer" very narrowly.

  ### 5. Sleeping Beauty
  Sleeping Beauty volunteers for an experiment. A fair coin is tossed.
  *   **Heads:** She is woken once (Monday), interviewed, and the experiment ends.
  *   **Tails:** She is woken twice (Monday and Tuesday), interviewed each time, with memory wiped between wakeups.
  She wakes up. She knows the protocol.
  **What should her credence be that the coin landed Heads?**
  A) 1/2 (The coin was fair).
  B) 1/3 (She is in one of three equiprobable waking situations).
  C) It changes depending on if she cares about being right once or per awakening.

  ### 6. The Incubator
  A machine flips a coin.
  *   **Heads:** It creates one person in Room 1.
  *   **Tails:** It creates one million people in Rooms 1 through 1,000,000.
  You find yourself in **Room 1**.
  **What is your credence the coin landed Tails?**
  A) 50% (Room 1 exists in both outcomes).
  B) Roughly 1,000,000 to 1 (Tails creates more people, even if I'm in Room 1).
  C) 50%, unless I can see outside my room.

  ### 7. Adam and Eve
  Adam and Eve are the only two humans. They know that if they procreate, they will have billions of descendants. If they abstain, only two humans will ever exist. They reason: "If we procreate, we will be very early in the human sequence (rank 1 and 2), which is incredibly unlikely if there are billions of us. Therefore, we probably won't procreate."
  **Can they use this reasoning to expect a miraculous event (e.g., a deer dying at their feet) that would prevent them from needing to hunt/procreate?**
  A) Yes, anthropic reasoning gives them "psychic" powers to influence probabilities.
  B) No, that's absurd; their decision doesn't change the likelihood of their existence.
  C) Yes, but only if they are the only reference class.

  ### 8. The Skeptic's Check
  Reflect on the previous questions. Many of them rely on the idea that "the fact I exist" or "my birth rank" is data that shifts probabilities about the world.
  **What is your meta-view on this reasoning?**
  A) It is valid Bayesian reasoning applied to observers.
  B) It is a category error; existence isn't evidence.
  C) It works for Urns and Coins, but breaks down when "you" are part of the population being counted.

  ***

  ## **SCORING KEY & ANALYSIS**
  *(Do not read until you have answered)*

  ### How to Score
  Tally your answers. There are three main "clusters" of responses, plus a "No Stable Position" category.

  *   **Mostly A's:** You lean toward the **Self-Sampling Assumption (SSA)**.
  *   **Mostly B's:** You lean toward the **Self-Indication Assumption (SIA)**.
  *   **Mostly C's:** You are likely a **Skeptic** or hold a **Reference Class** dependent view.
  *   **Mixed (A's and B's):** You may have an **Inconsistent** model or hold **Full Non-indexical Conditioning (FNC)** (which often tracks with SIA but diverges on specific technicalities).

  ### Position Profiles

  #### 1. The Self-Sampling Assumption (SSA)
  *   **Typical Answers:** 1B, 2A, 3A, 4A, 5A, 6A, 7A.
  *   **The View:** You reason as if you are a random sample from the set of *actual* observers in your reference class.
  *   **The Strength:** It aligns with standard intuition in non-anthropic cases (like the Urn). It avoids the "Presumptuous Philosopher" problem (you can't prove the universe is huge just by existing).
  *   **The Cost:** You must accept the **Doomsday Argument** (humanity is likely to end soon because you are early) and the **Adam & Eve** paradox (anthropic reasoning seems to grant psychic powers to early humans). You also have to define a "reference class" (who counts as an observer?), which is notoriously difficult.

  #### 2. The Self-Indication Assumption (SIA)
  *   **Typical Answers:** 1B, 2B, 3C (or B), 4B, 5B, 6B, 7B.
  *   **The View:** You reason as if you are a random sample from the set of *possible* observers. Worlds with more observers are inherently more likely to contain *you*.
  *   **The Strength:** It cancels out the Doomsday Argument (being early is balanced by the fact that large worlds have more people). It blocks the Adam & Eve psychic paradox. It aligns with the "Thirder" position in Sleeping Beauty.
  *   **The Cost:** You must accept the **Presumptuous Philosopher** (you can know the universe is vast without looking). It implies that merely existing is evidence for a crowded multiverse.

  #### 3. Full Non-indexical Conditioning (FNC)
  *   **Typical Answers:** Matches SIA (Mostly B's), but might choose C on Question 8.
  *   **The View:** You condition on all your evidence, including the fact that *someone* with your exact memories exists, without using indexicals like "I am."
  *   **The Distinction:** In most simple quizzes, FNC is indistinguishable from SIA. However, FNC proponents argue they aren't "counting observers" (SIA) but rather updating on the likelihood of their specific evidence arising.
  *   **Note:** This quiz cannot reliably separate SIA and FNC. Both reject Doomsday and accept the "Tails" bias in God's Coin Toss.

  #### 4. The Skeptic / No Stable Position
  *   **Typical Answers:** 1B, 2C, 3B, 4A, 5C, 7B, 8B/C.
  *   **The View:** Anthropics is a confusion of language. "Existence" is not data that can update priors in this way.
  *   **The Strength:** Avoids all the paradoxes (Doomsday, Presumptuous, Adam & Eve).
  *   **The Cost:** Requires rejecting standard Bayesian updating in cases involving self-location. Hard to formalize without throwing out useful tools for cosmology and risk assessment.

  ### Diagnostic Flags

  #### Inseparable Positions
  *   **SIA vs. FNC:** As noted, this quiz treats these as functionally identical. Distinguishing them requires technical questions about "exact evidence" vs. "random sampling from possible observers," which is too granular for a party quiz. If you scored mostly B's, you could be either.
  *   **SSA vs. "Halfer" Sleeping Beauty:** While SSA usually aligns with the "Halfer" position (1/2), some SSA proponents argue for Thirding in Sleeping Beauty specifically due to temporal indexing. If you were SSA everywhere except Sleeping Beauty, you are in good company (e.g., David Lewis).

  #### Empty/Incoherent Combinations
  *   **The "Doomsday SIA" (3A + 4B):** If you think the Doomsday Argument works (3A) *but* the Presumptuous Philosopher is also right (4B), your position is mathematically incoherent. SIA is specifically designed to cancel the Doomsday likelihood shift. Holding both suggests you haven't fully traced the implications of your intuition.
  *   **The "Psychic SSA" (7B + 3A):** If you accept Doomsday (3A) but deny Adam & Eve can expect miracles (7B), you have a "Reference Class" problem. SSA only generates the psychic paradox if Adam and Eve are in the same reference class as their descendants. If you believe they are in *different* classes, this combination is stable. If you believe they are in the *same* class, this combination is inconsistent.
  *   **The "Urn Blind" (1A):** If you answered 1A on the Urn problem, you are not failing at anthropics; you are failing at basic Bayes' Theorem. In the Urn case, there is no anthropic selection effect; it is pure probability. If you chose 1A, your results on the rest of the quiz are unreliable because your baseline for likelihood is off.

  ### Final Advice for the Party
  If you are an **SSA** type, your worry is that humanity is likely to end soon, but you don't believe in magic multiverses.
  If you are an **SIA** type, you sleep better about Doomsday, but you have to admit you live in a ridiculously crowded cosmos.
  If you are a **Skeptic**, you win the argument by refusing to play the game, but you lose the ability to reason about existential risk using observer counts.

  *Recommendation: Buy the next round, admit that anthropic reasoning makes everyone's head hurt, and change the subject to politics.*
