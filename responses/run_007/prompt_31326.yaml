answer: |-
  # The Cognitive Coupling Classification Procedure (CCCP)

  **Purpose:** To determine whether a developer tool dependency constitutes "Extended Cognition" (requiring high-availability SLAs, strict access controls, and high-severity incident classification) or an "Ordinary Tool" (standard availability, productivity-focused SLAs).

  **Time Required:** ~20 minutes (assuming access to usage metrics and a brief interview with the affected developer).
  **Operator:** Platform Engineer or Team Lead.
  **Philosophical Basis:** Adapted from the *Extended Mind Thesis* (Clark & Chalmers, 1998), focusing on functional coupling rather than physical location.

  ---

  ## Part 1: The Decision Procedure

  Run the following four tests in strict order. Do not skip steps. Record the evidence for each answer (e.g., logs, Slack transcripts, SLA reports).

  ### Test 1: The Endorsement Filter (Content Provenance)
  **Question:** Is the specific information retrieved or generated by this resource content that the developer explicitly created, or content they have previously verified and accepted as accurate?
  *   **Yes:** The resource stores *their* beliefs (e.g., personal notes, saved snippets they wrote). -> **Proceed to Test 2.**
  *   **No:** The resource provides *new* information the developer has not validated (e.g., AI-generated code, search results from unknown repos). -> **Proceed to Test 2.** *(Note: A "No" here does not immediately disqualify Extended Cognition, but it flags a risk regarding liability and truth.)*

  ### Test 2: The Trust Condition (Verification Habit)
  **Question:** When the developer uses the output of this resource to make a decision or write code, do they independently verify the accuracy against a primary source (e.g., checking the repo, running a test, re-deriving the logic)?
  *   **Yes (Verified):** The developer treats the resource as a *hint* or *reference*. -> **Classification: Ordinary Tool.** (Stop here).
  *   **No (Trusted):** The developer accepts the output automatically as if it were their own recollection. -> **Proceed to Test 3.**

  ### Test 3: The Reliability Condition (Constancy)
  **Question:** Is the resource available and accessible with high reliability (e.g., >99% uptime during work hours, low latency) over a sustained period (months)?
  *   **No (Flaky):** The resource is frequently unavailable, slow, or access is intermittently revoked. -> **Classification: Ordinary Tool.**
      *   *Reasoning:* A memory that randomly disappears cannot function as a reliable cognitive substrate. It is a convenience, not a cognitive extension.
  *   **Yes (Reliable):** The resource is consistently present when needed. -> **Proceed to Test 4.**

  ### Test 4: The Integration Condition (Accessibility)
  **Question:** Is the resource frictionlessly integrated into the developer's primary workflow (e.g., IDE plugin, single sign-on, <2 second latency)?
  *   **No (Friction):** Accessing the resource requires significant context switching, authentication hurdles, or manual effort. -> **Classification: Ordinary Tool.**
  *   **Yes (Frictionless):** Access is automatic or near-automatic. -> **Classification: Extended Cognition.**

  ### Escalation Triggers
  At any point, if the answers create a logical conflict or high business risk, select **Escalate**. Specifically:
  1.  **The AI Paradox:** If Test 1 is **No** (unendorsed content) BUT Test 2 is **No** (high trust/unverified) AND Test 3 is **Yes** (reliable).
      *   *Reasoning:* The developer is cognitively dependent on an external oracle they do not own. This creates liability and competence risks not covered by standard tool policies.
  2.  **The Critical Failure:** If the classification is **Extended Cognition**, but the current infrastructure cannot support the implied SLA (e.g., you cannot promise 99.99% uptime for a notes app).
      *   *Reasoning:* You have identified a cognitive single-point-of-failure that the business cannot currently afford to mitigate.

  ---

  ## Part 2: Limitations and Simplifications

  **What this procedure simplifies:**
  1.  **Individual vs. Team:** This procedure assesses *individual* cognitive extension. It does not account for "distributed cognition" across a team (e.g., if one person leaves, does the *team* lose memory?).
  2.  **Content vs. System:** It treats the *system* as the extension if the *content* is endorsed. In philosophy, the distinction is finer; here, we conflate them for policy enforceability.
  3.  **Degree of Trust:** Trust is treated as binary (Verify vs. Don't Verify). In reality, trust is a spectrum. We use the "routine verification" heuristic to binarize it.

  **Where this procedure may misfire:**
  1.  **Malicious Trust:** If a developer blindly trusts a compromised tool, this procedure classifies it as Extended Cognition. It assesses *functional coupling*, not *security posture*. Security reviews must happen in parallel.
  2.  **New Habits:** It takes time to form a cognitive coupling. A new tool used intensely for one week might pass the tests but not yet be "cognitive." This procedure assumes a steady state (>3 months usage).

  **What this procedure cannot do:**
  1.  **Assign Liability:** It cannot determine who owns the IP of AI-generated code or who is responsible for errors made due to tool reliance.
  2.  **Replace Security Policy:** It does not determine if data *should* be stored in a tool, only how to treat the tool if it *is* stored there.
  3.  **Solve Budget Conflicts:** It identifies when a tool is critical cognitive infrastructure, but it cannot force management to fund the required reliability.

  ---

  ## Part 3: Procedure Run-Through

  ### Case (a): The Personal Notes System
  *   **Context:** Maintained daily for years, consulted many times a day, accepted without checking.
  *   **Test 1 (Endorsement):** **Yes.** The developer wrote the notes. They represent the developer's past conscious decisions.
  *   **Test 2 (Trust):** **No (Trusted).** The prompt states they are "accepted without checking." They function as recall.
  *   **Test 3 (Reliability):** **Yes.** Implicit in "maintained daily for years" and "consulted many times a day" is that the system is generally up. (Assume standard internal tool uptime).
  *   **Test 4 (Integration):** **Yes.** "Consulted many times a day" implies low friction; otherwise, they wouldn't do it that often.
  *   **Result:** **Extended Cognition.**
  *   **Implication:** An outage is not a "productivity loss"; it is a "cognitive impairment." Incident severity should be raised (e.g., SEV-2 instead of SEV-3). SLAs must match memory reliability (high availability).
  *   **The "Unliked" Answer:** Management will likely dislike this. Treating a wiki or notes app as critical cognitive infrastructure requires funding for redundancy and backups that usually exceed the budget for "productivity tools." It also complicates offboarding; you cannot simply revoke access without a "memory transfer" protocol.

  ### Case (b): Internal Code-Search Index
  *   **Context:** Used a few times a week, results always verified against the repository.
  *   **Test 1 (Endorsement):** **No.** The code belongs to others/the repo.
  *   **Test 2 (Trust):** **Yes (Verified).** The prompt states results are "always verified against the repository."
  *   **Result:** **Ordinary Tool.** (Stops at Test 2).
  *   **Implication:** Outage is a productivity inconvenience. SLA can be standard. No special onboarding required beyond "how to use search."
  *   **Reasoning:** Because the developer performs the cognitive work of verification, the search index is merely a fast index card, not a memory store. The "thinking" happens in the head, not the tool.

  ### Case (c): AI Pair-Programming Assistant
  *   **Context:** Suggestions accepted almost without review, including suggestions drawing on model training (not developer entered).
  *   **Test 1 (Endorsement):** **No.** The content comes from model training, not the developer's past endorsement.
  *   **Test 2 (Trust):** **No (Trusted).** Suggestions are accepted "almost without review."
  *   **Test 3 (Reliability):** **Yes.** (Assume the SaaS provider is stable).
  *   **Conflict:** We have High Trust + Low Endorsement.
  *   **Result:** **Escalate.** (Trigger: The AI Paradox).
  *   **Reasoning:** The procedure cannot settle this. By Test 1, it fails the "Extended Mind" criteria (it is not *their* memory). By Test 2, it passes the "Functional Role" criteria (it acts *like* memory).
  *   **What the procedure cannot settle:**
      1.  **Competence:** If the AI is withdrawn, has the developer lost competence? The procedure cannot say.
      2.  **Liability:** If the AI suggests vulnerable code and the dev accepts it without review, is it the dev's fault or the platform's?
      3.  **Policy:** This requires a named person (e.g., CTO or Head of Engineering) to decide if we treat AI as a "Junior Developer" (Ordinary Tool with supervision) or a "Cognitive Prosthetic" (Extended Cognition with high SLAs).

  ---

  ## Summary for the Engineering Manager

  | Case | Classification | Policy Action |
  | :--- | :--- | :--- |
  | **(a) Personal Notes** | **Extended Cognition** | **High Severity.** Treat outages as P1/P2. Ensure backups are immutable. Offboarding requires data export/transfer. |
  | **(b) Code Search** | **Ordinary Tool** | **Standard Severity.** Treat outages as P3. Focus on uptime/cost efficiency. |
  | **(c) AI Assistant** | **Escalate** | **Judgement Call Required.** Define acceptable risk for unverified AI code. Decide if we mandate verification (moving it to Ordinary Tool) or accept the cognitive dependency. |

  **Note on Case (a):** Be prepared to defend the cost. The philosophy dictates that if we allow developers to offload memory to this system, we are ethically and operationally bound to maintain it as we would their biological capacity to work. If we cannot fund that reliability, we must instruct developers *not* to use it as memory (i.e., mandate verification), which moves it to Case (b).
