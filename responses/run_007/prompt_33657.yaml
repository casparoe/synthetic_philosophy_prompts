      *   *The "Thick" View:* Relies on DDE. Intention changes the moral object of the act. Killing vs. Letting Die (or Healing vs. Killing).
      *   *The "Thin" View:* Relies on policy, trust, slippery slopes, or role-based duties.

  3.  **Addressing the Specific Questions:**

      *   **Q1: Does the practice *actually* presuppose all these commitments (Intention as fundamental, principled line, weighty distinction)?**
          *   *Answer:* Legally and formally, yes. The *mens rea* (guilty mind) is central to criminal law. In medical ethics, the "goal of care" is central.
          *   *Nuance:* However, in *practice*, the line is often blurred. Courts often accept the doctor's testimony about intention without deep scrutiny. So, while the *theory* requires it, the *application* sometimes treats it as a proxy for something else (like proportionality).

      *   **Q2: Could it be defended on thinner grounds?**
          *   *Pragmatic/Policy:* Yes. "Chilling effect" argument. If we criminalize high-dose morphine, doctors will undertreat pain. We need a safe harbor. Intention is the gatekeeper for that safe harbor.
          *   *Role-based/Virtue Ethics:* The doctor's role is to heal/alleviate, not kill. Intention signals alignment with the role.
          *   *Proportionality:* Maybe the real weight is on whether the dose is *proportionate* to the pain, not just the intention. (This weakens DDE).

      *   **Q3: What if DDE is abandoned? What changes?**
          *   *Law:* Would need to shift from *mens rea* to objective standards (e.g., standard of care, consent, proportionality).
          *   *Guidelines:* Would focus less on "purpose" and more on "indications" and "safeguards."
