          *   *The Proportionality Defense:* Maybe intention doesn't matter as much as whether the dose is medically indicated. If the dose is standard for pain, it's okay, regardless of secret thoughts.
          *   *The Trust/Role Defense:* Medicine is a profession with internal goods. Intending death violates the internal telos of medicine.
      *   **Section 3: Assessment of Coherence (Where is the theory required?).**
          *   *Underdetermination:* The practice is often underdetermined by DDE. Courts often look at *proportionality* (was the dose reasonable?) more than pure intention.
          *   *The "Self-Deception" Problem:* If DDE is false, doctors might lie about intention to stay legal. This undermines the integrity of the practice.
