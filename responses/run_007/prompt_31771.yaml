answer: |-
  ### Audit of the Space-Time Analogy in Longtermism

  The analogy between spatial and temporal distance is a cornerstone of longtermist ethics, most famously articulated by philosophers like Derek Parfit and popularized by William MacAskill. It aims to demonstrate that "presentism" (valuing people less because they live in the future) is as irrational and prejudiced as "spatial chauvinism" (valuing people less because they live far away).

  Below is an audit of the analogy's structural integrity, its points of failure, and its justificatory power.

  ---

  ### 1. The Mapping: Correspondence of Terms

  To audit the analogy, we must first formalize the isomorphism it proposes between the spatial and temporal domains.

  | **Spatial Domain** | **Temporal Domain** | **Role in Argument** |
  | :--- | :--- | :--- |
  | **The Moral Agent** | **The Moral Agent** | The locus of decision-making (Here & Now). |
  | **The Neighbor** | **Present People** | Those close in the relevant dimension (Space/Time). |
  | **The Distant Foreigner** | **Future People** | Those far in the relevant dimension (Space/Time). |
  | **Nationalism/Localism** | **Presentism** | The bias being challenged (arbitrary preference for the "close"). |
  | **Cosmopolitanism** | **Longtermism** | The proposed ethical expansion (including the "distant"). |
  | **Moral Circle Expansion** | **Moral Circle Expansion** | The historical precedent: just as we moved from tribe $\to$ nation $\to$ globe, we should move from present $\to$ future. |

  **The Core Claim:** Just as the moral weight of a foreigner's suffering does not diminish because they are 5,000 miles away, the moral weight of a future person's suffering should not diminish because they are 5,000 years away.

  ---

  ### 2. Disanalogies: Where the Mapping Breaks

  While the analogy is rhetorically potent, the topology of time differs fundamentally from the topology of space. Three specific features break the mapping.

  #### A. Existence Status (Actual vs. Potential)
  *   **Spatial Case:** People in distant countries *actually exist* right now. Their interests, needs, and identities are fixed facts of the current world state.
  *   **Temporal Case:** People in the far future *do not yet exist*. Their existence is contingent upon current actions (the Non-Identity Problem). We are not merely deciding how to treat existing beings; we are partly deciding *which* beings will exist.
  *   **Does it matter?** **Yes, deeply.**
      *   Most conventional moral frameworks (rights-based, contractualist, or person-affecting views) ground moral status in *existence*. If you believe rights attach to actual subjects, the analogy fails because future people are not subjects yet.
      *   *Longtermist Counter:* Total Utilitarianism argues that potential welfare counts. If the analogy is meant to support Total Utilitarianism, it begs the question. It assumes the conclusion (that potential people count) to prove the conclusion (that we should value them equally).
      *   *Verdict:* This is not a surface-level mismatch. It strikes at the metaphysical prerequisite for moral consideration.

  #### B. Symmetry and Reciprocity
  *   **Spatial Case:** Spatial relations are symmetric. The foreigner is distant from me, but I am equally distant from them. In principle, causal influence is two-way; they could help me just as I could help them.
  *   **Temporal Case:** Temporal relations are asymmetric. I am distant from the future, but the future is not distant from me in the same way—they are *later*. Causal influence is strictly one-way (I can affect them; they cannot affect me).
  *   **Does it matter?** **Mostly Surface-Level.**
      *   If morality is viewed as a social contract or a reciprocal arrangement, this disanalogy is fatal. Future people cannot punish or reward us.
      *   However, most arguments for spatial cosmopolitanism reject reciprocity as a condition for morality (e.g., we owe duties to infants or the severely disabled who cannot reciprocate). If one accepts that moral value is intrinsic to welfare rather than transactional, the lack of reciprocity does not diminish the future person's moral weight.
      *   *Verdict:* This matters only if one holds a contractualist view of ethics. For welfarist/consequentialist views (which longtermism usually presupposes), this is a survivable mismatch.

  #### C. Epistemic Access and Specificity
  *   **Spatial Case:** We can know specific facts about distant people. We know they need food, medicine, or security. We can target aid effectively.
  *   **Temporal Case:** We suffer from radical ignorance regarding the far future. We do not know their specific values, technologies, or what constitutes "harm" or "benefit" for them.
  *   **Does it matter?** **Yes, but distinguishes *Pure* vs. *Uncertainty* Discounting.**
      *   This disanalogy justifies *uncertainty discounting* (valuing future welfare less because we are less sure our actions will help). It does not justify *pure temporal discounting* (valuing welfare less *simply because* it occurs later).
      *   The analogy is often used to attack *pure* discounting. In that specific lane, the epistemic gap is irrelevant. However, in practical application, the epistemic gap makes the "distant country" analogy misleading regarding *feasibility*. Saving a life in a distant country is tractable; saving a life in 10,000 years is highly speculative.
      *   *Verdict:* Surface-level regarding the *principle* of equal weight, but deep regarding the *practice* of moral prioritization.

  ---

  ### 3. Assessment of the Conclusion

  **The Conclusion:** *Pure temporal discounting is unjustified.*

  **Does it hold up?**
  The conclusion holds up **only if** one accepts specific meta-ethical premises that the analogy itself does not prove.
  1.  **If** you believe moral status is grounded in the capacity for welfare (regardless of existence time)...
  2.  **And** you believe morality is not based on reciprocity...
  3.  **Then** the analogy successfully exposes presentism as an arbitrary bias, similar to spatial chauvinism.

  However, if you believe moral status requires actual existence, or if you adhere to a "person-affecting view" (where an act can only be bad if it makes a specific existing person worse off), the analogy collapses. The Non-Identity Problem means that in the temporal case, our actions change *who* exists, whereas in the spatial case, the recipients are fixed. You cannot harm a specific future person by bringing them into existence with a life worth living, even if you could have brought a *different* person into existence with a better life. This logic has no spatial parallel.

  **Was the Analogy Justificatory or Illustrative?**
  The analogy is primarily **illustrative and rhetorical**, not justificatory.

  *   **Burden Shifting:** Its main function is to shift the burden of proof. It forces the critic to explain *why* time is morally relevant when space is not. It leverages the "reflective equilibrium" method: since we have already rejected spatial discrimination, consistency demands we reject temporal discrimination unless a relevant difference is found.
  *   **Lack of Independent Force:** The analogy cannot do the heavy lifting alone because the "relevant differences" (existence, identity, asymmetry) are substantial. The analogy works only for those who have already been convinced by independent arguments (e.g., Parfit's *Reasons and Persons*) that existence is not a prerequisite for moral significance.
  *   **Risk of Overextension:** By treating time exactly like space, the analogy risks obscuring the unique ethical complexities of the future (e.g., existential risk vs. aid). It encourages a view of the future as a "place" we are sending aid to, rather than a branching set of possibilities we are creating.

  ### Final Verdict

  The space-time analogy is a **robust heuristic for bias detection** but a **weak metaphysical proof**.

  It successfully identifies presentism as a form of arbitrary discrimination *assuming* a totalizing welfarist framework. However, it glosses over the ontological gap between existing and non-existing beings. Therefore, the conclusion that pure temporal discounting is unjustified does not follow *from the analogy alone*; it follows from the underlying ethical framework (usually Total Utilitarianism) that the analogy is meant to support. The analogy makes the framework feel intuitive, but it cannot validate the framework against objections rooted in the metaphysics of time and existence.
