          *   If one accepts total utilitarianism and the "potential existence" premise, yes.
          *   If one holds a person-affecting view or believes existence is a prerequisite for rights, no.
          *   The analogy itself doesn't *prove* the conclusion; it relies on underlying meta-ethical commitments.
