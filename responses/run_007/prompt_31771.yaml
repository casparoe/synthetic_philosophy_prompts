      *   *Symmetry/Reciprocity:* Does morality require reciprocity? Most ethical frameworks (utilitarianism, rights-based) say no. We have duties to infants or the severely disabled who cannot reciprocate. *Verdict:* Surface-level mismatch. Morality isn't a contract.
