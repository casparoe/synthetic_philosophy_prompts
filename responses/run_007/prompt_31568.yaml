      *   *Case 4 (Forged Vermeer):* Value drops on discovery. Why? Deception matters, but also the *provenance* and the *act of creation* by the specific artist. This suggests value is partly epistemic (what we know) and partly ontological (what it is).
      *   *Case 5 (Grandmother's Ring):* Ambivalent. Why? Sentimental value attaches to the *history* of the specific object, not just its look. But if it's identical, does the history transfer?

  3.  **Search for a Unifying Principle:**
      *   *Candidate 1: Materialism.* (It's about the atoms). Fails Case 2 (restored painting) and Case 3 (digital).
      *   *Candidate 2: Aesthetic Experience.* (It's about what it looks like). Fails Case 1 (perfect copy valued less) and Case 4 (value drops without visual change).
      *   *Candidate 3: Historical/Provenancial Essentialism.* (It's about the specific history of production). This fits Case 1, Case 4, and Case 5 (mostly). It struggles slightly with Case 2 (if 90% new matter, is it the same history?) but generally, restoration theory accepts continuity. It fits Case 3 if we view digital files as *types* rather than *tokens*.
      *   *Candidate 4: The "Narrative" or "Biography" of the Object.* The value lies in the specific causal chain linking the object to its creator or previous owners.

      *Best Fit:* **Historical Individualism / Provenance Essentialism.** The identity and value of an artwork (or sentimental object) depend on its specific history of production and ownership, not just its current physical state.

