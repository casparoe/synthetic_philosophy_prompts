      *   **Task:** Find a unifying principle, identify inconsistencies/verdicts to give up, and distinguish between settled vs. contested philosophical ground.
      *   **Constraint:** Do not present contested views as consensus. Be clear about what philosophers/art theorists agree on vs. debate.

