answer: |-
  There is no single "law" of metaphysics that settles this, but there is a dominant framework in the philosophy of art that captures most of your intuitions. It is a combination of **Historical Individualism** (the idea that an object's identity depends on its specific history of creation) and the **Type/Token Distinction** (the difference between a unique instance and an instance of a pattern).

  Here is how that principle maps onto your cases, where it forces you to confront inconsistencies, and what is actually settled in the field.

  ### The Unifying Principle: Historical Individualism
  The principle that best unifies your verdicts is this: **For singular artifacts (paintings, jewelry), value is tied to the specific causal chain of production and ownership, not just the current physical arrangement.**

  This view, championed by philosophers like Jerrold Levinson and Arthur Danto, argues that an artwork is not just a physical object but an "embodied meaning." You cannot separate the object from *who* made it, *when*, and *how*.

  Here is how your cases fit this principle:

  1.  **Molecule-for-Molecule Copy:** You value the original more.
      *   **Fits Principle:** The copy lacks the correct causal history. It was not generated by the artist's hand/intent at the specific time of creation.
  2.  **Heavily Restored Painting:** You value it as the original.
      *   **Fits Principle:** This relies on **Spatiotemporal Continuity**. Even if the matter is replaced (like the Ship of Theseus), the object has existed in an unbroken chain through time from the artist to you. The restoration is viewed as *preserving* the history, not creating a new object.
  3.  **Forged Vermeer:** Value drops on discovery.
      *   **Fits Principle:** The physical object didn't change, but your knowledge of its causal history did. It lacks the essential property of "being by Vermeer."
  4.  **Digital Photo:** You value copies equally.
      *   **Fits Principle (with a caveat):** Digital files are typically treated as **Types** rather than **Tokens**. The "work" is the information pattern. Any bit-identical file is an equally valid instance of that pattern. There is no "original" atoms, only the original *code*.
  5.  **Grandmother's Ring:** You are ambivalent.
      *   **Tension:** This is where the principle pressures you. If value comes from causal history (as with the Vermeer), the replica should be worthless to you sentimentally, because it has no causal link to your grandmother.

  ### Which Verdicts Must You Give Up?

  If you adopt Historical Individualism as your consistent rule, you have two points of tension to resolve:

  **1. The Ring (The Strongest Inconsistency)**
  Your verdict on the Vermeer forgery contradicts your ambivalence about the ring.
  *   **The Conflict:** In the Vermeer case, you agree that learning the history changes the object's value *ontologically* (it actually becomes a different kind of thing, a forgery). In the ring case, you are wavering.
  *   **The Fix:** To be consistent, you must decide if sentimental objects function like art.
      *   *Option A:* If the ring is like the Vermeer, the replica is a different object. It is not "Grandmother's Ring"; it is "A Ring That Looks Like Grandmother's Ring." You should value it significantly less.
      *   *Option B:* If the ring is like the Digital Photo, the specific history doesn't matter, only the pattern (the look/symbolism). But this contradicts your Vermeer intuition.
  *   **Recommendation:** Most people who hold your view on art find that, upon reflection, they *do* care about the ring's history. The ambivalence usually fades when the stakes are raised (e.g., "Do you bury the original or the replica with her?"). To be consistent with the Vermeer case, you should value the original ring higher.

  **2. The Restored Painting (The Nuanced Inconsistency)**
  You value the 90% repainted painting as the original, but the molecule-perfect copy as a fake.
  *   **The Conflict:** This is actually **consistent** under Historical Individualism *if* you accept Spatiotemporal Continuity. However, 90% repainting is an extreme edge case.
  *   **The Fix:** You don't necessarily have to give this up, but you must accept a "threshold." If 90% repainting counts as the original, why not 100%? If a building burns down and is rebuilt brick-by-brick, is it the same building?
  *   **Recommendation:** Keep this verdict, but acknowledge that it relies on *continuity of existence* rather than *original matter*. The restored painting has a continuous life history; the copy was born yesterday.

  ### Settled vs. Contested Ground

  It is crucial to distinguish between what philosophers agree on and what they fight about.

  **What is Settled (Consensus among Experts)**
  *   **Goodman's Distinction:** There is broad agreement on Nelson Goodman's framework from *Languages of Art*. Paintings are **autographic** (history matters, forgery is possible); music scores and literature are **allographic** (history doesn't matter, only the pattern; forgery is impossible if the notes/words are correct). Your digital photo intuition treats the photo as allographic; your painting intuition treats it as autographic. This is standard categorization.
  *   **Provenance Affects Value:** There is no serious debate that provenance (history of ownership/creation) drives market and aesthetic valuation. Even critics who think this is irrational agree that *in practice*, this is how the art world functions.
  *   **The Forgery Effect:** Empirical studies in neuroaesthetics confirm your intuition: when people are told a painting is a forgery, they report lower aesthetic pleasure and assign lower value, even if they can't see a difference. The "knowledge" changes the experience.

  **What is Contested (Genuine Debate)**
  *   **Why History Matters:** While everyone agrees history *does* matter, they disagree on *why*.
      *   *Essentialists* argue the history is part of what the object *is*.
      *   *Instrumentalists* argue the history is just a cue that helps us appreciate the skill or context, and ideally, we should learn to value the visual experience alone (a view held by some formalists, though it is a minority view).
  *   **The Restoration Threshold:** There is no consensus on when a restoration becomes a reconstruction. Some conservators argue that replacing 90% of the paint layer creates a "facsimile," not an original. Your intuition that it remains the "original" is common among the public, but contested among conservation ethicists who worry about the "material authenticity" vs. "visual integrity."
  *   **Digital Ontology:** The status of digital art is still being debated. With the advent of NFTs and blockchain, there is a push to make digital files "autographic" (creating a unique "original" token even if the file is copyable). Your intuition that bit-identical files are equal is the traditional view, but the market is actively trying to overturn this.

  ### Summary
  Your intuitions are largely consistent with **Historical Individualism**. You treat physical art and sentimental heirlooms as **autographic** (history matters) and digital files as **allographic** (pattern matters).

  To fully align your thinking:
  1.  **Resolve the Ring:** Acknowledge that if the Vermeer's history matters, the Ring's history must too. The replica is not the heirloom.
  2.  **Clarify the Restoration:** Accept that the restored painting is the original *only* because of its continuous existence through time, not because of its material.
  3.  **Recognize the Digital Exception:** Understand that you value the digital copies equally only because you categorize them as information (types) rather than unique artifacts (tokens).

  You don't need to change your gut reactions, but you should recognize that the Ring and the Vermeer stand or fall together. If one is a fake, the other is too.
