          *   Maintain the user's desire to keep (1) and (10) (Normativity is real and essential).
          *   Tone: Professional, analytical, rigorous.

  2.  **Deconstruct the Argument:**
      *   (1) Function ascriptions are normative (Malfunction vs. Unusual).
      *   (2) Causal-Role (CR) = Causal contribution to system capacity (explanatory interest).
      *   (3) CR records what *is* done, not what *should* be done (No malfunction).
      *   (4) CR cannot capture normativity.
      *   (5) Etiological (ET) = Selected effect (SE) history.
      *   (6) ET is a causal-historical claim.
      *   (7) Is/Ought gap: Causal history cannot ground a standard of correctness for *this* token.
      *   (8) ET normativity is illusory/imported.
      *   (9) Dilemma: Either function isn't normative or biology is misleading.
      *   (10) Rejection of (9): Biology *needs* normativity (Malfunction is real).
      *   (11) Conclusion: Something in (1)-(8) is false.

  3.  **Initial Assessment & Philosophical Landscape:**
      *   The argument is a classic "Normativity Problem" for naturalized teleology.
      *   *Premise (1)* is widely accepted among functionalists (Boorse is the outlier, but even he struggles with pathology).
      *   *Premise (2) & (3)* represent the standard critique of Cummins-style functions. Cummins himself admits his account is non-normative in the "malfunction" sense, but argues it's sufficient for explanation.
      *   *Premise (5) & (6)* represent the Millikan/Neander/Price Selected Effect (SE) view.
      *   *Premise (7) & (8)* are the crux. This is the "Is-Ought" objection to Etiological theories.
      *   *Premise (10)* is the phenomenological/practical constraint.
      *   *The Flaw:* The argument assumes a specific, strong notion of "normativity" (moral or prescriptive) that neither account can meet, then claims biology requires *that* kind. However, biological normativity is usually understood as *functional* or *teleological* normativity, which is naturalizable. The move from (7) to (8) is the weak link. It assumes that historical facts cannot generate normative standards for tokens. Selected Effect theorists argue they *do* via type-individuation.

  4.  **Developing the Strongest Versions of the Accounts:**
      *   **Causal-Role (Cummins):** It's not just "what it does." It's "what it does that contributes to a capacity of the containing system *relative to an analysis*." Strongest version: It explains *how* a capacity is possible. It handles cross-context functions (e.g., heart makes sound). Weakness: Struggles with malfunction (a broken heart still has a role in the system, just a different one).
      *   **Etiological/Selected Effect (Millikan/Neander):** Function is the effect for which the trait was selected. Strongest version: It explains *why* the trait is there. It handles malfunction (a heart that doesn't pump is failing its selection criterion). Weakness: Struggles with novel functions or traits not yet selected (spandrels).

  5.  **Diagnosing the Argument (The Core Task):**
      *   The argument hinges on the definition of "normative."
      *   Step (7) is the culprit. It asserts: "A purely causal-historical claim cannot ground a standard of correctness."
      *   *Diagnosis:* This is an equivocation on "normative" or a misunderstanding of how SE theories naturalize norms. SE theorists (Millikan, Neander, Garson) argue that historical selection *does* establish a standard for current tokens because current tokens are members of a reproductive lineage defined by that history.
      *   If a token belongs to a lineage defined by selection for $F$, then $F$ is the standard for that token. Failing to $F$ is a failure to meet the conditions of membership/success for that lineage type.
      *   Therefore, (7) is false *if* one accepts the SE metaphysics of types/lineages.
      *   Alternatively, (3) is too strong. CR accounts can handle a weak form of normativity relative to the *model* of the system, but they admit they can't handle "malfunction" in the strong sense (the trait ceasing to exist vs. failing).
      *   *Decision:* The user wants to keep (1) and (10). This pushes us toward the Etiological account, but we must defend it against (7). The flaw is in (7)/(8). The move from "history is causal" to "history cannot ground norms" ignores the specific way SE theories define trait *types*.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the problem. It's the "Normativity Objection."
      *   **Strengthening the Accounts:**
          *   *Causal-Role (Cummins):* Emphasize the "analytical" nature. It's about capacity analysis. Normativity here is hypothetical (if you want capacity C, trait T is needed).
          *   *Etiological (Millikan/Neander):* Emphasize "Proper Function." It's about lineage and reproduction. Normativity is derived from the conditions of survival of the type.
      *   **Consensus vs. Contested:**
          *   *Consensus:* CR accounts struggle with malfunction. ET accounts struggle with novel traits. Both agree functions are explanatory.
          *   *Contested:* Whether biological normativity is *real* normativity or merely metaphorical. Whether ET successfully naturalizes it.
      *   **Diagnosing the Argument:**
          *   Identify Step (7) as the critical failure point.
          *   Explain *why*: It assumes a Humean Is-Ought gap that SE theorists claim to bridge via the concept of "Reproductive Lineage Types."
          *   Explain the cost: Accepting ET metaphysics (lineages, historical essences).
          *   Address Step (3) as well: CR advocates might reject (3) by redefining normativity as "system-relative stability," but this is weaker.
      *   **Recommendation:** Reject (7). Defend ET normativity as "naturalized normativity."
      *   **Caveat:** Acknowledge that this doesn't satisfy moral normativity, but satisfies biological normativity (which is what (10) requires).

  7.  **Refining the Diagnosis (Self-Correction/Nuance):**
      *   *Wait, is (7) definitely false?* Many philosophers (e.g., Boorse, some normativists) agree with (7). They think biology *shouldn't* be normative. But the user wants to keep (10). So, within the constraints of the user's goals, (7) must be the target.
      *   *Is there an equivocation?* Yes, in "normative." In (1), it means "malfunction is possible." In (7), it implies "prescriptive obligation." SE theorists argue biological normativity is the former, not the latter. The argument treats them as the same.
      *   *Step (3)* is also vulnerable. Cummins argues that within an explanatory schema, a component *should* do X to explain Y. But this is weak normativity.
      *   *Best Strategy:* Focus on the equivocation in "normative" between (1) and (7). (1) requires the possibility of error/malfunction. (7) assumes normativity requires non-natural prescriptive force. SE theories provide the possibility of error via history without needing non-natural force.

  8.  **Finalizing the Plan:**
