answer: |-
  This is a sophisticated reconstruction of the "Normativity Objection" that has haunted philosophy of biology since the 1970s. You have correctly identified that the tension lies not in the mechanics of the accounts, but in their metaphysical ability to ground the *ought* implicit in malfunction.

  To diagnose this properly, we must first steelman the two accounts involved, distinguishing where the field stands on settled ground versus where the live wires are. Then I will locate the specific flaw in your colleague's argument.

  ### 1. The Strongest Versions of the Accounts

  **The Causal-Role (CR) Account (Cummins-style)**
  The textbook version says functions are just causal contributions. The *strong* version, however, emphasizes **systemic analysis**. On this view, to ascribe a function is to explain how a containing system's capacity is realized.
  *   **Strength:** It handles context-sensitivity beautifully. The heart's function is to pump blood in the circulatory analysis, but to make a "lub-dub" sound in a diagnostic analysis. It avoids the "everything has a function" problem by tethering function to a specific explanatory capacity.
  *   **Normative Mechanism:** Normativity here is **hypothetical**. *If* the system is to maintain capacity $C$, *then* the trait *should* do $X$.
  *   **Weakness:** It cannot distinguish a broken heart from a heart that has acquired a new role. If a heart stops pumping and starts filtering toxins, the CR account simply updates the function ascription. It lacks a standard independent of current performance to judge performance against.

  **The Etiological (ET) / Selected Effect Account (Millikan/Neander-style)**
  The textbook version says functions are past selection effects. The *strong* version relies on the metaphysics of **Reproductive Lineage Types**. Traits are not individuals; they are classes of copies descended from a common ancestor.
  *   **Strength:** It captures the intuition that a heart remains a heart even if it cannot pump (e.g., in a vat). Its identity is tied to the history of the *type*, not the current performance of the *token*.
  *   **Normative Mechanism:** Normativity is **historical-teleological**. A trait token belongs to a lineage defined by a specific survival/reproductive contribution. To be a member of that lineage is to be "supposed" to make that contribution. Malfunction is a token failing to meet the conditions that define its type's persistence.
  *   **Weakness:** It struggles with novel traits (spandrels) or traits where selection history is opaque.

  ### 2. Consensus vs. Contested Ground

  Before diagnosing the argument, we must separate the settled from the disputed.

  **Settled Consensus:**
  1.  **CR and Malfunction:** There is near-universal agreement that the standard Causal-Role account (Premise 2-3) cannot ground a robust distinction between malfunction and variation *unless* one adds external constraints (like a "normal" model of the system). Pure CR is descriptive of current disposition.
  2.  **ET and History:** There is agreement that the Etiological account reduces function claims to causal-historical claims (Premise 5-6).
  3.  **The Utility of Function:** There is consensus that function talk is indispensable in physiology and medicine (Premise 10). Even eliminativists like Boorse admit we need a substitute for "pathology."

  **Genuinely Contested:**
  1.  **The Nature of Biological Normativity:** Is the "ought" in "the heart ought to pump" a real norm, or a metaphor for statistical normality? Naturalists (Millikan, Neander, Garson) say it is a real, naturalized norm. Skeptics (Boorse, some ethicists) say it is merely statistical deviation from a species-typical design.
  2.  **The Is-Ought Gap in Biology:** Can historical facts (selection) genuinely generate normative standards for current tokens? This is the crux of your colleague's argument.
  3.  **Individuation of Traits:** Do traits have historical essences (ET) or are they defined by current structure/capacity (CR)?

  ### 3. Diagnosis of the Argument

  Your colleague's argument is valid, but it is **unsound**. The flaw lies in **Step (7)**, supported by an equivocation in **Step (1)**.

  **The Flaw: The Equivocation on "Normative" (Steps 1 and 7)**

  The argument relies on a bait-and-switch regarding the meaning of "normative."

  *   **In Premise (1):** "Normative" means **the possibility of error.** To say function ascriptions are normative is to say there is a fact of the matter about whether a trait is *failing* versus *varying*. This is a logical requirement for the concept of malfunction.
  *   **In Premise (7):** "Normative" is implicitly defined as **prescriptive obligation grounded in non-natural facts.** The premise asserts that a "purely causal-historical claim cannot ground a standard of correctness." This assumes that for a standard of correctness to be real, it must float free of causal history (a Platonic or Kantian view of norms).

  **Why Step (7) is False:**
  Step (7) asserts: *From the fact that pumping blood happened to be associated with reproductive success in the past, nothing follows about what this particular heart, here and now, is supposed to do.*

  Selected Effect theorists (Millikan, Neander, Price) argue this is precisely what follows, provided you accept the metaphysics of **Lineage Types**.
  1.  Biological traits are individuated by their history, not just their current physics.
  2.  To be a "heart" is to be a member of a lineage of organs that persisted *because* they pumped blood.
  3.  Therefore, the condition "pumping blood" is part of the identity conditions of the trait type.
  4.  A token that fails to pump blood is not merely "different"; it is a **defective instance of its type**. It fails to satisfy the condition required for the existence of the type to which it belongs.

  Step (7) ignores that in biology, the "ought" is derived from the conditions of **persistence**. If $X$ exists now because ancestors did $F$, then current $X$s are "supposed" to do $F$ in the sense that doing $F$ is the causal condition for the continued existence of the lineage. This grounds a standard of correctness (does this token meet the lineage conditions?) without requiring non-natural prescriptive force.

  Your colleague's argument assumes that because the history is *causal*, it cannot be *normative*. But the ET account argues that in biological systems, specific causal histories *constitute* norms. Step (7) begs the question against naturalized teleology by assuming norms must be non-natural.

  ### 4. The Cost of Rejecting Step (7)

  You asked which premise is least costly to abandon to save (1) and (10). You should reject **(7)**. However, this is not a free lunch. Here is what you pay for it:

  **1. Metaphysical Commitment to Historical Essences**
  To make Step (7) false, you must accept that biological traits are individuated historically. You cannot define a heart solely by its current structure or capacity. You must accept that a molecule-for-molecule duplicate of a heart, created by random fluctuation (a "swampman" heart), has *no function* because it has no history. This is counterintuitive to some, but it is the price of naturalizing normativity.

  **2. A Deflationary View of "Ought"**
  You must accept that biological normativity is "thin." It does not imply the heart *morally* ought to pump, nor that it is *rationally* compelled to. It only means that the heart is a member of a class defined by pumping. If you are looking for a robust, prescriptive normativity that bridges into ethics, the ET account will not provide it. It provides a **functional norm**, which is sufficient for medicine (Premise 10) but insufficient for moral philosophy.

  **3. The Problem of Novelty**
  By embracing ET to save normativity, you inherit the ET's weakness: novel functions. If a trait is co-opted for a new use (exaptation), it technically has no "proper function" yet under strict ET views. You must accept that for a period of time, a beneficial trait might be functionless until selection acts on it. (Note: Some modern ET variants, like the "Survival Contribution" account, try to mitigate this, but the tension remains).

  ### 5. Alternative: Rejecting Step (3)

  If you find the historical metaphysics too costly, there is a secondary path: Reject **(3)** instead of (7), but modify **(1)**.

  Some modern Causal-Role theorists (e.g., Bigelow & Pargetter, or system-based accounts) argue that normativity can be grounded in the **stability of the system**.
  *   **Move:** A trait malfunctions if its performance deviates from the contribution required to maintain the system's *self-maintaining* organization (autopoiesis).
  *   **Cost:** This requires a robust theory of biological individuation (what counts as "the system"?). It also yields a weaker normativity than ET. It explains why a heart *in this organism* should pump, but struggles to explain why a heart *in a jar* is malfunctioning (since it's not contributing to a system). Given your commitment to (10) (medicine/physiology), the ET route (rejecting 7) is generally preferred because medicine treats isolated organs as malfunctioning even ex vivo.

  ### Summary Recommendation

  To preserve the reality of malfunction (1) and the practice of medicine (10):

  1.  **Reject Step (7).** It assumes a Humean Is-Ought gap that does not apply to functional norms constituted by historical lineage conditions.
  2.  **Accept the Etiological Account.** It is the only mainstream account that successfully naturalizes the "malfunction" distinction without importing external values.
  3.  **Pay the Cost.** Accept that biological norms are historical and "thin" (based on lineage persistence), and accept that functionless tokens (swampman) are possible.

  Your colleague's argument is a classic presentation of the **Naturalistic Fallacy** applied to biology. It assumes that because the ground is natural (causal history), the flower (normativity) cannot grow there. The consensus among functional realists in philosophy of biology is that the soil of selection history is exactly where biological norms grow. The argument fails because it demands a kind of normativity (prescriptive, ahistorical) that biology does not need and does not have.
