  The principle that unifies your verdicts is not one of fidelity to text, but of fidelity to **aesthetic function**. You are consistently prioritizing the *mechanism of effect* over the *mechanics of construction*, unless those mechanics are themselves the source of the effect.

  I propose we call this **The Principle of Generative Priority**.

  ### The Principle Stated Precisely

  > **In translation, preserve the element that *generates* the work's primary aesthetic value, even at the expense of elements that merely *convey* it. Where form is the content (as in wit, constraint, or music), form is invariant. Where form is the vessel (as in imagery, tone, or argument), content is invariant.**

  ### Motivation by Case

  This principle is composed of two clauses, each motivated by opposing halves of your data set:

  1.  **The Invariance of Generative Form:**
      *   *Motivated by:* The **Comic Rondeau**, the **Lipogram**, the **Song Lyric**, the **Sestina**, and the **Nonsense Poem**.
      *   *Reasoning:* In these cases, the specific formal constraint (rhyme/pun, omission, musical meter, repetition pattern, portmanteau) is not a container for the meaning; it is the *engine* of the meaning. A rondeau without puns is not a comic rondeau; a song without fit notes cannot be sung; a sestina without the pattern does not enact obsession. To alter these is to destroy the work's identity. Thus, you allow sense to warp to preserve the engine.

  2.  **The Variance of Decorative Form:**
      *   *Motivated by:* The **Sombre Elegy** and the **Haiku**.
      *   *Reasoning:* In these cases, the primary value lies in the emotional resonance (grief) or the perceptual clarity (seasonal image). The rhyme scheme in the elegy and the 5-7-5 count in the haiku are *proxies* for structure and brevity, not the source of the value itself. When the proxy conflicts with the value (rhyme padding dilutes grief; English 5-7-5 bloats the image), the proxy must be discarded to save the work's soul.

  ### Resolving the Troubling Pair

  You asked why you praise the **Rondeau** (Form > Sense) but fault the **Elegy** (Sense > Form). Under the Principle of Generative Priority, there is no contradiction.

  *   In the **Rondeau**, the *purpose* is wit. Wit is generated by the friction of sound and sense (puns/rhyme). If you preserve the literal sense but lose the pun, you have preserved the *prose* but killed the *poem*. The form is constitutive.
  *   In the **Elegy**, the *purpose* is mourning. Mourning is generated by the weight of imagery and tone. If you preserve the rhyme but pad the lines with filler, you lighten the weight. The form is decorative.

  The difference lies not in the severity of distortion, but in **where the aesthetic energy originates**. In the Rondeau, the energy comes from the *play* of the form. In the Elegy, it comes from the *truth* of the content.

  ### Application to the Unsettled Case: The Petrarchan Sonnet

  **Case:** A Petrarchan sonnet where Italian rhymes are natural, but English rhymes force clichés.

  **Analysis:**
  We must identify the *generative element* of the Petrarchan sonnet. Is it the rhyme scheme (ABBAABBA CDECDE), or is it the *volta* (the turn of argument) and the intellectual/emotional resolution?
  *   If the sonnet is a **formal exercise** (like the Lipogram), the rhyme scheme is generative.
  *   If the sonnet is a **vehicle for thought** (like the Elegy), the argument is generative.

  **Verdict:**
  Most Petrarchan sonnets rely on the *tension* between the form and the argument. However, clichés destroy intellectual tension. A cliché resolves thought prematurely. Therefore, under the Principle of Generative Priority, **you should sacrifice the rhyme scheme to preserve the integrity of the argument.**

  An unrhymed sonnet that thinks deeply is more faithful to the *function* of a sonnet than a rhymed sonnet that thinks clichés. You might seek slant rhymes or internal rhythm to hint at the form, but do not force end-rhymes that cheapen the voice. This aligns with your verdict on the Elegy: tone and image (here, intellectual voice) override decorative structure.

  ### The Honest Cost: Which Verdicts Cannot Be Accommodated?

  The Principle of Generative Priority accommodates almost all your intuitions, but it exacts a cost in two specific areas where your verdicts rely on unstated assumptions about **equivalence**.

  **1. The Lipogram (The Problem of Difficulty)**
  *   *Your Verdict:* Omitting a different letter is fine.
  *   *The Principle's Failure:* The principle demands preserving the *constraint*, but it cannot account for the *severity* of the constraint. A lipogram omitting 'Z' is trivial; one omitting 'E' is a monumental feat. If the original omitted 'E' and you omit 'Z', you have preserved the *type* of constraint (Generative Form) but not the *degree* of struggle, which is often part of the aesthetic value (the reader's admiration of the feat).
  *   *The Cost:* To keep your verdict, you must accept that "Constraint" is a binary category (present/absent) rather than a scalar one (hard/easy). The principle forces you to admit that such a translation is a *homage* to the constraint, not a true functional equivalent.

  **2. The Comic Rondeau (The Problem of Identity)**
  *   *Your Verdict:* "Almost no line says what the original line said."
  *   *The Principle's Failure:* If the form is preserved but the semantic content is entirely replaced, the Principle of Generative Priority classifies this as a success because the *wit* is preserved. However, this stretches the definition of "translation" to "adaptation." If *nothing* of the original subject matter remains, have you translated the poem, or merely used its skeleton to hang a new poem?
  *   *The Cost:* To keep this verdict, you must surrender the claim that a translation must share a *subject* with the original. The principle accommodates your preference, but it does so by redefining translation as **re-creation**. This alienates any intuition that a translation should allow a reader to access the *original author's thoughts*, rather than just the *original author's playful spirit*.

  **Summary:**
  Your intuitions are remarkably consistent. They are governed by a sophisticated understanding that **form is not always form**. Sometimes form is the message; sometimes it is the envelope. The Principle of Generative Priority codifies this. The price you pay is the admission that a "faithful" translation may share almost no words, no subject, and no specific constraints with the original, provided it makes the reader *feel* what the original reader felt. This is Hofstadter's territory: it is a theory of **resonance**, not correspondence.
