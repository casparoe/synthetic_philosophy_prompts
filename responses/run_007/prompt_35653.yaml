      That's the classic "flicker of freedom" objection, and it's definitely the sharpest tool in the incompatibilist kit, but I think you're asking for too much precision from the principle you're trying to save. Even if we grant that Jones could have initiated a prior sign that would trigger Black's intervention, that tiny sliver of possibility isn't the kind of alternative possibility that matters for moral responsibility. What grounds responsibility is the actual sequence of events—Jones's own reasoning, desires, and volition leading to the action—not the mere metaphysical possibility that he could have started to choose differently before being shut down. If we tweak the case so the sign is a non-voluntary neural blip that Jones can't control, the flicker disappears entirely, but even if we leave it in, that flicker is too insubstantial to bear the weight of grounding responsibility. So, I'd say PAP isn't just false because alternatives are eliminated; it's false because alternatives aren't *necessary* when the actual sequence is appropriately owned by the agent.

