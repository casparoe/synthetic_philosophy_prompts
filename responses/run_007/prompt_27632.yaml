      *   *Triage in a Disaster:* Deciding who gets resources, but doesn't quite cover *killing* innocents.
      *   *The "Trolley Problem" (Institutionalized):* Acknowledges the moral dilemma without pretending it's a technical fix.
      *   *Architect Demolishing a Building:* Controlled demolition to save a city block? Still has consent issues.
      *   *Selection:* The **Police Sniper** analogy is often stronger because it involves rules of engagement, imminent threat, and legal accountability, but the **Quarantine/Epidemiology** analogy might capture the "spread of violence" better. Let's go with a **Firefighter** analogy (controlled burn) or stick to the **Police** analogy for rights-based constraints. Actually, the **Judge/Sentencing** analogy highlights the due process issue.
      *   *Best Fit:* **The Police Siege.** It captures the tension between neutralizing a threat and protecting bystanders within a legal/rights framework, rather than a medical/technical framework.

  7.  **Critique the Setup:**
      *   Is the user asking for something impossible? No, analogical auditing is a standard philosophical tool.
