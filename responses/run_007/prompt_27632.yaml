      *   *Innocence of the "Tissue":* In surgery, tissue is passive. In war, civilians are moral subjects with rights, not just obstacles.
      *   *The "Hippocratic Oath":* Surgeons swear "do no harm" (primum non nocere), but the friend twists this to "do harm to save." In politics, the mandate is protection, but the *means* are constrained by rights, not just outcomes.
      *   *Isolation:* Surgery happens in a sterile room. Drone strikes happen in complex social ecosystems.

  5.  **Assess the Conclusion:**
