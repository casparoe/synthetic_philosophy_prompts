      *   *Certainty:* Diagnosis is high-certainty science. Intelligence is often flawed/uncertain.
      *   *Agency:* The tumor doesn't fight back or have rights. The HVT is a moral agent (potentially), but the civilians are non-combatants with rights, not just "tissue."
      *   *Goal:* Surgery aims to *heal* the specific patient. War/Strikes aim to *neutralize* a threat, often harming the "patient" (the population) in the process.
      *   *Feedback Loop:* Surgeons get immediate feedback. Politicians often deal with long-term blowback (radicalization).
      *   *Neutrality:* Surgeons are neutral regarding the disease. Politicians are partisan/strategic.

  4.  **Evaluate the "Imported Features":**
