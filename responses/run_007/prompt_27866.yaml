  2.  **Deconstruct the Two Generals Problem:**
      *   *Setup:* Two generals, unreliable channel (messages can be lost), need to coordinate attack.
      *   *Constraint:* Deterministic protocol over an unreliable channel cannot guarantee coordination with probability 1.
