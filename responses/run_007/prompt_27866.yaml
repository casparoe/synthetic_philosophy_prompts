prompt: |-
  I'm in a reading group on rationality and game theory, and one of the members keeps using the two-generals problem to explain common knowledge. His line is this: just as the two generals can never be sure the other got the message, because every acknowledgment needs an acknowledgment and so on forever, real people can never actually have common knowledge of anything important, since communication is always a little lossy and there's always some doubt about whether the other person knows that you know. From that he concludes that Aumann-style agreement results and the whole idea that rational people with common priors should converge are basically irrelevant to real disagreement: rational people can perfectly well agree to disagree, because common knowledge is an unattainable ideal.

  I suspect the analogy is doing more work then it should, but I can't pin down exactly where it breaks. Could you audit it for me? In particular: give the correspondence table between the two-generals setup and the setup in epistemic game theory where common knowledge of rationality is supposed to matter; say where the mapping fails (for instance, does the relevant common knowledge require an infinite stack of message acknowledgments, or does it come from public events, common priors, and the way the interactive situation is modeled?); separate the disanalogies that matter for his conclusion from the ones that don't; and then say whether his conclusion—that rational people can agree to disagree in real life because common knowledge is impossible—actually survives. And if there's a better analogy for what common knowledge of rationality actually requires, say what that would be. American English, please.
