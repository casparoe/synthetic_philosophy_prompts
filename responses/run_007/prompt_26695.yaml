answer: |-
  This is a sharp dissection of the ethics of memory. You have identified a genuine philosophical friction point: the tension between *historical contextualism* (they were products of their time) and *moral realism* (some things are always wrong).

  To answer this, we need to treat the removal of statues and names not just as a political act, but as a speech act that relies on a specific metaphysics of time and value. Here is a reconstruction of the implicit theory of moral progress presupposed by the practice, distinguishing between what is necessary, what is contingent, and where the philosophy is actually settled.

  ### 1. The Implicit Theory: "Retrospective Disavowal"

  The practice of renaming and removal presupposes a theory of moral progress that is **directional, discontinuous, and communicative.**

  *   **Directionality:** It assumes that moral change is not merely difference, but improvement. If we swap a statue of a colonialist for a statue of an indigenous leader, we are not saying "times have changed"; we are saying "our current valuation is *correct* and the previous one was *incorrect*."
  *   **Discontinuity:** It assumes a break in moral identity. The current community claims it is not continuous with the past community in a way that binds it to those past values. We are saying, "That was *then*, this is *now*," implying that the moral gap is wide enough to warrant erasure of symbols.
  *   **Communicative Function:** Crucially, the practice presupposes that public honors are not historical records (like a plaque in a museum) but **endorsements**. Therefore, keeping a statue up is an ongoing speech act by the *current* institution, not a memorial to the dead.

  **The Resolution to Your Tension (Culpability vs. Context):**
  You noted a tension: If moral progress is slow expansion, how could they have known better? If they couldn't know better, why punish them?
  The implicit theory resolves this by shifting the locus of judgment. The practice does not strictly require that the historical figure was *culpable* in their own time. It requires that *we* are culpable if we continue to honor them now.
  *   **Implicit Premise:** Public honors reflect current values, not historical accuracy.
  *   **Conclusion:** We remove the statue not to punish the dead (who are beyond harm), but to prevent the living from being complicit in a false endorsement.

  ### 2. Required vs. Fits Well vs. Underdetermined

  To see where the philosophical engines can be swapped, we must separate the structural requirements of the practice from the meta-ethical justifications.

  #### What is Strictly Required?
  1.  **Normative Asymmetry:** We must believe our current moral framework is superior to the past one in the specific domains relevant to the honor (e.g., racial equality, bodily autonomy).
  2.  **Symbolic Malleability:** We must believe that physical symbols (statues, names) actively shape current moral perception, not just record history.
  3.  **Collective Agency:** The institution removing the honor must view itself as a moral agent capable of correcting the errors of its predecessors.

  #### What Merely "Fits Well" (But Isn't Required)?
  1.  **Moral Realism:** It fits well to say "Slavery was always wrong, and we finally realized it." This makes the progress feel like discovery. But the practice works even if you aren't a realist, provided you are confident in your current construct.
  2.  **Individual Culpability:** As noted above, it fits the narrative to say "He was a monster." But the practice survives even if you say "He was a normal man who participated in a terrible system we now reject."
  3.  **Linear Progress:** It fits to think history is a straight line upward. But the practice only requires that *we* are currently at a higher point than *they* were, not that every generation improves on the last.

  #### Where It Is Underdetermined (The Philosophical Engines)
  You can run this practice on at least two conflicting meta-ethical engines:

  *   **Engine A: Moral Realism (The Discovery Model).**
      *   *View:* Moral truths exist independently of human opinion. Past figures failed to perceive them (due to bias, ignorance, or vice).
      *   *Justification for Removal:* "We are aligning our symbols with the objective moral truth that they obscured."
  *   **Engine B: Moral Coherentism/Constructivism (The Consensus Model).**
      *   *View:* Moral truth is constituted by the reflective equilibrium of a community.
      *   *Justification for Removal:* "Our current reflective equilibrium rejects slavery. Keeping the statue creates cognitive dissonance and undermines our current social contract. We are updating our operating system."

  The practice looks the same in both cases, but the *story* told about it differs. Realists say we found the truth; Constructivists say we changed our minds and have the power to enforce it.

  ### 3. The Counterfactual: Pure Constructivism / Power Dynamics

  You asked: If we swapped the view for a purely constructivist one where morals shift with power and circumstance (no direction), what happens to the practice?

  If moral change is merely a shift in power dynamics with no normative direction (a Foucaultian or Nietzschean view), the practice of statue removal changes fundamentally:

  1.  **From "Correction" to "Conquest":** Removal is no longer an act of moral improvement; it is an act of territorial marking. It becomes: "We won, they lost. Their symbols come down because they no longer hold power."
  2.  **Loss of Universal Claim:** Under the current practice, we imply the slaveholder was *wrong* in a way that anyone (including them, ideally) should acknowledge. Under pure power-constructivism, we admit: "They were right for their power structure; we are right for ours." This weakens the moral force. It becomes aesthetic preference or tribal signaling.
  3.  **Instability:** If there is no direction, only flux, then the new statues are just placeholders for the next regime. The practice becomes cynical. Why remove a statue if your values will be overturned in 100 years anyway?
  4.  **Survival of the Practice:** The practice would survive, but it would look like **iconoclasm** rather than **reform**. It would be accompanied by rhetoric of "reclaiming space" rather than "honoring justice." It would be honest about being a power move, rather than cloaking itself in the language of moral discovery.

  ### 4. Settled Consensus vs. Live Debates

  You asked to distinguish what is settled among scholars of moral progress from what is contested. This is vital because pop-culture discourse often conflates them.

  #### Broadly Settled (Among Empirical and Historical Scholars)
  *   **The Phenomenology of Expansion:** There is strong consensus (e.g., Kwame Anthony Appiah, Steven Pinker, Peter Singer) that over the long run, moral circles *have* expanded. We include more genders, races, and species in our sphere of concern than prior centuries did. This is an empirical observation about social change, not necessarily a metaphysical claim.
  *   **The Role of Contestation:** Scholars agree that moral progress is rarely smooth; it requires conflict, social movements, and "moral entrepreneurs" who challenge existing norms (Martha Nussbaum, Michele Moody-Adams).
  *   **Context Matters:** Historians and ethicists generally agree that judging historical figures requires understanding their epistemic environment. However, they also agree that "everyone did it" is not always a sufficient excuse (e.g., there were always dissenters).

  #### Genuinely Contested (Among Meta-Ethicians and Philosophers)
  *   **Mind-Independence:** Is moral progress *discovery* (Realism) or *invention* (Constructivism)?
      *   *Realists* (e.g., David Enoch, some Kantians) argue progress is getting closer to mind-independent truths.
      *   *Anti-Realists/Pragmatists* (e.g., Richard Rorty, Huw Price) argue progress is just "us" becoming more liberal, with no external anchor.
      *   *Status:* **Heavily Contested.** The statue practice works for both, but implies Realism to the layperson.
  *   **Retrospective Judgment:** Is it valid to apply current standards to past agents?
      *   *Presentists* argue we must judge by current standards because morality is about how *we* live now.
      *   *Historical Contextualists* argue that blaming past agents for not knowing what was unknowable to them is anachronistic and unjust.
      *   *Status:* **Live Debate.** Allen Buchanan (*The Heart of Human Rights*) argues we can judge past *institutions* as unjust without necessarily condemning every *individual* who participated in them. This nuance is often lost in public discourse.
  *   **Linearity vs. Fragility:** Is progress irreversible?
      *   Some scholars warn against the "Whig interpretation of history" (assuming we are inevitably getting better).
      *   *Status:* **Contested.** Many ethicists warn that moral progress is fragile and reversible (e.g., the rise of authoritarianism), which complicates the "we are better now" assumption of statue removal.

  ### Summary

  The practice of renaming and removal presupposes a **directional theory of moral progress** where the current community has epistemic access to moral truths (or superior norms) that the past community lacked or ignored.

  However, it is **underdetermined** regarding *why* we have that access. It works whether you believe we discovered objective truth (Realism) or simply built a more inclusive consensus (Constructivism).

  The tension you identified regarding culpability is resolved in the practice by shifting the focus from **punishing the dead** to **purifying the living community's values**.

  If you swap the engine for **pure power-constructivism**, the practice loses its claim to "justice" and becomes an honest admission of "regime change." It survives, but it becomes cynical iconoclasm rather than moral reform.

  **The Scholarly Bottom Line:** Experts agree moral circles have expanded and that symbols matter. They disagree on whether that expansion is "truth-tracking" or "preference-shifting," and they debate the fairness of retroactive judgment. The public practice tends to speak as if the first is settled and the second is irrelevant, which is where the philosophical friction you sensed comes from.
