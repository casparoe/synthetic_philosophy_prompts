      *   Counterfactual (constructivism)? Yes.
      *   Settled vs. Contested? Yes.

      *(Self-Correction on "Settled"):* Be careful. In philosophy, almost nothing is "settled." I should frame it as "broad consensus among empirical/historical scholars of morality" vs. "meta-ethical disagreement." For example, almost everyone agrees the abolition of slavery counts as progress *by our lights*, but not everyone agrees it counts as *objective* progress. I need to be precise there.

      *(Refining the "Culpability" point):* The prompt suggests the practice presupposes they *should have known*. I should challenge that. Does the practice require that? Or does it just require that *we* don't honor them? If I take down a statue of a slaveholder, am I saying "He was guilty" or "We don't honor slaveholders"? The latter is compatible with historical contextualism. This is a crucial nuance.

