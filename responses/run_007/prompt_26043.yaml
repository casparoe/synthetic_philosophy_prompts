answer: |-
  This is a remarkably sharp observation, and you are quite right to sense that the existing terminology does not quite capture the specific normative texture of the phenomenon you describe. As a postgraduate in political theory, you will appreciate that while we have robust vocabularies for cooperation based on shared values (consensus), shared interests (bargaining), or mere coexistence (modus vivendi), the space where agents *actively promote* ends they privately deem *normatively bankrupt* is surprisingly under-theorised.

  Let us proceed by clearing the conceptual ground, examining the nearby concepts you mentioned, and then attempting to isolate the specific mechanics of what you are observing. Finally, I will offer a proposed terminology that might serve your purposes.

  ### 1. Conceptual Neighbours and Distinctions

  To pin this down, we must distinguish it from the four most likely candidates: Moral Trade, Logrolling, Modus Vivendi, and Hypocrisy.

  **Moral Trade**
  You have already identified the crucial friction here. In the literature stemming from Toby Ord's work on moral trade, the assumption is that while agents prioritise values differently, they acknowledge the *intrinsic* moral weight of the other's preference. If a vegan trades with a pro-life activist, the vegan acknowledges that saving human lives is good, even if they prioritise animal suffering more highly.
  In your cases, this condition fails. The climate group does not think animal welfare is *less* important; they think it is based on a category error regarding consciousness. The intrinsic value ($V_{intrinsic}$) they assign to the other's goal is not low-positive; it is zero or negative. They are not trading on moral weight; they are trading on *political capital*. This shifts the transaction from the moral sphere to the purely instrumental.

  **Logrolling**
  In public choice theory (Buchanan and Tullock), logrolling is vote-trading. 'I support your dam if you support my tariff.' This is the closest functional equivalent. However, standard logrolling is typically agnostic about the *merit* of the projects. It assumes preferences are sovereign and not subject to normative critique within the model.
  Your examples introduce a normative judgement that standard logrolling ignores. In logrolling, I might not care about your dam, but I don't necessarily think your dam is *intellectually bankrupt* or *morally misguided*. When the support is given despite a belief that the other's end is actively erroneous, the transaction incurs an 'integrity cost' that standard logrolling does not account for.

  **Modus Vivendi**
  In the Rawlsian sense, a modus vivendi is a settlement based on a balance of power rather than moral agreement. We tolerate each other to avoid conflict. However, a modus vivendi is typically negative: it is an agreement *not to interfere*. Your examples involve positive action: showing up to protests, defending budgets. This is not merely living together; it is actively bolstering a rival framework. It is, if you will, an *active* modus vivendi, which is a rarer and more unstable beast.

  **Hypocrisy**
  You note that 'nobody is lying exactly'. Hypocrisy typically involves a discrepancy between one's public avowals and private beliefs *to an audience that is deceived*. Here, the 'audience' (the leadership of both groups) is not deceived. They are colluding in a silence. This is not hypocrisy in the standard sense because there is no claim of shared virtue being made to the *partners*. It is closer to a form of collective self-deception regarding the public face of the alliance, but between the principals, it is a candidly strategic bargain.

  ### 2. The Core Mechanism: Instrumental vs. Intrinsic Valuation

  The philosophical heart of this phenomenon is the decoupling of *instrumental value* from *intrinsic value*.

  In a standard coalition, $V_{intrinsic}(Other's Goal) > 0$.
  In your cases, $V_{intrinsic}(Other's Goal) \le 0$, but $V_{instrumental}(Supporting Other's Goal) > Cost(Integrity)$.

  The agents are effectively 'bracketing' their normative judgement. They are not suspending judgement because they are unsure (agnosticism); they are suspending it because it is strategically inconvenient (pragmatism). This requires a specific epistemic condition: the contempt must be managed. If it becomes too public, the alliance fractures (because the public face of solidarity is broken). If it becomes too private (i.e., forgotten), the agents risk actually coming to believe in the cause they despise, which might dilute their own focus.

  ### 3. A Proposed Terminology

  Given that no canonical term exists, I propose we coin a phrase that captures both the reciprocal nature of the aid and the negative normative valuation underpinning it.

  I suggest the term **"Disavowed Reciprocity"**.

  Alternatively, if you wish to emphasise the political mechanism rather than the psychological state, **"Adversarial Logrolling"** is serviceable, though it lacks the nuance of the private contempt. However, **"Disavowed Reciprocity"** captures the specific condition you highlighted: 'Nobody is lying exactly, but nobody is being fully candid either.'

  **Definition:**
  *Disavowed Reciprocity* occurs when two agents (A and B) engage in mutual support for each other's ends, conditional on the private understanding that:
  1.  Neither endorses the intrinsic value of the other's end.
  2.  At least one party regards the other's end as normatively misguided or erroneous.
  3.  The collaboration is sustained solely by the instrumental benefit to their respective primary ends.
  4.  The normative disagreement is tacitly excluded from the public performance of the alliance.

  ### 4. Boundaries and Conditions

  You asked whether it matters if the contempt is private or public, or the deal explicit or tacit. In the framework of Disavowed Reciprocity, these boundaries are constitutive.

  **The Privacy of Contempt**
  If the contempt becomes public, the arrangement shifts.
  *   *If public:* It becomes an **"Open Adversarial Alliance"**. This is rarer but possible (e.g., 'We disagree on everything, but we both hate this third party'). However, in your examples, the groups are trying to build a broad front. Publicising the contempt would undermine the signal of solidarity sent to the membership. Therefore, the *privacy* of the contempt is essential for the stability of Disavowed Reciprocity. It relies on a 'pluralistic ignorance' where the rank-and-file might suspect the divergence, but the leadership maintains the fiction of solidarity.
  *   *If the contempt vanishes:* If they come to respect each other's causes, it graduates into standard **"Moral Trade"** or **"Overlapping Consensus"**.

  **The Explicitness of the Deal**
  *   *Explicit Deal:* If the chairs sit down and say, 'I think your department is rubbish, but I'll defend you if you defend me,' this is a candid **"Cynical Bargain"**. It is stable but brittle; it admits the integrity cost openly.
  *   *Tacit Deal:* If they merely act in concert without stating the terms, relying on mutual understanding, this is closer to **"Disavowed Reciprocity"**. The tacit nature allows for 'plausible deniability' regarding the cynicism. It protects the agents' self-conception as principled actors. I would argue the phenomenon is most potent when the deal is *tacit* but the contempt is *private*.

  ### 5. Normative Implications

  Why does this distinction matter for your work? Because it highlights a specific vulnerability in coalition politics that 'Moral Trade' obscures.

  1.  **Stability:** Disavowed Reciprocity is inherently less stable than Moral Trade. If the instrumental calculus shifts (e.g., the climate group no longer needs the animal welfare numbers), the alliance collapses immediately because there is no normative glue holding it together.
  2.  **Integrity:** This arrangement imposes a 'corruption tax' on the participants. By publicly endorsing a view they privately deem bankrupt, they risk eroding their own epistemic integrity. Over time, consistently arguing for a position one believes to be false can lead to a form of cognitive dissonance that dulls one's commitment to truth.
  3.  **Membership Betrayal:** There is a democratic deficit here. The leadership is making a trade that the rank-and-file (who likely *do* believe in the intrinsic value of the allied cause) are not party to. This is a form of elite cartellisation.

  ### Conclusion

  You have identified a gap in the taxonomy of political cooperation. It is not Moral Trade, because the moral weight is not recognised; it is not Logrolling, because the normative contempt adds an integrity cost; and it is not Hypocrisy, because the deception is collusive rather than unilateral.

  I recommend adopting **"Disavowed Reciprocity"** for your work. It signals to your readers that you are describing a reciprocal arrangement where the normative basis for the reciprocity is actively denied (disavowed) by the participants, even as they engage in it. It allows you to analyse the tension between the *instrumental rationality* of the alliance and the *normative irrationality* of supporting a cause one deems misguided.

  It is, in essence, a pact to tolerate each other's errors for the sake of power. That is a distinct and potent political form, and it deserves a name.
