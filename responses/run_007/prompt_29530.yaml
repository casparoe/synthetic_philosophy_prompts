answer: |-
  This is one of the most persistent and difficult interpretive challenges in *On Certainty*. You have identified the precise pressure point where many readers feel Wittgenstein is either lapsing into pragmatism, fideism, or a kind of sophisticated skepticism.

  Your worry is essentially this: If a hinge proposition is held without evidence and is immune to doubt, isn't it just a dogma? And if our entire system of justification rests on dogmas, isn't the system irrational?

  To see why Wittgenstein thinks this characterization is a mistake, we have to look at how he is trying to dismantle the very framework you are using to evaluate the hinges. Specifically, he challenges three assumptions implicit in your question:
  1.  That hinges are **propositions** in the same sense as empirical claims.
  2.  That "rationality" is a standard that stands outside our language-games.
  3.  That the alternative to "justified knowledge" is "irrational prejudice."

  Here is how Wittgenstein responds to each of these points.

  ### 1. Hinges are Rules, not Empirical Claims
  The most common misunderstanding of hinges is to treat them as *empirical propositions that we just happen not to check.* You wrote: *"They are not things we know... but they are also not things we can sensibly doubt."*

  Wittgenstein goes further. He suggests that while hinges *look* like empirical propositions (grammatically, "The earth exists" looks like "The cat is on the mat"), they **function** as rules.

  Consider the rules of chess. "The bishop moves diagonally." Is this true? Well, it's not an empirical discovery about wooden pieces. It is a rule that defines what "bishop" and "chess" mean. You do not "know" the rule in the sense of having evidence for it; you **use** it to play the game. If you start asking for evidence that the bishop moves diagonally, you aren't being a rigorous skeptic; you aren't playing chess anymore.

  Wittgenstein argues that "I have hands" or "The earth has existed" function similarly. They are the normative scaffolding that allows us to distinguish between *true* and *false* empirical claims.
  *   If I claim "My car is in the driveway," that can be true or false.
  *   But for that claim to have a truth value, it must be the case that physical objects persist, that space exists, etc.

  Therefore, calling a hinge an "ungrounded assumption" is a category mistake. An assumption is something you take to be true within a system of inquiry. A hinge is part of the **grammar** of the system itself. It is not an ungrounded *belief*; it is an ungrounded *way of acting*.

  ### 2. The "Irrationality" Charge and the View from Nowhere
  You ask: *"Isn't a system of beliefs built on such assumptions irrational by the very standards it claims to honor?"*

  This assumes there is a "court of reason" standing outside our human practices where we can put our language-games on trial. Wittgenstein denies this. For him, rationality is internal to a language-game.

  To be "rational" means to follow the rules of justification appropriate to a specific context.
  *   In a court of law, it is rational to demand evidence for a crime.
  *   In a math class, it is rational to demand a proof.
  *   But it is **nonsensical** to demand evidence for the framework that makes evidence possible.

  If you demand grounds for "The earth exists," what grounds could I possibly offer? "I see the ground." But your seeing the ground *presupposes* the earth exists. "Science says so." But science presupposes the earth exists.

  Wittgenstein writes: *"Giving grounds... comes to an end. — But the end is not an ungrounded presupposition: it is an ungrounded way of acting."* (OC §110).

  The mistake is thinking that because the justification stops, it stops due to a *failure* of reason (irrationality). Wittgenstein argues it stops because we have hit the bedrock. If your spade turns, you don't say, "My digging is irrational"; you say, "This is where digging stops." To call the bedrock "irrational" is to misunderstand what rationality is. Rationality is a move *within* the system, not a judgment *of* the system.

  ### 3. Prejudice vs. Form of Life
  You suggest hinges might be *"prejudices that we happen to be psychologically unable to give up."*

  This suggests that, deep down, we *could* doubt them, but we are too weak or conditioned to do so. Wittgenstein rejects this psychological reading for a logical/anthropological one.

  A prejudice is a belief held despite contrary evidence. But there is no "contrary evidence" for a hinge, because evidence is only intelligible *in light of* the hinge.
  *   If I say, "I suspect I don't have hands," and I look at my stumps, the skeptic says, "See! You were right to doubt!"
  *   But Wittgenstein would say: If you genuinely doubted you had hands, you wouldn't look for visual confirmation. You would be in a state of madness or profound disorientation, not inquiry.

  Wittgenstein calls this **certainty**, but he distinguishes it from epistemic certainty. It is an **animal certainty**. It is part of our "form of life." A child does not learn "I have hands" by verifying it; they learn it by using their hands. It is woven into their training.

  To call this a "prejudice" implies we have a choice. But we don't choose our form of life any more than a fish chooses water. It isn't that we are *psychologically unable* to give it up; it's that giving it up would mean ceasing to participate in the human language-game of justifying and doubting.

  ### 4. Dissolving the Skeptic, Not Conceding to Them
  Finally, you worry Wittgenstein is *"conceding the charge [of the skeptic] and then declining to be troubled by it."*

  Actually, Wittgenstein believes he is dissolving the skeptic's question entirely. The skeptic says: *"You claim to know things, but your foundations are unproven. Therefore, you know nothing."*

  Wittgenstein replies: *"You are using the word 'know' incorrectly."*

  For Wittgenstein, "I know" only makes sense where "I could be wrong" also makes sense.
  *   "I know the train leaves at 5" makes sense because it could leave at 5:10.
  *   "I know I have hands" is nonsense because, in normal circumstances, "I am wrong about having hands" has no clear sense.

  By showing that hinges are not items of knowledge, Wittgenstein isn't admitting we lack knowledge. He is saying that **knowledge is not the fundamental relation we have to the world.** Action is. We don't start with doubt and move to certainty; we start with certainty (action) and move to doubt (inquiry).

  ### Summary: The Mistake in Your Formulation
  The mistake in saying a hinge is an "ungrounded assumption" is that it treats the hinge as a **premise** in an argument.
  *   **Assumption:** "I assume P is true so I can derive Q." (P is still a proposition subject to truth values).
  *   **Hinge:** "I act as if P is the case, which allows me to distinguish true Qs from false Qs." (P is a rule of the game).

  The mistake in calling the system "irrational" is that it assumes rationality is a **super-standard** applicable to all systems.
  *   **Wittgenstein:** Rationality is a standard *within* a system. The system itself is neither rational nor irrational; it is simply *there*, like our life.

  Wittgenstein's goal in *On Certainty* is not to defend common sense against the skeptic by finding better foundations. It is to show that the skeptic's demand for foundations for the *whole* of our language-game is a grammatical illusion. We are not irrational for lacking grounds for our hinges; we are human for having hinges at all.
