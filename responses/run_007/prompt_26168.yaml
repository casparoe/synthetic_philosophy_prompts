answer: |-
  You have described a phenomenon with remarkable precision. The intuition you are grappling with sits at the intersection of the philosophy of language, social ontology, and aesthetics. While there is no single, universally settled term in literary criticism that captures this exactly, there are three strong candidates from adjacent fields that, when layered together, provide the vocabulary you need.

  The short answer is that your intuition about Wittgenstein is correct, but the specific concept of **"Constitutive Rules"** (from the philosophy of John Searle) may actually fit your description of the "game" better than "Hinge Propositions." However, the sociological term **"Doxa"** (from Pierre Bourdieu) best captures the *social* silence that occurs when these assumptions are challenged.

  Here is a breakdown of the available terminology, the nuances of the Wittgensteinian connection, and a proposal for how to demarcate this phenomenon in your own work.

  ### 1. The Wittgensteinian Connection: Pragmatic Hinges
  You are right to hesitate regarding "hinge propositions." In *On Certainty*, Wittgenstein is primarily concerned with epistemology (knowledge) and skepticism (e.g., "I cannot doubt that I have two hands"). However, later Wittgenstein scholars have expanded this to **"Pragmatic Hinges."**

  The distinction is this:
  *   **Epistemic Hinge:** "I cannot doubt the world exists, or I cannot know anything."
  *   **Pragmatic Hinge:** "I cannot doubt the rules of chess, or I cannot *play* chess."

  Your description ("not a move in the game we are playing") is explicitly Wittgensteinian. In *Philosophical Investigations*, Wittgenstein argues that meaning is use, and use is governed by rules that are not themselves up for debate *during* the use. If a novelist says, "Character desire does not matter," they are not making a counter-move; they are flipping the board.

  **Verdict:** You can use "Hinge," but you must qualify it as a **Pragmatic Hinge** or a **Hinge of Practice**. This distinguishes it from claims about truth and anchors it in claims about *activity*.

  ### 2. The Strongest Fit: Constitutive Rules
  The philosopher John Searle made a crucial distinction between two types of rules, which aligns perfectly with your "floor vs. furniture" metaphor.

  *   **Regulative Rules:** These regulate an activity that already exists. (Example: "Drive on the right side of the road." You can still drive if you break this, you're just doing it wrong or illegally.)
  *   **Constitutive Rules:** These *create* the possibility of the activity itself. (Example: "Checkmate ends the game." If you do not accept this rule, you are not playing chess; you are just moving wood on a board.)

  In your workshop scenario, "Show, don't tell" or "Characters must want something" function as **Constitutive Rules** of the specific language game being played (likely "Realist Craft Discourse"). If a participant rejects a constitutive rule, the activity (the workshop critique) becomes unintelligible because the shared definition of the object (the novel) has dissolved.

  **Verdict:** This is likely the most precise philosophical term. These beliefs are **Constitutive Norms** of the practice.

  ### 3. The Sociological Dimension: Doxa
  While Searle explains the *logic* of the rules, the French sociologist Pierre Bourdieu explains the *silence* that follows when they are challenged. Bourdieu used the term **Doxa** to describe the taken-for-granted beliefs in a field that are so fundamental they are not even seen as opinions.

  *   **Orthodoxy:** A stated belief you argue for.
  *   **Heterodoxy:** A stated belief you argue against.
  *   **Doxa:** The underlying assumption that makes the orthodoxy/heterodoxy distinction possible. It is the "natural order" of the field.

  When a workshop member says, "Why must a character want anything?", they are breaking the *doxa*. The conversation stalls not because the point is logically refuted, but because it violates the *habitus* (the ingrained habits and dispositions) of the group. It renders the speaker an outsider to the practice.

  **Verdict:** Use this if you want to emphasize the social pressure or the unspoken culture of the workshop.

  ### 4. Proposal: What to Call Them
  If you are writing about this for a craft book or an essay, you may find the philosophical terms too dense. If no settled term exists in literary theory (and "conventions" is too weak, as conventions can be broken for effect), I propose you adopt a synthesized term that honors your intuition.

  I recommend: **Constitutive Assumptions.**

  **Why this term works:**
  1.  **Constitutive:** Signals that these beliefs constitute the practice itself (Searle).
  2.  **Assumptions:** Signals that they are not necessarily "true" in an objective sense, but are taken as given (Bourdieu/Wittgenstein).

  Alternatively, if you wish to lean into the Wittgensteinian metaphor you already like: **Pragmatic Hinges.**

  ### 5. Demarcating the Boundaries
  To ensure this term is useful, you must distinguish these from mere "conventions" or "tropes." Here is how you can demarcate the boundaries of the phenomenon:

  **A. The Intelligibility Test**
  *   **Convention:** If you break it, the work is unconventional. (e.g., Using no punctuation.)
  *   **Constitutive Assumption:** If you break it, the *critique* becomes unintelligible. (e.g., If you claim the text has no narrator, the workshop cannot discuss "narrative voice.")
  *   *Boundary:* Does the challenge stop the conversation, or just complicate it?

  **B. The Scope of Validity**
  *   **Convention:** Local to a genre or period. (e.g., "A mystery must have a crime.")
  *   **Constitutive Assumption:** Local to the *discourse* about the art. (e.g., "A story must communicate human experience.")
  *   *Boundary:* Are we talking about the book, or about the rules for talking about the book?

  **C. The Possibility of Revision**
  *   **Convention:** Can be subverted intentionally for artistic effect.
  *   **Constitutive Assumption:** Can only be changed by shifting the entire paradigm of the practice (e.g., moving from Realism to Language Poetry).
  *   *Boundary:* Can you do this *within* the novel, or do you have to leave the genre/discourse entirely?

  ### Summary for Your Usage
  You are describing **Constitutive Assumptions** (or **Pragmatic Hinges**).

  They differ from Wittgenstein's original "hinge propositions" in that they are not conditions for *knowledge*, but conditions for *participation*. They differ from "conventions" in that they cannot be subverted without ending the practice itself.

  In your writing, you might frame it this way:
  > *"We treat certain craft principles not as hypotheses to be tested, but as constitutive assumptions. They are the floor on which the furniture of disagreement rests. To challenge them is not to make a counter-argument, but to step outside the language game of craft entirely."*

  This preserves the nuance you identified: that these are not sacred truths, but functional necessities for the specific social activity of the workshop.
