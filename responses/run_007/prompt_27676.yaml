answer: |-
  # Session Plan: The Mini-Font Factory

  **Course:** Concepts, Categories, and Creativity (Upper-Level Undergraduate)
  **Topic:** Categorical Identity vs. Stylistic Variation (The Letter Spirit Problem)
  **Time:** 75 Minutes
  **Students:** 14 (Working in 7 Pairs)

  ## I. Learning Objectives
  By the end of this session, students will have implicitly grappled with the following distinctions, ready for explicit naming in the debrief:
  1.  **Feature vs. Role:** Recognizing that a letter is not defined by a checklist of strokes (e.g., "must have a closed loop") but by the functional role those strokes play within a system.
  2.  **Local vs. Systemic:** Understanding that the identity of a single glyph ('a') depends on the design of its neighbors ('d', 'o') within the same stylistic system.
  3.  **Constraint Satisfaction:** Experiencing identity as a set of constraints that can be satisfied in multiple ways, rather than a single geometric template.

  ## II. Materials
  *   **Grid Pads:** 7 pads of 10x10 grid paper (large grids, approx. 1cm squares).
  *   **Markers:** Thick black felt-tip pens (one per pair). *Constraint: No pencils or fine liners.* This prevents "cheating" with detail and forces structural decisions.
  *   **Style Deck:** 7 cards, each describing a "Style Law."
  *   **Crisis Deck:** 7 cards, each describing a "System Failure."
  *   **Timer:** Projected on screen.
  *   **Tape/Blu-Tack:** To post results on the wall.
  *   **Voting Stickers:** Two colors (e.g., Green for "Reads as 'a'", Red for "Broken").

  ## III. Timeline & Activity Flow

  ### 0:00 – 0:05 | Setup & Grouping
  *   **Action:** Divide class into 7 pairs. Distribute one Grid Pad and one Marker per pair.
  *   **Instruction:** "You are a design team. Your product is not art; it is a functional alphabet. You have 70 minutes to solve three design problems. Do not ask me if a shape is 'correct.' Ask your neighbors if it is *readable*."
  *   **Constraint:** "You must use the grid. Each letter must occupy exactly one 5x5 square. No fine details."

  ### 0:05 – 0:20 | Round 1: The Baseline (Identity without Style)
  *   **Task:** Draw three letters in three separate 5x5 grids: **a**, **d**, **o**.
  *   **Rule:** Make them as standard as possible.
  *   **Twist:** After 5 minutes, pairs swap their 'a' with the pair to their left.
  *   **Check:** The receiving pair must write a word using the received 'a' (e.g., "cat"). If they hesitate, the 'a' is returned for repair.
  *   **Purpose:** Establishes the "default" category boundary. Usually, this converges quickly on a standard single-story or double-story 'a'.

  ### 0:20 – 0:40 | Round 2: The Style Law (Systemic Pressure)
  *   **Task:** Redraw the set (**a, d, o**) on a fresh grid sheet.
  *   **Constraint:** Each pair draws one **Style Law Card** from the deck. They must apply this law to *all three* letters simultaneously.
      *   *Sample Laws:*
          *   "No Curves Allowed" (Everything must be straight lines).
          *   "No Vertical Lines" (Everything must be slanted or horizontal).
          *   "Minimum Ink" (Use the fewest grid segments possible).
          *   "Closed Containers Only" (Every letter must have a fully enclosed space).
          *   "Symmetry" (Every letter must be vertically symmetrical).
  *   **Conflict:** Some laws make standard letterforms impossible (e.g., "No Curves" breaks a round 'o'; "Symmetry" breaks a standard 'd'). Students must deform the letters to satisfy the Law while keeping them distinguishable from each other.
  *   **Payoff:** 10 points if the instructor can identify all three letters instantly. 0 points if any letter is ambiguous.

  ### 0:40 – 0:55 | Round 3: The Crisis (Pushing the Boundary)
  *   **Task:** Keep your Round 2 style. Draw a *new* version of **'a'**.
  *   **Constraint:** Draw one **Crisis Card**. This card forces a specific deformation that threatens the letter's identity.
      *   *Sample Crises:*
          *   "Remove the Stem" (The vertical or rising part of the 'a' must go).
          *   "Open the Bowl" (The enclosed space must be broken).
          *   "Merge with Neighbor" (The 'a' must share a stroke with an imaginary 'd' next to it).
  *   **The Trade-off:** Students must decide what to sacrifice to keep the letter readable. Does an 'a' without a stem look like an 'o'? Does an 'a' with an open bowl look like a 'u'?
  *   **Gallery Walk:** Pairs tape their Round 3 'a' to the wall. The rest of the class circulates with Voting Stickers.
      *   **Green:** "I read this as 'a' immediately."
      *   **Red:** "This looks like 'o', 'd', or nonsense."
  *   **Scoring:** Pairs get 5 points for every Green sticker. They lose 5 points for every Red sticker.

  ### 0:55 – 1:15 | Debrief: Mapping the Experience
  *   **Phase 1: The Data (5 mins)**
      *   Look at the wall. Identify the 'a's with the most Red stickers.
      *   Ask the creators: "What rule were you trying to follow?"
      *   Ask the voters: "Why did you reject it? What feature was missing?"
  *   **Phase 2: The Systemic Insight (10 mins)**
      *   Point to a pair where the 'o' is a square (due to "No Curves" law). Ask: "Because the 'o' is a square, could you make the 'a' rounder than you otherwise might?"
      *   *Goal:* Elicit the realization that 'a'-ness is **contrastive**. An 'a' is an 'a' because it is *not* the 'o' or 'd' in the same system.
  *   **Phase 3: Naming the Theory (5 mins)**
      *   Now, and only now, introduce the forbidden phrases.
      *   **"Letter Spirit":** Explain that this project (Hofstadter et al.) argues that recognizing a letter isn't matching a template. It's perceiving the "spirit"—the underlying rules and roles that generated the shape.
      *   **"Roles and Pressures":** The "Style Law" was the pressure. The "Crisis" tested the roles (e.g., the 'a' needs a 'bowl' role and a 'stem' role, but the geometry of those roles can change).
      *   **"Essence of a Letterform":** Conclude that the essence is not a shape, but a **set of satisfiable constraints**.

  ## IV. Rules & Payoff Structure
  *   **Currency:** "Legibility Points" (LP).
  *   **Winning:** The pair with the most LP at the end chooses the reading for the next seminar.
  *   **Adjudication:**
      *   Round 1: Peer adjudication (Swap test).
      *   Round 2: Instructor adjudication (Instant recognition test).
      *   Round 3: Class adjudication (Voting stickers).
  *   **Prohibited Moves:**
      *   Using the marker outside the 5x5 grid.
      *   Writing labels (e.g., writing "this is an a" next to the glyph).
      *   Using pencil or erasing (decisions must be committed).

  ## V. Predicted Failure Modes & Mitigations

  | Failure Mode | Prediction | Mitigation / Turn-to-Advantage |
  | :--- | :--- | :--- |
  | **Convergence on Prototype** | In Round 1, everyone draws the exact same 'a'. They refuse to deform it in Round 2. | **Intervention:** In Round 2, announce a "Ban." If more than 3 pairs submit a standard double-story 'a', all LP for that round are halved. Force divergence. |
  | **Artistic Drift** | Students focus on making the font "beautiful" rather than readable/distinct. | **Rule:** Remind them: "You are designing for a license plate at 60mph, not a wedding invitation." Thick markers help enforce this brutality. |
  | **The 'o' Collapse** | Under "No Curves," 'a' and 'o' become identical (e.g., both become squares). | **Debrief Material:** This is the gold mine. Use this to show that without systemic differentiation, identity collapses. The 'a' lost because the 'o' encroached on its role. |
  | **Time Overrun** | Drawing on grids takes longer than expected. | **Hard Stop:** At 0:40, yell "Pens Down." Collect Round 2 sheets even if unfinished. Unfinished work counts as 0 LP. This adds pressure similar to real-time recognition. |
  | **Scoring Distrust** | Students argue about whether a Red sticker was fair. | **Rule:** "The voter's eye is the final court." This reinforces the philosophical point: categories are in the perceiver as much as the object. |

  ## VI. Limitations & Instructor Burden

  **What this activity cannot reproduce:**
  1.  **The Computational Claim:** The *Letter Spirit* project is fundamentally a claim about AI and cognitive modeling—that a program could be written to *automate* this style transfer by understanding the "roles" (e.g., "this stroke is a stem") rather than just pixels. This activity relies on human intuition to fill that gap. Students will use their own pre-existing cognitive machinery to solve the problem; they will not see *how* a machine might fail to do so.
  2.  **The "Spirit" as Generator:** In the actual project, the "spirit" is the generative code. In this class, the "spirit" is the students' implicit knowledge.

  **What you must supply in the debrief:**
  *   **The Explication Gap:** You must explain that while *they* could intuitively bend the rules, a computer sees only coordinates. The philosophical heavy lifting is explaining how we would *tell a computer* what a "stem" or a "bowl" is without just showing it pictures of stems and bowls.
  *   **The Homunculus Warning:** Be careful not to imply that there is a "little man" inside the head deciding these roles. The "roles" are emergent properties of the cognitive system, not explicit tags.
  *   **Connection to Broader Categories:** Briefly hint that this applies beyond letters. (e.g., "What makes a chair a chair? If I remove the legs [Crisis Card], is it still a chair? It depends on the 'style' of furniture around it.")

  ## VII. Instructor Script Snippets (For the Debrief)

  *   *On Roles:* "In Round 3, when you removed the stem from the 'a', some of you kept the 'bowl'. Others kept the 'tail'. You were arguing over which *role* is essential. Letter Spirit argues the essence is the relationship between the roles, not the roles themselves."
  *   *On System:* "Look at Pair 3's 'o'. It's a triangle. That allowed them to make their 'a' much rounder. If the 'o' had been a square, their 'a' would have been rejected as an 'o'. The 'a' is defined by the space the 'o' leaves open."
  *   *On The Name:* "We call this the **Letter Spirit** problem. Not because letters have souls, but because the 'spirit' is the invisible set of rules that holds the style together while the 'body' (the shape) changes."

  ## VIII. Preparation Checklist
  1.  **Print Grids:** 10x10 grids, bold lines.
  2.  **Write Cards:** 7 Style Laws, 7 Crisis Cards (laminate if possible).
  3.  **Test Markers:** Ensure they are thick enough to obscure fine detail.
  4.  **Wall Space:** Clear a section of the wall for the Round 3 Gallery.
  5.  **Timer:** Set visible countdown timer.
