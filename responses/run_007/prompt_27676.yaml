      *   *The Problem:* An 'a' can look like $a, \alpha, \mathfrak{a}, a$. An 'o' can look like $o, \circ, \mathfrak{o}$. Sometimes an 'a' looks more like an 'o' (single story) or a 'd' (reversed).
      *   *The Insight:* Identity isn't pixel-perfect matching. It's about structural relationships (bowl, stem, apex, counter) and how those relationships transform *together* under a style.
      *   *The Activity Need:* Students need to manipulate forms where changing one thing forces changes elsewhere to maintain "style," or where maintaining "identity" requires breaking "style."

