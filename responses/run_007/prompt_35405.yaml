      *   **Goal:** Help the user achieve consistency in their view.

  2.  **Analyze the Six Claims:**
      *   (1) *Act-Consequentialism (AC):* Rightness = actual best consequences. (Objective criterion).
      *   (2) *Cluelessness:* We can't know long-run consequences; unknowns swamp knowns. (Epistemic limitation).
      *   (3) *Anti-Paralysis:* We *do* have knowable obligations. (Moral phenomenology/practicality).
      *   (4) *Expectabilism:* Evaluate by *expected* consequences (subjective/proxy criterion). (Response to 2 & 3).
      *   (5) *Knightian Uncertainty:* Often we can't assign probabilities (imprecise credences). (Challenge to 4).
      *   (6) *Maximin:* Under Knightian uncertainty, use maximin (worst-case scenario). (Decision rule).

  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (1) vs. (4).**
          *   (1) says rightness depends on *actual* consequences.
          *   (4) says we should evaluate based on *expected* consequences.
          *   *Analysis:* This is the classic Objective vs. Subjective consequentialism debate. If (1) is the *criterion of rightness*, then (4) is a *decision procedure* or a revision of the criterion. If (4) is meant to replace (1) as the criterion, they contradict. If (4) is just a proxy for (1), does it work?
          *   *Severity:* High. It strikes at the definition of the theory.

      *   **Tension B: (4) vs. (5) & (6).**
          *   (4) advocates Expectabilism (maximize expected value).
          *   (5) says we often lack probabilities needed for Expectabilism.
          *   (6) says use Maximin in those cases.
          *   *Analysis:* If you switch to Maximin in some cases, you are no longer a pure Expectabilist. You have a hybrid view. Is this consistent? Yes, as a decision rule, but it complicates (4).
          *   *Severity:* Medium. It's a modification of the decision rule, not necessarily the core theory, but it undermines the universality of (4).

      *   **Tension C: (1) & (2) vs. (3).**
          *   (1) Rightness = Actual Consequences.
          *   (2) We can't know Actual Consequences (Cluelessness).
          *   (3) We *can* know what we ought to do.
          *   *Analysis:* If rightness is defined by (1), and (2) is true, then (3) seems false (we can't know rightness). To save (3), you usually need to change (1) to a subjective criterion (like 4).
          *   *Severity:* High. This is the core motivation for moving from (1) to (4).

      *   **Tension D: (6) vs. (1) (Consequentialist Spirit).**
          *   (1) is Consequentialist (maximize good).
          *   (6) is Maximin (avoid worst bad).
          *   *Analysis:* Maximin is often associated with deontology or Rawlsian justice, not standard consequentialism. A strict consequentialist might argue that even under uncertainty, you should estimate the *expected* value, perhaps using imprecise probabilities, rather than abandoning the aggregation of value for a focus on the floor. Maximin can lead to ignoring huge gains for small safety margins, which might violate the "maximize good" spirit of (1).
          *   *Severity:* Medium-High. It risks abandoning consequentialism for a different decision theory under uncertainty.

      *   **Tension E: (2) vs. (4).**
          *   (2) says unknowns *swamp* knowns.
          *   (4) says calculate expected value based on foreseeable evidence.
          *   *Analysis:* If the unknown long-term effects *swamp* the known short-term effects (as 2 claims), then the expected value calculation based on *foreseeable* evidence is systematically biased or unreliable. Expectabilism assumes the foreseeable is a good proxy for the actual. Cluelessness argues it isn't.
          *   *Severity:* Very High. This is the "Cluelessness Objection to Expectabilism." If the tail risks are massive and unquantifiable, expected value is undefined or misleading.

  4.  **Drafting the Audit (Iterative Refinement):**

      *   *Structure:* Introduction -> Tension Analysis (Genuine/Apparent, Severity, Resolution) -> Keystone Revision -> Conclusion.
      *   *Refining Tension 1 (1 vs 4):* This is the Objective/Subjective divide. If (1) is the *criterion*, (4) is a *guide*. But if (1) is the criterion, (3) is hard to defend given (2). So (1) likely needs to go or be reinterpreted.
      *   *Refining Tension 2 (2 vs 4):* This is the crux of the Cluelessness problem. Lenman's argument. If consequences are unknowable, expected utility is often zero or undefined because the probability distribution over the "swamping" variables is flat or unknown. (5) acknowledges this but (4) tries to push through anyway.
      *   *Refining Tension 3 (4 vs 6):* Expectabilism *is* maximizing expected utility. Maximin is a different rule. You can't hold both as *the* rule. You need a meta-rule (if probabilities known, use EV; if not, use Maximin). This makes the view a hybrid.
      *   *Refining Tension 4 (6 vs 1):* Maximin is risk-averse. Consequentialism is usually risk-neutral (in terms of value). Maximin might forbid an action with 99% chance of saving a million lives because there's a 1% chance of a minor bad outcome, if the alternative has a guaranteed minor good. Wait, Maximin looks at the *worst case*. If the worst case of saving a million lives is "nothing happens," and the worst case of the alternative is "one person dies," Maximin chooses the alternative. This violates the "maximize good" imperative of (1).

  5.  **Selecting the "Keystone" Revision:**
      *   The root conflict is between the definition of rightness (1) and the epistemic reality (2) combined with the desire for action-guidance (3).
      *   Most philosophers resolve this by rejecting (1) as the *action-guiding* criterion, replacing it with a subjective criterion (Expected Consequentialism).
      *   However, the user's (5) and (6) suggest Expected Consequentialism fails under Knightian uncertainty.
      *   The biggest tension is actually between (2) and (4). If (2) is true (swamping), (4) doesn't work.
      *   *Best fix:* Modify (2) or Modify (4)/(6).
      *   Actually, the most coherent fix is to distinguish between the *Criterion of Rightness* and the *Decision Procedure*.
      *   *Wait, looking closer at (6):* Adopting Maximin is a significant departure from consequentialism. It introduces a deontological constraint (do not risk the worst outcome).
      *   *Keystone:* The definition of Rightness (1). If you change (1) to "Rightness is acting in accordance with the best available decision rule given epistemic constraints," you solve the 1-vs-4 and 1-vs-6 tensions. But you still have the 2-vs-4 tension.
      *   *Alternative Keystone:* Reject the severity of (2). Many consequentialists argue cluelessness cancels out (positive and negative unknowns balance). If the user accepts this, (4) works fine. But the user says (2) is "genuine and severe." I must respect their premises.
      *   *Better Keystone:* Abandon pure Expectabilism (4) for a more robust decision theory under uncertainty (like Imprecise Probabilities + Alpha-Maximin), and clarify that (1) is the *ideal* but not the *practical* criterion.
      *   *Actually, the clearest conflict is (1) vs (4)/(6).* (1) defines rightness by *actual* outcomes. (4)/(6) define choice by *expectations/rules*. If you follow (6) and get a bad actual outcome, (1) says you did wrong. (3) says you did right (knowable obligation). This is a direct contradiction.
      *   *Resolution:* Change (1) to Subjective Consequentialism.

  6.  **Finalizing the Tensions for the Output:**
      *   **Tension 1: Objective vs. Subjective Rightness (1 vs. 3 & 4).** (Genuine, Severe).
      *   **Tension 2: Cluelessness vs. Expectabilism (2 vs. 4).** (Genuine, Very Severe). This is the Lenman objection.
      *   **Tension 3: Expectabilism vs. Maximin (4 vs. 6).** (Genuine, Moderate). Hybrid view needs justification.
      *   **Tension 4: Maximin vs. Consequentialist Core (6 vs. 1).** (Genuine, High). Maximin is not maximizing the good.

  7.  **Ranking:**
      1.  Cluelessness vs. Expectabilism (2 vs 4). If 2 is true, 4 fails mathematically/conceptually.
      2.  Objective vs. Subjective (1 vs 3/4). Defines the theory.
      3.  Maximin vs. Consequentialism (6 vs 1). Threatens the label "consequentialist."
      4.  Expectabilism vs. Maximin (4 vs 6). Internal consistency of decision rule.

  8.  **Formulating the Keystone Revision:**
      *   The user wants to remain consequentialist.
      *   The problem is (2) makes (1) useless and (4) unreliable.
      *   The solution is likely to soften (2) (cluelessness cancels out) OR harden (4)/(6) into a specific "Decision-Theoretic Consequentialism" that abandons (1) as the *moral* criterion for agents.
      *   *Most efficient fix:* Revise (1). Distinguish "Objective Rightness" (actual) from "Subjective Rightness" (rational choice). Commit to Subjective Rightness as the action-guiding norm. Then, address the 2-vs-4 tension by adopting *Imprecise Probabilities* rather than jumping straight to Maximin (which is too conservative). Or, accept that (2) needs nuance (symmetry of ignorance).
      *   *Wait, the prompt asks to identify tensions and revisions.* I should recommend revising (1) to accommodate (4)/(6) as the *criterion* for moral praise/blame, and revising (4)/(6) to be a unified decision rule (e.g., "Maximize Expected Choice-Worthiness" where choice-worthiness handles uncertainty).
      *   *Actually, the strongest keystone is revising (2).* If the user accepts the "Cancelling Out" argument (Greaves, etc.), then (4) works without needing (6). This preserves standard Consequentialism. But if they insist (2) is severe, they must abandon (1).
      *   *Let's assume the user wants to keep (2) as is.* Then (1) must go.
      *   *Keystone:* Replace (1) with a Subjective Criterion. This resolves the paralysis (3) and allows (4)/(6) to be the metric of rightness.
      *   *Second Keystone:* Unify (4) and (6). You can't switch rules arbitrarily. Use a decision rule that handles Knightian uncertainty (like Imprecise Credences) rather than bifurcating into EV vs Maximin.

  9.  **Review against Constraints:**
      *   Audit the 6 claims.
      *   Identify tensions (Genuine/Apparent).
      *   Rank severity.
      *   Explain revisions.
      *   Flag keystone revisions.

      *(Self-Correction during drafting)*: Make sure to clearly distinguish between *Criterion of Rightness* (what makes an act right) and *Decision Procedure* (how to choose). Claim (1) is a Criterion. Claim (4) sounds like a Criterion ("evaluate actions...") but acts like a Procedure. Claim (6) is a Decision Rule. This category confusion is a source of tension.

      *Refining the 2 vs 4 tension:* This is the "Cluelessness Objection." If I don't know the long-term effects, my expected value calculation is based on a truncated timeline. If the truncated timeline is not representative, EV is wrong. Lenman argues it's not representative. Greaves argues it is (symmetry). If the user holds (2), they must reject standard Expectabilism (4). So (4) needs revision to (4*): "Evaluate based on expected consequences *where probabilities are definable*, otherwise..." which leads to (6). But (6) is non-consequentialist.
