prompt: |-
  I've been turning something over in my mind for a while now and I can't quite get it to settle. I'm hoping you can help me think it through.

  A couple of years ago, my mother signed an advance directive. It says that if she develops severe dementia and reaches a point where she refuses food, she does not want a feeding tube inserted — even if, at that future time, she seems content and says she wants to live. The document is legally binding: her past self gets the final say, not her future self, even though the future self is the one who would actually have to live or die with the decision.

  Around the same time, a close friend went through a severe manic episode. He insisted he was fine, refused treatment, and made a series of choices that were clearly destructive. He was hospitalized involuntarily and medicated against his will. Later, once he stabilized, he said the doctors had done the right thing — that his "manic self" wasn't really him, or at least wasn't the him whose judgment should count.

  These two situations feel like mirror images of each other, and I can't figure out whether the law is being consistent. In my mother's case, we privilege an earlier self over a later one. In my friend's case, we privilege a later, recovered self over an earlier, impaired one — or maybe we privilege some idea of the "real" person over the person who is actually there in the moment. What picture of the self — of what makes someone the same person across time, and of which moments in a person's life get to speak for the whole — do these two practices jointly rely on? Are they relying on the same picture, or are they quietly depending on incompatible ones?

  I'd like you to work through this as a philosopher would. Before settling on an answer, take some time to map out the possible positions: the different ways one could think about what makes a person the same over time and which version of a person has decision-making authority. Then reason through which of those positions the two practices actually commit us to.

  Specifically:

  1. Lay out what theory of the self and of decision-making authority would make both practices hang together coherently. If they can't be made fully coherent, say where the fault line is.
  2. Distinguish what the practices strictly require from what they merely happen to fit with — where could you swap in a different underlying theory and still get the same practical rules?
  3. Suppose we adopted a view on which only a person's present, here-and-now preferences carry weight — no special standing for past decisions or for some notion of a "true" self. What would have to change in each practice?

  At the very end, give me a one-sentence summary of your conclusion, formatted like this:

  \answer{Your one-sentence summary here.}
