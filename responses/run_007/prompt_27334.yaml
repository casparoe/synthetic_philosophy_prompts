answer: |-
  This is a profound question that cuts to the heart of bioethics and the metaphysics of personal identity. You have identified what philosophers call the problem of **diachronic autonomy**: how the right to self-governance persists, shifts, or dissolves as a person changes over time.

  To answer this, we must disentangle three distinct philosophical layers: the metaphysics of identity (are they the same person?), the theory of welfare (what is good for them?), and the theory of authority (who decides?).

  ### 1. Mapping the Positions and Finding Coherence

  To see if these practices hang together, we must look for a theory that justifies overriding a person's *current* expressed wishes in both scenarios. There are three primary candidates for how we might view the self across time:

  *   **The Narrative Self:** You are the same person as long as your life forms a coherent story. Disruptions (like mania or dementia) are plot breaks.
  *   **The Psychological Continuity Self:** You are the same person as long as there is a chain of memories and psychological traits. Dementia severs this chain; mania distorts it but leaves it intact.
  *   **The Capacitated Self (The Hierarchical Model):** Personhood is not a binary switch but a status of authority. Authority belongs to the "governing self" (rational, reflective, value-consistent) rather than the "experiencing self" (impulsive, sensation-driven, cognitively impaired).

  **The Coherent Theory: Critical Interests and Precedent Autonomy**
  The legal and ethical practices you describe are most coherently united under the **Capacitated Self** model, specifically utilizing Ronald Dworkin's distinction between **experiential interests** and **critical interests**.

  *   **Experiential interests** are about feeling good in the moment (e.g., the demented mother's desire to eat; the manic friend's desire for freedom).
  *   **Critical interests** are about the value of a life as a whole (e.g., the mother's value of dignity and avoiding prolonged decline; the friend's value of health and stability).

  Under this view, the law does not privilege the "past" over the "future" simply because of chronology. It privileges **competence** over **incapacity**.

  *   **In your mother's case:** Her past self was competent. Her current self (severe dementia) is deemed incompetent to weigh critical interests, even if she can express experiential desires. The Advance Directive is an exercise of **precedent autonomy**. The law assumes her critical interests (defined when competent) outweigh her current experiential interests.
  *   **In your friend's case:** His manic self is deemed incompetent (distorted reality, impulsivity). His recovered self is competent. The involuntary treatment protects his critical interests (health/life) against his manic experiential interests (freedom/delusion). The retrospective agreement confirms that the "governing self" was temporarily offline.

  **The Fault Line**
  The coherence holds only if we accept that **capacity is the locus of authority, not time.** However, there is a fragile fault line: **Irreversibility.**
  In the dementia case, we assume the competent self is gone forever; the past self is the *last* competent authority. In the mania case, we assume the competent self is merely suppressed and will return; the future self is the *restored* authority. If dementia were reversible, the logic might demand we wait for the recovered self (as with mania). If mania were permanent, the logic might demand we respect the manic self's new baseline (as we arguably do with some permanent disabilities). The practices are consistent only because we categorize dementia as a *loss* of the true self and mania as a *temporary distortion* of it.

  ### 2. Strict Requirements vs. Theoretical Fits

  It is crucial to distinguish what these practices *logically require* versus what theories merely *fit* them comfortably.

  **What is Strictly Required:**
  Both practices strictly require a **threshold of capacity**. There must be a legal and ethical mechanism to declare a specific temporal stage of a person "incapacitated" regarding specific decisions. Without a finding of incapacity, neither the Advance Directive (which activates upon incapacity) nor the involuntary hold (which requires danger + incapacity) is permissible. Therefore, the only non-negotiable commitment is that **authority tracks capacity, not mere existence.**

  **What Merely Fits (Swap-in Theories):**
  *   **Metaphysical Identity:** You do not need to believe the demented mother is a "different person" from her past self for the AD to work. You only need to believe she lacks *authority*. A Lockean (psychological continuity) theorist and a Biological (animalist) theorist can both support the AD, provided they agree on the capacity threshold.
  *   **The "True Self":** The practices do not strictly require a mystical "true self." They require only a **procedural** definition of competence (e.g., ability to understand, appreciate, reason, and express a choice). The friend's claim that the manic self "wasn't really him" is a comforting narrative, but the legal intervention relied on his inability to understand the consequences of his actions, not on a metaphysical judgment about his soul.

  **Where the Swap Fails:**
  You cannot swap in a theory that equates **authenticity with immediacy**. If you believe that the only authentic expression of the self is the one occurring in the present moment (a strict "current time-slice" theory), both practices collapse. But any theory that allows for **second-order volitions** (the ability to reflect on and endorse/deny one's own desires) can support these practices. In both cases, we are prioritizing the self that *reflects* over the self that *reacts*.

  ### 3. The Presentist Challenge

  Suppose we adopted the view you proposed: **Presentism**. On this view, only the preferences of the person-as-they-exist-right-now carry moral weight. Past promises bind only as long as the present self endorses them; future hypothetical preferences have no claim on the present.

  **Changes to the Mother's Case (Dementia):**
  *   **The Advance Directive becomes void.** If the demented mother says, "I want to live," and appears content, her present autonomy is absolute.
  *   **Outcome:** We would be obligated to insert the feeding tube if she refused food (to preserve her present life) or, more likely, if she expresses a desire to eat, we feed her. If she refuses food but lacks capacity to understand death, a Presentist view creates a paradox: we cannot honor the past wish (AD) because that self is gone, but we cannot honor the current wish (refusal) if it stems from incapacity.
  *   **Resolution:** Under strict Presentism, we would likely default to **best interests paternalism** based solely on current welfare. If she seems happy eating, we feed her. The past self's dignity concerns are irrelevant because that person no longer exists.

  **Changes to the Friend's Case (Mania):**
  *   **Involuntary Commitment becomes unethical.** If the manic friend says, "I am not sick, do not medicate me," that is his current authentic preference.
  *   **Outcome:** Doctors could not hospitalize him unless he posed an immediate physical threat to others (harm principle), but they could not do so for his *own* good.
  *   **Resolution:** We would have to watch him destroy his life, finances, and health, respecting his current agency. The "recovered self's" gratitude would be irrelevant; the violation occurred at $T_1$, and a later apology does not undo the rights violation of the present self.

  **The Cost of Presentism:**
  Adopting this view maximizes liberty for the impaired but sacrifices **integrity across a lifetime.** It treats a human life as a series of unrelated tenants rather than a single ownership. It protects the demented mother from the "tyranny of the past," but it also abandons the manic friend to the "tyranny of the impulse."

  ### Conclusion

  The two practices are not mirror images of inconsistency; they are twin pillars of a single structure. They both rely on a **Hierarchical Theory of Autonomy**, which posits that the "self" with decision-making authority is not the one who is merely conscious, but the one who is capable of rational reflection and valuing.

  In the dementia case, that rational self resides in the past (via the directive). In the mania case, that rational self resides in the future (via recovery) or is understood as the underlying baseline. The law is consistent because it is not tracking *time*; it is tracking *capacity*. It assumes that a life has a shape that the competent self is authorized to design, and that shape should not be distorted by periods of incapacity, whether those periods are permanent (dementia) or temporary (mania). The tension you feel arises not from legal inconsistency, but from the painful reality that respecting the "author" of a life sometimes requires silencing the "character" currently living it.

  \answer{Both practices rely on a capacity-based theory of authority that privileges the rational, competent self's critical interests over the incapacitated self's immediate desires, regardless of whether that competent self exists in the past or the future.}
