              *   *Revised Rule:* Free players *must* roll for every decision. Contract players do not.
              *   *Actually, let's make it simpler for a 90 min session.*
              *   **The "Willpower Die"**: Free players roll a d6 every time they are offered a choice. 1-3 = Must take Red. 4-6 = Can choose. Contract players auto-choose Blue.
