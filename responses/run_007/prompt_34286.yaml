              *   *Free Player Logic:* "I need Silver for the Storm." So they take Silver even on Temptation rounds. But they take *too much* Silver because Temptation rounds are more common. They end up with a pile of Silver (low value) and no Gold.
              *   *Chained Player Logic:* "I can't take Silver." They accumulate Gold. When Storm hits, they pay the penalty (3 Gold).
              *   *Comparison:*
                  *   Scenario: 3 Temptations, 1 Storm.
                  *   Free (Weak): Takes 2 Silver x 3 = 6 Silver. Storm hits. Pays 2 Silver. Left: 4 Silver = 4 pts.
                  *   Chained: Takes 1 Gold x 3 = 3 Gold. Storm hits. Pays 3 Gold. Left: 0 Gold = 0 pts.
                  *   *This makes Chaining bad.*
              *   *Need to make Chaining generally better, but risky.*
              *   *Adjustment:* Storm cost for Chained is 1 Gold. Storm cost for Free is 2 Silver.
              *   *Free (Weak):* 3 Temp -> 6 Silver. 1 Storm -> -2 Silver. Net 4 Silver = 4 pts.
              *   *Chained:* 3 Temp -> 3 Gold. 1 Storm -> -1 Gold. Net 2 Gold = 10 pts.
