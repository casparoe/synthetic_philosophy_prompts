  # Game Design: The Ulysses Gambit

  **Time:** 90 Minutes (Play) + 30 Minutes (Debrief)
  **Players:** 12 (4 tables of 3–4 players)
  **Materials per Table:**
  *   1 Bowl of **Blue Chips** (Long-term Value).
  *   1 Bowl of **Red Chips** (Short-term Liquidity).
  *   1 Deck of 10 **Event Cards** (5 "Siren," 5 "Storm").
  *   1 Six-sided Die (d6).
  *   4 **Contract Slips** (small pieces of paper).
  *   1 **Score Sheet** per player.
  *   1 **Facilitator Cheat Sheet** (for you to circulate).

  ---

  ## Part 1: The Activity (90 Minutes)

  ### 1. Setup & Endowment (10 Minutes)
  *   **Seating:** Arrange tables of 3–4.
  *   **Introduction:** "Welcome. Today we are running a resource management simulation. You are captains of ships returning from a long voyage. Your goal is to maximize your **Legacy Score**."
  *   **Endowment:** Give each player **2 Blue Chips**.
  *   **Valuation:** Write on the whiteboard/screen:
      *   **Blue Chip:** Worth **10 Points** at the end of the game. *Cannot be spent during play except for specific penalties.*
      *   **Red Chip:** Worth **1 Point** at the end of the game. *Can be spent during play to mitigate losses.*
  *   **The Rule of Silence:** "During the decision phases, no talking about strategy is allowed. You may chat before or after rounds."

  ### 2. Phase One: The Constitutional Moment (10 Minutes)
  *   Explain that before the voyage begins, they may alter the rules of their own ship.
  *   **The Choice:** Each player privately decides whether to sign a **Ulysses Contract**.
      *   **If they sign:** They hand in **1 Blue Chip** immediately (Cost of Binding). They hand the Contract Slip to the Facilitator (or place it face-up).
          *   *Effect:* For the rest of the game, they are **forbidden** from taking Red Chips. If an offer of Red Chips arises, they *must* decline it or take the Blue alternative.
      *   **If they do not sign:** They keep their 2 Blue Chips.
          *   *Effect:* They are **Free Agents**. They may accept Red or Blue chips as they choose, but they are subject to "Passion Rolls" (see below).
  *   *Facilitator Note:* Collect the signed contracts so players cannot renege. This physical surrender is crucial.

  ### 3. Phase Two: The Voyage (5 Rounds, ~12 Minutes Each)
  *   **Role Rotation:** Each round, one player at the table acts as **Fate** (shuffles deck, draws card, reads it). Rotate this role clockwise each round.
  *   **The Mechanic:** Fate draws one Event Card and reveals it to the table. All players resolve the effect simultaneously.

      *   **Card Type A: The Siren (5 cards in deck)**
          *   *Text:* "A temptation arises. Gain **1 Blue** OR Gain **3 Red**."
          *   **For Contractors:** You *must* take **1 Blue**. (You are bound).
          *   **For Free Agents:** You must roll the d6.
              *   **Roll 1–3 (Overcome):** You *must* take **3 Red**. (Simulates loss of will).
              *   **Roll 4–6 (Resist):** You may choose **1 Blue** OR **3 Red**.
          *   *Strategic Tension:* Free Agents might *want* Red chips to survive Storms, but the die roll might force them to take Red even when they want Blue, or vice versa.

      *   **Card Type B: The Storm (5 cards in deck)**
          *   *Text:* "A crisis strikes. Pay a penalty to survive."
          *   **Penalty:** Lose **2 Red** OR Lose **1 Blue**.
          *   **Resolution:** Players choose which to pay.
          *   **Bankruptcy:** If you cannot pay the penalty (e.g., you have no Red and no Blue), your ship sinks. You score **0** for the game.
          *   *Strategic Tension:* Contractors *only* have Blue. They *must* pay 1 Blue. Free Agents likely hoarded Red; they pay 2 Red (cheaper in point value, preserves Blue).

  *   **Deck Management:** After each round, reshuffle the deck. (This ensures independent probability: 50% Siren, 50% Storm each round).
  *   **Tracking:** Players record their holdings on the Score Sheet after every round.

  ### 4. Phase Three: The Harbor (10 Minutes)
  *   **Final Tally:**
      *   Count remaining Blue Chips × 10.
      *   Count remaining Red Chips × 1.
      *   Add them for **Legacy Score**.
  *   **Table Discussion:** Ask each table to identify the highest and lowest scorer. Did the winner sign a contract? Did anyone go bankrupt?
  *   **Reveal:** Now, and only now, reveal the term **"Ulysses Contract"** and **"Precommitment."**

  ---

  ## Part 2: The Debrief (30 Minutes)

  *Facilitator Guide: Do not lecture. Ask questions. Let them generate the insights, then map them to the literature.*

  ### 1. The Phenomenology of Binding (5 Minutes)
  *   **Ask:** "For those who signed the contract: How did it feel in Round 3 when a Storm hit and you had to pay a Blue chip, knowing a Free Agent next to you paid Red?"
  *   **Ask:** "For Free Agents: How did it feel when the die forced you to take Red on a Siren round, even if you wanted Blue?"
  *   **Concept:** **First-Order vs. Second-Order Preferences.**
      *   *Explanation:* Your first-order preference in the moment (Round 3 Storm) was to keep your Blue. Your second-order preference (at the start) was to be the *kind of captain* who maximizes Blue accumulation. The contract allowed your Second-Order Self to constrain your First-Order Self.
      *   *Elster Connection:* Elster argues rationality isn't just maximizing utility in the moment; it's managing the *sequence* of preferences over time.

  ### 2. The Paradox of Freedom (10 Minutes)
  *   **Ask:** "Who scored higher on average? The Contractors or the Free Agents?" (Usually Contractors win, but with higher variance).
  *   **Ask:** "The Contractors paid a cost upfront (1 Blue) and surrendered choice. Why did they win?"
  *   **Concept:** **The Rationality of Irrationality.**
      *   *Explanation:* By making themselves "irrational" (unable to choose Red), they achieved a more rational outcome.
      *   *Schelling Connection:* Thomas Schelling's "Enlistment" games. You win by burning your bridges. If the enemy (your future self) knows you cannot retreat, they don't attack (temptation doesn't arise/is ignored).
      *   *Discussion:* Is it rational to restrict your own future freedom? Only if you distrust your future self's decision-making conditions (the "Hot" state simulated by the die roll).

  ### 3. The Constitutional Analogue (10 Minutes)
  *   **Ask:** "Imagine this table is not a person, but a Polity. The 'Start' is the Founding Moment. The 'Rounds' are future legislative sessions. The 'Storms' are emergencies."
  *   **Concept:** **Constitutional Precommitment.**
      *   *Holmes/Elster:* Why do constitutions make certain rights hard to amend (requiring supermajorities)?
      *   *Mapping:*
          *   **Blue Chips:** Fundamental Rights/Long-term Stability.
          *   **Red Chips:** Populist measures/Short-term expediency.
          *   **The Contract:** Entrenchment Clauses (e.g., Bill of Rights).
          *   **The Storm:** National Emergency.
      *   **The Tension:** A constitution binds the future majority. Sometimes this is good (protects minorities/Blue chips from being spent on populism/Red chips). Sometimes it is dangerous (rigidity during a genuine Storm where flexibility is needed).
      *   **Question for Elster Readers:** "Elster warns against 'binding the future' too tightly. Did anyone go bankrupt because they were *too* rigid? How do we distinguish a 'Storm' that requires flexibility from a 'Siren' that requires restraint?"

  ### 4. Limitations & Open Questions (5 Minutes)
  *   **Ask:** "What did this game leave out?"
  *   **Facilitator Input (The "Missing Features"):**
      1.  **Renegotiation:** In the game, the contract was ironclad. In reality, Ulysses could have begged his crew to let him go. Elster discusses the difficulty of *self-enforcing* constraints. If you hold the keys to your own chains, can you really be bound?
      2.  **Social Enforcement:** Ulysses didn't tie himself; his *crew* tied him. The game was solitary. Real precommitment often requires a third party (a court, a spouse, a constitution) to enforce the bind.
      3.  **Learning:** In the game, probabilities were fixed. In life, we learn. Sometimes binding yourself prevents you from learning that the temptation wasn't actually bad.

  ---

  ## Part 3: Facilitator Notes & Troubleshooting

  ### Predictable Failure Modes
  1.  **The "Gamer" Problem:** Some scientists will try to optimize the die roll.
      *   *Fix:* Be strict. "The die represents your psychological state, not a strategic variable. You must follow the result."
  2.  **The "Bankruptcy" Frustration:** If a Contractor hits 3 Storms in a row, they score 0. They may feel the game is "unfair."
      *   *Handling:* Use this in the debrief. "This is the risk of rigidity. Constitutions can break under too much stress. Was the risk worth the average gain?"
  3.  **Collusion:** Free Agents might trade chips.
      *   *Fix:* "No trading chips between players. This is a simulation of individual will, not a market."
  4.  **Elster Readers Dominating:** Those who know the theory might explain it to their table during play.
      *   *Fix:* In your opening, say: "If you have read on this topic, please treat today as a refresher. Let the others discover the tension. Save the theory for the debrief."

  ### What You Must Supply (The "Missing Features")
  The game cannot capture the **political legitimacy** of precommitment.
  *   In the game, you bind yourself.
  *   In a polity, the *Past* binds the *Future*.
  *   *Debrief Point:* Ask the group: "Is it democratic for a dead generation (the Founders) to bind the living generation (us) via a Constitution? In the game, you bound your future self. Is that the same moral relationship?" This bridges Elster's *Ulysses Unbound* to modern constitutional theory.

  ### Materials Checklist for You
  *   Print 12 Score Sheets.
  *   Print 4 Decks of Cards (index cards work fine: write "SIREN" on 5, "STORM" on 5).
  *   Gather ~50 Blue and ~100 Red tokens (poker chips, beads, or even distinct coins).
  *   Print 12 Contract Slips.

  ### Timing Guide
  *   **0:00–0:10:** Setup & Endowment.
  *   **0:10–0:20:** Contract Phase.
  *   **0:20–1:00:** 5 Rounds of Play (Watch the clock; keep turns moving).
  *   **1:00–1:10:** Scoring.
  *   **1:10–1:20:** Table Talk.
  *   **1:20–2:00:** Guided Debrief.

  This design respects their analytical nature (clear rules, math) while forcing an experiential encounter with the philosophical problem (the frustration of rigidity vs. the failure of will).
