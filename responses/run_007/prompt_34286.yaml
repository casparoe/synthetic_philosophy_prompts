              *   *Chained:* 3 Gold - 2 Gold = 1 Gold = 5 pts. (Still wins).
              *   *Risk:* If 3 Storms hit.
              *   *Free:* 6 - 6 = 0.
              *   *Chained:* 3 - 3 = 0.
              *   *Okay, Chaining is dominant.* We need a scenario where Chaining loses.
              *   *Scenario:* "The Rigidity Trap." A specific card where Silver is *required* to gain a bonus.
              *   *Let's step back.* The core philosophical point is that precommitment is rational *because* we know we are weak. If the players are rational scientists, they won't be weak in the game unless the mechanics force it.
              *   *Solution:* **The "Heat" Mechanic.**
              *   In Rounds 2-4, players roll a die. High roll = "High Heat." In High Heat, Free players *must* choose Silver (simulating loss of control). Chained players ignore the roll.
              *   *This simulates the emotional state.*

  6.  **Finalizing the Game Design:**
      *   **Name:** **The Ulysses Gambit**.
      *   **Components:** Token bowls (Blue/Gold, Red/Silver), Deck of Event Cards, "Contract" slips, Dice.
      *   **Setup:** 3-4 players per table. One acts as "Fate" (dealer) per round, rotating.
      *   **Currency:**
