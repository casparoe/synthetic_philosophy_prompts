                      *   Storms: Pay 2 Red.
                      *   If they get overcome on Sirens, they accumulate Red. This protects them on Storms.
                      *   But Red is low value.
                      *   If they get 3 Sirens (Overcome): 9 Red. 0 Storms. Score 9.
                      *   Contract on 3 Sirens: 1 + 3 = 4 Blue. Score 40.
                      *   *Contract wins big on low Storms.*
                      *   *Free wins on High Storms?*
                      *   If 3 Storms:
                          *   Free: Start 2 Blue. Need 6 Red to pay. Unlikely to get 6 Red. Will pay Blue. End 0.
                          *   Contract: Start 1 Blue. Pay 3 Blue. End 0.
                      *   *We need a case where Free wins.*
