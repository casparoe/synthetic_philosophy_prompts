      *   **Phase 1: The Dock (Precommitment).**
          *   Endowment: 2 Blue.
          *   Choice: Sign the Contract?
          *   **Contract:** Pay 1 Blue upfront. You are *physically unable* to take Red chips in future rounds. (Dealer will not offer them).
