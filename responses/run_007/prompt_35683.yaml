answer: |-
  It is a pleasure to engage with someone who understands the empirical machinery behind the philosophical abstractions. Your intuition is sharp: the stalemate you perceive is not due to a lack of neural data, but rather a divergence in metaphysical commitments regarding the nature of physical implementation. As a retired computational neuroscientist, you have likely operated under *methodological computationalism* (computation is the best tool for modeling), whereas the philosophical debate concerns *ontological computationalism* (computation is what the brain *is*).

  Here is an assessment of the landscape, structured as you requested.

  ### 1. Mapping the Strongest Positions

  To avoid the straw men that plague online discourse, we must look at the most rigorous contemporary formulations of both sides.

  **The Computationalist Position (Mechanistic Computationalism)**
  The strongest contemporary defense does not rely on the outdated "brain as a serial Turing machine" model (Classical Computationalism à la Fodor/Pylyshyn). Instead, it relies on **Mechanistic Computationalism**, championed by philosophers like Gualtiero Piccinini and Oron Shagrir.
  *   **The Claim:** Neural systems are physical mechanisms whose functional organization is defined by the manipulation of vehicles (signals) according to rules. Computation is not merely a description we project; it is a causal structure intrinsic to the mechanism.
  *   **The Defense against Triviality:** They concede Putnam's point that *any* physical system can be mapped to *some* computation (pancomputationalism). However, they argue that not all mappings are *explanatorily relevant*. A computation is real only if the physical states are individuated by their functional role within the mechanism's causal architecture. If the neural circuit's causal powers depend on the specific transformation of input states to output states (regardless of semantic content), it is literally computing.
  *   **Key Move:** They decouple computation from semantics. You don't need "meaning" (intentionality) for computation; you need causal sensitivity to the vehicle's properties. This bypasses Searle's Chinese Room by arguing the Room lacks the right *causal organization*, not just the right syntax.

  **The Anti-Computationalist Position (Observer-Relativity & Embodiment)**
  The strongest opposition comes from two distinct angles that often converge: The **Semantic Argument** (Searle) and the **Triviality/Dynamics Argument** (Putnam, van Gelder, Thompson).
  *   **The Claim (Searle):** Syntax is not sufficient for semantics, and syntax is not intrinsic to physics. Physics is defined by mass, charge, and spin. "Computation" requires an assignment of 0s and 1s (syntax), which is always observer-relative. Therefore, the brain cannot *intrinsically* be a computer; it is only a computer relative to an external interpreter.
  *   **The Claim (Embodied/Dynamic):** Cognition is not the manipulation of abstract symbols or signals; it is the regulation of sensorimotor coupling in real-time. The mathematical framework of differential equations (dynamical systems) captures neural activity better than discrete state transitions. To call this "computation" stretches the term until it loses explanatory power.
  *   **Key Move:** They argue that computational descriptions are *as-if* descriptions. Saying the brain computes is like saying the weather computes. It might be mathematically describable, but the causal story is told by physics and dynamics, not information processing.

  ### 2. Diagnosing the Disagreement

  You hypothesized that this is a conceptual dispute about what "computation" requires. **You are correct, but the diagnosis requires further granularity.**

  **It is not an empirical dispute.**
  No new fMRI data or connectome map will solve this. Both sides agree on the firing rates, the connectivity, and the input-output transformations. The disagreement is about **ontological commitment**.
  *   **Computationalists** view functional organization as a higher-level physical reality that supervenes on the physics. If the causal structure matches the definition of a mechanism processing information, the computation is real.
  *   **Anti-Computationalists** view physical reality as "bottoming out" at fundamental physics (quantum fields, particles). Anything above that (functions, rules, information) is a map we draw, not territory that exists.

  **It is a clash of "Bedrock" Intuitions about Causation.**
  The impasse persists because the two sides have different criteria for what counts as a causal explanation.
  *   For the computationalist, **functional causation** is real. The fact that a neuron fires *because* it summed inputs to a threshold is a computational explanation that is irreducible to mere physics.
  *   For the anti-computationalist, **physical causation** is the only real causation. The neuron fired because of ion gradients and electrochemical potentials. To say it fired "because it computed a sum" is a useful shorthand for humans, not a feature of the universe.

  **Are they answering different questions?**
  Yes.
  *   **Neuroscientists (and Computationalists)** ask: "What is the *functional logic* of this system?" (Level of Algorithm/Implementation).
  *   **Anti-Computationalists** ask: "What is the *ontological status* of that logic?" (Level of Metaphysics).
  The frustration you feel arises because the philosophical debate often impedes the scientific progress by demanding metaphysical certainty where methodological utility suffices.

  ### 3. What Could Break the Impasse?

  Honesty is required here: **Nothing currently on the horizon is likely to break this impasse.**

  *   **Sharper Definitions:** We already have them (e.g., Piccinini's mechanistic account). The anti-computationalists simply reject the premise that mechanistic functions are intrinsic.
  *   **New Experimental Paradigms:** Unlikely. Experiments reveal structure and dynamics. Whether those dynamics *constitute* computation or merely *admit a computational description* is not an experimental question.
  *   **Formal Results:** Unlikely. This is not a problem of logic or math; it is a problem of interpretation.

  **The Only Viable Path: Reframing the Question.**
  The debate might dissolve if we stop asking "Is the brain a computer?" and start asking: **"Under what constraints is the computational description causally explanatory?"**
  If a computational model allows us to intervene on the system successfully (e.g., deep brain stimulation based on circuit logic), then for all scientific intents and purposes, the computation is "real enough." This is a pragmatic dissolution of the problem, akin to how we treat "temperature" or "pressure" in thermodynamics. We don't ask if temperature is *intrinsically* real in the way an electron is; we ask if the concept tracks causal powers.

  However, if you demand a metaphysical verdict (is it *literally* a computer in the same way it is *literally* made of carbon?), the debate will remain frozen. It is a dispute between **Realists about Functional Kinds** vs. **Eliminativists/Reductionists about Functional Kinds**.

  ### 4. Settled vs. Contested

  As a philosopher in this domain, here is the honest breakdown of the consensus landscape. Do not let anyone tell you otherwise.

  **What is Genuinely Settled:**
  1.  **Pancomputationalism is trivial.** If *everything* computes (because everything can be mapped to a Turing machine), then saying "the brain computes" explains nothing. Both sides agree we need constraints on what counts as a physical implementation of computation.
  2.  **Simulation is not Duplication (usually).** Running a simulation of a storm on a computer does not make the computer wet. Most philosophers agree that simulating a mind is not necessarily instantiating a mind, unless one accepts strong Functionalism.
  3.  **Methodological Utility.** There is consensus that computational modeling is indispensable for neuroscience, regardless of the ontological status.
  4.  **Syntax is not Intrinsic to Physics.** Even many computationalists concede Searle's point that "0" and "1" are not physical properties like mass. The dispute is whether functional roles can ground the syntax without an external observer.

  **What Remains Contested (No Consensus):**
  1.  **Observer-Relativity.** Is computation intrinsic to the mechanism (Piccinini) or assigned by an observer (Searle)? This is the core deadlock.
  2.  **The Role of Semantics.** Does neural computation require content (representation)? Some say yes (Representational Theory of Mind), some say no (Non-semantic computationalism), some say the whole idea of neural representation is a mistake (Radical Enactivism).
  3.  **Connectionism vs. Classical Computation.** Is the brain performing discrete symbol manipulation, continuous vector transformation, or something else entirely? While neuroscientists lean toward continuous dynamics, whether those dynamics count as "computation" in the philosophical sense is still debated.
  4.  **Causal Efficacy.** Do computational properties have causal power, or is all causal power held by the underlying physics? (The problem of Causal Exclusion).

  ### Summary Assessment

  Your hypothesis is sound. The impasse is conceptual, rooted in a disagreement over whether functional descriptions carve nature at its joints or are merely pragmatic tools for observers.

  As a scientist, you are accustomed to **instrumental realism**: if the model predicts and controls, it captures something real. The philosophical debate is stuck because it demands **ontological realism**: is the "computation" there when no one is looking?

  My professional advice: Treat the philosophical claim "The brain is a computer" as a category error. The brain is a biological organ. "Computation" is a formal system we use to describe the causal logic of that organ. The debate freezes because one side reifies the description into an entity, and the other side attacks the reification. You can continue to model cortical columns without resolving this, provided you remain agnostic on whether the computation exists independently of your description of it. That is not a retreat; it is a recognition of the boundary between science and metaphysics.
