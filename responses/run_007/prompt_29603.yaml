prompt: |-
  I chair a university working group on food and animal-welfare policy that has spent the past year deadlocked over one concrete substitution: when our dining services replaces beef with chicken to cut the menu's carbon and land footprint, is that substitution an improvement or a worsening in expected welfare, all things considered? One camp — call them the beef-is-worse camp — holds that beef is worse per calorie served. Cattle are inefficient converters of feed into edible food and live for many months, so each serving of beef carries a much larger upstream cost in the cropland used to grow their feed, along with the harvest deaths of small wild animals and the habitat that cropland displaces; chicken, on this view, concentrates unavoidable animal harm into a smaller land and feed footprint per serving. The other camp — the chicken-is-worse camp — holds that replacing one steer with well over a hundred broiler chickens multiplies the number of sentient lives that must be created, confined, and killed, each under conditions likely net-negative by a wide margin, and that the wild-animal side of the ledger is too uncertain in sign to carry the decision, since habitat lost to cropland may reduce net suffering as easily as it reduces net flourishing.

  Write the joint statement this group should have produced after a good-faith adversarial collaboration. I want: (1) a numbered section of claims both camps can sign, including the empirical regularities each side is willing to stipulate (feed conversion, land use, animals per serving, broiler welfare, harvest deaths) and, where no magnitude can be stipulated, the direction both accept; (2) a disagreements table giving the residual disagreements, each camp's position phrased in wording that camp would accept as a fair statement of its own view; and (3) a list of cruxes — sub-questions such that settling one would move at least one side — with, for each crux, the concrete evidence or case both sides agree would bear on it and each side's prediction recorded in advance. Where a disagreement is partly verbal, such as one about the unit of comparison or about what counts as "expected welfare," say which part is verbal and supply the neutral wording that exposes it. I suspect the real cruxes include whether comparison should be per calorie, per serving, per animal-life, or per day of lived experience; how to weigh many short, very bad lives against fewer longer, less bad lives; whether marginal crop deaths scale with feed consumed or with total land area; and whether the lives of wild animals displaced by agriculture are on average worth living.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A university working group on food and animal-welfare policy has been deadlocked for a year over the beef-vs-chicken substitution question (carbon/land footprint vs. animal welfare).
      *   **Task:** Write the *joint statement* this group *should have produced* after a good-faith adversarial collaboration.
      *   **Required Components:**
          1.  **Numbered Section of Agreed Claims:** Empirical regularities both camps stipulate (feed conversion, land use, animals/serving, welfare, harvest deaths) and directions of uncertainty.
          2.  **Disagreements Table:** Residual disagreements, phrased fairly in each camp's own wording.
          3.  **List of Cruxes:** Sub-questions where settling one would move a side. Must include agreed evidence/cases, pre-recorded predictions, identification of verbal disputes (with neutral wording), and specific focus on units of comparison, aggregation of suffering, crop death scaling, and wild animal welfare.
      *   **Tone:** Academic, collaborative, precise, neutral, good-faith.
      *   **Key Debates:** Beef-is-worse (efficiency/land/wild animals) vs. Chicken-is-worse (number of lives/sentience intensity).

  2.  **Deconstruct the Camps' Arguments:**
      *   *Beef-is-Worse Camp (BIW):* Focuses on inefficiency. Cattle eat lots of crops -> more crop deaths (field mice, etc.) + more habitat loss. One steer = many crop deaths. Chicken is more efficient -> less land -> less wild animal harm.
      *   *Chicken-is-Worse Camp (CIW):* Focuses on sentient count and intensity. One steer = ~100+ chickens. Broilers live miserable, short lives. Wild animal suffering is uncertain/neutral. Better to have fewer miserable lives than many miserable lives.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to establish empirical baselines.
      *   *Feed Conversion:* Cattle are less efficient than chickens. (BIW loves this, CIW accepts it).
      *   *Land Use:* Beef requires more land per calorie/kg. (Agreed).
      *   *Animals per Serving:* One steer yields many servings; one broiler yields few. Replacing beef with chicken increases the *number* of individual animals killed. (Agreed).
      *   *Broiler Welfare:* Broilers suffer significantly (confinement, growth issues). (Agreed, though magnitude might differ).
      *   *Harvest Deaths:* Crop production kills wild animals (mice, birds, insects). (Agreed).
      *   *Direction of Uncertainty:* Wild animal welfare sign is uncertain. (Agreed).

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to phrase these so each side says "Yes, that is my view."
      *   *Core Disagreement:* Net welfare impact of the substitution.
      *   *BIW View:* The reduction in wild animal harm via land savings outweighs the increase in farmed animal count/suffering.
      *   *CIW View:* The multiplication of sentient lives subjected to net-negative welfare outweighs the uncertain benefits of land savings.
      *   *Verbal Dispute:* "Expected Welfare" definition (per calorie vs. per life).

  5.  **Drafting Section 3: Cruxes (The Path Forward):**
      *   *Crux 1: Unit of Account.* Is it per calorie or per life?
          *   *Evidence:* Ethical framework analysis.
          *   *Prediction:* BIW prefers per-calorie/land; CIW prefers per-life.
      *   *Crux 2: Aggregation of Suffering.* Many short bad lives vs. few long bad lives.
          *   *Evidence:* Philosophical consistency checks (totalism vs. averageism).
          *   *Prediction:* CIW weights total suffering more; BIW weights density/efficiency more.
      *   *Crux 3: Crop Death Scaling.* Does it scale with land or feed volume?
          *   *Evidence:* Agricultural yield data per hectare.
          *   *Prediction:* BIW says land area drives deaths; CIW says feed volume matters less than land.
      *   *Crux 4: Wild Animal Welfare.* Are wild lives net positive or negative?
          *   *Evidence:* Ecological welfare studies.
          *   *Prediction:* BIW leans negative (saving them from existing is good); CIW leans uncertain/positive (destroying habitat is bad).
      *   *Verbal Dispute Resolution:* Define "Expected Welfare" neutrally (e.g., "Sum of weighted welfare moments across all affected sentient beings per unit of nutritional output").

  6.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a formal university document. Use terms like "stipulate," "concede," "residual disagreement."
      *   *Specific Constraints:* Make sure the "verbal dispute" section explicitly handles the "per calorie vs. per life" issue as requested.
      *   *Formatting:* Use clear headings, tables, and numbered lists.
      *   *Self-Correction during drafting:* I initially thought about putting specific numbers in Section 1. Better to keep it to "directional agreements" or ranges to ensure both sides can actually sign it without quibbling over specific stats. The prompt asks for "empirical regularities... and where no magnitude can be stipulated, the direction both accept."
      *   *Crux Detail:* Ensure the "concrete evidence" is actually testable or researchable, not just "more philosophy." For wild animals, it's about field studies. For crop deaths, it's about agricultural mechanics.

  7.  **Final Review against Prompt:**
      *   (1) Numbered section of claims? Yes.
      *   (2) Disagreements table? Yes.
      *   (3) List of cruxes with evidence/predictions/verbal disputes? Yes.
      *   Specific cruxes mentioned in prompt included? (Units, aggregation, crop scaling, wild welfare). Yes.
      *   Neutral wording for verbal disputes? Yes.

  8.  **Final Polish:** (Writing the document). *Self-correction: Ensure the distinction between 'Beef-is-Worse' and 'Chicken-is-Worse' camps is maintained clearly in the disagreement table.* *Make sure the 'verbal dispute' section highlights the 'unit of comparison' issue specifically.*

  *(Drafting mental outline complete. Proceeding to generate output.)*
