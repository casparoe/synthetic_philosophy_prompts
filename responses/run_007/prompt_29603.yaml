  # JOINT STATEMENT OF THE WORKING GROUP ON FOOD AND ANIMAL-WELFARE POLICY
  **Subject:** Comparative Welfare Analysis of Beef-to-Chicken Substitution  
  **Date:** October 26, 2023  
  **Status:** Adversarial Collaboration Output (Unresolved Consensus)

  ## Preamble
  This working group has engaged in a twelve-month adversarial collaboration to evaluate the expected welfare implications of substituting chicken for beef in university dining services. While we remain unable to issue a unified policy recommendation, we have successfully isolated the empirical and normative premises upon which our disagreement rests. The following document records our shared empirical baseline, codifies our residual disagreements in mutually acceptable language, and identifies the specific cruxes that, if resolved, would alter the group's conclusion.

  ---

  ## 1. Agreed Empirical Claims and Stipulations
  *Both the "Beef-is-Worse" (BIW) and "Chicken-is-Worse" (CIW) camps affirm the following regularities. Where precise magnitudes are contested, the direction of the effect is stipulated.*

  1.  **Feed Conversion Efficiency:** Cattle require significantly more feed input per unit of edible protein output than broiler chickens. Both camps stipulate that the feed-conversion ratio for beef is higher (less efficient) than for chicken.
  2.  **Land Use Intensity:** Beef production requires significantly more land area per calorie served than chicken production. Both camps stipulate that shifting demand from beef to chicken reduces the total agricultural land footprint required to serve an equivalent nutritional unit.
  3.  **Individual Animal Count:** A single serving of beef represents a fraction of one animal life, whereas a serving of chicken represents a larger fraction. Consequently, substituting beef with chicken on a calorie-for-calorie basis increases the total number of individual farmed animals killed.
  4.  **Broiler Welfare Conditions:** Broiler chickens are subject to confinement, rapid-growth physiological stress, and slaughter conditions that constitute a net-negative welfare experience for the individual animal. Both camps agree the expected welfare of a broiler chicken's life is below the "zero" line (a life not worth living).
  5.  **Crop-Related Mortality:** The cultivation of feed crops (soy, corn, etc.) results in the death of wild animals (e.g., field mice, birds, insects) via harvesting machinery, habitat clearance, and pesticide application.
  6.  **Wild Animal Welfare Uncertainty:** The net welfare value of wild animals displaced or killed by agricultural expansion is empirically uncertain. Both camps agree that the sign (positive or negative) of the average wild animal's life is not settled science.
  7.  **Directional Trade-off:** Both camps agree that the substitution entails a trade-off: it *increases* the number of farmed animals subjected to net-negative welfare while *decreasing* the land area and feed volume required, thereby potentially reducing wild animal deaths and habitat displacement.

  ---

  ## 2. Table of Residual Disagreements
  *The following table summarizes the core disagreement. Each position is phrased such that the respective camp affirms it as a fair representation of their view.*

  | Feature of Disagreement | Position of the "Beef-is-Worse" (BIW) Camp | Position of the "Chicken-is-Worse" (CIW) Camp |
  | :--- | :--- | :--- |
  | **Primary Metric of Harm** | **Harm per Calorie:** The moral cost of a food item is primarily a function of the total suffering and death inflicted per unit of nutrition delivered. Efficiency is a moral virtue because it minimizes the total footprint of harm. | **Harm per Life:** The moral cost of a food item is primarily a function of the number of sentient beings brought into existence to suffer. Multiplying the number of victims is the primary moral failure, regardless of efficiency. |
  | **Weight of Wild Animal Suffering** | **High Weight / Negative Value:** Wild animal lives are likely net-negative due to predation, starvation, and disease. Therefore, reducing land use saves wild animals from suffering, which is a significant moral good that offsets farmed animal harm. | **Low Weight / Uncertain Value:** Wild animal welfare is too uncertain to justify inflicting certain, severe suffering on farmed animals. Even if wild lives are net-negative, the certainty of broiler suffering outweighs the speculative benefit of habitat reduction. |
  | **Aggregation of Suffering** | **Intensity-Duration Product:** A long life of moderate suffering (steer) may be comparable to or worse than many short lives of severe suffering (chickens), especially when upstream crop deaths are included in the ledger. | **Sum of Negative Experiences:** Many short lives of severe suffering sum to a greater total negative utility than fewer lives of moderate suffering. The multiplication of distinct conscious subjects amplifies the moral weight of the harm. |
  | **Verbal Dispute Identification** | **Partly Verbal:** We dispute whether "Expected Welfare" refers to the *density* of suffering per resource unit or the *count* of suffering subjects. | **Partly Verbal:** We dispute whether "Expected Welfare" refers to the *density* of suffering per resource unit or the *count* of suffering subjects. |

  ---

  ## 3. Cruxes and Adjudication Pathways
  *The following sub-questions are identified as cruxes. Settling any one of these would cause at least one camp to update its position significantly. For each crux, we record the concrete evidence required, the neutral wording to resolve verbal disputes, and the pre-commitment of each camp.*

  ### Crux 1: The Unit of Moral Account
  *   **The Question:** Should policy be optimized to minimize suffering **per calorie produced** or **per animal life initiated**?
  *   **Verbal Dispute Resolution:** The term "Expected Welfare" is ambiguous. The neutral wording for future analysis shall be: **"Total Weighted Suffering Moments per Nutritional Unit."** This forces an explicit definition of whether "Weighted Suffering Moments" scales linearly with the number of subjects (CIW view) or is amortized over output (BIW view).
  *   **Required Evidence/Case:** A philosophical consistency test using non-food analogies (e.g., transportation safety: is it better to have one accident killing 100 people or 100 accidents killing 1 person each, assuming total deaths are equal?).
  *   **Pre-Recorded Predictions:**
      *   **BIW:** Will argue that per-calorie minimization is the only scalable policy metric.
      *   **CIW:** Will argue that per-life initiation is the only metric that respects the sanctity of individual sentient subjects.

  ### Crux 2: Scaling of Crop-Related Deaths
  *   **The Question:** Do harvest deaths of wild animals scale primarily with **total land area harvested** or **total volume of crop yield**?
  *   **Why it Matters:** If deaths scale with land area, chicken (less land) saves more wild lives. If deaths scale with crop volume (feed tonnage), the advantage diminishes because chickens require less land but still require significant feed tonnage per calorie compared to plants, though less than beef.
  *   **Required Evidence:** Agrarian ecological studies correlating combine harvester throughput and pesticide application rates against small mammal mortality rates, controlling for crop type.
  *   **Pre-Recorded Predictions:**
      *   **BIW:** Predicts mortality correlates strongly with **land area**. (Supports chicken).
      *   **CIW:** Predicts mortality correlates strongly with **crop intensity/volume** or is negligible compared to farmed animal suffering. (Neutralizes chicken advantage).

  ### Crux 3: The Sign of Wild Animal Welfare
  *   **The Question:** Is the average life of a wild field animal (mouse, bird, insect) in a temperate agricultural zone **net-positive** or **net-negative**?
  *   **Why it Matters:** If wild lives are net-positive, destroying habitat via crops is a harm. If wild lives are net-negative, destroying habitat via crops is a benefit (prevention of suffering).
  *   **Required Evidence:** Field studies measuring stress hormones, injury rates, and starvation frequency in wild populations vs. proxies for "life satisfaction" in non-human animals.
  *   **Pre-Recorded Predictions:**
      *   **BIW:** Predicts wild lives are **net-negative** (nature is cruel). Therefore, reducing land use is a moral good.
      *   **CIW:** Predicts wild lives are **net-positive** or **too uncertain to assume negative**. Therefore, reducing land use is not a guaranteed moral good.

  ### Crux 4: Aggregation of Short vs. Long Suffering
  *   **The Question:** Does 100 lives of 40 days of severe suffering outweigh 1 life of 18 months of moderate suffering?
  *   **Verbal Dispute Resolution:** This is not verbal; it is a normative disagreement on **Population Ethics**. The neutral framing is: **"Does the moral weight of suffering aggregate linearly across distinct conscious subjects?"**
  *   **Required Evidence:** No empirical evidence can settle this; it requires a normative framework agreement. The group agrees to commission a review of "Totalist" vs. "Averageist" vs. "Person-Affecting" ethical frameworks applied to animal policy.
  *   **Pre-Recorded Predictions:**
      *   **BIW:** Will adopt a **Totalist** view that allows amortization over efficiency gains.
      *   **CIW:** Will adopt a **Subject-Counting** view that penalizes the multiplication of victims regardless of duration.

  ---

  ## 4. Conclusion and Next Steps
  The Working Group acknowledges that the deadlock is not due to a lack of data regarding feed conversion or land use, which are settled, but rather due to divergent ethical frameworks regarding the aggregation of suffering and the moral status of wild animals.

  We recommend that the University Dining Service adopt a **precautionary principle** until Crux 3 (Wild Animal Welfare) and Crux 4 (Aggregation) are further resolved. Specifically, we recommend prioritizing **plant-based substitutions** where possible, as this bypasses the beef-vs-chicken trade-off entirely, satisfying the BIW concern for land use and the CIW concern for farmed animal multiplication. Where meat must be served, we recommend labeling that reflects the uncertainty outlined in this statement.

  **Signed,**

  *The Beef-is-Worse Camp Representatives*  
  *The Chicken-is-Worse Camp Representatives*  
  *Chair, Working Group on Food and Animal-Welfare Policy*
