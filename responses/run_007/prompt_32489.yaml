answer: |-
  ### The Thought Experiment: The Roommate's Eviction

  **The Scenario**
  Elena lives with her friend Mark. Over the past six months, Mark has become consistently unreliable with rent, often paying weeks late, which puts Elena at financial risk. Elena is conflict-averse and unsure whether her duty to protect her finances outweighs her duty of loyalty to a struggling friend. She calls her Aunt Sarah, a retired family court judge known for her wisdom and integrity. Elena explains the situation factually. Sarah says, "Elena, you have a moral obligation to ask him to move out. Staying silent enables his irresponsibility and harms you. It is the just thing to do."

  Elena trusts Sarah completely. She does not reflect further on the reasons; she simply adopts Sarah's judgment. She forms the belief: *"I am morally obligated to evict Mark."*

  Elena tells Mark he needs to leave. When Mark, hurt and confused, asks, "Do *you* think I'm a bad person? Is this what *you* want?" Elena replies, "No, but my aunt says it's my duty. She says it's the only honorable choice."

  It turns out that Elena *was* morally obligated to ask Mark to leave (Mark's behavior was indeed exploitative, and Elena's financial stability was a legitimate moral priority). Sarah was a reliable testifier, and Elena had no reason to doubt her. Elena's belief was true, justified, and reliably formed.

  However, Elena gets into moral trouble. Mark ends the friendship, not just because he has to move, but because he feels Elena treated their relationship as a bureaucratic problem to be solved by a third party. Mutual friends criticize Elena, not for evicting Mark, but for abdicating her moral agency within the friendship. They say she failed to own the decision, making the act cold and instrumental. Elena is viewed as morally immature, despite having done the "right thing."

  ***

  ### Analysis

  #### 1. Why the Belief Counts as Knowledge
  By standard epistemic criteria (specifically externalist accounts like Reliabilism or standard Internalist accounts of Justified True Belief), Elena's belief constitutes knowledge.
  *   **Truth:** The proposition "I am morally obligated to evict Mark" is true. The balance of moral reasons did support eviction.
  *   **Belief:** Elena genuinely holds this belief.
  *   **Justification/Reliability:** Elena deferred to a reliable expert (Sarah) in a domain where testimony is generally accepted. She had no defeaters (no reason to think Sarah was lying or mistaken). In almost any non-moral context (e.g., "Is this bridge safe?" asking an engineer), this would unquestionably count as knowledge. There is no internal contradiction in her belief state, and it was formed via a truth-tracking process (Sarah's wisdom).

  #### 2. The Moral Failing: Action or Agent?
  The moral failing is **of the agent**, which renders the **action morally defective in its performance**, even if the outcome was correct.

  *   **The Failing:** Friendship entails a duty of **moral intimacy**. When we are close to someone, we owe them the engagement of our own moral conscience. By outsourcing the decision to Sarah, Elena treated Mark not as a friend to whom she owes moral honesty, but as a variable in a moral equation solved by someone else.
  *   **Why it's recognizable:** A reasonable person would say, "She should have had the courage to decide that herself." The failing is a lack of **moral ownership**. In intimate contexts, *how* you arrive at a moral stance is part of the moral act itself. Acting on delegated authority in a personal relationship signals that the relationship isn't worth the cognitive and emotional labor of moral reasoning. It is a failure of integrity and care, distinct from the failure of getting the answer wrong.

  #### 3. The Defender of Moral Testimony
  A defender of moral testimony might argue: *"The problem is with the action's expression, not with how the belief was formed. Moral testimony is still fine epistemically."*

  They would claim that Elena successfully acquired **moral knowledge** (she knew *what* to do), but failed at **moral performance** (she didn't know *how* to be a friend while doing it). They would separate the epistemic state (knowing the obligation exists) from the practical virtue (owning the obligation). They would argue that we shouldn't deny her knowledge just because she lacked the courage to claim it. The epistemic pipeline was clean; the bottleneck was her character in the moment of delivery.

  #### 4. The Separating Feature and Variation
  The feature that separates the epistemic success from the practical failure is **The Demand for First-Personal Moral Endorsement.**

  *   **Epistemic Success** relies on the *truth of the proposition* and the *reliability of the source*. It is content-focused.
  *   **Practical Failure** arises when the *context demands the agent's personal endorsement* as part of the moral duty. It is agency-focused.

  **Varying the Feature:**
  Imagine we vary the scenario to remove the demand for first-personal endorsement.
  *   **Variation:** Elena is not evicting a friend, but deciding whether to donate a large sum of money to a distant, effective charity. She asks Sarah, "Which charity is most morally pressing?" Sarah says, "Charity X." Elena donates to Charity X.
  *   **Result:** The **practical failure disappears**. No one expects Elena to have a personal, reasoned emotional connection to a distant stranger to validate the donation. Doing the right thing based on testimony is praiseworthy here.
  *   **Epistemic Status:** The **epistemic success remains**. She still knows (by testimony) that Charity X is the best option.

  **Conversely:**
  Imagine we vary the scenario to enforce first-personal endorsement.
  *   **Variation:** Elena refuses to ask Sarah. She sits down, struggles with the conflict, weighs her finances against Mark's struggle, and concludes on her own, "I must ask him to leave." She tells Mark, "This is incredibly hard for me, but I've realized I can't sustain this."
  *   **Result:** The **practical failure disappears**. She has owned the moral burden. Mark may still be upset, but he cannot accuse her of moral abdication.
  *   **Epistemic Status:** The **epistemic success remains** (assuming she reasoned correctly).

  **Conclusion on the Variation:**
  When you vary the feature (the demand for endorsement), the **practical failure disappears or appears** based on the context, while the **epistemic success remains stable**. This suggests that standard epistemic criteria track *truth acquisition*, but moral life often requires *truth integration*. The thought experiment reveals that in morality, "knowing" is sometimes insufficient if the knowing does not pass through the agent's own rational faculties, specifically in contexts of intimacy. The epistemic success is robust across contexts, but the moral permissibility of acting on that testimony is context-sensitive.
