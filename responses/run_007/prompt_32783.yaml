      *   *2. Free-Will:* "God hides so you can choose freely."
          *   *Existential Impact:* Common, but often feels thin to the sufferer. "I didn't ask for a test of freedom; I ask for connection." It turns the relationship into a contractual negotiation rather than a loving encounter.
      *   *3. Soul-Making:* "Hiddenness builds character/virtue."
