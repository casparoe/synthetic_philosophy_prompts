      *   Check the Knobe terminology. Knobe's early view is often called the "Blame Hypothesis." The student called it "culpability account." That's acceptable paraphrase.
      *   The alternative explanation part is the weakest. I need to explain *why* their answer is ambiguous. If "inferred badness" drives the judgment, is that moral judgment? Yes. So it fails the constraint "does not make moral considerations part of the concept." A better answer would be the *Pragmatic* view (the question is interpreted differently) or the *Deep Self* view (structural alignment, not moral valence).

  6.  **Finalizing the Grade:** 7/10.
      *   3 for Description.
      *   2 for Standard Interpretation (due to the exaggeration).
