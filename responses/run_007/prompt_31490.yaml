prompt: |-
  I'm a software engineer with no formal background in philosophy, but I've ended up thinking about merit and desert because of promotion committees, performance reviews, and equity grants at my company. I went through a set of cases and wrote down my gut reactions. Now I'm trying to figure out whether there's a coherent principle behind them, or whether I need to revise some of my verdicts.

  I'd like you to approach this as a professional philosopher working through a problem in reflective equilibrium. Start by identifying the tensions among my verdicts, then work toward the best principle (or small set of principles) that captures as many of them as possible, and be honest about which verdicts it cannot accommodate.

  Here are my verdicts:

  1. Alice works 55-hour weeks and is always available on Slack; her code is mediocre and bug-prone. Bob works 30 hours, coasts visibly, but his code is clean and reliable. They're up for the same promotion: Bob deserves it more. The output matters more than the effort.

  2. Carol went to Stanford with every advantage. Dave taught himself to code on a secondhand laptop while working retail. Both are equally productive engineers now. My gut says Dave deserves more admiration for getting here — but I don't think he deserves a higher salary or a faster promotion because of his background. That feels like it should be consistent, but I can't see how.

  3. Elena designed the architecture that made a new feature possible. Frank implemented it and got the public recognition. Elena deserves at least as much credit as Frank, but Frank deserves the public recognition. I'm not sure these can both be true.

  4. Grace joined a startup two months before the acquisition and got a $400,000 payout. Henry was employee #3, built the core product over four years, but burned out and left six months before the acquisition — he got nothing. Henry clearly deserves more than Grace. The unfairness is in the system, not Grace's fault, but I still feel Henry was robbed.

  5. Irene chose a framework after careful research, expert consultation, and a pilot. It failed because of a subtle flaw that only emerged under load. Jack picked whatever was trending on Hacker News and it worked perfectly. For the next high-stakes project, Irene deserves it over Jack. The quality of the decision matters more than the outcome.

  6. Kevin hit all his OKRs by picking safe, incremental tasks. Lisa missed hers because she spent the quarter on a high-risk architecture migration the team badly needed. Lisa deserves the higher performance rating — but if we reward people for missing targets, we undermine the whole point of having targets.

  Is there a unified account of desert that makes sense of these verdicts? If not, which of my verdicts do I need to give up, and what does the best available principle say about a case I haven't listed: someone who succeeds by taking credit for other people's work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Software engineer, no formal philosophy background, grappling with concepts of merit/desert in a corporate context (promotions, equity, reviews).
      *   **Task:** Act as a professional philosopher using the method of *reflective equilibrium*.
      *   **Input:** Six specific cases with gut verdicts.
      *   **Goal:** Identify tensions, propose a coherent principle (or set of principles), acknowledge where verdicts must be revised, and address a new case (credit-claiming).
      *   **Tone:** Professional, analytical, empathetic to the engineering context, philosophically rigorous but accessible.

  2.  **Deconstruct the Verdicts (Initial Analysis):**
      *   *Case 1 (Alice vs. Bob):* Output > Effort. (Consequentialist/Result-oriented).
      *   *Case 2 (Carol vs. Dave):* Admiration (Character/Effort) $\neq$ Reward (Output/Role). Tension between *moral desert* and *economic/contractual desert*.
      *   *Case 3 (Elena vs. Frank):* Credit (Causal Contribution) vs. Recognition (Visibility/Role). Tension between *private merit* and *public signaling*.
      *   *Case 4 (Grace vs. Henry):* Timing/Luck vs. Historical Contribution. Tension between *contractual entitlement* and *retrospective fairness*.
      *   *Case 5 (Irene vs. Jack):* Process/Decision Quality > Outcome (Luck). (Deontological/Process-oriented). *Direct tension with Case 1.*
      *   *Case 6 (Kevin vs. Lisa):* Risk-Adjusted Contribution > Box-Ticking. Tension between *systemic integrity* (OKRs) and *actual value*.

  3.  **Identify Tensions (The "Disequilibrium"):**
      *   **Tension A (Outcome vs. Process):** Case 1 says Output matters most (Bob > Alice). Case 5 says Decision Quality matters most (Irene > Jack), even if output failed.
      *   **Tension B (Contribution vs. Contract):** Case 4 says Henry deserves more despite leaving (Contribution), but Case 2 says Dave doesn't deserve higher salary despite hardship (Background/Contract). When does "deserve" map to money vs. moral worth?
      *   **Tension C (Individual Merit vs. Systemic Rules):** Case 6 suggests rewarding Lisa for missing OKRs, which undermines the system. Case 4 suggests Henry deserves money he contractually forfeited.

  4.  **Develop a Theoretical Framework (Reflective Equilibrium):**
      *   *Concept:* We need to distinguish between different *types* of desert. A monolithic theory of "desert" fails here.
      *   *Distinction 1: Moral Desert vs. Institutional Desert.* (Feinberg/Miller distinction).
          *   Moral Desert: Praise, admiration, respect (based on effort, character, struggle).
          *   Institutional Desert: Pay, promotion, title (based on value delivered, role fulfillment, future potential).
      *   *Distinction 2: Ex Post vs. Ex Ante.*
          *   Ex Post: What actually happened? (Case 1, Case 4).
          *   Ex Ante: What was the rational bet? (Case 5, Case 6).
      *   *Proposed Principle:* **The Principle of Value-Aligned Incentives.**
          *   Institutional rewards (money, promotion) should track *expected value contribution* and *role alignment*, not just raw output or raw effort.
          *   Moral rewards (admiration, credit) should track *agency, struggle, and causal contribution*.

  5.  **Test the Principle against Verdicts:**
      *   *Case 1 (Alice/Bob):* Fits. Institutional reward tracks value (clean code > hours).
      *   *Case 2 (Carol/Dave):* Fits. Moral admiration tracks struggle (Dave). Institutional reward tracks current value (Equal).
      *   *Case 3 (Elena/Frank):* Fits. Causal credit to Elena. Public recognition to Frank (as he is the interface). *Revision needed:* Frank shouldn't get *all* the credit, but public recognition is a functional role.
      *   *Case 4 (Grace/Henry):* Hard one. Institutional rules say Grace. Moral/Retrospective says Henry. *Revision:* Henry deserves *acknowledgment* and perhaps a negotiated severance, but not necessarily the equity he legally forfeited. The "robbery" is systemic, not individual.
      *   *Case 5 (Irene/Jack):* Fits. Institutional reward should track *decision quality* (predictive of future success), not luck. Irene > Jack for future projects.
      *   *Case 6 (Kevin/Lisa):* Fits. Institutional rewards must track *risk-adjusted value*. If OKRs punish necessary risk, the OKRs are wrong. Lisa deserves the rating, but the system needs fixing.

  6.  **Address the "Hard Conflicts" (Revisions):**
      *   *Conflict 1 vs. 5:* How to reconcile Output (1) vs. Process (5)?
          *   *Resolution:* In software, "Output" in Case 1 implies *sustainable value* (clean code). "Outcome" in Case 5 implies *luck* (framework worked by chance). The principle is **Controllable Contribution**. Reward what the agent controls. Bob controls code quality. Jack didn't control the framework's success.
      *   *Conflict 4:* Henry's equity.
          *   *Revision:* You must accept that institutional desert is bound by contracts. Henry deserves *moral restitution* from leadership, but not necessarily the equity grant itself.

  7.  **Address the New Case (Credit Claiming):**
      *   *Scenario:* Someone succeeds by taking credit for others' work.
      *   *Analysis:* This violates the **Controllable Contribution** and **Causal Truth** principles.
      *   *Verdict:* They deserve *punishment* or *revocation*, not reward. Even if the "outcome" was good, the *agency* was fraudulent. It undermines the epistemic foundation of the reward system.

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the user's intuitions. Define Reflective Equilibrium.
      *   *Section 1: Mapping the Tensions.* Group the cases by conflict (Outcome vs. Process, Moral vs. Institutional).
      *   *Section 2: The Proposed Framework.* Introduce the distinction between *Moral Desert* (Admiration) and *Distributive Desert* (Rewards). Introduce the *Control Principle*.
      *   *Section 3: Testing and Revising.* Walk through the cases. Be explicit about where the user's gut needs adjustment (specifically Case 4 and the tension in Case 1/5).
      *   *Section 4: The Unlisted Case.* Apply the framework to the credit-claimer.
      *   *Conclusion:* Summary of the coherent view.

  9.  **Refining the Philosophy:**
      *   Use terms like "Control Principle" (Nagel/Williams).
      *   Reference "Institutional vs. Pre-institutional Desert" (Rawls/Feinberg).
      *   Keep it grounded in Eng/Management speak (OKRs, Equity, Tech Debt).
      *   *Self-Correction during drafting:* Make sure I don't just say "it depends." I need to propose a *unified* account. The unification is: **Rewards should track controllable, future-predictive value contributions.**

  10. **Final Polish:** Check tone. Ensure it sounds like a collaborative philosophical inquiry, not a lecture. (Ensure the distinction between Case 1 and 5 is clear: Case 1 is about *sustainable* output, Case 5 is about *luck*.)

  *(Self-Correction on Case 1 vs 5)*: In Case 1, Bob's output is *reliable*. In Case 5, Jack's output is *lucky*. The unifying thread is **Reliability/Agency**. Reward what is replicable.

  *(Self-Correction on Case 4)*: This is the hardest. If I say Henry deserves the money, I violate contract law. If I say he doesn't, I violate moral intuition. The philosophical move is to distinguish *Entitlement* (legal) from *Desert* (moral). He *deserves* it morally, but isn't *entitled* to it institutionally. The company *ought* to fix this, but Grace isn't the villain.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic problem in practical ethics, specifically within the subfield of **distributive justice**. You have intuitively stumbled upon the distinction between *moral desert* (what we owe someone as a moral agent) and *institutional entitlement* (what a system owes someone based on rules).

  As a philosopher working in **reflective equilibrium**, my job is to take your considered judgments (the verdicts) and try to fit them under general principles. When they clash, we must either tweak the principle or revise the judgment.

  Here is the analysis of your cases, the tensions they reveal, and a proposed framework to resolve them.

  ### Part 1: Mapping the Tensions

  Your six verdicts are not random; they cluster around three specific philosophical conflicts.

  **Tension A: Outcome vs. Agency (Case 1 vs. Case 5)**
  *   **Case 1** suggests a **Consequentialist** view: Reward the actual value delivered (Bob's clean code), regardless of effort.
  *   **Case 5** suggests a **Deontological/Process** view: Reward the quality of the agency (Irene's rigorous process), regardless of the lucky outcome.
  *   *The Conflict:* If output matters most (Case 1), Jack should be rewarded for the working framework. If process matters most (Case 5), Alice should be rewarded for her effort. You reject both of those. You want a hybrid: Reward *reliable* output and *sound* process, but punish *lucky* output and *futile* effort.

  **Tension B: Moral Worth vs. Economic Value (Case 2 vs. Case 4)**
  *   **Case 2** separates admiration from pay. Dave gets respect (moral), Carol gets equality (economic).
  *   **Case 4** implies Henry *should* have gotten the money (economic) because of his contribution, even if the rules said otherwise.
  *   *The Conflict:* Why do we separate background struggle from pay in Case 2, but insist historical contribution dictates pay in Case 4? Is equity a reward for *past labor* or a bet on *future retention*?

  **Tension C: Systemic Integrity vs. Individual Fairness (Case 3 & 6)**
  *   **Case 6** admits that rewarding Lisa undermines the OKR system, yet she still deserves the rating.
  *   **Case 3** suggests Frank deserves recognition even if Elena did the heavy lifting.
  *   *The Conflict:* This highlights the difference between **Truth** (who did the work) and **Signaling** (who represents the work). You feel the system should accommodate the truth, even if it costs systemic consistency.

  ### Part 2: The Proposed Principle

  To bring these into equilibrium, we need to discard the idea of a single metric called "Desert." Instead, I propose a **Two-Tiered Principle of Controllable Contribution**:

  1.  **Moral Desert (Admiration/Respect):** Tracks **Effort + Struggle + Causal Truth**. This is about the human being.
  2.  **Institutional Desert (Pay/Promotion):** Tracks **Controllable Value + Future Predictivity**. This is about the role.

  **The Core Axiom:** *Institutional rewards should only track outcomes that are replicable and within the agent's control.*

  This distinguishes **Skill** (replicable) from **Luck** (non-replicable), and **Value** (useful to the firm) from **Virtue** (admirable in a human).

  ### Part 3: Testing and Revising Your Verdicts

  Let's run your cases through this framework. This will require us to be honest about where your gut feelings might be leading you astray.

  **Case 1 (Alice vs. Bob): *Confirmed.***
  *   **Analysis:** Bob's code is *reliable* (replicable value). Alice's hours are *effort* (moral virtue), but the output is negative value (bugs).
  *   **Principle:** Institutional reward tracks value. Bob wins. Alice deserves coaching, not promotion.

  **Case 2 (Carol vs. Dave): *Confirmed.***
  *   **Analysis:** Dave's struggle is **Moral Desert**. He deserves admiration, a shout-out in an all-hands, perhaps a mentorship role. But salary is **Institutional Desert**. It prices the *current market value of the skill*, not the *cost of acquiring it*. If you pay Dave more, you are subsidizing his history, not buying his engineering.
  *   **Revision:** Your gut is correct. The tension dissolves once you admit admiration and salary answer to different masters.

  **Case 3 (Elena vs. Frank): *Needs Revision.***
  *   **Verdict:** You said Frank deserves public recognition.
  *   **Critique:** Under the **Causal Truth** axiom, this is dangerous. If Frank gets public recognition for Elena's architecture, you create a "credit market" where visibility is decoupled from contribution.
  *   **Revision:** Frank deserves recognition for *implementation*, Elena for *design*. If the public recognition implies ownership of the idea, Frank does **not** deserve it. The company should structure recognition to reflect causal contribution (e.g., "Elena designed, Frank built"). To say Frank deserves the credit for the architecture is to endorse a lie for the sake of convenience.

  **Case 4 (Grace vs. Henry): *The Hardest Revision.***
  *   **Verdict:** You feel Henry was robbed and deserves the money.
  *   **Critique:** This conflicts with Case 2. In Case 2, you said we don't pay for the *journey* (Dave's struggle). In Case 4, you want to pay for the *journey* (Henry's 4 years).
  *   **Resolution:** Equity vests for a reason: it is a **retention instrument**, not a **retroactive wage**. Henry is not entitled to the equity (Institutional Desert). However, he has high **Moral Desert**.
  *   **Revision:** You must give up the verdict that Henry deserves the *equity*. He deserves a *bonus* or a *consulting contract* offered by leadership to acknowledge the debt. Grace deserves the money because she held the contract. The "robbery" is real, but the remedy is discretionary moral restitution, not contractual entitlement.

  **Case 5 (Irene vs. Jack): *Confirmed.***
  *   **Analysis:** This is the **Control Principle**. Jack's success was luck (non-replicable). Irene's process was sound (replicable).
  *   **Principle:** Reward the decision-making process, because that predicts future value. Irene gets the high-stakes project.

  **Case 6 (Kevin vs. Lisa): *Confirmed, with a Systemic Caveat.***
  *   **Analysis:** Lisa provided **Controllable Value** (migration was needed). Kevin provided **Box-Ticking**.
  *   **Principle:** If the OKR system punishes necessary risk, the OKR system is flawed. You reward Lisa *and* you fix the OKRs. Rewarding Kevin would be paying for "game-playing," which is negative value.

  ### Part 4: The Unified Account

  Here is the coherent principle that captures 5.5 of your 6 verdicts:

  > **The Principle of Replicable Agency:**
  > Employees should be institutionally rewarded (money, promotion) based on the **expected value of their controllable decisions**, not merely realized outcomes or raw effort. They should be morally rewarded (admiration, respect) based on their **struggle and causal contribution**.

  **What this accommodates:**
  *   It explains why Bob wins over Alice (Value > Effort).
  *   It explains why Dave gets admiration but not cash (Moral vs. Institutional).
  *   It explains why Irene wins over Jack (Process > Luck).
  *   It explains why Lisa wins over Kevin (Value > Compliance).

  **What this forces you to revise:**
  *   **Case 3:** You cannot give Frank public credit for Elena's design without violating Causal Truth. Recognition must be granular.
  *   **Case 4:** You cannot claim Henry *deserves* the equity in the same way Grace does. He deserves *restitution*, which is a different category.

  ### Part 5: The Unlisted Case (The Credit Claimer)

  **The Case:** Someone succeeds by taking credit for other people's work.

  **Application of the Principle:**
  This is the ultimate violation of **Replicable Agency**.
  1.  **Controllability:** The success was not caused by their agency.
  2.  **Replicability:** They cannot replicate the success because they don't possess the underlying skill.
  3.  **Causal Truth:** They have introduced false information into the company's epistemic system.

  **The Verdict:**
  They deserve **negative institutional desert** (demotion or firing).
  Even if the project succeeded (positive outcome), the *method* (fraud) destroys the trust required for the reward system to function. If you reward the credit-claimer, you signal that *political maneuvering* is a replicable skill the company values. Since political maneuvering is often zero-sum (someone else loses credit), rewarding it decreases total organizational value.

  **Philosophical Nuance:**
  If the credit-claimer *also* managed the project well (i.e., they were a good manager who delegated), they deserve credit for the *management*, but not the *technical execution*. But if they claimed the technical work was theirs, that is a lie. In a system based on **Replicable Agency**, lying about agency is a fireable offense, regardless of the project's success.

  ### Summary for Your Next Review Cycle

  You don't need to become a moral philosopher to run a fair team, but your intuitions are already aligning with a sophisticated view:

  1.  **Pay for Value, not Virtue.** (Bob > Alice, Carol = Dave).
  2.  **Pay for Process, not Luck.** (Irene > Jack).
  3.  **Pay for Retention, not History.** (Grace > Henry, legally).
  4.  **Credit must match Causality.** (Elena = Frank on credit, Lisa > Kevin on rating).

  The tension you feel isn't confusion; it's the friction between **human fairness** (which wants to help Dave and Henry) and **economic efficiency** (which must reward Bob and Grace). The solution is to satisfy the human need through *recognition and culture*, and satisfy the economic need through *compensation and equity*, without confusing the two.
