      *   (3) Kelly $\equiv$ EUT with Log Utility. Log isn't magic.
      *   (4) Ergodicity Economics point: Time-average growth > Ensemble-average wealth for individuals on a single path.
      *   (5) Fractional Kelly: Optimal for Power Utility ($U(w) = w^{1-\gamma}/(1-\gamma)$) where $\gamma > 0$ (specifically $\gamma \neq 1$).
      *   (6) One-shot again: Don't use Kelly, use actual utility.

  3.  **Evaluate Consistency & Tensions (Pairwise Analysis):**

      *   **(1) vs. (3):**
