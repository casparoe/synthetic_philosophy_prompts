          *   *Conflict:* If I have Power Utility ($\gamma = 2$), Full Kelly is *not* optimal for me, even in repeated settings (for finite horizons or specific discounting). Full Kelly minimizes time to reach a goal, or maximizes asymptotic growth, but it doesn't maximize Expected Utility for $\gamma \neq 1$.
