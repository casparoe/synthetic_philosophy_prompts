answer: |-
  This is a sophisticated take. You have clearly internalized the math, but you are currently straddling two different philosophical frameworks (standard Expected Utility Theory vs. Ergodicity Economics) without fully committing to how they interface. This creates friction points that a sharp reading group will exploit.

  Here is the breakdown of the tensions, ranked by severity, along with the "cheapest fix" for each.

  ### Tension 1: The Universality of Kelly (Positions 2 vs. 5)
  **Severity: High (Technical Contradiction)**

  *   **The Conflict:** In (2), you state Kelly is "the right rule" for repeated multiplicative bets. In (5), you admit Fractional Kelly is optimal for power-utility agents with $\gamma \neq 1$. These cannot both be universally true.
  *   **Why it matters:** If an agent has CRRA (Constant Relative Risk Aversion) utility with $\gamma = 2$ (more risk-averse than log), their optimal repeated strategy is **not** Full Kelly; it is Half-Kelly (or whatever fraction corresponds to their $\gamma$). Full Kelly maximizes the *geometric growth rate of wealth*, but it does not maximize the *expected utility of wealth* for anyone except a log-utility agent.
  *   **The Samuelson Objection:** Paul Samuelson famously argued that maximizing geometric mean (Kelly) does not maximize expected utility for finite horizons unless $U(w) = \log(w)$. While Kelly dominates almost surely in the *infinite* limit, a risk-averse agent might prefer a lower growth path with lower variance to avoid deep drawdowns that hurt their utility disproportionately.
  *   **Cheapest Fix:** Qualify (2). Kelly is the rule for maximizing **long-run geometric growth rate**, not necessarily for maximizing **expected utility** in repeated settings.
      *   *Revision:* "(2) For repeated multiplicative bets, the Kelly criterion maximizes the asymptotic geometric growth rate. It is the optimal strategy *only* for an agent with log utility."

  ### Tension 2: The Foundation of Log Utility (Positions 3 vs. 4)
  **Severity: Medium (Philosophical Inconsistency)**

  *   **The Conflict:** In (3), you domesticate Kelly into standard Expected Utility Theory ("It just is expected utility theory with a log utility function"). In (4), you endorse the Ergodicity Economics critique, which argues that EUT is fundamentally flawed because it relies on ensemble averages rather than time averages for non-ergodic processes.
  *   **Why it matters:** You can't have it both ways.
      *   **View A (Standard EUT):** The world is ergodic (or we treat it as such via ensembles). Log utility is a *preference* assumption. Kelly is a derived result for people with that preference.
      *   **View B (Ergodicity Economics):** The world is non-ergodic (multiplicative dynamics). Log utility is not a preference; it is a *physical necessity* for survival/growth. EUT is the wrong framework because ensemble averages don't apply to a single trajectory.
      *   By saying (3) "Log isn't magic" while also saying (4) "Time-average is the right object," you are blurring whether Log is a *psychological input* or a *dynamical output*. Ergodicity proponents (like Ole Peters) argue Log utility is *derived* from the dynamics, not assumed.
  *   **Cheapest Fix:** Clarify the direction of derivation. Acknowledge that while the *math* is identical (Log EUT $\equiv$ Time-Average Growth), the *justification* differs.
      *   *Revision:* "(3) Mathematically, Kelly is equivalent to EUT with log utility. However, Ergodicity Economics suggests the log function isn't just a preference parameter; it emerges naturally from the requirement to maximize time-average growth in multiplicative dynamics."

  ### Tension 3: Stability of Risk Preferences (Positions 1/6 vs. 2/5)
  **Severity: Low/Medium (Conceptual Drift)**

  *   **The Conflict:** In (1) and (6), you say for one-shot bets, use your "actual utility function." In (2) and (5), you imply that for repeated bets, the "right rule" shifts toward Kelly (or Fractional Kelly based on power utility).
  *   **Why it matters:** Why should your risk aversion change based on whether the bet is repeated? If you are highly risk-averse in a one-shot scenario (very concave $U$), you should also be highly risk-averse in a repeated scenario (Fractional Kelly with high $\gamma$).
  *   **The Trap:** Many people think "One-shot = Bet your gut, Repeated = Bet Kelly." This implies a discontinuity in rationality. If your utility function represents your preferences over wealth states, it should apply consistently across time horizons. The *strategy* changes (dynamic programming vs. single optimization), but the *utility function* shouldn't.
  *   **Cheapest Fix:** Explicitly state that the utility function is constant, but the optimization problem changes from maximizing $E[U(W_T)]$ (one-shot) to maximizing $\lim_{T\to\infty} \frac{1}{T} E[\log(W_T)]$ (repeated growth) *if* that is the goal. Or, better, acknowledge that for a CRRA agent, the optimal fraction is constant regardless of horizon (Merton's problem), but Full Kelly is a special case.
      *   *Revision:* "(6) For a one-shot bet, maximize $E[U(W)]$. For repeated bets, maximize $E[U(W_T)]$ over the horizon. Note that for CRRA utility, the optimal betting fraction is actually constant regardless of horizon, but converges to Kelly only as risk aversion $\to 1$ (Log) or Horizon $\to \infty$ (Growth rate focus)."

  ### Summary of Recommended Edits

  To make your position bulletproof for a reading group, I suggest tweaking the six points to this configuration:

  1.  **One-shot:** Maximize Expected Utility with your actual concave $U(w)$. (No change)
  2.  **Repeated (Growth):** Kelly maximizes the **time-average geometric growth rate**. It almost surely outperforms other fixed-fraction strategies in the infinite limit. (Added "time-average" to align with 4).
  3.  **Relationship to EUT:** Kelly is mathematically equivalent to EUT with Log Utility. However, this does not mean all agents *should* have Log Utility. (Softened the "is the whole story" claim).
  4.  **Ergodicity:** For non-ergodic multiplicative processes, the time-average growth rate is the physically relevant metric for a single trajectory, which justifies Log Utility without appealing to subjective risk preferences. (Sharpened the distinction).
  5.  **Fractional Kelly:** This is the optimal policy for agents with CRRA utility where $\gamma \neq 1$. It is not a "mistake"; it is rational risk management for non-log agents. (Clarified that Full Kelly is not universal).
  6.  **Consistency:** The utility function should remain consistent. The difference between one-shot and repeated is not a change in preferences, but a change in the **dynamics of wealth** (additive vs. multiplicative) and the **horizon**. (Added the "why").

  ### The "Gotcha" to Prepare For
  The reading group will likely ask: **"If Ergodicity Economics says Log Utility is derived from dynamics (4), why do you allow for Power Utility/Fractional Kelly (5)?"**

  *   **Your Answer:** Ergodicity tells us what maximizes *wealth growth*. But agents care about *utility of consumption/wealth*. If an agent derives diminishing marginal utility from wealth faster than log (e.g., they need a specific sum for retirement and extra billions don't help), they rationally choose Fractional Kelly. Ergodicity solves the "ensemble vs. time" problem; it doesn't necessarily solve the "consumption smoothing" problem. Distinguishing between **growth optimization** (Kelly) and **utility optimization** (Fractional Kelly) is key.

  ### Final Verdict
  Your position is 90% there. The main risk is stating (2) too strongly ("Kelly is the right rule") which contradicts (5). If you change (2) to "Kelly is the rule for maximizing growth," the system becomes consistent. The tension between EUT and Ergodicity (3 vs 4) is mostly semantic, but clarifying it shows depth.

  Good luck with the reading group. This is a solid framework.
