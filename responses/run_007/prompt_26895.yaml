          *   *Tension:* If Kelly is just EUT with Log, why is it the "right rule" for repeated bets (2) regardless of utility? If my utility isn't Log, (3) implies I shouldn't use Kelly. But (2) implies Kelly is objectively optimal for repeated bets.
          *   *Resolution:* (2) is slightly overstated. Kelly is optimal *for growth*, not necessarily for *utility*. If $U \neq \log$, Kelly might not maximize expected utility even in repeated settings (depending on horizon and discounting).
          *   *Severity:* Moderate. Needs clarification on "right rule."

      *   **(2) vs. (3):**
          *   (2) says Kelly is the rule for repeated bets.
          *   (3) says Kelly is just Log-EUT.
          *   *Tension:* If Kelly is just a specific case of EUT, why does it get special status in (2) as *the* rule for repeated bets? Does repeated betting *force* Log utility?
          *   *Resolution:* This is the core of the Samuelson vs. Kelly debate. Samuelson argued that if you maximize EU for a finite horizon, you don't necessarily converge to Kelly unless $U=\log$. The "almost sure dominance" argument (Breiman) supports (2), but EU maximizers with $U \neq \log$ might still prefer a different strategy for finite $N$.
          *   *Severity:* High. This is the crux of the theoretical debate.

      *   **(2) vs. (4):**
          *   (2) says Kelly maximizes long-run growth.
          *   (4) says time-average growth is the right object (ergodicity).
          *   *Tension:* None. They align perfectly. Ergodicity economics justifies (2) without needing EUT.
          *   *Severity:* None.

      *   **(3) vs. (4):**
          *   (3) says Kelly is just EUT+Log.
          *   (4) says Ergodicity/Time-average is the justification (implying EUT/Ensemble is wrong for repeated cases).
          *   *Tension:* (3) tries to swallow Kelly into standard EUT. (4) suggests standard EUT (ensemble average) is the problem. If (4) is true, (3) is misleading because it validates the EUT framework rather than the ergodic framework.
          *   *Resolution:* You can derive Log utility from Ergodicity (Peters), or you can assume Log utility in EUT. They are mathematically equivalent in outcome but philosophically distinct.
          *   *Severity:* Low/Moderate (Philosophical vs. Mathematical).

      *   **(1) vs. (6):**
          *   (1) One-shot -> Max EU.
          *   (6) One-shot -> Max EU (not Kelly).
          *   *Tension:* None. They are consistent.

      *   **(5) vs. (3):**
          *   (5) Fractional Kelly = Power Utility ($\gamma \neq 1$).
          *   (3) Kelly = Log Utility ($\gamma = 1$).
          *   *Tension:* None. They are consistent within the CRRA (Constant Relative Risk Aversion) framework.

      *   **(2) vs. (5):**
          *   (2) Kelly is the right rule for repeated bets.
          *   (5) Fractional Kelly is optimal for some agents.
          *   *Tension:* If Fractional Kelly is optimal for some agents (due to risk aversion), then "Kelly is the right rule" (2) is too strong. It should be "Full Kelly is the right rule for Log-utility agents."
          *   *Severity:* Moderate. Needs nuance in (2).

  4.  **Synthesize the "Real" Tensions:**

      *   **Tension A: The "Universality" of Kelly in Repeated Settings (2 vs. 3 & 5).**
          *   User claims Kelly is *the* rule for repeated bets (2).
