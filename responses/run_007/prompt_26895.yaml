  6.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about the "finite vs infinite horizon" distinction. For infinite horizon, Kelly dominates almost surely. But EU maximizers with $\gamma > 1$ might still prefer a lower fraction to avoid ruin probability (even if ruin is 0 in Kelly, drawdowns hurt utility). Actually, with CRRA, the optimal fraction is constant. Full Kelly is only optimal if $\gamma=1$.
