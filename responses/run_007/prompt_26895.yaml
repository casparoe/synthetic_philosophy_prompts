      *   **Deep Dive on Tension 2 (EUT vs. Ergodicity):** Address (3) vs (4). The "Domestication" problem. You can't have it both ways easily. Either EUT is universal (and Ergodicity is just a derivation of Log U) or EUT is flawed (and Ergodicity replaces it).
      *   **Deep Dive on Tension 3 (Consistency of Risk Aversion):** Address (1)/(6) vs (2)/(5). Why does risk aversion change with repetition?
