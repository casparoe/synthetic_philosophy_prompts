      *   *LI:* Round $t$, set prices $P_t$. Traders $T_i$ execute trades. Wealth $W_t(T_i)$ changes.
      *   *Mapping:* A trader is essentially a betting strategy. If a trader makes money, the market was "wrong" relative to that strategy. If *no* trader makes unbounded money, the market has "no regret" against the class of poly-time trading strategies.
      *   *Scoring Rule:* In OL, we usually have a proper scoring rule (Brier, Log). In LI, profit *is* the score. It's a linear scoring rule (expected value of shares).
