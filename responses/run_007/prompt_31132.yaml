      *   *Traders:* Polynomial-time algorithms that buy/sell shares based on discrepancies between prices and their internal estimates.
      *   *Goal:* Prices should converge to coherent probabilities (satisfy probability axioms + logical consistency) and learn patterns faster than any poly-time trader can exploit.
      *   *Key Property:* "Logical Induction Criterion" (LIC) - No poly-time trader can make unbounded profit against the market.
