      *   *The Missing Labels:* In standard OL, $y_t \in \{0, 1\}$ arrives at $t+1$. In LI, $\phi$ might be independent of axioms (no truth value in the system) or take exponential time to prove. The feedback loop is not $t \to t+1$. It's $t \to \infty$. The convergence is topological, not just sequential loss minimization.
