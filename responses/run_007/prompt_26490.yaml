prompt: |-
  I'm trying to get clear on what a theory of causation by omission actually has to deliver before I adopt one. Write the desiderata: the full list of requirements an adequate theory must satisfy, with the case or consideration behind each. The theory needs to handle at least the following pressure points: (i) the proliferation problem — if omissions are causes, then everyone who failed to water my plant caused its death, which seems to make causation cheap to the point of vacuity; (ii) the norm-dependence problem — which omissions we pick out seems to track what was expected or normal, but causation is supposed to be an objective relation in the world; (iii) the contrast with actions — law and ordinary judgment treat doing and allowing as different, and a theory owes us an account of whether this tracks a metaphysical difference or merely a pragmatic one; (iv) preemption cases involving omissions, where two independent failures are each sufficient but neither is necessary; (v) consistency with whatever the right general theory of causation turns out to be — counterfactual, process, or otherwise. For each desideratum, say whether it is non-negotiable or merely desirable, and flag any pairs that look jointly unsatisfiable. I want the criteria to do the work: if the list itself shows that no theory can have everything, that is the result I most want to see.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of causation by omission:

  1.  **Analyze the Request:**
      *   **Topic:** Theory of causation by omission (negative causation).
      *   **Task:** Write a full list of desiderata (requirements) an adequate theory must satisfy.
      *   **Specific Pressure Points to Address:**
          1.  Proliferation Problem (too many causes).
          2.  Norm-Dependence Problem (objectivity vs. expectations).
          3.  Contrast with Actions (doing vs. allowing, metaphysical vs. pragmatic).
          4.  Preemption Cases (overdetermination by omission).
          5.  Consistency with General Theory (counterfactual, process, etc.).
      *   **Format:** For each desideratum, state the requirement, the case/consideration behind it, and label it as "Non-Negotiable" or "Desirable."
      *   **Critical Constraint:** Flag jointly unsatisfiable pairs. The user explicitly wants to see if the list itself demonstrates that no theory can have everything ("I want the criteria to do the work").

  2.  **Deconstruct the Pressure Points & Formulate Desiderata:**

      *   *(i) Proliferation Problem:* If I don't water the plant, it dies. But the Queen of England also didn't water it. If both are causes, causation is ubiquitous.
          *   *Desideratum:* **Selectivity/Restriction.** The theory must distinguish between relevant omissions and irrelevant background non-events.
          *   *Tension:* How to restrict without appealing to norms (see ii)?

      *   *(ii) Norm-Dependence Problem:* We usually blame the gardener, not the Queen. This tracks duty/expectation. But causation is usually thought to be mind-independent (physical).
          *   *Desideratum:* **Objectivity.** Causal relations should not depend on human conventions, duties, or expectations.
          *   *Desideratum:* **Normative Sensitivity.** The theory must align with our intuitive judgments, which *are* norm-sensitive.
          *   *Tension:* Objectivity vs. Normative Sensitivity. This is a classic conflict in this literature.

      *   *(iii) Contrast with Actions:* Law distinguishes killing (act) from letting die (omission). Is this a real causal difference?
          *   *Desideratum:* **Symmetry/Parity.** Omissions should be causally equivalent to actions if the counterfactual dependence is the same. (Or: **Asymmetry.** There is a metaphysical difference.)
          *   *Decision:* The prompt asks for a theory of *causation by omission*. If the theory claims omissions *are* causes, it usually leans towards parity. However, the *legal/moral* distinction needs accounting for. Let's frame this as **Action-Omission Parity** (metaphysical) vs. **Pragmatic Distinction**.
          *   *Refinement:* Let's make it a requirement for **Metaphysical Uniformity**. If $A$ causes $E$ and $\neg B$ causes $E$, the causal relation should be of the same ontological kind.
          *   *Counter-Desideratum:* **Moral/Legal Discriminability.** The theory must allow us to distinguish acts from omissions for responsibility, even if causation is the same.

      *   *(iv) Preemption:* Gardener doesn't water. Backup gardener also doesn't water. Plant dies. If Gardener had watered, plant lives. If Backup had watered, plant lives. Neither is strictly necessary (because the other didn't act either).
          *   *Desideratum:* **Handling Overdetermination/Preemption.** The theory must assign causal status correctly in cases where multiple omissions are sufficient.
          *   *Tension:* Counterfactual theories struggle here (neither is necessary). Process theories struggle because there is no process.

      *   *(v) Consistency with General Theory:*
          *   *Desideratum:* **Theoretical Integration.** The account of omission must not require a sui generis metaphysics that breaks the general theory of positive causation.
          *   *Tension:* Positive causation often involves energy transfer/processes. Omissions involve *nothing*. How to integrate?

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *D1: Selectivity (The Proliferation Constraint).* Must rule out the Queen of England.
      *   *D2: Objectivity (The Metaphysical Constraint).* Must not rely on norms *if* causation is physical.
      *   *D3: Normative Alignment (The Intuition Constraint).* Must match our judgments (which rely on norms).
      *   *D4: Parity (The Ontological Constraint).* Omissions and actions should be causally homogeneous.
      *   *D5: Discriminability (The Legal/Moral Constraint).* We must still be able to distinguish acts from omissions for liability.
      *   *D6: Preemption Handling.* Must solve the "two negligent gardeners" case.
      *   *D7: Integration.* Must fit with positive causation.

  4.  **Identifying Tensions (The "Work" of the List):**

      *   *Tension A:* **Objectivity (D2)** vs. **Normative Alignment (D3)**. To solve Proliferation (D1), you usually need norms. But norms violate Objectivity.
      *   *Tension B:* **Parity (D4)** vs. **Discriminability (D5)**. If they are metaphysically the same, how do we ground the legal distinction without it being *just* pragmatic? (The prompt asks if the distinction tracks a metaphysical difference).
      *   *Tension C:* **Integration (D7)** vs. **Existence of Omissions**. If positive causation requires a process/transfer, omissions (absence of process) cannot integrate without changing the general theory.

  5.  **Refining for the User's Goal:**
      The user wants to see if the list shows *no theory can have everything*. I need to make the tensions explicit and label the "Non-Negotiable" status carefully. If I label too many as "Non-Negotiable," the impossibility result becomes obvious. If I label them "Desirable," it's weaker. I should follow the philosophical consensus on what is usually demanded.
      *   *Selectivity* is usually non-negotiable (otherwise causation is useless).
      *   *Objectivity* is contested. Many argue causation *is* norm-laden. I should frame it as a tension between "Physicalist Objectivity" and "Intuitive Accuracy."
      *   *Parity* is the core of the "causation by omission" claim. If you deny parity, you deny the premise. So, for a theory *of* causation by omission, Parity is non-negotiable.
      *   *Integration* is non-negotiable for a *unified* theory.

      *Crucial Move:* I need to structure the "Joint Unsatisfiability" section to highlight the trilemma.
      1.  Causation is objective/physical.
      2.  Omissions are causes.
      3.  Causal selection is non-arbitrary (solves proliferation).
      *You can only pick two.*

  6.  **Finalizing the List Structure:**
      *   Name of Desideratum.
      *   Definition.
      *   Motivation/Case.
      *   Status (Non-Negotiable/Desirable).
      *   *Commentary on Tensions:* Explicitly flag the conflicts.

  7.  **Review against Constraints:**
      *   Did I cover (i) through (v)? Yes.
      *   Did I label status? Yes.
      *   Did I flag jointly unsatisfiable pairs? Yes.
      *   Did I aim for the "impossibility result"? Yes.

  8.  **Self-Correction/Nuance Check:**
      *   *Preemption:* Make sure to specify *omissive* preemption. It's tricky because standard preemption involves positive events. Omissive preemption is like: Gardener A fails, Gardener B fails. If A had worked, plant lives. If B had worked, plant lives. Is A a cause? Counterfactual theory says no (if A worked, B still wouldn't have, so plant lives... wait. If A worked, plant lives. So $\neg A \to Death$. But is it necessary? In early preemption, yes. In late preemption/overdetermination, no.) Let's stick to the requirement that the theory must have *a* verdict that matches intuition.
      *   *Norms:* Be careful not to say norms are definitely out. Some theories (like Hitchcock's) embrace them. The tension is between *Physicalist* intuitions and *Normative* intuitions.
      *   *Action/Omission:* The prompt asks whether the distinction tracks a metaphysical difference. A theory of omission causation usually says "No, it's pragmatic." But the law says "Yes, it matters." The desideratum should be **Explanatory Power regarding Legal Distinction**.

      *Revised Plan for Tensions:*
      1.  **The Proliferation-Norms-Objectivity Trilemma.**
      2.  **The Parity-Distinction Dilemma.**
      3.  **The Integration-Existence Dilemma.**

      Let's write the response.

      *Drafting the Content:*
      *   Intro: Acknowledge the difficulty.
      *   The List: 5-6 core desiderata.
      *   The Conflicts: Explicit section on "Joint Unsatisfiability."
      *   Conclusion: The "Impossible Trinity."

      *Refining Desideratum 2 (Objectivity):* I should split this. One for "Mind-Independence" and one for "Intuitive Fit." That creates the conflict.
      *Refining Desideratum 3 (Action/Omission):* Make it about whether the theory preserves the *distinction* or dissolves it.

      *Let's finalize the "Non-Negotiable" labels.*
      To make the impossibility result strong, I should label the *conflicting* demands as "Non-Negotiable" from different philosophical perspectives, or label one "Non-Negotiable" and the other "Desirable" but note that satisfying the desirable one is required for the theory to be *useful*.
