answer: |-
  Below is a set of desiderata for a theory of causation by omission. I have structured these to reflect the five pressure points you identified, plus a sixth regarding theoretical unity. 

  Per your request, I have labeled each as **Non-Negotiable** (the theory fails if it violates this) or **Desirable** (the theory is weakened but survivable if it violates this). Crucially, the "Conflict Analysis" section following the list demonstrates why satisfying all Non-Negotiable constraints simultaneously may be metaphysically impossible.

  ### The Desiderata

  #### 1. The Selectivity Constraint (Addressing Proliferation)
  *   **Requirement:** The theory must distinguish between *relevant* omissive causes and the infinite background of non-events that are counterfactually related to the effect but causally inert.
  *   **Case/Consideration:** The Queen of England did not water your plant; the plant died. Counterfactually, had the Queen watered it, it would have lived. Yet, intuitively, the Queen is not a cause. A theory that counts the Queen as a cause renders causal explanation vacuous because everything is connected to everything via infinite absences.
  *   **Status:** **Non-Negotiable.** Without selectivity, causal claims lose their explanatory power.

  #### 2. The Objectivity Constraint (Addressing Norm-Dependence)
  *   **Requirement:** The causal relation must hold independently of human conventions, moral duties, expectations, or statistical norms. It must be a mind-independent feature of the world.
  *   **Case/Consideration:** Physical causation (e.g., a billiard ball striking another) does not depend on what we *expect* the balls to do. If causation by omission is to be a genuine relation in the world, it should not fluctuate based on whether the agent had a duty to act. If the gardener and the passerby both fail to save a drowning child, the physical reality of the death is identical; the causal structure should be too.
  *   **Status:** **Desirable.** (Note: This is the primary flashpoint. Many theories sacrifice this to save Selectivity).

  #### 3. The Intuitive Alignment Constraint (Addressing Norm-Dependence)
  *   **Requirement:** The theory's verdicts on specific cases must match robust ordinary and legal judgments about responsibility and causation.
  *   **Case/Consideration:** In the drowning child case, ordinary judgment says the gardener (who was hired to watch) caused the death by omission, but the passerby did not. If a theory claims the passerby is equally a cause (to satisfy Objectivity), it violates our deepest causal intuitions and becomes useless for law and ethics.
  *   **Status:** **Non-Negotiable.** A theory of causation that systematically contradicts causal judgment is not a theory of *our* concept of causation.

  #### 4. The Parity Constraint (Addressing Contrast with Actions)
  *   **Requirement:** The metaphysical nature of the causal relation must be uniform across positive events (actions) and negative events (omissions). If $A$ causes $E$ and $\neg B$ causes $E$, the "causing" relation must be of the same ontological category.
  *   **Case/Consideration:** If positive causation involves energy transfer or physical processes, but omissive causation involves nothing (an absence), then we have two different relations sharing one name. This threatens to make "causation" an equivocal term. A unified theory demands that omissions be ontologically robust enough to stand in relations, or that actions are not as robust as we think.
  *   **Status:** **Non-Negotiable.** (For a theory *of causation by omission*. If you deny parity, you are arguing omissions are not causes, which rejects the project's premise).

  #### 5. The Discriminability Constraint (Addressing Contrast with Actions)
  *   **Requirement:** Even if metaphysical parity holds, the theory must provide resources to distinguish *doing* from *allowing* for the purposes of moral and legal liability.
  *   **Case/Consideration:** The law treats killing (action) more severely than letting die (omission). If a theory claims metaphysical parity (Desideratum 4), it risks collapsing this distinction entirely. It must explain how the distinction survives, even if it is not grounded in the causal relation itself.
  *   **Status:** **Desirable.** (It is acceptable for the theory to relegate this distinction to pragmatics or morality, provided it doesn't deny the distinction exists).

  #### 6. The Preemption & Integration Constraint (Addressing Preemption & General Theory)
  *   **Requirement:** The theory must handle complex counterfactual structures (like preemption) involving omissions without abandoning the general account of positive causation.
  *   **Case/Consideration:** *Omissive Preemption:* Two guards are supposed to watch a post. Both fall asleep. The post is looted. If Guard A had stayed awake, he would have prevented it (Guard B was still asleep). If Guard B had stayed awake, he would have prevented it. Neither omission was strictly necessary (if A wakes, B is still asleep, loot prevented; but if A sleeps, B sleeps, loot happens). Standard counterfactual theories struggle here. Furthermore, if positive causation requires a physical process, how can an absence integrate into that theory without breaking it?
  *   **Status:** **Non-Negotiable.** A theory that works only for simple cases is incomplete.

  ---

  ### Conflict Analysis: Jointly Unsatisfiable Pairs

  The following tensions suggest that no single theory can satisfy all Non-Negotiable desiderata simultaneously. This is the "work" the list was designed to do.

  #### 1. The Trilemma of Omissive Causation
  **Conflicting Desiderata:** (1) Selectivity, (2) Objectivity, (4) Parity.

  *   **The Conflict:** 
      *   If you maintain **Objectivity** (causation is physical/mind-independent) and **Parity** (omissions are causes like actions), you face the **Proliferation Problem**. In a physicalist world, the absence of *any* preventer is physically equivalent. The Queen's non-watering is physically identical in causal structure to the Gardener's non-watering (both are absences of water-input). To maintain Objectivity and Parity, you must accept the Queen as a cause.
      *   This violates **Selectivity** (Non-Negotiable).
      *   To save Selectivity, you must introduce a filter (e.g., "only expected omissions count"). But this violates **Objectivity** (Non-Negotiable for physicalists, Desirable for pragmatists).
      *   To save Objectivity and Selectivity, you must deny that omissions are causes (deny Parity). But this abandons the project of a theory *of causation by omission*.
  *   **Result:** You can have any two, but not all three. Most contemporary theories (e.g., Hitchcock, Schaffer) sacrifice **Objectivity** to save Selectivity and Parity.

  #### 2. The Metaphysical-Pragmatic Dilemma
  **Conflicting Desiderata:** (4) Parity, (5) Discriminability.

  *   **The Conflict:** 
      *   **Parity** demands that the causal relation between "shooting" and "dying" is the same kind of relation as "not-shooting" and "dying."
      *   **Discriminability** demands that we can robustly distinguish the two for law and morality.
      *   If the causal relation is identical (Parity), the distinction between doing and allowing cannot be found in the causation. It must be external (pragmatic/moral).
      *   However, if the distinction is *merely* pragmatic, it becomes difficult to justify the strong legal asymmetry (Non-Negotiable for legal theory). If the causation is the same, why is the liability so different?
      *   If you ground the distinction in metaphysics (e.g., actions involve energy, omissions do not), you violate **Parity**.
  *   **Result:** Satisfying Parity makes Discriminability look arbitrary; satisfying Discriminability (metaphysically) violates Parity.

  #### 3. The Integration Problem
  **Conflicting Desiderata:** (4) Parity, (6) Integration (with Process Theories).

  *   **The Conflict:** 
      *   If your general theory of causation is a **Process Theory** (causation requires transfer of energy/conserved quantities), **Integration** demands omissions fit this model.
      *   But omissions are absences. An absence cannot transfer energy. 
      *   To satisfy **Integration**, you must either: (a) Claim omissions are not causes (violates Parity), or (b) Claim positive events don't actually involve energy transfer (radical revision of physics), or (c) Claim causation is not about processes (switch to Counterfactual theory).
      *   If you switch to a **Counterfactual Theory**, you solve Integration but often fail **Selectivity** (returning to the Queen of England problem) unless you add normative constraints, which violates **Objectivity**.
  *   **Result:** A Process Theory of causation is logically incompatible with Causation by Omission (Parity). You must choose a Counterfactual theory, which then invites the Norm/Objectivity conflict.

  ### Summary of the Impossibility Result

  If you adopt the labels above strictly, **no theory can satisfy all Non-Negotiable desiderata.**

  1.  **Selectivity** + **Parity** $\rightarrow$ Requires Norms $\rightarrow$ Violates **Objectivity**.
  2.  **Objectivity** + **Parity** $\rightarrow$ Requires Proliferation $\rightarrow$ Violates **Selectivity**.
  3.  **Objectivity** + **Selectivity** $\rightarrow$ Requires denying Omissions are Causes $\rightarrow$ Violates **Parity**.

  **Conclusion for Adoption:**
  To adopt a theory, you must choose which Non-Negotiable constraint you are willing to downgrade to "Desirable." 
  *   **The Pragmatist Choice:** Sacrifice **Objectivity**. Accept that causation is partly normative. (Saves Selectivity and Parity).
  *   **The Physicalist Choice:** Sacrifice **Parity**. Deny that omissions are genuine causes; treat them as explanatory tools only. (Saves Objectivity and Selectivity).
  *   **The Nihilist Choice:** Sacrifice **Selectivity**. Accept that the Queen is a cause, but argue this is harmless. (Saves Objectivity and Parity).

  If you require a theory that is strictly physicalist (Objectivity) *and* treats omissions as real causes (Parity) *and* avoids vacuity (Selectivity), **no such theory exists.**
