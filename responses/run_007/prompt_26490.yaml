      *   Intuitive Fit: Non-negotiable (otherwise wrong).
      *   Parity: Non-negotiable (for a theory *of omission causation*).
      *   Integration: Non-negotiable (for a general theory).

      Okay, the conflict between Objectivity and Intuitive Fit is the big one. Most modern accounts sacrifice strict Physicalist Objectivity to save Intuitive Fit (and Selectivity). I need to make sure the user sees this trade-off.

      *Wait, one more thing:* The prompt asks "if the list itself shows that no theory can have everything, that is the result I most want to see." I need to be bold in the "Joint Unsatisfiability" section.

      *Let's build the "Impossible Trinity" explicitly.*
      1.  Causation is a purely physical relation (Objectivity).
