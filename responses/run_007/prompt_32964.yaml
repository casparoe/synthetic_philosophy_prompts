  *(Self-Correction during drafting)*: I need to be careful with Case B. In the US, facilitation payments are technically illegal under the FCPA (though there used to be an exception, it's largely gone/narrowed). The prompt says "It's not illegal." I must accept the prompt's premise. I will treat it as a jurisdiction where it is legal, but ethically questionable. Smith would likely argue that even if legal, if it violates the "general rules" of justice that hold society together, the Impartial Spectator condemns it. I will make sure the procedure highlights this tension.

  *(Self-Correction on Case A)*: The prompt says "Industry standards... not unusually aggressive." This challenges the "General Rules" step. If everyone does it, is it a General Rule? Smith says General Rules come from *experience* of what works for society, not just *what is done*. So the procedure must distinguish "common practice" from "normative rule." I need to make sure that distinction is explicit in Step 5.

