prompt: |-
  so i've been trying to wrap my head around fitch's paradox and i feel like i must be missing something. the way people explain it is: suppose every truth is knowable. now take some truth that nobody actually knows — like, there's some fact about the universe that no one has ever learned. the statement "this fact is true and nobody knows it" would itself be a truth. so by the knowability assumption, it must be possible to know that statement. but you can't know "p is true and nobody knows p" because the act of knowing it would make it false — someone would know p after all. so we get a contradiction, and the argument concludes that all truths are actually known. but that's insane? like clearly there are truths nobody knows. so there's gotta be a logical mistake in the derivation somewhere. is it some kind of self-reference paradox like the liar, or is there a scope issue with the modal operator? where exactly does the proof go wrong?
