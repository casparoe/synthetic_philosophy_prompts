      *   *Label:* "Ludonarrative Consequentialism" or "Factional Legalism." Let's go with **"Contextual Legitimacy Theory."** Moral standing is assigned based on the character's role in the *game loop* (hub vs. combat zone) and their relationship to the *player avatar's current legal status*.

