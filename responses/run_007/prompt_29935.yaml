answer: |-
  This is a fantastic observation. You've basically stumbled onto the difference between **logical necessity** (the philosopher's "but-for" test) and **pragmatic causation** (the engineer's "knob" test).

  Here is the breakdown of what your team is actually doing, why the A/B tests and rollbacks are consistent, and how your postmortem template would look if you changed the underlying theory.

  ### 1. What theory of causation are you using?

  You are using **Interventionist Causation**.

  In philosophy, this is often associated with the idea that $A$ causes $B$ if, by manipulating $A$, you can change $B$. In engineering terms: **A cause is a knob you can turn.**

  *   **The Server/Network:** These are background conditions. You cannot "turn off" the requirement for a server to exist without destroying the system entirely. They are static states.
  *   **The Deploy/Flag:** These are interventions. They are *changes* in the state.

  Your team implicitly agrees on a rule: **We only label something a "cause" if it is a *difference-maker* in the specific time window of the incident.**

  This explains why you don't blame the server being on. The server was on yesterday (no outage) and today (outage). Since that variable didn't change, it can't explain the *difference* in outcome. The deploy *did* change. Therefore, in an interventionist framework, the deploy is the cause.

  ### 2. Are Incident Response and A/B Testing consistent?

  **Yes.** They are the exact same causal logic applied in different time directions.

  *   **A/B Test (Prospective):** You hypothesize $X$ causes $Y$. You turn knob $X$ (flip flag). You observe $Y$ (metric moves).
  *   **Incident Rollback (Retrospective):** You observe $Y$ (outage). You hypothesize $X$ (deploy) caused it. You turn knob $X$ backward (rollback). You observe $Y$ stop (service recovers).

  In both cases, you are establishing causation by **wiggling a variable and watching the system respond.**

  **The Caveat:** The rollback is a "noisy" test compared to an A/B test.
  In an A/B test, you control the traffic split. In a rollback, you are often conflating "the code changed" with "the service restarted." Sometimes the rollback fixes the outage not because the old code was better, but because restarting the service cleared a stuck thread or memory leak.
  *   *Philosophical implication:* Your postmortem might be identifying the *rollback* as the fix, but misidentifying the *code* as the cause. But structurally, you are still using interventionism.

  ### 3. The "But-For" Trap

  You asked if the background stuff (network, servers) should count as causes in a counterfactual sense.
  *   *Counterfactual:* "If the server hadn't been on, the outage wouldn't have happened." -> True.
  *   *Engineering:* "Therefore the server caused the outage." -> False.

  If you adopted a strict "but-for" theory (Logical Necessity), your postmortems would become useless. Every incident would have 500 necessary causes (electricity, DNS, the intern breathing, the deploy).

  Your current practice relies on **Contrastive Causation**. You aren't asking:
  > "Why did the system fail?"

  You are implicitly asking:
  > "Why did the system fail **now** rather than **yesterday**?"

  This filters out all the static background noise (servers, network, physics) and leaves only the deltas (deploys, config changes, traffic spikes). This is why your practice isn't inconsistent; it's just optimized for **actionability**.

  ### 4. Swapping the Theory: How the Template Changes

  Currently, your template assumes **Linear Causation** (Event A $\to$ Failure). This leads to "The deploy caused the outage."

  If you wanted to swap to a theory better suited for complex infrastructure (often called **Systems Thinking** or **Resilience Engineering**), you would stop looking for the "broken part" and start looking for "why the system allowed the break."

  In this view, the deploy didn't *cause* the outage; the deploy **triggered a vulnerability** that existed in the system's design.

  **Here is how your Postmortem Template would change:**

  | Section | Current Template (Linear/Interventionist) | New Template (Systems/Resilience) |
  | :--- | :--- | :--- |
  | **Root Cause** | "The v2.4 deploy introduced a null pointer." | "The deployment pipeline allows uncanaried code to reach 100% of traffic." |
  | **Timeline** | "14:00 Deploy. 14:05 Alert. 14:10 Rollback." | "14:00 Deploy. 14:05 Alert. **14:07 Auto-rollback failed, requiring manual intervention.**" |
  | **Action Items** | "Fix the null pointer in code." | "Implement automatic rollback on error-rate spike." |
  | **Blame** | Implicitly on the engineer who wrote the code. | On the process that allowed a single change to take down the whole system. |
  | **Causal Model** | **Trigger:** What broke it? | **Vulnerability:** Why did it break *so hard*? |

  ### The Practical Takeaway

  You don't need to become a philosopher to fix this, but recognizing the distinction helps you write better action items.

  1.  **Keep Interventionism for Triage:** When the pager goes off, you need to know which knob to turn. "Revert the deploy" is the right causal answer for *restoring service*.
  2.  **Switch to Systems Theory for Prevention:** When writing the postmortem, acknowledge that the deploy was just the *trigger*. The *cause* of the severity was the lack of safeguards (canaries, circuit breakers, blast radius limits).

  **Summary:** Your team is already using a sound philosophical framework (Interventionism). The inconsistency you feel comes from conflating **triggers** (the deploy) with **vulnerabilities** (the lack of safeguards). If you update your template to distinguish between "What triggered this?" and "What allowed this to succeed?", you'll get the best of both worlds.
