prompt: |-
  In a reading group on philosophy of mind, someone made the following case: von Neumann's *The Computer and the Brain* established that neurons are essentially binary logic gates — they fire or they don't — so the brain is, literally, a digital computer. From this he drew the conclusion that consciousness is substrate-independent: if you can run the same computation on silicon, you get the same mind, because the hardware is irrelevant. I'm suspicious of how much work the analogy is doing here, and I suspect von Neumann himself was more cautious than this reading suggests.

  I want a full audit of the analogy. Give me:

  - An explicit mapping: what neural features are being matched to what computational features, and how good each fit really is.
  - The disanalogies that matter: where neural tissue and digital computers come apart in ways that bear on the substrate-independence claim.
  - The smuggled assumptions: what properties of digital computation the analogy quietly imports that the brain may not share.
  - A verdict: once the disanalogies are on the table, does the conclusion that consciousness is substrate-independent survive, or was the analogy carrying it the whole time?

  I want a committed response — defend a definite position, don't just lay out the options. Write the answer in American English.

  After the essay, provide a structured summary as a JSON object with this schema:

  - `mapping`: an array of objects, each with fields `neural_feature` (string), `computational_analog` (string), and `fit` (one of `"strong"`, `"partial"`, or `"strained"`).
  - `critical_disanalogies`: an array of objects, each with fields `neural_reality` (string), `what_the_analogy_imports` (string), and `significance` (one of `"fatal"`, `"serious"`, or `"minor"` for the substrate-independence conclusion).
  - `smuggled_assumptions`: an array of strings, each naming a property of digital computation the analogy imports without argument.
  - `verdict`: an object with fields `conclusion_survives` (boolean) and `bottom_line` (a one-sentence summary string).
