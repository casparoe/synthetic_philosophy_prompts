answer: |-
  Yes, this configuration does have an established name, though it is primarily current within specific circles of normative ethics, game theory, and the Effective Altruism movement. The term is **moral trade**.

  While the phrase might sound generic, it has been technically defined in philosophical literature to denote precisely the phenomenon you describe. The concept was notably formalised by the philosopher Toby Ord in his 2014 essay *Moral Trade*, and further discussed by William MacAskill and others within the rationalist and effective altruism communities.

  Below is a detailed carving of the concept, its necessary conditions, its boundaries, and how it differs from neighbouring concepts, as you requested.

  ### 1. Definition and Origin

  **Moral trade** occurs when two or more agents, holding divergent moral views, agree to perform actions that they would not otherwise have undertaken, in order to better achieve their respective moral goals.

  Crucially, it is not a meeting of minds regarding *what* is good, but a cooperative strategy regarding *how* to bring about the most good as defined by each agent's own lights. It relies on the economic principle of comparative advantage applied to moral utility functions.

  ### 2. Necessary Conditions (The Carving)

  For an interaction to qualify strictly as moral trade, rather than a neighbouring phenomenon, the following conditions must be met:

  *   **Divergent Moral Weightings:** The parties must assign significantly different values to the same outcomes or actions. (e.g., Agent A values outcome $X$ highly and $Y$ moderately; Agent B values $Y$ highly and $X$ moderately).
  *   **Reciprocity and Agreement:** There must be an explicit or implicit pact. The actions are contingent upon one another. If Agent A volunteers at the sanctuary only because they assume Agent B will donate to malaria relief, and vice versa, it is trade. If they do so independently hoping the other might follow suit, it is merely parallel action.
  *   **Additionality:** Each party must perform an action they would not have performed (or would have performed to a lesser degree) in the absence of the agreement. If Agent A was already planning to volunteer at the sanctuary, no trade has occurred; they are merely receiving a gift.
  *   **Positive Valuation of the Counter-Action:** Each party must regard the action they are *performing* (the cost) as morally permissible and net-positive (or at least neutral) according to their own framework. If Agent A believes factory farming abolition is actively *harmful* (e.g., because it distracts from human suffering), they cannot morally trade to support it. They need not view it as *paramount*, but it cannot be morally forbidden or net-negative in their calculus.
  *   **Moral Motivation:** The primary motivation for the exchange must be the realisation of moral value, not personal welfare. If Agent A supports Agent B's cause because it makes Agent B like them more (social capital), that is social exchange, not moral trade.

  ### 3. Differentiation from Neighbouring Concepts

  You correctly identified that standard labels do not quite fit. Here is how moral trade is distinguished from them:

  *   **Vs. Compromise:** In a compromise, parties typically dilute their aims to reach a consensus position (e.g., agreeing to fund a project that partially addresses both concerns but fully addresses neither). In moral trade, neither dilutes their aim; they amplify their primary aim by subsidising the other's priority in exchange for support. Each gets *more* of what they ultimately want, not a middling version of it.
  *   **Vs. Political Logrolling:** Logrolling is structurally similar (vote trading) but is typically driven by self-interest, constituency pressure, or policy preference intensity rather than fundamental moral ideals. Furthermore, logrolling often occurs within a shared institutional framework where the 'currency' (votes) is identical. Moral trade occurs across distinct moral frameworks where the 'currency' (moral value) is subjective to the agent.
  *   **Vs. Economic Exchange:** In a market transaction, both parties seek to increase their own personal welfare or utility (profit, consumption). In moral trade, the 'utility' being maximised is impersonal moral value. Agent A does not benefit personally from Agent B's donation to malaria relief; rather, Agent A's *moral theory* registers a gain in global value.
  *   **Vs. Moral Offsetting:** As you noted, offsetting is intra-agent (I sin, then I donate to balance it). Moral trade is inter-agent. Furthermore, offsetting often implies a licence to do harm, whereas moral trade is purely cooperative regarding positive actions.

  ### 4. Boundary Cases and Limits

  To properly delimit the concept, one must identify where moral trade ceases to apply or becomes impossible.

  *   **Incommensurable Values:** If Agent A believes Agent B's goal is not just less important, but *evil* (e.g., a pro-life activist and a pro-choice activist), moral trade is impossible. Condition 4 (Positive Valuation) is violated. There must be a zone of overlapping permissibility, even if priorities differ.
  *   **The "Free Rider" Problem:** If the agreement is not enforceable or trust is low, one party may accept the benefit without rendering the return. While this is a risk in execution, a failed attempt due to defection is still an attempt at moral trade; however, a relationship where one party consistently gives without return is patronage or gift-giving, not trade.
  *   **Moral Uncertainty vs. Moral Disagreement:** There is a variant of moral trade where a *single* agent trades off actions because they are uncertain which moral theory is true (e.g., "I am 60% sure utilitarianism is right, so I will mostly do utilitarian acts, but I will reserve some resources for deontological acts just in case"). This is *intra-personal* moral trade. Your example is *inter-personal*. Both fall under the umbrella, but the inter-personal variety requires the additional condition of distinct agents.
  *   **Implicit vs. Explicit:** Does the deal need to be spoken? Not necessarily. In long-standing collaborations, parties may develop a tacit understanding of reciprocal support. However, there must be a mutual expectation of reciprocity. If Agent A helps Agent B simply out of altruism with no expectation of return, it is cooperation, not trade.

  ### 5. Alternative Terminology

  While **moral trade** is the most precise philosophical term, you may encounter related phrases in specific subcultures:

  *   **Value Handshake:** A colloquialism used in the rationalist community. It implies a slightly more informal, often broader agreement to cooperate across differing value systems, sometimes extending beyond specific action-for-action swaps into general alliance.
  *   **Cooperative Pareto Improvement:** A game-theoretic description. The arrangement is a Pareto improvement because both agents' moral utility functions are improved without either being worsened. This is accurate but descriptive rather than nominative.

  ### Conclusion

  The phenomenon you have identified is **moral trade**. It is properly delimited as a reciprocal agreement between agents with divergent moral utility functions, wherein each performs a low-cost (for them) but high-value (for the other) action, resulting in a net increase in moral value according to *each* agent's own framework, without requiring convergence on underlying principles.

  It is distinct from compromise because it increases rather than dilutes the realisation of each party's primary goal, and distinct from logrolling because the currency is moral value rather than self-interest or political capital. It requires that neither party views the other's priority as morally forbidden, only as comparatively less urgent than their own.
