      *   The distinction needs to be between *baseline constraints* (biology, scarcity) and *normatively contingent constraints* (specific economic systems, specific threats imposed by agents).
      *   However, the user wants to avoid the loophole where the employer says "poverty is just a background condition."
      *   The fix usually involves distinguishing between *threats* and *offers* relative to a moral baseline, or distinguishing between *natural necessity* and *social coercion*.
