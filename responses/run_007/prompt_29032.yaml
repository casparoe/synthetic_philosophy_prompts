      *   If I refuse a dinner invitation, the cost might be social awkwardness. That exists due to social norms (unchosen). Does that invalidate consent? No.
      *   The key distinction is usually between *coercion* (wrongful imposition of costs) and *hard choices* (difficult but not wrongful constraints).
      *   The argument fails to distinguish between *unchosen conditions that are morally neutral/necessary* (biology) and *unchosen conditions that are morally contestable/imposed by specific agents* (economic systems maintained by force/law).
      *   So, Premise (2) is the flaw. It lacks a normative filter. It treats all unchosen conditions as consent-undermining.

  4.  **Drafting the Diagnosis:**
