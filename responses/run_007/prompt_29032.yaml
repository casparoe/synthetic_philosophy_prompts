      *   The argument collapses because it conflates *natural/necessary constraints* with *socially contingent/coercive structures*.
      *   Premise (2) is the culprit. It states: "An alternative is not genuine if the costs of taking it exist only because of background conditions the consent-giver did not choose and cannot individually escape."
