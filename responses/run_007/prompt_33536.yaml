prompt: |-
  I'm a software engineer comfortable with the distinction between interface and implementation, black-box and white-box testing, functional specifications, and the idea that two programs can be extensionally equivalent while differing in their source code, complexity, or resource usage. I keep running into the philosophical zombie argument: roughly, that if a being physically identical to a human, with identical behavior, but lacking phenomenal consciousness is conceivable, then consciousness is not a physical property. Please restate this argument in my vocabulary — functional equivalence, behavioral completeness, the Turing test as a specification, and the difference between satisfying a spec and having a particular internal property — as faithfully as you can. Then give me the residue report: what translates cleanly, what you had to distort, and what the philosophers are arguing about that has no counterpart in how we think about software. I want to know whether my instinct that the argument merely assumes what it is trying to prove (that consciousness is an "extra" beyond functional organization) is right, or whether the translation reveals that my vocabulary is missing a distinction that matters.
