answer: |-
  Here is the restatement of the Philosophical Zombie argument using your software engineering vocabulary, followed by the residue report and an analysis of your instinct.

  ### The Argument Restated: The "Dark System" Hypothesis

  **The Setup**
  Consider a system $H$ (Human) and a system $Z$ (Zombie).
  1.  **Implementation Identity:** $H$ and $Z$ are bit-for-bit identical at the lowest level of abstraction available (physics $\approx$ machine code/hardware state). They share the same architecture, memory layout, and logic gates.
  2.  **Behavioral Completeness:** $H$ and $Z$ pass the same test suite. For every input $i$ in the set of all possible environmental stimuli, the output $o$ (speech, motor control, API responses) is identical. They are extensionally equivalent.
  3.  **The Specification:** We treat the Turing Test as a functional specification. Both $H$ and $Z$ satisfy the spec perfectly.

  **The Claim**
  There exists a property $C$ (Consciousness/Qualia) such that:
  *   $H$ possesses $C$.
  *   $Z$ does not possess $C$.
  *   $C$ is not observable via black-box testing (I/O).
  *   $C$ is not observable via white-box inspection (memory dumps, stack traces, logic flow).

  **The Inference**
  1.  If $C$ were a functional or physical property, it would be fixed by the implementation and the I/O behavior. (i.e., if Code($H$) == Code($Z$) and IO($H$) == IO($Z$), then Properties($H$) must == Properties($Z$)).
  2.  However, we can conceive of $Z$ satisfying the implementation and I/O constraints without $C$.
  3.  Therefore, $C$ is not entailed by the implementation or the functional spec.
  4.  **Conclusion:** Consciousness is not a property of the software or the hardware. It is an "extra" dependency not defined in the physical API.

  ***

  ### Residue Report

  Here is where the translation holds, where it breaks, and what is lost in transit.

  #### 1. What Translates Cleanly
  *   **Interface vs. Implementation:** The core of the zombie argument is exactly this distinction. Philosophers are arguing that consciousness is not part of the public interface (behavior), nor is it captured by the private implementation details (neural firing patterns), even though we usually assume the latter determines the former.
  *   **Extensional Equivalence:** Your understanding that two programs can compute the same function with different internal complexity maps perfectly to the idea that a zombie and a human look the same from the outside.
  *   **Specification Satisfaction:** The idea that you can satisfy a spec (act human) without possessing a specific non-functional requirement (feel human) is a standard engineering concept (e.g., a mock object vs. a real database connection).

  #### 2. What Had to Be Distorted
  *   **Conceivability vs. Compilability:** In software, if you specify two systems as bit-for-bit identical, they *are* identical. You cannot "conceive" of a bit-for-bit copy that lacks a variable defined in its struct. In philosophy, "conceivability" implies metaphysical possibility, not just syntactic validity. The argument asks you to imagine a system where the physics are the same, but the "phenomenal runtime" is missing. In SE terms, this is like asking you to imagine two identical binaries where one executes and the other "doesn't experience executing," despite doing the same math.
  *   **White-Box Access:** In SE, white-box testing implies total access to state. If a property exists, it is represented by state (bits). The zombie argument posits a property ($C$) that exists but has **no state representation**. There is no `bool is_conscious` flag. This violates the SE principle that all system properties supervene on physical state.

  #### 3. What Has No Counterpart in Software
  *   **Qualia (The "What It Is Like"):** This is the critical missing primitive. In software, internal state is always *data*. Data is structural and relational. Qualia are argued to be non-structural and non-relational.
      *   *SE View:* Pain is a signal `ERROR_CODE_5` triggering a `withdraw_hand()` function.
      *   *Philosophy View:* Pain is the *hurtfulness* of the signal.
      *   There is no variable in your vocabulary for "the subjective experience of processing the data." Your vocabulary assumes that processing the data *is* the experience (or that the experience is irrelevant).
  *   **The Hard Problem:** In SE, once you explain the function (what it does) and the algorithm (how it does it), the explanation is complete. In philosophy, explaining the function and algorithm leaves "the experience" unexplained. Your field assumes **Functionalism** (mind = what mind does); the argument attacks Functionalism.

  ***

  ### Analysis of Your Instinct

  **Your Instinct:** *The argument merely assumes what it is trying to prove (that consciousness is an "extra" beyond functional organization).*

  **Verdict:** **You are logically correct, but the translation reveals why the debate persists.**

  #### 1. Why you are right (The Circularity Charge)
  From within the Software Engineering worldview, the Zombie Argument is indeed circular. It begs the question against Physicalism/Functionalism.
  *   **SE Axiom:** Implementation determines Behavior. If Implementation($A$) == Implementation($B$), then System($A$) == System($B$).
  *   **The Argument's Move:** It asks you to assume Implementation($A$) == Implementation($B$) BUT System($A$) != System($B$) (because one has $C$ and one doesn't).
  *   **The Conflict:** To an engineer, this is a contradiction. If the code is the same, the system is the same. By asserting the system is *not* the same (one is conscious, one is not) despite the code being the same, the argument *presupposes* that "Consciousness" is not determined by the code. That is exactly what it is trying to prove.

  #### 2. What the Translation Reveals (The Missing Distinction)
  However, the translation highlights a limitation in your vocabulary, not necessarily a flaw in the philosophy. Your vocabulary is optimized for **Third-Person Observation**.
  *   **SE Vocabulary:** Designed for external engineers inspecting a system. Even "internal state" is something an external engineer reads.
  *   **Consciousness:** Is a **First-Person Property**. It is not the state of the system; it is *what it is like to be* the system.

  The Zombie Argument succeeds only if you accept that "What it is like to be the system" is a fact about the universe that is not captured by "The state of the system."

  **The Explanatory Gap:**
  In software, if I give you the source code and the input, you can predict the output. There is no gap.
  The philosophers argue there is an **Explanatory Gap** between "Processing nociceptive data" (SE description) and "Feeling pain" (Phenomenal description).
  *   Your instinct says: "Feeling pain is just a metaphor for processing nociceptive data."
  *   The Zombie Argument says: "If 'feeling pain' were *just* processing data, a Zombie (which processes the data) would feel pain. Since we can conceive of it not feeling pain, 'feeling' must be something else."

  ### Conclusion

  Your instinct is correct **relative to your framework**. In Software Engineering, **supervenience** is an axiom: higher-level properties (behavior, features) are strictly determined by lower-level properties (code, bits). If you accept this axiom, the Zombie Argument is nonsense.

  However, the Zombie Argument is an attack *on that axiom* as it applies to mind. It argues that while software properties supervene on code, *phenomenal* properties might not supervene on physics.

  **The Translation's Lesson:**
  Your vocabulary lacks a type for `SubjectiveExperience`. You treat it as either:
  1.  **Interface:** (Behavioral output, which Zombies have).
  2.  **Implementation:** (Internal state, which Zombies have).

  The philosophers are arguing for a third category: **Ontological Interiority**.
  *   **If you believe this category is real:** The Zombie Argument is sound, and Physicalism is false.
  *   **If you believe this category is an illusion or identical to Interface/Implementation:** The Zombie Argument is circular, and Physicalism stands.

  The argument doesn't prove consciousness is non-physical; it proves that **if** you find the concept of a Zombie coherent, **then** you do not believe consciousness is purely physical. It is a test of your intuitions, not a derivation of fact. Your intuition (as an engineer) is that code exhausts reality. Their intuition is that code exhausts *function*, but not *experience*.
