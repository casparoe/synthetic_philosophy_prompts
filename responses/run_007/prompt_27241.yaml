      *   **Theoretical Considerations (Seminar Integration):** Mention Arrow's Impossibility Theorem (no perfect system) but frame it as choosing the *best fit* for our values (majority legitimacy). Mention Condorcet criteria briefly if needed, but keep it accessible.
