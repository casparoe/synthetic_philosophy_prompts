      *   *RCV Analysis:* This is the pitch. It ensures >50%. It reduces negative campaigning (need 2nd choice votes). *Honesty:* Acknowledge non-monotonicity (ranking a candidate higher can hurt them) but argue it's rare and theoretical compared to the practical benefit of majority legitimacy.
      *   *Synthesis/Decision:* Why RCV wins. It aligns best with the committee's charge (legitimacy).
