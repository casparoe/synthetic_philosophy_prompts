answer: |-
  **MEMORANDUM**

  **TO:** Student Government Electoral Reform Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Methodology for Student Assembly Presidential Election

  ### Executive Summary

  The mandate of this committee is to restore legitimacy and confidence to the Student Assembly presidential election. Following the controversy two years ago, wherein a candidate was elected with only 31% of the vote in a six-way race, it is clear that our current plurality system fails to reflect the collective will of the student body when choices are fragmented. After reviewing the available literature, consulting with stakeholders, and analyzing the trade-offs inherent in social choice theory, I recommend the committee adopt **Ranked-Choice Voting (RCV)**, specifically the Instant-Runoff variant, for the upcoming election.

  While Plurality offers familiarity and Approval Voting offers simplicity, RCV best satisfies the committee's primary objective: ensuring the winner commands a majority mandate. This memo outlines the theoretical and practical considerations of all three options, acknowledging that while no voting system is mathematically perfect, RCV represents the most robust fit for our specific institutional needs.

  ### Context and Theoretical Framework

  In our seminar on collective decision-making, we have studied Arrow's Impossibility Theorem, which proves that no ranked voting system can simultaneously satisfy a specific set of fairness criteria (including non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives) in all cases. This theoretical reality is crucial for our deliberation. We are not searching for a "perfect" system, as one does not exist. Instead, we are selecting the system that minimizes the most damaging flaws for our specific context.

  For a student government, the most critical criterion is the **Majority Criterion**: if a candidate is preferred by a majority of voters, that candidate should win. The legitimacy crisis of 2021 occurred precisely because this criterion was violated; 69% of the student body voted *against* the winner, yet the winner claimed a mandate to lead. Therefore, our primary metric for success must be the system's ability to produce a winner with broad, majority support, even if that requires trade-offs in other theoretical areas.

  ### Option 1: Retaining Plurality Voting (Status Quo)

  The argument for retaining simple plurality is grounded in pragmatism and tradition. Proponents on this committee argue that plurality is the "devil we know." It is the system used in most U.S. general elections; students arrive on campus already understanding how to cast a single vote for a single candidate. Administratively, it is the cheapest and fastest method to tabulate, requiring no specialized software or extensive voter education campaigns.

  Furthermore, proponents argue that switching systems in response to a single anomalous outcome (the 31% winner) is an overreaction. In a healthy political environment with two dominant parties or coalitions, plurality rarely produces minority winners. The 2021 result was a function of an unusually crowded field, which may not be the norm.

  **Critique:**
  While the administrative ease of plurality is undeniable, its theoretical flaws are too significant to ignore in a multi-candidate student environment. Plurality is highly susceptible to the **Spoiler Effect** (a violation of the Independence of Irrelevant Alternatives). In a six-way race, two candidates with similar platforms can split the vote, allowing a polarizing candidate with a solid minority base to win. This forces voters into strategic voting—voting not for who they want, but against who they fear. For a student government meant to represent diverse campus interests, a system that punishes ideological diversity by consolidating votes around the "least bad" option is counterproductive. The legitimacy deficit created by a 31% winner is not merely a perception issue; it is a structural failure of the method to aggregate preferences accurately.

  ### Option 2: Adopting Approval Voting

  The second faction advocates for Approval Voting, where voters can select ("approve") as many candidates as they wish. The candidate with the most total approvals wins. The strongest argument for Approval Voting is its cognitive simplicity. It removes the burden of ranking, reducing ballot exhaustion and error.

  From a social choice perspective, Approval Voting has elegant properties. It is immune to the **Condorcet Loser Criterion** violation (it rarely elects a candidate who would lose head-to-head against everyone else) and is less vulnerable to certain strategic paradoxes than ranked systems. Because voters can support both a favorite long-shot and a viable moderate, it reduces the "wasted vote" anxiety inherent in plurality. Some theorists argue it encourages more positive campaigning, as candidates want to be the "second choice" of their opponents' supporters.

  **Critique:**
  However, Approval Voting introduces ambiguity in voter intent. If a student approves of three candidates, the system treats those three preferences as equal weight. It captures *acceptability* but obscures *preference order*. In a student election, where policy differences matter, knowing that a voter prefers Candidate A over Candidate B is valuable information that Approval Voting discards.

  Additionally, while Approval Voting avoids some paradoxes, it does not guarantee a majority winner. In a fragmented field, a candidate could win with 35% approval if the electorate spreads their approvals thinly across many candidates. This fails to solve the specific legitimacy crisis that formed this committee. Finally, while simple in theory, Approval Voting is unfamiliar to the American electorate. Explaining why voting for multiple people is allowed, and strategizing how many to vote for, may create confusion comparable to ranking candidates.

  ### Option 3: Adopting Ranked-Choice Voting (Recommendation)

  I recommend the committee adopt Ranked-Choice Voting (Instant-Runoff). Under this system, voters rank candidates in order of preference (1st, 2nd, 3rd, etc.). If a candidate receives a majority of first-choice votes, they win. If not, the candidate with the fewest votes is eliminated, and their votes are transferred to the next ranked choice on those ballots. This process repeats until a candidate crosses the 50% threshold.

  **Arguments for Adoption:**
  1.  **Majority Legitimacy:** RCV directly addresses the 2021 crisis. It guarantees that the winner eventually secures a majority of the continuing ballots. This provides a defensible mandate, allowing the President to claim they represent more than half of the participating electorate.
  2.  **Freedom of Expression:** RCV mitigates the Spoiler Effect. A student can rank a niche third-party candidate first without fear of helping their least-favored major candidate win. If their first choice is eliminated, their vote transfers to their second choice. This encourages a more vibrant, diverse candidate field without the risk of "splitting the vote."
  3.  **Campaign Tone:** Because candidates need second- and third-choice votes to win in later rounds, they are incentivized to appeal broadly rather than attack narrowly. Negative campaigning risks alienating the supporters of rivals whose votes a candidate might need later. This aligns with our goal of a constructive student political culture.

  **Addressing Theoretical Flaws:**
  We must be intellectually honest about RCV's limitations. In our seminar, we discussed **non-monotonicity**, a paradox where ranking a candidate higher can theoretically cause them to lose, or ranking them lower can help them win. While mathematically possible in RCV, empirical studies show this occurs extremely rarely (less than 1% of real-world elections).

  Furthermore, RCV does not always satisfy the **Condorcet Criterion** (electing the candidate who would beat every other candidate in a head-to-head matchup). However, no system satisfies all criteria simultaneously (per Arrow). We must choose which flaw is more acceptable: the certainty of a minority winner under Plurality, or the rare theoretical anomaly of non-monotonicity under RCV. Given our charge to restore legitimacy, the latter is the preferable trade-off.

  ### Implementation and Conclusion

  Transitioning to RCV requires an investment in voter education. We cannot simply change the rules and assume comprehension. I propose a campus-wide campaign utilizing sample ballots and online tutorials prior to the election. While this incurs a cost, it is a necessary investment in democratic infrastructure. The administrative burden is slightly higher than plurality but manageable with modern tabulation software, and many jurisdictions (including Maine and Alaska) have proven its scalability.

  In conclusion, the choice before us is not between a flawed system and a perfect one. It is between a system with known, damaging flaws (Plurality), a system that sacrifices preference nuance (Approval), and a system that prioritizes majority consensus at the cost of minor theoretical complexities (RCV).

  The legitimacy of this Student Government depends on the belief that the leadership reflects the will of the majority. Plurality cannot guarantee this. Approval Voting may not guarantee this. Ranked-Choice Voting is designed specifically to achieve this. By adopting RCV, we signal to the student body that their nuanced preferences matter, that their votes will not be wasted, and that their President will have the support of the majority. I urge the committee to vote in favor of this recommendation.
