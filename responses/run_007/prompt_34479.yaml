prompt: |-
  A friend at my decision theory reading group keeps saying 'free information is like a free option — it can't have negative value, it's a theorem'. He uses this to claim you should always read the opposing side's evidence, always take the medical test, never refuse a survey result. I'm not convinced but I can't quite pin down why. Audit the analogy: give me the correspondence table between free information and free financial options, then the places where the mapping breaks, and tell me what hidden assumptions the option analogy smuggles in — about the agent's computational limits, about commitment, about strategic settings — that Good's theorem itself doesn't need but the analogy makes you think it does. And then say whether the 'no downside' conclusion survives once the disanalogies are on the table.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** A decision theory reading group.
      *   **The Claim:** "Free information is like a free option — it can't have negative value, it's a theorem." (Attributed to I.J. Good's Theorem).
      *   **The Friend's Conclusion:** Always read opposing evidence, always take medical tests, never refuse survey results.
      *   **The User's Intuition:** Skeptical but can't articulate why.
      *   **The Task:**
          1.  Audit the analogy (Free Information vs. Free Financial Options).
          2.  Create a correspondence table.
          3.  Identify where the mapping breaks (disanalogies).
          4.  Identify hidden assumptions smuggled in by the analogy (computational limits, commitment, strategic settings) that Good's Theorem doesn't strictly need but the analogy implies.
          5.  Evaluate whether the "no downside" conclusion survives given the disanalogies.

  2.  **Analyze the Core Theory (Good's Theorem):**
      *   *What is it?* I.J. Good (1967) proved that for a Bayesian agent maximizing expected utility, the expected value of sample information (EVSI) is always non-negative.
      *   *Why?* Because you can always ignore the information and act as you would have without it. If the information changes your action, it's because the new action has higher expected utility given the new posterior.
      *   *Key Assumptions:*
          *   Bayesian rationality (coherent probabilities).
          *   Expected Utility Maximization.
          *   Costless information (strictly "free").
          *   No computational costs.
          *   No psychological costs (stress, anxiety).
          *   Single agent (no game theory/strategic interaction).
          *   Ability to update and act optimally on the new belief.

  3.  **Analyze the Analogy (Financial Options):**
      *   *What is a financial option?* The right, but not the obligation, to buy/sell an asset at a specific price.
      *   *Why is it valuable?* It limits downside (you don't exercise if it's bad) and captures upside.
      *   *Correspondence:* Information gives you the "option" to change your mind.
      *   *Why does it feel right?* Both involve having a choice *after* uncertainty is resolved (or partially resolved).

  4.  **Drafting the Correspondence Table:**
      *   *Option:* Right to buy/sell later. *Info:* Right to update belief/act later.
      *   *Strike Price:* Threshold for action. *Likelihood Ratio:* Threshold for belief update.
      *   *Underlying Asset:* Stock price. *State of the World:* Truth/Hypothesis.
      *   *Expiration:* Decision deadline. *Decision deadline:* Same.
      *   *Premium:* Cost of option. *Cost of Info:* Zero (in the theorem).

  5.  **Identifying the Breaks (Disanalogies):**
      *   *Processing:* Options don't require mental work to "hold." Information requires cognitive processing to update.
      *   *Psychology:* Options don't cause anxiety (usually). Information can (e.g., medical tests).
      *   *Strategic:* Options are usually market transactions. Information can be adversarial (enemy feeding you disinfo).
      *   *Commitment:* Holding an option doesn't change your nature. Knowing something can bind you morally or legally (e.g., if you know a crime is planned, you might be obligated to report it).
      *   *Precision:* Options are well-defined contracts. Information is often noisy, ambiguous, or open to interpretation.

  6.  **Unpacking Hidden Assumptions (The "Smuggling"):**
      *   *Computational Omniscience:* Good's theorem assumes you *can* calculate the posterior perfectly. The option analogy assumes exercising the option is trivial. In reality, processing info takes time/energy.
      *   *Emotional Neutrality:* The theorem assumes utility depends only on outcomes. The analogy hides the utility cost of *knowing* (anticipatory utility).
      *   *Non-Strategic Environment:* Good's theorem is single-agent. The option market is multi-agent but the *holding* of the option is usually passive. Information can be weaponized.
      *   *Irreversibility of Knowledge:* You can't "un-know" things. You can let an option expire worthless. Knowledge might force a hand (moral/legal).

  7.  **Evaluating the "No Downside" Conclusion:**
      *   Does it survive? No.
      *   Why? Because the real world violates the assumptions of Good's Theorem.
      *   *Costs:* Attention, time, anxiety.
      *   *Strategic:* Information can be poisoned.
      *   *Commitment:* Knowledge creates obligations.
      *   *Bounded Rationality:* We might update incorrectly (bias) leading to worse decisions.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the friend is technically right about the *theorem* but wrong about the *application*. Validate the user's skepticism.
      *   **Part 1: The Correspondence Table:** Clear mapping between Options and Information.
      *   **Part 2: Where the Mapping Breaks:** The disanalogies (Psychology, Computation, Strategy, Irreversibility).
      *   **Part 3: Hidden Assumptions Smuggled In:** Explicitly list the assumptions Good makes that the analogy glosses over (Omniscience, Emotional Void, Passive Environment).
      *   **Part 4: The Verdict:** Does the conclusion survive? (No). Explain *why* the friend's advice is dangerous in practice (e.g., medical anxiety, analysis paralysis, adversarial info).
      *   **Conclusion:** Summarize the nuance. Good's theorem is a normative ideal, not a descriptive rule for bounded humans.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between Good's Theorem itself and the *analogy*. The user asked to audit the *analogy*.
      *   *Nuance:* Good's theorem *does* assume costless info. The friend says "free information." So cost is technically excluded by the premise, *but* "free" usually means monetary cost, not cognitive cost. I need to highlight that distinction.
      *   *Strategic:* Mention "information hazards." Knowing something can put you in danger.
      *   *Commitment:* The "Pascal's Mugging" or "Ulysses Contract" angle. Sometimes ignorance is a commitment device.

  10. **Final Polish:** Check tone (analytical, philosophical, supportive of the user's skepticism). Ensure all parts of the prompt are answered. (The prompt asks for: Correspondence Table, Breaks, Hidden Assumptions, Verdict on Conclusion).

  *(Self-Correction on "Free"):* The prompt says "free information." In economics, "free" usually means zero marginal cost. But for a human, attention is scarce. I must emphasize that *cognitive* cost is the main breaker here.

  *(Self-Correction on "Option"):* A financial option has a market value. Information's "value" is subjective. The analogy holds best in the "right but not obligation" structure.

  *(Final check on Good's Theorem):* Good's theorem specifically proves $E[U|info] \geq E[U|no info]$. It relies on the ability to *ignore* the info. If you can't ignore it (psychologically), the theorem fails. This is a crucial point.

  Okay, ready to write.
answer: |-
  Your skepticism is well-founded. Your friend is citing **I.J. Good's Theorem (1967)**, which mathematically proves that for a Bayesian expected-utility maximizer, the expected value of free information is non-negative. Technically, he is right about the theorem. But he is wrong about the *ecology* in which the theorem applies.

  The "free option" analogy is seductive because it captures the *asymmetry* of information: you can act on it if it helps, and ignore it if it doesn't. However, analogies are pedagogical tools, not proofs. When you audit the mapping between a financial option and a piece of information, the structural integrity collapses under real-world constraints.

  Here is the audit of the analogy, the hidden assumptions it smuggles in, and the verdict on your friend's advice.

  ### 1. The Correspondence Table
  Here is how the analogy maps the domain of **Financial Options** to the domain **Information Acquisition**.

  | Feature | Financial Call Option | Free Information (Good's Theorem) |
  | :--- | :--- | :--- |
  | **The Right** | Right to buy asset at strike price. | Right to update belief and change action. |
  | **The Obligation** | None (can let expire worthless). | None (can ignore info and act on prior). |
  | **Underlying** | Stock price / Asset value. | State of the world / Truth of hypothesis. |
  | **Resolution** | Expiration date price reveal. | Signal arrival / Evidence observation. |
  | **Payoff** | $\max(0, \text{Price} - \text{Strike})$. | $\max_{a} E[U(a) | \text{Posterior}]$. |
  | **Cost** | Premium (usually > 0). | Zero (by definition of "free" info). |
  | **Value Source** | Volatility + Upside capture. | Reduction in decision error. |

  ### 2. Where the Mapping Breaks (Disanalogies)
  The analogy fails because financial options are inert contractual objects, whereas information is an active cognitive input.

  *   **Inertia vs. Processing:** An option sits in a portfolio requiring no work until expiration. Information requires *processing*. You must parse, interpret, and integrate it into your belief network. This consumes cognitive bandwidth (a scarce resource).
  *   **Disposability:** You can let an option expire without it affecting your psychology. You cannot easily "un-know" information. Once received, it alters your posterior probability even if you try to ignore it for decision-making (the "curse of knowledge").
  *   **Emotional Valence:** A stock price going down is a financial loss. A medical test result indicating disease is an immediate *utility loss* (distress, anxiety) independent of the treatment decision. Good's theorem counts utility only in the final outcome, not the intermediate state of knowing.
  *   **Adversarial Injection:** Options are bought on a regulated market. Information can be fed to you by an adversary to poison your prior (e.g., disinformation campaigns). A free option from an enemy is rare; free info from an enemy is common.
  *   **Commitment & Liability:** Holding an option creates no moral obligation. Knowing certain facts can create legal or moral obligations (e.g., if you read a survey result revealing a safety defect, you may be liable if you don't act). Ignorance can be a shield; knowledge removes it.

  ### 3. Hidden Assumptions Smuggled In
  The option analogy feels convincing because it silently imports assumptions that Good's Theorem requires mathematically, but which the analogy makes you forget are *idealizations*.

  #### A. Computational Omniscience (The "Processing" Assumption)
  *   **The Assumption:** The agent can instantly and perfectly update their probabilities and calculate the new expected utility of all available actions.
  *   **What the Analogy Hides:** Exercising an option is a button click. Updating on complex evidence is hard work. If the cost of computation (time, mental energy) exceeds the expected gain from a better decision, the information has negative net value. The analogy assumes **zero cognitive transaction costs**.

  #### B. Emotional Void (The "Anticipatory Utility" Assumption)
  *   **The Assumption:** Utility is derived *only* from the final world-state (e.g., health), not from the belief state (e.g., hope or anxiety).
  *   **What the Analogy Hides:** Financial options don't usually keep you up at night unless you are over-leveraged. Information often does. If knowing a risk exists causes you distress that outweighs the benefit of mitigating it, the information has negative utility. Good's theorem assumes **utility is independent of belief states**.

  #### C. Passive Environment (The "Strategic" Assumption)
  *   **The Assumption:** The source of information is neutral or truthful.
  *   **What the Analogy Hides:** In game theory, information can be a weapon. If an opponent knows you will always accept free information, they can feed you "noise" that looks like "signal" to waste your computational resources or trigger a suboptimal update. The analogy assumes a **single-agent decision problem**, not a game.

  #### D. Revocability (The "Commitment" Assumption)
  *   **The Assumption:** The agent can perfectly ignore the information if it doesn't change the optimal action.
  *   **What the Analogy Hides:** Humans suffer from **attentional capture**. You cannot easily ignore a salient piece of negative information. Furthermore, sometimes you *want* to bind yourself. (e.g., A writer might avoid reading reviews to maintain confidence). The option analogy implies you remain the same agent after receiving info; in reality, information can change your preferences or constrain your future self.

  ### 4. Verdict: Does the "No Downside" Conclusion Survive?
  **No.** Once the disanalogies are on the table, the conclusion that you should *always* accept free information collapses.

  Good's Theorem is a **normative ideal for a Bayesian God**, not a descriptive rule for bounded humans. Here is why your friend's advice is dangerous in practice:

  1.  **Information Hazards:** Some knowledge makes you a target. If you know too much about a criminal organization (even via "free" public records), you may be in danger. An option does not make you a target; knowledge can.
  2.  **Analysis Paralysis:** If you always take the survey result, always read the opposing view, and always take the test, you incur massive **opportunity costs** in time and attention. The "free" option analogy ignores the cost of *holding* the option (mental load).
  3.  **The "Optimizer's Curse":** If your computational limits lead you to update incorrectly (which happens constantly due to bias), free information can systematically degrade your decisions. Good's theorem assumes perfect updating; humans do heuristic updating. Noise can bias heuristics.
  4.  **Moral/Legal Liability:** As mentioned, knowing creates duty. If you refuse the survey result, you can claim ignorance. If you accept it, you accept responsibility. That responsibility has a cost.

  ### Summary for Your Reading Group
  Tell your friend this:
  > "Good's Theorem holds only if the agent is a **disembodied, computationally infinite, emotionally neutral Bayesian updater in a non-adversarial vacuum**. The 'free option' analogy smuggles in the idea that information is inert. It isn't. It consumes attention, creates psychological burden, can be weaponized by adversaries, and creates liabilities. The theorem proves information has no negative *decision-theoretic* value for a God. It does not prove it has no negative *pragmatic* value for a human."

  You are right to be unconvinced. The theorem is true, but the *application* is a category error.
