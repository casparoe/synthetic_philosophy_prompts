prompt: |-
  My friend has gotten really into Dennett's intentional stance stuff, and shes been going around telling me which things she's willing to say have beliefs and which she isnt. So far her calls are: thermostat, no; chess engine, no; Roomba, no; self-driving car, yes; large language model, yes; her dog, yes; spider, no. Her line is that the car literally has beliefs about where the pedestrians are and can be wrong about them, and that when ChatGPT says it thinks the answer is B, there's no reason to withhold 'it believes the answer is B' just because it's a language model. But she insists the thermostat and Roomba just react, the spider is basically a bundle of reflexes, and the chess engine is just search, so none of them believe anything.

  I can think of a few different principles that would fit all those verdicts, and I want to know which one she's actually running. The case I care about: financial commentators say things like 'the bond market believes the Fed will cut rates in June.' Given her track record, would she say the bond market literally has beliefs? I'm less interested in the bare yes or no than in the candidate rules that fit her verdicts, which of them diverge on the market case and what each predicts, your best guess about her answer and why, and what further case would cleanly settle which rule she's running. Also, if she does say the market has beliefs, is she committed to saying the market's beliefs are the same kind of thing as her dog's, or can those come apart?
