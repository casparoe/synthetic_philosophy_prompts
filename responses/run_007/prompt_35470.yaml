      *   *The Strength:* Hart can describe the TRC Act clearly. It is a valid law because it passed the Rule of Recognition (Parliament). No need to moralize its validity.
      *   *The Moral Question:* Hart separates validity from merit. He can say "This is valid law, but is it just?"
      *   *The Worry:* Hart cared about the "minimum content of natural law" (survival). If prosecutions cause civil war, the society doesn't survive. So, pragmatically, Hart might accept the TRC as necessary for the *continuity* of the legal system.
      *   *The Danger:* Hart's separation might make it *too* easy to accept the TRC. If law is just power + rules, does the TRC just look like "victors writing the rules"? Hart would insist on critical morality to judge it, but his legal theory doesn't condemn it.
      *   *Limitation:* Hart's focus is on the *continuity* of a system. Transition is a *break*. His "Rule of Recognition" shifts in a revolution. The TRC is part of that shift. Hart is silent on *how* to judge the shift, only that a new rule of recognition has emerged.

