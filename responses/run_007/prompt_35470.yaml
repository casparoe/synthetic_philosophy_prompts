      *   **Hart's Positivism:** Separation Thesis (Law *is* vs. Law *ought to be*). Rule of Recognition. Minimum Content of Natural Law (survival). Critique of Fuller (confusing efficacy with morality).
      *   **The Conflict:** Apartheid law was "wicked law" (Hart) or "not law/perverted law" (Fuller). The TRC tries to fix the aftermath.
      *   **Key Tension:** The TRC *violates* standard rule of law principles (non-retroactivity, punishment for crime) to achieve a higher moral/political goal (peace, truth). How do H & F handle this *exceptional* moment?

  3.  **Drafting Section 1: Fuller's Perspective (The Inner Morality of Transition)**
      *   *The Problem:* Fuller hates retroactivity. The TRC is inherently retroactive (forgiving past crimes).
      *   *The Nuance:* Fuller cares about *congruence*. Apartheid failed congruence (state murdered while pretending to be lawful).
      *   *Argument A (Critique):* The TRC undermines the integrity of law. It tells citizens "rules don't matter if the political cost is high." It creates a gap between declared law (murder is wrong) and official action (murderers go free).
      *   *Argument B (Defense):* The TRC is a *reparative* measure. Apartheid destroyed the inner morality. You can't return to the rule of law without first clearing the debris. The TRC restores congruence *going forward* by acknowledging the past breach honestly. Publicity (hearings) is high.
      *   *Limitation:* Fuller's theory assumes a functioning system. Transition is a "state of exception." His 8 desiderata are for *making* law, not necessarily *unmaking* liability for regime change.
