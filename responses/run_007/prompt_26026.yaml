      *   *Critique of (1):* Fairness isn't one thing. It's a cluster concept. Equal error rates (predictive parity) vs. Calibration vs. Statistical Parity. You have to pick based on harm.
      *   *Critique of (4):* Violating *one* metric doesn't make it "unfair." It makes it unfair *by that specific definition*. You might satisfy a more relevant definition.
      *   *The "Round Square" Analogy:* Correct the user's analogy. It's not like proving geometry bankrupt; it's like proving you can't be in London and Paris simultaneously. Doesn't mean travel is impossible.
      *   *Advice for the Piece:* Don't say "fairness is impossible." Say "fairness requires choices." Audits should be about transparency of trade-offs, not seals of approval.
      *   *British English Check:* "Realise" not "realize", "centre" not "center", "programme" (if used), "whilst", "amongst" (maybe too much, keep it natural), "maths" not "math". Tone should be collegial.

