          *   Different contexts require different definitions (e.g., healthcare vs. lending).
          *   Trade-offs are necessary, not fatal.
      *   **Address the "Snake Oil" Conclusion:** Audits aren't useless, but they shouldn't claim "perfect fairness." They should disclose *which* fairness was chosen and *why*.
      *   **British English:** Ensure spelling (colour, realise, centre), vocabulary (cul-de-sac is fine, but watch for Americanisms like "program" vs "programme" if applicable, though "algorithm" is standard), and tone (slightly more reserved, polite, analytical).

  5.  **Drafting the Content (Iterative refinement for tone and accuracy):**

      *   *Intro:* Validate the journalist's frustration. It's a classic trap.
