answer: |-
  **Exam Question**

  Expressivism claims that moral judgments express conative attitudes rather than cognitive beliefs. Critics argue this view cannot account for the logical behavior of moral language. Distinguish carefully between the *semantic* challenge of embedding (the compositionality problem) and the *logical* challenge of validity (the equivocation problem). Why does providing a semantic value for embedded moral sentences not automatically secure the validity of moral inferences like *modus ponens*? In your answer, explain why this difficulty persists even for sophisticated quasi-realist accounts that move beyond crude emotivism.

  ***

  **Model Answer**

  Expressivism posits that the primary function of moral language is not to describe reality but to express non-cognitive attitudes, such as approval or disapproval. For the crude emotivist, saying "Stealing is wrong" is equivalent to saying "Boo stealing!" While this captures the motivational force of moral judgment, it generates the Frege–Geach problem when moral sentences appear in unasserted contexts, such as the antecedent of a conditional.

  To understand why this problem is stubborn, one must distinguish between two distinct challenges: the semantic challenge of compositionality and the logical challenge of validity. The semantic challenge asks: What does a sentence like "If stealing is wrong, then lying is wrong" mean? If the antecedent "Stealing is wrong" normally expresses an attitude, it cannot be expressing that same attitude in a conditional, since asserting the conditional does not imply the speaker actually disapproves of stealing. A sophisticated expressivist might solve this by assigning complex semantic values to embedded sentences—for instance, treating them as expressing higher-order attitudes or plans. Blackburn, for example, suggests that accepting the conditional expresses a commitment to a pattern of attitudes. This addresses the compositionality problem by explaining what the sentence *means* without invoking truth-conditions.

  However, solving the semantic problem does not automatically solve the logical problem. The logical challenge concerns the validity of inferences, specifically *modus ponens*. Consider the argument: (1) If stealing is wrong, then lying is wrong; (2) Stealing is wrong; therefore, (3) Lying is wrong. For this argument to be valid, the term "Stealing is wrong" must mean exactly the same thing in premise (1) and premise (2). This is the requirement of univocality. If the meaning shifts—for example, if the premise expresses an attitude while the antecedent expresses a semantic value that does not—the argument commits the fallacy of equivocation and is invalid.

  The stubbornness of the Frege–Geach problem lies here: expressivism denies that moral sentences have truth-conditions, yet standard accounts of logical validity rely on the preservation of truth. If moral sentences are not truth-apt, it is unclear what property is being preserved in valid inference. A sophisticated expressivist can stipulate that embedded sentences have semantic values, but they must also explain why the relation between those values constitutes *logical* validity rather than mere consistency of attitudes. They must reconstruct logic without truth.

  This is why the problem bites even sophisticated quasi-realism. Quasi-realists aim to "earn the right" to talk of truth and validity within an expressivist framework. However, critics like Schroeder argue that unless the expressivist can provide a unified account of the mental state expressed in both asserted and unasserted contexts that mirrors the structure of belief, they cannot guarantee univocality. If the mental state in the antecedent is structurally different from the mental state in the assertion, the logic fails. Thus, the difficulty is not merely finding *a* meaning for embedded sentences, but finding a meaning that allows moral arguments to be valid in the same robust sense as mathematical or descriptive arguments, without collapsing back into cognitivism. The expressivist must replicate the logical structure of truth-conditional semantics using only the resources of attitude expression, a task that remains technically demanding and philosophically contentious.

  ***

  **Marking Scheme**

  **A-Level (Excellent)**
  *   **Distinct Challenges:** Clearly distinguishes the *semantic* problem (what do embedded sentences mean?) from the *logical* problem (why is the inference valid?). Does not conflate the two.
  *   **Univocality:** Explicitly identifies the requirement of univocality for validity and explains the risk of equivocation if the meaning of "Stealing is wrong" shifts between asserted and unasserted contexts.
  *   **Truth-Conditions:** Explains that standard validity relies on truth-preservation and articulates why the lack of truth-conditions creates a structural gap for the expressivist.
  *   **Sophistication:** Addresses why quasi-realism/sophisticated expressivism still struggles (e.g., the need to reconstruct logic without truth, or the "negation problem"). Acknowledges that assigning semantic values is insufficient without explaining the *logical* relation between them.

  **B-Level (Good/Competent)**
  *   **Definition:** Correctly defines expressivism and the Frege–Geach problem generally.
  *   **Embedding:** Identifies that moral sentences behave differently in conditionals than in assertions.
  *   **Validity:** Mentions that *modus ponens* is a problem and notes that expressivism struggles with logic.
  *   **Limitations:** May conflate the semantic and logical challenges (e.g., assumes solving meaning automatically solves validity). May treat sophisticated expressivism as simply "smarter emotivism" without addressing the structural logical deficit regarding truth-preservation.
  *   **Clarity:** Argument is coherent but lacks the precise technical distinction regarding univocality and truth-aptitude found in A-level work.

  **C-Level (Pass)**
  *   Recites the textbook definition of Frege–Geach.
  *   Fails to distinguish between embedding and validity.
  *   Treats the problem as merely about "sincerity" or "assertion" rather than logic and semantics.

  ***

  The crux of this question is testing whether students understand that the Frege–Geach problem is not merely about finding meanings for embedded sentences, but about securing logical validity without truth-conditions.
