answer: |-
  You have hit the exact nerve that makes the Frame Problem the "white whale" of AI philosophy. The confusion you are experiencing is not a failure of your reading; it is a feature of the literature. As you suspected, the "Frame Problem" is often used as a umbrella term for a cluster of distinct but related problems.

  When you strip away the technical debate about frame axioms (the **Narrow Frame Problem**), you are left with the **Broad Frame Problem** (sometimes called the *Relevance Problem*). This is the problem of cognitive economy: *How does a finite system, in real-time, select the tiny subset of facts that matter for a specific action without checking the infinite set of facts that don't?*

  Here is the specification sheet you asked for. These are the desiderata for a solution to the Broad Frame Problem, categorized by necessity, with the tensions explicitly mapped.

  ---

  ### Part 1: The Desiderata (The Spec)

  #### 1. Computational Tractability (The Efficiency Constraint)
  *   **Requirement:** The mechanism for determining relevance must operate within polynomial time (or better) relative to the size of the knowledge base. It cannot require a search through all known facts.
  *   **Motivation:** If the agent must check every fact to see if it changes (or matters), the time required grows linearly with the size of the database. In a rich world, the database is effectively infinite. If you drop this, the agent freezes before acting (the "combinatorial explosion").
  *   **Status:** **Non-Negotiable.** If the solution requires omniscient processing time, it does not solve the problem for a *finite agent*.

  #### 2. Relevance Sensitivity (The Signal/Noise Constraint)
  *   **Requirement:** The system must distinguish between *causal consequences* and *relevant consequences*. (Moving the meeting causes the time to change [causal]; moving the meeting causes the number of planets to remain 8 [causal but irrelevant]).
  *   **Motivation:** Without this, the agent drowns in trivial truths. Dennett's robot fails not because it can't deduce consequences, but because it deduces *all* of them equally.
  *   **Status:** **Non-Negotiable.** This is the definition of the problem. If you don't solve relevance, you haven't solved the Frame Problem.

  #### 3. Robustness to the Qualification Problem (The Safety Constraint)
  *   **Requirement:** The system must handle "unknown unknowns" or rare preconditions without catastrophic failure. (e.g., Moving the meeting is fine, unless the server room floods, unless the CEO quits, unless gravity turns off).
  *   **Motivation:** If the agent relies on a fixed list of "relevant" factors, it will be blindsided by novel exceptions. A system that is efficient but brittle is useless in an open world.
  *   **Status:** **Non-Negotiable (Functional).** An agent that crashes when a rare precondition fails is not an adequate agent.

  #### 4. Representational Generality (The Scope Constraint)
  *   **Requirement:** The solution cannot be hard-coded for a specific domain (e.g., "calendar logic"). It must apply to arbitrary actions in an arbitrary world.
  *   **Motivation:** If you solve relevance for meetings by hard-coding rules about meetings, you haven't solved the cognitive problem; you've just built a specialized tool. The Frame Problem is about *general intelligence*.
  *   **Status:** **Contested.** (See Tensions below). Many practical AI systems drop this to function.

  #### 5. Semantic Grounding (The Meaning Constraint)
  *   **Requirement:** The determination of relevance must depend on the *meaning* of the symbols, not just their syntactic manipulation.
  *   **Motivation:** A system might statistically correlate "meeting" with "room," but if it doesn't understand that a meeting *requires* a participant, it might schedule a meeting for a rock. Fodor argues syntax alone cannot fix reference or relevance.
  *   **Status:** **Camp Preference.** Logical AI often tries to bypass this with formal semantics; Embodied/Connectionist AI insists this is the only way to solve it.

  ---

  ### Part 2: The Tensions (The "Choose Your Poison" Matrix)

  This is the critical insight you are looking for. **These desiderata cannot be jointly satisfied.** The history of AI is the history of deciding which constraint to violate.

  #### Tension A: Tractability (1) vs. Qualification Robustness (3)
  *   **The Conflict:** To be perfectly robust against all exceptions (Qualification), you must check for an infinite number of preconditions (e.g., "is there a bomb?", "is there a flood?", "is there a demon?"). To be tractable, you must ignore most preconditions.
  *   **The Trade-off:** You can have a fast agent that is occasionally blindsided (brittle), or a safe agent that is computationally paralyzed.
  *   **Who Gives Up What?**
      *   **Classic Logicists (McCarthy/Reiter):** Prioritize Robustness (via non-monotonic logic). They often struggle with Tractability in complex domains.
      *   **Behaviorists/Robotics (Brooks):** Prioritize Tractability. They drop the internal model entirely to ensure speed, accepting that the robot might walk off a cliff if it hasn't "seen" it yet.
      *   **Your Calendar Agent:** You are likely prioritizing Tractability. You assume "no conflicts" unless explicitly told otherwise. You will fail if a hidden constraint exists (e.g., "This meeting requires a specific projector that is broken").

  #### Tension B: Generality (4) vs. Tractability (1)
  *   **The Conflict:** A general mechanism for relevance (one that works for bombs, batteries, and meetings) requires a high-level abstraction that is expensive to compute. Domain-specific heuristics are fast but don't generalize.
  *   **The Trade-off:** You can have a general intelligence that is slow, or a specialized intelligence that is fast.
  *   **Who Gives Up What?**
      *   **GOFAI (Good Old-Fashioned AI):** Tried to keep Generality. Struggled with Tractability.
      *   **Modern LLMs/Neural Nets:** Effectively drop strict Generality for Statistical Tractability. They guess relevance based on training data patterns. They work well until they encounter an out-of-distribution scenario (hallucination).
      *   **Embodied Cognition:** Drops Generality in favor of *Situatedness*. Relevance is determined by the specific body and environment, not a general logic.

  #### Tension C: Semantic Grounding (5) vs. Formal Tractability (1)
  *   **The Conflict:** Determining relevance based on "meaning" (semantics) is philosophically sound but computationally undefined. Determining relevance based on "syntax" (rules/statistics) is computable but arguably misses the point of "aboutness."
  *   **The Trade-off:** You can have a system that manipulates symbols efficiently, or a system that understands what they mean (if that's even possible computationally).
  *   **Who Gives Up What?**
      *   **Fodor/Philosophers:** Argue that without (5), you haven't solved the problem, you've just masked it.
      *   **Engineers:** Ignore (5). If the calendar works, who cares if the agent "understands" time?

  ---

  ### Part 3: Scorecard of Popular Approaches

  Here is how the major camps fail against your spec. This explains why the debate is stalled: everyone is solving a different row of this table.

  | Approach | Solves Tractability? | Solves Robustness? | Solves Generality? | The Fatal Flaw |
  | :--- | :--- | :--- | :--- | :--- |
  | **Classic Logic (Situation Calculus)** | ❌ | ✅ | ✅ | **Combinatorial Explosion.** It formally solves the Narrow problem, but searching for relevant axioms in a large database is still intractable. |
  | **Non-Monotonic Logic** | ⚠️ | ✅ | ✅ | **Complexity.** Default reasoning helps, but determining *which* defaults apply is itself a Frame Problem. |
  | **Embodied / Subsumption (Brooks)** | ✅ | ❌ | ❌ | **Brittleness.** By avoiding internal representation, they avoid the Frame Problem, but they can't plan complex, abstract sequences (like a calendar). |
  | **Probabilistic (Bayesian Nets)** | ⚠️ | ⚠️ | ✅ | **Knowledge Acquisition.** You need to define the dependencies beforehand. If you don't know two variables are linked, the probability won't save you. |
  | **Predictive Processing (Active Inference)** | ⚠️ | ⚠️ | ✅ | **Compute Cost.** Minimizing surprise requires massive simulation. It pushes the problem into perception, but doesn't eliminate the cost. |
  | **LLMs / Transformers** | ✅ | ❌ | ⚠️ | **Hallucination/Reliability.** They solve relevance via statistical attention (very fast), but they fail the Robustness constraint (they miss rare "bombs"). |

  ### Part 4: The Verdict for Your Agent

  You asked for the spec so you could evaluate your calendar agent. Here is the hard truth derived from the desiderata:

  **You cannot solve the Broad Frame Problem.**

  If you could, you would have solved AGI. The literature is confused because people are trying to sell partial solutions as total ones.

  For your calendar agent, you must explicitly choose which desideratum to violate.
  1.  **If you prioritize Tractability:** You assume the world is "closed" (nothing matters unless I know about it). *Risk:* You will schedule a meeting during a power outage you didn't know about.
  2.  **If you prioritize Robustness:** You try to check external APIs for weather, traffic, holidays, user mood, server status. *Risk:* The agent becomes slow, complex, and fragile (APIs fail).
  3.  **If you prioritize Generality:** You try to build a reasoning engine that can handle "meetings" and "nuclear launches" with the same logic. *Risk:* You will spend 5 years building a logic engine and never ship the calendar.

  **Recommendation:**
  Acknowledge that you are solving the **Narrow Frame Problem** (efficiently updating state) within a **Domain-Specific Context** (violating Generality).
  *   **Accept:** You will miss rare conflicts (Violate Robustness).
  *   **Accept:** You are using syntactic rules, not semantic understanding (Violate Grounding).
  *   **Insist:** It must run in milliseconds (Keep Tractability).

  The "Frame Problem" in philosophy is a proof that perfect relevance detection is impossible for finite agents. The "Frame Problem" in engineering is a budget decision: *How much compute do I spend on checking for edge cases before I just let the user handle it?*

  Your confusion stems from reading philosophers who demand a solution to the impossible (Perfect Relevance + Finite Compute) while reading engineers who simply ignore the impossible and ship the product. Both are right, within their own constraints.
