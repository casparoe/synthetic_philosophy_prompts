answer: |-
  Diagnosis of the Impasse

  The stagnation you describe is not merely a failure of imagination or a lack of new evidence. It is a structural incommensurability between two distinct conceptions of what philosophical discourse is for. The impasse is primarily **methodological**, but it presents itself as a **substantive** disagreement because the critics refuse to recognise the Wittgensteinian methodological shift as a legitimate philosophical move.

  To be specific: the disagreement turns on the status of **normativity** and the **standpoint of the philosopher**.

  **1. The Commitments of the Critics (The Theoretical Imperative)**
  The critics (from Bambrough to contemporary analytic metaphysicians) operate under a commitment that philosophical inquiry is inherently **explanatory**. Their core assumption is that if we use a concept successfully, there must be a fact of the matter—structural, psychological, or semantic—that *makes* our usage correct.
  *   **On Theory:** When they accuse family resemblance of being a 'covert theory', they mean that any claim about how concepts function is a hypothesis about the underlying machinery of meaning. If Wittgenstein says 'game' lacks an essence, the critic hears a claim about the structure of the concept 'game'.
  *   **On Relevance:** The objection regarding 'relevant similarities' is a demand for **normative constraints**. The critic argues that if anything can resemble anything in some respect, family resemblance cannot distinguish correct from incorrect application. Therefore, there must be a rule or condition that selects *which* similarities matter. They are asking for a meta-rule that governs the application of the concept.
  *   **The Standpoint:** They assume the philosopher can stand outside language use to inspect it and lay down conditions for its coherence.

  **2. The Commitments of the Wittgensteinians (The Descriptive Imperative)**
  The Wittgensteinians operate under a commitment that philosophical inquiry is **descriptive** or **grammatical**. Their core assumption is that the demand for an underlying explanation is itself the source of philosophical confusion (the 'craving for generality').
  *   **On Theory:** When they insist family resemblance is 'not a theory', they mean it is not an explanatory hypothesis positing hidden entities or structures. It is a **perspicuous representation** of what is already open to view. To call it a theory is to misunderstand the grammatical point as a scientific one.
  *   **On Relevance:** The reply regarding relevance is that relevance is not determined by a meta-rule, but by **training and practice within a language-game**. To ask 'what makes a similarity relevant?' is to ask for a justification of a practice from a standpoint outside that practice. For the Wittgensteinian, the 'rule' is found in the custom of using the word, not in a formulation that precedes it.
  *   **The Standpoint:** They assume the philosopher is embedded in language and cannot transcend use to judge it. The task is to dissolve the illusion that a theoretical foundation is needed.

  **3. The Structure of the Disagreement**
  The impasse arises because the critics treat the Wittgensteinian's grammatical remarks as failed theoretical claims, while the Wittgensteinians treat the critics' theoretical demands as symptoms of the confusion they are trying to cure.

  *   When the critic asks, "What determines relevance?", they are asking for a **truth-condition**.
  *   When the Wittgensteinian replies, "Look at how we use it," they are offering a **use-condition**.

  The critic hears this as an evasion (refusing to specify the truth-condition). The Wittgensteinian hears the question as a category mistake (assuming meaning requires truth-conditions of that sort). Consequently, every round of the debate sees the critic tightening the demand for precision (theory), and the Wittgensteinian widening the context to show the demand is misplaced (therapy). They are not answering the same question because they disagree on whether the question is intelligible.

  **4. Prospects for Progress**
  You asked for an honest answer on whether anything could move this forward.

  *   **Empirical Findings:** Cognitive science (e.g., prototype theory) has largely vindicated the *phenomenon* of family resemblance. However, this does not resolve the philosophical impasse. The critic can concede that human categorisation is prototype-based but maintain that *normative* meaning (what we *ought* to mean) still requires necessary and sufficient conditions. Wittgenstein was not doing psychology; he was investigating the grammar of our concepts. Empirical data cannot settle a grammatical investigation.
  *   **Formal Results:** Fuzzy logic or probabilistic semantics can model family resemblance formally. Yet, this merely provides a formal system that mimics the behaviour. It does not answer the philosophical worry about what *grounds* the correctness of the application. It turns the problem into a technical one, which bypasses the philosophical dispute rather than solving it.
  *   **A Change of Question:** The only way to break the impasse is to explicitly acknowledge the methodological divide. One must ask: "Are we trying to explain the possibility of meaning (theory), or are we trying to dissolve the bewitchment of our intelligence by means of language (therapy)?"

  **Conclusion**
  The sensible thing is to stop expecting progress in the sense of one side refuting the other. The two sides are engaged in different projects. The critics are engaged in **constructive metaphysics** or **philosophy of mind**, seeking to model semantic competence. The Wittgensteinians are engaged in **conceptual therapy**, seeking to dissolve the urge to model semantic competence in that specific way.

  If you treat the debate as a substantive disagreement about how concepts work, you will remain stuck, because the Wittgensteinian denies there is a 'how' to be discovered in the sense the critic requires. If you treat it as a verbal dispute about 'theory', you underestimate the depth of the methodological rift.

  For your seminar, the most productive path is to frame the impasse not as a failure to solve the problem of family resemblance, but as a **choice of philosophical temperament**. The question for your students should not be "Who is right about family resemblance?" but "Which conception of philosophy is more fruitful for the problems we wish to address?" If one wants to build a cognitive model of language, the Wittgensteinian is an obstruction. If one wants to understand why we feel compelled to seek essences where there are none, the critic is missing the point. Recognising this distinction allows the discussion to move from a circular argument to a clarification of aims.
