      *   *The "Theory" Charge:* Critics say, "If you say concepts work by family resemblance, you are proposing a theory of concepts." Defenders say, "I am not proposing how concepts *work*; I am showing you that your demand for how they *work* (in terms of essences) is misguided."
      *   *The "Relevance" Objection:* Critics ask, "What makes a similarity relevant?" Defenders say, "Relevance is determined by use/context, not by a meta-theory." Critics reply, "So you need a theory of context/use."
      *   *The Stagnation:* It stagnates because the critics keep demanding justification within a theoretical framework that the Wittgensteinians explicitly reject as the source of the confusion.

  3.  **Evaluate the Options for Diagnosis:**
      *   *Option A: Substantive Disagreement.* Is there a fact of the matter about concepts waiting to be discovered? Cognitive science might weigh in here (prototype theory vs. classical definitions). But the Wittgensteinian isn't making a psychological claim; they are making a grammatical one. So, likely not purely substantive in the empirical sense.
      *   *Option B: Methodological Disagreement.* This seems strongest. One side wants an *explanation* (theory of meaning); the other wants a *description* (perspicuous representation).
      *   *Option C: Verbal Dispute.* Is it just about the word 'theory'? Partly, but it runs deeper. It's about the *aim* of philosophy.

  4.  **Formulate the Diagnosis (Drafting the Core Argument):**
      *   The impasse is primarily **methodological**, but it masquerades as a substantive disagreement because the critics refuse to accept the Wittgensteinian methodological shift as legitimate philosophy.
      *   *Critics' Commitment:* Philosophy must provide necessary and sufficient conditions or a functional model (theory) to explain linguistic competence. If Wittgenstein offers an alternative (family resemblance), it must be a competing theory.
      *   *Wittgensteinians' Commitment:* The demand for a theory is the disease. The "solution" is not a better theory but the dissolution of the demand. Family resemblance is a *grammatical observation*, not a *hypothetical explanation*.
