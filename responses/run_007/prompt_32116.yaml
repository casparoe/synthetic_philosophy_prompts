      *   *Change of Question:* The only way forward is to acknowledge the methodological divide. If one accepts the therapeutic aim, the "relevance" objection dissolves (relevance is internal to the language-game). If one rejects the therapeutic aim, Wittgenstein is simply wrong/incomplete.
      *   *Conclusion:* It is best to treat them as different projects. Expecting "progress" in the sense of one side winning is category mistake.

