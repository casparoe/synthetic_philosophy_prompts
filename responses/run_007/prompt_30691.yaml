answer: |-
  ### The case for positive pure time preference

  Proponents argue that a positive pure rate of time preference reflects observed human psychology; we naturally prioritize present satisfaction over distant futures. Ethically, this prevents what Parfit called the "absurd result": if we value future utils equally, we might be obligated to sacrifice immense present welfare for marginal future gains, potentially stifling current development. This is often framed as a requirement of rationality regarding resource allocation. If capital yields positive returns, consuming today costs more than consuming tomorrow in terms of foregone investment growth. Furthermore, assuming economic growth continues, future generations will likely be wealthier; a dollar (or util) matters less to them than to us today due to diminishing marginal utility. Discounting ensures intergenerational equity doesn't become intergenerational tyranny, where the present lives in austerity to subsidize a richer future. It treats time as a scarce resource, acknowledging that investment returns today could yield greater absolute benefits later, even if discounted. Thus, discounting is a pragmatic tool to balance current needs against speculative future claims, avoiding paralyzing moral demands that could halt progress entirely. It respects the distinctness of persons across time while acknowledging practical limits on sacrifice. Without discounting, the present becomes a slave to the future, potentially violating duties to current sufferers whose needs are certain and immediate.

  ### The Ramsey case against

  Frank Ramsey famously declared pure time preference "a practice which is ethically indefensible and arises merely from the weakness of the imagination." The core argument is temporal impartiality: the date of an experience should not affect its moral weight. Just as we reject spatial discounting (valuing a suffering person less because they are far away), we should reject temporal discounting. A util is a util, regardless of when it occurs. To discount purely based on time is to discriminate against future persons simply because they do not exist yet, which violates principles of equality. Sidgwick and Parfit reinforced this, arguing that rationality demands consistency across time. If I care about my future self, I should care about future others similarly. The only legitimate discount factor is probability: if there's a chance humanity won't exist, that risk justifies lower expected value, but not the mere passage of time. Ethically, we stand on the shoulders of the past; we shouldn't compound that advantage by ignoring those who stand on ours. To impose costs on the present to prevent catastrophic harm later is not tyranny, but justice. This view separates descriptive psychology from normative ethics. While humans *do* discount, that describes a bias, not a moral truth. Policy should correct for our myopic biases, not codify them into law. Ignoring future harms because they are distant is a failure of moral reasoning.

  ### Where the real disagreement lies

  The fault line isn't mathematical; it's metaphysical and meta-ethical. It concerns the moral status of potential people and the definition of rationality. For discounters, rationality is tied to agency and opportunity cost within a specific timeframe; ethics must accommodate human limitations. For Ramseyians, rationality is universal consistency, and ethics is agent-neutral. The debate also hinges on the role of economics: is it a descriptive science of behavior or a normative guide for policy? Nordhaus treats discounting as a market parameter revealed by behavior; Stern treats it as an ethical parameter chosen by principle. Ultimately, it's a clash between "contractualist" views (what current agents agree to) versus "utilitarian" views (maximizing total good regardless of identity). It questions whether the present generation owns the future or stewards it. Additionally, there is a disagreement about identity. Discounting often assumes distinct generations with separate interests, whereas the Ramsey view assumes a continuous stream of welfare where identity matters less than total sum. The deep conflict is between a pragmatic ethics of feasibility versus an ideal ethics of truth. One side asks, "What can we sustainably demand?" while the other asks, "What is objectively right?" This transforms the issue from a technical calibration into a fundamental question about whether morality transcends the present moment.

  ### My verdict

  Ethically, the Ramsey case is stronger. Discriminating based on time is hard to justify without appealing to bias, similar to spatial or racial discrimination. A util experienced in 2100 is morally equivalent to one in 2024. However, pure impartiality risks the "absurd result" of infinite saving if growth rates are high. The solution lies in separating pure time preference from probability discounting. We should value future utils equally but acknowledge existential risks and diminishing marginal utility based on wealth, not time. Policy should reflect near-zero pure time preference to avoid catastrophic negligence, while using probability adjustments for genuine uncertainties. This respects future persons as moral equals without demanding impossible sacrifices from the present. We must reject the idea that time itself diminishes value, but accept that our ability to affect the future diminishes with uncertainty. The verdict: adopt Ramsey's ethics for principle, but use risk-adjusted models for implementation.
