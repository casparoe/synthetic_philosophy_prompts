prompt: |-
  I've been going down a rabbit hole lately about how we should think about the future — like, really distant future, centuries from now. A friend who works in climate policy was telling me about the whole Stern vs. Nordhaus debate, and it got me thinking about the underlying philosophical issue: should we discount the wellbeing of future generations simply because they're far away in time? It seems like one of those questions where your answer has massive practical consequences but the arguments get weirdly abstract really fast.

  Specifically, I'm trying to wrap my head around the disagreement between two positions. On one side, you have what economists often do in practice: apply a positive "pure rate of time preference," which means you literally value a util less the further in the future it occurs, even if you're certain the person will exist and the util is just as real. On the other side, you have the view associated with Frank Ramsey (and later picked up by people like Sidgwick and Parfit) that pure time preference is irrational or ethically indefensible — that we should be temporally impartial, and the only legitimate reason to discount future benefits is uncertainty about whether they'll materialize (e.g., extinction risk).

  I get the abstract arguments on both sides, but I'm struggling to see where the deepest philosophical fault line actually lies. Is this ultimately a disagreement about rationality, about ethics, or about something else entirely — like how we should model human psychology versus how we should prescribe policy? And does one side have a clearly stronger case once you push past the surface-level arguments? I'd especially appreciate it if you could avoid just rehashing the Stern-Nordhaus numbers and focus on the conceptual underpinnings.

  Please structure your response in the following sections:
  - "The case for positive pure time preference" (~200 words)
  - "The Ramsey case against" (~200 words)
  - "Where the real disagreement lies" (~200 words)
  - "My verdict" (~150 words)
