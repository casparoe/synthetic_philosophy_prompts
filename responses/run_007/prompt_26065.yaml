answer: |-
  The pattern of animal welfare law you describe does not reflect a coherent philosophical theory of moral status, but rather a heuristic proxy that conflates biological similarity with moral worth, heavily discounted by economic and cultural friction. To reconstruct the implicit theory, distinguish its logical requirements from mere compatibilities, expose its inconsistencies, and project a sentientist alternative, we must analyze the legal architecture as a system of operational values.

  ### 1. Reconstruction of the Implicit Theory
  The legal structure presupposes a theory of **Phylogenetic Gradualism constrained by Economic Pragmatism**.

  *   **Phylogenetic Gradualism:** The law operates on the assumption that moral status is a scalar property that correlates with evolutionary proximity to humans. Mammals (highest status) > Birds (intermediate/variable) > Fish (low) > Invertebrates (negligible). This is not explicitly stated as "mammals are morally superior," but is operationalized through neurological proxies (e.g., the presence of a neocortex or "warm-bloodedness") that serve as stand-ins for the capacity to suffer. The system assumes that if a being looks and acts sufficiently like a human (facial expressions, vocalizations, fur/feathers), its internal experience is legible and morally weighty; if it is cold-blooded or lacks a face, its experience is presumed opaque or non-existent.
  *   **Economic Pragmatism:** The theory is heavily modified by a "feasibility constraint." Even if a class of animals were granted moral status, the law presupposes that their protection is contingent on the cost of enforcement and the disruption to industry. The exclusion of poultry from the U.S. Humane Methods of Slaughter Act (despite being warm-blooded vertebrates) reveals that economic efficiency can override phylogenetic proximity. Thus, the implicit formula is: *Legal Protection = (Phylogenetic Similarity × Perceived Sentience) / Economic Cost of Regulation.*

  ### 2. Presupposition vs. Compatibility
  It is crucial to distinguish what the law *entails* from what it *permits*.

  *   **Strict Presupposition:** The law strictly presupposes that the interests of excluded groups (fish, crustaceans, poultry in the US) are **legally negligible**. It does not necessarily presuppose they lack sentience *ontologically*, but it operationalizes a presumption that their suffering does not generate a state interest strong enough to justify regulatory friction. The system acts *as if* their pain does not count, regardless of whether legislators privately believe it exists.
  *   **Mere Compatibility:** The status quo is *compatible* with a belief in fish sentience, but only if paired with a "tragic trade-off" justification (e.g., "They suffer, but feeding the poor is more important," or "We cannot verify their pain scientifically enough to regulate"). However, a legislator cannot consistently hold that "fish suffering is morally identical to pig suffering" and endorse the status quo without contradiction. The law allows for the *possibility* of sentience in excluded groups, but it forbids that sentience from triggering *protection*. Therefore, the law presupposes a **threshold deontology**: suffering matters only after crossing a specific biological or economic threshold, below which it is morally invisible.

  ### 3. Internal Inconsistencies
  The implicit theory collapses under scrutiny because the biological proxies used do not align with the stated or implied moral goals.

  *   **The Poultry Anomaly:** In the U.S., the Humane Methods of Slaughter Act protects cattle (mammals) but excludes chickens (birds). If the theory were "warm-blooded vertebrates feel pain," poultry should be included. If the theory were "all vertebrates feel pain," fish should be included. The exclusion of poultry suggests the theory is not biological at all, but cultural (cows are "livestock" in a traditional sense; chickens are "units" of industrial production).
  *   **The Warm-Blooded Fallacy:** The U.S. Animal Welfare Act excludes cold-blooded species. However, modern neuroscience indicates that pain perception does not require endothermy. Fish possess nociceptors and opioid receptors; decapods show complex avoidance learning. The law relies on an outdated neurological model (cortex-centric pain) that contradicts current ethological data, creating a gap between legal reality and biological reality.
  *   **The Invertebrate Lag:** The EU's recent inclusion of decapods acknowledges sentience but treats it as a new discovery rather than a logical extension of vertebrate protection. If the principle is "capacity to suffer," the delay implies the law responds to political pressure rather than moral truth. The inconsistency lies in protecting a cow from stress while allowing a lobster to be boiled alive, despite evidence that the lobster's nociceptive experience is intense and prolonged.

  ### 4. The Sentientist Overhaul
  If we replaced the current implicit theory with a **Straightforward Sentientist View** (any being capable of valenced experience deserves equal consideration of suffering, scaled by intensity/duration), the regulatory landscape would shift from exclusion to inclusion.

  **The Regulatory Landscape:**
  The definition of "animal" in all welfare statutes would be decoupled from taxonomy (vertebrate/invertebrate) and tied to evidence of sentience (nociception, behavioral avoidance, neurochemical response). The burden of proof would shift: instead of advocates proving an animal suffers, the industry would bear the burden of proving a species *lacks* the capacity for suffering before exempting them from welfare laws. Slaughter regulations would mandate "rendering insensible prior to killing" for all species, requiring species-specific technologies (e.g., electrical stunning for crustaceans, percussive or electrical stunning for fish) rather than allowing asphyxiation or thermal shock.

  **First Three Practical Changes:**
  1.  **Statutory Redefinition:** Amend the Animal Welfare Act and Humane Methods of Slaughter Act (and EU equivalents) to define "animal" as "any sentient organism," explicitly including fish, cephalopods, and decapod crustaceans, removing the "warm-blooded" and "vertebrate" exclusions.
  2.  **Mandatory Pre-Slaughter Stunning:** Prohibit asphyxiation (air/ice) for fish and live-boiling/chilling for crustaceans; mandate approved stunning methods that induce immediate insensibility, enforced by the presence of welfare officers at slaughterhouses currently exempt from inspection (e.g., poultry plants).
  3.  **Standing and Enforcement:** Grant legal standing to advocacy groups to sue on behalf of excluded species and fund the creation of enforcement mechanisms specifically for aquatic and invertebrate industries, which currently operate with near-total immunity from welfare inspections.

  \answer{The current legal framework presupposes a graded moral status based on phylogenetic proximity and economic convenience, which a consistent sentientist ethic would replace with inclusive statutory definitions and mandatory stunning for all beings capable of suffering.}
