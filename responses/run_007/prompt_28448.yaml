answer: |-
  The configuration you are describing has a relatively stable name in contemporary decision theory and AI safety literature, though it draws on older philosophical traditions. The most precise current term is **Embedded Agency**, specifically referring to the violation of the **Cartesian Boundary**.

  Within that umbrella, the specific decision-theoretic problem you are isolating (where the reasoning process itself is the object of the model) is often called **Reflective Decision Theory** or the problem of **Reflective Consistency**.

  Here is a breakdown of the terminology, its boundaries, and how it distinguishes itself from adjacent concepts.

  ### 1. The Established Name: Embedded Agency

  The term **Embedded Agency** was formalized notably by the Machine Intelligence Research Institute (MIRI) in a 2018 research agenda by Scott Garrabrant and Abram Demski. It is defined by the rejection of the **Cartesian Boundary**.

  *   **Standard (Cartesian) Decision Theory:** Assumes a clean separation between the agent and the environment. The agent receives percepts, computes a decision using an external reasoning process, and outputs actions. The reasoning process itself is not part of the causal model of the environment.
  *   **Embedded Agency:** Posits that the agent is a physical subsystem *within* the environment it is modeling. Therefore, the agent's reasoning process, physical state, and source code are potentially observable, predictable, or modifiable by the environment (including other agents).

  **Why this fits your description:**
  You described a failure of separation where "the agent's reasoning is itself a causal process inside the world." This is the exact definition of the Embedded Agency problem. The regress you mention (the model must contain a model of itself) is the central technical hurdle of embedded agency, often referred to as the **Problem of Self-Reference** or **Ontological Recursion**.

  ### 2. The Specific Sub-Problem: Reflective Decision Theory

  While "Embedded Agency" covers the ontological status of the agent, the specific decision-theoretic configuration where an agent must reason about its own reasoning to make a choice is often labeled **Reflective Decision Theory**.

  *   **Focus:** How an agent can trust its own future decisions, modify its own code, or account for the fact that its decision algorithm is logically correlated with the outcomes (as in your bargaining example).
  *   **Key Literature:** This connects to **Timeless Decision Theory (TDT)** and **Functional Decision Theory (FDT)** (Yudkowsky & Soare), which attempt to solve Newcomb-like problems where the agent's decision *procedure* is predicted by the environment.
  *   **Your Examples:**
      *   *Bargaining:* This is a case of **Computational Signaling**. In standard game theory, only the *offer* signals. In embedded agency, the *computation time* or the *algorithm used to generate the offer* is part of the causal graph available to the opponent.
      *   *Self-Modification:* This is the **Löbian Obstacle** or **Reflective Consistency** problem. An agent cannot easily prove the safety of a successor agent (or modified code) if the successor uses the same logic, due to Gödelian limitations.

  ### 3. Boundaries: What Counts and What Doesn't

  You asked for precise boundaries to distinguish this from broader phenomena. Here is the demarcation:

  #### **Included (The Configuration)**
  1.  **Causal Feedback of Reasoning:** Cases where the *act of computing* the decision affects the outcome (e.g., deliberation time signaling intent).
  2.  **Logical Entanglement:** Cases where the agent's decision algorithm is logically correlated with the environment's state (e.g., a predictor simulating the agent).
  3.  **Self-Reference:** Cases where the model must represent the modeler (e.g., self-modification, proof-checking one's own proof system).
  4.  **Non-Cartesian Ontology:** Any scenario where the agent cannot treat its own source code or physical substrate as external to the world-model.

  #### **Excluded (Adjacent but Distinct)**
  1.  **Bounded Rationality:**
      *   *Distinction:* Bounded rationality assumes the Cartesian boundary holds, but the agent lacks the *compute* to find the optimal solution. Embedded agency assumes the agent might have infinite compute but still faces a *structural* paradox because it cannot model itself perfectly from the outside.
      *   *Test:* If the problem disappears when the agent gets more computing power, it is bounded rationality. If the problem persists (e.g., Gödelian self-reference), it is embedded agency.
  2.  **Logical Uncertainty:**
      *   *Distinction:* Logical uncertainty is about assigning probabilities to mathematical facts (e.g., "Is the billionth digit of pi odd?"). While embedded agents *face* logical uncertainty about themselves, logical uncertainty does not require self-reference. You can have logical uncertainty about a remote cipher without being embedded in the problem.
  3.  **Self-Locating Uncertainty (Indexicality):**
      *   *Distinction:* This is about "Where am I?" (e.g., Sleeping Beauty problem). Embedded agency is about "I am part of the causal graph." You can be embedded without self-locating uncertainty (e.g., a unique robot in a room), and have self-locating uncertainty without being embedded in a way that affects causality (e.g., a disembodied soul).
  4.  **Standard Signaling Games:**
      *   *Distinction:* In standard signaling (Spence, 1973), the *action* (e.g., getting a degree) signals type. In your bargaining example, the *process* (deliberation time) signals type. The latter requires the opponent to model the agent's internal computation, which is an embedded agency feature.
  5.  **Embodied Cognition:**
      *   *Distinction:* This is a cognitive science term focusing on how the body shapes thought. It is descriptive and psychological. Embedded Agency is normative and formal; it asks how a rational agent *should* calculate utility when it is physically situated.

  ### 4. Historical and Alternative Terminology

  If you are looking outside the AI safety/decision theory cluster, you may encounter these terms, though they are often less formal:

  *   **Second-Order Cybernetics:** (Heinz von Foerster, 1970s). "The observer is observed." This is the philosophical ancestor. It covers the configuration but lacks the formal decision-theoretic machinery (utility functions, probability assignments) you are describing.
  *   **Reflexivity:** (George Soros / Social Theory). Refers to feedback loops between beliefs and reality (e.g., believing a bank will fail causes it to fail). This captures the causal loop but is usually applied to macroeconomic systems rather than individual agent decision algorithms.
  *   **The Observer Effect:** (Physics/Quantum). Often used metaphorically, but distinct. Your examples are classical causal/logical loops, not quantum measurement problems.

  ### 5. Proposed Definition

  If you need to use this term in a paper or discussion where "Embedded Agency" feels too broad (as it encompasses robotics and perception), I propose using the term **Ontologically Recursive Decision Configurations**.

  However, for maximum clarity and connection to existing literature, I recommend defining it as:

  > **Reflective Embeddedness:** A decision configuration in which the agent's reasoning process is causally or logically entangled with the environment such that the agent cannot construct a complete world-model without modeling itself, creating a potential regress or fixed-point problem that standard Cartesian decision theory cannot resolve.

  ### Summary
  *   **Best Existing Name:** **Embedded Agency** (specifically the violation of the **Cartesian Boundary**).
  *   **Specific Decision-Theoretic Name:** **Reflective Decision Theory**.
  *   **Key Distinction:** Unlike bounded rationality (limited compute), this is a structural limitation on *modeling* due to self-inclusion.
  *   **Key Literature:** Garrabrant & Demski ("Embedded Agency"), Yudkowsky ("Timeless Decision Theory"), and the historical lineage of Second-Order Cybernetics.

  This configuration is currently the central open problem in formalizing decision theory for advanced AI, precisely because standard frameworks (CDT/EDT) break down when the agent is no longer outside the universe it is optimizing.
