answer: |-
  # Activity: The Teletransporter Spectrum (50 mins)

  **Voting Mechanism:** **Left Wall = "I Step In" (Survival)**, **Right Wall = "I Stay" (Death)**.
  *Why:* Physical movement wakes them up; visualizes the split instantly. No talking between cases.

  **Setup (5 mins):**
  "Stipulate the machine is perfect. The replica has your exact memories, personality, and scars. Subjectively, the experience is continuous. You wake up on Mars thinking you just stepped in on Earth. The question isn't 'Is it scientifically possible?' but 'Is it *you*?'"

  **The Sequence (15 mins):**
  Read each slowly. Give 30 seconds to move. Record counts on board.

  1.  **Standard Parfit:** "Scanner destroys your Earth body atom-by-atom. Information sends to Mars. Replica assembled. Earth body is dead."
  2.  **Delayed Destruction:** "Scanner copies you. Replica assembles on Mars. *Then*, 1 minute later, Earth body is destroyed."
  3.  **Fission (The Split):** "Scanner copies you. Replica assembles on Mars. Earth body is *not* destroyed. There are now two of you. You (Earth) are told you will be executed tomorrow."
  4.  **Psychological Fade:** "Scanner destroys Earth body. Mars replica has 90% of your memories, but some are replaced with stranger's memories. Personality slightly altered."
  5.  **Total Break:** "Scanner destroys Earth body. Mars replica has your body shape, but *zero* of your memories or personality. It is a blank slate."

  **Debrief & Mapping (25 mins):**
  Bring everyone back to seats. Draw a grid on the board: **Case #** | **% Stepping In**.

  1.  **Trace the Drop:** "Where did the room split?" Usually Case 1 is high, Case 3 crashes.
  2.  **Bodily Criterion:** "Who voted 'Stay' in Case 1 because the body died?" (Connects to Animalism/Bodily continuity).
  3.  **Psychological Criterion:** "Who voted 'Step In' in Case 1 but 'Stay' in Case 5?" (Connects to Locke/Psychological continuity).
  4.  **The Branching Problem (Case 3):** "In Case 3, there are two candidates. Identity is one-to-one. If both are you, logic breaks. If neither is you, why was Case 1 okay?"
      *   *Parfit's Move:* Identity isn't what matters. **Relation R** (Psychological Connectedness) is what matters. In Case 3, you survive as *both*, even if you aren't *identical* to both.
  5.  **Reductionism:** "If your votes changed based on degrees of connection (Case 4), you're treating 'self' as a matter of degree, not a deep further fact."

  **Predictable Pitfalls:**
  *   **The "Copy" Objection:** Someone will say "It's a clone, not me" in Case 1.
      *   *Fix:* Remind them of the stipulation: "Subjectively indistinguishable." Ask: "If you couldn't tell the difference, what practical difference does 'real' make?"
  *   **The "Suicide" Hesitation:** Students may vote "Stay" simply because they fear death, not due to identity theory.
      *   *Fix:* Reframe: "Assume Earth-you dies either way. Does Mars-you count as *your* survival?"

  **Limitations (Be Honest):**
  *   **Intuition vs. Argument:** This maps intuitions, it doesn't prove Reductionism. Some will leave unconvinced.
  *   **Fission Nuance:** Hard to capture Parfit's "survival without identity" distinction fully in a binary vote. You'll need to explain that verbally in debrief.
  *   **Metaphysics:** This tests *what matters* (pragmatic), not necessarily *what we are* (ontological). Keep that distinction clear.

  **Wrap (5 mins):**
  "Parfit says if Identity isn't what matters, we should fear death less and care more about future connections. Does seeing your votes shift change how you view your own future?"
