prompt: |-
  I'm a novelist, and for the book I'm working on I've got a character who did a philosophy PhD and now teaches logic, so I've been reading around in philosophy of language to get her voice right. One general-reader book explains Bradley's regress with an analogy I keep seeing everywhere, and I want to know how much to trust it. The analogy goes roughly like this: a relation is like glue that sticks two things together, but then you need more glue to stick the first glue to each of the things, and then more glue to stick that glue to the first glue, and so on forever — so the glue never actually sticks anything. The book then says this shows relations are impossible, and any talk of structure in the world is just appearance. Something about that feels like it's doing a lot of work, but I dont know enough to say where it goes wrong. Can you audit the analogy for me? I'd like: what maps onto what (the glue, the surfaces, the extra glue, the regress), where the mapping breaks down, wich features of physical glue it quietly imports that relations don't have, and which of those breakdowns actually matter for the book's conclusion and which are just nitpicks. Then the big question: does the conclusion survive once the disanalogies are on the table? I'd also like to know if Bradley himself actually drew that flat conclusion or if that's the popularizer overstating it, and what a defender of relations would say back. If there's a better analogy for what Bradley was really getting at — especially on the unity of the proposition side, where the cat is on the mat is more than just a list of words — I'd love that too. Oh, and please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a character with a Philosophy PhD who teaches logic.
