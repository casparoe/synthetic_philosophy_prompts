      *   **Requirements:**
          1.  Map the analogy (glue, surfaces, extra glue, regress).
          2.  Identify where the mapping breaks down.
          3.  Identify features of physical glue imported that relations don't have.
          4.  Determine which breakdowns matter for the conclusion.
