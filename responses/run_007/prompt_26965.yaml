      *Correction:* The prompt says the book explains the regress *with* the analogy and *then* says this shows relations are impossible. I need to confirm if Bradley concluded relations are impossible. Yes, he concluded they are contradictory and thus appearance. So the book is historically accurate on Bradley, but philosophically controversial on the truth of the matter.

      *Wait, one nuance:* The glue analogy is often used to *illustrate* the regress. The regress is the argument. The conclusion is the monism. I need to make sure the user understands that modern logic teachers (like her character) would likely *reject* the conclusion while accepting the regress as a challenge to explain how unity works.

