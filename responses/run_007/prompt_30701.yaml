  Your derivation is mathematically correct if the radio message is interpreted strictly as the material conditional proposition $\neg(\text{Red} \land \neg\text{HQ})$. Under standard Bayesian conditionalization, eliminating the Red Second-Company sector ($R_2$) indeed redistributes its probability mass equally among the remaining three sectors, raising the probability of being in Blue territory from $1/2$ to $2/3$.

  However, this case is treated as a challenge (specifically by Bas van Fraassen) because this result conflicts with a strong epistemic intuition known as **irrelevance**. The message provided information *only* about the Red territory. Intuitively, learning a fact that restricts possibilities within Red should not make it more probable that you are in Blue. By treating the conditional as a proposition that eliminates a world, standard updating inadvertently "rewards" the Blue sectors with increased probability simply because they were not ruled out, even though the message gave no positive evidence for them.

  The "correction" proposed in the literature is to treat the input not as a proposition to be conditionalized upon, but as a **constraint on conditional probabilities**. Specifically, the message establishes that $P(\text{HQ} | \text{Red}) = 1$. To update on this constraint without introducing unwarranted assumptions (like the increased probability of Blue), one should use a method like **Minimum Relative Entropy** (MinEnt). This method adjusts the probabilities to satisfy the new constraint ($P(\text{HQ} | \text{Red}) = 1$) while changing the prior distribution as little as possible. This results in the probability of Red being concentrated entirely on HQ ($P(R_H) = 1/2$) while the probability of Blue remains unchanged ($P(\text{Blue}) = 1/2$), which aligns with the intuition that the message was irrelevant to the Blue sector.

  Summary: The correction requires treating the message as a constraint on conditional probability ($P(\text{HQ}|\text{Red})=1$) rather than a material proposition, which preserves the prior probability of the irrelevant Blue sector.
