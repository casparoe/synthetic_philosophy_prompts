answer: |-
  1. **Overall Credence**

  0.40

  2. **Decomposition of the Proposition**

  To arrive at the figure above, I have assessed the probability that the answer to each of the following sub-questions supports the main proposition (i.e., favours the sortition assembly producing superior legislation).

  *   **Electoral Incentive Structures (0.85)**
      There is robust evidence in public choice theory and political economy that re-election incentives systematically encourage short-termism, pork-barrel spending, and responsiveness to donors rather than the general welfare. Removing this pressure creates a strong *prima facie* case for improved long-run policy.

  *   **Resistance to Capture (0.50)**
      While sortition removes the need for campaign finance, thereby reducing one lever of lobbyist influence, it is uncertain whether organised interests would simply pivot to capturing the expert briefing process or cultivating relationships with permanent clerical staff. The net reduction in capture is plausible but unproven at this scale.

  *   **Cognitive Capacity and Deliberation (0.75)**
      Empirical data from citizens' assemblies (e.g., in Ireland and Canada) suggest that lay citizens can grasp complex policy issues when properly briefed and facilitated. However, scaling this from an advisory body to a full legislative chamber with a high volume of bills introduces untested logistical and cognitive burdens.

  *   **Accountability Mechanisms (0.35)**
      The absence of retrospective voting removes the primary sanction against negligence, corruption, or ideological drift. It is unlikely that internal rules or public scrutiny alone would replicate the disciplinary force of an election, posing a significant risk that responsiveness to affected parties would degrade over time.

  *   **Institutional Sustainability (0.45)**
      In a medium-sized developed democracy, the existing political elite, media, and bureaucracy might view a sortition house as illegitimate or incompetent, potentially leading to non-compliance, constitutional crises, or a reversion to elected rule before the twenty-year period concludes.

  3. **Combination of Sub-question Probabilities**

  I do not treat these sub-questions as independent variables that can be simply averaged or multiplied. Instead, I view them through a **conditional risk framework**. The high probabilities assigned to 'Electoral Incentives' (0.85) and 'Cognitive Capacity' (0.75) represent potential *upside* gains. However, the lower probabilities for 'Accountability Mechanisms' (0.35) and 'Institutional Sustainability' (0.45) represent *downside* risks that function as veto conditions.

  If the assembly proves unsustainable (Q5) or unaccountable (Q4), the theoretical benefits of reduced short-termism (Q1) and improved deliberation (Q3) are nullified, as the body would either cease to function effectively or would drift from the public interest. Consequently, the overall credence is dragged down significantly below the arithmetic mean of the sub-questions. The 0.40 credence reflects a judgment that while the theoretical benefits are substantial, the systemic risks of implementation and the loss of accountability mechanisms make a net superiority over twenty years less likely than not.

  4. **Least Confident Sub-question**

  I am least confident regarding **Resistance to Capture (0.50)**.

  We currently lack empirical evidence on how the 'influence industry' adapts when the campaign finance channel is closed. In an elected system, lobbyists trade money for access; in a sortition system, they might trade privileged information or social validation for access. Evidence that would shift this probability would be longitudinal studies of existing sortition bodies that track the provenance of legislative amendments, or comparative data from jurisdictions where campaign finance is already strictly prohibited, to see if lobbyist influence persists through other channels.

  5. **Characterisation of Reasonable Disagreement**

  The most likely driver of disagreement between my credence (0.40) and a lower credence (e.g., 0.20) would be the **Accountability Mechanisms** sub-question.

  A sceptic at 0.20 likely holds a normative view that retrospective voting is the *sine qua non* of democratic legitimacy and effectiveness; they would argue that without the threat of removal, representatives inevitably become complacent or self-serving, rendering any legislative output inferior regardless of its technical coherence. Conversely, a proponent at 0.70 would likely weigh the **Electoral Incentive Structures** sub-question more heavily, arguing that the distortions caused by the need for re-election are so catastrophic for long-run welfare (e.g., climate change inaction) that even a risky sortition system offers a higher expected value. My position sits between these views, acknowledging the severity of electoral distortions but remaining concerned that the remedy may introduce governance failures of equal magnitude.
