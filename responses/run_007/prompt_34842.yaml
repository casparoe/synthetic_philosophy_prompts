      *   **Frankfurt's Conclusion:** Jones is responsible even though he *could not have done otherwise* (because Black would have forced him). Therefore, PAP is false. Responsibility depends on the *actual sequence* of events, not the *alternative sequences*.

  3.  **Deconstruct the Film (*Minority Report*):**
