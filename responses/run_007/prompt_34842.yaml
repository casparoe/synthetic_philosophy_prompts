      *   **Core Subject:** Harry Frankfurt's "Frankfurt Cases" and the Principle of Alternative Possibilities (PAP).
      *   **Film Subject:** *Minority Report* (2002, Spielberg).
      *   **Task:** Read the film through the lens of Frankfurt/PAP. Compare/contrast the scenarios (Frankfurt: acted but couldn't have done otherwise; Film: stopped before acting based on prediction). Determine if the film takes a stance on PAP.
