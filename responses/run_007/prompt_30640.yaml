prompt: |-
  Ok so in my philosophy club (dont laugh) I got into an argument about modal realism and now I need someone to settle it. My friend, who read like half a Wikipedia article, summarized David Lewis's view to me like this: "Lewis thinks there are infinitely many parallel universes just as real as ours, one for every way things could have been. So nothing is ever merely possible — if you could have had cereal this morning, there's literally another universe where a counterpart of you is eating cereal right now. He mostly likes the view because it makes the semantics of 'could have' really tidy. The obvious problem is that it's nuts: it makes our universe no more special than any other, and it means every possible version of you actually exists somewhere." I have a feeling this is a bit unfair but I don't know enough to say exactly where, and honestly the "it's nuts" part seems kind of right to me. You're a professional philosopher who works on modality — could you go through his summary piece by piece and tell me what a careful modal realist would accept, what they'd wince at, and whether the "it's nuts" conclusion actually follows from the accurate parts? Maybe start by brainstorming the exact claims before you rule on each one, and don't pull punches on the parts that really are weird.
