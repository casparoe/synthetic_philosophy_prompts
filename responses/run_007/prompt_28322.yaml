prompt: |-
  Read Henry James's *The Turn of the Screw* (1898) through the lens of the debate over whether authorial intention determines the meaning of a literary text. The novella is famously ambiguous: either the ghosts are real and the governess is a protector, or she is hallucinating and destroying the children. James's own statements about the work are mixed — he dismissed it in letters as a potboiler, yet in his later Preface to the New York Edition he described his artistic aims at some length without ever resolving the central ambiguity. Use the novella to test the main positions in the intention debate. If a committed intentionalist (someone who holds that the meaning of a text is fixed by what the author meant by it) and a committed anti-intentionalist (someone who holds that meaning is constructed by readers from the text alone) both read the story, where would their interpretations most sharply diverge, and where might the text force them into the same corner? Does the story's power depend on the ambiguity being unresolvable — and if so, does that count for or against the relevance of authorial intention? I'd like you to say how confident you are in your reading overall and to single out the point you are least sure of.
