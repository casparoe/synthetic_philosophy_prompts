  2.  **Deconstruct the "Born Rule Problem" in MWI:**
      *   *The Core Tension:* Standard QM says probability = $| \psi |^2$. MWI says *all* outcomes occur. How do we recover "probability" (uncertainty, risk, frequency) from a deterministic theory where everything happens?
      *   *Two Sub-problems:*
          1.  **Incoherence Problem:** How can there be uncertainty/probability if the outcome is determined (all branches exist)?
          2.  **Quantitative Problem:** Even if we accept "probability" makes sense, why is it $| \psi |^2$ and not something else (like branch counting)?

  3.  **Drafting the Desiderata (Iterative Process):**

