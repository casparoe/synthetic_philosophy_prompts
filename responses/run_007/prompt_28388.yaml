      *   *Requirement 2: Derivation vs. Postulation (Quantitative).*
          *   Can't just add "Prob = $| \psi |^2$" as a new axiom. Must come from the formalism (unitary QM) + something else (decision theory, symmetry, envariance).
          *   *Status:* Non-negotiable for a *derivation* project. (Some might accept it as a primitive, but the user asks about the "Born Rule Problem" literature which aims to solve it).
          *   *Nuance:* What counts as smuggling it in? (e.g., assuming continuity in amplitudes).

      *   *Requirement 3: Basis Independence / Decoherence Compatibility.*
          *   Can't assume a specific basis to define branches *before* deriving weights. Decoherence defines branches, but does decoherence rely on trace rules (which use Born rule)?
          *   *Status:* Non-negotiable. Must avoid circularity with the measurement apparatus definition.

      *   *Requirement 4: Branch Counting Rejection.*
          *   Why not count worlds? (Problem: World count is ill-defined in continuous Hilbert space).
          *   *Status:* Non-negotiable. The solution must explain why amplitude matters more than topology/count.

      *   *Requirement 5: Decision-Theoretic Validity (Deutsch-Wallace).*
