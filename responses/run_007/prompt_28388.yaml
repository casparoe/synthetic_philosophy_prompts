answer: |-
  You are right to feel stuck. The literature is fragmented because authors are often solving *different* problems under the same label ("The Born Rule Problem"). Some are solving a metaphysical problem (what is probability?), some a mathematical one (why this measure?), and some a pragmatic one (how to bet?).

  Below is a breakdown of the desiderata for a **fully adequate solution**, categorized by the layer of the problem they address. I have flagged which are generally considered **Non-Negotiable** (NN) for the project to succeed, and which are **Camp Preferences** (CP) that depend on your philosophical stance.

  At the end, I address the **Incompatibility Matrix**: the subset of requirements that may be jointly unsatisfiable, which is the source of the "doomed" feeling.

  ---

  ### I. Conceptual Desiderata (The Incoherence Problem)
  *Before you can derive $|\psi|^2$, you must explain what "probability" refers to in a deterministic multiverse.*

  **1. The Subjective Uncertainty Requirement**
  *   **Requirement:** The account must explain how an agent can experience genuine *uncertainty* about a future measurement outcome when the theory dictates that all outcomes will deterministically occur.
  *   **The Case:** In collapse theories, probability maps to objective chance (only one outcome happens). In MWI, "I" split. If "I" experience both outcomes, in what sense was I uncertain beforehand? Without uncertainty, "probability" reduces to mere "measure of existence," which lacks the normative force of probability (e.g., fear of death, betting risk).
  *   **Status:** **Non-Negotiable.** If you cannot recover the *phenomenology* of uncertainty, you haven't solved the probability problem; you've just changed the subject to "branch weight."
  *   **Common Approaches:** Self-locating uncertainty (Vaidman, Sebens & Carroll), Subjective Uncertainty (Saunders, Wallace).

  **2. The Uniqueness of Experience Requirement**
  *   **Requirement:** The account must explain why agents perceive a *single* outcome despite the global state containing all outcomes.
  *   **The Case:** Even if uncertainty is solved, we need to know why I don't experience a superposition of sensations. This links the probability problem to the preferred basis problem.
  *   **Status:** **Non-Negotiable.** (Though often outsourced to decoherence theory).

  ---

  ### II. Formal Desiderata (The Quantitative Problem)
  *Assuming probability makes sense, why is it $|\psi|^2$ and not something else?*

  **3. The Non-Postulation Requirement**
  *   **Requirement:** The Born Rule ($\text{Prob} = |\psi|^2$) must not be introduced as a new fundamental axiom. It must be derived from the unitary formalism (Schrödinger equation) plus auxiliary principles.
  *   **The Case:** If you add the Born Rule as an axiom, MWI loses its main advantage over Collapse theories (ontological parsimony). It becomes "QM + Many Worlds + Born Rule," which is less parsimonious than "QM + Collapse."
  *   **Status:** **Non-Negotiable** (for the derivation project). *Note: Some (e.g., Carroll) argue it should be a self-locating uncertainty principle, which is technically an added principle but claimed to be conceptual, not physical.*

  **4. The Branch-Counting Exclusion**
  *   **Requirement:** The account must demonstrate why counting branches (1 branch = 1 outcome) is ill-defined or irrational, and why amplitude squared is the correct measure.
  *   **The Case:** In Hilbert space, the "number" of branches depends on how you decompose the basis. You can decompose a state into 2 equal branches or 1000 unequal branches. "Branch count" is basis-dependent and ill-defined. The solution must show that $|\psi|^2$ is the *only* stable measure invariant under basis transformations that respect decoherence.
  *   **Status:** **Non-Negotiable.**

  **5. The Decoherence Compatibility Requirement**
  *   **Requirement:** The derivation must not presuppose the validity of decoherence *if* decoherence itself presupposes the Born Rule.
  *   **The Case:** This is the **Adrian Kent Objection**. Decoherence is usually calculated using the *partial trace* to get reduced density matrices. The physical justification for the trace rule often relies on expectation values, which rely on the Born Rule. If you use decoherence to define branches, and decoherence relies on the Born Rule, your derivation is circular.
  *   **Status:** **Non-Negotiable** (but highly contested). A solution must either show decoherence can be defined without the trace rule, or derive the Born Rule without relying on decoherence-defined branches.

  ---

  ### III. Decision-Theoretic Desiderata (The Deutsch-Wallace Program)
  *Can we derive probabilities from how rational agents ought to act?*

  **6. The Rationality Derivation Requirement**
  *   **Requirement:** The account must show that a rational agent *ought* to bet according to the Born Rule, based on axioms of rationality that do not explicitly mention probability.
  *   **The Case:** If probability is just a guide to action (functionalism), then proving that rational agents bet according to $|\psi|^2$ is equivalent to deriving the Born Rule.
  *   **Status:** **Camp Preference (Everettian Functionalists).** Critics (e.g., Price, Kent) argue this conflates *is* (how agents behave) with *ought* (objective chance). Defenders (Wallace) argue this is the only way to make sense of probability in a deterministic world.

  **7. The Non-Circularity of Axioms Requirement**
  *   **Requirement:** The decision-theoretic axioms (e.g., Diachronic Consistency, Branching Indifference) must not implicitly encode the Born Rule.
  *   **The Case:** Critics argue "Branching Indifference" (an agent shouldn't care about branching per se, only rewards) smuggles in the idea that branch *weight* matters, which is what we are trying to prove. If the axioms only make sense to someone who already believes in Born-rule weights, the derivation is circular.
  *   **Status:** **Non-Negotiable** (for the derivation to hold). This is the main battleground.

  **8. The Single-Case Requirement**
  *   **Requirement:** The solution must vindicate the Born Rule for single measurements, not just in the infinite limit.
  *   **The Case:** Frequentist derivations (Hartle, Farhi-Goldstone-Gutmann) show that in the limit of $N \to \infty$, the norm of branches violating the Born Rule goes to zero. But this doesn't tell an agent what to do in a *single* case. A solution to the probability problem must guide single-case action.
  *   **Status:** **Non-Negotiable.** (Infinite limit derivations are generally considered insufficient for the full problem).

  ---

  ### IV. The Incompatibility Matrix: Is the Project Doomed?

  You asked if there is a subset of these requirements that are jointly unsatisfiable. There is a strong argument that **three specific desiderata form a "Trilemma."** You likely cannot satisfy all three simultaneously.

  #### The Trilemma
  1.  **Strict Unitarianism:** The physics is *only* the unitary Schrödinger equation (no extra axioms, no collapse, no hidden variables).
  2.  **Objective Probability:** Probability is a feature of the world (objective chance), not just a feature of an agent's mind (credence).
  3.  **Non-Circular Derivation:** The Born Rule is derived without presupposing probabilistic concepts (like trace rules or rational betting weights) in the premises.

  **Why they conflict:**
  *   If you hold **(1) Strict Unitarianism**, the universe is deterministic. All outcomes happen.
  *   If you hold **(2) Objective Probability**, you need "objective chance." But in a deterministic multiverse where everything happens, there is no room for objective chance (Lewis's Principal Problem).
  *   To resolve this, most Everettians drop **(2)** and move to **Subjective Probability** (Decision Theory).
  *   *However*, if you move to Subjective Probability, you run afoul of **(3)**. To get the Born Rule out of decision theory, you need axioms (like Diachronic Consistency). Critics argue these axioms *only* make sense if you already accept a specific measure over branches (i.e., Objective Probability).
  *   Alternatively, if you try to keep **(2)** using **Envariance (Zurek)**, you run afoul of **(3)** because defining the "swaps" that justify equiprobability often requires a preferred basis defined by decoherence, which (per Kent) relies on the Trace Rule (Objective Probability).

  #### Implications for the Project
  This does not necessarily mean the project is *doomed*, but it means you must **drop or modify one leg of the trilemma.**

  *   **Option A (Wallace/Deutsch):** Drop **(2)**. Accept that probability is *purely* decision-theoretic (functionalist). There is no "objective chance," only rational credence.
      *   *Cost:* You must accept that "probability" in MWI means something fundamentally different than in collapse theories.
  *   **Option B (Carroll/Sebens):** Drop **(3)** (softly). Admit you need an extra *epistemic* principle (Self-Locating Uncertainty) that isn't strictly physical but is conceptually necessary.
      *   *Cost:* It looks like a new axiom, weakening the parsimony argument.
  *   **Option C (Kent):** Drop **(1)**. Argue that Strict Unitarianism is incoherent without the Born Rule, implying MWI is incomplete or wrong.
      *   *Cost:* Abandon MWI.

  ### Summary Checklist for Reading Papers

  When you read the next paper, map their claims against this grid. If they claim to solve everything, check where they hide the cost.

  | Desideratum | Non-Negotiable? | Common Failure Mode |
  | :--- | :--- | :--- |
  | **1. Subjective Uncertainty** | **Yes** | Ignoring it; treating branches as "copies" without explaining the first-person perspective. |
  | **2. Uniqueness of Experience** | **Yes** | Assuming decoherence solves it without checking for Born-rule circularity in decoherence. |
  | **3. Non-Postulation** | **Yes** | Sneaking $|\psi|^2$ into the definition of "measure" or "weight." |
  | **4. Branch-Counting Exclusion** | **Yes** | Failing to explain why Hilbert space dimension trumps topological branch count. |
  | **5. Decoherence Compatibility** | **Yes** | Using the Trace Rule to define branches before deriving the Born Rule. |
  | **6. Rationality Derivation** | *Preference* | Assuming agents *must* be Everettian rationalists (may not apply to actual humans). |
  | **7. Axiom Non-Circularity** | **Yes** | Using axioms that implicitly assume branch weights matter. |
  | **8. Single-Case Validity** | **Yes** | Relying solely on $N \to \infty$ frequency arguments. |

  **Final Advice:**
  If a paper claims to derive the Born Rule, ask: **"Where did the norm come from?"**
  *   If it comes from **Decision Theory**, check if the axioms assume you care about amplitude.
  *   If it comes from **Symmetry (Envariance)**, check if the symmetry arguments assume a basis defined by the Trace Rule.
  *   If it comes from **Self-Locating Uncertainty**, check if the principle of indifference is applied to *branches* (count) or *amplitudes* (measure).

  The literature is stuck because everyone thinks *their* source of the norm is "free," while the others are "circular." Recognizing that *some* normative input is likely required (violating strict derivational purity) might be the only way to unstick yourself.
