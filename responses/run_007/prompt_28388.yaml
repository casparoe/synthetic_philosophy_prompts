          *   *Circularity:* Is assuming "diachronic consistency" smuggling in Born rule?

      *   *Requirement 6: Single Case vs. Frequency.*
          *   Does it work for one measurement or only infinite ensembles?
          *   *Status:* Preferred: Single case. Infinite limits are easy (Hartle, Farhi-Goldstone-Gutmann) but don't solve the *meaning* of probability for a single observer.

  4.  **Addressing the "Circularity" and "Camp" Issues:**
      *   *Decision Theory:* Critics (Kent, Price) say DW axioms imply the conclusion. Defenders (Wallace) say they are rationality constraints independent of physics.
