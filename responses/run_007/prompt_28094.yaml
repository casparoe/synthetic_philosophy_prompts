prompt: |-
  I'm a high school student, and I've run into a situation that's been bothering me. I recently made the varsity soccer team, and there's an unofficial tradition where new players have to do an embarrassing routine at a team dinner — nothing physically dangerous, but it's deliberately humiliating, and everyone watches and laughs. When I told one of the seniors I thought it was pointless and kind of cruel, he said that's exactly why it works: if you're willing to go through something unpleasant that has no other purpose, it proves you're genuinely committed to the team in a way that just saying so never could. He compared it to an expensive engagement ring — the cost is what makes the signal believable.

  This has been stuck in my head because it feels like he might have a point, but it also seems like a suspiciously convenient excuse for hazing. Is there actually a coherent logic behind the idea that wasteful or costly gestures are more honest signals than cheap ones? And if there is, does that logic justify what the team is doing, or does it explain the psychology without justifying the practice? I want you to engage with the underlying theory seriously — if my teammate's reasoning is confused or the analogy doesn't hold, I want to know exactly where it breaks. And if the theory does support what he's saying, I want to know whether that means I should accept the ritual or whether there are reasons to reject it anyway. Also, if the whole way I've set this up rests on a misunderstanding — if I'm asking the wrong question or the theory doesn't apply the way I think — please say so directly rather than humoring the framing.

  Please approach this as an expert on signaling theory and evolutionary biology who is also comfortable with normative ethical reasoning. Take your time, and if it helps, start by laying out the core logic of costly signaling before applying it to my situation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school student, new varsity soccer player.
      *   **Situation:** Facing a hazing ritual (embarrassing routine at dinner).
      *   **Conflict:** A senior justified it using "costly signaling theory" (comparing it to an engagement ring). The student is skeptical but intrigued.
      *   **Task:** Engage seriously with the underlying theory (signaling theory/evolutionary biology), evaluate the logic, distinguish between *explanation* and *justification*, and provide ethical guidance.
      *   **Tone:** Expert on signaling theory/evolutionary biology + normative ethical reasoning. Respectful, direct, not condescending, not humoring the framing if it's wrong.
      *   **Key Questions:** Is there coherent logic behind wasteful gestures as honest signals? Does this logic justify the practice? Should the student accept it? Is the framing misunderstood?

  2.  **Deconstruct the Core Theory (Costly Signaling Theory - CST):**
      *   *What is it?* A concept from evolutionary biology (Zahavi's Handicap Principle) and economics (Spence).
      *   *Core Logic:* Signals are only reliable if they are costly to produce. If a signal is cheap, cheaters can mimic it. If it's costly (in terms of energy, risk, resources), only high-quality individuals can afford it.
      *   *Examples:* Peacock tails (metabolic cost, predation risk), Gazelle stotting (energy cost, shows predator "I'm fit, don't bother"), Diamond rings (financial cost, shows commitment/resources).
      *   *Application to Humans:* Religious fasting, dangerous initiations, gift-giving.
      *   *Validity:* Yes, the theory is robust within its domain. The senior is *technically* correct about the mechanism: cost creates credibility.

  3.  **Evaluate the Senior's Analogy (Engagement Ring vs. Hazing):**
      *   *Similarity:* Both involve a cost to signal commitment.
      *   *Difference:*
          *   Ring: Voluntary, mutual benefit (usually), signals future investment, cost is financial (transferable), recipient values the signal.
          *   Hazing: Coercive (social pressure), hierarchical (seniors vs. juniors), cost is psychological/social, benefit is primarily for the *signalers* (seniors/group cohesion) not the *receiver* (new player) or the group's actual performance.
      *   *The "Waste" Aspect:* CST relies on the cost being a *handicap*. But in human social groups, the cost needs to correlate with the trait being signaled (commitment/loyalty). Does embarrassment correlate with soccer skill or team loyalty? Not necessarily. It correlates with *submissiveness*.

  4.  **Distinguish Explanation vs. Justification (The Is-Ought Problem):**
      *   *Explanation:* CST explains *why* the behavior exists and persists. It creates group cohesion through shared trauma/submission.
      *   *Justification:* Just because something *works* as a signal doesn't mean it's *good*, *ethical*, or *optimal*.
      *   *Efficiency:* Is this the *best* signal? Or just a lazy one? Modern teams use training, film study, etc., to signal commitment. Hazing is a "cheap" signal for the seniors (they get entertainment) but costly for juniors.
      *   *Ethics:* Humiliation can cause psychological harm. It reinforces power dynamics rather than meritocracy.

  5.  **Address the Student's Specific Questions:**
      *   *Is there coherent logic?* Yes, CST is real.
      *   *Does it justify the practice?* No. Explaining the mechanism $\neq$ moral permission.
      *   *Should I accept it?* This requires ethical reasoning. Coercion, harm, and relevance matter.
      *   *Is the framing misunderstood?* The senior is applying a biological theory to a complex social/ethical context without acknowledging the normative gap.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the student's critical thinking. Acknowledge the sophistication of the question. State the thesis: The theory is real, but the application is flawed, and explanation is not justification.
      *   *Section 1: The Theory (Costly Signaling):* Explain Zahavi/Spence simply. Use the peacock and the ring examples. Confirm the senior isn't making up the science.
      *   *Section 2: Applying to Hazing:* Where does the analogy hold? (Cost creates credibility). Where does it break? (What is being signaled? Loyalty vs. Submission). Mention "Counter-signaling" or alternative signals (hard work in practice).
      *   *Section 3: Explanation vs. Justification:* This is crucial. Just because evolution explains aggression doesn't make it right. Distinguish descriptive (is) from normative (ought).
      *   *Section 4: The Ethical/Practical Flaw:* Hazing often damages trust rather than building it. It signals a toxic culture. It's illegal in many places (mention this).
      *   *Section 5: Advice/Conclusion:* Don't accept the "science" as a moral shield. Trust your gut. Suggest alternatives.

  7.  **Refining the Tone:**
      *   Avoid being preachy.
      *   Treat the student as an intellectual equal.
      *   Ensure the distinction between "evolutionarily stable strategy" and "moral good" is clear.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "hazing is bad." I need to explain *why the theory doesn't save it*. I also need to mention that hazing is often illegal for minors, which is a hard constraint regardless of theory.

  8.  **Final Review against Constraints:**
      *   Expert on signaling/evolutionary biology? Yes.
      *   Normative ethical reasoning? Yes.
      *   Direct about misunderstandings? Yes.
      *   No humoring? Yes.

  9.  **Final Polish:** Check for clarity on the "Handicap Principle." Ensure the distinction between *commitment* and *conformity* is sharp. (Proceed to generate output).

  *(Self-Correction Note)*: I must be careful not to give legal advice, but I should mention that hazing laws exist. I also need to make sure I don't validate the hazing as "effective" without heavy caveats. Research suggests hazing often *decreases* long-term cohesion. I should include that.

  10. **Final Structure:**
      1.  Validation & Thesis.
      2.  The Science: Costly Signaling Theory (CST).
      3.  The Application: Where the Senior is Right (and Wrong).
      4.  The Gap: Explanation $\neq$ Justification.
      5.  The Efficiency Problem: Is this actually a good signal?
      6.  Ethical & Practical Verdict.
      7.  Closing Advice.

