      *   *Curry Paradox:* This is crucial. LP (Logic of Paradox) preserves Modus Ponens and Contraction. Curry uses $A \to (A \to B) \vdash A \to B$. If $C \leftrightarrow (C \to \bot)$, then $C \to \bot$. If $C$ is true, $\bot$ is true. Triviality returns. *Correction:* LP blocks Curry *if* the conditional is the material conditional. But if we want a detachable conditional (Modus Ponens), LP struggles. Priest uses a non-contractable conditional or accepts the risk. Beall uses relevant logic. *Verdict:* This is a major technical hurdle, potentially fatal for simple LP.
