      *   The user assumes human values are easily codifiable ("just add 'legally'").
      *   The user assumes the AI's optimization process is transparent and controllable like traditional code.
      *   The user underestimates the power of a highly capable optimizer finding loopholes.

  3.  **Formulate the Counter-Argument (The "Hard Part"):**
