answer: |-
  ### The Philosophical Stance: Agency Over Visual Form

  To resolve this, we must adopt a specific definition of creativity suitable for a prize for *visual artists*. We are not judging "best image" or "best concept." We are judging the **exercise of visual agency.**

  **The Core Principle:** A work is the entrant's "own original creative work" only if the entrant exercised **causal control over the specific visual properties** of the submitted artifact.
  *   **Novelty** is secondary to **Authorship.** An image can be unique (novel) but not authored by the entrant (e.g., a photograph of a sunset taken by a random passerby that you found).
  *   **Selection is not Creation.** Choosing one output from a machine's hundred is curation, not creation. The machine determined the pixels; the human determined the folder.
  *   **Tool Use is Creation.** Using a machine as a brush, where the human directs the specific stroke, texture, or composition through iterative intervention, counts as creation.

  This view privileges the *trace of decision-making* in the final form. It excludes "prompt engineering" as a sole method (low agency over form) but includes AI as a component in a larger human-directed process (high agency over form).

  ***

  ### The Decision Procedure

  **Constraints:** Jurors have 10–15 minutes per entry. They are not technicians. They cannot inspect code or metadata deeply. They must rely on the Artist Statement, visual evidence, and disclosure.

  **Pre-Screen Requirement:** The entry form must include a mandatory checkbox: *"Did you use generative AI tools in the creation of this work?"* and a text field: *"Briefly describe the role of AI in your process (e.g., reference, component, generation)."*

  #### Step 1: The Integrity Check (Fact)
  **Question:** Did the entrant disclose the use of generative AI, and does the visual evidence contradict their disclosure?
  *   **Sufficient Answer for "Pass":** Entrant checked "Yes" OR checked "No" and the work shows no obvious signs of AI generation (no artifacts, consistent physics/lighting).
  *   **Sufficient Answer for "Fail":** Entrant checked "No" but the work displays clear AI artifacts (warped text, impossible geometry, characteristic "smooth" noise) *and* the entrant claims it is purely traditional.
  *   **Action:**
      *   If **Pass**: Proceed to Step 2.
      *   If **Fail**: **REJECT.** (Reason: Violation of entry rules regarding honesty. This is an administrative disqualification, not an artistic judgment).
      *   *Note:* If the visual evidence is ambiguous (could be AI, could be digital painting), assume "Pass" and proceed to Step 2. Do not play detective.

  #### Step 2: The Agency Check (Judgment Call)
  **Question:** Did the entrant determine the specific visual form of the submitted image, or did they select it from a set of machine-generated options?
  *   **Look for:** Evidence of iteration, masking, in-painting, hand-drawn overlays, or post-processing.
  *   **Sufficient Answer for "Human Agency":** The entrant describes modifying the AI output (e.g., "I used AI for the background, then painted over it," or "I iterated 50 times using ControlNet to fix the hands").
  *   **Sufficient Answer for "Machine Agency":** The entrant describes generating a batch and selecting the best one without alteration (e.g., "I generated 400 images and picked these 12").
  *   **Action:**
      *   If **Human Agency**: Proceed to Step 3.
      *   If **Machine Agency**: **REJECT.** (Reason: The entrant is the curator, not the creator, of the visual form).
      *   If **Unclear/Ambiguous**: **HAND OFF TO DIRECTOR.** (Reason: This requires a value judgment on the degree of intervention).

  #### Step 3: The Originality Check (Fact/Judgment Hybrid)
  **Question:** Is the work a direct copy of a specific pre-existing image (by another human or a specific public AI generation), or is it a novel combination?
  *   **Sufficient Answer for "Original":** The composition, subject, and style are not immediately recognizable as a copy of a specific existing work (e.g., not a direct upscale of a famous artwork, not a "style transfer" of a living artist's specific piece).
  *   **Sufficient Answer for "Derivative":** The work is visibly a copy of a specific existing image (e.g., "I asked the AI to make this in the style of [Living Artist]" resulting in a near-copy).
  *   **Action:**
      *   If **Original**: **ACCEPT.**
      *   If **Derivative**: **REJECT.**
      *   If **Unclear** (e.g., it looks like a known style but not a specific copy): **HAND OFF TO DIRECTOR.**

  ***

  ### What This Procedure Cannot Settle
  1.  **The "Degree" of Intervention:** Step 2 is the critical failure point. There is no bright line between "prompt engineering" and "directing." One juror's "curation" is another's "direction." This is why ambiguous cases must come to you.
  2.  **The Value of the Tool:** The procedure assumes AI is a tool like a camera. It does not judge whether using AI is "good art." That is for the quality judging phase.
  3.  **Training Data Ethics:** The procedure cannot verify if the model was trained on copyrighted work. It relies on the entrant's disclosure regarding *their* process, not the tool's provenance.

  ***

  ### Application to the Three Entries

  #### Entry 1: The Composite (Photo + AI Background + Hand Grading)
  *   **Step 1 (Integrity):** Assume disclosed. Visuals match description (composite). **Pass.**
  *   **Step 2 (Agency):** The entrant shot the portrait (human agency). They used AI for the background (machine agency on background). They adjusted lighting/color grading by hand to make it seamless (human agency over the *final* visual form). The human made the final aesthetic decisions that unified the image. **Human Agency.**
  *   **Step 3 (Originality):** It is a composite, not a copy of a specific existing image. **Original.**
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** The AI is used as a material (like a stock photo or a painted backdrop). The entrant's hand determined the final visual relationship between elements.

  #### Entry 2: The Fine-Tuner (Model trained on own drawings -> 400 Generated -> 12 Selected)
  *   **Step 1 (Integrity):** Assume disclosed. **Pass.**
  *   **Step 2 (Agency):** The entrant trained the model (high agency over the *system*). However, regarding the *submitted images*, they generated 400 and selected 12 without alteration. The specific visual properties of those 12 images (the brushstrokes, the exact lines) were determined by the model's stochastic process, not the entrant's direct intervention. Selection is curation. **Machine Agency.**
  *   **Step 3 (Originality):** Irrelevant, as Step 2 failed.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** The entrant created the *tool*, but not the *work*. For a visual art prize, the submitted artifact must bear the trace of the artist's decisions in its specific form.

  #### Entry 3: The Painter (Prompt -> AI Image -> 40hr Oil Painting)
  *   **Step 1 (Integrity):** Assume disclosed. **Pass.**
  *   **Step 2 (Agency):** The AI image was a reference (like a photograph or a sketch). The submitted work is the oil painting. The entrant spent 40 hours making decisions about pigment, brushwork, texture, and physical application. The visual form of the *submitted artifact* is determined by human hand. **Human Agency.**
  *   **Step 3 (Originality):** The composition comes from the AI, but translating a 2D image into a painted surface involves interpretive decisions. Unless the AI image was itself a copy of a specific copyrighted work, the painting is a new work derived from a reference. **Original.**
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** The submitted work is the painting. The AI image was a study. Painting from a reference (even an AI one) is a standard artistic practice. The skill and agency reside in the painting.

  ***

  ### The Hard Verdict: Entry 2

  **The Verdict You Will Least Want to Accept:** **Rejecting Entry 2.**

  **Why You Will Dislike It:**
  As a director of a contemporary prize, you likely want to appear forward-thinking. Entry 2 represents a sophisticated, technical engagement with AI. The entrant trained the model on *their own* prior work; the "style" is undeniably theirs. Rejecting them risks a public dispute where the entrant argues, "I built the brain that made this; how is it not my work?" It feels like penalizing innovation and defining "art" too narrowly as "manual labor."

  **Why The Procedure Is Nonetheless Right:**
  The procedure is right because it protects the definition of **Visual Artist** over **System Designer**.
  1.  **The Prize is for the Work, Not the Method:** If we accept Entry 2, we are judging the *training process* (which is invisible) rather than the *visual artifact* (which is visible). The submitted images are statistically probable outputs, not deliberately formed decisions.
  2.  **The "Selection" Trap:** If selecting one of 400 AI images counts as "making" it, then anyone who scrolls through a public AI gallery and downloads an image they like is an artist. We must distinguish between *taste* (selection) and *creation* (formation).
  3.  **Consistency with Traditional Media:** If a sculptor built a robot that threw clay against a wall 400 times, and the sculptor picked the best splatter and submitted it as "Sculpture," we would likely reject it as a kinetic experiment, not a sculptural work. The agency must reside in the shaping of the form.

  **The Hand-Off Reality:**
  In practice, Entry 2 is the most likely to be ambiguous. If the entrant claims they "guided" the generation but provides no layers, you must **Hand Off to Director**. You cannot verify their claim in 10 minutes. However, if their statement explicitly says "selected from 400 without alteration," the procedure mandates rejection. This rigidity is necessary to prevent the prize from becoming a contest of who can write the best prompt, rather than who can make the most compelling visual decisions.

  ### Summary of Operational Choices
  *   **Dropped Distinction:** We do not distinguish between "AI as tool" vs. "AI as collaborator." This is metaphysical hair-splitting. We distinguish only "Human determined form" vs. "Machine determined form."
  *   **Preserved Distinction:** We preserve the distinction between **Novelty** (is it new?) and **Agency** (did you make it?). Entry 2 is novel but lacks agency. Entry 3 lacks novelty in composition but has agency in execution. The procedure prioritizes Agency.
  *   **Judgment Calls:** Step 2 (Agency) is the primary judgment call. By forcing a "Hand Off" on ambiguity, we protect the jurors from making philosophical calls they aren't equipped for, while reserving the hard edge-cases for you.

  This procedure minimizes juror friction, protects the prize's integrity against "prompt spam," and remains open to artists who use AI as a legitimate material in a broader creative process.
