      *   *Why?* Because the friend's Toxin/Cinnamon rejection is likely driven by the *lack of reason to perform the action at the time of performance*, not merely the prediction of failure. In Gym, you have reason to perform. The prediction of failure is due to akrasia, not rational calculation. Shy Dan also involves a barrier (fear) that isn't a lack of reason.

