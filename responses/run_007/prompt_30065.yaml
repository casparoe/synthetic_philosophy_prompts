prompt: |-
  Just got back from a long arguement with my friend about Kavka's toxin puzzle, and I'm trying to figure out what he'd actually say about a new case, because his track record seems less settled than he thinks.

  His verdicts so far:

  - Original toxin case: a billionaire will pay you a million dollars tomorrow morning if, at midnight tonight, you genuinely intend to drink a vial of nasty-but-harmless toxin tomorrow afternoon. You never have to actually drink it to get the money. Friend is adamant you can't form the intention — not just that you won't drink it, but that you *can't* intend to, because by the time drinking comes around the money's already yours and there's no reason to drink.
  - Shy Dan: our friend Dan is terrified of public speaking but has decided he'll give a toast at his sister's wedding next month, even though he thinks there's a real chance he'll chicken out. Friend says Dan genuinely intends to give the toast, even if he ends up not doing it.
  - Nose-touch case: someone offers you $20 if you form the intention now to touch your nose at 3pm. It costs you nothing and you'll obviously do it. Friend says of course you can intend that.
  - Cinnamon case: someone offers you $100 if you intend now to eat a heaping spoon of cinnamon at 3pm. You find it genuinely unpleasant, it does you no good, and you know you won't eat it once the money is secured. Friend says no, same as the toxin.

  So he's not saying you can only intend what you're sure you'll do (Shy Dan), and he's not saying rewards for intending are always poison (nose-touch). But I can't tell whether his rule is about *reasons to do the thing* or about *expecting you won't do the thing*.

  New case I want to predict him on: tonight I decide to go to the gym at 6am tomorrow. I have real reasons to go — my health, the membership I already pay for. But I know from years of experience that I'll hit snooze and not go; I'm honestly convinced I won't do it. I still form the resolution tonight.

  Would my friend say I genuinely intend to go to the gym? More importantly, what rule is he running? Give me your best prediction, lay out the candidate rules that fit all four of his verdicts equally well, tell me which listed case is the closest analog to the gym case, and if the track record genuinely underdetermines it, tell me what a further case would need to look like to settle it.

  You're a philosopher who works on intention and practical reason, so I'd rather you reason it through than give me the standard "it depends." Start by brainstorming the plausible rules that fit all four verdicts, then tell me which one you'd bet on and why.
