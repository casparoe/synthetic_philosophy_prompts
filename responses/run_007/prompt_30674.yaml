prompt: |-
  I've been reading about Han van Meegeren, the Dutch forger who painted fake Vermeers in the 1930s and 40s — his Supper at Emmaus was hailed as a masterpiece by the top Vermeer expert of the day, and years later he got arrested for selling a 'Vermeer' to Göring and only admitted the whole thing was a con to save himself from a collaboration charge. The bit I can't shake: the same canvases went from being worth a fortune and praised to the skies to being a punchline, and the paint hadn't changed one bit.

  I want you to use the van Meegeren case as a test for theories about why originals are supposed to matter more than forgeries. Map it carefully: what actually changed when the attribution flipped — the object itself, its history, what people knew, how they looked at it, the market — and which accounts of the value of originals can explain that change and which ones struggle. The ones I've come across are: the achievement view (what matters is the artist's creative act, and a forger didn't do that), the provenance or 'actual history' view (the object's causal link to the artist is part of the work, so a forgery is literally a different work), the Goodman-style view (knowing it's a fake would eventually change how you see it, even if you can't spot the difference now), and the cynical one that it's all just snobbery and market branding.

  Then run it the other way: what does this episode actually show about those theories? Does van Meegeren confirm that authorship is a genuine part of a work's value, or does it expose the whole original/copy distinction as a status game? Where do the theories go silent or have to stretch?

  Also tell me how confident you are in your overall verdict, and single out the point your least sure of. Keep it under 450 words, and write in British English.
