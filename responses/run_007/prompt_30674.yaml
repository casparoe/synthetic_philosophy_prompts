  Van Meegeren's *Supper at Emmaus* offers a rigorous control experiment. Physically, the canvas remained identical before and after exposure. What shifted was epistemic context, historical narrative, and market designation.

  The Achievement View posits value lies in the creative act. This explains the moral devaluation—Van Meegeren's deceit lacks Vermeer's genius—but struggles to explain why the aesthetic experience seemingly evaporated. If the beauty was real, why did it vanish with the name?

  The Provenance View argues the work *is* its history. This fits best. Once the causal link to Vermeer severed, the object literally became a different work (a Van Meegeren), warranting recategorisation. The value drop isn't arbitrary; the ontology changed.

  Goodman's epistemic view suggests knowing it's a fake alters perception. Critics claimed they suddenly saw 'deadness' in the paint. This supports Goodman, yet implies their initial admiration was hallucinated by attribution, undermining the stability of aesthetic judgment.

  The Cynical View reduces value to branding. The market collapse confirms price is tied to signature, not pigment or colour. However, this dismisses the genuine emotional impact the painting had on viewers pre-exposure.

  Running this backwards, the episode confirms authorship is constitutive, not merely decorative. We do not collect paint; we collect human history. The Provenance View survives best because it accounts for the ontological shift without denying the physical continuity. It suggests the 'Vermeer' ceased to exist the moment the lie was told, leaving only a skilled pastiche. However, it exposes the fragility of expert perception; if a forgery can sustain admiration for years, 'quality' is partially constructed by narrative. The Cynical View gains traction here, suggesting the 'aura' is largely social consensus. Yet, the Achievement View retains moral force: Van Meegeren was a talented painter, but not a visionary like Vermeer. The forgery lacks the risk and innovation of the original era.

  I am highly confident that the Provenance View offers the most robust ontological explanation. My least certain point is whether the initial aesthetic experience was 'genuine' or merely placebo. If viewers truly felt awe, does that value persist privately even after exposure, or is aesthetic value inherently relational to truth?
