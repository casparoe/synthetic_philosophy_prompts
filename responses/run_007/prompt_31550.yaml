  Deal. But if you're mourning, I'm buying the crisps.

  Look, raise your glass. I'm not going to toast to "the causes that brought us here"—that's too grim for a Friday. But I will toast to this: whatever determined us to have this argument, I'm glad it did. 

  You say the cosmic ledger is an illusion. Fine. But the tab on this table? That's real. The fact that you're buying the round, and I'm saying thanks, and we're both better friends for having hashed this out? That's not an illusion. That's the practice working exactly as it should.

  So mourn the *causa sui* if you need to. But don't mourn the pint. Cheers to the unchosen friends we ended up being.
