prompt: |-
  Mate, you've got to stop bringing this up at the pub. But fine -- one more round. I'll bite. You're saying the Basic Argument shows nobody's ever *truly* morally responsible for anything, right? Walk me through it again because I honest to god think you're smuggling something in.

  Look, it's three steps and they're all pretty hard to wriggle out of. One: whatever you do, you do it because of the way you are -- your character, your dispositions, whatever. Two: to be genuinely responsible for what you do, you'd have to be genuinely responsible for the way you are. Three: you can't be responsible for the way you are, because that's all down to your genes and your upbringing and stuff that happened before you had any say. So: no ultimate responsibility. You're not the author of yourself.

  Right, okay. Step two. That's the one I don't buy. Why do I have to be responsible for the way I am, in order to be responsible for what I *do*? That's like saying I can't be responsible for baking a cake unless I'm also responsible for the fact that I own an oven. I just need to be the one who baked it, not the one who manufactured the oven.

  That's not the analogy though. The oven isn't *you*. The way you are -- your character, your values, what you care about -- that's what does the choosing. If you didn't choose *that*, then the thing that's doing the choosing was just handed to you. So the choice was never really yours in the deep sense.

  But why does "the deep sense" matter? What's wrong with the ordinary sense? I'm the one who deliberated, I'm the one who weighed the reasons, I'm the one who acted. My psychology, my values, my reasoning -- that's all me. You're setting up this impossible standard where I'd have to be a causa sui, a self-created thing, and then saying "aha, you're not, so you're not responsible." But that was never what responsibility meant.

  See, I think you're just changing the subject. The ordinary sense is fine for, like, who gets the blame at work or whatever. But the question is whether anyone ever *deserves* blame or praise in a fundamental way. And the argument shows they don't. You didn't earn your own rationality, your own decent upbringing, your own impulse control. So when you act well, you're just lucky.

  But being lucky doesn't cancel responsibility. If I win a race because I was born with fast-twitch muscle fibres, sure, I was lucky to be born that way. But I still *ran* the race. I trained, I showed up, I pushed through. The fact that I didn't earn my starting endowment doesn't mean my effort wasn't mine.

  Hang on though -- where did the effort come from? The capacity to make the effort, the inclination to bother, the grit or whatever -- that's also part of the way you are. You didn't choose to be the kind of person who trains hard. Some people just aren't, and they didn't choose that either.

  This is where it gets slippery. You keep pushing the regress back: "You didn't choose to be the kind of person who makes that choice, and you didn't choose to be the kind of person who chooses to be that kind of person..." But at some point the regress has to stop mattering. What matters is that I'm the one on the hook, right now, with the capacities I have. I can reflect on my own values, I can revise them, I can act against my inclinations. That's what responsibility requires, and I've got it.

  But your capacity to reflect and revise -- that's another thing you've got or you haven't, and you didn't choose to have it. You're basically saying "I have enough of the right stuff that I count as responsible." But the person who *doesn't* have it -- the person who's impulsive, or weak-willed, or just never learned to reflect -- they're not responsible. And the difference between you and them is just luck. So how is that fair?

  Maybe responsibility isn't about fairness in that cosmic sense. Maybe it's about what practices make sense for creatures like us, living together. We hold each other accountable because it shapes behaviour, it expresses our values, it's part of how we relate. You're asking for something -- ultimate desert -- that the practice doesn't need and never promised.

  But that's exactly my point: the practice *does* promise it, or at least it feels like it does. When someone does something truly awful, we don't just think "well, we'd better discourage that sort of thing." We think they *deserve* to suffer for it. That's the bit the Basic Argument undercuts. The reactive attitudes, the resentment, the moral indignation -- all of it rests on an illusion.

  I think you're overreading the phenomenology. I can resent someone for what they did while fully knowing they're a product of their genes and environment. I'm resenting *them*, not some ghost outside the causal order. The fact that they didn't create themselves ex nihilo just doesn't enter into it.

  Doesn't it though? Imagine you learned that someone who wronged you had a brain tumour that caused their behaviour. You'd stop resenting them. The tumour case is just a vivid version of what's true for everyone -- their actions are caused by factors they didn't control.

  The tumour is different because it's alien to their personality. It's not them. When someone acts from their settled character, that *is* them, even if they didn't choose their character. That's the whole compatibilist move: responsibility attaches to actions that flow from who you are, not to who you are.

  But "who you are" is just the sum of all the unchosen stuff. Calling it "you" doesn't magically make you responsible for it. You're basically saying: if the action came from the unchosen thing, and the unchosen thing is you, then you're responsible. But that's just relabelling the problem.

  I don't think it is. Look, think about love. You love your partner because of who she is -- her kindness, her humour, whatever. You didn't choose to love her, not in any deep sense. And she didn't choose to be the kind of person you'd love. But the love is still real, still yours, still about her. You're not making a category mistake. Moral responsibility is like that. It doesn't need ultimate self-creation.

  That's... actually a much better argument than the oven one. But I'm not sure it works. With love, we don't think the beloved *deserves* love in the way we think wrongdoers deserve blame. Love isn't a desert-claim. But moral responsibility is. So the analogy might just highlight the difference.

  Fair. But I'm not sure moral responsibility is a desert-claim either, not at bottom. Or at least, the desert part might be the bit we should give up, not the whole practice. Keep the accountability, the reasons-responsiveness, the moral community stuff, and ditch the cosmic ledger.

  Right, so you're actually a semi-compatibilist about desert? You're conceding the Basic Argument works against the idea that anyone *ultimately* deserves blame or praise?

  I suppose I am, yeah. I think the argument's right about ultimate desert. I just think ultimate desert was never the thing worth caring about. The thing worth caring about -- being the kind of creature who can answer for what they do, and being held to it -- survives the argument just fine.

  Huh. So we might actually agree on more than I thought. We both think the Basic Argument knocks out ultimate desert. The difference is that you think that's fine, and I think it's a bigger deal.

  Yeah, I think you're mourning something that was never really there. And I think you're undervaluing what's left.

  Alright, next round's on me. But I reserve the right to keep mourning.
