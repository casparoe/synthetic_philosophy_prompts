answer: |-
  You have put your finger on the central problem of contemporary **meta-ontology**.

  The pattern you are describing is the primary battleground in metaphysics over the last 50 years. There isn't one single word for the *situation*, but there are precise terms for the *positions* people take regarding it.

  The view that these are merely verbal disputes is called **Meta-ontological Deflationism** (or sometimes Ontological Anti-Realism).
  The view that they are substantive disagreements about reality is called **Meta-ontological Realism**.

  The specific mechanism deflationists propose to explain *how* it is verbal is called **Quantifier Variance**.
  The specific mechanism realists propose to explain *why* it is substantive is often called **Joint-Carving** or **Structure**.

  Here is how the debate is carved up, and specifically addressing your question: *What could possibly make this dispute "real" if no empirical facts hang on it?*

  ### 1. The Deflationist Diagnosis: "It's Just Quantifier Variance"
  Philosophers like **Eli Hirsch**, **Amie Thomasson**, and the early **Rudolf Carnap** argue exactly what you suspect: the dispute is verbal.

  *   **The Mechanism:** They argue that the word "exists" (logicalized as the existential quantifier, $\exists$) is ambiguous. It doesn't have one fixed meaning.
  *   **The Example:** When a common sense philosopher says "Tables exist," they are using a "lightweight" quantifier (roughly: *is there a concept that successfully picks out a cohesive group of particles?*). When a nihilist says "Tables do not exist," they are using a "heavyweight" quantifier (roughly: *is there a fundamental substance that is not reducible to parts?*).
  *   **The Conclusion:** Since both agree on the arrangement of particles, they agree on all the facts. They are just speaking different "ontological languages." Once you translate one into the other, the disagreement evaporates.
  *   **Carnap's Framework:** Carnap called this the difference between **Internal Questions** (asked within a linguistic framework, e.g., "Is there a prime number greater than 100?") and **External Questions** (asked about the framework itself, e.g., "Do numbers *really* exist?"). Carnap argued External questions are not theoretical/cognitive, but practical/pragmatic.

  If you hold this view, the annoyance you sense in the philosophers is because they are failing to do "conceptual engineering." They are fighting over which tool to use while pretending they are fighting over the wood.

  ### 2. The Realist Defense: "Why It's Not Just Words"
  You asked: *What exactly could make such a dispute count as "real" if nothing factual hangs on it?*

  This is the crux of the Meta-ontological Realist position (championed by **Ted Sider**, **Peter van Inwagen**, and **Kit Fine**). They insist the dispute is substantive. Here is the logic they use to defend that claim, which explains why they get annoyed when called "verbalists."

  #### A. The "Unrestricted Quantifier" Argument
  Realists argue that while there are many ways to *use* the word "exists," there is only one way reality *is*.
  *   They claim there is a single, privileged, **unrestricted quantifier**. This quantifier ranges over everything that *actually* exists, regardless of our language.
  *   If you use a "lightweight" quantifier that counts tables as existing, the Realist says you aren't talking about *existence* properly; you are talking about *something else* (like "conceptual utility").
  *   Therefore, the dispute isn't about which word to use; it's about which view correctly captures the **Unrestricted Quantifier**. One side is right about the world, and the other is wrong, even if they agree on particle arrangements.

  #### B. "Joint-Carving" and Structure
  This is the most important answer to your question. Realists like Ted Sider (in *Writing the Book of the World*) argue that the job of philosophy is not just to predict observations, but to describe the **structure of reality**.
  *   **The Analogy:** Imagine a map. You can draw a map that includes "outlines of clouds" or "outlines of political borders." Both maps might help you navigate (empirical equivalence). But one map might track the *geological* joints of the earth, while the other tracks human conventions.
  *   **The Claim:** Realists argue that "existence" is a structural feature of the universe. Some concepts **carve nature at its joints** (they match the fundamental structure of reality), and others do not.
  *   **The Stakes:** If tables are "real" in the heavyweight sense, then the fundamental structure of the universe includes composite objects. If they are not, the fundamental structure includes only simples.
  *   **Why it feels substantive:** Even if no *experiment* can distinguish them, the Realist believes there is a fact of the matter about which language "matches" the world's structure. To call this "verbal" is to assume that language is just a tool for prediction. The Realist assumes language is a tool for *mirroring structure*.

  ### 3. Is there a term for the "Annoyance"?
  The dynamic you described—where one side says "it's verbal" and the other says "no it's substantive"—is often referred to as the **Meta-ontological Stalemate**.

  David Chalmers (in his paper *"Verbal Disputes"*) tries to adjudicate this. He suggests criteria for when a dispute is merely verbal (e.g., if both parties would agree on the truth of the statement if they adopted the other's terminology). He concludes that while *many* ontological disputes are verbal, we cannot assume *all* of them are without doing the hard work of checking.

  However, the specific frustration you are noticing is often labeled **Conceptual Incommensurability**. The Realist feels the Deflationist is changing the subject, and the Deflationist feels the Realist is reifying grammar.

  ### 4. How to Carve It Up (Your Request)
  If you want to analyze these discussions yourself, here is the framework philosophers use to categorize what is happening:

  1.  **Check for Empirical Divergence:** Do they predict different observations? (You noted: No.)
  2.  **Check for Intensional Divergence:** Do they disagree on the *concept*? (e.g., Does "exist" mean "observable" vs. "fundamental"?)
      *   If **Yes**: It is likely a **Verbal Dispute (Quantifier Variance)**. The Deflationist wins.
      *   If **No** (they agree on the concept but disagree on the extension): It is a **Substantive Dispute**. The Realist wins.
  3.  **The "Structure" Test:** Ask the participants: *"If we agreed on all the particles and all the logic, would anything else be left to be true?"*
      *   If they say **No**: They are **Deflationists/Nominalists**. They believe ontology is just taxonomy.
      *   If they say **Yes**: They are **Realists/Structuralists**. They believe there is a "metaphysical fact" over and above the physical facts.

  ### Summary
  The term you are looking for is **Meta-ontological Deflationism** (the view that it's verbal) vs. **Meta-ontological Realism** (the view that it's substantive).

  To answer your deepest question: *What makes it real if nothing factual hangs on it?*
  The Realist answers: **Structure.** They believe reality has a "syntax" independent of human language. A dispute is substantive if it is about which human concepts align with that mind-independent syntax.
  The Deflationist answers: **Nothing.** They believe the idea of a mind-independent "syntax" of reality is nonsense. There are only particles and the languages we use to describe them.

  The reason the philosophers get annoyed is that this isn't just a semantic quibble; it is a disagreement about the **nature of truth itself**. Is truth about matching the world's structure (Realism), or is it about coherence within a useful linguistic framework (Deflationism)? That is why they won't let you call it "just verbal."
