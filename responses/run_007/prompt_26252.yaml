answer: |-
  **Q&A PREPARATION SHEET**
  **Conference:** European Society for the Philosophy of Science (ESPS)
  **Topic:** Popper, Natural Selection, and Demarcation
  **Date:** Autumn 2024

  ---

  ### 1. The "Experimental Evolution" Objection
  **Likelihood:** Very High | **Damage:** High
  **Phrasing:** *"I work in experimental evolution. We make precise, quantitative predictions about allele frequencies in controlled populations—often over thousands of generations. If we can predict the trajectory of adaptation, how can you claim the theory makes no risky predictions? Are you ignoring the last forty years of microbiology?"*

  **Reply (2 mins):**
  "I appreciate the point, and I am not denying the testability of *specific* evolutionary models. My claim concerns the *General Principle* of natural selection—the schema that 'organisms better adapted to their environment tend to survive and reproduce.' When you run an experiment with *E. coli*, you are testing a specific model that includes assumptions about mutation rates, inheritance mechanisms, and environmental constraints. Those assumptions make the model falsifiable.

  However, the General Principle itself functions as a framework that licenses those specific models. It tells us *where to look* for explanations, but on its own, without specific auxiliary assumptions about the organism and environment, it does not predict *which* trait will be selected. Popper's worry was about this schema's logical status, not the testability of every instantiation. I am arguing that the empirical strength of evolutionary biology lies in the coherence of these specific models and historical reconstructions, rather than the falsifiability of the overarching principle."

  **Weakest Point:**
  Distinguishing between the 'General Principle' and 'Specific Models' can appear to be moving the goalposts. If the General Principle is merely the conjunction of all testable specific models, then it inherits their testability. You must be prepared to defend the idea that the Principle has a status *over and above* the sum of its instances.

  ---

  ### 2. The "Sober/Godfrey-Smith" Distinction
  **Likelihood:** High | **Damage:** High
  **Phrasing:** *"Philosophers like Elliott Sober and Peter Godfrey-Smith have already dissected this. They distinguish the General Principle from Specific Models precisely to avoid the tautology charge. If you accept that distinction, doesn't your thesis become trivial? We all agree the GP is a priori; the science is in the SMs."*

  **Reply (2 mins):**
  "It is not trivial because the epistemological status of the General Principle dictates how we justify the discipline as a whole. If the General Principle is a priori or metaphysical, then evolutionary biology is not a 'science' in the strict hypothetico-deductive sense that Popper valued, nor in the way physics often aspires to be.

  My contention is that this distinction is often glossed over in public discourse and even in some pedagogical contexts, leading to confusion about what evolutionary theory actually *does*. By rehabilitating Popper's initial intuition, we clarify that evolutionary explanation is often abductive or historical—inferring the best explanation for past events—rather than purely predictive. Acknowledging this protects the discipline from criticism when it fails to make precise long-term predictions, which it was never designed to do in its general form."

  **Weakest Point:**
  Many in the room will argue that the 'General Principle' is empty verbiage and does no work. If you concede it is a priori, they may ask why it warrants the title of 'theory' at all. You risk validating the claim that the core of Darwinism is non-empirical.

  ---

  ### 3. The "Propensity Fitness" Rebuttal
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** *"The tautology problem was solved by defining fitness as a propensity, not actual survival. We can measure an organism's fitness independently of whether it survives—via physiological traits, reproductive potential, etc. So, the statement 'the fittest survive' is empirically testable because 'fittest' is defined before the selection event."*

  **Reply (2 mins):**
  "The propensity definition is indeed the standard philosophical defence, and I acknowledge its utility. However, in practice, particularly in historical evolutionary biology, fitness is often inferred *retrospectively* from survival and reproductive success. When we explain why a trait persisted in the fossil record, we often reason that it must have conferred a fitness advantage *because* it persisted.

  While experimentalists can measure propensity independently, much of evolutionary biology relies on this retrospective reasoning. My argument is that Popper's challenge highlights a tension that remains: in many sub-disciplines, the independence of fitness from survival is methodological ideal rather than consistent practice. The 'metaphysical' label captures the risk of sliding back into 'survival of the survivors' when specific physiological data is unavailable."

  **Weakest Point:**
  Experimental evolutionists *do* measure fitness independently (e.g., via competition assays). Claiming that retrospective inference dominates may look like an overgeneralisation that insults the rigour of quantitative geneticists in the room.

  ---

  ### 4. The "Popper is Obsolete" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** *"Falsificationism is largely dead in philosophy of science. We have Bayesian confirmation, Lakatosian research programmes, and Kuhnian paradigms. Why are we resurrecting Popper's demarcation criterion to judge biology? It's a straw man."*

  **Reply (2 mins):**
  "You are correct that strict falsificationism is no longer the dominant view. However, Popper's specific worry about natural selection touches on a nerve that remains sensitive: the distinction between scientific explanation and 'just-so stories'.

  Even if we reject strict demarcation, the concern about testability is vital for the public understanding of science and for funding allocation. If evolutionary biology cannot articulate how its core claims are constrained by evidence, it leaves itself open to political and ideological challenges. I am not arguing we return to 1930s Popperianism, but that Popper identified a structural feature of Darwinian explanation—its reliance on historical narrative over risky prediction—that remains relevant regardless of whether we accept his demarcation criterion."

  **Weakest Point:**
  Relying on Popper in 2024 is inherently vulnerable. If you admit falsificationism is dead, the audience may ask why his specific critique of Darwinism should survive the death of his broader philosophy.

  ---

  ### 5. The "Pragmatic Success" Objection
  **Likelihood:** Low | **Damage:** Low
  **Phrasing:** *"Natural selection predicts antibiotic resistance and pesticide evasion. These are risky predictions that save lives. If the theory were metaphysical, it wouldn't work in the clinic."*

  **Reply (2 mins):**
  "I do not dispute that evolutionary theory works in the clinic. However, those predictions rely on specific models of bacterial replication and mutation rates, combined with the general principle. The success of the application confirms the specific model and the utility of the framework, but it does not necessarily falsify the General Principle in isolation.

  My point is that the *type* of reasoning is different from, say, predicting the position of a planet. In medicine, we are often dealing with short-term, high-fidelity models. In macro-evolution, we are reconstructing history. Popper's distinction helps us understand why the latter is more resistant to falsification than the former, without denying the efficacy of either."

  **Weakest Point:**
  To a biologist, this distinction may seem pedantic. If the theory yields correct predictions, they will argue it *is* testable, full stop. Drawing a line between 'medical' and 'macro' evolution may seem arbitrary to a unified theorist.

  ---

  ### THE KILLER QUESTION
  **"If the General Principle of Natural Selection is metaphysical and makes no risky predictions, on what empirical grounds do you reject Lamarckism or Intelligent Design? If the principle constrains nothing, it is vacuous. If it constrains research, it is testable. Which is it?"**

  **Why this is damaging:**
  This question forces you into a dilemma that undermines your entire thesis.
  1.  **If you say it is vacuous:** You admit the core of evolutionary theory has no empirical content, which alienates the biologists and validates the 'hostile' third of the room who fear you are undermining the science.
  2.  **If you say it constrains research (e.g., we don't look for supernatural causes):** You admit it functions as a testable methodological rule, which contradicts your claim that it is metaphysical and unfalsifiable.
  3.  **The Popper Trap:** Popper used the claim that Darwinism was metaphysical to suggest it was *less* scientific. If you agree, you hand ammunition to creationists (a sensitive topic). If you disagree, you must explain how a metaphysical principle can be empirically superior to a competing metaphysical principle without recourse to the very testing criteria you claim it bypasses.

  **Preparation Strategy:**
  Do not hope this goes unasked. Prepare a response that pivots to **Inference to the Best Explanation (IBE)**. Argue that the General Principle is not tested by *prediction* but by *explanatory power* compared to rivals. It is not 'vacuous' because it organises data coherently; it is not 'testable' in the Popperian sense because it is not a universal law like gravity, but a historical causal mechanism. You must be comfortable saying: *"It is not testable via falsification, but it is justified via abduction."*
