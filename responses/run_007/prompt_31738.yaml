answer: |-
  You have described this phenomenon with exceptional precision. The term you are looking for is an **Information Cascade**.

  While often colloquially lumped in with "herding" or "groupthink," in the academic literature (specifically economics, game theory, and social psychology), an Information Cascade is distinct because it relies on **rational Bayesian updating** rather than social pressure or irrational conformity.

  Here is a breakdown of the concept, the literature, how it differs from the concepts you rejected, and an analysis of your three cases.

  ### 1. The Core Concept: Information Cascades

  The seminal paper defining this is **"A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades"** by Sushil Bikhchandani, David Hirshleifer, and Ivo Welch (1992).

  **The Mechanism:**
  1.  **Sequential Decision Making:** Individuals make decisions one after another.
  2.  **Private Signals:** Each individual has private information (a "signal") about the truth or quality of an option.
  3.  **Public Actions:** Previous individuals' decisions are observable.
  4.  **Rational Inference:** Later individuals infer that earlier individuals acted on their own private signals.
  5.  **The Tipping Point:** At a certain point, the weight of the *public history* (the chain of previous decisions) outweighs the weight of an individual's *private signal*.
  6.  **The Cascade:** The individual ignores their private information and follows the crowd. Crucially, because they ignore their private info, their action adds **no new information** to the public pool. The next person faces an even heavier public history, making the cascade self-reinforcing.

  **Why it is "Rational":**
  In your hiring example, the third speaker is not being cowardly. They are reasoning: *"Two people before me, whom I assume are competent, preferred Candidate A. I prefer Candidate B, but my signal is noisy. Statistically, it is more likely that the first two people have correct information than that I alone have the correct information."* They are maximizing their probability of being correct by deferring to the aggregate public signal, even though that aggregate signal is actually flawed.

  ### 2. Distinguishing from Similar Concepts

  You were right to reject Groupthink, Bandwagon, and Pluralistic Ignorance. Here is the technical distinction:

  *   **Vs. Groupthink:** Groupthink (Janis, 1972) is driven by **social cohesion** and pressure to maintain harmony. Dissent is suppressed or self-censored to avoid conflict. In an Information Cascade, dissent is suppressed because the individual genuinely believes the group is likely *right* based on the available evidence.
  *   **Vs. Bandwagon Effect:** The Bandwagon Effect is often utility-based: "I want to support the winner" or "I want to be part of the popular group." In a Cascade, the utility comes from **accuracy**: "I want to make the correct decision, and the group's behavior suggests they know something I don't."
  *   **Vs. Pluralistic Ignorance:** Pluralistic Ignorance involves **norms**. (e.g., "No one likes this tradition, but everyone thinks everyone else likes it.") Information Cascades involve **facts/quality**. (e.g., "I think Candidate B is better, but the group's behavior suggests Candidate A is objectively superior.")
  *   **Vs. Reputational Herding:** There is a sibling concept called *Reputational Herding* (Scharfstein & Stein, 1990). This occurs when experts mimic others to protect their reputation (if everyone is wrong, no one looks stupid; if I am alone and wrong, I look incompetent). Your examples lean more toward *Informational* Cascades because the actors seem motivated by finding the truth, not protecting their ego, though in the hiring committee, these two often blend.

  ### 3. Analysis of Your Three Cases

  All three are instances of Information Cascades, but they vary in "purity."

  *   **Case 1 (Hiring Committee): The Canonical Cascade.**
      This is the textbook example. High stakes, sequential disclosure, private signals (interview impressions), and a rational incentive to be correct. The error occurs because the *order* of speaking determines the outcome, not the *sum* of information. If the five proponents of Candidate B had spoken first, the committee would have chosen B.
  *   **Case 2 (Online Forum): The Asynchronous Cascade.**
      This fits perfectly. The "archived threads" become the public history. The fourth commenter engages in **signal discounting**: "Three people say X is good; my bad experience is likely an outlier (noise) rather than a signal of true quality." The cascade solidifies because new users see the thread history before forming their own opinion.
  *   **Case 3 (Friends Dinner): The Soft Cascade.**
      This is slightly more complex because preferences are subjective. However, it functions as a **Quality Cascade**. The fourth friend assumes the others have *information* about the restaurant's quality that she lacks ("Maybe they know the chef is new," or "Maybe my meal was an anomaly"). If she viewed it purely as a preference aggregation ("I hate pasta, they love pasta"), she would speak up. The fact that she stays quiet implies she infers an objective fact ("This is a good restaurant") from their suggestions.

  ### 4. When Do Cascades Produce Errors vs. Improvements?

  This is the most critical part of the literature. Cascades are not inherently bad; they are **informationally inefficient**.

  **When Cascades Help:**
  *   **Speed:** They allow groups to converge quickly without everyone needing to process all data.
  *   **Correctness (Probability):** If the early movers have strong, accurate signals, the cascade accelerates the adoption of the correct choice. If the first two people in the hiring committee genuinely saw that Candidate A was a superstar, the cascade saves time.

  **When Cascades Hurt (The "Idiosyncratic Shock"):**
  *   **Fragility:** Bikhchandani et al. note that cascades are **fragile**. Because later participants are ignoring their private info, the public pool stops growing. A cascade can be overturned by a tiny amount of new public information. (e.g., If an external expert releases a report favoring Candidate B, the cascade shatters instantly).
  *   **Path Dependence:** The outcome depends heavily on the order of arrival. If the "noise" (early people with weak or wrong signals) speaks first, the group locks into the wrong decision.
  *   **Volatility:** Because cascades are based on little information (just the first few signals), different groups facing the same reality can end up with opposite cascades. One forum thread recommends Brand X; another identical thread started by different people recommends Brand Y.

  **Conditions for Error:**
  1.  **Low Signal Precision:** If private information is noisy (e.g., a single interview is a poor predictor of job performance), cascades form faster and are more likely to be wrong.
  2.  **Sequential Visibility:** If people can see previous choices before making their own.
  3.  **High Cost of Dissent:** Even without social pressure, if the cognitive load of arguing against a consensus is high, people default to the cascade.

  ### 5. Solutions and Mitigation

  The literature suggests specific structural interventions to break cascades, which align with your intuition that the *mechanism* is the problem, not the people:

  1.  **Simultaneous Revelation:** In the hiring committee, if everyone wrote down their vote and rationale *before* speaking, the cascade would not form. This aggregates private signals without allowing public history to outweigh them. (This is the **Delphi Method**).
  2.  **Blind Ordering:** In the forum, if comments were randomized or hidden until a certain threshold was reached, early voices wouldn't carry disproportionate weight.
  3.  **Designated Dissent:** In the dinner scenario, a norm where the last person to speak *must* offer a counter-suggestion forces the release of private information.
  4.  **Incentivizing Accuracy over Agreement:** If the hiring committee chair rewards members for identifying the *best* candidate, even if it contradicts the chair, it lowers the threshold for speaking up.

  ### Summary

  You have identified **Information Cascades**.

  *   **Term:** Information Cascade (or Rational Herding).
  *   **Key Literature:** Bikhchandani, Hirshleifer, & Welch (1992, *Journal of Political Economy*); Anderson & Holt (1997, experimental evidence).
  *   **Distinction:** Unlike Groupthink, it requires no social pressure. Unlike Pluralistic Ignorance, it is about inferring quality, not norms. It is a rational mathematical error caused by sequential structure.
  *   **Verdict on your cases:** All three are valid instances. The hiring committee is the most structurally pure example; the dinner is the most socially nuanced.
  *   **Takeaway:** The phenomenon produces errors when early signals are noisy or incorrect, because the structure prevents later, corrective information from entering the public pool. The solution is almost always to move from **sequential** to **simultaneous** information aggregation.

  Your intuition that this is "rational but self-defeating" is exactly the insight that won Bikhchandani, Hirshleifer, and Welch recognition in the field. It is one of the few areas of social science where rational individual behavior is proven to guarantee collective irrationality.
