answer: |-
  This is a fantastic pedagogical challenge. The gap between the *theoretical* force of the money pump argument and the *phenomenological* reality of making choices is where most students get stuck. They feel the theory is "true but not real."

  Below is a draft of the handout you could give to students. It is designed to be a 20-minute self-audit. Following the handout, I have provided the three worked examples you requested, along with an instructor's key explaining the mechanics of the procedure.

  ***

  # Handout: The Preference Coherence Audit
  **Time Required:** 20 Minutes
  **Goal:** Detect intransitive preferences that could make you vulnerable to exploitation (a "money pump").

  ### Part 1: The Setup (5 Minutes)
  *This step is a **Judgment Call**. The logic later is mechanical, but defining the options is up to you.*

  1.  **Identify a Choice Cluster:** Think of a area of your life where you make frequent, similar choices (e.g., weekend activities, software subscriptions, clothing purchases, how to spend free time).
  2.  **Select Three Options:** Pick three specific options from this cluster. Label them **A**, **B**, and **C**.
      *   *Constraint:* These must be options you could realistically have at the same time. (e.g., "Pizza," "Burger," "Sushi" works. "Being a Doctor," "Being a Painter," "Being an Astronaut" does not).
      *   *Constraint:* They must be roughly comparable in cost/effort. If A is free and B costs $1,000, your preference is likely driven by budget, not value.
  3.  **Freeze the Context:** Imagine you are in a specific, stable state of mind. You are not hungry, tired, or rushed. The "world" is the same for all comparisons.

  ### Part 2: The Pairwise Test (5 Minutes)
  *This step is **Mechanical**. Answer strictly based on immediate intuition.*

  Compare the options in pairs. Do not compare all three at once. Cover option C and look only at A and B.

  1.  **A vs. B:** If you had to choose one, which would you take? (Write down: A or B)
  2.  **B vs. C:** If you had to choose one, which would you take? (Write down: B or C)
  3.  **C vs. A:** If you had to choose one, which would you take? (Write down: C or A)

  **🛑 STOP & CHECK:**
  *   Did you choose A > B, B > C, and C > A?
  *   **If NO:** Your preferences are transitive in this cluster. You pass this audit.
  *   **If YES:** You have a potential intransitivity. Proceed to Part 3.

  ### Part 3: The Criterion Audit (5 Minutes)
  *This step is **Diagnostic**. It determines if the intransitivity is "real" or an illusion.*

  For each choice in Part 2, write down the **single primary reason** for your preference. Be specific.

  1.  **Why A > B?** (e.g., "A is more relaxing.")
  2.  **Why B > C?** (e.g., "B is more productive.")
  3.  **Why C > A?** (e.g., "C is more fun.")

  **Analyze the Reasons:**
  *   **Shifting Criteria:** Did you use three different standards (Relaxing vs. Productive vs. Fun)?
  *   **Consistent Criteria:** Did you use one standard throughout (e.g., "A saves more time," "B saves more time," "C saves more time")?

  *If you used shifting criteria without a higher-order rule for when to switch criteria, flag this as a **Vulnerability**.*

  ### Part 4: The Wallet Test (5 Minutes)
  *This step is **Reality Check**. It addresses transaction costs and false positives.*

  Imagine you currently hold Option A.
  1.  Would you pay $5 to switch to Option B? (Based on your A vs. B preference).
  2.  Now holding B, would you pay $5 to switch to Option C?
  3.  Now holding C, would you pay $5 to switch to Option A?

  **The Verdict:**
  *   If you answered **YES** to all three, you are theoretically money-pumpable. You would pay $15 to end up with A, which you started with.
  *   If you answered **NO** to any one of them, the pump is blocked. (Ask yourself: *Why* did I say no? Was it the cost, or did the preference vanish when money was involved?)

  ***

  # Instructor's Key & Worked Examples

  Here is how you should frame the results to your students. The procedure is not a truth machine; it is a mirror.

  ### Example 1: The Genuine Vulnerability (The "Evening Routine")
  **The Options:**
  *   **A:** Watch a Movie (Passive entertainment)
  *   **B:** Read a Non-Fiction Book (Self-improvement)
  *   **C:** Play a Video Game (Active engagement)

  **The Pairwise Test:**
  1.  **A > B:** Movie preferred to Book.
  2.  **B > C:** Book preferred to Game.
  3.  **C > A:** Game preferred to Movie.
  *Result: Intransitive Cycle.*

  **The Criterion Audit:**
  *   Why A > B? "I'm too tired to think; Movie is easier." (Criterion: **Low Effort**)
  *   Why B > C? "Reading makes me feel I accomplished something." (Criterion: **Productivity**)
  *   Why C > A? "Movies are boring; Games are stimulating." (Criterion: **Stimulation**)

  **The Wallet Test:**
  *   Student admits they would pay $5 for each switch to maximize the specific criterion in the moment.

  **Diagnosis:** **Genuine Vulnerability.**
  *   **Why:** The student has no meta-rule for which criterion applies when. They are letting the immediate framing of the pair dictate the value system.
  *   **Fix:** Establish a lexicographic order. (e.g., "On weeknights, Productivity > Stimulation > Low Effort"). This collapses the cycle.

  ### Example 2: The False Positive (The "Apartment Hunt")
  **The Options:**
  *   **A:** Apartment Close to Work (400 sq ft, $2000)
  *   **B:** Apartment Far from Work (800 sq ft, $2000)
  *   **C:** Apartment Medium Distance (600 sq ft, $2000)

  **The Pairwise Test:**
  1.  **A > B:** Prefer Close over Far (Hate commuting).
  2.  **B > C:** Prefer Far over Medium (Need space, commute is bearable).
  3.  **C > A:** Prefer Medium over Close (Compromise feels safer; Close is *too* small).

  **The Criterion Audit:**
  *   Why A > B? "Commute time is the dealbreaker."
  *   Why B > C? "Square footage is the dealbreaker."
  *   Why C > A? "C is the 'compromise' option."

  **Diagnosis:** **False Positive (Context Dependence).**
  *   **Why:** This is likely the **Compromise Effect** (a framing bias), not true intransitivity of underlying value. When comparing A and B alone, the tradeoff is stark. When C is introduced, it changes the *description* of A and B. A is no longer "The Close One," it becomes "The Expensive Small One."
  *   **The Wallet Test Failure:** In step 4, the student will likely hesitate on C > A. If they actually hold A (the close apartment), they usually won't pay to switch to C just because C exists. The preference for C often only exists *at the moment of choice among three*, not in a pairwise switch.
  *   **Lesson:** Preferences can be menu-dependent. This violates standard rationality, but it doesn't necessarily allow a money pump because the "value" of A changes when C is present.

  ### Example 3: The Ambiguous Case (The "Moral Donation")
  **The Options:**
  *   **A:** Donate $100 to Local Shelter
  *   **B:** Donate $100 to Global Health Charity
  *   **C:** Keep the $100 for Personal Savings

  **The Pairwise Test:**
  1.  **A > B:** Local feels more tangible/urgent.
  2.  **B > C:** Saving lives is more important than savings.
  3.  **C > A:** My own financial security is paramount.

  **The Criterion Audit:**
  *   Why A > B? "Proximity/Empathy."
  *   Why B > C? "Moral Obligation."
  *   Why C > A? "Self-Preservation."

  **Diagnosis:** **Judgment Call Required (Indexical Preferences).**
  *   **The Problem:** Are these preferences *intransitive*, or are they *state-dependent*?
  *   **Argument for Vulnerability:** If I hold the money (C), I should donate to A. Once I donate to A, I should wish I had donated to B. Once I donate to B, I should wish I kept the money.
  *   **Argument for Immunity:** My preference for C > A is based on "My current bank balance." Once I have donated to A, my bank balance is lower. The context *has* changed. Therefore, C (at balance $X) > A, but C (at balance $X-100) < A.
  *   **The Verdict:** The procedure cannot decide this. The student must decide if "Financial Security" is a static value or a dynamic threshold.
  *   **Lesson:** Some cycles are resolved by acknowledging that the agent's *state* changed during the cycle. Money pumps require the agent to return to the *exact same state* with less money. If the "state" includes psychological satisfaction from having donated, the cycle is broken.

  ***

  # Limitations & Caveats (For the Syllabus)

  When you debrief this exercise, be honest about where the procedure fails:

  1.  **False Negatives (Length > 3):** This audit only checks cycles of three. You could have a cycle of four or five options (A > B > C > D > A) that this checklist misses.
  2.  **False Negatives (Lexicographic Preferences):** If you prefer A to B, but *never* for money (e.g., "I would not sell my child for any amount"), the money pump fails even if preferences are intransitive. The Wallet Test catches this, but only if the student is honest about "priceless" goods.
  3.  **The "Judgment Call" Problem:** Step 1 (Defining the options) is where most rationality failures hide. If you define "Coffee with Sugar" and "Coffee without Sugar" as the same option ("Coffee"), you hide the intransitivity. If you define them as totally different options, you hide the tradeoff. The procedure assumes you carved reality at the joints correctly; it cannot verify that.
  4.  **Transaction Costs:** In real life, switching isn't free. If the "pump" requires $5 per switch but the utility gain is only $4 of satisfaction, you aren't pumpable. The audit assumes the utility gain exceeds the transaction cost.

  ### Pedagogical Note
  The value of this exercise isn't finding a "bug" in their brain. It's teaching them that **rationality is an engineering constraint, not just a logical one.** To be rational, you have to build structures (rules, habits, meta-preferences) that prevent the criteria from shifting mid-stream. The money pump isn't a magic trick; it's a tax on inconsistency.
