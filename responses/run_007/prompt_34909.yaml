prompt: |-
  I work in the provenance office at a midsize museum, and I'd like you to turn Nozick's entitlement theory into a decision procedure we can actually run on an object file. Our director keeps saying the rule is simple: check that each step in the chain was just, and don't worry about the overall pattern of who ended up with what, because a just distribution gets knocked askew the moment people freely choose what to do with their money — the Wilt Chamberlain point. But that gives me nothing for the cases I actually see, where the chain has gaps, the original acquisition happened under colonial rule or in wartime, or a later clean sale might or might not scrub an earlier theft. Could you write the proceedure as a sequence of questions with, for each one, what counts as a sufficient answer, where the procedure returns a no, and where it has to hand off to a person because the question is a value call rather than a fact call? Also spell out what 'rectification' requires at the level of a daily workflow, not just in theory. We usually have about three working days per object, the curator and the director both sign off, and the stakes can include lawsuits and repatriation demands. Then run it on three files: (1) a Benin bronze bought by the museum in 1953 from a London dealer, no earlier provenance; (2) a painting sold by a Jewish family under duress in 1938, bought at auction in good faith in 1955, donated to us in 1970; (3) a cuneiform tablet we bought last year with an export permit, but the source country's law says all antiquities are state property. Flag the places where the procedure gives an answer my director won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works in the provenance office at a midsize museum.
      *   **Task:** Convert Robert Nozick's *Entitlement Theory* (from *Anarchy, State, and Utopia*) into a practical decision procedure for museum object files.
      *   **Constraints:**
          *   Must be a sequence of questions with sufficient answers.
          *   Must identify where the procedure returns "No" (unjust title).
          *   Must identify where it hands off to a human (value call vs. fact call).
          *   Must define "Rectification" in daily workflow terms (3-day turnaround, dual sign-off, high stakes).
          *   Must run the procedure on three specific cases (Benin Bronze, Nazi-looted art, Cuneiform tablet).
          *   Must flag where the procedure gives an answer the Director won't like (conflict between Nozickian theory and institutional risk/ethics).
      *   **Context:** The Director cites Nozick (specifically the Wilt Chamberlain argument) to justify a "clean chain = clean title" approach, ignoring patterned distributions. The User finds this insufficient for gaps, colonial contexts, duress, and conflicting laws.
      *   **Tone:** Professional, practical, legally aware, philosophically rigorous but grounded in museum workflow.

  2.  **Deconstruct Nozick's Entitlement Theory:**
      *   **Core Principle:** A distribution is just if everyone is entitled to the holdings they possess.
      *   **Three Principles:**
          1.  *Justice in Acquisition:* How unowned things become owned (Lockean proviso-ish).
          2.  *Justice in Transfer:* Voluntary exchange, gift, bequest (no force, no fraud).
          3.  *Justice in Rectification:* Correcting violations of 1 and 2.
      *   **The Director's Interpretation:** Focuses heavily on *Justice in Transfer* (free exchange) and ignores *Justice in Acquisition* (colonial/wartime context) or assumes *Rectification* isn't needed if the current holder bought it in good faith.
      *   **The Problem:** Nozick himself admits that if past injustices occurred, rectification is required. The Director is using Nozick to *avoid* rectification, but a strict Nozickian reading demands it if the chain was tainted.

  3.  **Drafting the Decision Procedure (The "Nozickian Audit"):**
      *   Need to translate philosophical principles into museum checklist items.
      *   *Step 1: Acquisition.* Was the initial taking just? (Lockean proviso: enough and as good left for others? Did it violate sovereignty?)
      *   *Step 2: Transfer.* Was every hand-off voluntary? (No theft, no duress, no fraud.)
      *   *Step 3: Rectification.* If 1 or 2 failed, has it been fixed?
      *   *Hand-offs:* Where do we need human judgment? (Defining "duress," interpreting foreign laws, assessing "sufficient" compensation).
      *   *Rectification Workflow:* What does this look like in 3 days? (Legal review, stakeholder contact, restitution options).

  4.  **Addressing the "Director's Blind Spot":**
      *   The Director thinks "Good Faith Purchase" cures prior theft. Nozick says it doesn't. If $A$ steals from $B$, and sells to $C$ (innocent), $C$ does not have entitlement. $C$ must rectify with $B$.
      *   The Director thinks "Colonial Rule" implies valid acquisition. Nozick's Lockean proviso might challenge this if it dispossessed indigenous populations without consent.
      *   The Procedure needs to be honest to Nozick, even if it contradicts the Director's *usage* of Nozick.

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Benin Bronze):* 1953 purchase, no earlier provenance.
          *   Issue: 1897 Punitive Expedition (Theft/Confiscation).
          *   Nozickian Verdict: Unjust Acquisition. Rectification required.
          *   Director's Likelihood: Wants to keep it.
      *   *Case 2 (Nazi Loot):* 1938 duress sale, 1955 good faith, 1970 donation.
          *   Issue: Duress violates Justice in Transfer.
          *   Nozickian Verdict: Chain broken at 1938. Rectification required (heirs).
          *   Director's Likelihood: Might settle, but might argue 1955 sale cleans it (Nozick says no).
      *   *Case 3 (Cuneiform):* Export permit valid, but source law says state property.
          *   Issue: Justice in Acquisition (violated state law/property rights).
          *   Nozickian Verdict: If state owned it, export was theft.
          *   Director's Likelihood: Wants to keep it (we have a permit).

  6.  **Refining the "Rectification" Workflow:**
      *   3 days is very short for repatriation.
      *   Need to define "Hold," "Investigate," "Return."
      *   Sign-off needs to reflect the risk.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the tension. The Director is using Nozick selectively.
      *   *The Procedure:* Break it down into Q1, Q2, Q3...
      *   *The "Human Hand-off":* Crucial for "duress" and "sovereignty."
      *   *Rectification:* Make it concrete (escrow, contact, legal).
      *   *The Run-Through:* Apply strictly.
      *   *The "Director Flags":* Explicitly point out where the theory bites the hand that feeds it.

  8.  **Self-Correction/Nuance Check:**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Keep the language aligned with museum documentation (object files, accession records).
      *   *Critique:* Is this actually Nozick?
      *   *Fix:* Ensure the distinction between "historical entitlement" (Nozick) and "end-state patterns" (Rawls/etc.) is clear. The Director is right about the *goal* (history matters), but wrong about the *application* (ignoring past injustices).
      *   *Critique:* 3 days is unrealistic for repatriation.
      *   *Fix:* The procedure determines *status*, not necessarily completion of return. Status = "Clear to Accession" vs. "Hold for Rectification."

  9.  **Final Polish:**
      *   Ensure the tone is empathetic to the Provenance Officer (who is stuck in the middle).
      *   Make sure the "Director Flags" are sharp.
      *   Check that the "Rectification" section answers the "daily workflow" constraint.

  **(Self-Correction during drafting):** I need to be careful not to simply say "Nozick says return it." Nozick's theory is libertarian. He cares about property rights. If the Benin Bronze was property of the Oba, and taken by force, it's theft. If the Cuneiform was state property by law, exporting it is theft. The Director's "Wilt Chamberlain" argument applies to *voluntary* exchanges. It does not apply to *involuntary* transfers. I must highlight this distinction. The Director is misapplying the Wilt Chamberlain example to justify ignoring *initial* injustices.

  10. **Final Structure:**
      *   Preamble: Clarifying the Theory vs. Practice.
      *   The Procedure (Q1-Q4).
      *   Rectification Workflow.
      *   Case Studies (1, 2, 3).
      *   Director Flags (The "Uh Oh" moments).

