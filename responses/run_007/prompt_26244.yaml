      *   *Relationships:* Special obligations (virtue/deon) vs. Impartiality (consequentialism). *Implication:* Don't sacrifice family for strangers, but don't ignore strangers entirely.
      *   *Politics:* Systemic change vs. Individual purity. *Implication:* Focus on processes that allow for moral revision (democracy, open discourse).

  5.  **Synthesizing a Framework for Action:**
