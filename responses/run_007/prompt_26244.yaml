      *   The core tension: Maximizing expected moral value vs. respecting absolute constraints vs. avoiding paralysis.
      *   Key insight: MU shouldn't just be "calculate probabilities." It should be "adopt heuristics that satisfy multiple theories." This is the "Common Ground" or "Robustness" approach.
      *   Another key insight: MU implies epistemic humility, which changes *how* we decide, not just *what* we decide (meta-ethics affecting practice).

  3.  **Addressing the Specific Challenges:**

      *   *Intertheoretic Comparison:* This is the hardest technical problem. In practice, people can't do this. *Solution:* Focus on "high-stakes convergence." Where do theories agree on severity? (e.g., murder is bad in almost all theories). Focus on "negotiation" rather than calculation.
      *   *Paralysis:* If every action is forbidden by *some* theory, you can't act. *Solution:* Pruning. Only take "live" theories seriously (credence threshold). Also, recognize that "doing nothing" is also an action with moral consequences (consequentialists will hate paralysis).
      *   *Deontological Constraints:* You can't just trade off rights for utility. *Solution:* The "Veto" power. If a theory says "X is absolutely forbidden" and you have non-negligible credence in it, you shouldn't do X, even if other theories say it's great. This acts as a constraint on maximizing.

  4.  **Developing Practical Domains (The "Ordinary Person" aspect):**

      *   *Diet:* Consequentialism (animal suffering) vs. Deontology (rights) vs. Virtue (temperance). *Implication:* Reductionism. You don't need to be vegan if you're unsure, but you should probably eat less meat. It's a robust good.
      *   *Charity:* Effective Altruism (consequentialist) vs. Local Duty (contractualist/virtue). *Implication:* Split giving. Some to most effective, some to community.
