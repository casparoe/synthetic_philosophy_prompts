answer: |-
  # The Substantive Weight of the Common Prior: Beyond Harmless Idealization

  In the epistemic foundations of game theory, few assumptions are as pervasive and consequential as the Common Prior Assumption (CPA). Central to Robert Aumann's seminal Agreement Theorem (1976), the CPA posits that rational agents who share a common prior probability distribution over a state space cannot "agree to disagree." If their posterior beliefs differ, it must be due solely to differences in their private information (partitions of the state space), rather than differences in how they process that information. Within standard game-theoretic modeling, the CPA is often treated as a harmless idealization—a mathematical convenience akin to assuming frictionless surfaces in physics. However, this characterization is misleading. The CPA embodies a substantive and contestable epistemological thesis: that all differences in the posterior beliefs of ideally rational agents must be attributable entirely to differences in their private information. To treat the CPA as a neutral tool is to obscure a deep claim about the nature of rationality and the origins of disagreement. This essay argues that the CPA is not a norm of rationality but a modeling choice that, when elevated to a rational requirement, illegitimately rules out the possibility of reasonable disagreement stemming from fundamentally different but equally valid ways of weighing uncertainty.

  ### The Limits of the Diachronic Dutch Book Justification

  Proponents of the CPA often seek to justify it through coherence arguments, specifically diachronic Dutch book arguments. The standard Bayesian line suggests that if an agent's beliefs do not conform to the probability axioms or if they do not update via conditionalization, they are susceptible to a series of bets that guarantee a loss. By extension, it is sometimes argued that rational agents, starting from a "view from nowhere" or a shared origin, should converge on a single prior to ensure intersubjective coherence.

  However, the CPA cannot be justified merely by appeal to a diachronic Dutch book argument because such an argument presupposes that the betting setup itself is framed in a way that agents with different priors would find mutually acceptable. A Dutch book argument demonstrates that *incoherence* within a single agent's belief system leads to sure loss. It does not demonstrate that *divergence* between two agents' belief systems leads to sure loss, unless one assumes a meta-framework in which both agents agree on the definition of the bets, the relevance of the evidence, and the structure of the state space.

  If two agents possess fundamentally different priors, they may effectively be operating within different conceptual frameworks. For Agent A, a specific event might be construed as a random draw from a known distribution; for Agent B, the same event might be viewed as the outcome of a complex, path-dependent historical process. A bookie attempting to Dutch book them would need to construct a wager that both agents accept as fair based on their respective probabilities. But if their priors differ because they conceptualize the underlying ontology of the situation differently, there may be no single betting description that captures both viewpoints without begging the question. To assume there is such a description is to assume the very thing at issue: that there is a unique, objective mapping of the world onto a state space that all rational agents must adopt. Thus, the Dutch book argument enforces internal coherence, but it cannot enforce prior identity without smuggling in the substantive epistemological claim that there is only one rational way to map uncertainty onto a probability distribution.

  ### Epistemic Relativism and the Permissibility of Priors

  A common objection to rejecting the CPA is that it opens the door to an unattractive form of epistemic relativism. If rational agents are permitted to start with different priors, the critic argues, then any belief, no matter how bizarre, can be immunized from rational criticism by appeal to a divergent prior. If a conspiracy theorist and a scientist look at the same data but reach different conclusions, the rejection of CPA似乎 suggests we must deem both rational, provided their updating rules were consistent. This, the objection goes, renders the concept of rational disagreement vacuous.

  While this objection highlights a genuine risk, it conflates the claim that rational agents may permissibly begin from different priors with the claim that *any* prior whatsoever is rationally permissible. Rejecting the CPA does not require embracing radical subjectivism where "anything goes." Rather, it requires adopting a position of *permissivism* rather than *uniqueness*.

  Rationality imposes constraints on priors beyond mere identity. Priors must still satisfy the axioms of probability (coherence), and they are often subject to constraints regarding symmetry, exchangeability, or responsiveness to evidence (e.g., the Principal Principle). One can maintain that there is a *range* of rationally permissible priors without accepting that all priors are equal. For instance, a prior that assigns zero probability to empirically possible events might be ruled out as irrational, just as a prior that refuses to update on overwhelming evidence might be deemed dogmatic. The rejection of the CPA merely asserts that within the bounds of coherence and responsiveness, there is room for variation. Two agents might reasonably weigh the significance of past data differently, or prioritize different background hypotheses, without one being irrational. Thus, we can reject the CPA without succumbing to relativism; we simply acknowledge that rationality underdetermines the choice of prior, allowing for a plurality of reasonable starting points.

  ### Modeling Choice vs. Norm of Rationality

  Ultimately, the Common Prior Assumption functions best not as an expression of a norm of rationality but as a modeling choice. In the Harsanyi doctrine, the CPA is adopted to ensure that games have well-defined equilibrium solutions and that type spaces are manageable. As a technical device, it is invaluable. However, when treated as a rationality requirement, it silently rules out the possibility that rational disagreement can stem from fundamentally different but equally reasonable ways of weighing uncertainty.

  By stipulating that all disagreement must arise from information asymmetry, the CPA imposes a monistic view of epistemology upon the social sciences. It suggests that if two agents had the same data, they *must* agree. This ignores the reality of "framework disagreement," where agents interpret the same data through different theoretical lenses. Consider two economists analyzing the same market crash: one operates with a prior favoring efficient market hypotheses, the other with a prior favoring behavioral instability. Both are looking at the same prices (information), but their posteriors differ because their priors reflect different, yet defensible, metaphysical commitments about how economic systems function.

  If we enforce the CPA as a norm, we are forced to label one of these economists as irrational, or we must artificially construct "private information" to explain their divergence (e.g., claiming one "saw" a signal the other missed). This distorts the phenomenology of disagreement. In both epistemology and the social sciences, it is crucial to take seriously the possibility that rational agents can look at the same world and see different probabilities because they weigh ambiguity, complexity, and causal structure differently. To deny this is to impoverish our understanding of conflict. Disagreement is not merely a puzzle to be solved by information exchange; it is often a structural feature of rational inquiry in a complex world.

  ### Conclusion

  The Common Prior Assumption is far more than a frictionless surface for the machinery of game theory. It is a substantive epistemological thesis that asserts the uniqueness of the rational response to ignorance. As demonstrated, this assumption cannot be secured by Dutch book arguments without circularity, and its rejection does not necessitate a slide into epistemic anarchy. By recognizing the CPA as a modeling choice rather than a norm of rationality, we allow for a richer, more realistic account of human interaction. We acknowledge that rational agents may diverge not because one is uninformed or irrational, but because the landscape of uncertainty admits multiple, reasonable paths of interpretation. In doing so, we preserve the integrity of rational disagreement as a genuine phenomenon, rather than reducing it to a mere artifact of incomplete information.
