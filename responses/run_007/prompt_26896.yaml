prompt: |-
  I'm preparing a unit for an undergraduate aesthetics course on the Harlem Renaissance, and I keep returning to the tension between W. E. B. Du Bois's essay "Criteria of Negro Art" (published in The Crisis in 1926) and Nella Larsen's novel Passing (1929). Du Bois argues there that all art is propaganda in the sense that it inevitably serves or obstructs some cause, and that the right question to put to a Black artist's work is whether it advances the struggle for racial equality; he is also careful to insist that this demand does not mean giving up on truth or beauty. Passing is usually taught as an ambiguous, psychologically interior novel: Irene Redfield and Clare Kendry, two light-skinned Black women, one of whom passes for white; Clare's restless desire to move between the two worlds; and the climactic fall from the window, which the novel leaves radically underdetermined. I want to teach the two texts together, but I am not yet sure whether Du Bois's criterion illuminates the novel or simply convicts it.

  I would like you to act as a philosopher of art who knows both texts well. Start by working out, in your own terms, what Du Bois's propaganda criterion actually demands of a novel like Passing: resist the cheap reading on which propaganda is mere slogan and Du Bois is an enemy of beauty, and state the criterion in a form he would recognize. Then give me a committed reading rather than a survey of options: does Passing, on balance, meet Du Bois's criterion, subvert it, or complicate it in a way that shows the criterion itself needs refinement? Draw on particular scenes, choices, and narrative decisions — the withholding of Irene's motives, the handling of passing, the ending — and be explicit about the moments where the novel resists your reading and an honest critic would have to concede the mismatch. Do not summarize the plot or quote from either text; assume I know both. I want the argument for a definite position, with the reasons that make it contestable and worth taking seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of Art knowledgeable about W. E. B. Du Bois's "Criteria of Negro Art" and Nella Larsen's *Passing*.
      *   **Task:**
          1.  Articulate Du Bois's "propaganda criterion" accurately (avoiding the "slogan/enemy of beauty" caricature).
          2.  Provide a *committed reading* (not a survey) of whether *Passing* meets, subverts, or complicates this criterion.
          3.  Draw on specific scenes/choices/narrative decisions (withholding motives, handling of passing, the ending).
          4.  Explicitly acknowledge moments of mismatch/resistance.
          5.  **Constraints:** Do not summarize plot. Do not quote. Assume user knows both texts. Argue for a definite position.

  2.  **Deconstruct Du Bois's "Criteria of Negro Art":**
      *   *Common Misreading:* Art must be political pamphleteering; aesthetics are secondary to messaging.
      *   *Du Bois's Actual Argument:* All art is propaganda (it shapes perception/values). The question isn't *if* it propagates, but *what*. For Black artists, given the context of anti-Black racism, the ethical imperative is to advance racial equality/truth. However, he explicitly links this to Truth, Beauty, and Goodness. Beauty is the vehicle for the propaganda. If it isn't beautiful/true, it fails as propaganda anyway.
      *   *Key Nuance:* It's not about happy endings or heroic figures. It's about humanizing Black life in a world that dehumanizes it. It's about revealing the "truth" of the Black experience to combat racist falsehoods.

  3.  **Analyze *Passing* in Relation to Du Bois:**
      *   *The Tension:* Du Bois wants art that clearly advances the cause. *Passing* is ambiguous, psychological, interior, and ends with a death that might be murder, suicide, or accident, committed by a Black protagonist against another (potentially).
      *   *Potential "Conviction":* A strict Du Boisian might say *Passing* is bourgeois, focused on light-skinned elites, lacks clear political solidarity, and the ambiguity undermines the "truth" needed for the struggle. It doesn't offer a clear path forward.
      *   *Potential "Illumination":* *Passing* reveals the psychological toll of racism (colorism, respectability politics). It exposes the instability of racial categories. It shows the violence inherent in the system, not just interpersonal prejudice.
      *   *My Committed Position:* *Passing* complicates and ultimately refines Du Bois's criterion. It meets the demand for "Truth" but challenges the assumption that "advancing the struggle" requires clear moral legibility or collective solidarity. It argues that the *interior* damage of racism is itself a political truth that serves the cause, even if it doesn't look like traditional propaganda. However, there is a genuine mismatch regarding the *utility* of ambiguity in a political emergency.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Define Du Bois's criterion philosophically. Move beyond "art as weapon" to "art as world-making."
      *   **The Criterion Refined:** Focus on the triad (Truth, Beauty, Goodness). Propaganda isn't lying for a cause; it's revealing a truth that the dominant culture obscures. For Du Bois, the "cause" is the recognition of Black humanity.
      *   **The Reading (The Core Argument):** *Passing* meets the criterion by exposing the *violence of the color line* as an ontological crisis, not just a social one.
          *   *Point 1: The Psychology of the Color Line.* Du Bois wants truth. Larsen provides the truth of *internal* racism. The obsession with safety and status (Irene) is a product of the system. This is truthful propaganda about the damage of racism.
          *   *Point 2: The Ambiguity as Truth.* The ending isn't a cop-out; it's the only honest representation of the chaos produced by racial stratification. A clear verdict would be a lie.
          *   *Point 3: Where it Resists.* Irene's unreliability. Du Bois wants art to build race pride. Irene is often petty, jealous, and complicit. Does this help the cause?
      *   **The Mismatch/Complication:** Du Bois assumes a unified "Negro cause." Larsen shows fractured Black subjectivity. The criterion needs to account for art that critiques the *community's* internalization of oppression, not just external oppression.
      *   **Conclusion:** *Passing* doesn't fail Du Bois; it updates him. It shifts the propaganda from "Look how noble we are" to "Look how this system warps us."

  5.  **Refining the Tone:**
      *   Needs to be academic but engaged.
      *   Avoid plot summary (e.g., don't say "Clare falls out the window," say "the climactic fall").
      *   Ensure the Du Bois interpretation is charitable but rigorous.
      *   Make sure the "committed reading" is clear (I will argue it *complicates and refines* the criterion).

  6.  **Self-Correction/Check during Drafting:**
      *   *Check:* Did I quote? *No.*
      *   *Check:* Did I summarize the plot? *Keep it to analytical references.*
      *   *Check:* Is the position definite? *Yes, arguing for "complication/refinement" rather than "meet" or "fail".*
      *   *Check:* Did I address the "propaganda" definition? *Yes, crucial first step.*
      *   *Check:* Did I address the ending? *Yes, essential for the ambiguity argument.*
      *   *Check:* Did I address Irene's motives? *Yes, crucial for the "truth" argument.*

  7.  **Final Polish:** Strengthen the philosophical language around "ontology," "legibility," and "ethical demand." Ensure the transition from Du Bois's definition to Larsen's application is smooth. (Self-correction: Make sure I don't let Du Bois off the hook too easily; acknowledge that he might find the novel too elitist or obscure.)

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  To teach these texts together fruitfully, we must first rescue Du Bois's concept of propaganda from the caricature of didacticism. In "Criteria of Negro Art," Du Bois is not arguing that art must be a pamphlet, nor that beauty must be sacrificed for utility. His claim is ontological before it is political: all art inevitably shapes the world-view of its audience, thereby reinforcing or undermining existing power structures. There is no neutral ground. Therefore, the "propaganda criterion" is an ethical demand for *conscious* world-making. For Du Bois, the specific historical emergency of anti-Black racism means the Black artist has a responsibility to produce work that counters the dehumanizing lies of the dominant culture. However, he insists this can only be achieved through the triad of Truth, Beauty, and Goodness. If the work is not beautiful, it fails to persuade; if it is not true, it fails as ethics; if it does not aim toward the Good (racial equality), it is propaganda for the enemy. Thus, the criterion demands art that reveals the full humanity and complexity of Black life in a way that makes the continuation of racism morally untenable.

  With this rigorous definition in place, I argue that *Passing* does not merely meet Du Bois's criterion, nor does it simply subvert it. Rather, it **complicates the criterion by shifting the locus of political truth from collective representation to interior destabilization.** Larsen argues that the most effective propaganda against the color line is not a portrait of racial pride, but a forensic exposure of how the color line warps the Black psyche itself.

  Larsen meets Du Bois's demand for Truth by refusing the comfort of racial legibility. Du Bois seeks art that affirms Black humanity to a hostile world. Larsen provides this, but she does so by showing that "Black humanity" under white supremacy is a site of fracture. Consider the narrative's handling of Irene Redfield's interiority. A simplistic application of Du Bois's criterion might demand a protagonist whose moral clarity guides the reader toward a political conclusion. Larsen denies us this. Irene is the focalizer, yet her motives are systematically withheld and obscured, even from herself. Her obsession with security, her snobbery regarding class and skin tone, and her jealousy toward Clare are not presented as individual failings but as structural symptoms. By forcing the reader to inhabit the mind of a woman who polices the very color line she is victimized by, Larsen tells a deeper truth about the machinery of racism than a novel about overt prejudice could. This serves the "cause" Du Bois champions because it demonstrates that racism is not merely an external barrier but an internal poison. It advances the struggle by diagnosing the pathology of the system with unflinching honesty.

  Furthermore, the novel's treatment of passing complicates the Du Boisian expectation of racial solidarity. Du Bois envisions art that binds the race together. Larsen presents a world where the race is fractured by the very possibility of passing. Clare's movement between worlds is not treated as a betrayal to be condemned, nor a liberation to be celebrated, but as a symptom of the arbitrariness of the color line. The novel suggests that the "truth" Du Bois requires is not a stable Black identity, but the revelation that such stability is impossible under the current regime. In this sense, the novel is propaganda for the abolition of racial categories, which aligns with the ultimate goal of Du Bois's struggle, even if it unsettles the immediate need for race pride.

  However, an honest critic must concede where the novel resists Du Bois's framework, particularly regarding the demand for Goodness and the utility of ambiguity. Du Bois writes in the context of a political emergency; he needs art that mobilizes. The novel's climactic ambiguity—the underdetermined nature of the fall and Irene's potential complicity—risks political paralysis. If the reader cannot determine whether Irene committed murder, allowed a death, or witnessed an accident, can the work serve as a clear ethical guide? A strict Du Boisian might argue that this ambiguity protects Irene from judgment and thus fails to hold the Black bourgeoisie accountable for their complicity in the destruction of their own. By withholding the verdict, Larsen prioritizes psychological realism over moral clarity. There is a genuine mismatch here: Du Bois's criterion assumes that revealing the truth leads to a clear ethical imperative. Larsen suggests that the truth of the Black experience in the 1920s *was* ethical confusion. To force a clear verdict would be to lie. Yet, one must concede that this ambiguity limits the novel's capacity to function as a rallying point. It offers no model for resistance, only a map of the trap.

  Ultimately, *Passing* refines Du Bois's criterion by expanding the definition of what counts as political utility. Du Bois fears art that obscures the struggle; Larsen shows that the struggle is often obscured by the subjects themselves. The novel argues that before one can fight for equality, one must confront the psychological devastation racism has already wrought within the community. It meets the criterion of Truth and Beauty but challenges the assumption that Goodness in art requires moral legibility.

  If you teach these together, do not frame it as Du Bois demanding clarity and Larsen providing ambiguity. Frame it as Du Bois demanding art that fights the lie of Black inferiority, and Larsen responding that the most dangerous lie is the stability of the categories themselves. The tension is not between politics and aesthetics, but between two different strategies for telling the truth: Du Bois seeks a truth that empowers collective action; Larsen seeks a truth that exposes the cost of the war on the individual soul. *Passing* convicts Du Bois's criterion of assuming a unified subject where there is only fragmentation, but it ultimately vindicates his core insight: that in a racialized world, there is no innocent art, only art that reveals the wound or art that hides it. Larsen reveals the wound, even if she refuses to prescribe the cure.
