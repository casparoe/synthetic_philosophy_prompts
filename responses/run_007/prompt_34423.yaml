  # JOINT STATEMENT ON STATUTORY INTERPRETATION
  **A Collaborative Framework for Textualist and Purposivist Adjudication**

  **Date:** October 26, 2023
  **Parties:** The Textualist Working Group & The Purposivist Working Group
  **Subject:** Areas of Consensus, Disagreement, and Empirical Cruxes in Statutory Construction

  ---

  ### PART I: SUBSTANTIVE AGREED CLAIMS

  The undersigned parties, representing distinct methodologies of statutory interpretation, affirm the following propositions as shared foundations of our legal practice. These are not merely procedural truisms but substantive commitments regarding the nature of law and adjudication.

  1.  **The Judicial Role is Constraint, Not Creation:** Both sides agree that the judge's primary obligation is to apply the law as given by the legislature, not to substitute their own policy preferences for those of the elected body. The judiciary lacks the democratic mandate to legislate from the bench.
  2.  **Semantic Meaning Distinct from Pragmatic Implication:** Both sides accept the linguistic distinction between *semantic content* (what the words literally denote) and *pragmatic communication* (what a speaker manages to convey in context). Both agree that statutory interpretation must account for this distinction, though we differ on which layer controls when they diverge.
  3.  **The Existence of Unprovided-For Cases:** Both sides acknowledge that legislatures cannot anticipate every future fact pattern. In "gap" cases where the statute is silent or ambiguous regarding a specific scenario, the court cannot decline to decide; it must resolve the case using legal reasoning rather than pure discretion.
  4.  **Validity of Linguistic Canons:** Both sides agree that certain linguistic canons of construction (e.g., *ejusdem generis*, *noscitur a sociis*) are valid tools for determining meaning, as they reflect how language is ordinarily used. We disagree only on the weight of these canons relative to other evidence.
  5.  **The Avoidance of Absurdity:** Both sides agree that an interpretation leading to an objectively absurd result—one that no reasonable legislature could have intended—is presumptively incorrect. We disagree on the threshold for "absurdity" and the permissible methods for correcting it.
  6.  **Democratic Legitimacy is Paramount:** Both sides claim their methodology best serves democratic legitimacy. Textualists argue this requires fidelity to the enacted text as the only law passed by majority vote. Purposivists argue this requires fidelity to the legislative goal as the reason the majority voted. Both aim to honor the legislature's work.

  ---

  ### PART II: TABLE OF DISAGREEMENTS

  The following table outlines our divergences. Each position is stated in terms the holder of that view would endorse, avoiding caricature by the opposing side.

  | Issue | The Textualist Position | The Purposivist Position |
  | :--- | :--- | :--- |
  | **Primary Authority** | The authoritative law is the **text enacted** by the legislature. The text is the only evidence of the law that has cleared the constitutional hurdles of bicameralism and presentment. | The authoritative law is the **purpose realized** by the statute. The text is the primary evidence of purpose, but the purpose is the governing principle when the text is ambiguous or leads to frustration of the goal. |
  | **Legislative Intent** | "Legislative intent" is a legal fiction. A multi-member body has no single psychological state. We look to **objective public meaning** of the words at the time of enactment, as that is what citizens relied upon. | "Legislative intent" is a constructive attribute of the institution. It refers to the **reasonable aims** a legislature pursuing that statute would have had. We infer this to ensure the statute functions as a coherent whole. |
  | **Legislative History** | Committee reports and floor debates are **unreliable and manipulable**. They are not voted on and can be inserted by staff to create false "intent." They should generally be excluded to prevent gaming. | Committee reports and floor debates are **probative evidence**. They provide context for why words were chosen. While manipulable, they are often the best window into the problem the legislature sought to solve. |
  | **Hard Cases (Gaps)** | In unprovided-for cases, the court should stick to the **original public meaning** of the text. If the text does not cover the case, the court should not expand it, even if the purpose suggests it should. That is a job for the legislature. | In unprovided-for cases, the court should extend the statute to cover the case if it falls within the **spirit of the remedy**. To do otherwise is to allow form to defeat substance and leave the legislative goal frustrated. |
  | **Temporal Meaning** | The meaning of statutory terms is **fixed at enactment**. If the public meaning of "vehicle" changes over 50 years, the statute must be amended to reflect new technology, not reinterpreted. | The meaning of statutory terms can **evolve with context**. A statute is a living instrument designed to solve problems; as the nature of the problem changes, the application of the text may drift to meet it. |

  ---

  ### PART III: THE CRUXES

  We have identified three specific sub-questions where resolution would significantly alter our respective methodologies. These are not merely semantic disputes but pivot points for adjudication.

  **Crux A: The Ontology of Intent**
  *Question:* Is "legislative intent" a discoverable fact (or reasonable construction) about a collective agent, or is it a metaphor that inevitably masks judicial policy-making?
  *   *Significance:* If intent is a real, constructible fact, the Purposivist method is faithful agency. If it is a fiction, the Textualist method is the only democratic option.

  **Crux B: The Epistemology of History**
  *Question:* Is legislative history (reports, debates) sufficiently reliable to be probative, or is it so easily manipulated by staff and lobbyists that it introduces more noise than signal?
  *   *Significance:* If history is reliable, Textualists lose a major reason for excluding it. If it is inherently corrupted, Purposivists lose a major tool for establishing purpose.

  **Crux C: The Semantics of Time**
  *Question:* Does "ordinary meaning" lock at the time of enactment (Original Public Meaning), or does it drift as language and society evolve (Dynamic Interpretation)?
  *   *Significance:* This determines whether statutes regulate the world as it *was* or the world as it *is*.

  ---

  ### PART IV: EVIDENCE AND PREDICTIONS (THE "VEHICLE" TEST)

  To test these cruxes, we agree to apply our methods to the hypothetical statute: **"No vehicles allowed in the public park."** Enacted: 1950. Current Year: 2023.

  #### Test 1: The Motorized Wheelchair
  *Scenario:* An elderly person enters the park in a motorized wheelchair.
  *   **Textualist Prediction:** **Not a violation.**
      *   *Reasoning:* The "ordinary meaning" of "vehicle" in 1950 (and today) implies a transport device for general travel, not a medical necessity device. The semantic category excludes medical aids by default context.
  *   **Purposivist Prediction:** **Not a violation.**
      *   *Reasoning:* The purpose of the statute is safety and quietude. A wheelchair does not frustrate this purpose; banning it would frustrate the park's purpose of public access.
  *   *Consensus:* Both acquit.
  *   *Diagnostic Value:* Low. Shows both sides use context/purpose to narrow over-broad text.

  #### Test 2: The Commercial Drone
  *Scenario:* A company flies a delivery drone low over the park. It makes noise but touches no ground.
  *   **Textualist Prediction:** **Not a violation.**
      *   *Reasoning:* "Vehicle" ordinarily implies a thing that carries people or goods *on the ground* (or water). A drone is an "aircraft" or "unmanned system." The text does not cover it. Fixed meaning controls.
  *   **Purposivist Prediction:** **Violation.**
      *   *Reasoning:* The purpose is to prevent noise and danger in the park. A drone frustrates this purpose just as a car does. The term "vehicle" should be interpreted functionally to cover new technologies that pose the same mischief.
  *   *Consensus:* **Disagreement.**
  *   *Diagnostic Value:* **High.** Tests Crux C (Semantics of Time) and Crux A (Intent).

  #### Test 3: The Emergency Ambulance
  *Scenario:* An ambulance drives through the park to reach a heart attack victim on the far side.
  *   **Textualist Prediction:** **Not a violation (via Canon of Necessity).**
      *   *Reasoning:* While technically a vehicle, the common law canon of necessity implies an exception for saving life. This is not rewriting the statute but recognizing background legal principles assumed by the text.
  *   **Purposivist Prediction:** **Not a violation (via Purpose).**
      *   *Reasoning:* The legislature could not have intended to ban life-saving equipment. To apply the text here would be absurd and frustrate the higher purpose of public welfare.
  *   *Consensus:* Both acquit.
  *   *Diagnostic Value:* Medium. Shows convergence on "absurdity," but via different doctrinal routes (Canon vs. Purpose).

  #### Test 4: The War Memorial Tank
  *Scenario:* A WWII tank is placed on a pedestal in the park as a static monument. It has an engine but does not run.
  *   **Textualist Prediction:** **Not a violation.**
      *   *Reasoning:* "Vehicle" implies use for transport. A static object on a pedestal is a "monument" or "statue," not a vehicle in the ordinary sense of the word.
  *   **Purposivist Prediction:** **Not a violation.**
      *   *Reasoning:* The purpose is to prevent traffic and danger. A static tank poses no traffic risk.
  *   *Consensus:* Both acquit.
  *   *Diagnostic Value:* Low.

  #### Test 5: The Drift Question (Hoverboards)
  *Scenario:* A child rides an electric hoverboard. In 1950, these did not exist.
  *   **Textualist Prediction:** **Violation.**
      *   *Reasoning:* The ordinary meaning of "vehicle" today includes motorized personal transport devices. The meaning drifts linguistically, so the text covers it. (Note: Some Textualists may argue for 1950 meaning, creating internal split).
  *   **Purposivist Prediction:** **Violation.**
      *   *Reasoning:* It fits the functional purpose of the ban (safety/noise).
  *   *Consensus:* Both convict.
  *   *Diagnostic Value:* **High for Internal Textualist Debate.** Highlights the split between "Original Public Meaning" (1950 definition) and "Current Ordinary Meaning" (2023 definition).

  ---

  ### PART V: META-ANALYSIS — VERBAL VS. GENUINE DISPUTES

  In reviewing our collaboration, we categorize the remaining disputes as follows:

  **1. Verbal Disputes (Dissolvable by Definition)**
  *   **The Definition of "Text":** Textualists often define "text" narrowly (words + grammar). Purposivists define "text" broadly (words + context + structure). If we agree that "context" is part of the "textual" analysis, the gap narrows significantly.
  *   **The Definition of "Purpose":** Textualists reject "subjective hope" (what a senator said in a diary). Purposivists reject "literalist rigidity" (ignoring the goal). If we agree that "purpose" means "objective aim evident in the statute's structure," the Textualist objection to "intent" diminishes.
  *   **The "Absurdity" Threshold:** Much fighting occurs over what counts as "absurd." If we can agree on a high threshold (e.g., "only if the result is physically impossible or legally contradictory"), the Textualist fear of judicial overreach is mitigated.

  **2. Genuine Disputes (Normative and Empirical)**
  *   **Institutional Competence (Empirical):** This is the hardest genuine dispute. Textualists believe judges *cannot* reliably distinguish genuine purpose from staff manipulation in legislative history. Purposivists believe judges *can* and *must* do this to avoid injustice. This is an empirical claim about the judiciary and the legislative process that requires data, not just theory.
  *   **Priority of Values (Normative):** Even if we agree on meaning, we disagree on priority. Textualists prioritize **Fair Notice** (citizens must know the law from the text alone). Purposivists prioritize **Just Outcomes** (the law should achieve its goal). When Fair Notice and Just Outcomes conflict, we will still disagree. Textualists will sacrifice the outcome to preserve the rule. Purposivists will stretch the rule to preserve the outcome.
  *   **The Ontology of Collective Intent (Philosophical):** We disagree on whether a legislature *has* an intent. Textualists view it as a category error (a group has no mind). Purposivists view it as a functional necessity (a group acts as an agent). This is a deep philosophical divide that resists simple definition fixes.

  **Conclusion:**
  While significant verbal confusion exists regarding the labels "text" and "purpose," a genuine normative conflict remains regarding the hierarchy of values (Notice vs. Justice) and a genuine empirical conflict remains regarding the reliability of legislative history. This statement serves as a map for future collaboration to isolate these remaining genuine disputes.

  _________________________
  **Lead Signatory, Textualist Working Group**

  _________________________
  **Lead Signatory, Purposivist Working Group**
