answer: |-
  This is a request for a **system specification**. You are asking for the requirements document for the "Moral Responsibility" module before you commit to an architecture.

  In philosophy, this is often called the method of **Reflective Equilibrium**: we try to align our general principles with our specific intuitions about cases. When they conflict (like PAP vs. Frankfurt), we must patch the spec.

  Below is the **Desiderata Specification v1.0**. I have categorized requirements into **Core Constraints** (non-negotiable for most naturalistic frameworks), **Functional Requirements** (what the theory must explain), and **Architectural Preferences** (where schools of thought diverge). I have also flagged the known **Incompatibility Errors** (tensions that cannot be simultaneously resolved).

  ---

  # Moral Responsibility: System Specification & Desiderata

  ## 1. Core Constraints (Hard Requirements)
  *These are conditions that a theory must satisfy to be taken seriously in a post-Enlightenment, naturalistic context. Violating these usually results in the theory being rejected as obsolete or incoherent.*

  ### 1.1 The Naturalism Constraint
  *   **Requirement:** The theory must be consistent with established empirical science (physics, neuroscience, psychology). It cannot posit non-physical substances (souls) or violations of causal laws unless strictly necessary.
  *   **Motivation:** Scientific worldview. If a theory requires "magic" (e.g., uncaused mental events that violate physics), it has high maintenance costs.
  *   **Status:** **Non-Negotiable** for Compatibilists and Skeptics. **Negotiable** for Libertarians (who argue current physics allows indeterminacy).

  ### 1.2 The Capacity Constraint
  *   **Requirement:** The system must exonerate agents who lack basic cognitive or volitional capacities.
  *   **Motivation:** **Edge Cases:** Young children, severe psychosis, advanced dementia, reflex actions. We do not blame a toddler for breaking a vase or a sleepwalker for hitting someone.
  *   **Status:** **Non-Negotiable.** Any theory that blames the insane or infants is considered broken.

  ### 1.3 The Ownership (Attribution) Constraint
  *   **Requirement:** The action must issue from the agent's own psychology in the right way. It cannot be externally hijacked.
  *   **Motivation:** **Edge Cases:** Addiction, compulsion, hypnosis, direct brain stimulation. If a neuroscientist pushes a button that makes your hand move, *you* didn't do it.
  *   **Status:** **Non-Negotiable.** Distinguishes *actions* from *mere bodily movements*.

  ### 1.4 The Manipulation Constraint
  *   **Requirement:** The theory must explain why an agent is *not* responsible if their character/values were engineered by another agent to guarantee a specific action, even if the agent feels free.
  *   **Motivation:** **Manipulation Cases (e.g., Mele's "Zygote Argument," Pereboom's "Case 4").** If a scientist programs your brain to choose Murder, you aren't responsible, even if you "identify" with the choice.
  *   **Status:** **Non-Negotiable.** (Almost universal intuition).
  *   **⚠️ CRITICAL BUG:** This creates a tension with **Determinism** (see Incompatibility Errors below).

  ---

  ## 2. Functional Requirements (What the Theory Must Output)
  *These are the distinctions the theory must be able to draw to be useful.*

  ### 2.1 The Blame/Praise Asymmetry
  *   **Requirement:** The theory must account for why blame often feels distinct from praise (e.g., negative responsibility might require stricter conditions than positive responsibility).
  *   **Motivation:** **Omission Cases.** We blame for letting die, but rarely praise for letting live.
  *   **Status:** **Preference.** Some theories treat them symmetrically; others do not.

  ### 2.2 The Ignorance Handling
  *   **Requirement:** The theory must specify when ignorance exculpates and when it does not ("willful ignorance").
  *   **Motivation:** **Edge Cases:** The culturally conditioned sexist (1800s) vs. the person who refuses to learn.
  *   **Status:** **Non-Negotiable.** A theory that says "ignorance is always an excuse" or "never an excuse" fails.

  ### 2.3 The Degree Sensitivity
  *   **Requirement:** Responsibility must be gradable, not binary.
  *   **Motivation:** **Edge Cases:** Duress, diminished capacity, coercion. We blame the bank teller who hands over money at gunpoint *less* than the one who does it for greed.
  *   **Status:** **Non-Negotiable.**

  ### 2.4 The Distinction: Attributability vs. Accountability
  *   **Requirement:** The theory must distinguish between:
      1.  **Attributability:** Does this action reflect on the agent's character? (e.g., A psychopath murders. It reflects his character.)
      2.  **Accountability:** Is the agent liable to sanction/blame? (e.g., We might not blame the psychopath because he lacks moral understanding.)
  *   **Motivation:** **Psychopathy Cases.** Psychopaths act on their values (Attributable) but seem immune to moral reasons (not Accountable).
  *   **Status:** **Architectural Preference.** Strawsonians emphasize Accountability; Virtue Ethicists emphasize Attributability.

  ---

  ## 3. Architectural Preferences (Camp-Specific Modules)
  *These are not universal requirements but define the specific "flavor" of the theory. You must choose one set.*

  ### 3.1 The Desert Requirement (Retributivism)
  *   **Definition:** Responsibility entails that the agent *deserves* suffering/harm purely because of the past act (backward-looking).
  *   **Motivation:** Intuition that justice requires payback, not just safety.
  *   **Status:** **High Risk.** Hard to reconcile with Naturalism + Manipulation Constraint. Rejected by Skeptics and many Compatibilists.

  ### 3.2 The Alternative Possibilities Requirement (PAP)
  *   **Definition:** "Could have done otherwise" is necessary for responsibility.
  *   **Motivation:** Intuition of freedom.
  *   **Status:** **Deprecated.** Falsified by Frankfurt Cases for most modern architectures. Retained only by Libertarians.

  ### 3.3 The Reactive Attitudes Requirement (Strawsonian)
  *   **Definition:** Responsibility is defined by the appropriateness of emotions like resentment, gratitude, and indignation within a social practice.
  *   **Motivation:** P.F. Strawson's "Freedom and Resentment." Shifts focus from metaphysics to social function.
  *   **Status:** **Preference.** Avoids metaphysical bugs but risks circularity (we are responsible because we hold responsible).

  ### 3.4 The Reasons-Responsiveness Requirement
  *   **Definition:** Responsibility depends on whether the agent's mechanism would have responded differently to *sufficient reasons* to do otherwise.
  *   **Motivation:** Fischer & Ravizza. Solves Frankfurt without PAP.
  *   **Status:** **Preference.** The leading Compatibilist patch.

  ---

  ## 4. Incompatibility Errors (Known Tensions)
  *These are the "bugs" where satisfying one requirement causes a crash in another. No current theory resolves all of these without trade-offs.*

  ### 🔴 Error 1: The Manipulation/Determinism Collision
  *   **Conflict:** **Manipulation Constraint** vs. **Naturalism (Determinism)**.
  *   **Description:** If a manipulated agent (engineered by a scientist) is not responsible because their causal history determines their action, why is a determined agent (engineered by the Big Bang + laws of nature) responsible? The causal structure is identical; only the *source* differs.
  *   **Impact:** This is the primary weapon of the **Skeptics**. If you accept the Manipulation Constraint, you risk losing responsibility under Determinism. If you deny it to save Determinism, you risk blaming brainwashed victims.
  *   **Status:** **Unresolved.**

  ### 🔴 Error 2: The Frankfurt/Desert Tension
  *   **Conflict:** **Frankfurt Cases** vs. **Desert Requirement**.
  *   **Description:** Frankfurt cases show you can be responsible without Alternative Possibilities (AP). But many argue that *Desert* (deserving blame) intuitively requires AP. If you couldn't do otherwise, is it fair to make you suffer for it?
  *   **Impact:** Forces a choice: Keep Desert (and reject Frankfurt intuitions) or Keep Frankfurt intuitions (and weaken Desert to forward-looking sanctions).
  *   **Status:** **Unresolved.**

  ### 🔴 Error 3: The Luck Problem (Libertarian Bug)
  *   **Conflict:** **Libertarian Free Will** vs. **Control Constraint**.
  *   **Description:** If an action is not determined by prior causes (to satisfy AP), it appears random. If it is random, the agent does not control it. If they don't control it, they aren't responsible.
  *   **Impact:** Libertarianism satisfies PAP but often fails the Ownership/Control Constraint.
  *   **Status:** **Unresolved.**

  ---

  ## 5. Scorecard: Major Architectures Against Spec

  | Requirement / View | **Libertarian** | **Compatibilist (Reasons-Responsive)** | **Strawsonian** | **Skeptic (Hard Incompatibilist)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Naturalism** | ❌ (Often conflicts) | ✅ | ✅ | ✅ |
  | **Capacity Constraint** | ✅ | ✅ | ✅ | ✅ |
  | **Manipulation Constraint** | ✅ | ⚠️ (Vulnerable to "History" objections) | ⚠️ (Varies) | ✅ |
  | **Frankfurt Cases** | ❌ (Rejects intuition, keeps PAP) | ✅ (Drops PAP) | ✅ (Irrelevant to practices) | ✅ (Agents not responsible) |
  | **Alternative Possibilities (PAP)** | ✅ | ❌ (Explicitly dropped) | ➖ (Irrelevant) | ❌ |
  | **Desert (Backward-looking)** | ✅ | ⚠️ (Often modified) | ➖ (Focus on attitudes) | ❌ (Rejected) |
  | **Control/Ownership** | ✅ (Claimed) | ✅ | ✅ | ❌ (Illusion) |
  | **Primary Trade-off** | **Science vs. Intuition:** Saves AP, costs Naturalism. | **History vs. Responsibility:** Saves Responsibility, costs clear distinction from manipulation. | **Metaphysics vs. Justification:** Saves practice, costs objective grounding. | **Honesty vs. Practice:** Saves logic, costs moral blame/praise. |

  ---

  ## 6. Implementation Advice for Your Mental Model

  As a software engineer, you recognize that **there is no bug-free system**. There are only architectural trade-offs.

  1.  **If you prioritize Scientific Consistency:** You must choose between **Compatibilism** (redefine responsibility to fit determinism) or **Skepticism** (admit responsibility doesn't exist).
  2.  **If you prioritize the "Could Have Done Otherwise" Intuition:** You must choose **Libertarianism**, but you will have to accept a "black box" in your model (how does uncaused choice happen?) that science cannot currently explain.
  3.  **If you prioritize Social Function:** You choose **Strawsonian**, treating responsibility as a feature of human interaction rather than a metaphysical fact about the universe.

  **The Critical Decision Point:**
  The biggest fork in the road is the **Manipulation/Determinism Collision**.
  *   If you believe a determined agent is relevantly different from a manipulated agent, you are a **Compatibilist**.
  *   If you believe they are the same, you are a **Skeptic**.

  Most modern "production" philosophy runs on **Compatibilist** code (specifically Reasons-Responsiveness) because it allows the system to keep running (blame/praise) without crashing into hard science, even if the "History" bug remains a known issue.

  **Recommendation:** Start by reading **John Martin Fischer's *My Way*** (for Reasons-Responsiveness) and **Derk Pereboom's *Free Will, Agency, and Meaning in Life*** (for the Skeptical critique). These two represent the most robust competing builds of the current spec.
