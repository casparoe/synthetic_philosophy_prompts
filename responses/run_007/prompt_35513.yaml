answer: |-
  This is a classic philosophical deadlock. Your friend is oscillating between **Dennett's Instrumentalism** (stances are tools chosen for predictive utility) and a kind of **Realist Essentialism** (stances track mind-independent categories of being). Her inconsistency on the chess engine vs. corporation case is the key to unlocking her actual commitments.

  Based on her ten verdicts, here is the analysis of her position, the two competing principles at play, and how to test them.

  ### Candidate Principle 1: The "Ontological Genealogy" Principle
  **The Core Idea:** The appropriate stance is determined by the **origin and nature of the system's teleology (purpose)**.
  *   **Physical:** Systems with no teleology (tornadoes) or systems where the teleology is too microscopic/chemical to constitute agency (E. coli, sunflowers).
  *   **Design:** Systems where the purpose is **explicitly engineered by a human designer** and the mechanism is conceptually tractable as a tool (thermostats, cars, chess engines).
  *   **Intentional:** Systems where the purpose arises from **evolution** (biology) or **social selection** (corporations), regardless of consciousness.

  **Fit with her 10 verdicts:**
  *   It explains why the **Chess Engine** is Design (human-coded function) but the **Corporation** is Intentional (socially evolved entity, no single designer).
  *   It explains why the **Cat/Bee/Spider** are Intentional (evolved) but the **E. coli/Sunflower** are Physical (too simple/biochemical).
  *   It explains why the **Self-driving car** is Design (engineered artifact).

  **Prediction for LLM:** **Design Stance.**
  *   **Reasoning:** An LLM is unambiguously a human-engineered artifact. Its "goals" (next-token prediction) are explicitly hardcoded by architects. Unlike the Corporation, it is not a social aggregate; unlike the Cat, it was not evolved. Under this principle, origin trumps behavior. Even if the Intentional stance works well, the system is ontologically a tool, not an agent.

  ### Candidate Principle 2: The "Predictive Opacity & Emergence" Principle
  **The Core Idea:** The appropriate stance is determined by the **accessibility of the mechanism** and the **emergence of behavior**.
  *   **Physical:** Systems where behavior is fully determined by immediate physical laws without complex processing.
  *   **Design:** Systems where the internal logic is **transparent or fixed** enough that you can predict output by understanding the engineering specs (thermostat, chess engine).
  *   **Intentional:** Systems where the internal mechanism is **opaque or too complex to model**, and the system exhibits **flexible, emergent goal-directedness** that resists reduction to simple rules.

  **Fit with her 10 verdicts:**
  *   It explains why the **Chess Engine** is Design: Traditional engines (like Stockfish) use search trees and evaluation functions that are conceptually transparent to programmers. "It wants to control the center" is shorthand for a calculable eval function.
  *   It explains why the **Corporation** is Intentional: No single human understands the internal mechanism of Exxon; the "goal" emerges from the interaction of thousands of agents. You *must* use the Intentional stance because the Design stance is computationally impossible.
  *   It explains why the **Cat/Bee** are Intentional: Their neural wiring is opaque to us; we cannot predict them via physics or engineering blueprints.
  *   It explains why **E. coli/Sunflower** are Physical: Their mechanisms are simple enough (tropism/chemotaxis) to be modeled physically without attributing "beliefs."

  **Prediction for LLM:** **Intentional Stance.**
  *   **Reasoning:** Modern LLMs are "black boxes." We cannot predict their output by examining their weights (Design stance); the mechanism is opaque. Furthermore, they exhibit emergent capabilities (reasoning, deception, goal-seeking) that were not explicitly hardcoded. Like the Corporation, the "agency" emerges from the complexity. Therefore, the Intentional stance is not just useful; it is the *only* tractable way to predict them.

  ---

  ### Best Guess: Which Principle Is She Running?

  She is most likely running **Principle 1 (Ontological Genealogy)**, but she is justifying it with the language of Principle 2.

  **Why?**
  The "smoking gun" is the **Chess Engine** verdict.
  If she were truly following *Predictive Payoff* (Principle 2), she would have to concede the Intentional stance for Chess. Grandmasters *do* use the intentional stance ("Kasparov wants to open the file") because it is the most compact predictor of the engine's moves. By insisting Chess is Design *despite* the predictive utility of intentional language, she revealed that she cares about **what the thing is**, not just **how we predict it**.

  She distinguishes the Corporation (Intentional) from the Car (Design) not because the Corporation is more opaque (a car's software is also complex), but because the Corporation is a *social entity* while the Car is a *machine*.

  **Therefore, my prediction is she will assign the LLM to the Design Stance.**
  She will argue that because the LLM is code created by engineers, it belongs in the Design bucket, regardless of how "agentic" it seems. She will likely dismiss the "Intentional" utility of prompting as "anthropomorphic shorthand," exactly as she did with the chess engine.

  ---

  ### The Tie-Breaker Case

  To force her to choose between **Origin (Principle 1)** and **Opacity/Emergence (Principle 2)**, you need a case that is **Engineered** (points to Design) but **Emergent/Collective** (points to Intentional).

  **Raise this case next time:**
  > "Imagine a **swarm of 1,000 simple drones**. Each drone runs a tiny, open-source algorithm (so the mechanism is transparent). But when released together, they exhibit complex, emergent flocking behavior to hunt a target, adapting to obstacles in ways the programmers never anticipated. No single drone has a goal; the 'goal' exists only at the swarm level."

  **Why this forces a choice:**
  *   **If she says Design Stance:** She is prioritizing **Origin/Engineering**. (It's a machine we built). This confirms she will put LLMs in Design.
  *   **If she says Intentional Stance:** She is prioritizing **Emergent Agency**. (It acts like a bee hive or a corporation). This suggests she *might* be open to LLMs being Intentional if the behavior is emergent enough.

  **Follow-up question:**
  > "Is it the **code** that determines the stance, or the **behavior**?"

  If she says "Code," she's a Realist about Artifacts (LLM = Design). If she says "Behavior," she's an Instrumentalist (LLM = Intentional). This should finally pin down whether her "real patterns" claim is about metaphysics or methodology.
