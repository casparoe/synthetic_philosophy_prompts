prompt: |-
  I just got back from a three-hour argument with a friend about Dennett's three stances, and I need help making sense of where she actually stands. The argument started because I said the whole framework — physical stance, design stance, intentional stance — is just a pragmatic taxonomy of predictive strategies, and she insisted that the stances track something real: there are real patterns in the world that make one stance objectively more appropriate than another for a given system. But when I pushed her to state the criterion that picks out the right stance, she wouldn't give me a clean principle. Instead, she offered verdicts on a series of cases. Here is what she said, as close to verbatim as I can reconstruct:

  - Thermostat: design stance — "you predict it by knowing what it's supposed to do, not by doing physics or by imagining it has beliefs."
  - Chess engine (like Stockfish): design stance — "same thing; it's an artifact with a function."
  - Cat: intentional stance — "obviously you attribute beliefs and desires to a cat."
  - E. coli bacterium: physical stance — "it's just chemistry."
  - Tornado: physical stance — "no function, no mind, just physics."
  - Honeybee: intentional stance — "it has a perspective, however minimal."
  - Sunflower tracking the sun: physical stance — "that's a tropism, not agency."
  - Spider: intentional stance — "same as the bee; it's got a point of view."
  - Multinational corporation: intentional stance — "you can't predict what Exxon will do without attributing goals and beliefs to it as an entity."
  - Self-driving car: design stance — "you predict it by understanding its programming and sensors, not by asking what it wants."

  When I pointed out that the corporation verdict sits uneasily with the "real agency" criterion she seemed to be using — a corporation doesn't have a unified consciousness — she shifted ground and said the real test is predictive payoff: you use whichever stance gives you the most compact, reliable predictions. But then I asked why she doesn't take the intentional stance toward a chess engine. After all, "it wants to control the center" is a compact description that human players use constantly. She said that's just heuristic shorthand and the design stance is clearly correct there. So I'm not confident I know which principle she's actually running, and I suspect she isn't either.

  We never got to large language models — she had to leave — and I think they are the ideal test case for disentangling her commitments. A current LLM is unambiguously an artifact, so on any consciousness-or-genuine-agency criterion it belongs squarely in the design stance. But it is also the first artifact for which the intentional stance seems to earn its predictive keep in a way it simply doesn't for a thermostat or a chess engine: the most effective way to anticipate an LLM's outputs, in practice, is to treat it as though it has beliefs, goals, and a train of thought, and prompt engineers do exactly this. If predictive payoff is the real criterion, the LLM might belong in the intentional stance.

  What I want from you: given her track record of verdicts, predict what stance she would assign to a current large language model, and walk me through the reasoning. In doing so, identify the candidate principles that fit all ten of her existing verdicts — there should be at least two that fit equally well but diverge on the LLM. For each candidate principle, state what it predicts for the LLM and why. Then give your best guess about which principle she is actually running, drawing on what she said and on which of her verdicts seem most diagnostic. Finally, tell me what further case I should raise next time we talk — one that would force a clean choice between the remaining candidate principles.
