      *   *The Tension:* If opportunities are truly equal, do outcomes still vary? If they vary, is it fair? If we fix opportunities enough, do outcomes converge anyway?
      *   *The "Conversation-Ender":* Usually implies "Stop worrying about the gap in wealth/income, just make sure the rules are fair." But "fair rules" is the contested part.

  3.  **Structuring the Response:**
