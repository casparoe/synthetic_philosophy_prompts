      *   **Problem:** The term "EoOp" is slippery, covering everything from formal non-discrimination to radical redistribution.
      *   **Task:** Act as a political philosopher specializing in egalitarianism. Brainstorm meanings of "opportunity" and "equality," then lay out distinct precise claims (thin to thick).
      *   **Criteria for each claim:** Plausibility, distinctness from EoOut, does it support the "we don't need EoOut" move?
