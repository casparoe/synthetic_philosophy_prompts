answer: |-
  This is one of the most persistent frustrations in political philosophy, and you are right to sense that "equality of opportunity" (EoOp) is often used as a **motte-and-bailey** doctrine. The "motte" is the defensible, thin claim (no legal discrimination), and the "bailey" is the expansive, undefended claim (we don't need to worry about wealth gaps).

  As a political philosopher working on egalitarianism, I see this slippage constantly. To help you carve this up in a debate, we need to dissect the two variables at play: **what counts as a barrier** and **what counts as an advantage**.

  ### Phase 1: Conceptual Groundwork

  Before categorizing the claims, we need to define the axes along which "opportunity" varies.

  1.  **The Scope of Barriers (Negative vs. Positive):**
      *   *Negative:* Opportunity exists if no one *stops* you. (e.g., The law doesn't ban women from voting).
      *   *Positive:* Opportunity exists only if you have the *capacity* to take it. (e.g., You can vote, but you can't read the ballot or get to the polling station).
  2.  **The Metric of Advantage (Resources vs. Welfare):**
      *   Are we equalizing access to *resources* (school funding, cash) or access to *functionings* (health, skills, social capital)?
  3.  **The Time Horizon (Snapshot vs. Life-Course):**
      *   Are we looking at opportunity at age 18 (college entry)? Or are we looking at the "starting gate" at birth?
  4.  **The Source of Inequality (Choice vs. Circumstance):**
      *   This is the crux of modern egalitarianism. Is the inequality due to your choices (effort, risk-taking) or your circumstances (genetics, parents, neighborhood)?

  When your opponent says "We need equality of opportunity, not outcome," they are usually refusing to specify where they stand on these axes. Let's carve out four distinct levels of the claim, from thinnest to thickest.

  ---

  ### Phase 2: The Spectrum of Claims

  #### Level 1: Formal Legal Equality ("Careers Open to Talents")
  *   **The Claim:** The state must remove explicit legal and institutional barriers based on identity (race, gender, religion, caste). If two people have the same skills, the law must not prefer one over the other.
  *   **What changes here:** We are only looking at *negative* barriers imposed by the *state*.
  *   **Plausibility:** Extremely high. Almost universally accepted in liberal democracies.
  *   **Distinct from Equality of Outcome?** **Yes, sharply.** You can have zero legal discrimination and massive wealth inequality (due to skill differences, luck, or inheritance).
  *   **Does it support the "Not Outcome" move?** **Yes.** This is the strongest version of that argument. It implies that if the rules are blind, the resulting distribution is fair, regardless of the gap.
  *   **Philosophical Weakness:** It ignores private discrimination and, more importantly, ignores that "talents" are not distributed equally to begin with. It treats a starving child and a wealthy child as having "equal opportunity" to become CEO because neither is legally barred.

  #### Level 2: Liberal Fairness ("Leveling the Playing Field")
  *   **The Claim:** The state must provide basic public goods (education, healthcare, nutrition) so that competition is based on merit/effort, not on arbitrary social disadvantages.
  *   **What changes here:** We move to *positive* barriers. We acknowledge that poverty acts as a barrier similar to law. We focus on *social* circumstances, not just legal ones.
  *   **Plausibility:** High. This is the standard center-left/center-right consensus (e.g., Head Start, public schools).
  *   **Distinct from Equality of Outcome?** **Mostly.** It aims to equalize the *input* (education), not the *output* (income). However, it admits that some outcome inequality is necessary to incentivize effort.
  *   **Does it support the "Not Outcome" move?** **Conditionally.** It supports the move *only if* you can prove the playing field is actually level. If school funding is vastly unequal, this principle actually *demands* redistribution, which looks like outcome egalitarianism.
  *   **Philosophical Weakness:** It struggles to define "enough." Is it equal funding per pupil? Or funding sufficient to reach a threshold? It also ignores family advantages (tutors, networking) that exist outside the state's provision.

  #### Level 3: Luck Egalitarianism ("Neutralizing Brute Luck")
  *   **The Claim:** Inequalities are just only if they reflect **choice** (effort, ambition, risk), not **circumstance** (genetics, parents, birthplace). Society should compensate for "brute luck" but reward "option luck."
  *   **What changes here:** The definition of "opportunity" expands to include *native endowments* and *family background*. If you are born with a disability or rich parents, that is "luck," not "merit."
  *   **Plausibility:** Philosophically robust (Dworkin, Arneson, Cohen), but politically difficult. It requires intrusive assessments of what is "choice" vs. "circumstance."
  *   **Distinct from Equality of Outcome?** **Blurry.** If 80% of life outcomes are determined by brute luck (as some sociological data suggests), then neutralizing luck requires massive equalization of outcomes.
  *   **Does it support the "Not Outcome" move?** **No.** This version often *collapses* into equality of outcome. If you truly neutralize all unchosen advantages, the remaining outcome inequality is usually small. Using this slogan to *block* redistribution is incoherent here, because this theory *justifies* redistribution.
  *   **Philosophical Weakness:** The "Family Problem." To truly equalize opportunity here, you might have to abolish the family (or heavily tax inheritance and parenting time), which conflicts with liberty.

  #### Level 4: Radical Starting Gate Theory ("The Fresh Start")
  *   **The Claim:** Every generation should start from the exact same starting line. No intergenerational transmission of advantage. Inheritance is abolished; parenting is standardized or heavily regulated.
  *   **What changes here:** The time horizon is birth. The scope of barriers includes *all* parental influence.
  *   **Plausibility:** Low (in terms of political feasibility/liberty). High (in terms of logical consistency regarding opportunity).
  *   **Distinct from Equality of Outcome?** **No.** This is functionally equivalent to strong outcome egalitarianism. If no one can pass on advantage, outcome gaps cannot compound over generations.
  *   **Does it support the "Not Outcome" move?** **Absolutely Not.** If your opponent means this, they are arguing for more redistribution than a standard outcome egalitarian.
  *   **Philosophical Weakness:** Violates liberal freedoms regarding family life and association.

  ---

  ### Phase 3: The Collapse Point

  You asked where the slogan stops being a real alternative to egalitarianism about outcomes. This is the **Causal Threshold**.

  Equality of Opportunity stops being an alternative to Equality of Outcome when **the primary causes of unequal outcomes are located in unequal opportunities.**

  *   **Scenario A:** Outcomes vary because of effort/choice.
      *   *EoOp* is distinct from *EoOut*. We should not equalize outcomes.
  *   **Scenario B:** Outcomes vary because of structural barriers/wealth inheritance.
      *   *EoOp* **requires** *EoOut*. To fix the opportunity, you must fix the outcome (wealth/income) that causes the opportunity gap.

  **The Trap:** Your opponent wants to assert Scenario A (it's about effort) while living in Scenario B (it's about structure).

  If you push for Level 3 (Luck Egalitarianism), the opponent will usually retreat to Level 1 (Formal Equality). They want the moral credit of Level 3 ("I believe in fairness!") without the policy cost of Level 3 ("I don't want to tax inheritance!").

  ### Phase 4: Debate Strategy & Cross-Examination

  As a policy debater, you can use this taxonomy to force specificity. Do not let them keep the term undefined. Here is how to deploy this in round:

  **1. The "Which Barriers?" Interrogation**
  *   *Question:* "When you say equality of opportunity, do you mean removing legal bans, or do you mean ensuring I have the same capacity to compete as my neighbor?"
  *   *Trap:* If they say "legal bans," you concede the point but note it's already achieved (Civil Rights Act), so their advocacy is moot. If they say "capacity," ask for the funding mechanism. That funding mechanism *is* outcome redistribution.

  **2. The "Inheritance" Check**
  *   *Question:* "Does a child born into a millionaire family have the same opportunity as a child born into poverty? If not, does your support for equality of opportunity require restricting inheritance?"
  *   *Trap:* If they say "No restriction," they admit they don't actually believe in full Equality of Opportunity (Level 3/4). They believe in Formal Equality (Level 1). If they say "Yes restriction," they are advocating for radical redistribution (Outcome Egalitarianism).

  **3. The "Causal Link" Argument**
  *   *Argument:* "My opponent claims we need Opportunity not Outcome. But in our current economy, 'Outcome' (wealth) purchases 'Opportunity' (tutors, health, networks). Therefore, you cannot have Equality of Opportunity without addressing Equality of Outcome. They are not alternatives; one is a prerequisite for the other."
  *   *Why it works:* It attacks the distinctness criterion. It shows that in the real world, the variables are correlated.

  **4. The "Definition of Merit" Pivot**
  *   *Argument:* "They say we should reward merit. But 'merit' is often just 'advantage that has been laundered through time.' A high test score is often a proxy for parental income. If we truly want equality of opportunity, we must stop treating outcomes (test scores/wealth) as proxies for merit."

  ### Summary for the Debater

  The slogan "Equality of Opportunity, not Outcome" is only coherent at **Level 1 (Formal)**.
  *   At **Level 1**, it is plausible but morally insufficient (allows caste systems if legal).
  *   At **Level 2 (Liberal)**, it requires some redistribution, blurring the line.
  *   At **Level 3 & 4 (Luck/Radical)**, it *becomes* Equality of Outcome.

  When your opponent uses the slogan, they are trying to claim the moral high ground of Level 3 while advocating for the policy inaction of Level 1. Your job is to force them to pick a level. If they pick Level 1, they look callous. If they pick Level 3, they look like redistributors. If they try to stay in the middle, expose the contradiction: **You cannot equalize the start without adjusting the finish.**
