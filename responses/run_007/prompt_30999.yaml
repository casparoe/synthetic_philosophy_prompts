      *   **Grouping:** 3 groups of 5.
      *   **Materials:** 3 Turntables (or office chairs), 3 clear buckets (small, lidded), water, food coloring (to see movement), towels.
      *   **The Rule:** "The Relationist Embargo." No referencing invisible grids or absolute space. Only physical objects in the room.
      *   **Timeline:**
          *   0-10: Intro & Rules.
          *   10-25: Prediction (Worksheet).
          *   25-50: Experiment (Rotating stations).
          *   50-65: Group Explanation (Struggling with the constraint).
          *   65-75: Debrief.

  5.  **Addressing the "Predictably Goes Wrong":**
      *   Water spills (obviously).
      *   Water drags too fast (viscosity makes Stage 1 hard to sustain).
      *   Students cheat the constraint (slip "absolute" language in).
      *   Centrifugal force confusion (physics vs. philosophy).
      *   Dizziness (students spinning in chairs).

  6.  **Addressing the Limitation:**
      *   The room is not the universe. Mach's principle requires the *fixed stars* or the mass of the universe. In a classroom, the walls are too light. The activity can't show *why* the walls matter vs. absolute space, only that referencing the bucket fails. It can't distinguish between Absolute Space and the Mass of the Universe effectively without a thought experiment extension.

  7.  **Refining the Debrief:**
      *   Connect the frustration (can't explain curvature with just bucket) to Newton's move (Absolute Space).
      *   Connect the "Room" reference to Mach (Fixed Stars).
      *   Highlight the cost of each view (Ontological bloat vs. Explanatory gap).

  8.  **Final Review against Constraints:**
      *   15 students? Yes (3 groups of 5).
      *   75 mins? Yes.
      *   Small classroom? Yes (stations).
      *   Turntables/chairs? Yes.
      *   Buckets/lids? Yes.
      *   No absolute space talk? Yes (The Embargo).
      *   Predict pitfalls? Yes.
      *   Honest limitation? Yes.

  9.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Physics:* It is extremely hard to keep water still while spinning a bucket manually. The viscosity drags it within seconds.
      *   *Fix:* Acknowledge this limitation in the "What Goes Wrong" section. Suggest using the *start* of the spin for Case 1 and the *steady state* for Case 2. Or, use the "Bucket Stop" method (Spin both, stop bucket, water keeps spinning).
      *   *Decision:* The "Bucket Stop" method is safer and clearer for the paradox.
          *   Phase 1: Spin everything. Stop the bucket. Water still spins. (Relative motion exists, Surface Curved).
          *   Phase 2: Wait. Water stops. (Relative motion zero, Surface Flat).
          *   *Wait, Newton's argument relies on:*
              1.  Bucket spins, Water still -> Flat.
              2.  Bucket spins, Water spins -> Curved.
          *   If I do "Stop Bucket, Water Spins":
              1.  Bucket Still, Water Spins -> Curved.
              2.  Bucket Still, Water Still -> Flat.
          *   This is the inverse but logically equivalent regarding relative motion.
          *   *Let's stick to Newton's original for fidelity:*
              *   Trial A: Start spin. Bucket moves, Water lags. (Relative Motion: High. Surface: Flat).
              *   Trial B: Steady spin. Bucket moves, Water moves. (Relative Motion: None. Surface: Curved).
          *   *Instruction:* Spin gently. Observe immediately (Trial A) vs. after 10 seconds (Trial B).

  10. **Final Polish:** Ensure tone is pedagogical and practical. Emphasize the "Embargo" rule as the key philosophical lever.

  *(Self-Correction on Materials)*: Clear buckets are hard to find. Suggest clear plastic deli containers or cutting the tops off clear soda bottles. Lids are mandatory. Food coloring helps see the rotation.

  *(Self-Correction on Limitation)*: The big limitation is that the room is *not* inertial in the Machian sense if the universe isn't there. But for the sake of the class, the room stands in for the "Fixed Stars." I need to be clear that the activity forces them to pick the *walls* as the reference, which hints at Mach, but doesn't prove Mach over Newton.

