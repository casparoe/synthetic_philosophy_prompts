prompt: |-
  I co-teach a philosophy of physics seminar on the substantivalism-relationism debate, about 15 students, one 75-minute session, and I want an in-class activity that makes them feel the force of Newton's bucket argument without me just lecturing the standard two-stage analysis at them. We have a small classroom with a couple of turntables or office chairs, and I can bring buckets of water (with lids, maybe). Design a structured activity where students in small groups try to predict and then explain the water surface shape at different stages of the bucket experiment, but with a twist: they can only state their explanations in terms of relative motions between objects actually in the room — no absolute space talk allowed. They should run into the fact that when relative rotation between the bucket and water is large the surface is flat, and later when bucket and water are rotating together the surface is concave. Then give me a debrief that maps those moments onto the substantivalist vs relationist split, including a Machian move of appealing to the rest of the room or the fixed stars. Include rules, a timeline, a materials list, and what predictably goes wrong the first time I run it, besides water spills. Also be honest about which feature of the debate the activity can't capture because it's confined to the room.
