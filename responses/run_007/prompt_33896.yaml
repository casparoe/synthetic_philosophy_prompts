answer: |-
  You have put your finger on precisely the right difficulty. Your classmate's objection is a common one, but as you have intuited, it relies on treating 'beauty is in the eye of the beholder' as a monolithic philosophical claim rather than a loose collection of distinct propositions. Hume's essay is sophisticated precisely because he accepts some of these propositions while vigorously rejecting others. To dismiss him as merely 'rescuing objectivity' is to miss the nuance of his sentimentalist framework.

  Let us disentangle the slogan into four distinct theses, arranged from the least to the most philosophically contentious. I shall then assess Hume's position on each, before isolating the specific premise your classmate requires.

  ### 1. The Empirical Thesis (Variability of Taste)
  **The Claim:** People disagree about aesthetic matters. What one person finds beautiful, another may find dull or ugly.
  **Contentiousness:** Low. This is a matter of observable fact.

  *   **Hume's Verdict:** **Accepted.**
      Hume opens his essay by acknowledging the 'great variety of Taste'. He notes that it is natural for one man to prefer Milton, whilst another prefers Ogilby. He does not try to explain away this disagreement; he takes it as the starting point of his enquiry.

  ### 2. The Psychological Thesis (Subjectivity of Sentiment)
  **The Claim:** Beauty is not a physical property of the object (like mass or extension) but is a sentiment or feeling aroused in the mind of the perceiver.
  **Contentiousness:** Moderate. This challenges naive realism about aesthetic properties.

  *   **Hume's Verdict:** **Accepted.**
      This is the cornerstone of Hume's empiricism. He famously writes that 'beauty is no quality in things themselves: It exists merely in the mind which contemplates them'. For Hume, to call a poem beautiful is to report a specific kind of pleasure experienced by the reader. In this specific sense, he agrees entirely that beauty is 'in the eye (or mind) of the beholder'.

  ### 3. The Semantic Thesis (Non-Cognitivism)
  **The Claim:** Aesthetic judgments (e.g., 'This poem is good') do not state facts that can be true or false; they merely express the speaker's approval or disapproval.
  **Contentiousness:** High. This denies that aesthetic discourse is truth-apt.

  *   **Hume's Verdict:** **Complicated.**
      Hume is a precursor to non-cognitivism, as he grounds judgment in sentiment rather than reason. However, he does not think this renders all judgments equally valid expressions. He believes that while the *source* is subjective, the *appropriateness* of the sentiment can be assessed. If a critic lacks the requisite delicacy of imagination or is prejudiced, their sentiment is 'defective'. Thus, for Hume, an aesthetic judgment can be 'blamed' or 'praised' based on the condition of the beholder, which moves it closer to a claim about correctness than pure expressionism allows.

  ### 4. The Normative Thesis (Radical Relativism)
  **The Claim:** Because beauty is subjective, no aesthetic judgment is more correct than another. There is no 'fact of the matter' regarding which poem is better; all preferences are equally valid.
  **Contentiousness:** Very High. This denies the possibility of aesthetic expertise or improvement.

  *   **Hume's Verdict:** **Rejected.**
      This is the entire point of 'Of the Standard of Taste'. Hume argues that despite the subjectivity of sentiment, we can establish a standard based on the 'joint verdict of true judges'. If a work pleases those with strong sense, delicate sentiment, practice, and freedom from prejudice, it is objectively better (in terms of aesthetic merit) than one that does not. He explicitly argues that it is not 'equal' to prefer Bunyan to Addison, just as it is not equal to prefer a pond to an ocean in terms of magnitude.

  ***

  ### The Classmate's Necessary Premise

  For your classmate's dismissal to hold water, they must be relying on **Thesis 4: The Normative Thesis (Radical Relativism)**.

  If they merely meant Thesis 1 (people disagree) or Thesis 2 (beauty is a feeling), Hume would agree with them. His project is not to deny that beauty is a sentiment, but to show how we can nevertheless distinguish between *good* sentiments and *bad* ones.

  When your classmate stated, 'There's no fact of the matter about whether one poem is better than another,' they asserted that normative relativism is true. Consequently, they concluded that Hume's attempt to find a standard is futile (or 'snobbery'). If Thesis 4 is false, their argument collapses.

  ### Is That Reading Defensible?

  Is the Normative Thesis defensible? It is a coherent position, but it is far from self-evident, and your classmate offered no argument for it beyond the slogan itself.

  To defend Radical Relativism, one must explain away the strong intuition that aesthetic expertise exists. We generally accept that a trained musician hears more in a symphony than a novice, or that a seasoned reader grasps nuances in a poem that a child misses. If all judgments are equally valid, the concept of 'learning' about art becomes incoherent.

  Hume's counter-argument is that the 'standard of taste' is not an external metaphysical fact, but an internal standard of human psychology. He argues that human nature is sufficiently uniform that, under ideal conditions (the 'Ideal Critic'), our sentiments converge. To call this 'snobbery' is to conflate *social* elitism with *functional* expertise. Hume's 'true judges' are not defined by class, but by their capacity for attention, lack of prejudice, and comparative experience.

  Therefore, while your classmate's position is defensible in principle (one *can* be a moral or aesthetic relativist), it is not defensible merely by waving the slogan 'beauty is in the eye of the beholder'. That slogan supports the Psychological Thesis (which Hume accepts), but it does not logically entail the Normative Thesis (which Hume rejects).

  ### Conclusion

  Your instinct was correct. The slogan is doing far too much philosophical heavy lifting. It conflates the *location* of beauty (the mind) with the *validity* of judgments about it (all equal). Hume's genius lies in accepting the former whilst denying the latter. Your classmate attacked a straw man; they assumed Hume was trying to prove beauty is a physical property of objects, when in fact he was trying to prove that some subjective responses are more authoritative than others. That is a much harder, and more interesting, philosophical problem than the one your classmate dismissed.
