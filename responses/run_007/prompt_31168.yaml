answer: |-
  This is a precise and well-posed question that cuts to the core of contemporary metanormative theory. The argument you describe is the foundation of the **Expected Choiceworthiness (ECW)** framework, championed by philosophers like William MacAskill, Andreas Mogensen, and Teddy Sepielli. It is often called the "Orthodox View" of moral uncertainty.

  To audit this analogy systematically, we need to treat it as a formal mapping between two decision problems: **Decision under Empirical Uncertainty (DEU)** and **Decision under Moral Uncertainty (DMU)**.

  Here is the systematic audit of the analogy, the structural breaks, and the viability of the conclusion.

  ---

  ### I. The Formal Mapping

  To see where the analogy breaks, we must first formalize where it holds. The ECW argument posits an isomorphism between the variables of standard decision theory and the variables of moral uncertainty.

  | Component | Empirical Uncertainty (DEU) | Moral Uncertainty (DMU) |
  | :--- | :--- | :--- |
  | **Uncertain Variable** | States of the World ($S_1, S_2...$) | Moral Theories ($T_1, T_2...$) |
  | **Attitude** | Credence / Probability ($P$) | Credence / Normative Probability ($C$) |
  | **Evaluation Metric** | Utility / Value ($U$) | Choiceworthiness ($CW$) |
  | **Aggregation Rule** | Expected Utility ($\sum P \times U$) | Expected Choiceworthiness ($\sum C \times CW$) |
  | **Action Rule** | Maximize $EU$ | Maximize $ECW$ |

  **The Intuition:** Just as you shouldn't ignore a 10% chance of rain when deciding whether to picnic, you shouldn't ignore a 10% chance that Kantianism is true when deciding whether to lie.

  ### II. The Substantive Disanalogies

  The analogy faces three classes of disanalogies: metaphysical, structural, and normative. The cosmetic ones (e.g., "moral facts aren't physical") don't matter. The following three threaten the mathematical and normative validity of the ECW conclusion.

  #### 1. The Intertheoretic Comparability Problem (Structural)
  This is the objection you flagged, and it is the most severe technical hurdle.

  *   **In DEU:** Utility is assumed to be **cardinal** and **interstate comparable**. Whether it rains or shines, the "utility" of me being dry is measured on the same scale. The agent's preference structure provides a single currency.
  *   **In DMU:** Each moral theory brings its own *ontology of value*.
      *   Utilitarianism measures in "units of welfare."
      *   Kantianism measures in "conformity to duty" (often binary or lexical).
      *   Virtue Ethics measures in "flourishing" or "virtuousness."
  *   **The Break:** There is no "view from nowhere" to calibrate these scales. If Utilitarianism says Action A yields 100 welfare units, and Kantianism says Action B violates 1 constraint, how do you sum them? Is 1 constraint violation worse than 100 welfare units?
  *   **Threat to Conclusion:** Without a common denominator, the summation in $\sum C \times CW$ is mathematically meaningless (like adding meters to seconds).
  *   **Proponent Response:** Some argue for **structural normalization**. For example, we can normalize the *range* of values each theory assigns (variance normalization) or the *distance* between best and worst options (range normalization).
  *   **Audit Verdict:** This is a patch, not a solution. Normalization assumes theories are *cardinal* (they assign specific numbers, not just rankings). Many plausible moral theories are essentially ordinal. If a theory says "A is better than B" but refuses to say "by how much," ECW cannot process it. **The analogy breaks here unless you restrict the domain to only cardinal moral theories.**

  #### 2. The "Internalist" Objection (Normative Authority)
  This is often more damaging than the comparability problem.

  *   **In DEU:** Decision theory (maximize expected utility) is generally taken to be the rational standard *regardless* of what the states of the world are. The rain doesn't have an opinion on whether you should maximize expected utility.
  *   **In DMU:** The "states" (moral theories) *themselves* are normative authorities. They tell you what you ought to do.
  *   **The Break:** What if your favorite theory (say, Utilitarianism) explicitly rejects decision-theoretic hedging?
      *   Some first-order theories claim to be **categorical**. A Kantian might argue: "If I am true, you must never lie, regardless of your credence in me. To hedge is to fail to respect the categorical imperative."
      *   If you assign 90% credence to a theory that says "Ignore all other theories," and 10% to a theory that says "Hedge," maximizing ECW might violate the instructions of the 90% theory.
  *   **Threat to Conclusion:** ECW imposes a *metanormative* principle (hedging) that may be inconsistent with the *first-order* theories being weighed. You are using a decision procedure that the very theories under consideration might forbid.
  *   **Audit Verdict:** This suggests ECW is not a neutral framework but a rival moral theory itself. It privileges theories that are "uncertainty-friendly" over those that are "absolutist."

  #### 3. The Nature of Credence (Metaphysical)
  *   **In DEU:** Credence tracks objective (or epistemic) probability about contingent facts. There is a fact of the matter about whether it will rain.
  *   **In DMU:** Credence tracks confidence in normative truths.
  *   **The Break:** If moral non-cognitivism is true, there are no moral "facts" to be uncertain about, only attitudes. But even assuming cognitivism:
      *   **Empirical uncertainty** is resolved by observation.
      *   **Moral uncertainty** is resolved by reflection/argument.
      *   This creates a **regress problem**. If I am uncertain about morality, I should use ECW. But what if I am uncertain about *whether ECW is the correct way to handle moral uncertainty*? In empirical cases, we assume decision theory is fixed. In moral cases, the decision theory itself is part of the normative domain subject to uncertainty.
  *   **Threat to Conclusion:** This leads to an infinite regress of "uncertainty about how to handle uncertainty." To stop the regress, you must be dogmatically certain about *some* metanormative principle (like ECW), which undermines the spirit of the uncertainty project.

  ### III. Does the Expected-Value Conclusion Survive?

  **Verdict: Conditionally, but with heavy baggage.**

  The conclusion (that we should maximize expected choiceworthiness) survives only if you accept two controversial premises:
  1.  **Cardinality:** Moral theories yield cardinal choiceworthiness values, not just ordinal rankings.
  2.  **Comparability:** There is a coherent method (like variance normalization) to translate these values into a common currency.

  If you accept these, ECW works. However, many philosophers argue these premises are false. If moral theories are ordinal (A is better than B, but no "amount" better), the expected value calculation collapses.

  Furthermore, the **Internalist Objection** suggests that even if the math works, the *normativity* fails. If the true moral theory is "My Favorite Theory" (act only on the theory you think most likely), then ECW is morally wrong. Since we are uncertain which theory is true, we cannot rule out that "My Favorite Theory" is the correct one. Thus, ECW is not uniquely rational; it is just one candidate among others in the moral uncertainty mix.

  ### IV. A Better Analogy? The Parliamentary Model

  If the Empirical/Decision-Theoretic analogy imports too much baggage (cardinality, common currency), is there a better structural analogy?

  The leading alternative is the **Parliamentary Model** (proposed by Nick Bostrom and developed by others like Krister Bykvist).

  **The Mapping:**
  *   **Empirical/DEU:** A single agent maximizing utility.
  *   **Moral/DMU:** A parliament of legislators.
  *   **Credence:** Number of seats held by each party (proportional to credence).
  *   **Moral Theories:** Political parties.
  *   **Action:** Legislation passed by voting.

  **Why this handles the disanalogies better:**
  1.  **Ordinality:** Legislators vote based on preference orderings (A > B > C). They do not need to agree on a common currency of utility. This bypasses the Intertheoretic Comparability problem.
  2.  **Disagreement:** It captures the adversarial nature of moral theories better. Utilitarianism and Kantianism aren't just different "states of the world"; they are competing stakeholders.
  3.  **No Summation:** You don't add "welfare units" to "duty units." You count votes.

  **New Problems Introduced:**
  *   **Cycling:** Social choice theory (Arrow's Theorem) shows that voting systems can lead to intransitive outcomes (A beats B, B beats C, C beats A).
  *   **Logrolling:** Parties might trade votes ("I'll support your war if you support my tax"), which might lead to morally abhorrent compromises that no individual theory endorses.
  *   **Status Quo Bias:** Voting models often struggle to justify action over inaction if the voting rules require a majority to change the status quo.

  ### V. Summary Audit

  | Feature | Empirical Uncertainty Analogy | Parliamentary Analogy |
  | :--- | :--- | :--- |
  | **Mathematical Operation** | Weighted Sum (Expectation) | Voting / Bargaining |
  | **Value Requirement** | Cardinal & Comparable | Ordinal & Rank-based |
  | **Main Vulnerability** | Intertheoretic Comparability | Voting Paradoxes / Logrolling |
  | **Normative Status** | Claims to be rationality itself | Claims to be fair procedure |
  | **Handling Absolutism** | Poor (dilutes absolute constraints) | Better (veto power possible) |

  **Final Assessment:**
  The Empirical Uncertainty analogy is **heuristically powerful but metaphysically fragile**. It works well for "consequentialist-adjacent" uncertainty (e.g., uncertainty between different types of utilitarianism) where the currency of value is similar. It breaks down when the uncertainty spans fundamentally different ontologies of value (e.g., Utilitarianism vs. Deontology).

  The **Expected Choiceworthiness** conclusion does not follow as a matter of pure rationality in the way it does for empirical uncertainty. It is instead a substantive moral claim: *that the right way to act under moral uncertainty is to hedge.*

  If you want to avoid the "single currency" trap without adopting the complexities of social choice theory, the most robust position is often **Moral Hedging without Aggregation**. This involves satisfying constraints from high-credence theories where possible without violating constraints from low-credence theories (a "satisficing" approach rather than "maximizing"), though this lacks the elegant precision of the expected-value formula.

  **Recommendation:** If you are using the analogy for practical guidance, treat ECW as a *pro tanto* reason rather than a decisive algorithm. It captures the intuition that we shouldn't be dogmatic, but the mathematical import from empirical decision theory is stronger than the moral reality can bear.
