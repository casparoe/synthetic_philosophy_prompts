  The breath returns to where it had been known.
  You sleep beyond the reach of morning light.
  Grief claims the loan as if it were your own.

  The wise man sings; he sits upon a stone.
  He drums upon a tub and sings to night.
  The breath returns to where it had been known.

  Below the ground, no king sits on a throne.
  The laborer rests without a need for light.
  Grief claims the loan as if it were your own.

  Why feed the crows and leave the ants a bone?
  Above, below, all vanishes from sight.
  The breath returns to where it had been known.

  The season turns; the fruit is fully grown.
  The shape dissolves into the common night.
  Grief claims the loan as if it were your own.

  The circle closes; nothing stands alone.
  Accept the turn without a desperate fight.
  The breath returns to where it had been known.
  Grief claims the loan as if it were your own.
