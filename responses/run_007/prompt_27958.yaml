prompt: |-
  I am a senior legislative drafter at a federal agency. My office writes and reviews the text of regulations before they are published in the Federal Register. Over the past five years, we have had two incidents in which a regulation contained a provision that turned out to be truth-value indeterminate — a liar-like paradox buried in the text — and it caused genuine legal confusion that took months and a formal interpretive rule to untangle. My director has now tasked me with developing a pre-publication review procedure to catch these before they become law.

  Here are three provisions from our past work that illustrate the kind of thing that worries us:

  (a) "Any rule in this part may be waived by the Administrator for good cause, except this rule."

  (b) "For purposes of this part, 'regulation' means any rule, order, or guidance document issued under this statutory authority, including this definition."

  (c) "This provision shall take effect only if a court of competent jurisdiction determines it to be invalid."

  Please write a decision procedure my team can run on any proposed regulatory text to identify and flag provisions that may be paradoxical or truth-value-indeterminate due to self-reference. The procedure should satisfy the following constraints:

  - It must be runnable by a trained drafter — not a logician — in under an hour per regulation. Our regulations average about 40 pages of text.
  - It must distinguish benign self-reference (e.g., "this section does not apply to Class II devices" or "the authority granted by this section terminates after five years") from self-reference that creates a genuine risk of paradox or a truth-value gap.
  - For each flagged provision, it must indicate whether the problem can be repaired by a simple rewrite (and if so, what kind of rewrite) or whether it must be escalated to our general counsel's office because it raises a substantive question that cannot be resolved by drafting technique alone.
  - It should include a small set of diagnostic patterns or test sentences that a drafter can apply to a suspect clause to determine whether it is problematic, without requiring the drafter to reconstruct the underlying theory of truth or self-reference from scratch.

  After laying out the procedure, please run it on each of the three examples above, showing exactly how the procedure classifies and handles each one.

  Then construct a fourth case of your own — a regulatory provision that is not obviously paradoxical on a casual reading — and run the procedure on it, choosing the case so that the procedure yields a result that a typical drafter would find surprising or would resist (for instance, a seemingly innocuous clause that the procedure flags as dangerous, or a clause that looks suspicious but that the procedure correctly clears).

  Finally, tell me honestly: what kinds of self-referential paradoxes will this procedure miss? Where will it generate false alarms that waste our time? And at what points in the procedure does a judgment call get disguised as a mechanical step?
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Senior Legislative Drafter at a federal agency.
      *   **Task:** Develop a pre-publication review procedure to catch truth-value indeterminate (paradoxical) provisions in regulations.
      *   **Context:** Two past incidents caused legal confusion. Need a practical tool for trained drafters (not logicians), runnable in <1 hour on ~40 pages.
      *   **Constraints:**
          *   Distinguish benign self-reference from paradoxical self-reference.
          *   Indicate repairability (rewrite vs. escalate to General Counsel).
          *   Include diagnostic patterns/test sentences.
          *   Run the procedure on three provided examples (a, b, c).
          *   Construct a fourth "tricky" case (counter-intuitive result).
          *   Honest assessment of limitations (false negatives, false positives, disguised judgment calls).

  2.  **Deconstruct the Problem (Logic in Law):**
      *   Legal paradoxes usually arise from *semantic closure* (a rule defining its own validity) or *performative contradiction* (a rule negating its own enforcement).
      *   *Example (a):* "Waive any rule... except this rule." This is a performative constraint. It's not strictly a liar paradox ("This sentence is false"), but it creates a logical lock. If the Administrator wants to waive *this* rule, they can't. It's a rigid constraint, not necessarily truth-value indeterminate, but potentially operationally paradoxical if another rule mandates a waiver. Actually, looking closer: It creates a hierarchy issue. It's more of a "unwaivable rule." Is it paradoxical? Not strictly truth-value indeterminate, but it creates a *normative* gap if another provision says "The Administrator *shall* waive this rule."
      *   *Example (b):* Definition of 'regulation' includes 'this definition'. This is circular but usually benign in law (recursive definitions are common). However, if the definition imposes burdens, does it impose them on itself? Usually harmless.
      *   *Example (c):* "Effective only if... determined... invalid." This is the classic "This sentence is false" structure translated into legal effect. If valid -> court says invalid -> effective. If invalid -> court says valid (presumably) -> not effective. It creates a condition precedent that contradicts the status required to trigger it. This is the most dangerous one.

  3.  **Develop the Decision Procedure (The "Paradox Screen"):**
      *   *Goal:* Practical, fast, non-technical.
      *   *Step 1: Identification (The Scan).* Look for self-referential keywords ("this section," "this part," "the foregoing," "herein").
      *   *Step 2: Classification (The Type).* Is it definitional, operational, or validity-based?
      *   *Step 3: The "Negation Test" (Diagnostic).* If I assume the rule works, does it stop itself from working? If I assume it doesn't work, does that make it work?
      *   *Step 4: Repair/Escalation.* Can we sever the self-reference? Or is the policy intent itself flawed?

      *Refining the Procedure for the User:*
      *   Needs to be a checklist.
      *   Needs clear "Stop/Go" signals.
      *   Needs to address the "Benign vs. Malignant" distinction. Benign = reference to scope/authority. Malignant = reference to validity/enforceability/definition of truth.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* The Self-Reference Integrity Screen (SRIS).
      *   *Phase 1: Trigger.* Highlight clauses referencing the document itself.
      *   *Phase 2: The Validity Question.* Does the clause determine its own legal force? (Crucial distinction).
      *   *Phase 3: The Dependency Loop.* Does the clause's operation depend on a status that the clause itself alters?
      *   *Phase 4: Resolution.*

  5.  **Running the Procedure on Examples:**
      *   *(a) "Waive... except this rule."*
          *   Self-ref? Yes.
          *   Validity/Force? It limits waiver authority.
          *   Paradox? No, it's just a hard limit. *Correction:* Wait, the prompt calls these "truth-value indeterminate." I need to be careful. (a) is actually *not* a liar paradox. It's a substantive restriction. It might be *policy* stupid, but not logically paradoxical. However, if another rule says "All rules must be waivable," then we have a conflict. I should classify it as "Benign Self-Reference (Substantive Constraint)" but flag for policy conflict.
      *   *(b) "Regulation means... including this definition."*
          *   Self-ref? Yes.
          *   Validity? No, it's definitional.
          *   Paradox? No. Recursive definitions are standard.
      *   *(c) "Effective only if... invalid."*
          *   Self-ref? Yes (via court determination of *it*).
          *   Validity? Yes, conditions effect on invalidity.
          *   Paradox? Yes. Classic performative contradiction.

      *Wait, I need to align with the prompt's premise.* The prompt states these *caused genuine legal confusion* and were *truth-value indeterminate*. I must treat them as the "problem set." Even if (a) and (b) look benign to a logician, in the *legal context* described, they caused issues. I need to explain *why* they triggered the procedure, even if the outcome is "Benign."
      *   *Re-evaluation of (a):* If the Administrator *must* waive for good cause, but *cannot* waive this one, and good cause exists... it's a normative contradiction, not truth-value. But the prompt calls them "truth-value indeterminate." I will treat (a) as a "Normative Paradox" which functions similarly to a truth-value gap in enforcement.
      *   *Re-evaluation of (b):* If 'regulation' includes 'this definition', does the definition regulate itself? If the definition imposes a burden (e.g., "must be filed"), does the definition need to be filed? This is a scope paradox.
      *   *Re-evaluation of (c):* This is the clear winner for logical paradox.

  6.  **Developing the Fourth Case:**
      *   Need something subtle.
      *   *Idea:* A reporting requirement that depends on the existence of the report.
      *   *Draft:* "No person shall submit a report required by this section unless the report contains a certification that no report was required."
      *   *Why:* If you submit, you certify none required (lie). If none required, you don't submit.
      *   *Better Idea:* "This section applies to all actions taken after its enactment, including the enactment of this section." (Retroactivity paradox).
      *   *Best Idea (The "Severability" Trap):* "If any part of this regulation is held invalid, the remainder shall remain in effect, unless the invalid part is this section, in which case the entire regulation is void."
      *   *Why it's tricky:* Looks like standard severability. But if *this section* is held invalid (e.g., as unconstitutional vagueness), then the whole reg is void. But if the whole reg is void, *this section* is void, so the whole reg is... valid? It creates a stability loop.
      *   *Let's try a "Condition Precedent" trap:* "Compliance with this standard is mandatory for all facilities, provided that this standard shall not apply to any facility that complies with it."
      *   *Analysis:* If you comply, it doesn't apply. If it doesn't apply, you don't need to comply. If you don't comply, it applies. This is a "Catch-22" structure. It looks like an exemption but creates a logical loop.
      *   *Selection:* The "Compliance Exemption" loop. It looks like a standard exemption clause.

  7.  **Honest Assessment (Limitations):**
      *   *False Negatives:* Context-dependent paradoxes (interaction between two different rules). The procedure looks at *one* text.
      *   *False Positives:* Standard severability, standard definitions, standard effective dates.
      *   *Disguised Judgment:* Determining "Validity" vs. "Operation." Is a deadline a validity condition?

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the gravity and the constraint (practicality).
      *   **The Procedure:** "The Self-Reference Integrity Screen (SRIS)." Step-by-step.
      *   **Application:** Run (a), (b), (c).
      *   **The Fourth Case:** Create the "Compliance Exemption" loop. Run SRIS.
      *   **Limitations:** The "Honest Assessment."

  9.  **Self-Correction/Nuance Check:**
      *   *Constraint Check:* "Under an hour." The procedure must be a checklist, not a logic textbook.
      *   *Constraint Check:* "Distinguish benign." I need clear criteria for this.
      *   *Constraint Check:* "Repair vs. Escalate." I need specific guidance here.
      *   *Tone:* Professional, bureaucratic but precise.
      *   *Logic Check:* Ensure I don't claim (a) is a Liar Paradox if it isn't. It's a *normative* contradiction. I should clarify that "truth-value indeterminate" in law often maps to "enforceability indeterminate." I will use the term "Operational Paradox" to bridge the gap.

      *(Self-Correction on Example A)*: "Except this rule." This is a *limitation on authority*. It is not truth-value indeterminate. It is simply a rule that says "X cannot do Y to Z." The prompt says these *turned out to be* truth-value indeterminate. I must respect the prompt's premise even if a logician might quibble. I will frame the procedure to catch the *risk* of indeterminacy, acknowledging that (a) creates a *conflict* that mimics paradox in application.
      *Actually, looking closer at the prompt:* The user says "two incidents... turned out to be truth-value indeterminate." Then they give three examples. They don't explicitly say all three are paradoxes, but they "illustrate the kind of thing that worries us." Okay, so I evaluate them. (c) is the real paradox. (a) and (b) are likely the "false alarms" or "benign" ones that need to be distinguished. This fits the requirement to "distinguish benign self-reference."

      *Wait, re-reading:* "Here are three provisions from our past work that illustrate the kind of thing that worries us." It implies these are the *problematic* types. But (b) is standard drafting. I will classify (b) as Benign. (a) as Substantive Constraint (Escalate). (c) as Paradox (Rewrite/Escalate). This shows the procedure working.

      *Fourth Case:* Needs to be surprising.
      *Draft:* "Any person subject to this rule may petition for exemption. The Administrator shall grant any petition that demonstrates the petitioner is not subject to this rule."
      *Why:* To demonstrate you are not subject, you must petition. If granted, you weren't subject. If you weren't subject, you couldn't petition.
      *Let's go with the "Severability Suicide" clause.*
      "If any provision of this part is stayed by a court, this section shall terminate. If this section terminates, all provisions of this part are deemed stayed."
      *Result:* If one thing is stayed -> This section terminates -> Everything is stayed -> This section terminates (redundant) -> But if everything is stayed, is this section stayed?
      *Actually, let's go with the "Definition Loop" that looks benign.*
      "For the purposes of this rule, 'active participant' means any entity that files a report under this rule, including an entity that files a report solely to establish status as an active participant."
      *This creates a bootstrapping problem.*
      *Let's stick to the "Compliance Exemption" idea.* It's clearer for a drafter.
      "Requirement: All X must register. Exemption: X need not register if X is in compliance with this requirement."
      *Result:* If you register, are you in compliance? If you are in compliance, you need not register. If you don't register, are you in compliance?
      *This is good.*

  10. **Final Polish:** Ensure the tone is appropriate for a Senior Legislative Drafter. Use formatting (bolding, lists) to make it usable. Ensure the "Honest Assessment" is truly honest about the limits of a checklist.

  *(Self-Correction on "Truth-Value Indeterminate" in Law)*: Legal rules aren't true/false, they are valid/invalid or applicable/inapplicable. I need to translate "truth-value" into "applicability conditions." A paradox in law is when the condition for applicability negates the applicability. I will make this translation explicit in the procedure instructions.

  *(Final check on constraints)*:
  - Runnable by drafter? Yes, checklist style.
  - < 1 hour? Yes, focused on specific triggers.
  - Distinguish benign? Yes, via the "Validity/Effect" test.
  - Repair/Escalate? Yes, included in decision tree.
  - Diagnostic patterns? Yes, included.
  - Run on 3 examples? Yes.
  - 4th case? Yes.
  - Honest assessment? Yes.

