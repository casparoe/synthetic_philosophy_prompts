  Here is the structural sketch you asked for, followed by the sonnet itself. I've aimed to keep the metre tight (iambic pentameter) so the argument doesn't stumble, and I've used British spelling throughout.

  ### Structural Sketch

  *   **The Octave (Lines 1–8): The Realm of Duty.**
      *   *Rhyme Scheme:* ABBAABBA.
      *   *Function:* To establish the deontological baseline. This is the territory of obligation, the "moral minimum." We define the boundary where failure incurs blame, but success incurs no special praise. It captures the idea that duty is mandatory but not praiseworthy in the supererogatory sense.
      *   *Key Imagery:* Lines, fences, baselines, honour, censure.
  *   **The Volta (Line 9): The Leap.**
      *   *Function:* The turn. We move from the mandatory to the optional. The language shifts from "owe" and "blame" to "gift" and "grace."
  *   **The Sestet (Lines 9–14): The Realm of Excess.**
      *   *Rhyme Scheme:* CDDCEE. (A Petrarchan sestet modified to end in a couplet, per your request).
      *   *Function:* To explore the nature of the supererogatory act. It is beautiful precisely because it is unowed. It highlights the optionality—the hero could have done otherwise without blame.
  *   **The Closing Couplet (Lines 13–14): The Paradox.**
      *   *Function:* To land the philosophical problem. If the act is morally best, why is it not required? Because requiring it destroys the very quality that makes it good. The "ought" cannot capture the "best."

  ***

  ### The Boundary and the Gift

  There is a line drawn firmly in the light,
  Below which lies the blame we rightly fear.
  It is the least we owe to those held dear,
  The baseline of our shared and common sight.
  Within this sphere, our honour walks upright,
  And failure brings a censure always near.
  To meet this mark brings no distinction here,
  No praise for merely doing what is right.

  Yet see a hand reach past the narrow wall,
  A gift unowed, to all the world made known.
  A grace that stands entirely on its own,
  Where heroes rise though no one issues call.
  The finest good refuses to command,
  And leaves the best outside what we demand.
