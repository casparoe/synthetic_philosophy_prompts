      *   *Prediction:* She would endorse Rule 1 (Security/Independence). She would advise sacrificing the romantic attachment (or radically transforming it into a intellectual partnership, but the prompt says they are incompatible).
      *   *Why:* Because happiness for du Châtelet is not just a spike of pleasure, but a *state of being*. A state that is constantly undermined (by the demands of the lover) cannot be sustained. The "vegetating" warning (Case 4) doesn't apply here because she still has Study.

