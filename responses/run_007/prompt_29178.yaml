      *   **Kripke:** The student claims Kripke "merely relabels the problem." This is a common undergraduate simplification but philosophically contentious. Kripke argues the *metaphysical* status is necessary a posteriori, but the *epistemic* status is contingent. However, Kripke doesn't necessarily solve the *semantic* puzzle of cognitive significance; he often leans towards a Millian semantics. The student conflates Kripke's metaphysics with Frege's semantics.
