prompt: |-
  I'm a software engineer — mostly backend, so my logic background is a discrete math course ten years ago plus whatever I've absorbed from blog posts. I read a math blog the other day (not an academic one) and it gave this account of Skolem's paradox, which I've been turning over in my head:

  "Skolem discovered that even though set theory proves there are uncountable sets, the whole theory has a countable model. That means first-order logic literally cannot say 'uncountable': the same axioms are true of a universe with only countably many objects, so Cantor's diagonal argument must be slipping something past us. Skolem took this to show that cardinality is relative to a formal system — whether a set is countable or uncountable is not an objective fact about mathematics, it just depends on which model you happen to be looking at. So the whole hierarchy of bigger and bigger infinities is really an artifact of the axioms, not a discovery about the mathematical world."

  This sounds like a huge deal if its right, but I've got a nagging feeling the blogger is overclaiming somewhere. Can you go through it and tell me which parts are actually right, which parts are misleading or just wrong, and whether the last sentence follows from the accurate parts? I'm not after a reading list or citations — I just want to know what's solid here and what I should stop repeating at parties.
reasoning: |-
