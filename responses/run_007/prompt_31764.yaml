          *   *Theory 2: Deep Self/Values (The "Character" View).* Maybe we think intent reveals who you *really* are. Harming aligns with greed/selfishness (presumed default), so it reveals the "true self." Helping doesn't necessarily reveal the true self if the motive was profit.
          *   *Theory 3: Normative Expectations.* We expect people not to harm. Violating a norm makes the action stand out as "chosen." Conforming to a norm (helping) feels passive.
