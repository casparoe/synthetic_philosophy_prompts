answer: |-
  You have stumbled upon one of the most famous and debated problems in modern philosophy and moral psychology. What you are describing is not just a quirk of your school; it is a fundamental feature of how human beings process cause, effect, and responsibility.

  In academic circles, this is known as **The Knobe Effect** (or the **Side-Effect Effect**). It was identified by philosopher Joshua Knobe in 2003, and your observation of the vending machine situation is almost a perfect real-world replica of his original thought experiment.

  Here is a breakdown of what is going on underneath, why it happens, and what it implies for how we judge intent.

  ### 1. The Phenomenon: The Knobe Effect
  Knobe presented people with a scenario very similar to yours. He described a CEO who launches a new program.
  *   **Scenario A (Harm):** The CEO is told the program will increase profits but *harm* the environment. The CEO says, "I don't care about the environment, I just want profit," and launches it. The environment is harmed.
  *   **Scenario B (Help):** The CEO is told the program will increase profits but *help* the environment. The CEO says, "I don't care about the environment, I just want profit," and launches it. The environment is helped.

  Logically, the CEO's mental state is identical in both cases: indifference to the side effect. The primary goal (profit) is the same. The only difference is the moral valence of the side effect.

  Yet, when asked, "Did the CEO *intentionally* harm/help the environment?" the results were lopsided:
  *   Most people said the CEO **intentionally harmed** the environment.
  *   Most people said the CEO did **not intentionally help** the environment.

  This matches your school's reaction perfectly. The student council president is judged to have intentionally cut arts funding (bad) but not intentionally helped the smoothie bar (good), even though her mental state regarding both side effects was likely the same (indifference or lack of foresight).

  ### 2. Is There a Coherent Principle?
  You asked if there is a coherent principle that justifies this, or if it is just a bias. Philosophers and psychologists are still divided on this, but there are two main camps.

  **View A: It is a Cognitive Bias (The Error Theory)**
  This view holds that "intent" should be determined strictly by the agent's mental state (desires, beliefs, and plans).
  *   **The Principle:** To do something intentionally, you must *want* it to happen or aim for it as a goal.
  *   **The Verdict:** If you accept this definition, your peers are wrong. They are letting their emotional reaction to the *outcome* cloud their judgment of the *mind*. They want to blame the president for the arts cut, so their brains retroactively assign "intent" to make the blame stick. This is a form of **hindsight bias** mixed with **moral outrage**.

  **View B: It is a Feature of Our Concept of Intent (The Competence Theory)**
  This view argues that ordinary people aren't making a mistake. Instead, our shared definition of "intentional" *includes* moral judgment.
  *   **The Principle:** We don't just look at mechanics; we look at **norms**. When someone violates a norm (like "don't hurt the arts" or "don't harm the environment"), that violation stands out as a choice. When someone adheres to a norm or creates a good outcome, it feels passive.
  *   **The Verdict:** Under this view, "intentional" doesn't just mean "planned." It means "actively took responsibility for this outcome in a way that violates/uptakes a moral norm." Because harming the arts is a violation of expectation, we categorize it as an active choice. Helping the smoothie bar is consistent with general well-being, so we categorize it as background noise.

  ### 3. Why Do We Do This?
  Evolutionary psychologists suggest this asymmetry serves a social function.

  *   **Blame is Urgent:** If someone causes harm, the group needs to identify if they are a threat. Was this an accident, or will they do it again? We have a hyper-sensitive "threat detector." We would rather falsely accuse someone of intentional harm (false positive) than miss a malicious actor (false negative). So, we lower the bar for what counts as "intentional harm."
  *   **Praise is Optional:** If someone causes a benefit, it is less urgent to determine if they meant to do it. The benefit exists regardless. We keep the bar high for "intentional help" because we don't need to reward them as urgently as we need to police bad actors.

  In your hallway example:
  *   **Breaking up friend groups:** This violates a social norm (friendship/autonomy). The threat detector goes off. "They did this on purpose to control us."
  *   **Reducing bullying:** This aligns with a social norm (safety). The detector stays quiet. "That's just a lucky side effect."

  ### 4. What Does This Mean for You?
  You asked what this means for how seriously we should take everyday attributions of intent. This is the most critical part.

  **1. Intent is not a Fact; it is an Interpretation.**
  We often treat "intent" like a physical object—either it was there or it wasn't. The Knobe Effect shows that intent is a *social judgment*. When someone says, "You did that on purpose," they are often not describing your brain; they are describing their pain. They are saying, "This outcome is unacceptable, and I am holding you responsible for it."

  **2. Be Wary of "Malice" in Conflict.**
  In school politics, relationships, or even national news, people frequently attribute malice to outcomes that were actually negligence or indifference.
  *   **Hanlon's Razor** ("Never attribute to malice that which is adequately explained by stupidity") is a good rule of thumb, but the Knobe Effect explains *why* it's so hard to follow. Our brains naturally convert bad outcomes into malice.
  *   **Application:** When you see someone accused of intentional harm, ask: "If the outcome had been good, would we still say they did it on purpose?" If the answer is no, you are likely looking at the Knobe Effect in action.

  **3. Legal and Moral Implications.**
  This bias has real-world consequences. In court, *mens rea* (guilty mind) is required for many crimes. If jurors are subconsciously influenced by the Knobe Effect, they might convict someone of an intentional crime when it was actually reckless negligence, simply because the outcome was terrible.
  *   For you, this means understanding that when people assign blame, they are often engaging in **moral accounting**, not forensic analysis.

  ### Summary
  You have identified a genuine asymmetry in human moral reasoning.
  *   **Is it a bias?** By strict logical standards, yes. The mental state of the actor didn't change, only the outcome did.
  *   **Is it justifiable?** Some argue yes, because our concept of "intent" is designed to police norms, not just track brain states.
  *   **The Takeaway:** When you hear people claiming someone "did it on purpose," recognize that they are often expressing moral disapproval rather than stating a psychological fact.

  Your ability to spot this pattern as a sophomore suggests you have a strong aptitude for critical thinking and philosophy. Most adults go their whole lives without noticing that their definition of "intentional" shifts depending on whether they like the result. Keep asking these questions.
