      *   It is known as the **Knobe Effect** (or the **Side-Effect Effect**).
      *   Named after Joshua Knobe (2003).
      *   It challenges the traditional view that intent is determined solely by mental states (desire, belief, purpose) independent of moral judgment.

  3.  **Drafting the Response - Section by Section:**

