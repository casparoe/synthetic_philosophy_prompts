answer: |-
  In the firm's internal bulk-chemical transport division, the Central Board establishes per-ton-mile prices for tankers and fuel, adjusting them monthly based on aggregate surplus or shortage, while division managers strictly minimize costs at these prices and produce where marginal cost equals the board's tariff. Despite accurate accounting prices and rule-following managers, a persistent bottleneck arises at the Gulf Coast terminal where a specific valve corrosion issue, known only to veteran loaders through tactile feedback and smell, necessitates unplanned maintenance that the cost-minimization rule discourages because the board's price does not premium the specific risk of that valve failing on a Tuesday versus a Friday. The managers, obeying the price signal to maximize throughput, skip the nuanced check, causing leaks that register statistically as random variance rather than a price signal error, leading the Board to adjust prices for *volume* rather than *condition*, incentivizing more throughput of damaged goods because the local tacit knowledge of the valve's state cannot be encoded into the uniform price parameter the managers are instructed to obey.

  **The Check**

  **Why Mises would deny the setup:** Mises would argue that without private ownership of the capital assets (the tankers and terminals), there is no genuine exchange of title, meaning the "prices" are merely accounting shims lacking the entrepreneurial judgment of risk-bearing owners; thus, the calculation objection is not truly met because the prices do not reflect genuine scarcity preferences.

  **Why Lange would expect correction:** Lange would argue that the leaks represent a shortage of "safe transport," causing inventory losses that the Board will detect as a cost increase; through trial and error, the Board will eventually raise the price on that route sufficiently to cover the maintenance cost, inducing managers to perform the checks.

  **Hayek's residual problem:** Hayek identifies that the knowledge required to prevent the leak is not statistical data about past losses, but tacit, contextual knowledge of the *particular circumstances of time and place* (the specific valve's smell on a humid Tuesday) which cannot be aggregated to the Board to inform the price adjustment in time to prevent the loss.

  **The Single Hayekian Feature:** The **incommunicability** of the local knowledge; the failure is Hayekian rather than Misesian because prices *exist* and function, but they cannot transmit the specific contextual nuance required for efficient decision-making.

  **If that feature is removed:** If the valve's condition could be perfectly codified into a sensor reading transmitted to the Board, the Board could price the risk accurately, the managers would follow the rule, and the system would succeed, validating the Langean model.

  **Strongest Lange-style Response:** Lange could argue that managers should be instructed to use their local knowledge to minimize *long-run* average cost, effectively granting them entrepreneurial discretion to deviate from the marginal rule when local conditions dictate.

  **Does it concede Hayek's point:** Yes, because admitting that managers must rely on uncodified local judgment rather than strict adherence to central price rules concedes that the price mechanism alone is insufficient to coordinate economic activity, shifting the burden of efficiency back to the decentralized knowledge Hayek championed.
