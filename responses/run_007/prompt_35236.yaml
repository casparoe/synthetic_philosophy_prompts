answer: |-
  This is a draft for an adversarial collaboration document. It is designed to be neutral, precise, and strictly segregated between consensus and contention.

  ***

  # Draft Charter: The Performative Utterance Collaboration

  **Date:** October 26, 2023
  **Parties:** The Constitutivist Camp (CC) & The Reductionist Camp (RC)
  **Subject:** The Mechanism of Performative Utterances

  ## 1. Agreed Claims (Common Ground)
  *The following claims are accepted by both camps as the data to be explained. Neither camp treats these claims as evidence for their specific mechanism; they are the phenomena requiring explanation.*

  1.  **The Phenomenon:** There exists a class of utterances (e.g., "I promise," "I bet," "I name this ship") which, when uttered in appropriate contexts, effect a change in the normative status of the participants (e.g., creating an obligation, transferring ownership).
  2.  **Non-Descriptive Function:** In their primary performative use, these utterances are not primarily truth-apt descriptions of an independent state of affairs. (Both camps agree that "I promise" is not primarily a report *that* I am promising).
  3.  **Context Dependence:** The success of these utterances depends on contextual factors (who is speaking, institutional setting, prior events). Both camps agree that uttering "I sentence you" in a casual conversation fails to sentence anyone.
  4.  **Infelicity is Possible:** These utterances can be "unhappy" or void (e.g., if the speaker lacks authority, is coerced, or the procedure is flawed). Both camps agree that a void performative fails to effect the normative change.
  5.  **Convention Plays a Role:** Both camps agree that language is a public, conventional system. Neither camp argues that a private language could sustain performatives. The disagreement is about *what work* the convention is doing.
  6.  **Intention Plays a Role:** Both camps agree that the speaker generally must intend to perform the act. (Accidental utterances of "I promise" while reading a script do not typically bind the speaker). The disagreement is about whether intention is *sufficient* or merely *necessary*.
  7.  **Off the Table:**
      *   We are not debating whether normative statuses (obligations, rights) exist.
      *   We are not debating whether Gricean cooperation exists.
      *   We are not debating the existence of "illocutionary force" as a label, only its ontological status (primitive vs. derived).

  ## 2. Disagreements Table
  *Each position is phrased to be acceptable to its defenders without caricature.*

  | Dimension | Constitutivist Camp (CC) | Reductionist Camp (RC) |
  | :--- | :--- | :--- |
  | **Primary Mechanism** | The act is constituted by **public conventions/rules**. The utterance counts as the act because a social institution assigns that status to that utterance-type in that context. | The act is constituted by **communicative intentions**. The utterance counts as the act because the speaker intends to produce a response in the hearer by means of the hearer's recognition of that intention. |
  | **Role of Convention** | **Constitutive.** Conventions create the possibility of the act. Without the specific public rule (e.g., "count X as Y"), the act cannot exist, regardless of intention. | **Coordinating/Heuristic.** Conventions are stable solutions to coordination problems that help hearers recognize intentions. They are not metaphysically necessary for the act itself. |
  | **Source of Normativity** | **Institutional.** The obligation arises from the rules of the institution (like the rules of chess). To break the promise is to violate the constitutive rules of the practice. | **Interpersonal/Moral.** The obligation arises from the expectations generated by the recognized intention. To break the promise is to violate a normative expectation created between agents. |
  | **Explanatory Direction** | **Top-Down.** We understand the specific act by understanding the broader institution/practice that governs it. | **Bottom-Up.** We understand the institution/practice as an aggregation of individual communicative acts and intentions. |
  | **The "Magic" Claim** | The change in normative status is **irreducible** to psychological states. It is a distinctively social/institutional fact. | The change in normative status is **reducible** to complex psychological states (mutual belief, intention recognition) plus general moral norms. |

  ## 3. The Cruxes
  *These are the specific sub-questions where empirical or intuitive resolution would force at least one camp to revise their position.*

  **Crux A: The Sufficiency of Intention**
  Can a performative act be successfully completed if the speaker has the correct intention and the hearer recognizes it, *even if* the public convention for that specific utterance-type is missing or malformed?
  *   *If Yes:* Favors RC (Convention is heuristic).
  *   *If No:* Favors CC (Convention is constitutive).

  **Crux B: The Necessity of Intention**
  Can a performative act be successfully completed if the public convention is perfectly satisfied, *even if* the speaker lacks the corresponding intention (e.g., acting, coercion, or mental reservation)?
  *   *If Yes:* Favors CC (The rule binds regardless of interior state).
  *   *If No:* Favors RC (The intention is the engine).

  **Crux C: The Source of the "Ought"**
  When a promise is broken, what is the primary nature of the violation? Is it a violation of a **system rule** (like moving a rook diagonally) or a violation of an **interpersonal expectation** (like misleading a collaborator)?
  *   *If System Rule:* Favors CC.
  *   *If Interpersonal:* Favors RC.

  ## 4. Tests, Cases, and Predictions
  *For each Crux, we identify a specific case. Both camps commit to a prediction about the intuitive verdict of this case.*

  ### Test for Crux A: The "Non-Standard Phrasing" Case
  **Scenario:** A speaker and hearer share a language where the word "promise" does not exist, nor does any exact synonym. However, they share general moral norms about keeping one's word. The speaker says, "I hereby undertake an obligation to you to X," with the clear intention of promising, and the hearer recognizes this intention.
  *   **Question:** Has a *promise* been made?
  *   **CC Prediction:** **No.** A promise requires a specific constitutive procedure recognized by the institution. Without the specific convention (the "I promise" formula or its institutional equivalent), only a moral commitment exists, not an illocutionary act of promising.
  *   **RC Prediction:** **Yes.** The specific words are vehicles for the intention. If the intention to undertake an obligation is recognized, the illocutionary act is achieved. The convention is just a tool for recognition.

  ### Test for Crux B: The "Acting/Stage" Case
  **Scenario:** An actor on a stage says, "I promise to pay you," as part of a script. The audience knows it is a play. The conventional form is perfect; the context (a theater) is the only variable.
  *   **Question:** Is the utterance void because of the *context* (CC view) or because of the *lack of intention* (RC view)?
  *   **CC Prediction:** **Context is Decisive.** The utterance is void because the constitutive rules of the "theater institution" suspend the constitutive rules of the "promise institution." Even if the actor *did* intend to promise the other actor, the rules of the stage prevent the act from occurring.
  *   **RC Prediction:** **Intention is Decisive.** The utterance is void primarily because the actor lacks the serious communicative intention to bind themselves to the audience. If an actor *did* intend to bind themselves (e.g., a real proposal made during a play), the act could succeed despite the theatrical context.

  ### Test for Crux C: The "Secret Reservation" Case
  **Scenario:** A judge says, "I sentence you to five years," following all procedural rules. However, the judge secretly intends to pardon the prisoner immediately after court adjourns (a mental reservation). The sentencing is legally valid until the pardon is issued.
  *   **Question:** Did the sentencing act occur at the moment of utterance?
  *   **CC Prediction:** **Yes.** The constitutive rules of the legal institution were satisfied. The judge's private intention is irrelevant to the institutional fact. The act was performed, then undone by a subsequent act.
  *   **RC Prediction:** **No (or Ambiguous).** If the intention to sentence was absent (because they intended to pardon), the communicative act was defective *ab initio*. The legal validity is a separate bureaucratic fact, but the *speech act* itself was infelicitous because the intention did not match the utterance.

  ***

  ### Note on Consensus vs. Contention (For the Drafting Team)
  *   **Settled:** It is settled that performatives require context (felicity conditions). It is **not** settled whether those conditions are *constitutive rules* or *evidence for intentions*.
  *   **Settled:** It is settled that performatives create obligations. It is **not** settled whether that obligation is *institutional* (like a chess move) or *interpersonal* (like a reliance interest).
  *   **Settled:** It is settled that "I promise" is not a description. It is **not** settled that it is therefore a *sui generis* category (RC argues it falls under general communication).

  *Please review the predictions in Section 4. If either camp feels their position is misrepresented in the predictions, the collaboration halts until the prediction is revised to match the actual theoretical commitment.*
