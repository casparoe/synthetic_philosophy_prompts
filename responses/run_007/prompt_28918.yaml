  I've been trying to connect what I'm reading in two different literatures and I keep arriving at the conclusion that one of them is redundant, which makes me suspect I'm missing something. Philosophers writing about weakness of will, or akrasia, describe the phenomenon as freely and intentionally acting against one's own better judgment about what one should do, all things considered. Meanwhile, behavioral economists writing about hyperbolic discounting describe a pattern in which people discount future rewards very steeply over short horizons and much less steeply over longer horizons, which generates time-inconsistent preferences: from a distance you prefer the larger-later reward, but as the smaller-sooner reward approaches, your preference flips and you take it. This seems to be exactly the same behavior described in two different vocabularies. The philosopher's "better judgment" corresponds to the agent's long-run preference, and the "acting against it" corresponds to the preference reversal that the hyperbolic discount function predicts. So here is my question: once we have the hyperbolic discounting model, what explanatory work is left for the philosophical concept of akrasia to do? Is there any feature of weakness of will that the discounting model fails to capture, or are these just two names for the same thing?

  Please respond in continuous prose only, without any headings, bullet points, bold text, or tables — the way you would write an email or a letter.
