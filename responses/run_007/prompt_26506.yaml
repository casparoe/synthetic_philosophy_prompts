prompt: |-
  I'm writing an essay for a philosophy of biology course, and I want to read H.G. Wells's *The Island of Doctor Moreau* through the lens of the Gould and Lewontin spandrels critique of adaptationism. The basic idea from Gould and Lewontin is that not every trait is an adaptation — some are architectural byproducts (spandrels) of other features, and the adaptationist programme errs by assuming every trait must have been selected for.

  Moreau's whole project is about *designing* creatures — he's engineering human-like traits into animals through vivisection. But the novel is full of unintended consequences: the Beast Folk develop a religion (the Law), they revert to animal behaviours, and the whole thing collapses.

  I'd like you to act as a philosopher of biology who's also a careful reader of fiction. Think through each major element of the novel — the Law, the reversion, the hybrid bodies, the pain — and tell me which ones read as adaptations (functional responses to the creatures' situation), which read as spandrels (byproducts of Moreau's engineering that were never selected for), and which complicate the distinction.

  In particular, I'm interested in whether the novel itself seems to have an "adaptationist" sensibility — does it treat every outcome as explainable by function? — or whether Wells dramatises something like the spandrel critique avant la lettre. Be honest about where the novel resists the reading.

  I'm planning to argue that the novel actually shows the limits of a purely adaptionist view of design, but I want to know if I'm stretching it. Think through this carefully, maybe start by laying out what you take the spandrel critique to be before applying it to the novel, so I can see if we're on the same page.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Act as a philosopher of biology and literary critic to analyze H.G. Wells's *The Island of Doctor Moreau* through the lens of Gould and Lewontin's "Spandrels of San Marco" critique of adaptationism.
      *   **Key Concepts:** Adaptationism (every trait is selected for function) vs. Spandrels (traits are byproducts/constraints, not direct adaptations).
      *   **Specific Elements to Analyze:** The Law (religion), Reversion, Hybrid Bodies, Pain.
      *   **Core Question:** Does the novel support an adaptationist view (everything has a function/purpose) or does it anticipate the spandrel critique (things happen as byproducts/constraints, leading to collapse)?
      *   **User's Thesis:** The novel shows the limits of a purely adaptationist view of design.
      *   **Requirement:** Start by clarifying the Gould/Lewontin critique to ensure alignment, then apply it to the text, noting where the reading fits and where it resists.

  2.  **Deconstruct the Gould/Lewontin Critique (The Lens):**
      *   *What is it?* A 1979 paper criticizing the "adaptationist programme" in evolutionary biology.
      *   *Core Argument:* Evolutionary biologists often assume every trait exists because it was naturally selected for a specific function (optimization).
      *   *Alternative:* Many traits are "spandrels" – architectural byproducts of other changes (like the triangular spaces in an arch that get painted over). They aren't selected *for*; they just come along with the main structure.
      *   *Constraints:* Developmental, physical, and historical constraints limit what selection can do.
      *   *Relevance to Moreau:* Moreau acts as "Natural Selection" personified (an intelligent designer). He tries to impose function. The failure of his creations highlights the gap between *intended function* and *actual outcome* (byproducts/constraints).

  3.  **Analyze *The Island of Doctor Moreau* (The Text):**
      *   *Moreau's Goal:* To eliminate pain and instinct, creating a rational, human-like being. He is the ultimate adaptationist designer. He believes he can select for specific traits (upright gait, speech, inhibition of claw).
      *   *The Beast Folk:* Hybrids of animal and human.
      *   *The Law:* A ritualistic recitation forbidding animal behaviors.
      *   *Reversion:* The gradual return to animal states.
      *   *Pain:* The House of Pain is central.

  4.  **Mapping Text to Lens (Drafting the Analysis):**

      *   *The Hybrid Bodies:*
          *   *Adaptationist View (Moreau's):* Each change is functional (hands for tool use, voice for speech).
          *   *Spandrel View:* The physiology is unstable. The pain isn't a function; it's a byproduct of the structural incompatibility. The "human" traits sit on top of "animal" substrates. The body isn't a seamless machine; it's a patchwork.
          *   *Verdict:* Complicates the distinction. Moreau *treats* them as adaptations, but the text reveals them as unstable architectural compromises (spandrels of vivisection).

      *   *The Law (Religion):*
          *   *Adaptationist View:* It serves a function (social cohesion, suppression of instinct). Prendick initially sees it as a tool of control.
          *   *Spandrel View:* It emerges *because* of the cognitive dissonance. They have human speech but animal brains. The Law is a byproduct of that clash, not a selected trait. It's a coping mechanism for the structural flaw of being a hybrid.
          *   *Verdict:* Strong Spandrel reading. It's a cultural byproduct of biological engineering.

      *   *Reversion:*
          *   *Adaptationist View:* Reversion is a failure of selection (the "wild" traits were stronger).
          *   *Spandrel View:* Reversion is the inevitable result of developmental constraints. You can't overwrite deep phylogenetic history with surgical cuts. The "animal" isn't a trait to be removed; it's the foundation.
          *   *Verdict:* Supports the "limits of design" thesis.

      *   *Pain:*
          *   *Adaptationist View:* Pain is a warning system (functional). Moreau wants to remove it (engineering).
          *   *Spandrel View:* In the novel, pain is a constant byproduct of the *process*. It's not functional for the Beast Folk; it's the cost of the architecture.
          *   *Verdict:* Highlights the cost of ignoring constraints.

  5.  **Evaluating the User's Thesis:**
      *   *Thesis:* The novel shows the limits of a purely adaptationist view of design.
      *   *Assessment:* This is a strong, defensible thesis. Moreau represents the hubris of the adaptationist programmer (believing he can engineer function without constraint). The collapse represents the reality of spandrels/constraints.
      *   *Caveat:* Wells wrote before evolutionary synthesis, let alone Gould/Lewontin. We must avoid anachronism. However, Wells was a Huxley student and deeply engaged with biology. He understood the brutality of nature. The novel *dramatizes* the failure of intelligent design, which parallels the failure of strict adaptationism.
      *   *Resistance:* Does the novel ever slip into adaptationism? Yes, Prendick often tries to *explain* the Beast Folk's behavior functionally. Also, Moreau *believes* he is doing adaptationist work. The tension is between Moreau's view (adaptationist) and the Outcome (spandrel-like chaos).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the role (Philosopher of Biology/Literary Critic). Validate the thesis (it's not a stretch).
      *   **Part 1: The Lens (Gould & Lewontin):** Briefly define Adaptationism vs. Spandrels/Constraints to ensure alignment. Emphasize "Intelligent Design" as the ultimate adaptationist metaphor.
      *   **Part 2: Applying the Lens to the Novel:**
          *   Moreau as the Adaptationist Programmer.
          *   The Beast Folk's Bodies (Constraints vs. Function).
          *   The Law (Cultural Spandrel).
          *   Reversion (Phylogenetic Constraint).
          *   Pain (The Cost of Ignoring Constraints).
      *   **Part 3: Does the Novel Resist?** (Crucial for nuance). Prendick's narration, the ambiguity of "humanity."
      *   **Part 4: Conclusion:** Affirm the thesis. The novel is a cautionary tale against treating organisms as modular machines.

  7.  **Refining the Tone:**
