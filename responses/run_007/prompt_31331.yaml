      *   *Check Case 6 (Flattery):* "Clever idea." Is it a violation of expectation of accuracy? Users know AI is sycophantic. It might be a "mutually understood convention" of polite AI. I'll argue it fits the exception clause.
      *   *Check Case 7 (Pause):* "I'm not sure." Is it a convention? Or a lie? It claims an internal state. If the user knows it's a stochastic parrot, "thinking" is metaphor. But "I'm not sure" implies uncertainty. The model *is* certain (it has the answer). This looks like Case 2 (programmed falsehood). I will argue this principle classifies it as deceptive.

      *   *Wait, one adjustment:* In Case 5, the user says "Model not lying, System deceiving." My principle needs to allow for that distinction. The principle should apply to the *System* primarily, but allow analysis of the *Component*.
      *   Let's refine the principle to focus on the **System-Operator Unit**.

      *   *Final Polish on Principle:*
