answer: |-
  Here is a committed diagnosis.

  The disagreement is **substantive and normative**, rooted in a **clash of functional goals** (Behavioral Regulation vs. Evidential Logic), which is often mistakenly framed as a semantic dispute about the definition of probability. It is not merely "two different questions under one heading," because if it were, the camps could coexist peacefully by partitioning the domain. They do not coexist peacefully because each side claims their question is the *primary* one that statistics ought to answer. The stalemate persists because the dispute is ultimately about **who or what statistics is serving**: the scientific institution (Frequentist) or the individual reasoner (Bayesian).

  ### The Diagnosis: A Clash of Functional Goals

  You hypothesized that the disagreement is about the meaning of probability (frequency vs. credence). While this is the *language* of the dispute, it is not the *engine*. If the disagreement were purely semantic, the two sides could agree on a mathematical isomorphism and proceed. They cannot, because the mathematical differences enforce different **constraints on action**.

  The Frequentist framework is designed for **Behavioral Regulation**. Its core metric is the error rate of a *procedure* over hypothetical repetitions. This is not an accident of history; it is a feature designed to police the scientific community. When a Frequentist defends NHST against the replication crisis by citing "misuse" (p-hacking, optional stopping), they are implicitly arguing that statistics is a quality-control protocol for an institution. The "agent" in Frequentist theory is not the researcher holding the data, but the *editorial board* or the *field* ensuring that no more than 5% of published claims are false positives in the long run. The probability is a property of the *process*, not the *proposition*.

  The Bayesian framework is designed for **Evidential Logic**. Its core metric is the coherence of *belief* given the specific data observed. When a Bayesian attacks NHST for conditioning on unobserved data (the tail area) or depending on stopping rules, they are arguing that statistics is an epistemic engine for an individual. The "agent" is the researcher updating their credence. The probability is a property of the *proposition*, conditional on the *evidence*.

  The reason no one moves is that **neither goal is objectively superior without a specified cost function.**
  *   If your goal is to prevent a field from being flooded with false claims over a decade (Institutional Safety), the Frequentist control of Type I error is the relevant metric. Bayesian methods, with flexible priors, can be "hacked" just as easily as p-values if the goal is publication, and they lack the hard guarantee of long-run error control.
  *   If your goal is to make the most rational decision *right now* based on the data in hand (Individual Rationality), the Frequentist p-value is irrelevant. It tells you about hypothetical data you did not see, violating the Likelihood Principle.

  The dispute is substantive because it is a disagreement about **which risk is more tolerable**: the risk of long-run institutional contamination (Frequentist fear) or the risk of individual epistemic incoherence (Bayesian fear).

  ### Why It Is Not Merely Verbal or Empirical

  1.  **Not Verbal:** If this were just about the word "probability," we could rename Bayesian "credence" to "frequency-of-belief" and move on. But the math diverges. A Bayesian can stop collecting data whenever they like; a Frequentist cannot. This is not a translation error; it is a structural incompatibility in how evidence is weighed.
  2.  **Not Empirical:** We have decades of simulations. We know Bayesian methods can have good frequentist properties (and vice versa). We know priors can be manipulated and p-values can be hacked. The empirical record shows that *both* methods fail under adversarial conditions and *both* work under honest conditions. The fact that this empirical reality has not resolved the dispute proves the dispute is not empirical. It is normative.

  ### What Counts as Progress

  Given this diagnosis, you should **stop expecting a theoretical resolution** (a theorem or a new definition) that declares one side the winner. There is no "true" probability that settles whether we care more about long-run error or conditional coherence. That is a value judgment, not a mathematical fact.

  Progress will only come from **Decision-Theoretic Transparency**.

  1.  **Explicit Cost Functions:** Progress looks like fields moving away from "default" inference toward explicit decision theory. Instead of asking "Is this result significant?" or "What is the posterior?", researchers must ask: "What is the cost of a false positive versus a false negative in this specific context?"
      *   In drug safety (high cost of false positive), Frequentist error control is functionally superior.
      *   In exploratory theory building (high cost of false negative, need for cumulative evidence), Bayesian updating is functionally superior.
      *   *Progress* is a framework that allows researchers to select their tool based on the *consequences of error*, not the *philosophy of probability*.

  2.  **Separation of Inference and Decision:** A concrete step forward is formally separating the *evidential report* (Likelihood functions or Bayes Factors, which satisfy the Likelihood Principle) from the *decision rule* (Thresholds, which require error control).
      *   Frequentists often conflate the p-value (evidence) with the alpha level (decision).
      *   Bayesians often conflate the posterior (belief) with the utility function (action).
      *   *Progress* is a standard where the evidence is reported in a way that is invariant to stopping rules (satisfying the Bayesian desideratum) but evaluated against a pre-registered decision rule that controls long-run error (satisfying the Frequentist desideratum).

  3.  **Abandoning the "Default":** The most significant progress would be the dissolution of the "default language of evidence." The stalemate exists because your field forces a binary choice for all problems. Progress is a culture where the statistical method is justified by the **structure of the risk**, not by tradition.

  ### Conclusion

  Do not wait for the philosophers to agree on the meaning of probability. They will not. The disagreement is not about what probability *is*; it is about what science *is for*.

  *   If science is a **public utility** that must guarantee a maximum rate of false claims to society, the Frequentist is right.
  *   If science is a **process of learning** where rational agents must update their understanding of the world, the Bayesian is right.

  Your field's stagnation is a sign that it has not yet decided which of these two visions it holds. Progress requires you to stop asking "Which method is correct?" and start asking "What kind of risk can my field afford?" Until that normative question is answered, the mathematical dispute will remain a proxy war for unresolved values.
