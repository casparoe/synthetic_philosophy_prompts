  1.  **Analyze the User's Query:**
      *   **Context:** High school junior, physics class.
      *   **Observation:** Teacher gives partial credit on free-response (FRQ) based on "closeness" to the correct method/answer, but treats all wrong answers as equal (zero points) on multiple-choice (MCQ).
