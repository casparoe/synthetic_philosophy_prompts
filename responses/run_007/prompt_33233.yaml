      *   *Section 2: The Teacher's View (Verisimilitude).* Introduce Popper. Science aims for truth but often lands in approximation. Distinguish between *propositional truth* and *model accuracy*.
      *   *Section 3: Reconciling the Discrepancy.* Why FRQ vs. MCQ? It's about *causal structure* vs. *outcome*. In FRQ, the "truth" is the reasoning chain. In MCQ, the "truth" is the final selection.
      *   *Section 4: Is it Defensible?* Yes, in the context of *pedagogy* and *scientific modeling*. No, in the context of *formal logic*. The "truth" being graded is actually "understanding."
      *   *Section 5: What if we rejected closeness?* Grading would become pass/fail per step. No partial credit. Binary assessment of every line.
      *   *Conclusion:* Summarize. The teacher isn't grading "Truth" in the logical sense, but "Fidelity to Physical Law."

  8.  **Refining the Philosophy:**
