  ### 1. The Rule She Seems to Be Running
  Your friend appears to be applying a **Generalised Condorcet Rule**. The Condorcet Jury Theorem posits that if voters are independent and each has a probability of being correct ($p$) greater than 0.5, the probability of a correct majority verdict increases with the size of the group and exceeds the competence of any single member.

  Her previous verdicts align perfectly with this:
  *   **Cases 1, 2 & 4:** Independent voters with $p > 0.5$. She correctly identifies that the majority is superior.
  *   **Case 3:** Dependent voters. She correctly identifies that the independence assumption is violated, so the majority gains no advantage.

  She seems to have generalised this to mean that *any* independent group with average competence above 50 per cent is superior to its individual members, regardless of whether their competences are equal.

  *   **Prediction for the new case:** She will argue that because all three members are independent and exceed 50 per cent competence, the **majority verdict is more reliable**.

  ### 2. Alternative Rules
  There are other logical rules that fit her recorded verdicts equally well but would yield a different prediction for the new case.

  **Rule A: The Homogeneity Constraint**
  This rule states that the Condorcet advantage only holds when juror competences are identical.
  *   **Fit:** All her previous 'majority wins' cases involved jurors with identical probabilities (all 0.6 or all 0.51). The dependent case failed on independence.
  *   **Prediction:** Since the new panel has unequal competences (0.9, 0.6, 0.6), the theorem does not apply. She should **defer to the expert**.

  **Rule B: The Competence Threshold**
  This rule suggests that the majority is superior only if no single member's competence exceeds a specific threshold (e.g., 0.8). If a 'super-expert' exists, their signal is too strong to be improved upon by averaging with less competent peers.
  *   **Fit:** In all her previous cases, the maximum individual competence was 0.6. Thus, the threshold was never breached.
  *   **Prediction:** With a 0.9 expert, the threshold is breached. She should **defer to the expert**.

  *(Note: Mathematical calculation confirms that Rule B is actually correct for this case. The probability of the majority being right is 0.792, whereas the expert is right 0.9 of the time.)*

  ### 3. The Further Case to Tell Them Apart
  To definitively distinguish between your friend's **Generalised Condorcet Rule** and the more nuanced **Competence Threshold Rule**, you should propose a case that lies on the boundary.

  **Proposed Case:** A panel of three independent members with competences of **0.7, 0.6, and 0.6**.

  *   **Generalised Condorcet Rule:** Predicts the **Majority** is more reliable (since all $p > 0.5$).
  *   **Competence Threshold Rule:** Depends on where she sets the threshold. If she believes the threshold is 0.8, she predicts **Majority**. If she is calculating the maths (or has a lower threshold), she predicts **Expert**.
  *   **Mathematical Reality:** The expert (0.7) is actually more reliable than the majority (0.696).

  If she maintains that the majority is superior in the 0.9 case *and* the 0.7 case, she is firmly following the Generalised Condorcet Rule. If she switches to deferring to the expert in the 0.9 case but accepts the majority in the 0.7 case, she is likely operating with a specific Competence Threshold (somewhere between 0.7 and 0.9). If she defers to the expert in both, she is either intuitively grasping the weighted mathematics or applying a low threshold.

  Given this is a school project on the Condorcet Theorem, she is most likely to champion the wisdom of the crowd in both instances, making the 0.7 case an excellent probe to see if her belief in the theorem is absolute or conditional.
