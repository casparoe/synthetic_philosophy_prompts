  # The XOR-Mug Hybrid

  ### The Scenario

  Omega, a perfect predictor, approaches you with a proposal involving a single fair coin flip and a single prediction of your behavior.

  1.  **Prediction:** Omega predicts whether you will **Pay** $100 or **Refuse** if presented with a request. Let's call this prediction $Pred$ (where $Pred=1$ is Pay, $Pred=0$ is Refuse).
  2.  **Coin Flip:** Omega flips a fair coin ($C$).
      *   **Heads ($C=1$):** A "Disaster" occurs (e.g., your house burns down), costing you **$1,000,000**. This happens regardless of your payment.
      *   **Tails ($C=0$):** No Disaster occurs.
  3.  **The Message:** Omega sends you a letter saying "Pay $100" if and only if the Coin outcome **does not match** the Prediction ($C \neq Pred$).
      *   If $C=1$ (Heads) and $Pred=0$ (Refuse), you get the letter.
      *   If $C=0$ (Tails) and $Pred=1$ (Pay), you get the letter.
      *   Otherwise, you receive nothing.
  4.  **The Reward:** Independently of the letter, if the Coin is **Tails** ($C=0$) **and** Omega predicted **Pay** ($Pred=1$), Omega silently deposits **$10,000** into your bank account.
  5.  **The Decision:** You receive the letter. You must decide whether to Pay $100 or Refuse.

  You are now holding the letter. What do you do?

  ---

  ### The Verdicts

  *   **Causal Decision Theory (CDT):** Refuses.
  *   **Evidential Decision Theory (EDT):** Pays.
  *   **Updateless Decision Theory (UDT):** Pays.

  ---

  ### Reasoning Walkthrough

  #### 1. Evidential Decision Theory (EDT)
  **Verdict:** Pays.
  **Reason:** The XOR Evidential Link.

  EDT conditions on the action it takes to update its beliefs about the state of the world. You have received the letter, which tells you that $C \neq Pred$.
  *   **If you Pay:** You update that $Pred=1$ (since you are the type who pays). Given the letter ($C \neq 1$), the Coin must be Tails ($C=0$). Tails means **No Disaster**.
  *   **If you Refuse:** You update that $Pred=0$. Given the letter ($C \neq 0$), the Coin must be Heads ($C=1$). Heads means **Disaster** ($-1,000,000$).

  EDT compares the expected utility of the news: Paying is strong evidence that you are in the safe world (Cost: $100). Refusing is strong evidence that you are in the disaster world (Cost: $1,000,000). EDT pays to avoid the bad news.

  #### 2. Updateless Decision Theory (UDT)
  **Verdict:** Pays.
  **Reason:** The Counterfactual Reward.

  UDT chooses a policy *ex-ante* (before the coin flip and prediction) to maximize expected utility across all branches.
  *   **Policy "Always Pay" ($Pred=1$):**
      *   **Heads (50%):** $C=1, Pred=1$. Match. No letter. Disaster occurs. Outcome: $-1,000,000$.
      *   **Tails (50%):** $C=0, Pred=1$. Mismatch. Letter sent. You Pay ($-100$). Reward triggered ($+10,000$). Outcome: $+9,900$.
      *   **Expected Value:** $0.5(-1,000,000) + 0.5(9,900) = -495,050$.
  *   **Policy "Always Refuse" ($Pred=0$):**
      *   **Heads (50%):** $C=1, Pred=0$. Mismatch. Letter sent. You Refuse ($0$). Disaster occurs. Outcome: $-1,000,000$.
      *   **Tails (50%):** $C=0, Pred=0$. Match. No letter. No reward. Outcome: $0$.
      *   **Expected Value:** $0.5(-1,000,000) + 0.5(0) = -500,000$.

  UDT compares the policies: $-495,050 > -500,000$. UDT pays because committing to the "Pay" policy secures the $10,000 reward in the Tails branch, which outweighs the $100 cost in that same branch. (Note: In this hybrid, the payment and reward happen in the same branch, but the *eligibility* for the branch is determined counterfactually by the policy).

  #### 3. Causal Decision Theory (CDT)
  **Verdict:** Refuses.
  **Reason:** No Causal Leverage.

  CDT treats the Coin flip and Omega's Prediction as fixed past events.
  *   CDT knows the Disaster status is determined by the Coin, which payment cannot change.
  *   CDT knows the $10,000 Reward is determined by ($C=0$ AND $Pred=1$). Since $Pred$ is already fixed in the past, your current payment cannot cause the reward to appear.
  *   CDT sees the payment purely as a cost of $100 with no causal ability to prevent the Disaster or trigger the Reward.
  *   **Calculation:** Pay = $-100$. Refuse = $0$. CDT refuses.

  ---

  ### Isolation Analysis

  To prove this is a genuine hybrid, we remove the specific features that drive each theory.

  **1. Remove the Counterfactual Reward (UDT Test)**
  *   *Change:* The $10,000 Tails reward is removed.
  *   *Result:* UDT now compares $-500,050$ (Pay policy) vs $-500,000$ (Refuse policy).
  *   *Outcome:* **UDT Refuses.** Without the reward in the other branch (or the same branch contingent on policy), there is no policy-level benefit to paying. UDT behaves like CDT.

  **2. Remove the XOR Clause (EDT Test)**
  *   *Change:* Omega sends the Message *regardless* of the Coin/Prediction match (e.g., always sends if $Pred=1$).
  *   *Result:* Receiving the message no longer provides evidence about the Coin flip. Paying implies $Pred=1$, but tells you nothing about $C$.
  *   *Outcome:* **EDT Refuses.** Without the evidential link between Paying and Safety, EDT sees only the cost of $100. EDT behaves like CDT.

  ---

  ### The Causal Critique

  A Causal Decision Theorist would attack the case as follows:

  > "Both EDT and UDT are hallucinating influence. EDT pays because it thinks its action changes the past coin flip; it confuses correlation with causation. Just because paying is *evidence* you are safe doesn't mean paying *makes* you safe. The house is already burnt or not.
  >
  > UDT pays because it values a counterfactual world it cannot access. The $10,000 reward was determined by Omega's prediction before you ever saw the letter. If you are in the branch where you receive the letter and the reward was triggered, the money is already in your account. Paying $100 doesn't put it there; refusing doesn't take it away. You are literally throwing away $100 for no causal return."
