prompt: |-
  I'm writing a paper for my ethics seminar on supererogation, and before I dive into evaluating the major views, I want to get clear on what a theory of supererogation is even supposed to deliver. So: what are the desiderata? What cases must a theory get right — the soldier on the grenade, the stranger who donates a kidney, the person who forgives an unrepentant wrongdoer, and so on? What distinctions must it respect — between the supererogatory and the merely permissible, between supererogation and imperfect duty, between what is praiseworthly to do and what is blameworthly to omit? What puzzles must it dissolve — in particular, the central one: if a supererogatory act is morally better than a merely permissible alternative, why isn't performing it obligatory? Flag which requirements are non-negotiable constraints on any adequate view and which are optional commitments tied to particular moral frameworks (consequentialist, deontological, virtue-ethical). If any pair of desiderata turn out to be in tension — for instance, if making sense of the "beyond duty" character of supererogation ends up undermining the claim that such acts are genuinely morally better — I especially want that identified. I'll apply the list to specific theories myself; I just need the specification done rigorously.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Theory of Supererogation.
      *   **Goal:** Define the *desiderata* (requirements/criteria) for an adequate theory of supererogation.
      *   **Specific Questions to Answer:**
          *   What cases must it get right? (Extensional adequacy)
          *   What distinctions must it respect? (Conceptual clarity)
          *   What puzzles must it dissolve? (Theoretical coherence, specifically the "Paradox of Supererogation")
          *   Which requirements are non-negotiable vs. framework-dependent?
          *   Identify tensions between desiderata.
      *   **Tone/Style:** Rigorous, academic, suitable for an ethics seminar paper.
      *   **Constraint:** Do *not* evaluate specific theories (utilitarianism, Kantianism, etc.); just specify the target.

  2.  **Deconstruct the Concept of Supererogation:**
      *   *Core definition:* Acts that are good to do but not wrong to omit. "Above and beyond the call of duty."
      *   *Classic examples:* Soldier/grenade, kidney donation, saintly forgiveness, significant charity.
      *   *The Central Puzzle:* The "Betterness implies Ought" principle (If A is morally better than B, and I can do A, ought I do A?). Supererogation seems to violate this.

  3.  **Drafting the Desiderata (Categorization Strategy):**
      I need to organize these logically. Good categories would be:
      *   I. Extensional Adequacy (The Cases)
      *   II. Conceptual Distinctions (The Boundaries)
      *   III. Theoretical Coherence (The Puzzles)
      *   IV. Normative Implications (Praise/Blame)
      *   V. Classification of Constraints (Non-negotiable vs. Optional)
      *   VI. Tensions and Trade-offs

  4.  **Fleshing out specific points:**

      *   *Cases:* Soldier (sacrifice), Benefactor (costly aid), Forgiver (moral excellence). Need to ensure the theory covers *costly* acts, not just *nice* acts.
      *   *Distinctions:*
          *   Supererogatory vs. Obligatory (The bright line).
          *   Supererogatory vs. Permissible (It's not *just* allowed; it's *better*).
          *   Supererogatory vs. Imperfect Duty (Kantian distinction: wide vs. narrow, or specific vs. general).
          *   Supererogatory vs. Supererogatory Omission (Is omitting blameworthy? No).
      *   *Puzzles:*
          *   The Paradox of Supererogation (Betterness vs. Optionality).
          *   The Agent-Centric Prerogative (Why can I put my interests first?).
      *   *Praise/Blame:* Doing = Praiseworthy. Omitting = Not Blameworthy.

  5.  **Addressing the "Non-negotiable vs. Optional" Constraint:**
      *   *Non-negotiable:* Must capture the intuition that the act is optional yet valuable. Must avoid contradiction (ought implies can, etc.).
      *   *Optional:* Whether supererogation is grounded in utility, virtue, rights, or divine command. Whether it applies to non-human animals. Whether it requires significant sacrifice (some argue minor kindness counts, but the "heroic" cases are the core).

  6.  **Addressing the "Tensions" Constraint:**
      *   *The Big One:* The "Betterness" condition vs. the "Optionality" condition. If it's *morally better*, why isn't it required? (The Maximizing Problem).
      *   *Sacrifice vs. Benefit:* Does it require cost to the agent? If yes, does that make morality too demanding or too self-sacrificial?
      *   *Praise vs. Duty:* If we praise it too much, does it become expected (and thus duty)?

  7.  **Refining the Structure (Iterative Polish):**
      *   *Introduction:* Define the scope. Acknowledge the "Paradox of Supererogation" as the anchor.
      *   *Section 1: Extensional Adequacy (The Data).* List the paradigm cases.
      *   *Section 2: Conceptual Boundaries.* The deontic status.
      *   *Section 3: The Central Puzzle.* The "Ought Implies Best" challenge.
      *   *Section 4: Classification.* Hard constraints vs. Theoretical commitments.
      *   *Section 5: Tensions.* Explicitly highlight the friction points requested.
      *   *Conclusion:* Summary of the target.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish imperfect duty clearly? *Correction:* Yes, need to mention that imperfect duties allow latitude in *when/how*, whereas supererogation allows latitude in *whether*.
      *   *Check:* Did I address the "blameworthy to omit" point? *Correction:* Crucial. Supererogatory omissions must *not* be blameworthy.
      *   *Check:* Is the tone right? *Correction:* Keep it analytical, avoid advocating for a specific view. Use terms like "deontic status," "axiological ranking," "agent-centered prerogative."
      *   *Check:* Did I flag non-negotiables? *Correction:* I will use bolding or a specific subsection to mark "Hard Constraints" vs. "Theoretical Variables."

  9.  **Final Polish:** Ensure the distinction between *axiological* (goodness) and *deontic* (rightness/obligation) is clear, as this is the heart of the philosophical problem. (Self-correction: Make sure to explicitly mention the Urmson/Heyd lineage implicitly by using standard terminology).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a foundational task. Before evaluating specific accounts (e.g., utilitarian, Kantian, virtue-ethical, or dual-component views), one must specify the target phenomenon. A theory of supererogation is not merely a taxonomy of nice actions; it is an attempt to reconcile axiological value (goodness) with deontic status (obligation).

  Below is a rigorous specification of the desiderata for an adequate theory of supererogation, categorized by extensional adequacy, conceptual boundaries, theoretical coherence, and the classification of constraints.

  ---

  ### I. Extensional Adequacy: The Paradigm Cases
  An adequate theory must capture the pre-theoretical intuition regarding specific classes of actions. If a theory classifies these cases as obligatory or morally indifferent, it is extensionally inadequate.

  1.  **The Heroic Sacrifice:** (e.g., falling on the grenade).
      *   *Requirement:* The theory must classify this as morally excellent but not required. Omission must not constitute a moral violation.
  2.  **The Costly Beneficence:** (e.g., donating a kidney to a stranger, giving away most of one's income).
      *   *Requirement:* The theory must distinguish between *significant* aid (supererogatory) and *minimal* aid (potentially obligatory). It must explain why the cost to the agent licenses the optionality.
  3.  **The Saintly Attitude:** (e.g., forgiving an unrepentant wrongdoer, loving one's enemy).
      *   *Requirement:* The theory must account for supererogation that is internal/attitudinal, not merely behavioral.
  4.  **The Non-Emergency Good:** (e.g., spending a weekend volunteering vs. relaxing).
      *   *Requirement:* The theory must explain why ordinary morality permits self-interest in low-stakes contexts without labeling the agent selfish.

  ### II. Conceptual Boundaries: The Distinctions
  A theory must locate supererogation within the deontic landscape without collapsing it into neighboring categories.

  1.  **Supererogatory vs. Obligatory:**
      *   *Desideratum:* There must be a bright line where obligation ends and supererogation begins.
      *   *Constraint:* Performing a supererogatory act cannot generate a precedent that makes future similar acts obligatory (the "ratchet effect" problem).
  2.  **Supererogatory vs. Merely Permissible:**
      *   *Desideratum:* Supererogatory acts are not just *allowed*; they are *morally better* than the permissible alternative. A theory that renders them morally equivalent to neutrality fails.
  3.  **Supererogatory vs. Imperfect Duty:**
      *   *Desideratum:* This is a critical distinction (often Kantian).
          *   *Imperfect Duty:* You must adopt the maxim (e.g., help others), but have latitude in *when, how, and toward whom*.
          *   *Supererogation:* You have latitude on *whether* to adopt the maxim at all in a specific instance.
      *   *Constraint:* A theory must explain why saving a specific drowning child is often viewed as obligatory, while donating a kidney to a specific stranger is supererogatory, despite both falling under "beneficence."
  4.  **Supererogatory vs. Supererogatory Omission:**
      *   *Desideratum:* Doing the act is praiseworthy; omitting the act is **not blameworthy**.
      *   *Constraint:* The theory must block the inference from "It would be better if you did X" to "You are at fault for not doing X."

  ### III. Theoretical Coherence: The Puzzles
  The theory must resolve logical tensions inherent in the concept.

  1.  **The Paradox of Supererogation (The Central Puzzle):**
      *   *Formulation:*
          1.  If Act A is morally better than Act B, and an agent can perform A, the agent ought to perform A. (The "Betterness Implies Ought" Principle).
          2.  Supererogatory acts are morally better than their permissible alternatives.
          3.  Supererogatory acts are not obligatory.
      *   *Desideratum:* A theory must reject or modify premise (1) without abandoning the link between value and action entirely, or explain how an act can be "better" without triggering an "ought."
  2.  **The Agent-Centered Prerogative:**
      *   *Desideratum:* The theory must justify why an agent is permitted to give *some* weight to their own interests that exceeds the weight those interests have from an impartial moral perspective.
  3.  **The Praise/Blame Asymmetry:**
      *   *Desideratum:* The theory must explain the normative logic of reactive attitudes. Why does doing the act merit praise (not just credit), while omitting it merits no blame (not even diminished praise)?

  ---

  ### IV. Classification of Constraints
  Here we distinguish between what any theory of supererogation *must* do versus what depends on your broader meta-ethical or normative framework.

  #### A. Non-Negotiable (Hard Constraints)
  *These are constitutive of the concept. If a view violates these, it is not a theory of supererogation; it is a theory of something else (e.g., utilitarianism which denies supererogation exists).*

  1.  **Optionality:** The act must be freely choosable without moral sanction for omission.
  2.  **Axiological Surplus:** The act must possess positive moral value exceeding the baseline of duty.
  3.  **Non-Blameworthiness of Omission:** Failing to perform the act must not constitute a moral failure.
  4.  **Logical Consistency:** The account must not generate a contradiction between the deontic status (optional) and the axiological status (better).

  #### B. Optional Commitments (Framework-Dependent)
  *These vary depending on whether the theory is Consequentialist, Deontological, or Virtue-Ethical.*

  1.  **The Role of Sacrifice:**
      *   *Deontological/Virtue:* Often views significant cost/sacrifice to the agent as a necessary condition for supererogation.
      *   *Consequentialist:* May view cost as irrelevant; if the outcome is best, it's obligatory. (Thus, many consequentialists deny supererogation exists).
      *   *Status:* **Optional.** A theory *can* argue that low-cost acts are supererogatory, provided they meet the Optionality and Surplus constraints.
  2.  **The Ground of Value:**
      *   Whether the "goodness" of the act is derived from consequences, adherence to rational law, or expression of character.
      *   *Status:* **Optional.**
  3.  **The Scope of Agents:**
      *   Whether supererogation applies only to moral saints/heroes or to ordinary agents in everyday contexts.
      *   *Status:* **Optional.**
  4.  **Imperfect Duty Integration:**
      *   Whether the theory accepts the Kantian category of "imperfect duty" as distinct from supererogation, or collapses them.
      *   *Status:* **Optional** (though collapsing them risks extensional inadequacy regarding specific rescue cases).

  ---

  ### V. Tensions and Trade-Offs
  You requested specific identification of where desiderata pull against one another. These are the friction points where theories often break or require complex maneuvering.

  #### 1. The "Betterness" vs. "Optionality" Tension
  *   **The Conflict:** To satisfy *Axiological Surplus*, the act must be morally better than the alternative. To satisfy *Optionality/Non-Blameworthiness*, the act must not be required.
  *   **The Risk:** If you emphasize the "Betterness" too strongly, you slide into **Maximizing Consequentialism** (where the best act is obligatory). If you emphasize "Optionality" too strongly, you slide into **Moral Indifference** (where the act has no special moral weight).
  *   **Theoretical Cost:** Resolving this usually requires positing a discontinuity between value and obligation (e.g., satisficing, agent-centered prerogatives, or distinct deontic/axiological spheres).

  #### 2. The "Sacrifice" vs. "Value" Tension
  *   **The Conflict:** Many theories ground supererogation in the *cost* to the agent (the soldier loses their life). However, if the moral value of the act depends on the cost to the agent, does that imply morality *wants* agents to suffer?
  *   **The Risk:** If sacrifice is a necessary condition, the theory risks making morality **masochistic** or irrational (valuing the loss itself). If sacrifice is *not* necessary, it becomes hard to distinguish supererogation from simple duty (why isn't helping someone pick up dropped papers supererogatory?).
  *   **Theoretical Cost:** Theories must walk a line where cost licenses optionality without cost being the *source* of moral value.

  #### 3. The "Praise" vs. "Expectation" Tension (The Ratchet Problem)
  *   **The Conflict:** We praise supererogatory acts to encourage them. However, if we praise them consistently, they may become social expectations. Once they are expected, omission may become blameworthy.
  *   **The Risk:** A theory that successfully promotes supererogatory behavior may conceptually destroy the category of supererogation by converting it into duty over time.
  *   **Theoretical Cost:** The theory must explain why the deontic status of an act-type is stable despite changes in social expectation or frequency of performance.

  #### 4. The "Imperfect Duty" vs. "Supererogation" Tension
  *   **The Conflict:** Both categories involve latitude. If I have an imperfect duty to help, I can choose *not* to help this person today. If I have a supererogatory option to help, I can choose *not* to help this person today.
  *   **The Risk:** The distinction collapses. If the practical output is the same (I am not blameworthy for omitting), why posit two categories?
  *   **Theoretical Cost:** The theory must identify a structural difference (e.g., imperfect duty requires adopting a general maxim over a lifetime; supererogation requires no such commitment) to avoid redundancy.

  ### Summary Checklist for Your Paper
  When you evaluate specific theories (e.g., Heyd, Urmson, Portmore, supererogation-friendly utilitarianisms), test them against this matrix:

  1.  **Does it preserve the Optionality/Non-Blameworthiness link?** (Hard Constraint)
  2.  **Does it explain why the act is "better" without making it "owed"?** (Solves the Paradox)
  3.  **Does it distinguish the view from Imperfect Duty?** (Conceptual Clarity)
  4.  **Does it rely on Sacrifice as a necessary condition?** (If yes, check for the Masochism Objection).
  5.  **Does it accommodate the Heroic and the Everyday?** (Extensional Adequacy).

  Any theory that fails #1 or #2 is not a theory of supererogation; it is a revisionary theory that eliminates the concept. Any theory that fails #3 or #5 is extensionally or conceptually inadequate.
