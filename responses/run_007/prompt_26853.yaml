prompt: |-
  I'm trying to get clear on what the regress problem actually demands of a theory of epistemic justification before I commit to foundationalism, coherentism, or infinitism. Write me the desiderata: what any adequate solution to the regress problem has to deliver. I want the full list—which cases it must handle (perceptual beliefs, memory beliefs, inferential chains, basic logical knowledge, testimony, etc.), which distinctions it can't collapse (like the difference between having justification and being able to produce it on demand, or between propositional and doxastic justification), which structural features of reasoning it must respect, and any results from psychology or formal epistemology it can't contradict. For each desideratum, give the case or consideration that motivates it. Then flag which ones are non-negotiable and which are just the pet concerns of particular camps. Most importantly: tell me whether any subset of these desiderata is jointly unsatisfiable—that's the part I most want to see, because if the list itself forces a trade-off, that changes how I evaluate the three positions. Skip the scorecard, I'll do that meself. And please write in British English.
