          *   Rebuttal/Mitigation: The condition must ensure the student demonstrates *mastery* of the AI's output, not just receipt of it.
      *   **Conditions/Enforcement:**
          *   Need specific rules.
          *   1. Transcript requirement (already in proposal).
          *   2. Metacognitive reflection (student must explain *how* the AI changed their thinking).
          *   3. Prohibition on specific prompt types (e.g., "fix this argument" vs. "critique this argument").
          *   4. Pilot status (upper-division only, review after one semester).
      *   **Conclusion:** Reiterate the goal (integrity + pedagogy).

  4.  **Refining the Philosophical Nuance:**
      *   Avoid saying "AI is just a calculator." It's not.
      *   Avoid saying "AI destroys thought." It doesn't necessarily.
      *   Focus on *understanding*. Can you understand an argument if an AI generated the counter-point? Yes, if you can defend against it. No, if you just paste the defense.
      *   The distinction between a tutor and AI: A tutor is accountable to truth and pedagogy; an AI is accountable to pattern completion. The student must bridge that gap.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Recommend approval with conditions.
