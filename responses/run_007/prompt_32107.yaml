prompt: |-
  Hey, I'm taking this causal inference class this semester and we've been going deep on Simpson's paradox — you know, the thing where the direction of an effect flips when you aggregate across subgroups. My prof keeps saying it's everywhere and most people just don't check.

  So here's my situation: I also work part-time as a research assistant in my university's admissions office, and we do a ton of this kind of analysis — comparing admit rates across demographic groups, broken down by department, SAT band, applicant type, all that. My supervisor is great but she's not a stats person, she just wants the summary tables for the dean. And I've started getting this creeping paranoia that some of the stuff we've already published might have a Simpson's reversal buried in it and nobody caught it.

  I want you to write me a proper procedure for checking whether Simpson's paradox is messing with a dataset. Like, an actual checklist I can go through before I send any analysis upstairs. What questions do I ask, in what order? What do I compute? Where do I stop and say "this is fine" and where do I escalate? And crucially — where does the procedure stop being mechanical and start being a judgement call? Like, I know the difference between a confounder, a mediator, and a collider matters for this, but how do I actually operationalize that when I'm just staring at column names in a CSV?

  Then run the procedure on two made-up-but-realistic datasets. One where it catches a real reversal and one where the subgroups look sketchy but it's actually fine. And please be honest about what the procedure can't catch — like, cases where you just can't know without a causal graph, or where the sample sizes are too small to tell either way.

  I'm a third-year undergrad, I've done regression and basic probability, but I'm not a grad student, so the procedure has to be something I can actually execute in like 20 minutes on a CSV. Don't give me theory — give me something I can use.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year undergrad, taking causal inference, working as an RA in admissions. Knows regression/probability but needs practical tools, not heavy theory.
      *   **Problem:** Fear of Simpson's Paradox (SP) in published admissions data. Needs a actionable checklist/procedure to detect it quickly (20 mins) on a CSV.
      *   **Requirements:**
          1.  A step-by-step procedure/checklist (questions, computations, stop/escalate points).
          2.  Distinction between mechanical steps and judgment calls (confounder vs. mediator vs. collider).
          3.  Two realistic examples (one with SP, one without).
          4.  Honest limitations (what the procedure *can't* catch).
      *   **Tone:** Practical, direct, empathetic to the stress of RA work, authoritative but accessible.

  2.  **Deconstruct Simpson's Paradox (SP) in this Context:**
      *   SP occurs when an association reverses direction upon conditioning on a third variable.
      *   *Crucial Causal Point:* SP is only a "paradox" (i.e., a bias to be corrected) if the conditioning variable is a *confounder*. If it's a *mediator*, the aggregate is the total effect (fine). If it's a *collider*, conditioning creates bias (bad).
      *   *The User's Dilemma:* They have column names (e.g., "Department," "SAT," "Gender"), not a DAG (Directed Acyclic Graph). They need to map columns to causal roles heuristically.

  3.  **Drafting the Procedure (The "20-Minute SP Audit"):**
      *   *Goal:* Make it a flowchart style.
      *   *Step 1: Define the Question.* (Exposure -> Outcome).
      *   *Step 2: Identify Potential Splitters.* (What columns could break this down?).
      *   *Step 3: The Mechanical Check.* (Compare Aggregate vs. Stratified).
      *   *Step 4: The Causal Judgment.* (Is the splitter a Confounder, Mediator, or Collider?). This is the hardest part for an undergrad. I need to give heuristics based on time ordering and domain knowledge.
      *   *Step 5: Decision.* (Report Aggregate, Stratified, or Adjusted).

  4.  **Developing the "Judgment Call" Section:**
      *   How to tell Confounder vs. Mediator from a CSV?
      *   *Time:* Did the variable exist *before* the treatment/exposure?
      *   *Mechanism:* Does the treatment *cause* the variable?
      *   *Admissions Context:* Gender is pre-existing (Confounder candidate). Department choice might be influenced by Gender (Mediator/Confounder debate - classic Berkeley case). SAT is pre-existing (Confounder). Admission is Outcome.
      *   *Collider Warning:* Don't condition on outcomes or common effects (e.g., "Scholarship Status" if it depends on both Gender and Admission).

  5.  **Creating the Examples:**
      *   *Dataset A (The Trap - Real SP):* Admissions by Gender. Aggregate: Men favored. Stratified by Department: Women favored in both. (Classic Berkeley style).
      *   *Dataset B (The False Alarm - Mediator):* Admissions by Prep Course. Aggregate: Course helps. Stratified by Major: Course looks neutral/negative. Why? Because the course *leads* to applying to harder majors. Conditioning on Major blocks the path.
      *   *Wait, let's refine Dataset B.* If I condition on a mediator, I see the direct effect, not total. Is that SP? Technically, the reversal happens, but it's not a "bias" in the same way. The prompt asks for "subgroups look sketchy but it's actually fine."
      *   *Better Dataset B:* Admissions by High School Type (Public vs. Private). Aggregate: Private better. Stratified by SAT band: Same or Private still better. No reversal. Or, Stratified by Department: Reversal happens, but Department is a *mediator* (Private school students apply to easier depts). If the Dean wants "Total Effect," aggregate is right. If Dean wants "Fairness," stratified is right.
      *   *Let's stick to the prompt:* One where it catches a reversal (SP), one where subgroups look sketchy (reversal exists mathematically) but it's *fine* (causally justified).
      *   *Dataset 1 (Bad SP):* Gender -> Admission. Dept is Confounder (different application rates + different admit rates).
      *   *Dataset 2 (Okay Reversal/Mediator):* Treatment (Tutoring) -> Outcome (Pass). Subgroup (Major). If Tutoring causes students to pick harder majors, conditioning on Major hides the benefit. The reversal is real mathematically, but the aggregate tells the truth about the *total* effect.

  6.  **Addressing Limitations:**
      *   Small sample sizes (noise looks like reversal).
      *   Unmeasured confounding (the "unknown unknowns").
      *   The "Table 2 Fallacy" (adjusting for everything).
      *   Causal structure ambiguity (Dept as confounder vs. mediator is famously hard in admissions).

  7.  **Refining the Tone:**
      *   Avoid jargon where possible, or define it instantly.
      *   Acknowledge the anxiety ("creeping paranoia" is real).
      *   Emphasize that SP is a *causal* problem, not a *statistical* one. The math isn't wrong; the interpretation is.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Emphasize using pivot tables or simple `groupby`. Don't suggest running causal DAG software.
      *   *Critique:* Is the Confounder/Mediator distinction too hard?
      *   *Fix:* Give specific "Ask Yourself" questions based on time ordering. "Did this exist before the applicant hit submit?"
      *   *Critique:* Make sure the examples are clearly calculable.
      *   *Fix:* Use small numbers (counts) so the user can verify the math mentally.

  9.  **Final Polish:**
      *   Structure with clear headings.
      *   Bold key actions.
      *   Ensure the "Limitations" section is honest about the "Berkeley Admissions" ambiguity (Dept choice is endogenous).

  *(Self-Correction on Dataset 2)*: I need to be careful. If there is a reversal, it *is* Simpson's Paradox mathematically. The distinction is whether you *care*. If the stratification variable is a mediator, the aggregate is the Total Effect (usually what policymakers want). The stratified is the Direct Effect. If the aggregate says +10% and stratified says -5%, that's a reversal. Is it "fine"? Yes, if you want Total Effect. I will frame it as "The Reversal is Real, But The Aggregate is Right."

  Let's write it.cw
answer: |-
  This is a very common anxiety for RAs, especially in admissions. The good news is that Simpson's Paradox (SP) is mathematically simple to detect but causally tricky to interpret. You can absolutely build a 20-minute audit procedure for this.

  The core insight you need to operationalize is this: **Simpson's Paradox is not a statistical error; it is a causal interpretation error.** The math isn't lying to you; *you* are asking the math the wrong question.

  Here is your **20-Minute Simpson's Audit Procedure**.

  ---

  ### Part 1: The Procedure (Checklist)

  **Prerequisites:** Open your CSV. Identify your **Treatment** (e.g., Gender, Legacy Status, Prep Course) and your **Outcome** (e.g., Admitted Yes/No).

  #### Step 1: The Mechanical Check (5 Minutes)
  *Goal: Determine if a mathematical reversal exists.*

  1.  **Compute the Aggregate Effect:** Calculate the outcome rate (e.g., admit rate) for Treatment Group A vs. Treatment Group B for the *whole dataset*. Note the direction (e.g., A > B).
  2.  **Identify Suspect Variables:** Look at your column headers. Pick any categorical variable that splits the population into meaningful subgroups (e.g., Department, SAT Band, State of Residence).
  3.  **Compute Stratified Effects:** For *each* subgroup of that variable, calculate the outcome rate for Treatment A vs. B again.
  4.  **Compare:**
      *   **No Reversal:** If the direction (A > B) stays the same in all subgroups, **STOP.** You are safe from SP on this variable. Report the aggregate, maybe mention subgroups for detail.
      *   **Reversal Detected:** If the direction flips (e.g., Aggregate says A > B, but within every subgroup B > A), **PROCEED TO STEP 2.**

  #### Step 2: The Causal Triage (10 Minutes)
  *Goal: Determine if the reversal is a "bias" (bad) or a "mechanism" (fine).*

  You have found a reversal. Now you must decide if the variable you split by is a **Confounder**, a **Mediator**, or a **Collider**. You cannot do this with code. You must use domain knowledge and time-ordering.

  **Ask these three questions about the Splitting Variable:**

  1.  **Time Order:** Did this variable exist *before* the Treatment was determined?
      *   *Yes:* Likely a Confounder (e.g., SAT score exists before Gender).
      *   *No:* Likely a Mediator (e.g., "Department Applied To" happens after/during the application process influenced by Gender).
  2.  **Causal Path:** Does the Treatment *cause* the Splitting Variable?
      *   *Yes:* It is a **Mediator**. (e.g., Taking a Prep Course causes you to apply to harder Majors).
      *   *No:* It is likely a **Confounder**. (e.g., Gender does not cause your State of Residence).
  3.  **Common Effect:** Is the Splitting Variable caused by *both* the Treatment and the Outcome (or unmeasured factors leading to the Outcome)?
      *   *Yes:* It is a **Collider**. (e.g., "Scholarship Interview" might depend on both Gender and High Grades). **DO NOT CONDITION ON THIS.**

  **The Decision Matrix:**

  | Variable Type | What is happening? | What do you report to the Dean? |
  | :--- | :--- | :--- |
  | **Confounder** | The subgroups are unbalanced (e.g., Women apply to harder depts). The aggregate is biased. | **Report the Stratified/Adjusted numbers.** The aggregate is lying. |
  | **Mediator** | The treatment works *through* this variable (e.g., Prep course helps you get into better depts). | **Report the Aggregate numbers.** The stratified numbers hide the total benefit. |
  | **Collider** | You opened a backdoor path by selecting on a common effect. | **Report the Aggregate numbers.** The stratified numbers are artificially biased. |

  #### Step 3: The Sanity Check (5 Minutes)
  *Goal: Ensure you aren't chasing noise.*

  1.  **Check Sample Sizes:** Look at the subgroup counts. If any subgroup has $N < 20$, the reversal might be random noise. Flag this as "Unreliable due to small N."
  2.  **Check Magnitude:** Is the reversal massive (e.g., +20% to -20%) or tiny (+1% to -0.5%)? Tiny reversals in large data are statistically significant but practically meaningless.
  3.  **Escalation Point:** If you identify a **Confounder** with a **Large Reversal** in a **Large Sample**, you must escalate to your supervisor. Say: *"I found a confounding variable that reverses the conclusion. We need to adjust for this before publishing."*

  ---

  ### Part 2: Where the Procedure Breaks (Judgment Calls)

  You asked where the mechanics stop and judgment begins. It happens in **Step 2**.

  **The "Department" Problem (Confounder vs. Mediator)**
  In admissions, "Department" is the hardest variable.
  *   *Argument for Confounder:* Departments have different funding and standards (causing Admit Rate). Different genders apply to different departments (causing Gender association).
  *   *Argument for Mediator:* Gender socialization influences which Department a student *chooses* to apply to.
  *   *The Judgment:* If the Dean asks "Is there bias in our process?", treat Department as a **Confounder** (adjust for it). If the Dean asks "Does being a woman hurt your chances overall?", treat Department as a **Mediator** (report aggregate). **You must ask the stakeholder what question they are actually asking.**

  **The "Unmeasured" Problem**
  This procedure only checks variables *in your CSV*. If the real confounder is "Parental Income" and you don't have that column, you will pass the audit but still be wrong. You must explicitly state: *"This analysis is conditional on observed variables only."*

  ---

  ### Part 3: Running the Procedure on Two Datasets

  Let's run this on two made-up admissions datasets.

  #### Dataset A: The "Real Bias" (Confounder)
  **Question:** Is there gender bias in admissions?
  **Columns:** `Gender`, `Department` (Engineering vs. Humanities), `Admitted` (0/1).

  **1. Mechanical Check:**
  *   **Aggregate:**
      *   Men: 1000 applied, 400 admitted (40%)
      *   Women: 1000 applied, 300 admitted (30%)
      *   *Conclusion:* Men favored by 10%.
  *   **Stratified by Department:**
      *   **Engineering:**
          *   Men: 900 applied, 360 admitted (40%)
          *   Women: 100 applied, 45 admitted (45%)
          *   *Women favored.*
      *   **Humanities:**
          *   Men: 100 applied, 40 admitted (40%)
          *   Women: 900 applied, 255 admitted (28.3%) -> *Wait, let's fix the math for a clean reversal.*
          *   *Correction for clean SP:*
          *   **Engineering (Hard to get into):** Men 100/1000 (10%), Women 10/100 (10%). (Equal)
          *   **Humanities (Easy to get into):** Men 90/100 (90%), Women 810/900 (90%). (Equal)
          *   *Let's try the classic Berkeley numbers:*
          *   **Aggregate:** Men 44%, Women 35%. (Men look better).
          *   **Dept A (High Admit):** Men 60%, Women 65%. (Women better).
          *   **Dept B (Low Admit):** Men 20%, Women 25%. (Women better).
  *   **Result:** Reversal Detected. Aggregate says Men win; Subgroups say Women win.

  **2. Causal Triage:**
  *   **Variable:** Department.
  *   **Time Order:** Applicants choose Dept *before* Admission decision, but *after* Gender is set.
  *   **Causal Path:** Does Gender cause Dept Choice? Yes (social pressure). Does Dept cause Admission? Yes (different rates).
  *   **Judgment:** This is the classic "Berkeley" case. If we want to know if the *university* discriminates, Dept is a **Confounder** (different depts have different resources). If women are being funneled into harder depts, that's a societal issue, but the admission office itself is treating women better *within* each dept.
  *   **Decision:** **ESCALATE.** The aggregate number (44% vs 35%) is misleading regarding departmental fairness. Report the stratified rates.

  #### Dataset B: The "False Alarm" (Mediator)
  **Question:** Does the "Summer Prep Program" help students get admitted?
  **Columns:** `Prep_Program` (Yes/No), `Major_Choice` (STEM vs. Arts), `Admitted`.

  **1. Mechanical Check:**
  *   **Aggregate:**
      *   Prep Yes: 50% Admit Rate.
      *   Prep No: 30% Admit Rate.
      *   *Conclusion:* Prep helps (+20%).
  *   **Stratified by Major_Choice:**
      *   **STEM (Harder):**
          *   Prep Yes: 20% Admit.
          *   Prep No: 25% Admit.
          *   *Prep looks worse.*
      *   **Arts (Easier):**
          *   Prep Yes: 60% Admit.
          *   Prep No: 65% Admit.
          *   *Prep looks worse.*
  *   **Result:** Reversal Detected. Aggregate says Prep helps; Subgroups say Prep hurts.

  **2. Causal Triage:**
  *   **Variable:** Major_Choice.
  *   **Time Order:** Students take Prep Program -> *Then* they feel confident enough to apply to STEM.
  *   **Causal Path:** Does Prep cause Major Choice? **Yes.** The program encourages STEM applications.
  *   **Judgment:** Major Choice is a **Mediator**. The Prep Program works *by* giving students the confidence to apply to harder majors. When you split by Major, you block the path of the benefit. You are comparing Prep-STEM students to No-Prep-STEM students, but the No-Prep-STEM students are the "superstars" who applied to STEM without help.
  *   **Decision:** **DO NOT ESCALATE.** The Aggregate is correct for the question "Does the program work?" The reversal is real mathematically, but conditioning on the mediator hides the total effect. Report the Aggregate.

  ---

  ### Part 4: Honest Limitations (What This Won't Catch)

  1.  **The "Table 2 Fallacy":** Just because you adjust for a confounder doesn't mean you're safe. If you adjust for *everything* in the CSV (including mediators and colliders), you will bias your results more than if you did nothing. This procedure forces you to pick *one* splitting variable at a time.
  2.  **Continuous Variables:** SP is easiest to see with categories. If your confounder is continuous (e.g., SAT score), you have to bin it (e.g., 1200-1400). Different bins can show different results. This procedure requires you to discretize, which loses info.
  3.  **Unmeasured Confounding:** As mentioned, if the real driver is "Alumni Connection" and you don't have that column, no amount of stratifying by Department will save you.
  4.  **Small Cell Counts:** In Dataset A, if only 2 women applied to Engineering, a single admission flips the rate from 0% to 50%. The procedure's "Sanity Check" helps, but Bayesian methods are better for this (out of scope for 20 mins).

  ### Summary for your Supervisor
  When you go to your supervisor, don't say "I found Simpson's Paradox." Say:
  *"I checked if [Variable X] was distorting the admit rates. It turns out [Variable X] is a [Confounder/Mediator]. If we look at the total numbers, it looks like [Conclusion A], but that's because [Group 1] applies to harder departments. I recommend we report the [Stratified/Aggregate] numbers to avoid misleading the Dean."*

  That shows you understand the *causal* implication, not just the math.
