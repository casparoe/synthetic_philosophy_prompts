answer: |-
  You have put your finger on one of the most persistent and uncomfortable tensions in contemporary analytic metaphysics. You are right to feel that the "sunrise" analogy is insufficient. When an astronomer says "the sun sets," they are describing a *phenomenal truth* (how the world appears to observers on Earth) that is consistent with the *theoretical truth* (heliocentrism). When a mereological nihilist asks for the peanuts, they are uttering a *theoretical falsehood* (according to their own ontology) for the sake of convenience.

  There is no single, canonical noun in the philosophical lexicon that captures this exact behavioral phenomenon—the lived disconnect between an eliminative ontology and ordinary practice—quite the way "photosynthesis" captures a biological process. However, there is a cluster of terms and concepts that map the territory you are describing. Depending on whether you ask the nihilist, their critic, or a psychologist, you will get different labels.

  Here is a breakdown of the existing terminology, the philosophical distinctions, and a proposal for how to label the boundary you are investigating.

  ### 1. The Technical Labels: *Quasi-Realism* and *Revolutionary Fictionalism*

  While you rightly set aside "fictionalism" as a broad position, the specific *configuration* you are observing is often analyzed through the lens of **Quasi-Realism** or **Revolutionary Fictionalism**.

  *   **Revolutionary Fictionalism:** This distinction (championed by philosophers like Mark Kalderon and Gideon Rosen) separates those who think ordinary people *already* speak fictionally about objects (Hermeneutic Fictionalism) from those who think we *ought* to speak fictionally because the literal truth is too sparse (Revolutionary Fictionalism). Your nihilists are Revolutionary Fictionalists. The "gap" you see is the lag between their revolutionary theoretical conclusion and their unrevolutionized daily habits.
  *   **Quasi-Realism:** Coined by Simon Blackburn (originally for ethics), this describes the project of "earning the right" to talk *as if* certain things exist (values, or in this case, tables) even if your meta-ontology says they don't. A quasi-realist tries to explain why "There is a table" functions *like* a truth claim in conversation, despite lacking truth-makers in the fundamental fabric of reality. If the nihilist cannot explain *how* they earn that right, the gap remains a mere inconsistency.

  ### 2. The Psychological Mechanism: *The Participant Stance*

  If you want to understand why the gap feels so natural to the philosophers, the best label comes from P.F. Strawson. In his famous essay *Freedom and Resentment*, Strawson distinguished between:
  *   **The Objective Stance:** Viewing agents (or objects) as things to be managed, predicted, or analyzed causally.
  *   **The Participant Stance:** Engaging with agents (or objects) as entities to be reasoned with, used, or reacted to.

  Strawson argued that even if determinism is true (the Objective view), we cannot permanently inhabit the Objective stance in human relationships without a kind of psychological collapse. We are hardwired for the Participant stance.
  Your nihilists are effectively arguing that **mereological engagement is a Participant Stance.** They cannot help but navigate the world as if tables exist, even if their "Objective" metaphysics denies them. Some critics call this **"Ontological Compartmentalization,"** but Strawson's framework suggests it might be a feature of human cognition, not just a philosophical bug.

  ### 3. The Critic's Label: *Idle Ontology* or *Ontological Schizophrenia*

  Philosophers who find this gap unacceptable (such as Amie Thomasson or Eli Hirsch) tend to use more pejorative or diagnostic terms.
  *   **Ontological Idleness:** This is the charge that if an ontological theory (nihilism) makes no difference to practice, prediction, or explanation compared to the common-sense view (realism), then the ontology is "idle." It spins its wheels without gripping the road.
  *   **Ontological Schizophrenia:** This is sometimes used informally (and critically) to describe the state of holding two incompatible registers of discourse without a bridge. It implies a fracture in the philosopher's worldview that they refuse to heal by either changing their theory or changing their life.

  ### 4. Distinguishing the Gap from "Harmless Shorthand"

  You asked how to distinguish this from the astronomer's "sunset." The distinction lies in **explanatory dependence.**

  *   **The Astronomer:** The statement "The sun sets" is *derived* from the real model. It is a description of the rotation of the Earth relative to the observer. The shorthand is *parasitic on the truth.*
  *   **The Nihilist:** The statement "Pass the peanuts" is *contradicted* by the real model. The real model (simples arranged peanut-wise) does not explain why we say "peanuts"; rather, the utility of saying "peanuts" explains why we ignore the real model. The shorthand is *parasitic on the falsehood.*

  This is why the gap bugs you. In the astronomical case, the shorthand points toward the truth. In the nihilist case, the shorthand points away from it.

  ### 5. Where is the Boundary? (When does it become a problem?)

  You asked at what point this division of labor becomes a problem rather than a sensible strategy. In the literature, this boundary is usually drawn at **Explanatory Power.**

  *   **Sensible Division of Labor:** If the "simples" model explains *why* the table supports the beer (structural integrity of simples) better than the "table" model (which just posits a brute fact), then the metaphysics is doing work. The ordinary language is just a UI (User Interface) for a complex backend.
  *   **Problematic Gap:** If the "simples" model predicts exactly the same outcomes as the "table" model in every conceivable scenario (including physics, perception, and causation), then the nihilism is **verificationally empty.**

  The boundary is crossed when the metaphysician claims their view is *truer* but admits it is not *more useful* or *more predictive.* At that point, critics argue the metaphysics has become a purely aesthetic preference, indistinguishable from a religious dogma that claims to describe the world but refuses to interact with it.

  ### 6. A Proposal: *Ontological Bilingualism*

  Since there is no single perfect term, if you are looking for a label for your piece that captures the phenomenon without immediately resorting to "hypocrisy" or "fictionalism," I suggest **"Ontological Bilingualism."**

  This term captures:
  1.  **Fluency:** The philosophers are fluent in both "Ordinary" and "Fundamental" languages.
  2.  **Code-Switching:** They switch contexts (seminar vs. pub) without conscious effort.
  3.  **Incommensurability:** The two languages do not translate perfectly (one denies the existence of the other's nouns).

  It avoids the pejorative sting of "schizophrenia" while acknowledging the structural duality. It allows you to ask the crucial question: *Is this bilingualism a sign of sophistication (knowing when to use which map), or is it a sign that the "Fundamental" language is actually a dead language that no one truly speaks?*

  ### Summary for your Reporting

  *   **The Phenomenon:** The retention of ordinary discourse despite eliminative ontology.
  *   **Closest Technical Term:** **Quasi-Realism** (earning the right to the discourse) or **Revolutionary Fictionalism** (the stance that creates the gap).
  *   **The Psychological Mechanism:** **The Participant Stance** (Strawson).
  *   **The Critical Term:** **Ontological Idleness** (the claim that the theory does no work).
  *   **Suggested Descriptive Label:** **Ontological Bilingualism.**
  *   **The Boundary:** The gap becomes problematic when the "true" ontology fails to provide **explanatory leverage** over the "false" ordinary view.

  Your intuition is shared by many metaphysicians (notably the "Easy Ontology" camp). They argue that if your metaphysics requires you to hold your breath every time you leave the seminar room, it is likely your metaphysics that needs adjusting, not your language.
