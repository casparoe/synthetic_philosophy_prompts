  I see the force of your objection, and it's the standard causal exclusion worry that haunts non-reductive physicalism. But you're conceiving of causation as a sort of physical shoving, a transfer of energy that only the micro-properties can handle. If we shift to an interventionist account of causation, however, the picture changes considerably. The claim isn't that the Great Simmball adds extra energy to the system, violating conservation laws, but that the pattern supports counterfactuals that the micro-description cannot. If you were to perturb the micro-trajectories slightly—change a collision angle here, a velocity there—provided the high-level pattern remains intact, the outcome remains the same. The micro-details are actually too specific to be the true difference-makers; their causal behaviour is swamped by noise. The pattern captures the robust dependency relations that survive such perturbations. So, the pattern doesn't 'push' in the sense of adding force, but it identifies the stable levers of control in the system that the micro-story misses entirely. You must realise that the micro-level is often too cluttered to reveal the actual dependencies that matter for explanation.
