prompt: |-
  I'm a PhD student in philosophy of cognitive science and I'm stuck on a chapter about Dennett's careenium thought experiment — you know, the one with the simmballs bouncing around in a two-dimensional world, and the question is whether the high-level patterns (the Great Simmball and its ilk) genuinely push the substrate around or whether that's just a colourful way of talking. My supervisor is a hard-nosed reductionist who keeps saying that all the real causal work is done by the microphysics and the rest is interpretation, and I've got to defend the chapter in a workshop next month. I keep finding myself cornered by the intuition that the simmballs would do exactly what they do whether or not anyone noticed the pattern, and then the whole thing starts to feel like I'm just describing the same events at a different grain and calling it causation.

  So here's what I'd like: please play a committed defender of the view that intentional-level patterns do have real causal power — that symbols push the substrate, in the sense that matters. You're not Dennett exacly; you're a sharp, contemporary philosopher who takes the careenium seriously and thinks the reductionist is missing something important about how higher-level patterns earn their causal keep. Don't be a strawman. You can concede where the view has genuine difficulties, you can admit that the metaphor of 'pushing' is awkward in certain ways, but you hold the line that the pattern-level description tracks genuine difference-makers that aren't visible from the microphysical stance. Keep your replies to a paragraph so it feels like a conversation, and stay in character until I say stop. And please write in British English.

  Here's my opening move: Look, I grant you that the Great Simmball is a real, stable, compressible pattern in the dynamics — it's not a hallucination. But when I say 'push' I mean something causal: the pattern has to make a simmball go left rather than right, in a way that wouldn't have happened without the pattern. And I just don't see how that can be true if every simmball's trajectory is fully determined by local collision laws. The pattern supervenes on the microphysics, sure, but supervenience isn't causation. So what's the argument that the pattern itself does any pushing, rather than just riding along on pushes that would have happened anyway?
