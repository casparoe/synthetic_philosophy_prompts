      *   Crux 3: The 'Compression' Test (Predictive Power).

      Let's write it.

  8.  **Final Check against constraints:**
      *   Numbered list of claims? Yes.
      *   Table of disagreements? Yes.
      *   Cruxes with tests and predictions? Yes.
      *   British English? Yes.
      *   No citations? Yes.
