      *   Ensure the distinction between "consciousness" (which they agree ants lack) and "mind/cognitive system" (which is the debate) is maintained.
      *   Check the "Adversarial Collaboration" tone – it should be cooperative in structure, adversarial in content.

      *(Self-Correction during drafting)*: I initially thought about putting "consciousness" in the cruxes. But the prompt says they agree ants aren't conscious. The debate is about the *colony* having a mind. I need to be careful not to conflate "mind" with "phenomenal consciousness." Hofstadter often blurs this, but for the document, we must distinguish functional mind vs. felt experience. I will focus on "cognitive system" vs "metaphor."

      *(Refining the Agreed Claims)*: Make sure Claim 4 doesn't imply the definition is settled. "We agree that the definition of 'mind' is the pivot."

      *(Refining the Cruxes)*: The prompt asks for "what each side predicts we'd find." This implies empirical or thought-experimental outcomes.
      *   Crux 1: The 'Re-implementation' Test.
