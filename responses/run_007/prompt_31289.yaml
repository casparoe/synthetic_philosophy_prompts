          *   Therefore, $\sum V_{\text{sim}} \leq V_{\text{base}}$.
          *   If $P(\text{Baseline})$ drops, and the total value pool is fixed by Base Reality, our *share* of influence drops.
          *   Actually, simpler: If we are in a sim, we are not in the place where the *maximum possible value* is generated. We are in a subset.
