prompt: |-
  Please make the strongest case you can that the simulation argument should substantially dampen fanaticism about the far future. Don't just gesture at sims maybe getting turned off; work through the actual trilemma, and deal with the obvious worry that if simulated minds vastly outnumber baseline minds then the expected value of the far future might go up rather than down. I want you to be explicit about which term in the fanatic's expected-value calculation the argument is supposed to move, and why the net effect is damping rather than amplification.
