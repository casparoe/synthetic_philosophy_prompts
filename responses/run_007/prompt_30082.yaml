prompt: |-
  I teach an upper-level ethics seminar and I'm putting together the final exam. I want one essay question on prioritarianism and the leveling-down objection. My students have already seen the standard equality-vs-priority distinction (the Parfit-style one) and the usual story about why prioritarianism is supposed to dodge the leveling-down objection, so the question has to push them past the canned summary. I want it to make them confront which exact formal feature of the prioritarian value function does the anti-leveling-down work, and whether that same feature means prioritarianism buys its immunity by giving up the very thing the egalitarian was after.

  Please act as a professional philosopher who works in distributive ethics and draft the following: the exam question itself, a model answer of about 600 words, and a marking scheme out of 20 marks that seperates an A from a B answer by naming the specific moves each must contain and the mistakes that should cost marks. Start by brainstorming the key moves a top answer should hit, then write the final versions. They'll have about 45 minutes for it in the exam. The question should also make students consider whether a telic egalitarian (someone who thinks equality is valuable for its own sake) could accept the leveling-down intuition without accepting the objection's conclusion, and where the objection stops having force. The model answer should be written so a student who had memorized the labels but not understood the structure couldn't of produced it.

  At the end, add a short note saying how confident you are in the model answer and which point in it you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in distributive ethics.
      *   **Task:** Create an exam question, a model answer (~600 words), and a marking scheme (out of 20 marks) for an upper-level ethics seminar.
      *   **Topic:** Prioritarianism vs. the Leveling-Down Objection (LDO).
      *   **Specific Constraints:**
          *   Must go beyond the "canned summary" (i.e., "Prioritarianism cares about the worse off, not equality, so it avoids LDO").
          *   Must force students to identify the *exact formal feature* of the prioritarian value function that avoids LDO.
          *   Must ask whether this feature sacrifices the egalitarian's core insight.
          *   Must ask about the Telic Egalitarian's potential response (accepting the intuition but rejecting the conclusion).
          *   Model answer must be structurally rigorous (not just label-dropping).
          *   Marking scheme must distinguish A vs. B based on specific philosophical moves.
          *   Include a confidence note at the end.
      *   **Time Limit:** Students have ~45 minutes.

  2.  **Brainstorming Key Moves for a Top Answer:**
      *   *The LDO:* Leveling down makes some worse off and no one better off to achieve equality. Intuitively bad. Telic egalitarianism seems to say it's *pro tanto* good (because equality increases), which is absurd.
      *   *Prioritarianism's Escape:* Prioritarianism uses a concave transformation function (e.g., square root or log) applied to well-being *before* summing. It gives weight to benefits based on absolute level, not relative standing.
      *   *The Formal Feature:* Monotonicity. Prioritarianism is strictly monotonic with respect to individual well-being. If someone's well-being decreases and no one else's increases, total priority-weighted value *must* decrease. Leveling down always reduces total value.
      *   *The Trade-off:* Does this sacrifice the egalitarian insight? Yes, in a sense. It abandons the *relational* aspect of justice. It cares about the absolute level of the worse off, not the gap. It collapses into a form of weighted utilitarianism.
      *   *Telic Egalitarian's Defense:* Can they accept LDO intuition but reject the conclusion? Yes, by arguing LDO is all-things-bad because the badness of wasting well-being outweighs the goodness of equality. Or, they can argue the "Repugnant Conclusion" of Prioritarianism (ignoring gaps when everyone is well off) is worse.
      *   *Where LDO stops having force:* When equality is instrumental, or when the "complaint" model is used (people have a complaint against inequality, not a value in equality itself).

  3.  **Drafting the Exam Question:**
      *   Needs to be precise.
      *   Needs to demand the "formal feature."
      *   Needs to demand the "trade-off" analysis.
      *   Needs to demand the "Telic Egalitarian" nuance.
      *   *Draft:* "Prioritarianism is often said to avoid the Leveling-Down Objection. Explain exactly how the mathematical structure of the prioritarian value function achieves this. Does this structural feature mean prioritarianism abandons the core egalitarian concern? Finally, discuss whether a Telic Egalitarian can accept the intuition behind the Leveling-Down Objection without conceding the argument to the Prioritarian."

  4.  **Drafting the Model Answer:**
