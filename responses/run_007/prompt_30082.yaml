          4.  Analyze the trade-off (Abandoning relational equality for absolute weighted welfare).
          5.  TE's potential counter-move (Pluralism/Thresholds).
      *   *Tone:* Academic, precise, no fluff.
      *   *Key Distinction:* Ensure the difference between *relative* (egalitarian) and *absolute* (prioritarian) weighting is clear.

  5.  **Drafting the Marking Scheme:**
      *   Total: 20 marks.
      *   Breakdown:
          *   Explanation of LDO & TE vulnerability (4 marks).
          *   Identification of Formal Feature (Monotonicity/Concavity) (6 marks).
          *   Analysis of the Trade-off (Relational vs. Absolute) (6 marks).
          *   TE's Counter-argument/Nuance (4 marks).
      *   *A vs. B distinction:* B answers state "Prioritarianism cares about the worse off." A answers state "Prioritarianism is monotonic because it transforms absolute levels, not relations." B answers say "Egalitarians are wrong." A answers discuss whether the "egalitarian insight" survives the translation to priority.

  6.  **Refining and Polishing:**
