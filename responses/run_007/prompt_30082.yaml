      *(Self-Correction during drafting)*: I need to make sure I don't confuse "concavity" with "monotonicity." Concavity gives the weight to the worse off; monotonicity ensures leveling down is bad. Both are needed for the full picture, but monotonicity is the specific blocker of LDO. I will emphasize monotonicity as the direct blocker, grounded in the absolute (non-relational) nature of the function.

