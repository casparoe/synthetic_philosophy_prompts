      *   Another tension: *Partial Closure* vs. *Non-Permissiveness*. If you allow MP, why not MP + MP + MP...? Where do you draw the line without being arbitrary?
      *   Let's focus on the tension between **Probabilistic Coherence over Equivalents** and **Non-Omniscience/Learning**. If $A$ and $B$ are equivalent but the agent doesn't know it, forcing $P(A)=P(B)$ implies omniscience about that equivalence. But allowing $P(A) \neq P(B)$ opens the door to Dutch Books.

  6.  **Finalizing the Desiderata List:**
      1.  **The Distinction Desideratum** (Non-negotiable).
