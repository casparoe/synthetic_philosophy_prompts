      *   **Task:** Write the *desiderata* (requirements/goals) for a theory of beliefs/credences of a logically bounded agent.
      *   **Specific Instructions:**
          *   For each requirement, provide the motivating case/consideration.
          *   Mark requirements as "Non-negotiable" (constraints on *any* adequate theory) vs. "Program Commitments" (specific to certain research agendas).
          *   Address specific topics:
              *   Distinguishing failure to infer vs. believing negation.
              *   Preserving modest closure (e.g., Modus Ponens) without full classical closure.
              *   Learning/updating on logical truths/entailments.
              *   Survival of probabilism (equivalence, tautologies).
              *   Avoiding excessive permissiveness (any incoherence counts as rational).
          *   Identify incompatibilities if a subset of requirements cannot be jointly satisfied.

  2.  **Initial Brainstorming & Categorization:**
      *   *The Core Problem:* Standard models say if $A \vdash B$, and I believe $A$, I believe $B$. Also, if $T$ is a tautology, $P(T) = 1$. Real humans fail this.
      *   *Desideratum 1: Non-Omniscience.* Agents shouldn't believe all tautologies. (Motivation: Finite minds).
      *   *Desideratum 2: Distinction.* Not inferring $B$ from $A$ isn't the same as believing $\neg B$. (Motivation: Agnosticism vs. Denial).
      *   *Desideratum 3: Partial Closure.* We do know *some* logic (e.g., $A \land B \to A$). (Motivation: Competence).
      *   *Desideratum 4: Learning.* We can learn math/logic. (Motivation: Education/Discovery).
      *   *Desideratum 5: Probabilistic Coherence.* Do $P(A)$ and $P(B)$ need to match if $A \equiv B$? (Motivation: Dutch Books vs. Boundedness).
      *   *Desideratum 6: Normativity.* We don't want to say *everything* is rational. (Motivation: Normative force).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Distinction Requirement.*
          *   *Content:* Must distinguish between $\neg B$ and $\text{not believing } B$ given $A$.
          *   *Motivation:* If I believe $P$ and $P \to Q$, but haven't thought of $Q$, I don't believe $\neg Q$. I'm just silent on $Q$.
          *   *Status:* Non-negotiable. If a theory conflates these, it fails to model belief.

      *   *Requirement 2: The Partial Closure Requirement.*
          *   *Content:* Allow some inferences (trivial ones) without forcing all.
          *   *Motivation:* Humans aren't *illogical*, just bounded. We know $A \land B \implies A$.
          *   *Status:* Non-negotiable (mostly). A theory that allows *no* closure makes reasoning impossible.

      *   *Requirement 3: The Learning Requirement.*
          *   *Content:* Agents can update on logical information.
