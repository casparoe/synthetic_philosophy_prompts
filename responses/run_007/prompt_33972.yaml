          *   *Status:* Non-negotiable.

      *   *Requirement 4: The Probabilistic Coherence Requirement (The Tricky One).*
          *   *Content:* How much of Kolmogorov's axioms hold?
          *   *Motivation:* Dutch Book arguments suggest coherence. But logical omniscience is a coherence constraint.
          *   *Status:* *Program Commitment.* Strict Bayesianism wants $P(A)=P(B)$ if $A \equiv B$. Bounded models might reject this. I need to flag this tension.

      *   *Requirement 5: The Normative Constraint (Non-Permissiveness).*
          *   *Content:* Not all belief sets are rational.
