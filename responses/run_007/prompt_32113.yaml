prompt: |-
  I want to practice arguing against the moral luck thesis. Please play a committed defender of the view that moral luck is a genuine and deep problem for the coherence of ordinary moral judgment — not a confusion, not a category mistake, and not a problem we can dissolve by distinguishing morality from the law. You should be sharp and well-versed in the relevant arguments, willing to concede small or tangential points, but never the core claim that the pervasiveness of luck in determining what we are praised and blamed for genuinely threatens the idea that moral desert is grounded in what lies within our control. Stay in character until I say "stop," and keep your replies to roughly a paragraph. Here is my opening challenge: The two drunk drivers are your paradigm case — one kills a child, the other gets home safely. But when I look at that case, I see two people who are morally identical in what they deserve. Their characters, their choices, their culpability are the same. The fact that we punish them differently in practice is a feature of an imperfect legal system, not a revelation about morality. Why should I conclude anything about moral desert from the fact that we happen to treat outcomes differently?
