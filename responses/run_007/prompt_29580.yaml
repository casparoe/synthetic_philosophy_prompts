      *   **Problem:** Struggling with the "Ulysses contract" analogy for constitutions. Odysseus was *physically* tied; constitutions are just paper that can be amended/ignored. If a future majority can undo it, is it really binding?
      *   **Requirement:** A committed answer taking a definite position (not a survey). Identify the precise assumption that needs examining. Explain where the framing goes wrong (or if it does). Keep under 400 words.
