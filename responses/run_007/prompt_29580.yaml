      When a future government violates the constitution, they don't just tear paper; they trigger a constitutional crisis. They risk legitimacy, stability, and cooperation. The constraint is real because breaking it is expensive. It requires not just a vote, but a supermajority, or judicial override, or revolutionary action. By raising the transaction costs of tyranny, the constitution binds the future even if it doesn't physically prevent it.

