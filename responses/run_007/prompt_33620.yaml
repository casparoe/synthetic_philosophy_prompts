answer: |-
  This is a classic tension within entitlement theory, specifically between **historical specificity** and **systemic rectification**. Your colleague's track record is remarkably consistent with Robert Nozick's *Anarchy, State, and Utopia*, but as you've noticed, the "Principle of Rectification" is the loose thread that can unravel the whole sweater.

  Here is the breakdown of the two rules hiding in her verdicts, the prediction based on her dominant operating principle, and the case that will force her to choose.

  ### The Two Competing Rules

  Both rules are consistent with her first five verdicts, but they diverge on *who* owes *what* to *whom* when history is messy.

  **Rule 1: Specific Historical Entitlement (The Purist View)**
  Justice is strictly relational and specific. A holding is just if and only if it arose from a just acquisition or a voluntary transfer from a just holder. Rectification is only owed by specific violators to specific victims. If a specific chain of title cannot be traced to a specific wrong, the current holder's entitlement stands, regardless of general societal inequality or historical background noise.
  *   *Support from track record:* **Wilt Chamberlain (1)** and **Inheritance (4)**. These verdicts prioritize the sanctity of the specific transfer chain over the resulting pattern. If the chain is clean (Wilt's fans, the parents' wealth), the outcome is immune to criticism, even if it creates inequality. **Stolen Car (2)** supports this too, but only because the specific victim and specific stolen good are identifiable.

  **Rule 2: Systemic Proviso and Rectification (The Structural View)**
  Justice requires a just background system. Acquisitions are only valid if they satisfy the Lockean Proviso (Case 3: "leaving plenty... for anyone else"). If the background system is saturated with rights violations (slavery, redlining), the presumption of title is voided for holdings that benefited from that system. General remedial measures (like taxes) are permissible to restore the *conditions* of justice, even if specific tracing is impossible.
  *   *Support from track record:* **Homesteading (3)** and **Factory Pollution (5)**. Case 3 explicitly invokes the Proviso, implying that if the proviso *weren't* met, the acquisition would be unjust. Case 5 treats rights violations as actionable debts that override market efficiency. This rule suggests that widespread rights violations create a systemic debt that current holders may be liable for, even if they weren't the direct violators.

  ### Which Rule Is She Operating With?

  She is almost certainly operating with **Rule 1: Specific Historical Entitlement.**

  **Why?**
  The "Wilt Chamberlain" verdict is the tell. She endorsed the resulting distribution "full stop, even though it trashes any patterned principle you could name." This is the hallmark of the Purist. If she were operating with Rule 2 (Systemic), she would likely have hedged on Wilt, noting that extreme inequality might violate the Lockean Proviso or undermine the conditions for future liberty.

  Furthermore, her verdict on **Inheritance (4)** validates dynastic wealth provided the *chain* is clean. This signals that she views justice as a property of the *transaction history*, not the *social outcome*.

  **The Prediction:**
  She will argue that the **estate tax is unjust.**

  **Her Reasoning:**
  She will likely argue that while the historical injustices (slavery, redlining) were horrific violations of Rule 1, the proposed tax violates Rule 1 in a new way.
  1.  **It is Patterned:** The revenue funds "universal basic education" for "equal opportunity." This is an end-state pattern, which Case 1 rejects.
  2.  **It lacks Specific Tracing:** The tax is not keyed to specific wrongs. It taxes *this* heir for *those* crimes, without proving *this* wealth stems from *those* crimes. Under Rule 1 (and her Inheritance verdict), a clean chain of recent transfer immunizes the holding, even if the distant background is dirty.
  3.  **It violates the Innocent Holder Principle:** While Case 2 says an innocent buyer must return a *specific stolen car*, it does not establish that an innocent heir must surrender *legitimate wealth* to pay for *general societal sins*.

  She will likely concede that the victims of slavery/redlining are owed rectification (per Case 2 & 5), but she will insist that rectification must be pursued through specific claims against specific ill-gotten gains, not through a general tax on estates that may be historically clean.

  ### The Tie-Breaker Case

  To cleanly separate Rule 1 (Specific) from Rule 2 (Systemic), you need a case where **specific rectification is impossible**, but **historical injustice is certain**. This removes the "patterned goal" (education) confound from the new estate tax case.

  **The Case: The Untraceable Victim**
  > "A wealthy landowner dies. It is discovered that 10% of his portfolio consists of appreciation on land that was demonstrably stolen from a specific indigenous tribe 150 years ago. However, the tribe's descendants are untraceable (extinct, dispersed, or records lost). There is no specific individual to whom the land can be returned."

  **The Question:** Does the heir keep the 10%, or must its value be surrendered to a general fund for societal rectification?

  *   **If she says "The heir keeps it" (Rule 1):** Justice is relational. Without a specific victim to claim a right, there is no injustice to rectify *now*. The debt dies with the inability to trace. **This confirms she will oppose the Estate Tax.**
  *   **If she says "Surrender to a fund" (Rule 2):** The title is void because the acquisition was unjust, regardless of whether a specific claimant exists. The value belongs to the "class" of victims or society generally to restore the Lockean Proviso. **This confirms she would support the Estate Tax.**

  **Why this works:**
  This case isolates the mechanism of rectification. The Estate Tax case conflates *rectification* with *social engineering* (education). The Untraceable Victim case asks purely about the status of the holding when history is broken but claims are fuzzy. If she is a true Specific Entitlement theorist, she cannot support the Estate Tax without also supporting disgorgement in the Untraceable Victim case. If she balks at the latter, her opposition to the former is confirmed.
