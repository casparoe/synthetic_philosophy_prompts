      *   *One-Shot vs. Iterative:* Genie stories are usually "one wish, game over." AI development is iterative, testable, and corrigible (in theory).
      *   *Linguistic vs. Mathematical:* Genies parse natural language ambiguity. AIs optimize mathematical reward functions (though RLHF brings language back in).
      *   *Omniscience:* Genies often know the future/context perfectly to twist the wish. AIs have limited data/compute (initially).
