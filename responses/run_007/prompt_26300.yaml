      *   Let's refine S2: "Transmission of torque to the beater shaft."
      *   If the clutch slips, torque is *not* transmitted. So stimulus fails.
      *   *Back to the Wire Analogy:*
          *   Wire: Live. Touch it. Sorcerer makes it dead.
          *   Stimulus: Touching.
