          *   S1 (Dial): You turn it. Motor hums. Beaters don't turn (clutch slips). Mixer is still functional (reset clutch). **Mask**.
          *   S2 (Force to dough): You apply force (via motor). The clutch detects resistance/force and disengages. The connection to the dough is severed *by* the application of force. The disposition "to rotate dough when force applied" is removed *when* force is applied. **Fink**.
