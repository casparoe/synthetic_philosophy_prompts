answer: |-
  # Protocol for Model Adequacy under False Assumptions (PMAFA)

  **To:** Model-Review Panel
  **From:** Chair
  **Subject:** Decision Procedure for Models with Conceded False Assumptions
  **Constraint:** 48-Hour Review Window; Administrative Defensibility

  ## 1. Theoretical Preamble: The Modified F-Twist
  We operate under a modified instrumentalist doctrine. Milton Friedman argued that assumptions need not be realistic if predictions are accurate. We accept this **only** for *forecasting within stable regimes*. We reject this for *counterfactual policy analysis* or *mechanistic explanation*.

  **The Core Distinction:**
  *   **Forecasting (Status Quo):** The model is a black box. If inputs $X$ historically produced outputs $Y$, and we expect $X$ to remain similar, false assumptions are tolerable *if* predictive error is low.
  *   **Counterfactual (Policy Change):** The model is a causal map. If the policy changes the structure of the system, assumptions regarding that structure must be realistic. A false assumption here is not a simplification; it is a broken link in the causal chain.
  *   **Mechanistic Explanation:** The model claims to describe *how* nature works. False assumptions are disqualifying by definition.

  ## 2. The Decision Procedure

  ### Phase 1: Classification (Stop/Go)
  **Q1: What is the primary regulatory use of this model?**
  *   (A) **Forecasting:** Predicting observables under roughly unchanged conditions (e.g., next year's quota, baseline pollution levels).
  *   (B) **Counterfactual:** Estimating effects of a structural intervention (e.g., new tax, new facility siting, regime shift).
  *   (C) **Explanation:** Establishing causal mechanisms for legal or scientific record.

  *   **Sufficient Answer:** Explicit selection of A, B, or C.
  *   **Hand-off:** If the submission claims (A) but the decision effectively locks in a structural change (B), the Panel Chair reclassifies it as (B).
  *   **Logic:** False assumptions are most tolerable in (A), least in (C).

  ### Phase 2: Predictive Adequacy (The Friedman Check)
  **Q2: Does the model reproduce historical data within acceptable error bounds?**
  *   **Check:** Compare model hindcasts against observed data for the relevant domain.
  *   **Sufficient Answer:** Yes (within pre-defined confidence intervals).
  *   **Stop Point (REJECT):** If **No**. A model that cannot predict the past has no claim on the future, regardless of assumption realism.
  *   **Hand-off:** If data is sparse, Panel must judge if *proxy* validation is sufficient.

  ### Phase 3: Assumption Activity (The Sensitivity Check)
  **Q3: Is the conceded false assumption "active" in generating the specific output used for the decision?**
  *   **Check:** Sensitivity analysis. If the assumption is relaxed or perturbed, does the decision-relevant metric change materially?
  *   **Sufficient Answer:** No (Output is insensitive to the assumption).
  *   **Stop Point (ACCEPT):** If **No** AND Use Case is (A). The falsehood is inert; the model is robust despite the lie.
  *   **Hand-off:** Determining "materially." Is a 5% change in quota material? Is a 5% change in exposure concentration material? This requires risk-tolerance judgment.

  ### Phase 4: Structural Validity (The Lucas Critique Check)
  **Q4: For Use Case (B) Counterfactuals: Does the policy intervention target the mechanism governed by the false assumption?**
  *   **Check:** Map the policy lever to the model equation containing the false assumption.
  *   **Sufficient Answer:** No (The policy acts on a part of the system the assumption does not govern).
  *   **Stop Point (REJECT):** If **Yes**. If the assumption governs the behavior being manipulated, the prediction is invalid. (e.g., You cannot use a model with fixed behavior to predict the effect of a policy designed to change behavior).
  *   **Hand-off:** Determining if the policy is "structural" enough to trigger this check.

  ### Phase 5: Compensating Errors (The Truth Check)
  **Q5: Is the predictive fit (from Q2) achieved through compensating errors?**
  *   **Check:** Does the model fit data in Domain X but fail in Domain Y, suggesting parameters are tuned to cancel out structural flaws?
  *   **Sufficient Answer:** No evidence of tuning to noise.
  *   **Stop Point (REJECT):** If **Yes**. Good fits for wrong reasons do not survive regime shifts.
  *   **Hand-off:** Distinguishing between "calibration" and "compensating error" often requires external expert testimony beyond the 2-day window. If unresolved, default to **REJECT** for Counterfactuals, **ACCEPT with Monitoring** for Forecasts.

  ---

  ## 3. Application to Current Submissions

  ### Submission 1: Fisheries Stock Assessment
  *   **Model:** Logistic growth (Schaefer model).
  *   **Conceded Falsehood:** Fish populations do not grow logistically (age structure, environmental stochasticity ignored).
  *   **Proposed Use:** Setting next year's quota under current conditions.
  *   **Procedure Run:**
      *   **Q1 (Classification):** **Forecasting (A).** We are extrapolating current stock dynamics, not changing the ecosystem rules.
      *   **Q2 (Predictive Adequacy):** **Pass.** Historical catch-per-unit-effort data aligns with model hindcasts within 10%.
      *   **Q3 (Assumption Activity):** **Insensitive.** Sensitivity analysis shows that for populations near equilibrium (current status), the specific growth curve shape matters less than the current biomass estimate.
      *   **Q4 (Structural Validity):** N/A (Not a counterfactual).
      *   **Q5 (Compensating Errors):** **Low Risk.** Parameters are biologically bounded, not purely statistical fits.
  *   **Ruling:** **ACCEPT.**
  *   **Rationale:** Under the Modified F-Twist, the assumption is false but inert for this specific use. The model predicts the observable (sustainable yield) well enough for a one-year horizon.
  *   **Agency Alignment:** **Aligned.** (Agency wants the quota set).

  ### Submission 2: General Equilibrium (GE) Economic Model
  *   **Model:** Dynamic Stochastic GE with Representative Agent.
  *   **Conceded Falsehood:** No heterogeneity (Representative Agent); agents know policy rules (Rational Expectations).
  *   **Proposed Use:** Estimating effects of a large structural tax reform.
  *   **Procedure Run:**
      *   **Q1 (Classification):** **Counterfactual (B).** This is a structural policy change, not a forecast of the status quo.
      *   **Q2 (Predictive Adequacy):** **Pass.** The model fits aggregate GDP and employment trends historically.
      *   **Q3 (Assumption Activity):** **Active.** The distributional effects of the tax reform are the primary concern, but a Representative Agent cannot model distribution.
      *   **Q4 (Structural Validity):** **FAIL.** The policy changes the incentives facing agents. The Rational Expectations assumption presumes agents already know the policy rule. This violates the Lucas Critique: the model assumes the very behavioral parameters the policy intends to change.
      *   **Q5 (Compensating Errors):** **High Risk.** The historical fit is likely achieved by calibrating to a specific policy regime that is now being altered.
  *   **Ruling:** **REJECT.**
  *   **Rationale:** While the model predicts aggregates well (Friedman), the false assumptions break the causal link required for policy analysis. The "Representative Agent" cannot capture the distributional shifts the policy causes; "Rational Expectations" assumes the policy impact is already priced in.
  *   **Agency Alignment:** **AGAINST.** (Agency wants to use this standard economic tool to approve the reform).
  *   **Note to Record:** The model is not "wrong" mathematically, but it is structurally invalid for *this* decision type. A heterogenous-agent model is required.

  ### Submission 3: Air Dispersion Model
  *   **Model:** Gaussian Plume.
  *   **Conceded Falsehood:** Flat terrain.
  *   **Proposed Use:** Siting a new facility near a valley town.
  *   **Procedure Run:**
      *   **Q1 (Classification):** **Counterfactual/Mechanistic (B/C).** We are predicting the physical consequence of a new source in a specific geography.
      *   **Q2 (Predictive Adequacy):** **Fail (Out of Sample).** While it may fit data from flat regions, there is no historical data for *this* valley.
      *   **Q3 (Assumption Activity):** **Critically Active.** In a valley, terrain drives wind flow (channeling, inversion layers). Assuming flat terrain removes the primary physical driver of the output.
      *   **Q4 (Structural Validity):** **FAIL.** The physics of dispersion in a valley is non-Gaussian.
      *   **Q5 (Compensating Errors):** **N/A.** The physics is fundamentally mismatched.
  *   **Ruling:** **REJECT.**
  *   **Rationale:** This is a physical mechanism case. The false assumption is not a simplification; it is a negation of the dominant variable (topography).
  *   **Agency Alignment:** **AGAINST.** (Agency wants to expedite siting).

  ---

  ## 4. Limitations of the Procedure

  As Chair, I must state plainly where this checklist ends and where our responsibility begins. This procedure cannot resolve the following:

  1.  **Risk Tolerance vs. Predictive Success:**
      Predictive success (Q2) is a matter of fact, but "acceptable error" is a value judgment. A model that is 90% accurate might be sufficient for a quota adjustment but unacceptable for a toxic release limit. The procedure identifies the *accuracy*, but the Panel must vote on the *consequence* of the remaining 10% error. No checklist can determine how much risk the public should bear.

  2.  **The "Black Swan" Problem:**
      The Friedman check (Q2) relies on historical data. It cannot validate model performance in regimes never before observed (e.g., climate tipping points, unprecedented economic shocks). In these cases, predictive success is impossible to verify. The procedure forces a **REJECT** default via Q5 (Compensating Errors), but this is a precautionary principle decision, not a scientific one.

  3.  **Resource Constraints vs. Ideal Modeling:**
      In Submission 2 (GE Model), we rejected the model because a better one (Heterogenous Agent) exists. However, if the better model takes 6 months to build and the decision is statutory within 30 days, the Panel is forced to choose between "Scientifically Invalid" and "Administratively Impossible." The procedure identifies the flaw, but it cannot solve the resource constraint. The Panel must document the flaw and accept the liability of the decision.

  4.  **The Judgment Hand-off:**
      Step 3 (Assumption Activity) often relies on sensitivity analysis provided by the applicant. If the applicant claims an assumption is "insensitive" but provides no code to verify, the Panel must decide whether to trust them. This is not a checkable fact within 48 hours. It is a credibility assessment.

  **Final Directive:**
  When the procedure yields a **REJECT** based on structural validity (Submission 2 & 3), our ruling must explicitly state: *"The model is not rejected because it predicts poorly, but because its internal logic contradicts the proposed intervention."* This distinction is vital for surviving administrative review, as it shifts the argument from "the numbers are wrong" (debatable) to "the logic is inapplicable" (defensible).

  For Submission 2, we will issue the **REJECT**. The agency will argue that this is standard economic practice. Our response is that standard practice does not override the Lucas Critique when structural change is the explicit goal of the policy. We cannot permit a model that assumes the policy has no effect on behavior to evaluate a policy designed to change behavior.
