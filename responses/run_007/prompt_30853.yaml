      *   **Goal:** A reusable decision procedure grounded in Friedman's "F-twist" (instrumentalism) but critical of it. It shouldn't adopt it wholesale nor dismiss it.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop points (Accept/Reject).
          *   Hand-off points (Judgment calls).
          *   Distinguish among uses: Forecasting (status quo), Counterfactual (policy change), Mechanistic Explanation.
          *   Explain how false assumptions affect these uses differently.
          *   Handle hard cases: Insensitive assumptions, causal assumptions in counterfactuals, compensating errors.
          *   Run the procedure on three specific cases (Fisheries, GE Model, Air Dispersion).
          *   At least one outcome must contradict the submitting agency's desire.
          *   Conclusion: Limitations of the procedure (where checklists fail).

  2.  **Develop the Decision Procedure (The "F-Twist Filter"):**

      *   *Philosophy:* Friedman argues assumptions don't need to be realistic if predictions are accurate. The critique is that this works for *forecasting* within the sample domain but fails for *counterfactuals* or *explanation* where the mechanism matters.
      *   *Structure:* Needs to be a flowchart logic but written as a protocol.
      *   *Step 1: Define the Use Case.* Crucial distinction. Is it prediction, policy, or explanation?
      *   *Step 2: Predictive Performance (The Friedman Check).* Does it fit historical data? If no, reject (mostly). If yes, proceed.
      *   *Step 3: Assumption Sensitivity (The Lucas Critique Check).* Does the false assumption drive the output *in the specific context of the decision*?
      *   *Step 4: Structural Validity (The Mechanism Check).* For counterfactuals, does the model capture the causal pathway being manipulated?
      *   *Step 5: Compensating Errors.* Is the fit due to right answers for wrong reasons?
      *   *Judgment Calls:* Where do we need human discretion? (Risk tolerance, severity of error).

      *Refining the Steps:*
      *   *Q1: Purpose.* Forecast vs. Counterfactual vs. Explanation.
      *   *Q2: Empirical Adequacy.* Does it match past data? (Necessary but not sufficient).
      *   *Q3: Assumption Relevance.* Is the false assumption *active* in the decision context?
      *   *Q4: Robustness/Sensitivity.* If we relax the assumption, does the decision change?
      *   *Q5: Causal Integrity.* For counterfactuals, does the assumption break the causal link?

      *Let's formalize this into a "Protocol for Model Adequacy under False Assumptions" (PMAFA).*

  3.  **Drafting the Protocol:**

      *   *Phase 1: Classification.* Define the decision type.
      *   *Phase 2: Predictive Validation.* (Friedman's strength).
      *   *Phase 3: Structural Stress Test.* (Friedman's weakness).
      *   *Phase 4: Risk & Judgment.* (The regulatory layer).

      *Specific Checks:*
      *   *Check 1:* Domain of Prediction. Is the future like the past?
      *   *Check 2:* Assumption Activity. Is the false assumption doing the heavy lifting for *this* specific output?
      *   *Check 3:* Counterfactual Stability. If the policy changes the variable governed by the false assumption, the model is invalid.

      *Hand-off points:* Determining "materiality" of error. Determining "acceptable risk."

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Fisheries (Logistic Growth, Quota Setting, Status Quo).**
          *   *Use:* Forecasting/Status Quo management.
          *   *Assumption:* Logistic growth (known to be biologically simplistic).
