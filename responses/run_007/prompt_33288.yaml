answer: |-
  You have put your finger on one of the most significant tensions in 20th-century normative ethics. The intuition you are describing is canonical, but the terminology is surprisingly loose.

  Here is the breakdown of the landscape, the precise boundaries of the phenomenon, and a proposal for a rigorous term to use in your work.

  ### 1. The Canonical Reference: "One Thought Too Many"
  The specific example you gave (the drowning partner) is the exact thought experiment used by **Bernard Williams** in his 1981 paper *"Persons, Character and Morality."* Williams argues that if a husband saves his wife but justifies it by appealing to an impartial moral principle (e.g., "it is permissible to save one's spouse"), he has had **"one thought too many."**

  However, strictly speaking, "one thought too many" is the name of an *objection to impartial moral theories* (like Utilitarianism or rigid Kantianism), not a taxonomic name for the *phenomenon* itself. Furthermore, Williams focuses heavily on **integrity** and **ground projects**.

  Your second example (the friend running through a checklist) aligns more closely with **Michael Stocker's** 1976 paper *"The Schizophrenia of Modern Ethical Theories."* Stocker argues that modern ethics creates a split between the *justification* of an act (duty) and the *motive* required to make it meaningful (care/love), leading to a kind of **moral alienation**.

  ### 2. The Verdict on Terminology
  There is no single, standardized noun in the analytic tradition (like "akrasia" or "supervenience") that covers this exact phenomenon across both emergency and mundane contexts. "One thought too many" is an idiom, not a category. "Moral schizophrenia" is a metaphor for the theoretical split, not the agent's deliberative state.

  To give you the precision you need for your work, I propose we coin the term:

  ## **Deliberative Alienation**

  ### 3. Definition and Boundaries
  **Deliberative Alienation** occurs when an agent performs a morally right action via a deliberative process that is *structurally inappropriate* to the normative relationship grounding the action, thereby diminishing the moral value or relational meaning of the act.

  **Precise Boundaries:**

  *   **The Condition of Appropriateness:** Deliberative Alienation only arises in contexts where the *appropriate motive* is non-calculative. In contexts of **personal partiality** (love, friendship, special obligations), the appropriate motive is direct concern for the particular other. In contexts of **impartial duty** (distributive justice, stranger rescue), calculative deliberation is often *required*.
      *   *Boundary Line:* If you are allocating scarce medical resources, running a utility calculation is *not* Deliberative Alienation; it is procedural justice. If you are buying your mother a birthday gift, running a utility calculation *is* Deliberative Alienation.
  *   **The Outcome Constraint:** The action itself must be objectively right (or at least permissible). If the deliberation leads to the wrong action, that is simply error or negligence. Deliberative Alienation is a defect in the *genesis* of the action, not the *extension* of it.
  *   **The Consciousness Constraint:** The agent must be aware of the deliberative route. If they act on instinct but *would have* calculated if asked, Williams suggests this is less problematic than if they actually pause to calculate. The alienation stems from the *actual insertion* of the mediating principle between the agent and the object of care.

  ### 4. Differentiation from Nearby Phenomena
  You asked how this differs from moral self-indulgence, over-scrupulosity, and akrasia. Here is the analytic distinction:

  **A. vs. Moral Self-Indulgence (Williams)**
  *   *Self-Indulgence:* The agent is focused on their own moral character ("I must ensure *I* remain virtuous here"). The attention is reflexively on the *self*.
  *   *Deliberative Alienation:* The agent is focused on the *principle* or the *calculation*. The attention is on the *rule*, not the self.
  *   *Test:* In self-indulgence, the agent worries about their purity. In Deliberative Alienation, the agent worries about correctness. Both undermine the relationship, but via different focal points.

  **B. vs. Over-Scrupulosity (Psychological/Moral)**
  *   *Over-Scrupulosity:* This is a vice of excess regarding *obligation*. The agent believes they have more duties than they actually do, or fears violation excessively.
  *   *Deliberative Alienation:* The agent may have a perfectly accurate view of their duties. The problem is not the *content* of the morality, but the *mode of access*. You can be Deliberatively Alienated without being scrupulous; you can just be coldly rational.

  **C. vs. Akrasia (Weakness of Will)**
  *   *Akrasia:* The agent knows the right thing but fails to do it due to contrary desire. (Knowledge $\neq$ Action).
  *   *Deliberative Alienation:* The agent knows the right thing and *does* it, but the motivational path is distorted. (Knowledge $=$ Action, but Motive $\neq$ Fitting).
  *   *Metaphysical Note:* This touches on action individuation. Is "saving your wife because you love her" the *same action* as "saving your wife because utility maximizes"? Deliberative Alienation suggests they are distinct action-tokens with different moral properties, even if the physical movement is identical.

  ### 5. Scope: Relationships vs. General Reasoning
  Is this limited to close relationships?
  *   **Williams' View:** Yes, mostly. It applies to "ground projects" that constitute your identity.
  *   **Stocker's View:** No. It applies to any human interaction where "human goods" (friendship, care) are the end.
  *   **Refined View (For your work):** Deliberative Alienation applies wherever the **normative source** of the obligation is relational.
      *   *Example:* If you thank a host for dinner, you should do it out of gratitude. If you do it because "Kant's Formula of Humanity requires acknowledging agency," you are alienated.
      *   *Counter-Example:* If you are a judge sentencing a criminal, you *should* deliberate via principle, not personal feeling. Here, calculation is not alienation; it is fidelity to the role.
      *   **Boundary:** The phenomenon is bounded by the **Domain of Personal Response.** Wherever the moral demand is generated by a specific relationship or a demand for a specific emotional response (gratitude, love, grief), calculative mediation generates Deliberative Alienation.

  ### 6. Recommendation for Your Work
  Since you are a metaphysician, you might find it fruitful to frame **Deliberative Alienation** not just as an ethical failure, but as a **category mistake in practical reasoning**.

  The agent is treating a **particularist reason** (I save *her* because she is *my wife*) as if it were a **universalist reason** (I save *her* because she falls under the class *persons I am permitted to save*).

  If you use the term **Deliberative Alienation** in your writing, define it as:
  > *The degradation of a moral action's value caused by the insertion of an impartial or principled deliberative mediator in a context where the normative force of the action derives from direct personal concern.*

  This allows you to cite Williams and Stocker as the progenitors of the insight while maintaining the terminological precision required for a rigorous metaphysical/ethical analysis.
