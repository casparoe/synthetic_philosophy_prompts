answer: |-
  (a) My cases restated
  You have provided six intuitions regarding mental causation, hinging on the relationship between consciousness, timing, and physical mechanism. In cases (1) voluntary hand-raising and (3) the placebo effect, you affirm mental causation: the decision and the belief are genuine causes, even if mediated by neural or endocrine systems. Conversely, in cases (2) spinal reflex, (4) Libet-style readiness potentials, (5) blindsight, and (6) chess engines, you deny mental causation. Your rejections rely on two distinct criteria: temporal preemption (the physical process finishes before the mental state arrives, as in 2 and 4) and the absence of phenomenology (there is no conscious experience, as in 5 and 6). The central tension you identify lies between (1) and (4): both involve voluntary movement initiated by the brain, yet you grant causal power to the intention in (1) while withholding it in (4) due to the millisecond delay in conscious awareness.

  (b) Candidate principles
  The first candidate is the **Phenomenal Priority Principle**. This holds that a mental item causes an effect only if it is a conscious state that temporally precedes or coincides with the initiation of the physical chain. This principle neatly explains your rejections of the reflex (2), the readiness potential (4), blindsight (5), and the chess engine (6), as all lack a conscious state prior to the action. However, this principle is hostile to your acceptance of the voluntary hand raise (1). Neuroscience suggests that even in standard voluntary actions, unconscious neural preparation precedes conscious intention. If you enforce strict temporal priority for consciousness, (1) collapses into epiphenomenalism, and your resistance to the "motor-cortex only" line becomes untenable.

  The second candidate is the **Token Identity Principle**. This posits that mental states are not distinct from neural states but are identical to them (tokens of the same occurrence). Under this view, if the neural state causes the movement, the mental state *just is* that neural state causing the movement. This saves your verdicts on (1) and (3) effortlessly and aligns with your hunch about "the very same occurrence." It treats the mental and physical as two descriptions of one causal event. This principle respects the causal closure of the physical world (a comfort to a physicist) while preserving the reality of mental causation, provided one accepts that the mental *is* the physical in these instances.

  The third candidate is the **Functional Role Principle**. This suggests that mental causation occurs whenever a state plays a specific information-processing role in guiding behavior, regardless of consciousness. This would validate the placebo effect (3) and the voluntary raise (1) as functional control loops. However, it forces a revision of your verdicts on blindsight (5) and the chess engine (6). If causal efficacy is derived from functional organization, the blindsight patient's visual processing *is* a form of mental causation, and the chess engine's evaluation function qualifies as a mental cause within its system. This principle prioritizes causal structure over phenomenology, contrasting with your intuition that consciousness is a necessary condition for "mental" status.

  (c) What has to give
  To achieve consistency, you must sacrifice the distinction between your verdicts on (1) and (4). The **Phenomenal Priority Principle** forces you to admit that (1) is not mental causation either, rendering conscious will an illusion in all voluntary acts. The **Token Identity Principle**, which best matches your physicist instincts, requires you to change your verdict on (4): if the neural preparation is the intention (as identity suggests), then the intention *did* cause the movement, even if the conscious report lagged. You must also choose between consciousness and function for (5) and (6); Identity allows you to keep them as "non-mental" only if you define "mental" strictly as "conscious," but this risks making consciousness causally irrelevant. The most coherent path for a physicalist is to accept Token Identity, concede that (4) *is* mental causation (the brain state *is* the mind state), and acknowledge that your intuition in (4) stems from a dualist worry that the "conscious report" is separate from the "neural cause," when they are likely the same event described differently.

  (d) The autopilot case and one more
  Applying the **Token Identity Principle** to your autopilot case: your knowledge of the route *did* cause the turn. The neural substrate of that procedural knowledge was active and causally efficacious in steering the car. On this principle, it counts as mental causation, even absent conscious phenomenology, because the mental state is identical to the functioning neural state. This suggests your hesitation stems from equating "mental" with "conscious." If you maintain that only conscious states count as mental, you must classify the autopilot turn as purely mechanical, identical to the reflex in (2), which seems counterintuitive given the complexity of the navigation.

  Consider a case of **Akrasia (Weakness of Will)**: You consciously decide to diet, yet you eat the cake. Did your decision cause anything? Under Token Identity, your decision was a real neural state that caused *some* effects (perhaps feelings of guilt or a delay in eating), but it was causally outweighed by competing neural states (hunger cues). This preserves mental causation without requiring the mental to always win. It clarifies that mental causation is not about absolute control, but about being a genuine variable in the physical equation. If you accept this, you can keep (1) and (3), revise (4) to "Yes," and view the autopilot case as "Yes, but unconscious," resolving the stall by decoupling causation from conscious awareness.
