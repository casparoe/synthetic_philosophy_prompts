          *   #1: Yes, Half Kelly is suboptimal for Log Utility.
          *   #2: Yes, Half Kelly has lower growth rate.
          *   #3: Yes, Half Kelly implies a different utility (CRRA > 1).
          *   #4: Yes, Half Kelly grows slower, so ratio goes to 0.
          *   #5: Yes, Kelly beats Half Kelly with prob 1 in infinite time.
          *   *Crucial Nuance:* In *finite* time, Half Kelly often has higher median wealth or lower risk of ruin. These arguments all rely on infinite horizons or specific utility assumptions. I need to mention this limitation in the commentary.

