          *   Full Kelly specificity: High (within the model), but the model choice is the weak link.

      *   *2. Maximizes long-run exponential growth rate (almost surely).*
          *   Analysis: This is the Breiman result. It's an asymptotic property. It distinguishes full Kelly from half Kelly (half grows slower) and 2x Kelly (2x goes bankrupt/grows negatively).
          *   Independence: Medium-High. It's a frequentist/observable property, not just a utility assumption.
          *   Full Kelly specificity: High. Only full Kelly maximizes the rate.

      *   *3. Log utility is the only utility function under which the optimal fraction is the same whether you're betting once or a hundred times (Horizon-independence).*
          *   Analysis: This is a property of CRRA utility with $\gamma=1$. It argues for log utility, which implies full Kelly.
          *   Independence: Medium. It justifies the *utility function*, which then justifies the bet size.
          *   Full Kelly specificity: High (if you accept the premise).
          *   Overlap: Heavily relies on #1.

      *   *4. Unique threshold: Deviate and you end up exponentially behind (almost surely).*
          *   Analysis: This is essentially a restatement of #2. If Kelly maximizes growth rate, any other strategy grows slower, so the ratio of wealth goes to 0 or $\infty$.
          *   Independence: Low. It's the flip side of #2.
          *   Full Kelly specificity: High.

      *   *5. Maximizes the probability of eventually ending up ahead of any fixed alternative strategy.*
