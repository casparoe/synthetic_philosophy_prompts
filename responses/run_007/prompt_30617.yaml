answer: |-
  Here is the scoring, ranking, and dependency analysis.

  The core tension here is between **axiomatic justifications** (defining the agent's preferences) and **asymptotic justifications** (describing the physical behavior of wealth over time). Most of these arguments collapse into two families: the "Utility Family" (1 & 3) and the "Growth Family" (2, 4, & 5).

  ### The Rankings & Scores

  **1. Justification #2: Maximizes long-run exponential growth rate.**
  *   **Score:** 8/10
  *   **Rank:** 1
  *   **Verdict:** This is the strongest independent claim. It appeals to an observable property of the wealth process (the almost sure limit of the geometric mean) rather than a subjective preference. It uniquely identifies full Kelly (half Kelly grows slower; 2x Kelly shrinks). Its only weakness is the "long-run" caveat, which glosses over finite-horizon risk.

  **2. Justification #3: Horizon-independence of optimal fraction.**
  *   **Score:** 7/10
  *   **Rank:** 2
  *   **Verdict:** This is a strong structural argument for *why* one should choose log utility. It argues that log utility is the "natural" choice because it doesn't require knowing when you'll stop betting. It justifies full Kelly by justifying the utility function that necessitates it.

  **3. Justification #1: Maximizes expected log wealth (Log-utility agent).**
  *   **Score:** 4/10
  *   **Rank:** 3
  *   **Verdict:** This is a tautology. It says "If you assume log utility, full Kelly is optimal." It does zero work to justify *why* an agent should have log utility rather than square-root utility (which implies half-Kelly). It defines the answer rather than deriving it.

  **4. Justification #4: Unique threshold (deviate and end up exponentially behind).**
  *   **Score:** 3/10
  *   **Rank:** 4
  *   **Verdict:** This is a rhetorical restatement of #2. If Kelly maximizes the growth rate, then by definition any other strategy has a lower growth rate, meaning the wealth ratio diverges exponentially. It adds emotional weight but no new mathematical justification.

  **5. Justification #5: Maximizes probability of eventually ending up ahead.**
  *   **Score:** 3/10
  *   **Rank:** 5
  *   **Verdict:** This is also a restatement of #2. In the infinite limit, the strategy with the higher growth rate beats the other with probability 1. In finite time, this claim is often false (half-Kelly often has a higher probability of beating full-Kelly at moderate horizons due to lower variance), so it relies entirely on the asymptotic assumption in #2.

  ---

  ### Dependency Map: Who is leaning on whom?

  You asked to flag the pairs that are the same claim in different clothes. There are two distinct clusters here.

  **Cluster A: The Asymptotic Dominance Triad (#2, #4, #5)**
  *   **Dependency:** #4 and #5 are direct corollaries of #2.
  *   **Explanation:** If you maximize the exponential growth rate (#2), then mathematically the ratio of your wealth to any other strategy's wealth goes to infinity almost surely (#4), which implies the probability of you having more money than them goes to 1 (#5).
  *   **Critique:** None of these three distinguish themselves on *finite* horizons. They all rely on the "almost surely in the limit" condition. If you care about the next 100 bets rather than the next 1,000,000, #2 stops implying #4 and #5.

  **Cluster B: The Utility Specification Dyad (#1, #3)**
  *   **Dependency:** #3 is the primary justification for #1.
  *   **Explanation:** #1 asserts you should use log utility. #3 explains *why* log utility is special (it's the only one that is horizon-independent). Without #3, #1 is an arbitrary preference.
  *   **Critique:** This cluster justifies the *agent's mind*, not the *market's reality*. It proves full Kelly is right *for a log-utility agent*, but it doesn't prove you *should be* a log-utility agent (unless you accept #3's argument that horizon-independence is a mandatory rationality constraint).

  ### Summary of the "Optimal" Trap
  The word "optimal" slips between these two clusters.
  *   In **Cluster A**, "optimal" means "fastest asymptotic growth."
  *   In **Cluster B**, "optimal" means "best satisfies rationality constraints on utility."

  **Half-Kelly** loses in Cluster A (slower growth) and Cluster B (implies $\gamma > 1$, which is horizon-dependent). However, Half-Kelly often wins on **unlisted criteria**, such as maximizing median wealth at finite horizons or minimizing time to reach a specific goal without ruin. None of these five justifications address finite-horizon variance, which is why the "full vs. half" debate persists.
