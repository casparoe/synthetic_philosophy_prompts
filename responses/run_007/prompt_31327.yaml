prompt: |-
  So I'm organizing this small workshop on bounded rationality and decision theory, and I had this idea — instead of the usual back-and-forth where everyone just restates their position, what if we actually produced an adversarial-collaboration document? Something both sides could sign. The two camps I'm thinking of are, on one side, the people who defend satisficing as a genuinely distinct normative standard (the view that it can be rationally okay to stop searching once you've found a "good enough" option, rather than always needing to find the best), and on the other side, the people who say that what looks like satisficing is really just optimizing once you properly account for search costs and computational limits — so satisficing colapses into maximization.

  I've read enough of this stuff to know the standard moves. The satisficing side says: "if you include search costs, you're still optimizing, so you're missing the whole point about what it feels like to actually decide." And the optimization side says: "if you're not optimizing, you're being arbitrary about where you set the threshold — why this level of 'good enough' and not a slightly higher one?" I want to get past these moves and make the residual disagreement precise.

  You're an expert in decision theory and formal epistemology who's followed this debate for years. Start by brainstorming the key pressure points each side faces and the formulations most likely to be acceptable to both. Then draft the statement with these sections:

  - **Preamble** (~150 words): shared ground — what both sides agree about bounded rationality, the fact of computational limits, and what would count as progress in the debate.
  - **Agreed Claims** (~300 words): a numbered list of specific claims both camps can sign, about the descriptive facts, the normative questions at issue, and the cases central to the debate.
  - **Disagreements Table** (~400 words): a table with columns for (1) the disagreement phrased neutrally, (2) the satisficing camp's position in their own preferred wording, (3) the optimization camp's position in their own preferred wording, and (4) the crux — the sub-question that would resolve this row if settled.
  - **Crux Analysis** (~300 words): for each crux, a concrete test, case, or argument both sides agree bears on it, plus what each side predicts about the outcome.

  The whole point is a document both parties could actually put their names on. Avoid vacuous claims and don't subtly favor one side.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Topic:** Bounded Rationality and Decision Theory (Satisficing vs. Optimizing under constraints).
      *   **Goal:** Create an "Adversarial Collaboration Document" that both sides can sign.
      *   **Roles:** Expert in decision theory and formal epistemology.
      *   **Tone:** Neutral, precise, avoiding vacuous claims, not favoring one side.
      *   **Structure:**
          1.  Brainstorming pressure points & acceptable formulations.
          2.  Preamble (~150 words).
          3.  Agreed Claims (~300 words).
          4.  Disagreements Table (~400 words).
          5.  Crux Analysis (~300 words).
      *   **Key Conflict:** Satisficing as a distinct normative standard vs. Satisficing as implicit optimization (accounting for search/computational costs).

  2.  **Brainstorming Pressure Points & Formulations:**
      *   *Satisficing Pressure Point:* If you define "optimization" broadly enough (including meta-costs), it becomes tautological. Everything is optimization. This drains the term of explanatory power. Also, psychological evidence suggests agents don't actually calculate marginal search costs; they just stop at an aspiration level.
      *   *Optimization Pressure Point:* If satisficing isn't grounded in costs, where does the aspiration level come from? Setting it arbitrarily seems irrational. If it *is* grounded in costs (even implicitly), then it *is* optimization.
      *   *Acceptable Formulations:* Both agree agents have limited capacity. Both agree "unbounded maximization" is impossible/irrelevant. Both agree we need a normative standard for *bounded* agents. The disagreement is whether the normative standard is *structural* (maximize expected utility subject to constraints) or *procedural* (satisfy aspiration levels as a primitive norm).
      *   *Key Distinction:* Is the aspiration level *derived* from a higher-order maximization problem, or is it *fundamental*?

  3.  **Drafting - Section by Section:**

      *   **Preamble:** Needs to establish shared context. Acknowledge Simon's legacy. Acknowledge that "unbounded rationality" is a strawman. Focus on the *normative* status of satisficing, not just descriptive.
      *   **Agreed Claims:** Need specific, non-trivial points.
          1.  Computational limits are real.
          2.  Standard expected utility theory (EUT) needs modification for bounded agents.
          3.  Search costs exist.
          4.  The debate is normative, not just descriptive.
          5.  "Aspiration levels" are observable.
      *   **Disagreements Table:** This is the core. Needs neutral phrasing.
          1.  *Source of Normativity:* Derived vs. Primitive.
          2.  *The "Arbitrariness" Objection:* Cost-based justification vs. Ecological rationality.
          3.  *Modeling Approach:* Meta-optimization vs. Heuristic rules.
          4.  *Crux:* What determines the aspiration level?
      *   **Crux Analysis:** Needs concrete tests.
          1.  *Dynamic Consistency:* Do agents revise aspirations when costs change? (Optimizers say yes, Satisficers say maybe not/if ecological fit remains).
          2.  *Neuroeconomics:* Does the brain compute marginal costs or threshold matches?
          3.  *Performance:* Does explicit optimization outperform satisficing in complex environments?

  4.  **Refining and Editing (Self-Correction during drafting):**
      *   *Check Word Counts:* The prompt asks for specific approximate word counts. I need to monitor this closely.
      *   *Check Tone:* Ensure I'm not sneaking in a bias. For example, don't say "Satisficing is simpler" (bias) but "Satisficing posits fewer computational steps."
      *   *Check Content:* Make sure the "optimization" side isn't just "neoclassical economics" but specifically the "optimization under constraints" view (Stigler/Becker style vs. Simon/Gigerenzer style).
      *   *Refining the Crux:* The crux needs to be something that *could* be resolved. "Is it rational?" is too vague. "Does the aspiration level track marginal search costs?" is better.

  5.  **Drafting the Content (Iterative Process):**

      *   *Preamble:* Start with Simon. Acknowledge limits. Focus on the *normative* gap.
      *   *Agreed Claims:* Keep them tight. 1. Limits exist. 2. EUT unmodified fails. 3. Search is costly. 4. Aspiration levels are real phenomena. 5. The question is justification.
      *   *Table:*
          *   Row 1: Derivation of the threshold.
          *   Row 2: Response to the "arbitrariness" objection.
          *   Row 3: Modeling the agent.
      *   *Crux Analysis:* Focus on the relationship between aspiration levels and marginal search costs. If costs go up, does the threshold drop? Optimizers say yes (necessarily). Satisficers say "only if the ecology changes."

  6.  **Final Review against Constraints:**
      *   Preamble ~150 words?
      *   Agreed Claims ~300 words?
      *   Disagreements Table ~400 words?
      *   Crux Analysis ~300 words?
      *   Total structure followed?
