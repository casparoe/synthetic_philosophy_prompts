  1. Overview and learning aims
  This activity immerses students in the structural tension of peer disagreement without initial theoretical framing. By engaging with a tricky problem requiring genuine judgment, students experience the pressure to revise beliefs when confronted with a disagreeing partner deemed equally competent. The primary learning aims are threefold. First, students will intuitively feel the normative pull to lower confidence upon discovering a peer's dissent, recognizing disagreement as higher-order evidence. Second, they will identify the conditions under which holding one's ground feels rational, exploring the steadfast alternative. Finally, they will assess the costs of each stance: the risk of skepticism or spinelessness if one always conciliates, versus the risk of arrogance or error if one remains steadfast. The activity isolates the epistemic dynamics from social pressure by rewarding accuracy over consensus, ensuring that any movement toward agreement stems from evidential reasoning rather than conflict avoidance.

  2. Materials and advance preparation
  You need a logic or probability puzzle with a counterintuitive solution that reliably splits informed audiences (e.g., the Two-Child Problem). Prepare individual answer slips and joint submission sheets. Print sixteen copies of the problem statement and evidence packet. Advance preparation involves solving the puzzle yourself to confirm the correct answer and reasoning. You must be ready to quickly sort students into pairs based on their initial individual answers; therefore, have a method to collect and scan responses rapidly between Phase 1 and Phase 2. Physical slips work best for anonymity during sorting. Ensure the room allows for paired seating without overhearing other groups.

  3. Step-by-step timeline with facilitator instructions
  **Phase 1: Individual Judgment (0-10 mins).** Distribute the problem packet. Instruct students: "Solve this silently. Record your answer and confidence (0-100%) on the slip. Do not discuss." Collect slips immediately. This establishes the baseline divergence.
  **Phase 2: Pairing and Stipulation (10-15 mins).** While students stretch, sort slips to pair divergent answers (A with B). Announce: "You are paired because you disagreed. For this exercise, you must treat each other as epistemic peers: you have seen identical evidence and have equal track records on this task type." This stipulation is mandatory; do not allow them to debate competence. Write "PEER STIPULATION" on the board. Explain that violating this breaks the experiment. Tell them: "Even if you feel smarter, for this hour, you are equals."
  **Phase 3: Joint Submission (15-35 mins).** Pairs must agree on a single answer and write a joint justification. They cannot submit two answers. Emphasize that the goal is truth, not compromise. Walk around. If a pair stalls, ask: "Does the fact of disagreement change the evidence?" Do not give hints. If they cannot agree, they must still select one answer to proceed. During Phase 3, resist the urge to mediate disputes. Your silence forces them to confront the peer stipulation alone. If a student claims their partner is irrational, remind them: "The rules say they are your peer. Work with that constraint." This friction is where the epistemic lesson lives.
  **Phase 4: Private Revision (35-45 mins).** Collect joint sheets. Return individual slips. Ask students to privately record their final personal answer and confidence level, knowing they will be scored individually on this. This separates social pressure from epistemic revision. Ensure privacy; students should not see each other's final slips.
  **Phase 5: Reveal (45-50 mins).** Reveal the correct answer. Calculate scores. Do not shame incorrect answers; frame errors as data for the debrief.
  **Phase 6: Debrief (50-75 mins).** Discuss the experience, introducing philosophical terminology only now. Guide them through the tension between their initial confidence, the joint negotiation, and their private revision. Ask: "Who changed their mind? Why?" The transition from Phase 3 to 4 is critical: watch for students who agreed publicly but revert privately. Note these cases for the debrief discussion on sincerity versus social compliance.

  4. Payoff and scoring scheme
  The scoring scheme incentivizes accuracy, not agreement. Award 10 points for a correct final private answer. Award a bonus 5 points if the joint submission was correct. This structure creates a specific tension: if I believe my partner is wrong, agreeing with them in the joint phase risks losing the bonus if we are both wrong, but disagreeing prevents submission. Crucially, the private revision phase determines the bulk of their score. If a student conciliates during the joint phase but reverts privately, they signal that the disagreement wasn't truly evidential. If they stick with their peer despite initial disagreement, they risk accuracy for conformity. This payoff ensures that consensus is only rational if it tracks the truth, mirroring the epistemic goal of belief formation.

  5. Debrief: mapping the activity to the positions
  In the debrief, introduce the terms withheld during the activity. The pressure felt in Phase 3 mirrors the **Equal Weight View**: given the peer stipulation, students likely felt they should give their partner's view equal weight, forcing a confidence revision. The mere existence of a disagreeing peer acts as **Higher-Order Evidence**, suggesting a flaw in one's own reasoning process regardless of the first-order evidence. The reluctance to change their private answer in Phase 4 illustrates the **Steadfast** alternative: retaining confidence despite disagreement because one trusts one's own evaluation of the evidence more than the fact of disagreement itself.
  Address the **Bootstrapping Worry**: if I dismiss my peer because I think I'm right, I use my reasoning to validate my reasoning, circularly insulating myself from correction. Did anyone feel this? Finally, explore the costs. Did conciliating feel like **Spinelessness**, abandoning your own judgment too easily? Did steadfastness feel like arrogance? If everyone conciliates, does **Skepticism** loom, where confidence drops too low to act? Map specific student movements (e.g., those who changed private answers vs. those who didn't) to these theoretical positions. Ask those who remained steadfast how they justified ignoring the peer stipulation internally. Ask those who conciliated if they felt they lost epistemic integrity. Connect the private revision phase to the worry that conciliationism leads to a spiral of doubt: if I lower confidence because of you, and you lower it because of me, do we both end up suspending judgment entirely? This activity makes that abstract risk concrete.

  6. Predictable failure modes and how to handle them
  Several failure modes may arise. First, students might treat the joint phase as a social negotiation rather than an epistemic one, compromising to finish quickly. Counter this by emphasizing the accuracy bonus and monitoring discussions. Second, one student may dominate, asserting superiority despite the peer stipulation. Intervene by reminding them the rules forbid competence assessments. Third, students might not take the peer stipulation seriously, assuming they are smarter than their partner. You must enforce the stipulation as a rule of the game, not an empirical claim. If a pair agrees too easily, ask them to articulate why they dismissed their initial dissent. If they remain stuck, allow them to submit a "disagreement" note, but penalize the bonus points to simulate the cost of unresolved disagreement. Watch for "false consensus," where one student silently acquiesces but reverts in the private phase. Highlight this during debrief as a failure of genuine conciliation. If the puzzle is too hard, students may guess randomly; ensure the problem is difficult but solvable to maintain epistemic stakes. If the puzzle is too easy, disagreement will vanish; test the problem beforehand. Manage time strictly; if Phase 3 runs long, shorten the debrief slightly but preserve the mapping discussion.

  7. What this activity cannot reproduce about real peer disagreement
  This activity cannot reproduce the discovery process of real peer disagreement. In reality, we must investigate whether someone is truly a peer; here, the facilitator stipulates it. This removes the burden of assessing competence, which is often where real disagreements dissolve. Additionally, the activity is a one-off interaction. Real peer disagreements often occur within ongoing relationships where track records are established over time, allowing for weighting adjustments. The artificial stakes (points) lack the practical consequences of real-world beliefs (e.g., political or moral commitments), which often harden steadfastness. Finally, the activity forces a binary resolution in the joint phase, whereas real epistemic life often allows for suspending judgment indefinitely. These limitations must be acknowledged to prevent students from overgeneralizing the lesson.
