      This activity immerses students in the structural tension of peer disagreement without initial theoretical framing. By engaging with a tricky problem requiring genuine judgment, students experience the pressure to revise beliefs when confronted with a disagreeing partner deemed equally competent. The primary learning aims are threefold. First, students will intuitively feel the normative pull to lower confidence upon discovering a peer's dissent, recognizing disagreement as higher-order evidence. Second, they will identify the conditions under which holding one's ground feels rational, exploring the steadfast alternative. Finally, they will assess the costs of each stance: the risk of skepticism or spinelessness if one always conciliates, versus the risk of arrogance or error if one remains steadfast. The activity isolates the epistemic dynamics from social pressure by rewarding accuracy over consensus, ensuring that any movement toward agreement stems from evidential reasoning rather than conflict avoidance.

