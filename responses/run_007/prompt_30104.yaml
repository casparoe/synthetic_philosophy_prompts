      You need a logic or probability puzzle with a counterintuitive solution that reliably splits informed audiences (e.g., the Two-Child Problem). Prepare individual answer slips and joint submission sheets. Print sixteen copies of the problem statement and evidence packet. Bring a timer and a board for scoring. Advance preparation involves solving the puzzle yourself to confirm the correct answer and reasoning. You must be ready to quickly sort students into pairs based on their initial individual answers; therefore, have a method to collect and scan responses rapidly between Phase 1 and Phase 2. No technology is required; physical slips work best for anonymity during sorting. Ensure the room allows for paired seating without overhearing other groups.

      *(Drafting Section 3)*
      **Phase 1: Individual Judgment (10 mins).** Distribute the problem. Instruct students to solve it silently and record their answer and confidence level (0-100%) on a slip. Collect slips immediately.
      **Phase 2: Pairing and Stipulation (5 mins).** Quickly pair students with opposing answers (e.g., Answer A with Answer B). Announce: "You are paired because you disagreed. For this exercise, you must treat each other as epistemic peers: you have seen identical evidence and have equal track records on this task type." This stipulation is mandatory; do not allow them to debate competence.
      **Phase 3: Joint Submission (20 mins).** Pairs must agree on a single answer and write a joint justification. They cannot submit two answers. Emphasize that the goal is truth, not compromise.
      **Phase 4: Private Revision (10 mins).** Collect joint sheets. Return individual slips. Ask students to privately record their final personal answer and confidence level, knowing they will be scored individually on this.
      **Phase 5: Reveal (5 mins).** Reveal the correct answer. Calculate scores.
      **Phase 6: Debrief (25 mins).** Discuss the experience, introducing philosophical terminology only now. Guide them through the tension between their initial confidence, the joint negotiation, and their private revision.

      *(Drafting Section 4)*
      The scoring scheme incentivizes accuracy, not agreement. Award 10 points for a correct final private answer. Award a bonus 5 points if the joint submission was correct. This structure creates a specific tension: if I believe my partner is wrong, agreeing with them in the joint phase risks losing the bonus if we are both wrong, but disagreeing prevents submission. Crucially, the private revision phase determines the bulk of their score. If a student conciliates during the joint phase but reverts privately, they signal that the disagreement wasn't truly evidential. If they stick with their peer despite initial disagreement, they risk accuracy for conformity. This payoff ensures that consensus is only rational if it tracks the truth, mirroring the epistemic goal of belief formation.

      *(Drafting Section 5)*
      In the debrief, introduce the terms withheld during the activity. The pressure felt in Phase 3 mirrors the **Equal Weight View**: given the peer stipulation, students likely felt they should give their partner's view equal weight, forcing a confidence revision. The reluctance to change their private answer in Phase 4 illustrates the **Steadfast** alternative: retaining confidence despite disagreement. Discuss **Higher-Order Evidence**: the mere fact of disagreement became evidence about the reliability of their first-order reasoning. Address the **Bootstrapping Worry**: if I dismiss my peer because I think I'm right, I use my reasoning to validate my reasoning, circularly insulating myself. Finally, explore the costs. Did conciliating feel like **Spinelessness**? Did steadfastness feel like arrogance? If everyone conciliates, does **Skepticism** loom, where confidence drops too low to act? Map specific student movements (e.g., those who changed private answers vs. those who didn't) to these theoretical positions.

      *(Drafting Section 6)*
      Several failure modes may arise. First, students might treat the joint phase as a social negotiation rather than an epistemic one, compromising to finish quickly. Counter this by emphasizing the accuracy bonus and monitoring discussions. Second, one student may dominate, asserting superiority despite the peer stipulation. Intervene by reminding them the rules forbid competence assessments. Third, students might not take the peer stipulation seriously, assuming they are smarter than their partner. You must enforce the stipulation as a rule of the game, not an empirical claim. If a pair agrees too easily, ask them to articulate why they dismissed their initial dissent. If they remain stuck, allow them to submit a "disagreement" note, but penalize the bonus points to simulate the cost of unresolved disagreement.

      *(Drafting Section 7)*
      This activity cannot reproduce the discovery process of real peer disagreement. In reality, we must investigate whether someone is truly a peer; here, the facilitator stipulates it. This removes the burden of assessing competence, which is often where real disagreements dissolve. Additionally, the activity is a one-off interaction. Real peer disagreements often occur within ongoing relationships where track records are established over time, allowing for weighting adjustments. The artificial stakes (points) lack the practical consequences of real-world beliefs (e.g., political or moral commitments), which often harden steadfastness. Finally, the activity forces a binary resolution in the joint phase, whereas real epistemic life often allows for suspending judgment indefinitely. These limitations must be acknowledged to prevent students from overgeneralizing the lesson.

