  7.  **Writing the Content:** (Drafting the response following the thought process above.) *Self-Correction during drafting:* Make sure the "Fetal Personhood" example is handled delicately. It's not just "it's verbal." It's "the word 'person' is doing too much work." The substantive part is the moral status. I need to make sure the procedure doesn't trivialize the moral disagreement.

  8.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Ordered questions? Yes.
      *   Stopping rules? Yes.
      *   Handle hard cases? Yes.
      *   Flag judgment calls? Yes.
      *   Bias acknowledgement? Yes.
      *   3 Worked Examples? Yes.
