      *   **Target Audience:** Rationalist blogosphere/online discussion participants (familiar with concepts like "dissolving the question," "tabooing words," but not professional philosophers).
      *   **Format:** A series of ordered questions with clear stopping rules (Verdict: Verbal vs. Substantive vs. Mixed).
      *   **Constraints:** Must be actionable in minutes, grounded in philosophical literature (metaontology, verbal disputes) but operationalized, handle hard cases (fact of the matter, conceptual schemes, mixed disputes), flag irreducible judgment calls, and acknowledge biases/error rates.
      *   **Deliverables:** The Procedure itself + 3 Worked Examples (Hot Dog, AI Understanding, Fetal Personhood).
      *   **Tone:** Practical, precise, honest about limitations, copy-paste ready.

  2.  **Philosophical Grounding:**
      *   *Key Literature:* Rudolf Carnap (frameworks), W.V.O. Quine (ontological commitment), David Chalmers (verbal disputes, "verbal disputes are real"), Ted Sider (writing the book of the world), Amie Thomasson (easy ontology), David Manley (contextualism).
      *   *Core Insight:* A dispute is verbal if the parties agree on all non-linguistic facts (empirical and normative) but disagree on the application of a term due to differing intensions/extensions.
      *   *Operationalization:* The "Taboo" technique (Eliezer Yudkowsky/CFAR) is the closest existing rationalist tool. I need to refine this into a stricter decision tree based on the "Agreement on Facts" test.
      *   *Hard Case Handling:*
          *   *Same word, different extension:* Requires explicit definition swapping.
          *   *Fact of the matter:* Requires distinguishing ontological realism from conceptual pragmatism.
          *   *Conceptual Scheme:* Requires asking "What work is this concept doing?" (pragmatic vs. truth-conditional).
          *   *Mixed:* Requires isolating the verbal core from the normative/empirical periphery.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask "Do you agree on facts?" If yes, it's verbal. If no, it's substantive.
      *   *Critique 1:* Too simple. People *think* they agree on facts but don't. People disagree on *which* facts matter.
      *   *Attempt 2:* Taboo the word. Can you restate the claim without it? If yes, do you agree?
      *   *Critique 2:* Better. But need to handle the "conceptual scheme" case where the choice of scheme *is* the substantive part (e.g., legal definitions).
      *   *Attempt 3 (Final Structure):*
          1.  Identify the Proposition.
          2.  Taboo the Term (Operationalize).
          3.  Check Empirical Agreement.
          4.  Check Normative/Pragmatic Agreement.
          5.  Diagnose the Residual.
      *   *Stopping Rules:* Need clear "If X, then Y" logic.
      *   *Bias Acknowledgement:* The procedure will likely bias towards "Verbal" because it forces explicitation, which often dissolves confusion. But it might miss deep conceptual incompatibilities that look verbal.

  4.  **Developing the Worked Examples:**
      *   *Hot Dog:* Classic verbal dispute. Procedure should dissolve it quickly. The "substantive" remainder is about culinary taxonomy utility.
      *   *AI Understanding:* Mixed. Empirical agreement on capabilities, disagreement on definition (functionalism vs. internalism). The substantive part is about prediction of future capabilities or moral status.
      *   *Fetal Personhood:* High stakes. Often treated as verbal ("Is it a person?") but actually normative ("Does it have rights?"). The procedure needs to show that "person" is the confusing term, and the real fight is about moral weight/rights. This is the critical test.

  5.  **Refining the Output:**
      *   *Formatting:* Use bolding, boxes, or clear headers to make it copy-pasteable.
      *   *Tone Check:* Ensure it sounds like a LessWrong post (rationalist, precise, slightly technical but accessible).
      *   *Self-Correction on "Fact of the Matter":* I need to be careful not to dismiss ontological questions too easily. If two people disagree on whether numbers *exist*, that's metaontological. For this tool, I should frame it as "Do you disagree on predictions about the world?"
      *   *Addressing the "Conceptual Scheme" Hard Case:* If we agree on facts but disagree on the scheme, is it verbal? Chalmers says if there's no further fact, it's verbal. But the *choice* of scheme can be substantive (pragmatically). I need to distinguish "Is X a Y?" (verbal) from "Should we treat X as a Y?" (substantive/normative).

