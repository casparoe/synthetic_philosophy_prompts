answer: |-
  # The Substantive-Verbal Disentanglement Protocol (SVDP)

  **Purpose:** To determine whether a disagreement is about the world (substantive) or about words/concepts (verbal), and to isolate the remaining core if the dispute is mixed.
  **Time Cost:** 5–10 minutes of focused dialogue.
  **Prerequisites:** Willingness from both parties to temporarily suspend the use of the contested term.

  ---

  ## Part I: The Protocol

  **Instructions:** Copy and paste the following steps into the discussion. Both parties should answer each step sequentially. Do not skip to Step 4 until Step 3 is resolved.

  ### Step 1: Identify the Contested Proposition
  State the exact sentence upon which you disagree. It must contain the contested term.
  *   *Format:* "Side A asserts **[Term T]** applies to **[Object O]**. Side B denies **[Term T]** applies to **[Object O]**."
  *   *Stop Rule:* If you cannot agree on what sentence you are arguing about, you are not yet ready for this protocol. Resolve that first.

  ### Step 2: Taboo the Term (The Carnap Test)
  Both parties must restate their position **without using Term T or any close synonyms.** You must describe **[Object O]** using only:
  1.  Physical/structural properties (what it is made of, how it behaves).
  2.  Causal relationships (what it causes, what causes it).
  3.  Normative implications (what rights/treatments it deserves, if applicable).

  *   *Side A Restatement:* "Object O has properties {X, Y, Z}."
  *   *Side B Restatement:* "Object O has properties {X, Y, Z}."
  *   *Stop Rule:* If either side cannot do this without smuggling in Term T, pause. Define the term operationally before proceeding.

  ### Step 3: Check for Empirical and Normative Agreement
  Compare the two restatements from Step 2.
  *   **Question 3A (Empirical):** Do you disagree on any physical, behavioral, or causal claim in the restatements? (e.g., Does it have neurons? Does it feel pain? Will it break if dropped?)
  *   **Question 3B (Normative):** Do you disagree on any moral, legal, or pragmatic claim in the restatements? (e.g., Should it be taxed? Is it wrong to kill it? Should we study it?)

  *   **Stopping Rule 1 (Purely Verbal):** If the answer to **both 3A and 3B is NO** (you agree on all facts and values), the dispute is **Verbal**.
      *   *Action:* Dissolve the argument. Acknowledge you are using different definitions for Term T. Agree to use subscripts (e.g., Person$_A$ vs. Person$_B$) or drop the term.
  *   **Stopping Rule 2 (Purely Substantive):** If the answer to **3A or 3B is YES**, and Term T was not required to state the disagreement, the dispute is **Substantive**.
      *   *Action:* Discard Term T. Argue directly about the specific fact or value identified in Step 3.
  *   **Proceed to Step 4:** If you agree on facts/values *but* still feel a strong disagreement remains about whether Term T *should* apply, proceed to Step 4.

  ### Step 4: The Pragmatic Utility Test (The Chalmers/Sider Check)
  If you agree on facts/values but disagree on the label, ask: **"What work is this label doing?"**
  *   **Question 4A:** Does classifying O as T change how we interact with O in a way *not* covered in Step 3B?
  *   **Question 4B:** Is there a shared community standard or legal definition for T that one side is violating?
  *   **Question 4C:** Is one side claiming that T captures a "natural kind" (a real joint in nature) while the other claims T is arbitrary?

  *   **Stopping Rule 3 (Mixed/Conceptual):** If 4A, 4B, or 4C reveals a disagreement about **which conceptual framework is more useful**, the dispute is **Mixed**.
      *   *Action:* Acknowledge the verbal core (definitions) but recognize the substantive remainder is about **utility, convention, or ontology**. Argue about *why* we should carve reality this way, not whether O "is" T.

  ---

  ## Part II: Limitations and Bias Disclosure

  **Irreducible Judgment Calls:**
  This protocol cannot eliminate judgment. Step 4 requires humans to judge "utility." Two people may agree on all facts but genuinely disagree on which conceptual scheme is better (e.g., "Is biology more fundamental than psychology?"). This is a substantive philosophical disagreement, not a verbal one, even if it looks like one.

  **Error Bias:**
  *   **False Positives (Verbal):** The protocol biases toward finding disputes "Verbal." This is a feature, not a bug, for reducing acrimony. However, it risks dismissing deep conceptual incompatibilities (e.g., materialism vs. dualism) as "just definitions."
  *   **False Positives (Substantive):** If one party refuses to "Taboo" the term honestly (smuggling connotations back in), the protocol will falsely flag the dispute as substantive.

  **When This Fails:**
  *   **Power Dynamics:** If Term T is a legal weapon (e.g., "terrorist," "genocide"), the dispute is never merely verbal. The fight is over who controls the label's social consequences.
  *   **Indexicals:** Disagreements about "here," "now," or "I" cannot be resolved this way.
  *   **Fundamental Ontology:** If you disagree on whether *anything* exists (eliminativism), Step 3A will break.

  ---

  ## Part III: Worked Examples

  ### Example 1: The Hot Dog Sandwich Debate
  *Context: Internet food forum. Side A says "A hot dog is a sandwich." Side B says "No, it's not."*

  **Step 1: Contested Proposition**
  *   "A hot dog (in a split bun) is a sandwich."

  **Step 2: Taboo the Term**
  *   **Side A:** "It is meat served between two pieces of bread that are connected at the hinge."
  *   **Side B:** "It is meat served in a bun specifically designed for sausages, culturally distinct from sliced bread."
  *   *Observation:* Both describe the same physical object. No synonyms for "sandwich" used that aren't defined.

  **Step 3: Empirical and Normative Agreement**
  *   **3A (Empirical):** Do you disagree on the physics? No. Both agree on bread, meat, hinge.
  *   **3B (Normative):** Do you disagree on how to treat it? No. Neither side thinks it should be taxed differently or eaten with a fork vs. hands based on this label.
  *   *Result:* **Verbal Dispute.**

  **Step 4: Utility Test (Skipped, but for completeness)**
  *   Why argue? Side A cares about culinary taxonomy consistency. Side B cares about cultural tradition.
  *   *Resolution:* "We agree on the food. We disagree on whether the category 'sandwich' includes hinged buns. Let's stop arguing."

  ***

  ### Example 2: AI Understanding
  *Context: Rationalist forum. Side A says "LLMs understand language." Side B says "No, they just predict tokens."*

  **Step 1: Contested Proposition**
  *   "Model M **understands** English."

  **Step 2: Taboo the Term**
  *   **Side A:** "Model M can translate, summarize, answer questions, and pass Turing-style tests indistinguishably from a human."
  *   **Side B:** "Model M predicts tokens based on statistical weights without internal grounding or phenomenal experience."
  *   *Observation:* Side B smuggled "without grounding" into the description. Side A must accept that description as the current empirical consensus for the sake of the test.

  **Step 3: Empirical and Normative Agreement**
  *   **3A (Empirical):** Do you disagree on capabilities? **No.** Both agree it passes the tests.
  *   **3A (Internal):** Do you disagree on architecture? **No.** Both agree it's a transformer.
  *   **3B (Normative):** Do you disagree on rights/treatment? **Yes.**
      *   Side A implies: "If it understands, we might have obligations to it / it could be an agent."
      *   Side B implies: "If it's just math, it has no moral status."
  *   *Result:* **Mixed.** The word "understand" is carrying empirical weight (capabilities) and moral weight (status).

  **Step 4: Utility Test**
  *   **Question:** What work does "understand" do here?
  *   **Diagnosis:** Side A uses a *functionalist* definition (input/output). Side B uses a *phenomenological* definition (internal experience).
  *   **Substantive Core:** The disagreement is not about the word "understand." It is about: **"Does functional equivalence imply moral status or internal experience?"**
  *   *Resolution:* Stop arguing about "understanding." Argue about "moral status of functional equivalents." The verbal part is dissolved; the substantive part (AI safety/ethics) remains.

  ***

  ### Example 3: Fetal Personhood
  *Context: Political debate. Side A says "A fetus is a person." Side B says "A fetus is not a person."*

  **Step 1: Contested Proposition**
  *   "A fetus is a **person**."

  **Step 2: Taboo the Term**
  *   **Side A:** "A fetus is a living human organism with a unique genetic code from conception."
  *   **Side B:** "A fetus is a potential human that lacks consciousness, self-awareness, and viability."
  *   *Observation:* They are describing different properties. Side A focuses on genetics/biology. Side B focuses on cognition/capacity.

  **Step 3: Empirical and Normative Agreement**
  *   **3A (Empirical):** Do you disagree on biology? **Partially.** Side A emphasizes genetic uniqueness; Side B emphasizes lack of neural development. Both are factually true but selecting different facts.
  *   **3B (Normative):** Do you disagree on treatment? **Yes.**
      *   Side A implies: "It has a right to life."
      *   Side B implies: "It does not have a right to life that overrides bodily autonomy."
  *   *Result:* **Mixed.**

  **Step 4: Utility Test**
  *   **Question:** What work does "person" do here?
  *   **Diagnosis:** "Person" is being used as a **proxy for moral status**.
  *   **The Verbal Component:** Both sides agree on the biology (genetics vs. neurons). They disagree on which biological threshold triggers the label "person." This is a definitional choice.
  *   **The Substantive Component:** The real argument is: **"Which properties (genetics or consciousness) grant a right to life?"**
  *   *Resolution:*
      1.  Acknowledge the verbal dispute: "We are using different definitions of 'person' (Biological vs. Cognitive)."
      2.  Isolate the substantive dispute: "Given that we agree on the biology, do you believe genetic uniqueness alone grants rights, or is consciousness required?"
      3.  *Outcome:* The argument shifts from "Is it a person?" (which invites semantic circling) to "What grants rights?" (which invites ethical argument). This does not solve the abortion debate, but it prevents the participants from talking past each other about the word "person."

  ---

  ## How to Use This in a Comment

  If you see a thread spiraling, post this:

  > "This looks like we might be talking past each other. I'd like to propose we run a quick **Substantive-Verbal Disentanglement** on the claim '[Insert Claim]'.
  >
  > 1. Can we both restate our position without using the word '[Contested Term]'?
  > 2. If we do that, do we still disagree on the facts or the values?
  >
  > If we agree on facts/values but still disagree on the label, we should probably tab the term and discuss *why* we prefer one definition over the other, rather than fighting over which one is 'true.' Who wants to try restating it first?"
