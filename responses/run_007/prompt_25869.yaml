answer: |-
  This joint statement emerges from a sustained adversarial collaboration between proponents of Lewisian counterpart theory and proponents of transworld identity theory, undertaken with the aim of mapping the precise contours of our disagreement while isolating the substantial common ground that makes our debate intelligible. We begin by acknowledging that both sides are committed to a robust realism about modal truth, rejecting eliminativism or strict actualism that cannot account for the truth conditions of de re modal claims. We agree that possible worlds semantics provides the indispensable formal framework for analyzing modal discourse, even if we diverge sharply on the ontological status of the models we employ. Both sides accept that the data to be explained include our firm intuitions about possibility and necessity, such as the claim that Humphrey could have won the election, or that a specific table could have been made of different wood. We further agree that any adequate theory must provide a solution to the problem of accidental intrinsics, explaining how an object can possess a property in one world and lack it in another without violating logical laws. We also concur that the indexical analysis of actuality is correct in the sense that every possibility is actual from the perspective of the agents inhabiting it, though we differ on whether this indexicality stems from spatiotemporal isolation or from a privileged epistemic standpoint within an abstract space.

  Despite this shared foundation, our ontological commitments remain irreconcilable at the fundamental level. The counterpart theorist maintains that possible worlds are concrete, spatiotemporally isolated systems, and that individuals are world-bound, existing in exactly one world. On this view, when we say Humphrey could have won, we are speaking about a counterpart of Humphrey in another concrete world who resembles him closely enough to stand in for him under the contextually salient counterpart relation. The transworld identity theorist maintains that possible worlds are abstract entities, often construed as maximal consistent states of affairs or properties, and that individuals, or at least their essences, exist across multiple worlds. On this view, when we say Humphrey could have won, we are speaking about Humphrey himself, the very same individual, instantiating different properties in different possible worlds. The counterpart theorist insists that transworld identity is unintelligible because it violates the indiscernibility of identicals, forcing the transworld identity theorist to index properties to worlds in a way that looks suspiciously like counterpart relations. The transworld identity theorist insists that counterpart theory fails to capture the thisness of de re modality, reducing claims about what I could have done to claims about what someone else like me did, which fails to satisfy the truth conditions of our modal intuitions.

  We have identified that a portion of our dispute is merely verbal, specifically concerning the phrase exists in. When the transworld identity theorist says Humphrey exists in world W, they often mean that Humphrey's individual essence is exemplified in W, or that Humphrey has properties relative to W. When the counterpart theorist says Humphrey does not exist in W, they mean Humphrey is not spatiotemporally located in W. Once we disambiguate existence as spatiotemporal location versus existence as having an essence exemplified or having properties relative to a world, some of the heat dissipates. However, the substantive disagreement remains regarding the nature of individuation. The counterpart theorist holds that individuation is qualitative and based on similarity metrics that can shift depending on context, allowing for vagueness in identity across worlds. The transworld identity theorist holds that individuation is grounded in haecceities or primitive thisness, ensuring that identity is absolute and not subject to context-sensitive similarity weightings. This is not a verbal dispute, as it concerns whether there are non-qualitative facts about identity that transcend qualitative similarity.

  The central cruxes where further argument could potentially move one side toward the other involve the handling of haecceitistic differences and the logical coherence of property indexing. The first crux is whether counterpart theory can account for haecceitistic possibilities without admitting transworld identity. For instance, in a world where two qualitatively identical spheres exist, can we make sense of the possibility that Humphrey is one rather than the other? The counterpart theorist must explain how the counterpart relation picks out one sphere over the other without qualitative difference, risking a collapse into haecceitism which they typically reject. The transworld identity theorist argues that only primitive thisness can solve this. The second crux is whether transworld identity can solve the problem of accidental intrinsics without resorting to a three-place relation of having-a-property-at-a-world that functionally mimics the counterpart relation. If the transworld identity theorist must say Humphrey is tall-at-w1 and short-at-w2, they must explain why this does not fragment the individual into world-stages in a way that mirrors world-bound counterparts.

  Regarding the kinds of arguments both sides would accept as bearing on these cruxes, we agree that formal consistency and explanatory power are the primary adjudicators. We would both accept a formal proof demonstrating that counterpart theory cannot distinguish between certain haecceitistic scenarios without violating its own qualitative constraints. Conversely, we would both accept a demonstration that transworld identity theory entails a violation of Leibniz's Law that cannot be repaired by property indexing without rendering the notion of an individual incoherent. We also agree that considerations of theoretical virtue, such as parsimony and alignment with scientific practice, are relevant. The counterpart theorist values the parsimony of not positing primitive haecceities and the alignment with a naturalistic ontology of concrete worlds. The transworld identity theorist values the parsimony of not multiplying entities across worlds for every modal claim and the alignment with our pre-theoretic intuitions about personal identity and responsibility.

  In terms of predictions about how these cruxes will resolve, each side records their expectation here. The counterpart theorist predicts that further analysis will show that haecceitistic intuitions are misguided or can be explained away by contextual shifts in the counterpart relation, and that the transworld identity theorist's reliance on primitive essences is an admission of explanatory failure. They predict that the transworld identity theorist will eventually be forced to adopt a form of property indexing so robust that it becomes indistinguishable from counterpart theory in practice, rendering the claim of transworld identity merely notational. The transworld identity theorist predicts that further analysis will show that counterpart theory fails to preserve the truth conditions of de re modal claims, particularly those involving self-identity and moral responsibility, because the Humphrey objection remains decisive. They predict that the counterpart theorist will be forced to admit that the counterpart relation must be grounded in something like individual essence to avoid arbitrariness, thereby conceding the core insight of transworld identity. We sign this statement not to declare victory, but to confirm that our disagreement is precise, substantive, and productive, and to commit to addressing these cruxes without talking past one another in future dialectic.
