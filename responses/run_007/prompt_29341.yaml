      *   *The Conceptual Problem (Defining "Perception" and "Cognition"):* This is crucial. If "perception" is defined functionally (early processing) vs. phenomenally (what it's like), the debate shifts. If "cognition" includes unconscious semantic priming vs. conscious belief, the bar for "penetration" changes.
