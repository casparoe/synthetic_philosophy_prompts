      *   *The Normative/Stakes Issue:* Why do we care? Pro-CP often wants to show theory-ladenness (implications for objectivity, science, prejudice). Anti-CP often wants to preserve a foundationalist epistemology (perception as a neutral check on belief). The stalemate might be driven by these underlying philosophical commitments.

