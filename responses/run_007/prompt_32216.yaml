  6.  **Developing the Social Media Conclusion:**
      *   Does it follow? Yes, if we correct the definition of "public" to mean "anonymous aggregate" rather than "poor people." The mechanism of irresponsibility is the same.

  7.  **Drafting the Verdict:**
      *   Needs to be one sentence.
      *   Needs to start with "Verdict:".
      *   Needs to capture the mix of insight and caricature.

  8.  **Review against Constraints:**
