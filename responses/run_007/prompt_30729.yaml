answer: |-
  1.  **The Local Argument**
      Let's start with the moment you open the envelope. You see $10. The immediate intuition is that the other envelope is equally likely to hold $5 or $20, which gives switching a positive expected value. You argue this 50/50 assumption is where the error lies—that it smuggles in an impossible uniform prior. But why does a one-shot, real-world decision require me to have a prior over *all* possible dollar amounts in the universe? Why can't I just assess the local odds without committing to a global distribution?

  2.  **Follow-up to Question 1**
      *(Ask this if he says the 50/50 assumption just is a uniform prior in disguise.)*
      If assuming 50/50 locally is identical to assuming a uniform prior globally, that implies my state of ignorance about a single event forces me into a specific metaphysical commitment about the entire range of possible money. Isn't that backwards? Shouldn't the paradox show that expected utility theory breaks down when faced with radical ignorance, rather than blaming the agent for having the wrong prior?

  3.  **The Before/After Asymmetry**
      Before you open the envelope, the setup is perfectly symmetric; switching can't be strictly better than staying. But after opening, your expected-value calculation suggests switching is always superior. Why should seeing a number—which tells you nothing about whether you're holding the larger or smaller amount—turn a neutral act into a strictly better one? How does mere conditioning on a value break the symmetry of the physical setup?

  4.  **Follow-up to Question 3**
      *(Ask this if he says the amount you see matters once you condition on a prior.)*
      If the number matters only because it conditions your prior, then the advantage of switching depends entirely on your background beliefs about the money distribution, not the game itself. Doesn't that mean the paradox isn't about rational choice at all, but just about having incomplete information? If I knew the prior, the puzzle vanishes; if I don't, you say I can't decide. Is the "paradox" just a fancy way of saying "missing data"?

  5.  **The One-Shot Finite Case**
      Let's make this concrete. If I handed you two envelopes right now, and you looked in one to see an ordinary sum, would you refuse to give a flat answer about switching? Doesn't saying the problem is "under-specified" leave everyday decisions paralyzed? In the real world, we act without perfect priors all the time. Why does expected utility theory demand perfection here but not elsewhere?

  6.  **Follow-up to Question 5**
      *(Ask this if he says in real life you'd have background beliefs about how much money people put in envelopes.)*
      So you're saying the paradox dissolves because in reality, I'd rely on heuristics about typical cash amounts. But philosophers use this puzzle to test the limits of rationality in the abstract. If the solution is just "use real-world context," haven't you sidestepped the theoretical problem? Does your view imply that expected utility theory simply doesn't apply to abstract, de-contextualized gambles?

  7.  **Infinite-Expectation Variants**
      There are variants of this puzzle, flavored like the St. Petersburg paradox, where the expected value is infinite and always switching can actually be licensed by expected-value reasoning. Does your uniform-prior diagnosis still handle those cases, or is the real culprit infinite expectation? If it's infinite expectation, aren't you just relocating the paradox rather than dissolving it?

  8.  **Follow-up to Question 7**
      *(Ask this if he says those are a different problem.)*
      If you segregate the infinite cases as a different problem, you're left with two distinct puzzles that generate the exact same intuition: that switching seems rational. If the psychological pull is identical, shouldn't the explanation be unified? By splitting them, are you protecting expected utility theory from a broader critique about how it handles uncertainty?

  9.  **Blind Switching and Counterexamples**
      Consider the loop: you decide to switch before looking, then apply the same reasoning to the new envelope and switch back, forever. What does your view say goes wrong in that loop? Furthermore, would a proper prior with a finite mean, where switching is still favored conditional on every amount you might see, count as a counterexample to your view? Is such a prior even constructible, or does unconditional symmetry rule it out?

  10. **The Closer**
      Beyond the lesson that improper priors are trouble, what has this paradox actually taught us? Is there any residual psychological or philosophical puzzle left, or is it fully defused? If it's fully defused, why does the intuition that switching is better remain so stubbornly persuasive even for experts who know your solution?
