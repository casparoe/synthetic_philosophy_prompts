      *   *Key Phenomena:*
          1.  **Adams's Thesis (The Probability Constraint):** $P(A \to C) = P(C|A)$. Motivation: Aligns with scientific reasoning (forecasting).
          2.  **The Ramsey Test:** Evaluating $A \to C$ by hypothetically adding $A$ to beliefs and checking $C$. Motivation: Describes actual cognitive process.
          3.  **Modus Ponens (MP):** $A, A \to C \vdash C$. Motivation: Fundamental inference rule.
          4.  **Import-Export (IE):** $(A \to (B \to C)) \equiv ((A \land B) \to C)$. Motivation: Structural intuition about nested conditions.
          5.  **Embedding/Negation:** Conditionals sound weird in negations or disjunctions ("It is not the case that if A then C"). Motivation: Linguistic data.
          6.  **Non-monotonicity (Defeasibility):** $A \to C$ does not imply $(A \land B) \to C$. Motivation: Scientific diagnosis (new data changes conclusions).
