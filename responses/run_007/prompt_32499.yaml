answer: |-
  # The Bootstrapping Impossibility of Acausal Coercion

  **Thesis:** Acausal threats fail to generate rational obligations for the threatened party because the threatener cannot rationally adopt the necessary disposition to carry them out. Unlike causal precommitment, where physical constraints anchor the commitment, acausal commitment relies on logical correlation. The rational adoption of a disposition to carry out an acausal threat is a surrogate goal that presupposes its own efficacy, creating a bootstrapping problem that renders the threat non-credible to a rational observer.

  ### I. Causal Precommitment vs. Acausal Threats

  To understand the failure of acausal coercion, we must first distinguish it from standard strategic commitment. In causal decision theory (CDT), a threat is made credible through **causal precommitment**. Consider the game of *Chicken*. A driver can credibly threaten to never swerve by physically removing their steering wheel and tossing it out the window where the opponent can see it. This action causally alters the payoff matrix: the option to swerve no longer exists. The opponent, observing this physical fact, updates their beliefs and rationally swerves to avoid the crash. The commitment is binding because the mechanism of constraint (the missing wheel) is causally independent of the opponent's subsequent decision.

  An **acausal threat**, by contrast, operates within the framework of acausal decision theory (ADT), such as Timeless or Updateless Decision Theory. Here, agents do not influence each other through physical signals or causal chains. Instead, influence is mediated by **logical correlation**. Agent A threatens Agent B by asserting, "If you defect, I will defect." This threat is credible only if Agent B's decision algorithm logically correlates with Agent A's. Agent B reasons, "If I defect, a simulation of me in A's mind would defect, causing A to defect." There is no physical burning of bridges; there is only the logical structure of the agents' source codes.

  The critical distinction lies in the **anchor of credibility**. In the causal case, the anchor is physical and sunk (the wheel is gone). In the acausal case, the anchor is logical and internal (the source code). This difference is fatal for threats, as we shall see.

  ### II. The Surrogate Goal and Its Rational Adoption

  For a threat to be effective, it must be credible. In many strategic interactions (e.g., Prisoner's Dilemma variants), carrying out a threat is **ex-post irrational**. Once the opponent has defected, punishing them often costs the threatener resources without recovering losses. A purely rational agent, at the moment of execution, would choose not to punish. Therefore, to make the threat credible, the agent must possess a **disposition** to punish regardless of ex-post costs.

  This disposition functions as a **surrogate goal**. The agent modifies their utility function to intrinsically value "punishment" or "revenge," not because punishment is inherently good, but because having this value influences the opponent's behavior ex-ante. The goal is surrogate because it is adopted instrumentally to secure a primary goal (e.g., resource acquisition), masquerading as a terminal value.

  Why does this matter? In causal precommitment, I can physically force myself to adhere to a surrogate goal (e.g., a contract with a third-party enforcer). In acausal reasoning, I cannot physically force my future self; I can only *be* a certain type of agent. I must select my source code. The rationality of selecting a source code containing a surrogate goal depends entirely on the expected utility of that selection.

  ### III. The Bootstrapping Problem

  Here we encounter the core impossibility. For the threatener (Agent A) to rationally adopt the surrogate goal of "vengeance," they must calculate that doing so yields higher expected utility than not adopting it. This expected utility is derived entirely from the fact that the threatened party (Agent B) will comply to avoid the punishment.

  However, Agent B will comply *only if* they believe Agent A has genuinely adopted the disposition. In an acausal context, Agent B determines this belief by simulating Agent A's rationality. Agent B asks: "Is it rational for A to have this disposition?"

  This creates a **bootstrapping loop**:
  1.  Agent A adopts the disposition *because* it influences Agent B.
  2.  Agent B is influenced *because* Agent A adopted the disposition.
  3.  But Agent B knows that Agent A adopts the disposition *only because* it influences Agent B.

  In causal cases, the loop is broken by the physical act (burning the bridge). The physical act is a sunk cost that exists independently of the opponent's reasoning. In acausal cases, the "act" is the logical fact of the agent's decision procedure. If Agent B recognizes that Agent A's disposition is purely instrumental (a surrogate goal adopted solely for efficacy), Agent B can **screen off** the threat.

  Agent B reasons: "Agent A values revenge only instrumentally. Instrumental values are discarded when they cease to serve their purpose. Once I have made my decision, the efficacy of the threat is determined. If I defect, the threat fails to deter. At that point, carrying out the threat is costly and serves no instrumental purpose. Since A is rational, A will not carry out the threat. Therefore, A's claim to have a 'vengeance' disposition is a bluff."

  The bootstrapping problem is that the efficacy of the surrogate goal presupposes that the goal is treated as terminal by the observer. But a rational observer knows it is surrogate. A rational threatener knows the observer knows this. Thus, a rational threatener cannot rationally adopt the disposition, because they know it will not be believed. The threatener cannot pull themselves up by their own bootstraps: they cannot create a logical fact of "irrational" commitment through a process of rational calculation that the opponent can see through.

  ### IV. Distinction from Standard Deterrence Paradoxes

  It is crucial to distinguish this bootstrapping problem from the standard **paradox of deterrence**. The standard paradox asks: "Why carry out the threat ex-post when it is costly?" The standard solution is precommitment: "I bound myself ex-ante so I don't have a choice ex-post."

  The bootstrapping problem identified here is more fundamental. It asks: "Why bind yourself ex-ante when the binding mechanism is transparently instrumental?"
  *   **Standard Deterrence:** Assumes the precommitment is possible and credible. The paradox is about the execution.
  *   **Acausal Bootstrapping:** Argues the precommitment itself is impossible to render credible via rational choice alone.

  In causal precommitment, I can hide the steering wheel *before* you see it. The physical reality of the missing wheel is independent of your simulation of my mind. In acausal threats, the "missing wheel" is a line of code in my decision procedure. If that line of code was written *because* I calculated it would scare you, your simulation of me reveals the calculation. You see that the code is contingent on its own success. Since your decision determines its success, the code is contingent on your decision. This circularity dissolves the binding nature of the threat. The threatened party is not bound because they recognize the threatener is not bound.

  ### V. Objection and Response

  **Objection:** *Source Code Transparency.*
  One might object that in advanced acausal scenarios (e.g., between AI agents), source code is fully transparent. If Agent B can literally read Agent A's code and see the `if defection then punish` function hard-coded, then the bootstrapping argument fails. Agent B doesn't need to simulate Agent A's rationality; they can simply observe the disposition directly. The threat is physically (or digitally) present, analogous to the burnt bridge.

  **Response:**
  Transparency of code does not solve the bootstrapping problem because rational agents are **updateable**. Merely observing a line of code is insufficient; Agent B must assess whether that code is *stable* under rational reflection.

  If Agent A is a rational expected-utility maximizer, their source code is not a static artifact; it is the output of their optimization process. Agent B knows that if Agent A's code contains a costly vengeance module, Agent A would have installed it only if it increased expected utility. Agent B also knows that once the decision node is reached (ex-post), the vengeance module reduces utility.

  In a transparent acausal setting, Agent B simulates Agent A's *decision to run the code*. Agent B realizes: "Agent A is running this code only because they expect me to comply. If I do not comply, the code becomes a liability. Since Agent A is rational, if they could rewrite their code ex-post, they would. While they may not be able to rewrite the code physically, in acausal reasoning, the 'decision' is the logical output of the algorithm. If the algorithm is 'Maximize Utility,' and 'Punish' minimizes utility ex-post, the logical output will be 'Don't Punish,' regardless of what the static text of the code says."

  Essentially, transparency reveals the **instrumentality** of the disposition. A surrogate goal only functions if it mimics a terminal goal. Transparency strips away the mimicry. Agent B sees that the "terminal" value is actually a calculated instrument. Knowing this, Agent B knows the instrument will be dropped when it stops working. Therefore, the code does not bind Agent A logically, and consequently, it does not bind Agent B strategically. The threat remains non-credible because the rationality of the threatener undermines the stability of their own commitment.

  ### Conclusion

  Acausal threats rely on the threatener convincing the threatened party that they will act against their own ex-post interests. In causal worlds, this is achieved by physically removing the option to act in one's interest. In acausal worlds, this must be achieved by logical correlation. However, the rational adoption of the disposition required to sustain this correlation is a surrogate goal. Because the efficacy of a surrogate goal depends on it being perceived as terminal, and because a rational threatened party can infer its instrumental nature, the threatener cannot rationally adopt the disposition in a way that survives scrutiny. The bootstrapping problem ensures that the threatener's rationality undermines their own credibility. Consequently, the threatened party is never rationally bound to comply, as they can deduce that the threat will not be carried out by a rational agent.
