              6.  In acausal settings, the "belief" is based on logical inference of the Threatener's rationality.
              7.  A rational Threatener sees the bootstrapping: "I should only adopt this if it works. It only works if you think I adopted it. But you thinking I adopted it depends on you thinking it's rational for me to adopt it."
              8.  Unlike causal precommitment, there is no external anchor (the burnt bridge). The anchor is the rationality of the adoption itself.
              9.  Since the efficacy is endogenous to the adoption, the rationality is circular.
              10. Therefore, the Threatened Party knows the Threatener cannot rationally bind themselves. Therefore, the threat is not binding on the Threatened Party.

      *   **Section 4: Distinction from Standard Deterrence Paradoxes.**
          *   Standard Paradox: "Why punish after the fact?" (Deterrence paradox). Solved by precommitment.
          *   Acausal Bootstrapping: "Why adopt the precommitment disposition at all?"
          *   In causal, I can physically force myself. In acausal, I must *logically* be the type of agent who does this. But if I choose my type based on outcomes, and the outcomes depend on your reaction to my type...
          *   The key is the lack of an independent causal channel to verify the commitment.

      *   **Section 5: Objection and Response.**
          *   Objection: Acausal Trade works (e.g., between simulations). Why not threats? If I simulate you, and you simulate me, we can correlate.
          *   Response: Trade involves positive-sum cooperation where both benefit from the correlation. Threats involve negative-sum punishment. The surrogate goal (vengeance) is costly. In trade, the "goal" is the outcome itself. In threats, the goal is the *punishment*, which is utility-negative. The bootstrapping fails because the "commitment" consumes resources without causal leverage.
