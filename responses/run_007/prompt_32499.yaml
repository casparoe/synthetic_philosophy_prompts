          *   So, we adopt a disposition (utility function modification). We value "punishment" intrinsically.
          *   This is a *surrogate* goal. It's instrumental, not terminal.
          *   Why it matters: Rational adoption of instrumental goals depends on their expected utility.
      *   **Section 3: The Bootstrapping Problem.**
          *   To rationally adopt the disposition, I must expect it to yield better outcomes.
          *   It yields better outcomes *only if* the opponent predicts/anticipates this disposition and complies.
          *   In causal cases, I can *show* the commitment (burn the bridge). The physical act is the evidence.
          *   In acausal cases, the "evidence" is the logical fact of my decision procedure. But my decision procedure is chosen *because* I expect it to work.
          *   The Loop: I adopt the goal because it influences you. You are influenced because I adopted the goal. But in acausal reasoning (like Timeless Decision Theory), the correlation exists because we are similar or simulate each other. If I adopt the goal *solely* to influence you, does that break the correlation?
          *   Refining the argument: The claim is about the *threatened party*. Why is it not binding on *them*?
