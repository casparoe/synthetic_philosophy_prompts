          *   *Correction/Refinement:* The prompt says the disposition is a surrogate goal whose adoption *presupposes the very efficacy*.
          *   Argument flow:
              1.  Threatener needs a disposition to carry out the threat (to make it credible).
              2.  This disposition is a surrogate goal (costly ex-post, useful ex-ante).
              3.  Rational adoption requires expected utility > status quo.
