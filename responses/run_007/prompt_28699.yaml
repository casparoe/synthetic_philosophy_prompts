answer: |-
  # Q&A Prep Sheet: Sartre, Freedom, and Bad Faith
  **Audience:** Analytic Action Theory / Naturalistic Metaphysics
  **Strategy:** Translate phenomenological claims into philosophy of mind/action vocabulary. Avoid "continental" jargon where possible.

  ### 1. The Error Theory of Phenomenology [HOPE NOBODY ASKS]
  **Objection:** "You argue that radical freedom is a structural feature of first-personal experience. But cognitive science (e.g., Wegner, Libet) suggests the 'feeling of agency' is a post-hoc confabulation generated by subpersonal neural processes. If the phenomenology itself is a user-illusion, doesn't your entire transcendental argument collapse into an error theory? You're building a metaphysics on a bug in the cognitive architecture."

  **Reply (2 mins):**
  "I grant that empirical work shows many *specific* judgments of agency are fallible. However, Sartre isn't making a claim about the accuracy of specific causal attributions (e.g., 'I caused my arm to rise'). He is making a claim about the *structure of intentionality*. Even if my feeling of control is an illusion, the *experience* of that illusion still presents the world as a field of possibilities to be navigated.
  For Sartre, consciousness is always 'consciousness of something'—it is inherently world-directed and projective. To experience an illusion *as* an illusion still requires a stance of negation ('this is not the reality'). That capacity to step back from the given, even to be deceived by it, is the 'nothingness' Sartre describes. The neuroscientific account explains the *cause* of the experience, but it cannot eliminate the *first-personal structure* of having to act within that experience. We are 'condemned' to navigate the world *as if* we are free, because that is the mode in which the world appears to a deliberating agent. Denying this doesn't solve the problem; it just ignores the data of experience that any theory of agency must eventually accommodate."

  **Weakness:** This concedes the empirical point to save the phenomenological one. If they press that the *structure* itself is determined, you have no empirical counter-argument, only a methodological insistence on the autonomy of phenomenology.

  ### 2. The Charge of Ontological Inflation
  **Objection:** "You insist this isn't metaphysics, but you rely on 'nothingness,' 'negativity,' and a consciousness that is 'what it is not.' This looks like ontological inflation. Why posit a special ontological status for consciousness when a naturalistic account of representational states supervening on physical states suffices? Aren't you violating Quinean parsimony?"

  **Reply (2 mins):**
  "This is a category mistake regarding the type of ontology Sartre is proposing. He is not positing 'nothingness' as a spooky substance or a causal force competing with physics. He is describing a *relational* property. 'Negativity' is just the logical structure of expectation and possibility inherent in intentionality.
  When I see a cup, I see it as 'fillable' or 'breakable.' These aren't physical properties of the clay; they are relations to my projects. Sartre's claim is that you cannot reduce these normative/teleological relations to brute physical facts without losing the phenomenon of agency itself. I'm not asking you to add entities to your inventory of the universe; I'm asking you to acknowledge that the *space of reasons* cannot be fully reduced to the *space of causes* without explanatory loss. It's a claim about the irreducibility of the personal level, not the existence of ghostly substances."

  **Weakness:** Analytic naturalists often reject the "irreducibility of the personal level" as a placeholder for future neuroscience. You risk sounding like a dualist in disguise.

  ### 3. The Doxastic Paradox of Bad Faith
  **Objection:** "Standard analytic accounts of self-deception treat it as a doxastic conflict (believing *p* and *not-p*) or a motivational bias. Sartre rejects the unconscious, so how does the agent deceive themselves without knowing the truth? If I know the truth, I'm not deceived. If I don't, I'm not lying. How does Sartre solve the static paradox of self-deception without positing subpersonal modules?"

  **Reply (2 mins):**
  "Sartre's solution is to reject the model of self-deception as *lying to oneself*. He argues bad faith is not a contradiction between two beliefs, but a flight from the *anxiety* of a single, ambiguous reality.
  Consider the waiter 'playing at being a waiter.' He doesn't believe 'I am essentially a waiter' and 'I am not a waiter.' Rather, he emphasizes his *facticity* (his role, his routine) to obscure his *transcendence* (his ability to quit). It's a unified consciousness shifting its focus. It's not that I hold contradictory propositions; it's that I attend to one aspect of my situation to ignore another. This is compatible with modern accounts of 'motivated attention' or 'affective framing.' Bad faith is a strategy of focus, not a logical contradiction in the belief box."

  **Weakness:** This stretches the definition of "belief." If they insist self-deception requires contradictory beliefs, Sartre's account looks like mere avoidance, not deception.

  ### 4. Empirical Adequacy and the Unconscious
  **Objection:** "Sartre famously rejects the Freudian unconscious. But contemporary cognitive science confirms vast amounts of processing are inaccessible to the first-person perspective. If my desires are shaped by implicit biases or traumatic conditioning I cannot access, in what sense am I 'radically free' to choose my projects? Isn't Sartre's account empirically falsified?"

  **Reply (2 mins):**
  "Sartre does not deny that there are psychic facts outside of thematic awareness. He denies that these facts *determine* consciousness. You can have a repressed trauma (facticity) that influences you, but it only influences you *insofar as you take it up* in your current projects.
  Think of it this way: A cognitive bias might incline me toward a judgment, but it cannot force me to *endorse* that judgment. The 'freedom' Sartre describes is the gap between the stimulus (or bias) and the endorsement. Empirical constraints limit the *situation* in which I choose, but they do not eliminate the *choice* of how to interpret that situation. Sartre's claim is compatible with a mind that has subpersonal modules, provided those modules don't exhaust the capacity for reflective endorsement."

  **Weakness:** Hard determinists will argue that "endorsement" is itself causally determined by prior states. You are asserting a normative capacity they deny exists.

  ### 5. Grounding Moral Responsibility
  **Objection:** "Even if I grant your phenomenological claim, why does it matter? Compatibilists ground responsibility in reasons-responsiveness or hierarchical alignment. If your 'freedom' is just a structural feature of experience that persists even in coercion (as Sartre suggests), doesn't it fail to do the work we need freedom to do? It doesn't track the control condition required for blame."

  **Reply (2 mins):**
  "You are right that Sartrean freedom doesn't track the *control condition* for blame in the way compatibilists want. It grounds a different kind of responsibility: *authorship*.
  Even if I am coerced, I still choose how to interpret the coercion (resistance, submission, resentment). Sartre's account is meant to capture the inescapable burden of meaning-making. It's not about whether you *could have done otherwise* in a causal sense; it's about the fact that your life has no meaning other than what you confer upon it. This grounds a form of responsibility that is existential rather than retributive. It's not about whether we should punish you, but whether you can disown your actions. Sartre says you cannot."

  **Weakness:** This concedes that Sartrean freedom doesn't support traditional moral responsibility (blame/praise), which may disappoint the moral philosophers in the room.

  ### 6. Frankfurt-Style Cases
  **Objection:** "Frankfurt cases show that moral responsibility doesn't require the ability to do otherwise. Sartre insists we are 'condemned' to be free, implying alternate possibilities are always open. If Frankfurt is right, isn't Sartre's insistence on radical leeway freedom obsolete?"

  **Reply (2 mins):**
  "Frankfurt cases target the *Principle of Alternate Possibilities* (PAP) as a condition for responsibility. Sartre isn't defending PAP as a metaphysical thesis about causal branching. He is describing the *experience* of deliberation.
  In a Frankfurt case, the agent doesn't *know* they are being manipulated. From the first-person perspective, the possibilities *appear* open. Sartre's claim is about the lived reality of the agent, not the omniscient view of the theorist. Even if a counterfactual intervener exists, I cannot live *as* a determined being. I must deliberate. So, while Frankfurt might defeat libertarian metaphysics, he doesn't defeat the phenomenological claim that we must act under the idea of freedom."

  **Weakness:** This retreats to "freedom is an illusion we can't escape," which weakens the claim that freedom is *real*.

  ### 7. Ontological Parsimony (Quinean Critique)
  **Objection:** "Why use the term 'nothingness' at all? It invites confusion. If you mean 'the capacity for negation in language and thought,' why not just say that? Isn't the dramatic ontology unnecessary?"

  **Reply (2 mins):**
  "Fair point. 'Nothingness' is a provocative label for the capacity of negation. However, Sartre insists it's not just linguistic. It's the experience of absence. When I look for Pierre in the café and he isn't there, the 'absence' is a real feature of my experience, not just a failed proposition.
  I agree we should avoid reifying 'nothingness' into a thing. But we shouldn't eliminate the phenomenon either. If 'capacity for negation' captures it for you, I'm happy to translate. The core claim remains: human reality is defined by its ability to introduce negation into the world (asking 'what if?', 'what is not'). Call it what you like, but don't ignore the phenomenon."

  **Weakness:** This is a terminological concession that might make the audience feel Sartre's ontology was just poetic excess all along.
