  **What the empirical evidence actually shows**
  The 2011 MIT study (Held et al.) on Project Prakash is the gold standard. Patients aged 8-17 gained sight. Immediately post-op, they could not match tactile objects to visual ones. This supports Sasha's "No" regarding immediate recognition. However, it complicates Lena's "concept" argument. The rapid learning suggests the *potential* for mapping exists, but the *connection* isn't innate. This undermines strong nativism (that the concept is fully formed and waiting) but supports a weaker connectionism. The evidence confirms cross-modal transfer is not automatic, validating the empirical "no," but the speed of learning leaves room for Lena's claim that the *capacity* for amodal understanding is present, just uncalibrated. It shows the brain is not a blank slate, but neither is it pre-loaded with mapped geometry. Crucially, the deficit was specifically in *correspondence*, not shape perception itself. Patients could see edges and curves but couldn't link them to haptic memories. This nuances Sasha's victory: the sensory data was there, but the integration was missing. It also nuances Lena's defense: the concepts weren't inaccessible, just unlinked. The evidence suggests a hybrid view: concepts may be amodal, but the translational dictionary between senses must be learned.

