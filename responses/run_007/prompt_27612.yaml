  ok so i'm prepping a section on Wittgenstein's private language argument and before I teach it I want to sort out what I actually think, because I keep finding myself nodding along to both sides. Here are the commitments I seem to have ended up with, and I'd like to know wether they hang togehter:

  (1) The core of the argument is right: there can't be a language whose words refer to something only the speaker has access to, where in principle no one else could ever learn or check the use of the words.

  (2) The initial reference of a sensation word gets fixed by attending to a sample feeling — I attend to a particular pain and stipulate that this is what I'll mean by 'zing' — and I don't see what else could do that job.

  (3) I can't be wrong about whether I'm in pain right now, and first-person reports of sensations have an authority that third-person reports lack.

  (4) What settles whether a later use of a word is correct can't be my memory of the sample; it has to be the ongoing public practice of use.

  (5) Someone could have a genuinely novel sensation that no one else has ever had, and could coin a word for their own use to keep track of whether the same feeling comes back.

