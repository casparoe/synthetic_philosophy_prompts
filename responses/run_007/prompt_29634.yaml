          *   *Draft:* Q1: Ideal Gas.

      *   *Case 2: Consciousness/Neuroscience.* The hard problem. Best for Strong Emergence vs. others.
          *   Options: A) Illusion/Just neurons (Elim), B) Caused by neurons but distinct (NRP), C) Exerts new force (Strong).
          *   *Draft:* Q2: The Perfect Brain Simulation.

      *   *Case 3: Biology/Genetics.* Multiple Realizability.
          *   Options: A) DNA explains all (Red), B) Function matters more than substrate (NRP/Pluralism), C) Life force (Strong - dated but useful contrast).
          *   *Draft:* Q3: The Gene "For" a Trait.

      *   *Case 4: Economics.* Social sciences. Good for Pluralism vs. Reduction.
          *   Options: A) Just individual psychology (Red/Elim), B) Market forces are real patterns (Weak/NRP), C) Economy dictates individual choices (Strong Downward).
          *   *Draft:* Q4: The Stock Market Crash.

      *   *Case 5: Phase Transitions.* Physics edge case.
          *   Options: A) Limit of particle math (Red), B) New mathematical structure (Weak/NRP), C) Discontinuous break (Strong?).
          *   *Draft:* Q5: Water Freezing.

      *   *Case 6: Conway's Game of Life.* Computational emergence.
          *   Options: A) Just cell states (Elim/Red), B) Gliders are real patterns (Weak), C) Gliders affect cell rules (Strong - impossible in GoL, so tests consistency).
          *   *Draft:* Q6: The Digital Glider.

      *   *Case 7: Chemistry.* Bonding.
