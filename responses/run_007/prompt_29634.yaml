      *   *Nagelian Reductionism:* Higher-level laws derive from lower-level laws + bridge rules. In principle, everything is explainable from the bottom up. (e.g., Temperature *is* kinetic energy).
      *   *Non-reductive Physicalism (NRP):* Everything is physical, but higher-level properties are distinct and causally potent in their own right. Multiple realizability is key. (e.g., Pain is physical but not *just* C-fibers).
      *   *Weak Emergence:* Higher-level patterns are unexpected/unpredictable without simulation, but ontologically grounded in the bottom level. (e.g., Game of Life gliders).
      *   *Strong Emergence:* Higher-level properties have *new* causal powers not derivable from the bottom level. Downward causation. (e.g., Consciousness affecting matter).
      *   *Pragmatic Pluralism:* It depends on the context/goal. Different descriptions are tools, not competing truths. (e.g., Economics vs. Physics).

  3.  **Drafting Questions (Iterative Process):**
      *   *Constraint Check:* Must avoid banned words. Must be concrete cases.
      *   *Goal:* Differentiate the positions.

