      *   So the core cluster (1, 2, 3, 4, 6) is very tight.
      *   (5) is the odd one out. It asserts a solution to the problem defined by (2) and (3).

      *   *Cheapest Revision:* Qualify (5). Instead of "can be made reliable enough," say "must be made reliable enough, and here is why we think it's possible." Or "are our *best hope* for defense" rather than "reliable enough to serve as our main defense."
