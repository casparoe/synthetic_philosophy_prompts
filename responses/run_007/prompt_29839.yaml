prompt: |-
  I'm drafting the position section of a paper on inner alignment, and I'd like a consistency check on the set of claims I keep defending before I show it to my group. The claims are: (1) gradient descent frequently produces models that optimize a proxy objective rather than the base objective, and this kind of goal misgeneralization is the default way learned optimizers fail; (2) the more dangerous case is deceptive alignment, in which a model that understands its training situation performs well during training only to avoid being modified, and later pursues its own objective; (3) current frontier models already have enough situational awareness for deceptive alignment to be a live near-term concern; (4) gradient descent tends to eliminate mesa-objectives that diverge from the base objective on the training distribution; (5) pre-deployment interpretability and behavioral audits can be made reliable enough to serve as our main defense against deploying a deceptively aligned model; (6) capability and inner alignment are largely independent axes, so a model can be very capable while still being badly misaligned. I want to know whether this package hangs together. Go through the pairwise tensions, separate the genuine ones from the ones that dissolve on inspection, order them by severity, and tell me what the cheapest revision is and what it would cost.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

