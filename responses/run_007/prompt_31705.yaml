  # JOINT STATEMENT ON MENTAL CAUSATION AND THE EXCLUSION PROBLEM
  **Date:** October 26, 2023
  **Participants:** [User] (Nonreductive Physicalist) and [Friend] (Exclusionist/Reductive Physicalist)

  ## PREAMBLE
  This document records the outcome of an adversarial collaboration regarding the causal efficacy of mental properties. Our goal was not to force consensus where none exists, but to precisely locate the locus of our disagreement, distinguish substantive metaphysical disputes from verbal misunderstandings, and identify empirical or argumentative cruxes that could rationally move either party. We affirm that both positions operate within a broadly physicalist ontology and reject substance dualism.

  ## I. SHARED COMMITMENTS
  *We both sign the following claims as the baseline for our dispute.*

  1.  **Physical Ontology:** We agree that all concrete particulars in the world are physical. There are no non-physical substances (e.g., Cartesian souls). Mental states depend entirely on physical substrates (supervenience or realization).
  2.  **Causal Closure of the Physical (CCP):** We agree to accept the premise that for every physical event $e$ that has a cause at time $t$, there exists a sufficient physical cause $c$ at $t$. We disagree only on whether this premise *entails* the exclusion of mental causes.
  3.  **Validity of the Exclusion Argument:** We agree that Jaegwon Kim's Causal Exclusion Argument is logically valid. If one accepts the premises (CCP, Exclusion Principle, Distinctness), the conclusion (Epiphenomenalism or Identity) follows. Our dispute concerns the truth of the premises and the interpretation of the terms.
  4.  **No Systematic Overdetermination:** We agree that the world is not systematically overdetermined by independent causal chains (analogous to two assassins shooting a victim simultaneously). Any account of mental causation must avoid positing widespread, coincidental overdetermination.
  5.  **Phenomena to be Preserved:** We agree that any adequate metaphysical account must accommodate the following data:
      *   **Ordinary Explanation:** In folk psychology, citing reasons (beliefs/desires) genuinely explains actions (e.g., "She raised her hand *because* she wanted to vote").
      *   **Cognitive Science:** In scientific practice, high-level variables (e.g., "working memory load," "attentional focus") are treated as causal drivers in successful predictive models and interventions.
      *   **Normativity:** Agents are held morally responsible for actions based on their mental states, implying those states made a difference to the outcome.

  ## II. MAP OF DISAGREEMENTS AND CRUXES
  *The following table isolates our remaining substantive disagreements. For each, we identify the "Crux" (the specific sub-question), a concrete test case, and our respective predictions.*

  | Disagreement | Friend's Position (Exclusionist) | User's Position (Nonreductive Physicalist) | Crux (Sub-question) | Concrete Test / Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Exclusion Principle** | The Exclusion Principle holds universally: If $c$ is sufficient for $e$, no distinct $c^*$ can also be a cause of $e$. Since physical causes are sufficient, mental causes are excluded unless identical to physical causes. | The Exclusion Principle does not apply to relations of realization or supervenience. A mental property $M$ can cause $e$ *in virtue of* its physical realizer $P$ causing $e$, without competition. | **Does realization imply competition?** Does a determinable (mental) compete with its determinate (physical) for causal credit? | **The Determinable/Determinate Case:** Analyze standard cases like "The red ball broke the window" vs. "The scarlet ball broke the window." | **Friend:** Predicts analysis shows only the specific physical (scarlet) property is the true cause; "red" is a loose description.<br>**User:** Predicts analysis shows "redness" is the causally relevant property for generalization, even if instantiated by scarlet. |
  | **2. The Nature of Causation** | Causation is a relation of **physical production** (transfer of energy/momentum or fundamental nomic sufficiency). Only the fundamental physical level describes this relation accurately. | Causation is a relation of **difference-making** (counterfactual dependence or interventionist stability). Mental properties satisfy this even if they don't describe energy transfer. | **Which concept of causation is operative in agency?** Is the "cause" of an action the physical push or the variable that controls the outcome? | **Interventionist Causal Modeling (ICM):** Examine structural equation models in cognitive neuroscience where mental variables are intervened upon. | **Friend:** Predicts ICMs are merely heuristic; the *real* causal arrows are always between neurons.<br>**User:** Predicts ICMs reveal stable causal relations at the mental level that are lost at the neuronal level (causal autonomy). |
  | **3. Multiple Realizability** | If mental properties are multiply realizable, they are disjunctive and heterogeneous. Disjunctive properties are not natural kinds and cannot enter into laws or causal relations. | Multiple realizability demonstrates the autonomy of mental kinds. The functional role defines the property, allowing it to be causally efficacious across different physical substrates. | **Are functional properties natural kinds?** Can a property defined by its role (rather than constitution) be a cause? | **Putnam's Peg/Multiple Realizability Cases:** Assess whether a square peg fits a square hole *because* of its microstructure or its macro-geometry. | **Friend:** Predicts microstructure explains the fit; macro-geometry is a summary of micro-facts.<br>**User:** Predicts macro-geometry explains the fit across diverse microstructures; micro-details are irrelevant noise. |

  ## III. DIAGNOSIS OF VERBAL DISPUTES
  *We explicitly identify the following areas where our dispute appears to be merely verbal, stemming from divergent definitions rather than conflicting views on the world.*

  1.  **Definition of "Distinct":**
      *   **Issue:** When I (User) say mental properties are "distinct" from physical properties, I mean they are not *synonymous* and have different truth conditions (property dualism). When you (Friend) hear "distinct," you often infer "ontologically separate substance" or "causally independent entity."
      *   **Resolution:** We agree mental properties are not *ontologically independent substances*. The dispute is whether non-identity (distinctness) precludes causal efficacy. We will henceforth use "non-identical" rather than "distinct" to avoid substance-dualist connotations.

  2.  **Definition of "Cause":**
      *   **Issue:** You (Friend) reserve the term "cause" for the **fundamental physical sufficient condition**. I (User) use the term "cause" for the **explanatorily relevant difference-maker**.
      *   **Resolution:** We acknowledge we may be describing the same physical reality using different causal vocabularies. If I say "The intention caused the action," I mean "The intention is the stable difference-maker." If you say "The intention did not cause the action," you mean "The intention is not the fundamental physical producer."
      *   **Verdict:** This is partially verbal. However, it becomes substantive if one insists that *only* the fundamental physical definition counts as "real" causation. We agree to treat this as a substantive metaphysical dispute about **Causal Pluralism** vs. **Causal Monism**.

  ## IV. COMMITMENT TO RECONSTRUCTION AND RESOLUTION
  *We commit to the following path forward to resolve the substantive remnants of our disagreement.*

  1.  **Reconstruction:** We reconstruct our dispute not as "Do mental states push atoms?" (We agree they do not directly push atoms without physical mediators). The dispute is: **"Is the counterfactual dependence of actions on mental states sufficient for genuine causation, or does genuine causation require identity with the fundamental physical sufficient condition?"**
  2.  **Next Steps:** We will both read James Woodward's *Making Things Happen* (Interventionist Account) and Jaegwon Kim's *Physicalism, or Something Near Enough*.
  3.  **Empirical Check:** We will review recent literature on **causal exclusion in Bayesian Networks** (e.g., work by Erik Hoel or Chiara Grasso).
      *   If macro-variables show higher **Effective Information (EI)** than micro-variables in neural models, the User takes this as evidence for causal autonomy.
      *   The Friend takes this as evidence of descriptive efficiency, not ontological causation.
      *   **Agreement:** If macro-EI is consistently higher, the Friend agrees to reconsider the claim that the micro-level is always the *best* causal description. If macro-EI is never higher, the User agrees to reconsider the claim that mental properties offer causal *power* beyond the physical.

  **Signed,**

  _________________________ (User)
  _________________________ (Friend)
