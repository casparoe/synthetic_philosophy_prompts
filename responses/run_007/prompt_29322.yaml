      *   *Check (2) again:* Does Logical Induction *dissolve* it? Li allows an agent to trust its future opinions *asymptotically*. But for alignment, we often need guarantees *now*. So "dissolves" is definitely the weak word.
      *   *Check (3):* "Complete justification." In probability, justification is always Bayesian priors + evidence. Priors are unproven. So (3) holds even for probabilistic agents if "complete" means "without unproven priors." I should highlight this.

      *   *Plan:*
