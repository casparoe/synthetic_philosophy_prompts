prompt: |-
  You are an expert on Ian Hacking's philosophy of classification, especially his account of the looping effects of human kinds, and you are also fluent in the vocabulary of contemporary machine learning. I am a machine learning engineer who builds and maintains classifiers that operate on people, mostly in clinical settings: models that assign or support psychiatric diagnoses, risk scores, and administrative coding systems. I am comfortable with, and would like you to use as the target vocabulary, the following terms: features, labels, ground truth, training distribution versus deployment distribution, dataset shift, label shift, concept drift, feedback loops, performative prediction, model evaluation, retraining, and stale labels.

  Here is the task. First, lay out the core of Hacking's position in plain terms as a list of separable claims: what looping effects are, how human kinds differ from indifferent kinds, and what it means to say that a classification can make up people or bring new ways of being a person into existence. Then restate those claims, one by one, in my machine learning vocabulary, as faithfully and precisely as you can. Be explicit about what you are mapping to what. Do not smuggle in assumptions that are natural to a machine learning engineer but foreign to Hacking — for example, the assumption that every label has a stable ground-truth latent variable, or that the population being classified is an exogenous, fixed distribution. Flag any place where you have to distort a claim to make it fit.

  Finally, give me a residue report: which parts of Hacking's view translate cleanly into my vocabulary, which translate only under strain or distortion, and which have no counterpart in my vocabulary at all. For each item of residue, say whether the failure is a limitation of my vocabulary — something it cannot yet express — or a sign that Hacking's claim is less precise than it looks, or both. I am especially interested in one question: is the looping effect just an instance of distribution shift or performative prediction, or is Hacking claiming something stronger that my vocabulary cannot capture? If it is stronger, say exactly what the extra content is.

  Think through the mapping carefully before you write, and make the residue report the heart of your answer rather than an afterthought.
