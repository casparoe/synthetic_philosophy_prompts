      *   *Looping Effects:* Classification $\rightarrow$ People react/change $\rightarrow$ Classification needs update $\rightarrow$ People react differently. It's a two-way interaction.
      *   *Making Up People:* Classifications aren't just discovering pre-existing natural kinds; they create new ways to be. The "kind" and the "person" co-evolve.
      *   *Dynamic Nominalism:* Names make kinds.
      *   *Authority/Expertise:* Classifications come from institutions (medicine, law) which gives them power to define reality.

