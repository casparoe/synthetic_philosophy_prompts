answer: |-
  Good morning, and welcome to 'Things Decide'.

  Looking around this room, I see a division that is, frankly, rare and rather precious. On one side, we have the people who build the world: the engineers, the designers, the architects of infrastructure. On the other, we have the people who interpret the world: the philosophers, the STS scholars, the policy makers. Usually, these groups meet in a courtroom, a planning inquiry, or perhaps in the comments section of a news article after something has gone wrong. Here, we have the opportunity to meet before the concrete sets.

  I want to begin with a confession. I spent last night arguing about this workshop with a friend. He is a brilliant engineer who designs traffic-management systems. We were sitting in his kitchen, far too late, drinking tea that had gone cold, debating the question that sits at the heart of these two days: do artifacts have politics?

  His position was straightforward, pragmatic, and deeply held. He argued that a traffic light is a traffic light. It is a coordination mechanism. It solves a collision problem. It does not care whose car stops, or whether the driver is a banker or a busker. To suggest otherwise, he said, is to anthropomorphise a piece of plastic and silicon. A bridge does not have intentions. An algorithm does not have class interests. When bias appears, it is a failure of the people who deploy the technology, not the technology itself.

  My counter-argument was the usual catalogue of suspects: the low overpasses on Long Island designed to keep buses away from certain beaches; the facial-recognition training sets that simply cannot see certain faces; the urban planning that treats poverty as a drainage issue to be diverted away from city centres.

  We were still at it at two in the morning, and I am not sure either of us moved. But lying awake afterwards, I realised that our stalemate is actually the perfect starting point for this workshop. Because if we leave here convinced that my friend is right, we risk building efficient systems that are socially catastrophic. But if we leave convinced that I am right, we risk paralysing construction with a suspicion that every bolt is an act of oppression.

  Both positions are too quick. And both are too comfortable.

  To the engineers and designers in the room: the claim that 'technology is neutral' is a necessary fiction for getting work done. You must believe the problem is solvable, that there are objective constraints, and that you are serving the public good. But comfort in that neutrality can become a blind spot. When you define a problem as purely technical, you exclude certain social questions from the solution space. If you design a traffic system to maximise flow, you have made a political choice to prioritise speed over停留. If you design an API that requires a fixed address for verification, you have made a political choice to exclude the homeless. These are not bugs; they are features. They are decisions that have been delegated to matter. Once you pour the concrete, it is very difficult to argue with. The artifact enforces the rule long after the policy maker has gone home.

  To the philosophers and policy makers in the room: the claim that 'everything is political' is a powerful critical tool, but it can be a blunt instrument. If every artifact is merely an expression of power, then construction becomes impossible. We cannot live in a world where every screwdriver is suspected of hegemony. Critique is easy; building is hard. If we cannot distinguish between a bridge that excludes buses due to malice and a bridge that excludes buses due to structural budget constraints, we lose the ability to fix either. We need you to help us see the power dynamics, but we also need you to understand the material constraints that bind the engineers.

  So, where does that leave us? It leaves us with the title of this workshop: 'Things Decide'.

  Not because things have minds. My friend was right about that. A traffic light does not wake up in the morning and choose to oppress the poor. But things do have *consequences* that endure. They crystallise moments of decision into material form. When a system is built, it locks in a specific version of the world. It says: this is how people will move; this is who will be seen; this is what counts as efficiency.

  The question is not whether the artifact has intentions. The question is: whose intentions are hidden inside the artifact, and who is accountable when those intentions play out in the wild?

  For the engineers, this means recognising that you are not just solving coordination problems. You are legislating behaviour. When you write code or lay rail, you are writing law that is harder to repeal than an Act of Parliament. That is a terrifying responsibility, but it is also a profound opportunity. It means you have the power to embed equity directly into the substrate of society, not just hope it trickles down from policy.

  For the scholars and policy makers, this means recognising that you cannot regulate what you do not understand. You cannot govern algorithms you cannot read, or infrastructures you cannot visualise. If you want political order, you must engage with the technical order that sustains it. You must be willing to get your hands dirty with the specifics of the design, because that is where the politics are actually happening.

  Over the next two days, I do not want us to resolve the metaphysical debate. I do not expect us to agree on whether a smartphone has agency. Instead, I want us to focus on the handshake between the social and the technical. I want us to look at the moments where decisions slip from human hands into material forms. How do we make those decisions visible? How do we make them reversible? How do we ensure that when things decide, they decide in a way that reflects a democratic order, rather than a private interest?

  We are here because the old separation between 'building' and 'governing' has collapsed. The builders are governing, and the governors are trying to build. We need a new language for this shared burden.

  So, let us not dismiss the traffic light as mere coordination. Let us not condemn it as an instrument of control. Let us ask who decided the timing, who benefits from the flow, and who is left waiting at the red light when the system glitches. Let us treat the artifact not as a passive tool, nor as a malicious actor, but as a partner in the construction of political order.

  If we can do that, if we can bridge the gap between the kitchen table argument and the workshop floor, then perhaps we can move beyond the stalemate. We can stop asking whether things have politics, and start asking what kind of politics we want our things to have.

  Thank you.

  Summary: This workshop seeks to move beyond the stalemate of technological neutrality versus inherent bias by framing artifacts as crystallized decisions that require shared responsibility from both builders and critics.
