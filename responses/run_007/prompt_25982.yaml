answer: |-
  This is a pivotal moment in the dissertation. You are correct to sense that the "Heterogeneity Problem" is not just a puzzle to be solved but a constraint that shapes the entire architecture of your theory. If you define the constraints incorrectly, you will either chase an impossible unity or concede too much to pluralism.

  Below is a structured map of the desiderata for a theory of pleasure. I have divided them into **Core Constraints** (non-negotiable for any view claiming to be hedonistic) and **Contested Commitments** (where the specific camps diverge). I have then highlighted the tensions and the meta-philosophical framing issue you raised.

  ### I. Core Constraints (Non-Negotiable)
  *Any theory that fails these ceases to be a viable theory of hedonistic well-being.*

  **1. Extensional Adequacy**
  *   **The Requirement:** The theory must classify the full range of paradigmatic pleasures as instances of pleasure. This includes sensory pleasures (eating, itching), intellectual pleasures (solving a proof), aesthetic pleasures (music), and social/moral pleasures (pride, love).
  *   **Motivation:** If a theory of pleasure excludes intellectual satisfaction but includes sensory gratification, it cannot support a general theory of well-being that accounts for the "good life." A hedonism that says understanding a proof contributes nothing to well-being is revisionist to the point of falsity.
  *   **Status:** **Non-negotiable.**

  **2. Normative Significance (The "Because" Constraint)**
  *   **The Requirement:** The theory must explain *why* the identified property (pleasure) makes a life better. It cannot merely identify a psychological state; it must link that state to value.
  *   **Motivation:** Hedonism is an axiological thesis, not merely a psychological one. If you define pleasure as "dopamine release," you still owe an account of why dopamine release is *good*. If you define it as "taking a pro-attitude," you must explain why that attitude is intrinsically valuable rather than just instrumentally useful.
  *   **Status:** **Non-negotiable.**

  **3. Non-Circularity**
  *   **The Requirement:** The definition of pleasure cannot presuppose the concept of value or goodness.
  *   **Motivation:** Hedonism claims: $X$ is good *because* it is pleasurable. If pleasure is defined as "the experience of intrinsic value," the theory becomes tautological ($X$ is good because it is an experience of goodness) and loses its explanatory power.
  *   **Status:** **Non-negotiable.**

  ---

  ### II. Contested Commitments (Theory-Laden)
  *These are often treated as requirements, but they are actually commitments of specific camps. A successful theory might reject one of these.*

  **4. Phenomenal Unity (The "Hedonic Tone" Requirement)**
  *   **The Requirement:** All instances of pleasure must share a distinctive, introspectible phenomenal quality (a "feel").
  *   **Motivation:** Introspection suggests that pleasure *feels* like something specific, distinct from pain or neutrality. This drives Felt-Quality theories (Crisp, Broad).
  *   **Status:** **Contested.** Attitudinal theorists (Feldman, Heathwood) explicitly reject this. They argue the unity is structural (the attitude), not phenomenal.

  **5. Intentionality (The "Object" Requirement)**
  *   **The Requirement:** Pleasure must be representable as having an intentional object (being pleased *that p*).
  *   **Motivation:** This accounts for propositional pleasures (being pleased that you passed). It drives Attitudinal Hedonism.
  *   **Status:** **Contested.** Sensory theorists argue that the pleasure of an itch-scratch or a taste is non-propositional and forcing it into a *that-clause* distorts the phenomenology.

  **6. Naturalistic Reducibility**
  *   **The Requirement:** The theory should ideally be compatible with, or reducible to, empirical facts (neuroscience/psychology).
  *   **Motivation:** Philosophical naturalism. If pleasure is the good, we should be able to find it in the world.
  *   **Status:** **Contested.** Many normative realists reject this. Furthermore, neuroscience currently suggests multiple reward systems (wanting vs. liking), which complicates reduction.

  ---

  ### III. The Tensions (Incompatibilities)
  *Here is where the dissertation work lies. These are the friction points where satisfying one desideratum threatens another.*

  **Tension A: Phenomenal Unity vs. Extensional Adequacy**
  *   **The Conflict:** The more specific you make the "hedonic tone" (to satisfy Phenomenal Unity), the harder it is to find that tone in intellectual or moral pleasures (threatening Extensional Adequacy). If you say the tone is "sensory warmth," you lose the pleasure of solving a math problem. If you say the tone is "positive affect," the description becomes so thin it risks failing **Normative Significance** (why is generic positive affect the *sole* good?).
  *   **Implication:** Felt-quality theories often struggle here. They must either deny intellectual pleasures are "pure" pleasures (revisionism) or stretch the notion of "feeling" until it breaks.

  **Tension B: Normative Significance vs. Naturalistic Reducibility**
  *   **The Conflict:** If you reduce pleasure to a natural property (e.g., opioid activity), you face the Open Question Argument. Why *ought* we pursue opioid activity? If you keep pleasure as a normative primitive to secure **Normative Significance**, you sacrifice **Naturalistic Reducibility**.
  *   **Implication:** This is the classic Moorean objection. Naturalist hedonists must bridge the is-ought gap internally; non-naturalists must accept a sui generis normative property.

  **Tension C: Intentionality vs. Non-Circularity**
  *   **The Conflict:** Attitudinal theories define pleasure as "intrinsic liking." But if "liking" is analyzed as "judging to be good," you violate **Non-Circularity**. If "liking" is analyzed as a brute psychological disposition, you risk losing **Normative Significance** (why is a brute disposition valuable?).
  *   **Implication:** Attitudinal hedonists walk a tightrope between circularity and emptiness.

  ---

  ### IV. The "Killer" Desideratum
  If I must flag one requirement that does the most work in ruling out candidates, it is **Normative Significance**.

  *   **Why:** Many theories successfully identify a common property.
      *   *Neuroscience* finds a common property (reward circuitry).
      *   *Behaviorism* finds a common property (reinforcement).
      *   *Felt-Quality* finds a common property (positive phenomenology).
  *   **The Failure:** Most of these fail to explain why *that specific property* constitutes well-being. A neuroscientific account tells you what pleasure *is*, but not why it is *good*. A felt-quality account tells you it feels distinct, but not why that feeling is the *telos* of a life.
  *   **Dissertation Strategy:** If you can show that a specific account of pleasure uniquely satisfies **Normative Significance** without violating **Non-Circularity**, you have a winning dissertation. Most literature focuses on the metaphysics of pleasure (what it is) and neglects the axiology (why it matters).

  ---

  ### V. The Meta-Framing: Is the Heterogeneity Problem Question-Begging?
  You asked if demanding a "single common property" begs the question against the pluralist. **Yes, it does.**

  The Heterogeneity Problem is formulated as: *"Find property P such that all pleasures share P."*
  This formulation presupposes **Monism about Pleasure**.

  *   **The Pluralist Move:** A pluralist about pleasure (not to be confused with a pluralist about value) argues that "pleasure" is a family-resemblance concept or a disjunctive kind. The pleasure of an itch and the pleasure of a proof share no single property P, but are linked by overlapping similarities.
  *   **The Cost:** If you accept this, you dissolve the Heterogeneity Problem, but you weaken Hedonism. Hedonism claims there is *one* currency of value (Pleasure). If Pleasure is disjunctive ($P_1 \lor P_2 \lor P_3$), then Hedonism effectively becomes a form of Pluralism about value (Sensory Good $\lor$ Intellectual Good $\lor$ Social Good).
  *   **Desideratum Adjustment:** You need a meta-desideratum here: **Theoretical Unity.**
      *   *Requirement:* The theory should minimize the disjunction in the definition of pleasure to preserve the spirit of Hedonism as a unifying theory of value.
      *   *Motivation:* If the definition of pleasure becomes too disjunctive, "Hedonism" loses its distinctive theoretical advantage over Objective List theories.

  ### VI. Strategic Recommendation for the Dissertation

  Do not treat the Heterogeneity Problem as a wall to climb; treat it as a filter to sort the desiderata.

  1.  **Explicitly Frame the Trade-off:** In your introduction, state that the Heterogeneity Problem is a tension between **Extensional Adequacy** (capturing all cases) and **Phenomenal/Structural Unity** (finding one common thread).
  2.  **Challenge the Monism Presupposition:** Dedicate a section to whether Hedonism *requires* a unitary psychology of pleasure. Can one be a "Disjunctive Hedonist"? (i.e., Pleasure is the only good, but 'pleasure' names a heterogeneous class). If you argue this is incoherent, you justify the demand for Unity. If you argue it is coherent, you dissolve the problem but change the theory.
  3.  **Focus on the Axiology:** As noted above, push hard on **Normative Significance**. Most dissertations on this topic get bogged down in the philosophy of mind (what is pleasure?). You can distinguish your work by focusing on the philosophy of value (why does *that* account of pleasure ground well-being?).

  **Summary of the Tension:**
  The central tension you are navigating is between **Unity** (required for Hedonism to be a monistic theory of value) and **Diversity** (required for the theory to match the phenomenological data).
  *   If you prioritize Unity $\rightarrow$ You risk Extensional Adequacy (excluding intellectual pleasures).
  *   If you prioritize Diversity $\rightarrow$ You risk Theoretical Unity (collapsing into Pluralism).

  Your job is to find the account of pleasure that maximizes both, or to argue convincingly why one must be sacrificed.
