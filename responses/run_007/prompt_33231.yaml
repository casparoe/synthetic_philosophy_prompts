      *   *Attempt 2 (More technical):* Given $N$ scoring functions returning ordered sets. You need a merge function. It must accept any score distribution. It shouldn't weight one function at 100%. If all functions score A > B, merge must score A > B. If you filter out C, A vs B stays same. Arrow says you can't have a deterministic sort that does this without cycles or edge cases.
      *   *Refining for the Prompt:* Use terms like `Comparator`, `stable_sort`, `deterministic`, `side-effects`, `normalization`.

