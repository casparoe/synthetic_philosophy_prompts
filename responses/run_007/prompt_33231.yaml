      *   **Inputs:** A set of voters, each with a preference ordering over a set of candidates.
      *   **Output:** A single social preference ordering.
      *   **Conditions:**
          1.  *Unrestricted Domain (Universality):* The system must handle any possible set of individual preferences.
          2.  *Non-Dictatorship:* No single voter dictates the outcome.
          3.  *Pareto Efficiency (Unanimity):* If everyone prefers A over B, the system must prefer A over B.
          4.  *Independence of Irrelevant Alternatives (IIA):* The relative ranking of A and B depends *only* on how individuals rank A and B, not on their ranking of C.
      *   **Conclusion:** No rank-order voting system can satisfy all these conditions simultaneously (for 3+ candidates).

  3.  **Translate to Software Engineering Vocabulary:**
