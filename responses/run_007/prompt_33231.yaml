      *   *Preference Ordering* $\rightarrow$ *Sorted List / Score Vector / Comparator Output*.
      *   *Social Welfare Function* $\rightarrow$ *Aggregation Logic / Merge Function / Final Scorer*.
      *   *Unrestricted Domain* $\rightarrow$ *Input Agnosticism* (The merge function can't assume specific score distributions).
      *   *Non-Dictatorship* $\rightarrow$ *No Hardcoded Priority* (Can't just return `list_1` regardless of others).
      *   *Pareto Efficiency* $\rightarrow$ *Consensus Preservation* (If all sources say Item X > Item Y, final rank must reflect X > Y).
      *   *IIA* $\rightarrow$ *Context Independence* (Adding/Removing Item Z shouldn't flip the order of X and Y).
      *   *Transitivity Bugs* $\rightarrow$ *Cycles in Comparator* (A > B, B > C, C > A).

  4.  **Drafting the Restatement (Iterative Process):**
