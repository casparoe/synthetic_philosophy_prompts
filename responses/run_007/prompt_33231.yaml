prompt: |-
  I'm a software engineer who builds systems that aggregate rankings — search result merging, ensemble recommenders, that kind of thing. Restate Arrow's impossibility theorem in the vocabulary I actually use: scoring functions, tie-breaking, comparator implementations, transitivity bugs, the lot. Be as faithful as you can. Then give me the residue report: which parts of the theorem map cleanly onto problems I've definitely hit in production, which parts you had to fudge, and what has no counterpart at all. I especially want to know whether the independence of irrelevant alternatives condition has a real analogue in my world, or whether it's a philosopher's concern that doesn't bite when you're just trying to make a ranking that isn't embarassingly cyclical.
