prompt: |-
  I'm in a grad seminar on economic modeling and my professor keeps shutting down objections to the models we read with some version of "the assumptions don't have to be realistic." He cites Friedman's F-twist like its a trump card. Last week someone pointed out that the model we were discussing assumes every agent knows the whole model and all its parameters, and he just said "so what, unrealistic assumptions are fine if the predictions work." I'm pretty sure that line is doing a lot more work than he admits, but I can't quite articulate the different things it could be claiming — or wether any of them actually get him what he wants. Can you lay out the distinct precise theses this slogan might amount to, from the boringly true to the really strong and contentious? For each reading, say whether it's a platitude, a substantive but defensible claim, or just false. And crucially: which reading would actually license dismissing the objection about agents knowing the whole model, and which readings wouldn't get him that conclusion. I want a menu I can bring to the next class, not an explanation of one interpretation.
