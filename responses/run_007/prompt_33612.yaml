answer: |-
  This is a classic methodological standoff. Your professor is wielding Milton Friedman's 1953 essay *The Methodology of Positive Economics* (F53) as a shield. The problem is that F53 is notoriously ambiguous; it conflates several distinct philosophical claims into one slogan ("assumptions don't have to be realistic").

  When your professor says this, he could mean any of the following six theses. They range from trivial truths to highly contentious philosophical positions. Crucially, most of them **do not** automatically license dismissing the objection about agents knowing the whole model (common knowledge of the model/parameters).

  Here is the menu.

  ### 1. The Trivial Idealization Thesis
  *   **The Claim:** All models simplify reality. No assumption is perfectly true (e.g., agents aren't *literally* continuous functions, space isn't *literally* frictionless). Therefore, pointing out an assumption is "unrealistic" is not a criticism unless you show the simplification matters.
  *   **Verdict:** **Platitude.** Everyone agrees models are idealizations.
  *   **Does it license dismissing the objection?** **No.**
      *   *Why:* This thesis admits assumptions are false but demands we know *which* falsehoods are permissible. It shifts the burden back to the modeler to explain why *this specific* falsehood (omniscience) is a harmless simplification rather than a fatal flaw. It does not grant a free pass; it just establishes that "false" $\neq$ "invalid."

  ### 2. The Predictive Instrumentalist Thesis
  *   **The Claim:** The only criterion for a theory is the accuracy of its predictions, not the truth of its premises. If the model predicts aggregate outcomes well, the internal mechanism (including agent knowledge) is irrelevant.
  *   **Verdict:** **Substantive but Contentious.** This is the core of Friedman's argument. It is defensible in physics (we don't ask if light "knows" Fermat's principle), but controversial in social science where mechanisms *are* the policy levers.
  *   **Does it license dismissing the objection?** **Yes, conditionally.**
      *   *Why:* This is the only reading that fully supports your professor's dismissal *without further argument*. **However**, it comes with a heavy burden: he must demonstrate the model actually yields accurate empirical predictions. If the model is purely theoretical with no empirical validation yet, this defense fails.

  ### 3. The "As-If" Behavioral Thesis
  *   **The Claim:** Agents do not need to consciously solve the model; they merely need to behave *as if* they do. Market selection pressures eliminate agents who don't act according to the model, leaving only those who match the prediction.
  *   **Verdict:** **Substantive and Defensible (in some contexts).** Works well for profit maximization in competitive markets.
  *   **Does it license dismissing the objection?** **No (specifically for Common Knowledge).**
      *   *Why:* You can argue agents act *as if* they maximize utility. But it is incredibly difficult to argue agents act *as if* they know the economist's specific model structure and parameters. Selection pressures might select for profitable behavior, but they do not select for agents who correctly anticipate the government's policy rule or the specific equilibrium concept the theorist is using. This thesis breaks down when the assumption is about *epistemic access to the theory itself*.

  ### 4. The Robustness Thesis
  *   **The Claim:** The assumption doesn't need to be literally true because the result is robust. If we relax the assumption slightly (e.g., agents know 90% of the model), the qualitative result remains the same.
  *   **Verdict:** **Substantive and Defensible.** This is the standard modern defense in mechanism design and macro.
  *   **Does it license dismissing the objection?** **Only if proven.**
      *   *Why:* Your professor cannot simply assert this; he must show the result holds under "bounded rationality" or "incomplete information." If the model collapses when agents don't know the parameters (which many Rational Expectations models do), this defense is false. Using this slogan without proving robustness is methodological sloppiness.

  ### 5. The Strong F-Twist (Unrealisticness as Virtue)
  *   **The Claim:** Significant hypotheses *must* have unrealistic assumptions. The more unrealistic the assumption, the more general and powerful the theory. (This is the most controversial sentence in F53).
  *   **Verdict:** **False / Highly Contentious.** Most contemporary philosophers of economics (e.g., Daniel Hausman, Nancy Cartwright) reject this. Unrealistic assumptions often reduce external validity rather than increase generality.
  *   **Does it license dismissing the objection?** **No.**
      *   *Why:* Even if you accept this, it doesn't explain *why* this specific unrealistic assumption generates power. It's a rhetorical move, not a logical justification. Relying on this is usually a sign the modeler cannot defend the assumption on other grounds.

  ### 6. The Causal Isolation Thesis
  *   **The Claim:** The goal is not to describe the whole system, but to isolate one specific causal mechanism. We assume away other factors (including information constraints) to see what *this* force does in isolation.
  *   **Verdict:** **Substantive and Defensible.** Common in theoretical micro.
  *   **Does it license dismissing the objection?** **Partially.**
      *   *Why:* This licenses the assumption *for the purpose of theory-building*, but not for policy application. If the seminar is about understanding how a specific mechanism works, this works. If the seminar implies the model should guide real-world policy, this fails, because you cannot isolate information constraints in the real world.

  ---

  ### How to Use This in Class

  Your professor is likely conflating **Thesis 2 (Instrumentalism)** with **Thesis 1 (Trivial Idealization)**. He wants the safety of the Platitude ("everyone knows models simplify") to avoid the burden of the Instrumentalist claim ("I must show this predicts well").

  **The Strategy:**
  Don't attack Friedman directly. Instead, ask him to specify *which* defense he is invoking regarding the **epistemic** nature of the assumption.

  **Suggested Script:**
  > "I agree that assumptions don't need to be descriptively perfect (Thesis 1). But when the assumption is about agents knowing the model structure itself, the 'As-If' argument (Thesis 3) seems hard to sustain—selection pressures don't teach agents the professor's parameters.
  >
  > So, are you defending this on **Instrumentalist** grounds (Thesis 2)—meaning we should ignore the assumption because the predictions are empirically validated? Or are you claiming **Robustness** (Thesis 4)—meaning the result holds even if we relax the knowledge assumption? Because if it's neither, aren't we relying on the Strong F-Twist (Thesis 5), which assumes unrealisticness is itself a virtue?"

  **The Trap to Avoid:**
  If he says, "It's just a model, it's not supposed to be real," he is retreating to **Thesis 1**.
  *   **Counter:** "I understand it's an idealization. But is it a *negligible* idealization? In physics, friction is negligible sometimes. In macro, is information asymmetry negligible? If we assume it away, do we lose the phenomenon we're trying to study?"

  **Summary for your notes:**
  *   **Thesis 1 (Idealization):** True, but doesn't save him.
  *   **Thesis 2 (Instrumentalism):** Saves him, *if* he has data.
  *   **Thesis 3 (As-If):** Fails on "knowing the model."
  *   **Thesis 4 (Robustness):** Saves him, *if* he proves it.
  *   **Thesis 5 (F-Twist):** False, don't let him use this.
  *   **Thesis 6 (Isolation):** Saves theory, kills policy relevance.
