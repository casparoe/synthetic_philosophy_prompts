prompt: |-
  ok so i'm organizing this workshop at a philosophy department and we've got a reductionist and an anti-reductionist about testimonial justification who've agreed to do an adversarial collaboration. they've been going back and forth in the journals for years and everyone's sick of it, so we locked them in a room (metaphorically) and told them to produce something joint.

  the problem is neither of them will actually draft the document because they keep getting stuck on wording. so i need to produce a draft they can react to. can you write it for me?

  i want the document an epistemic reductionist about testimony and an epistemic anti-reductionist about testimony could both sign after a good-faith adversarial collaboration. the reductionist holds that testimonial justification is always reducible to or grounded in other epistemic sources — perception, memory, inductive inference, etc. — so that believing a speaker's say-so is justified only if the hearer has (perhaps tacit) positive reasons bearing on the speaker's reliability. the anti-reductionist holds that testimony is a basic source of justification, on a par with perception or memory, such that a hearer is prima facie entitled to believe what they're told without needing independent positive reasons for the speaker's reliability, though defeaters can override this.

  the deliverable should have:

  - a numbered list of claims both can sign. these should be substantive, not just "testimony exists" or whatever. i want the real points of agreement they've discovered through the collaboration, including about the epistemology of testimony, about what the debate is not about, and about what would count as progress.

  - then a table of disagreements. for each row: the topic, the reductionist's statement of their view (in wording they'd endorse), the anti-reductionist's statement of theirs (same), and whether the collaboration revealed this particular disagreement to be substantive or at least partly verbal. if partly verbal, explain what the verbal component is.

  - then a cruxes section: the sub-questions such that settling them would move at least one side, with a note on what each side predicts about the answer and what kind of evidence or argument both agree would bear on it.

  - finally, if there's anything both agree would actually move the debate — a kind of case, a kind of empirical result, a conceptual clarification — that hasn't been tried yet, include that.

  don't make it sound like one side is obviously right. the whole point of an adversarial collaboration is both parties are acting in good faith and the document reflects that. if you think one of their disagreements is actually about words and not substance, flag it and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested draft document:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy department workshop.
      *   **Participants:** An epistemic reductionist about testimony (Red) and an epistemic anti-reductionist about testimony (Anti-Red).
      *   **History:** They've been debating in journals for years; everyone is tired of it.
      *   **Task:** Create a draft document for an "adversarial collaboration" that both can sign/react to.
      *   **Tone:** Neutral, good-faith, substantive, not favoring one side.
      *   **Required Sections:**
          1.  Numbered list of agreed claims (substantive).
          2.  Table of disagreements (Topic, Red View, Anti-Red View, Substantive vs. Verbal).
          3.  Cruxes section (Sub-questions that would move the needle, predictions, agreed evidence).
          4.  Future directions (Untried moves/cases/empirical results).
      *   **Definitions:**
          *   *Reductionism:* Testimonial justification reduces to perception, memory, induction. Hearer needs positive reasons for reliability.
          *   *Anti-Reductionism:* Testimony is a basic source. Prima facie entitlement without independent positive reasons (defeasible).

  2.  **Deconstruct the Philosophical Debate (Testimonial Justification):**
      *   *Key Figures:* Hume/Locke (Reductionist leanings), Coady/Burge (Anti-Reductionist/Presumptivism).
      *   *Core Tension:* Is testimony a derived source (like inference) or a fundamental source (like perception)?
      *   *Common Ground:* Both agree testimony *can* justify. Both agree defeaters matter (liars, incompetence). Both agree perception/memory are involved in *receiving* testimony. Both want to avoid skepticism and gullibility.
      *   *Verbal Disputes:* Often revolve around the definition of "reason," "inference," or "basic." Is a default entitlement a "reason"? Is an implicit induction a "positive reason"?
      *   *Substantive Disputes:* The default status of testimony. Who bears the burden of proof? The nature of the epistemic right.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official and collaborative. "Joint Statement on the Epistemology of Testimony."

      *   **Section 1: Points of Agreement:**
          *   Need to avoid trivialities ("people talk").
          *   Focus on shared constraints.
          *   *Idea 1:* Testimony is distinct from pure perception (it involves a speaker).
          *   *Idea 2:* Defeaters work the same way (if you know they are lying, you aren't justified).
          *   *Idea 3:* Global skepticism is false (we know things via testimony).
          *   *Idea 4:* Developmental psychology matters (kids learn via testimony).
          *   *Idea 5:* The goal is normative, not just descriptive.
          *   *Refinement:* Make them sound like hard-won agreements. E.g., "The 'No-Defeater' Condition."

      *   **Section 2: Table of Disagreements:**
          *   Need precise wording for each side.
          *   *Row 1: The Default Status.* Red: Need positive reasons. Anti-Red: Presumptive right.
          *   *Row 2: The Nature of the Inference.* Red: Inductive inference (even if tacit). Anti-Red: No inference needed, direct uptake.
          *   *Row 3: Burden of Proof.* Red: On the believer to show reliability. Anti-Red: On the challenger to show unreliability.
          *   *Row 4: Verbal vs. Substantive.* This is crucial. Often the fight is about what counts as a "reason." If the Red says "background conditions count as reasons" and Anti-Red says "those are just enabling conditions," that's verbal. I need to flag at least one as *partly* verbal to show depth of collaboration. Let's flag the "Tacit Inference" debate.

      *   **Section 3: Cruxes:**
          *   What would change minds?
          *   *Crux 1: The Child Case.* Do infants have inductive bases? If yes, Red wins. If no, Anti-Red wins.
          *   *Crux 2: The Scope of "Reasons".* If we clarify "reasons," does the gap close?
          *   *Crux 3: Epistemic Responsibility.* Is it irresponsible to believe without checking?
          *   *Predictions:* Red predicts empirical evidence of monitoring. Anti-Red predicts failure of monitoring in successful uptake.

      *   **Section 4: Future Directions/Untried Moves:**
          *   What hasn't been done?
          *   *Empirical:* Developmental psych experiments on monitoring.
          *   *Conceptual:* A unified formal model (Bayesian?) that can accommodate both.
          *   *Case Studies:* Specific edge cases (AI testimony? Expert vs. Peer?).

  4.  **Review and Refine:**
      *   *Tone Check:* Is it too dry? Too academic? It needs to sound like a workshop draft.
      *   *Fairness:* Does the Reductionist sound like a Humean skeptic? No, they should sound like a rigorous empiricist. Does the Anti-Reductionist sound like a gullible relativist? No, they should sound like a defender of basic entitlement (Burge-style).
      *   *Constraint Check:* Did I include the table? Yes. The cruxes? Yes. The verbal/substrative distinction? Yes.
      *   *Self-Correction during drafting:* I initially thought about making the verbal dispute the *main* one. But the prompt asks for substantive claims. I should ensure the disagreements look real, but acknowledge where terminology muddies the water. The "Tacit Inference" is the classic place where this happens. Reductionists call it inference; Anti-Reductionists call it a brute psychological mechanism. That's a good candidate for "Partly Verbal."

  5.  **Final Polish:**
      *   Add a preamble explaining the context (adversarial collaboration).
      *   Ensure the formatting is clean (Markdown).
      *   Make sure the "Signatures" line is there (metaphorically).

  6.  (Final thought on the "Verbal" aspect): It's important to note that *some* disagreement is verbal because often Reductionists expand "induction" to include very broad background assumptions, while Anti-Reductionists restrict "basic" to mean "non-inferential." If they agree on the *structure* of the justification but disagree on the *label*, that's verbal. I will highlight this in the table.

  7.  (Final thought on "Cruxes"): Make sure the evidence agreed upon is actually something they can look at. "Intuitions about cases" is too vague. "Developmental data on infant monitoring" is better.

  Let's assemble the document.cw
answer: |-
  **DRAFT FOR REVIEW: JOINT STATEMENT ON THE EPISTEMOLOGY OF TESTIMONY**

  **Workshop:** Adversarial Collaboration on Testimonial Justification
  **Participants:** [Reductionist Name] & [Anti-Reductionist Name]
  **Date:** October 2023
  **Status:** Pre-Circulation Draft

  ### Preamble
  This document represents the output of an adversarial collaboration between proponents of Epistemic Reductionism (ER) and Epistemic Anti-Reductionism (EAR) regarding testimonial justification. Our goal was not to force a consensus where none exists, but to isolate the precise locus of our disagreement, eliminate verbal disputes, and identify empirical or conceptual moves that could advance the debate. We agree that the traditional dichotomy has often obscured shared commitments.

  ### I. Points of Substantive Agreement
  *The following claims are endorsed by both parties. We treat these as fixed constraints for any viable theory of testimony.*

  1.  **The No-Defeater Condition:** Both parties agree that testimonial justification is defeasible. If a hearer possesses a positive reason to doubt a speaker's competence or sincerity (a "defeater"), justification is undermined or destroyed, regardless of the default status of testimony.
  2.  **The Rejection of Global Skepticism:** Both parties agree that testimony is a genuine source of knowledge and justified belief. We reject the Humean worry that testimony is inherently suspect to the point of requiring global validation before any local belief is justified.
  3.  **The Role of Perception and Memory:** Both parties agree that the *reception* of testimony necessarily involves perception (hearing/reading) and memory (retaining the content). The dispute is not about whether these faculties are involved, but whether they *exhaust* the justificatory basis.
  4.  **Normative Aim:** Both parties agree that the debate is normative, not merely descriptive. We are concerned with when a hearer *ought* to believe, not merely when they *do* believe. Psychological mechanisms of uptake are relevant only insofar as they track epistemic norms.
  5.  **Context Sensitivity:** Both parties agree that the standards for justified testimonial belief vary with context. High-stakes environments (e.g., medical advice, legal testimony) require more scrutiny than low-stakes environments (e.g., casual conversation), though we disagree on the mechanism explaining this shift.
  6.  **The Failure of "Blind Credulity":** Both parties agree that a hearer who ignores obvious signs of unreliability is epistemically blameworthy. EAR denies this requires *positive* reasons for reliability, but admits it requires the absence of *negative* reasons.

  ### II. Table of Disagreements
  *We have categorized our remaining disagreements. Where a disagreement is flagged as "Partly Verbal," we have specified the terminological overlap.*

  | Topic | Reductionist (ER) Statement | Anti-Reductionist (EAR) Statement | Status | Notes on Verbal Component |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Default Status** | A hearer is justified only if they possess positive reasons (tacit or explicit) to believe the speaker is reliable. The burden of proof lies on the believer. | A hearer is prima facie justified simply by understanding the testimony. The burden of proof lies on the challenger to show unreliability. | **Substantive** | None. This is a structural disagreement about the direction of the epistemic right. |
  | **2. The Nature of Uptake** | Testimonial justification is a species of inductive inference based on past observations of the correlation between reports and facts. | Testimonial justification is a basic, non-inferential entitlement akin to perception. It does not rely on an inductive premise. | **Partly Verbal** | **Verbal Component:** Disagreement over the definition of "inference." ER counts tacit, sub-personal pattern matching as inference; EAR reserves "inference" for conscious reasoning. <br>**Substantive Core:** Whether the justification *depends* on the truth of an inductive generalization. |
  | **3. The Child/Infant Case** | Infants must have some rudimentary inductive basis (e.g., tracking consistency of caregivers) to be justified in believing testimony. | Infants are entitled to believe caregivers without inductive bases; their justification is parasitic on the rationality of the community/speaker. | **Substantive** | None. This turns on empirical claims about cognitive development and normative claims about non-rational agents. |
  | **4. Epistemic Responsibility** | It is epistemically irresponsible to believe without monitoring for reliability. Monitoring is a necessary condition for justification. | Monitoring is a way to *lose* justification (via defeaters), but lack of monitoring does not preclude initial justification. | **Substantive** | None. This is a disagreement about the requirements of epistemic virtue. |

  ### III. Cruxes: Sub-Questions for Resolution
  *We identify the following sub-questions as "cruxes." Settling these would significantly alter the dialectic or force one side to modify their view.*

  **Crux A: The Empirical Scope of Monitoring**
  *   **Question:** To what extent do adult hearers automatically and sub-consciously monitor speakers for signs of unreliability (e.g., eye contact, tone, consistency) during uptake?
  *   **ER Prediction:** Monitoring is ubiquitous and necessary. If you block monitoring, justification fails.
  *   **EAR Prediction:** Monitoring is optional and defeater-driven. Justification persists even if monitoring is bypassed, provided no defeaters are present.
  *   **Agreed Evidence:** Experimental philosophy and cognitive science data on "epistemic vigilance." If data shows uptake occurs *without* vigilance mechanisms activating in low-stakes contexts, this favors EAR. If data shows vigilance is always active, this favors ER.

  **Crux B: The "Strange Witness" Intuition**
  *   **Question:** Consider a subject who knows nothing about a domain (e.g., quantum physics) and has no prior track record of the speaker, but also has no reason to doubt them. Are they justified in believing a complex claim?
  *   **ER Prediction:** No. Without a positive reason to think the speaker is reliable (e.g., credentials, institutional backing), belief is unjustified.
  *   **EAR Prediction:** Yes. Understanding the assertion grants a prima facie right, which remains until a defeater appears.
  *   **Agreed Evidence:** Refined intuition pumps across diverse demographic groups to check for cultural bias in "default trust." If the intuition is robustly shared, EAR gains ground. If the intuition dissolves under scrutiny (revealing hidden assumptions of reliability), ER gains ground.

  **Crux C: The Definition of "Reason"**
  *   **Question:** Can background conditions (e.g., "the speaker is in a normal context," "language is functioning") count as "positive reasons"?
  *   **ER Prediction:** Yes. These are inductive premises, even if trivial.
  *   **EAR Prediction:** No. These are enabling conditions, not justificatory reasons. Treating them as reasons inflates the definition of "inference" to triviality.
  *   **Agreed Evidence:** Conceptual analysis. We agree that if ER defines "reason" so broadly that it includes mere absence of defeaters, the view collapses into EAR. We need a principled distinction between *enabling conditions* and *justificatory grounds*.

  ### IV. Proposed Pathways for Progress
  *We agree that the debate has stagnated due to reliance on the same set of thought experiments. We propose the following novel avenues for investigation:*

  1.  **Developmental Psychology Collaboration:**
      *   **Proposal:** Design an experiment to test infants' testimonial uptake in the absence of prior reliability data.
      *   **Goal:** To test Crux A. If infants accept testimony from novel speakers without prior tracking of reliability, this is strong evidence for EAR. If they show hesitation or require cross-modal verification, this supports ER.
      *   **Commitment:** Both sides agree to update their credences based on the results of a pre-registered study.

  2.  **Formal Modeling (Bayesian):**
      *   **Proposal:** Construct a Bayesian network model of testimonial exchange.
      *   **Goal:** To determine if the "Anti-Reductionist" position can be modeled as a "Reductionist" model with a specific prior probability setting (e.g., a default high prior on reliability).
      *   **Commitment:** If the models are mathematically equivalent, we agree the dispute is merely verbal regarding the labeling of "priors" vs. "basic entitlements."

  3.  **The "AI Testimony" Edge Case:**
      *   **Proposal:** Analyze justification regarding Large Language Models or AI agents.
      *   **Goal:** AI lacks human sincerity conditions. Does testimonial justification apply?
      *   **Commitment:** ER argues AI forces a reduction to reliability statistics. EAR argues if we treat AI as a "speaker," we must explain why the presumption of truth doesn't apply (or why it does). This may clarify the role of *sincerity* in the Anti-Reductionist account.

  ### V. Signatories

