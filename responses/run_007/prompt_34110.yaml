answer: |-
  ### Brainstorm: The Five Pitfalls of Conditional Updating

  Before implementing the procedure, your team must recognize the specific errors they are currently making. These are the vulnerabilities an adversary (or an auditor) will exploit.

  1.  **The Material Implication Trap:** Treating "If A, then probably B" as "Either Not-A or B." This collapses the conditional into a categorical claim, distorting the probability of A.
  2.  **The Certainty Error:** Updating as if the antecedent (A) is true. (e.g., Hearing "If North, then Ambush" and updating as if "North" is confirmed).
  3.  **The Invariance Assumption:** Assuming the probability of the antecedent $P(A)$ *must* stay fixed. While intuitively appealing, this is an arbitrary constraint. Formal epistemology (specifically Minimum Relative Entropy) shows that learning a conditional relation often *should* shift your belief in the antecedent to maintain coherence.
  4.  **The Independence Blindspot:** Failing to account for the probability of B given Not-A ($P(B|\neg A)$). You cannot update on $P(B|A)$ without knowing how B behaves when A is false.
  5.  **The "Feel" Drift:** Two analysts starting with the same numbers ending with different results. This destroys inter-rater reliability and makes the team's output indefensible.

  ---

  ### The Theoretical Grounding (For the Boss)

  **Why this procedure?**
  Standard Bayesian Conditionalization applies when you learn an event is *true* (e.g., "The convoy is North"). You are learning a *constraint on a probability* (e.g., "The chance of Ambush *given* North is 75%").

  **The Solution: Minimum Relative Entropy (MinXent)**
  To update defensibly, we must change our prior beliefs as *little as possible* to accommodate the new constraint. This is achieved by minimizing the Kullback-Leibler divergence (relative entropy) between the prior and posterior distributions.

  **The Judy Benjamin Problem**
  This is the standard objection. In the famous thought experiment, Judy learns a conditional probability about her location. MinXent dictates her belief in the location itself should shift. Critics argue this is counter-intuitive (why should learning about the *consequence* change belief in the *antecedent*?).
  **Our Stance:** For intelligence analysis, MinXent is the only *uniquely determined* mathematical solution. "Keeping $P(A)$ fixed" is a subjective choice that introduces bias. We will use MinXent as the default for defensibility, but the procedure includes a "Judgment Override" flag if operational context dictates $P(A)$ truly cannot shift (e.g., the source has zero knowledge of A).

  ---

  ### The Procedure: Conditional Update Protocol (CUP)

  **Time Required:** 20 Minutes
  **Tools:** Calculator (or provided spreadsheet), Prior Probability Sheet.

  #### Phase 1: Intake & Definition (5 Minutes)
  *Goal: Translate natural language into variables.*

  1.  **Identify the Antecedent (A):** What is the condition? (e.g., "Convoy takes Northern Route").
  2.  **Identify the Consequent (B):** What is the outcome? (e.g., "Ambush at the Pass").
  3.  **Record Prior Probabilities:**
      *   $P(A)$: Current credence the convoy goes North.
      *   $P(B|A)$: Current credence of ambush *if* they go North.
      *   $P(B|\neg A)$: Current credence of ambush *if* they do **not** go North. **(Critical: If unknown, estimate based on base rates. Do not leave blank.)**
  4.  **Record New Constraint ($q$):** The new information. (e.g., "Source says odds are 2:1," so $q = 0.66$).

  #### Phase 2: Diagnostic Check (5 Minutes)
  *Goal: Determine if MinXent applies or if an Override is needed.*

  5.  **Source Knowledge Check:** Does the source know whether A is true?
      *   **Yes:** Proceed to Phase 3 (Standard MinXent).
      *   **No:** (e.g., Source is a local villager who only knows about ambushes, not convoy plans). **FLAG FOR OVERRIDE.** You may choose to fix $P(A)$ in Phase 3, but you must document *why*.
  6.  **Causal vs. Evidential:** Is the link causal (North causes Ambush) or evidential (Ambush implies they went North)?
      *   MinXent handles both mathematically, but if the report implies a *mechanism change* rather than a probability shift, note this in the comments.

  #### Phase 3: Calculation (5 Minutes)
  *Goal: Compute the Defensible Posterior.*

  7.  **Calculate the Shift Factor ($K$):**
      $$K = \frac{P(B|A)_{old} \times (1 - q)}{q \times (1 - P(B|A)_{old})}$$
  8.  **Calculate New Antecedent Probability ($P(A)_{new}$):**
      $$P(A)_{new} = \frac{P(A)_{old}}{P(A)_{old} + ((1 - P(A)_{old}) \times K)}$$
      *(Note: If you flagged an Override in Step 5, set $P(A)_{new} = P(A)_{old}$ and document the deviation.)*
  9.  **Calculate New Consequent Probability ($P(B)_{new}$):**
      $$P(B)_{new} = (P(A)_{new} \times q) + (P(B|\neg A)_{old} \times (1 - P(A)_{new}))$$

  #### Phase 4: Sanity Check & Documentation (5 Minutes)
  *Goal: Ensure the output is actionable and auditable.*

  10. **The "Why Did A Move?" Test:** Look at $P(A)_{new}$. Did it shift?
      *   If **Yes**: Is this operationally sensible? (e.g., "We now think the link is stronger, so the Convoy is *less* likely to go there to avoid it?"). If it makes no sense, revert to Override (Step 8) and document.
      *   If **No**: Proceed.
  11. **Final Output:** Record $P(A)_{new}$, $P(B|A)_{new}$ (which is $q$), and $P(B)_{new}$.
  12. **Sign-off:** Analyst signs the "Conditional Update Sheet" attaching the raw numbers.

  ---

  ### Worked Cases

  #### Case 1: The Standard Update (Validation)
  *   **Scenario:** Convoy (A) likely North (50%). Ambush (B) if North is 50%. Ambush if South is 50%.
  *   **New Intel:** "If North, Ambush is 75% likely" ($q = 0.75$).
  *   **Intuition:** The link is stronger. $P(A)$ should probably stay 50%.
  *   **CUP Calculation:**
      *   $K = (0.5 \times 0.25) / (0.75 \times 0.5) = 0.125 / 0.375 = 0.33$.
      *   $P(A)_{new} = 0.5 / (0.5 + (0.5 \times 0.33)) = 0.5 / 0.665 = \mathbf{0.75}$.
      *   $P(B)_{new} = (0.75 \times 0.75) + (0.5 \times 0.25) = 0.56 + 0.125 = \mathbf{0.69}$.
  *   **Result:** Belief in "Convoy North" rises from 50% to 75%.
  *   **Analyst Reaction:** "Wait, why did believing in the ambush make me more sure they're going North?"
  *   **Defense:** "Because we held the South-risk constant. To make the North-risk higher without changing the South-risk, the mathematical minimum-change solution shifts weight to the North scenario. Unless we invoke the Override (Source doesn't know Convoy plans), this is the coherent position."

  #### Case 2: The "Uncomfortable" Shift (The Judy Benjamin Effect)
  *   **Scenario:** High confidence Convoy is North ($P(A) = 0.8$). High confidence of Ambush if North ($P(B|A) = 0.9$). Low risk if South ($P(B|\neg A) = 0.1$).
  *   **New Intel:** A reliable source indicates the ambush probability is actually lower than thought. "If North, Ambush is only 50%" ($q = 0.5$).
  *   **Intuition:** "Okay, the ambush is less likely if they go North. But I'm still sure they are going North ($P(A)$ stays 0.8)."
  *   **CUP Calculation:**
      *   $K = (0.9 \times 0.5) / (0.5 \times 0.1) = 0.45 / 0.05 = 9$.
      *   $P(A)_{new} = 0.8 / (0.8 + (0.2 \times 9)) = 0.8 / (0.8 + 1.8) = 0.8 / 2.6 = \mathbf{0.31}$.
  *   **Result:** Belief in "Convoy North" crashes from 80% to 31%.
  *   **Analyst Reaction:** "This is wrong. The report was about the *Ambush*, not the *Convoy*. I shouldn't change my mind about the route."
  *   **Defense:** This is the crux of the Judy Benjamin problem. MinXent dictates that if you drastically weaken the correlation between A and B (while keeping B given Not-A fixed), you must drastically reduce belief in A to minimize information distortion.
  *   **Action:** This is the exact moment to use the **Phase 2 Override**.
      *   *Decision:* "Source is an ambush specialist; they do not know convoy logistics."
      *   *Action:* Fix $P(A)_{new} = 0.8$. Document: "MinXent override applied due to source scope limitation."
      *   *Why this is defensible:* You acknowledged the mathematical norm and provided an operational reason for deviating. This is superior to simply ignoring the math.

  #### Case 3: The Certainty Boundary
  *   **Scenario:** $P(A) = 0.5$, $P(B|A) = 0.5$.
  *   **New Intel:** "If North, Ambush is Certain" ($q = 1.0$).
  *   **CUP Calculation:**
      *   $K = (0.5 \times 0) / (1.0 \times 0.5) = 0$.
      *   $P(A)_{new} = 0.5 / (0.5 + 0) = \mathbf{1.0}$.
  *   **Result:** $P(A)$ becomes 100%.
  *   **Analysis:** If the conditional becomes certain and the alternative ($\neg A$) retains any uncertainty about B, MinXent collapses probability into A.
  *   **Warning:** Be extremely careful with $q=1.0$ reports. In intelligence, nothing is certain. Cap $q$ at 0.95 for calculation purposes to avoid artificial certainty.

  ---

  ### Limitations & Warnings

  **What This Procedure Cannot Do:**
  1.  **It Cannot Validate the Source:** Garbage in, garbage out. If the conditional report is a lie, the update is precisely, defensibly wrong.
  2.  **It Cannot Handle Contradictions:** If you receive two conditional reports that are mutually exclusive (e.g., "If A, B is 90%" and "If A, B is 10%"), this procedure breaks. You must reconcile the reports *before* updating.
  3.  **It Is Not Causal Inference:** Updating $P(A)$ based on $P(B|A)$ does not mean A *caused* B or vice versa. It is a probabilistic coherence adjustment.

  **What An Analyst Should NEVER Infer:**
  1.  **Never infer $P(A)$ shifted because the source knows A.** The MinXent shift is a mathematical feature of probability conservation, not necessarily evidence that the source leaked information about A.
  2.  **Never treat $P(B|A)$ as $P(A \rightarrow B)$ (Material Implication).** Do not update as if you learned "Not-A or B".
  3.  **Never skip the $P(B|\neg A)$ estimate.** If you do not estimate the risk of Ambush if the Convoy goes *South*, you cannot mathematically update the risk of them going *North*. If you cannot estimate it, you cannot update. Mark the intelligence as "Non-actionable" until base rates are established.

  **Final Instruction to Team:**
  Use the CUP sheet for every conditional report. If the math gives you a result you hate (like Case 2), do not fudge the numbers. Use the **Override Flag** and write the reason. A documented override is defensible; a hidden intuition is not.
