      *   *Challenge:* Why should "being simultaneous in some frame" equate to "existing now"?
      *   *Presentism:* A presentist argues that only the "local present" exists. But SR destroys the "global present." So, a presentist must either deny SR (hard) or redefine "present" (e.g., as the light cone, or as a local property only).
