      *   **(3):** This follows mathematically from (1) and (2). Hard to reject without rejecting the math.
      *   **(4):** *This is the crux.* This is the metaphysical assumption bridging physics and ontology. It assumes "Reality" is transitive across frames of reference or that "Simultaneity" defines "Reality."
