      *   *Dennett's View (Multiple Drafts Model):* The distinction presupposes a "finish line" of consciousness. Since there is no single place/time where "becoming conscious" happens, asking *when* the revision happened (before or after consciousness) is meaningless. It's a pseudo-distinction.

