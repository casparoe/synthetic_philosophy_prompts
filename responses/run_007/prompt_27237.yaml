answer: |-
  This is an exceptionally clear set of phenomenological data. You have effectively reconstructed the central problem in the philosophy of emotion: the tension between **intentionality** (emotions are *about* something), **physiology** (emotions feel like bodily changes), and **cognition** (emotions seem to involve judgments).

  Your intuitions are actually quite sophisticated; you are rejecting "pure" versions of the big three theories in favor of something nuanced. Here is how the three standard accounts handle your verdicts, followed by a principle that attempts to save your data, and finally, the prediction for your test case.

  ### 1. The Three Accounts vs. Your Verdicts

  #### A. Evaluative Judgement Theory (Cognitivism)
  **The View:** Emotions *are* (or necessarily entail) judgments about the world. To fear is to judge "X is dangerous." To be angry is to judge "X wronged me."
  **Best Version:** The Neo-Stoic view (e.g., Martha Nussbaum). Emotions are value-laden judgments about things significant to your flourishing.

  *   **Where it fits:** It handles **Pride** and **Grief** well (these involve complex judgments about value and loss). It handles **Objectless Anxiety** well (if there is no object to judge, it's not an emotion, hence your "mood" verdict).
  *   **Where it fails (Verdicts you must drop):**
      *   **Phobic Fear:** You explicitly judge the plane is *safe*, yet you feel fear. If emotion = judgment, this is impossible. You would have to say you aren't truly afraid, or you secretly believe it will crash.
      *   **Flash of Anger:** You judge the friend had a "good reason," yet you feel anger. Cognitivism struggles with "recalcitrant emotions" (feelings that persist despite contrary judgments).
      *   **Startle:** It correctly predicts this isn't an emotion (no judgment made), which matches your view.

  #### B. Somatic Perception Theory (Embodiment)
  **The View:** Emotions are the perception of bodily changes. We feel afraid because we notice our heart racing and muscles tensing.
  **Best Version:** William James / Modern Somatic Marker Hypothesis. Emotions are the brain's reading of the body's state.

  *   **Where it fits:** It handles **Phobic Fear** and **Flash of Anger** well (the body reacts even if the mind disagrees). It handles **Hangry** well (bodily state drives the feeling).
  *   **Where it fails (Verdicts you must drop):**
      *   **Startle:** You have a racing heart and a jump. This theory says that *is* the emotion. You say it isn't. You would have to accept that startle is a primitive fear.
      *   **Hangry:** You say this is *not* an emotion, just a bodily state pushing you around. This theory blurs that line; if you feel the irritability, it's an emotion.
      *   **Objectless Anxiety:** If you feel the "hum" in the body, this theory calls it an emotion. You want to call it a mood.

  #### C. Irreducible Feeling Theory (Phenomenology)
  **The View:** Emotions are *sui generis* mental states. They are distinct qualitative "feels" that cannot be reduced to judgments or bodily ticks.
  **Best Version:** Humean or Phenomenological approaches. Emotions are raw feels that intentionalize the world.

  *   **Where it fits:** It respects the **Grief** case (it's not just a judgment, it's a heavy feeling). It allows for **Schadenfreude** (a specific, distinct qualitative feel).
  *   **Where it fails (Verdicts you must drop):**
      *   **Startle vs. Fear:** This theory struggles to explain *why* the "jangled" startle feel isn't an emotion but the "scared" flying feel is. If both are just "feels," what makes one an emotion and the other a reflex? It lacks a criteria for distinction.
      *   **Hangry:** Again, if irritability has a "feel," why isn't it an emotion? This theory tends to be too permissive, classifying almost any affect as an emotion.

  ---

  ### 2. The Saving Principle: "Directed Appraisal"

  None of the pure theories save all your verdicts. However, your intuitions align closely with a hybrid view often called **Intentionalist Appraisal Theory**, but with a specific constraint regarding **consciousness**.

  Here is the principle that saves the most of your verdicts:

  > **Principle:** An emotion is a state of **directed concern**. It must be *about* a specific object or event (intentionality), and it must involve an automatic *appraisal of significance* (good/bad/threatening) that operates independently of conscious intellectual judgment.

  **How this saves your cases:**

  1.  **Startle (Not Emotion):** Saved. A startle is a reflex. It is a reaction *to* a stimulus, but it is not *about* the stimulus in a meaningful way. It lacks "directed concern." It happens before appraisal.
  2.  **Phobic Fear (Emotion):** Saved. It is *about* the plane (directed). It involves an automatic appraisal of "threat" even though your conscious judgment says "safe." The principle allows appraisal and judgment to diverge.
  3.  **Flash of Anger (Emotion):** Saved. It is *about* the cancellation (directed). The automatic appraisal registers "slight" even if the conscious judgment registers "reasonable."
  4.  **Hangry (Not Emotion):** Saved. This is the trickiest one. Under this principle, "hangry" is a **drive state** (like thirst) that lowers the threshold for emotion. The irritability itself lacks a specific *object of appraisal* regarding the partner; the body is just agitated. The *snap* might be an angry outburst, but the underlying state is physiological pressure, not an appraisal of the partner's value. (You can refine this: if you think "they are annoying because I'm hungry," that's an emotion. If you just feel "pushed around," it's a drive state).
  5.  **Grief (Emotion):** Saved. It is *about* the loss. The appraisal is "this matters immensely." The fact that it comes in waves doesn't stop it from being directed concern.
  6.  **Objectless Anxiety (Mood):** Saved. Moods are **undirected**. They color everything but are not *about* anything specific. Emotions are episodic and focused; moods are global and diffuse.
  7.  **Schadenfreude & Pride (Emotion):** Saved. Both are directed at specific objects (colleague, daughter) and involve appraisals of status/value.

  **Why this works better than your working rule:**
  Your rule was: *"Appraisal... that I can't simply decide away."*
  The problem was the Startle. You can't decide away a startle.
  The fix is adding **Intentionality/Aboutness**. You can't decide away a startle, but the startle isn't *about* anything. It's just a mechanical reset. Emotions must be *about* something mattering to you.

  ---

  ### 3. Prediction for the Test Case

  **The Case:** The mild disgust you feel when you see a plate of food that you know is fine but that reminds you of something rotten.

  **Applying the Principle of Directed Appraisal:**

  1.  **Is it Directed?** Yes. It is about the plate of food.
  2.  **Is it a Reflex?** No. It is a sustained feeling ("mild disgust"), not a momentary jump like the startle.
  3.  **Is it a Drive State?** No. It isn't caused by low blood sugar or hormones; it's triggered by a visual association.
  4.  **Is it Recalcitrant?** Yes. Like the flying case, your intellectual judgment says "this is safe/fine," but your automatic appraisal says "contaminant/rot."

  **The Verdict:**
  **This IS an emotion.**

  **Why:**
  It fits the exact same structure as your **Phobic Fear** case.
  *   **Flying:** Intellect says "Safe," Appraisal says "Danger." $\rightarrow$ Fear (Emotion).
  *   **Food:** Intellect says "Fine," Appraisal says "Rotten/Contaminant." $\rightarrow$ Disgust (Emotion).

  Under the **Directed Appraisal** principle, the fact that you *know* the food is fine is irrelevant to whether it counts as an emotion. Emotions are the output of the automatic appraisal system, not the conscious judgment system. Because the feeling is *about* the food (directed) and represents the food as having a negative value (contamination) that you cannot simply "decide away" (recalcitrance), it qualifies as a full emotion, specifically a **recalcitrant emotion**.

  **One nuance:**
  If the feeling is *extremely* mild and fleeting (e.g., a micro-expression of "ew" that vanishes instantly), some theorists might call it an "affective reaction" rather than a full emotional episode. But based on your description of the flying phobia (where the fear is real despite safety knowledge), you should be consistent: if the flying fear is an emotion, the food disgust is an emotion. Both are your automatic system screaming "Threat/Contaminant" while your conscious system says "False Alarm."

  **Summary:** Your intuitions point toward a view where emotions are **automatic appraisals of significance directed at specific objects.** This distinguishes them from reflexes (no object), moods (no specific object), and drive states (physiological cause rather than evaluative appraisal).
