answer: |-
  Here is the specification for a robust account of scientific success, designed to adjudicate between scientific realism and anti-realism without presupposing the verdict.

  ### 1. The Historical Data Set (The Boundary Conditions)
  An account cannot cherry-pick. It must process the full range of historical evidence typically deployed in the debate.

  *   **The "Graveyard" Cases (Anti-Realist Anchors):**
      *   **Phlogiston Theory:** Must explain why a theory that successfully organized combustion data for decades posited a substance that does not exist.
      *   **Caloric Fluid:** Must account for the mathematical success of heat flow equations based on a non-existent fluid.
      *   **Luminiferous Ether:** Must address the success of Maxwell's equations when framed within a mechanical ether medium that was later discarded.
      *   **Requirement:** The account must explain how these theories were *successful* without granting that their central ontological claims were *true*.
  *   **The "Hall of Fame" Cases (Realist Anchors):**
      *   **General Relativity (1919):** The prediction of light bending during an eclipse. This was a novel prediction, not a post-hoc accommodation.
      *   **Neptune (1846):** The prediction of a planet's existence and location based on Newtonian perturbations.
      *   **The Positron (1931):** Dirac's equation implying anti-matter before experimental detection.
      *   **Requirement:** The account must explain why these specific successes feel different from the Graveyard cases. It must distinguish between "getting the right answer for the right reason" and "getting the right answer for the wrong reason."
  *   **The "Zombie" Cases (The Control Group):**
      *   **Ptolemaic Astronomy:** Capable of predicting planetary positions for centuries without heliocentrism.
      *   **Requirement:** The account must explain why empirical adequacy here did not imply truth, whereas in the Hall of Fame cases, it is argued to do so.

  ### 2. The Conceptual Distinctions (The Vocabulary)
  The account must maintain specific conceptual separations. Collapsing these renders the debate incoherent.

  *   **Empirical Adequacy vs. Truth:**
      *   *Definition:* Adequacy means "saving the phenomena" (matching observations); Truth means "accurate description of reality (including unobservables)."
      *   *Requirement:* The account must allow for a theory to be empirically adequate but false. If adequacy entails truth by definition, anti-realism is impossible by fiat.
  *   **Reference vs. Existence:**
      *   *Definition:* Did the term 'electron' in 1900 refer to the same entity as 'electron' in 2000, even if the properties ascribed to it changed?
      *   *Requirement:* The account must specify a theory of reference (causal, descriptivist, etc.). If reference is purely descriptivist, most past terms fail to refer (supporting PMI). If causal, they might succeed (supporting Realism).
  *   **Approximate Truth vs. Binary Truth:**
      *   *Definition:* Is truth a switch (on/off) or a gradient (closer/further from reality)?
      *   *Requirement:* The account must define "approximate truth" rigorously. If it is merely a metaphor for "useful," it cannot support the No Miracles Argument.
  *   **Specific Theory vs. Research Program:**
      *   *Definition:* Is the unit of success a single formulation (e.g., Newton's *Principia*) or a broader trajectory (e.g., Classical Mechanics)?
      *   *Requirement:* The account must justify the unit of analysis. Realists often expand the unit to preserve truth; Anti-realists shrink it to highlight falsification.

  ### 3. The Pessimistic Meta-Induction (The Stress Test)
  The account cannot simply ignore the PMI; it must neutralize or incorporate it.

  *   **The Induction:** "Most past successful theories are now considered false; therefore, most current successful theories are likely false."
  *   **Requirement:** The account must identify a **relevant difference** between past theories and current theories that blocks the induction.
      *   *Option A:* Argue past theories weren't *really* successful (they were only approximately adequate).
      *   *Option B:* Argue past theories *were* partially true (structural continuity).
      *   *Option C:* Accept the induction but argue truth isn't the goal (Anti-realism).
  *   **Constraint:** You cannot use current theory to prove past theory was "close" without begging the question (circularity). The metric for "closeness" must be independent of the current theory's truth.

  ### 4. Categorization of Requirements

  | Requirement | Category | Rationale |
  | :--- | :--- | :--- |
  | **Internal Consistency** | **Non-Negotiable** | If the account contradicts itself, it is logically invalid. |
  | **Historical Coverage** | **Non-Negotiable** | Ignoring the Graveyard or Hall of Fame cases is data-dredging. |
  | **Adequacy/Truth Distinction** | **Non-Negotiable** | Collapsing these eliminates one side of the debate by definition. |
  | **Novel Prediction Handling** | **Non-Negotiable** | Success is defined partly by predictive power; the account must explain it. |
  | **Structural Realism Compromise** | **Camp Preference** | Realists may accept structure is real but ontology changes; strict entity realists will not. |
  | **Definition of Reference** | **Camp Preference** | Causal theories favor Realists; Descriptivist theories favor Anti-Realists. |
  | **Unit of Analysis (Theory vs. Program)** | **Camp Preference** | Realists prefer broader programs to show continuity; Anti-realists prefer specific theories to show rupture. |

  ### 5. The Single Forcing Requirement
  **The Explanation of Novel Predictive Success Without Hindsight Bias.**

  This is the requirement that does the most to force a verdict.
  *   **The Test:** Can the account explain why a theory successfully predicts a *novel* phenomenon (one not used to construct the theory) without invoking the truth of the theory's unobservable posits?
  *   **Why it forces a verdict:**
      *   **If Realism:** It argues that only the truth (or approximate truth) of the underlying mechanisms can explain why the theory "latched onto" a phenomenon it wasn't designed to fit. (The No Miracles Argument).
      *   **If Anti-Realism:** It must provide a naturalistic mechanism (e.g., evolutionary selection of theories, structural preservation, or methodological constraints) that generates novel predictions without requiring true ontological commitments.
  *   **The Verdict:** If an anti-realist account can robustly model novel prediction as a product of method or structure alone, the Realist's "No Miracles" argument collapses. If they cannot, Realism becomes the only viable explanation for that specific subset of success. This is the pivot point because empirical adequacy on *old* data can be tuned; novel prediction is the hardest constraint to satisfy accidentally.

  ### 6. Vulnerability and Falsification of This Spec

  **What would change my mind about the "Single Forcing Requirement"?**
  My reasoning rests on the assumption that "novel predictive success" is a stable, theory-neutral category. I would change my mind if it were demonstrated that **novelty is invariably retrospective.**
  If historical analysis shows that what counts as a "novel prediction" is always constructed by the winning theory's narrative (i.e., we only label it a "novel prediction" because the theory turned out to be true, whereas failed theories' predictions are labeled "coincidences"), then the requirement loses its forcing power. If the data point itself is theory-laden, it cannot adjudicate between theories.

  **Where is this reasoning most likely to fail?**
  The reasoning fails if it treats **Reference** as too binary.
  The spec demands a distinction between "terms that refer" and "terms that don't." However, modern philosophy of language suggests reference is often partial, fragmented, or context-dependent. If 'phlogiston' referred to *negative mass* or *electrons* in a specific context, the "Graveyard" cases stop being counter-examples to Realism and become examples of *reference change*.
  If the distinction between "success due to truth" and "success due to luck/structure" relies on a naive theory of reference, the entire spec collapses into a verbal dispute about what "reference" means, rather than a substantive dispute about the world. The spec assumes we can cleanly separate ontology from structure; if ontology is inextricable from structure, the "Single Forcing Requirement" cannot be met by either side, and the debate dissolves into pragmatism.
