prompt: |-
  Before I read any more proposals about how to think about the alignment tax and the competitiveness constraint in AI development, I want the full specification of what an adequate account of them has to deliver. By the alignment tax I mean the cost in capabilities, speed, or other performance that a developer pays to make a system safer or more aligned; by the competitiveness constraint I mean the pressure created when a developer who pays that cost can be outcompeted by one who pays less of it. The account I want assessed is meant to be good enough to guide decisions by a lab, a funder, or a regulator about whether safety spending will survive contact with competition, so judge the requirements against that purpose.

  Write the desiderata: the cases such a theory must get right, the distinctions it cannot collapse, and the structural or empirical patterns it must be consistent with, with the consideration behind each. Mark which requirements are non-negotiable and which are preferences of particular camps — race-to-the-bottom pessimists, capability-dividend optimists, coordination-failure theorists, and so on. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement does the most to exclude candidate accounts. No citations or reading lists; I want the reasoning, not the literature.

  Among the cases I suspect must be on the list, and which you should sharpen or reject as you see fit: alignment methods that measurably cost benchmark performance; alignment methods that improve robustness or instruction-following at no measured capability cost; safety work that is pure fixed overhead; one-time transition costs that shrink as tooling matures; firms that voluntarily adopt costly safety practices absent regulation; safety failures that are diffuse and delayed versus failures that can destroy the deploying firm; unipolar, oligopolistic, and many-entrant settings; and actors who capture most of the benefit of a race while externalizing the catastrophic tail. The distinctions I suspect cannot be collapsed include: the alignment tax versus a measured performance difference that disappears under better evaluation; the competitiveness constraint versus ordinary profit maximization; the competitiveness constraint versus a coordination failure; safety that buys defense versus safety that buys only reputation; and a private cost-benefit calculation versus a socially adequate one. For each item you include, give the case or consideration that makes it a requirement rather than a camp preference.

  Then, briefly, say how the main existing ways of thinking about this — the naive race-to-the-bottom story, the view that the tax is mostly an artifact of immature methods, and the coordination-failure framing — fare against your list. Keep the scorecard short; the criteria are the deliverable.

  State how confident you are in each major claim, and single out the point you are least sure of. Maximum 850 words.
