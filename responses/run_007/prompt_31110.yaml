answer: |-
  An adequate account must predict whether safety spending survives competition. To guide labs, funders, or regulators, it requires the following desiderata.

  **Desiderata**

  1.  **Measurement Validity (Non-negotiable):** The theory must distinguish true capability costs from evaluation lag. *Consideration:* Alignment methods that improve robustness at no measured capability cost cannot be taxed if benchmarks are flawed. Collapsing this distinction leads to overestimating the tax.
  2.  **Failure Mode Severity (Non-negotiable):** It must differentiate firm-survivable failures from catastrophic externalities. *Consideration:* Safety failures that destroy the deploying firm create private incentives for safety; those that externalize catastrophe do not. A theory treating all risk as reputational damage fails here.
  3.  **Market Structure Sensitivity (Non-negotiable):** Predictions must vary across unipolar, oligopolistic, and many-entrant settings. *Consideration:* Competitiveness pressure is not uniform; a monopolist faces different constraints than a startup in a crowded field.
  4.  **Incentive Separation (Non-negotiable):** It must distinguish the competitiveness constraint from ordinary profit maximization. *Consideration:* A firm may maximize profit by cutting safety, but the *constraint* is the fear of losing the lead specifically. Collapsing these obscures whether regulation or market forces solve the problem.
  5.  **Private vs. Social Calculus (Non-negotiable):** The account must capture where private cost-benefit diverges from socially adequate safety. *Consideration:* Actors capturing race benefits while externalizing tails create a gap no private optimization closes.
  6.  **Dynamic Technical Trajectory (Preference: Capability-Dividend Optimists):** It should model how one-time transition costs shrink as tooling matures. *Consideration:* If the tax is transient, heavy regulation may be unnecessary; if structural, it is required.
  7.  **Voluntary Adoption Conditions (Preference: Coordination-Failure Theorists):** It must explain when firms voluntarily adopt costly safety absent regulation. *Consideration:* Safety that buys defense (moats) differs from safety that buys only reputation.

  **Tensions and Exclusions**

  **Incompatible Pair:** Requirements 3 (Market Structure) and 4 (Incentive Separation) are difficult to jointly satisfy. In tight markets, profit maximization *becomes* the competitiveness constraint; distinguishing them requires defining a threshold where competition forces action contrary to long-term profit. Most models collapse this to avoid complexity.

  **Most Exclusionary Requirement:** Requirement 2 (Failure Mode Severity). Most economic models assume continuous cost functions where risk is a parameter. Catastrophic, existential risk breaks standard cost-benefit analysis, excluding most industrial organization models and naive race-to-the-bottom stories that treat failure as merely costly rather than terminal.

  **Evaluation of Existing Frameworks**

  *   **Naive Race-to-the-Bottom:** Fails Requirement 3 (assumes perfect competition regardless of market power) and Requirement 2 (assumes all failure is firm-terminal or ignores externalities). It predicts universal safety cutting even where monopolies exist.
  *   **Immature Methods (Capability-Dividend):** Fails Requirement 6 (assumes tax goes to zero too quickly) and often ignores Requirement 5 (externalities). It assumes technical progress solves the economic incentive problem.
  *   **Coordination-Failure:** Strong on Requirement 5 and 4, but weak on Requirement 1 (technical measurement). It often treats the tax as a fixed political variable rather than a technical cost function.

  **Confidence**

  I am highly confident in Requirements 1, 2, and 5; any theory ignoring measurement error, catastrophic discontinuity, or externalities cannot guide high-stakes decisions. I am moderately confident in Requirement 3; market structure matters, but its interaction with AI scaling is empirically underdetermined.

  **Least Certain Point:** I am least sure about Requirement 7 (Voluntary Adoption Conditions). It is unclear whether safety can ever function as a defensive moat in AI, or if interoperability and open weights will always prevent safety from being a competitive advantage. This uncertainty undermines the Coordination-Failure camp's hope for voluntary standards.
