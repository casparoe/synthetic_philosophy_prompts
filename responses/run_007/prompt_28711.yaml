answer: |-
  Here is a decision procedure designed for a one-hour review, grounded in behavioral economics and organizational theory, followed by the three case applications.

  ### The Sunk Cost Sanity Check (SCSC)

  **Philosophy:** Standard economics dictates that sunk costs (past expenditure) are irrelevant; only marginal costs and marginal benefits matter. However, behavioral research (Arkes & Blumer, 1985; Staw, 1976) shows that humans irrationally escalate commitment to justify past spending. Conversely, Real Options Theory (McGrath, 1997) and Transaction Cost Economics (Williamson, 1981) argue that past investment *does* matter if it purchased **information** (learning) or created **switching barriers** (restart costs). This procedure separates the *fallacy* (spending to justify the past) from the *asset* (spending to leverage the past).

  **Timebox:** 60 Minutes.
  **Attendees:** Product Lead, Eng Lead, Finance Rep (optional but recommended).

  #### Step 1: The Market/Utility Test (Marginal Benefit)
  **Question:** If this project were proposed *today* with zero prior work, would we fund it based on its future value alone?
  *   **Data Needed:** Updated TAM/SAM, user problem validation, or internal efficiency metric.
  *   **Good Enough Answer:** "Yes, projected ROI is > X%" or "Yes, this solves a critical compliance risk."
  *   **Stop Condition (KILL):** If the answer is **No**.
      *   *Exception:* Proceed to Step 2 only if the "No" is due to timing, not fundamental value.
  *   **Judgment Flag:** If the value is strategic (e.g., "blocks a competitor") rather than financial, this is a judgment call. **Escalate to Exec Sponsor.**

  #### Step 2: The Completion Cost Test (Marginal Cost)
  **Question:** What is the specific cost (time, money, opportunity cost) to reach a *shippable* or *usable* state from today?
  *   **Data Needed:** Engineering estimate to "Done," not "Perfect."
  *   **Good Enough Answer:** A range (e.g., "4–6 engineer-weeks").
  *   **Stop Condition (KILL):** If Cost to Complete > Expected Marginal Benefit (from Step 1).
  *   **Note:** Do not include past hours in this calculation.

  #### Step 3: The Restart/Switching Test (Transaction Costs)
  **Question:** If we kill this now, what is the cost to re-acquire this capability later?
  *   **Data Needed:** Vendor pricing, re-hiring cost, or re-implementation estimate.
  *   **Good Enough Answer:** "It would cost 3x to rebuild in 12 months" or "Vendor lock-in risk is high."
  *   **Procedure Logic:** This captures the "waste" that isn't sunk cost fallacy. If switching costs exceed the cost to complete, **Continue**.
  *   **Judgment Flag:** Estimating "organizational memory loss" is subjective. If the argument relies heavily on "we'll forget how this works," **Escalate.**

  #### Step 4: The Learning/Asset Test (Real Options)
  **Question:** Did the money already spent buy us knowledge or assets that survive the project's death?
  *   **Data Needed:** List of reusable components, APIs written, or market insights gained.
  *   **Good Enough Answer:** "The auth module is reusable," or "We now know customers hate Feature X."
  *   **Procedure Logic:** If the learning is high, you can **Kill the Project but Salvage the Assets.** Do not continue the project just to "harvest" learning; harvest the learning and kill the project.
  *   **Stop Condition:** If the only value is "not wasting the work," **KILL.** (This is the fallacy).

  #### Step 5: The Team/Signal Test (Behavioral Cost)
  **Question:** Does killing this project signal that we punish experimentation, or does it signal that we are disciplined?
  *   **Data Needed:** Team tenure, recent morale survey, history of pivots.
  *   **Good Enough Answer:** "Team knows this was a bet; they expect a clear call."
  *   **Judgment Flag:** **High.** This is purely qualitative. If the team is fragile or this is the third kill in a row, **Escalate to People/HR + Exec.**

  ---

  ### Case Applications

  Here is the SCSC applied to your three scenarios.

  #### Case 1: The 80% Feature (Missed Market Window)
  *   **Status:** 80% built. Competitor launched 3 months ago. Market interest cooled.
  *   **Step 1 (Market):** If proposed today, would we fund it? **No.** The window closed. The marginal benefit is near zero.
  *   **Step 2 (Completion):** Cost is low (2 weeks).
  *   **Step 3 (Restart):** Cost to restart later? Irrelevant, because there is no "later" for this market window.
  *   **Step 4 (Learning):** Can we salvage code? Yes, some backend logic might reuse.
  *   **Step 5 (Signal):** Team is tired.
  *   **SCSC Verdict:** **KILL.**
  *   **Rationale:** Step 1 is a hard stop. Low marginal cost does not justify zero marginal benefit. Reusing code (Step 4) is a salvage operation, not a reason to ship a feature nobody wants.
  *   **The Unpopular Answer:** I know you want to save the work. But shipping a feature late into a cold market consumes support and maintenance budget (negative marginal value). The "80% done" is a psychological trap. The code is an asset; the feature is a liability.

  #### Case 2: The Internal Tool (vs. Vendor Product)
  *   **Status:** Works, but took 2x time. Vendor product exists that covers 90% of use cases.
  *   **Step 1 (Market/Utility):** If proposed today, would we fund it? **Yes.** We need this capability to operate.
  *   **Step 2 (Completion):** Cost to reach parity with vendor? **Low.** It already works.
  *   **Step 3 (Restart/Switching):** Cost to switch to vendor? **High.** Integration debt, data migration, subscription fees, loss of custom workflow fit.
  *   **Step 4 (Learning):** High. We know our workflow better than the vendor.
  *   **Step 5 (Signal):** Team built this to solve a specific pain.
  *   **SCSC Verdict:** **CONTINUE.**
  *   **Rationale:** While the "2x time" looks like inefficiency (sunk cost), Step 3 (Switching Costs) dominates. The vendor product is a recurring cost with integration risk. The internal tool is a sunk cost with zero marginal maintenance cost (relative to vendor fees). The "waste" of the 2x time is irrelevant; the future cash flow favors the internal tool.

  #### Case 3: The Legacy Rewrite (Migration Work)
  *   **Status:** 6 months into a 12-month rewrite. New system is unstable. Old system works but is fragile. Argument is "we can't waste the 6 months."
  *   **Step 1 (Market/Utility):** If proposed today, would we fund a rewrite? **Maybe.** Depends on if the old system is a critical risk.
  *   **Step 2 (Completion):** Cost to finish? **Unknown/High.** "Unstable" suggests technical debt was underestimated.
  *   **Step 3 (Restart/Switching):** Cost to stay on Legacy? **High.** Risk of outage.
  *   **Step 4 (Learning):** Did the 6 months buy knowledge? **Yes.** We know the legacy system is harder to map than thought.
  *   **Step 5 (Signal):** Team is burnt out.
  *   **SCSC Verdict:** **KILL (or Pause for Re-scope).**
  *   **Rationale:** This is the hardest one. The argument "we can't waste the migration work" is explicitly Step 4 failure. You cannot continue a project *solely* to justify past spend. If the new system is unstable (Step 2 risk) and the old system still works (Step 3 mitigation), you must stop.
  *   **Correction:** The procedure dictates you **Kill the current plan.** You may start a *new* project (Step 1) that incorporates the learning (Step 4), but you must formally close the current one. Continuing the current trajectory is the definition of Escalation of Commitment (Staw, 1976).

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot detect political suicide.** Step 5 attempts to capture morale, but it cannot calculate the cost of angering a specific VP who championed the project. That requires political capital, not a procedure.
  2.  **It cannot value "Hope."** Sometimes projects are kept alive because a breakthrough is theoretically possible (R&D). This procedure is for Product/Engineering delivery, not basic research.
  3.  **It relies on honest estimates.** If Engineering underestimates Step 2 (Cost to Complete) to protect their project, the procedure breaks. It requires psychological safety to admit "this will take longer."

  ### Confidence & Limitations

  **Overall Confidence:** **85%.**
  This procedure successfully separates the *economic reality* (marginal costs) from the *organizational reality* (switching costs and morale). It prevents the "Sunk Cost Fallacy" without falling into the "Ignore Switching Costs" trap.

  **Least Sure Step:** **Step 5 (The Team/Signal Test).**
  This is the weakest link. It is entirely qualitative and manipulatable. A team can claim "morale will crash" to save any project. There is no objective metric for "organizational trust." In practice, this step often becomes a veto power for senior leaders rather than a data-driven check. It is the step most likely to require a philosopher (or an experienced COO) in the room to adjudicate honestly.
