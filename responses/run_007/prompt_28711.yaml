      *   *Nuance/Behavioral:* "Sunk cost fallacy" isn't always irrational.
          *   *Reputation/Signaling:* Quitting signals incompetence to stakeholders (Staw, 1981).
          *   *Learning/Option Value:* The investment bought information. Killing it wastes the *information*, not the money. (Real Options Theory).
          *   *Morale/Trust:* Killing projects arbitrarily damages psychological safety.
          *   *Switching Costs:* Restarting later might cost more than finishing now (Transaction Cost Economics).
      *   *Philosophy:* Pragmatism (Dewey) - truth is what works. But also, commitment integrity (Bratman) - planning agents need to stick to plans unless there's a good reason, otherwise, they become erratic.

  3.  **Drafting the Procedure (The "Sunk Cost Sanity Check"):**
      *   *Constraint:* Must fit in 1 hour. Needs to be actionable.
      *   *Structure:* Funnel approach. Easy kills first, then deeper analysis.
