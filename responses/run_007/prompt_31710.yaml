      *   *The Paradox:* If $r_{change}$ can be changed by the process defined in $r_{change}$, we have self-reference.
      *   *Hart's Rule of Recognition:* H.L.A. Hart distinguished between primary rules (conduct) and secondary rules (change/adjudication). Crucially, the "Rule of Recognition" is usually a social fact, not a written rule. Putting it *inside* the system creates the infinite regress problem.
      *   *Kelsen's Grundnorm:* Hans Kelsen posited a "Basic Norm" that validates the system but lies outside it. The user explicitly says there is *no* external document. This is dangerous.
