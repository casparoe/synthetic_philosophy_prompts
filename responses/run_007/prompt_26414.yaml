answer: |-
  This is a great topic for an engineering audience because it maps surprisingly well to type safety, API contracts, and system reliability. Since you know the material, the challenge is purely translation and pacing.

  Here is a teaching plan designed for a 20-minute slot with a non-philosopher engineering audience.

  ### 1. The Prerequisite Concept: "Assertion as a Commit"
  Before you can discuss *which* norm governs assertion, you have to convince them that assertion is a specific **action** with rules, not just "making noise with words."

  *   **What comes first:** The distinction between *asserting* and other speech acts (guessing, hypothesizing, joking).
  *   **The Analogy:** Use a **Type System** or **API Contract**.
      *   Explain that when you assert "P", you are effectively calling a public function `assert(P)`.
      *   The "Norm" is the **type safety check**.
      *   If the norm is violated, the code might run (you won't get arrested), but it's a runtime error waiting to happen (you've broken the contract of communication).
  *   **Why this order:** If they think assertion is just "saying what you think," the debate dissolves into psychology. If they see it as "updating the shared state of the team," the need for a strict rule makes sense.

  ### 2. The Single Carrying Example: "The Flaky CI Pipeline"
  Do not use the Lottery or Moore's Paradox directly. They are too abstract or linguistic. Use a scenario engineers live with: **Deployment Confidence.**

  Create one scenario with three dials you can turn to test the three main norms (Truth, Belief, Knowledge).

  *   **The Base Scenario:** You are on call. You need to tell the Slack channel: *"The production deployment is safe."*
  *   **Dial 1 (Testing the Belief Norm):** You believe it's safe, but you didn't check the logs. It turns out it *was* safe.
      *   *Intuition:* You were irresponsible. Belief isn't enough.
  *   **Dial 2 (Testing the Truth Norm):** You check the logs, they say "Safe." You assert it. Unbeknownst to you, the logging service is buggy and always reports "Safe," but by sheer luck, the deployment *actually is* safe.
      *   *Intuition:* You got lucky. You shouldn't have asserted it. Truth isn't enough.
  *   **Dial 3 (Testing the Knowledge Norm - The Lottery Variant):** You check the logs. They are 99.9% reliable (like a lottery). You assert "It is safe."
      *   *Intuition:* This is the kicker. Even with high probability and truth, engineers feel uneasy asserting *certainty* without deterministic verification. This motivates the Knowledge Norm.

  **Why this works:** It keeps the context constant so they aren't distracted by new story details. It isolates the variable (the epistemic status) just like a unit test.

  ### 3. Managing Misconceptions
  Engineers will try to solve this with pragmatism. You need to head these off at specific times.

  *   **"Isn't this just about not lying?"**
      *   *When:* **Intro (Minute 3).**
      *   *Fix:* Explicitly state: "We are assuming the speaker is honest. They aren't trying to deceive. The question is: can you be honest and still violate the rule?"
  *   **"Isn't this just politeness or Gricean maxims?"**
      *   *When:* **After Dial 1 (Minute 10).**
      *   *Fix:* Distinguish *Constitutive* vs. *Regulative* rules.
      *   *Analogy:* Politeness is like "don't trash talk in Slack" (social rule). The Norm of Assertion is like "don't commit to main without passing tests" (structural rule). If you violate the norm, you aren't rude; you've made an invalid move.
  *   **"Well, it depends on the context/stakes, right?"**
      *   *When:* **The very end (Minute 18).**
      *   *Fix:* Acknowledge this is a valid philosophical position (Contextualism), but tell them: "For the next 18 minutes, we are debugging the *default* configuration. If we can't find the default rule, we can't understand how context changes it." Don't let this derail the core argument.

  ### 4. The Comprehension Check Question
  Do not ask "Does this make sense?" They will lie. Ask a **Edge Case** question that forces them to apply the rule you just taught.

  **The Question:**
  > "Imagine you write a script to guess a random 256-bit encryption key. By pure luck, your script guesses the correct key on the first try. You now possess the correct key. You turn to your teammate and say: *'I know the key.'*
  >
  > Based on what we discussed, did you violate the norm of assertion? Why?"

  **What to listen for:**
  *   **Bad answer:** "No, because it was true." (They missed the point).
  *   **Bad answer:** "Yes, because you lied." (They didn't listen to the 'no lying' constraint).
  *   **Good answer:** "Yes, because you didn't *know* it, you just guessed correctly. Truth + Belief wasn't enough."

  ### 5. What to Explicitly Exclude (Scope Creep)
  You will be tempted to show off the reading you did. Don't.

  *   **Do not name-drop philosophers:** No "As Timothy Williamson says..." It creates distance. Keep it about the logic, not the history.
  *   **Do not explain Gettier Cases deeply:** The "Flaky CI" example *is* a Gettier case. Don't stop to explain what a Gettier case is. Just use the scenario.
  *   **Do not discuss Skepticism:** Don't let anyone spiral into "But do we know anything?" Keep the focus on the *rule of communication*, not the possibility of knowledge.
  *   **Do not discuss Implicature:** If someone asks about "implying" vs "saying," park it. "That's Grice, and it's a different layer. We're talking about the assertion layer."

  ### Summary of the 20-Minute Flow
  1.  **0-3 min:** Hook. Assertion = `commit()`. There must be a type check.
  2.  **3-5 min:** The Candidates. Truth vs. Belief vs. Knowledge.
  3.  **5-15 min:** The "Flaky CI" Stress Test (run the 3 dials).
  4.  **15-18 min:** Address the "It depends" and "Politeness" objections.
  5.  **18-20 min:** The Encryption Key Check Question & Wrap.

  If you stick to the **Type System analogy** and the **Flaky CI example**, you will keep them in their domain of expertise while leading them into the philosophical puzzle. Good luck!
