answer: |-
  # SEMINAR HANDOUT: The Ethics of Markets
  ## Diagnostic Instrument: Mapping Your Commitments on Commodification

  **Instructions:** Below are ten concrete cases involving market transactions. For each case, assume that all parties consent, information is symmetric, and no third parties are directly harmed unless specified. Select the **one** option that best captures your primary reason for judging the transaction permissible or impermissible. Do not overthink; choose the justification that feels most robust to you.

  ---

  ### Part I: Diagnostic Questions

  **1. The Kidney Sale**
  A wealthy recipient offers $200,000 to a financially struggling donor for a kidney. The surgery is safe, and the donor understands the risks.
  *   (A) Permissible. Bodily autonomy and mutual benefit outweigh abstract concerns; the donor owns their body.
  *   (B) Impermissible. The offer is coercive because the donor's poverty leaves them no reasonable alternative but to sell.
  *   (C) Impermissible. The human body is not a commodity; putting a price on organs degrades human dignity regardless of consent.
  *   (D) Impermissible. It creates a system where the poor become spare parts for the rich, undermining civic equality.

  **2. The Hurricane Water**
  After a hurricane disables local infrastructure, a hardware store raises the price of bottled water from $2 to $20. Supply is limited; demand is high.
  *   (A) Permissible. High prices signal scarcity and incentivize supply, which helps everyone in the long run.
  *   (B) Impermissible. In emergencies, need trumps property rights; profiting from desperation is exploitative.
  *   (C) Impermissible. Water is a basic necessity essential for life; treating it as a standard market good corrupts our understanding of human need.
  *   (D) Impermissible. It violates a norm of solidarity; citizens should not profit from the misfortune of their community.

  **3. The Vote Sale**
  A citizen sells their vote to a political campaign for $500. The vote is cast secretly as agreed.
  *   (A) Permissible. If I own my labor, I own my political participation; restricting sale is paternalistic.
  *   (B) Impermissible. Poor voters will be disproportionately induced to sell, skewing political power toward the wealthy.
  *   (C) Impermissible. Voting is a public trust, not private property; selling it corrupts the meaning of citizenship.
  *   (D) Impermissible. It treats political equality as a commodity, violating the principle of "one person, one vote."

  **4. Commercial Surrogacy**
  A woman carries a pregnancy for a couple in exchange for $50,000, with full legal protections and medical care.
  *   (A) Permissible. Reproductive labor is work; banning it restricts women's economic opportunities.
  *   (B) Impermissible. The financial pressure makes true consent impossible for most surrogates.
  *   (C) Impermissible. It turns children into products and pregnancy into a factory process, altering the norms of parenthood.
  *   (D) Impermissible. It reinforces class hierarchies where wealthy families rent the bodies of poorer women.

  **5. Queue-Jumping Passes**
  An amusement park sells "Fast Passes" allowing wealthy guests to skip the line for popular rides, while others wait longer.
  *   (A) Permissible. It maximizes efficiency and allows the park to subsidize lower entry fees for others.
  *   (B) Impermissible. It is unfair to those who cannot afford the pass; time should not be purchasable in this context.
  *   (C) Impermissible. It turns a shared social experience into a hierarchy of status, damaging the communal nature of the park.
  *   (D) Impermissible. It signals that wealth grants superior standing, which is offensive to equal citizenship.

  **6. Dwarf-Tossing**
  A consenting adult with dwarfism is paid to be thrown at padded walls in a bar for entertainment.
  *   (A) Permissible. The individual has the right to use their body for income as they see fit.
  *   (B) Impermissible. The industry preys on the limited employment options available to people with disabilities.
  *   (C) Impermissible. It treats a human being as a projectile/object, which is inherently degrading regardless of consent.
  *   (D) Impermissible. It evokes a visceral reaction of disgust that signals a moral boundary we should respect.

  **7. Carbon Offsets**
  A corporation continues high emissions but purchases "offsets" (funding tree planting elsewhere) to claim carbon neutrality.
  *   (A) Permissible. The atmosphere does not care where the reduction happens; the net consequence is what matters.
  *   (B) Impermissible. Offsets allow wealthy polluters to avoid changing their behavior, perpetuating injustice.
  *   (C) Impermissible. It commodifies the atmosphere, suggesting moral duties can be discharged via payment rather than restraint.
  *   (D) Impermissible. It creates a moral license that encourages further pollution, worsening long-term outcomes.

  **8. Mercenary Soldiers**
  A state hires a private military firm to fight a war instead of conscripting citizens.
  *   (A) Permissible. Professional soldiers are often more efficient and reduce the burden on the citizenry.
  *   (B) Impermissible. Poor citizens will be disproportionately recruited, making war a burden of the class system.
  *   (C) Impermissible. The state's monopoly on violence is a public function that cannot be delegated for profit.
  *   (D) Impermissible. It severs the link between citizenship and sacrifice, undermining democratic accountability for war.

  **9. Blood Plasma**
  Donors are paid $50 per visit for plasma, which is used for pharmaceuticals.
  *   (A) Permissible. Payment increases supply and saves lives; the "gift" model is inefficient.
  *   (B) Impermissible. Payment attracts desperate donors who may hide health risks, endangering recipients.
  *   (C) Impermissible. Blood is a symbol of human solidarity; monetizing it erodes the norm of altruism.
  *   (D) Impermissible. It turns a part of the human person into inventory, which feels fundamentally wrong.

  **10. The Apology Service**
  A person hires an actor to deliver a sincere apology to a friend they have wronged, because they are too ashamed to do it themselves.
  *   (A) Permissible. The recipient gets the apology they deserve; the method of delivery is secondary.
  *   (B) Impermissible. The transaction is deceptive if the recipient believes the apologizer is present.
  *   (C) Impermissible. Apologies express personal remorse; outsourcing them empties the act of its moral meaning.
  *   (D) Impermissible. It suggests that moral repair is a service that can be bought rather than a relationship to be mended.

  ---

  ### Part II: Scoring Key

  Tally your answers. Count how many times you selected **(A)**, **(B)**, **(C)**, and **(D)**.

  *   **Mostly (A): The Market Optimist.**
      You hold that voluntary exchange is presumptively permissible. Wrongness arises only from fraud, force, or uninternalized negative externalities. If consent is valid and information is clear, the market is a neutral tool for welfare.
  *   **Mostly (B): The Background Justice Theorist.**
      You believe markets are not intrinsically wrong but are corrupted by inequality. In a world of perfect equality and social safety nets, these transactions might be permissible. Your objection is to the *context* of choice, not the *object* of exchange.
  *   **Mostly (C): The Corruption of Meaning Theorist.**
      You argue that introducing market norms into certain spheres (body, citizenship, family) changes the meaning of the goods involved. The wrongness is intrinsic: some things lose their value when priced.
  *   **Mostly (D): The Equal Standing Theorist.**
      You focus on the social and political status of persons. Markets are wrong when they create hierarchies that undermine democratic equality or signal that some citizens are inferior to others.

  **Nuanced Profiles (Check for these patterns):**

  *   **The Incommensurability View:** You selected **(C)** frequently, but specifically on cases involving intimate goods (Kidney, Surrogacy, Apology). You believe certain values cannot be compared on a single scale of price without a category error.
  *   **The Coercion-Only View:** You selected **(B)** almost exclusively. You do not object to markets in organs or votes *in principle*, but only because current poverty makes consent impossible.
  *   **The Repugnance Intuitionist:** You selected **(D)** on cases like Dwarf-Tossing or Kidney Sales even when consent was stipulated. You believe visceral disgust tracks moral truth even when rational justification is difficult to articulate.
  *   **The Segmented Pluralist:** You have a mix of **(B)** and **(C)**. You believe different spheres (political, economic, intimate) have different rules. Vote selling is wrong (Political Sphere), but Plasma selling is okay (Economic Sphere).

  ---

  ### Part III: The Logical Space of Commodification

  This quiz maps the logical space generated by crossing three fault lines: (1) **Source of Wrongness** (Intrinsic vs. Extrinsic), (2) **Locus of Harm** (Individual vs. Social/Political), and (3) **Role of Intuition** (Heuristic vs. Justification).

  **Occupied Positions:**
  The quiz identifies the standard positions in the literature: Optimism (Extrinsic/Individual), Background Justice (Extrinsic/Social), Corruption (Intrinsic/Normative), and Equality (Intrinsic/Political).

  **Empty or Unstable Cells:**
  1.  **Intrinsic Wrongness + Purely Individual Harm:** This cell is largely empty. If a transaction is intrinsically wrong (e.g., selling a soul), it usually implies a social or normative harm, not just harm to the trader. A position claiming "Selling a kidney is wrong only because it hurts the seller's soul, but society doesn't care" is incoherent in political philosophy.
  2.  **Repugnance as Sole Justification + Consequentialist Framework:** It is rare to find a theorist who argues repugnance is an independent reason *and* that consequences are the only thing that matters. This cell is empty because repugnance is typically deontological or virtue-ethical.
  3.  **Background Justice + Intrinsic Corruption:** This combination is unstable. If you believe the good is intrinsically corrupted by price (Corruption), fixing background inequality (Background Justice) should not make it permissible. Students who select both (B) and (C) indiscriminately may hold an unexamined pluralism.

  **Indistinguishable Positions:**
  This quiz cannot fully separate the **Equal Standing Theorist** from the **Corruption of Meaning Theorist** on questions like Vote Selling. Both view the transaction as impermissible due to the nature of the good.
  *   *Differentiation:* To separate them, add a case where equality is unaffected but meaning is corrupted (e.g., selling friendship). If you ban it, you are a Corruption Theorist. If you allow it, you are an Equal Standing Theorist.

  ---

  ### Part IV: Awkward Commitments

  Every position entails commitments that rival theories find difficult to accept. Be prepared to defend these implications.

  *   **Market Optimist:** You must accept that a sufficiently wealthy person should be allowed to purchase a kidney from a desperate person, provided the contract is clear, even if the donor dies young.
  *   **Background Justice Theorist:** You must admit that in a utopia of perfect equality, selling votes or children would be permissible. Many find this counterintuitive.
  *   **Corruption of Meaning Theorist:** You must accept that banning a market (e.g., in kidneys) may lead to more deaths than allowing it, prioritizing symbolic meaning over human life.
  *   **Equal Standing Theorist:** You risk prohibiting luxury goods or private education, as these also signal status hierarchies that undermine civic equality. Where is the line?
  *   **Incommensurability View:** You must explain why some goods (labor) are commensurable with money while adjacent goods (care work, surrogacy) are not, without relying on tradition alone.
  *   **Repugnance Intuitionist:** You must defend why visceral disgust (which has historically targeted interracial marriage or homosexuality) is a reliable guide to moral truth in market contexts.
  *   **Coercion-Only View:** You must defend the claim that a choice made under severe economic pressure is not a "real" choice, which risks paternalistically denying agency to the poor.
  *   **Segmented Pluralist:** You must provide a principled map of the boundaries between spheres. Why is the "political sphere" immune to markets while the "economic sphere" is not, without begging the question?
