  She will likely tell you one of two things, both leading to the same result:
  1.  **Prevention:** When you tried to move it, something stopped you. You got a cramp, a bird distracted you, or the pebble was heavier than it looked.
  2.  **Reversion:** You managed to move it, but when you returned to the present, the pebble was back on the left. Maybe a park sweeper moved it back, maybe the wind blew it, maybe you realize *you* were the one who moved it back originally without remembering.

  **Why?** Because her core stance is that the past is a **Read-Only File**. Her "Car Crash" verdict allows *details* to shift (road vs. hospital), but only to preserve the *outcome* (death). A pebble on a bench has no "outcome" to preserve other than its own position. Therefore, the position itself is the record, and the record cannot be rewritten.

  ### The Candidate Rules
  Dana's verdicts fit three distinct models of time travel. To understand her, we have to separate them:

  **1. The Paradox Police (Consistency Only)**
  *   **The Rule:** You can change anything you want, *unless* it creates a logical contradiction (like erasing your own existence).
  *   **Fits:** The Grandfather verdict (can't kill him).
  *   **Fails:** The Car Crash verdict. Under this rule, you *should* be able to save the person, because saving them doesn't create a paradox, it just creates a new future. Dana says you can't.

  **2. The Historical Momentum (Significance Threshold)**
  *   **The Rule:** "Big" history is fixed (deaths, disasters, wars), but "small" trivia is flexible. The universe only corrects changes that ripple outward significantly.
  *   **Fits:** The Car Crash verdict (death is big, location is small).
  *   **Fails:** The Grandfather verdict. Killing a grandfather is a "big" change, but the mechanism she describes ("gun jams") implies the universe stops *actions*, not just outcomes. Also, she explicitly says "You can't rewrite the record," which implies *all* of it.

  **3. The Immutable Block (Ontological Fixity)**
  *   **The Rule:** There is only one timeline. It is a solid, 4-dimensional block. Anything you did in the past, you *always* did. If you remember the pebble on the left, then in the true timeline, the pebble was always on the left. Any attempt to change it is an illusion or will be corrected by reality itself.
  *   **Fits:** All verdicts. It explains why the gun jams (you never shot him), why the friend dies (they were always dead), and why the letter fails (you never received it).
  *   **Status:** This is the strongest match for her language ("The universe won't allow," "Already in the record").

  ### Which Rule I'd Bet On
  I would bet on **Rule 3: The Immutable Block**, but with a specific flavor: **Active Resistance.**

  Notice her language: "The gun jams," "You trip," "Younger self won't listen." She doesn't just say "It didn't happen." She describes the universe *actively fighting* the traveler. This suggests she believes in a **Single Fixed Timeline** that possesses a sort of immune system. It doesn't just logically preclude changes (like a math equation); it physically prevents them (like a force field).

  For the pebble, she believes the universe treats a trivial change the same as a major one: **Deviation is forbidden.** The "Record" isn't just the history books; it's the physical state of reality.

  ### The Follow-Up Case to Settle It
  To distinguish whether she believes in **Historical Fixity** (only human-recorded events matter) or **Universal Fixity** (physical reality itself is locked), put this case to her:

  **The "Deserted Island" Case:**
  > "Suppose I travel back 1,000 years to a deserted island where no human has ever set foot. There are no history books, no witnesses, and no cameras. I move a large rock from the beach to the treeline. Then I come back. Does the rock stay moved?"

  *   **If she says "Yes, it stays moved":** She is running **Rule 2 (Historical Momentum)**. She believes the universe only protects the "Record" of human history. If no one knows, it doesn't matter.
  *   **If she says "No, it snaps back (or you couldn't move it)":** She is running **Rule 3 (Immutable Block)**. She believes Time itself is rigid, regardless of whether humans are watching.

  **Why this settles it:**
  Her previous verdicts all involve *human* consequences (grandfathers, car crashes, dictators, personal regrets). The pebble case is the bridge—it's physical, but near humans. The Deserted Island case removes humans entirely. If she says the rock *still* can't be moved, you know she believes reality itself is pre-written, not just history.
