prompt: |-
  I'm putting together a one-page proposal for a workshop we're pitching on intergenerational justice and climate policy, and I need help shaping my half-baked idea into something that sounds fundable. The rough thought: most debates about pure time preference treat it as one single thing—a number δ you insert to discount future utility just because it's later—but I suspect that lumping things together is doing a lot of the argumentative work. There seem to be at least three different mental moves that all travel under the same name: impatience about my own future consumption, a kind of generational partiality where people alive now count for more simply because they're alive now, and an adjustment for the fact that future people, or future states of the world, are uncertain in a way the present isn't. I want to seperate these and see which, if any, can survive the usual Ramsey-style objection that discounting future enjoyments just because they're future is ethically indefensible. But I'm not sure how to frame the question so it has a determinate answer rather than just a taxonomy.

  Can you turn this into a one-page proposal? I need a precise statement of the question, an explanation of why the existing debate leaves it open (without citations, I'll add those myself), a method that is actually philosophical rather than just empirical—though it can use thought experiments and stylized cases from climate or pension policy—and an honest account of what would count as the project failing. The deliverable would be a short paper for a workshop, maybe six months of part-time work, so keep the scope realistic. I also want to be able to say something about why a foundation should fund philosophy here rather than just more integrated assessment modeling.
