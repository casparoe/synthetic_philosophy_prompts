answer: |-
  **Project Title:** Disaggregating Pure Time Preference: A Normative Audit for Climate Policy

  **Project Summary**
  Climate policy recommendations rely heavily on Integrated Assessment Models (IAMs), which in turn depend on a "pure time preference" parameter ($\delta$) to discount future welfare. Standard ethical critiques (following Ramsey) argue that discounting future well-being simply because it occurs later is ethically indefensible—a form of discrimination against future generations. However, policy practice continues to use positive discount rates. This project hypothesizes that the stalemate exists because $\delta$ is treated as a monolithic scalar when it actually conflates three distinct normative moves: (1) descriptive impatience (individual preference for earlier consumption), (2) generational partiality (the claim that present people matter more), and (3) probabilistic adjustment (discounting for the uncertainty of future existence or states of the world). By disentangling these components, this project seeks to determine if any survive ethical scrutiny, thereby clarifying the moral inputs of climate economics.

  **Research Question**
  Does disaggregating the standard parameter for pure time preference reveal distinct normative justifications, and if so, do any survive the Ramsey critique without collapsing into descriptive impatience or probabilistic risk?

  **State of the Debate**
  Current literature tends to polarize around two positions: economists treat discounting as a technical necessity for convergence, while ethicists treat it as a moral failure. This binary leaves a gap. There is no systematic account of whether the *reasons* usually lumped together under "time preference" carry different moral weights. If "uncertainty" is ethically permissible but "generational partiality" is not, current models are obscuring a crucial moral distinction. The debate remains open because it focuses on the *value* of the number rather than the *conceptual structure* of the justification.

  **Methodology**
  This is a conceptual and normative inquiry, not an empirical one. The project will employ:
  1.  **Conceptual Analysis:** Rigorously defining the three components (impatience, partiality, uncertainty) to ensure they are logically distinct and not merely semantic variations.
  2.  **Thought Experiments:** Stylized cases to test intuitions. *Example:* Comparing a policy that benefits a known future person versus a probabilistic future person to isolate the uncertainty component from the time component.
  3.  **Policy Stress-Testing:** Applying the disaggregated framework to stylized climate and pension cases. For instance, does separating "risk of non-existence" from "pure time discounting" change the moral evaluation of a carbon tax versus an adaptation fund?

  **Why Fund Philosophy?**
  IAMs are optimization engines; they cannot validate their own inputs. If the moral architecture of the discount rate is conceptually confused, the model produces "precise wrongness." Philosophy provides the necessary conceptual hygiene to ensure that the parameters fed into economic models correspond to defensible ethical claims. This project does not build a new model; it ensures the moral variables in existing models are coherent before they are calculated.

  **Deliverables and Timeline**
  *   **Months 1–2:** Conceptual mapping of the three components; literature review (internal).
  *   **Months 3–4:** Development of thought experiments and stylized policy cases.
  *   **Months 5–6:** Drafting of the workshop paper and one article-length manuscript.
  *   **Output:** One conference-ready paper (4,000 words) and one draft for peer review.

  **Conditions for Failure**
  This project faces two primary risks:
  1.  **Mathematical Redundancy:** It may turn out that while the concepts are distinct philosophically, they are mathematically indistinguishable in standard utility functions, rendering the distinction policy-inert.
  2.  **Normative Collapse:** It is possible that upon disaggregation, *none* of the three components survive the Ramsey critique.
  *   *Mitigation:* Both outcomes are valuable. Demonstrating mathematical redundancy warns modelers against over-interpreting parameters. Demonstrating normative collapse strengthens the case for near-zero discount rates. The project fails only if the distinctions prove too vague to analyze rigorously.

  **Investigator Note**
  The scope is limited to the normative justification of the parameters, not the derivation of a specific numerical rate. This ensures the project remains within the realm of philosophical ethics while maintaining direct relevance to policy design.
