answer: |-
  Here is the specification sheet for any rule claiming to handle belief updating under uncertain evidence (probability kinematics).

  ### The Spec List: Requirements for Uncertain Evidence Updating

  #### 1. Probabilistic Coherence
  *   **The Requirement:** The output belief state ($P_{new}$) must be a valid probability function (non-negative, sums to 1, obeys axioms).
  *   **The Reason:** If the rule outputs incoherent probabilities, you become susceptible to a Dutch Book (a guaranteed loss in betting scenarios). This violates the basic definition of rational belief.
  *   **Status:** **Non-Negotiable.**

  #### 2. The Certainty Limit (Recovery Condition)
  *   **The Requirement:** If the uncertain evidence happens to become certain (i.e., $P_{new}(E) = 1$), the rule must collapse into standard Bayesian Conditionalization ($P_{new}(H) = P_{old}(H|E)$).
  *   **The Reason:** Standard conditionalization is the gold standard for certain evidence. A generalization that contradicts the specific case it generalizes is inconsistent.
  *   **Status:** **Non-Negotiable.**

  #### 3. Rigidity (The Sufficiency Condition)
  *   **The Requirement:** For any hypothesis $H$ and the partition of evidence $E_i$, the conditional probability must remain fixed: $P_{new}(H | E_i) = P_{old}(H | E_i)$.
  *   **The Reason:** This distinguishes *receiving evidence* from *changing your mind about how evidence relates to hypotheses*. In your "cat in the dark" case, Rigidity says your belief that "If it is a cat, it moved" shouldn't change just because you're now more sure it moved. It isolates the impact to the evidence itself, not your theory of the world.
  *   **Status:** **Normative/Definitional.** (It is required for the update to count as *Jeffrey-style* kinematics. If you violate this, you are doing a different kind of update, often called "holistic" or "theory change.")

  #### 4. The Evidence/World Distinction
  *   **The Requirement:** The rule must distinguish between a change in belief due to *input* (evidence) and a change in belief due to *temporal passage* or world-change (e.g., the cat actually moved, or you forgot something).
  *   **The Reason:** As David Lewis argued, if the world changes, your probabilities should change even without new evidence (e.g., the probability that "it is now noon" changes as time passes). A rule that treats all probability shifts as "evidence" conflates learning with time.
  *   **Status:** **Non-Negotiable (Conceptual).**

  #### 5. Commutativity (Order Independence)
  *   **The Requirement:** If you receive two distinct pieces of uncertain evidence ($I_1$ and $I_2$), the final belief state should be the same regardless of whether you process $I_1$ then $I_2$, or $I_2$ then $I_1$.
  *   **The Reason:** The order in which your brain processes simultaneous or overlapping inputs shouldn't arbitrarily dictate your final conclusion. If the evidence is "the same," the result should be stable.
  *   **Status:** **Desideratum (Often Violated).** This is a major pain point. Most uncertain evidence rules fail this.

  #### 6. Input Specificity (The "What did you learn?" Constraint)
  *   **The Requirement:** The rule must specify exactly *what* parameter of the experience drives the update. Is it the new probability of $E$? Is it a likelihood ratio? Is a log-odds shift?
  *   **The Reason:** Saying "I'm now 60% sure it's a cat" is not enough to update other beliefs (like "is it a tiger?") unless you specify *why* the probability shifted. Did the visual data change, or did your background knowledge change?
  *   **Status:** **Non-Negotiable (Operational).** Without this, the math is underdetermined.

  ---

  ### Incompatibilities & Trade-Offs

  You cannot have everything on the spec list simultaneously. Here are the known conflicts:

  **1. Commutativity vs. Rigidity (The Diaconis-Zabell Problem)**
  *   **The Conflict:** If you define evidence inputs as "Set $P(E)$ to $x$" (the standard Jeffrey input), **you cannot have Commutativity.**
  *   **Why:** If you set $P(E)$ to 0.6, then later set $P(F)$ to 0.8, the second operation overwrites the probabilistic context of the first. Reversing the order yields a different posterior.
  *   **The Trade-off:** To save Commutativity, you must change the *Input Specificity*. You cannot define inputs as final probabilities ($P_{new}(E)$); you must define them as *likelihood ratios* or *Bayes factors* (how much the experience favors $E$ over $\neg E$).
  *   **Verdict:** If you want order independence, you must abandon the "set probability to $x$" input format.

  **2. Rigidity vs. Holism**
  *   **The Conflict:** Rigidity requires conditional probabilities ($P(H|E)$) to stay fixed. However, sometimes evidence *does* change how you link hypotheses to evidence (e.g., you realize the light is dim, so visual motion is less reliable).
  *   **The Trade-off:** A rule that enforces Rigidity (like Jeffrey Conditionalization) cannot handle "defeaters" (evidence that undermines the reliability of the evidence).
  *   **Verdict:** Rigidity is non-negotiable *for Jeffrey Conditionalization*, but if you want a rule that handles reliability shifts, you must drop Rigidity and adopt a more complex holistic model.

  ---

  ### Classification of Requirements

  | Requirement | Type | Why? |
  | :--- | :--- | :--- |
  | **Coherence** | **Non-Negotiable** | Mathematical necessity for rationality. |
  | **Certainty Limit** | **Non-Negotiable** | Consistency with established theory. |
  | **Evidence/World** | **Non-Negotiable** | Conceptual necessity (learning vs. time). |
  | **Input Specificity** | **Non-Negotiable** | Operational necessity (math won't work without it). |
  | **Rigidity** | **Normative** | Defines "pure" evidence vs. theory change. |
  | **Commutativity** | **Aesthetic/Pragmatic** | Desirable for stability, but mathematically costly. |

  ---

  ### Brief Scorecard of Existing Rules

  **1. Standard Bayesian Conditionalization**
  *   **Handles Uncertain Evidence?** No. Requires $P(E)=1$.
  *   **Commutes?** Yes.
  *   **Verdict:** Useless for your "cat in the dark" case.

  **2. Jeffrey Conditionalization (Probability Kinematics)**
  *   **Handles Uncertain Evidence?** Yes.
  *   **Input:** Direct assignment of new probabilities for a partition ($P_{new}(E_i)$).
  *   **Commutes?** **No.** (Order matters).
  *   **Rigidity:** Enforced.
  *   **Verdict:** The standard choice, but be warned: the order in which you process murky observations changes the result.

  **3. Likelihood Ratio Updating (Field Condition)**
  *   **Handles Uncertain Evidence?** Yes.
  *   **Input:** Bayes Factors (how much the experience shifts the odds, not the final probability).
  *   **Commutes?** **Yes.**
  *   **Rigidity:** Enforced.
  *   **Verdict:** Mathematically superior for multiple updates, but harder to introspect. It is easier to say "I'm 60% sure" (Jeffrey) than "This experience shifts the odds by a factor of 3" (Likelihood).

  **4. Holistic Conditionalization (Weisberg/Leitgeb)**
  *   **Handles Uncertain Evidence?** Yes.
  *   **Input:** Allows changes to $P(H|E)$ (violates Rigidity).
  *   **Commutes?** Generally No.
  *   **Verdict:** Use this if you suspect the evidence might be unreliable or if learning changes your theory, not just your facts.

  ### Recommendation for Your Case
  For the "cat in the dark" scenario:
  1.  **If you process one observation:** Use **Jeffrey Conditionalization**. It satisfies Coherence, Certainty Limit, and Rigidity. Ignore Commutativity (irrelevant for single updates).
  2.  **If you process a sequence of murky observations:** Do **not** use standard Jeffrey inputs ($P_{new}(E)=x$). Use **Likelihood Ratio Updating**. This preserves Commutativity, ensuring your final belief doesn't depend on the order you noticed the shadows and sounds.
