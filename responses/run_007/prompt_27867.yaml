prompt: |-
  I've been trying to work out on my own how you're supposed to change your mind when the evidence doesn't come in as a clean yes/no. Like I half-see something move in the dark and my probability that it's a cat goes from 10% to 60% without any single proposition becoming certain. I've gathered that the standard rule (update on the thing you learned for sure) doesnt cover this, and that there are fancier rules like Jeffrey conditionalization that are supposed to. Before I commit to one of them, I want the spec: what does any rule for updating on uncertain evidence actually have to deliver? Give me the requirements list -- the cases it has to get right, the distinctions it can't collapse (your evidence changing vs the world changing, for instance), the facts about probability it can't contradict, and whether the order of two murky observations should matter -- with the reason each one counts as a requirement. Also say which requirements are non-negotiable and which are just conveniences or aesthetics, and flag any pair that can't be had together. Keep the scorecard of existing rules brief; the list is the part I'm after.
reasoning: |-
