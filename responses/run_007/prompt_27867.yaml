          3.  *Rigidity (The Sufficiency Condition):* $P_{new}(H|E_i) = P_{old}(H|E_i)$. This is the heart of "evidence" vs. "arbitrary change."
          4.  *Distinction: Evidence vs. World:* Updating beliefs vs. the world actually changing (Lewis).
          5.  *Commutativity:* Order of inputs.
          6.  *Responsiveness:* Directionality.
      *   **Status of Requirements:** Label them Mandatory, Normative, or Pragmatic.
      *   **Incompatibilities:** Highlight the Commutativity vs. Rigidity tension (Diaconis & Zabell).
      *   **Brief Scorecard:** Bayes, Jeffrey, Holistic, etc.

  6.  **Refining the "Rigidity" Point:**
      *   This is the most technical part. Jeffrey Conditionalization *is* defined by Rigidity. If you drop Rigidity, you aren't doing Jeffrey updating, you're doing something else. But is Rigidity *required* for rational updating? Sometimes learning changes the conditional probabilities (e.g., learning a measurement device is biased). So, Rigidity is a constraint on the *type* of experience, not necessarily a universal law of rationality. I need to be careful here. It's a requirement for the *rule* to work as intended, but the *applicability* of the rule depends on whether the experience satisfies Rigidity.
