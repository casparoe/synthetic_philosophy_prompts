      *   **Specific Demands:**
          *   List the requirements (cases to get right, distinctions to maintain, probability facts to respect, order effects).
          *   Provide the *reason* each counts as a requirement.
          *   Distinguish between non-negotiable (normative) vs. convenient/aesthetic requirements.
          *   Flag any incompatibilities (impossibility results).
          *   Keep the scorecard of existing rules (Bayes, Jeffrey, etc.) brief.
          *   Focus primarily on the *list of requirements*.
      *   **Tone/Style:** Analytical, precise, philosophical but practical ("spec sheet" style).
      *   **Underlying Context:** The user understands standard Bayesian Conditionalization (update on certainty) and knows about Jeffrey Conditionalization but wants to evaluate the *criteria* for any such rule before adopting one.

  2.  **Deconstruct the Problem (Uncertain Evidence):**
      *   Standard Bayesianism: $P_{new}(H) = P_{old}(H | E)$. Requires $P_{new}(E) = 1$.
      *   The User's Case: $P_{new}(E)$ is not 1 (e.g., "It's a cat" goes from 0.1 to 0.6). This is *probability kinematics* or *uncertain evidence*.
      *   Key Challenge: How to constrain the shift from $P_{old}$ to $P_{new}$ without a certain anchor?

  3.  **Brainstorming Requirements (The "Spec List"):**
      *   *Consistency:* Must result in a valid probability function (sum to 1, non-negative).
      *   *Responsiveness:* If evidence supports $H$, $P(H)$ should go up.
      *   *Certainty Limit:* If evidence *does* become certain, it should reduce to standard Conditionalization.
      *   *Independence of Irrelevant Alternatives:* Changing probability of $E$ shouldn't affect $H$ if $E$ and $H$ are independent.
      *   *Commutativity (Order):* Does observing $E_1$ then $E_2$ yield the same result as $E_2$ then $E_1$? (Crucial for uncertain evidence).
      *   *Rigidity (Sufficiency):* The "Jeffrey Condition." The conditional probabilities $P(H|E)$ should stay fixed if the evidence only affects the probability of $E$, not the link between $E$ and $H$.
      *   *Distinction:* Evidence change vs. World change (Lewis's point).
      *   *Reflection:* Should current beliefs align with expected future beliefs?

  4.  **Categorizing Requirements (Non-negotiable vs. Aesthetic/Debatable):**
      *   *Non-negotiable:* Probabilistic Coherence, Certainty Limit (if it claims to generalize Bayes), Rigidity (usually considered the defining feature of *evidential* updating vs. arbitrary shifting).
      *   *Debatable/Contextual:* Commutativity (often fails in real uncertain evidence), Reflection (can be violated by forgetting or self-locating beliefs).
      *   *Incompatibilities:* Commutativity vs. Rigidity is the big one in Jeffrey Conditionalization literature (the "order effect" problem).

  5.  **Drafting the Content - Section by Section:**

