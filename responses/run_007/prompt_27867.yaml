  7.  **Refining the "Commutativity" Point:**
      *   Standard Bayes is commutative. Jeffrey is *not* generally commutative. This is a known bug/feature. If I see a shadow (cat 60%) then hear a meow (cat 90%), is it the same as hearing then seeing? Usually yes, but mathematically Jeffrey updating depends on the partition probabilities. If the partitions shift, order matters. This is a critical "flag" for the user.

  8.  **Refining "Evidence vs. World":**
      *   David Lewis's point: If the world changes (e.g., I become a brain in a vat), my probabilities change, but that's not *updating on evidence*. A rule must distinguish between $P_{new}$ driven by input $I$ vs. $P_{new}$ driven by temporal passage/world shift.

