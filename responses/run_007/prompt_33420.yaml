      *   **Context:** A seminar on "Minds and Machines" discussing Douglas Hofstadter's *Gödel, Escher, Bach* (specifically the "Ant Fugue" dialogue featuring Aunt Hillary).
      *   **Problem:** The phrase "the whole is greater than the sum of its parts" is being used as a conversation-stopper, but it's ambiguous. Different people mean different things by it.
