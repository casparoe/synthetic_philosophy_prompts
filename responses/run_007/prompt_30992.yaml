      *   *Alternative:* The Food Bank gets rejected because it doesn't meet the "Scale" threshold of the foundation's mission? No, that's too mission-drifty.
      *   *Best Choice:* The AI Safety one gets rejected (or drastically downscoped) because the 0.01% is uncalibrated. This hurts because it *might* be the most important thing, but we can't know. Or, the Astronomical Suffering one gets a "Maybe" if we use a specific prior, but the procedure says "No." Let's go with the procedure killing the AI Safety proposal due to lack of calibration, forcing the PO to admit they are guessing. That's uncomfortable.
