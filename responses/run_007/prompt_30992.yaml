      3.  **The Evidence Hierarchy:** Is this model-based or data-based?
      4.  **The "Regret" Test:** If we are wrong, what do we lose?
      5.  **The Value Handoff:** When does it become a values question?

  5.  **Developing the Worked Examples:**
