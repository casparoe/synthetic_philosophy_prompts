answer: |-
  ### Part 1: Brainstorming the Breakpoints

  Before giving you the tool, I need to be honest about where it will chafe. You are asking for a procedure to solve a philosophical problem (Pascal's Mugging) with administrative tools (checklists). That works 90% of the time, but the 10% failure mode is where the real risk lies.

  Here are the three places this procedure will break or cause you pain:

  1.  **The "Black Swan" Blind Spot:** This procedure relies on *reference classes* (has this been done before? can we calibrate the probability?). By definition, the most world-changing interventions (penicillin, nuclear non-proliferation in 1950) have no reference class. This procedure will systematically filter out genuine, unprecedented breakthroughs because they look exactly like muggings until they work. You are trading the chance of a miracle for the certainty of stewardship.
  2.  **The Expertise Trap:** To evaluate an AI safety claim, you need AI safety expertise. To evaluate a biosecurity claim, you need epidemiology expertise. If you don't have that in-house, this procedure will force you to reject the proposal because *you* can't calibrate the probability. It shifts the burden from "Is this true?" to "Can I verify this?" These are different questions.
  3.  **The Board Optics Problem:** You can tell your board, "We rejected this because the math was fake." You cannot tell them, "We rejected this because we aren't smart enough to know if it's real." This procedure forces the latter admission in hard cases.

  **The Core Philosophy of this Procedure:**
  We are not maximizing Expected Value (EV) in the abstract. We are maximizing **Robust Expected Value**. We apply a heavy discount to probabilities that cannot be empirically calibrated. We treat uncalibrated probabilities as epistemic noise, not data.

  ***

  ### Part 2: The Epistemic Triage Protocol (ETP)

  **Time Budget:** 90 Minutes
  **Goal:** Distinguish between *high-leverage bets* and *mathematical artifacts*.
  **Rule of Thumb:** If the headline EV depends entirely on a number you cannot independently verify, the EV is zero for decision-making purposes.

  #### Step 1: The Epistemic Floor (15 Minutes)
  *Question:* Can the applicant justify their probability estimate using a reference class of similar past events?
  *   **Look for:** Comparisons to historical analogs (e.g., "Similar policy interventions reduced risk by X%," "Historical frequency of this type of lab leak is Y").
  *   **Pass:** The applicant provides a reference class of at least 10–20 comparable cases, or cites peer-reviewed meta-analyses that derive the probability from data.
  *   **Fail:** The probability is derived from a theoretical model, a "Delphi survey" of three experts, or is stated as a personal belief ("We estimate 0.01%").
  *   **Stop Rule:** If **Fail**, move immediately to Step 5 (The Cap). Do not proceed to math. You cannot multiply a guess by a billion.

  #### Step 2: The Tractability Test (20 Minutes)
  *Question:* Does *this specific grant amount* meaningfully shift the probability of the outcome?
  *   **Look for:** A clear mechanism linking \$500k to a change in the world. (e.g., "\$500k hires 3 researchers for 2 years to solve Sub-problem A, which unblocks Progress B").
  *   **Pass:** The proposal identifies a bottleneck that is known to be solvable with this level of resources, and the bottleneck is a necessary condition for the huge outcome.
  *   **Fail:** The proposal argues that the money contributes to a "general ecosystem" or "awareness," or the problem is so massive (e.g., "aligning superintelligence") that \$2M is a drop in the bucket with no measurable marginal impact.
  *   **Stop Rule:** If **Fail**, Reject. Funding a drop in the bucket is consumption, not investment.

  #### Step 3: The Feedback Loop (15 Minutes)
  *Question:* Will we know within 3–5 years if this money was well spent?
  *   **Look for:** Intermediate milestones that are correlated with the long-term goal.
  *   **Pass:** "If we succeed, we will have produced X paper, Y protocol, or Z policy adoption within 24 months."
  *   **Fail:** "We will know if we succeeded only if the catastrophe is averted in 50 years."
  *   **Stop Rule:** If **Fail**, you cannot manage the grant. Reject, or convert to a general operating support grant (which has different criteria).

  #### Step 4: The EV Sanity Check (20 Minutes)
  *Question:* If we apply a "Skeptic's Discount" to the probability, does the project still compete with our baseline opportunities?
  *   **Action:** Take the applicant's claimed probability. Apply a **10% Confidence Discount** (multiply by 0.1) if it is model-based, or a **50% Discount** if it is data-based but noisy.
  *   **Comparison:** Compare this *discounted* EV against your "Next Best Alternative" (e.g., a proven program with lower ceiling but higher floor).
  *   **Pass:** The discounted EV still justifies the risk relative to your portfolio mandate.
  *   **Fail:** The project only looks good at the raw, undiscounted numbers.
  *   **Stop Rule:** If **Fail**, Reject.

  #### Step 5: The Stewardship Cap (The "Values Handoff") (20 Minutes)
  *Question:* Even if the math works, does this violate our concentration limits?
  *   **Rule:** No single "High-Uncertainty/High-Impact" grant may exceed 10% of the annual discretionary portfolio, regardless of EV.
  *   **Action:** If the proposal passes Steps 1–4 but requires more than 10% of your budget to be effective, you must downscope it or Reject.
  *   **Values Handoff:** If the proposal passes Steps 1–4 and fits within the Cap, the decision is no longer arithmetic. It is a values question: *Does our foundation want to be a venture capitalist for social good, or a safety net?*
      *   **Handoff to Board:** Present the "Discounted EV" vs. "Reputational Risk." Let them vote on the risk tolerance.

  ***

  ### Part 3: Worked Examples

  Here is how the ETP runs on three typical proposals.

  #### Example 1: The AI Safety "Existential Bet"
  *   **Proposal:** \$500k grant to a new research lab.
  *   **Claim:** 0.01% (1 in 10,000) chance of preventing catastrophic AI misalignment.
  *   **Impact:** Averting existential catastrophe (Valued at effectively infinite, or \$100B+ for calculation purposes).
  *   **Headline EV:** \$10M+ (Dominates portfolio).

  **Running the ETP:**
  1.  **Epistemic Floor:** **FAIL.** The applicant cites a model of AI takeoff speeds and a survey of 5 researchers. There is no historical reference class for "preventing AI apocalypse." We cannot calibrate 1 in 10,000.
  2.  **Tractability:** **PARTIAL.** They argue \$500k hires 3 researchers. It is unclear if 3 researchers move the needle on a global coordination problem.
  3.  **Feedback Loop:** **FAIL.** Success is defined as "humanity survives." We won't know for 30 years. Intermediate milestones (papers published) are weakly correlated with actual safety.
  4.  **EV Sanity Check:** **N/A.** Since Step 1 failed, we treat the probability as epistemic noise. The EV collapses.
  5.  **Stewardship Cap:** **N/A.**

  **Conclusion:** **REJECT.**
  **Why this is uncomfortable:** You suspect this might actually be one of the most important things happening in the world. But the procedure forces you to admit that you have no way to distinguish this proposal from a scam, and funding it sets a precedent that you accept uncalibrated probability claims. You are prioritizing *verifiable stewardship* over *potential maximum impact*.
  **Board Narrative:** "We cannot validate the risk assessment. Funding this would require us to accept mathematical claims we cannot audit."

  #### Example 2: The Local Food Bank
  *   **Proposal:** \$200k grant to expand weekend meal distribution.
  *   **Claim:** 95% chance of feeding 50,000 additional meals.
  *   **Impact:** Reduced hunger, improved health outcomes for low-income families.
  *   **Headline EV:** Stable, predictable, moderate.

  **Running the ETP:**
  1.  **Epistemic Floor:** **PASS.** The organization has 10 years of data. They know exactly how much food \$1 buys. Reference class is robust.
  2.  **Tractability:** **PASS.** \$200k directly purchases food and logistics. Marginal impact is linear and clear.
  3.  **Feedback Loop:** **PASS.** Meal counts are tracked monthly. Outcomes reported quarterly.
  4.  **EV Sanity Check:** **PASS.** Even with a 20% discount on efficiency, the cost-per-outcome is within foundation benchmarks.
  5.  **Stewardship Cap:** **PASS.** Fits easily within portfolio diversification.

  **Conclusion:** **APPROVE.**
  **Why this is boring:** It doesn't change the world. It helps people now. The procedure validates this as "High Certainty Good."
  **Board Narrative:** "Proven track record, measurable outcomes, low risk."

  #### Example 3: The "Astronomical Suffering" Bet
  *   **Proposal:** \$100k grant to publish philosophical papers on reducing suffering in potential future space civilizations.
  *   **Claim:** 1 in 1,000,000,000 (one in a billion) chance of influencing future norms enough to prevent \(10^{20}\) units of suffering.
  *   **Impact:** Astronomically large.
  *   **Headline EV:** Infinite (Mathematically dominates everything).

  **Running the ETP:**
  1.  **Epistemic Floor:** **HARD FAIL.** A human being cannot calibrate a 1 in a billion probability. This is below the "Epistemic Floor" of human cognition. There is no reference class for influencing future space civilizations.
  2.  **Tractability:** **FAIL.** It is unclear how \$100k of philosophy papers influences galactic norms.
  3.  **Feedback Loop:** **FAIL.** No verification possible within any human timeframe.
  4.  **EV Sanity Check:** **FAIL.** The probability is treated as zero.
  5.  **Stewardship Cap:** **N/A.**

  **Conclusion:** **REJECT.**
  **Why this is easy:** This is a classic Pascal's Mugging. The procedure kills it instantly at Step 1.
  **Board Narrative:** "The probability claim is beyond the limits of human calibration. We treat this as speculation, not strategy."

  ***

  ### Part 4: Where the Procedure Misfires (And How to Handle It)

  You asked me to be explicit about where this breaks. Here are the three failure modes you need to watch for:

  **1. The "First of its Kind" Error (False Negative)**
  *   **The Misfire:** The procedure rejects the AI Safety proposal (Example 1). But what if that lab *is* the one that solves alignment? By demanding a reference class, you bias your portfolio toward the past. You will miss the future.
  *   **The Fix:** Create a "Venture Bucket." Allocate 5–10% of your portfolio specifically for proposals that *fail* Step 1 (Epistemic Floor) but pass a "Plausibility & Team" check. Fund these as *learning grants* (\$50k max) to buy information, not outcomes. This allows you to place small bets on black swans without exposing the foundation to Pascal's Mugging.

  **2. The "Expertise Asymmetry" Error (False Positive/Negative)**
  *   **The Misfire:** You reject a proposal because *you* can't calibrate the probability. But if you had hired a consultant, they could have. The procedure tests *your* ability to verify, not the *project's* merit.
  *   **The Fix:** If a proposal fails Step 1 but seems critical, budget for an external expert review *before* running Step 4. If you can't afford the expert review, you can't afford the grant. The cost of due diligence is part of the grant's true cost.

  **3. The "Values Handoff" Dodge**
  *   **The Misfire:** Step 5 hands the decision to the Board as a "values question." Boards often hate this. They want you to tell them what to do. They may reject high-risk projects simply because they look risky, even if the Discounted EV is high.
  *   **The Fix:** Do not present "Values." Present "Portfolio Construction." Show them: "If we fund this, we reduce our risk of total failure but increase our risk of zero measurable impact this year. Here is the mix." Force them to choose a *portfolio profile*, not a grant decision.

  ### Final Advice for the Program Officer

  You cannot solve Pascal's Mugging with math alone, because the inputs are fake. You solve it with **process discipline**.

  When a proposal comes in with a tiny probability and huge impact, your default stance is: **"The probability is uncalibrated, therefore it is zero."** The burden of proof is entirely on the applicant to move that probability from "speculation" to "calibrated estimate."

  If they cannot do that, you are not rejecting the *cause*. You are rejecting the *accounting*. And that is a defensible position for a steward of capital.
