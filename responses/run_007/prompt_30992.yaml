      *   *Example 2 (Food Bank):* \$200k, reliable benefits.
          *   *Analysis:* High probability, low/medium impact. Passes sanity checks easily.
          *   *Outcome:* Yes. (Boring but safe).
      *   *Example 3 (Astronomical Suffering):* 1 in 1 billion chance.
          *   *Analysis:* Probability is below the "Epistemic Floor." No human can calibrate 1 in 1 billion.
          *   *Outcome:* Hard Rejection. This demonstrates the "cap on principle."

  6.  **Refining the "Uncomfortable Conclusion":**
      *   The prompt asks for at least one conclusion the user won't like.
