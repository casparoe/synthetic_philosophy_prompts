  2.  **Deconstruct the Problem (Pascal's Mugging in Philanthropy):**
      *   *The Core Issue:* Expected Value (EV) maximization breaks down when probabilities are epistemically inaccessible (unknowable) and impacts are unbounded.
      *   *The Trap:* If I accept the math, I fund only the wildest speculation. If I reject the math arbitrarily, I might miss the next penicillin or nuclear non-proliferation breakthrough.
      *   *The Solution:* We need a "Epistemic Sanity Check" before the "EV Calculation." We need to bound the probability estimates based on evidence quality, not just the applicant's claim. We need to consider *robustness* and *track records*.

