      *   *Counterfactuals:* Would this happen anyway? (Additionality).
      *   *Tractability:* Does money actually move the needle?
      *   *Verification:* Can we ever know if we were right? (Feedback loops).
      *   *Opportunity Cost:* Funding this means *not* funding something with proven impact.
      *   *Reputational Risk:* Board won't sign off on "0.000001% chance of saving the universe."
      *   *The "Shut Up and Multiply" vs. "Prudence" tension:* Decision theory says maximize EV. Practical philanthropy says ensure stewardship.
      *   *Breaking Point:* When the probability is so small it's indistinguishable from zero given human cognitive limits, but the impact is infinite. The procedure must cap the probability based on *evidence strength*, not *claim magnitude*.

