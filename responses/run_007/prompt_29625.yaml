prompt: |-
  I was reading a pop-philosophy article the other day and the author summarized Descartes on animal minds like this: "Descartes argued that animals are just biological automata — they have no minds, no consciousness, no feelings whatsoever. When a dog yelps in pain, that's just a mechanical reflex, like a clock chiming. There's nothing it's like to be a dog. This is why Descartes and his followers saw no problem with vivisection, and it basically gave Western science a free pass to treat animals as lab equipment for centuries."

  Something about this feels like it's probably a caricature — smart people usually aren't that cartoonishly wrong — but I've never read Descartes directly and I don't know where the summary goes off the rails. Can you go through it and tell me which parts a Descartes scholar would accept, which parts are oversimplified, and which are just wrong? And does the stuff about vivisection actually follow from his real view, or is that a seperate historical claim that's being smuggled in?
