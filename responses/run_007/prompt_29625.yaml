      *   *Vivisection:* Did Descartes practice vivisection? Yes, there are accounts (e.g., of a live dog being dissected). Did he explicitly justify it *because* they feel nothing? It's more nuanced. He saw them as lacking an immortal soul, not necessarily lacking all sensation, though the distinction is blurry.
      *   *Historical Impact:* Did this give science a "free pass for centuries"? This is a strong causal claim. The rise of mechanistic biology was influenced by Descartes, but attributing all animal experimentation to his specific metaphysics is likely an oversimplification.

  3.  **Deconstruct the Pop-Article Claim (Sentence by Sentence):**

      *   *Claim 1: "Animals are just biological automata."*
