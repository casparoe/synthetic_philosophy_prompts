  ok so i've been reading about situationism in psychology and the critique of virtue ethics, and honestly i dont get why anyone still does virtue ethics. like, the Milgram experiments and the Darley and Batson Good Samaritan study pretty much show that people don't have stable character traits — whether someone helps a stranger or shocks someone to death is basically determined by whether they're in a hurry or whether an authority figure is in the room. so virtues aren't real, they're just post-hoc stories we tell about behavior that's actually driven by the situation. what am i missing? is virtue ethics just dead as a research program or do people have some way of salvaging it that isnt just moving the goalposts?
