answer: |-
  You have hit on one of the most significant debates in contemporary moral philosophy. What you are describing is known as the **Situationist Challenge**, championed famously by philosophers Gilbert Harman and John Doris in the late 1990s and early 2000s.

  They argued exactly what you are arguing: if social psychology shows that behavior is driven by situational variables (like finding a dime or being in a hurry) rather than stable character traits, then the Aristotelian notion of "virtue" (as a robust, cross-situational character trait) is empirically false.

  However, virtue ethics is not dead. In fact, it has undergone a massive revival and restructuring *because* of this critique. If you talk to modern virtue ethicists, they generally don't deny the psychology; they deny the conclusion that it kills their ethical framework.

  Here is what you might be missing, broken down into the five main counter-arguments used to salvage virtue ethics.

  ### 1. The Normative vs. Descriptive Distinction
  This is the biggest philosophical pushback. Psychology is a **descriptive** discipline (it tells us how people *do* behave). Virtue ethics is a **normative** discipline (it tells us how people *ought* to behave and what constitutes flourishing).

  *   **The Analogy:** Imagine a health scientist says, "Most people eat poorly, don't exercise, and have high cholesterol. Therefore, 'physical health' is a fiction and medicine is a dead program."
  *   **The Response:** The fact that most people *fail* to be healthy doesn't mean health isn't real or valuable. Similarly, the fact that most people fail to act virtuously in Milgram-style scenarios doesn't mean virtue is a fiction; it just means most people aren't virtuous. Virtue ethics is a project of cultivation, not a description of the status quo.

  ### 2. The "Ideal Agent" Defense
  Aristotle and other virtue ethicists were never under the illusion that the average person is virtuous. In fact, Aristotle argued that the *phronimos* (the person of practical wisdom) is rare.

  *   **The Critique:** Situationism tests ordinary college students or random citizens.
  *   **The Defense:** Virtue ethicists argue these experiments show that *ordinary, untrained people* lack robust virtues. They do not show that a *fully developed virtuous agent* would succumb to the same pressures.
  *   **Evidence:** In variations of the Milgram experiment, some people *did* refuse to shock the learner. In the Good Samaritan study, some people *did* stop to help despite being in a hurry. Virtue ethicists argue these are the people exhibiting character. The theory is built around emulating *them*, not the average subject.

  ### 3. Globalism vs. Localism (Refining the Trait)
  The situationist critique attacks **Global Traits** (e.g., "Honesty" that applies in every situation from tax returns to war to relationships). Many virtue ethicists have conceded that Global Traits probably don't exist.

  However, they have pivoted to **Local Traits**.
  *   Instead of "Honesty," a person might have "Honesty-with-friends" or "Honesty-when-not-under-authority-pressure."
  *   **Is this moving the goalposts?** Critics say yes. Defenders say no; they argue this is just being more precise. If I am honest with my spouse but cheat on my taxes, it is more accurate to say I have the local trait of "spousal-honesty" than to say I possess the global virtue of "Honesty."
  *   **Why it saves the theory:** You can still build an ethical framework around cultivating local traits and expanding their scope, even if you abandon the idea of a monolithic "Character."

  ### 4. Interactionism (Person × Situation)
  Modern psychology has largely moved past the "Situation vs. Disposition" war into **Interactionism**. Behavior is a function of the Person *and* the Situation interacting.

  *   Situations matter, but people interpret situations differently based on their dispositions.
  *   In the Milgram experiment, not everyone obeyed. Why? Because their internal disposition interacted with the situation differently.
  *   Virtue ethicists argue that having a virtue changes how you *perceive* the situation. A virtuous person doesn't just "resist" the authority figure; they literally see the situation differently (e.g., "This is not a legitimate scientific request; this is harm"). The situation didn't change, but the agent's perception of it did.

  ### 5. Virtue as a Skill, Not a State
  Many contemporary virtue ethicists (like Julia Annas) argue that we should think of virtue less like a "trait" (something you have) and more like a **skill** (something you do).

  *   Think of playing the piano. If you put an average person in front of a piano and ask them to play a concerto while people are yelling at them, they will fail. Does that mean "piano skill" is a fiction? No. It means they haven't practiced enough.
  *   Virtue is a craft. The situationist studies show that we are all "novices" in morality. The fact that novices crumble under pressure doesn't disprove the existence of masters.

  ### So, is it just goalpost moving?
  It depends on who you ask.
  *   **Hardline Situationists (like Doris):** Yes, they argue that redefining virtues as "local" or "skills" waters down the theory until it loses its explanatory power. If "courage" only applies when you aren't scared, is it courage?
  *   **Naturalized Virtue Ethicists:** They argue that philosophy *should* update its concepts based on empirical data. If psychology tells us global traits are rare, ethics should focus on how to build local traits and design situations that support virtue (e.g., changing the environment rather than just blaming the person).

  ### The Verdict
  Virtue ethics is not dead, but it is **humbled**.

  Before the 1990s, some virtue ethicists might have claimed that if you are truly virtuous, you will do the right thing regardless of the situation. After Harman and Doris, almost no serious virtue ethicist claims that anymore.

  The program has been salvaged by:
  1.  Admitting most people lack robust virtue.
  2.  Focusing on moral education and habituation (making the traits more robust).
  3.  Acknowledging that situational design is part of ethics (if we know being in a hurry makes people unhelpful, a virtuous society structures time to allow for helping).

  You aren't wrong about the psychology, but you might be expecting ethics to do something it never promised to do: describe the average human being rather than prescribe the ideal one.
