answer: |-
  The Bell was properly heaving, the sort of Tuesday evening rush where the condensation on the windows blurs the London traffic into streaks of red and white. Julian found a spot near the back, two pints of ale already waiting on the table. Sarah slid into the booth opposite him, shaking off a brolly.

  "Cheers," she said, taking the pint. "You sounded proper troubled on the phone. Something about the machines taking over?"

  "Not taking over," Julian said, tapping his glass against hers. "Just… existing. I've been wrestling with these large language models at work. Writing boilerplate, debugging race conditions. They're brilliant, but there's a uncanny valley to it. It got me thinking about that old Ryle chestnut. Knowing-how versus knowing-that."

  Sarah grinned. "Gilbert Ryle. The ghost in the machine man. Let me guess: you think the AI knows *that* the syntax is correct, but it doesn't know *how* to code?"

  "Precisely. It feels like there's a dimension of competence missing. But then I read Stanley and Williamson, and they argue that knowing-how is just a species of knowing-that. If they're right, maybe the gap isn't as wide as I think. Maybe the model *does* know how, it just lacks the flesh."

  "Right," Sarah said, taking a long pull of her drink. "So you want to hash out Intellectualism versus Anti-Intellectualism. Careful, Julian. If you start quoting Stanley at me, I might throw my crisps at you. Ryle was onto something crucial about the category mistake."

  "Was he, though?" Julian leaned forward. "Look, the Intellectualist position isn't as daft as the caricature. We're not saying knowing how to ride a bike is the same as reciting a physics textbook on balance. It's about propositional knowledge under a *practical mode of presentation*. I know *that* this is a way to ride the bike, but I grasp that proposition practically, not theoretically."

  "That's the move, isn't it?" Sarah said. "The 'practical mode of presentation'. But isn't that just a label you stick on the problem to pretend you've solved it? Ryle's regress argument is the killer here. If knowing how to $\phi$ is just knowing a proposition $p$ about $\phi$-ing, then to actually $\phi$, I have to contemplate $p$. But contemplating $p$ is itself an action. So I need to know *how* to contemplate $p$. Which requires another proposition $p'$. And so on, ad infinitum. You never actually get to the riding of the bike."

  Julian nodded slowly. "The regress. It's the classic objection. But Stanley would say you're assuming that applying the knowledge requires a *third* thing—a separate act of interpretation. If the mode of presentation is intrinsic to the knowledge itself, you don't need a rule for applying the rule. The practical mode *is* the application. It's not that I think 'I should pedal now'; it's that my grasp of the proposition is tied directly to the motor output."

  "But is it knowledge then?" Sarah countered. "Or is it a disposition? If I knock you out cold, you still know how to ride a bike. You possess the capacity. But you aren't currently entertaining any propositions. If knowledge-that is a relation to a true proposition, where is the proposition when you're unconscious? It seems you're conflating the *state* of knowledge with the *ability* to perform."

  "Fair point," Julian conceded. "But Intellectualism can accommodate that. We can say you possess the knowledge dispositionally. Think about a mathematician sleeping. She knows that $E=mc^2$ even when she's not thinking about it. Why can't knowledge-how be a dispositional relation to a proposition?"

  "Because the success conditions are different," Sarah pressed. "If I know that Paris is in France, I'm in a successful epistemic state regardless of whether I can get on a plane. If I know how to swim, but I'm paralysed, do I really know how to swim? Most people would say no. Knowing-how seems to entail a degree of ability. Knowing-that doesn't."

  Julian paused, swirling his ale. "Okay, let's look at the linguistics. Stanley's big push was on ascriptions. If I say, 'John knows how to fix the engine,' it seems to entail that there is some way $w$ such that John knows *that* $w$ is a way to fix the engine. The linguistic structure looks propositional. 'How' functions as an interrogative clause, similar to 'where' or 'when'. If I know where the pub is, I know a proposition. Why is 'how' different?"

  "Because language is messy," Sarah said. "We speak in ways that track social utility, not metaphysical joints. Just because the grammar looks propositional doesn't mean the underlying mental state is. Ryle argued that 'knowing how' is more like 'being careful' or 'being diligent'. It's an adverbial quality of action, not a relation to an object. When we say the AI 'knows how to code', we're speaking loosely. We mean it produces code-like output. But if the network goes down and it has to improvise with a patch cable and a paperclip, it fails. It lacks the *flexibility* of genuine understanding."

  "Improvisation is just accessing a wider set of propositions," Julian argued. "But let's grant your point about ability for a moment. Consider the converse case. The brilliant theorist. A cycling coach who understands the biomechanics perfectly, can recite every rule of balance, but has never ridden a bike and falls off immediately. Does she know how to ride?"

  "Intuitively, no," Sarah said.

  "But on Intellectualism," Julian said, "she might. If she possesses the true proposition under the right mode, she has the knowledge. She just lacks the physical capacity to execute it. This suggests knowing-how and ability *can* come apart. If they can come apart, they aren't identical. So Ryle's identification of knowing-how with ability is too strong, but my identification of it with knowledge-that might be viable."

  Sarah tapped her fingers on the table. "I'll give you that. The coach case is tricky. But she doesn't have the *practical* mode of presentation, does she? She has a theoretical one. She knows *that* leaning is required, but she doesn't grasp 'leaning' in the first-person, embodied way. So, if Stanley is right that the mode is what matters, the coach actually *fails* the test. She doesn't know-how, because she lacks the practical mode."

  "Exactly!" Julian smiled. "So the theory holds. The mode does the work."

  "Does it?" Sarah narrowed her eyes. "Or have you just defined 'practical mode of presentation' as 'whatever it is that stops the coach from being counted as knowing-how'? It feels circular. You're saying: Knowing-how is knowing-that under a practical mode. What's a practical mode? It's the thing that turns knowing-that into knowing-how. It risks being an occam's razor violation. Why not just say there are two different things? One is propositional knowledge, one is skill."

  "Because," Julian said, "it unifies the mind. It explains how we reason about our actions. If I'm debugging code, I'm not just reacting like a thermostat. I'm considering options. 'If I change this variable, the race condition resolves.' That's propositional. If knowing-how were entirely non-propositional, entirely muscle memory, how do we explain the planning phase? The deliberation?"

  "Deliberation doesn't require the *goal* to be propositional," Sarah countered. "I can deliberate on how to move my hand to catch a ball without forming a sentence in my head. It's spatial, kinaesthetic. Look, bring it back to your AI. You said it feels like something's missing. If Intellectualism is true, and the AI has ingested all of Stack Overflow, it has the propositions. It has the 'that'. Why does it still feel like it doesn't have the 'how'?"

  Julian sighed, leaning back. "Because it doesn't care. It has no stake in the code running. But that's motivation, not knowledge."

  "Is it?" Sarah asked. "Ryle would say that intelligent action is defined by the readiness to correct mistakes, to adapt to novelty. The AI predicts the next token based on statistical likelihood. It doesn't *monitor* its performance in the world. If the compiler throws an error it hasn't seen before, it hallucinates. It doesn't have the *normative* grip on the skill. It doesn't know what it means to get it *right*, only what it means to look like it got it right."

  "So you're saying the 'practical mode' requires an embodied agent embedded in a environment?"

  "I'm saying the 'practical mode' Stanley talks about is a cognitive shim. It tries to keep everything inside the head, inside the proposition. But knowing-how is partly outside the head. It's in the relationship between the agent and the task. Your AI is a brain in a vat. It can't have knowledge-how because it can't *do* anything. It can only output text."

  Julian considered this. "But if I email the code to a server and it compiles, the AI *did* do something. Causally, it acted."

  "Through you," Sarah said. "You're the agent. It's a tool. Like a hammer doesn't know how to drive a nail. This is where the linguistic evidence really bites against Stanley. We say 'I know how to use a hammer', but we don't say 'The hammer knows how to drive a nail'. The ascription of know-how is reserved for agents with capacities for learning and adaptation. The AI mimics the output of knowledge, but it lacks the capacity to learn from the *failure* in a meaningful way. It updates weights, sure, but it doesn't *learn* the skill."

  Julian took a long drink. "You're pushing me towards a hybrid view. Maybe Intellectualism is right about the *structure* of deliberation—when I'm thinking about code, I'm dealing in propositions. But Anti-Intellectualism is right about the *foundation* of the skill—the ability to execute without deliberation, and the normative connection to success."

  "That sounds less like a conflict and more like a division of labour," Sarah said, softening. "Ryle was worried about the 'intellectualist legend'—that every intelligent act must be preceded by a silent theoretical operation. He was right that you'd get a regress if that were true. But Stanley is right that we use propositional attitudes to explain and teach those skills. Perhaps knowing-how is a complex state. It involves propositional knowledge, yes, but it's anchored in a disposition to act."

  "So the AI..." Julian started.

  "The AI has the propositions," Sarah said. "It has the 'that'. It lacks the disposition. It lacks the 'how'. Not because the 'how' is magic, but because the 'how' is the bridge between the proposition and the world. The AI is stuck on one side of the bridge."

  Julian laughed softly. "So Ryle wins?"

  "Ryle wins on the metaphysics of mind," Sarah said, raising her glass. "But Stanley wins on the semantics. We talk about knowledge as if it's propositional because language is our tool for sharing the 'that'. But the 'how'... that's something you have to build in the workshop. Or in the pub, I suppose."

  "Cheers to that," Julian said, clinking his glass against hers. "Though I still reckon the model could write a better script for this conversation than we could."

  "Maybe," Sarah smiled. "But it couldn't buy the first round. And that, my friend, is a piece of knowing-how no algorithm has mastered."
