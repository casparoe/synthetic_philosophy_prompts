      *   *The Paradox:* Same object, different ontological status, different value. Why?
      *   *Theories:*
          *   *Formalism/Aesthetic Autonomy:* Value is in the looking. (Struggles here).
          *   *Causal-History/Provenance:* Value is in the origin. (Fits well).
          *   *Achievement/Performance:* Value is in the difficulty/skill of the specific act. (Fits well).
