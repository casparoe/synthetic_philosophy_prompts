          1.  Does the radical shift in aesthetic reception (without physical change) undermine the rationality of valuing originals, or does a good theory predict this?
          2.  How do theories handle the *post-reveal* status (valuable as famous forgeries)?
      *   **Tone:** Analytical, philosophical, nuanced.

  2.  **Initial Brainstorming & Case Recap:**
