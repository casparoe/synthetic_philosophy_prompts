      *   *Question 1 (Aesthetic Shift):* If the paint didn't change, why did the beauty disappear? Is this irrational snobbery or a legitimate change in perception?
      *   *Question 2 (Post-Reveal Value):* It's now valuable *as a fake*. Does this break the "originals matter" theory? Or does it just shift the "original" status to van Meegeren?

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Briefly set the stage. Van Meegeren is the perfect test case for ontology of art.

      *   **Theory 1: The Causal-History View (Goodman/Wollheim):**
          *   *Core Idea:* Art is defined by its history of production. A forgery lacks the correct causal link to the artist. Nelson Goodman's "autographic" vs. "allographic."
          *   *Application to Emmaus:* As a "Vermeer," it fails the causal test. It's not a Vermeer because Vermeer didn't make it.
          *   *Q1 (Aesthetic Shift):* Goodman would say the aesthetic experience *is* tied to knowing the history. Once you know it's a fake, you look differently. It's rational.
          *   *Q2 (Post-Reveal):* It becomes an *original van Meegeren*. The causal history is now valid (Van Meegeren made a Van Meegeren). So it gains value, but as a different work.
          *   *Critique:* Doesn't fully explain the *emotional* betrayal felt by critics.

      *   **Theory 2: The Achievement/Performance View (Dutton/Kivy):**
          *   *Core Idea:* We value the human accomplishment. The difficulty of solving the artistic problem *at that time*.
          *   *Application to Emmaus:* Vermeer solved 17th-century problems. Van Meegeren solved 20th-century problems (how to trick experts).
          *   *Q1 (Aesthetic Shift):* When thought to be Vermeer, we admired the 17th-century achievement. When revealed as Van Meegeren, that specific achievement vanishes. We are admiring a different feat (deception).
          *   *Q2 (Post-Reveal):* It has value as an achievement of forgery. It's a "successful fake."
          *   *Critique:* Explains why the *type* of value changes.

      *   **Theory 3: Essentialism / "Magic" / Contact Theory:**
          *   *Core Idea:* There is a metaphysical residue of the artist in the object. Contagion.
          *   *Application to Emmaus:* The "Vermeer essence" was projected onto it. When revealed, the essence evaporated.
          *   *Q1 (Aesthetic Shift):* This view suggests the change is irrational/psychological. The object didn't change, so the value *shouldn't* change if we were purely rational. But we aren't.
          *   *Q2 (Post-Reveal):* It now holds the "essence" of Van Meegeren (the rogue, the trickster).
          *   *Critique:* Hardest to defend philosophically, but best explains the visceral reaction.

      *   **Synthesizing Question 1: The Rationality of the Aesthetic Shift:**
          *   Does the lack of physical change prove valuing originals is irrational?
          *   *Argument:* No. Perception is cognitive. Knowing the history changes the *perception*. (Theory-laden observation).
          *   *Van Meegeren specific:* Critics saw "Vermeer" because they wanted to see it. Once the frame changed, the visual experience changed. This supports the Causal/Achievement views over pure Formalism.

      *   **Synthesizing Question 2: The Value of the Famous Forgery:**
          *   Does this break the theories?
