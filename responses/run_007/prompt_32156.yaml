answer: |-
  The Han van Meegeren case is the "trolley problem" of art philosophy. It forces theories of aesthetic value to crash into the hard reality of ontology. If a painting looks exactly like a Vermeer, acts like a Vermeer in a gallery, and moves critics like a Vermeer, but was painted by a 20th-century conman, what is it? And why does the answer change how much we are willing to pay for it or how deeply we feel moved by it?

  Here is an analysis of the *Christ at Emmaus* case through three dominant philosophical frameworks, followed by an address of your two specific questions regarding aesthetic rationality and the value of the famous forgery.

  ---

  ### 1. The Causal-History View (Nelson Goodman / Arthur Danto)
  **The Theory:** This view, most famously articulated by Nelson Goodman in *Languages of Art*, argues that art is "autographic." The history of production is constitutive of the work. A work of art is not just a visual pattern; it is an event that happened. For a painting to be a Vermeer, it must stand in the correct causal chain originating from Vermeer's hand.

  **Application to *Emmaus*:**
  *   **As a Vermeer:** The painting failed the ontological test. No matter how perfect the visual match, it lacked the correct causal history. It was not a *representation* of Vermeer's vision, but a *replication* of his style.
  *   **The Shift:** When the history was revealed, the object didn't change, but its classification did. It moved from the category "Masterpiece of the Dutch Golden Age" to "20th Century Pastiche."

  **Where it struggles:**
  Goodman argues that knowing the history changes the aesthetic experience itself (we look "sharper" or differently). However, this theory struggles to explain the *visceral* sense of betrayal critics felt. If art is just a causal label, why did the painting seem to literally lose its beauty? The causal view is logically sound but emotionally cold.

  ### 2. The Achievement View (Denis Dutton / Peter Kivy)
  **The Theory:** We value art not just for the final object, but for the human performance that created it. We admire the solving of artistic problems within a specific historical context. The value lies in the difficulty of the achievement.

  **Application to *Emmaus*:**
  *   **As a Vermeer:** Critics believed they were witnessing a 17th-century mind solving 17th-century problems (light, composition, theology) using 17th-century technology. That is a rare and valuable achievement.
  *   **As a Van Meegeren:** Once revealed, the achievement shifted. Van Meegeren did not solve the problem of "how to paint Christ in 1650." He solved the problem of "how to trick Bredius in 1930."
  *   **The Shift:** The aesthetic value plummeted because the *type* of achievement admired was gone. We value the genius of the Golden Age more than the cunning of a forger.

  **Where it struggles:**
  This view implies that if Van Meegeren had been *better* at mimicking the 17th-century mindset (perhaps if he truly believed he was a reincarnated Vermeer), the work might hold more value. It also struggles to explain why a "failed" original (a sketch by Vermeer) is often valued higher than a "perfect" forgery. The Achievement view prioritizes the *success* of the mimicry, whereas the art market prioritizes the *identity* of the achiever.

  ### 3. Essentialism / Contact Theory (The "Magic" View)
  **The Theory:** This is the least defensible philosophically but perhaps the most accurate psychologically. It suggests that originals possess a metaphysical residue of the artist—a form of "contagion" or essence. We value the object because it was touched by the genius.

  **Application to *Emmaus*:**
  *   **As a Vermeer:** The painting was imbued with the "spirit" of Vermeer. It was a relic.
  *   **As a Van Meegeren:** The spirit evaporated. The canvas became "dead" matter because the connection to the genius was severed.
  *   **The Shift:** The radical change in reception is explained by a change in perceived metaphysical status.

  **Where it struggles:**
  It is irrational. It relies on a magical thinking that philosophy generally tries to debunk. If two paintings are molecule-for-molecule identical, positing a metaphysical difference is ontologically extravagant. However, it is the only theory that fully accounts for the disgust critics felt upon learning the truth.

  ---

  ### Addressing Your Specific Questions

  #### (1) The Radical Aesthetic Shift: Irrational Snobbery or Rational Perception?
  *The Fact:* The paint and canvas did not change, yet critics who once wept before *Emmaus* later found it stiff and lifeless.
  *The Question:* Does this prove that caring about originals is irrational?

  **Analysis:**
  This fact does **not** count against the rational defensibility of valuing originals; in fact, a robust theory (specifically the Causal-History and Achievement views) predicts this shift.

  *   **Theory-Laden Perception:** We do not see with our eyes alone; we see with our concepts. When critics looked at *Emmaus* thinking it was a Vermeer, they were seeing it through the lens of Vermeer's biography, his struggle with light, and his historical isolation. They were projecting a narrative of "rediscovered genius" onto the canvas.
  *   **The Rational Shift:** Once the narrative collapsed, the visual data was re-processed. The "stiffness" was always there, but it was previously interpreted as "archaic solemnity." Once known as a fake, that same stiffness was re-interpreted as "academic rigidity."
  *   **Conclusion:** The change in aesthetic reception is rational because the *object of perception* is not just the physical pigment, but the pigment *plus* its context. If you watch a magic trick knowing the secret, the visual experience is fundamentally different, even if the photons hitting your retina are identical. Therefore, the radical shift supports the idea that art is an interaction between object and history, not just object and eye.

  #### (2) The Post-Reveal Status: The Value of the Famous Forgery
  *The Fact:* *Christ at Emmaus* is now valuable again, displayed in museums (like the Museum Boijmans Van Beuningen), and sold for high sums.
  *The Question:* Does this mess up the theory that exposure makes a forgery worthless?

  **Analysis:**
  This does not break the theories, but it requires them to be nuanced regarding *what* is being valued. The painting is no longer valuable as a "Vermeer," nor is it valuable purely as a "Van Meegeren" (in the same way a genuine Van Meegeren landscape is). It is valuable as a **historical artifact of deception.**

  *   **Causal-History Adjustment:** The painting has acquired a *new* causal history. It is now an "Original Van Meegeren Forgery." It is the *ur-forgery*. Its provenance is now unique: it is the painting that fooled the Nazis and humiliated the art world. The causal chain is now valid and unique, granting it authenticity as a historical document.
  *   **Achievement Adjustment:** The achievement has been re-categorized. We are no longer admiring the achievement of "Dutch Master," but the achievement of "Master Criminal." It is a testament to human cunning.
  *   **The "Worthless" Myth:** The idea that exposure makes a forgery worthless is only true if the forgery was valued *solely* for its deceptive attribution. Once the deception is known, the object cannot function as a Vermeer, but it can function as a Van Meegeren.
  *   **The Problem for Essentialism:** This is where the "Magic" view struggles most. If the "Vermeer essence" left the building, why is the object still sacred enough to be behind bulletproof glass?
      *   *Resolution:* The "essence" has been replaced. It is no longer a relic of Vermeer; it is a relic of the *scandal*. It holds the "essence" of the greatest art crime of the 20th century.

  ### Conclusion
  The Van Meegeren case suggests that the "value" of an original is not a single thing, but a bundle of properties: aesthetic, historical, and ontological.

  1.  **On Rationality:** The fact that the aesthetic experience changed without physical change validates the **Causal-History** and **Achievement** views. It proves that aesthetic experience is cognitive, not just retinal. We value the *action* of the artist as much as the *result*.
  2.  **On Post-Reveal Value:** The resurgence of value for *Emmaus* does not invalidate the preference for originals; it simply shifts the ontological category. We still demand an "original"—we just changed our mind about *who* the original creator is. We value it as an **Original Forgery**.

  Van Meegeren inadvertently proved that art is not just about what is on the canvas, but the story we tell about how it got there. When the story changed from "Miraculous Rediscovery" to "Audacious Lie," the art changed with it. When the story changed again to "Legendary Con," the art gained a new kind of power. The paint never moved, but the meaning did everything.
