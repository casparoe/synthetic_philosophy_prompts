answer: |-
  ### Exam Question

  **Question 4:**
  Critics argue that Prioritarianism does not so much *refute* the Leveling-Down Objection as *evade* it by abandoning the core egalitarian commitment to relational equality. On this view, Prioritarianism succeeds only by "changing the subject"—replacing a concern with the gap between persons with a concern for the absolute position of the worse-off, thereby building the prohibition on leveling down into the value function from the start.

  Evaluate this claim. Does Prioritarianism offer a superior account of distributive justice by correcting the fetishistic nature of telic egalitarianism, or does it succeed in avoiding the Leveling-Down Objection merely by ceasing to be a theory of equality at all? In your answer, consider whether the loss of relational equality is a theoretical cost or a philosophical gain.

  ***

  ### Model Answer

  The Leveling-Down Objection (LDO) poses a fatal threat to Telic Egalitarianism. If equality is intrinsically valuable, then a world where everyone is equally miserable should be, in at least one respect, better than a world where some are well-off and others are miserable, even if no one benefits from the equality. Since most find this conclusion absurd—that leveling down is good in any way—Telic Egalitarianism appears refuted. Prioritarianism is often presented as the solution. However, the charge that Prioritarianism merely "changes the subject" requires us to ask not just if it avoids the LDO, but whether it retains the moral insights that motivated egalitarianism in the first place.

  To evaluate this, we must first recognize that the charge of "changing the subject" is technically correct but philosophically ambiguous. Prioritarianism does abandon the view that the *relationship* between individuals holds intrinsic value. Instead, it assigns greater weight to benefits conferred on the worse-off based on their absolute position. Consequently, leveling down benefits no one; since prioritarian value is a function of weighted well-being, a change that helps no one cannot increase value. Thus, Prioritarianism avoids the LDO by definition. If "equality" is defined relationally, Prioritarianism is not an egalitarian theory.

  However, characterizing this as an "evasion" assumes that relational equality is something we ought to preserve. This is the crux of the debate. Parfit argues that Telic Egalitarianism is fetishistic: it values a pattern (equality) over the human content of that pattern (well-being). If we care about the worse-off, we should care about their absolute suffering, not merely their relative deprivation. From this perspective, "changing the subject" is not a retreat but a correction. The LDO reveals that our intuitive commitment to equality was never truly about the gap; it was always a proxy for concern for the worse-off. Prioritarianism makes this explicit. By shifting the locus of value from the relation to the individual's absolute standing, Prioritarianism captures the moral impulse behind egalitarianism without the counterintuitive implication that destroying the good of the better-off is intrinsically valuable when it helps no one.

  Yet, defenders of relational equality might argue that Prioritarianism loses something vital: the moral significance of unfairness. Even if leveling down is not intrinsically good, significant inequalities can create social hierarchies, stigma, and oppression that harm the worse-off instrumentally. A strict Prioritarian might overlook these structural harms if they focus solely on aggregate weighted well-being. For example, if a small gain for the very worst-off justifies massive wealth for the top 1% (provided the weighted sum increases), Prioritarianism might permit levels of inequality that undermine democratic equality or social solidarity. Here, the "loss" of relational equality is a theoretical cost. Prioritarianism avoids the LDO, but it may fail to account for why we object to inequality in non-ideal conditions—specifically, because inequality itself can be a tool of domination.

  Nevertheless, the Prioritarian can respond that these are instrumental concerns. We oppose status hierarchies because they lower well-being, not because the pattern is unequal. If Prioritarianism weights the well-being of the worst-off sufficiently heavily, it will likely converge with egalitarian outcomes in most practical scenarios without committing to the intrinsic value of equality.

  Ultimately, the claim that Prioritarianism "evades" the LDO depends on whether one believes the LDO identifies a bug or a feature of egalitarianism. If the LDO exposes a flaw in the concept of intrinsic equality, then Prioritarianism solves the problem by offering a more coherent axiology. It does not merely avoid the objection; it dissolves the premise that generates the objection. While it ceases to be a theory of *relational* equality, it arguably remains a theory of *distributive justice* that better aligns with our considered judgments about who matters and why. The "subject" was never the gap; it was the people. Prioritarianism succeeds not by dodging the bullet, but by realizing we were standing in the wrong place.

  ***

  ### Marking Scheme (Total 25 Marks)

  **Criteria Breakdown:**
  1.  **Understanding of LDO & Telic Egalitarianism (5 marks):** Accuracy in explaining why leveling down is problematic for telic views.
  2.  **Understanding of Prioritarianism (5 marks):** Accuracy in explaining the priority weighting and absolute vs. relative focus.
  3.  **Engagement with the "Changing the Subject" Critique (10 marks):** Depth of analysis regarding whether this shift is a retreat or a correction.
  4.  **Argumentative Structure & Clarity (5 marks):** Coherence, thesis strength, and flow.

  #### Grade Descriptors

  **A Range (22–25 Marks): Excellent / Distinction**
  *   **Moves:** Explicitly tackles the meta-ethical implication of "changing the subject." Distinguishes clearly between the *intrinsic* value of equality (which Prioritarianism rejects) and the *instrumental* value of equality (which it can accommodate).
  *   **Insight:** Recognizes that the "evasion" charge relies on the assumption that relational equality has intrinsic value. Argues convincingly that Prioritarianism corrects a "fetishistic" error (Parfit) rather than merely dodging a bullet.
  *   **Nuance:** Acknowledges potential costs (e.g., social hierarchy, stigma) but evaluates them as instrumental concerns rather than intrinsic ones.
  *   **Constraint Check:** Does **not** rely on mere summary of Parfit's telic/deontic distinction; uses it only where relevant to the argument about value.
  *   **Typical Error:** None significant. May offer a counter-argument to Prioritarianism but handles it sophisticatedly.

  **B Range (17–21 Marks): Good / Upper Second**
  *   **Moves:** Correctly explains LDO and Prioritarianism. Acknowledges that Prioritarianism focuses on absolute levels rather than relations.
  *   **Insight:** Addresses the prompt but treats the "changing the subject" charge as a simple trade-off (e.g., "It loses equality but gains plausibility") rather than a conceptual correction.
  *   **Nuance:** May rely somewhat heavily on summarizing Parfit's views without fully evaluating the *philosophical cost* of abandoning relational equality. Might conflate instrumental and intrinsic value slightly.
  *   **Constraint Check:** May spend too much time defining Telic/Deontic egalitarianism before getting to the evaluation.
  *   **Typical Error:** Fails to fully articulate *why* changing the subject might be considered a "retreat" rather than just a different theory.

  **C Range (12–16 Marks): Satisfactory / Lower Second**
  *   **Moves:** Defines LDO and Prioritarianism correctly. States that Prioritarianism avoids the LDO.
  *   **Insight:** Struggles to engage with the "changing the subject" critique. Treats the prompt as "Explain Prioritarianism and why it avoids LDO."
  *   **Nuance:** Little to no discussion of relational vs. absolute value. May claim Prioritarianism *is* a form of egalitarianism without qualifying the shift in value theory.
  *   **Constraint Check:** May rely heavily on reciting the Prioritarian formula or Parfit's definitions without critical evaluation.
  *   **Typical Error:** Asserts that Prioritarianism "solves" the problem without addressing whether it abandoned the original goal of equality. Argument is descriptive rather than evaluative.

  **Fail Range (0–11 Marks)**
  *   Significant misunderstandings of LDO or Prioritarianism.
  *   Fails to address the specific prompt (e.g., writes only about Deontic Egalitarianism).
  *   Incoherent or plagiarized.
