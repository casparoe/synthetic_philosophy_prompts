          *   *Game Theory:* High discount factor $\delta$ makes future payoffs matter enough to sustain cooperation (Folk Theorems).
          *   *RL Translation:* High discount factor $\gamma$ in an infinite (or long) horizon MDP. If $\gamma$ is low, greedy reward (Defect) wins. If $\gamma$ is high, long-term return (Cooperate) wins.
          *   *Clean:* Shadow of the Future = Discount Factor $\gamma$. Iterated = Infinite/Long Horizon MDP.
          *   *Distortion:* GT assumes agents can *commit* to strategies or reason about equilibria. RL agents learn via gradients/sampling. Just having $\gamma > 0$ doesn't guarantee cooperation; the optimization landscape still needs to allow finding the cooperative basin.
