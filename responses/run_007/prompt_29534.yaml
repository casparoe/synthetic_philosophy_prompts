prompt: |-
  I'm a reinforcement learning engineer — my working vocabulary is policies, reward functions, discount factors, environments, self-play, population-based training. I keep running into the prisoner's dilemma and "the evolution of cooperation" as if they're supposed to be profound, but the writeups are always in game-theory or evolutionary-biology language I can only half-follow. Restate the central claims — that defection dominates in the one-shot game, that the "shadow of the future" changes things in the iterated game, that Tit-for-Tat did surprisingly well in Axelrod's tournaments, and that cooperation can evolve among self-interested agents — in my vocabulary. For each one, tell me what translates cleanly (is the shadow of the future just my discount factor? is Tit-for-Tat just a deterministic policy conditioned on the opponent's last action?), what you had to distort to make it fit, and what has no counterpart in my framework at all. Then give me the residue report: is the stuff that didn't survive the translation something my RL vocabulary is missing, or something the original claims were smuggling in? And if the honest answer is that "evolution of cooperation" doesn't map onto training dynamics because evolution selects for fitness rather than optimizing expected return, just say that instead of forcing the analogy.
