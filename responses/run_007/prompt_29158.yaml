prompt: |-
  Okay so I've been going down a rabbit hole on epistemic injustice lately — it started because my department had this whole DEI training thing where they threw around "testimonial injustice" like everyone already knew what it meant, and I got curious. Now I've read Fricker and a bunch of the responses and... I'm kind of lost in the weeds.

  Here's my problem. Every paper seems to just add another subtype. Fricker gives us testimonial and hermeneutical. Then Dotson adds contributory injustice. Then someone else has epistemic exploitation, willful hermeneutical ignorance, epistemic appropriation... and nobody seems to be asking the prior question: what is a theory of epistemic injustice even supposed to accomplish? What are the fixed points?

  So I want the desiderata. What does an adequate theory of epistemic injustice have to get right? I don't mean "summarize the phenomena." I mean: which cases are the non-negotiable ones that any theory has to handle or it's not even in the game? Which distinctions can't be collapsed — like, is there a real difference between testimonial injustice and plain old prejudice, or are we just rebranding? What results from social epistemology or philosophy of language does the theory have to be consistent with (and which can it revise if it has to)? Which requirements are things everyone should agree on and which are just preferences of one camp?

  For each desideratum, give me the case or consideration that earns it a spot on the list. And here's what I really want: are there pairs of desiderata that look like they can't be jointly satisfied? If covering both systematic and incidental cases makes the theory incoherent, say so. And which single requirement does the most work — like, which one knocks out the largest number of existing views?

  I'm not asking for citations or a reading list. I want the specification. I'm trying to figure out whether this subfield has a stable core or whether its just people bolting epicycles onto Fricker's original two categories. Be honest about that last part.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has been reading about epistemic injustice (Fricker, Dotson, etc.) after a DEI training. They feel lost in the proliferation of subtypes.
      *   **Core Question:** What are the *desiderata* for an adequate theory of epistemic injustice? What *must* a theory get right to be viable?
      *   **Specific Requirements:**
          *   Identify non-negotiable cases/considerations.
          *   Identify distinctions that cannot be collapsed (e.g., testimonial injustice vs. plain prejudice).
          *   Identify consistency requirements with social epistemology/philosophy of language.
          *   Distinguish between consensus requirements and camp-specific preferences.
          *   **Crucial:** Identify tensions/trade-offs between desiderata (can they be jointly satisfied?).
          *   **Crucial:** Identify the "most work" requirement (which one knocks out the most existing views?).
          *   **Crucial:** Be honest about whether the subfield has a stable core or is just adding "epicycles."
          *   **Constraint:** No citations or reading lists. Just the specification.

  2.  **Deconstruct "Epistemic Injustice":**
      *   What is the core intuition? It's a wrong done to someone *specifically in their capacity as a knower*.
      *   Fricker's original contribution: It's not just *any* harm involving knowledge; it's a distinctive *ethical* wrong tied to *epistemic* agency.
      *   The proliferation problem: If every bad epistemic interaction is an injustice, the concept loses bite. If only a few specific ones count, it might miss structural issues.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Desideratum 1: The Specificity Constraint.* It must distinguish epistemic injustice from generic injustice or generic epistemic failure. (The "Rebranding" worry).
      *   *Desideratum 2: The Harm Constraint.* It must account for the primary harm (to the knower) and secondary harms (practical, etc.).
      *   *Desideratum 3: The Structural/Individual Balance.* It must handle both one-off biases (Fricker's original focus) and systemic/structural exclusion (Dotson's critique).
      *   *Desideratum 4: The Agency Constraint.* It must respect the victim's epistemic agency (not treating them purely as passive recipients of harm).
      *   *Desideratum 5: The Normative Anchor.* It needs a clear account of *why* it's wrong (virtue ethics? human rights? capability approach?).

  4.  **Identifying Tensions/Trade-offs (The "Can't be Jointly Satisfied" part):**
      *   *Tension 1: Precision vs. Coverage.* If you define it too tightly (Fricker's virtue ethics focus), you miss structural stuff (Dotson). If you define it too broadly (any epistemic harm), it collapses into general injustice.
      *   *Tension 2: Subjective Experience vs. Objective Structure.* Does the victim need to feel the injustice? (Sometimes they don't know the concepts). But if they don't feel it, is it still an injustice *to them*?
      *   *Tension 3: Individual Culpability vs. Systemic Function.* Fricker focuses on the hearer's virtue/vice. Structural accounts focus on systems. You can't maximize both without tension.

  5.  **Identifying the "Knockout" Desideratum:**
      *   Which requirement kills the most views?
      *   Likely the *Specificity Constraint* (The "Distinctive Wrong" requirement). Many theories collapse into "prejudice is bad" or "ignorance is bad." The theory *must* show why the *epistemic* dimension is the locus of the injustice, not just a vehicle for other harms.

  6.  **Addressing the "Stable Core vs. Epicycles" Question:**
      *   Be honest. There is a core (wrong done to knower), but the field is fragmenting. The "epicycles" charge has merit regarding the proliferation of subtypes without unified theory.

  7.  **Refining the Output (Iterative Polishing):**
      *   *Tone:* Philosophical, rigorous, direct, slightly critical (matching the user's skepticism).
      *   *Structure:*
          1.  Introduction (acknowledging the "rabbit hole").
          2.  The Core Desiderata (The Specification).
          3.  The Tensions (The Incompatibilities).
          4.  The Knockout Criterion.
          5.  The Verdict (Stable Core vs. Epicycles).
      *   *Check Constraints:* No citations. (Avoid saying "Fricker says X," say "The original account argues X").

  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* I need to make sure I don't just summarize Fricker. The user wants the *theory conditions*, not a history.
      *   *Nuance:* The distinction between "prejudice" and "testimonial injustice" is key. Prejudice is the *cause*, testimonial injustice is the *specific wrong*. A theory must separate cause from constitution.
      *   *Nuance:* The "Hermeneutical" side is tricky. It involves collective resources. A theory must explain how an individual suffers from a collective gap.

  9.  **Finalizing the Content (Mental Outline):**
      *   **Desideratum 1: Distinctiveness.** (Not just prejudice).
      *   **Desideratum 2: Epistemic Primary Harm.** (Harm to capacity, not just outcome).
      *   **Desideratum 3: Scalability.** (Individual to Structural).
      *   **Desideratum 4: Non-Circularity.** (Don't define injustice by the outcome it tries to explain).
      *   **Tension:** Individual Virtue vs. Structural Critique.
      *   **Tension:** Phenomenological Access vs. Objective Oppression.
      *   **Knockout:** Distinctiveness (The "Redundancy Objection").
      *   **Verdict:** Core is stable, superstructure is epicyclic.

  10. **Writing the Response:** (Proceeding to generate the text based on this thought process.)
answer: |-
  This is a sharp diagnosis. You have identified the exact point where the literature starts to fray: the move from identifying a phenomenon to theorizing its boundaries. When every negative epistemic interaction gets a new label, the concept risks becoming vacuous.

  Here is the specification you are asking for. These are the desiderata an adequate theory of epistemic injustice must satisfy, the tensions between them, and the verdict on the field's stability.

  ### I. The Core Desiderata (The Non-Negotiables)

  An adequate theory must satisfy these four conditions. If a theory fails any of these, it is not a theory of *epistemic* injustice; it is a theory of prejudice, oppression, or ignorance simpliciter.

  **1. The Distinctiveness Constraint**
  *   **The Requirement:** The theory must explain why the injustice is *constitutively* epistemic, not just causally epistemic.
  *   **The Earned Spot:** Consider a case where a racist landlord refuses to rent to a Black tenant. This involves prejudice and causes material harm. It is an injustice. But it is not an *epistemic* injustice. Now consider a case where a doctor refuses to believe a Black patient's report of pain. This is the target phenomenon.
  *   **Why it matters:** If the theory cannot distinguish the landlord case from the doctor case, it is just rebranding generic prejudice. The wrong must be done *in the capacity of the subject as a knower*, not just using knowledge as a tool to deliver a separate harm.

  **2. The Primary Harm Constraint**
  *   **The Requirement:** The theory must identify a "primary harm" that is intrinsic to the epistemic interaction, distinct from downstream practical consequences.
  *   **The Earned Spot:** If a witness is disbelieved in court (testimonial injustice) and the defendant goes free, the practical harm is clear. But suppose the defendant is convicted anyway due to other evidence. The witness was still wronged.
  *   **Why it matters:** A theory that defines the injustice solely by negative life outcomes (loss of job, freedom, health) collapses epistemic injustice into general misfortune. The primary harm must be to the subject's status as an epistemic agent (e.g., being degraded as a source of knowledge), regardless of whether they "win" the practical outcome.

  **3. The Structural Scalability Constraint**
  *   **The Requirement:** The theory must be able to account for harms that occur without a specific, culpable individual agent.
  *   **The Earned Spot:** Consider a community that lacks the concepts to understand "sexual harassment" (the classic hermeneutical case). The harm is real. But if no individual is actively malicious—everyone is just using the available vocabulary—a theory focused solely on individual vice (like prejudice in the head of a hearer) cannot explain the injustice.
  *   **Why it matters:** If the theory requires a villain, it misses the most pervasive forms of the phenomenon. It must handle "innocent" participation in oppressive epistemic systems.

  **4. The Non-Circularity Constraint**
  *   **The Requirement:** The theory cannot define the injustice by appealing to the very credibility deficits it is trying to explain.
  *   **The Earned Spot:** If you say, "Testimonial injustice occurs when someone is given less credibility than they deserve," you must have an independent account of what credibility they *deserve* that doesn't just mean "the amount they would get if injustice weren't happening."
  *   **Why it matters:** Without an independent metric of appropriate credibility (a "neutral baseline"), the theory is tautological. It says, "Injustice is when we treat people unfairly," which is true but useless.

  ---

  ### II. The Tensions (Incompatible Desiderata)

  Here is the bad news. Satisfying all four desiderata simultaneously creates significant friction. There are pairs of requirements that pull the theory in opposite directions.

  **Tension 1: Individual Culpability vs. Structural Scalability**
  *   **The Conflict:** To satisfy the **Distinctiveness Constraint**, you often need to locate the wrong in a specific interaction (e.g., a hearer failing to correct for prejudice). This preserves the link between the act and the epistemic wrong. However, to satisfy the **Structural Scalability Constraint**, you need to locate the wrong in systems, resources, and collective hermeneutical gaps where no individual is necessarily at fault.
  *   **The Incoherence Risk:** If you lean too hard into structure, the "injustice" becomes a state of affairs rather than an action, making it hard to assign responsibility or identify the specific moment of wronging. If you lean too hard into individual interaction, you miss the systemic background that makes the individual act possible. A theory that maximizes one tends to minimize the other.

  **Tension 2: Phenomenological Access vs. Objective Oppression**
  *   **The Conflict:** Does the victim need to be able to identify the injustice for it to count?
      *   *Side A:* If the victim doesn't experience it as a wrong (perhaps due to adaptive preferences or lack of concepts), can we call it an injustice *to them*? (Respects agency).
      *   *Side B:* Often, the point of the theory is to name harms the victim *cannot* yet articulate (hermeneutical marginalization).
  *   **The Incoherence Risk:** If you require the victim to recognize the harm, you exclude the most vulnerable cases (hermeneutical deprivation). If you do not require it, you risk paternalism, where the theorist claims to know the victim's epistemic interest better than they do.

  **Tension 3: Precision vs. Coverage (The "Epicycle" Trap)**
  *   **The Conflict:** To handle every new case (exploitation, appropriation, willful ignorance), the theory must expand its definitions. But to satisfy the **Distinctiveness Constraint**, it must remain narrow enough to exclude generic prejudice.
  *   **The Incoherence Risk:** As you add subtypes to cover more ground, the core definition stretches. Eventually, "epistemic injustice" just means "bad things involving knowledge." At that point, the theory loses its explanatory power. You cannot have a tight definition *and* universal coverage.

  ---

  ### III. The Knockout Criterion

  You asked which single requirement does the most work.

  **The Distinctiveness Constraint is the knockout blow.**

  Most existing views in the literature fail this.
  *   **Why:** Many accounts define epistemic injustice simply as "prejudice causing epistemic harm." But as noted in the landlord/doctor comparison, prejudice causes all kinds of harm.
  *   **The Filter:** To pass this filter, a theory must explain why the *epistemic* dimension is the locus of the moral wrong, not just the mechanism.
      *   *Failure Mode 1:* Reducing it to "silencing." (Silencing can be physical).
      *   *Failure Mode 2:* Reducing it to "psychological harm." (Insults cause psychological harm).
      *   *Success Mode:* Showing that the victim is degraded *qua* rational agent.
  *   **Impact:** This requirement knocks out any theory that treats epistemic injustice as merely a subset of distributive injustice (unequal distribution of knowledge) or generic discrimination. It forces the theory to be about *status* and *agency*, not just outcomes.

  ---

  ### IV. The Verdict: Stable Core or Epicycles?

  You asked for honesty on whether this subfield has a stable core or is just bolting epicycles onto the original categories.

  **The Verdict:** The core is stable, but the superstructure is epicyclic.

  1.  **The Stable Core:** The intuition that one can be wronged specifically in one's capacity as a knower is robust. The distinction between *testimonial* (input/credibility) and *hermeneutical* (processing/resources) covers the vast majority of non-trivial cases. This core satisfies the Distinctiveness and Primary Harm constraints well.
  2.  **The Epicycles:** The proliferation of subtypes (contributory, exploitative, appropriative, etc.) is largely an attempt to solve the **Structural Scalability Constraint** without abandoning the **Individual Culpability** focus of the core.
      *   Instead of revising the fundamental theory to accommodate structural oppression, theorists are adding new categories to capture specific structural dynamics.
      *   This creates the "weeds" you are experiencing. Each new subtype is a patch for a case the original binary couldn't easily digest without stretching.

  **Conclusion:**
  An adequate theory does not need more subtypes. It needs to resolve the tension between **Individual Culpability** and **Structural Scalability**.

  If you are evaluating a paper or a theory, ask this: *Does this account explain why the structural case is an injustice without relying on the presence of an individual villain?*
  *   If **Yes**: It likely sacrifices the Distinctiveness Constraint (becoming too broad).
  *   If **No**: It fails the Structural Scalability Constraint (becoming too narrow).

  The field is currently stuck trying to say "Yes" and "No" simultaneously. That is why you are lost. The theory is trying to be a virtue ethics of the individual hearer *and* a critical theory of social structures at the same time, and the math doesn't fully work.
