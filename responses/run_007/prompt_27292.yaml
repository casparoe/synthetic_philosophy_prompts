answer: |-
  You have identified one of the central fault lines in contemporary philosophy of physics. Your intuition is correct: there is a systematic taxonomy for this, but the binary you observed ("real" vs. "epistemic") is often a shorthand for a much richer conceptual space.

  The standard terminology in the foundations literature for the distinction you are describing is **$\psi$-ontic vs. $\psi$-epistemic**. This framework was rigorously formalized by Harrigan and Spekkens in their seminal 2010 paper, *"Einstein, Incompleteness, and the Epistemic View of Quantum States."*

  However, as you noted, this binary often fractures under pressure. To give you the map you need, we must disentangle three layers: the technical definition of the ontic/epistemic split, the subdivisions within those camps (which account for the "law" vs. "substance" debate), and the contextual differences between fundamental foundations and condensed matter practice.

  Here is the systematic carving of the conceptual space.

  ---

  ### 1. The Core Distinction: $\psi$-Ontic vs. $\psi$-Epistemic

  In philosophy of physics, we distinguish between the **ontic state** (denoted $\lambda$) and the **quantum state** (denoted $\psi$).
  *   **$\lambda$ (Ontic State):** The complete physical state of the system. It is "what is actually the case" in the world, independent of any observer. In classical mechanics, this is a point in phase space (position and momentum).
  *   **$\psi$ (Wavefunction):** The mathematical object used in quantum theory.

  The debate is about the relationship between $\psi$ and $\lambda$.

  #### **$\psi$-Ontic Models**
  In a $\psi$-ontic model, the wavefunction corresponds directly to the physical reality. If two systems have different wavefunctions ($\psi_1 \neq \psi_2$), they must be in different physical states ($\lambda_1 \neq \lambda_2$). The wavefunction is a property of the system itself.
  *   **The Claim:** $\psi$ is part of the "furniture of the world."
  *   **Examples:** Many-Worlds (Everettian), Bohmian Mechanics (where $\psi$ is a guiding field), GRW (Collapse theories).

  #### **$\psi$-Epistemic Models**
  In a $\psi$-epistemic model, the wavefunction represents an agent's knowledge (or information) about the underlying physical state. Distinct wavefunctions can correspond to the *same* underlying physical state ($\lambda$). Just as two different probability distributions in classical statistical mechanics can describe the same microstate (due to different knowledge), $\psi$ reflects incomplete knowledge of $\lambda$.
  *   **The Claim:** $\psi$ is a catalog of expectations, not a physical field.
  *   **Examples:** QBism, Quantum Bayesianism, certain interpretations of Copenhagen, Spekkens' Toy Model.

  **Does this match your observation?** Yes. Your "wavefunction-as-worldly" camp is $\psi$-ontic. Your "wavefunction-as-epistemic" camp is $\psi$-epistemic.

  ---

  ### 2. Subdividing the "Ontic" Camp: Substance, Law, and Structure

  You noticed that even among those who say $\psi$ is "real," they disagree on *what kind* of thing it is. This is where the binary breaks down. Within $\psi$-onticism, there are three major distinct positions:

  #### **A. Wavefunction Realism (The "Substance" View)**
  This is the most literal reading. Proponents (like David Albert and Alyssa Ney) argue that the wavefunction is a concrete physical field.
  *   **The Catch:** Since $\psi$ lives in configuration space (3N dimensions), not 3D space, this view commits you to the claim that **high-dimensional configuration space is the fundamental reality**, and our 3D world is emergent or derivative.
  *   **Ontological Category:** Concrete Object/Field.

  #### **B. The Nomological View (The "Law" View)**
  Proponents (like Goldstein and Zanghì in the Bohmian context) argue that $\psi$ is real, but not as a *substance*. It is more like a **law of nature**.
  *   **The Argument:** In classical mechanics, the Hamiltonian governs evolution but isn't a "thing" sitting in space. Similarly, $\psi$ governs the evolution of particles (or outcomes) but isn't a material field.
  *   **Ontological Category:** Law/Nomological Structure.
  *   **Why it matters:** This cuts across your binary. A law is "real" (it's not a fiction), but it isn't "ontic" in the sense of being a localized physical object. It occupies a middle ground: **$\psi$-nomological**.

  #### **C. Quantum Structural Realism**
  This view suggests that asking if $\psi$ is a "thing" or "knowledge" presupposes an ontology of *objects*. Instead, only the **structure** of relations described by $\psi$ is real.
  *   **The Argument:** Physics describes relations (symmetries, topological invariants), not underlying relata. The wavefunction encodes the structure of reality, not the stuff of reality.
  *   **Ontological Category:** Relations/Structure.

  ---

  ### 3. Subdividing the "Epistemic" Camp: Whose Knowledge?

  Similarly, the "epistemic" side is not monolithic. The crucial distinction is *whose* knowledge and knowledge of *what*.

  #### **A. Agent-Centric (QBism/Pragmatism)**
  Here, $\psi$ represents the subjective degrees of belief of a specific agent (the physicist).
  *   **Implication:** There is no "view from nowhere." $\psi$ is a tool for decision theory. Measurement outcomes are personal experiences.
  *   **Ontological Commitment:** Minimal. Often agnostic about $\lambda$.

  #### **B. Ensemble/Statistical View**
  Here, $\psi$ represents knowledge about an **ensemble** of similarly prepared systems, not an individual system.
  *   **Implication:** Quantum mechanics is incomplete (Einstein's view). There is a $\lambda$ for individual systems, but QM only describes the statistics of the group.
  *   **Ontological Commitment:** High (believes in $\lambda$), but claims QM doesn't describe it fully.

  #### **C. Neo-Copenhagen (Healey, Bohr)**
  This view avoids the word "knowledge" (which implies a knower) and uses "information" or "phenomena." $\psi$ is a symbolic representation of the conditions under which phenomena occur.
  *   **Implication:** It is a category error to ask what $\psi$ is "made of." It is a semantic tool for coordinating assertions about measurement contexts.

  ---

  ### 4. The Condensed Matter Puzzle: Effective vs. Fundamental Ontology

  You astutely noted that condensed matter (CM) physicists talk about the wavefunction's topology as if it were real, even if they might be $\psi$-epistemic in a foundations context. This is explained by the distinction between **Fundamental** and **Effective** Ontology.

  *   **Fundamental Ontology:** What exists at the bottom level of reality? (The Foundations debate).
  *   **Effective Ontology:** What entities exist within a specific effective field theory (EFT) at a specific energy scale?

  In Condensed Matter, the wavefunction (or order parameter) is **effectively real**.
  *   **Why?** Because within the EFT, the topological properties of $\psi$ have causal/explanatory power regarding conductance, edge states, etc. Whether $\psi$ is "fundamentally" a field or information doesn't matter for the EFT.
  *   **The Philosophical Term:** **Emergent Realism**. A CM physicist can be a $\psi$-epistemicist about fundamental quantum gravity but a $\psi$-onticist about quasiparticles and topological order in a superconductor. They are not contradicting themselves; they are operating at different levels of description.

  ---

  ### 5. Is the Question Badly Framed? (No-Go Theorems and Category Errors)

  You asked if the question itself might be flawed. The literature has two major responses to this.

  #### **A. The PBR Theorem (2012)**
  Pusey, Barrett, and Rudolph proved a theorem showing that, under certain assumptions (mainly "preparation independence"), **$\psi$-epistemic models are incompatible with quantum predictions.**
  *   **Impact:** This forced the "epistemic" camp to either reject the assumptions (e.g., allow retrocausality or deny preparation independence) or accept that $\psi$ must be ontic. It tightened the boundaries of the conceptual space, making strict $\psi$-epistemicism harder to maintain without modifying other physical intuitions.

  #### **B. The Category Error Critique**
  Some philosophers (and many working physicists) argue the ontic/epistemic split presupposes a **Representationalist** view of science (that theories mirror the world).
  *   **Pragmatist View:** (e.g., Richard Healey, Simon Saunders). The question "Is $\psi$ real?" is a linguistic trap. The correct question is: "What role does $\psi$ play in our successful practices of prediction and intervention?"
  *   **Sui Generis:** Some argue $\psi$ belongs to a category unique to quantum theory. It is not a field (classical), nor a probability (classical), nor a law (classical). It is a **quantum state**, and trying to map it onto classical metaphysical categories is the error.

  ---

  ### 6. Summary Map of the Conceptual Space

  To answer your request for a "clean carving," here is the taxonomy you can use to categorize the statements you hear:

  | Position | Relationship of $\psi$ to World | Metaphysical Category | Typical Proponents |
  | :--- | :--- | :--- | :--- |
  | **$\psi$-Ontic (Substantivalist)** | $\psi$ is a physical object/field. | Concrete Entity (in 3N space) | David Albert, Alyssa Ney, Everettians |
  | **$\psi$-Ontic (Nomological)** | $\psi$ governs matter but isn't matter. | Law of Nature | Goldstein, Zanghì (Bohmians) |
  | **$\psi$-Epistemic (Subjective)** | $\psi$ is an agent's belief state. | Credence / Decision Tool | QBists (Fuchs, Schack) |
  | **$\psi$-Epistemic (Statistical)** | $\psi$ describes an ensemble, not individual. | Statistical Distribution | Einstein (historical), Ensemble interpreters |
  | **Effective Realist** | $\psi$ is real *within the model/scale*. | Emergent Entity | Condensed Matter Physicists |
  | **Pragmatist / Anti-Realist** | "Real?" is the wrong question. | Instrument / Rule | Instrumentalists, Neo-Copenhagen |

  ### Recommendation for Your Vocabulary

  When you hear a colleague make a claim, you can now diagnose it by asking two questions:

  1.  **Is this a claim about Fundamental or Effective ontology?** (This resolves the Condensed Matter vs. Foundations tension).
  2.  **If Fundamental, is $\psi$ being treated as a Property, a Law, or Information?** (This resolves the Real vs. Epistemic tension).

  **The specific term you were looking for** is the **$\psi$-ontic / $\psi$-epistemic distinction**, but you should treat it as a spectrum constrained by the **PBR theorem**, rather than a hard binary. The "Law" view is the most significant intermediate position that escapes the binary, and the "Effective" view is the key to understanding why practical physicists sound like realists even when foundational physicists are debating anti-realism.
