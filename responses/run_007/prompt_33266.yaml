answer: |-
  You are not missing something obvious, and you are not crazy. Your intuition is philosophically sound, and you have correctly identified one of the most significant objections to classical hedonism.

  The short answer is: **You are right that the heterogeneity problem kills *Sensory Hedonism*. You are partly right that it threatens the foundation of Utilitarianism, but the edifice hasn't collapsed because the foundation was quietly reinforced and shifted underneath it.**

  Here is the step-by-step breakdown of where your reasoning holds, where the philosophical counter-moves are, and why the EA/Utilitarian community hasn't imploded.

  ### 1. The Diagnosis: You Are Right About Sensory Hedonism
  Your core argument is the **Heterogeneity of Pleasure**.
  *   **Premise:** If hedonism is true, "pleasure" must be a unified natural kind (like "water" = H₂O) that explains *why* these experiences are good.
  *   **Observation:** Introspection reveals no common phenomenal quality (no "pleasure quale") shared by eating, math, morphine, and parenting.
  *   **Conclusion:** "Pleasure" is just a label we slap on a disjunctive set of unrelated experiences. Therefore, "maximize pleasure" is vacuous.

  This argument was decisively made by G.E. Moore and C.D. Broad in the early 20th century. If hedonism claims there is a specific *sensation* (a "tingle" or a "glow") that exists in all good experiences, **hedonism is false.** There is no such sensation.

  If your friends are defending *Classical Benthamite Hedonism* (which treats pleasure as a homogeneous sensation that varies only in intensity and duration), they are defending a position that most academic philosophers consider dead.

  ### 2. The Counter-Move: Attitudinal Hedonism
  Your friends mentioned "attitudinal hedonism," but likely failed to explain why it isn't just a definitional dodge. It is the strongest surviving version of hedonism, championed by philosophers like Fred Feldman.

  Here is the distinction:
  *   **Sensory Hedonism:** Pleasure is a *feeling* (a phenomenal quality). **(Vulnerable to your objection)**
  *   **Attitudinal Hedonism:** Pleasure is a *propositional attitude*.

  **The Analogy:** Think about "belief."
  *   The belief that "2+2=4" feels different from the belief that "it is raining." One is abstract, one is sensory. There is no single "belief quale" that unites them.
  *   However, "belief" is still a coherent functional category. It is a stance of *taking-to-be-true* regarding a proposition.

  Attitudinal hedonism argues that pleasure is the stance of *being-pleased-that*.
  *   When you solve the math problem, you are *pleased that* you solved it.
  *   When you see your kid walk, you are *pleased that* they are walking.
  *   When you take morphine, you are *pleased that* your pain is gone (or pleased by the bodily sensation).

  **Why this answers the Heterogeneity Problem:**
  It shifts the unity from the *content* (the feeling) to the *attitude* (the psychological stance). Just as "believing" unites vastly different mental states under one functional role, "being pleased" unites vastly different experiences.

  **Is this a dodge?**
  Critics say yes. They argue it severs the link to *phenomenology* (what it feels like), which was the whole point of hedonism (grounding value in experience).
  **Defenders say no.** They argue it captures why we value these things. We don't value the "tingle" of the math problem; we value the *satisfaction* of the accomplishment. Attitudinal hedonism captures that satisfaction without needing a magic "pleasure particle."

  ### 3. The Functionalism Argument (For the Programmer)
  Since you come from a programming background, think of this in terms of **Interface vs. Implementation**.

  *   **Your Objection:** You are looking at the *Implementation*. The data structures for "morphine pleasure" and "math pleasure" are totally different. There is no shared variable `pleasure_quale`.
  *   **The Hedonist Defense:** Pleasure is defined by the *Interface* (Functional Role).

  In functionalist philosophy of mind, mental states are defined by what they *do*, not what they are made of.
  *   **Input:** Perception of a state of affairs (e.g., "I ate food").
  *   **Internal State:** Positive reinforcement signal / Desire to sustain this state / Disposition to smile.
  *   **Output:** Pursuit behavior, verbal report "this is good."

  If all these heterogeneous experiences play the same *functional role* in your cognitive architecture (they reinforce behavior, they are sought after, they suppress pain-avoidance systems), then they form a **Functional Kind**, even if they aren't a **Phenomenal Kind**.

  If you accept functionalism, the heterogeneity problem dissolves. "Pleasure" is the name of the reward function, not the specific data passed to it.

  ### 4. Why hasn't Utilitarianism/EA Collapsed?
  You asked: *"Otherwise the whole utilitarian/EA edifice would have collapsed decades ago."*

  It *did* collapse, but it was rebuilt. Here is the landscape shift:

  1.  **Shift to Preference Utilitarianism:** Most modern utilitarians (and many EAs) are not hedonists. They are **Preference Utilitarians**.
      *   *Theory:* The good is satisfying informed preferences, not maximizing a "pleasure" metric.
      *   *Why:* This bypasses the heterogeneity problem entirely. It doesn't matter if the experiences feel different; what matters is that the agent wanted them.
      *   *EA Context:* This is why EA often talks about "doing what people want" or "revealed preference." It's a pragmatic workaround.

  2.  **Pluralism:** Many EAs are value pluralists. They accept that well-being includes pleasure, but also autonomy, knowledge, and relationships. Hedonism is not the sole foundation of EA, even if it's a loud part of the discourse (e.g., in animal welfare/suffering focus).

  3.  **Measurement Pragmatism:** In EA, we often use proxies (QALYs, DALYs, self-reported life satisfaction). We don't need a metaphysical solution to the heterogeneity problem to distribute bednets. We just need a metric that correlates with "people think their lives are going better." The philosophical fuzziness doesn't stop the practical work.

  4.  **Negative Utilitarianism / Suffering Focus:** Interestingly, the heterogeneity problem is weaker for *pain* than for *pleasure*.
      *   Pain feels more unified (it demands attention, it is aversive).
      *   Many EAs focus on *reducing suffering* rather than *maximizing pleasure*.
      *   You can be a "Negative Hedonist" (minimize pain) without needing to solve the "heterogeneity of joy" problem.

  ### 5. Where Your Reasoning Might Need an Update
  You asked where exactly your reasoning breaks down. It doesn't "break," but it might be targeting a straw man of modern hedonism.

  *   **Don't attack Sensory Hedonism:** You've already won that fight. It's untenable.
  *   **Attack Attitudinal Hedonism on Grounds of "Experience":** The real critique against Attitudinal Hedonism isn't heterogeneity; it's that it abandons the *experiential* requirement. If I am deluded and *pleased that* my spouse is faithful (when they aren't), attitudinal hedonism says I have well-being. Many find this counter-intuitive. That is a stronger objection than heterogeneity.
  *   **Acknowledge Functional Unity:** If you reject the idea that "functional role" creates a valid category, you risk undermining many concepts in cognitive science (e.g., "memory," "attention," and even "computation" itself are heterogeneous at the physical level but unified functionally).

  ### 6. The Verdict
  **Should you update?**
  *   **Update against Classical Hedonism:** Yes. The idea that there is a single "pleasure sensation" is false.
  *   **Update against Utilitarianism:** No. Utilitarianism is a structural framework (maximize the good), not a specific theory of the good (pleasure). It accommodates preference satisfaction, objective lists, etc.
  *   **Update against EA:** No. EA is cause-neutral and theory-neutral. It uses hedonism where it works (animal suffering) and preference satisfaction where it doesn't (global development).

  **The "Gerrymandered Disjunction" Charge:**
  You argued that if pleasure is a disjunction, it can't explain value.
  *   **Counter:** "Computation" is a disjunction of silicon chips, neural tissue, and gears. It is gerrymandered at the physical level. But it is a real, useful natural kind at the *functional* level.
  *   If pleasure is the "reward signal" of the human organism, it is a real kind functionally, even if phenomenologically diverse.

  **Summary:**
  You haven't found a secret bug that destroys the system. You've found a known limitation of *Classical Hedonism* that caused the system to patch itself (via Attitudinal Hedonism and Preference Utilitarianism). The EA/Utilitarian edifice stands because it is built on the patched version, not the version you are correctly critiquing.

  If you want to read one thing to solidify this, look up **Fred Feldman's *Pleasure and the Good Life***. He addresses the heterogeneity problem head-on using the attitudinal/functional defense. If that doesn't satisfy you, you are likely a **Value Pluralist** or an **Objective List Theorist**, which are respectable positions held by many critics of pure hedonism.
