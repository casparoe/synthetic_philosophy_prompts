  You are an expert in non-classical logic and the philosophy of mathematics. Please reason through the following question step by step, and answer in American English.

  I've been trying to understand paraconsistent logic, and I've hit a stumbling block that I can't resolve on my own. Paraconsistent logics are supposed to allow reasoning with contradictions without the system trivializing — they reject the principle of explosion (ex contradictione quodlibet), which says that from a contradiction, any arbitrary proposition follows. That much I follow. But here's what bothers me: if you give up explosion, don't you also have to give up proof by contradiction? The standard reductio ad absurdum works by assuming some proposition P, deriving a contradiction, and then concluding ¬P. The rationale seems to be that contradictions are unacceptable, so whatever leads to one must be false. But if you're a dialetheist — someone who thinks there are true contradictions — then deriving a contradiction from P doesn't force you to reject P. You might just have discovered a true contradiction, and P might still be true. And even if you're not a dialetheist but just want a paraconsistent logic for other reasons (like handling inconsistent databases or legal reasoning), the same problem seems to arise: if your logic doesn't treat contradictions as inferentially catastrophic, then the move from "P implies a contradiction" to "therefore ¬P" looks unjustified. Since reductio arguments are ubiquitous in mathematics — from Euclid's proof of the infinitude of primes to Cantor's diagonal argument — this would mean paraconsistent logic can't reconstruct huge swaths of mathematical reasoning. That seems like a devastating cost. Am I missing something, or is paraconsistent logic genuinely incompatible with standard mathematical practice?
