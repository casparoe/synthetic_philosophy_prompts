          *   Empirical Mugging: No (Omega flips a coin; your decision doesn't affect the coin, only Omega's *response* to the coin). Wait, in Counterfactual Mugging, Omega asks for money *if Tails* because you *would have* paid *if Heads*. Your decision procedure determines the "would have."
          *   *Crucial Point:* In Empirical Counterfactual Mugging, your decision procedure *does* determine whether Omega gives you money in the Heads branch. The Tails branch is the cost. The structure is:
