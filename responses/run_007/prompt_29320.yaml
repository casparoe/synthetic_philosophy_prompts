prompt: |-
  ok so I'm trying to nail down my views on some decision theory puzzles for a workshop paper and I want someone who really knows this stuff to stress-test whether my positions hang together. please think through this carefully — like, actually trace out what each commitment implies for the others, don't just give me surface-level reactions. you're an expert on decision theory and philosophical logic, so I want the real tensions, not the obvious ones everyone already talks about.

  here's where I'm at:

  (1) I don't pay in the standard counterfactual mugging. Omega flipped a fair coin, it came up tails, I get nothing either way, and throwing away $100 because I "would have" gotten $10,000 in a branch that didn't happen feels like a straight-up mugging — the name is accurate, I'm not paying.

  (2) I do pay in the XOR version / logical counterfactual mugging. In that setup, whether I'm facing the blackmailer or the benefactor depends on a logical fact about what my decision procedure outputs, and paying is how I ensure I'm in the benefactor world. That feels totally different to me.

  (3) I think the distinction between empirical uncertainty (coin flips, physical randomness) and logical uncertainty (unknown math facts, what my own algorithm outputs) is genuinely decision-theoretically load-bearing. It's not just an intuition pump — it does real work.

  (4) I'm an updateless agent: I don't update on facts I knew in advance I'd eventually learn, when doing so would make me predictably poorer. I think this is basically forced by reflecting on what kind of decision procedure I want to be running before I learn the thing.

  (5) I one-box in Newcomb's problem.

  (6) I think evidential decision theory blows it in the smoking lesion case — you shouldn't smoke just because smoking correlates with being the kind of person who gets cancer, when the correlation runs through a common cause and smoking itself does nothing. CDT is right about that case even if it's wrong about others.

  so that's six committments. before I put these in a paper, tell me: which of these are actually in tension, which only look like they are, and what's the severest one? rank them rather than treating everything as equally problematic. for any tension you find, tell me the cheapest revision and what it would cost me elsewhere. I'm trying to figure out what I actually have to give up and what I can keep.
