  So my buddy and I have been going back and forth for like a month about the gradual-replacement upload scenario — you know, the one where they swap your neurons one at a time with artificial ones that do the exact same computations, and at every step you stay conscious and talking and your memories are all there, but by the end there's no biology left. He says of course you'd still be you, I say somewhere along the line "you" just winks out and what's left is a perfect imposter that thinks it survived. We're going in circles and decided to try an adversarial-collaboration document to pin down where we actually disagree.

  Draft the joint statement we could both sign. I want: (1) a numbered list of claims we both accept — about the physical facts, about what the process does and doesn't preserve, about what we agree *isn't* what we're fighting over; (2) a disagreements table with the exact points where we split, each worded so the other guy would nod and say "yeah that's my view"; (3) the cruxes — sub-questions where if one of us changed our mind we'd probably switch sides; and (4) for each crux, a variant scenario or test case we'd both agree is relevant, plus what each of us predicts about it. If you think any chunk of this is just us talking past each other with different definitions, call that out.
