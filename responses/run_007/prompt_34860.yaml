      *   If "2+2=4" is true at all v ∈ W, it is true at all v ∈ R(w). Therefore K(2+2=4).
      *   *Concrete instantiation:* Use a truth-table style setup.
      *   Let's use the "Detective" example but focus on the *sets of worlds*.
      *   Example: Agent knows "It is raining" (p).
