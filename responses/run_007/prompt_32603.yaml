prompt: |-
  I spent my career in the natural sciences, and like many of my generation, I was trained on null hypothesis significance testing as if it were the only game in town. The replication crisis has made it clear that something is wrong with how we use statistics, and the Bayesian/frequentist divide seems to be at the heart of many diagnoses. But I have now read enough philosophy of statistics to know that the debate is vast — it ranges from the foundations of probability to the mechanics of multilevel modeling — and I want to know where to direct my remaining attention.

  Suppose a small research group with both philosophical and statistical competence could spend five years on questions at the Bayesian/frequentist interface that are meant to change how working scientists actually behave — how they design studies, analyze data, and interpret results. Which open questions should they prioritize, and in what order? For each entry in your ranking, I want the reasoning: how exactly does progress on this question translate into different practices at the bench or in the field? What makes it tractable — are the conceptual pieces already in place, or would it require new formal work? And what would have to happen over the next few years for you to move it up or down the list? I am not looking for a survey of the debate; I am looking for a defended agenda, one that a former experimentalist could judge against decades of watching scientists misuse statistics in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Former experimentalist in natural sciences, experienced with NHST (Null Hypothesis Significance Testing), aware of the replication crisis, has read philosophy of statistics.
      *   **Goal:** A 5-year research agenda for a small, competent group (philosophy + stats) to change *actual scientific practice* at the Bayesian/frequentist interface.
      *   **Requirements:** Ranked list of open questions, reasoning for each (translation to practice, tractability), and conditions for re-ranking.
      *   **Tone:** Pragmatic, defended agenda, not a survey, critical of current misuse.

  2.  **Deconstruct the Problem:**
      *   The core issue isn't just "Bayes vs. Frequentist." It's about *inference under uncertainty* in resource-constrained environments.
      *   NHST failed because it conflated evidence with decision rules, ignored prior knowledge, and incentivized $p < 0.05$ hacking.
      *   Pure Bayesianism often fails in practice due to computational cost, prior sensitivity concerns, and lack of calibration guarantees.
      *   The "Interface" is where the practical magic happens: Frequentist properties of Bayesian procedures, or Bayesian interpretations of Frequentist outputs.
      *   The goal is *behavioral change* in working scientists (biologists, psychologists, etc.), not just theoretical purity.

  3.  **Brainstorming Potential Agenda Items:**
      *   *Priors:* How to elicit them without bias? Default priors?
      *   *Multiple Comparisons:* Bayesian vs. FDR control.
      *   *Stopping Rules:* Optional stopping in Bayes vs. Frequentist alpha spending.
      *   *Model Checking:* Posterior predictive checks vs. Residual analysis.
      *   *Decision Theory:* Moving from "significance" to "utility/cost."
      *   *Calibration:* Do 95% credible intervals actually contain the truth 95% of the time?
      *   *Software/Workflow:* Making the right thing the easy thing.
      *   *Meta-analysis:* Combining evidence across studies.

  4.  **Selecting and Ranking the Top Priorities:**
      *   *Criterion 1: Impact on Practice.* Does solving this stop $p$-hacking or improve study design?
      *   *Criterion 2: Tractability.* Can a small group make progress in 5 years?
      *   *Criterion 3: Philosophical/Statistical Depth.* Does it address the root cause, not just symptoms?

      *   *Candidate 1: Decision-Theoretic Thresholds.* (High Impact). Scientists treat $p<0.05$ as truth. We need to replace binary decisions with cost/benefit analysis.
      *   *Candidate 2: Calibration of Credible Intervals.* (High Trust). Scientists don't trust priors. If we show Bayesian intervals have good frequentist coverage, they might adopt them.
      *   *Candidate 3: Sequential Analysis/Optional Stopping.* (High Design Impact). This is where NHST is most fragile. Bayes handles this naturally, but needs safeguards.
      *   *Candidate 4: Prior Elicitation/Defaults.* (High Barrier). "Subjective priors" scare scientists. We need robust defaults.

      *   *Refining the Ranking:*
          1.  **Calibration/Operating Characteristics of Bayesian Procedures.** Why? Because scientists trust long-run performance. If Bayes can prove it "works" frequently, adoption increases.
          2.  **Decision-Theoretic Frameworks for Design.** Why? Because NHST is a bad decision rule. Replacing it requires a better one, not just better probabilities.
          3.  **Robust Sequential Analysis.** Why? Because data collection is dynamic. NHST breaks here; Bayes shines but needs guardrails.
          4.  **Prior Robustness and Default Specifications.** Why? Because "subjectivity" is the main excuse for rejecting Bayes.

      *   *Wait, let's look closer at the "Interface".* The most fruitful ground is *Frequentist evaluation of Bayesian methods*. This bridges the trust gap.
      *   *Re-evaluating #1:* Is calibration enough? No, scientists need to know *what to do* with the probability. So Decision Theory is crucial.
      *   *Re-evaluating #2:* Sequential analysis is a specific case of decision theory. Maybe bundle them? No, keep separate for clarity.
      *   *New Idea:* **Multilevel Modeling as Partial Pooling.** This is practically huge for replication. It shrinks noise. It's Bayesian in spirit but often fit via Frequentist methods (lme4). The philosophy of *shrinkage* is key.

      *   *Final Selection for the Agenda:*
          1.  **Frequentist Calibration of Bayesian Credible Intervals (The "Trust" Bridge).**
          2.  **Decision-Theoretic Replacement for Significance Thresholds (The "Action" Bridge).**
          3.  **Formalizing "Information Accumulation" in Sequential Designs (The "Design" Bridge).**
          4.  **Philosophy and Mechanics of Shrinkage/Regularization (The "Model" Bridge).**

  5.  **Drafting the Content (Iterative refinement for tone and specificity):**

      *   *Item 1 (Calibration):* Focus on "Coverage." If I say 95% credible interval, does it cover 95% of the time in repeated sampling? If yes, Frequentists can't object. *Practice:* Scientists report intervals with confidence. *Tractability:* Simulation studies, asymptotic theory.
      *   *Item 2 (Decision Theory):* Focus on "Loss Functions." $p$-values don't tell you cost of Type I vs Type II errors. *Practice:* Pre-registration includes cost assumptions. *Tractability:* Harder. Requires eliciting costs.
      *   *Item 3 (Sequential):* Focus on "Stopping." *Practice:* No more fixed N. *Tractability:* Bayes factors have drift issues. Need boundaries.
      *   *Item 4 (Shrinkage):* Focus on "Exchangeability." *Practice:* Better estimates for small groups. *Tractability:* Computational tools exist, philosophy lags.

      *   *Critique of my own draft:* Is this too technical? The user is a former experimentalist. They need to see the *bench* impact.
      *   *Adjustment:* Emphasize the *behavioral* change. For Calibration, the change is "reporting intervals without fear." For Decision Theory, the change is "not claiming discovery based on probability alone."
      *   *Refining the "Interface":* The prompt asks for the *Bayesian/Frequentist interface*.
          *   Item 1 is perfect (Frequentist props of Bayesian tools).
          *   Item 2 is perfect (Frequentist goals achieved via Bayesian means).
          *   Item 3 is perfect (Frequentist error control in Bayesian sequential testing).
          *   Item 4: Let's swap Shrinkage for **Meta-Analytic Predictive Priors**. This connects past data (Frequentist literature) to current analysis (Bayesian prior). This directly addresses replication.

  6.  **Developing the "Conditions for Re-ranking":**
