      *Wait, one more check:* The prompt asks for "open questions." I need to phrase these as research questions, not just topics.
      1.  *Question:* Under what conditions do default Bayesian priors yield valid frequentist coverage?
      2.  *Question:* How can we elicit loss functions without paralyzing researchers?
