      *   *Kavka's Toxin Puzzle:* Gregory Kavka (1983). You get a reward for *intending* to drink a toxin tomorrow, but you don't actually have to drink it to get the reward. Can you intend to do something you know you won't do? Kavka says no. Intention requires belief in performance.
      *   *Application to Deterrence:* This is essentially a large-scale, high-stakes Toxin Puzzle. The "reward" is safety (avoiding the attack). The "action" is retaliation.
      *   *Possible Solutions/Workarounds:*
