          *   *Reputation/Commitment:* Bind the future self. Make it so costly *not* to retaliate (politically, morally) that retaliation becomes rational *ex post*.
          *   *Irrationality Strategy:* Pretend to be crazy (Nixon's "Madman Theory"). If the adversary thinks you *might* be irrational, they stay away.
          *   *Conditional Intention:* "I intend to retaliate *if* you attack." Does this bypass the paradox? Some say conditional intentions are still intentions.
