answer: |-
  This is a classic problem in the philosophy of action, often referred to as the **Paradox of Deterrence**. It sits at the intersection of decision theory, moral philosophy, and the metaphysics of agency. To tackle this, I will first brainstorm the conceptual landscape, then move into a rigorous reconstruction of the implicit theory of intention, and finally address the Kavka objection and its implications for the practice itself.

  ### Brainstorming the Angles

  1.  **The Temporal Gap (Ex Ante vs. Ex Post):** The core tension is diachronic. At $T_1$ (peace), threatening retaliation is rational because it prevents war. At $T_2$ (post-attack), retaliating is irrational because the harm is done and retaliation only adds cost. A theory of intention must explain how an agent binds $T_2$ to $T_1$.
  2.  **The Belief Condition:** Standard orthodoxy (Anscombe, Davidson, Kavka) holds that intention entails belief. To intend $X$, I must believe I will do $X$. If I know I am rational, and I know $X$ will be irrational at $T_2$, I cannot believe I will do $X$. Therefore, I cannot intend $X$.
  3.  **The Bluff vs. Commitment:** If the orthodox view holds, all deterrence is bluffing. But bluffs can be called. For deterrence to be stable, it cannot be a known bluff. It requires *credible commitment*.
  4.  **Mechanisms of Binding:** How do we bridge the gap?
      *   *Psychological:* Making oneself irrational (Madman Theory).
      *   *Institutional:* Delegating authority so the decision-maker at $T_2$ isn't the same agent as at $T_1$ (or removing agency entirely via automation).
      *   *Normative:* Changing the utility function so that keeping a promise/threat has intrinsic value (Gauthier's Constrained Maximization).
  5.  **Kavka's Toxin:** Kavka argues you cannot intend to do what you have no reason to do. If the reward is for *intending*, not *doing*, you can't form the intention because forming it requires believing you'll do it, but you won't do it because there's no reason to. Deterrence is structurally identical: The "reward" (safety) comes from the *threat* (intention), not the *retaliation* (action).

  ---

  ### Analysis: The Implicit Theory of Intention in Deterrence

  The practice of nuclear deterrence, to function as more than a high-stakes bluff, presupposes a **Planning Theory of Intention with Diachronic Stability**.

  It relies on the view that intentions are not merely predictions of future action based on current expected utility, but are **partial plans that resist reconsideration**. In this view (championed by philosophers like Michael Bratman), rationality is not just about maximizing utility at every discrete moment (myopic rationality), but about maintaining coherence over time. The practice presupposes that an agent can form a conditional intention ("If attacked, I will retaliate") that remains normatively binding even when the condition obtains and the local utility calculation shifts.

  Crucially, it presupposes that **credibility is a function of agency, not just capability.** Having the missiles (capability) is insufficient; the adversary must believe in the *will* (agency). Therefore, the practice assumes that human agents possess the capacity to voluntarily restrict their own future rationality. It assumes I can make a promise to my future self that my future self cannot break without violating a deeper norm of rationality (consistency) than the norm of utility maximization.

  ### Strict Presuppositions vs. Compatible Claims

  To distinguish what is essential from what is incidental, we must look at what makes the practice *intelligible* versus what just makes it *easier*.

  **Strictly Presupposes:**
  1.  **The Possibility of Conditional Intention:** Agents must be capable of forming genuine intentions contingent on future events, where the content of the intention is an action that is costly to perform.
  2.  **Diachronic Authority:** The agent at $T_1$ must have some normative or causal authority over the agent at $T_2$. If the future self is a completely new agent with no obligation to the past self's plans, the threat dissolves.
  3.  **Transparency of Rationality:** The adversary must believe that the decision-maker's internal reasoning process allows for the execution of the threat. If the adversary knows the decision-maker is a strict act-utilitarian, deterrence fails.

  **Merely Fits With:**
  1.  **Actual Irrationality:** The practice fits well with leaders who are actually irrational, but it doesn't require it. It only requires the *belief* in potential irrationality or binding commitment.
  2.  **Retributive Justice:** The idea that retaliation is "deserved" fits well, providing a moral reason to retaliate *ex post*, but deterrence works even if the leaders are secular consequentialists who don't believe in retribution.
  3.  **Centralized Command:** A single leader fits the model of a unitary agent, but decentralized command (pre-delegation) also works; the theory of intention applies to the *institution* as the agent.

  **Underdetermined Points:**
  1.  **Source of Binding:** The practice does not specify *how* the future self is bound. Is it psychological (cultivating a disposition), institutional (dead-hand systems), or moral (duty to keep threats)? Rival theories of intention (Dispositional vs. Planning vs. Causal) can all ground the practice.
  2.  **Nature of the "Reason":** It is underdetermined whether the agent at $T_2$ retaliates because they still see it as utility-maximizing (due to reputation costs) or because they follow a rule regardless of utility. Both look the same from the outside.
  3.  **Consciousness of the Paradox:** The practice works whether the leaders are aware of the philosophical paradox or not. A leader who naively believes they will retaliate works just as well as a leader who has philosophically resolved the paradox via Gauthierian contractarianism.

  ### The Kavka Kicker: If the Presupposition Fails

  If Kavka is right—that you cannot intend to perform an action you know you will have no reason to perform when the time comes—then **standard intentional deterrence is impossible.** You cannot genuinely intend to push the button if you know that, once your cities are burning, pushing the button serves no purpose. If you know you won't push it, you can't intend to, and if you can't intend to, the threat is a lie.

  **What would have to change?**
  The practice would have to shift from **Intentional Deterrence** to **Causal Deterrence**.
  1.  **Removal of Agency:** You cannot rely on a *decision* to retaliate. You must remove the decision point. This implies automated retaliation systems (Doomsday Machines) where the retaliation is a causal consequence of the attack, not an intentional action.
  2.  **Reputation as Utility:** You would have to alter the payoff structure so that retaliation *is* rational *ex post*. This means the cost of *not* retaliating (loss of future credibility, domestic collapse, moral self-loathing) must objectively outweigh the cost of retaliation. If Kavka is right, you can't just "intend" to ignore the costs; you must actually eliminate them.
  3.  **Salvage via Disposition:** We might salvage it by adopting a **Dispositional Theory of Rationality** (like David Gauthier). We stop asking "What is the rational action now?" and ask "What is the rational disposition to have?" It is rational to cultivate a disposition to retaliate, even if carrying out the specific act is irrational. The practice changes from "I intend to shoot" to "I have made myself the kind of person who shoots."

  However, if Kavka's constraint is absolute (no intention without belief in performance), even dispositions might fail if the agent knows their own disposition will break under pressure. The only true salvage is **pre-commitment technology**: making the retaliation physically inevitable, thereby rendering the theory of intention irrelevant.

