prompt: |-
  I'm drafting a novel centered on a nuclear crisis — think Cuban Missile Crisis but set in the near future — and I've been reading up on brinkmanship. Everywhere I look, people reach for the game of chicken as the analogy: two cars heading at each other, first to swerve is the coward, if neither swerves they both die. It's the mental model my protagonist keeps defaulting to, and I'm worried I'm letting it do too much narrative work.

  Can you walk me through what actually maps onto what? Give me the correspondences — what's the car, what's the road, what counts as swerving — and then tell me where the analogy breaks. I'm especialy interested in the disanalogies that would mess with a character's psychology: things like whether you can see the other driver, whether the stakes are symmetric, whether there's a moment where it's too late to swerve, whether the whole thing is really binary. If the chicken analogy is smuggling in assumptions that don't hold in an actual nuclear standoff, I want to know whether my protagonist's whole way of thinking about the crisis is off, and what a better mental model would be.

  At the end, give me a one-sentence summary of whether the chicken analogy is more helpful or misleading for understanding the psychology of brinkmanship, formatted as \answer{...}.
