  1. Radical Impartiality holds that every unit of welfare counts equally regardless of time or identity, permitting discounts only for risk of non-delivery or diminishing marginal utility; this keeps your verdicts on Stranger Future, Lives, and Money/Poverty but overturns Own Future and Hyperbolic Money, implying future animal welfare counts exactly as much as present.

  2. Uncertainty-Only Discounting argues future benefits are discounted strictly in proportion to the increasing risk that intervention will fail or the beneficiary will not exist; this keeps your verdicts on Stranger Future and Lives but overturns Own Future and Hyperbolic Money, implying you should discount future animals only based on extinction risk or intervention failure.

  3. Behavioral Realism suggests rational choice theory should be revised to accept time-inconsistent preferences as valid reflections of human psychological engagement with the near versus far future; this keeps your verdicts on Own Future and Hyperbolic Money but overturns Stranger Future and Lives, implying it is acceptable to discount future animal welfare more heavily than immediate welfare.

  4. Welfare-Weighted Prioritarianism claims benefits matter more when given to those with lower baseline welfare, making temporal distance irrelevant except where it correlates with wealth changes; this keeps your verdicts on Stranger Future and Money/Poverty but overturns Own Future, Lives, and Hyperbolic Money, implying you should not discount for time unless future animals are expected to be better off.

  5. Moderate Pure Time Preference asserts a small positive discount rate is morally permissible to reflect the natural attenuation of concern over time for all beings, including oneself; this keeps your verdict on Own Future but overturns Stranger Future, Lives, and Hyperbolic Money, implying it is permissible to discount future animal wellbeing slightly simply because it occurs later.
