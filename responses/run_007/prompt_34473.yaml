answer: |-
  Here is a structured argument designed for your grad seminar. It frames the Kelly criterion not as a mathematical subset of Expected Utility (EU), but as a competing *ontological* framework for decision-making under uncertainty.

  ***

  ### Title: The Physics of Choice: Why Ergodicity Trumps Utility

  **Thesis:** The Kelly criterion is not merely Expected Utility Theory (EUT) with a logarithmic utility function. It is a distinct normative framework that grounds rationality in the **temporal dynamics of the environment** rather than the **psychological preferences of the agent**. While EUT can *accommodate* Kelly behavior by stipulating log utility, it cannot *explain* it. The equivalence is mathematical, but the explanation is not. In non-ergodic environments (specifically multiplicative wealth dynamics), maximizing the time-average growth rate is the primitive rational obligation; maximizing ensemble expected utility is a derivative heuristic that fails when the system's dynamics are ignored.

  #### 1. The Ontological Divergence: Ensembles vs. Trajectories
  The fundamental disagreement is not about the math of optimization, but about the ontology of probability.

  *   **The EUT Ontology:** EUT is inherently ahistorical and spatial. It evaluates a gamble by averaging outcomes across an **ensemble of parallel worlds**. It asks: "If a million versions of you played this game once, what is the average payoff?" It assumes that the expectation value of the ensemble is the relevant metric for a single agent acting over time.
  *   **The Kelly Ontology:** Kelly (and ergodicity economics) is inherently historical and temporal. It evaluates a gamble by averaging outcomes along a **single trajectory through time**. It asks: "If you play this game a million times in sequence, what happens to your wealth?"

  In additive dynamics (e.g., gaining/losing fixed dollar amounts), the ensemble average and the time average converge. The system is ergodic. Here, EUT and Kelly align. However, in **multiplicative dynamics** (compounding wealth, investment returns, biological growth), the system is non-ergodic. The ensemble average diverges from the time average.

  **The Normative Claim:** A rational agent lives in *one* timeline, not an ensemble of parallel universes. Therefore, the normative standard for rationality must be the time-average growth rate. To use the ensemble average (EUT) in a non-ergodic context is to optimize for a parallel universe you will never inhabit.

  #### 2. Risk Aversion: Psychological Taste vs. Physical Constraint
  This is where the "distinct framework" claim becomes strongest.

  *   **In EUT:** Risk aversion is subjective. It is a parameter of the agent's utility function ($u''(w) < 0$). If an agent avoids Kelly-optimal bets, EUT says they are simply "more risk-averse." There is no objective fact of the matter about whether they *should* be risk-averse; it is a matter of preference.
  *   **In Kelly:** Risk aversion is objective. It is a constraint imposed by the multiplication operator. If you bet more than the Kelly fraction in a multiplicative game, you do not merely experience "disutility"; you mathematically guarantee ruin (wealth $\to 0$) as $t \to \infty$.

  **The Argument:** EUT treats the "log" in log-utility as a description of the *agent's mind*. Kelly treats the "log" as a description of the *world's dynamics*.
  When you maximize $\mathbb{E}[\ln(W)]$, EUT says you are maximizing a specific psychological preference. Kelly says you are maximizing the geometric mean, which is the only metric that corresponds to actual long-term survival in a compounding environment.
  By framing risk aversion as a preference, EUT obscures the fact that in many economic contexts, risk aversion is a **requirement of physical survival**, not a taste.

  #### 3. Addressing the "Stipulation" Objection
  The standard rebuttal from the EUT camp is: *"So what? EUT is flexible. We can just stipulate $u(w) = \ln(w)$ and we get the same result. Why do we need a new framework?"*

  This objection confuses **curve-fitting** with **explanation**.

  1.  **The Explanatory Gap:** If you use EUT with log utility, you have to ask: *Why* is utility logarithmic? EUT offers no internal answer. It must appeal to external behavioral data ("people act this way") or intuition ("diminishing marginal utility"). It is an ad hoc adjustment to make the model fit the phenomenon.
  2.  **The Derivation:** In the ergodic framework, the logarithmic form is *derived*, not stipulated. It falls out of the properties of multiplicative dynamics.
      *   Wealth evolves as $W_t = W_0 \cdot \prod (1 + r_i)$.
      *   To find the long-term growth rate, you take the time average of the log-return.
      *   The log function appears because it is the inverse of the exponential growth inherent in compounding.
  3.  **The Normative Force:** If I tell a student, "Don't bet more than 20% because your utility function is log," they can reply, "But I feel like I have a linear utility function today."
      If I tell a student, "Don't bet more than 20% because the dynamics of the game ensure that betting 25% drives your wealth to zero with probability 1 over time," the objection is silenced.
      The Kelly framework transforms risk management from a **preference satisfaction problem** into a **constraint satisfaction problem**. This is a profound normative shift. It moves decision theory from the realm of psychology to the realm of physics.

  #### 4. The "Russian Roulette" Test
  Consider a game of Russian Roulette with a payoff of \$1 billion if you survive and death if you don't.
  *   **EUT:** If I assign a finite (but high) disutility to death, there exists some probability of survival where the Expected Utility is positive. A sufficiently risk-seeking agent (or one with linear utility over money and low disutility for death) *should* play.
  *   **Kelly/Ergodic:** This is a multiplicative process where the multiplier on loss is 0 (wealth/life becomes 0). The time-average growth rate is $-\infty$. No amount of upside in parallel universes compensates for absorption in the actual timeline.

  EUT can *model* the refusal to play by tweaking the utility of death. But again, this is post-hoc fitting. The ergodic argument explains *why* the utility of death must be effectively infinite: because the process is non-ergodic and absorbing. The framework itself flags the structural danger of ruin, whereas EUT treats ruin as just another outcome node on the tree.

  #### 5. Conclusion: Why the Distinction Matters for Your Students
  If we teach Kelly as just "EUT with log utility," we teach students that rationality is about **calibrating internal preferences** to match external outcomes.

  If we teach Kelly as **ergodic optimization**, we teach students that rationality is about **aligning decisions with the temporal structure of reality**.

  The mathematical equivalence is superficial. It is like saying Ptolemaic epicycles are "mathematically equivalent" to Keplerian ellipses because both can predict planetary positions. Yes, with enough parameters, EUT can mimic Kelly. But EUT hides the mechanism (non-ergodicity) inside the utility function, treating a structural feature of the world as a psychological feature of the agent.

  For a normative theory of decision-making, **explanation matters**. We should prefer the framework that identifies the *source* of the rational constraint (the dynamics of wealth) over the framework that treats it as a mysterious preference parameter. Kelly isn't a special case of EU; EU is a static approximation of dynamic rationality that breaks down the moment compounding enters the picture.
