  - "what_buddhist_ethics_resists": a paragraph on the feature or features of Buddhist ethics that make it hardest to assimilate to consequentialism
  - "corrected_summary": a one-paragraph restatement that preserves what the original got right while fixing what it got wrong, suitable for someone who wants a better short account
