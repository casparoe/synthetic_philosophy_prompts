  5. **Learned Convention:** Identity is determined by communal convention that updates perceptual filters, meaning a shape becomes an 'a' once the viewer's internal model recalibrates to accept it.
  *Handles:* All context-dependent cases (Logo, Fraktur, Sloppy) by allowing perception to shift over time.
  *Abandons:* The idea that 'a'-ness is intrinsic to the shape.
  *Prediction:* For the experimental typeface, this principle predicts it counts as an 'a' after exposure, proving recognition is a learned contract rather than a static property.
