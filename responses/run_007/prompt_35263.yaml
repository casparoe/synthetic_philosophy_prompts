      *   **Move (3) Simone:** Argues for conditional dependence. Key claim: Symmetry creates conditional dependence (logical correlation). Conditional on C, she C. Conditional on D, she D. EV(C) = R, EV(D) = P.
          *   *Analysis:* This is Evidential Decision Theory (EDT) reasoning applied to logical correlation. It treats the other player's move as *evidence* of one's own move due to shared source code/reasoning.
