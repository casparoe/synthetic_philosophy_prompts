answer: |-
  The dollar auction, devised by Martin Shubik, presents a stark paradox for game theory. The standard analysis, relying on backward induction and common knowledge of rationality (CKR), suggests that no rational agent should place an opening bid. The logic is seductive: if two players bid, they enter a escalation spiral where each bid minimises a certain loss, eventually exceeding the value of the dollar. Anticipating this, rational players should not bid 99p; anticipating that, they should not bid 98p; and so on, unravelling all the way to zero. Consequently, the consensus holds that the unique subgame perfect equilibrium is non-entry.

  However, this consensus rests on a specific interpretation of rationality that prioritises subgame perfection over equilibrium selection in the entry stage. I argue that entering the auction can be instrumentally rational, even under CKR, if one views the auction not merely as a sequential bidding war, but as a **coordination game with a pre-emption dynamic**. The rationality of entry derives from the positive expected value of becoming the sole bidder, conditional on the rational opponents' desire to avoid the mutually destructive spiral.

  ### The Argument from Equilibrium Selection and Pre-emption

  The standard backward induction argument assumes that once an opening bid is placed, the subsequent subgame inevitably leads to escalation. This assumes that the 'escalation' path is the only credible equilibrium in the post-entry subgame. However, rational agents prefer Pareto-superior outcomes. The escalation spiral is a negative-sum game for the bidders (the auctioneer wins, the bidders lose aggregate wealth). A rational opponent, recognising that counter-bidding initiates this spiral, faces a choice: incur a small loss by conceding immediately, or risk a large loss by escalating.

  If I place an opening bid of 1p, I alter the strategic landscape for my opponents. I have not merely placed a bid; I have created a **focal point**. For a rational opponent who knows I am rational, the most logical inference is that I intend to win the dollar for a negligible cost. If they counter-bid, they signal an willingness to engage in the spiral. Since rational agents wish to avoid the spiral (as it destroys value), the rational response to an opening bid is to concede.

  Therefore, the game at the entry stage is not a prisoner's dilemma, but a **game of Chicken** or a **War of Attrition** with a pre-emption element. If all players stay out, the payoff is zero. If one player enters and others stay out, the entrant gains roughly £1.00. If multiple players enter, the spiral ensues, and payoffs become negative.

  In this entry game, "Everyone Stays Out" is **not a Nash Equilibrium**. If I know with certainty that you will not enter, my best response is to enter and claim the 99p profit. Since we both know this, we cannot both rationally commit to staying out. The only symmetric Nash Equilibrium in the entry stage is a **Mixed-Strategy Equilibrium**, where each player enters with a specific probability $p$. In such an equilibrium, the expected value of entering is equal to the expected value of staying out (zero). However, because the payoff for successful pre-emption is positive, the strategy mix must include a non-zero probability of entry. Thus, entering is a rational realisation of a mixed strategy designed to exploit the possibility that others will coordinate on non-entry.

  Furthermore, we can apply **Forward Induction**. An opening bid is a costly signal. By bidding 1p, I demonstrate a willingness to incur the transaction cost of bidding. A rational opponent, analysing this move, may infer that I have a higher resolve or a lower threshold for escalation. To avoid the risk of the spiral, the rational opponent folds. Thus, entry is rational because it leverages the opponents' rationality—their desire to cut losses—against them.

  ### The Vulnerability: The Credibility of the Threat

  The strongest case for entry relies on the belief that opponents will view concession as the focal point in the post-entry subgame. However, this argument possesses a critical vulnerability: **the credibility of the implicit threat to escalate.**

  My argument holds only if my opponents believe that, should they counter-bid, I will persist rather than fold immediately. Yet, under common knowledge of rationality, my opponents know my payoff structure. They know that once the bidding reaches £1.00, I face a choice between losing £1.00 (by stopping) or losing £1.01 (by bidding £1.01). Instrumental rationality dictates I should cut my losses and stop. My opponents, knowing this, know that my threat to escalate beyond the dollar's value is **incredible**.

  This is the essence of the Chainstore Paradox. If my threat to fight (escalate) is not credible because it is not subgame perfect, then a rational opponent should call my bluff. They should counter-bid, knowing I will fold. If they reason this way, and I know they reason this way, then my opening bid invites a counter-bid, leading immediately to the spiral I hoped to avoid.

  Therefore, the entire case for rational entry collapses if the **Equilibrium Selection** in the post-entry subgame is not robust. If the opponents do not coordinate on the 'concession' equilibrium but instead follow the strict backward induction logic of the bidding subgame, the first bidder is guaranteed to be exploited. The argument is most vulnerable to the theoretical move that **subgame perfection trumps focal point reasoning**. If one accepts that rational players must play the subgame perfect equilibrium in *every* subgame (including the post-entry bidding war), then the threat to escalate is null, the pre-emption strategy fails, and the standard consensus (non-entry) is restored.

  ### Conclusion

  To argue that entry is rational is to argue that rationality encompasses more than mechanical backward induction; it includes the strategic management of expectations and equilibrium selection. By entering, a player transforms the game from a guaranteed zero-payoff scenario into a probabilistic opportunity for gain, banking on the opponents' rational aversion to the escalation spiral. However, this position stands or falls on the credibility of the bidder's resolve. If the opponents perceive the bidder as strictly bound by subgame perfection, the bluff is called, and the rational choice reverts to staying out. Thus, while entry can be rationalised through mixed strategies and forward induction, it remains perilously dependent on the assumption that rational agents will prioritise coordination over strict sequential optimality.
