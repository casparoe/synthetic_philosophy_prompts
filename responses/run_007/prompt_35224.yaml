prompt: |-
  I'm in this grad seminar on epistemic game theory and we've been going through Aumann, Binmore, Brandenburger, all the usual suspects. And I keep feeling like the whole notion of "common knowledge of rationality" is doing a ton of work but nobody's actually pinned down what a good theory of it is supposed to accomplish. Like, we talk about whether common knowledge of rationality implies backward induction (or doesn't), whether it gets you to Nash equilibrium (or doesn't), the electronic mail game stuff where a tiny failure of common knowledge unravels everything — but it feels like people are just throwing their favorite formalization at the wall and seeing what sticks. Half the time I can't even tell whether two authors are disagreeing about the phenomenon or just using "common knowledge" to mean different things.

  So before I read yet another paper proposing yet another formalism, I want the spec sheet. What would a theory of common knowledge of rationality actually have to deliver to count as adequate? I mean the full list of desiderata: which cases it has to get right (centipede game? coordinated attack? the email game? the surprise exam paradox?), which distinctions it can't collapse (like the difference between common knowledge and common belief, or between individual rationality and common knowledge of rationality, or between ex ante and interim reasoning), which puzzles it has to dissolve or at least explain, which existing results it has to be consistent with or else explain away convincingly. And for each desideratum, say what the motivating case or consideration is — like, why does this one matter and not just someone's aesthetic preference about formal systems.

  Then the part I really want: tell me which of these desiderata are genuinely non-negotiable and which are just the preferences of one research program (e.g., "must use possible-worlds semantics" vs. "must handle the email game result"). And flag any pairs that you suspect can't be jointly satisfied — if there's a tension between wanting the theory to be robust to small perturbations and wanting it to deliver sharp equilibrium predictions, I want that called out. If some subset of the list is jointly unsatisfiable given something like the electronic mail game result or the Brandenburger-Keisler paradox, that's basically a theorem about the limits of the whole project, and that's the kind of thing I'm here for. Don't bother scoring existing theories against the list unless a particular desideratum is basically designed to rule out a specific approach — the criteria themselves are what I'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar on epistemic game theory (EGT). Familiar with Aumann, Binmore, Brandenburger, etc.
      *   **Problem:** Feels like "common knowledge of rationality" (CKR) is a black box doing heavy lifting without a clear specification of what a *good theory* of it should achieve. Confusion about whether disagreements are substantive or terminological.
      *   **Task:** Create a "spec sheet" (list of desiderata) for an adequate theory of CKR.
      *   **Requirements:**
          *   List specific cases/puzzles it must handle (Centipede, Email Game, Surprise Exam, etc.).
          *   List distinctions it must preserve (Knowledge vs. Belief, Ex Ante vs. Interim, etc.).
          *   Identify non-negotiable vs. research-program-specific desiderata.
          *   Identify tensions/impossibility results (trade-offs between robustness and sharpness, etc.).
          *   *Constraint:* Do not score existing theories (unless a desideratum targets a specific approach). Focus on the criteria themselves.
      *   **Tone:** Sophisticated, academic, precise, acknowledging the depth of the literature (Aumann, Rubinstein, Binmore, etc.).

  2.  **Deconstruct the Core Concept: Common Knowledge of Rationality (CKR)**
      *   What is it? It's the epistemic condition often cited as the foundation of solution concepts (Nash, Correlated, Backward Induction).
      *   What are the main tensions?
          *   Idealization vs. Realism (Logical Omniscience).
          *   Static vs. Dynamic (Belief revision).
          *   Knowledge vs. Belief (Truth condition).
          *   Robustness vs. Precision (Email Game).
          *   Consistency vs. Completeness (Paradoxes).

  3.  **Drafting the Desiderata (The "Spec Sheet"):**

      *   *Category 1: Solution Concept Derivation.* A theory of CKR needs to link epistemic states to strategic behavior.
          *   *Case:* Nash Equilibrium (Aumann/Brandenburger).
          *   *Case:* Backward Induction (Centipede/Rosenthal).
          *   *Requirement:* Must clarify *which* solution concept follows from *which* epistemic assumption.

      *   *Category 2: Epistemic Distinctions.*
          *   Knowledge ($K$) vs. Belief ($B$). Knowledge implies truth; belief doesn't. CKR usually assumes knowledge, but is that realistic?
          *   Common Knowledge ($CK$) vs. Common Belief ($CB$).
          *   Ex Ante (before types) vs. Interim (after types).

      *   *Category 3: Robustness and Continuity.*
          *   *Case:* Rubinstein's Email Game.
          *   *Issue:* Discontinuity. $CK$ gives one result, "Almost $CK$" gives another.
          *   *Requirement:* Must explain the discontinuity or resolve it.

      *   *Category 4: Dynamic Consistency/Belief Revision.*
          *   *Case:* Backward Induction in Centipede.
          *   *Issue:* If I see you deviate, CKR is false. What do I believe now? (Stalnaker vs. Aumann).
          *   *Requirement:* Must handle counterfactuals/off-equilibrium beliefs.

      *   *Category 5: Logical Coherence.*
          *   *Case:* Surprise Exam Paradox / Brandenburger-Keisler.
          *   *Issue:* Self-reference and diagonalization.
          *   *Requirement:* Must avoid logical contradiction in the state space.

  4.  **Categorizing Desiderata: Non-Negotiable vs. Program-Specific:**
      *   *Non-Negotiable:* Internal consistency (no contradictions), clear mapping to behavior (otherwise it's not game theory), distinction between truth and belief (otherwise it's not epistemology).
      *   *Program-Specific:* Possible worlds semantics (some use type spaces, some use logic), assuming Truth axiom ($K\phi \to \phi$) vs. just Belief, requiring Backward Induction (some argue BI is wrong).

  5.  **Identifying Tensions and Impossibility Results:**
      *   *Tension 1: Robustness vs. Prediction.* (Email Game). You can't have continuity *and* the sharp predictions of CKR simultaneously without changing the solution concept.
      *   *Tension 2: Dynamic Consistency vs. CKR.* (Centipede). If CKR holds at the start, deviation is impossible. If deviation happens, CKR is false. You can't maintain CKR *and* explain off-path behavior without a theory of belief revision that drops CKR.
      *   *Tension 3: Logical Omniscience vs. Bounded Rationality.* Standard EGT assumes agents know all logical consequences. This is impossible for real humans.
      *   *The "Theorem":* The Monderer-Samorodskaya result on approximate CK, or Rubinstein's Email Game discontinuity. Also, the Brandenburger-Keisler impossibility of certain belief hierarchies.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the frustration (it's a feature, not a bug).
      *   **Section 1: The Core Functional Desiderata.** (What must it *do*?)
      *   **Section 2: The Epistemic Integrity Desiderata.** (What must it *respect*?)
      *   **Section 3: The Robustness & Dynamics Desiderata.** (How does it *break*?)
      *   **Section 4: Non-Negotiable vs. Contingent.** (The "Hard" vs. "Soft" constraints).
      *   **Section 5: The Incompatibility Theorems.** (Where the project hits the wall).
      *   **Conclusion:** Summary of the state of the field.

  7.  **Drafting Content - Specific Considerations:**
      *   *Self-Correction on "Non-Negotiable":* Is "Truth" non-negotiable for Knowledge? Yes, by definition. But is "Knowledge" non-negotiable for Game Theory? No, many use Belief. I need to be precise: If you call it *Knowledge*, it must satisfy Truth. If you call it *Rationality*, it must constrain choice.
      *   *The Centipede Problem:* This is the big one. Aumann says CKR $\to$ Nash (not necessarily BI). Stalnaker says CKR + Belief Revision $\to$ BI. The theory must pick a lane or explain the divergence.
      *   *Email Game:* This shows CK is not topologically robust. A good theory must acknowledge this fragility, not hide it.
      *   *Brandenburger-Keisler:* "Ann believes that Bob assumes that Ann believes..." leads to paradoxes in certain state spaces. A theory needs a state space rich enough to avoid this or acknowledge the limit.

  8.  **Final Review against User Prompt:**
      *   *Spec sheet format?* Yes.
      *   *Motivating cases included?* Yes (Centipede, Email, Surprise Exam).
      *   *Distinctions preserved?* Yes (K vs B, Ex Ante vs Interim).
      *   *Non-negotiable vs. Preferences?* Yes.
      *   *Tensions/Impossibilities flagged?* Yes.
      *   *No scoring of existing theories?* Checked. (I will mention authors to identify positions, not to score them).

  9.  **Tone Check:** Ensure it sounds like a peer-to-peer academic discussion, not a textbook summary. Use terms like "type spaces," "partitional," "non-partitional," "lexicographic probability systems."

  10. **Final Polish:** (Self-Correction during drafting) Make sure to emphasize that "CKR" isn't one thing. It's a cluster concept. The spec sheet should reflect the need to disambiguate. Ensure the distinction between *justifying* a solution concept and *describing* a cognitive state is clear.

  *(Self-Correction)*: Wait, the user asked for "which cases it has to get right." This is tricky. Does a theory *have* to get Backward Induction right in the Centipede game? Many argue BI is *wrong* there. I should frame this as "Must take a definitive stance on the Centipede paradox," not necessarily "Must yield BI." Similarly for the Email game: "Must account for the discontinuity," not necessarily "Must restore continuity."

  Okay, ready to write.
answer: |-
  This is a sophisticated frustration, and it cuts to the methodological core of epistemic game theory (EGT). You are correctly identifying that "Common Knowledge of Rationality" (CKR) is often treated as a primitive when it is actually a composite of logical, probabilistic, and decision-theoretic assumptions. When authors disagree, they are often shifting the weights on these underlying assumptions without declaring it.

  Below is the spec sheet you asked for. It is organized by functional requirements, epistemic integrity, and dynamic consistency. I have distinguished between **Hard Constraints** (logical or definitional necessities for the theory to count as *epistemic game theory*) and **Soft Constraints** (commitments specific to research programs like the Aumannian orthodox vs. the lexicographic/revisionist schools). Finally, I outline the **Incompatibility Theorems**, which are the actual limits of the project.

  ---

  ### I. Functional Desiderata (What the Theory Must Deliver)

  These criteria concern the mapping between epistemic states and strategic behavior. If a theory cannot connect the epistemic condition to an action profile, it fails as *game theory*.

  **1. Solution Concept Derivation**
  *   **Requirement:** The theory must explicitly derive a specific solution concept (Nash, Correlated Equilibrium, Backward Induction, Rationalizability) from a precise formulation of CKR. It cannot simply assert the link.
  *   **Motivating Case:** *Aumann (1976) vs. Aumann (1987).* In 1976, agreeing to disagree is impossible with common priors; in 1987, subjective priors + CKR $\to$ Correlated Equilibrium. A theory must specify which prior structure is required for which outcome.
  *   **Hard/Soft:** **Hard.** A theory of CKR that does not constrain behavior is just epistemology.

  **2. The Off-Equilibrium Path Account**
  *   **Requirement:** The theory must specify the belief state of a player who observes a move that has probability zero under the assumption of CKR.
  *   **Motivating Case:** *The Centipede Game (Rosenthal).* If CKR holds at the root, the game should end immediately. If Player 1 passes, CKR is falsified. Does Player 2 believe Player 1 is irrational? Or that Player 1 is rational but holds different beliefs? (Stalnaker's problem).
  *   **Hard/Soft:** **Hard.** Without this, the theory cannot handle dynamic games.

  **3. The "Agreeing to Disagree" Constraint**
  *   **Requirement:** The theory must determine whether agents with common priors and common knowledge of posteriors can hold different probability assessments.
  *   **Motivating Case:** *Aumann's Agreement Theorem.* If your formalization allows rational agents with common priors to "agree to disagree," you have violated a fundamental coherence constraint of Bayesian epistemology.
  *   **Hard/Soft:** **Hard** (for Bayesian approaches). If you drop common priors, this constraint dissolves, but you must declare that drop explicitly.

  ---

  ### II. Epistemic Integrity Desiderata (What Distinctions Must Be Preserved)

  These criteria ensure the theory respects the logical structure of knowledge and belief. Collapsing these distinctions is the primary source of the "talking past each other" problem you identified.

  **4. The Truth Axiom Distinction ($K\phi \to \phi$)**
  *   **Requirement:** The theory must distinguish between *Knowledge* (factive) and *Belief* (non-factive). CKR based on Knowledge implies the rationality assumption is actually true. CKR based on Belief allows for mutual delusion.
  *   **Motivating Case:** *Nash Equilibrium.* In NE, players' beliefs about strategies are correct. If you model this as Common *Belief* in Rationality, you might get Rationalizability (Bernheim/Pearce) instead of Nash. Conflating the two obscures why NE requires correctness of beliefs.
  *   **Hard/Soft:** **Hard.** If you use the operator $K$ but drop the Truth axiom, you are doing doxastic logic, not epistemic logic. You must label it accordingly.

  **5. Ex Ante vs. Interim Distinction**
  *   **Requirement:** The theory must distinguish between reasoning before types are drawn (ex ante) and after types are drawn (interim).
  *   **Motivating Case:** *Mechanism Design / Bayesian Games.* CKR at the interim stage (I know I am rational, I know you are rational given your type) yields different constraints than CKR at the ex ante stage (common prior over types).
  *   **Hard/Soft:** **Hard.** Collapsing these leads to errors in implementation theory and auction design.

  **6. Logical Omniscience Management**
  *   **Requirement:** The theory must state its position on whether agents know all logical consequences of their knowledge.
  *   **Motivating Case:** *The Surprise Exam Paradox.* Standard S5 modal logic implies logical omniscience. If agents are logically omniscient, the Surprise Exam paradox creates a contradiction. A theory must either accept omniscience (and explain away the paradox) or adopt a non-standard logic (e.g., awareness structures).
  *   **Hard/Soft:** **Soft.** Orthodox EGT (Aumann) accepts logical omniscience as an idealization. Behavioral EGT rejects it. The theory must declare its choice, not hide it.

  ---

  ### III. Robustness and Dynamics Desiderata (How the Theory Breaks)

  This is where the "spec sheet" gets dangerous. These are the stress tests that reveal the fragility of CKR.

  **7. The Continuity/Robustness Test**
  *   **Requirement:** The theory must account for the topological relationship between Common Knowledge and "Almost" Common Knowledge.
  *   **Motivating Case:** *Rubinstein's Email Game.* CKR yields one equilibrium; Common *p*-Belief (for $p < 1$ arbitrarily close to 1) yields a completely different one. The payoff functions are continuous, but the epistemic state is not.
  *   **Hard/Soft:** **Hard.** A theory cannot simply ignore the Email Game. It must either accept the discontinuity as a feature of rationality or propose a topology (e.g., strategic topology) that restores continuity.

  **8. Belief Revision Consistency**
  *   **Requirement:** If the theory handles dynamic games, it must provide a rule for updating beliefs when CKR is contradicted by observation.
  *   **Motivating Case:** *Backward Induction (BI).* To get BI in the Centipede game, you need more than CKR at the start. You need a condition like "Common Belief in Rationality *at every node*," which requires a belief revision system (e.g., Lexicographic Probability Systems or Conditional Probability Systems) that allows players to maintain belief in rationality even after seeing a seeming deviation.
  *   **Hard/Soft:** **Soft.** This distinguishes the "Aumann" camp (BI does not follow from CKR) from the "Stalnaker/Bicchieri" camp (BI follows from CKR + specific revision rules).

  **9. State Space Completeness**
  *   **Requirement:** The underlying state space must be rich enough to contain all relevant belief hierarchies without generating paradoxes.
  *   **Motivating Case:** *Brandenburger-Keisler (2006) Paradox.* "Ann believes that Bob assumes that Ann believes..." In certain set-theoretic formulations, a complete type space is impossible. The theory must specify if it restricts the language or the set theory to avoid this.
  *   **Hard/Soft:** **Hard.** If your state space cannot accommodate the belief hierarchies your agents are supposed to have, the model is ill-defined.

  ---

  ### IV. Non-Negotiable vs. Research Program Preferences

  Here is the filtration you requested. This separates the "laws of physics" for EGT from "style choices."

  #### Non-Negotiable (Hard Constraints)
  1.  **Internal Consistency:** The model cannot generate logical contradictions (e.g., via Brandenburger-Keisler) within its own defined language.
  2.  **Behavioral Mapping:** There must be a rigorous theorem linking the epistemic condition to a set of strategy profiles.
  3.  **Operator Definition:** If you write $K_i$, you must define whether it satisfies Truth ($K\phi \to \phi$), Positive Introspection ($K\phi \to KK\phi$), and Negative Introspection ($\neg K\phi \to K\neg K\phi$). You cannot swap these properties mid-argument.
  4.  **Common Prior Specification:** You must state whether a common prior exists. You cannot derive Aumann's Agreement Theorem without it, nor can you claim to model heterogeneous expectations with it.

  #### Research Program Preferences (Soft Constraints)
  1.  **Partitional vs. Non-Partitional Information:** Aumann uses partitions (implies Negative Introspection). Others use neighborhood semantics (drops Negative Introspection). This is a choice about how to model "ignorance," not a correctness criterion.
  2.  **Backward Induction Validity:** Whether a theory *should* deliver Backward Induction in the Centipede game is a substantive debate about rationality, not a formal requirement. A theory is adequate if it explains *why* BI holds or *why* it fails, not merely if it produces it.
  3.  **Knowledge vs. Belief:** You can build a complete theory on Common *Belief* in Rationality (CBR) rather than CKR. However, you cannot claim CBR results apply to situations requiring factive knowledge (like NE correctness).
  4.  **Possible Worlds Semantics:** You can use type spaces, syntactic logic, or algebraic probability. The formalism is secondary to the structural properties it encodes.

  ---

  ### V. Incompatibility Theorems (The Limits of the Project)

  This is the critical section. There are combinations of desiderata that are **jointly unsatisfiable**. If a paper claims to satisfy all of them, it is mistaken.

  **1. The Robustness-Precision Tradeoff (The Email Game Theorem)**
  *   **The Tension:** You cannot have a solution concept that is (a) discontinuous at Common Knowledge (like Nash/CKR in coordination games) AND (b) robust to small perturbations in the information structure (like Common *p*-Belief).
  *   **The Limit:** Rubinstein (1989) proves that if you require continuity in the information structure (monitored signals), the unique rationalizable outcome changes drastically from the CKR outcome.
  *   **Implication:** A theory must choose: Either CKR is a fragile idealization that rarely applies in the real world (accept the discontinuity), or the solution concept derived from CKR (e.g., Nash) is not the correct predictor for slightly noisy environments (accept a different solution concept like $p$-dominant equilibrium). **You cannot have both sharp CKR predictions and topological robustness.**

  **2. The Dynamic Consistency vs. CKR Tradeoff (The Centipede Impossibility)**
  *   **The Tension:** You cannot maintain (a) Common Knowledge of Rationality at the start of the game, (b) Standard Bayesian Updating, and (c) Backward Induction play.
  *   **The Limit:** If CKR holds at $t=0$, Player 2 knows Player 1 will not enter the game. If Player 1 enters, Player 2 observes an event of probability zero. Standard Bayesian updating is undefined on probability zero events. To update, you need a non-Bayesian revision rule (e.g., AGM or LPS). But if you use a revision rule that maintains belief in rationality after a deviation, you effectively change the definition of CKR dynamically.
  *   **Implication:** A theory cannot claim "CKR implies Backward Induction" without explicitly adding a **Belief Revision Axiom** that overrides standard Bayesian conditioning. If you stick to standard Bayesian conditioning, CKR is incompatible with reaching the later nodes of the game tree.

  **3. The Completeness vs. Expressibility Tradeoff (Brandenburger-Keisler)**
  *   **The Tension:** You cannot have a (a) Set-Theoretic Type Space that is (b) Complete (contains all possible belief hierarchies) and (c) allows for certain self-referential statements about "assumption."
  *   **The Limit:** Brandenburger and Keisler (2006) show an impossibility result analogous to Russell's Paradox for interactive belief. If the language is rich enough to describe "Ann assumes that Bob assumes...", a complete type space does not exist in standard ZFC set theory.
  *   **Implication:** A theory must either restrict the language (cannot talk about certain higher-order assumptions) or restrict the state space (admit it is not complete). You cannot have a universal state space for all epistemic statements.

  ### Summary for your Seminar

  When you read the next paper, check it against these three incompatibilities.
  1.  **Does it claim robustness?** Check if it handles the Email Game discontinuity or ignores it.
  2.  **Does it claim Backward Induction?** Check if it specifies a belief revision system for zero-probability events. If it uses standard Bayes rule, the proof is likely flawed.
  3.  **Does it claim a universal type space?** Check if it acknowledges the Brandenburger-Keisler limit on self-reference.

  Most "disagreements" in the literature are actually authors prioritizing different sides of these trade-offs. The Aumannian tradition prioritizes **Logical Coherence** (Hard Constraints) over **Robustness**. The Rubinstein/Weinstein tradition prioritizes **Robustness** over **Sharp Prediction**. The Stalnaker tradition prioritizes **Dynamic Consistency** over **Standard Bayesian Updating**.

  An "adequate" theory is not one that solves everything, but one that explicitly states which of these impossibility results it is accepting as the cost of doing business.
