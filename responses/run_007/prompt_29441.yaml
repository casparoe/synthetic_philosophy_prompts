answer: |-
  # The Causal Commitments Inventory

  **Instructions:** For each of the following eight items, select the option that best matches your verdict or your primary reason for that verdict. Do not worry about which theory "owns" the answer; answer based on your intuitions about the cases or your methodological commitments. At the end, consult the Scoring Key to see which metaphysical profile your answers approximate.

  ***

  ### 1. The Assassin (Early Preemption)
  Assassin A shoots Victim. Assassin B was ready to shoot if A had failed, but A's shot killed V before B could act. If A had not shot, B would have, and V would still be dead.
  *   **A.** A is **not** the cause of V's death. Since V would have died anyway, the death does not depend on A's specific shot.
  *   **B.** A **is** the cause. The backup plan is irrelevant; the actual sequence of events from A to V is complete and uninterrupted.
  *   **C.** A **is** the cause, but only because we can describe the situation in terms of variables (e.g., "A shoots") where changing A's value changes the outcome, holding the backup fixed.

  ### 2. The Gardener (Causation by Omission)
  A gardener fails to water a plant, and the plant dies. Had the gardener watered it, it would have lived.
  *   **A.** The gardener's failure **is** a cause. The counterfactual dependence is sufficient for causation, regardless of physical activity.
  *   **B.** The gardener's failure **is** a cause, but only in a loose or derivative sense; it lacks the "oomph" or physical connection of positive causation.
  *   **C.** The gardener's failure is **not** a cause. Nothing was transferred or propagated from the gardener to the plant; the plant died due to natural processes, not the gardener's absence.

  ### 3. The Bomb (Double Prevention)
  An enemy interceptor tries to shoot down a bomber. A defender shoots down the interceptor. The bomber drops its payload, destroying the target.
  *   **A.** The defender **caused** the destruction. By preventing the prevention, the defender ensured the effect occurred; the chain of counterfactual dependence holds.
  *   **B.** The defender **did not cause** the destruction. The defender stopped a threat but did not generate or transmit any physical quantity to the target.
  *   **C.** The defender **caused** the destruction, provided we model the scenario as a system of variables where the defender's action is an invariant intervention on the target's survival.

  ### 4. The Pigeon (Proportionality)
  A pigeon is trained to peck at all red objects. It is presented with a scarlet target and pecks.
  *   **A.** The **scarlet** color caused the peck. Causation relates specific, actual events, and the target was specifically scarlet.
  *   **B.** The **red** property caused the peck. The cause must be proportional to the effect; citing scarlet is too specific and implies the pigeon wouldn't have pecked at a crimson target.
  *   **C.** Both are acceptable, depending on whether we are asking about the physical trigger (scarlet) or the explanatory condition (red).

  ### 5. The Black Box (Irreducible Notions)
  To explain what causation *is*, are we permitted to use notions like "manipulation," "intervention," or "agency" in our analysis?
  *   **A.** **No.** Causation is a feature of the world independent of agents. Analysis must be reductive (e.g., to patterns of events or physical processes).
  *   **B.** **Yes.** Causal concepts are inherently tied to how we investigate the world. We cannot analyze "cause" without referencing what happens under an intervention.
  *   **C.** **No,** but we can use them as epistemic tests. They help us find causes, but they do not constitute what causation is.

  ### 6. The Two Rocks (Symmetric Overdetermination)
  Two rocks strike a window simultaneously. Either rock alone would have shattered the window. The window shatters.
  *   **A.** **Both** rocks are causes. Each rock participated in a sufficient condition for the effect.
  *   **B.** **Neither** rock is a cause. The effect does not counterfactually depend on either specific rock (if one were removed, the other would still have caused it).
  *   **C.** **Both** are causes, but the causal relation is degenerate or "quasi"-causal because the dependence relation fails.

  ### 7. The Radioactive Atom (Indeterminism)
  A radioactive atom decays at *t*, triggering a Geiger counter. The decay was genuinely indeterministic; prior conditions only raised the probability of decay.
  *   **A.** The prior conditions **caused** the decay. They raised the objective chance of the event sufficiently.
  *   **B.** The prior conditions **did not cause** the decay. Causation requires determination or a continuous physical process, not just probability raising.
  *   **C.** The prior conditions **caused** the decay, but the causal claim is inherently contrastive or context-dependent.

  ### 8. The Chain (Transitivity)
  A causes B, and B causes C. In a case where A is a distant double-preventer of C (like the Defender/Bomb case), does A cause C?
  *   **A.** **Yes.** Causation is transitive. If the chain of dependence or intervention holds, the distant event is a cause.
  *   **B.** **No.** Causation is not transitive. At some point, the connection becomes too attenuated or lacks a direct physical link.
  *   **C.** **It depends.** Transitivity holds for some causal relations (e.g., process) but not others (e.g., dependence).

  ***

  # Scoring Key & Theoretical Profiles

  This key maps your answer pattern to one of four primary "leaves" (theoretical commitments). Because graduate-level positions are often hybrid or nuanced, look for the **dominant cluster** of your answers rather than a perfect match.

  ### 1. The Lewis-Style Counterfactual Theorist
  *   **Signature Answers:** 1B, 2A, 3A, 4A, 5A, 6C (or 6A), 7A, 8A.
  *   **Core Commitment:** Causation is fundamentally about counterfactual dependence between events (possibly refined by "influence" or "quasi-dependence"). You prioritize folk intuitions about cases and seek a reductive analysis compatible with Humean Supervenience.
  *   **The Awkward Case:** **Proportionality (Q4).** Your view struggles to explain why "Red" is a better cause than "Scarlet" without appealing to pragmatic conversational norms, since the specific event *was* scarlet.
  *   **Convergence Warning:** You will agree with the **Interventionist** on Preemption (Q1) and Omissions (Q2). You are only distinguished by your insistence on reductivity (Q5) and your treatment of events as fragile particulars (Q4).

  ### 2. The Woodward-Style Interventionist
  *   **Signature Answers:** 1C, 2A, 3C, 4B, 5B, 6A, 7A (or 7C), 8A.
  *   **Core Commitment:** Causal claims are about invariant relationships between variables under interventions. You prioritize scientific practice and explanatory utility over metaphysical reductivity.
  *   **The Awkward Case:** **Causation by Omission (Q2).** While you accept omissions as causal variables, you often face pressure to explain why some omissions count as causes and others don't without smuggling in normative judgments about "expected" interventions.
  *   **Convergence Warning:** You will agree with **Lewis** on Double Prevention (Q3) and Preemption (Q1). You are distinguished by your acceptance of irreducible interventionist notions (Q5) and your demand for proportionality in variables (Q4).

  ### 3. The Mackie-Style Regularity / INUS Theorist
  *   **Signature Answers:** 1B, 2B (or 2A with hesitation), 3B, 4C, 5A (or 5C), 6A, 7B, 8B.
  *   **Core Commitment:** Causation is a matter of regularities and INUS conditions (Insufficient but Necessary parts of Unnecessary but Sufficient conditions). You are skeptical of "dependence" as the primary metric and focus on sufficiency within a causal field.
  *   **The Awkward Case:** **Early Preemption (Q1).** Handling preemption requires complex descriptions of the "causal field" to rule out the backup cause, which can feel ad hoc compared to the Counterfactual or Interventionist handling of the same case.
  *   **Convergence Warning:** You may be indistinguishable from **Lewis** on many verdicts (Q1, Q6) but differ on the *analysis* (Regularity vs. Counterfactual). You are hard to separate from a **Probabilistic** view (Q7) if you allow probabilistic regularities.

  ### 4. The Salmon–Dowe Process Theorist
  *   **Signature Answers:** 1B (for process reasons), 2C, 3B, 4A, 5A, 6A, 7B, 8B.
  *   **Core Commitment:** Causation requires the transmission of a conserved quantity (energy, momentum) via a continuous physical process. You reject "magical" action at a distance or causation via absence.
  *   **The Awkward Case:** **Causation by Omission (Q2).** You must deny that omissions are genuine causes, which conflicts with standard scientific and legal discourse where failures to act are routinely cited as causes.
  *   **Convergence Warning:** You will agree with **Mackie** on Double Prevention (Q3 - often rejected) and Transitivity (Q8 - often rejected). You are distinguished by your strict physicalism regarding the causal relation itself.

  ### 5. The Probabilistic Theorist (Optional Leaf)
  *   **Signature Answers:** Distinctive commitment to **Q7A** combined with **Q1B** and **Q6A**.
  *   **Status:** **Unexplored/Forced.** This quiz does not contain enough items to reliably separate a pure Probabilistic theory from a Regularity view (Mackie) or a Counterfactual view (Lewis's later work). If you scored heavily for Q7A but fit no other profile, you likely hold a probabilistic view, but be aware that on the other questions, you likely collapse into Lewis or Mackie.

  ***

  ### Indistinguishable Pairs & Empty Cells

  *   **Lewis vs. Woodward on Preemption:** The quiz cannot reliably separate Lewis's "Influence" account from Woodward's "Intervention" account on Question 1. Both yield the verdict "Cause." Separation relies entirely on Question 5 (Reductivity) and Question 4 (Proportionality).
  *   **Mackie vs. Lewis on Overdetermination:** Both typically accept both rocks as causes (Q6). Separation relies on the *reason* given (Regularity vs. Quasi-Dependence), which is hard to capture in first-order verdicts.
  *   **Empty Cell: Process + Omission.** There is no natural leaf for a theorist who answers "Yes" to Process/Physical Transfer (Q2, Q3) but also "Yes" to Omissions. This combination is generally **incoherent** within the Salmon-Dowe tradition, as omissions by definition lack physical processes.
  *   **Empty Cell: Intervention + Reductive.** There is no leaf for a theorist who answers "Yes" to using irreducible interventions (Q5B) but insists on a fully reductive Humean analysis (Q5A). This is **incoherent** by definition; Woodwardian interventionism is explicitly non-reductive.
  *   **Unattractive Cell: Regularity + No Overdetermination.** A theorist who holds a Regularity view (Mackie) but denies causation in Overdetermination cases (Q6B) occupies an **unattractive** position, as Regularity theories are typically motivated by the ability to handle multiple sufficient conditions better than strict Dependence theories.
