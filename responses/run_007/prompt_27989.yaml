answer: |-
  Here is a specification of desiderata for a theory of responsibility attribution regarding autonomous systems (AS), designed to filter out partial solutions that collapse under conceptual pressure.

  ### I. Desiderata for an Adequate Theory

  #### 1. The Ontological/Epistemic Distinction Constraint
  **Requirement:** The theory must explicitly classify the responsibility gap as either *epistemic* (a responsible agent exists but is currently unidentifiable due to complexity/opacity) or *metaphysical* (no appropriate agent exists to bear the responsibility). It cannot treat these as interchangeable.
  **Motivating Pressure:** Consider a deep-learning medical diagnostic tool that denies coverage based on a weight configuration no human can interpret. If the gap is epistemic, investment in explainability (XAI) solves the problem. If the gap is metaphysical (because the decision emerged from non-linear interactions no human could principle-guide), XAI is a category error. Conflating the two leads to solutions that promise "transparency" when the actual problem is "agency." A theory that solves only the epistemic gap fails when the system is genuinely opaque by design.

  #### 2. The Functional Duality Constraint
  **Requirement:** The theory must specify whether it addresses *backward-looking responsibility* (blame, punishment, reactive attitudes like resentment) or *forward-looking responsibility* (liability, compensation, duty to repair), and justify if/why they can be decoupled. It cannot assume that solving compensation solves accountability.
  **Motivating Pressure:** A strict liability regime (e.g., mandatory insurance for self-driving cars) ensures victims are compensated (Forward) without establishing who was at fault (Backward). This satisfies the victim's financial need but leaves their moral demand for an apology or acknowledgment of wrong unmet. A theory that claims to "solve the responsibility gap" merely by ensuring payment has ignored the retributive or communicative function of responsibility. If a theory satisfies Forward but fails Backward, it must argue why moral blame is dispensable in this context.

  #### 3. The Control-Traceability Constraint
  **Requirement:** The theory must define the necessary link between a human agent's prior voluntary action (design, deployment, policy) and the system's specific harmful output. It must establish a principled stopping point that prevents "control" from becoming vacuous (e.g., "they pressed the on switch") while acknowledging that detailed prediction of learning systems is impossible.
  **Motivating Pressure:** In traditional moral theory, responsibility requires control over the specific action. In AS, designers control the *architecture* and *training data*, but not the specific *decision boundary* formed during deployment. If we claim designers control the output because they built the system, control becomes indistinguishable from causation (the "flicker of freedom" problem). If we claim they lack control because they couldn't predict the specific error, no one is ever responsible for AS harm. A theory must navigate between these poles without redefining "control" so loosely that it applies to random natural events.

  #### 4. The Moral Remainder Constraint
  **Requirement:** If the theory concludes that a genuine metaphysical gap exists (no human or artificial agent is responsible), it must account for the "moral remainder"—specifically, the victim's standing to demand accountability and the societal need to condemn the wrong. It cannot simply declare the gap "acceptable" without explaining how the normative force of the harm is discharged.
  **Motivating Pressure:** If a fully autonomous weapon commits a war crime and the theory states "no one is responsible," the victim is left with a normative injury that has no addressee. Resentment becomes irrational if there is no target. A theory accepting gaps must explain how society preserves the norm ("this should not have happened") without a responsible violator. If it cannot, the theory undermines the normative framework it seeks to protect.

  #### 5. The Non-Dissolution Constraint
  **Requirement:** The theory must distinguish between *distributed responsibility* (shared among a collective where the collective bears the burden) and *responsibility dissolution* (the "problem of many hands" where diffusion results in no one bearing the burden). It must specify the mechanism by which individual contributions aggregate to a liable whole.
  **Motivating Pressure:** In complex supply chains (chip maker -> algorithm developer -> integrator -> deployer -> user), assigning 1% responsibility to ten parties often functionally equals 0% responsibility for each. If the theory relies on distributed responsibility, it must explain how the collective is held to account in a way that isn't just a sum of negligible individual negligences. Without this, "distributed responsibility" is a euphemism for "no responsibility."

  #### 6. The Granularity Constraint
  **Requirement:** The theory must differentiate attribution based on the system's level of autonomy and opacity. It cannot apply a single model of responsibility to a deterministic decision-support tool and a stochastic, fully autonomous agent.
  **Motivating Pressure:** Holding a user responsible for a "smart" cruise control (advisory) is distinct from holding them responsible for a Level 5 robotaxi (fully autonomous). In the former, the human is the primary agent; in the latter, the human is a passenger. A monolithic theory fails because the *locus of control* shifts with the system's architecture. If the theory treats all AS as a single category, it will misattribute responsibility in boundary cases (e.g., automation complacency).

  ---

  ### II. Incompatible Pairs (The Tension Map)

  The following pairs of desiderata generate the hardest theoretical friction. Satisfying one often forces a violation of the other in high-autonomy contexts.

  **1. The Control-Traceability Constraint (D3) vs. The Moral Remainder Constraint (D4)**
  *   **The Tension:** To satisfy **D3** (robust control), we must admit that designers do not control specific outputs of learning systems. This leads to a metaphysical gap. However, this violates **D4**, because victims are left without a responsible party to hold accountable.
  *   **The Conflict:** You cannot maintain a strict control condition *and* guarantee a human target for moral blame in cases of genuine machine autonomy. If you relax control to save the human target (violating D3), you undermine the basis of desert. If you keep strict control (satisfying D3), you create a gap that violates the victim's moral standing (D4).

  **2. The Functional Duality Constraint (D2) vs. The Non-Dissolution Constraint (D5)**
  *   **The Tension:** Forward-looking responsibility (compensation) can be easily distributed across a chain of actors (insurers, corporations, state funds) without dissolution. Backward-looking responsibility (blame) resists distribution; blame tends to stick to specific intentional agents.
  *   **The Conflict:** A theory that solves the Forward problem via distributed liability (e.g., industry-wide insurance pools) often fails the Backward problem because the "collective" cannot feel shame or be punished in a way that satisfies reactive attitudes. Satisfying the financial need (D2-Forward) via diffusion often ensures the moral need (D2-Backward) is dissolved (violating D5).

  **3. The Granularity Constraint (D6) vs. The Ontological/Epistemic Distinction (D1)**
  *   **The Tension:** As systems become more opaque (stochastic/black box), the gap shifts from Epistemic (we could find out but it's hard) to Metaphysical (the information does not exist in a human-readable form).
  *   **The Conflict:** A theory that works for transparent systems (treating gaps as Epistemic) will fail for opaque systems (where gaps are Metaphysical). Most current proposals assume the gap is Epistemic (solve with better logging). If the gap is Metaphysical (inherent to the learning process), those proposals are categorially wrong. A single theory rarely handles both without equivocation.

  ---

  ### III. Scorecard of Response Families

  | Response Family | Ontological/Epistemic (D1) | Functional Duality (D2) | Control-Traceability (D3) | Moral Remainder (D4) | Non-Dissolution (D5) | Granularity (D6) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Liability (Deployer pays)** | Treats as Epistemic (irrelevant who caused it). | **Passes Forward** (Compensation). **Fails Backward** (No blame assigned). | **Fails.** Decouples liability from control entirely. | **Fails.** Victim paid, but no moral acknowledgment of wrong. | **Passes.** Liability is clear (the owner/deployer). | **Fails.** Applies same liability regardless of autonomy level. |
  | **Distributed Moral Responsibility** | Treats as Epistemic (we just need to trace the chain). | **Mixed.** Attempts both, often collapses to Forward. | **Weak Pass.** Stretches control to "causal contribution." | **Weak Pass.** Collective blame is psychologically thin. | **Fails.** High risk of dissolution (Many Hands). | **Passes.** Can account for different roles in the chain. |
  | **Artificial Moral Agency (AMA)** | Treats as Metaphysical (fills gap with machine). | **Fails.** Machines cannot pay or feel blame. | **Passes.** Assigns control to the agent that acted. | **Fails.** Victims cannot hold resentment toward a tool. | **N/A.** Responsibility is localized to the AS. | **Fails.** Binary (either agent or not); ignores degrees. |
  | **Revisionist (Accept the Gap)** | **Passes.** Admits Metaphysical gap. | **Fails Backward.** Abandons blame. **Passes Forward** (via state/insurance). | **Passes.** Acknowledges control is missing. | **Fails.** Leaves moral remainders unaddressed. | **N/A.** No one is responsible. | **Passes.** Acknowledges high-autonomy systems differ. |

  ### IV. The Single Eliminative Desideratum

  **The Control-Traceability Constraint (D3)**

  This is the single desideratum that does the most eliminative work.

  **Reasoning:**
  Almost every traditional theory of moral responsibility rests on the principle that *ought implies can* and that blameworthiness requires a specific kind of control over the outcome.
  1.  **It eliminates Strict Liability** as a *moral* solution (though it survives as a legal one), because Strict Liability explicitly severs the link between control and liability.
  2.  **It eliminates Artificial Moral Agency** as a satisfactory solution for *human* practices, because even if the machine has "control," it cannot satisfy the human reactive attitudes that control is meant to ground.
  3.  **It eliminates Distributed Responsibility** in hard cases, because as autonomy increases, the traceability of specific control to specific humans diminishes to the point of dissolution.
  4.  **It forces Revisionist views** into a corner: to satisfy D3, they must admit that backward-looking responsibility is impossible in high-autonomy cases, which forces them to fail the Moral Remainder Constraint (D4).

  If you insist on **D3** without revision, you conclude that responsibility gaps are real and unavoidable in high-autonomy systems. If you deny **D3**, you are no longer talking about *moral responsibility* in the traditional sense, but rather a utilitarian scheme of risk allocation. Therefore, D3 is the filter that separates theories of *responsibility* from theories of *risk management*.
