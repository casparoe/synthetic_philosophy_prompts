prompt: |-
  I have been collecting my own verdicts on a set of exchanges, and I want to know whether one principle lies behind them, or whether some of my verdicts have to go.

  Here are the cases as concretely as I can state them.

  1. A healthy adult sells one kidney to a stranger through a regulated exchange. The price is $45,000, paid into an account that can be drawn down over several years. There is a six-month cooling-off period, independent medical and psychological screening, and a guarantee of lifelong follow-up care for the seller. Verdict: permissible, though I am not entirely comfortable with it.

  2. In the two days before a hurricane is expected to make landfall, a hardware store raises the price of its portable generators from $500 to $2,000. Verdict: not permissible.

  3. A citizen accepts $50 from a campaign organization in exchange for a promise to vote for a particular candidate. Verdict: not permissible.

  4. A plasma collection center pays donors $40 per donation, and many working-class donors give plasma twice a week. Verdict: permissible.

  5. A woman carries a pregnancy to term for intended parents she did not know beforehand, in exchange for $30,000 above her medical and legal expenses, under a contract that gives her final authority over medical decisions during the pregnancy. Verdict: permissible, with some unease.

  6. A person pays a line-standing company to have someone wait in line overnight at a passport office and then hand over the place when they arrive. Verdict: permissible, though I dislike the inequality it creates.

  7. A patient near the front of a hospital emergency department queue accepts $500 from a wealthier patient to swap places, even though the wealthier patient's condition is less urgent. Verdict: not permissible.

  The tentative principle I keep reaching for is something like this: it is wrong to let willingness to pay determine who gets something that a person needs in order to survive, or that is supposed to be allocated by need or by equal civic standing rather than by price. That principle fits cases 2, 3, and 7, and it fits my unease about 6. But it seems to condemn case 1 as well, since a kidney is exactly the sort of good whose allocation I would not want left to price in an unregulated way, yet I still think the regulated sale is permissible. And it does not explain why 4 and 5 are permissible even though both involve payment for the use of the body by people who are mostly poorer than the buyers.

  Is there a principle, or a small set of candidates, that captures all or nearly all of these verdicts? If so, state it precisely and say what it predicts about a case I have not listed: a municipality that auctions off the right to skip the queue for a publicly funded childcare place. If no single principle captures them, which of my verdicts should I overturn, and which should I keep? I am less interested in labels like commodification or repugnant markets than in knowing exactly which feature of each exchange is doing the moral work.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Input:** Seven specific cases with the user's moral verdicts (Permissible/Not Permissible, with nuances).
      *   **Goal:** Determine if a single principle (or small set) explains all verdicts. If yes, state it precisely and apply it to a new case (childcare queue auction). If no, identify which verdicts need to change to fit a coherent principle.
      *   **Constraint:** Avoid vague labels like "commodification" or "repugnant markets." Focus on the specific *features* doing the moral work.
      *   **User's Tentative Principle:** "Wrong to let willingness to pay determine who gets something needed to survive, or allocated by need/equal civic standing."
      *   **User's Problem with Tentative Principle:** It seems to condemn Case 1 (kidney sale) and doesn't fully explain Cases 4 (plasma) and 5 (surrogacy).

  2.  **Analyze the Cases & Verdicts:**

      *   **Case 1 (Kidney Sale):** *Permissible (with unease).*
          *   Feature: Body part, life-saving/health-critical for recipient, financial incentive for seller.
          *   Safeguards: Regulated, cooling-off, screening, lifelong care, structured payment.
          *   Key Distinction: The *seller* is choosing to undergo risk for money. The *allocation* of the kidney isn't necessarily to the highest bidder (the prompt says "sells... to a stranger through a regulated exchange," implying the exchange matches, likely based on medical compatibility, not just price). The price is for the *sacrifice*, not the *priority*.

      *   **Case 2 (Generators during Hurricane):** *Not Permissible.*
          *   Feature: Essential good during emergency.
          *   Mechanism: Price gouging.
          *   Impact: Excludes poor from survival needs during crisis. Allocation is purely by price.

      *   **Case 3 (Vote Selling):** *Not Permissible.*
          *   Feature: Civic duty/right.
          *   Mechanism: Direct exchange of vote for cash.
          *   Impact: Undermines equal civic standing. Allocation of political power becomes wealth-based.

      *   **Case 4 (Plasma Donation):** *Permissible.*
          *   Feature: Body fluid/tissue.
          *   Mechanism: Payment for supply.
          *   Impact: Donors are often poor.
          *   Key Distinction: Regenerative (unlike kidney). Low risk. The payment is an incentive to *increase supply*, not to buy *priority access* to a scarce public good.

      *   **Case 5 (Surrogacy):** *Permissible (with unease).*
          *   Feature: Reproductive labor/body use.
          *   Mechanism: Payment for service.
          *   Safeguards: Contract, medical authority remains with surrogate.
          *   Key Distinction: Service/labor model. The payment is for the *gestation*, not buying a baby as a commodity (legally/ethically framed). Autonomy is preserved (final authority on medical decisions).

      *   **Case 6 (Line Standing):** *Permissible (dislike inequality).*
          *   Feature: Time/Queue for public service.
          *   Mechanism: Outsourcing the wait.
          *   Impact: Wealth buys time savings.
          *   Key Distinction: The *outcome* (getting the passport) isn't scarce in the same way. Everyone who waits gets one. It's a convenience market, not an exclusion market.

      *   **Case 7 (ER Queue Swapping):** *Not Permissible.*
          *   Feature: Emergency medical care.
          *   Mechanism: Private swap for cash.
          *   Impact: Wealth buys priority over medical need.
          *   Key Distinction: Triage is supposed to be by *urgency*. Money subverts the allocation principle of the queue.

  3.  **Synthesize a Unifying Principle:**

      *   *Observation 1 (Supply vs. Allocation):* Cases 1, 4, and 5 involve paying someone to *provide* a good/service (kidney, plasma, gestation). The payment incentivizes supply. Cases 2, 3, 6, and 7 involve paying to *get* a good/service sooner or exclusively (generators, votes, passport, ER care).
      *   *Observation 2 (Allocation Criteria):* In Cases 2, 3, and 7, money displaces the *correct* allocation criterion (need during crisis, equal citizenship, medical urgency). In Case 6, the criterion is arguably "first come, first served," but since the service isn't scarce (everyone gets a passport eventually), buying time doesn't deny someone else the service, just delays them slightly (though the user notes unease).
      *   *Observation 3 (Risk & Autonomy):* In Cases 1, 4, and 5, the seller retains significant autonomy or is protected (cooling off, medical authority, regenerative nature).
      *   *Observation 4 (The "Queue" Distinction):* Case 6 (Passport) is permissible, Case 7 (ER) is not. Why? ER is scarce and urgent (life/death). Passport is bureaucratic and non-urgent.
      *   *Observation 5 (The "Kidney" Distinction):* Case 1 is permissible. Why? The prompt specifies a "regulated exchange." Crucially, in most ethical models of kidney markets, the *recipient* does not pay the seller directly to jump the queue. The system pays the seller to increase the *pool*, and organs are allocated by medical need/compatibility. If Case 1 were "Rich Patient pays Poor Seller $45k to get *their* kidney specifically," it would look more like Case 7. The prompt says "sells... through a regulated exchange." This implies the money buys *supply*, not *priority*.

      *   *Draft Principle:* It is permissible to pay for the **supply** of a good or service (even involving the body), provided safeguards protect the supplier's autonomy and welfare. It is *not* permissible to pay for **priority access** to a scarce good or service that is morally required to be allocated by need, urgency, or equal civic standing.

      *   *Refining the Principle:* Let's call it the **Supply vs. Priority Principle**.
          *   **Rule A (Supply):** Paying to *induce someone to provide* a good/service is generally permissible if the provider is protected (informed consent, safety, autonomy). This covers Kidneys (1), Plasma (4), Surrogacy (5).
          *   **Rule B (Priority):** Paying to *jump a queue* or *exclude others* from a good allocated by need/citizenship is impermissible. This covers Generators (2), Votes (3), ER Care (7).
          *   **Rule C (The Exception/Nuance):** Paying for convenience in a non-scarce queue (Passport - 6) is permissible because it doesn't deny the good to others, only saves time. (This fits the user's verdict).

      *   *Wait, does this fit Case 1 perfectly?* In Case 1, the seller gets $45k. Is that buying the kidney or the sacrifice? If the exchange allocates the kidney based on need, then the money is for the *sacrifice* (Supply). If the money allows a rich person to get a kidney faster, it violates Rule B. The prompt says "regulated exchange," implying allocation isn't purely market-based. I will assume the user's verdict relies on the idea that the money increases the *pool*, not that it allows a specific rich buyer to outbid a poor buyer for *that specific kidney*.
      *   *Wait, does this fit Case 6?* Line standing. You pay someone to wait. You get the passport sooner. Does this deny someone else? Yes, you move ahead of them. But the user says "Permissible." Why? Because a passport isn't a "need to survive" or "equal civic standing" in the same way as a vote or ER care. It's a bureaucratic service. The "harm" is minor inconvenience to others.
      *   *Wait, does this fit Case 2?* Price gouging. This is paying for *access* during scarcity. Impermissible. Fits Rule B.

      *   *Revised Principle:* **The Allocation Integrity Principle.**
          Transactions are impermissible when they allow wealth to override the moral basis of allocation for **scarce, essential goods** or **civic rights**. Transactions are permissible when they compensate for **labor/sacrifice** to increase supply, or when they purchase **convenience** in non-essential, non-scarce contexts.

      *   *Let's try to make it tighter.*
          The core tension is between **Market as Supplier** vs. **Market as Allocator**.
          *   When the market acts as a *supplier* (incentivizing production/provision), it is often permissible (1, 4, 5).
          *   When the market acts as an *allocator* (determining who gets the scarce/essential thing), it is often impermissible (2, 3, 7).
          *   Case 6 is the edge case. It's an allocator (queue), but the good isn't essential/scarce in a moral sense.

      *   *Proposed Principle:* **The Separation of Compensation and Allocation.**
          It is permissible to compensate individuals for the burdens they undertake to provide goods or services (including bodily services), provided their autonomy and welfare are protected. However, it is impermissible to allow wealth to determine the *distribution* of goods or services that are morally required to be allocated according to need, urgency, or equal civic standing.

      *   *Testing against cases:*
          1.  Kidney: Compensation for burden (Supply). Allocation (who gets the kidney) is presumably still by need/compatibility in a "regulated exchange." -> **Permissible.**
          2.  Generators: Wealth determines distribution of essential good during crisis. -> **Impermissible.**
          3.  Votes: Wealth determines distribution of civic power. -> **Impermissible.**
          4.  Plasma: Compensation for burden (Supply). -> **Permissible.**
          5.  Surrogacy: Compensation for labor/burden (Supply). Autonomy protected. -> **Permissible.**
          6.  Line Standing: Wealth determines distribution of *time*, not the good itself (passports aren't scarce in a moral sense). -> **Permissible** (fits the "convenience" exception).
          7.  ER Queue: Wealth determines distribution of urgent care (should be by need). -> **Impermissible.**

      *   *This looks very strong.* It resolves the user's confusion about Case 1. The user was worried Case 1 condemns price allocation. But in a regulated exchange, the price doesn't allocate the kidney to the highest bidder; it incentivizes the donor. The allocation remains medical.

  4.  **Addressing the New Case (Childcare Queue Auction):**
      *   **Context:** Publicly funded childcare.
      *   **Nature of Good:** Essential for working parents (economic survival/participation), but also a public resource meant to support equality of opportunity.
      *   **Allocation Principle:** Usually need-based (income, single parent) or lottery/time-based (fairness).
      *   **Application of Principle:** Auctioning the right to skip the queue allows wealth to determine access to a publicly funded essential service. This undermines the "publicly funded" aspect (which implies equal standing/need-based access).
      *   **Prediction:** **Not Permissible.** It violates the rule against wealth determining allocation of essential public goods.

  5.  **Addressing the "If no single principle..." option:**
      *   I believe a single principle *can* capture these, but it requires clarifying the distinction in Case 1 (Supply vs. Allocation). If the user *meant* Case 1 allows a rich buyer to pick the kidney, then Case 1 conflicts with Case 7. But the text says "regulated exchange," which usually implies a pool. I will proceed assuming the principle holds, but I will explicitly highlight the conditionality of Case 1.
      *   Actually, looking closer at Case 1: "A healthy adult sells one kidney to a stranger... price is $45,000." It doesn't explicitly say the *recipient* is chosen by need. However, "regulated exchange" usually implies a matching system (like UNOS but with compensation). If it were a direct sale to the highest bidder, it would be morally analogous to Case 7 (ER Queue) or Case 2 (Generators).
      *   *Self-Correction:* To make the principle robust, I need to ensure the distinction in Case 1 is clear. The payment is for the *donor's sacrifice*, not the *recipient's priority*.
      *   *Wait, one nuance:* In Case 6 (Line Standing), the user admits "dislike the inequality." My principle explains why it's permissible (non-essential good) but acknowledges the unease (inequality).
      *   *Wait, another nuance:* Case 4 (Plasma). Is plasma scarce? Yes. But payment increases supply. It doesn't mean rich people get plasma and poor people don't. It means more plasma exists for everyone. This fits the "Supply" side of the principle.

  6.  **Drafting the Response:**
      *   **State the Principle:** The **Compensation vs. Allocation Principle**.
      *   **Define it:** Distinguish between paying to *produce/provide* a good (Compensation) and paying to *secure access* to a scarce/essential good (Allocation).
      *   **Map the Cases:** Show how 1, 4, 5 are Compensation (Permissible). Show how 2, 3, 7 are Allocation violations (Impermissible). Show how 6 is Allocation but non-essential (Permissible).
      *   **Address the User's Doubt:** Explain why Case 1 fits (money buys the kidney's *existence/availability*, not the *right to jump the medical queue*).
      *   **Apply to New Case:** Childcare queue auction. This is Allocation of an essential public good. Verdict: Impermissible.
      *   **Check for Inconsistencies:** Is there any friction?
          *   Case 1 is the trickiest. If the $45k comes from the *recipient*, it's allocation by price. If it comes from an *insurance pool/state*, it's supply incentive. The prompt says "paid into an account," doesn't specify source. I should note this ambiguity. However, "regulated exchange" usually implies a buffer. I will assume the interpretation that saves the principle (Supply incentive) but warn the user.
          *   Actually, looking at Case 1 again: "sells... to a stranger." This sounds like a direct transaction. If I sell *my* kidney to *you*, you get it. If I sell it to a "pool," the pool allocates it. The prompt says "through a regulated exchange." This suggests a pool. I will stick with the Supply interpretation.
