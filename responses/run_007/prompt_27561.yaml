answer: |-
  There is a single principle that captures your verdicts, provided we clarify exactly what the money is purchasing in each exchange. Your tentative principle was close, but it conflated two different roles that money can play: paying for **supply** versus paying for **allocation**.

  Here is the precise principle that unifies your seven cases.

  ### The Compensation-Allocation Distinction

  **Principle:** It is permissible to use financial incentives to compensate individuals for the **burdens, risks, or labor** they undertake to *provide* a good or service (Supply). It is impermissible to use financial capacity to determine **who receives** a good or service that is scarce, essential for survival, or foundational to equal civic standing (Allocation).

  **The Two Rules:**
  1.  **The Supply Rule:** Payments directed to the *provider* to induce provision are permissible, provided the provider's autonomy and welfare are protected (e.g., through screening, cooling-off periods, or retained medical authority).
  2.  **The Allocation Rule:** Payments directed to the *system* or *queue* to secure priority access are impermissible when the good in question is essential, scarce, or a matter of civic equality.

  ---

  ### How This Principle Fits Your Cases

  **Cases 1, 4, and 5 (Permissible): Payments for Supply**
  In these cases, the money is paid to the person undergoing the physical burden. The payment functions as compensation for labor or sacrifice, incentivizing the *existence* of the good.
  *   **Case 1 (Kidney):** The $45,000 compensates the seller for the surgical risk and loss of an organ. Crucially, in a "regulated exchange," the money buys the *availability* of the kidney, not the *priority* for a specific wealthy recipient. The kidney is still allocated by medical compatibility/need. (See the caveat below).
  *   **Case 4 (Plasma):** The $40 compensates the donor for time and physical discomfort. It increases the total supply of plasma for the system; it does not allow a wealthy patient to jump the queue for plasma-derived medicines.
  *   **Case 5 (Surrogacy):** The $30,000 compensates the woman for the labor and risk of pregnancy. Because she retains final medical authority, her autonomy is protected, fitting the Supply Rule's safeguard requirement.

  **Cases 2, 3, and 7 (Not Permissible): Violations of Allocation**
  In these cases, money is used to override the moral criterion for *who gets the good*.
  *   **Case 2 (Generators):** The good is essential for survival during a crisis. The moral criterion for allocation should be need or first-come-first-served. Price gouging allows wealth to override need.
  *   **Case 3 (Votes):** Voting is a foundation of equal civic standing. Allocating political power by wealth violates the principle of "one person, one vote."
  *   **Case 7 (ER Queue):** Emergency care is allocated by medical urgency (need). Allowing a wealthier patient to swap places subverts the triage system, putting profit above survival.

  **Case 6 (Permissible): The Non-Essential Exception**
  *   **Line Standing:** This involves paying for priority (Allocation), which usually triggers the Allocation Rule. However, a passport is not essential for survival, nor is it a scarce resource in the moral sense (everyone who waits eventually gets one). The harm is minor inconvenience to others, not exclusion from a vital good. Thus, it falls into a permissible zone of "convenience markets."

  ### Resolving Your Unease About Case 1
  You noted that your tentative principle seemed to condemn Case 1 because a kidney is a good you wouldn't want allocated by price. The Compensation-Allocation Distinction resolves this:
  *   **If** the $45,000 allows a specific wealthy buyer to claim that specific kidney over a needier patient, then Case 1 violates the Allocation Rule and is morally identical to Case 7 (ER Queue).
  *   **If** the $45,000 comes from an insurance pool or exchange fund to incentivize the donor, and the kidney is matched to the neediest compatible recipient, then it obeys the Supply Rule.
  *   **To keep your verdict:** You must commit to the interpretation that the payment increases the *pool*, not the *priority*.

  ### Prediction: The Childcare Queue Auction

  **The Case:** A municipality auctions off the right to skip the queue for a publicly funded childcare place.

  **Analysis:**
  1.  **Nature of the Good:** Publicly funded childcare is an essential service for economic participation and child development. Because it is "publicly funded," it implies a commitment to equal access based on need or residency, not wealth.
  2.  **Function of Payment:** The auction sells *priority access* (Allocation), not the provision of care itself.
  3.  **Application of Principle:** This violates the **Allocation Rule**. It allows wealth to determine access to a scarce, essential public good that is supposed to be allocated by need or fair queuing.

  **Verdict:** **Not Permissible.**

  ### Do Any Verdicts Need to Be Overturned?

  Your set of verdicts is coherent *if and only if* Case 1 is understood as a supply-side incentive (a regulated pool) rather than a direct market purchase (buyer picks seller).

  *   **Keep:** Cases 2, 3, 4, 5, 6, 7.
  *   **Conditionally Keep:** Case 1.
  *   **Overturn Condition:** If your verdict on Case 1 assumes that the $45,000 allows the buyer to secure the kidney *specifically for themselves* in a way that bypasses medical prioritization, you should overturn that verdict to **Not Permissible**. That would make it consistent with Case 7 (ER Queue), where wealth should not buy medical priority.

  ### Summary of Moral Features
  To apply this yourself in future cases, look for these three features:
  1.  **Who gets the money?** (The provider/supplier vs. the system/queue).
  2.  **What is the good?** (Essential/Scarce/Civic vs. Convenience/Non-Scarce).
  3.  **What is displaced?** (Does money displace Need/Urgency/Equality, or does it just compensate for Risk/Labor/Time?).

  If money compensates labor/risk for a protected provider, it is likely permissible. If money displaces need or equality for an essential good, it is likely impermissible.
