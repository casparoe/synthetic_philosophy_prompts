      *   **Section 3: The Moral Metaphysics.** Does the ethics rely on the metaphysics?
      *   **Section 4: Cinematic Epistemology.** What the film adds (visualizing absence) and what it obscures (spatializing worlds, causal simplicity).
      *   **Conclusion:** Summary for the lecture.

  7.  **Final Polish:** Ensure the tone is appropriate for undergraduates (clear definitions, but rigorous analysis). Make sure to explicitly answer the prompt's specific questions (e.g., "Would a committed counterpart theorist... disagree?"). Ensure the "quiet assumption" is highlighted (Haecceitism/Tracking).

