  *(Refining the "Cinematic Misleading" point)*: The film makes the counterfactual look like a *modification* of the actual set. Lewis would say it's a concrete distinct universe. The film makes it look like the same stage with an actor removed. This supports TWI/Subtraction over Lewisian Modal Realism.

