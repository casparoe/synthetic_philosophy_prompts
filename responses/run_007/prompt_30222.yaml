answer: |-
  **Lecture Notes: Modality and Metaphysics in *It's a Wonderful Life***

  **Course:** Undergraduate Modality
  **Session:** Transworld Identity vs. Counterpart Theory
  **Text:** *It's a Wonderful Life* (Capra, 1946), The Pottersville Sequence

  ### 1. Introduction: The Metaphysics of Pottersville

  Frank Capra's *It's a Wonderful Life* is frequently treated as a moral fable about community and suicide prevention. For the purposes of this course, however, we must treat the Clarence Odbody sequence (the "no-George" world) as a rigorous modal thought experiment. The film asks us to evaluate a counterfactual conditional: *If George Bailey had never been born, what would the world be like?*

  The philosophical debate anchoring this session is between **Transworld Identity (TWI)** and **Counterpart Theory (CT)**.
  *   **TWI (Kripke, Plantinga):** Individuals exist in multiple possible worlds. Mary in Pottersville is *numerically identical* to Mary in Bedford Falls. They are the same entity with different properties.
  *   **CT (David Lewis):** Individuals are world-bound. Mary in Pottersville is a *counterpart* of Mary in Bedford Falls. They are distinct entities linked by similarity and causal context.

  The central question for today is: **Does the film's moral conclusion—that George's life matters—collapse if we adopt Counterpart Theory?**

  ### 2. The Ontology of the Residents: TWI vs. CT

  When George walks through Pottersville, he recognizes his friends and family. He sees Uncle Billy in an asylum, Mr. Gower as an ex-convict, and Mary as a spinster librarian.

  **The Transworld Identity Reading**
  A defender of TWI finds the film's metaphysics intuitive. On this view, Clarence has not created a new universe; he has subtracted one variable (George's birth) from the actual world's history.
  *   **Identity:** The Mary George sees is *literally* his wife. The suffering she endures is *her* suffering.
  *   **Moral Stakes:** This maximizes the moral weight. George is not merely preventing a *similar* woman from suffering; he is saving *Mary*. The emotional resonance of the film relies on the haecceity (the "this-ness") of the individuals remaining constant despite the historical divergence.
  *   **Coherence:** TWI handles this via "subtraction." We track the same individuals through a branching history. The film assumes we can track Mary across the branch where George is removed.

  **The Counterpart Theory Reading**
  A Lewisian counterpart theorist must interpret the Pottersville residents differently.
  *   **Identity:** The Mary in Pottersville is a distinct individual from the Mary in Bedford Falls. They share high qualitative similarity (same parents, same name, same appearance) but are not numerically identical.
  *   **Moral Stakes:** Does this weaken the film? Not necessarily. For Lewis, *de re* modal claims (claims about what could happen to a specific object) are analyzed via counterparts. To say "Mary could have been unhappy" is true iff Mary has a counterpart who is unhappy.
  *   **Coherence:** The film remains coherent under CT, but the *nature* of George's salvation changes. George is not saving Pottersville-Mary (she is a distinct being in a distinct world); he is ensuring that *Actual-Mary* does not become the kind of being who has a suffering counterpart. He is securing the actualization of the "Bedford Falls" counterpart relation rather than the "Pottersville" one.

  **The Unsettled Assumption:**
  The film quietly helps itself to an assumption the debate cannot settle: **Transworld Tracking.** The film assumes that we can identify Mary across worlds simply by qualitative similarity and causal history, *except* where George is concerned. It treats the town as a persistent container of identity. A TWI theorist accepts this; a CT theorist accepts the similarity but denies the identity. The film blurs this distinction to maximize emotional impact, relying on the audience's pre-theoretical intuition that Pottersville-Mary *is* Mary.

  ### 3. The Observer Problem: George's Absence

  Here we address the specific wrinkle: George observes the no-George world as an outsider. In Pottersville, George was never born. Therefore, there is no George Bailey in that world.

  **Is this a counterexample to Counterpart Theory?**
  No. In fact, the film aligns surprisingly well with Lewis on this specific point.
  *   **CT on Non-Existence:** For a counterpart theorist, to say "George might not have existed" means there is a possible world where no counterpart of George exists. Pottersville is exactly such a world.
  *   **The *De Re* Claim:** The film dramatizes the truth conditions of the claim: "If George had not been born, things would be worse." CT analyzes this by looking at the world where George has no counterpart and checking the properties of the counterparts of *others* (Mary, Billy, the town).
  *   **The Visitation:** The metaphysical incoherence lies not in George's absence, but in his *presence as an observer*. Since George is world-bound in CT (and mostly so in TWI), he cannot literally stand on the street corner of a world where he does not exist. The film solves this via angelic magic (Clarence suspends George's ontological constraints).
  *   **The Asymmetry:** There is a tension here. If George has no counterpart in Pottersville, how do we refer to that world as *George's* counterfactual world? We do so from the perspective of the Actual World. The film captures this external perspective perfectly. George is the "indexical anchor." He is the only thing that remains constant (as an observer) while the world shifts around him.

  **Does this show George's case is unusual?**
  It highlights a specific class of *de re* claims: claims about one's own non-existence. Both TWI and CT must handle "I might not have existed" by referencing a world where the subject is absent. The film makes this abstract notion visceral. George sees the causal vacuum left by his absence.

  ### 4. The "Butterfly Effect" and Subtraction

  The film's famous thesis is that a single life has far-reaching effects. How do our two modal frameworks capture this?

  **TWI + Subtraction:**
  This is the film's native metaphysics. The world is a single block of history. Remove George (subtraction), and the causal chain ripples outward. Mary changes properties (from wife to spinster). This fits the intuition of a shared history that could have gone differently. It preserves the idea that the *same* people are affected by the change.

  **Counterpart Theory:**
  Lewisian Modal Realism views worlds as spatiotemporally isolated totals. Pottersville is not Bedford Falls minus George; it is a distinct concrete universe that *resembles* Bedford Falls but lacks a George-counterpart.
  *   **The Challenge:** CT struggles slightly with the film's intuition of *causal influence* across worlds. George doesn't *cause* Pottersville to be bad; Pottersville is just a world that exists. However, CT handles the *similarity* aspect well. The reason Pottersville matters is that it is the *closest* world to Actuality where George doesn't exist.
  *   **Which is better?** For the film's moral argument, **TWI is superior.** The moral force relies on the idea that George's actions *in this world* prevent *these people* from suffering. If Pottersville is a distinct universe with distinct people (CT), George's sacrifice saves Actual-Mary from *being the kind of person* who has a suffering counterpart. This is a more abstract, less emotionally direct salvation. The film requires the Pottersville residents to be the *very same* people to generate the guilt/gratitude George feels.

  ### 5. Conclusion: Cinematic Epistemology and Metaphysical Misdirection

  **What the Film Contributes:**
  A bare philosophical argument struggles to visualize **absence**. Modality is often taught through possible world semantics or linguistic analysis, which can feel sterile. *It's a Wonderful Life* contributes a phenomenology of counterfactuals. It shows us what it *feels like* to confront the contingency of one's own existence. It dramatizes the **indexicality of value**: the world is not objectively worse in Pottersville (people still live, trade, and love), but it is worse *for George* and *for those connected to him*. It grounds modal realism in emotional stakes.

  **Where the Film Misleads:**
  However, the cinematic presentation misleads students of modality in two critical ways:
  1.  **Spatializing Modality:** The film presents the counterfactual as a *place* one can visit. This encourages the misconception that possible worlds are spatially related to the actual world (like parallel dimensions next door). Both TWI and CT (even Lewis's concrete realism) deny we can travel between worlds. The film hides the abstract nature of modal truth conditions behind a literal journey.
  2.  **Causal Simplicity (The Subtraction Fallacy):** The film assumes that removing George leaves the rest of the ontology stable enough to be recognized. In reality, if George were never born, his parents might not have met, or Mary might have been born to different parents, or not at all. The film assumes a **Haecceitist stability** for everyone but George. It assumes Mary is Mary regardless of the causal chain that produced her. A rigorous modal analysis suggests that if George is removed, the Pottersville "Mary" might be so causally disconnected from Actual "Mary" that neither TWI nor CT would successfully link them. The film simplifies the chaos of counterfactual history to preserve the moral lesson.

  **Final Takeaway for Students:**
  Use the film to understand the *stakes* of the debate, not the *mechanics*. The film argues that our moral obligations depend on **Transworld Identity**. If we are merely counterparts, the tragedy of Pottersville is distant. If we are identical across worlds, the tragedy is personal. The film begs us to accept TWI, but as philosophers, we must ask: Is that metaphysical cost too high for the moral gain?
