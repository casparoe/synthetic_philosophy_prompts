  I'm taking a formal epistemology seminar this semester—it's a small upper-level undergrad course, but the prof teaches it like a mini grad seminar, and the final is a take-home with two essay questions. We've spent the last three weeks on Dutch books, epistemic rationality, and van Fraassen's Reflection principle, and honestly I think I get the basic idea: your current credence in P should equal your expected future credence in P, conditional on what you'll learn in between. But the prof keeps hinting there's way more to it, and that the real action is in the cases where Reflection seems to break—like when you know you're going to take a pill that makes you forget evidence, or when you anticipate your own irrationality. He also mentioned something about how Reflection interacts with epistemic akrasia and whether you can ever rationally believe "P, but my future self will believe ~P." I want to make sure the exam question actually tests whether we've thought through these tensions, not just whether we can write out the principle and the Dutch book argument.

