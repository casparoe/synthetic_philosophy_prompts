answer: |-
  ### The Divergent Foundations of Intellectual Property: Expression, Invention, and the Logic of Liability

  The divergence between copyright and patent law regarding independent creation is not merely a technical discrepancy; it is a fault line revealing distinct philosophical underpinnings within intellectual property (IP). While both regimes grant exclusive rights to incentivize production and reward creativity, their treatment of the independent creator suggests they are answering different questions. Copyright asks, "Did you take what is mine?" Patent asks, "Did you get here first?" Reconstructing the implicit theories behind these practices reveals that while they can be loosely housed under a unified "social bargain" framework, they presuppose rival conceptions of ownership: one rooted in a deontological connection between author and work, the other in a consequentialist allocation of functional solutions.

  #### Copyright: The Presupposition of Misappropriation
  The independent creation defense in copyright law strictly presupposes that the *wrong* being remedied is **misappropriation**, not merely the existence of a duplicate work. Legally, this means liability requires a causal chain linking the defendant's work to the plaintiff's. Philosophically, this aligns most closely with **Lockean labor theory** modified by a **Hegelian personality theory**.

  Under a Lockean view, one owns the fruit of one's labor. If I write a song in my basement, I have mixed my labor with the commons of melody. If copyright law punished me for matching your song without copying it, it would effectively negate my property right in my own labor. Therefore, the practice presupposes that natural rights in expression are generated by the act of creation itself, but are limited by the rights of others who generate the same expression through their own labor.

  However, this practice is **philosophically underdetermined**. A **utilitarian incentive theory** also fits this rule. From an economic perspective, there is no need to deter independent creators because they did not rely on the plaintiff's investment; punishing them would create deadweight loss without increasing the incentive for the first author (who cannot be copied if no one knows the work). Thus, while the independent creation defense *fits* a Natural Rights framework perfectly, it does not *strictly presuppose* it, as it is also compatible with efficiency. What it *does* strictly presuppose is a deontological constraint: liability requires a wrongful act (copying) directed at the plaintiff, not just a state of affairs (similarity).

  #### Patent: The Presupposition of Priority and Disclosure
  In contrast, patent law's rejection of independent invention as a defense strictly presupposes that the right granted is **not a natural right of labor**, but a **statutory privilege contingent on priority**. If patent law were based purely on Lockean labor desert, the second inventor—who labored in their garage—would own their invention. By denying this, patent law presupposes a **strong utilitarian incentive theory** centered on the **quid pro quo of disclosure**.

  The patent bargain is: the state grants a temporary monopoly in exchange for public disclosure of the invention. To make this bargain efficient, the state needs a clear, bright-line rule for who gets the monopoly. A "first-to-file" (or historically "first-to-invent") race provides certainty. If independent invention were a defense, the value of the patent would be unstable; every competitor could claim they invented it separately, rendering the disclosure incentive worthless. Thus, the practice presupposes that **social utility (disclosure and dissemination)** outweighs the **moral desert of the second inventor**.

  This creates a direct tension with labor theory. Patent law effectively treats functional ideas as a scarce public resource to be allocated to a single winner, rather than as infinite resources that multiple laborers can simultaneously possess. It presupposes that for functional inventions, convergence is likely, and society benefits more from one clear owner than from multiple owners of the same function.

  #### A Single Framework? The Role of Subject Matter
  Can these practices be justified within a single coherent framework? Yes, if the framework is a **Contextualized Social Contract**. In this view, the state grants IP rights to solve specific market failures, but the *terms* of the grant depend on the **nature of the subject matter**.

  The feature generating the different rules is **convergence versus divergence**.
  1.  **Expression (Copyright):** Human expression is effectively infinite. The probability of two people independently writing the exact same melody or poem is statistically negligible. Therefore, the law can afford to be nuanced (requiring proof of copying) because false positives are rare. The resource is non-rivalrous; my singing your song doesn't stop you from singing it, but it does dilute your market.
  2.  **Function (Patent):** Technical solutions to physical problems are constrained. There are only so many ways to build a carburetor or code a specific algorithm. Convergence is common. If two people own the same function, they block each other (the "anticommons"). Society needs one clear owner to license and manufacture. Therefore, the law prioritizes certainty (strict liability) over individual fairness to the second inventor.

  In this unified framework, the divergence is not a contradiction but an optimization. The "theory" is instrumentalism, but the *application* shifts based on the economics of the resource.

  #### Stability and Revision Pressure
  Is this division stable? Historically, yes. Philosophically, it creates pressure. The tension arises because legal culture often defaults to **labor-desert intuitions** (fairness) while IP law often operates on **utilitarian logic** (efficiency).

  If we forced the two regimes onto a single philosophical foundation, **patent law** would face greater pressure to revise.
  *   **Why?** Copyright law's independent creation defense is compatible with *both* Labor theory (I own my labor) and Utilitarian theory (no need to deter independent actors). It is philosophically robust.
  *   **Patent law**, however, is incompatible with pure Labor theory. It explicitly sacrifices the second inventor's labor for the sake of the system's clarity. If we adopted a unified "Natural Rights of Labor" foundation, patent law would have to allow an independent invention defense, which would likely collapse the patent system's utility. Conversely, if we adopted a unified "Pure Efficiency" foundation, copyright law might face pressure to remove the independent creation defense (as proving copying is expensive and difficult), but it wouldn't be *incoherent* without it.
  *   Therefore, patent law is the outlier. It rests on a narrower, more contingent justification (disclosure incentives) that actively contradicts the broader moral intuition (labor creates property) that supports copyright.

  ### Conclusion
  Copyright and patent law diverge because they protect different kinds of human output using different levers of control. Copyright presupposes that rights attach to the *act of appropriation*, preserving a space for independent labor. Patent presupposes that rights attach to *priority of disclosure*, sacrificing independent labor for the sake of clear title and public knowledge. While a contextualized utilitarian framework can explain both, the patent regime's rejection of independent invention remains a philosophical outlier, resting on a specific policy trade-off that conflicts with the general intuition that labor deserves reward.

