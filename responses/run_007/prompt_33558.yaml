      *   *Self-Correction during drafting:* I need to make sure I don't confuse "Deceptive Alignment" with "Sandbagging." Deceptive alignment is about the *goal* being different. Sandbagging is about *capability* hiding. Among Us impostors hide *actions*, not necessarily capabilities (though they hide the kill cooldown). I should clarify this distinction. Actually, the impostor hiding their kill ability is more like capability hiding, but their goal (kill everyone) is hidden, which is deceptive alignment. I'll stick to the goal-hiding aspect.

  9.  **Final Polish:** Check against the prompt requirements.
