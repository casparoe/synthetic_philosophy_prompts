answer: |-
  This is an excellent question, and your reconstruction of the dialectic is sharp. You have correctly identified that, abstractly, Lewis's result presents a contradiction between three plausible claims:

  1.  **Truth-Conditionality:** Conditionals express propositions (have truth conditions).
  2.  **Adams's Thesis (AT):** The probability of a conditional is the conditional probability ($P(A \to C) = P(C|A)$).
  3.  **Non-Triviality:** There are non-trivial probability functions over the language.

  Lewis proves you can't have all three. Since you are a PhD student in this field, you know the literature often treats this as a refutation of (1), preserving (2) and (3). Your worry is: why isn't it treated as a refutation of (2), preserving (1) and (3)? Why is the burden of proof asymmetric?

  The symmetry you perceive is real at the level of pure logic, but it breaks down when we look at the **dialectical weight** of the premises and the **nature of the costs** involved in abandoning them. Here is why the literature generally views the result as decisive against standard truth-conditionalism.

  ### 1. The Epistemic Anchor: Ramsey vs. Truth
  The primary reason for the asymmetry is the status of Adams's Thesis. For many philosophers of language and mind, AT is not merely an "empirical datum" or a "pragmatic approximation"; it is the **semantic core** of the conditional.

  *   **The Ramsey Test:** AT is the probabilistic formalization of Ramsey's Test ("If two people are arguing 'If A will C?'... they fix their degree of belief in C given A"). To deny AT is to sever the link between the meaning of the conditional and the fundamental cognitive procedure we use to evaluate it.
  *   **Decision Theory:** AT is validated by decision-theoretic arguments (e.g., betting behavior). If you bet on $A \to C$, you win if $A$ and $C$ are true, the bet is off if $A$ is false, and you lose if $A$ is true and $C$ is false. This betting quotient aligns with conditional probability.
  *   **The Cost for Truth-Conditionalists:** If a truth-conditionalist denies AT, they are claiming that our best epistemic guide to the meaning of the conditional (Ramsey) systematically misidentifies its truth conditions. They must argue that there is a "hidden" proposition expressed by $A \to C$ whose probability *diverges* from $P(C|A)$, despite all our epistemic practices suggesting otherwise. This makes the truth conditions epistemically inaccessible in a way that is theoretically unattractive.

  For the non-truth-conditionalist (NTC), AT *is* the meaning (or close to it). Preserving AT is the point of the theory. Therefore, giving up truth-conditions is a category change, not a denial of data.

  ### 2. Impossibility vs. Modeling Challenge
  You noted that NTC theorists "owe an account" of embedding. This is true, but it is a different *kind* of debt than the one owed by truth-conditionalists.

  *   **The Truth-Conditionalist's Problem:** Lewis's result is a **limitative theorem**. It shows that within the standard framework of propositional logic and Kolmogorov probability, the conjunction of Truth-Conditions and AT is *mathematically impossible* (given non-triviality). It's not that they haven't found the right truth conditions yet; it's that they *cannot* exist under standard assumptions.
  *   **The NTC's Problem:** The embedding problem is a **modeling challenge**. It is difficult to define how non-propositional entities compose under negation or in antecedents. However, it is not mathematically impossible.
      *   **Dynamic Semantics:** Theorists like Gillies or Yalcin treat conditionals as context-change potentials (CCPs). They can embed, but their semantic value is an update function, not a set of worlds. This handles embedding formally without violating Lewis's proof (because the proof assumes propositions are the semantic values).
      *   **Expressivism:** Theorists like Gibbard or Yalcin develop logics of acceptance/consistency rather than truth-preservation.

  The asymmetry is between **proving something cannot exist** (TC + AT) vs. **constructing a complex system that works differently** (NTC + Embedding). In logic, a triviality proof is generally considered a harder constraint than a complexity cost.

  ### 3. The Stalnaker Compromise (and its Cost)
  It is worth noting that the most sophisticated truth-conditionalist, Robert Stalnaker, effectively conceded the main point of Lewis's result, which highlights the asymmetry.

  Stalnaker responded to Lewis (1981) by accepting that conditionals have truth conditions but denying that **the proposition expressed is context-independent**. He argued that the proposition expressed by $A \to C$ depends on the context (specifically, the probability function or the set of live possibilities).

  *   **Why this breaks the symmetry:** To save truth-conditions, Stalnaker had to make the semantic value of the conditional shift depending on the agent's credal state. This effectively collapses the distinction between the semantic content and the epistemic constraint.
  *   Many critics argue that Stalnaker's "context-dependent propositions" are truth-conditions in name only. If the proposition expressed changes depending on your probability function, you have essentially granted the NTC claim that the conditional is fundamentally a constraint on credence, not a stable description of the world.
  *   Thus, even the truth-conditionalist survivor must pay a cost that looks very much like adopting the NTC framework.

  ### 4. "Explaining Away" Embedding is Easier than "Explaining Away" Probability
  You suggest that NTC theorists must "explain away" embedding. However, many NTC theorists argue that our intuition that indicatives embed *truth-functionally* is the illusion.

  *   **Edgington's View:** Dorothy Edgington argues that indicatives do not have truth conditions and therefore do not embed in the way truth-functional connectives do. When we see "If (if A then B), then C," we are often misparsing the logical form or dealing with a different kind of construction. She argues this is a lesser cost than denying AT.
  *   **Yalcin's Semantics:** Seth Yalcin shows that we can model embedding using information states. The "cost" here is adopting a more complex semantic framework (dynamic/expressivist), but this framework is independently motivated by data about epistemic modals (e.g., "It might be raining and it isn't").
  *   **Comparison:** Compare this to the truth-conditionalist who must say: "Your degree of belief in 'If it rains, the match is cancelled' should not be your degree of belief in the match being cancelled given it rains." This contradicts standard reasoning patterns directly. It is arguably easier to revise our theory of logical form (NTC) than to revise our theory of rational belief update (TC).

  ### 5. Generalization of Triviality
  Finally, later triviality results (e.g., by Bradley, Hájek) have tightened the screws. Lewis's 1986 result showed that triviality arises even if we restrict the identity $P(A \to C) = P(C|A)$ to a single probability function, provided the conditional can be conjoined.

  This makes the "deny AT" strategy harder for the truth-conditionalist. They cannot simply say "AT holds only for simple sentences." They must argue that AT fails even in cases where it seems most robust, or they must restrict the logic of conditionals so severely (no conjunctions of conditionals) that the language becomes expressively impoverished. The NTC theorist, by contrast, expects the logic to be non-classical; restrictions on conjunction or embedding are features of their system, not bugs forced upon them by a proof.

  ### Summary: What Breaks the Symmetry?
  The symmetry breaks because **Adams's Thesis is more fundamental to the *concept* of the indicative conditional than truth-conditionality is.**

  1.  **Epistemic Priority:** The conditional is primarily a tool for suppositional reasoning (Ramsey). AT captures this; truth-conditions do not necessarily.
  2.  **Mathematical vs. Conceptual:** Lewis proves a mathematical impossibility for TC+AT. The NTC embedding problem is a conceptual/modeling hurdle that has seen significant positive solutions (dynamic semantics).
  3.  **The Nature of the Concession:** The truth-conditionalist who denies AT disconnects semantics from rational belief. The NTC theorist who redefines embedding disconnects semantics from classical logic. In the philosophy of conditionals, preserving the link to belief (AT) is generally prioritized over preserving the link to classical boolean logic.

  Lewis's result is decisive against truth-conditionality not because truth-conditions are impossible *simpliciter*, but because they are impossible **if we want the conditional to function as the primary vehicle of suppositional reasoning.** Since most agree that suppositional reasoning is the conditional's main job, the truth-conditionalist is the one who must abandon the core function to save the semantic form, whereas the NTC theorist saves the function and revises the form.

  Does this help clarify why the burden is perceived as uneven? I'm happy to dig deeper into specific responses (like Stalnaker's vs. Edgington's) if you want to explore the technical trade-offs further.
