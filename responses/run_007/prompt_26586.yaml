answer: |-
  There is no single, canonical Latin term (like *tu quoque* or *ad hominem*) that exclusively captures this specific move—challenging standing based on a *different* moral failing. In informal logic, it is often lumped under **circumstantial *ad hominem*** or loosely categorized as a variant of ***tu quoque***, but as you rightly note, those labels obscure the crucial distinction you've identified: the wrongs are not the same, and the claim is about *standing* rather than mere inconsistency.

  In contemporary moral philosophy, specifically within the **ethics of blame**, this is discussed under the umbrella of **Moral Standing** (or the **Standing to Blame**). While the literature focuses heavily on *hypocrisy* (the same wrong), there is a recognized sub-category for what you are describing.

  Here is a taxonomy of the phenomenon, a proposed precise definition, and an analysis of when it carries normative force.

  ### 1. Terminology and Conceptual Mapping

  Since no single established term fits perfectly, the most precise philosophical description is a **Generalized Standing Challenge** (or **Integrity-Based Standing Challenge**).

  Here is how it distinguishes itself from nearby concepts:

  *   **Hypocrisy:** A claims B did $X$. A has also done $X$.
      *   *Difference:* Your pattern involves $X$ and $Y$. Hypocrisy undermines standing because it implies A does not actually endorse the norm they are enforcing.
  *   **Standard *Tu Quoque*:** A claims B did $X$. A points out A has also done $X$ (or A did $X$ in the past).
      *   *Difference:* *Tu quoque* focuses on inconsistency. Your pattern focuses on **moral fitness**.
  *   **Whataboutism:** A claims B did $X$. B says, "What about C who did $Y$?"
      *   *Difference:* Whataboutism is primarily a **deflection** tactic intended to change the subject or imply moral equivalence to dilute the accusation. It does not necessarily claim A lacks the *right* to speak, only that the focus is misplaced. Your pattern explicitly claims A lacks the *authority* or *standing*.
  *   **Circumstantial *Ad Hominem*:** A claims $X$ is wrong. B attacks A's character/circumstances to undermine the claim.
      *   *Difference:* This is the logical category your pattern falls into. However, *ad hominem* is usually treated as a fallacy. Your inquiry is about when this move might be **valid** (i.e., when standing is genuinely forfeited).

  **Proposed Term:** **Moral Disqualification via General Immorality.**
  For the sake of precision in our discussion, I will refer to this as a **Generalized Standing Challenge**.

  ### 2. The Normative Force: When Does It Work?

  You noted that the "Lateness vs. Gossip" case feels weak, while the "Harassment vs. Human Rights" case feels strong. Why? Philosophers who study the standing to blame (e.g., R. Jay Wallace, Macalester Bell, Kyle Fritz) suggest that standing is not binary; it is sensitive to **relevance** and **authority**.

  A Generalized Standing Challenge has normative force only when the blamer's unrelated failing reveals a **defect in the specific moral capacity required to issue the blame.**

  Here are the four criteria that distinguish valid challenges from cheap deflections:

  #### A. The Underlying Vice Connection (Thematic Relevance)
  This is the most critical factor. Does the blamer's different wrong ($Y$) stem from the same underlying vice as the blamed wrong ($X$)?
  *   **Case 1 (Lateness vs. Gossip):** Lateness suggests a lack of regard for others' time. Gossip suggests a lack of regard for others' reputations. While both are "rude," they do not necessarily reveal a unified moral defect that disqualifies one from judging the other. The norms are distinct social contracts.
  *   **Case 2 (Harassment vs. Human Rights):** Covering up harassment and violating human rights both stem from a **disregard for human dignity and the abuse of power**. Even though the acts are different, they reveal the same *moral blindness*. Therefore, the blamer lacks the moral insight required to credibly condemn the violation of dignity.

  #### B. Public Authority vs. Private Interpersonal Blame
  Standing requirements are higher for public moralizing than for private interpersonal correction.
  *   **Private:** If a friend is late, I have a stake in the interaction. My own moral record is less relevant than our specific agreement.
  *   **Public:** When a public figure issues a condemnation, they are claiming a role as a **moral exemplar** or representative of a norm. This invites scrutiny of their general moral fitness. If they are profoundly immoral in a related domain, their public authority is compromised.

  #### C. Severity and Scale
  The "tarnish" on the blamer's record must be significant enough to overshadow the specific blame being issued.
  *   If A blames B for a minor infraction, but A is guilty of a heinous crime (even a different one), A's standing is often nullified. The sheer weight of A's immorality makes their voice on *any* moral matter ring hollow. This is sometimes called the **"Potentate Problem"**: a tyrant cannot credibly lecture on kindness.

  #### D. The Function of the Blame
  *   **Corrective Blame:** If the goal is to help B improve, the blamer's other faults matter less than their insight into the specific norm.
  *   **Expressive/Retributive Blame:** If the goal is to express moral outrage or demand accountability, the blamer's own integrity is part of the message. A corrupt blamer undermines the moral community's shared commitment to the norm.

  ### 3. A Taxonomy of the Phenomenon

  We can carve out the boundaries of this concept using the following grid. This distinguishes your pattern from edge cases and fallacies.

  | Feature | **Standard Hypocrisy** | **Generalized Standing Challenge** (Your Pattern) | **Whataboutism** | **Mere Ad Hominem** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Relation of Wrongs** | Same Wrong ($X$ vs $X$) | **Different Wrong ($X$ vs $Y$)** | Different Wrong ($X$ vs $Y$) | Irrelevant Trait |
  | **Core Claim** | "You violate the norm you enforce." | **"You lack the moral fitness to enforce any norm."** | "Others are worse / Look elsewhere." | "You are bad, so your claim is false." |
  | **Normative Force** | High (Undermines commitment) | **Variable (Depends on Vice Connection)** | Low (Distraction) | None (Fallacious) |
  | **Example** | Smoker blames smoking. | **Abuser blames human rights violations.** | "US criticizes Russia, but what about Iraq?" | "You're ugly, so your math is wrong." |

  #### Edge Cases and Boundaries

  1.  **The "Saintly Blamer" Edge:**
      *   *Scenario:* A person who is generally virtuous blames B for a minor wrong.
      *   *Analysis:* High standing. Even if the blamer has *some* unrelated flaws, their general integrity bolsters their standing.
  2.  **The "Reformed Sinner" Edge:**
      *   *Scenario:* A former addict blames B for drug use.
      *   *Analysis:* High standing. Past wrongs ($Y$) do not disqualify them if they have repaired that relationship to the norm. This shows that **current moral fitness** matters more than past record.
  3.  **The "Complicit but Silent" Edge:**
      *   *Scenario:* A blames B for $X$. A has not done $X$, but A benefits from $X$.
      *   *Analysis:* This is **Complicity**, not Generalized Standing. It is often stronger than your pattern. (e.g., A consumer blaming a worker for theft while exploiting the worker's labor).
  4.  **The "Trivial Mismatch" (Your Case 1):**
      *   *Scenario:* Lateness vs. Gossip.
      *   *Analysis:* This is where the Generalized Standing Challenge collapses into **Whataboutism**. Because there is no underlying vice connection, the claim to "standing" is spurious. It is a rhetorical shield, not a genuine moral objection.

  ### 4. Precise Definition

  Based on this analysis, here is a precise definition you can use to name and describe this pattern:

  > **Generalized Moral Disqualification**
  > A rhetorical and normative move in which a blamee challenges the blamer's **moral standing** not by alleging hypocrisy (violation of the same norm), but by citing **unrelated moral failings** that allegedly reveal a defect in the blamer's **moral character or authority**.
  >
  > **Validity Condition:** The challenge possesses normative force only if the blamer's unrelated failings demonstrate an **underlying vice** (e.g., disregard for dignity, abuse of power) that is **thematically relevant** to the norm being enforced, or if the blamer is claiming **public moral authority** that requires general integrity. Absent these conditions, the move functions as a fallacious *ad hominem* or whataboutism.

  ### 5. Summary of the Distinction

  The reason Case 2 (Public Figure) feels stronger than Case 1 (Friend) is not just scale, but **domain relevance**.

  *   In **Case 1**, the norms are **modular**. Being a bad friend (gossip) does not necessarily make you incompetent at judging punctuality norms. The "moral ledger" is compartmentalized.
  *   In **Case 2**, the norms are **foundational**. Both harassment and human rights violations touch on the foundational moral status of persons. A person who violates the foundational status of persons in one domain is presumed to lack the **moral perception** required to identify it in another.

  Therefore, the phenomenon is best understood not as a claim that "bad people can't blame," but that **"people who lack insight into the *source* of a norm cannot credibly enforce it."** When the different wrongs share a source (disrespect, cruelty, dishonesty), the standing challenge is valid. When they do not, it is a deflection.
