      *   *Market Signaling:* Even if this specific beef is sold elsewhere, consistent institutional divestment signals long-term risk to suppliers, encouraging them to shift production *eventually*.
      *   *Educational Mission:* A university isn't just a consumer; it's a teacher. Serving beef contradicts the climate curriculum.
      *   *Compromise:* A hard ban might be too abrupt (culinary shock, student backlash). Phased removal allows supply chain adjustment and cultural adaptation.
      *   *Decision:* **Phased Removal.** It acknowledges the logistical/market reality (addressing the inefficacy objection's concern about disruption) while committing to the moral/collective goal. It's more robust than labeling (which often fails to change behavior) and more pragmatic than immediate total bans.

  4.  **Part 3: Drafting the Memo:**
