      *   *Supply Chain Logic:* If the university stops buying 100 cows worth of beef, the supplier doesn't raise 100 fewer cows. They sell those 100 cows to a high school, a prison, or a restaurant chain. The market absorbs the slack.
      *   *Price Mechanism:* Unless the university is a monopsony (sole buyer), their exit might lower the price slightly, potentially increasing demand elsewhere.
      *   *Moral Implication:* If the action doesn't change the outcome (number of cows raised/emissions produced), then the sacrifice (student satisfaction, culinary variety) is in vain. It's "virtue signaling" without virtue's result.
      *   *Philosophical Anchor:* This aligns with utilitarian concerns about actual consequences. If $X$ action doesn't reduce $Y$ harm, why do $X$?
      *   *Strength:* It's empirically plausible in commodity markets. It challenges the "symbolic" argument by demanding material impact.

  3.  **Part 2: Developing the Counter-Argument (The Path to Recommendation):**
      *   *Collective Action:* While *one* exit might not matter, *many* exits do. Universities are trendsetters.
