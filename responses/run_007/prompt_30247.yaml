      Okay, ready to write. The voice should be analytical, respectful of the text, and precise.

      *(Final thought on "Intention")*: Austin moves away from psychologism in later lectures. He focuses on the *commitment* undertaken. This helps with LLMs. The commitment is undertaken by the human principal, regardless of the tool's lack of psyche.

