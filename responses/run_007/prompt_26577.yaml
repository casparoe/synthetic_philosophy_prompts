prompt: |-
  ok so i'm in this phil of mind seminar and next week i have to present a paper defending epiphenomenalism against the paradox of phenomenal judgment. you know the one—if qualia have zero causal powers, then our judgments about being in pain can't be caused by the pain itself, so it's a massive coincidence that we reliably form true beliefs about our own phenomenal states. i'm arguing this isn't fatal: the correlation is explained by a common neural cause (same brain processes produce both the quale and the judgment about it), and this is no worse than the correlation any dualist already has to posit between the physical and the mental. the real weakness in the objection, i think, is that it assumes the only way to earn the right to trust your judgments is through a direct causal link, but that's not obviously true.

  the class is a weird mix. the prof is a physicalist who's written on mental causation and thinks epiphenomenalism is just property dualism with extra steps and a self-defeat problem baked in. two students are really into chalmers-style stuff and are sympathetic to non-physical consciousness but suspicious of epiphenomenalism specifically—they want consciousness to do something. then there's a bloc of hardcore functionalists who think the whole qualia framing is confused and will definately come at it from a totally different angle. plus some quiet people who might surprise me.

  i need a prep sheet for Q&A. can you give me exactly five objections i'm likely to face, ordered from most to least damaging, phrased the way someone in this room would actually put them? for each one give me a one-sentence reply and flag where the reply is weakest. no intro or conclusion, just the numbered list. and please include the question i'm secretly hoping nobody thinks to ask.
