prompt: |-
  so me and a mate got into this proper long argument last night about whether LLMs actually understand language or if they're just stochastic parrots, and i kept circling back to this one thing that's been bugging me for ages.

  here's the thing. when you ask chatgpt or claude to do something dodgy and it's been trained with RLHF to refuse, it doesn't just fail to produce output or give an error message — it says stuff like "i'm sorry, i can't help with that because it could be used to harm people" or "i don't think it would be right to assist with that." these are sentences that, when a human says them, express beliefs, intentions, moral reasoning, and a kind of stance. the model has been explicitly trained and rewarded to produce sentences that are the linguistic vehicles of understanding and agency.

  but then the same companies — and plenty of researchers — turn round and say the model has no beliefs, no intentions, no understanding, it's fundamentally just doing next-token prediction. the refusals are just statistically likely sequences given the RLHF training. the model doesn't "think" anything is wrong; it's just been shaped to output those words in those contexts.

  so here's my question. what theory of understanding — or meaning, or mental states — does the practice of RLHF refusal-training actually presuppose? if you train a system to produce utterances that only make proper sense when interpreted as coming from an agent who grasps what they're saying, and you reward it precisely for producing those utterances in the right contexts, and you present those utterances to millions of users framed as the system's own reasoning — does that practice implicitly commit you to the view that the system understands what it's doing, at least in some sense? or is there a coherent position where you're not committed to that at all, and if so what is it and what's doing the philosophical work?

  reconstruct the implicit theory that the practice relies on. distinguish what the practice strictly presupposes from what it merely fits well with. and tell me what would concretely have to change — in the training, the system prompts, or the way the systems are presented to users — if a lab genuinely and consistently adopted the view that the model has no intentional states whatsoever and is just a text-generating machine.

  please write the answer in british english. and sorry if this is a bit scattered, still wound up from the argument lol.
