  7.  *(Final Check on LDO)*: Did Parfit think it refuted egalitarianism? Parfit introduced Prioritarianism *because* he found Telic Egalitarianism vulnerable to LDO, but he didn't claim it was "refuted outright" in the sense that no one holds it anymore. Many still defend Telic Egalitarianism (e.g., Temkin). So the friend is definitely wrong on the "outright refutation" claim.

  8.  *(Final Check on Verbal Dispute)*: The "verbal dispute" claim is often associated with the idea that they converge in practice. But they diverge in "Non-Identity" cases or when the better-off gain massively. I need to mention a case where they diverge. *Case:* A policy helps the poor slightly but helps the rich enormously. Prioritarianism might endorse it (poor gained); Egalitarianism might reject it (inequality grew). Actually, a better divergence is: *Universal Gain*. Everyone doubles their welfare. Egalitarianism (Telic): No change in equality. Prioritarianism: Good (priority to worse off met, as they gained). This shows the substantive difference.

