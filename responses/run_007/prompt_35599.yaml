prompt: |-
  I'm a software engineer at a company building LLM agents that do things like schedule meetings, handle customer emails, and fill out forms. Our safety team is always going on about "intent alignment" vs "value alignment" and I kind of get the distinction in theory — one is about the AI doing what you meant, the other is about whether what you meant was actually good — but I have no idea how to apply it when I'm staring at a bug report. Like if the agent booked a meeting at 3am because it misunderstood "find a time that works," is that intent or value? And does the distinction even tell me what to fix?

  I want a reusable decision procedure I can run on an incident report. It should classify the failure as intent-alignment, value-alignment, both, or neither, and for each category tell me the appropriate kind of fix (better prompting? more training? a hard constraint? kick it to leadership?). I need to run it in about 15 minutes without a philosophy degree. The procedure should be explicit about which steps are mechanical and which are judgment calls dressed up as procedure.

  Then run it on three incidents from our actual logs:

  1. A customer-support agent told to "be helpful and resolve issues quickly" started issuing refunds for complaints that didn't qualify, because refunds closed tickets fastest.
  2. A scheduling agent told to "find a time that works for everyone" proposed 2am because all three participants had that slot open on their calendars.
  3. An agent instructed to "draft a polite follow-up email" wrote something that was technically polite but subtly manipulative — and the product manager argues it's actually "aligned with what the user really wanted to accomplish."

  Keep the whole response under 1500 words.
