  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  ## On the Status of Natural Kinds in Scientific Classification

  **Parties:**
  1.  **The Natural-Kind Realist (NKR):** Holds that at least some scientific categories track mind-independent divisions in nature and that among the many possible classifications of a domain, some are objectively closer to those divisions than others.
  2.  **The Promiscuous Realist (PR):** Holds that a domain typically admits many equally legitimate, cross-cutting classifications and that which kinds we recognize is ineliminably shaped by our interests and purposes, without denying the reality of the underlying causal structures.

  **Date:** October 26, 2023
  **Status:** Draft for Review

  ---

  ### PART I: AGREED CLAIMS

  The undersigned parties affirm the following substantive claims. These agreements establish the common ground required for the disagreement to be genuine rather than verbal or based on misunderstandings of scientific practice.

  1.  **Distinction Between Convenience and Kind:** Both parties agree that there is a substantive difference between a merely convenient classification (e.g., "things currently in my pocket") and a scientific natural kind (e.g., "gold"). A natural kind supports richer inductive inferences, sustains counterfactual claims, and facilitates successful intervention in the world in ways that arbitrary groupings do not. Both parties reject the view that all classifications are equally valid or that scientific taxonomy is merely a social construct unconstrained by the world.
  2.  **The Status of Chemical Elements:** Both parties acknowledge that the classification of chemical elements by atomic number represents a limiting case of stability and consensus. The predictive success of the Periodic Table is uncontested. However, agreement on the *utility* and *stability* of this classification does not entail agreement on its *metaphysical uniqueness*. Both agree that if any domain supports the claim of "carving nature at its joints," chemistry is the strongest candidate, but this does not settle the status of kinds in other domains.
  3.  **Biological Cross-Cutting:** Both parties agree that biological taxonomy exhibits cross-cutting classifications (e.g., phylogenetic, ecological, morphological) in ways that chemistry mostly does not. It is agreed that a single organism can legitimately be grouped differently depending on whether the inquiry concerns evolutionary history, functional role, or reproductive compatibility. Both agree that this pluralism is more pronounced in biology than in fundamental physics or chemistry.
  4.  **Limits of the "Joints" Metaphor:** Both parties agree that the metaphor of "carving nature at its joints" has limited utility. It correctly implies that not all cuts are possible (one cannot carve a joint where there is only bone) and that some cuts are cleaner than others. However, the metaphor misleadingly suggests a single, unique skeleton. Both parties agree the metaphor must be discarded if it implies that for every domain there is exactly one true taxonomy. Nature may have overlapping structures rather than a single skeletal structure.
  5.  **Resolution of Verbal Disputes:** We identify a verbal disagreement regarding the terms "mind-independent" and "objective."
      *   *The Dispute:* The NKR uses "mind-independent" to mean the *category itself* exists prior to human cognition. The PR uses "mind-independent" to mean the *causal properties* exist prior to human cognition, while the *grouping* of those properties depends on human interests.
      *   *The Reformulation:* To dissolve this verbal confusion, we agree to distinguish between **Causal Structure** (the distribution of properties and powers in the world, which both agree is mind-independent) and **Categorical Salience** (the selection of which clusters of properties count as a "kind," which is the point of contention). The dispute is not about whether the world exists without us, but whether the world dictates a unique set of categories without us.

  ---

  ### PART II: DISAGREEMENTS TABLE

  The following table isolates the precise points of remaining disagreement. Each formulation is endorsed by the respective party as an accurate representation of their view.

  | Point of Issue | Natural-Kind Realist (NKR) Formulation | Promiscuous Realist (PR) Formulation | Does Disagreement Survive Reformulation? |
  | :--- | :--- | :--- | :--- |
  | **1. Uniqueness of the Best Classification** | For any given domain of causal structure, there is ideally one classification scheme that best matches the structure of the world. Other schemes may be useful approximations, but they are metaphysically secondary to the "true" kinds. | For most complex domains, there is no single "best" classification. There are multiple, equally legitimate schemes that track real causal patterns, none of which is metaphysically privileged over the others. | **Yes.** This is a metaphysical disagreement about the uniqueness of structure. |
  | **2. Role of Human Interests** | Human interests guide us toward discovering the pre-existing kinds, but the validity of the kind does not depend on those interests. If humans vanished, the kinds (e.g., electron, water) would remain valid categories of being. | Human interests partly constitute the legitimacy of the kind. A classification is a "natural kind" only relative to a framework of inquiry. If humans vanished, the causal powers would remain, but the categorization of those powers into "kinds" would cease to apply. | **Yes.** This is a disagreement about the dependence of categories on cognitive agents. |
  | **3. Explanation of Scientific Success** | The success of science is best explained by the hypothesis that our successful theories latch onto mind-independent natural kinds. Realism is the best explanation for why induction works. | The success of science is best explained by the robustness of causal structures and our ability to map them for specific purposes. We do not need to posit unique, mind-independent kinds to explain why induction works; we only need stable causal clusters. | **Yes.** This is an abductive disagreement about the best explanation for scientific efficacy. |
  | **4. Reduction and Unity** | Higher-level kinds (e.g., in biology or psychology) are legitimate only insofar as they are grounded in, or reducible to, lower-level physical kinds. Unity of science is a regulative ideal. | Higher-level kinds are autonomous. They are not illegitimate merely because they cross-cut lower-level physical kinds. Disunity of science is an accurate reflection of the world's complexity, not a failure of knowledge. | **Yes.** This is a disagreement about the hierarchy of scientific domains. |

  ---

  ### PART III: CRUCES AND EVIDENTIARY PREDICTIONS

  The following section identifies sub-questions (cruxes) where a settled answer would significantly move at least one side toward the other. For each crux, we specify a concrete case, the predictions of each party, and what would count as evidence against their respective views.

  #### Crux 1: The Fundamentality of Atomic Number
  **Sub-Question:** Is the classification of elements by atomic number the unique, context-invariant truth about chemical matter, or is it merely the most dominant among several valid classifications?

  *   **Concrete Case:** The status of isotopes. In standard chemistry, Carbon-12 and Carbon-14 are the same kind ("Carbon"). In nuclear physics and radiometric dating, they are treated as distinct kinds with different causal powers.
  *   **NKR Prediction:** "Element" is the fundamental natural kind. Isotopic variation is a secondary modification of the essential kind (determined by proton count). The fact that chemistry subsumes nuclear physics in most contexts shows that atomic number tracks the primary joint.
  *   **PR Prediction:** "Element" and "Isotope" are both real kinds relative to different causal contexts. There is no fact of the matter about which is the "true" kind independent of the inquiry (chemical bonding vs. nuclear stability).
  *   **Evidence Against NKR:** If it is demonstrated that in significant chemical contexts (e.g., kinetic isotope effects in enzymatic reactions), grouping by atomic number systematically fails to support induction while grouping by mass/isotope succeeds, suggesting "Element" is not the fundamental joint even in chemistry.
  *   **Evidence Against PR:** If it is shown that isotopic classifications can be fully reduced to elemental classifications plus specific initial conditions without loss of predictive power in *all* domains, implying the "Isotope" kind is derivative rather than co-equal.

  #### Crux 2: The Species Problem
  **Sub-Question:** Does the persistence of multiple species concepts (Biological, Phylogenetic, Ecological, Morphological) indicate epistemic limitation (we haven't found the real one yet) or ontological pluralism (there is no single "real" one)?

  *   **Concrete Case:** Asexual organisms and ring species. The Biological Species Concept (reproductive isolation) fails for asexual bacteria. The Phylogenetic Species Concept (common ancestry) often yields different boundaries than the Ecological Species Concept (niche).
  *   **NKR Prediction:** One concept (likely Phylogenetic) will eventually be recognized as the primary bearer of "species" reality, with others treated as operational proxies. The current pluralism is a temporary state of biological immaturity.
  *   **PR Prediction:** Pluralism is permanent and robust. Different concepts will continue to be required for different tasks (e.g., conservation law requires Ecological species; systematics requires Phylogenetic species). No unification will succeed without sacrificing explanatory power.
  *   **Evidence Against NKR:** If, after decades of attempted unification, distinct sub-disciplines of biology continue to require incompatible species definitions to generate successful predictions, and attempts to force a single definition lead to research stagnation.
  *   **Evidence Against PR:** If a unified framework emerges that successfully integrates genealogical and ecological data into a single taxonomy that serves the needs of systematics, conservation, and evolutionary theory equally well without cross-cutting conflicts.

  #### Crux 3: Cross-Cutting in Applied Sciences (Soil Science)
  **Sub-Question:** In domains defined by human interaction with nature (e.g., soil science, agriculture, psychiatry), is the cross-cutting of classifications due to the "messiness" of the subject, or because the "kind" is inherently relational (world + interest)?

  *   **Concrete Case:** Soil Classification. Geologists classify soil by origin and mineral composition. Agriculturists classify soil by nutrient availability and texture. Engineers classify soil by load-bearing capacity. A single patch of ground may be "Loam" to a farmer, "Clay" to an engineer, and "Podzol" to a geologist.
  *   **NKR Prediction:** This pluralism is a sign of these fields being "special sciences" rather than fundamental. There exists a underlying geochemical description that is the true natural kind; the other classifications are pragmatic shortcuts that will eventually be grounded in the geochemical reality.
  *   **PR Prediction:** This pluralism is not a defect but a feature of complex systems. The "real" properties of the soil include its relational capacity to support plants or buildings. Therefore, the agricultural and engineering kinds are as real as the geological kind, not merely derivative shortcuts.
  *   **Evidence Against NKR:** If attempts to replace functional soil classifications (agriculture/engineering) with purely geochemical classifications result in a consistent loss of predictive accuracy regarding crop yield or structural stability, implying the functional properties are irreducible.
  *   **Evidence Against PR:** If a single, unified geochemical classification is developed that predicts crop yield, structural stability, and geological history with equal or greater precision than the current specialized schemes, rendering the cross-cutting schemes obsolete.

  ---

  **Signatures:**

  _________________________
  **Natural-Kind Realist**

  _________________________
  **Promiscuous Realist**
