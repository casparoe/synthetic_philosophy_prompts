answer: |-
  This is a profound question that sits at the intersection of semiotics, information theory, and the philosophy of biology. The instability you are observing in geneticists is not a failure of their knowledge, but a reflection of a genuine ontological tension: **Is biology a branch of chemistry, or is it a branch of informatics?**

  To give your protagonist (and yourself) a defensible framework, I propose a principle based on **Contingent Mapping** and **Interpretive Mediation**. This framework aligns with your intuitions about Morse, thermometers, and vervets, while offering a precise way to adjudicate the DNA and waggle dance cases.

  ### The Principle: The Contingent Mapping Test

  A system involves a **code** if and only if it satisfies two conditions:

  1.  **Contingency (Arbitrariness):** The relationship between the signal (A) and the outcome (B) is not physically necessitated by the laws of physics or chemistry. There is no causal law that *requires* A to produce B; the link is established by convention, history, or evolved function. (i.e., The mapping *could have been otherwise*.)
  2.  **Interpretive Mediation:** There exists a distinct mechanism (a receiver/decoder) that translates A into B based on that contingent mapping, rather than A simply causing B through direct physical force or structural complementarity.

  If the link between A and B is determined by physical necessity (e.g., heat expands mercury), it is **causation** or **measurement**, not coding. If the link is contingent and requires a translator, it is **coding**.

  ---

  ### Applying the Principle to Your Cases

  Here is how this principle sorts your existing list, validating your gut while clarifying the "why."

  | Case | Contingent Mapping? | Interpretive Mediation? | Verdict | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Morse Code** | **Yes.** Dots/dashes could map to any letters. | **Yes.** Operator/Machine translates. | **Code** | Pure convention. |
  | **Source Code** | **Yes.** Syntax is defined by language spec. | **Yes.** Compiler translates. | **Code** | Defined rules, distinct execution. |
  | **Thermometer** | **No.** Heat *physically forces* expansion. | **No.** Direct causal link. | **Not Code** | It is a measurement/index, not a symbol. |
  | **Key/Lock** | **No.** Shape must physically match. | **No.** Mechanical fit. | **Not Code** | Structural complementarity, not translation. |
  | **Plaster Mold** | **No.** Cast shape is physically imposed. | **No.** Direct physical impression. | **Not Code** | Template, not instruction. |
  | **Recipe** | **Yes.** Words are arbitrary symbols. | **Yes.** Baker reads/interprets. | **Code** | (Your hedge is likely because it's *semantic* language, but it passes the test.) |
  | **Vervet Calls** | **Yes.** Sound doesn't resemble predator. | **Yes.** Brain interprets sound as threat type. | **Code** | Evolved convention. No intent needed, only function. |

  ### The Crucial Case: DNA

  This is where your protagonist's crisis lies. Applying the principle reveals why geneticists wobble.

  **1. Is the mapping contingent?**
  **Yes.** This is the strongest argument for DNA as code. There is no chemical law that dictates that the codon `UUU` *must* code for Phenylalanine. It is a "frozen accident" of evolutionary history. In a different evolutionary lineage, `UUU` could code for Glycine. The fact that it is universal across life on Earth is due to common descent, not chemical necessity.

  **2. Is there interpretive mediation?**
  **Yes, but it is chemical.** This is the source of the confusion. The "receiver" is the ribosome and the tRNA molecules. They do not simply "fit" like a key in a lock (which would be direct causation). They *read* the sequence. The tRNA has an anticodon that matches the mRNA codon, but the amino acid it carries is attached by a specific enzyme (aminoacyl-tRNA synthetase). That enzyme is the "coder." It enforces the table.

  **The Verdict:** DNA is a **chemical implementation of a code.**
  The instability you hear in geneticists comes from switching levels of analysis.
  *   **At the molecular level:** It looks like chemistry (binding affinities, steric hindrance). This makes it feel like a lock and key.
  *   ** **At the systemic level:** It looks like information (sequence independence, arbitrary mapping). This makes it feel like Morse code.

  **For your book:** The truth is that DNA is a code *because* the chemistry is subservient to the mapping. If the chemistry dictated the mapping (stereochemical theory), it wouldn't be a code; it would be a crystal growing. Because the mapping is historically fixed but chemically arbitrary, it is a code.

  ### The New Case: The Honeybee Waggle Dance

  Let us apply the principle to your unresolved case.

  **1. Contingent Mapping:**
  **Yes.** The angle of the bee's abdomen relative to the vertical comb *represents* the angle to the sun outside. There is no physical law requiring a bee to waggle at 30 degrees to indicate a flower 30 degrees from the sun. It is an evolved convention of the hive. Furthermore, the *duration* of the waggle represents *distance*. This is symbolic, not physical.

  **2. Interpretive Mediation:**
  **Yes.** Other bees do not physically ride the dancing bee to the location. They observe the dance, process the parameters (angle/duration), and then initiate flight based on that translated information.

  **The Verdict:** The waggle dance **is a code.**
  It is arguably a "stronger" code than DNA in terms of behavioral flexibility, but it shares the same logical structure: an arbitrary signal decoded by a receiver to produce an action not physically forced by the signal itself.

  ### Addressing Your Specific Questions

  **1. Does a code require a sender with intentions?**
  **No.** Your intuition about the vervet monkeys is correct. Intentionality (in the human, conscious sense) is not required. **Functional Teleology** suffices. If the system was selected by evolution to carry information, and the mapping is contingent, it is a code. This allows DNA and bee dances to be codes without implying a "Designer."

  **2. Convention vs. Purely Causal?**
  This is the dividing line. A thermometer is purely causal (heat $\to$ expansion). A code is conventional (Signal $\to$ Meaning $\to$ Action). The "convention" in biology is enforced by natural selection rather than a committee, but the logical structure is identical.

  **3. Receiver that interprets vs. merely reacts?**
  This is the subtle distinction. A lock "reacts" to the key's shape directly. A ribosome "interprets" the codon. How do we tell the difference?
  *   **Reaction:** The physical properties of the signal *are* the cause of the outcome (Key shape turns tumblers).
  *   **Interpretation:** The physical properties of the signal are *ignored* except for their identity within the system (The ribosome doesn't care about the chemical weight of the codon, only its sequence identity).

  ### Implications for Your Novel

  Your protagonist's suspicion—that language shapes belief—is vindicated by this analysis.

  If geneticists treat DNA as a **lock and key** (chemistry), they look for physical affinities. They ask: "How does the molecule fit?"
  If they treat DNA as a **code** (informatics), they look for syntax and errors. They ask: "What is the instruction?"

  The danger for your character is realizing that calling it a "code" smuggles in the idea of a **reader**. In human communication, a code implies a sender and a receiver with minds. In biology, we have the code (DNA) and the receiver (Ribosome), but the "mind" is absent. The "interpretation" is blind chemistry.

  **The Narrative Tension:**
  Your protagonist might conclude that the "Genetic Code" is a **metaphor that became real**. By treating DNA as a code for 60 years, biologists have begun to engineer it as one (CRISPR, synthetic biology). The language didn't just describe the reality; it invited scientists to manipulate the world *as if* it were a code, until it *became* one.

  **Summary for your thinking:**
  1.  **Code = Contingent Mapping + Interpretive Mechanism.**
  2.  **DNA is a Code** (mapping is arbitrary, translation is mediated).
  3.  **Waggle Dance is a Code** (mapping is symbolic, reception is cognitive).
  4.  **Intention is not required**, but **Decoupling** (signal distinct from outcome) is.

  This framework should give your protagonist a solid intellectual footing to challenge her colleagues, not by denying the chemistry, but by insisting on the logical priority of the information.
