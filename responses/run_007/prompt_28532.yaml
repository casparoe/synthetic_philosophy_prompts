answer: |-
  # Joint Statement on the Liar Paradox and Semantic Theory

  **Produced by:** The Paracomplete and Dialetheist Working Group
  **Date:** End of Term
  **Subject:** Findings of Adversarial Collaboration on Semantic Pathology

  ### I. Agreed Claims

  After a term of adversarial collaboration, we jointly affirm the following claims regarding the Liar paradox, the T-schema, and the constraints on logical theory:

  1.  **The Incompatibility Thesis:** The conjunction of Classical Logic (specifically the principles of Bivalence, Non-Contradiction, and Explosion) and the unrestricted T-schema ($T\langle\phi\rangle \leftrightarrow \phi$) entails triviality in the presence of self-referential sentences like the Liar. At least one of these components must be revised.
  2.  **Preservation of Ordinary Discourse:** For ordinary, non-pathological sentences, truth and falsity function effectively as exhaustive and exclusive categories. Any revisionary logic must recover classical validity for standard mathematical and empirical inference to a degree that preserves scientific practice.
  3.  **The Constraint of Pathological Variants:** An adequate theory must provide a unified solution to the Simple Liar ("This sentence is false"), the Strengthened Liar ("This sentence is not true"), and Curry's Paradox ("If this sentence is true, then $P$"). A solution that resolves the Simple Liar but succumbs to the Strengthened Liar or Curry is inadequate.
  4.  **Shared Negative Prediction:** Both theories agree that classifying the Liar sentence as *simply* true (in the classical sense) or *simply* false (in the classical sense) is incorrect. We concur that the classical dichotomy fails for this specific sentence, even if we disagree on the metaphysical explanation for that failure.

  ***

  ### II. Table of Disagreements

  While we agree on the problems, we diverge on the diagnosis. The following table outlines our distinct positions, phrased to ensure each party accepts their respective column as an accurate representation of their view.

  | Issue | Paracomplete Formulation | Dialetheist Formulation |
  | :--- | :--- | :--- |
  | **Status of the Liar** | The Liar sentence constitutes a truth-value gap; it is neither true nor false. | The Liar sentence constitutes a truth-value glut; it is both true and false. |
  | **Exhaustiveness** | Truth and falsity are **not exhaustive**; there are meaningful sentences that fall into neither category. | Truth and falsity are **exhaustive**; every meaningful sentence is at least true or at least false (often both). |
  | **Exclusiveness** | Truth and falsity are **exclusive**; no sentence can correctly be assigned both values simultaneously. | Truth and falsity are **not exclusive**; some sentences correctly bear both values simultaneously. |
  | **Rejected Principle** | We reject the **Law of Excluded Middle** ($\phi \vee \neg \phi$) for pathological sentences. | We reject the **Law of Non-Contradiction** ($\neg(\phi \wedge \neg \phi)$) and the principle of **Explosion** ($\phi, \neg \phi \vdash \psi$). |
  | **Strengthened Liar** | The Strengthened Liar shows that the concept of a "gap" cannot be fully expressed within the object language without generating revenge paradoxes. | The Strengthened Liar shows that true contradictions are inevitable and that the concept of "truth" is inherently inconsistent. |

  ***

  ### III. Cruxes of the Dispute

  We have identified three sub-questions ("cruxes") where further investigation could theoretically move at least one party to revise their position. For each crux, we record the evidence we agree is relevant and our current predictions.

  **Crux 1: Independent Examples of Gaps or Gluts**
  *   **The Question:** Do truth-value gaps or true contradictions exist in domains outside of semantic paradoxes (e.g., vagueness, legal codes, or naive set theory)?
  *   **Accepted Evidence:** Cases of borderline vagueness (Sorites paradox) and inconsistent but non-trivial regulatory frameworks.
  *   **Paracomplete Prediction:** Investigation will show that vague predicates generate gaps, supporting the view that semantics is partial. No genuine true contradictions will be found outside of paradox.
  *   **Dialetheist Prediction:** Investigation will show that inconsistent theories (e.g., naive set theory or transitional legal states) contain true contradictions, supporting the view that reality/theory is dialetheic. Vagueness will also be shown to involve gluts at boundaries.

  **Crux 2: The Expressibility of the Paracomplete Solution**
  *   **The Question:** Can the paracomplete view handle the Strengthened Liar ("This sentence is not true") without collapsing into dialetheism or rendering the notion of a "gap" inexpressible in the object language?
  *   **Accepted Evidence:** The "Revenge" literature regarding the expressibility of the exclusion operator (e.g., "is untrue" or "is false").
  *   **Paracomplete Prediction:** A sufficiently rich non-classical metalanguage (or a hierarchy of languages) can express the gap status without contradiction, preserving consistency.
  *   **Dialetheist Prediction:** Attempts to express the gap will inevitably generate a new Liar sentence, forcing the paracomplete theorist to accept a contradiction or admit silence, thereby vindicating dialetheism.

  **Crux 3: Viability of Paraconsistent Mathematics**
  *   **The Question:** Can a paraconsistent logic (with Explosion removed) preserve enough ordinary reasoning for mathematics and everyday inference, specifically regarding Disjunctive Syllogism?
  *   **Accepted Evidence:** Formal systems such as LP (Logic of Paradox) and adaptive logics applied to standard arithmetic.
  *   **Paracomplete Prediction:** The loss of Disjunctive Syllogism ($\phi \vee \psi, \neg \phi \vdash \psi$) renders paraconsistent logic too weak for standard mathematics; the cost of tolerating contradictions is too high.
  *   **Dialetheist Prediction:** Paraconsistent logic can recover classical validity for consistent domains via adaptive strategies; the loss of Explosion is a necessary and manageable cost to avoid triviality.

  ***

  ### IV. Merely Verbal Disputes

  Upon reflection, we identify a portion of our disagreement as merely verbal, stemming from divergent definitions of negation and falsity.

  *   **The Dispute:** Whether the Liar sentence is correctly described as "false."
  *   **Distinct Readings:**
      *   **Paracomplete Reading:** "False" is defined as "exclusively not true." Under this reading, if a sentence is neither true nor false, it is not false. Thus, saying the Liar is "false" is a contradiction.
      *   **Dialetheist Reading:** "False" is defined as "having the truth value False," which may overlap with "True." Under this reading, the Liar has the value False (and True). Thus, saying the Liar is "false" is correct.
  *   **Resolution:** We acknowledge that if we standardize the definition of "false" to mean "has the value False" (allowing overlap), the Paracomplete party must say the Liar is *not* false. If we standardize "false" to mean "not true" (where 'not' is exclusive), the Dialetheist must say the Liar *is* false. Our substantive disagreement remains regarding whether truth values *can* overlap (exclusiveness), but the label "false" applied to the Liar depends on which semantic convention is adopted.
