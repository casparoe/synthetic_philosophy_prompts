  I'm a journalist covering evolutionary biology for a general-interest magazine, and I'm working on a piece about the legacy of the Gould–Lewontin spandrels paper. In my research, I came across the following summary of their argument in a widely read popular science book:

  "Gould and Lewontin's famous 'Spandrels' paper proved that many traits are not adaptations at all. They used the architectural analogy of spandrels—the triangular spaces between arches that exist only because of the way domes are built—to argue that countless biological features are simply side effects of how organisms develop, not products of natural selection. According to Gould and Lewontin, adaptationists had been telling 'just-so stories': for any trait, they'd invent a plausible adaptive reason for it without considering whether it might simply be a structural byproduct. The paper's lasting lesson is that natural selection is not the creative force in evolution it was once thought to be—it's merely a filter that eliminates the worst designs, while the real drivers of form are developmental constraints and historical accidents."

  I don't want to rely on a single secondary source, and I suspect this summary may be oversimplifying—or perhaps overstating—what the paper actually argued. Before I cite or paraphrase anything like this in my article, I'd like to know exactly where it's accurate and where it's misleading. Please go through the summary sentence by sentence (or claim by claim) and tell me: what would Gould and Lewontin themselves accept, what would they push back on, and what is simply wrong? Also, does the summary's bottom-line characterization of the paper's "lasting lesson" survive correction, or does it depend on the parts that are inaccurate?

  Finally, please end your response with a one-sentence summary of your overall assessment as the last line, beginning with "Overall:".
