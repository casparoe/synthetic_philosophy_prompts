  A consortium of regional banks maintains a shared legacy ledger for inter-settlement transactions to maximize liquidity across the network. All member banks agree the system is fragile and wish to migrate to a modern, resilient protocol. They share full transparency, trust each other implicitly, and have perfectly aligned incentives to prevent systemic collapse. However, the migration requires a "big bang" switch where all nodes must validate the new state simultaneously to prevent double-spending. As the consortium expands to include more banks for greater liquidity, the network latency required to achieve global consensus exceeds the transaction window, making the switch mathematically unsafe.

  The banks are forced to continue using the fragile legacy system not because any member defects or competes, but because the *physics of distributed consensus* makes safe migration impossible at their current scale. Optimization pressure for liquidity (adding members) directly increases the coordination cost, locking them into a vulnerable status quo. Communication cannot solve the latency limit, and goodwill cannot accelerate the handshake protocol; the trap is embedded in the architectural requirement for perfect synchronization in an imperfect environment.

  1.  **Structural Feature:** The trap is driven by **non-linear coordination costs** (specifically, consensus latency) rather than misaligned incentives. The mechanism is a scalability limit: the very act of optimizing for one good (liquidity/network size) degrades the capacity to achieve another good (security/migration), regardless of actor intent.
  2.  **Naive Analysis Failure:** A standard "Moloch = multipolar Prisoner's Dilemma" analysis would search for hidden defection, such as a bank secretly hoarding capital or resisting change to gain competitive advantage. It would fail here because there is no incentive mismatch to correct; diagnosing this as a trust problem would lead to futile solutions like more meetings or binding contracts, ignoring the technical bottleneck that makes coordination physically impossible at scale.
  3.  **Dissolving the Trap:** The setup requires shifting from synchronous to asynchronous settlement (allowing temporary divergence). This is technically an internal change, but it requires a privileged subset of architects to override the consortium's core safety dogma ("never allow divergence"). Realistically, this is unlikely to happen from within because the short-term risk of a bug falls on the architects, while the long-term benefit is diffuse; it likely requires an external shock (e.g., a regulator mandating the upgrade despite the risk) to break the inertia.
