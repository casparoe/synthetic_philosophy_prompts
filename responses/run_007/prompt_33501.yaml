  Also, (c) implies there are normative facts governing the idealization process. If (a) is true, *those* facts are also stance-independent. But (b) says the procedure for accessing normative facts is idealized deliberation. How do we access the norms governing idealization? If we use idealized deliberation, it's circular (as c says). If we don't, then (b) is false (it's not the *only* or *correct* procedure for *all* normative facts).

  Okay, the plan is solid. I will structure the audit by severity.

