prompt: |-
  So I've been going back and forth with some friends in a reading group — half of them are really into evolutionary psychology (the Cosmides, Tooby, Pinker side of things) and the other half keep saying it's all just-so stories, you can't test any of it, it's storytelling dressed up as science. We've been at this for weeks and I'm tired of the ping-pong.

  What I actually want, before I plant a flag, is the desiderata. What does an evolutionary explanation of a psychological trait have to deliver to count as a genuine scientific hypothesis and not a just-so story? I mean the full spec: what kinds of evidence would confirm or disconfirm it, what alternative explanations it has to rule out (byproduct, drift, cultural transmission, exaptation), what constraints from genetics or paleoanthropology it can't contradict, what the explanation has to specify about the ancestral environment and the selection pressure — all of it. For each requirement, give me the reason it's a requirement, not just the label. And then tell me which of these are non-negotiable (fail this and your writing fiction) and which are aspirational (even the best hypotheses only partly meet them).

  If you want to illustrate by scoring a couple of well-known hypotheses against the list — say, disgust-as-pathogen-avoidance or depression-as-rumination-adaptation — that's fine, but the list is what I'm actually after. And if there are pairs of desiderata that pull in opposite directions (where satisfying one makes it harder to satisfy another), flag those — that's the kind of tension I suspect is driving a lot of the fights in the literature, and nobody in my group has laid it out that way yet.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group debate between proponents of Evolutionary Psychology (EP) (Cosmides, Tooby, Pinker) and critics (Gould, Lewontin, "just-so stories").
      *   **Goal:** The user wants a definitive list of *desiderata* (requirements) for an evolutionary explanation of a psychological trait to count as scientific rather than storytelling.
      *   **Specifics:**
          *   What evidence confirms/disconfirms?
          *   What alternative explanations must be ruled out (byproduct, drift, culture, exaptation)?
          *   What constraints (genetics, paleoanthropology) apply?
          *   What must be specified about the Environment of Evolutionary Adaptedness (EEA) and selection pressure?
          *   **Crucial:** For each requirement, explain *why* it's a requirement.
          *   **Crucial:** Distinguish between *non-negotiable* (fail = fiction) and *aspirational* (hard to meet fully).
          *   **Crucial:** Identify tensions/trade-offs between desiderata.
          *   **Optional but helpful:** Illustrate with examples (Disgust, Depression).

  2.  **Deconstruct the Debate (EP vs. Critics):**
      *   *EP Core Claim:* The mind consists of domain-specific modules adapted to solve recurrent problems in the EEA.
      *   *Critics' Core Claim:* Many traits are byproducts (spandrels), cultural artifacts, or too hard to test retrospectively.
      *   *The Middle Ground:* Rigorous adaptationism requires more than plausibility; it requires converging lines of evidence.

  3.  **Drafting the Desiderata (The "Full Spec"):**
      *   I need to categorize these to make them digestible. Good categories would be: Functional Design, Ancestral Context, Alternatives, and Empirical Constraints.

      *   *Requirement 1: Functional Design/Complexity.* Why? Because natural selection is the only known force that creates complex functional order. If it looks designed, it probably was.
      *   *Requirement 2: Specification of the Adaptive Problem.* Why? You can't claim a solution without defining the problem.
      *   *Requirement 3: EEA Plausibility.* Why? The trait must have been selectable *then*, not just useful *now*.
      *   *Requirement 4: Ruling Out Alternatives (Byproducts/Drift).* Why? Not everything is an adaptation.
      *   *Requirement 5: Cross-Cultural Universality (with variation).* Why? Genetic adaptations should show a universal underlying architecture, even if surface expressions vary.
      *   *Requirement 6: Developmental Trajectory.* Why? Adaptations usually have specific ontogenetic timing (e.g., puberty).
      *   *Requirement 7: Neural/Physiological Mechanism.* Why? Psychology must be implemented in biology.
      *   *Requirement 8: Phylogenetic/Comparative Evidence.* Why? Do related species show precursors?

  4.  **Classifying Non-Negotiable vs. Aspirational:**
      *   *Non-Negotiable:* Internal consistency, specifying the adaptive problem, logical plausibility of selection. If you can't define the problem, you have nothing.
      *   *Aspirational:* Identifying specific genes, perfect reconstruction of the EEA, ruling out *all* cultural influence (impossible).

  5.  **Identifying Tensions/Trade-offs:**
      *   *Specificity vs. Generality:* Too specific = hard to test/falsify. Too general = just-so story.
      *   *Universality vs. Plasticity:* EP claims universality, but adaptive plasticity looks like variation.
      *   *Present Function vs. Past Origin:* Something useful now (depression) might not be why it evolved.

  6.  **Developing the Examples:**
      *   *Disgust:* Strong candidate. Universal, specific triggers (rot, fluids), physiological response (vomiting), clear ancestral problem (pathogens).
      *   *Depression (Rumination):* Weaker candidate. Hard to define the "benefit," high cost (suicide), alternative explanations (byproduct of attachment system, medical condition).

  7.  **Refining the Output (Self-Correction/Review):**
      *   *Tone:* Needs to be neutral, analytical, and rigorous. Not taking sides, but defining the rules of engagement.
      *   *Clarity:* Use bolding and lists.
      *   *Addressing the Prompt:* Did I explain *why* for each? Yes. Did I distinguish non-negotiable/aspirational? Yes. Did I flag tensions? Yes.
      *   *Check:* Did I address the "genetics/paleoanthropology constraints"? Need to ensure that's explicit in the EEA section.

  8.  **Final Polish:**
      *   Make sure the distinction between "Adaptation," "Byproduct," and "Noise" is clear.
      *   Ensure the "Just-So Story" definition is operationalized (i.e., unfalsifiable plausibility).
      *   *Key Insight:* The biggest tension is between *reconstructing the past* (hard) and *testing the present* (easier but indirect).

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Acknowledge the stalemate. Define the goal (falsifiability).
      *   Section 1: The Desiderata List (categorized).
          *   Item: Requirement.
          *   Rationale: Why it matters.
          *   Status: Non-negotiable vs. Aspirational.
      *   Section 2: The Tensions (The "Friction Points").
      *   Section 3: Illustrative Scoring (Disgust vs. Depression).
      *   Conclusion: How to use this in the reading group.

  10. (Self-Correction during drafting): Make sure to emphasize that *current utility* does not equal *evolutionary origin*. This is a common point of confusion. Also, emphasize that "EEA" is not a specific time/place but a statistical composite.

  11. Final Review against constraints: "For each requirement, give me the reason it's a requirement." "Tell me which are non-negotiable... and which are aspirational." "Flag pairs of desiderata that pull in opposite directions."

      *Okay, ready to write.*
answer: |-
  This is the exact right question to ask. The debate between Evolutionary Psychology (EP) proponents and their critics often stalls because both sides are using different definitions of "evidence." The proponents focus on *functional design*, while critics focus on *historical reconstructability*.

  To move past the ping-pong, you need a falsifiability checklist. Below is the specification for a rigorous evolutionary hypothesis of a psychological trait. I have categorized them by **Function**, **History**, **Alternatives**, and **Mechanism**, and flagged which are **Non-Negotiable** (fail this, and it is fiction) versus **Aspirational** (fail this, and it is weak science, but not necessarily fiction).

  ---

  ### I. The Desiderata Specification

  #### A. Functional Design (The "What")

  **1. Specification of the Adaptive Problem**
  *   **Requirement:** The hypothesis must define the specific recurrent problem in the ancestral environment that the trait solved. It cannot be vague (e.g., "survival"). It must be granular (e.g., "avoiding caloric deficit during seasonal scarcity" vs. "eating").
  *   **Reason:** Natural selection selects *for* solutions to specific problems. If you cannot define the problem, you cannot evaluate the efficiency of the solution.
  *   **Status:** **Non-Negotiable.** Without a defined problem, there is no hypothesis, only a metaphor.

  **2. Evidence of Complex Functional Design**
  *   **Requirement:** The trait must exhibit complexity and specificity that is unlikely to arise by chance or simple physical laws. It should look "engineered" for the specific problem defined in #1.
  *   **Reason:** As Williams (1966) and Dawkins argued, natural selection is the only known process that creates complex functional order. If the trait is simple (e.g., bones breaking under sufficient pressure), it may be a physical necessity, not an adaptation.
  *   **Status:** **Non-Negotiable.** If the trait lacks design features mapping to the problem, it is likely a byproduct.

  **3. Cost-Benefit Analysis**
  *   **Requirement:** The hypothesis must account for the fitness costs of the trait. Adaptations are expensive (metabolically, developmentally, risk-wise). The benefits must outweigh these costs in the ancestral context.
  *   **Reason:** Selection minimizes cost. A trait that is highly costly but offers vague benefits is suspect.
  *   **Status:** **Non-Negotiable.** Ignoring costs is the hallmark of a "just-so story."

  #### B. Ancestral Context (The "When" and "Where")

  **4. EEA Plausibility (Environment of Evolutionary Adaptedness)**
  *   **Requirement:** The adaptive problem must have existed consistently over the deep time during which the trait evolved (typically the Pleistocene for humans). The solution must be technologically feasible for that era.
  *   **Reason:** You cannot adapt to a problem that didn't exist (e.g., adapting to avoid car accidents). The EEA is not a specific place, but a statistical composite of selection pressures over deep time.
  *   **Status:** **Non-Negotiable.** If the pressure is modern (e.g., stock market trading), it cannot be a genetic adaptation (though it could be a cultural one or an exaptation).

  **5. Phylogenetic Continuity or Discontinuity**
  *   **Requirement:** The hypothesis must state whether the trait is human-unique or shared with ancestors/primates. If shared, where does the divergence occur?
  *   **Reason:** Traits do not appear *de novo*. They build on existing architecture. Claiming a trait is unique requires evidence that the underlying machinery is also unique.
  *   **Status:** **Aspirational.** We often lack sufficient fossil/behavioral data on ancestors to be certain, but the claim must not contradict known phylogeny.

  #### C. Ruling Out Alternatives (The "Why Not")

  **6. The Byproduct (Spandrel) Test**
  *   **Requirement:** The hypothesis must explicitly argue why the trait is not a side effect of another adaptation. (e.g., Is reading an adaptation, or a byproduct of visual object recognition + language?)
  *   **Reason:** Many traits are non-adaptive consequences of adaptive traits. Failing to rule this out is the primary criticism from the Gould/Lewontin school.
  *   **Status:** **Non-Negotiable.** You must demonstrate the trait was the *target* of selection, not the *passenger*.

  **7. The Cultural Transmission Test**
  *   **Requirement:** The hypothesis must distinguish between genetic evolution and cultural evolution (memes). Does the trait spread because it aids reproduction (genes) or because it is catchy/useful (culture)?
  *   **Reason:** Universal behaviors can be culturally transmitted (e.g., cooking). Genetic adaptation requires heritability.
  *   **Status:** **Non-Negotiable.** Confusing cultural universals with genetic adaptations is a category error.

  **8. The Mismatch Test**
  *   **Requirement:** The hypothesis should predict where the trait might malfunction in the modern environment (evolutionary mismatch).
  *   **Reason:** If a trait is perfectly optimized for the *modern* world, it likely wasn't selected for in the *ancestral* world (or it's cultural). Adaptations often look "buggy" today (e.g., craving sugar).
  *   **Status:** **Aspirational.** Hard to prove negative, but strong confirming evidence if found.

  #### D. Mechanism and Constraints (The "How")

  **9. Proximate Mechanism (Neurobiology/Genetics)**
  *   **Requirement:** There must be a plausible biological substrate. It doesn't need to be mapped to a gene yet, but it cannot contradict known neuroscience.
  *   **Reason:** Psychology is implemented in biology. If the psychological claim requires magic (e.g., telepathy), it fails.
  *   **Status:** **Aspirational.** We rarely know the specific genes for complex behaviors yet, but the *system* must be biologically plausible.

  **10. Developmental Trajectory**
  *   **Requirement:** The trait should emerge at the developmentally appropriate time (e.g., sexual jealousy at puberty, not age 4).
  *   **Reason:** Adaptations are often switched on by environmental cues during ontogeny. If the timing is random, it suggests noise or pathology.
  *   **Status:** **Aspirational.** Developmental data is hard to gather, but necessary for a complete model.

  **11. Cross-Cultural Universality (with calibrated variation)**
  *   **Requirement:** The underlying *mechanism* should be universal, even if surface *expressions* vary culturally.
  *   **Reason:** Genetic adaptations are species-typical. If a trait exists only in one culture, it is likely cultural. However, adaptive plasticity predicts variation based on local cues (e.g., faster maturation in high-stress environments).
  *   **Status:** **Non-Negotiable.** Total lack of universality kills a claim of genetic adaptation.

  ---

  ### II. The Tensions (Where the Fights Happen)

  Your reading group is likely fighting because these desiderata pull in opposite directions. Satisfying one often makes satisfying another harder.

  **1. Specificity vs. Testability**
  *   **Tension:** To avoid being a "just-so story," a hypothesis must be highly specific about the ancestral problem (Desideratum #1). However, the more specific you are about the Pleistocene, the harder it is to test empirically today (Desideratum #9).
  *   **Result:** Critics say EP is too specific to be testable; Proponents say critics demand impossible standards of historical proof.
  *   **Resolution:** Focus on *present-day design features* that imply past function, rather than trying to dig up the past directly.

  **2. Universality vs. Plasticity**
  *   **Tension:** Genetic adaptations should be universal (Desideratum #11). But a key feature of human adaptation is *conditional strategies* (plasticity), which look like variation.
  *   **Result:** When EP finds variation, critics say "Aha! Not genetic!" EP says "No, it's calibrated plasticity!"
  *   **Resolution:** The hypothesis must predict *what cues* trigger the variation. If the variation is random, it's noise. If it tracks environmental variables (e.g., pathogen load), it's adaptive plasticity.

  **3. Current Utility vs. Historical Origin**
  *   **Tension:** A trait can be useful now but not be an adaptation (Desideratum #4).
  *   **Result:** Proponents often point to current benefits (e.g., "Depression signals need for help"). Critics point out that current benefit $\neq$ historical origin.
  *   **Resolution:** You must demonstrate that the *costs* paid in the ancestral environment were offset by benefits *then*, not just now.

  ---

  ### III. Illustrative Scoring

  Here is how two famous hypotheses score against the Non-Negotiables.

  #### Case A: Disgust as Pathogen Avoidance (Rozin, Haidt, et al.)
  *   **Adaptive Problem:** Ingesting toxins/pathogens. (**Pass:** Specific).
  *   **Functional Design:** Distinct facial expression (nose wrinkle), gag reflex, avoidance learning. (**Pass:** High complexity).
  *   **EEA Plausibility:** Pathogens existed in Pleistocene. (**Pass**).
  *   **Byproduct Test:** Is it just fear? No, disgust has distinct physiology from fear. (**Pass**).
  *   **Universality:** Core disgust triggers (rot, feces) are universal; elicitors vary culturally (pork, beef). (**Pass:** Universal mechanism, calibrated content).
  *   **Verdict:** **Strong Science.** It meets the non-negotiables. It predicts mismatch (e.g., disgust at harmless things like slime) and has physiological correlates.

  #### Case B: Depression as Rumination/Problem-Solving (The Analytical Rumination Hypothesis)
  *   **Adaptive Problem:** Complex social problems requiring analysis. (**Weak:** Vague).
  *   **Functional Design:** Withdrawal saves energy; rumination focuses attention. (**Debatable:** Depression often impairs cognition, not focuses it).
  *   **Cost-Benefit:** Suicide risk is a massive fitness cost. (**Fail:** Hard to argue suicide is an adaptive feature of a problem-solving module).
  *   **Byproduct Test:** Could it be a byproduct of the attachment system (grief response) gone chronic? (**Unresolved:** Plausible alternative).
  *   **Universality:** Rates of depression vary wildly by culture and era. (**Weak:** Suggests strong cultural/modern component).
  *   **Verdict:** **Weak/Contested.** It risks being a just-so story because the "benefit" (rumination) is often outweighed by the "cost" (paralysis/suicide), and alternative medical/byproduct explanations are equally plausible.

  ### IV. How to Use This in Your Group

  When a friend proposes an evolutionary explanation, do not ask "Is it true?" Ask:

  1.  **"What is the specific adaptive problem?"** (If they say "survival" or "reproduction," make them be more specific.)
  2.  **"What is the alternative byproduct hypothesis?"** (Force them to steelman the critic's view.)
  3.  **"What evidence would falsify this?"** (If the answer is "none," it is fiction.)
  4.  **"Where is the mismatch?"** (If the trait works perfectly in modern society, ask why it hasn't been selected *out* if it was costly in the past.)

  If they can answer these, they are doing science. If they retreat to "It makes sense intuitively," they are storytelling.
