answer: |-
  The Pusey–Barrett–Rudolph (PBR) theorem is frequently cited as the definitive proof that the quantum state ($\psi$) must be ontic—that is, a direct representation of physical reality—rather than epistemic, a state of knowledge. However, this conclusion relies on a specific auxiliary assumption: **Preparation Independence (PI)**.

  To argue that PBR does not refute $\psi$-epistemic interpretations, one must demonstrate that PI is not a neutral physical requirement but a substantive metaphysical claim that is fundamentally incompatible with the logic of epistemic models.

  ### 1. The Role of Preparation Independence in the Proof
  The PBR argument relies on a "proof by contradiction." It begins by assuming that $\psi$ is epistemic, meaning that different quantum states (e.g., $|0\rangle$ and $|+\rangle$) correspond to overlapping probability distributions over the underlying physical "ontic" states ($\lambda$).

  If these distributions overlap, there is a non-zero probability that a system prepared in state $|0\rangle$ and a system prepared in state $|+\rangle$ could end up in the *same* physical state $\lambda$ (in the overlap region).

  The theorem then considers two systems prepared independently.
  *   **The Assumption:** If the preparation procedures are physically independent, the joint probability distribution of their ontic states must be the product of their individual distributions:
      $$ \mu_{12}(\lambda_1, \lambda_2) = \mu_1(\lambda_1) \times \mu_2(\lambda_2) $$
  *   **The Contradiction:** This product assumption implies that if there is any overlap, there is a non-zero probability that *both* systems simultaneously occupy the overlap region. PBR constructs a specific entangled measurement that yields a result with probability zero according to quantum mechanics, but a non-zero probability if the systems are in the overlap region.

  Thus, the theorem concludes that the overlap must be zero ($\psi$ is ontic). However, this logic collapses entirely if the joint distribution $\mu_{12}$ is not a simple product of the individual distributions.

  ### 2. The Epistemic Rejection of PI
  The assumption of Preparation Independence conflates **operational independence** (the experimenter’s freedom to choose settings) with **ontic independence** (the statistical independence of the underlying physical variables).

  From an epistemic perspective, there are principled reasons to reject this conflation. If $\psi$ represents knowledge, then $\lambda$ represents the objective reality underlying that knowledge. In many realistic epistemic models, $\lambda$ is not a local property of a particle, but a global property of the system or the universe.

  #### A. Holism and Global Constraints
  In classical statistical mechanics, correlations can arise without interaction if there is a global constraint. For example, if one draws two cards from a single deck without replacement, the draws are operationally "independent" (no signaling), but the outcomes are ontically correlated because they share a common source (the deck).

  Similarly, if the ontic state $\lambda$ describes a configuration of a background field or a universal boundary condition, "preparing" two systems is merely selecting two subsets of a single, holistic reality. Even if the preparation devices are separated by light-years, the ontic states $\lambda_1$ and $\lambda_2$ may be correlated due to their shared origin in the global structure of the universe. Rejecting PI in this context is not a "loophole" but a recognition of the holistic nature of the underlying reality.

  #### B. The Nature of "Independence" in Epistemic Models
  PI assumes that because the *knobs* (control parameters) are independent, the *hidden variables* must be independent. This assumes a specific causal structure (local realism) that epistemic models often reject.

  In an epistemic view, the quantum state is a catalog of expectations based on available information. If the "reality" ($\lambda$) is relational or contextual, the act of preparation does not generate a new, isolated physical state; it updates the relationship between the observer and the system. If the observer shares a common history or environment with both systems, the resulting ontic states can be correlated.

  ### Conclusion
  The PBR theorem proves that **if** independently prepared systems have product distributions of ontic states, **then** the wavefunction must be ontic.

  However, an epistemic interpretation provides a principled reason to reject the antecedent. If the quantum state is knowledge about a holistic or globally constrained reality, then "independent" preparations can yield correlated ontic states. Therefore, the PBR theorem does not refute $\psi$-epistemic interpretations; rather, it demonstrates that such interpretations must be fundamentally non-local or holistic at the ontic level.
