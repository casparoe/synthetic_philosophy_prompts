answer: |-
  **Diagnosis: A Normative-Conceptual Hybrid Disguised as a Descriptive Dispute**

  This disagreement is best diagnosed as a **normative conflict over disciplinary legitimacy**, fought on the terrain of **conceptual analysis**. It is not merely verbal, nor is it a hidden empirical question. It is a substantive clash regarding the *telos* (purpose) of historical inquiry, obscured by a shared fixation on the single label "explanation."

  **Anchoring the Diagnosis**
  The standstill arises because both sides agree on the *phenomenology* of history but disagree on its *evaluation*.
  *   **The Covering-Law Side:** When Hempel argues that historians produce "explanation sketches," he is not making a purely descriptive claim; he is issuing a normative judgment. By defining explanation as "showing [an event] was to be expected given antecedent conditions and general regularities," he imports the criteria of the natural sciences as the gold standard of rationality. The term "sketch" implies incompleteness or deficiency. For this camp, progress in history means making those tacit laws explicit to approach scientific rigor.
  *   **The Narrative Side:** When narrative theorists argue that historians make events intelligible by "situating them within a story" or through "emplotment," they are asserting the sufficiency of the humanistic mode. By emphasizing "agents' reasons" and "contingencies of sequence," they posit a different standard of success: coherence and meaning rather than predictability. For this camp, the absence of laws is not a deficit but a feature of dealing with human agency.

  The dispute is **conceptual** because it turns on the definition of the word "explanation." However, it is **normative** because the definition is weaponized to determine whether history is a "soft science" striving for general knowledge (Covering-Law) or a distinct hermeneutic discipline aiming for the "understanding of particulars" (Narrative). They agree on "what historians actually produce" (narratives without explicit laws), but the Covering-Law model treats this as a failure to meet an external standard, while the Narrative model treats it as the successful fulfillment of an internal one.

  **Why the Standstill Persists**
  Progress has been impossible because the debate is structured as a zero-sum game for a single title. Both sides are fighting for the monopoly on the word "explanation" because it confers epistemic authority.
  *   If the Covering-Law side wins, history is subordinate to natural science methodology.
  *   If the Narrative side wins, history is insulated from scientific critique but risks being labeled "subjective" or "literary."
  Because the stakes are disciplinary identity rather than factual accuracy, empirical findings (e.g., testing whether narratives tacitly rely on laws) fail to resolve the issue. Any "tacit law" posited by the Covering-Law side can be dismissed by the Narrative side as trivial or post-hoc, while any claim of unique narrative intelligibility can be dismissed by the Covering-Law side as psychological comfort rather than logical explanation.

  **What Counts as Progress: A Reformulated Question**
  Given this diagnosis, a verdict on "who is right" is the wrong goal. Progress requires a **reformulated question** that dissolves the monopoly of the term "explanation."

  The field should move from asking *"Is narrative explanation really explanation?"* to **"What distinct epistemic goods do nomological and narrative forms provide?"**

  This requires adopting a framework of **Explanatory Pluralism**. Progress would look like a taxonomy that distinguishes between:
  1.  **Explanation-as-Expectability:** (The Covering-Law strength) Useful for identifying structural causes, broad trends, and counterfactual dependencies.
  2.  **Explanation-as-Intelligibility:** (The Narrative strength) Useful for tracing agency, moral responsibility, and the temporal configuration of meaning.

  **Why No Other Progress is Possible**
  If the debate remains framed as a competition for the single label "explanation," no progress should be expected. This is because the disagreement is not about the world (the historical facts are agreed upon) but about the *criteria of validation*.
  *   **Empirical findings** cannot settle normative preferences for what counts as understanding.
  *   **Formal results** cannot capture the "configurational work of narrative form."
  *   **Verbal distinctions** alone will fail unless they are tied to the functional aims of the inquirer.

  Therefore, the only productive path is to acknowledge that "explanation" is a polysemous concept serving different cognitive interests. The standstill will only break when philosophers of history stop asking whether narrative *is* explanation (in the scientific sense) and start asking *how* narrative generates understanding (in the humanistic sense), thereby granting both traditions legitimacy within their respective domains of utility.
