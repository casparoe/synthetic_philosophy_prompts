  # ADVERSARIAL COLLABORATION PROTOCOL: THE COLOR PHI PHENOMENON
  **Date:** October 26, 2023
  **Parties:** The "Pre-Access Integration" Group (formerly Stalinesque) & The "Post-Perceptual Reconstruction" Group (formerly Orwellian)
  **Subject:** Temporal Dynamics of Feature Binding in Apparent Motion

  ## PREAMBLE
  This document formalizes the ongoing debate regarding the neural and cognitive timing of the Color Phi Phenomenon. Both parties acknowledge Daniel Dennett's (1991) critique that the traditional Stalinesque/Orwellian dichotomy presupposes a "Cartesian Theater" (a definitive finish line for consciousness) which likely does not exist. 

  However, both parties agree that translating this metaphysical critique into **functional architecture** yields a testable empirical dispute: *At what stage of processing is the bound representation (motion + color change) made available to downstream cognitive systems (memory, motor planning, verbal report)?* This document isolates that empirical question.

  ---

  ## I. AGREED SUBSTANTIVE CLAIMS
  *Both parties affirm the following claims. Disagreement on any of these points voids this collaboration.*

  1.  **Stimulus Invariance:** The physical stimulus sequence consists of Discrete Event A (Red, Left, $t_1$) and Discrete Event B (Green, Right, $t_2$). No physical stimulus exists in the inter-stimulus space.
  2.  **Report Consistency:** Under specific Inter-Stimulus Intervals (ISI ≈ 60ms), subjects reliably report a single object moving continuously from Left to Right, undergoing a color change mid-trajectory.
  3.  **Processing Latency:** Neural processing is not instantaneous. Awareness of Event A cannot be "finalized" before Event B is physically presented and processed, given the latency of V1/V4 transmission and integration.
  4.  **Postdictive Necessity:** Both sides agree the phenomenon requires *postdiction* (later information influencing the interpretation of earlier information). The disagreement is strictly about *how far back* that influence propagates in the processing hierarchy.
  5.  **No Cartesian Theater:** Both sides agree to operationalize "experience" not as a metaphysical moment of "seeing," but as the **availability of information** to specific reporting or behavioral systems. We are arguing about processing stages, not homunculi.
  6.  **Dissolved Verbal Dispute:** We acknowledge that the question *"When did the subject really see it?"* is ill-posed if it implies a single timestamp. We agree to replace this with: *"At which processing stage is the illusory binding formed relative to the stage required for [Specific Task X]?"*

  ---

  ## II. TABLE OF RESIDUAL DISAGREEMENTS
  *The following table isolates the mechanistic disagreement. Phrasing has been negotiated to ensure neither side feels straw-manned.*

  | Feature of Dispute | **Pre-Access Integration (Stalinesque)** | **Post-Perceptual Reconstruction (Orwellian)** |
  | :--- | :--- | :--- |
  | **Locus of Binding** | The bound percept (motion + color switch) is constructed in **sensory/peri-sensory cortex** prior to access by working memory or motor systems. | The raw sensory data (Red-Left, Green-Right) are processed veridically; the bound percept is constructed in **narrative/memory systems** during or after the request for report. |
  | **Information Availability** | The illusory representation is the **primary input** to downstream systems. If a system can report on it, it "saw" the illusion. | The illusory representation is a **secondary reconstruction**. Downstream systems may have access to veridical data (two flashes) even if verbal report claims an illusion. |
  | **Role of Memory** | Memory stores the *already-edited* movie. The error is perceptual. | Memory stores the *raw frames*, but the retrieval process generates the *edited* movie. The error is mnemonic/narrative. |
  | **Neural Signature** | We expect ERP/EEG signatures of the "color change" to correlate with **early visual components** (e.g., N1/V4 activity) modulated by the second stimulus. | We expect ERP/EEG signatures of the "color change" to correlate with **late cognitive components** (e.g., P3b, parietal activity) associated with memory retrieval or decision making. |
  | **Behavioral Implication** | Rapid, non-verbal responses (e.g., saccades, priming) should reflect the **illusion** (mid-path color change). | Rapid, non-verbal responses should reflect the **veridical stimulus** (two static dots), diverging from verbal report. |

  ---

  ## III. EMPIRICAL CRUXES & ADJUDICATION TESTS
  *For each crux, we propose a concrete experimental manipulation. Both sides commit to updating their credence based on the outcome.*

  ### Crux 1: The "Motor Reflex" Test
  **Question:** Is the illusory binding available to fast, dorsal-stream motor systems before ventral-stream verbal report systems?
  **Method:** Subjects view Color Phi. Instead of verbal report, they must make a rapid saccade or button press to the *location* where the color changed. Alternatively, use a priming task: immediately after the Phi sequence, flash a probe color at the mid-point. Measure reaction time to identify the probe.
  **Prediction (Pre-Access):** Subjects will saccade to the mid-point faster than chance, or show priming facilitation for the *illusory* color (e.g., if illusion is Red→Green, they prime for Green at mid-point). The illusion drives action.
  **Prediction (Post-Perceptual):** Rapid motor responses will track the **veridical** stimuli (Left/Right locations only, no mid-point target; or no priming for mid-point color). The illusion appears only in slow, retrospective verbal report.

  ### Crux 2: The "Memory Interference" Test
  **Question:** Does disrupting working memory *after* the stimulus sequence abolish the illusion?
  **Method:** Present Color Phi sequence. Immediately following $t_2$, impose a high-load distractor task (e.g., digit span or TMS over parietal memory areas) *before* the subject can report.
  **Prediction (Pre-Access):** The illusion persists. Since the percept was integrated pre-access, the distractor cannot "un-bind" the already-formed sensory object. Report remains "moving color change."
  **Prediction (Post-Perceptual):** The illusion rate drops significantly. The distractor disrupts the reconstruction process required to weave the two flashes into a narrative. Subjects may report "two flashes" or "unsure."

  ### Crux 3: The "Neural Latency" Test (EEG/MEG)
  **Question:** When does the neural signature of the "color change" emerge relative to the processing of the second dot?
  **Method:** High-density EEG. Time-lock to the onset of the second (Green) dot. Look for activity corresponding to "Red-to-Green transition" vs. "Green onset."
  **Prediction (Pre-Access):** We will see modulation in visual cortex (V4/MT) *before* 200ms. The brain actively suppresses the "Green onset" signature in favor of a "Transition" signature early in the visual stream.
  **Prediction (Post-Perceptual):** Early visual components (N1/P1) will reflect the veridical "Green onset." The "Transition" signature will only appear in late components (>300ms, P3b) associated with context updating and memory consolidation.

  ### Crux 4: The "Forced-Choice Veridicality" Test
  **Question:** Can subjects access the veridical data if the illusory report option is removed?
  **Method:** Instead of asking "What did you see?", offer a forced choice: "Did you see: (A) One moving dot changing color" vs. (B) Two stationary dots flashing." Then, add a third option: (C) One moving dot, constant color.
  **Prediction (Pre-Access):** Subjects cannot choose (B). The veridical data is overwritten; it is cognitively impenetrable. They are forced to choose the illusion (A).
  **Prediction (Post-Perceptual):** Under specific framing or confidence ratings, subjects can access the veridical data. If incentivized for accuracy over coherence, reports of (B) will increase, suggesting the veridical data is available but usually overridden by a narrative bias.

  ---

  ## IV. NOTE ON DISSOLVED DISPUTES
  *Per the collaboration agreement, we explicitly note where the fight has been deemed verbal or metaphysical rather than empirical.*

  1.  **The "Moment of Consciousness":** Both sides agree there is no single neural timestamp that marks "entry into consciousness." Arguments relying on phrases like *"But when did they REALLY see it?"* without specifying a downstream system (memory, motor, speech) are hereby ruled out of order.
  2.  **The Homunculus:** Both sides agree that no central observer "views" the display. The Stalinesque view is not literally a little man in the head watching an edited film; it is a claim about **feedforward integration**. The Orwellian view is not literally a historian rewriting texts; it is a claim about **feedback reconstruction**.
  3.  **Qualia Ineffability:** Arguments relying on the private, ineffable nature of the qualia are suspended. We are measuring reportable information availability.

  ---

  **Signatures:**

  _________________________ (Lead, Pre-Access Integration Group)

  _________________________ (Lead, Post-Perceptual Reconstruction Group)

  _________________________ (Lab PI / Arbiter)
