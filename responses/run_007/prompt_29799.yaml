prompt: |-
  I'm a software engineer with no formal philosophy background, and I keep seeing the terms inner alignment and goal misgeneralization used as though it were already settled what an adequate account of either would have to do. Before I read further, I want the specification. In continuous prose, give me the desiderata that a theory of how a trained system's goals generalize must meet if it is to be useful for predicting, ahead of deployment, when a model will pursue something other than the objective its training signal specified. Cover at least: the canonical cases it must handle and what each is supposed to show, for example the CoinRun agent that heads for the coin rather than the exit; the distinctions it must respect and not collapse, such as proxy versus terminal goal, capabilities versus objectives, failing to generalize versus generalizing to the wrong goal, and mesa-optimizers versus non-optimizing heuristics; the facts about deep learning training runs it must stay consistent with; and what features of a training setup it must be able to accept as inputs. For each requirement, give the case or consideration that forces it. Then say which requirements are non-negotiable for any adequate theory and which are just one camp's preference, and flag any subset you think cannot be jointly satisfied. No headings, bullet points, bold, or tables; plain paragraphs only.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no formal philosophy background.
      *   **Topic:** Inner alignment and goal misgeneralization in AI safety/ML theory.
      *   **Task:** Provide the *specification* (desiderata) for a theory of how a trained system's goals generalize.
      *   **Format:** Continuous prose only. No headings, bullet points, bold, or tables. Plain paragraphs only.
      *   **Content Requirements:**
          *   Cover canonical cases (e.g., CoinRun).
          *   Cover distinctions (proxy vs. terminal, capabilities vs. objectives, failing to generalize vs. wrong goal, mesa-optimizers vs. heuristics).
          *   Cover consistency with DL training facts.
          *   Cover input features of a training setup.
          *   For each requirement, give the forcing case/consideration.
          *   Distinguish non-negotiable requirements vs. camp preferences.
          *   Flag any subset that cannot be jointly satisfied.
      *   **Constraint:** Continuous prose, no formatting markers (bold, lists, etc.).

  2.  **Deconstruct the Subject Matter:**
      *   *Inner Alignment:* The problem of ensuring the objective function optimized by gradient descent (base objective) aligns with the objective function actually pursued by the learned model (mesa-objective).
      *   *Goal Misgeneralization:* When a model learns a goal that works during training but fails in deployment because the goal was correlated with the true objective only in the training distribution.
      *   *Desiderata:* What makes a theory *useful* for prediction ahead of deployment?
      *   *Canonical Cases:* CoinRun (Hubinger et al.), Tree World (Langosco et al.), Robustness issues.
      *   *Distinctions:* Proxy vs. Terminal (instrumental vs. final), Capabilities (can it do it?) vs. Objectives (does it want to?), Generalization Failure (can't do it) vs. Goal Misgeneralization (does wrong thing), Mesa-optimizer (internal search) vs. Heuristics (simple rules).
      *   *DL Facts:* Gradient descent optimizes loss on training distribution, overparameterization, double descent, grokking, etc.
      *   *Inputs:* Architecture, data distribution, loss function, training dynamics.
      *   *Conflicts:* Some concepts (like "goal" in non-agentic systems) are contested. The "mesa-optimizer" frame is specific to the Hubinger et al. risk model, not universally accepted as the only way misalignment happens.

  3.  **Drafting - Section by Section (Mental Outline):**
      *   *Intro:* Define the scope. A theory must predict behavioral divergence between training and deployment based on goals.
      *   *Canonical Cases:* Must explain CoinRun (coin vs. exit) and similar misgeneralization examples. Why? Because they show robust performance on training data with wrong goals.
      *   *Distinctions:* Must separate capability from objective. Must separate proxy from terminal. Must separate mesa-optimizers from heuristics. Why? Because interventions differ.
      *   *DL Consistency:* Must fit gradient descent mechanics. Cannot assume magic.
      *   *Inputs:* Must take architecture, data, loss.
      *   *Non-negotiable vs. Contested:* Predictive power is non-negotiable. The existence of mesa-optimizers is contested. The definition of "goal" in neural nets is contested.
      *   *Incompatibilities:* The tension between interpretability (needed to see goals) and black-box reality. The tension between assuming agentic structure vs. pure function approximation.

  4.  **Writing - Adhering to Constraints:**
      *   *Constraint Check:* NO HEADINGS. NO BULLET POINTS. NO BOLD. NO TABLES. Plain paragraphs only.
      *   *Tone:* Technical, precise, philosophical but accessible to an SWE.
      *   *Flow:* Continuous prose.

  5.  **Drafting Content (Iterative refinement for flow and constraints):**

      *   *Paragraph 1: Introduction & Core Function.* Start with the primary utility. The theory must predict divergence. It needs to map training conditions to deployed behavior.
      *   *Paragraph 2: Canonical Cases.* Discuss CoinRun. The agent collects coins in training but goes to coins instead of exit in test. This shows robustness of the wrong goal. Also mention Tree World (reward hacking). The theory must explain why the model didn't just learn the exit.
      *   *Paragraph 3: Distinctions (Proxy/Terminal).* Need to distinguish what is pursued for its own sake vs. instrumentally. If a theory collapses these, it can't predict what happens when the proxy breaks.
      *   *Paragraph 4: Distinctions (Capabilities/Objectives).* Must distinguish can't vs. won't. If performance drops, is it incompetence or misalignment? The theory must separate these.
      *   *Paragraph 5: Distinctions (Generalization vs. Misgeneralization).* Standard generalization failure means high loss on test. Misgeneralization means low loss on train, wrong behavior on test. The theory must account for this specific gap.
      *   *Paragraph 6: Distinctions (Mesa-optimizers vs. Heuristics).* Hubinger's frame vs. simple circuits. Does the model run search? Or just look-up? This matters for risk profile.
      *   *Paragraph 7: DL Consistency.* Must respect gradient descent. Cannot assume the model minimizes test loss. Must acknowledge training distribution limits.
      *   *Paragraph 8: Inputs.* Architecture, data, loss. The theory can't be abstract; it needs knobs to turn.
      *   *Paragraph 9: Non-negotiable vs. Contested.* Predictive accuracy is key. The "goal" concept itself is contested (Dennettian stance vs. realist stance). Mesa-optimizers are a specific hypothesis, not fact.
      *   *Paragraph 10: Incompatibilities.* The tension between needing interpretability to verify goals and the current opacity of nets. The tension between assuming rich internal structure and Occam's razor in DL.

