  *(Final check on the "Existence" issue)*: The user worries about defining "existence." Under FDT, existence is about where the algorithm has causal/logical leverage. Simulations count because the algorithm runs there. Everett branches count *if* the decision is identical across branches due to shared initial logic. Boltzmann brains don't count because they are random fluctuations, not logical instantiations of the agent's algorithm.

