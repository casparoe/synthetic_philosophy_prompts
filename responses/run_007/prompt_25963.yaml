      *   *Existence:* In FDT/TDT, "existence" matters less than "logical instantiation." If a simulation is running, the algorithm exists logically. If an Everett branch exists, does the *same* algorithm run there? Only if the initial conditions and physics dictate the same logical output.
      *   *Tractability:* Bounded rationality is real. FDT is often defined for ideal agents. For real agents, we use approximations. The "intractability" objection (Step 6) is practical, not necessarily normative, but it does suggest we need heuristics. However, the *logical correlation* filter solves most of the volume problem before we get to computation.

  6.  **Develop the Response Structure:**
