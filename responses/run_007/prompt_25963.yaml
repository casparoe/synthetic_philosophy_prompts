      *   *Response:* Only if their reasoning *depends* on my actual decision in a counterfactual sense. If they are just simulating a *model* of me, that's a link. If they are just guessing, it's not.
      *   *The "Reference Class" Problem:* How similar must the algorithm be? This is the hard part. If they run a slightly different version of FDT, do we trade? This is where the "principled line" is fuzzy, but it's better than "everyone."
      *   *Focus on the Professor's Hint:* The professor mentioned "logical counterfactuals." Lean heavily into that. The error is treating AT like evidential decision theory (EDT) where correlation is enough. AT requires FDT/TDT where *causal* (logical) links are needed.

