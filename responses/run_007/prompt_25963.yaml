      *   **Explain the Fix:** Introduce the concept of *Subjunctive Dependence* or *Logical Correlation*. You don't trade with anyone you can predict; you trade with anyone whose decision is *logically entangled* with yours.
      *   **Apply the Fix:** Show how this filters out Boltzmann brains and random multiverse agents (no logical link) while keeping Simulators (they run your code).
