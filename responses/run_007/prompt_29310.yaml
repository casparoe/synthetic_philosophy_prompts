      *   **Debrief Requirements:** Map to Risk vs. Ambiguity, explain why personal probability fails here, discuss the cost of calling it "mistakes," do *not* name the paradox until the end.
      *   **Logistics:** Predict potential failures and limitations of the physical setup.

  2.  **Deconstruct the Ellsberg Paradox:**
      *   *Standard Setup:*
          *   Urn A (Known): 50 Red, 50 Black.
          *   Urn B (Unknown): 100 balls, Red/Black mix unknown.
      *   *Choice 1:* Bet on Red from Urn A vs. Bet on Red from Urn B. (Most choose A).
      *   *Choice 2:* Bet on Black from Urn A vs. Bet on Black from Urn B. (Most choose A).
      *   *The Contradiction:* If I prefer A in Choice 1, I imply $P(Red_A) > P(Red_B)$. Since $P(Red_A) = 0.5$, I imply $P(Red_B) < 0.5$. If I prefer A in Choice 2, I imply $P(Black_A) > P(Black_B)$. Since $P(Black_A) = 0.5$, I imply $P(Black_B) < 0.5$. But $P(Red_B) + P(Black_B)$ must equal 1. They can't both be less than 0.5.
