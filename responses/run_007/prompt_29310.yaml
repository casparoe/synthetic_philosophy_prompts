answer: |-
  # Activity Plan: The Two-Bag Challenge

  **Time:** 60 Minutes
  **Participants:** 15 High School Juniors/Seniors
  **Goal:** Experience ambiguity aversion firsthand without prior theory.
  **Stakes:** Raffle Tickets (e.g., 1 ticket per win; 5 tickets = entry into a draw for a $20 gift card or pizza lunch).

  ## Part 1: Setup & Materials (5 Minutes)

  **Props Needed:**
  1.  **Bag A (The Known Bag):** Opaque, but with a clear window or simply shown openly before sealing. Contains exactly **10 Red** and **10 Black** tokens.
  2.  **Bag B1 (The Fixed Unknown):** Opaque. Contains **20 tokens** (Red/Black mix). *Preparation:* Before the session, have a trusted student or colleague fill this bag behind a screen with any mix they like (e.g., 3 Red, 17 Black). Seal it. No one else knows the count.
  3.  **Bag B2 (The Random Unknown):** Opaque. Contains **20 tokens**. *Preparation:* Determine the mix using a randomizing device (e.g., flip a coin for each of the 20 slots: Heads=Red, Tails=Black). Record the result in a sealed envelope. Do not look at it.
  4.  **Decision Cards:** Small slips of paper for students to write their choices.
  5.  **Whiteboard:** To tally results.

  **Room Arrangement:**
  Split the room into two groups (Group 1 and Group 2) of roughly 7–8 students each.
  *   **Group 1** will play with **Bag B1 (Fixed Unknown)**.
  *   **Group 2** will play with **Bag B2 (Random Unknown)**.

  ## Part 2: The Game (20 Minutes)

  **Introduction (5 mins):**
  Gather everyone. Explain the goal: "We are testing how people make choices when winning depends on luck. You will make two decisions. For each decision, if you win, you get a raffle ticket."

  **The Setup (5 mins):**
  1.  **Show Bag A:** Hold it up. Pour the 10 Red and 10 Black tokens into a clear tray, count them visibly, and put them back in Bag A. Seal it. "Everyone agrees: 50% Red, 50% Black."
  2.  **Introduce Bag B (The Unknown):**
      *   Tell **Group 1**: "This bag was filled by a person behind a screen. There are 20 tokens inside, some Red, some Black. We do not know the mix. It could be all Red, all Black, or anything in between."
      *   Tell **Group 2**: "This bag was filled by a random machine (coin flips). There are 20 tokens inside. The *process* was random, but we do not have the report of the outcome. It could be all Red, all Black, or anything in between."
      *   *Crucial:* Emphasize that for *both* groups, the exact number of Red vs. Black is **unknown to them**.

  **Round 1: The Red Bet (5 mins):**
  Hand out Decision Cards.
  *   **Instruction:** "You win a ticket if you draw a **RED** token. You must choose **Bag A** OR **Bag B**. You cannot choose both. Write your choice secretly."
  *   Collect cards. Do not reveal results yet.

  **Round 2: The Black Bet (5 mins):**
  Hand out new Decision Cards.
  *   **Instruction:** "New round. You win a ticket if you draw a **BLACK** token. You must choose **Bag A** OR **Bag B**. Write your choice secretly."
  *   Collect cards.

  **The Draw (5 mins):**
  1.  Ask one student from Group 1 and one from Group 2 to come forward.
  2.  Have them draw one token from Bag A (replace it) and one from their respective Bag B (replace it).
  3.  Reveal the colors. Distribute tickets to winners based on their *actual* choices (you will need to quickly grade their cards).
  4.  *Note:* The actual winning doesn't matter as much as the pattern of choices, but the payout makes it real.

  ## Part 3: The Reveal & Data Tally (10 Minutes)

  Draw a table on the whiteboard:

  | Group | Round 1 (Bet on Red) | Round 2 (Bet on Black) |
  | :--- | :--- | :--- |
  | **Group 1 (Fixed)** | How many chose A? \_\_\_ | How many chose A? \_\_\_ |
  | **Group 2 (Random)** | How many chose A? \_\_\_ | How many chose A? \_\_\_ |

  **Fill in the blanks.**
  *   *Expected Result:* In both groups, the majority will choose **Bag A** for Round 1 AND **Bag A** for Round 2.
  *   *Compare Groups:* Ask Group 2: "Did knowing it was a random machine make you trust Bag B more than Group 1 trusted their person-filled bag?" (Likely answer: No, or not much).

  ## Part 4: The Debrief (25 Minutes)

  *Do not mention "Ellsberg" yet.*

  **1. The Contradiction (5 mins)**
  Focus on a student who chose Bag A for *both* rounds.
  *   **Facilitator:** "In Round 1, you picked Bag A to get Red. That suggests you thought Bag A was *more likely* to give Red than Bag B. Since Bag A is 50%, you were acting like Bag B had *less than 50%* Red."
  *   **Facilitator:** "In Round 2, you picked Bag A to get Black. That suggests you thought Bag A was *more likely* to give Black than Bag B. Since Bag A is 50%, you were acting like Bag B had *less than 50%* Black."
  *   **The Kicker:** "But Bag B only has Red and Black. If Red is less than 50%... and Black is less than 50%... where did the rest of the probability go? Mathematically, they have to add up to 100%."
  *   *Let them sit with this impossibility.*

  **2. Risk vs. Ambiguity (5 mins)**
  *   **Facilitator:** "Bag A represents **Risk**. We know the odds. We can calculate the value. Bag B represents **Ambiguity**. We know there *are* odds, but we don't know *what* they are."
  *   **Discussion:** "Why did Bag B feel 'dangerous' even though, logically, the average mix of Bag B over many experiments would probably be 50/50?"
  *   **Key Insight:** Students will likely say, "I didn't trust it," or "I felt like I couldn't calculate it." This is **Ambiguity Aversion**. We prefer known risks to unknown uncertainties, even if the expected value is the same.

  **3. The "Mistake" Argument (5 mins)**
  *   **Facilitator:** "An economist might say you made a mistake. If you truly believe Bag B is worse for Red AND worse for Black, I can take your money."
  *   **The Money Pump:** "Imagine I sell you a ticket for Bag A-Red for $1. Then I offer to swap it for Bag A-Black for $0.50. Then I offer to swap that for Bag B-Black... wait, no."
  *   *Simpler version:* "If you prefer A over B for Red, and A over B for Black, you are treating B as 'inferior' in every state. But B is just A with the label hidden. If I offered to let you switch from B to A for a penny fee before the game started, you'd pay. But if I offered to switch you back after telling you 'Actually, I'm betting on Black now,' you'd pay again. You could be pumped for fees forever."
  *   **Point:** Insisting these choices are rational requires giving up the idea that people always act to maximize a consistent "personal probability."

  **4. Naming the Paradox (5 mins)**
  *   **Facilitator:** "This specific contradiction was identified by Daniel Ellsberg in 1961. It's called the **Ellsberg Paradox**."
  *   **Context:** Ellsberg was studying nuclear strategy. He realized models assuming people calculate probabilities perfectly failed to predict real human behavior in crises. People freeze or stick to the "known" plan even when the "unknown" plan might be better.

  **5. Variants Discussion (5 mins)**
  *   **Facilitator:** "We split the room. Group 1 had a person fill the bag. Group 2 had a machine fill the bag. Did it change your mind?"
  *   **Discussion:** Usually, it doesn't change the choice much. This shows the aversion isn't just about distrusting *people*; it's about the lack of *information*. Even if the world is random (Group 2), if *you* don't know the outcome, it feels ambiguous.

  ---

  ## Predictable Failures & How to Handle Them

  **1. The "Hedging" Strategy**
  *   **What goes wrong:** A savvy student realizes that if they pick Bag A for Red and Bag B for Black, they cover more bases *if* Bag B happens to be mostly Black. They might try to pick A for Round 1 and B for Round 2 to be "logical."
  *   **Fix:** Emphasize in the instructions: "Make each choice as if it is the *only* choice that matters. Don't try to combine rounds." If someone does hedge, acknowledge it in the debrief: "You tried to balance the risk. But most people didn't do that; they avoided the unknown entirely."

  **2. The "It's Obviously 50/50" Objection**
  *   **What goes wrong:** A student argues, "Bag B has to be 50/50 on average, so there's no difference."
  *   **Fix:** Agree with them! "You are mathematically right. The *expected* value is the same. But your *gut* told you Bag A was safer. The paradox isn't about math; it's about why your gut overrides the math when information is missing."

  **3. Low Stakes Apathy**
  *   **What goes wrong:** Students don't care about the raffle ticket and pick randomly.
  *   **Fix:** Make the prize visible (e.g., put the gift card on the table). Keep the energy high. If data is noisy (no clear pattern), admit it: "In a lab with cash, the pattern is strong. Today, maybe the stakes were too low to feel the fear. But did anyone *feel* a hesitation with Bag B?"

  ## Limitations of the Physical Game

  Be honest with the students about what this classroom version *cannot* do:

  1.  **Single Shot vs. Repeated:** In real life, if you play the "Unknown Bag" 1,000 times, the law of large numbers saves you. The paradox is strongest in **one-off decisions** (like launching a new product or going to war). This game is one-off, which is good, but students might think "If I played more, I'd learn the mix."
      *   *Supply in discussion:* "In the real world, we often don't get to play the round twice. We have to decide once."
  2.  **Finite vs. Infinite:** The bag has 20 balls. Real-world ambiguity (e.g., "Will the stock market crash?") doesn't have a fixed number of outcomes.
      *   *Supply in discussion:* "The bag is a simple model. Real ambiguity is messier—we often don't even know what the 'colors' are."
  3.  **The "Random" Variant Nuance:** In Group 2 (Random Process), a sophisticated student might argue that the probability *is* known (it's a binomial distribution centered on 50/50).
      *   *Supply in discussion:* "Technically, Group 2 had 'Second-Order Risk.' But psychologically, if you don't see the report, it feels like Ambiguity. The brain treats 'unknown data' and 'unknown process' very similarly."

  ## Closing Script

  "We started by asking how we decide when we don't know the odds. You discovered that when the odds are hidden, we act as if the odds are *worse*, even when we know they can't be. We treat ambiguity as a penalty. Next time you face a choice between a known risk and an unknown one, ask yourself: Am I avoiding this because it's actually dangerous, or just because I can't see the balls in the bag?"
