prompt: |-
  I'm a novelist — I've published three books, I teach fiction workshops, and I spend most of my waking hours thinking about dialogue, point of view, and what happens between characters in a scene. Recently I've been reading around in philosophy of language, and I keep coming across speech act theory: Austin's distinction between locutionary, illocutionary, and perlocutionary acts; Searle's taxonomy of illocutionary forces; the idea that certain utterances don't describe the world but change it — performatives, felicity conditions, uptake. What strikes me is that novelists already have a working vocabulary for many of these phenomena, though we don't use those terms. We talk about dialogue as action, about what a line of speech does to the power balance in a scene, about promises made and broken, about the difference between what a character says and what they're doing by saying it. We have concepts like subtext, narrative distance, free indirect discourse, interiority, scene versus summary, showing versus telling — all of which seem to be getting at something in the neighborhood of what the philosophers are after.

  I'd like you to do a systematic translation. Restate the core claims of speech act theory — Austin and Searle, primarily — in the vocabulary a novelist would use: the craft terms we reach for when we're revising a scene or diagnosing why a stretch of dialogue isn't working. Go concept by concept. But the real deliverable is the residue report: which distinctions translate cleanly into the novelist's vocabulary, which ones you had to distort to make them fit, and which ones have no expression at all in how we think about fiction. I want to know whether the untranslatable residue points to something the philosophers are tracking that novelists are blind to — something we'd write better dialogue if we understood — or whether it points to philosophical distinctions that don't earn their keep once you're actually trying to make language do work on the page.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A published novelist and fiction workshop teacher. Deeply familiar with craft terms (subtext, POV, scene/summary, etc.). Recently exploring philosophy of language (Speech Act Theory - SAT).
      *   **Task:** Systematically translate core claims of Speech Act Theory (Austin, Searle) into novelist/craft vocabulary.
      *   **Key Deliverable:** A "Residue Report." This needs to identify:
          *   What translates cleanly.
          *   What requires distortion/forcing.
          *   What is untranslatable (the residue).
      *   **Goal:** Determine if the residue reveals a blind spot for novelists (something to learn) or if it's philosophical baggage (distinctions that don't matter for fiction).
      *   **Tone:** Professional, peer-to-peer, intellectually rigorous but grounded in the practicalities of writing fiction. Avoid academic jargon where possible, or explain it through craft.

  2.  **Deconstruct Speech Act Theory (SAT) Core Concepts:**
      *   *Austin:*
          *   Constative vs. Performative (later collapsed).
          *   Locutionary Act (saying something).
          *   Illocutionary Act (doing something in saying it).
          *   Perlocutionary Act (doing something by saying it/effects).
          *   Felicity Conditions (conditions for success).
          *   Uptake (hearer's recognition).
      *   *Searle:*
          *   Taxonomy of Illocutionary Acts (Assertives, Directives, Commissives, Expressives, Declarations).
          *   Constitutive Rules vs. Regulative Rules.
          *   Background/Context.

  3.  **Drafting the Translation (Concept by Concept):**

      *   *Locutionary:* The literal text. The "words on the page." *Craft term:* Dialogue line, syntax, diction.
      *   *Illocutionary:* The action *in* the speech. *Craft term:* Beat, action tag, subtext, intention, objective (Stanislavski). "What the character is *doing*."
      *   *Perlocutionary:* The effect on the listener. *Craft term:* Reaction, reversal, turn, emotional shift.
      *   *Performative:* Utterances that make it so. *Craft term:* Plot points, vows, declarations that change the status quo.
      *   *Felicity Conditions:* Does the speech "work"? *Craft term:* Verisimilitude, characterization consistency, stakes. If a private says "I court-martial you," it fails (wrong authority).
      *   *Uptake:* Did the listener get it? *Craft term:* Listening, reaction shot, miscommunication (comedy/tragedy).
      *   *Searle's Taxonomy:*
          *   Assertives -> Exposition/Information.
          *   Directives -> Commands/Requests (Conflict).
          *   Commissives -> Promises/Threats (Stakes).
          *   Expressives -> Emotion/Voice.
          *   Declarations -> Status changes (Plot).

  4.  **Developing the Residue Report (The Critical Analysis):**

      *   *Clean Translations:* Illocution = Action/Intention. Perlocution = Reaction/Turn. Felicity = Verisimilitude/Authority.
      *   *Distorted/Forced:* Searle's rigid taxonomy feels too clinical for fiction. Fiction thrives on ambiguity; SAT wants to categorize force.
      *   *The Untranslatable Residue:*
          *   *Institutional Fact vs. Brute Fact:* SAT cares deeply about social institutions (marriage, law). Fiction cares about *emotional* truth, which might bypass institutions.
          *   *The "Hearer's State":* SAT focuses on successful communication. Fiction often focuses on *failed* communication (dramatic irony, misunderstanding).
          *   *Iterability/Context:* SAT assumes a stable context. Fiction *creates* context through narrative voice.
          *   *The "Serious" vs. "Non-Serious":* Austin excluded poetry/fiction as "etiolated" language. This is the biggest friction point.

  5.  **Synthesizing the Insight (The "So What?"):**
      *   Does the residue help novelists?
      *   *Yes:* "Uptake" is often underwritten. Writers write the line, forget the reaction. "Felicity" helps diagnose why a threat feels empty (lack of authority/stakes).
      *   *No:* The rigid categorization can sterilize subtext. Fiction is often about the *gap* between illocution and perlocution.
      *   *The Big Blind Spot:* Austin dismissed fiction as "non-serious." But for a novelist, fiction is the *ultimate* speech act. It creates worlds. The philosopher looks at language describing the world; the novelist uses language to *be* the world.

  6.  **Refining the Tone:**
      *   Ensure I sound like I respect their craft. Use terms like "beat," "turn," "objective," "narrative distance."
      *   Don't talk down about the philosophy, but don't worship it either. Treat it as a toolset.
      *   Structure clearly: Introduction -> The Translation -> The Residue Report -> Conclusion.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address Austin's exclusion of fiction? *Correction:* Yes, crucial point. Austin called literary language "parasitic." I need to highlight this irony.
      *   *Check:* Is Searle's taxonomy useful? *Correction:* It's useful for diagnosing flat scenes (e.g., too many assertives/exposition, not enough directives/commissives).
      *   *Check:* Is the distinction between Illocution and Perlocution clear? *Correction:* Use the "Action vs. Effect" analogy. Illocution = The punch thrown. Perlocution = The bruise/fall.

  8.  **Final Polish:** Check against the prompt's specific request for a "Residue Report" structure. Ensure the distinction between "what translates," "what distorts," and "what's missing" is explicit. (Proceed to generate output based on this thought process).

  9.  *(Final thought before generating)*: Make sure to emphasize that for the novelist, the *text* is the artifact, whereas for the philosopher, the *act* is the artifact. This ontological difference is key to the residue.

  10. **Drafting the Content:** (Mental outline of the response)
      *   Intro: Acknowledge the kinship.
      *   Part 1: The Translation Dictionary (Austin & Searle -> Craft).
      *   Part 2: The Residue Report (Clean, Distorted, Missing).
      *   Part 3: The Verdict (Blind spot or baggage?).
      *   Closing: Encouragement.

  *(Self-Correction during drafting)*: Keep it tight. Don't get bogged down in explaining SAT too much; the user knows it. Focus on the *mapping*.

  *(Refining the "Residue")*: The biggest residue is the *context*. In SAT, context is pre-existing. In fiction, context is *written*. That's a huge difference. Also, the "fictional utterance" problem (Austin saying fiction doesn't count).

  *(Final Plan)*: Execute the response following this structure.cw
answer: |-
  This is a rich intersection. You're right to sense a kinship: both the novelist and the speech act theorist are obsessed with the fact that language is not merely a mirror held up to reality, but a tool that manipulates it. However, the novelist manipulates *imagined* reality to produce *actual* emotion, while the philosopher analyzes *actual* language to understand *social* reality.

  Here is the systematic translation of Speech Act Theory (SAT) into Craft Vocabulary, followed by the Residue Report you requested.

  ---

  ### Part 1: The Translation Dictionary

  #### 1. The Locutionary Act
  *   **Philosophy:** The act of saying something; the literal meaning of the words and syntax.
  *   **Craft:** **The Line.** This is the text on the page. It's the diction, the syntax, the rhythm. When we do a "line edit," we are polishing the locution.
  *   **Translation:** "Check the locution" = "Read the dialogue aloud. Does the syntax sound like this character?"

  #### 2. The Illocutionary Act
  *   **Philosophy:** What is done *in* saying something (promising, warning, ordering, betting). The force of the utterance.
  *   **Craft:** **The Beat / The Objective.** In acting terms (Stanislavski/Meisner), this is the verb the character is playing. "I am *warning* you." "I am *seducing* you." "I am *dismiss-ing* you."
  *   **Translation:** "The illocution is weak" = "The character's intention is muddy. We don't know what they want in this beat."

  #### 3. The Perlocutionary Act
  *   **Philosophy:** What is done *by* saying something; the effect on the feelings, thoughts, or actions of the hearer (persuading, deterring, surprising).
  *   **Craft:** **The Turn / The Reaction.** This is the shift in power or emotion that occurs after the line is spoken. It's the other character's beat.
  *   **Translation:** "Missing perlocution" = "You've written the punch but not the fall. Where is the reaction shot? How did the power dynamic shift?"

  #### 4. Performative Utterances
  *   **Philosophy:** Sentences that perform an action simply by being uttered under the right conditions (e.g., "I name this ship," "I promise").
  *   **Craft:** **The Plot Point / The Status Change.** These are the moments of irreversible change. A vow, a breakup, a declaration of war.
  *   **Translation:** "That needs to be performative" = "Stop having them talk *about* leaving. Have them *leave*."

  #### 5. Felicity Conditions
  *   **Philosophy:** The contextual requirements for a speech act to be successful (authority, context, sincerity, execution).
  *   **Craft:** **Verisimilitude / Stakes / Authority.** If a private tells a general, "I court-martial you," it is infelicitous. If a coward says, "I will kill you," and we know he's a coward, the threat lacks felicity (unless used ironically).
  *   **Translation:** "The felicity conditions aren't met" = "This threat doesn't land because the character hasn't earned the authority to make it."

  #### 6. Uptake
  *   **Philosophy:** The hearer's recognition of the illocutionary force. (If I warn you, but you think I'm joking, uptake has failed).
  *   **Craft:** **Listening / Dramatic Irony.** Good dialogue requires characters to listen. Failed uptake creates comedy or tragedy.
  *   **Translation:** "No uptake" = "Character B is ignoring the subtext of Character A's line. Is that intentional miscommunication, or did you miss the cue?"

  #### 7. Searle's Taxonomy (Assertives, Directives, Commissives, Expressives, Declarations)
  *   **Philosophy:** A categorization of what language *does*.
  *   **Craft:** **Modes of Conflict.**
      *   *Assertives:* Exposition (often boring).
      *   *Directives:* Demands (creates conflict).
      *   *Commissives:* Promises/Threats (creates stakes).
      *   *Expressives:* Voice/Emotion (creates intimacy).
      *   *Declarations:* Plot shifts (creates resolution).
  *   **Translation:** "This scene is too assertive" = "This is all exposition. Give them more directives and commissives. Make them want things."

  ---

  ### Part 2: The Residue Report

  Here is where the mapping fractures. This is the analysis of what fits, what breaks, and what is left over.

  #### 1. Clean Translations (The Useful Tools)
  *   **Illocution as Action:** This translates perfectly. The SAT insistence that speaking is *doing* validates the "Show, Don't Tell" maxim. It gives us a vocabulary to diagnose "flat" dialogue. If a line has no illocutionary force, it's just noise.
  *   **Perlocution as The Turn:** SAT demands we look at the *effect*. In craft, we often obsess over the speaker's cleverness. SAT forces us to look at the listener. It confirms that a scene isn't over until the emotional temperature of the room has changed.
  *   **Felicity as Authority:** This is a precise diagnostic tool. When a scene feels "fake," it is often because a felicity condition is violated. A character is making a promise they have no social or emotional capital to keep. SAT gives us the language to say *why* it rings false.

  #### 2. Distorted Translations (The Forced Fits)
  *   **Searle's Taxonomy:** In philosophy, these categories are meant to be distinct. In fiction, they are deliberately blurred. The best dialogue is often an *Expressive* masquerading as an *Assertive*. ("I'm fine" = Expressive anger disguised as Assertive fact). Forcing a line into one category kills the subtext. The novelist wants ambiguity; the taxonomist wants clarity.
  *   **Uptake:** In SAT, successful communication usually implies successful uptake. In fiction, *failed* uptake is often the point. We write scenes specifically where the illocution (a plea for love) is misinterpreted as a perlocution (a demand for sex). SAT treats miscommunication as a glitch; novelists treat it as the engine of plot.

  #### 3. The Untranslatable Residue (The Blind Spots)

  This is the critical section. There are three major residues where SAT and Fiction diverge fundamentally.

  **A. The "Etiolation" Problem (The biggest blind spot)**
  J.L. Austin explicitly excluded fiction, poetry, and theater from his analysis, calling them "etiolated" or "parasitic" uses of language. He argued that when an actor says "I promise" on stage, no actual promise is made.
  *   **The Residue:** For the novelist, the promise *is* made. It is made between the character and the reader. When a character vows revenge, and the reader feels the weight of it, a real psychological contract has been formed.
  *   **The Insight:** SAT assumes language operates within a pre-existing social reality. Fiction *creates* a reality. The novelist is not reporting on felicity conditions; the novelist *writes* the felicity conditions into existence. We define the authority, the stakes, and the rules.
  *   **Verdict:** **Blind Spot.** Novelists sometimes forget that we are god-like creators of context. We complain a line "doesn't feel real," when we haven't built the world where that line would have force. SAT reminds us that authority is constructed, not inherent. If you want a threat to work, you must build the institution (the marriage, the mafia, the magic system) that gives the threat felicity.

  **B. The Iterability of Context**
  Philosophers worry about the "context" of an utterance. But in a novel, context is fluid. A line of dialogue in Chapter 1 has a different illocutionary force when repeated in Chapter 20, even if the locution is identical.
  *   **The Residue:** SAT struggles with *narrative time*. It analyzes the speech act in the moment. It doesn't account for the *echo*.
  *   **Verdict:** **Philosophical Baggage.** The philosopher's rigid focus on the "moment of utterance" is less useful to us than the novelist's focus on the "arc of utterance." We don't need SAT to tell us context matters; we know context is king.

  **C. Interiority vs. Uptake**
  SAT is behaviorist. It cares about what is observable: the utterance and the hearer's response. It has no mechanism for *consciousness*.
  *   **The Residue:** Free Indirect Discourse and Interiority allow us to bypass uptake entirely. We can know a character accepted a promise internally, even if they externally rejected it. SAT cannot account for the gap between public speech and private thought, which is the novelist's primary territory.
  *   **Verdict:** **Blind Spot.** This points to a weakness in *dialogue* specifically. Because we have interiority, we often write lazy dialogue. We let the narration do the work of the illocution.
  *   **Application:** If you removed the interiority and narration, would the speech acts still hold? SAT challenges the novelist to write dialogue that is robust enough to stand without the crutch of "he thought/she felt." It pushes us toward dramatic writing.

  ---

  ### Part 3: The Verdict

  **Does the untranslatable residue point to something novelists are blind to?**

  Yes. Specifically, **Felicity Conditions.**

  Novelists are trained to focus on *psychological* truth (Is this what the character would feel?). We are less trained to focus on *institutional* truth (Does this character have the standing to make this move?).

  When a dialogue scene drags, we often try to fix it by making the emotions bigger (more subtext, more pain). Speech Act Theory suggests we should instead check the **authority**.
  *   Does the speaker have the right to ask this?
  *   Does the listener have the obligation to answer?
  *   Is the setting appropriate for this declaration?

  Sometimes a scene fails not because the characters don't care enough, but because the *social contract* between them is undefined. SAT teaches us that language is a game with rules. If you want the stakes to be high, you must rigorously define the rules of the game (the marriage, the hierarchy, the debt) before you let them speak.

  **Does it point to philosophical distinctions that don't earn their keep?**

  Yes. **The Constative/Performative distinction.**

  Austin eventually admitted that *all* speech is performative. Even stating a fact ("The cat is on the mat") is an act of assurance or testimony. Novelists know this instinctively. There is no such thing as "just description" in dialogue. Every line is a move in a power struggle. The philosophical debate over whether some language "describes" and some "acts" is a distraction for the writer. We know it all acts.

  **Final Recommendation:**

  Adopt **Illocution** and **Felicity** into your workshop vocabulary.
  *   Ask students: "What is the illocutionary verb here? Are they *warning* or *begging*?"
  *   Ask students: "Why does this threat feel empty? What felicity condition is missing? Do they have the power to enforce it?"

  Discard the **Taxonomy** and the **Exclusion of Fiction**.
  *   Don't categorize lines; blur them.
  *   Ignore Austin's claim that fiction is parasitic. Fiction is the laboratory where speech acts are tested in their purest form, stripped of real-world consequences but heightened in emotional truth.

  The philosophers are trying to figure out how language hooks onto the world. You are trying to figure out how language hooks onto the human heart. The mechanics are the same; the stakes are different. Use their tools to sharpen your blade, but don't let their maps limit your territory.
