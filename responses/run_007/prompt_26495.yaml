      *   *Nuance:* The roommate's response to the Bat case is crucial. It shows they accept *indexical* or *perspectival* limits. Does the Pigeon case rely on indexicality? No, it relies on the factivity of knowledge.
      *   *Clarification:* Ensure the distinction between "unknown truth" (which exists) and "knowable unknown truth" (which Fitch says doesn't exist) is clear.
