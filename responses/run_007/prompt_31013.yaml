  ok so i just got out of a long argument with a friend about money pumps and i still cant tell what the argument is actually supposed to prove. the setup we kept going back to: someone has cyclical preferences, A over B, B over C, but C over A. you offer them a trade from C to B for a small fee, then B to A for a small fee, then A back to C for a small fee, and theyre back where they started but poorer. my friend kept insisting this doesnt show the person is irrational. his point was that at each individual step the person is just taking a trade they prefer, and the fact that the sequence loops around is a property of how were slicing up the options, not a defect in the preferences themselves. he said the actual mistake would be agreeing to the whole package of trades in advance, or maybe failing to notice the cycle. i pushed back that if your evaluative attitudes can be used to drain you for free, that has to count as some kind of incoherence, otherwise what does coherence even mean. he said i was conflating being exploitable with being irrational, and that someone with cyclic preferences who simply refuses to trade once they see the cycle is perfectly fine. by the end i didnt know what i thought. can you explain, in the weeds, what the money pump argument is supposed to establish about diachronic rationality? does it target the preferences themselves, or the policy you use to act on them over time? and how do the sophisticated response (anticipate the later trades and refuse the first one) and the resolute response (precommit to a plan) actually relate — are they genuinely different solutions, or two descriptions of the same move? i want to understand what the argument does and doesnt get you, and where my friend and i were talking past each other.
