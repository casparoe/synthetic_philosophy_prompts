answer: |-
  This is a profound puzzle that cuts to the heart of intellectual property jurisprudence. You have identified what I call the **Tripartite Inconsistency of Intellectual Objecthood**. To answer you, I must distinguish between the *ontology* of the idea (what kind of thing it is) and the *normative structure* of the right (what the owner can do with it).

  My thesis is this: The current legal practice does **not** presuppose a single, coherent metaphysical theory of idea ownership. Instead, it presupposes a **functional pluralism** where the "metaphysics" of the idea shifts depending on the regulatory goal. The law treats the *same* ontological object (a mental content realized externally) as three different kinds of legal entities.

  Here is the systematic breakdown.

  ---

  ### Part I: The Metaphysical Commitments of Each Regime

  To understand what theory the practice presupposes, we must look at what each regime implies about the nature of the "idea" and the source of the "right."

  #### 1. Patent Law: The Theory of Artificial Scarcity
  *   **The Rule:** Alice wins; Bob loses, despite independent labor.
  *   **Metaphysical Commitment:** This regime treats ideas as **non-rivalrous goods that must be rendered rivalrous by fiat.**
  *   **Theory of Ownership:** Ownership is not derived from the *genesis* of the idea (since Bob also generated it), but from **priority of claim**.
  *   **The Nature of the Right:** It is a right *in rem* (against the world). It functions like real property.
  *   **Presupposition:** The law presupposes that the social value of the invention lies in its *disclosure* and *deployment*, not merely its conception. By granting Alice a monopoly against Bob, the law asserts that the *first public claim* creates a normative boundary that erases the moral weight of Bob's independent labor.
  *   **Coherence Check:** This is metaphysically aggressive. It asserts that once Alice files, the "conceptual space" of that hinge is closed to others, even if they traverse it without a map.

  #### 2. Copyright Law: The Theory of Causal Genesis
  *   **The Rule:** Alice wins against copiers; Carol keeps her identical story.
  *   **Metaphysical Commitment:** This regime treats ideas (expressions) as **extensions of the author's causal agency.**
  *   **Theory of Ownership:** Ownership is derived from the **act of creation**, but the *enforcement* of that ownership is derived from the **violation of causal lineage**.
  *   **The Nature of the Right:** It is a right *in personam* (against specific wrongdoers), though statutory damages make it feel *in rem*.
  *   **Presupposition:** The law presupposes that the value of the work is tied to the *author's specific contribution*. If Carol's work does not flow from Alice's labor, Alice has no normative claim over Carol's labor, even if the output is identical.
  *   **Coherence Check:** This respects the ontological independence of minds. It acknowledges that two minds can occupy the same "conceptual location" without trespassing, because the "location" is not a physical space but a causal history.

  #### 3. Trade Secret Law: The Theory of Factual Control
  *   **The Rule:** Alice keeps her secret; Bob is free if he finds it himself.
  *   **Metaphysical Commitment:** This regime treats ideas as **private facts.**
  *   **Theory of Ownership:** Ownership is derived from **secrecy and reasonable efforts to maintain it.**
  *   **The Nature of the Right:** It is a right against **breach of confidence or improper means.**
  *   **Presupposition:** The law presupposes that the "property" is not the information itself, but the **relationship of confidentiality** surrounding it. Once the information enters the public domain (via Bob's independent publication), it ceases to be "Alice's" in any enforceable sense.
  *   **Coherence Check:** This is the most ontologically modest regime. It admits that ideas, once loose in the world, cannot be owned. It protects only the *container*, not the *content*.

  ---

  ### Part II: Is There a Single Coherent Theory?

  You ask if there is a single theory that makes sense of all three. The answer is **no**, not if we are looking for a theory of *natural rights* or *metaphysical essence*.

  If ideas were natural property (like land), Patent law would be unjust (Bob's land was taken) and Trade Secret law would be weak (why does publication destroy ownership?). If ideas were purely personal expressions (like limbs), Patent law would be a violation of bodily autonomy (Bob's mental limb is controlled by Alice).

  However, there is one theory that renders the practice coherent: **Legal Realism / Institutional Instrumentalism.**

  Under this view, "ownership of an idea" is not a pre-legal metaphysical fact. It is a **bundle of incentives.** The law is not trying to describe what an idea *is*; it is trying to decide how to *behave* toward ideas to maximize social welfare.
  *   **Patent:** We need high R&D investment. Independent creation defence would destroy the monopoly value, so we exclude it.
  *   **Copyright:** We need cultural production, but we don't want to stifle independent thought. Policing independent creation is too costly and violates liberty, so we allow it.
  *   **Trade Secret:** We want to encourage security measures without granting monopolies on useful knowledge.

  **Verdict:** The practice is coherent *only* if you reject the premise that "ownership" reflects a metaphysical truth. It is coherent as a **policy toolkit**, but incoherent as a **moral ontology**.

  ---

  ### Part III: Stress-Testing with Normative Theories

  If we were to replace the implicit instrumentalism with a robust philosophical theory, the tripartite system would fracture. Here is how three major theories would demand changes.

  #### 1. The Lockean Labour-Mixing View
  *   **Core Principle:** I own what I mix my labor with, provided I leave "enough and as good" for others.
  *   **Impact on Patent:** **Catastrophic Conflict.** Bob mixed his labor with the commons of knowledge to create the hinge. For the state to give Alice the right to stop Bob is to violate Bob's natural property right in his own labor.
      *   *Required Change:* Patent law would have to abolish the "independent creation is infringement" rule. It might become a "first to invent" system where Bob has a defensive right to use his own invention, or patents would be abolished entirely in favor of a reward system.
  *   **Impact on Copyright:** **High Fit.** Carol mixed her labor. She should own her story. However, a strict Lockean might argue that if the "commons" of expression is depleted by Alice's copyright, the "enough and as good" proviso is violated.
      *   *Required Change:* Copyright duration might need to be shorter to ensure the commons is replenished.
  *   **Impact on Trade Secret:** **High Fit.** Alice labored to keep it secret; Bob labored to discover it. Both own their respective efforts.
      *   *Required Change:* Minimal.

  #### 2. The Hegelian Personality View
  *   **Core Principle:** Property is the embodiment of the will. To violate property is to violate the person.
  *   **Impact on Patent:** **Significant Conflict.** Bob's hinge is an embodiment of *his* will. To force him to submit to Alice's will is to treat Bob as a mere means to Alice's ends.
      *   *Required Change:* Similar to Locke. Patent exclusivity would need to be weakened to respect the autonomy of independent inventors. The "right to exclude" would be limited to those who parasitically rely on the first inventor's will (copiers).
  *   **Impact on Copyright:** **Very High Fit.** This is the natural home of *droit moral*. The work is an extension of the self. Carol's identical work is *her* self-extension, not Alice's.
      *   *Required Change:* Strengthen moral rights (attribution, integrity) even further.
  *   **Impact on Trade Secret:** **Moderate Fit.** Secrecy is an act of will. But once Bob finds it, his will is also engaged.
      *   *Required Change:* None, provided Bob's discovery is seen as an act of his own will, not a violation of Alice's.

  #### 3. The Strict Utilitarian / Incentive View
  *   **Core Principle:** IP exists solely to solve market failures (public goods problem).
  *   **Impact on Patent:** **Perfect Fit.** If independent creation were a defense, the expected value of the patent would drop, R&D would fall, and society would lose. The injustice to Bob is the price of the incentive for Alice.
      *   *Required Change:* None.
  *   **Impact on Copyright:** **Perfect Fit.** Policing independent creation is too expensive (transaction costs) and chills creativity. The incentive is secured by protecting against copying, which is the main market threat.
      *   *Required Change:* None.
  *   **Impact on Trade Secret:** **Perfect Fit.** No state monopoly is needed; the market provides the incentive (secrecy).
      *   *Required Change:* None.

  ---

  ### Part IV: Philosophical Underdetermination

  You asked me to flag where the practice is philosophically underdetermined. These are points where the law could have gone either way without contradicting its own internal logic, revealing that the current rules are choices, not necessities.

  1.  **The Ontology of the "Idea":**
      *   *Underdetermination:* The law is silent on whether the idea existed before Alice found it (Platonism) or was created by her (Creationism).
      *   *Why it matters:* If Platonism were true, Patent makes more sense (discovery claims). If Creationism were true, Copyright makes more sense. The law uses both ontologies opportunistically.

  2.  **The Moment of Vesting:**
      *   *Underdetermination:* In Copyright, rights vest on *fixation*. In Patent, on *filing* (or invention). In Trade Secrets, on *secrecy*.
      *   *Why it matters:* There is no metaphysical reason why an idea becomes "property" at these different moments. This is purely regulatory. A Lockean might argue rights vest at *conception* (mental labor), which none of the regimes fully accept (you can't copyright a thought).

  3.  **The Scope of "Copying":**
      *   *Underdetermination:* Copyright requires copying. Patent does not.
      *   *Why it matters:* This is the crux of your puzzle. The law could have made Patent like Copyright (a right against copying) or Copyright like Patent (a right against the world). The choice is not metaphysical; it is economic. The law *presupposes* that functional ideas are harder to monetize than expressive ones, requiring stronger protection. But this is an empirical claim, not a philosophical truth.

  ### Conclusion: The Conceptual Architecture

  To answer your final question: **The practice presupposes inconsistent commitments if viewed as a moral system, but coherent commitments if viewed as an economic system.**

  The conceptual architecture is not built on a theory of *what ideas are*, but on a theory of *what ideas do*.
  *   **Patents** protect **Investment**. (Requires exclusivity against the world).
  *   **Copyrights** protect **Expression**. (Requires protection of lineage).
  *   **Trade Secrets** protect **Security**. (Requires protection of conduct).

  If you adopt a **Lockean** or **Hegelian** view, **Patent Law is the outlier that must change.** It is the only regime that systematically violates the labor or will of the independent creator (Bob). To align with those theories, Patent law would need to shift toward a "independent invention defense," effectively making it more like Copyright.

  If you adopt the **Instrumentalist** view (which the law implicitly does), **no change is required.** The inconsistency you perceive is not a bug; it is the system functioning exactly as designed, applying different tools to different kinds of problems. The "ownership" of the idea is not a description of reality, but a lever the state pulls to tune the balance between innovation and access.

  As a journalist, your puzzle arises because you are looking for a *noun* (the Idea) where the law is operating with *verbs* (incentivize, disclose, conceal). The law does not care if Bob "owns" his idea in a metaphysical sense; it cares whether allowing Bob to sell his hinge will make Alice less likely to invent the next one. That is the cold, coherent, instrumental logic beneath the metaphysical confusion.
