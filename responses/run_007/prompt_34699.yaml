prompt: |-
  In the bounded rationality literature, one frequently encounters the analogy that satisficing stands to optimizing roughly as heuristic search stands to exhaustive search: just as a chess engine cannot enumerate every branch of the game tree and must instead prune, evaluate heuristically, and stop when a move's evaluation crosses a threshold, a human agent facing a real decision problem cannot enumerate all possible actions and outcomes and must instead search sequentially until an option meets an aspiration level. The analogy is then deployed to support a normative claim — that satisficing is not merely a concession to cognitive limitations but the rationally appropriate procedure for any agent with finite resources, and that optimizing, once search costs are properly accounted for, is itself irrational.

  I want you to audit this analogy. Provide an explicit mapping: what in the heuristic-search domain corresponds to what in the choice-under-bounded-rationality domain? Then identify the disanalogies — the places where the computational domain supplies features that the domain of human choice lacks. Separate the disanalogies that matter for the normative conclusion from those that are merely incidental. In particular, address whether the analogy quietly imports a well-defined objective function, an exogenous aspiration level, or the availability of performance guarantees that do not carry over to human decision-making. Finally, tell me whether the normative conclusion — that satisficing is the rationally required procedure — survives once the disanalogies are on the table, or whether the analogy was carrying more weight than it can bear.
reasoning: |-
  Here's a thinking process that leads to the audit of the satisficing-optimizing vs. heuristic-exhaustive search analogy:

  1.  **Deconstruct the Prompt:**
      *   **Core Analogy:** Satisficing : Optimizing :: Heuristic Search : Exhaustive Search.
      *   **Context:** Bounded rationality literature (Simon, Gigerenzer, etc.).
      *   **Normative Claim:** Satisficing is not just a limitation but *rationally required* for finite agents; optimizing (even with search costs) is irrational.
      *   **Task:**
          1.  Provide an explicit mapping (domains).
          2.  Identify disanalogies (computational features missing in human choice).
          3.  Separate consequential disanalogies (affecting the normative claim) from incidental ones.
          4.  Address specific hidden imports (objective function, aspiration level, performance guarantees).
          5.  Evaluate the survival of the normative conclusion.

  2.  **Part 1: Explicit Mapping:**
      *   *Source Domain:* Computer Science/AI Search (e.g., Chess Engine).
      *   *Target Domain:* Human Decision Making (Bounded Rationality).
      *   *Mappings:*
          *   Game Tree $\rightarrow$ Decision Space/Action Sequence.
          *   Leaf Node Evaluation Function $\rightarrow$ Utility/Value of Outcome.
          *   Alpha-Beta Pruning/Heuristics $\rightarrow$ Cognitive Shortcuts/Recognition.
          *   Search Depth Limit/Threshold $\rightarrow$ Aspiration Level.
          *   "Good Enough" Move $\rightarrow$ Satisfactory Option.
          *   Exhaustive Minimax $\rightarrow$ Global Optimization.
          *   Computation Time/Memory $\rightarrow$ Cognitive Effort/Time.

  3.  **Part 2: Identifying Disanalogies:**
      *   *Feature 1: The Objective Function.* In chess, "win/draw/loss" or material count is clear. In life, utility is often constructed, ambiguous, or multi-attribute without weights.
      *   *Feature 2: The Aspiration Level.* In engines, thresholds are tunable parameters based on known evaluation distributions. In humans, aspiration levels are endogenous, adaptive, and often vague.
      *   *Feature 3: Search Space Structure.* Chess trees are discrete, finite (though huge), and rules-bound. Real-world decision spaces are often continuous, ill-defined, or unknown (unknown unknowns).
      *   *Feature 4: Performance Guarantees.* Heuristic search in CS often comes with bounds (e.g., $\epsilon$-optimality, admissible heuristics). Human heuristics lack formal error bounds.
      *   *Feature 5: Stopping Rules.* Engines stop when time runs out or depth is reached. Humans stop based on emotions, fatigue, or social cues, which may not align with resource efficiency.

  4.  **Part 3: Separating Consequential vs. Incidental Disanalogies:**
      *   *Incidental:* Discrete vs. continuous (mathematically tractable either way), specific hardware vs. neurons.
      *   *Consequential:*
          *   *Well-defined Objective:* Crucial. You can't optimize or satisfice relative to a target if the target is undefined.
          *   *Exogenous Aspiration:* Crucial. If the aspiration level is arbitrary or shifting, "meeting" it doesn't guarantee rationality.
          *   *Performance Guarantees:* Crucial. If we don't know *how far off* the satisficed option is from the optimum, the claim that it's "rationally required" loses force compared to a strategy that might get closer for similar cost.

  5.  **Part 4: Addressing Hidden Imports (The "Quiet" Assumptions):**
      *   *Objective Function:* The analogy assumes we know what "better" looks like. In CS, the evaluation function is given. In human choice, defining utility is often the hard part.
      *   *Aspiration Level:* In the analogy, the threshold is set to ensure a win or a specific score. In Simon's theory, it adapts. But for the *normative* claim to hold (that satisficing is *better*), the threshold must be set *correctly*. Who sets it?
      *   *Performance Guarantees:* CS heuristics often have proofs (e.g., A* is optimal if heuristic is admissible). Human heuristics are ecological but lack worst-case guarantees.

  6.  **Part 5: Evaluating the Normative Conclusion:**
      *   *Claim:* Satisficing is rationally required; optimizing is irrational.
      *   *Analysis:* The analogy works well to show optimizing is *impossible* (descriptive). It works less well to show satisficing is *optimal* (normative).
      *   *Why?* To claim satisficing is *normatively* superior, one must show it maximizes expected utility *including search costs*. But if the aspiration level is set poorly, satisficing can be disastrous (e.g., accepting the first job offer).
      *   *Optimization of Search:* "Optimizing" in bounded rationality usually means "optimizing the search process" (meta-optimization). The prompt suggests optimizing is irrational *once search costs are accounted for*. This is the "regress problem."
      *   *Verdict:* The analogy smuggles in the idea that the heuristic is *tuned* to the environment (like an engine). Humans aren't always tuned. Therefore, the move from "we must satisfice" (descriptive necessity) to "we *should* satisfice" (normative prescription) is not fully supported by the CS analogy alone. The CS analogy assumes the heuristic is *good*. Human heuristics might be *biased*.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the pedigree (Simon, etc.). State the purpose of the audit.
      *   *Mapping Section:* Use a clear table or list.
      *   *Disanalogies Section:* Group them. Highlight the "Hidden Imports."
      *   *Normative Evaluation:* This is the crux. Distinguish between *impossibility of global optimization* (which the analogy supports) and *superiority of satisficing* (which the analogy struggles to support without extra assumptions).
      *   *Key Insight:* The chess engine is designed by an optimizer. The human is the result of evolution (which optimizes fitness, not necessarily decision utility). The engine's heuristic is *verified*; the human's is *assumed* ecological.
      *   *Conclusion:* The analogy supports the *descriptive* claim (we can't optimize) but fails to fully underwrite the *normative* claim (satisficing is the right thing to do) because it hides the difficulty of setting aspiration levels and defining utility.

  8.  **Refining the Argument on "Optimization is Irrational":**
      *   The prompt claims: "optimizing, once search costs are properly accounted for, is itself irrational."
      *   Counter-argument: This is Stigler's "Optimization under Constraints." If you optimize the search cost, you are still optimizing. Satisficing is only normatively superior if the *cost of calculating the optimal stopping rule* exceeds the *gain from finding the better option*.
      *   The CS analogy hides this: The engine's stopping rule is pre-programmed (optimized by the developer). The human must program their own stopping rule.
      *   *Crucial Point:* The analogy conflates the *agent* with the *designer of the agent*. The chess engine is a product of optimization (by humans). The human agent is expected to be their own designer. This is a category error.

  9.  **Final Polish:** Ensure tone is analytical and philosophical. Check against all constraints in the prompt. (Explicit mapping? Yes. Disanalogies? Yes. Consequential vs. Incidental? Yes. Hidden imports? Yes. Normative conclusion verdict? Yes.)

      *(Self-Correction during drafting)*: Make sure not to dismiss bounded rationality entirely. The point is to audit the *analogy*, not the theory itself. The theory might be right, but the analogy might be doing too much work. Focus on the *support* the analogy provides.

      *Refining the "Aspiration Level" point:* In CS, the threshold is often dynamic based on the search (e.g., iterative deepening). In Simon's theory, it adapts based on experience. The disanalogy is that the CS threshold is tied to a known scale (centipawns), whereas human aspiration is often ordinal or constructed.

      *Refining the "Normative" point:* The normative claim is that satisficing is *rationally appropriate*. If the aspiration level is set too low, satisficing is irrational (leaving value on the table). If set too high, it degenerates into exhaustive search. The CS analogy assumes the threshold is set *correctly*. That's the hidden premise.

  10. **Final Structure:**
      1.  Introduction.
      2.  Explicit Mapping.
      3.  Disanalogies (Incidental vs. Consequential).
      4.  Hidden Imports (Objective, Aspiration, Guarantees).
      5.  Verdict on Normative Conclusion.
      6.  Conclusion.

      *(Final check of the prompt's specific phrasing)*: "optimizing, once search costs are properly accounted for, is itself irrational." This is a strong claim. I need to address whether the analogy supports *this specific* claim. The analogy suggests exhaustive search is computationally infeasible. It does not necessarily prove that *constrained* optimization (Stigler) is irrational, only that *unconstrained* optimization is impossible. The prompt conflates "exhaustive" with "optimizing under constraints." I need to clarify this distinction.

