answer: |-
  You have put your finger on the precise nerve of the problem, which is that our intuitions about art are not stable but context-dependent, shifting like sand depending on whether we are talking about money, beauty, history, or authenticity. Because of this instability, any theory that hopes to explain why an original is more valuable than a perfect forgery cannot simply offer a single principle; it must satisfy a cluster of demanding requirements that often pull in opposite directions. I write this to you to outline those desiderata, not to offer a solution, but to map the terrain of constraints that any adequate account must navigate.

  The first and most obvious requirement is what we might call the Non-Supervenience Constraint. Any theory must explain why aesthetic and artistic value do not supervene on the physical properties of the object alone. This is demanded by the Van Meegeren case you mentioned, where a painting physically identical to a Vermeer lost its status as a masterpiece the moment its history of production was revealed to be twentieth-century rather than seventeenth-century. If value were solely a function of what meets the eye, the revelation of the forgery would be irrelevant to the artwork's worth, yet we know it is devastating. Therefore, the theory must locate value at least partially in facts that are invisible to perception, specifically in the genesis of the object. However, this must be balanced against a second requirement, the Ontological Flexibility Constraint. The account cannot treat all art objects as having the same relationship to their origins. A molecule-for-molecule duplicate of a unique oil painting is a forgery, but a second cast from the original mold in sculpture, or a later impression from the original plate in printmaking, is often considered an original work. A theory that insists on a strict one-to-one identity between the artist's hand and the object will fail to account for the accepted multiplicity of prints and casts, while a theory that is too loose will fail to protect the uniqueness of the painted surface. The theory must distinguish between constitutive history and contingent history without relying on perceptual cues to do so.

  Third, the theory must satisfy the Temporal Dynamics Constraint. It must explain how the value of an object can change without the object itself changing, not only when a forgery is exposed but when a copy is elevated. You noted the case where a work thought to be a copy is reattributed to a master and gains value; here, the physical object remains static while its artistic identity shifts. Conversely, the theory must also accommodate the phenomenon where a forgery eventually gains value as a historical object in its own right, such as a Van Meegeren painting now valued for its audacity rather than its deception. This means the theory cannot treat the status of "original" or "fake" as a permanent, binary metaphysical stamp that fixes value forever; it must allow for the history of reception to interact with the history of production over time. This leads us to a fourth requirement, the Epistemic Penetration Constraint. The account must explain why knowing the history of the object changes not just its market price but our actual engagement with it. It is not enough to say the market price drops; the theory must explain why the aesthetic experience itself is altered by the knowledge of forgery. If you look at a fake knowing it is a fake, you see it differently, perhaps noticing stiffness where you once saw grace. The theory must explain how cognitive knowledge penetrates perceptual experience, bridging the gap between knowing and seeing.

  Furthermore, any adequate account must not contradict established results from adjacent fields, which imposes a fifth set of constraints. From psychology, the theory must be compatible with psychological essentialism, the human tendency to believe that objects have an underlying essence or history that determines their identity. We cannot propose a theory that assumes people are purely rational empiricists when they clearly are not; the disgust we feel toward forgeries is akin to the disgust we feel toward a copy of a sacred relic or a sweater worn by a murderer, suggesting a deep cognitive mechanism regarding contact and origin. From economics, the theory must distinguish between scarcity value and artistic value. While scarcity drives price, it does not fully explain why a unique forgery is less valuable than a unique original, nor does it explain why multiple originals (like prints) retain high value. The theory must separate the logic of the market from the logic of art criticism while explaining why they so often correlate. Finally, from neuroscience, the theory should not claim that the brain processes the visual data of an original and a fake identically when the viewer is unaware of the difference, but it must allow that the *valuation* network is dependent on contextual framing.

  Here is where the deep tension lies, and I must flag a pair of desiderata that I suspect cannot be jointly satisfied without significant compromise. There is a fundamental conflict between the Non-Supervenience Constraint, which grounds value in the history of making, and the Temporal Dynamics Constraint, which grounds value in the history of reception. If the value is inherent in the act of creation—the genius of the artist at moment T1—then subsequent changes in reception should not alter the core artistic value, only our knowledge of it. Yet, we know that art history is revisionist; artists are rediscovered and demoted based on how later generations receive them. If you prioritize the history of making, you struggle to explain why a work ignored for centuries becomes valuable later without changing its origin. If you prioritize the history of reception, you struggle to explain why a forgery that fools everyone for centuries is still considered deficient once exposed. A theory that satisfies the demand for historical grounding in the artist's achievement risks making art value static and immune to cultural shift, while a theory that satisfies the demand for reception-based value risks making art value purely conventional and unable to condemn a forgery that was successfully received. I suspect no theory can fully satisfy both the demand that value is discovered in the object's genesis and the demand that value is constructed by its audience over time.

  Regarding your question about which single requirement does the most to exclude the most popular theories, I believe it is the Epistemic Penetration Constraint. Most popular intuitions, and indeed many philosophical theories, lean toward aesthetic empiricism, the idea that the value of art lies in the experience it provides to the senses. This is the default view for most people: art is about what you see and feel. However, the requirement that knowledge of the object's history must constitutively alter the aesthetic value itself, even when perception is identical, excludes any theory that locates value solely in the perceptual properties or the immediate phenomenological experience. It forces the theory to admit that the artwork is not just the object before us, but the object plus its narrative. This is a high bar because it requires explaining how a non-perceptual fact becomes a perceptual value. It excludes not only naive empiricism but also formalist theories that treat the artwork as a self-contained arrangement of lines and colors. It demands that the theory account for the artwork as an event in history rather than a thing in space.

  Ultimately, you are asking for a theory that can walk the tightrope between the metaphysics of the object and the psychology of the viewer. You want an account that respects the hard fact that the original was touched by the master while respecting the soft fact that value is conferred by communities over time. You want it to explain why a print can be one of many originals while a painting must be one of one, and why a fake can become valuable as a fake but not as a Vermeer. The difficulty is that these desiderata pull toward different ontologies. The history of making points toward a romantic individualism, while the history of reception points toward institutional conventionalism. The adjacent fields suggest we are essentialists by nature, while the art world suggests we are constructivists by practice. An adequate theory must either find a way to unify these opposing forces or honestly admit that the value difference between original and forgery is not a single phenomenon but a cluster of distinct values—historical, aesthetic, economic, and moral—that we mistakenly treat as one. If you proceed to read the theories, look not for the one that solves the puzzle, but for the one that admits which of these desiderata it is willing to sacrifice.
