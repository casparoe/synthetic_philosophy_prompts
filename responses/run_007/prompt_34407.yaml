prompt: |-
  I have been thinking about the problem of fakes and forgeries in art, and I keep noticing that people's intuitions about what matters shift depending on which case you present. Before I read any more theories, I want the full specification of what a theory of the value difference between originals and forgeries actually has to deliver.

  Write the desiderata: what any adequate account of why an original artwork is more valuable than a perceptually indistinguishable copy must get right. I want the cases it has to handle, the distinctions it must respect, the phenomena it must explain, and the results from adjacent fields it cannot contradict, with the reasoning behind each requirement. Flag any pair of desiderata that you suspect cannot be jointly satisfied, and tell me which single requirement does the most to exclude the most popular theories.

  Some of the cases and distinctions I have in mind, though I want you to go beyond these: the van Meegeren Vermeer forgeries, where a painting revered as a masterpiece was revealed to be a twentieth-century fake and immediately lost its place in the canon; the opposite case, where a work thought to be a copy is reattributed to the master and gains value; the fact that a perfect molecule-for-molecule duplicate of a painting would still be treated as less valuable than the original; the fact that in some arts, such as cast sculpture, printmaking, and digital art, the notion of an original is already complicated; the fact that some forgeries are eventually valued for their own sake as historical objects; and the fact that we seem to care about the difference between original and forgery even when we cannot perceive it. If I am missing important cases, add them.

  I am especially interested in whether the desiderata force a choice between an account grounded in the history of making and one grounded in the history of reception, and whether any account can satisfy both sets of demands at once.

  Do not give me a survey of theories or a bibliography. I want the requirements list with the reasoning behind each one, and an honest assessment of which ones conflict. Write in continuous prose, no headings, no bullet points, no tables, the way you would write a letter.
