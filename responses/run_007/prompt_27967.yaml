  **MEMORANDUM**

  **TO:** Disability Services Advisory Board
  **FROM:** [Your Name/Position]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Budget Allocation Framework

  **Purpose**
  As we prepare for the upcoming fiscal year, we face the recurring challenge of allocating a fixed budget against accommodation requests that consistently exceed available funds. This memo recommends a specific ethical framework and actionable allocation rule to guide our decisions, ensuring we meet our legal and moral obligations while maintaining fiscal sustainability.

  **Recommendation: Prioritized Capabilities Framework**
  I recommend we adopt a **Prioritized Capabilities Framework**. This approach synthesizes the Capabilities Approach (Faction 3) with a constrained efficiency mechanism. 

  Our primary ethical mandate is not to maximize subjective welfare (Utilitarian) nor to distribute equal dollar amounts regardless of outcome (Egalitarian), but to ensure every student achieves a threshold of **Basic Academic Functioning**. This threshold is defined as the minimum level of access required to attend lectures, complete assignments, and take exams under fair conditions. However, given our budget constraint, we cannot fund every request to the maximum possible benefit. Therefore, we must prioritize bringing the *maximum number* of students to this basic threshold before funding enhancements.

  **Actionable Allocation Rule**
  To implement this framework, staff should apply the following three-step allocation rule:

  1.  **Threshold Identification:** Categorize all requested accommodations as either "Threshold Essential" (required to meet the Basic Academic Functioning definition) or "Enhancement" (beneficial but not strictly required for access).
  2.  **Primary Allocation:** Fund all "Threshold Essential" requests. 
  3.  **Constraint Management:** If the cost of "Threshold Essential" requests exceeds the budget:
      *   **Priority A:** Fund accommodations where the student faces *complete exclusion* without support (e.g., a student who cannot physically enter the building).
      *   **Priority B:** Among remaining cases, prioritize those with the lowest cost-to-threshold ratio to maximize the number of students brought to basic functioning.
      *   **Reserve:** Set aside 15% of the budget specifically for high-cost "Priority A" cases that would otherwise be displaced by Priority B allocations.

  **Engagement with the Strongest Objection**
  The strongest objection to this framework—specifically the "Constraint Management" step—is that it violates **Vertical Equity**. Critics will argue that prioritizing low-cost-to-threshold cases (Priority B) systematically discriminates against students with severe, high-cost disabilities. Under this rule, a student requiring $5,000 in assistive technology to reach the threshold might be denied in favor of five students requiring $1,000 each in note-taking services. This effectively penalizes students for the severity of their disability, treating their needs as less worthy because they are more expensive.

  This objection is morally serious and must not be dismissed. A system that abandons the most vulnerable students fails the core mission of disability justice. However, rejecting this framework leads to two worse outcomes: 
  1.  **Pure Capabilities:** Funding high-cost cases first until exhaustion leaves a larger number of students with *zero* support, violating the mandate to serve the community broadly.
  2.  **Pure Utilitarianism:** Allocating based on "suffering relief" invites subjective measurement biases that often disadvantage students with non-visible or complex disabilities.

  **Mitigation:**
  To address the Vertical Equity objection without collapsing the budget, the **15% High-Cost Reserve** is non-negotiable. This ensures that even if a student's needs are expensive, there is a dedicated pool to prevent total abandonment. Furthermore, we must pair this allocation rule with an aggressive advocacy strategy to increase the overall budget. This framework manages scarcity ethically; it does not excuse it. By maximizing the number of students at the functional threshold while protecting a reserve for severe cases, we balance the duty to the individual with the duty to the student body.

  **Next Steps**
  At the next meeting, I propose we finalize the definition of "Basic Academic Functioning" and calculate the cost of the current request queue against the 15% reserve model. Please review the attached draft definition prior to our session.
