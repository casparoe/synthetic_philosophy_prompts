  10. **Final Check against Constraints:**
      *   First sentence = bottom line? Yes.
      *   No preamble? Yes.
      *   No restating question? Yes.
      *   Address all sub-questions (principle, intrinsic vs relational, revisions, hermit)? Yes.

  11. **Self-Correction on "Human Biology":**
      *   Case 6 (AI) suggests the user is willing to extend personhood beyond biology if the relational capacity is real. So the principle isn't strictly biological speciesism, but rather "moral agency/sentience capable of reciprocity." However, Case 5 (Dog) suggests biology *does* matter, or at least complex linguistic/symbolic reciprocity matters. The distinction between Dog and AI is the trickiest part of the user's intuition. I should note that tension. The user's intuition on AI might be the outlier needing revision, or the Dog case needs nuance (personhood vs. moral standing). I will suggest the principle relies on *moral reciprocity* rather than mere affection.

  12. **Final Polish:**
