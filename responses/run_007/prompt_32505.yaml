  3.  **Evaluate Principles:**
      *   *Strict Ubuntu (Relational):* Personhood is *achieved* through community.
          *   Conflicts with: Newborn (1), Feral Child (2), Dementia (3), Exile (4). The user insists these are persons despite lacking active reciprocity.
      *   *Strict Western Individualism (Intrinsic):* Personhood is inherent to being human (or rational agent).
          *   Conflicts with: AI (6) (maybe), Dog (5) (user says not person), Dead (7) (user says not person).
          *   Fits: 1, 2, 3, 4, 8 (mostly), 9.
      *   *Hybrid/Capacity-Based:* Personhood requires the *capacity* for relation, even if not currently exercised, grounded in a specific kind of being (human/sentient/agent).
          *   Fits 1 (capacity), 2 (capacity damaged but present), 3 (history/capacity lost but status remains), 4 (capacity remains), 5 (capacity limited?), 6 (capacity present), 7 (capacity gone), 8 (capacity developing), 9 (capacity artificial/legal only).

  4.  **Synthesize the User's Intuitions:**
      *   The user's intuitions are predominantly *individualist* with *relational qualifiers*.
      *   They grant personhood to humans regardless of current relational status (1, 2, 3, 4). This is the strongest cluster.
