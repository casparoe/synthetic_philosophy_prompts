answer: |-
  **Setting:** *A seminar room, late afternoon. The whiteboard is covered in probability notation from earlier presentations. MAYA (M) and SAM (S) are sitting on the edge of the main table, facing the small audience of grad students. They have coffee.*

  **MAYA:** So, we're not going to re-prove Lewis. We all agree that if you assume indicative conditionals express propositions, and you assume the Law of Total Probability, and you assume Adams's Thesis—that the probability of the conditional equals the conditional probability of the consequent given the antecedent—you get triviality. The only probability functions that survive are those where the antecedent and consequent are probabilistically independent. Which is absurd.

  **SAM:** Right. The math isn't the fight. The fight is the first premise. "Indicative conditionals express propositions."

  **MAYA:** Exactly. The triviality result isn't a puzzle to be solved; it's a reductio. It tells us that the indicative conditional *cannot* be a proposition with standard truth conditions. If it were, rational credence would be constrained in a way that makes learning impossible. The moral has to be Adams's. Conditionals aren't assertions of fact. They're inference tickets. To assert "If A, then C" is to express a high conditional credence $P(C|A)$, not to assert a proposition that is true or false.

  **SAM:** I think that's too fast, Maya. You're treating Lewis's result as if it applies to a static proposition fixed across all contexts. But the triviality proof assumes that the proposition expressed by $A \to C$ is the same regardless of the probability function $P$ used to evaluate it. Stalnaker's out is to deny that. The proposition expressed is context-dependent. Specifically, it depends on the agent's epistemic state.

  **MAYA:** The "Stalnaker Constraint." I know it. You're saying the content shifts so that $P(A \to C)$ always matches $P(C|A)$. But that feels like buying consistency at the cost of content. If the proposition changes every time my credence function changes, what are we even disagreeing about? If I say "If it rains, the match is cancelled" and you say "No, if it rains, the match is not cancelled," are we contradicting each other? Or just revealing that our selection functions differ?

  **SAM:** We're contradicting each other about which world is closest to actuality given the antecedent. Look, your Adams-style view has a massive debt it hasn't paid: the problem of embeddings. If conditionals don't have truth conditions, they can't be embedded in truth-functional contexts. What do I say when I assert, "It is not the case that if it rains, the match is cancelled"?

  **MAYA:** I can handle negation. To deny a conditional isn't to assert a contradictory proposition. It's to refuse to make the inference. It's to say, "I don't accept that high conditional credence is warranted."

  **SAM:** That doesn't capture the data. Consider a disjunction: "Either if it rains the match is cancelled, or if it's sunny the price goes up." Or better, a conjunction. "If the switch is flipped, the light goes on, and if the light goes on, the room is bright." If the components lack truth values, how does the conjunction get a truth value? How do I assign a probability to the whole sentence if the parts aren't propositions?

  **MAYA:** I'd say you're parsing that wrong. Natural language *looks* truth-functional, but logic isn't isomorphic to syntax. When you see a conditional in a conjunction, you're really seeing a compound expression of conditional commitment. But let's turn the table, Sam. Your propositional view has to handle right-nesting. "If A, then if B, then C." On your Stalnaker semantics, that's evaluated by looking at the closest A-world, then the closest B-world to *that* world. But Lewis showed that validates Import-Export: $(A \to (B \to C))$ is equivalent to $((A \land B) \to C)$.

  **SAM:** And that's a feature, not a bug.

  **MAYA:** Is it? Because McGee showed that Import-Export fails for indicative conditionals in natural language. But more importantly, if you accept Import-Export *and* you hold that conditionals are propositions with classical truth conditions, you run straight into Gibbard's proof, which is even stronger than Lewis's. Gibbard shows that if conditionals are propositions and Import-Export holds, then the conditional is just the material conditional. And we know it's not the material conditional. So you're squeezed. You have to give up Import-Export or admit triviality.

  **SAM:** I'm willing to give up Import-Export for indicatives if I have to, but I don't think I do. The triviality results rely on the assumption that the conditional proposition is in the domain of the probability function *in the same way* as categorical propositions. But maybe the logic of conditionals isn't classical. Maybe we need a non-Boolean algebra for the propositions they express.

  **MAYA:** Now you're moving the goalposts. First, it was standard propositions with context-dependence. Now it's non-Boolean propositions? If you go that route, you're admitting that they don't behave like standard truth-apt content. And if they don't behave like standard content, why not just drop the truth-conditional pretense entirely? My view is ontologically cheaper. I don't need weird algebras. I just say: conditionals aren't in the business of describing the world. They're in the business of constraining how we update on the world.

  **SAM:** But then you lose the ability to explain disagreement. If I say "If Oswald didn't kill Kennedy, someone else did," and you say "No, if Oswald didn't kill Kennedy, someone else didn't do it"—wait, bad example. Let's say: "If the butler did it, he used the candlestick." You say, "No, if the butler did it, he used the revolver." On your view, we aren't asserting incompatible propositions. We're just expressing different conditional credences. But it *feels* like a factual disagreement. We're arguing about the world, not just our heads.

  **MAYA:** It feels like a factual disagreement because conditional credences are constrained by facts. If we agree on the causal laws, we should agree on the conditional. But the *meaning* of the sentence isn't the fact itself; it's the constraint. Look, let's press your view on the probability question. Adams's Thesis works incredibly well for simple indicatives. People's subjective probabilities track conditional probabilities. If your view is that there is a truth condition, why does the probability of that truth condition align so perfectly with conditional probability? Is that a coincidence?

  **SAM:** It's not a coincidence. It's because the truth condition is defined by the selection function, and rational agents set their selection functions to match their conditional credences. The semantics explains the epistemology. On your view, the epistemology *is* the semantics. You're collapsing the distinction.

  **MAYA:** Because the distinction is spurious for this construction! But here's the hard case for you. What about "If A, then probably C"?

  **SAM:** What about it?

  **MAYA:** If the conditional already expresses a conditional credence, then "If A, then probably C" should be redundant or incoherent. But it's not. I can say, "If it rains, it will probably stop by noon." If the "if" clause already signals I'm talking about conditional belief, adding "probably" modifies the consequent. But on your view, "probably" is an operator on the proposition.

  **SAM:** "Probably" is a modal operator. It quantifies over worlds. "If A, then probably C" means in the closest A-worlds, most of them are C-worlds. That's straightforward. Can you parse that on the Adams view without reintroducing truth conditions for the consequent?

  **MAYA:** I can parse it as a conditional credence in a proposition involving a probability operator. $P(\text{Prob}(C) | A)$ is high. But notice what happened there. I had to treat C as a proposition. The conditional itself isn't the proposition; the *consequent* is. The conditional is the frame.

  **SAM:** Okay, but let's go back to negation. This is where I think your view actually breaks. "It's not the case that if A, then C." On your view, I can't believe this. I can only lack the conditional belief. But I can positively believe the negation. I can be certain that it's false that if A then C. That requires a truth-apt content to be false.

  **MAYA:** I deny that. To be certain that "If A, then C" is wrong is just to be certain that $P(C|A)$ is low. It's to be disposed to infer $\neg C$ from $A$. You're reifying the negation because classical logic demands a negation for every sentence. But maybe not every sentence is a bearer of truth and falsity.

  **SAM:** But then how do we validate Modus Tollens? If I know $\neg C$, and I know $A \to C$, I infer $\neg A$. If $A \to C$ has no truth value, how does it transmit the falsity of C to A?

  **MAYA:** It's not transmission of truth values; it's preservation of commitment. If I'm committed to inferring C from A, and I learn $\neg C$, I must drop the commitment to A. The validity is pragmatic, not semantic.

  **SAM:** That sounds like you're saving the phenomena by changing the definition of validity. And honestly, Maya, I worry your view makes conditionals too subjective. If Adams's Thesis is about *my* credence, then "If I drop this glass, it will break" is true for me if I believe it, even if the glass is made of unbreakable polymer.

  **MAYA:** No, Adams's Thesis is normative for rational agents. If I know it's polymer, my conditional credence should be low. If it's high, I'm irrational. The truth of the matter constrains the rational credence. But the *meaning* of the conditional is still tied to that credence, not to the polymer facts directly.

  **SAM:** But that severs the link between language and world. We use conditionals to plan, to explain, to describe causal structures. If I say, "If you heat the iron, it expands," I'm telling you something about the iron, not about your credence function.

  **MAYA:** You're telling you that your credence function *ought* to reflect the iron's properties. But the linguistic device itself is a tool for managing uncertainty. Look, Sam, the triviality result shows that you can't have a proposition that behaves like a proposition and satisfies Adams's Thesis. You've chosen to keep the proposition and make it shifty. I've chosen to keep the probability constraint and drop the proposition.

  **SAM:** And I think your drop is too costly. You can't explain the logic of compound sentences. You can't explain factual disagreement. You can't explain why conditionals embed under attitude reports like "John believes that if A, C." If there's no proposition, what does John believe?

  **MAYA:** He believes a constraint on his belief state. We can model that without truth conditions.

  **SAM:** But then "believes" is ambiguous. Sometimes it takes a proposition, sometimes it takes a... what? A function from probability functions to constraints? That's not a simplification. That's a complication to save a thesis.

  **MAYA:** It's a complication to save the intuition that everything must be a proposition. Maybe language is more heterogeneous than that. Maybe some things describe, and some things direct.

  **SAM:** We're going to have to agree to disagree on the metaphysics of content. But I will say this: if you want to handle the triviality result without giving up truth conditions, you have to accept that the context dependence is radical. It's not just indexicals. The very algebra of propositions shifts with the credence function.

  **MAYA:** And I'll say: if you want to handle embeddings without giving up Adams's Thesis, you have to accept that logic isn't classical. But neither of us is willing to say the indicative conditional is just the material conditional.

  **SAM:** Agreed. That's the one thing we know it's not.

  **MAYA:** So the triviality result stands as a warning. Either we give up classical logic for conditionals, or we give up the idea that they express standard propositions. I'm choosing the latter.

  **SAM:** And I'm choosing to expand the notion of a proposition.

  **MAYA:** Which might be the same thing, just described more optimistically.

  **SAM:** Maybe. But until you can tell me what the truth conditions of the negation of a conditional are without appealing to conditional credence, I'm sticking with the selection function.

  **MAYA:** And until you can tell me why the probability of your shifting proposition always matches the conditional probability without collapsing into my view, I'm sticking with Adams.

  **SAM:** Fair enough.

  **MAYA:** Thanks, everyone.

  *[End of Script]*
