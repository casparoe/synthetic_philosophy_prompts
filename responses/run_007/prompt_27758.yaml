answer: |-
  Your friend is relying on a semantic sleight of hand. The word "optimal" is being used to smuggle in a specific set of assumptions (infinite repetition, log utility, known probabilities) that do not apply to your situation (finite horizon, single stock, unknown probabilities).

  Here is the menu of distinct claims hidden behind the phrase "Kelly is optimal," ranked from mathematically tautological to practically dangerous.

  ### 1. The Definition Claim
  **Claim:** *The Kelly criterion is the strategy that maximizes the expected value of the logarithm of wealth.*
  *   **Precision:** High. This is essentially the definition of the criterion.
  *   **Plausibility:** **True by construction.** It is a mathematical identity.
  *   **Supports your friend's advice?** **No.** This claim only tells you that Kelly is optimal *if* your utility function is logarithmic. Most humans do not have log utility over their savings. Log utility implies you are indifferent between a 50% chance to double your money and a 100% chance to increase it by ~41% ($\sqrt{2}$). If losing 50% of your savings would ruin your life plans, your utility function is likely much more concave (risk-averse) than log.
  *   **Verdict:** Boring truth. It shifts the burden to you to prove you have log utility.

  ### 2. The Asymptotic Growth Claim
  **Claim:** *The Kelly strategy maximizes the almost-sure long-run rate of wealth growth.*
  *   **Precision:** High. Based on the Law of Large Numbers applied to geometric means (Breiman, 1960).
  *   **Plausibility:** **True, under strict conditions.** It holds if you can make the *same* bet with the *same* edge infinitely many times.
  *   **Supports your friend's advice?** **No.** You are talking about a *single stock* (a single bet or a small sequence of non-identical bets). Asymptotic theorems describe what happens as $N \to \infty$. In a finite horizon, especially $N=1$, the variance of the outcome dominates the expected growth rate. Kelly reduces volatility drag over time, but it does not protect you from a 100% loss on a single bad pick.
  *   **Verdict:** True math, wrong context. Using an infinite-horizon theorem to justify a finite-horizon decision is a category error.

  ### 3. The Dominance Claim
  **Claim:** *Over a sufficiently long horizon, a Kelly bettor will have more wealth than a bettor using any other strategy with probability approaching 1.*
  *   **Precision:** Medium-High. This is the "dominance" property derived from the growth rate claim.
  *   **Plausibility:** **True, asymptotically.** However, "sufficiently long" can be longer than a human lifespan, and "probability approaching 1" allows for paths where the Kelly bettor suffers massive drawdowns (e.g., 90% loss) before recovering.
  *   **Supports your friend's advice?** **No.** First, see the horizon problem above. Second, dominance does not mean "safety." A Kelly bettor can be wiped out by "gambler's ruin" if the edge estimation is wrong (see Claim 5). Third, if your goal is retirement security, "having more wealth than someone else with probability 1" is less relevant than "having enough wealth to eat."
  *   **Verdict:** Misleading. It sounds like a guarantee of success, but it ignores path risk and ruin.

  ### 4. The Time-to-Target Claim
  **Claim:** *The Kelly criterion minimizes the expected time to reach a large wealth target.*
  *   **Precision:** Medium.
  *   **Plausibility:** **True, approximately.** If your goal is to turn \$10k into \$10M as fast as possible, Kelly is theoretically efficient.
  *   **Supports your friend's advice?** **No.** Is your goal to maximize wealth speed, or to preserve savings? If you are investing "a large chunk of savings," your goal is likely capital preservation or steady growth, not speed-running to a billion dollars. Kelly is aggressive; it tolerates 50% drawdowns to get that growth speed.
  *   **Verdict:** Irrelevant goal. This optimizes for aggression, not safety.

  ### 5. The "Known Edge" Claim (The Fatal Flaw)
  **Claim:** *We can accurately calculate the inputs (probability of win and magnitude of payoff) required to use the Kelly formula.*
  *   **Precision:** Low. In finance, these inputs are never known; they are estimated.
  *   **Plausibility:** **False.** In a casino (e.g., blackjack card counting), the edge is mathematically derivable. In the stock market, the "edge" is a subjective estimate.
  *   **Supports your friend's advice?** **Actively Harmful.** The Kelly formula is convex with respect to edge estimation. If you overestimate your edge by even a small amount, the Kelly formula tells you to overbet. **Overbetting Kelly increases risk and *reduces* growth.** If you calculate full Kelly on a stock based on a flawed model, you are mathematically guaranteed to perform worse than if you had bet less. This is why professional investors almost always use "Fractional Kelly" (e.g., half-Kelly).
  *   **Verdict:** Dangerous. Applying Kelly to uncertain estimates without a margin of safety is the fastest way to blow up.

  ### 6. The Universal Optimality Claim
  **Claim:** *Kelly is the objectively best strategy for any investor seeking wealth growth, regardless of utility or horizon.*
  *   **Precision:** None. This is a vague heuristic.
  *   **Plausibility:** **False.** As established in Claim 1, optimality depends on utility. As established in Claim 2, it depends on horizon.
  *   **Supports your friend's advice?** **This is what your friend is saying, but it is wrong.** It treats a specific mathematical tool as a moral imperative for investing.
  *   **Verdict:** False. It ignores risk tolerance, horizon, and parameter uncertainty.

  ---

  ### Summary for Your Friend
  Your friend is making **Claim 6** (Universal Optimality) but justifying it with **Claim 2** (Asymptotic Growth).
  *   **Claim 2** is true mathematically but requires infinite repetition of identical bets.
  *   **Your situation** is a finite horizon with a single, non-repeatable asset with unknown probabilities.
  *   **Conclusion:** Using Full Kelly on a single stock is not "optimal"; it is an aggressive leverage strategy that assumes you know the future distribution of returns better than you actually do.

  ### Confidence and Uncertainty
  **Confidence Level:** **90%**.
  The mathematical distinctions between these claims are well-established in information theory and stochastic control literature (Breiman, Thorp, Cover & Thomas). The mismatch between Kelly's assumptions (i.i.d. repeated bets) and equity investing (non-i.i.d., parameter uncertainty) is a standard critique in quantitative finance.

  **Point of Least Certainty:**
  I am least certain about the precise boundary conditions of **Claim 2 (Asymptotic Growth)** in *real-world* markets versus *theoretical* models. While the theorem holds for i.i.d. (independent and identically distributed) returns, real market returns have fat tails and regime changes. There is ongoing academic debate about how "long" the horizon must be for Kelly to dominate in non-i.i.d. environments. It is possible that in some specific market regimes, Kelly-like sizing converges slower than theory predicts, making the "long-run" argument even weaker than I have stated above. However, this nuance does not salvage the argument for a *single* stock position.
