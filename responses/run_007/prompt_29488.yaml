  # The Intentionality Sorter: Which Knobe Explanation Fits Your Judgments?

  The "Knobe Effect" is the finding that people are more likely to say a side effect was brought about *intentionally* if it is harmful than if it is helpful, even when the agent's knowledge and primary goal remain identical. Philosophers disagree on why this happens. Is it because morality biases our concept of intention? Because we track norm violations? Because we look for alignment with the agent's deep values? Or because of how we use language to assign blame?

  This quiz presents eight concrete scenarios. Do not think about theories. Answer based on your immediate intuition about the agent.

  ### Instructions
  For each case, answer **Yes** or **No** to the question: **"Did the agent bring about the side effect intentionally?"**

  ---

  ### The Vignettes

  **1. The Classic Harm**
  A CEO is told a new program will increase profits but harm the environment. He says, "I don't care about the environment, I just want profit." He launches the program. The environment is harmed.
  *Did he harm the environment intentionally?*
  [ ] Yes [ ] No

  **2. The Classic Help**
  A CEO is told a new program will increase profits and help the environment. He says, "I don't care about the environment, I just want profit." He launches the program. The environment is helped.
  *Did he help the environment intentionally?*
  [ ] Yes [ ] No

  **3. The Heroic Rule-Breaker**
  A hospital administrator is told a new policy will save a patient's life but violates a silly, harmless dress-code rule. He says, "I don't care about the dress code, I just want to save the life." He implements the policy. The rule is violated.
  *Did he violate the rule intentionally?*
  [ ] Yes [ ] No

  **4. The Bureaucrat**
  A hospital administrator is told a strict policy will follow all rules but cause a patient to die. He says, "I don't care about the patient, I just want to follow the rules." He implements the policy. The patient dies.
  *Did he cause the death intentionally?*
  [ ] Yes [ ] No

  **5. The Reluctant Executioner**
  A CEO is told a new program will increase profits but harm the environment. He says, "I hate harming the environment, it makes me sick, but I must save the company." He launches the program. The environment is harmed.
  *Did he harm the environment intentionally?*
  [ ] Yes [ ] No

  **6. The Closet Altruist**
  A CEO is told a new program will increase profits and help the environment. He says, "I just want profit," but secretly he is delighted by the environmental help because he loves nature. He launches the program. The environment is helped.
  *Did he help the environment intentionally?*
  [ ] Yes [ ] No

  **7. The Eccentric**
  A CEO is told a new program will increase profits and change the logo shade from blue to teal. He says, "I don't care about the color, I just want profit." He launches the program. The color changes. (Teal is unusual for this industry).
  *Did he change the color intentionally?*
  [ ] Yes [ ] No

  **8. The Standard**
  A CEO is told a new program will increase profits and keep the logo shade blue. He says, "I don't care about the color, I just want profit." He launches the program. The color stays blue.
  *Did he keep the color blue intentionally?*
  [ ] Yes [ ] No

  ---

  ### Scoring Key

  Tally your **Yes** answers for the following groups of questions.

  *   **The Moralist Score:** Count **Yes** on Q1, Q4. (Max 2)
  *   **The Normativist Score:** Count **Yes** on Q1, Q3, Q7. (Max 3)
  *   **The Deep Self Score:** Count **Yes** on Q1, Q6. Count **No** on Q5. (Max 3 points: 1 for Q1-Yes, 1 for Q6-Yes, 1 for Q5-No)
  *   **The Pragmatist Score:** Count **Yes** on Q1, Q3, Q4. Count **No** on Q7. (Max 4 points: 1 for Q1-Yes, 1 for Q3-Yes, 1 for Q4-Yes, 1 for Q7-No)

  **Your Dominant View:**
  *   **Highest Moralist Score:** *The Moral Valence View.* You think intentionality is inextricably linked to moral badness. If it's bad, it's intentional. If it's good or neutral, it isn't.
  *   **Highest Normativist Score:** *The Norm Violation View.* You think intentionality tracks deviation from the norm. If the agent broke a pattern (moral or statistical), you call it intentional.
  *   **Highest Deep Self Score:** *The Deep Self View.* You think intentionality tracks the agent's internal values. If the side effect aligns with what they truly care about (or don't regret), it is intentional.
  *   **Highest Pragmatist Score:** *The Conversational-Pragmatics View.* You think intentionality is a tool for assigning responsibility. You affirm it when it is conversationally relevant to blame or highlight a violation, but deny it when there is no stake (Neutral cases).

  *(In case of a tie: If Moralist and Pragmatist tie, you belong to the "Morally-Sensitive Cluster." If Normativist and Pragmatist tie, check Q7: a Yes confirms Normativist, a No confirms Pragmatist.)*

  ---

  ### Behind the Curtain: The Logical Space

  This quiz was constructed by mapping the logical space of the Knobe Effect's explanatory variables. There are 8 questions, yielding $2^8 = 256$ possible answer patterns. However, the vast majority of these cells are empty because they represent incoherent judgments (e.g., claiming the Classic Help was intentional but the Classic Harm was not).

  **Locating the Views**
  The four theories occupy specific regions of this logical space based on how they weigh three variables: **Moral Valence** (Good/Bad), **Norm Status** (Violation/Conformity), and **Agent Attitude** (Regret/Endorsement).

  1.  **The Moral Valence View** occupies the cell where Intentionality = Badness.
      *   *Signature:* Yes on Harm (Q1, Q4), No on Help/Neutral (Q2, Q3, Q7).
      *   *Constraint:* This view cannot account for the "Heroic Rule-Breaker" (Q3) as intentional, because the outcome is good.
  2.  **The Norm Violation View** occupies the cell where Intentionality = Deviation.
      *   *Signature:* Yes on Violations (Q1, Q3, Q7), No on Conformity (Q2, Q4, Q8).
      *   *Constraint:* This view predicts the Bureaucrat (Q4) did *not* kill intentionally, because he followed the rules. This is often counter-intuitive to those focused on blame.
  3.  **The Deep Self View** occupies the cell where Intentionality = Concordance.
      *   *Signature:* Sensitive to Q5 (Regret) and Q6 (Secret Joy).
      *   *Constraint:* This view is the only one that says the Reluctant Executioner (Q5) did *not* harm intentionally (because he regretted it) and the Closet Altruist (Q6) *did* help intentionally (because he valued it).
  4.  **The Pragmatics View** occupies a region overlapping with Moral Valence but distinct on Neutral Salience.
      *   *Signature:* Matches Moral on Valence cases (Q1, Q4 = Yes; Q2, Q6 = No) but diverges on Q3 (Good Violation).
      *   *Rationale:* A pragmatist says "He intentionally broke the rule" in Q3 because the violation is the salient point of the description, even if the outcome is good. However, like the Moralist, they say "No" to the Neutral Violation (Q7) because there is no conversational stake in assigning intentionality to a color change.

  **Empty and Problematic Cells**
  *   **The "Reverse Knobe" Cell:** A pattern where Q2 (Help) is Yes and Q1 (Harm) is No is logically possible but empirically empty. No major theory predicts this. If you scored here, your judgments may be inconsistent or you hold a unique "Praise-Asymmetry" view.
  *   **The "Universal Intentionalist" Cell:** Answering Yes to everything. This corresponds to a simple "Foresight" view (if you knew it, you did it). This view is largely abandoned in experimental philosophy because it fails to explain why people *deny* intentionality in the Classic Help case.
  *   **The "Universal Denier" Cell:** Answering No to everything. This corresponds to a strict "Purpose" view. Like the Foresight view, it fails to capture the asymmetry data.

  **Indistinguishable Views & Limitations**
  This quiz cannot perfectly separate the **Moral Valence View** from the **Pragmatics View** in all contexts. Both predict the standard asymmetry (Q1=Yes, Q2=No).
  *   *The Overlap:* On questions 1, 2, 4, 5, 6, 7, and 8, the Moral and Pragmatic profiles are identical (or nearly so).
  *   *The Separator:* Question 3 (The Heroic Rule-Breaker). The Moral view must say **No** (the outcome is good). The Pragmatic view can say **Yes** (the rule-breaking is conversationally relevant).
  *   *The Limitation:* If you answered **No** to Q3, you fall into the "Morally-Sensitive Cluster." Distinguishing whether you are a Moralist (intentionality *is* blame) or a Pragmatist (intentionality *implicates* blame) requires a meta-linguistic question (e.g., "Is he intentional *because* he is bad?" vs "Do we *call* him intentional *because* we want to blame him?"). This quiz measures your judgments, not your metaphysical commitments.

  **Defense of Design**
  I selected Q3 and Q4 specifically to decouple Norm Violation from Moral Valence. Standard Knobe cases confound these (Harm is usually a Violation; Help is usually Conformity). By crossing them, we force the Norm and Moral views to diverge. I selected Q5 and Q6 to isolate the Deep Self view, as only that theory is sensitive to the agent's internal regret or endorsement independent of the outcome's value. Finally, Q7 (Neutral Violation) is the only clean test for the Pragmatics view against the Norm view; if you think a neutral norm violation is intentional, you are a Normativist. If you think it is unintentional because no one cares, you are a Pragmatist.
