answer: |-
  **Scenario: The Kitchen Counter**

  Elena stands in her sunlit kitchen, looking at the counter where a red Fuji apple appears to be sitting. In the Veridical Case, a real apple is present, reflecting light normally onto her retina. In the Illusory Case, a hyper-realistic wax replica occupies the exact same spot, lit identically by the sun. Elena is aware that wax fruit exists and knows people sometimes mistake them for real apples, yet she cannot distinguish this specific instance from a real apple by looking alone. In both cases, she points at the object and says, "I see a red apple," and she reaches out to hold it with the same confidence, grip shape, and motor coordination.

  ***

  **Seminar Discussion Guide**

  **(1) Verdicts and Agreement on Behavior**
  Both theorists agree on the observable data: Elena's first-person report ("I see a red apple") and her physical behavior (pointing and reaching) are identical in both cases. They also agree that Elena is phenomenally conscious; something it is like for her to be in this situation. The **Common-Kind Theorist** argues that because the reports and behaviors are identical, there must be a shared fundamental mental state (an "experience as of an apple") present in both the Veridical and Illusory cases. The **Disjunctivist** argues that while the reports match, the metaphysical nature of the episodes is fundamentally different: in the Veridical Case, the experience is constituted by the apple itself, while in the Illusory Case, it is a mere appearance that merely seems to be an apple.

  **(2) The Exact Point of Split**
  The disagreement arises over the *explanation* of the matching reports. The Common-Kind Theorist claims the best explanation for the matching behavior is a matching internal cause (a common factor). The Disjunctivist denies that the matching behavior requires a matching fundamental mental kind. For the Disjunctivist, the Veridical Case is a success state (perception), and the Illusory Case is a failure state (illusion) that only mimics the success state. They split on whether the "commonality" is a deep metaphysical identity or a superficial similarity in description.

  **(3) The Working Feature and Removal**
  The feature doing the philosophical work is **subjective indistinguishability**. The case relies on the fact that Elena cannot tell the difference from the inside, despite the physical difference. If you remove this feature—for example, if the wax apple had a visible seam or looked slightly dull—the Common-Kind argument loses its force. If the cases were distinguishable, there would be no pressure to posit a common mental state to explain why she acts the same way, because she *wouldn't* act the same way (she wouldn't reach for the wax fruit believing it was real). The indistinguishability is what forces the Common-Kind theorist to posit a shared internal state and forces the Disjunctivist to explain how distinct states can be indistinguishable.

  **(4) The Strongest Common-Kind Objection**
  The Common-Kind theorist's strongest objection is the **Argument from Best Explanation**. They would press the Disjunctivist on how two fundamentally different mental states can be subjectively indistinguishable. If the Veridical experience is constituted by the world and the Illusory experience is not, why does the subject cannot tell them apart? The Common-Kind theorist argues that positing a shared conscious component is the only way to explain the indistinguishability. They will claim the Disjunctivist leaves this matching phenomenology as a brute coincidence, whereas the Common-Kind theory explains it naturally: she can't tell the difference because, at the level of experience, there is no difference.
