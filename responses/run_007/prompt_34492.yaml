answer: |-
  **MEMORANDUM**

  **TO:** Compensation Committee Members
  **FROM:** Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Outside Consulting Income and Surplus Sharing

  **Recommendation:** I recommend that we **deny the exception** to the founding surplus-sharing rule for this specific consulting contract, effective immediately, while simultaneously authorizing a **30-day emergency working group** to draft a standing policy on Outside Professional Activities for member vote. This course of action upholds our current binding agreement to prevent immediate class division, while acknowledging that our governance on private income requires explicit clarification rather than ad-hoc ultimata.

  This decision forces us to confront the underlying philosophical tension of our cooperative: whether an inequality produced by voluntary transfer can be unjust within our specific association, and whether preserving the equal-share pattern is worth the interference with individual exchange. The argument for granting the exception rests on a robust libertarian principle, akin to Nozick's Wilt Chamberlain thought experiment: if a client voluntarily pays a member for her labor, interfering with that transaction violates her self-ownership and liberty. This is the strongest consideration on the losing side, and it must be acknowledged as morally weighty. In a general market society, that argument would be decisive. However, we are not a general market society; we are a voluntary association founded on the specific purpose of decommodifying our labor and sharing the fruits of our collective standing equally.

  The risk of granting the exception is not merely financial; it is existential. If we allow one member to convert the reputation and standing built by the collective into private income, we implicitly validate a two-tier membership: those who can leverage external markets and those who cannot. This undermines the "entire surplus" rule that defines us. While the interference with the engineer's free exchange is real, it is the price of membership in an organization designed to prioritize pattern-based equality over unbridled liberty of exchange. We cannot maintain the co-op's identity if we allow the pattern to be broken whenever a lucrative private offer arises.

  However, denying the exception without further discussion treats a governance gap as a personnel failure. We have not explicitly defined the boundary between "private ability" and "cooperative surplus." Therefore, while we must enforce the current rule to maintain integrity, we will spend the next 30 days drafting a policy that clearly defines what income must be pooled. This respects the liberty argument by giving it a formal hearing for future governance, rather than dismissing it, while maintaining the equality pattern required for our present survival.

  ***

  | Consideration | Pulls toward | Weight | How the memo handles it |
  | :--- | :--- | :--- | :--- |
  | **Co-op Integrity & Class Division** | No Exception | High | Identifies the risk of creating two classes of members as an existential threat to the founding rule, making it the primary justification for the denial. |
  | **Liberty & Voluntary Exchange (Nozick)** | Exception | High | Acknowledged as morally weighty and valid in a general market context, but framed as subordinate to the specific associative purpose of the co-op. |
  | **Retention of Senior Talent** | Exception | Medium | Addressed indirectly; prioritizes long-term governance stability over short-term retention, but offers a policy review to prevent future resignations over ambiguity. |
  | **Precedent & Rule of Law** | No Exception | High | Emphasizes that ad-hoc exceptions undermine the binding nature of the founding rule; shifts the focus to a formal policy change process instead. |
  | **Definition of "Surplus"** | Policy Review | Medium | Recognizes the ambiguity between "private ability" and "collective standing" as a governance gap that the 30-day working group must resolve. |
