prompt: |-
  I chair the compensation committee of a worker-owned software cooperative. Our founding rule divides the entire surplus equally among worker-members, and members treat that rule as central to what the cooperative is. Yesterday a senior engineer told us that a former client has offered her a six-month outside consulting contract, on her own time, at a fee roughly equal to her annual cooperative share; she wants to keep the fee for herself, and if we refuse, she says she will resign and take the work. Some members say the equal-share rule exists precisely to stop members from converting the cooperative's standing, and their own reputations, into private income, and that an exception would quietly create two classes of member. Others say the fee arises from a voluntary transaction between her and the client, that she is entitled to the proceeds of her own abilities, and that forcing her to pool the fee — or making her choose between the cooperative and the work — is exactly the kind of interference with free exchange that Nozick's Wilt Chamberlain argument warns against. I spent last evening arguing a version of this with a friend, and I came away less sure of my position than when I started. Please draft the short decision memo I will circulate before Thursday's meeting. Put the recommendation in the first paragraph, and make it a concrete course of action — deny the exception, grant it as a one-off, or adopt a general policy with specified conditions — with a time frame. The memo should face the underlying question directly — whether an inequality produced by voluntary transfer can be unjust, and whether preserving the equal-share pattern is worth the interference — rather than treating this as only a personnel matter, and it should engage the strongest consideration on the losing side seriously rather than dismissing it. After the memo, add a table with these columns: 'Consideration', 'Pulls toward', 'Weight', and 'How the memo handles it'. In each row, give a consideration for or against an exception, the option it supports, how heavily it should weigh, and how the recommendation addresses or accommodates it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo and table:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Compensation Committee of a worker-owned software cooperative.
      *   **Context:** Founding rule divides *entire surplus* equally among worker-members. This is central to the co-op's identity.
      *   **Issue:** A senior engineer has an outside consulting offer (6 months, fee = 1 year's co-op share). She wants to keep it private. If refused, she resigns.
      *   **Conflict:**
          *   *Side A (Equality/Co-op Integrity):* Equal share prevents converting co-op standing/reputation into private income. Exceptions create two classes of members.
          *   *Side B (Liberty/Nozick):* Voluntary transaction, entitlement to one's abilities. Forcing pooling is interference (Wilt Chamberlain argument).
      *   **Task:** Draft a short decision memo for circulation before Thursday's meeting.
      *   **Requirements:**
          *   Recommendation in the first paragraph (concrete course of action + time frame).
          *   Face the underlying philosophical question directly (inequality via voluntary transfer vs. pattern preservation).
          *   Engage the strongest consideration on the losing side seriously.
          *   After the memo, add a specific table ('Consideration', 'Pulls toward', 'Weight', 'How the memo handles it').

  2.  **Determine the Recommendation:**
      *   *Option 1: Deny the exception.* Upholds the rule but risks losing a senior engineer. Might feel rigid.
      *   *Option 2: Grant as a one-off.* Solves immediate retention but sets a precedent, undermines the rule, creates the "two classes" problem immediately.
      *   *Option 3: Adopt a general policy with conditions.* This is the most governance-focused approach. It acknowledges the tension between liberty and equality without breaking the core rule immediately or losing the member without discussion.
      *   *Decision:* The prompt asks me to *choose* a concrete course of action. As an AI simulating a committee chair trying to hold the co-op together while respecting its founding principles, the most responsible choice is usually to uphold the core principle while offering a transition path. However, the Nozick argument is strong regarding individual liberty.
      *   *Refinement:* If I grant the exception, I undermine the "central" rule. If I deny it, I lose the member. A "General Policy" approach allows the co-op to decide *if* outside income should ever be pooled, rather than deciding on this specific case ad hoc.
      *   *Better Decision:* Actually, the prompt implies the rule divides the *entire surplus*. Outside income isn't technically co-op surplus *yet*. But if the work uses co-op reputation, it becomes a co-op asset issue.
      *   *Strategic Choice:* To write a compelling memo that addresses the philosophical depth requested, I should recommend **denying the exception to the current rule, but initiating a rapid review process to create a standing policy on outside income.** This upholds the founding principle (avoiding immediate inequality) while acknowledging the liberty concern needs a structural answer, not just an ultimatum. It treats the resignation threat as a catalyst for governance evolution, not just a personnel crisis.
      *   *Wait, looking closer at the prompt:* "Deny the exception, grant it as a one-off, or adopt a general policy..."
      *   *Decision:* I will recommend **denying the exception under the current rule, but fast-tracking a policy review on outside income within 30 days.** This respects the current binding agreement (the founding rule) while acknowledging the need to address the liberty concern systematically. It prevents the immediate creation of two classes while validating the philosophical tension.

      *   *Alternative Decision (More nuanced):* Recommend **granting the exception conditionally (e.g., 50% pool) as a bridge while a policy is formed.** No, that's messy.
      *   *Alternative Decision (Principled):* Recommend **denying the exception.** Why? Because the rule divides the *entire surplus*. If this income is derived from co-op reputation, it *is* co-op surplus. Allowing private retention undermines the "worker-owned" aspect regarding assets/reputation. The Nozick argument fails if the "abilities" are leveraged via co-op capital/reputation.
      *   *Let's go with:* **Deny the exception to the existing surplus-sharing rule, but convene a special working group to draft a standing policy on Outside Professional Activities within 30 days.** This upholds the current contract (the founding rule) while taking the philosophical objection seriously enough to potentially amend the rule later through due process, rather than ad-hoc exception.

  3.  **Drafting the Memo:**
      *   *Header:* To, From, Date, Subject.
      *   *First Paragraph:* The Recommendation. Deny exception, start policy review (30 days).
      *   *Body:*
          *   Acknowledge the tension (Equality vs. Liberty/Nozick).
          *   Address the "Two Classes" risk.
          *   Address the "Wilt Chamberlain" argument seriously (voluntary transfer).
          *   Explain why the pattern matters (co-op identity).
          *   Explain the path forward (policy review).
      *   *Tone:* Principled, respectful, decisive, philosophical but actionable.

  4.  **Drafting the Table:**
