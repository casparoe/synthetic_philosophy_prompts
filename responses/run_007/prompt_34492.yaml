      *(Wait, let's look at the "Losing Side" requirement again)*: "engage the strongest consideration on the losing side seriously rather than dismissing it."
      *   If I recommend Denying, the Losing Side is the Engineer/Nozick side. I must acknowledge that voluntary exchange is morally significant and that forcing pooling *is* an interference, but justify why the co-op's associative rights trump it in this instance.

