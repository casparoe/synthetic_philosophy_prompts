  When time outlasts the burning of the stars,
  And heat death leaves the void in balance cold,
  Till entropy has closed the cosmic scars,
  Yet fluctuations wander, uncontrolled.
  For atoms dancing in the empty space
  May forge a mind with memories of yore,
  Requiring less than worlds with time and place,
  Or evolution's long and winding shore.
  So turn the logic on the self who sees,
  For most who think are thermal, transient freaks.
  My history dissolves in chance's seas,
  And truth fades from my pale and phantom cheeks.
  This doubts the world that memory implies,
  But not the thought that thinks before my eyes.
