  *(Self-Correction on "Fatal" vs "Awkward")*: A truly fatal defeater would show the logic is incoherent. An awkward one makes it unpalatable. I need to ensure the distinction is clear. The "Subjectivity Gap" is the strongest candidate for fatal. The "Fragmentation" is also very strong.

