          *   The Fudge (Counterfactuals, Agency).
          *   The Void (Logical Causation, Subjunctive Dependence).
      *   **Assessment:** Is it new or incoherent? (It's an axiom change, not a theorem within standard GT).
      *   **Conclusion:** Summary for a mechanism designer.

  8.  **Refining the Technical Details (Self-Correction during drafting):**
