answer: |-
  This is a sharp question. You are right to be skeptical: "Acausal trade" (AT) often sounds like mysticism draped over decision theory. However, beneath the LessWrong jargon, there is a formal claim about the structure of strategic interaction under **logical uncertainty** rather than empirical uncertainty.

  Here is the translation of Acausal Trade into standard Game Theory (GT) and Mechanism Design (MD) vocabulary, followed by the residue report you requested.

  ---

  ### Part 1: The Translation
  **Core Claim:** Acausal trade is the realization of a Pareto-superior equilibrium in a one-shot game with no causal communication channel, enabled by **endogenous correlation of strategies** derived from **common knowledge of algorithmic structure**.

  #### 1. The Setup: A Bayesian Game with Logical Types
  *   **Standard GT:** Players have types $\theta_i$ drawn from a prior. Strategies $s_i(\theta_i)$ map types to actions. Conditional on types, strategies are typically assumed independent (Nash) or correlated by an external signal (Correlated Equilibrium).
  *   **AT Translation:** The "type" includes the player's **source code** or decision algorithm $A_i$. The game is played not by agents choosing actions directly, but by agents submitting algorithms that output actions.
  *   **Information Structure:** There is **Common Knowledge of Rationality** extended to **Common Knowledge of Source Code** (or a high-fidelity probability distribution over it). I know your algorithm; you know mine.

  #### 2. The Mechanism: Program Equilibrium
  *   **Standard GT:** In a standard Normal Form Game, $s_1 \perp s_2$ conditional on types.
  *   **AT Translation:** This maps most cleanly to **Program Equilibrium** (Tennenholtz, 2004). Players submit programs $P_1, P_2$ that play the base game.
      *   In standard Program Equilibrium, programs can *read* each other's source code.
      *   In Acausal Trade, programs cannot read each other (causal disconnection), but they share a **logical dependency**. If $P_1$ and $P_2$ are sufficiently similar (instantiations of the same decision theory, e.g., FDT), then $Output(P_1) = Output(P_2)$ is a logical fact, not a causal event.
  *   **The "Trade":** The mechanism selects the equilibrium where $P_1$ and $P_2$ output "Cooperate" because the fixed point of the mutual simulation is $(C, C)$ rather than $(D, D)$.

  #### 3. The Equilibrium Concept: Correlated Equilibrium without a Mediator
  *   **Standard GT:** A Correlated Equilibrium (CE) requires a mediator sending signals $S$ such that $P(a_1, a_2 | S) \neq P(a_1|S)P(a_2|S)$.
  *   **AT Translation:** AT posits a **CE with Endogenous Correlation**. The "signal" is the logical output of the computation. Because both agents are running logically equivalent (or functionally isomorphic) decision procedures, the probability distribution over actions is correlated *by logical necessity*, not by causal influence or external signal.
      *   *Constraint:* $P(Action_1 = C | Algorithm_1 \approx Algorithm_2) \approx P(Action_2 = C | Algorithm_1 \approx Algorithm_2)$.

  #### 4. Enforcement: Logical Binding vs. Contractual Binding
  *   **Standard GT:** Enforcement requires repeated interaction (folk theorems), contracts, or external penalties.
  *   **AT Translation:** Enforcement is **Logical Binding**. Defecting is not "punished" by the other player; rather, the act of deciding to defect *logically implies* the other player defects. You cannot unilaterally deviate from the correlated equilibrium because your decision procedure *is* the source of the correlation. To "choose" Defect is to choose a world where the other player Defects. This is modeled not as a causal intervention ($do(Action=D)$), but as a logical conditional ($If\ Output(MyAlgo)=D \implies Output(YourAlgo)=D$).

  ---

  ### Part 2: The Residue Report

  Here is where the mapping breaks down, requires fudging, or reveals a genuine divergence in axioms.

  #### 1. What Maps Cleanly
  *   **Program Equilibrium:** The structural setup is identical to Tennenholtz's Program Equilibrium. If you allow agents to submit code that plays the game, cooperation in one-shot PD is a known result.
  *   **Common Priors:** AT relies heavily on the Harsanyi Doctrine (Common Priors). If we disagree on the probability that our algorithms are correlated, trade fails. This is standard Bayesian epistemology.
  *   **Mechanism Design as Algorithm Design:** Viewing the "mechanism" as the decision algorithm itself is compatible with implementation theory, specifically **implementation in undominated strategies** where the strategy space is the set of computable functions.

  #### 2. What Required Fudging (The "Hand-Wave" Zone)
  *   **The Counterfactual:** In GT, counterfactuals are causal (Pearl's $do$-operator). "If I deviate, what happens?" assumes my deviation does not causally change your type or strategy.
      *   *The Fudge:* AT uses **Logical Counterfactuals**. "If I output D, does the logical fact $2+2=4$ change?" No. But "If I output D, does the output of an isomorphic algorithm change?" AT says yes. Standard GT has no operator for "intervening on a logical fact." You have to import **Logical Induction** or **Proof-Limited Decision Theory** to make this rigorous, which is not standard GT.
  *   **Agency vs. Determinism:** In GT, a strategy is a choice. In AT, if agents are deterministic algorithms, the output is a fixed mathematical fact.
      *   *The Fudge:* AT treats the *search* for the fixed point as the "choice." It conflates *computing* the answer with *choosing* the answer. Standard GT assumes the choice is primitive; AT assumes the choice is the output of an optimization process over logical space.

  #### 3. What Has No Counterpart (The "Void")
  *   **Subjunctive Dependence:** This is the core AT concept with no GT equivalent. It asserts that two causally disconnected systems can be **subjunctively dependent** (my decision *controls* yours via logical identity) without being **causally dependent**.
      *   Standard GT assumes **Causal Independence of Strategies**: Conditional on types, my mixed strategy is independent of yours. AT explicitly violates this axiom without a mediator.
  *   **Acausal Enforcement:** In MD, enforcement requires a channel (legal, physical, reputational). AT claims **Logic is an Enforcement Channel**. There is no mechanism design literature where the laws of logic act as the enforcement mechanism for a contract.
  *   **Decision Theory as a Primitive:** Standard GT takes the decision rule (Maximize Expected Utility) as given. AT treats the Decision Theory (CDT vs. EDT vs. FDT) as a variable in the game. The "insight" is that CDT agents cannot acausally trade; FDT agents can. GT usually assumes all players are Nash maximizers (CDT-adjacent).

  ---

  ### Part 3: The Verdict

  **Is Acausal Trade a rediscovery?**
  Partially. It is a rediscovery of **Program Equilibrium** and the power of **Correlated Equilibrium**, but it attempts to generalize them to environments where the "correlation device" is not observable or external, but internal and logical.

  **Is there a genuinely new insight?**
  Yes, but it comes at the cost of changing the axioms of **Choice**.
  *   **Standard GT Axiom:** Strategies are independent variables conditional on types.
  *   **AT Axiom:** Strategies are logically dependent variables conditional on algorithmic similarity.

  The insight is that **logical correlation is a resource** that can be harvested for cooperation, just like causal communication or repeated interaction. If you accept that agents can have high-fidelity models of each other's reasoning (common in AI, less so in humans), then ignoring logical correlation is leaving utility on the table.

  **Is it incoherent?**
  From a strict Causal Decision Theory (CDT) standpoint: **Yes.** CDT says you cannot influence a causally disconnected node.
  From a Functional Decision Theory (FDT) standpoint: **No.** FDT says you choose the *output of the function*, and since the other agent runs the same function, you choose their output too.

  **The Mechanism Designer's Take:**
  Your vocabulary isn't "missing" something; it's **axiomatically restricted** to causal structures.
  1.  **If you treat logic as causal:** AT is nonsense. You can't enforce a contract with math.
  2.  **If you treat logic as a correlation device:** AT is a specific subclass of Correlated Equilibrium where the mediator is the logical structure of the agents themselves.

  **Conclusion:**
  Acausal Trade is not magic; it is **Mechanism Design over Logical Uncertainty**.
  *   **The Coherent Core:** If agents are transparent algorithms (AI), they can achieve cooperation in one-shot games by conditioning strategies on the *logical output* of the opponent's algorithm, effectively creating a binding contract without a court. This is rigorous Program Equilibrium.
  *   **The Incoherent Periphery:** Extending this to humans, or claiming "logical causation" exists in the same ontology as physical causation, is where it drifts into philosophy.
  *   **The Gap:** Your field assumes strategies are chosen *ex nihilo* by agents. AT assumes strategies are *computed* by algorithms. If you model your agents as **Turing Machines** rather than **Utility Maximizers**, the "acausal" trade becomes a standard fixed-point computation.

  **Recommendation:** Don't dismiss it as mysticism, but don't accept the "acausal" label. Treat it as **Correlated Equilibrium with Endogenous Logical Correlation in a Program Game**. If you model the players as code, the "trade" is just a Nash Equilibrium of the meta-game where the strategy space is the set of programs. The "acausal" part is just a description of the lack of I/O channels between the programs during execution.
