      *   *Correction:* Explicitly mention Tennenholtz (2004) "Program Equilibrium." That is the bridge paper.
      *   *Correction:* Be careful with "Correlated Equilibrium." Aumann's CE requires a signal. AT claims the signal is internal/logical. Call it "Endogenous Correlation."
      *   *Nuance:* The "enforcement" in AT isn't punishment; it's the logical necessity that defection implies the other defects. It's a *binding constraint* imposed by logic, not a contract.

  9.  **Final Polish:** Ensure the tone is professional, not dismissive of either field, but rigorous. (The user wants to know if their vocabulary is missing something or if AT is nonsense. The answer is "Your vocabulary assumes causal independence of strategies; AT drops that axiom.")

  10. **Final Review against constraints:**
      *   Use GT vocabulary? Yes.
      *   Residue report? Yes.
      *   Verdict on coherence/novelty? Yes.

