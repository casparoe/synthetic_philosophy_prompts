prompt: |-
  I'm a game theorist, mechanism design mostly. I keep hearing people in the rationalist/AI alignment world talk about "acausal trade" — the idea that agents can cooperate even when there's no causal channel between them, so long as each can reason about the other's reasoning. I get Newcomb's problem and the smoking lesion stuff, but the acausal trade thing specifically feels like it's trying to get at something my field already has words for. Restate the core acausal trade arguments in the vocabulary I actually use — types, Bayesian games, correlated equilibrium, commitment, contracts, mechanisms, enforcement — as precisely as you can. Then give me the residue report: what maps cleanly, what you had to fudge, and what has no counterpart at all. I want to know whether acausal trade is just a rediscovery of something game theorists already understand, or whether there's a genuinely new insight here that my vocabulary can't capture, and if so whether that's because my vocabulary is missing something or because the acausal trade story is less coherent than it sounds.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

