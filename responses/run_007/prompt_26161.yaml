prompt: |-
  I'm prepping for a podcast interview with a philosopher who's been arguing that Dennett's careenium thought experiment actually cuts the other way — that if you take the setup seriously, the symbols really do push the simmballs around, not just the other way. They're not a dualist, they think this all fits within physicalism, but they reject the idea that the intentional level is "just" a useful shorthand with no causal work of its own. I need eight to ten questions. I want at least one that presses on what "causal work" even means here if you're not adding new forces to the physics — is it just about incompressibility of the macro description, or is there a meatier claim? One on causal closure: if each simmball's next state is fully determined by local physical interactions, where exactly does the macro-level causation get its grip? One on whether the mapping between a given symbol and a particular simmball-configuration is determinate or observer-relative, and what happens to their position if it's the latter. For each question, give me the follow-up I'd ask if they give the reply you expect. And I want at least one question that asks them to describe a specific variant of the careenium — a tweak to the setup — that would count as evidence against their view, and what they'd have to concede if things turned out that way.
