answer: |-
  Your friend is articulating a position known as **Dennettian Illusionism** or the **Multiple Drafts Model**. Her negative project is clear: she is dismantling the "Cartesian Theater" (the idea of a central observer watching a show). But her positive view is that consciousness is not a *thing* or a *place*, but a **functional status**.

  On this view, a mental content becomes "conscious" not when it glows with intrinsic qualia, but when it achieves **"fame in the brain."** That is, when the information is broadcast to enough subsystems (memory, speech, motor control) to influence the organism's behavior and narrative.

  Here are three candidate rules that fit her first six verdicts, their predictions for your blindsight case, and an analysis of which one she likely holds.

  ### Candidate Rule 1: The Narrative Coherence Rule
  **The Rule:** A state is conscious if and only if it is successfully integrated into the subject's ongoing spatiotemporal self-narrative. The "story" the brain tells is the reality of consciousness.
  *   **Fit with Verdicts 1–6:**
      *   *Color Phi/Rabbit:* The brain constructs a coherent story (moving dot, hopping taps). That story *is* the experience, even if it contradicts physical timing.
      *   *Change/Inattentional Blindness:* The subject claims a rich narrative ("I saw the whole scene"), but objective testing shows the details were never integrated into the functional story. The feeling of richness is a false chapter in the narrative.
  *   **Prediction for Blindsight:** **Unconscious.**
      *   *Why:* The subject's narrative explicitly excludes the stimulus ("I do not see anything"). Even though they can guess, the information is not woven into their *phenomenal story* of the world. It remains a "sub-personal" guess, not a personal experience.
  *   **Implication:** If you trained the subject to say "I see it," they would *become* conscious of it, because the narrative would change.

  ### Candidate Rule 2: The Veridical Metacognition Rule
  **The Rule:** A state is conscious if and only if the subject has accurate second-order access to it (i.e., their confidence tracks their accuracy). Consciousness is a monitoring system.
  *   **Fit with Verdicts 1–6:**
      *   *Color Phi/Rabbit:* The subject is confident in the illusion; the monitoring system is active (even if the content is constructed).
      *   *Change/Inattentional Blindness:* Subjects are often confident they saw the detail, but their confidence does *not* track accuracy (they are wrong). Therefore, they were not conscious of the detail.
      *   *Backward Masking:* No time for monitoring to occur.
  *   **Prediction for Blindsight:** **Conscious.**
      *   *Why:* You specified that confidence ratings begin to track accuracy. The monitoring system is functioning. The verbal report ("I don't see") is just a semantic label; the functional reality of monitoring proves consciousness exists.
  *   **Implication:** The subject was conscious all along; they just had a mistaken theoretical belief about what "seeing" requires.

  ### Candidate Rule 3: The Functional Availability Rule (Dennett's Orthodoxy)
  **The Rule:** A state is conscious if and only if the information is globally available for flexible control of behavior (including speech, memory, and motor action), regardless of the subject's theoretical commitments. Consciousness is a capacity, not a feeling.
  *   **Fit with Verdicts 1–6:**
      *   *Color Phi/Rabbit:* The constructed content is available for report and memory.
      *   *Change/Inattentional Blindness:* The pre-change detail was *not* available for report or memory (proven by the failure to notice). The feeling of richness was a separate, available judgment, but the detail itself was not.
      *   *Backward Masking:* The target information was not available for report; the mask won the competition for "fame."
  *   **Prediction for Blindsight:** **Conscious.**
      *   *Why:* The information is clearly available. It drives guessing behavior. It drives confidence ratings. The fact that the subject refuses to use the word "see" is a philosophical error on their part (a commitment to qualia they don't have), not a lack of consciousness. They have "access consciousness" even if they deny "phenomenal consciousness."
  *   **Implication:** Consciousness is a matter of degree and function. The subject is conscious of the stimulus, but their *concept* of consciousness is too narrow.

  ---

  ### Which Rule Does She Hold?

  **My Best Guess: Rule 3 (Functional Availability).**

  Here is why: Your friend's verdicts on **Change Blindness** and **Color Phi** reveal a specific pattern. In Change Blindness, she denied consciousness *despite* the subject's verbal report ("I saw the scene"). This rules out a simple "Verbal Report" rule. She prioritized the *lack of informational access* over the subject's assertion.

  However, in Color Phi, she accepted the experience *despite* the physical impossibility. She prioritized the *constructed narrative* over physical reality.

  Rule 3 bridges this. It says: "Consciousness is what the brain *does* with the info."
  *   In Change Blindness, the brain *didn't* do anything with the detail (no access), so no consciousness.
  *   In Color Phi, the brain *did* do something with the flashes (constructed a motion narrative), so there was consciousness (of the illusion).
  *   In Blindsight, the brain *is* doing something with the stimulus (guessing + confidence). Therefore, it is conscious.

  Dennett explicitly argues that blindsighters often deny consciousness because they have a "Cartesian" definition of seeing (requiring a mental picture). If they adopt a functional definition (being able to use the info), they would admit they see. Your friend's reliance on Dennett suggests she views the subject's insistence ("I don't see") as a theoretical commitment to be corrected, not an infallible datum.

  ### The Tie-Breaker Case

  To cleanly separate **Rule 1 (Narrative)** from **Rule 3 (Functional)**, you should ask her this:

  **The "Semantic Rehabilitation" Case:**
  > "Take the blindsight patient from my scenario. They have high accuracy and confidence tracking, but say 'I don't see.' Now, imagine we train them over months to change their vocabulary. We teach them that 'seeing' just means 'being able to point to the dot.' We don't change their brain or their accuracy; we only change the label they are willing to assert. Eventually, they say 'I see the dot' whenever they are confident.
  >
  > **Did their consciousness change when their vocabulary changed?**"

  *   **If she says "Yes":** She holds **Rule 1 (Narrative Coherence)**. For her, consciousness *is* the story. If the story changes from "blind" to "sighted," the conscious status changes.
  *   **If she says "No":** She holds **Rule 3 (Functional Availability)**. For her, the consciousness was there when the access was there. The verbal report was just a lagging indicator. The training didn't create consciousness; it created *honest reporting* of the consciousness that already existed.

  **Why this works:** It isolates the *report* from the *function*. Rule 1 makes consciousness dependent on the narrative label. Rule 3 makes consciousness dependent on the underlying access, treating the label as merely descriptive. Given her Dennettian leanings, she should say **"No,"** but many people intuitively feel the "No" denies the subjective reality. Her answer will reveal whether she treats consciousness as a *construction* (Rule 1) or a *capacity* (Rule 3).
