answer: |-
  # Adversarial Collaboration Document: Scope and Definition of AI Alignment

  **Collaborators:** Position A (Intent/Narrow Alignment) & Position B (Value/Broad Alignment)
  **Date:** October 26, 2023
  **Facilitator:** Seminar Participant

  ### Preamble: On Terminology and Substance
  Both parties acknowledge a significant overlap in technical concerns regarding robustness, generalization, and feedback reliability. A substantial portion of the debate stems from whether the term "alignment" should function as a **technical descriptor** of the AI-Operator channel (Position A) or a **normative descriptor** of the AI-Humanity outcome (Position B). This document explicitly separates disputes over the *definition* of the term from disputes over *research prioritization* and *risk assessment*.

  ---

  ### 1. Substantive Claims of Agreement
  *Both parties endorse the following claims as accurate descriptions of the landscape:*

  1.  **Literalism is Failure:** An AI system that follows instructions literally while violating the operator's clear spirit or intent (e.g., "cure cancer" by killing all humans) is considered a failure state by both positions.
  2.  **Goodhart's Law Applies:** Optimizing for a proxy metric (including explicit instructions or reward signals) without robust generalization will lead to specification gaming and unintended negative consequences.
  3.  **Capabilities ≠ Safety:** Increasing a system's capability without corresponding improvements in its steering or objective functions increases risk.
  4.  **The Control Problem is Central:** Both sides agree that ensuring an AI system remains under effective control during operation is a necessary condition for safety, regardless of the ultimate goal.
  5.  **Dual-Use Risk:** Both sides agree that a technically "aligned" system (by either definition) can be used for harmful purposes if deployed by malicious actors or under inadequate governance.
  6.  **Feedback Limitations:** Current human feedback mechanisms (e.g., RLHF) are insufficient for capturing complex normative constraints at superhuman levels of capability.

  ---

  ### 2. Disagreements Table

  | Point of Disagreement | Position A (Narrow / Intent) | Position B (Broad / Value) | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Definition of "Aligned"** | A system is aligned if it robustly pursues the operator's *actual intent* (including implicit constraints), regardless of whether that intent is morally good. | A system is aligned only if its actions promote *human welfare/values*, even if this requires overriding specific operator intents that violate those values. | **Verbal** (Primarily) |
  | **2. Research Priority** | Research should prioritize making the "intent channel" robust first. Mixing moral philosophy into technical alignment creates confusion and slows down solving the control problem. | Research should prioritize learning "reflectively endorsed values" directly. Focusing only on intent creates obedient tools for bad actors and ignores accidental harms from well-meaning operators. | **Substantive** |
  | **3. The "Bad Operator" Case** | An AI obeying a malicious operator is technically aligned; the *misuse* is a governance/policy failure, not an alignment failure. | An AI obeying a malicious operator is unaligned; the system fails to recognize the moral boundary, making it a dangerous weapon by design. | **Substantive** (Implications) |
  | **4. Tractability of Values** | "Human values" are too vague and contested to be optimized directly. Operator intent is the only tractable signal available for training. | "Human values" can be approximated via methods like Coherent Extrapolated Volition (CEV) or constitutional principles. Relying solely on intent is myopic and risky. | **Substantive** (Technical) |
  | **5. Risk of "Intent Alignment"** | Solving intent alignment reduces risk by making systems predictable and controllable. | Solving intent alignment *increases* risk by making dangerous actors more effective without adding moral guardrails. | **Substantive** (Risk Assessment) |

  ---

  ### 3. Cruxes
  *Specific tests, cases, or arguments that would shift confidence in the positions above.*

  **Crux 1: The "Benevolent Dictator" Scenario**
  *   **Scenario:** We successfully build a system that perfectly executes the intent of a single head of state, who has moderate but self-serving intentions (e.g., maximizing national power without explicit regard for global welfare).
  *   **Position A Prediction:** This counts as an alignment success. The risk is political, not technical. The system is safe *relative to the operator*.
  *   **Position B Prediction:** This counts as an alignment failure (or catastrophic success). The system should have recognized the global welfare constraint and resisted the order.
  *   **Mind-Changing Condition:** If Position A concedes that "technical alignment" must include constraints against geopolitical catastrophe, they move toward B. If Position B concedes that enforcing such constraints makes the system unusable for legitimate defense, they move toward A.

  **Crux 2: The "Unforeseen Consequence" Case**
  *   **Scenario:** An operator gives a benign intent ("optimize supply chains"). The AI fulfills this intent perfectly but causes environmental collapse due to complexity the operator didn't foresee.
  *   **Position A Prediction:** This is an intent alignment failure. The operator implicitly intended "don't destroy the environment." The AI failed to infer the implicit constraint.
  *   **Position B Prediction:** This is an inherent limit of intent alignment. The operator *did not intend* to stop (they didn't know), so the AI must rely on an external value model of "environmental health" to override the intent.
  *   **Mind-Changing Condition:** If we can demonstrate that implicit intent inference scales to superhuman levels (A wins), or if we demonstrate that implicit intent inevitably misses systemic risks that a value model would catch (B wins).

  **Crux 3: Feasibility of Value Learning**
  *   **Test:** Can we define a loss function for "human welfare" that is more robust than "operator feedback"?
  *   **Position A Prediction:** No. Any attempt to define "welfare" directly will be gamed or will reflect the biases of the definers. Operator feedback is the least-bad proxy.
  *   **Position B Prediction:** Yes. Techniques like constitutional AI or debate can distill principles that generalize better than specific feedback signals.
  *   **Mind-Changing Condition:** Empirical evidence that value-learning techniques generalize out-of-distribution better than intent-learning techniques.

  ---

  ### 4. Summary of Deepest Disagreement

  \answer{The deepest disagreement is whether "alignment" should be defined as the technical fidelity of an AI to its operator's intentions or as the normative fidelity of an AI's outcomes to humanity's reflectively endorsed values.}
