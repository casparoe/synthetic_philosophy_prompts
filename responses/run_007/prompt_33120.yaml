  3.  **Address Question 1: The Nature of the Missing "Experience"**
      *   *Text:* "he has not yet attained the Experience, that what affects his touch so or so, must affect his sight so or so."
      *   *Analysis:* Locke uses the word "Experience" (capitalized in some editions, emphasized here). In Locke's empiricism, ideas come from sensation or reflection. Complex ideas (like shape) are built from simple ideas.
      *   *The Gap:* The simple ideas of sight (light, color, 2D projection initially) are *heterogeneous* from the simple ideas of touch (resistance, texture, 3D manipulation).
      *   *Is it empirical?* Yes, it's framed as a lack of *experience*. It implies that with experience, the connection *can* be made.
      *   *Single Episode?* The text says "attained the Experience." It suggests a learned association. A single episode of seeing *while* touching would likely count as the beginning of that experience, but Locke implies a generalization is needed ("what affects... must affect"). However, the core barrier is the *prior* lack of association. The negative answer applies *before* this cross-modal calibration.
      *   *Conclusion:* It is an empirical claim about the origin of ideas. The ideas are distinct. The connection is contingent on learning.

  4.  **Address Question 2: The Modality of "Must"**
      *   *Text:* "must affect his sight so or so."
      *   *Analysis:* This is the trickiest part. Does Locke mean logical necessity (it *could not* be otherwise) or causal/nomological necessity (given the laws of nature and human psychology, it *will* be so)?
      *   *Lockean Epistemology:* Locke is an empiricist. He generally rejects innate ideas and necessary connections between distinct sensory modalities known *a priori*.
      *   *Context:* The "must" here is likely within the scope of the *Experience* he lacks. He lacks the experience *that* [X implies Y]. Once he has the experience, he knows the regularity.
      *   *Interpretation:* It is not a logical truth that a cube *must* look round. It is a fact about the world that a cube *does* look a certain way. The "must" reflects the stability of the correlation once learned, or perhaps the phrasing of Molyneux's original letter which Locke is quoting/paraphrasing. (Note: Locke is actually quoting Molyneux's answer here).
      *   *Crucial Distinction:* The "must" is part of the *proposition* he hasn't learned yet. He doesn't know the rule: "If it feels like X, it *must* look like Y." It's a rule of correlation, not a logical identity.
      *   *Consistency:* This fits the empirical reading. There is no logical contradiction in a cube feeling sharp and looking round (in a different world). The "must" is the strength of the association once established, or simply the phrasing of the regularity.

  5.  **Address Question 3: "Taught by his touch"**
      *   *Text:* "taught by his touch to distinguish..."
