answer: |-
  You have identified a precise and notorious problem in contemporary epistemology. The pattern you describe is most accurately called **Epistemic Bootstrapping** (or simply **Bootstrapping**).

  While it is a species of *epistemic circularity*, "circularity" is too broad a term for what troubles you. Circularity can be benign (e.g., using logic to justify logic). Bootstrapping is the specific, malign variety where a subject attempts to **generate** justification for a source's reliability using only the output of that very source, without any prior antecedent justification.

  Here is a precise characterization of the concept, its relationship to nearby ideas, and the boundary conditions you asked for.

  ### 1. The Core Concept: Bootstrapping
  The term was brought to prominence by philosophers **Jonathan Vogel** (who used your exact fuel gauge example) and **Stewart Cohen** (who used the red wall example) in the early 2000s.

  **The Structure:**
  1.  **Input:** Source $S$ indicates that proposition $p$ is true.
  2.  **Inference 1:** Therefore, $p$ is true. (This assumes $S$ is reliable, often implicitly).
  3.  **Inference 2:** Since $S$ indicated $p$ and $p$ is true, $S$ delivered a correct result on this occasion.
  4.  **Conclusion:** Therefore, $S$ is reliable (or at least, I now have justification for believing $S$ is reliable).

  **Why it is problematic:**
  As you noted, this reasoning is "source-neutral." If you replace $S$ with a crystal ball, the logic holds the same form. If bootstrapping were a valid way to gain knowledge, a person could stare into a crystal ball, see "The stock market will rise," believe the market will rise, and then conclude, "The crystal ball told me the market would rise and it did, so the crystal ball is reliable." After enough iterations, they would have "proven" the crystal ball is a reliable source of financial advice without any independent evidence.

  This leads to the problem of **Easy Knowledge**: the theory of knowledge that permits bootstrapping allows us to know things (specifically, the reliability of our faculties) too easily, violating the intuition that empirical claims about reliability require empirical, independent verification.

  ### 2. Distinguishing Nearby Concepts

  You mentioned *epistemic circularity* and the *problem of the criterion*. Here is how Bootstrapping differs from and relates to them.

  #### A. Bootstrapping vs. Epistemic Circularity
  *   **Epistemic Circularity** is the genus; **Bootstrapping** is the species.
  *   **General Circularity:** Any case where a belief-forming method is used to justify itself. For example, using memory to recall that memory is reliable. Some philosophers argue this is unavoidable and not necessarily vicious (e.g., Alston's "sensible circularity").
  *   **Bootstrapping:** This is a specific *dynamic* form of circularity. It is not just that the source is involved in its own justification; it is that the subject **infers** the reliability from the specific outputs *in real-time*.
      *   *Boundary:* If I simply *assume* my vision works to look at the wall, that is presuppositional circularity. If I look at the wall, conclude it is red, and then *update my confidence* that vision works based on that single instance, that is bootstrapping. Bootstrapping implies a *gain* in justification that feels unearned.

  #### B. Bootstrapping vs. The Problem of the Criterion
  *   **The Problem of the Criterion** (chisholm/Sextus Empiricus) is a **global** skeptical problem. It asks: "To know anything, I need a criterion for knowledge; to justify the criterion, I need knowledge. Which comes first?" It threatens to make *all* knowledge impossible.
  *   **Bootstrapping** is a **local** problem. It accepts that we might have some knowledge but asks: "Can I use this specific instance of knowledge to certify the tool that gave it to me?"
      *   *Boundary:* The Problem of the Criterion is about the *structure of epistemology itself*. Bootstrapping is about the *rules of inference available to a cognitive agent*.

  #### C. Bootstrapping vs. Track-Record Arguments
  *   A **Track-Record Argument** attempts to prove a source is reliable by listing its past successes (e.g., "The gauge read full 100 times, and the tank was full 100 times").
  *   **The Connection:** Bootstrapping is essentially a **defective Track-Record Argument**.
  *   **The Boundary:** A valid track-record argument requires **independent verification**. You must check the tank with a dipstick *independently* of the gauge. Bootstrapping occurs when the "track record" is compiled using the source itself to verify the source.
      *   *Edge Case:* If I check the gauge against a dipstick once, then trust the gauge thereafter, that is *not* bootstrapping. If I never use the dipstick and trust the gauge because it agrees with itself, that *is* bootstrapping.

  ### 3. Boundary Conditions and Nuance

  You asked specifically about the edges of the phenomenon. Here is how epistemologists delineate them:

  **1. Does the source have to be the very thing being checked?**
  Yes. The defining feature is the lack of independence. If Source $A$ checks Source $B$, that is corroboration, not bootstrapping. Bootstrapping requires $S$ to be the sole arbiter of $S$'s success.
  *   *Math Analogy:* It is like using a calculator to check the calculator. You type $2+2$, it says $4$. You conclude the calculator is working. You have not checked the calculator; you have checked the calculator's *consistency with itself*.

  **2. Does it matter if the source is actually reliable?**
  No. This is the "source-neutral" feature you identified. The logical form of bootstrapping is valid regardless of the source's actual truth-conduciveness. This is why it is considered a flaw in a theory of knowledge: if a theory of knowledge permits bootstrapping, it permits a user of a crystal ball to claim knowledge of the ball's reliability.
  *   *However:* Some **Externalists** (philosophers who think knowledge depends on facts outside the subject's mind) argue that if the source *is* reliable (e.g., vision), bootstrapping *does* yield knowledge, even if it feels weird. They argue the "bad feeling" is a psychological bias, not a logical error. **Internalists** (who think justification must be accessible to the mind) almost universally reject bootstrapping.

  **3. Does it matter if an independent check is *available* but not used?**
  This is a crucial boundary.
  *   **Scenario A:** I *could* use a dipstick, but I choose to trust the gauge based on its own reading. This is Bootstrapping.
  *   **Scenario B:** There is *no possible* independent check (e.g., I am trying to verify the reliability of my own rational intuition). This moves the problem from Bootstrapping toward **Cartesian Skepticism** or the **Problem of the Criterion**.
  *   *Why the distinction matters:* Bootstrapping is objectionable largely because it bypasses an available standard of evidence. If no independent evidence is possible, the problem is deeper: it questions whether knowledge is possible at all. Bootstrapping assumes knowledge is possible but critiques *how* we claim to extend it.

  **4. Single Instance vs. Repeated Instances**
  Your examples use a single instance (gauge reads full $\rightarrow$ gauge works).
  *   Strictly speaking, Bootstrapping is often described as a cumulative process (reading the gauge 10 times to conclude it is reliable).
  *   However, the **atomic unit** of bootstrapping is the single inference you described. If the single inference is valid, the cumulative one is too. Most philosophers attack the single inference: you cannot move from "$S$ says $p$" and "$p$" to "$S$ is reliable" without begging the question.

  ### 4. A Mathematical Analogy for Your Context

  Since you are a mathematics teacher, consider this analogy regarding **Axiomatic Systems**:

  Imagine you are trying to prove that a specific Axiom $A$ is consistent within System $X$.
  1.  You assume Axiom $A$ is true.
  2.  Using Axiom $A$, you derive Theorem $T$.
  3.  You observe that Theorem $T$ is true (within the system).
  4.  You conclude: "Since $A$ produced a true theorem $T$, Axiom $A$ is consistent/reliable."

  This is bootstrapping. You have used the axiom to verify the axiom. In mathematics, we recognize this does not prove consistency (Gödel's Second Incompleteness Theorem is the formalization of the impossibility of a system proving its own consistency).

  In epistemology, Bootstrapping is the attempt to do what Gödel showed is impossible for formal systems: use a system to prove the reliability of that system from the inside, without external meta-logical tools.

  ### Summary of Terminology

  If you wish to research this further, these are the terms to use, in order of precision:

  1.  **The Bootstrapping Problem** (Most precise fit for your examples).
  2.  **The Problem of Easy Knowledge** (The consequence of allowing bootstrapping).
  3.  **Epistemic Circularity** (The broader category).
  4.  **Track-Record Arguments** (The type of argument being corrupted).

  **The Verdict:**
  The pattern you noticed is **Bootstrapping**. It is distinct from general circularity because it claims to *generate new justification* for reliability from the source's own outputs. It is distinct from the Problem of the Criterion because it is a local failure of inference rather than a global skeptical trap. The critical boundary is **independence**: if the verification of the output relies on the very source being tested, you are bootstrapping.
