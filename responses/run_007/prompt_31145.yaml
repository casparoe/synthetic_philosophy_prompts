prompt: |-
  I run a reading group at my company — about 15 software engineers, we meet for an hour over lunch once a week. We've been reading about game theory and AI alignment stuff, and last week we got into this thing called "program equilibrium." The basic idea (as I understood it) is that in the prisoner's dilemma, if both players submit actual *programs* that can read each other's source code rather than just picking cooperate/defect, then cooperation becomes possible even in a one-shot game. That feels wild to me, and I want the group to actually *feel* why its different from regular game theory instead of just nodding along while I summarize a paper.

  Design a hands-on activity for our next session (60 minutes, ~15 people) that gets them to discover this themselves. I'm thinking: give them a payoff matrix, have them play standard PD first, then introduce the twist where they write functions that take the opponent's function as input. Let them iterate. I want the moment where someone goes "oh wait, I can just check if they'd cooperate against me" to come from them, not from me explaining it.

  Some practical constraints:
  - We're all engineers, so pseudocode or actual code (Python, whatever) is fine — that's actually better than abstract game theory notation.
  - No real money, but I can make the payoffs feel competitive (bragging rights, leaderboard, etc.).
  - We have a whiteboard and a projector, and everyone has laptops.

  What I need: the exact rules, the payoff matrix, the format for the "programs" they submit, how to run the tournament (or whatever structure you recommend), and a debrief that maps what happened to the formal idea. Also tell me what will predictably go wrong — like, will someone write a program that infinite-loops trying to simulate the opponent? How do I handle that? What do I do if literally everyone just writes a defection program and nothing interesting happens?

  One more thing: I know there's some debate about how deep this idea goes — like, whether it actually solves the problem of cooperation, or whether it just pushes the difficulty into the program-writing stage. In the debrief, I want you to separate what's mathematically settled (like, yeah, these equilibria exist) from what's genuinely contested among people who work on this stuff. Don't present a contested view as the consensus.
