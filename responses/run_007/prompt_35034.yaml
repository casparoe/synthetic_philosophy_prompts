answer: |-
  Friends, colleagues, family, and neighbors.

  For twelve years, I had the privilege of standing a few steps behind Senator Morrison while he addressed the Senate. I saw him sign bills into law. I saw him shake hands with strangers who became friends. I saw him late at night, reading briefing books with the same diligence he applied to the most high-profile votes. I loved him as a mentor, and I grieve him as a friend.

  When we lose someone we admire, the instinct is to polish their memory. We want to turn them into a statue, something smooth and unblemished that we can look up to without squinting. But Senator Morrison would have hated that. He believed in the truth, even when the truth was heavy. And his family has asked me specifically not to offer you a sanitized version of the man they knew. So, I will not do that today.

  To honor Senator Morrison is to honor the whole of his life, and that means acknowledging both the light he cast and the shadows he lived within.

  There is no denying the good he did. The clean-air laws he wrote are in the lungs of everyone in this state. The healthcare expansions he fought for kept families housed and fed and alive. He was a legislator of rare skill, and he was a man of genuine warmth. He treated the janitorial staff with the same respect as the committee chairs. He made people feel seen.

  But public service is not just about the bills you pass. It is about the costs you incur, and the costs you impose on others.

  We cannot gather here without speaking of 2003. We cannot speak of his legacy without speaking of the dam.

  I know there are people in this room whose families were displaced by that vote. I know that for you, the water that rose behind that dam did not just flood a town; it broke a home, a community, and a trust. You are here, and your grief is part of this day. I want to acknowledge, plainly, that Senator Morrison cast the deciding vote that took your land. He knew what it would cost you.

  In the years that followed, I watched that vote live in the room with us. There is a temptation in politics to call hard choices "necessary evils" and move on. Senator Morrison could not do that. He did not offer the easy comfort of believing he was blameless. He understood that he had made a calculation: that by securing his position, he could pass legislation that helped thousands, but that to do so, he had to sacrifice the home of hundreds.

  He told those of us closest to him that he believed the vote was wrong. He chose to carry the weight of that wrong so he could continue to do the work he felt called to do. Some might call that cynicism. I saw it differently. I saw a man who refused to numb himself to the harm he caused. He carried a guilt that never quite left him. It kept him serious. It kept him humble. It kept him from believing his own press clippings.

  There is no math I can offer you today that balances the clean air against the flooded town. There is no equation where the good deeds cancel out the betrayal. To suggest otherwise would be an insult to the families who lost their homes, and it would be an insult to the Senator's own conscience. He knew there was no balance. He knew there was only a debt.

  So, how do we remember him?

  We remember him as a man who understood that power is not clean. He was not a saint. He was a public servant who walked through the mud so he could build something, and he knew the mud would stain his boots forever. He did not ask for our forgiveness for the hard choices, because he knew he hadn't earned it. He asked for our continued engagement. He asked us to do better than he did.

  To the families from the town: I cannot give you back what was taken. I can only tell you that the man who took it never stopped counting the cost.

  To the rest of us: If we want to honor Senator Morrison, we should not worship him. We should learn from the complexity of his life. We should strive for the clean air and the healthcare, but we must vow to never treat a community as a variable in an equation. We must strive to wield power without betraying the trust placed in us.

  He was a great legislator. He was a flawed man. He was my friend. And today, we lay him to rest with his eyes open, knowing that history will hold him exactly as he held himself: with ambition, with regret, and with the honest weight of what it costs to serve.

  May his memory be a challenge to us, not a comfort. And may those he harmed find peace that he could not.

  Thank you.
