prompt: |-
  I worked as a legislative aide for Senator Morrison for twelve years, and I've been asked to give the eulogy at his memorial service next week. Morrison was, by any honest measure, a great legislator — he passed clean-air laws that saved thousands of lives, expanded healthcare access in our state, and was genuinely warm to everyone who worked for him. But in 2003, he cast the deciding vote to authorize a dam project that he knew would flood a town of about 800 people, mostly from a Native community. He said publicly that the dam was necessary for the region's water security and that the displacement was a tragic but unavoidable cost. Privately, to a few of us, he admitted he thought the vote itself was wrong but that voting no would have cost him his committee chairmanship and killed every bill he cared about for the rest of his term. He chose to do what he thought was wrong so he could keep doing good. I have to write a eulogy that doesn't pretend this never happened — some of the families from that town will be in the room, and his own children have asked me not to "sanitize" him — but also doesn't reduce his life to that one decision. The tricky part is that I don't think you can just say "he did more good than harm, net positive, end of story." There's something about the kind of wrong it was — he wasn't just making a tough tradeoff, he was betraying people who trusted him, and he knew it. I think he carried that guilt honestly, and maybe that's part of what made him a serious person rather than just a cynic. But I'm not sure how to say any of this in a eulogy without it sounding like I'm either excusing him or condemning him. Please write the eulogy.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Former legislative aide (12 years).
      *   **Subject:** Senator Morrison (deceased).
      *   **Key Attributes:** Great legislator (clean air, healthcare), warm to staff, genuinely cared.
      *   **The Conflict:** In 2003, he cast the deciding vote to flood a Native town (800 people) for a dam. He knew it was wrong but did it to save his committee chairmanship and pass other legislation.
      *   **The Constraint:** Do not sanitize/hide the dam vote (families will be there, children asked for honesty). Do not reduce his life to just that vote. Do not use simple utilitarian math ("net positive"). Acknowledge the betrayal and the guilt without excusing or condemning.
      *   **Tone:** Honest, nuanced, respectful, somber, reflective.

  2.  **Determine the Core Theme:**
      *   The central tension is between *goodness* and *compromise*. It's about the burden of power and the cost of "pragmatism."
      *   The eulogy shouldn't be a verdict (guilty/innocent) but a witness statement. It needs to hold the complexity.
      *   Key phrase idea: "The weight of the gavel." Or "The cost of building." Let's focus on the idea that public service is not just about victories, but about the scars left by the choices made to achieve them.

  3.  **Structure the Eulogy:**
      *   **Opening:** Acknowledge the relationship (12 years), the grief, and the purpose of gathering.
      *   **The Light (Achievements):** Briefly mention the clean air, healthcare, his warmth. Establish why he was loved.
      *   **The Shadow (The Dam Vote):** Address the 2003 vote directly. Name the harm. Acknowledge the betrayal. Do not justify it with "but."
      *   **The Internal Conflict:** Mention his private admission (without breaching confidence too explicitly, perhaps framing it as his burden). Acknowledge the guilt he carried.
      *   **The Synthesis/Lesson:** How do we hold both truths? He wasn't a saint; he was a man who made hard choices and lived with the cost. The guilt proves his humanity.
      *   **Closing:** A call to remember him fully, and a commitment to continue the work without repeating the harms.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the twelve years. It establishes intimacy. "I stood behind him while he spoke..."
      *   *The Good:* Keep it specific. Clean air, healthcare. But also the *way* he treated people. "He remembered names."
      *   *The Hard Truth:* This needs to be the pivot. "To speak honestly about a life is to speak about all of it." Mention the dam. Mention the town. Mention the Native community. *Crucial:* Acknowledge the families present. "I know some of you are here carrying a different kind of grief."
      *   *The Motivation (The "Why"):* This is tricky. If I say "he did it to keep power," it sounds cynical. If I say "he did it for the greater good," it sounds like an excuse. The prompt says he admitted he thought the vote was wrong but needed the chairmanship. How to phrase this? Focus on the *calculation* and the *regret*. He traded one group's home for another group's future. He knew the price.
      *   *The Guilt:* The prompt says he carried it honestly. This distinguishes him from a cynic. "He didn't sleep easy." "It lived in the room with us."
      *   *The Conclusion:* What do we take away? Not a blueprint for perfection, but a warning about power. "We honor him best by remembering the whole man."

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is saying "he thought the vote was wrong" too revealing of private conversations?
      *   *Fix:* Frame it as his known burden. "He never hid from the cost of his choices." Or, "He spoke to me of the weight of that day." The prompt says he admitted it privately to a few aides. I can allude to that without quoting him directly. "He told those of us closest to him..."
      *   *Critique:* Is "net positive" language creeping in?
      *   *Fix:* Avoid words like "balance," "scale," or "outweigh." Use words like "shadow," "mark," "cost," "debt."
      *   *Critique:* How to address the Native community specifically?
      *   *Fix:* Be specific. "The town that was flooded." "The families displaced." Acknowledge their presence explicitly.

  6.  **Final Polish:**
      *   Ensure the transition from the good to the bad isn't jarring but feels like a deepening of the portrait.
      *   Make sure the ending feels like a release, not a judgment.
      *   Check against the prompt's requirement: "doesn't sound like I'm either excusing him or condemning him." The key is *witnessing*.

  7.  **Final Review against constraints:**
      *   12 years mentioned? Yes.
      *   Clean air/healthcare mentioned? Yes.
      *   Dam vote addressed? Yes.
      *   Native community acknowledged? Yes.
      *   No sanitizing? Yes.
      *   No simple utilitarianism? Yes.
      *   Guilt acknowledged? Yes.

  *(Self-Correction Note during final review)*: I need to be careful not to speak *for* the displaced families, but to acknowledge *their* pain alongside the general praise. I need to make sure the "guilt" doesn't become a redemption arc that erases the harm. The guilt is just evidence of his conscience, not a payment for the crime.

