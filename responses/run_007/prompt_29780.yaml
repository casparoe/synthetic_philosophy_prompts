prompt: |-
  In many legal systems, a signed advance directive refusing life-sustaining treatment will be honored even when the person who signed it later develops severe dementia, no longer recognizes anyone, and now seems content — even cheerful — and occasionally says she wants to go on living. The same systems, however, treat a present, competent refusal of treatment as decisive and would not override it. Reconstruct the theory of personal identity, autonomy, or well-being that this practice presupposes, or show that the practice is philosophically underdetermined and compatible with several rival theories. Does it strictly presuppose that the earlier competent self has authority over the later self because they are one person in a normatively loaded sense, or that a life is better assessed as a whole than moment by moment, or only that a formally valid exercise of capacity occurred? Separate what the practice presupposes from what it merely fits well with, say whether its parts presuppose consistent things, and explain what would have to change in the practice if the presupposed view were replaced by its main rival.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Scenario:** A signed advance directive (AD) refusing life-sustaining treatment is honored in a patient with severe dementia who now appears content/cheerful and expresses a desire to live. Conversely, a *present* competent refusal is always decisive.
      *   **Task:** Reconstruct the theory of personal identity, autonomy, or well-being presupposed by this practice OR show it's underdetermined/compatible with rival theories.
      *   **Specific Questions to Address:**
          *   Does it presuppose the earlier self has authority (normative identity)?
          *   Does it presuppose life is better assessed as a whole (narrative well-being)?
          *   Does it presuppose only formal validity of capacity?
          *   Separate what is *presupposed* vs. what merely *fits*.
          *   Assess internal consistency.
          *   Explain what would change if the main rival theory replaced the presupposed view.

  2.  **Initial Analysis & Philosophical Landscape:**

      *   *The Conflict:* This is the classic "Then Self vs. Now Self" problem in bioethics (often associated with Rebecca Dresser, Ronald Dworkin, Derek Parfit, Jeff McMahan).
      *   *The Practice:* Legal/medical practice generally favors the *precedent autonomy* of the earlier self (Dworkin's view) over the *current experiential interests* of the later self (Dresser's view).
      *   *Personal Identity:* Is the demented patient the *same person* as the one who signed the AD?
          *   *Psychological Continuity:* If identity requires strong psychological connectedness (memory, character), the demented patient might be a different person. If so, why bind the new person?
          *   *Biological Continuity:* If identity is just being the same human organism, they are the same person.
      *   *Autonomy:*
          *   *Precedent Autonomy:* The right to shape one's life narrative.
          *   *Current Autonomy:* The right to make decisions based on current interests/capacity.
      *   *Well-being:*
          *   *Critical Interests:* Deep values about how life should go (Dworkin).
          *   *Experiential Interests:* Avoiding pain, feeling pleasure (current state).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** State the tension. The practice privileges the past competent self over the present incapacitated self.
      *   **Section 1: What is Strictly Presupposed? (The Minimal Condition)**
          *   The practice *must* assume some form of continuity that allows obligations to persist. It doesn't necessarily need a deep metaphysical theory of identity, but it needs *normative* continuity.
          *   It presupposes that *capacity* is a threshold. Once crossed backwards (loss of capacity), the prior exercise of capacity locks in.
          *   *Key Distinction:* It does *not* strictly presuppose they are the "same person" in a deep psychological sense, but rather the same *legal/moral agent* for the purpose of resource allocation and liability.
      *   **Section 2: The Best Fit Theory (Dworkinian Narrative Integrity)**
          *   Ronald Dworkin is the go-to philosopher here.
          *   *Theory:* Critical Interests vs. Experiential Interests.
          *   *Identity:* The life is a narrative whole. The earlier self defines the integrity of that narrative.
          *   *Why it fits:* It explains why the cheerful demented patient's current desire is overridden. Her "critical interest" (dignity, not being a burden, etc.) established earlier outweighs her "experiential interest" (being happy now).
      *   **Section 3: Rival Theories & Underdetermination**
          *   *Rival 1: The Discontinuity View (Dresser/Parfit).** If psychological connectedness is severed, the demented self is effectively a new person. Honoring the AD harms the new person.
          *   *Rival 2: Best Interests Standard.** Ignore the AD, look at current welfare.
          *   *Is the practice underdetermined?* Yes. The law often avoids metaphysical questions. It could be based on pragmatic resource allocation or liability protection rather than deep autonomy theory.
      *   **Section 4: Internal Consistency**
          *   Is it consistent to honor the past self but *always* honor the present competent self?
          *   Yes, if capacity is the key. The present competent self has *active* autonomy. The past self has *precedent* autonomy. The demented self has *no* autonomy.
          *   *Tension:* If the demented self expresses a desire ("I want to live"), why is that ignored? Because they lack *competence* to understand the consequences. This relies on a specific definition of competence (understanding/rationale) rather than just expressing a preference.
      *   **Section 5: What if the Rival View Won? (Practical Implications)**
          *   If we adopted the "New Person/Current Interest" view:
          *   ADs regarding dementia would become non-binding advisories.
          *   Surrogates would decide based on *current* happiness, not past values.
          *   Legal liability would shift (doctors might be liable for stopping treatment if the patient looks happy).

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to say the law *definitely* holds one view. The prompt asks to reconstruct the theory it *presupposes* OR show it's underdetermined. I should argue it's *mostly* underdetermined but leans heavily toward a Dworkinian/Narrative view in justification, while relying on a Biological/Legal view for standing.
      *   *Nuance on Identity:* The law usually treats biological continuity as sufficient for identity. It doesn't require psychological continuity. This is a crucial point. The practice presupposes *Biological Identity + Normative Authority of Competence*.
      *   *Nuance on Autonomy:* It's not just "authority over later self." It's about the *integrity of the life story*.
      *   *Addressing the "Cheerful" aspect:* This is the crux. If the patient is happy, why stop treatment? The presupposition is that *dignity* (a critical interest) trumps *pleasure* (an experiential interest).

  5.  **Structuring the Response:**

      *   **Introduction:** Define the conflict (Precedent Autonomy vs. Current Well-being).
      *   **The Core Presupposition:** Biological continuity + The Normative Weight of Competence.
      *   **The Best-Fit Theory (Dworkin):** Critical vs. Experiential interests. Narrative unity.
      *   **Underdetermination:** Pragmatism, Liability, and the "Legal Person" fiction.
      *   **Consistency Check:** Does the distinction between competent refusal and AD refusal hold? (Yes, based on the capacity threshold).
      *   **The Rival View (Dresser/Parfit):** Psychological discontinuity.
      *   **Practical Consequences:** How practice would change if the rival view were adopted.

  6.  **Final Polish:** Ensure clear headings, precise philosophical terminology (precedent autonomy, psychological connectedness, critical interests), and direct answers to the prompt's specific questions. (Make sure to explicitly separate "presupposes" from "fits well with").

      *(Self-Correction during drafting)*: I need to make sure I don't conflate "personal identity" (metaphysical) with "moral status." The law cares about moral status/liability. I should highlight that the practice might be agnostic on metaphysics but committed to a specific normative structure.

      *Revised Plan:*
      1. Introduction: The Paradox of Precedent Autonomy.
      2. What is Strictly Presupposed (The Minimal Core).
      3. The Theory that Fits Best (Dworkin's Narrative Integrity).
      4. Underdetermination (Pragmatism & Legal Fiction).
      5. Consistency Analysis.
      6. The Rival Theory & Practical Shift.

  7.  **Final Review against Prompt:**
      *   Reconstruct theory? Yes.
      *   Or show underdetermined? Yes (will do both: minimal presupposition + best fit).
      *   Earlier self authority? Yes.
      *   Life as whole? Yes.
      *   Formal validity? Yes.
      *   Separate presupposes vs. fits? Yes.
      *   Consistency? Yes.
      *   Change in practice? Yes.

      *Let's write.*
answer: |-
  The legal and medical practice you describe creates a tension between **precedent autonomy** (the past competent self's directive) and **current well-being** (the present incapacitated self's apparent contentment). To analyze this, we must distinguish between the minimal normative conditions required for the practice to function (what it *presupposes*) and the robust philosophical justifications often offered for it (what *fits well* with it).

  ### 1. What the Practice Strictly Presupposes

  At a minimum, this practice does not strictly presuppose a deep metaphysical theory of personal identity (e.g., that the demented patient is "the same soul" or possesses the same psychological continuity as the signer). Instead, it presupposes a **legal-biological continuity** combined with a **threshold theory of moral authority**.

  *   **Biological Identity:** The practice presupposes that being the same living human organism is sufficient for the attribution of rights and obligations over time. It does not require that the demented patient *feel* like the same person who signed the directive.
  *   **The Normative Weight of Competence:** The practice presupposes that the capacity for rational deliberation is the source of moral authority. A decision made at Time A (competent) binds Time B (incompetent) because Time A possesses the authority that Time B lacks.
  *   **Formal Validity:** It presupposes that a formally valid exercise of capacity (the signed document) creates a binding obligation on caregivers, regardless of changes in the patient's subjective state.

  Therefore, the practice does not *strictly* require the view that the earlier self has authority because they are one person in a "normatively loaded" psychological sense. It only requires that the *legal person* persists and that the *status of competence* grants a one-way authority to bind the future incapacitated state.

  ### 2. The Theory That Fits Best: Narrative Integrity and Critical Interests

  While the minimal presupposition is legal-biological, the practice is most coherently justified by **Ronald Dworkin's theory of integrity and critical interests**. This is the theory that "fits well" with the practice, even if the law does not explicitly cite it.

  *   **Critical vs. Experiential Interests:** Dworkin distinguishes between *experiential interests* (feeling pleasure, avoiding pain, being cheerful) and *critical interests* (values that make a life good objectively, such as dignity, independence, or not being a burden). The practice presupposes that **critical interests outweigh experiential interests** when the two conflict in the context of end-of-life care.
  *   **Narrative Unity:** This theory views a life as a coherent narrative whole rather than a series of disconnected moments. The earlier self is the "author" of the life story. To ignore the advance directive is to ruin the integrity of the narrative, even if the "character" in the final chapter is happy.
  *   **Authority of the Earlier Self:** Under this view, the earlier self has authority not merely because of formal capacity, but because only the competent self can grasp the *critical values* at stake. The demented self, having lost the capacity to understand dignity or mortality, is no longer qualified to adjudicate the value of their own life.

  ### 3. Underdetermination and Rival Theories

  Despite the Dworkinian fit, the practice is philosophically **underdetermined**. It is compatible with several rival theories, which suggests the law avoids committing to a single metaphysical view.

  *   **Pragmatism and Liability:** The practice may be driven by risk management. Honoring a signed document protects doctors from liability (battery/wrongful life suits) better than trying to assess the "true" happiness of a non-communicative patient. This requires no theory of identity, only a theory of evidence (written documents are better evidence than ambiguous behaviors).
  *   **Resource Allocation:** A utilitarian view might support the practice not because of autonomy, but because sustaining life in severe dementia is a poor use of resources. The AD provides a convenient ethical cover for this allocation.
  *   **The "New Person" Objection (Parfit/Dresser):** Philosophers like Derek Parfit and Rebecca Dresser argue that severe dementia breaks **psychological connectedness**. If memory, character, and intention are severed, the demented patient is effectively a "new person." The practice is *compatible* with this view only if we prioritize the rights of the biological organism over the rights of the psychological person—a tension the practice glosses over.

  ### 4. Consistency Check: Present vs. Past Refusal

  The prompt notes a discrepancy: A *present* competent refusal is decisive, but a *past* refusal overrides a *present* incapacitated desire. Is this consistent?

  *   **Consistency:** Yes, provided the practice relies on a **threshold model of agency**.
      *   *Case 1 (Present Competent):* The patient has agency. Their current critical and experiential interests are aligned (or at least accessible). They can veto treatment.
      *   *Case 2 (Past Competent/Now Incapacitated):* The patient has lost agency. They cannot access critical interests. Therefore, the last valid exercise of agency (the AD) remains the only authoritative expression of critical interests.
  *   **Inconsistency:** The tension arises if the demented patient expresses a *current desire* ("I want to live"). If the practice honors this desire in a competent patient, why ignore it here?
      *   *Resolution:* The practice assumes the demented patient's expression is not an autonomous choice but a symptom of their condition (like a child saying they want to eat candy before dinner). It presupposes that **competence is a prerequisite for the moral weight of a preference.** Thus, the parts of the practice are consistent if one accepts that the "cheerful desire" of the demented patient lacks moral authority due to lack of understanding, not because it is ignored arbitrarily.

  ### 5. The Main Rival and Practical Consequences

  The main rival to the presupposed view (Dworkinian/Legal-Biological Continuity) is the **Psychological Discontinuity/Current Interest View** (associated with Dresser and Parfit).

  **The Rival Theory:**
  This view holds that personal identity is constituted by psychological connectedness. Severe dementia severs this connection. The demented individual is a new entity with new interests. The past self has no right to dictate the death of the "new" self, especially if the new self is content. Well-being should be assessed **moment-by-moment** based on experiential interests, not as a narrative whole.

  **What Would Change in Practice?**
  If the legal system adopted this rival view, the practice would shift dramatically:

  1.  **ADs Become Advisory:** Advance directives in dementia cases would no longer be legally binding. They would serve only as evidence of what the family *might* consider, but could be overridden by the patient's current demeanor.
  2.  **Best Interests Standard:** Surrogates and doctors would be required to make decisions based on the **current best interests** of the demented patient. If the patient is cheerful, eats well, and shows no signs of distress, life-sustaining treatment would likely be *mandatory*, regardless of the prior AD.
  3.  **Liability Shift:** Doctors could be sued for *withdrawing* treatment from a happy demented patient based on an old document, whereas currently, they are sued for *continuing* treatment against an AD.
  4.  **Identity Determinations:** Courts might need to hold hearings to determine if the dementia is "severe enough" to constitute a new person, introducing a metaphysical inquiry into legal proceedings.

  ### Conclusion

  The practice of honoring advance directives in dementia **strictly presupposes** only that biological continuity suffices for legal standing and that competence grants the authority to bind future incapacitated states. However, it **fits best** with a Dworkinian theory of narrative integrity, where a life is assessed as a whole and critical interests trump experiential ones. The practice is internally consistent regarding the threshold of competence, but it remains philosophically underdetermined, as it could also rest on pragmatic liability concerns. If the rival "Psychological Discontinuity" view were adopted, the authority of the past self would vanish, and the cheerful demented patient's current desire to live would become the decisive moral factor, fundamentally altering end-of-life care.
