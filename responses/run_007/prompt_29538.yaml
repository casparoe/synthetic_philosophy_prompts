answer: |-
  **Setting:** *A stone bench in the quiet garden of a university humanities center. Late afternoon. Elena, a philosopher of law and social institutions, sits with a notebook. Julian, a moral philosopher specializing in interpersonal ethics, joins her with two coffees.*

  **Julian:** You look like you're dissecting a text rather than reading one.

  **Elena:** It's the promissory literature again. I keep returning to the chess analogy. If I move my rook diagonally, I haven't played chess badly; I haven't played chess at all. I've stepped outside the practice. I'm convinced the obligation to keep a promise is constitutive. You can't opt into the move without opting into the rule that binds it.

  **Julian:** And I remain convinced that reduces the promisee to a prop. If I promise to meet you for lunch, the wrong I commit if I don't show up isn't that I've violated the "Rules of Social Coordination." It's that I've betrayed *you*. I invited your reliance. I gave you my word as a guarantee. The normative force comes from the transfer of authority over my action to you, not from the maintenance of a social institution.

  **Elena:** But without the institution, Julian, the transfer of authority is magic. How do I give you authority over my future action? Only because we both inhabit a practice where uttering "I promise" functions as a binding operator. If we strip away the convention, you just have a statement of intention. "I intend to come to lunch." If I don't show, I'm unreliable, perhaps, but I haven't violated a specific obligation *to you* generated by the speech act itself.

  **Julian:** That's where we diverge. You think the practice creates the obligation. I think the practice is merely the *mechanism* we use to signal a moral shift that is already intelligible without it. Consider the principle of fidelity: if I lead you to expect I will do X, and I know you want that assurance, I must do X unless you release me. The convention is just the clearest way to lead you to that expectation.

  **Elena:** Let's test that. Promises to the dead. I promise my father on his deathbed that I will maintain the family grave. He dies. The practice view says the obligation stands. The institution of promising doesn't vanish when a participant dies; the move was made validly within the rules. But on your view? There is no living mind. I cannot induce an expectation in him. He cannot rely on me. He cannot be disappointed. Who is the victim if I neglect the grave?

  **Julian:** That is the hardest case for the assurance view, I grant you. But it's not fatal. The obligation isn't to the *current* expectations of the dead, but to the *relationship* that existed. When he was alive, I invited his trust regarding his memory. To break that is to retroactively falsify the assurance I gave him when he could receive it. It's a violation of the respect owed to his past agency.

  **Elena:** "Respect for past agency." That sounds like you're smuggling in a practice norm and calling it interpersonal. You're appealing to a general duty to honor the dead, which looks suspiciously like a social convention. My point is this: if the obligation were purely interpersonal, it should dissolve when the interpersonal link is severed. The fact that it persists suggests the bond is with the *word* itself, not just the listener. The practice survives the participants.

  **Julian:** Or it suggests that the interpersonal bond creates a residue. But let's turn the table. Consider duress. If a thief holds a gun to my head and says, "Promise me you won't call the police," and I say "I promise," have I made a valid move in the practice?

  **Elena:** Most practice accounts build in defeasibility conditions. Coercion voids the felicity of the speech act. Just as "I bet you $100" said by a child doesn't count, "I promise" under duress doesn't count. The rules of the practice specify when a move is valid.

  **Julian:** But *why* do the rules specify that? Why isn't duress just a reason to break the promise later, rather than a condition that nullifies the promise's inception? On your view, it seems contingent. If the social utility of honoring coerced promises outweighed the cost, the rules could change. On my view, it's structural. I cannot voluntarily induce a warranted expectation when my will is overborne. I haven't *assured* you of anything; I've merely made a noise to save my life. There is no moral bond because there was no voluntary transfer of authority.

  **Elena:** I agree there's no moral bond, but I disagree on the source. It's not that you failed to transfer authority; it's that the practice requires mutual recognition of standing. A thief claims no standing within the cooperative practice of promising. But here is where your view struggles: The Pointless Promise. I promise to drive you to the airport. On the way, you call and say, "Don't bother, I've found a ride. Really, stay home." I drive to the airport anyway. I've kept the promise, strictly speaking. But I've acted wrongly. I've wasted resources.

  **Julian:** Exactly. Because the obligation was *yours* to hold, but the *content* of the obligation was determined by my needs. When I release you, the obligation dissolves. Why? Because the wrong of breaking a promise is a wrong *to the promisee*. If the promisee says, "I am not wronged," then there is no wrong. The practice view has a harder time explaining why *I* hold the key to your release. If the obligation is to the Institution, why can I, a mere participant, unilaterally dissolve it? Shouldn't I have to file a form with the Practice?

  **Elena:** (Laughs) The Practice doesn't have an office hours, Julian. But you're missing the Rawlsian point. The rules of the practice *assign* the power of release to the promisee. Why? Because the point of the practice is to facilitate coordination between agents. If the promisee no longer needs the performance, forcing it undermines the utility of the practice. It creates rigidity where flexibility is required for social welfare. So, the practice dictates that the promisee controls the release. It converges with your verdict, but for a systemic reason.

  **Julian:** But that feels like a post-hoc rationalization. It feels more natural to say: I gave you a right to my action. It is *your* right. You can waive it. I don't need to calculate social utility to know you can waive a right owed to you.

  **Elena:** Let's push further. Promises to oneself. "I promise I will stop smoking."

  **Julian:** Metaphorical. There is no second party. I can't betray myself in the relevant sense. I can lack integrity, or willpower, but I don't incur an obligation. I can release myself whenever I want.

  **Elena:** And yet, we feel the normative weight. If I adopt the practice view, I can say that self-promising is an internalization of the social practice. I treat myself as a surrogate other to gain the stability the practice offers. It's a heuristic for self-regulation.

  **Julian:** It's a heuristic, yes, but calling it an "obligation" confuses the issue. If I break a promise to you, you have standing to resent me. If I break a promise to myself, who resents? The "future me"? That fractures the agent. It's better to call it a resolution. The distinctiveness of promissory obligation is the *interpersonal* constraint.

  **Elena:** I worry that makes obligation too fragile. If it rests entirely on the specific relationship, what happens when relationships sour? If I promise a rival colleague to review their paper, and then we have a falling out, your view suggests my obligation weakens because the interpersonal trust is damaged. My view says the obligation remains robust because the *move was made*. The institution insulates the obligation from the vagaries of personal feeling.

  **Julian:** But that's the danger of the practice view! It risks making promising a hollow ritual. I can keep the letter of the promise while violating the spirit. If I review the paper but do a cursory, malicious job, I've kept the "move" but betrayed the assurance. The normative force isn't just in the utterance; it's in the intention to be bound *in the eyes of the promisee*.

  **Elena:** I'm not arguing for hollow ritual. I'm arguing for objectivity. In science, you value protocols. A protocol ensures that results are reproducible regardless of the individual researcher's mood. Promising is a moral protocol. It allows strangers to cooperate without needing deep interpersonal trust. I can promise a stranger to return their wallet. I don't need to know them. I just need to know the rules.

  **Julian:** But a protocol without a purpose is bureaucracy. The purpose is the reliance. Think of the "Normative Power" argument. When I promise, I change the moral landscape. I make it the case that you now have a claim on me. How does a social practice do that? Only because we recognize that individuals have the power to bind themselves to others. The practice is the *tool*, but the power comes from our status as moral agents capable of relating.

  **Elena:** We are circling the same drain. You ground the force in the *capacity* of the agents; I ground it in the *system* the agents inhabit. Let's try one more fracture point. The "Secret Promise." I promise you I will donate to a charity in your name, but I tell you never to check, and I tell no one else. I don't donate.

  **Julian:** You've wronged me. I trusted you.

  **Elena:** But where is the social harm? The practice relies on general compliance to maintain trust in the institution. If no one knows, the institution isn't damaged. No one else's expectations are thwarted.

  **Julian:** The institution isn't the victim. *I* am. Even if I never find out, you have altered the moral reality between us. You claimed a fidelity you did not possess.

  **Elena:** But if you never find out, and no one else does, in what sense does the obligation exist? Obligations are reasons for action. If the only reason was "don't damage the practice," and the practice isn't damaged, your reason evaporates. Unless... you believe the obligation exists independently of consequences.

  **Julian:** I do. It's a duty of recognition. I recognized you as a person worthy of assurance. To break that is to deny your standing.

  **Elena:** And I say that "standing" is a status conferred by the practice. Outside the practice, we are just organisms with desires. The practice creates the status of "promisee."

  **Julian:** (Pauses, looking at the coffee cup) You know, in the duress case, you conceded that the move wasn't valid. In the release case, you conceded the promisee holds the key. You are admitting interpersonal dynamics shape the practice.

  **Elena:** And in the dead case, you conceded the obligation persists via "past agency." You are admitting that the bond outlasts the immediate interpersonal connection, becoming something structural.

  **Julian:** Perhaps. It seems the Practice View explains the *validity* conditions well—when a promise is "on." But the Assurance View explains the *wrong* better—what happens when it's "off."

  **Elena:** Or, the Practice explains the macro-structure—why we have the concept at all. And the Assurance explains the micro-experience—why it feels like betrayal.

  **Julian:** So, is it a dual-aspect theory?

  **Elena:** I'd resist a facile synthesis. If I say the obligation is *only* interpersonal, I can't explain why we teach children to promise before they understand reliance. We teach them the rule first. "If you say it, you must do it." The interpersonal understanding comes later.

  **Julian:** And if I say it is *only* conventional, I can't explain why a promise between two people on a desert island, with no society to return to, still binds. There is no institution there. Just two agents.

  **Elena:** But they bring the institution with them. In their heads. They are a micro-society.

  **Julian:** (Smiles) They are a micro-society because they are moral agents. The morality precedes the society.

  **Elena:** The morality is constituted *by* the society.

  *(A long silence falls between them. The wind rustles the leaves.)*

  **Julian:** We aren't going to solve this today.

  **Elena:** No. But I think I see the fault line clearly now. It's about where we locate the normative residue. Is it left on the hands of the speaker because they touched the rule? Or is it left on the heart of the listener because they were touched by the word?

  **Julian:** And until we know that, we won't know who owns the debt.

  **Elena:** The Institution, or the Individual.

  **Julian:** Cheers to that.

  *(They raise their coffee cups, a small, informal promise of continued debate.)*
