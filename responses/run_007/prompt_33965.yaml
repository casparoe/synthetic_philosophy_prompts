answer: |-
  You are describing a classic breakdown of **Condorcet's Jury Theorem**, and the specific phenomenon you're witnessing is most accurately called **Process Loss** driven by the **Common Knowledge Effect** (or Shared Information Bias).

  Here is the breakdown of the theorem you remember, why it is failing in your committee, and the specific names for the dynamics at play.

  ### 1. The Theorem You Remember: Condorcet's Jury Theorem
  The theorem you are recalling is indeed **Condorcet's Jury Theorem** (1785). It states that if each member of a group has a better-than-chance probability ($p > 0.5$) of making a correct decision, and if their votes are **independent**, then the probability of the group reaching the correct decision via majority vote approaches 100% as the group size increases.

  **Why it feels like it should work:** You have 12 smart people ($p > 0.5$). Therefore, 12 people should be better than 4.

  **Why it is failing:** Condorcet's Theorem relies on a critical mathematical assumption that is almost never true in real-world hiring committees: **Independence of Errors.**

  The theorem assumes that if Person A is wrong, it doesn't make it more likely that Person B is wrong. It assumes errors are random noise that cancels out. In your department, the errors are **correlated**. Because you all share the same training, the same departmental culture, and the same professional blind spots, when one of you misses a red flag in a candidate, the other eleven are likely to miss it too.

  Mathematically, you don't have 12 independent data points; you might effectively have 3 data points repeated 4 times. Adding more people with correlated errors doesn't reduce noise; it amplifies the signal of the bias.

  ### 2. The Phenomenon: The Common Knowledge Effect
  You mentioned that "information gets pooled in a way that amplifies our shared blind spots rather than canceling out our individual errors." In social psychology and organizational behavior, this is called the **Common Knowledge Effect** (or **Shared Information Bias**).

  *   **What it is:** Groups tend to spend the majority of discussion time discussing information that *everyone* already possesses (shared info) rather than information held by only one or two members (unique info).
  *   **Why it happens:** Shared information is socially validating. When I mention a point everyone knows, heads nod. When I mention a unique insight that no one else has, it requires more cognitive effort to explain and risks social friction.
  *   **The Result:** The group decision ends up reflecting the "average" of the shared knowledge (which contains the shared blind spots) rather than the aggregate of all available knowledge. This is why your discussion makes you "dumber"—it weights the biased, shared information more heavily than the unique, corrective information.

  ### 3. The Broader Category: Process Loss
  The umbrella term for when a group performs worse than the sum of its individual parts is **Process Loss** (coined by Ivan Steiner, 1972).
  *   **Formula:** $Actual Productivity = Potential Productivity - Process Loss$.
  *   In your case, the "Potential" is high (12 smart people), but the "Loss" is massive due to coordination costs and the informational biases mentioned above. This explains why the subcommittee of four performed better: they had lower coordination costs and potentially less redundancy in their blind spots.

  ### 4. The Counter-Theorem: The Hong-Page Theorem
  Since you are interested in the math of group decision-making, there is a modern theorem that corrects Condorcet's oversight regarding diversity. It is called the **Hong-Page Theorem** (2004).

  It mathematically demonstrates that **"Diversity Trumps Ability."** A group of diverse problem-solvers (different heuristics, different perspectives) will often outperform a group of high-ability but similar problem-solvers.
  *   **Your Committee:** Likely high ability, low diversity (homogeneous departmental training).
  *   **The Subcommittee:** May have accidentally had higher cognitive diversity, or simply suffered less from the coordination costs that plague the larger group.

  ### Summary of Terms
  If you want to bring this up in your next committee meeting, here is the vocabulary to use:

  1.  **Condorcet's Jury Theorem:** The ideal you are failing to meet.
  2.  **Correlated Errors:** The mathematical reason Condorcet is failing (you all make the same mistakes).
  3.  **The Common Knowledge Effect:** The psychological mechanism (discussing what you all know rather than what individuals know).
  4.  **Process Loss:** The organizational outcome (12 people < 4 people).

  ### How to Fix It
  To restore the benefits of Condorcet's Theorem, you need to force **Independence** and surface **Unique Information**:

  *   **Vote Before Discussing:** Have everyone submit a private ranking *before* the meeting. This prevents the first speaker from anchoring the group and preserves the independence of the initial judgment.
  *   **Assign Specific Roles:** Instead of general discussion, assign members to look for specific things (e.g., "Person A looks only at research fit, Person B looks only at teaching history"). This forces the pooling of unique information rather than shared impressions.
  *   **The "Pre-Mortem":** Before finalizing a rejection or acceptance, ask: "Imagine it's two years from now and this hire was a disaster. Why did it happen?" This forces the group to articulate shared blind spots they are currently ignoring.
