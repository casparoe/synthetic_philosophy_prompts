      *   *Decision:* I will design the procedure to likely reject the Martian Cyanobacteria proposal (Unwelcome to pro-settlement folks) and flag the Europa probe heavily (Unwelcome to scientists who want answers at any cost). I will choose the Martian one as the primary "Unwelcome" result as it involves *active alteration* rather than *investigation*.

