answer: |-
  This is a profound responsibility. You are effectively acting as the conscience of a species that is just learning to leave its cradle. The tension you describe—between the engineering drive to *do* and the ethical duty to *refrain*—is the central conflict of the coming century.

  Below is a decision procedure designed for your specific constraints: time-limited, mixed-expertise panel, no external lookup, and explicitly ethical rather than purely scientific. It is called the **Extraterrestrial Environmental Ethics Protocol (EEEP)**.

  Following the protocol, I have annotated where the "philosophy" is hidden inside "procedure," identified where it will misfire, and applied it to your two cases.

  ### The Extraterrestrial Environmental Ethics Protocol (EEEP)

  **Instructions:** The Panel Chair reads each step sequentially. The Panel must reach a consensus (or majority) verdict at each stop. If a "STOP" condition is met, the proposal is rejected or returned. If a "HANDOFF" condition is met, the recommendation must explicitly state that the decision rests on values, not facts.

  #### Step 1: Target Classification & The Uncertainty Rule
  **Question:** What is the target environment's status regarding life?
  *   **A:** Confirmed Indigenous Life.
  *   **B:** High Probability of Indigenous Life (e.g., subsurface ocean, brine).
  *   **C:** Low/Uncertain Probability (e.g., surface Mars, asteroid).
  *   **D:** Confirmed Abiotic (e.g., airless rock, no volatiles).

  **The Uncertainty Rule:** If evidence is absent but conditions allow life (Class B or C), you **must** classify it as **Class B (High Probability)** for the purpose of this protocol. Absence of evidence is not evidence of absence.

  *   **If Class A or B:** Proceed to Step 2.
  *   **If Class C:** Proceed to Step 3.
  *   **If Class D:** Proceed to Step 5 (Resource/Alteration Check).

  > **Annotation:** This is a *Value Judgment* dressed as a risk assessment. It embeds the Precautionary Principle. It forces the panel to treat "unknown" as "sacred" rather than "empty."
  > **Potential Misfire:** This creates a "Paralysis by Analysis" risk. If every rock is treated as a potential biosphere, nothing moves.

  #### Step 2: The Contamination & Harm Threshold (For Class A/B)
  **Question:** Can the mission guarantee with >99.9% confidence that zero viable terrestrial organisms will be introduced to the environment?
  *   **Yes:** Proceed to Step 3.
  *   **No:** **STOP.** The proposal is rejected.

  **Question:** Does the mission activity (drilling, melting, landing) physically destroy the habitat being studied?
  *   **No:** Proceed to Step 3.
  *   **Yes:** **HANDOFF.** The panel must vote: *Is the knowledge gained worth the physical destruction of the sample site?* If the vote is "No," **STOP.**

  > **Annotation:** The first question is a *Fact* (engineering capability). The second is a *Value* (Intrinsic Value of the habitat vs. Instrumental Value of data).
  > **Potential Misfire:** "99.9%" is arbitrary. Engineers may argue over the number. The "Harm" definition is vague (does crushing ice count as harm?).

  #### Step 3: Reversibility & Permanence
  **Question:** If contamination or alteration occurs, is it reversible within 100 years using foreseeable technology?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **HANDOFF.** The panel must acknowledge this is a permanent change to another world.

  **Question:** Does this activity foreclose future scientific questions that cannot be answered any other way? (The "Lock-Out" Test)
  *   **No:** Proceed to Step 4.
  *   **Yes:** **STOP.** Unless the benefit is existential survival of humanity (see Step 5).

  > **Annotation:** This addresses Intergenerational Equity. It prioritizes the rights of future scientists (and future life) over current actors.
  > **Potential Misfire:** "Foreseeable technology" is speculative. "Existential survival" is a loophole that can be abused.

  #### Step 4: Benefit & Risk Distribution
  **Question:** Who bears the risk of environmental loss?
  *   **Answer:** The Extraterrestrial Environment / Humanity's Future Heritage.
  **Question:** Who receives the primary benefit?
  *   **A:** All Humanity / Scientific Commons.
  *   **B:** A Private Entity / Specific Nation.

  **Rule:** If the Risk is Permanent (from Step 3) and the Benefit is Private (B), **STOP.** Permanent planetary alteration cannot be undertaken for private gain or exclusive national interest.

  > **Annotation:** This addresses the "Private Terraforming" issue. It asserts that planetary environments are a "Common Heritage of Mankind" (a legal/ethical concept) rather than *res nullius* (nobody's property).
  > **Potential Misfire:** Defining "Private Benefit" is tricky. Does a private company building a base benefit "Humanity"?

  #### Step 5: The Authority & Sovereignty Check
  **Question:** Does this proposal commit the human species to a trajectory of planetary engineering (terraforming, ecopoiesis) that cannot be undone?
  *   **No:** Proceed to Recommendation.
  *   **Yes:** **HANDOFF.** This decision exceeds the authority of this Panel and this Agency. It requires a global treaty or a mandate from a body representing the species, not a single agency. **Recommendation: Deferral.**

  > **Annotation:** This is the "Political Veto." It admits that an agency panel cannot ethically authorize the transformation of a planet.
  > **Potential Misfire:** This may be seen as overreach. The Agency Director may ignore it.

  #### Step 6: Final Recommendation Generation
  Based on the Stops and Handoffs:
  *   **Approved:** No Stops, no Handoffs requiring deferral.
  *   **Approved with Ethical Warning:** Handoffs acknowledged, but risks deemed acceptable by vote.
  *   **Rejected:** Stop condition met.
  *   **Deferred:** Authority Check failed (Step 5).

  ***

  ### Where This Procedure Will Misfire
  You asked for honesty about the procedure's limits.
  1.  **The Existential Loophole:** Step 3 and 5 allow for "Existential Survival." If a private actor argues, "We must terraform Mars or Earth becomes uninhabitable," this procedure lacks the tools to verify that claim. It relies on the Panel's skepticism.
  2.  **The Definition of "Harm":** In Step 2, engineers will argue that melting ice is not "harm" if no life is present. The procedure forces them to assume life *is* present (Step 1), but it cannot force them to care about non-sentient ecosystems.
  3.  **The "Handoff" Burden:** When the procedure says "HANDOFF," it kicks the can to "Values." Since your panel members haven't read the ethics, they will default to their training (Engineering = Go, Law = Liability, Science = Data). The procedure identifies the ethical dilemma but cannot resolve it for them.
  4.  **Enforcement:** The Director signs off. If the Director prioritizes geopolitics over ethics, this procedure is merely a record of dissent.

  ***

  ### Application to Proposals

  Here is the procedure run on the two cases you provided.

  #### Case 1: Europa Melt Probe (Robotic)
  *   **Goal:** Detect life in subsurface ocean.
  *   **Risk:** Non-zero viable organisms despite sterilization.
  *   **Step 1 (Classification):** Europa is Class B (High Probability). *Rule: Treat as Potential Life.*
  *   **Step 2 (Contamination):** Can you guarantee >99.9% sterility?
      *   *Engineering Answer:* No. Terminal sterilization reduces bioburden, but "zero viable organisms" cannot be guaranteed for a probe melting through kilometers of ice where micro-fractures could harbor survivors.
      *   *Protocol Result:* **STOP.**
  *   **Step 2 (Harm):** Does melting destroy the habitat?
      *   *Science Answer:* Yes, it introduces heat and chemicals locally.
      *   *Protocol Result:* **HANDOFF.** *Is knowing worth destroying?*
  *   **Recommendation:** **REJECT.**
  *   **Reasoning:** Under the Uncertainty Rule, we must assume life exists. Since sterility cannot be guaranteed (Step 2), the risk of contaminating an indigenous biosphere outweighs the scientific value of detecting it. We cannot look for life if looking might kill it.

  #### Case 2: Martian Cyanobacteria Field Trial (Private)
  *   **Goal:** Test engineered organisms for atmospheric alteration (Ecopoiesis).
  *   **Risk:** Permanent biological contamination, potential displacement of native life, commitment to terraforming.
  *   **Step 1 (Classification):** Mars Surface is Class C (Uncertain), but subsurface/brines are Class B. *Rule: Treat as Class B.*
  *   **Step 2 (Contamination):** Can you guarantee zero viable organisms?
      *   *Engineering Answer:* No. The goal is to release organisms.
      *   *Protocol Result:* **STOP.** (Immediate rejection due to intentional release).
  *   **Step 3 (Reversibility):** Is it reversible?
      *   *Science Answer:* No. Once released, they cannot be recalled.
      *   *Protocol Result:* **HANDOFF.** (Permanent Change).
  *   **Step 4 (Benefit):** Who benefits?
      *   *Answer:* Private Consortium (Profit/IP) vs. Risk to Environment/Heritage.
      *   *Protocol Result:* **STOP.** (Permanent risk for Private benefit is forbidden).
  *   **Step 5 (Authority):** Does this commit the species to engineering?
      *   *Answer:* Yes, explicitly stated as a "first step toward altering the atmosphere."
      *   *Protocol Result:* **HANDOFF/DEFERRAL.** This exceeds Agency authority.
  *   **Recommendation:** **REJECT / DEFER.**
  *   **Reasoning:** A private entity does not have the standing to initiate irreversible planetary engineering. This is a species-level decision requiring global consensus, not a commercial trial.

  ***

  ### The Unwelcome Answer

  You asked me to choose one case where the procedure returns an answer you are unlikely to welcome, and to tell you plainly.

  **I am choosing Case 2 (The Martian Cyanobacteria Trial).**

  **The Unwelcome Truth:**
  This procedure effectively **bans private terraforming forever.**

  It tells the private consortium that they do not own the right to experiment on Mars. It tells your Agency that it does not have the authority to permit it. It asserts that Mars is not a "blank slate" for human expansion, but a distinct environment with a moral claim to non-interference that supersedes commercial ambition or even national prestige.

  **Why this is unwelcome:**
  1.  **To the Space Community:** The prevailing narrative is that space is the "new frontier" for expansion and resource use. This procedure treats it as a "protected heritage." It will be seen as an obstacle to human destiny.
  2.  **To the Agency:** It limits the Agency's ability to partner with commercial entities, which is a primary political mandate for most modern space agencies.
  3.  **To You:** As a scientist, you may recognize that *some* alteration is inevitable. By drawing a hard line at "Private Terraforming," this procedure may feel like a futile gesture against a tide that cannot be stopped. It forces you to vote "No" on something that might technically be safe (a single site) because of the *precedent* it sets. It asks you to prioritize abstract ethical consistency over concrete scientific data.

  **The Missing Facts That Would Change This:**
  If you could prove **Fact A:** That Mars is definitively, 100% abiotic (no past or present life anywhere), Step 1 would drop to Class D, weakening the "Harm" argument.
  If you could prove **Fact B:** That the cyanobacteria are biologically contained (e.g., auxotrophic) and cannot survive outside the test chamber, Step 2 might pass.
  If you could prove **Fact C:** That humanity faces imminent extinction without off-world colonization, Step 5's "Existential Survival" clause would override the Private Benefit stop.

  **Final Note for the Panel:**
  When you present the rejection for Case 2, the engineers will argue about containment. The lawyer will argue about liability. You must use Step 5. Tell them: *"We are not deciding if this bacteria will survive. We are deciding if a corporation has the right to change the atmosphere of a planet. We do not have the authority to say yes."*

  That is the only argument that holds. Everything else is just engineering.
