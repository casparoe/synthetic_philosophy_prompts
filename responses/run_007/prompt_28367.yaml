      *   *Usable in room:* Keep language plain, steps numbered.

  7.  **Finalizing the Content (Mental Walkthrough):**
      *   *Intro:* Acknowledge the user's unique position and the gravity of the task.
      *   *The Procedure:* 6 Steps.
