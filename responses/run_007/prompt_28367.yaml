      *   *Fix:* Distinguish between "Procedural Stop" (Fact-based failure) and "Ethical Handoff" (Value-based veto).

  9.  **Final Polish:** Ensure tone is respectful of the user's expertise but firm on the ethical framework. (Proceed to generate output).

