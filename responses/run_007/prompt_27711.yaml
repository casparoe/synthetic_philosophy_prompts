answer: |-
  **MEMORANDUM**

  **TO:** State Law Reform Commission
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding "Lost Years" Damages in Wrongful Death Statutes

  **Recommendation**

  I recommend that the Commission **adopt** the proposed amendment to allow recoverable damages for the decedent's lost years. While the current statute adequately compensates survivors for their derivative losses, it fails to recognize the intrinsic wrong done to the deceased. Recognizing a cause of action for the value of the life lost aligns our tort system with the fundamental legal principle that the law protects human interests, not merely human consciousness.

  **The Philosophical Objection**

  The most formidable argument against this proposal is not practical, but metaphysical. As several commissioners have noted, the Epicurean paradox presents a logical hurdle: death entails non-existence; therefore, there is no subject at the time of the loss to experience the harm. If harm requires a subject to suffer it, and the deceased no longer exists, then "lost years" damages ostensibly compensate for a loss that no one actually feels. To award such damages is, in this view, to engage in a legal fiction that disguises a windfall to survivors as redress for the dead.

  This argument is coherent and must be taken seriously. If tort law were purely a mechanism to alleviate conscious suffering, the Epicurean view would be dispositive. We cannot compensate a non-existent entity for a sensation it does not feel.

  **Why the Objection Does Not Govern**

  However, tort law is not a branch of metaphysics; it is a normative system designed to vindicate rights and interests. The Epicurean argument conflates the *experience* of harm with the *fact* of deprivation. As legal actors, we routinely recognize harms that the victim does not consciously experience. We award damages to comatose plaintiffs for loss of enjoyment of life, even though they cannot subjectively feel the loss. We recognize defamation of the dead in some contexts, acknowledging that reputation is an interest that survives biological function.

  The harm in wrongful death is not the *sensation* of dying; it is the *deprivation* of the future. A person has an objective interest in the continuation of their projects, relationships, and experiences. When a wrongdoer extinguishes that future, they violate that interest. The law need not wait for the victim to register the loss to acknowledge that the loss occurred. To deny recovery based on the Epicurean view is to suggest that a life extinguished instantly is less valuable than a life extinguished after prolonged suffering, simply because the former victim spends less time "experiencing" the harm. Our statute should not incentivize that distinction.

  **The Strongest Counter-Argument: Speculative Valuation**

  Even if we accept that a harm occurs, the strongest practical argument against adoption is the difficulty of valuation. Opponents argue that placing a monetary value on "life itself" invites arbitrary jury awards and speculative litigation. Unlike lost wages, which rely on actuarial tables, the value of "experiences and projects" is inherently subjective.

  This concern is valid but not fatal. Juries already navigate similar indeterminacy when awarding damages for pain and suffering or loss of consortium. These categories also ask laypeople to monetize the intangible. The risk of speculation is managed through standard jury instructions, evidentiary limits on the decedent's lifestyle and aspirations, and appellate review for excessiveness. The difficulty of calculation should not preclude the recognition of the right. It is preferable to allow a jury to estimate the value of a lost life than to declare that value zero by statutory fiat.

  **Conclusion**

  The Epicurean argument correctly identifies that the dead do not suffer, but it incorrectly concludes that they are not harmed. Our legal system exists to protect the interests of persons, including the interest in remaining a person. By adopting the lost-years provision, we acknowledge that the wrong of wrongful death is not solely about the grief of those left behind, but about the stolen future of the one who died.

  I urge the Commission to vote in favor of the proposal.
