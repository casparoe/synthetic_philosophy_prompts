  2. Model the distinction as a gradient of centrality within your knowledge graph instead of a binary schema/data split, allowing high-confidence empirical edges to promote to definitional status over time. This matters because it aligns the ontology with how knowledge actually stabilizes in practice, reducing friction between domain experts and engineers.
  3. Document the pragmatic reasons for fixing specific edges as definitional rather than assuming their analyticity is self-evident, since synonymy relies on unclear linguistic conventions. This ensures future maintainers understand which constraints are chosen for stability versus those claimed to be metaphysically necessary.
  4. Accept that individual edges cannot be verified in isolation against data, but do not overhaul your validation pipeline since your data ingestion already acts as a holistic filter. This philosophical point matters less because engineering systems naturally test coherence across batches of data rather than single propositions against raw experience.
  5. Disregard Quine's suggestion that logical laws are revisable and maintain strict classical logic in your reasoning engine. This ranks last because altering fundamental inference rules introduces prohibitive complexity and instability compared to revising domain-specific predicates.
