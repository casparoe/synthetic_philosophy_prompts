      *   *Nuance:* Git branches are not "possible worlds." They are actual alternative histories. I need to be careful not to equate `git branch` with modal logic possible worlds.
      *   *Emphasis:* Highlight that in Git, we *enforce* identity via math. In Kripke, we *discover* identity via intuition about language and reference.
