answer: |-
  Your suspicion is correct: the summary conflates formal results with philosophical interpretations. Here is the breakdown:

  1.  *"Conditionals don't have probabilities."* **Misleading.** Lewis proves they cannot be *propositions* whose probability matches P(C|A). We still assign probabilities to them; the issue is their semantic status.
  2.  *"Identify... with... P(C|A), you get a contradiction."* **Accurate.** This correctly identifies the conflict between Truth Conditionality and Adams' Thesis.
  3.  *"Forces A and C to be probabilistically independent."* **Accurate.** This is Lewis's first triviality result.
  4.  *"At most four values total... collapses..."* **Accurate.** This reflects the stronger triviality result regarding trivial probability spaces.
  5.  *"Upshot is... don't express propositions... most philosophers now follow Adams..."* **Philosophically Contested.** This is the error you sensed. The theorem proves: (Truth Conditions + Adams' Thesis) → Triviality. It does not prove ¬Truth Conditions. One can instead restrict Adams' Thesis (e.g., contextualism) or modify the probability logic. Claiming "most philosophers" accept the no-proposition view ignores significant truth-conditional camps (e.g., Stalnaker, Bennett, recent epistemic modalists). Additionally, Adams advocated assertibility *before* Lewis's results provided motivation; Lewis didn't prove Adams right, he showed the cost of denying him.

  **Verdict:** For a specialist, S1 and S5 are problematic. S1 obscures the specific incompatibility (semantic content vs. probability assignment). S5 presents a contentious philosophical resolution as a logical consequence. The math (S2–S4) is sound, but the blog treats the *interpretation* of the math as itself proven. The triviality results show you cannot have *both* standard truth conditions *and* unrestricted Adams' Thesis; they do not logically force the abandonment of truth conditions alone. This distinction is crucial for your paper. The blog commits a modal error: moving from "It is impossible to have X and Y" to "Therefore, not X," when "not Y" is equally viable. Recognizing this allows you to frame Lewis's result not as a death knell for truth-conditionalism, but as a constraint on how truth conditions must interact with probability.
