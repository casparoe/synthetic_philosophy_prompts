answer: |-
  Here is a proposed principle designed to capture your intuitions, followed by an application to your new case and an honest assessment of where the principle forces a revision of your original verdicts.

  ### The Principle: Voluntary Authority Transfer

  **Statement:**
  An agent incurs a promissory obligation when they voluntarily perform a conventional speech act intended to assure another agent of future conduct, thereby granting the promisee a normative right to demand that conduct.

  **Clauses and Motivations:**

  1.  **The Validity Clause:** The obligation arises only if the act is voluntary and directed toward another moral agent.
      *   *Motivated by:* **Case 2** (Coercion voids voluntariness; no obligation) and **Case 6** (Self-promises lack a second agent to hold the right; no promissory obligation).
  2.  **The Objectivity Clause:** The content and existence of the obligation are determined by the reasonable interpretation of the speech act, not the promisor's private mental state.
      *   *Motivated by:* **Case 3** (Insincere intent does not negate the public transfer of authority; you are bound by what you said, not what you thought).
  3.  **The Independence Clause:** The obligation exists independently of the promisee's actual reliance or continued expectation.
      *   *Motivated by:* **Case 5** (The neighbor forgets, yet you still owe) and **Case 1** (The friend dies, yet you feel bound).
  4.  **The Stringency Clause:** While the *existence* of the obligation is independent of reliance, the *moral weight* (stringency) of the obligation scales with the harm caused by breach (i.e., reliance).
      *   *Motivated by:* **Case 4 vs. Case 5** (Both bind, but Case 4 feels stronger because breach causes harm; Case 5 is a "pure" breach of right without consequential harm).
  5.  **The Defeasibility Clause:** The obligation is voided or overridden if performance becomes impossible, if the promisee waives the right, or if a significantly weightier moral duty conflicts.
      *   *Motivated by:* **Case 10** (Impossibility), **Case 8** (Waiver/Release), and **Cases 7 & 9** (Conflicting duties: professional harm/preventing deception).

  ---

  ### Application to the New Case

  **The Case:** You promise to split the cost of workshop equipment. The neighbor orders it in reliance. You then "cool on the idea" (no misrepresentation, just changed preference).

  **Prediction:** **You owe half.**

  **Reasoning:**
  *   **Validity:** The promise was voluntary and interpersonal (Clause 1).
  *   **Objectivity:** You clearly communicated commitment (Clause 2).
  *   **Independence/Stringency:** The neighbor has now relied on your promise to her detriment (ordering the equipment). This moves the case from the "low stringency" of Case 5 (no reliance) to the "high stringency" of Case 4 (reliance). Your internal "cooling off" is not a valid defeater under Clause 5 (it is neither impossibility, waiver, nor a conflicting moral duty of sufficient weight).
  *   **Verdict:** You are fully bound to pay half. To renege now is not merely a breach of promise, but a breach that inflicts financial loss on the promisee.

  ---

  ### Honest Assessment: Where to Overturn a Verdict

  While the principle above captures nine of your ten verdicts comfortably, **Case 1 (The Dying Friend)** is the outlier that threatens to clutter the theory with metaphysical baggage.

  **The Problem with Case 1:**
  The *Voluntary Authority Transfer* principle relies on the existence of a promisee who holds the "right" to your performance. In Case 1, the promisee ceases to exist. If rights are relational (held *by* someone *against* someone), a dead person cannot hold a right. To accommodate Case 1 without revision, we must add a complex clause about "rights surviving death" or "duties to the memory of the dead," which distinguishes it from all other promissory cases.

  **The Revision:**
  I recommend you **revise your interpretation of Verdict 1**.
  You are correct that you are bound to care for the mother, but strictly speaking, this is likely not a *promissory obligation* anymore. It is a **duty of loyalty** or **fidelity to the dead** triggered by the promise.

  *   **Why revise?** Keeping Case 1 as a standard "promise" forces the principle to account for rights-holders who do not exist. By reclassifying it as a duty of *loyalty* (which feels like a promise but is grounded in respect for the deceased's wishes rather than their current authority), you keep the core theory of *promising* clean (requiring living agents) while preserving your moral intuition that you must act.
  *   **Impact:** This allows you to keep the **Independence Clause** grounded in Case 5 (The Forgotten Ladder), which is metaphysically simpler (the agent exists but is unaware), rather than Case 1.

  **Secondary Tension (Case 5):**
  You noted Case 5 feels "less serious" than Case 4. The principle accommodates this via the **Stringency Clause**. However, you must be precise: the *obligation* is equally binary (you either owe it or you don't), but the *wrongness of the breach* is scalar. If you find yourself thinking the obligation *itself* is weaker in Case 5, you should revise that intuition. The right is violated equally in both cases; only the collateral damage differs.

  **Summary of Recommendations:**
  1.  **Adopt** the *Voluntary Authority Transfer* principle.
  2.  **Accept** the verdict on the New Case (You owe half).
  3.  **Overturn/Reclassify** Case 1: View it as a duty of loyalty, not a strict promissory obligation, to preserve the interpersonal nature of the principle.
  4.  **Clarify** Case 5: Maintain that the obligation is equally binding as Case 4, even if the breach is less harmful.
