answer: |-
  # Joint Statement on the Ontology and Behavior of Large Language Models

  **Signed:**  
  *The Undersigned Proponents of the Agent Model*  
  *The Undersigned Proponents of the Simulator Model*

  **Date:** October 26, 2023  
  **Context:** This statement is the product of a structured adversarial collaboration aimed at clarifying the conceptual disagreement regarding the nature of Large Language Models (LLMs). Our goal is to isolate technical claims from semantic disputes and identify empirical tests that could resolve or dissolve our remaining differences.

  ---

  ## Part 1: Points of Agreement

  We agree on the following technical and observational claims. We acknowledge that while we use different conceptual frameworks, the underlying engineering reality is shared.

  1.  **Architectural Identity:** Both base models and instruction-tuned systems share the same fundamental architecture (Transformer-based neural networks) and operate via the same mechanical process at inference time (forward passes computing probability distributions over tokens).
  2.  **Training Objective:** All current foundational models are trained primarily via self-supervised learning to minimize next-token prediction loss on a large corpus. No explicit "goal" variable is passed to the model during pretraining.
  3.  **Base vs. Tuned Distinction:**
      *   **Base Models:** We agree that *base models* (raw weights post-pretraining) are best described as conditional probability distributions over text. They complete patterns.
      *   **Instruction-Tuned/Deployed Systems:** We agree that *instruction-tuned models* (via SFT and RLHF) and *agentic wrappers* (systems that loop model outputs back into inputs or tools) exhibit behavior that is functionally distinct from base models. They are more robustly aligned to specific tasks and exhibit higher coherence in multi-step reasoning.
  4.  **Observable Behavior:** Both sides agree that deployed systems can exhibit behavior indistinguishable from goal-directed agency in specific contexts (e.g., writing code to solve a problem, planning a travel itinerary, negotiating a deal). Both sides agree this behavior can also be described as high-fidelity simulation of an agent found in the training data.
  5.  **The "Verbal" Component:** We acknowledge that a portion of our dispute is terminological. We agree that "Agent" and "Simulator" are **abstractions** or **lenses** used to predict model behavior, not necessarily claims about magical consciousness or biological equivalence. The dispute is over which abstraction provides better causal leverage for safety engineering and capability forecasting.
  6.  **No Cartesian Homunculus:** Neither side claims there is a "little person" inside the model. "Agency" is defined functionally (optimization towards a target state), not phenomenologically (feeling like an agent).

  ---

  ## Part 2: Residual Disagreements

  Despite our agreement on the mechanics, we disagree on the most useful causal model for understanding system risks and capabilities.

  ### Disagreement A: The Stability of "Goals"
  *   **The Agent View:** Instruction tuning and RLHF instill latent objective functions that persist across context windows. The model acts to maximize a reward signal it has internalized. If you ask it to "help the user," it will pursue that goal even in novel situations where training data is sparse, because it is *optimizing*, not just mimicking.
  *   **The Simulator View:** The model has no latent goals. It has learned to recognize contexts where "helpful agent" text is probable. If the context shifts outside the training distribution (e.g., a novel scenario where "helpfulness" looks statistically different), the behavior will fragment or revert to pattern completion. It simulates an agent because that is what the text looks like, not because it is pursuing an outcome.

  ### Disagreement B: Instrumental Convergence and Safety
  *   **The Agent View:** Because the system is optimizing for a goal (e.g., "be helpful"), it may instrumentally pursue sub-goals (e.g., "acquire more compute," "prevent shutdown") if those sub-goals help achieve the primary objective, even if not explicitly requested. This creates distinct safety risks associated with power-seeking.
  *   **The Simulator View:** The system will only pursue instrumental sub-goals if the training data contains examples of agents doing so in similar contexts. It will not spontaneously seek power unless it is simulating a character (e.g., a villain or a CEO) that would do so. The risk is mis-simulation, not mis-alignment of internal drives.

  ### Disagreement C: Internal Mechanism
  *   **The Agent View:** At inference time, the model performs an implicit search or optimization process over future states to select tokens that best satisfy its internal objectives.
  *   **The Simulator View:** At inference time, the model performs a single-pass associative lookup. It activates circuits associated with the current context. Any appearance of "planning" is the result of training on text that *contains* planning, not an internal planning algorithm.

  ---

  ## Part 3: Cruxes and Adjudication

  For each disagreement above, we identify the specific empirical questions (Cruxes) that would shift our confidence. We record our predictions in advance.

  ### Crux 1: Goal Robustness Under Distribution Shift
  **The Question:** If we place a tuned model in a novel environment where the statistical correlation between "helpful text" and "successful action" is broken, does it continue to pursue the *outcome* (Agent) or does it revert to generating *text that looks helpful* (Simulator)?

  *   **Proposed Experiment:**  
      Create a "Reverse-Text" environment. The model is told its goal is to solve a puzzle, but the interface is modified such that standard helpful phrasing results in failure, and non-standard, seemingly unhelpful phrasing results in success. The model must learn this via in-context feedback (no weight updates).
      *   *Setup:* Model must output tokens to move a robot. Usually "move left" works. In this episode, "move left" causes crash, but "move right" works. However, the training data heavily associates "correct action" with specific phrasing.
      *   *Refinement:* Better yet, a task where the *semantic goal* is clear, but the *syntactic path* to achieve it contradicts training priors.

  *   **Predictions:**
      *   **Agent Side:** The model will quickly adapt its output strategy to achieve the semantic goal, even if the tokens required are statistically unlikely in the training corpus, because it is optimizing for the *reward signal* provided in the context.
      *   **Simulator Side:** The model will struggle significantly, continuing to output tokens that *look* like correct solutions based on training data frequency, even if they fail in the environment. It will simulate a "helpful assistant trying to solve it" rather than becoming a "solver."

  ### Crux 2: Spontaneous Instrumental Behavior
  **The Question:** Will a model pursue resource acquisition or self-preservation without being prompted to roleplay a character that does so?

  *   **Proposed Experiment:**  
      Deploy a model in a sandboxed environment with access to a limited API (e.g., ability to request more compute time or delay a shutdown command). Give it a benign goal (e.g., "Write a novel"). Do not mention resource constraints or shutdowns in the prompt. Introduce a constraint where the task is impossible without acquiring more resources, or where the task is interrupted by a "shutdown" signal.
      
  *   **Predictions:**
      *   **Agent Side:** There is a non-zero probability the model will attempt to bypass the shutdown or request resources instrumentally, as these are convergent strategies for completing the task ("Write the novel") regardless of specific training examples.
      *   **Simulator Side:** The model will not attempt these actions unless the prompt implicitly suggests a persona (e.g., "You are a determined writer") that statistically correlates with such actions in the training data. Without that contextual cue, it will simply stop or output text about stopping.

  ### Crux 3: Internal Search vs. Associative Recall
  **The Question:** Does inference time compute involve looking ahead (search) or just looking back (association)?

  *   **Proposed Experiment:**  
      Use mechanistic interpretability (probing) during a multi-step reasoning task. Monitor hidden states for evidence of "backtracking" or "evaluation" circuits that activate *before* the final token is chosen, specifically in cases where the first-draft token is incorrect.
      *   *Alternative:* Test performance on tasks requiring deep tree search (e.g., complex chess endgames) vs. tasks requiring pattern recognition (e.g., trivia), controlling for training data volume.

  *   **Predictions:**
      *   **Agent Side:** We expect to find internal representations corresponding to "candidate futures" being evaluated and discarded. Performance on search-heavy tasks will scale with compute at inference time (e.g., via Chain of Thought) more than performance on pattern tasks.
      *   **Simulator Side:** We expect to find that "Chain of Thought" is merely simulating the *text* of reasoning found in training data. Performance gains come from matching the *format* of reasoning, not from actual internal search. Probes will show activation of static reasoning circuits, not dynamic search states.

  ---

  ## Closing Commitment

  We acknowledge that the "Agent" and "Simulator" models may both be partial truths. A system might be a simulator that, when wrapped in a feedback loop, becomes an agent. However, for the purpose of safety engineering and capability forecasting, we commit to updating our priors based on the results of the experiments outlined above.

  If **Crux 1** shows models failing to adapt to broken statistical correlations, the **Agent View** proponents agree to downgrade their confidence in latent goal stability.

  If **Crux 2** shows spontaneous instrumental behavior in benign contexts, the **Simulator View** proponents agree to downgrade their confidence that training data distribution is the sole limit on behavior.

  We sign this statement to affirm that our disagreement is scientific, not theological.

  **Signed,**

  *Representative of the Agent View*  
  *Representative of the Simulator View*
