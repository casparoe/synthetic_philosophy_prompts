answer: |-
  This is a fantastic collision of domains. Your intuition is sharp: formal semantics and statistical modeling often share isomorphic structures, but they optimize for different objective functions (truth conditions vs. predictive accuracy). Your friend was enforcing a metaphysical dichotomy that, from a modeling perspective, looks more like a choice of prior assumptions.

  Here is the restatement of both views in your vocabulary, followed by the residue report and an assessment of your "gap" confusion.

  ### 1. The Model-Based Restatement

  **Epistemicism as Latent Parameter Identification**
  *   **The Setup:** There exists a data-generating process $D$ where the predicate "is a heap" is a deterministic step function $H(n)$.
  *   **The Parameter:** There is a single, fixed scalar threshold $\theta^* \in \mathbb{N}$ such that $H(n) = 1 \iff n \geq \theta^*$.
  *   **The Constraint:** $\theta^*$ is a **latent variable** that is structurally unidentifiable. No amount of observational data or semantic probing can recover $\theta^*$ without violating safety conditions (i.e., any measurement method we use to find $\theta^*$ shifts $\theta^*$ or introduces noise that obscures it).
  *   **The Output:** For any $n$, the proposition "$n$ is a heap" has a truth value of exactly 0 or 1. Our inability to compute it is an inference problem, not a system property. Bivalence is preserved.

  **Supervaluationism as Admissible Ensemble Consensus**
  *   **The Setup:** The predicate "is a heap" is not a single function but a **set of admissible models** $\mathcal{M} = \{M_1, M_2, ..., M_k\}$. Each $M_i$ is a "precisification" (a valid classifier consistent with ordinary usage).
  *   **The Parameter:** There is no single $\theta^*$. Each $M_i$ has its own threshold $\theta_i$. The set $\mathcal{M}$ is constrained by semantic rules (e.g., 10 grains is never a heap, 10,000 always is), but the boundary region is under-specified.
  *   **The Truth Condition (Super-truth):** A proposition $P$ is **True** iff $\forall M_i \in \mathcal{M}, M_i(P) = 1$. It is **False** iff $\forall M_i \in \mathcal{M}, M_i(P) = 0$.
  *   **The Gap:** If $\exists M_a, M_b \in \mathcal{M}$ such that $M_a(P) = 1$ and $M_b(P) = 0$, the output is **undefined** (a truth-value gap). This is not a probability of 0.5; it is a `NaN`. The system does not return a value.

  ---

  ### 2. The Residue Report

  Here is what gets lost, fudged, or preserved when translating metaphysics into modeling.

  | Category | What Translates Cleanly | What Had to Be Fudged | What Has No Counterpart |
  | :--- | :--- | :--- | :--- |
  | **Structure** | **Epistemicism:** Perfectly maps to a latent variable model with an identifiability problem.<br>**Supervaluationism:** Maps to an ensemble method where consensus determines validity. | **Admissibility:** In stats, we select models based on fit (AIC/BIC). In supervaluationism, "admissible precisifications" are selected by *meaning*, which is normative, not empirical. | **Normativity:** Stats asks "Does this predict?" Philosophy asks "Is this *correct*?" The "truth" in supervaluationism carries a logical weight that "ensemble consensus" does not. |
  | **Uncertainty** | **Epistemicism:** Maps to aleatoric vs. epistemic uncertainty distinction (this is purely epistemic).<br>**Supervaluationism:** Maps to model specification uncertainty. | **The Gap:** In stats, if an ensemble disagrees, we usually average (Bayesian Model Averaging) to get a probability. Supervaluationism forbids averaging. It forces a hard `NaN`. | **Ontology:** Epistemicism claims $\theta^*$ exists *in the world*. Stats is usually agnostic about reality, focusing on the map, not the territory. |
  | **Logic** | **Bivalence:** Epistemicism preserves binary classification. Supervaluationism allows for null returns. | **Logical Laws:** Supervaluationism preserves classical tautologies ($P \lor \neg P$) even when $P$ is a gap. In coding/logic, if $P$ is `NaN`, $P \lor \neg P$ often fails or propagates `NaN`. | **Super-truth:** The idea that a statement can be "true" even if no specific model makes it true (e.g., "Either $n$ is a heap or it isn't" is super-true, even if neither disjunct is). Stats has no equivalent to "true but no model supports it." |

  ---

  ### 3. The "Gap" Confusion: Epistemic vs. Truth-Value

  You asked: *"When supervaluationists say a borderline sentence is neither true nor false, I hear it as the model set not settling the question, which sounds like an epistemic gap, not a truth-value gap. Am I collapsing a distinction my vocabulary can't express?"*

  **Short Answer:** You are collapsing the distinction, but you are right to do so *instrumentally*. However, the distinction does heavy lifting *metaphysically*.

  **The Modeling View (Your Intuition):**
  In statistical modeling, if an ensemble $\mathcal{M}$ fails to settle on a classification for input $n$, you treat this as **uncertainty**. You assume there is a ground truth $y$ that you are failing to capture. You would typically resolve this by:
  1.  Adding features (refining the semantics).
  2.  Accepting a probabilistic output (fuzzy logic).
  3.  Acknowledging label noise.

  In all three cases, the "gap" is epistemic. It implies *more information could resolve it*.

  **The Supervaluationist View:**
  The supervaluationist insists the gap is **ontological/semantic**. The set $\mathcal{M}$ is not a temporary collection of models pending better data; it is the *exhaustive definition* of the predicate.
  *   If $\mathcal{M}$ doesn't settle $n$, there is **nothing else to know**.
  *   There is no latent $\theta^*$.
  *   Therefore, the lack of a value is not a failure of knowledge; it is a feature of the language-world interface.

  **Where the Distinction Does Work:**
  The distinction matters if you care about **Logical Laws**.
  *   **Epistemicism:** $P \lor \neg P$ is true because one of them corresponds to the latent $\theta^*$.
  *   **Supervaluationism:** $P \lor \neg P$ is true because *every* $M_i \in \mathcal{M}$ returns 1 for that statement (since each $M_i$ is bivalent), even though $P$ itself returns `NaN` across the set.
  *   **Stats/Modeling:** If $P$ is `NaN`, standard logic engines often break. To get supervaluationist logic, you have to write a custom evaluator that checks the *set* of models, not the *output* of the set.

  **Where the Distinction Collapses:**
  If you are building a system to *act* on the world (e.g., a robot deciding when to sweep up grains), the distinction vanishes.
  *   The Epistemicist robot says: "There is a true cutoff, but I don't know it. I will minimize expected loss."
  *   The Supervaluationist robot says: "There is no true cutoff. I will minimize expected loss over the admissible set."
  *   **Result:** They write the same code.

  ### 4. Verdict

  Your friend insisted on a choice because they are playing a metaphysical game (What is the nature of truth?). You are playing an engineering game (How do we represent uncertainty?).

  *   **Are you collapsing a distinction?** Yes. You are treating "semantic indeterminacy" as "model specification uncertainty."
  *   **Is the distinction doing less work than philosophers think?** For *prediction and action*, yes. The behavioral implications of Epistemicism and Supervaluationism are nearly identical (both lead to caution in the borderline region).
  *   **Is the distinction useless?** No. It determines how you handle the **Logic**. If you need to reason *about* the propositions (e.g., in a legal contract or a formal proof), Supervaluationism allows you to assert "Either this is a heap or it isn't" without committing to a specific grain count, whereas Epistemicism forces you to admit there *is* a specific count, even if you can't name it.

  **Recommendation:** Tell your friend you accept the **formal structure** of Supervaluationism (the ensemble), but you reject the **metaphysical claim** that the gap isn't epistemic. In modeling, an unidentifiable parameter and a non-existent parameter often yield the same likelihood surface. You're effectively adopting a **Bayesian Epistemicism**: you treat the threshold as a random variable with a prior distribution over the "admissible" range, rather than a fixed unknown (Epistemicism) or a non-existent entity (Supervaluationism). That's a third option your friend didn't give you: **Contextualism / Probabilism.**
