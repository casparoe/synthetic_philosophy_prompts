      *   *Is this accurate?* Yes, largely. Jason Brennan (epistocrat) often argues from consequences (better outcomes). David Estlund (democratic theorist) argues from "normative consent" or intrinsic fairness.
      *   *Is it the whole story?* Probably not. There are empirical assumptions buried in the normative claims (e.g., "bias in testing" is an empirical claim about social science). There's also a disagreement about *authority* (who has the right to rule).
      *   *Conclusion:* The user's hypothesis is strong but needs nuance. It's not *just* bedrock intuitions; it's also about how those intuitions interact with non-ideal theory and the nature of political authority.

  3.  **Diagnosing the Structure of the Disagreement:**
      *   **Option A: Clash of Bedrock Normative Intuitions.** (User's lean). Yes, "equality as constitutive of legitimacy" vs. "legitimacy as dependent on correctness/justice of outcomes." This is the "Right vs. Good" tension or "Procedural vs. Epistemic" legitimacy.
      *   **Option B: Hidden Empirical Disagreement.** Both sides make empirical claims. Epistocrats assume competence can be measured without bias. Democrats assume it can't. Epistocrats assume voters are too ignorant. Democrats assume voters can learn or that ignorance doesn't matter as much. *However*, these are often secondary to the normative pivot. Even if epistocrats proved their system yields 10% better GDP, democrats might still reject it.
      *   **Option C: Burden of Proof.** Who needs to justify what? Democrats say: "Universal suffrage is the default; prove why we should restrict." Epistocrats say: "Restrictions exist already; prove why *this* restriction is unjust." This is a meta-ethical/methodological clash.
      *   **Option D: The Nature of Political Authority.** This is the deepest layer. Is authority about *doing the right thing* (teleological) or *respecting persons* (deontological)?

      *Synthesis:* It's a hybrid. It looks like a normative clash, but it's sustained by mutually incompatible frameworks of legitimacy. It's a "framework disagreement."

  4.  **Developing the Diagnosis (The "Something Else"):**
      *   I need to go beyond just saying "Yes, it's normative."
      *   *Key Concept:* **The Independence Condition.** David Estlund's argument is crucial here. Even if epistocracy produces better results, if the procedure isn't acceptable to all qualified points of view, it lacks legitimacy.
      *   *Key Concept:* **The Problem of Disagreement.** Epistocrats assume there is a "truth" in politics that can be identified. Democrats (often) assume politics is about reconciling conflicting values where no single "truth" exists.
      *   *Key Concept:* **Non-Ideal Theory.** Epistocrats argue from non-ideal reality (voters are ignorant). Democrats often argue from ideal theory (what constitutes a just relationship) or fear the non-ideal implementation (abuse of power).

  5.  **Addressing "What Counts as Progress?":**
