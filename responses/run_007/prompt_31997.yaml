answer: |-
  Your hypothesis is astute and captures the dominant fault line in the literature. The stalemate between democrats (e.g., David Estlund, Hélène Landemore) and epistocrats (e.g., Jason Brennan, Christopher Achen & Larry Bartels) does indeed rest heavily on whether political equality is constitutive of legitimacy or merely conducive to it.

  However, diagnosing this *only* as a clash of bedrock normative intuitions risks oversimplifying the machinery of the deadlock. If it were purely a clash of intuitions (Justice as Fairness vs. Justice as Accuracy), the debate would have ended sooner with a mutual acknowledgment of incompatibility. The fact that it persists suggests the disagreement is structural and methodological, not just axiological.

  Here is a diagnosis of the structure of the disagreement, followed by an assessment of what progress might look like.

  ### 1. Diagnosis: A Clash of Legitimacy Criteria, Not Just Values

  While the instrumental vs. intrinsic value of equality is the normative engine, the structural deadlock arises from **incompatible criteria for political legitimacy.**

  **The Democrat's Criterion: Acceptability to Qualified Points of View**
  Democratic theorists generally argue that for a law to be binding, the procedure that produced it must be justifiable to all reasonable citizens. David Estlund calls this the "independence condition." Even if an epistocratic regime produced objectively "better" laws (by some metric), it would lack legitimacy if those subjected to the laws could reasonably reject the authority of the rulers. For the democrat, legitimacy is relational; it is about the status of the citizen vis-à-vis the state. To be ruled by those you deem unequal is a form of subordination incompatible with justice.

  **The Epistocrat's Criterion: Correctness of Outcomes**
  Epistocrats generally argue that political authority is justified by the quality of the decisions produced. They treat governance as a problem-solving exercise. If the goal of government is to secure rights, promote welfare, and avoid disaster, then the system that best achieves these ends has the strongest claim to authority. For the epistocrat, legitimacy is teleological; it is about the output of the system. To allow incompetent voters to steer the ship is a violation of the duty of care owed to the passengers.

  **The Structural Impasse:**
  The debate stalls because the two sides are playing different games.
  *   When the **Epistocrat** offers empirical evidence that voters are ignorant, the **Democrat** replies that ignorance doesn't negate the right to authorship.
  *   When the **Democrat** argues that competence tests are biased, the **Epistocrat** replies that we can improve the tests, and that the bias of democracy (e.g., populist racism) is also real.

  They talk past each other because one is arguing about *authority* (who has the right to decide?) and the other is arguing about *competence* (who decides best?).

  ### 2. Is it Bedrock Intuition, Empirical Disagreement, or Burden of Proof?

  It is a hybrid of all three, layered in a specific way:

  **A. The Bedrock Layer (Normative)**
  You are correct that there is a foundational split.
  *   **Democrat:** Political equality is a *deontological constraint*. You cannot trade it off for utility.
  *   **Epistocrat:** Political equality is a *presumptive heuristic*. It is useful because we usually don't know who is wise, but if we *do* know, the presumption is defeated.
  *   *Verdict:* This layer is largely unresolvable through argument. It is a choice between a Kantian respect for persons and a Utilitarian/Consequentialist focus on states of affairs.

  **B. The Empirical Layer (Feasibility)**
  This is where the debate *should* be livelier, but isn't.
  *   **Epistocrats** assume political truth is discoverable and measurable (e.g., "This policy increases GDP," "This policy reduces rights violations").
  *   **Democrats** often argue that politics is not about truth but about reconciling conflicting values where no "correct" answer exists.
  *   *Verdict:* This is a hidden empirical/metaphysical disagreement. If there is no "political truth" to be known, epistocracy collapses. If there is, democracy looks negligent. Neither side proves the ontology of political truth; they assume it.

  **C. The Methodological Layer (Burden of Proof)**
  This is the most practical source of the stall.
  *   **Democrats** place the burden on the epistocrat to prove that a restriction on voting would not be abusive. Given the history of literacy tests and property requirements, this is a high bar.
  *   **Epistocrats** place the burden on the democrat to justify why *current* restrictions (age, felony disenfranchisement, citizenship) are just if competence is irrelevant.
  *   *Verdict:* Both burdens are reasonable, creating a equilibrium of skepticism. The democrat fears tyranny; the epistocrat fears incompetence.

  ### 3. What Would Count as Progress?

  If the disagreement is rooted in incompatible legitimacy criteria, traditional philosophical argumentation (seeking a "knockdown" proof) will not work. Progress requires shifting the terrain.

  **A. Comparative Institutional Analysis (The "Non-Ideal" Turn)**
  Progress lies in abandoning ideal theory. Instead of asking "Is epistocracy just in principle?", ask "What do existing epistocratic mechanisms look like in practice?"
  *   *Progress:* Acknowledging that we already live in a partial epistocracy (bureaucracies, courts, central banks). The debate should shift to the *boundaries* of these institutions. How much power should unelected experts have? This moves the debate from "Voting Yes/No" to "Designing Checks and Balances."

  **B. Decoupling Competence from Voting**
  The binary of "vote vs. no vote" is a false dichotomy.
  *   *Progress:* Exploring hybrid models. For example, **Epistemic Deliberative Democracy**. Instead of restricting the *franchise*, restrict the *agenda* or weight the *deliberation*. Citizen assemblies (sortition) combined with expert testimony allow for competence without permanent class stratification. If theorists focus on institutional design rather than franchise restriction, the normative clash softens.

  **C. Clarifying the Ontology of Political Truth**
  *   *Progress:* Epistocrats need to specify *what* kind of knowledge is required. Is it technical knowledge (economics, climate science) or moral knowledge (justice, rights)?
      *   If it's technical, democrats can concede ground (e.g., independent central banks).
      *   If it's moral, epistocrats face the "Who guards the guardians?" problem.
      *   Making this distinction explicit would dissolve many arguments. Most democrats accept technocracy for interest rates; most epistocrats don't claim experts know which religion is true.

  ### 4. Is the Impasse Itself Telling?

  Yes. The persistence of this deadlock suggests something vital about the nature of political philosophy: **It cannot settle questions of authority without a prior agreement on the purpose of the state.**

  The impasse tells us that political philosophy is not a science of discovery but a practice of negotiation. The fact that we cannot agree on whether equality is intrinsic or instrumental reflects a deeper pluralism in modern society. We do not share a single *telos* (purpose) for our political community.

  *   To the **Epistocrat**, the state is a **service provider** (efficiency, safety, welfare).
  *   To the **Democrat**, the state is a **community of agents** (dignity, recognition, self-rule).

  As long as we hold both views simultaneously (which we do), the debate will remain stalled. This is not a failure of philosophy; it is a feature of a liberal society that values both welfare and autonomy.

  **Conclusion:**
  Your hypothesis is correct that the normative split is the engine of the debate. However, the *stall* is caused by the fact that both sides are making valid claims within different frameworks of legitimacy. Progress will not come from one side defeating the other, but from **institutional hybridity**—designing systems that satisfy the epistocrat's demand for competence (through deliberation, sortition, or expert advisory powers) without violating the democrat's demand for equality (by maintaining universal suffrage and rotational power). The impasse warns us against purity: a purely epistocratic state is tyrannical; a purely egalitarian state (ignoring competence) is negligent. The work of political philosophy is to navigate the tension, not resolve it.
