answer: |-
  The word you are hunting for is **Incommensurability**.

  You have described the concept almost perfectly. In fact, your intuition is sharper than most undergraduate philosophy of science summaries, which often flatten this idea into "old scientists were blind."

  Here is the breakdown of the term, how it fits your description, and how to distinguish it from the related concepts you mentioned (like Paradigm Shifts and Feyerabend's work).

  ### 1. The Core Term: Incommensurability
  **Origin:** Thomas Kuhn (and independently Paul Feyerabend) in the early 1960s.
  **Literal Meaning:** "No common measure" (from mathematics/geometry).

  You identified three specific characteristics. Kuhn's *incommensurability* is usually broken down into those exact same three components:

  1.  **Semantic/Conceptual (Your Point 1):** You cannot fully translate claims from one framework to another without loss or distortion.
      *   *Example:* When Einstein talks about "mass," it is not the same concept as when Newton talks about "mass." Newtonian mass is constant; Einsteinian mass is relative to velocity. If you try to translate Einstein into Newton, you don't just get a "mistake"; you get a category error.
      *   *Your Phlogiston Example:* Exactly. To a phlogiston theorist, "calx" (ash) is the *true* substance and phlogiston is the principle of combustion. To Lavoisier, "calx" is a compound of metal + oxygen. They aren't disagreeing on the weight; they are disagreeing on what the stuff *is*.
  2.  **Methodological (Your Point 2):** They do not share standards of evidence or what counts as a "solution."
      *   *Example:* For an Aristotelian, a theory that doesn't explain *why* things move (teleology) is incomplete. For a Galilean, a theory that relies on "natural places" is metaphysical nonsense. They can't agree on an experiment because they disagree on what the experiment is supposed to prove.
  3.  **Perceptual/Worldview (Your Point 3):** Neither side is irrational; they are operating in different "worlds."
      *   Kuhn often used Gestalt switches (like the duck-rabbit illusion) to describe this. The data on the page is the same, but what they *see* is different.

  ### 2. Incommensurability vs. Paradigm Shift
  You mentioned you knew about **Paradigm Shifts**. It is important to distinguish the two:

  *   **Paradigm:** The working framework itself (e.g., Newtonian Physics).
  *   **Paradigm Shift:** The historical *event* or process of moving from one to another.
  *   **Incommensurability:** The *logical relationship* between the two paradigms.

  **The Boundary:** You can have a paradigm shift without total incommensurability (some philosophers argue this happens in minor shifts), but Kuhn argued that *major* scientific revolutions are defined by incommensurability. If you are describing the *barrier* that makes the shift so difficult and messy, you are describing incommensurability.

  ### 3. Kuhn vs. Feyerabend (The Nuance)
  You asked about **Paul Feyerabend**. He is the other half of this story. He and Kuhn were friends and developed these ideas around the same time (early 60s), but they took them in different directions.

  *   **Kuhn's Version (Historical/Sociological):** Kuhn used incommensurability to explain why history of science looks the way it does. He was trying to be descriptive. He argued that because of incommensurability, scientists talk past each other during revolutions, and eventually, the old guard dies off while the new generation adopts the new paradigm. He didn't think this made science "irrational," just that "rationality" is internal to a paradigm.
  *   **Feyerabend's Version (Epistemological Anarchism):** Feyerabend took the concept and ran with it much further. He argued that because frameworks are incommensurable, there is no universal "Scientific Method" that governs all science. His famous slogan was **"Anything Goes."** He argued that scientists *should* break rules to make progress.

  **Which fits your description?**
  Your description fits **Kuhn** better. You emphasized that neither side is being irrational and that the frameworks are internally consistent. Feyerabend tended to focus more on how scientists *should* exploit these gaps to break rules, whereas you are observing the structural inability to compare the two.

  ### 4. Related Terms (And why they aren't quite it)
  There are a few other terms you might encounter that are close but distinct:

  *   **Theory-Ladenness of Observation:** (Associated with Norwood Russell Hanson and Kuhn). This is the idea that what you "see" depends on what theory you hold. (e.g., Tycho Brahe and Kepler saw the same sunrise, but Brahe saw "the sun moving" and Kepler saw "the earth turning").
      *   *Distinction:* This is a *cause* of incommensurability. It explains *why* they can't agree on evidence (your point 2), but "Incommensurability" is the broader term for the whole relationship.
  *   **Underdetermination:** (Duhem-Quine Thesis). This is the idea that data is never sufficient to prove a theory true, because you can always adjust auxiliary hypotheses to save a theory.
      *   *Distinction:* Underdetermination says "Data can't pick a winner." Incommensurability says "The competitors aren't even playing the same game."
  *   **Research Programmes:** (Imre Lakatos). Lakatos tried to fix Kuhn's idea. He thought "Incommensurability" made science look too irrational. He proposed that science consists of "Research Programmes" with a "hard core" and a "protective belt."
      *   *Distinction:* Lakatos tried to create a way to compare frameworks *despite* their differences. If you think the frameworks *can* be compared rationally over time, you are leaning toward Lakatos. If you think they *cannot*, you are with Kuhn.

  ### 5. One Correction/Refinement on Your View
  You asked if your description mixes up two things. It is remarkably accurate, but there is one nuance Kuhn added later that might interest you.

  In the original 1962 edition of *The Structure of Scientific Revolutions*, Kuhn was very strong on the "untranslatability" aspect. However, in the **Postscript (1969)**, he softened his view. He admitted that communication isn't *impossible*, just very difficult. He suggested that incommensurability is local (specific terms differ) rather than global (the whole language is different).

  He later likened it to learning a second language. You can translate "gavagai" to "rabbit," but you might miss the cultural nuance of how the word is used. Similarly, we can understand Phlogiston theory, but we have to learn to "speak" it to understand why it made sense to them, rather than just translating it into Oxygen terms and calling it wrong.

  ### Summary
  *   **The Word:** **Incommensurability**.
  *   **The Author:** Primarily **Thomas Kuhn** (with **Paul Feyerabend**).
  *   **The Context:** It is the defining feature of a **Paradigm Shift**.
  *   **Why it fits:** It specifically addresses the lack of a neutral language (translation failure), the lack of neutral standards (methodology), and the internal rationality of both sides.

  You have essentially rediscovered the central thesis of *The Structure of Scientific Revolutions* through your own reading. That is a great place to be. If you want to read the primary source, focus on Chapters IX ("The Nature and Necessity of Scientific Revolutions") and X ("Revolutions as Changes of World View"). That is where he defines the term you are looking for.
