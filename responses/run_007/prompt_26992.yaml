answer: |-
  **1. The Falsifiability Worry**
  There's a falsifiability worry here. If every act of categorization is an analogy, the claim starts to sound unfalsifiable. It risks becoming a theory of everything that explains nothing. When I'm drafting, I treat some connections as structural facts and others as creative leaps. If everything is the same mechanism, how do I know when I'm discovering a truth versus making a comparison?

  **Follow-up (if he says literal meaning is just frozen analogy):**
  Your stock reply will probably be that literal meaning is just frozen analogy. But when I'm editing, I treat a dead metaphor as logic, not history. Is a frozen analogy still doing explanatory work now, or is that just the history of the word, not the mechanism?

  **2. The Grounding Worry**
  Analogy seems to presuppose similarity, and similarity is cheap. Anything is like anything in some respect. I can write a line comparing grief to a refrigerator, and technically it works, but it feels false. What stops the mind from making every possible connection?

  **Follow-up (if he says similarity is produced by the mapping):**
  If you say similarity is produced by the mapping rather than given in advance, ask what constrains the mapping. When a metaphor feels forced, is there a non-analogical residue (perceptual, spatial, causal) doing the real work of saying "no"?

  **3. The Label Question**
  The book leans hard on the idea that a word is what lets a category hold together across wildly different cases. But often when I'm writing, I have a sense of the thing before I have the name for it. I'm chasing a feeling that hasn't been lexicalized yet.

  **Follow-up (if he insists on the lexical engine):**
  Ask whether the real engine is lexical or social rather than analogical. Can prelinguistic creatures or wordless thought have concepts on his view, or do they just have sensory soup until a label arrives?

  **4. The Normativity of Metaphor**
  If creative metaphor and mundane categorization are the same mechanism differing only in degree, what distinguishes a good fresh metaphor from a dead cliché? In revision, I kill the clichés and keep the fresh ones, but if the machinery is identical, why does one feel alive and the other rot?

  **Follow-up (if he reaches for aptness or revelation):**
  If he reaches for aptness or how much a mapping reveals, ask what aptness is and whether that norm is itself explained by analogy or is a separate evaluative faculty being smuggled in.

  **5. The Logic and Math Case**
  Analogy is content-sensitive and fallible, but modus ponens looks topic-neutral and exceptionless. When I'm building a plot, cause and effect feel rigid, not slippery. If I break logic, the story collapses; if I break an analogy, it just becomes odd.

  **Follow-up (if he says logic is the limiting case with zero slippage):**
  If he says logic is the limiting case with zero slippage, ask whether a limiting case with no slippage is still an analogy in any ordinary sense, and what a non-analogical mental process would even look like on his view, i.e. what would falsify the thesis.

  **6. The Machine-Learning Point**
  You'll likely say LLMs and vector-space similarity are already doing something like this. They map concepts based on proximity, just like you describe. But when I read AI writing, it feels like it's missing the spark of understanding.

  **Follow-up (if he says transformers learn similarity structure):**
  Ask what the analogy claim adds beyond the empirical claim that transformers learn similarity structure from co-occurrence statistics, and what a real implementation of the theory would have to do that GPT-style models don't.

  **7. The Caricature Problem**
  You argue the essence of a concept is really a caricature, not a definition. In fiction, we're told to avoid caricatures and seek complex truths. Are you saying that deep characterization is an illusion? That every character is ultimately a stereotype held together by a name?

  **Follow-up (if he says caricature is just a high-pressure summary):**
  If he says caricature is just a high-pressure summary, ask how we ever escape the caricature to find nuance. Is nuance just a competing caricature, or is there a mode of thought that resists simplification?

  **8. The Role of Affect**
  Your model is very cognitive—mapping, categories, labels. But when a metaphor lands, it lands in the body. It hurts or it soothes. Where does the affect live in this machinery? Is emotion just another label, or does it drive the mapping?

  **Follow-up (if he says emotion is part of the weighting system):**
  If he says emotion is part of the weighting system, ask why some analogies feel coldly correct but emotionally dead. Is there a gap between cognitive mapping and emotional resonance that your theory doesn't bridge?

  **9. Slippage in Revision**
  When I change a single word in a paragraph, sometimes the entire category of the scene shifts. A "walk" becomes a "march" and the character's motivation changes. Is this the slippage you're talking about, or is this something more semantic?

  **Follow-up (if he says this is proof of fluid categories):**
  If he says this is proof of fluid categories, ask why some words resist slippage more than others. Why is "murder" harder to stretch than "walk"? Is there a hierarchy of rigidity?

  **10. The Hard Case**
  I want to believe this because it matches how I feel when I'm writing. But I need to know where the theory breaks. Where is the hard case for you? What phenomenon would make you say, "Okay, this isn't analogy"?

  **Follow-up (if he says nothing breaks it):**
  If he says nothing breaks it, press on whether a theory that absorbs all counter-evidence is a description of reality or just a vocabulary choice. Are we arguing about how the mind works, or just how we use the word "analogy"?
