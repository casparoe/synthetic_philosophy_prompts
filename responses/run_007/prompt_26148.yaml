      *   *Move 3: Dual Content.* The judgment has two aspects: a physical mode of presentation and a phenomenal mode of presentation. They refer to the same token state (if identity theory) or distinct tokens (if dualism). Wait, epiphenomenalism is usually property dualism. So P and Q are distinct.
      *   *Move 4: Chalmers' Specific Defense.* David Chalmers addresses this. He argues that the judgment is caused by P, but the *concept* used in the judgment is a phenomenal concept. The application of the concept is triggered by P, but the concept itself picks out Q.
      *   *Move 5: The "Shadow" Argument.* Q is a "shadow" of P. We talk about the shadow because the shadow is what it *feels like* from the inside, even if the shadow does nothing.
      *   *Move 6: Accept the Bullet (Illusionism).* Maybe the judgment *is* about P, but we misdescribe it as being about Q. (This abandons epiphenomenalism for illusionism/eliminativism).

  6.  **Synthesize the "Aboutness" Problem (The Content Objection):**
      *   This is often called the "Problem of Content" or "Reference Problem" for epiphenomenalism.
      *   If content is causal (e.g., Fodor, Dretske), then a causally inert property cannot be represented.
