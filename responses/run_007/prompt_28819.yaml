prompt: |-
  Just spent two hours arguing with a mate about whether composite objects really exist or whether its all just arrangements of simples, and by the end I was convinced the whole thing might be a verbal dispute but I couldnt articulate exactly why. He kept saying "no, it's substantive, we're disagreeing about the world" and I kept saying "I think we're just using 'exists' differently" and we got absolutely nowhere.

  So here's what I want: a decision tree that takes someone from "two philosophers seem to disagree about claim P" to a diagnosis of what kind of dispute they're having. The leaves should be the standard categories from the verbal disputes literature — merely verbal, merely terminological, substantively terminological, genuinely substantive, whatever the real taxonomy is. Each branch node should be a question a person can answer about the specific argument they're in without knowing any metaontology jargon. I want the tree built from the logical space first (what combinations of answers are possible) and then the named positions located in that space, with any empty regions flagged and briefly explained (incoherent? just unattractive? nobody's got round to it?). Also tell me which leaf pairs your tree can't reliably pull apart, if any.

  And please just give me the tree — no warm-up, no "here you go," just the decision tree itself.
