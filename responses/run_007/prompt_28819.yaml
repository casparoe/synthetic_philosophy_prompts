answer: |-
  # DISPUTE DIAGNOSTIC TREE

  **START:** Two parties (A and B) disagree on Claim P containing Term T.

  **NODE 1: UNDERLYING FACT AGREEMENT**
  *Question:* If you describe the situation using only words both parties accept (excluding Term T), do they agree on the description?
  *(Example: Instead of "There is a table," use "There are particles arranged table-wise.")*

  ├── **YES** (They agree on the underlying facts)
  │   │
  │   **NODE 2: SEMANTIC DEPENDENCE**
  │   *Question:* If Party A adopted Party B's definition of Term T, would Party A change their verdict on Claim P?
  │   │
  │   ├── **YES** (The meaning drives the disagreement)
  │   │   │
  │   │   **NODE 3: NORMATIVE/PRACTICAL STAKES**
  │   │   *Question:* Does using one definition over the other change what actions you should take or what other predictions you make?
  │   │   │
  │   │   ├── **NO** → **LEAF: MERELY VERBAL**
  │   │   │   *(Standard label: Verbal Dispute / Quantifier Variance)*
  │   │   │   *Diagnosis:* No factual disagreement; no practical consequence. Dissolves upon translation.
  │   │   │
  │   │   └── **YES** → **LEAF: SUBSTANTIVELY TERMINOLOGICAL**
  │   │       *(Standard label: Conceptual Engineering / Deeply Verbal)*
  │   │       *Diagnosis:* No factual disagreement, but choice of language has normative or theoretical weight.
  │   │
  │   └── **NO** (Meaning does not drive the disagreement)
  │       │
  │       └── **⚠️ REGION: INCOHERENT / LOGICAL ERROR**
  │           *(Status: Empty Region)*
  │           *Explanation:* If parties agree on facts AND meaning swap doesn't change verdict, there is no source for the disagreement. Assumes irrationality or hidden premises.
  │
  └── **NO** (They disagree on the underlying facts)
      │
      **NODE 2: SEMANTIC DEPENDENCE**
      *Question:* If Party A adopted Party B's definition of Term T, would Party A change their verdict on Claim P?
      │
      ├── **NO** (Meaning does not drive the disagreement)
      │   │
      │   └── **LEAF: GENUINELY SUBSTANTIVE**
      │       *(Standard label: Ontological Realism / Metaphysical Dispute)*
      │       *Diagnosis:* Shared language, shared concepts, disagreement about how the world is.
      │
      └── **YES** (Meaning drives part of the disagreement)
          │
          **NODE 3: NORMATIVE/PRACTICAL STAKES**
          *Question:* Does using one definition over the other change what actions you should take or what other predictions you make?
          │
          ├── **NO** → **LEAF: VERBAL WITH SUBSTANTIVE REMAINDER**
          │   *(Standard label: Mixed Dispute / Talking Past Each Other)*
          │   *Diagnosis:* Parties are using different concepts, but also disagree on facts within those concepts.
          │
          └── **YES** → **LEAF: MIXED WITH NORMATIVE STAKES**
              *(Standard label: Complex Conceptual Dispute)*
              *Diagnosis:* Verbal variance, factual disagreement, and practical consequences all present.

  ***

  ### EMPTY / PROBLEMATIC REGIONS

  *   **Underlying Fact Agreement = YES / Semantic Dependence = NO**
      *   **Status:** Logically Empty (given the input assumption of a dispute).
      *   **Explanation:** If parties agree on all non-semantic facts and the specific terminology does not influence their verdict, there is no remaining variable to sustain the disagreement. This region implies one party is lying, logically incompetent, or hiding a third variable not captured by the tree.

  ### INDISTINGUISHABLE LEAF PAIRS

  *   **MERELY VERBAL vs. SUBSTANTIVELY TERMINOLOGICAL**
      *   **Reason:** The distinction hinges on whether "choosing a conceptual scheme" counts as a substantive fact. Some metaontologists (e.g., Thomasson) argue all existence questions are substantively terminological, while others (e.g., Hirsch) argue many are merely verbal. The tree isolates the *practical stakes*, but philosophers disagree on whether lacking practical stakes makes a dispute "merely" verbal or still substantive regarding concept choice.
  *   **GENUINELY SUBSTANTIVE vs. VERBAL WITH SUBSTANTIVE REMAINDER**
      *   **Reason:** Isolating the "semantic" component from the "factual" component is often difficult in practice. If the semantic variance is subtle (e.g., slight differences in quantifier restriction), it may be empirically indistinguishable from a small factual disagreement without full charitable reconstruction of both languages.
