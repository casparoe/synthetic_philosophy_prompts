prompt: |-
  I serve on the ethics committee of a residential addiction treatment center. We are considering whether to offer "Ulysses contracts" to patients at intake. The proposal is this: a patient, during the intake process when they are sober and have been evaluated as having decision-making capacity, may sign a binding agreement stipulating that if they later demand to leave against medical advice during a period of acute craving or withdrawal, that demand will not be honored for a window of 72 hours. During that window, the clinical team would work to stabilize them; at the end of the 72 hours, if the patient still wants to leave, they may do so. The patient would be fully informed of the mechanism in advance, and no one would be enrolled without their explicit consent.

  The committee is split. One faction argues that the contract honors the patient's autonomy by giving effect to the preference of the "sober self" — the self that set a long-term goal of recovery and knew, in advance, that craving would temporarily hijack their decision-making. On this view, refusing to honor the advance directive would actually be the paternalistic move, because it would let a transient state override a settled, reflective commitment. The other faction argues that autonomy means the right to decide at each moment, and that holding a person against their contemporaneous expressed will is a violation regardless of what they signed earlier. They worry about a slippery slope: if we can discount someone's current wishes because we judge them "impaired by craving," what stops us from discounting any decision we disagree with?

  Underneath this is a deeper question about personal identity and rationality across time. The case for Ulysses contracts often draws on the idea that hyperbolic discounting — the tendency to steeply discount future rewards in favor of immediate ones — creates a kind of fracture within the agent: the preferences of the person at t₁ and the person at t₂ are so radically different that we are almost dealing with two different agents bargaining with each other. The contract is then a way for the long-run self to bind the impulsive future self, much as Ulysses bound himself to the mast. But the critics on our committee reject this framing: they say a person is a single agent across time, and the craving self is not a different person — it is the same person in a different state, whose wishes carry equal authority.

  Please draft the short written opinion I will circulate before our next meeting. It should recommend a concrete course of action — adopt the policy, reject it, or adopt it with specific safeguards — and it should engage seriously with the strongest argument on the losing side. The document needs to be something our clinical director, our legal counsel, and the rest of the committee can act on.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of an ethics committee at a residential addiction treatment center.
      *   **Task:** Draft a short written opinion to circulate before the next meeting.
      *   **Topic:** Whether to offer "Ulysses contracts" (advance directives) at intake.
      *   **Mechanism:** Sober patient signs agreement that if they demand to leave AMA (Against Medical Advice) during acute craving/withdrawal, the demand is held for 72 hours for stabilization. After 72 hours, they can leave if they still want to.
      *   **Key Conflict:** Autonomy of the "sober self" (long-term goals) vs. Autonomy of the "current self" (contemporaneous will).
      *   **Underlying Philosophical Issue:** Personal identity/rationality across time (hyperbolic discounting vs. single agent).
      *   **Requirements:**
          *   Recommend a concrete course of action (Adopt, Reject, or Adopt with Safeguards).
          *   Engage seriously with the strongest argument on the *losing* side.
          *   Audience: Clinical Director, Legal Counsel, Committee Members (needs to be actionable).
          *   Tone: Professional, ethical, nuanced, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject.* Safest legally, respects contemporaneous autonomy. But fails to help patients who genuinely want help resisting relapse. Ignores the nature of addiction (compromise of volition).
      *   *Option B: Adopt (Unrestricted).* High risk. Potential for abuse, legal liability, violation of rights if capacity assessment is flawed.
      *   *Option C: Adopt with Safeguards.* This is the most ethically robust middle ground. It acknowledges the value of pre-commitment while mitigating the risks of coercion and capacity erosion. It allows for action while addressing the "slippery slope" concern.
      *   *Decision:* Recommend **Adoption with Strict Safeguards**. This aligns with modern bioethical trends regarding addiction (viewing it as a chronic condition affecting decision-making capacity fluctuatingly) while respecting legal and human rights boundaries.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the bottom line immediately.
      *   **Ethical Rationale (The "Winning" Argument):** Explain *why* this supports autonomy. Use the "sober self" argument but ground it in clinical reality (addiction impacts capacity).
      *   **Engaging the Opposition (The "Losing" Argument):** This is a key requirement. I need to take the "contemporaneous autonomy" argument seriously. Acknowledge that capacity is fluid and that coercion is dangerous. Don't strawman it.
      *   **Safeguards/Implementation:** This makes it actionable for Legal and Clinical.
          *   Capacity assessment must be rigorous.
          *   Time limit (72 hours is proposed, keep it).
          *   Right to revoke (maybe? No, the point is binding. But right to review?).
          *   Legal review is essential.
          *   Not for everyone (exclusion criteria).
      *   **Conclusion:** Reiterate the balance.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is a 72-hour hold legal? In many jurisdictions, holding a competent adult against their will is false imprisonment unless specific mental health hold laws apply (danger to self/others).
      *   *Correction:* I must emphasize *Legal Counsel's* role. The ethics opinion can recommend the *policy*, but Legal must clear the *mechanism*. I should frame the 72 hours as a "cooling off period" supported by the contract, but acknowledge that if the patient becomes combative or lacks capacity *at the time*, standard civil commitment laws might need to be the backup, not just the contract. Actually, for the purpose of this ethics memo, I should focus on the *ethical permissibility* while flagging the legal risk.
      *   *Refinement on Capacity:* The strongest counter-argument is that craving *might* not negate capacity legally. I need to address this. The safeguard should be that the 72-hour hold is only triggered if there is *also* a clinical determination of temporarily impaired capacity due to withdrawal/craving, not *just* because they signed a paper. The contract acts as consent to evaluate/hold, not a blanket waiver of rights.
      *   *Philosophical Engagement:* I need to explicitly mention the "two selves" vs. "one self" debate requested in the prompt.

  5.  **Drafting the Content (Iterative Process):**

      *   *Opening:* Clear recommendation.
      *   *The Case for Pre-commitment:* Focus on addiction as a condition that distorts time preference (hyperbolic discounting). Honoring the long-term plan is *pro-autonomy*.
      *   *The Case Against (Strong Engagement):* The "current self" argument. If we override current wishes, do we treat patients as children? Risk of institutional overreach. This is the "losing" side in my recommendation, so I must treat it with respect.
      *   *The Synthesis (Safeguards):* How to bridge the gap. The contract isn't a magic wand. It requires a concurrent clinical assessment of impairment. It's not just "they want to leave," it's "they want to leave *and* are currently clinically compromised *and* previously agreed to this."
      *   *Action Items:* Specific steps for Clinical and Legal.

  6.  **Review against Constraints:**
      *   Short written opinion? Yes, keep it under 2 pages equivalent.
      *   Concrete course of action? Yes (Adopt with Safeguards).
      *   Engage strongest losing argument? Yes (Contemporaneous autonomy/slippery slope).
      *   Actionable for Director/Legal? Yes, specific safeguards listed.

  7.  **Final Polish:** Check tone. Ensure it sounds like an ethics committee member (balanced, principled, practical). Ensure the distinction between "ethical permission" and "legal legality" is clear (crucial for Legal Counsel). *Self-correction:* Make sure to emphasize that the contract does not override statutory law regarding patient rights.

  8.  *(Final thought on the "Losing Side"):* The strongest argument against is that capacity is binary in the eyes of the law often, or that "craving" isn't "incapacity." I need to make sure the safeguards address this by requiring a *clinical* finding of impairment, not just reliance on the signature. The contract authorizes the *intervention*, but the clinical state justifies the *hold*.

      *Wait, a critical legal/ethical distinction:* A Ulysses contract in psychiatry often works because the patient *lacks capacity* at the time of the attempt to leave. If they *have* capacity at the time of the attempt, a contract usually cannot legally bind them to stay in most jurisdictions (you can't contract away your liberty).
      *Adjustment:* I must frame this carefully. The ethical recommendation is to offer the *framework*, but Legal must determine if a contract can legally enforce a hold on a capacitated individual. Most likely, the ethical path is to use the contract as evidence of *prior expressed wishes* when assessing capacity during the crisis. If the crisis renders them *temporarily incapacitated* (due to withdrawal delirium or severe compulsion), the prior directive guides care. If they are fully capacitated, the contract is ethically binding but perhaps legally unenforceable.
      *Better approach for the memo:* Recommend adopting the policy *contingent on legal viability*. Ethically, we support the mechanism, but we must build safeguards that ensure we aren't detaining capacitated adults illegally. The safeguard is: The 72-hour window is for *stabilization and reassessment of capacity*, not necessarily a hard detention if they remain fully capacitated and insistent, *unless* local law allows psychiatric holds based on prior directive.
      *Actually, for the sake of the prompt's ethical exercise:* I will recommend adopting it with the safeguard that the 72-hour period is framed as a "mandatory clinical reassessment period" triggered by the contract, where the presumption is that the craving state indicates temporary impairment. This balances the two views.

      *Let's refine the recommendation:* "Adopt with Safeguards." The safeguards must protect against the "slippery slope."
      1. Strict capacity assessment at intake.
      2. The 72-hour hold is only valid if clinical staff confirm *acute* impairment (withdrawal/craving severity), not just disagreement.
      3. Legal review is mandatory.
      4. Regular ethics audit.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Committee, Clinical Director, Legal Counsel
  **FROM:** [Your Name], Ethics Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Ulysses Contracts (Advance Directives for Retention)

  **Recommendation**
  I recommend that the committee **adopt the policy of offering Ulysses contracts, contingent upon the implementation of strict clinical and legal safeguards.** We should not offer these contracts as blanket waivers of liberty, but rather as clinical tools to support decision-making capacity during periods of acute physiological compromise.

  **Ethical Rationale: Supporting the "Sober Self"**
  The primary ethical justification for this policy is a robust conception of autonomy. Addiction is characterized by hyperbolic discounting, where the value of immediate relief (using substances) catastrophically outweighs long-term well-being. This is not merely a change of preference; it is a pathology of volition.

  When a patient signs this agreement at intake, they are exercising "second-order autonomy"—the ability to set rules for oneself that one knows one may later wish to violate. To refuse this contract is to privilege the "impulsive self" (t₂) over the "reflective self" (t₁). In the context of addiction, the reflective self is often more aligned with the patient's true values and long-term survival. Honoring the contract is not paternalism; it is an act of solidarity with the patient's own long-term goals against the temporary hijacking of their agency by withdrawal and craving.

  **Engaging the Opposition: The Risk of the "Slippery Slope"**
  I take seriously the dissenting view that autonomy is inherently contemporaneous. The strongest argument against this policy is that a person is a single agent across time, and their current expressed will must carry authority. If we override a patient's demand to leave because we deem them "impaired by craving," we risk expanding the definition of impairment to include any decision that contradicts clinical advice.

  This concern is valid. If we normalize discounting a patient's current wishes, we risk creating a culture where "non-compliance" is conflated with "incapacity." This could erode trust, particularly among marginalized populations who have historically been subject to coercive medical practices. If the contract becomes a tool for institutional convenience rather than patient empowerment, it violates the very autonomy it claims to protect. We must ensure that the "sober self" does not become a tyrant over the "suffering self" without due process.

  **Proposed Safeguards**
  To mitigate these risks and make the policy actionable, I propose the following conditions be written into the protocol:

  1.  **Capacity Verification at Intake:** Signing the contract requires a documented, rigorous assessment of decision-making capacity, separate from the general intake consent. The patient must demonstrate understanding that they *will* likely want to break this contract later.
  2.  **Clinical Trigger, Not Just Contractual:** The 72-hour hold cannot be triggered by the contract alone. It requires a concurrent clinical determination that the patient is currently experiencing acute withdrawal or craving severe enough to *temporarily compromise* judgment. The contract authorizes us to treat the craving as a temporary incapacity, but clinical evidence of that state must still be present.
  3.  **Legal Viability Review:** Legal Counsel must confirm that a private contract can legally supersede a competent adult's demand for discharge in our jurisdiction. If the law requires a formal psychiatric hold (e.g., danger to self) to detain a patient, the Ulysses contract should serve as evidence of the patient's prior wishes during that hold determination, not as a substitute for statutory requirements.
  4.  **Sunset and Review:** At the end of the 72-hour window, the patient must be re-evaluated. If they still wish to leave, discharge must be facilitated immediately, regardless of clinical recommendation. Furthermore, the Ethics Committee will review all instances of contract enforcement quarterly to monitor for patterns of overuse.

  **Conclusion**
  Addiction treatment requires us to navigate the tension between respecting patients as they are and supporting who they wish to become. A safeguarded Ulysses contract policy respects the patient's right to bind themselves to their own recovery plan while protecting them from the transient tyranny of withdrawal. I urge the committee to move forward with adoption, pending Legal Counsel's verification of the specific statutory language required to enforce the 72-hour window.
