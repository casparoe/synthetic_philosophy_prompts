          *   *Option 2 (Unified Constrained Max):* Drop (5). Admit satisficing is a heuristic for constrained maximizing.
          *   *Option 3 (Reason-Responsive):* Refine (3). It's not about "better," it's about "good enough given reasons."
      *   **Address (4):** Suggest that if (5) holds, (4) might be a category error. Ideal agents don't have "rationality" in the same sense; they have "omniscience."

