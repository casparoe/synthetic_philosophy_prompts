  8.  **Final Polish:** Structure clearly. Use philosophical terminology (consequentialism vs. procedural, monism vs. pluralism) but keep it accessible. Ensure the ranking is justified.

  **(Self-Correction on Ranking):** Actually, the tension between (4) and (5) is quite deep. If rationality is *essentially* bounded (as per (1) and (5)), then (4) is false or misleading. An ideal agent doesn't need rationality; they just need logic. But the "Smuggling" (2/3 vs 5) is more immediate for the paper's internal consistency. I will keep the Collapse Problem as #1.

