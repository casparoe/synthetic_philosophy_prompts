answer: |-
  # Q&A Prep Sheet: Rietdijk–Putnam Reconstruction

  **Talk Context:** 25-minute presentation + Long Q&A.
  **Core Thesis:** RP argument creates a dilemma for Moving Spotlight (MS) views without relying on transitivity-of-realness or block universe conclusions.
  **Audience:** Hostile/Expert (Eternalist, A-Theorist, Agnostic Metaphysicians, Relativist Physicist).

  ---

  ## The "Dreaded Question" (Hope Nobody Asks)
  **Question:** "Your argument relies on the global structure of Minkowski spacetime (Special Relativity). But we live in a General Relativistic universe where global inertial frames generally don't exist. Isn't your entire dilemma contingent on an idealized physics that doesn't actually describe our world?"
  *   **Asked by:** The Relativist Physicist or the Agnostic Metaphysician.
  *   **Why it's dangerous:** It bypasses your metaphysics and attacks the physical premise. If SR is only locally true, the global "dilemma" dissolves into local patches where a "now" might be definable.
  *   **Prep:** If asked, concede SR is an idealization but argue that *local* Lorentz invariance is sufficient to generate the problem for any view claiming a *global* privileged present. If the "spotlight" is only local, it's not a metaphysical present, it's just a causal horizon.
  *   **Fallback:** "That is a crucial limitation. My claim is conditional: *If* SR is the correct metaphysical guide for time, *then* this dilemma holds. I am arguing about the metaphysical implications of the structure we *take* to be fundamental, not claiming SR is the final word on gravity."

  ---

  ## Objection 1: The Transitivity Smuggle (Highest Damage Potential)
  **Likelihood:** High (Agnostic Metaphysicians & Eternalist).
  **Phrasing:** "You claim to avoid the standard transitivity-of-realness premise (if $x$ is real for $O_1$ and $O_1$ is real for $O_2$, then $x$ is real for $O_2$). But your dilemma seems to require comparing what is 'real' across different frames to show a contradiction. Aren't you just hiding the transitivity assumption in your definition of the Spotlight's 'unique now'?"

  **2-Minute Reply:**
  "I appreciate the precision. The standard RP argument uses transitivity to propagate reality from observer to observer until everything is real. I am not doing that. My argument targets the *internal commitments* of the Moving Spotlight view, not the transitivity of existence itself.
  The Spotlight theorist commits to a unique, objective 'present' that divides reality from non-reality. Special Relativity demonstrates there is no frame-invariant way to slice spacetime into such a unique present.
  My dilemma is structural:
  1.  If the Spotlight's 'now' tracks the relativistic simultaneity hyperplanes, it is frame-relative. But a frame-relative 'now' fails the Spotlight's own requirement for a *unique* metaphysical present. It collapses into a B-theory where 'now' is just an indexical.
  2.  If the Spotlight's 'now' is frame-invariant, it posits a physical structure (a privileged foliation) that SR explicitly says is undetectable and physically redundant.
  I don't need to say event $E$ is real for Observer A and therefore real for Observer B. I only need to show that the *concept* of a unique global present is incompatible with the *structure* of spacetime described by SR. The contradiction is between the metaphysics and the geometry, not between observers' reality relations."

  **Where this is soft:** If they press on whether "unique present" *requires* frame-invariance. Some sophisticated A-theorists argue for a "fragmentalist" view where reality is relative to frames without collapsing to B-theory.
  **Concede:** "I am assuming the Moving Spotlight view requires a *single* ontological status for the present, not fragmented ontologies."
  **Hold:** "Even with fragmentation, you lose the 'moving' aspect that does the metaphysical work of passage."

  ---

  ## Objection 2: The Verbal Dispute (Most Likely)
  **Likelihood:** Very High (A-Theorist).
  **Phrasing:** "This is just a verbal dispute about the word 'real'. You are defining 'real' as 'spacelike separated from an observer'. I define 'real' as 'present'. You haven't proven the present isn't unique; you've just defined it away by equating existence with the spacetime manifold."

  **2-Minute Reply:**
  "I want to deny that this is merely verbal. If this were just about the word 'real', we could stipulate definitions and move on. But there is a substantive disagreement about *truthmakers*.
  When I say 'Andromeda exists,' and you say 'Andromeda does not exist (it is not present),' we are disagreeing about what makes propositions about Andromeda true *now*.
  My argument shows that if you tie 'present' to physical simultaneity (to avoid magic), you get relativity of presentness. If you tie 'present' to a privileged frame (to keep uniqueness), you posit physics that isn't there.
  The dilemma isn't about the label 'real'; it's about the *cost* of your ontology. To maintain your definition, you must either accept that 'present' is relative (which undermines the motivation for A-theory) or accept a hidden variable (a privileged frame) that physics rejects. That is a substantive metaphysical cost, not a lexical confusion."

  **Where this is soft:** The A-Theorist can bite the bullet on the "hidden variable" (Privileged Frame) and claim physics is incomplete.
  **Concede:** "I cannot prove physics is complete. I am arguing from the best available physics."
  **Hold:** "Choosing to ignore the symmetry of SR for metaphysical reasons is a substantive choice, not a verbal one. It requires justification."

  ---

  ## Objection 3: Why Stop Short of the Block? (Ideological Challenge)
  **Likelihood:** High (Committed Eternalist).
  **Phrasing:** "You've admitted the dilemma forces the Spotlight theorist to either accept relativity of the present or a privileged frame. If they accept relativity of the present, they are effectively B-theorists. If they accept the privileged frame, they are fighting physics. So why don't *you* conclude the Block Universe is true? Why withhold the eternalist conclusion if the argument works?"

  **2-Minute Reply:**
  "Because the Rietdijk–Putnam argument establishes *co-existence*, not *fixedness*.
  Even if we accept that distant events are 'real' in the sense that they are part of the spacetime manifold, that does not entail that the future is ontologically settled or that determinism is true.
  The Block Universe often carries modal baggage: the idea that the future is 'already there' in a way that precludes openness. My reconstruction shows that the *topology* of time is B-like (no unique slice), but it remains silent on the *modal status* of those slices.
  I want to separate the geometry of time from the metaphysics of modality. One can accept that the future is 'real' in the sense of being part of the manifold without accepting that it is 'determined' in the sense of being causally fixed. My argument clears the ground for Eternalism, but it doesn't build the house."

  **Where this is soft:** Distinguishing "existential" commitment from "modal" commitment is notoriously difficult. If the future exists, in what sense is it open?
  **Concede:** "I grant that this distinction requires further defense regarding modality."
  **Hold:** "RP is an argument about simultaneity and ontology, not about causation or determinism. Don't conflate the map."

  ---

  ## Objection 4: Reifying Frames (Technical/Physics Challenge)
  **Likelihood:** Medium (Relativist Physicist).
  **Phrasing:** "You keep talking about 'frames' as if they are physical things that can be privileged or not. A frame is just a coordinate system, a piece of graph paper we lay over events. Physics doesn't select a frame because frames aren't physical. Your dilemma assumes frames are ontological competitors."

  **2-Minute Reply:**
  "You are absolutely right that a coordinate system is a mathematical tool. However, the *relations* defined by those frames correspond to physical causal structures.
  When I speak of a 'privileged frame,' I am shorthand for a 'privileged foliation of spacetime into spacelike hypersurfaces.' That is a geometric claim, not just a coordinate claim.
  If the Moving Spotlight theorist says 'There is a true present,' they are claiming there is a physical way to slice the manifold that corresponds to metaphysical reality. SR says the geometry of the manifold does not privilege any such slicing.
  So the dilemma stands: Either the 'slice' is just a coordinate choice (in which case 'present' is relative to the choice), or the 'slice' is a physical feature (in which case it breaks Lorentz invariance). I am not reifying the graph paper; I am asking if the drawing on the paper represents a physical boundary."

  **Where this is soft:** If the physicist insists that *no* foliation is physically meaningful, even locally, without matter fields.
  **Concede:** "I agree frames themselves aren't physical. I should speak of 'invariant foliations'."
  **Hold:** "But the metaphysician claims the 'present' is physical. So they must identify it with *something* in the physics. If not a foliation, what?"

  ---

  ## Strategic Notes for the Session

  **1. Distinguishing Verbal vs. Genuine:**
  *   **Verbal:** Disagreements about whether to use the word "exists" for future events. *Strategy:* Grant the terminology, pivot to truthmakers. "Call it 'exists' or 'is subsistent'; the question is whether propositions about it have a truth value now."
  *   **Genuine:** Disagreements about the structure of spacetime or the cost of positing hidden variables. *Strategy:* Stand firm. "Positing a privileged frame is a genuine physical cost, regardless of what we call it."

  **2. Managing the "Weak Point" (No Transitivity):**
  *   Do not get dragged into formal logic proofs during Q&A.
  *   Keep returning to the **structural mismatch**: "The metaphysics requires X (unique global now). The physics provides Y (relativity of simultaneity). X and Y are incompatible. How you resolve that is the dilemma."
  *   If pressed on *how* this avoids transitivity: "Transitivity is needed to spread reality from point to point. I am arguing that the *container* (spacetime) doesn't support the *divider* (the Spotlight) the metaphysician wants. I'm attacking the container's compatibility with the divider, not the contents' relation to each other."

  **3. Concessions to Make Up Front (Disarms Hostility):**
  *   "I am assuming SR is a reliable guide to metaphysical structure." (Appeases Physicist).
  *   "I am not claiming this proves determinism." (Appeases Agnostics).
  *   "I agree 'real' is a loaded term." (Appeases A-Theorist).

  **4. Holdings (Do Not Surrender):**
  *   The Dilemma is exhaustive (Relative vs. Invariant).
  *   The argument does not rely on transitivity of the "is real" relation.
  *   Moving Spotlight cannot have it both ways (Unique + Physical).

  **5. Body Language/Tone:**
  *   When the Eternalist presses you: Be collaborative. "I agree the pressure is there, but I want to isolate the geometric claim from the modal one."
  *   When the A-Theorist presses you: Be firm on costs. "You can maintain your view, but you must pay the price of a hidden frame."
  *   When the Physicist presses you: Be deferential but precise. "I defer to you on the math, but I am asking about the ontological interpretation of that math."
