answer: |-
  Your observation is astute and touches on a meta-philosophical nerve that many participants in the free will debate feel but rarely articulate. The fifty-year stalemate over Frankfurt-style cases (FSCs) and the Principle of Alternative Possibilities (PAP) is not merely a failure of imagination; it is a structural feature of the disagreement itself.

  Your working hypothesis is largely correct: the two sides are operating with divergent, pre-theoretical conceptions of **sourcehood** and **control**, and the cases function as Rorschach tests rather than arbiters. However, I would refine the diagnosis slightly. It is not just that they have different conceptions of sourcehood; it is that they are answering different **normative questions** under the guise of a single metaphysical one.

  Here is a diagnosis of the disagreement, an account of what progress would look like within this framework, and a proposal for what must change to break the impasse.

  ### 1. Diagnosis: A Clash of Frameworks, Not Facts

  The debate is not a standard empirical or logical dispute where shared premises lead to a convergent conclusion. It is a **framework disagreement**.

  **The Two Frameworks:**
  *   **The Actual Sequence View (Frankfurt/Compatibilist):** For this side, moral responsibility is essentially about *ownership*. Did the action issue from the agent's own psychology (desires, values, mechanisms) in the right way? If the actual sequence of events is unimpaired, the agent is the source. The presence of a counterfactual intervener is irrelevant because causation is actual, not counterfactual.
  *   **The Leeway View (PAP/Incompatibilist):** For this side, moral responsibility is essentially about *opportunity*. To be responsible is to have had a genuine open future. Even if the actual sequence is unimpaired, if the agent was metaphysically locked into one path (even by a dormant mechanism), they lacked the requisite control.

  **Why the Cases Fail to Decide:**
  FSCs are designed to isolate *alternative possibilities* from *actual causation*. But the intuition that "the agent is responsible in the Frankfurt case" relies on the Actual Sequence framework. The intuition that "the agent is not responsible because they couldn't do otherwise" relies on the Leeway framework.
  When a Frankfurtian presents a case, they are asking: *"Do you see that the actual sequence is normal?"*
  When a PAP defender responds with a "flicker," they are asking: *"Do you see that the modal landscape is constrained?"*

  They are talking past each other because they disagree on which feature (actual history vs. modal profile) is the truth-maker for responsibility. The "arms race" of case-building you describe is simply each side trying to force the other to look at the world through their lens. The Frankfurtian tries to hide the modal constraint; the PAP defender tries to magnify it. Neither can succeed because the disagreement is about which feature *matters*, not whether the feature exists.

  **The Shape of the Impasse:**
  The fact that the dialectic is an infinite refinement of thought experiments tells us that **thought experiments are the wrong tool for this job.** Thought experiments work best when there is agreement on the relevant variables. Here, the variables themselves (what counts as a "relevant alternative") are contested. The stalemate persists because both sides capture a deep, irreducible strand of our ordinary concept of responsibility. We care about ownership (Actual Sequence) *and* we care about fairness/openness (Leeway). FSCs force us to choose, but our intuitions refuse to.

  ### 2. What Would Count as Progress?

  If the disagreement is foundational, "progress" cannot mean one side refuting the other. Progress must be **taxonomic and explanatory**.

  **A. Distinguishing Concepts of Responsibility**
  Progress would look like abandoning the search for a single, unified concept of "moral responsibility." We should expect progress if the debate shifts from "Is PAP true?" to "Which *kind* of responsibility requires PAP?"
  *   **Attributability:** Is this action *mine*? (Does not require PAP; fits Frankfurt).
  *   **Accountability:** Am I *liable* to sanction? (May require PAP; fits traditional blame).
  *   **Eligibility:** Am I a candidate for reward/praise? (May require PAP).
  If participants explicitly state which "flavor" of responsibility they are discussing, the FSC debate dissolves. Frankfurt cases show you can have Attributability without PAP. PAP defenders show you cannot have full Accountability without PAP.

  **B. Mapping the Cost-Benefit Analysis**
  Progress would involve explicit acknowledgment of the theoretical costs of each position.
  *   **Frankfurtian Cost:** You must explain why "fairness" doesn't require alternative possibilities. You risk making responsibility compatible with manipulation (the "Manipulation Argument").
  *   **PAP Cost:** You must explain how alternative possibilities add value if they are never exercised (the "Intuition of Irrelevance"). You risk making responsibility incompatible with determinism (and perhaps causation).
  Progress is made when a philosopher says, "I accept PAP because the cost of denying it (losing the link between blame and fairness) is higher than the cost of accepting it (losing responsibility in a determined world)."

  **C. Shifting from Metaphysics to Normativity**
  The debate is framed as metaphysical ("*Could* they have done otherwise?"). Progress would look like framing it as normative ("*Ought* we to hold them responsible?").
  If the function of responsibility is moral communication (Strawson), PAP might be less crucial. If the function is retributive justice, PAP might be essential. Progress is defining the *practice* of responsibility before defining the *conditions* of responsibility.

  ### 3. What Must Change to Move Forward?

  If the current dialectic is a closed loop, breaking it requires changing the rules of engagement.

  **1. Abandon the "Knockdown Case" Strategy**
  Philosophers must admit that no FSC will ever be robust enough to override a committed PAP defender's intuition, and no Flicker strategy will ever be subtle enough to convince a committed Frankfurtian. The literature should stop treating FSCs as counterexamples and start treating them as **boundary markers**. They mark the border between Actual Sequence and Leeway theories. Acknowledging this turns the debate from a war of attrition into a map of logical space.

  **2. Address the "Smuggled Determinism" Head-On**
  The Dilemma Defense argues that FSCs presuppose determinism. This is often waved away, but it is the crux of the issue.
  *   *Change required:* Frankfurtians must explicitly argue why determinism (or causal necessity) is compatible with sourcehood, rather than trying to bypass it with counterfactual interveners.
  *   *Change required:* PAP defenders must explicitly argue why indeterminism adds *control* rather than just *randomness*.
  The debate needs to return to the core metaphysics of free will rather than hiding in the logic of counterfactuals. The FSC debate is a proxy war for the Compatibility Problem; it should be fought on that terrain directly.

  **3. Embrace Pluralism or Pragmatism**
  We must consider the possibility that "moral responsibility" is a **cluster concept** with no necessary and sufficient conditions.
  *   *Scenario A:* In some contexts (e.g., personal relationships), Actual Sequence is sufficient.
  *   *Scenario B:* In other contexts (e.g., criminal law), Leeway is required.
  Progress would be a contextualist theory of responsibility that explains *why* we require PAP in court but not in friendship. This validates both sides' intuitions without forcing a contradiction.

  **4. Empirical Constraints (With Caution)**
  You mentioned empirical questions about ordinary judgment. While experimental philosophy (X-Phi) cannot settle metaphysical truth, it can settle **conceptual coherence**.
  If ordinary people consistently judge Frankfurt cases differently based on how the "sign" is described, it suggests our concept of responsibility is sensitive to variables philosophers are ignoring. If ordinary judgments are fragmented (some say responsible, some don't), it supports the Pluralist/Cluster view. Using data to map the *structure* of our intuitions, rather than to vote on the truth, could break the reliance on armchair speculation.

  ### Conclusion: What the Shape Tells Us

  The shape of the impasse—an endless, refined arms race of intuition pumps—tells us that **moral responsibility is not a natural kind.**

  In science, when a debate persists despite refined measurement, we often find we are measuring two different things (e.g., mass vs. weight, or heat vs. temperature). In philosophy, when a debate persists despite refined cases, it suggests we are trying to unify two distinct normative demands.

  The Frankfurtian captures the demand for **agency** (I did it, it came from me).
  The PAP defender captures the demand for **justice** (I could have avoided the penalty).

  The debate continues because both demands are real and deeply human. The impasse exists because we are trying to satisfy both demands with a single metaphysical condition. Progress will not come from building a better Frankfurt case. It will come from admitting that "Moral Responsibility" is a label we paste over a complex negotiation between who we are (sourcehood) and what was open to us (leeway). To move forward, the debate must shift from "Which condition is necessary?" to "How do we balance these conditions in different spheres of human life?"

  Until then, the flickers will keep flickering, and the interveners will keep intervening, in a perfect, sterile equilibrium.
