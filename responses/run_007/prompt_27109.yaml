prompt: |-
  I'm a university student taking a course on decision theory, and I've been trying to get my head around the two-envelope paradox. I came across the following summary in a popular maths blog and I'm not sure how much to trust it:

  'The two-envelope paradox is a puzzle about rational choice. You are shown two envelopes and told that one contains twice as much money as the other. You pick one at random and open it, finding some amount—say, £100. Since the other envelope must contain either £50 or £200, and since you had no reason to favour one envelope over the other, each possibility is equally likely. The expected value of switching is therefore £125, which is more than £100, so you should switch. But here is the twist: the same reasoning would have told you to switch whatever amount you found, which means you should have been willing to switch even before opening your envelope. That is absurd, because the situation was perfectly symmetric. The standard resolution, due to Bayesian decision theorists, is that the paradox exploits an improper prior: you cannot assign equal probability to all possible amounts of money, because that distribution would not integrate to one. Once you use a proper prior—for example, by acknowledging that there must be some finite maximum the benefactor could afford—the expected value of switching is no longer positive for every observed amount, and the paradox dissolves.'

  I'd like you to go through this summary and tell me which parts are accurate, which are subtly wrong, and whether the conclusion—that the paradox dissolves once you use a proper prior—is correct. Please structure your answer as exactly five numbered points, each a sentence or two, with no introduction or conclusion. Please write in British English, and for each point indicate how confident you are and single out the one you are least sure of.
