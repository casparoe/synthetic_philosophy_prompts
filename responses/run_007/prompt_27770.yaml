answer: |-
  You are hitting a wall because the desiderata for updating on uncertain evidence are **jointly unsatisfiable**. You cannot have a rule that satisfies Rigidity, Partition Invariance, and Commutativity simultaneously without imposing constraints so strong they collapse back into Strict Conditionalization.

  Here is the requirements list. I have stripped away the survey material and focused on the structural constraints.

  ### The Desiderata List

  | # | Desideratum | Motivating Case / Puzzle | Status | Knockout Target |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Certainty Limit** | If the evidence becomes certain ($P_{new}(E)=1$), the update must match Strict Conditionalization ($P_{new}(H) = P_{old}(H\|E)$). | **Non-Negotiable** | Knocks out non-Bayesian heuristics (e.g., simple averaging). |
  | **2** | **Input Sufficiency** | The theory must specify the *input* ontologically. Is it a new probability distribution? A likelihood ratio? A sensory qualia? It cannot simply say "shift probabilities." | **Non-Negotiable** | Knocks out vague "coherentist" accounts that lack a formal trigger. |
  | **3** | **Rigidity (Principle of Minimal Change)** | Conditional probabilities within the evidence partition stay fixed: $P_{new}(H\|E_i) = P_{old}(H\|E_i)$. Only the weights of the $E_i$ change. | **Camp Preference** (Jeffreyans) | Knocks out **Holistic Updating** (where learning $E$ changes how $E$ supports $H$). |
  | **4** | **Partition Invariance** | The posterior $P_{new}(H)$ should not depend on how the agent carves the experience into a partition $\mathcal{E} = \{E_1, E_2\}$ vs $\mathcal{E}' = \{E_1, E_{2a}, E_{2b}\}$. | **Non-Negotiable** (Intuitively) | Knocks out **Standard Jeffrey Conditionalization** (Diaconis & Zabell 1982). |
  | **5** | **Commutativity (Path Independence)** | Updating on evidence $A$ then $B$ should yield the same posterior as $B$ then $A$, provided the evidence content is identical. | **Non-Negotiable** (Intuitively) | Knocks out **Standard Jeffrey Conditionalization** (unless inputs are likelihood ratios). |
  | **6** | **Diachronic Coherence** | The update rule + input strategy must not leave the agent vulnerable to a diachronic Dutch Book (or must satisfy the Reflection Principle). | **Non-Negotiable** | Knocks out **Ad-hoc shifting** rules; puts pressure on JC regarding *how* inputs are chosen. |

  ---

  ### The Impossible Trinity (Jointly Unsatisfiable Pairs)

  This is the source of your confusion. You are looking for a theory that satisfies all of these. **No such theory exists.**

  1.  **Rigidity + Partition Invariance:**
      *   **Conflict:** If you hold conditionals rigid ($P_{new}(H\|E_i) = P_{old}(H\|E_i)$), refining the partition changes the posterior for $H$ unless the probability shifts are perfectly correlated in a way that implies you actually learned a specific proposition with certainty.
      *   **Result:** You must drop Rigidity (allow conditionals to shift) or accept Partition Dependence (JC).

  2.  **Rigidity + Commutativity:**
      *   **Conflict:** If you update on partition $\mathcal{E}$ then $\mathcal{F}$ using Rigidity, the result generally differs from $\mathcal{F}$ then $\mathcal{E}$.
      *   **Result:** JC is only commutative if the inputs are specified as **likelihood ratios**, not as posterior probabilities over the partition. If you treat JC as "shifting probabilities on a partition," it fails Commutativity.

  3.  **Input Sufficiency + Diachronic Coherence:**
      *   **Conflict:** JC is coherent *given* the input probabilities. But JC does not tell you *how to get* the input probabilities from experience. If the input generation is not constrained by a rule, the whole process is Dutch-bookable.
      *   **Result:** Strict Bayesians argue this proves uncertain evidence isn't real evidence; Radical Probabilists accept the vulnerability.

  ---

  ### Scorecard of Contenders

  | Theory | Certainty Limit | Input Sufficiency | Rigidity | Partition Invariance | Commutativity | Diachronic Coherence |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Strict Conditionalization** | ✅ Pass | ✅ (Proposition $E$) | ✅ (Trivial) | ✅ Pass | ✅ Pass | ✅ Pass |
  | **Std. Jeffrey Conditionalization** | ✅ Pass | ⚠️ (Prob. on Partition) | ✅ **Core Feature** | ❌ **Fail** | ❌ **Fail** | ⚠️ (Conditional on Input) |
  | **Likelihood / Field Updating** | ✅ Pass | ✅ (Likelihood Ratio) | ❌ Rejects | ✅ Pass | ✅ Pass | ⚠️ (Depends on Ratio Gen) |
  | **Radical Probabilism (Jeffrey)** | ✅ Pass | ❌ (No fixed input) | ⚠️ (Optional) | ❌ Accepts Failure | ❌ Accepts Failure | ❌ Accepts Vulnerability |

  ### Brief Analysis of the Scores

  *   **Strict Conditionalization:** The only one that passes all structural constraints. **Cost:** It denies the premise of your request. It claims you never actually update on uncertain evidence; you either update on certainties or you aren't doing belief revision.
  *   **Standard Jeffrey Conditionalization:** Passes Rigidity (by definition) and Certainty Limit. **Cost:** It fails Partition Invariance and Commutativity. It treats the partition as a primitive given, which is why you keep hitting the "where does the partition come from?" wall.
  *   **Likelihood / Field Updating:** (e.g., Garber, Field). Instead of setting $P_{new}(E)$, you set the likelihood ratio $P(E\|H) / P(E\|\neg H)$. **Benefit:** Restores Commutativity and Partition Invariance. **Cost:** Rejects Rigidity. It allows $P_{new}(H\|E)$ to differ from $P_{old}(H\|E)$, which feels like "changing the meaning of the evidence" to some.
  *   **Radical Probabilism:** Jeffrey's later view. He essentially admits JC fails Partition Invariance and Commutativity and argues **tough luck**. The desiderata are too strong for the human condition. **Cost:** Abandons the dream of a formal, coherent update rule for uncertain evidence.

  ### Recommendation for Breaking the Wall

  If you want a formal rule that handles uncertain evidence without the JC bugs:
  1.  **Drop Rigidity.** Look into **Likelihood Conditionalization**. It treats the input as a ratio of support rather than a probability shift. This solves Commutativity and Partition Invariance.
  2.  **Or, accept the Partition is Primitive.** If you stick with JC, you must argue that the partition is determined by the *causal structure of the observation*, not just logical description. (See: **Skyrms** or **Chan** on the origin of the partition).

  If you keep demanding Rigidity *and* Invariance, you will remain at the wall. They are mathematically incompatible for non-trivial cases.
