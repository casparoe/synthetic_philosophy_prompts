prompt: |-
  I'm an economist—mechanism design, game theory, the usual toolbox: Bayesian games, correlated equilibrium, types, commitment, pre-play communication, Aumann's agreeing-to-disagree stuff, all that. I keep running into people in the rationalist/decision-theory orbit talking about "evidential cooperation in large worlds" or "acausal trade," and every time I try to read the original material I bounce off hard. It feels like they're gesturing at something my framework already handles (correlated equilibrium? common priors? cheap talk?) but then they insist it's different and spookier because the agents don't causally interact and might not even share a world.

  So here's what I want. Restate the core argument for evidential cooperation in large worlds—the idea that you should cooperate with agents you'll never meet and whose payoffs don't depend on your action, because your decision gives you evidence about what they're doing—in my vocabulary. Bayesian games, correlated equilibrium, types, the distinction between correlation and causation in a game, commitment devices, cheap talk, the whole toolkit. Don't just say "oh it's like a correlated equilibrium" and call it done; actually do the translation step by step. I know my framework, you don't need to explain it to me.

  Then the part I actually care about: give me the residue report. Which pieces of their claim map cleanly onto my vocabulary, which ones you had to stretch or fudge, and which ones have no counterpart at all. And then tell me what you think is going on: are they just reinventing correlated equilibrium with weirder language, or is there a genuine conceptual gap between what my framework can express and what they're pointing at? If there's a gap, whose problem is it—my framework missing something, or their claim being less coherent than it sounds?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Professional Economist (Mechanism Design, Game Theory). Knows Bayesian games, correlated equilibrium (CE), types, commitment, cheap talk, Aumann's agreement theorem, etc.
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL) / Acausal Trade (rationalist/decision theory community, e.g., MIRI, FDT/EDT proponents).
      *   **Problem:** The user finds the rationalist literature impenetrable/spooky. It *feels* like standard game theory but claims to be different (acausal, no interaction, different worlds).
      *   **Task:**
          1.  Translate the core argument of ECL/Acausal Trade into standard economic/game-theoretic vocabulary (step-by-step, no hand-waving).
          2.  Provide a "Residue Report": What maps cleanly? What requires stretching? What has no counterpart?
          3.  Verdict: Is this just CE with weird language, or is there a genuine conceptual gap? If a gap, whose fault is it (framework limitation vs. incoherent claim)?

  2.  **Deconstruct "Evidential Cooperation in Large Worlds" (ECL) / Acausal Trade:**
      *   *Core Idea:* I decide to cooperate. My decision algorithm is similar to yours (even if we are far apart/in different universes). Therefore, my decision provides *evidence* about your decision. If I cooperate, it's likely you cooperate. Thus, expected utility maximization (specifically Evidential Decision Theory - EDT) dictates cooperation, even without causal links.
      *   *Key Assumptions:* Logical correlation between decision algorithms, large universe/multiverse (many copies or similar agents), subjective uncertainty about which copy/type one is.
      *   *Decision Theory:* EDT (Evidential) vs. CDT (Causal). Standard econ assumes CDT (mostly), or treats correlation via CE.

  3.  **Translation Strategy (Econ Vocabulary):**
      *   *Agents:* Players in a game.
      *   *Worlds/Universes:* States of the world ($\omega \in \Omega$).
      *   *Copies/Instantiations:* Types ($t_i \in T_i$).
      *   *Correlation:* Common prior + Correlated Equilibrium device (or just correlation in types).
      *   *Acausal Link:* Correlation in strategies induced by correlation in types/algorithmic identity.
      *   *Decision Rule:* Bayesian Nash Equilibrium (BNE) or Correlated Equilibrium (CE).
      *   *The "Spooky" Part:* The correlation isn't mediated by a signal or a past common cause in the *causal* sense, but by logical identity or symmetry. In econ, this is handled by the *type space* and *common prior*.

  4.  **Drafting the Translation (Step-by-Step):**
      *   *Setup:* Define a Bayesian Game. Players $N$, States $\Omega$, Types $T_i$, Priors $P$, Actions $A_i$, Utilities $u_i$.
      *   *The "Large World":* This is just a specific structure of $\Omega$ and $T$. It implies there are many "instances" of agents. Let's model "you" and "me" as draws from a distribution of types.
      *   *The "Acausal Link":* In standard game theory, correlation comes from a $\sigma$ (correlation device) or common history. In ECL, it comes from *logical identity*. If we run the same algorithm on the same input, we output the same action.
      *   *Mapping:* This looks like a restriction on the strategy space. $\sigma_i(t_i) = \sigma_j(t_j)$ if $t_i, t_j$ are "logically equivalent."
      *   *Equilibrium:* Instead of BNE (where I optimize given your strategy), ECL asks me to optimize given that *my choice updates my belief about your choice*. This is EDT. In Econ, we usually maximize $E[u | do(action)]$ (Causal). ECL maximizes $E[u | action]$ (Evidential).
      *   *Reinterpretation:* Can we model EDT as CDT with a specific type correlation? Yes, if we treat the "algorithm" as the type and assume perfect correlation between identical algorithms.

  5.  **Developing the Residue Report:**
      *   *Clean Maps:*
          *   "Large World" $\rightarrow$ State space with high cardinality/measure.
          *   "Similar Agents" $\rightarrow$ Correlated Types / Common Prior.
          *   "Cooperation" $\rightarrow$ Pareto-improving Correlated Equilibrium.
          *   "Pre-commitment" $\rightarrow$ Strategy as a function of type (Harsanyi transformation).
      *   *Stretched/Fudged:*
          *   "Acausal" $\rightarrow$ Econ requires a probability space. If the correlation is "logical" rather than "probabilistic," standard measure theory gets weird. (Logical Uncertainty).
          *   "Decision gives evidence" $\rightarrow$ Standard CDT says $P(Y|do(X)) = P(Y)$. ECL says $P(Y|X) \neq P(Y)$. To map this, we need to embed the decision process *into* the state space (types).
      *   *No Counterpart:*
          *   *Logical Uncertainty:* Standard econ assumes logical omniscience. I know my algorithm's output once I decide. ECL assumes I am uncertain about the output of my *own* computation until I run it, and that uncertainty is correlated with yours. This is the big one.
          *   *Identity across worlds:* Standard econ assumes one actual state. ECL (often) implies a multiverse where all states are "real" in some sense (modal realism), affecting how we sum utility.

  6.  **Formulating the Verdict:**
      *   *Is it just CE?* Mostly, yes, *if* you accept the correlation in types.
      *   *The Gap:* The gap is **Logical Uncertainty** and the **Ontology of the State Space**.
      *   *Whose Problem?*
          *   Econ's limitation: Standard game theory assumes agents know their own mapping from type to action (or treats it as a choice variable without uncertainty about the *computation*). It doesn't handle "I don't know what my algorithm outputs yet, but I know it matches yours."
          *   Rationalist's incoherence: They often treat logical implications as probabilistic events without a rigorous probability measure over logical sentences (though logical induction is trying to fix this).
      *   *Conclusion:* It's Correlated Equilibrium + Logical Uncertainty + Utility Aggregation across Modal Realities. The "acausal" label is marketing for "correlation without causal history."

  7.  **Refining the Tone:**
      *   Respectful, peer-to-peer.
      *   No condescension towards either field.
      *   Precise terminology (Harsanyi, CE, CDT vs. EDT).
      *   Acknowledge the "spookiness" but demystify it.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, is ECL exactly CE?* In CE, a mediator suggests actions. In ECL, the "mediator" is the logical structure of the decision algorithm.
      *   *Key distinction:* In BNE, I take your strategy as fixed. In ECL, I treat my decision as *updating* the probability of your decision. This is the EDT vs CDT split.
      *   *How to model EDT in Econ?* You can model EDT as CDT on a transformed game where the "state" includes the output of the decision algorithm. This requires the agent to be uncertain about their own action *ex-ante*. This violates standard rationality assumptions (I know what I choose).
      *   *Resolution:* The "Program Equilibrium" literature (Tennenholtz, Kalai) handles this better than standard Nash. I should mention Program Equilibrium. It's the closest econ cousin.

  9.  **Final Polish:** Structure into "The Translation," "The Residue Report," and "The Verdict." Ensure the distinction between Causal and Evidential is clear in terms of conditional probabilities vs. interventional probabilities.

  **(Self-Correction Note):** Make sure to emphasize the *Large World* aspect. Why does size matter? Because it increases the measure of copies, making the correlation payoff dominate the local defection payoff. In econ terms, it's about the weight of the states in the expected utility integral.

  10. **Final Output Generation** (Proceed to draft response based on these thoughts).
answer: |-
  This is a translation problem between two dialects of decision science. You speak **Causal Game Theory** (CDT, Nash, Harsanyi types), and they speak **Evidential/Logical Decision Theory** (EDT, FDT, logical correlation).

  The friction arises because standard economics assumes **logical omniscience** and **causal separation**, whereas the rationalist framework assumes **logical uncertainty** and **acausal correlation via algorithmic identity**.

  Here is the translation of Evidential Cooperation in Large Worlds (ECL) into your vocabulary, followed by the residue report and the verdict.

  ---

  ### Part 1: The Translation
  **Goal:** Map the ECL argument into a Bayesian Game framework.

  #### 1. The Setup: A Bayesian Game with Correlated Types
  Let $G = \langle N, \Omega, \{T_i\}, \{A_i\}, \{u_i\}, P \rangle$ be a Bayesian game.
  *   **Players ($N$):** You and the "other" agent (who may be in a distant galaxy or a counterfactual branch).
  *   **States ($\Omega$):** The "Large World." This is not just one universe, but a measure space of possible universes (or locations within a vast universe).
  *   **Types ($T_i$):** This is the crucial translation. In standard econ, a type captures private information. In ECL, a type captures the **decision algorithm** instantiated in the agent.
      *   If you and the other agent run the same source code (or sufficiently similar heuristics), you are drawn from a **correlated type distribution**.
      *   Let $t_1$ be your type and $t_2$ be theirs. ECL posits $P(t_1 = t_2) \approx 1$ (or sufficiently high), not because of a common causal past, but because of **logical identity**.
  *   **Prior ($P$):** A common prior over $\Omega \times T$. The "Large World" assumption implies the measure of states where copies of you exist is non-negligible.

  #### 2. The "Acausal" Link: Program Equilibrium
  In standard Nash/BNE, you optimize $E[u_i(a_i, \sigma_{-i}(t_{-i})) | t_i]$. You treat $\sigma_{-i}$ as fixed.
  In ECL, the claim is that your choice of action $a_i$ is *logically entangled* with $a_{-i}$.

  To model this in your framework, you need **Program Equilibrium** (Tennenholtz 2004; Kalai et al. 2010).
  *   Instead of choosing $a_i \in A_i$, players submit programs $p_i: T_i \to A_i$.
  *   The programs read each other's source code.
  *   **The ECL Constraint:** If $p_1 \equiv p_2$ (logical identity), then $p_1(t) = p_2(t)$ for all $t$.
  *   Therefore, choosing a strategy $\sigma$ is not just picking a row in the payoff matrix; it is picking a function that *simultaneously* determines the output of all agents running that function.

  #### 3. The "Evidential" Update: Conditioning on Action
  Standard CDT (your default) uses the *do*-operator:
  $$ \max_{a} \sum_{\omega} P(\omega) \cdot u(a, \text{outcome}(\omega, \text{do}(a))) $$
  Here, $P(\text{other cooperates} | \text{do}(I \text{ cooperate})) = P(\text{other cooperates})$. Your action does not causally influence theirs.

  ECL uses EDT conditional probability:
  $$ \max_{a} \sum_{\omega} P(\omega | a) \cdot u(a, \text{outcome}(\omega, a)) $$
  Here, $P(\text{other cooperates} | I \text{ cooperate}) > P(\text{other cooperates})$.

  **Translation:** To make this valid in your framework, you must move the **decision process itself into the state space**.
  *   Let the state $\omega$ include the output of the decision algorithm.
  *   You are uncertain about your own action *ex-ante* (logical uncertainty).
  *   When you "decide," you are not causing the action; you are **observing** the output of your type's algorithm.
  *   Because types are correlated, observing your output updates the posterior probability of their output.

  #### 4. The Payoff: Aggregation Across Measures
  Why cooperate if payoffs don't depend on your action?
  *   **Standard Econ:** $E[U] = \sum P(\omega) u(\omega)$. If $u$ doesn't depend on $a$ in causal worlds, $a$ doesn't matter.
  *   **ECL:** The "Large World" means there are many $\omega$ where copies of you exist.
  *   If you defect, you defect in *all* logically correlated instances. If you cooperate, you cooperate in all.
  *   The "Payoff" is the **sum of utilities across all instantiations weighted by their measure**.
  *   So, $U_{total} = \int_{\Omega} u(\omega, \sigma(t(\omega))) d\mu(\omega)$.
  *   Even if causal impact is zero in any single $\omega$, the correlation means your choice of $\sigma$ switches the outcome for a large measure of $\omega$ simultaneously.

  ---

  ### Part 2: The Residue Report

  Here is where the translation holds, where it stretches, and where it breaks.

  #### 1. Clean Mappings (The "Boring" Stuff)
  *   **Correlated Equilibrium:** ECL is effectively an argument for selecting a specific, Pareto-optimal Correlated Equilibrium. The "correlation device" is the logical structure of the decision algorithm.
  *   **Common Priors:** ECL relies heavily on the Common Prior Assumption. If you don't share a prior over the distribution of algorithms in the multiverse, the correlation breaks.
  *   **Pre-play Communication:** "Acausal trade" is functionally identical to a binding contract signed *ex-ante* behind a veil of ignorance (Harsanyi), where the "contract" is enforced by logical necessity rather than a court.

  #### 2. Stretched Concepts (The "Fudge" Factors)
  *   **Types as Algorithms:** In standard econ, a type is private information. In ECL, a type is a *computation*. Treating a computation as a random variable drawn from a distribution requires **Logical Uncertainty**. Standard Bayesian agents are logically omniscient (if I know my code and input, I know my output). ECL requires agents to be uncertain about logical truths (the output of their own code) until they "compute" them.
  *   **The State Space ($\Omega$):** In econ, $\Omega$ represents empirical uncertainty (is it raining?). In ECL, $\Omega$ includes **modal uncertainty** (which mathematical universe is actualized?). Integrating utility over "possible worlds" that are all equally real (modal realism) stretches the standard interpretation of probability as frequency or subjective belief about *the* actual world.
  *   **Intervention vs. Conditioning:** To make EDT work in a CDT framework, we had to move the action into the state space. This violates the standard assumption that the agent controls the action $a$ directly. It re-frames "choosing" as "learning what your algorithm outputs."

  #### 3. No Counterpart (The "Spooky" Stuff)
  *   **Logical Causality:** This is the big one. Your framework has **Causal** links (structural equations) and **Statistical** links (correlation). ECL posits a third category: **Logical** links. $A$ does not cause $B$, nor is there a common cause $C$. Rather, $A$ and $B$ are distinct physical instantiations of the same abstract function $f(x)$. Standard measure theory does not have a native operator for "logical entailment between spatially separated events."
  *   **Subjunctive Dependence:** This is the rationalist term for the above. It means "If I *were* to choose X, then (counterfactually) the output of that identical algorithm elsewhere *would be* X." Standard counterfactuals (Lewis/Stalnaker) are based on causal closeness. Subjunctive dependence is based on **logical closeness**. Your framework lacks a metric for logical distance between agents.

  ---

  ### Part 3: The Verdict

  **Are they just reinventing Correlated Equilibrium with weirder language?**

  **Mostly, yes.** But with one critical caveat that exposes a genuine gap in your framework.

  **1. The "It's just CE" Argument:**
  If you treat the "logical correlation" as simply a very strong correlation in the type space (common prior over algorithms), then ECL collapses into a standard argument for Correlated Equilibrium.
  *   *Why cooperate?* Because you are playing a CE where the correlation device is "logical identity."
  *   *Why "acausal"?* Because the correlation device isn't a mediator or a past common cause; it's the abstract structure of mathematics. But for the purpose of expected utility maximization, **correlation is correlation**. If $P(Cooper_{them} | Cooper_{me}) = 0.99$, CDT and EDT yield the same result *provided* you model the correlation in the types.

  **2. The Genuine Gap: Logical Uncertainty & Ontology**
  The gap is not in the game theory; it is in the **decision theory and ontology**.
  *   **Econ's Blind Spot:** Standard economics assumes **Logical Omniscience**. You know your utility function and your strategy mapping. You cannot be surprised by your own calculation. ECL requires a theory of **Logical Uncertainty** (probability distributions over logical statements/algorithm outputs). Your framework treats the agent as a black box that outputs a best response. ECL treats the agent as a white box (source code) that is being debugged in real-time.
  *   **The "Large World" Ontology:** Standard econ assumes one realized state $\omega^*$. ECL (often) assumes a Tegmark Level IV multiverse where all consistent mathematical structures exist. The "Expected Utility" in ECL is an integral over *all* possible worlds weighted by measure, not a belief about which world is *actual*. This changes the normalization of utility.

  **3. Whose Problem Is It?**

  *   **It is primarily the Rationalists' burden of proof.** They are making a positive claim ("You should cooperate") based on a metaphysical premise ("Logical correlations act like causal probabilities") that lacks a rigorous axiomatic foundation comparable to Savage or von Neumann-Morgenstern. They are using "probability" to describe logical implication, which is category confusion unless formalized via Logical Induction (which is still nascent).
  *   **However, it is secondarily Economics' limitation.** By assuming logical omniscience, standard game theory cannot model agents who reason about their own source code. This prevents econ from analyzing scenarios where agents are transparent to each other (or to themselves). The "Program Equilibrium" literature exists but is niche.

  **Summary:**
  ECL is **Correlated Equilibrium** + **Logical Uncertainty** + **Modal Realism**.
  *   Strip away the Modal Realism (assume one world), and it's just CE with high type correlation.
  *   Strip away the Logical Uncertainty (assume agents know their output), and the "evidential" link vanishes, reverting to CDT (Defect).
  *   The "Spookiness" comes from insisting that Logical Uncertainty is a valid domain for probabilistic reasoning.

  **Recommendation:**
  Treat their claims as **Correlated Equilibrium arguments where the correlation coefficient is derived from algorithmic similarity rather than causal history.** If you accept the premise that "algorithmic similarity induces probabilistic correlation in actions," the rest is standard mechanism design. If you reject that premise (because you are a Causal Decision Theorist who denies logical uncertainty), then their argument fails at the axioms, not the game theory.

  They aren't discovering new math; they are applying standard decision theory to a state space that includes logical facts as random variables. Whether that is valid is a philosophical question, not an economic one. But within *their* assumed ontology, the math checks out as a form of Program Equilibrium.
