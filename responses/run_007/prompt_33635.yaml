answer: |-
  # Which Epistemology of Knowledge Do You Actually Hold?

  **Instructions:** Read each case carefully. Select the option that best matches your intuitive judgment about whether the subject *knows* the proposition in question. Do not worry about theoretical consistency; answer based on your immediate verdict on the situation described.

  ### The Questions

  **1. The Morning Hand**
  Elena is sitting at her desk in good light. She looks down and sees her own hand clearly. She forms the belief: "I have a hand." There is no reason for her to suspect anything is wrong with her vision or the world.
  *   **A.** Elena knows she has a hand.
  *   **B.** Elena does not know she has a hand.

  **2. The Zoo Enclosure**
  Marcus is at the zoo standing in front of an enclosure labeled "Zebra." He sees a black-and-white striped equine animal. He forms the belief: "That animal is a zebra." However, Marcus has not checked whether the zoo might disguise mules as zebras for an exhibit, though there is no specific rumor that they do.
  *   **A.** Marcus knows it is a zebra, and he also knows it is not a cleverly painted mule.
  *   **B.** Marcus knows it is a zebra, but he does not know it is not a cleverly painted mule.
  *   **C.** Marcus does not know it is a zebra.

  **3. The Fake Facades**
  Julie is driving through a rural county. Unbeknownst to her, the locals have erected many papier-mâché barn facades that look exactly like real barns from the road. There is only one real barn in the county. Julie happens to look directly at the one real barn and forms the belief: "That is a barn."
  *   **A.** Julie knows it is a barn.
  *   **B.** Julie does not know it is a barn.

  **4. The High-Stakes Deposit**
  Sam and Alex both have the same evidence: they were at the bank two weeks ago on a Saturday and saw it was open.
  *   **Case 1 (Sam):** Sam needs to deposit a check, but it is not urgent. If he gets it wrong, it's a minor inconvenience. Sam says, "I know the bank is open tomorrow."
  *   **Case 2 (Alex):** Alex must deposit a check to avoid a mortgage default. If he gets it wrong, he loses his house. Alex says, "I know the bank is open tomorrow."
  *   **A.** Sam knows, and Alex knows.
  *   **B.** Sam knows, but Alex does not know.
  *   **C.** Neither Sam nor Alex knows.

  **5. The Philosophical Seminar**
  Consider Elena from Question 1 (who sees her hand).
  *   **Context 1:** Elena is chatting with a friend about lunch plans. She says, "I know I have a hand."
  *   **Context 2:** Elena is in a philosophy seminar discussing whether we could be brains in vats. The professor asks, "Do you know you have a hand?" Elena says, "I know I have a hand."
  *   **A.** Elena's claim is true in Context 1, but false in Context 2.
  *   **B.** Elena's claim is true in both contexts.
  *   **C.** Elena's claim is false in both contexts.

  **6. The Crossed Stakes**
  Taylor is a subject who needs to deposit a check to avoid losing their house (High Stakes). Taylor has the same evidence as Sam in Question 4 (was at the bank two weeks ago).
  Jordan is an attributor who is assessing Taylor. Jordan is in a Low Stakes situation (just curious) and is speaking in a casual context where skeptical possibilities are not mentioned. Jordan says: "Taylor knows the bank is open."
  *   **A.** Jordan's statement is True (Taylor knows).
  *   **B.** Jordan's statement is False (Taylor does not know).

  **7. The Lottery Ticket**
  Riley holds one ticket in a fair lottery with ten million tickets. The draw has not happened yet. Riley believes: "My ticket will lose." Riley's only evidence is the mathematical odds.
  *   **A.** Riley knows the ticket will lose.
  *   **B.** Riley does not know the ticket will lose.

  **8. The Skeptical Entailment**
  Consider Elena from Question 1 again. If Elena knows she has a hand, she must not be a disembodied brain in a vat being fed experiences of hands.
  *   **A.** Elena knows she has a hand, and therefore she knows she is not a brain in a vat.
  *   **B.** Elena knows she has a hand, but she does not know she is not a brain in a vat.
  *   **C.** Elena does not know she has a hand, so the question is moot.

  ---

  ### Scoring Key

  Assign points to each of the six epistemological profiles based on your answers. Tally the total for each column. The profile with the highest score is your dominant position.

