prompt: |-
  Hey, I'm a software engineer with no formal philosophy background, so go easy on the jargon. I've gone down a rabbit hole on the 'torture vs dust specks' thought experiment — the one where you choose between one person being tortured for fifty years and some absurdly huge number of people each getting a tiny speck of dust in their eye. I want to build a small quiz for my friends that sorts them by what they actually answer about cases, not by which position sounds nice to them. Could you write it?

  I'd like eight to ten questions, each a concrete trade-off with two or three options. Please work in at least these cases: the classic speck-vs-torture one; a version where the same total number of specks is dumped on one person instead of spread across many; a version with a mid-level harm (say a broken arm) against a much bigger number of specks; a version where the tiny harm is repeated thousands of times on a single person over a lifetime; and a question about whether any number of harms so small the person never notices them can outweigh a real harm. The questions should force people to reveal whether they think harms to different people can be summed at all, whether one serious harm is just worse than any pile of small ones, whether there's a cut-off below which small harms count for nothing, and whether the distribution of harms matters.

  Then give me a scoring key that maps answer patterns onto positions. I don't know the proper labels, but I'm picturing something like: a utilitarian-style aggregationist view; a view where one serious harm always outranks any pile of small ones no matter how big (I think people call that lexical priority, but whatever); a threshold view; a distribution-sensitive view; and maybe a weird one where your pairwise answers don't chain together into a single consistent ranking. Build it from the logical space first — the questions and the combinations of answers they allow — and only then locate the actual positions in that space. Flag any combinations nobody seems to occupy and say whether that's because they're incoherent, merely unattractive, or just unexplored. Also flag any two positions the quiz can't seperate, and don't put in a question that just asks 'are you a utilitarian?'.

  And please write it all in British English. Cheers.
