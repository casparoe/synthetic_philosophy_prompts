      3.  **The Middle Ground:** 1 Broken Arm vs. $10^{100}$ Specks (spread across people).
      4.  **The Ghost Harm:** 1 Torture vs. $10^{100}$ Sub-perceptual harms (neural blips, never noticed).
      5.  **Concentration:** 1 Person gets 1,000,000 Specks vs. 1,000,000 People get 1 Speck.
