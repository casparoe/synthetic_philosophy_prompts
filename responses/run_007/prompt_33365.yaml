      *   *Key Concept:* Natural Law/Reason vs. Artificial Corruption.
      *   *Explanation:* The Tupinamba are closer to the "laws of nature." Europeans are corrupted by artifice.
      *   *What to give up:* Strict cultural relativism.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   Make sure not to overstate Montaigne's universalism. He is still a skeptic. But in this essay, he uses "nature" as a benchmark.
      *   Clarify that "barbarous" means "wild/untamed" vs. "corrupted." The Tupinamba are "wild" but honest; Europeans are "civilized" but deceitful/cruel.
      *   The contradiction dissolves if the standard is *human nature/reason*, not *custom*.

  6.  **Drafting the text:**
