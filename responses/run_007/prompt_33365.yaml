answer: |-
  You should reject **Step 1**. Your interpretation assumes Montaigne is a strict cultural relativist who believes no outside standard exists. However, Montaigne's target is not judgment itself, but *ethnocentrism*—the bias that equates "different" with "inferior."

  Montaigne does rely on a standard beyond custom: **Reason and Nature**. He argues that the Tupinamba live closer to the "laws of nature," uncorrupted by the artifice of civilization. Their cannibalism, while shocking, is consistent with their code of honor and vengeance. It is rational within their framework of natural justice.

  Conversely, he condemns European cruelty not merely because it is different, but because it violates natural reason. Torturing prisoners or massacring others over religious doctrine is, for Montaigne, irrational and artificial. It stems from corruption, not nature. Thus, he judges both cultures against the same universal benchmark: fidelity to natural human reason.

  The contradiction dissolves because the standard isn't "our custom vs. their custom," but "natural reason vs. artificial corruption." The Tupinamba are "savages" only in being untamed; Europeans are "barbarous" in being morally degraded.

  To keep both his defense of the cannibals and his attack on European cruelty, you must give up the claim that Montaigne denies all universal standards. You cannot maintain strict relativism. Instead, you must accept that Montaigne believes some practices align better with human nature than others. This sacrifices the radical "no outside standard" claim but preserves the humanist critique. The essay argues that we lack the *authority* to judge based on prejudice, not that we lack the *capacity* to judge based on reason. By abandoning strict relativism, you retain the essay's moral force without logical inconsistency.
