      *   Explain Montaigne's actual position: Critique of ethnocentrism, not endorsement of relativism.
      *   Define the standard: Reason/Nature.
      *   Explain how this saves both claims: Tupinamba act according to natural vengeance; Europeans act according to corrupted zeal.
      *   State the cost: Give up strict relativism.

  7.  **Word Count Management:**
      *   Keep it tight. Avoid long quotes. Focus on the logical fix.

      *(Drafting mentally)*:
      You should reject Step 1. Montaigne isn't arguing that no universal standard exists, but that Europeans mistakenly equate "different" with "barbarous." His actual standard isn't custom, but Reason and Nature.
      In the essay, Montaigne suggests the Tupinamba live closer to "the laws of nature," uncorrupted by artificial civilization. Their cannibalism is an act of extreme vengeance, which, while shocking, follows a logical code of honor. European tortures, however, stem from religious fanaticism and greed—corruptions of reason.
