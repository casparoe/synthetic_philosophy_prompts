  Thinking Process:

  1.  **Analyze the User's Request:**
      *   **Topic:** Montaigne's essay "Of Cannibals" (Des Cannibales).
      *   **Problem:** The user sees a contradiction in Montaigne's argument.
          *   Premise 1: Relativism (barbarism is just what isn't our custom).
          *   Premise 2: Montaigne condemns European cruelty as barbarous.
          *   Conclusion: This is contradictory. If relativism holds, he can't condemn Europeans. If he condemns Europeans, relativism fails.
      *   **Goal:** The user wants to keep *both* the defense of the cannibals and the attack on European cruelty. They want to know which step in their reasoning to reject and what they have to give up to maintain consistency.
      *   **Constraint:** Keep the answer under 500 words.

  2.  **Evaluate the User's Argument:**
      *   The user interprets Montaigne as a strict cultural relativist (Step 1).
      *   The user notes Montaigne critiques European practices (Step 2).
      *   The user sees a tension between relativism and universal critique (Steps 3-6).
      *   *Is this interpretation accurate?* Montaigne is often read as a skeptic or relativist, but "Of Cannibals" is more nuanced. He isn't arguing for pure relativism (that all customs are equally valid). He is arguing against *ethnocentrism* (assuming our customs are superior by default).
      *   *Where is the mistake?* Step 1 is the weak link. Montaigne doesn't say there is *no* outside standard. He says the label "barbarous" is usually applied incorrectly based on ignorance. He implies a universal standard of reason or nature that Europeans actually violate *more* than the Tupinamba.

  3.  **Formulate the Solution:**
      *   **Reject Step 1.** Montaigne is not a strict relativist. He is a humanist skeptic.
      *   **The Standard:** The standard is "Reason" or "Nature" (specifically, natural law vs. artificial corruption).
      *   **The Trade-off:** You have to give up the idea that Montaigne thinks *all* customs are equally valid. He thinks some practices align better with natural reason than others.
      *   **Resolution:** The Tupinamba act out of vengeance/honor (understandable, natural), while Europeans act out of religious zeal/greed (unnatural, irrational). Thus, both judgments rely on a universal standard of human reason/nature, not mere custom.

  4.  **Drafting the Response (incorporating constraints):**
