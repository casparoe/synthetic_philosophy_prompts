  Dear Dana,

  I am writing to formally apologize for the missed mortgage payment this month, though I must insist that the failure to transfer funds is not a matter of negligence but rather a disagreement over the modal framework governing our contractual obligations. As you know, I have been working through Gödel's ontological proof again, and I decided to apply the axioms to my own financial status to see if solvency could be derived a priori. I began by defining being debt-free as a positive property, and following Axiom five, I accepted that necessary existence is itself a positive property. Since positive properties are possibly exemplified, it follows that it is possible for me to possess the property of being necessarily debt-free. From there, I invoked the S5 principle that if it is possible that a necessary state of affairs obtains, then that state of affairs obtains necessarily, which collapsed my possible necessary solvency into actual necessary solvency. Essentially, since there is a possible world where I am necessarily debt-free, and accessibility is symmetric, I am debt-free in this one too.

  However, when I presented this derivation to the bank manager, he rejected the proof on the grounds that the loan agreement is modeled in system S4 rather than S5. He argued that while the accessibility relation between financial states is transitive, it is not symmetric, meaning that just because there is a reachable world where my debt-freedom is necessary, it does not follow that my debt-freedom is necessary in the actual world. He told me that until I can demonstrate that the Euclidean property holds for the set of all possible economic histories, the diamond-box does not collapse to box, and I remain liable for the principal. I am currently trying to prove that the central bank's interest rate policy implies symmetry, but until then, I hope you can accept this letter as a placeholder for the check.

  Warmly,
  Kurt
