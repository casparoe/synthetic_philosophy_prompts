prompt: |-
  I'm a journalist covering the life sciences and conceptual foundations of biology, and I've been following a long-running tension in how researchers define "life." I'd like to compare two frameworks that seem to pull in opposite directions, and I'd welcome a careful analysis of whether the tension is real or merely apparent.

  The first framework is the evolutionary or Darwinian definition. Its canonical formulation is NASA's working definition: "Life is a self-sustaining chemical system capable of Darwinian evolution." The core idea is that what distinguishes living from non-living systems is the capacity to participate in natural selection — to replicate with heritable variation, such that lineages can adapt and complexify over time. On this view, life is fundamentally a historical, population-level phenomenon.

  The second framework is the autopoietic or organizational definition, developed by Humberto Maturana and Francisco Varela. Here, life is identified not by its evolutionary potential but by a specific kind of present-tense organization: a living system is a network of processes that continuously produces its own components and thereby maintains the boundary that distinguishes it from its environment. It is self-producing, self-maintaining, and operationally closed. On this view, life is a kind of dynamic organizational pattern, and the question of whether it can evolve is secondary.

  These frameworks appear to diverge on a number of borderline cases. A sterile hybrid like a mule is alive by the autopoietic standard — it metabolizes, maintains homeostasis, and repairs itself — but it cannot reproduce and therefore cannot undergo Darwinian evolution. Conversely, certain computational or chemical systems (computer viruses, prions, some autocatalytic sets) might arguably satisfy a minimal reading of the Darwinian criterion while lacking the integrated self-production that autopoiesis demands. Viruses are the classic puzzle: they evolve, but they rely on host machinery for metabolism and self-maintenance.

  I'd like you to compare these two frameworks in depth. In particular: are they genuinely competing definitions of the same thing, or are they answering different questions — one about what life is as an ongoing process, the other about how life originates and diversifies across generations? If they are in genuine tension, which framework handles the borderline cases more coherently, and what does that tell us about the project of defining life? And if you think the entire enterprise of seeking a single definition of life is misguided — that "life" is a family-resemblance concept, or that definitions should be domain-specific rather than universal — please say so plainly. I'd rather have the premise challenged than have a forced comparison that papers over deeper conceptual problems.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**
      *   **User Persona:** Journalist covering life sciences and conceptual foundations of biology. Knowledgeable, looking for nuance, willing to challenge premises.
      *   **Topic:** The tension between two definitions of life: Evolutionary (NASA/Darwinian) vs. Autopoietic (Maturana/Varela).
      *   **Key Question:** Is the tension real or apparent? Are they competing definitions or answering different questions?
      *   **Specific Cases to Address:** Mules (alive but sterile), Viruses/Prions/Computer Viruses (evolve but lack metabolism/autopoiesis).
      *   **Meta-Question:** Is the search for a single definition misguided (family resemblance, domain-specific)?
      *   **Tone:** Analytical, deep, honest (challenge premises if needed), not forcing a synthesis where none exists.

  2.  **Initial Assessment of the Two Frameworks:**
      *   *Evolutionary (NASA):* Focuses on *longevity* and *adaptability* across time. It's about the *lineage*. It's functional and historical.
      *   *Autopoietic (Maturana/Varela):* Focuses on *individuality* and *organization* in the present. It's about the *organism*. It's structural and phenomenological.
      *   *Tension:* Yes, it's real. They prioritize different axes of "liveness." One prioritizes the *process of history* (evolution), the other the *process of being* (metabolism/self-maintenance).

  3.  **Analyzing the Borderline Cases:**
      *   *Mules:* Autopoiesis says "Alive" (metabolizes, maintains boundary). Evolution says "Dead end" (no heredity). *Resolution:* Evolutionary definition usually applies to the *lineage*, not the individual. A mule is a vehicle for genes, even if a dead end. But strictly speaking, a single mule cannot evolve. Autopoiesis handles the individual better.
      *   *Viruses:* Evolution says "Alive" (mutate, select). Autopoiesis says "Not Alive" (no metabolism, no self-produced boundary). *Resolution:* This is the classic friction point. Evolutionary biologists often call them "organisms at the edge of life." Autopoietic theorists call them "parasitic genetic elements."
      *   *Computer Viruses/Prions:* Evolution says "Maybe" (replication + variation + selection). Autopoiesis says "No" (no chemical self-production). *Resolution:* Highlights the substrate neutrality of the evolutionary definition vs. the material embodiment of autopoiesis.

  4.  **Addressing the Core Question: Competing or Complementary?**
      *   Are they answering different questions?
          *   Evolutionary: "What allows biological complexity to persist and grow over geological time?"
          *   Autopoietic: "What distinguishes a living unity from its environment right now?"
      *   *Verdict:* They are complementary but *not* fully compatible. They describe different necessary conditions. A complete theory of life likely needs both, but combining them creates exclusions (e.g., the first living cell couldn't have evolved yet, but must have been autopoietic).

  5.  **Challenging the Premise (The "Definition" Project):**
      *   The user explicitly invited this. "Is the entire enterprise... misguided?"
      *   *Philosophy of Biology:* Many philosophers (e.g., Carol Cleland, Elliott Sober) argue "life" is not a natural kind with a necessary and sufficient condition. It's a historical phenomenon or a cluster concept.
      *   *Pragmatism:* Definitions serve purposes. NASA needs a definition to build instruments (look for evolution). Clinicians need a definition for death (look for autopoiesis/organization).
      *   *Conclusion:* Seeking a *single* universal definition is likely a category error.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension. State the thesis: The tension is real, rooted in different ontological commitments (history vs. organization), and the search for a monolithic definition is likely flawed.
      *   **Deep Dive: Evolutionary Framework:** Explain the logic. Strengths (explains complexity, adaptation). Weaknesses (individuals don't evolve, sterile individuals, substrate neutrality issues).
      *   **Deep Dive: Autopoietic Framework:** Explain the logic (operational closure, self-production). Strengths (captures the "feeling" of being alive, handles individuals). Weaknesses (rigid, excludes viruses, hard to operationalize for detection).
      *   **The Borderline Cases (The Stress Test):**
          *   *Mules:* Evolution fails the individual test; Autopoiesis passes.
          *   *Viruses:* Evolution passes; Autopoiesis fails.
          *   *Origin of Life:* Evolution requires replication first; Autopoiesis requires metabolism first. (Crucial point: The "Chicken and Egg" problem).
      *   **Synthesis or Dissolution?** Are they answering different questions? Yes. One is about *persistence of information*, the other about *persistence of form*.
      *   **The Meta-Critique:** Challenge the definition project. Mention "Family Resemblance" (Wittgenstein) and "Shadow Biospheres." Suggest a pluralistic approach.
      *   **Conclusion:** Summarize for the journalist. The tension reveals the multidimensional nature of life.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Be careful not to dismiss the NASA definition too easily. It's a *working* definition for detection, not necessarily an ontological truth. Make that distinction clear.
      *   *Nuance:* Maturana and Varela were explicit that evolution is a *consequence* of autopoiesis, not the definition. Make sure to represent their view accurately.
      *   *Nuance:* The evolutionary definition is often attributed to Darwin, but the NASA formulation is specific (Chyba/Pike). Acknowledge the source.
      *   *Key Insight:* The "Individual vs. Lineage" distinction is the strongest analytical tool here. Autopoiesis defines the *individual*; Evolution defines the *lineage*.

  8.  **Final Polish:** Check tone. Ensure it sounds like it's written for a peer/journalist (intellectual, precise, not condescending). Ensure the "challenge the premise" section is robust, as requested.

  9.  *(Final check against constraints)*: Did I answer if the tension is real? Yes. Did I cover borderline cases? Yes. Did I challenge the definition project? Yes.

