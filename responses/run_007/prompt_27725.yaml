      *   **The "Bonding" Phase:** Allow them to invent a rule that lets them merge.
      *   **The "Emergence" Phase:** Ask an outsider to summarize the group.

      *   *Refining for Maximum Friction:*
      *   Let's make the "Macro-Subject" a specific role that is impossible to fulfill.
      *   **Role:** "The Unified Self."
      *   **Roles:** 10 "Neurons," 2 "Observers."
      *   **Neurons:** Each gets a private sensory input (Color + Sound). They cannot show the card. They can only pass tokens.
      *   **The Goal:** The "Unified Self" (a chair in the middle) must declare what it sees.
      *   **The Kicker:** The "Unified Self" is actually empty. It's just a chair. The Neurons have to speak *through* it.
      *   **The Conflict:** When a Neuron speaks through the chair, are they speaking for the whole? Or just their part?
      *   *Okay, this is getting too abstract.* Let's ground it in the "Subject-Summing" specifically.
      *   **Core Mechanic:** Private Data vs. Public Report.
      *   **Phase 1 (Physical Sum):** Stack blocks. Easy.
      *   **Phase 2 (Subject Sum):** Merge perspectives. Hard.
      *   **Activity:** "The Blind Mosaic."
      *   **Setup:** 3 Groups of 4.
