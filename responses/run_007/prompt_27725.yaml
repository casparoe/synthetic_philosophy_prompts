      *   **This is the one.** It captures the "Subject-Summing" problem perfectly. $Red_{view} + Blue_{view} \neq Purple_{view}$ unless there is a subject that sees the combination.

  4.  **Developing the "Blind Mosaic" Activity:**
      *   **Materials:** Colored transparent sheets (gel filters) are cheap. Or just colored cards. Let's use colored cards with text on them to simulate "Qualia."
      *   **Better:** Use "Sensory Slips."
      *   **Group Structure:** 3 Corporations (Groups of 4).
