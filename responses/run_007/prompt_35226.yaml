answer: |-
  You are absolutely right to feel that the phrase is slippery. In philosophy and sociology, "social construction" is a term that does a tremendous amount of heavy lifting, often without the speaker specifying *which* kind of construction they mean.

  Your cousin is relying on a specific version of constructionism (often called **Eliminativism**) to argue against affirmative action. However, proponents of affirmative action often rely on a different version (often called **Social Realism** or **Critical Race Theory**) to argue *for* it. Both sides use the same slogan ("It's constructed!") to mean opposite things.

  Here is the "full menu" of distinct claims hidden inside the phrase "race is a social construct," evaluated for truth and political implication.

  ### 1. The Biological Discontinuity Claim
  *   **What it means:** There are no sharp genetic boundaries between human populations. Human genetic variation is "clinal" (changes gradually over geography) rather than "typological" (distinct buckets). There is no "race gene" or biological essence that makes someone Black, White, or Asian in a way that maps cleanly to our social categories.
  *   **Truth Status:** **Obviously True.** This is the consensus view of modern genetics and physical anthropology. There is more genetic variation *within* racial groups than *between* them.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** Supports him. If there is no biological basis, treating race as a "real" category in admissions is scientifically illiterate.
      *   **Counter View:** Neutral. Affirmative action is rarely defended on biological grounds; it is defended on *sociological* grounds. Acknowledging biology doesn't matter doesn't prove sociology doesn't matter.

  ### 2. The Historical/Cultural Variability Claim
  *   **What it means:** Racial categories change over time and across borders. An Irish immigrant in 1850s America was not considered "White" in the same way they are today. In Brazil, racial categories are based on phenotype (appearance) and are fluid; in the US, they were historically based on hypodescent (the "one-drop rule"). If race were a natural fact, it wouldn't change depending on which side of a border you stand on.
  *   **Truth Status:** **Obviously True.** Historians and sociologists have documented this extensively.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** Supports him. It suggests the categories are arbitrary, so why build policy on arbitrary lines?
      *   **Counter View:** Cuts the other way. It shows that race is a tool of policy. Since the state helped construct these categories to allocate rights (e.g., who could vote, own land, or naturalize), the state has a responsibility to dismantle the inequalities created by those specific constructions.

  ### 3. The Ontological Claim (Social Realism)
  *   **What it means:** This addresses your confusion about race being "real but not biologically real." This claim argues that race is a **Social Kind**, not a **Natural Kind**.
      *   *Natural Kind:* Gold, electrons, tigers. These exist regardless of what humans think.
      *   *Social Kind:* Money, marriage, citizenship, race. These exist *only* because we agree they exist and act accordingly.
      *   *The Claim:* Race is not a biological fiction; it is a social fact. It is as "real" as a $20 bill. The paper has no intrinsic value, but because society treats it as valuable, it has real causal power.
  *   **Truth Status:** **Plausibly True (Philosophically Robust).** This is the standard sociological position. It avoids the trap of saying race is "nothing" while admitting it isn't biological.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** Weakens his argument. If race is socially real (like money), ignoring it doesn't make it go away.
      *   **Counter View:** Strongly supports AA. Because race is a social fact with causal power (it determines where you live, how police treat you, wealth accumulation), ignoring it in admissions ignores a massive factor in an applicant's life trajectory.

  ### 4. The Eliminativist Claim (Normative)
  *   **What it means:** Because race is a fiction (biologically) and a tool of oppression (historically), we should strive to stop using racial categories entirely. We should be "colorblind." To use race is to perpetuate the fiction.
  *   **Truth Status:** **Debatable (Normative/Political).** This is not a fact about the world, but a moral prescription for how to act.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** **This is his actual argument.** He is sliding from Claim 1 (Biology) to Claim 4 (Eliminativism). He believes using the category reifies the harm.
      *   **Counter View:** False/Counterproductive. You cannot fix a problem you refuse to name. If race is the mechanism of inequality, removing the category makes the inequality invisible and unfixable.

  ### 5. The Power/Ideology Claim
  *   **What it means:** Racial categories were not discovered; they were *invented* specifically to justify hierarchy, slavery, and colonialism. "Whiteness" was constructed to unite European elites and poor laborers against enslaved Africans. Therefore, race is inherently tied to power dynamics.
  *   **Truth Status:** **Plausibly True (Historically Robust).** There is significant historical evidence that modern racial taxonomy emerged alongside the trans-Atlantic slave trade to justify chattel slavery.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** Neutral/Weak. He might agree race was used for power but argue we should move past it.
      *   **Counter View:** Strongly supports AA/Reparations. If race was constructed to create a debt/deficit, justice requires using that same category to repay the debt. This is why people use "social construct" to argue *for* reparations: "You constructed this hierarchy, now you must deconstruct it."

  ### 6. The Reification Warning
  *   **What it means:** This is a specific caution against treating social constructs as if they were natural laws. When we say "Black students score lower on X," we risk sounding like we are saying "Black biology causes X," rather than "Anti-black racism causes X."
  *   **Truth Status:** **Plausibly True.** This is a well-documented cognitive bias.
  *   **Implication for Affirmative Action:**
      *   **Cousin's View:** Supports him. He fears AA reifies race by making it a "plus factor," essentially treating a social stigma as a biological trait.
      *   **Counter View:** Nuanced. Proponents argue AA *acknowledges* the reification that already happened. The reification isn't caused by the remedy; it was caused by centuries of slavery and Jim Crow. AA just accounts for the current reality of that reification.

  ---

  ### Why Your Cousin's Argument Feels "Slippery"

  You sensed a sleight of hand because your cousin is likely committing a version of the **Motte and Bailey fallacy**, or simply conflating **Descriptive** claims with **Normative** claims.

  1.  **The Motte (The defensible position):** "Race isn't biological." (Claim 1). This is scientifically true and hard to argue against.
  2.  **The Bailey (The controversial position):** "Therefore, we should not use racial categories in policy." (Claim 4).

  He uses the undeniable truth of Claim 1 to shield the debatable morality of Claim 4.

  **The "Real but not Biologically Real" Puzzle:**
  You mentioned you didn't totally get how race can be real but not biologically real. The best analogy is **Money**.
  *   **Biologically/Physically:** A $100 bill is just a piece of cotton-linen blend with ink. There is nothing in the atoms of the bill that makes it worth $100. If you analyze it chemically, "value" does not appear.
  *   **Socially:** It is undeniably real. You can buy food with it. If you burn it, you have lost something real.
  *   **The Cousin's Error:** Your cousin is arguing that because the $100 bill has no *chemical* value, we should stop treating it as *currency*.
  *   **The Counter-Argument:** Because the $100 bill has *social* value, ignoring it would ruin your life.

  ### How to Respond

  If you want to engage him without getting bogged down in semantics, you can validate his premise while rejecting his conclusion:

  > "I agree with you that race isn't biological. There are no genetic boundaries. But sociologists distinguish between 'natural kinds' (like tigers) and 'social kinds' (like money or citizenship). Race is a social kind. It doesn't exist in our DNA, but it exists in our institutions, our wealth gaps, and our police interactions.
  >
  > Saying 'race isn't real so we shouldn't use it' is like saying 'money has no intrinsic value so we should stop tracking bank accounts.' The category is fictional, but the consequences are material. Affirmative action isn't about validating the biology; it's about accounting for the social reality."

  This forces him to argue against the *social reality* of racism, rather than hiding behind the *biological unreality* of race.
