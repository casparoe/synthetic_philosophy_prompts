answer: |-
  Here is a diagnostic sorting quiz designed for your reading group. It is built to pressure-test pre-theoretical intuitions across the major fault lines in the literature.

  ### **The Vagueness Intuition Inventory**

  **Instructions:** For each scenario, select the **one** option that best matches your immediate philosophical reaction. Do not overthink based on what you think a "theory" should say; go with your gut judgment on the case.

  ---

  #### **1. The Grain-by-Grain Sorites**
  You have a heap of 10,000 grains of sand. You remove one grain. It is still a heap. You remove another. It is still a heap. Consider the inductive premise: *"If a collection of $n$ grains is a heap, then a collection of $n-1$ grains is a heap."*
  *   **A.** This premise is strictly **false**. There is a specific number $n$ where removing one grain turns a heap into a non-heap, even if we can never identify which number it is.
  *   **B.** This premise is **neither true nor false** in the borderline region. There are many equally acceptable ways to draw the line, and the premise fails because it tries to force a single boundary where none exists.
  *   **C.** This premise is **mostly true but degrades**. Each step reduces the "truth value" slightly. By the end of the chain, the accumulated loss of truth makes the conclusion false.
  *   **D.** The meaning of "heap" **shifts** during the series. The standard for "heap" tightens as we approach the borderline, so we aren't comparing the same concept at the start and end. (Or: Nothing is truly a "heap" to begin with.)

  #### **2. The Borderline Case (Baldness)**
  Harry has 5,000 hairs on his head, distributed in a way that makes him a paradigmatic borderline case of "bald." Consider the statement: *"Harry is bald."*
  *   **A.** The statement is determinately **True** or determinately **False**. My uncertainty is purely a lack of knowledge about the facts or the language rules.
  *   **B.** The statement is **indeterminate**. It is not true, and it is not false. There is a truth-value gap.
  *   **C.** The statement is **partially true**. It has a truth value of roughly 0.5.
  *   **D.** The statement has no truth value until a **context** fixes a standard. In a casual conversation, it might be true; in a medical trial, it might be false. (Or: The predicate "bald" is defective and refers to nothing.)

  #### **3. The Legal Statute**
  A statute prohibits "excessive noise" in a hospital zone. A musician plays at 60 decibels. The judge must decide if this violates the statute.
  *   **A.** The judge is **discovering** whether the act fell under the prohibition. There is a fact of the matter about whether 60dB counts as "excessive" fixed by the law, even if the law doesn't specify it.
  *   **B.** The judge is **precisifying** the law. The law admits a range of acceptable interpretations, and the judge's ruling selects one admissible precisification to settle the case.
  *   **C.** The judge is **weighing degrees**. The act falls to some degree under the prohibition, and the verdict reflects the degree to which the norm was violated.
  *   **D.** The judge is **setting a standard**. The term "excessive" has no content independent of the court's decision in this specific context.

  #### **4. The Ship of Theseus (Ontic Vagueness)**
  A ship has all its planks replaced over time. Is the resulting ship the *same* ship as the original? Assume there is no fact about causal continuity or memory that settles this; it is purely about the material constitution.
  *   **A.** There is a **fact of the matter**. Either it is the same ship or it isn't. Our concepts are precise enough to determine this, even if we are ignorant of the outcome.
  *   **B.** The question has **no answer**. "Same ship" is vague, and the world doesn't contain a fact that corresponds to this identity claim in this scenario.
  *   **C.** It is a **matter of degree**. The new ship is 0.8 the same ship as the original.
  *   **D.** The answer depends on **why we are asking**. For insurance purposes, it's the same ship; for historical preservation, it isn't. There is no context-independent identity.

  #### **5. Higher-Order Vagueness**
  Consider the boundary between "definitely bald" and "borderline bald." Is *that* boundary sharp?
  *   **A.** **Yes.** There is a sharp boundary between the knowable cases and the unknowable cases. We just can't locate it.
  *   **B.** **No.** The boundary of the "definitely" region is itself vague. There is no sharp line between the clear cases and the borderline ones.
  *   **C.** **It's a slope.** The transition from "definitely" to "borderline" is smooth, just like the transition from "bald" to "hairy."
  *   **D.** **It's unstable.** Where the boundary lies depends on how carefully we are scrutinizing the concept at that moment.

  #### **6. Classical Logic (Bivalence)**
  Consider the Law of Excluded Middle: *"Either Harry is bald or Harry is not bald."* (Assume Harry is the borderline case from Q2).
  *   **A.** **True.** One of the disjuncts must be true, even if we don't know which. Logic holds universally.
  *   **B.** **True.** The disjunction is super-true (true on all precisifications), even though neither disjunct is true individually.
  *   **C.** **False/Modified.** In borderline cases, classical logic fails. We need a logic that allows for truth-value gluts or gaps.
  *   **D.** **Misleading.** The sentence looks logical but presupposes that "bald" is a well-defined property. It's like saying "Either the present King of France is bald or he isn't."

  #### **7. The Source of Confusion**
  Why do competent speakers disagree about borderline cases?
  *   **A.** **Ignorance.** We lack access to the semantic facts that fix the extension of the term.
  *   **B.** **Multiplicity.** There are multiple equally correct semantic rules (precisifications), and speakers are implicitly using different ones.
  *   **C.** **Gradient Reality.** The property itself (e.g., baldness) is a gradient in the world, not a binary switch, and our binary language struggles to map it.
  *   **D.** **Pragmatics.** Speakers are negotiating a conversational standard. Disagreement is a tool to shift the context, not a report on a fixed state of affairs.

  #### **8. Vague Objects**
  Do vague objects (e.g., clouds, cats, heaps) exist in the world independently of our language?
  *   **A.** **Yes, but they are precise.** A cloud has a precise boundary of water droplets; we just don't know it.
  *   **B.** **No.** The world is precise; vagueness is entirely a feature of our representation/language.
  *   **C.** **Yes, and they are vague.** The world itself contains ontic vagueness; some objects genuinely lack identity conditions.
  *   **D.** **No, and neither do precise ones.** Our ordinary object talk is systematically false. There are no "clouds," only particles arranged cloud-wise.

  ---

  ### **Scoring Key**

  Tally your answers. Most questions map cleanly to four theoretical clusters. Q8 and Q6 require specific interpretation to separate Nihilism from Epistemicism.

  | Question | Option A | Option B | Option C | Option D |
  | :--- | :--- | :--- | :--- | :--- |
  | **1 (Sorites)** | **Epistemic** | **Superval** | **Degree** | **Context/Nihil** |
  | **2 (Baldness)** | **Epistemic** | **Superval** | **Degree** | **Context/Nihil** |
  | **3 (Legal)** | **Epistemic** | **Superval** | **Degree** | **Context** |
  | **4 (Identity)** | **Epistemic** | **Superval** | **Degree** | **Context** |
  | **5 (Higher-Order)**| **Epistemic** | **Superval** | **Degree** | **Context** |
  | **6 (Logic)** | **Epistemic** | **Superval** | **Degree** | **Nihil/Error** |
  | **7 (Confusion)** | **Epistemic** | **Superval** | **Degree** | **Context** |
  | **8 (Objects)** | **Epistemic** | **Superval** | **Ontic Vagueness**| **Nihilism** |

  **Theory Profiles:**
  *   **Epistemicism:** Mostly A's. (Committed to bivalence, sharp boundaries, classical logic).
  *   **Supervaluationism:** Mostly B's. (Committed to truth-value gaps, super-truth, admissible precisifications).
  *   **Degree Theory (Fuzzy):** Mostly C's. (Committed to degrees of truth, rejection of bivalence, smooth transitions).
  *   **Contextualism:** Mostly D's (except Q8). (Committed to shifting standards, pragmatic resolution).
  *   **Nihilism/Eliminativism:** Mostly D's on Q1, Q2, Q6, and **specifically D on Q8**. (Committed to the idea that vague predicates fail to refer).

  ---

  ### **Diagnostic Notes for the Facilitator**

  #### **1. The Epistemicism vs. Supervaluationism Blur**
  This is the hardest separation. Both theories preserve classical logic (mostly) and agree that the world itself is precise.
  *   **The Blur:** On Q1 (Sorites) and Q6 (Logic), Epistemicists and Supervaluationists often give compatible answers (both accept the disjunction "Bald or Not Bald").
  *   **The Separator:** **Q2 (Borderline Truth)** is your main diagnostic tool.
      *   If they say "It's T or F, I just don't know" $\rightarrow$ **Epistemicism**.
      *   If they say "It's neither T nor F" $\rightarrow$ **Supervaluationism**.
  *   **Warning:** A student who selects **A on Q2** but **B on Q1** is likely confused. Supervaluationists deny bivalence for atomic sentences but accept it for the excluded middle disjunction. If they deny bivalence on Q2 but reject the Excluded Middle on Q6, they are drifting toward Degree Theory.

  #### **2. The Nihilism vs. Epistemicism Overlap**
  Both views deny that the *world* is vague (Q8).
  *   **The Blur:** Both will reject "Ontic Vagueness" (Option C on Q8).
  *   **The Separator:** **Q8 Option A vs. Option D**.
      *   Epistemicism: "There are clouds, they have precise boundaries we can't see." (Option A).
      *   Nihilism: "There are no clouds, only particles." (Option D).
  *   **Warning:** If a student selects **A on Q8** (Precise objects exist) but **D on Q2** (No truth value), they hold an incoherent position (Ontological Realism + Semantic Anti-Realism). This is rare but possible (e.g., some forms of non-factualism).

  #### **3. Incoherent Answer Patterns**
  Watch for these combinations; they indicate a misunderstanding of the logical commitments:
  *   **Degree Theory + Classical Logic:** Selecting **C on Q2** (Partial Truth) but **A on Q6** (Classical Bivalence holds universally).
      *   *Why:* Degree theories inherently reject classical bivalence. You cannot have truth values of 0.5 and maintain that every statement is strictly T or F.
  *   **Supervaluationism + Sharp Higher-Order:** Selecting **B on Q2** (Gaps) but **A on Q5** (Sharp boundary between definite and borderline).
      *   *Why:* A major criticism of Supervaluationism is that it creates a sharp boundary between the true and the indeterminate (the "higher-order vagueness" problem). A sophisticated Supervaluationist should admit this is a problem (leaning toward B or D on Q5). If they insist on A, they are effectively Epistemicists about the "definiteness" operator.
  *   **Contextualism + Fixed Legal Meaning:** Selecting **D on Q1** (Context Shift) but **A on Q3** (Judge discovers fixed fact).
      *   *Why:* Contextualism suggests the law's content is settled by the context of adjudication, not discovered as a pre-existing fact.

  #### **4. The "Ontic Vagueness" Outlier (Option C on Q8)**
  *   **Who picks this:** Very few contemporary philosophers defend ontic vagueness (e.g., Elizabeth Barnes, J.R.G. Williams).
  *   **Diagnostic:** If a student picks **C on Q4** and **C on Q8**, they are likely interested in metaphysical vagueness rather than semantic vagueness. This is a valuable distinction for the group to know early, as most readings will assume vagueness is linguistic/conceptual.

  #### **5. Contextualism vs. Nihilism**
  These two often cluster under Option D.
  *   **Differentiation:** Look at **Q3 (Legal)**.
      *   Contextualists see the judge as *fixing* meaning (D).
      *   Nihilists see the statute as *defective* or systematically false (D on Q2/Q6).
      *   If they pick D on Q3 but A on Q8 (Precise objects exist), they are **Contextualists**.
      *   If they pick D on Q3 and D on Q8 (No vague/precise ordinary objects), they are **Nihilists/Eliminativists**.

  ### **Facilitator's Cheat Sheet for Discussion**
  *   **If the group is mostly Epistemic:** Push them on *why* we are ignorant. Is it metaphysical impossibility or just practical difficulty? (Williamson vs. others).
  *   **If the group is mostly Supervaluationist:** Ask about the "penumbral connections." If "Harry is bald" is indeterminate, is "Harry is bald or Harry is not bald" true? (They must say yes). Ask if that feels intuitive.
  *   **If the group is mostly Degree Theorists:** Ask about Modus Ponens. If $P$ is 0.9 true, and $P \to Q$ is 0.9 true, is $Q$ 0.9 true? How do we avoid the sorites conclusion if we just lose a tiny bit of truth each step?
  *   **If the group is mostly Contextualist:** Ask about "memory." If I say "That's a heap" today, and tomorrow the context shifts, was I lying yesterday? How do we communicate across contexts?
