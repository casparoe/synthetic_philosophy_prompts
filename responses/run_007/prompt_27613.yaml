      *   *Degree Theory (Fuzzy):* Classical logic fails. Bivalence fails. Truth comes in degrees (0 to 1). No sharp cutoff, just a slope. Sorites premise false (induction step has degree < 1).
      *   *Contextualism:* Extension of predicate shifts with context. "Tall" means different things in different conversational contexts. Sorites fails because context shifts during the series.
