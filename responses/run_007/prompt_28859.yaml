answer: |-
  This is a request for a **meta-theoretical framework**. You are asking for the constraints on the *map*, not the territory. Most debates fail because the combatants are using maps with different projections (e.g., psychometrics vs. computationalism vs. ethology).

  Below is the specification for an adequate theory of intelligence. It is designed to be substrate-neutral, scale-invariant, and empirically grounded.

  ### Part 1: The Desiderata Table

  | Desideratum | The Case (Why it's needed) | What It Rules Out | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Competence/Performance Distinction** | **The LLM & The Fatigued Human.** An LLM aces a benchmark but fails a trivial consistency check (performance noise vs. structural lack). A human knows the answer but is tired or anxious. A theory must distinguish *latent capacity* from *observed output*. | **Behaviorism:** Rules out "Intelligence = Task Score." <br>**Pure Benchmarking:** Rules out "If it passes the test, it is intelligent." | **Non-Negotiable** |
  | **2. Modular Dissociability** | **The Savant & The ID.** A savant factorizes primes but can't tie shoes. Someone with severe ID navigates complex social hierarchies. Intelligence is not a monolithic blob; components must be able to break or excel independently. | **Strict 'g' Factor:** Rules out theories that treat intelligence as a single, indivisible scalar value. <br>**Monolithic Architectures:** Rules out AI designs that assume scaling one parameter fixes all deficits. | **Non-Negotiable** |
  | **3. Substrate Neutrality** | **The Corvid, The Octopus, The Silicon.** A crow bends wire to hook food. An octopus opens a jar. An LLM reasons (or mimics reasoning). The physical material (chitin, neuron, transistor) cannot define the phenomenon. | **Biological Chauvinism:** Rules out "Only brains are intelligent." <br>**Carbon-Based Bias:** Rules out definitions relying on specific neurochemistry. | **Non-Negotiable** |
  | **4. Resource Boundedness** | **The Ant & The Market.** An ant colony solves optimization problems no individual ant understands. A market prices assets using dispersed info. Intelligence must account for *efficiency* under constraints, not just ideal rationality. | **Unbounded Rationality:** Rules out "Rational Agent" models (Homo Economicus) that assume infinite compute/memory. <br>**Omniscience:** Rules out definitions requiring total information access. | **Non-Negotiable** |
  | **5. Out-of-Distribution (OOD) Generalization** | **The Corvid & The LLM.** A crow solves a *novel* puzzle it never evolved to see. An LLM fails when the prompt distribution shifts slightly. Intelligence is the ability to transfer models to *unseen* contexts, not just interpolate training data. | **Statistical Parroting:** Rules out "Intelligence = Pattern Matching." <br>**Overfitting:** Rules out systems that only work within their training distribution. | **Non-Negotiable** |
  | **6. Developmental Plasticity** | **The Flynn Effect & Twin Studies.** IQ scores rise over generations (environment). Twins show high heritability but diverge with different schooling (interaction). Intelligence must be a dynamic process, not fixed hardware. | **Fixed Hardware Views:** Rules out "Intelligence is determined at birth/conception." <br>**Tabula Rasa:** Rules out "Intelligence is purely learned." | **Non-Negotiable** |
  | **7. Locus of Agency Definition** | **The Ant Colony & The Market.** Where does the intelligence live? In the ant? The colony? The market algorithm? The theory must define the *boundary* of the intelligent system. | **Methodological Individualism:** Rules out assuming the individual is always the unit of analysis. <br>**Holism:** Rules out assuming the collective is always the unit. | **Preference** (Functionalists prefer flexible boundaries; Traditionalists prefer individual skulls). |
  | **8. Goal Flexibility** | **The Thermostat vs. The Human.** A thermostat pursues a goal (temperature) efficiently but isn't intelligent. Intelligence requires the ability to *adopt, change, or generate* new goals, not just optimize fixed ones. | **Cybernetics:** Rules out "Intelligence = Negative Feedback Loop." <br>**Optimization Only:** Rules out "Intelligence = Gradient Descent." | **Non-Negotiable** |
  | **9. Phenomenal Independence** | **The Philosophical Zombie.** A system might act intelligently without "feeling" like anything (or vice versa). A theory of intelligence must function even if we strip away qualia/consciousness. | **Panpsychism:** Rules out "Intelligence requires consciousness." <br>**Cartesian Dualism:** Rules out "Consciousness is the driver of intelligence." | **Preference** (Functionalists say Non-Negotiable; Phenomenologists say Preference). |

  ---

  ### Part 2: The Distinctions The Theory Cannot Collapse

  An adequate theory must treat these pairs as distinct variables, not synonyms. If a theory collapses these, it fails the awkward cases.

  1.  **Competence vs. Performance:**
      *   *Why:* Competence is the underlying grammar/capacity; Performance is the real-time execution.
      *   *Collapse Risk:* If collapsed, a stuttering genius is classified as unintelligent, and a lucky guesser is classified as a genius.
  2.  **Individual vs. Collective:**
      *   *Why:* Intelligence can emerge from interaction (ants, markets, teams).
      *   *Collapse Risk:* If collapsed, you cannot explain how a group of "average" individuals solves problems no individual could (distributed cognition), or how a genius fails in a toxic environment.
  3.  **General Ability (g) vs. Specific Abilities (s):**
      *   *Why:* The "Positive Manifold" (skills correlate) exists, but Savants prove dissociation is possible.
      *   *Collapse Risk:* If collapsed into pure 'g', savants are impossible. If collapsed into pure 's', transfer learning is impossible. The theory must model the *correlation structure*, not just the poles.
  4.  **Ability vs. Test Score:**
      *   *Why:* A test is a sample of behavior; ability is the latent trait.
      *   *Collapse Risk:* If collapsed, you cannot measure the Flynn Effect (because the "score" changed, but did the "ability"?). It conflates the map with the territory.
  5.  **Intelligence vs. Goal-Directedness:**
      *   *Why:* A missile is goal-directed. A rock is not. An intelligent agent chooses the goal.
      *   *Collapse Risk:* If collapsed, a thermostat is intelligent. The theory must account for *meta-goals* (goals about goals).
  6.  **Intelligence vs. Consciousness:**
      *   *Why:* We attribute intelligence to companies and AI, which we don't assume are conscious. We attribute consciousness to animals we debate the intelligence of.
      *   *Collapse Risk:* If collapsed, you cannot build AI (unless you solve the Hard Problem first). It makes the science of intelligence dependent on the metaphysics of mind.

  ---

  ### Part 3: The "Killer" Desideratum

  If you force me to pick the single desideratum that does the most work in killing off the most popular, lazy definitions, it is:

  **Desideratum #5: Out-of-Distribution (OOD) Generalization.**

  **Why it is the Killer:**
  1.  **Kills "Intelligence = IQ Test Score":** IQ tests are static distributions. If you train a system specifically on IQ questions, it scores high. OOD Generalization demands the system work on *novel* problems not in the distribution. It exposes the difference between *memorization* and *reasoning*.
  2.  **Kills "Intelligence = LLM Performance":** Current LLMs are interpolation engines. They excel within their training distribution (benchmarks) but fracture on OOD tasks (logical inconsistencies, novel physical puzzles). This desideratum forces the theory to demand *causal models*, not just statistical correlations.
  3.  **Kills "Intelligence = Rational Optimization":** A rational agent optimizes for a fixed utility function. OOD Generalization requires the agent to recognize when the utility function or the environment rules have changed. It demands *adaptability*, not just *efficiency*.
  4.  **Kills "Intelligence = Biological Instinct":** An instinct works in the environment of evolutionary adaptedness. A corvid bending a wire is acting OOD relative to its evolutionary history. This separates *reflex* from *intelligence*.

  **Verdict:** Without OOD Generalization, you are merely measuring **compression** (how well you fit the past), not **intelligence** (how well you navigate the future).

  ---

  ### Part 4: The Incompatibilities (The Trade-Offs)

  You asked to see where the requirements cannot be jointly satisfied. A honest theory must admit these tensions.

  | Conflict | The Tension | Why they can't be jointly maximized |
  | :--- | :--- | :--- |
  | **Generality vs. Efficiency** | **The Specialist/Generalist Trade-off.** | To be robust across *all* novel contexts (Generality), you need a flexible, high-overhead architecture. To be efficient (Resource Boundedness), you need specialized, hard-coded heuristics. You cannot maximize both. An ant colony is efficient but brittle; a human is flexible but energy-expensive. |
  | **Modularity vs. Integration** | **The Savant/Coherence Trade-off.** | To explain Savants, you need high Modularity (Dissociability). To explain 'g' (general factor) and coherent agency, you need high Integration. A theory that perfectly explains the Savant (independent modules) struggles to explain why skills usually correlate. A theory that explains 'g' struggles to explain the Savant. |
  | **Plasticity vs. Stability** | **The Learning/Forgetting Trade-off.** | To account for the Flynn Effect and Twin Studies (Plasticity), the system must be highly mutable. To account for Consistency and Competence (Stability), the system must resist noise. High plasticity leads to catastrophic forgetting; high stability leads to inability to learn. |
  | **Individual vs. Collective** | **The Boundary Problem.** | If intelligence is in the Market (Collective), the Individual trader might act irrationally. If intelligence is in the Individual, the Market's "wisdom" is an illusion. You cannot define the *locus* of optimization for both simultaneously without arbitrariness. |

  ### Summary for the Reader
  When you read the next paper:
  1.  Check if they confuse **Performance** (benchmark score) with **Competence** (latent capacity).
  2.  Check if they claim **Generality** without addressing the **Efficiency** cost.
  3.  Check if their definition of intelligence would accidentally classify a **Thermostat** or a **Lookup Table** as intelligent (if so, they failed Goal Flexibility or OOD Generalization).
  4.  Check if they acknowledge that **Modularity** and **Integration** are in tension.

  If the theory doesn't explicitly state how it handles the **Savant** (modularity) and the **LLM** (OOD robustness), it is not a theory of intelligence; it is a theory of a specific test.
