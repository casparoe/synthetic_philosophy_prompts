      *   *Conclusion Z:* The two sides of this Triangle are equal to each other.
      *   *The Conflict:* Achilles thinks $A + B \vdash Z$ (entailment). The Tortoise accepts $A$ and $B$ as true propositions but refuses to accept the *connection* that forces $Z$.
