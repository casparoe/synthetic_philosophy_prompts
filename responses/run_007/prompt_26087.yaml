answer: |-
  **The shape of the problem**
  You have reconstructed a version of the "overdemandingness objection," a classic problem in normative ethics that pits the authority of morality against the integrity of the personal life. The stakes are high: if you keep the chain intact, you conclude that morality is self-defeating (it demands a life we cannot rationally endorse), but if you break it, you risk rendering morality optional or toothless. While the argument feels like a paradox about morality *in general*, the real engine driving the tension is Premise (2). This is the move from "morality matters" to "morality must be maximized." Without that maximization requirement, you can have overriding moral duties (Premise 1) without needing to become a moral saint (Premise 3), so identifying where to interrupt that slide from obligation to optimization is the key to solving your dilemma.

  **Three exits**
  The first and most common exit is to reject Premise (2) by introducing **agent-centered prerogatives**. This view, championed by philosophers like Susan Wolf (in her famous paper "Moral Saints") and Samuel Scheffler, argues that morality sets a floor for behavior, not a ceiling. You are obligated not to harm and to help to a reasonable degree, but you are permitted to prioritize your own projects even when doing so doesn't maximize the good. The cost here is the "line-drawing problem": if it's okay to keep 50% of your income, why not 51%? It risks making moral limits look arbitrary. However, it preserves the intuition that a life needs personal "ground projects" to be meaningful, protecting you from the saintliness trap without making morality optional.

  The second exit is to reject Premises (4) and (5) by defending the **compatibility of the saintly life**. A hardline consequentialist (like Peter Singer in his more rigorous moments) might argue that your recoil is a psychological bias, not a normative truth. They would claim that deep satisfaction *is* found in maximizing good, and that hobbies like gourmet cooking are trivial compared to saving lives; thus, the saint's life isn't actually "impoverished," only differently enriched. The cost of this exit is high: it requires you to deny the intrinsic value of art, leisure, and partial relationships, potentially leading to a kind of alienation where you view your own humanity merely as a vessel for utility. It saves morality's authority by shrinking the definition of a "good life" to fit morality's demands.

  The third exit is to reject Premise (1) and embrace **moral pluralism or skepticism**. This approach, associated with Bernard Williams and some Nietzschean critiques, suggests that morality is just one value system among many (aesthetic, prudential, cultural) and does not automatically override them. If morality demands you abandon your integrity or your deepest loves, you are permitted to say "morality loses this round." The cost is the most severe: it undermines the categorical nature of moral "oughts." If morality can be trumped by personal preference, it ceases to be a binding authority and becomes more like a strong suggestion, which might validate your roommate's fear that you are just making excuses to be selfish.

  **Your preferred exit**
  I would take the first exit and reject Premise (2), specifically by distinguishing between *obligation* and *supererogation*. Morality is overriding in the sense that you cannot violate a duty to pursue a hobby (you can't skip feeding your child to paint), but it does not follow that you must maximize moral value in every moment. A life without personal "noise"—hobbies, idle friendships, aesthetic indulgences—lacks the very texture that makes moral agents care about value in the first place. By accepting that some moral goodness is optional (supererogatory), you preserve the authority of morality where it counts (preventing harm) without accepting the totalitarian claim that every hour must be monetized for the greater good. This allows you to tell your roommate that donating 10% is obligatory, but donating 50% is heroic; failing to be a hero is not a moral failure.

  **The thing I'm missing**
  You are likely conflating "morality" with "consequentialism." This argument is devastating for utilitarianism, but it holds much less water for virtue ethics or deontology, which do not require maximization. The further question you should ask is not "Does morality demand too much?" but "Is my roommate's version of morality the only version available?"
