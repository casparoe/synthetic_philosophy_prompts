answer: |-
  Dear Friend,

  It is a pleasure to hear from you and to engage with such a thoughtful query regarding the philosophy of action. The example you describe is indeed a classic, and it is no surprise that it has lodged itself in your memory, for it captures something deeply unsettling about the nature of routine and competence. The insect in question is the sphex wasp, often cited from the works of the French entomologist Jean-Henri Fabre, though in philosophical circles the behaviour has been immortalised under a specific label. The term you are looking for is sphexishness, coined by the cognitive scientist and philosopher Douglas Hofstadter, and subsequently adopted and refined by Daniel Dennett. It serves as a shorthand for that specific structural failure of agency where an organism possesses a complex, goal-directed routine that is nonetheless brittle in the face of perturbation, causing it to repeat steps that have been rendered obsolete by changed circumstances.

  While the biological classification for this behaviour is a fixed action pattern, the philosophical concept of sphexishness is distinct in that it highlights the informational disconnect rather than merely the physiological mechanism. To delineate it properly, one must distinguish it from the neighbouring notions you mentioned. A reflex is too simple and immediate to bear the structure of a plan; it is a direct stimulus-response arc without intermediate steps that can be interrupted or reordered. A habit, by contrast, is usually learned and retains a degree of plasticity; if a human being develops a habit of checking the door lock, they can usually be persuaded to stop if shown it is unnecessary, whereas the sphex wasp cannot learn from the immediate repetition of its futile inspection. Compulsion is perhaps the closest analogue in human psychology, yet it differs crucially because compulsion typically involves an internal conflict or awareness that the action is irrational, whereas the sphexish agent feels no conflict and registers no irrationality. The wasp is not fighting an urge; it is simply executing a script that lacks a conditional check for whether the script's prerequisites have already been met.

  This pattern extends well beyond entomology, as you suspect. In software engineering, this is akin to a program that re-queries a database for a value it has already stored in a variable, or a loop that fails to update a termination condition. In human affairs, it manifests in bureaucratic rigidity where forms are processed despite missing information that was previously supplied, or in social rituals where we ask how someone is without listening to the answer. The defining boundary of sphexishness is not the complexity of the behaviour, but the failure of feedback integration. The agent detects the change, in the sense that it reacts to the moved cricket by dragging it back, but it does not integrate that detection into the higher-level plan regarding the burrow inspection. It treats the inspection as a necessary precondition every time, rather than as a state-dependent requirement.

  Regarding your question on freedom, this is where the concept bears the most weight, though one must be careful not to draw the line too sharply. Exhibiting sphexishness certainly marks a limit on agency, for an agent that cannot adjust its means to its ends in light of new information is hardly acting freely in any robust sense. However, it would be too quick to say that the mere absence of sphexishness constitutes free will. Humans are capable of sphexish behaviour just as much as wasps, particularly when under stress, fatigue, or cognitive load, yet we do not thereby cease to be moral agents entirely. Dennett argues that freedom is not a metaphysical property of being uncaused, but an evolutionary achievement of increasing flexibility and avoidability. On this view, the wasp is unfree because it cannot avoid the outcome even when the environment changes, whereas a free agent is one who has evolved layers of control that allow them to override lower-level routines. Thus, lacking sphexishness is a necessary condition for the kind of flexibility free action requires, but it is not sufficient on its own to guarantee freedom, since one might avoid rigid routines yet still be determined by other factors such as manipulation or ignorance.

  Ultimately, the value of the concept lies in its ability to grade agency rather than binaryise it. It suggests that freedom is not a switch that is either on or off, but a capacity that comes in degrees, measured by how well an organism can protect its goals from environmental noise. The sphex wasp is competent, but its competence is local and fragile; it works only in the niche for which it was designed. When we recognise sphexishness in ourselves or our systems, we are identifying a point where our own competence has become local and fragile, and where the illusion of purposeful action masks a underlying mechanical rigidity. I hope this helps to place the example you recalled and provides the conceptual boundaries you were seeking for your work.

  Yours sincerely,

  A Correspondent
