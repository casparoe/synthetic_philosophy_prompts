prompt: |-
  I'm captain of my school's quiz team and we keep dropping points because whenever we're split on a factual two-option question, we just go with whoever argues loudest. After practice I had a row with my mate because I said we should settle those by majority vote: if most of us think it's A, we answer A, since five people who each know the topic a bit should beat one person. He said that's not always true. His point was that if we all read the same textbook or heard the same rumour, our votes arent really five independant opinions, they're basically one opinion counted five times, so a majority can be confidently wrong together (like how a whole class shares the same misconception). He also did some probability thing with n-choose-k and said that if each of us is only just better than random, five people voting gives you only a tiny edge, and if we're actually worse than random the majority vote makes things worse, not better. I sort of see it, but I also feel like majority rule has to beat letting the loudest person decide, and I'm meant to set the rule before our next tournament.

  Can you walk me through when majority rule actually works for a group trying to get a factual yes/no or two-option question right? Is my mate's correlated-votes worry a real objection, and does it matter how much better than chance each person is, or how big the group is? I want the actual reasoning, not just a rule of thumb. Please write the answer in British English, and also tell me what would change your mind: which assumption in your reasoning, if it turned out false, would make you give the opposite advice.
