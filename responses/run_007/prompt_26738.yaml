answer: |-
  Right, let's sort this out properly. You're in a tricky spot because, technically, your mate is sharper on the theory than you gave him credit for, but you're likely still right about the practical solution. He's essentially describing the limits of **Condorcet's Jury Theorem**, and his worries about correlation are statistically valid. However, in the context of a school quiz team, his conclusion that majority vote shouldn't be used is probably too pessimistic.

  Here is the actual reasoning on when majority rule works, why your mate's objection matters, and why you should probably stick with your plan, provided you tweak it slightly.

  ### The Mathematics of Majority Rule

  To understand if five heads are better than one, we look at Condorcet's Jury Theorem. It calculates the probability that a majority vote yields the correct answer based on two critical variables: **Competence ($p$)** and **Independence**.

  **1. Competence ($p$)**
  Let $p$ be the probability that any single team member gets the answer right.
  *   If $p = 0.5$, you are guessing. A majority vote of five guessers gives you exactly a 50% chance. There is no gain.
  *   If $p < 0.5$, your team is systematically wrong (worse than random). In this case, the majority vote actually **reduces** your accuracy. You would be better off picking one person at random or even doing the opposite of the majority.
  *   If $p > 0.5$, the majority vote improves accuracy.

  For a team of five ($n=5$), the probability the majority is correct is the sum of the probabilities that 3, 4, or 5 people are right. Using the binomial distribution:
  $$P(\text{Majority Correct}) = \binom{5}{3}p^3(1-p)^2 + \binom{5}{4}p^4(1-p)^1 + \binom{5}{5}p^5$$

  If your average team member is only slightly better than random, say $p = 0.6$ (60% accuracy), the majority accuracy rises to roughly **68%**. That is a tangible gain. If $p = 0.7$, the majority accuracy jumps to **83%**. So, mathematically, as long as your team is collectively competent, majority rule amplifies that competence.

  **2. Independence (Your Mate's Objection)**
  This is where your mate is spot on. The formula above assumes every vote is **independent**. It assumes that if Person A gets it wrong, that doesn't make it more likely that Person B gets it wrong.

  In a school team, this assumption is often violated. You likely study from the same textbooks, listen to the same teachers, and share the same cultural references. If there is a common misconception (e.g., everyone thinks the capital of Australia is Sydney), your votes are **correlated**.
  *   If correlation is perfect ($\rho = 1$), you don't have five opinions; you have one opinion counted five times. The majority accuracy stays at $p$ (60% in our example), not 68%.
  *   If correlation is high, the "wisdom of the crowd" collapses.

  ### Majority vs. The "Loudest Voice"

  You need to compare Majority Rule not against a perfect oracle, but against your current method: "Whoever argues loudest."

  The "Loudest Voice" method relies on **confidence**, not competence. Psychological research (specifically regarding the Dunning-Kruger effect) shows that confidence is often poorly correlated with accuracy. In fact, on difficult factual questions, the person arguing most loudly is often the one who is most confidently wrong.

  By switching to majority vote, you are discarding the "confidence" signal and aggregating the "information" signal. Even if your votes are somewhat correlated, they are rarely *perfectly* correlated. One person might have read a different article; another might remember a documentary. Majority vote captures those slivers of independent knowledge. The "Loudest Voice" method ignores them entirely.

  Therefore, unless your team's average competence is below 50% (which would be disastrous for a quiz team), Majority Rule is statistically superior to deferring to the most assertive person.

  ### The Verdict and Recommendation

  Your mate is right that majority rule isn't a magic wand, specifically because of the correlation risk. However, he is wrong to imply it shouldn't be used. It is still better than your current method.

  **The Rule:** Implement majority vote, but add a **"Silent Vote"** protocol.
  Before anyone argues, everyone must write down their answer on a scrap of paper. Only reveal them once everyone has committed. This prevents the "loudest" person from anchoring the group's opinion before the vote is cast, preserving as much independence as possible.

  ### What Would Change My Mind

  You asked what assumption, if proven false, would make me give the opposite advice (i.e., tell you to abandon majority rule).

  The critical assumption is **Conditional Independence**.

  If it turned out that your team's errors are **perfectly correlated**—meaning you all share the exact same knowledge base and the exact same blind spots with zero variation—then majority rule provides **zero statistical advantage** over picking a single person. In that specific scenario, the time spent debating and voting is wasted energy. If you know for a fact that you all study from the exact same single source and never consume outside information, my advice would change: you should identify the single most accurate team member historically and simply defer to them every time, as aggregating five identical copies of their brain adds no value.

  However, in reality, there is almost always some variation in what five different students remember. Therefore, the independence assumption holds enough water to make majority vote the winning strategy.

  **Summary for your team:**
  Tell your mate you've checked the maths. He's right about the correlation risk, which is why you'll vote silently to protect independence. But unless you're all consistently worse than random guessers, five weak signals are still stronger than one loud one. Stick with the majority.
