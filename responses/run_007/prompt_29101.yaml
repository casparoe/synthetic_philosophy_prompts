      *   *Position B: Omissions are Not Causes (Process/Conservation View).* Causation requires energy transfer or a physical process. "Nothing" cannot transfer energy. Omissions are just background conditions or explanatory tools, not ontological causes.
      *   *Position C: Pragmatic/Contextual View.* Whether we call it a cause depends on norms, expectations, or the specific model we are using.

