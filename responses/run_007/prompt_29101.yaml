      *   *Position A (Omissions are Causes) $\rightarrow$ Counterfactual Debugging/Model Checking.* In model checking, if removing a constraint (or adding a missing check) changes the reachability of an error state, the absence of that check is a cause. In debugging, "The null pointer caused the crash" is standard parlance. The *absence* of initialization is the bug.
      *   *Position B (Omissions are Not Causes) $\rightarrow$ Execution Traces/Bytecode.* At the hardware/bytecode level, only positive instructions execute. You can't point to an opcode that *didn't* run as the active agent. The CPU only processes what *is* there. The "missing else" is just falling through to the next instruction; the "cause" of the state is the previous instruction pointer update, not the missing code.
      *   *Position C (Pragmatic) $\rightarrow$ Specification vs. Implementation.* A "bug" only exists relative to a spec. If the spec says "handle X" and code doesn't, it's a bug (causal omission). If the spec is silent, it's undefined behavior (not a bug).

  4.  **Drafting the Translation (Iterative Refinement):**
