      *   *Refining Position B:* Call it "Operational Semantics/Trace Theory." Causation is a chain of state transitions $\sigma_0 \to \sigma_1 \to \dots$. An omission isn't a transition. It's a gap in the source, but the runtime only sees the path taken.
