prompt: |-
  Construct a thought experiment to the following specifications.

  The case should be a decision problem in which causal decision theory and evidential decision theory recommend the same action, but the style of reasoning that supports paying in a counterfactual mugging—reasoning that evaluates a decision procedure by its performance across logically correlated counterfactuals rather than by the expected utility of the act at the decision node—recommends a different action. That is, CDT and EDT align; the counterfactual-mugging logic dissents.

  Constraints. No perfect predictors: any predictor in the story may be no better than a shrewd human. No Omega, no Laplace's demon, no exotic physics. The scenario should be set in an ordinary domain—a business negotiation, a personal relationship, an institutional decision, or the like—and should be no longer than a paragraph. The structure must be transparent enough that the divergence can be demonstrated step by step without appeal to formalism the reader does not already possess.

  After presenting the scenario, provide the following.

  (a) The CDT reasoning. Show the agent's causal expected utility calculation and state which action it recommends.

  (b) The EDT reasoning. Show the evidential expected utility calculation and explain why it agrees with CDT in this case.

  (c) The counterfactual-mugging-style reasoning. Show how an agent who evaluates the output of their decision function across the relevant counterfactual scenarios would assess the choice, and state which action that reasoning recommends. Explain why it diverges from the CDT/EDT verdict even though those two theories agree.

  (d) A diagnosis. Identify the single structural feature of the case that causes the policy-level or function-level reasoning to peel off from the act-level reasoning. What is it about the causal and evidential structure of the problem that makes CDT and EDT coincide while the counterfactual-mugging logic points elsewhere?

  (e) A removal check. If that structural feature is eliminated, what does the case become? Does it collapse into a standard Newcomb problem, into a straightforward dominance argument, or into something else? Show what each of the three styles of reasoning says after the removal.

  (f) A note on resistance. How would a defender of CDT or EDT push back against the counterfactual-mugging-style argument in this case? Would they deny that the case is decision-relevant, argue that the policy-level reasoning equivocates between acting and precommitting, or take some other line? Be specific to the case you constructed.

  The point of the exercise is to isolate the logical feature that makes counterfactual mugging challenging for act-based decision theories, and to show that it can arise even when CDT and EDT happen to agree—so that the disagreement is not merely between CDT and EDT but between act-based theories and function-based theories more broadly.
reasoning: |-
  Here's a thinking process that leads to the suggested thought experiment:

  1.  **Analyze the Request:**
      *   **Goal:** Construct a thought experiment (decision problem).
      *   **Condition 1:** Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) must recommend the *same* action.
      *   **Condition 2:** "Counterfactual-mugging logic" (Functional Decision Theory - FDT, or Updateless Decision Theory - UDT style reasoning) must recommend a *different* action.
      *   **Constraint 1:** No perfect predictors (Omega, etc.). Predictors must be fallible (shrewd human level).
      *   **Constraint 2:** Ordinary domain (business, relationship, etc.).
      *   **Constraint 3:** Length limit (one paragraph for the scenario).
      *   **Output Requirements:** (a) CDT reasoning, (b) EDT reasoning, (c) FDT/UDT reasoning, (d) Diagnosis of the structural feature, (e) Removal check, (f) Note on resistance.
      *   **Core Philosophical Point:** Isolate the feature where act-based theories (CDT/EDT) agree but diverge from function-based theories (FDT/UDT), specifically highlighting the "logical correlation" aspect without needing supernatural prediction.

  2.  **Deconstruct the Decision Theories:**
      *   **CDT:** Chooses based on causal consequences of the *act*. $E[U] = \sum P(S|do(A)) U(S, A)$. Ignores correlations that aren't causal.
      *   **EDT:** Chooses based on evidence the *act* provides about the state. $E[U] = \sum P(S|A) U(S, A)$. Susceptible to "Newcomb-like" problems where the act correlates with the state via a common cause.
      *   **FDT/UDT (Counterfactual Mugging Logic):** Chooses based on the output of the *decision function*. It considers logical correlations between the agent's decision algorithm and the predictor's simulation or model of that algorithm, even if no causal link exists *at the time of decision*.
      *   **The Challenge:** Usually, CDT and EDT disagree in Newcomb problems. In standard Counterfactual Mugging, CDT says "Don't Pay" (no causal impact on past coin flip), EDT says "Don't Pay" (coin already flipped, paying gives no info), FDT says "Pay" (to ensure the counterfactual where the coin was heads yields a reward).
      *   **Wait, the prompt asks for CDT and EDT to *agree* against FDT.**
      *   In standard Counterfactual Mugging:
          *   Coin is Tails (actual world).
          *   Omega asks for \$100.
          *   If Omega predicted you would pay, he would have given you \$10,000 (if Heads). But it's Tails.
          *   CDT: Paying costs \$100, gains nothing. Don't pay.
          *   EDT: Paying costs \$100, gains nothing (coin is already Tails). Don't pay.
          *   FDT: If my algorithm says "Pay", then in the counterfactual where Coin=Heads, Omega predicts "Pay" and I get \$10,000. Net expected value of algorithm is positive. Pay.
      *   *Problem:* This fits the "CDT/EDT agree, FDT disagrees" criteria perfectly.
      *   *Constraint Check:* "No Omega, no perfect predictors." Standard Counterfactual Mugging relies on a perfect predictor to establish the logical link. I need to replicate the *structure* of logical correlation using fallible predictors in an ordinary setting.

  3.  **Drafting the Scenario:**
      *   *Idea:* A business negotiation where reputation matters.
      *   *Setup:* Two partners, Alice and Bob. They are similar thinkers (isomorphic decision processes).
      *   *The Twist:* We need a situation where the *act* doesn't change the outcome causally or evidentially *in the actual world*, but the *policy* determines a payoff in a counterfactual world that affects the overall expected utility of the algorithm.
      *   *Refining for "No Perfect Predictor":* Instead of Omega predicting the future, use a partner who models the agent based on shared background/training.
      *   *Scenario:* A "Handshake Deal."
      *   *Details:* You and a rival firm (run by someone with your same business school training) are bidding on a contract. The contract has two phases. Phase 1 is already decided (you lost/won based on a coin flip unknown to you? No, needs to be known).
      *   *Let's try the "Transparent Negotiation" angle.*
      *   *Scenario:* You are negotiating a settlement with a counterpart, Sam. Sam is known to use the same negotiation heuristic you were taught in law school. The judge has already flipped a coin to determine if the case is "High Value" or "Low Value," but neither of you knows the result yet. However, Sam has already submitted his offer based on his prediction of your response. If the case is High Value, Sam offers \$1M if he predicts you will concede; otherwise \$0. If Low Value, Sam offers \$0 regardless. You are now asked to concede (costing you \$10k in fees) or fight. The coin came up Low Value.
      *   *Critique:* If the coin is Low Value, Sam offered \$0 regardless. Conceding costs \$10k. Fighting costs \$0. CDT/EDT say Fight. FDT says Concede? Why? Because if your algorithm says Concede, Sam (modeling you) would have predicted that. But Sam already acted.
      *   *Wait, the prompt says "No perfect predictors... shrewd human."*
      *   *Key Structural Feature:* The correlation must be *logical* (same source code/heuristic), not causal.
      *   *Revised Scenario:* **The Twin Heuristic.**
      *   You and a colleague, Jordan, were trained in the same aggressive negotiation program. You are separated. A client flips a fair coin. If Heads, the client offers Jordan a \$100,000 bonus *if* Jordan predicts you will send a \$1,000 gift. If Tails, Jordan gets nothing regardless. The coin landed Tails. Jordan, knowing the training, predicts your move. You are now asked to send the gift. Sending costs \$1,000. Receiving is impossible (it's Tails).
      *   *CDT:* Sending costs \$1k, gains \$0. Don't send.
      *   *EDT:* Sending costs \$1k. Does it correlate with Heads? No, coin is already flipped and Tails. Don't send.
      *   *FDT:* My decision function determines the gift. Jordan's prediction is a simulation of my function. If my function outputs "Send", Jordan predicts "Send". In the counterfactual where Coin=Heads, Jordan gets the bonus and shares it (or I get a reputation boost?).
      *   *Need to ensure the payoff exists in the counterfactual.*
      *   *Let's make it a "Pre-Commitment Reputation" case.*
