answer: |-
  You have stumbled directly onto the graveyard of the Simple Conditional Analysis (SCA) of dispositions. This triad of cases is the central engine that drove the metaphysics of dispositions from the mid-90s onward. You are looking for the distinction between **Masking**, **Finkishness**, and **Mimicking**.

  While you asked for more than just labels, the labels are necessary to navigate the literature (C.B. Martin, David Lewis, Stephen Mumford, Alexander Bird, Sungho Choi). But more importantly, you want the "carving"—the metaphysical principle that separates them.

  Here is the breakdown of the distinction, the principle for telling them apart, and how the distinction holds up under pressure.

  ### 1. The Taxonomy of Failure

  You identified two failure modes for the conditional "If $S$, then $M$" when the disposition $D$ is present, and one failure mode where $D$ is absent.

  1.  **The Foam Case (Masking):** The object has the categorical base for fragility. The stimulus occurs. The manifestation is prevented by an interfering factor (the foam).
      *   *Status:* $D$ is present. Conditional is False.
  2.  **The Rigged Case (Finkish Disposition):** The object has the categorical base for fragility. The stimulus occurs. The stimulus itself triggers a mechanism that removes the categorical base *before* the manifestation can occur.
      *   *Status:* $D$ is present (initially). Conditional is False.
  3.  **The Mirror Case (Mimicking / Finkish Lack):** The object lacks the categorical base for fragility. The stimulus occurs. The stimulus triggers a mechanism that *installs* the base just in time for the manifestation.
      *   *Status:* $D$ is absent (initially). Conditional is True.

  ### 2. The Carving: Persistence of the Categorical Base

  You asked if they are "really as different as they feel." The consensus in the literature is **yes**, but the difference isn't about the outcome (shattering vs. not shattering); it is about the **causal history of the categorical base**.

  Most dispositional realists hold that a disposition $D$ is grounded in a categorical base property $B$ (e.g., the molecular lattice structure of the glass).

  *   **In Masking:** The stimulus $S$ leaves $B$ intact. The causal chain from $B + S \rightarrow M$ is interrupted *externally* or *downstream*. The disposition is "ready to fire" but is handcuffed.
  *   **In Finkishness:** The stimulus $S$ causally interacts with $B$ such that $B$ is destroyed or altered *before* it can produce $M$. The disposition is "unloaded" before the trigger is pulled.
  *   **In Mimicking:** There is no $B$ initially. $S$ causes a new $B^*$ to come into existence, which then produces $M$.

  **The Principle:** To distinguish them, you must track the **persistence of the base property $B$ through the application of the stimulus $S$.**
  *   If $B$ persists through $S$ but $M$ fails: **Masking**.
  *   If $B$ is lost *because of* $S$ before $M$ can occur: **Finkishness**.
  *   If $B$ is absent, but $S$ creates $B$ leading to $M$: **Mimicking**.

  ### 3. Internal vs. External Interference

  You asked: *Does the distinction survive cases where the blocker is internal to the object rather than external?*

  Yes. The location of the interferer is metaphysically secondary to its relation to the base.

  *   **Internal Masking:** Consider a poison (disposition: to kill). If the victim has an antidote already circulating in their blood that neutralizes the poison *after* ingestion but *before* death, the poison's toxicity is masked. The chemical base of the poison is still there, but its causal power is inhibited by another internal property.
  *   **Internal Finkishness:** Consider a neuro-disposition: "If stimulated by thought $X$, neuron $N$ fires." Suppose neuron $N$ has a self-preservation mechanism where the electrical surge of thought $X$ instantly severs the axon of $N$. The stimulus itself destroys the physical base required for the firing.

  In both internal cases, the carving holds. In the masking case, the poison's structure remains; in the finkish case, the neuron's structure is destroyed by the stimulus.

  ### 4. The Trigger Condition

  You asked: *Does it matter that the interference is triggered by the very same stimulus that's supposed to trigger the manifestation?*

  This is the **defining feature of Finkishness**.

  If the glass becomes tough *randomly* five seconds before you drop it, that is just a fleeting disposition. It was fragile, then it wasn't. The conditional "If dropped, it would shatter" is false, but not because of a philosophical puzzle; it's just false because the object changed.

  **Finkishness** is specifically problematic for the Conditional Analysis because the *truth conditions* of the conditional undermine the *truth makers* of the disposition. The analysis says: "To be fragile is to be such that if dropped, you break." But in the finkish case, the act of checking the condition (dropping) removes the property (fragility) that makes the condition true.

  So, yes: For a case to be properly "Finkish," the stimulus must be the cause of the loss of the base. If the loss is independent, it's just a change in properties over time.

  ### 5. Messy Cases and the "Principle of Distinction"

  You asked: *When cases get messy, what's the principle for telling the two apart?*

  This is where the current debate lies (see work by **Sungho Choi** and **Alexander Bird**). The line can blur when the "base" is not a static structural property but a dynamic process.

  **The Test:** Ask, "Does the object retain the *power* to manifest, or just the *structure*?"

  *   **Scenario:** A glass is wrapped in foam (Masking).
  *   **Scenario:** A glass is made of a material that hardens instantly upon impact (Finkish?).

  Here is the litmus test: **Counterfactual Dependence of the Base.**
  Hold the stimulus fixed. Ask: "In the nearest possible world where the interfering mechanism is disabled, does the manifestation occur *via the original base*?"

  1.  **Masking:** Disable the foam. The glass shatters *in virtue of the same molecular structure* it had when wrapped.
  2.  **Finkish:** Disable the rigging device. The glass shatters. But with the device *active*, the molecular structure *changed*.
  3.  **Mimicking:** Disable the rigging device. The glass *does not* shatter (because it never had the base to begin with).

  **The Hard Case:** What if the "foam" is a force field generated by the glass's own molecular bonds that activates under stress?
  *   If the bonds remain the same but emit a field: **Masking** (Internal).
  *   If the bonds rearrange to create the field: **Finkish**.

  The distinction relies on your theory of the **Categorical Base**. If you are a Humean and deny categorical bases, this distinction collapses (which is why Humeans often try to absorb finkish cases into the context of the conditional). If you are a Realist about powers, the base is the anchor.

  ### 6. The Philosophical Payoff

  Why does this carving matter? Because it dictates how you fix the Simple Conditional Analysis.

  *   **David Lewis's Solution (Reformed Conditional Analysis):** Lewis tried to save the conditional analysis by adding a "ceteris paribus" clause: "If $S$ were to occur, and $D$ were to *remain* until $M$ occurs, then $M$ would occur." This explicitly rules out Finkishness but struggles with Masking.
  *   **The Powers Ontology Solution (Mumford, Bird, Molnar):** Most dispositionalists take these cases as proof that **dispositions cannot be analyzed as conditionals.** Instead, conditionals are merely *evidence* for dispositions. The disposition is a real, irreducible property (a power) that *grounds* the conditional but is not *defined* by it.
      *   In the Finkish case, the power exists but is "finked."
      *   In the Masking case, the power exists but is "masked."
      *   The conditional fails, but the ontology remains intact.

  ### Summary for your work

  1.  **Names:** Masking, Finkishness, Mimicking.
  2.  **Carving:** Track the **Categorical Base**.
      *   Masking: Base persists, causal chain blocked.
      *   Finkish: Base destroyed by stimulus.
      *   Mimicking: Base created by stimulus.
  3.  **Internal/External:** Irrelevant to the classification; relevant only to the mechanism.
  4.  **Stimulus-Trigger:** Essential for Finkishness/Mimicking; accidental for Masking.
  5.  **Principle:** Counterfactual dependence of the manifestation on the *original* base property.

  If you are writing a paper, the critical pivot point is usually whether you think the "base" is a static structural property or a dynamic process. If it's dynamic, Masking and Finkishness begin to look like points on a spectrum of **causal interference**, which is a fertile ground for original contribution. (See: *Choi, S. (2008). Dispositional properties and counterfactual conditionals.*)
