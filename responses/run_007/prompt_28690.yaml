  I'm a software engineer with no philosophy background. Restate Schopenhauer's theory of music in the vocabulary I actually use — objects and references, pointers and the things they point to, interfaces and implementations, serialisation and deserialisation, layers of abstraction, direct memory access — as faithfully as you can. The position, as I've had it explained to me: the arts are ranked by which grade of nature's underlying striving they represent, and music is the odd one out because it doesn't represent the Ideas (the fixed templates at each grade) at all; it's a direct copy of the Will itself, the thing everything else only represents at one remove. Translate that into my vocabulary, then give me the residue report: which parts map cleanly onto something like reading a pointer directly versus reading a serialised copy, which parts you had to fudge, and which parts have no counterpart in how I talk about code. I want to know whether Schopenhauer's distinction is basically just direct access versus representation, and whether the bits that won't translate are a limitation of my vocabulary or a sign that the original claim was murkier than it looks. British English please.
