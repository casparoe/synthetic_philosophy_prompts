  *(Final thought on the "Losing Side"):* If I recommend Listing, the "Losing Side" is the "Don't List" group. Their strongest argument is legal risk based on taxonomic rigor. I must acknowledge that if we call this a "species," we will likely lose in court. That is why we use the "Distinct Population" pathway.

  *(Final thought on the "Chair's View"):* The Chair wants to define 'species' relative to the question. I will incorporate this by suggesting the Commission adopt a policy that "For the purposes of this Act, 'species' includes Distinct Population Segments meeting criteria X, Y, Z." This operationalizes the Chair's view.

