answer: |-
  **MEMORANDUM**

  **TO:** State Fish and Wildlife Commission
  **FROM:** Science Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Listing Determination for Glassy Dace (*Hyborhynchus vitreus*)

  **Recommendation**
  The Science Advisory Committee recommends **listing the southern cluster of the glassy dace as a Distinct Population** under the separate population clause of the state Endangered Species Act (ESA), rather than as a full species. We further recommend the Commission adopt a formal policy defining "Distinct Population" for future listings to insulate decisions from taxonomic litigation.

  **Scientific Rationale**
  The southern glassy dace cluster represents a diagnosable, ecologically distinct lineage facing imminent extinction risk due to groundwater depletion. While morphologically cryptic, the population is genetically diagnosable and exhibits unique adaptive traits (spawning temperature and salinity tolerance) diverged over ~10,000 years of separation.

  However, the biological status of this group is complex. Under the **Biological Species Concept (BSC)**, the ongoing (albeit low) gene flow and fertile hybridization in the wild argue against full species status. Under the **Phylogenetic Species Concept (PSC)**, the southern population's paraphyly (being more closely related to a neighboring species than to the northern glassy dace) complicates a clean taxonomic split.

  Consequently, we cannot scientifically certify this group as a "species" without acknowledging significant ambiguity. However, the statutory authority to list "distinct populations" does not require monophyly or reproductive isolation. It requires distinctness and significance. The southern cluster meets these criteria: it is diagnosable, ecologically unique, and represents a significant portion of the taxon's adaptive diversity.

  **Assessment of the Opposing View**
  Committee members advising against listing raise a critical point that must be acknowledged: **taxonomic stability is a prerequisite for legal defensibility.** Their argument is that listing a paraphyletic group with ongoing gene flow invites the exact litigation that hampered the Commission previously. If we list this as a "species," plaintiffs can correctly argue that the taxonomy is unresolved and the biological boundaries are porous. This is not a trivial concern; a court ruling that overturns a listing based on taxonomic error could set a precedent that weakens protection for *all* listed taxa. We agree that designating this group a "species" creates unnecessary legal vulnerability.

  However, the conclusion that we therefore *cannot list* ignores the "distinct population" clause. The conservation intent of the ESA is to prevent the loss of evolutionary diversity, not to police Linnaean categories. Refusing to list because the unit is an "ecotype" rather than a "species" prioritizes nomenclature over biodiversity.

  **Policy Recommendation: Adopting a General Framework**
  To prevent this debate from paralyzing every future spring-fish listing, the Committee advises **against** adopting rigid numerical thresholds for gene flow or strict requirements for monophyly. Nature rarely adheres to bright lines; setting a rule (e.g., "less than 5% gene flow") will inevitably exclude valid conservation units or include invalid ones as data improves.

  Instead, the Commission should adopt a **pluralistic operational framework** for "Distinct Population Segments" (DPS). This framework should evaluate:
  1.  **Discreteness:** Is the population markedly separated from other populations (genetically, ecologically, or geographically)?
  2.  **Significance:** Does the population represent an unique evolutionary legacy or adaptive potential?

  **Philosophical Commitment**
  Adopting this framework commits the Commission to a philosophy of **Pragmatic Realism**. This view acknowledges that while evolutionary lineages are real, the boundaries we draw around them are human conventions designed for specific purposes. In taxonomy, the purpose is classification; in conservation law, the purpose is the preservation of biodiversity and evolutionary process.

  By defining listable units relative to the *legal question* (preservation of diversity) rather than the *taxonomic question* (naming of types), we align the science with the statute's intent. This allows us to protect the southern glassy dace not because we have solved the species problem, but because we have identified a unique, threatened component of the state's natural heritage that the law was written to save.

  **Action Required**
  1.  Vote to list the southern glassy dace cluster as a Distinct Population.
  2.  Initiate rulemaking to codify the DPS discreteness/significance framework for future listings.
