  1. **(2) He first judges that the situation falls under a general permission to favor one's spouse.**
  This reconstruction is most vulnerable because it explicitly mediates the rescue through a prior calculation of impartial moral permissions, which is the precise target of Williams's critique.

  2. **(3) He saves her because he has adopted a policy of giving special weight to his personal commitments.**
  This case is highly vulnerable because it treats personal commitments as a standing policy to be consulted, thereby intellectualizing the relationship into a rule-governed decision rather than a direct response.

  3. **(4) He acts immediately but later justifies his action by invoking an impartial rule.**
  This reconstruction is moderately vulnerable because, while the action itself escapes the charge by being immediate, the agent's reliance on an impartial rule for justification reveals a defect in self-understanding without corrupting the motivation.

  4. **(5) He acts immediately and, when pressed, says only that she is his wife.**
  This case is minimally vulnerable since the action is immediate and the explanation cites the factual relationship itself rather than subsuming it under a moral principle.

  5. **(1) The man acts on the unreflective thought that it is his wife.**
  This reconstruction is least vulnerable because it perfectly captures Williams's ideal where the unreflective recognition of the loved one motivates the action without any intervening moral thought or justification.

  **Analysis of Objections and Justification**
  The "one thought too many" objection is not a general rejection of moral principles as such, but a specific claim that impartial moral reasoning is alienating when it displaces the direct motivations of love and personal commitment in intimate contexts. Regarding justification, a post hoc appeal to an impartial rule does not create the *same* defect as a motivating thought at the time of action; while the former indicates a philosophical confusion about the ground of the action, only the latter undermines the integrity and praiseworthiness of the act itself by interposing a moral calculation between the agent and their loved one.
