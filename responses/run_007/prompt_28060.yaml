answer: |-
  Your intuition that this debate persists due to empirical equivalence is correct, but characterizing it merely as an aesthetic preference overlooks the specific structural role it plays in metaphysics. This is not a verbal dispute about the definition of "object," because both sides generally agree on the ordinary language usage while disagreeing on the **truthmakers** required to ground those statements; rather, it is a **methodological stalemate over how to weight competing theoretical virtues** in a domain where empirical evidence is silent.

  The debate continues because there is no neutral metric for deciding whether "compatibility with Special Relativity" (favoring perdurantism) outweighs "fidelity to phenomenological intuition" (favoring endurantism), or whether "qualitative parsimony" (fewer kinds of entities) outweighs "quantitative parsimony" (fewer total entities). Each new paper attempts to tip the scales by showing that one side incurs a hidden cost on a specific virtue (e.g., arguing that perdurantism fails to account for moral responsibility, or that endurantism cannot handle vagueness), but since the virtues themselves are contested, no knockout blow is possible.

  Given this diagnosis, progress does not look like a decisive victory for one side, but rather takes two forms: first, a **mapping of trade-offs** that clarifies exactly what ontological commitments are required to secure specific theoretical benefits (which has largely been achieved); and second, a **metaontological shift** where philosophers stop asking which theory is "true" and start asking which framework is more useful for specific philosophical projects (conceptual engineering). Until the discipline agrees on a hierarchy of theoretical virtues, or dissolves the question as framework-relative, the debate will remain a productive but unresolved tension between competing models of reality.

  This is a methodological dispute over how to weight competing theoretical virtues in the absence of empirical adjudication, rather than a factual disagreement about the world.
