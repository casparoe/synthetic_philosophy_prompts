      *   *Nuance:* Watts's vampires *do* have self-models. Sarasti knows he is a vampire. Does he have a HOT about his visual state? Watts says no, he processes visual data without "seeing" it.
      *   *Key Distinction:* HOT distinguishes between *transitive consciousness* (consciousness *of* something) and *intransitive consciousness* (being awake). Watts mixes these or focuses on the phenomenal aspect of transitive consciousness.
      *   *Crucial Point:* The "Sarasti Paradox." If Sarasti can say "I am not conscious," he is representing his own state. A HOT theorist would argue this makes him conscious *by definition*. This is the strongest point of tension. Watts needs Sarasti to be a "philosophical zombie" who can introspect. HOT says introspection *is* consciousness.

