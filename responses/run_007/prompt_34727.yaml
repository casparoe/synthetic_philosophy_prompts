      *   **Conclusion:** The novel assumes P-Consciousness (qualia) is the target. HOT defines consciousness as Access + Meta-representation. The novel talks past HOT on the definition but pressures it on the evolutionary claim and the possibility of complex cognition without meta-representation.

  6.  **Refining the Argument (Self-Correction during drafting):**
