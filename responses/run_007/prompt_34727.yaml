      *   **The Goal:** A careful reading that respects both the text and the philosophy. Identify points of tension, agreement, and where the novel might talk past HOT. Identify specific scenes/characters.
      *   **Constraint:** Do not strawman either side. Focus on whether the novel puts pressure on HOT or just uses a different definition.

  2.  **Analyze *Blindsight*'s Conception of Consciousness:**
      *   Watts explicitly distinguishes between *intelligence* (problem solving, input-output mapping) and *consciousness* (the observer, the serial bottleneck, the "feel").
      *   Key text evidence: The "Chinese Room" discussion, Sarasti's explanation of his own nature (vampires are "awake" but not "conscious" in the human sense), the Scramblers' behavior (complex communication without sentience).
      *   Watts's definition aligns more with *Phenomenal Consciousness* (P-consciousness) as defined by Block, rather than *Access Consciousness* (A-consciousness). He treats the "witness" as a separate module that consumes energy and slows down processing.
      *   Crucial nuance: Watts suggests consciousness is a *delay*. It integrates information serially. Unconscious processing is parallel and faster.

  3.  **Analyze Higher-Order Theories (HOT):**
      *   Core claim: A mental state is conscious iff there is a suitable higher-order thought (HOT) about that state.
      *   Implication: Consciousness is relational, not intrinsic. There is no "qualia" independent of the representation.
      *   Implication for Zombies: Philosophical zombies (functionally identical but no inner life) are impossible or incoherent under strict HOT, because if you have the functional architecture (the HOTs), you *are* conscious.
      *   Rosenthal's view: Consciousness is a "mental quality" we acquire when we are aware of our states. It's not a "glow."

  4.  **Synthesize/Compare:**
      *   **Point of Agreement:** Both agree consciousness is a specific functional/cognitive add-on, not inherent to all cognition. A HOT theorist would agree that a system *without* higher-order representations is not conscious. If Watts's vampires lack HOTs, HOT agrees they aren't conscious.
      *   **Point of Tension:** Watts treats the *absence* of consciousness as compatible with *high-level complex behavior* (including linguistic communication, strategy, theory of mind). HOT generally requires that for a system to report on its states (say "I am in pain"), it must have a HOT. If the Scramblers communicate complex abstract concepts about their own internal states (which they do, in a way), do they have HOTs?
      *   **The "Zombie" Problem:** *Blindsight* relies on the conceivability of Philosophical Zombies. HOT generally denies the coherence of Zombies (if they act exactly like us, they have HOTs, so they are conscious). Watts says: "Look, here are zombies." HOT says: "If they act exactly like us, they have HOTs, so your definition of consciousness is wrong, or they aren't actually zombies."
      *   **The "Serial Bottleneck":** Watts argues consciousness is a serial integrator. HOT doesn't necessarily demand seriality, but Rosenthal often links consciousness to conceptual capacity.
      *   **Qualia:** Watts treats qualia as real things that consume energy. HOT treats qualia as how representations *seem* when we aren't aware of the mediation. If Watts says "no qualia," HOT says "then no HOTs."

