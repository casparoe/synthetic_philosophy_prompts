      *   Philosophy majors want to respect the text.
      *   The compromise: **Public Meaning.** What meaning is *available* to the public? Author intent counts only if it illuminates public meaning, not if it overrides it.

      *Case 1 Nuance:* This is the hardest. If the text reads as racist, saying "but the author meant it as critique" in the note might look like the magazine is making excuses for racism. The procedure needs to handle the *ethical risk*.
      *Decision:* The note should describe the *effect* (stereotypes present) and perhaps the *ambiguity*, but not vouch for the *success* of the critique.

