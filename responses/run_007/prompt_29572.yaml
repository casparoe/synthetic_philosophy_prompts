answer: |-
  **Title:** Covariance vs. Content: Stress-Testing the Ontology of Genetic Information

  **Introduction**

  The claim that DNA "codes" for traits is the central dogma of molecular biology, yet it remains a philosophical lightning rod. To say a molecule carries "information" is to make a category claim: are we describing a physical causal chain, or are we attributing intentional content? This paper compares two competing ontologies of genetic information. The first, the **Causal-Correlational view**, treats genetic information as natural meaning: a gene carries information about a trait insofar as the sequence and the trait covary under suitable conditions, analogous to tree rings indicating age. The second, the **Teleosemantic view**, treats genetic information as intentional content: a gene functions like an instruction or belief, possessing correctness conditions and the capacity to misrepresent.

  Rather than surveying the literature, I subject these notions to two specific stress tests: the arbitrariness of the genetic code and the phenomenon of mutational misfolding. I argue that while the causal view can absorb the arbitrariness of the code, it collapses in the face of misrepresentation. Consequently, the claim that DNA "codes" for traits is only licensed if one projects the teleological history of the organism onto the chemistry of the nucleotide.

  **Stress Test I: The Arbitrariness of the Code**

  The genetic code is degenerate and contingent; there is no chemical necessity that the codon UUU maps to phenylalanine. It is a "frozen accident." Defenders of the teleosemantic view (e.g., Maynard Smith, Godfrey-Smith) argue this arbitrariness is decisive. They contend that physical causal laws are not arbitrary; if $A$ physically necessitates $B$, the relationship is fixed by chemistry. Because the codon-amino acid mapping could have been otherwise, it resembles a linguistic convention rather than a physical law. Therefore, they argue, the causal view fails to capture the specific nature of genetic transmission.

  However, this stress test does not break the causal view as easily as semanticists suggest. The causal-correlational account (akin to Dretske's "natural information") requires only a reliable covariance, not a physically necessary one. Consider a smoke alarm: the relationship between the beep and the fire is arbitrary (we could have programmed a flash of light), yet the beep carries causal information about the fire because they covary reliably under specific conditions. The causal theorist can absorb arbitrariness as **contingent nomic regularity**. As long as the mapping is stable within the system, the gene covaries with the protein, and information is transmitted.

  The semanticist's reliance on arbitrariness is therefore insufficient to establish *content*. Arbitrariness distinguishes conventional signs from natural signs (like smoke or rings), but it does not automatically grant *truth conditions*. A traffic light's red color arbitrarily covaries with "stop," but without a system of agents who *use* that signal to guide action, it is merely a complex causal switch. Thus, the arbitrariness test favors the semantic view only if one assumes that arbitrariness implies a sender-receiver convention. The causal view survives this test by retreating to a broader definition of information as stable correlation, regardless of whether that correlation is chemically necessitated or historically contingent.

  **Stress Test II: Misrepresentation and the Mutation**

  The second stress test is more damaging to the causal view. Consider a point mutation that causes a gene to produce a protein that fails to fold, resulting in a non-functional trait.

  For the **Teleosemantic view**, this is a paradigm case of misrepresentation. The gene carries the content "fold into structure $S$." Because of the mutation, the resulting protein does not fold into $S$. The gene has "lied" or issued a faulty instruction. This requires normative force: there is a fact of the matter about what the gene *ought* to produce, derived from its selected effect history (its proper function). The mutation is an error because it deviates from the historical norm that explains the gene's presence in the genome.

  For the **Causal-Correlational view**, misrepresentation is impossible. Information is defined by actual covariance. If the mutant gene sequence reliably produces the misfolded protein, then the gene carries accurate information *about the misfolded protein*. To say the gene "misrepresented" the functional protein is to invoke a counterfactual: "It *would* have produced $S$ if things were normal." But the causal view is actualist; it looks at the physical chain present. If the mutation is heritable and stable, the new sequence simply carries information about the new trait. There is no error, only a new causal fact.

  This is the breaking point. The causal view cannot distinguish between a functional signal and a broken wire without smuggling in normative terms. If "information" is to mean anything more than "correlation," it must allow for the possibility that the correlation fails while the information persists (i.e., the message remains the same, but the outcome is wrong). The causal view denies this possibility. Therefore, if we accept that biological systems exhibit genuine error (and not just variation), the causal view is insufficient. It describes the *transmission* of the signal, but not the *fidelity* of the instruction.

  **Conclusion: Coding and Projection**

  Do these results license the claim that DNA "codes" for traits?

  If "code" implies a causal mechanism where sequence determines outcome via stable covariance, the **Causal view** suffices. However, this renders "code" synonymous with "cause," stripping it of the computational or linguistic nuance biologists intend.

  If "code" implies a system capable of error, fidelity, and function, only the **Teleosemantic view** licenses the claim. However, this comes at a cost. On the semantic reading, the information is not intrinsic to the DNA molecule. A nucleotide sequence in a test tube does not code for anything; it is merely chemistry. It only becomes a "code" when situated within a cellular context that has a history of selection—a ribosome that "interprets" the sequence and a lineage that "selected" for the outcome.

  Therefore, when we read the claim "DNA codes for traits" semantically, we are **projecting teleology onto chemistry**. We are taking the historical success of the organism (its survival and reproduction) and locating it inside the molecule as "content." The semantic notion is not a rival description of the physics; it is a description of the *evolutionary relationship* between the molecule and the lineage.

  **Reframing the Rivalry**

  I must note a caveat regarding your chosen stress tests. While misrepresentation is a valid litmus test, the **Arbitrariness test** is less effective at distinguishing these specific rivals. As noted, causal correlations can be arbitrary (e.g., a flag indicating wind direction). The deeper rivalry is not about arbitrariness, but about **normativity**.

  Furthermore, these notions are not always genuine rivals in practice; they are often complementary explanations at different levels. The causal view explains the *mechanism* of transcription; the semantic view explains the *persistence* of the sequence over evolutionary time. However, if forced to choose which notion licenses the strong claim that DNA is a "code" in the sense of containing biological *instructions*, the semantic view wins, but only by acknowledging that the "code" exists in the relationship between the gene and the selecting environment, not in the base pairs themselves. The causal view is ontologically safer but explanatorily thinner; the semantic view is explanatorily rich but ontologically projective.
