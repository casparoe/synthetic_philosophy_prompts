answer: |-
  No single theory can satisfy all intuitive constraints on collective harm, specifically because the requirement to condemn overdetermined participation conflicts directly with the requirement that obligation tracks actual causal efficacy, forcing a choice between expected utility and participatory integrity.

  ### Core Desiderata Specification

  **1. The Overdetermination Constraint (Firing-Squad Case)**
  *   **Requirement:** The theory must verdict that participating in a harmful collective act is impermissible even if the individual's contribution is causally redundant (i.e., the harm occurs regardless).
  *   **Case:** Ten shooters fire; any nine would have killed the victim. Shooter 10 abstains; victim still dies.
  *   **Label:** **Non-Negotiable** (Shared intuition across consequentialist and deontological camps; rejects the "Purist" demand for actual difference).

  **2. The Continuity Constraint (Threshold/Trigger Cases)**
  *   **Requirement:** The theory must avoid moral discontinuities where obligation flips from zero to absolute based on a microscopic change in the number of other actors.
  *   **Case:** Buying the 10,000th chicken triggers an order vs. the 9,999th does not.
  *   **Label:** **Non-Negotiable** (Common sense morality rejects moral luck based on arbitrary numerical thresholds).

  **3. The Overdemandingness Constraint (Tiny Probabilities)**
  *   **Requirement:** The theory must not obligate agents to sacrifice significant personal interests to prevent harms that are high-stakes but infinitesimally probable.
  *   **Case:** Driving a car creates a non-zero probability of catastrophic climate feedback loops; theory cannot imply one must never drive.
  *   **Label:** **Non-Negotiable** (Required to preserve agency and avoid moral paralysis; conflicts with strict Consequentialist expected utility).

  **4. The Participation/Outcome Distinction ("No Difference" vs. "Not Wrong")**
  *   **Requirement:** The theory must distinguish between an act's causal efficacy and its moral status; lacking the former cannot automatically secure the latter.
  *   **Case:** One person's emissions are a drop in the bucket (no difference), but emitting is still potentially wrong.
  *   **Label:** **Non-Negotiable** (Foundational to rejecting the "inefficacy objection").

  **5. The Ex Ante/Ex Post Distinction (Expected vs. Actual)**
  *   **Requirement:** The theory must specify whether obligation is grounded in the risk imposed at the time of action (ex ante) or the actual outcome produced (ex post).
  *   **Case:** Voting (low probability of deciding) vs. Diet (high probability of some impact, low probability of specific trigger).
  *   **Label:** **Camp-Specific** (Consequentialists demand Ex Ante expected value; Actualists/Purists demand Ex Post actual difference).

  **6. The Individual/Collective Distinction ("Us" vs. "Each")**
  *   **Requirement:** The theory must explain how a duty borne by a collective ("We ought to stop warming") translates to individuals ("I ought to fly less") without collapsing into empty collective agency or isolated individualism.
  *   **Case:** Climate change requires global coordination, but individuals act locally.
  *   **Label:** **Non-Negotiable** (Must resolve the collective action problem without dissolving individual responsibility).

  **7. The Universalizability Constraint (One-off vs. Ongoing)**
  *   **Requirement:** The theory must assess acts based on whether the maxim behind them could be sustained as a general practice without contradiction or disaster.
  *   **Case:** Voting (one-off) vs. Meat-eating (ongoing practice).
  *   **Label:** **Camp-Specific** (Kantian/Contractualist demand; Consequentialists may reject if actual outcomes diverge from universalized outcomes).

  ### Tension Map: Incompatible Pairs

  **1. The Actual Difference Principle vs. The Overdetermination Constraint**
  *   **Conflict:** You cannot hold that obligation requires making a causal difference (Purist/Actualist view) and simultaneously hold that the tenth shooter is wrong to fire when the victim dies anyway.
  *   **Resolution Cost:** Accepting the Overdetermination Constraint requires abandoning causal individualism, forcing a move toward complicity-based or expected-value theories.

  **2. Linear Expected Utility vs. The Overdemandingness Constraint**
  *   **Conflict:** If every act carries a non-zero probability of catastrophic harm (climate), multiplying tiny probabilities by infinite stakes yields high expected disutility. Strict adherence to expected utility obligates near-total abstention from modern life.
  *   **Resolution Cost:** Accepting the Overdemandingness Constraint requires discounting tiny probabilities or introducing agent-centered prerogatives, which weakens the mathematical rigor of consequentialism.

  **3. Threshold Ontology vs. The Continuity Constraint**
  *   **Conflict:** If harms actually occur only at thresholds (e.g., 10,000 burgers = 1 death), then the 9,999th buyer causes no harm. If obligation tracks harm, the 9,999th is off the hook. This creates a moral cliff edge.
  *   **Resolution Cost:** Maintaining Continuity requires treating threshold cases as probabilistic expected harms rather than binary actual harms, which reintroduces the tension with Overdemandingness.

  **4. Collective Capacity vs. Individual Obligation**
  *   **Conflict:** If the harm can only be prevented by collective action (e.g., government policy), and individual acts are futile, an individual obligation to act seems to violate "ought implies can."
  *   **Resolution Cost:** Asserting individual obligation requires decoupling "can prevent the harm" from "can do one's part," shifting the object of obligation from outcomes to participation.

  ### Final Verdict: The Pivot Requirement

  The **Overdetermination Constraint** does the most work against standard positions because it is the primary wedge used to dismantle the "inefficacy objection" (the claim that "my act makes no difference"). Standard libertarian and skeptical positions rely on the **Actual Difference Principle** to exonerate individuals in collective harm cases. By marking the Overdetermination Constraint as **Non-Negotiable**, you force the theory to abandon causal individualism entirely. This collapse necessitates either a shift to **Ex Ante Expected Utility** (which then crashes into the **Overdemandingness Constraint**) or a shift to **Participatory Integrity/Complicity** (which crashes into **Consequentialist Outcome-Responsibility**). Consequently, accepting the Overdetermination Constraint is the necessary condition for any theory that obligates individuals in rich countries to cut meat or flights, but it is also the source of the theory's greatest vulnerability to charges of irrationality or excessive demandingness.
