      *   What are the core intuitions behind it?
          1.  *Metaphysical/Identity:* Individuals are distinct entities; there is no "social mind."
          2.  *Structural/Prerogative:* Sacrificing one for another is categorially different from sacrificing a present self for a future self.
          3.  *Distributive/Justice:* Benefits and burdens belong to specific people; aggregating ignores who gets what.
          4.  *Inviolability/Rights:* Persons have boundaries that shouldn't be crossed for the greater good.

  3.  **Drafting the Theses (Iterative Process):**

