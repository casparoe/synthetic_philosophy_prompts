      *   *Attempt 2 (Structural/Prerogative):* Interpersonal tradeoffs aren't like intrapersonal tradeoffs.
          *   *Critique:* This is the Rawlsian core. It attacks the *analogy* utilitarianism relies on.
      *   *Attempt 3 (Distributive):* Distribution matters, not just the sum.
          *   *Critique:* This is the "patterned principle" vs. "end-state" debate. Nozick's angle.
