      *   *Refining for the Professor:* Let's group these into the most philosophically distinct claims found in the literature.
          *   **Thesis A: The Metaphysical Claim.** (There is no super-person).
          *   **Thesis B: The Structural Claim.** (Interpersonal vs. Intrapersonal justification).
          *   **Thesis C: The Distributive Claim.** (The moral significance of *who* gets the utility).
          *   **Thesis D: The Inviolability Claim.** (Side-constraints/Rights).

  4.  **Fleshing out each Thesis (following the prompt's requirements):**

      *   **Thesis A (Metaphysical):**
          *   *Content:* Society isn't an organic whole with a single consciousness.
