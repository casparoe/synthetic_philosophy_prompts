answer: |-
  # JOINT STATEMENT ON THE PROBLEM OF OLD EVIDENCE
  **An Adversarial Collaboration between the Supplementationist and the Deflationist**

  ## I. Agreed Claims
  *Both parties endorse the following propositions as the baseline for this dispute. Signing this section indicates commitment to these constraints on any proposed solution.*

  1.  **The Formal Trigger:** Within standard subjective Bayesianism, if an agent assigns probability $P(E) = 1$ to a piece of evidence $E$, then for any hypothesis $H$, $P(H|E) = P(H)$. Consequently, conditionalization on $E$ yields no change in the probability of $H$.
  2.  **The Phenomenon to be Saved:** Any adequate account of scientific rationality must be able to represent the intuition that the anomalous advance of Mercury's perihelion ($E$) provided confirmatory support for General Relativity ($H$) at the time $H$ was formulated, despite $E$ being well-established prior to $H$.
  3.  **The Prohibition on Relabeling:** A solution does not count as successful if it merely redefines "confirmation" in a way that severs the link to rational belief updating. If a model says "$E$ confirms $H$" but implies the agent should not increase their credence in $H$ upon recognizing the connection, it fails.
  4.  **The Role of Logical Learning:** Both sides agree that the core of the Mercury case involves the agent learning a *logical relationship* (that $H$ entails or probabilifies $E$) rather than learning $E$ itself. The dispute is over whether standard Bayesianism can model this learning event.
  5.  **Non-Arbitrariness:** Any proposed fix (whether a new formalism or a re-interpretation of the old one) must provide principled constraints on how probabilities are assigned or updated. Ad-hoc adjustments made solely to recover the desired result for Mercury are insufficient.

  ***

  ## II. Disagreements Table
  *The following table isolates the specific points of divergence. "Neutral Statement" describes the issue without bias. "Formulation" columns are phrased to be acceptable to the respective side. "Crux" identifies the underlying theoretical pivot. "Shared Constraint/Prediction" lists a specific test case or formal requirement both agree is relevant, followed by their divergent expectations.*

  | # | Neutral Statement of Disagreement | Supplementationist Formulation | Deflationist Formulation | Crux | Shared Constraint / Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Status of $P(E)=1$** | **The Idealization is Mandatory:** If $E$ is "known" (documented, accepted as data), rational coherence requires $P(E)=1$. To set $P(E) < 1$ is to deny the evidence is actually old/known. | **The Idealization is False:** "Known" in scientific practice never implies logical certainty ($P=1$). There is always residual uncertainty or the possibility of measurement error, allowing $P(E) < 1$. | **Epistemic Threshold:** Does "evidence" entail certainty? | **Constraint:** Consider a case where $E$ is a mathematical truth or a stipulated datum explicitly assigned $P=1$ by the agent.<br>**Supp Prediction:** Confirmation must fail here without new formal tools.<br>**Def Prediction:** Confirmation can still proceed via the *explanatory relation*, not $E$ itself. |
  | **2** | **The Locus of Updating** | **Update on $E$:** Confirmation is fundamentally about conditioning the hypothesis on the evidence ($H$ on $E$). If that channel is blocked, the apparatus is broken. | **Update on $H \to E$:** Confirmation is about conditioning on the *proposition that H explains E* (or $H$ entails $E$). We condition on the logical link, not $E$. | **Target of Conditionalization:** What is the input event? | **Constraint:** The "Garber-Style" Test: Can we define a proposition $L$ (H entails E) such that $P(H|L) > P(H)$ while $P(E)=1$?<br>**Supp Prediction:** No, unless we invoke counterfactual priors where $E$ was unknown.<br>**Def Prediction:** Yes, standard probability axioms allow $L$ to be new information distinct from $E$. |
  | **3** | **Counterfactual Credences** | **Necessary:** To measure support, we must compare actual credence to a counterfactual state where $E$ was *not* known ($P^*$). Support is $P(H|E) - P^*(H)$. | **Unnecessary:** We only need actual credences comparing $H$ against rival hypotheses ($H'$). Support is $P(H|E \& B) - P(H'|E \& B)$. | **Comparative vs. Absolute:** Is confirmation diachronic/counterfactual or synchronic/comparative? | **Constraint:** The "Rival Theory" Case: A scenario where $H$ explains $E$, but a rival $H^*$ also explains $E$ equally well.<br>**Supp Prediction:** $E$ confirms neither; we need the counterfactual to see if $E$ was surprising.<br>**Def Prediction:** $E$ confirms neither; standard comparative Bayesianism handles this without counterfactuals. |

  ***

  ## III. Analysis of Verbal vs. Substantive Disputes

  We explicitly flag the following areas where our disagreement appears to be verbal (terminological) rather than substantive (theoretical), and where it is genuinely load-bearing.

  ### 1. Verbal Dispute: The Definition of "Known"
  *   **Diagnosis:** There is a significant risk that we are talking past each other regarding the term "known." The Supplementationist treats "known" as a binary status that *triggers* the assignment $P(E)=1$. The Deflationist treats "known" as a pragmatic status that is compatible with $P(E) = 0.99$.
  *   **Why it is Verbal:** If the Supplementationist agrees that rational agents *never* assign $P(E)=1$ to empirical claims (fallibilism), their structural objection collapses. If the Deflationist agrees that for the sake of modeling *logical* relations we often *idealize* $P(E)=1$, their objection loses force.
  *   **Resolution Path:** We agree to treat the case where $P(E)$ is *stipulated* as 1 by the modeler as the hard test case. If the Deflationist can solve POE when $P(E)$ is rigorously 1, the verbal dispute is moot.

  ### 2. Substantive Dispute: The Nature of Logical Omniscience
  *   **Diagnosis:** This is the core load-bearing disagreement. Standard Bayesianism assumes logical omniscience (agents know all logical consequences of their beliefs). The POE arises because a non-omniscient agent learns a logical connection ($H \vdash E$) after the fact.
  *   **Why it is Substantive:** The Supplementationist claims standard probability theory *cannot* represent the learning of logical truths without expanding the possibility space (e.g., adding "H entails E" as a primitive proposition). The Deflationist claims standard theory *can* handle this if we properly define the algebra of propositions to include logical relations.
  *   **Load-Bearing:** This determines whether we need a *new* logic (Supp) or just a more careful *application* of existing logic (Def).

  ### 3. Substantive Dispute: The Role of Rivals
  *   **Diagnosis:** The Deflationist relies heavily on comparative confirmation (Bayes Factors), whereas the Supplementationist insists on absolute probability raising.
  *   **Why it is Substantive:** If confirmation is essentially comparative, the "Old Evidence" problem dissolves because we are comparing how well $H$ and $H_{rival}$ accommodate $E$, regardless of $P(E)$. If confirmation requires absolute probability raising of $H$, the problem remains.
  *   **Load-Bearing:** This determines the definition of scientific progress. Is it about $H$ becoming probable, or $H$ becoming *more probable than* $H_{rival}$?

  ***

  ## IV. Stability Check

  *For each side, we identify the argument or result that would force a substantial revision of their position, and note where their current formulation is most fragile.*

  ### Supplementationist
  *   **Condition for Revision:** If the Deflationist can demonstrate a formal model using *only* standard Kolmogorov axioms and standard conditionalization (no counterfactual priors, no new confirmation metrics) that successfully generates $P_{new}(H) > P_{old}(H)$ in a case where $P(E)=1$ is rigorously maintained.
  *   **Point of Fragility:** The reliance on **Counterfactual Priors**. The Supplementationist view is vulnerable to the charge of arbitrariness: there is no principled way to determine what an agent's credences *would have been* had they not known $E$. If this counterfactual distribution cannot be constrained, the "solution" is unfalsifiable.

  ### Deflationist
  *   **Condition for Revision:** If it is demonstrated that rational coherence *requires* $P(E)=1$ for observed evidence (i.e., if fallibilism about data leads to diachronic Dutch Books or incoherence in decision-making). If "known" *must* mean $P=1$, the Deflationist's primary escape route is closed.
  *   **Point of Fragility:** The reliance on **Propositional Expansion**. To make the "learning the logical link" argument work, the Deflationist must treat "H entails E" as a new proposition. This risks violating the assumption of logical omniscience inherent in standard Bayesianism. If admitting ignorance of logical relations requires breaking the standard axioms, the Deflationist is secretly a Supplementationist.

  ***

  **Signed,**

  *The Supplementationist*  
  *The Deflationist*  
  *Date: October 26, 2023*
