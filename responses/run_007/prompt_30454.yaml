prompt: |-
  My reading group has spent the last several weeks on the problem of old evidence in Bayesian confirmation theory, and two of our members have reached a standoff. One of them—call this the supplementationist—holds that the standard subjective Bayesian apparatus, on which E confirms H just in case P(H|E) > P(H), cannot represent the confirmatory force of a piece of evidence that was already known before H was formulated, because P(E) is already 1 and conditioning on E changes nothing. On this view the problem is structural: the formalism needs something added, such as counterfactual or "would have expected" probabilities, a model of learning logical relationships among propositions, or a distinct notion of confirmation, if it is to make sense of the classic case in which a new theory explains an already-documented anomaly, such as the anomalous advance of Mercury's perihelion before general relativity. The other—call this the deflationist—holds that the problem is an artifact of a bad idealization: "known" was never really probability 1 in the relevant sense, or the old evidence should be conditionalized out of the background in a principled way, or confirmation is being misdescribed as an absolute property of a single theory rather than a comparative judgment against a relevant alternative. On this view, once the example is modeled correctly, the standard apparatus needs no revision.

  We want the document these two members should have produced instead of arguing past each other: a joint statement in the style of an adversarial collaboration. It should open with a numbered section of agreed claims both can sign—about the formalism, about what the Mercury-type case requires an account to deliver, and about what would count as merely relabeling the problem rather than solving it. Then it should give a disagreements table in which each row contains: the disagreement stated in neutral wording; each side's formulation of its own view, phrased so that side would accept it; the crux or cruxes on which the row turns; and a concrete case, argument, or constraint that both sides agree bears on that crux, with each side's prediction about it recorded in advance. Please flag explicitly which parts of their dispute you judge to be verbal rather than substantive, and say why.

  Finally, end with a short stability check: for each side, state the argument or result that would most likely make that side substantially revise its position, and where each side's own formulation is most likely to be question-begging or otherwise fragile. I am less interested in a verdict about who is right than in formulations precise enough that the remaining disagreement is genuinely load-bearing.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A reading group discussing the "Problem of Old Evidence" (POE) in Bayesian confirmation theory.
      *   **Parties:** "Supplementationist" (standard Bayesianism fails, needs revision/additions) vs. "Deflationist" (standard Bayesianism works, problem is misapplication/idealization).
      *   **Task:** Create a joint statement in the style of an *adversarial collaboration*.
      *   **Structure:**
          1.  Numbered section of Agreed Claims (formalism, requirements for Mercury-type cases, what counts as relabeling).
          2.  Disagreements Table (Neutral statement, Side A view, Side B view, Crux, Shared Constraint/Case with Predictions).
          3.  Explicit flagging of verbal vs. substantive disputes.
          4.  Stability Check (What would change each side's mind? Where is each side fragile/question-begging?).
      *   **Goal:** Precision, load-bearing disagreement, not a verdict on who is right.

  2.  **Deconstruct the Philosophical Content (Problem of Old Evidence):**
      *   *The Problem:* If $P(E) = 1$ (E is known), then $P(H|E) = P(H)$. So E cannot confirm H. But historically, old evidence (like Mercury's perihelion) *did* confirm new theories (like GR).
      *   *Supplementationist View:* The math breaks. We need counterfactuals (what if we didn't know E?), temporal indexing, or a different confirmation metric.
      *   *Deflationist View:* The math is fine. $P(E)$ isn't really 1 (uncertainty remains), or we compare H to H* (rival theories), or we condition on the *relationship* between H and E, not E itself.
      *   *Key Distinction:* Is the problem in the *logic* of probability or the *application* of probability to historical/epistemic contexts?

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground on Bayesian basics.
      *   Need agreement on what a solution must explain (the intuition that GR was supported by Mercury).
      *   Need agreement on what constitutes a "solution" vs. a "rename."
      *   *Drafting points:*
          1.  Bayesian Conditionalization rule ($P_{new}(H) = P_{old}(H|E)$).
          2.  The historical fact: Mercury's anomaly supported GR.
          3.  A solution can't just say "confirmation is different here" without explaining *how* it maps to rational belief updates.
          4.  $P(E)=1$ is the mathematical trigger for the problem.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Row 1: The status of P(E)=1.*
          *   Neutral: Is assigning probability 1 to known evidence mandatory?
          *   Supp: Yes, for "known" evidence.
          *   Def: No, "known" implies high probability, not 1, or logical omniscience is the issue.
          *   Crux: Idealization vs. Reality.
          *   Test: Cases where evidence is certain but logical connection is discovered later.
      *   *Row 2: The locus of confirmation.*
          *   Neutral: What is being updated?
          *   Supp: The theory H given E.
          *   Def: The logical entailment relation (H $\to$ E) or H vs. Rivals.
          *   Crux: Is confirmation binary (H, E) or comparative/structural?
      *   *Row 3: Counterfactuals.*
          *   Neutral: Are counterfactual credences necessary?
          *   Supp: Yes, we need $P^*(H)$ where $E$ is unknown.
          *   Def: No, we use actual credences regarding the *explanation*.
          *   Crux: Metaphysical/Epistemic commitment to non-actual states.

  5.  **Drafting Section 3: Verbal vs. Substantive:**
      *   *Verbal:* Definitions of "known." If Deflationist means "high confidence" and Supplementationist means "certainty," they might just be talking past each other.
      *   *Substantive:* Whether the standard axioms *allow* for learning logical connections without new empirical data. Whether rationality *requires* $P(E)=1$ for observed data.

  6.  **Drafting Section 4: Stability Check:**
      *   *Supp:* Would revise if a standard model successfully replicated the intuition without ad-hocery. Fragile on: Defining the counterfactual prior non-arbitrarily.
      *   *Def:* Would revise if shown that $P(E)=1$ is rationally mandatory for observation. Fragile on: Explaining *why* the logical connection boosts confidence if E is already maxed out.

  7.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone:* Needs to be academic, precise, collaborative but distinct.
      *   *Constraint:* Make sure the "Predictions" in the table are concrete.
      *   *Check:* Did I flag the verbal disputes explicitly? Yes, need a specific subsection for that.
      *   *Check:* Is the Mercury case central? Yes, ensure it's referenced in the agreements.
      *   *Refinement on Deflationist position:* There are two main deflationist strategies: (1) $P(E) < 1$ (Jeffrey conditionalization/uncertainty) and (2) Comparison to rivals (Garber-style or comparative). I should ensure the Deflationist statement captures the nuance that it's not just "P(E) isn't 1" but often about the *explanatory relationship*. Let's focus on the "Logical Learning" (Garber) aspect as it's the strongest deflationist move against the structural claim.
      *   *Refinement on Supplementationist:* Ensure they aren't just saying "Bayes is wrong" but "The *standard application* is insufficient." They often accept Bayes but want *diachronic* rules or *counterfactual* priors.

  8.  **Final Review against Prompt:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table (Neutral, Side A, Side B, Crux, Shared Constraint/Prediction)? Yes.
      *   Flag verbal vs. substantive? Yes.
      *   Stability check (Revision conditions, Fragility)? Yes.
      *   Style: Adversarial collaboration.

  9.  **Final Polish:** Check for clarity and philosophical accuracy regarding Glymour, Garber, Howson, etc., without getting bogged down in name-dropping. Keep it focused on the structural arguments provided in the prompt. (Self-correction: Ensure the "Verbal vs Substantive" section is distinct and clear).

  *(Self-Correction during final output generation)*: Make sure the "Predictions" in the table aren't just "we think we're right." They need to be about specific thought experiments or formal constraints. For example, how to handle a case where E is *stipulated* as probability 1 by the agent.

