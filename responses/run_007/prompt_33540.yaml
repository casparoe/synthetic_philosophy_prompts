      *   **Move 4 (Priya):** Heap of Sand analogy (Sorites). No sharp boundary doesn't mean start = end. (Intuition: Vagueness doesn't imply identity).
          *   *Strength:* Correctly identifies the logical structure of the Sorites Paradox. Just because we can't pinpoint the change doesn't mean change didn't occur.
