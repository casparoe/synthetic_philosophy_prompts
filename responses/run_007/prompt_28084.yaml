      *   **Status:** Empirical data (masking, rivalry) is agreed upon, but interpretations differ. Conceptual moves are rehearsed. No movement.

  3.  **Diagnose the Disagreement:**
      *   *Verbal?* Partly. They often mean different things by "consciousness." But it's deeper than just definition; it's about ontology.
      *   *Evidential Standards?* Yes. Side A trusts third-person/neural correlates tied to report. Side B trusts first-person intuition/phenomenology even when report fails.
      *   *Metaphysical Intuitions?* This is the core. It's a clash between functionalism (mind = role) and non-reductive realism (experience = intrinsic property). Each side begs the question against the other.
      *   *Hidden Empirical?* Unlikely to settle it alone because data is theory-laden.

  4.  **Formulate the Diagnosis:**
      *   It's a "framework disagreement" or "paradigm clash."
      *   It combines verbal ambiguity with deep metaphysical divergence.
      *   The term "consciousness" conflates functional access with subjective feel.
      *   The impasse persists because evidence is interpreted through opposing metaphysical lenses (functionalism vs. phenomenological realism).

