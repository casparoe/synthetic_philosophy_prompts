prompt: |-
  You are a philosopher of mind specialising in consciousness studies. Think carefully and reason step by step.

  The debate between those who hold that phenomenal consciousness can be fully accounted for by some version of global workspace theory (or similar access-based accounts) and those who insist there is a hard gap between access and phenomenology has now run for roughly three decades. The empirical results—binocular rivalry, change blindness, masking studies, the Sperling partial-report paradigm—are largely agreed upon, and the main conceptual moves (the overflow argument, the distinction between access consciousness and phenomenal consciousness, appeals to subjective report versus objective measures) are well rehearsed. Yet neither side seems to have moved the other in any substantial way.

  I want a diagnosis of what kind of disagreement this actually is, not a verdict on who is right. Is this a verbal dispute about how to use the word 'consciousness'? Is it a disagreement about the standards of evidence—about whether first-person report can ever be trumped by third-person measures? Is it a clash of bedrock metaphysical intuitions (e.g., about whether functional role exhausts mental state) that neither side can argue for without begging the question? Or is there a hidden empirical question that, if resolved, would settle it?

  Given your diagnosis, tell me what, if anything, would count as progress—a new experimental paradigm, a conceptual distinction, a formal result—or whether we should expect the impasse to persist indefinitely.

  Limit your response to 400 words.
