          *   Deflation: The properties themselves (reliability/stability), not the link.
      *   *Prop 3:* The Scope of the Problem.
          *   Credit: It's about Knowledge specifically.
          *   Deflation: It's about Understanding or other states; Knowledge is a messy folk category.
      *   *Substantive vs. Verbal:* This is key. Is it just how we use "value"? Or is it metaphysics of value? Likely a mix.

  5.  **Drafting Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1:* The "Double Counting" Objection. If TB is valuable, and Competence is valuable, does adding them make K *more* valuable, or just the sum?
