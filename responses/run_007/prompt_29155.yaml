      *   *Crux 2:* The Value of Unreliable Knowledge (or Reliable False Belief).
          *   Test: Cases where competence exists but truth is absent (false belief from virtue) vs. truth without competence.
          *   Prediction: Credit values the attempt/competence even if false (to a degree). Deflation values only the truth.
      *   *Crux 3:* The "Swamping" Intuition.
          *   Test: Good coffee machine analogy (Kvanvig).
          *   Prediction: Deflation says intuition holds (coffee is coffee). Credit says intuition fails when the *source* matters for future predictions or credit.

  6.  **Drafting Section 4: Closing Note on Verbal Disputes:**
      *   Is "value" being used differently?
