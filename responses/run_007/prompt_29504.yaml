      *   **Supervaluationism (Fine):** Vagueness is semantic indecision. There is no single sharp cut-off; rather, there are many admissible precisifications. A statement is "supertrue" if it's true on all admissible precisifications. Bivalence fails (there are truth-value gaps). Logic is preserved (classical validities hold, even if bivalence fails).

  3.  **Brainstorming Common Ground (The "Agreed Claims"):**
