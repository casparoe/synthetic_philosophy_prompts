answer: |-
  **DRAFT 4.2 — FOR INTERNAL DEPARTMENTAL REVIEW**
  **JOINT STATEMENT ON THE SEMANTICS OF VAGUE PREDICATES**
  **Parties:** Dr. A. (Epistemicism) & Dr. B. (Supervaluationism)
  **Date:** October 14

  ### I. AGREED CLAIMS (COMMON GROUND)

  The following propositions are endorsed by both parties as the baseline for any adequate theory of vagueness. Signing this document indicates commitment to these constraints.

  1.  **The Sorites Paradox is Genuine:** The paradox is not merely a pragmatic confusion or a psychological illusion. It reveals a structural tension in the semantics of natural language that requires a theoretical solution, not a dissolution.
  2.  **Rejection of Eliminativism:** Vague predicates (e.g., "heap," "bald," "tall") are indispensable to successful communication and cognition. A solution that requires eliminating these predicates from our ontology or ideal language is unacceptable.
  3.  **Preservation of Classical Validity:** Any solution must preserve the validity of classical inference rules (e.g., Modus Ponens, Reductio) in ordinary reasoning. We reject many-valued logics that require abandoning standard deductive practices for non-borderline cases.
  4.  **Rejection of Degree Theory:** We agree that assigning real-numbered truth values (0 to 1) fails to capture the phenomenology of vagueness and creates artificial precision where none exists. Vagueness is not a matter of degree of truth.
  5.  **The Existence of Borderline Cases:** There are objects for which it is indeterminate whether a vague predicate applies. Both parties agree that a competent speaker, in full possession of the non-vague facts, may still be unable to classify these objects.
  6.  **Penumbral Connections Must Be Respected:** Logical relations between vague predicates must hold. For example, if $x$ is redder than $y$, and $y$ is red, then $x$ must be red. A theory that allows truth-value gaps to break these connections is inadequate.
  7.  **Contextualism is Insufficient:** While context shifts extension, it does not solve the Sorites. Shifting the boundary does not explain why the boundary is unstable or why the Sorites induction premise seems plausible in the first place.

  ---

  ### II. TABLE OF DISAGREEMENTS

  The following points represent the substantive divergence between the Epistemicist (E) and Supervaluationist (S) positions. Formulations have been vetted by both parties to ensure accuracy.

  | Topic | Epistemicist Position (E) | Supervaluationist Position (S) |
  | :--- | :--- | :--- |
  | **Bivalence** | **True.** Every declarative sentence containing a vague predicate is either determinately true or determinately false, even in borderline cases. | **False.** Sentences concerning borderline cases lack a truth value. They are neither true nor false. |
  | **Nature of Vagueness** | **Epistemic.** Vagueness is ignorance. The extension of a vague predicate is sharp, but the boundary is unknowable to us. | **Semantic.** Vagueness is semantic indecision. The extension of a vague predicate is incomplete; there is no single sharp boundary to be known. |
  | **Truth Conditions** | **Standard.** "Snow is white" is true iff snow is white. Truth is disquotational/correspondence. | **Supertruth.** "Snow is white" is true (simpliciter) iff it is true on *all* admissible precisifications of the language. |
  | **The Cut-off Point** | **Exists.** There is a specific number of grains $n$ such that $n$ grains make a heap and $n-1$ do not. | **Does Not Exist (Globally).** There is no specific $n$ such that $n$ makes a heap and $n-1$ does not. (Though relative to a precisification, a cut-off exists). |
  | **Explanation of Ignorance** | **Margin for Error.** Knowledge requires safety. Beliefs about the boundary cannot be safe because the boundary could easily have been slightly elsewhere. | **Nothing to Know.** We cannot know the cut-off because there is no fact of the matter regarding the cut-off. Ignorance is explained by indeterminacy. |
  | **Law of Excluded Middle** | **Assertible.** We can assert $P \lor \neg P$ for any $P$, even borderline cases. One disjunct is true. | **Valid but Unassertible.** $P \lor \neg P$ is supertrue (valid), but we cannot assert either disjunct individually for borderline $P$. |

  ---

  ### III. CRUXES AND TEST CASES

  These are the specific sub-questions where resolution would force a significant revision of one party's framework. We have identified these as the primary obstacles to a unified theory.

  #### Crux 1: The Truth-Functionality Objection
  **The Issue:** Classical logic assumes truth-functionality (the truth value of a compound sentence is determined by the truth values of its parts). Supervaluationism preserves classical *validity* but breaks truth-functionality (e.g., $P \lor \neg P$ is true even if $P$ lacks a truth value).
  **The Question:** Is "truth" fundamentally truth-functional?

  *   **Test Case:** Consider a borderline case $b$ (e.g., a specific shade of orange/red). Consider the sentence: "$b$ is red or $b$ is not red."
  *   **E's Prediction:** The sentence is true because the second disjunct is true. The truth of the whole is grounded in the truth of the part.
  *   **S's Prediction:** The sentence is supertrue because it holds on all precisifications. However, neither disjunct is true. The truth of the whole is *not* grounded in the truth of the parts.
  *   **Verbal Dispute Flag:** **HIGH.** If S defines "truth" as "supertruth," they agree the sentence is true. If S defines "truth" as "truth on a specific precisification," they disagree. The dispute hinges on whether "true" in natural language maps to *supertruth* or *truth-at-a-precisification*. E argues S is changing the subject; S argues E is fetishizing precision.

  #### Crux 2: The Explanation of the Induction Premise
  **The Issue:** Why does the Sorites premise ("If $n$ grains make a heap, $n-1$ grains make a heap") seem so compelling?
  **The Question:** What is the semantic mechanism that makes a false universal generalization (E) or a truth-valueless generalization (S) appear true?

  *   **Test Case:** A Sorites series of 10,000 grains reduced one by one.
  *   **E's Prediction:** The premise is false (because there is a cut-off), but we cannot know *where* it is false. Our inability to detect the falsity makes us assent to the universal. The "plausibility" is purely epistemic.
  *   **S's Prediction:** The premise is neither true nor false (or false on some precisifications). It appears true because it is *true on most admissible precisifications*. The "plausibility" is semantic/probabilistic.
  *   **Verbal Dispute Flag:** **LOW.** This is a substantive metaphysical disagreement about the source of error.

  #### Crux 3: Higher-Order Vagueness
  **The Issue:** It seems vague not only where the boundary of "heap" is, but where the boundary of "definitely heap" is.
  **The Question:** Can the theory account for vagueness about vagueness without regress?

  *   **Test Case:** Is there a sharp boundary between the "definitely red" items and the "borderline red" items?
  *   **E's Prediction:** Yes. There is a sharp boundary between the known and the unknown. Higher-order vagueness is just higher-order ignorance.
  *   **S's Prediction:** No. The set of admissible precisifications itself is not sharply defined. There is no sharp boundary between the definite and the borderline.
  *   **Verbal Dispute Flag:** **MEDIUM.** S argues E's view is counter-intuitive (a sharp boundary to knowledge). E argues S's view is incoherent (if the set of precisifications is vague, how is supertruth defined?).

  ---

  ### IV. NOTE ON VERBAL DISPUTES

  During the drafting of this document, we identified a potential verbal dispute regarding the predicate **"true."**

  *   **Observation:** The Epistemicist uses "true" to mean *truth simpliciter* (correspondence to fact). The Supervaluationist often oscillates between "true" (supertruth) and "true" (truth on a precisification).
  *   **Potential Resolution:** If the Supervaluationist agrees that "true" in ordinary discourse tracks *supertruth*, then the disagreement over Bivalence (Claim 1 in Disagreements) may be merely notational. The Supervaluationist would admit "It is true that $P \lor \neg P$" (because it is supertrue) while maintaining "It is not determined that $P$."
  *   **Remaining Block:** However, the Epistemicist insists that if $P \lor \neg P$ is true, one disjunct *must* be true. The Supervaluationist denies this inference. Therefore, even if we align on the definition of "true," we disagree on the **logic of assertion**. The Epistemicist holds that Truth norms Assertion (assert only what is true). The Supervaluationist holds that Supertruth norms Assertion (assert only what is supertrue). Since $P$ can be true (on a precisification) but not supertrue, the norms diverge.

  **Conclusion:** The dispute is not merely verbal. It reduces to a conflict between Classical Logic (E) and Supervaluational Logic (S) regarding the relationship between validity, truth, and assertibility.

