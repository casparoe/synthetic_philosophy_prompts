  # Adversarial Collaboration Statement on Spacetime Ontology

  ## Part 1: Common Ground

  1. Both sides accept the empirical adequacy of standard Newtonian mechanics and General Relativity within their respective domains of application.
  2. Both sides agree that inertial effects are real phenomena that any ontology of spacetime must accommodate.
  3. Both sides acknowledge that the metric field in General Relativity carries energy and momentum and interacts dynamically with matter.
  4. Both sides accept that diffeomorphism invariance is a fundamental symmetry of the equations governing General Relativity.
  5. Both sides agree that the dispute concerns the ontological status of spacetime structure rather than the mathematical formalism used to predict observations.

  ## Part 2: Disagreements Table

  | Crux | Substantivalist Wording | Relationist Wording | Agreed Setup/Argument | Substantivalist Prediction | Relationist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Newton's Bucket and Two-Globes** | Absolute space explains inertial forces as motion relative to a fixed background. | Relative motion against the bulk of matter or spacetime relations explains inertial forces. | Newton's two-globes thought experiment in an otherwise empty universe. | The cord will sustain tension due to rotation relative to space itself. | The cord will sustain no tension because there is no relative motion to other matter. |
  | **The Hole Argument** | The argument refutes only naive manifold substantivalism, not metric substantivalism. | The argument refutes any view treating spacetime points as substantial entities independent of the metric. | Applying a hole diffeomorphism to a model of General Relativity. | The transformed model represents the same physical reality. | The transformed model represents a distinct but empirically indistinguishable possibility, violating determinism. |
  | **The Metric Field in GR** | The metric field is a physical substance that exists independently of matter sources. | The metric field is a codification of spatiotemporal relations between material events. | Detection of gravitational waves in a region devoid of matter. | The waves confirm spacetime itself carries energy and momentum. | The waves confirm dynamic relations persist without local matter sources. |
  | **Leibniz's Shift Argument** | A uniform shift of all matter creates a numerically distinct possible world. | A uniform shift of all matter describes the same possible world. | Leibniz's thought experiment shifting the entire material universe five feet to the left. | The shifted scenario is metaphysically possible though empirically indistinguishable. | The shifted scenario is metaphysically impossible because position is only relative. |
  | **Verbal Dispute Status** | 'Independence' means spacetime does not ontologically depend on material objects. | 'Independence' is a category error because spacetime concepts require material relata. | Philosophical analysis of the phrase 'exists independently of matter' within ontological frameworks. | Clarifying the phrase reveals a substantive metaphysical disagreement. | Clarifying the phrase reveals the disagreement is merely verbal or conceptual. |
