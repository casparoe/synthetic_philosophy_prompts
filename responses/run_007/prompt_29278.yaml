      *   *Claim 4 (Concept - Moral Concept):* **Strong/Contested.** This is the "Moral Competence" or "Deep Self" view. Many philosophers argue intentionality is a *hybrid* concept or that moral considerations influence the *application* of a non-moral concept (pragmatic encroachment), not that the concept *is* moral.
