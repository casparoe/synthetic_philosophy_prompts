answer: |-
  This is a classic philosophical debate known as the **Paradox of Fiction**. It was famously formalized by philosopher Colin Radford in 1975, and your friends have essentially recreated the standard dialectic that has occupied aestheticians and philosophers of mind for fifty years.

  Here is a breakdown of who is right about what, move by move, followed by a specific verdict on the clash between Marcus's "proper object" argument and Lena's "simulation" reply.

  ### Move-by-Move Analysis

  **(1) Marcus: The Cognitivist Challenge**
  *   **The Argument:** Emotions require beliefs about existence. If I am sad, I must believe something sad has happened. Since I know fiction isn't real, I lack that belief. Therefore, my sadness is irrational (a mistake).
  *   **Who is right:** Marcus is logically consistent *if* you accept a strict **Cognitivist Theory of Emotion** (the idea that emotions are essentially judgments or beliefs).
  *   **The Flaw:** His dream analogy is weak. People frequently feel lingering dread or sadness after waking from a nightmare, even when fully aware it was a dream. If Marcus admits *that* is irrational, he has to label a universal human experience as a cognitive malfunction. If he admits *that* is rational, his argument against fiction collapses.

  **(2) Lena: The Phenomenological Pushback**
  *   **The Argument:** We don't actually hold the false belief. We know it's Cate Blanchett. The emotion is a response to the *content*, not the *existence*. Analogy: Humor.
  *   **Who is right:** Lena is right about the psychology. Most viewers do not suffer from an "existential illusion." We don't call the police when a character is murdered.
  *   **The Flaw:** The joke analogy is risky. As Marcus will point out, amusement is often cognitive (recognizing incongruity), whereas grief is visceral and seems to demand a real victim. Laughing at a joke doesn't imply a victim; crying at a death implies a loss.

  **(3) Marcus: The "Proper Object" Objection**
  *   **The Argument:** Emotions have functions and "proper objects." Fear is for real threats; grief is for real losses. Using them on fiction is a "misfire," like a smoke alarm going off because of steam rather than fire.
  *   **Who is right:** This is Marcus's strongest point. He is appealing to the **teleology of emotion** (what emotions are *for*). If grief is an evolutionary mechanism to process actual loss, expending that energy on a non-event looks like a waste of resources or a system error.
  *   **The Flaw:** It assumes emotions are only for immediate survival. It ignores the role of emotions in learning, bonding, and social simulation.

  **(4) Lena: The "Offline Simulation" Defense**
  *   **The Argument:** Emotions handle counterfactuals (future, past, hypothetical). Fiction is just "offline" processing. Analogy: Anticipatory dread.
  *   **Who is right:** This is the strongest philosophical move in the exchange. Lena is channeling the "Make-Believe" theory (most famously associated with Kendall Walton) and simulation theory. She redefines rationality: it's not about *truth conditions* (is this real?), but about *functional coherence* (is this how the system is designed to work?).
  *   **The Flaw:** She needs to bridge the gap between "possible future" (presentation) and "impossible fiction" (dragon attack). Marcus will try to drive a wedge there (which he does in move 5).

  **(5) The Stalemate: Possibility vs. Intentionality**
  *   **Marcus:** Dread is about *possibility*. Fiction is not possible for *you*.
  *   **Lena:** Realist fiction is possible. Also, we care about characters as abstract objects (like math).
  *   **Who is right:** Marcus wins on the "dragon" front (you can't rationally fear a dragon). Lena wins on the "realist drama" front (this could happen). However, Lena's math analogy is her weakest moment. We admire elegant proofs, but we don't typically *grieve* them. Caring about a character is more like caring about a friend than a theorem.

  ---

  ### The Core Clash: Does (3) Land or Does (4) Defuse It?

  You asked specifically whether Marcus's "proper object" point in (3) lands or whether Lena's "simulation" reply in (4) defuses it.

  **Verdict: Lena's reply in (4) largely defuses Marcus's point in (3), but she needs to refine *why*.**

  Here is why Lena wins this specific exchange:

  **1. Marcus relies on a "Direct Perception" model of emotion.**
  Marcus argues in (3) that for grief to be rational, the loss must be actual. This assumes emotions are like thermometers: they are only accurate if they measure a real temperature. If there is no heat, the reading is an error.

  **2. Lena relies on a "Competence" model of emotion.**
  Lena argues in (4) that emotions are like a flight simulator. A flight simulator is not a real plane, and the crash is not real, but the pilot's physiological response (adrenaline, focus) is not a "misfire." It is the system operating exactly as designed to prepare for or process scenarios *without* the risk of actual death.

  **3. The "Misfire" vs. "Feature" distinction.**
  Marcus calls the emotional response to fiction a "misfire of the empathy system." Lena correctly identifies that if the system *consistently* responds this way across all humans, it is likely a **feature**, not a bug.
  *   If a smoke alarm goes off because of steam, that is a misfire (it happens occasionally and is annoying).
  *   If a smoke alarm goes off because you pressed the "Test" button, that is not a misfire. It is functioning in "Test Mode."

  Lena's argument is that fiction engages "Test Mode" (or offline simulation). Therefore, Marcus is wrong to call it irrational. It is rational to test your braking system even if you aren't currently skidding.

  **Where Marcus still has a foothold:**
  Marcus is right that there is a *category difference* between fiction and reality. If Lena cries at a movie but ignores a homeless person outside the theater, Marcus can argue her empathy is misallocated. This is the moral dimension of the paradox. But regarding the *rationality of the emotion itself* (is it crazy to cry?), Lena's simulation argument holds up better.

  ### Overall Winner

  **Lena has the stronger position, but Marcus identified the real puzzle.**

  *   **Marcus** is right that there is a logical tension. If you define "rational" strictly as "corresponding to actual states of affairs," then crying at fiction is irrational. He successfully highlights that fictional emotions lack the *action components* of real emotions (you don't call 911 when a character dies).
  *   **Lena** is right that "rationality" in human psychology is broader than strict correspondence. She successfully argues that our emotional architecture is designed to respond to *representations*, not just *reality*.

  **The Philosophical Consensus:**
  Most contemporary philosophers of art (like Kendall Walton, Peter Lamarque, and Aaron Smuts) side with **Lena**. They argue that we engage in "make-believe" or "pretense." We don't actually feel *fear* (which requires belief in danger); we feel *quasi-fear* (the physiological sensation without the belief).

  However, Lena fumbles slightly in move (5) with the math analogy. A better ending for her would have been: *"We care about the character the way we care about a historical figure we never met. We can grieve for Socrates even though we know his death is in the past and doesn't threaten us. Fiction is just 'present-tense history'."*

  **Summary for your friends:**
  Tell Marcus he wins on **logic** (strictly speaking, the proposition "I am sad" implies "X died," and X didn't die). Tell Lena she wins on **psychology** (our brains are built to simulate, and simulation is a rational function). The "Paradox" is only a paradox if you insist emotions must be truth-claims rather than adaptive simulations.
