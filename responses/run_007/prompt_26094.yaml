  2. Theo's trajectory from apathetic defector to self-sacrificing cooperator demonstrates that the mere possibility of a restored future, embodied by Kee's pregnancy, reinstates the shadow of the future necessary for altruistic behavior.
  3. The Fishes complicate this framework by showing that a shared future can also incentivize ruthless coordination toward ideological ends, as Julian's group cooperates internally while defecting against Theo to secure the baby for their own political vision.
  4. The cease-fire among opposing soldiers at the Bexhill checkpoint resists the deterministic logic of the dilemma, suggesting that the immediate presence of the miraculous can suspend the calculus of survival even when the long-term future remains uncertain.
  5. Ultimately, the film concludes not with a guaranteed iterated game but with a fragile coalition on the *Tomorrow* ship, implying that cooperation may require faith in a future rather than the rational certainty of repeated interactions.
