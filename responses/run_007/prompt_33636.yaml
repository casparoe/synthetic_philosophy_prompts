prompt: |-
  I'm writing an essay on Du Bois's claim that all art is propaganda—the argument he makes in "Criteria of Negro Art" (1926) that the Black artist cannot and should not stand outside the struggle for liberation, and that art that refuses to serve that struggle is an unaffordable luxury. I want to test this claim against Spike Lee's *Do the Right Thing* (1989), which is undeniably a work of political art about race in America but which famously refuses to hand the audience a clear moral or political resolution. The film ends with Radio Raheem's death, the riot, and the dual quotations from Malcolm X and Martin Luther King on violence—leaving the question of what "the right thing" actually is genuinely unresolved.

  I'd like a reading that takes both Du Bois's essay and the film seriously. Where does *Do the Right Thing* function as propaganda in Du Bois's sense—what is it arguing for, and how does its artistic form advance that argument? Where does the film resist or complicate Du Bois's framework, perhaps by prioritizing aesthetic ambiguity over a clear political message, or by suggesting that the artist's job is to pose questions rather than to advocate answers? And does Du Bois's framework have the resources to handle this kind of work, or does the film expose a limitation in his view of what political art can be? I'm not looking for a verdict on whether Du Bois was right—I want to know what the confrontation between the essay and the film reveals about both.
reasoning: |-
  Here's a thinking process that leads to the suggested essay analysis:

  1.  **Deconstruct the Prompt:**
      *   **Core Subject:** W.E.B. Du Bois's claim "All Art is Propaganda" (from "Criteria of Negro Art," 1926).
      *   **Test Case:** Spike Lee's *Do the Right Thing* (1989).
      *   **Key Tension:** Du Bois argues Black art *must* serve the struggle for liberation (no "art for art's sake"). *Do the Right Thing* is political but refuses a clear moral/political resolution (ambiguity, dual quotes).
      *   **Task:** Analyze where the film fits Du Bois's framework (as propaganda) and where it resists/complicates it (ambiguity vs. advocacy). Evaluate if Du Bois's framework can handle this kind of work or if the film exposes a limitation.
      *   **Goal:** Not a verdict on who is right, but an exploration of what the confrontation reveals about *both* the essay and the film.

  2.  **Analyze Du Bois's "Criteria of Negro Art":**
      *   *Context:* Harlem Renaissance, debate between Locke (aesthetic autonomy) and Du Bois (social utility).
      *   *Key Argument:* "Thus all Art is propaganda and ever must be." He doesn't mean "crude pamphleteering." He means art inevitably shapes perception. Since Black people are misrepresented, Black art *must* counter that to achieve truth and justice.
      *   *Nuance:* Du Bois values beauty ("I do not care a damn for any art that is not used for propaganda"). But the *purpose* is liberation. He fears "art for art's sake" is a luxury Black folks can't afford because the stakes (lynching, disenfranchisement) are too high.
      *   *Potential Rigidity:* Sometimes read as demanding didacticism or positive imagery (respectability politics), though his actual text is more about *truth-telling* within the struggle.

  3.  **Analyze *Do the Right Thing*:**
      *   *Context:* Late 80s, post-Civil Rights, crack epidemic, rising tensions (Howard Beach, Bensonhurst).
      *   *Plot:* One hot day in Bed-Stuy. Racial tensions boil over. Radio Raheem killed by police. Riot ensues. Sal's Pizzeria burned.
      *   *Ending:* Ambiguous. MLK (non-violence) and Malcolm X (self-defense) quotes side-by-side. Lee has said he wants the audience to argue.
      *   *Political Stance:* It indicts systemic racism and police brutality clearly. But it doesn't offer a *program* for change. It shows the explosion, not the solution.

  4.  **Synthesize: Points of Convergence (Where the Film *is* Propaganda):**
      *   *Truth-Telling:* Du Bois wants art to tell the truth about Black life against white caricature. Lee does this viscerally. The heat, the slang, the music, the police violence—it counters the "cosbyfied" view of Black life prevalent in the 80s.
      *   *Mobilization of Affect:* Du Bois wants art to move people. Lee's film moves people (anger, discomfort). It forces a confrontation with racial reality.
      *   *The Enemy:* Both identify white supremacy/systemic racism as the antagonist. Sal isn't a cartoon villain, but the system (police) is.
      *   *Utility:* The film *did* serve the struggle. It sparked national debate about police brutality (Rodney King happened shortly after). It functions as a cultural artifact for liberation, even if not a manifesto.

  5.  **Synthesize: Points of Divergence (Where the Film Complicates Du Bois):**
      *   *Ambiguity vs. Directive:* Du Bois implies art should point the way (toward truth/justice). Lee refuses to point the way. He asks "What is the right thing?" without answering.
      *   *Internal Conflict:* Du Bois often emphasized presenting Black humanity to white audiences to gain sympathy. Lee presents Black rage, even when it's destructive (burning Sal's). This risks alienating white audiences (which it did), challenging Du Bois's idea of propaganda as a tool for *winning* the struggle through persuasion.
      *   *Aesthetic Autonomy:* Lee prioritizes the *complexity* of the situation over the *utility* of the message. Is ambiguity a luxury? Or is it a deeper truth?

  6.  **Develop the Argument (The "Confrontation"):**
      *   *Reframing Propaganda:* If we read Du Bois narrowly (didacticism), Lee fails. If we read Du Bois broadly (art as a weapon of truth in a racialized world), Lee succeeds.
      *   *The Function of Ambiguity:* Ambiguity isn't neutrality. In *Do the Right Thing*, ambiguity *is* the political point. It forces the audience to sit with the tension. This might be a *more effective* propaganda for a complex era than a simple slogan.
      *   *Du Bois's Resources:* Du Bois actually writes about "Truth" heavily. He says, "I am one who tells the truth and exposes evil." Lee exposes evil. The ambiguity serves the Truth. So Du Bois *can* accommodate Lee, provided we don't reduce "propaganda" to "instructions."
      *   *The Limitation:* Du Bois's framework assumes a unified "Negro struggle." Lee shows a fragmented community (Black, Latino, Italian, Korean). Du Bois's 1926 pan-Africanism might struggle with the multiracial coalition politics of 1989 Bed-Stuy.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Set up the tension. Du Bois's urgency vs. Lee's ambiguity.
      *   *Section 1: The Propagandistic Core.* How Lee fulfills Du Bois. Countering stereotypes, centering Black pain, the inevitability of political meaning.
      *   *Section 2: The Aesthetic of Ambiguity.* How Lee challenges Du Bois. The dual quotes. The risk of alienating allies. The refusal of "respectability."
      *   *Section 3: Reconciling the Two.* Can Du Bois hold this? Yes, if "propaganda" means "truth-telling weapon" rather than "instruction manual." The film suggests that *confusion* is part of the political reality.
      *   *Conclusion:* The confrontation reveals that political art doesn't need to be didactic to be useful. It reveals Du Bois was more nuanced than critics say, but Lee shows that the "struggle" is messier than 1926 optimism allowed.

  8.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Caution:* Don't caricature Du Bois as a censor. He loved beauty. He just hated beauty *detached* from justice.
      *   *Caution:* Don't call Lee "apolitical." He is deeply political, just not prescriptive.
      *   *Key Insight:* The "luxury" Du Bois mentions. Is ambiguity a luxury? Lee argues no—simplification is the lie. Du Bois might argue that in the face of death, clarity is needed. This is the friction point.
      *   *Specific Scene:* The "Love/Hate" monologue. It's didactic (propaganda?) but also philosophical. The ending quotes.

  9.  **Final Polish:** Ensure the tone is analytical, not judgmental. Focus on "what the confrontation reveals." (This matches the prompt's request). Structure with clear headings or thematic blocks. (Decided on thematic blocks for flow).

  **(Self-Correction Note):** Make sure to explicitly address the "limitation" aspect. Does the film expose a limit in Du Bois? Yes, perhaps the limit of *respectability* and the limit of *binary* struggle (Black vs. White) when the world is multiracial and the solutions are unclear.

  10. **Final Review against Prompt:**
      *   Du Bois's claim addressed? Yes.
      *   *Do the Right Thing* analyzed? Yes.
      *   Where it functions as propaganda? Yes.
      *   Where it resists/complicates? Yes.
      *   Does Du Bois have resources to handle it? Yes/No nuanced.
      *   No verdict on who is right? Checked.

