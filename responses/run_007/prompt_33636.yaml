answer: |-
  This is a rich theoretical confrontation. Reading W.E.B. Du Bois's "Criteria of Negro Art" (1926) against Spike Lee's *Do the Right Thing* (1989) does not necessarily prove one right and the other wrong; rather, it illuminates the evolving nature of Black political aesthetics across the twentieth century.

  Du Bois writes from the Harlem Renaissance, a moment of cultural flowering amidst the terror of Jim Crow and lynching. Lee writes from the late Reagan era, a moment of neoliberal retrenchment, the crack epidemic, and the simmering tensions that would soon explode in Los Angeles. When you place them in dialogue, three key dynamics emerge: the definition of propaganda, the political utility of ambiguity, and the burden of representation.

  ### 1. Where the Film Functions as Du Boisian Propaganda

  To understand where Lee satisfies Du Bois, we must first clarify Du Bois's definition of propaganda. Du Bois does not mean "lies" or "crude agitation." He writes, "I do not care a damn for any art that is not used for propaganda." But he immediately qualifies this: "I do not care when the propaganda is so blatant that it obscures the art." For Du Bois, propaganda is the inevitable use of art to shape public perception toward a moral end. Because the world is racialized, Black art *cannot* be neutral; it either reinforces the status quo or challenges it.

  *Do the Right Thing* is propaganda in the Du Boisian sense because it refuses the luxury of neutrality.

  **The Rejection of "Art for Art's Sake"**
  Du Bois argues that the Black artist cannot stand outside the struggle because the Black subject is already under siege. Lee's film embodies this. There is no "universal" human story here detached from race. The heatwave is a metaphor for racial pressure. The setting, Bed-Stuy, is a character. The film insists that to watch Black life in America is to watch a political struggle. By centering the narrative entirely within a Black community, with white characters (Sal, the police) entering primarily as sources of tension or authority, Lee enforces Du Bois's demand that Black art center Black subjectivity.

  **Truth-Telling as a Weapon**
  Du Bois writes, "I am one who tells the truth and exposes evil and seeks for Beauty and for Good." He is concerned with countering the "caricature" of Black life. In the 1980s, the dominant caricature was shifting from the minstrel to the "super-predator" or the invisible underclass. *Do the Right Thing* counters this not by showing "respectable" Black citizens (a common Du Boisian strategy), but by showing the *humanity* within the chaos. Radio Raheem is not a saint; he is loud, aggressive, and confrontational. Yet, his death is framed as a tragedy and a murder. The film forces the audience to witness the brutality of the state against a Black body. In this regard, the film serves the struggle: it mobilizes outrage and forces a confrontation with police violence that mainstream cinema typically sanitized.

  **The Inevitability of Political Effect**
  Du Bois claims all art is propaganda because all art shapes feeling. Lee understood that *Do the Right Thing* would have real-world consequences. He famously debated whether the film might incite violence. By releasing it, he accepted that the art would function politically. The film did, in fact, serve as a catalyst for national discourse on race and policing, functioning exactly as Du Bois hoped Black art would: as an intervention in the public sphere.

  ### 2. Where the Film Resists and Complicates Du Bois

  However, *Do the Right Thing* pushes against the boundaries of Du Bois's 1926 framework, specifically regarding *clarity* and *resolution*. Du Bois writes in a context where the path to liberation, while difficult, seemed to have clear moral vectors (civil rights, voting, ending lynching). Lee writes in a context where the "struggle" is fragmented, and the "right thing" is contested.

  **Ambiguity as Aesthetic and Political Strategy**
  Du Bois implies that propaganda should point toward the "Good." He fears art that is merely critical without being constructive. *Do the Right Thing* is deeply critical but resolutely non-constructive. The film ends with two contradictory quotes: Martin Luther King Jr. condemning violence, and Malcolm X defending it "by any means necessary." Lee places them side-by-side, offering no synthesis.

  For a strict reading of Du Bois, this might look like a failure of propaganda. If art is a weapon for liberation, shouldn't it tell the soldiers which way to fire? By refusing to endorse non-violence over self-defense (or vice versa), Lee risks paralyzing the audience rather than mobilizing them. He prioritizes the *complexity* of the moral dilemma over the *utility* of a clear message. This suggests that the artist's job is not to advocate answers, but to ensure the questions are too urgent to ignore.

  **The Risk of Alienation**
  Du Bois often operated under a strategy of persuasion. He believed that showing Black humanity and suffering to white audiences could garner sympathy and aid the struggle (a logic underpinning *The Souls of Black Folk*). *Do the Right Thing* risks alienating that audience. The riot scene, where the Black community burns Sal's pizzeria, is morally complicated. Sal is not a cartoon villain; he has invested in the neighborhood for 25 years. Yet, the building is destroyed.

  Du Bois might worry that this imagery reinforces white fears of Black mob violence, thus harming the political cause. Lee, however, suggests that sanitizing Black rage for white comfort is its own form of lying. Here, the film complicates Du Bois by suggesting that "truth-telling" might sometimes look like "unrest" to the oppressor, and that the artist must risk that alienation to tell the truth.

  **The Multiracial Reality**
  Du Bois's framework is largely binary (Black vs. White, or the "Veil"). *Do the Right Thing* presents a multiracial ecosystem: Black, Italian-American, Korean, Latino. The tensions are not just vertical (citizen vs. state) but horizontal (neighbor vs. neighbor). Du Bois's 1926 framework struggles to account for this. Who is the propaganda for? Who is the enemy? When the Korean grocer's store is spared because "it's Black-owned," the film highlights intra-minority complexities that Du Bois's pan-Africanism didn't fully anticipate. The film suggests that the "struggle" is not a unified front, complicating the idea of art serving a singular "Negro liberation."

  ### 3. Does Du Bois's Framework Have the Resources to Handle This?

  This is the crux of your essay. Does *Do the Right Thing* expose a limitation in Du Bois, or does it reveal a hidden flexibility in his theory?

  **The Limitation: The Demand for Utility**
  If we read Du Bois as demanding that art provide a *program* for change, then *Do the Right Thing* exposes a limitation. Du Bois writes, "We have beautiful things... but we want to use them for the gaining of the right." There is a teleological pressure here—art must lead to a specific gain. Lee's film leads to a question, not a gain. It exposes a limitation in Du Bois's optimism: the belief that truth, once told, naturally aligns with justice. Lee suggests that truth can be messy, contradictory, and explosive without leading immediately to justice.

  **The Flexibility: Propaganda as Disruption**
  However, if we read Du Bois more broadly—as arguing that art must disrupt the *false* reality of white supremacy—then Du Bois has the resources to embrace Lee. Du Bois writes against "the lie of silence." *Do the Right Thing* breaks the silence.

  In this reading, the film's ambiguity *is* the propaganda. In a media landscape that simplifies race into binaries (good/bad, victim/aggressor), Lee's refusal to simplify is a radical political act. It forces the audience to do the work of moral reasoning. Du Bois writes, "I would not blacken the world to show that Black is beautiful." He wants truth. Lee argues that the *truth* of 1989 America *was* ambiguous and violent. To offer a neat resolution would be the real propaganda (in the negative sense). Therefore, Lee's ambiguity serves Du Bois's higher goal: Truth.

  ### Conclusion: What the Confrontation Reveals

  Confronting Du Bois with Lee reveals that **political art is not monolithic.**

  1.  **It reveals that Du Bois was more nuanced than his critics claim.** He was not simply calling for didactic pamphlets; he was calling for art that acknowledges the stakes of Black existence. Lee proves you can acknowledge those stakes without providing a manifesto.
  2.  **It reveals that "Propaganda" can mean "Agitation" rather than "Instruction."** *Do the Right Thing* agitates the conscience without instructing the hand. This expands Du Bois's framework to include works that prepare the *ground* for politics, even if they don't dictate the politics themselves.
  3.  **It reveals the historical shift in the "Struggle."** Du Bois wrote when the goal was inclusion and basic rights. Lee wrote when the question was about the limits of inclusion and the nature of systemic power. The film exposes that as the struggle becomes more complex, the art must become more ambiguous to remain truthful.

  Ultimately, *Do the Right Thing* validates Du Bois's claim that Black art cannot stand outside the struggle, but it updates the *method* of that engagement. It suggests that in a complex, media-saturated society, the most effective propaganda may not be the poster that tells you what to think, but the mirror that forces you to see what you are avoiding. Du Bois wanted art to be a hammer; Lee shows us that sometimes art must be a mirror, even if the reflection is one we don't know how to fix.
