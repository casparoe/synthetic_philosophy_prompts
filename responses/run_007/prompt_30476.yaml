      *(Self-Correction during drafting)*: I should be careful not to just say "9 is wrong." I need to explain *why* the inference from (8) to (9) is invalid. (8) says "Our existence is a selection effect regarding *universes*." (9) says "Our theory success is a selection effect regarding *ideas*." These are different reference classes.
      Also, I should mention that even if (6) is true (Tegmark's Level IV), (9) doesn't follow. In a Level IV multiverse, most universes are garbage/noise. We are in a simple one. Why? That's still a puzzle (the measure problem). So predictive success *is* evidence against the "all structures are equal" hypothesis.

