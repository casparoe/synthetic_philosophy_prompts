answer: |-
  ### Philosophical Analysis and Account Selection

  Before designing the procedure, we must evaluate the competing philosophical accounts of causation by omission to determine which best serves your committee's purpose.

  1.  **The Bare Counterfactual Account:** This view holds that an omission is a cause if, had the action been performed, the outcome would not have occurred.
      *   *Application:* In all three cases, the harm would likely have been prevented had the clinician acted.
      *   *Verdict:* This classifies all three omissions as causes. As you noted, this is too permissive. It makes every death the result of thousands of omissions (e.g., the specialist who wasn't called, the nurse who didn't check twice). It fails to distinguish between a causal failure and a mere background condition.
  2.  **The Skeptical Account:** This view denies that omissions are causes at all, treating them merely as explanations.
      *   *Verdict:* Useless for your setting. You are mandated to classify events as "caused by omission" or not for regulatory and safety purposes.
  3.  **The Normative/Expectation Account:** This view (associated with Hart, Honoré, and McGrath) argues that an omission is a cause only when there was a duty, norm, or reasonable expectation to act. Causation is not just about physics (what would have happened); it is about the violation of a relevant standard.
      *   *Application:*
          *   *Case 1:* No guideline recommended the test. No duty breached. Not a cause.
          *   *Case 2:* No rule required checking un-routed results. No duty breached. Not a cause.
          *   *Case 3:* Duty existed within the role, despite local culture. Duty breached. Is a cause.
      *   *Verdict:* This aligns best with the legal and ethical concept of "preventability" in medicine. It restricts causal attribution to failures of the system or role as designed, rather than failures to improvise outside of design.

  **Selected Account:** I am operationalizing the **Normative/Expectation Account**.
  **Justification:** Your committee's goal is not to identify every physical condition necessary for the death (which would include the virus, the gravity, and the missed test), but to identify *preventable failures in care*. In medicine, "preventable" implies "preventable within the standard of care." If an action was not expected or required by professional standards or institutional workflow, failing to do it is not a causal flaw in the delivery of care, even if it would have saved the patient. This account protects clinicians from hindsight bias (Case 1) while holding them accountable to professional standards over local culture (Case 3).

  ***

  ### The Normative Expectation Protocol (NEP)

  **Purpose:** To determine whether a clinician's failure to act causally contributed to patient harm, distinct from questions of blame or competence.
  **Time:** ~20 minutes per case.
  **Participants:** Committee Chair (facilitator), Clinician Members (fact/norm judgment), Risk Manager (policy record), Lay Member (perspective check).

  **Instructions:** Proceed through the questions in order. If any answer is "No," stop immediately and record the conclusion specified. Do not proceed to the next question if the case is already resolved.

  **Step 1: The Effectiveness Check (Factual)**
  *   **Question:** On the balance of probabilities, would performing the omitted action have prevented the specific harm that occurred?
  *   **Sufficient Answer:** "Yes" requires evidence (literature, expert consensus) that the intervention works in this context. "No" means the harm was inevitable or the action ineffective.
  *   **Stop Condition:** If **No**, conclude: **The omission did not cause the harm.** (File as non-preventable).
  *   **Rationale:** This establishes counterfactual dependence. If the action wouldn't have changed the outcome, it cannot be a cause, regardless of duty.

  **Step 2: The Expectation Check (Normative)**
  *   **Question:** At the time of the event, was there a specific professional guideline, institutional policy, or established workflow that required or explicitly expected this action in this specific clinical context?
  *   **Sufficient Answer:** "Yes" requires citing a specific guideline (e.g., "ACC guidelines for chest pain"), policy (e.g., "Critical Value Policy"), or role description. "No" means the action was optional, experimental, or outside the defined workflow, even if it was physically possible.
  *   **Judgment:** This requires professional judgment. Clinician members must agree on what the standard of care was *at that time*, not with hindsight. The Risk Manager must verify if an institutional policy existed.
  *   **Recording:** The specific guideline or policy cited must be recorded in the minutes. If no specific rule exists, record "No established norm."
  *   **Stop Condition:** If **No**, conclude: **The omission did not cause the harm.** (File as non-preventable).
  *   **Rationale:** This distinguishes a causal failure from a background condition. Only violations of expected standards count as causal omissions in this framework. This prevents hindsight bias from creating duties that did not exist.

  **Step 3: The Capacity Check (Factual)**
  *   **Question:** Did the clinician have the actual physical ability, authority, and opportunity to perform the action at the required time?
  *   **Sufficient Answer:** "Yes" means no system block (e.g., downtime), no prohibition (e.g., scope of practice), and sufficient time/resources. "No" means external factors made the action impossible.
  *   **Stop Condition:** If **No**, conclude: **The omission did not cause the harm.** (File as non-preventable system error, not individual omission).
  *   **Rationale:** One cannot be causally responsible for failing to do what one could not do. This separates individual omission from system impossibility.

  **Step 4: Causal Conclusion**
  *   **Condition:** If Steps 1, 2, and 3 are all **Yes**.
  *   **Conclusion:** **The omission caused the harm.** (File as preventable).
  *   **Note:** This conclusion identifies a causal link for safety investigation. It does **not** assign blame, negligence, or incompetence. Those are separate determinations made in a different process.

  ***

  ### Application to Cases

  **Case 1: The Missed Pulmonary Embolism**
  1.  **Effectiveness:** Yes. CT would have found the PE; treatment would likely have prevented death.
  2.  **Expectation:** **No.** The presentation fell below the threshold of clinical decision rules (e.g., PERC or Wells criteria) current at the time. No guideline required imaging.
  3.  **Capacity:** (Skipped).
  4.  **Conclusion:** **The omission did not cause the harm.**
  *   **Classification:** Non-preventable.

  **Case 2: The Un-routed Lab Value**
  1.  **Effectiveness:** Yes. Seeing the value would have triggered treatment preventing arrhythmia.
  2.  **Expectation:** **No.** Checking for un-routed results is not part of the specified workflow, and no hospital rule assigns this monitoring duty after hours.
  3.  **Capacity:** (Skipped).
  4.  **Conclusion:** **The omission did not cause the harm.**
  *   **Classification:** Non-preventable.

  **Case 3: The Discouraged Rapid Response Call**
  1.  **Effectiveness:** Yes. Calling would have prevented the arrest on the balance of probabilities.
  2.  **Expectation:** **Yes.** Calling is within the nurse's role and professional duty, regardless of unit culture. The professional standard overrides the local informal norm.
  3.  **Capacity:** Yes. The nurse observed the deterioration and had access to a phone.
  4.  **Conclusion:** **The omission caused the harm.**
  *   **Classification:** Preventable.

  ***

  ### The Unpopular Answer

  The committee will strongly resist the conclusion in **Case 1**.

  **Why:** The intuition that "the patient died because the doctor didn't order the test" is overwhelming. Lay members and clinicians alike will feel that labeling this "non-preventable" ignores the reality that the patient *could* have been saved. There will be pressure to classify this as a cause to justify a deeper investigation into why the guidelines didn't catch this patient.

  **Why the Procedure Holds:** Classifying this as a cause punishes adherence to evidence-based guidelines. If you classify it as a cause, you signal that clinicians should ignore decision rules and test low-risk patients to avoid liability. This drives defensive medicine, increases patient risk from false positives, and wastes resources. The procedure forces the committee to accept that some deaths are tragic but not causally attributable to clinician omission under current standards. If the committee wants to investigate this, they must do so as a "guideline limitation" review, not an "adverse event caused by omission" review.

  ***

  ### Limitations of the Procedure

  1.  **The "System Gap" Problem (Case 2):** The procedure will classify Case 2 as "non-preventable" because no rule existed. This is technically correct under the Normative Account, but dangerous for safety. It means a patient can die from a known critical value without triggering a "preventable" investigation. The hospital must decide separately whether to investigate "system vulnerabilities" where norms are absent. This procedure does not capture those; it only captures breaches of existing norms.
  2.  **Lagging Standards:** The procedure relies on existing guidelines. In rapidly evolving fields, what is "expected" may lag behind what is "possible." The procedure will classify failures to use cutting-edge (but not yet standard) interventions as non-causal. The hospital must accept this conservatism.
  3.  **Culture vs. Duty (Case 3):** The procedure prioritizes professional role over local culture. While philosophically sound, this may create friction with unit managers whose culture was implicated. The procedure identifies the cause but does not fix the culture; that requires separate leadership action.
  4.  **Unsettled Philosophy:** Philosophy has not settled whether "defaults" (what usually happens) or "norms" (what should happen) determine causation. This procedure chooses "norms." If your hospital culture believes "what usually happens" defines causation, this procedure will conflict with staff intuition. You must choose this standard explicitly.

  This procedure forces the hospital to admit that "preventable" means "violated a standard," not "could have been avoided by any means," and you must live with the consequence that some avoidable deaths will be classified as non-preventable because no rule existed to prevent them.

  The Normative Expectation Protocol determines causal omission by verifying that an action would have prevented harm, was required by an established standard, and was within the clinician's capacity to perform.
