answer: |-
  The principle that unifies your ten verdicts is **The Principle of Externalized Constraints** (sometimes called **Local Verifiability against a Fixed Standard**).

  ### The Principle

  A cognitive task factors if and only if **the correctness of any sub-component can be verified without reference to the specific content choices of other sub-components.**

  In factorable tasks, the "standard of truth" is **external** and **fixed** before the work begins (a source text, a spec, a rubric, logical axioms). You can judge a chunk in isolation against that standard.

  In non-factorable tasks, the "standard of truth" is **internal** and **emergent**. The correctness of a chunk depends on how it interacts with other chunks to create a global property (coherence, insight, system stability). You cannot judge the chunk in isolation.

  ### Solving Your Puzzles

  **1. Translation vs. Novel Writing**
  *   **Translation (Factorable):** The "truth" lives outside the workers, in the source novel. Translator A can verify Chapter 1 is correct by comparing it to Source Chapter 1. They do not need to know what Translator B did in Chapter 20, except for shared nouns (handled by the glossary). The *integration cost* (style editor) is small compared to the *generation cost* (translating words).
  *   **Novel Writing (Not Factorable):** The "truth" lives inside the work itself. Chapter 1 is only "correct" if it sets up Chapter 20. If Writer A changes a character's motivation in Chapter 1, Writer B's Chapter 20 might become nonsense. The constraints are bidirectional. The *integration cost* (rewriting for voice/plot consistency) is as high as the *generation cost*.

  **2. Proof Finding vs. Proof Checking**
  *   **Proof Checking (Factorable):** The standard is the line immediately preceding. Step $N$ is valid if it follows from $N-1$ by rules of logic. Local context suffices.
  *   **Proof Finding (Not Factorable):** The standard is the *destination* (the theorem). To write Step $N$, you must know where the proof is going. You need a global model of the mathematical landscape to avoid dead ends. Local validity (this step is logical) does not guarantee global validity (this path leads to the theorem).

  ### Applying the Principle to New Cases

  **1. Writing a season of a TV show**
  *   **Verdict:** **Not Factorable.**
  *   **Why:** Like the novel, the value is in the arc. If different writers draft episodes without a single showrunner holding the whole character trajectory in their head, the season feels disjointed. The "truth" (emotional payoff) is emergent.
  *   *Nuance:* You can factor the *script production* (dialogue polish, scene blocking) once the beat sheet is locked, but the creative design does not factor.

  **2. Doing a complex tax audit**
  *   **Verdict:** **Mostly Factorable.**
  *   **Why:** This is closer to the spreadsheet check. The "truth" is the tax code (external standard). You can split by deduction category (mortgage, charity, business).
  *   *Nuance:* If the audit involves *interpreting* ambiguous law to minimize liability (tax *strategy*), it becomes non-factorable (like language design), because one loophole interacts with another. If it is compliance (tax *audit*), it factors.

  **3. Synthesizing a research literature**
  *   **Verdict:** **Not Factorable.**
  *   **Why:** The goal is to find the *narrative* or *gap* that connects the papers. If Worker A summarizes Paper 1 and Worker B summarizes Paper 2, the "synthesis" (the insight that Paper 1 contradicts Paper 2) is lost. The value is in the interaction between the sources, not the sources themselves.

  **4. Planning a wedding**
  *   **Verdict:** **Mixed (Logistics Factorable, Experience Not).**
  *   **Why:**
      *   *Logistics (Factorable):* Invitations, catering headcount, venue booking. These are constraints with external standards (budget, guest list).
      *   *Vibe/Flow (Not Factorable):* The timing of the speech relative to the dinner, the music volume during the vows. These are holistic experience constraints. If the caterer and the DJ don't share a global model of the "flow," the event feels clunky.

  ### Which Verdicts Should You Give Up?

  To keep the principle clean, you should adjust two of your verdicts slightly. They are boundary cases where the "External Constraint" is leaky.

  **1. Translating a 400-page novel**
  *   **Adjustment:** This is **barely factorable**, and only for low-context prose.
  *   **Why:** If the novel is stylistically dense (e.g., Nabokov or Joyce), translation becomes "writing a new novel in another language." The constraints become internal (voice) rather than external (meaning). Your "style editor" is actually doing the non-factorable work of holding the global model. If the style editor has to rewrite 30% of the chapters to fix voice drift, the task didn't truly factor; you just parallelized the drafting.
  *   **Correction:** Mark as "Factorable only if style/voice is secondary to information transfer."

  **2. Writing a CRUD web app from a detailed spec**
  *   **Adjustment:** This is **factorable only if the spec is perfect.**
  *   **Why:** In reality, specs are never perfect. The moment a worker encounters an ambiguity ("What happens if the user deletes their account while a transaction is pending?"), they must make a design choice. That choice constrains other workers. If the spec requires *interpretation*, the task shifts from "implementation" (factorable) to "design" (not factorable).
  *   **Correction:** Mark as "Factorable assuming zero spec ambiguity."

  ### Summary for your Gut Check

  When you ask "Does this factor?", ask: **"If I hand this chunk to a competent stranger, can they do it right without knowing what the other strangers are doing?"**

  *   **Yes:** Spreadsheet, Proof Check, Translation (mostly), CRUD (with perfect spec).
  *   **No:** Novel, Proof Find, Debugging, Language Design, Diagnosis.

  The dividing line is **Interaction**. If the chunks interact, the cognition must be unified. If the chunks merely stack, the cognition can be split.
