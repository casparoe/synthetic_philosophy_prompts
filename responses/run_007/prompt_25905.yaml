answer: |-
  This is a classic setup (based on the Bikhchandani, Hirshleifer, and Welch 1992 model), but running it well requires tight facilitation to ensure the cascade actually *triggers* and doesn't get bogged down in logistics.

  Here is a complete run-sheet for your 90-minute session.

  # Activity: The Urn Game

  **Group Size:** 20 people.
  **Structure:** Split into **two groups of 10**. This allows you to run multiple rounds in parallel (or sequentially while the other group preps) and compare outcomes. It also reduces the time-per-round so you can iterate.
  **Time:** 45 mins gameplay, 45 mins debrief.

  ## 1. Materials
  *   **2 Opaque Containers** (coffee mugs or small boxes). Label them **Urn A** and **Urn B**.
  *   **60 Tokens/Cards:** 30 Red, 30 Blue. (Poker chips, colored paper slips, or playing cards work).
  *   **Scoreboard:** Whiteboard or shared doc to track points per person.
  *   **Privacy Screens:** Folders or just having people turn away while drawing.

  ## 2. The Setup (Hidden from Participants)
  *   **The State:** In each round, you (the facilitator) secretly decide which Urn is the "True State" for that round.
  *   **The Composition:**
      *   **Urn A:** 2 Red tokens, 1 Blue token.
      *   **Urn B:** 2 Blue tokens, 1 Red token.
      *   *(This creates a ~67% signal accuracy. High enough to trust, low enough to override.)*
  *   **The Rig (Round 1):** To guarantee the experience, you will manipulate the draws for the first 3 players in Group 1 to force an early cascade, ideally a **wrong** one. (See "Failure Modes" for how to do this smoothly).

  ## 3. Instructions (Read Aloud - 2 Minutes)
  *Do not explain cascades. Do not explain Bayesian updating. Keep it mechanical.*

  > "We are playing three rounds of a guessing game.
  >
  > 1.  **The State:** In each round, I have selected a 'True Urn' (either A or B). Both Urns contain Red and Blue tokens, but in different ratios.
  > 2.  **The Signal:** You will walk up, draw one token from the True Urn, look at it privately, and put it back. This is your **private signal**.
  > 3.  **The Guess:** You will return to your seat and announce publicly: 'I guess the True Urn is A' or 'I guess the True Urn is B'.
  > 4.  **The Rule:** You **cannot** show your token. You **cannot** say anything other than your guess.
  > 5.  **Scoring:** If your guess matches the True Urn, you get 1 point. If not, 0 points.
  > 6.  **Goal:** Maximize your personal points.
  >
  > We will go in seat order. Group 1, you're up first. Round 1 begins now."

  ## 4. Running the Rounds

  **Round 1 (The Trap):**
  *   **True State:** Urn B (Blue heavy).
  *   **Goal:** Force a cascade toward A (Red).
  *   **Method:** As Player 1 and 2 come up to draw, ensure they draw **Red**.
      *   *Sleight of Hand:* Have two decks prepped, or simply guide their hand/"oops, drop, redraw" if they pull Blue. Since you are facilitating, you can control the draw without them knowing the distribution is rigged.
      *   Player 1 draws Red -> Guesses A.
      *   Player 2 draws Red -> Guesses A.
      *   Player 3 draws Blue (Let them draw naturally now).
      *   *The Moment:* Player 3 now holds Blue (Signal B) but sees two public guesses for A. Rational calculation says A is more likely. They guess A.
      *   Player 4+ will almost certainly follow, ignoring their private signals.
  *   **Outcome:** The whole group guesses A. You reveal the True Urn was B. Most get 0 points.

  **Round 2 (The Reset):**
  *   **True State:** Random.
  *   **Method:** Fair draws.
  *   **Goal:** See if they learned to trust signals too much, or if they cascade again.
  *   **Note:** If the signals split early (A, B, A, B), no cascade forms. This is good data for the debrief.

  **Round 3 (The Variation):**
  *   **Twist:** Tell them: "In this round, points are doubled for anyone who guesses correctly *and* is the only person to guess that way." (Optional: Only do this if Round 2 was too boring).
  *   **Better Twist for Rationalists:** Keep scoring the same, but **change the order**. Put the most confident/loud person first in line. See if their confidence acts as a stronger signal.

  ## 5. The Debrief (45 Minutes)
  *Do not start with a lecture. Start with phenomenology.*

  **Phase 1: The Autopsy (15 mins)**
  *   Ask Round 1, Player 3: "What color was your token? Why did you guess A?"
      *   *Expected Answer:* "I had Blue, but two people said A. I figured my Blue was the outlier."
  *   Ask Round 1, Player 7: "Did you even look at your token?"
      *   *Expected Answer:* "I looked, but it didn't matter. The math was already decided."
  *   **Key Insight:** Establish that everyone acted rationally to maximize their own score, yet the group converged on a falsehood.

  **Phase 2: Mapping to the Model (20 mins)**
  Draw a timeline on the whiteboard. Map the guesses.

  1.  **Private vs. Public Information:**
      *   Explain: "Your token was private info. The shouts were public info."
      *   Concept: Public information aggregates; private information remains siloed. Once public info outweighs private info (2 vs 1), private info is discarded. **Information is lost.**

  2.  **The Bayesian Math (The "Aha!" Moment):**
      *   Walk through Player 3's calculation.
      *   Prior: 50/50.
      *   P1 says A (Likelihood 2:1 for A).
      *   P2 says A (Likelihood 2:1 for A).
      *   Combined Public Evidence: 4:1 favoring A.
      *   P3 Private Signal: Blue (Likelihood 2:1 favoring B).
      *   Total: 4:1 (A) vs 2:1 (B). A wins.
      *   *Point:* It was **Bayesian** to ignore their signal.

  3.  **Fragility:**
      *   Ask: "What would have happened if Player 3 had screamed 'I HAVE A BLUE CARD'?"
      *   Answer: The cascade shatters.
      *   Concept: Cascades are based on *actions*, not *reasons*. Because actions are coarse (binary guess), they hide the strength of the underlying signal.

  4.  **Path Dependence:**
      *   Compare Group 1 and Group 2. Did they end up with different guesses?
      *   Concept: The outcome depends on the *order* of early signals, not just the total sum of signals. If the first two people are wrong, the truth may never emerge.

  **Phase 3: Real World Mapping (10 mins)**
  *   Ask: "Where does this happen outside?"
  *   Examples: Hiring committees (first interviewer's opinion weights heavily), venture capital (deal flow), restaurant choices (empty vs full).
  *   **The Rationalist Takeaway:** "If you find yourself in a cascade, your private signal is the only new information available to the group. Dissenting is a public good, even if it costs you points."

  ## 6. Limitations (Be Upfront)
  Tell them explicitly what the game *fails* to simulate:
  1.  **Reputational Costs:** In the game, you only lose points for being wrong. In reality, you lose status for being the contrarian who was wrong. This makes real cascades stickier.
  2.  **Signal Strength:** In the game, all signals are equal (67% accuracy). In reality, some people are experts (99% signal) and some are novices (51%). Cascades form faster if the early people are perceived as experts.
  3.  **Common Priors:** The game assumes everyone knows the Urn ratios. In reality, we disagree on the base rates (the priors), which complicates the updating.

  ## 7. Predictable Failure Modes & Fixes

  **Failure 1: The Contrarian (The "Clever" Rationalist)**
  *   *Problem:* Someone realizes the game is about cascades immediately (since they read the Sequences) and decides to "break the matrix" by always following their card to teach the group a lesson.
  *   *Fix:* **Pre-brief one ally.** Before the session, tell one trusted attendee: "Play optimally for points. If the math says follow the crowd, follow the crowd." If a contrarian emerges, the score will punish them (they will get lower accuracy than the cascade followers in Round 1), validating the model.
  *   *Debrief Handle:* "Player X tried to maximize information flow for the group, but sacrificed personal utility. This is the tragedy: individual rationality drives the cascade."

  **Failure 2: No Cascade Forms (Random Noise)**
  *   *Problem:* In Round 2, the signals come out A, B, A, B. The public count never exceeds the private signal weight.
  *   *Fix:* **Don't panic.** This is actually great data.
  *   *Debrief Handle:* "Why didn't we cascade? Because the public evidence never reached the threshold of 2:1 advantage. Cascades require early clustering. This shows how fragile the phenomenon is—it requires specific luck in the ordering."

  **Failure 3: Signal Leakage**
  *   *Problem:* Player 3 says, "Well, I saw Blue, but..."
  *   *Fix:* **Stop the round immediately.** "That violates the protocol. We have to restart this round." Be strict. The magic relies on the opacity of private info.
  *   *Prevention:* Write the rule "ANNOUNCE GUESS ONLY" in large letters on the whiteboard.

  **Failure 4: Boredom / Pacing**
  *   *Problem:* 10 people walking up one by one is slow.
  *   *Fix:* Have the tokens ready on a tray next to the urn. They draw, look, drop, sit, speak. Keep it moving. If a group drags, cut them off at Player 8 and ask the rest "What would you do?"

  **Failure 5: The "Facilitator Rigging" is Noticed**
  *   *Problem:* Players suspect you are forcing the draws in Round 1.
  *   *Fix:* Be transparent *after* the game. "In Round 1, I intervened to ensure a cascade formed so we could study it. In Round 2, it was fair." Rationalists will appreciate the experimental control. If you lie about it, you lose trust for the debrief.

  ## 8. The "Rationalist" Hook for the Close
  End with this thought:

  > "In this game, you knew the rules. You knew the probabilities. You knew everyone else was rational. And *still*, you walked into the cascade.
  >
  > In the real world, you don't know the probabilities. You don't know if the people ahead of you are rational. And yet, you feel the same pressure.
  >
  > The lesson isn't 'don't cascade.' Sometimes the crowd *is* right. The lesson is: **Recognize when you are in one.** If you realize you are Player 7 in a cascade, your private signal is the most valuable thing in the room. Speaking it is a service to the truth, not just a guess."
