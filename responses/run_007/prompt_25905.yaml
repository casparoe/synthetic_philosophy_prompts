prompt: |-
  so i'm running a session at my local rationalist meetup — maybe 20 people, 90 minutes, most have read the sequences or at least know the bayesian greatest hits. i want to do an activity on information cascades that makes people *feel* the pull of the cascade from the inside, not just nod when i explain the BHW model afterwards.

  here's what i'm picturing: a sequential guessing game where everyone gets a private signal (like a card drawn from a deck) about whether the hidden state is A or B, and they announce their guess publicly one at a time. the private signals are informative but noisy — say, 70% accurate. the key thing is that after two or three people guess the same way, it becomes rational for later players to ignore their own signal and follow the crowd, and the whole group can end up confidently wrong together. i want people to experience that exact moment of "well my card says B but three people ahead of me all said A, so maybe my card is the unlucky one…" and then they go with A, and the next person sees *four* people saying A and it gets even harder to dissent.

  what i need from you: concrete rules, materials (i can print cards or hand out slips, nothing fancy), a points system that doesn't require real money, and a debrief that walks through what happened in terms of the formal model. the debrief should map specific moments in the game onto concepts: public vs private information, the probability that a cascade is wrong even when everyone is updating rationally, why cascades are fragile (a single player with a strong signal or high confidence can shatter one), and the unsettling thing where nobody is being individually irrational but the group outcome is terrible. also, be upfront about which feature of real-world cascades the game *can't* reproduce and that i'll need to supply myself during the debrief.

  also: what will predictably go wrong the first time i run this? i'm guessing some people will try to be clever contrarians and break the cascade on purpose, or someone won't understand their private signal, or the first few guesses come out split and no cascade forms at all. tell me how to handle each of those, and any other failure modes you forsee.

  one hard constraint: no upfront lecture. the instructions should be minimal — just enough to play. they should discover the phenomenon and *then* we name it. if i have to explain what an information cascade is before we start, i've already lost.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**
      *   **Goal:** Run a 90-minute session on Information Cascades for ~20 rationalists (familiar with Bayes/Sequences).
      *   **Core Experience:** Participants must *feel* the pull of the cascade (ignore private signal to follow public consensus) without being lectured beforehand.
      *   **Mechanism:** Sequential guessing game (Private Signal -> Public Guess).
      *   **Requirements:** Concrete rules, materials, points system (no real money), debrief structure (mapping game to BHW model), limitations of the simulation, and troubleshooting/predictable failure modes.
      *   **Constraint:** *No upfront lecture.* Instructions must be minimal.

  2.  **Deconstruct the Activity (The "BHW Game"):**
      *   *State of the World:* Binary (Urn A or Urn B).
      *   *Private Signal:* Draw a ball/card. Urn A has more Red, Urn B has more Blue (or similar). Accuracy needs to be high enough to be useful but low enough to be overridden (e.g., 2/3 or 3/4).
      *   *Public Action:* Announce guess of the Urn.
      *   *Incentive:* Points for guessing the *true* Urn correctly.
      *   *Cascade Condition:* When public history outweighs private signal.

  3.  **Drafting the Rules & Materials:**
      *   *Materials:* Two containers (Urns), colored tokens/cards (Red/Blue).
      *   *Setup:* Need a "True State" for each round. Let's do multiple rounds to let them learn.
      *   *Signals:* If True State is A, 70% chance of Signal A, 30% Signal B.
      *   *Order:* Randomized or fixed? Fixed is easier to manage, but random prevents collusion. Let's say "Order is determined by seating."
      *   *Scoring:* 1 point for correct guess of the *True State*. (Crucial: Do *not* reward contrarianism directly, or they won't feel the cascade pressure. Reward accuracy).
      *   *Instructions:* Keep it tight. "Guess the Urn. Get points. Don't talk except to announce guess."

  4.  **Refining the Mechanics for "Feel":**
      *   To make the cascade *happen* reliably in a 90-min session, the signal accuracy shouldn't be *too* high. If signals are 90% accurate, cascades rarely start. If 60%, they start fast. Let's aim for ~65-70% (e.g., 2 Red/1 Blue in Urn A).
      *   *Wait, a key tweak:* In the classic BHW model, players announce their *guess* of the state, not their signal. This is vital. If they announce signal, no cascade. If they announce guess, cascade.
      *   *Rounds:* Need enough rounds to see a cascade form, and ideally one where it forms *wrongly*.
      *   *Manipulation:* To guarantee they feel it, the facilitator might need to rig the first few draws in Round 1 to ensure a cascade starts. (Ethical? Yes, it's a demo).

  5.  **Developing the Debrief (The "Rationalist" Meat):**
      *   Need to map game moments to concepts.
      *   *Public vs. Private:* The card vs. the shout.
      *   *Rational Ignoring:* Why it was Bayesian to ignore the card.
      *   *Fragility:* How one person breaking rank resets the count.
      *   *Path Dependence:* Order matters.
      *   *Limitations:* Real life has continuous signals, reputational costs, common priors issues, etc.

  6.  **Anticipating Failure Modes (Pre-mortem):**
      *   *Contrarians:* People trying to "break the system." *Fix:* Emphasize scoring is based on accuracy, not uniqueness.
      *   *Confusion:* Not knowing what to announce. *Fix:* Cheat sheet on table.
      *   *No Cascade:* Random noise prevents it. *Fix:* Facilitator rigging the deck for the first round.
      *   *Signal Leakage:* People saying "I had a red card." *Fix:* Strict rule: "Only announce your guess of the Urn."
      *   *Boredom:* 20 people taking turns is slow. *Fix:* Do smaller groups or speed it up. Actually, 20 people in one chain is 90 mins tight. Better to split into 2 groups of 10? Or just accept the slowness for the drama. Let's suggest 2 groups of 10 to allow multiple rounds.

  7.  **Structuring the Response:**
      *   **Title:** Catchy and clear.
      *   **Materials:** Simple list.
      *   **Setup:** Urn composition, scoring.
      *   **Instructions:** Scripted for minimalism.
      *   **The Flow:** Round 1 (Rigged), Round 2 (Natural), etc.
      *   **The Debrief:** Step-by-step mapping to Bayes/BHW.
      *   **Troubleshooting:** Specific solutions for specific problems.
      *   **Limitations:** What the game misses.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* 20 people in a single line takes too long. 90 mins includes debrief.
      *   *Adjustment:* Split into two groups of 10. Run 3 rounds per group. This allows comparison ("Group 1 cascaded wrong, Group 2 didn't").
      *   *Critique:* How to ensure they feel the pressure?
      *   *Adjustment:* In the debrief, ask specific people: "Person #7, what was your card? Why did you say A?"
      *   *Signal Accuracy:* 2:1 ratio (66%) is standard. Let's use that. 2 Red/1 Blue in Urn A. 2 Blue/1 Red in Urn B.
      *   *Scoring:* Points are abstract. "Bragging rights" or "First pick of snacks" works for rationalists.
      *   *Rigging:* I need to explicitly tell the user how to rig the first round to guarantee the experience.

  9.  **Final Polish:** Check against constraints.
      *   No upfront lecture? Yes.
      *   Concrete rules? Yes.
      *   Debrief mapping? Yes.
      *   Failure modes? Yes.
      *   Limitations? Yes.

  10. (Mental Check on Bayes): If P(Signal|State) = 2/3.
      *   Player 1: Follows signal.
      *   Player 2: If same signal, follows. If diff, indifferent (1A, 1B history). Let's say they follow signal.
      *   Player 3: If history is A, A. Player 3 gets Signal B.
          *   P(State=A | History=A,A, Signal=B) vs P(State=B | ...).
          *   Likelihood ratio: (2/3 * 2/3 * 1/3) vs (1/3 * 1/3 * 2/3).
          *   Ratio: 4/27 vs 2/27. A is 2x more likely.
          *   So Player 3 *should* ignore signal B and guess A. Cascade starts.
      *   This math holds up. I will include this in the debrief notes.

  11. *Wait, one nuance:* In BHW, if P1 says A, P2 says B (history balanced), P3 is back to prior. Cascade hasn't started. Cascade starts when the *difference* in public guesses is >= 2. I need to make sure the rigging creates a difference of 2 quickly. (e.g., P1 gets A, P2 gets A).

  12. *Final Plan:* Split into 2 groups. 3 Rounds. Round 1 Rigged (Cascade Wrong). Round 2 Natural. Round 3 Variation. Debrief.

