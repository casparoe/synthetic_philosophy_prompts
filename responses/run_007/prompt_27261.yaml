answer: |-
  **MEMORANDUM**

  **TO:** Philosophy Department Executive Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Frege Prize Namesake

  **1. Purpose and Recommendation**

  The purpose of this memo is to provide the Executive Committee with a analysis of the petition to rename the annual Frege Prize and to offer a recommendation for the Dean's consideration. After reviewing the graduate student petition, faculty feedback, and the terms of the original gift agreement, **the Committee recommends renaming the prize.**

  This recommendation is contingent upon a review by the University's Office of General Counsel regarding the donor agreement. If legal constraints prevent a name change, the Committee recommends a secondary measure of robust contextualization. The primary goal is to align the department's honors with our institutional values of inclusivity while respecting the donor's fundamental intent to support student excellence in logic and philosophy of language.

  **2. Background**

  For thirty years, the Frege Prize has recognized outstanding undergraduate work in logic and philosophy of language. The endowment was established by an alumnus who explicitly designated the prize's name. Recently, a coalition of graduate students petitioned for a name change, citing the 1996 publication of Gottlob Frege's *Political Diary* (1924). This document reveals that in the final year of his life, Frege expressed virulent antisemitism, advocated for the stripping of civil rights and expulsion of Jews from Germany, and admired the leadership of Hitler and Ludendorff.

  Senior faculty have argued for retaining the name, citing the separation of philosophical work from personal politics, the risk of anachronistic judgment, and potential legal constraints. The student petitioners argue that honoring Frege signals institutional indifference to hate speech and exclusion.

  **3. Analysis of Arguments for Retention**

  The arguments for retaining the Frege Prize name rest on three pillars: intellectual legacy, historical context, and fiduciary stability.

  *   **The Separation Thesis:** Proponents argue that Frege's contributions to logic (*Begriffsschrift*) and semantics (sense/reference) are foundational and objectively distinct from his late political views. To rename the prize is to imply that his logic is tainted by his politics, which misrepresents the history of the discipline.
  *   **Historical Anachronism:** Senior faculty contend that judging a 1920s German academic by 2020s standards of diversity is historically unsound. Many figures central to the canon held views now deemed abhorrent; removing them risks erasing history rather than engaging with it.
  *   **Donor Intent and Precedent:** The gift agreement specifies the name. Altering it without donor consent (impossible here due to death) could breach contract law. Furthermore, renaming sets a precedent that could destabilize other named honors, potentially discouraging future donors who fear their legacy may be retroactively judged.

  **4. Analysis of Arguments for Renaming**

  The arguments for renaming prioritize ethical consistency, institutional climate, and the nature of philosophical honor.

  *   **Institutional Values and Harm:** A university prize is not merely a technical marker; it is a symbolic honor. Frege's specific advocacy for the expulsion of Jews directly contradicts the university's commitment to non-discrimination and belonging. For Jewish students and other marginalized groups, seeing a prize named after someone who plotted their disenfranchisement creates a hostile climate.
  *   **The Limits of the Separation Thesis:** While logical symbols may be value-neutral, the *practice* of philosophy is not. Philosophy aims at human flourishing and truth. Honoring a figure who used their intellectual standing to advocate for genocide undermines the discipline's moral authority. We can teach Frege's logic without celebrating his name.
  *   **Opportunity for Inclusivity:** Renaming offers a chance to highlight overlooked contributors (e.g., Christine Ladd-Franklin, Susanne Langer, or contemporary figures), signaling that the department values diverse contributions to logic.
  *   **Donor Intent Interpretation:** The donor's primary intent was to support *student excellence in logic*, not to perpetuate Frege's memory specifically. If the name now hinders the department's ability to attract a diverse pool of applicants, the spirit of the gift is frustrated.

  **5. Legal and Fiduciary Considerations**

  The constraint of the gift agreement is significant but not necessarily absolute. University counsel often applies the *cy pres* doctrine in cases where the original terms become impossible or impracticable to fulfill. If the name "Frege" now generates significant controversy that impedes the department's mission, counsel may advise that the name can be changed while preserving the endowment's financial purpose. We must not proceed without this clearance. However, legal permissibility should not dictate ethical necessity; rather, it defines the pathway.

  **6. Rationale for Recommendation**

  The Committee recommends renaming the prize because the ethical cost of retention outweighs the administrative convenience of the status quo.

  While the "Separation Thesis" holds weight in the classroom, it is less defensible in the context of *honors*. A prize namesake serves as a role model. Frege's late diary does not show mere passive prejudice common to his era; it shows active, analytical engagement with plans for ethnic cleansing. Retaining the name suggests the department considers these views compatible with the values of the philosophical community.

  Regarding the donor agreement: We honor the donor best by ensuring their gift continues to thrive. If the prize becomes a source of division, its utility diminishes. Renaming the prize (e.g., "The Logic and Language Prize" or naming a new figure) preserves the funding for students while aligning the honor with current ethical standards.

  **7. Implementation Plan**

  If the Committee votes to accept this recommendation, the following steps are proposed:

  1.  **Legal Review:** Submit the gift agreement to General Counsel to determine the feasibility of a name change under *cy pres* or modification clauses.
  2.  **Donor Family Consultation:** If legally permissible, contact the alumnus's heirs. Explain the ethical concerns and the desire to preserve their financial legacy while updating the name. Most families prefer their gift to remain functional rather than controversial.
  3.  **Selection Process:** Form a subcommittee (including graduate student representation) to select a new namesake or a descriptive title.
  4.  **Contextual Statement:** Regardless of the outcome, publish a departmental statement acknowledging Frege's contributions to logic alongside the historical record of his political views. This ensures we do not erase history, even if we cease to honor it.

  **8. Conclusion**

  We stand on the shoulders of giants, but we are not bound to wear their names if those names cast a shadow over our community. By renaming the prize, we affirm that the study of logic is compatible with, and indeed requires, a commitment to human dignity.

  **Action Requested:** Vote to approve the recommendation to rename the Frege Prize, subject to legal review.
