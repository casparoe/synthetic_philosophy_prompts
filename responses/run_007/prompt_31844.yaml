answer: |-
  # Diagnostic Instrument: The Nature of Pleasure
  **Seminar:** Theories of Well-Being (Week 2)  
  **Time:** 20 Minutes  
  **Instructions:** Read the five scenarios below. For each question, select the verdict that best matches your intuitive judgement. Do not worry about technical labels; answer according to what you think is true about the cases.

  ---

  ### Part 1: The Diagnostic Questionnaire

  **Q1. The Phenomenal Thread**  
  Consider three experiences: (a) eating a delicious meal, (b) solving a difficult intellectual problem, and (c) the warm glow of anticipating a future holiday.  
  *Verdict:* Do these three experiences share a specific, identifiable felt quality (a 'hedonic tone') that makes them all pleasures, or do they feel too different to share a common phenomenal ingredient?  
  *   **A:** They share a distinctive common feeling.  
  *   **B:** They do not share a common feeling; they are phenomenally diverse.

  **Q2. The Passive Smell**  
  Imagine you walk past a bakery and catch a whiff of fresh bread. It feels pleasant. However, you had no prior desire to smell it, and you do not stop walking or try to prolong the smell.  
  *Verdict:* Is this state a genuine instance of pleasure, even though you had no desire for it and took no action to sustain it?  
  *   **A:** Yes, it is pleasure simply in virtue of how it feels.  
  *   **B:** No, pleasure requires a pro-attitude (desire/liking) or a disposition to sustain the experience.

  **Q3. The Functional Role**  
  Consider two cases:  
  (i) A masochist enjoys pain and seeks to prolong the painful experience.  
  (ii) A subject takes a drug that induces a state they sincerely report as 'pleasurable', but they have no inclination to repeat it or sustain it (perhaps because it leaves them incapacitated).  
  *Verdict:* Are both (i) and (ii) genuine pleasures?  
  *   **A:** Yes, both are pleasures (the subject's report or liking is sufficient).  
  *   **B:** No, (ii) is not genuine pleasure because it plays no positive role in guiding behaviour or reinforcement.

  **Q4. The Malicious Joy**  
  A person takes sincere satisfaction and enjoyment in the misfortune of a rival (schadenfreude). They like the experience. However, the object of their enjoyment is objectively worthless or morally bad.  
  *Verdict:* Is this genuine pleasure?  
  *   **A:** Yes, if they like it, it is pleasure (even if the object is bad).  
  *   **B:** No, genuine pleasure must be a fitting or appropriate response to something good.

  **Q5. The Heterogeneity Consequence**  
  Suppose it turns out that pleasures are genuinely heterogeneous (i.e., there is no single common feature uniting eating, thinking, and smelling; they are only loosely related).  
  *Verdict:* Does this fact refute Hedonism as a theory of well-being?  
  *   **A:** Yes. If 'pleasure' is not a natural kind or unified property, it cannot serve as the single standard of well-being.  
  *   **B:** No. Hedonism can survive even if 'pleasure' is a loose cluster, provided only these states (whatever they are) contribute to well-being.

  ---

  ### Part 2: Diagnostic Key and Logical Space

  *Instructor Note: The following key maps student answer patterns to the six target positions. It is structured as a decision tree based on the logical commitments revealed in Part 1.*

  #### **Step 1: The Unity Check (Q1)**
  *   **If A (Common Feeling):** Proceed to **Branch I (Qualitative)**.
  *   **If B (No Common Feeling):** Proceed to **Branch II (Heterogeneity)**.

  #### **Branch I: Qualitative Commitments**
  *Students who believe pleasures share a phenomenal tone.*
  *   **Check Q4 (Malice):**
      *   **If A (Malice is pleasure):** You hold **Qualitative (Phenomenal) Hedonism**. You believe pleasure is a raw feel, independent of moral worth or desire.
      *   **If B (Malice is not pleasure):** You hold a **Fitting-Attitude View (with Qualitative elements)**. *Note: This is a rare hybrid.* You believe there is a feeling, but only 'fitting' feelings count as pleasure.
      *   **Check Q5 (Heterogeneity):** (Usually irrelevant if Q1=A, but if they answer B to Q1 later...)
          *   *Diagnostic:* Most Qualitative Hedonists answer A to Q5. If they answer B to Q5 despite A to Q1, they are inconsistent.

  #### **Branch II: Heterogeneity Commitments**
  *Students who deny a common phenomenal tone.*
  *   **Check Q2 & Q3 (Attitude/Function):**
      *   **If Q2=B or Q3=B (Desire/Function required):** You lean towards **Functionalism** or **Attitudinal Hedonism**.
          *   *Distinguish:* If you answered **Q3=B** (Drug is not pleasure), you are a **Functionalist**. You define pleasure by its causal role (reinforcement).
          *   *Distinguish:* If you answered **Q3=A** but **Q2=B**, you are likely an **Attitudinal Hedonist**. You require a pro-attitude, but not necessarily behavioural reinforcement.
      *   **If Q2=A and Q3=A (Attitude/Function not required):** You are likely a **Family-Resemblance Theorist** or **Pluralist**.
          *   *Distinguish via Q5:*
              *   **If Q5=A (Hedonism refuted):** You hold **Pluralism about Pleasure**. You believe the heterogeneity of pleasure undermines the monistic structure of Hedonism.
              *   **If Q5=B (Hedonism survives):** You hold the **Family-Resemblance View**. You accept heterogeneity but maintain 'pleasure' is a useful enough category for a theory of well-being.

  #### **Special Branch: Normative Constraints**
  *Regardless of Q1, check Q4.*
  *   **If Q4=B (Malice is not pleasure):** You hold a **Fitting-Attitude View**.
      *   *Note:* This view cuts across the others. A Fitting-Attitude theorist might also be a Functionalist or a Family-Resemblance theorist regarding the *structure* of pleasure, but they insist on the normative constraint. For the purpose of this seminar, we treat this as a distinct leaf because it fundamentally changes the definition of 'pleasure' from a psychological state to a normative status.

  ---

  ### Part 3: Diagnostic Commentary for Instructors

  #### **1. Mapping the Leaves**
  The instrument is designed to isolate the six positions via specific logical commitments:
  1.  **Qualitative Hedonism:** Q1(A), Q2(A), Q3(A), Q4(A).
  2.  **Attitudinal Hedonism:** Q1(B), Q2(B)*, Q3(A), Q4(A). (*Requires a pro-attitude, even if no prior desire).
  3.  **Functionalism:** Q1(B), Q3(B). (The drug case is the primary differentiator).
  4.  **Fitting-Attitude:** Q4(B). (This is the primary differentiator, regardless of other answers).
  5.  **Family-Resemblance:** Q1(B), Q4(A), Q5(B).
  6.  **Pluralism:** Q1(B), Q4(A), Q5(A).

  #### **2. Empty or Unstable Logical Spaces**
  There are answer combinations that the Key does not map to a specific leaf because they represent positions rarely defended or logically unstable:
  *   **Qualitative + Fitting-Attitude (Q1=A, Q4=B):** This position claims there is a specific 'hedonic tone', but that tone only counts as pleasure if it is morally fitting. This is unstable because phenomenal qualities are typically viewed as non-normative raw feels. If the tone is present, it is usually thought to be pleasure regardless of fittingness. This position is effectively unexplored in contemporary literature.
  *   **Functionalism + Qualitative (Q1=A, Q3=B):** Claiming there is a common feeling, but that the feeling doesn't count as pleasure unless it reinforces behaviour. This is a possible view (a 'Functionalised Qualitative View'), but it is redundant. If the function is the necessary condition, the quality is superfluous. It is generally subsumed under pure Functionalism.
  *   **Pluralism + Common Feeling (Q1=A, Q5=A):** If the student admits a common feeling exists (Q1=A) but claims Hedonism is refuted by heterogeneity (Q5=A), they are contradicting themselves. If there is a common feeling, there is unity. This indicates a misunderstanding of the 'Heterogeneity Objection'.

  #### **3. Indistinguishable Pairs**
  This instrument cannot perfectly separate **Attitudinal Hedonism** and **Qualitative Hedonism** in all instances.
  *   **Why:** Many students will answer 'Yes' to Q1 (Common Feeling) because introspection *seems* to reveal a tone, even if they theoretically prefer the Attitudinal view. Conversely, some Qualitative Hedonists admit the tone is hard to describe (Q1=B) but insist it exists.
  *   **Where they come apart:** They diverge on the *metaphysics* of pleasure, not always on case verdicts. The instrument relies on Q2 (The Passive Smell) to pry them apart. Qualitative theorists say the smell is pleasure (it feels good). Attitudinal theorists often say it is not pleasure unless the subject *likes* that feeling (a second-order attitude). If a student answers Q1(A) but Q2(B), they are likely an Attitudinal Hedonist who misdescribed their Q1 intuition. Discussion in class should focus on this tension.

  #### **4. The Fitting-Attitude Overlap**
  The **Fitting-Attitude View** is a 'cross-cutting' position. A student could be a Functionalist *and* believe the function must be fitting. However, for the purposes of a seminar on Hedonism, the crucial distinction is whether 'pleasure' is a psychological natural kind (Qualitative/Attitudinal/Functional) or a normative status (Fitting-Attitude). The instrument isolates this via Q4. If a student answers Q4(B), they are prioritising the normative constraint over the psychological description, which is the defining feature of the Fitting-Attitude view in this context.

  #### **5. Usage Note**
  If a large proportion of the class lands on **Pluralism (Q1=B, Q5=A)**, this provides an excellent entry point for the second week's lecture. It suggests they find the Heterogeneity Objection intuitively compelling before even hearing the standard replies (such as the Family-Resemblance defence). If most land on **Qualitative Hedonism**, the Heterogeneity Objection will require more work to motivate.
