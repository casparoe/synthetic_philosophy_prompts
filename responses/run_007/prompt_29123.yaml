  Next week I'm giving a department colloquium defending illusionism about phenomenal consciousness — roughly, that there are no phenomenal properties, no qualia and no what-it-is-likeness, and that introspection systematically misrepresents us as having them, in the general spirit of Frankish and Dennett. The department is a weird mix: two senior people from a Heidegger/Merleau-Ponty phenomenology background who think the whole framing is a Cartesian mistake, three analytic philosophers of mind who are Chalmers-style realists about consciousness, one Dennettian who likes the project but thinks the word "illusionism" overstates it, and a bunch of grad students who have read the Frankish/Chalmers back-and-forth. Give me a Q&A prep sheet: the objections I'll actually get from this audience, in roughly the order they'll come, phrased the way those peple would phrase them, each with a two-minute reply and an honest note on where the reply is soft. Include the question I'm hoping nobody asks. Also flag which objection I should concede the most to, and tell me which of these would genuinely make me reconsider the view rather than just force a clarification — that is, where my reasoning is most likely to fail.
