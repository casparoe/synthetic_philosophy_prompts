answer: |-
  Here is a structured analysis of the desiderata for a theory of aggregation, designed to help clarify the dialectic in your seminar.

  ### The Desiderata for a Theory of Aggregation

  Any adequate theory of how to choose between saving different numbers of people must navigate a set of competing constraints. Below are six core desiderata. For each, I have identified the motivating consideration, classified its status (Non-negotiable vs. Substantive Commitment), and indicated which of your specific issues it addresses.

  #### 1. The Aggregation Intuition (The "Save the Greater Number" Constraint)
  *   **Requirement:** In a deterministic choice between saving one person (A) and saving five people (B–F), where all else is equal, the theory must prescribe saving the five.
  *   **Motivating Case:** The standard "Rescue Case." If you can press a button to save five strangers or a different button to save one, and you choose the one, most people intuitively judge this as morally wrong, not merely suboptimal.
  *   **Status:** **Substantive Commitment.**
      *   *Reasoning:* While this intuition is dominant, it is not logically non-negotiable. Taurek's entire project is to reject this desideratum as question-begging. He argues that the intuition relies on an illicit summation of losses. A theory can be coherent without satisfying this, provided it offers a compelling alternative explanation for why our intuition is mistaken (e.g., by appealing to the separateness of persons).
  *   **Addresses:** Whether numbers must count; Deterministic choices.

  #### 2. The Separateness of Persons Constraint
  *   **Requirement:** The theory must not treat the losses suffered by distinct individuals as fungible units that can be summed to outweigh the loss of a single individual. The fact that B–F are five different people must matter morally, not just numerically.
  *   **Motivating Case:** Taurek's "Loss is not comparable across persons." If A loses his life, that is a 100% loss for A. If B–F are saved, they do not collectively "share" a gain that outweighs A's loss. To sacrifice A for B–F is to treat A as a mere means to the aggregate good.
  *   **Status:** **Substantive Commitment.**
      *   *Reasoning:* Parfit argues that rejecting aggregation leads to "Innumeracy"—an irrational refusal to acknowledge that five deaths are worse than one. A consequentialist theory rejects this constraint explicitly, arguing that the *outcome* (5 deaths vs. 1 death) is what matters, regardless of the distribution of loss across persons. Thus, a theory can be adequate without satisfying Taurek's strong version of this constraint, though it must address the worry.
  *   **Addresses:** Relevance of each person having only one life to lose; Aggregating across lives.

  #### 3. The Equal Respect Requirement
  *   **Requirement:** The theory must demonstrate that it treats each person as an equal moral agent. It cannot simply dismiss the claims of the minority as morally irrelevant.
  *   **Motivating Case:** Scanlon's contractualism. If you simply save the five without acknowledging the claim of the one, you are treating the one as if their claim did not exist. Equal respect requires that we justify our actions to each person affected.
  *   **Status:** **Non-negotiable.**
      *   *Reasoning:* A moral theory that explicitly advocates for *unequal* concern (e.g., "the lives of group B count for more than group A simply because of who they are") is dead on arrival in contemporary moral philosophy. However, *what counts* as satisfying equal respect is the battleground. Utilitarians claim counting everyone as one satisfies it; Taurek claims giving equal chances satisfies it. The requirement to *have* an account of equal respect is non-negotiable; the specific procedural demand (e.g., a lottery) is substantive.
  *   **Addresses:** Equal concern/respect; Procedural vs. substantive demands.

  #### 4. The Coherence Constraint (Intra- vs. Inter-personal Aggregation)
  *   **Requirement:** The theory must provide a principled explanation for why we aggregate goods/bads within a single life (e.g., enduring a headache for an hour to avoid a headache for a day) but allegedly cannot aggregate across lives (e.g., one person's headache vs. five people's headaches), or it must argue that there is no relevant difference.
  *   **Motivating Case:** Parfit's "Innumeracy" argument against Taurek. If it is rational for me to suffer a pain now to avoid a greater pain later (intra-personal aggregation), why is it irrational for a group to suffer less total pain even if distributed across persons (inter-personal aggregation)?
  *   **Status:** **Substantive Commitment.**
      *   *Reasoning:* Kamm argues that there *is* a relevant difference (the "separateness of persons" is a moral boundary, not just a physical one). A theory can reject this desideratum by arguing that intra-personal aggregation is just as problematic as inter-personal aggregation (a rare view), or by biting the bullet and accepting inter-personal aggregation. However, a theory that distinguishes the two without explaining *why* the boundary matters is theoretically ad hoc.
  *   **Addresses:** Distinction between aggregating within a life vs. across lives.

  #### 5. The Ex Ante / Ex Post Consistency Constraint
  *   **Requirement:** The theory should not yield radically different verdicts in deterministic cases (certainty) vs. probabilistic cases (risk) without a compelling reason. Specifically, if a lottery is fair under uncertainty, does fairness demand a lottery under certainty?
  *   **Motivating Case:** The shift from "Save A or Save B & C" to "Save A with 100% probability or Save B & C with 50% probability." Some views (Ex Post) say save the greater expected number. Others (Ex Ante) say give everyone an equal expected chance.
  *   **Status:** **Substantive Commitment.**
      *   *Reasoning:* Hirose and Otsuka highlight that Ex Ante and Ex Post views diverge. A theory could reasonably claim that rescue cases (certainty) are fundamentally different from policy cases (risk). However, a theory that flips its verdict based solely on the presence of probability, without a deeper principle explaining the shift, risks inconsistency.
  *   **Addresses:** Deterministic vs. Uncertain choices; Weighted lotteries.

  #### 6. The Generalizability Constraint
  *   **Requirement:** The theory should ideally apply not just to "one-off" rescue cases but also to institutional distributive justice (e.g., triage protocols, health care allocation).
  *   **Motivating Case:** If we toss a coin in a rescue case, should we toss a coin when allocating ventilators in a pandemic? If we save the greater number in rescue, should we always maximize QALYs in health policy?
  *   **Status:** **Substantive Commitment.**
      *   *Reasoning:* Some philosophers (e.g., certain particularists) argue rescue cases are *sui generis* because of the immediacy and lack of prior institutional rules. A theory could be adequate for moral philosophy without being a complete policy guide. However, a theory that works for rescue but collapses in distributive justice (or vice versa) is limited in scope.
  *   **Addresses:** Rescue vs. Distributive Justice.

  ***

  ### The Impossibility Result: The Fairness/Outcome Trilemma

  You asked to flag if these desiderata reveal an impossibility result. I believe they do. There is a strong case that **no theory can simultaneously satisfy the strong versions of Desiderata 1, 2, and 3.**

  This is a variation of the tension identified by Peter Diamond and later formalized in social choice theory applied to ethics. Consider the following trilemma:

  1.  **Outcome Optimality:** We must save the greater number in deterministic cases (Desideratum 1).
  2.  **Individual Fairness:** We must give each individual an equal (or significant) chance of being saved when their claims conflict (Desideratum 3, interpreted procedurally).
  3.  **Person-Neutrality:** We must not treat persons differently based on arbitrary groupings (Desideratum 2/3).

  If you satisfy **(1)** (Save the 5), you violate **(2)** (The 1 gets a 0% chance).
  If you satisfy **(2)** (Toss a coin), you violate **(1)** (You risk letting 5 die to save 1).
  If you try to compromise with a **Weighted Lottery** (give the 5 a higher probability), you face a challenge from **(3)**: Why does the mere presence of others increase *my* individual claim to be saved? (This is the "complaint of the single individual" in Scanlon's framework).

  **Conclusion on Impossibility:** You cannot have a theory that guarantees the best outcome, guarantees procedural fairness to the individual, and respects the separateness of persons without some form of lexical prioritization or compromise that leaves one desideratum partially unsatisfied. The debate is essentially about *which* desideratum to relax.

  ***

  ### Scorecard: How the Views Fare

  Here is a brief evaluation of the major positions against the desiderata list.

  | View | Aggregation (Save 5) | Separateness of Persons | Equal Respect | Coherence (Intra/Inter) | Consistency (Risk/Certainty) | Generalizability |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Taurek (Equal Chances)** | **FAIL.** Explicitly rejects saving the greater number. | **PASS.** Protects the individual from being summed. | **PASS (Procedural).** Satisfied by the coin toss. | **PASS.** Rejects aggregation across the board. | **PASS.** Treats risk and certainty similarly (always lottery). | **WEAK.** Hard to apply to institutional policy (inefficient). |
  | **Straightforward Utilitarianism** | **PASS.** Maximizes lives saved. | **FAIL.** Sums utility across persons freely. | **SUBSTANTIVE.** Claims counting everyone as one *is* respect. | **PASS.** Aggregates everywhere. | **PASS.** Maximizes expected utility in both. | **PASS.** Generalizes well to policy. |
  | **Kamm (Pairwise Comparison)** | **PASS.** Saves the greater number via tie-breaking. | **PASS.** Claims numbers count only via individual pairwise comparisons. | **PASS.** Each individual's claim is weighed against one other. | **FAIL/CONTROVERSIAL.** Argues intra-personal aggregation is okay, inter-personal is not (Parfit disputes coherence). | **MIXED.** Complex application to risk cases. | **MIXED.** Difficult to operationalize in policy. |
  | **Scanlon (Contractualism)** | **PASS.** The one cannot reasonably reject a principle that saves the five. | **PASS.** Focuses on justifiability to each person. | **PASS.** Central to the framework. | **PASS.** Relies on the "strength of claims" rather than summation. | **MIXED.** Ex Ante contractualism struggles with risk cases (Otsuka's critique). | **PASS.** Designed for general principles. |
  | **Weighted Lottery (e.g., Broome/Saunders)** | **COMPROMISE.** Gives 5 a higher chance, but not 100%. | **PASS.** Acknowledges individual claims but weights them. | **COMPROMISE.** Satisfies fairness partially, optimality partially. | **PASS.** Consistent logic across cases. | **PASS.** Designed specifically for risk/certainty parity. | **PASS.** Useful for triage protocols. |

  **Summary for your seminar:**
  The "Straightforward Saving" view wins on **Outcome** and **Generalizability** but loses on **Separateness**. Taurek wins on **Separateness** and **Procedural Fairness** but loses on **Outcome**. Kamm and Scanlon attempt to secure **Outcome** while respecting **Separateness**, but face challenges on **Coherence** (Kamm) and **Risk** (Scanlon). The Weighted Lottery acknowledges the **Impossibility Result** explicitly and attempts a pragmatic compromise, satisfying none of the desiderata fully but failing none catastrophically.

  Your task in settling on a view is likely to decide which of the three corners of the Trilemma (Outcome, Individual Fairness, Person-Neutrality) you are most willing to relax.
