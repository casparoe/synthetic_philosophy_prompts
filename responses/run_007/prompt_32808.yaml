          *   *Weakness:* Spandrel hypothesis *is* testable (developmental modeling). Adaptationism is often *more* prone to just-so stories.
          *   *Verdict:* Overreaches. Accusing spandrelism of being inherently unfalsifiable is incorrect if developmental mechanisms are specified (which Mara did).

      *   **Move 5 (Mara - Panglossian Paradigm):**
