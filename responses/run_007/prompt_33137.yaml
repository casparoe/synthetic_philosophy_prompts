          *   *Illusionism (Frankish):* Phenomenal consciousness isn't what we think it is.
      *   **Common Ground:** Both agree on the definition of physicalism (supervenience), both agree on the logic of the argument (if possible, physicalism fails), both agree on the hardness of the problem.
      *   **The Novel's Angle:** The document needs to hint at the *epistemic* horror the character feels (the "other minds" problem) without reducing the philosophy to mere plot device.

  3.  **Drafting - Section by Section:**

