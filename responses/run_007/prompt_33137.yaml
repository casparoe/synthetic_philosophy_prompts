          *   *Row 2: The Nature of the Intuition.* (Z-Theorist: Reveals modal reality. Physicalist: Reveals cognitive limitation/conceptual structure).
          *   *Row 3: Phenomenal Concepts.* (Z-Theorist: Direct reference to properties. Physicalist: Unique mode of presentation of physical states).
          *   *Row 4: The Hard Problem.* (Z-Theorist: Real explanatory barrier. Physicalist: Illusory or resolvable).

      *   **Section 3: Cruxes:**
