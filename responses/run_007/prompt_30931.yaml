  A friend who follows philosophy of religion has offered me the following summary of J.L. Schellenberg's argument from divine hiddenness:

  'The divine hiddenness argument says that if God existed, He would make His existence obvious to everyone, because a loving parent doesn't hide from their children. Since there are plenty of sincere atheists and agnostics who have looked hard at the evidence and just don't find it convincing, God must not exist. It's basically the problem of evil applied to non-belief: a good God wouldn't condemn people to hell just for not being convinced by insufficient evidence.'

  I suspect this conflates a few things but I'm not confident I can identify precisely where it goes wrong. Could you go through this characterisation sentence by sentence and tell me which parts a defender of the argument would accept as fair, which parts misrepresent it, and whether the final clause about hell is part of Schellenberg's actual case or belongs to a different debate? Please write your answer in British English.
