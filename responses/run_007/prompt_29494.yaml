      **MEMORANDUM**

      **TO:** Admissions Committee
      **FROM:** [Committee Member]
      **DATE:** October 26, 2023
      **SUBJECT:** Decision on Quantitative Screening Exam Requirement

      I recommend we eliminate the in-person quantitative screening exam effective immediately and replace it with a mandatory, substantive pre-matriculation writing module for the next admissions cycle.

      Our colleagues defending the exam correctly identify that admissions processes rely on signaling; they argue the exam functions as an **honest signal** of applicant commitment because it imposes a tangible burden. Their contention is that only serious candidates will endure the cost, thereby separating themselves from dilettantes. However, this application of the **handicap** principle is theoretically unsound. For a costly signal to remain honest and reliable, there must be a **differential cost** structure wherein the signal is less costly for the high-quality sender than for the low-quality sender.

      The current exam imposes a uniform monetary and temporal cost that is largely orthogonal to academic commitment. A wealthy dilettante incurs less marginal utility loss from the exam fee and travel than a resource-constrained serious scholar. Consequently, the requirement fails to screen for the intended trait, instead selecting for liquidity and schedule flexibility. Our data confirming the exam's lack of predictive validity for grades or completion underscores this theoretical failure: we are paying a diversity and equity price for a signal that does not correlate with the quality we seek to measure.

      To retain a commitment filter without the exclusionary noise, we should implement a program-specific research proposal due two weeks after an offer of admission is extended. This maintains a effort-based **handicap**—requiring time and intellectual engagement—but aligns the cost with academic capability rather than financial status. We must finalize this change by December 1st to update application materials for the cycle opening September 1st.

