      *   Ordered? Yes.
      *   2-min replies? (Will keep text concise).
      *   Weakness notes? Yes.
      *   Hope nobody asks? Yes.
      *   Top 2 + Concessions? Yes.
      *   Confidence assessment? Yes.

  9.  **Final Polish:** Check tone. Ensure it sounds like a prep sheet for a philosopher, using appropriate jargon (PMI, no-miracles, referential continuity, etc.).

  *(Self-Correction on "Hope Nobody Asks"):* The best "killer" question is usually one that exposes a tension between the two criteria. What if a posit is robust but *not* predictive? Or predictive but *not* robust? Or worse: What if a posit meets both criteria but we now know it's false? I'll choose the latter as the "Hope Nobody Asks."

  *(Refining the Biology Objection):* Make sure it targets "novel predictive success" which is tricky in historical biology.

  *(Refining the Structuralist Objection):* Ensure the distinction between "posits" and "structure" is clear.

