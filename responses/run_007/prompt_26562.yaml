answer: |-
  # Q&A Prep Sheet: Selective Realism & The Pessimistic Meta-Induction

  **Seminar Context:** Philosophy of Science Research Seminar
  **Thesis:** PMI defeats Convergent Realism but fails against Selective Realism (Indispensability for Novel Success + Cross-Theoretic Robustness).
  **Goal:** Defend the criterion against charges of post-hocery, historical counter-examples, and rival realist frameworks.

  ---

  ## Top 8 Objections (Ordered by Likelihood & Damage)

  ### 1. The "Gerrymandering" Charge (Laudan-style Anti-Realist)
  **The Question:** "Your criterion requires posits to be indispensable for *novel* success AND survive *robustness* checks. Isn't this just drawing the target around the arrow? You look at which past posits turned out true, then design a filter that lets only them through. If the criterion wasn't formulated *before* examining the history, it's just rationalization, not a defense of realism."

  **The Reply:** "That's a serious methodological worry, but it conflates the *context of discovery* with the *context of justification*. I am not claiming I derived this criterion in a vacuum. However, the justification isn't circular if the criterion is motivated by independent epistemic principles: namely, that novelty rules out accommodation, and robustness rules out artifact. The test isn't whether I thought of it yesterday, but whether it applies consistently to cases I *didn't* use to build it. If I apply this to contemporary cases—say, dark matter or gravitational waves—and it yields stable commitments without historical hindsight, the charge of pure post-hocery loses force. I'm offering a principled filter, not a historical cleanup crew."

  **Weakness:** This relies on the promise that the criterion works on *current* science. If you can't demonstrate that convincingly in the talk, this reply sounds like a promissory note.

  ### 2. The Fresnel/Ether Counter-Example (Agnostic/Historian)
  **The Question:** "Let's look at Fresnel. The luminiferous ether was indispensable for his novel prediction of the white spot. It was robust across optics and mechanics at the time. By your lights, we should have been realists about the ether. But the ether doesn't exist. So your criterion yields false positives. How is this different from standard convergent realism?"

  **The Reply:** "The ether case is the hard test, and here the 'cross-theoretic robustness' clause does the heavy lifting. While the ether was robust within 19th-century physics, it failed the *inter-theoretic* robustness check once electromagnetism and relativity emerged. My claim isn't that scientists *then* knew it was real, but that *we*, looking back, can see which parts survived the robustness gauntlet. The mathematical structure of Fresnel's waves survived; the mechanical medium did not. Selective realism allows us to say the *wave dynamics* were real (referentially successful) without committing to the *substrate*. The PMI says we must be wrong about everything; I'm saying we can distinguish the substrate from the dynamics."

  **Weakness:** You are walking a tightrope between saying "the ether was real" (false) and "nothing was real" (PMI wins). Distinguishing the math from the ontology without sounding like a Structural Realist (see #3) is difficult.

  ### 3. The Structural Realist Challenge (Worrall Mould)
  **The Question:** "You're restricting realism to specific posits that survive. But Worrall showed that in the Fresnel-to-Maxwell transition, it wasn't the posits (ether vs. field) that survived, it was the *equations*. Why commit to entities at all? If structure is all that is conserved through theory change, isn't your 'selective entity realism' just an unstable halfway house to Epistemic Structural Realism?"

  **The Reply:** "Structure doesn't float free of ontology. Equations describe *something*. My robustness condition is actually a way of identifying which structural relations correspond to genuine causal powers. If I manipulate an electron, I'm not just manipulating a node in a structure; I'm interacting with an entity. Structural realism often struggles to explain *why* the structure holds without some ontological ground. My view grants that structure is the primary carrier of continuity, but argues that robust structural roles justify commitment to the occupants of those roles. We can be structuralists about continuity and realists about ontology without contradiction."

  **Weakness:** Structuralists will find this unsatisfying. They argue structure *replaces* ontology. You risk sounding like you want the safety of structuralism with the comfort of entity realism.

  ### 4. The Biology Scope Objection (Philosopher of Biology)
  **The Question:** "This whole debate is physics-centric. 'Novel predictive success' and 'cross-theoretic robustness' make sense for particle physics. But in evolutionary biology, we rarely get novel quantitative predictions, and 'robustness' looks different (e.g., robustness across models, not theories). Does your criterion imply we should be anti-realists about genes or natural selection because they don't meet your physics-heavy standards?"

  **The Reply:** "That's a crucial limitation to acknowledge. I am not proposing a monolithic criterion for all sciences. In biology, 'novelty' might look like predicting a new fossil lineage or a genetic mechanism, and 'robustness' is often model-robustness rather than theory-unification. I'd argue the *principle* translates: commit to posits that are indispensable for successful intervention and survive multiple modeling frameworks. If the criterion needs tweaking for biology, that doesn't defeat it for physics, but I agree we shouldn't impose particle-physics standards on population genetics."

  **Weakness:** Conceding that the criterion needs "tweaking" opens the door to the claim that it's not a unified theory of scientific realism, weakening its philosophical force.

  ### 5. The Entity Realist "Manipulability" Objection (Hacking-Cartwright)
  **The Question:** "You require novel prediction *and* robustness. That's too demanding. Hacking said, 'If you can spray them, they are real.' I can manipulate electrons without knowing the theory that predicts them. Why tie realism to *predictive success* at all? If I can intervene, isn't that enough for realism, regardless of whether the posit was indispensable for a novel prediction?"

  **The Reply:** "Manipulability is a strong indicator, but it's not sufficient for *theoretical* realism. I can manipulate a black box without knowing what's inside. My criterion aims to secure realism about the *theoretical description* of the entity, not just its existence. Intervention tells me *something* is there; novel prediction tells me my *account* of what is there is latching onto reality. Without the predictive constraint, entity realism risks becoming a minimal existential claim that doesn't answer the PMI's worry about the *nature* of the posits."

  **Weakness:** Hacking fans think existence is all that matters. You are shifting the goalposts from "existence" to "correct theoretical description," which they may reject as unnecessary intellectual baggage.

  ### 6. The "No Miracles" Dilution (Laudan/Agnostic)
  **The Question:** "The No Miracles Argument works because realism explains the success of science. But if you discard most of the theory—keeping only the 'indispensable robust bits'—you've diluted realism so much it no longer explains the success. If most of the theory is false, why did the whole package work? You've saved realism by making it trivial."

  **The Reply:** "It's not trivial if the 'indispensable robust bits' are the actual causal engines of the prediction. A car runs because of the engine, not the paint job. If I say the engine is real and the paint is not, I haven't diluted the explanation of the car's motion; I've refined it. Convergent realism forces us to defend the paint job. My selective realism argues that the success is miraculous *only if* the working parts are real. The rest is scaffolding. Explaining success doesn't require every brick to be true, only the load-bearing ones."

  **Weakness:** Determining which bricks are "load-bearing" is notoriously difficult in complex theories where holism suggests everything contributes to confirmation.

  ### 7. Defining "Indispensability" (Technical/Grad Student)
  **The Question:** "How do you actually determine indispensability? Quine showed we can always reformulate theories to discard posits. How do you avoid the problem that what looks indispensable today might be formulated away tomorrow without loss of predictive power?"

  **The Reply:** "I'm using a pragmatic, not logical, notion of indispensability. A posit is indispensable if, given the current conceptual framework and available mathematics, removing it destroys the generative mechanism of the prediction. It's not about logical possibility, but about scientific practice. If the community cannot derive the novel result without invoking the posit, it is practically indispensable. This anchors realism in actual scientific reasoning, not abstract logical reformulations."

  **Weakness:** This makes realism relative to current human cognitive limitations and mathematical tools, which undermines the mind-independent claim of realism.

  ### 8. The "Hope Nobody Asks" Question
  **The Question:** "Can you name a specific historical posit that meets *both* your criteria (indispensable for novel success + cross-theoretic robustness) but which we now know is *false*? If you can't, isn't that just because you've defined the criteria to exclude anything we now know is false?"

  **The Reply:** [Pause] "If I could name one, I would have adjusted the criteria. The claim is that this combination tracks truth-conduciveness. However, I acknowledge that the absence of known false positives is partly due to the historical record being filtered by our current knowledge. The strength of the argument rests on the *epistemic justification* of the criteria (novelty and robustness are truth-tracking), not just the historical tally. I am arguing these are the best indicators we have, not that they are infallible."

  **Weakness:** This is the most dangerous question. Admitting you can't name a false positive looks like confirmation of the post-hoc charge. You have to lean heavily on the *a priori* justification of the criteria.

  ---

  ## Strategic Concessions (Take the Wind Out of Their Sails)

  **1. Concede on the "Algorithm" Point (vs. Laudan):**
  *   **Concession:** Admit openly that your criterion is not an algorithm that spits out "Real/Not Real" automatically. It requires philosophical judgment to apply.
  *   **Why:** The anti-realists want to trap you into saying "This rule guarantees truth." If you admit it's a fallible heuristic that *improves* our odds rather than guaranteeing success, the "Post-Hoc" charge loses its sting. You aren't claiming infallibility, just better tracking than convergent realism.
  *   **Phrasing:** "I am not offering a decision procedure that eliminates human judgment. I am offering a set of epistemic virtues that, when combined, maximize referential continuity."

  **2. Concede on the "Entity vs. Structure" Tension (vs. Worrall):**
  *   **Concession:** Acknowledge that in many cases (like Fresnel), the "posit" that survives is so abstract it looks like structure.
  *   **Why:** Fighting Worrall tooth-and-nail on entities alienates the structuralists and makes you look naive about theory change.
  *   **Phrasing:** "I agree that the line between a highly abstract posit and a structure is blurry. My view is compatible with the idea that the 'entities' we commit to are structurally defined. I differ only in insisting that structural roles must be occupied by *something*."

  ---

  ## Confidence Assessment

  **Confidence in Analysis:** **High (85%)**
  *   **Reasoning:** The objections listed are the standard "greatest hits" of the realism/anti-realism debate tailored to your specific thesis. The Laudan (post-hoc) and Fresnel (historical) objections are inevitable in this context. The Structuralist and Entity Realist challenges are the standard rival positions.
  *   **Uncertainty:** I am least sure about the **Biology Objection**. Depending on the specific work of the philosopher of biology attending, "novel predictive success" might be a much harder sell in biology than I've allowed for. If they are a strong proponent of "model-based science" (e.g., Keller, O'Malley), they might argue that "robustness" in biology is purely pragmatic, not ontological.
  *   **Weakest Point in Prep:** The reply to the **"Hope Nobody Asks"** question. It is inherently difficult to defend a truth-tracking criterion without pointing to truth-tracking success. If pressed hard here, you may need to pivot to a "best explanation" argument rather than a historical tally argument.

  **Final Advice:** The Laudan-style faculty will be your toughest audience. Do not try to convince them they are wrong about history; convince them that your *extraction procedure* is more methodologically sound than their blanket skepticism. If you win the methodological point, the historical point follows.
