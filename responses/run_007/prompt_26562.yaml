      *   *Criterion:* Indispensable to *novel predictive success* AND survived *cross-theoretic robustness check*.
      *   *Historical Claim:* Laudan's list looks bad for realism only because we haven't applied the right filter.

  3.  **Brainstorm Objections based on Audience Profiles:**

      *   *Laudan-style Anti-Realists (2 people):*
          *   Objection 1: Post-hocery. You're just drawing the target around the arrow after the fact.
          *   Objection 2: The "no miracles" argument doesn't work if you discard so much. Why call it realism?
          *   Objection 3: Historical counter-examples where "indispensable" posits were still wrong (e.g., ether).

      *   *Structural Realist (Worrall mould):*
          *   Objection 4: Structure is what matters. Posits (entities) change, equations stay. Why commit to entities even selectively?
          *   Objection 5: Your robustness check is just a proxy for structural continuity anyway.

      *   *Entity Realist (Hacking-Cartwright):*
          *   Objection 6: Manipulability is enough. You don't need prediction or robustness. If I can spray electrons, they exist. Your bar is too high.

      *   *Agnostics/Students (Historical Cases):*
          *   Objection 7: Apply it to Fresnel. The ether was indispensable for prediction. Did it survive robustness? No. So you say it wasn't real? But the math worked.
          *   Objection 8: Phlogiston. Was it indispensable? Some say yes. How does your criterion handle it without looking gerrymandered?

      *   *Philosopher of Biology:*
          *   Objection 9: Physics bias. "Novel predictive success" and "cross-theoretic robustness" look very physics-heavy. What about genes or natural selection?

  4.  **Select and Order the Top 8:**
      *   *Criteria:* Likelihood + Damage.
      *   1. *The Post-Hoc Charge (Laudan camp).* Most likely, very damaging. If the criterion is gerrymandered, the thesis collapses.
      *   2. *The Ether/Fresnel Case (Agnostics/History).* Classic PMI example. If the criterion fails here, the historical claim fails.
      *   3. *Structural Realist Challenge.* Philosophically sophisticated. Challenges the "entity" focus.
      *   4. *Biology/Generalizability.* Important for scope.
      *   5. *Entity Realist "Manipulability" Objection.* Challenges the necessity of the "prediction" clause.
      *   6. *The "No Miracles" Dilution.* If you select too much, realism loses its explanatory punch.
      *   7. *Defining "Indispensability".* Technical worry about the criterion itself.
      *   8. *The "Hope Nobody Asks" Question.* Needs to be a killer blow, perhaps about the definition of "novelty" or a specific historical anomaly that breaks the rule.

      *Refining the Order:*
      1.  Post-Hoc/Gerrymandering (Laudan) - *Highest Damage/Likelihood.*
      2.  The Fresnel/Ether Case (History) - *Concrete test of the thesis.*
      3.  Structural Realist (Worrall) - *Strong philosophical rival.*
      4.  Biology/Scope (Bio Phil) - *Scope limitation.*
      5.  Entity Realist (Hacking) - *Alternative realist route.*
      6.  Dilution of Realism (Laudan/Agnostic) - *Is it still realism?*
      7.  Defining Robustness (Technical) - *Clarity.*
      8.  Hope Nobody Asks: A case where robust posits were *still* false (e.g., certain aspects of DNA structure or specific planetary models).

  5.  **Drafting Replies (Iterative Process):**
      *   *Constraint:* ~2 minutes spoken (approx. 250-300 words).
      *   *Tone:* Professional, charitable but firm.
      *   *Weakness Note:* Must be honest.

      *(Self-Correction during drafting)*: Make sure the "Selective Realism" definition is consistent. It's not just "working parts," it's "indispensable for *novel* success" + "cross-theoretic robustness." I need to ensure the replies lean on the *combination* of these two, as that's the unique contribution.

  6.  **Identifying the Two Strongest Objections & Concessions:**
      *   *Strongest:* Post-Hoc charge (methodological) and Fresnel/Ether (historical).
      *   *Concessions:* Acknowledge that the criterion isn't algorithmic (blunts post-hoc). Acknowledge that some "indispensable" posits might still be idealized/false, but the *referential* core survives (blunts ether).

  7.  **Confidence Assessment:**
      *   Need to evaluate how well I know the specific literature (Laudan, Worrall, Hacking, PMI debates). I am confident in the standard moves, but the "cross-theoretic robustness" is the user's specific twist, so I have to infer its vulnerabilities.

  8.  **Final Review against Constraints:**
