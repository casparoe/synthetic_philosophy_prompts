answer: |-
  This is a brilliant piece of reasoning. You have independently reconstructed one of the most famous problems in the philosophy of probability, often attributed to Hans Reichenbach and John Maynard Keynes. You are right to feel stuck: logically, your argument is valid. If premises (1) through (5) are true, (6) must be false.

  Since you cannot accept that risk scoring is literally arbitrary (because empirically, some models save lives and others don't), one of the premises must go.

  As a philosopher of probability, I recommend you **reject Premise (5)**, while significantly **nuancing Premise (3)**.

  Here is the breakdown of why (5) is the weak link, how to fix (3) to support it, and what this costs you conceptually. I will also offer a "metaphysical escape hatch" involving Premise (1) if you want to dig deeper.

  ### 1. The Primary Fix: Reject Premise (5)
  **Premise (5):** *If there's no unique objective probability, then the whole enterprise... rests on an arbitrary choice.*

  This is the non-sequitur. It conflates **"underdetermined"** with **"arbitrary."**

  *   **Arbitrary** means there is no reason to prefer one option over another (like choosing between two identical cans of soup).
  *   **Underdetermined** means the evidence does not dictate a *single* number, but it does rule out *many* numbers and ranks the remaining options by quality.

  **The Fix:**
  You can accept that there is no *unique, God's-eye-view probability* for a singular event (Premise 4) without accepting that the choice of model is *arbitrary* (Premise 5).

  Why? Because we have an external metric for quality: **Predictive Performance.**
  Even if we can't know the "True Probability," we can test which reference class produces scores that best match reality over time (calibration) and best separates outcomes (discrimination). If Model A predicts survival better than Model B in clinical trials, Model A is *objectively better*, even if neither gives us the "One True Number."

  **The Cost:**
  You lose the idea that a risk score is a **property of the individual** (like their height or weight). Instead, a risk score is a **property of the relationship between the individual and the model.**
  *   *Old view:* "This patient has a 20% risk."
  *   *New view:* "Relative to Model X, which prioritizes these variables, this patient has a 20% risk."

  **Journalistic Angle:**
  This is a powerful narrative. It shifts the scandal from "The math is fake" to "The math is a tool, and tools have purposes." A hammer isn't "arbitrary," but it's the wrong tool for a screw. Similarly, a recidivism algorithm trained on *arrests* is a different tool than one trained on *convictions*. Neither is the "True Risk," but one might be more useful for public safety, the other for fairness.

  ### 2. The Secondary Fix: Nuance Premise (3)
  **Premise (3):** *There is no principled, non-arbitrary rule for selecting the uniquely correct reference class.*

  This premise is too strong. While there is no *algorithmic* rule that spits out the perfect class, there are **methodological norms** that are not arbitrary. The most important one is **Causal Relevance**.

  **The Fix:**
  Philosopher Wesley Salmon argued that we should seek the **Homogeneous Reference Class**. We shouldn't just narrow the class until the sample size breaks (as your premise suggests); we should narrow it based on factors that are *causally relevant* to the outcome.

  *   *Example:* "A 67-year-old man who walks 30 minutes a day" is a better reference class than "A 67-year-old man whose name starts with J." Both narrow the class, but only the first is causally linked to survival.
  *   *Application:* In criminal justice, "prior arrests" might be statistically predictive, but if "prior arrests" are causally driven by policing bias rather than criminal propensity, that reference class is methodologically suspect.

  **The Cost:**
  This forces you to admit that **causality** is doing the heavy lifting, not just statistics. You cannot solve the reference class problem with math alone; you need domain expertise (medicine, criminology) to decide which similarities matter.

  **Journalistic Angle:**
  This allows you to critique algorithms that rely on "actuarial" correlations without causal understanding. If an algorithm uses "zip code" to predict health, it's statistically valid but causally opaque. The "arbitrariness" isn't in the probability itself, but in the **feature selection.**

  ### 3. The Metaphysical Escape Hatch: Modify Premise (1)
  You mentioned you aren't ready to go "full Bayesian" (subjective credence). But there is a middle ground between Frequentism (Premise 1) and Bayesianism: **Propensity Theory.**

  **Premise (1):** *Assigning a probability to a one-off event requires placing that event in a reference class...*

  This is a strictly **Frequentist** claim. It assumes probability *is* frequency.
  **Propensity Theory** (championed by Karl Popper) argues that probability is a **physical property of the specific situation** (the "setup"), not the class.

  **The Fix:**
  The patient *does* have a unique, objective survival probability. It is a property of their specific biology, environment, and genetics (the "propensity").
  *   The Reference Class is not what *creates* the probability; it is merely how we *estimate* it.
  *   The Reference Class Problem is therefore an **epistemic problem** (how do we know the number?), not an **ontological problem** (does the number exist?).

  **The Cost:**
  Propensities are philosophically controversial because they are hard to define physically. What *is* a propensity? It's a "tendency" for a specific setup to produce an outcome. It feels intuitive, but it's hard to measure directly without falling back on... reference classes.

  **Journalistic Angle:**
  This preserves the intuition that "there is a fact of the matter." The algorithm isn't creating the risk; it's trying to measure a pre-existing risk. The error comes from our measurement tools (the classes), not the reality of the risk itself.

  ### Recommendation for Your Article

  Do not reject Premise (1) or (2). They are the strongest hooks for your story. Premise (1) explains why we need data; Premise (2) explains why the data is always messy.

  **Break the argument at Premise (5).**

  Here is the revised logic for your editor:

  1.  **Singular probabilities require evidence** (Reference Classes).
  2.  **Individuals fit many classes**, yielding different numbers.
  3.  **No algorithm picks the perfect class**, but **predictive validation** and **causal relevance** allow us to rank them.
  4.  **Therefore, there is no single "True" number**, but there are **better and worse estimates**.
  5.  **Therefore, risk scoring is not arbitrary**, but it is **context-dependent**. The "risk" is not a property of the person; it is a property of the person *plus* the model chosen to assess them.

  **The "Rabbit Hole" Conclusion:**
  The danger isn't that the math is broken. The danger is that we treat **estimates** (which depend on arbitrary class choices) as **facts** (which seem inherent to the person). When a court treats a risk score as a property of the defendant rather than a property of the algorithm, they commit a category error.

  This lets you keep your skepticism (the numbers aren't Truth) without falling into nihilism (the numbers are useless). It's a nuanced, defensible, and highly newsworthy position.
