prompt: |-
  I chair my university's hiring committee. We currently evaluate candidates sequentially: every member reads the full file and writes an independent rating, but then we discuss and re-rate in order of seniority, with earlier ratings visible to everyone. In three recent searches, the first two or three ratings have set the range for nearly all later ratings, and candidates discussed late in the order rarely move, even when their files are comparable. Some members defend the process: if our most senior colleagues are well-calibrated, later raters are rational to update heavily on their judgments, and we should not throw that information away. Others reply that this is precisely a case where individually rational updating produces a worse collective judgment, because later members' private information never enters the record and the agenda order ends up doing the hiring. Draft a short decision memo for the committee to vote on next week. It should recommend a concrete procedure for collecting and aggregating evaluations in our next search, explain the reasoning for it, and give an honest treatment of the strongest argument for keeping the current sequential process.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a university hiring committee.
      *   **Problem:** Current sequential evaluation process (read -> rate -> discuss -> re-rate in seniority order) leads to anchoring/herding. Early ratings (often senior members) dictate the range; later candidates/raters have little impact. Private information from later members is lost.
      *   **Conflict:** Some members argue senior calibration is valuable information (rational updating). Others argue it suppresses independent judgment (information cascades).
      *   **Task:** Draft a short decision memo for the committee to vote on.
      *   **Requirements:**
          *   Recommend a concrete procedure for the next search.
          *   Explain the reasoning.
          *   Give an honest treatment of the strongest argument for the *current* process.
          *   Tone: Professional, balanced, decisive, academic/administrative.

  2.  **Determine the Recommendation:**
      *   The prompt highlights a classic "information cascade" or "anchoring bias" problem.
      *   The current system (sequential re-rating with visibility) is flawed because it suppresses diverse signals.
      *   *Best Practice:* Simultaneous independent evaluation followed by structured discussion.
      *   *Proposed Procedure:* Blind independent scoring (no visibility of others' scores) -> Aggregation -> Discussion -> Final Vote/Rating.
      *   *Why:* Maximizes information aggregation, reduces anchoring, preserves senior insight during discussion rather than scoring.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Purpose:** State the goal (improving evaluation process).
      *   **Observation:** Briefly summarize the issue (anchoring in recent searches).
      *   **Recommendation:** The concrete new procedure.
      *   **Rationale:** Why this change helps (independent signals, reducing bias).
      *   **Counter-Argument (The "Steel Man"):** Acknowledge the value of senior calibration.
      *   **Resolution:** How the new process still captures senior insight (during discussion, not scoring).
      *   **Action Item:** Vote request.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Opening:* Keep it direct. We need to fix the evaluation protocol.
      *   *The Problem:* Describe the "anchoring" without blaming individuals. Focus on the *structure*. Mention the three recent searches.
      *   *The Recommendation:* What exactly should we do?
          *   Step 1: Independent review (no scores visible).
          *   Step 2: Submit scores simultaneously.
          *   Step 3: Discussion (now seniority matters for argument quality, not order).
          *   Step 4: Final decision.
      *   *The Reasoning:* Use terms like "information aggregation" and "anchoring bias." Explain that we want *all* private signals, not just the first few.
      *   *The Counter-Argument:* This is crucial. The prompt asks for an "honest treatment."
          *   Argument: Senior members have better calibration. Ignoring their early lead wastes data.
          *   Rebuttal/Nuance: Their expertise is better used in *qualitative* discussion, not as a numerical anchor. We don't want to ignore them; we want to hear their *reasons*, not just copy their *numbers*.
      *   *Closing:* Call for a vote.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic. Don't accuse senior members of bullying. Frame it as "optimizing information flow."
      *   Needs to be concise. Committee members are busy.
      *   Needs to be actionable.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the recommendation concrete enough?
      *   *Fix:* Specify "blind submission" and "simultaneous disclosure."
      *   *Critique:* Did I address the "rational updating" argument?
      *   *Fix:* Ensure the section on "The Case for the Status Quo" explicitly mentions Bayesian updating/calibration.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep paragraphs tight. Use bullet points for the procedure.

  7.  **Final Polish:** Check for clarity and impact. (The resulting memo looks good. It balances the need for change with respect for the existing committee culture.)

  8.  **Final Output Generation:** (Matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Hiring Committee Members
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal to Revise Candidate Evaluation Protocol

  **Purpose**
  The purpose of this memo is to propose a modification to our candidate evaluation procedure for the upcoming search cycle. Based on data from our three most recent searches, I recommend shifting from a sequential re-rating system to a simultaneous independent evaluation model. A vote on this procedural change will be taken at next week's meeting.

  **Observation**
  In our current process, members re-rate candidates sequentially after discussion, with earlier ratings visible to later raters. Analysis of recent searches indicates a strong anchoring effect: the first two or three ratings consistently establish the numerical range for the candidate. Consequently, candidates discussed later in the order rarely see score adjustments, even when their files are comparable to those discussed earlier. This suggests that the order of discussion, rather than the quality of evidence, is disproportionately driving our outcomes.

  **Recommendation**
  For the next search, I propose the following procedure:

  1.  **Independent Scoring:** All members will read files and submit numerical ratings independently via a confidential form. No ratings will be visible to other members at this stage.
  2.  **Simultaneous Disclosure:** All scores will be aggregated and revealed to the committee simultaneously prior to discussion.
  3.  **Structured Discussion:** Discussion will proceed based on score variance (e.g., discussing candidates with high disagreement first). Seniority will not dictate speaking order.
  4.  **Final Decision:** A final vote or ranking will occur only after discussion is complete.

  **Rationale**
  The primary goal of a committee is to aggregate diverse information. When ratings are visible sequentially, later raters often substitute the group's judgment for their own private information. This creates an "information cascade," where private signals are lost because it appears rational to follow the emerging consensus. By collecting scores simultaneously, we ensure that every member's private assessment enters the record. This allows us to identify genuine disagreement and focus our discussion on *why* ratings differ, rather than simply converging on a number.

  **The Case for the Status Quo**
  I want to treat the argument for retaining our current process with seriousness. Proponents argue that our senior members possess superior calibration based on years of hiring experience. From a Bayesian perspective, a junior member observing a senior member's strong rating is receiving valuable signal data. To ignore this by forcing blind scoring could be seen as discarding useful information, potentially leading to "noise" where junior members overweight idiosyncratic preferences against established departmental standards. There is merit to the idea that we should not treat all ratings as equally weighted *a priori*.

  **Resolution**
  While senior calibration is valuable, the current mechanism captures it inefficiently. It converts qualitative expertise into a numerical anchor that suppresses dissent. Under the proposed system, senior members retain full influence during the **discussion phase**. Their expertise should guide the *interpretation* of the files and the *weighting* of criteria, rather than setting a numerical precedent that others feel pressured to match. This preserves the value of experience without sacrificing the independence of the initial data.

  **Action Required**
  Please review this proposal prior to our meeting on [Date]. We will hold a brief discussion followed by a vote to adopt this protocol for the upcoming search cycle.

  Thank you for your commitment to a rigorous and fair hiring process.
