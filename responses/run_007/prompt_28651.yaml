answer: |-
  Your intuition is spot-on. Your roommate has captured the *spirit* of Williams's critique and got the famous soundbite right, but she has conflated two different arguments of his and smoothed over the most philosophically interesting tension.

  Williams is notoriously difficult to summarize because he writes in a way that resists "clean" systematizing. However, we can break down exactly where your roommate's summary lands and where it misses the mark.

  Here is what Williams would accept, what he would correct, and whether her conclusion holds water.

  ### 1. What Williams Would Accept (The Hits)

  Your roommate got the "vibe" and the specific imagery correct. Williams would nod along with these three points:

  *   **The "One Thought Too Many" Quote:** This is genuine Williams. It comes from his 1981 essay *"Persons, Character, and Morality."* He does use the example of a man choosing to save his wife rather than a stranger.
  *   **The Charge of Alienation:** She is right that Williams argues utilitarianism alienates the agent from their own actions and feelings. By demanding an impersonal standpoint (the "view from nowhere"), it forces you to view your own life and attachments as just data points in a larger equation.
  *   **Impartiality vs. Commitment:** She is correct that Williams thinks utilitarianism treats personal commitments (like marriage) as interchangeable with general welfare unless those commitments happen to coincide with the general welfare.

  ### 2. What Williams Would Push Back On (The Misses)

  This is where your feeling that the summary is "too clean" is justified. There are three major philosophical subtleties your roommate glossed over.

  **A. Conflating Two Different Arguments**
  Strictly speaking, the "Integrity Objection" and the "One Thought Too Many" point come from different places in Williams's work.
  *   **The Integrity Objection:** This is primarily from his 1973 book *Utilitarianism: For and Against*. It uses the cases of **Jim and the Indians** and **George the Chemist**. It focuses on *negative responsibility* (being responsible for what you allow to happen) and how utilitarianism attacks the projects that give your life meaning.
  *   **One Thought Too Many:** This is from the 1981 essay mentioned above. It focuses specifically on personal relationships and the *justification* of action.
  *   **Why it matters:** Your roommate treats them as the same argument. While they are compatible, the "Integrity" objection is broader than love; it's about *identity*. It argues that if you strip away my "ground projects" (my career, my art, my principles, my love), there is no "me" left to be a utilitarian agent.

  **B. Calculation vs. Justification (The Big One)**
  Your roommate says: *"A utilitarian has to think about it... calculate whether saving his wife really produces the most overall utility."*
  Williams anticipates the utilitarian response to this. A sophisticated utilitarian would say: "No, we don't want people calculating utility in every emergency! We know that people who love their wives and act instinctively produce better overall utility than cold calculators."

  Williams's rebuttal is deeper. He argues that even if the utilitarian says, "Don't calculate, just save her," the **moral justification** for saving her must still rest on utility.
  *   **The Husband's View:** "I am saving her because she is *my wife*."
  *   **The Utilitarian View:** "You may save her, but only because saving her (given human psychology) generally maximizes utility."

  Williams's point isn't that you must literally pull out a calculator in the water. It's that utilitarianism cannot accept "Because she is my wife" as a *sufficient moral reason*. The reason must always refer back to the general good. That is the alienation: your moral authority comes from outside your relationship, not from within it.

  **C. Love vs. Ground Projects**
  Your roommate frames this as "utilitarianism can't handle genuine love." Williams would say it's bigger than that. Love is just one example of a **ground project**.
  Williams argues that we are constituted by our commitments. If a moral theory requires you to be willing to abandon any commitment the moment the "utility calculus" shifts, it threatens your integrity as a person. It's not just about romance; it's about whether you can have a life of your own at all, or if you are merely a conduit for general welfare.

  ### 3. Does Her Conclusion Follow?

  Her conclusion is: *"Utilitarianism can't handle genuine love."*

  **Williams's Verdict:** He would say this is *mostly* right, but needs a tweak.
  Utilitarianism doesn't prevent you from *feeling* love. You can feel all the warm fuzzies. But it prevents you from treating that love as **morally fundamental.**

  In Williams's view, genuine love involves a kind of partiality that is immune to utilitarian trade-offs. If you truly love someone, you do not think, "I will prioritize you *unless* saving a stranger produces 1% more utility." But utilitarianism *requires* you to think that (at least in principle). Therefore, utilitarianism makes love **contingent** on the general good. Williams argues that love, by definition, cannot be contingent in that way without ceasing to be love.

  **The Utilitarian Counter-Attack (For Context)**
  To be fair to your roommate's class, a utilitarian would argue she is setting up a straw man. They would argue for **Two-Level Utilitarianism** (R.M. Hare):
  1.  **Intuitive Level:** We raise people to have strong commitments and love, and we tell them to follow those instincts.
  2.  **Critical Level:** We only use utilitarian calculation when intuitions clash or in rare philosophical moments.
  They would argue this *does* handle genuine love because it protects the psychological reality of love while keeping the moral framework utilitarian.

  Williams would reply that this is dishonest. If the Critical Level is the *truth* about morality, then the Intuitive Level is just a useful fiction. You are still alienated from the truth of your own actions.

  ### Summary for Your Next Argument

  If you talk to your roommate again, here is how you can sharpen the critique:

  1.  **Acknowledge she's right on the quote:** The "one thought too many" line is real and applies to the drowning wife.
  2.  **Correct the mechanism:** Tell her Williams isn't worried about the *psychological act* of calculating in the moment. He is worried about the *structure of justification*. Utilitarianism makes the relationship subordinate to the general good, even if it allows you to save the wife.
  3.  **Broaden the scope:** Remind her that "Integrity" isn't just about love; it's about whether a person is allowed to have a life defined by their own projects, or if they must be a neutral vessel for the world's happiness.

  Her summary is a "B+" undergraduate understanding. It captures the mood but misses the structural critique about moral justification and identity. You were right to feel it was "too clean." Williams's point is messy because human integrity is messy.
