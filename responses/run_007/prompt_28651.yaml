      *   *Claim 2: "A utilitarian has to think about it... calculate whether saving his wife really produces the most overall utility."*
          *   **Nuance:** A sophisticated utilitarian (rule-utilitarian or one who accounts for psychological costs) might say "No, you don't need to calculate every time because loving dispositions produce better utility." Williams anticipates this. His point is that even if the *outcome* is the same (save the wife), the *justification* matters. The utilitarian must justify the act via the general good, not the personal relation.
      *   *Claim 3: "Williams says that calculation is 'one thought too many.'"*
          *   **Accuracy:** This is the famous quote. Accurate.
      *   *Claim 4: "If you actually love your wife, you shouldn't even consider the stranger as a serious option."*
          *   **Accuracy:** Yes, the motivation should be direct, not mediated by moral theory.
      *   *Claim 5: "Utilitarianism alienates you from your own feelings."*
          *   **Accuracy:** Yes, "alienation" is the key keyword.
      *   *Claim 6: "Treat your wife and a stranger as interchangeable units."*
          *   **Accuracy:** Yes, the impartiality requirement does this.
      *   *Claim 7: "Utilitarianism can't handle genuine love."*
          *   **Conclusion:** This is a strong conclusion. Williams would say it makes love *contingent* on utility, which corrupts the nature of the commitment.

