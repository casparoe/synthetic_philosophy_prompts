          *   *Calculation vs. Justification:* It's not about the *process* of calculating in the moment (utilitarians can say "don't calculate, just follow instincts"). It's about the *ultimate justification*. Even if you save the wife, *why* was it right? For Williams, "Because she's my wife" is enough. For Utilitarianism, it must be "Because saving her maximizes utility."
          *   *Scope:* It's not just about love. It's about "ground projects" (career, art, principles). Love is just one example.
      *   *Section 3: The Conclusion (Does it follow?).*
