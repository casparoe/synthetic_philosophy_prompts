      *   **Key Thought Experiments:**
          *   *Jim and the Indians:* A utilitarian is asked to shoot one innocent Indian to save 19 others. Williams argues this violates integrity by making the agent responsible for outcomes they didn't directly cause (negative responsibility) and forcing them to betray their own projects/convictions.
          *   *George the Chemist:* George opposes chemical warfare but is offered a job in that field. If he refuses, someone else (more enthusiastic) will take it. Utilitarianism says he should take the job to minimize harm. Williams argues this alienates George from his deepest convictions (integrity).
          *   *The Drowning Wife:* This is often cited, but is it the *primary* source of the integrity objection? Actually, Williams discusses this in "Persons, Character, and Morality" (1981), specifically in the essay "Persons, Character, and Morality." The phrase "one thought too many" comes from *there*, not necessarily *Utilitarianism: For and Against*.
      *   **Core Concept: Integrity.** It's not just about feelings or love. It's about *ground projects* and *commitments* that constitute personal identity. Utilitarianism demands a neutral, impersonal standpoint (the "view from nowhere"), which renders these personal projects irrelevant unless they contribute to general utility. This is "alienation."
      *   **Core Concept: Negative Responsibility.** Being responsible for what you *allow* to happen, not just what you *do*.
      *   **The "One Thought Too Many" Point:** It's not just that calculation is *required*, but that the *moral theory* demands the justification be impersonal. If the man saves his wife, he should do it *because she is his wife*, not because "saving wives generally produces utility."

  3.  **Evaluate the Roommate's Summary:**
