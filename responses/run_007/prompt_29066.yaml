answer: |-
  # Joint Statement on the Normative Status of Pure Time Preference

  **Signatories:**  
  *The Pro-Temporal Partiality Working Group* (Defender)  
  *The Intertemporal Impartiality Working Group* (Opponent)

  **Date:** October 26, 2023

  **Purpose:** This document records the results of an adversarial collaboration aimed at clarifying the normative debate surrounding pure time preference in cost-benefit analysis and moral reasoning regarding future generations. We agree that empirical disputes often mask deeper ethical disagreements. This statement isolates those ethical commitments.

  ---

  ### 1. Points of Agreement

  We jointly affirm the following claims regarding definitions, economic practice, and empirical implications:

  1.  **Definition of Pure Time Preference:** We define *pure time preference* (often denoted as $\delta$ in the Ramsey Rule) as the discounting of welfare or utility solely due to its temporal distance from the present. We agree this is distinct from discounting due to:
      *   **Probability of Extinction:** The chance that the beneficiaries will not exist to receive the benefit.
      *   **Economic Growth:** The expectation that future generations will be wealthier, making marginal utility of consumption lower for them than for us.
      *   **Opportunity Cost:** The return on capital that could be earned by investing resources now rather than later.
  2.  **Standard Economic Practice:** We agree that standard cost-benefit analysis (CBA) typically employs a positive social discount rate (often 3–7%). We agree that standard practice often conflates pure time preference with the other factors listed in Claim 1, obscuring the normative commitment being made.
  3.  **Empirical Sensitivity:** We agree that the choice of discount rate is the primary determinant of the present value of long-term outcomes. A positive pure time preference rate drastically reduces the calculated value of preventing existential risks or mitigating long-term climate change compared to a near-zero rate.
  4.  **Relevance of Empirical Facts:** We agree that if pure time preference is morally impermissible, empirical facts about economic growth or extinction risk remain relevant, but the *baseline* obligation to future people is higher than standard CBA suggests. Conversely, if pure time preference is permissible, empirical facts about extinction risk may render long-term investments negligible regardless of moral status.
  5.  **Non-Identity Problem:** We agree that the "Non-Identity Problem" (that different policies create different future people) complicates but does not dissolve the question of pure time preference. Both sides accept that welfare comparisons across possible futures are necessary for policy analysis.
  6.  **Scope of Inquiry:** We agree that this debate is not merely about financial interest rates but about the moral weight of future experiences relative to present experiences.

  ---

  ### 2. Points of Disagreement

  The following table outlines the remaining normative disputes. Each position is phrased to be endorsable by the respective side.

  | Issue | Defender of Pure Time Preference (Pro-Temporal Partiality) | Opponent of Pure Time Preference (Intertemporal Impartiality) |
  | :--- | :--- | :--- |
  | **Rational Permissibility** | It is rationally permissible to prefer benefits sooner rather than later, even holding probability and magnitude constant. Temporal perspective is a fundamental feature of agency; planning from a specific point in time inherently privileges that point. | It is rationally impermissible to discount welfare solely based on date. Just as it is irrational to prefer a smaller benefit to a larger one based on spatial distance, it is irrational to prefer a smaller benefit based on temporal distance. |
  | **Moral Permissibility** | It is morally permissible to assign less weight to future welfare. Moral agents have special obligations to present constituents and themselves that do not extend equally to distant future persons. | It is morally impermissible to discount future welfare. The date of birth is morally arbitrary. Discriminating against individuals solely because they live in the 22nd century rather than the 21st is unjustifiable. |
  | **Agent-Relative vs. Agent-Neutral** | Agent-relative reasons matter. We act from *within* time, not from a view outside it. Our obligations are structured by our current temporal location, permitting partiality toward the present. | Agent-neutral welfare is what counts. Morality requires adopting a "view from eternity." While psychology may be time-biased, normative ethics must correct for this bias, not codify it. |
  | **Burden of Proof** | The burden lies with those who advocate for near-zero discounting. A rate of zero implies potentially infinite obligations to the future, risking "overdemandingness" that paralyzes present action. | The burden lies with those who advocate for positive discounting. Differential treatment requires justification. Since time is not a morally relevant characteristic, the default must be impartiality (zero rate). |
  | **Scope of Obligation** | Our obligations to the future are constrained by our capacity to flourish in the present. Sacrificing significant present welfare for speculative future gains is not required. | Our obligations to the future are constrained only by marginal utility. If a small present sacrifice prevents catastrophic future harm, it is required, regardless of the temporal distance. |

  ---

  ### 3. Cruxes and Adjudicating Experiments

  We identify the following sub-questions as "cruxes." Settling these would significantly shift the credence of at least one side. For each crux, we propose a shared thought experiment and state in advance how each side interprets it.

  #### Crux 1: The Temporal Veil of Ignorance
  **Sub-question:** Would a rational agent choose a principle of pure time preference if they did not know *when* in history they would be born?

  *   **Thought Experiment:** Imagine you are behind a veil of ignorance where you know you will be a human being, but you do not know if you will be born in 2024, 2124, or 2500. You must choose the discount rate society will use to allocate resources across these centuries.
  *   **Opponent's Prediction:** Rational agents would choose a near-zero pure time preference rate. No one would accept a system that systematically disadvantages them simply because they were born later. This proves impartiality is the rational default.
  *   **Defender's Prediction:** Rational agents might still choose a positive rate. Knowing that resources are more productive earlier (due to compounding) or that earlier generations face more immediate survival risks, agents might agree to a system that privileges the present to ensure civilization survives to the future at all.

  #### Crux 2: The "Tiny Tax" vs. "Existential Benefit"
  **Sub-question:** Does the magnitude of the sacrifice required by zero discounting reveal an absurdity in the impartialist position?

  *   **Thought Experiment:** Suppose a policy costs every present person 1% of their income forever. In 300 years, this prevents a certain event that would reduce future welfare by 0.1% for one million years. Under zero discounting, the future loss outweighs the present cost. Under positive discounting, it does not.
  *   **Defender's Prediction:** If zero discounting mandates permanent sacrifice for a negligible future gain (relative to the scale of time), the theory is overdemanding and self-defeating. Rational morality must allow us to ignore distant, diffuse harms to preserve present flourishing.
  *   **Opponent's Prediction:** If the cumulative welfare loss is vast, the sacrifice is required. The intuition that it is "absurd" reveals a bias toward the present, not a flaw in the math. However, we agree to investigate if diminishing marginal utility of welfare caps this obligation before it becomes paralyzing.

  #### Crux 3: The Psychology of Anticipation
  **Sub-question:** Is time preference a feature of *valuation* or a feature of *psychological capacity*?

  *   **Thought Experiment:** Consider a "Perfectly Patient Agent" who feels no psychological distress from waiting and can model future welfare as vividly as present welfare. Does this agent still have a reason to discount the future?
  *   **Defender's Prediction:** Even the Perfectly Patient Agent has a reason to prioritize sooner benefits because *action* happens now. Resources controlled now are certain; resources controlled later are contingent on the chain of agency remaining intact. Pure time preference captures the value of agency closure.
  *   **Opponent's Prediction:** The Perfectly Patient Agent would assign equal weight. The Defender is conflating "pure time preference" with "risk of non-implementation." If we control for risk and psychology, the residual discount rate should be zero. If the Defender admits this, the debate reduces to empirical risk, not normative time preference.

  #### Crux 4: The Parfitian Repugnant Conclusion Analogy
  **Sub-question:** Does rejecting pure time preference lead to conclusions analogous to the Repugnant Conclusion in population ethics?

  *   **Thought Experiment:** If we discount the future at 0%, does the sheer number of future people imply we must sacrifice almost everything now to ensure a marginally better existence for the vast multitude of the far future?
  *   **Defender's Prediction:** Yes. This confirms that zero discounting is untenable. A moral theory that demands the present generation live in poverty to slightly enhance the lives of trillions of future beings is unacceptable.
  *   **Opponent's Prediction:** Not necessarily. We can accept large obligations without accepting the "Repugnant" outcome by adjusting other variables (e.g., quality of life thresholds). Rejecting pure time preference does not force us to accept total utilitarianism without constraints. The Defender is attacking a straw man of longtermism.

  ---

  **Commitment to Future Dialogue:**  
  We agree to revisit this statement if new arguments arise regarding the nature of temporal perspective or the structure of intergenerational justice. We commit to distinguishing pure time preference from other discount factors in all future public communications.
