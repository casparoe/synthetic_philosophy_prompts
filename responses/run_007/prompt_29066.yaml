      *   *Critique:* Is the burden of proof section balanced?
      *   *Fix:* Frame it as "Who must justify the deviation from the default?" Defender says default is positive preference; Opponent says default is impartiality.

  6.  **Final Polish:** Check formatting (numbered lists, tables, bold text). Ensure no introductory text precedes the document title.

  *(Self-Correction on "Begin with the document"):* I must not write "Here is the document:" or any conversational filler. Just the title and content.

  *(Refining the Disagreements Table):* Make sure the wording is something each side would actually sign. The Defender shouldn't sound like a caricature of a selfish economist, but rather a philosophical defender of temporal partiality. The Opponent shouldn't sound like a naive utilitarian, but a rigorous impartialist.

