  2.  **Deconstruct the Content:**

      *   **Section 1: Agreed Claims.**
          *   Need to define *pure time preference* clearly (distinct from probability of existence, economic growth, etc.).
          *   Acknowledge standard economic practice (positive discount rates are common) but distinguish descriptive from normative.
          *   Agree on empirical implications (low rates -> more investment in long-term future; high rates -> less).
          *   Agree that extinction risk and uncertainty are separate factors.

      *   **Section 2: Disagreements Table.**
          *   *Rational Permissibility:* Defender says yes (impatience is rational); Opponent says no (time is morally arbitrary).
          *   *Moral Permissibility:* Defender says yes (partiality to present/nearest is allowed); Opponent says no (discrimination by date is like discrimination by distance).
          *   *Agent-Relative vs. Agent-Neutral:* Defender says agent-relative reasons (my time vs. their time) matter; Opponent says agent-neutral welfare is what counts.
          *   *Burden of Proof:* Defender says burden is on those claiming infinite obligation; Opponent says burden is on those claiming differential treatment based on date.

      *   **Section 3: Cruxes.**
          *   Need specific sub-questions where resolution changes minds.
          *   Need shared thought experiments.
          *   Need predicted interpretations.
          *   *Crux 1:* The "Next Week" intuition. (Do we discount very near future?)
          *   *Crux 2:* The "Identity of Persons" issue. (Does future people being different matter?)
          *   *Crux 3:* The "Overdemandingness" objection. (Does zero discounting imply too much sacrifice?)
          *   *Crux 4:* The "Perspective of the Present" vs. "View from Eternity".

  3.  **Drafting - Section by Section:**

      *   *Header:* Joint Statement on Pure Time Preference. Signatories (fictionalized or generic roles).
      *   *Section 1:* Focus on clarity. Ensure both agree that $\delta$ (pure time preference) is separate from $r$ (economic growth) or $\delta_{risk}$ (existence probability). Agree that Ramsey Rule components are often conflated. Agree that lowering $\delta$ increases present value of long-term benefits.
      *   *Section 2:* Table format. Columns: Issue, Defender's Position, Opponent's Position. Ensure wording is charitable.
          *   *Rationality:* Defender: "Prudent planning acknowledges human psychology/temporal perspective." Opponent: "Rationality requires impartiality across time."
          *   *Morality:* Defender: "Special obligations to present generations exist." Opponent: "Date of birth is morally arbitrary."
          *   *Agent-Relative:* Defender: "We act from *now*." Opponent: "Morality is view from nowhere."
          *   *Burden:* Defender: "Zero discounting leads to absurd sacrifices." Opponent: "Discrimination requires justification."
      *   *Section 3:* Cruxes.
          *   *Crux 1: The Scope of Sacrifice.* Thought Experiment: The Tiny Tax vs. The Existential Benefit.
          *   *Crux 2: The Temporal Veil of Ignorance.* Thought Experiment: Not knowing *when* you will be born.
          *   *Crux 3: Psychological Impossibility vs. Normative Ideal.* Thought Experiment: The Perfectly Patient Agent.

  4.  **Refining and Polishing:**
      *   Check tone: Is it collaborative? Yes, use "We agree," "We disagree."
      *   Check constraints: No preface. Start directly with the document title.
      *   Check precision: Ensure "pure time preference" isn't confused with "economic discount rate."
      *   Check the "Adversarial Collaboration" vibe: Acknowledge the depth of the disagreement without hostility.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between rational and moral permissibility clear?
