          1.  Numbered list of agreed claims (definitions, economic practice, empirical relevance).
          2.  Disagreements table (positions on rational permissibility, moral permissibility, agent-relative vs. agent-neutral, burden of proof).
          3.  List of cruxes (sub-questions, shared thought experiments/arguments, predicted interpretations).
