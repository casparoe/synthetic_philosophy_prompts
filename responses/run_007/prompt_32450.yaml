      *   *Idea 3: The Apprenticeship Model.* AI as a tutor rather than a substitute. If used interactively (Socratic), it might *increase* understanding.
      *   *Idea 4: Empirical Evidence.* Do studies show AI users are actually worse at debugging or system design later? Or are they just faster?
      *   *Idea 5: The "Understanding" Definition.* Is "understanding" memorizing syntax, or knowing what's possible? If the latter, AI expands understanding.
      *   *Idea 6: The Baseline Shift.* Maybe "from scratch" is the wrong baseline. Professionals rarely write from scratch.
      *   *Idea 7: Unfalsifiability Check.* If every gain is dismissed as "shallow," the theory is immune to evidence.

  4.  **Categorizing and Sorting Defeaters:**

      *   *Fatal:* Evidence that AI users demonstrate *superior* deep understanding in controlled settings. Evidence that "from scratch" performance is irrelevant to actual professional competence.
