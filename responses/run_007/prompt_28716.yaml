answer: |-
  You have described one of the most enduring problems in moral philosophy and sociology with remarkable precision. The pattern you have identified is not merely a literary device; it is the engine of ideological conflict.

  While there is no single English term that captures the entire two-way dynamic, the phenomenon is the central subject of **Friedrich Nietzsche's *On the Genealogy of Morality***, specifically his distinction between **Master Morality and Slave Morality**. However, to get the "precise carving" you are asking for—particularly regarding whether the two movements are the same mechanism—we must look beyond Nietzsche to sociological and political theory.

  Here is a mapping of the terrain you have discovered, broken down by the specific philosophical concepts that govern each movement and their relationship.

  ### 1. The Primary Map: Master and Slave Morality
  Nietzsche provides the most famous account of exactly what you are describing.

  *   **Movement 1 (Master Morality):** The powerful define "Good" as that which they *are* (strong, wealthy, bold). "Bad" is simply the absence of these traits (weak, poor, timid). This is an **affirmative** morality. It creates values out of self-celebration. As you noted, their cruelties are "magnificent" because they are expressions of overflowing power, not malice.
  *   **Movement 2 (Slave Morality):** The powerless cannot act, so they judge. They define "Evil" as the powerful (the oppressor). Consequently, "Good" becomes that which is *not* the oppressor (meek, humble, suffering). This is a **reactive** morality. It creates values out of *ressentiment* (resentment).

  **The Crucial Philosophical Dispute:**
  You asked if these are the "same operation running in opposite directions." Nietzsche would say **no**. He argues they are fundamentally different psychological mechanisms.
  *   **Master Morality** acts *outward*: "I am good, therefore what I do is good."
  *   **Slave Morality** acts *inwardly then outwardly*: "You hurt me, therefore you are evil, therefore I am good because I am not you."

  For Nietzsche, Movement 2 is not a mirror image; it is a parasite on Movement 1. It requires the existence of the Master to define itself. However, many modern philosophers argue your intuition is correct: structurally, both are **Ideological Formations**. They both serve to legitimize a specific social position by naturalizing it.

  ### 2. Movement 1: Symbolic Violence
  To understand the first movement (how the powerful make their arbitrariness look natural), the French sociologist **Pierre Bourdieu** offers a more precise tool than Nietzsche: **Symbolic Violence**.

  Symbolic violence occurs when the dominant class imposes their categories of perception (their vocabulary) upon the rest of society, and those categories are accepted as legitimate.
  *   **The Mechanism:** It is not that the powerful are lying. They genuinely believe their refinement is superior.
  *   **The Result:** The "vocabulary" you described (bold vs. brutal) becomes the *doxa*—the unquestioned common sense. When a reader initially admires the strong character, they are succumbing to symbolic violence. They are accepting the powerful character's definition of reality as the *only* definition of reality.
  *   **Why it isn't Hypocrisy:** Hypocrisy implies the speaker knows the truth and hides it. In symbolic violence, the speaker is convinced of their own nobility. The language structures their thought so that they *cannot* see their brutality as brutality.

  ### 3. Movement 2: Counter-Hegemony and Standpoint
  The second movement (the powerless creating a counter-vocabulary) is best described through **Antonio Gramsci's** concept of **Counter-Hegemony** and feminist **Standpoint Epistemology**.

  *   **Counter-Hegemony:** Gramsci argued that the powerful maintain control not just by force, but by *hegemony*—cultural dominance. Movement 2 is the struggle to create a new "common sense." When your characters recast weakness as "humility" and fear as "prudence," they are building a counter-hegemonic bloc. They are refusing to play on the Master's scale.
  *   **Standpoint Epistemology:** This theory (developed by thinkers like Sandra Harding and Donna Haraway) argues that knowledge is situated. The view from the bottom is not just a "reaction"; it is a distinct vantage point that reveals truths the powerful *cannot* see.
      *   *Example:* A king sees "order" when he crushes a revolt. The peasant sees "terror." The peasant's vocabulary isn't just a defensive inversion; it is a more accurate description of the physical reality of the event.
      *   *Relevance to your observation:* This explains why the new vocabulary is "genuinely felt." It is not merely sour grapes; it is an epistemic shift. The weak are not lying to themselves; they are accessing a different truth that the powerful are blinded to by their privilege.

  ### 4. Is it the Same Mechanism? (The Structuralist View)
  You suspect the two movements are the "same operation." If you move away from Nietzsche's psychology and toward **Structuralism** or **Systems Theory**, your intuition holds.

  From this view, both movements are instances of **Legitimation**.
  *   Sociologist **Peter Berger** describes legitimation as the process by which a social order explains and justifies itself.
  *   Whether you are at the top or the bottom, you require a "nomos" (a meaningful order) to survive.
  *   **The Mechanism:** The mechanism is **Motivated Reasoning** scaled to a culture. Both groups are engaging in **System Justification** (if they benefit from the system) or **System Critique** (if they are harmed by it), but both use the same cognitive tool: *moral language to ontologize status.* They turn "what is" (I am strong / I am weak) into "what ought to be" (Strength is noble / Weakness is holy).

  So, while Nietzsche sees a difference in *origin* (affirmation vs. reaction), a Structuralist sees a similarity in *function* (stabilizing the subject's position within the hierarchy).

  ### 5. Distinguishing from Hypocrisy and Self-Deception
  You asked where the boundary lies between this and simpler concepts.

  *   **Vs. Hypocrisy:** Hypocrisy is knowing the rule and breaking it while pretending to follow it. Your characters are not breaking rules; they are **writing the rules**. They are not pretending to be virtuous; they are defining virtue such that they automatically possess it. This is **Ideology** in the Althusserian sense: they live inside a structure of language that makes their position seem inevitable.
  *   **Vs. Self-Deception:** Self-deception is usually individual and psychological. This phenomenon is **intersubjective**. It requires a community to sustain the vocabulary. A powerless character cannot sustain "humility is strength" alone; they need a community of other powerless characters to reinforce that lexicon. It is a social reality, not a private delusion.
  *   **Vs. Partisanship:** Partisanship is choosing a side within an existing framework (e.g., "My team is better at being fair"). Your pattern describes a conflict over the **framework itself** (e.g., "Fairness is a concept invented by the weak to shackle the strong").

  ### Summary for the Novelist
  You have identified the mechanics of **Moral Ontology**.

  1.  **The Name:** The closest established family of names is **Master-Slave Morality** (Nietzsche) operating through **Symbolic Violence** (Bourdieu) and resolved through **Counter-Hegemony** (Gramsci).
  2.  **The Mechanism:** It is **Legitimation**. Both groups are using moral language to convert *contingent facts* (I have money / I have no money) into *necessary truths* (I am superior / I am pure).
  3.  **The Symmetry:** Nietzsche argues they are asymmetric (one creates, one reacts). However, modern sociology suggests they are symmetric **Strategies of Meaning**. Both sides are trying to make their suffering (or their enjoyment of power) make sense.
  4.  **The Reader's Shift:** The reason the reader shifts allegiance is not because the characters changed, but because the novel forces a **Change of Standpoint**. You move the reader's "eye" from the balcony (Master view) to the stage (Slave view). Once the reader inhabits the vulnerability of the weak, the "noble" vocabulary of the strong suddenly reads as "brutal," because the *consequences* of the action are now visible.

  **Recommendation for your work:**
  If you want to deepen this in your writing, do not treat the second movement as merely a reaction. Give the powerless characters their own *affirmative* ontology. Don't just let them say "Power is bad." Let them say "Connection is real, and power is an illusion." That makes the second movement a rival truth, rather than just a defensive shield, which creates the profound moral ambiguity you are describing.
