prompt: |-
  I have spent much of my career working with probabilistic models in the natural sciences, and I have recently turned to formal epistemology with considerable interest. Two principles keep striking me as curiously parallel, and I would like to understand their relationship with more precision than the introductory literature seems to provide.

  The first is Lewis's Principal Principle: roughly, that a rational agent's credence in a proposition, conditional on the objective chance of that proposition taking a given value and on any admissible background evidence, should equal that chance value. The second is van Fraassen's Reflection Principle: roughly, that a rational agent's current credence in a proposition, conditional on her future credence in that proposition taking a given value, should equal that future-credence value.

  Both have the surface grammar of deference principles — in the one case to the world's chancy structure, in the other to one's own anticipated epistemic trajectory. But the objects of deference are quite different, and I am unsure how deep the formal analogy runs.

  Could you compare these two principles systematically? Specifically: (1) Do they share a common formal core, and if so, what exactly is it? (2) Can either be derived from the other under plausible auxiliary assumptions, or are they genuinely independent constraints on rational credence? (3) What are the standard failure cases or counterexamples for each, and do the ways in which each principle breaks down illuminate something about the relationship between chance, time, and rational belief? I am less interested in exegesis of particular texts than in the logical geography of the two principles — where they overlap, where they come apart, and what that tells us about what it means for an agent's beliefs to answer to the world.
reasoning: |-
  Here's a thinking process that leads to the comparison of the Principal Principle and the Reflection Principle:

  1.  **Deconstruct the Request:**
      *   **User Background:** Career in probabilistic models in natural sciences, recently turned to formal epistemology. Wants precision beyond introductory literature.
      *   **Topic:** Relationship between Lewis's Principal Principle (PP) and van Fraassen's Reflection Principle (RP).
      *   **Core Question:** How deep is the formal analogy? Are they independent? What do failure cases tell us?
      *   **Specific Tasks:**
          1.  Identify common formal core.
          2.  Assess derivability/independence.
          3.  Analyze failure cases/counterexamples and their implications for chance, time, and belief.
      *   **Tone:** Rigorous, analytical, focused on "logical geography" rather than textual exegesis.

  2.  **Initial Assessment & Formalization:**
      *   *Principal Principle (PP):* $C(A | Ch(A) = x \land E) = x$. (Where $C$ is credence, $Ch$ is chance, $E$ is admissible evidence).
      *   *Reflection Principle (RP):* $C_t(A | C_{t'}(A) = x) = x$. (Where $C_t$ is current credence, $C_{t'}$ is future credence).
      *   *Surface Similarity:* Both look like $C(A | X = x) = x$. This is the "deference" structure.
      *   *Key Difference:* PP defers to an external, objective magnitude (Chance). RP defers to an internal, subjective magnitude (Future Self's Credence).

  3.  **Task 1: Common Formal Core:**
      *   Both are instances of a general "Expert Principle" or "Deference Principle."
      *   Let $E$ be an expert function. The principle is $C(A | E(A) = x) = x$.
      *   For PP, the expert is the Chance function ($Ch$).
      *   For RP, the expert is the Future Credence function ($C_{t'}$).
      *   *Crucial Nuance:* PP usually requires conditioning on *admissible* evidence. RP usually assumes the future credence is known *now* (via conditionalization on the proposition that future credence will be $x$).
      *   *Martingale Property:* RP is closely linked to the martingale property of rational belief updating ($E_t[C_{t'}(A)] = C_t(A)$). PP doesn't strictly imply a martingale over time unless chances are stable or known to evolve in specific ways.
      *   *Connection:* If chances are known and don't change, and the agent learns the chance, PP looks like RP where the "future self" is replaced by "the chance function." But chances aren't beliefs.
      *   *Refinement:* The core is *conditional calibration*. If you know the expert's probability is $x$, your probability should be $x$.

  4.  **Task 2: Derivability and Independence:**
      *   *Can PP derive RP?* Not directly. PP connects belief to *chance*. RP connects belief to *belief*. To get RP from PP, you need a bridge linking future belief to chance. (e.g., If I know my future self will be perfectly tracking chance). But RP holds even if chance is undefined or irrelevant (e.g., mathematical truths, or purely subjective updates).
      *   *Can RP derive PP?* Not directly. RP constrains diachronic consistency of belief. PP constrains synchronic alignment with objective modality. You could satisfy RP (be consistent with your future self) but be completely wrong about chances (violating PP).
      *   *The "Mentor" Connection:* Lewis actually discusses this. He treats Chance as a "guide." Van Fraassen treats Future Self as a "guide."
      *   *Christensen's Work:* David Christensen has written extensively on this. He argues they are distinct constraints. RP is about *diachronic coherence*. PP is about *mind-world alignment*.
      *   *Auxiliary Assumptions:* If we assume "Chance is the only guide" and "Future self tracks chance," maybe. But generally, they are independent.
      *   *Key Insight:* RP is a constraint on *updating* (implied by conditionalization). PP is a constraint on *initial alignment* with ontology.
      *   *Wait, is RP implied by Conditionalization?* Yes, if the agent is certain they will update by conditionalization on a partition. (Van Fraassen's original argument). PP is *not* implied by the probability axioms; it's a substantive metaphysical bridge.
      *   *Conclusion:* They are logically independent. RP is internal coherence; PP is external correspondence.

  5.  **Task 3: Failure Cases and Counterexamples:**
      *   *PP Failures:*
          *   *Inadmissible Evidence:* Knowing the future (crystal ball). If I know $A$ happens, $C(A)=1$ even if $Ch(A)=0.5$. This defines "admissibility."
          *   *Undermining Futures:* (Lewis's big worry). A future history that has a different chance than the present chance assigns to that history. $Ch(A)$ says history $H$ is unlikely, but if $H$ occurs, $Ch(A)$ would have been different. This requires the "New Principal Principle" (Hall, Thau).
          *   *Implication:* Chance is not a simple random variable; it depends on the whole history.
      *   *RP Failures:*
          *   *Forgetfulness:* If I know I will forget evidence, my future credence is less reliable. I shouldn't defer to it.
          *   *Irrationality/Akrasia:* If I know I will be drunk or biased tomorrow, I shouldn't defer.
          *   *Self-Fulfilling/Defeating Prophecies:* (Christensen). If believing $C_{t'}(A)=x$ causes $C_{t'}(A) \neq x$.
          *   *Implication:* RP assumes the future self is *epistemically superior* or at least *not degraded*. It's not blind deference; it's deference to a *rational* future self.
      *   *Comparison:* PP breaks down when evidence trumps chance (inadmissibility). RP breaks down when rationality degrades over time (forgetfulness/akrasia).
      *   *Deep Insight:* PP failure highlights the *supervenience base* of chance (history). RP failure highlights the *normative status* of the agent over time.

  6.  **Synthesizing the Argument:**
      *   *Introduction:* Acknowledge the parallel (Expert Principles). State the thesis: They share a formal skeleton but differ fundamentally in metaphysical commitment and normative force.
      *   *Section 1: Formal Core.* Define the General Expert Principle. Show how PP and RP instantiate it. Highlight the Martingale connection for RP.
      *   *Section 2: Independence.* Argue they are independent. RP follows from Conditionalization (internal). PP is a bridge principle (external). One can satisfy RP without PP (solipsist) and PP without RP (amnesiac).
      *   *Section 3: Failure Modes.* Analyze Inadmissibility (PP) vs. Information Loss/Akrasia (RP). Discuss "Undermining" for PP and "Self-Doubt" for RP.
      *   *Section 4: Philosophical Implications.* What does this say about belief answering to the world? PP anchors belief to ontology. RP anchors belief to agency over time.
      *   *Conclusion:* Summary of the logical geography.

  7.  **Refining the Technical Details:**
      *   *Notation:* Use $Cr$ for credence, $Ch$ for chance.
      *   *PP:* $Cr(A | Ch(A)=x \cap E) = x$. Mention the need for $E$ to be admissible.
      *   *RP:* $Cr_t(A | Cr_{t'}(A)=x) = x$. Mention the assumption that $Cr_{t'}$ is the result of rational learning.
      *   *Martingale:* $E_t[Cr_{t'}(A)] = Cr_t(A)$. This is the expectation version of RP.
      *   *Lewis's "New PP":* Worth mentioning to show sophistication regarding PP failures.
      *   *Christensen's "Reflection and Chance":* Good reference point for the independence claim.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I overstate RP's derivability?* RP is often presented as a constraint, but Van Fraassen showed it follows from Conditionalization *if* you are certain about your future update rule. If you aren't certain (e.g., you might forget), RP fails. So RP is a consequence of ideal diachronic coherence. PP is *never* a consequence of probability calculus alone; it requires a metaphysical link. This is a crucial distinction.
      *   *Is the "Expert" analogy perfect?* No. Chance is infallible (by definition, usually) but hidden. Future self is visible (via the condition) but fallible.
      *   *Time:* PP is synchronic (mostly), though chance evolves. RP is essentially diachronic.
      *   *User's Background:* Keep the language precise (sigma-algebras, conditional expectations) but focus on the epistemological implications.

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Validate the intuition. Yes, they are "Expert Principles."
      *   1. Formal Core: $C(\phi | Expert(\phi)=x) = x$. Distinguish the nature of the 'Expert'.
      *   2. Independence: RP is internal coherence (diachronic). PP is external alignment (metaphysical). Derivation attempts fail without strong bridge laws.
      *   3. Pathologies: Inadmissibility (PP) vs. Information Loss (RP). Undermining (PP) vs. Akrasia (RP).
      *   4. Synthesis: PP connects Mind to World. RP connects Time-Slices of Mind.
      *   Closing: The "Answerability" point.

  10. **Final Polish:** Ensure the distinction between "admissible evidence" in PP and "certainty of updating" in RP is clear. Ensure the distinction between objective chance and subjective probability is maintained. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should make sure to mention that RP is sometimes criticized as too strong (e.g., by Christensen) in cases of self-doubt, whereas PP is criticized for the definition of admissibility. I need to be careful not to conflate the "Reflection Principle" with the "Martingale Property," though they are intimately related. The RP is the conditional version; the Martingale is the expectation version. I will focus on the conditional version as per the prompt.

  Also, note Lewis's own view: He saw them as analogous but distinct. He worried about "undermining" for PP. Van Fraassen worried about "reflection" violating conditionalization in some edge cases (though he argued the reverse). I will stick to the standard interpretations.

  Let's structure the answer clearly with headings corresponding to the user's three questions.

  *Plan:*
  1.  **Formal Core:** The General Expert Principle.
  2.  **Independence:** Internal vs. External, Diachronic vs. Synchronic/Metaphysical.
  3.  **Failure Cases:** Inadmissibility/Undermining vs. Forgetfulness/Akrasia.
  4.  **Synthesis:** What this says about belief and world.

  *Key Technical Point:* The PP requires the "admissibility" clause which has no direct analogue in the standard RP, *unless* we view "rationality of future self" as the analogue. But "admissibility" is about *information type*, whereas "rationality" is about *processing quality*. This is a key distinction to highlight.

  *Another Key Point:* PP is often viewed as a definition of chance (functionalist). RP is viewed as a constraint on rationality.

