  Dear Colleague,

  It is no surprise that you find yourself returning to these cases without settling on a single rule, for you are navigating the fault line between two competing moral commitments: the respect for precedent autonomy, which grants authority to the person we were, and the duty of beneficence, which demands we relieve the suffering of the person we are. Your verdicts are sophisticated and largely consistent with a hybrid view that many ethicists find most plausible, though there is indeed a tension lurking in your assessment of the epistemic conditions under which these directives were written.

  The principle that best captures the pattern of your verdicts is what we might call the Weighted Balance of Precedent Autonomy. On this view, an advance directive carries a presumption of authority that is weighted by the specificity of the instruction and the quality of the earlier self's deliberation, particularly their experiential knowledge of the condition in question. However, this authority is not absolute; it can be overridden by the severity of the current self's experiential suffering, provided that suffering is remediable and was likely underestimated by the earlier self. This principle explains why you honor the directive in Case A, where the earlier self had experiential knowledge via her mother and the current self is content, but lean toward overriding it in Case G, where the earlier self lacked experiential knowledge of schizophrenia and the current self is terrified. It also explains why you honor the directive in Case D, because there the directive and the current welfare align in seeking to end the manic episode, whereas in Case G they conflict. It further clarifies your distinction between Case E and Case F, where specificity determines whether we can trust that the earlier self's values are being accurately applied.

  However, applying this principle consistently forces you to reconsider your confidence in Case B. In Case H, you note that the quality of the earlier self's deliberation matters, making you less comfortable overriding the directive when the woman had studied her sister's illness. This implies that a lack of such knowledge weakens the authority of the directive. In Case G, where the knowledge was poor, you override the directive. Yet in Case B, where the woman had no family experience with dementia and never revisited the directive, you honor it with only mild hesitation. If the lack of experiential knowledge is sufficient to help justify overriding a directive in the face of severe suffering in Case G, it should significantly weaken the authority of the directive in Case B, even if the current self is content. The contentment of the demented self is a fragile form of welfare, and if the earlier self's decision was speculative rather than informed, the presumption of authority should be much lower. You do not necessarily have to abandon the verdict that the directive should be honored, but you must abandon the confidence that there is no principled reason to discount it. The principled reason is the epistemic gap, which you rightly identify in Case H but underestimate in Case B. To be consistent, you should treat Case B as much closer to a state of ambiguity where surrogate judgment or a default to preservation of life might be more appropriate, or at least acknowledge that the directive's force is significantly diminished compared to Case A.

  Regarding the new case you proposed, where a person with dementia has a lucid interval and expresses a wish to live before slipping back into dementia, the principle of Weighted Precedent Autonomy offers a clear path. A lucid interval represents a restoration of competence, meaning the person is once again a moral agent capable of autonomous choice. In ethical and legal frameworks, a current competent decision almost always overrides a past competent decision. The advance directive was a instruction from a competent self to a future incompetent self. The lucid statement is an instruction from a competent self to a future incompetent self that arrives later in time. Therefore, the lucid wish to live should be honored, even after the lucidity passes. To do otherwise would be to privilege the past competent self over the more recent competent self, which undermines the very concept of autonomy you are relying on in Cases A and B. The fact that the lucid interval is temporary does not invalidate the competence displayed during it, just as a temporary recovery from mania would validate a treatment refusal made during that window.

  Ultimately, your intuitions are tracking a coherent view that values autonomy but refuses to let it become an instrument of torture for the current self. The only adjustment required is to recognize that the authority of the past self is deeply dependent on how well that self knew what they were deciding about. When that knowledge is speculative, as in Case B, the directive loses much of its moral weight, even if the current self is not currently screaming in terror.

  Warmly,

  Your Colleague
