prompt: |-
  I'm an economist — monetary and macro, pretty mainstream training — so my working vocabulary is fiat money, the double coincidence of wants, medium of exchange / unit of account / store of value, neutrality vs non-neutrality, real vs nominal rates, that sort of thing. I read some Aristotle in college but I've never actually sat down and worked through what his account of money and exchange amounts to in my own terms. So: restate Aristotle's position on money and exchange — the passages in the Nicomachean Ethics and the Politics — as faithfully as you can in the vocabulary of modern monetary economics. Then give me the residue report: which claims map cleanly onto the textbook functions of money or standard results, which ones you had to bend or fudge to make them fit, and which ones have no counterpart in the vocabulary at all (I'm thinking here of his distinction between natural and unnatural wealth-getting, his line that usury is against nature because money doesn't beget money, whatever exactly he means by that). And the part I actually care about: is the residue just Aristotle being pre-marginalist and confused about what money is, or is he tracking something that my vocabulary is built not to see?
reasoning: |-
