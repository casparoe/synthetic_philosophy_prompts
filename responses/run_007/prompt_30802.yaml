          *   Function: Measure of value (common denominator), medium of exchange, store of value (demand guarantee).
          *   Justice in Exchange: Reciprocity based on proportionality, not equality. Money makes things commensurable.
          *   Natural vs. Unnatural Wealth-getting (*Oikonomia* vs. *Chrematistike*): Use-value vs. Exchange-value.
          *   Usury: Money breeding money is unnatural.

  3.  **Drafting the Restatement (Modern Econ Translation):**
      *   *Origin:* Barter friction $\rightarrow$ Transaction costs $\rightarrow$ Emergence of a generally accepted medium of exchange.
      *   *Functions:* Unit of account (measure), Medium of exchange, Store of value (liquidity).
      *   *Commensurability:* Price mechanism. Money acts as the numeraire.
