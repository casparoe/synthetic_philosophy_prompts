      *   *Natural/Unnatural:* Consumption smoothing/production for use vs. Speculation/Infinite accumulation.
      *   *Usury:* Interest rate determination. Aristotle thinks $r=0$ is natural for money itself.

  4.  **Developing the Residue Report:**
