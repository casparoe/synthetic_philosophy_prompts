          *   *Institutional Embedding:* Money isn't just a technical tool; it's a social institution (*nomos*). Modern econ often treats it as a veil or a technical constraint.
          *   *The "Real" Economy:* Aristotle prioritizes the real resource constraint (needs) over the nominal accumulation. Modern macro sometimes loses sight of the real economy in financial models.
          *   *Endogeneity:* Money is a creature of the state/law (*nomos*), not just a market emergent property (though MMT/Post-Keynesians might agree here).

