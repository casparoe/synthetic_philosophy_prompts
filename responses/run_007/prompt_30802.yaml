          *   *Natural vs. Unnatural:* The moral distinction between producing goods and trading for profit.
          *   *Usury:* The idea that money is sterile.

  5.  **Addressing the Core Question (Confusion or Blind Spot?):**
      *   *The "Confusion" View:* Aristotle didn't understand compound interest, capital productivity, or time preference. He treated money as a static counter, not a claim on future resources.
