prompt: |-
  I help run a small foundation that funds research on global priorities, and we're hosting a weekend workshop next month bringing together people who use evidential-cooperation-in-large-worlds reasoning to guide cause selection and people who think the whole framework is basically decision-theoretic fan fiction. The two sides have been sniping at each other in blog posts and Twitter threads for years but they've never actually sat down and tried to write up what they agree on and where exactly the disagreement lives. I want to fix that — we've got the budget to fly everyone out and lock them in a room for two days, but I need a draft of what they should be aiming to produce before we go in.

  Here's what I'd like: draft the joint statement that could come out of a good-faith adversarial collaboration between them. The ECL camp thinks that when you're one of many agents facing similar choices about which global problems to prioritize, your decision provides evidence about what those other agents will do — so you should act as if you're cooperating acausally with them, which can shift the ranking of interventions in ways that aren't captured by a naive causal expected-value calc. The skeptic camp thinks this whole apparatus is unfalsifiable, relies on picking a reference class that conveniently gives you the answer you wanted, and that we have enough trouble with causal coordination in the world without adding acausal coordination to the mix. (Some of them also think the whole thing smuggles in fanatical conclusions under a veneer of mathematical rigor, tho not everyone on the skeptic side goes that far.)

  I want the deliverable structured as: a numbered list of claims both sides can genuinely sign — and please don't make these vacuous, I want the strongest substantive claims they can actually agree on, even if they're hedged or narrow; then a disagreements table with columns for the precise point of disagreement (phrased so neither side would object to how their own position is characterized), what each side says would change their mind, and whether there's any empirical test or concrete case both agree would bear on the crux. If there are points where you think the dispute is partly verbal — where they're using terms differently or talking past each other — flag those and explain what's going on. The aim isn't to settle anything; it's to produce a document where both sides can say "yeah, that's actually what we disagree about" instead of the caricatures they've been arguing against for years.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A small foundation funding global priorities research is hosting a workshop.
      *   **Participants:** Two camps:
          1.  *ECL Proponents:* Evidential Cooperation in Large Worlds (acausal cooperation, decision theory like FDT/UDT applied to global priorities).
          2.  *Skeptics:* Think ECL is unfalsifiable, reference-class gerrymandering, distracts from causal coordination, potentially leads to fanaticism.
      *   **Goal:** A draft joint statement/outcome document for the workshop.
      *   **Structure:**
          1.  Numbered list of substantive agreed claims (not vacuous).
          2.  Disagreements table (Point of Disagreement, ECL View, Skeptic View, Mind-Changing Conditions/Empirical Tests).
          3.  Identification of verbal disputes/terminological confusion.
      *   **Tone:** Good-faith, adversarial collaboration, precise, charitable, non-caricatured.

  2.  **Deconstruct the Subject Matter (ECL vs. Skeptics):**
      *   *What is ECL?* It's the idea that in a large universe (or multiverse), there are likely many copies or similar agents to you. Your decision algorithm is correlated with theirs. Therefore, you should cooperate with them (e.g., compromise on values) to maximize total value, even if you can't causally interact. This often implies prioritizing "compromise" causes over "narrow" causes.
      *   *What are the main criticisms?*
          *   *Epistemic:* How do you define the reference class? It seems arbitrary.
          *   *Decision Theoretic:* Is Causal Decision Theory (CDT) wrong? Is Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) right?
          *   *Practical:* Does this actually help anyone *now*? Or is it an excuse for weird prioritization?
          *   *Fanaticism:* Does it lead to Pascal's Mugging style reasoning (tiny probabilities of huge impacts dominate)?
      *   *Where is the common ground?*
          *   Both care about doing good effectively.
          *   Both acknowledge uncertainty about decision theory.
          *   Both agree that causal coordination is hard and important.
          *   Both agree that "naive" expected value can be misleading.
          *   Both agree that the size of the universe matters for some ethical calculations.

  3.  **Drafting Section 1: Agreed Claims (The "Common Ground"):**
      *   *Constraint:* Must be substantive, not vacuous.
      *   *Idea 1:* Uncertainty. Both sides admit they aren't 100% sure about the correct decision theory.
      *   *Idea 2:* The stakes. If ECL is true, the stakes are huge. If false, the cost of pursuing it might be low (opportunity cost).
      *   *Idea 3:* Causal coordination is a prerequisite. You can't do acausal coordination if you can't even talk to humans.
      *   *Idea 4:* Reference classes matter. Both agree that *how* you group agents is critical, even if they disagree on *how* to do it.
      *   *Idea 5:* Fanaticism risk. Both acknowledge that long-shot high-impact reasoning carries risks of error.
      *   *Refining for Strength:* Instead of "We agree uncertainty exists," say "We agree that decision-theoretic uncertainty should explicitly factor into prioritization, even if we weigh it differently." Instead of "Causal coordination is good," say "Investments in causal coordination infrastructure retain value regardless of ECL's validity."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Need precise phrasing.* Avoid "Skeptics think ECL is stupid." Use "Skeptics assign low credence to the premise that..."
      *   *Crux 1: The Reference Class.* ECL says "similar algorithm." Skeptics say "arbitrary grouping."
      *   *Crux 2: Decision Theory.* ECL leans FDT/UDT. Skeptics lean CDT/EDT.
      *   *Crux 3: Action Guidance.* ECL says "Compromise on values." Skeptics say "Focus on tractable causal problems."
      *   *Mind-Changing:* What would convince them?
          *   ECL -> Skeptic: A formal proof that correlation implies influence in this context, or a demonstration that ECL leads to systematically worse outcomes.
          *   Skeptic -> ECL: A robust method for defining reference classes that isn't sensitive to framing, or a thought experiment where CDT clearly fails and ECL succeeds.
      *   *Empirical Tests:* Hard to test acausal stuff. Maybe look at "pre-commitment" behaviors in humans as a proxy? Or simulation theory evidence? (Keep it grounded).

  5.  **Drafting Section 3: Verbal Disputes:**
      *   *Term:* "Cooperation." ECL means "acausal correlation alignment." Skeptics mean "joint action."
      *   *Term:* "Evidence." ECL means "logical correlation." Skeptics mean "causal signal."
      *   *Term:* "Rationality." ECL means "winning in all possible worlds (including counterfactuals)." Skeptics means "winning in the actual causal world."

  6.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Too dry? Needs to be usable for a workshop.
      *   *Check Constraints:* Did I include the "fanaticism" point mentioned in the prompt? Yes, add that to agreements or disagreements.
      *   *Check "Vacuousness":* Ensure the agreements aren't just "We agree to talk." They need to be claims about the world/reasoning.
      *   *Self-Correction on Agreements:* Make sure the ECL proponents don't feel like they sold out. They shouldn't agree that ECL is "unproven" in a way that implies it's likely false, but rather that it is "contested." Make sure Skeptics don't agree that ECL is "plausible" if they think it's nonsense. They can agree that "the *implications* are significant *if* true."

  7.  **Final Polish:** Organize clearly with headers. Ensure the "Mind-Changing" conditions are specific. (e.g., instead of "more evidence," say "a formal model that resolves the reference class problem without circularity").

  8.  *(Self-Correction during drafting)*: I need to make sure I don't take a side. The prompt asks me to draft the *document*, not solve the philosophy. The document must be neutral.
      *   *Refining the "Fanaticism" point:* The prompt mentions skeptics worry about fanaticism. ECL proponents might argue ECL *mitigates* fanaticism by encouraging compromise. This is a nuance to capture in the disagreements.

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **DRAFT WORKSHOP OUTPUT: JOINT STATEMENT ON EVIDENTIAL COOPERATION IN LARGE WORLDS (ECL)**

  **Date:** [Workshop Date]
  **Participants:** Proponents of Evidential Cooperation in Large Worlds (ECL) and Skeptics of Acausal Decision-Theoretic Frameworks
  **Facilitated By:** [Foundation Name]

  ### PREAMBLE
  This document represents the output of a two-day adversarial collaboration workshop. The goal was not to reach consensus on the validity of ECL, but to precisely map the terrain of agreement and disagreement. Both sides acknowledge that the stakes of this debate are high: if ECL is valid, it fundamentally alters global prioritization; if it is invalid, reliance on it represents a significant opportunity cost. The following sections outline our shared premises, our precise points of divergence, and the conditions under which we might update our views.

  ---

  ### PART I: SUBSTANTIVE AGREEMENTS
  *The following claims are endorsed by all workshop participants. These are not merely procedural agreements but substantive claims about the nature of the problem.*

  1.  **Decision-Theoretic Uncertainty is Material:** Regardless of which decision theory (Causal, Evidential, or Functional) is ultimately correct, uncertainty about which theory is correct should explicitly factor into high-stakes prioritization calculations. We agree that ignoring decision-theoretic uncertainty is a methodological error.
  2.  **The "Large World" Premise is Empirical:** The potential applicability of ECL depends on empirical claims about the size of the universe (or multiverse) and the prevalence of agents running decision algorithms sufficiently similar to ours. We agree that if the universe is small or finite in a way that precludes relevant duplicates, ECL loses its force.
  3.  **Causal Coordination is a Prerequisite:** Investments in causal coordination infrastructure (communication channels, trust-building institutions, verification mechanisms) retain high value regardless of ECL's validity. Acausal cooperation does not substitute for the ability to coordinate causally with contemporaries; in fact, causal coordination may be necessary to credibly signal one's decision algorithm to potential acausal partners.
  4.  **Reference Class Sensitivity:** Both sides agree that the output of ECL reasoning is highly sensitive to how one defines the "reference class" of agents with whom one is cooperating. We agree that currently, there is no universally accepted, non-circular method for selecting this reference class, and that this sensitivity is a major vulnerability in current ECL models.
  5.  **Risk of Fanaticism:** Both sides acknowledge that reasoning frameworks involving extremely large stakes and small probabilities (whether via ECL or other long-termist avenues) carry a heightened risk of epistemic error and "fanaticism" (where low-probability, high-impact scenarios dominate all other considerations). We agree that robustness checks against this specific risk are required for any prioritization recommendation derived from ECL.
  6.  **Value of Compromise:** Even without accepting ECL, there is independent value in seeking compromise between competing value systems to reduce conflict and increase total welfare. Therefore, some interventions recommended by ECL (e.g., value pluralism) may be robustly good even if the ECL justification for them is rejected.

  ---

  ### PART II: DISAGREEMENTS TABLE
  *This table isolates the specific cruxes where the two camps diverge. The "Mind-Changing Condition" column specifies what evidence or argument each side requires to significantly update their credence.*

  | Point of Disagreement | ECL Proponent Position | Skeptic Position | Mind-Changing Conditions / Empirical Bearings |
  | :--- | :--- | :--- | :--- |
  | **1. Logical Correlation vs. Causal Influence** | Decisions provide *evidence* about the decisions of similar agents in other parts of the universe (logical correlation). Acting as if you can influence them via this correlation maximizes expected value. | Correlation is not causation. Updating your belief about what others do based on your choice is valid (EDT), but acting *as if* you control them (FDT/UDT) is a category error that leads to magical thinking. | **ECL:** A formal demonstration that CDT systematically loses value in "Large World" scenarios where FDT wins, without relying on contrived Newcomb-like boxes.<br>**Skeptic:** A proof that "logical correlation" implies a normative obligation to act differently than CDT dictates in non-simulated environments. |
  | **2. Reference Class Selection** | The reference class should include agents running sufficiently similar decision algorithms, regardless of physical substrate or location. Similarity is a matter of degree, not kind. | Current methods for defining "similar algorithms" are gerrymandered to produce desired outcomes. Without a rigid, objective criterion, the framework is unfalsifiable. | **Both:** A formal metric for "algorithmic similarity" that yields stable prioritization recommendations even when the framing of the decision problem changes slightly. |
  | **3. Opportunity Cost of Focus** | The potential upside of ECL (cooperating with a vast number of copies) is so large that it warrants significant research attention, even if current credence is moderate (e.g., 10-20%). | The opportunity cost is too high. Time spent on ECL is time not spent on tractable causal problems (e.g., pandemic prevention, AI governance). The expected value of ECL research is negative due to distraction. | **ECL:** Evidence that engaging with ECL reasoning leads to worse *causal* outcomes (e.g., reduced ability to form causal coalitions).<br>**Skeptic:** A concrete case study where ECL reasoning identified a high-impact intervention that causal reasoning missed, which was then successfully executed. |
  | **4. Handling Fanaticism** | ECL can actually *mitigate* fanaticism by encouraging compromise. If many value systems exist, ECL suggests cooperating rather than trying to win everything, smoothing out extreme bets. | ECL *exacerbates* fanaticism. It introduces a new axis of infinite/huge stakes (the size of the universe) that makes prioritization even more sensitive to speculative physics and metaphysics. | **Both:** A comparative analysis of portfolio allocations under ECL vs. Causal Longtermism to see which yields more "fanatical" resource distribution (e.g., >90% to one speculative cause). |
  | **5. Normative Force** | If you accept that you are one of many similar agents, rationality *requires* you to cooperate acausally to avoid a prisoner's dilemma with your copies. | Rationality requires maximizing impact in the causal world you inhabit. Any "obligation" to non-causally connected entities is a preference, not a rational requirement. | **Both:** Agreement on a "money pump" or Dutch Book argument that definitively shows one side is vulnerable to exploitable inconsistency and the other is not. |

  ---

  ### PART III: VERBAL DISPUTES & TERMINOLOGICAL CLARIFICATION
  *We identified areas where disagreement appeared deeper than it actually was due to differing definitions. Clarifying these terms does not resolve the substantive disagreement, but prevents talking past one another.*

  **1. "Cooperation"**
  *   **The Confusion:** Skeptics hear "cooperation" and assume it implies communication, negotiation, or enforceable contracts. ECL proponents use it to mean "aligning decision outputs despite no causal channel."
  *   **Resolution:** We agree to use the term **"Acausal Coordination"** for the ECL concept to distinguish it from standard causal cooperation. This clarifies that no information is being transmitted.

  **2. "Evidence"**
  *   **The Confusion:** In standard scientific discourse, "evidence" implies a causal link between the phenomenon and the observation. In ECL, "evidential" refers to Bayesian updating based on logical correlation.
  *   **Resolution:** Skeptics acknowledge that ECL proponents are not claiming a causal signal exists. ECL proponents acknowledge that their use of "evidence" does not meet the standard falsifiability criteria of empirical science. We agree to label this **"Logical Evidence"** vs. **"Causal Evidence."**

  **3. "Rationality"**
  *   **The Confusion:** Skeptics often define rationality as "instrumental success in the actual world." ECL proponents often define it as "adhering to a decision theory that wins in all possible worlds (including counterfactuals)."
  *   **Resolution:** We agree that the dispute is partly about whether decision theory should be evaluated on **actual outcomes** (Skeptic) or **algorithmic optimality across possible worlds** (ECL). This is a meta-ethical disagreement, not an empirical one.

  ---

  ### PART IV: NEXT STEPS FOR RESEARCH
  *Based on the above, we propose the following research agenda to narrow the disagreement:*

  1.  **Reference Class Robustness Study:** A joint project to test how ECL recommendations shift when the definition of "similar agent" is varied. If recommendations are stable across a wide range of definitions, Skeptic concerns about gerrymandering are reduced.
  2.  **Causal Spillover Audit:** An empirical review of whether engagement with ECL reasoning has historically improved or degraded causal coordination capabilities within the effective altruism community.
  3.  **Decision-Theoretic Stress Testing:** Development of new thought experiments that separate "Large World" ECL scenarios from standard "Newcomb" problems, to test if CDT and FDT diverge in realistic prioritization contexts.

  ---

  **Signed,**

  *[Representative, ECL Camp]*
  *[Representative, Skeptic Camp]*

  *[Date]*
