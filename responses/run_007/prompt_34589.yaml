  There is no single canonical term, but you are describing a specific mutation of **Aesthetic Testimony**. While philosophy debates whether testimony can *justify* belief, you are observing a sociological practice where testimony *replaces* experience.

  I suggest calling this **"Aesthetic Ventriloquism."**

  Unlike simple cultural posturing, the ventriloquist isn't necessarily lying. They admit non-consumption ("I haven't read it") because they believe the discourse *is* the object. This aligns with Baudrillard's **Simulacra**: the map (reviews, tweets) precedes and supersedes the territory (the art). The verdict becomes a free-floating signifier, detached from the phenomenological messiness of actual engagement. It is also a form of **Cultural Capital** (Bourdieu) acquired without labor—signaling belonging without the cost of cultivation.

  **Boundaries:**
  1.  **Informed Non-Consumption:** Using discourse to decide whether to engage. (Functional)
  2.  **Intellectual Posturing:** Pretending to have engaged. (Deceptive)
  3.  **Aesthetic Ventriloquism:** Engaging only with the consensus, treating the verdict as data. (Sincere but hollow)

  The brittleness you note stems from a lack of **phenomenological resistance**. A real reader struggles with the text; they have friction. They remember boredom, confusion, or a specific line that landed wrong. The ventriloquist has only smooth conclusions. Their judgment is crisp because it has been pre-digested by the culture industry. When pressed ("Which passage felt self-indulgent?"), they cannot point to the territory, only repeat the map ("Critics say the third act collapses"). They are immune to textual evidence because they treat the text as secondary to the conversation *about* the text.

  This differs from Frankfurt's **Bullshit**. The bullshitter is indifferent to truth. The ventriloquist believes the discourse *is* the truth. They aren't ignoring reality; they inhabit a hyper-reality where consensus outweighs sensory experience. It is also distinct from being well-informed; a scholar might know a text via summary but acknowledges the gap. The ventriloquist denies the gap matters.

  For your character, this creates a specific vulnerability: they can be dismantled not by contradiction, but by requests for specificity. They speak in the register of a review because they possess only conclusions, not memories. They haven't read the book; they've read the room. This stance signals belonging to a class without the labor of cultivation, making it a perfect marker of modern anxieties about authenticity.
