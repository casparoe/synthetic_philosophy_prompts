  ### Notes on the Draft for the User

  1.  **The Tone:** I have tried to keep the language precise enough for philosophy but human enough for the context. The "Signatures" section is crucial—it forces the Friend to acknowledge your pain isn't just "squeamishness," and forces you to acknowledge the Friend isn't a monster.
  2.  **The Cruxes:**
      *   **Crux 1** targets the Utilitarian escape hatch. Often, Utilitarians say, "Well, you *should* train yourself not to calculate." This crux forces them to admit if the *disposition* to calculate is inherently worse, even if outcomes are identical.
      *   **Crux 2** targets the "Professional vs. Personal" boundary. If the Friend admits the Surgeon case is different, they concede that there are spheres where impartial calculation is inappropriate (which is Williams's point).
  3.  **Verbal Dispute:** I highlighted the definition of "Right Action." Williams argues that Utilitarianism fails because it ignores the *agent's perspective*. Your friend is likely judging the *act*, while you are judging the *agent*. This section makes that explicit.

