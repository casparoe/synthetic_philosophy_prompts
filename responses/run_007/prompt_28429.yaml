      *   ...need to deepen this.

      *   *Revised Plan:*
          *   Elena: The existence of experience is the one thing we can't doubt.
          *   Marcus: We can't doubt the *judgment*, but the judgment can be false about the nature of the state.
          *   Elena: But an illusion is a phenomenon. To be fooled is to experience.
          *   Marcus: No, to be fooled is to represent incorrectly. The representation is physical/functional.
          *   Elena: You're explaining away the data.
          *   Marcus: I'm explaining the data better than positing magic.
          *   Elena: Introspection is direct access.
          *   Marcus: Introspection is a internal scan, prone to error.

  8.  **Word Count Management:**
      *   Aim for ~750 words.
      *   Keep exchanges tight. Avoid long monologues.

  9.  **Final Review against Constraints:**
      *   No preparatory reasoning in output? Yes.
