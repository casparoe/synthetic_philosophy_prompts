answer: |-
  # Q&A Prep Sheet: Cluelessness & Near-Term Prioritization

  **Context:** EA Conference Talk.
  **Thesis:** Cluelessness undermines near-term cause rankings (GHD vs. AW) just as much as longtermism; confidence is an artifact of truncating causal chains.
  **Audience:** 1/3 GHD, 1/3 AW, 1/3 Longtermists, ~5 Philosophers.

  ---

  ### 1. The "Paralysis" Objection (Global Health / General)
  **Question:** "If we accept your premise that the long-term effects of bednets are unknowable, aren't you just arguing for paralysis? If we can't trust the sign of the effect in 50 years, why fund *anything*? Isn't this just skepticism dressed up as analysis?"

  **Reply (2 min):**
  "That's the natural fear, but I'm not arguing for paralysis; I'm arguing for humility in *ranking*, not in *acting*. We know bednets save lives *now*. That immediate utility is robust. My point is that when we use *long-term* ripple effects to rank causes—for example, claiming global health is superior to animal welfare because of economic growth multipliers—we are relying on models that are just as fragile as the longtermist models we critique.
  This doesn't mean we stop distributing bednets. It means we should stop pretending we know that bednets are *instrumentally superior* to wild animal welfare interventions over a century-long horizon. The practical implication isn't 'do nothing,' it's 'diversify.' If error bars are that wide, putting 80% of marginal dollars into one cause area based on fragile long-term projections is unjustified risk-taking. We should act on the near-term certainty while acknowledging we don't know the trajectory change."

  **Soft Spot:** You haven't provided a positive decision procedure for allocation, only a critique of the current one. If they press "Okay, so what *is* the allocation rule?", you risk sounding vague.

  ### 2. The "Empirical Evidence" Objection (Global Health)
  **Question:** "You're conflating 'uncertainty' with 'cluelessness.' We have RCTs. We have follow-up studies on economic productivity from health interventions. You can't just wave away decades of development economics by saying 'ripple effects are unknown.' We have data."

  **Reply (2 min):**
  "I'm not waving away the data; I'm questioning the *horizon* of that data. RCTs are phenomenal at measuring direct effects over 1–5 years. They show children don't get malaria. But the claim that makes GHD win in prioritization is often about *development*—that healthier kids grow up to boost the economy, stabilize governments, etc.
  Once you move past the direct health effect into the socio-economic ripple, the RCT evidence drops off. We model those ripples using macroeconomic assumptions that are historically unreliable. My argument is that the 'cluelessness' kicks in exactly where the RCTs stop and the modeling begins. If we prioritize GHD over AW based on those economic multipliers, we are relying on the same kind of speculative modeling longtermists use for AI safety. I'm asking us to admit that the 'development' part of Global Health and Development is far more uncertain than the 'Health' part."

  **Soft Spot:** Distinguishing between "direct long-term effects" (health persistence) and "indirect ripple effects" (economic growth) is tricky. If they argue health persistence *is* the main value, your point weakens.

  ### 3. The "Longtermist Trap" (Longtermist)
  **Question:** "Wait, aren't you accidentally proving our point? If near-term interventions are *also* clueless about the long-term future, but longtermist interventions are *explicitly* targeting the long-term, doesn't the vastness of the future still dominate? If the sign is uncertain for bednets too, EV still favors reducing existential risk because the stakes are higher."

  **Reply (2 min):**
  "That's a sharp catch, and it's the standard longtermist rebuttal. But it relies on the assumption that longtermist interventions have a *less* uncertain sign than near-term ones. I'm arguing the opposite: that trajectory changes from AI governance or biosecurity are *more* sensitive to chaotic variables than health interventions.
  If the sign of a bednet distribution is uncertain over 100 years due to population dynamics, the sign of a policy intervention on AI is uncertain due to technological dynamics. If both are clueless, you can't use the 'vastness of the future' to break the tie, because the probability of positive impact approaches zero for *both*. It doesn't boost longtermism; it levels the playing field. If we are truly clueless, the 'astronomical waste' argument collapses because we don't know if we're filling the waste or digging the hole deeper."

  **Soft Spot:** This relies on the claim that AI/Bio interventions are *more* uncertain than health ripples. A sophisticated longtermist will argue they have better models for trajectory change than economists do for development.

  ### 4. The "Comparative Advantage" Objection (Animal Welfare / GHD)
  **Question:** "Even if I grant you wide error bars on everything, isn't Global Health still *less* uncertain than Animal Welfare? Even if we don't know the economic ripple, we know the sentient experience impact is more direct in GHD. Doesn't cluelessness apply *unevenly*?"

  **Reply (2 min):**
  "It does apply unevenly, but not in the direction the community usually assumes. We tend to think GHD is 'concrete' and AW is 'speculative.' But if we look at the long-term moral value, AW often hinges on institutionalizing concern for non-humans—a cultural shift. GHD hinges on economic growth.
  Which is more predictable? Economic growth leading to moral progress is a contested historical thesis. Cultural expansion of the moral circle is also contested. I'm not saying AW is superior; I'm saying the *confidence gap* between them is smaller than the funding gap suggests. If we admit cluelessness, we can't justify a 10x funding disparity based on the idea that one is 'tangible' and the other isn't. Both rely on assumptions about how the world evolves morally and politically over decades."

  **Soft Spot:** You are fighting the intuition that "suffering is more visible in humans." You need to keep the focus on *long-term prioritization*, not immediate relief, or you lose the GHD crowd.

  ### 5. The "Type A vs. Type B" Objection (Academic Philosopher)
  **Question:** "You need to distinguish between Type A cluelessness (we don't know the sign) and Type B (we don't know the magnitude). Greaves and others have argued that for many interventions, symmetric ignorance cancels out in expectation. Are you claiming the distribution of outcomes is skewed, or just wide?"

  **Reply (2 min):**
  "Excellent distinction. I'm arguing that for structural interventions like health or policy, the distribution is likely *skewed*, not symmetric. This isn't a coin flip where good and bad effects cancel.
  Take population dynamics: saving lives now changes the demographic trajectory. That isn't symmetric noise; it's a structural shift with path dependence. If the 'bad' outcome is existential risk via overpopulation or resource conflict, and the 'good' is economic growth, those aren't symmetric values in a utilitarian calculus. Because the causal chains involve non-linear thresholds (tipping points, collapses), we can't assume the expectation remains positive just because the immediate effect is. The symmetry argument works for minor tweaks, not for interventions that alter demographic or economic baselines."

  **Soft Spot:** This is technical. If you can't cite specific mechanisms for the skew (e.g., specific demographic transition models), the philosopher will press you on the mathematical expectation.

  ### 6. The "Decision Theory" Objection (Longtermist / Philosopher)
  **Question:** "Expected Value maximization handles uncertainty. We just integrate over the probability distribution. Why does 'wide error bars' change the ranking? If the mean EV of GHD is still positive, even with high variance, why shift dollars?"

  **Reply (2 min):**
  "Because in practice, the community isn't integrating over a wide distribution; it's acting on a point estimate. When GiveWell or similar bodies rank causes, they present a 'best estimate' that implicitly treats the variance as negligible for the sake of action.
  My argument is that when variance is *that* high, the 'maximize EV' heuristic becomes unstable. Small changes in modeling assumptions flip the sign. If your ranking is sensitive to modeling choices that are themselves unverified, you aren't maximizing EV; you're maximizing confidence in a specific model. Practically, this means we should apply a 'uncertainty discount' to causes that rely heavily on long-chain causal modeling, regardless of whether they are near-term or long-term."

  **Soft Spot:** A decision theorist will correctly point out that rational agents should still maximize EV even with high variance. You are arguing for a heuristic adjustment, which is theoretically vulnerable.

  ### 7. The "Truncation" Objection (General / GHD)
  **Question:** "You say we stop the causal chain too early. But you have to stop somewhere. Why is stopping at 50 years better than stopping at 5 years? If we can't know 50 years, why not just focus on the 5-year horizon where we *aren't* clueless?"

  **Reply (2 min):**
  "I agree we should focus on the 5-year horizon for *evaluation*. But the community uses 50-year projections for *prioritization*. We say 'Global Health is better than Animal Welfare' because of long-term development assumptions.
  My plea is consistency: If we admit we are clueless about the 50-year horizon, we shouldn't use that horizon to rank causes. We should rank them based on the 5-year horizon where the data exists. And on a 5-year horizon, the gap between GHD and AW narrows significantly compared to the gap in current funding. I'm not saying we ignore the future; I'm saying we shouldn't pretend we can forecast it well enough to use it as a tie-breaker for current funding."

  **Soft Spot:** If they agree to rank only on 5-year horizons, you might undermine the case for *any* movement building or policy work, which hurts your own position if you support those.

  ### 8. The "Moral Urgency" Objection (Animal Welfare / GHD)
  **Question:** "This feels like a luxury debate. People are dying in front of us. Animals are suffering in factory farms *now*. Even if we are clueless about 2100, isn't it morally negligent to hesitate on saving identifiable lives today based on theoretical uncertainty?"

  **Reply (2 min):**
  "I feel the weight of that deeply. This isn't about hesitating to save lives today. It's about how we allocate *marginal* dollars at the margin. The first $10 million into bednets is obvious. The billionth dollar is where prioritization matters.
  When we claim we know with confidence that Cause A is superior to Cause B, we direct all marginal funding to A. If that confidence is an artifact of ignoring cluelessness, we might be neglecting B which could be more robust or valuable. Acknowledging uncertainty protects us from monocultures. It ensures we keep funding AW or longtermism even if GHD looks 'better' on a fragile model. It's not about letting people die; it's about ensuring we don't put all our eggs in a basket we think is secure but might not be."

  **Soft Spot:** Emotional resonance is against you here. "Identifiable lives" will always beat "theoretical error bars" in a live audience setting.

  ---

  ### ☠️ The Prayer Question (The One You Hope Nobody Asks)
  **Question:** "You've spent 20 minutes dismantling the confidence of every cause area in this room. Given your own argument about wide error bars and modeling vulnerability, **where did *you* donate last year, and how do you justify that specific choice without using the very prioritization logic you just attacked?**"

  **Why it's dangerous:**
  1.  **Consistency Trap:** If you name a cause (e.g., GHD), they will ask why you didn't diversify given your "wide error bars" argument.
  2.  **Hypocrisy Charge:** If you say "I diversified," they will ask if you actually believe your own thesis or if you're just performing skepticism.
  3.  **Positive Theory Void:** It exposes that you have a critique but no actionable alternative framework.

  **Prep Strategy:**
  *   *Do not* name a single cause.
  *   *Do* emphasize a portfolio approach.
  *   *Script:* "I donate to a diversified portfolio across cause areas precisely *because* of the argument I just made. If error bars are wide, concentration is risk. I support direct aid for the near-term certainty, and movement building for the option value. I justify it not by maximizing a point estimate, but by minimizing the risk of being catastrophically wrong."
