      6.  *The "Truncation" Objection (General):* Why stop at decades? Why not centuries for bednets too?
      7.  *The "Decision Theory" Objection (Philosopher/Longtermist):* Expected Value maximization handles uncertainty.
      8.  *The "Moral Urgency" Objection (GHD/AW):* People are dying *now*. Theory shouldn't stop us from saving them.

