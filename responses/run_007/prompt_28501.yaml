answer: |-
  The Church–Turing thesis (CTT) occupies a unique and precarious position in the foundations of mathematics and computer science. It asserts that every function that is effectively calculable by human means is computable by a Turing machine. Unlike the incompleteness theorems or the undecidability of the halting problem, CTT is not a mathematical theorem; it cannot be proved within a formal system because one of its terms—"effectively calculable"—is inherently informal. Yet, it is not treated as a standard empirical hypothesis either. No experiment in physics can falsify it, for it concerns mathematical abstraction rather than physical law, and proposed counterexamples invariably dissolve upon analysis, either proving to be Turing-computable or failing to meet the criteria of an effective procedure. This ambiguity raises a fundamental epistemological question: what kind of claim is the Church–Turing thesis? Is it a definition, an empirical conjecture, a principle of intuition, or something else? While the thesis is often supported by quasi-empirical evidence regarding the convergence of formalisms, its true epistemic status is best understood as a successful **conceptual explication** that reveals a necessary truth about the nature of effective procedures.

  To understand why CTT resists standard categorization, one must first dismiss the view that it is a straightforward empirical hypothesis. If CTT were an empirical claim about the physical world, it would be contingent upon the laws of nature. This confusion often arises from conflating the mathematical CTT with the "Physical Church–Turing Thesis," which claims that every physically realizable computation is Turing-computable. The latter is indeed an empirical claim, subject to revision by discoveries in quantum mechanics or relativistic computing. However, the standard CTT concerns *effective calculability*—the notion of a step-by-step procedure that a human can follow without insight or creativity. This is a modal concept regarding what *can* be calculated in principle, not what *is* calculated in practice. If CTT were merely empirical, the discovery of a hypercomputer would falsify it. Yet, even if a physical device could solve the halting problem, proponents of CTT would argue that the device does not perform an "effective procedure" in the intuitive sense, as its operations might not be surveyable or reproducible by a human agent. Thus, the thesis is insulated from simple empirical falsification because its core term is normative and conceptual, not descriptive of physical machinery.

  Conversely, treating CTT as a mere definition or stipulation is equally unsatisfactory. If one simply defines "computable" as "Turing-computable," the thesis becomes trivially true but philosophically vacuous. It would cease to be a thesis and become a terminological convention. However, the mathematical community does not treat it as a convention; it is judged by its fidelity to the pre-theoretic intuition of calculation. When a new model of computation is proposed, it is measured against CTT. If the model captures the intuitive notion but exceeds Turing computability, CTT is threatened; if it fails to capture the intuition, the model is rejected. The fact that CTT serves as a benchmark for the correctness of formalisms indicates that it makes a substantive claim about the relationship between the informal concept and the formal model. It claims that the formal model *exhausts* the informal concept, a claim that goes beyond mere stipulation.

  A more compelling account is the "convergence argument," often described as a quasi-empirical justification. This view notes that Turing machines, lambda calculus, general recursive functions, and Post systems were developed independently to capture the notion of computation, yet they all define the exact same class of functions. This robustness suggests that the class of Turing-computable functions is "natural" and likely captures the intuitive extension of effective calculability. While this convergence provides strong inductive support, it is ultimately circumstantial. It demonstrates that the formalisms are equivalent, but it does not logically guarantee that they map onto the informal intuition. One could imagine a scenario where all independent formalisms share a blind spot, missing a type of effective procedure that humans can intuitively grasp. Therefore, while convergence explains why we *believe* the thesis, it does not explain *what* the thesis is. It offers evidence, not ontological or epistemic classification.

  The most philosophically rigorous account is that CTT is a **conceptual explication**. Drawing on Rudolf Carnap's framework, an explication involves replacing a vague, informal concept (the explicandum) with a precise, formal concept (the explicatum) that preserves the core usage of the original while sharpening its boundaries for scientific use. On this view, CTT is the claim that the Turing machine formalism is the correct explication of effective calculability. However, to stop here is to understate the case. What makes the Church–Turing explication unique, compared to other philosophical explications, is the strength of the analysis underpinning it.

  Alan Turing's 1936 paper did not merely propose a machine; it provided a conceptual analysis of the "human computer." Turing decomposed the informal notion of calculation into atomic constraints: a finite number of symbols, a finite number of internal states, and local operations on a one-dimensional tape. He argued that any violation of these constraints would require either infinite memory, infinite speed, or non-mechanical insight—features explicitly excluded from the definition of an "effective procedure." Consequently, the thesis is not an inductive generalization from data, but a deduction from the analysis of the concept itself. If one accepts Turing's decomposition of "effective procedure" into finite, local, and deterministic steps, then the equivalence to a Turing machine follows necessarily.

  Therefore, the epistemic status of the Church–Turing thesis is that of a **conceptual truth derived from analysis**. It is not empirical because it does not depend on the contingent laws of physics; it is not a mere definition because it justifies why that definition is the correct one for the intuitive concept; and it is more than quasi-empirical convergence because it rests on the logical necessity of Turing's analysis of human computation. The thesis stands as a boundary condition for algorithmic thought. It tells us that the informal idea of "following a rule" has a precise limit, and that limit is the Turing machine. To deny CTT is not to propose a new physical theory, but to fundamentally alter the meaning of "calculation" itself.

  In conclusion, the Church–Turing thesis is best understood not as a hypothesis waiting for verification, but as a finalized conceptual explication that functions as a necessary truth within the domain of logic and mathematics. The historical convergence of formalisms serves as corroborating evidence, but the thesis's authority stems from Turing's rigorous analysis of what it means for a procedure to be effective. It bridges the gap between the informal and the formal not by guesswork, but by demonstrating that the informal concept, when fully unpacked, contains the formal constraints within it. We should therefore regard the Church–Turing thesis as a foundational principle of computability theory that is analytically true relative to the explicated concept of effective procedure. It is the definitive statement on the limits of mechanical reason, and its status is secure not because we have failed to find a counterexample, but because the conceptual space for a counterexample has been logically closed.
