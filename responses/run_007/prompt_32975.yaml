answer: |-
  You have put your finger on a precise and persistent tension in contemporary philosophy of mind and biology. You are correct that while "greedy reductionism" is a standard term (popularized by Daniel Dennett), there is no single, universally recognized Latin phrase for the *upward* counterpart that functions as its rhetorical mirror image.

  However, there is a term that was coined specifically to be the counterpart to greedy reductionism, and there are historical and technical labels for the specific *kind* of unexplained cause you are describing.

  Here is the breakdown of the terminology, the logical structure, and a proposal for naming the specific argumentative maneuver you are observing.

  ### 1. The Direct Counterpart: "Skyhooks"
  The term you are looking for is likely **"Skyhook."**

  In his 1995 book *Darwin's Dangerous Idea*, Daniel Dennett explicitly paired this term with "greedy reductionism." He argued that there are two ways to fail at explanation:
  *   **Greedy Reductionism:** Trying to explain everything from the bottom up so aggressively that you explain the phenomenon *away* (e.g., "Love is just oxytocin").
  *   **Skyhooks:** Positing a top-down causal force that hangs in mid-air, unsupported by the substrate below (e.g., "Consciousness exerts a primitive causal force").

  Dennett's metaphor is that a **Crane** is a mechanistic, bottom-up explanation that rests on the ground (physical laws) and lifts the weight (the phenomenon). A **Skyhook** is a miraculous lift that dangles from nothing.

  When a critic rejects a mechanistic account as "greedy" and then posits a top-down power without a mechanism, they are **swapping a Crane for a Skyhook.** While "Skyhook" names the *posit* rather than the *argumentative move*, it is the established terminology for the "upward version" of the error you identified.

  ### 2. The Historical Precedent: "Dormitive Virtue"
  If you want a term that captures the *hollowness* of the explanation (asserting a power without a mechanism), the classical term is the **"Dormitive Virtue"** (or *virtus dormitiva*).

  This comes from Molière's *The Imaginary Invalid* (1673), where a physician explains that opium puts people to sleep because it possesses a "sleeping power" (*virtus dormitiva*). In philosophy of science, this is the label for explaining a phenomenon by simply reifying the phenomenon itself as a cause.
  *   **Your example:** "Why does the organism seek complexity?" "Because of a principle of self-organization."
  *   **The critique:** You have named the observation ("self-organization") and pretended it is a cause ("principle of").

  ### 3. The Technical Metaphysical Label: "Brute Strong Emergence"
  In contemporary metaphysics, the position your critics are taking is called **Strong Emergence**. However, defenders of strong emergence usually try to provide an account of how the emergence happens. When they do not, and simply assert the causal power as fundamental, critics (like the physicist Sean Carroll or the philosopher Jaegwon Kim) refer to this as **"Brute Emergence"** or **"Magic Emergence."**

  Jaegwon Kim's critique is particularly relevant to your background. He argued that "downward causation" without a physical realization leads to **Causal Exclusion**: if the physical parts are sufficient to cause the physical effects, the "top-down" cause is either redundant (epiphenomenal) or it violates the closure of the physical domain (magic).

  ### 4. Naming the Argumentative *Move*
  You asked specifically about the *shape of the argument*: the pairing of the accusation (greedy reductionism) with the posit (unexplained top-down cause). There is no canonical name for this specific rhetorical *switch*, but it is a form of **Special Pleading** regarding explanatory standards.

  The critic demands mechanistic rigor of the reductionist ("You must show how the parts sum to the whole") but exempts their own posit from that rigor ("The whole has a primitive power").

  If I were to propose a name for this specific maneuver, filling the gap in the literature, I would suggest:

  **The Skyhook Swap**
  *   **Definition:** The argumentative move of rejecting a bottom-up mechanistic explanation on the grounds that it is "greedy" or "eliminativist," only to replace it with a top-down causal posit that lacks mechanistic grounding, derivation, or testability.
  *   **Edges:**
      *   **Mathematical Description:** If the top-down cause is given a mathematical description (e.g., a field equation) but no mechanism for how it couples to the substrate, it **still counts** as a Skyhook Swap. It is a formalized Skyhook, not a mechanism. (Example: Penrose-Hameroff Orch-OR theory is often accused of this; it posits quantum gravity effects without a clear mechanism for coupling to neural activity).
      *   **Placeholder Admission:** If the proponent explicitly admits the top-down cause is a **placeholder** for an unknown mechanism ("We need a new physics to explain this"), it **does not count** as the fallacy. It becomes an expression of *Explanatory Agnosticism*. The fallacy lies in treating the placeholder *as* the explanation.
      *   **Constraint:** If the top-down cause is constrained by conservation laws or coupling rules (even if unknown), it is a hypothesis, not a Skyhook. The Skyhook Swap requires the cause to be treated as exempt from the constraints imposed on the lower level.

  ### Summary for your notes
  *   **The Downward Error:** Greedy Reductionism (Dennett).
  *   **The Upward Error:** Skyhooks (Dennett) / Dormitive Virtue (Molière) / Brute Emergence (Kim).
  *   **The Rhetorical Move:** There is no standard name, but it functions as **Explanatory Special Pleading**.
  *   **Proposed Name:** **The Skyhook Swap**.

  As a physical chemist, your intuition is sound: the critics are demanding that the reductionist bridge the "Explanatory Gap," but they are bridging it themselves with a plank that doesn't touch the water on their side. They are treating the *name* of the mystery as the *solution* to the mystery.
