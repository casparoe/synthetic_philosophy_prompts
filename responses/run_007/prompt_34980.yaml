          *   1B: \$1M (89%), \$5M (10%), \$0 (1%)
          *   2A: \$1M (11%), \$0 (89%)
          *   2B: \$5M (10%), \$0 (90%)
          *   Preference: 1A > 1B and 2B > 2A.
