answer: |-
  Here is a structured plan for your two-hour seminar. It is designed to move from the students' existing knowledge (vNM) to the new material (REU) by leveraging a specific failure case, while proactively managing conceptual confusion.

  ### 1. The Carrying Example: The Allais Common Consequence Paradox
  **Do not use the Ellsberg Paradox.**
  *   **Why:** Ellsberg concerns *ambiguity* (unknown probabilities), whereas REU concerns *risk* (known probabilities). REU theory assumes agents have precise credences but weigh them non-linearly based on their attitude toward risk. Using Ellsberg would force you to spend precious time distinguishing risk from uncertainty, distracting from the core mechanics of the risk function $r$.
  *   **The Example:** Use the classic Allais Common Consequence setup. It is the direct logical antecedent to REU because REU is specifically constructed to accommodate Allais preferences while maintaining probabilistic sophistication.
      *   **Gamble 1A:** \$1 Million with probability 1.0.
      *   **Gamble 1B:** \$1 Million (0.89), \$5 Million (0.10), \$0 (0.01).
      *   **Gamble 2A:** \$1 Million (0.11), \$0 (0.89).
      *   **Gamble 2B:** \$5 Million (0.10), \$0 (0.90).
      *   **Target Preference:** 1A $\succ$ 1B and 2B $\succ$ 2A.

  ---

  ### 2. Sequence of Introduction & Dependencies
  *Total Time: 120 Minutes*

  #### Phase 1: The vNM Anchor (0:00 – 0:20)
  *   **Content:** Briefly recap Expected Utility (EU). Write the EU formula on the board. Explicitly isolate the **Independence Axiom**.
  *   **Dependency:** You cannot motivate REU without first establishing what it modifies. REU is a generalization of EU; students must see EU as the "special case."
  *   **Action:** Show that under EU, if 1A $\succ$ 1B, then mathematically 2A $\succ$ 2B *must* hold. Derive this quickly on the board by subtracting the common consequence (the 0.89 chance of \$1M).
  *   **Goal:** Establish that the target preferences (1A $\succ$ 1B and 2B $\succ$ 2A) are **forbidden** by vNM theory.

  #### Phase 2: The Diagnosis (0:20 – 0:45)
  *   **Content:** Present the Allais example. Ask students if the target preferences seem rational. (Most will say yes).
  *   **Dependency:** Now that they see the conflict between intuition and vNM, they are ready for a new formalism.
  *   **Crucial Intervention (Misconception #1):** Before introducing REU, ask: *"Can we solve this by just changing the utility function? Maybe the utility of \$5M isn't 5 times \$1M?"*
      *   **Why here:** Students will predictably think this is just **Diminishing Marginal Utility (DMU)**.
      *   **The Move:** Prove on the board that *no* monotonic utility function $u$ can satisfy both preferences simultaneously under EU. The violation is structural (Independence), not scalar (Utility). This clears the deck for a new parameter.
  *   **Goal:** Convince them that EU is insufficient, and that the insufficiency lies in how probabilities are treated, not how outcomes are valued.

  #### Phase 3: The REU Formalism (0:45 – 1:15)
  *   **Content:** Introduce the REU formula.
      $$ REU = u(o_0) + \sum_{i=1}^{n} r(P(\geq u_i)) \cdot [u(o_i) - u(o_{i-1})] $$
      *(Note: Use the "ranked outcomes" version where outcomes are ordered from worst to best).*
  *   **Dependency:** This depends on Phase 2. Since $u$ couldn't do the work, we introduce $r$ (the risk function).
  *   **Explanation:** Explain that $r$ transforms cumulative probabilities. If $r$ is convex, the agent is risk-inclined; if concave, risk-averse. If $r(p) = p$, REU collapses to EU.
  *   **Action:** Walk through the Allais calculation with a specific function (e.g., $r(p) = p^2$). Show that REU yields the Allais preferences.
  *   **Goal:** Demonstrate that REU formally accommodates the intuition that vNM rejected.

  #### Phase 4: Boundaries & Misconceptions (1:15 – 1:40)
  *   **Content:** Distinguish REU from similar-looking theories.
  *   **Dependency:** Now that they know the formula, they will try to map it onto things they've heard of (Psychology/Behavioral Econ).
  *   **Crucial Intervention (Misconception #2):** Address **Prospect Theory**.
      *   **Why here:** Students will ask, *"Isn't this just probability weighting from Prospect Theory?"*
      *   **The Move:** Distinguish the *project*. Prospect Theory is descriptive (how humans *do* choose, often irrationally). REU (on Buchak's account) is normative (how a rational agent *may* choose). Also, note that standard Prospect Theory weights raw probabilities; REU weights *cumulative* probabilities based on rank (making it consistent with stochastic dominance, which early PT was not).
  *   **Goal:** Prevent them from dismissing REU as "just behavioral bias formalized." Emphasize the philosophical claim: caring about risk structure is rationally permissible.

  #### Phase 5: Normative Status & Wrap (1:40 – 2:00)
  *   **Content:** Briefly mention the cost. REU violates Independence, which opens the door to dynamic inconsistency objections (money pumps).
  *   **Refusal:** Do **not** derive the money pump argument. It requires a multi-stage decision tree and distracts from the static choice theory you are teaching. Acknowledge it exists as the "price of admission" for REU.
  *   **Diagnostic Question:** (See below).

  ---

  ### 3. Predictable Misconceptions & Intervention Points

  | Misconception | The Student Thought | Intervention Point | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"This is Diminishing Marginal Utility"** | "Risk aversion is just caring less about extra money. We don't need a new theory." | **Phase 2 (The Diagnosis)** | Before writing the REU formula, prove algebraically that no utility function $u$ can generate Allais preferences under EU. Force them to see the problem is the *probability weighting*, not the *value of money*. |
  | **"This is Prospect Theory"** | "This is just Kahneman & Tversky. It's a bias, not a rational theory." | **Phase 4 (Boundaries)** | After introducing $r$, explicitly contrast the *normative* aim of REU (Buchak) vs. the *descriptive* aim of PT. Emphasize that REU preserves stochastic dominance (via rank-dependence) in a way early PT did not. |
  | **"Risk = Uncertainty"** | "This explains why we don't bet on unknown urns (Ellsberg)." | **Phase 1 (The Anchor)** | When introducing the Allais example, explicitly state: "In these gambles, the probabilities are **known**. We are not modeling ambiguity. We are modeling how rational agents treat known odds." |

  ---

  ### 4. What to Openly Refuse to Cover
  To keep the seminar within two hours and focused on the *structure* of REU, explicitly state at the beginning (or when the topic arises) that you will **not** cover:
  1.  **The Representation Theorem Proof:** You will state that axioms exist (Buchak's axioms) that represent REU, but you will not derive the theorem.
  2.  **Dynamic Consistency/Money Pumps:** Acknowledge that violating Independence creates tension in sequential choices, but refuse to walk through the money-pump argument. It requires a different framework (decision trees vs. normal form) and will consume 30+ minutes.
  3.  **Other Non-EU Theories:** Do not compare REU to Rank-Dependent Utility (RDU) or Cumulative Prospect Theory (CPT) in technical detail. Treat REU as the philosophical refinement of the RDU mathematical structure.

  ---

  ### 5. The Diagnostic Question
  At the very end (last 5 minutes), ask this question. Do not ask them to calculate a value. Ask them to relate the axiom to the function.

  **The Question:**
  > "If a rational agent's preferences satisfy the vNM **Independence Axiom**, what specific mathematical constraint does that place on their risk function $r(p)$ in REU theory, and why?"

  **The Answer You Are Looking For:**
  > "If they satisfy Independence, $r(p)$ must be the **identity function** (i.e., $r(p) = p$). This is because the Independence Axiom requires linear weighting of probabilities. If $r(p)$ is non-linear (concave or convex), the agent will violate Independence (as seen in Allais). Therefore, EU is just a special case of REU where $r$ is linear."

  **Why this works:**
  *   If they merely memorized the formula, they will stare blankly.
  *   If they understood the *structure*, they will recognize that REU is a generalization where EU is the limiting case defined by the Independence axiom. This confirms they understand the relationship between the axioms and the mathematical representation.
