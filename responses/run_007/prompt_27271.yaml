      *   **The Friend's Argument:** Politics is like surgery. Pain/damage (lying, breaking promises) is inflicted for the greater good (patient's/public's good). The guilt felt by the politician is like the surgeon's wince—a sign of character, not proof of wrongdoing.
      *   **The User's Intuition:** Something is wrong with the analogy, specifically regarding consent and the identity of the sufferer vs. the beneficiary.
      *   **The Task:**
