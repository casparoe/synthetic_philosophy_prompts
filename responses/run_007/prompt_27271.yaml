  3.  **Identify the Breaks (Disanalogies):**
      *   *Consent:* A patient consents to specific procedures (informed consent). Citizens vote for a party/platform, not specific lies. You can't consent to being lied to (paradox).
      *   *Identity of Sufferer/Beneficiary:* In surgery, the person cut is the person healed. In politics, the people lied to (or sacrificed) are often not the ones who benefit (e.g., minority groups, future generations, specific economic classes).
      *   *Epistemic Certainty:* Surgeons have high certainty about outcomes (cut here, bleed stops). Politicians have low certainty (lie now, will the economy actually improve?).
      *   *Nature of the "Cut":* A scalpel wound heals physically. A lie damages trust, which is social fabric. The "wound" might *prevent* recovery (erosion of democracy).
      *   *Professional Standards:* Surgeons are bound by strict ethical codes (Hippocratic Oath) where "do no harm" is primary, even if it means letting die. Politicians are bound by re-election or "reason of state."

  4.  **Analyze the "Sneaky Work" (Rhetorical Import):**
      *   *Medicalization of Politics:* It frames political dissent as "sickness" and the leader as the only "doctor." This is authoritarian.
      *   *Inevitability:* Surgery implies the cut is *necessary* for survival. Politics often involves choices where the "dirty" path is just *one* option, not the only one.
      *   *Depoliticization:* It removes agency from the public. They become passive bodies on a table, not active participants.
      *   *Moral Sanitization:* It frames the harm as "technical" rather than "moral."

