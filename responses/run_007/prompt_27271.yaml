  2.  **Deconstruct the Surgery Analogy (Correspondence Table):**
      *   *Surgeon* $\rightarrow$ *Politician*
      *   *Patient* $\rightarrow$ *The Public / Citizenry*
      *   *Scalpel/Violence* $\rightarrow$ *Lies, Broken Promises, Coercion*
