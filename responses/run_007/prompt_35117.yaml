answer: |-
  Yes, there is a name for this. You have independently reconstructed the core argument of contemporary philosopher **L.A. Paul** and her concept of a **Transformative Experience**.

  Specifically, the problem you are describing is known as **The Decision Problem for Transformative Experiences**.

  Here is the breakdown of the concept, how it maps to your description, the boundaries you asked about, and where the philosophical uncertainty lies.

  ### 1. The Name and the Framework
  In her 2014 book *Transformative Experience*, L.A. Paul argues that certain choices are "transformative" in two distinct ways. Your description focuses heavily on the second, which is often overlooked in favor of the first.

  *   **Epistemically Transformative:** The experience gives you new knowledge that you could not have accessed otherwise (e.g., "what it is like" to see color for the first time via a cochlear implant, or to taste a durian). This is the "qualia" argument you explicitly said you *weren't* just asking about.
  *   **Personally Transformative:** The experience changes your **core preferences and values**. It changes what you care about. This is the "yardstick shift" you described.

  **The Loop:** You identified the exact logical impasse Paul highlights. Standard decision theory (Expected Utility Theory) requires you to assign a value to the possible outcomes of a choice *before* you choose. But if the outcome changes the values you use to assign the value, you cannot rationally calculate the decision from your current standpoint. You would need to be your future self to decide whether to become your future self.

  ### 2. Boundaries: Unpredictable vs. Hard to Foresee
  You asked if the value change has to be strictly unpredictable.

  In Paul's framework, the boundary is **structural inaccessibility**, not just statistical uncertainty.
  *   **Hard to Foresee:** If you move to a new city and you're 80% sure you'll like the food but 20% sure you won't, that is standard risk. Your values (liking good food) remain constant; only the facts are uncertain.
  *   **Structurally Inaccessible:** In a transformative choice, you cannot simulate the future state. As you noted with the parenting example, the pre-parent self *cannot* run a simulation of the post-parent self's values because the mechanism that generates those values (the lived experience of parenthood) is missing.

  **The Boundary Line:** The term applies most strictly when the change in values is **constitutive** of the experience, not just a side effect. If you become a monk and learn to value silence, the valuing of silence is part of the monastic life itself. If you take a job and happen to get more cynical over time, that is likely just ordinary preference drift, not a transformative experience in the technical sense.

  ### 3. Distinction: Transformation vs. Adaptation (Sour Grapes)
  This is the trickiest part of the concept, and where your intuition about "convincing yourself it's fine" is vital.

  Philosophers distinguish **Transformative Experience** from **Adaptive Preferences** (often called "Sour Grapes," based on Aesop's fable, and analyzed by philosopher Jon Elster).

  *   **Adaptive Preference (Sour Grapes):** You want the grapes. You can't reach them. To reduce the pain of not having them, you unconsciously decide you didn't want them anyway. This is generally viewed as an irrational coping mechanism or a distortion of autonomy.
  *   **Transformative Experience:** You don't know if you want the grapes. You eat the grapes. The experience of eating them reveals a new capacity for valuing sweetness that you didn't know you had.

  **The Difference:**
  In adaptation, the value change is a *defense mechanism* to align desires with reality. In transformation, the value change is a *revelation* of a new reality.
  *   *Example of Adaptation:* You fail to get into med school, so you decide medicine is "too stressful" and you're "happier this way."
  *   *Example of Transformation:* You become a parent. You didn't fail at being child-free; you succeeded at parenting. The fact that sleep no longer matters isn't a coping mechanism to make the lack of sleep bearable; it is a fundamental reordering of your hierarchy of goods.

  **However:** The line is blurry. Critics of Paul argue that many "transformative" experiences are just post-hoc rationalizations (adaptation) dressed up as spiritual growth. Distinguishing between "I grew into a new self" and "I lied to myself to feel better" is notoriously difficult.

  ### 4. How to Think About It (If You Want to Move Beyond the Name)
  If you want to use this concept without getting bogged down in the philosophy, here is how to carve it off from neighboring ideas:

  1.  **Irreversibility of Perspective:** In normal learning, you add data to your existing model. In transformative experiences, you change the model itself. You cannot "un-see" the new values even if you regret the choice. (A regretful parent still usually values their child differently than they valued the *idea* of a child).
  2.  **The Authority Gap:** The pre-experience self has no authority to judge the post-experience self's values, *but* the post-experience self cannot retroactively authorize the decision (because they didn't exist yet).
  3.  **Non-Compensatory:** In normal trade-offs, you lose X to gain Y. In transformative choices, Y might make X irrelevant. You aren't trading sleep for joy; you are entering a state where sleep is no longer the currency of trade.

  ### 5. Confidence and Uncertainty Flags

  *   **High Confidence:** The term you are looking for is **"Transformative Experience"** (specifically the **Personally Transformative** variety) as defined by **L.A. Paul**. This is the standard contemporary philosophical label for the exact loop you described.
  *   **Medium Confidence:** The boundary between **Transformation** and **Adaptive Preference**. While philosophers distinguish them theoretically (revelation vs. rationalization), in practice, they are often indistinguishable from the inside. Even Paul acknowledges this is a major vulnerability in her theory.
  *   **Low Confidence/Shakiest Area:** The **Normative Solution**. Paul originally argued that you *cannot* make these decisions rationally (you have to leap). Later, she and others suggested you might decide based on "revealed preferences" or by valuing the *process* of transformation itself. There is no consensus on how a rational agent *should* handle this loop, only that the loop exists.

  ### Summary
  You have accurately identified **The Decision Problem for Transformative Experiences**.

  *   **Name:** Transformative Experience (L.A. Paul).
  *   **Core Mechanism:** Personal Transformation (value change) + Epistemic Transformation (knowledge change).
  *   **Key Distinction:** Unlike "Sour Grapes" (adaptation), the value change is constitutive of the new reality, not a defense against a lost one.
  *   **The Loop:** You cannot use Expected Utility Theory because the "Utility" function itself is rewritten by the choice.

  You are thinking about this exactly as a philosopher of decision theory would. The "loop" you feel is the recognized breakdown of standard rational choice models.
