answer: |-
  **Setting:** *A cramped, noisy café near campus. It is late afternoon. Empty espresso cups and a scattering of napkins covered in scribbled notes sit between MAYA and LEO. The conversation has clearly been running for a while.*

  **MAYA:** It's the phrase, Leo. That's all I'm saying. If Sam had said, "I've looked at the options, and I value healing people, and given my background, med school is the best way to do that," I wouldn't have a problem. But he didn't say that. He said, "This is just who I am." He spoke about his future as if it were already a fossil.

  **LEO:** You're parsing syntax like it's a criminal confession. "This is just who I am" is shorthand. It's narrative efficiency. We all speak like that. If I say, "I can't betray my friend, I'm just not that kind of person," am I in bad faith? Or am I expressing a commitment so deep it feels like identity?

  **MAYA:** That's exactly the trap. Sartre's point is that it *feels* like identity, but it isn't. It can't be. You are a consciousness, a nothingness, a hole in the world. You don't have a "kind of person" essence the way a paperknife has a purpose built into its steel. When Sam says he *is* a doctor-before-even-applying, he is pretending his facticity—his parents, his history—is a destiny. He's turning himself into an object to avoid the vertigo of choosing.

  **LEO:** But without that stability, without treating your past commitments as having weight, how do you act at all? Sartre makes authenticity sound like a perpetual revolution where every morning you have to reinvent the world ex nihilo. If Sam has to re-weigh the value of medicine every single day, never allowing his past to count as a reason, he'll never get out of bed. That's not freedom; that's paralysis.

  **MAYA:** It's not about ignoring the past. It's about how you hold it. In bad faith, you treat the past as a *cause*. In authenticity, you treat it as a *motive*. Sam is saying his family history *makes* him do this. "I come from a long line of doctors." As if the genes or the dinner table conversations are pulling the levers. He's hiding his freedom behind his facticity.

  **LEO:** Okay, but here is the problem with your diagnosis, Maya. You're claiming to see inside his consciousness. You're claiming to know that he is *fleeing* anguish. What if he isn't? What if he has already done the work? What if he stared into the void last year, realized he was free, and *then* chose to bind himself to this tradition? Once the choice is made, it naturally solidifies. If he walks around radiating existential angst every time he orders a textbook, is that more authentic? Or is it just performative?

  **MAYA:** *(Leans forward, tapping a napkin)* We can't see the anguish, no. But we can see the structure of the claim. Bad faith isn't necessarily a feeling of panic. It can be calm. It can be serene. The waiter in Sartre's example isn't sweating; he's playing at *being* a waiter too perfectly. Sam is playing at *being* a Scion of Doctors. The clue is in the rigidity. If I asked Sam, "Could you imagine being happy as a carpenter?" and he looks at me like I'm speaking alien, that's the tell. He's denying his transcendence. He's saying, "I *cannot* be a carpenter." But he *can*. He just won't.

  **LEO:** "Can" in what sense? Physically? Sure. But practically? Morally? We live by constraints we impose on ourselves. If I promise to meet you tomorrow, I say "I have to be there." Am I in bad faith? Technically, I could not be there. I could flee the country. But if I treat my promise as a binding fact, that's what integrity looks like. If Sam treats his family tradition as a binding fact, why is that self-deception? At what point does a value become strong enough that you're allowed to say "I have to"?

  **MAYA:** Because a promise is a project you undertake. You own the obligation. Sam is saying the obligation owns *him*. There's a subtle shift in agency. In bad faith, I say, "I had no choice." In authenticity, I say, "I chose this, and because I chose it, I now restrict my future options." Sam is skipping the "I chose this" part. He's landing straight on "This is me." He wants the comfort of necessity without the responsibility of election.

  **LEO:** But Maya, consider the epistemic gap. You and I are sitting here judging Sam. We are looking at his behavior and imputing a hidden mental state—fear of freedom. But behavior is ambiguous. The exact same action—applying to med school citing family tradition—could stem from terrified conformity *or* from a joyful reaffirmation of heritage. If the external signs are identical, how is "bad faith" not just a label we slap on choices we dislike?

  **MAYA:** It's not about the choice. It's about the ontology.

  **LEO:** But we don't have access to his ontology! We only have his words and deeds. If the concept of bad faith relies on a specific internal relationship to freedom that is invisible from the outside, then it's useless as a social critique. It becomes a ghost story. You can't prove Sam is in bad faith, and he can't prove he isn't. So what work is the concept doing?

  **MAYA:** It does work on *us*. That's the point. When I hear Sam speak, it tempts *me*. It offers me a way out. If Sam is a "Doctor" by essence, then maybe I am a "Philosopher" by essence. Maybe I don't have to worry about whether I'm good enough, or whether I should quit. Sam's bad faith is contagious. It invites me to collude in his unfreedom. So I call it out not to police his soul, but to protect my own. To remind myself that he is lying, even if he believes the lie.

  **LEO:** That's powerful, I'll grant you that. But it risks making authenticity impossible to sustain. If I say "I am a teacher," and you say, "No, you are a freedom pretending to be a teacher," you're undermining the very stability required to teach. Sartre seems to want us to live in a state of permanent fluidity. But human beings need to be things. We need to be "a doctor," "a partner," "a citizen." If acknowledging that is bad faith, then bad faith is the condition of living a functional life.

  **MAYA:** Or maybe functional life *is* the problem. Look, I'm not saying Sam shouldn't go to med school. I'm saying he should go as a free agent who knows he could leave. The danger is when the role consumes the person. When the "Doctor" eats the "Sam."

  **LEO:** But how do you maintain that awareness without it corroding the role? If I'm a surgeon, and I'm constantly reminding myself, "I am not essentially a surgeon, I am a nothingness choosing to cut flesh," will I be a better surgeon? Or will I be a distracted one? Maybe bad faith is a necessary fiction. A productive one. We wear masks until the mask fits. Is it really self-deception if the mask allows you to function in the world?

  **MAYA:** That's a pragmatic argument, Leo. It says, "Lie to yourself, it works better." Sartre would say that's the definition of the spirit of seriousness. Treating values as pre-existing things in the world rather than creations of your freedom. If we accept your view, then freedom is just a burden we should put down as soon as we find a comfortable chair.

  **LEO:** And if we accept your view, we're all condemned to be naked, shivering gods, terrified to sit in the chair because sitting implies we are "sitters." I think the distinction isn't between having an identity and not having one. It's between holding the identity lightly or heavily. But you can't see the weight from the outside.

  **MAYA:** No. You can't.

  *(A pause. The noise of the espresso machine hisses in the background.)*

  **LEO:** So we're back where we started. You think Sam is heavy. I think he's grounded. And neither of us can prove it.

  **MAYA:** Which means the diagnosis of bad faith is strictly first-personal. I can't tell Sam he's in bad faith. He has to feel the slip. He has to feel the moment where he turns himself into a thing.

  **LEO:** But if it's strictly first-personal, why were we arguing?

  **MAYA:** *(Smiles faintly)* Because I'm afraid. If Sam can do it—if he can successfully become an object—then maybe I can too. And I don't want to be an object. I want to be a wound that never heals. But watching him... it looks so peaceful.

  **LEO:** And I'm afraid that if I push him too hard on his freedom, I'll talk him out of the only thing that gives his life weight. We're not judging Sam, Maya. We're arguing about how much reality we can stand.

  **MAYA:** Maybe that's all the concept is good for. Not a gavel to strike down on others. But a mirror.

  **LEO:** Just don't expect Sam to look into it. He's already decided what he sees.

  **MAYA:** Exactly. And that certainty... that's the only proof I need.

  **LEO:** Or the only proof you *want*.

  *(Maya picks up her cup. It is empty. She holds it for a moment, turning it in her hand, before setting it back down.)*

  **MAYA:** Another coffee?

  **LEO:** Yeah. I'm not going anywhere.

  **MAYA:** *(Quietly)* See? You're choosing to stay.

  **LEO:** Or I'm just the kind of person who finishes the conversation.

  *(They look at each other. Neither smiles.)*
