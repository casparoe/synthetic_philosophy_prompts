answer: |-
  ### Desiderata for a Solution to the Frame Problem

  The following specifications distinguish between the **Representational Frame Problem** (RFP: how to formalize change) and the **Epistemological Frame Problem** (EFP: how a bounded agent identifies relevance). A candidate solution must declare which guise it addresses.

  #### 1. Default Persistence
  *   **Specification:** The formalism must entail that a fluent $F$ holds at time $t+1$ given that it held at $t$ and no action known to affect $F$ occurred, without requiring a specific axiom for the pair $(Action, F)$.
  *   **Argument:** Without this, the axiomatization grows quadratically with the number of fluents and actions ($O(A \times F)$), making representation impossible for complex domains.
  *   **Status:** **Non-Negotiable (Representational).** Any system requiring explicit frame axioms for non-changes fails the definition of the RFP.
  *   **Note:** This does not require non-monotonic logic. Successor-State Axioms (SSAs) in classical logic satisfy this.

  #### 2. The Yale Shooting Problem (YSP) and Model Selection
  *   **Specification:** In scenarios involving delayed effects (wait) and causal chains (load $\to$ wait $\to$ shoot), the system must entail the "intuitive" model (gun stays loaded, victim dies) and reject the "anomalous" model (gun unloads spontaneously, victim lives).
  *   **Argument:** Early non-monotonic formalisms allowed "abnormalities" to occur at any time point equally, making the anomalous model logically indistinguishable from the intended one. A solution must break this symmetry.
  *   **Mechanism:** This is typically achieved by **Chronological Minimization** (prefer abnormalities later in time) or **Causal Minimality** (prefer models with fewer causal interventions).
  *   **Status:** **Non-Negotiable (Representational).** If a system cannot distinguish between a causal chain and a spontaneous miracle, it cannot predict the future.

  #### 3. Defeasibility
  *   **Specification:** The system must allow conclusions derived from default persistence to be retracted upon receiving new information (e.g., learning the gun was wet), without rendering the knowledge base inconsistent. It must identify the *defeater* (the specific property that blocks the default), not just a contradiction.
  *   **Argument:** A monotonic system cannot handle the EFP because real agents operate with incomplete information. If new data forces a global inconsistency check, the system halts.
  *   **Status:** **Non-Negotiable (Epistemological).** A finite agent must update beliefs without recomputing the universe.

  #### 4. Ramifications and Qualifications
  *   **Specification:**
      *   *Ramifications:* Indirect effects (breaking a table breaks its leg) must be inferred without explicit axioms for every indirect consequence.
      *   *Qualifications:* Implicit preconditions (a car won't start if there is a potato in the tailpipe) must be representable without listing every possible preventing condition.
  *   **Argument:** The world is densely connected. Exhaustive enumeration of indirect effects and preconditions is impossible (the Qualification Problem is a sibling of the Frame Problem).
  *   **Status:** **Non-Negotiable (Representational).** A system that misses indirect effects is unsound; a system requiring exhaustive preconditions is unusable.

  #### 5. Relevance without Enumeration
  *   **Specification:** The agent must identify which facts in its database are relevant to an action's outcome or a query without iterating over all stored facts.
  *   **Argument:** This is the core of the EFP. If an agent must scan its entire knowledge base to verify that "the color of the wall" is irrelevant to "moving the cup," it is paralyzed by combinatorial explosion.
  *   **Status:** **Non-Negotiable (Epistemological).** *However*, many logical formalisms treat this as an implementation detail rather than a logical requirement. For a theory claiming to solve the *Frame Problem* (in the original sense of McCarthy & Hayes regarding finite agents), this is NN. For a purely semantic logic, it is a **Camp Preference**.
  *   **Critique:** I argue this is the only requirement that is genuinely **unsolved** in the general case. Most "solutions" to the Frame Problem solve RFP but punt on this.

  #### 6. Tractability
  *   **Specification:** Inference (projection, planning, or update) must be computable within polynomial time (or a bounded resource) relative to the size of the knowledge base.
  *   **Argument:** A bounded agent cannot wait for exponential-time theorem proving to conclude that the cup is still on the table.
  *   **Status:** **Camp Preference (Engineering/Robotics) vs. Non-Negotiable (EFP).** Theoretical logicians often accept intractability (e.g., second-order circumscription) as the price of correctness. However, for the EFP (finite agent), intractability is failure. I mark this **Non-Negotiable** for any solution claiming to address the *Epistemological* guise.

  #### 7. The Distinction Between the Two Guises
  *   **Specification:** The theory must explicitly separate the *ontology of change* (what persists) from the *algorithm of access* (what is checked).
  *   **Argument:** Conflating these leads to confusion where a logical solution (like SSAs) is claimed to solve the access problem, or an access heuristic is claimed to solve the logical problem.
  *   **Status:** **Non-Negotiable (Meta-Requirement).** Clarity is required to evaluate the other desiderata.

  ---

  ### Incompatibilities and No-Go Theorems

  You asked for the incompatibilities, not a synthesis. The Frame Problem persists precisely because the following sets of desiderata are jointly unsatisfiable or force severe compromises.

  #### 1. The Tractability-Relevance-Completeness Triangle
  *   **Conflict:** **Relevance without Enumeration** + **Tractability** + **Logical Completeness**.
  *   **Analysis:** To determine relevance without enumeration, you generally need an indexing scheme or a heuristic filter.
      *   If the filter is **tractable** (fast), it must be coarse-grained. It will let irrelevant facts through (noise) or, worse, block relevant facts (incompleteness).
      *   If the filter guarantees **completeness** (no relevant fact is missed), it must, in the worst case, inspect the structure of all facts to ensure no hidden dependency exists (e.g., a rule stating `WallColor(x) -> CupMoves` if `x` is red). This collapses back into **Enumeration**.
  *   **Verdict:** You cannot have a sound, complete relevance filter that is tractable for a general language. You must sacrifice completeness (risk missing a relevant fact) or tractability (slow down).

  #### 2. Default Persistence vs. Multiple Extensions (Defeasibility)
  *   **Conflict:** **Default Persistence** + **Defeasibility** + **Unique Model Selection (YSP)**.
  *   **Analysis:** Non-monotonic logics that handle defeasibility (like Default Logic) often generate **multiple extensions** (ambiguous valid worlds). The YSP requires selecting exactly *one* intended model.
      *   To force a unique model, you need a preference ordering (e.g., Chronological Minimization).
      *   However, Chronological Minimization can conflict with **Defeasibility**. If new information suggests an abnormality happened *earlier* than thought, chronological minimization may resist updating the past to preserve the "minimality" of the timeline, effectively making the system rigid against certain types of defeaters.
  *   **Verdict:** Systems that guarantee a unique model for YSP often lose flexibility in handling retrospective defeaters. Systems that handle flexible defeasibility often suffer from multiple extensions (ambiguity).

  #### 3. Ramifications vs. Default Persistence (The Interaction Problem)
  *   **Conflict:** **Ramifications** + **Default Persistence** + **Tractability**.
  *   **Analysis:** If $A$ causes $B$, and $B$ causes $C$ (ramification), does $C$ persist by default?
      *   If you treat $C$ as persisting by default, you might miss the fact that $B$ stopped holding, which should cease $C$.
      *   If you treat $C$ as dependent on $B$, you must check $B$'s status at every time step. In a dense causal network, checking the "support" for every fluent at every step approaches **Enumeration**.
  *   **Verdict:** Handling indirect effects efficiently without re-checking all preconditions at every time step is an open tension. Most solutions (like SSAs) require the ramifications to be compiled into the state description, which pushes the complexity into the representation phase.

  #### 4. The "Oracle" Requirement
  *   **Conflict:** **Relevance without Enumeration** + **No Oracle**.
  *   **Analysis:** To know that a fact is irrelevant without checking it, you effectively need meta-knowledge that says "This predicate is unrelated to that action." If the system must *derive* this independence from first principles, it must analyze the definitions of the predicates. If the definitions are arbitrary, independence is undecidable.
  *   **Verdict:** Any system that claims to solve Relevance without Enumeration implicitly assumes a structured vocabulary (an oracle of sorts) where independence is syntactically visible. If the language is unstructured, this requirement is impossible.

  ---

  ### Scorecard of Formalisms

  | Formalism | Default Persistence | YSP / Model Selection | Defeasibility | Ramifications / Qualifications | Relevance w/o Enum | Tractability | Distinction of Guises |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Situation Calculus (w/ SSAs)** | **Pass** (Classical logic solution) | **Pass** (Structural, not preferential) | **Fail** (Monotonic; requires explicit revision) | **Partial** (Requires manual compilation of SSAs) | **Fail** (Requires matching preconditions against state) | **Pass** (Regression is polynomial in plan length) | **Pass** (Clear separation) |
  | **Circumscription** | **Pass** (Minimizes abnormalities) | **Pass** (With Chronological Minimization) | **Pass** (Non-monotonic) | **Pass** (Can handle indirect effects) | **Fail** (No mechanism for access) | **Fail** (Second-order logic is intractable) | **Fail** (Conflates ontology with preference) |
  | **Default Logic** | **Pass** (Via defaults) | **Fail** (Originally yielded multiple extensions) | **Pass** (Core feature) | **Partial** (Complex to encode causality) | **Fail** (Search through extensions) | **Fail** (Extension finding is NP-Hard) | **Fail** (Often treats logic as computation) |
  | **Event Calculus** | **Pass** (Via persistence axioms) | **Pass** (With negation-as-failure) | **Pass** (Non-monotonic variants exist) | **Pass** (Good for continuous time/indirect) | **Fail** (Event matching can be expensive) | **Partial** (Abductive logic programming helps) | **Pass** (Distinguishes events from fluents) |

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding candidates is **Relevance without Enumeration (combined with Tractability)**.

  *   **Why:** Almost every logical formalism (Situation Calculus, Circumscription, Event Calculus) successfully solves the **Representational** Frame Problem (Default Persistence and YSP). They can write down the rules of change compactly and select the right model.
  *   **The Filter:** However, when held against the **Epistemological** requirement—that a *finite agent* must find the relevant facts without scanning the universe—almost all of them fail. They assume a theorem prover that has access to the whole database. They solve the problem of *what is true*, but not the problem of *what to look at*.
  *   **Conclusion:** If you accept **Relevance without Enumeration** and **Tractability** as Non-Negotiable for the Epistemological guise, **no existing general-purpose logical formalism solves the Frame Problem.** They solve the logic; they do not solve the access. This suggests the "solution" lies not in better logic, but in architectural constraints (modularity, indexing, attention mechanisms) that restrict the language itself to make relevance tractable.
