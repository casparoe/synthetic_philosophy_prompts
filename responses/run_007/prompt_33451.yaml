answer: |-
  ### The Convexity of Rationality: A Philosophical Reconstruction of Iterated Dominance

  The methodological practice of Iterated Deletion of Strictly Dominated Strategies (IDSDS) is one of the most durable tools in the game theorist's arsenal. It offers a solution concept that relies on minimal epistemic assumptions compared to Nash equilibrium, purportedly deriving predictions solely from the axiom of instrumental rationality. However, the standard formulation of dominance relies crucially on *mixed strategies*: a pure strategy is deemed dominated only if there exists a probability distribution over *other* pure strategies that yields a higher expected payoff against every profile of opponents' strategies.

  To reconstruct the philosophical commitments of this practice, we must first explicate the specific theoretical work performed by mixed strategies within the logic of dominance. Without mixed strategies, the set of undominated strategies can be unstable or empty in games without saddle points. Mathematically, introducing mixed strategies convexifies the payoff space. This ensures that the set of best responses is upper-hemi-continuous and non-empty (a prerequisite for Nash existence), but in the context of dominance, it serves a normative function: it expands the scope of rational criticism. If a player is restricted to pure strategies, they might appear rational simply because no single alternative pure strategy beats their current choice. By allowing mixtures, the analyst asserts that a rational agent has access to the *convex hull* of their actions. If a randomized plan beats a pure plan in every contingency, the pure plan is irrational, even if no other *pure* plan dominates it. Thus, mixed-strategy dominance transforms rationality from a pairwise comparison of discrete acts into an optimization problem over a continuous space of compound acts.

  With this function established, we can address the specific philosophical commitments embedded in the practice.

  #### (a) Ontic Randomization vs. Epistemic Uncertainty

  Does the reliance on mixed strategies in dominance definitions presuppose that players are capable of deliberate randomization (an ontic commitment), or is it merely a reflection of the opponent's uncertainty (an epistemic commitment)?

  The standard von Neumann-Morgenstern formulation suggests an ontic reading: the strategy space $\Delta(S_i)$ is the set of objects over which the agent maximizes utility. This implies the agent possesses, or can simulate, a randomization device. Philosophically, this is contentious. It attributes to agents a capacity for "mixed deliberation" that seems psychologically unrealistic for one-off decisions. Why would a rational agent flip a coin rather than choose the option they believe is best?

  However, for the specific purpose of *strict dominance*, the practice can sustain a purely epistemic reading. To say that pure strategy $s_i$ is strictly dominated by mixture $\sigma_i$ is to say that $s_i$ is never a best response to any belief the player might hold about the opponents. The mixture $\sigma_i$ need not be an act the player intends to perform; rather, it serves as a witness to the sub-optimality of $s_i$. If $\sigma_i$ yields higher payoffs everywhere, then for any probabilistic belief the player holds, the expected utility of $\sigma_i$ exceeds that of $s_i$. Consequently, $s_i$ cannot be rationalized by any belief.

  Therefore, the practice does not strictly presuppose that players *do* randomize deliberately. It presupposes that the *analyst* is permitted to model the player's choice set as convex. This is a commitment to the **linearity of preferences** (Expected Utility) rather than a commitment to ontic randomization. The mixing is a feature of the model's topology, ensuring that if a strategy is eliminable, it is eliminable regardless of the specific probabilistic beliefs held by the agent. The commitment is to the *availability* of compound acts, not necessarily their *execution*.

  #### (b) The Asymmetry of Strict and Weak Dominance

  The practice rigorously deletes strictly dominated strategies but standardly refuses to delete weakly dominated ones (where $u(s') \geq u(s)$ for all opponent profiles, with strict inequality for at least one). This asymmetry reveals a specific operationalization of rationality that is arguably incoherent without further epistemic qualifications.

  Strict dominance identifies strategies that are *never* optimal. Weak dominance identifies strategies that are *sometimes* optimal (specifically, when the opponents play the profiles where payoffs are equal) but never strictly better. The refusal to delete weakly dominated strategies presupposes that it is rational for a player to assign **probability zero** to the specific opponent profiles where the weakly dominating strategy yields a higher payoff.

  This creates a tension. If rationality entails maximizing expected utility, a weakly dominated strategy is only permissible if the player is certain the critical contingencies will not occur. However, in strategic interaction, such certainty is rarely justified. This is where the "trembling hand" refinement (Selten) exposes the fragility of the asymmetry. If we operationalize rationality to include a minimal doubt that opponents might make mistakes (assigning non-zero probability to all profiles), weak dominance collapses into strict dominance.

  Thus, the standard practice presupposes a **"hard" rationality** where agents can coherently hold beliefs that assign zero probability to feasible events. It treats the game form as a rigid logical structure rather than a noisy empirical environment. While mathematically coherent, it is epistemically fragile: it requires players to believe in the impossibility of events that are structurally possible. The asymmetry is maintained not because weakly dominated strategies are plausibly rational, but because deleting them requires stronger epistemic assumptions (like common belief in trembles) than the "minimalist" ethos of IDSDS typically wishes to admit.

  #### (c) Iteration, Common Belief, and Correlation

  Iterating the deletion process moves us from individual rationality to interactive epistemology. Does this presuppose Common Belief in Rationality (CBR)? And what does it imply about the correlation of beliefs?

  **Common Belief in Rationality:**
  Yes, iteration strictly presupposes CBR. For a player to delete a strategy in the second round, they must not only be rational themselves but must believe their opponents are rational (and thus will not play strategies deleted in round one). For the third round, they must believe that opponents believe they are rational, and so on. As shown by Brandenburger and Dekel, the set of strategies surviving IDSDS corresponds to those consistent with CBR. The practice therefore presupposes that rationality is not just a property of the agent, but a public fact embedded in the epistemic state of the group.

  **Correlation of Beliefs:**
  The issue of correlation is subtler. In two-player games, IDSDS yields the same predictions whether players believe opponents' strategies are correlated or independent. However, in games with $n > 2$ players, the practice implicitly **rules out correlation** in a player's beliefs about different opponents.

  This is a consequence of Pearce's Lemma (1984). IDSDS is equivalent to the set of **rationalizable strategies** only if players assume opponents' choices are independent. If players are allowed to believe that Opponent B's choice is correlated with Opponent C's choice (even without explicit communication), the set of surviving strategies is larger than the IDSDS set. By using IDSDS in $n$-player games, the analyst presupposes that players treat opponents as independent sources of uncertainty. This is a strong epistemic commitment: it assumes that the mere structure of the game prevents players from inferring correlations (e.g., through shared cultural norms or payoff structures) that would sustain strategies otherwise eliminated by IDSDS.

  #### (d) Counterfactual Foundations: Non-EU and Population Frequencies

  Finally, we must distinguish what the practice strictly presupposes from what it merely fits well with, by considering alternative foundations.

  **Replacing Expected Utility:**
  If Expected Utility (EU) theory is replaced by a non-linear theory of decision under uncertainty (e.g., Maxmin Expected Utility or Rank-Dependent Utility), the work of mixed strategies collapses. In EU, mixing convexifies the payoff space because $u(\alpha p + (1-\alpha)q) = \alpha u(p) + (1-\alpha)u(q)$. Without linearity, a mixture of two strategies might be valued *less* than either pure strategy (due to uncertainty aversion).
  *   *Consequence:* The definition of dominance would change. A strategy might not be dominated by any mixture even if it is dominated by a pure strategy, or vice versa. The philosophical commitment to IDSDS is thus inextricably linked to the **linearity of the utility functional**. Without EU, the "convexity of rationality" vanishes, and IDSDS loses its normative force as a comprehensive filter for irrationality.

  **Population-Level Frequencies:**
  If mixed strategies are interpreted not as individual beliefs/acts but as population frequencies (Evolutionary Game Theory), the philosophical commitments shift from epistemic to causal.
  *   *Consequence:* "Dominance" becomes "fitness." A strategy is dominated if a mutant population playing the mixture would invade and replace it. Iterated deletion becomes a dynamic process of selection over time.
  *   *Change:* This removes the need for CBR or high-order beliefs. Rationality is replaced by survival. However, it introduces a commitment to **dynamic stability** and large populations. In this view, IDSDS is not a logical deduction of what agents *must* think, but a prediction of what types *will remain*. The epistemic fragility of weak dominance (discussed in section b) is resolved differently: in evolutionary dynamics, weakly dominated strategies can persist due to drift or barriers, suggesting the economic practice of retaining them is descriptively more accurate in evolutionary contexts, even if normatively questionable for individuals.

  ### Conclusion

  The methodological practice of IDSDS with mixed-strategy dominance is not a neutral algorithm. It rests on a specific philosophical architecture:
  1.  **Ontologically**, it treats the strategy space as convex, prioritizing the *availability* of compound acts over the psychology of randomization.
  2.  **Normatively**, it relies on Expected Utility linearity to define the scope of dominance.
  3.  **Epistemically**, it presupposes Common Belief in Rationality and, in $n$-player games, the independence of beliefs across opponents.
  4.  **Methodologically**, its refusal to delete weakly dominated strategies reveals a commitment to "hard" zero-probability beliefs, prioritizing logical consistency over the robustness afforded by "trembles."

  The practice fits well with a view of agents as hyper-rational logicians operating in a vacuum of independent uncertainty. If we relax the EU assumption or adopt an evolutionary stance, the justification for mixed-strategy dominance and its iterative application requires fundamental reconstruction, shifting from a logic of belief to a logic of selection or a logic of ambiguity.
