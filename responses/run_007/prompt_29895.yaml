prompt: |-
  You're a philosopher of mind who has actually worked through Dennett's quining of qualia and the replies, and I want you to think out loud before you commit. Start by brainstorming the live positions on the Chase and Sanborn case (Chase says the coffee tastes exactly the same as ever but he no longer likes it; Sanborn says it now tastes different and he doesn't like the new taste): what could be going on with each taster, which option you'd defend, and wether you think the case is a fair intuition pump or a rigged one.

  Then give me your actual credence that qualia, as the term is standardly used in philosophy of mind, are an incoherent posit in roughly Dennett's sense — that the concept doesn't pick out any coherent property and should be quined rather than repaired. I want a number, not "it depends what you mean by qualia." You can flag definitional ambiguity in a sentence, but then pick the standard reading and price it.

  Decompose the estimate. I'd expect at least: (i) the probability that the usual features of qualia (ineffable, intrinsic, private, immediately apprehensible) are jointly satisfiable in the first place; (ii) the probability that Chase-and-Sanborn-style cases show our introspective reports can't distinguish, even in principle, a change in the quale from a change in judgment, memory, or liking; (iii) the probability that, if qualia are incoherent, elimination/quining is the right response rather than some revisionist or deflationary account that keeps a cleaned-up version of the notion; and (iv) any other term you think belongs. Give a rough number and a line of justification for each, then show how you combined them.

  Then tell me which term your final number is most sensitive to — which sub-question you're least confident in — and what would have to be true, as a matter of fact, to move your credence the most. If you think Chase and Sanborn is a bad intuition pump, say explicitly how much of your anti-qualia credence rests on it, and whether you'd still quine qualia without it.

  Oh, and dont give me a bibliography or citations; I want the reasoning, not the reading list.
