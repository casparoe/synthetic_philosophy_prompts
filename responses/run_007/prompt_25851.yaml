answer: |-
  ### Exam Question

  **Question 1 (25 Marks)**

  Spectrum arguments are often presented as a unified threat to the transitivity of the 'all things considered better than' relation. However, one might distinguish between a **Sorites-style** spectrum argument (which relies on the claim that sufficiently small differences cannot affect value) and a **Tradeoff-style** spectrum argument (which relies on the claim that losses in one dimension of value can be compensated by gains in another).

  Evaluate the relationship between these two argumentative structures. Do they stand or fall together? In your answer, reconstruct the distinct logical pressure each exerts on transitivity and explain what hangs on the answer for attempts to save transitivity (e.g., via lexical views or sharp boundaries).

  ***

  ### Model Answer

  The transitivity of 'better than' states that if A is better than B, and B is better than C, then A must be better than C. Spectrum arguments challenge this by constructing a sequence of outcomes $A, B, C… Z$, where each adjacent pair seems to satisfy the 'better than' relation, yet the endpoints ($A$ and $Z$) intuitively reverse the relation (e.g., $Z$ is better than $A$). If transitivity holds, the chain implies $A$ is better than $Z$; if the intuition that $Z$ is better than $A$ holds, transitivity fails. While often lumped together, the Sorites-style and Tradeoff-style spectrum arguments exert distinct logical pressures and do not necessarily stand or fall together.

  The Sorites-style argument, prominent in Temkin's work, leans on the principle of **insignificance**. It posits that between any two adjacent items in the spectrum, the difference is too small to matter normatively. If A is only marginally better than B, and B than C, the accumulation of these marginal gains should not result in a reversal. The force here is phenomenological and vagueness-based: human valuation appears continuous, and drawing a sharp line where "better than" stops seems arbitrary. The threat to transitivity arises because we are compelled to affirm $A > B$, $B > C$, etc., due to the lack of a salient difference, yet we deny $A > Z$.

  In contrast, the Tradeoff-style argument, often associated with Parfit's work on the Repugnant Conclusion, leans on **compensability across dimensions**. Here, the spectrum involves shifting weights between distinct values (e.g., quality of life vs. population size, or intensity vs. duration). A is better than B not because the difference is small, but because a loss in quality is compensated by a gain in quantity. The chain moves from high quality/low quantity to low quality/high quantity. The threat to transitivity here is not about vagueness, but about the structure of value itself. It suggests that value is aggregative and that no dimension is lexically superior.

  Do these arguments stand or fall together? A strong case can be made that they do not. The Sorites argument is vulnerable to **epistemicism** or **sharp boundary** views. One can maintain transitivity by insisting that there *is* a precise point in the spectrum where $A_n$ is better than $A_{n+1}$, but $A_{n+1}$ is not better than $A_{n+2}$, even if we cannot perceive it. This saves transitivity by rejecting the premise that small differences cannot matter; it asserts they *must* matter eventually to avoid contradiction.

  However, this move fails against the Tradeoff argument. If the move from A to B involves a genuine tradeoff (e.g., slightly less pleasure for significantly more people), asserting a "sharp boundary" where compensation suddenly becomes impossible looks less like epistemic humility and more like an ad hoc interruption of value. To defeat the Tradeoff argument, one typically needs a **lexical view** (e.g., quality is infinitely more important than quantity above a certain threshold). This is a substantive claim about value structure, not merely a claim about vagueness. Therefore, one could consistently accept sharp boundaries to solve the Sorites version (saving transitivity) while accepting the Tradeoff version (denying transitivity or accepting the Repugnant Conclusion). They rely on different premises: one on the continuity of perception, the other on the commensurability of values.

  What hangs on this distinction is the strategy for saving transitivity. If the arguments stand together, a single solution (like denying transitivity) solves both. If they come apart, we need a hybrid meta-ethical approach. If we treat the Sorites argument as a problem of vagueness, we might save transitivity by refining our concepts. But if we treat the Tradeoff argument as a problem of lexicality, saving transitivity requires substantive axiological commitments (e.g., asserting that some values are incomparable). Confusing the two leads to diagnostic errors: applying a "sharp boundary" solution to a tradeoff problem fails to explain *why* compensation stops working. Thus, recognizing the distinction is crucial for determining whether the failure of transitivity is a logical artifact of vagueness or a genuine feature of multidimensional value.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Grade A (21–25 Marks): Excellent**
  *   **Reconstruction (5 marks):** Clearly defines transitivity and accurately reconstructs both the Sorites-style (insignificance/vagueness) and Tradeoff-style (compensability/dimensions) arguments.
  *   **Distinction (10 marks):** Explicitly identifies the structural difference: Sorites relies on *continuity/perception*, Tradeoff relies on *commensurability/lexicality*.
  *   **Evaluation (5 marks):** Argues persuasively that they do *not* necessarily stand or fall together. Explains why a solution for one (sharp boundaries) may not work for the other (requires lexical thresholds).
  *   **Implications (5 marks):** Clearly articulates the stakes: saving transitivity requires different tools for each (conceptual refinement vs. substantive value theory).

  **Grade B (16–20 Marks): Good**
  *   **Reconstruction (5 marks):** Defines transitivity and describes both arguments correctly.
  *   **Distinction (5 marks):** Identifies that the arguments are different (e.g., mentions "small differences" vs. "quality/quantity") but may not fully articulate the underlying logical pressure (vagueness vs. compensability).
  *   **Evaluation (5 marks):** Takes a stance on whether they stand or fall together, but the reasoning is somewhat standard or lacks the nuance regarding *why* solutions might not transfer (e.g., mentions lexicality but doesn't explain why it doesn't solve Sorites).
  *   **Implications (5 marks):** Discusses implications, but they may be general (e.g., "transitivity is hard to save") rather than specific to the distinction drawn.

  **Grade C (11–15 Marks): Satisfactory**
  *   **Reconstruction (5 marks):** Defines transitivity. Describes *a* spectrum argument well, but may conflate the two types or treat them as identical.
  *   **Distinction (0–5 marks):** Minimal distinction made between Sorites and Tradeoff styles; treats the prompt as a request to summarize Temkin/Parfit generally.
  *   **Evaluation (0–5 marks):** States whether they stand or fall together but offers little argumentative support.
  *   **Implications (0–5 marks):** Vague discussion of why transitivity matters; fails to connect the distinction to specific solutions (lexicality/boundaries).

  **Grade D/F (0–10 Marks): Fail**
  *   **Content:** Significant misunderstandings of transitivity or the spectrum argument.
  *   **Focus:** Purely summarizes readings without addressing the specific prompt about the *relationship* between the two argument types.
  *   **Structure:** Disorganized or significantly under word count.
