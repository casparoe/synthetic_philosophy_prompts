      *   *Point 3: A thermostat literally has a mind/beliefs just as real as ours.*
          *   **Dennett:** Dennett *does* say we can take the intentional stance toward a thermostat. However, he usually distinguishes between *simple* systems where the stance is trivial/uninformative and *complex* systems where it's necessary. He often hesitates to call a thermostat a "believer" in the full sense because the "pattern" is too thin.
          *   **Kid's Claim:** Thermostat belief is *just as real* as ours.
          *   **Nuance:** Dennett emphasizes degrees of intentionality. A thermostat is a "zero-order" or very low-level intentional system. Humans are higher-order. The *reality* of the belief depends on the robustness of the pattern.
