prompt: |-
  I'm giving a talk to a mixed seminar — mostly historians of graphic design and a couple of philosophers of language who work on depiction, both broadly Goodmanian — defending a Neurathian line: there's no such thing as a self-evident picture, ISOTYPE signs only work because they're a deliberately standardized, taught visual vocabulary, and the picture part of a picture language is doing much less of the semantic work than the system's designers claimed. My argument leans on Neurath's actual ISOTYPE practice, how symbols get defined, combined, and taught, not on any general theory of depiction. Draft me a Q&A prep sheet: the seven or eight objections I'll actually get from this crowd, not from Neurath specialists, ordered by how likely and how damaging they are, each phrased the way a design historian or a philosopher of depiction would put it, with a two-minute reply and a note on where there reply is soft. Include the question I'm hoping nobody asks.
