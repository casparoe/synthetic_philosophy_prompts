prompt: |-
  I recently sat in on a metaethics seminar where two graduate students got into a long argument about the Frege–Geach problem, and I've been turning it over in my head ever since. I'd like you to adjudicate their exchange.

  The first student, Elena, opened by saying that the Frege–Geach problem remains fatal to expressivism, and that the last forty years of responses have been a series of increasingly elaborate epicycles. Her core claim: expressivism says moral judgments like "lying is wrong" express non-cognitive attitudes — disapproval, say — rather than beliefs. But in an unasserted context like the antecedent of "If lying is wrong, then getting your little brother to lie is wrong," the speaker does not express disapproval of lying. So the meaning of "lying is wrong" differs between the two occurrences, which means the argument form "lying is wrong; if lying is wrong, then getting your brother to lie is wrong; therefore, getting your brother to lie is wrong" is equivocal — and modus ponens fails. Since competent moral reasoners plainly do make valid inferences of this form, expressivism is false.

  The second student, David, replied that this is the problem statement, not a refutation. Blackburn's solution, he said, is that the conditional as a whole expresses a single higher-order attitude: disapproval of simultaneously disapproving of lying while failing to disapprove of getting your brother to lie. The attitude expressed by "lying is wrong" is the same in both contexts; what changes is the role it plays in the larger attitude expressed by the conditional. So there is no equivocation, and the inference is valid because anyone who holds the attitudes expressed by the premises but fails to hold the attitude expressed by the conclusion is in a state of attitudinal inconsistency — which is the expressivist's analogue of logical contradiction.

  Elena answered that this just relocates the problem. Attitudinal inconsistency is not the same as logical inconsistency, she said, and the expressivist owes us an account of why the particular inconsistency Blackburn identifies counts as a logical mistake rather than a mere psychological clash. She then said that Gibbard's norm-expressivism fares no better: Gibbard treats moral judgments as expressing acceptance of systems of norms, but once you've built enough structure into your "systems of norms" to support genuine logical inference, you've effectively reintroduced representational content, and the view collapses into a kind of descriptivism.

  David pushed back: that collapse argument only works against pure expressivism, and pure expressivism is a strawman. The interesting views, he said, are hybrid: they grant that moral judgments have both a belief-like component and an expressive component. The Frege–Geach problem is fatal only if you insist that moral language does nothing but express attitudes. Once you admit that it also represents, the logical behavior of moral terms in embedded contexts is handled by the representational component, and the expressive component does its work elsewhere — in accounting for motivation, for instance. The Frege–Geach problem, on this view, rules out pure expressivism but leaves hybrid views untouched.

  Elena replied that this is a Pyrrhic victory. If the representational component handles all the logical work, then the expressive component is idle with respect to inference, and the hybrid expressivist has no answer to the question: what exactly does the expressive component add that couldn't be captured by a purely representational account paired with a separate theory of moral motivation? She said the Frege–Geach problem doesn't kill hybrid views outright, but it forces them into a dilemma: either the expressive component contributes to the logic of moral discourse (in which case the original problem recurs), or it doesn't (in which case it's redundant).

  At this point the seminar ended, and I never got to hear a resolution. I'd like you to go through their exchange move by move and tell me who is right about what, and whether either of them has the better overall case. I'm particularly interested in Elena's final dilemma for hybrid views: does it land, or is there a way for the hybrid expressivist to slip between its horns?
reasoning: |-
  Here's a thinking process that leads to the adjudication of the seminar exchange:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two graduate students (Elena and David) about the Frege-Geach problem and expressivism.
      *   **Context:** A metaethics seminar.
      *   **Key Issue:** The Frege-Geach problem (embedding problem) for expressivism, Blackburn's quasi-realism, Gibbard's norm-expressivism, and hybrid expressivism.
      *   **Specific Focus:** Evaluate their moves move-by-move and specifically assess Elena's final dilemma for hybrid views.
      *   **Goal:** Determine who is right about what and who has the better overall case.

  2.  **Deconstruct the Debate (Move-by-Move Analysis):**

      *   **Move 1: Elena's Opening (The Problem Statement)**
          *   *Claim:* Expressivism says "lying is wrong" = expressing disapproval. In "If lying is wrong...", no disapproval is expressed. Therefore, meaning shifts (equivocation). Modus ponens fails. Expressivism is false.
          *   *Assessment:* This is the classic formulation of the Frege-Geach problem (originally by Geach, developed by Searle/others). It accurately captures the *challenge*. Is it a *refutation*? Not yet, it's the *explanandum*. She claims it's "fatal," which is the point in contention.
          *   *Verdict:* Accurate statement of the problem. Premature to call it a definitive refutation without considering responses.

      *   **Move 2: David's Reply (Blackburn's Quasi-Realism)**
          *   *Claim:* This is the problem, not the refutation. Blackburn's solution: Conditionals express higher-order attitudes (disapproval of a clash of attitudes). "Lying is wrong" has the same meaning/attitude type; it just plays a different role. Validity = attitudinal inconsistency.
          *   *Assessment:* Accurate summary of Blackburn's *Spreading the Word* account. He correctly identifies that expressivists redefine validity in terms of consistency of attitudes rather than truth-preservation (initially).
          *   *Verdict:* Strong reply. Correctly notes that the problem is a hurdle, not necessarily a wall.

      *   **Move 3: Elena's Counter (The Logical Consistency Objection & Gibbard)**
          *   *Claim:* Attitudinal inconsistency $\neq$ Logical inconsistency. Why is Blackburn's clash a *logical* mistake? Also, Gibbard's norm-expressivism collapses into descriptivism if it builds enough structure to handle logic.
          *   *Assessment:* This is the "Logical Problem" or "Negation Problem" (Schroeder's refinement comes later, but this is the gist). The core issue: Logic is traditionally truth-conditional. If expressivism rejects truth-conditions, can it really capture *logic*? The Gibbard point is the "Collapse Objection" (often associated with Zangwill or early critics of Gibbard).
          *   *Verdict:* Very strong point. This is widely considered the hardest part of the Frege-Geach problem for quasi-realists. The distinction between "being in a clashing state of mind" and "committing a logical error" is crucial.

      *   **Move 4: David's Pushback (Hybrid Expressivism)**
          *   *Claim:* Pure expressivism is a strawman. Hybrid views (e.g., Ridge, Copp) have a belief component (representational) and a desire/attitude component. The belief component handles logic/embedding. The attitude component handles motivation. Frege-Geach only kills *pure* expressivism.
          *   *Assessment:* Accurate description of Hybrid Expressivism (Ecumenical Expressivism). It does solve the embedding problem by offloading the semantic work to the cognitive/belief-like content.
          *   *Verdict:* Plausible move. Hybrids do avoid the *technical* semantic problem of embedding.

      *   **Move 5: Elena's Final Dilemma (The Redundancy Objection)**
          *   *Claim:* If the representational part does the logic, what does the expressive part do? If it doesn't contribute to logic, it's redundant (could be handled by a separate motivation theory). If it *does* contribute, the original problem recurs. Pyrrhic victory.
          *   *Assessment:* This is the "Queerness" or "Redundancy" objection applied to hybrids. It challenges the *theoretical utility* of the view.
          *   *Verdict:* This is the crux. Does it land?

  3.  **Evaluate the Core Philosophical Issues:**

      *   **The Frege-Geach Problem:** It is indeed the biggest challenge for expressivism. Elena is right that it's severe. David is right that it's not an immediate *reductio* if you have a solution.
      *   **Blackburn's Solution:** Elena is right to press on the nature of "validity." Blackburn later moved towards a deflationary truth theory to handle this. David's summary is a bit simplified (Blackburn doesn't just say "it's inconsistency," he tries to mimic truth-conditions), but the core tension Elena identifies is real. The "Schroeder objection" (2008) regarding negation is the modern version of Elena's worry here.
      *   **Gibbard/Collapse:** Elena's claim that Gibbard collapses is a standard objection, but Gibbard argues that "norms" aren't "facts." Whether this succeeds is debated, but Elena's characterization is fair game.
      *   **Hybrid Expressivism:** David is right that hybrids solve the *semantic* embedding problem.
      *   **Elena's Dilemma:** This is the most sophisticated move.
          *   *Horn 1:* Expressive component contributes to logic $\rightarrow$ Frege-Geach returns.
          *   *Horn 2:* Expressive component doesn't contribute $\rightarrow$ It's redundant/otiose.
          *   *Counter-argument for Hybrids:* Hybrids (like Michael Ridge) argue the expressive component *does* have a function distinct from logic: it explains the *internalism* of moral judgments (the necessary connection to motivation) without requiring the belief component to do that work. A pure descriptivist needs an extra bridge principle to explain why moral beliefs motivate. The hybrid builds it into the semantics. So, it's not redundant; it's doing the work of explaining moral motivation/internalism, which the representational component *alone* cannot do.
          *   *Assessment:* Elena's dilemma assumes the only job of semantics is logic/truth. If the job of semantics also includes explaining action-guidingness, the expressive component isn't redundant. However, she might reply that a *pragmatic* account of motivation is cheaper than a *semantic* one.

  4.  **Synthesize the Adjudication:**

      *   **Tone:** Academic, balanced, authoritative but acknowledging ongoing debate.
      *   **Structure:**
          1.  Introduction (Acknowledge the quality of the debate).
          2.  Move-by-Move Analysis (Scorecard).
          3.  Deep Dive on the Final Dilemma (The specific request).
          4.  Overall Verdict (Who won?).
      *   **Key Insight:** Elena wins on the technical pressure on *pure* expressivism (Blackburn/Gibbard). David wins on the viability of *hybrid* views escaping the *semantic* trap. Elena's final dilemma is powerful but arguably misses the specific theoretical motivation for hybrids (explaining internalism).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Blackburn point:* Need to mention that Blackburn evolved his view (quasi-realism aims to *earn the right* to talk of truth). Elena's critique anticipates Schroeder.
      *   *Refining the Hybrid point:* Need to distinguish between *semantic* redundancy and *theoretical* redundancy. Hybrids claim pure descriptivism fails to capture the *nature* of moral thought, not just its logic.
      *   *Refining the Dilemma:* Does the expressive component contribute to logic? Hybrids say "No, the cognitive content does." Does that make it redundant? Hybrids say "No, because cognitive content doesn't motivate." Elena says "Pragmatics can handle motivation." This is the stalemate.

  6.  **Final Polish:** Ensure clear headings. Make sure the distinction between "pure" and "hybrid" expressivism is clear. Address the specific question about the dilemma landing. (Self-Correction: Don't declare a definitive "winner" as if philosophy is solved, but evaluate the strength of arguments based on current consensus.)

      *   *Consensus Check:* Most metaethicists agree Frege-Geach killed *naive* expressivism. Quasi-realism is respected but controversial (Schroeder's critique is weighty). Hybrid expressivism is a live option but faces the "two problems" objection (solving one might create another). Elena's dilemma is a version of the "problem of many problems" or the objection that hybrids are unstable.

  7.  **Final Output Structure:**
      *   Introduction.
      *   Round-by-Round Analysis.
      *   The Crucial Question: Elena's Dilemma.
      *   Overall Verdict.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is an exceptionally high-quality exchange. Both students demonstrate a firm grasp of the metaethical landscape, moving from the classic formulation of the problem to quasi-realism, and finally to the contemporary hybrid frontier.

  To adjudicate this, I will break down their exchange move-by-move, assessing the accuracy and philosophical strength of each claim, before focusing on your specific interest: Elena's final dilemma for hybrid expressivism.

  ### Round-by-Round Analysis

  **Move 1: Elena's Opening (The Classic Formulation)**
  *   **Assessment:** **Accurate but Premature.**
  *   **Analysis:** Elena correctly states the Frege–Geach problem as originally formulated by Peter Geach and John Searle. She is right that if moral sentences shift meaning between asserted and unasserted contexts (the "embedding" problem), then moral arguments commit the fallacy of equivocation, and modus ponens fails.
  *   **Critique:** Her claim that this is *fatal* is the point in contention, not an established fact. She treats the problem as a refutation rather than a challenge to be met. However, as an opening salvo, her characterization of the stakes is correct: if expressivism cannot solve this, it cannot account for moral reasoning.

  **Move 2: David's Reply (Blackburn's Quasi-Realism)**
  *   **Assessment:** **Strong Defense.**
  *   **Analysis:** David is correct that the problem statement is not a refutation. His summary of Simon Blackburn's solution in *Spreading the Word* is accurate. Blackburn argues that we can define validity not by truth-preservation (which expressivists initially reject) but by the consistency of attitudes. If you disapprove of lying, and you disapprove of (disapproving of lying without disapproving of getting your brother to lie), you are rationally required to disapprove of getting your brother to lie.
  *   **Critique:** David captures the "quasi-realist" ambition: to mimic realist discourse (including logic) without realist ontology. He successfully defends the coherence of the view against the charge of simple equivocation.

  **Move 3: Elena's Counter (The Logical Consistency & Collapse Objections)**
  *   **Assessment:** **Very Strong (The "Schroeder" Point).**
  *   **Analysis:** This is Elena's strongest move. She identifies the weakness in Blackburn's early account: *Attitudinal inconsistency is not logical inconsistency.* Logic is traditionally about truth and falsity, not psychological clashes. Mark Schroeder (in *Slaves of the Passions*) later refined this into the "Negation Problem," showing that Blackburn's higher-order attitudes struggle to distinguish between different types of inconsistent states.
  *   **The Gibbard Point:** Elena's claim about Gibbard is also a standard and serious objection. If Gibbard's "norms" have enough structure to behave like propositions in logical inference, critics argue they begin to look suspiciously like truth-apt beliefs. This is the "Collapse Objection."
  *   **Verdict:** Elena wins this round. She correctly identifies that quasi-realism faces a steep burden in explaining why attitudinal clash counts as *logical* error without secretly reintroducing truth-conditions.

  **Move 4: David's Pushback (Hybrid Expressivism)**
  *   **Assessment:** **Strategically Sound.**
  *   **Analysis:** David pivots to Hybrid Expressivism (associated with Michael Ridge, Dan Copp, etc.). He is right that this view dissolves the technical Frege–Geach problem. By positing that moral judgments express *both* a belief (representational content) and an attitude (expressive content), the belief component handles the logic and embedding. "If lying is wrong..." embeds the belief content, preserving univocality.
  *   **Verdict:** David is correct that the Frege–Geach problem does not kill hybrid views in the same way it threatens pure expressivism. The semantic work is offloaded to the cognitive component.

  **Move 5: Elena's Final Dilemma (The Redundancy Objection)**
  *   **Assessment:** **Powerful, but potentially avoidable.**
  *   **Analysis:** Elena argues that if the belief component does the logical work, the expressive component is either logically active (returning the original problem) or logically idle (making it redundant).
  *   **Verdict:** This is the crux of the matter. See the deep dive below.

  ---

  ### Deep Dive: Does Elena's Dilemma Land?

  Elena's dilemma is a version of the **"Instability Objection"** against hybrid views. It asks: *If you have a belief component that handles truth and logic, why do you need an expressive component at all?*

  **Horn 1: The Expressive Component Contributes to Logic**
  If the expressive part of the meaning contributes to the truth-conditions or logical inference, then the view faces the Frege–Geach problem again. How does an attitude embed in a conditional?
  *   **Hybrid Response:** Hybrid expressivists typically deny this horn. They argue the expressive component is *not* part of the truth-conditional content. It is a separate dimension of meaning (like the difference between "He is alone" and "He is lonely"). Therefore, the Frege–Geach problem does not recur because the logic is handled entirely by the belief component.

  **Horn 2: The Expressive Component is Redundant**
  If the expressive component doesn't do logical work, Elena claims it is idle. Why not just be a descriptivist (moral judgments are just beliefs) and add a separate theory of motivation (e.g., Humean psychology explains why those beliefs move us)?
  *   **Hybrid Response:** This is where Elena's dilemma is most vulnerable. Hybrid expressivists argue the expressive component is **not redundant** because it solves the **Internalism Problem**.
      *   *Pure Descriptivism:* If moral judgments are just beliefs, why do they necessarily motivate? (The Amoralist Problem). A descriptivist must add a bridge principle (e.g., "Rational agents desire the good").
      *   *Hybrid Expressivism:* The connection to motivation is built into the *semantics*. To judge that "lying is wrong" just *is* (in part) to have a con-attitude toward lying. You don't need a bridge principle.
  *   **Adjudication:** Elena claims this is a "Pyrrhic victory." She suggests a descriptivist + separate motivation theory is theoretically cheaper. However, many metaethicists argue that building internalism into the semantics is a theoretical *virtue*, not a vice, because it better captures the phenomenology of moral experience (the "ought" feels action-guiding).

  **Does the Dilemma Land?**
  It lands **partially**. It successfully shows that hybrid expressivism is a complex, high-maintenance view. It forces the hybridist to walk a tightrope: they must keep the two components distinct enough to avoid Frege–Geach, but integrated enough to avoid redundancy.
  However, it does **not** prove the expressive component is *strictly* redundant. It does unique work: it explains the necessary connection between moral judgment and motivation without relying on contingent psychological generalizations. Elena is right that this work is not *logical* work, but she is arguably wrong to imply that *only* logical work justifies a semantic component.

  ---

  ### Overall Verdict

  **Who is right about what?**
  *   **Elena** is right that the Frege–Geach problem is fatal to *naive* or *pure* expressivism (like early Ayer or Stevenson) unless significantly modified. She is also right that Blackburn's quasi-realism faces a serious challenge in defining "validity" without truth-conditions.
  *   **David** is right that the problem is not an immediate *reductio* and that quasi-realism offers a sophisticated (if controversial) solution. He is also right that Hybrid Expressivism technically solves the embedding problem.

  **Who has the better overall case?**
  **Elena has the stronger dialectical position, but David holds the more viable long-term view.**

  *   **Elena** wins on **theoretical pressure**. Her final dilemma highlights the fragility of hybrid views. If the expressive component is semantically inert regarding logic, it invites the question of why it is part of the *meaning* rather than just a pragmatic effect. This is a live debate in contemporary metaethics (the "Semantic vs. Pragmatic" debate).
  *   **David** wins on **survivability**. Pure expressivism is largely considered untenable by most contemporary specialists precisely for the reasons Elena outlines. However, Hybrid Expressivism (David's fallback) is currently one of the most popular positions in the field. It survives Elena's dilemma by arguing that semantics should explain more than just logic; it should also explain action-guidingness.

  **Resolution:**
  The seminar ended without a resolution because **there isn't one yet.**
  Elena's dilemma forces David to clarify *why* the expressive component is semantic. If David replies, "Because moral judgments are inherently motivating," Elena will reply, "That's a psychological fact, not a semantic one." If David replies, "Because the motivation is part of the truth-conditions," Elena will reply, "Then you're a descriptivist."

  **Final Ruling:**
  Elena is the better critic; David is the better defender of a live research program. Elena correctly identifies that Hybrid Expressivism buys its solution to Frege–Geach at the cost of theoretical complexity and potential instability. However, David is correct that this cost is worth paying to preserve the insight that moral language is both fact-stating and action-guiding. Elena's dilemma does not kill hybrid expressivism, but it correctly identifies its primary vulnerability: the risk of becoming a "two-name theory" (one name for the belief, one for the desire) that lacks unity.

  If you had to bet on which view survives the next forty years of "epicycles," the smart money is on a refined version of David's hybrid view, but it will have to incorporate Elena's warning to ensure the two components don't drift apart.
