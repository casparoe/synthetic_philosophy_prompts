  Here is a decision tree built from the logical space of the debate. It prioritizes the commitments implied by answers to specific cases over the labels philosophers use.

  ### The Functions Decision Tree

  **Node 1: Conceptual Monism**
  When biologists ask "What is the function?" (proper function) and "What does it do?" (causal capacity), are they asking two different, equally legitimate questions, or is one of these questions mistaken/reducible to the other?
  *   **Two legitimate questions:** Go to **Leaf A (Pluralist)**.
  *   **One true question:** Go to **Node 2**.

  **Node 2: Normativity (The Diseased Heart)**
  Consider a heart with a congenital defect that makes it *physically unable* to pump blood. Does it still have the *function* to pump blood?
  *   **No:** (Function requires capacity/contribution). Go to **Node 3**.
  *   **Yes:** (Function is normative/proper). Go to **Node 5**.

  **Node 3: System Relativity (The Heart Sound)**
  Consider a normal heart. It pumps blood and it makes a thumping sound. Are both of these effects legitimate "functions" of the heart, depending on which containing system (circulatory vs. auditory) you analyze?
  *   **Yes:** Go to **Node 4**.
  *   **No:** (Only one is the function). Go to **Node 4**.
      *(Note: This node separates the 'permissive' from 'restrictive' non-normative views, though both land in the same logical quadrant.)*

  **Node 4: Time Orientation (De Novo Mutation)**
  Consider a *de novo* mutation that immediately aids survival but has no selection history. Does it have a function?
  *   **Yes:** Go to **Leaf B (Propensity/Forward-Looking)**.
  *   **No:** Go to **Leaf C (Causal Role / Cummins-style)**.
      *(Note: This split is subtle; Cummins usually allows de novo functions if they contribute to a capacity, whereas Propensity views ground it in future survival chances. If you said "No" to History but "No" to De Novo, your position is likely incoherent.)*

  **Node 5: History Requirement (De Novo Mutation)**
  Consider a *de novo* mutation that immediately aids survival but has no selection history. Does it have a *proper* function?
  *   **Yes:** (History not required). Go to **Node 6**.
  *   **No:** (History required). Go to **Node 7**.

  **Node 6: Systemic Closure (Organizational Check)**
  If history isn't required, does the trait need to contribute to the *self-maintenance* of the specific system containing it, or just to general survival propensity?
  *   **Self-Maintenance:** Go to **Leaf D (Organizational)**.
  *   **General Propensity:** Go to **Leaf E (Propensity/Forward-Looking)**.
      *(Note: This separates Organizational accounts from Propensity accounts within the Normative/No-History space.)*

  **Node 7: History Type (Exaptation)**
  Consider feathers: originally selected for thermoregulation, now selected for flight. Which is the *proper* function?
  *   **Thermoregulation (Origin):** Go to **Node 8**.
  *   **Flight (Current Use):** Go to **Leaf F (Modern History)**.

  **Node 8: Vestigial Check (Whale Pelvis)**
  Consider whale pelvic bones: they were selected for walking in ancestors, but provide no current utility and are no longer under selection. Do they have a function?
  *   **Yes:** (Ancestral selection suffices). Go to **Leaf G (Classic Selected Effects)**.
  *   **No:** (Current maintenance required). Go to **Leaf F (Modern History)**.
      *(Note: If you answered "Flight" at Node 7, you should answer "No" here. If you answer "Yes" here but "Flight" at Node 7, your position is unstable.)*

  ---

  ### The Leaves (Positions in Logical Space)

  **Leaf A: Pluralist**
  *   **Path:** Node 1 (Two questions).
  *   **View:** There is no single "function" concept; etiological and causal-role accounts answer different explanatory interests.
  *   **Awkward Commitment:** It dissolves the metaphysical debate rather than solving it, potentially making "function" too context-dependent for rigorous scientific realism.
  *   **Case Verdicts:** Vestigial (No proper/Yes causal); De Novo (No proper/Yes causal); Exaptation (Both); Diseased (No proper/Yes causal); Heart Sound (Both).

  **Leaf B: Propensity / Forward-Looking**
  *   **Path:** Node 2 (No) → Node 4 (Yes).
  *   **View:** Functions are forward-looking dispositions to contribute to survival/reproduction (Bigelow & Pargetter).
  *   **Awkward Commitment:** It attributes functions to traits that might go extinct tomorrow, grounding function in modal facts rather than actual history or contribution.
  *   **Case Verdicts:** Vestigial (No); De Novo (Yes); Exaptation (Flight); Diseased (No); Heart Sound (Depends on survival contribution).
  *   **Separation Flag:** Hard to distinguish from Leaf C (Cummins) without pressing on whether "capacity" implies "future survival."

  **Leaf C: Causal Role (Cummins-style)**
  *   **Path:** Node 2 (No) → Node 4 (No).
  *   **View:** Functions are causal capacities analyzed relative to a containing system.
  *   **Awkward Commitment:** Pathological tokens (diseased hearts) literally lack functions, which clashes with medical and biological discourse about "functional failure."
  *   **Case Verdicts:** Vestigial (No); De Novo (Yes); Exaptation (Flight); Diseased (No); Heart Sound (Both, relative to system).

  **Leaf D: Organizational (Mossio/Saborido)**
  *   **Path:** Node 2 (Yes) → Node 5 (Yes) → Node 6 (Self-Maintenance).
  *   **View:** Functions arise from the self-maintaining closure of a system, requiring no phylogenetic history.
  *   **Awkward Commitment:** It grants proper functions to the first generation of a new species (or even artificial self-maintaining systems) where evolutionary accounts deny them.
  *   **Case Verdicts:** Vestigial (No); De Novo (Yes); Exaptation (Flight); Diseased (Yes); Heart Sound (One proper, based on closure).

  **Leaf E: Propensity (Normative Version)**
  *   **Path:** Node 2 (Yes) → Node 5 (Yes) → Node 6 (General Propensity).
  *   **View:** A rare hybrid; proper function is normative but grounded in future survival chances rather than history or closure.
  *   **Awkward Commitment:** It struggles to explain why a trait that *fails* to survive (but was likely to) retains its function status after the organism dies.
  *   **Case Verdicts:** Similar to Leaf B, but treats the Diseased Heart as having a function.
  *   **Separation Flag:** This logical space is sparsely populated; most propensity theorists reject normativity (Leaf B).

  **Leaf F: Modern History (Godfrey-Smith)**
  *   **Path:** Node 2 (Yes) → Node 5 (No) → Node 7 (Flight) / Node 8 (No).
  *   **View:** Proper function requires selection history, but *recent* maintenance suffices; origin is not decisive.
  *   **Awkward Commitment:** Functions can shift rapidly with environmental changes, making function attribution unstable over short time scales.
  *   **Case Verdicts:** Vestigial (No); De Novo (No); Exaptation (Flight); Diseased (Yes); Heart Sound (One proper).

  **Leaf G: Classic Selected Effects (Millikan/Neander)**
  *   **Path:** Node 2 (Yes) → Node 5 (No) → Node 7 (Thermoregulation) → Node 8 (Yes).
  *   **View:** Proper function is determined by the effect for which the trait was *originally* selected and maintained.
  *   **Awkward Commitment:** A trait can retain a function (e.g., walking) even if it is now vestigial and harmful, provided the historical lineage connection remains unbroken.
  *   **Case Verdicts:** Vestigial (Yes, technically); De Novo (No); Exaptation (Thermoregulation); Diseased (Yes); Heart Sound (One proper).

  ---

  ### Empty or Unstable Logical Spaces

  1.  **Non-Normative + History Required:** (Node 2 "No" + Node 5 "No").
      *   *Status:* **Unattractive/Unexplored.** If you deny that a broken heart has a function (non-normative), you typically ground function in current capacity. Requiring a selection history while denying normativity creates a tension: why does history matter if not to establish a normative standard?
  2.  **Normative + No History + No System Closure:** (Node 2 "Yes" + Node 5 "Yes" + Node 6 "Neither").
      *   *Status:* **Incoherent.** If history isn't required and systemic closure isn't required, there is no ground for the normativity. What makes the function "proper" rather than just "beneficial"?
  3.  **Classic SE + Vestigial "No":** (Node 8 "No" after Node 7 "Origin").
      *   *Status:* **Inconsistent.** If you claim origin determines function (Node 7), you cannot deny function to vestigial structures that retain that origin (Node 8). This combination indicates a misunderstanding of the Selected Effects view.

  ### Separation Flags (Where the Tree Blurs)

  *   **Leaf B (Propensity) vs. Leaf C (Causal Role):** Both deny normativity and allow *de novo* functions. The tree separates them on "Capacity" vs. "Survival," but in practice, Cummins-style accounts often implicitly rely on survival-relevant capacities. Distinguishing them requires asking if a trait that contributes to a system but *lowers* survival has a function (Cummins: Yes; Propensity: No).
  *   **Leaf D (Organizational) vs. Leaf F (Modern History):** Both allow function shifts in exaptation and deny function to vestigial structures. They separate on *De Novo* mutations (Node 5). However, if "self-maintenance" is interpreted broadly, Organizational accounts can look very similar to Modern History accounts in biological cases.
  *   **Leaf A (Pluralist) vs. All Others:** Pluralism is a meta-position. A Pluralist can answer the case questions differently depending on which "concept" they are deploying. The tree forces them to pick a "Monist" path to locate their *components*, but their actual view is the sum of multiple leaves.
