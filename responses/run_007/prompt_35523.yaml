  Hi — I'm a philosophy of biology PhD student, and I'm putting together a handout for a grad seminar on functions. I'd like you to build me a decision tree for the etiological vs. causal-role debate (and the nearby positions) that sorts people by what they actually say about cases, not by which label they'd pick for themselves.

  The nodes should be the diagnostic questions that actually seperate the main accounts, and I'd like the tree to work through these cases somewhere: (1) a vestigial structure like the pelvic bones in whales; (2) a de novo mutation that happens to be beneficial right now but has no selection history yet; (3) an exaptation, like feathers co-opted for flight after being selected for thermoregulation; (4) a diseased heart that can't pump blood; and (5) the fact that one trait can be assigned different functions depending on which containing system you analyze (heart as pump vs. heart as thumping-sound-maker). Phrase each node as a question a grad student could answer without already knowing which position it leads to.

  The leaves I'd like on the tree, if the logical space supports them: selected-effects etiological (the Millikan/Neander line), modern-history etiological (Godfrey-Smith-ish), Cummins-style causal-role, organizational accounts (Mossio et al.), and a pluralist position that there's just more than one legitimate function concept. If the propensity account (Bigelow and Pargetter) or a Boorse-style forward-looking account falls out naturally, include them, but don't force them.

  Please build it from the logical space rather than from the list of names: first the questions and the combinations of answers they allow, then locate the actual positions in that space. For any combination of answers nobody occupies, say briefly whether that's because the view is incoherent, just unattractive, or merely unexplored. Also flag any two leaves the tree can't really separate — I don't want the handout pretending it's sharper than it is. At each leaf, add one sentence on the view's most awkward comitment, the thing I should make sure gets discussed in class.

  Keep it to maybe 8–10 nodes and 5–7 leaves; the audience is philosophy grad students who've done one week on functions, so they know roughly what "etiological" and "causal-role" mean but haven't seen the full taxonomy. No need for citations or a reading list. And tell me straight if the tree can't do what I'm asking rather than fudging it.
