answer: |-
  This is a classic move in political philosophy. The slogan "Taxation is theft" functions as a **conversation stopper** because it attempts to shift the discussion from *consequentialism* (what works best for society) to *deontology* (what rights are being violated).

  If your roommate is using this to end debates about specific policies (like carbon vs. wealth taxes), they are implying that the *mechanism* of taxation is inherently illegitimate, regardless of the outcome.

  Here is a menu of the precise claims hidden inside that slogan, ranked from trivial to radical. You can hand this to him and ask: **"Which of these is the argument you're actually making?"**

  ---

  ### 1. The Linguistic Stipulation
  *   **The Claim:** "Theft" is defined simply as 'the non-consensual taking of property.' Since taxes are taken without my specific, moment-to-moment consent, they fit the dictionary definition of theft.
  *   **Status:** **False (Legally/Technically).** In every legal system, "theft" is defined as the *illegal* taking of property. Taxation is, by definition, *legal*. To say taxation is theft is to redefine the word "theft" to mean "any taking I dislike."
  *   **Does it end the debate?** **Yes, but only by fiat.** If he defines tax as theft, then obviously theft is bad. But this is a semantic trick, not an argument.
  *   **Likelihood he means this:** **Low.** This is the easiest version to refute (by pointing out that legal fines, tolls, and fees also fit this definition), so most people retreat from it quickly.

  ### 2. The Moral Analogy
  *   **The Claim:** Taxation is *morally equivalent* to theft. Even if it's legal, the moral feeling of having money taken by a guy with a gun (the state) is the same as having it taken by a mugger.
  *   **Status:** **Defensible but Contested.** It captures a genuine intuition about coercion. However, most moral frameworks distinguish between a mugger (who takes for private gain) and a state (which ostensibly takes for public goods).
  *   **Does it end the debate?** **No.** An analogy is not an identity. Even if tax is *like* theft, one could argue it is "necessary theft" (like breaking a window to save someone from a fire). This opens the door to debating *necessity* and *outcomes*, which is exactly what he is trying to avoid.
  *   **Likelihood he means this:** **Medium.** This is often the emotional core of the slogan, but it doesn't logically support shutting down policy debates.

  ### 3. The Pre-Political Property Claim (The Libertarian Core)
  *   **The Claim:** I have a natural, moral right to my gross income *before* the state touches it. Property rights exist prior to the state; therefore, the state has no more claim to my money than a stranger does.
  *   **Status:** **Defensible (within Right-Libertarianism).** This is the philosophical engine of the slogan. It relies on the Lockean idea that you own your labor and its fruits absolutely. (Counter-argument: Property rights are themselves created and enforced by the state, so you can't claim them *against* the state).
  *   **Does it end the debate?** **Yes.** If you own 100% of your income by natural right, then *any* tax rate above 0% is a rights violation. Debating whether a wealth tax is better than a carbon tax becomes pointless, because both are violations of that pre-political right.
  *   **Likelihood he means this:** **High.** This is the standard philosophical position of people who use this slogan seriously. It allows them to ignore utilitarian arguments (e.g., "carbon tax reduces emissions") because rights trump utility.

  ### 4. The Consent/Contract Claim
  *   **The Claim:** Legitimate authority requires actual consent. Voting is not consent (since you can't opt out without leaving your home), and the threat of imprisonment for non-payment is coercion, not a contract. Therefore, the state lacks the authority to tax.
  *   **Status:** **Defensible (Philosophical Anarchism).** This challenges the "Social Contract." It argues that democracy does not solve the coercion problem.
  *   **Does it end the debate?** **Yes.** If the mechanism of collection is illegitimate, it doesn't matter what the money is used for. A "good" theft is still a theft. This shuts down debates about *how* to tax, because the *power* to tax is denied.
  *   **Likelihood he means this:** **High.** This often accompanies Claim #3. It explains why he rejects democratic outcomes (laws passed by Congress) as insufficient justification.

  ### 5. The Institutional Illegitimacy Claim (Anarcho-Capitalism)
  *   **The Claim:** The state is essentially a protection racket. It creates the threat (imprisonment) to sell you the solution (security/law). Since the institution itself is criminal, all its revenue streams are proceeds of crime.
  *   **Status:** **Radical.** This is a full rejection of the state's existence, not just its tax rate.
  *   **Does it end the debate?** **Yes, totally.** If the state shouldn't exist, arguing about its tax policy is like arguing about the best way to organize a slave plantation rather than abolishing slavery.
  *   **Likelihood he means this:** **Medium.** Many people say "taxation is theft" but still want the state to fund police and courts. If he wants *any* taxes (even for roads or police), this claim is inconsistent with his slogan.

  ### 6. The Tribal Signal
  *   **The Claim:** "I am a libertarian/conservative, and you are not. We are on different teams."
  *   **Status:** **Sociologically True.** Often, the slogan isn't a philosophical argument but a shibboleth to identify in-group membership.
  *   **Does it end the debate?** **Yes.** It signals that he is not interested in persuasion or compromise, but in asserting identity.
  *   **Likelihood he means this:** **Very High.** Even if he believes the philosophy, the *function* of the sentence in a roommate argument is often just to signal that he considers the matter settled dogma.

  ---

  ### How to use this menu

  The crucial insight for your argument with him is the **"Debate Ender" test.**

  *   If he means **#1 or #2**, you can tell him: *"If it's just a definition or an analogy, that doesn't prove taxation is unjustified. Thieves are bad, but maybe this specific taking is necessary. You haven't proven we shouldn't do it, only that it feels bad."*
  *   If he means **#3, #4, or #5**, you can tell him: *"Okay, you are making a claim about natural rights or state legitimacy. That is a metaphysical claim, not an economic one. But if you believe that, you have to admit that **no** tax is legitimate, not just wealth or carbon taxes. Are you prepared to argue for the abolition of all funding for courts, police, and roads? If not, your slogan is inconsistent."*

  **The Trap:** Most people who use the slogan want the moral force of **#5** (The State is a racket) without the practical consequences of **#5** (Anarchy). They want to keep the state's protection but refuse to pay for it.

  If you hand him this list, ask him to circle the one he means.
  *   If he circles **#3 or #4**, the debate shifts from "Tax Policy" to "Political Philosophy." You can no longer argue about carbon emissions; you have to argue about Lockean property rights.
  *   If he refuses to pick one, you can point out that **"Taxation is theft" is not an argument, it's a placeholder for an argument he isn't making.**
