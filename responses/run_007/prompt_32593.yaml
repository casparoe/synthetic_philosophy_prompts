answer: |-
  Here is a principle that unifies most of your verdicts, resolves the tensions, and identifies the one intuition you likely need to abandon.

  ### The Principle: **Independence-Weighted Epistemic Authority**

  Rational herding depends on three variables:
  1.  **Signal Independence:** Is the crowd's judgment an aggregate of *independent* data points (e.g., hundreds of scientists, many diners), or is it a *correlated cascade* (e.g., people copying people, viral hype)?
  2.  **Relative Evidence Quality:** Does the crowd possess more *relevant* information than you, or do you hold a "local monopoly" on high-quality data (e.g., your specific exam, your specific interview)?
  3.  **Agency & Externalities:** Are you merely observing, or are you an agent responsible for the outcome (doctor, hirer, tweeter)?

  **The Rule:** It is rational to follow the crowd when their signal is **independent and aggregated** and outweighs your private noise. It is irrational when the crowd is **correlated**, or when your private signal is **higher quality/specific** and you bear responsibility for the error.

  ---

  ### Resolving Your Tensions

  #### 1. The Doctor (Case 3) vs. The Scientist (Case 6)
  **Why they feel similar:** Both involve "Me vs. The Consensus."
  **Why the verdicts differ:** It comes down to **General Truth vs. Specific Instance.**

  *   **Case 6 (Scientist):** The consensus represents decades of *independent* replication by hundreds of agents. Your single experiment is statistically noisy. The "Crowd" has vastly more data than you. **Verdict: Trust the Crowd.** (Epistemic humility).
  *   **Case 3 (Doctor):** The "crowd" is three colleagues. Their diagnosis is likely based on heuristics or second-hand info. Your evidence is a *direct, high-resolution examination of this specific patient.* In medicine, the specific instance overrides the general rule if the data conflicts. Furthermore, you have **Agency**; if the patient dies, it's on you, not the three colleagues. **Verdict: Trust Yourself.**

  #### 2. The Investor (Case 2) vs. The Tweeter (Case 5)
  **Why they feel similar:** Both involve "Following the Hype with Zero Research."
  **The Hard Truth:** **Your intuition on Case 2 is likely the one you must abandon.**

  *   **Case 5 (Tweet):** The crowd is a correlated cascade (people retweeting because others retweeted). Spreading it creates negative externalities (misinformation). **Verdict: Irrational/Irresponsible.**
  *   **Case 2 (Investing):** You say this is "Fine." Under the principle, it is **not.** "Everyone piling in" with "zero research" is the definition of a bubble. Unlike the restaurant line (Case 1), where the line signals *past* quality (people ate and liked it), a stock pile-up often signals *future* speculation (people buying because price is going up). This is a correlated cascade, not independent aggregation.
      *   *Correction:* If you are a momentum trader with an exit strategy, it's a strategy. But as an epistemic judgment of *value*, it is dumb herding. To unify your worldview, you should classify Case 2 as **Irrational**, aligning it with Case 5.

  #### 3. The Committee (Case 4)
  **Verdict: Irrational.**
  This fails the **Independence** test. The first three speakers likely influenced each other (anchoring). You have **Private Info** that is high quality. You have **Agency** (you are on the committee). Staying quiet prioritizes social hierarchy over epistemic truth. This is "dumb herding" driven by fear, not reason.

  #### 4. The Restaurant (Case 1) & Movie (Case 7)
  **Verdict: Rational.**
  These pass the **Independence** test. A line of diners or 95% on Rotten Tomatoes represents hundreds of independent trials. Your private info (hunger, friend's opinion) is low-weight compared to the aggregate. The cost of being wrong is low.

  ---

  ### The Verdict on Case 8 (Hiring)

  **The Setup:** 2 Experienced Interviewers (Candidate A) vs. You/Novice (Candidate B).
  **The Conflict:** You found A "mediocre" and B "great."

  **Application of the Principle:**
  1.  **Independence:** Did the first two interviewers talk before you? If yes, their signal is correlated (weight = 1 person). If no, their signal is stronger (weight = 2 people).
  2.  **Relative Quality:** Experience matters, but "mediocre vs. great" is a strong signal. However, as a novice, your calibration might be off.
  3.  **Agency:** You are part of the hiring decision.

  **The Decision:** **Do not follow the crowd, but do not trust yourself blindly.**
  This is a **Split Verdict**.
  *   **Don't hire A just because they did.** If your private evidence says "mediocre," the crowd's weight isn't heavy enough to override a direct negative signal (unlike the Scientist case).
  *   **Don't hire B just because you liked them.** You lack the experience to calibrate "great."
  *   **Rational Action:** Break the cascade. Openly state: *"I know you both recommend A, but my interview yielded a significantly different read. Can we discuss the specific criteria where A excelled and B lagged?"*
  *   **Why:** This respects the colleagues' experience (Weight) but protects against Groupthink (Independence) and utilizes your unique data (Private Evidence).

  ---

  ### Summary of Required Shifts

  | Case | Your Intuition | Principle's Verdict | Reason |
  | :--- | :--- | :--- | :--- |
  | **1 (Restaurant)** | Rational | **Rational** | Independent aggregate, low cost. |
  | **2 (Investing)** | Rational | **Irrational** | **Abandon this.** Correlated cascade, zero info. |
  | **3 (Doctor)** | Irrational to herd | **Irrational to herd** | High-quality private evidence, specific instance. |
  | **4 (Committee)** | Irrational to herd | **Irrational to herd** | Social pressure, not epistemic weight. |
  | **5 (Tweet)** | Irrational to herd | **Irrational to herd** | Correlated cascade, negative externalities. |
  | **6 (Scientist)** | Rational to herd | **Rational to herd** | Massive independent aggregate vs. noisy single data. |
  | **7 (Movie)** | Rational | **Rational** | Aggregate taste > single friend. |
  | **8 (Hiring)** | Undecided | **Investigate Discrepancy** | Private signal too strong to ignore, experience too valuable to discard. |

  ### Confidence & Uncertainty

  **Confidence Level:** **85%**
  This principle (Independence-Weighted Epistemic Authority) robustly explains the difference between "wisdom of crowds" (independent aggregation) and "madness of mobs" (correlated cascades), which is the core thread in your examples.

  **Point of Least Certainty:** **Case 2 (Investing).**
  I am least sure about forcing you to abandon Case 2. There is a niche argument for "momentum trading" where following the crowd *is* the strategy, regardless of underlying value. If your goal is purely short-term profit extraction rather than assessing value, Case 2 *could* be rational instrumentally, even if epistemically hollow. However, for a general rule of "rational thinking," classifying it as herding is safer.

  **Second Point of Uncertainty:** **Case 8 (Hiring).**
  The "right" move depends heavily on the organizational culture. In some firms, a junior contradicting two seniors is career suicide (a social cost the principle doesn't fully quantify). Epistemically, you should speak up; pragmatically, the cost of error for *you* might be higher than the cost of hiring the wrong candidate.
