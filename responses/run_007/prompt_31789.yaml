      *Check constraints:* 3-5 year horizon. Funder agenda. No bibliography. Defended reasoning.

      *Refining the "Tractability" of Q1:* Can philosophers settle decision theory in 5 years? No. But they can produce a *framework for funders* to adopt. That is tractable.
      *Refining "Tractability" of Q2:* Comparative cognition is advancing. 5 years is enough for a robust model.
      *Refining "Tractability" of Q3:* Hard science. 5 years might yield specific markers, but not proof. Still, high value.

      *Let's ensure the "Scale Argument" specific nuance is hit.* The scale argument is vulnerable to "Pascal's Mugging." Addressing this is the highest leverage.

      *Final check on "Neglectedness":* EA community talks a lot about sentience (Q3). They talk less about Moral Weight (Q2) and Decision Rules for Cause Selection (Q1). So Q1 and Q2 are more neglected.

      *Okay, ready to draft.*
answer: |-
  ### Executive Summary: The Strategic Bottleneck

  The "Scale Argument" (Low Probability $\times$ Enormous Population = High Expected Value) is not a biological claim; it is a decision-theoretic claim. Consequently, the highest-leverage questions are not initially biological, but structural. If your foundation adopts a decision rule that discounts low-probability/high-stakes claims (to avoid Pascal's Mugging), the biological facts become irrelevant. If you adopt a precautionary principle, the need for biological certainty diminishes.

  Therefore, this agenda prioritizes **decision frameworks** and **moral weighting** over **sentience verification**. The goal is to determine *how* to bet before determining *what* the bet is on. The following three priorities are ranked by their Value of Information (VoI) regarding the specific decision to fund an invertebrate welfare program, their tractability over a 3–5 year horizon, and their current neglectedness.

  ---

  ### Priority 1: Operationalizing Uncertainty and Decision Rules
  **The Question:** Should the foundation treat the probability of insect sentience as a subjective credence to be maximized (Expected Value), a frequency requiring a threshold of evidence (Evidence-Based), or a parameter triggering a Precautionary Principle?

  **Reasoning for Ranking:**
  This is the gatekeeper question. The scale argument collapses if the foundation applies a "Pascal's Mugging" discount, which rejects acting on hypotheses solely because the stakes are astronomically high despite low probability. Conversely, if the foundation adopts a "Precautionary Principle" (act if there is a non-negligible risk of severe suffering), the precise probability matters less than the severity of the risk. Resolving this determines whether the biological research (Priorities 2 and 3) is even necessary.

  *   **Value of Information (VoI):** **Critical.** A settled decision framework could reduce the expected value of the program to zero (if mugging-avoidance is chosen) or stabilize it regardless of biological ambiguity (if precaution is chosen). It dictates the entire investment thesis.
  *   **Tractability (3–5 Years):** **High.** This is a conceptual and normative problem, not an empirical one. A dedicated team of decision theorists and ethicists can produce a robust "Cause Selection Framework" within 24 months. It does not require waiting for new neurobiological data.
  *   **Neglectedness:** **High.** While discussed abstractly in Effective Altruism circles, few funders have operationalized these frameworks into binding grant-making criteria. Most research funding assumes an Expected Value maximization model without defending it against long-tail risk objections.

  **Deliverable:** A white paper defining the foundation's "Risk Tolerance for Moral Uncertainty," specifying the probability threshold required to trigger funding.

  ---

  ### Priority 2: Moral Weight and Aggregation Functions
  **The Question:** If insects are sentient, how should their welfare be weighted relative to vertebrates? Should aggregation be linear (one insect = one unit), or should it be discounted by cognitive complexity, neural capacity, or temporal integration?

  **Reasoning for Ranking:**
  The scale argument relies on the assumption that $N$ (numbers) can swamp differences in $W$ (welfare intensity). However, if an insect's capacity for suffering is $1/10,000^{th}$ that of a cow due to limited cognitive integration or shorter lifespan, the "enormous numbers" advantage evaporates. This question is more tractable than proving sentience exists because it relies on comparative anatomy and cognitive modeling rather than the hard problem of consciousness.

  *   **Value of Information (VoI):** **Very High.** This determines the *relative* allocation of funds. Even if invertebrate welfare is positive EV, it might be 100x less cost-effective than vertebrate welfare if the moral weight is sufficiently low. This prevents the "swamping" effect from distorting the portfolio.
  *   **Tractability (3–5 Years):** **Medium-High.** Welfare biologists can develop proxy metrics for "moral weight" (e.g., neuron count, integration of information, behavioral trade-off complexity) without solving consciousness. Comparative studies between insects and vertebrates are feasible within this horizon.
  *   **Neglectedness:** **High.** The field is binary-focused (sentient vs. non-sentient). There is scant rigorous work on *gradualism* in moral weight. Most models assume a binary switch, which is likely philosophically and biologically inaccurate.

  **Deliverable:** A "Moral Weight Model" that provides a discount factor for invertebrate welfare based on measurable cognitive/biological proxies, allowing for direct cost-effectiveness comparisons with vertebrate interventions.

  ---

  ### Priority 3: Indicators of Valenced Experience (Affect vs. Nociception)
  **The Question:** Do observed avoidance behaviors and nociceptors in insects indicate *valenced experience* (suffering) or merely *adaptive processing* (reflex)?

  **Reasoning for Ranking:**
  This is the standard biological question, but it ranks third because it is the least tractable and its importance is mediated by Priorities 1 and 2. If you adopt a Precautionary Principle (Priority 1), you fund interventions even if this question remains unanswered. If you apply a heavy cognitive discount (Priority 2), the answer matters less. However, it remains essential for refining the probability estimate ($P$) in the scale argument.

  *   **Value of Information (VoI):** **High.** A definitive "No" kills the program. A definitive "Yes" validates it. However, given the difficulty of proof, the VoI is slightly lower than the decision rules that govern how we act *under* uncertainty.
  *   **Tractability (3–5 Years):** **Medium.** New behavioral assays (e.g., affective bias tests, trade-off decisions under risk) are emerging. While a definitive proof of consciousness is unlikely, narrowing the probability range (e.g., from 1–10% to 5–8%) is feasible.
  *   **Neglectedness:** **Medium.** This is the most active area of research. Because it is already receiving attention from welfare biologists and philosophers, marginal funding here yields lower returns than funding the neglected decision-theoretic and weighting questions.

  **Deliverable:** A standardized "Sentience Probability Range" for key taxa (e.g., Hymenoptera, Diptera) based on consensus markers of affect, rather than a binary verdict.

  ---

  ### Deliberate Deprioritization: The Metaphysics of Consciousness
  **The Question:** What is the ontological nature of qualia? Is consciousness fundamental or emergent? What are the necessary and sufficient conditions for "subjectivity"?

  **Reasoning for Deprioritization:**
  While intellectually central to philosophy, this question has **low decision-relevance** for a funder over a 3–5 year horizon.
  1.  **Low Tractability:** These debates have persisted for millennia; they will not be settled in time to inform your grant cycle.
  2.  **Low VoI:** Practical policy relies on *proxies* for consciousness (behavior, neuroanatomy). Whether a specific theory of consciousness (e.g., Global Workspace vs. Integrated Information Theory) is metaphysically "true" matters less than whether it yields actionable predictions about suffering.
  3.  **Risk of Paralysis:** Focusing on metaphysics invites infinite regress and stalls action. A funder should operate on "functional sentience" (capacity to suffer) rather than "metaphysical sentience."

  **Strategy:** Commission a review of existing theories to ensure the foundation's working definition of sentience is compatible with the leading accounts, but do not fund research aimed at solving the "Hard Problem."

  ---

  ### Triggers for Re-evaluation
  This agenda is stable, but the following evidence over the next 3–5 years would force a reprioritization:

  1.  **Neural Correlate Discovery:** If neuroscientists identify a specific, necessary neural substrate for valenced experience (e.g., a specific thalamocortical loop configuration) and demonstrate insects definitively lack it, **Priority 3** becomes moot, and the program should be terminated regardless of the decision rule.
  2.  **Intervention Cost-Effectiveness Data:** If pilot programs reveal that invertebrate welfare interventions are orders of magnitude cheaper than vertebrate interventions (e.g., modifying agricultural practices for insects vs. cows), **Priority 2** (Moral Weight) becomes less critical, as the sheer cost-differential could outweigh the weight discount.
  3.  **Consensus on Longtermism:** If the effective altruism community reaches a strong consensus that population ethics requires maximizing the number of happy lives (rather than minimizing suffering), the **Scale Argument** flips from a risk mitigation strategy to a population expansion strategy, fundamentally altering **Priority 1**.

  ### Summary Recommendation
  Do not fund a "Sentience Research Program" as your first step. That assumes the answer to Priority 1 is "Maximize Expected Value" and Priority 2 is "Linear Aggregation."

  Instead, fund a **"Decision Framework and Moral Weight Initiative."**
  1.  Hire decision theorists to define how the foundation handles low-probability/high-stakes moral claims.
  2.  Hire welfare biologists to build a comparative model of moral weight (intensity of suffering) between insects and vertebrates.

  Only once these two levers are set should you fund empirical research into insect affect. This ensures that any subsequent biological data is interpreted through a robust, pre-committed strategic lens, preventing the "scale argument" from becoming a source of perpetual paralysis.
