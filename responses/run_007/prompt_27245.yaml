answer: |-
  This is a profound dispute, one that sits at the intersection of history, sociology, and meta-ethics. To settle it, you cannot simply assert that things are better; you must define what 'better' means in a way that survives the scrutiny of history's bloody ledger. Below is the list of requirements any adequate theory of moral progress must satisfy to distinguish genuine improvement from mere cultural drift.

  ### The Requirements for an Adequate Theory of Moral Progress

  **1. The Non-Arbitrariness Requirement**
  *   **What it demands:** The theory must provide a standard of judgement that is not identical to the prevailing opinion of the present day. It must explain why our current convictions (e.g., 'slavery is wrong') are *correct* rather than merely *current*.
  *   **Why it is a requirement:** Without this, your brother wins. If 'progress' is defined solely by what we currently believe, then the Victorians were progressing when they colonised Africa, because they believed they were civilising savages. To claim progress, you must be able to say the Victorians were mistaken, not just different.
  *   **Forcing Case:** **The End of Slavery.** If the theory cannot explain why the 18th-century consensus (that slavery was economically necessary and biblically sanctioned) was *morally erroneous* rather than just 'out of fashion', it fails.

  **2. The Institutional Reality Check**
  *   **What it demands:** The theory must prioritise material conditions, laws, and violence rates over stated beliefs, rhetoric, or philosophical texts.
  *   **Why it is a requirement:** People lie, and societies engage in hypocrisy. A theory that measures progress by reading the popular philosophy of an era will conclude that 1950s America was morally superior to 2020s America because the rhetoric of equality was more novel then, ignoring the reality of Jim Crow.
  *   **Forcing Case:** **Rhetoric vs. Action.** The distinction between a society that *says* all men are created equal but enslaves them, versus one that *says* it and actually enfranchises them. Progress must track the latter.

  **3. The Scope Distinction**
  *   **What it demands:** The theory must distinguish between *widening the moral circle* (including new entities) and *deepening care within the existing circle* (treating current members better).
  *   **Why it is a requirement:** These are different phenomena. A tribe might be incredibly loyal and kind to its own members (high depth) while slaughtering neighbours (narrow scope). Progress usually involves trading some tribal intensity for broader inclusion. Conflating the two muddies the water.
  *   **Forcing Case:** **Animal Welfare & The Widening Circle.** We treat our pets better than medieval kings treated their children, but does that mean we are morally better? The theory must account for the inclusion of non-humans and future generations as a specific type of progress, distinct from just being nicer to your neighbours.

  **4. The Regression Accommodation**
  *   **What it demands:** The theory must allow for local and temporal backsliding without collapsing the entire narrative of progress. It cannot be a straight line.
  *   **Why it is a requirement:** History is not a ladder; it is a jagged graph. A theory that insists on constant improvement is falsified by the 20th century.
  *   **Forcing Case:** **The Civilised Atrocity.** The Holocaust occurred in the heart of Europe, amongst the most educated, 'cultured' society on earth. A theory of progress must explain how a society can be technologically and administratively advanced while morally regressing. It cannot contradict the fact that the worst atrocities happened in societies that thought they were the most civilised.

  **5. The Mechanism Explanation**
  *   **What it demands:** The theory must explain *how* progress happens. Is it through reason, empathy, economic pressure, or divine intervention?
  *   **Why it is a requirement:** If progress is accidental, it isn't robust. If it relies on 'great men', it isn't structural. To believe progress will continue, you need to know the engine driving it.
  *   **Forcing Case:** **The Rise of Human Rights.** Did women get the vote because men suddenly became kinder, or because economic shifts made their labour essential and their exclusion inefficient? The theory must pick a lane.

  **6. The Independence Condition**
  *   **What it demands:** The standard of progress must be accessible to critics within the system, not just historians looking back.
  *   **Why it is a requirement:** If we can only recognise progress in hindsight, we cannot claim to be making it now. There must be a way for a contemporary reformer to claim they are right against the majority.
  *   **Forcing Case:** **The Abolitionists.** When Wilberforce argued against slavery, he was in the minority. If the theory requires majority consensus to validate moral truth, Wilberforce was immoral until he won. The theory must allow for the minority to be the bearer of progress.

  ***

  ### Analysis of the Requirements

  **Non-Negotiable vs. Pet Preferences**

  *   **Non-Negotiable:** Requirements **1 (Non-Arbitrariness)**, **2 (Institutional Reality)**, **4 (Regression)**, and **6 (Independence)** are non-negotiable. If a theory fails these, it is either factually wrong (ignoring history) or logically incoherent (defining progress as 'whatever happens'). Your brother's scepticism specifically targets Requirement 1; if you cannot meet it, you cannot refute him.
  *   **Pet Preferences:** Requirement **5 (Mechanism)** is often a matter of preference. Some demand a spiritual mechanism (religious views), others a materialist one (Marxist views), others a cognitive one (Enlightenment views). As long as the mechanism produces the result, the specific engine is debatable. Requirement **3 (Scope)** is borderline; some argue depth is the only thing that matters, but given the prompt's focus on the 'widening circle', it is treated here as essential for your specific argument.

  **Incompatibilities and Tensions**

  There is a significant tension between **Requirement 1 (Non-Arbitrariness)** and a naturalistic worldview that denies 'spooky moral facts'.
  *   **The Conflict:** To satisfy Requirement 1, you need a standard outside of current opinion. If you are a moral realist, this is easy (the standard is Objective Truth). If you are a moral anti-realist (believing morality is constructed), it is very hard to explain why one construction is 'better' than another without smuggling in an objective standard.
  *   **The Finding:** You cannot jointly satisfy a strict 'No Metaphysical Moral Facts' preference and the 'Non-Arbitrariness Requirement' without considerable philosophical gymnastics. One of these usually has to give.

  **The 'Killer' Requirement**

  **Requirement 1 (Non-Arbitrariness)** is the one that rules out most usual stories.
  *   **Why:** Most popular narratives of progress (e.g., Steven Pinker's *The Better Angels of Our Nature*) rely on a functionalist definition: violence is down, therefore we are better. This risks conflating 'prudence' with 'morality'. We might be less violent simply because nuclear weapons make war too expensive, not because we are morally superior. If the change is driven by cost-benefit analysis rather than moral recognition, Requirement 1 is threatened. The theory must show that the *moral reasoning* has improved, not just the *outcome*.

  ***

  ### Scoring the Usual Stories

  Here is how the common narratives score against the list:

  *   **The Enlightenment Rationalist Story (e.g., Pinker):**
      *   *Scores well on:* Institutional Reality (tracks violence/stats), Regression (acknowledges blips).
      *   *Fails on:* Non-Arbitrariness. It often defines 'good' as 'less violent', which is a pragmatic metric, not necessarily a moral one. It struggles to explain why we *ought* to value reduced violence without an objective moral premise.
  *   **The Religious/Teleological Story:**
      *   *Scores well on:* Non-Arbitrariness (God's will is the anchor), Independence (prophets speak against the majority).
      *   *Fails on:* Regression. It struggles to explain why a benevolent deity allows the 20th century. Also fails Institutional Reality if it focuses on salvation of the soul rather than material suffering.
  *   **The Materialist/Marxist Story:**
      *   *Scores well on:* Mechanism (explains *how* via economics), Institutional Reality.
      *   *Fails on:* Scope Distinction. It often reduces moral widening to economic necessity, denying the moral agency of the widening circle.
  *   **The Sceptic's Story (Your Brother):**
      *   *Scores well on:* Regression (highlights the hypocrisy), Non-Arbitrariness (correctly identifies that we lack a agreed-upon standard).
      *   *Fails on:* Independence. It renders the abolitionist indistinguishable from the slave trader, merely 'different'. It collapses the distinction between rhetoric and reality by claiming both are just power plays.

  ### Conclusion

  To win your argument, you must not merely list the good things we do now. You must demonstrate that our current standards allow us to critique our past *and* our present without relying on the assumption that 'newer is better'. If you cannot anchor the 'widening circle' to something more solid than social preference, your brother's claim that it is merely fashion remains standing. The hard work lies in Requirement 1: defining the yardstick without pretending it fell from the sky.
