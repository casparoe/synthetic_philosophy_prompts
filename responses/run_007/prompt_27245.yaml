prompt: |-
  I've been having this on-and-off argument with my brother for months now about whether the world is actually getting morally better. He says no: every generation just swaps one set of prejudices for another and calls it progress. I want to say yes: the fact that we now think slavery, burning cats for fun, and the idea that women shouldn't vote are wrong is not just fashion — something actually moved. But then I start listing the things a good story about moral progress would have to explain, and I realise I don't have a clear list, and neither does he. So here's what I want: write me the list of requirements. What does any adequate theory of moral progress have to deliver before I should believe it? Assume the point of the theory is to settle whether the widening of moral concern counts as genuine progress, not just to describe how opinions changed. Which cases must it get right — the end of slavery, the rise of animal welfare (whatever you think of how far that should go), the way the circle of who counts seems to have widened from family to tribe to nation to all humans and now maybe to animals and future people — and which distinctions it can't collapse, like the difference between widening the circle and just treating the people already inside it better, or between a change in what people say and a change in what they actualy do and the institutions they build. And which historical facts is it not allowed to contradict — including the ugly bits, the backsliding, the fact that some of the worst atrocities happened in societies that thought they were the most civilised. For each requirement, tell me why it's a requirement and wich case or consideration forces it.

  Then mark which requirements are non-negotiable and which are just one camp's pet preferences (for example, some people will demand that progress be measured against a standard that doesn't itself change over time, others will demand that the whole thing be explained without any spooky moral facts). Tell me if any pair of the requirements can't be jointly satisfied, because that would itself be a finding, and if one requirement on its own rules out most of the usual stories people tell, say which one. If you can, end by briefly scoring the usual kinds of story against the list — but keep that short, the list is the point. Oh, and please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Progress (Is the world getting morally better?).
      *   **Task:** Create a list of requirements for an *adequate theory of moral progress*.
      *   **Goal:** Settle whether the widening of moral concern counts as genuine progress (not just opinion change).
      *   **Specific Content Requirements:**
          *   Must address specific cases (end of slavery, animal welfare, widening circle of concern).
          *   Must maintain specific distinctions (widening circle vs. treating insiders better, rhetoric vs. action/institutions).
          *   Must not contradict historical facts (backsliding, atrocities by "civilised" societies).
          *   For each requirement: Explain *why* it's a requirement and *which case/consideration* forces it.
          *   **Crucial Analysis:** Mark requirements as "Non-negotiable" vs. "Pet Preferences". Identify incompatibilities between requirements. Identify if one requirement rules out most usual stories.
          *   **Ending:** Briefly score usual stories against the list.
          *   **Language:** British English (e.g., "civilised", "colour", "realise", "whilst").

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *moral realism* (there are objective moral truths we are discovering) and *moral relativism/constructivism* (morality is just social preference).
      *   The brother's view: Moral change is just fashion (swapping prejudices).
      *   The user's view: Moral change is progress (slavery is actually wrong, not just unfashionable).
      *   To adjudicate this, we need criteria that a theory of progress must meet to be convincing to *both* sides, or at least to be philosophically robust.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Directionality Constraint.* Progress implies a vector. We need to know what "better" means.
          *   *Case:* Slavery. If it's just change, abolishing slavery isn't better, just different. To call it progress, we need a standard.
      *   *Requirement 2: The Institutional/Behavioural Constraint.* It can't just be talk.
          *   *Case:* Virtue signalling vs. actual laws. Distinction between saying and doing.
      *   *Requirement 3: The Expansion Constraint.* It must account for the widening circle.
          *   *Case:* Tribe -> Nation -> Human -> Animal. Distinction between widening circle vs. depth of care within circle.
      *   *Requirement 4: The Backsliding Constraint.* It must allow for regression.
          *   *Fact:* Nazi Germany, Rwanda. Civilised societies doing barbaric things. A theory of linear progress fails here.
      *   *Requirement 5: The Independence Constraint.* The standard of progress shouldn't just be "what we think now".
          *   *Consideration:* If progress is defined by current opinion, we can never be wrong. This is the brother's main objection (fashion).
      *   *Requirement 6: The Psychological/Structural Constraint.* It needs to explain *how* it happens (institutions vs. hearts).
          *   *Consideration:* Pinker's argument (institutions) vs. spiritual awakening.

  4.  **Refining and Categorising (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Must fit the data (history), must define progress (logic), must distinguish rhetoric from reality (empirical).
      *   *Preference:* Whether the standard is God-given, evolutionary, or rational. Whether it's linear or dialectical.

  5.  **Identifying Incompatibilities:**
      *   *Tension:* The "Independence Constraint" (objective standard) vs. "Naturalistic Constraint" (no spooky facts). If you demand an objective standard *and* demand no metaphysical moral facts, you have a problem (the Euthyphro dilemma territory).
      *   *Tension:* "Linear Progress" vs. "Historical Facts of Backsliding".

  6.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Civilised, realisation, colour, behaviour, centre.
      *   *Tone:* Analytical, philosophical, slightly formal but accessible.

  7.  **Step-by-Step Construction of the Response:**

      *   **Introduction:** Acknowledge the depth of the argument. Set the stage.
      *   **The List:**
          1.  *The Normative Anchor:* Need a standard. (Forces: Slavery case).
          2.  *The Behavioural Reality Check:* Actions > Words. (Forces: Rhetoric vs. Institutions).
          3.  *The Scope Distinction:* Breadth vs. Depth. (Forces: Widening circle).
          4.  *The Regression Accommodation:* Must allow for steps back. (Forces: Holocaust/Atrocities).
          5.  *The Independence Condition:* Standard isn't just current consensus. (Forces: Brother's "fashion" objection).
          6.  *The Mechanism Explanation:* How does it happen? (Forces: Institutional vs. Spiritual).
      *   **Analysis of Requirements:**
          *   Mark Non-negotiable vs. Preference.
          *   Highlight the clash between Objective Standard and Naturalism.
          *   Highlight the "Independence Condition" as the killer for simple evolutionary stories.
      *   **Scoring the Usual Stories:**
          *   Religious/Teleological.
          *   Enlightenment Rationalism (Pinker style).
          *   Materialist/Marxist.
          *   Relativist/Sceptic (Brother's view).
      *   **Conclusion:** Brief wrap-up.

  8.  **Review against Constraints:**
      *   *British English?* Check (e.g., "civilised", "realise", "programme").
      *   *All specific cases mentioned?* (Slavery, animals, widening circle, backsliding).
      *   *Distinctions maintained?* (Rhetoric/Action, Breadth/Depth).
      *   *Non-negotiable/Preference marked?* Yes.
      *   *Incompatibilities identified?* Yes.
      *   *Scoring included?* Yes, kept brief.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* Initially, I might make the "Objective Standard" non-negotiable. But a constructivist could argue progress is real without Platonic forms. I need to phrase it carefully: The theory must explain *why* the standard isn't arbitrary, not necessarily that it exists in the stars.
      *   *Refinement:* Ensure the distinction between "widening the circle" and "treating insiders better" is clear. This is crucial for the animal welfare point.
      *   *Tone Check:* Ensure I don't take sides too heavily, but provide the tools for the user to judge.
      *   *Language:* Double-check spellings (e.g., "behaviour" not "behavior", "centre" not "center").

  10. **Final Polish:** Check the flow and ensure the "killer requirement" is highlighted effectively. (The Independence Condition is usually the hardest for secular naturalists to satisfy without smuggling in realism).

  *(Self-Correction on "Independence Condition"):* If I make "Objective Moral Facts" a requirement, I rule out constructivism. The prompt asks what an adequate theory needs to deliver to settle the argument. The brother says it's just fashion. To defeat the brother, the theory *must* show it's not just fashion. So the "Independence from Current Consensus" is non-negotiable for the *claim of progress*, even if the metaphysical grounding is debated. I will frame it as "The Non-Arbitrariness Requirement".

  Let's assemble the response.

  *Structure:*
  1. Intro.
  2. The Six Requirements (with justification and forcing case).
  3. The Status of Requirements (Non-negotiable vs Preference).
  4. Incompatibilities & The "Killer" Requirement.
  5. Scoring the Usual Suspects.
  6. Outro.

