prompt: |-
  I'm running a grad seminar on reasons and rationality — about 10 students, a bit under two hours. I want to design an activity that makes them feel the pull of the wrong kind of reasons problem before we read the literature on it. You know the basic setup: an evil demon will punish you unless you admire him, so you've got a pragmatic reason to admire him, but it doesn't seem like the *right* kind of reason — it doesn't make him admirable. The puzzle is saying what the difference consists in.

  I want the students to generate the puzzle themseves. So I need a set of cases, a procedure, and a debrief. The cases should include both epistemic and practical attitudes — beliefs, desires, admiration, resentment, fear, etc. — and mix in some where pragmatic reasons *do* seem like the right kind (like: you'll get paid if you desire to eat a bug, because that'll help you actually do it). The activity should force them to try to articulate a principle, fail in interesting ways, and then see why the problem is hard.

  Give me the case set (maybe 8–10 short vignettes), the step-by-step procedure with timing, debrief notes that map moments in the activity to the philosophical terrain, and a candid note on what predictably goes wrong and which part of the problem the activity can't get at.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**
      *   **Topic:** The "Wrong Kind of Reasons" (WKR) problem in reasons and rationality.
      *   **Context:** Grad seminar, ~10 students, slightly under 2 hours.
      *   **Goal:** Make students *feel* the pull of the problem *before* reading the literature. They need to generate the puzzle themselves.
      *   **Requirements:**
          *   Case set (8-10 vignettes).
          *   Must cover epistemic (belief) and practical/conative (desire, admiration, resentment, fear) attitudes.
          *   Must mix cases where pragmatic reasons *are* the right kind (e.g., bug-eating desire) vs. where they aren't (e.g., demon threatening admiration).
          *   Procedure with timing.
          *   Debrief notes mapping activity to philosophical terrain.
          *   Candid note on limitations/predictable failures.

  2.  **Deconstruct the WKR Problem:**
      *   *Core Intuition:* Some reasons count in favor of an attitude because they make the object of the attitude fit the attitude (Right Kind). Some reasons count in favor of having the attitude but don't make the object fit (Wrong Kind).
      *   *Classic Example:* Demon threatens you unless you admire him. (Pragmatic reason to admire, but he's not admirable).
      *   *Nuance:* Sometimes pragmatic reasons *do* seem relevant to the rationality of the attitude (e.g., Pascal's Wager-ish cases, or instrumental desires).
      *   *The Challenge:* Distinguishing the two without circularity (e.g., "Right kind reasons are those that make the attitude fitting" is often too close to the definition).

  3.  **Designing the Cases (The "Stimulus"):**
      *   I need a gradient. Not just "Right" vs. "Wrong," but cases that tease apart *source* of reason vs. *object* of attitude.
      *   *Attitudes to cover:* Belief, Admiration, Fear, Desire, Intention, Resentment.
      *   *Case Types:*
          1.  **Pure WKR (Demon/Payment):** Threat/Reward for holding the attitude. Object doesn't warrant it.
          2.  **Pure RKR (Evidence/Merit):** Standard reasons.
          3.  **Tricky/Intermediate (Instrumental):** Desiring to desire, or cases where the consequence of the attitude matters.
          4.  **Emotional/Reactive Attitudes:** Resentment/Fear where safety vs. fittingness clashes.

      *   *Drafting the Vignettes:*
          1.  *Admiration (Classic):* Demon threatens unless you admire him. He's a jerk.
          2.  *Belief (Evidentialism):* Evidence says P. You want P to be true.
          3.  *Fear (Safety):* Bridge is safe, but you feel fear. Demon says "Fear or die."
          4.  *Desire (Instrumental):* You need to eat a bug. You don't want to. You try to desire it to make it easier.
          5.  *Resentment (Moral):* Someone wronged you. A therapist says "Resent them less, you'll be happier."
          6.  *Belief (Pascal/Wager):* Believe in God or suffer eternal damnation.
          7.  *Admiration (Peer Pressure):* Everyone you love admires a bad artist. You want to fit in.
          8.  *Intention (Self-Fulfilling):* You need to intend to jump to actually jump (skiing example).
          9.  *Grief (Pragmatic):* Grieving too long hurts your career. Reason to stop grieving?
          10. *Trust (Pragmatic):* Trusting a partner makes the relationship work, even if evidence is shaky.

      *   *Refining for the "Puzzle":* I need to ensure some cases make students say "Yes, that's a reason" and others "No, that's cheating," but the *structure* of the reason looks similar (consequences of holding the attitude).
      *   *Selection:* Let's pick the strongest 8.
          1.  Demon/Admiration (Classic WKR).
          2.  Evidence/Belief (Classic RKR).
          3.  Bug/Desire (Instrumental RKR - wanting to want).
          4.  Bridge/Fear (Safety vs. Danger).
          5.  Pascal/Belief (Pragmatic reason for belief).
          6.  Therapist/Resentment (Well-being reason for emotion).
          7.  Skiing/Intention (Constitutive/Instrumental mix).
          8.  Auction/Desire (Bidding strategy - desire as means).

  4.  **Designing the Procedure:**
      *   *Total Time:* 110 minutes (a bit under 2 hours).
      *   *Phase 1: Setup & Cases (30 mins).* Small groups sort cases.
      *   *Phase 2: Principle Generation (30 mins).* Try to write the rule.
      *   *Phase 3: Stress Testing (30 mins).* Swap rules, try to break them.
      *   *Phase 4: Debrief/Lecture Bridge (20 mins).* Connect to literature.

      *   *Wait, 10 students is small.* Whole group discussion might work better than small groups for the "feeling" part, but small groups ensure everyone speaks. Let's do pairs or trios.
      *   *Refinement:*
          1.  Intro (5 mins).
          2.  Sorting Task (25 mins). Pairs sort into "Valid Reason" vs. "Invalid Reason" for the attitude.
          3.  Principle Drafting (20 mins). Why did you sort them that way? Write a rule.
          4.  The "Demon" Twist (20 mins). Introduce a case that breaks their rule.
          5.  Full Seminar Discussion (30 mins).
          6.  Wrap (10 mins).

      *   *Actually, let's make it more Socratic/Iterative.*
      *   Step 1: Individual ranking (10 mins).
      *   Step 2: Small Group Consensus (20 mins).
      *   Step 3: The "Definition Challenge" (30 mins).
      *   Step 4: Plenary & Debrief (40 mins).
      *   Total: 100 mins + 10 buffer.

  5.  **Designing the Debrief:**
      *   Need to map their struggles to specific philosophical distinctions.
      *   *Object-Given vs. State-Given:* This is the standard distinction (Parfit).
      *   *Fittingness vs. Rationality:* D'Arms & Jacobson.
      *   *Constitutive Aims:* Shah & Velleman.
      *   *Predictable Failure:* Students will likely rely on "Truth" or "Goodness" of the object, but struggle with cases where the attitude *makes* it good (self-fulfilling). They will struggle to define "fitting" without circularity.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Cases:* Make them punchy.
      *   *Procedure:* Be precise with timing. Grad students can talk forever; need hard stops.
      *   *Candid Note:* Acknowledge that this activity sets up the *extension* of the problem but not the *technical solutions* (e.g., buck-passing, formal objects).

  7.  **Review against Constraints:**
      *   10 students? Yes, pairs/trios work well.
      *   Under 2 hours? Yes, 100-110 mins.
      *   Epistemic & Practical? Yes (Belief, Desire, Emotion).
      *   Mix of Pragmatic Right/Wrong? Yes (Bug eating vs. Demon).
      *   Debrief mapping? Yes.
      *   Candid limitations? Yes.

  8.  **Final Polish:**
      *   Ensure the "Bug" case is clear (desiring to desire vs. desiring).
      *   Ensure the "Demon" case is distinct from "Pascal."
      *   Make sure the "Principle" task is hard enough to fail but not impossible.
      *   *Self-Correction on Timing:* 10 students is intimate. Don't over-structure. Allow for organic debate. I'll structure it as a "Legislative Session" where they have to write the law of rationality.

      *(Self-Correction during drafting)*: I need to make sure the "Bug" case doesn't confuse *desiring to eat* with *desiring to desire*. The WKR problem often turns on whether the reason targets the *content* or the *holding* of the attitude.
      *   *Case:* "You must eat a bug to save a life. You can only do it if you desire to. So you have a reason to desire to eat the bug." -> This is often cited as a case where pragmatic reasons *might* be right-kind for *instrumental* desires, or at least it complicates the picture.
      *   *Better Case for WKR:* "The Demon offers you $1M to believe the sky is green." (Clearly WKR).
      *   *Better Case for RKR:* "You should believe the sky is blue because it is."
      *   *Tricky Case:* "You should believe your spouse is faithful because believing it keeps the marriage together (and they actually are faithful, but you lack evidence)." -> This hits the Trust/Pascal nerve.

      Let's finalize the 8 cases to ensure a good spread.
      1.  Demon/Admiration (Classic WKR)
      2.  Evidence/Belief (Classic RKR)
      3.  Bug/Desire (Instrumental/Constitutive)
      4.  Cliff/Fear (Safety vs. Fittingness)
      5.  Pascal/Belief (High Stakes Pragmatic)
      6.  Therapist/Resentment (Well-being)
      7.  Auction/Bidding (Strategic Desire)
      8.  Grief/Functionality (Social Pragmatic)

      Okay, ready to write.

      *Wait, one more check on the "Candid Note".* What can't this activity do? It can't solve the "circularity" problem (defining fittingness without using reasons). It can't easily distinguish State-Given vs. Object-Given without technical jargon. I should note that.

      *Timing Check:*
      Intro: 5
      Case Sort: 25
      Rule Making: 25
      Counter-Example Swap: 25
      Debrief: 30
      Total: 110 mins. Perfect.

      Let's assemble.
answer: |-
  Here is a complete seminar plan designed to generate the "Wrong Kind of Reasons" (WKR) problem organically.

  ### Seminar Title: The Laws of Rationality
  **Time:** 110 Minutes
  **Students:** 10 (Graduate Level)
  **Goal:** To induce the intuition that some reasons for attitudes are "illegitimate" without providing the vocabulary to explain why, thereby motivating the reading.

  ---

  ### Part 1: The Case Set (Handout)
  *Print these on a single sheet. Instruct students that for each case, they must decide: **Is the reason provided a valid reason for holding the attitude?** (Yes/No/Maybe).*

  1.  **The Demon's Demand (Admiration):** An evil demon will torture you unless you admire him. He is, in fact, cruel and pathetic. You have a strong self-interested reason to admire him.
  2.  **The Blue Sky (Belief):** You look out the window and see a clear blue sky. You have visual evidence that the sky is blue.
  3.  **The Bug Challenge (Desire):** To win a contest, you must eat a live bug. You will only be able to swallow it if you genuinely *desire* to eat it. You want to win. You have a reason to desire to eat the bug.
  4.  **The Unsafe Bridge (Fear):** You are crossing a sturdy bridge. However, if you do not feel fear, you will walk too casually and trip. You have a safety-based reason to feel fear.
  5.  **Pascal's Wager (Belief):** You have no evidence for God's existence. However, if you believe, you gain infinite reward; if you don't, you risk infinite punishment. You have a pragmatic reason to believe.
  6.  **The Therapist's Advice (Resentment):** Your partner wronged you. Resentment is fitting. However, holding onto resentment is destroying your mental health. A therapist gives you reasons to stop resenting them.
  7.  **The Auction Strategy (Desire):** You are at an auction. To bid rationally on a painting, you must desire it. You don't actually like the painting, but you desire it instrumentally to drive up the price for a client.
  8.  **The Grieving Widow (Grief):** A widow continues to grieve. It is fitting she grieve. However, her grief prevents her from caring for her children. She has a reason to cease grieving.

  ---

  ### Part 2: Procedure & Timing

  #### 1. Introduction (5 Minutes)
  *   **Instructor:** "Today we are legislators. We are writing the 'Laws of Rationality.' Your job is to determine when a reason counts as a valid justification for a mental state (belief, desire, emotion) and when it does not. We are not looking for what people *do*, but what they *ought* to do."
  *   **Task:** Distribute cases. Students read silently.

  #### 2. The Sorting Phase (25 Minutes)
  *   **Grouping:** Split into 5 pairs.
  *   **Task:** For each of the 8 cases, agree on a verdict: **Valid** (This is a good reason for the attitude) or **Invalid** (This is a cheat/bad reason).
  *   **Constraint:** You must agree. If you disagree, mark it "Contested" and note why.
  *   **Instructor Role:** Circulate. Listen for phrases like "It's about the object," "It's about consequences," "It's about truth." Do not correct them.

  #### 3. The Principle Drafting (25 Minutes)
  *   **Grouping:** Merge pairs into two groups of 5.
  *   **Task:** Look at your "Valid" column and your "Invalid" column. Write **one single principle** that explains the difference.
      *   *Template:* "A reason R is a valid reason for Attitude A toward Object O if and only if _______."
  *   **Challenge:** The principle must cover beliefs, desires, and emotions. It cannot just say "because it's true" (doesn't work for desire) or "because it's good" (doesn't work for fear/demon).
  *   **Output:** Write the principle on the board.

  #### 4. The Stress Test (25 Minutes)
  *   **Task:** Group A attacks Group B's principle; Group B attacks Group A's.
  *   **Method:** Use the "Contested" cases or modify a case slightly to break the opponent's principle.
      *   *Example Prompt:* "Your principle says reasons must relate to the 'object.' In the Bug Case, the reason relates to winning the contest, not the bug. But you marked it Valid. Explain."
      *   *Example Prompt:* "Your principle says reasons can't be about 'benefits.' In the Bridge Case, safety is a benefit. But fear is about danger. Explain."
  *   **Goal:** Force them to see that their definitions are either too broad (allowing the Demon) or too narrow (excluding the Bug).

  #### 5. Debrief & Mapping (30 Minutes)
  *   **Instructor:** Lead a plenary discussion connecting their struggles to the literature (see Debrief Notes below).
  *   **Closing:** Assign the reading (e.g., Parfit, D'Arms & Jacobson, or Hieronymi) as the "solution key" to the puzzle they just failed to solve.

  ---

  ### Part 3: Debrief Notes (Instructor Guide)

  *Use this to map their intuitive struggles to specific philosophical distinctions.*

  **1. The "Object" Intuition (Fittingness)**
  *   *Student Move:* They will likely reject the **Demon (1)** and **Pascal (5)** cases, saying the reason doesn't have to do with the *demon* or *God*, but with the *consequences of believing*.
  *   *Philosophical Terrain:* This is the **Object-Given vs. State-Given Reasons** distinction (Parfit). Object-given reasons bear on the object (the demon is admirable); state-given reasons bear on the state (having the attitude is beneficial).
  *   *The Trap:* Students will struggle to articulate *why* state-given reasons are invalid for admiration but valid for the **Bug (3)**.

  **2. The "Truth/Correctness" Condition**
  *   *Student Move:* For **Belief (2 & 5)**, they will insist on evidence/truth. For **Fear (4)**, they might accept safety over truth (the bridge isn't dangerous, but fear is useful).
  *   *Philosophical Terrain:* **Constitutive Aims of Attitudes** (Shah & Velleman). Belief "aims at truth." Fear "aims at danger." If the aim is constitutive, pragmatic reasons violate the aim.
  *   *The Trap:* The **Bug (3)** and **Auction (7)** cases show that desires/intentions often *do* accept pragmatic reasons. Why does Belief differ from Desire? This motivates the **Normative Kind** distinction.

  **3. The "Fittingness" vs. "Rationality" Split**
  *   *Student Move:* In **Resentment (6)** and **Grief (8)**, students will feel torn. It's *fitting* to resent/grieve, but *rational/prudent* to stop.
  *   *Philosophical Terrain:* **D'Arms & Jacobson (Fittingness vs. Rationality).** An attitude can be fitting (object warrants it) but irrational (all-things-considered reasons forbid it).
  *   *The Trap:* If they define "Valid Reason" as "All-things-considered reason," the Demon wins. If they define it as "Fittingness reason," the Therapist loses. They need to distinguish the *normative domain*.

  **4. The Circularity Problem**
  *   *Student Move:* Their final principle will likely be: "A reason is valid if it makes the attitude appropriate/fitting/correct."
  *   *Philosophical Terrain:* **The Circularity Objection.** "Fitting" just means "there is a right-kind reason for it." They have defined the term using itself.
  *   *The Trap:* This is the hardest part of the literature. The activity shows *that* there is a distinction, but fails to define *what* the distinction is without circularity.

  ---

  ### Part 4: Candid Note on Limitations

  **What this activity does well:**
  *   It creates a shared phenomenological experience. Everyone *feels* the weirdness of the Demon case before they learn the term "Wrong Kind of Reasons."
  *   It successfully distinguishes Epistemic norms (Belief) from Practical norms (Desire) in a messy way that mirrors real life.
  *   It exposes the "All-Things-Considered" trap (i.e., confusing "I ought to believe" with "It would be good if I believed").

  **Where it will fail (and why that's okay):**
  *   **The "Bug" Case Ambiguity:** Students may argue that in the Bug Case, you don't actually desire the *bug*, you desire *to eat the bug*. This distinction (de re vs. de dicto desire) might derail the WKR point. *Instructor Fix:* If they get stuck here, grant the point and move to the **Auction (7)** case, which is structurally similar but clearer.
  *   **Technical Precision:** Students will not discover the "State-Given vs. Object-Given" distinction on their own. They will describe it loosely ("reasons about the thing" vs. "reasons about having the thought"). Do not expect them to solve the circularity problem.
  *   **The "Right Kind" Positive Account:** The activity is better at identifying Wrong Kind Reasons than explaining what makes a Right Kind Reason *right*. They will likely default to "Truth" or "Goodness," which fails for emotions like Fear (which targets danger, not goodness).

  **Contingency Plan:**
  If the groups finish the Principle Drafting too quickly (under 15 mins), introduce the **"Self-Fulfilling Belief"** twist: *"You believe you will succeed at a task. Because you believe it, you relax and actually succeed. Do you have a reason to believe you will succeed?"* This breaks the "Evidence = Only Valid Reason" rule and forces them to confront Pragmatic Encroachment.
