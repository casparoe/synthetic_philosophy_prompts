answer: |-
  This is a classic problem in the philosophy of biology: the **Demarcation Problem**. Your intuitions are actually quite sophisticated; they align closely with what is often called the **"Organizational Account"** of life, mixed with a distinction between *cellular life* and *organismal death*.

  Your current working principle ("bounded system + metabolism") fails because it treats life as a flat property. It doesn't distinguish between a system that is *metabolically active* (a brain-dead body) and a system that is *organizationally autonomous* (an *E. coli*). It also doesn't distinguish between a *part* that is alive (HeLa cells) and the *whole* that is dead (Henrietta Lacks).

  To capture your gut reactions, we need a principle that prioritizes **organizational closure** over reproduction, and **autonomy** over mere metabolic activity.

  Here is the principle that best fits your verdicts, followed by the analysis you requested.

  ### The Principle: The Autonomous Cellular Organization (ACO) Account

  **X is alive if and only if:**
  1.  **Boundedness:** X is a physically distinct unit separated from its environment by a self-maintained boundary (membrane/wall).
  2.  **Dispositional Metabolism:** X contains the intrinsic molecular machinery to harvest energy and synthesize components to maintain that boundary (even if currently dormant or dependent on a host for raw substrates).
  3.  **Regulatory Autonomy:** X's division and metabolic regulation are controlled by its own internal genetic/chemical logic, not by the genome of a larger host system.

  **AND (The Categorical Distinction):**
  *   **"Alive"** is a predicate applied to **biological tissues and cells**.
  *   **"Dead"** is a predicate applied to **multicellular organisms**.
  *   *Therefore, an organism can be dead while its constituent cells remain alive.*

  ---

  ### Why Each Clause Exists (Case Mapping)

  **1. Boundedness (Forced by: Naked RNA & Prions)**
  *   **The Case:** Self-replicating RNA and Prions.
  *   **The Logic:** You marked these as *not alive*. Both replicate and propagate information, but neither has a "self." Without a membrane, there is no "inside" to protect from entropy. This clause excludes them immediately.
  *   **The Cost:** This makes the boundary essential. If a system replicates but has no skin, it's chemistry, not life.

  **2. Dispositional Metabolism (Forced by: Endospores & Mules)**
  *   **The Case:** The Endospore (dormant) and the Mule (sterile).
  *   **The Logic:**
      *   *Endospore:* If life required *active* metabolism, the spore would be dead. By specifying *dispositional* (the machinery is there, ready to run), you keep the spore alive.
      *   *Mule:* If life required *reproduction*, the mule would be dead. By focusing on *metabolism/maintenance* rather than propagation, the mule stays alive.
  *   **The Contrast:** This excludes the Virus (TMV). A virus has no metabolic machinery of its own; it is purely genetic instruction + coat. It cannot "pause" its metabolism because it never had any.

  **3. Regulatory Autonomy (Forced by: Mitochondria vs. Rickettsia)**
  *   **The Case:** This is the hardest one. *Rickettsia* (Alive) vs. Mitochondrion (Not Alive).
  *   **The Logic:** Both have DNA, ribosomes, and membranes. Both live inside hosts. The difference is **who is in charge**.
      *   *Rickettsia:* Its division and metabolic rate are regulated by *its own* bacterial genome. It is a tenant who locks the door.
      *   *Mitochondrion:* Its division is regulated by the *host cell's* nucleus. It is an appliance plugged into the wall.
  *   **The Result:** This clause saves you from calling organelles "alive." They are living *parts*, but not living *units*.

  **4. The Categorical Distinction (Forced by: HeLa & Brain-Death)**
  *   **The Case:** HeLa cells (Alive) / Henrietta Lacks (Dead) and the Brain-Dead Patient.
  *   **The Logic:** Your gut tells you the cells are humming along, but the *person* is gone. Standard definitions often trip here, trying to say the body is "dead" implies no biology is happening.
  *   **The Result:** This clause validates your intuition that "there is something alive in that bed." The *tissues* satisfy clauses 1–3. The *organism* (the integrated whole regulated by the brain) does not. Death is the loss of systemic integration, not the cessation of cellular life.

  ---

  ### Which Verdicts This Principle Cannot Accommodate

  No principle is perfect. Here is where the ACO Account conflicts with standard biological discourse or your own lingering doubts:

  **1. The Virus Intuition (TMV)**
  *   **The Tension:** You said TMV "bugs you" because it does something lifelike.
  *   **The Verdict:** Under ACO, Viruses are definitively **Not Alive**. They fail Clause 2 (Metabolism) and Clause 3 (Autonomy).
  *   **The Cost:** You have to accept that viruses are "biological entities" but not "living organisms." Some biologists hate this; they want to say giant viruses are alive. Your gut says no, so this principle fits you, but be aware it's a contentious line in the field.

  **2. The "Synthetic" Intuition**
  *   **The Tension:** You marked the Synthetic Minimal Cell as alive.
  *   **The Verdict:** ACO says **Alive**, provided it meets Clause 3.
  *   **The Cost:** If the synthetic cell is remotely controlled by a computer to divide, it might fail Clause 3 (Regulatory Autonomy). It must be self-regulating to count.

  **3. The "Mule" Evolutionary Status**
  *   **The Tension:** Many biologists define life as "a system capable of Darwinian evolution."
  *   **The Verdict:** ACO says the Mule is **Alive**.
  *   **The Cost:** You must reject "evolvability" as a *necessary* condition for an individual's life. Evolution is a property of *lineages*, not individuals. Your gut already accepts this, but it puts you at odds with evolutionary definitions of life.

  ---

  ### The Test Case: The Lab-Made Protocell

  **The Case:** A lipid vesicle with a self-replicating RNA and a few enzymes inside, but it **cannot make its own lipids** and has to be fed them.

  **Applying the ACO Principle:**

  1.  **Boundedness:** **Pass.** It has a lipid vesicle.
  2.  **Dispositional Metabolism:** **Partial Pass.** It has enzymes and replicating RNA. It does *work*.
  3.  **Regulatory Autonomy:** **Fail (Critical).**
      *   *The Issue:* Clause 1 requires a "self-maintained boundary." If the system cannot synthesize the material of its own boundary, it is not organizationally closed. It is like a factory that can make cars but cannot repair its own roof; when the roof leaks, the factory dies unless an external agent (you) fixes it.
      *   *Comparison:* *Rickettsia* imports *precursors* (atoms), but it has the genes to assemble the membrane. Your protocell lacks the *capacity* to assemble the membrane; it relies on the experimenter to supply the structural integrity.

  **Verdict:** **Not Alive (yet).**
  Under your principle, this protocell is a **semi-living system** or a **replicating chemical system**. It is closer to the virus than the *E. coli*. It crosses the threshold into "Alive" only when it encodes the machinery to synthesize its own boundary components (lipids), thereby achieving **organizational closure**.

  ### Summary for Your Use
  If you need to defend this view, state it this way:
  > *"Life is not defined by reproduction, but by **organizational closure**. An entity is alive if it is a bounded unit that maintains its own structure through internal metabolic processes under its own regulatory control. This allows sterile individuals and dormant spores to be alive, excludes viruses and organelles, and acknowledges that cellular life can persist after organismal death."*

  This captures your gut, resolves the HeLa/Brain-Dead paradox, and gives you a sharp knife to cut the protocell case.
