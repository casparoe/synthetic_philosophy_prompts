  4.  **Analyze Sentence 2 (Responsibility/Blame):**
      *   *Claim:* If you lie and friend dies, you are responsible.
      *   *Kantian View:* Kant explicitly argues this. If you lie, you enter the realm of consequences. If the murderer leaves, finds the friend elsewhere, and kills them, your lie contributed causally. You are legally/morally accountable for the unforeseen consequences of your violation of duty.
      *   *Claim:* If you tell the truth, you are blameless.
      *   *Kantian View:* Yes. You fulfilled your duty. The murderer's action is their own imputable deed. You cannot control the free will of another.
