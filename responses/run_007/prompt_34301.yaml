      *   **Tone:** Respectful, nuanced, scholarly but accessible. Acknowledge the commonality of the critique while providing the deeper Kantian context.

  2.  **Deconstruct the Provided Summary:**
      *   *Sentence 1:* "Kant held that lying is absolutely forbidden, so when a would-be murderer asks whether your friend is hiding in your house, you are morally required to tell him the truth, even though this means betraying your friend."
