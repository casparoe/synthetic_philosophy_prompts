      *   *Claim:* Morally required to tell the truth to the murderer.
      *   *Kantian View:* This is the core of the 1797 essay "On a Supposed Right to Lie from Philanthropy." Kant argues against Benjamin Constant, who suggested exceptions for malicious intent. Kant says truthfulness is a formal duty, not dependent on consequences.
      *   *Nuance:* "Betraying your friend" is a strong phrase. Kant would say you aren't betraying them; you are fulfilling a duty to humanity/law. But descriptively, the outcome is betrayal.
