      *   **Form:** Villanelle (19 lines, 5 tercets + 1 quatrain, 2 rhymes, 2 refrains).
      *   **Topic:** The Two-Envelope Paradox.
      *   **Refrains:**
          *   Refrain 1 (A1): The voice arguing *for* switching (Expected Value argument).
          *   Refrain 2 (A2): The voice arguing *against* switching (Symmetry argument).
      *   **Structure/Effect:** The refrains should alternate/circle, never resolving until the end. The final couplet (last two lines) should bring them together, feeling like a tightening knot rather than a solution.
      *   **Content:** Do not name-drop the paradox. The reasoning must be embedded in the poem (math/logic vs. intuition/symmetry).
      *   **Audience:** Someone who knows the problem should recognize the arguments immediately.

  2.  **Deconstruct the Two-Envelope Paradox:**
      *   **Setup:** You have two envelopes. One contains $X$, the other $2X$. You pick one (call it $A$). You are offered to switch to $B$.
      *   **Argument for Switching (EV):** Let $A$ contain amount $Y$. Then $B$ contains either $Y/2$ or $2Y$ with equal probability (0.5). Expected Value of $B = 0.5(Y/2) + 0.5(2Y) = 0.25Y + 1.0Y = 1.25Y$. Since $1.25Y > Y$, you should switch.
      *   **Argument against Switching (Symmetry):** The situation is symmetric. Before opening, both envelopes are identical. If switching is always better, you should switch back once you have the new one. Infinite switching makes no sense. The total money is fixed ($3X$). Switching doesn't change the total.
      *   **The Knot:** The calculation seems sound (1.25 > 1), but the conclusion is absurd (always switch). The error lies in treating the variable $Y$ as fixed when it actually depends on which envelope you picked (it's either $X$ or $2X$, not a constant independent of the choice).

