prompt: |-
  I keep hearing the Humean and anti-Humean camps on laws of nature talk past each other — one side says laws are just the best summary of the mosaic of local facts, the other says no, laws are what make things happen, they govern. I want the document these two people should have produced after actually doing an adversarial collaboration, instead of another fifteen years of talking past each other.

  Write the joint statement a sophisticated Humean (roughly the Mill–Ramsey–Lewis best-system view) and a sophisticated anti-Humean (laws as real nomic facts, relations between universals, or governing — the Armstrong/Dretske/Tooley sort, or a powers view) could both sign. It should include:

  - a numbered list of claims both sides can sign. Not "we both believe in physics" filler — the real shared ground: what a law has to do that an accidentally true generalization doesn't, what the standard arguments leave open, what the debate is not about.
  - a disagreements table. For each remaining difference: the claim stated once in wording the Humean would accept as a fair statement of their own view, once in wording the anti-Humean would accept as theirs, plus a neutral statement of the question they split on.
  - the cruxes: the sub-questions such that settling them would move at least one side. I'd expect something about whether best-system laws can explain their instances or only codify them, whether the mosaic could have differed while the laws stayed fixed, and whether "nomic necessity" is a real addition to the facts or a projection of our systematizing. If you think one of those is a red herring, say so and replace it with a better one.
  - for each crux, the case, argument, or thought-experimental setup both sides would agree bears on it, with each side's prediction recorded in advance.

  The hard part is wording things so neither side winces at it's own column, and not smuggling in a verdict. If you conclude part of the dispute is verbal — say, over what "explain" or "govern" means — put that in its own subsection and say exactly which part is verbal.

  End with a short note on where you're least confident in your formulations, and where a real Humean or anti-Humean might refuse to sign. And if the framing itself is off — for instance if you think "anti-Humean" lumps together views that shouldn't share a column — tell me that plainly instead of forcing the document.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Create a joint statement document resulting from an adversarial collaboration between a sophisticated Humean (Best System Analysis - BSA) and a sophisticated Anti-Humean (Governing/Nomic Realism).
      *   **Tone:** Philosophical, precise, charitable, avoiding "talking past each other," no filler.
      *   **Components:**
          1.  Numbered list of shared claims (substantive agreement).
          2.  Disagreements table (Humean phrasing, Anti-Humean phrasing, Neutral question).
          3.  Cruxes (sub-questions that would move the needle), including agreed-upon tests/thought experiments and predicted outcomes.
          4.  Verbal dispute subsection (if applicable).
          5.  Confidence note/Critique (where the framing might fail).
      *   **Constraint:** Do not smuggle in verdicts. Ensure neither side winces at their own description. Acknowledge if "Anti-Humean" is too broad a category.

  2.  **Deconstruct the Positions:**
      *   **Humean (BSA):** Laws are summaries of the "Humean Mosaic" (spatiotemporal distribution of local qualities). They supervene on the mosaic. No modal oomph. Explanation is systematization.
      *   **Anti-Humean (Governing/Realist):** Laws are ontologically distinct from the mosaic. They constrain or produce the mosaic. Modal force is real. Explanation is derivation from governing principles.
      *   **Common Ground:** Both want to account for scientific practice, counterfactuals, induction, and the difference between laws and accidents. Both reject occasionalism or divine intervention in the immediate sense. Both accept standard physics as the data source.

  3.  **Drafting Section 1: Shared Claims (The "Modus Vivendi"):**
      *   Need to avoid "we both like science."
      *   Focus on the *role* of laws.
      *   1. *Support for Counterfactuals:* Laws support counterfactuals; accidents don't. (Both agree this is a *feature* laws must have, even if they disagree on *why*).
      *   2. *Explanatory Priority:* Laws explain particular facts, not vice versa (in scientific practice).
      *   3. *Objective Distinction:* There is an objective fact of the matter about what the laws are (not just pragmatic convenience).
      *   4. *Supervenience Base:* There is a categorical base of particular matters of fact (the "mosaic" or "manifest image") that theories must account for. (Anti-Humeans might balk at "supervene," so phrase carefully: "There exists a distribution of local qualities in spacetime").
      *   5. *Non-Triviality:* Laws are not tautologies; they could have been otherwise (conceptually).

      *Refinement:* Anti-Humeans might reject "Objective Distinction" if they think it's metaphysical but Humeans think it's pragmatic. Let's stick to the *function*.
      *Revised 1:* Laws support counterfactual reasoning differently than accidental generalizations.
      *Revised 2:* Scientific practice treats laws as explanatory of instances.
      *Revised 3:* The distinction between law and accident is not merely linguistic.
      *Revised 4:* There is a total distribution of local qualitative facts in spacetime. (Humeans call this the supervenience base; Anti-Humeans call this the effect or manifestation).
      *Revised 5:* Modality is involved in the *concept* of law (necessity, possibility).

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need three columns: Humean Statement, Anti-Humean Statement, Neutral Question.
      *   *Issue 1: Ontological Status.*
          *   H: Laws are descriptive summaries.
          *   AH: Laws are prescriptive constraints.
          *   Q: Do laws add ontological category beyond the mosaic?
      *   *Issue 2: Direction of Fit.*
          *   H: Mosaic determines Laws.
          *   AH: Laws determine (partially) Mosaic.
          *   Q: What is the metaphysical grounding direction?
      *   *Issue 3: Modality.*
          *   H: Modality is projected/useful.
          *   AH: Modality is mind-independent.
          *   Q: Is nomic necessity a feature of the world or the theorist?

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific tests where predictions diverge.
      *   *Crux 1: The Empty Universe / Lonely Particle.*
          *   Setup: A universe with one particle or no particles. Are there laws?
          *   H: No (no system to summarize). Or trivial laws.
          *   AH: Yes (dispositions exist even if unmanifested).
          *   *Critique:* Humeans can handle this with "best system for that world." Maybe too technical.
      *   *Crux 2: Explanation of Regularity.*
          *   Setup: Why does the mosaic exhibit this regularity?
          *   H: It just does; asking "why" beyond the system is category error.
          *   AH: Because the law constrains it.
          *   *Test:* Inference to Best Explanation (IBE). Does positing a governing law increase explanatory power enough to justify ontological cost?
      *   *Crux 3: Humean Recombination.*
          *   Setup: Could the laws stay the same if the mosaic were different?
          *   H: No (supervenience).
          *   AH: Yes (laws are distinct existences).
          *   *Test:* Intuition pump on "Same Law, Different History."
      *   *Selection:* Let's go with *Supervenience Failure* (The "Big Bad Bug" style), *Explanatory Depth* (IBE), and *Unmanifested Powers*.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   "Govern" is the big one. Humeans think it implies agency/magic. Anti-Humeans think it implies constraint.
      *   "Explain." Humeans = unify/systematize. Anti-Humeans = ontological grounding.
      *   Need to isolate this clearly.

  7.  **Drafting Section 5: Confidence/Critique:**
      *   "Anti-Humean" is a bucket (Armstrong vs. Powers vs. Primitivism). They disagree among themselves.
      *   Humeans vary (Lewis vs. Hicks).
      *   The "Shared Claims" might be too thin for some hardliners.

  8.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I make the Humean sound too instrumentalist? They are realists about the *truth* of the laws, just not the *ontology*.
      *   *Check:* Did I make the Anti-Humean sound like they believe in magic? Need to emphasize "metaphysical grounding" not "little pushers."
      *   *Check:* Is the "Neutral Question" actually neutral?
      *   *Adjustment:* In the Disagreements Table, ensure the Humean column doesn't sound dismissive ("just summaries") but accurate ("systematic descriptions"). Ensure Anti-Humean doesn't sound mystical ("make things happen") but structural ("ground the regularities").
      *   *Crux Refinement:* The "Empty Universe" case is good because it tests supervenience directly. The "Explanation" case tests IBE. The "Recombination" case tests modal intuition.

  9.  **Final Polish:** Check tone. It should read like a formal philosophical accord. Use standard terminology (Supervenience, Grounding, Mosaic, Nomic).

      *(Self-Correction on "Anti-Humean" label)*: The prompt asks me to say if the framing is off. I should note in the final section that "Anti-Humean" conflates Primitivists (Maudlin) with Relationists (Armstrong) and Powerists (Bird). I will write the document assuming a "Governing/Realist" core but note the divergence in the critique.

      *(Self-Correction on Shared Claims)*: Claim 3 ("Objective fact of the matter") is tricky. Humeans think it's objective *given the mosaic and our standards of simplicity/strength*. Anti-Humeans think it's objective *independent of us*. I need to phrase it so both accept there's a *truth* to be had, not just opinion. "There are truth-apt claims about which statements are laws."

      *(Refining the Cruxes)*: Make sure the "Prediction" isn't just "We say X." It needs to be "We predict that upon analysis of case Y, intuition Z will hold."

      *(Verbal Dispute)*: Be specific. "Govern" is the main suspect.

  10. **Final Output Generation** (incorporating all constraints).

  **(Post-Drafting Check against constraints):**
  - Numbered list of shared claims? Yes.
  - Disagreements table (H, AH, Neutral)? Yes.
  - Cruxes with tests/predictions? Yes.
