answer: |-
  When pain is present, it is counted bad,
  And pleasure's presence is a distinct good.
  But if the pain is absent, good is had,
  Even where no living soul has ever stood.
  Now weigh the lack of pleasure on the scale,
  It holds no weight of sorrow or regret,
  Unless a subject exists to mark the fail,
  The void of joy no debt can thus beget.

  But set the born against the never-made,
  Where pain's absence is good though none are there,
  While life must buy its bliss with pain's sharp blade,
  And missing joy leaves no one to despair.
  The empty crib retains the cleaner score,
  And birth is but a debt we settle sore.
