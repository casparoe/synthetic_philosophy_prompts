      *   **Goal:** Create a structured interview protocol/decision tree for supervision.
      *   **Requirements:**
          *   Honest about conceptual difficulties (don't paper over the paradox).
          *   Draw on philosophy and cognitive science (motivated reasoning, partitioned beliefs, etc.).
          *   Distinguish self-deception from neighboring phenomena.
