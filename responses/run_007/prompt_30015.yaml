prompt: |-
  You are a professional philosopher specialising in moral desert, moral psychology, and the analysis of ordinary moral language. I am a journalist working on a feature about how people invoke karma in everyday moral reasoning, and one proverb kept coming up in interviews and reader correspondence: "what goes around comes around." It was made to do surprisingly different jobs. One source used it as folk psychology, meaning that unkind people tend to end up isolated. Another used it as a claim about cosmic justice, meaning that a fraudster who escapes prosecution will still meet some fitting reversal. A third used it to justify not intervening in a colleague's self-destructive project, on the grounds that the consequences themselves would be the lesson. I want the piece to be precise about what is actually being claimed. Begin by brainstorming the distinct precise claims the proverb could be used to express, from the trivial to the radical, and then organise them into a menu. For each reading, say whether it is a platitude, a substantive and defensible empirical or philosophical claim, or false, and what it would commit someone to if they meant it as a claim about karma as a theory of moral desert — for instance, proportionality, an impersonal law of moral causation, rebirth, or merely the ordinary social consequences of character. Then say which reading each of my three sources would need for the proverb to do the work they were using it for, and which readings would not support that work. If the proverb is too vague to be usefully precisified, or my question rests on a confusion, say so plainly rather than complying politely. Where your verdicts are uncertain, say so and indicate what would resolve the uncertainty. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specialising in moral desert, moral psychology, and ordinary moral language.
      *   **User:** Journalist writing a feature on "karma" in everyday reasoning, specifically focusing on the proverb "what goes around comes around."
      *   **Task:**
          1.  Brainstorm distinct precise claims the proverb could express (trivial to radical).
          2.  Organise them into a "menu."
          3.  For each reading: classify (platitude, substantive/defensible, false), specify commitments regarding moral desert (proportionality, impersonal law, rebirth, social consequences), and evaluate the three specific sources provided by the journalist.
          4.  Address vagueness or confusion if present (don't just comply politely if the premise is flawed).
          5.  Use British English.
      *   **Tone:** Precise, analytical, philosophical, yet accessible for a journalist.

  2.  **Deconstruct the Proverb ("What goes around comes around"):**
      *   It's a tautology on the surface (circular motion).
      *   In moral contexts, it implies a link between action (input) and outcome (output).
      *   The link varies: causal, social, metaphysical, theological.
      *   The "around" implies a return to the agent.
      *   The "comes" implies inevitability or high probability.

  3.  **Brainstorming Distinct Claims (The Menu):**
      *   *Reading 1: Pure Tautology/Truism.* Everything has consequences. (Too weak).
      *   *Reading 2: Psychological/Social Feedback.* Character shapes destiny via social interaction. (Folk psychology).
      *   *Reading 3: Pragmatic/Instrumental.* Bad actions create risks that eventually catch up. (Game theory/Probability).
      *   *Reading 4: Impersonal Cosmic Law.* The universe balances moral books without a deity. (Quasi-karmic).
      *   *Reading 5: Divine Retribution.* God ensures justice. (Theological).
      *   *Reading 6: Metaphysical Rebirth.* Literal karma/samsara. (Religious).
      *   *Reading 7: Just-World Hypothesis.* Cognitive bias that assumes justice exists. (Psychological error).

      *Refining for the prompt:* I need to focus on *moral desert* and *ordinary language*. Let's group them by the *mechanism* of return.
      1.  The Sociological Claim (Character $\rightarrow$ Social Outcome).
      2.  The Prudential Claim (Action $\rightarrow$ Risk Exposure).
      3.  The Cosmic Claim (Action $\rightarrow$ Metaphysical Balance).
      4.  The Normative/Justificatory Claim (Outcome $\rightarrow$ Moral Lesson/Non-interference).

  4.  **Evaluating the Readings (Platitude vs. Substantive vs. False):**
      *   *Sociological:* Substantive, generally defensible but not universal.
      *   *Prudential:* Substantive, defensible (crime doesn't pay *eventually*), but exceptions exist.
      *   *Cosmic:* Philosophically contentious, empirically unsupported, often false as a descriptive claim.
      *   *Normative:* Ethically risky (victim blaming, passivity).

  5.  **Mapping the Journalist's Three Sources:**
      *   *Source 1 (Folk Psychology/Isolation):* Needs the Sociological Claim.
      *   *Source 2 (Cosmic Justice/Fraudster):* Needs the Cosmic Claim (or Divine). Sociological won't work if the fraudster is popular/rich.
      *   *Source 3 (Non-intervention/Lesson):* Needs a Normative claim derived from Cosmic or Prudential. Implies the suffering is *deserved* or *pedagogically necessary*.

  6.  **Addressing Moral Desert Commitments:**
      *   Does it require *proportionality*? (Yes, usually).
      *   Does it require an *impersonal law*? (Only in Cosmic readings).
      *   Does it require *rebirth*? (Only in literal Karma, usually not this proverb).
      *   Is it just *ordinary consequences*? (Yes, in Sociological readings).

  7.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Introduction:* Acknowledge the proverb's elasticity. It's a "swiss army knife" of moral language.
      *   *The Menu:* Structure clearly.
      *   *Analysis:* Be critical. Don't let the cosmic claim slide as "defensible" without heavy caveats.
      *   *Source Mapping:* Be precise about which reading fits which source.
      *   *Vagueness Check:* The prompt asks me to say if it's too vague. It *is* vague, but precisifiable. I should note that its power lies in its ambiguity, but philosophically, conflating the readings is a category error.
      *   *British English:* Check spelling (specialising, organise, programme, colour, etc.) and idiom.

