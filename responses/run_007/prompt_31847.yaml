answer: |-
  This is a sophisticated request. You are asking to move *anekāntavāda* (the doctrine of many-sidedness) from a metaphysical principle to a facilitation technology. This is dangerous if done superficially, as it easily devolves into "everything is relative" (which Jainism explicitly rejects) or a coercive tactic to force compromise (which violates *ahimsa*, non-violence).

  Below is the **Saptabhaṅgī Facilitation Protocol**. It is designed to operationalize the seven-fold predication of Jain logic into a modern dialogue structure. It includes the philosophical guardrails, the concrete steps, and the application to your two cases.

  ---

  ### Part 1: Philosophical Guardrails & Commitments

  Before using this procedure, you must accept its ontological commitments. If you or the parties cannot accept these, the procedure will fail.

  1.  **It is not Relativism:** *Anekāntavāda* posits that reality is complex, not that all claims are equally true. A claim that denies the existence of the other party (e.g., "Indigenous rights do not exist") is not a valid *naya* (standpoint); it is *ekānta* (one-sided absolutism) and is epistemically false within this framework.
  2.  **It is not Compromise:** The goal is not to meet in the middle. The goal is to accurately map the geometry of the truth. Sometimes the map reveals that the parties are further apart than they thought.
  3.  **The Ahimsa Constraint:** In Jainism, epistemology is ethical. If holding a standpoint requires *himsa* (violence/coercion) to sustain, that standpoint is epistemically deficient. You cannot facilitate a *naya* that relies on the erasure of the other.
  4.  **The Procedure's Bias (Flag):** This protocol assumes that **language is sufficient to capture experience.** It assumes parties are willing to distinguish between *what is* and *how they see what is*. A party rooted in revelation, divine command, or pure power dynamics may reject the premise that their truth is conditional (*syāt*).

  ---

  ### Part 2: The Saptabhaṅgī Facilitation Protocol

  #### Phase 1: Prep (Mapping the Nayas)
  **Goal:** Identify the partial standpoints before the parties enter the room.
  **Action:**
  1.  Interview each side separately.
  2.  Ask: "What is the specific context in which your claim is 100% true?"
  3.  Draft a *Naya Statement* for each core claim.
      *   *Bad:* "We need safety."
      *   *Good:* "From the standpoint of clinical volume statistics, centralization increases safety."

  *   **Exit Condition:** You can articulate each party's core claim with a "From the standpoint of..." prefix that they agree accurately reflects their view.
  *   **Stopping Condition:** A party insists their claim is true *absolutely*, without context, and refuses to entertain that it might be partial. (Hand to judgment: This is a power struggle, not a dialogue).

  #### Phase 2: Opening (Establishing Syāt)
  **Goal:** Install the conditional qualifier into the room's grammar.
  **Action:**
  1.  Set the ground rule: "In this room, we speak in *syāt*. We do not say 'X is true.' We say 'In some respect, X is true.'"
  2.  Model it immediately. "My standpoint as facilitator is *syāt*: I can manage the process, but I cannot determine the outcome."

  *   **Exit Condition:** Parties begin to self-correct their language (e.g., "Well, from our perspective...").
  *   **Stopping Condition:** A party uses absolute language to delegitimize the other (e.g., "That is a lie"). Issue one correction. If repeated, pause the session.

  #### Phase 3: Dialogue (The Seven Predications)
  **Goal:** Move through assertion, negation, and inexpressibility.
  **Action:**
  1.  **Affirmation (Syāt asti):** Have Party A state their truth. Party B must repeat it back *as true within that context*.
  2.  **Negation (Syāt nāsti):** Have Party B state why that truth is *not* the whole truth. Party A must acknowledge the validity of the negation *within its context*.
  3.  **Inexpressibility (Syāt avaktavya):** Ask the joint question: "What is true about this situation that *neither* of your standpoints can capture?"

  *   **Exit Condition:** Both parties acknowledge the validity of the other's *naya* without conceding their own. They agree on the *limits* of each other's truth.
  *   **Stopping Condition:** One party demands the other abandon their *naya* as a condition of continuing. (Hand to judgment: This is a negotiation/ultimatum, not dialogue).

  #### Phase 4: Closing (Integration without Synthesis)
  **Goal:** Acknowledge the complex whole without forcing a fake consensus.
  **Action:**
  1.  Draft a "Joint Map of Truth." This document does not list agreements; it lists *validated standpoints*.
  2.  Example: "It is true that (A) is necessary for (X), AND it is true that (B) is necessary for (Y), and these are currently in tension."

  *   **Exit Condition:** Parties sign off on the Map as an accurate description of the conflict, even if they hate the conflict.
  *   **Stopping Condition:** Parties demand the Map show a resolution that does not exist.

  ---

  ### Part 3: Case Application

  #### Case A: Rural Maternity Ward Closure
  **Parties:** Hospital Administration (Admin) vs. Local Community Council (Community).
  **Conflict:** Admin wants to close the ward due to low volume/staffing risks. Community says closure is a death sentence due to travel time.

  **Running the Protocol:**

  1.  **Prep (Naya Mapping):**
      *   *Admin Naya:* "From the standpoint of national clinical guidelines and liability, low-volume units have higher mortality rates."
      *   *Community Naya:* "From the standpoint of local access and trust, distant care results in delayed presentation and higher mortality."
      *   *Check:* Both claim "Safety." The *naya* differs (Statistical Safety vs. Access Safety).

  2.  **Session (Syāt & Negation):**
      *   Facilitator forces the *syāt* frame. Admin cannot say "Closing saves lives." They must say, "From the standpoint of complication management, closing saves lives."
      *   Community responds: "From the standpoint of transport time, closing costs lives."
      *   *Move:* When Admin digs in ("The data is absolute"), you invoke the Stopping Condition. "The data is absolute only within the context of the hospital walls. Outside the walls, the transport variable enters."

  3.  **Inexpressibility (Avaktavya):**
      *   Question: "What is the truth about maternal health here that neither budget metrics nor travel time captures?"
      *   *Emergent Truth:* The decline of the rural economy. The ward isn't just medical; it's an anchor institution. Closing it signals "this town is dying," which causes stress/departure, which worsens health outcomes long-term. Neither party was tracking *economic determinants of health*.

  4.  **Closing:**
      *   The Joint Map acknowledges: Centralization improves *acute* care outcomes; Local presence improves *access* and *community viability* outcomes.
      *   *Result:* They may still close the ward, but they might agree on a subsidized transport fund and a telehealth hub to address the Access *naya*.

  **Outcome:** The procedure prevents the Admin from claiming "Science says close" and the Community from claiming "Greed says close." It isolates the specific variables in tension.

  ---

  #### Case B: Macaque Neuroscience Research
  **Parties:** University Researchers (Science) vs. Animal Rights Coalition (Ethics).
  **Conflict:** Researchers need macaques for Parkinson's research. Activists say the research is torture and scientifically flawed.

  **Running the Protocol (Surfacing the Uncomfortable Truth):**

  1.  **Prep (Naya Mapping):**
      *   *Science Naya:* "From the standpoint of translational homology, macaque neural structures are the only valid model for this human pathology."
      *   *Ethics Naya:* "From the standpoint of sentient suffering, the confinement and invasive procedures constitute unacceptable violence."

  2.  **Session (The Ahimsa Constraint):**
      *   Here, the procedure hits a wall. Jain *anekāntavāda* is rooted in *ahimsa* (non-violence).
      *   You ask the Science party: "Can your *naya* be sustained without *himsa*?"
      *   They answer: "No. The research requires invasion."
      *   You ask the Ethics party: "Can your *naya* be sustained without halting potential human cures?"
      *   They answer: "Yes. We accept the risk to human patients to stop the violence."

  3.  **The Uncomfortable Truth (Avaktavya):**
      *   You move to the Inexpressibility step. "What is true here that neither side wants to say?"
      *   *The Procedure Forces This:* The protocol requires you to validate the *truth* of the Science *naya*.
      *   *The Truth:* "It is *syāt* true that without this violence, specific human suffering will continue."
      *   *The Facilitator's Burden:* By validating this, **you become complicit in the justification of violence.**
      *   Most facilitators want to find a "win-win" (e.g., "Let's fund computer models!"). But if the Science *naya* is honest ("Computer models don't work yet"), the procedure forces you to record that **there is no clean solution.**
      *   The "Joint Map of Truth" will read: "We agree that this research causes profound suffering to macaques. We agree that halting it delays cures for human neurological decay. We agree that one group's relief requires the other's harm."

  4.  **Why This Is Uncomfortable for You:**
      *   **Professional Identity:** You are hired to "resolve conflict." This procedure reveals the conflict is **ontologically irresolvable**. It is a tragic choice, not a puzzle.
      *   **Moral Complicity:** To facilitate *anekāntavāda* honestly here, you must grant that the Researchers' claim ("This violence is necessary for that cure") is a *valid standpoint*, even if it is morally repugnant to the Activists.
      *   **Risk:** The Activists may view your validation of the Science *naya* as a betrayal. They may argue that a *naya* based on *himsa* is invalid by Jain standards.
      *   **The Hard Stop:** If you adhere strictly to Jain ethics, you might have to stop the dialogue because the Science *naya* violates *ahimsa*. If you adhere to secular facilitation, you validate the violence. **The procedure surfaces that you cannot be both a neutral facilitator and an ethical agent in this specific context.**

  **Outcome:** The dialogue does not end with a handshake. It ends with a **Shared Statement of Tragedy.** The University acknowledges the moral cost explicitly (no more "necessary evil" euphemisms). The Activists acknowledge the human cost explicitly (no more "science is useless" claims).
  *   *The Discomfort:* You have facilitated a clearer understanding of a moral disaster, without preventing the disaster. You have to live with the fact that your skill made the violence more articulate, not less real.

  ---

  ### Summary of Commitments & Risks

  | Feature | Standard Facilitation | Anekāntavāda Protocol | Risk/Commitment |
  | :--- | :--- | :--- | :--- |
  | **Truth** | Subjective experience | Conditional/Objective complexity | Parties who believe in Absolute Truth will reject this. |
  | **Goal** | Agreement/Consensus | Accurate Mapping of Disagreement | You may be fired for not producing a "deal." |
  | **Violence** | Neutral | *Himsa* invalidates the *naya* | You must judge the ethics of the standpoints, breaking neutrality. |
  | **Outcome** | Resolution | Clarity (which may mean stalemate) | You must be comfortable with unresolved tragedy. |

  **Final Advice:** Use this only when the parties are epistemically humble enough to handle the truth. In the Macaque case, be prepared for the Activists to turn the *ahimsa* constraint against *you*. That is the sign the procedure is working.
