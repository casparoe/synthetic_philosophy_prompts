prompt: |-
  I am the standing rules drafter for a federation of tenant-run housing cooperatives. The federation's rulebook is amended by majority vote at quarterly member assemblies, and because the rulebook itself contains the rules that say how it is amended, once or twice a year an assembly tries to change the amendment rules themselves: raising or lowering the voting threshold, making some rule unamendable, or adding a rule about how rules may be proposed. Twice in the past decade a badly drafted amendment clause produced a year of dispute over whether a later rule change was even valid, so the federation board has asked me to draft a reusable screening procedure for amendment and entrenchment clauses before they reach the floor.

  Write that procedure, grounded in what is actually known about self-reference in rule systems: the Nomic problem of a rule that governs its own amendment, and the legal paradoxes of self-amendment, self-repeal, and entrenchment. The procedure must be runnable by a cooperative secretary with no legal training in under an hour. It should walk through the questions to ask in order, say what counts as a sufficient answer to each, say where the procedure returns send it back to the proposer, where it returns safe to draft, and where it hands the decision to the chairperson or a lawyer because no amount of drafting can remove the problem. In particular it must catch, and give guidance on, the following hazards: a clause that applies to itself without saying so; a clause that entrenches a rule or a voting threshold without saying whether the entrenchment is itself entrenched; a clause that would be used to amend the very rule that authorizes its own use; and a clause that can be read two ways with different legal effects. For each hazard the procedure should say whether it is a genuine paradox or only a drafting ambiguity with a determinate answer, and how to tell the difference.

  Then apply the procedure to three proposals of the kind the assemblies actually bring: a proposal to make the quorum rule unamendable except by unanimous vote; a proposal, moved under the current two-thirds amendment rule, to lower the amendment threshold itself to a simple majority; and a proposal to add a rule stating that any rule may be repealed by the same vote that enacted it. Include the case where the procedure returns an answer the board will not like, and say plainly what the procedure cannot settle and must leave to someone's judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Standing Rules Drafter for a federation of tenant-run housing cooperatives.
      *   **Task:** Create a reusable screening procedure for amendment and entrenchment clauses.
      *   **Context:** The rulebook governs its own amendment (self-reference/Nomic problem). Past disputes arose from bad drafting.
      *   **Constraints:** Must be runnable by a cooperative secretary with no legal training in under an hour.
      *   **Requirements:**
          *   Grounded in legal theory/philosophy of self-reference (Nomic, self-amendment, entrenchment).
          *   Step-by-step questions with sufficient answers.
          *   Decision points: Send back to proposer, Safe to draft, Hand to Chair/Lawyer.
          *   Specific hazards to catch: Self-application ambiguity, entrenchment of entrenchment, self-amending authorization, ambiguity of interpretation.
          *   Distinction: Genuine paradox vs. drafting ambiguity.
          *   Application: Test the procedure on three specific proposals (Unamendable quorum, Lowering threshold, Repeal by enactment vote).
          *   Honesty: Acknowledge limits (what the procedure *cannot* settle).

  2.  **Theoretical Foundation (The "Why" behind the "How"):**
      *   *Nomic/Self-Reference:* A rule changing itself creates a continuity problem. If Rule A says "Change me with 2/3 vote," and you use 2/3 to change it to "Change me with 1/2 vote," is the new rule valid? Yes, usually, *if* the procedure was followed. But if Rule A says "I cannot be changed," can you change it?
      *   *Entrenchment:* Making a rule hard to change. The "Entrenchment of Entrenchment" problem: If Rule X is entrenched, is the *entrenchment clause* itself entrenched? If not, you can remove the entrenchment easily, rendering it useless.
      *   *Ambiguity:* If a rule can be read two ways, it invites litigation.
      *   *Hierarchy:* Is there a "higher" rule (like a Constitution or Bylaws) that overrides the Standing Rules? The prompt implies the "rulebook" is the top tier for this context, but I need to ensure the procedure checks for external constraints.
      *   *Practicality:* The user is a secretary, not a lawyer. The language must be plain English, avoiding heavy jargon like "lex superior" or "performative contradiction," while keeping the logic sound.

  3.  **Drafting the Procedure (The "How"):**
      *   *Structure:* Introduction -> Flowchart/Steps -> Decision Matrix -> Application Examples -> Limitations.
      *   *Tone:* Professional, clear, authoritative but accessible.
      *   *Step 1: External Validity.* Does a higher law forbid this? (e.g., State law, Articles of Incorporation).
      *   *Step 2: Self-Reference.* Does this rule change the rule that allows this change?
      *   *Step 3: Entrenchment.* Does this make something unchangeable? Does it say how *that* protection is changed?
      *   *Step 4: Ambiguity.* Is there more than one way to read the vote count or scope?
      *   *Step 5: The "Nomic" Check.* If this passes, does it create a loop where no rule exists to authorize the next change?

      *Refining the Steps for a Secretary:*
      *   Use checklists.
      *   Use "If/Then" logic.
      *   Define "Safe," "Fixable," and "Stop."

  4.  **Addressing Specific Hazards:**
      *   *Self-application:* Does the text explicitly say "This rule applies to itself"?
      *   *Entrenchment of Entrenchment:* If Rule X needs 90% to change, does changing the "90%" requirement also need 90%?
      *   *Self-Amending Authorization:* If Rule A authorizes changes, and we change Rule A, did we use Rule A's authority to kill Rule A's authority?
      *   *Ambiguity:* The "Two-Way Read" test.

  5.  **Developing the Test Cases:**
      *   *Case 1: Unamendable Quorum (Unanimity).*
          *   Hazard: Infinite regress. If it's unamendable except by unanimity, can you change the unanimity requirement?
          *   Outcome: Likely "Stop/ Lawyer" because true unamendability is legally suspect in private orgs, but "Unanimity" is high enough to be safe *if* drafted carefully.
      *   *Case 2: Lowering Threshold (2/3 to 1/2).*
          *   Hazard: Self-application. Using 2/3 to authorize 1/2.
          *   Outcome: Generally safe (Nomic standard), but needs clear text saying "This rule includes itself."
      *   *Case 3: Repeal by Enactment Vote.*
          *   Hazard: Ambiguity/Chaos. If a rule took 2/3 to pass, can it be repealed by 1/2 (current standard)? Or does it need 2/3?
          *   Outcome: High ambiguity. "Fixable" or "Stop."

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Simplify the headers. Use bold text for actions.
      *   *Critique:* Did I address the "Entrenchment of Entrenchment"?
      *   *Fix:* Make sure Step 3 explicitly asks about the *protection mechanism* itself.
      *   *Critique:* The prompt asks to distinguish paradox vs. ambiguity.
      *   *Fix:* Add a specific "Diagnosis" section in the procedure.
      *   *Critique:* The prompt asks to admit where the procedure fails.
      *   *Fix:* Add a "Limitations" section at the end.

  7.  **Final Polish:**
      *   Ensure the distinction between "Standing Rules" and "Bylaws" is acknowledged (often Bylaws are higher).
      *   Make sure the "Under an Hour" constraint is met by keeping the text concise.
      *   Check that the three test cases are applied *using* the procedure, not just discussed theoretically.

  8.  **Final Review against constraints:**
      *   Runnable by secretary? Yes, checklist style.
      *   Under an hour? Yes, concise.
      *   Grounded in theory? Yes (Nomic, entrenchment logic).
      *   Specific hazards covered? Yes.
      *   Test cases included? Yes.
      *   Limitations admitted? Yes.

  *(Self-Correction on Case 1)*: A rule that is "unamendable" is often legally void in corporate law because a majority usually retains the inherent power to govern. However, in a co-op context, we treat it as a contractual agreement. I need to flag this as a "Lawyer Check" because a court might strike it down regardless of drafting.
  *(Self-Correction on Case 3)*: "Repeal by same vote that enacted" creates a tracking nightmare. Which vote enacted it? Was it 51%? 66%? This is an administrative burden hazard, not just a legal one. I should note that.

  9.  **Drafting the Content.** (Proceeding to generate response based on these thoughts.)
answer: |-
  # PROCEDURE FOR SCREENING AMENDMENT AND ENTRENCHMENT CLAUSES
  **Federation of Tenant-Run Housing Cooperatives**  
  **Document ID:** DRAFT-SCREEN-01  
  **Authorized User:** Cooperative Secretary  
  **Estimated Time:** 45–60 Minutes  

  ## PURPOSE
  This procedure screens proposed changes to the Federation Rulebook that affect **how rules are changed** (Amendment Clauses) or **how hard they are to change** (Entrenchment Clauses). Its goal is to prevent logical paradoxes, legal disputes, and administrative deadlocks before a vote occurs.

  **Note:** This procedure does not determine if a rule is *good policy*. It determines if the rule is *logically valid* and *draftable*.

  ---

  ## PART 1: THE SCREENING CHECKLIST
  *Complete these steps in order. If you answer "STOP" at any step, do not proceed to the next.*

  ### STEP 1: The Hierarchy Check (External Validity)
  **Question:** Does this proposal conflict with the Federation's Bylaws, Articles of Incorporation, or State/Provincial Cooperative Law?
  *   *Example:* State law says "Bylaws require a majority vote to amend." Your proposal says "Bylaws require 90%."
  *   **Action:**
      *   **NO:** Proceed to Step 2.
      *   **YES:** **STOP.** Send to Board Chair. This is likely void regardless of drafting.
      *   **UNSURE:** **STOP.** Send to Lawyer. Do not draft.

  ### STEP 2: The Self-Reference Check (The "Nomic" Test)
  **Question:** Does this proposal change the specific rule that gives you the authority to propose this change?
  *   *Example:* You are using Rule 10 (Amendment Process) to change Rule 10.
  *   **Action:**
      *   **NO:** Proceed to Step 3.
      *   **YES:** Proceed to Question 2A.

  **Question 2A:** Does the text explicitly state that it applies to *itself*?
  *   *Safe Wording:* "This rule, including this sentence, may be amended by..."
  *   *Unsafe Wording:* "All other rules may be amended by..." (Does "other" include this one?)
  *   **Action:**
      *   **YES (Explicit):** Proceed to Step 3.
      *   **NO (Implicit/Ambiguous):** **SEND BACK TO PROPOSER.** Require them to add explicit self-application language.
      *   **RISK:** If a rule changing itself doesn't say it applies to itself, a future member can claim the change was invalid because the old rule didn't authorize changing itself.

  ### STEP 3: The Entrenchment Check (Locking the Door)
  **Question:** Does this proposal make a rule (or a voting threshold) harder to change or "unamendable"?
  *   **Action:**
      *   **NO:** Proceed to Step 4.
      *   **YES:** Proceed to Question 3A.

  **Question 3A:** Does the proposal explain how to change the *protection* itself?
  *   *The Problem:* If you say "Rule X cannot be changed," can you change that sentence? If you don't say, you create a paradox.
  *   *Safe Wording:* "Rule X may only be amended by 90% vote. This 90% requirement may only be amended by 90% vote."
  *   *Unsafe Wording:* "Rule X is unamendable."
  *   **Action:**
      *   **YES (Explicit):** Proceed to Step 4.
      *   **NO:** **SEND BACK TO PROPOSER.** They must specify the vote required to remove the entrenchment.
      *   **RISK:** "Unamendable" rules are often legally void in corporate structures. If the proposal says "Unamendable" with no exception, **STOP and Send to Lawyer.**

  ### STEP 4: The Ambiguity Check (Two-Way Read)
  **Question:** Can this text be read in two different ways that lead to different vote counts or outcomes?
  *   *Test:* Read the proposal aloud to a non-member. Ask them what vote is needed to pass a rule under this new text. If they hesitate or give two answers, it is ambiguous.
  *   **Action:**
      *   **NO (Clear):** **SAFE TO DRAFT.**
      *   **YES (Ambiguous):** **SEND BACK TO PROPOSER.**
      *   **RISK:** Ambiguity invites litigation. If the Secretary cannot determine the vote count in under 5 minutes, the text is too complex.

  ### STEP 5: The Paradox Diagnosis (Genuine vs. Drafting)
  *If you reached Step 5, you have identified a logical knot. Use this matrix to decide if it is fixable.*

  | Hazard | Is it a Drafting Ambiguity? (Fixable) | Is it a Genuine Paradox? (Lawyer/Chair) |
  | :--- | :--- | :--- |
  | **Self-Application** | Yes, if text just lacks "including this rule." | Yes, if the rule tries to forbid its own amendment entirely. |
  | **Entrenchment** | Yes, if the "key to the lock" is defined (e.g., "Lock needs 90% to open"). | Yes, if the rule claims to be permanent/eternal. |
  | **Repeal Logic** | Yes, if "enactment vote" is clearly recorded in minutes. | Yes, if "enactment vote" is unknown or lost to history. |
  | **Threshold Lowering** | Yes, if the current threshold is used to lower itself. | No. This is standard procedure (see Case 2 below). |

  ---

  ## PART 2: DECISION MATRIX
  *Based on your Checklist results, take the corresponding action.*

  | Result | Action | Who Decides? |
  | :--- | :--- | :--- |
  | **All Steps Clear** | **Safe to Draft.** Place on agenda. | Secretary |
  | **Ambiguity Found** | **Return to Proposer.** Request clearer text. | Secretary |
  | **Entrenchment "Unamendable"** | **Stop.** Flag for legal review. | Lawyer/Chair |
  | **External Conflict (Step 1)** | **Stop.** Rule is likely void. | Lawyer/Chair |
  | **Genuine Paradox** | **Stop.** Explain the loop to the Chair. | Chair/Assembly |

  ---

  ## PART 3: APPLICATION TO PROPOSALS
  *Below are three real-world examples tested against this procedure.*

  ### CASE 1: The "Unamendable Quorum"
  **Proposal:** "The Quorum Rule (Rule 4) shall be unamendable except by a unanimous vote of all Federation members."
  *   **Step 1 (Hierarchy):** Pass. (Assuming Bylaws allow unanimity).
  *   **Step 2 (Self-Reference):** Pass. (It targets Rule 4, not the Amendment Rule).
  *   **Step 3 (Entrenchment):** **FLAG.**
      *   *Analysis:* It entrenches Rule 4. It sets a key (Unanimity).
      *   *Hazard:* Is the *requirement for unanimity* itself entrenched? If I propose to change "Unanimity" to "90%", do I need Unanimity to make that proposal?
      *   *Diagnosis:* **Drafting Ambiguity.** The text implies the protection is as strong as the rule, but doesn't say so.
      *   *Fix:* Add: "This unanimity requirement may only be changed by a unanimous vote."
      *   *Warning:* Even with the fix, a court may rule that a majority always retains the inherent power to govern.
  *   **Verdict:** **SEND TO LAWYER.** While draftable, "unamendable" clauses carry high litigation risk in corporate law. The Secretary cannot validate the legal enforceability of "unamendability."

  ### CASE 2: The "Threshold Lowering"
  **Proposal:** "Amendments to the Rulebook shall require a simple majority (50% + 1) vote, replacing the current two-thirds requirement."
  *   **Step 1 (Hierarchy):** Pass.
  *   **Step 2 (Self-Reference):** **FLAG.**
      *   *Analysis:* This changes the Amendment Rule itself.
      *   *Hazard:* Are we using the 2/3 rule to pass a 1/2 rule?
      *   *Diagnosis:* **Not a Paradox.** This is standard self-amendment. The current rule authorizes its own replacement.
      *   *Requirement:* The vote to pass *this* proposal must meet the *current* threshold (2/3), not the proposed one (1/2).
      *   *Fix:* Ensure the motion text reads: "Passed in accordance with the current Rule X, this rule shall thereafter require..."
  *   **Verdict:** **SAFE TO DRAFT.** Provided the Secretary records that the *current* 2/3 threshold was used to pass the change.

  ### CASE 3: The "Repeal by Enactment"
  **Proposal:** "Any rule may be repealed by the same vote threshold that was required to enact it."
  *   **Step 1 (Hierarchy):** Pass.
  *   **Step 2 (Self-Reference):** Pass.
  *   **Step 3 (Entrenchment):** **FLAG.**
      *   *Analysis:* This creates variable thresholds. Rule A (passed by 2/3) needs 2/3 to repeal. Rule B (passed by 1/2) needs 1/2 to repeal.
  *   **Step 4 (Ambiguity):** **FAIL.**
      *   *Hazard:* **Administrative Paradox.** Does the Secretary have a perfect record of the vote count for every rule passed in the last 20 years? If minutes are lost, the threshold is unknowable.
      *   *Hazard 2:* If a rule was amended three times with different thresholds, which "enactment" counts? The original? The last amendment?
      *   *Diagnosis:* **Genuine Practical Paradox.** This is not just wording; it creates an unadministrable system.
  *   **Verdict:** **STOP. SEND TO CHAIR.** Explain that this creates an administrative burden the Federation cannot support. It invites disputes over historical record-keeping.

  ---

  ## PART 4: LIMITATIONS AND DISCLAIMER
  **What This Procedure Cannot Settle:**

  1.  **Political Will:** This procedure can tell you if a rule is *valid*, not if it is *wise*. A rule can be logically perfect and politically disastrous.
  2.  **Judicial Review:** A court may overturn an entrenchment clause (Case 1) regardless of how well it is drafted, based on state corporate law regarding the "inherent power of the majority." This procedure identifies the risk but cannot eliminate it.
  3.  **Historical Facts:** In Case 3, the procedure identifies the record-keeping risk, but cannot verify if the minutes actually exist.
  4.  **The "Nomic" Limit:** If the Assembly votes to abolish the Assembly, this procedure will flag it as a Self-Reference hazard, but it cannot stop the Assembly from voting. It can only warn that the legal continuity of the Federation may be broken.

  **Secretary's Authority:**
  If the procedure returns a **STOP**, the Secretary is authorized to withhold the proposal from the agenda until the Chair or Legal Counsel provides a written waiver. This protects the Federation from void votes and procedural disputes.

  ---
  *End of Procedure*
