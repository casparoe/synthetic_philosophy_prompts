answer: |-
  First, take a deep breath. You are not spiraling into nonsense; you have stumbled directly into one of the most persistent and heated debates in contemporary metaphysics and philosophy of action. Your roommate is arguing from a position known as **physicalism** or **process theory of causation**, while you are arguing from a **counterfactual** or **interventionist** perspective.

  Neither of you is obviously "wrong," but your roommate is conflating *fundamental physics* with *causal explanation in the special sciences* (biology, psychology, ethics).

  Here is a breakdown of why your roommate's argument is compelling but incomplete, and how you can defend the reality of omission without violating the laws of physics.

  ### 1. The Roommate's Strong Point: The "No Stuff" Objection
  Your roommate is right about one thing: In fundamental physics, there are no "absences."
  *   If you push a block, energy transfers from you to the block. There is a physical process in spacetime.
  *   If you *don't* push the block, there is no energy transfer. There is no "particle of non-pushing."

  If causation requires a physical transmission of energy or momentum (a "process view"), then omissions cannot be causes. This is why some philosophers (like Helen Beebee) argue that omissions are not *causes* but rather *explanations*. They say: "The plant died because you didn't water it" is a true explanation, but the *cause* was actually the heat, the evaporation, and the biological processes of wilting. Your omission is just the context that makes that explanation relevant.

  **The Counter-Argument:** If we accept this strictly, we lose the ability to talk about cause and effect in almost any science other than particle physics.
  *   **Medicine:** "The patient died because the doctor didn't administer the antidote."
  *   **Engineering:** "The engine failed because the safety valve didn't open."
  *   **Biology:** "The organism died due to a lack of oxygen."

  In all these cases, the "cause" is an absence. If your roommate insists these aren't causal claims, he has to argue that medicine and engineering are speaking metaphorically. Most philosophers reject this. They argue that **causation is not limited to fundamental physics.** Higher-level realities (like "engines," "patients," and "gardens") have their own causal rules that are *real*, even if they supervene on physics.

  ### 2. The "Profligate Causation" Objection
  Your roommate's second point is the classic "Problem of Too Many Causes." If my not watering the plant caused it to die, then *Beyoncé's* not watering the plant also caused it to die. Since neither of us watered it, we are both causes. This seems absurd.

  **The Solution: Norms and Expectations**
  Philosophers who defend omission causation (like Jonathan Schaffer or Michael Moore) usually solve this by引入 **normative expectations** or **contextual relevance**.
  *   Causation isn't just about what happened; it's about what was *supposed* to happen.
  *   Beyoncé has no duty to water your plant. You (presumably) do.
  *   Therefore, in the context of *moral* or *functional* causation, your omission is a cause, and Beyoncé's is not.

  This doesn't make causation "subjective"; it makes it **interest-relative**. Just as "large" is relative (a large mouse is small compared to an elephant), causal selection is relative to the system of norms we are investigating. In a legal system, your omission is a cause. In a system of astrophysics, it is not. Both are true in their respective domains.

  ### 3. Counterfactuals Are Not "Just Talk"
  Your roommate dismissed counterfactuals ("If I had watered it...") as merely linguistic. This is a controversial stance.
  *   **David Lewis**, one of the most influential philosophers of the 20th century, argued that counterfactual dependence *is* the metaphysics of causation.
  *   Even if you don't go that far, **Interventionist Theories** (like James Woodward's) argue that a cause is something that, if you were to intervene and change it, the effect would change.
  *   If you intervene on your behavior (water the plant), the effect changes (plant lives). If you intervene on Beyoncé's behavior, the effect stays the same (plant dies, because she was never going to water it anyway).

  This makes the causal relationship **objective** based on dependency structures, not just "talk." The dependency exists in the world, even if the "omission" isn't a physical object.

  ### 4. The "Hole" Analogy
  Here is a concrete analogy to use with your roommate:
  **Do holes exist?**
  *   **Physicist view:** A hole in a donut is just "donut matter arranged in a ring." There is no "hole particle."
  *   **Realist view:** A hole has causal powers. If you put a donut on a stick, the stick goes through the *hole*. If the hole weren't there, the stick wouldn't fit.

  We can treat holes as real objects for the purpose of topology and mechanics, even if they are just absences of matter. Similarly, an omission is a "hole" in the fabric of events. It can have causal power within a specific system (like a garden or a legal contract) even if it isn't a fundamental particle.

  ### 5. Why You Shouldn't Spiral (The Moral Stakes)
  You worried that if omissions aren't causes, morality is "confused moralizing."
  Even if your roommate is metaphysically right (that omissions aren't *physical* causes), **moral responsibility does not require physical causation.**

  *   **Responsibility is about agency, not just physics.**
  *   We hold people responsible for omissions because they had the **capacity** and the **duty** to act.
  *   Whether that counts as "metaphysical causation" is a separate question from "moral accountability."

  However, most legal and ethical systems *do* treat omissions as causes (e.g., manslaughter by negligence). If we adopted your roommate's strict physicalist view, we would have to overhaul the entire legal system. Most philosophers think that if a theory of causation makes murder-by-negligence impossible to categorize, **the theory is the problem, not the law.**

  ### Summary for Your Next Conversation
  Tell your roommate this:
  1.  **Agree:** "You're right that omissions aren't *physical events* with mass or energy."
  2.  **Pivot:** "But causation in the 'special sciences' (biology, law, ethics) isn't just about energy transfer. It's about **dependency**."
  3.  **The Knockout:** "If omissions can't be causes, then a doctor who unplugs a life-support machine causes death (physical act), but a doctor who *never plugs it in* does not (omission), even if the patient dies exactly the same way. That distinction seems physically arbitrary but morally crucial. A good theory of causation should be able to handle that without calling it 'just talk'."

  **Verdict:** Your roommate is playing a "fundamental physics" game. You are playing a "human reality" game. Both are valid, but his game cannot explain why the plants died, only why the atoms moved. You are allowed to claim that "killing the plants" is a real event, even if it's made of omissions.
