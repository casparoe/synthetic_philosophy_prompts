      *   Use philosophical terminology correctly (Strawsonian, Compatibilism, Moral Luck, Desert).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Strawson solves this." The user *knows* Strawson. The user is asking if *their specific synthesis* holds together. The synthesis is shaky because they are trying to have Strawsonian comfort *and* Skeptical honesty simultaneously.

  7.  **Final Polish:** Check against the prompt requirements (rank by severity, tell what to give up, tell the cost). (Looks good).

      *   *Key Insight:* The user is essentially describing **P.F. Strawson meets Galen Strawson (or Derk Pereboom)**. They want the social utility of the former but can't ignore the metaphysical force of the latter. The tension is between *pragmatic justification* and *metaphysical honesty*.

  8.  **Final Output Structure:**
