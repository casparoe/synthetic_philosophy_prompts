answer: |-
  You have identified a genuine and persistent pathology in the methodology of the special sciences, particularly in economics and macro-modeling. While there is no single, universally canonical noun phrase for this specific maneuver (like "The Gell-Mann Amnesia Effect"), it is a recognized subset of broader concepts in the philosophy of science.

  The most precise existing label for this configuration is **Immunization by Idealization**, which functions as a specific type of **Conventionalist Stratagem** (in Karl Popper's terminology) or a maneuver within a **Degenerating Research Programme** (in Imre Lakatos's terminology).

  However, because you are asking for the specific *rhetorical asymmetry* regarding the status of the assumption, I would characterize it as **Epistemic Opportunism regarding Idealizations**, or more colloquially, **The Instrumentalist Flip**.

  Here is a breakdown of how to characterize this move, how it differs from legitimate modeling, and the criteria for distinguishing the two.

  ### 1. Conceptual Labeling

  While "The F-Twist" refers to the initial claim that assumptions need not be realistic, the move you describe is the *retroactive reversal* of that claim.

  *   **Popper's Conventionalist Stratagem:** Popper described this as a method of evading falsification by redefining the terms of the theory *ex post facto*. By shifting the assumption from "heuristic device" to "causal culprit," the modeler protects the core theory from refutation.
  *   **The Motte-and-Bailey Fallacy:** This is perhaps the most structurally accurate analogy.
      *   **The Bailey (Ambitious Claim):** "This model predicts reality accurately." (Used when the model succeeds).
      *   **The Motte (Defensible Claim):** "This model is just a heuristic tool with simplified assumptions." (Used when the model is criticized).
      *   **The Flip:** When the Bailey fails (prediction error), the modeler retreats to the Motte not to concede defeat, but to explain the failure: "The heuristic assumptions weren't met." The assumption serves as the drawbridge: it is lowered to let success out, and raised to keep criticism out.
  *   **Epistemic Asymmetry of Idealizations:** This is a descriptive term for the specific phenomenon you noted. The assumption holds two incompatible epistemic statuses simultaneously: *causally inert* (when things go right) and *causally potent* (when things go wrong).

  ### 2. Distinguishing from Legitimate Modeling

  You rightly note that an assumption *can* be harmless for some predictions and fatal for others. A frictionless plane is fine for calculating the trajectory of a cannonball but fatal for calculating heat generation. The difference lies in **ex ante specification** versus **ex post rationalization**.

  **Legitimate Idealization:**
  *   **Scope Conditions:** The modeler specifies *beforehand* the domain in which the assumption is negligible. (e.g., "This rational agent model applies only to high-stakes financial markets, not to charitable giving.")
  *   **Robustness Analysis:** The modeler demonstrates via sensitivity analysis that small deviations from the assumption do not alter the core prediction *within the specified domain*.
  *   **Independent Warrant:** If an assumption is blamed for failure, there is independent evidence (outside the model's failure) that the assumption was the binding constraint.

  **The "Instrumentalist Flip" (Illegitimate):**
  *   **Universal Shield:** The assumption is defended as "standard" or "necessary for tractability" against all initial criticism.
  *   **Post Hoc Causality:** The assumption is only elevated to "causal factor" status *after* a prediction fails, with no prior sensitivity analysis suggesting it would be decisive in that context.
  *   **Unfalsifiable Core:** The core mechanism of the model is never tested, because any success validates the core, and any failure is blamed on the auxiliary assumptions.

  ### 3. A Principled Criterion for Legitimacy

  To determine whether this move is a legitimate scientific correction or a rhetorical shield, apply the **Ex Ante Sensitivity Test**:

  > **Criterion:** *Was the potential for the assumption to cause this specific type of error acknowledged and quantified before the failure occurred?*

  *   **Pass:** The modelers published a "limitations" section stating, "If condition X changes, the assumption of Y will no longer hold, and the model will overestimate Z." If the failure happens exactly there, the move is legitimate.
  *   **Fail:** The modelers defended the assumption as "standard" or "inconsequential" during peer review, and only invoked it as the cause of failure after the data contradicted the prediction.

  ### 4. Why This Matters (The Falsifiability Trap)

  The danger of this move is that it converts a **scientific model** into a **justification system**.

  In a falsifiable framework, a failed prediction forces a choice: reject the theory or reject the auxiliary hypotheses (the assumptions).
  *   If you reject the theory, you learn something.
  *   If you reject the auxiliary hypotheses, you must adjust them and test again.

  In the configuration you describe, the auxiliary hypotheses are **elastic**. They are rigid when defending the model (you *must* accept rational agents to run the math) but elastic when explaining failure (agents were *irrational* this time). This renders the core theory immune to empirical evidence. It creates a **one-way ratchet**:
  *   Success $\rightarrow$ Attributed to the Core Theory.
  *   Failure $\rightarrow$ Attributed to the Idealizations.

  ### Summary Recommendation

  If you need to label this in writing, **"Epistemic Asymmetry of Idealizations"** is precise and descriptive. If you want to invoke the philosophical lineage, describe it as **"Immunization via Retroactive Realism."**

  It is distinct from ordinary instrumentalism because instrumentalism is consistent (assumptions don't matter, period). It is distinct from standard *ad hoc* rescue because it doesn't add a new variable; it re-weights an existing one. It is a **status flip** that exploits the ambiguity between *idealization* (a necessary simplification) and *error* (a causal distortion).

  The principled criterion to expose it is to demand **ex ante sensitivity analysis**. If the assumption's causal power was not modeled before the failure, invoking it after the failure is not science; it is special pleading.
