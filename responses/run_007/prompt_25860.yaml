      *Assessment:* The argument is a standard textbook presentation of the Frege-Geach problem. It *is* valid. The issue isn't that the logic is wrong, but that Premise (1) is a caricature of *sophisticated* expressivism. Early expressivism (Ayer, Stevenson) might have been vulnerable to this. Modern expressivism (Blackburn, Gibbard, Schroeder) modifies the theory of meaning to avoid this specific contradiction.

  3.  **Identify the Expressivist Response:**
