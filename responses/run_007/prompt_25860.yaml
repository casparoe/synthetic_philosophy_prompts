answer: |-
  First, let me offer some reassurance: your reconstruction is excellent. It is clear, valid, and captures the intuitive force of the Frege-Geach problem (often called the 'embedding problem') precisely as it is taught in many undergraduate modules. You have not made a silly mistake; rather, you have successfully reconstructed the *challenge* that expressivists must overcome.

  The reason expressivism is not obviously dead is that sophisticated expressivists do not accept the argument as sound. They do not deny the validity of your logic; instead, they argue that the argument relies on a simplification of expressivist semantics found in Premise (1) and the inference to Premise (4).

  Here is where the expressivist pushes back, and how they attempt to resolve the tension without abandoning their core commitments.

  ### The Target: Premise (1) and the Inference to (4)

  The crux of the matter lies in your first premise:

  > (1) According to expressivism, the meaning of a moral sentence like 'Lying is wrong' is the non-cognitive attitude it expresses...

  Contemporary expressivists (such as Simon Blackburn, Allan Gibbard, and Mark Schroeder) would argue that this is a caricature of their view. They distinguish between **semantic content** (meaning) and **illocutionary force** (the act of expressing or asserting).

  A sophisticated expressivist rejects the idea that the meaning of a sentence is *identical* to the act of expressing an attitude in an assertoric context. Instead, they propose that the meaning of a moral term is determined by the *type* of mental state it is used to convey, but that this mental state can be present without being 'expressed' in the full-blooded sense of endorsement.

  Consequently, they reject the inference to **Premise (4)**. They argue that the antecedent 'lying is wrong' *does* have the same meaning in the conditional as it does standalone (preserving compositionality and univocality), but having that meaning does not entail that the speaker is currently *expressing* the attitude of disapproval.

  ### How They Save the Theory

  To make this work, expressivists have developed complex semantic frameworks. Here are the two primary strategies they employ to block your contradiction in Premise (6).

  #### 1. Higher-Order Attitudes (Blackburn's Quasi-Realism)
  Simon Blackburn argues that we can make sense of moral conditionals by analysing them as expressing **higher-order attitudes**.

  On this view, when you assert 'Lying is wrong', you express a first-order attitude (disapproval of lying). However, when you assert the conditional 'If lying is wrong, then getting your brother to lie is wrong', you are not expressing disapproval of lying. Instead, you are expressing a higher-order attitude: you are expressing disapproval of *holding the first attitude without holding the second*.

  You are saying, in effect: 'I disapprove of anyone who disapproves of lying but fails to disapprove of getting your brother to lie.'

  This allows the expressivist to maintain that the meaning of 'wrong' is constant (it always refers to a state of disapproval) while explaining why the speaker isn't disapproving of lying in the antecedent. The logical validity of modus ponens is preserved because the higher-order attitude rules out the combination of attitudes that would constitute a logical error.

  #### 2. Norm-Expressivism and Planning (Gibbard)
  Allan Gibbard shifts the focus from 'attitudes' to 'norms for planning'. For Gibbard, to judge that an act is wrong is to accept a norm that forbids it.

  In a conditional context, the speaker is not necessarily accepting the norm. Instead, they are exploring the logical relations between plans. Gibbard argues that the semantics of 'if' can be defined over these planning states. The meaning of the moral term is uniform (it always relates to plans), but the grammatical context determines whether the plan is being *adopted* or merely *considered*.

  This blocks Premise (5) from generating a contradiction. It is true that the speaker does not *adopt* the plan in the antecedent, but the semantic content remains tied to the *kind* of state (a plan) that would be adopted in an assertoric context.

  ### The Force/Content Distinction

  The most technical way to describe their objection to your argument is that you have conflated **content** with **force**.

  *   **Content:** The semantic value of 'lying is wrong' (which expressivists analyse in terms of attitudes or plans).
  *   **Force:** The grammatical mood (assertoric, interrogative, conditional) that dictates what the speaker *does* with that content.

  Your Premise (1) assumes that the content *is* the force. The expressivist replies: 'No. The content is attitude-like, but the force determines whether that attitude is being endorsed.' Therefore, in your Premise (4), the claim that the antecedent 'must express disapproval' is false. It must *contain* the content that *would* express disapproval if asserted, but in a conditional, it does not do the expressing.

  ### Why the Debate Continues

  You are right to feel that Premise (2) (compositionality) is non-negotiable. Expressivists agree entirely. They want to save compositionality just as much as realists do. The debate is not about whether your logic is valid, but whether the expressivist can provide a formal semantics that makes sense of these higher-order attitudes or planning states without collapsing into realism.

  Critics (like Bob Hale, Crispin Wright, or Peter Geach himself) argue that these solutions are ad hoc. They claim that once you build a logic complex enough to handle embedding, you have effectively reinvented truth-conditional semantics and might as well be a realist. This is the heart of the 'Quasi-Realist' project: can one earn the right to talk of moral truth and validity without positing moral facts?

  ### Summary

  To answer your specific question: the expressivist rejects the inference to **Premise (4)**.

  *   **What they give up:** They give up the simplistic equation that 'meaning = the act of expressing an attitude'.
  *   **What they keep:** They keep the core expressivist claim that moral judgments are fundamentally grounded in conative states (attitudes, plans, commitments) rather than beliefs about facts.
  *   **The Cost:** They must adopt a much more complex philosophy of language (distinguishing force from content, or developing a logic of attitudes) to make this work.

  Your reconstruction is not wrong; it is simply the starting pistol for the modern expressivist research programme. The fact that smart people still defend expressivism is not because they cannot see this argument, but because they believe they have the semantic tools to dissolve the contradiction you have identified. Whether they succeed is, of course, the very question your course is likely asking you to evaluate.
