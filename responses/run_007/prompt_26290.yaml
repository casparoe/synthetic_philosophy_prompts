answer: |-
  **MEMORANDUM**

  **To:** Committee for Named Lectureships and Prizes
  **From:** [Your Name/Committee Member]
  **Date:** 24 May 2024
  **Subject:** Recommendation Regarding the 'Frege Prize in Philosophical Logic'

  **Introduction**

  This memo addresses the petition to rename the 'Frege Prize in Philosophical Logic' following revelations regarding Gottlob Frege's virulent anti-Semitism, documented in his 1924 political diary. Having reviewed the petitioners' concerns regarding inclusivity and the counterarguments regarding the separability of Frege's technical work from his politics, I recommend that the Committee **rename the prize to a descriptive title (e.g., 'The University Prize in Philosophical Logic') while retaining the endowment's specific focus on logic.** Furthermore, I propose that a permanent contextual statement be installed where the prize is announced, acknowledging Frege's foundational role while explicitly noting the reasons for the name's removal.

  **The Nature of the Honour**

  The central dispute rests on whether a named prize honours the *work* or the *person*. Senior colleagues argue that Frege's contributions to logic are 'pure'—timeless technical achievements entirely separable from his late political views. They contend that renaming the prize commits a category mistake, judging technical validity by moral standards.

  There is truth to this: the truth-values of logical propositions do not depend on the moral character of their discoverer. *Begriffsschrift* remains valid regardless of Frege's prejudices. However, a university prize is not merely a label for a subject; it is an institutional act of esteem. To attach a name to a prize is to hold that individual up as a model for the recipients. While we can teach Frege's logic without endorsing his character, we cannot reasonably ask Jewish students or other marginalised groups to accept an award that bears the name of a man who advocated for the stripping of their political rights. The petitioners are correct that the original naming was made in ignorance of facts we now cannot responsibly ignore.

  **The Question of 'Purity'**

  The most profound philosophical question here is whether the apparent 'purity' of logic insulates it from moral scrutiny. Opponents suggest that because logic concerns abstract relations, the philosopher's biography is irrelevant. I argue that relying on this 'purity' to shield the naming decision is precisely the evasion the petitioners suspect.

  Claiming that technical work exists in a moral vacuum can function to protect institutions from confronting the human context of knowledge production. If we assert that Frege's politics are irrelevant to the prize, we risk implying that intellectual excellence justifies moral blindness, or that 'greatness' in one domain excuses odiousness in another. By renaming the prize, we acknowledge that while the *work* is universal, the *institution* is a moral community. We affirm that the autonomy of intellectual inquiry does not require the erasure of ethical responsibility. We can uphold the value of Frege's logic without upholding Frege as a namesake.

  **The Slippery Slope**

  Colleagues warn that renaming this prize necessitates a wholesale review of university honours. This concern is understandable but manageable. We must distinguish between *commemoration* and *curriculum*. We are not banning Frege from reading lists; his work remains essential study. We are, however, ceasing to *celebrate* him.

  A consistent principle can be applied: names attached to honours (prizes, buildings, lectureships) signify exemplars. Names attached to curriculum signify historical importance. We can teach problematic figures without honouring them. This distinction prevents the 'slippery slope' from becoming a landslide, allowing us to scrutinise honours based on contemporary values of inclusivity without erasing history.

  **Recommendation**

  I propose the following concrete actions:

  1.  **Rename the Prize:** Change the title to 'The University Prize in Philosophical Logic'. This preserves the donor's intent to support the field Frege helped create, without perpetuating the honour of the man.
  2.  **Contextual Statement:** Publish a permanent statement alongside the prize details. This should acknowledge Frege's monumental contribution to the field while explicitly stating that the name was removed due to his documented anti-Semitism, which contradicts the University's commitment to an inclusive community.
  3.  **Donor Consultation:** Engage with the endowment's administrators to ensure this change aligns with the spirit of the original gift, emphasising that the *subject* remains honoured even if the *namesake* does not.

  **Conclusion**

  Retaining the name risks signalling that the University prioritises technical prestige over the dignity of its students. Renaming it without context risks erasing the complexity of intellectual history. The proposed middle path allows us to preserve the integrity of the discipline while demonstrating that our community values inclusivity as highly as intellectual rigour. We affirm that logic may be pure, but the practice of philosophy is human, and therefore subject to moral reflection.

  I urge the Committee to adopt this recommendation.
