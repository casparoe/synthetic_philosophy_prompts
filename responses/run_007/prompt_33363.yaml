      *   Highlight the "Reward Modeling" aspect since the user specializes in that. Reactive attitudes *are* a reward modeling problem.

  9.  **Self-Correction during drafting:** I need to be careful not to reduce Strawson to *just* instrumentalism. Strawson says we *are* committed to reactive attitudes, not just that they are useful. I need to capture that "inescapability" in RL terms. Maybe frame it as a "hard constraint" or "architectural prior" on the system.

      *Refinement:* In RL, we can choose to model something as environment. Strawson says humans *cannot* globally do this. So the translation is: "For human agents, the 'Participant Stance' is a hard-coded architectural prior, not a hyperparameter."

