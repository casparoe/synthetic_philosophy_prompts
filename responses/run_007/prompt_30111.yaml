answer: |-
  ### Part I: Systematic Translation of Williams into Decision-Theoretic Vocabulary

  To translate Bernard Williams's critiques into the vocabulary of rational choice, we must first formalize the Utilitarian position he attacks. In standard decision theory (DT), a Utilitarian agent is modeled as an optimizer maximizing an **agent-neutral social welfare function** ($W$).

  Let $A$ be the set of available acts. Let $C(a)$ be the consequences of act $a \in A$. Let $u_i(c)$ be the utility of individual $i$ given consequence $c$.
  The Utilitarian objective function for any agent $j$ is:
  $$ \max_{a \in A} \sum_{i} u_i(C(a)) $$
  Crucially, the agent's local objective function is identical to the global objective function. There is no indexical $j$ weighting the utility of the agent themselves differently than others, except instrumentally.

  #### 1. The Integrity Objection (Jim and the Indians)
  **The Scenario:** Jim is offered the choice to shoot one Indian to save nineteen, or shoot none and let nineteen die. The Utilitarian calculus dictates shooting the one.
  **Williams's Claim:** This requires Jim to view his own agency as a neutral channel for the satisfaction of others' utilities, alienating him from his own "ground projects" (e.g., a commitment to non-violence).

  **Decision-Theoretic Translation:**
  This objection targets the **structure of the objective function** and the **locus of control**.

  *   **Agent-Relative vs. Agent-Neutral Weights:** In standard rational choice, an agent typically maximizes an agent-relative utility function $U_j$. Utilitarianism imposes a constraint that $U_j \equiv W$. Williams argues that rational agents possess **ground projects** that function not merely as high-weight preferences, but as **constitutive constraints** on the feasible set of actions.
  *   **The Feasible Set Restriction:** Let $P_j$ be the set of projects constitutive of agent $j$'s identity. In a Williams-compliant model, acts that violate $P_j$ are not merely low-utility; they are removed from the feasible set $A$.
      *   *Utilitarian Model:* $A_{util} = \{ \text{shoot}, \text{refuse} \}$. $EU(\text{shoot}) > EU(\text{refuse})$.
      *   *Integrity Model:* $A_{integrity} = \{ \text{refuse} \}$. The act "shoot" is filtered out *prior* to consequence evaluation because it violates a lexical constraint derived from $P_j$.
  *   **Alienation as Decoupling:** Alienation occurs when the agent is forced to treat their own $U_j$ (which includes the disutility of violating $P_j$) as subordinate to $W$. In game-theoretic terms, the agent is forced to act as a **subroutine** for a global optimizer rather than a player maximizing their own payoff vector. The "integrity" cost is the disutility generated by the divergence between the agent's local objective function and the imposed global objective function.
  *   **Responsibility and Causality:** Williams distinguishes between what I *do* and what I *allow*. In DT, this is the distinction between **active nodes** and **passive chance nodes**. Utilitarianism collapses this distinction: if I can influence the probability distribution of a chance node (by refusing to shoot), I am responsible for the realization of that node. Williams insists on a **causal attribution** variable in the utility function: $U = f(\text{outcome}, \text{my\_causal\_role})$. The Utilitarian model sets the weight on $\text{my\_causal\_role}$ to zero.

  #### 2. The "One Thought Too Many" (The Husband and the Wife)
  **The Scenario:** A man must choose to save his wife or a stranger from drowning. He saves his wife.
  **Williams's Claim:** If he justifies this by calculating that saving his wife produces more general utility (e.g., she is happier, or he is more useful to society), he has had "one thought too many." The only legitimate thought is "she is my wife."

  **Decision-Theoretic Translation:**
  This objection targets the **deliberative algorithm** and the **source of preference parameters**.

  *   **Extensional Equivalence vs. Intensional Description:** Both the Utilitarian and the Williamsian agent select the act $a = \text{save\_wife}$. The *outcome* is extensionally equivalent. The critique concerns the *decision rule* (the intensional description of the function).
      *   *Utilitarian Rule:* $a^* = \arg\max_{a} \sum u_i(C(a))$. The parameter weighting the wife's utility is endogenous to the calculation (derived from her capacity for happiness or instrumental value).
      *   *Williamsian Rule:* $a^* = \text{save\_wife}$ IF $\text{relation}(\text{agent}, \text{victim}) = \text{spouse}$. The weighting parameter is **exogenous** and **rigid**.
  *   **Meta-Preferences and Commitment:** This can be modeled using **Amartya Sen's distinction between sympathy and commitment**.
      *   *Sympathy:* My utility increases when yours increases (standard interdependent utility functions).
      *   *Commitment:* I choose an act that lowers my expected utility because it adheres to a rule I endorse at a **higher order of preference**.
      *   In the "One Thought" case, the Utilitarian operates on first-order preferences (maximize welfare). The Williamsian agent operates on a **second-order volition** (Frankfurt) that locks in a specific weighting for "spouse" that is immune to marginal trade-offs.
  *   **Deliberation Costs and Screening:** The "thought" represents a computational step. The Utilitarian algorithm requires querying the global welfare function $W$. The Williamsian algorithm uses a **heuristic screening rule**: "If $relation = spouse$, then $weight = \infty$."
      *   Williams argues that running the global calculation *corrupts the value of the relationship*. In DT terms, the utility derived from the relationship is **procedurally dependent**. $U_{relationship}$ is not just a function of the outcome (wife lives), but of the *reason* the outcome was chosen.
      *   $U = f(\text{outcome}, \text{decision\_procedure})$. Standard DT usually assumes $U = f(\text{outcome})$. Williams insists the procedure is a constitutive part of the outcome's value.

  ---

  ### Part II: The Residue Report

  Here we assess the fidelity of the translation. Which elements of Williams survive the formalization, and which are lost or distorted?

  #### 1. Clean Translations
  *   **Agent-Relative vs. Agent-Neutral:** This maps perfectly onto the distinction between maximizing a local payoff function versus a global social welfare function. Williams's complaint that Utilitarianism ignores the "boundary of the self" is precisely a complaint about imposing an agent-neutral objective function on an agent-relative decision node.
  *   **Ground Projects as Constraints:** Modeling "ground projects" as lexical constraints or feasible set restrictions is a standard move in bounded rationality and behavioral economics. It captures the *rigidity* Williams attributes to integrity.
  *   **Procedural Utility:** The idea that the *process* of deliberation affects utility is well-established in behavioral DT (e.g., preferences over lotteries vs. outcomes, or aversion to trade-off thinking). Translating "one thought too many" as an aversion to specific deliberative procedures is formally coherent.

  #### 2. Distortions and Stretches
  *   **Identity as a Parameter:** In DT, preferences are typically taken as given (exogenous). Williams treats projects as *constitutive of the self*. To model this in DT, we must treat the utility function itself as a variable that can be "broken" or "violated." But if the agent maximizes a utility function that says "preserve my identity," they are still just maximizing.
      *   *The Distortion:* We turn a **categorical imperative** (I cannot do this) into a **high-cost preference** (I won't do this because the cost to my identity is too high). Williams insists it is not about cost; it is about intelligibility. The act becomes *unthinkable*, not just *suboptimal*. DT struggles to model "unthinkability" without simply assigning infinite disutility, which looks suspiciously like a mathematical trick to avoid the trade-off.
  *   **The Value of the Motive:** In the "One Thought Too Many" case, we modeled the value as procedurally dependent. However, Williams suggests the motive *partly constitutes the relationship*. If I save my wife *because* of a calculation, the relationship *is already damaged*, regardless of my felt utility.
      *   *The Distortion:* DT models this as a loss of utility. Williams models it as a loss of *meaning*. A loss of meaning is not necessarily a loss of welfare in the economic sense. We are stretching the definition of "utility" to cover "moral meaning," which risks making the utility function tautological (i.e., "I value what I value").

  #### 3. No Counterpart (The Hard Residue)
  *   **The Locus of Agency:** DT assumes a unified maximizer. Williams's philosophy often implies a fragmented self, where "I" am not just the decider but also the *site* of projects that I did not necessarily choose but which define me. DT has no variable for **authorship** distinct from **causality**. In DT, if I cause it, I own it. For Williams, I can cause an outcome without it being *my action* in the moral sense (e.g., being forced to choose).
  *   **Normative Force vs. Explanatory Power:** DT is explanatory (why did the agent choose $X$?). Williams is normative (why *should* the agent choose $X$?). When we translate Williams into DT, we turn his normative claims into descriptive claims about preference structures. We lose the **normative bite**. We can explain why an integrity-preserving agent *would* refuse to shoot the Indian, but we cannot capture Williams's claim that the Utilitarian *ought not to ask them to*, even if they would.
  *   **Moral Luck:** Williams emphasizes that much of our moral life is subject to luck. DT attempts to minimize luck through Expected Utility (averaging over probabilities). Williams's residue is the specific weight of the *actual* outcome on the agent's life, not the ex-ante expectation.

  ---

  ### Part III: Evaluation of the Residue

  Does this residue reveal a limitation of the decision-theoretic framework, or does it show that Williams's argument loses force when made precise?

  **Verdict: The residue reveals a structural limitation of standard Rational Choice Theory.**

  Here is why:

  1.  **The Reduction of the Categorical to the Hypothetical:**
      Decision theory is fundamentally consequentialist in its structure: acts are evaluated by their mapping to outcomes (utility). Williams's core insight is that some moral considerations are **non-consequentialist constraints**. When we translate these constraints into DT (e.g., by assigning infinite disutility to violating them), we are still treating them as *consequences to be avoided*.
      *   *The Limitation:* DT cannot distinguish between "I don't do this because it hurts me too much" and "I don't do this because it is not me." Both look like utility maximization. Williams argues the latter is not a form of maximization at all; it is a refusal to enter the calculus. DT structurally requires an entry into the calculus. Therefore, DT cannot formally represent the *refusal to calculate* without turning that refusal into a calculation.

  2.  **The Problem of Endogenous Preferences:**
      Williams argues that our projects make us who we are. In standard DT, preferences are stable and exogenous. While evolutionary game theory and behavioral economics allow for preference evolution, they still treat preferences as *objects* to be satisfied. Williams treats projects as the *subject* that is doing the satisfying.
      *   *The Limitation:* DT lacks a formal category for **constitutive norms**. It can model rules (as in Rule Utilitarianism or Nash Equilibria in repeated games), but these rules are always justified by their payoff consequences. Williams argues integrity is justified by the agent's identity, not its payoff. DT has no variable for "identity" other than "preference bundle."

  3.  **Does Williams Lose Force?**
      One might argue that if Williams's argument cannot be formalized, it is merely poetic intuition. However, the translation shows that to formalize Williams, we must break the **consequentialist closure** of standard decision theory.
      *   If we accept the translation where "integrity" is just a high-weight preference, Williams *does* lose force. He becomes a Rule Utilitarian in disguise.
      *   But the Residue Report shows that this translation is inadequate. It fails to capture the *alienation* Williams describes. Alienation is not high disutility; it is a disconnect between the agent and the act.
      *   Therefore, the inability of DT to capture Williams without distortion suggests that **standard Rational Choice is insufficient for modeling moral psychology.** It can model *behavior* that looks like integrity, but it cannot model the *reasons* that constitute integrity without reducing them to another form of value to be maximized.

  **Conclusion:**
  Williams's arguments, when translated, expose the **consequentialist bias** inherent in the structure of utility maximization. The "residue" is the non-instrumental value of the agent's own life and agency. Decision theory can accommodate this only by expanding its definition of "utility" to include deontological constraints and identity-constitutive rules as primitive inputs, rather than derived outputs. If we do this, we are no longer doing standard Rational Choice; we are building a new framework that admits the very limitations Williams identified. Thus, the argument retains its force: it demonstrates that a purely consequentialist decision architecture is structurally incapable of representing the phenomenology of moral commitment.
