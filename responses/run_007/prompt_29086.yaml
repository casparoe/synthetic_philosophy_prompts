      *   **Explore the "Exits" (focusing on user's constraints):**

          *   *Exit A: The Lexical View (Breaking the Chain).*
              *   Idea: Some values are "higher" than others. A life of flourishing cannot be traded off against *any* number of lives of mere contentment.
              *   Cost: Seems arbitrary (where is the line?) and violates "continuity." It makes small differences in quality suddenly matter infinitely much once a threshold is crossed.
              *   *Refinement:* This addresses the "arbitrary" worry. It's not arbitrary if you posit distinct *categories* of value (Mill's higher/lower pleasures).

          *   *Exit B: Critical Level Utilitarianism.*
              *   Idea: Adding a life only adds value if their welfare is above a certain "critical" level (not just "worth living").
