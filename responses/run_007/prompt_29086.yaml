          *   *Mechanism:* At some point, the loss in quality *does* outweigh the gain in quantity, even if the step is small. This challenges the idea that small losses are always negligible compared to population doubling.
          *   *Verdict:* This is the most common "intuitive" escape, but requires defending a non-aggregative view.

      *   **Option 4: Change the Theory of Value (Average Utilitarianism, Prioritarianism, Sufficientarianism, Person-Affecting Views).**
