answer: |-
  This is a classic problem in OCR and type design: you are bumping up against the difference between a **glyph** (the shape) and a **character** (the semantic identity). Your friend isn't labeling shapes; she's labeling *intent*.

  Here are the three most plausible rules she is using, what they predict for the Cyrillic glyph, and how to test them.

  ### 1. The Three Plausible Rules

  **Rule A: Visual Phenomenology ("The Duck Test")**
  *   **The Logic:** If it looks like an 'a' to a human observer, it is an 'a'. Shape is the only truth. Context, font, and encoding are irrelevant noise.
  *   **Fits Data:** Explains why Times, Futura, Italic, Uppercase, and sloppy handwriting are all 'a'. They all share the essential visual topology of 'a'.
  *   **Prediction for Cyrillic 'а':** **a**
      *   *Reasoning:* You stated it renders pixel-for-pixel identical to the Latin 'a'. Under a visual rule, there is no distinction to be made.

  **Rule B: Script Membership ("The Latin Club")**
  *   **The Logic:** The label 'a' is shorthand for "The Latin Letter A." The glyph must belong to the Latin script inventory. A type designer knows that U+0061 (Latin) and U+0430 (Cyrillic) are fundamentally different characters, even if they share outlines.
  *   **Fits Data:** Explains why 'd' is rejected (wrong letter) and accommodates the variance in style (single vs. double storey) because those are still within the Latin script's allowed variations. The sloppy handwriting is accepted because the *intent* was a Latin shopping list.
  *   **Prediction for Cyrillic 'а':** **not a**
      *   *Reasoning:* Even though it looks identical, it is a Cyrillic character inside a Russian word. It is not a member of the Latin alphabet.

  **Rule C: Functional/Phonetic Equivalence ("The Sound Test")**
  *   **The Logic:** The label 'a' represents the phonemic concept of the open front vowel /a/. Any glyph serving that linguistic function counts.
  *   **Fits Data:** Explains why uppercase and lowercase are both 'a' (same sound/letter identity) and why different fonts work.
  *   **Prediction for Cyrillic 'а':** **a**
      *   *Reasoning:* In Russian, this glyph performs the exact same linguistic function as 'a' does in English. It is the "A" of that writing system.

  ### 2. My Best Guess

  **She will label it: `not a`**

  **Why?**
  Your friend is a **type designer**. To a type designer, script identity is sacred. The fact that you noted it is "sitting inside an actual Russian word" is the smoking gun.

  In professional typography and Unicode standards, "Homoglyphs" (characters that look the same but are different codes) are treated as distinct entities to prevent security spoofing (e.g., `paypal.com` vs `раypal.com` using Cyrillic 'а'). If she labels the Cyrillic glyph as 'a', she is teaching your OCR to conflate scripts, which creates a "transliteration" engine rather than a "transcription" engine.

  Given she accepted the sloppy handwriting, she cares about *human intent*. In a Russian word, the intent is to write Cyrillic, not Latin. Therefore, it is not the Latin letter 'a'.

  ### 3. The Disambiguation Test

  To cleanly tell **Rule A (Visual)** apart from **Rule B (Script)**, show her this glyph:

  **The Greek Capital Alpha (Α), U+0391**

  *   **The Setup:** Ensure it is rendered in a font where it is pixel-identical to the Latin Uppercase 'A' (which she already labeled **a**).
  *   **The Context:** Show it inside a Greek word (e.g., "Αλφα").

  **The Results:**
  *   **If she says `a`:** She is following **Rule A (Visual)**. She doesn't care about script identity, only shape. This means your OCR should treat Cyrillic 'а' as 'a' as well.
  *   **If she says `not a`:** She is following **Rule B (Script)**. She accepts the shape *only* when it belongs to the Latin script. This confirms your Cyrillic glyph should be `not a`.

  *(Note: Rule C is unlikely given her profession, but if she says `a` to the Greek Alpha, it could also support the Phonetic rule, as Alpha also makes an /a/ sound. However, the Script rule is the most robust explanation for a type designer.)*
