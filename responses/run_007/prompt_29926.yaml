prompt: |-
  ok so in my biology class we did a unit on behavioural genetics and we kept coming back to this same argument about heritability and nobody could settle it. like half the class (and honestly most of the internet) says stuff like "heritability of IQ is 0.6 so 60% of your intelligence comes from your genes" and the other half says "no you dont understand what heritability means, its a population statistic, it doesnt tell you about individuals, and it changes depending on the environment." and then the first group says "ok but if its high that still means genes matter a lot" and it just loops.

  but what i've noticed is that even after everyone agrees on the textbook definition — that heritability is the proportion of phenotypic variance in a population attributable to genetic variance in that population — the argument doesnt actually stop. the people who think heritability is a useful and important concept still think that, and the people who think its misleading or even meaningless still think that. and theyre not disagreeing about the maths.

  so my question is: what kind of disagreement is this actually? is it a substantive disagreement about what counts as a good scientific explanation — like, do the two sides have different standards for when a statistic is "telling you something real"? is it a political disagreement in disguise, where people's views about heritability are downstream of their views about whether genetic explanations are dangerous? or is it a genuine empirical disagreement about whether heritability estimates are stable enough across environments to be worth reporting? i have a hunch its mostly the second one — that the real disagreement is about the social implications and people are just using methodological arguments as ammunition — but im not sure.

  and given your diagnosis, what would actually move this debate? is there an experiment or a conceptual distinction that could settle it, or is it the kind of thing where the two sides are just never going to agree because theyre asking different questions?

  also please write your answer in british english (im from manchester and its weird reading american spellings in philosophy stuff)
