answer: |-
  You have hit on something quite profound there. It is a very sharp observation to notice that the argument persists even after the textbook definition is agreed upon. If it were merely a misunderstanding of the maths, clarifying the definition should settle it. The fact that it does not suggests the disagreement is deeper.

  To answer your question directly: this is primarily a **philosophical disagreement about causation and explanation**, which is then intensified by a **political disagreement about values and risk**. It is rarely just one or the other.

  Here is how I would break it down.

  ### 1. The Conceptual Clash: Variance vs. Mechanism

  The core friction is that the two sides are using the word "cause" to mean two different things.

  *   **Side A (The Biometric View):** They are interested in **prediction and variance**. To them, if a statistic predicts differences between people in a specific context, it is "real" and useful. When they say "genes matter," they mean "knowing genetic relatedness helps us predict phenotypic differences in this current environment." They view heritability as a measure of *current* causal weight.
  *   **Side B (The Developmental View):** They are interested in **mechanism and malleability**. To them, a cause is something that, if manipulated, changes the outcome. They argue that because genes require an environment to express themselves (gene-environment interaction), partitioning them into percentages is like asking "how much of the area of a rectangle is due to its length and how much is due to its width?" It is a category error.

  The reason the definition doesn't stop the argument is that Side A hears the definition and thinks, "Yes, that statistic is robust," while Side B hears the definition and thinks, "Yes, that statistic is abstract and disconnected from biological reality."

  Side B is arguing that heritability is **ontologically shallow**. It describes the spread of data, not the machinery of the trait. Side A argues that even if it is shallow, it is **epistemologically useful** for prediction. They are talking past one another about what counts as a "good explanation."

  ### 2. The Political Dimension (Your Hunch)

  You suspected this was mostly political, and you are partly right, but perhaps not in the cynical way you might think. It is not necessarily that people are lying about the maths to push an agenda. Rather, the **stakes** of the interpretation are political.

  *   **The Risk of Determinism:** If the public (or policymakers) interpret $h^2 = 0.6$ as "60% fixed," it can lead to fatalism or reduced funding for education and social intervention. Side B is often motivated by a precautionary principle: because this statistic is so easily misunderstood (the "hereditarian fallacy"), and the consequences of misunderstanding are harmful (eugenics, inequality justification), we should treat the statistic with extreme scepticism or stop using it in public discourse.
  *   **The Risk of Denialism:** Side A often feels that acknowledging genetic influence is necessary to understand human diversity properly. They worry that ignoring genetics in favour of pure environmentalism is unscientific and prevents personalised approaches (e.g., in medicine or education).

  So, the political disagreement is about **risk management**. Side B thinks the risk of misinterpretation outweighs the scientific utility. Side A thinks the risk of ignoring biological reality outweighs the potential for misuse.

  ### 3. What Would Move the Debate?

  Is there an experiment or distinction that could settle this? Probably not a single one, because it is partly normative (about what we *ought* to do with the data). However, three things could shift the terrain:

  **A. The Flynn Effect as a Trump Card**
  The strongest empirical argument against the "genes matter most" inference is the Flynn Effect (the rise in IQ scores over the 20th century). We know IQ heritability is high *within* generations, yet the average IQ rose significantly *between* generations. Since the gene pool did not change that fast, the environment must be capable of shifting the trait massively, even when heritability is high.
  *   **The Move:** If Side A accepts that high heritability does **not** imply immutability, the heat goes out of the argument. The disagreement often stalls because Side A implies immutability without saying it outright.

  **B. Shifting from Variance to Mechanism**
  Behavioural genetics is currently moving from twin studies (which estimate variance) to molecular genetics (GWAS, polygenic scores).
  *   **The Move:** If we can identify specific genetic variants and show *how* they interact with specific environmental triggers, the abstract $h^2$ number becomes less important. We stop asking "how much is genetic?" and start asking "which genes, under which conditions?" This satisfies Side B's demand for mechanism while giving Side A the biological specificity they want.

  **C. A Normative Agreement on Policy**
  We need a philosophical distinction between **explanatory** and **prescriptive** claims.
  *   **The Move:** The debate would settle if both sides agreed on this rule: *Heritability estimates describe the current population structure; they dictate nothing about future potential or policy.* If Side A agrees that a high heritability estimate justifies no specific policy (because environments can change), and Side B agrees that the estimate is valid for describing the current population, the conflict becomes academic rather than ideological.

  ### Conclusion

  To my mind, you are looking at a **perspectival disagreement**.

  Imagine a map. One side is holding a topographic map (showing the terrain/structure), and the other is holding a political map (showing boundaries/jurisdictions). Both are looking at the same land. One says, "Look at the hills," and the other says, "Look at the borders."

  The heritability statistic is the topographic map. It tells you about the landscape of variance *right now*. The critics want the political map. They want to know about power, change, and intervention.

  The argument loops because Side A thinks showing the hills proves the borders are fixed, and Side B thinks pointing out the borders proves the hills aren't real.

  **In summary:** It is a genuine empirical disagreement about the stability of the estimates, but that is amplified by a philosophical disagreement about what constitutes explanation, all of which is fuelled by the very real political fear that genetic explanations will be used to cement social inequality.

  To settle it, we do not need better maths. We need better philosophy. We need to agree that a number describing variance in a population is not a prophecy about an individual's potential. Until that distinction is culturally accepted, the loop will continue.

  Hope that helps clear things up for your studies. It is a proper tricky subject, and you are asking the right questions.
