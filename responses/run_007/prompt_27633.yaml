answer: |-
  **ADVERSARIAL COLLABORATION PROTOCOL: THE DUST SPECKS PROBLEM**

  **Date:** 24 October 2023
  **Parties:** The Proponent of Straightforward Aggregation (hereinafter 'PA') and The Proponent of Lexical Thresholds (hereinafter 'PL').
  **Facilitator:** Coordinator, Population Ethics Working Group.

  ### 1. Shared Claims and Preliminary Commitments

  The undersigned parties hereby affirm the following points of agreement regarding the formulation, scope, and dialectical status of the problem under discussion.

  1.  **Formulation of the Case:** Both parties accept the standard Parfitian formulation: the comparison is between a single individual undergoing a fixed period of intense torture (T) and a sufficiently large number $N$ of distinct individuals each receiving a momentary, mild discomfort akin to a dust speck in the eye (D). The comparison is strictly normative; physical feasibility of gathering $N$ individuals is irrelevant.
  2.  **The Nature of the Question:** The dispute concerns the *axiological* relation between T and $N \times D$. Specifically, it asks whether the 'badness' of states of affairs aggregates linearly across persons, or whether the severity of harm to a single individual imposes a lexical constraint on aggregation.
  3.  **Stakes:** Both parties agree that the outcome bears upon moral decision-making in contexts of resource allocation, risk imposition, and population policy. It is not merely a semantic puzzle but a guide to action under conditions of scarcity and risk.
  4.  **Relevant Considerations:** Both parties acknowledge the following as genuinely relevant evidence:
      *   The phenomenological difference between mild irritation and severe agony.
      *   The moral significance of the 'separateness of persons'.
      *   The intuitive plausibility of transitivity in 'better than' relations.
      *   The implications of the view for the 'Repugnant Conclusion' and related paradoxes in population ethics.
  5.  **Excluded Considerations (Distractions):** Both parties agree to set aside:
      *   Arguments relying on the practical impossibility of affecting trillions of lives simultaneously.
      *   Semantic disputes regarding the definition of 'pain' versus 'discomfort' unless they bear directly on the severity threshold.
      *   Psychological reactions of observers (e.g., disgust or sympathy) unless constitutive of the harm itself.
  6.  **Acknowledgement of Opposing Strengths:**
      *   **PA acknowledges:** The PL's view captures a robust intuition regarding the qualitative distinctness of severe suffering; the idea that torture is *categorically* worse than irritation resonates with common moral practice and protects individuals from being sacrificed for trivial aggregate gains.
      *   **PL acknowledges:** The PA's view respects the intuition that suffering matters regardless of who bears it; ignoring a trillion mild harms simply because they are distributed appears callous and violates the principle that harm is bad *pro tanto*, regardless of distribution.

  ### 2. Schedule of Disagreements

  The following table outlines the specific points of divergence, the precise formulation of each position, the underlying crux, and agreed test cases with recorded predictions.

  | Point of Disagreement | Formulation of Views | The Crux / Sub-Question | Agreed Test Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Continuity of Value** | **PA:** Value (or disvalue) is continuous. There exists no gap in the scale of badness that prevents addition.<br>**PL:** Value is discontinuous. There exists a lexical break where a higher order of badness cannot be compensated by any quantity of a lower order. | Is the scale of moral badness analogous to the real numbers (dense/continuous) or to a hierarchy of types (discrete/lexical)? | **Case:** A spectrum of 1,000 harms ranging from D to T, each marginally worse than the last.<br>**PA Prediction:** There is no sharp cut-off; at some point, aggregation must hold.<br>**PL Prediction:** There is a specific point in the spectrum where lexical priority begins, rendering prior aggregation invalid. |
  | **2. The Role of Numbers** | **PA:** The number of sufferers is morally decisive. If $N$ is high enough, the sum of disvalue exceeds any fixed individual harm.<br>**PL:** The number of sufferers is secondary to the severity per person. Beyond a threshold, $N$ is irrelevant to the comparison with T. | Does the moral weight of a harm increase indefinitely with the number of bearers, or does it plateau once individual severity is low? | **Case:** 'The Long Tail'. $N$ is increased by orders of magnitude (e.g., $10^{100}$).<br>**PA Prediction:** Moral weight increases proportionally with $N$.<br>**PL Prediction:** Moral weight plateaus; $10^{100}$ specks is not worse than $10^{10}$ specks regarding the comparison with T. |
  | **3. Transitivity vs. Intuition** | **PA:** To deny aggregation is to risk violating transitivity (if A > B and B > C, then A > C) across a spectrum of cases.<br>**PL:** Preserving the intuition that T is worse than any $N \times D$ is more important than maintaining strict transitivity across vague boundaries. | Which is the greater theoretical cost: accepting counter-intuitive aggregation or accepting intransitivity/non-linearity in value? | **Case:** 'Sorites of Severity'. If T is worse than $N \times D$, is T-minus-one-second worse than $N \times D$?<br>**PA Prediction:** PL must eventually admit a tipping point to avoid absurdity.<br>**PL Prediction:** PA must eventually admit a categorical difference to avoid the 'absurd' conclusion. |
  | **4. The Unit of Evaluation** | **PA:** The primary unit of moral evaluation is the *state of affairs* (total sum of welfare).<br>**PL:** The primary unit of moral evaluation is the *individual life* (maximum burden borne by any one agent). | Should morality minimise total pain or prioritise the relief of the worst-off individual? | **Case:** 'Two Worlds'. World A: One person tortured. World B: Trillions with specks.<br>**PA Prediction:** World B is worse (higher total disvalue).<br>**PL Prediction:** World A is worse (higher maximum individual disvalue). |

  ### 3. Closing Note on Verbal and Substantive Dispute

  In the course of drafting this agreement, the parties have examined whether the disagreement is merely verbal. We conclude the following:

  There is a **verbal component** regarding the usage of the term 'worse'. PA tends to utilise 'worse' to mean 'contains a greater sum of disvalue units', whereas PL tends to utilise 'worse' to mean 'constitutes a more objectionable state of affairs for a moral agent to permit'. To this extent, some friction arises from differing definitions of the comparative operator.

  However, we jointly affirm that the dispute is **substantively irreducible**. Even if terminology is standardised, the disagreement persists regarding the fundamental structure of value. PA maintains that value is fundamentally additive and impersonal; PL maintains that value is fundamentally constrained by person-affecting limits or severity thresholds. No amount of linguistic clarification will resolve the conflict between the principle of additive utility and the principle of lexical priority. Consequently, the collaboration shall proceed on the basis that this is a genuine conflict of normative theory, not a confusion of language.

  ***

