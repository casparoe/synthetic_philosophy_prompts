answer: |-
  Here is a principled framework designed to capture your intuitions while providing the conceptual precision required for your research.

  ### The Principle of Domain-Relative Normative Relevance

  **Statement:**
  The classification of a disposition (as a preference, bias, or conviction) is determined not by its etiology (chosen vs. unchosen) but by the **normative fit** between three elements: (1) the **grounds** of the disposition, (2) the **constitutive norms** of the domain in which it operates, and (3) the **social meaning** of the features involved.

  *   **A Preference** is a disposition grounded in subjective phenomenological experience (e.g., taste, comfort) operating within a **domain of personal sovereignty**, where the features involved do not function as markers of social status or hierarchy.
  *   **A Bias** is a disposition grounded in features that are **normatively irrelevant** to the domain's constitutive aims, particularly when those features function as markers of historical social stratification, regardless of the agent's endorsement.
  *   **A Moral Conviction** is a disposition grounded in **agent-neutral reasons** (e.g., harm, rights, justice) that claims universal normative authority, distinguishing it from both subjective taste and parochial tradition.

  ---

  ### Application to Your Cases

  This principle resolves the tensions in your cases by shifting focus from the *psychology of the agent* (voluntariness) to the *normative structure of the action*.

  **1. Food/Culture (Preference):**
  *   **Domain:** Personal consumption (Sovereignty).
  *   **Grounds:** Sensory experience (smell, texture).
  *   **Social Meaning:** Cultural origin is incidental to the sensory experience.
  *   **Verdict:** Fits **Preference**. The domain permits subjectivity, and the feature (cuisine type) tracks sensory input, not social status.

  **2. Hiring/Alma Mater (Bias):**
  *   **Domain:** Professional distribution (Norm: Merit/Fairness).
  *   **Grounds:** Shared history (Alma mater).
  *   **Relevance:** Normatively irrelevant to competence.
  *   **Verdict:** Fits **Bias**. The feature violates the domain's constitutive aim (selecting the best candidate) and functions as in-group favoritism.

  **3. Dating/Race (Bias):**
  *   **Domain:** Intimate association (Sovereignty *but* socially embedded).
  *   **Grounds:** Racial category.
  *   **Social Meaning:** Race is a primary marker of historical stratification.
  *   **Verdict:** Fits **Bias**. Although the domain is private, the feature (race) carries a social meaning of exclusion that reinforces public hierarchies. Unlike Case 1 (sensory), this tracks a social status category. *This explains why involuntariness does not excuse it: the defect lies in the social meaning of the feature, not the control over the feeling.*

  **4. Veganism (Conviction):**
  *   **Domain:** Moral action.
  *   **Grounds:** Complicity in harm (Suffering).
  *   **Justification:** Agent-neutral (suffering is bad for any sentient being).
  *   **Verdict:** Fits **Conviction**. It claims universal authority based on a reason (harm) accessible to all agents, not just tradition or taste.

  **5. Religion/Same-Sex Marriage (Bias):**
  *   **Domain:** Civil/Political rights (Norm: Equality).
  *   **Grounds:** Religious tradition.
  *   **Justification:** Agent-relative (authoritative only to believers).
  *   **Verdict:** Fits **Bias**. While experienced as a conviction by the agent, in the *political domain*, tradition alone is normatively irrelevant to restricting the rights of others. It fails the "agent-neutral" test required for a public moral conviction. *This distinguishes it from Case 4: Case 4 appeals to harm (universal); Case 5 appeals to tradition (particular).*

  **6. Medical/Implicit Racism (Bias):**
  *   **Domain:** Clinical care (Norm: Need-based treatment).
  *   **Grounds:** Race (Implicit).
  *   **Endorsement:** None.
  *   **Verdict:** Fits **Bias**. The feature is normatively irrelevant to pain management. The lack of endorsement confirms it is a cognitive defect rather than a value judgment.

  **7. Donation/Local vs. Global (Torn):**
  *   **Analysis:** This is a conflict of **Domain Definitions**.
      *   If the domain is "Effective Altruism" (Norm: Maximize good), the feature (proximity) is irrelevant → **Bias**.
      *   If the domain is "Common Sense Morality" (Norm: Special Obligations), the feature (community membership) is relevant → **Preference/Permission**.
  *   **Verdict:** The principle identifies this as a **Boundary Case**. Your tension arises because you are oscillating between two legitimate normative frameworks for the domain of charity.

  **8. Pork vs. Dog (Torn):**
  *   **Analysis:** This turns on the **Social Meaning** of species.
      *   If species membership is viewed like Case 1 (cultural culinary tradition) → **Preference**.
      *   If species membership is viewed like Case 4 (capacity for suffering) → **Bias** (Speciesism).
  *   **Verdict:** The principle identifies this as a **Contested Classification**. If you accept the premise of Case 4 (suffering is the moral metric), Case 8 is a bias because the distinction (companion vs. food) does not track the morally relevant feature (sentience). If you view diet as purely cultural sovereignty, it is a preference.

  ---

  ### Application to the New Case

  **Case:** A university admissions officer gives weight to an applicant being the first in their family to attend college.

  *   **Domain:** Higher Education Admissions.
  *   **Constitutive Aims:** Academic excellence *and* social mobility/diversity (depending on institutional mission).
  *   **Feature:** First-generation status.
  *   **Normative Relevance:** Unlike race in Case 3 or alma mater in Case 2, this feature is often instrumentally relevant to the goal of overcoming structural disadvantage and enriching the educational environment. It does not reinforce a hierarchy of *superiority* but aims to mitigate a hierarchy of *opportunity*.
  *   **Verdict:** **Neither Bias nor Preference.** This is a **Policy Judgment** aligned with the domain's corrective aims. It passes the relevance test because the feature is tied to the institutional goal of equity, not an irrelevant heuristic or subjective taste.

  ---

  ### Mismatches and Required Revisions

  No principle captures every intuition without cost. Here are the specific tensions this principle creates for your current verdicts:

  **1. The "Dating" Revision (Case 3):**
  *   **Implication:** By classifying racial dating exclusions as a *bias* based on social meaning, this principle commits you to the view that private intimate choices are subject to moral critique regarding social hierarchy.
  *   **Revision Required:** You must accept that "personal sovereignty" in dating is not absolute. If you wish to protect dating preferences as purely private *preferences*, you must weaken the "Social Meaning" clause, but doing so would make it harder to condemn Case 2 (Hiring) if the manager claims "culture fit" is just a subjective feeling. The principle forces consistency: if social status matters in hiring, it matters in dating.

  **2. The "Religion" Revision (Case 5):**
  *   **Implication:** Classifying religious opposition to same-sex marriage as a *bias* rather than a *conviction* relies on the distinction between agent-neutral (harm) and agent-relative (tradition) reasons.
  *   **Revision Required:** You must be prepared to argue that for a moral claim to count as a *conviction* in a pluralistic context, it must be justifiable via public reason (e.g., harm, rights) rather than sectarian authority. Some religious philosophers will reject this, arguing their tradition *is* agent-neutral truth. Your principle takes a side: in the public domain, unshared authority functions as a bias.

  **3. The "Species" Tension (Case 8):**
  *   **Implication:** If you maintain Case 4 (Veganism) as a *Conviction* based on harm, consistency demands Case 8 (Dog vs. Pig) be classified as a *Bias* (speciesism), because the distinction does not track the harm principle.
  *   **Revision Required:** You cannot comfortably hold that Case 4 is a rational conviction while Case 8 is a harmless cultural preference. The principle suggests you should revise your view of Case 8 toward *bias* if you want to maintain the coherence of Case 4.

  ### Summary for Your Research

  To distinguish preference from bias without pathologizing the agent:
  1.  **Drop Voluntariness:** Do not use "chosen vs. unchosen" as the criterion. Both biases and preferences can be unchosen.
  2.  **Focus on Relevance:** Ask, "Is the feature driving this disposition relevant to the norms of this specific domain?" (e.g., Race is irrelevant to hiring; Taste is relevant to food).
  3.  **Check Social Meaning:** Ask, "Does this feature reinforce a historical hierarchy?" (e.g., Race does; Cuisine type generally does not).

  This framework allows you to criticize the *disposition* (as a bias) without necessarily condemning the *person* (as pathological), satisfying your goal of responding to disagreement constructively.
