answer: |-
  This is one of the most enduring and frustrating debates in the philosophy of medicine, and your intuition that something structural is preventing resolution is spot on. You have correctly identified that the stalemate isn't due to a lack of data; we have more biology than ever, yet the definition of disease remains contested.

  To diagnose this disagreement, we need to look past the surface arguments and examine the underlying architecture of the debate. Here is a brainstorming of the potential sources of the impasse, followed by my settled diagnosis.

  ### Brainstorming the Sources of Impasse

  **1. Extensional Agreement vs. Intensional Disagreement**
  You noted that both sides agree on most cases (cancer is a disease; running a marathon is not). In philosophy, this is called *extensional agreement*. They point to the same things. However, they disagree on *intension* (the definition or criteria used to pick out those things).
  *   *Why this causes stalemate:* As long as biology and human values align (which they usually do—most biological failures are also bad for the person), the debate seems abstract. It only flares up on edge cases (deafness, aging, mild hypertension). Because the edge cases are rare relative to the whole, neither side feels pressured to concede; they can both claim their theory explains 95% of cases "better."

  **2. The "Natural Kind" Fallacy**
  Naturalists often treat "disease" as if it were a *natural kind*, like "gold" or "electron." They assume there is a mind-independent fact of the matter waiting to be discovered. Normativists treat "disease" as a *social kind*, like "money" or "marriage," which exists only because we agree on its function.
  *   *Why this causes stalemate:* If one side is looking for a rock and the other is looking for a rulebook, they will never find the same thing. The Naturalist waits for a biological discovery to settle the debate; the Normativist waits for a social consensus. Neither is coming.

  **3. The Conflation of Explanation and Justification**
  The word "disease" is doing two different jobs simultaneously.
  *   *Job A (Scientific):* Explain *why* the body is failing (etiology/mechanism).
  *   *Job B (Social):* Justify *why* we should intervene (insurance, exemption from work, medical resources).
  *   *Why this causes stalemate:* Naturalists are good at Job A but struggle with Job B (why treat a statistically abnormal trait if it doesn't cause harm?). Normativists are good at Job B but struggle with Job A (how do we distinguish disease from social disapproval without biology?). They are arguing over a single word that is trying to perform two incompatible functions.

  **4. The Theory of Biological Function**
  Naturalists rely on the concept of "function" (e.g., the heart's function is to pump blood). But "function" is notoriously slippery. Is it what evolution designed? What it currently does? What the owner wants it to do?
  *   *Why this causes stalemate:* Until there is a consensus in the philosophy of biology on what "function" means, the Naturalist definition of disease rests on shaky ground. However, fixing this wouldn't satisfy the Normativist, who argues that even a perfectly defined biological dysfunction isn't a *disease* unless it matters to the human living it.

  ### The Diagnosis

  After weighing these factors, I do not believe this is merely a verbal dispute (where we could simply agree to use different words), nor is it a purely factual question about biology.

  **This is a pragmatic stalemate over the authority of medical classification.**

  The debate persists because "disease" is a **boundary concept** that sits between the natural world (facts) and the social world (values). Both sides are partially right: biology provides the *mechanism*, but values provide the *motive*. The impasse exists because both camps are trying to reduce the concept to only one of these dimensions to secure authority. Naturalists want medicine to be objective science (immune to political change); Normativists want medicine to be responsive to human suffering (immune to biological reductionism).

  The debate will not move via a new empirical discovery (like finding a "disease gene" for homosexuality) because the disagreement isn't about the data; it's about what we are allowed to *do* with the data. Progress requires abandoning the search for a single, essential definition of disease and instead adopting a **pragmatic pluralism**: accepting that "disease" might mean slightly different things in different contexts (e.g., in a research lab vs. an insurance office vs. a patient's lived experience).

