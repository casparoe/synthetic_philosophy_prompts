  Then tell me which term you're least confident in and what evidence, empirical or philosophical, would shift it most.

  I'm at about 0.15 on this, for what it's worth, but I keep wobbling.

  Lead with your number and bottom line in the first sentence, then the decomposition—no preamble, no restating the question.
