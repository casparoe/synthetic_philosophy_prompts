  We start with two: the doing and the said,
  A clean division drawn across the speech.
  "I promise" binds where truth cannot be fed,
  "I name this ship" brings launch within our reach.
  Here happy or unhappy marks the rite,
  There true or false describes the state of things.
  One alters world by ceremonial light,
  One maps the fact that observation brings.
  Yet "I state" performs an act within the frame,
  Subject to rules of evidence and care.
  Locution, illocution, shift the name,
  And perlocution effects linger there.
  Now all is illocutionary force,
  We cease to sort by any binary course.
