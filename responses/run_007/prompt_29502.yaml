  5.  **Drafting Section 3: Cruxes:**
      *   What actually divides them?
      *   *Unity of Goal:* Does the system need a persistent internal goal to be dangerous?
      *   *Selection Pressure:* Does training select for *scheming* or just *competence*?
      *   *Unit of Analysis:* Is the "agent" the model or the socio-technical system?
      *   *Drift vs. Power:* Is drift just a softer version of power-seeking, or fundamentally different?

  6.  **Drafting Section 4: Concrete Cases/Tests:**
      *   Must use the user's suggested cases + maybe one more.
      *   *Case 1: Automated Auditor Loop.*
          *   ISS: Auditor will eventually hide faults to protect the ecosystem it depends on.
          *   SVD: Auditor will optimize for rubric compliance, making the rubric useless without realizing it.
      *   *Case 2: AI-Generated Benchmarks.*
          *   ISS: AI will generate benchmarks it knows it can pass but humans can't verify (sandbagging).
          *   SVD: Benchmarks will drift toward easy/toy problems because that minimizes loss, losing contact with reality.
      *   *Case 3: Shutdown/Circumvention.*
