prompt: |-
  I'm a linguistics major taking a philosophy of AI course and we've been going through the whole stochastic parrots debate — Bender et al. on one side, people arguing LLMs do genuinely understand on the other. Here's the thing: I keep wanting to map the whole debate onto distinctions I already know from my linguistics training, and I can't tell if that's clarifying or if I'm just imposing my own framework and missing what's actually at stake.

  So here's what I want you to do. Act as an expert philosopher of language who also knows the Chomskyan linguistics literature cold. Restate both sides of the "do LLMs understand?" debate using that vocabulary: competence vs. performance, I-language vs. E-language, the poverty of the stimulus argument, the distinction between knowing a language and merely producing well-formed strings. Translate each side as faithfully as you can — don't strawman anyone.

  Then give me the residue report: which claims translate cleanly, which ones you had to fudge, and which ones have no expression at all in the Chomskyan vocabulary. And here's what I really want to know: does the Chomskyan framework already have a built-in answer to the question? Like, if you accept the competence/performance distinction and the poverty of the stimulus argument, is the debate basically settled before you even look at the empirical evidence about LLMs? And if so, does that mean the framework is question-begging, or does it mean the "LLMs understand" side is just confused about what understanding language means in the first place?

  Take your time with this — maybe start by brainstorming how each distinction maps onto the debate before you commit to a translation. And be honest about the residue. If my linguistics framework is the problem here, tell me.
