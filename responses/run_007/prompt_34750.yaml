      *   "Most optimistic agent acts" -> "Maximum of N estimates exceeds threshold".
      *   *Systematic Over-action* -> *Inflated Type I Error Rate (Familywise Error Rate)*.
      *   *Winner's Curse* -> The estimate associated with the action is biased upward (the "winning" estimate is larger than the true effect).
      *   *Selection Effects* -> Only the extreme tail triggers action.
      *   *Principle of Conformity* -> *Correction for Multiple Comparisons (Bonferroni, etc.)* or *Meta-analytic thinking*.

  4.  **Drafting - Section 1: Statistical Restatement:**
      *   Start by acknowledging the user's expertise.
