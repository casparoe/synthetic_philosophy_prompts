answer: |-
  Dear colleague, it is a pleasure to connect with someone who navigates the replication crisis with such fluency, and your intuition about the unilateralist's curse is remarkably sharp. You have spotted a structural isomorphism that deserves to be pulled into the light. To restate the unilateralist's curse in the vocabulary of statistical inference, imagine a scenario where a single hypothesis is being tested not by one laboratory, but by N independent agents, each possessing an unbiased estimator of the true effect size of a proposed intervention, subject to some variance. In standard scientific methodology, we worry about the multiple comparisons problem when a single researcher runs many tests and reports only the significant ones, thereby inflating the Type I error rate. The unilateralist's curse is essentially a distributed multiple comparisons problem where the family of tests is not controlled by a single principal but is scattered across autonomous agents. Each agent applies a significance threshold to their private estimate, deciding to act if their estimate exceeds a certain value of expected utility. Because the action is unilateral, the collective outcome is determined by the maximum of these N estimates. Even if every individual estimator is unbiased, the maximum of N estimators is positively biased. This is the winner's curse in its purest form: the agent who ends up taking the action is precisely the one whose noise term was most favorable, leading their private estimate to systematically overshoot the true value. Consequently, the group engages in the action far more often than the true effect size would warrant, effectively operating at a familywise error rate that approaches one as the number of agents increases, even if each individual maintains a strict alpha level. The selection effect here is identical to the file-drawer problem, except the file drawer is filled with inaction rather than unpublished papers; we only observe the decision made by the outlier, while the restraint of the N minus one peers remains invisible. The proposed philosophical remedy, the principle of conformity, maps directly onto a correction for multiple comparisons, such as a Bonferroni correction. Just as a statistician lowers the alpha threshold per test to maintain a desired familywise error rate across the family, the unilateralist is asked to lower their subjective threshold for action based on the number of peers who could also act. Alternatively, it resembles a demand for meta-analytic consensus before rejecting the null hypothesis of inaction, requiring the signal to be strong enough to survive aggregation across the group rather than strong enough to convince a single optimistic outlier.

  When we look closely at where this mapping holds and where it begins to fray, the residue report reveals both the power and the limits of viewing normative philosophy through a statistical lens. The parts that translate cleanly are the mechanics of the error itself. The mathematics of extreme value theory describes the unilateralist's curse perfectly; the probability that at least one agent overestimates the value enough to trigger action is a straightforward calculation of cumulative distribution functions. The diagnosis of why it happens is identical to the diagnosis of p-hacking via selective reporting: conditioning on an extreme event introduces bias. The statistical framework also captures the epistemic humility required by the solution. Just as a researcher should doubt a p-value of 0.04 if they know it was the winner of a hundred tests, an agent should doubt their optimistic valuation if they know they are the only one among a hundred peers who sees such high value. In this sense, the unilateralist's curse is indeed the multiple comparisons problem in philosophical dress, describing how independent sampling without centralized error control leads to systematic false positives.

  However, there is significant residue where the statistical vocabulary stretches or fails to capture the philosophical nuance. The most prominent distortion lies in the nature of the threshold. In statistical inference, the alpha level is a methodological convention chosen to balance Type I and Type II errors, often standardized at 0.05 for convenience. In the unilateralist scenario, the threshold for action is a moral or prudential judgment about expected utility. The statistical framework treats false positives and false negatives as symmetric errors unless explicitly weighted, but the unilateralist curse often arises in contexts of existential risk where the cost of a false positive acting is asymmetrical and catastrophic. The principle of conformity is not just a methodological correction; it is a moral obligation to defer, which implies a normative weight that p-value adjustments do not carry. A statistician corrects for multiple comparisons to find the truth; a unilateralist conforms to prevent harm. This introduces a tension that standard inference does not model: the trade-off between safety and innovation. If you apply a Bonferroni correction to scientific discovery, you reduce false positives but also reduce power, potentially missing true effects. If you apply the principle of conformity to technological release, you reduce risk but potentially stall beneficial progress. The statistical vocabulary describes the cost in terms of power and error rates, but it lacks the vocabulary to adjudicate the moral weight of those errors.

  Furthermore, the statistical framework struggles to express the absence of a centralized decision-maker, which is the core political feature of the curse. In standard multiple comparisons, there is an implicit assumption of a single analyst or a coordinated team controlling the familywise error rate. The unilateralist's curse arises specifically because there is no such central authority. The statistical vocabulary assumes a monolithic mind managing the error budget, whereas the philosophical problem is distributed across competing minds who may not even know they are part of the same family of tests. This is where the analogy reveals something the philosophers might be missing. By framing it as a multiple comparisons problem, we see that the solution does not necessarily require moral deference or conformity, but rather coordination or information sharing. In statistics, we solve multiple comparisons by accounting for the number of tests, but we also solve it by preregistration or open science, which makes the family of tests visible. If the agents could communicate their estimates, the problem dissolves into a meta-analysis without needing anyone to defer blindly. The statistical perspective suggests that the curse is not inevitable due to human nature, but due to information asymmetry. The philosophers focus on the individual's duty to conform, but the statistician sees a system design failure where the familywise error rate is unmanaged because the family is undefined.

  Ultimately, while the structural mechanics of the unilateralist's curse are identical to the winner's curse and multiple comparisons problems, the philosophical stakes introduce a layer of agency and normativity that statistical inference treats as exogenous. The statistical framework is too crude to capture the moral responsibility of the outlier, treating them merely as a data point in a distribution, but it is also sharper than the philosophical framework in identifying the structural solution. The curse is not just about being too optimistic; it is about acting as if you are the only test being run when you are actually part of a larger family. Your vocabulary can express the mechanism of the error with greater precision than the philosophical literature, but it cannot fully capture the normative force of the remedy. The unilateralist's curse is the multiple comparisons problem embedded in a game-theoretic context where the players are not trying to minimize error rates but to maximize utility, and where the cost of error is borne by the public rather than the researcher. This distinction matters because it suggests that statistical reform movements, which focus on changing individual researcher behavior through better incentives and transparency, might offer a blueprint for solving unilateralist dilemmas. If we can teach scientists to adjust for the hidden multiplicity of their analyses, we might also teach agents to adjust for the hidden multiplicity of their potential actions. The residue, then, is not a failure of the statistical model, but a challenge to extend its logic from the epistemology of data to the ethics of action.
