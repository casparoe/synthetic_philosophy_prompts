      *   Action occurs if *any* estimator exceeds a threshold.
      *   This is exactly controlling the Familywise Error Rate (FWER) at the level of the group, not the individual.
      *   If each acts at alpha = 0.05, the group error rate is 1 - (0.95)^N. As N grows, false positives (bad actions) approach 1.
      *   The "winner's curse" applies: the agent who acts has an estimate conditioned on being the maximum. Their estimate is positively biased relative to the true value.
      *   The "principle of conformity" is analogous to adjusting the alpha level for multiple comparisons (e.g., Bonferroni correction: alpha/N) or requiring a meta-analytic consensus before acting.
