      *   *Selection:* The Relativism/Universalism tension. If sentiment grounds morality, and sentiments differ, does Hume's argument only work for 18th-century British gentlemen? This undermines the philosophical force.

  6.  **Pre-talk Adjustments:**
      *   Need to inoculate against the "Consequentialist" reading early.
      *   Need to acknowledge the Historian's concern.
      *   Need to signal to the Chair that character isn't ignored, just reframed.

  7.  **Review against Constraints:**
      *   Voices sound distinct? Yes.
