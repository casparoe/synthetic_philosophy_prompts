      *   *Fix:* Frame the delay as "Heat Dump." While the demon erases, the room gets "hotter" (molecules move faster/more chaotically).
      *   *Refinement on Cheating:* Students might try to reuse sticky notes without "erasing." Need a clear visual state for "full."
