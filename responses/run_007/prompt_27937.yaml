answer: |-
  Here is a breakdown of the problem space, structured as you requested. I've started with my working notes to show how we get from raw intuitions to formal requirements, followed by the cleaned-up list of desiderata, an analysis of their compatibility, and a brief scorecard of the major views.

  ### Phase 1: Working Notes & Brainstorming
  *Before we formalize, here are the raw intuitions and technical constraints floating around in the literature. This is the "messy" part of the philosophical process.*

  *   **The Mugging Intuition:** It feels crazy to give a stranger $5 because they claim to be an alien who will reward you with $5 \times 10^{100}$ utils if you do. A theory that says "do it" is broken.
  *   **The Zero Prob Problem:** But if we say "ignore probabilities below 1 in a billion," we treat $10^{-100}$ the same as 0. That breaks Bayesian updating. If I learn the prob is $10^{-90}$, do I suddenly care? That creates a cliff-edge.
  *   **St. Petersburg:** A game where you flip a coin until heads. Payoff is $2^n$. Expected value is infinite. Should I pay my life savings to play? EV says yes. Intuition says no.
  *   **Money Pumps:** If my preferences aren't transitive (A > B, B > C, C > A), someone can trade with me in a circle and leave me with less money than I started. A decision theory can't allow this.
  *   **Dominance:** If Option A is better than Option B in every possible scenario, I must choose A. If a theory violates this, it's hard to call it "rational."
  *   **Cluelessness:** In real life (e.g., donating to charity), I don't know the exact probabilities. I don't even know the *range* of possible outcomes. A theory requiring precise numbers is useless for humans.
  *   **Repeatability:** If I can make the Pascal's Mugging choice a million times, EV works (Law of Large Numbers). The problem is mostly about one-shot, high-stakes decisions.
  *   **Boundedness:** Is utility actually bounded? Can there *be* a payoff so good it's infinitely better than a happy life? If utility is bounded, fanaticism dies. But is that a fact about the world or a cheat code?

  ***

  ### Phase 2: The Formal Desiderata
  *Here is the cleaned-up specification. These are the requirements a decision theory must address to be considered adequate for handling tiny probabilities and enormous payoffs.*

  #### 1. The Anti-Fanaticism Constraint
  *   **The Case:** **Pascal's Mugging.** A agent demands your wallet, threatening (or promising) an astronomically large outcome unless you comply, with a probability so low it compensates for the absurdity in standard Expected Value (EV) calculations.
  *   **The Requirement:** The theory must not recommend sacrificing significant certain goods for tiny-probability enormous goods unless the probability is *epistemically warranted*. It must prevent "fanatical" choices where the tail of the probability distribution swamps the head.
  *   **Distinctions to Preserve:** It must distinguish between **reasonable long-shot bets** (e.g., buying a lottery ticket for fun, or high-risk high-reward entrepreneurship) and **structurally fanatical bets** (where the payoff is arbitrarily scaled to match the probability). It should also ideally distinguish between **one-shot decisions** (where fanaticism is dangerous) and **repeatable decisions** (where EV converges).
  *   **Formal Constraint:** **Boundedness or Discounting.** The theory needs a mechanism (like bounded utility or probability discounting) that prevents the integral of (probability $\times$ value) from diverging or dominating reasonable baselines.

  #### 2. The Probabilistic Sensitivity Constraint
  *   **The Case:** **The Continuity Intuition.** If you reject a bet at probability $10^{-100}$, at what exact number do you accept it? $10^{-99}$?
  *   **The Requirement:** The theory must treat non-zero probabilities as distinct from zero probabilities. It cannot simply set a "cutoff" where anything rarer than 1 in a trillion is treated as impossible.
  *   **Distinctions to Preserve:** **Tiny Probability vs. Zero Probability.** If you treat tiny probabilities as zero, you violate Bayesian updating (you can never learn a hypothesis is true if you start with prior 0). It must also distinguish **well-estimated probabilities** (dice rolls) from **radical uncertainty** (metaphysical claims).
  *   **Formal Constraint:** **Archimedean Property (Continuity).** Roughly, for any three outcomes A > B > C, there should be some probability mixture of A and C that is preferable to B. Lexical views often violate this.

  #### 3. The Formal Coherence Constraint
  *   **The Case:** **Money Pumps & Dutch Books.** If your preferences cycle or contradict the axioms of probability, an adversary can construct a series of trades that leaves you strictly worse off.
  *   **The Requirement:** The theory must generate preferences that are acyclic and consistent. You cannot be forced into a loop where you pay to switch from A to B, B to C, and C to A.
  *   **Distinctions to Preserve:** **Rational Preference vs. Psychological Whim.** It must separate what you *want* from what is *consistent*.
  *   **Formal Constraint:** **Transitivity and Dominance.** If Option X yields a better outcome than Option Y in every possible state of the world, the theory must rank X > Y. (Note: Some risk-weighted views struggle here).

  #### 4. The Infinity Management Constraint
  *   **The Case:** **The St. Petersburg Paradox.** A game with infinite expected value.
  *   **The Requirement:** The theory must yield a finite valuation for games with infinite mathematical expectation, or explain why such games cannot exist in reality. It cannot crash or output "undefined."
  *   **Distinctions to Preserve:** **Huge Finite vs. Actual Infinite.** A payoff of $10^{100}$ is physically different from $\infty$. The theory shouldn't treat them identically if the math distinguishes them.
  *   **Formal Constraint:** **Convergence.** The calculation of value must converge to a real number, or the theory must explicitly reject the possibility of the scenario (e.g., by denying infinite utility is possible).

  #### 5. The Epistemic Accessibility Constraint
  *   **The Case:** **Cluelessness.** In real-world altruism (e.g., "Does saving a life now increase total future happiness?"), we often cannot assign precise probabilities or values.
  *   **The Requirement:** The theory must be usable by agents with limited cognitive resources and incomplete information. It cannot require precision that the evidence does not support.
  *   **Distinctions to Preserve:** **Risk (known probs) vs. Uncertainty (unknown probs).** It must handle cases where you can't even assign a number (Knightian uncertainty).
  *   **Formal Constraint:** **Robustness.** Small changes in the estimated probability or value shouldn't cause massive flips in the recommended action (unless the change crosses a specific threshold defined by the theory).

  ***

  ### Phase 3: Status & Incompatibilities
  *This is the critical part for your debate prep. Not all requirements are created equal, and some fight each other.*

  **Non-Negotiable vs. Camp Preferences**
  *   **Non-Negotiable:** **Formal Coherence.** If a theory allows money pumps or violates dominance without a very specific reason, it is generally considered broken in decision theory. You can't be rational if you are exploitable.
  *   **Non-Negotiable:** **Epistemic Accessibility.** Since you specified a theory for *actual people*, a theory requiring perfect probability estimates is a non-starter for your purposes.
  *   **Camp Preference:** **Anti-Fanaticism.** Standard Expected Value theorists (like some Effective Altruists) argue fanaticism isn't a bug, it's a feature. They argue we *should* pursue the tiny chance of saving the universe. So, avoiding fanaticism is a desideratum for *you*, but not for a strict EV maximizer.
  *   **Camp Preference:** **Bounded Utility.** This is a solution, not a requirement. You can satisfy Anti-Fanaticism via bounded utility, but you could also do it via probability discounting.

  **The Impossibility Trilemma (The "Beckstead-Thomas" Result)**
  *   Here is the big conflict you are looking for. Recent work (notably by Beckstead and Thomas, 2021) suggests you cannot jointly satisfy these three conditions:
      1.  **Avoid Fanaticism** (Tiny probs don't dominate).
      2.  **Respect Dominance** (If A is better in every state, pick A).
      3.  **Respect Continuity** (Tiny probs aren't treated as zero).
  *   **The Trade-off:**
      *   **Standard EV** keeps Dominance and Continuity but fails Anti-Fanaticism.
      *   **Lexical Views** (treat tiny probs as zero) keep Anti-Fanaticism and Dominance but fail Continuity.
      *   **Bounded Utility** keeps Anti-Fanaticism and Continuity but can violate Dominance in specific infinite cases (or requires you to accept that value *physically* caps out).

  ***

  ### Phase 4: Theory Scorecard
  *Per your request, brief evaluations of how the main views handle the desiderata.*

  *   **Plain Expected Value Theory:** Aces Formal Coherence and Probabilistic Sensitivity, but fails Anti-Fanaticism and Infinity Management (it tells you to pay infinite amounts for St. Petersburg).
  *   **Bounded Utility:** Solves Anti-Fanaticism and Infinity Management nicely, but faces pushback on whether utility *can* be bounded (is there really a limit to how good a world can be?) and can struggle with Dominance in edge cases.
  *   **Risk-Weighted (Buchak):** Tries to weight probabilities by risk attitudes; handles Anti-Fanaticism better than EV, but often violates Dominance and can be money-pumped if not carefully formulated.
  *   **Lexical / Probability Discounting:** Solves Anti-Fanaticism decisively by treating tiny probs as zero, but violates Probabilistic Sensitivity (Continuity) and creates arbitrary cliff-edges that break Bayesian updating.

  ### Final Advice for the Club
  When you present this, emphasize that there is no "free lunch." Every solution to the fanaticism problem costs you something else (usually Continuity or Dominance). The debate isn't about which theory is perfect, but which constraint we are most willing to relax. For a high school audience, the most compelling angle is usually **Epistemic Accessibility**: even if EV is mathematically correct, humans are terrible at estimating $10^{-100}$, so a theory that requires us to do so is practically dangerous.
