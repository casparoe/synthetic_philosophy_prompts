      *   *Correction:* Does Avicenna conclude the soul is *immortal* here? Not directly in the Flying Man argument itself. That comes later. The Flying Man proves *substantiality*. I need to make sure I don't conflate the two.
      *   *Emphasis:* Make sure to distinguish between *existence* (wujūd) and *essence* (dhāt). The Flying Man affirms his *dhāt*.

  6.  **Final Polish:** Check tone. Be respectful of the survey article (these summaries often simplify) but firm on the philosophical distinctions. Ensure the distinction between "Cartesian certainty" and "Avicennian primitivity" is clear.

      *(Self-Correction on "Foundationalism"):* Avicenna *is* a foundationalist in a broad sense (primary concepts), but not *Cogito*-foundationalist. The summary implies the latter. I need to be precise there.

  7.  **Final Output Structure:**
