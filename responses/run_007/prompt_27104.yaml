answer: |-
  Elena: "Consider the Letter Spirit approach. To recognize an 'a', the system doesn't match pixels; it instantiates a schema. There's a vertical stem on the right, a closed counter on the left. Whether it's a two-story serif or a one-story sans, those functional roles are preserved. The style parameter just dictates curvature and thickness."

  Marcus: "But that preservation is exactly what's in doubt. Take the two-story 'a'. It has two counters: the upper loop and the lower bowl. The one-story 'a'—the handwritten 'ɑ'—has only one. If your schema requires a 'closed counter on the left,' you're describing both, but you're ignoring the topological difference. One has a hole the other lacks. How is that just style?"

  Elena: "Because the essential role isn't 'two holes'; it's 'enclosed space anchored by a vertical stroke.' The upper loop in the two-story variant is a stylistic elaboration on the stem's connection point. It's optional ornamentation, not a defining role. If I strip the top loop off a Times New Roman 'a', I get a shape functionally identical to a Futura 'a'. The core roles—stem, bowl—remain intact."

  Marcus: "You're smuggling in the conclusion. You say the top loop is 'ornamentation' only because you've already decided the one-story 'a' is the canonical form. But historically, the two-story comes first in print. If I start there, then the one-story 'a' is missing a role entirely. You're saying the schema tolerates deletion of major structural components. At what point does deleting a role stop being 'style' and start being a different letter? If I delete the bowl, it's an 'l'. If I delete the loop, it's still an 'a'? That distinction feels imposed by you, not found in the ink."

  Elena: "Fair. I grant that 'optional ornamentation' is too weak. Let me adjust: the roles are defined by their relational necessity, not their physical presence. The lower bowl is necessary because it creates the specific counter-space that distinguishes 'a' from 'c' or 'u'. The upper loop is redundant to that specific distinction. So, the schema isn't a checklist of parts; it's a minimal graph of relations required to maintain identity within the alphabet system."

  Marcus: "That helps, but it shifts the burden to 'required for distinction.' Who decides what's required? In my exemplar view, the category 'a' is a cloud of remembered forms. The one-story and two-story variants are both central to that cloud. We don't parse them into stems and bowls to recognize them; we recognize them because they sit near the prototype in a high-dimensional similarity space. The reason you don't delete the bowl is that no exemplar exists without one. The constraint isn't logical; it's statistical."

  Elena: "But statistics don't explain generalization. If I show you a completely novel 'a'—say, constructed of dashed lines—you recognize it instantly. You haven't seen that exemplar before. You're parsing the roles. However, I will concede this: the mapping isn't always one-to-one. The 'stem' in a one-story 'a' might correspond to the 'right edge of the loop' in a two-story. The roles are fluid, not rigid slots."

  Marcus: "I can accept fluid alignment. In exemplar theory, alignment is part of the similarity metric. But here's where I press you: if the roles are fluid, if the top loop can vanish or become a stem segment, what work is the schema actually doing? You're describing a flexible mapping process that looks suspiciously like my similarity metric, but you're insisting on labeling the nodes of that map as 'real' abstract entities. Why posit the schema at all if it morphs to fit the data?"

  Elena: "Because the schema explains *why* the similarity space is structured that way. The similarity isn't accidental; it's constrained by the communicative need for distinct roles. But I admit, if the roles are too fluid, the line between 'schema' and 'abstracted exemplar' blurs. My commitment is that the roles are cognitive primitives we bring to the page. Yours is that they are shadows cast by the pages themselves."

  Marcus: "Precisely. And until we can show whether the brain parses the stroke before recognizing the letter, or recognizes the letter to parse the stroke, we're stuck. I'll grant that pure pixel-matching is dead; some structural alignment happens. But I maintain that the 'roles' you love are just reified regularities, not the engine of recognition."

  Elena: "And I maintain that without the engine, the regularities have no direction. We agree on the fluidity of the mapping, but not on its origin."

  Summary: The residual disagreement is whether structural roles are ontological primitives that govern perception or emergent regularities abstracted from perceptual similarity.
