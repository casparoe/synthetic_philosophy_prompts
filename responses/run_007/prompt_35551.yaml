      *   *Tone Check:* Is it too academic? Too dry? The prompt asks for a document the group *should have produced*. It needs to sound like a serious philosophical consensus statement.
      *   *Accuracy Check:* Does this accurately reflect Deutsch-Wallace vs. Sebens-Carroll?
