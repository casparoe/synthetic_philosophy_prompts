  # JOINT STATEMENT ON THE BORN RULE PROBLEM IN EVERETTIAN QUANTUM MECHANICS
  **Adversarial Collaboration Document**  
  **Date:** October 26, 2023  
  **Parties:** The Decision-Theoretic Working Group (DT) & The Self-Locating Uncertainty Working Group (SLU)

  ## PREAMBLE
  This document represents the output of a six-month adversarial collaboration between two factions within a reading group focused on the derivation of the Born Rule within the Everettian (Many-Worlds) interpretation of quantum mechanics. Both parties accept the universal validity of unitary quantum mechanics (no collapse). Both parties agree that recovering the appearance of stochasticity and the specific probabilities of the Born Rule ($P = |\psi|^2$) is a necessary condition for the theory's empirical adequacy. The purpose of this document is not to declare a winner, but to isolate the precise locus of disagreement, distinguish substantive issues from verbal disputes, and identify the specific arguments that would constitute progress.

  ## I. AGREED CLAIMS
  *Both camps endorse the following propositions as the baseline for further debate.*

  1.  **The Formalism:** We agree that the underlying physics is described by a universal wavefunction evolving unitarily according to the Schrödinger equation. There is no fundamental collapse mechanism.
  2.  **The Target:** We agree that the goal is to recover the *empirical appearance* of the Born Rule. Specifically, we must explain why experimental statistics align with squared amplitudes and why rational agents should bet in accordance with them.
  3.  **Branch Counting is Ill-Defined:** We agree that "naive branch counting" (assigning equal probability to each distinct outcome regardless of amplitude) is not a viable strategy. The decomposition of the wavefunction into "branches" is basis-dependent and continuous; there is no discrete integer count of worlds that can ground probabilities.
  4.  **Functionalism about Probability:** We agree that "probability" in this context must be understood functionally. It is defined by the role it plays in reasoning and action (e.g., guiding credences, licensing bets, explaining frequencies), rather than as a primitive physical propensity (since the theory is deterministic).
  5.  **The Incoherence Problem:** We agree that both approaches must address the "incoherence problem": How can an agent anticipate a specific outcome when they know all outcomes will occur? Neither side believes this problem is trivially solved.
  6.  **No-Go Theorems:** We agree that existing no-go theorems (e.g., regarding non-contextuality) do not rule out Everettianism, provided a coherent account of probability is supplied. Conversely, we agree that without such an account, the theory is empirically incomplete.
  7.  **Semantic Clarification:** We acknowledge that a portion of our dispute is verbal. Specifically, the term **"Uncertainty"** is used differently:
      *   **DT** tends to use it to denote a *practical stance* required for decision-making.
      *   **SLU** tends to use it to denote a *factual epistemic state* regarding indexical location.
      *   *Agreement:* We will treat this terminological difference as a symptom of the deeper substantive disagreement regarding the order of explanation (see Section II).

  ## II. DISAGREEMENTS AND CRUCES TABLE

  | Issue | Decision-Theory (DT) Camp Position | Self-Locating (SLU) Camp Position | The Crux (What settles it?) | Agreed Evidence / Argument Type | DT Prediction on Resolution | SLU Prediction on Resolution |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Order of Explanation** | **Rationality Grounds Credence.** The Born Rule is derived from norms of rational action. If an agent satisfies axioms (e.g., Diachronic Consistency, Branching Indifference), they *must* act as if the Born Rule is true. Credence is a byproduct of rational preference. | **Credence Grounds Rationality.** Rational action presupposes epistemic uncertainty. We must first establish that an agent *is* uncertain (via self-location) before we can apply decision theory. You cannot derive "ought" (betting) without an "is" (epistemic state). | **Can decision-theoretic axioms be justified without presupposing probabilistic beliefs?** | **Formal Axiomatic Analysis.** A rigorous check of DT axioms (e.g., in Wallace's proof) to see if they implicitly assume a probability measure or can be grounded in purely non-probabilistic preferences. | Axioms will be shown to rely only on ordering and consistency of preferences over physical outcomes, independent of prior credence. | Axioms will be shown to smuggle in probabilistic assumptions (e.g., "Branching Indifference" assumes weights matter before we know why). |
  | **2. The Nature of "Uncertainty"** | **Uncertainty is Functional.** "Uncertainty" is just the name for the situation where an agent cares about multiple future successors with different weights. It is not a state of ignorance about facts, but a state of *divided caring*. | **Uncertainty is Indexical.** There is a genuine fact of the matter about "which branch I am on" during the split (specifically post-interaction, pre-observation). This is standard self-locating ignorance, analogous to the Sleeping Beauty problem. | **Is there a coherent first-person perspective during branching that allows for indexical ignorance?** | **Phenomenological/Conceptual Analysis.** Thought experiments involving amnesia or delayed observation (e.g., Sebens-Carroll's "Once-Or-Twice" scenario) to test if subjective uncertainty is intelligible. | Agents do not need to feel "ignorant" to be rational; they only need to value successors according to weight. "Uncertainty" is a loose way of speaking about this valuation. | Agents *do* feel ignorant in specific branching setups (e.g., when the split happens before the observer registers it), proving uncertainty is real and precedes betting. |
  | **3. The Role of the Agent** | **The Agent is a Pattern.** The agent is a structure within the wavefunction. The question is: how should this structure evolve its preferences to remain consistent over time? The focus is on the *temporal extendedness* of the agent. | **The Agent is a Subject.** The agent is a locus of experience. The question is: what does this subject know about their immediate future? The focus is on the *immediate epistemic access* of the subject. | **Does the "Person" persist as one entity branching into many, or does the "Subject" split into distinct entities immediately?** | **Metaphysics of Personal Identity.** Analysis of fission cases in philosophy of mind applied to quantum branching. | Personal identity is preserved in a branching sense; rationality constraints bind the pre-branch agent to the post-branch successors. | Personal identity splits; the pre-branch agent has uncertainty about which successor they will *be* (or experience as). |
  | **4. Circularity Charge** | **Non-Circular.** The Deutsch-Wallace proof does not assume probability. It assumes *preferences*. The Born Rule emerges as the unique solution to satisfying those preferences in a branching context. | **Circular.** The DT axioms (specifically those weighting branches) only make sense if one already accepts that branch weights are the kind of thing that *should* influence preference. This assumes the conclusion. | **Can "Branch Weight" be defined independently of probability?** | **Operational Definition.** Can we define "weight" purely via interference phenomena or Hilbert space geometry without invoking "likelihood"? | Yes. Weight is a physical property (amplitude squared) that rational agents must respect, similar to how they respect energy conservation. | No. Weight is physically real, but its normative force (why care about it?) requires a prior probabilistic link. |

  ## III. PATHWAYS TO PROGRESS
  *To move beyond the current stalemate, both camps agree to pursue the following specific lines of inquiry:*

  1.  **The "Zero-Weight" Test:** Both camps agree to analyze cases where branch amplitude approaches zero.
      *   *DT Task:* Show how the axioms handle branches with negligible weight without invoking "improbability."
      *   *SLU Task:* Show how self-locating uncertainty handles branches that are physically present but effectively inaccessible.
  2.  **The "Pre-Branching" Bet:** Both camps agree to analyze a scenario where a bet is offered *before* the branching event but paid out *after*.
      *   *Goal:* Determine if the justification for taking the bet relies on anticipated uncertainty (SLU) or anticipated consistency of preferences (DT).
  3.  **Axiom Decomposition:** The DT camp agrees to attempt a derivation of the Born Rule using a reduced set of axioms that the SLU camp explicitly endorses as non-probabilistic. If this fails, it supports the SLU circularity charge. If it succeeds, it supports the DT autonomy claim.

  ## IV. SIGNATORIES

