      *   *The Core Problem:* EQM is deterministic. The wavefunction evolves unitarily. All outcomes occur. How do we recover the *appearance* of stochasticity and specifically the Born Rule ($P = |\psi|^2$)?
      *   *Decision-Theory (DT) Camp:* We don't need "uncertainty" in the classical sense. We need to justify why a rational agent acts *as if* probabilities exist. The Deutsch-Wallace theorem shows that if you satisfy certain rationality axioms (ordering, diachronic consistency, etc.), your preferences must align with Born weights.
      *   *Self-Locating Uncertainty (SLU) Camp:* DT puts the cart before the horse. You can't talk about rational betting unless there's something to be uncertain *about*. We need an epistemic foundation. When a branch splits, there is a period of subjective uncertainty about "which branch I am on." This justifies the credences, which then ground the decision theory.
      *   *Common Ground:* Both accept EQM (no collapse). Both accept the Born Rule is the target. Both reject "naive counting" of branches (since branch count is ill-defined). Both agree standard frequentism doesn't apply directly.

  3.  **Drafting Section (a): Agreed Claims:**
      *   Need to establish the baseline physics.
      *   Need to establish the target (Born Rule).
      *   Need to acknowledge what *doesn't* work (branch counting).
      *   Need to acknowledge the role of the agent (both involve agents, just differently).
      *   *Drafting thought:* Make sure to mention Unitary QM. Make sure to mention that "probability" needs to be explicated functionally.

  4.  **Drafting Section (b): Precise Disagreements:**
      *   This needs to be careful. The DT camp shouldn't feel accused of "ignoring epistemology," and the SLU camp shouldn't feel accused of "adding hidden variables."
      *   *DT Position:* The justification is normative (how one *should* act). Uncertainty is derivative or unnecessary.
      *   *SLU Position:* The justification is epistemic (what one *knows*). Action follows belief.
      *   *Key distinction:* Is the Born Rule a constraint on *action* or a constraint on *belief*? (Actually, both think it's both, but the *grounding* differs).
      *   *Refinement:* The core split is the *order of explanation*. DT: Rationality $\to$ Credence. SLU: Credence (via self-location) $\to$ Rationality.

  5.  **Drafting Section (c) & (d): Cruxes and Evidence:**
      *   What would change minds?
      *   *Crux 1: The nature of "Uncertainty" in a deterministic multiverse.* Can you be uncertain if everything happens?
          *   DT says: Yes, in a functional sense, or "uncertainty" is the wrong word; "caring measure" is better.
          *   SLU says: Yes, in a literal indexical sense.
          *   *Test:* Thought experiments about pre-branching vs. post-branching amnesia.
      *   *Crux 2: The status of the Axioms.* Are DT axioms (e.g., Diachronic Consistency) neutral or do they smuggle in the Born Rule?
          *   DT says: They are minimal rationality constraints.
          *   SLU says: They presuppose a probabilistic structure.
          *   *Test:* Formal analysis of the axioms in non-probabilistic branching contexts.
      *   *Crux 3: The "Incoherence Problem".* How can you anticipate a specific outcome if all occur?
          *   DT says: You anticipate the *structure* of the future; anticipation is about preference.
          *   SLU says: You anticipate the experience of a specific successor due to indexical ignorance.
          *   *Test:* Analysis of first-person phenomenology in branching scenarios.

  6.  **Addressing Verbal Disputes:**
      *   "Probability" is the big one. Is it objective chance (propensity), subjective credence, or decision-weight?
      *   "Uncertainty": Is it ignorance of facts or ignorance of indexical location?
      *   Need to explicitly flag this in the intro or a specific section. Let's put it in the Agreed Claims or a preamble to clarify terms.

