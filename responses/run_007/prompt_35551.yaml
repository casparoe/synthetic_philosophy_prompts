prompt: |-
  I'm in a reading group that's been chewing on the Born rule problem in Everettian quantum mechanics for like six months now, and honestly we've gotten to the point where the two camps in the group are just talking past each other. One side (call them the decision-theory camp) thinks the way to get probabilities out of many-worlds is through something like the Deutsch-Wallace argument: rational agents in a branching universe should assign credences proportional to branch weights, on pain of being Dutch-booked or violating decision-theoretic principles. The other side (call them the self-locating camp) thinks that's putting the cart before the horse — you can't just import decision theory into a framework where all outcomes happen, you need some account of self-locating uncertainty first, something like the Sebens-Carroll approach where you're uncertain about which branch you'll find yourself in before the split. They've been going in circles about whether "branch weight" is the kind of thing you can even be uncertain about, whether the decision-theoretic arguments beg the question by assuming the very rationality constraints that are at issue, and whether "caring about your successors" does any real work or is just a fancy way of restating the problem.

  I want to draft the document this group should have produced if they'd actually done an adversarial collaboration instead of just arguing: a joint statement both camps could sign. I want it to include (a) the claims they actually agree on — about the formalism, about what needs explaining, about what the no-go theorems do and don't rule out; (b) the precise statements of where they part ways, phrased so that each camp would accept the wording of its own position; (c) the cruxes — the sub-questions such that settling them would actually move at least one side; and (d) for each crux, the kind of argument or case both sides would agree bears on it, with each side's prediction about how it would come out. I'm less interested in who's right than in getting the disagreement stated exactly enough that you could see what would count as progress. If part of the dispute turns out to be verbal or about differing uses of "probability" or "uncertainty," say which part and why. Format it as a numbered agreed-claims section followed by a disagreements table.
