  *   **Physical Fastening Rule predicts YES:** They are physically fused flesh and bone. They cannot move independently.
  *   **Functional/Causal Unity Rule predicts NO:** They are two distinct organisms (two lives, two minds). They lack the "single causal system" unity of a normal rabbit or human.

  **Why not just stick with the Barnacle?**
  The Barnacle case involves two *different species* (mammal vs. crustacean), which introduces a confounding variable: she might say "No" simply because they are different kinds of things. Conjoined twins are the *same* kind (human), removing that bias. If she says "No, they are two people," she is committed to Functional Unity. If she says "Yes, they compose one physical body," she is committed to Physical Fastening.

  **Professional Tip:** If she hesitates on the twins, ask her about a **human with a pacemaker**.
