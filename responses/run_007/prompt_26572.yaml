  ### The Tie-Breaker Case

  To definitively settle which rule she is committed to, you should ask her about **Conjoined Twins**.

  **The Case:** "Consider conjoined twins who are fused at the torso, share some blood circulation, and move together, but have two separate brains, two separate consciousnesses, and distinct biological life cycles."

