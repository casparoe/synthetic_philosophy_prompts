  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Front-Desk Confidentiality Policy

  **Recommendation**
  I propose we adopt a **Universal Denial Policy** effective immediately. When asked about a specific resident, staff must state that no such person is staying at the shelter, regardless of actual occupancy. We will review this policy in six months to assess security incidents and staff feedback.

  **Reasoning**
  Our core mission is physical safety, secured through confidentiality. In the context of domestic violence, "I cannot confirm or deny" is not a neutral statement. To an abusive partner seeking control, it functions as a confirmation. We have already seen the consequences: a caller recently waited outside after receiving a non-denial, resulting in a resident being followed.

  Operational security requires that we provide no data points to potential threats. A flat denial is the only response that maintains the shelter's location as truly confidential. As a board, our liability and moral duty prioritize the life of the resident over the verbal accuracy of an interaction with a potential aggressor.

  **Addressing the Integrity Concern**
  I know several staff members—and some of us on this board—believe lying is inherently wrong. This is a serious objection. Honesty is a virtue, and requiring staff to speak falsely creates moral distress. I share this unease.

  However, we must distinguish between deception for convenience and deception for protection. In medicine, providers withhold information to prevent harm (e.g., not disclosing a patient's location to a violent family member). In law enforcement, officers use cover stories to prevent crime. In this specific context, a false denial is not a breach of character; it is a safety protocol, equivalent to locking a door. If we prioritize our own comfort with truth-telling over a resident's safety, we fail our primary obligation.

  **Next Steps**
  If we pass this, we must immediately train staff on *why* this is necessary, framing it as security rather than dishonesty. We should also create a channel for staff to discuss moral distress, but the policy must remain firm to ensure consistent protection for every woman who walks through our door.

  I ask for your support on this Thursday.
