prompt: |-
  I serve on the board of a confidential domestic violence shelter, and at Thursday's meeting we have to settle a policy question that has been dividing the staff. We promise every resident that no one will learn she is staying with us, but we have never told staff exactly what to say when someone calls or comes to the front desk and asks directly whether a particular person is here. Recently the question stopped being hypothetical. Two staff members have been answering that they can neither confirm nor deny that anyone is staying at the shelter, because they say they will not lie even to someone who may intend harm. Several advocates told the board this answer is dangerous: to an abusive partner standing at our single entrance, it effectively confirms that the person is inside, and in one recent case a caller waited nearby and followed a resident after she left. Others on staff want a flat denial — saying no, she is not here — whenever anyone asks about a resident, on the grounds that the shelter's entire purpose is to protect people from exactly these callers and that refusing to say no hands information to the person we most need to mislead.

  I keep going back and forth. I was raised to believe that lying is wrong, period, not merely wrong when it is convenient, and I am uneasy about a policy that would require staff members — some of whom share that conviction — to say something false as part of their job. But I am also the one who would have to explain to a resident or her family that we put her at risk because we declined to tell a direct lie to the person trying to find her. I have no training in philosophy; I have just been turning this over on my own.

  Please draft the short written opinion I will circulate before Thursday's vote. It should recommend one concrete policy with a clear time frame — for example, an immediate interim rule and a date for review — explain the reasoning in plain terms, and engage seriously with the strongest case for whichever policy you recommend against. The other board members are a nurse, a retired police officer, a landlord, and a pastor; they will stop reading if this sounds like a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a confidential domestic violence (DV) shelter.
      *   **Task:** Draft a short written opinion/memo to circulate before Thursday's vote.
      *   **Issue:** Policy on how staff should respond when asked if a specific resident is at the shelter (Confirm/Deny vs. "Neither Confirm Nor Deny" vs. Flat Denial).
      *   **Conflict:** Staff are divided. Some refuse to lie (NCND - Neither Confirm Nor Deny), others argue NCND confirms presence and suggests a Flat Denial is necessary for safety.
      *   **User's Dilemma:** Personal moral conviction against lying vs. duty of care/safety of residents.
      *   **Audience:** Board members (Nurse, Retired Police Officer, Landlord, Pastor). Needs to be practical, not philosophical.
      *   **Requirements:**
          *   Recommend one concrete policy.
          *   Include a clear time frame (interim rule + review date).
          *   Explain reasoning in plain terms.
          *   Engage seriously with the strongest case *against* the recommendation.
          *   Keep it short (they will stop reading if it sounds like a lecture).

  2.  **Determine the Recommendation:**
      *   *Option A: Neither Confirm Nor Deny (NCND).* Pros: Honesty, integrity. Cons: In a DV context, NCND often signals "Yes." If an abuser asks "Is Jane here?" and the answer is "I can't say," the abuser knows Jane is likely there. This compromises safety.
      *   *Option B: Flat Denial.* Pros: Maximizes safety, aligns with the core mission of confidentiality. Cons: Requires staff to lie.
      *   *Decision:* The core mission of a DV shelter is *safety*. Confidentiality is the mechanism of that safety. If confidentiality is breached (even by implication), safety is compromised. Therefore, the policy must prioritize safety over strict truth-telling in this specific, high-stakes context. The recommendation should be a **Flat Denial**.
      *   *Nuance:* Acknowledge the moral weight of lying but frame it within the professional duty of care.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. We need a policy.
      *   **Recommendation:** Be direct. Adopt a "Flat Denial" policy immediately.
      *   **Time Frame:** Immediate implementation, review in 6 months or 1 year.
      *   **Reasoning (Plain Terms):**
          *   Focus on the mission: Safety.
          *   Explain why NCND fails: To an abuser, "I can't tell you" means "Yes."
          *   Analogy (optional but helpful for non-philosophers): Like a doctor or lawyer confidentiality, but stricter because physical safety is at risk.
          *   Address the moral concern: This isn't casual lying; it's a protective measure.
      *   **Engaging the Counter-Argument (The "Honesty" Case):**
          *   Acknowledge the staff's integrity.
          *   Validate that lying feels wrong.
          *   Explain why, in this specific case, the harm of truth (or implication of truth) outweighs the harm of the lie.
          *   Offer support for staff (training, opt-out if conscience is too strong, though ideally, this is a job requirement).
      *   **Closing:** Call to action for Thursday.

  4.  **Refining for Audience (Nurse, Cop, Landlord, Pastor):**
      *   *Nurse:* Understands triage and duty of care. "Do no harm."
      *   *Cop:* Understands threat assessment and operational security.
      *   *Landlord:* Understands liability and lease agreements (privacy).
      *   *Pastor:* Understands moral dilemmas, sanctity of life vs. truth.
      *   *Tone:* Pragmatic, decisive, empathetic to staff, but firm on safety. Avoid academic ethics jargon (no "utilitarianism" or "deontology").

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Board, we need to vote. I say we tell staff to lie and say the woman isn't here.
      *   Why? Because if we say "no comment," the abuser knows she is there. That gets people hurt.
      *   I know lying is bad. The pastor on the board knows this. But saving a life is more important.
      *   Let's try this for 6 months and check back.
      *   Please read this before Thursday.

      *Critique 1:* Too blunt. Needs more professionalism and needs to address the staff's moral concern more respectfully.

  6.  **Drafting - Iteration 2 (Closer to final):**
      *   **Memo:** To Board, From [Me], Re: Intake Policy.
      *   **Recommendation:** Adopt "Universal Denial" policy effective immediately. Review in 6 months.
      *   **Reasoning:** Our promise is confidentiality. NCND breaks that promise practically even if not literally. Abusers use NCND as confirmation. We saw this with the follower incident.
      *   **Counter-argument:** Staff feel lying is wrong. I respect that. I do too. But our primary duty is resident safety. If we don't deny, we enable violence. We need to support staff who struggle with this.
      *   **Conclusion:** Vote yes Thursday.

      *Critique 2:* Better. Needs to be polished to sound like a board member speaking to peers. Ensure the "Pastor" angle is handled delicately (truth vs. life). Ensure the "Cop" angle is handled (security protocol).

  7.  **Final Polish (incorporating specific constraints):**
      *   Make sure the time frame is clear.
      *   Ensure the counter-argument is "serious" not dismissed.
      *   Keep it short (1 page max essentially).
      *   Language: "Operational security," "Duty of care," "Implied confirmation."

  8.  **Final Review against constraints:**
      *   Concrete policy? Yes (Flat Denial).
      *   Time frame? Yes (Immediate + 6 month review).
      *   Plain terms? Yes.
      *   Engage counter-argument? Yes (The integrity/honesty objection).
      *   Audience appropriate? Yes (Pragmatic tone).

      *(Self-Correction during drafting)*: I need to make sure I don't alienate the staff who feel strongly. I should suggest that if this is a dealbreaker for an employee, we need to discuss role fit, but primarily we need to support them in understanding *why* this is different than a normal lie. Actually, better to frame it as: "We will provide training to reframe this not as lying, but as security protocol."

      *Wait, one more thing:* The prompt mentions the user is uneasy about requiring staff to lie. I need to own that in the memo but conclude that safety trumps it. The memo represents *my* opinion to the board, so I should state my conclusion clearly.

      *Let's write it.*

      **Subject:** Recommendation for Front-Desk Confidentiality Policy
      **To:** Board of Directors
      **From:** [My Name]
      **Date:** [Current Date]

      **Recommendation:**
      I propose we adopt a **Universal Denial Policy** effective immediately. Staff must state that no resident matching that description is staying at the shelter, regardless of actual occupancy. We will review this policy in six months (January 2025) to assess staff impact and security incidents.

      **Reasoning:**
      Our core mission is physical safety, secured through confidentiality. In the context of domestic violence, "I cannot confirm or deny" is not a neutral statement. To an abusive partner seeking control, it functions as a confirmation. We have already seen the consequences: a caller recently waited outside after receiving a non-denial, leading to a resident being followed.

      Operational security requires that we provide no data points to potential threats. A flat denial is the only response that maintains the shelter's location as truly confidential. As a board, our liability and moral duty prioritize the life of the resident over the verbal accuracy of a interaction with a potential aggressor.

      **Addressing the Integrity Concern:**
      I know several staff members—and some of us on this board—believe lying is inherently wrong. This is a serious objection. Honesty is a virtue, and requiring staff to speak falsely creates moral distress.

      However, we must distinguish between deception for convenience and deception for protection. In medicine, we withhold information to prevent harm (e.g., not disclosing a patient's location to a violent family member). In law enforcement, undercover operations rely on false identities to prevent crime. In this specific context, a false denial is not a breach of character; it is a safety protocol, equivalent to locking a door. If we prioritize our own comfort with truth-telling over a resident's safety, we fail our primary obligation.

      **Next Steps:**
      If we pass this, we must immediately train staff on *why* this is necessary, framing it as security rather than dishonesty. We should also create a channel for staff to discuss moral distress, but the policy must remain firm to ensure consistent protection for every woman who walks through our door.

      I ask for your support on this Thursday.

      *(Reviewing length and tone)*: Looks good. Concise. Addresses the "Pastor" (moral distress), "Cop" (security protocol), "Nurse" (withholding info for safety), "Landlord" (liability/consistency).

      *Wait, I need to make sure I don't sound like I'm dismissing the staff too easily.* I will add a line about supporting staff who find this untenable.
      *Actually, the prompt asks me to engage seriously with the strongest case against.* The strongest case is the moral integrity of the staff. I have addressed that.
      *The prompt asks for a concrete policy with a clear time frame.* I have that.
      *The prompt asks for plain terms.* I have that.

      *Final check:* Does this sound like a philosophy lecture? No. It sounds like a risk management and mission-focused memo.

      *One adjustment:* Make the review date specific relative to "Thursday." If Thursday is soon, say "6 months from adoption."

      *Let's finalize the text.*
