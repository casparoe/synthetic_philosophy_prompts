answer: |-
  This is a sharp observation, and you are correct that it points to a specific tension in the literature that often gets glossed over in introductory treatments of Newcomb's Problem.

  While there isn't a single, universally canonical noun phrase like "The Framing Effect" for this specific phenomenon, it is widely discussed under the headers of **Causal Structure Sensitivity**, **Predictor Mechanism Dependence**, or, in the context of Functional Decision Theory, **Subjunctive Dependence**.

  The philosopher **Arif Ahmed** provides the most direct treatment of exactly what you are describing. In his book *Evidence, Decision and Causality* (2014) and related papers, he argues that Newcomb's Problem is formally underspecified without a description of the *mechanism* of prediction. He contends that your intuition is actually rational: the mechanism tells you about the causal topology, which *should* change your decision, even if the conditional probabilities are held fixed.

  Here is a breakdown of how this is categorized in the literature, why it happens, and how to distinguish it from standard framing effects.

  ### 1. The Closest Established Concept: "Causal Topology"
  In standard decision theory, we often treat Newcomb's Problem as a fixed matrix of probabilities. However, decision theorists (particularly Causal Decision Theorists and Functional Decision Theorists) argue that the **Causal Graph** is the primary object of analysis, not the probability matrix.

  Your intuition shifts because the mechanism description implies different causal graphs:

  *   **The Brain Scanner (Common Cause):** When you hear "brain scanner," you intuitively model a **Common Cause** structure.
      *   *Past Brain State* $\rightarrow$ *Prediction*
      *   *Past Brain State* $\rightarrow$ *Your Choice*
      *   In this graph, your choice cannot causally influence the prediction (the money is already in the box). This triggers **Causal Decision Theory (CDT)** intuitions, leading to **Two-Boxing**.
  *   **The Alien/Simulation (Logical Dependence):** When you hear "infallible alien superintelligence," you intuitively model a **Subjunctive/Logical Dependence** structure.
      *   *Your Decision Algorithm* $\rightarrow$ *Your Choice*
      *   *Your Decision Algorithm* $\rightarrow$ *Alien's Simulation* $\rightarrow$ *Prediction*
      *   Here, the prediction is dependent on the *output of your algorithm*, not just a prior physical state. This triggers **Functional Decision Theory (FDT)** or **Evidential Decision Theory (EDT)** intuitions, leading to **One-Boxing**.
  *   **The Psychologist (Evidential Correlation):** This feels like a statistical correlation based on identity ("I am the kind of person who..."). This leans toward EDT (One-Boxing) but feels weaker than the Alien case because human psychology allows for exceptions (free will noise), whereas the Alien implies logical necessity.

  ### 2. The Arif Ahmed Argument
  Arif Ahmed explicitly argues that **the explanation of reliability matters.** He distinguishes between:
  1.  **Newcomb problems where the prediction is based on a prior cause** (like the brain scanner). Ahmed argues rational agents should **Two-Box** here.
  2.  **Newcomb problems where the prediction is based on a logical/simulative dependency.** Ahmed argues rational agents should **One-Box** here.

  If you find yourself switching answers based on the mechanism, you are effectively doing what Ahmed suggests: updating your causal model based on the ontological story provided. You are treating the "mechanism" not as flavor text, but as data about the causal structure.

  ### 3. Functional Decision Theory (FDT) and "Subjunctive Dependence"
  In the literature surrounding FDT (Yudkowsky, Soares, etc.), this distinction is formalized as **Subjunctive Dependence**.
  *   FDT agents One-Box *only if* the Predictor's output is subjunctively dependent on the agent's decision procedure.
  *   A brain scanner creates a correlation via a common past cause, but not necessarily subjunctive dependence at the moment of decision (the neurons have already fired).
  *   An alien simulator creates subjunctive dependence (if I were to choose differently, the simulation would have output differently).

  Your intuition is tracking whether the setup implies **logical identity** (Alien) vs. **physical correlation** (Scanner).

  ### 4. Why This Is Not Just a "Framing Effect"
  A standard framing effect (like the Asian Disease Problem) is considered a cognitive bias because the underlying mathematical expectation remains identical, and the framing *should not* matter to a rational agent.

  However, in Newcomb's Problem, **the mechanism provides information that the probability matrix does not.**
  *   The probability $P(\text{Prediction} | \text{Choice})$ tells you *that* they correlate.
  *   The mechanism tells you *why* they correlate.

  If you are a Causal Decision Theorist, the "why" is crucial. If the correlation is due to a common cause (Scanner), CDT says Two-Box. If the correlation is due to direct causal influence or logical dependence (Alien), CDT might still say Two-Box, but FDT says One-Box.
  Therefore, your shifting intuition is not necessarily a bias; it is a **rational sensitivity to underspecified causal structure.** You are refusing to treat the problem as a black box when the narrative gives you a peek inside.

  ### 5. Proposed Terminology
  Since there isn't one perfect noun, if you want to refer to this in discussion, the most precise terms would be:

  1.  **Mechanism Sensitivity:** (Descriptive) The degree to which an agent's verdict depends on the causal story of the predictor.
  2.  **Causal Topology Intuition:** (Theoretical) The intuition that shifts based on the implied causal graph (Common Cause vs. Logical Dependence).
  3.  **The Ahmed Distinction:** (Attributive) Referring to Arif Ahmed's argument that mechanism determines rationality in Newcomb cases.

  ### Summary
  You have identified that **Newcomb's Problem is not a single problem, but a family of problems** distinguished by the causal mechanism of the predictor.

  *   **Scanner Newcomb:** Essentially a Common Cause problem. (Intuition: Two-Box)
  *   **Alien Newcomb:** Essentially a Logical/Counterfactual dependence problem. (Intuition: One-Box)

  Your intuition isn't glitching; it's correctly identifying that the **Causal Decision Theory** prescription changes depending on whether the prediction is a *cause* of your choice, an *effect* of your choice (via simulation), or a *joint effect* of a past state. The literature often hides this by stipulating "The Predictor is accurate" without explaining how, which forces the reader to fill in the causal graph themselves. You are just noticing that you fill it in differently depending on the flavor text.

  **Recommendation:** If you write about this, refer to it as **"Sensitivity to Predictor Causal Topology"** or cite **Arif Ahmed's work on the explanation of reliability.** It distinguishes you from people who simply think Newcomb's is about "magic" vs. "physics."
