  # Joint Statement on the Backward Induction Paradox in the Centipede Game

  **Prepared by:** [Orthodox Colleague] and [Revisionist Colleague]  
  **Facilitated by:** [PhD Student Name]  
  **Date:** 24 May 2024

  ## 1. Agreed Claims

  The undersigned parties agree upon the following claims regarding the formal, empirical, and conceptual landscape of the dispute. These claims constitute the common ground from which our disagreement proceeds.

  1.  **Formal Structure:** The Centipede Game is a finite, extensive-form game of perfect information involving two players who alternate moves, with payoffs strictly increasing along the main path but offering a immediate, slightly higher payoff for the player who chooses to terminate the game at any given node.
  2.  **Backward Induction Prescription:** The backward induction algorithm, applied to the standard Centipede Game structure, prescribes that the first player should terminate the game at the initial node, resulting in the subgame perfect equilibrium.
  3.  **Experimental Evidence:** Empirical studies involving human subjects consistently demonstrate that players rarely terminate the game at the first node; instead, they typically pass for several rounds, achieving outcomes closer to Pareto efficiency than the backward induction solution predicts.
  4.  **The Nature of the Paradox:** The 'paradox' consists in the tension between the game-theoretic prescription (immediate termination) and the robust intuition (shared by many philosophers and economists) that rational agents ought to be able to secure mutually beneficial cooperation in this setting.
  5.  **Role of Common Knowledge:** Both sides agree that the standard argument for backward induction relies heavily on the assumption of the Common Knowledge of Rationality (CKR), wherein each player knows the other is rational, knows that the other knows this, and so on *ad infinitum*.
  6.  **Idealisation:** Both sides acknowledge that the dispute concerns idealised rational agents rather than boundedly rational humans, though the empirical behaviour of humans is relevant as a test case for the normative plausibility of the theories.

  ## 2. Disagreements Table

  The following table outlines the specific points of contention. Column (d) indicates whether the parties view the disagreement as substantive (concerning facts or logic) or partly verbal (concerning definitions or terminology).

  | (a) Issue | (b) Orthodox Position | (c) Revisionist Position | (d) Substantive or Verbal |
  | :--- | :--- | :--- | :--- |
  | **Validity of the BI Derivation** | Given CKR and the standard axioms of decision theory, backward induction is the unique logical consequence; any deviation implies a failure of rationality or knowledge. | The derivation is logically unsound because it requires evaluating counterfactuals at nodes that CKR renders impossible to reach, creating an epistemic contradiction. | Substantive |
  | **Counterfactual Reasoning** | Upon observing a deviation, a rational player should maintain the belief that the opponent is rational and treat the deviation as a 'tremble' or mistake, preserving the backward induction logic for future nodes. | Upon observing a deviation, the epistemic basis for CKR is shattered; a rational player must update their beliefs about the opponent's type or rationality, invalidating the continuation of the BI logic. | Substantive |
  | **Normative Status of BI** | Backward induction defines what it means to play rationally in this context; intuitions suggesting otherwise are artefacts of social heuristics misapplied to abstract games. | Backward induction is merely one possible solution concept; rationality may permit or even require strategies that maximise joint payoff if epistemic conditions allow. | Substantive |
  | **Definition of 'Rationality'** | Rationality is defined strictly as instrumental utility maximisation given consistent beliefs; it does not encompass the ability to coordinate on Pareto-superior outcomes without binding agreements. | Rationality includes epistemic consistency; it is irrational to hold beliefs that are falsified by the history of play, even if those beliefs were initially common knowledge. | Partly Verbal |

  ## 3. The Cruxes

  The following sub-questions represent the 'cruxes' of the debate. Settlement of these issues would compel at least one party to revise their position.

  | Crux | Description of Resolution | Orthodox Prediction | Revisionist Prediction |
  | :--- | :--- | :--- | :--- |
  | **Epistemic Modelling** | Can a formal epistemic model be constructed that satisfies a robust definition of CKR but permits non-backward-induction play without logical contradiction? | No. Any such model will be shown to implicitly weaken the CKR assumption or alter the definition of knowledge. | Yes. Models using conditional belief systems or lexicographic probabilities can sustain CKR while allowing for cooperation. |
  | **Belief Revision Policy** | What is the correct logical rule for updating beliefs after an event assigned prior probability zero (a 'surprise' move)? | Minimally invasive revision: retain the hypothesis of rationality and attribute the move to error. | Radical revision: the surprise move warrants downgrading the confidence in the opponent's rationality or the common knowledge assumption. |
  | **Convergence under Learning** | In experiments where highly trained subjects play repeated Centipede Games with random rematching, does behaviour converge to the BI solution? | Yes. As subjects learn the structure and eliminate noise, play will converge to immediate termination. | No. Subjects will converge to a stable pattern of cooperation or remain indeterminate, as BI is not a stable attractor without additional institutional constraints. |

  ## 4. Identification of Verbal Disputes

  While the core of the dispute is substantive, we identify a significant verbal component exacerbating the disagreement. Specifically, the parties are using the phrase **'Common Knowledge of Rationality'** in slightly different senses.

  *   **The Orthodox Usage:** Refers to the initial state of the game. It implies that players *start* with the knowledge that both are utility maximisers. It does not necessarily dictate how that knowledge survives contact with contrary evidence during play.
  *   **The Revisionist Usage:** Implies a dynamic constraint. It suggests that the knowledge must be robust enough to survive the actual history of play. If a move occurs that is inconsistent with CKR, the Revisionist argues CKR is falsified, whereas the Orthodox argues CKR remains the normative baseline and the move is an anomaly.

  Furthermore, there is a verbal divergence regarding the term **'Solution'**. The Orthodox side uses 'solution' to mean the unique outcome prescribed by normative rationality. The Revisionist side uses 'solution' to mean a stable profile of strategies and beliefs that is epistemically consistent throughout the game tree. Clarifying these definitions does not resolve the substantive disagreement about counterfactual logic, but it prevents the parties from talking past one another regarding the status of the assumptions.

  ***

