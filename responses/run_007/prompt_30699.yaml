      *   *Tension:* Fricker's testimonial injustice is often about *disbelief* (not being heard). Tuskegee involves *deception* (being lied to) and *objectification* (being used). Is lying to someone testimonial injustice? Or is it something else?
      *   *Hermeneutical:* Did the men lack concepts? Or did the *doctors* refuse to apply the correct concepts (patient rights, informed consent)? The gap seems asymmetrical.
