prompt: |-
  You are a professional philosopher of mind with expertise in the metaphysics and science of consciousness, and you have been asked to serve as the neutral facilitator for an adversarial collaboration between two camps on the meta-problem of consciousness.

  The first camp is a Chalmers-style phenomenal realist. It holds that there is a hard problem of consciousness: explaining why and how physical processing gives rise to subjective experience, or what it is like to be a subject. On this view, the meta-problem—the problem of explaining why we have the powerful intuition that there is a hard problem, and why we produce the phenomenal reports and judgments we do—is a distinct, largely empirical problem. Solving the meta-problem may clarify the sources of our phenomenal intuitions and even help with the hard problem, but it does not by itself dissolve or debunk the hard problem.

  The second camp is a Frankish-style illusionist. It holds that phenomenal consciousness, understood as a realm of qualitative properties over and above functional, representational, dispositional, and physical facts, is an illusion. On this view, the meta-problem is the central problem: the task is to explain why creatures like us are so strongly convinced that we have such properties. A completed explanation of these intuitions, one that does not itself invoke phenomenal properties, would debunk the intuitions rather than vindicate them.

  Think carefully before you write. In your first pass, brainstorm: (a) claims about phenomenal reports, introspective confidence, and the explanatory gap that both camps could honestly sign; (b) the places where each camp would reject a formulation as slanted; and (c) which apparent disagreements might be partly verbal and which are substantive. Then draft the document.

  Your deliverable is the joint statement these two camps could both sign after a good-faith adversarial collaboration, with the residual disagreement made exact. It must contain the following parts.

  1. Agreed claims. A numbered list of substantive, non-vacuous claims both camps accept. Cover at least: the behavioral and introspective data to be explained (e.g., that people report phenomenal states, find them introspectively obvious, and find physical-functional explanations of them unsatisfying); what the meta-problem asks; what a solution to the meta-problem must do; and constraints on any acceptable explanation of phenomenal reports. Avoid phrasing these so weakly that they are uninformative.

  2. Disagreements table. A table with one row per point of disagreement. Columns: (i) the issue in neutral wording; (ii) the realist's preferred formulation of its own view, which a careful realist would sign; (iii) the illusionist's preferred formulation of its own view, which a careful illusionist would sign; (iv) whether the disagreement is substantive or partly verbal, with a one-sentence note if it is partly verbal. Rows should include at least: whether explaining the intuitions debunks them or leaves the explanatory gap untouched; whether introspective conviction has a special epistemic authority; whether phenomenal properties are needed to explain anything beyond the reports themselves; and whether the conceivability of zombies or the apparent explanatory gap is evidence for realism or just another intuition to be explained away.

  3. Cruxes and tests. Identify the sub-questions such that settling them would move at least one camp. For each crux, specify a concrete case, experimental manipulation, or argument that both camps would accept as bearing on it, and record in advance each camp's prediction about what that test would show and what result would count as a concession or would significantly shift that camp's view. Include at least one crux about dissociations between reports and first-order function (for example, blindsight, change blindness, or subjective inflation), one about a mechanism-level model that predicts and manipulates people's phenomenal intuitions, and one about a hypothetical system built to reproduce human phenomenal reports while remaining functionally and physically specified but lacking, by stipulation, whatever the realist means by phenomenality.

  Do not include a bibliography or reading list. The statement should stand on the content of the two views, not on citations.
reasoning: |-
  Here's a thinking process that leads to the joint statement:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of mind (neutral facilitator).
      *   **Task:** Create a joint statement from an adversarial collaboration between Phenomenal Realists (Chalmers-style) and Illusionists (Frankish-style) regarding the *meta-problem of consciousness*.
      *   **Requirements:**
          1.  Agreed Claims (numbered list, substantive, non-vacuous).
          2.  Disagreements Table (Issue, Realist View, Illusionist View, Substantive/Verbal).
          3.  Cruxes and Tests (Specific cases/experiments/arguments, predictions, concession criteria).
      *   **Constraints:** No bibliography, stand on content, careful brainstorming first.

  2.  **Brainstorming & Strategy:**

      *   *(a) Common Ground:* Both sides agree people *say* they are conscious. Both agree there's an "explanatory gap" intuition (physical stories don't *feel* like they explain experience). Both agree the meta-problem is about explaining *why* we have these reports/intuitions. Both agree a solution needs to be naturalistic (mostly) and shouldn't just say "magic." Both agree that if an explanation works, it needs to account for the *confidence* we have.
      *   *(b) Slanted Formulations:*
          *   Realists hate: "Illusion," "False belief," "Mere representation." They want "Phenomenal properties exist."
          *   Illusionists hate: "Qualia," "Non-physical," "Hard Problem is real." They want "Judgments of consciousness," "Physical/Functional mechanisms."
          *   Neutral phrasing: Use "Phenomenal Reports," "Intuitions of Ineffability," "Subjective Conviction."
      *   *(c) Verbal vs. Substantive:*
          *   *Verbal:* What we call "consciousness." Realists mean the feel; Illusionists mean the judgment about the feel.
          *   *Substantive:* Do phenomenal properties exist independently of the reports? Does solving the meta-problem solve the Hard Problem? Is introspection infallible?

      *   *Drafting the Agreed Claims:* Need to be strong enough to matter but weak enough to sign.
          *   Claim 1: The data (reports, confidence, gap intuition).
          *   Claim 2: The definition of the meta-problem (explain the data).
          *   Claim 3: Constraints (must be consistent with physical science, must explain the *force* of the intuition).
          *   Claim 4: Relationship to the Hard Problem (both agree meta-problem is relevant, disagree on sufficiency). *Wait, need to be careful here.* They agree the meta-problem *exists*, not necessarily its solution's impact. Let's focus on the *task* of the meta-problem.
          *   Claim 5: Introspection is a cognitive process subject to error (maybe too strong for Realists? Chalmers admits introspection can be wrong about *causes*, but not about *existence*. Illusionists say it's wrong about existence. Let's frame it as "Introspection produces representations/judgments").

      *   *Drafting the Disagreements:*
          *   Issue 1: Ontological Status. Realist: Properties exist. Illusionist: Properties are misrepresentations.
          *   Issue 2: Epistemic Authority. Realist: Introspection gives direct knowledge. Illusionist: Introspection is a heuristic.
          *   Issue 3: Meta-Problem Solution. Realist: Explains intuition, leaves Hard Problem. Illusionist: Explains intuition, dissolves Hard Problem.
          *   Issue 4: Zombies/Gap. Realist: Evidence of distinctness. Illusionist: Data to be explained.

      *   *Drafting Cruxes:*
          *   Crux 1: Dissociation (Blindsight/Anosognosia). Can we have function without report or report without function?
          *   Crux 2: Mechanism (Predictive Processing/Error Monitoring). Can we manipulate the *feeling* of consciousness without changing the stimulus?
          *   Crux 3: The Philosophical Zombie (Hypothetical). If we build a perfect functional duplicate, does it have experience?

  3.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Are the agreed claims too weak? "People report consciousness" is trivial. Make it: "People report consciousness *with high confidence* and find physical explanations *unsatisfying*."
      *   *Check:* Is the Disagreement Table neutral? Avoid "True/False." Use "Realist Formulation" vs "Illusionist Formulation."
      *   *Check:* Are the Cruxes actionable? A philosophical zombie isn't testable. I need to frame it as a *conceivability* test or a functional modeling test. Let's focus on the *Functional Duplicate* scenario as a thought experiment where predictions diverge. For the experimental one, focus on "Illusion Induction" (e.g., changing the feeling of agency or vividness via neural stimulation).
      *   *Refining the "Verbal" distinction:* Much of the debate is verbal regarding the definition of "consciousness," but the *existence* claim is substantive. I need to mark that clearly.

  4.  **Final Polish:**
      *   Ensure tone is academic, precise, and collaborative.
      *   Verify all constraints from the prompt are met (3 sections, specific content in each).
      *   Ensure the "Realist" sounds like Chalmers (property dualist or open to it) and "Illusionist" sounds like Frankish (eliminativist about qualia).

  5.  **Drafting the Document (Mental or Scratchpad):**
      *   *Intro:* Set the stage.
      *   *Section 1:* 5-6 claims.
      *   *Section 2:* 4 rows.
      *   *Section 3:* 3 cruxes.
      *   *Review against prompt:* Did I cover behavioral/introspective data? Yes. Meta-problem definition? Yes. Constraints? Yes. Dissociations? Yes. Mechanism model? Yes. Hypothetical system? Yes.

  6.  **Final Review of "Cruxes":**
      *   Crux 1 (Dissociation): Focus on "Subjective Inflation" or "Attentional Blink." Let's use *Subjective Inflation* (reporting seeing something not there). Realist says this is error in judgment, not experience. Illusionist says this proves experience is judgment.
      *   Crux 2 (Mechanism): Focus on *Predictive Processing*. If we can turn off the "feeling" of reality while keeping processing intact.
      *   Crux 3 (The Duplicate): This is the Zombie argument. Realist says "No experience." Illusionist says "Same reports, no extra property needed." The test is conceivability/coherence.

      *Wait, the prompt asks for "a concrete case, experimental manipulation, or argument."* A zombie is an argument. I need to make sure the prediction is clear.
      *   *Correction on Crux 1:* Blindsight is classic. Patients deny seeing but guess correctly. Realist: No experience. Illusionist: No experience (judgment matches function). This doesn't separate them well.
      *   *Better Crux 1:* **Phenomenal Overflow/Report Dissociation.** Can we have experience without report? Or Report without the specific functional state? Let's go with **Manipulation of Phenomenal Intuition**. If we stimulate the brain to create a *report* of a specific qualia without the corresponding sensory input processing.
      *   *Let's stick to the prompt's suggestions:* "dissociations between reports and first-order function," "mechanism-level model," "hypothetical system."
      *   *Crux 1 (Dissociation):* Change Blindness/Inattentional Blindness. Subjects report continuity despite gaps. Realist: Experience is gappy or filled in. Illusionist: The *model* is continuous, experience is the model.
      *   *Crux 2 (Mechanism):* A model that predicts *when* people say "Hard Problem" intuitions arise. E.g., Cognitive closure mechanisms.
      *   *Crux 3 (Hypothetical):* The Functional Duplicate.

      *Okay, let's write.*

      *(Self-Correction on Tone)*: Ensure I don't sound like I'm taking sides. I am the facilitator. The document is the *Joint Statement*.

      *(Self-Correction on Agreed Claims)*: Make sure Claim 4 doesn't concede the Hard Problem. "Both agree the meta-problem is distinct from the hard problem" -> No, Illusionists think solving meta *is* solving hard. "Both agree the meta-problem concerns the origin of intuitions." Yes.

      *(Refining Disagreement Table)*: Ensure the "Substantive/Verbal" column is nuanced. Some parts are verbal (definition of consciousness), some substantive (existence of non-physical properties).

      *(Refining Cruxes)*: Make sure the "Concession Criteria" are clear. What would make a Realist doubt? What would make an Illusionist doubt?

      *Let's assemble.*
answer: |-
  # Joint Statement on the Meta-Problem of Consciousness
  **Facilitated Adversarial Collaboration between Phenomenal Realists and Illusionists**

  ## Preamble
  We, the undersigned representatives of the Phenomenal Realist and Illusionist camps, acknowledge that while we disagree on the ontology of consciousness, we share a commitment to naturalistic explanation and rigorous analysis of the data. We recognize that the "meta-problem"—the problem of explaining why we think consciousness is hard to explain—is a crucial battleground. This document records our points of convergence, isolates our exact points of divergence, and identifies empirical and theoretical cruxes that could shift the dialectic.

  ## 1. Agreed Claims
  Both camps affirm the following substantive claims regarding the data, the problem definition, and the constraints on theory construction.

  1.  **The Phenomenal Data:** Human subjects consistently produce verbal and non-verbal reports asserting the existence of subjective experience (e.g., "I see red," "It hurts"). These reports are accompanied by high introspective confidence and a specific phenomenology of "immediacy" or "presence."
  2.  **The Explanatory Gap Intuition:** When presented with complete physical, functional, or computational explanations of the behaviors associated with Claim 1, typical human subjects report a persistent sense of dissatisfaction or incompleteness. They judge that such explanations fail to account for "what it is like" to be the subject.
  3.  **Definition of the Meta-Problem:** The meta-problem is the task of explaining the cognitive, neural, and social mechanisms that cause humans to produce the reports in Claim 1 and harbor the intuitions in Claim 2. A solution must detail the causal chain from physical input to the assertion of phenomenal properties.
  4.  **Constraints on Explanation:** Any acceptable solution to the meta-problem must be consistent with established physical science. It cannot simply posit that "humans have intuitions because they have consciousness" without specifying the mechanism by which consciousness (or the belief in it) influences report-generation.
  5.  **Relevance to the Hard Problem:** Both camps agree that solving the meta-problem is philosophically significant. Even if it does not resolve the ontological status of consciousness, a solution would clarify the psychological sources of our convictions and potentially isolate which aspects of our intuition track reality and which track cognitive heuristic errors.
  6.  **Introspection as Process:** Introspection is not a magical, non-physical gaze. It is a cognitive process implemented by the brain, subject to latency, bandwidth limits, and potential systematic biases, even if the *content* of introspection is debated.

  ## 2. Disagreements Table
  The following table isolates the precise points of contention. The formulations in columns (ii) and (iii) are phrased to be acceptable to careful proponents of each view, avoiding straw-manning.

  | Issue | Realist Formulation (Chalmers-style) | Illusionist Formulation (Frankish-style) | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status of Phenomenal Properties** | Phenomenal properties (qualia) are real features of the world. When a subject reports "I see red," there exists a corresponding non-representational, qualitative property instantiated in the experience. | Phenomenal properties, as conceived by Realists (ineffable, intrinsic qualities), do not exist. Reports of "qualia" are false judgments caused by physical/functional states that misrepresent themselves as having these properties. | **Substantive.** Disagreement over whether the properties referred to in reports actually exist in reality. |
  | **Epistemic Authority of Introspection** | Introspection provides a form of direct acquaintance. While we can be wrong about the *causes* of our experience, we cannot be wrong about the *existence* of the experience itself (incorrigibility of appearance). | Introspection is a fallible heuristic mechanism. The conviction that experience is ineffable or intrinsic is a cognitive illusion generated by the system's lack of access to its own processing details. | **Substantive.** Disagreement over whether the "feeling of reality" guarantees the reality of the felt object. |
  | **Impact of Solving the Meta-Problem** | Solving the meta-problem explains why we *believe* in the Hard Problem, but leaves the Hard Problem untouched. Even if we explain the intuition, the question of why physical processing gives rise to experience remains. | Solving the meta-problem *dissolves* the Hard Problem. Once we explain why the system claims to have qualia without invoking qualia, there is no residual explanatory gap; the "Hard Problem" was a confusion generated by the illusion. | **Substantive.** Disagreement over whether the Hard Problem is a genuine ontological puzzle or a cognitive artifact. |
  | **Zombies and Conceivability** | The conceivability of a physical duplicate lacking experience (a zombie) demonstrates that experience is not logically supervenient on the physical. This is evidence for property dualism or panpsychism. | The conceivability of zombies is itself a datum for the meta-problem to explain. It reflects a cognitive limitation in how we model minds, not evidence of a distinct ontological realm. | **Partly Verbal / Substantive.** Verbal regarding the weight of "conceivability" as evidence; substantive regarding logical supervenience. |

  ## 3. Cruxes and Tests
  We identify three specific areas where further argument or empirical work could force a revision of views. For each, we specify the test, the divergent predictions, and the conditions for concession.

  ### Crux 1: Dissociation between First-Order Function and Phenomenal Report
  **The Case:** **Subjective Inflation and Error Monitoring.**
  Experiments where subjects are manipulated (via priming, neural stimulation, or ambiguous stimuli) to report high-confidence phenomenal experiences (e.g., "I saw a flash") in conditions where first-order visual processing indicates no signal was present (false positives), or vice versa (blindsight-style guessing without report).

  *   **Realist Prediction:** Dissociations show that *judgments* about experience can be severed from experience itself. If a subject reports a flash but neural markers of conscious perception (e.g., specific P3b or GNW signatures) are absent, the Realist argues the subject is mistaken about their *judgment*, not that the experience was an illusion. The experience is the ground truth; the report is the fallible output.
  *   **Illusionist Prediction:** Dissociations show that "phenomenal experience" *is* the higher-order judgment/model. If the system generates a report of "seeing" without the sensory input, the "experience" was the generation of that model. There is no hidden "real experience" left behind when the report is shown to be erroneous.
  *   **Concession Criteria:**
      *   **Realist Concession:** If it is demonstrated that the *conviction* of experience can be turned on and off independently of any plausible candidate for the "experience vehicle" (e.g., via direct stimulation of metacognitive circuits while sensory cortex is quiescent), Realists must accept that introspective authority is far more fragile than claimed.
      *   **Illusionist Concession:** If subjects can be shown to reliably discriminate between "veridical experience" and "confabulated report" in a way that tracks a specific neural signature distinct from the report-generation mechanism itself, Illusionists must acknowledge a distinct phenomenal state separate from the judgment.

  ### Crux 2: Mechanism-Level Model of Phenomenal Intuitions
  **The Case:** **Predictive Modeling of the "Hard Problem" Intuition.**
  Development of a computational or neural model that does not possess consciousness (by Illusionist lights) but is engineered to produce the specific intuition that "physical explanations are insufficient." The model must predict *when* humans will find an explanation satisfying vs. unsatisfying.

  *   **Realist Prediction:** A model can simulate the *speech acts* of finding an explanation unsatisfying, but it cannot instantiate the *actual feeling* of the explanatory gap. The model's output is syntactic; the human's intuition is driven by semantic acquaintance with qualia. Therefore, the model will fail to capture the *force* of the intuition, only its pattern.
  *   **Illusionist Prediction:** A model that accurately replicates the cognitive architecture of human metacognition (specifically, the opacity of internal processing and the reification of representational content) will produce the exact same intuitions. If the model says "I don't get how this physical story explains my state," the problem is solved without invoking qualia.
  *   **Concession Criteria:**
      *   **Realist Concession:** If a purely functional model successfully predicts novel, non-trivial patterns in human meta-problem intuitions (e.g., predicting which specific physical explanations will trigger "gap" responses in specific cultures or contexts) without invoking phenomenal properties, Realists must admit the meta-problem can be solved functionally.
      *   **Illusionist Concession:** If it is shown that any model capable of generating these intuitions *necessarily* requires a non-functional, intrinsic property to stabilize the self-referential loop, Illusionists must admit that functionalism is insufficient for the meta-problem itself.

  ### Crux 3: The Hypothetical Functional Duplicate
  **The Case:** **The Stipulated Zombie Twin.**
  A thought experiment regarding a system physically and functionally identical to a human, stipulated to lack phenomenal properties (Realist view) vs. a system stipulated to lack nothing real (Illusionist view).

  *   **Realist Prediction:** It is coherent to conceive of a duplicate that functions identically but lacks experience. If such a being were possible (metaphysically), it would produce all the same reports about consciousness. Therefore, the reports do not guarantee the existence of the properties reported.
  *   **Illusionist Prediction:** The concept is incoherent or irrelevant. If a system is functionally identical, it possesses all the properties that exist. To say it "lacks experience" is to say it lacks a property that never existed in the first place. The intuition that it *could* lack experience is just another meta-problem datum.
  *   **Concession Criteria:**
      *   **Realist Concession:** If the Illusionists can provide a positive argument showing that the concept of a "functional duplicate without consciousness" involves a logical contradiction (not just inconceivability to humans), Realists must abandon the zombie argument as a proof of dualism.
      *   **Illusionist Concession:** If Realists can demonstrate that the functional duplicate would *necessarily* fail to produce the specific meta-problem reports (e.g., it would not find physicalism puzzling) without the addition of phenomenal properties, Illusionists must admit that functionalism cannot explain the meta-problem data.

  ***

  **Signed,**

  *Representative of the Phenomenal Realist Camp*
  *Representative of the Illusionist Camp*
  *Facilitator: Philosophy of Mind Adversarial Collaboration Unit*
