prompt: |-
  Hey, I've been going down a rabbit hole trying to understand the Dennett/Searle dispute, and I found a blog post that sums up Dennett's wandering two-bitser example like this: Dennett asks you to think about a vending machine that takes quarters. Its internal states are about quarters only because we built it to detect them, so its intentionality is obviously derived. Then he points out that we got our cognitive machinery from natural selection, which is just another kind of designer, so our intentionality is derived too. There's no principled line between us and the vending machine — it's just a difference of complexity. Dennett therefore shows that Searle's distinction between original and derived intentionality is bankrupt, and since the Chinese Room scenario is just a more elaborate vending machine, Searle's conclusion that a program can't understand anything is refuted.

  Is this actually a fair summary of Dennett? I'm a software engineer and haven't read either of them, so I can't tell where the author might be overstating things. Go through the summary roughly sentence by sentence and tell me what a careful Dennett defender would accept, what they'd wince at, and whether the final claim about refuting the Chinese Room actually follows from the accurate parts. Also, does Dennett realy think a vending machine has intentionality in the same sense we do, or is the author running two meanings of "aboutness" together?
