  2. This is primarily a methodological disagreement about what a semantic theory ought to model, specifically whether meaning is determined by actual usage patterns or by idealized truth conditions. The stalemate persists because each side prioritizes a different theoretical virtue, such as logical simplicity versus fidelity to intuitive uncertainty.
  3. While there is a verbal component regarding how each camp defines truth and bivalence, the dispute is not merely verbal because it entails divergent commitments about the nature of reality and knowledge. The epistemicist treats ignorance as metaphysical, whereas the supervaluationist treats indeterminacy as semantic, leading to different logical consequences.
  4. The bedrock clash lies in competing intuitions about whether semantic precision must exist independently of our ability to detect it. Epistemicists sacrifice the intuition that meaning is use to save classical logic, while supervaluationists sacrifice bivalence to save the intuition that meaning is grounded in human practice.
  5. Progress would require integrating semantic theory with cognitive science to explain how the brain processes borderline cases rather than relying solely on armchair intuition. A successful theory must account for the psychological reality of vagueness without forcing a choice between unknowable facts or truth-value gaps.
