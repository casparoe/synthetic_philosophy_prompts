answer: |-
  **The Standard of Sentiment**

  Beauty is not in the object, but felt by the mind.
  No secondary quality shines with intrinsic light.
  Yet some judgments of taste are better than others we find.

  The test of time leaves mere fashion behind,
  While Homer and Virgil still glow in our sight.
  Beauty is not in the object, but felt by the mind.

  Though circular worries may leave us confined,
  Who define the true critic by what they deem right.
  Yet some judgments of taste are better than others we find.

  Practice and comparison leave ignorance behind,
  Till finer qualities burn clear and bright.
  Beauty is not in the object, but felt by the mind.

  Temperament varies, nor must all be aligned,
  Culture permits a divergent delight.
  Yet some judgments of taste are better than others we find.

  So join the strong sense where prejudices unwind,
  Let delicacy judge what is truly bright.
  Beauty is not in the object, but felt by the mind.
  Yet some judgments of taste are better than others we find.

  ***

  **Commentary**

  The villanelle's repetitive structure mirrors the philosophical tension in Hume's "Of the Standard of Taste." The two refrains represent the essay's central paradox: aesthetic subjectivism (beauty is a sentiment) versus aesthetic normativity (some judgments are better). By alternating these lines, the poem enacts the intellectual oscillation Hume describes, where neither claim cancels the other. The B-rhymes (-ight) provide a contrasting stability, suggesting the illumination sought through critical reasoning.

  The middle stanzas integrate specific Humean arguments to ground the abstraction. Stanza II invokes the "test of time," noting how works like Homer survive across nations, serving as empirical evidence for a standard. Stanza III addresses the "circularity worry," acknowledging the logical difficulty of defining critics without presupposing the very taste they are supposed to ground. Stanza IV highlights "practice and comparison" as methods to refine perception, allowing finer qualities to emerge. Stanza V concedes Hume's point that legitimate differences in temperament and culture remain, preventing a monolithic standard.

  The final quatrain attempts Hume's synthesis. Instead of resolving the tension by choosing one refrain, it introduces the "ideal critic"—characterized by strong sense, delicacy, and freedom from prejudice—as the locus where the refrains coexist. The poem compresses Hume's tentative empirical inquiry into a firmer resolution; while Hume worries about the scarcity of true critics and the difficulty of identifying them, the poem presents their joint verdict as a more accessible standard. Furthermore, the rhyme scheme forces a slight simplification of Hume's nuanced distinction between sentiment and judgment, but the core position remains intact: beauty is felt, yet feeling can be educated. The form ultimately suggests that the standard is not a rule, but a community of qualified perception.
