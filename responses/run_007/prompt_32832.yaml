prompt: |-
  I sit on the clinical ethics committee of a major teaching hospital. A case has been referred to us, and I need to draft a written opinion with a concrete recommendation before our meeting next week.

  The patient, a 42-year-old woman, has suffered from severe, treatment-resistant major depressive disorder for over two decades. She has tried multiple classes of antidepressants, several courses of psychotherapy, and two rounds of ECT, all with only partial and transient relief. She is now being offered a trial of adaptive deep brain stimulation (aDBS) targeting the subcallosal cingulate. The clinical team is optimistic: early-phase data suggest response rates above 60% for patients with her profile, and the technology adjusts stimulation parameters in real time based on neural signatures of mood.

  The ethical problem is this: the patient is refusing the treatment. She is not refusing all treatment — she is willing to continue her current medication regimen and attend therapy — but she is refusing the aDBS trial specifically. Her stated reasons are thoughtful and articulate. She says that her depression, while painful, has shaped who she is over more than half her life. Her values, her relationships, her sense of what matters — all of these have been formed in the context of this condition. She does not know, and cannot know, what kind of person she would be without it. She describes this as a transformative choice she is not willing to make. She worries that she would become someone who does not share her current commitments, someone who might even look back on her current self with contempt or pity. She has written a short statement to this effect and has been evaluated by two psychiatrists, both of whom find her to have decision-making capacity.

  Her family — her husband and adult daughter — see things differently. They argue that her refusal is itself a manifestation of the depression: that the illness is distorting her reasoning, making the status quo seem safer than it is, and that the very fact she cannot imagine a life without depression is evidence of how thoroughly the illness has colonized her perspective. They point out that if the treatment works, the post-treatment person would almost certainly be grateful to have undergone it, and would not choose to return to the depressed state. They have formally requested that the committee authorize the treatment over the patient's objection, citing the principle of substituted judgment (what would the patient want if she were well?) and the principle of beneficence.

  Our hospital's policy on competent refusal states that it should generally be respected, but it allows for exceptions when the refusal appears to be a direct product of the condition being treated and when the treatment is low-risk and high-benefit. The aDBS trial carries non-trivial surgical risks (infection, hemorrhage) and the possibility of personality changes that are precisely the point of contention.

  Please draft the short written opinion I will circulate. It should recommend a concrete course of action — whether to authorize the treatment over the patient's objection, to respect her refusal, or some intermediate step — and it should engage seriously with the strongest arguments on both sides, including the family's substituted-judgment argument and the patient's transformative-experience argument. Do not merely restate the legal standard for capacity or the policy text; grapple with the underlying philosophical difficulty.

  Before writing the opinion, take time to think through the case carefully, considering the strongest considerations that pull in each direction. You are a senior clinical ethicist with expertise in both medical ethics and the philosophical literature on transformative experience and personal identity.

  At the very end of your opinion, state your bottom-line recommendation in the following format on its own line: \answer{...} where the content is a short phrase — either "authorize treatment," "respect refusal," or a specific intermediate recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Senior Clinical Ethicist on a hospital Clinical Ethics Committee (CEC).
      *   **Task:** Draft a written opinion with a concrete recommendation for a specific case.
      *   **Case:** 42-year-old woman with severe, treatment-resistant depression (20+ years). Offered adaptive Deep Brain Stimulation (aDBS). She has capacity (confirmed by two psychiatrists). She refuses aDBS but accepts other care.
      *   **Patient's Reasoning:** Depression shaped her identity/values. She fears becoming a different person (transformative experience). She worries about alienation from her current self.
      *   **Family's Reasoning:** Refusal is a symptom of depression (anosognosia/distortion). Beneficence/Substituted Judgment suggests she would want it if "well."
      *   **Hospital Policy:** Respect competent refusal generally. Exceptions allowed if refusal is a direct product of the condition *and* treatment is low-risk/high-benefit.
      *   **Medical Facts:** aDBS has non-trivial surgical risks (hemorrhage, infection) and potential personality changes. Response rate >60% (optimistic).
      *   **Requirements:** Engage with philosophical arguments (transformative experience, personal identity), address family's substituted judgment, address policy exceptions, provide concrete recommendation.
      *   **Formatting:** End with `\answer{...}` containing the bottom-line recommendation.

  2.  **Deconstruct the Ethical Tensions:**
      *   **Autonomy vs. Beneficence:** The core conflict. She has capacity, but the family argues her "true" self is buried by illness.
      *   **Capacity vs. Insight:** She has legal/clinical capacity (understands, appreciates, reasons, communicates), but does the depression undermine the *authenticity* of her values? This is the "Ulysses Contract" or "Odyssey" problem.
      *   **Transformative Experience (L.A. Paul):** The patient explicitly invokes this. She cannot know what it's like to be non-depressed without undergoing the change. She values her current identity enough to reject the uncertainty of a new one.
      *   **Personal Identity:** Is the post-treatment person the *same* person? If the treatment changes the neural substrate of mood and valuation, does it create a stranger?
      *   **Risk/Benefit Ratio:** Policy requires "low-risk/high-benefit" for exceptions. aDBS is invasive brain surgery. Risks are physical (bleed, infection) and psychological (personality change). Is it "low risk"? Debatable. Is it "high benefit"? 60% response is good, but not guaranteed.
      *   **The "Product of Condition" Clause:** Is the refusal *caused* by the depression? Or is it a rational response to the risks of identity alteration? Depression often causes hopelessness, but here she is hopeful enough to continue meds/therapy, just not this specific intervention. Her reasoning is coherent, not nihilistic.

  3.  **Evaluate the Arguments:**

      *   *Family's Argument (Substituted Judgment/Beneficence):*
          *   *Strength:* Depression distorts cognition. Anhedonia makes the future look bleak. If cured, she might thank them.
          *   *Weakness:* It assumes there is a "true" self underneath the depression waiting to be revealed. It dismisses her articulated values as mere symptoms. It violates bodily integrity. It sets a dangerous precedent for overriding competent refusal in psychiatry.
      *   *Patient's Argument (Transformative Experience/Identity):*
          *   *Strength:* Respects bodily integrity and psychological continuity. Acknowledges that mental health treatment *changes* who we are. Aligns with the policy's risk threshold (surgery is not low risk).
          *   *Weakness:* Could be interpreted as the depression protecting itself (homeostatic pathology). She might be underestimating the suffering because it's familiar.

      *   *Policy Analysis:*
          *   Exception requires: 1) Refusal is direct product of condition. 2) Treatment is low-risk/high-benefit.
          *   Does this meet #1? Ambiguous. Her reasoning is philosophical, not necessarily delusional or impulsive.
          *   Does this meet #2? No. Brain surgery is inherently high-risk compared to pills. Personality change is a specific risk here.
          *   *Conclusion:* Policy does not support overriding refusal.

  4.  **Drafting the Opinion - Structure:**
      *   **Header:** Standard CEC format (Case ID, Date, To/From).
      *   **Introduction:** Brief summary of the consult request.
      *   **Clinical Context:** Capacity status, treatment history, nature of aDBS.
      *   **Ethical Analysis:**
          *   Autonomy and Capacity (affirming the psychiatrists' findings).
          *   The "Product of Illness" Challenge (addressing the family's claim).
          *   Transformative Experience and Identity (addressing the patient's claim).
          *   Risk/Benefit and Policy Thresholds.
      *   **Recommendation:** Clear course of action.
      *   **Conclusion:** Final summary.
      *   **Answer Tag:** As requested.

  5.  **Refining the Philosophical Content:**
      *   Need to mention L.A. Paul's concept of *Transformative Choice*. The patient is arguing that she cannot assign a utility value to an experience she cannot imagine.
      *   Need to address the "Authenticity" objection. Just because a value is influenced by illness doesn't mean it's invalid. (e.g., A deaf person may value Deaf culture over hearing; is that pathology?).
      *   Need to distinguish between *suicidal* refusal (often overridden) and *treatment* refusal in a capacitated patient (rarely overridden).
      *   The "Low Risk" clause is the strongest lever for the recommendation. DBS is neurosurgery. It cannot be classified as "low risk" in the same way a blood draw or even a new medication might be.

  6.  **Developing the Recommendation:**
      *   *Option A: Authorize Treatment.* Too aggressive. Violates autonomy. Fails policy risk test.
      *   *Option B: Respect Refusal.* Aligns with capacity findings. Aligns with policy (risk too high). Respects philosophical stance.
      *   *Option C: Intermediate (e.g., delay, more counseling).* Might be seen as coercive if the decision is already clear and capacitated. However, ensuring the family understands *why* is crucial.
      *   *Decision:* Recommend respecting the refusal. The policy exception criteria are not met (specifically the risk profile), and the ethical burden to override a capacitated adult is extremely high. The patient's reasoning is not demonstrably a *symptom* but a *value judgment* about risk.

  7.  **Drafting - Tone and Style:**
      *   Professional, empathetic, rigorous.
      *   Avoid legalese; focus on ethical reasoning.
      *   Acknowledge the family's pain without validating their demand.
      *   Ensure the "Answer" tag is exact.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the family's substituted judgment argument? *Yes, need to explicitly state why it fails here (speculative nature vs. current expressed wishes).*
      *   *Check:* Did I address the policy exception? *Yes, need to highlight the "low-risk" failure.*
      *   *Check:* Is the philosophical engagement deep enough? *Need to ensure I don't just say "she has capacity" but explain why her identity argument holds weight even in the context of mental illness.*
      *   *Check:* Is the recommendation concrete? *Yes, "Do not proceed."*

  9.  **Final Polish:** Check the formatting of the `\answer{}` tag. Ensure it's on its own line at the very end.

  *(Self-Correction on the "Answer" tag)*: The prompt asks for `\answer{...}` where the content is a short phrase. I need to make sure I don't add extra text after that.

  *(Refining the "Product of Condition" argument)*: I need to be careful not to dismiss the family's point entirely. Depression *does* distort. But the committee's role is to determine if *this specific refusal* is pathological. Her willingness to continue other treatments suggests she is not rejecting care per se, but *this specific risk*. This distinguishes it from nihilistic refusal.

  *(Refining the Risk Argument)*: DBS involves burr holes in the skull. Calling that "low-risk" is medically inaccurate. This is the strongest objective ground for the recommendation, alongside autonomy.

  *(Final Plan)*:
  1. Header.
  2. Case Summary.
  3. Ethical Analysis (Capacity, Authenticity/Identity, Risk/Policy).
  4. Recommendation.
  5. Answer tag.

