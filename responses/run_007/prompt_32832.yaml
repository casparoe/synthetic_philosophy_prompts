  **CLINICAL ETHICS COMMITTEE: CASE CONSULTATION OPINION**

  **Case ID:** 2023-NEURO-042
  **Date:** October 26, 2023
  **To:** Treating Clinical Team, Patient, and Family Representatives
  **From:** Clinical Ethics Committee
  **Subject:** Ethical Analysis Regarding Proposed aDBS Trial vs. Patient Refusal

  **1. Case Summary**
  The patient is a 42-year-old woman with a 20-year history of severe, treatment-resistant major depressive disorder (MDD). She has failed multiple pharmacological interventions, psychotherapy, and ECT. She is currently eligible for a trial of adaptive deep brain stimulation (aDBS) targeting the subcallosal cingulate. While the clinical team and the patient's family view this as a high-potential intervention, the patient has refused consent for the procedure. She maintains willingness to continue current medication and therapy. Two independent psychiatric evaluations confirm she possesses decision-making capacity. The family requests the Committee authorize treatment over her objection, arguing her refusal is a symptom of the illness.

  **2. Ethical Analysis**

  **A. Capacity and the "Product of Condition" Clause**
  Hospital policy permits overriding competent refusal only if the refusal is a direct product of the condition *and* the treatment is low-risk/high-benefit.

  Regarding capacity, the Committee affirms the findings of the consulting psychiatrists. The patient understands the medical facts, appreciates her situation, reasons through the options, and communicates a choice. The family's argument relies on a distinction between *legal capacity* and *authenticity*. They posit that the depression distorts her valuation of the future, rendering her refusal inauthentic (i.e., the "illness" is refusing, not the "person").

  However, the patient's reasoning is not nihilistic. She is not refusing treatment *simpliciter*; she is refusing *this specific intervention* while accepting others. Her rationale is not based on hopelessness ("nothing will work") but on a specific valuation of identity continuity ("I do not wish to become a different person"). While MDD can distort cognition, it does not automatically invalidate all risk-averse preferences or philosophical concerns regarding identity. To classify her refusal as a direct symptom would require evidence that her reasoning is delusional or impulsive, which is absent here. Her argument is coherent, stable, and consistent with her long-held values.

  **B. Transformative Experience and Personal Identity**
  The patient's objection invokes the philosophical concept of *transformative experience* (L.A. Paul). She argues that because the treatment aims to fundamentally alter the neural substrates of mood and valuation, she cannot epistemically access what the post-treatment life would be like. Therefore, she cannot rationally assign a utility value to the outcome.

  This is a profound ethical challenge in psychiatry. Unlike setting a broken bone, psychiatric interventions often aim to change *who the patient is*—their emotional responses, motivations, and priorities. The patient argues that her depression, while painful, is constitutive of her identity. She fears alienation from her current self and the potential loss of commitments formed during her illness.

  The Committee recognizes that while the family argues the "post-treatment self" would be grateful, this relies on speculative substituted judgment. We cannot privilege the hypothetical preferences of a future, potentially different self over the current, capacitated refusal of the existing self without risking a violation of bodily integrity and psychological continuity. In the absence of imminent threat to life (e.g., acute suicidality), the right to maintain one's psychological continuity, even at the cost of symptom relief, must be respected.

  **C. Risk-Benefit Threshold and Policy Constraints**
  Even if the Committee were persuaded that the refusal was influenced by the illness, the second prong of the hospital policy exception is not met. The policy requires the treatment to be "low-risk and high-benefit."

  aDBS is an invasive neurosurgical procedure. It carries risks of intracranial hemorrhage, infection, hardware malfunction, and seizure. Furthermore, in this specific context, "personality change" is not merely a side effect; it is the mechanism of action. Given the invasive nature of the surgery and the uncertainty of long-term psychological outcomes, this intervention cannot be categorized as "low-risk." Consequently, the policy exception for overriding competent refusal is procedurally unavailable.

  **3. Recommendation**
  The Committee acknowledges the family's distress and their genuine desire to alleviate the patient's suffering. Their argument regarding the insidious nature of depression is medically grounded; depression does colonize perspective. However, ethics requires us to protect the bodily integrity and autonomy of capacitated adults, even when their choices appear suboptimal to others, provided those choices do not stem from acute incapacity or pose immediate lethal danger.

  The patient's refusal is based on a coherent valuation of identity and risk, not on a lack of understanding. The proposed intervention carries significant physical and psychological risks that exceed the policy threshold for overriding refusal. To proceed without consent would set a precedent that undermines trust in the psychiatric care of vulnerable populations and violates the patient's right to self-determination regarding transformative medical interventions.

  **Concrete Course of Action:**
  1.  **Do not authorize the aDBS procedure.** The treatment team should not proceed with the implantation surgery.
  2.  **Continue supportive care.** The team should honor the patient's willingness to continue pharmacotherapy and psychotherapy.
  3.  **Facilitate Communication.** We recommend a mediated meeting between the clinical team and the family to explain the ethical and policy constraints, validating their concern while clarifying that the patient's rights preclude involuntary intervention in this context.

  **4. Conclusion**
  The Committee concludes that the patient's refusal must be respected. The intervention is too invasive to justify overriding a capacitated refusal, and the patient's concerns regarding identity and transformative change constitute a valid ethical basis for her decision, distinct from the pathology of her depression.

  \answer{respect refusal}
