      *   **The Problem of Paralysis:** If reasons are truly balanced, inaction is also a choice with costs (awkwardness, lost time, damaged relationships). Therefore, the state is not actually one of *perfect* indifference regarding the *outcome* of deciding vs. not deciding.
      *   **Second-Order Reasons:** There is a reason to decide *now*. The cost of delay breaks the symmetry.
      *   **The Nature of "Arbitrary":** Distinguish between "arbitrary" (capricious, without thought) and "randomized" (a deliberate strategy to break symmetry).
