prompt: |-
  I've been going down the superrationality rabbit hole — Hofstadter, the LessWrong sequences, some of the back-and-forth with game theorists — and there's this one analogy that keeps showing up and seems to be doing a ton of argumentative work. The idea is that in a symmetric one-shot Prisoner's Dilemma, superrational players should cooperate because each knows the other is running the same decision procedure. The analogy: it's like two instances of the same program running on different machines. Same source code, same inputs, so of course they output the same move. The analogy is supposed to make the "but what if the other guy defects?" worry literally incoherent — you'd be asking your own code to disagree with itself.

  I want you to audit this analogy for me. You're an expert on decision theory with a good nose for when a picture is doing the arguing. Think carefully — maybe start by brainstorming what work the analogy is meant to do and what assumptions it might be quietly importing. Then give me:

  - A correspondence table: what maps to what (the players, the decision procedure, the symmetry, the "hardware," the output...)
  - Where the mapping breaks — the dissanalogies you can spot
  - Which disanalogies actually matter for the conclusion that superrational players should cooperate, vs. which are just cosmetic
  - Whether the conclusion survives once the disanalogies are on the table, or whether the analogy was carrying the argument the whole time

  I've worked through the basic PD logic and I get why CDT and EDT both defect in the one-shot, but I'm not a professional — so don't assume I know the technical literature, but don't talk down to me either.
