prompt: |-
  I work in the model risk group of a midsize consumer lender, and several times a year a business unit brings us a scoring model — built in-house or by a vendor — and asks us to sign off that it is fair across racial and other protected groups. Our sign-off is what allows the model to go into production, and we would be the ones defending that choice to regulators. I have no academic background in this area, but I have read enough on my own to understand that there are impossibility results in algorithmic fairness: roughly, a single score cannot generally be calibrated, have equal false positive rates across groups, and have equal false negative rates across groups at the same time when the outcome rates differ, so the instruction to make the model fair is not a specification anyone can simply satisfy. What I do not have is a way to turn that fact into a repeatable review procedure.

  Please write a decision procedure my team could actually run each time a model comes to us for sign-off. It should tell us, in order, which fairness properties to check, how to determine whether the impossibility result applies to the data in front of us, and when the review has to stop being a technical check and become a choice among trade-offs that our model risk committee — which includes legal and the business owner — must make. The procedure should be usable by people with no graduate statistical training, take no more than a few hours of analysis per model, and mark clearly which steps are judgment calls dressed up as computation. Then apply the procedure to two hypothetical models: a credit approval score where group approval rates differ, and a fraud score where the fraud base rates differ sharply. Make one of the applications a case where the procedure gives the business owner an answer they will not like, and end by saying what the procedure cannot settle. Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Works in Model Risk Management (MRM) at a midsize consumer lender.
      *   **Task:** Create a repeatable decision procedure for reviewing model fairness (specifically regarding protected classes like race).
      *   **Constraints:**
          *   Must acknowledge impossibility theorems (calibration vs. error rate parity).
          *   Must be usable by people without graduate statistical training.
          *   Must take no more than a few hours per model.
          *   Must clearly distinguish technical checks from judgment calls.
          *   Must define when the issue escalates to the Model Risk Committee (MRC).
          *   Must apply the procedure to two hypothetical cases (Credit Approval & Fraud Detection).
          *   One case must yield an unpopular answer for the business owner.
          *   Must conclude with limitations of the procedure.
          *   Language: American English.

  2.  **Deconstruct the Problem:**
      *   *The Core Conflict:* Regulatory compliance (ECOA, Reg B, Fair Lending) vs. Mathematical Impossibility (Chouldechova, Kleinberg et al.).
      *   *The Goal:* A practical workflow, not a theoretical treatise. It needs to be actionable.
      *   *The Audience:* MRM analysts (quantitative but maybe not fairness experts), Business Owners, Legal, MRC.
      *   *Key Steps Needed:*
          1.  Data Validation (Garbage in, garbage out).
          2.  Baseline Performance (Is the model good at all?).
          3.  Fairness Metrics Calculation (The "Technical Check").
          4.  Impossibility Check (Are base rates different?).
          5.  Trade-off Analysis (The "Judgment Call").
          6.  Escalation/Sign-off.

  3.  **Drafting the Procedure (The "Fairness Triage Protocol"):**
      *   *Name:* Needs to sound official but clear. "Fairness Triage Protocol (FTP)."
      *   *Phase 1: Prerequisites.* Check data quality and protected class imputation (since lenders often don't collect race data directly, they use BISG or similar). *Crucial:* If proxy data is bad, stop.
      *   *Phase 2: The Technical Screen.* Calculate specific metrics. Keep it simple: Approval Rates, FPR, FNR, Calibration.
      *   *Phase 3: The Impossibility Test.* Check base rates. If base rates differ significantly, acknowledge that perfect parity is mathematically impossible.
      *   *Phase 4: The Trade-off Memo.* This is where the judgment happens. Which metric matters most? (e.g., in fraud, catching fraud might outweigh FPR parity).
      *   *Phase 5: Escalation.* If trade-offs are significant, MRC decides.

      *Refining for Time/Complexity:* Keep metrics to the "Big Three": Demographic Parity (Approval Rate), Equalized Odds (FPR/FNR), and Calibration. Use a threshold (e.g., 80% rule or statistical significance) to flag issues.

  4.  **Developing the Hypothetical Cases:**
      *   *Case 1: Credit Approval Score.*
          *   Context: Standard lending.
          *   Issue: Base rates differ slightly.
          *   Outcome: Model is acceptable with minor monitoring. (The "Happy" path).
      *   *Case 2: Fraud Detection Score.*
          *   Context: High stakes, low base rate.
          *   Issue: Base rates differ *sharply* (perhaps due to geographic or transactional proxies correlated with protected classes).
          *   Constraint: To equalize FPR, you must hurt Calibration or FNR.
          *   Outcome: Business wants low FNR (catch fraud). Fairness requires lowering threshold for Group A, increasing FPR for Group A. Or maintaining threshold creates disparate impact.
          *   *Unpopular Answer:* The procedure forces the business to admit they are prioritizing loss prevention over fairness parity, requiring MRC sign-off on a known disparity.

  5.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the user's expertise and the difficulty of the task. Validate the impossibility theorem concern.
      *   *The Procedure:* Break it down into Steps 1-5. Use bolding for "Technical" vs. "Judgment."
      *   *Step 1 (Data):* Focus on proxy reliability (BISG).
      *   *Step 2 (Metrics):* Define the 3 metrics simply.
      *   *Step 3 (Impossibility):* The Base Rate Check.
      *   *Step 4 (Thresholds):* Define "Material Disparity" (e.g., 10% or 20% difference).
      *   *Step 5 (Escalation):* The MRC role.
      *   *Application 1 (Credit):* Show the math working out reasonably.
      *   *Application 2 (Fraud):* Show the conflict. Business wants to minimize loss. Fairness says FPR is too high for Group A. The procedure says "You must choose." Business chooses loss prevention. MRM flags it.
      *   *Limitations:* What can't this solve? (Proxy error, long-term dynamics, legal interpretation).

  6.  **Review and Refine:**
      *   *Tone:* Professional, directive, pragmatic.
      *   *Time Check:* Can this be done in a few hours? Yes, if data is prepped. The analysis is standard confusion matrix stuff.
      *   *Clarity:* Ensure the distinction between *calculation* and *decision* is sharp.
      *   *Impossibility Theorem:* Make sure Step 3 explicitly addresses the user's concern about calibration vs. error rates.
      *   *American English:* Check spelling (color/colour, etc.) and terminology (Model Risk Committee, Reg B).

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Suggest causal inference. *Correction:* Too complex for "few hours" and "no grad training." Stick to observational metrics.
      *   *Initial thought:* Focus heavily on p-values. *Correction:* With large data, everything is significant. Focus on *effect size* (magnitude of disparity) rather than just significance.
      *   *Clarification on Proxies:* Lenders usually don't have race data. I must mention Bayesian Improved Surname Geocoding (BISG) or similar, as that's a huge risk point itself.
      *   *The "Unpopular Answer":* Make sure in the Fraud case, the business owner can't just say "fix the model." The procedure must show that fixing the fairness metric breaks the business objective, forcing a governance decision.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Decision procedure? Yes.
      *   Order of checks? Yes.
      *   Impossibility result addressed? Yes.
      *   Technical vs. Judgment marked? Yes.
      *   Two hypotheticals? Yes.
      *   One unpopular answer? Yes.
      *   Limitations section? Yes.
      *   American English? Yes.

  9.  (Final Output Generation - similar to the provided good response.)
answer: |-
  **To:** Model Risk Management Team
  **From:** [Your Name/Department]
  **Subject:** Standard Operating Procedure: Fairness Triage Protocol (FTP-v1)

  ### Executive Summary

  You are correct that mathematical impossibility theorems (specifically the incompatibility of Calibration, False Positive Rate Parity, and False Negative Rate Parity when base rates differ) prevent a model from being "perfectly fair" by all definitions simultaneously. Therefore, our sign-off cannot be a binary "Fair/Unfair" stamp based on a single metric.

  Instead, our sign-off must confirm that **disparities have been measured, the mathematical constraints are understood, and the specific trade-offs have been explicitly accepted by governance.**

  The following **Fairness Triage Protocol (FTP)** is designed to be executed in under four hours by an analyst with standard quantitative skills. It separates mathematical facts from business judgments.

  ---

  ### The Fairness Triage Protocol (FTP)

  #### Step 1: Data Integrity and Proxy Validation (Technical)
  *Time: 45 Minutes*

  Before measuring fairness, verify the input used to identify protected groups. Most lenders do not collect applicant race/ethnicity data directly. You are likely using a proxy (e.g., BISG).

  1.  **Check Proxy Accuracy:** Confirm the probability threshold used for proxy assignment (e.g., >80% probability of race).
  2.  **Sample Size Check:** Ensure each protected group has at least 500 observed outcomes (defaults/non-defaults). If $N < 500$, flag as **"Insufficient Data for Fairness Testing."**
  3.  **Action:** If proxy reliability is low or sample size is small, **STOP.** The model cannot be fairness-tested. Return to the business unit with a "Data Limitation" finding.

  #### Step 2: The "Big Three" Metrics Calculation (Technical)
  *Time: 60 Minutes*

  Calculate the following three metrics for the protected group vs. the control group at the proposed cut-off score. Do not interpret them yet; just record the numbers.

  1.  **Selection Rate (Demographic Parity):** Percentage of each group approved (or flagged).
  2.  **False Positive Rate (FPR):** Of those who *did not* default (or commit fraud), what percentage did the model incorrectly flag?
  3.  **False Negative Rate (FNR):** Of those who *did* default (or commit fraud), what percentage did the model miss?
  4.  **Calibration:** For a given score bucket (e.g., score 700-710), is the actual default rate the same across groups?

  *Output:* A simple table showing Group A vs. Group B values and the **Absolute Difference** between them.

  #### Step 3: The Impossibility Test (Technical)
  *Time: 15 Minutes*

  This step determines if the business unit's request for "perfect parity" is mathematically feasible.

  1.  **Calculate Base Rates:** Calculate the actual outcome rate (e.g., % who defaulted) for Group A and Group B in the development sample.
  2.  **Compare Base Rates:**
      *   If Base Rate A $\approx$ Base Rate B (difference < 5%): Perfect parity on all "Big Three" metrics is theoretically possible. Proceed to Step 4.
      *   If Base Rate A $\neq$ Base Rate B (difference $\ge$ 5%): **The Impossibility Condition Applies.** It is mathematically impossible to have equal FPR, equal FNR, and equal Calibration simultaneously.
  3.  **Action:** If the Impossibility Condition applies, you must inform the business owner that they must prioritize *which* metric matters most. You cannot optimize for all three.

  #### Step 4: Materiality Thresholding (Judgment Call)
  *Time: 30 Minutes*

  Mathematics tells us differences exist; policy tells us which differences matter. Apply the following thresholds to the Absolute Differences calculated in Step 2.

  *   **Green Zone:** Difference < 5%. (Acceptable without escalation).
  *   **Yellow Zone:** Difference 5% – 15%. (Requires written justification from Business Owner).
  *   **Red Zone:** Difference > 15%. (Requires Model Risk Committee (MRC) vote).

  *Note:* These thresholds are policy decisions, not statistical laws. They must be approved by Legal/Compliance annually.

  #### Step 5: The Trade-Off Memo (Judgment Call)
  *Time: 60 Minutes*

  If Step 3 identified the Impossibility Condition OR if Step 4 identified a Yellow/Red Zone metric, the Business Owner must complete a **Trade-Off Memo**. MRM facilitates this but does not write it.

  The Memo must answer:
  1.  **Primary Objective:** Is the model optimizing for Profit, Loss Prevention, or Financial Inclusion?
  2.  **Accepted Disparity:** Which metric is allowed to diverge? (e.g., "We accept higher FPR for Group A to ensure we do not miss fraud.")
  3.  **Mitigation:** What monitoring will occur post-implementation?

  **MRM Sign-Off Rule:** MRM signs off only if the Trade-Off Memo is complete and the MRC has acknowledged the Red Zone disparities. MRM does not sign off on "Fairness"; MRM signs off on "Disclosed and Governed Risk."

  ---

  ### Application of the Procedure

  Below are two applications of the FTP to demonstrate how it functions in practice.

  #### Case 1: Prime Credit Approval Score
  **Context:** A new scorecard for unsecured personal loans.
  **Data:** 50,000 applicants. Protected Group (PG) base rate (default) = 4.2%. Control Group (CG) base rate = 3.8%.

  **Step 1 (Data):** Proxy reliability is 85%. Sample sizes are sufficient. **Pass.**
  **Step 2 (Metrics):**
  *   Selection Rate: PG 65%, CG 68% (Diff 3%).
  *   FPR: PG 5%, CG 5.5% (Diff 0.5%).
  *   FNR: PG 20%, CG 21% (Diff 1%).
  *   Calibration: Within 2% across score buckets.
  **Step 3 (Impossibility):** Base rate difference is 0.4%. This is < 5%. The Impossibility Condition **does not apply.** Theoretically, the model could be more balanced, but current disparities are low.
  **Step 4 (Materiality):** All metrics are in the **Green Zone** (< 5% difference).
  **Step 5 (Memo):** Not required.

  **Outcome:** MRM grants sign-off. The business owner is happy. The model proceeds to production with standard annual monitoring. This represents a scenario where performance and fairness are naturally aligned.

  ***

  #### Case 2: First-Party Fraud Detection Score
  **Context:** A real-time model to block application fraud during origination.
  **Data:** 100,000 applicants. Fraud is rare. PG fraud base rate = 0.5%. CG fraud base rate = 1.5%.
  **Note:** The base rate differs sharply (3x higher in CG). This triggers the Impossibility Condition immediately.

  **Step 1 (Data):** Sufficient data. **Pass.**
  **Step 2 (Metrics) at proposed cut-off:**
  *   Selection Rate (Approval): PG 98%, CG 95% (Diff 3%).
  *   FPR (Legit user blocked): PG 0.1%, CG 0.5% (Diff 0.4%). *Wait, look closer.*
      *   *Correction for Impossibility:* Because the fraud rate is 3x higher in CG, to get equal FPR, we would have to block many more PG applicants who are legitimate, or let more CG fraud through.
      *   *Current Model:* To catch the fraud in CG, the threshold is set aggressively.
      *   FPR (Legit blocked): PG 2.0%, CG 2.0% (Business claims parity).
      *   FNR (Fraud missed): PG 40%, CG 10%. (Huge disparity).
      *   *Wait, recalculating based on Base Rate Difference:* If Base Rates differ, you cannot have equal FPR and equal FNR.
      *   *Actual Model Output:* The business set the threshold to minimize total loss.
      *   FPR: PG 1.0%, CG 1.0% (Equal).
      *   FNR: PG 50%, CG 15% (Massive Disparity). The model misses half the fraud in the Protected Group because the signal is weaker or the threshold is optimized for the majority group.
  **Step 3 (Impossibility):** Base rate difference is 1.0% (0.5% vs 1.5%). This is > 5% relative difference. **Impossibility Condition Applies.** You cannot fix the FNR disparity without breaking the FPR parity or Calibration.
  **Step 4 (Materiality):** FNR Difference is 35%. This is **Red Zone** (> 15%).
  **Step 5 (Memo & Escalation):**
  *   MRM informs the Business Owner: "You cannot fix the FNR gap without increasing False Positives for the Control Group (blocking more good customers) or reducing overall fraud capture."
  *   Business Owner's Preference: "Our mandate is loss prevention. We cannot increase FPR for the Control Group because that hurts revenue. We must accept the FNR disparity."
  *   **The Unpopular Answer:** MRM cannot sign off based on the standard protocol. The Trade-Off Memo is sent to the Model Risk Committee.
  *   **MRC Decision:** The Committee must vote to accept a model that misses 50% of fraud in one group to protect revenue in another.

  **Outcome:** The Business Owner is unhappy. They wanted a technical sign-off that said "This is fair." Instead, the procedure forced a governance admission: "This model is mathematically biased due to base rates, and we are choosing profit over parity." The model is approved *conditionally*, subject to quarterly MRC review, and Legal must confirm this does not violate disparate treatment laws (as opposed to disparate impact).

  ---

  ### What This Procedure Cannot Settle

  As Model Risk Management, we must be clear about the boundaries of this protocol. This procedure **does not** and **cannot** resolve the following:

  1.  **Legal Liability:** A model can pass this FTP and still violate the Equal Credit Opportunity Act (ECOA). Legal counsel, not MRM, must make the final determination on regulatory compliance. We measure risk; they interpret law.
  2.  **Proxy Error:** If the Bayesian Imputation (BISG) systematically misclassifies race in specific geographies, our "Technical" Step 1 is garbage. We assume the proxy is truth for the sake of the math, but it is not.
  3.  **Long-Term Dynamics:** This procedure measures fairness on a static snapshot. It does not account for how denying credit to Group A today might lower their creditworthiness tomorrow, widening the base rate gap further (the "feedback loop" problem).
  4.  **Causal Fairness:** We are measuring observational parity. We are not determining *why* the base rates differ. If the base rate difference is caused by historical discrimination, optimizing for "Calibration" might perpetuate that history. This procedure treats the data as given; it does not judge the data's origin.

  **Final Instruction to Team:**
  When you use this procedure, your value is not in finding a "Fair Model." Your value is in preventing the organization from claiming a model is Fair when it is actually just a **Managed Trade-Off.** If the Business Owner asks, "Is this fair?", your answer is now: "The math says we have to choose. Which one did we choose?"
