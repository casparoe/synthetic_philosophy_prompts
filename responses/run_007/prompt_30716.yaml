      *Refining the Order:*
      1.  **Symmetry/Indifference:** Most intuitive pushback. "They look the same!"
      2.  **The Finite/Bounded Case:** Easiest way to break the "improper prior" defense.
      3.  **The "Don't Open" Variant:** Shows the paradox persists even without seeing $X$.
      4.  **EV vs. Reality:** "But if I play 100 times..."

  5.  **Drafting Replies (Iterative Process):**
      *   *Constraint:* ~2 minutes spoken. Needs to be clear, not jargon-heavy.
      *   *Constraint:* Must admit weaknesses.
      *   *Objection 1 (Symmetry):* Reply: Symmetry applies to the *setup*, not the *values*. If I pick \$10, it's unlikely the other is \$20 vs \$5 depending on how money is distributed. Weakness: If the distribution is unknown, isn't Indifference rational?
      *   *Objection 2 (Finite Case):* Reply: If there's a max cap, seeing a high number tells you you're at the top, so don't switch. Seeing a low number, maybe switch. It averages out. Weakness: Requires knowing the cap.
      *   *Objection 3 (Don't Open):* Reply: If you don't open, you're comparing $E[A]$ vs $E[B]$. By symmetry $E[A]=E[B]$. The paradox needs the specific $X$ to trick you. Weakness: Some formulations argue the logic holds before opening too.
      *   *Objection 4 (Simulation):* Reply: You have to program a distribution. If you pick a random distribution, the advantage vanishes. Weakness: If you pick a specific heavy-tailed distribution, you *can* gain.

  6.  **Identifying the "Doomsday Question":**
      *   What kills the "It's just an improper prior" argument?
      *   *Idea:* The "Always Switch" argument can be made without conditioning on $X$ in some formulations (Nalebuff asymmetric variant), but that's too complex.
      *   *Better Idea:* "If the prior is improper, why does the math *look* so convincing? Is it just nonsense or is there a deeper issue with Expected Value itself?"
      *   *Best Idea (The Killer):* "Okay, suppose I *know* the distribution is uniform from \$1 to \$1,000,000. I open my envelope and see \$50. Should I switch?"
          *   *Why:* This forces the student to do the actual Bayesian update. If they just say "no prior = no EV," they dodge the case where there *is* a prior. If they say "yes switch," they admit switching can be rational, undermining the "never switch" vibe. If they say "no," they have to explain the cutoff.
