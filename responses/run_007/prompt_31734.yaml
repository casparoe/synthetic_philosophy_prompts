  9.  **Final Polish:**
      *   Ensure the distinction between Lewis's PP and the "New Principle" (due to Hall/Thau) is mentioned if relevant, but keep it accessible. (Decided: Stick mostly to PP as it's the common reference, but mention the admissibility caveat heavily).
      *   Make sure the verdict on "Argument-Ending Move" is clear. (It's usually a conversation stopper that hides substantive disagreement).

  10. **Final Review against constraints:**
