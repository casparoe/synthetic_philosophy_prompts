prompt: |-
  I'm a longtime reader of rationalist blogs and forums (LessWrong and its orbit, mostly), and I keep running into the phrase "defer to the objective chance" used as if it settles a discussion by itself. I've started to notice that it gets used to do very different jobs in different arguments, and I want to separate the readings before I push back in a thread.

  Here are three places I've seen it recently:

  1. In a discussion about whether a one-off event — a specific AI system failing during a particular deployment — "has a probability," someone ended the argument by saying that once you know the objective chance of the event, you simply defer to it: your credence should be whatever that number is.
  2. In a different thread about a coin that was flipped and then hidden, someone said my credence that it landed heads should be 1/2, because the objective chance of heads was 1/2, and any other credence would be a refusal to defer to the chance — even though the flip is over and the outcome is already fixed.
  3. In a third discussion, about a forecasting model that outputs a number for some geopolitical event, someone claimed that rational agents should adopt the model's number wholesale, because the model's probability just is the objective chance and rational credences defer to objective chances.

  I know there's something in formal epistemology called the Principal Principle in this vicinity, but I've never seen its possible readings laid out side by side, and I don't trust my memory of the exact formulation.

  You are an expert in formal epistemology and the philosophy of probability. Think carefully. Start by brainstorming a list of candidate precisifications of the slogan "defer to the objective chance" before settling on the menu you present. Then lay out the distinct precise theses that sentence could be expressing, from the nearly trivial to the clearly false. For each reading, say exactly what it claims — including what "chance" refers to and what operation "defer" amounts to — whether it is a platitude, a substantive but defensible principle, or simply false, and whether it actually supports the use the slogan was being put to in each of the three cases above.

  I especially want the menu to answer these questions:

  - Does deference require setting my credence equal to the chance unconditionally, or conditional on my total evidence, or only conditional on some special class of admissible evidence?
  - What evidence, if anything, would make it rational not to set my credence equal to a known chance — for example, evidence that the event is already settled, or evidence that the chance itself will be undermined by my total evidence?
  - Does the slogan constrain my current, all-things-considered credence, or only an initial or prior credence before I learn anything?
  - Does it apply to past events whose chance is now 1 or 0, and what happens if I don't know which?
  - What is the objective chance in the first place: a single-case physical probability, the output of a well-calibrated model, a theoretical quantity of a completed physics, or something else?

  Finally, say which reading or readings are probably doing the real work when someone on a rationalist forum uses the slogan to end an argument, and whether the argument-ending move is ever justified.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Longtime rationalist reader (LessWrong orbit), notices the phrase "defer to the objective chance" being used ambiguously to shut down arguments.
      *   **Task:** Act as an expert in formal epistemology/philosophy of probability. Brainstorm precisifications, then present a menu of distinct precise theses (from trivial to false).
      *   **Specific Questions to Answer:**
          *   Unconditional vs. Conditional credence?
          *   What evidence overrides chance? (Admissibility)
          *   Current vs. Prior credence?
          *   Past events (fixed outcomes)?
          *   Definition of "objective chance" (physical, model output, etc.)?
      *   **Application:** Evaluate the three specific cases provided by the user against these readings.
      *   **Conclusion:** Identify which reading is actually doing the work in rationalist discourse and whether it's justified.

  2.  **Deconstruct the Slogan ("Defer to Objective Chance"):**
      *   The core philosophical anchor here is David Lewis's *Principal Principle* (PP).
      *   The slogan is a colloquial shorthand for PP or variations thereof (e.g., Miller's Principle, New Principle).
      *   The confusion arises because "chance" is metaphysically loaded, and "defer" implies a normative constraint on belief that depends on what else you know.

  3.  **Brainstorming Candidate Precisifications:**
      *   *Idea 1:* Credence = Chance always. (Too strong, ignores evidence).
      *   *Idea 2:* Credence = Chance if you know nothing else. (Prior credence).
      *   *Idea 3:* Credence = Chance conditional on knowing the chance and having only "admissible" evidence. (Lewis's PP).
      *   *Idea 4:* Credence = Chance even for past events. (Problematic for single cases).
      *   *Idea 5:* Model output = Chance. (Conflation of epistemic and ontic).
      *   *Idea 6:* Chance is 0 or 1 for past events. (Determinism/Past fixity).

  4.  **Developing the Menu of Theses:**
      *   I need to structure these logically, moving from the most plausible/standard to the most problematic/misused.
      *   *Thesis 1: The Principal Principle (Lewis).* The gold standard. $C(A | Ch(A)=x \land E) = x$. Crucial caveat: $E$ must be admissible.
      *   *Thesis 2: The Unconditional Deference Principle.* $C(A) = Ch(A)$. False. Ignores specific evidence (e.g., seeing the coin land).
      *   *Thesis 3: The Prior Deference Principle.* $C_{prior}(A | Ch(A)=x) = x$. Defensible, but limited utility for agents with existing evidence.
      *   *Thesis 4: The Past Fixity Reading.* For past events, $Ch(A) \in \{0, 1\}$. If you don't know the outcome, do you defer to the *historical* chance or the *current* chance? This addresses Case 2.
      *   *Thesis 5: The Model-as-Chance Reading.* Equating statistical model outputs with metaphysical chance. Addresses Case 3.
      *   *Thesis 6: The Single-Case Chance Reading.* Does single-case chance exist? Addresses Case 1.

  5.  **Addressing the Specific Questions:**
      *   *Conditional vs. Unconditional:* Must be conditional on admissible evidence.
      *   *Overriding Evidence:* Inadmissible evidence (e.g., seeing the outcome, crystal balls).
      *   *Current vs. Prior:* Applies to current credence *conditional* on chance hypotheses, but priors are where the constraint is strongest.
      *   *Past Events:* Chance is typically time-relative. Past chance $\neq$ Current chance.
      *   *Definition of Chance:* Physical propensity, Humean Best System, etc. Not just model output.

  6.  **Evaluating the Three Cases:**
      *   *Case 1 (AI Failure):* Claims single-case chance exists and dictates credence. *Critique:* Controversial metaphysics (single-case chance). Even if it exists, is the evidence admissible?
      *   *Case 2 (Hidden Coin):* Claims credence = 1/2 because *original* chance was 1/2. *Critique:* Confuses past chance with current chance. Current chance is 0 or 1. Credence should reflect ignorance (1/2), but not *because* of objective chance deference in the PP sense.
      *   *Case 3 (Forecast Model):* Equates model output with objective chance. *Critique:* Category error. Model output is epistemic probability, not necessarily ontic chance.

