answer: |-
  ### Final Exam Essay Question

  **Question:**
  The "Torture vs. Dust Specks" spectrum argument generates a paradox by combining three plausible claims: (1) the transitivity of "all-things-considered betterness," (2) the claim that a slight increase in severity is worse than a slight decrease in number, and (3) the claim that a vast number of dust specks is *not* worse than one instance of torture. Together, these claims form an inconsistent set.

  Critically evaluate the strategy of **rejecting transitivity** OR **defending a lexical threshold (discontinuity)** as a solution to this paradox. Do not merely argue for your moral intuition regarding torture. Instead, analyze the theoretical costs of your chosen strategy. Does your chosen solution successfully block the unacceptable conclusion without undermining the coherence of rational choice or the plausibility of aggregation in other contexts? Justify your answer.

  ***

  ### Model Answer (Approx. 550 words)

  The spectrum argument forces a choice between moral intuition and formal coherence. If we accept that adjacent steps in the spectrum are comparable (a slight increase in pain outweighs a slight decrease in victims) and that betterness is transitive, we logically entail that enough dust specks are worse than torture. To block this, one might defend a **lexical threshold**. This strategy posits a discontinuity in value: harms above a certain severity (torture) are lexically superior to harms below it (dust specks), such that no quantity of the latter can outweigh the former.

  The primary theoretical virtue of the lexical view is that it preserves the distinctiveness of severe rights violations. It captures the deontological intuition that torture constitutes a categorical wrong that utilitarian aggregation cannot dissolve. By asserting a discontinuity between adjacent steps in the spectrum (e.g., between "near-torture" and "torture"), the argument blocks the chain of transitivity required to reach the dust-specks conclusion. This avoids the "Repugnant Conclusion" style outcome where quality of life is entirely traded off against quantity.

  However, this strategy incurs significant theoretical costs. First, it violates the principle of **continuity**. In most economic and decision-theoretic contexts, we assume that for any two goods, there is some quantity of the lesser good that equals the greater. By rejecting this, the lexical view renders rational choice problematic in boundary cases. If a decision-maker faces a choice between one instance of torture and a billion instances of a harm just below the lexical threshold, the lexical view implies the torture is worse. But if the lower harm increases by a single unit, the view must claim this makes no difference until the threshold is crossed. This creates a "cliff-edge" effect that seems arbitrary. Why should one additional unit of pain suddenly trigger infinite disvalue?

  Second, the lexical view struggles with **mixed cases**. If we have a choice between preventing one torture or preventing a million broken legs (assuming broken legs are below the threshold but above dust specks), a strict lexical view might struggle to explain why we prioritize the torture if the aggregate suffering of the broken legs is immense. To avoid this, the theorist must posit multiple lexical tiers, which complicates the ontology of value and risks reintroducing the spectrum problem between the tiers.

  Despite these costs, rejecting transitivity is arguably worse. If betterness is intransitive, rational choice becomes impossible (e.g., preferring A to B, B to C, but C to A leads to money-pump vulnerabilities). Therefore, while the lexical threshold introduces arbitrariness at the boundary, it preserves the global coherence of rational agency. The "cliff" is a necessary fiction to protect the structural integrity of moral reasoning against the erosion of small trade-offs.

  In conclusion, defending a lexical threshold is the superior strategy, not because it is cost-free, but because its costs are localized to boundary arbitrariness, whereas rejecting transitivity globalizes incoherence. The lexical view acknowledges that some values are of a different *kind*, not just degree. While it fails to explain the precise location of the threshold, it successfully isolates severe harms from the logic of aggregation that leads to the dust-specks conclusion, preserving the core commitment that persons are not mere containers for utility.

  ***

  ### Marking Scheme

  **A-Range (80–100%)**
  *   **Structural Diagnosis:** Explicitly identifies the inconsistent triad (Transitivity, Adjacent Trade-offs, Intuitive Conclusion) without spending excessive words summarizing the thought experiment.
  *   **Critical Evaluation:** Does not merely describe the chosen solution (e.g., Lexical Threshold) but analyzes its *theoretical costs* (e.g., arbitrariness, violation of continuity, mixed-case problems).
  *   **Comparative Justification:** Explains why the chosen solution is preferable to the alternative (e.g., "Lexical thresholds are costly, but intransitivity is worse because of money-pump arguments").
  *   **Precision:** Uses technical terminology correctly (transitivity, continuity, lexical priority, aggregation).

  **B-Range (60–79%)**
  *   **Descriptive Focus:** Accurately explains the thought experiment and the chosen solution but relies heavily on describing *what* the view says rather than *why* it is theoretically costly.
  *   **Intuition Reliance:** Slips into arguing that torture is obviously worse (moral intuition) rather than explaining how the theory *permits* that conclusion despite the spectrum.
  *   **Limited Critique:** Identifies one strength or weakness of the solution but fails to weigh it against the alternative (e.g., mentions arbitrariness but does not compare it to the incoherence of intransitivity).
  *   **Generalization:** Arguments are plausible but lack technical precision (e.g., uses "fairness" instead of "aggregation principles").

  **Common Mistake: The "Vagueness Dodge"**
  *   **The Error:** Students often argue that the boundary between torture and non-torture is simply **vague** (epistemic uncertainty) rather than arguing for a **discontinuity** (ontological break). They claim, "We cannot know where the line is, so the argument fails."
  *   **Grading Impact:** This should lower the grade by one band (e.g., from A to B).
  *   **Reasoning:** Vagueness does not solve the paradox. Even if the boundary is vague, the spectrum argument applies pressure to the *logic* of the comparison, not just our knowledge of it. If transitivity holds, vagueness does not stop the slide from torture to dust specks; it only obscures the specific step where the change occurs. An A-range answer recognizes that solving the paradox requires a structural block (like discontinuity or intransitivity), not merely an admission of ignorance regarding boundaries.
