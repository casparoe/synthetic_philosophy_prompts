      *   (3) *Challenge Status:* The Argument from Illusion/Hallucination (AfI/AfH) needs an answer, not a dismissal. It motivates the Common Kind Assumption, so taking it seriously puts pressure on (1).
      *   (4) *Indistinguishability:* $V$ and $H$ can be phenomenally indistinguishable from the first-person perspective. This is often the premise used to drive the Common Kind Assumption.
      *   (5) *Epistemic Disjunctivism:* $V$ gives factive reasons (e.g., "I see that $p$"), $H$ does not, despite (4).

  3.  **Pairwise Analysis (Mental Sandbox):**

      *   **(1) & (2):** Metaphysical Disjunctivism + Naive Realism.
          *   *Relation:* Highly compatible. Naive Realism is often the *ground* for Metaphysical Disjunctivism. If $V$ is relational and $H$ is not, they are fundamentally different.
