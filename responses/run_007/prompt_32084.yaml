answer: |-
  Here is a 90-minute session plan designed to expose the architecture of Strawson's argument without reducing it to a summary. It is structured to manage the tension in the room by focusing on the *function* of the concepts rather than their truth conditions.

  ### Session Plan: The Architecture of "Freedom and Resentment"

  **Goal:** To demonstrate that Strawson is not solving the metaphysical problem of free will, but dissolving the anxiety surrounding it by shifting the ground from *causality* to *community*.
  **Time:** 90 Minutes
  **Materials:** Whiteboard (essential for mapping the architecture).

  ---

  #### 0:00 – 0:10 | Introduction: Setting the Trap
  **Activity:** Do not summarize the paper. Acknowledge the room's split (Compatibilists vs. Incompatibilists).
  **Instruction:** Tell them: "Today we are not asking if Strawson is right. We are asking what work his concepts are doing. If you think compatibilism is a cheat, watch how Strawson avoids the usual cheat. If you think it's obvious, watch where he admits the cost."
  **Board Work:** Write **DETERMINISM** on the far left and **RESPONSIBILITY** on the far right. Draw a question mark between them.
  **Point:** Traditional debates try to bridge this gap with metaphysics. Strawson argues the gap is an illusion created by looking at the wrong thing.

  #### 0:10 – 0:30 | Segment 1: The Data (Reactive Attitudes)
  **The Carrying Example:** **The Broken Promise.**
  *Scenario:* A colleague promises to read your draft by Friday. They don't. You feel a specific sting.
  **Discussion:** Ask the group to describe that sting.
  *   **Misconception Check (Emotions):** If they say "anger" or "annoyance," correct them immediately. Anger can be had at a storm. This sting is different.
  *   **Architecture Move:** Define **Reactive Attitudes** not as internal feelings, but as *communicative demands*. They are the currency of interpersonal relationships. Resentment is the demand that the other regard you with good will.
  *   **Why this example?** It is moral (not just physical pain like stepping on a hand) but ordinary (not high-stakes like murder). It allows for nuance.
  *   **Key Distinction:** Establish that without the expectation of goodwill, the attitude makes no sense. This sets up the need for a *context*.

  #### 0:30 – 0:55 | Segment 2: The Framework (The Stances)
  **The Precursor Question:** You asked what idea must be in place for "reactive attitudes" to mean more than emotions. It is indeed the **Participant vs. Objective Stance**.
  **Order of Operations:** Do not introduce the Objective Stance yet. Let it emerge as the *exception* to the Participant Stance.
  **Activity:** Return to the Broken Promise. Ask: "Under what conditions does your resentment vanish?"
  **Board Work:** Create two columns under **RESPONSIBILITY**.
  1.  **Excusing Conditions:** "My car broke down," "I forgot."
      *   *Analysis:* The resentment vanishes, but the *relationship* remains. You are still in the **Participant Stance**. You see them as an agent, just one who didn't intend ill.
  2.  **Exempting Conditions:** "He had a manic episode," "He is a psychopath," "He is a child."
      *   *Analysis:* The resentment vanishes, and the *relationship* changes. You now view them as an object of treatment or management. This is the **Objective Stance**.
  **Misconception Check (Pathology):** Head this off *now*. Ask: "Is the Objective Stance only for the mentally ill?"
  *   *Correction:* No. We take the Objective Stance toward political enemies, in professional diplomacy, or when we need to "cool down" to resolve a conflict. It is a tool, not just a diagnosis.
  **Architecture Move:** Show that the Participant Stance is the *default* human mode. The Objective Stance is a *retreat* from it.

  #### 0:55 – 1:15 | Segment 3: The Threat (Determinism)
  **Activity:** Introduce the Incompatibilist worry. "But what if the colleague was determined by the Big Bang to break the promise?"
  **Discussion:** Does this universal causality count as an Excusing or an Exempting condition?
  *   *Strawson's Move:* It fits neither.
  *   It's not an excuse (they still intended it).
  *   It's not an exemption (they aren't pathological).
  *   **Crucial Point:** If we treat *everyone* as exempt due to determinism, we abandon the Participant Stance entirely.
  **Board Work:** Draw a box around the **Participant Stance**. Label it **HUMAN NATURE / SOCIAL PRACTICE**. Draw an arrow from **DETERMINISM** pointing at the box, then cross it out.
  **Argument:** We *cannot* universally sustain the Objective Stance. It is psychologically impossible to view all humans as objects of management. Therefore, the practice of holding responsible is immune to the metaphysical fact of determinism.
  **Misconception Check (Quietism):** Head this off *here*.
  *   *The Worry:* "Is Strawson just saying 'we can't help it so stop asking'?"
  *   *The Correction:* No. He is saying the question presupposes we could step outside our own nature to judge it. That is the illusion. It is not quietism; it is naturalism.

  #### 1:15 – 1:25 | Segment 4: What We Are Ignoring (The Boundaries)
  **Instruction:** Explicitly state what this session is *not* covering to prevent over-extension.
  1.  **Retributive Punishment:** Strawson is analyzing interpersonal blame (resentment), not state-sanctioned punishment.
      *   *Why omit?* Conflating the two makes Strawson look like he is justifying prison based on feelings.
      *   *Where it misleads:* If you don't say this, students will think Strawson has no resources to critique excessive punishment. He does, but it requires extending the argument (which we aren't doing).
  2.  **Empirical Psychology:** We are not testing if humans *actually* feel this way. We are analyzing the *grammar* of our practices.
  3.  **Later Compatibilism:** (Fischer, Ravizza, etc.).
      *   *Why omit?* They try to reconcile control with determinism. Strawson argues control is the wrong metric. Mixing them confuses the architecture.

  #### 1:25 – 1:30 | Conclusion: The Diagnostic Question
  **Activity:** Do not summarize. Ask the final question.
  **The Question:**
  > "If Strawson had successfully proven that determinism is **false**, would this essay have succeeded in doing what it set out to do?"

  **Expected Answer:** No.
  **Why:** If they understand the architecture, they will see that proving determinism false would validate the *metaphysical* worry Strawson is trying to bypass. The essay's title is *Freedom and Resentment* because the real tension is not between causality and freedom, but between our need for human connection (Resentment) and the temptation to opt out of it (Objective Stance). The title signals that the problem is ethical/psychological, not cosmological.

  ---

  ### Rationale Notes for the Session Leader

  **1. The Precursor Idea (Stances vs. Attitudes)**
  You are correct that the **Participant/Objective Stance** distinction is the precursor. Without the stance, "reactive attitude" is just psychology. Within the stance, it is normative.
  *   **Strategy:** Introduce the attitudes *phenomenologically* first (what it feels like to be wronged), then reveal the stance as the *condition of possibility* for that feeling. If you introduce the Stances first, it becomes abstract taxonomy. If you let the Stances emerge from the breakdown of the Attitudes (via the example), the architecture feels necessary.

  **2. The Carrying Example (The Broken Promise)**
  *   **Why this one?**
      *   *Stepping on hand:* Too physical. Hard to distinguish "accident" from "exemption."
      *   *Forgetting name:* Too trivial. Doesn't carry the weight of "moral demand."
      *   *Broken Promise:* Perfect. It implies a **demand for goodwill**.
  *   **Requirements:** The example must allow for **Excusing** (I didn't mean to) without triggering **Exemption** (I can't help myself). The promise works because "I forgot" excuses the action but keeps the agent in the moral community. "I am clinically unable to care" exempts the agent and removes them from the moral community. Determinism ("Physics made me forget") tries to do the latter to everyone, which Strawson says is impossible.

  **3. Managing Misconceptions**
  *   **"Just Emotions":** Address in Segment 1. Insist they are *communicative*. Resentment says "You owed me."
  *   **"Objective = Pathology":** Address in Segment 2. Use the "diplomat" or "cooling off" example. The Objective Stance is a *mode of engagement*, not just a medical diagnosis.
  *   **"Quietism":** Address in Segment 3. Emphasize that Strawson is describing a *necessary feature of human life*, not recommending we stop thinking.

  **4. Strategic Omissions**
  *   **Punishment:** You must explicitly bracket this. If you don't, the Incompatibilists in the room will attack Strawson for ignoring the stakes of criminal justice. Acknowledge the limit: "Strawson explains blame, not prisons."
  *   **Truth of Determinism:** Do not let the session drift into whether determinism is true. Strawson's argument holds regardless. If you debate the science, you validate the metaphysical worry he is dissolving.

  **5. The Final Question**
  The question about the title ("Freedom and Resentment" vs. "Freedom and Determinism") is the litmus test.
  *   If they think the essay is about whether determinism is compatible with freedom, they missed the point.
  *   If they see the essay is about whether we can sustain human relationships without the metaphysical guarantee of freedom, they have grasped the architecture.
  *   **Why this question?** It forces them to identify the *genre* of the argument. It is not a metaphysical proof; it is a transcendental argument about the conditions of social life.
