          4.  **Tone/Style:** American English, academic but accessible to an ML researcher, rigorous.

  2.  **Deconstruct the Evolutionary Debunking Argument (EDA):**
      *   *Core Claim:* Evolution selected for moral beliefs that enhanced fitness, not beliefs that tracked moral truth.
      *   *Implication:* Our moral beliefs are insensitive to moral truth (they would be the same even if moral truths were different).
