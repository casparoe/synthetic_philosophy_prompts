      *   *Human Moral Intuitions:* Model Parameters / Policy ($\pi_\theta$) outputting predictions/actions.
      *   *The Debunking Claim:* The model optimized for $R_{proxy}$ on $P_{train}$. There is no guarantee $R_{proxy}$ aligns with $R_{true}$ on $P_{test}$ (the real world of moral facts). This is *Objective Misalignment* or *Goodhart's Law*.
      *   *The Realist Claim:* There exists a $R_{true}$ independent of the training process.
