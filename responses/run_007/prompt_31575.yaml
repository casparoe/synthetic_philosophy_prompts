      *   *Equalized Odds:* $P(\hat{Y}=1 | Y=0, A=a)$ and $P(\hat{Y}=1 | Y=1, A=a)$ are equal across groups. (Equal FPR and TPR).
      *   *Base Rate:* $P(Y=1 | A=a)$.
      *   *Intuition:* Calibration ties the score to the *outcome prevalence*. EO ties the *errors* to the *decision threshold*. If prevalence differs, the "mix" of positives and negatives feeding into the score differs. To keep errors equal (EO), you need to treat the score distributions similarly. But to keep calibration, the score must reflect the different prevalence. These pull in opposite directions.

