answer: |-
  What you are describing is one of the most classic, well-documented, and pivotal experiences in contemplative practice. You have put your finger on the exact mechanism that Buddhist philosophy (and several others) claims is the root of suffering.

  To answer your first question: **Yes, there are names for this dynamic.**

  To answer your second question: **The return of the self is not a bug; it is a feature.** It is exactly what the tradition predicts, and it defines the difference between *intellectual understanding* and *liberation*.

  Here is a breakdown of the terminology, the philosophy behind the "return," and how to work with it.

  ### 1. Names for the Dynamic

  You described the self as "constitutively elusive"—there when you aren't looking, gone when you are.

  **In Advaita Vedanta: *Drg-Drishya-Viveka* (The Seer-Seen Discrimination)**
  Your analogy of "trying to see your own eyes without a mirror" is almost a direct quote from this tradition. The *Drg-Drishya-Viveka* is a text dedicated to the logic that the Subject can never become an Object. The eye sees forms, but cannot see itself. The mind knows objects, but cannot know itself as an object. If you could find the "self" as an object of attention, it wouldn't be the self; it would be just another thing. Therefore, the fact that it vanishes when looked for is proof of its nature as the *Subject*, not a proof of its non-existence (though Vedanta and Buddhism diverge on what that Subject *is*).

  **In Modern Non-Duality: *The Headless Way***
  In the 1960s, a British philosopher named Douglas Harding formalized exactly what you are experiencing. He called it "On Having No Head." He developed experiments where you point at objects (wall, tree, foot) and notice they have shapes/colors, but when you point at "yourself," you find a capacity for the world, a void, a "no-thing." He calls the return of the self "the mask." We wear the mask of a self to function in society, but the practice is to remember you are faceless underneath it.

  **In Buddhism: *Svabhava-Shunya* (Empty of Intrinsic Nature)**
  In the Mahayana tradition (specifically Madhyamaka), this dynamic is the definition of *Emptiness* (*Sunyata*). Things that have "intrinsic existence" should be findable under analysis. A rock, if you break it down, is still rock particles. But the "self," when analyzed, dissolves.
  The specific dynamic you noticed—that it relies on *not* being looked at—is often described as **reification** or **hypostatization**. We take a process and freeze it into a noun. When you stop the freezing process (attention), the noun melts back into a verb (flowing experience).

  ### 2. Why Does the Self Come Back?

  This is the crux of your second question. If I see there is no self, why do I feel like a solid "me" five minutes later when making tea?

  **The Doctrine of Two Truths**
  Buddhism deals with this via the *Two Truths Doctrine*:
  1.  **Ultimate Truth (*Paramattha-sacca*):** Under analysis, there is no self.
  2.  **Conventional Truth (*Sammuti-sacca*):** In the flow of cause and effect, language, and biology, there is a "person."

  The tradition does not expect you to lose the ability to function as a person. You still need to pay taxes, avoid walking into traffic, and argue with your brother. The "self" that returns is the **Conventional Self**. It is a useful interface. The problem isn't the interface; it's *believing* the interface is the ultimate reality.

  **Vasana (Habit Energy)**
  This is the specific mechanism for the "return." In Yogacara and Zen Buddhism, they speak of *Vasana* (perfuming/habit energy) or *Samskara* (formations).
  Imagine a groove in a record. You've played the "I am a separate self" track billions of times over lifetimes (or just decades of neural conditioning).
  *   **Meditation:** You lift the needle. You see there is no music, just grooves.
  *   **Daily Life:** You put the needle back down to function. The habit energy is so strong that the music starts playing again immediately.

  The return of the self is not evidence that the self is real; it is evidence that **habit is powerful.**

  **The Default Mode Network (DMN)**
  Secular neuroscience matches this perfectly. The "self" correlates strongly with the Default Mode Network, a brain network that activates when you aren't focused on a task. It handles autobiographical memory, self-referential processing, and mind-wandering.
  *   **Meditation:** You engage attention networks that suppress the DMN. The "self" signal drops.
  *   **Tea Making:** You relax focus. The DMN reactivates to manage navigation and social planning. The "self" signal returns.
  The brain is a prediction machine. It predicts a "self" because that model has been evolutionarily useful for survival. It will keep predicting it until the prediction error is so consistent that the model updates.

  ### 3. Is This a Problem for No-Self?

  **No. It is exactly what the view predicts.**

  If the self were an illusion that could be dispelled forever in a single moment of insight, enlightenment would be a one-time event. But the traditions describe it as a path, a training, a cultivation.

  The *Visuddhimagga* (Path of Purification) uses the **Simile of the Snake and the Rope**:
  > A man walks down a path in the twilight and sees a snake. He is terrified. He shines a light (investigation/meditation) and sees it is just a coiled rope. The "snake" vanishes.
  >
  > He turns off the light and walks on. In the twilight, it *looks* like a snake again.
  >
  > **Crucial Point:** Even though it looks like a snake again, he is no longer *afraid* of it. He knows it is a rope.

  The goal of practice is not necessarily to make the "snake" (the sense of self) never appear again. The goal is to lose the *fear* and *clinging* associated with it. When the self arises, you recognize it as a construct. You don't believe it's the boss.

  ### 4. How to Work With This

  You are at a stage where you might feel frustrated: *"I see it's empty, but I still feel it. Am I failing?"*

  **1. Stop trying to kill the self.**
  Trying to make the homunculus go away permanently is just the homunculus trying to secure its own immortality. It's a trap.

  **2. Shift from "Elimination" to "Recognition."**
  When you are arguing with your brother and the "me" feels solid, don't try to dissolve it right then. Just notice: *"Ah, the self-contract is active."* Notice the tension in the face, the narrowing of attention, the story of "I am right."
  The moment you recognize it as a *phenomenon* rather than *reality*, the grip loosens.

  **3. Trust the "Look."**
  You said: *"The moment I turn attention on it, it vanishes."*
  Keep trusting that. That is your anchor. You don't need to live in that vanishing point 24/7. You just need to know the door is there. The fact that it *can* vanish proves it isn't solid. The fact that it returns proves you have habits.

  **4. Integrate the "Headless" insight.**
  Try Douglas Harding's experiments. When the self feels solid, point at your face. Remind yourself visually that there is "no one" home. This bridges the gap between the meditation cushion and the kitchen.

  ### Summary
  You have discovered **Reflexive Emptiness**.
  *   **The Name:** In Vedanta, it's the Seer not being the Seen. In Buddhism, it's the lack of *Svabhava* (intrinsic nature).
  *   **The Return:** This is *Vasana* (habit energy) and *Conventional Truth*. It is not a failure; it is the residue of conditioning.
  *   **The Verdict:** This dynamic confirms *Anatta*. If the self were real, it would survive your gaze. Because it is attention-dependent, it is proven to be a construct.

  You are doing it right. The friction you feel between the "empty look" and the "solid return" is the very friction that polishes the lens of wisdom. Keep looking.
