prompt: |-
  I'm a backend engineer — I spend my days writing API contracts, database transactions, assertions, the works. In my world an assertion is something like `assert(x != null)` — it's a statement about program state I'm willing to bet the system's correctness on. If it fires, that's a bug somewhere in my reasoning.

  I recently fell down a rabbit hole reading about the philosophical "norm of assertion" debate — you know, whether the rule for making a proper assertion is that you must *know* the thing, or just believe it, or be justified in believing it, or that it just has to be true. And I kept thinking: this maps onto stuff I already think in, but not cleanly.

  So here's what I want. Restate each of the main positions — knowledge norm, truth norm, justified belief norm, belief norm — in the vocabulary I actually use: assertions, contracts, preconditions, postconditions, exceptions, type guarantees, whatever maps. Don't force it where it doesn't fit; I'd rather you say "this one doesnt have a clean analog" than stretch something past breaking.

  Then the part I actually care about: the residue report. What in the philosophers' debate has no counterpart in how we think about assertions in code? Is there something the knowledge-norm people are tracking that simply doesn't show up when your assertions are evaluated by a runtime rather than by other speakers? And the bottom-line question: is the residue there because my engineering vocabulary is missing something important about what we do when we assert things to each other, or because the philosophers are drawing distinctions that don't correspond to anything real — distinctions that dissolve once you try to operationalize them?
