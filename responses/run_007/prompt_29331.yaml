answer: |-
  # Diachronic Rationality: A Decision Tree
  **Subject:** What is wrong with a money-pumpable agent?  
  **Running Cases:**  
  1.  **Reversal:** On Sunday, you prefer a Larger-Later (LL) reward. On Tuesday, facing the choice, you prefer a Smaller-Sooner (SS) reward.  
  2.  **Precommitment:** On Sunday, you can pay a cost to remove the SS option entirely before Tuesday arrives.

  ---

  ### Q1: The Money Pump Test
  **Does the mere possibility of being money-pumped (losing value due to time-inconsistent preferences) prove your preferences are irrational?**
  *   **Yes** → Go to **Leaf A**.
  *   **No** → Go to **Q2**.

  ### Q2: The Metaphysics of Agency
  **Is your future self (e.g., Tuesday-you) literally the *same agent* as you, or a *distinct entity* (a separate self/time-slice)?**
  *   **Distinct Entity** → Go to **Q3**.
  *   **Same Agent** → Go to **Q4**.

  ### Q3: The Scope of Concern (For Distinct Entities)
  **Do you aim to maximize the total welfare across all your time-selves, or only the welfare of the current slice?**
  *   **Total Welfare (Cooperation)** → Go to **Leaf B**.
  *   **Current Slice (Local Max)** → Go to **Leaf C**.

  ### Q4: The Authority of Plans (For Same Agent)
  **On Tuesday, does Sunday's plan to choose LL have normative authority even if you now prefer SS?**
  *   **Yes (Plan Binds)** → Go to **Leaf D**.
  *   **No (Current Preference Binds)** → Go to **Q5**.

  ### Q5: The Accuracy of Expectation
  **On Sunday, do you correctly anticipate that you will abandon the plan on Tuesday?**
  *   **Yes** → Go to **Leaf E**.
  *   **No** → Go to **Leaf F**.

  ---

  ## The Leaves

  ### Leaf A: The Coherence View
  **Position:** Time-inconsistent preferences are inherently irrational; a rational agent's preferences must be stable.
  *   **Verdict on Cases:** The Sunday preference is the only rational one; the Tuesday reversal is a failure of rationality. Precommitment is unnecessary if you are rational.
  *   **Most Awkward Commitment:** You must classify Ulysses tying himself to the mast as an irrational act, since a rational agent would not need to bind themselves.

  ### Leaf B: Multiple Selves (Intrapersonal Game Theory)
  **Position:** You are a sequence of distinct agents playing a repeated game; rationality is strategic cooperation between selves.
  *   **Verdict on Cases:** Tuesday-you is a "stranger" you must bargain with. Precommitment is a strategic move to alter the payoff matrix for future selves.
  *   **Most Awkward Commitment:** You must treat your own retirement planning as a negotiation with a hostile party rather than a unified life project.

  ### Leaf C: Time-Slice Rationality
  **Position:** The only locus of rationality is the present moment; there is no normative reason to sacrifice current utility for a future slice's benefit.
  *   **Verdict on Cases:** Taking the SS reward on Tuesday is perfectly rational. Precommitment is irrational unless it benefits the *current* slice (e.g., reducing anxiety).
  *   **Most Awkward Commitment:** You have no rational reason to save money for tomorrow unless you currently derive utility from the act of saving.

  ### Leaf D: Resolute Choice
  **Position:** You are one agent, and a past intention can rationalize an action even when current preferences contradict it.
  *   **Verdict on Cases:** You stick to the LL plan on Tuesday without external binding. Precommitment is permissible but signals a lack of resoluteness.
  *   **Most Awkward Commitment:** You must claim that a past mental state can magically generate reasons for action that override your current explicit preferences.

  ### Leaf E: Sophisticated Choice
  **Position:** You are one agent, plans do not bind, and you correctly foresee your future weakness.
  *   **Verdict on Cases:** You know you will take SS on Tuesday, so you choose Precommitment on Sunday. You avoid situations where you know you will be pumpable.
  *   **Most Awkward Commitment:** You must accept that rationality sometimes requires paying a cost to restrict your own future freedom to maximize your own welfare.

  ### Leaf F: Naive Choice
  **Position:** You are one agent, plans do not bind, and you falsely believe you will stick to them.
  *   **Verdict on Cases:** You choose LL on Sunday, intend to stick to it, but take SS on Tuesday. You do not precommit because you don't think you need to.
  *   **Most Awkward Commitment:** You must accept that you will be predictably surprised by your own choices and repeatedly money-pumped without learning.

  ### Leaf G: [Unoccupied] The Binding Stranger
  **Position:** Future selves are distinct entities, *but* your current plans bind them normatively.
  *   **Status:** **Incoherent.** If the future self is truly a distinct agent (as per Q2), they cannot be bound by your current normative authority without their consent (which returns you to Leaf B).

  ---

  ## Notes on the Logical Space

  **Indistinguishable Leaves:**  
  **Sophisticated Choice (E)** and **Time-Slice Rationality (C)** often recommend the same actions (e.g., rejecting internal precommitment). They differ only in *why*: the Sophisticate acts to help their future self (global welfare), while the Time-Slicer acts only for current welfare. In practice, without access to their internal motives, you cannot tell them apart.

  **Unstable Combinations:**  
  A "Same Agent" view that denies Plan Authority (Q4=No) but claims you *will* follow the plan (Q5=Yes) is unstable. If the plan has no authority and preferences reverse, you will not follow it. This combination collapses into **Naive Choice (F)** (you *think* you will follow it, but you are wrong) or **Resolute Choice (D)** (you claim the plan *does* have authority).

  **Practical Summary:**  
  *   If you want to avoid money pumps without external tools: **Resolute Choice**.  
  *   If you trust game theory more than willpower: **Sophisticated Choice** (Precommit).  
  *   If you think "future you" is a different person: **Multiple Selves**.  
  *   If you think consistency is the only virtue: **Coherence View**.
