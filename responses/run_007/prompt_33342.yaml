      *   **Paul Benacerraf (1962):** "Tasks, Super-tasks, and the Modern Eleatics." The definitive rebuttal. He argued Thomson's description defines the state of the lamp for all $t < 1$, but says *nothing* about $t = 1$. Therefore, the state at $t=1$ is logically underdetermined, not contradictory. It could be on, off, or exploded. The premises don't force a contradiction; they just don't provide an answer.
      *   **Current Consensus:** Thomson's Lamp doesn't prove supertasks are impossible. It proves that the *state function* of the lamp is discontinuous at $t=1$. Whether supertasks are possible depends on physics (causality, energy, speed of light), not pure logic.

