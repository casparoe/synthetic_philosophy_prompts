          *   Against the *Actual Theory*: No, or at least, it's contested.
          *   *Why?* Bostrom/Alignment folks argue human moral convergence is due to *evolutionary history* and *biology*, not intelligence *per se*. We share similar hardware and social pressures. An AI doesn't have that.
