      *(Self-Correction on the "Incompatible" aspect)*: If a state tracks Snakes and Tools, are those incompatible? A thing can't be both a snake and a tool simultaneously (usually). So the content "Snake" and "Tool" are incompatible. If the state fires for both, is the content "Snake or Tool"? Teleosemantics usually wants to avoid disjunctive content if possible. But if both are selected for, avoiding it is hard.

      *(Refining the "Dual Maintenance")*: This is the key. It's not just that it *can* track both. It's that selection pressure *currently* sustains the mechanism *because* it tracks both. This creates a "many-to-one" mapping from function to content.

      *(Finalizing the Recommendation)*: The commitment to revise is the idea that biological function is *univocal*. We should accept that biological function can be plural, and therefore semantic content might be underdetermined by biology alone, requiring a pragmatic or systemic supplement. Or, more sharply, teleosemantics must abandon the hope of reducing content *solely* to history.

