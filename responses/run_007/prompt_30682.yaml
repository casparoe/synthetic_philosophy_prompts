answer: |-
  Teleosemantics aims to naturalize intentionality by grounding the content of mental states in the biological functions of the mechanisms that produce them. By appealing to evolutionary history, teleosemantics famously claims to solve the "disjunction problem": it explains how a state can mean *Fly* rather than *Fly-or-BB*, even if the mechanism is triggered by both, by identifying the specific condition for which the mechanism was selected. However, a deeper indeterminacy problem lurks beneath this success. This problem arises not from error, but from the complexity of evolutionary history itself, specifically regarding exaptation and dual maintenance.

  Consider a central case involving a single representational mechanism, $M$, within an organism $O$. Let $M$ be a neural state that triggers a specific physiological response. In the ancestral environment, $M$ was selected for tracking Property $P_1$ (e.g., the presence of a specific predator). Possessing $M$ conferred a survival advantage because it allowed $O$ to flee $P_1$. Later, due to an environmental shift or a change in $O$'s niche, $M$ was exapted to track Property $P_2$ (e.g., the presence of a specific nutritious root), which is incompatible with $P_1$ in terms of truth conditions and required behavioral response (fleeing vs. approaching). Crucially, in the current environment, *both* etiologies contribute to the present maintenance of $M$. The gene pool retains $M$ because it successfully tracks $P_1$ (avoiding death) *and* because it successfully tracks $P_2$ (securing food). Both functions are currently "proper" in the sense that they explain why $M$ has not been selected against.

  The teleosemanticist must assign a unique content to $M$. Does $M$ mean PREDATOR, ROOT, or PREDATOR-OR-ROOT? Standard teleosemantic strategies for fixing content fail in this hybrid scenario, yielding either conflict or circularity.

  First, consider appealing to the **conditions that explain current selection**. In standard cases, we look to what keeps the trait in the population. Here, both $P_1$ and $P_2$ keep the trait in the population. If we say the content is determined by the conjunction of current selective pressures, the content becomes disjunctive ($P_1 \lor P_2$). However, teleosemantics typically seeks to avoid disjunctive content because it fails to guide specific behavior; one cannot simultaneously flee and approach based on a single state. If we insist on a unique content, we must arbitrarily privilege one selective pressure over the other without a naturalistic basis for doing so.

  Second, consider the **consumer's use of the state** (a la Millikan). Content is often fixed by what the "consumer" system needs the state to be to perform its function. In this case, however, the consumer system utilizes $M$ for two incompatible ends depending on context. If the motor system uses $M$ to initiate flight in some contexts and foraging in others, the consumer's demand is not unitary. To determine which consumer use fixes the content, one must already know which context represents the "standard" or "meaningful" use of $M$. This leads to the third strategy.

  Third, one might appeal to the distinction between **proper and accidental function**. The teleosemanticist might argue that tracking $P_1$ is the "proper" function and tracking $P_2$ is merely a useful accident (or vice versa). However, since both functions currently contribute to reproductive success and the maintenance of the mechanism, both qualify as proper functions in the etiological sense. Distinguishing the "meaning-constituting" proper function from the "mere utility" proper function requires a criterion external to selection history. To claim that $P_1$ is the *real* content because it was the *original* function is to privilege history over current utility arbitrarily. To claim $P_2$ is the content because it is the *current* primary utility is to ignore the etiological constraint that defines teleosemantics. In making this distinction, the theorist appears to tacitly presuppose an intentional interpretation of the system (e.g., "The organism *really* takes $M$ to signify danger") to decide which biological function is semantic.

  Fourth, consider a **weighted selection history**. One might propose that the original selection carries more weight than the exaptation, or that the more recent maintenance is dominant. Yet, there is no non-arbitrary metric within naturalistic biology for weighting these historical contributions. Why should the origin outweigh the maintenance, or vice versa? Any weighting scheme chosen to yield a single content will look ad hoc, designed solely to rescue the theory from indeterminacy rather than derived from the facts of the case.

  In each instance, the attempt to fix a unique content fails. Either the strategies yield conflicting contents (PREDATOR vs. ROOT), or they rely on a prior intuition about what the organism is representing to select the relevant function, thereby violating the naturalistic ambition of the program. The indeterminacy survives because biological function itself is indeterminate in cases of dual-maintenance exaptation, while semantic content is presumed to be determinate.

  In light of this, the teleosemantic program must revise its commitment to **etiological exclusivity**—the claim that evolutionary history alone is sufficient to determine semantic content. The case of the dual-maintenance mechanism demonstrates that biological function can be plural and context-dependent without rendering the system broken. Therefore, teleosemantics should abandon the requirement that content be fixed solely by a single, privileged etiological thread. Instead, the program should adopt a hybrid view where etiology constrains content but does not fully determine it, allowing current systemic role or pragmatic context to disambiguate between competing proper functions. Only by acknowledging that biological function underdetermines semantic content can teleosemantics avoid collapsing into circularity when faced with the complex realities of evolutionary exaptation.
