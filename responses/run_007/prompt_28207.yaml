answer: |-
  This is the right way to approach the problem. Most debates about intelligence fail because they conflate the *phenomenon* with the *metric* used to measure it, or they assume the architecture of one substrate (usually the human brain) is the template for all others.

  To build a specification that serves your three jobs—(1) Cross-Substrate Comparison, (2) Unity vs. Modularity, and (3) Appearance vs. Reality—we need a theory that is functionally defined but structurally agnostic. It must be able to describe *what* is happening without committing immediately to *how* it is implemented, while still respecting the physical constraints of implementation.

  Here is the spec, brainstormed and stress-tested against the history of cognitive science.

  ### 1. The Load-Bearing Cases
  A theory of intelligence is only as good as its ability to explain the outliers. If a theory cannot account for these specific dissociations, it is describing a specific technology (like IQ testing or Transformer architectures), not intelligence itself.

  | Case | Requirement | Why it is Load-Bearing |
  | :--- | :--- | :--- |
  | **The Savant** (Calendar calculation, low life function) | **Fractionation:** The theory must allow cognitive capacities to dissociate; high performance in one domain cannot necessitate high performance in all. | **Job 2:** Refutes strong "general power" theories that claim intelligence is a single fuel tank; proves modularity is real. |
  | **The LLM** (Passes Bar Exam, fails novel child task) | **Fragility vs. Robustness:** The theory must distinguish between statistical interpolation of training data and genuine causal understanding of novel constraints. | **Job 3:** Prevents conflating "looking intelligent" (performance) with "being intelligent" (competence/adaptability). |
  | **The Crow/Octopus** (Multi-step novel tool use) | **Substrate Neutrality:** The theory must recognize goal-directed problem-solving in non-linguistic, non-human morphologies without requiring human-like symbols. | **Job 1:** Ensures the theory isn't just anthropocentric linguistics in disguise. |
  | **The Flynn Effect** (Rising scores across cohorts) | **Environmental Sensitivity:** The theory must explain how intelligence metrics can shift population-wide without genetic change, implying interaction with cultural/technological scaffolding. | **Job 2:** Shows intelligence is not a fixed biological constant but a dynamic interaction with environment. |
  | **The Foolish Expert** (High IQ, terrible judgment) | **Intelligence vs. Rationality:** The theory must separate raw processing power (algorithmic mind) from goal-alignment and epistemic hygiene (reflective mind). | **Job 3:** Crucial for distinguishing capacity from the *use* of capacity (avoiding the "efficient idiot" problem). |

  ### 2. Distinctions That Cannot Collapsed
  Collapsing these distinctions is where most theories fail to do your three jobs. I have marked which Job(s) each distinction primarily serves.

  *   **Performance vs. Competence (Job 3):**
      *   *The Distinction:* What the system *does* under specific conditions vs. the underlying knowledge/structure it *has*.
      *   *Collapse Consequence:* If you collapse these, the LLM passes the Bar Exam and is therefore "intelligent." You lose the ability to predict failure on out-of-distribution tasks. You confuse the benchmark with the capability.
  *   **Fluid vs. Crystallized (Job 2):**
      *   *The Distinction:* The ability to solve novel problems (fluid) vs. the accumulation of stored knowledge/skills (crystallized).
      *   *Collapse Consequence:* If you collapse these, you cannot explain the Savant (high crystallized/specific, low fluid/general) or the Flynn Effect (environmental boosts to fluid strategies). You also cannot compare a fresh NN (fluid) to a trained one (crystallized) fairly.
  *   **Domain-General vs. Domain-Specific (Job 1 & 2):**
      *   *The Distinction:* Mechanisms that apply across contexts (e.g., working memory) vs. mechanisms tuned for specific inputs (e.g., face recognition).
      *   *Collapse Consequence:* If you insist on pure generality, you cannot explain brain damage dissociations. If you insist on pure specificity, you cannot explain transfer learning or the positive manifold. A viable theory must be hybrid.
  *   **Intelligence vs. Rationality (Job 3):**
      *   *The Distinction:* The horsepower of the engine vs. the steering and the map (epistemic rationality and instrumental rationality).
      *   *Collapse Consequence:* If you collapse these, the "Foolish Expert" becomes a logical impossibility. You cannot account for self-sabotage or bias in high-IQ individuals.
  *   **Pushing Back: Intelligence vs. Knowledge:**
      *   *Verdict:* **Overrated.** This is largely a subset of Fluid vs. Crystallized. "Knowledge" is just crystallized intelligence. Keeping them separate often leads to the "empty vessel" fallacy, implying one can have intelligence without *any* content, which is empirically false.

  ### 3. Empirical Patterns (Non-Negotiables)
  Any adequate theory must be consistent with these data points. If a theory predicts these shouldn't exist, the theory is wrong.

  1.  **The Positive Manifold:** Cognitive tests correlate. People who do well on vocab tend to do well on spatial rotation. (Constraints Job 2: You cannot have *pure* modularity).
  2.  **Double Dissociation:** Brain damage or developmental conditions can impair Ability A while sparing Ability B. (Constraints Job 2: You cannot have *pure* unity).
  3.  **Transfer Costs:** Learning Task A helps with Task B, but not perfectly, and often requires abstraction. (Constraints Job 1 & 3: Intelligence is not infinite generalization).
  4.  **Metabolic/Efficiency Constraints:** Intelligence correlates with neural efficiency (less energy for same output) in biological systems; in AI, it correlates with compute/data efficiency. (Constraints Job 1: Intelligence is not free; it is an optimization problem).

  ### 4. Consensus vs. Camp Tastes
  Here is where the spec gets political. I have marked which requirements are demanded by specific schools of thought and which are genuine desiderata for *your* three jobs.

  | Requirement | Consensus Desideratum? | Camp Taste / Controversy |
  | :--- | :--- | :--- |
  | **Positive Manifold** | **Yes.** (Jobs 1 & 2) | *g*-factor proponents treat this as the *only* thing that matters. Multiple Intelligences proponents try to explain it away as artifact. |
  | **Fractionation** | **Yes.** (Jobs 2 & 3) | *g*-factor folks hate this; Gardner (Multiple Intelligences) treats this as the *only* thing that matters. |
  | **Substrate Neutrality** | **Yes.** (Job 1) | **Embodied Cognition** camp rejects this; they argue biology/morphology is constitutive of intelligence, not just a vessel. |
  | **Computational Sufficiency** | **No.** (Job 3) | **AI Capabilities** camp assumes computation = intelligence. **Enactivists** argue computation is abstract and misses the "alive" part. |
  | **Scalar Measurement** | **No.** (Job 2) | **Psychometricians** want a single number ($g$). **Ecological** theorists argue a scalar destroys necessary information about profile shape. |

  ### 5. The Tensions: Where the List Breaks
  You asked where the requirements are jointly unsatisfiable. This is the most critical part of the spec. A theory that claims to satisfy all of these perfectly is lying. There are trade-offs.

  **1. Strong Scalar Monism vs. Strong Fractionation**
  You cannot have a theory where intelligence is **strictly a single scalar quantity** (pure $g$) AND a theory where intelligence is **strictly a set of independent modules** (pure modularity).
  *   **The Conflict:** The Positive Manifold demands some unity; the Savant/Brain Damage cases demand fractionation.
  *   **The Resolution:** You must accept a **hierarchical model** (like CHC theory), where a general factor exists at the top but branches into specific abilities. However, this means **you cannot produce a single number that fully describes an agent's intelligence.** If you demand a single number, you fail the Savant case. If you demand total independence, you fail the Positive Manifold.

  **2. Substrate Neutrality vs. Embodied Specificity**
  You cannot fully satisfy **Job 1 (Octopus/NN comparison)** using a definition that requires **human-like biology** (Embodied Cognition), nor can you satisfy it using a definition that requires **disembodied symbols** (Classic Computationalism).
  *   **The Conflict:** To compare a crow to an LLM, you need abstract functionalism. But to explain *why* the crow succeeds where the LLM fails (physical intuition), you need embodiment.
  *   **The Resolution:** You must define intelligence as **goal-directed constraint satisfaction**, but acknowledge that the *cost function* differs by substrate. **A theory that ignores morphology will fail to predict real-world failure modes in biological agents.**

  **3. Static Capacity vs. Dynamic Adaptation**
  You cannot define intelligence as a **fixed capacity** (like RAM) and simultaneously explain the **Flynn Effect** or **Learning**.
  *   **The Conflict:** If intelligence is a fixed trait, cohort improvements are impossible without evolution. If it is purely a learning process, "innate intelligence" dissolves.
  *   **The Resolution:** Intelligence must be defined as the **rate of improvement** or the **efficiency of adaptation**, not the current state of knowledge. **A theory that measures intelligence as a static snapshot will fail to predict future performance in novel environments.**

  ### 6. Scorecard: How the Main Families Fare
  Here is how the major theoretical frameworks stack up against your three jobs, given the constraints above.

  **Psychometric $g$ (Jensen, Spearman)**
  *   *Verdict:* Fails Job 1 and Job 3.
  *   *Reasoning:* It handles the Positive Manifold beautifully (Job 2), but it is entirely dependent on human linguistic/symbolic testing (fails Octopus/NN comparison). It also conflates performance with competence, struggling to explain the Foolish Expert (high $g$, low rationality). It treats intelligence as a static quantity, struggling with the Flynn Effect.

  **Multiple Intelligences (Gardner)**
  *   *Verdict:* Fails Job 2 (Unity).
  *   *Reasoning:* It handles the Savant and Fractionation cases perfectly. However, it largely ignores the Positive Manifold (the fact that abilities *do* correlate). It makes cross-substrate comparison difficult because the "intelligences" are defined by human cultural roles (e.g., "Musical," "Interpersonal") rather than computational functions.

  **Computational / Rational Analysis (Marr, Stanovich, Anderson)**
  *   *Verdict:* Strongest on Job 1 and Job 3.
  *   *Reasoning:* By defining intelligence as rational information processing, it allows comparison between humans and NNs. It successfully distinguishes Intelligence (algorithmic) from Rationality (reflective). However, it often underestimates the role of biological embodiment and can be too abstract to explain specific neuropsychological dissociations without ad-hoc modular additions.

  **Embodied / Enactivist (Varela, Thompson, Noë)**
  *   *Verdict:* Strongest on Job 1 (Biological), Fails Job 1 (AI).
  *   *Reasoning:* It explains the Crow/Octopus and the Foolish Expert (context matters) better than any other theory. However, it is often hostile to the idea that an LLM could *ever* be intelligent, regardless of performance. This makes it poor for Job 1 when comparing across non-biological substrates, as it defines intelligence partly by "being alive."

  ### 7. The Killer Constraint
  If I had to bet on the single requirement that knocks out the most candidates, it is this:

  **Robust Cross-Domain Transfer under Novelty.**

  Most theories can explain competence in a *trained* domain (LLM passing the Bar, Savant calculating calendars). Most theories can explain general capacity in *familiar* contexts (Human $g$). Very few can explain how a system takes a strategy from Domain A, abstracts the causal structure, and applies it to Domain B *without* retraining or catastrophic interference, specifically when the surface features are misleading.

  *   **Why it kills candidates:**
      *   **Psychometric $g$** assumes transfer happens but doesn't explain the *mechanism* of how it crosses domains.
      *   **Multiple Intelligences** predicts transfer *shouldn't* happen (modules are independent), yet it does.
      *   **Current AI (Deep Learning)** fails this spectacularly (out-of-distribution failure).
      *   **Embodied Cognition** struggles to explain how abstract transfer happens without direct physical coupling.

  A theory of intelligence that does not explain **how abstraction enables transfer** is merely a theory of memory or optimization, not intelligence. This is the bottleneck. If your theory cannot explain how the crow's tool use translates to a new tool without trial-and-error, or why the LLM fails to do the same, it is not a theory of intelligence; it is a theory of performance.
