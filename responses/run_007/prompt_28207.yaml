          *   Identification of tensions/incompatibilities (jointly unsatisfiable constraints).
          *   Brief evaluation of main theoretical families against the list.
          *   Final "killer constraint."
      *   **Tone:** Analytical, precise, philosophical, avoiding fluff.
      *   **Format:** Prose with reasoning, tables allowed for requirements, bolding for incompatibilities.

  2.  **Deconstruct the Three Jobs:**
      *   *Job 1 (Comparison):* Needs substrate neutrality. Cannot rely solely on language or human-specific biology. Needs to handle different *morphologies* of cognition.
      *   *Job 2 (Unity/Modularity):* Needs to account for $g$ (positive manifold) *and* dissociation (savants, brain damage). This is the core tension.
      *   *Job 3 (Appearance/Reality):* Needs to distinguish optimization/performance from underlying capacity/adaptability. The "Chinese Room" vibe but empirical.

  3.  **Brainstorming the Desiderata (The "Spec"):**

      *   *Cases:* The prompt gives five specific ones (Savant, LLM, Crow/Octopus, Flynn Effect, High Score/Bad Judgment). I need to ensure the theory explains *why* these are edge cases.
      *   *Distinctions:* Performance/Competence (Chomsky), Fluid/Crystallized (Cattell), Domain-General/Specific, Intelligence/Knowledge, Intelligence/Rationality (Stanovich). I need to evaluate if any are redundant. *Intelligence vs. Rationality* is crucial for Job 3. *Performance vs. Competence* is crucial for Job 3.
      *   *Empirical Patterns:* Positive manifold ($g$), Dissociations (neuropsych), Transfer learning (or lack thereof), Adaptability to novelty.
      *   *Controversies:* $g$-factor folks want a scalar. Multiple Intelligences (Gardner) want modules. Embodied folks want to ditch computation. AI folks want to focus on benchmark performance.
