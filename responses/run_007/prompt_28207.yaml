      *   *Correction:* Make sure I explicitly address the "Job 1, 2, 3" tagging for requirements as requested ("tell me when a requirement is only needed for one of them").
      *   *Tone Check:* Keep it philosophical but grounded. Avoid "AI will take over" hype. Focus on the definition of intelligence.

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I use the specific cases? Yes.
