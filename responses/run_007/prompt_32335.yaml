  Let's sharpen the "Progress" section. If the diagnosis is correct, empirical results won't help. Conceptual distinctions (like "freedom to act" vs. "freedom to will") have already been tried. The real progress is pragmatic: accepting that "free will" is a cluster concept that serves social regulation, not a natural kind.

