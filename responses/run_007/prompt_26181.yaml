  ok so i've been trying to nail down what i actually think about mind uploading and survival and i've ended up with the following list of commitments. i'm supposed to present something coherent to my philosophy of mind reading group next week and i want to make sure i'm not walking in with a set of views that blow up on contact. here's where i've landed:

  (1) gradual replacement preserves identity. if you swap out my neurons one by one for functionally identical silicon chips, i'm still there at the end of the process. there's no moment where i disappear and someone else takes over.

  (2) destructive uploading is death. if you scan my brain and destroy it in the process, then instantiate the scan on a computer, the resulting entity is a copy of me, not me. i don't survive that.

  (3) what matters in survival is psychological continuity — overlapping chains of memory, intention, personality, and so on. the physical substrate doesn't matter in itself.

  (4) i think parfit is right that identity isn't what matters. i'd survive as a different person if my psychology changed radically but continuously; i wouldn't survive as the same person if my psychology were replicated in a different body after a gap. so it's the relation, not the identity, that carries the weight.

  (5) the teletransporter case where you're scanned, destroyed, and a replica built on mars: that's death. the person on mars is a replica. i wouldn't step into the machine.

  (6) there's a fact of the matter about whether someone survives a given process. this isn't a verbal dispute or a decision about how to use words. either i'm there at the end or i'm not.

  go through these and tell me which pairs are in genuine tension, which only look like they are, and how bad each tension is. rank them by severity. for each genuine tension, tell me what the cheapest revision is and what it costs — i.e., what i'd have to give up and how much that would mess up the rest of the view. and if there's a single change that would clean up more than one problem at once, flag that.

  please write the answer in british english.
