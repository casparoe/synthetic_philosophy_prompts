prompt: |-
  Was arguing with a coworker about whether GPT-5 is "actually thinking" or just doing stochastic parrot stuff, and he goes "look, if it walks like a duck and quacks like a duck, it's a duck" — as if that ends the conversation. He says Turing basically proved this in 1950 and anyone who still worries about whether an AI is "really" thinking after it passes the Turing test is just being mystical. I feel like that slogan is smuggling in a lot of assumptions but I can't articulate exactly what. Can you break down the different precise claims "if it walks like a duck, it's a duck" could be making when applied to AI and behavioral tests for mind? Like, what are the distinct theses hiding in that one sentence, which ones are actually defensible, which are just word games, and which reading would actually support my coworker's move of declaring the question settled?
