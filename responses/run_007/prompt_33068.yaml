  | **1. Evolutionary Continuity** | **Darwinian Gradualism:** Consciousness is a biological trait subject to natural selection. A theory positing a sharp, qualitative leap (e.g., from reptile to mammal) without a corresponding discontinuous biological change bears an impossible burden of proof. | **Non-negotiable** (Biological coherence) | **Neocortical Theories** (require specific mammalian structures); **Sharp-Boundary Dualism**; **Human-Exceptionalism Views** |
  | **2. Substrate Independence** | **Convergent Evolution:** Cephalopods and vertebrates exhibit analogous pain-avoidance and learning despite radically distinct nervous system architectures (ganglionic vs. centralized). A theory tying sentience to one specific architecture fails to capture the functional reality of sentience. | **Non-negotiable** (Welfare scope) | **Mammal-Centric NCC Theories**; **Human-PFC Theories**; **Strict Anatomical Isomorphism Views** |
  | **3. Phenomenal Specificity** | **Welfare Relevance:** Legislation protects against *suffering* (valenced experience), not merely information processing or reportability. A theory that equates consciousness with higher-order reflection or linguistic access excludes beings that can suffer without reflecting on that suffering. | **Non-negotiable** (Policy goal) | **Higher-Order Thought (HOT)**; **Global Workspace Theory (GWT)** (if focused on access); **Cognitive Functionalist Views** |
  | **4. Behavioral-Neural Coherence** | **Conflict Cases:** Decapod crustaceans show injury-tending and trade-off behavior (behavioral markers) but lack vertebrate nociceptors (neural markers). A theory must specify which marker type overrides the other when they diverge, rather than ignoring one. | **Camp Preference** (Methodological) | **Pure Behaviorism** (ignores neural); **Pure Neural Correlate Theories** (ignores behavior); **Eliminativism** |
  | **5. Operationalizability (Line-Drawing)** | **Legislative Necessity:** Laws require binary classifications (protected/not protected). A theory that yields only probabilities or vague gradients without a principled method for setting a threshold cannot guide enforcement or research prioritization. | **Non-negotiable** (Policy utility) | **Panpsychism** (too broad); **Radical Skepticism** (too narrow); **Strong Gradualism** (no thresholds) |
  | **6. Phylogenetic Consistency** | **Clade Integrity:** It is biologically implausible for consciousness to appear in one species of a genus but not its sibling without a distinct neural divergence. A theory should assign default status to clades (e.g., "all vertebrates") unless specific divergence is proven. | **Camp Preference** (Epistemic caution) | **Species-Specific Exceptionalism**; **Ad Hoc Intuition-Based Views** |

  ### The Impossible Subset: The "Policy-Biology Gap"

  The following three requirements cannot be jointly satisfied without introducing arbitrariness or error:

  1.  **Evolutionary Continuity** (Consciousness is a smooth biological gradient).
  2.  **Operationalizability** (Legislation requires a binary threshold).
  3.  **Non-Arbitrary Line-Drawing** (The threshold must be grounded in fact, not convenience).

  **The Trade-Off:** If nature is continuous (Req 1), any binary legal line (Req 2) is necessarily arbitrary (violating Req 3). A theory that satisfies Continuity forces policymakers to choose a cutoff point where nature provides none; a theory that satisfies Operationalizability (by providing a sharp cutoff) likely violates Continuity by implying a biological switch that does not exist. **You must choose between biological accuracy and legal clarity.**

  ### Field Summary
  The field is currently stalled between biologically plausible gradualist models that lack policy traction and legally actionable binary models that lack biological justification.
