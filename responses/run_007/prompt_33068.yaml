prompt: |-
  I'm organizing a workshop titled "Who's Conscious? Theories of Animal Sentience Under Pressure," and before we spend a day evaluating individual theories, I want a shared benchmark: the full list of requirements an adequate theory of the distribution of phenomenal consciousness across animal taxa must satisfy. Please write those desiderata.

  For each requirement, give:
  - The case, argument, or biological fact that motivates it;
  - Whether it is non-negotiable (any theory that fails it is dead) or a camp preference (a commitment some theorists could reasonably reject without absurdity);
  - Which family of theories it most threatens, stated structurally — e.g., "neocortical theories," "global workspace theories," "higher-order thought theories," "integrated information theory," "behavioral functionalism," "unified agency views," "any-nervous-system views," "panpsychism."

  The purpose is practical: a theory good enough to guide animal welfare legislation and research prioritization. So weight the requirements accordingly. A demand that resolves a metaphysical subtlety matters less than one that handles the line-drawing problem in a policy-actionable way, unless you can show that the subtlety has practical downstream consequences.

  Specific issues I want the desiderata to address:
  - The evolutionary continuity problem: given common descent, any sharp line between conscious and non-conscious taxa carries a burden of justification — what must a theory do to discharge it?
  - Convergent evolution cases: cephalopods (radically different nervous system organization from vertebrates) and arthropods (social hymenoptera, decapod crustaceans) — what does a theory have to say about independently evolved nervous systems?
  - The relationship between behavioral markers (trade-off behavior, learning, injury-directed behavior, anxiolytic responses) and neural markers, and what the theory requires when they conflict.
  - Whether a theory must assign consciousness to all vertebrates, some vertebrates, or no whole clade by default, and why.
  - The distinction between sentience (valenced experience) and consciousness in a broader sense, and whether a theory of the distribution of consciousness owes an account of both, or can set the broader sense aside.

  Flag any subset of these desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see. Which requirement, if any, forces a choice between two otherwise attractive packages of commitments?

  A table of requirements is ideal, with the scorecard column kept brief (e.g., "eliminates neocortical theories"). The conceptual weight should fall on the requirements themselves and the cases that motivate them, not on the scoring. Please end with a one-sentence summary of the state of the field as your final line.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of desiderata (requirements) for a theory of animal sentience/consciousness distribution.
      *   **Context:** A workshop titled "Who's Conscious? Theories of Animal Sentience Under Pressure."
      *   **Purpose:** Practical application (animal welfare legislation, research prioritization).
      *   **Format:** Table preferred. Each requirement needs: Motivation (case/argument/fact), Status (Non-negotiable vs. Camp Preference), Threatened Theory Families.
      *   **Specific Issues to Address:** Evolutionary continuity, Convergent evolution (cephalopods/arthropods), Behavioral vs. Neural markers, Vertebrate clade status, Sentience vs. Consciousness distinction.
      *   **Critical Addition:** Flag any subset of desiderata that cannot be jointly satisfied (the "trade-off" or "tension").
      *   **Ending:** One-sentence summary of the state of the field.
      *   **Tone:** Rigorous, philosophical but policy-oriented, precise.

  2.  **Deconstruct the Specific Issues & Brainstorm Desiderata:**

      *   *Evolutionary Continuity:* Consciousness likely didn't pop into existence suddenly. A theory needs to handle gradualism.
          *   *Desideratum:* Evolutionary Plausibility / Continuity.
          *   *Threat:* Sharp cutoff theories (e.g., strict Neocorticalism).

      *   *Convergent Evolution:* Octopuses and bees do similar things with different hardware.
          *   *Desideratum:* Substrate Independence / Functional Equivalence.
          *   *Threat:* Strict Neuroanatomical theories (e.g., specific human PFC requirements).

      *   *Behavior vs. Neural:* Sometimes behavior suggests pain, but neural markers are absent (or vice versa).
          *   *Desideratum:* Marker Coherence / Conflict Resolution Protocol.
          *   *Threat:* Pure Behaviorism (ignores neural) or Pure Neural Correlate theories (ignores behavior).

      *   *Vertebrate Clade:* Do we assume fish feel pain?
          *   *Desideratum:* Phylogenetic Consistency (or explicit justification for exclusion).
          *   *Threat:* Mammal-centric theories.

      *   *Sentience vs. Consciousness:* Welfare cares about *valence* (suffering/pleasure), not necessarily access consciousness or self-awareness.
          *   *Desideratum:* Valence Specificity.
          *   *Threat:* Cognitive theories focusing on reportability or meta-cognition (HOT).

      *   *Policy Actionability:* The theory must yield a Yes/No or a probability for specific taxa.
          *   *Desideratum:* Operationalizability / Line-Drawing Capacity.
          *   *Threat:* Vague panpsychism or radical skepticism.

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Draft 1 (Mental):* Must fit evolution. Must work for octopuses. Must distinguish pain from thinking. Must be usable for laws.
      *   *Refinement (Professional):* "Evolutionary Continuity," "Substrate Neutrality," "Phenomenal Specificity," "Policy Operationalizability."

      *   *Addressing the "Joint Satisfaction" Constraint:* This is the crux. Where do these clash?
          *   *Tension:* Evolutionary Continuity (gradualism) vs. Policy Operationalizability (binary legal status). You can't have a smooth gradient *and* a sharp legal line without arbitrary cutoff.
          *   *Tension:* Substrate Neutrality (functionalism) vs. Neural Specificity (NCCs). If we demand specific neural structures for certainty, we fail substrate neutrality. If we demand substrate neutrality, we lose neural certainty.
          *   *Tension:* Valence Specificity (welfare focus) vs. Broad Consciousness (theoretical focus). Theories often explain access, not feeling.

      *   *Selecting the "Killer" Tension:* The most practical tension for *this* workshop is between **Evolutionary Continuity** (no sharp lines in nature) and **Legislative Actionability** (laws need sharp lines). Also, **Substrate Neutrality** vs. **Neural Specificity** is a major theoretical fight. Let's highlight the Continuity vs. Actionability one as it directly impacts the workshop's policy goal.

  4.  **Developing the Table Content:**

      *   *Requirement 1: Evolutionary Continuity.* Motivation: Darwin. Status: Non-negotiable (biologically). Threat: Neocorticalism.
      *   *Requirement 2: Substrate Independence.* Motivation: Octopus intelligence. Status: Non-negotiable (for welfare). Threat: Human-centric NCCs.
      *   *Requirement 3: Phenomenal Specificity (Sentience vs. Access).* Motivation: Welfare cares about suffering, not reporting. Status: Non-negotiable (for welfare). Threat: HOT, GWT.
      *   *Requirement 4: Behavioral-Neural Coherence.* Motivation: Decapod crustacean injury care. Status: Camp Preference (some prioritize neural). Threat: Pure Behaviorism.
      *   *Requirement 5: Operationalizability (The Line).* Motivation: Law needs binary. Status: Non-negotiable (for policy). Threat: Panpsychism, Gradualism.

  5.  **Refining the "Joint Satisfaction" Analysis:**
      *   I need to explicitly state which requirements clash.
      *   *Clash:* Evolutionary Continuity (Nature is gradual) vs. Operationalizability (Law is binary).
      *   *Clash:* Substrate Independence (Function matters) vs. Neural Specificity (Structure matters).
      *   *Decision:* The Continuity vs. Operationalizability clash is the most profound for *policy*. The Substrate vs. Structure clash is the most profound for *theory*. I will highlight the Continuity vs. Operationalizability tension as the primary "impossible trinity" element, but also note the Sentience vs. Access tension.
      *   *Actually, looking closer:* The prompt asks to flag a subset that cannot be jointly satisfied.
      *   *Candidate:* **Evolutionary Continuity + High Epistemic Certainty + Operationalizability.** You can't have a smooth biological reality, absolute certainty about where consciousness starts, *and* a clear legal line.
      *   *Better Candidate for this context:* **Substrate Independence + Neural Specificity + Evolutionary Continuity.** If you demand specific neural structures (like a cortex), you violate substrate independence. If you demand substrate independence, you struggle with evolutionary continuity (when did the function emerge?).
      *   *Best Candidate for Policy:* **Evolutionary Continuity (Gradualism) + Binary Legal Status.** Nature doesn't do binaries; Law does. A theory satisfying strict continuity cannot provide a non-arbitrary binary line.

  6.  **Writing the Content (incorporating constraints):**
      *   Ensure "Non-negotiable" is reserved for things that make a theory useless for *this specific purpose* (welfare/policy), not just metaphysically wrong.
      *   Ensure theory families are named structurally.
      *   Ensure the one-sentence summary is punchy.

  7.  **Review against Constraints:**
      *   Table format? Yes.
      *   Motivation, Status, Threatened Families for each? Yes.
      *   Address specific issues (Evolution, Convergence, Behavior/Neural, Vertebrates, Sentience/Consciousness)? Yes.
      *   Flag unsatisfiable subset? Yes.
      *   One-sentence ending? Yes.

  8.  **Final Polish:** Check tone. Make sure "Non-negotiable" is justified by the *practical* goal (legislation), not just truth. For example, Panpsychism isn't "false," but it's "non-actionable" for welfare, so it fails the Operationalizability desideratum.

      *(Self-Correction during drafting)*: I need to be careful with "Non-negotiable." A theory could be true but useless for policy. The prompt asks for requirements for a theory *good enough to guide legislation*. So, "Actionability" is non-negotiable for *this purpose*, even if a metaphysically true theory lacks it. I will clarify this distinction in the Status column.

      *(Refining the "Unsatisfiable Subset")*: The strongest tension is between **Evolutionary Continuity** (consciousness is a gradient) and **Operationalizability** (legislation requires a threshold). A theory cannot be both biologically precise about gradualism and legally precise about thresholds without introducing arbitrariness. I will flag this.

      *(Refining Theory Families)*: Use standard names but ensure they map to the structural critique (e.g., "Mammal-Centric NCC Theories" instead of just "Neuroscience").

      *(Refining Sentience vs Consciousness)*: Make sure to distinguish Phenomenal Consciousness (what matters for welfare) from Access Consciousness (what matters for cognition).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  | Requirement | Motivation (Case/Argument/Fact) | Status | Threatened Theory Families |
