  ### Brainstorming Candidate Research Questions

  1.  **The Diagnostic Dissociation Question:** Do the standard Gricean diagnostics (cancellability, embeddability, calculability) always co-vary when applied to borderline cases of pragmatic enrichment, or do they systematically dissociate?
      *   *Focus:* Empirical/conceptual testing of the diagnostics themselves.
      *   *Risk:* Might remain negative (showing confusion) without offering a positive theoretical framework.

  2.  **The Tripartite Boundary Question:** Does positing a tripartite distinction (semantic content vs. pragmatic modulation vs. conversational implicature) explain the divergent behavior of diagnostics better than the binary said/implicated distinction?
      *   *Focus:* Ontological restructuring of content layers.
      *   *Risk:* Risks multiplying entities without necessity unless the diagnostics force the distinction.

  3.  **The Property Mapping Question:** Which specific theoretical properties (e.g., compositionality, intentionality, conventionality) are tracked by individual Gricean diagnostics, and does mapping them this way resolve the minimalist-contextualist stalemate?
      *   *Focus:* Methodological clarification linking tests to underlying properties.
      *   *Benefit:* Offers a constructive path forward by clarifying what the tests actually measure, allowing for a more nuanced interface model.

  **Selection:** I will proceed with **Option 3 (The Property Mapping Question)**. It is the most methodologically rigorous, avoids premature ontological commitment, and directly addresses the user's suspicion that diagnostics track different distinctions.

  ***

  ### Research Proposal: Mapping the Interface: Diagnostic Dissociation and the Semantics-Pragmatics Boundary

  **Project Summary**
  Contemporary debates in the philosophy of language regarding the semantics–pragmatics interface have reached a theoretical stalemate. Minimalists and Contextualists disagree on the extent of pragmatic enrichment in truth-conditional content, while proponents of the Grammatical View argue scalar implicatures are generated syntactically rather than pragmatically. Despite their differences, these positions share a critical, unexamined assumption: that the standard Gricean diagnostics—cancellability, embeddability, calculability, and non-detachability—track a single, unified boundary between what is said and what is implicated. This project challenges that orthodoxy. I hypothesize that these diagnostics are heterogeneous; they track distinct theoretical properties rather than a single semantic-pragmatic divide. By disentangling these diagnostics, this project aims to dissolve apparent contradictions in the literature and provide a refined framework for analyzing utterance content.

  **Research Question**
  The project is guided by a precise question: *To what extent do the standard Gricean diagnostics dissociate when applied to borderline cases of pragmatic enrichment, and can mapping each diagnostic to a specific theoretical property (e.g., compositionality, intentionality) resolve the stalemate between Minimalist and Contextualist accounts?*

  This question admits a determinate answer. Either the diagnostics co-vary across all tested phenomena, confirming the Orthodox Assumption, or they dissociate in predictable patterns, requiring a revision of the interface model. The project does not merely ask whether the current model is wrong, but specifically how the diagnostics map onto underlying linguistic and cognitive properties.

  **State of the Art and Gap**
  Current literature treats the diagnostics as a unified toolkit. Minimalists rely on embeddability to argue that pragmatic enrichment cannot affect truth conditions, while Contextualists point to non-cancellable enrichments to argue the opposite. Similarly, the Grammatical View leverages embeddability to argue for syntactic generation of implicatures. However, none of these positions adequately justify why embeddability should track the same boundary as cancellability. Recent work on embedded implicatures suggests these tests may conflict, but there is no systematic account of why this occurs or what it implies for the architecture of communication. Existing approaches leave open the possibility that we are asking a single question ("Is this said or implicated?") when we are actually asking multiple distinct questions ("Is this compositional?", "Is this intentional?", "Is this conventional?").

  **Methodology**
  The project will proceed in three concrete stages over twenty-four months.

  *Stage 1: Conceptual Audit (Months 1–6)*
  I will analyze the logical structure of each diagnostic to determine which theoretical property it necessarily detects. For example, cancellability arguably tracks defeasibility and speaker intentionality, whereas embeddability tracks compositionality and scope interaction. This stage involves no new linguistic data but rather a rigorous reconstruction of the inferential links between passing a test and possessing a property. This is preferred over purely exegetical reconstruction of Grice because Grice did not anticipate modern phenomena like embedded implicatures, rendering his original notes insufficient for contemporary debates.

  *Stage 2: Diagnostic Stress-Testing (Months 7–15)*
  I will apply this audit to three specific phenomena where the Orthodox Assumption strains: scalar implicatures under negation, free enrichment in attitude reports, and metaphorical content. For each phenomenon, I will record whether diagnostics co-vary. For instance, if a content component is embeddable but not cancellable, the Orthodox Assumption fails. This stage is preferred over immediate formal implementation because formal models require fixed parameters; without conceptual clarity on what the parameters represent, formalization risks precisifying the wrong distinctions.

  *Stage 3: Framework Construction (Months 16–24)*
  Based on the mapping from Stage 2, I will construct a multi-dimensional model of utterance content. Instead of a single boundary, the model will represent content along separate axes (e.g., compositional vs. non-compositional, intentional vs. conventional). I will then demonstrate how this model dissolves specific stalemates, such as the Contextualist objection to Minimalism regarding free enrichment.

  **Success and Failure Conditions**
  A successful result will consist of a demonstrated dissociation of at least two standard diagnostics across the test cases and a coherent multi-dimensional framework that accommodates this dissociation while preserving the explanatory power of Gricean pragmatics. Success is also measured by the resolution of at least one specific debate (e.g., providing a stable classification for embedded implicatures).

  The project would count as failing if the stress-testing reveals that diagnostics consistently co-vary across all test cases, confirming the Orthodox Assumption. While this would be a negative result for my hypothesis, it would still be a valuable contribution by empirically securing the foundations of current theory. However, given preliminary evidence of divergence in embedded contexts, this outcome is unlikely. A second failure condition would be producing a framework so complex that it loses predictive power; to avoid this, the model will be constrained by a principle of theoretical economy.

  **Scope and Feasibility**
  This scope is realistic for a two-year postdoc. It limits the empirical scope to three well-defined phenomena rather than attempting a comprehensive survey of all pragmatic effects. It avoids the trap of building a full formal semantics, focusing instead on the conceptual groundwork required before formalization. The output will be a monograph manuscript and two journal articles, ensuring tangible deliverables within the fellowship period. By focusing on the tools of the trade rather than advocating for one existing side, this project positions itself to make a neutral, methodological contribution acceptable to proponents across the debate.
