answer: |-
  # The 20-Minute Complexity Triage Protocol

  **Purpose:** To distinguish between "computationally feasible," "computationally expensive but manageable," and "theoretically impossible within constraints."
  **Audience:** Engineering Director (CS Undergrad background, rusty on theory).
  **Timebox:** 20 Minutes.

  This isn't about proving theorems. It's about resource accounting. Complexity theory tells us where the bill comes due. This procedure treats hardness not as a logical impossibility, but as a budget constraint. If the cost exceeds the budget (time, hardware, accuracy), the feature is a "No," regardless of how clever the code is.

  ---

  ## The Protocol: 6 Questions

  Ask these in order. If you get a "Stop" answer, end the meeting. If you get a "Handoff" answer, schedule a follow-up with Product/Lead. If you get through all six with "Pass," you can sign off.

  ### 1. What is $N$, and what happens when it grows 10x?
  *   **The Ask:** Define the input size ($N$). Is it users? Stops? Transactions? If $N$ doubles, does runtime double ($O(N)$), quadruple ($O(N^2)$), or explode ($O(2^N)$)?
  *   **Pass:** "It's linear or log-linear ($O(N \log N)$)." OR "It's quadratic, but $N$ is capped at 500 forever."
  *   **Stop:** "It's exponential or factorial, and $N$ isn't strictly bounded by hardware."
  *   **Handoff:** "We don't know the growth rate yet." (Send back to build a prototype).

  ### 2. Is this problem NP-Hard? If so, why are *our* instances easy?
  *   **The Ask:** Many problems (Routing, Scheduling, Clustering) are NP-Hard. This means worst-case is impossible. Teams often say, "But our data isn't worst-case."
  *   **Pass:** "Yes, it's NP-Hard, but we are using a known approximation algorithm with a bound (e.g., within 5% of optimal)." OR "We have empirical evidence from production logs that our specific data structure solves in polynomial time."
  *   **Stop:** "It's NP-Hard, but we'll just use a solver and it'll be fine." (Without evidence of easy instances).
  *   **Handoff:** "We think our data is special, but we haven't stress-tested against adversarial cases." (Require a load test before sign-off).

  ### 3. Do we need *Optimal*, or do we need *Valid*?
  *   **The Ask:** Are we looking for the *best* answer (Global Optimum) or just *a good* answer (Local Optimum/Feasible)?
  *   **Pass:** "A valid solution within 10% of optimal is fine."
  *   **Stop:** "We need the mathematically best answer every time, and the problem is NP-Hard." (This violates resource bounds).
  *   **Handoff:** "Product says they need optimal, but we think they'd accept near-optimal." (Send Product Lead to negotiate tolerance).

  ### 4. What is the cost of being wrong?
  *   **The Ask:** If the algorithm approximates, times out, or returns a sub-optimal result, what breaks?
  *   **Pass:** "The user sees a slightly less relevant recommendation," or "The truck takes a slightly longer route." (Soft failure).
  *   **Stop:** "The system crashes," "We violate a legal contract," or "We charge the customer incorrectly." (Hard failure on a probabilistic system).
  *   **Handoff:** "We don't know the downstream impact of a 5% error." (Send to Product/Risk).

  ### 5. Is the Objective Function Stable?
  *   **The Ask:** What are we optimizing? Is it a convex function (one valley) or non-convex (many valleys)? Can we calculate the gradient?
  *   **Pass:** "It's a standard loss function (MSE, Cross-Entropy) or a linear program."
  *   **Stop:** "We're adding constraints but we can't mathematically define how they change the objective landscape." (You cannot engineer convergence on an undefined surface).
  *   **Handoff:** "The objective changes based on user behavior." (Requires online learning review).

  ### 6. What is the Fallback?
  *   **The Ask:** If the solver hangs or hits the time limit, what does the user see?
  *   **Pass:** "We serve a cached result," "We use a greedy heuristic fallback," or "We queue it for async processing."
  *   **Stop:** "The request times out and returns an error."
  *   **Handoff:** "We haven't built a fallback yet." (Require fallback plan before merge).

  ---

  ## Running the Protocol: Three Proposals

  Here is how this plays out in your next three 1:1s.

  ### Proposal 1: The Route Optimizer
  **The Pitch:** "We can build a route optimizer for our delivery fleet. It takes all the stops for the day and computes the best path. We have a hard limit of 200 stops per driver."
  **Your Gut:** You *really* want this. Sales is begging for it. It's a competitive differentiator.

  *   **Q1 (N & Growth):** $N=200$ stops. Fixed cap. **Pass.**
  *   **Q2 (NP-Hard):** This is Traveling Salesperson (TSP). It is NP-Hard.
      *   *Team:* "Yes, but 200 is small."
      *   *You:* 200! is larger than the number of atoms in the universe. Exact computation is impossible.
      *   *Team:* "We'll use a heuristic."
      *   *You:* **Pass** (conditionally).
  *   **Q3 (Optimal vs. Valid):**
      *   *Team:* "Sales wants the *best* route to guarantee fuel savings."
      *   *You:* "Best" implies optimal. Heuristics give *near*-optimal.
      *   *Team:* "We can tune the solver to get close."
      *   *You:* **Stop.**
      *   *Reasoning:* You cannot guarantee optimality on an NP-Hard problem with $N=200$ in a production time window. If the requirement is "Best Route," the feature is mathematically impossible. If the requirement changes to "Efficient Route," it passes.
  *   **Decision:** **KILL (for now).**
  *   **Director's Note:** I know I want this feature. But the procedure caught a requirement ("Best") that violates complexity bounds. I am sending them back to Product to change the requirement to "Near-Optimal within 2 seconds." If Product refuses, the feature is dead.

  ### Proposal 2: User Clustering at Scale
  **The Pitch:** "We want to cluster our million-user dataset to find segments. We'll just use k-means. It's standard."
  **Your Gut:** Seems boring/standard. Low risk.

  *   **Q1 (N & Growth):** $N=1,000,000$. K-means is generally $O(N \cdot K \cdot I \cdot D)$. Linear in $N$. **Pass.**
  *   **Q2 (NP-Hard):** K-means optimization is NP-Hard in the general case.
      *   *Team:* "But Lloyd's algorithm converges fast on typical data."
      *   *You:* Do we have evidence?
      *   *Team:* "We ran it on a sample of 10k, it took 200ms."
      *   *You:* Scale that linearly. 1M should take 20 seconds. **Pass.**
  *   **Q3 (Optimal vs. Valid):** K-means finds local optima.
      *   *Team:* "We run it 10 times with different seeds and pick the best."
      *   *You:* **Pass.**
  *   **Q4 (Cost of Wrong):**
      *   *Team:* "If a cluster is slightly off, the marketing email is just less targeted."
      *   *You:* **Pass.** (Soft failure).
  *   **Q5 (Objective Stability):** Sum of squared distances. Convex-ish. **Pass.**
  *   **Q6 (Fallback):**
      *   *Team:* "If it times out, we use last week's clusters."
      *   *You:* **Pass.**
  *   **Decision:** **GO.**
  *   **Director's Note:** This is the "boring" case where theory aligns with practice. The procedure confirms it's safe, provided they actually implement the fallback.

  ### Proposal 3: Fairness Constraints on Recommendations
  **The Pitch:** "We need to add a fairness constraint to the recommendation model. We want to ensure demographic parity without tanking engagement."
  **Your Gut:** Ethically important. PR needs this.

  *   **Q1 (N & Growth):** Same as current model. **Pass.**
  *   **Q2 (NP-Hard):** Constrained optimization can be harder than unconstrained.
      *   *Team:* "It adds a layer to the loss function."
      *   *You:* **Pass** (for now).
  *   **Q3 (Optimal vs. Valid):**
      *   *Team:* "We need to satisfy the constraint strictly."
      *   *You:* **Pass** (assuming it's feasible).
  *   **Q4 (Cost of Wrong):**
      *   *Team:* "If we fail the constraint, we risk reputational damage."
      *   *You:* **Pass.**
  *   **Q5 (Objective Stability):**
      *   *You:* "How does this constraint change the objective function? Is it convex?"
      *   *Team:* "Honestly, we can't say exactly what it does to the objective. It depends on the data distribution."
      *   *You:* **Stop.**
      *   *Reasoning:* You cannot engineer a solver for an objective function you cannot define. If the team cannot articulate how the constraint modifies the loss landscape (e.g., does it introduce non-convexity? Discontinuities?), you cannot guarantee convergence. The model might oscillate or fail to train silently.
  *   **Q6 (Fallback):**
      *   *Team:* "If it doesn't converge, we just ship the old model."
      *   *You:* **Stop** (Reinforced).
  *   **Decision:** **KILL.**
  *   **Director's Note:** This is the "Values vs. Math" trap. We want fairness, but "we can't say what it does to the objective" is a confession that the math is undefined. You cannot code an undefined function. Send them to Research to formalize the math before Engineering touches it.

  ---

  ## The Blind Spots: What This Procedure Can't Catch

  This triage protects you from computational impossibility. It does not protect you from everything. Be aware of these four failure modes:

  1.  **The Data Lie (Garbage In):** The procedure assumes the input $N$ is real. If the team sandbags the input size ("It's only 10k rows" when it's actually 10M joined rows), the complexity math holds, but the premises are false. *Mitigation: Require access to production logs, not estimates.*
  2.  **The Integration Tax:** An algorithm might be $O(N \log N)$ in a Jupyter notebook but $O(N^2)$ in production because of database locking, serialization overhead, or network latency. This procedure tests logic, not architecture. *Mitigation: Require a load test in a staging environment that mirrors prod.*
  3.  **The Maintenance Trap:** A heuristic might work today but requires constant tuning as data drifts. The procedure says "Go," but three months later you're paying engineers to hand-tune parameters weekly. *Mitigation: Ask "Who owns tuning this in six months?"*
  4.  **The Ethical Black Box:** In Case 3, the math was undefined. Sometimes the math *is* defined, but the outcome is ethically disastrous (e.g., a perfectly efficient model that discriminates illegally). Complexity theory doesn't measure harm. *Mitigation: This is a Policy handoff, not an Engineering one.*

  ## Summary for Your Calendar

  *   **If they say "It's NP-Hard":** Ask for the Approximation Bound.
  *   **If they say "Our data is special":** Ask for the Stress Test.
  *   **If they say "We need the best answer":** Ask if they have infinite time.
  *   **If they say "We don't know the objective":** Send them to Research.

  Use this to protect your team from building things that cannot work, so they have time to build the things that can.
