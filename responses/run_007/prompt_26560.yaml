          *   If a claim is not integrable, standard risk-neutral valuation $E^Q[X]$ is not well-defined in the Lebesgue sense.
      *   **Hedging:**
          *   Superhedging price: $\inf \{ x : \exists H, x + (H \cdot S)_T \ge X \}$.
          *   Subhedging price: $\sup \{ x : \exists H, x + (H \cdot S)_T \le X \}$.
          *   If the claim has infinite positive and negative parts, these bounds might diverge.

