      *   **Expectation:** $E[X] = \sum_{n=1}^\infty 2^{-n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^\infty \frac{(-1)^{n-1}}{n} = \ln(2)$.
      *   **The Catch:** The series is *conditionally* convergent, not absolutely convergent ($\sum |X_n| P(N=n) = \sum \frac{1}{n} = \infty$).
      *   **Philosophical Issue:** By Riemann Rearrangement Theorem, the value depends on the order of summation. Since there's no natural temporal or causal ordering of "states of the world" in a static decision problem, the expected value is undefined.

  3.  **Translate to Mathematical Finance:**
      *   **Probability Space:** $(\Omega, \mathcal{F}, P)$. $\Omega = \mathbb{N}$, $\mathcal{F} = 2^\Omega$, $P(\{n\}) = 2^{-n}$.
