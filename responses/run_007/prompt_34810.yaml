answer: |-
  This is a fantastic objection. You have independently reconstructed one of the most famous and persistent critiques of Scanlonian contractualism, often called **"The Numbers Problem."** Philosophers like Frances Kamm, Michael Otsuka, and David McCarthy have pressed this exact point for decades.

  You haven't "broken" contractualism in the sense of finding a contradiction Scanlon was unaware of; he addresses this explicitly in *What We Owe to Each Other* (Chapter 5, specifically the section on "Numbers"). However, your intuition that there is a tension here is shared by many critics.

  The error in your derivation isn't in the logic of steps (1) through (9) *if* you assume the Rescue Case is identical to the Transplant Case. The break happens because Scanlon argues **the Rescue Case is structurally different from the Transplant Case**, and the "reasonable rejection" test yields a different result when viewed **ex ante** (before the event) rather than **ex post** (after the event).

  Here is where your argument diverges from Scanlon's solution, and how he attempts to avoid smuggling utilitarianism back in.

  ### 1. The Disanalogy: Means vs. Opportunity (Steps 3 vs. 4)
  Your argument treats the Transplant Case (Step 3) and the Burning Building Case (Step 4) as identical tests of aggregation. Scanlon argues they are not.

  *   **Transplant Case:** The healthy victim is being *used* as a means. He is being subjected to a harm he would not otherwise face to benefit others. His complaint is not just "I die," but "I am being violated." This is a very strong ground for reasonable rejection.
  *   **Burning Building Case:** The person on the left is not being *used*. They are already in peril. The rescuer is not *causing* their death; they are failing to prevent it. The complaint is purely about the *loss of life*, not about bodily integrity or being used instrumentally.

  This weakens the "strength" of the complaint in the Rescue Case compared to the Transplant Case. But this alone doesn't solve the numbers problem. It just explains why the one person doesn't have a *trump card*. It doesn't explain why the five win.

  ### 2. The Ex Ante / Veil of Ignorance Move (Fixing Step 6)
  This is the core of Scanlon's solution. Your Step (6) assumes the "reasonable rejection" test is applied **ex post**: *Given that I am the one on the left, can I reject this principle?*

  Scanlon argues the test must be applied **ex ante**: *Given that I could be anyone in this situation, can I reject this principle?*

  In *What We Owe to Each Other*, Scanlon argues that principles are chosen from a position where we don't know who we will be.
  *   **Principle P ("Save the Larger Group"):** If you agree to this, and you turn out to be in the larger group, you live. If you turn out to be in the smaller group, you die. Your statistical chance of survival is maximized.
  *   **Principle R ("Flip a Coin" / "Save the Smaller Group"):** If you agree to this, your statistical chance of survival is lower (or equal, in a coin flip).

  Scanlon argues that the single person on the left **cannot reasonably reject Principle P** because, from an ex-ante perspective, Principle P is the one that best protects *their own* interest in survival. To reject P would be to insist on a principle that lowers everyone's (including their own) ex-ante probability of being rescued.

  Therefore, the complaint in Step (6) ("P tells you to let me die") is not sufficient for *reasonable* rejection, because a "reasonable" person considers the generic interest in having a principle that maximizes survival chances for all.

  ### 3. Does This Smuggle Aggregation In? (Addressing your worry)
  You asked: *"I can't see how that doesn't just smuggle aggregation back in through the back door."*

  This is the million-dollar question. Scanlon insists it does not, but critics disagree. Here is the distinction Scanlon draws:

  *   **Utilitarian Aggregation:** Sums *value*. "5 lives create more utility than 1 life." The individual disappears into the total.
  *   **Scanlonian Counting:** Counts *claims*. "There are 5 distinct claims to be saved on the right, and 1 distinct claim on the left. All claims are equal. I have a duty to respond to claims. I can respond to 5 or I can respond to 1. I should respond to the greater number of equal claims."

  Scanlon argues this isn't aggregating *goodness*, but rather acknowledging the **burden of principles**.
  *   If we adopt the principle "Save the One," the burden (death) falls on 5 people.
  *   If we adopt the principle "Save the Five," the burden (death) falls on 1 person.
  *   Since the burden is identical (death) for each individual, a principle that distributes that burden to fewer people is less "burdensome" generically.

  He argues this respects the individualist restriction because we are still looking at the burden on *each* person. We aren't saying "5 lives > 1 life." We are saying "A world where 5 people die is a world where the principle 'save the few' has imposed a fatal burden on 5 individuals. A world where 1 person dies is a world where the principle 'save the many' has imposed a fatal burden on 1 individual. The latter principle is less rejectable."

  ### 4. Where Your Argument Goes Wrong (Step 8)
  Your Step (8) concludes: *"So no principle permitting either choice passes the test. Both choices are wrong."*

  Scanlon would reject this. He argues that **Principle P ("Save the Larger Group") passes the test.**
  *   Can the one person reasonably reject it? **No**, because (as per the ex-ante argument) it maximizes their survival odds, and they cannot claim their life is more valuable than the others.
  *   Can the five people reasonably reject the alternative (Save the One)? **Yes**, each of them individually can say, "Why should I die when you could save me and four others without costing the one person anything *extra*?" (The one person dies either way in the choice between saving 1 vs saving 5? No, wait. In the choice between saving 1 vs saving 5, if you save the 1, the 5 die. If you save the 5, the 1 dies.)

  The crucial Scanlonian move is that the five have a **stronger individual reason** to reject the principle "Save the One" than the one has to reject "Save the Five."
  *   **The One's Reason:** "I die."
  *   **The Five's Reason:** "I die, *and* four others die unnecessarily."

  Wait, that sounds like aggregation again. The cleaner Scanlonian formulation is: The one person cannot claim priority. Since all lives are equal, and a choice must be made, the principle that respects the equality of all lives best is the one that saves the most lives. To insist on a coin flip is to treat the five as if their claims don't matter *more* collectively, but Scanlon argues it's about **not wasting the opportunity to fulfill equal duties.**

  ### Summary
  You haven't broken contractualism, but you have identified its hardest edge.
  1.  **The Paralysis Conclusion is False:** Scanlon explicitly argues saving the greater number is *required* (or at least clearly permissible), not wrong.
  2.  **The Mechanism:** He avoids utilitarian aggregation by using an **ex-ante probabilistic argument** (everyone wants the rule that saves the most lives because it might be them) and a **claims-based argument** (fulfilling 5 equal duties is better than fulfilling 1, without summing value).
  3.  **The Tension:** You are right to feel uneasy. Many philosophers argue Scanlon *fails* to fully escape aggregation here. But his defense is that he is aggregating *claims to aid*, not *units of welfare*, which preserves the separateness of persons.

  **Recommendation for your debate:**
  Tell your roommate that Scanlon distinguishes between **aggregating welfare** (utilitarianism) and **counting claims** (contractualism). In the burning building, you aren't killing the one to save the five (which violates the "no means" constraint); you are failing to save the one because you are fulfilling five other equal duties. The "reasonable rejection" test is passed because no one, behind a veil of ignorance, would agree to a rule that lowers their survival chances in a rescue scenario.

  If you want to press the attack, look up **"Michael Otsuka's critique of Scanlon on numbers."** Otsuka argues that even Scanlon's view implies a form of aggregation that violates the individualist restriction. But for the purpose of your triage protocol argument, Scanlon provides enough cover to justify saving the five without becoming a utilitarian.
