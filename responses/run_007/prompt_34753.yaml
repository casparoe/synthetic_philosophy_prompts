answer: |-
  **The Scenario**

  A regional health authority must allocate a fixed budget between two mutually exclusive programs affecting three distinct patient cohorts: the *Critically Ill* (chronically bedridden), the *Moderately Impaired* (limited mobility), and the *Generally Healthy* (routine care). **Policy A** prioritizes intensive life-support for the Critically Ill, yielding 4 welfare-adjusted life years (WALYs) for them, 10 WALYs for the Moderately Impaired, and 15 WALYs for the Generally Healthy. **Policy B** redirects funds to mass preventative care, reducing life-support for the Critically Ill to 3 WALYs, but raising the Moderately Impaired to 40 WALYs and the Generally Healthy to 45 WALYs. In both scenarios, the Critically Ill remain the worst-off group (3 or 4 WALYs versus much higher figures for others), yet Policy A benefits the worst-off slightly while Policy B sacrifices them to generate massive gains for the better-off groups.

  ***

  **1. Reasoning and Numerical Demonstration**

  **Maximin** evaluates policies solely by the welfare of the worst-off group. Under Policy A, the minimum welfare is 4 (Critically Ill); under Policy B, it is 3. Since $4 > 3$, Maximin strictly mandates **Policy A**. It is indifferent to the 30+ WALY gains enjoyed by the other two groups because those groups are not at the minimum.

  **Prioritarianism** maximizes the sum of a concave transformation of welfare, $W = \sum f(w_i)$. It acknowledges the moral urgency of the Critically Ill's loss but aggregates it against the gains of others. Using a standard concave function like the square root ($f(w) = \sqrt{w}$):
  *   **Policy A Score:** $\sqrt{4} + \sqrt{10} + \sqrt{15} \approx 2.00 + 3.16 + 3.87 = \mathbf{9.03}$
  *   **Policy B Score:** $\sqrt{3} + \sqrt{40} + \sqrt{45} \approx 1.73 + 6.32 + 6.71 = \mathbf{14.76}$

  Even with a more sharply concave function like the natural log ($f(w) = \ln(w)$):
  *   **Policy A Score:** $\ln(4) + \ln(10) + \ln(15) \approx 1.39 + 2.30 + 2.71 = \mathbf{6.40}$
  *   **Policy B Score:** $\ln(3) + \ln(40) + \ln(45) \approx 1.10 + 3.69 + 3.81 = \mathbf{8.60}$

  In both cases, the aggregated, priority-weighted gains of the better-off groups outweigh the priority-weighted loss of the worst-off. Prioritarianism mandates **Policy B**, directly opposing Maximin.

  **2. The Structural Feature**

  The divergence is driven by **additive separability across persons**. Maximin is non-separable; it treats the welfare of the worst-off as a lexical constraint that cannot be traded off against the sum of others' welfare. Prioritarianism is separable; it assigns a marginal moral weight to every unit of welfare gained or lost, regardless of who holds it, provided the weight is a function of their absolute level. In this case, the structural feature is that the *sum of the weighted gains* for the non-worst-off groups exceeds the *weighted loss* of the worst-off group. Maximin ignores the "sum" entirely; Prioritarianism counts it.

  **3. Convergence if Feature is Removed**

  If we remove the additive separability feature by eliminating gains to the non-worst-off groups (setting Policy B's outcomes for Groups 2 and 3 equal to Policy A's), the views converge. If Policy B yielded 3 WALYs for the Critically Ill but *no gain* for the others (10 and 15 WALYs), Prioritarianism would also choose Policy A. The loss to the worst-off would be weighted heavily, and with no compensating gains elsewhere to sum, the total priority-weighted welfare would drop. Both views would agree that harming the worst-off for no benefit is impermissible. They converge on the verdict that Policy A is superior when there are no aggregate gains to offset the floor reduction.

  **4. Prioritarian Resistance**

  A sophisticated prioritarian would not reject the math but would challenge the **metric and the curvature**. They might argue that "welfare-adjusted life years" fails to capture the true moral urgency of the Critically Ill. If the Critically Ill are near a subsistence threshold of dignity, the priority weighting function $f(w)$ should not be merely concave (like log or sqrt) but **lexical** or asymptotic at the bottom. If the slope of $f(w)$ approaches infinity as $w$ approaches a critical minimum, the loss of that 1 WALY would generate infinite moral disvalue, making Policy B impermissible even for a prioritarian. Alternatively, they might argue that the groups are not fixed: if there is ex-ante uncertainty about who ends up in the Critically Ill group, ex-ante prioritarianism might favor Policy A because it reduces the risk of catastrophic outcomes for any individual, regardless of the ex-post sum.

  **5. Vulnerability or Feature?**

  This case reveals a **feature**, not a vulnerability, though it is a controversial one. Prioritarianism is explicitly designed to avoid the rigidness of Maximin while retaining sensitivity to the worse-off. It acknowledges that sufficiently large gains to many can outweigh small losses to the few, even if the few are worse off. The case teaches us that "giving priority to the worse-off" is not synonymous with "veto power for the worse-off." It clarifies that Prioritarianism remains a form of aggregative consequentialism; it softens utilitarianism but does not abolish the trade-off structure. The lesson is that any view permitting aggregation (unlike Maximin) must accept the possibility of the worst-off being sacrificed for the greater good, provided the "greater good" is weighted heavily enough by the priority function.
