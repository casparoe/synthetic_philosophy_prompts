answer: |-
  **Dependency Structure**
  1.  **Supertask Coherence (mins 0–10):** Establish that completing $\aleph_0$ actions in finite time is mathematically coherent. Leverage their Zeno knowledge: just as infinite intervals sum to finite time, infinite actions can fit in finite time.
      *   *Why first?* If students reject the task as impossible (Zeno residue), the state problem never arises. You must grant the completion to interrogate the outcome.
  2.  **Sequence vs. Limit (mins 10–25):** Distinguish the limit of the *time series* (convergent) from the limit of the *state sequence* (oscillating).
      *   *Why here?* Students conflate the convergence of time with the convergence of states. They assume because the time arrives, the state must settle. This distinction must be broken before asking about the final state.
  3.  **Logical Underdetermination (mins 25–40):** Demonstrate that no rule in the description assigns a value at the limit time.
      *   *Why last?* Only after accepting the task and distinguishing sequence/limit can they see the gap is logical, not physical.

  **The Carrier Example**
  Use the Lamp.
  *   **Must have:** Binary exclusivity (On $\neq$ Off), a deterministic toggling rule, and a defined finish time.
  *   **Must lack:** Physical decay, inertia, or causal continuity beyond the toggle.
  *   **Why?** Physical details invite "it burns out" objections. We need a logical gap, not a physical failure. The lamp is abstracted to a boolean variable.

  **Misconception Map**
  1.  **Physical Impossibility (Pre-existing):** "You can't move that fast."
      *   *Head off (Min 5):* Stipulate idealized conditions. This is metaphysics, not engineering.
  2.  **Convergent States (Exposition-induced):** "The time series sums, so the state must settle."
      *   *Head off (Min 20):* Explicitly contrast convergent *times* with oscillating *states*. Show $1, 0, 1, 0...$ has no limit.
  3.  **Epistemic Humility (Exposition-induced):** "We just don't know the state."
      *   *Head off (Min 35):* Emphasize that *nothing* knows, because nothing determines it. The problem is ontological underdetermination, not ignorance.

  **Final Checking Question**
  "If you claim the lamp is Off at $t=1$, which specific premise in the supertask description forces that outcome over On?"
  *   **Why?** It forces them to search for a logical entailment that does not exist. If they cannot cite a premise, they grasp that the description is incomplete, not that the state is hidden.

  **What to Leave Unsettled**
  Refuse to settle whether supertasks are metaphysically possible.
  *   **Why?** The lesson targets *description*, not *modality*. If you argue possibility, students focus on physics/causation. Leaving it open forces them to sit with the logical gap: *Even if* possible, the description fails. This isolates the conceptual problem from ontological commitment.
