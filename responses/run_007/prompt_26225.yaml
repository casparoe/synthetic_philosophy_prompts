          *   *Exposition-induced:* "It's flickering too fast to see" (epistemic limit vs. ontological indeterminacy), "It depends on the mechanism" (causal explanation).
          *   *Timing:* Head off "can't finish" immediately via Zeno connection. Head off "math = physics" when defining the limit. Head off "mechanism" when discussing the final state.

      *   **Final Question:**
          *   Needs to test underdetermination.
          *   Draft: "If I add a rule that the lamp is On at the end, does that contradict the switching sequence?" (Too easy).
          *   Draft: "Why can't we calculate the state?" (Too epistemic).
          *   Better: "If the description determines the state, what specific premise tells us whether it is On or Off at $t=1$?" (Forces them to look for the missing logical link).

      *   **Unsettled Issues:**
          *   Whether supertasks are metaphysically possible.
          *   Why? Because the lesson is about *description*, not *possibility*. Resolving possibility distracts from the logical gap.

  4.  **Refining and Editing (Word Count Check):**

