      *   **Constraints:**
          *   Do *not* explain Thomson's lamp to me (the AI).
          *   Plan *how* to explain it to them.
          *   Provide dependency structure (idea ordering & justification).
          *   Identify the "carrier" example (is it the lamp? what must it have/lack?).
          *   Map misconceptions (pre-existing, exposition-induced, when to head off).
          *   Provide one final checking question (tests grasp of underdetermination, not retelling).
          *   Specify what to leave unsettled (and why).
          *   Word limit: Max 800 words.

  2.  **Deconstruct the Content:**
      *   **Topic:** Thomson's Lamp (Supertasks, Underdetermination).
      *   **Goal:** Show that the description fails to determine the state, not that we don't know the state.
      *   **Structure:** Dependency, Carrier, Misconceptions, Final Question, Unsettled Issues.

  3.  **Drafting - Section by Section:**

      *   **Dependency Structure:**
          1.  *Supertask Definition:* Must establish completion of infinite steps in finite time (builds on Zeno knowledge).
          2.  *State Function:* Define the lamp's state at any step $n$ (On/Off).
          3.  *Limit vs. Value:* Distinguish the limit of the sequence of states from the state at the limit time. This is crucial. Students know series sum to finite values; they might think states converge too.
          4.  *Underdetermination:* Show no logical rule connects the sequence to the final state.
          *Why this order?* You can't discuss the final state's indeterminacy without first defining the task and distinguishing the sequence from the limit point. If you start with the paradox, they'll focus on physics.

      *   **The Carrier Example:**
          *   Stick with the Lamp.
          *   *Must have:* Binary states (On/Off), clear switching rule (toggle), finite time completion.
          *   *Must lack:* Physical constraints (wear/tear, speed of light), causal history beyond the toggle rule.
          *   *Why?* Physical constraints invite engineering objections (it breaks). We need logical impossibility/underdetermination, not physical impossibility.

      *   **Misconceptions:**
