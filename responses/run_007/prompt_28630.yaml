          *   *Weakness:* Risks conflating "why we pick this omission" with "why this omission is causal."

      *   *The "Hope Nobody Asks":* Needs to cut deep. Maybe about the positive/negative distinction itself. Or about whether the view actually solves the problem of profligate omissions without reintroducing causation through the back door. Let's go with the "Causal Structure of Norms" question. If norms determine the cause, isn't there a causal link between the norm and the attribution? Or better: "Doesn't your view make legal reasoning dishonest?"

  6.  **Refining the Tone:**
