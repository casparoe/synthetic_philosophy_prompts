      *   *Counterfactual Dependence:* If the lifeguard *had* acted, the swimmer would live. That looks like causation.
      *   *Normative Circularity:* You say it's normative, but isn't the *selection* of which omissions matter dependent on causal structures?
      *   *Metaphysical:* Process theories struggle with prevention too. Is prevention real causation?
      *   *Semantic:* We talk about omissions as causes all the time. Are we all just wrong?
      *   *The "Hope Nobody Asks":* Something that undermines the core distinction or exposes a fatal flaw in the alternative proposal.

  4.  **Select and Order Objections (by Damage Level):**
