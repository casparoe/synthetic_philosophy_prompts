answer: |-
  # Q&A Prep Sheet: Causation by Omission as Normative Attribution

  **Context:** Workshop in Legal Theory
  **Thesis:** Omissions are not metaphysical causes; they are normative responsibility judgments.
  **Audience:** Legal philosophers/Tort scholars (skeptical), Metaphysicians (mixed).

  ---

  ### 1. The "Collapse of Liability" Objection (Most Damaging)
  **Who:** Senior Tort Law Scholar
  **Phrasing:** "If we accept your thesis, the structure of negligence liability collapses. In tort law, causation is a distinct element from duty and breach. We need to know that the breach *caused* the harm, not just that there was a breach. If omissions aren't causes, then in every non-feasance case, the causation element is unsatisfied. Are you arguing that no one should ever be liable for an omission, or are you asking courts to lie and call responsibility 'causation'?"

  **2-Minute Reply:**
  "I am not arguing for the abolition of liability for omissions, but for a clarification of its structure. Currently, the law conflates two questions: 'Did the defendant's conduct physically produce the harm?' and 'Is the defendant the appropriate party to bear the loss?' My claim is that in omission cases, the first question is always 'no,' so the inquiry collapses entirely into the second.
  This doesn't collapse liability; it streamlines it. We already limit omission liability via the 'duty of care' requirement. A passerby has no duty; a lifeguard does. On my view, this duty *constitutes* the causal link. We should be honest that when we find a lifeguard liable, we aren't finding a metaphysical connection between their stillness and the death; we are enforcing a normative expectation. This prevents the fiction that the lifeguard's stillness exerted physical force on the swimmer. It keeps 'causation' for positive acts and uses 'imputation' for omissions, preserving the integrity of both concepts."

  **Honest Weakness:**
  This is the hardest sell. Legal scholars rely on causation as a control mechanism to limit liability (proximate cause). If you remove causation from omissions, you fear they think you remove the *limit*. You need to assure them that "normative attribution" has strict limits, or they will think you are opening the floodgates to liability.

  ---

  ### 2. The "Counterfactual Dependence" Objection (High Damage)
  **Who:** Metaphysician of Causation (Sympathetic to Counterfactual Theories)
  **Phrasing:** "You rely on production or mechanism accounts to rule out omissions. But the dominant view in both law and metaphysics is counterfactual dependence. If the lifeguard *had* jumped in, the swimmer would have lived. The death counterfactually depends on the failure to jump. Why isn't that sufficient for causation? To deny this is to deny the 'but-for' test that underpins actual legal practice."

  **2-Minute Reply:**
  "Counterfactual dependence is necessary for causation, but it is not sufficient. If we treat it as sufficient, we face the problem of profligate omissions. The swimmer's death also counterfactually depends on Beyoncé not jumping in to save them. On a pure counterfactual view, Beyoncé is a cause of the death. We intuitively reject this because Beyoncé lacks a normative connection to the swimmer.
  Since we must use normative criteria to filter the infinite list of counterfactually dependent omissions down to the 'relevant' ones (like the lifeguard), the work is being done by the norm, not the counterfactual relation. The counterfactual tells us what *could* have prevented the harm; the norm tells us which prevention was *required*. Only the latter justifies calling it a cause in a legal context."

  **Honest Weakness:**
  Many metaphysicians believe counterfactual dependence *is* sufficient for causation. You are asserting a distinction (necessary vs. sufficient) that they may simply reject. If they hold a Lewisian view, your "profligate omissions" point looks like a feature, not a bug, to them.

  ---

  ### 3. The "Arbitrary Selection" Objection (Moderate Damage)
  **Who:** Legal Philosopher
  **Phrasing:** "You say we select the lifeguard's omission based on norms. But isn't the selection of *which* omission is the cause often based on causal salience? We pick the lifeguard over Beyoncé because the lifeguard was *there*. Isn't spatial-temporal proximity a causal fact, not a normative one? So you can't purge causation from the analysis entirely."

  **2-Minute Reply:**
  "Proximity is a physical fact, but it is not a *causal* fact in the sense of production. Being 'there' doesn't generate the death; the drowning does. Proximity is merely a condition for the *assignment of duty*. We assign duties based on proximity because it makes rescue feasible.
  So, while physical facts inform the normative judgment, they do not constitute the causation. The physical fact is: 'The lifeguard was near the water.' The causal fact is: 'The water entered the lungs.' The link between them is: 'The lifeguard ought to have intervened.' The 'cause' of the liability is the 'ought,' not the 'was.' My view accommodates the physical facts as preconditions for responsibility without mislabeling them as causal mechanisms."

  **Honest Weakness:**
  This risks splitting hairs. If physical proximity is a necessary condition for the "cause" (in the legal sense), the distinction between "causal precondition" and "cause" might look verbal rather than substantive to the audience.

  ---

  ### 4. The "Ordinary Language" Objection (Low Damage)
  **Who:** General Philosopher
  **Phrasing:** "This seems revisionist. In ordinary language, and in legal statutes, we say 'the lack of water caused the plant to die.' If your metaphysics tells you that's false, isn't that a reductio of your metaphysics? Why privilege a specific production theory over how we actually use the concept?"

  **2-Minute Reply:**
  "Ordinary language is a guide to our concepts, but it is not infallible, especially in technical contexts like law and science. We also speak of the 'sun rising,' but we know the earth rotates. In legal theory, precision matters because liberty and compensation are at stake.
  If we treat omissions as genuine causes, we obscure the moral reasoning involved. We pretend the judgment is empirical when it is actually evaluative. My view is revisionist, yes, but it is motivated by the need to prevent courts from hiding normative decisions behind a veil of pseudo-scientific causal language. It is better to be precise and revisionist than vague and misleading."

  **Honest Weakness:**
  Legal scholars hate being told their ordinary usage is "folk error." This reply might come off as arrogant. It frames the scholars as confused about their own practice.

  ---

  ### The Question I Am Hoping Nobody Asks

  **Who:** Sharp Legal Theorist / Metaphysician Hybrid
  **Phrasing:** "You argue that we select the relevant omission based on normative duties. But to have a duty to prevent X, X must be a foreseeable result of your inaction. Doesn't determining foreseeability require a prior causal model of the world? If you need causal facts to determine the normative duty, and the normative duty to determine the 'cause,' aren't you caught in a circle? Or worse, aren't you just pushing the causal question back one step without solving it?"

  **Why I fear this:**
  This attacks the independence of my normative account. If norms depend on causal predictions (e.g., "I have a duty to save you *because* my action would cause your survival"), then causation is still doing the heavy lifting. It suggests my view isn't an *alternative* to causal accounts, but a parasitic one that cannot function without the very causal realism it denies. Admitting this undermines the core metaphysical claim; denying it makes the normative account look ungrounded.
