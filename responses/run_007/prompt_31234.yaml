answer: |-
  This is a remarkably precise description of the actual sociology and epistemology of high-energy physics and cosmology. You have essentially rediscovered the "Duhem-Quine thesis" as managed by a specific set of methodological norms.

  Your observation highlights a gap between *logic* (a contradiction implies falsity) and *method* (a contradiction implies a search for error sources). Below is a reconstruction of the implicit theory your field's practices presuppose, an analysis of its philosophical underdetermination, and a contrast with naive falsificationism.

  ### 1. Reconstruction of the Implicit Theory

  The practices you describe presuppose a **Meta-Methodological Theory of Resource Allocation under Holistic Uncertainty.** It is not merely a theory of truth, but a theory of how to manage epistemic risk and community effort over time.

  We can reconstruct its axioms as follows:

  1.  **Holism (The Duhem-Quine Axiom):** Empirical tests do not confront a central theory ($T$) in isolation, but a conjunction ($T \land A_1 \land A_2 \dots \land E$), where $A$ are auxiliary assumptions and $E$ describes the experimental setup. A negative result ($\neg O$) logically falsifies the conjunction, not $T$ specifically.
  2.  **Epistemic Conservation (The Inertia Axiom):** $T$ possesses a high "resistance to rejection." This resistance is proportional to $T$'s past success and centrality. It is rational to exhaust the falsifiability of $A$ and $E$ before targeting $T$.
  3.  **The Anti-Ad Hoc Constraint:** Modifications to $A$ are permissible only if they increase the empirical content of the system (i.e., they yield novel predictions independent of the anomaly they resolve).
  4.  **The Lifecycle Thesis:** Research enterprises undergo phases. In a **Progressive Phase**, anomalies are absorbed by $A$ while $T$ generates novel predictions. In a **Stagnant/Degenerating Phase**, $A$ becomes increasingly complex without yielding novel predictions.
  5.  **The Meta-Heuristic of Funding:** Community resources should track the Lifecycle. In the Progressive Phase, resources protect $T$ and refine $A$. In the Degenerating Phase, resources should shift to rival programmes or challenges to $T$, even absent a *crucial experiment*.

  ### 2. Required vs. Compatible Elements

  To answer your specific question on what is *presupposed* versus what is merely *compatible*:

  **Strictly Required by the Practice:**
  *   **Holism:** Without this, the practice of checking auxiliaries before the core is irrational. If $T$ were tested in isolation, checking calibration would be a delay tactic, not a methodological necessity.
  *   **A Criterion of Progressiveness:** The prohibition on *ad hoc* patches requires a definition of "progress." The practice requires that "saving the phenomenon" is insufficient; "predicting new phenomena" is necessary.
  *   **A Meta-Inductive Judgment:** The funding shift implies that the community believes it can detect "stagnation" before "falsification." This requires the belief that research programmes have detectable health metrics (e.g., ratio of post-hoc fixes to novel predictions).

  **Merely Compatible (Philosophical Interpretations):**
  *   **Lakatosian Ontology:** The practice fits Lakatos's "Hard Core" and "Protective Belt" perfectly, but the practice does not *require* that scientists view the core as *irrefutable by convention* (Lakatos's view). They might view it as merely *highly probable*.
  *   **Bayesian Priors:** The behavior is compatible with the core having a prior probability near 1. However, the practice does not require subjective probabilities; it could be based on objective track records.
  *   **Popperian Conventionalism:** Popper argued we *decide* when to falsify. Your practice suggests this decision is governed by objective markers of stagnation (predictive failure), not just a arbitrary convention.

  ### 3. Philosophical Underdetermination

  You asked where the practice is philosophically underdetermined. There are three major frameworks that license this exact behavior but disagree on *why* it is rational.

  **A. Lakatos (Methodological Falsificationism)**
  *   *Justification:* The "Hard Core" is protected by a **Negative Heuristic** (a methodological rule, not a truth claim). We protect it to allow the programme time to unfold.
  *   *Fit:* Excellent. Specifically explains the funding shift (degenerating problemshift).
  *   *Gap:* Lakatos admits there is no instant rationality to overthrowing a programme; it can take centuries. Your practice implies a faster, community-based detection of stagnation.

  **B. Bayesian Confirmation Theory**
  *   *Justification:* The Core ($T$) has a very high prior $P(T)$. An anomaly lowers the posterior $P(T|E)$, but because $P(A)$ (auxiliaries) is often lower or more uncertain, Bayes' theorem dictates that $P(A)$ should take the bigger hit initially. *Ad hoc* adjustments are penalized via Bayesian Occam's Razor (they add parameters without increasing likelihood). Funding shifts occur when the Expected Utility of working on $T$ drops below working on $T'$.
  *   *Fit:* Excellent for individual belief updating.
  *   *Gap:* Pure Bayesianism is often individualistic. It struggles to explain the *normative* force of peer review ("you *must* test the calibration first") without adding social utility functions.

  **C. Kuhnian Normal Science**
  *   *Justification:* The Core is a "Paradigm." Anomalies are "puzzles." You don't falsify a paradigm with a puzzle; you only abandon it during a "Crisis."
  *   *Fit:* Explains the protection of the core.
  *   *Gap:* Kuhn suggests transitions are somewhat irrational/sociological. Your description of "testable adjustments" and "new successful predictions" is more rationalist (Lakatosian) than Kuhnian. Kuhnians might not agree that "stagnation" is objectively detectable enough to guide funding panels.

  **The Underdetermination Point:**
  The practice does not distinguish between **"The core is probably true" (Bayesian)** and **"The core is methodologically immune to foster growth" (Lakatos).** Both produce the same behavior: don't touch the core yet. The practice is underdetermined regarding the *ontological status* of the core.

  ### 4. Internal Consistency

  Is the ensemble consistent?
  **Yes, provided the "Lifecycle Thesis" is accepted.**

  There is an apparent tension between:
  1.  *Norm:* Do not challenge the core (Protection).
  2.  *Norm:* Fund challenges to the core (Innovation).

  This is resolved temporally.
  *   **Time $t_1$ (Progressive):** Anomalies are noise or auxiliary failures. Challenging the core is a waste of resources (low expected utility).
  *   **Time $t_2$ (Stagnant):** Anomalies accumulate, and auxiliary fixes become baroque. Challenging the core is high risk but high reward (necessary for progress).

  **Potential Inconsistency:** The "Lag Problem."
  Lakatos admitted that there is no rational criterion for *exactly when* a programme has degenerated. If Funding Panel A thinks the programme is Progressive, and Panel B thinks it is Degenerating, the norms conflict. Your field manages this by relying on a consensus metric (e.g., "How many parameters did we add in the last 5 years without a new discovery?"). As long as the community agrees on the metrics of stagnation, the norms are consistent.

  ### 5. Contrast with Straightforward Falsificationism

  If your field adopted a "Straightforward Falsificationism" (Naive Popperianism) where every failed prediction counts directly against the core ($T \land A \to O$; $\neg O \vdash \neg T$), the day-to-day norms would change drastically:

  1.  **Collapse of Stability:** Every statistical fluctuation or detector glitch would theoretically require a revision of the central theory. Since $T$ is part of the falsified conjunction, logic alone doesn't save it. Without the *methodological rule* to blame $A$ first, $T$ is logically vulnerable immediately.
  2.  **Proliferation of Theories:** Since $T$ is falsified by the first robust anomaly, funding would fragment immediately into multiple rival cores. You would not have one Standard Model with auxiliary tweaks; you would have fifty rival cores each trying to explain the one anomaly.
  3.  **End of "Calibration" Work:** Checking calibration assumes the theory is right and the machine is wrong. Under naive falsification, checking calibration assumes the machine is right and the theory is wrong. The epistemic priority flips.
  4.  **No "Ad Hoc" Distinction:** In naive falsification, a theory is either true or false. Complex auxiliary patches wouldn't be judged on "progressiveness," only on logical consistency. A theory saved by 20 parameters would be treated the same as a theory saved by 0, provided it fits the data.
  5.  **Funding Chaos:** Funding panels could not justify long-term investment in a central theory. As soon as an anomaly appeared, the grant for the central theory would be logically invalid. Science would become a series of short-term sprints rather than long-term programmes.

  ### Summary

  Your field's practice presupposes a **Sophisticated Methodological Falsificationism** (strongly Lakatosian) operationalized through **Bayesian Resource Allocation**.

  *   It **requires** Holism (to justify checking auxiliaries).
  *   It **requires** a Progressiveness Criterion (to ban *ad hoc* patches).
  *   It **requires** a Meta-Inductive capacity (to detect stagnation for funding).
  *   It is **compatible** with Lakatos (methodological rules), Bayesianism (probability updates), and even a pragmatic Kuhnianism (puzzle solving), leaving the *ultimate justification* underdetermined.
  *   It is **internally consistent** only if the community accepts that research programmes have lifecycles that can be monitored.

  You are effectively practicing "Lakatosianism without the label." You protect the hard core not because you think it is infallible, but because you recognize that scientific progress requires a stable platform from which to measure deviations. You abandon it not when it is logically falsified, but when it ceases to be a fertile ground for discovery.
