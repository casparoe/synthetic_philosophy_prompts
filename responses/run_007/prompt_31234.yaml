prompt: |-
  For most of my career I worked as an experimental physicist, and I have only lately begun to read philosophy of science in a systematic way. Lakatos's account of research programmes has been on my desk, and it has made me want to get clear about something I repeatedly observed in the working life of my field but never articulated.

  The practice I have in mind, described as neutrally as I can, is this. When a mature experimental field obtains a result that conflicts with a well-established central theory, the community's first response is almost never to treat the central theory as falsified. The standard sequence is to question the experiment, then the analysis, then the auxiliary assumptions: calibration, background conditions, detector models, assumptions about the sample. Only after many independent failures does the central theory itself become a live target. So far this looks like Lakatos's protective belt. But the practice has two further features. First, the field does not allow just any auxiliary adjustment: an adjustment is taken seriously only if it is itself testable and eventually leads to new successful predictions, and ad hoc patches that merely neutralize the anomaly are treated as a mark of decline. Second, in my experience, funding panels and hiring committees often reward proposals that challenge the central theory once a programme has stagnated, even when no single anomaly has been decisive.

  What theory of theory appraisal does this ensemble of practices presuppose? Reconstruct the implicit theory as precisely as you can, and say which parts of it are strictly required by the practice and which parts are merely compatible with it. In particular, does the practice really presuppose something like Lakatos's distinction between a hard core and a protective belt, together with his criterion of progressive versus degenerating problemshifts? Or is the same behaviour equally licensed by a Bayesian view in which the core simply carries a very high prior, or by a Popperian view in which the core is a conjecture tested only at the level of the whole programme? Where is the practice philosophically underdetermined, so that several rival theories would produce the same behaviour? And is the ensemble internally consistent? Finally, tell me what would have to change in the day-to-day norms of a field — in peer review, in the treatment of anomalies, in funding decisions — if the presupposed view were replaced by a straightforward falsificationism on which every failed prediction counts directly against the core.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **User Background:** Experimental physicist, late convert to philosophy of science. Familiar with Lakatos.
      *   **Observed Practice:**
          1.  Anomaly arises vs. central theory.
          2.  Response: Question experiment -> analysis -> auxiliary assumptions (calibration, background, etc.). Core theory is last to go.
          3.  Constraint 1: Auxiliary adjustments must be testable/predictive (no *ad hoc* patches).
          4.  Constraint 2: Funding/hiring rewards challenging the core *after* stagnation, even without decisive falsification.
      *   **Tasks:**
          1.  Reconstruct the implicit theory of theory appraisal presupposed by this practice.
          2.  Distinguish between *required* elements and *compatible* elements.
          3.  Evaluate specific philosophical frameworks: Lakatos (Hard Core/Protective Belt, Progressive/Degenerating), Bayesian (High Prior), Popperian (Conjecture/Whole Programme).
          4.  Identify where the practice is philosophically underdetermined (multiple theories explain the same behavior).
          5.  Assess internal consistency.
          6.  Contrast with "Straightforward Falsificationism": What norms would change if every failed prediction counted directly against the core?

  2.  **Initial Analysis & Mapping:**

      *   *Observation 1 (Protecting the Core):* This screams Lakatos (Negative Heuristic) or Quine-Duhem (Holism) or Bayesian (High Prior).
      *   *Observation 2 (No Ad Hoc):* This screams Lakatos (Progressive Problemshift) or Popper (Corroboration requires risk). It rules out naive conventionalism.
      *   *Observation 3 (Rewarding Challenges after Stagnation):* This is interesting. It suggests a meta-evaluation of the *programme's* health, not just individual results. This aligns strongly with Lakatos's "degenerating problemshift."
      *   *The Tension:* Protecting the core *vs.* eventually funding challenges to it. This implies a dynamic threshold, not a static dogma.

  3.  **Drafting the Reconstruction (The "Implicit Theory"):**

      *   *Name:* Let's call it "Constrained Holistic Fallibilism" or "Methodological Structuralism." Actually, sticking closer to the prompt's options, it looks most like a *sophisticated methodological falsificationism* (Lakatos) but I need to be careful not to just say "It's Lakatos." I need to derive it from the practice.
      *   *Core Tenets:*
          1.  Theories are not tested in isolation (Duhem-Quine).
          2.  Epistemic inertia is rational (don't dump a working engine for one flat tire).
          3.  Modifications must increase empirical content (no *ad hoc*).
          4.  Programmes have lifecycles (progressive -> stagnating -> degenerating).
          5.  Resource allocation tracks lifecycle status.

  4.  **Evaluating the Philosophical Candidates:**

      *   *Lakatos:* Fits very well. Hard core = central theory. Protective belt = auxiliaries. Progressive/Degenerating = Constraint 1 & 2.
      *   *Bayesian:* Fits Observation 1 (High Prior). Fits Observation 2 (Likelihood of *ad hoc* is low/penalized). Fits Observation 3 (Posterior probability drops as evidence accumulates against the programme). *Crucial Point:* Bayesianism explains the *behavior* but doesn't necessarily prescribe the *norms* (is/ought gap). However, a "Rational Bayesian Agent" model works.
      *   *Popper:* Naive falsificationism fails Observation 1. Sophisticated Popper (testing systems) gets closer but lacks the explicit "research programme" temporality that explains Observation 3 (funding based on stagnation).
      *   *Kuhn:* Normal Science fits Obs 1. Crisis/Revolution fits Obs 3. But Kuhn is often seen as sociological/irrational during transitions. The user's description emphasizes *testability* of auxiliaries, which is more Lakatosian than Kuhnian (paradigm incommensurability).

  5.  **Identifying Underdetermination:**

      *   Where do these theories diverge but produce the same lab behavior?
      *   *Why* protect the core? Lakatos says "methodological rule." Bayesian says "probability calculus." Popper says "convention." The *action* is the same; the *justification* differs.
      *   *What counts as "Stagnation"?* Lakatos has a specific definition (loss of predictive power). A Bayesian might define it as diminishing returns on posterior probability updates. A Kuhnian might define it as inability to solve puzzles. The practice might not distinguish these internally.

  6.  **Assessing Internal Consistency:**

      *   Is there a contradiction between "Protect the core" and "Fund challenges to the core"?
      *   No, provided there is a *temporal* or *conditional* clause. "Protect *until* degenerating."
      *   Risk: How do we know when we cross the line? This is the "lag" problem in Lakatos. The practice seems to acknowledge this by rewarding challenges *once stagnated*, implying a community judgment call.

  7.  **Contrast with Straightforward Falsificationism:**

      *   *Naive Falsification:* $T + A \to O$. $\neg O \to \neg T$.
      *   *Changes:*
          *   Every anomaly triggers a crisis.
          *   Auxiliaries aren't buffer zones; they are part of the falsifiable bundle, but the core loses protection.
          *   Funding would be chaotic (chasing every anomaly).
          *   Stability would vanish.
          *   "Ad hoc" wouldn't matter as much as "logical consistency."

  8.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to simply validate Lakatos. The user asks what theory the *practice* presupposes. The practice might be pragmatically sound without committing to Lakatos's specific ontology of "research programmes."
      *   *Nuance:* The Bayesian view is strong here. A high prior + likelihood ratios explains the resistance to falsification. The "no ad hoc" rule is explained by Occam's Razor/Bayesian penalty for complexity. The "funding shift" is explained by expected utility maximization (diminishing returns on the old theory).
      *   *Distinction:* Lakatos is *normative* (how science *should* proceed). Bayesianism is often *descriptive/epistemic* (how belief *should* update). The practice is normative (peer review, funding). So Lakatos fits the *normative* structure better, while Bayesianism fits the *credence* structure.
      *   *Key Insight:* The practice presupposes a **meta-methodology**. It's not just about theory appraisal; it's about *resource allocation* based on theory appraisal. This is closer to Lakatos or a Pragmatist view than pure Bayesianism.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the physicist's insight. Validate that their observation is astute and maps onto the "Duhem-Quine thesis" managed by methodological rules.
      *   **Reconstruction:** Define the "Implicit Theory of Appraisal and Resource Allocation." Break it down into axioms.
      *   **Required vs. Compatible:** Distinguish what *must* be true for the practice to make sense vs. what philosophical story is told about it.
      *   **Philosophical Mapping:**
          *   Lakatos: Strong fit (especially on stagnation/funding).
          *   Bayesian: Strong fit on belief updating, weaker on the normative "funding" aspect without utility functions.
          *   Popper: Weak fit on protection, strong fit on anti-ad hoc.
      *   **Underdetermination:** Highlight where the practice doesn't distinguish between these philosophies (e.g., the *reason* for protection).
      *   **Consistency:** Address the tension between protection and challenge.
      *   **Counterfactual (Naive Falsificationism):** Detail the chaotic consequences.

  10. **Final Polish:** Ensure tone is respectful of the user's expertise (physicist) while being philosophically precise. Use terms like "Negative Heuristic," "Duhem-Quine," "Prior Probability," "Expected Utility." (Self-correction: Ensure I explicitly answer the "Required vs. Compatible" prompt section clearly).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "It is Lakatos." The prompt asks what theory the *practice presupposes*. The practice *looks* like Lakatos, but does it *require* his specific metaphysics of research programmes? No. It requires a *functional equivalent*. I should emphasize the functional requirements.

      *Required:* Holism (theories aren't tested alone), Epistemic Conservation (don't ditch core easily), Progressiveness Criterion (modifications must predict), Meta-Evaluation (programmes have lifecycles).
      *Compatible:* Lakatos's specific "Hard Core" ontology, Bayesian priors, Popper's "conventionalist stipulation."

