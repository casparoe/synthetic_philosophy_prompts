answer: |-
  This is a sophisticated problem that cuts to the heart of meta-ethics and moral psychology. You are effectively asking for a demarcation criterion between **reflective moral conviction** (what you are calling a "preference") and **unreflective normative prejudice** (a "bias").

  Your three attempted principles failed for specific, instructive reasons:
  1.  **Cultural Insulation** failed because it conflates *origin* with *validity*. A view can be culturally inherited yet rationally robust (Case 5).
  2.  **Survivability** failed because it is counterfactual and elitist. It requires knowing how a mind *would* change under conditions that haven't happened.
  3.  **Causal Origins** failed because it is epistemically inaccessible. We cannot see the causal history of another's psychology.

  To solve this, we need a principle that is **structural** rather than historical. We must look not at where the belief came from, but at how it functions within the person's wider web of beliefs.

  ### The Proposed Principle: Integrative Coherence

  I propose the **Principle of Integrative Coherence**.

  *   **A Moral Bias** is a conviction that is **modularly encapsulated**. It is insulated from the person's other moral commitments. It relies on local authority (tradition, intuition, "naturalness") and resists translation into generalizable principles. When pressed, it terminates in "That's just how it is."
  *   **A Moral Preference (Conviction)** is a conviction that is **integratively coherent**. It is connected to the person's broader moral framework (harm, fairness, autonomy, dignity). It relies on generalizable interests. When pressed, it terminates in a principle that applies consistently across similar cases.

  **The Test:** To distinguish them, ask: *Does this conviction demand consistent application in structurally similar cases, or is it exempted by intuition?*

  ### Applying the Principle to Your Cases

  This principle preserves most of your verdicts but clarifies *why*, specifically resolving the tension between Case 5 and Case 6.

  **(1) Dog Meat: Bias.**
  *   **Analysis:** The conviction ("dogs are not food") is encapsulated. It does not connect to a broader principle like "suffering" (since the killing is painless) or "speciesism" (since they eat cows). It relies on a category boundary ("companion" vs. "food") that is culturally specific and not integrated into a wider ethical system.
  *   **Verdict:** Confirmed Bias.

  **(2) Factory Farming: Preference.**
  *   **Analysis:** The conviction is integrated into a broader framework of suffering and necessity. It connects to other beliefs about animal welfare and unnecessary harm. It is generalizable (applies to all sentient beings, not just pigs).
  *   **Verdict:** Confirmed Preference.

  **(3) Arranged Marriage: Bias.**
  *   **Analysis:** The objection ("people should choose") sounds like autonomy, but the user notes the person hasn't engaged with how "choice" functions in those cultures. If the conviction rests on a specific, culturally inherited definition of "love" without integrating the *outcomes* of the marriages (stability, family cohesion), it is encapsulated. It prioritizes the *ritual of choosing* over the *quality of the union*.
  *   **Verdict:** Confirmed Bias.

  **(5) Nepotism: Preference.**
  *   **Analysis:** This is the crucial pivot. You were worried this was culturally inherited (like Case 6). But the justification ("unfair to the better-qualified candidate") integrates the conviction into a **principle of meritocratic fairness**. This principle is generalizable: it applies to hiring, grading, promotions, etc. It appeals to the interests of a third party (the stranger).
  *   **Verdict:** Confirmed Preference.

  **(6) Genetic Enhancement: Bias.**
  *   **Analysis:** Here is why this differs from Case 5. The justification ("playing God," "unnatural") is encapsulated. It does not integrate with the person's other medical choices. Do they oppose vaccines? Surgery? Education? These also "optimize" children and intervene in "nature." Unless the person can articulate a consistent principle that distinguishes enhancement from therapy without relying solely on intuition, the conviction is modular. It is a "brute intuition" rather than a coherent principle.
  *   **Verdict:** Confirmed Bias. (The distinction from Case 5 is that Case 5 appeals to *fairness*, a thin universal concept; Case 6 appeals to *purity/nature*, a thick local concept, without consistent application).

  ### Resolving the Unresolved Cases

  Now we apply the Principle of Integrative Coherence to your torn verdicts.

  **(4) Polyamory: Preference (with a caveat).**
  *   **Your Worry:** Is "depth of trust" just post-hoc rationalization for a taboo?
  *   **Application:** The person has engaged with counter-arguments and friends. Their justification appeals to a specific theory of human intimacy (exclusivity fosters depth). This is a **psychological claim**, not just a normative one.
  *   **The Test:** Is it integrated? If they believe exclusivity fosters depth, do they apply this to friendship? To business partnerships? If they hold a consistent theory that *certain goods require exclusivity*, this is a **Moral Preference**. It is a competing theory of the good life.
  *   **The Caveat:** It becomes a **Bias** only if they cannot explain *why* exclusivity creates trust, or if they apply the "exclusivity requirement" inconsistently (e.g., demanding it in romance but not caring about loyalty in friendship). Given your description (they have read defenses and hold firm based on a specific value), this leans heavily toward **Preference**. It is a sincere disagreement about the *conditions for intimacy*, not a reflexive taboo.

  **(7) Sex Work: The Hard Case.**
  *   **Your Worry:** Is "non-transactional intimacy" a moral truth or a bias dressed up?
  *   **Application:** This depends entirely on **consistency**.
      *   **Scenario A (Bias):** The person believes sex must be non-transactional, but has no objection to surrogacy (wombs for rent), professional caregiving (intimacy for pay), or even marriage (which historically involves economic exchange). If the "non-transactional" rule applies *only* to sex work, it is an encapsulated intuition (disgust/purity) masquerading as a principle. **Verdict: Bias.**
      *   **Scenario B (Preference):** The person holds a broader view that *certain human capacities* (sexuality, care, reproduction) should be decommodified to protect human dignity. They oppose surrogacy and maybe even certain forms of caregiving for similar reasons. They can articulate why commodifying *this specific act* damages the social meaning of intimacy for everyone. **Verdict: Preference.**
  *   **My Assessment:** Based on your description ("deep-seated sense... ought to be non-transactional"), this often functions as a **Bias** in public discourse because it rarely survives the consistency test. However, philosophically, it *can* be a Preference (a Kantian objection to self-instrumentalization).
  *   **Final Verdict for (7):** Without evidence of broader consistency regarding commodification, the default classification under this principle is **Bias**. To upgrade it to a Preference, the holder must demonstrate that their objection applies to other forms of intimate commodification, not just sex work.

  ### Why the Distinction Might Collapse (The Alternative Framework)

  You asked me to say if the distinction is untenable. There is a strong argument from Moral Psychology (e.g., Jonathan Haidt) that **all** moral convictions are ultimately biases (intuitions) with post-hoc rationalizations.

  If you accept the **Social Intuitionist Model**, then Case 2 (Factory Farming) is just as "biased" as Case 1 (Dog Meat). The difference is merely that the Factory Farming person belongs to a subculture (ethical vegans) that provides better *rhetoric* for their intuition.

  **Why your cases still pattern the way they do:**
  Even if all morality is intuition-based, the distinction between Preference and Bias remains **functionally useful** for discourse.
  *   **Biases** (Encapsulated) shut down dialogue. They say, "I know it's wrong."
  *   **Preferences** (Integrated) invite dialogue. They say, "I believe X causes harm Y."

  **Alternative Framework:**
  Instead of Preference vs. Bias, talk about **Dialogic Openness vs. Dogmatic Encapsulation**.
  *   **Case 1, 3, 6:** Dogmatically Encapsulated. (Relies on local norms).
  *   **Case 2, 4, 5:** Dialogically Open. (Relies on shareable reasons).
  *   **Case 7:** Depends on whether the holder is willing to test their intuition against other forms of commodification.

  ### Summary of the Solution

  The **Principle of Integrative Coherence** solves your problem by shifting focus from the *origin* of the belief to its *architecture*.

  1.  **Bias** = Encapsulated intuition + Local authority (Tradition/Purity).
  2.  **Preference** = Integrated principle + Generalizable interest (Harm/Fairness/Autonomy).

  This preserves your verdicts on 1, 2, 3, 5, and 6. It resolves the 5 vs. 6 tension by highlighting that Fairness (5) is a generalizable principle, while "Naturalness" (6) is usually an encapsulated intuition. It classifies 4 as a Preference (a theory of intimacy) and 7 as a Bias *unless* the holder can demonstrate consistency regarding commodification.

  This allows you to respect sincere moral disagreement (Preferences) without granting epistemic immunity to unexamined prejudice (Biases).
