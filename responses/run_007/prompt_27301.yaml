answer: |-
  This is a great setup. The pub environment is actually an asset here; Williams's critique is about real life, not seminar rooms. The risk with a mixed crowd (grads + laypeople) is that the grads will start debating rule-utilitarianism loopholes while the laypeople zone out. You need to keep the focus on the *phenomenology* of the moral decision, not the meta-ethics.

  Here is the architecture for the evening. It's designed to trap them in the utilitarian logic before springing Williams on them.

  ### Part 1: The Seduction (20 Minutes)
  **Goal:** Make them feel the moral force of impartiality. Do not start with Williams. Start by making them Utilitarians.

  *   **The Move:** Run a standard "impartiality" drill. Use the Peter Singer "Drowning Child" logic (if you can save a child from a pond at the cost of your shoes, you must).
  *   **The Trap:** Get them to agree that *numbers matter* and *proximity doesn't*. If they agree that a stranger's life counts as much as a friend's life in the abstract, you have them.
  *   **Why this first?** If you don't establish the plausibility of impartiality, Williams's objection looks like special pleading. You need them to feel the *pull* of the theory so that the *cost* of the theory feels real later.
  *   **Host Note:** The philosophy grads might try to nuance this immediately ("Well, act vs. rule..."). Shut that down gently. Tell them: "For the sake of the thought experiment, assume the theory demands impartiality. We're testing the cost of that demand, not the loopholes."

  ### Part 2: The Sting (25 Minutes)
  **Goal:** Introduce the "One Thought Too Many." This is where you deploy the **Drowning Wife** case.

  *   **The Case:** A man sees two people drowning: his wife and a stranger. He can only save one. He saves his wife.
  *   **The Utilitarian Evaluation:** A utilitarian *might* say saving the wife is okay (maybe she's happier, maybe he's more useful if she lives). But Williams says that doesn't matter.
  *   **The Critical Pivot:** The problem isn't the *action* (saving the wife). The problem is the *justification*. If the husband had to *calculate* whether saving his wife was permissible within the moral system, he has already had "one thought too many."
  *   **Why this case?** "Jim and the Indians" is Williams's most famous case, but it's about *negative responsibility*. For *integrity* and *alienation*, the Wife case is sharper. It's less freighted with political violence and hits the "personal commitments" angle harder.
  *   **The Point:** Love, by definition, is partial. A moral theory that requires you to justify partiality through impartiality destroys the nature of the commitment.

  ### Part 3: The Clarification (15 Minutes)
  **Goal:** Pre-empt the two big misconceptions before they derail the Q&A.

  *   **Misconception 1: Integrity = Stubbornness.**
      *   *The Fix:* Explain that Williams isn't talking about "sticking to your guns." He's talking about "ground projects." These are the commitments (art, family, science) that give your life meaning and make you a distinct agent. Without them, you aren't a person; you're a satisfaction-delivery channel for the universe.
  *   **Misconception 2: Williams is offering a rival theory.**
      *   *The Fix:* Be clear: Williams is not saying "Egoism is better." He is saying that *systematic moral theory itself* might be the problem. He is attacking the architecture of "Morality" (capital M), not just Utilitarianism. This usually silences the grads who are looking for a Kantian counter-move.

  ### Part 4: The Verdict (25 Minutes)
  **Goal:** Open discussion, guided by the Diagnostic Question.

  *   **The Discussion:** Let them hash it out. The laypeople will say "Of course I save my wife." The grads will say "But what if the stranger is the cure for cancer?"
  *   **Your Role:** Keep bringing it back to the *internal experience* of the agent. "Does the calculation corrode the love?" not "Who is more valuable?"

  ### The Diagnostic Question
  You asked for one question to know if they actually got it. Do not ask: *"Was the husband right to save his wife?"* (Everyone will say yes).
  Do not ask: *"Is Utilitarianism wrong?"* (Too broad).

  **Ask this:**
  > "If your partner knew that you saved them because you had run a moral calculation that deemed it permissible, would they feel loved, or would they feel like a variable in an equation?"

  *   **Why this works:**
      *   If they say "Loved," they missed the point (they think the *outcome* is all that matters).
      *   If they say "Variable," they understand the alienation objection.
      *   If they say "It depends on the calculation," they are still stuck in the Utilitarian framework Williams is critiquing.
      *   It forces them to confront the interpersonal cost of the theory, which is the heart of the integrity objection.

  ### Host Notes for the "Pub Factor"
  1.  **Manage the Grads:** Philosophy grads love to rescue Utilitarianism by adding complexity ("Rule Utilitarianism handles this!"). Remind them that Williams's point is that *needing* that complexity is itself the alienation. The moment you need a rule to justify loving your wife, the love is already compromised.
  2.  **Manage the Laypeople:** They will tend to think Williams is just saying "Follow your gut." Push them on *why* the gut matters. It's not about instinct; it's about identity.
  3.  **The "Selfishness" Trap:** Someone will inevitably say, "So Williams is saying we should just be selfish?" Head this off in Part 3. Integrity isn't selfishness; it's the condition required to have a self that can act morally at all. A agent with no projects is not a moral agent; it's a tool.

  ### Sequence Summary
  1.  **Seduce:** Make impartiality feel obvious (Drowning Child).
  2.  **Sting:** Show where impartiality breaks the human (Drowning Wife).
  3.  **Clarify:** Integrity isn't stubbornness; it's identity.
  4.  **Diagnose:** The "Variable vs. Loved" question.

  This structure lets you use their own moral intuitions against them, which is exactly what Williams did. Good luck with the salon.
