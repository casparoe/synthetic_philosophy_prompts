prompt: |-
  ok so im a software engineer with basically no philosophy background, and i keep running into this term supererogation — the stuff thats morally good but not required, like jumping on a grenade or donating a kidney to a stranger. every time i try to read a theory of it the author assumes i already know what a theory of it is supposed to do, and i dont. so before i read any actual theories, i want the spec.

  write it like a requirements doc. what does any adequate theory of supererogation have to deliver? give me the acceptance criteria with the case or consideration behind each one: the distinctions it cant collapse (like "not required" vs "morally neutral", or small everyday favors vs heroic self-sacrifice), the edge cases it has to handle (can something be supererogatory toward yourself, like developing a talent way past any duty? does the same act flip from required to supererogatory when the relationship changes, a kidney for your kid vs for a stranger? do professional roles — soldier, doctor, lifeguard — move the line? does it matter whether the person did the heroic thing by accident or for the wrong reason?), and the structural puzzles it has to solve (if the act is better than what duty demands, why isnt it simply required? why is skipping a supererogatory act not blameworthy when skipping a duty is? and is there a mirror-image category of bad-but-permissible acts, and does your theory predict one?).

  also mark which requirements are non-negotiable and which are just one camps preference — e.g. is it a hard requirement that a theory leave room for optional good acts at all, given some moral theories seem to make everything required? flag any two or three requirements you think cant be jointly satisfied, because that tension is the part i most want to see. and tell me which single requirement does the most work knocking out theories. skip the full scorecard of existing views, ill do that myself after.

  id rather the list be sharp than exhaustive. if theres a requirement people usually put on it that you think is actually bogus, say so and why.
reasoning: |-
  Here's a thinking process that leads to the suggested requirements document:

  1.  **Analyze the Request:**
      *   **Target Audience:** Software Engineer (no philosophy background).
      *   **Topic:** Supererogation (morally good but not required acts).
      *   **Format:** Requirements Document (Spec).
      *   **Key Content:** Acceptance criteria, distinctions to maintain, edge cases, structural puzzles, non-negotiable vs. optional requirements, conflicting requirements, the "killer" requirement.
      *   **Tone:** Sharp, technical, precise, avoiding fluff.
      *   **Constraint:** Skip the scorecard of existing views (don't evaluate Utilitarianism vs. Deontology specifically, just define the spec).

  2.  **Deconstruct "Supererogation" into Functional Requirements:**
      *   What is the core function? To classify actions into a specific bucket: *Good + Optional*.
      *   What are the inputs? Actions, Agents, Contexts, Relationships.
      *   What are the outputs? Moral status (Obligatory, Permissible, Supererogatory, Forbidden).
      *   What are the constraints? Logical consistency, alignment with moral intuitions (the "user expectations").

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Core Definition.* It needs to distinguish Supererogatory (S) from Obligatory (O) and Permissible/Neutral (P).
          *   *SE Engineer Analogy:* Return types. `ActionStatus` enum.
          *   *Constraint:* Cannot collapse S into O (that kills the concept) or S into P (that makes it just "nice").

      *   *Requirement 2: The Asymmetry.* Doing S is praiseworthy. Not doing S is *not* blameworthy.
          *   *SE Engineer Analogy:* Logging/Analytics. Success event = +1 metric. Failure event = 0 penalty (unlike Obligatory failure = -1 penalty).

      *   *Requirement 3: The Value Gradient.* S must be "better" than O.
          *   *SE Engineer Analogy:* Priority weighting. S > O in terms of moral value, but O > S in terms of enforcement/requirement. This is the tricky logic bug.

      *   *Requirement 4: Edge Cases (Context/Role).*
          *   *Scenario:* Kidney for stranger vs. kid. Soldier vs. civilian.
          *   *Requirement:* Context-aware permissioning. The `isSupererogatory()` function must depend on `AgentRole` and `RecipientRelationship`.

      *   *Requirement 5: Motivation/Intent.*
          *   *Scenario:* Accidental hero vs. intentional sacrifice.
          *   *Requirement:* Does intent matter for the *act* classification or the *praise* classification? Usually, supererogation focuses on the act, but praise focuses on intent. Need to clarify this dependency.

      *   *Requirement 6: The "Mirror" (Suberogatory).*
          *   *Scenario:* Bad but permissible (rude but not wrong).
          *   *Requirement:* Symmetry check. Does the system support `Suberogatory`? (Optional, as not all theories accept this).

      *   *Requirement 7: The "Overdemandingness" Bug.*
          *   *Scenario:* Utilitarianism often makes everything required.
          *   *Requirement:* The system must allow for *optionality*. If the theory forces `O` on all `Good` acts, it fails the spec.

  4.  **Refining and Categorizing (Non-Negotiable vs. Optional):**
      *   *Non-Negotiable:* The distinction between S and O. The lack of blame for omitting S.
      *   *Optional/Debated:* The existence of Suberogatory acts. Whether self-regarding acts count.
      *   *Conflicts:* The "Paradox of Supererogation" (If it's best, why not required?). This is the core race condition.

  5.  **Identifying the "Killer" Requirement:**
      *   What breaks most theories? The combination of "Better than Duty" + "Not Duty."
      *   Utilitarianism breaks on "Not Duty."
      *   Kantianism often breaks on "Better than Duty" (duty is the ceiling).
      *   *Selection:* The "Non-Requirement of the Best" constraint. (REQ-3).

  6.  **Writing in "Spec" Language:**
      *   Use terms like "Input/Output," "State," "Constraint," "Edge Case," "Race Condition."
      *   Keep it structured (REQ-ID, Description, Rationale, Priority).

  7.  **Review against Constraints:**
      *   *Did I explain the distinctions?* Yes (O vs S vs P).
      *   *Did I cover edge cases?* Yes (Roles, Relationships, Intent).
      *   *Did I cover structural puzzles?* Yes (The Paradox).
      *   *Did I mark Non-Negotiable vs. Preference?* Yes.
      *   *Did I identify conflicting requirements?* Yes (The Paradox).
      *   *Did I identify the killer requirement?* Yes.
      *   *Did I call out bogus requirements?* I should mention the "Suberogatory" symmetry as often assumed but not strictly necessary.

  8.  **Final Polish:**
      *   Ensure the tone is respectful but direct (engineer-to-engineer).
      *   Make sure the "Paradox" is explained clearly as a logical tension, not just a philosophical whim.
      *   Check the "Self-Regarding" edge case (is self-sacrifice required for S?).

      *(Self-Correction during drafting)*: I initially thought about including intent as a hard requirement for the *act* to be supererogatory. But philosophical consensus is usually that the *act* is supererogatory regardless of intent, but the *praise* depends on intent. I need to make sure the spec distinguishes between the deontic status of the act and the aretaic status of the agent. I'll split that into two requirements to be precise.

      *(Refining the "Bogus" requirement)*: Many people assume symmetry (Suberogation). I should flag that as a "Nice to Have" that often breaks implementations.

      *(Refining the Conflict)*: The main conflict is between "Maximize Good" (Consequentialism) and "Optionality" (Common Sense Morality). I need to frame this as a constraint satisfaction problem.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # System Specification: Moral Action Classifier (Supererogation Module)

  **Version:** 1.0  
  **Audience:** Moral Theory Architects  
  **Status:** Draft for Review  

  ## 1. Objective
  Define the functional requirements for a moral theory to successfully instantiate the class `Supererogatory`. The system must distinguish acts that are morally optimal yet optional, without triggering logical exceptions or collapsing into existing categories (`Obligatory`, `Permissible`, `Forbidden`).

  ## 2. Core Data Types
  To implement this spec, the theory must support the following return states for any given action $A$ performed by agent $X$ in context $C$:

  *   `OBLIGATORY`: Must do. Blame if omitted.
  *   `FORBIDDEN`: Must not do. Blame if committed.
  *   `PERMISSIBLE_NEUTRAL`: Can do or omit. No praise/blame.
  *   `SUPEREROGATORY`: Can do or omit. Praise if committed. No blame if omitted.

  ---

  ## 3. Functional Requirements

  ### REQ-1: The Tri-State Distinction (Non-Negotiable)
  **Description:** The system must maintain three distinct states for positive moral actions. It cannot collapse `SUPEREROGATORY` into `OBLIGATORY` or `PERMISSIBLE_NEUTRAL`.
  **Acceptance Criteria:**
  *   **Vs. Obligatory:** There must exist at least one scenario where Action $A$ yields higher moral value than Action $B$, yet $B$ is `OBLIGATORY` and $A$ is `SUPEREROGATORY`.
  *   **Vs. Neutral:** Action $A$ must carry positive moral weight (praise-worthy). It cannot simply be "allowed."
  **Rationale:** If `SUPEREROGATORY` collapses to `OBLIGATORY`, the system is "Overdemanding" (everything good is required). If it collapses to `PERMISSIBLE_NEUTRAL`, the concept is empty (it's just a hobby).
  **Priority:** **CRITICAL**

  ### REQ-2: The Asymmetry of Sanction (Non-Negotiable)
  **Description:** The penalty function for omitting a `SUPEREROGATORY` act must return `NULL`.
  **Acceptance Criteria:**
  *   `evaluate(omit(SUPEREROGATORY))` $\rightarrow$ `Blame = False`
  *   `evaluate(omit(OBLIGATORY))` $\rightarrow$ `Blame = True`
  *   `evaluate(perform(SUPEREROGATORY))` $\rightarrow$ `Praise = True`
  **Rationale:** This is the primary user story. A soldier jumping on a grenade is praised; a soldier *not* jumping on a grenade (if not required by duty) is not blamed. If the system assigns blame to the omission, the act was actually `OBLIGATORY`.
  **Priority:** **CRITICAL**

  ### REQ-3: The Value Paradox Handler (Non-Negotiable)
  **Description:** The system must resolve the logical conflict where `SUPEREROGATORY` acts are "better" than `OBLIGATORY` acts, yet not required.
  **Acceptance Criteria:**
  *   The theory must explain why `Maximize(MoralValue)` is not a hard constraint on all agents at all times.
  *   It must provide a logic gate that permits an agent to choose a lower-value `OBLIGATORY` act over a higher-value `SUPEREROGATORY` act without error.
  **Rationale:** This is the core race condition. In many systems (e.g., classic Utilitarianism), if $A > B$, then $A$ becomes required. This requirement forces the theory to implement a "permission to not maximize."
  **Priority:** **CRITICAL**

  ### REQ-4: Context-Aware Permissioning (Non-Negotiable)
  **Description:** The classification of an act must depend on `AgentRole` and `RecipientRelationship`.
  **Acceptance Criteria:**
  *   **Relationship Delta:** `donate_kidney(stranger)` $\neq$ `donate_kidney(child)`. The latter often shifts toward `OBLIGATORY` or remains `SUPEREROGATORY` with higher stakes; the theory must account for the shift.
  *   **Role Delta:** `run_into_fire(civilian)` $\neq$ `run_into_fire(firefighter)`. Professional roles must be able to shift acts from `SUPEREROGATORY` to `OBLIGATORY`.
  **Rationale:** Supererogation is not a global constant; it is instance-dependent. A theory that hardcodes acts as globally supererogatory fails integration testing with real-world scenarios.
  **Priority:** **CRITICAL**

  ### REQ-5: Intent Decoupling (Optional/Debated)
  **Description:** The system must specify if `SUPEREROGATORY` status depends on the agent's motivation.
  **Acceptance Criteria:**
  *   **Option A (Act-Focused):** Accidental heroism counts. (e.g., You trip and fall on the grenade, saving everyone). Status = `SUPEREROGATORY`.
  *   **Option B (Agent-Focused):** Intent required. (e.g., Tripping is luck, not morality). Status = `PERMISSIBLE_NEUTRAL` outcome, but no Praise.
  **Rationale:** Most theories separate the *deontic status* of the act (was it allowed/good?) from the *aretaic status* of the agent (are they virtuous?). A robust spec should allow the act to be supererogatory regardless of intent, while reserving *Praise* for correct intent.
  **Priority:** **PREFERRED** (Theories that conflate these often crash on edge cases).

  ---

  ## 4. Edge Cases & Integration Tests

  ### TEST-01: Self-Regarding Supererogation
  **Input:** Agent develops a talent far beyond duty, or sacrifices their own happiness for their own long-term growth (e.g., extreme asceticism for spiritual gain).
  **Requirement:** The theory must declare if `SUPEREROGATORY` applies only to *other-regarding* acts or if self-sacrifice/self-improvement counts.
  **Status:** **IMPLEMENTATION DEFINED**. (Many theories restrict supererogation to benefit others. If your theory allows self-regarding supererogation, document it clearly).

  ### TEST-02: The Suberogatory Mirror
  **Input:** An act that is bad but permissible (e.g., eating a noisy snack at a funeral, but not disrupting it).
  **Requirement:** Does the system support a `SUBEROGATORY` state? (`Blame = False`, `Negative_Evaluation = True`).
  **Status:** **OPTIONAL**. (Symmetry is elegant but not strictly required. Many theories reject this category. Do not fail the spec if this is missing, but note the asymmetry).

  ### TEST-03: The "Saint" Exception
  **Input:** An agent with exceptional capacity (e.g., a billionaire vs. an average donor).
  **Requirement:** Does the threshold for `OBLIGATORY` scale with capacity? If I can save 100 lives at zero cost, does it become `OBLIGATORY`?
  **Status:** **CRITICAL**. (If the theory says "Yes," it risks collapsing into Overdemandingness. If "No," it risks arbitrariness).

  ---

  ## 5. Known Conflicts & Trade-offs

  ### CONFLICT-01: The Maximization vs. Optionality Race Condition
  **Description:** You cannot simultaneously satisfy `REQ-3` (Value Paradox) and a strict `Maximize(Good)` algorithm.
  **Details:**
  *   If your theory prioritizes **Optimization** (Consequentialism), you will likely fail `REQ-1` (everything good becomes required).
  *   If your theory prioritizes **Optionality** (Deontology/Common Sense), you must implement a "blocking mechanism" that prevents the "Best Act" from auto-promoting to "Required Act."
  **Resolution:** You must choose which module takes precedence. Most supererogation theories sacrifice strict Optimization to preserve Optionality.

  ### CONFLICT-02: The Praise-Blame Symmetry
  **Description:** Users often expect symmetry between Praise and Blame.
  **Details:** `SUPEREROGATORY` implies Praise without Blame for omission. `SUBEROGATORY` implies Blame without Praise for commission.
  **Resolution:** Supporting `SUBEROGATORY` (TEST-02) often complicates the logic of `PERMISSIBLE`. It is safer to drop `SUBEROGATORY` support to ensure stability of the core `SUPEREROGATORY` module.

  ---

  ## 6. The "Killer" Requirement

  **REQ-3 (The Value Paradox Handler)** is the single requirement that eliminates the most theories.

  **Why:**
  Most moral frameworks are built on a simple `if (Good > Threshold) then Require` logic.
  *   **Utilitarianism** fails here. It cannot logically support `SUPEREROGATORY` because if an act produces the most utility, it is by definition `OBLIGATORY`. To make it work, Utilitarians have to hack the system (e.g., "Rule Utilitarianism" or "Satisficing"), which often introduces instability elsewhere.
  *   **Kantianism** often struggles here because duty is usually the ceiling. If you go beyond duty, Kantians sometimes argue you are still just fulfilling a wide imperfect duty, collapsing `SUPEREROGATORY` back into `OBLIGATORY` (just a fuzzy version of it).

  **Verification:** When evaluating a theory, ask: *"What mechanism prevents the best available action from automatically becoming mandatory?"* If the answer is "Nothing," the theory fails the spec.

  ---

  ## 7. Bogus Requirements (Do Not Implement)

  ### REQ-BOGUS: The "Heroism" Threshold
  **Description:** The belief that supererogatory acts must involve life-risk or extreme sacrifice.
  **Why it's Bogus:** This is a UI issue, not a backend logic issue. Small favors (holding a door when your hands are full) can be structurally supererogatory. Hardcoding a "sacrifice threshold" limits the system's scalability. Keep the definition structural (Optional + Good), not semantic (Heroic).

  ### REQ-BOGUS: Strict Symmetry (Suberogation)
  **Description:** The belief that if `SUPEREROGATORY` exists, `SUBEROGATORY` (bad but permissible) *must* exist.
  **Why it's Bogus:** Moral logic is not inherently symmetrical. Obligations constrain harm more strictly than they constrain benefit. Forcing a `SUBEROGATORY` class often creates logical bugs where "bad" acts get labeled "permissible" incorrectly. Treat this as a plugin, not core kernel code.

  ---

  ## 8. Summary for Architect Review
  1.  **Hard Constraint:** You must allow an agent to choose a "Less Good" option over a "Best" option without triggering a `Blame` exception.
  2.  **Hard Constraint:** You must allow the "Best" option to generate a `Praise` event upon completion.
  3.  **Major Risk:** Ensuring the boundary between `OBLIGATORY` and `SUPEREROGATORY` doesn't shift based on agent capability (The "Saint" Exception).
  4.  **Drop Target:** Do not worry about symmetric "bad but permissible" acts until the core "good but optional" module is stable.
