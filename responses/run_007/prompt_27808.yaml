answer: |-
  This is a classic administrative problem disguised as an aesthetic one. You are trying to bureaucratize judgment, which is inherently resistant to rules. Hume is the right philosopher for this because he admits sentiment is the source of judgment but argues that *consistent* sentiment is possible through discipline.

  Your committee isn't failing because you lack taste; you're failing because you are skipping the *work* of tasting. You are reacting, not judging.

  Here is a procedure adapted from Hume's five qualities of the "True Judge" (Delicacy, Practice, Comparison, Freedom from Prejudice, Good Sense), designed for a municipal setting with your specific constraints.

  ### The Humean Protocol for Public Art Review
  **Time Allocation:** 40 minutes per proposal (allowing for 2-3 proposals per 2-hour meeting).
  **Role of the Chair:** You are not a voter first; you are the "Keeper of the Protocol." Your job is to stop the committee from voting until they have answered the questions below.

  #### Phase 1: Delicacy of Taste (10 Minutes)
  *Hume: "The ability to perceive every ingredient in a composition."*
  **Constraint:** Most committee members look at the "whole picture" and react emotionally. This phase forces attention to detail.
  **Procedure:**
  1.  **Silent Observation (3 mins):** No talking. Look at the renderings and read the statement.
  2.  **Inventory of Elements (7 mins):** Go around the table. Each member must identify **three specific technical or compositional details** they noticed (e.g., "the texture of the bronze," "the sightlines from the north entrance," "the font choice on the plaque").
  **Sufficiency Check:** If a member says, "I just like it," you (Chair) must intervene: *"What specifically creates that liking? Is it the scale? The material? The color?"* If they cannot name a detail, their vote counts less in the final deliberation.

  #### Phase 2: Comparison and Practice (10 Minutes)
  *Hume: "Knowledge of different styles to contextualize the work."*
  **Constraint:** Half your committee lacks art training. They rely on the two artists. This phase forces the artists to teach and the non-artists to contextualize.
  **Procedure:**
  1.  **The Artist's Burden:** The two artist members must cite **one comparable work** (historical or contemporary) that this proposal resembles or references.
  2.  **The Layperson's Context:** The Planner, Neighborhood Rep, and Chair must identify **one civic precedent**. (e.g., "We approved a similar mural in 2019," or "This conflicts with the Parks Master Plan.")
  **Sufficiency Check:** If the artists cannot name a comparison, the work may be derivative or incoherent. If the non-artists cannot find a civic parallel, the work may be too alien for the site.

  #### Phase 3: Freedom from Prejudice (10 Minutes)
  *Hume: "Setting aside personal interest and local bias."*
  **Constraint:** This is where most commissions fail. The Neighborhood Rep votes based on "will people complain?" The Lawyer votes based on "liability." The Artists vote based on "is it cool?"
  **Procedure:**
  1.  **The Bias Confession:** Each member must state one reason they *want* to reject or approve the work that is **not** about the art itself.
      *   *Examples:* "I want to reject this because it looks like a eyesore." "I want to approve this because I know the artist." "I want to reject this because the City Council might get angry."
  2.  **The Bracketing:** The Chair explicitly "brackets" these concerns. If a concern is legal/safety, it goes to a separate compliance checklist (outside this aesthetic review). If it is "I don't like ugly things," Hume says this must be overcome by Good Sense.
  **Sufficiency Check:** You cannot vote until you have stated a prejudice. If no one admits a prejudice, you haven't dug deep enough.

  #### Phase 4: Good Sense and Public Function (5 Minutes)
  *Hume: "Reasoning ability to understand the work's intent and context."*
  **Constraint:** Public art is not gallery art. It must serve a public function.
  **Procedure:**
  1.  **Intent vs. Effect:** Does the work achieve what the artist statement claims?
  2.  **Site Specificity:** Does the work converse with the location, or is it a "plug-and-play" piece dropped anywhere?
  **Sufficiency Check:** If the work is technically brilliant but ignores the site (e.g., a quiet meditation piece for a noisy bus terminal), it fails Good Sense.

  #### Phase 5: The Verdict (5 Minutes)
  **Procedure:**
  1.  **The Vote:** Yes/No/Abstain.
  2.  **The Minute:** The rationale recorded in the public minutes must **not** say "We liked it." It must reference the Protocol (e.g., "Approved based on strong Comparison to regional history, despite Prejudice regarding material durability").

  **Where the Procedure Stops:**
  If, after clearing prejudices and checking comparisons, the committee is still split 3-2, **stop.** Hume acknowledges that sentiment varies. Do not debate further. Vote. The inconsistency the public sees is often just the visibility of this final step. If the *process* is consistent, the *outcome* variance is defensible.

  ***

  ### Application to Hypothetical Proposals

  Here is how the Protocol forces uncomfortable results.

  #### Case 1: The Realistic Bronze Statue
  **Proposal:** A 7-foot bronze of a 19th-century mayor. Technically perfect anatomy, traditional pedestal.
  **Committee Gut:** The Neighborhood Rep loves it (recognizable hero). The Planner loves it (durable). The Artists are bored.

  **Running the Protocol:**
  1.  **Delicacy:** The artists point out the "flawless drapery." The Rep points out "he looks like the guy on the dollar bill."
      *   *Tension:* The details are competent but unsurprising.
  2.  **Comparison:** The artists cite 1,000 other Civil War-era statues. "We have seen this exact form in every town square in America."
      *   *Humean Insight:* A work that adds nothing to the "catalogue of art" fails the test of Comparison. It is a copy, even if original.
  3.  **Prejudice:** The Rep admits, "I want to approve this because it's safe and won't get vandalized." The Lawyer admits, "I want to approve because it's legally defensible."
      *   *Bracketing:* Safety and liability are compliance issues, not aesthetic ones. Aesthetically, "safety" is a prejudice against risk.
  4.  **Good Sense:** Does it fit the site? Yes. Does it achieve intent? Yes. But does it serve the *public's* capacity for taste? Hume argues art should educate sentiment, not just confirm it.
  5.  **The Verdict:** **REJECT.**
      *   *Rationale:* "While technically competent, the work fails the Comparison test. It offers no new sentiment to the public and relies on a cliché form. We are rejecting it *because* it is too safe."
      *   *Why it hurts:* The Neighborhood Rep and Planner hate this. They wanted a win. But the Protocol forced them to admit they were voting out of fear (Prejudice), not taste.

  #### Case 2: The Gentrification Installation
  **Proposal:** A 15-foot assemblage of concrete rubble and rebar from a demolished housing project. Rusty, jagged, visually aggressive.
  **Committee Gut:** The Artists love it (powerful). The Rep hates it (looks like trash, might upset residents). The Lawyer worries (liability, sharp edges).

  **Running the Protocol:**
  1.  **Delicacy:** The artists point out the "welding marks that show the labor of demolition." The Rep says, "I see rust and danger."
      *   *Tension:* Visceral repulsion vs. perceived depth.
  2.  **Comparison:** The artists cite Gordon Matta-Clark or Robert Smithson. "This fits a 50-year tradition of using industrial waste to critique urban renewal."
      *   *Humean Insight:* The non-artists now have a framework. It's not "trash"; it's a specific genre of critique.
  3.  **Prejudice:** The Rep admits, "I'm afraid the residents will think we are mocking them." The Lawyer admits, "I think it looks dangerous."
      *   *Bracketing:* Danger is a compliance issue (can we fence it? seal the rebar?). If compliance clears it, the "fear" of danger is a prejudice. The fear of resident reaction is valid, but Hume argues the "True Judge" leads the public, not follows it.
  4.  **Good Sense:** The statement claims to memorialize displacement. The materials *are* the displacement. The intent and execution align perfectly.
  5.  **The Verdict:** **APPROVE.**
      *   *Rationale:* "Despite initial visceral repulsion (Prejudice), the work passes the Comparison test as a significant example of social sculpture. The materials are essential to the Good Sense of the piece. We approve conditionally on safety sealing."
      *   *Why it hurts:* The Lawyer and Rep have to go on record approving something their constituents might call "ugly." They have to own the judgment that *artistic merit* outweighs *immediate likability*.

  ### Why This Works for You
  1.  **It Protects You:** When the Mayor calls asking why you approved the "pile of rubble," you don't say "We liked it." You say, "We followed a standardized review protocol based on comparative art history and site-specific intent, and we bracketed personal prejudices." That is defensible.
  2.  **It Educates the Committee:** Over a year, the Neighborhood Rep and Planner will develop "Practice" and "Comparison" skills. They will become the "True Judges" Hume describes.
  3.  **It Embraces the Uncomfortable:** By forcing the "Prejudice Confession," you make the hidden reasons visible. Sometimes you will reject a beautiful piece because it fails "Good Sense" (e.g., wrong site). Sometimes you will approve an ugly piece because it passes "Comparison."

  **The Stop Rule:** If you run this protocol and the committee still refuses to approve the "ugly" work or refuses to reject the "boring" work, the problem isn't the art. It's that your city isn't ready for a Public Art Commission; it's a Public Decoration Committee. In that case, rewrite your charter to reflect "decoration" and lower your standards accordingly. But if you want art, you must use the Standard of Taste.
