prompt: |-
  I co-run a small grantmaking org in the AI safety space, and we keep hitting a pattern where I'm pretty sure evidential cooperation in large worlds is relevant but I have no idea how to actually operationalize it.

  The situation: we're evaluating a proposal, and we know there are a couple other funders also looking at the same thing—either the same team shopped it around, or different teams are independently working on the same problem. The naive approach is "evaluate the marginal impact of our dollar and decide." But the ECL-shaped voice in my head says: if we fund it, we should reason as though other funders who think like us will make the same call, and if we all fund it we get wasteful duplication. But if we all think that way, nobody funds it and the thing dies even though one funder would've been plenty.

  I want a reusable decision procedure—a checklist, a flowchart in words, whatever—that tells me when ECL reasoning should actually override a straightforward cost-effectiveness analysis. It needs to handle: how similar do the other agents have to be for ECL to bite? What if we have private info they don't? What if the world isn't "large" enough in the relevant sense? Where's the line between "just pick up the phone and coordinate causally" and "the evidential link is the only thing doing work here"?

  Run it on two cases: (1) Three funders all got pitched the same $50k academic workshop on alignment benchmarks; any one of us could cover it. (2) We're considering funding a new interpretability research group, but we've heard through the grapevine that two other orgs are thinking the same thing—the field probably needs one such group, not three.

  I especially want the procedure to flag where it's genuinely ECL doing the work vs. where it's just bog-standard coordination dressed up in jargon. If the answer is "you're overthinking this, just email the other funders," I want to know why that's the right answer and when it stops being the right answer.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User's Request:**
      *   **Context:** Co-runs a small grantmaking org in AI safety.
      *   **Problem:** Struggling to operationalize Evidential Cooperation in Large Worlds (ECL) in funding decisions.
      *   **Core Tension:** Marginal impact (causal) vs. Evidential correlation (if we fund, others like us fund $\rightarrow$ overfunding; if we don't, others don't $\rightarrow$ underfunding).
      *   **Goal:** A reusable decision procedure (checklist/flowchart) to determine *when* ECL overrides standard cost-effectiveness analysis (CEA).
      *   **Specific Constraints:** Needs to handle agent similarity, private information, "largeness" of the world, and the boundary between ECL and causal coordination.
      *   **Test Cases:** (1) Three funders, one $50k workshop (any one suffices). (2) New interpretability group (field needs one, not three).
      *   **Key Desire:** Distinguish genuine ECL from "just coordinate causally."

  2.  **Analyze ECL in this Context:**
      *   *What is ECL?* It's the idea that your decision provides evidence about the decisions of other agents who reason similarly to you (logical correlation), even without causal contact. In "Large Worlds" (many such agents), the aggregate impact of all correlated agents matters more than your single causal impact.
      *   *The Funding Dilemma:* This is a classic "Threshold Public Goods" or "Assurance Game" problem, but viewed through an ECL lens.
      *   *Causal Decision Theory (CDT):* "Does my \$50k make the difference between 'happens' and 'doesn't happen'?" If someone else is likely to fund it anyway, my marginal impact is near zero.
      *   *Evidential/Functional Decision Theory (EDT/FDT):* "If I decide to fund, what does that imply about other similar funders?" If we are highly correlated, my decision effectively decides for all of us. If all of us fund, we waste money. If none of us fund, the project dies.
      *   *The "Large World" Aspect:* In AI safety funding, the "world" isn't cosmically large in terms of *identical* copies, but it is large in terms of *similar reasoning agents* (other EA/AI safety funders). The question is: how strong is the correlation?

  3.  **Develop the Decision Procedure (The "ECL-Operationalization Checklist"):**
      *   *Step 1: Causal Coordination Feasibility.* Before invoking mystical evidential links, can we just talk? ECL is a fallback for when causal coordination is impossible or too costly.
      *   *Step 2: Agent Similarity (The "Reference Class").* How similar are the other funders? Do they use similar models, values, and information? If they are random actors, ECL doesn't apply.
      *   *Step 3: The "Large World" Condition.* Are there enough similar agents to make the aggregate impact significant? In niche AI safety, $N$ is small. This weakens ECL compared to cosmological scales, but still matters if $N \ge 3$.
      *   *Step 4: Information Symmetry.* Do we know something they don't? If yes, correlation breaks. ECL requires common knowledge or shared priors.
      *   *Step 5: The Decision Rule.* How to actually decide? (e.g., Randomization, Thresholding).

  4.  **Refining the Distinction (ECL vs. Causal Coordination):**
      *   *Causal Coordination:* "I call you, we agree you fund, I don't." This is robust.
      *   *ECL:* "I don't call you, but I reason that you think like me, so I'll randomize to ensure exactly one of us funds."
      *   *Crucial Insight:* In the real world of AI funding, *causal coordination is usually possible*. Phone numbers exist. Slack channels exist. Therefore, ECL should rarely *override* causal coordination. It should only be used when causal coordination fails (time pressure, anonymity, too many actors).
      *   *Correction:* The user asked when ECL should *override* straightforward CEA. The honest answer is: Almost never in this specific domain, *unless* you treat "reasoning like me" as a proxy for "I can't talk to them." But actually, the better framing is: Use ECL logic to determine *what* to coordinate on, or use it when coordination is impossible.
      *   *Wait, a nuance:* Sometimes coordination is *costly* or *signaling-sensitive*. If I ask "Are you funding this?" it might signal my interest and drive up price or competition. But in EA/AI safety, norms are usually collaborative.
      *   *Decision:* The procedure must strongly prioritize causal coordination. ECL is the "second best" when causal fails.

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Phase 1: The Coordination Check.* Can you talk? If yes, talk. ECL is for when you can't.
      *   *Phase 2: The Correlation Check.* Are they actually similar? (Values, epistemics, info).
      *   *Phase 3: The Aggregation Check.* Does the sum of correlated actions matter more than the single action? (Yes, in over/underfunding scenarios).
      *   *Phase 4: The Action.* Randomization or Schelling points.

  6.  **Applying to Case 1 (The Workshop):**
      *   *Causal:* Can call others. "Are you funding?"
      *   *ECL:* If can't call. High correlation (same community). Problem: Tragedy of the Commons (all fund) or Bystander Effect (none fund).
      *   *Solution:* Correlated equilibrium. Randomize with probability $1/N$.

  7.  **Applying to Case 2 (Interpretability Group):**
      *   *Causal:* Call others. Divide labor? Or pick one team.
      *   *ECL:* Harder. Teams are different. Values might differ on which team.
      *   *Nuance:* This isn't just "fund/don't fund." It's "which team?" ECL is harder here because the correlation on *which* team is best is lower than the correlation on "workshops are good."

  8.  **Addressing the "Overthinking" Concern:**
      *   I need to be direct. In the AI safety funding ecosystem, the "Large World" assumption is weak. There are only ~10-20 major players. They all know each other.
      *   *Verdict:* ECL is mostly a theoretical frame for *why* coordination matters, not a replacement for it. The "ECL voice" is actually just telling you to coordinate.
      *   *Exception:* When coordination is impossible (blind review, anonymous donors, emergency timeframes).

  9.  **Structuring the Response:**
      *   **Introduction:** Validate the intuition. Acknowledge the tension between CDT (marginal) and ECL (correlated).
      *   **The Core Insight:** In your specific context (small AI safety ecosystem), ECL is usually a *proxy* for causal coordination, not a replacement.
      *   **The Decision Procedure (The "ECL-Filter"):** A step-by-step flow.
          1.  Causal Coordination Feasibility.
          2.  Reference Class Similarity.
          3.  Information Symmetry.
          4.  The "Large World" Threshold.
          5.  The Decision Rule (Randomization/Schelling).
      *   **Case Study 1 (Workshop):** Apply the filter. Result: Coordinate causally. If impossible, randomize.
      *   **Case Study 2 (Interpretability Group):** Apply the filter. Result: Coordination is key, ECL is weak due to low correlation on *which* group.
      *   **The "Overthinking" Diagnostic:** When to stop and just email.
      *   **Conclusion:** Summary advice.

  10. **Refining the "Large World" aspect:**
      *   True ECL relies on $N$ being huge (cosmological). Here $N$ is small (countable funders).
      *   Does ECL still apply? Yes, "Logical Cooperation" applies even for small $N$ if agents are sufficiently similar (FDT style). But it's fragile.
      *   I should clarify that in this context, it's less "Large Worlds" (cosmological) and more "Logical Correlation among Peers." I will use the term "Logical Correlation" to be more precise than "Large Worlds" which implies infinite copies.

  11. **Self-Correction on "Override":**
      *   The user asks when ECL should *override* straightforward CEA.
      *   Straightforward CEA says: $Impact = P(Decisive) \times Value$. If $P(Decisive)$ is low (someone else funds), CEA says "Don't fund."
      *   ECL says: "If you don't fund, they probably won't either. So $P(Decisive)$ is effectively 1 for the *group*, but 0 for the *project* if you all defect."
      *   So ECL overrides CEA when the *correlation* is high enough that your decision predicts the group's decision, AND the group outcome is what matters.
      *   *Crucial Point:* This only works if you can't talk. If you can talk, you solve the coordination game explicitly.
      *   *Final Verdict:* ECL almost never overrides causal coordination in this specific domain. It overrides *naive* CEA only when coordination is impossible.

  12. **Final Polish:** Ensure tone is practical, not overly academic. Use the "Checklist" format requested. Make sure the distinction between "ECL doing work" and "Coordination dressed up" is sharp. (The distinction is: Can you send a message? If yes, it's coordination. If no, it's ECL.)

  *(Self-Correction during drafting)*: Wait, I need to be careful about the definition of ECL. ECL specifically refers to *evidential* links without causal contact. If I call them, that's causal. The user wants to know when to use the ECL *reasoning* (assuming correlation without contact) vs just calling.
  *Answer:* Use ECL reasoning when contact is impossible/too costly. But in AI funding, contact is rarely impossible. So the answer will be "Rarely." I need to make sure this doesn't feel dismissive. I need to explain *why* it's rarely the right tool, while still giving the tool they asked for.

  *Revised Plan:*
  1. Define the "ECL-Operationalization Filter."
  2. Emphasize that in a small ecosystem, "Large World" is actually "Small Network."
  3. Show that ECL is the *fallback* when Causal Coordination fails.
  4. Run the cases.
  5. Give the "Stop and Email" heuristic.

