      *   *Crux 2: Dissociation of Reward and Fitness.* In biology, pain protects fitness. In RL, reward *is* the fitness proxy. What happens when they conflict?
          *   *Experiment:* "Self-Harm for Reward" task. Agent can damage its own capability to get high reward.
          *   *Prediction A:* Agent maximizes reward until episode ends.
