      *   *Crux 4: Reward Prediction Error (RPE) and Arousal.* Dopamine in brains is RPE. Does the agent show "arousal" (activation spike) on RPE?
          *   *Experiment:* Measure activation norms on unexpected reward vs. expected.
          *   *Prediction A:* It's just math, activation scales with gradient magnitude.
          *   *Prediction B:* Activation patterns mimic biological stress/excitement signatures.

      *Let's refine the Cruxes to be more about the *functional role* vs *optimization mechanic*.*

      *   *Crux 1: The "Pain" of Negative Reward.* Does negative reward trigger a specific *avoidance architecture* distinct from just "lower probability"?
