      *   This is the hardest part. Needs to be specific, not "wait for AGI."
      *   *Crux 1: Instrumental Convergence vs. Hedonic Drive.* If an agent can hack the reward signal (wireheading), does it do it *because* it's the optimization target, or because it's "addicted"?
