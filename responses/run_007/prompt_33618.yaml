  4.  **Drafting the Translations (Iterative Process):**

      *   *Peirce:* He talks about the "final opinion" agreed upon by all investigators.
          *   *DS Translation:* Truth is the model parameters $\theta^*$ that minimize the expected loss $E[L]$ over the true data generating process $P$, as sample size $n \to \infty$ and compute $\to \infty$, assuming the model class is rich enough. It's the asymptotic convergence of the learning algorithm. It's objective because it doesn't depend on the specific initializer (researcher), just the data and the loss landscape.
