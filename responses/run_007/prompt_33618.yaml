prompt: |-
  I'm a data scientist, pretty comfortable with stats and ML — I live in the world of convergence guarantees, loss functions, holdout sets, that kind of thing. I keep hearing philosophers reference "pragmatist theories of truth" and the debate between Peirce and James, but whenever I try to read about it I can't tell if they're saying something deep or just being sloppy with words. So here's the challenge: restate both Peirce's and James's theories of truth in the vocabulary of statistical estimation and model evaluation as faithfully as you can. Then give me the residue report: what parts of each view translated cleanly, what you had to stretch or fudge, and what has no expression at all in my vocabulary. I especially want to know whether the stuff that didn't translate is where the real philosophical action is, or wether it's just pre-formal mush that my framework rightly ignores.
