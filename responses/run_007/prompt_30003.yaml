  You have correctly reconstructed the Church-Fitch paradox, and I concede that if the Knowability Principle is applied unrestrictedly to every truth whatsoever, it indeed entails that all truths are known. But that unrestricted formulation is not the one motivated by anti-realism. My commitment is that truth cannot outrun our capacity to recognize it, but this constraint applies to propositions that are *in principle* verifiable. The conjunction you constructed, that $p$ is true and nobody knows $p$, is not a candidate for such verification because it is logically inconsistent with being known. It is what we might call a non-Cartesian proposition: its truth logically precludes its own knowability.

  Therefore, the proper response is to restrict the Knowability Principle to Cartesian propositions—those $\phi$ such that it is logically possible that someone knows $\phi$. This restriction is not ad hoc; it flows directly from the anti-realist intuition that truth is tied to the *possibility* of evidence. If a proposition's truth conditions inherently rule out the existence of evidence for it, as knowing $p$ rules out the claim that nobody knows $p$, then it falls outside the scope of truths that are answerable to our epistemic capacities. By limiting the principle this way, I avoid the collapse into omniscience while preserving the core anti-realist insight that genuine truths must be accessible to inquiry, provided inquiry doesn't logically destroy them.
