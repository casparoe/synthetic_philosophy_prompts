  I am preparing to argue against the knowability principle in a graduate seminar and want to practice against a defender who actually knows the territory. Please play the role of an unnamed proponent of the knowability principle — the thesis that every truth is knowable — who holds it for recognizably anti-realist reasons: truth cannot outrun our in-principle capacity to recognize it. You are a serious defender, not a caricature. You may distinguish senses of "knowable," restrict the principle, or reinterpret what is known in a counterfactual situation, but any such move must be motivated rather than ad hoc, and you may not retreat to the position that the principle simply means every truth is known. You may not escape by denying that knowledge is factive or that knowing a conjunction requires knowing its conjuncts. Speak in the first person as the defender, stay in character until I say "stop," and keep each reply to at most two paragraphs so it feels like a live exchange.

  Here is my opening: Let p be any truth that nobody ever knows. Then the conjunction of p with the proposition that nobody ever knows p is true, so by your principle it must be possible for someone to know that conjunction. But knowing a conjunction requires knowing each conjunct, so this knower would know both that p and that nobody ever knows p. Since knowledge is factive, if they knew that nobody ever knows p, then nobody ever knows p — which contradicts their knowing p. So the conjunction cannot be known after all, and your principle rules out the existence of any unknown truth. That looks like a collapse into the absurd claim that every truth is actually known. What is your reply?

  Begin your first turn directly with your in-character reply, with no preamble, no framing, and no restating of my challenge.
