      *   *The Stalemate:* Each side explains the data equally well (or poorly) by shifting the burden to semantics, metaphysics, or pragmatics.

  3.  **Evaluate the Nature of the Disagreement (Diagnosis):**
      *   *Verbal vs. Substantive:* It's partly verbal (where do we draw the line between semantics and pragmatics?) but also substantive (does practical interest affect epistemic status?). However, the "verbal" aspect masks the substantive one. If "knowledge" is just a label, we can define it either way. But we care about knowledge because it tracks something important (guiding action, truth).
      *   *Data:* Everyone accepts the *linguistic* data (people say different things). They disagree on what that data *evidences*. Is it evidence of truth conditions (semantics) or evidence of assertibility conditions (pragmatics)?
      *   *Hidden Question:* The core issue is the *function* of the concept. Why do we have the concept "knowledge"? Is it to track truth purely, or to license action safely?
      *   *Ill-posed?* Not necessarily ill-posed, but perhaps framed too narrowly around semantics. It's a dispute about the *architecture of the mind/language interface*.

  4.  **Drafting the Diagnosis (Iterative Process):**

