      *   *Verbal vs. Substantive:* It's a "metasemantic" dispute disguised as a semantic one. The parties agree on the input (stakes affect attribution) and mostly agree on the output (action guidance), but disagree on the *mechanism*. This makes it look verbal, but it's substantive because the mechanism determines the normativity.
      *   *The Core Conflict:* The real fight is about the *boundary between epistemic and practical reasoning*. Purists want a firewall; SSI/Contextualists want integration.
