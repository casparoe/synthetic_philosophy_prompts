      *Refining the "Verbal" aspect:* It's not *merely* verbal like "football vs. soccer." It's about how to carve nature at its joints. But since "knowledge" is a folk concept, the carving is somewhat arbitrary.
      *Refining the "Progress" aspect:* Don't promise a solution. Suggest that the question might need dissolving or reframing.

      *Final check on constraints:* No citations. Under 900 words.

      *Let's assemble.*
      (Drafting content...)
      The stalemate you describe is not a failure of imagination but a structural feature of the problem. It is a classic case of theoretical underdetermination: the available evidence (linguistic intuitions and usage patterns) is compatible with multiple, mutually exclusive theoretical models. Each camp offers a different mapping of the same terrain, and because the terrain itself—the interface between mind, language, and world—is not directly observable, no amount of additional bank cases will force a resolution.

      Is it verbal or substantive? It is both, layered like an onion. On the surface, it is verbal, or more precisely, metasemantic. The dispute is about where to draw the boundary between semantics (the literal content of "knows") and pragmatics (the context-dependent appropriateness of asserting it). Since we cannot observe truth conditions directly, only linguistic behavior, we can always save a semantic theory by offloading explanatory work to pragmatics, or vice versa. The contextualist puts the shift in the content; the purist puts it in the assertion conditions; the SSI proponent puts it in the knowledge relation itself. These are technically different claims, but they are empirically equivalent regarding the surface data you mentioned.

      However, beneath the verbal layer lies a substantive dispute about normativity. The real friction is not about the word "knows" but about the architecture of rational agency. The purist insists on a firewall between epistemic reasons (evidence) and practical reasons (stakes). For the purist, knowledge is a purely cognitive standing. The SSI proponent and contextualist, in different ways, deny this firewall, suggesting that what counts as sufficient epistemic standing is sensitive to the costs of being wrong. This is a substantive disagreement about how belief ought to guide action. If knowledge is the norm of assertion or action, then changing the stakes of action should arguably change the requirements for knowledge. The purist says no; the others say yes. This is not verbal; it is a clash of normative visions.

      So, is the question ill-posed? Not necessarily, but it is likely framed too narrowly. The impasse exists because traditional epistemology tries to solve a cognitive science problem using armchair linguistic analysis. The hidden empirical question is psychological: How does the human brain actually integrate risk assessment with evidence evaluation? When a subject hesitates in the high-stakes bank case, is their concept of truth changing, or is their risk-aversion triggering a caution heuristic? Current methods cannot distinguish these internal mechanisms. We are trying to reverse-engineer the mind's software using only its output logs.

      Furthermore, there is a hidden formal question about value. Epistemology is often treated as a descriptive project about a folk concept, but it is also normative. If "knowledge" is a tool we use to navigate the world, its definition should be optimized for that function. If a purist definition leads agents to act recklessly in high-stakes environments, it may be functionally inferior to an SSI definition, regardless of semantic purity. The dispute often ignores this functional teleology.

      What counts as progress? Do not expect more intuitions to break the deadlock. The experimental philosophy data you mentioned already confirms that the intuitions are stable; the disagreement is about their theoretical significance. Progress requires a change of question.

      First, shift from semantics to cognitive architecture. We need empirical work that disentangles evidence processing from risk processing. If neuroscience or psychology shows that stakes modulate the phenomenology of certainty itself, SSI gains ground. If stakes only modulate the willingness to report certainty, purism gains ground.

      Second, shift from definition to function. Instead of asking "What does 'knows' mean?", ask "What work does the concept do?" If the concept's primary role is to flag reliable information for social sharing, contextualism might best explain the variability. If its role is to mark a state of cognitive perfection, purism wins. But we need a theory of conceptual engineering to decide which role matters.

      Finally, accept that some disputes are terminological choices masked as metaphysical discoveries. We may need to stipulate a technical notion of knowledge for epistemology that diverges from ordinary usage. If ordinary usage is context-sensitive but we want a context-invariant norm for science, we can have both, provided we stop conflating the folk concept with the theoretical tool.

      The stalemate persists because everyone is trying to win the same game. Progress comes from realizing the game board is too small. You need to step outside the semantics/pragmatics dichotomy and look at the cognitive and normative systems that generate the data in the first place. Until then, the three positions will remain empirically equivalent theories of the same linguistic behavior, distinguished only by theoretical virtue and philosophical preference.

