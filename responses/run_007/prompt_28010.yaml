  Hey — I'm a science journalist working on a piece about how people and machines go from a handful of examples to a concept, the kind of thing Bongard problems are built to test. I keep running into the claim that there's a deep split between learning an explicit rule and judging by similarity to stored examples, and that the rule-based picture usually wins because it generalizes while similarity just overfits. I want one clean constructed case that runs the other way.

  So here's the build. You're a cognitive scientist who works on concept learning and inductive bias. Think carefully and maybe brainstorm three or four candidate concepts before you commit, because the case has to actually work and not just look like it works. I need this for the piece, so the verdicts have to fall out of the two learning principles themselves, not be stipulated.

  Construct a concept-induction problem in the spirit of a Bongard problem but described entirely in words, since I cant use diagrams. Give me a small set of positive and negative examples, say six of each, plus one held-out probe item. By an explicit-rule learner I mean one that searches for the simplest rule in a shared feature language that covers the examples; by an exemplar-similarity learner I mean one that classifies new items by overall similarity to the stored examples. Both learners have access to the same features.

  The case has to satisfy all of these:

  1. The two learners agree perfectly on the twelve training examples.
  2. On the probe item they give opposite verdicts, and the similarity learner is right while the rule learner is wrong, where right means matching the concept you as the constructor intend a human to pick up from the examples.
  3. The rule the rule learner settles on has to be genuinely simple and one a reasonable adult would actually form. It can't be a dumb rule or an obviously gerrymandered one.
  4. The similarity learner is not allowed to be using features the rule learner couldn't in principle notice.
  5. The items should be ordinary or easily visualized, not exotic, and the target category should feel like a real kind of thing rather than a trick.

  Then do the check. Walk through what each learner does on the training examples, what each predicts on the probe, and why. Tell me which single structural feature of the case is doing the work: what is it about the target concept or the layout of the examples that makes the simple rule mislead while similarity gets it right? What happens if you remove that feature — does the case collapse back into the ususal rules-beat-similarity pattern? And finish with how a defender of the rule-based picture would attack the case: what would they say is unfair or rigged about it, and is there a version of the case that keeps the verdict while answering their objection?
