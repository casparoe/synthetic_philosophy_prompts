          *   *Promising:* Survives. Conventional rules filter out impossible/void promises.
      *   **The Cost:** You owe an account of the constraints. You can't say "Cruelty is wrong antecedently." You must say "Cruelty is incompatible with rational agency / the practice of promising." This invites challenges (e.g., Enoch's Shmagency), but it's the standard cost of doing constructivist business.
      *   **Comparison to Original Euthyphro:** The original dilemma often fails for similar reasons (Divine Command Theory can posit God's nature as a constraint). But in metaethics, it's about the nature of rationality or practices.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is it Premise (4) or the Inference from (2) to (3)/(4)?* It's really the substantive claim in (4). (4) claims: *If* rightness depends on selection, *then* selection is unconstrained. That conditional is false.
      *   *Distinction:* Distinguish between *antecedent normative facts* and *antecedent non-normative facts*. Constructivists deny the former but rely on the latter (facts about rationality, psychology, language).
      *   *Terminology:* Use terms like "internal constraints," "procedural objectivity," "constitutive norms."
      *   *Addressing the "Too Strong" conclusion:* By rejecting (4), we save the views in (7).

  8.  **Final Polish:** Ensure the tone is appropriate for a doctoral student (rigorous, precise, citing relevant literature concepts like Korsgaard, Scanlon, Street without necessarily needing footnotes). Make sure to explicitly answer "what rejecting it would cost."

      *   *Cost:* Commitment to the normativity of rationality/practice immanence. Vulnerability to the "normative question" (Why be rational?).
      *   *Survival:* Kantian Constructivism, Scanlonian Contractualism, Institutional facts (promising/law).

  9.  **Structure of the Output:**
      1.  Direct Answer: Reject Premise (4).
      2.  Diagnosis of the Error: The Arbitrariness Assumption.
