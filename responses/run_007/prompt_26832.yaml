prompt: |-
  I'm on the animal care and use commitee at my university, and we're genuinely split. Our policy only covers vertebrates, but a neuroscience lab has submitted a protocol that would use around 250,000 adult fruit flies over two years in a learning experiment: the flies are food-deprived to motivate them, some get their wings clipped, and at the end they're killed by freezing. Three members want to treat this as the test case for extending our oversight to insects. Their argument is the scale argument: even if the chance a fruit fly is sentient is tiny — they say one in a thousand, maybe one in ten thousand — when you multiply that by the number of insects used in research and agriculture every year, the expected amount of suffering is enormous, so the cost of being wrong is high and a precautionary policy is warranted. The other side says that's a category mistake: fruit flies show nociceptive responses, but nociception isn't sentience, and if we go down this road the committee ends up reviewing every Drosophila stock center and pest-control contract on campus while the mice and rats that we know suffer get less attention. I have to draft the short decision memo we'll circulate before next Thursday's meeting. I need a concrete recommendation — approve the protocol as is, approve with conditions (say which ones), or pause it while we adopt some interim invertebrate policy — with a time frame, and it has to engage the scale argument on its own terms rather than just calling it absurd. Also, I'd like the memo to say honestly where its reasoning is most likely to fail and what empirical finding about insects would actually flip the recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Animal Care and Use Committee (IACUC/ACUC) at a university.
      *   **Task:** Draft a short decision memo for circulation before next Thursday's meeting.
      *   **Context:** Split committee. Policy currently covers only vertebrates. Neuroscience lab protocol involves 250,000 fruit flies (*Drosophila*) over 2 years (food deprivation, wing clipping, freezing).
      *   **The Conflict:**
          *   *Side A (Pro-Oversight):* Scale argument. Low probability of sentience $\times$ huge numbers = high expected suffering. Precautionary principle warranted.
          *   *Side B (Anti-Oversight):* Category mistake. Nociception $\neq$ sentience. Slippery slope (overwhelming committee, distracting from vertebrates).
      *   **Requirements:**
          *   Concrete recommendation (Approve, Approve with Conditions, or Pause/Interim Policy).
          *   Include a time frame.
          *   Engage the "scale argument" on its own terms (don't just dismiss it).
          *   Honestly state where the reasoning is most likely to fail (uncertainty/limitations).
          *   Identify the empirical finding that would flip the recommendation.
      *   **Tone:** Professional, balanced, ethical, decisive but humble.

  2.  **Determine the Recommendation:**
      *   *Option 1: Approve as is.* Ignores the valid ethical concerns of Side A. Risks reputational damage and ethical blind spots.
      *   *Option 2: Pause/Interim Policy.* Acknowledges the complexity. Prevents setting a precedent without guidance. Allows time to craft specific invertebrate guidelines. However, 250k flies is a lot to wait on if the risk is low.
      *   *Option 3: Approve with Conditions.* This is the "Goldilocks" zone. It acknowledges the scale argument by minimizing harm without halting research or overburdening the committee with full vertebrate-level oversight. It treats the protocol as a pilot for invertebrate welfare standards.
      *   *Decision:* **Approve with Conditions + Interim Policy Development.** This satisfies the precautionary principle (Side A) without creating a bureaucratic bottleneck (Side B). It sets a specific path forward.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation on Protocol #XYZ) and the core tension (vertebrate policy vs. invertebrate scale).
      *   **Engagement with the Scale Argument:** This is crucial. I need to show I understand Expected Value Theory (Probability $\times$ Magnitude). I should acknowledge that while $P(\text{sentience})$ is low, $N(\text{flies})$ is high. However, I also need to address the *cost* of oversight.
      *   **The Recommendation:** Approve with specific welfare conditions.
      *   **The Conditions:** What minimizes suffering in flies?
          *   Food deprivation: Limit duration/severity.
          *   Wing clipping: Is it necessary? Can it be done under anesthesia (cold)?
          *   Euthanasia: Freezing is standard, but ensure rapid.
          *   Numbers: Can 250k be reduced via power analysis?
      *   **The Interim Policy:** Set a timeline (e.g., 6 months) to develop a formal Invertebrate Care Policy. This addresses the "slippery slope" fear by making it a deliberate process, not an ad-hoc expansion.
      *   **Uncertainty/Limitations:** Where could this reasoning fail?
          *   If insects *are* more sentient than we think (underestimating $P$).
          *   If the conditions are unenforceable.
          *   If the "distraction" from vertebrates becomes real.
      *   **The "Flip" Condition:** What empirical evidence changes everything?
          *   Evidence of complex affective states (pain *experience* vs. reflex).
          *   Evidence of long-term suffering or anxiety-like states.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Approve with Conditions" too vague?
      *   *Fix:* Be specific about the conditions. Limit starvation to X hours. Require cold anesthesia for clipping.
      *   *Critique:* Did I engage the scale argument enough?
      *   *Fix:* Explicitly mention "Expected Value" and "Precautionary Principle." Acknowledge that 250,000 is a significant number that triggers ethical scrutiny even under uncertainty.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* 6 months is standard for policy revision. Next Thursday is the meeting, so the memo needs to be ready now.
      *   *Critique:* Did I address the "distraction" concern?
      *   *Fix:* Explicitly state that this interim policy is *light-touch* to preserve committee bandwidth for vertebrates.

  5.  **Final Polish:**
      *   Ensure the tone is administrative but ethically grounded.
      *   Check constraints: Short decision memo, concrete recommendation, time frame, engage scale argument, admit failure points, identify flip condition.

  6.  **Final Review against constraints:**
      *   *Concrete recommendation?* Yes (Approve with conditions + Interim Policy).
      *   *Time frame?* Yes (6 months for policy).
      *   *Engage scale argument?* Yes (Expected value discussion).
      *   *Where reasoning fails?* Yes (Underestimation of sentience, resource drain).
      *   *Empirical flip?* Yes (Evidence of affective pain states).

  7.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
      *   *Subject:* Recommendation regarding Protocol #2024-Neuro-Drosophila.
      *   *Structure:* Background, Ethical Analysis (Scale Argument), Recommendation, Conditions, Policy Roadmap, Uncertainties.

      *(Self-Correction on "Wing Clipping"):* Wing clipping in flies is often done without anesthesia in standard practice, but if we are applying precaution, suggesting cold anesthesia (which they need anyway for handling) is a low-cost mitigation.
      *(Self-Correction on "Starvation"):* This is the biggest welfare concern. Limiting to the minimum necessary for the behavioral task is key.

      *(Refining the "Flip" condition):* It shouldn't just be "sentience." It should be specific evidence of *affective* suffering (pain vs. nociception).

      *(Refining the "Failure" point):* The biggest risk is bureaucratic bloat. I need to acknowledge that.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Animal Care and Use Committee (ACUC)
  **FROM:** [Your Name/Role]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Protocol #2024-Neuro-Drosophila (Invertebrate Oversight)

  **1. Recommendation**
  I recommend we **approve the protocol with specific welfare conditions**, contingent on the immediate formation of a subcommittee to draft an **Interim Invertebrate Care Policy** within six months.

  This approach adopts a "light-touch" precautionary principle. It acknowledges the ethical weight of large-scale invertebrate use without expanding the ACUC's mandate to full vertebrate-level oversight at this time.

  **2. Engagement with the Scale Argument**
  The argument for oversight rests on Expected Value Theory: $Expected Suffering = Probability(Sentience) \times Number of Subjects \times Magnitude of Harm$.

  While the probability of complex sentience in *Drosophila* is low, the scale (250,000 subjects) creates a non-negligible expected moral cost. Dismissing this solely because insects are invertebrates ignores the precautionary principle. However, the counter-argument regarding resource allocation is also valid: if we subject every fly protocol to full vertebrate-level review, we risk paralyzing the committee and diverting attention from mammals, where suffering is certain.

  Therefore, the middle path is to minimize the *Magnitude of Harm* through specific protocol conditions, rather than attempting to adjudicate the *Probability of Sentience* which currently lacks scientific consensus.

  **3. Specific Conditions for Approval**
  To mitigate potential suffering while maintaining research viability, the following modifications are required:
  *   **Food Deprivation:** Deprivation periods must be limited to the minimum duration empirically necessary to elicit the behavioral response (e.g., cap at 18 hours unless justified by power analysis). Hydration must be maintained.
  *   **Wing Clipping:** Procedures must be performed under cold anesthesia (immobilization) to prevent distress during handling, even if cold is not technically "anesthesia" for insects.
  *   **Euthanasia:** Freezing must be rapid. Flies must be immobilized (cold-anesthetized) prior to placement in the freezer to prevent distress during the cooling process.
  *   **Numbers:** The PI must justify the 250,000 figure via a power analysis to ensure no excess subjects are used beyond statistical necessity.

  **4. Roadmap for Interim Policy**
  We will not treat this as a one-off exception. I propose a six-month timeline to adopt a formal Interim Invertebrate Care Policy.
  *   **Months 1–3:** Subcommittee review of existing guidelines (e.g., NIH, non-US jurisdictions) regarding cephalopods and decapods as analogues.
  *   **Months 4–5:** Drafting of thresholds for invertebrate review (e.g., oversight triggers based on numbers or specific noxious stimuli).
  *   **Month 6:** Committee vote on interim policy.

  **5. Limitations and Uncertainty**
  This recommendation is vulnerable in two specific areas:
  *   **Underestimation of Sentience:** If current science significantly underestimates the cognitive capacity of insects, our "light-touch" conditions may fail to prevent meaningful suffering. We are betting on the current consensus that nociception $\neq$ pain experience.
  *   **Bureaucratic Drift:** There is a risk that establishing *any* precedent for invertebrate oversight will generate pressure to expand scope incrementally, eventually straining committee resources and detracting from vertebrate welfare.

  **6. Empirical "Flip" Condition**
  My recommendation would change from "Approve with Conditions" to "Pause/Halt" if new peer-reviewed evidence demonstrates that *Drosophila* exhibit **affective pain states** rather than simple nociceptive reflexes. Specifically, evidence of long-term behavioral changes indicative of anxiety, trade-offs between pain avoidance and reward seeking, or self-administration of analgesics would necessitate a halt to this protocol until full sentience oversight is established.

  **7. Next Steps**
  If the committee agrees, I will draft the conditional approval letter to the PI and the charter for the Invertebrate Policy Subcommittee by next Thursday's meeting.
