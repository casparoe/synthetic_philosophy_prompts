answer: |-
  Your diagnosis captures the surface dialectic but fails to explain the persistence of the stalemate. If the dispute were merely between a criterion of rightness and a deliberative procedure, it would have dissolved decades ago. Utilitarian defenders (like J.J.C. Smart and R.M. Hare) explicitly conceded this distinction, arguing that utilitarianism provides the standard for judging actions, not necessarily a conscious algorithm for every decision. The debate continues because Williams’s objection survives this concession. He argues that even if a utilitarian agent saves their wife through instinct, the *justificatory structure* of the theory still renders their personal projects subordinate to an impartial calculus. The threat is not psychological pain during deliberation, but normative alienation from one’s own life.

  Therefore, the actual structure of the dispute is **metatheoretical**. It is a clash over the standpoint of moral theory itself. Utilitarians assume morality requires an external, "god's-eye" view to assess states of affairs impartially. Williams argues that moral theory must be intelligible from within the first-personal perspective of the agent whose identity is constituted by "ground projects." The utilitarian sees the agent as a locus of satisfaction; Williams sees the agent as a locus of meaning. Because each side rejects the other's foundational conception of what moral philosophy is *for*—ranking outcomes versus making sense of agency—they talk past one another. The utilitarian thinks Williams is confused about theory vs. practice; Williams thinks the utilitarian is confused about agency.

  Progress is unlikely because resolving this requires one side to abandon a bedrock commitment: either the requirement of strict impartiality or the requirement that morality respect the constitutive projects of the self. Hybrid theories attempt to bridge this, but they typically collapse back into one horn or the other when forced to prioritize in extreme cases. The impasse is not a failure of argumentation but a reflection of incompatible visions of normative authority.

  \answer{Metatheoretical}
