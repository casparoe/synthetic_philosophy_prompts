answer: |-
  The gun felt heavier than lead. It felt like gravity itself had condensed into the steel of the pistol resting on the concrete table.

  Elias stood in the center of the warehouse, the dust motes dancing in the shafts of light cutting through the boarded windows. Opposite him stood Commander Vark. Vark didn't look like a monster; he looked like an accountant. He held a tablet, checking a watch.

  Behind Vark, kneeling in a line, were five medics from Elias's own unit. They wore the white armbands, the same as Elias. They were non-combatants. Protected. Sacred.

  Behind Elias, kneeling alone, was a boy. No older than twelve. A local civilian caught in the crossfire. He was shaking, a low whimper escaping his throat.

  "The terms are simple, Elias," Vark said, his voice echoing off the corrugated metal walls. "You are the Warden of the Oath. We know your reputation. You do not break the Covenant."

  Elias said nothing. The Covenant was absolute: *No Warden shall take an innocent life. To do so is to cease to be a Warden. To cease to be human.*

  "Five of your people," Vark continued, gesturing to the kneeling medics. "For one of theirs." He nudged the boy with his boot. The boy flinched.

  "If you refuse," Vark said, "my men will execute the five medics. Immediately. If you accept... you take the gun. You put one bullet in the boy. The medics walk. You walk. The boy dies."

  Elias closed his eyes. The math was simple. One death versus five.

  *If the goal is to preserve life,* a voice whispered in his head, *then saving five is better than saving one. If the Oath exists to protect the sanctity of life, then surely allowing five deaths is a greater violation of that sanctity than allowing one.*

  That was the itch. The paradox. It scraped against the inside of his skull.

  "If I do this," Elias said, his voice rough, "I become a murderer."

  "If you don't," Vark countered smoothly, "you become the reason five murderers are made. My men will pull the triggers, Elias. But you will have held the door open for them. You will have chosen their deaths when you had the power to prevent them."

  Vark stepped closer. "You Wardens talk about 'inviolability.' You say every person has a right not to be used. But by standing there with your clean hands, you are using those five medics. You are using their lives to purchase your own moral purity."

  Elias looked at the medics. He knew them. Sarah, who had stitched his arm last month. David, who shared his rations. They were looking at him. Not with anger, but with a desperate, terrified hope. *Save us,* their eyes said. *You have the power.*

  Then he looked at the boy. The boy was looking at the floor, tears cutting tracks through the dust on his cheeks. He was nobody. Just a life.

  *If I kill him,* Elias thought, *I violate the Oath. I cross the line that separates civilization from the slaughterhouse. I make myself a tool of death.*

  *But if I don't,* the voice returned, louder now, *five people die. Five violations of the Oath occur. Five souls extinguished. Isn't the Oath supposed to stop death? Why does it matter who pulls the trigger if the result is more blood?*

  It felt like a trap designed by a cruel god. The rule was meant to protect people. But following the rule meant more people would die.

  "Time," Vark said. He raised his own pistol, aiming it at Sarah's head. "Thirty seconds."

  Elias's hand hovered over the table. The steel of the gun was cold.

  If he picked it up, he saved five lives, but he destroyed the principle that made those lives worth saving. He acknowledged that some lives are expendable currency. He became the accountant.

  If he left it, he honored the principle that a human being is never a means to an end. But he let five people burn to keep his own soul unblemished.

  "Ten seconds," Vark said.

  Elias looked at his hands. They were trembling.

  *It's not about the math,* he told himself. *It's about the agency. I am not responsible for Vark's evil. I am only responsible for mine.*

  But the counter-argument screamed back: *You are present. You have leverage. You are part of the causal chain. To stand aside is to act.*

  "Five."

  Sarah closed her eyes.

  "Four."

  The boy whimpered again. A small, broken sound.

  Elias realized then why the paradox hurt so much. It wasn't confusion. It was the realization that morality might not be a coherent system. It was the realization that he could do the "right" thing according to the rules, and still feel like he was committing a atrocity. Or he could do the "good" thing by the numbers, and destroy the very concept of right and wrong.

  "Three."

  Elias's fingers brushed the grip of the pistol. It felt like touching a live wire.

  "Two."

  He thought of the Oath. *Inviolability.* It meant that the boy had a right not to be killed, regardless of the utility of his death. It meant the boy was not a number.

  But the five medics were not numbers either.

  "One."

  Elias gripped the gun. The weight of it pulled his arm down. He looked at Vark. He looked at the boy.

  He understood now. The paradox wasn't a puzzle to be solved. It was a burden to be carried. Whichever way he chose, a part of the world would break. Either the rule would break, or the people would.

  Elias lifted the gun.

  The warehouse went silent. The dust seemed to stop dancing.

  He wasn't saving the five. He wasn't killing the one. He was making a statement about what kind of universe he was willing to live in. One where you can kill to save? Or one where you cannot kill, even to save?

  He turned the barrel.

  Not toward the boy.

  But not toward Vark, either.

  He aimed it at the concrete floor and pulled the trigger.

  *Bang.*

  The sound was deafening. The medics flinched. The boy cried out. Vark didn't move.

  "You wasted the shot," Vark said, his face hardening. "That wasn't the deal."

  "I know," Elias said, his hand still shaking, the smoke rising from the barrel. "I won't kill him."

  "Then they die." Vark raised his weapon.

  "I know," Elias said. He dropped the gun. It clattered loudly on the concrete. He stepped between Vark and the medics, spreading his arms. He wore the white armband. He was a shield. "But I won't be the one who kills."

  Vark stared at him. For a moment, the logic of the paradox hung in the air, unresolved, heavy and suffocating. Elias had chosen to let five die rather than kill one. He had chosen to have blood on his hands by omission, rather than by commission.

  He felt sick. He felt like a monster. He felt like he had failed the five people behind him.

  But as Vark's finger tightened on the trigger, Elias felt one thing clearly. He had not become the thing he fought.

  The gunshot cracked through the warehouse.

  Elias fell.

  He hit the dust, the world fading to gray. The last thing he heard wasn't the screaming of the medics, or the triumph of Vark. It was the silence of his own conscience. It was clean.

  And it was heavy enough to crush him.
