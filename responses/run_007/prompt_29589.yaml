  Regarding scholarly consensus, there is no settled result, but the dominant critique comes from egalitarians like G.A. Cohen. Cohen argues that Nozick conflates liberty with capitalist property rights; restricting Chamberlain's accumulation is not a violation of liberty per se, but a definition of the scope of property rights themselves. On this contested reading, Nozick assumes the very entitlement theory he aims to prove, making the Chamberlain scenario circular for anyone not already committed to self-ownership. Consequently, the argument is widely seen as shifting the burden of proof rather than decisively refuting patterned principles. It forces patterned theorists to explain why interference is justified, but it does not logically compel them to abandon patterns unless they accept Nozick's prior moral axioms.

  The strongest line of resistance, therefore, is to deny that the voluntary transfers in D2 preserve the relevant moral conditions for justice. A patterned theorist might argue that background conditions (like equal opportunity or need) must be maintained continuously, meaning the "voluntary" choice to pay Chamberlain occurs within a constrained framework designed to preserve D1's justice. This is a contested interpretation of whether such constraints constitute oppression or legitimate democratic regulation. Ultimately, the Chamberlain argument succeeds as an internal critique of how patterns function under libertarian assumptions, but it fails as a standalone disproof of patterned justice because it presupposes that property rights trump distributive outcomes—a premise that is the very subject of the debate.
