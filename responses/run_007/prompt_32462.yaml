  1. Churchland contends that this objection begs the question by assuming folk psychology is the only valid framework for evaluating whether a theory is accepted.
  2. He proposes that neurocomputational states can fulfill the functional role of believing without being the propositional attitudes folk psychology describes.
  3. The theory predicts that future neuroscience will explain theoretical reasoning and assertion without invoking folk psychological categories at all.
  4. Eliminating beliefs does not eliminate the brain states that cause us to assert the theory, but merely provides a more accurate redescription of those physical processes.
  5. Just as physicists didn't stop theorizing when phlogiston was eliminated, neuroscientists can continue arguing without requiring the existence of folk psychological entities.
