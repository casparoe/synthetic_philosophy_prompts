answer: |-
  Dear Friend,

  It is completely understandable why you found your friend's argument so compelling, as the strategy-stealing argument is one of the most elegant proofs in combinatorial game theory. It feels almost magical that you can prove a winning strategy exists without ever having to describe what that strategy actually is. However, your intuition that something changes between the claim that the second player has no winning strategy and the claim that the first player has one is exactly right. The step you should reject is the very first one, where your friend claims that in any finite game with perfect information and no chance, one of the two players must have a winning strategy. This statement is only true if the game cannot end in a draw. In games where a draw is possible, such as tic-tac-toe, Zermelo's theorem tells us that either the first player can force a win, the second player can force a win, or both players can force a draw. By assuming away the possibility of a draw at the very beginning, your friend's argument sets up a false dichotomy for games like tic-tac-toe.

  When you apply the strategy-stealing logic to a game that allows draws, the contradiction you reach is not that the second player cannot have a winning strategy, but rather that the second player cannot force a win. This leaves open the possibility that the second player can force a draw, which is exactly what happens in tic-tac-toe. The strategy-stealing argument successfully proves that the first player in tic-tac-toe can never lose if they play perfectly, but it does not prove they can win. The leap from the second player having no winning strategy to the first player having a winning strategy is only valid if you have already established that a draw is impossible. So, the error in your friend's reasoning regarding tic-tac-toe is not in the stealing mechanism itself, but in applying a premise about undrawable games to a game that is famously drawish with perfect play.

  Your suspicion about the harmless-extra-piece assumption is also well-founded, though it plays a different role than the no-draws condition. This assumption is technically known as monotonicity, and it requires that having an extra piece on the board is never a disadvantage for the player who owns it. This is the engine that makes the stealing work in step four of your friend's list. If a game contains situations where having an extra piece could hurt you, such as zugzwang in chess or certain capture rules in go, the first player cannot simply ignore the occupied square and play elsewhere because that extra piece might block a vital line or force a disadvantageous move. Therefore, for the strategy-stealing argument to function at all, the game must satisfy this monotonicity condition. If you give up this assumption, the argument collapses completely, even for games like Hex, because the first player could no longer guarantee that mimicking the second player's strategy while holding an extra piece would lead to a win.

  In the case of Hex, you do not actually have to give up the conclusion that the first player wins, because Hex satisfies both critical requirements that your friend glossed over. First, it is a mathematical fact that Hex cannot end in a draw; the board must be fully colored with a connecting path for one player or the other. Second, Hex is monotonic because placing an extra stone of your color never disrupts your own connectivity or helps your opponent. Since Hex meets the no-draws condition, the first step of the argument holds true for it, and since it meets the monotonicity condition, the stealing mechanism works. The cost of rejecting the universal application of the first step is simply that you must verify the no-draws property for each new game you encounter. For Hex, that verification is already done, so the conclusion remains safe. For tic-tac-toe, the verification fails, and so the conclusion that the first player wins must be discarded in favor of the weaker conclusion that the first player can at least draw.

  Ultimately, the strategy-stealing argument is a powerful tool, but it is conditional rather than universal. It requires you to confirm two distinct properties before you can declare a first-player win. You must ensure that the game rules make a draw impossible, and you must ensure that having an extra piece on the board is never a liability. Your friend's mistake was treating the no-draws condition as a default feature of abstract games rather than a specific property that must be checked. By separating these conditions, you can see why the argument correctly predicts a first-player win in Hex but only predicts a non-loss in tic-tac-toe. I hope this helps clarify where the logic holds and where it bends, and I look forward to hearing about your next game night.

  Best regards,

  Your Assistant
