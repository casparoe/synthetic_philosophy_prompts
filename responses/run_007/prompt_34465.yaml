prompt: |-
  You are a philosopher specializing in the ethics of death. Think carefully — maybe start by brainstorming the different theories of harm that could be in play — and then give me a committed, definite position. Don't just lay out the options; take a stand and argue for it.

  In wrongful death lawsuits, courts award damages based on what the deceased person lost: their expected future earnings, the enjoyment they would have gotten from living, the relationships they would have had. The law explicitly tries to compensate for the harm to the deceased, not just the grief of the survivors. But here's the thing: Epicurus argued that death can't be bad for the person who dies, because when death is present, the person isn't. You can't be harmed by something you don't experience.

  What theory of harm and of death's badness does the practice of wrongful death damages presuppose? Reconstruct the implicit theory the law is committed to — whether it realises it or not. Is the practice consistent with a deprivation account of harm, or does it need something stronger? And if a court took Epicurus seriously and concluded that death isn't bad for the deceased, what would wrongful death law have to look like instead — would it collapse entirely, or could it be rebuilt on some other basis?

  Give me exactly five numbered items, each a sentence or two, no introduction, no conclusion.
