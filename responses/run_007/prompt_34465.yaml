  3. If courts rigorously applied Epicurus's argument that death cannot harm the non-existent, the current framework for compensating lost earnings and enjoyment would collapse because there would be no subject to whom those losses could be attributed.
  4. The system would not vanish entirely but would have to be rebuilt solely on the basis of harms to surviving relatives, transforming wrongful death from a violation of the victim's rights into a mere tort against the grieving family.
  5. I maintain that the deprivation account is philosophically sound and the law is correct to treat death as a severe harm to the deceased, because persons are temporal beings whose interests extend beyond the present moment of consciousness.
