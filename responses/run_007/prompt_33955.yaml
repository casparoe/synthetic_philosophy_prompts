  **MEMORANDUM**

  **TO:** Dean of Faculty, [University Name]
  **FROM:** Chair, Academic Integrity Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Case #23-409 (Student: J. Doe, Course: PHIL 305)

  **1. SUMMARY OF CASE**

  The Academic Integrity Panel convened on October 20 to review a alleged violation of academic integrity involving a third-year Cognitive Science major. During a closed-book final examination for *Philosophy of Mind*, the student was found in possession of a spiral notebook containing detailed summaries of course readings. 

  The student admitted to possessing and consulting the notes but contested the classification of this act as "cheating." In a written defense, the student invoked the Extended Mind Thesis (EMT), specifically the parity principle articulated by Clark and Chalmers (1998). The student argued that because the notebook functioned as a reliable, accessible external store of information, it constituted a part of his cognitive system. Therefore, prohibiting the notebook while permitting biological memory arbitrarily privileges the "skin-skull boundary," contradicting the core theoretical framework of the course itself.

  **2. PANEL DELIBERATION**

  The Panel was evenly divided. 

  One faction argued that the exam instructions constitute a constitutive rule set. By enrolling and sitting for the exam, the student entered a specific "language game" where "memory" is institutionally defined as neural recall. Under this view, the student's argument is a category mistake: an exam measures internalized competency, not distributed cognitive systems.

  The opposing faction argued that dismissing the EMT defense undermines the university's commitment to critical inquiry. If a student applies a course theory to a course assessment and is punished for it, we risk signaling that philosophical reasoning is welcome only when it remains abstract. One panel member, the course instructor, noted the argument demonstrated a mastery of the material superior to typical undergraduate work.

  **3. ANALYSIS OF THE EXTENDED MIND DEFENSE**

  The Panel has engaged the student's argument on its own terms. We acknowledge the philosophical strength of the EMT position. The parity principle suggests that if a tool functions in the world as memory functions in the head, it should be treated as part of the mind. 

  However, the Panel distinguishes between *ontological claims* about cognition and *institutional contracts* regarding assessment. 

  An examination is not a naturalistic observation of a student's cognitive process; it is a stylized performance with specific constraints designed to measure a specific variable: the retention and synthesis of information within the biological organism. The "closed-book" rule is not a metaphysical statement about where the mind ends; it is a methodological constraint, similar to how a physicist might isolate a variable in a vacuum. 

  To allow the notebook would not be to acknowledge the student's mind; it would be to change the variable being measured. If the exam is designed to test neural retention, introducing external storage invalidates the metric. Therefore, the use of the notebook violates the operational definition of the assessment, regardless of the metaphysical status of the notebook.

  **4. RECOMMENDATION AND SANCTION**

  **Finding:** The Panel finds the student **Responsible** for a violation of academic integrity (Unauthorized Aid).

  **Sanction:** The Panel recommends a **Formal Warning with No Disciplinary Record**. 

  **Rationale:** 
  While the technical violation stands (the rules of the assessment were breached), the *intent* element of academic dishonesty is mitigated. Traditional cheating involves an intent to deceive to gain an unearned advantage. Here, the student's intent was to test a philosophical boundary in good faith. 

  Standard sanctions for this violation typically include a failing grade in the course and a permanent disciplinary record. The Panel recommends waiving the disciplinary record and leaving the grade penalty solely to the discretion of the course instructor (who may, at their discretion, allow a re-sit or weigh the exam differently). This outcome threads the needle: it upholds the integrity of the examination process (rules must be consistent for all students) while acknowledging that this was an act of intellectual risk-taking rather than moral turpitude.

  **5. THE STRONGEST OBJECTION TO THIS RECOMMENDATION**

  In the interest of full transparency, the Panel wishes to register the strongest objection to this outcome, raised by the minority faction. 

  **The Objection:** By upholding the violation, even with a mitigated sanction, the University effectively adjudicates a metaphysical dispute. We are ruling that the "skin-skull boundary" is the legitimate boundary for assessment, thereby institutionalizing a form of "cartesian cognitivism" that the course itself critiques. 

  The risk is a "chilling effect" on interdisciplinary application. If students learn that applying course theory to course structure results in an integrity violation, they may retreat to safe, rote interpretations of material. We risk teaching students that philosophy is a game played only on paper, not a lens through which to view institutional structures. By punishing the student, we may be prioritizing administrative convenience over the very critical thinking skills we claim to value.

  **6. CONCLUSION**

  The Panel believes the recommended sanction balances these concerns. It maintains the consistency required for fair assessment (all students must follow the same exam rules) without branding the student as dishonest. We recommend the Dean accept this finding and encourage the Department of Philosophy to consider this case when designing future assessments—perhaps by creating "open-resource" exams that align better with extended cognition theories, thereby avoiding this conflict in the future.

  Respectfully submitted,

  [Your Name]
  Chair, Academic Integrity Panel
