      *   *(1) Longtermism + (7) Fanaticism vs. (6) Side-Constraints:* If the far future EV is astronomical (1) and tiny probabilities swamp near-term costs (7), then *any* near-term harm (forbidden by 6) could be justified if it reduces s-risk probability even slightly. (6) explicitly forbids this.
      *   *(2) Asymmetry vs. (1) Longtermism:* Standard longtermism often assumes total utilitarianism (more happy lives = good). Strong asymmetry (negative utilitarianism leanings) changes the *sign* of the long-term value. If the future is likely net positive, longtermism says "expand it." If asymmetry holds, the future might be net negative, so longtermism might say "shut it down." This isn't a contradiction, but it changes the *direction* of the imperative.
