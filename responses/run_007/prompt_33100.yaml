          *   (6) explicitly protects near-term interests (rights, harms, tech freedom) *against* the astronomical stakes ("Despite the astronomical stakes...").
          *   *Verdict:* Genuine, severe tension. This is the "Objectionable Implications of Longtermism" problem.

      *   **Tension C: Asymmetry vs. Longtermist Trajectory (2 vs. 1).**
