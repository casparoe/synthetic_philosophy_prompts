prompt: |-
  I'm a software engineer and I've been thinking about something that's bugging me. In my work I deal with mathematical objects all the time — types, functions, algebraic structures — and I've always implicitly assumed they're real in some sense, not just notations we made up. But then I stumbled on Benacerraf's dilemma and it's been rattling around in my head.

  The way I understand it: if mathematical objects are abstract and causally inert (they don't push or pull on anything in the physical world), then how the hell do we come to know anything about them? Knowledge usually requires some kind of causal connection between the knower and the thing known. So either math knowledge isn't really knowledge, or mathematical objects aren't really abstract and causally inert in the way platonists say.

  What I want to understand is: what are the actual moves people make to get out of this? Like, do they bite the bullet on the epistemology side and say math knowledge is somehow non-causal? Do they bite the bullet on the metaphysics side and say numbers are physical after all? Do they deny that knowledge requires causal connection? And crucially — which horn of the dilemma do most working mathematicians actually live on, even if they'd never phrase it that way?

  Start with your bottom line in the first sentence and then walk me through it — no preamble, no restating the question.
