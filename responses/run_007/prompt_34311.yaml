answer: |-
  Most working mathematicians pragmatically live on the Platonist horn by treating objects as real, while philosophers typically escape the dilemma by either rejecting the requirement for causal knowledge or denying that mathematical objects are abstract entities.

  The first move is to attack the epistemological premise that knowledge requires causal contact. Philosophers like Gödel or contemporary rationalists argue that mathematical intuition is a genuine faculty of perception, just not a physical one. They bite the bullet and claim we access abstract objects through reason alone, much like you might "see" the correctness of a recursive algorithm without physically touching the code. This preserves Platonism but requires accepting a kind of mystical or non-naturalistic epistemology that sits uncomfortably with a scientific worldview.

  The second move is to attack the metaphysical premise by denying abstract objects exist at all. This includes Formalism, which treats math as symbol manipulation games (like syntax without semantics), and Fictionalism, which argues mathematical statements are useful fictions that are literally false but instrumentally valuable. For a software engineer, this is akin to saying types don't exist at runtime; they are compile-time constraints we invented to prevent errors, not discovered entities. This solves the access problem because you don't need to access what isn't there, but it struggles to explain why math is so unreasonably effective at describing physical reality.

  The third move, which is increasingly popular, is Structuralism. This view claims mathematical objects aren't independent entities but rather "places" in a larger structure. The number 3 isn't a thing; it's the third position in the natural number structure. This addresses Benacerraf's identity problem (which specific set theoretic construction *is* the number 3?) and softens the epistemic problem: we don't need to access abstract objects, we only need to grasp the structural relations, which can be modeled physically. For you, this is like distinguishing between an interface and its implementation; the math is the interface, and any consistent structure implements it.

  The fourth move is Naturalized Epistemology, specifically the Quine-Putnam indispensability argument. This argues that since mathematical entities are indispensable to our best scientific theories, and we should be committed to the existence of all entities indispensable to those theories, we must accept mathematical objects. Knowledge of them is confirmed holistically along with physics, not via direct causal contact. This allows you to keep the objects but grounds their justification in empirical science rather than mysterious intuition.

  Regarding working mathematicians, surveys and sociological studies show the vast majority operate as naive Platonists in their daily practice. They speak of "discovering" theorems, not inventing them, and feel constrained by an external reality when proving results. However, they typically treat the metaphysical implications as irrelevant to the work, effectively ignoring the dilemma rather than solving it. They live on the Platonist horn because it is the most productive mindset for research, even if they cannot explain the metaphysics to a philosopher's satisfaction.
