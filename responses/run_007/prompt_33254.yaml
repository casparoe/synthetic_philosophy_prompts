  This is a sophisticated exercise in **reflective equilibrium**. You are rightly skeptical of "one metric fits all" approaches, given the mathematical incompatibility of fairness criteria (the Impossibility Theorem). Your case-by-case method is the most honest way to navigate this, but as you suspect, without a unifying principle, it risks becoming ad hoc rationalization.

  I believe there is a coherent principle that captures the majority of your verdicts, though it will force you to confront a significant tension in your criminal justice vs. child welfare judgments.

  ### The Principle: Institutional Obligation Alignment

  **Statement:** *The appropriate fairness metric is determined by the primary moral obligation of the institution deploying the model, specifically regarding the **default status** of the individual subject to the decision.*

  This principle distinguishes between three types of institutional obligations:

  1.  **Epistemic Fidelity (Truth-Telling):** When the institution acts as a fiduciary for physical safety or liberty, and the **default status** is a fundamental right (health, freedom), the model must not distort reality. Miscalibration here constitutes a lie that corrupts the decision-maker's ability to protect that right.
      *   *Metric:* **Calibration.**
  2.  **Distributive Remediation (Access):** When the institution distributes social goods or opportunities, and the **default status** is exclusion (no job, no seat), the model must correct for historical systemic barriers. The primary harm is disparate exclusion.
      *   *Metric:* **Equalized Odds / Demographic Parity.**
  3.  **Procedural Consistency (Status Integrity):** When the institution confers a specific legal or financial status, or exercises intrusive state power where the **default status** is privacy/autonomy, the *meaning* of the decision or the *burden* of the process must be uniform.
      *   *Metric:* **Predictive Parity / Equalized Odds.**

  ---

  ### Application to Your Cases

  Here is how this principle maps onto your six verdicts:

  | Case | Default Status | Institutional Obligation | Your Metric | Principle Fit |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Pretrial** | **Liberty** | **Epistemic Fidelity.** The judge must weigh liberty vs. safety. If the risk number is miscalibrated, the judge cannot honor the presumption of innocence. | Calibration | **Strong Fit.** |
  | **2. Admissions** | **Exclusion** | **Distributive Remediation.** The university distributes opportunity. The harm is missing qualified candidates from marginalized groups. | Equalized Odds | **Strong Fit.** |
  | **3. Hiring** | **Exclusion** | **Distributive Remediation.** The employer controls access to livelihood. Historical exclusion demands parity in access to the next stage. | Demographic Parity | **Strong Fit.** |
  | **4. ER Triage** | **Health/Life** | **Epistemic Fidelity.** Medical reality cannot be distorted for social engineering. A risk score is a physiological claim. | Calibration | **Strong Fit.** |
  | **5. Lending** | **No Contract** | **Procedural Consistency.** A loan is a contract. "Creditworthy" must mean the same risk profile for all parties to ensure fair terms. | Predictive Parity | **Strong Fit.** |
  | **6. CPS** | **Family Privacy** | **Procedural Consistency.** The state intrudes on privacy. The *burden* of investigation must be distributed equally, regardless of base rates. | Equalized Odds | **Strong Fit.** |

  ### The Tension: Where You May Need to Revise

  The principle reveals a sharp tension between **Case 1 (Pretrial)** and **Case 6 (CPS)**.

  Both involve the state exercising power over an individual's liberty or family integrity. In both cases, the "default" is a right (Liberty in Pretrial, Family Unity in CPS).
  *   In **Pretrial**, you prioritized **Calibration** (Epistemic Fidelity). You argued the Judge needs the truth to balance rights.
  *   In **CPS**, you prioritized **Equalized Odds** (Procedural Consistency). You argued the family needs protection from disparate scrutiny.

  **The Conflict:** If base rates of "failure to appear" and "neglect" differ across groups due to systemic factors (poverty, policing bias), **Calibration preserves those disparities**, while **Equalized Odds suppresses them.**
  *   By choosing Calibration in Pretrial, you accept that Group A might be detained at higher rates than Group B if their calibrated risk scores are higher, even if those scores reflect biased underlying data (e.g., over-policing).
  *   By choosing Equalized Odds in CPS, you accept that the risk scores will be *miscalibrated* (a "high risk" flag means different probabilities for different groups) to ensure equal investigation rates.

  **Revision Recommendation:**
  To achieve coherence, you must decide whether **State Power** contexts prioritize *Truth* (Calibration) or *Equal Burden* (Equalized Odds).
  *   **If you stick with Pretrial (Calibration):** You should arguably revise **CPS to Calibration**. If the state removes children, it must be based on the *truest possible estimate of danger*, not a statistically adjusted one. Miscalibration here risks leaving children in danger (if scores are inflated for one group) or unnecessary intrusion (if deflated).
  *   **If you stick with CPS (Equalized Odds):** You should arguably revise **Pretrial to Equalized Odds**. If the harm of disparate incarceration is the priority, then equalizing error rates is more important than the "truth" of the risk score, especially if that "truth" is contaminated by biased policing data.

  **Most Defensible Cluster:**
  The **Medical/Epistemic Cluster (ER, Pretrial)** is the most robust defense for Calibration. In medicine, physiological reality is the anchor. In criminal justice, the anchor is murkier. If you view Pretrial risk as akin to medical prognosis (a factual prediction of behavior), Calibration holds. If you view it as a allocation of liberty (a social good), Equalized Odds holds. Given your ER verdict, your intuition leans toward **Epistemic Fidelity for Safety/Liberty**. I recommend aligning CPS with this if you view child safety as the paramount "medical" reality, or aligning Pretrial with CPS if you view both as matters of **Disparate State Scrutiny**.

  ### Prediction for a New Case

  **Case: Algorithmic Eligibility for Disability Benefits.**
  *   **Context:** A government agency uses a model to screen applicants for disability income support.
  *   **Default Status:** Exclusion (No benefits).
  *   **Institutional Obligation:** Distributive Remediation (Social Safety Net).
  *   **Principle Prediction:** **Equalized Odds (specifically minimizing False Negatives).**
  *   **Reasoning:** Like Admissions and Hiring, this is a gatekeeper to a vital social good. The moral priority is ensuring that qualified individuals from marginalized groups (who may have less access to documentation or medical advocacy) are not systematically denied. Miscalibration is acceptable if it means expanding access to those who truly need it, similar to your Admissions verdict.

  ### Summary of Verdicts

  Your intuitions are **85% coherent** under the **Institutional Obligation Alignment** principle.
  *   **Keep:** ER, Admissions, Hiring, Lending. (These clearly map to Epistemic vs. Distributive vs. Contractual obligations).
  *   **Re-evaluate:** The Pretrial vs. CPS inconsistency. You currently treat "Liberty" (Pretrial) as requiring Truth, but "Family Privacy" (CPS) as requiring Equal Burden. Both are fundamental rights against state intrusion. Choose one lane: either **State Safety requires Truth (Calibration for both)** or **State Scrutiny requires Equality (EO for both).**

  This approach allows you to retain your bottom-up wisdom while providing a top-down justification that survives contact with the impossibility results: you are not trying to satisfy all metrics, but rather selecting the metric that protects the specific moral vulnerability inherent to that institution's function.
