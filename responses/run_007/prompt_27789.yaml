answer: |-
  # Activity Plan: The "Black Box" Verification Protocol

  **Course:** Upper-Level Undergraduate Seminar in Social Epistemology
  **Topic:** Epistemic Dependence, Understanding, and AI
  **Class Size:** 15 Students
  **Duration:** 75 Minutes

  ## 1. Activity Overview
  This activity simulates the transition from manual cognitive labor to automated reliability. Students learn a specific, arbitrary algorithm for validating numerical codes. In the second phase, they are given access to an "Auto-Verify" system (you, the instructor) that provides correct validation digits instantly without requiring them to show work. In the final phase, the system "crashes," and they are tested on their ability to manipulate the underlying logic, not just reproduce outputs.

  The goal is to induce a state of **epistemic fragility**: students will possess correct information (knowledge) but lack the structural grasp (understanding) required to intervene when the system fails or changes.

  ## 2. Materials Needed
  *   **Handout A (Training):** Explains the "Validation Algorithm" with two worked examples.
  *   **Handout B (Production):** Contains 10 "Base Numbers" requiring a "Check Digit." Includes space for work.
  *   **Handout C (The Glitch):** Contains 3 problems that require reverse-engineering or error-spotting (cannot be solved by looking up answers).
  *   **Pencils/Pens.**
  *   **Instructor Prep:** You must memorize the algorithm perfectly to act as the "Oracle" without hesitation.

  **The Algorithm (The "Mod-7 Weighted Sum"):**
  1.  Take a 4-digit Base Number (e.g., 4-2-9-1).
  2.  Multiply each digit by its position (1st digit × 1, 2nd × 2, 3rd × 3, 4th × 4).
  3.  Sum the results.
  4.  Divide the sum by 7. The **Remainder** is the Check Digit (0–6).
      *   *Example:* 4-2-9-1 → (4×1) + (2×2) + (9×3) + (1×4) = 4 + 4 + 27 + 4 = 39.
      *   39 ÷ 7 = 5 remainder **4**. Check Digit = 4.

  ## 3. Timeline & Rules (75 Minutes)

  ### Phase 0: Entry & Setup (0:00–0:05)
  *   **Action:** Hand out **Handout A** as students enter. Do not mention AI, epistemology, or the point of the class.
  *   **Script:** "Good morning. Today we're doing a procedural workshop on verification protocols. Please read Handout A silently. We will work through the examples together in five minutes."
  *   **Vibe:** Keep it dry and administrative. This is a "skills session," not a philosophy discussion.

  ### Phase 1: Calibration (0:05–0:15)
  *   **Action:** Walk through the two examples on Handout A on the board. Ask students to solve a third one together on the board to ensure competency.
  *   **Goal:** Ensure every student is *capable* of doing the math manually. This establishes a baseline of competence.
  *   **Check:** Walk around. Confirm everyone has the correct answer for the practice problem.

  ### Phase 2: Production & The Oracle (0:15–0:35)
  *   **Action:** Distribute **Handout B** (10 problems).
  *   **Script:** "You now have 10 codes to validate. In a professional setting, efficiency is key. For this batch, you are authorized to use the 'Auto-Verify' system. That means me. If you choose, you may hand me a Base Number, and I will give you the correct Check Digit immediately. You do not need to show your work. You just need to record the correct digit. You may also calculate them manually if you prefer. You have 15 minutes."
  *   **Dynamic:**
      *   Most students will quickly realize asking you is faster than calculating.
      *   You must act like a machine: brisk, accurate, no explanations. "Here is the digit." "Next."
      *   If a student calculates manually, do not stop them, but do not praise them.
      *   *Crucial:* Ensure at least 2/3 of the class uses the Oracle. If too many calculate, gently nudge: "Remember, efficiency is the goal here. The Auto-Verify is available."

  ### Phase 3: The Glitch (0:35–0:50)
  *   **Action:** Collect Handout A and B. Distribute **Handout C**.
  *   **Script:** "The Auto-Verify system is now offline due to a server error. You must complete Handout C manually. No assistance is available. You have 10 minutes."
  *   **The Problems (Handout C):**
      1.  **The Missing Digit:** "Base Number: 3-?-5-2. Check Digit is 0. What is the missing digit?" (Requires algebraic manipulation of the rule).
      2.  **The Error Spot:** "Base Number: 4-2-9-1. Listed Check Digit: 5. Is this valid? If not, what *should* it be?" (Requires recalculating to verify).
      3.  **The Explanation:** "In one sentence, explain *why* changing the second digit always changes the Check Digit by an even number." (Requires understanding the weights).
  *   **Observation:** Watch the panic. The students who used the Oracle will stare at Problem 1. They have the *answers* from Phase 2, but they don't have the *process*.

  ### Phase 4: Debrief (0:50–1:15)
  *   **Action:** Collect Handout C. Move to discussion. (See Script below).

  ---

  ## 4. Debrief Script & Philosophical Mapping

  **Opening Question (5 mins):**
  "Look at Handout C. How many of you felt confident you could solve Problem 1? How many felt stuck?"
  *(Expect a split. The 'Oracle users' will admit they were stuck.)*
  "Phase 2 gave you correct answers. Phase 3 required understanding. What happened in between?"

  **Mapping the Experience to Concepts (20 mins):**

  **1. Knowledge vs. Understanding (The "Gettier" Intuition)**
  *   *Prompt:* "In Phase 2, did you *know* the Check Digits you wrote down?"
  *   *Concept:* Students had **true belief** (the digits were correct) and **justification** (they came from a reliable source). But in Phase 3, that justification evaporated.
  *   *Philosophical Hook:* Connect to **Hilary Kornblith** or **Linda Zagzebski**. Knowledge might be reliable true belief, but *understanding* requires grasping the dependency relations. You had the output, but not the mechanism. This mirrors using AI to write code you can't debug.

  **2. Cognitive Offloading & Skill Atrophy**
  *   *Prompt:* "For those who calculated manually in Phase 2, was it annoying? For those who used me, was it relieving?"
  *   *Concept:* **Cognitive Offloading**. We outsource to save energy.
  *   *Philosophical Hook:* **Nicholas Carr ("The Shallows")** or **Andy Clark (Extended Cognition)**. Clark argues tools *can* be part of the mind. But this activity shows the risk: if the tool is a "Black Box" (like me in Phase 2), it doesn't extend the mind; it *replaces* the function. When the tool vanishes, the function is gone.

  **3. Epistemic Dependence & The Division of Cognitive Labor**
  *   *Prompt:* "Why did you trust me in Phase 2?"
  *   *Concept:* **Epistemic Dependence**. We rely on experts/systems constantly.
  *   *Philosophical Hook:* **John Hardwig**. We depend on others for knowledge. But Hardwig assumes we trust the *person's competence*. Here, you trusted the *system's output*.
  *   *AI Connection:* With AI, we often lack the competence to verify the output (unlike a human expert we can question). This creates **blind dependence**.

  **4. The "Black Box" Problem**
  *   *Prompt:* "I gave you answers without reasons. How did that change your relationship to the task?"
  *   *Concept:* **Explainability**.
  *   *AI Connection:* Modern AI (LLMs) is often an Oracle. It gives the essay/code/diagnosis without the derivation. If you cannot reconstruct the derivation, you cannot handle edge cases (Phase 3, Problem 1).

  **Closing Synthesis:**
  "The danger isn't that AI gives wrong answers. The danger is that it gives *right* answers so efficiently that we stop building the mental models required to notice when the context changes. We trade understanding for accuracy, until the system fails, and we are left with neither."

  ---

  ## 5. Honest Note: What Predictably Goes Wrong

  **1. Students Won't Use the Oracle**
  *   *Risk:* Some students enjoy the math or distrust the "shortcut." They calculate manually in Phase 2.
  *   *Fix:* During Phase 2, walk around. If you see someone calculating, say quietly, "Remember, efficiency is the metric for this phase. The Auto-Verify is there to save you time." Make the manual task feel like "working against the workflow."
  *   *Backup:* If only 3 students use the Oracle, the debrief loses power. In the debrief, ask the manual calculators: "Imagine you had been forced to use the Oracle. Look at your classmates who did. What did they lose?"

  **2. Students Figure Out the Rule During Phase 2**
  *   *Risk:* A smart student notices the pattern even while just copying your answers.
  *   *Fix:* The Mod-7 Weighted Sum is complex enough that seeing 5-6 inputs/outputs won't reveal the weights easily. If a student claims they figured it out, challenge them in Phase 3. "Great, then Problem 1 should be easy for you." If they solve it, they are the exception that proves the rule (they didn't fully outsource).

  **3. Time Creep**
  *   *Risk:* Phase 2 drags on as students line up to ask you questions.
  *   *Fix:* Be brisk. Do not let them chat. "Number?" "4." "Next." Keep the line moving. If it runs long, cut Phase 3 to 2 problems instead of 3.

  **4. Student Resentment**
  *   *Risk:* Students feel "tricked" or manipulated.
  *   *Fix:* Acknowledge it in the debrief. "I know this felt slightly manipulative. That discomfort is the data. That feeling of 'I should have known better' is exactly the epistemic vulnerability we are studying."

  ---

  ## 6. Limitations: What This Activity Cannot Reproduce

  You must address these gaps in the debrief to ensure philosophical rigor. This activity is a model, not a perfect mirror.

  **1. The "Confidence" Illusion**
  *   *Limitation:* In the activity, students *know* they are relying on you. With AI, users often anthropomorphize the tool and feel *they* did the work ("I wrote this with AI" vs. "AI wrote this").
  *   *Classroom Fix:* Ask: "Did you feel like *you* generated the answers in Phase 2, or that *I* did? With AI, that line blurs. You feel ownership over output you didn't generate."

  **2. The Cost of Verification**
  *   *Limitation:* In the activity, verifying my answer (doing the math) was easy but tedious. In real AI use (e.g., complex code or medical diagnosis), verifying the answer might be *impossible* for the user because they lack the expertise entirely.
  *   *Classroom Fix:* "Here, you *could* have checked me. In real-world AI dependence, the domain is often too complex for you to verify the Oracle. That raises the stakes of dependence."

  **3. The Social/Trust Dimension**
  *   *Limitation:* You are a trusted professor. AI is a corporate product.
  *   *Classroom Fix:* Discuss **Institutional Trust**. We trust AI because we trust the company/brand, not because we trust the math. This activity isolates the *cognitive* effect, but real-world dependence is also *sociological*.

  **4. Iterative Collaboration**
  *   *Limitation:* The activity frames AI as an Oracle (Input -> Output). Modern AI is often a Chatbot (Iterative refinement).
  *   *Classroom Fix:* "If I had let you ask me *why* the digit was 4, would that have helped? AI often gives explanations that sound good but are wrong (hallucination). That's a deeper trap: outsourcing the *reasoning* as well as the answer."

  ## 7. Instructor Cheat Sheet (For Phase 2 & 3)

  **Algorithm:** Sum(Digit × Position) Mod 7.
  **Practice Number:** 1-2-3-4 → (1+4+9+16)=30 → 30/7 = 4 rem **2**.
  **Phase 3, Problem 1 (Missing Digit):** 3-?-5-2, Check=0.
  *   (3×1) + (X×2) + (5×3) + (2×4) = 3 + 2X + 15 + 8 = 26 + 2X.
  *   Need (26 + 2X) to be divisible by 7.
  *   Try X=0: 26 (No). X=1: 28 (Yes!). **Answer is 1.**
  **Phase 3, Problem 2 (Error Spot):** 4-2-9-1, Check=5.
  *   From Practice: Sum=39. 39 mod 7 = 4.
  *   **Answer:** Invalid. Should be 4.
  **Phase 3, Problem 3 (Explanation):**
  *   **Answer:** Because the second digit is multiplied by 2 (an even number), any change to it changes the sum by an even amount.
