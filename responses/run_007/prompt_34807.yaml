      *   *Correction:* On the car: Buying a car on credit *can* be a signal if the credit is based on future earnings potential (which is a quality signal), but generally, going broke is not a stable strategy. Better to frame it as "spending resources on style over safety."

  9.  **Final Polish:** Ensure tone is informative, not condescending to the friend or the user. Use clear headings. (This matches the structure of the final output).

  10. **Final Review against constraints:** Did I answer what they'd nod at? Yes. Push back? Yes. Distinction? Yes. Sports car? Yes.

