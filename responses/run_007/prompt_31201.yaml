answer: |-
  The debate over the paradox of voting often stalls because interlocutors are using different dictionaries for the word "rational." The instrumentalist views the voter as an investor seeking a return on policy; the expressivist views the voter as a consumer seeking satisfaction from the act itself. These aren't just tweaks to the same model; they are fundamentally different ontologies of political action.

  ### (a) The Anatomy of Cost and Benefit
  For the **instrumental account**, the cost ($C$) is straightforward: time, travel, information gathering, and opportunity cost. The benefit ($B$), however, is strictly causal. It is the utility difference between Candidate A and Candidate B winning, *discounted by the probability ($P$) that your single vote decides the election*. The rational calculation is $R = PB - C$. Because $P$ is astronomically low in large elections, the expected benefit is effectively zero.

  The **expressive account** keeps the same transactional costs ($C$) but radically redefines the benefit. Here, the benefit ($D$) is intrinsic. It is the psychological utility derived from affirming an identity, fulfilling a civic duty, or cheering for a team. Crucially, this benefit is *not* discounted by probability. Whether your vote matters to the outcome is irrelevant to whether it matters to your self-conception. The calculation becomes $R = D - C$.

  The friction point is the **probability discount**. The instrumentalist sees a vote without pivot probability as a wasted resource; the expressivist sees a vote without pivot probability as a pure signal, uncorrupted by selfish hope of gain.

  ### (b) The Landslide Verdict
  Consider a voter in a deep-blue state voting Republican, or a deep-red state voting Democrat, expecting a landslide loss.

  The **instrumentalist** prescribes abstention. If the outcome is certain, $P = 0$. Since $C > 0$, the expected utility is negative. Voting here is not just futile; it is irrational resource mismanagement. You are paying a cost for a product (influence) you will not receive.

  The **expressivist** prescribes voting, potentially with even greater vigor. If the benefit is affirming one's identity as "the kind of person who supports X principles," losing the election does not negate that affirmation. In fact, voting for a loser in a landslide can be a stronger expressive signal (a "costly signal") because it demonstrates commitment despite social pressure or futility. The act *is* the consumption; the outcome is secondary.

  ### (c) Dissolving or Relocating the Paradox?
  Does the expressive account solve the paradox? I argue it **relocates** it rather than dissolving it.

  It solves the mathematical impossibility of turnout (since $D$ can exceed $C$ easily), but it creates a new puzzle: **Why the ballot box?** If voting is merely expression, it is a remarkably inefficient technology. It is costly (time, registration), largely private (no one sees you do it in the booth), and infrequent.

  If I want to express support for a candidate, a bumper sticker is cheaper and more visible. A social media post reaches more people. A yard sign is persistent. Why do millions choose the expensive, private, one-off signal of voting over these cheaper, louder alternatives?

  To answer this, the expressivist must argue that voting has a unique ceremonial weight or social meaning that bumper stickers lack. But explaining *why* voting has this unique weight often requires slipping back into instrumentalist logic (e.g., "because everyone else thinks voting matters"). If the value of the expression depends on others believing the act is instrumental, the paradox hasn't been dissolved; it has just been pushed one step back into the realm of shared social fiction.

