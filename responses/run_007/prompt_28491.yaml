prompt: |-
  I've been going back and forth on epiphenomenalism for weeks and I need an outside view. For context: epiphenomenalism says phenomenal consciousness has exactly zero causal powers — it's produced by physical processes but never itself causes anything, including your own reports about your experiences. The killer objection (to me) is the paradox of phenomenal judgment: if epiphenomenalism is true, my judgment that "I am in pain" is caused entirely by neural activity, not by the pain itself. So the tight correlation between my experiences and my judgments about them looks like a massive coincidence the epiphenomenalist has to explain away.

  Act as an expert philosopher of mind who's thought carefully about this debate. Give me your actual credence that epiphenomenalism is true, as a number. Then decompose it: what are the main hinges the question turns on? I can think of at least (a) whether causal closure of the physical is as airtight as people claim, (b) whether conceivability arguments for zombies actually establish metaphysical possibility, (c) how damaging the phenomenal judgment problem really is on a scale from "minor puzzle" to "decisive refutation," and (d) whether there's a viable epiphenomenalist story about why judgments track experiences (e.g., a common cause account). Assign rough probabilities to each hinge and show how they combine to your overall number. Then tell me which hinge you're least confident about and what new evidence or argument would shift it most.
