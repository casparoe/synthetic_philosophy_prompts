answer: |-
  Here is the spec sheet for an adequate theory of moral dilemmas. This is not a ranking of who wins, but a breakdown of the structural load-bearing walls any account must inspect.

  ### Part 1: The Desiderata (Spec Sheet)

  An adequate theory must provide a coherent account of the following six dimensions. For each, the "Motivation" explains why the theory cannot simply ignore the issue without losing explanatory power.

  #### 1. Phenomenological Accuracy
  *   **The Requirement:** The theory must explain the agent's experience of being "torn." It must account for the sense of inescapable violation regardless of the choice made.
  *   **The Motivation:** In cases like *Sophie's Choice* or *Sartre's Student*, agents report a specific type of distress that differs from standard uncertainty. If a theory claims dilemmas are impossible, it must treat this experience as an *error theory* (illusion/epistemic noise). If it claims dilemmas are real, it must treat the experience as *veridical*. A theory cannot wave this off because any ethics that systematically invalidates the lived experience of moral agency risks becoming alienating or action-paralyzing. The theory must explain *why* it feels this way, even if it concludes the feeling is mistaken.

  #### 2. Logical Consistency (The Contradiction Problem)
  *   **The Requirement:** The theory must specify whether conflicting obligations generate a formal logical contradiction within the normative system.
  *   **The Motivation:** In Standard Deontic Logic (SDL), $OA$ (Ought A) and $O\neg A$ (Ought not-A) constitute a contradiction ($\bot$). If a theory asserts genuine dilemmas exist ($OA \land OB$ where $A$ and $B$ are mutually exclusive), it risks rendering the moral system incoherent. A theory cannot ignore this because if morality is logically inconsistent, it loses its status as a rational guide. The theory must either revise the logic or deny the contradiction.

  #### 3. Reconciliation with "Ought Implies Can" (OIC)
  *   **The Requirement:** The theory must clarify the relationship between obligation and ability. If an agent cannot do both $A$ and $B$, can they be obligated to do both?
  *   **The Motivation:** OIC is a deeply entrenched intuition: it is unfair to blame someone for failing to do the impossible. In a dilemma, by definition, the agent cannot fulfill all obligations. If the theory asserts obligations persist despite impossibility, it must explain why OIC is false or limited. If it upholds OIC, it must explain how the obligation dissolves without dissolving the dilemma. Ignoring this makes the theory appear vindictive or irrational.

  #### 4. Account of Moral Remainders and Regret
  *   **The Requirement:** The theory must explain the normative status of the agent *after* the choice. Specifically, why does "agent-regret" or a sense of debt persist even when the agent did the "right" thing?
  *   **The Motivation:** In dilemma cases, agents often feel they owe restitution, apology, or penance even if they made the best possible choice (e.g., a triage doctor who saves one patient and lets another die). If the theory says the agent did exactly what was required, nothing should be owed. The persistence of "moral residue" suggests the unchosen obligation wasn't fully cancelled. A theory that ignores this fails to capture the continuing normative relationship between the agent and the violated claim.

  #### 5. The Agglomeration Principle
  *   **The Requirement:** The theory must take a stance on whether obligations aggregate. Does $OA$ and $OB$ entail $O(A \land B)$?
  *   **The Motivation:** Agglomeration seems intuitively valid: if I ought to mail the letter and I ought to water the plants, I ought to do both. However, in a dilemma, $A$ and $B$ are compossible (I cannot do both). If Agglomeration holds, then $O(A \land B)$ is true. But since $\neg \Diamond (A \land B)$, OIC implies $\neg O(A \land B)$. This creates a direct formal conflict. A theory cannot wave this off; it must explicitly accept or reject the principle of agglomeration to avoid formal collapse.

  #### 6. Specification of Normative Force (Pro Tanto vs. All-Things-Considered)
  *   **The Requirement:** The theory must define the weight of the conflicting reasons. Are they *pro tanto* (prima facie) obligations that can be overridden, or *all-things-considered* (ATC) obligations that represent final verdicts?
  *   **The Motivation:** If the conflicting 'oughts' are merely *pro tanto*, there is no genuine dilemma; one simply overrides the other, and the ATC verdict is singular ($O A$, $\neg O B$). If they are ATC, then two final verdicts clash. A theory must specify this because it determines whether the "dilemma" is ontological (real conflict in the world) or epistemic (conflict in our weighing of reasons). Without this distinction, the term "obligation" is ambiguous.

  ***

  ### Part 2: Classification of Requirements

  Here we distinguish between **Data Constraints** (non-negotiable tasks the theory must perform) and **Theoretical Principles** (commitments a theory can reject if it provides a sufficient error theory or alternative framework).

  | Desideratum | Classification | Why? |
  | :--- | :--- | :--- |
  | **1. Phenomenological Accuracy** | **Non-Negotiable (Task)** | You cannot ignore the data of experience. You *can* claim the experience is an illusion, but you *must* explain the illusion. Ignoring it renders the theory irrelevant to agents. |
  | **2. Logical Consistency** | **Non-Negotiable (Constraint)** | A normative system that embraces contradiction ceases to be a system of reasoning. You must resolve the contradiction, not accept it (unless you are a dialetheist, which is a radical edge case). |
  | **3. Ought Implies Can** | **Negotiable (Principle)** | A theory can deny OIC (arguing that obligation persists despite impossibility), but it pays a high price in intuitive plausibility. It is a commitment, not a law of nature. |
  | **4. Moral Remainders** | **Non-Negotiable (Task)** | Like phenomenology, the data of post-choice regret/restitution is real. The theory must explain why we apologize for doing the "right" thing. |
  | **5. Agglomeration Principle** | **Negotiable (Principle)** | This is a rule of inference in Standard Deontic Logic, but it is not a metaphysical necessity. Many dilemma theorists explicitly reject agglomeration to save the phenomenon. |
  | **6. Normative Force** | **Negotiable (Framework)** | A theory can choose to define 'ought' as *pro tanto* (dissolving dilemmas) or ATC (affirming dilemmas). This is a definitional commitment that structures the rest of the theory. |

  ***

  ### Part 3: The Incompatibility Problem (Joint Unsatisfiability)

  You asked if subsets of these desiderata are jointly unsatisfiable. **Yes.** This is the engine of the entire debate. There is a specific "Inconsistent Tetrad" lurking in these requirements. You cannot hold all four of the following simultaneously without logical explosion:

  1.  **Genuine Dilemmas Exist:** There are cases where $OA$ and $OB$ are both true (All-Things-Considered), but $\neg \Diamond (A \land B)$.
  2.  **Ought Implies Can (OIC):** $O\phi \to \Diamond \phi$.
  3.  **Agglomeration Holds:** $OA \land OB \to O(A \land B)$.
  4.  **Logical Consistency:** The system cannot contain contradictions ($O\phi \land \neg O\phi$).

  **The Derivation of the Contradiction:**
  *   Assume **Genuine Dilemmas**: We have $OA$ and $OB$.
  *   Apply **Agglomeration**: Therefore, $O(A \land B)$.
  *   Assume **Dilemma Constraint**: $\neg \Diamond (A \land B)$ (It is impossible to do both).
  *   Apply **OIC**: If $\neg \Diamond (A \land B)$, then $\neg O(A \land B)$.
  *   **Result:** We have derived both $O(A \land B)$ and $\neg O(A \land B)$. This violates **Logical Consistency**.

  **Where the Tension Is:**
  To make the theory coherent, one of the four nodes must be severed.

  1.  **The Impossibilist Solution:** Deny **(1)**. (There are no genuine dilemmas).
      *   *Cost:* Must treat Phenomenology and Moral Remainders as illusions/errors.
  2.  **The OIC-Denier Solution:** Deny **(2)**. (You can be obliged to do the impossible).
      *   *Cost:* Violates deep intuitions about fairness and rationality; makes morality seem tragic and detached from agency.
  3.  **The Agglomeration-Denier Solution:** Deny **(3)**. (Obligations don't aggregate in conflict cases).
      *   *Cost:* Requires non-standard logic; makes the structure of obligation fragmented (you ought to A, ought to B, but don't ought to A+B).
  4.  **The Dialetheist Solution:** Deny **(4)**. (Accept the contradiction).
      *   *Cost:* Radical logical revisionism; generally considered a last resort.

  **The Quiet Sacrifice:**
  If you look at the landscape of contemporary meta-ethics, the requirement most often quietly sacrificed or modified is **Agglomeration**.

  Why? Because sacrificing **OIC** is too counter-intuitive for most (it makes morality cruel), and denying **Phenomenology/Remainders** (by denying Dilemmas) leaves the theory unable to explain why we feel torn and why we apologize. Denying Agglomeration is technically the "cheapest" fix: it allows the theory to preserve the reality of the dilemma, the validity of OIC, and the data of phenomenology, provided one accepts that the logic of 'ought' is non-standard in conflict scenarios.

  However, if a theory insists on Standard Deontic Logic (which includes Agglomeration), then **Genuine Dilemmas** must be the sacrifice. That is the standard "rationalist" move: logic is fixed, so the world must be cleaner than it feels.

  **Summary for your reading:**
  When you evaluate the debate, check which node of the Tetrad the author cuts.
  *   If they keep Logic + OIC + Agglomeration $\rightarrow$ They must deny Dilemmas (and explain away regret).
  *   If they keep Dilemmas + OIC + Logic $\rightarrow$ They must deny Agglomeration.
  *   If they keep Dilemmas + Agglomeration + Logic $\rightarrow$ They must deny OIC.

  Any theory claiming to "settle" the question without addressing this specific trade-off is incomplete.
