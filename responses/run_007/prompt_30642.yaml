      *   Is PoI a failed invariant prior? Yes, largely. Jaynes showed that if you enforce invariance under the translation/rotation group of the plane, you get a unique measure (Method 2/3 hybrid depending on formulation, actually Jaynes derives the $1/r$ measure which corresponds to Method 2 in some setups, but strictly it's the invariant measure under the group of motions).
