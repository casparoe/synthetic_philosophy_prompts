answer: |-
  The tragic hero weeps within the law,
  And finds in universal grief his rest;
  Agamemnon's pain the Greek fleet saw,
  By Jephthah's vow the tribe was fully blessed.
  But Abraham climbs the mount in silence deep,
  No mediation softens ethical hate;
  He cannot speak, he cannot mourn, he must keep
  The murderer's guise as his appointed fate.

  Yet when the blade is poised, the turn is made:
  The ethical suspends for Absolute relation;
  Resignation yields the son to infinite shade,
  Faith gains him back by Absurd's high station.
  For speech belongs to universal ground,
  Where private faith is falsified by sound.
