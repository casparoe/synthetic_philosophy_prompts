  So I just got back from this incredibly frustating argument with my friend about the logical omniscience problem — you know, the thing in epistemic logic where the standard possible-worlds models force agents to know every logical consequence of everything they know. He was basically saying it's a fake problem, that of course real people don't know all the entailments of their beliefs but that's just because the models are idealized and all models are false etc etc. And I kept trying to push back that no, the issue isn't just that the models are imprecise, it's that logical omniscience makes them give actively wrong verdicts about certain cases, not just approximate ones. But I couldn't come up with a clean example on the spot that isolates logical omniscience from all the other idealizations in the framework.

