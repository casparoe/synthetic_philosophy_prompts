      *   **Tone:** Professional, precise, intellectually rigorous, bridging philosophy and systems architecture.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Side A: Agent-Neutral / Free-Floating Reasons (Externalism/Realism).**
          *   *Core Claim:* Reasons exist independently of agents. If a situation obtains (e.g., pain exists), there is a reason to alleviate it, regardless of who is around to care.
          *   *Normative Force:* Intrinsic to the state of affairs. Ignoring it is an error in the agent (or system), not a lack of connection.
          *   *Key Philosophers:* Nagel, Parfit (to an extent), Moral Realists.
      *   **Side B: Agent-Relative / Relational Reasons (Internalism/Humean).**
          *   *Core Claim:* A reason must be grounded in an agent's subjective motivational set (desires, projects, commitments). No desire/project = no reason.
