answer: |-
  Consider a single classical ideal-gas particle confined in a box of volume $V$, initially unknown to be in the left ($L$) or right ($R$) half. The measurement apparatus is a lightweight probe particle prepared in a precise, low-entropy phase-space state (position $x_0$, momentum $p_0$). The probe is fired through the box; if the system particle is in $L$, they collide elastically, scattering the probe to momentum $p_1$; if in $R$, no collision occurs, and the probe retains $p_0$. The probe then strikes a paddle wheel connected to a weight; the wheel is geared to rotate and lift the weight regardless of whether the probe arrives with $p_1$ or $p_0$, rectifying the momentum difference into work $W \approx kT \ln 2$. Finally, the probe enters a conservative magnetic bottle that reverses its momentum and reflects it back to $x_0$ with momentum $p_0$, ostensibly returning the apparatus to its exact initial thermodynamic state with no memory record left behind.

  The system particle is then allowed to expand isothermally to fill the full volume $V$, resetting the gas to its initial macrostate while the lifted weight stores the extracted energy. The measurement apparatus claims to have $\Delta S_{app} = 0$ because it returns to $(x_0, p_0)$. The system has $\Delta S_{sys} = 0$ over the full cycle (compression/expansion balances). The work reservoir gains energy $W$, implying heat $Q=W$ was drawn from the bath. If measurement is free and the apparatus truly resets, the total entropy change is $\Delta S_{total} = -Q/T = -W/T < 0$, a clear violation of the Second Law. The entropy cost must therefore enter during the measurement interaction itself: to distinguish the collision ($p_1$) from the non-collision ($p_0$) against thermal noise, the probe must be prepared in a state sharper than thermal equilibrium, which requires an entropy investment, or the interaction must dissipate heat to stabilize the record (Brillouin's view).

  A Bennett-style proponent would argue that your "reset" is impossible without erasure because of Liouville's theorem. After the measurement interaction, the probe is not in a single state $(x_0, p_0)$, but in a statistical mixture of two disjoint phase-space regions ($p_0$ or $p_1$) correlated with the gas particle. The conservative magnetic bottle cannot compress these two distinct phase-space volumes back into the single initial volume $(x_0, p_0)$ without reducing phase-space density, which is forbidden in Hamiltonian mechanics. To restore the probe to its pure initial state, you must discard the correlation (the information about whether a collision occurred), and that discarding is logically irreversible erasure. The "hidden memory" is the correlation between the probe's trajectory and the gas particle's position; until that correlation is severed, the probe has not truly reset, and severing it costs $kT \ln 2$.
