answer: |-
  Your diagnosis is astute, and your frustration is shared by many who work in the field. The Frankfurt literature has indeed reached a point of diminishing returns, where the construction of cases has become more baroque while the philosophical ground remains unmoved.

  To answer your core question directly: The disagreement is **substantive**, but it is sustained by a **methodological divergence** regarding the role of intuitions in theory construction. It is not merely verbal, nor is it simply a mismatch of questions, though your hypothesis about "Ability vs. Sourcehood" captures the *evolution* of the debate rather than its static structure.

  Here is a diagnosis of the structure of the disagreement, followed by what would actually constitute progress in this context.

  ### 1. The Structure of the Disagreement

  You suggest the sides are answering different questions (Analysis of Ability vs. Metaphysics of Responsibility). A more precise structural diagnosis is that they agree on the question ("What are the necessary conditions for moral responsibility?") but disagree on the **explanatory priority** of the concepts involved.

  **The Explanatory Disagreement**
  For the traditional Incompatibilist (the "Leeway" theorist), the ability to do otherwise is *constitutive* of responsibility. Responsibility is a matter of having access to genuine futures. For them, Frankfurt cases are often viewed as "intuition pumps" that distract from the metaphysical reality of determinism.
  For the Compatibilist (specifically the "Actual Sequence" theorist), the actual history of the action is *constitutive* of responsibility. The ability to do otherwise is merely a *symptom* of a responsible agent, not the *source* of it.

  The stalemate persists because Frankfurt cases attack the *symptom* (PAP), while Incompatibilists have retreated to defending the *source* (Ultimate Responsibility).
  *   **Compatibilists** think that by refuting PAP, they have removed the Incompatibilist's primary leverage. If you can be responsible without AP, then determinism's threat to AP is less worrying.
  *   **Incompatibilists** concede PAP might be false but argue that the *reason* PAP seemed true was that it tracked "Sourcehood." If determinism rules out Sourcehood, it doesn't matter if PAP is false; incompatibilism remains true.

  Thus, the disagreement is not about whether the agent in the Frankfurt case *could* have done otherwise (both sides often agree on the mechanics of the case now). The disagreement is about **whether the removal of alternative possibilities alters the actual sequence in a way that matters for responsibility.**

  **The Methodological Divergence**
  This leads to the second structural pillar: the evidential weight of case-intuitions.
  *   **Particularism (Compatibilist leaning):** Relies on the intuition about the specific vignette. "Look at this specific agent; she seems responsible. Therefore, PAP is false." This treats the intuition about the case as a fixed data point that theory must accommodate.
  *   **Generalism (Incompatibilist leaning):** Relies on the intuition about the general principle of determinism. "If the universe is determined, no one is the ultimate source. Therefore, this specific agent cannot be responsible, regardless of how the case is described." This treats the general metaphysical commitment as the fixed data point.

  When these collide, no progress is made because each side views the other's "data" as theory-laden error. The Compatibilist sees the Incompatibilist as ignoring the plain facts of the case; the Incompatibilist sees the Compatibilist as being seduced by a superficial description that hides the deterministic threat.

  ### 2. Is it Verbal, Substantive, or a Mismatch?

  It is **substantive**, but it masquerades as a verbal dispute about "can."

  If it were merely verbal, we could resolve it by stipulating definitions (e.g., "Let's distinguish 'regulative control' from 'guidance control'"). We have done this (most notably by Fischer and Ravizza), and the debate continued. Why? because the dispute is not about the definition of "can," but about **which kind of control is necessary for desert.**

  It is not a **mismatch of questions** in the sense that they are talking past each other; they are fighting over the same territory (the conditions of responsibility) using different maps. However, your intuition about the shift to Sourcehood is correct: the debate *has* mismatched over time. The Frankfurt literature was designed to kill Leeway Incompatibilism. It largely succeeded. But Source Incompatibilism rose to take its place. The current stalemate is often a fight between Compatibilists attacking a straw-man (Leeway) and Incompatibilists defending a fortress (Sourcehood) that Frankfurt cases do not directly breach.

  So, the disagreement is substantive (about the nature of control), but the *dialectical impasse* is caused by fighting the last war (PAP) while the frontline has moved (Sourcehood).

  ### 3. What Would Count as Progress?

  Given this diagnosis, generating more Frankfurt-style cases or more "flicker" strategies will not yield progress. We have reached the limit of what thought experiments can do here. Progress would require one of the following three shifts:

  **A. An Argument for Explanatory Priority (Theoretical Progress)**
  Progress would look like a convincing argument for why *Actual Sequence* properties are sufficient for responsibility *without* needing to reference Alternative Possibilities even as a backup.
  Currently, Compatibilists argue that guidance control is enough. Incompatibilists argue that guidance control is not "deep" enough without the ability to initiate a new causal chain.
  *   *Progress:* A demonstration that "Sourcehood" can be defined in a way that does not implicitly require indeterminism. If Sourcehood can be naturalized within a deterministic framework, the Incompatibilist retreat fails. If Sourcehood *necessarily* implies indeterminism, the Compatibilist claim fails. The debate needs to move from "Is there an AP?" to "What constitutes a 'Self' that is a source?"

  **B. A Dissolution of the "Intuition" Method (Methodological Progress)**
  Since the stalemate is fueled by conflicting intuitions (Particular vs. General), progress might come from arguing that **neither intuition is trustworthy** in this domain.
  *   *Progress:* An argument showing that our folk concepts of "responsibility" are fragmented or context-dependent (as some experimental philosophers suggest). If "responsibility" picks out different clusters of properties in different contexts, then the search for a necessary and sufficient condition (like PAP or Sourcehood) is a category error. This would dissolve the debate rather than solve it, which is a form of philosophical progress.

  **C. A Taxonomy of "Ability" linked to Function (Conceptual Progress)**
  You mentioned an "agreed taxonomy of senses of 'ability'." This is only useful if linked to *function*.
  *   *Progress:* Instead of asking "Could she do otherwise?", ask "What work is the 'could have done otherwise' claim doing?" Is it doing the work of assessing *danger*? *Regret*? *Retribution*? *Reform*?
      If we distinguish the *forward-looking* functions of responsibility (safety, reform) from the *backward-looking* functions (desert, blame), we might find that PAP is irrelevant for the former but essential for the latter. This would allow both sides to be partially right: Compatibilism for social regulation, Incompatibilism for cosmic desert. This is a "revisionist" or "semantic" progress that clarifies why the debate feels intractable (because it conflates two different practices).

  ### Pedagogical Recommendation

  For your upper-level course, the most valuable lesson may not be resolving the impasse, but **mapping the topology of the stalemate.**

  1.  **Frame Frankfurt cases as a pivot, not a conclusion.** Teach them not as "proof that Compatibilism is true," but as "the moment the debate shifted from Leeway to Sourcehood."
  2.  **Highlight the Explanatory Priority.** Ask students: "Does the agent have responsibility *because* she could have done otherwise, or could she have done otherwise *because* she is responsible?" This flips the script from analyzing ability to analyzing the grounds of responsibility.
  3.  **Interrogate the Methodology.** Explicitly discuss the clash of intuitions. Ask students why they trust the intuition about the vignette more than the intuition about determinism (or vice versa). This moves the discussion from metaphysics to meta-ethics/epistemology.

  **Summary Diagnosis:**
  The impasse is substantive, rooted in a disagreement over whether responsibility is grounded in the **structure of the actual sequence** (Compatibilism) or the **metaphysical origin of the sequence** (Incompatibilism). The Frankfurt literature exhausted the utility of testing Alternative Possibilities. Progress now requires abandoning the search for a single "condition" of responsibility and instead analyzing the **explanatory relationship** between agency, causation, and desert, or acknowledging that our concept of responsibility may be too fractured to sustain a binary verdict.
