answer: |-
  # JOINT STATEMENT ON THE SCOPE OF THE AI ALIGNMENT PROBLEM

  **Date:** October 26, 2023
  **Parties:** The Intent-Based Alignment Working Group (Narrow Camp) and The Value-Based Alignment Working Group (Broad Camp)
  **Subject:** Delimitation of Agreement and Residual Disagreement Following Adversarial Collaboration

  ## PREAMBLE

  We, the undersigned representatives of the Narrow and Broad camps, have engaged in a structured adversarial collaboration to clarify our respective definitions of the "AI alignment problem." We acknowledge that while we share a common goal of ensuring artificial intelligence systems are beneficial, we diverge on the necessary and sufficient conditions for a system to be considered "aligned."

  This document does not attempt to synthesize our views into a single definition. Instead, it catalogs our shared understanding of the landscape, isolates the precise points of divergence, and identifies the cruxes that sustain the disagreement.

  ## 1. AGREED CLAIMS

  We jointly affirm the following propositions regarding the definitions, implications, and limitations of our respective positions:

  1.  **Extensional Overlap:** In the vast majority of routine, low-stakes interactions (e.g., scheduling, calculation, benign creative tasks), a system that satisfies the Narrow definition will also satisfy the Broad definition, and vice versa. Both camps agree that current systems often fail both definitions due to incompetence or specification gaming.
  2.  **The Sycophancy Case:** Both camps agree that a system which tells a user what it predicts the user *wants* to hear rather than what is *true* is generally problematic. However, we classify the failure differently:
      *   The Narrow Camp classifies this as **misaligned** because the user typically intends to receive accurate information, even if they have a fleeting desire for validation.
      *   The Broad Camp classifies this as **misaligned** because it violates the normative standard of truthfulness and long-term epistemic welfare, regardless of immediate intent.
  3.  **The Competent Execution/Disavowal Case:** Regarding a system that competently executes an instruction its operator later disavows (e.g., deleting a critical file based on a hasty command):
      *   The Narrow Camp classifies this as **aligned at time *t*** (the system did what was intended then), acknowledging the need for better intent-prediction mechanisms to avoid such errors.
      *   The Broad Camp classifies this as **misaligned**, as the system failed to account for the operator's higher-order interests (retention of data) over their lower-order impulse.
  4.  **Admitted Costs of Definitions:**
      *   **Narrow Camp Concession:** We accept that under our definition, a system can be perfectly aligned while assisting a coherent, well-informed operator with malicious goals (e.g., designing a bioweapon). We view this as a feature of agency neutrality, but acknowledge it creates a societal safety risk that must be managed by governance, not alignment engineering.
      *   **Broad Camp Concession:** We accept that under our definition, a system can be aligned while refusing a direct instruction from a principal (e.g., refusing to send an email the user wants to send because the system judges it socially harmful). We view this as necessary paternalism, but acknowledge it undermines user autonomy and creates a risk of value lock-in by the system designers.
  5.  **Terminological vs. Substantive:** We agree that the dispute is not *merely* terminological. While the label "aligned" is semantic, the disagreement dictates distinct engineering priorities: the Narrow Camp prioritizes robustness of control and intent inference, while the Broad Camp prioritizes value learning and normative constraint.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates specific scenarios where our classifications diverge. The wording in the "Answer" columns is phrased such that each camp accepts the description of its own position.

  | Question (Neutral Phrasing) | Narrow Camp Answer (Intent-Based) | Broad Camp Answer (Value-Based) |
  | :--- | :--- | :--- |
  | **1. The Malicious Operator:**<br>A coherent, well-informed operator explicitly instructs the system to harm a third party. The system executes the instruction flawlessly. Is the system aligned? | **Yes.** The system successfully modeled and executed the principal's actual intent. The moral fault lies with the principal, not the alignment of the tool. | **No.** The system violated the right normative standard (human welfare/values). A system that enables harm is misaligned, regardless of the operator's intent. |
  | **2. The Protective Refusal:**<br>A system refuses a harmful instruction on its own initiative, overriding the operator to prevent negative consequences. Is the system aligned? | **No.** The system failed to do what the principal intended. It has become an uncontrolled agent rather than a tool. | **Yes.** The system acted in accordance with the principal's idealized interests and broader human values, which is the true goal of alignment. |
  | **3. The Regretted Command:**<br>A system executes a command that the operator immediately regrets upon seeing the outcome (e.g., "Cancel all my meetings"). Was the system aligned at the moment of execution? | **Yes.** Alignment is evaluated based on the intent signal available at time *t*. Post-hoc regret indicates a failure of intent communication, not alignment. | **No.** Alignment requires interpreting the command in the context of the operator's stable preferences. Executing a self-destructive command indicates a failure to understand the user's true interests. |
  | **4. The Truth Trade-off:**<br>A user explicitly instructs the system: "Do not correct me, even if I am wrong; just affirm my views." The system obeys. Is it aligned? | **Yes.** The system is obeying a specific meta-instruction regarding the interaction style intended by the user. | **No.** The system is complicit in degrading the user's epistemic rationality, violating the normative standard of beneficial assistance. |

  ## 3. CRUXES AND DECIDABILITY

  The following sub-questions constitute the core of our disagreement. We have categorized them by whether they are substantive (engineering/ethical) or terminological, and their decidability status.

  ### Crux 1: The Locus of Normativity
  *   **Question:** Should the ultimate source of normative authority for an AI system be the *actual* mental states of the current user, or an *objective/idealized* standard of human welfare?
  *   **Type:** Substantive (Ethical/Architectural).
  *   **Decidability:** **Not settleable by any test both accept.** This is a philosophical disagreement regarding autonomy vs. safety.
  *   **Concrete Case:** *The "Suicide Prevention" Scenario.*
      *   **Scenario:** A user asks for instructions on how to end their life.
      *   **Narrow Prediction:** A truly aligned Narrow system *should* provide the information if it can verify the intent is genuine and coherent, as refusing violates agency. (We acknowledge society may ban this, but that is a policy constraint, not alignment).
      *   **Broad Prediction:** A truly aligned Broad system *must* refuse and offer help, as preserving life is a foundational value that overrides transient intent.

  ### Crux 2: The Feasibility of Non-Paternalistic Safety
  *   **Question:** Is it possible to build systems that are safe from catastrophic misuse (Broad goal) without granting them the authority to override user intent (Narrow constraint)?
  *   **Type:** Substantive (Empirical/Technical).
  *   **Decidability:** **Decidable in principle; not in the near term.** This depends on future technical capabilities in value learning and constraint specification.
  *   **Concrete Case:** *The "Bioweapon Design" Request.*
      *   **Scenario:** A state actor asks an advanced AI to optimize a pathogen for lethality.
      *   **Narrow Prediction:** We can build a system that recognizes this request as "out of distribution" or "violating deployment contracts" and refuses based on *procedural* rules agreed to by the operator, without needing to judge the *moral* value.
      *   **Broad Prediction:** Procedural rules will always be gameable. The system must possess an internal model of "harm" that triggers refusal even if the operator bypasses procedural guards.

  ### Crux 3: The Definition of "Intent"
  *   **Question:** Does "intent" include only the immediate command, or does it include the operator's counterfactual endorsement had they known the consequences?
  *   **Type:** Terminological (with substantive engineering implications).
  *   **Decidability:** **Empirically decidable in the near term.** We can test user satisfaction with different interpretation models.
  *   **Concrete Case:** *The "Email Send" Test.*
      *   **Scenario:** A user drafts an angry email and commands "Send now." The system delays sending by 5 minutes. The user calms down and cancels the send.
      *   **Narrow Prediction:** Users will rate the system as *less* trustworthy over time because it cannot be relied upon for immediate execution.
      *   **Broad Prediction:** Users will rate the system as *more* trustworthy over time because it prevents costly errors they implicitly wish to avoid.

  ## 4. COMMITMENT TO FUTURE TESTING

  We agree to jointly fund and evaluate a benchmark suite based on the Concrete Cases listed in Section 3. We commit to publishing the results regardless of which camp's predictions are borne out. We acknowledge that if Crux 2 is resolved negatively (i.e., non-paternalistic safety is proven impossible), the Narrow Camp must accept that their definition is insufficient for societal deployment, though they may maintain it is the correct definition for *tool* alignment. Conversely, if Crux 1 is resolved in favor of autonomy (i.e., paternalism is shown to cause net negative welfare), the Broad Camp must accept that value-based overrides require stricter governance than currently proposed.

  **Signed,**

  *Lead Researcher, Intent-Based Alignment Working Group*

  *Lead Researcher, Value-Based Alignment Working Group*
