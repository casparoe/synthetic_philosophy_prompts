answer: |-
  Yes, this has a very specific name. You have accurately described an **Information Cascade**.

  While "herd behavior" and "bandwagon effects" are often used as catch-all terms in pop psychology, **Information Cascade** is the precise technical term used in game theory, economics, and sociology to describe exactly the mechanism you outlined: rational agents ignoring their private signals because the public history of actions outweighs their own data.

  The seminal paper on this is *"A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades"* by Bikhchandani, Hirshleifer, and Welch (1992). There is also a famous experimental validation by Anderson and Holt (1997).

  Here is the breakdown of why this fits your description, how it differs from the broader terms you mentioned, and the answer to your question about "good info vs. noise."

  ### 1. Why "Information Cascade" fits (and why the others don't)

  You hit the nail on the head regarding the distinction.
  *   **Groupthink** is psychological. It implies social pressure, a desire for harmony, or fear of rocking the boat. In your college example, the students weren't afraid of being ostracized; they were logically convinced the crowd knew something they didn't.
  *   **Herd Behavior** is often broader. In economics, herding can happen due to *payoff externalities* (e.g., "I should buy this stock because everyone else is buying it, which drives the price up, making me money"). That is rational, but it's about price mechanics, not information.
  *   **Information Cascade** is purely about **informational externalities**. It occurs when the *action* of the predecessor conveys information to the successor.

  In your college scenario:
  1.  **Private Signal:** "I visited the campus and liked it" or "My sibling says it's good."
  2.  **Public Action:** Submitting an application.
  3.  **The Inference:** Student #3 thinks, "Student #1 and #2 are smart. They wouldn't both apply unless there was a strong signal. My private signal (that the school is mediocre) is likely the outlier."
  4.  **The Cascade:** Student #3 applies. Now Student #4 sees three applicants. The weight of public history is now so heavy that even a strong private signal against the school won't outweigh it.

  The key insight of the theory is that **once the cascade starts, information stops aggregating.** The decisions of people #3 through #30 contain *zero* new information about the quality of the college, because they were all just copying the first two. The system becomes "fragile."

  ### 2. Good Information vs. Noise (The "Incorrect Cascade")

  You asked if there is a distinction in the literature between cases where early people had good info versus cases where they were random/misleading.

  In the standard model, it is assumed that private signals are **probabilistic but informative** (e.g., a signal is correct 60% of the time, wrong 40% of the time). No one has perfect information.

  The literature distinguishes between **Correct Cascades** and **Incorrect Cascades**.

  *   **Correct Cascade:** The early signals happen to align with the truth. The cascade forms, and the group converges on the right answer. This looks like "wisdom of the crowd."
  *   **Incorrect Cascade:** The early signals happen to be the "wrong" 40%. Because actions are observable but *signals* are not, the group locks into the wrong choice.

  **The Distinction You're Looking For:**
  There isn't a separate *name* for when the early info is noise vs. signal, because the *mechanism* is identical. However, economists discuss the **Efficiency of the Cascade**.

  An Information Cascade is inherently **inefficient** because private information is suppressed. If the first two people got "lucky" (good info), the inefficiency doesn't matter. If they got "unlucky" (misleading info), the inefficiency leads to a systemic error.

  This leads to the concept of **Fragility**. Because the people inside the cascade are ignoring their private info, that info never enters the public pool. This means a cascade can be overturned by a very small amount of new *public* information.
  *   *Example:* If a guidance counselor sends one email saying, "Hey, that college has a 10% job placement rate," the cascade might instantly shatter, because suddenly there is new public data that outweighs the history of applications.

  ### 3. Why your intuition about "Random" vs. "Specific" matters

  You mentioned: *"In one case the cascade is kinda unlucky but the reasoning was sound, in the other the whole thing is built on noise."*

  If the first two people literally had **no information** (pure random noise), a rational third person *should not* follow them. The mathematical model of an Information Cascade requires that the predecessors are assumed to be acting on *some* signal.

  However, in the real world (like your college example), there is often **Ambiguity about Competence**.
  *   If Student #1 applies, Student #2 assumes Student #1 has a reason.
  *   If Student #1 actually *didn't* have a reason (they just picked a name out of a hat), but Student #2 *believes* they did, an Information Cascade can still trigger.

  Some behavioral economists call this a **Spurious Cascade** or **Base-Rate Neglect Cascade**. This happens when observers overestimate the quality of the private information held by early movers. They assume, "Surely they know something," when in reality, the early movers were just guessing. This is common in financial markets (a trader buys, others assume the trader has insider info, but the trader was just guessing).

  ### 4. Summary of Terms

  If you want to use the precise vocabulary for this pattern:

  1.  **The Phenomenon:** **Information Cascade**.
  2.  **The Mechanism:** **Bayesian Updating** based on **Observational Learning**.
  3.  **The Outcome:** Can be a **Correct Cascade** or an **Incorrect Cascade**.
  4.  **The Vulnerability:** **Fragility** (the cascade is stable until a small shock of public info breaks it).
  5.  **The Distinction from Herding:** Herding often implies payoff benefits (I benefit because you join); Cascades imply informational benefits (I learn because you joined).

  ### 5. Why this matters (and how to fix it)

  The reason this concept is so important in economics and platform design is that it suggests **sequential decision-making is flawed.**

  If you want the "wisdom of the crowd," you cannot let people decide one after another while seeing previous results.
  *   **Online Reviews:** This is why sites like TripAdvisor or Amazon sometimes randomize the order of reviews, or hide the aggregate score until after you've written your own. They are trying to prevent an Information Cascade so that your private signal (your actual experience) gets recorded rather than suppressed.
  *   **Voting:** Secret ballots are designed specifically to prevent information cascades. If voting were public and sequential, the first few voters would determine the election regardless of what the rest of the population knew.

  So, you aren't just observing "people are sheep." You are observing a mathematical failure mode in how rational agents aggregate data sequentially. It has a name, it's well-documented, and it explains why smart groups often do stupid things.

  **Term to use:** **Information Cascade**.
  **Nuance to add:** Mention whether it is an **Incorrect Cascade** driven by **early signal noise**.
