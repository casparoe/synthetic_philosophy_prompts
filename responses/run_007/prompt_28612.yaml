answer: |-
  Given your constraints—4,000 words, three months, and high school coursework—you cannot afford to write a survey. A survey would result in a shallow summary of two complex thinkers. To write a high-scoring extended essay, you must construct an **argument**. This means you need to identify a tension within the debate and take a position on it.

  To help you allocate your limited research time for the highest return, I have ranked three sub-questions below. My ranking is based on three specific criteria:

  1.  **Argumentative Leverage:** Does answering this question allow you to say something critical rather than just descriptive? (Does it help you build a thesis?)
  2.  **Textual Tractability:** Can you find sufficient evidence in reliable English translations without needing fluency in Classical Chinese or specialized sinology?
  3.  **Philosophical Payoff:** Does this question get to the *heart* of the ethical disagreement, rather than getting stuck on semantics or modern anachronisms?

  Here is the ranking of the sub-questions you should pursue, followed by the rejected alternatives and the trade-offs involved.

  ---

  ### Rank 1: The Coherence of Moral Origins (The "Sage Paradox" vs. The "Environmental Excuse")

  **The Question:** *If human nature is bad (Xunzi), where did the first Sage come from to create ritual? If human nature is good (Mencius), why is moral failure so pervasive despite our innate sprouts?*

  **Why this is Rank 1:**
  This is the highest-leverage question for a 4,000-word essay. It forces you to test the internal logic of both systems. It moves you beyond "Mencius says X, Xunzi says Y" to "Mencius's system struggles to explain Z, whereas Xunzi handles Z better, but at the cost of W."

  *   **For Xunzi:** You will investigate the "Sage Paradox." If everyone is born with a bad nature (self-interested, chaotic), how did the ancient Sage Kings manage to step outside that nature to invent *li* (ritual) and *yi* (righteousness)? Xunzi claims Sages are no different from commoners in nature; if so, how did they achieve the "artificial" goodness required to teach others?
  *   **For Mencius:** You will investigate the problem of corruption. If we all have sprouts of virtue, why do so many people become vicious? Mencius blames the environment (the "Ox Mountain" analogy), but is this sufficient? Does it let individuals off the hook too easily?

  **Tractability & Payoff:**
  This is highly tractable because the primary texts address these objections directly. Xunzi explicitly discusses the Sage's ability to "accumulate" goodness; Mencius explicitly discusses the loss of the "heart." You do not need secondary scientific literature; you need close reading. The payoff is high because it allows you to evaluate which philosopher offers a more *consistent* explanation of the human condition, which is a strong basis for a conclusion.

  ### Rank 2: The Normative vs. Descriptive Definition of *Xing* (Nature)

  **The Question:** *Is the disagreement merely terminological, or does their definition of "nature" reveal a deeper disagreement about what human beings are "for"?*

  **Why this is Rank 2:**
  You already know they define *xing* differently. Rank 2 pushes you to ask *why* that definition matters philosophically. This question serves as the conceptual foundation for Rank 1.

  *   **Mencius:** Uses a **normative** definition. *Xing* is not just what is biologically given, but what distinguishes humans from beasts (our moral potential). To be fully human is to realize this nature.
  *   **Xunzi:** Uses a **descriptive** definition. *Xing* is what is "heaven-sent" and unlearned (hunger, desire). Morality is not "natural" but "human-made."

  **Tractability & Payoff:**
  This is essential to prevent your essay from collapsing into the claim that "they are just talking past each other." By ranking this second, I am suggesting you use this analysis to *support* your argument in Rank 1, rather than making it the whole essay. If you spend too much time here, you risk writing a philological paper (about words) rather than a philosophical one (about ideas). However, you cannot argue about Moral Origins (Rank 1) without clarifying what they mean by "Nature" (Rank 2).

  **Research Focus:** Look for passages where Mencius discusses "what is small vs. what is great" in the body, and where Xunzi distinguishes between the "work of heaven" and the "work of man."

  ### Rank 3: Cultivation as Recovery vs. Construction

  **The Question:** *Does self-cultivation consist in recovering what is already there (Mencius) or constructing something new through discipline (Xunzi), and which model is more empowering for the moral agent?*

  **Why this is Rank 3:**
  This is the practical application of the metaphysical debate. It connects the ancient text to the experience of education and self-improvement, which is relevant to you as a student.

  *   **Mencius:** Education is gardening (nurturing sprouts). The risk is complacency ("I'm already good inside").
  *   **Xunzi:** Education is carpentry (straightening warped wood). The risk is alienation ("Goodness is not really me; it's imposed").

  **Tractability & Payoff:**
  This is a strong concluding theme. It allows you to discuss the "cash value" of the debate. However, it is ranked third because it relies on the work done in Ranks 1 and 2. If you haven't established *why* their natures differ (Rank 2) and *how* their systems hold together (Rank 1), a discussion on education will feel superficial. Use this to frame your conclusion or your final analytical section.

  ---

  ### Rejected Alternatives (and Why)

  To ensure you stay within 4,000 words, you must actively avoid these tempting but low-return paths:

  **1. Contemporary Developmental Psychology**
  *   *The Idea:* Using modern science to decide who is right (e.g., do babies show empathy?).
  *   *Why Rejected:* **High Risk of Anachronism.** Mapping "sprouts" onto cognitive science or "ritual" onto behavioral psychology requires a level of expertise in both philosophy and science that is difficult to achieve in a high school essay. You risk oversimplifying the science or distorting the philosophy. Furthermore, science describes *what is*, while Mencius and Xunzi are largely arguing about *what ought to be*. This distracts from the philosophical core.

  **2. Purely Political/Legal Implications**
  *   *The Idea:* How would a Mencian state differ from a Xunzian state?
  *   *Why Rejected:* **Scope Creep.** While both thinkers have political views, your prompt focuses on *human nature*. Drifting into legal systems or governance structures will consume word count that you need for analyzing the ethical arguments. Keep the focus on the individual's moral psychology unless you can tightly link it back to *xing*.

  **3. The "Merely Terminological" Dispute**
  *   *The Idea:* Arguing that the debate is fake because they define words differently.
  *   *Why Rejected:* **Philosophically Shallow.** While it is true they define *xing* differently, concluding that "therefore they aren't really disagreeing" shuts down inquiry. As Rank 2 suggests, the *reason* they define it differently is itself a profound philosophical disagreement about whether morality is internal or external. Don't let the terminological point be your conclusion; let it be your starting tool.

  ---

  ### Criteria and Trade-Offs

  In producing this ranking, I made specific trade-offs based on your situation as a high school researcher with a 4,000-word limit.

  **1. Depth over Breadth (The Word Count Trade-off)**
  *   *Criterion:* **Argumentative Leverage.**
  *   *Trade-off:* I have sacrificed a comprehensive overview of their lives, historical context, and political theories. You will not have space to discuss the Warring States period in detail or compare their views on economics.
  *   *Defense:* In a short essay, a narrow, deep argument scores higher than a broad, shallow summary. Focusing on the "Coherence of Moral Origins" (Rank 1) allows you to demonstrate critical thinking, which is the primary grading criterion for extended essays.

  **2. Textual Analysis over Secondary Literature (The Tractability Trade-off)**
  *   *Criterion:* **Textual Tractability.**
  *   *Trade-off:* I am steering you away from heavy engagement with modern scholarly debates (e.g., the "Ivanhoe vs. Nivison" debates on Xunzi).
  *   *Defense:* While secondary literature is important, getting bogged down in scholarly disputes can paralyze a high school writer. Your primary evidence should be the *Mencius* and *Xunzi* texts themselves (in good translation). Use secondary sources to clarify the text, not to replace it. This ensures your voice remains central.

  **3. Philosophy over Science (The Relevance Trade-off)**
  *   *Criterion:* **Philosophical Payoff.**
  *   *Trade-off:* I have explicitly deprioritized the "Science" angle, even though it is engaging.
  *   *Defense:* The Mencius-Xunzi debate is normative (about value), not just descriptive (about facts). Bringing in psychology often confuses these categories. Sticking to the philosophical logic ensures you remain within the bounds of the humanities research methodology expected in this type of essay.

  ### Strategic Recommendation for Your 3-Month Plan

  To execute this within your timeline:

  *   **Month 1 (Textual Immersion):** Focus exclusively on **Rank 2**. Read the key chapters on human nature in both texts. Annotate specifically for how they define *xing*. Do not worry about the "Sage Paradox" yet. Establish the conceptual groundwork.
  *   **Month 2 (Argument Construction):** Focus on **Rank 1**. Try to break their arguments. Write a draft where you argue *against* Mencius using Xunzi's logic, and vice versa. This is where you find your thesis. (e.g., *"While Xunzi offers a more realistic account of moral failure, Mencius provides a more sustainable motivation for cultivation."*)
  *   **Month 3 (Synthesis and Refinement):** Focus on **Rank 3**. Use the "Cultivation" angle to bring the essay home. Connect the abstract debate to the concrete reality of learning. This makes the essay resonate with the reader. Edit heavily to ensure you haven't exceeded 4,000 words.

  By prioritizing the **Coherence of Moral Origins**, you ensure your essay is an investigation, not a report. By grounding it in the **Definition of *Xing***, you ensure it is philosophically precise. By concluding with **Cultivation**, you ensure it is humanly relevant. This hierarchy offers the highest probability of a sophisticated, manageable, and high-scoring essay.
