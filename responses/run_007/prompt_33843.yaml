  ### Analysis of Candidate Rules

  To determine the best account of your friend's behavior, we evaluate the rules based on how well they fit the recorded choices and how definitively they predict the new choice.

  #### 1. Risk-Weighted Expected Utility (REU) with Linear Utility
  This model assumes your friend values money linearly ($u(x) = x$) but distorts probabilities using a weighting function, $w(p)$. For a 50–50 gamble between a high outcome ($H$) and a low outcome ($L$), the value is $V = L + w(0.5) \times (H - L)$.

  *   **Fitting the Data:**
      *   **Choice 1 ($30 > 50/50 [\$100, \$0]$):** $30 > 0 + w(0.5)(100) \implies w(0.5) < 0.30$.
