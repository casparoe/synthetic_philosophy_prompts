  ### Conclusion: The Better Account
  **Risk-Weighted Expected Utility (REU) with a linear utility function** gives the better account. It is superior because it is **determinate**: the bounds established by her previous choices mathematically constrain the value of the new gamble to be lower than the sure offer. Expected Utility is too flexible; it can be calibrated to fit the past data while predicting either choice for the future, making it a weaker explanation for her specific pattern of behavior.

