answer: |-
  This is one of the most significant and well-discussed objections to the Knowledge Norm of Assertion (KNA), often referred to as the **False Belief Objection** or the problem of **Blameless Violations**.

  Your intuition is shared by many critics of KNA (such as Jennifer Lackey and Peter J. Graham), who argue that the 1850s physician case demonstrates that KNA is too demanding. However, proponents of KNA (most notably Timothy Williamson and John Turri) have developed sophisticated responses.

  To answer your question: **Does this case show KNA conflates objective propriety with subjective justification?** The answer depends on whether one accepts the distinction between *violating a norm* and *being blameworthy for that violation*.

  Here is an analysis of the debate, the defenses of KNA, and the implications for adopting a weaker norm.

  ### 1. The Core Tension: Objective vs. Subjective
  Your argument rests on the fact that knowledge is factive (you cannot know a falsehood). Therefore:
  1.  **KNA:** Assert $p$ only if you know $p$.
  2.  **Fact:** The physician does not know $p$ (because $p$ is false).
  3.  **Conclusion:** The physician violates KNA.

  The intuition that the physician is epistemically responsible suggests that **epistemic propriety should track subjective justification, not objective truth.** If we accept this, KNA seems to fail because it judges the assertion based on facts outside the speaker's cognitive reach (the actual truth of miasma theory).

  ### 2. The KNA Defense: The "Excuse" Strategy
  Proponents of KNA do not deny that the physician's assertion is intuitively acceptable. Instead, they argue that **acceptability does not equal norm satisfaction.** They distinguish between:
  *   **Primary Normativity:** Whether the assertion satisfies the constitutive rule of the speech act (Did you know?).
  *   **Secondary Normativity:** Whether the speaker is blameworthy for the assertion (Were you reasonable?).

  **The Analogy:** Consider a traffic law: "Do not drive over 60 mph."
  *   If your speedometer malfunctions and reads 55 mph while you are actually going 65 mph, you have **violated the law** (objective fact).
  *   However, you are **not blameworthy** (subjective justification).

  KNA proponents argue the physician case is identical. She violated the knowledge norm (objective propriety), but she is **excused** because she satisfied a secondary norm of reasonable belief. On this view, KNA does not conflate the two; rather, it posits that the *standard* for assertion is knowledge, even if we excuse people who reasonably fail to meet it.

  ### 3. Arguments for Adopting a Weaker Norm (JBA/RBA)
  Despite the "excuse" strategy, many philosophers argue we should adopt a **Justified Belief Norm (JBA)** or **Reasonable Belief Norm (RBA)**. Your physician case is the primary evidence for this.

  **Advantages of Weaker Norms:**
  *   **Matches Intuition:** It aligns with the judgment that the physician did nothing wrong, not even technically. She asserted properly relative to her epistemic position.
  *   **Internalism:** It respects the internalist intuition that epistemic norms should depend only on what is accessible to the agent's mind, not on external facts (like whether miasma actually causes cholera).
  *   **Simplicity:** It removes the need for a complex distinction between "violating but being excused" versus "properly asserting."

  ### 4. Arguments for Retaining KNA (The Costs of Weakening)
  If we switch to a Justified Belief Norm, we lose explanatory power in other areas. KNA proponents argue that weaker norms fail to explain two critical phenomena:

  **A. The Lottery Paradox**
  *   You hold a ticket in a fair 1,000-ticket lottery. The odds of losing are 99.9%. You are *justified* in believing your ticket will lose.
  *   **JBA:** Permits you to assert, "Your ticket will lose."
  *   **KNA:** Forbids you to assert this (because you don't *know* it will lose; it might win).
  *   **Intuition:** Asserting "Your ticket will lose" before the draw seems improper, even if highly probable. KNA explains this; JBA struggles to.

  **B. Moorean Paradoxes**
  *   Consider the assertion: "It is raining, but I don't know it is raining."
  *   This sounds absurd.
  *   **KNA:** Explains this perfectly. To assert the first conjunct, you must know it. But the second conjunct says you don't. You are contradicting the norm of the speech act itself.
  *   **JBA:** "It is raining, but I don't justifiably believe it." This is less paradoxical. If justification is the norm, this sentence is still weird, but KNA explains the "pungency" of the paradox better.

  ### 5. Nuanced Middle Grounds
  Some philosophers propose modifications to KNA that attempt to save the physician without abandoning knowledge as the core standard:

  *   **Contextualism:** Perhaps "knows" changes meaning based on context. In 1850 medical contexts, the standards for "knowing" were lower. She *did* know relative to her context.
  *   **Pragmatic Encroachment:** Knowledge depends on practical stakes. If the stakes were low, she knew. (Though in medicine, stakes are usually high, making this difficult).
  *   **Warranted Assertibility:** Some argue the norm is not knowledge *simpliciter*, but "knowledge-level warrant." If the evidence is good enough that it *would* yield knowledge if the world were cooperative, assertion is permitted.

  ### Conclusion
  Does the physician case show KNA conflates objective propriety with subjective justification?
  *   **Yes,** if you believe a norm should only govern what is within the agent's control. If a norm condemns a responsible agent, it seems to be the wrong norm for *evaluating the agent*.
  *   **No,** if you view the norm of assertion as defining the *speech act itself* rather than evaluating the speaker. Just as a goal in soccer is objective (the ball must cross the line), the norm of assertion might be objective (the proposition must be known), regardless of the player's effort.

  **Should we adopt a weaker norm?**
  Adopting a Justified Belief Norm solves the physician problem but creates the Lottery and Moorean problems.
  The current philosophical consensus is somewhat divided, but a popular compromise is to **retain KNA as the constitutive norm** (defining what assertion *is*) while acknowledging a **separate ethical/epistemic norm of blamelessness** (evaluating the *speaker*).

  This preserves the insight that assertion aims at knowledge (explaining why we criticize false assertions even when justified) while accommodating the intuition that the 1850s physician was not epistemically culpable. She violated the rule of the game, but she had a valid excuse.
