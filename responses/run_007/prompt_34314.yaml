answer: |-
  Your intuition is seductive, and indeed, Allais himself wielded it to challenge expected utility theory. However, the mistake lies in allowing the common consequence—the 89% chance of one million—to alter your valuation of the remaining outcomes. Rationality requires that if two acts yield identical results in a particular state of the world, your preference between them should depend solely on the states where they differ. In both choices, 89% of the time you end up with the same million; effectively, that portion of the gamble cancels out. By letting the certainty of A sway you in the first pair but ignoring that same probability structure in the second, you are allowing a common consequence to drive a wedge between logically equivalent choices. It is not a matter of taste, but of logical coherence: you are effectively asserting that the same probabilistic difference matters in one context but not another, which undermines the very possibility of consistent decision-making.
