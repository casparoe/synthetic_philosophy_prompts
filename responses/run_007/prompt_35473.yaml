      *   **Constraint:** Needs to be rigorous (upper-level undergrad), identifying subtle misreadings vs. outright errors.

  2.  **Analyze the Student Answer:**
      *   **Paragraph 1 (Distinction):** Defines rightness as property of action/conformity to law. Defines moral worth as property of will/motive/credit. Notes action can be right without worth (accident/self-interest).
          *   *Assessment:* Accurate and clear. Good distinction between action-evaluation and agent-evaluation.
      *   **Paragraph 2 (Kant's Claim + Shopkeeper):** States Kant's view (from duty, not merely in accordance). Uses the Shopkeeper example (honesty for business = prudence, not duty). Says "That seems right as far as it goes."
          *   *Assessment:* Accurate representation of Kant's Shopkeeper example. Acknowledges the intuitive pull of the view (what it gets right).
      *   **Paragraph 3 (Critique + Parent Example):** Claims the criterion is "too strong." Argues it implies *any* inclination prevents moral worth. Uses the Parent saving child example (moved by love, not duty). Claims Kant must say this has no moral worth. Claims even if duty is recognized, presence of inclination prevents it from being "from duty." Concludes Kant can't distinguish shopkeeper from parent.
          *   *Assessment:* **Major Error.** This is a common misreading of Kant (the "overriding inclination" vs. "absence of inclination" confusion). Kant does *not* claim that the presence of inclination negates moral worth. He claims the *determining ground* must be duty. One can have inclination and still act from duty (as long as duty is the sufficient motive). The student conflates "acting from inclination" with "having inclination." This undermines the critique.
      *   **Paragraph 4 (Epistemology):** Claims we settle whether someone acted from duty by asking them (sincere report).
