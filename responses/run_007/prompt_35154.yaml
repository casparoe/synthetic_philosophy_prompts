      *   *Strategy:* I will perform the ranking as requested (internal validity relative to the desiderata) but add a prominent disclaimer section distinguishing the *performance relative to the prompt's criteria* from the *philosophical consensus on the norms themselves*.

  6.  **Refining the Scores:**
      *   *Knowledge Norm:* It handles both cases well *conceptually*. However, some argue that in case (i), the hearer *shouldn't* feel wronged if the speaker was fully justified. But given the prompt's assumption ("explain why a hearer is entitled to feel wronged"), KN gets high marks. Let's say 9/9 to allow for nuance (e.g., Gettier cases).
      *   *Truth Norm:* Definitely 10 on (i). Definitely 0 on (ii).
      *   *Belief Norm:* 0 on both regarding *wronging* based on truth/justification status.
      *   *Justification/Reasonable:* 0 on (i) because by definition they are satisfied in the "excellent evidence" case. 10 on (ii).

  7.  **Structuring the Response:**
