  2.  **Deconstruct the Desiderata:**
      *   *Desideratum (i) (False + Good Evidence):* This targets the "Gettier" or "Unlucky Justified" case. The speaker did everything right epistemically but was wrong. If the hearer feels wronged, the norm must be violated.
          *   If the norm is *Truth*, it's violated (Assertion was false).
          *   If the norm is *Knowledge*, it's violated (No knowledge of falsehood).
          *   If the norm is *Justification/Reasonable*, it's *not* violated (Speaker had good evidence).
          *   If the norm is *Belief*, it's *not* violated (Speaker likely believed it).
      *   *Desideratum (ii) (True + Reckless Hunch):* This targets the "Lucky Guess" case. The speaker got it right but did everything wrong epistemically. If the hearer feels wronged, the norm must be violated.
          *   If the norm is *Truth*, it's *not* violated (Assertion was true).
          *   If the norm is *Knowledge*, it's violated (No knowledge via luck/recklessness).
          *   If the norm is *Justification/Reasonable*, it's violated (No justification/reasonableness).
          *   If the norm is *Belief*, it's *not* violated (Speaker likely believed the hunch).

  3.  **Evaluate Each Candidate Norm:**

      *   **Knowledge Norm (KN):** "Assert $p$ only if you know $p$." (Williamson)
          *   (i) False + Good Evidence: Speaker doesn't know $p$ (since $p$ is false). Violation. Hearers feel wronged because knowledge was lacking. Score: High (9-10).
          *   (ii) True + Reckless: Speaker doesn't know $p$ (luck/recklessness defeats knowledge). Violation. Hearers feel wronged because knowledge was lacking. Score: High (9-10).
          *   *Status:* Highly influential, but contested whether it's *the* norm.

      *   **Truth Norm (TN):** "Assert $p$ only if $p$ is true."
          *   (i) False + Good Evidence: $p$ is false. Violation. Explains the wrong. Score: High (10).
          *   (ii) True + Reckless: $p$ is true. No violation. Cannot explain why hearer feels wronged (unless we add caveats, but strictly speaking, TN is satisfied). Score: Low (0-2).
          *   *Status:* Often considered too weak or extensionally inadequate by epistemologists, though intuitively strong on falsity.

      *   **Belief Norm (BN):** "Assert $p$ only if you believe $p$." (Gricean quality-ish)
          *   (i) False + Good Evidence: Speaker believes $p$. No violation. Cannot explain the wrong. Score: Low (0-2).
          *   (ii) True + Reckless: Speaker believes $p$ (even if on a hunch). No violation. Cannot explain the wrong. Score: Low (0-2).
          *   *Status:* Generally seen as necessary but not sufficient.

      *   **Justification Norm (JN):** "Assert $p$ only if you are justified in believing $p$."
          *   (i) False + Good Evidence: Speaker is justified. No violation. Cannot explain the wrong (this is the classic objection to justification norms). Score: Low (0-2).
          *   (ii) True + Reckless: Speaker is *not* justified. Violation. Explains the wrong. Score: High (9-10).
          *   *Status:* Competitor to KN, struggles with the false justified case.

      *   **Reasonable-to-Believe Norm (RBN):** "Assert $p$ only if it is reasonable for you to believe $p$." (Douven, etc.)
          *   *Note:* This is very similar to Justification. Sometimes distinguished by context-sensitivity.
          *   (i) False + Good Evidence: It was reasonable. No violation. Score: Low (0-2).
          *   (ii) True + Reckless: It was not reasonable. Violation. Score: High (8-9).
          *   *Status:* Similar issues to JN.

  4.  **Drafting the Scores and Reasoning:**

      *   *KN:* (i) 10, (ii) 10. Best fit for both.
