  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Crucial Step:* I must not present the Knowledge Norm as the undisputed winner. While it scores best on *these specific desiderata*, the field is not settled that KN is the correct norm. Many philosophers argue against KN (e.g., assertion accounts for other things, context sensitivity, lottery paradox issues).
