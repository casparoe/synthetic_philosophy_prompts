      *   **Candidates:** Knowledge Norm, Truth Norm, Belief Norm, Justification Norm, Reasonable-to-Believe Norm.
      *   **Output Format:** Score (0-10) for each desideratum per candidate, overall ranking, brief reasoning per candidate.
