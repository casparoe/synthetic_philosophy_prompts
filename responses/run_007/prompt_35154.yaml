answer: |-
  ### Preface: Settled vs. Contested Terrain

  Before presenting the ranking, it is crucial for your seminar to distinguish between the **internal performance** of these norms relative to your specific desiderata and the **external philosophical consensus** regarding the norms themselves.

  **What is Settled:**
  *   There is **no consensus** on the single correct norm of assertion. The field remains pluralistic.
  *   There is broad agreement that the **Belief Norm** is necessary but insufficient (i.e., you shouldn't assert what you don't believe, but believing isn't enough).
  *   There is agreement that all candidate norms face counterexamples in edge cases (e.g., lottery propositions, Moorean paradoxes, or selfless assertions).

  **What is Genuinely Contested:**
  *   **The Desiderata Themselves:** Many epistemologists contest Desideratum (i). Proponents of justification-based norms (e.g., Igor Douven) argue that a speaker with excellent evidence is *blameless* and that a hearer is *not* entitled to feel wronged by a false assertion if the speaker was epistemically responsible. Presenting the hearer's reaction as a fixed data point privileges Knowledge/Truth norms over Justification norms from the outset.
  *   **The Knowledge Norm:** While highly influential (following Timothy Williamson), it is contested whether knowledge is the *constitutive* norm or merely a derivative feature. Some argue it is too demanding for ordinary conversation.
  *   **Contextualism:** Many contemporary theorists argue that the norm of assertion shifts depending on context (e.g., casual chat vs. courtroom), meaning a single ranking may oversimplify the landscape.

  ***

  ### Ranking of Candidate Norms

  The following ranking evaluates how well each norm explains the hearer's entitlement to feel wronged in the two specific scenarios you provided. **A high score indicates the norm is violated in that scenario; a low score indicates the norm is satisfied (and thus cannot explain the complaint via norm violation).**

  | Rank | Candidate Norm | Score (i): False + Good Evidence | Score (ii): True + Reckless Hunch | Total |
  | :--- | :--- | :---: | :---: | :---: |
  | **1** | **Knowledge Norm** | **9** | **9** | **18** |
  | **2** | **Truth Norm** | **10** | **0** | **10** |
  | **3** | **Justification Norm** | **0** | **10** | **10** |
  | **4** | **Reasonable-to-Believe Norm** | **0** | **9** | **9** |
  | **5** | **Belief Norm** | **0** | **0** | **0** |

  ***

  ### Detailed Evaluation

  #### 1. The Knowledge Norm ("Assert $p$ only if you know $p$")
  *   **Reasoning:** This norm performs best relative to your desiderata. In case (i), the speaker lacks knowledge because the proposition is false, violating the norm and explaining the hearer's grievance. In case (ii), the speaker lacks knowledge because reckless hunches do not constitute knowledge (even if true), also violating the norm.
  *   **Seminar Note:** Emphasize that this norm's dominance here relies on the intuition that knowledge requires both truth and non-accidental justification. However, remind students that critics argue this norm makes assertion too difficult in high-stakes/low-evidence contexts.

  #### 2. The Truth Norm ("Assert $p$ only if $p$ is true")
  *   **Reasoning:** This norm perfectly explains case (i): the assertion was false, so the norm was violated, justifying the hearer's feeling of being wronged. However, it completely fails case (ii): the assertion was true, so the norm was satisfied, leaving the hearer's complaint unexplained by the norm itself.
  *   **Seminar Note:** This is often viewed as an objective standard that ignores the speaker's epistemic position. It highlights the tension between objective correctness and subjective responsibility.

  #### 3. The Justification Norm ("Assert $p$ only if you are justified in believing $p$")
  *   **Reasoning:** This norm is the inverse of the Truth Norm regarding your desiderata. It fails case (i) because the speaker *was* justified (excellent evidence), so no norm was violated to explain the hearer's grievance. It succeeds in case (ii) because a reckless hunch lacks justification, violating the norm.
  *   **Seminar Note:** Use this to illustrate the "Gettier problem" for assertion. If students feel the hearer *should* be able to complain in case (i), this suggests justification is insufficient. If they feel the speaker was blameless in case (i), this norm gains traction.

  #### 4. The Reasonable-to-Believe Norm ("Assert $p$ only if it is reasonable for you to believe $p$")
  *   **Reasoning:** This functions similarly to the Justification Norm but often incorporates pragmatic or contextual factors. It scores slightly lower than strict Justification on case (ii) only because "reasonableness" can sometimes be argued to be more lenient than strict epistemic justification, but generally, it fails case (i) (it was reasonable) and passes case (ii) (it was unreasonable).
  *   **Seminar Note:** This norm is often proposed to handle lottery paradoxes better than the Knowledge Norm. Its performance here mirrors the Justification Norm, highlighting that evidence-based norms struggle with unlucky falsehoods.

  #### 5. The Belief Norm ("Assert $p$ only if you believe $p$")
  *   **Reasoning:** This norm fails both desiderata. In case (i), the speaker likely believed the proposition (given the excellent evidence). In case (ii), the speaker likely believed the hunch. Since the norm is satisfied in both cases, it cannot explain why the hearer feels wronged.
  *   **Seminar Note:** This is widely regarded as a necessary condition for sincere assertion but not a sufficient condition for *warranted* assertion. It explains lying, but not error or recklessness.

  ***

  ### Pedagogical Recommendation for the Session

  To maintain philosophical rigor, structure the seminar to question the **scoring criteria** as much as the norms.

  1.  **Challenge Desideratum (i):** Ask students who defend the Justification Norm: "If the speaker did everything right epistemically, why is the hearer entitled to feel wronged?" If students agree the hearer is *not* entitled, the Justification Norm rises in the ranking.
  2.  **Challenge Desideratum (ii):** Ask students who defend the Truth Norm: "If the information was useful and true, what is the harm in the reckless hunch?" This tests whether the norm of assertion is about *information transfer* (Truth) or *epistemic responsibility* (Knowledge/Justification).
  3.  **Highlight the Consensus Gap:** Conclude by noting that while the **Knowledge Norm** wins this specific comparative evaluation, it is not the "winner" of the field. The ranking demonstrates that the choice of norm depends entirely on which conversational intuitions (truth, responsibility, or knowledge) one prioritizes.
