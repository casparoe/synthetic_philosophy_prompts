  **The longtermist framework**
  Strong longtermism posits that the expected value of our actions is dominated by their impact on the very long-run future—potentially billions of lives across cosmic time. Unlike weak longtermism or standard intergenerational equity, which weigh future welfare alongside present needs, strong longtermism argues that preventing existential catastrophe (extinction or permanent civilizational collapse) is the paramount moral priority. Consequently, policy evaluation prioritizes interventions that reduce existential risk (x-risk) or positively alter the trajectory of civilization (trajectory changes). Near-term welfare improvements are secondary unless they instrumentally secure the long run. For the Montreal Protocol, a strong longtermist evaluates the decision not by lives saved in 2000, but by how the 1987 choice influenced the probability of humanity surviving to 3000 and beyond, focusing on institutional precedents, technological lock-ins, and the development of global governance capacity required to handle future, deadlier threats. The framework demands we weigh the certainty of near-term benefits against the magnitude of long-term probabilistic shifts.

  **Mapping the analysis**
  In 1987, nations faced options: immediate phaseout, delayed action, or inaction. A standard analysis counts avoided cancers. A strong longtermist calculus asks: does ozone collapse threaten extinction? Likely not directly; humanity would survive even with devastated agriculture, though population carrying capacity would drop significantly, potentially leading to resource wars. Thus, the direct x-risk reduction is negligible but non-zero. However, the decision affects the far future through trajectory channels. Success established a precedent for binding global environmental governance, potentially lowering coordination costs for future existential threats like climate change or bioengineering. Failure would have signaled the impossibility of global cooperation, locking in a trajectory of institutional incapacity. Furthermore, phasing out CFCs avoided a potential technological lock-in where industrial dependence made future remediation impossible. The mechanism linking 1987 to 3000 is institutional learning: proving humanity can solve global commons problems increases the probability of solving future, deadlier ones. If the Protocol increased the probability of surviving future x-risks by even 0.01%, its expected value dwarfs the near-term health benefits. However, this calculus is ambiguous; if the resources spent on the Protocol could have directly reduced x-risk elsewhere (e.g., nuclear security), the opportunity cost might outweigh the precedent value. The longtermist must weigh the certainty of institutional precedent against the speculative nature of future threats, acknowledging that the Protocol's primary long-term value is not ozone itself, but the proof-of-concept for global coordination. Additionally, the choice of replacement chemicals (HCFCs vs HFCs) created secondary long-term effects on climate forcing, showing how technical decisions ripple across centuries. The analysis requires estimating the elasticity of future cooperation relative to past success, a highly uncertain variable. Moreover, the counterfactual of inaction involves not just UV damage, but the potential normalization of environmental neglect. If humanity had failed to act on a clear scientific consensus in 1987, it might have entrenched a political culture incapable of responding to climate change later. Thus, the Protocol's value lies in breaking a potential cycle of inaction. The longtermist must also consider the technological path dependence; the shift to HFCs avoided worse ODS but introduced potent greenhouse gases, requiring the later Kigali Amendment. This shows how long-term value is iterative, not static.

