prompt: |-
  I'm a software engineer with no real philosophy background, and I've been trying to get my head around the Hofstadter idea of tangled hierarchies and the inviolate level — the Drawing Hands thing, where a hand draws the hand that's drawing it, and the claim that even a loop like that has to bottom out in some level that's held fixed, outside the tangle, or the whole thing collapses into regress. To me this sounds like it's obviously about stuff I already deal with: self-hosting compilers, metacircular interpreters, quines, bootstrapping, base cases, dependency cycles, the runtime that the language itself sits on. So here's what I want: restate the actual position (or positions — I get the sense there's a debate here, not one settled view) in that vocabulary, as faithfully as you can, and then tell me what didn't survive the translation.

  Make sure you check the obvious mappings. Is a metacircular interpreter a tangled hierarchy, and if it is, what's the inviolate level in it — the spec, the host language it's implemented in, the hardware? Is the bootstrap stage of a self-hosting compiler (the first compiler for a language, written in some other language) the same thing as an inviolate level, or is that just an implementation detail that disappears once the language can compile itself? Is a quine a tangled hierarchy or just a fixed point? And is the inviolate level just a base case in a recursive definition, or is the claim stronger than just saying recursion has to stop somewhere?

  Then give me the residue report: which parts of the idea map cleanly onto my vocabulary, which parts you had to fudge to make them fit, and which parts have no counterpart at all. I want an honest verdict on whether my instinct — that this is all just bootstrapping and base cases and the philosophy is mostly dressing — is right, or whether there's something in the inviolate level idea that my vocabulary literally can't state. And if its the latter, tell me whether that's becuase my vocabulary is missing something or becuase the idea is less clear than it looks.
