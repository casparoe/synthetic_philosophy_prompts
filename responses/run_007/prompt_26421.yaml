answer: |-
  You have put your finger on one of the most significant tensions in modern social psychology and moral philosophy. You are describing a phenomenon that has a specific name in psychology, a specific movement in philosophy, and a decades-long debate surrounding it.

  Here is the breakdown of the terminology, the literature, and the edges of the debate.

  ### 1. The Names

  There are three layers to naming what you are observing:

  **A. The Cognitive Bias: The Fundamental Attribution Error (FAE)**
  In social psychology, the tendency you described—overemphasizing personality-based explanations for behaviors observed in others while underemphasizing situational explanations—is called the **Fundamental Attribution Error** (also known as **Correspondence Bias**).
  *   **What it is:** A cognitive shortcut. When we see someone act, our brains default to "that's who they are" because it is cognitively cheaper than analyzing the context.
  *   **The Asymmetry:** Interestingly, we commit this error mostly regarding *others*. When explaining our *own* behavior, we tend to cite situations ("I snapped because I'm stressed"), but when others snap, we cite traits ("They snapped because they are angry people"). This is known as the **Actor-Observer Bias**.

  **B. The Theoretical Stance: Situationism**
  The broader theoretical claim that behavior is determined more by external situational factors than by internal character traits is called **Situationism**.
  *   **What it is:** An empirical challenge to the idea of robust, cross-situational character traits. Situationists argue that what we call "character" is often a post-hoc narrative we construct to make sense of fragmented behaviors.

  **C. The Academic Conflict: The Person-Situation Debate**
  This is the overarching name for the controversy in psychology (spiking in the 1960s-80s and resurging in philosophy in the 1990s) regarding whether personality traits exist and whether they predict behavior.

  ### 2. The Literature and Key Studies

  You mentioned the Darley & Batson (Good Samaritan) and Milgram (Obedience) studies. These are the pillars of the situationist argument. Here is the broader landscape:

  **The Psychological Roots:**
  *   **Hartshorne & May (1928):** In a massive study on character education, they found that children who were honest in one context (e.g., not cheating on a test) were not necessarily honest in another (e.g., not stealing coins). They concluded honesty was not a unified trait but specific to situations.
  *   **Walter Mischel (1968):** In his book *Personality and Assessment*, Mischel argued that personality traits correlate very weakly with actual behavior (often around 0.30). This sparked the "Person-Situation Debate."
  *   **The Stanford Prison Experiment (Zimbardo, 1971):** Often cited alongside Milgram, though now controversial methodologically, it reinforced the idea that roles and situations can override individual morality.

  **The Philosophical Turn:**
  In the late 1990s, philosophers realized that **Virtue Ethics** (the Aristotelian idea that morality is about cultivating stable character traits like courage or honesty) relied on an empirical assumption that psychology might have disproven.
  *   **Gilbert Harman:** In papers like "Moral Philosophy Meets Social Psychology" (1999), Harman argued that there is no such thing as character. He claimed virtue ethics is empirically untenable because situations, not traits, drive behavior.
  *   **John Doris:** In his book *Lack of Character* (2002), Doris systematized this. He argued that while "global traits" (honesty everywhere) don't seem to exist, we might have "local traits" (honesty-when-with-friends).

  ### 3. The Rough Sides of the Debate

  You asked for the edges of the tension. It is not a settled matter. Here are the three main positions currently held:

  **Side A: The Situationists (The Skeptics)**
  *   **Claim:** Global character traits are largely folk-psychological myths. We attribute consistency where there is none.
  *   **Evidence:** The studies you cited. If a "honest" person steals when no one is looking, or a "kind" person ignores a suffering stranger when late, the trait didn't do the work; the context did.
  *   **Implication:** We should stop blaming people's "nature" and focus on designing better environments (nudges, systems) to produce good behavior.

  **Side B: The Dispositionists (The Defenders of Traits)**
  *   **Claim:** Traits are real, but they are probabilistic, not deterministic.
  *   **Evidence:** Meta-analyses show that while traits don't predict a *single* action well, they predict *aggregated* behavior over time very well. If you measure a person's conscientiousness across 100 different situations, the trait emerges clearly.
  *   **Argument:** The fact that a generous person can be stingy once doesn't prove generosity is fake; it proves that traits interact with situations. A "patient" person still has a breaking point.
  *   **Key Figure:** Daniel Batson (ironically, the author of the Good Samaritan study) later argued that moral identity *does* exist but is rarer than we think.

  **Side C: The Interactionists (The Synthesis)**
  *   **Claim:** Behavior is a function of both Person and Situation ($B = f(P, S)$). This is the dominant view in modern psychology.
  *   **Nuance:** Situations select for traits. A high-pressure situation might suppress a mild trait, but a weak situation (where norms are unclear) allows traits to shine through.
  *   **Local Traits:** Philosophers like Doris suggest we abandon "global" virtues (Courage) for "local" virtues (Courage-in-physical-danger). This saves the concept of character but makes it much more fragmented.

  ### 4. Why the Mismatch Persists

  You asked why we keep talking as if traits are real if the evidence is so mixed. There are a few reasons:

  1.  **Cognitive Economy:** It is exhausting to analyze the situational variables of every interaction. Labeling someone "a jerk" is a useful heuristic for navigating the social world, even if it isn't scientifically precise.
  2.  **Moral Responsibility:** Our legal and moral systems rely on the idea of agency. If behavior is purely situational, it becomes harder to justify blame or praise. We cling to character concepts to preserve the notion that people *could have done otherwise*.
  3.  **Self-Narrative:** Humans have a deep psychological need for a coherent identity. We need to believe we are "the kind of person who does X" to maintain mental stability, even if our behavior fluctuates.

  ### Summary of the Tension

  The tension you are noticing is the gap between **Folk Psychology** (how we intuitively explain behavior using stable traits) and **Empirical Psychology** (which shows behavior is highly context-sensitive).

  *   **The Label:** Fundamental Attribution Error (the bias); Situationism (the theory).
  *   **The Debate:** Do robust character traits exist, or are they illusions created by ignoring context?
  *   **The Consensus:** Most experts now land on **Interactionism**. Traits exist, but they are not the magic bullets we imagine them to be. They are tendencies that interact with powerful situational forces.

  If you want to read further, John Doris's *Lack of Character* is the definitive philosophical text on this, and Richard Nisbett's *The Geography of Thought* or *Mindware* covers the psychological mechanisms behind why we miss the situational factors.
