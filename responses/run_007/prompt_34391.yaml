answer: |-
  Good evening. For those who don't know me, I'm [Daughter's Name]'s father. I also run a hardware store downtown.

  In my line of work, you learn pretty quickly that things hold together for two reasons: friction and faith. You have the nuts and bolts—the things you can tighten, measure, and test. But you also have the load you *expect* the shelf to carry five years from now. You can't measure that. You just have to trust the anchor.

  I look at my daughter, and I see the nuts and bolts. She is a geologist. She was raised to trust what she can hold in her hand, to mistrust any claim that can't be measured. She respects the evidence. And I look at [Groom's Name], and I see the anchor. He is a man of deep faith, for whom the unseen is just as real as the ground beneath his feet.

  As a father, I'll admit, I worried about that gap. Can a life be built on two different foundations?

  Late last year, I found myself reading about an old argument between two thinkers, William James and W.K. Clifford. Clifford argued that it is wrong, always, to believe anything without sufficient evidence. James argued that there are moments—especially in love—where you must believe *in order to find* the evidence.

  I don't have a degree in philosophy. I sell hammers. But standing here, watching them together, I realized they've already solved the problem.

  Because marriage is the one place where Clifford and James have to shake hands.

  You cannot marry without evidence. You need to know who you are partnering with. You need to know their character, their kindness, their strength. [Daughter's Name] has tested this. She has measured the load.

  But you also cannot marry without a leap. There is no data set for the next fifty years. There is no assay that can tell you how you will change, or what hardships will come. To stand at this altar and say "I will," is to admit that you do not know the future, but you are willing to build it anyway.

  [D Daughter's Name], you have found a man whose faith is strong enough to hold you when the ground shifts. [Groom's Name], you have found a woman whose rigor will keep your feet on the earth when you need to be reminded.

  Do not pretend your differences aren't real. Let them be the tension that holds the bridge up. Let one of you be the evidence, and the other be the hope.

  So, if everyone could please raise a glass.

  To the evidence you have found in each other, and to the faith you are about to show. To [Daughter's Name] and [Groom's Name].
