      *   *Nuance:* The colleague said "essentially resolved." I need to emphasize that in philosophy, "essentially resolved" usually means "we have a working vocabulary, but fierce debate continues on the implications."
      *   *Psychology Angle:* Highlight that for a psychologist, the *existence* of the distinction matters less than the *effect* of incentives. But if the dissertation makes normative claims, the philosophy matters.
