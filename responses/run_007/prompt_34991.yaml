          3.  Breakdown of Problematic Parts (The "resolution" claim, the belief specificities).
          4.  Key Objections/Complications (The "New WKR," Fittingness vs. Rationality, Pragmatic Encroachment).
          5.  Advice for the Dissertation (How to use this without getting bogged down).

  6.  **Refining the Content (Self-Correction during drafting):**
