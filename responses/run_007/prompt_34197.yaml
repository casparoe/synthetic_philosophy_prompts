      *   *Adjacent Fields:* Reference Class Problem (Hajek), Goodhart (metrics gaming), Conjunction Fallacy (Linda), No Free Lunch (context dependence).
      *   *Conflict:* Action-guidance (specific weights) vs. Neutrality (avoiding bias in selection).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Integration Mechanism.* It can't just say "do both." It needs to say *how*. Bayesian updating is the natural candidate (Outside = Prior, Inside = Likelihood), but is it enough?
      *   *Desideratum 2: Reference Class Selection.* This is the big one. The theory must explain how to choose a class without begging the question. It needs to address the "Reference Class Problem."
      *   *Desideratum 3: Uniqueness.* How to handle one-offs? If the theory fails here, it's useless for strategy/innovation.
      *   *Desideratum 4: Epistemic Status.* Is it a heuristic or a norm? It needs to distinguish between "be humble" and "be wrong on purpose."
