answer: |-
  Here are the desiderata for an adequate theory of the inside/outside view distinction. These are structured by function, case coverage, conceptual boundaries, external consistency, and internal tension.

  ### I. Functional Desiderata: What the Theory Must Do

  **1. The Integration Mechanism**
  The theory must specify a non-arbitrary method for combining inside and outside information. It cannot simply advise "consider both." It must articulate the *structural relationship* between the two.
  *   **Requirement:** It must explain whether the outside view functions as a Bayesian prior (to be updated by inside evidence), a constraint (a boundary condition the inside view cannot violate), or a competing model (to be weighted via model averaging).
  *   **Why:** Without this, the advice is vacuous. If a planner treats the base rate as a prior and the inside details as strong likelihoods, they may end up exactly where they started (overconfident). If they treat the base rate as a hard constraint, they ignore genuine innovation.

  **2. The Reference Class Selection Criterion**
  The theory must provide a principled method for selecting a reference class that is not itself vulnerable to motivated reasoning.
  *   **Requirement:** It must offer criteria for similarity and relevance that limit the infinite possible reference classes (the Reference Class Problem) without relying on the very intuitions the outside view is meant to correct.
  *   **Why:** As you noted, selecting a reference class is an inside-view judgment. If I am building a bridge and want to be optimistic, I choose the reference class of "bridges built by our elite team." If I want to be pessimistic, I choose "bridges built in this geological zone." A theory that says "pick the right class" without defining "right" is self-defeating.

  **3. The Recursion Stopper**
  The theory must address the infinite regress of applying the outside view to the outside view.
  *   **Requirement:** It must determine when the epistemic agent should stop zooming out. (e.g., "I am an expert, but experts are overconfident. So I discount my estimate. But people who discount their estimates are often underconfident...")
  *   **Why:** Without a stopping rule, epistemic modesty becomes paralysis or a oscillating loop of confidence adjustments.

  ### II. Critical Test Cases: Where the Theory Must Hold

  **4. The Planning Fallacy (Standard Case)**
  *   **The Case:** Routine projects with historical data (construction, software dev) where agents consistently underestimate costs/time.
  *   **The Requirement:** The theory must explain why the inside view *systematically* fails here (e.g., narrative fallacy, omission of unknown unknowns) and why the outside view corrects it.
  *   **Why it's a requirement:** This is the phenomenon that birthed the distinction. If the theory cannot explain the canonical failure mode, it lacks diagnostic power.

  **5. The Unique Event (The "First of a Kind" Problem)**
  *   **The Case:** Projects with no direct precedents (e.g., the first manned Mars mission, a novel geopolitical intervention).
  *   **The Requirement:** The theory must provide guidance when base rates are unavailable, sparse, or arguably irrelevant. It cannot simply say "outside view impossible."
  *   **Why it's a requirement:** If the theory only works for routine tasks, it is a tool for administration, not strategy. High-stakes epistemology is most needed where data is scarce.

  **6. The Contested Domain (Politicized Base Rates)**
  *   **The Case:** Domains where the "outside data" is itself disputed (e.g., climate economics, pandemic mortality, recidivism rates).
  *   **The Requirement:** The theory must handle situations where the "outside view" is not a neutral fact but a competing narrative.
  *   **Why it's a requirement:** In these domains, appealing to base rates is often a rhetorical move to shut down inside-view nuance. The theory must distinguish between *objective base rates* and *contested statistics*.

  **7. The Overconfident Expert (The Meta-Case)**
  *   **The Case:** An expert who knows the literature on overconfidence and knows she belongs to the reference class of "experts."
  *   **The Requirement:** The theory must explain how she uses this knowledge. Does she automatically discount? Does she look for inside-view evidence that she is an *exception* to the class?
  *   **Why it's a requirement:** This tests the theory's handling of self-reference. If the theory demands she ignore her inside-view knowledge of her own skill, it demands irrationality. If it lets her exempt herself too easily, it fails to correct bias.

  ### III. Conceptual Distinctions: What Must Not Be Collapsed

  **8. Prior vs. Likelihood**
  *   **The Distinction:** The outside view as a *starting probability* vs. the inside view as *evidence updating that probability*.
  *   **Requirement:** The theory must not treat the outside view as the *final verdict*.
  *   **Why:** Collapsing this leads to "base rate fallacy" in reverse (ignoring specific evidence). Tetlock's superforecasters win because they update, not because they just recite base rates.

  **9. Modesty vs. Deference**
  *   **The Distinction:** Acknowledging the limits of one's knowledge (modesty) vs. surrendering judgment to an aggregate or algorithm (deference).
  *   **Requirement:** The theory must preserve epistemic agency.
  *   **Why:** Blind deference to base rates is not epistemically virtuous if the agent possesses relevant inside information that the base rate averages out. Modesty requires weighing one's limits, not abandoning one's mind.

  **10. Debiasing Tool vs. Epistemic Stance**
  *   **The Distinction:** A specific technique for a specific calculation vs. a general orientation toward knowledge.
  *   **Requirement:** The theory must clarify scope. Is this for cost estimation only, or for belief formation generally?
  *   **Why:** Kahneman treats it largely as a planning corrective. Tetlock treats it as a cognitive style. Confusing the two leads to misapplication (e.g., applying rigid base rates to moral judgments).

  ### IV. External Consistency: Adjacent Constraints

  **11. The Reference Class Problem (Hájek)**
  *   **Constraint:** Any event belongs to an infinite number of reference classes with different frequencies.
  *   **Requirement:** The theory must be consistent with the logical impossibility of a "single true reference class." It must offer a heuristic for *relevant* similarity.
  *   **Why:** Ignoring this makes the theory logically incoherent. It pretends a solution exists where formal probability theory says there is ambiguity.

  **12. Goodhart's Law**
  *   **Constraint:** When a measure becomes a target, it ceases to be a good measure.
  *   **Requirement:** The theory must account for the risk that "using the outside view" becomes a performative box-checking exercise.
  *   **Why:** If organizations mandate "reference class forecasting," agents will game the reference class selection to meet the mandate, reintroducing the bias the tool was meant to fix.

  **13. No Free Lunch Theorems (Machine Learning)**
  *   **Constraint:** No single algorithm performs best across all possible problems.
  *   **Requirement:** The theory must admit domain dependence. There cannot be a universal weighting rule (e.g., "always weight outside view 70%").
  *   **Why:** In stable environments (casino odds), outside view dominates. In chaotic environments (revolutionary tech), inside view (theory/mechanism) may be the only signal. A universal theory is empirically false.

  **14. The Conjunction Fallacy**
  *   **Constraint:** Detailed stories are less probable than abstract ones, yet feel more true.
  *   **Requirement:** The theory must explain why the inside view is seductive (narrative coherence) and how the outside view disrupts this (statistical extension).
  *   **Why:** This explains the *psychological mechanism* of the error. A theory that doesn't explain *why* we prefer the inside view cannot effectively correct it.

  ### V. Conflicting Desiderata (The Trade-Offs)

  Here lie the genuine tensions where satisfying one desideratum may violate another.

  **Conflict A: Action-Guidance vs. Bias-Immunity**
  *   **Tension:** To be action-guiding (Desideratum 1), the theory must give specific rules (e.g., "Select the narrowest valid class," "Weight outside view 60%"). To be bias-immune (Desideratum 2), it must avoid rules that can be gamed or motivatedly selected.
  *   **The Problem:** Any specific rule for selecting a reference class is itself a judgment call subject to the inside-view bias. If you say "pick the most similar class," the user defines "similar." If you say "pick the broadest class," the user argues for exceptions.
  *   **Verdict:** You likely cannot have a theory that is both **procedurally specific** and **psychologically robust**. The more concrete the advice, the more it relies on the user's integrity to apply it correctly—which is the very variable the theory is supposed to correct.

  **Conflict B: Universality vs. Domain Sensitivity**
  *   **Tension:** To be a general theory of epistemic modesty (Desideratum 10), it should apply broadly. To be consistent with No Free Lunch (Desideratum 13), it must admit that the optimal balance depends on the environment.
  *   **The Problem:** If the theory says "it depends on the domain," it pushes the burden back onto the user to diagnose the domain. But domain diagnosis is an inside-view judgment prone to overconfidence ("This domain is special!").
  *   **Verdict:** A universal theory risks being wrong in specific cases; a domain-sensitive theory risks being useless because it requires the expertise it seeks to regulate.

  **Conflict C: Correction vs. Integration**
  *   **Tension:** Kahneman's framing is often *corrective* (Outside view overrides Inside view). Tetlock's framing is *integrative* (Outside view anchors, Inside view updates).
  *   **The Problem:** If the theory emphasizes correction, it risks discarding valid signal (false negatives). If it emphasizes integration, it risks allowing the bias back in through the "updating" phase (false positives).
  *   **Verdict:** The theory must decide if the Inside View is *evidence* or *noise*. Existing literature waffles here.

  ### VI. The Knockout Desideratum

  **The Non-Circular Reference Class Selection Criterion (Desideratum 2)**

  This is the desideratum that knocks out most existing approaches, including Kahneman's original formulation.

  *   **Why:** Almost all literature prescribes the *use* of the outside view but treats the *selection of the reference class* as a transparent, unproblematic step. Kahneman and Lovallo write: "An important key to using the outside view is to find an appropriate reference class." They do not provide an algorithm for finding it that is immune to the planning fallacy.
  *   **The Failure:** Because selecting the class is a cognitive task performed by the same brain that is generating the optimistic inside view, the bias simply migrates from the *estimate* to the *class selection*. (e.g., "The base rate for *software projects* is bad, but the base rate for *AI projects led by ex-Googlers* is good.")
  *   **The Consequence:** Any theory that does not solve the **meta-reference class problem** (how to choose the class without using the biased intuition) is not a solution to overconfidence; it is merely a displacement of it. It demands a second-order outside view (an outside view on how we pick reference classes), which leads directly to the Regress Problem (Desideratum 3).

  **Summary Judgment:**
  An adequate theory must be **Bayesian in structure** (to handle integration), **pluralistic in class selection** (to handle the Reference Class Problem), and **reflexive** (to handle the expert case). However, it faces a near-fatal tension: **To be useful, it must be specific; to be honest, it must admit that specificity is vulnerable to the very biases it seeks to cure.** The most promising path forward is likely not a procedural algorithm, but a **social epistemology**: the reference class cannot be selected by the individual planner, but must be audited or selected by a separate party who does not share the planner's incentives. This moves the solution from individual cognition to institutional design.
