  11. **Final Polish:** Ensure clear headings and strong topic sentences. (Proceed to generate output).

  *(Self-Correction Note during final polish)*: I need to make sure I explicitly address the "epistemic modesty" aspect. It's not just about accuracy; it's about the *stance* of the knower. I will add a specific desideratum on the *normative status* of modesty.

  *(Refining the "Knockout")*: The prompt asks if one desideratum knocks out most existing approaches. The "Non-Circular Reference Class Selection" is the strongest candidate. Kahneman says "pick the right class" but doesn't give an algorithm for it that isn't subject to the same biases. Tetlock implies "aggregate many" but that's not always possible. I will highlight this.

