answer: |-
  Based on your verdicts, your intuitions align most closely with a **Principle of Normatively-Weighted Acceptance**. This principle synthesizes the "Knobe Effect" (moral valence matters) with traditional conditions for intentionality (knowledge and control), while adding a crucial layer regarding the *attitude* of the agent toward the outcome.

  ### The Principle: Normatively-Weighted Acceptance

  **Statement:** An agent intentionally brings about a side effect if and only if:
  1.  **Foresight:** They foresee the outcome as a certain or near-certain consequence of their action (ruling out mere risk or negligence).
  2.  **Acceptance:** They proceed with the action *accepting* the outcome as a permissible cost or matter of indifference (ruling out cases where they actively try to prevent it).
  3.  **Normative Weight:** The outcome carries sufficient negative moral weight to warrant blame (ruling out neutral or positive side effects, and distinguishing severe harm from minor aesthetic loss).

  ### Analysis of Your Cases

  This principle captures your asymmetry between **Case A** (Harm) and **Case B** (Help) via condition (3): we attribute intentionality more readily when we want to blame the agent for a bad outcome they accepted.

  It explains **Case C** (Means) as a stronger version of A: when the harm is the *means* rather than the *side effect*, the "Acceptance" condition is maximized because the harm is instrumental to the goal.

  It explains **Case D** (Regret): The CEO still *accepts* the cost (condition 2 is met), but the regret signals a conflict, weakening the attribution without negating it.

  It explains **Case E** (Skill) and **Case F** (Risk): In E, the harm is contingent on successful performance and carries low normative weight in the context of competition. In F, the outcome is probabilistic (failing condition 1) and the surgeon takes precautions (failing condition 2, as they are actively trying to *avoid* the cost).

  It explains **Case G** (Aesthetic): The harm is foreseen and accepted, but the normative weight is lower than ecological damage, explaining your reduced confidence.

  It resolves **Case I** (Negligence): The employee lacks **Foresight** (condition 1). Even if she *should* have known, actual intentionality requires actual knowledge of the consequence. She is negligent, not intentional.

  ### Overturned Verdicts and Case H

  The principle forces a resolution on **Case H (Omission)**. Your intuition is torn between "intentionally allowed" and "reckless." Strictly speaking, the principle defines intentional *action*. While the agent *accepted* the outcome (condition 2) and it was *foreseen* (condition 1), omissions lack the active causal intervention usually required for "intentionally bringing about." The principle sides with the "reckless" horn of your dilemma: she intentionally *allowed* it, but did not intentionally *cause* it. If you maintain that "intentionally allowed" counts as "intentional" for your purposes, the principle fits; if you require active commission, this verdict is overturned.

  ### Confidence and Uncertainty

  I am **85% confident** in this principle as a description of your specific set of intuitions. It cleanly unifies the Knobe effect with the distinctions you draw between risk, means, and negligence.

  The point I am **least confident about** is the classification of omissions (Case H). Philosophical and linguistic usage varies wildly on whether "intentionally allowing" is a subset of "intentional action" or a distinct category. Your own hesitation suggests this is the fault line in your conceptual framework, and no principle can fully resolve that tension without stipulating a definition of "action."

