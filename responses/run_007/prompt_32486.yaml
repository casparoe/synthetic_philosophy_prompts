prompt: |-
  I've been reading Hofstadter and I've come around to something like his view that the self isn't a thing but a pattern — a strange loop — and that smaller, coarser versions of that pattern exist in other people's brains. So in a real sense, I partially survive in the minds of people who know me well, and they partially survive in mine. I find this weirdly comforting, but I want to know what would count against it. I'm not after the standard objection that it sounds barmy — I want the actual arguments, thought experiments, or implications that should make me reconsider, sorted from fatal to merely awkward. Include things that defenders of the view would themselves concede as counting against it, not just what critics say. And I want to know whether the view has been cushioned in a way that makes it unfalsifiable, and if so, whether that's a problem for a view of this kind.

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question. And write in British English please.
