      *   *The Dennettian Defense:* Stevens didn't fail to find a self; he failed to *update* his narrative in light of new data (Darlington's Nazism, Kenton's love). He treated the narrative as a *script* rather than a *theory*.
      *   *Key Distinction:* **Authorship vs. Recitation.** Dennett's self is something you *spin*. Stevens treated his self as something *given* to him by the profession/class system. He abdicated the role of narrator.
