      *   **Stevens as a "Bad" Dennettian:** Stevens isn't a counter-example; he's a cautionary tale about *rigidity*. He treated the narrative as a *thing* (reifying the abstraction), which is exactly what Dennett warns against. He outsourced the authorship.
      *   **What Did He Miss? (The Normative Question):** He didn't miss a "real self." He missed *narrative integration*. He compartmentalized (Darlington vs. Father, Kenton vs. Duty). A robust self (in Dennett's sense) integrates conflicting data. Stevens suppressed data. This makes the narrative brittle.
