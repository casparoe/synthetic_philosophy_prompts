      *   *No Homunculus:* There is no "little man" inside pulling the strings.
      *   *Multiplicity:* There isn't necessarily *one* true narrative. We spin multiple yarns. Coherence is a goal, not a precondition.
      *   *Normativity:* Narratives can be *better* or *worse*, not *true* or *false* in a correspondence sense. A "good" narrative is one that allows for better prediction, social coordination, and perhaps flourishing (though Dennett is careful about "flourishing" as a metaphysical claim).
      *   *The "Real Self" Trap:* Dennett would reject the idea that Stevens betrayed a "real self." He would say Stevens committed to a *rigid* narrative that became maladaptive.

  3.  **Deconstruct Ishiguro's *The Remains of the Day*:**
