  8.  **Final Polish:** Ensure tone is appropriate for a PhD peer (collegial, rigorous, nuanced). Avoid definitive answers where ambiguity is philosophically productive. (Self-Correction: Make sure I don't just say "Dennett is right." I need to show where the novel pushes back.)

      *(Self-Correction during drafting)*: I need to be careful not to conflate Dennett's "narrative" with literary narrative. Dennett means the web of intentional attributions. Stevens's "narrative" is literally a story he tells. I need to bridge that gap. Stevens's *life* is the text, his *telling* is the attempt to fix the center of gravity. The gap between the life and the telling is where the tragedy lies.

