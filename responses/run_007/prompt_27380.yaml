      *   *Dignity vs. Humanity:* Stevens equates "dignity" with suppression of affect.
      *   *The Tragedy:* The tragedy isn't just that he served a Nazi; it's that he outsourced his moral agency to Darlington. He didn't *own* the narrative; he *recited* it.
