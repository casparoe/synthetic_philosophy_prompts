      *   **Context:** A party conversation between Miriam (behavioral ecologist) and Leo (philosopher of science) about the Handicap Principle.
      *   **User:** A novelist, not a biologist, looking for clarity on the argument to inform their writing/understanding.
      *   **Task:** Go through the 7 moves of the argument, adjudicate who is right/wrong/missing something, and evaluate the core philosophical/biological tensions (falsifiability, index vs. handicap, definition of cost).
      *   **Goal:** Provide a clear, nuanced breakdown that respects both the biological science and the philosophical critique.

  2.  **Deconstruct the Argument (Move by Move):**

