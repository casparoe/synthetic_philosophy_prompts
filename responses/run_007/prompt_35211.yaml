prompt: |-
  I recently joined an AI lab after years in philosophy of cognitive science, and I've found myself in the middle of a running argument about the frame problem that has become surprisingly personal — it's affecting how we allocate engineering time, and I have to take a position soon. One camp (mostly the engineers) holds that the frame problem is philosophically interesting but practically moot: modern systems with probabilistic reasoning, attention mechanisms, and learned relevance functions handle the challenge well enough, and the remaining difficulties are ordinary engineering. The other camp (mostly the philosophers and a few old-school symbolic AI people) holds that the frame problem was never really about engineering — it was about whether relevance can be captured in a formal system at all, and the fact that we now use systems whose relevance judgments are opaque and unprincipled doesn't constitute a solution.

  We've decided to try an adversarial collaboration to see what we can actually agree on and where our real disagreements lie. I'd like you to draft the document we should produce.

  Specifically, write the joint statement of an adversarial collaboration between these two camps on the frame problem. The document should include:

  1. A numbered list of claims both sides can sign — about the original formulation of the frame problem, about what any adequate solution must accomplish, and about what the formal results (computational intractability, the Yale shooting problem, and the like) do and don't establish.

  2. A disagreements table. For each row, give: the precise statement of the disagreement in neutral terms; the formulation each side would accept for its own position; and an indication of whether the disagreement is substantive or potentially terminological.

  3. A list of cruxes — sub-questions such that settling them would move at least one side. For each crux, describe a concrete case or piece of evidence both sides would agree bears on it, and state what each side would predict about that case.

  Please avoid summarizing the general literature; this should be the kind of document that comes from people who have already been arguing for a while and know the terrain. Go into the weeds — for instance, you might engage with specific proposals like the situation calculus, the distinction between the frame problem and the qualification problem, or the question of whether the problem is epistemic or metaphysical.

  End your response with a one-sentence summary of the residual disagreement, as the last line.
