answer: |-
  # Joint Statement of Adversarial Collaboration: The Status of the Frame Problem in Modern AI

  **Parties:** The Foundational Camp (Philosophy of Cognitive Science, Symbolic AI) and The Engineering Camp (Machine Learning, Probabilistic Systems)
  **Date:** October 26, 2023
  **Subject:** Delimitation of Agreement and Disagreement Regarding the Frame Problem

  ## 1. Points of Consensus

  Both camps affirm the following claims as a baseline for further inquiry. Signing this section indicates agreement that these propositions accurately describe the history, formal constraints, and current state of the field.

  1.  **Original Formulation:** The frame problem, as originally defined by McCarthy and Hayes (1969), is the difficulty of representing a dynamic domain in the situation calculus without requiring an explicit "frame axiom" for every fluent that remains unchanged by an action.
  2.  **Distinction of Problems:** We agree that the frame problem is distinct from, though related to, the *qualification problem* (specifying all preconditions for an action) and the *ramification problem* (specifying all indirect consequences of an action). Conflating these distinct issues impedes progress.
  3.  **The Yale Shooting Problem:** We agree that the Yale Shooting Problem (Hanks & McDermott, 1987) demonstrated that early non-monotonic solutions (e.g., simple minimization of abnormalities) were insufficient to guarantee correct temporal projection without additional causal constraints.
  4.  **Computational Intractability:** We agree that a brute-force solution to the frame problem (checking every fluent against every action) is computationally intractable in domains with high-dimensional state spaces.
  5.  **Modern Architectures:** We agree that contemporary state-of-the-art systems (e.g., Transformers, Diffusion Models) do not implement explicit frame axioms, situation calculus, or circumscription. Their handling of temporal inertia is implicit within learned weights and attention mechanisms.
  6.  **Adequacy Condition (Minimal):** We agree that any adequate solution to the frame problem must enable an agent to efficiently infer what *does not* change in a dynamic environment without exhaustive state verification.
  7.  **Opacity:** We agree that the relevance mechanisms in modern probabilistic systems are opaque; there is no currently available mapping from specific attention heads or latent dimensions to specific logical fluents or frame axioms.

  ## 2. Table of Disagreements

  The following table isolates the specific points of contention. "Neutral Statement" describes the conflict without bias. "Foundational Formulation" and "Engineering Formulation" describe how each camp characterizes its own stance.

  | # | Neutral Statement of Disagreement | Foundational Camp Formulation | Engineering Camp Formulation | Substantive or Terminological? |
  | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **The Ontological Status of Relevance** | Relevance is a logical relation that requires explicit justification; without a formal derivation of why a fluent is irrelevant, the system does not "solve" the problem, it merely guesses. | Relevance is a statistical dependency; if the system correctly predicts state persistence with high probability, the mechanism of selection is an implementation detail, not a philosophical deficit. | **Substantive** |
  | **2.2** | **Criterion of Solution** | A solution requires a guarantee of correctness (or bounded error) across novel domains based on principled representation. | A solution is defined by performance on benchmark tasks; if the system scales and generalizes without explicit frame axioms, the problem is dissolved by empirical success. | **Substantive** |
  | **2.3** | **The Nature of "Change"** | Change is a metaphysical or logical transition between world states that must be modeled to be understood. | Change is a difference in token distributions over time; modeling the distribution is sufficient for agency. | **Substantive** |
  | **2.4** | **Terminology of "Solving"** | Using the term "solution" for statistical approximation conflates the *prediction* task with the *representation* task. | Insisting on logical representation for a problem that biological brains likely solve via approximation is category error; "solution" means "functional competence." | **Terminological** (with substantive implications) |
  | **2.5** | **Role of Explicit Representation** | Explicit representation of invariants is necessary for systematic generalization and counterfactual reasoning. | Explicit representation is a bottleneck; latent representations capture invariants more flexibly than hardcoded logic. | **Substantive** |

  ## 3. Cruxes: Empirical and Theoretical Tests

  The following are specific sub-questions where resolution would significantly shift the position of at least one camp. For each crux, we identify a concrete case or evidence type and the divergent predictions.

  ### Crux 3.1: Systematic Generalization in Novel Dynamics
  *   **Question:** Can a system trained on a set of dynamic rules correctly infer inertia in a novel environment with different physical laws without retraining?
  *   **Concrete Case:** A neural physics engine is trained on objects where friction applies. It is then tested zero-shot on an environment where friction is absent but gravity is doubled. The task is to predict the state of an object after a "null action" (waiting).
  *   **Foundational Prediction:** The system will fail or exhibit high variance. Without an explicit representation of inertia as a default assumption independent of specific training distributions, it cannot distinguish between "object stays still because of inertia" and "object stays still because of unseen friction."
  *   **Engineering Prediction:** The system will succeed provided the latent space captures the underlying manifold of "object persistence." Attention mechanisms will attend to the object's identity rather than environmental parameters, effectively learning a prior over inertia.
  *   **Resolution Condition:** If the system fails consistently on zero-shot inertia tasks where logical priors succeed, the Foundational Camp is vindicated. If it succeeds, the Engineering Camp claims the frame problem is learnable.

  ### Crux 3.2: The "Sleeping Dog" Ablation Study
  *   **Question:** Does the computational cost of inference scale with the number of irrelevant fluents in the system's representation?
  *   **Concrete Case:** Measure inference time and energy consumption of a large world-model as the dimensionality of the state vector (number of tracked fluents) increases by orders of magnitude, while the number of *changing* fluents remains constant (e.g., 1).
  *   **Foundational Prediction:** Without a mechanism equivalent to frame axioms to prune the search space, computational cost must scale linearly or worse with the number of fluents, as the system must implicitly "check" them to ignore them.
  *   **Engineering Prediction:** Due to sparse attention and locality biases in modern architectures, inference cost will remain sub-linear or constant relative to the total state space, demonstrating an emergent solution to the computational aspect of the frame problem.
  *   **Resolution Condition:** If scaling laws show linear dependence on total state dimension for static elements, the Engineering Camp admits a computational frame problem remains. If scaling is constant, the Foundational Camp admits the computational burden is mitigated architecturally.

  ### Crux 3.3: Counterfactual Justification
  *   **Question:** Can the system provide a tractable explanation for why a specific fluent was assumed unchanged in a counterfactual scenario?
  *   **Concrete Case:** Prompt a multimodal world-model: "If I had not dropped the cup, would the floor be wet?" Require the system to highlight the specific parameters or weights that enforced the "floor dry" assumption in the counterfactual branch.
  *   **Foundational Prediction:** The system will produce post-hoc rationalizations (saliency maps) that do not map causally to the decision process. It cannot distinguish between "floor is dry because cups don't leak air" and "floor is dry because I didn't see water."
  *   **Engineering Prediction:** Causal mediation analysis and intervention on attention heads will isolate specific circuits responsible for maintaining state persistence, providing a functional equivalent to a frame axiom.
  *   **Resolution Condition:** If causal interventions on specific heads reliably toggle frame-like behavior (e.g., forcing change where there should be stasis), the Engineering Camp argues this constitutes a mechanistic solution. If interventions yield chaotic results, the Foundational Camp argues the system lacks structured knowledge of invariance.

  The residual disagreement is whether the frame problem is a bug in our representation of knowledge that requires logical repair, or a feature of learning systems that dissolves under sufficient scale and data.
