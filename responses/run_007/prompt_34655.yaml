      *(Refining the Senior Faculty objection)*: This person knows Staw. They will cite the 1981 paper. I need to make sure the reply honors Staw while pivoting to mechanism.

      *(Refining the Strategy objection)*: They want tools. The Dollar Auction is a warning, not a tool. I need to sell it as a diagnostic lens.

  10. **Final Review against constraints:**
      *   Order by likelihood/damage? Yes.
      *   Authentic voices? Yes.
      *   2-minute replies? (Will keep word count tight).
      *   Candid weakness notes? Yes.
      *   "Hope nobody asks"? Yes.
      *   Opening concessions? Yes.

      *Let's assemble.*
answer: |-
  # Q&A Prep Sheet: The Dollar Auction as a Model for Escalation

  **Context:** Faculty Seminar, Business School.
  **Goal:** Defend Dollar Auction as the *superior structural model* for escalation of commitment over psychological explanations.
  **Audience:** 25 Faculty (Behavioral, Org Psych, Strategy, +1 Senior Staw Colleague).

  ---

  ### 1. The Strategy Scholar (Actionability Threat)
  **Likelihood:** High | **Damage Potential:** High
  **Voice:** Pragmatic, focused on MBA pedagogy and decision tools.

  **Objection:**
  "Let's say I buy your argument. You've convinced me that a rational agent *could* get trapped in this game. But on Monday, I'm teaching a room full of VPs. If I tell them 'escalation can be rational,' aren't I giving them a license to keep burning cash? Your model explains why they *do* it, but does it give me any advice on how to *stop* it? If the answer is 'don't play,' that's not helpful for managers already in the game."

  **Reply (2 mins):**
  "That is the critical distinction: this model is a diagnostic tool, not a prescriptive rule for mid-game play. You're right to worry about giving managers permission to escalate. But the value of the Dollar Auction isn't in telling you how to bid once you're at 90 cents; it's in helping you recognize the *structure* before you bid at all.

  Most management training treats escalation as a mistake in calculation or a lapse in willpower. My argument is that it's a trap built into the incentive structure of competitive projects. When you teach the Dollar Auction, you aren't teaching them to bid higher; you're teaching them to identify 'Dollar Auction structures' in their portfolio—projects where the cost of quitting is immediate and visible, but the cost of continuing is deferred and probabilistic.

  The actionable advice is ex-ante, not ex-post. It's about designing governance that prevents entry into these games. For example, if a project requires continuous funding to avoid total write-down, that's a Dollar Auction structure. The advice to your MBAs is: do not authorize projects where the exit penalty creates a rational incentive to continue a losing course. If you are already in the game, the model tells you that 'willpower' won't save you; only a structural change—like a third-party auditor with the power to kill the project regardless of sunk cost—will break the equilibrium."

  **Candid Weakness:**
  The "ex-ante only" defense is shaky. Managers *are* already in the game. Telling them "you should have designed better governance six months ago" feels like a failure of the model to help in the crisis moment where it's needed most.

  ---

  ### 2. The Senior Faculty (Legitimacy Threat)
  **Likelihood:** Medium | **Damage Potential:** Critical
  **Voice:** Weary, protective of the field's history, knows Staw personally.

  **Objection:**
  "I've been reading Barry Staw's work since 1976. We spent thirty years building a literature that shows escalation is *not* rational—that it's driven by self-justification, agency problems, and social pressure. You're proposing we throw that out and go back to 1971 rational choice? This feels like rational-choice imperialism. You're stripping away the organizational context—the careers, the politics, the identity—that actually drives the behavior. Why should we regress to a model that assumes away the very phenomenon we study?"

  **Reply (2 mins):**
  "I have immense respect for Barry's work; it defined the field. I am not arguing we throw out the psychological literature. I am arguing that the psychological explanations are built on a foundation they haven't fully examined.

  Here is the regression I am proposing: Before we invoke self-justification or ego, we must establish that the behavior *cannot* be explained by structural incentives alone. The Dollar Auction shows that escalation *can* occur with fully rational, unemotional agents. Why does this matter? Because if escalation is structurally rational, then training managers to 'check their biases' is treating a symptom, not the disease.

  I am not assuming away politics; I am suggesting that the Dollar Auction structure *creates* the conditions where politics become lethal. When the structure makes quitting costly, *then* ego defense kicks in to justify the rational choice. My model doesn't replace Staw's; it explains why Staw's findings are so robust. The psychology amplifies the structure, but the structure is the engine. If we ignore the engine, we keep trying to fix the car by talking to the driver."

  **Candid Weakness:**
  Claiming the structure is the "engine" and psychology is just the "amplifier" is a bold causal claim that is hard to prove empirically. A skeptic can easily argue the psychology is the engine and the structure is just the road.

  ---

  ### 3. The Organizational Psychologist (External Validity Threat)
  **Likelihood:** High | **Damage Potential:** Medium
  **Voice:** Empirical, field-focused, skeptical of abstraction.

  **Objection:**
  "I've interviewed managers who escalated commitment on billion-dollar projects. They didn't talk about bid increments or Nash equilibria. They talked about not wanting to fire their team, or fearing the board would see them as incompetent. Your model assumes two anonymous players. In my fieldwork, escalation is deeply social. How does a game with no reputation, no career stakes, and no team dynamics capture the reality of organizational life?"

  **Reply (2 mins):**
  "You're absolutely right that the lab game is sterile. But that sterility is its feature, not its bug. In your fieldwork, you see a confound of variables: career fear, team loyalty, *and* financial incentives. My claim is that the financial/structural incentive is the necessary condition that makes the social factors stick.

  If the project had no sunk costs—if quitting was free—would the manager still worry about firing the team? Perhaps, but the financial pressure to 'turn it around' wouldn't be there. The Dollar Auction isolates the mechanism that makes the social pressure potent. It shows that even without reputation or career stakes, the math compels escalation.

  When you add reputation and career stakes back in, as you see in the field, you aren't changing the mechanism; you're raising the stakes. The 'bid' isn't just dollars; it's political capital. The structure remains: quitting realizes the loss of political capital; continuing offers a chance to recover it. The model predicts that escalation will be *worse* when careers are on the line, which aligns perfectly with your fieldwork. I'm offering the skeleton; you've provided the flesh."

  **Candid Weakness:**
  The "skeleton/flesh" metaphor is diplomatic but risks conceding that the model is incomplete. If the model needs the Org Psych variables to match reality, is it really the "best" model, or just a component?

  ---

  ### 4. The Behavioral Economist (Predictive Precision Threat)
  **Likelihood:** Medium | **Damage Potential:** Medium
  **Voice:** Technical, focused on data fit and deviations from rationality.

  **Objection:**
  "Fine, rational agents might escalate to a point. But in the Dollar Auction, bids often exceed the value of the dollar significantly. Rational agents stop at $1. Real managers bid $5, $10, $20. Your model predicts *some* escalation, but it doesn't predict the *magnitude* of the failure. Prospect Theory and loss aversion explain the overbidding. Why prefer a model that under-predicts the error?"

  **Reply (2 mins):**
  "Because under-prediction is better than misdiagnosis. If the model predicts escalation up to $1 and we see $5, we know the structure accounts for 80% of the behavior, and bias accounts for the remaining 20%. If we start with Prospect Theory, we attribute 100% of the behavior to bias, even the part that was rational.

  This matters for intervention. If you think the escalation is purely loss aversion, you try to reframe the losses. But if the escalation is structurally rational up to the $1 mark, reframing won't stop the first dollar of escalation. You need to change the payoff structure.

  Furthermore, the 'overbidding' you see often isn't just bias; it's uncertainty about the other player's rationality. In organizations, managers escalate because they believe *their rival* (or the market) will blink first. That's not necessarily a cognitive bias; that's a belief about the opponent. My model accommodates that through incomplete information. I'd rather have a model that gets the direction right via mechanism than one that fits the curve via parameters we can't observe."

  **Candid Weakness:**
  The claim that overbidding is "uncertainty about the opponent" is a convenient way to absorb irrationality into the rational model without testing it. A sharp behavioralist will spot this as a "save" rather than an explanation.

  ---

  ### 5. The Question I'm Hoping Nobody Asks (The Normative Trap)
  **Likelihood:** Low | **Damage Potential:** Critical
  **Voice:** Any sharp skeptic.

  **Objection:**
  "If escalation is rational in your model, are you arguing we *shouldn't* try to stop it? If a manager is acting rationally given the constraints, isn't intervening to stop them actually reducing their expected utility?"

  **Reply (2 mins):**
  "No. The behavior is rational *given the trap*, but entering the trap is a failure of design. We don't say landmines are 'good' because stepping on one makes running away rational. We say we shouldn't plant landmines.

  My argument is that organizations inadvertently design Dollar Auction incentives into their project governance. Once that structure exists, stopping the manager is hard because you are fighting their rational incentives. The normative implication is not 'let them escalate,' it is 'change the rules so escalation is no longer the rational choice.' For example, introduce a 'kill fee' or a pre-committed exit criteria that removes the penalty for quitting. We stop the behavior by removing the rationality of continuing, not by questioning the manager's competence."

  **Candid Weakness:**
  This relies on the organization having the power to change the rules mid-game. Often, the "landmine" is the market or a competitor, not internal policy. If the structure is external, the manager is truly stuck, and the advice becomes "accept the loss," which is hard to sell.

  ---

  ### Opening Remarks: Preemptive Concessions
  *To be delivered in the first 3 minutes of the talk to disarm the audience.*

  1.  **Acknowledge Staw Explicitly:** "We stand on the shoulders of Barry Staw. No one here is arguing that psychology doesn't matter. The psychological evidence is robust."
      *   *Why:* Disarms the Senior Faculty and Org Psychologists immediately. Shows respect for the canon.
  2.  **Admit the Model is Sterile:** "The Dollar Auction is a caricature. It strips away the office politics, the career stakes, and the team dynamics. I am not claiming this is a perfect map of your fieldwork."
      *   *Why:* Disarms the Org Psychologists. Frames the sterility as a methodological choice for isolation, not an ignorance of reality.
  3.  **Clarify "Rational":** "When I say escalation is rational, I do not mean it is *optimal* for the firm. I mean it is utility-maximizing for the manager *within the constraints of the trap*."
      *   *Why:* Disarms the Strategy Scholars. Prevents them from thinking you are advocating for waste.
  4.  **State the Goal:** "My goal is not to replace behavioral explanations, but to establish the structural baseline that makes those behaviors so persistent. If the structure rewards escalation, bias is just the fuel."
      *   *Why:* Sets the "Engine vs. Fuel" frame early, making it harder for them to argue you are ignoring psychology later.
