      *   *Development:* Why the dry spells? Why genres stagnate? (Temporal/Historical dimension).
      *   *Scope:* Child's play vs. Expert mastery (5-year-old vs. Jazz solo).
      *   *Structure:* Variation vs. Transformation (Deepening vs. Permuting).
