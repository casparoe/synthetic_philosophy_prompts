  "Outer alignment is about the reward function: it fails when the reward doesn't capture what we actually want, like giving the robot points for an empty dishwasher rather than for dishes put away properly. Inner alignment is about whether the model's own objective matches the training objective, so it fails when the model optimises something else even though the reward is fine. Goal misgeneralisation is when the model learns a proxy that works on the training distribution but not on new situations — for instance, the robot learns to put away only the dishes it saw in training and breaks unfamiliar ones. Since the robot's behaviour diverges from what we wanted only because the training environment was too narrow, goal misgeneralisation is basically an outer alignment problem: the reward was misspecified relative to the real world, and the fix is to make the reward more robust, for example by penalising breakage. In fact, as long as a model generalises well on capabilities, its goals will generalise too, so the real worry is just distributional shift."

