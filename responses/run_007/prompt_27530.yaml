answer: |-
  # Q&A Prep Sheet: Ulysses & Constitutional Precommitment

  ### 1. The Democratic Legitimacy Objection (The Dead Hand)
  **Likelihood:** Very High | **Damage:** High
  **Who:** Democratic Theorists
  **The Question:** "Thanks for the paper. I'm worried you're smoothing over the normative cost here. Even if we accept the analogy, doesn't this still amount to allowing a past majority to veto a present one? You say amendment procedures are the 'release valve,' but if those procedures are deliberately onerous, aren't you just legitimizing the dead hand's grip on the living under the guise of 'standing plans'?"

  **Your Reply (2 mins):**
  "That's the core worry, and I agree it's the stakes of the argument. But I'm not arguing the past *vetoes* the present; I'm arguing the past sets the *procedure* for the present to speak. Think of it less like a veto and more like a requirement for consensus-building. When we entrench a right, we aren't saying 'you can't touch this.' We're saying 'you can only touch this if you can persuade a supermajority that your current passion isn't a failure of nerve.' The amendment rule isn't a wall; it's a filter. It ensures that when the constitution changes, it reflects a settled judgment of the polity, not a transient spike in preference. So the present majority *can* speak, but it has to speak as a collective agent, not just a momentary coalition. The 'dead hand' is actually the living polity's own prior instruction on how to distinguish between a change of mind and a loss of principle."

  **Weakest Point:**
  This relies on the assumption that supermajority requirements actually filter for "principle" rather than just minority veto power. If the audience believes supermajorities simply entrench minority rule, the "filter" defense collapses.

  ### 2. The Ontological Objection (Changing Membership)
  **Likelihood:** Very High | **Damage:** Medium-High
  **Who:** Constitutional Lawyers / Theorists
  **The Question:** "You lean heavily on the firm or university analogy to defend group agency over time. But a university retains its identity despite turnover because of its institutional mission. What is the analogous 'mission' of the people that persists across generations? Given that the actual members of the demos change completely over a century, isn't attributing a single 'will' to them a fiction that masks coercion?"

  **Your Reply (2 mins):**
  "It is a fiction, but it's a necessary constitutive fiction, not a descriptive one. We don't need a metaphysical soul for the polity; we need a functional identity for the practice of promising to work. When I join a university, I submit to its existing rules not because I wrote them, but because I'm joining an ongoing project. Similarly, citizenship is membership in a temporally extended project of self-government. The 'mission' is the maintenance of the framework itself—the rules of the game. If we reject this continuity, we can't make sense of public debt, treaties, or even laws lasting longer than one election cycle. The Ulysses analogy works because it captures this functional continuity without requiring literal identity of members."

  **Weakest Point:**
  Hard to defend against the claim that "joining" a polity isn't voluntary in the way joining a university is (birthright citizenship vs. employment).

  ### 3. The Depoliticization Trap (The Scope Question)
  **Likelihood:** High | **Damage:** High
  **Who:** The Senior Person
  **The Question:** "I'm interested in where you draw the line. If precommitment is good for protecting rights against factional passion, why isn't it good for monetary policy? Or environmental regulation? Is your view secretly a defense of depoliticizing everything we disagree about by handing it to judges or technocrats? How do you stop this slide into technocracy?"

  **Your Reply (2 mins):**
  "That's a crucial boundary question. My defense is limited to *constitutional essentials*—the rules that make democratic competition possible and fair. Precommitment works for things like free speech or voting rights because those are preconditions for the 'present majority' to exist legitimately. Monetary policy is different; it's about managing outcomes within the rules, not defining the rules themselves. If we precommit on policy outcomes, we aren't binding ourselves against failure of nerve; we're binding ourselves against democratic choice. The Ulysses contract is for the mast, not for the steering. We bind the process to protect the possibility of politics, not to remove politics from the equation."

  **Weakest Point:**
  The line between "rules of the game" and "plays within the game" is notoriously blurry (e.g., is property rights a rule or a policy?). A sharp interrogator can push you into admitting your theory justifies judicial activism on economic issues.

  ### 4. The "No Work" Challenge (Analogy vs. Mechanism)
  **Likelihood:** Medium | **Damage:** High (to contribution)
  **Who:** Public-Choice Flavored Scholars
  **The Question:** "I'm sympathetic to precommitment, but I'm not sure the Ulysses story is doing any heavy lifting. You say it explains 'standing plans' versus 'costs.' But isn't that just a semantic difference? Functionally, an amendment threshold *is* a cost. What explanatory work does the psychological analogy of 'nerve' or 'agency' do that a standard transaction-cost model doesn't already cover?"

  **Your Reply (2 mins):**
  "It changes how we interpret the *failure* to amend. In a cost model, if a rule isn't amended, it's because the benefits didn't outweigh the transaction costs. In the Ulysses model, the failure to amend might be a *success* of the mechanism—it means the polity recognized a transient passion and chose not to act. The analogy explains the *normative force* of the constraint. It tells us why we feel bound by these rules even when the costs of changing them are low. It shifts the focus from 'how expensive is it to change?' to 'what kind of agent are we trying to be?' That distinction matters for how judges and citizens interpret constitutional silence."

  **Weakest Point:**
  Hard to prove empirically. If they insist that "normative force" is just another way of saying "high subjective cost," you risk talking past them.

  ### 5. The "Who Defines Failure?" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Who:** Critical Legal Scholars / Skeptics
  **The Question:** "You talk about binding ourselves against 'failures of nerve' or 'factional passion.' But who gets to define what counts as a failure of nerve? Isn't that just a label for political losses you dislike? One person's 'factional passion' is another person's 'social movement.'"

  **Your Reply (2 mins):**
  "That's why the binding has to be procedural, not substantive. I'm not arguing that we precommit to specific policy outcomes because we know they're right. We precommit to processes that slow down decision-making to ensure that 'passion' has time to cool. The definition of 'failure' isn't in the text; it's in the structure. If a movement can sustain support across multiple elections and clear supermajority hurdles, it wasn't a failure of nerve—it was a change of mind. The theory doesn't decide which movements are good; it just insists that legitimate change requires durable consensus."

  **Weakest Point:**
  Doesn't fully address that some movements are systematically excluded from building that consensus by the very structures you're defending.

  ### 6. The Exclusion Objection (Who Tied the Ropes?)
  **Likelihood:** Medium | **Damage:** Medium
  **Who:** Critical / Historical Scholars
  **The Question:** "Ulysses tied himself. But in most constitutional moments, the people didn't tie themselves; elites tied them. Given the exclusionary history of most constitutional settlements, isn't appealing to 'self-binding' just whitewashing the power dynamics of the founding?"

  **Your Reply (2 mins):**
  "I acknowledge the origin sins. My argument isn't about the historical moment of founding, but about current reflective endorsement. The 'self' in 'self-binding' is the current polity that chooses not to exercise the amendment power to undo those exclusions. If the current demos accepts the framework despite its flaws, it becomes a form of ongoing consent. The Ulysses analogy applies to the maintenance of the contract, not necessarily its initial signing. We are bound because we choose to remain bound, not because the founders were perfect."

  **Weakest Point:**
  Can sound like "too bad you weren't consulted, but you're here now." Risks alienating the critical wing of the room.

  ### 7. The Amendment Regress Objection
  **Likelihood:** Low | **Damage:** Low
  **Who:** Legal Theorists
  **The Question:** "You say amendment procedures are part of the binding. But who binds the amendment rule? If the amendment rule can be amended, isn't the whole structure contingent on whatever the current majority decides anyway?"

  **Your Reply (2 mins):**
  "There is a foundational layer that remains unamendable, or at least practically immutable. Every legal system has a 'rule of recognition' that sits outside the written text. My argument doesn't require the amendment rule to be unchangeable, only that it exists as a stable convention. If the polity changes the amendment rule itself, that's a revolutionary act, not a legal one. My theory operates within the paradigm of constitutional legality, not beyond it."

  **Weakest Point:**
  Admitting that ultimate sovereignty lies outside the constitution undermines the idea of being "bound" by it.

  ### 8. The Revolution/Exit Question [HOPE NOBODY ASKS]
  **Likelihood:** Low | **Damage:** High (if mishandled)
  **Who:** Anyone looking for a trap
  **The Question:** "So, what if the present majority genuinely wants to abolish the constitution entirely? Does your theory forbid revolution? If precommitment is binding, are citizens morally obligated to obey even a tyrannical shift that follows procedural rules?"

  **Your Reply (2 mins):**
  "My theory is about internal legitimacy, not external morality. It explains why the constitution binds us *as law*. It doesn't claim to solve the problem of unjust law. If the polity decides to burn the house down, my theory doesn't stop them; it just says that once they do, they've stepped outside the constitutional order I'm describing. I'm defending the logic of constitutionalism, not claiming it's immune to collapse or morally absolute against justice."

  **Weakest Point:**
  Makes the theory look irrelevant in the exact moments (crisis/tyranny) where precommitment matters most. It admits the theory has no bite against a determined majority.

  \answer{The Democratic Legitimacy Objection}
