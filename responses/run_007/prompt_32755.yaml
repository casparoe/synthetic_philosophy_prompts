answer: |-
  - "The principle"
  A convention is a persistent regularity of behavior within a specific population sustained by interdependent expectations: nearly everyone conforms, expects others to conform, and prefers to conform *conditional on* others conforming, knowing that a viable alternative regularity could have been established instead. Case 1 forces the inclusion of the conditional preference clause to rule out independent regularities; Case 3 forces the stipulation that historical origins (like coercion) are irrelevant to current status; Case 4 forces the definition of "coordination problem" to include avoiding social sanctions; Case 5 forces the requirement that mutual knowledge be bounded within the interacting population; and Case 6 forces the distinction between mere habit and expectation-based stability. This account ensures that conformity is driven by the actions of others rather than external constraints, inertia, or independent preferences.

  - "The cases"
  1. Not a convention because preferences are independent; you would do laundry on Sunday regardless of what others do.
  2. A convention because conformity depends entirely on mutual expectation and there is a viable alternative (driving left).
  3. A convention now because the coercive origin is replaced by current mutual expectations and conditional preferences.
  4. A convention because staying late is an equilibrium sustained by conditional preferences to avoid judgment, even if the outcome is undesirable.
  5. Two distinct conventions because the mutual knowledge and interdependence do not extend across the unconnected groups.
  6. Not a convention but a habit, because there is no interdependence; members would not adjust their behavior based on others' deviations.

  - "The accident case"
  It is only a convention once walkers form the expectation that others will follow the worn path to avoid collision or effort, creating a conditional preference to follow suit. If people merely follow the physical depression in the grass without any expectation of others doing the same, it remains a causal habit rather than a convention. Therefore, it matters crucially whether expectations formed; without them, there is no interdependence.

  - "A further case"
  Consider the practice of replying "You too" when a server says "Enjoy your meal." This is a convention because we do it expecting others to do it, would feel awkward if we didn't (conditional preference), and could have easily adopted a different closing ritual. If everyone stopped saying it, you would stop too, satisfying the interdependence clause.

  - "What has to go"
  The intuition that Case 6 (chairs) is a convention must be rejected; without interdependent expectations, it is merely habit or tradition, not convention. Additionally, one must accept that conventions can sustain suboptimal equilibria (Case 4), meaning a convention need not be beneficial overall, only stable given others' actions.
