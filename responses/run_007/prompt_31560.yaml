          *   7 & 8: Norm erosion vs. Selection effect. Both have valid points. This is the crux of political ethics.
      *   *Conclusion:* Is there a coherent position? Yes. Synthesise Walzer's view. The PM *should* do it, *should* feel guilt, but resignation might be too high a price (addressing Mina's final point).

  6.  **Refining British English:**
