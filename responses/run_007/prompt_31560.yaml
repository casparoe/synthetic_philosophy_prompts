      *   **Requirements:** Identify who is right about what, where each overreaches, and determine if a coherent position remains at the end.
      *   **Language:** British English (e.g., "authorised," "defence," "programme," "whilst," "maths," etc.).
      *   **Tone:** Analytical, balanced, philosophical, academic but accessible.

  2.  **Deconstruct the Scenario:**
      *   **Case:** Trolley Problem variant / Dirty Hands problem.
      *   **Action:** Drone strike.
      *   **Outcome:** Terrorist + 12yo daughter dead; Imminent attack stopped (many lives saved).
      *   **Core Conflict:** Consequentialism (outcome justifies action) vs. Deontology/Virtue Ethics (intrinsic wrongness of killing innocents/children).
      *   **Key Concept:** "Dirty Hands" (Michael Walzer, Machiavelli, etc.).

  3.  **Analyse the Moves (Step-by-Step):**

      *   **Move 1 (Dan):** PM did right thing *but* hands are dirty. Guilt is appropriate. Distrust leader who shrugs it off.
          *   *Strength:* Captures the intuitive moral residue. Acknowledges the tragedy.
          *   *Weakness:* Potentially contradictory (Right action + Guilt?).
      *   **Move 2 (Mina):** Incoherent. If right -> no guilt. If guilt -> wrong -> shouldn't have done it. Binary logic.
          *   *Strength:* Logical consistency (Consequentialist view).
          *   *Weakness:* Ignores moral residue/psychological reality of moral agents. Too rigid.
      *   **Move 3 (Dan):** Morality isn't a balance sheet. Wrongness leaves a "remainder." Requires remorse/honesty/consequence.
          *   *Strength:* Explains *why* guilt exists (moral remainder). Aligns with "Dirty Hands" literature.
          *   *Weakness:* Needs to define "remainder" better to avoid Mina's next point.
      *   **Move 4 (Mina):** Reductio ad absurdum. Every trade-off becomes dirty hands (dieter skipping cake). Needs a line between ordinary and tragic.
          *   *Strength:* Good critique. Demands specificity.
          *   *Weakness:* Equivocation. Skipping cake isn't morally weighty like killing a child. False equivalence.
      *   **Move 5 (Dan):** The line is "normally forbidden" acts that define character (torture, killing children). Crossing changes you.
          *   *Strength:* Distinguishes between *prima facie* duties and absolute prohibitions. Touches on Virtue Ethics.
          *   *Weakness:* "Changes you" is vague. Is it metaphysical or psychological?
      *   **Move 6 (Mina):** "Changes you" is psychology, not ethics. Permitted act = no punishment/resignation. Unjust to punish right action.
          *   *Strength:* Legalistic/Political consistency. Leaders shouldn't be punished for necessary decisions.
          *   *Weakness:* Conflates legal punishment with moral accountability/resignation. Ignores the symbolic weight of leadership.
      *   **Move 7 (Dan):** Not punishment, but marking the cost to prevent norm erosion.
          *   *Strength:* Societal function of guilt/resignation. Preserves moral norms.
          *   *Weakness:* Instrumentalising guilt. Is it honest if it's a ritual?
      *   **Move 8 (Mina):** Selection effect. Guilty leaders resign; ruthless ones stay. Bad systemic outcome.
          *   *Strength:* Practical political consequence. Game theory aspect.
          *   *Weakness:* Cynical. Assumes resignation is the only way to mark the cost.

  4.  **Synthesize and Evaluate (Who is right/overreaches):**

      *   **Dan:** Represents the "Dirty Hands" tradition (Walzer). Right about moral residue and the distinctiveness of certain prohibitions. Overreaches by implying the *action* is simultaneously right and wrong without clarifying the levels of description (all-things-considered vs. pro-tanto).
      *   **Mina:** Represents strict Consequentialism or Legalistic Deontology. Right about logical consistency and the danger of perverse incentives. Overreaches by reducing all moral conflict to a calculation and ignoring the agent's character.
      *   **Coherent Position:** Yes, usually found in a nuanced "Dirty Hands" view. The act is *all-things-considered* justified, but involves a *pro-tanto* wrong that generates moral residue. The "punishment" isn't retributive but expressive/symbolic to maintain norms. Mina's selection objection is a practical political problem, not an ethical refutation.

