      *   **Address the "Burden of Proof" Theory:** The user is right that EA assumes neutrality until proven harmful, while Critics assume harm until proven neutral. But it's deeper: it's about *causal granularity*. EA looks at direct cash flow; Critics look at systemic externalities.
