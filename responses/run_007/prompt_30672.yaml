answer: |-
  This is a sophisticated diagnosis of a stalemate that has indeed calcified over the last decade. You are correct that the surface-level empirical claims (charity cost-effectiveness, salary differentials) are not the battleground. Both sides generally accept the data; they disagree on what the data *means* and what moral weight it carries.

  Your working theory—that this is about the **burden of proof regarding institutional harm**—is accurate, but it is a symptom of a deeper structural collision. This is not merely an empirical or normative disagreement; it is a **meta-ethical and epistemological framework collision.**

  Here is a diagnosis of the impasse, an evaluation of your theory, and an assessment of whether it can be moved.

  ### 1. The Structure of the Impasse
  The debate stalls because the two sides are operating with incompatible models of **agency, causality, and value.**

  #### A. Causal Granularity (Marginal vs. Structural)
  *   **EA Model (Marginal Causality):** EAs analyze impact counterfactually at the margin. *If I take this job, does the harmful activity happen anyway? If I donate this money, does it save lives?* They treat the individual as a discrete unit of utility production. The institution is a black box that outputs money; the moral content of the money is neutral until spent.
  *   **Critic Model (Structural Causality):** Critics analyze impact constitutively. *By taking this job, do I legitimize the institution? Do I become part of the machinery that creates the inequality?* They treat the individual as embedded in a system. Participation is not neutral; it is an endorsement and a reinforcement of the structure.
  *   **The Impasse:** You cannot mathematically reconcile "marginal output" with "constitutive harm." EA asks for a specific number of lives lost due to *my* specific job. Critics argue that harm is distributed and systemic, making it impossible to isolate your specific variable, which EA then dismisses as "unmeasurable" and therefore zero.

  #### B. Epistemology of Value (Quantification vs. Qualification)
  *   **EA Model:** Measurement is discovery. We are finding the pre-existing magnitude of good. If it can't be counted, it can't be compared, and if it can't be compared, it can't be prioritized.
  *   **Critic Model:** Measurement is creation. By choosing to count only certain outcomes (lives saved per dollar), you are *creating* a value system that ignores things like dignity, solidarity, or structural justice. This is Goodhart's Law applied to ethics: when a measure becomes a target, it ceases to be a good measure.
  *   **The Impasse:** When critics say "you are ignoring systemic harm," EAs hear "you are ignoring the evidence." When EAs say "show me the numbers," critics hear "you are refusing to acknowledge values that resist quantification."

  #### C. Moral Architecture (Maximizing vs. Integrity)
  *   **EA Model:** Consequentialist/Utilitarian. The primary obligation is to the *outcome*. Your personal moral purity is secondary to the net lives saved. "Getting your hands dirty" is a virtue if it saves more people.
  *   **Critic Model:** Deontological/Virtue Ethical/Political. The primary obligation is to *integrity* and *justice*. You cannot build a just world using unjust means. There is a "doing/allowing" distinction or a "complicity" constraint that acts as a side-constraint on maximizing.
  *   **The Impasse:** EA views the critic's refusal to "earn to give" in finance as a failure of nerve (letting bias override good). Critics view the EA's willingness to work in finance as a failure of moral imagination (believing you can wash blood off money).

  ### 2. Evaluating Your Theory: The Burden of Proof
  You theorize that the disagreement is about **where the burden of proof sits for institutional harm.**

  *   **EA Default:** Institutions are neutral tools. Burden of proof is on the critic to demonstrate that *this specific job* causes net negative harm that outweighs the donation.
  *   **Critic Default:** Capitalist institutions are inherently extractive/harmful. Burden of proof is on the EA to demonstrate that their participation does not reinforce the harmful structure.

  **Verdict:** You are right, but this is a procedural manifestation of the deeper epistemological clash.
  The reason the burden of proof is contested is that the two sides define "harm" differently.
  *   For the EA, harm is **direct and proximate** (e.g., this bank funded this specific oil project).
  *   For the Critic, harm is **diffuse and systemic** (e.g., this bank exists within a financial system that prioritizes growth over stability, leading to crises that hurt the poor).

  Because systemic harm is difficult to attribute to a single actor (the "problem of many hands"), the EA framework automatically assigns it a probability of zero or near-zero in its calculus. The Critic framework assigns it a high probability by default. This isn't just a disagreement about who has to prove what; it's a disagreement about **what counts as a valid causal link.**

  ### 3. Can the Impasse Be Moved?
  Is this a debate where the two sides can be moved by the same considerations, or are they incommensurable?

  **It is largely incommensurable, but there are narrow bridges.**
  Because the disagreement is meta-ethical (what is the *nature* of doing good?), standard empirical evidence rarely shifts minds. An EA will not stop earning to give because a critic writes a philosophical treatise on complicity. A critic will not start earning to give because an EA shows a spreadsheet of QALYs saved.

  However, the debate *can* move if framed through **Risk Management** and **Strategy**, rather than Morality and Measurement.

  #### What would actually move the EA side?
  1.  **Systemic Risk as a Negative Externality:** If critics can demonstrate that "earning to give" in harmful industries increases the probability of systemic collapse (e.g., financial crisis, authoritarian drift) which would *destroy the capacity for future philanthropy*, EAs might listen. This frames structural harm in consequentialist terms (threat to future utility).
  2.  **Talent Drain:** If it can be shown that high-impact individuals working in extractive industries deplete the talent pool available for building *alternative* institutions (co-ops, public interest tech, policy reform), the "opportunity cost" argument flips.

  #### What would actually move the Critic side?
  1.  **A Rival Operational Framework:** Critics often excel at diagnosis but fail at prescription. If they could offer a concrete alternative pathway that rivals "earning to give" in terms of *scale* (not just purity), the debate would shift. "Work in policy" is often too vague. "Build X specific institution to achieve Y specific metric" would be compelling.
  2.  **Acknowledgment of Trade-offs:** If critics admitted that refusing "tainted money" does indeed result in identifiable, preventable deaths (accepting the EA empirical premise) but argued that the moral cost of complicity outweighs it, the debate would become an honest moral disagreement rather than a dispute over facts.

  ### 4. Conclusion: The Diagnosis
  This is not a hidden empirical disagreement. It is a **clash of moral ontologies.**

  *   **EA** views the world as a collection of problems to be solved by resource allocation.
  *   **Critics** view the world as a web of relationships to be navigated with integrity.

  Your theory about the burden of proof is the **mechanism** of the stalemate, but the **cause** is the incompatibility between marginalist consequentialism and structuralist ethics.

  **Is it movable?**
  Only if the EA movement incorporates **political and structural variables** into its expected value calculations (treating systemic harm as a quantifiable risk) AND if critics accept that **purity has a body count** (acknowledging the opportunity cost of their stance).

  Until then, you are witnessing two different languages being spoken. The EA speaks the language of **efficiency and scale**; the Critic speaks the language of **justice and integrity**. Without a translation layer that converts "integrity" into "risk factors" or "justice" into "long-term utility," the arguments will continue to circulate exactly as you have observed.
