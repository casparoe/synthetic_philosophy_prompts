      *   The disagreement is deeper. It's not just "burden of proof" (though that's part of it). It's fundamentally *structural* and *meta-ethical*.
      *   Key dimensions to explore:
          1.  **Meta-ethics/Normative Ethics:** Maximizing vs. Satisficing (Demandingness).
          2.  **Epistemology:** What counts as evidence? (Quantifiable vs. Qualitative/Systemic).
          3.  **Social Ontology:** What are institutions? (Neutral tools vs. Constitutive structures).
          4.  **Causality:** Counterfactuals vs. Complicity.

  3.  **Drafting the Diagnosis (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* It's a moral disagreement. EAs want to maximize good. Critics think complicity matters more. Also, EAs like numbers; critics like stories/systems. To move it, EAs need to admit jobs cause harm, Critics need to admit donations help. But they won't agree on the trade-off.
