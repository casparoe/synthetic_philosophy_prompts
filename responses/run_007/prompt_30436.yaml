          2.  **Corporate Moral Agency:** The "company" isn't a ghost. It's a structure of decisions.
          3.  **The Deployment Decision:** The moment of harm isn't the moment of responsibility. The moment of release is.
          4.  **Epistemic Closure (XAI):** The "black box" is temporary.
          5.  **Legal Strict Liability:** It bypasses the need for *mens rea*.
