prompt: |-
  So I'm a software engineer — tech lead at a mid-size company, no formal philosophy background — and I keep getting pulled into these monthly kill-or-keep meetings for projects that are behind schedule and over budget. The official wisdom in the room is always the same: sunk costs are sunk, so ignore them and only look forward. But when I try to actually apply that to a real project its not clean at all. Some of the money we already spent did buy stuff that matters going forward: we learned where the hard parts are, the team built up context on the codebase, customers are expecting the thing because we announced it, and switching to something else has real migration costs of its own. So I can't tell whether I'm being rational or just dressing up throwing good money after bad.

  Could you write me a reusable decision procedure for these kill-or-keep calls, grounded in whatever economics or philosophy actually says about the sunk cost fallacy? It should be a checklist I can run in about an hour, with the questions in order, what counts as a good enough answer to each, where it stops with a kill, where it stops with a keep, and where it should punt to a human because the question is a values call rather than a facts call. I want you to be honest about which steps are judgment calls disguised as procedure, and about whether honoring sunk costs is actually always irrational or whether there are legit cases where past investment should change the decision. Then run it on two or three of these: (a) a two-year internal tool rewrite that's maybe 60–70% done, but a SaaS product now covers 80% of what we needed it for; (b) a customer-facing feature we publicly promised and some customers pre-paid for, now way over budget, and a competitor just shipped something close; (c) a small spike we funded that produced no product but taught us a lot about which approach not to take. Include at least one case where the procedure tells me to kill something the team will hate killing. These decisions are usually a few hundred thousand to a couple million in future spend, a team of five to eight people, the eng manager and a product person have to sign off on the call, and the folks in the room mostly have skin in the game because they've been building the thing.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Software Engineer / Tech Lead at a mid-size company. No formal philosophy background.
      *   **Problem:** Monthly "kill-or-keep" meetings for troubled projects. Official dogma is "ignore sunk costs," but reality is messier (learning, context, customer expectations, migration costs).
      *   **Goal:** A reusable decision procedure (checklist) for these meetings.
      *   **Requirements:**
          *   Grounded in economics/philosophy regarding sunk costs.
          *   Runnable in ~1 hour.
          *   Ordered questions with "good enough" answers.
          *   Clear stop conditions (Kill, Keep, or Punt to Values).
          *   Honesty about judgment calls vs. procedural steps.
          *   Clarification on when honoring past investment *is* rational.
          *   Apply to three specific scenarios (Internal tool rewrite, Customer-facing promised feature, Research spike).
          *   Include at least one case where the procedure recommends killing something unpopular.
          *   Context: Decisions involve \$hundreds of k to \$low millions, 5-8 person teams, stakeholders have skin in the game.

  2.  **Deconstruct the Sunk Cost Fallacy:**
      *   *Standard Econ Definition:* Past costs that cannot be recovered should not influence future decisions. Only marginal costs and marginal benefits matter.
      *   *Nuance:* The user is right. "Sunk costs" often buy *assets* (code, knowledge, reputation, customer trust) that have *future* value. Ignoring them completely is actually irrational if those assets reduce future costs or increase future revenue.
      *   *Philosophical Angle:* Pragmatism (what works), Commitment (reputation), Opportunity Cost (what else could we do?).
      *   *Key Distinction:* Is the past expenditure creating *future utility*? If yes, it's not a sunk cost in the decision sense; it's an asset. If no, it's truly sunk.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be linear, filtering from easiest/hardest facts to softer values.
      *   *Timebox:* 1 hour max.
      *   *Steps:*
          1.  **Define the "Keep" Scenario:** What does finishing actually look like? (Scope, Cost, Time).
          2.  **Define the "Kill" Scenario:** What does stopping actually look like? (Shutdown costs, Migration, Reputation hit).
          3.  **Define the "Alternative" Scenario:** What is the Opportunity Cost? (What else could this team do?).
          4.  **Asset Recovery:** What of the past spend is actually an asset? (Code, Knowledge, Trust).
          5.  **The Comparison:** Net Future Value (Keep) vs. Net Future Value (Kill + Alternative).
          6.  **The Values Punt:** Where numbers fail (Morale, Strategic Signaling).

      *   *Refining the "Sunk Cost" nuance:* I need to explicitly validate the user's intuition. Past spend matters *only insofar as it changes the future equation*. It's not about "we spent \$1M so we must finish." It's "we spent \$1M, which bought us \$500k worth of reusable components, so the remaining cost is lower."

  4.  **Developing the Scenarios:**
      *   *Scenario A (Internal Tool):* 60-70% done, SaaS covers 80%.
          *   *Likely Outcome:* Kill. The marginal benefit of the last 30% is low compared to buying SaaS. The "learning" is the only asset.
      *   *Scenario B (Customer Feature):* Promised, Pre-paid, Competitor shipped.
          *   *Likely Outcome:* Keep (but scope cut) or Kill (with refund). This is the "Values" heavy one. Reputation vs. Cash. Let's make the procedure recommend Killing (or radically pivoting) to satisfy the "unpopular kill" requirement, or show how it forces a hard values conversation. Actually, the prompt asks for *one* case where it tells me to kill something the team will hate. Scenario A is the best candidate for a cold-blooded kill. Scenario B is usually a "keep" due to contractual/reputation reasons, but let's see what the math says.
      *   *Scenario C (Research Spike):* No product, lots of learning.
          *   *Likely Outcome:* Keep (in the sense that the spend was justified), but the *project* is done. It's not a "kill" in the negative sense, it's a "complete" sense.

  5.  **Refining the Procedure (Self-Correction/Iterative Design):**
      *   *Critique:* Standard NPV (Net Present Value) is too abstract for a 1-hour meeting.
      *   *Fix:* Use "Future Cost to Complete" vs. "Future Value Delivered."
      *   *Critique:* Need to address the "team hate" aspect.
      *   *Fix:* Add a specific step on "Team Morale & Signal" as a values punt.
      *   *Critique:* Need to be clear on when sunk costs *are* relevant.
      *   *Fix:* Explicitly label the "Asset Recovery" step.

  6.  **Writing the Content - Section by Section:**
      *   **Introduction:** Validate the user's feeling. The "Sunk Cost Fallacy" is often misapplied.
      *   **The Theory:** Briefly explain *why* past spend matters (assets vs. waste).
      *   **The Protocol:** The checklist.
          *   Phase 1: The Future Math (Keep vs. Kill).
          *   Phase 2: The Asset Audit (What did we buy?).
          *   Phase 3: The Opportunity Cost (What else?).
          *   Phase 4: The Values Punt.
      *   **The Scenarios:** Walk through A, B, and C using the protocol.
      *   **Conclusion:** Final advice on facilitating the meeting.

  7.  **Addressing Specific Constraints:**
      *   *Honesty about judgment calls:* I need to highlight where the procedure relies on estimates that are essentially guesses.
      *   *One unpopular kill:* Scenario A is the classic "Zombie Project." I will ensure the procedure leads to a Kill recommendation there, despite the "70% done" psychological hook.
      *   *Time limit:* Emphasize timeboxing each step.

  8.  **Final Review against constraints:**
      *   Reusable decision procedure? Yes.
      *   Grounded in econ/philosophy? Yes (Opportunity Cost, Marginal Utility).
      *   Checklist format? Yes.
      *   Order/Stop conditions? Yes.
      *   Honesty about judgment calls? Yes.
      *   Sunk cost nuance? Yes.
      *   Three scenarios run? Yes.
      *   Unpopular kill included? Yes (Scenario A).

  9.  *(Self-Correction during drafting Scenario B)*: Scenario B is tricky. If customers pre-paid, killing it requires refunds + reputation damage. The procedure should highlight this as a "Cost of Killing." If the Cost of Killing > Cost of Keeping, you Keep. But if the Competitor made the feature commoditized, the Value of Keeping drops. I need to make sure the procedure captures *Value Erosion*.

  10. *(Self-Correction during drafting Scenario A)*: Make sure the "70% done" trap is explicitly addressed. 70% of *what*? If the scope was wrong, 70% of a wrong thing is 0% of a right thing.

  11. *(Final Polish)*: Ensure tone is peer-to-peer (Eng Lead to Eng Lead), not academic. Practical, slightly cynical but constructive.

  *(Drafting the response based on these thoughts...)*
answer: |-
  Here is a decision procedure designed for your context. It is grounded in microeconomics (marginal analysis, opportunity cost) and pragmatist philosophy (instrumentalism), but stripped of the jargon.

  ### Part 1: The Theory (Read this once)

  You are right to be suspicious of the "ignore sunk costs" dogma. In strict economics, a sunk cost is a past expenditure that cannot be recovered **and yields no future benefit**.

  However, in software engineering, past expenditure often buys **assets**:
  1.  **Code Assets:** Reusable libraries, infrastructure, data.
  2.  **Knowledge Assets:** Understanding domain complexity, technical constraints.
  3.  **Reputation Assets:** Trust with customers, internal morale, signaling commitment.

  If the money you spent bought assets that reduce *future* costs or increase *future* revenue, then ignoring them is irrational. The fallacy isn't "looking at the past"; the fallacy is "continuing a project *because* of the past, rather than *despite* it."

  **The Golden Rule:** You are not deciding whether the past money was well spent. That money is gone. You are deciding whether the **assets purchased by that money** make the **future investment** worthwhile.

  ---

  ### Part 2: The Kill-or-Keep Protocol (1 Hour Max)

  **Participants:** Tech Lead (you), Eng Manager, Product Owner. (Keep it small).
  **Prep:** None. Do this live.
  **Timebox:** 10 minutes per section. If you stall, move to the next section.

  #### Phase 1: The Marginal Math (20 Minutes)
  *Goal: Establish the future cost/benefit without looking backward.*

  **Q1: What is the precise "Definition of Done" for keeping this alive?**
  *   *Good Answer:* A specific list of features/outputs with a date. (e.g., "Ship X and Y by Q3").
  *   *Bad Answer:* "Finish the rewrite," "Make it stable." (Vague).
  *   *Stop Condition:* If you cannot define "Done" in 5 minutes, **PUNT TO VALUES**. You are chasing a horizon.

  **Q2: What is the realistic cost to reach "Done" from today?**
  *   *Input:* Team size × Months remaining × Fully Loaded Cost. Include maintenance post-launch.
  *   *Good Answer:* A range with confidence intervals (e.g., "$400k–$600k").
  *   *Bad Answer:* "We just need two more sprints." (Optimism bias).
  *   *Stop Condition:* If Cost to Complete > Expected Future Value, **KILL**. (Proceed to Phase 4 to manage the fallout).

  **Q3: What is the "Cost of Kill" right now?**
  *   *Input:* Severance, contract breakage fees, refund obligations, migration costs to a replacement, write-down accounting.
  *   *Good Answer:* A hard dollar figure.
  *   *Bad Answer:* "It will be messy."
  *   *Stop Condition:* If Cost of Kill > Cost to Complete, **KEEP** (unless Phase 3 shows a better alternative).

  #### Phase 2: The Asset Audit (15 Minutes)
  *Goal: Determine if "Sunk Costs" are actually "Pre-Purchased Future Value."*

  **Q4: What specific assets from the past spend reduce the "Cost to Complete" (Q2)?**
  *   *Input:* Code modules, architectural decisions, domain knowledge.
  *   *Test:* If we started a new team today from scratch, would they be faster because of what this team did?
  *   *Good Answer:* "They built the auth layer, saving 2 months."
  *   *Bad Answer:* "They know the code." (Unless that knowledge is documented/transferable).
  *   *Decision:* Subtract the value of these assets from Q2. If the net cost is still too high, the assets don't save the project.

  **Q5: Do any assets have value *outside* this project?**
  *   *Input:* Can the code be used elsewhere? Is the knowledge applicable to other products?
  *   *Good Answer:* "The data pipeline we built can power Project Z."
  *   *Bad Answer:* "The team is smarter now." (Hard to monetize).
  *   *Decision:* If Yes, consider **PIVOT** (Keep the team/assets, kill the specific project goal). If No, the sunk cost is truly sunk.

  #### Phase 3: The Opportunity Cost (15 Minutes)
  *Goal: Compare against the best alternative use of resources.*

  **Q6: If we kill this, what is the *single best* thing this team could do instead?**
  *   *Input:* A specific backlog item or new initiative.
  *   *Good Answer:* "Work on the checkout latency issue, projected to save $1M/year."
  *   *Bad Answer:* "Work on tech debt," "Pick up new tickets." (Too vague).
  *   *Stop Condition:* If Value(Alternative) > Value(Keep Project) - Cost(Kill), **KILL**.

  #### Phase 4: The Values Punt (10 Minutes)
  *Goal: Acknowledge where math fails and politics begin.*

  **Q7: Does killing this violate a core commitment that threatens the business model?**
  *   *Input:* Public promises, regulatory requirements, key customer contracts.
  *   *Good Answer:* "We have signed contracts requiring this."
  *   *Bad Answer:* "We told people we were doing it." (Marketing fluff vs. Legal obligation).
  *   *Decision:* If Yes, this overrides the math. **KEEP** (but scope cut immediately).

  **Q8: Will killing this destroy the team's ability to execute future work?**
  *   *Input:* Morale, trust in leadership.
  *   *Honesty Check:* This is the judgment call disguised as procedure.
  *   *Decision:* If the team views this as a "betrayal" rather than a "strategic pivot," you may need to **KEEP** to preserve social capital, but treat it as an R&D cost, not a product investment.

  ---

  ### Part 3: Where the Procedure is "Fake" (Honesty Check)

  1.  **Estimating "Cost to Complete" (Q2):** In software, this is almost always a guess. The procedure forces you to write the guess down, which exposes optimism bias, but it doesn't solve it. *Mitigation:* Multiply the team's estimate by 1.5x before plugging it into the math.
  2.  **Valuing "Reputation" (Q7/Q8):** There is no dollar value for "team morale." This is where you, as the Tech Lead, must exercise judgment. The procedure flags it, but you must weigh it.
  3.  **The "Asset" Valuation (Q4/Q5):** Engineers love to overvalue code they wrote. *Mitigation:* Ask, "Would we pay a vendor for this module today?" If no, its value is $0.

  ---

  ### Part 4: Running the Protocol on Your Scenarios

  #### Scenario A: The Internal Tool Rewrite
  *   **Context:** 2 years, 60–70% done. SaaS covers 80% of needs.
  *   **Team:** 6 engineers. Skin in the game: High (built it from scratch).

  **Phase 1 (Math):**
  *   **Q1 (Done):** "Last 30% of features + migration."
  *   **Q2 (Cost to Complete):** 6 engineers × 6 months = ~$900k + maintenance.
  *   **Q3 (Cost of Kill):** $0 severance (reassign team). SaaS subscription = $100k/year. Migration effort = $100k one-time.
  *   **Result:** Keep Cost ($900k + ongoing) > Kill Cost ($100k + SaaS fee). **Lean Kill.**

  **Phase 2 (Assets):**
  *   **Q4 (Reduce Future Cost):** Does the 70% built reduce SaaS integration cost? Maybe 10%.
  *   **Q5 (External Value):** It's an internal tool. No external value.
  *   **Result:** Assets do not justify the remaining spend.

  **Phase 3 (Opportunity):**
  *   **Q6 (Alternative):** Team could work on core product differentiation.
  *   **Result:** High value.

  **Phase 4 (Values):**
  *   **Q7 (Commitment):** Internal only. No customer contracts.
  *   **Q8 (Morale):** Team will hate this. They feel 70% done implies 30% to go.
  *   **Verdict:** **KILL.**
  *   **Why the team will hate it:** They are suffering from the "Concorde Effect." They feel the 2 years *must* mean something.
  *   **Your Script:** "The 2 years bought us the knowledge that building this is harder than buying it. That knowledge is worth the $2M we spent. But spending $1M more to finish the last 30% when a vendor does 80% for cheap is burning cash. We are not deleting the work; we are acknowledging the market changed."

  #### Scenario B: The Customer-Facing Promise
  *   **Context:** Publicly promised, pre-paid, over budget. Competitor shipped similar.
  *   **Team:** 5 engineers. Skin in the game: Reputation with customers.

  **Phase 1 (Math):**
  *   **Q2 (Cost to Complete):** High. Chasing a competitor often leads to feature creep.
  *   **Q3 (Cost of Kill):** Refunds (cash hit) + Reputation damage (churn risk).
  *   **Result:** If Refunds + Churn > Cost to Complete, Math says **KEEP**.

  **Phase 2 (Assets):**
  *   **Q5 (External Value):** The code is specific to this promise. Low reuse.

  **Phase 3 (Opportunity):**
  *   **Q6 (Alternative):** Build something the competitor *hasn't* shipped.
  *   **Result:** Higher strategic value than playing catch-up.

  **Phase 4 (Values):**
  *   **Q7 (Commitment):** **CRITICAL.** Customers pre-paid. This is a contractual or near-contractual obligation.
  *   **Verdict:** **KEEP (with Pivot).**
  *   **Reasoning:** You cannot apply pure sunk cost logic here because the "Cost of Kill" includes brand destruction. However, you must change the definition of "Done."
  *   **Action:** Ship the "Minimum Viable Promise." Do not match the competitor feature-for-feature. Fulfill the contract, then pivot the team to the Opportunity from Q6.
  *   **Note:** This is a **Values Punt**. The math might say "Refund everyone and run," but the long-term business value says "Honor the trust."

  #### Scenario C: The Research Spike
  *   **Context:** Funded spike, no product, taught us what *not* to do.
  *   **Team:** 3 engineers. Skin in the game: Intellectual curiosity.

  **Phase 1 (Math):**
  *   **Q1 (Done):** There is no "Done." It's research.
  *   **Q2 (Cost to Complete):** N/A. The project is effectively over.
  *   **Verdict:** **CLOSE.** (Not Kill).

  **Phase 2 (Assets):**
  *   **Q4/Q5 (Assets):** "We know which approach not to take."
  *   **Valuation:** High. Avoiding a $5M mistake is worth a $500k spike.
  *   **Action:** Document the "Negative Knowledge." Ensure other teams consume this before starting similar work.

  **Phase 4 (Values):**
  *   **Q8 (Morale):** Ensure the team is celebrated for *finding the dead end*, not punished for *not shipping*.
  *   **Verdict:** This is a **SUCCESS**, not a failure. The procedure prevents you from treating this as a "Kill" decision. It classifies it as "Mission Accomplished."

  ### Summary of Recommendations

  1.  **Scenario A (Internal Tool):** **KILL.** This is the unpopular one. The "70% done" is a trap. The SaaS alternative makes the remaining marginal cost irrational. Use the "Asset Audit" to validate the team's effort (you bought knowledge) while stopping the spend.
  2.  **Scenario B (Customer Promise):** **KEEP (Scoped).** This is a Values Punt. The cost of breaking trust exceeds the cost of completion. However, do not build the "whole thing." Build the minimum required to honor the promise, then pivot.
  3.  **Scenario C (Spike):** **CLOSE.** Reframe this as a completed purchase of information. Do not let the team feel this was a waste.

  ### Final Advice for the Meeting

  When you present the "Kill" on Scenario A, the engineers will say, "But we've come so far."
  Your response, grounded in this procedure:
  > "We have come far, and that distance has value. It taught us X and Y. But the map changed (SaaS exists). Continuing to walk because we've already walked 10 miles is irrational if the destination is now reachable by bus for $100. We are keeping the knowledge (the asset) but stopping the walk (the future cost)."

  This separates the *value of the past* from the *decision for the future*. That is the only way to be rational without being dismissive.
