      *   **Constraint:** Do *not* evaluate existing theories against the list. Just provide the specification/job description.

  2.  **Deconstruct the Field of Moral Uncertainty:**
      *   What is the core problem? An agent has credences over competing moral theories (e.g., Utilitarianism, Deontology, Virtue Ethics) and needs to choose an action.
      *   What are the main approaches?
          *   Maximizing Expected Choice-Worthiness (MEC).
          *   My Favorite Theory (MFT).
          *   Parliamentary Models (e.g., Borda count).
          *   Stochastic Dominance approaches.
      *   What are the common pain points?
          *   Intertheoretic comparisons (how to compare utility units across theories).
          *   Fanaticism (Pascal's Mugging style problems with low credence/high stake theories).
          *   Metaethical compatibility (does moral uncertainty make sense if moral realism is false?).
          *   Action-guidance (can the agent actually compute this?).

  3.  **Drafting the Desiderata (Brainstorming & Categorization):**

      *   *Formal Rationality:* Needs to look like decision theory. Transitivity, dominance, etc.
      *   *Intertheoretic Comparisons:* Needs to handle different scales (cardinal vs. ordinal).
      *   *Metaethical Neutrality:* Should work for realists and anti-realists (or at least specify).
      *   *Normative Neutrality:* Should work whether the candidate theories are utilitarian, deontological, etc.
      *   *Fanaticism:* Shouldn't let a 0.0001% credence in a "kill everyone" theory dictate action.
      *   *Action-Guidance:* Needs to be computable/usable.
      *   *Deference:* If Theory T says "ignore uncertainty," should the framework respect that?
      *   *Continuity:* Small changes in credence shouldn't cause massive flips in action (unless warranted).

  4.  **Refining and Classifying (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Internal consistency (logic), Action-guidance (must output *something*), Dominance (if T1 says A>B and T2 says A>B, choose A).
      *   *Preferences:* Intertheoretic comparability (some say it's impossible), Cardinality (some theories are ordinal), Fanaticism avoidance (some say expected value *requires* fanaticism).

  5.  **Identifying Tensions/Impossibility Results (The Core Challenge):**
      *   *The "Intertheoretic Comparison" vs. "Normative Neutrality" tension:* If Theory A is cardinal and Theory B is ordinal, how do you mix them in an expectation?
      *   *The "Fanaticism" vs. "Expected Utility" tension:* MEC implies fanaticism. Avoiding fanaticism requires violating standard EU axioms (like continuity or unbounded utility).
      *   *The "Deference" vs. "Uncertainty Management" tension:* If the true theory says "follow MFT," but you aren't sure it's true, do you follow MFT? (The "Objectivism vs. Perspectivism" debate).
      *   *The "Separability" tension:* Does the choice depend on irrelevant alternatives? (Parliamentary models often violate IIA).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate the need for a meta-framework.
      *   **Section 1: The Core Job Description (Non-Negotiables):** The baseline requirements for *any* decision procedure.
      *   **Section 2: Substantive Desiderata (Contested/Preferences):** Where the camps diverge.
      *   **Section 3: Formal & Metaethical Constraints:** Consistency with logic and metaphysics.
      *   **Section 4: The Impossibility Results & Tensions:** The critical analysis of joint unsatisfiability.
      *   **Conclusion:** Summary of the landscape.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Non-negotiable":* Be careful. Is "Action Guidance" non-negotiable? Some might argue a theory can be regulative even if not computable. I'll classify it as non-negotiable for a *practical* theory, but note the theoretical caveat.
      *   *Refining the "Deference" point:* This is the "Moral Uncertainty about Moral Uncertainty" problem. If Utilitarianism is true, does it demand MEC? If Deontology is true, does it demand MFT? This is the "Objectivist" challenge.
      *   *Refining the "Fanaticism" point:* Connect this explicitly to the axioms of Expected Utility Theory (EUT). To avoid fanaticism, you usually have to drop EUT.
      *   *Refining "Intertheoretic Comparison":* This is the biggest technical hurdle. The "Zero Point" problem and the "Unit" problem.

  8.  **Final Review against User Prompt:**
      *   Did I list desiderata? Yes.
      *   Did I give motivations/cases? Yes.
      *   Did I flag Non-negotiable vs. Preference? Yes.
      *   Did I spell out tensions/impossibility results? Yes (this is the most important part).
      *   Did I avoid scoring existing theories? Yes.

  9.  **Polishing the Tone:** Ensure it sounds academic, precise, and empathetic to the frustration expressed. Use terminology correct for the field (MEC, MFT, cardinal/ordinal, fanaticism, deference).

  **(Self-Correction during drafting):** I initially thought about putting "Intertheoretic Comparability" as a non-negotiable. But many theorists (like some ordinalists) argue it's impossible. So it must be a contested desideratum. The *ability to handle* the lack thereof is the real requirement. I need to phrase this carefully: "A mechanism for handling structural heterogeneity."

  Also, need to make sure I explicitly address the "Correct Theory Tells You to Ignore Uncertainty" point the user raised. That's the *Deference Principle* tension.

  Let's organize the impossibility results clearly. The "Trilemma" is a good framing.

  10. **Final Polish:** Check for clarity and flow. (Proceed to generate output).

  *(Post-computation check)*: Does this address the "job description contains contradictions" prompt? Yes, Section 4 is dedicated entirely to that. I need to make sure I don't just list tensions but explain *why* they might be logically incompatible (e.g., axioms of EUT vs. anti-fanaticism).

