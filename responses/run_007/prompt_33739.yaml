answer: |-
  This is a sophisticated request that cuts to the methodological core of the moral uncertainty debate. The frustration you describe stems from the fact that the literature often conflates *normative ethics* (what is good?) with *metanormative theory* (what should I do given my uncertainty about what is good?). When authors argue past each other, it is usually because they are optimizing for different meta-normative virtues without acknowledging the trade-offs.

  Below is the specification you requested. It breaks down the "job description" for a theory of decision-making under moral uncertainty into **Non-Negotiable Constraints** (logical/practical baselines), **Substantive Desiderata** (contested virtues), and **Formal/Metaethical Consistency**. The final section details the **Impossibility Results and Tensions**, which is the critical payoff of this exercise.

  ---

  ### I. Non-Negotiable Constraints (The Baseline)
  *Any adequate theory must satisfy these to function as a decision procedure. Failure here renders the theory incoherent or useless.*

  **1. Formal Consistency (Logical Coherence)**
  *   **Requirement:** The theory must not generate contradictory recommendations for the same state of information. It must respect basic logical laws (e.g., if Action A is recommended over B, B cannot be recommended over A in the identical context).
  *   **Motivation:** A decision theory that outputs $A > B$ and $B > A$ simultaneously provides no guidance. This is a requirement of rationality itself, not specific to morality.
  *   **Status:** **Non-Negotiable.**

  **2. Weak Dominance (Pareto Condition over Theories)**
  *   **Requirement:** If every moral theory in which the agent has non-zero credence ranks Action A at least as high as Action B, and at least one theory ranks A strictly higher than B, the theory must recommend A over B.
  *   **Motivation:** If Utilitarianism says $A > B$ and Deontology says $A > B$, there is no moral reason to choose B. To do so would be to act against *all* live moral hypotheses.
  *   **Status:** **Non-Negotiable.** (Almost no theorist rejects this, though some parliamentary models struggle to formalize it without violating other axioms).

  **3. Action-Guidance (Computability)**
  *   **Requirement:** The theory must yield a determinate verdict (or a determinate set of permissible options) within the epistemic and computational limits of the agent.
  *   **Motivation:** The purpose of the theory is to guide action. If the theory requires information the agent cannot possibly have (e.g., precise intertheoretic conversion rates that are metaphysically inaccessible), it fails its functional role.
  *   **Status:** **Non-Negotiable.** (Though "guidance" can be interpreted loosely as "regulative ideal" vs. "algorithm," a theory that is *in principle* incomputable is practically vacuous).

  ---

  ### II. Substantive Desiderata (Contested Virtues)
  *These are the criteria over which camps disagree. A theory may reject one of these, but it must do so explicitly and justify the cost.*

  **4. Intertheoretic Comparability (The "Common Currency" Requirement)**
  *   **Requirement:** The theory must be able to compare the "choice-worthiness" values assigned by different moral theories (e.g., comparing Utilitarian "utils" to Deontological "rights violations").
  *   **Motivation:** Without this, you cannot calculate expectations across theories. You cannot weigh a 60% chance of "maximize happiness" against a 40% chance of "do not lie."
  *   **Motivating Case:** *The Torture vs. Dust Specks case.* If Theory A says torture is $-10^{100}$ and Theory B says dust specks are $-1$, how do we trade off credences without a common scale?
  *   **Status:** **Contested Preference.** (MEC proponents treat this as essential; Ordinalists/Parliamentary proponents argue it is impossible and design around it).

  **5. Structural Neutrality (Cardinality vs. Ordinality)**
  *   **Requirement:** The theory should accommodate moral theories that offer only ordinal rankings (A > B) and those that offer cardinal measurements (A is 2x better than B), without forcing one structure onto the other.
  *   **Motivation:** Many plausible normative theories (e.g., Rossian Deontology) seem to offer only ordinal rankings or threshold constraints, not cardinal utility functions. Forcing them into a cardinal mold distorts their content.
  *   **Status:** **Contested Preference.** (MEC requires cardinality; Stochastic Dominance and Parliamentary models attempt to respect ordinality).

  **6. Anti-Fanaticism (Sensitivity to Probability)**
  *   **Requirement:** The theory should not allow actions with near-zero probability but astronomically high stakes (according to some minority theory) to dominate decision-making.
  *   **Motivation:** *Pascal's Mugging.* If you have 0.000001% credence in a theory that says "Kill one person to save $3 \uparrow\uparrow\uparrow 3$ lives," Expected Choice-Worthiness (ECW) might demand you kill. This seems intuitively irrational.
  *   **Status:** **Contested Preference.** (Some argue fanaticism is a bullet we must bite if we accept Expectationalism; others view avoiding it as a hard constraint).

  **7. Deference to the Objectively Correct Theory (The "Metanormative Deference" Principle)**
  *   **Requirement:** If Moral Theory T is actually true, and T says "Ignore moral uncertainty and just follow T," the decision theory should recommend following T.
  *   **Motivation:** If Utilitarianism is the true morality, and it says "Maximize utility regardless of your doubts," a theory that says "No, hedge your bets" is effectively overriding the true morality.
  *   **Status:** **Contested Preference.** (This creates the "Objectivism vs. Perspectivism" debate. Satisfying this often collapses moral uncertainty into first-order morality).

  ---

  ### III. Formal & Metaethical Consistency
  *Constraints imposed by neighboring fields.*

  **8. Consistency with Decision Theory Axioms**
  *   **Requirement:** The theory should ideally respect standard rationality axioms (Transitivity, Independence, Continuity) unless there is a specific moral reason to violate them.
  *   **Motivation:** Violating these axioms opens the agent to money pumps or dynamic inconsistency (planning to do X at time 1, but rationally compelled to do Y at time 2).
  *   **Status:** **Strong Preference.** (Violating them is permissible *if* motivated by moral structure, but costly).

  **9. Metaethical Neutrality (or Explicit Commitment)**
  *   **Requirement:** The theory must either work regardless of whether moral realism is true, or explicitly state its dependence on realism.
  *   **Motivation:** If the theory presupposes moral realism (e.g., that there is a fact of the matter about "choice-worthiness" to be uncertain about), it is useless to an error theorist or expressivist.
  *   **Status:** **Preference.** (Most literature assumes realism; an expressivist-compatible theory is a distinct niche).

  **10. Separability (Independence of Irrelevant Alternatives)**
  *   **Requirement:** The ranking between Action A and Action B should not depend on the presence of Action C.
  *   **Motivation:** Standard decision theory requirement. If adding a "spoiler" option changes your moral choice between two existing options, the procedure seems manipulable or unstable.
  *   **Status:** **Preference.** (Parliamentary models often violate this; MEC respects it).

  ---

  ### IV. The Impossibility Results and Tensions
  *This is the critical section. The "Job Description" contains contradictions. You cannot maximize all these virtues simultaneously.*

  #### Tension 1: The "Fanaticism Trilemma" (MEC vs. Anti-Fanaticism vs. Standard Axioms)
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Expectationalism:** Maximize Expected Choice-Worthiness (MEC).
      2.  **Unbounded Value:** Moral value can be arbitrarily large (e.g., infinite populations).
      3.  **Anti-Fanaticism:** Low-probability extreme stakes should not dominate.
  *   **The Impossibility:** If you accept MEC (Desideratum 4) and standard Decision Theory axioms (Desideratum 8), you *must* accept Fanaticism if any theory in your credence distribution allows for unbounded value. To avoid Fanaticism (Desideratum 6), you must either reject MEC (move to Stochastic Dominance) or reject standard axioms (e.g., reject Continuity).
  *   **Implication:** A theory that claims to be MEC-based *and* Anti-Fanatic is mathematically incoherent unless it restricts the domain of allowable moral theories (violating Structural Neutrality).

  #### Tension 2: The "Intertheoretic Comparison" vs. "Structural Neutrality"
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Structural Neutrality:** Accommodate theories that deny cardinal structure (Ordinalists).
      2.  **Intertheoretic Comparability:** Compare values across theories to weigh them.
      3.  **Non-Arbitrariness:** The comparison method isn't just a stipulation.
  *   **The Impossibility:** If Theory A is cardinal and Theory B is ordinal, there is no mathematical way to integrate them into a single expectation without imposing cardinal structure onto Theory B. This distorts Theory B (violating Neutrality). If you refuse to impose structure, you cannot compare them (violating Comparability).
  *   **Implication:** Parliamentary models (like Borda Count) solve this by dropping Comparability for Ordinality, but they often violate **Separability** (Desideratum 10) and **Weak Dominance** in edge cases. MEC solves this by dropping Neutrality (forcing all theories into a cardinal mold).

  #### Tension 3: The "Deference" vs. "Uncertainty Management" Paradox
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Deference to True Theory:** If Theory T is true, do what T says.
      2.  **Uncertainty Management:** Act differently than any single first-order theory would dictate because of uncertainty.
      3.  **Non-Omniscience:** The agent does not know which theory is true.
  *   **The Impossibility:** Suppose the true theory is Utilitarianism, and Utilitarianism says "Maximize expected utility *given your actual credences*." Then Deference and Uncertainty Management align. But suppose the true theory is a Dogmatic Deontology that says "Follow the Categorical Imperative regardless of your doubts." If you follow Uncertainty Management (hedging), you violate Deference. If you follow Deference, you must effectively adopt a "My Favorite Theory" approach (acting as if your highest credence theory is true), which renders the machinery of moral uncertainty redundant.
  *   **Implication:** A theory cannot be both fully sensitive to uncertainty *and* fully deferential to all possible true theories, because some possible true theories forbid sensitivity to uncertainty.

  #### Tension 4: The "Action-Guidance" vs. "Metaethical Realism" Gap
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Action-Guidance:** Tell the agent what to do now.
      2.  **Metaethical Neutrality:** Work even if moral facts don't exist (Expressivism/Error Theory).
      3.  **Objective Truth-Tracking:** Aim to choose the objectively right action.
  *   **The Impossibility:** If moral facts do not exist (Error Theory), there is no "objective choice-worthiness" to maximize. A theory that claims to maximize expected *truth* fails if there is no truth. A theory that claims to maximize *coherence of attitudes* (Expressivism) changes the definition of "choice-worthiness" entirely.
  *   **Implication:** Most MEC literature implicitly assumes Moral Realism. If you require Metaethical Neutrality, you cannot use "Expected Choice-Worthiness" in the standard sense; you must shift to "Expected Coherence" or similar, which changes the formal structure.

  ### Summary of the "Job Description" Contradictions

  If you are evaluating a theory, look for where it breaks the chain below. **No theory satisfies all of these:**

  1.  **Respects First-Order Structure** (doesn't force cardinality on ordinal theories).
  2.  **Allows Intertheoretic Comparison** (can weigh Theory A against Theory B).
  3.  **Avoids Fanaticism** (ignores low-probability infinite stakes).
  4.  **Respects Standard Rationality Axioms** (no money pumps).
  5.  **Defers to the True Theory** (even if the true theory says "ignore uncertainty").

  *   **MEC (MacAskill):** Satisfies 2, 4, 5 (mostly). Fails 1 (forces cardinality) and 3 (succumbs to fanaticism).
  *   **Parliamentary Models:** Satisfies 1, 3. Fails 2 (no real comparison), 4 (violates IIA/Separability), and 5 (arbitrary voting rules may not match true theory).
  *   **Stochastic Dominance:** Satisfies 1, 3, 4. Fails 2 (incomplete ordering; often yields no verdict) and 5 (may not defer to maximizing theories).
  *   **My Favorite Theory:** Satisfies 1, 3, 5. Fails 2 (ignores minority theories) and violates Weak Dominance (Non-Negotiable #2).

  ### Conclusion: The Specification
  The job description for a theory of moral uncertainty contains a **logical impossibility**. It asks for a procedure that is:
  1.  Sensitive to all credences (Uncertainty).
  2.  Sensitive to the specific structural claims of each theory (Neutrality).
  3.  Capable of aggregating those structures into a single choice (Comparability).
  4.  Robust against extreme outliers (Anti-Fanaticism).
  5.  Consistent with the possibility that the correct view is one that rejects 1 (Deference).

  **Your Evaluation Strategy:**
  Do not look for a theory that meets all criteria. Instead, identify which tension the author chooses to resolve.
  *   If they prioritize **Formal Rigor**, they will likely accept Fanaticism and Intertheoretic Comparability (MEC).
  *   If they prioritize **Metaethical Caution**, they will likely reject Comparability and accept incomplete orderings (Stochastic Dominance).
  *   If they prioritize **First-Order Integrity**, they will likely reject Uncertainty Management entirely (My Favorite Theory/Deference).

  The "frustration" you feel is the residue of authors trying to sell a solution to an impossibility theorem as a settled framework. The value of the literature is not in the solutions, but in which constraint they choose to relax.
