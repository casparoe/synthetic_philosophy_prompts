          *   Elena: "Because his cortisol dropped. It's chemistry."
          *   Marcus: "He reads a book on anger management."
          *   Elena: "Reprogramming."
          *   Marcus: "No, he sees the pattern."
          *   Elena: "Seeing is just input."
          *   Marcus: "But the input changes the algorithm."
          *   Elena: "The algorithm dictates how the input changes the algorithm."

      *   *Refining the Climax:* Marcus needs to land the point about *normativity*. Wasps follow causal laws. Humans follow reasons. Reasons can be false. We can act on false reasons. Wasps can't act on false inspections.
