      *   *Idea for Marcus:* The "Open Future." The wasp's future is closed. The human's future is open *because* we represent it as open.
      *   *Idea for Elena:* That representation is a heuristic.

      *   *Let's write.*

      *(Self-Correction during drafting)*: Ensure I don't drift into abstract jargon. Keep it grounded. Use the wasp example again but evolve it.

      *(Word Count Check)*: Keep an eye on the length. If it's too short, expand on the examples. If too long, trim the preamble.

