      *   **Tone:** Tight, adversarial, intellectually formidable (no strawmen), responsive dialogue.
      *   **Length:** 800 - 1,200 words.
      *   **Key Arguments:**
          *   Biologist: Flexibility is just a higher-order fixed action pattern. The feeling of freedom is part of the loop.
