      *   **Style:** Concrete examples, novelistic feel (not a seminar paper).

  2.  **Character Voices & Setting:**
      *   *Setting:* Needs to be intimate but slightly tense. A late-night office, a kitchen table, maybe a bar. Let's go with a cluttered office late at night. It emphasizes the work and the exhaustion of the argument.
      *   *Elena (Biologist):* Pragmatic, sharp, focused on mechanism, slightly cynical but grounded in data.
