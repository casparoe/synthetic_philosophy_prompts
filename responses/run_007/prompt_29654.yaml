answer: |-
  **Project Title:** The Direction of Parthood: Composition, Decomposition, and Metaphysical Symmetry

  **1. Statement of the Research Question**

  The Special Composition Question (SCQ), famously articulated by Peter van Inwagen, asks: *Under what conditions do some things compose a whole?* This question presupposes a bottom-up direction of inquiry: given a plurality of objects, when do they sum to a further object? The literature has almost uniformly treated this as the exhaustive framework for debates in material ontology. However, this ignores the converse inquiry: the Special Decomposition Question (SDQ). The SDQ asks: *Given a whole object, under what conditions does it decompose into specific proper parts?*

  While composition and decomposition are logically converse relations, it is an open metaphysical question whether the *truth conditions* governing them are symmetric. Standard mereological frameworks often assume that if $xs$ compose $y$, then $y$ decomposes into $xs$. But this extensional equivalence does not guarantee that the *explanatory conditions* are identical or that the questions share the same modal profile.

  This project pursues three specific questions:
  1.  **Extensional Symmetry:** Do the standard answers to the SCQ (Nihilism, Universalism, Restricted Composition) entail equivalent answers to the SDQ?
  2.  **Metaphysical Priority:** Is one question more fundamental than the other? For instance, if Priority Monism is true, is the SDQ the fundamental ontological question, rendering the SCQ derivative?
  3.  **Formal Asymmetry:** Do the formal properties of parthood (transitivity, reflexivity, antisymmetry) guarantee that an answer to the SCQ yields a determinate answer to the SDQ, or are there models where composition holds but decomposition is indeterminate?

  **2. Significance and Gap in the Literature**

  Current debates in material ontology are structured almost exclusively around the SCQ. This bottom-up bias reflects a mereological pluralism that takes parts as the starting point. While Priority Monism has challenged the ontological priority of parts, it has not sufficiently interrogated the *conditions* of decomposition as distinct from composition. Most monists argue the whole is prior, but they often retain the SCQ's conditions merely inverted. This project argues that this is a mistake.

  Consider Universalism. The Universalist answers the SCQ with "Always." However, the answer to the SDQ cannot be "Always." A specific whole (e.g., a statue) does not decompose into *any* arbitrary plurality (e.g., the atoms of a distant star), even if those atoms compose *some* whole. This suggests that while composition might be unrestricted, decomposition is structurally constrained. Existing literature has not adequately explored this divergence. If the conditions for decomposition are stricter or structurally different than those for composition, then the SCQ is insufficient to characterize the mereological structure of the world.

  Furthermore, restricted composition views (e.g., contact, fastening, or life) define when parts unify. They rarely specify when a whole *admits* division. A biological organism might compose via "life," but does it decompose only via death? Or can it decompose while living (e.g., shedding cells)? The literature treats these as the same boundary, but they may represent distinct metaphysical thresholds. By isolating the SDQ, this project exposes a structural blind spot in contemporary mereology.

  **3. Methodology and Work Plan**

  This project employs a hybrid method combining formal mereology with case-based metaphysical analysis. The goal is to produce two journal articles and a comprehensive monograph outline. The work plan covers a 12-month postdoctoral period.

  *   **Months 1–3: Formalization and Modeling.**
      *   Develop a formal framework distinguishing composition operators from decomposition operators.
      *   Construct model-theoretic scenarios where SCQ and SDQ conditions diverge.
      *   Test whether Classical Extensional Mereology (CEM) forces symmetry or allows for directional asymmetry.
  *   **Months 4–6: Case Studies in Ontological Positions.**
      *   **Universalism:** Analyze the asymmetry between unrestricted composition and restricted decomposition.
      *   **Priority Monism:** Evaluate whether the SDQ provides a more natural formulation of monistic ontology than the SCQ.
      *   **Restricted Composition:** Examine "Life" and "Contact" views to determine if decomposition conditions require additional constraints (e.g., survivability, functional integrity).
  *   **Months 7–9: Drafting and Argumentation.**
      *   Draft Article 1: "The Extensional Gap," focusing on the Universalism objection and formal asymmetry.
      *   Draft Article 2: "Top-Down Ontology," focusing on Priority Monism and the fundamentality of the SDQ.
      *   Present preliminary findings at internal department workshops.
  *   **Months 10–12: Revision and Dissemination.**
      *   Submit articles to peer-reviewed journals.
      *   Prepare a conference presentation for a major metaphysics venue.
      *   Finalize a research outline for a long-term monograph project based on the fellowship results.

  **4. Risk Assessment and Conditions of Failure**

  Philosophical research carries the inherent risk that the central distinction may collapse under scrutiny. I offer an honest account of what would constitute project failure:

  1.  **Triviality:** If it can be demonstrated that the SDQ is merely a notational variant of the SCQ with no distinct truth conditions or explanatory power, the project's central thesis fails. While this would be a valuable negative result for the field, it would undermine the proposal's claim to novelty.
  2.  **Formal Collapse:** If formal modeling shows that any coherent answer to the SCQ *mathematically necessitates* a symmetric answer to the SDQ within standard logical frameworks, the proposed asymmetry is untenable.
  3.  **Lack of Traction:** If the distinction proves to be merely linguistic (e.g., "composition" and "decomposition" are just active/passive voice descriptions of the same relation) rather than metaphysical, the project will not generate the intended ontological insights.

  However, even in these failure scenarios, the project yields a definitive proof of symmetry, which is currently assumed but unproven in the literature. Nevertheless, my preliminary analysis of Universalism suggests that extensional equivalence does not hold, indicating a high probability of success in establishing the SDQ as a distinct and necessary line of inquiry.
