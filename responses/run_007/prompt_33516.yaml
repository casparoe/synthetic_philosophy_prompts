      *   *The Point:* It's not about the *deaths* involved in extinction (since in Infertility, people die of old age normally). It's about the *end of the chain*.
      *   *Conservatism vs. Radicalism:* Scheffler argues this shows we care more about the survival of humanity than our own survival (radical claim) OR that our values are conservatively dependent on social continuity.
      *   *Key Distinction:* The badness is about the *undermining of value* for the living, not just the deprivation of life for the unborn.

