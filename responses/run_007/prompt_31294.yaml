prompt: |-
  You're a philosopher of mind who works on naturalized semantics, and I want you to think carefully before writing. I'm about to read a bunch of teleosemantic theories of content (Millikan, Dretske, Fodor, Shea, Neander, that crowd), and I want the standards fixed first so I dont just get charmed by whichever theory handles one example cleanly.

  Write me the desiderata: what any adequate teleosemantic theory of representational content has to deliver. For each requirement give the case or consideration that motivates it, and say whether its non-negotiable or just a camp preference. I especially want the requirements to cover at least these: allowing misrepresentation without making content disjunctive (the fly-detector problem), settling distal versus proximal content, avoiding the conclusion that content is arbitrary given selection history, and saying something principled about swampman-type cases. If some of these pull against each other, say which pairs can't be jointly satisfied and why, because that's the part I most want to see.

  Keep the weight on the criteria and the cases behind them, not on scorecarding actual theories, though a short paragraph at the end saying which single requirement knocks out the most popular theories would be great. Don't bother with citations, I'll add those myself.

  Start by brainstorming the hardest cases before you commit to a list.
