answer: |-
  ### Phase 1: Brainstorming the Hard Cases

  Before we codify the rules, we need to stare directly at the phenomena that break the machinery. If we don't anchor the desiderata in these specific failure points, any theory can look good by cherry-picking easy examples.

  1.  **The Frog's Fly (The Misrepresentation Problem):** A frog snaps at a moving black pellet. In the ancestral environment, black pellets were flies. Now, it's a pellet. If content is determined by what *actually* causes the state, the content is "black pellet," and the frog is right. If content is "fly," the frog is wrong. But why "fly" and not "fly-or-pellet"? If it's the disjunction, error is impossible. We need a way to privilege the *fly* interpretation without appealing to the frog's internal perspective (which begs the question).
  2.  **Swampman (The History Problem):** A lightning strike assembles a molecule-for-molecule duplicate of a human in a swamp. No evolutionary history, no learning history. It walks, talks, and claims to remember a childhood it never had. Does it have thoughts with content? Strict teleosemantics says no (no history = no function = no content). Our intuition often says yes. This tests whether content is historical or structural.
  3.  **The Retinal Surface (The Distality Problem):** A visual state is caused by a photon hitting the retina, which is caused by light reflecting off a tiger. Does the state represent "retinal stimulation," "light pattern," or "tiger"? Selection favors avoiding tigers, not avoiding retinal stimulations. But the mechanism only detects the stimulation. We need to lock content onto the distal object without magical reference.
  4.  **The Indeterminacy of Selection (The Arbitrariness Problem):** A heart is selected for pumping blood. But it also makes a thumping noise. Both were present during selection. Why is the *function* pumping and not noise-making? Similarly, a neuron might fire for "predator" or "large moving shadow." Selection acts on phenotypes, which are coarse-grained. Content seems fine-grained. How do we get specific content from messy history without arbitrariness?
  5.  **The Unicorn Problem (The Novelty Problem):** I can think about nuclear war or unicorns. Neither has an evolutionary selection history. If content requires a history of successful performance, how do we represent things that have never existed or never impacted survival? A theory that says we can't think about new things is dead on arrival.

  ***

  ### Phase 2: The Desiderata for Adequate Teleosemantics

  Here are the five core requirements. I have distinguished between **Non-Negotiable** (conditions for the very possibility of representation) and **Camp Preferences** (metaphysical commitments where reasonable philosophers may disagree).

  #### 1. The Error Constraint
  *   **Requirement:** The theory must allow for a representational state to be tokened in conditions where its content is false, without reducing the content to a disjunction of all possible tokening conditions.
  *   **Motivation:** The Fly-Detector case. If a theory cannot distinguish between "representing a fly" and "representing a fly-or-pellet," it collapses representation into mere causal correlation. A theory that eliminates error eliminates representation.
  *   **Status:** **Non-Negotiable.** This is the *raison d'être* of teleosemantics. If you solve everything else but fail here, you have a causal theory, not a semantic one.

  #### 2. The Distality Constraint
  *   **Requirement:** The theory must privilege distal objects or properties (the tiger) over proximal mediators (the retinal stimulation) as the content of the representation, based on the explanatory role of the mechanism.
  *   **Motivation:** The Retinal Surface case. Organisms navigate the world, not their own sensory surfaces. If content stops at the sensory interface, perception becomes a closed loop, and action becomes inexplicable.
  *   **Status:** **Non-Negotiable.** While some phenomenal conservatives might argue for proximal content, a naturalized theory aiming to explain behavior and survival must anchor content in the environment the organism is trying to survive in.

  #### 3. The Determinacy Constraint
  *   **Requirement:** The theory must provide a principled basis for selecting *one* specific content from the infinite set of properties correlated with the mechanism during its selection history, avoiding the conclusion that content is arbitrary or radically indeterminate.
  *   **Motivation:** The Arbitrariness/Indeterminacy case. Selection history is messy. A trait correlates with thousands of properties. Without a rule for picking the *relevant* property (e.g., "predator" vs. "moving shadow"), the theory fails to explain why the organism behaves specifically toward predators.
  *   **Status:** **Non-Negotiable.** Indeterminacy is a theoretical vice. If a theory implies that it is equally true that a belief is about "water" as it is about "H2O-or-Twin-Earth-water" (in a single context), it fails to explain specific behavioral outcomes.

  #### 4. The Novelty Constraint
  *   **Requirement:** The theory must account for representational content regarding entities, properties, or states of affairs that did not exist during the selection history of the representing mechanism.
  *   **Motivation:** The Unicorn/Nuclear War case. Human cognition is generative. We combine concepts to form new thoughts. If teleosemantics restricts content only to what was ancestrally selected, it renders most human thought contentless.
  *   **Status:** **Non-Negotiable.** A theory of mind that cannot account for human thought is insufficient for a philosophy of mind. (Note: Some hardline teleosemanticists treat this as a Camp Preference, arguing derived content is parasitic on basic content, but the theory must still explain the derivation).

  #### 5. The Historical Essentialism Constraint
  *   **Requirement:** The theory must decide whether the *actual* history of selection is constitutive of content, or whether a duplicate structure with a different history (Swampman) possesses the same content.
  *   **Motivation:** The Swampman case. This tests whether teleosemantics is a historical theory or a functional-structural theory.
  *   **Status:** **Camp Preference.** This is the fault line.
      *   *Hardline Teleosemantics:* History is non-negotiable. Swampman has no content. (Prioritizes naturalistic grounding).
      *   *Softline/Structuralists:* Current functional role is sufficient. Swampman has content. (Prioritizes intuitive alignment with folk psychology).
      *   *Warning:* You cannot satisfy both the strict definition of teleosemantics (history-based) and the intuition that Swampman thinks. You must choose which bullet to bite.

  ***

  ### Phase 3: The Tensions (Incompatibilities)

  You asked for the conflicts. These are not bugs; they are features of the landscape. You will likely have to sacrifice satisfaction on one desideratum to secure another.

  **Tension A: Historical Essentialism vs. The Swampman Intuition**
  *   **Conflict:** If you enforce **Historical Essentialism** (to keep the theory truly "teleo" and naturalized), you violate the intuition behind **Swampman**. If you accommodate **Swampman** (by saying structure suffices), you drift away from teleosemantics toward functional role semantics, losing the naturalistic grounding of *normativity* (why the state *ought* to correspond to reality).
  *   **Why:** Normativity in teleosemantics comes from *history* (what the thing was *supposed* to do). Without history, you only have *what it does*. "Ought" collapses into "Is."

  **Tension B: Determinacy vs. Evolutionary Reality**
  *   **Conflict:** The **Determinacy Constraint** demands precise content (e.g., "Fly"). The **Evolutionary Reality** (part of the motivation for Arbitrariness) suggests selection is coarse-grained (e.g., "Small moving nutritious thing").
  *   **Why:** To satisfy Determinacy, theories often have to posit very specific "Normal Conditions" that look suspiciously like they were gerrymandered to save the theory. To be honest about Evolutionary Reality, you often have to admit content is vague or disjunctive, violating Determinacy.

  **Tension C: Novelty vs. Historical Grounding**
  *   **Conflict:** The **Novelty Constraint** requires content for things with no history. The core mechanism of Teleosemantics relies on **History** to ground norms.
  *   **Why:** Explaining novelty usually requires a "derived content" strategy (new symbols get meaning from old ones). But if the "old ones" are strictly biological, the gap between "biological function" and "conceptual combination" is massive. Bridging it often requires smuggling in non-teleological rules of inference, which dilutes the purity of the teleosemantic explanation.

  ***

  ### Phase 4: The Knockout Punch

  If I had to bet on which single requirement eliminates the most contenders from the canonical list you are about to read, it is **The Determinacy Constraint**.

  Most popular teleosemantic theories handle Misrepresentation (Requirement 1) reasonably well by invoking "Normal Conditions." They handle Distality (Requirement 2) by appealing to the explanation of behavior. They even have complex stories for Novelty (Requirement 4). However, almost all of them crumble when pressed on *which* specific property was selected. The "Qua Problem" (why was it selected *qua* fly and not *qua* black dot?) remains the technical graveyard for these theories. They either resort to circular appeals (it was selected for representing flies because it represents flies) or they accept a level of indeterminacy that makes the content too vague to do the philosophical work required. If a theory cannot non-arbitrarily distinguish between "predator" and "predator-shaped-shadow" using only selection history, it fails the Determinacy Constraint, and without determinacy, the theory cannot explain specific intentional action.
