answer: |-
  The argument you describe is known in the literature as the **Infinitarian Paralysis** or the **Problem of Infinite Utility**. It was prominently formalized in contemporary ethics by philosophers such as Peter Vallentyne, Frank Arntzenius, and Nick Bostrom.

  While the mathematical difficulty you identify is widely acknowledged, the conclusion that ethical reasoning collapses into triviality is **not** the consensus. Most philosophers working in this area treat the problem as a significant technical constraint requiring theory refinement, rather than a fatal *reductio ad absurdum* of consequentialism.

  Below is a breakdown of what is generally settled among experts in infinite ethics versus what remains genuinely contested, followed by an explanation of why the framework is not typically abandoned.

  ### 1. What is Settled (or Widely Acknowledged)

  There is broad agreement on the logical structure of the problem and the limitations of standard models when applied to infinite contexts.

  *   **Standard Aggregation Fails:** It is mathematically settled that standard additive aggregation (summing utility across all individuals) yields undefined results ($\infty - \infty$) in an infinite universe containing both positive and negative value. If one adopts "Total Utilitarianism" (maximize the sum total of welfare) in a spatially or temporally infinite world, the expected value of almost all actions becomes undefined or identical.
  *   **Empirical Uncertainty:** It is **not** settled that the universe is actually spatially infinite. Current cosmological data suggests the universe is flat within a margin of error, which is consistent with infinity, but does not prove it. However, ethicists generally agree that normative theories should be robust against logical possibilities, even if empirical confirmation is lacking. Therefore, the *possibility* of an infinite universe is sufficient to generate the ethical puzzle.
  *   **Severity of the Challenge:** There is consensus that this is a serious, unresolved problem for classical formulations of consequentialism. It is not dismissed as a mere semantic trick; it exposes a genuine limitation in applying finite mathematical intuition to infinite sets.
  *   **Background Independence:** There is wide agreement that the "infinite background" of value exists independently of any individual agent's actions. If the universe already contains infinite good and infinite bad, an agent's action cannot change the *total* sum, but it can change the *distribution* or the *local* sum.

  ### 2. What is Genuinely Contested

  There is no consensus on how to resolve the paradox. The field is divided among several competing approaches, none of which is universally accepted.

  *   **The Principle of Spatiotemporal Neutrality:**
      *   *View A:* Some argue that morality must be neutral regarding *where* and *when* value occurs. If so, infinite ethics is paralyzing because location shouldn't matter, yet we must distinguish between outcomes.
      *   *View B:* Others argue we must reject strict neutrality. We should care more about value created "here and now" or within our causal light-cone than value created in distant galaxies. This is contested as potentially arbitrary or speciesist.
  *   **Causal vs. Evidential Impact:**
      *   *View A (Causal):* Many propose switching from Evidential Decision Theory to Causal Decision Theory. On this view, you are not responsible for the infinite good that exists independently of you; you are only responsible for the *difference* you causally make. Since your causal reach is finite (limited by the speed of light and your lifespan), your expected utility remains finite.
      *   *View B:* Critics argue that causal decision theory has its own pathologies and that "causal influence" is difficult to define in a deterministic or quantum universe.
  *   **Aggregation Methods:**
      *   *View A (Summation):* Stick to summing welfare but use advanced mathematics (e.g., hyperreal numbers or measure theory) to compare infinities.
      *   *View B (Averaging):* Switch to Average Utilitarianism. However, this creates the "Repugnant Conclusion" in finite cases and has its own undefined behaviors in infinite cases (e.g., adding infinite happy people to an infinite population might not change the average).
      *   *View C (Critical-Level):* Only count welfare above a certain threshold. This avoids some infinite problems but introduces arbitrariness regarding the threshold.
  *   **The "Pareto" Principle in Infinite Contexts:**
      *   There is debate over whether the Pareto principle (if everyone is at least as well off and someone is better off, the outcome is better) holds in infinite settings. Some proofs show that accepting Pareto in infinite contexts leads to contradictions with other intuitive principles (like anonymity or separability).

  ### 3. Why This Is Not Treated as a *Reductio*

  Philosophers generally do not treat this as a proof that consequentialism is ill-defined for several structural and methodological reasons.

  **1. The "Difference-Making" Intuition**
  The strongest argument against the "collapse" conclusion is the robust moral intuition that local actions matter. If you save a life in front of you, it seems morally significant, regardless of whether there are infinite lives being saved elsewhere in the cosmos. Most philosophers prioritize preserving this intuition (that agents can make a moral difference) over preserving the naive mathematical formulation of Total Utilitarianism. Consequently, they modify the theory to account for *marginal* contribution rather than *total* state.

  **2. Theory Refinement vs. Abandonment**
  In the philosophy of science (following Imre Lakatos), a problem is usually treated as a puzzle for a research program rather than a falsification, provided the program can be adjusted to accommodate the anomaly without losing its core explanatory power. Consequentialists argue that the core insight—"consequences matter"—remains valid, even if the method of calculating those consequences needs refinement (e.g., by restricting the domain of aggregation to the causally accessible future).

  **3. Alternative Frameworks Face Similar Issues**
  Deontological and virtue-ethical frameworks are not immune to infinity problems. For example, if there are infinite agents, are there infinite duties? If one violates a duty, is the "badness" of that violation infinite if it occurs in an infinite context? Because competing ethical frameworks also struggle to coherently handle actual infinities, abandoning consequentialism specifically for this reason is seen as solving little.

  **4. Distinguishing "State" from "Change"**
  Most contemporary consequentialists distinguish between the *value of the world* and the *value of the action*. Even if the value of the world is infinite (and thus unrankable), the *change* in value effected by an action may be finite. By focusing on the expected value of the *difference* an action makes (causal impact) rather than the expected value of the resulting *world-state*, the undefined infinities cancel out. While the mathematical rigor of this cancellation is contested, it is the dominant heuristic for avoiding paralysis.

  ### Summary

  *   **Settled:** Standard additive utility theory breaks down in infinite contexts; the universe's physical infinity is empirically unproven but logically possible; the problem is severe for classical Total Utilitarianism.
  *   **Contested:** The correct mathematical tool for comparing infinite values; whether causal reach should limit moral responsibility; whether spatiotemporal location is morally relevant.
  *   **Consensus on Status:** This is viewed as an open technical problem requiring theory modification, not a fatal *reductio*. The prevailing view is that ethical significance attaches to the **marginal difference** an agent makes, which remains finite even if the background universe is infinite.
