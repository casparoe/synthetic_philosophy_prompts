      *   **Specific Requirement:** Provide a "residue report" analyzing the mapping (what fits, what distorts, what doesn't fit).
      *   **Goal:** Determine if the narrative vocabulary illuminates the neuroscience or is just a dressed-up metaphor.
      *   **Tone/Style:** American English, intellectual but accessible to a writer, rigorous.

  2.  **Deconstruct the Neuroscience Debate (Dennett vs. Kinsbourne):**
      *   *Phenomenon:* Color Phi. Two dots (Red at A, Green at B) flashed quickly. Subject sees one dot moving A to B changing color mid-stream.
      *   *The Problem:* How does the brain know to change the color *before* the second dot appears?
      *   *Stalinesque (Kinsbourne's leanings):* The brain waits for all data, constructs the scene, then presents it to consciousness. The "show trial" happens *before* conscious experience. There is a delay.
      *   *Orwellian (Dennett's preference):* The brain presents raw data immediately, but memory is updated later. The "Ministry of Truth" rewrites history *after* conscious experience.
      *   *Dennett's Twist (Multiple Drafts Model):* He argues the distinction is illusory. There is no "Cartesian Theater" where it happens. It's all just competing narratives.
      *   *What's at Stake:* The nature of subjective experience (qualia), the timing of consciousness, the existence of a central observer.

  3.  **Translate to Narrative Craft Vocabulary:**
      *   *Consciousness:* The Reader's experience of the text.
      *   *Neural Processing:* The Writing/Editing process.
      *   *Stalinesque:* Heavy editing *before* publication. The manuscript is perfected before the reader sees a word. The "Draft" is hidden.
      *   *Orwellian:* Serial publication or immediate narration, with retroactive continuity (retcon) applied later. The narrator tells it as it happens, then corrects the record in a footnote or later chapter.
      *   *Color Phi:* A plot hole or continuity error that gets smoothed over.
      *   *Cartesian Theater:* The "Ideal Reader" or the "Final Print."

  4.  **Drafting the Translation (Section by Section):**

      *   *The Setup (Color Phi):* Describe it as a plot sequence. Scene A (Red), Scene B (Green). Reader perceives a smooth transition.
      *   *Stalinesque:* The Author waits until both scenes are written before showing them. The "manuscript" sits in a drawer. The reader only sees the polished version. This implies a delay between event and reading.
      *   *Orwellian:* The Author publishes Chapter 1 immediately. Then, after writing Chapter 2, goes back and edits Chapter 1 to make the transition smooth. The reader *thought* they read it one way, but their memory (or the text itself) is updated.
      *   *Dennett's Move:* There is no "Final Manuscript." There are only drafts. The "reading" is just another layer of drafting.

  5.  **Developing the Residue Report (The Core Analysis):**
      *   *What Maps Cleanly:*
          *   Story time (events) vs. Discourse time (telling).
          *   Unreliable narration (memory revision).
          *   Retconning (Orwellian).
          *   Editing before publication (Stalinesque).
      *   *What Distorts:*
          *   *The Observer:* In fiction, there *must* be a reader. In Dennett's view, there is no central reader in the brain. This is the biggest friction point.
          *   *Intentionality:* Authors edit on purpose. Brains edit via mechanical processes.
          *   *The "Feel":* Narrative implies a coherent voice. Neuroscience suggests fragmented parallel processing.
      *   *What Has No Counterpart:*
          *   *Qualia:* The "redness" of the red dot. Text describes red; it doesn't *generate* the sensation of red in the reader's brain in the same way.
          *   *The "Now":* Narrative time is always past tense (even in present tense). Consciousness feels like an immediate "now."
          *   *Dennett's Dissolution:* The idea that the distinction *itself* is fake. Writers usually believe the distinction between draft and final is real.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I capture Dennett's "Multiple Drafts"?
      *   *Correction:* I need to make sure I don't just say "Orwellian is better." Dennett argues the *question* is wrong. I need to translate that into narrative terms: "The distinction between the first draft and the final draft is meaningless if there is no final archive."
      *   *Check:* Is the tone right?
      *   *Correction:* Keep it respectful of the writer's expertise but firm on the neuroscience limitations.
      *   *Key Insight:* The writer's vocabulary assumes a *product* (the story). The neuroscience (Dennett) suggests there is no *product*, only process. This is the crucial residue.

  7.  **Final Polish (American English & Formatting):**
      *   Ensure terms like "Color Phi," "Stalinesque," "Orwellian" are used correctly.
      *   Structure clearly with headings.
      *   Make the "Residue Report" distinct and punchy.

  8.  **Final Review against constraints:**
