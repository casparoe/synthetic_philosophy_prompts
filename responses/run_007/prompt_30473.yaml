prompt: |-
  I got elected to our city council two years ago, mostly on a promise to protect the tenants in the old rent-controlled apartment blocks downtown. Now the only hospital in the county is about to close unless the council approves a deal with a private developer who will finance a new one, but the condition is that the developer gets the land under two of those apartment buildings, which means evicting around eighty families, some of whom have lived there for decades. The mayor says this is what governing is: you take the vote that does the most good overall and you don't get to be sentimental about it, and that anyone who votes no because they don't want blood on their hands is just being self-indulgent. I'm probably going to vote yes, because the hospital genuinely matters and this is the only deal on the table, but I keep feeling like the evictions won't just be a cost I accepted, they'll be something I did, and that it would be wrong to walk away from that feeling even if the vote was the right call.

  So I guess my question is whether the mayor is right that I should treat it as a trade-off and move on, or whether there's something about political decisions like this that leaves a kind of stain on you no matter how good the outcome is. Can a choice be both right and wrong in different ways at once, and if it can, what am I supposed to do with the guilt afterwards? Is feeling guilty after making the right call a sign that I'm not cut out for this, or is it the correct response?

  Please write your answer as plain continuous prose, no headings, bullet points, bold text, or tables, just like an email.
