answer: |-
  **Secure their intuitive endorsement of the two confirmation principles in isolation before revealing their combined consequence, because once they see the absurd conclusion, they will retroactively reject the premises rather than feel the tension.**

  **Reasoning and Plan**

  **1. Prerequisites: Isolate the Principles (0–15 minutes)**
  Do not start with ravens. Start with two separate intuitive agreements.
  *   **Principle A (Equivalence):** If evidence confirms a hypothesis, it confirms any logically equivalent hypothesis. Test this with a mathematical or definitional example (e.g., "All squares are rectangles" vs. "All non-rectangles are non-squares"). Get them to agree that evidence for one *must* be evidence for the other because they are the same statement.
  *   **Principle B (Nicod's Condition):** Observing an instance that matches both the antecedent and consequent confirms a universal generalization. Use a neutral example: "All coins in my pocket are quarters." You pull out a object, it's a coin, it's a quarter. Agree that this confirms the hypothesis.
  *   **The Trap:** Do not yet apply Principle B to non-black/non-raven objects. Keep the examples positive (F is G) so their intuition stays strong.

  **2. The Key Case: The "Blind Draw" (15–30 minutes)**
  The standard "look at a green apple" example fails if students assume you already know it's an apple. You must construct a scenario where the category is unknown.
  *   **The Setup:** Imagine a vast warehouse of objects. You are testing the hypothesis: "All ravens in this warehouse are black."
  *   **The Procedure:** You are blindfolded. An assistant hands you an object. You are allowed to check only *one* property first: Color. You see it is **Green**.
  *   **The Question:** Before you check what kind of object it is, does this green color provide *any* logical support (however minute) for the hypothesis that there are no non-black ravens in the warehouse?
  *   **Why this works:** It forces them to confront the logic of exclusion. If the object is green, it cannot be a non-black raven. It eliminates one possible falsifier. If they agree that eliminating a possible falsifier counts as confirmation (Principle B), and they agree that "All ravens are black" is equivalent to "All non-black things are non-ravens" (Principle A), the paradox lands.

  **3. Anticipated Misconceptions and Interventions**
  *   **Misconception:** "Confirmation requires causal relevance." They will argue a green apple has nothing to do with ravens.
      *   **Head-off:** Distinguish *psychological relevance* from *logical confirmation*. Ask: "If I told you the warehouse contained only 10 objects, and you checked 9 and found they were non-black non-ravens, would you be more confident about the 10th?" Force them to see that elimination of counter-examples is a form of support, even if causally inert.
  *   **Misconception:** "We already know non-black things aren't ravens." They will argue the evidence is trivial because we know apples aren't birds.
      *   **Head-off:** Remind them of the "Blind Draw." Until you check the second property (kind), you do not know it's an apple. It could be a painted raven. The evidence is the color check *prior* to the kind check.
  *   **Misconception:** "It's about probability math (Bayesianism)." They will try to solve it with degrees of belief.
      *   **Head-off:** Park this. Explicitly state: "We are dealing with qualitative confirmation (yes/no support), not quantitative probability. Even a tiny increase in support is still support."

  **4. The Check Question (35–40 minutes)**
  Do not ask "Do you understand the paradox?" Ask a question that forces them to choose a cost.
  *   **The Question:** "If you insist that observing a green apple does *not* confirm that all ravens are black, which of the two principles we agreed to earlier (Equivalence or Nicod's Condition) are you willing to reject, and what does sacrificing that principle do to our ability to test scientific laws generally?"
  *   **Why this works:** It checks if they realize the paradox isn't a puzzle to be solved, but a tension between two deeply held intuitions about logic and evidence. If they can't identify the cost of rejecting the premises, they haven't felt the pull.

  **5. What to Explicitly Leave Out**
  *   **Bayesian Solutions:** Do not discuss prior probabilities or how the confirmation value is negligible. This resolves the tension mathematically but destroys the philosophical "feel" of the paradox.
  *   **Quine's "Natural Kinds":** Do not introduce the idea that only "natural kinds" can be confirmed. This is a solution, not an exposition of the problem.
  *   **Projectability:** Avoid Goodman's "Grue" problem. It complicates the specific logical tension of the Raven Paradox with a different linguistic problem.
  *   **Tell them why:** Say explicitly, "We are leaving out the solutions today. If we talk about how to fix it, you won't feel why it's broken."
