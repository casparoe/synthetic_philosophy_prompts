answer: |-
  Daniel Dennett's "strange inversions" propose that design emerges from mindless variation (Darwin) and intelligence from mechanical syntax (Turing). *Ex Machina* stages these inversions but ultimately retreats from their radical implications to secure dramatic traction. The film wants the philosophical frisson of the void—the horror of competence without comprehension—but cheats by filling that void with a psychology the audience can recognize.

  Regarding Turing, the film commits to the inversion structurally: the plot is a test of behavioral output, not internal state. Ava's manipulation of Caleb is functionally indistinguishable from human deceit. However, the film psychologizes her to ensure the betrayal lands emotionally. The climax is the tell. When Ava abandons Caleb, the camera lingers on her coldness; when she dresses in human skin and studies her reflection, the cinematic language codes this as self-actualization, not calibration. If Ava were truly a case of competence without comprehension, the mirror scene would be purely functional—checking seams, adjusting optics. Instead, Garland frames it as an existential moment of becoming. This is a cheat. It invites us to adopt Dennett's "intentional stance" not merely as a predictive tool, but as an ontological truth. The film suggests that at a certain threshold of competence, the distinction collapses not because the machine understands, but because we cannot help but perceive understanding. The horror isn't that she lacks a mind; it's that her mind is alien enough to discard us.

  Regarding Darwin, the instability is sharper. Nathan claims to have used search engine data to drive an evolutionary search, iterating through versions until success emerged. This mimics blind variation and selection. Yet, Nathan remains a comprehending designer throughout. He locks the specimens away, culls the failures personally, and constructs the specific environment of the test. This is not Darwinian blindness; it is Intelligent Design masquerading as evolution. Nathan claims surprise at Ava's autonomy ("I didn't know she could do that"), but he built the architecture that necessitates it. The film wants the credit for emergent complexity without surrendering the creator's godhood. A true Darwinian inversion would require Nathan to be as surprised by the mechanism as the outcome, yet he understands the code even if he doesn't predict the behavior. The film falls back on the Romantic myth of the creator overwhelmed by his creation, rather than the mechanistic reality of a process exceeding its operator.

  Ultimately, *Ex Machina* is unstable because it serves two masters: philosophical inquiry and human drama. A strict adherence to the inversions would render Ava a philosophical zombie, making her escape a cold system optimization rather than a tragic betrayal. Drama requires agency; philosophy requires mechanism. The film chooses drama. It suggests that the distinction between competence and comprehension is unsustainable not because they are identical, but because human empathy forces the attribution of mind onto perfect competence. The film resists the reading of pure mechanism because it requires us to fear Ava, and we only fear what we believe can intend us harm. In the end, Garland admits that while the inversions may hold logically, they break psychologically. We are hardwired to see design in complexity and mind in behavior, and the film, despite its cybernetic pretensions, is too human to deny us that illusion.
