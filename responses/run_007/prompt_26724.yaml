answer: |-
  # Workshop Handout: Mapping the Epistemic Akrasia Debate

  **Instructions:** Read the vignette below. Proceed through the decision tree by answering **Yes** or **No** to each question based on your intuition about the case. Your path will locate your theoretical position within the current logical space.

  ### The Vignette: The Sleepy Detective
  Detective Morse has reviewed overwhelming forensic evidence (fingerprints, DNA, video) indicating that the suspect is guilty (**P**). Based on this first-order evidence, she is confident the suspect is guilty. However, just before filing her report, a reliable colleague informs her that she has been awake for 36 hours and that sleep deprivation of this magnitude renders her incapable of correctly weighing complex evidence. Morse accepts her colleague's testimony. She now believes she is impaired (**HOE**).

  Morse finds herself in a state where she believes **P** (the suspect is guilty) but also believes **her total evidence does not support P** (because she is too impaired to trust her assessment of the forensic data).

  ---

  ### The Decision Tree

  **Q1. The Possibility Question**
  In the vignette, is it psychologically possible for Morse to genuinely maintain her belief that the suspect is guilty while simultaneously judging that her evidence does not support that belief?
  *(i.e., Is this a state a human mind can actually occupy, or is it like believing a contradiction?)*
  *   **NO** → Go to **Position A**
  *   **YES** → Go to **Q2**

  **Q2. The Rationality Question**
  If Morse occupies this state (believing **P** while believing her evidence doesn't support **P**), is she necessarily violating a norm of rationality?
  *(i.e., Is this state always irrational, even if she can't help it?)*
  *   **NO** → Go to **Position D**
  *   **YES** → Go to **Q3**

  **Q3. The Defeat Question**
  Does the higher-order evidence (the news of her impairment) *itself* reduce the evidential support the forensic data provides for **P**?
  *(i.e., To become rational, must she lower her confidence in **P** because the evidence no longer supports it, or is the evidence still strong but she is forbidden from trusting it?)*
  *   **YES** → Go to **Position C**
  *   **NO** → Go to **Position B**

  ---

  ### The Positions (Leaves)

  **Position A: Fixed-Point Views (Conceptual Impossibility)**
  *   **Commitment:** It is metaphysically or conceptually impossible to simultaneously believe **P** and believe that one's evidence fails to support **P**.
  *   *Proponents:* Some constitutivist readings (e.g., Wedgwood), certain Moorean accounts.

  **Position B: Pure Enkratic Requirement Views**
  *   **Commitment:** The akratic state is possible but always irrational; rationality requires alignment, but the first-order evidence may still objectively support **P**.
  *   *Proponents:* Traditional Internalists, some Immodesty accounts (e.g., Horowitz).

  **Position C: Conciliationism**
  *   **Commitment:** Higher-order evidence of error acts as a defeater, always requiring a downward adjustment of first-order confidence to restore rationality.
  *   *Proponents:* Evidentialists about HOE (e.g., Christensen, Elga).

  **Position D: Level-Splitting Views**
  *   **Commitment:** First-order and higher-order rationality operate at distinct normative levels, permitting rational akratic combinations.
  *   *Proponents:* Fragmented Rationality accounts (e.g., Lasonen-Aarnio, Worsnip).

  ---

  ### Instructor's Key: Logical Space & Diagnostics

  **1. Overlapping Verdicts (Conciliationism vs. Enkratic Requirement)**
  *   **Flag:** Positions **B** and **C** are not cleanly separated by *practical advice*. Both require the agent to abandon the akratic state (Q2 = Yes).
  *   **Distinction:** They divide on the *explanation*. Position **C** claims the evidence itself changes (defeat); Position **B** claims the structural requirement changes (alignment norm) while evidence remains constant.

  **2. Undefended Combination (The "Irrational Defeat" Gap)**
  *   **Combination:** Q1=Yes, Q2=No, Q3=Yes.
  *   **Diagnosis:** **Incoherent.** This view claims it is *rational* to hold the akratic state (Q2=No) while simultaneously claiming the higher-order evidence *defeats* the first-order support (Q3=Yes). If the evidence is defeated, the first-order belief is unsupported; Level-Splitting (Q2=No) typically relies on the claim that the first-order belief remains well-supported despite the higher-order conflict.

  **3. The "Ought Implies Can" Constraint**
  *   **Combination:** Q1=No, Q2=Yes.
  *   **Diagnosis:** **Incoherent.** If the state is conceptually impossible (Q1=No), it cannot be subject to a rational prohibition (Q2=Yes), as normative requirements presuppose psychological possibility.

  **4. Unexplored Territory (Steadfast Enkratic)**
  *   **Combination:** Q1=Yes, Q2=Yes, Q3=No (with the addendum that one must dismiss the HOE belief).
  *   **Diagnosis:** **Merely Unattractive.** This view forbids akrasia but suggests the agent should restore rationality by ignoring the reliable testimony about impairment rather than lowering confidence in **P**. While logically possible, few defend dismissing reliable HOE as the rational path to alignment.
