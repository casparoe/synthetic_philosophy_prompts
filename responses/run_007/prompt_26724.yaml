prompt: |-
  You are an expert epistemologist specializing in higher-order evidence and the norms governing epistemic self-assessment. Please think carefully before responding.

  I am designing a handout for a graduate epistemology workshop on epistemic akrasia — roughly, the phenomenon of believing some proposition P while simultaneously believing that one's total evidence does not support P. I want a decision tree that classifies the major positions in the debate by what their proponents say about cases, not by which label they prefer.

  Construct the tree as follows:

  First, identify three or four yes/no questions that carve the logical space of possible views. Each question must be a claim on which the actual positions genuinely divide, and it must be phrased so that a workshop participant can answer it after reading a short concrete vignette, without already knowing the theoretical labels. For example, instead of "Do you accept the enkratic requirement?", present a case: "A detective reviews forensic evidence and concludes the suspect is guilty. She then learns she has been awake for 30 hours and that sleep deprivation doubles the error rate on the kind of reasoning she used. Must she now lower her confidence in the suspect's guilt?"

  Second, locate at least the following four positions in the logical space: (a) the view that epistemic akrasia is conceptually impossible — one cannot genuinely believe P while believing one's evidence fails to support P (fixed-point views), (b) the view that akratic states are possible but never rationally permitted (enkratic requirement views), (c) conciliationism, on which higher-order evidence of error always requires some downward adjustment of one's first-order confidence, and (d) level-splitting views, on which first-order and higher-order rationality operate at distinct normative levels and can come apart, permitting rational akratic combinations.

  Third, flag any pair of positions your tree cannot cleanly separate, and note any logically possible combination of answers that no one defends, with a one-sentence diagnosis: is the combination incoherent, merely unattractive, or simply unexplored?

  Each leaf should carry the position's standard name (if it has one) and a single sentence stating its most distinctive commitment. The tree should be usable as a standalone handout.
