  ### Philosophical Groundwork

  Before versifying, I must clarify the architectural commitments of Higher-Order Theories (HOT), specifically the Higher-Order Thought variant championed by philosophers like David Rosenthal.

  1.  **First-Order States:** These are the baseline mental states—perceptions (seeing red), sensations (feeling pain), desires (wanting water). Crucially, HOT posits that these states can exist *unconsciously*. They are functionally sophisticated; they guide behavior and process information, but there is "nothing it is like" to have them unless they are targeted. They are "dark" in the sense of lacking subjective awareness.
  2.  **The Higher-Order State:** Consciousness arises not from the first-order state itself, but from a separate, higher-order mental state that takes the first-order state as its object. I am conscious of the red not because the visual state glows, but because I have a thought *that I am seeing* red.
  3.  **Relational vs. Intrinsic:** This is the core metaphysical claim. First-order theories (like qualia realism) often treat consciousness as an intrinsic property of the experience itself. HOT is deflationary: consciousness is a *relational* property. A state is conscious only in virtue of being represented by another state. There is no added "magic dust" or intrinsic glow.
  4.  **The Regress Problem (Vertigo):** If a higher-order thought (HOT) makes a first-order state conscious, what makes the HOT conscious? If it requires a third-order thought, we face an infinite regress. Most HOT proponents argue the HOT itself remains unconscious (we are not consciously aware of having the HOT, only of the target state). This avoids regress but induces vertigo: the foundation of consciousness is itself unconscious.

  ***

  ### Sonnet: The Meta-Cognitive Scan

  Within the dark machinery of state,
  Perceptions function in a valley deep.
  Discriminations open every gate,
  While cognitive processes fall to sleep.
  Desires ascend to negotiate their fate,
  Yet no subjective secret do they keep.
  Rich processing that does not hesitate,
  Unfelt sensations in the shadows creep.

  Until a higher-order thought is wrought,
  To target now the state beneath the skin.
  No intrinsic glow, though regress looms unsought,
  Just meta-thought drawing the state within.
  Consciousness is relation, not a glow,
  A thought of thought, and nothing more to show.
