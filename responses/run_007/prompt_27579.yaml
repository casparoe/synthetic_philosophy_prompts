answer: |-
  The institutional practice of segregating Newton's physics from his theology is not merely a pedagogical convenience; it is an enactment of a specific philosophy of history and a specific demarcation criterion for knowledge. To reconstruct the implicit theory behind this practice, we must analyze what assumptions allow historians and educators to excise roughly 70% of Newton's writing (the manuscripts on divinity, alchemy, and prophecy) while retaining the *Principia* and *Opticks* as his "real" work.

  ### I. Reconstruction of the Implicit Theory

  The practice rests on a **Whig Historiography of Science** combined with a **Methodological Naturalist Demarcation**.

  **1. Strict Requirements (What the practice *must* presuppose)**
  For the separation to be logically viable, the following conditions must hold:
  *   **Propositional Separability:** It must be possible to distinguish Newton's physical propositions (e.g., $F=ma$) from his theological propositions (e.g., the Son is subordinate to the Father) without rendering the physical propositions unintelligible. The syntax and empirical validation of the physics must be independent of the truth-values of the theology.
  *   **The Criterion of Retrospective Relevance:** A thinker's contribution is defined by its causal lineage to *current* accepted knowledge. Since modern physics does not utilize Newton's Arianism to calculate orbits, that theology is classified as "context" rather than "content." The theory presupposes that the value of an intellectual act is determined by its future uptake in a specific discipline (physics), not by the agent's own intent.
  *   **Causal Inertness (Weak Version):** The practice requires that Newton's theological convictions were not *logically necessary* conditions for his physical discoveries. If the derivation of universal gravitation *required* the premise that "God is one and unitary," then removing the theology would break the logic of the physics. The practice presupposes that the theology was at most a psychological motivator, not a logical premise.

  **2. What Merely "Fits Well" (Contingent Compatibilities)**
  These assumptions often accompany the practice but are not strictly required for it to function:
  *   **The Falsehood of Theology:** The practice does not strictly require Newton's theology to be *false*, only that it is *non-scientific*. However, the presentation fits well with a positivist view that theological statements are cognitively meaningless.
  *   **The Autonomy of Domains (NOMA):** It fits well with the idea that science and religion are "Non-Overlapping Magisteria." However, the practice works even if the domains *do* overlap, provided we decide to only teach one of them.
  *   **The Irrationality of the Remainder:** Textbooks often imply Newton's theology was a lapse in reason. This fits well, but isn't required. One could acknowledge the theology was rational (internally consistent) but still exclude it as outside the scope of a physics curriculum.

  **3. Areas of Underdetermination (Rival Views Licensing the Same Practice)**
  The same textbook presentation can be justified by mutually incompatible philosophical stances:
  *   **Logical Positivism:** Theology is nonsense; physics is sense. We teach the sense.
  *   **Methodological Naturalism:** Theology might be true, but it is not testable by empirical means. Therefore, it belongs to a different category of inquiry.
  *   **Professional Specialization:** A physics department is a trade school for physicists. Whether Newton's theology was true or central is irrelevant to the sociological function of the department, which is to train students in modeling physical systems.
  *   **Secularization Narrative:** The presentation fits the broader cultural narrative that "modernity" equals "secularity." Presenting Newton as a proto-secular figure reinforces the idea that science inevitably leads away from religious dogma, even if Newton himself believed it led toward a purified religion.

  ### II. Evaluation of Coherence

  Is this practice coherent? The answer depends on the goal of the inquiry.

  **1. Pragmatic Coherence (High)**
  If the goal is to train students to solve differential equations and predict planetary motion, the practice is highly coherent. It filters noise from signal. It treats the history of science as a cumulative archive of tools rather than a biography of thinkers.

  **2. Historical and Epistemic Coherence (Low)**
  If the goal is to understand *how* scientific knowledge is generated, the practice is incoherent. It commits the **Intentional Fallacy** in reverse: it interprets the work contrary to the author's explicit intent. Newton did not view himself as doing "physics" in the modern sense; he was doing "Natural Philosophy," which was inherently theological.
  *   **The Motivation Problem:** Newton sought universal laws partly because he believed in a universal, sovereign God who imposed order on chaos. By stripping the theology, we obscure the *heuristic value* of his metaphysical commitments. We make the discovery look like an inevitable algorithmic output rather than a motivated search.
  *   **The Demarcation Problem:** Newton's concept of "absolute space" was arguably theological (the *sensorium* of God). By teaching absolute space as a purely physical concept without its theological grounding, we present a concept Newton held in a way Newton did not hold it.

  **Verdict:** The practice is **instrumentally coherent** but **historically失真 (distorted)**. It creates a "myth of the secular genius" that stabilizes the modern identity of the scientist but falsifies the intellectual history of the Scientific Revolution.

  ### III. Pedagogical Implications of the "Single Project" View

  If we replaced the current presupposition with the view that Newton's physics and theology formed a single intellectual project (as scholars like Richard Westfall, J.E. McGuire, and Rob Iliffe argue), the teaching of Newton would undergo significant structural changes:

  **1. Recontextualizing the *Principia***
  *   **Current:** The *Principia* is presented as the birth of secular mechanics.
  *   **Change:** It would be taught as a theological document. The demonstration of universal gravitation would be framed as an argument against Cartesian vortex theory, which Newton saw as atheistic (because it allowed the universe to run without divine intervention). The stability of the solar system (requiring occasional divine correction) would not be an embarrassment to be explained away by Laplace later, but a central feature of Newton's design.

  **2. The General Scholium as Conclusion, Not Appendix**
  *   **Current:** The famous "I frame no hypotheses" and the praise of the "Pantokrator" are treated as a philosophical footnote.
  *   **Change:** The General Scholium would be taught as the *teleological conclusion* of the *Principia*. The physics proves the existence and attributes of the Governor; the Governor guarantees the validity of the physics. Students would analyze how Newton's definition of God (dominion, eternity, infinity) maps onto his definitions of Space and Time.

  **3. The Corruption Narrative as Parallel Methodology**
  *   **Current:** Newton's view that the Trinity was a 4th-century corruption is mentioned as a biographical quirk.
  *   **Change:** This would be taught alongside his view of the history of science. Newton believed the *prisca sapientia* (ancient wisdom) had been corrupted by Aristotelians and Scholastics, just as true Christianity was corrupted by Athanasius. His scientific method (stripping away hypotheses to find simple truths) would be presented as parallel to his theological method (stripping away church tradition to find original scripture). Both are projects of *restoration*.

  **4. Shift from "Physics" to "Natural Philosophy"**
  *   **Current:** Newton is the first "Physicist."
  *   **Change:** Newton is the last great "Natural Philosopher." This shifts the epistemic authority. It acknowledges that the boundaries between matter, spirit, and text were porous. It forces students to confront the fact that "science" is not a trans-historical category but a specific cultural formation that solidified *after* Newton.

  **5. Addressing the "Rational Core" Fallacy**
  *   **Current:** We extract the math and discard the metaphysics.
  *   **Change:** We examine how metaphysical commitments constrain theory choice. For example, why did Newton reject action-at-a-distance as "absurd" (letter to Bentley) yet use it mathematically? The resolution lies in his theology (God acts as the medium). Teaching this shows students that even "hard" science relies on philosophical commitments that are not themselves empirically provable.

  ### Summary
  The institutional splitting of Newton presupposes a **Whig, demarcationist theory of knowledge** that values retrospective utility over historical intent. It is coherent only if one accepts that the history of science is the history of *truths we still hold*, rather than the history of *inquiries as they were lived*. Adopting the "single project" view would not necessarily invalidate Newton's physics, but it would humanize the scientific enterprise, revealing it not as a machine for generating secular truth, but as a deeply motivated, metaphysical struggle to understand the architecture of Creation.
