      *   *Underdetermination:* Why do we do it?
          *   View A: Positivism (Theology is nonsense).
          *   View B: Whig History (Only what leads to us matters).
          *   View C: Professional Specialization (Physics departments teach physics, not intellectual history).

  4.  **Analyzing Coherence (Task 4):**

      *   Is the practice coherent?
      *   *Argument for Coherence:* It serves a pedagogical purpose. We teach physics to physicists. It filters signal from noise regarding the development of *physical laws*.
      *   *Argument against Coherence:* It distorts historical reality. It misrepresents Newton's *motivation* and *method*. If the theology drove the science (e.g., seeking universal laws because of a unitary God), removing it makes the science seem like it emerged from a vacuum. It creates a "myth of the secular genius."
      *   *Verdict:* It is *pragmatically* coherent for training technicians, but *historically/philosophically* incoherent for understanding the genesis of ideas.

  5.  **Proposing Changes (Task 5):**

      *   If we accept the "Single Project" view:
