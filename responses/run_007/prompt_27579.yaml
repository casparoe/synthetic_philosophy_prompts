      *   *The Institutional Practice:* Textbooks focus on $F=ma$, gravity, calculus. Theology is a footnote, a "quirk," or "alchemy/theology" is boxed off as "non-science."
      *   *The Philosophical/Historical Issue:* This touches on the "Conflict Thesis" (science vs. religion), the "Independence Thesis" (NOMA - Non-Overlapping Magisteria), and Whig history (history as progress toward current truth).
      *   *Key Concept:* "Rational Core vs. Disposable Remainder." This suggests a criterion of demarcation (what counts as science/knowledge).

  3.  **Reconstructing the Implicit Theory (Task 1 & 2):**

      *   *What does the separation require?* It requires a criterion to distinguish "science" from "non-science" (demarcation). It requires that only the "science" part is relevant to the narrative of *scientific progress*.
      *   *Strict Requirements:*
          1.  **Demarcation:** There must be a way to separate propositions into "scientific" (truth-apt, empirical/mathematical) and "non-scientific" (metaphysical, theological, speculative).
          2.  **Relevance/Lineage:** The history of science is a history of *current* scientific truth. Contributions are measured by their causal link to *our* current paradigm.
          3.  **Causal Inertness (Weak):** The theology didn't *necessitate* the physics (even if it motivated it).
      *   *What fits well but isn't strictly required?*
          1.  **Autonomy:** That science and religion *ought* to be separate (NOMA). The practice works even if they *were* integrated, as long as we only care about the scientific output.
