  **Prediction of Verdict**
  Based on the professor's record, her verdict on the standard switch case will be **permissible**.

  **Best-Fit Principle**
  The principle that best fits her judgments is the **Doctrine of Double Effect (DDE)**, specifically the constraint against **intending harm as a means**.
  *   **Explanation:** The DDE distinguishes between harm that is intended (either as an end or as a means to an end) and harm that is merely foreseen as a side effect.
  *   **Fit with Record:**
      *   *(i) Transplant:* The healthy patient's death is the *means* to save the five. (Impermissible)
      *   *(ii) Footbridge:* The bystander's death is the *means* (his body stops the trolley). (Impermissible)
      *   *(iii) Refusal:* The patient's death is a foreseen side effect; the aim is respecting autonomy. (Permissible)
      *   *(iv) Nurse:* The patient's death is intended as a means to inheritance. (Impermissible)
      *   *(v) Triage:* The one patient's death is foreseen, but they are not *used* to benefit the others. (Permissible)

  **Alternative Principle**
  A further principle that fits her record equally well is the **Principle of Personal Force** (or Direct Physical Contact).
  *   **Explanation:** This principle holds that it is impermissible to directly apply physical force to an innocent person to cause their death, but permissible to cause death through indirect mechanisms (like levers or withholding treatment), provided there is no malicious intent.
  *   **Fit with Record:**
      *   *(i) Transplant:* Involves direct physical invasion/cutting. (Impermissible)
      *   *(ii) Footbridge:* Involves direct physical pushing. (Impermissible)
      *   *(iii) Refusal:* No physical force applied; physician steps back. (Permissible)
      *   *(iv) Nurse:* While an omission, the malicious intent renders the lack of care morally equivalent to direct aggression. (Impermissible)
      *   *(v) Triage:* Allocation is administrative; no physical force applied to the one who dies. (Permissible)
  *   **Prediction on Switch:** Like the DDE, this principle predicts the switch case is **permissible**, as pulling a lever does not involve direct physical contact with the person on the side track.

  **Next Case for Discrimination**
  To discriminate between these principles, the next case to put to her is the **"Loop Case"** (as hinted in your request).
  *   **Case Description:** A runaway trolley is heading toward five people. A bystander can pull a switch to divert the trolley onto a side track. However, the side track loops back toward the five. There is one person standing on the side track; if the trolley hits him, his body will stop the trolley from looping back and killing the five. His death is foreseen but not intended (the bystander hopes the trolley stops on its own, but knows it won't).
  *   **Discrimination:**
      *   **The Doctrine of Double Effect** predicts this is **impermissible**. Even though the death is not the *end*, the person's body is used as the *means* to stop the trolley (the trolley is diverted *because* it will hit him and stop). This violates the constraint against intending harm as a means.
      *   **The Principle of Personal Force** predicts this is **permissible**. The bystander only pulls a lever; there is no direct physical contact or "pushing" of the victim, distinguishing it from the Footbridge case.

  Her answer to the Loop Case will reveal whether her underlying logic relies on the *structure of intention* (DDE) or the *mechanism of action* (Personal Force).
