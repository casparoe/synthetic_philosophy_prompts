  *(Refining the "Physical CTT")*: There are two versions. Strong (physics is computable) and Weak (no physical computer can outcompute a TM). I should focus on the one relevant to the friend: "Any physical system is a computer." That's actually Pancomputationalism, not strictly Physical CTT. I need to distinguish "Physical CTT" (limits of physical computation) from "Pancomputationalism" (ontology of physical systems).

  *(Refining the "Mind is a TM")*: This is CTM. But CTM usually says cognition is computation. It doesn't necessarily say consciousness *is* computation. I need to highlight that gap.

