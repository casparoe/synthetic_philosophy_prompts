      *   *Nuance:* Acknowledge that Ava *does* leave Caleb to die. That is the one moment the mask slips. Use that.
      *   *Philosophical References:* Mention Kant (means/ends), Asymmetry of Power, and maybe Bostrom/Yudkowsky (AI alignment) implicitly or explicitly to give it academic weight.
      *   *Tone:* Keep it academic but accessible, suitable for a philosophy student.

