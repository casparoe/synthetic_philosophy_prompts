prompt: |-
  I'm running a reading group for philosophy grad students — they've done a bit of metaethics but haven't read Williams or Korsgaard on this — and next week we're doing the internal vs. external reasons debate. I've got about seventy-five minutes. Don't explain the distinction to me; I need a teaching plan. What ideas have to be laid down first, in what order, before the internal/external contrast even makes sense? What's the single example or case that should carry the session, and what does it need to have (and what must it not have) to work? Which misconceptions should I expect — I'm pretty sure someone's gonna confuse 'internal reason' with 'self-interested reason' or 'reason I'm aware of' — and at exactly what point in the sequence do I head each one off? And what's one question I can ask at the end to check whether they've actually grasped the distinction rather than just memorised a definition? Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** Philosophy grad students (some metaethics background, but new to Williams/Korsgaard on this specific topic).
      *   **Topic:** Internal vs. External Reasons (Williams vs. Critics/Korsgaard).
      *   **Time:** 75 minutes.
      *   **Constraints:** Do *not* explain the distinction to the user (they know it). Need a teaching plan.
      *   **Specific Requirements:**
          *   Prerequisite ideas (order of operations).
          *   Single governing example/case (criteria for success/failure).
          *   Anticipated misconceptions (specifically 'self-interest' and 'awareness') and when to address them.
          *   One final assessment question.
          *   **Language:** British English.

  2.  **Determine the Pedagogical Strategy:**
      *   Grad students don't need hand-holding on basic definitions, but they need to see the *stakes* and the *argumentative structure*.
      *   The session needs to move from the Humean theory of motivation (HTM) to Williams' Internalism, then to the Externalist challenge, and finally to the implications (blame, deliberation).
      *   75 minutes is tight. Need to be disciplined.
      *   *Key Insight:* The distinction only makes sense against a backdrop of *what reasons are for*. Are they explanatory? Normative? Both?

  3.  **Drafting - Section by Section:**

      *   **Prerequisite Ideas (The Foundation):**
          *   Before "Internal/External," they need to understand "Reason for Action."
          *   Need to establish the link between reasons and motivation (Humean Theory of Motivation).
          *   Need to establish the link between reasons and rationality/deliberation.
          *   *Order:* 1. Reasons as explanations of action. 2. The Humean constraint (belief + desire). 3. The Normative claim (what one *ought* to do).
          *   *Why:* Williams' argument rests on the claim that for $R$ to be a reason for $A$ to $\phi$, $R$ must be capable of motivating $A$ (via sound deliberation). Without this, "External Reason" looks like a category error.

      *   **The Governing Example:**
          *   Needs to be robust enough to handle deliberation but simple enough not to get bogged down in empirical details.
          *   *Classic:* The Gin and Petrol case (Williams). It's iconic for a reason.
          *   *Alternative:* The Husband/Wife case (Williams).
          *   *Selection:* The **Gin and Petrol** case is best for the *conceptual* distinction. It isolates the factual belief from the desire.
          *   *Criteria:* Must involve a false belief, a standing desire, and a potential action. Must *not* involve moral disagreement (initially) to avoid conflating external reasons with moral obligations immediately.
          *   *Refinement:* Actually, for grad students, the **Owen Wingrave** case (Williams) or a variation is often better for the *External* challenge because it involves a normative pressure (family duty) vs. lack of motivation. However, Gin/Petrol is cleaner for the *Internal* definition. Let's stick with a modified **Gin and Petrol** for the Internal definition, but introduce a **Moral Duty** case (e.g., "The Reluctant Philanthropist") for the External challenge.
          *   *Decision:* The prompt asks for *one* single example to carry the session. This is harder. It needs to work for both sides.
          *   *Best Candidate:* **The Husband who hurts his wife.** (Williams' own example in 'Internal and External Reasons').
          *   *Why:* It has a subjective motivational set (he doesn't care), a normative claim (he ought to stop), and room for deliberation (could he come to care?).
          *   *Criteria:* Must involve an agent who currently lacks motivation but where we intuitively want to say they have a reason. Must *not* be a case of ignorance of fact (that's internal). Must *not* be a case of irrationality (akrasia).

      *   **Misconceptions & Timing:**
          *   *Misconception 1: Internal = Self-Interest.*
              *   *Fix:* When defining the 'Subjective Motivational Set' (S). Show that S includes commitments, projects, not just desires.
              *   *Timing:* Immediately after introducing Williams' formula.
          *   *Misconception 2: Internal = Conscious/Aware.*
              *   *Fix:* Emphasise the 'sound deliberative route'. Reasons can be internal even if the agent doesn't *know* it yet, provided they *would* be motivated after reasoning.
              *   *Timing:* During the discussion of deliberation.
          *   *Misconception 3: External = Moral Reasons.*
              *   *Fix:* Clarify that Externalists claim *all* reasons can be external, not just moral ones (though moral ones are the battleground).
              *   *Timing:* When introducing the Externalist counter-claim.

      *   **The Final Question:**
          *   Needs to test application, not definition.
          *   Scenario: An agent who *cannot* be motivated even by ideal deliberation. Does she have a reason?
          *   Better: A question about *blame*. If Internalism is true, when is blame appropriate?

  4.  **Refining the Plan (Self-Correction/Review):**
      *   *Time Check:* 75 mins.
      *   0-15: Setup (HTM & Williams' Thesis).
      *   15-35: The Case Study (Internalist analysis).
      *   35-55: The Externalist Challenge (Korsgaard/Nagel).
      *   55-65: Misconceptions & Nuance.
      *   65-75: Assessment & Wrap-up.
      *   *Language:* Ensure British spelling (motivation, programme, realise, etc.) and phrasing.
      *   *Tone:* Professional, academic, directive.

  5.  **Drafting the Content (incorporating British English):**
      *   *Prerequisites:* Humean Theory of Motivation, Subjective Motivational Set (S), Sound Deliberative Route.
      *   *Case:* The 'Oblivious Husband' (based on Williams). He hurts his wife, doesn't care, no factual ignorance.
      *   *Misconceptions:* Address 'Self-Interest' when defining S. Address 'Awareness' when defining Deliberation.
      *   *Final Question:* Focus on the 'ought implies can' aspect or the blame implication. Let's go with the Blame implication as it's the practical upshot.

  6.  **Final Polish:** Check against constraints.
      *   Did I explain the distinction to the user? No.
      *   Is it a teaching plan? Yes.
      *   British English? Yes (e.g., 'programme', 'centre', 'analyse').
      *   Specific misconceptions addressed? Yes.
      *   One example? Yes (The Husband case).

  7.  **Final Review of the "One Example" constraint:**
      *   Williams uses the Husband case to illustrate External Reasons statements being false.
      *   To make it carry the *whole* session, I need to use it to show:
          1.  Why an Externalist says he has a reason.
          2.  Why Williams says he doesn't (yet).
          3.  Whether deliberation could bridge the gap.
      *   This works. It's the central battleground.

  8.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a teaching plan designed for a 75-minute graduate seminar. It assumes familiarity with general metaethical terminology but treats the Williams/Korsgaard debate as new material.

  ### **Session Structure (75 Minutes)**

  **00:00 – 00:15: The Architectural Prerequisites**
  Before the distinction can be intelligible, three concepts must be locked in. Do not move to the Internal/External contrast until these are agreed upon.

  1.  **The Humean Theory of Motivation (HTM):** Establish that action requires both a belief and a desire (or pro-attitude). Without this, Williams' argument that reasons must be capable of motivating loses its force.
  2.  **The Subjective Motivational Set ($S$):** Clarify that for Williams, $S$ is not merely a bag of selfish desires. It includes commitments, projects, and emotional dispositions.
  3.  **The Sound Deliberative Route:** Establish that Internal Reasons are not limited to what motivates the agent *now*, but what *would* motivate them after idealised reasoning (correcting facts, imagining outcomes, etc.).

  *Pedagogical Note:* Write the Williams formula on the board early: *$A$ has a reason to $\phi$ iff $A$ could reach the conclusion to $\phi$ by a sound deliberative route from elements in $S$.*

  **00:15 – 00:45: The Governing Case Study**
  You need one case that is robust enough to sustain pressure from both Internalists and Externalists. Do not use the 'Gin and Petrol' example; it is too easily resolved by factual correction. Use Williams' own **'Oblivious Husband'** case.

  **The Case:**
  > A husband treats his wife with neglect and cruelty. When confronted, he acknowledges the facts (he knows she is hurt) but simply does not care. He has no desire to change, no commitment to marriage as an institution, and no fear of social sanction. He is not irrational in the standard sense (no akrasia); he simply lacks the relevant motivation.

  **Why this case works:**
  *   **It isolates the variable:** It removes factual ignorance (he knows she is hurt) and removes self-interest (he might be happier if he stopped, but doesn't care).
  *   **It tests the limits of deliberation:** The crux of the session is asking: *Is there a sound deliberative route from his current $S$ to treating her better?*
  *   **It forces the Externalist hand:** The Externalist must claim he has a reason to stop *even if* no such route exists. The Internalist must claim that if no route exists, saying he has a reason is merely a blunt instrument of blame, not a truth-apt statement.

  **What the case must NOT have:**
  *   **Do not** make him ignorant of the pain he causes. That turns it into an Internal Reason case via factual correction.
  *   **Do not** make him psychologically incapable of reasoning. We must assume he is rational, just motivationally barren regarding this issue.

  **00:45 – 00:60: The Externalist Challenge & Misconceptions**
  This is the critical window for correcting errors. As you introduce the Externalist counter-claim (e.g., Korsgaard or Nagel), you must intercept specific misconceptions immediately.

  **Misconception 1: 'Internal Reason' = 'Self-Interested Reason'**
  *   **When to head it off:** Immediately after defining the Subjective Motivational Set ($S$) at the 15-minute mark, but reinforce it here.
  *   **The Fix:** Point out that $S$ can contain altruistic commitments. If the husband *did* care about his wife, the reason would be Internal, but not self-interested. The distinction is about the *source* of the normativity (the agent's psychology vs. the world), not the *content* of the reason.
  *   **Script:** "If I am committed to your welfare, my reason to help you is Internal to my set, but it is not a reason of self-interest. Do not conflate 'internal to the agent' with 'beneficial to the agent'."

  **Misconception 2: 'Internal Reason' = 'Reason I am Currently Aware Of'**
  *   **When to head it off:** When discussing the 'Sound Deliberative Route' (around 00:30 and again here).
  *   **The Fix:** Emphasise the counterfactual nature of Williams' claim. An agent can have an Internal Reason they do not know they have, provided they *would* be motivated if they reasoned correctly.
  *   **Script:** "Internalism is not about psychological transparency. I may have an Internal Reason to take a different train route to avoid a delay I don't know about yet. If I knew the facts, I would be motivated to take it. The reason exists now, grounded in my desire to arrive on time, even if I am currently ignorant."

  **Misconception 3: 'External Reason' = 'Moral Reason'**
  *   **When to head it off:** When the Externalist claims the husband has a reason to stop.
  *   **The Fix:** Ensure students understand that Externalists argue *all* reasons can be external, not just moral ones. However, moral reasons are the primary battleground.
  *   **Script:** "The Externalist does not merely say moral reasons exist independently of desire. They say the structure of *any* reason claim can be independent. But for today, focus on whether the moral 'ought' implies a reason in the absence of $S$."

  **00:60 – 00:70: Synthesis and Implications**
  Bring the focus back to the function of reason statements.
  *   **Williams:** To say someone has a reason when they have no motivational route is to speak falsely, or to use 'reason' as a blunt tool of blame.
  *   **Korsgaard/Externalists:** To deny him a reason is to surrender the normativity of morality. We must be able to say he has a reason *to get him to listen*, even if he currently lacks the motive.

  **00:70 – 00:75: The Assessment Question**
  Do not ask them to define the terms. Ask them to apply the distinction to a boundary case that tests the *consequences* of the view.

  **The Question:**
  > "Suppose the Oblivious Husband accepts the Internalist view. He agrees there is no sound deliberative route from his $S$ to treating his wife better. On Williams' account, is it appropriate for his wife to *blame* him? If yes, on what grounds? If no, what happens to our practice of moral criticism?"

  **Why this checks understanding:**
  *   If they say "Yes, blame is appropriate," they must explain how blame works without a reason (Williams suggests it becomes a form of coercion or modification of $S$, not an appeal to reason).
  *   If they say "No, blame is inappropriate," they reveal they grasp the radical scepticism of Williams' Internalism regarding moral obligation.
  *   If they conflate 'reason' with 'obligation', they will stumble here. This forces them to separate *having a reason* from *being subject to moral pressure*.

  ### **Summary of Board Work**
  1.  **Left Column:** The Williams Formula ($A$ has reason $\to$ $S$ + Deliberation).
  2.  **Centre:** The Oblivious Husband Case (Facts vs. Motivation).
  3.  **Right Column:** The Stakes (Explanation of Action vs. Normative Criticism).

  This plan keeps the focus tight on the argumentative structure rather than exegesis, ensuring the grad students engage with the philosophical problem rather than just the history.
