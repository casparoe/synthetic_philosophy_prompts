      *   *The Origin of Desires:* As the user noted, I don't choose my initial impulses. Hunger, fear, attraction happen *to* me. Stoics say we control *assent*, but is assent truly separable from the impulse?
      *   *Psychological Realism:* Is it actually possible to not care about reputation or health? Or is this repression? Is the "inner citadel" a delusion?
      *   *Social/Embedded Self:* We are social creatures. Our identity is constituted by external relations. To say those are "not me" is a metaphysical error.
      *   *The "By Fiat" Charge:* Epictetus defines freedom as internal, so it becomes tautological. "You are free because I define freedom as only the things you can't lose."
