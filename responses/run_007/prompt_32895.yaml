      *   **Specific Objection:** They feel the distinction between what is "up to us" (prohairetic things: judgments, impulses, desires) and what is not (body, reputation, property) relies on a questionable psychology. They argue we don't choose our desires any more than we choose to get sick. They suspect Epictetus is just defining the mind as "free" by fiat.
