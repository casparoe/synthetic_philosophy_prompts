answer: |-
  Yes, this puzzle has a specific and famous name: **The Problem of Old Evidence**.

  It was explicitly formulated by Clark Glymour in his 1980 book *Theory and Evidence*, though the tension was recognized earlier. The Einstein/Mercury case you cited is the canonical example used in almost every discussion of the topic.

  You are correct that this is not merely a semantic quibble; it strikes at the heart of how Bayesianism models scientific learning. Below is the carve-up you asked for: the taxonomy of the problem, the main solution strategies, its relationship to prediction/accommodation, and the nuance regarding uncertain old evidence.

  ---

  ### 1. The Core Formal Block
  To ensure we are on the same page regarding the "why": Standard Bayesianism assumes **Logical Omniscience**. If an agent knows $H$, and $H$ logically entails $E$, the agent must already know $E$ follows from $H$.
  *   If $E$ is already known, $P(E) = 1$.
  *   If $H$ entails $E$, $P(E|H) = 1$.
  *   Confirmation is often measured by the likelihood ratio $P(E|H) / P(E)$ or the difference $P(H|E) - P(H)$.
  *   If $P(E) = 1$, then $P(H|E) = P(H)$. The posterior equals the prior. **Confirmation is zero.**

  The problem is that scientific practice clearly treats the *explanation* of old evidence as confirmatory. Einstein didn't just "save the phenomena"; he gained credibility because GR *could* derive the Mercury anomaly where Newtonian mechanics failed.

  ### 2. The Main Moves to Dissolve It
  Philosophers of science have divided the solutions into three or four main camps.

  #### A. The Counterfactual Strategy (Howson, Glymour)
  This approach suggests we are asking the wrong question. We shouldn't ask, "Does $E$ confirm $H$ given what we know *now*?" Instead, we should ask, "Would $E$ have confirmed $H$ if we *didn't* know $E$?"
  *   **The Move:** Construct a counterfactual probability function $P^*$ where $P^*(E) < 1$. Calculate confirmation using $P^*$.
  *   **The Cost:** It makes confirmation ahistorical and subjective. It relies on constructing a fictional epistemic state ("What would I believe if I were ignorant?"). Critics argue this severs the link between confirmation and actual belief updating.

  #### B. The Logical Learning Strategy (Garber)
  This is arguably the most influential technical solution, proposed by Daniel Garber (1983).
  *   **The Move:** We don't learn $E$ (we already know it). We learn the **logical relation** between $H$ and $E$. The new evidence is not $E$, but the proposition "$H$ entails $E$" (let's call it $H \vdash E$).
  *   **The Mechanism:** We relax the Logical Omniscience assumption. We allow the agent to be uncertain about the logical consequences of their own theories. When Einstein realized GR $\vdash$ Mercury_Anomaly, he conditionalized on that logical fact, not on the anomaly itself.
  *   **The Cost:** It requires a non-standard Bayesian framework that allows probabilities to be assigned to logical relations (which are usually tautologies with probability 1). It complicates the formalism significantly.

  #### C. The Temporal / Indexical Strategy
  This approach focuses on the timing of the probability assignment.
  *   **The Move:** Compare the prior probability of $H$ at time $t_1$ (before $H$ was formulated) with the posterior at $t_2$.
  *   **The Mechanism:** At $t_1$, $H$ didn't exist, so it had no probability. When $H$ is introduced at $t_2$, it is introduced *because* it explains $E$. The "confirmation" is actually a constraint on the **prior** assignment of $H$. We assign $H$ a higher prior *because* it explains old $E$.
  *   **The Cost:** This shifts the problem from *updating* to *prior assignment*. It doesn't explain how $H$ is confirmed by $E$ dynamically; it just says $H$ starts with a boost. Some argue this dissolves the problem by changing the subject.

  #### D. Denying $P(E) = 1$ (The Fallibilist Move)
  *   **The Move:** Simply assert that $P(E)$ is never truly 1. Even well-established facts have some uncertainty (measurement error, theory-ladenness of observation).
  *   **The Cost:** This feels like cheating in the Mercury case. The anomaly wasn't just "highly probable"; it was a calculated astronomical fact treated as certain for the sake of the theory. If $P(E) = 0.999$, the confirmation is mathematically non-zero but vanishingly small, which still doesn't match the *strong* boost GR received.

  ---

  ### 3. Is it just Prediction vs. Accommodation?
  It is closely related, but **not identical**.

  *   **Prediction vs. Accommodation** is a debate about the **heuristic process** of theory construction. Does a theory gain more merit if it predicts novel data (prediction) versus if it is constructed to fit existing data (accommodation)?
  *   **The Problem of Old Evidence** is a **formal paradox** within Bayesian updating.

  **The Connection:**
  The Old Evidence problem is the *formal Bayesian explanation* for why accommodation is problematic.
  1.  If you accommodate, you are fitting $H$ to $E$ where $P(E) \approx 1$.
  2.  Bayesian math says this yields little confirmation.
  3.  Therefore, Bayesians have a formal reason to prefer prediction (where $P(E) < 1$).

  **The Distinction:**
  You can have Old Evidence without Accommodation. Imagine $E$ is known, and someone proposes $H$ independently (not tweaked to fit $E$), and it turns out $H$ explains $E$.
  *   **Accommodation worry:** "You tweaked the parameters to fit $E$."
  *   **Old Evidence worry:** "Everyone already knew $E$, so $P(E)=1$."

  The Old Evidence problem is deeper because it applies even to "virtuous accommodation" (where $H$ wasn't gerrymandered). Even if Einstein hadn't tweaked GR to fit Mercury, the fact that Mercury was *already known* creates the $P(E)=1$ block. So, the Old Evidence problem is a distinct technical hurdle that underpins the broader prediction/accommodation debate.

  ---

  ### 4. What about Old Evidence where $P(E) < 1$?
  This is a crucial nuance. You asked: *How exactly is it related to cases where evidence is old but not certain?*

  This is sometimes called the **Problem of Nearly-Old Evidence**.

  If $P(E) = 0.9$ (known, but not certain), the formal block disappears.
  $$P(H|E) = \frac{P(E|H)P(H)}{P(E)}$$
  If $P(E|H) = 1$ and $P(E) = 0.9$, the likelihood ratio is $1/0.9 = 1.11$. You get confirmation.

  **However, the intuitive mismatch remains.**
  In scientific practice, explaining a well-established fact (say, $P(E) = 0.95$) often provides a *massive* boost to a theory. But the Bayesian math says the boost is tiny (likelihood ratio $\approx 1.05$).
  *   **The Issue:** The confirmatory power in Bayesianism is inversely proportional to the prior probability of the evidence. As $P(E)$ approaches 1, the confirmatory power approaches 0.
  *   **The Implication:** This suggests that the "surprise" value of evidence is the only engine of confirmation in standard Bayesianism. If the evidence isn't surprising (because it's old), it can't drive belief change significantly.

  **How solutions handle this:**
  *   **Garber's Solution** works best here. Whether $P(E)$ is 1 or 0.95, learning the *entailment* ($H \vdash E$) can still be surprising. We might know $E$ is likely, but we didn't know $H$ was the *reason* for $E$. This preserves the confirmatory boost even if $P(E)$ is high.
  *   **Counterfactual Solution** also works: We imagine a world where $P(E)$ was lower, calculate the boost, and import it.

  ### Summary of the Landscape
  1.  **Name:** The Problem of Old Evidence (Glymour, 1980).
  2.  **Root Cause:** The assumption of Logical Omniscience + Conditionalization on $E$ when $P(E)=1$.
  3.  **Main Solutions:**
      *   *Counterfactual:* Pretend we didn't know $E$.
      *   *Garber-style:* Conditionalize on the logical link ($H \vdash E$), not $E$.
      *   *Prior Constraint:* Assign $H$ a high prior because it explains $E$.
  4.  **Relation to Prediction:** Old Evidence is the formal mechanism that makes Accommodation look weak in Bayesian terms, but it is a distinct logical paradox.
  5.  **Relation to $P(E) < 1$:** The problem scales. As $P(E)$ gets higher, confirmation gets lower. This implies standard Bayesianism struggles to account for the value of *unification* or *explanatory depth* regarding established facts, unless you adopt a Garber-style modification.

  Currently, the **Garber (Logical Learning)** approach is the most respected technical fix in formal epistemology, though it requires accepting that agents can be uncertain about logical truths. The **Counterfactual** approach is more common in general philosophy of science because it is conceptually simpler, even if formally messier.
