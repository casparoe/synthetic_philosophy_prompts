          *   *Weakness:* Doesn't solve the internalist worry about access.

      *   *Objection 4 (Sense-Datum - Simplicity):*
          *   *Reply:* Ontological parsimony vs. explanatory power. Sense-data create a veil.
          *   *Weakness:* Old school arguments might resonate if the room is tired of disjunctivist complexity.

      *   *Objection 5 (The Nightmare - Causal/Neural Supervenience):* If the brain state is identical, how is the mental state fundamentally different?
