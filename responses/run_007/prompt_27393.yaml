  3.  **Analyze the Specific Cases (Speckled Hen & Müller-Lyer):**
      *   **Speckled Hen:** Traditionally a problem for *acquaintance* theories (how can I be acquainted with 48 speckles if I can't judge there are 48?). For Disjunctivism/Naive Realism: How can the world determine the experience if the experience outstrips my conceptual grasp? Representationalists use this to argue for non-conceptual content.
      *   **Müller-Lyer:** The "cognitive penetrability" or "modularity" issue. The lines *look* unequal even when known to be equal. Representationalists say the visual content is fixed by modules. Disjunctivists need to explain why the "bad" case (illusion) doesn't infect the "good" case's account of phenomenology.

