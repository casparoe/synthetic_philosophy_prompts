answer: |-
  1. How to take the quiz

  You don't need a math degree to have an opinion on how voting works. This quiz isn't about testing your knowledge of Arrow's theorem; it's about figuring out what you think the theorem *means* for democracy. Read each scenario and pick the answer that feels most right. There are no trick questions, just trade-offs. Tally your points to see which philosophical camp you actually belong to.

  2. The cases

  1. **The Spoiler:** In a close race, Candidate A and Candidate B share similar views. Candidate C enters, splitting A's vote, and C wins. Voters are angry. What happened?
     *   The system failed to capture true will; we need better counting.
     *   Voters failed to coordinate; they should have united behind A.
     *   Winners win; simplicity matters more than perfect fairness.

  2. **The Cycle:** Three voters prefer A>B, B>C, and C>A. There is no majority winner. What should the group do?
     *   Admit there is no single "will of the people" here.
     *   Pick one arbitrarily; someone has to decide eventually.
     *   Keep voting until the preferences shift or someone drops out.

  3. **The Ghost Candidate:** Candidate X is losing to Y. A third candidate Z enters, has no chance of winning, but changes the scoring so X beats Y. Is this okay?
     *   No, losing candidates shouldn't change the winner between others.
     *   Yes, Z's presence gave us new information about the field.
     *   It shows we shouldn't be using scoring methods like this.

  4. **The Agenda:** The chairperson chooses the order of votes. By changing the order, she ensures her preferred policy wins every time. Is this illegitimate?
     *   Yes, the outcome depends on power, not preference.
     *   No, someone always sets the agenda; that's just politics.
     *   Yes, we need rules that make the order irrelevant.

  5. **The Intensity:** Five voters slightly prefer Policy A. One voter desperately needs Policy B to survive. The majority picks A. Was this fair?
     *   Yes, one person shouldn't veto the majority's mild preference.
     *   No, we need a way to measure how much people care.
     *   Maybe, but they should have discussed why the one cares.

  6. **The Spite:** A voter prefers Policy A but votes for Policy B because they know A will cause a backlash that hurts their side later. What should they do?
     *   Vote for A; honesty is the only democratic duty.
     *   Vote for B; outcomes matter more than honest expression.
     *   Their preference is flawed; they should want A regardless.

  7. **The Extremes:** Voters want either zero funding or maximum funding, with no middle ground. The result flips wildly with each new voter. What's the problem?
     *   The preferences are too polarized; we need common ground.
     *   The problem is the voting rule, not the people.
     *   This proves majority rule is unstable without constraints.

  8. **The Score:** You ask voters to rank candidates. They say, "I love A, hate B, and don't care about C." The ranking hides this. What do you do?
     *   Rankings are enough; intensity is too hard to measure.
     *   Let them score candidates; we need that extra data.
     *   If they don't care about C, C shouldn't be running.

  3. Scoring key

  Tally which option you selected most often across the eight questions. Each option corresponds to a specific philosophical position on social choice. You don't need a perfect majority; just find your highest score. If you tie between two, you likely inhabit the overlap between those schools of thought. There are no wrong answers, only different trade-offs regarding what democracy requires.

  **Question 1:** Option 1 = Rule Breaker, Option 2 = Preference Shaper, Option 3 = Agenda Realist
  **Question 2:** Option 1 = Boundary Setter, Option 2 = Agenda Realist, Option 3 = Cycle Tolerant
  **Question 3:** Option 1 = Boundary Setter, Option 2 = Cardinal Voter, Option 3 = Rule Breaker
  **Question 4:** Option 1 = Cycle Tolerant, Option 2 = Agenda Realist, Option 3 = Preference Shaper
  **Question 5:** Option 1 = Cycle Tolerant, Option 2 = Cardinal Voter, Option 3 = Preference Shaper
  **Question 6:** Option 1 = Preference Shaper, Option 2 = Cardinal Voter, Option 3 = Boundary Setter
  **Question 7:** Option 1 = Preference Shaper, Option 2 = Rule Breaker, Option 3 = Cycle Tolerant
  **Question 8:** Option 1 = Cycle Tolerant, Option 2 = Cardinal Voter, Option 3 = Agenda Realist

  **Positions:** Tally your results. If you scored highest in **Rule Breaker**, you prioritize system flexibility over consistency. **Boundary Setter** means you think preferences must be constrained. **Cycle Tolerant** means you accept majority instability. **Cardinal Voter** means you want intensity measured. **Preference Shaper** means you value deliberation. **Agenda Realist** means you accept power dynamics.

  4. The positions

  **The Boundary Setter (Domain Restrictor)**
  You believe Arrow's theorem only breaks down because real-world preferences are usually structured nicely, like being single-peaked. If everyone agrees on a political spectrum, majority rule works fine. The math only fails when preferences are chaotic or extreme. Your awkward commitment is that some valid preferences must be excluded or smoothed out before voting begins to ensure stability.

  **The Rule Breaker (IIA-Dropper)**
  You think Independence of Irrelevant Alternatives is too strict a requirement for real democracy. Methods like Borda or Score Voting allow irrelevant candidates to change outcomes, and you are fine with that trade-off. You prioritize finding a consensus winner over maintaining rigid consistency. Your awkward commitment is accepting that adding a loser can change the winner between two front-runners.

  **The Cycle Tolerant (Cycle-Embracer)**
  You believe majority rule is the only legitimate standard, even if it produces cycles or instability. If the group cycles between A, B, and C, that just means the group is divided, not that the system failed. You prioritize political legitimacy over mathematical consistency. Your awkward commitment is accepting that sometimes there is literally no stable democratic outcome possible.

  **The Cardinal Voter (Information Enlarger)**
  You argue Arrow's theorem fails because it ignores intensity. Rankings hide how much voters care, forcing strong minorities to lose to mild majorities. You want voting systems that measure strength of preference, like score voting or markets. Your awkward commitment is that comparing how much different people love candidates is theoretically impossible but practically necessary.

  **The Preference Shaper (Deliberative Transformer)**
  You think the problem isn't aggregation, but the preferences themselves. Democracy should transform selfish wants into public-minded judgments before voting occurs. If voters deliberate enough, cycles and spoilers disappear naturally. Your awkward commitment is that voting is secondary to conversation, and some outcomes are invalid if preferences weren't properly formed beforehand.

  **The Agenda Realist (Agenda-Power Realist)**
  You believe someone always controls the agenda, tie-breaking, or rules, so pretending otherwise is naive. Arrow proves power is unavoidable, not that democracy is impossible. We should focus on who holds that power, not eliminating it. Your awkward commitment is admitting that democratic outcomes are always partially determined by unelected procedural powers.

  5. Blind spots

  This quiz struggles to separate the **Cycle Tolerant** from the **Agenda Realist**. Both accept instability, but one sees it as a feature of majority will, while the other sees it as evidence of hidden power. You might score high on both if you think cycles happen but don't matter. Additionally, the **Boundary Setter** and **Preference Shaper** blur together; both want to constrain inputs, one via math, the other via talk. Finally, nobody typically scores high on **Rule Breaker** and **Boundary Setter** simultaneously; wanting to break consistency rules while also restricting preferences is an incoherent mix of flexibility and control.
