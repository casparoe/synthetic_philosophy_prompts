answer: |-
  The rotor wash hammered the surface of the Atlantic, turning the black water into a churning field of white noise. Elena hung in the cable harness, fifty feet below the *Jayhawk*, suspended between the sky and the drowning dark. The storm was a physical weight, pressing against her helmet, screaming in her ears.

  Below her, the sea offered two distinct hells.

  To her left, barely ten yards away, was the reef. Clinging to a jagged spur of rock was a single man. He was older, wearing oilskins, his face pale and upturned in the strobe light of the chopper. He was close. She could see the terror in his eyes, specific and individual.

  To her right, further out in the swell, was a dinghy. It was listing heavily, half-swamped. She couldn't see faces, just shapes huddled together. Five of them. The pilot's voice crackled in her earpiece, flat and procedural.

  "Rescue One, prioritize the vessel. I count five souls on the dinghy. The single on the rock is... secondary. Fuel is critical. We make one lift. Maximize survivors."

  *Maximize.* The word hung in the static. It was the arithmetic of the rescue manual. Five is greater than one. Therefore, the five command the rescue. It was a logic so clean it felt like geometry, untouched by the salt spray.

  Elena looked at the old man on the rock. He raised a hand, not waving, just reaching.

  If she went to the dinghy, the math worked. Five lives purchased at the cost of one. It was the choice the world expected. It was the choice that would look right on the incident report. But as she hovered there, swinging in the gale, the equation began to feel like a betrayal.

  The problem wasn't that she didn't care about the five. It was that the math asked her to treat the old man as if his claim on her was smaller. One-fifth the weight. One-fifth the value.

  *But he isn't one-fifth of a person,* Elena thought, the cold biting through her suit. *He is a whole world.*

  Taurek's ghost seemed to whisper in the rotor noise. There is no "social entity" that suffers the loss of five. There is only Arthur on the rock, who will lose his life. And there are the five in the boat, each of whom will lose *their* life. Arthur's loss is total. For him, it is 100% of his existence. For the woman in the dinghy, her loss is also 100% of her existence.

  Where is the scale that weighs five total losses against one total loss? The scale exists only in the abstract. In the water, there is only the singular, absolute finality of death.

  "Rescue One, confirm target," the pilot barked. "Heading to the dinghy."

  "Wait," Elena said. Her voice was steady, surprising her.

  "If we go for the rock, we leave five to die, Elena. That's on you."

  "If I go for the boat, I leave him to die. That's on me too."

  "That's not the same thing."

  "Isn't it?" Elena watched the old man. If she went to the boat, she wasn't just 'saving more.' She was actively abandoning *him*. She was using him. She was treating his life as a resource to be spent to balance the ledger of the greater good. But he hadn't consented to be the unit of cost.

  To say the numbers count is to say that if enough people are in danger, any single individual can be rightfully sacrificed. It turns morality into a spreadsheet. But morality, Elena felt in her bones, was about the relationship between the rescuer and the rescued. It was a promise made eye-to-eye.

  She looked at the rock. She looked at the boat.

  If she chose the boat because of the numbers, she was saying that Arthur's plea mattered less. But his plea was just as loud. His fear was just as deep. The fact that there were others suffering didn't diminish the reality of his suffering. Pain doesn't aggregate. You don't feel five people's drowning; you feel your own.

  "I can't weigh them," Elena said into the mic. "There's no common currency here."

  "Then flip a coin," the pilot snapped, frustration bleeding through. "Just don't stand there."

  A coin flip. The randomness honored the equality of the claims. It admitted that she had no right to decide whose life was worth more. It acknowledged that while she could not save everyone, she had no obligation to let the arithmetic of the crowd silence the individual standing right in front of her.

  The cable swayed. The window was closing. The sea was rising.

  If she went to the five, she would be a hero who followed protocol. If she went to the one, she would be a rogue who let four extra people die. But if she went to the one, she would be honoring the truth that Arthur was not a fraction. He was a man.

  The wind howled, demanding an answer. The logic of the many was heavy, seductive, and clean. It offered the comfort of a clear conscience derived from statistics. But the logic of the individual was jagged, difficult, and human. It demanded she look Arthur in the eye and acknowledge that his life was not a variable to be solved.

  Elena unclipped the safety lock. She didn't reach for a coin. She didn't need to. The presence of the man on the rock was immediate, while the five were a concept. To ignore the immediate for the abstract felt like a different kind of murder.

  "Taking the rock," she said.

  "Elena, don't—"

  She signaled the winch. As she descended toward the old man, toward the single pair of eyes locking onto hers, she felt the weight of the four she was leaving behind. She felt it fully. She didn't dismiss it. But she refused to let their number cancel out his name.

  The water rushed up to meet them. The math was left in the sky. Down here, there was only one.
