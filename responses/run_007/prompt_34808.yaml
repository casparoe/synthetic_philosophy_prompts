answer: |-
  Your intuition is well-founded. As a philosopher, you are correctly sensing a gap between the descriptive premises and the normative conclusion. However, to give you the precise analytical tools you need for your committee work, we must distinguish between a formal logical error and a substantive philosophical error.

  Here is an analysis of the argument's structure, the conditions under which such inferences are valid, and the precise characterization of the mistake your colleague is making.

  ### 1. The Logical Structure: The Suppressed Premise

  Strictly speaking, your colleague's argument is **logically invalid** as stated. You cannot derive a normative conclusion ("The university *ought* to eliminate the requirement") solely from descriptive premises ("Students *find* this burdensome" and "Students *do not enroll* when optional"). This is the classic Humean observation that one cannot derive an "ought" from an "is."

  However, in practical reasoning, arguments often rely on **suppressed normative premises**. If we reconstruct your colleague's argument to make it logically valid, it looks like this:

  *   **Premise 1 (Descriptive):** Students reveal through surveys and behavior that they do not value foreign language requirements.
  *   **Premise 2 (Normative/Suppressed):** The university ought to structure its curriculum to align with what students currently value (or to minimize what they find burdensome).
  *   **Conclusion:** Therefore, the university ought to eliminate the foreign language requirement.

  Once Premise 2 is made explicit, the argument is logically valid. The problem is not the logic; it is the **soundness** of Premise 2. Your colleague is treating a highly controversial normative claim as if it were a self-evident fact derived from the data.

  ### 2. When Is the Move from "Is" to "Ought" Legitimate?

  You asked whether there are circumstances under which one can validly move from facts about preferences to conclusions about institutional obligations. The answer is **yes**, but only under specific teleological conditions.

  The inference from "X prefers Y" to "Institution I ought to provide Y" is legitimate only if the **primary telos (purpose)** of Institution I is the satisfaction of X's preferences.

  *   **The Commercial Model:** If the institution is a restaurant, the move is valid. If customers stop ordering a dish (descriptive), the restaurant ought to remove it (normative), because the restaurant's purpose is to satisfy customer taste.
  *   **The Democratic Model:** If the institution is a representative legislature, the move is partially valid. If constituents overwhelmingly prefer a policy, the representative ought to support it, because the legitimacy of the office derives from representing those preferences.

  In these cases, the "suppressed premise" (that the institution ought to satisfy preferences) is true by definition of the institution's role.

  ### 3. Why the Move Fails in the University Context

  The error in your colleague's argument arises because a university is not primarily a commercial vendor or a direct democracy. It is a **teleological institution with an independent mission.**

  The traditional philosophical defense of the university (from Newman to Hutchins to Bok) posits that the university's obligation is not to satisfy student *preferences*, but to promote student *flourishing* or *educational development*. These are objective goods that may not align with subjective preferences.

  Consider the analogy of a **hospital**:
  *   **Descriptive:** Patients often prefer immediate pain relief over long-term rehabilitation exercises, which are painful and burdensome.
  *   **Normative Conclusion:** Therefore, doctors ought to stop prescribing rehabilitation.
  *   **Verdict:** This is clearly unsound. The doctor's obligation is to the patient's *health*, not the patient's immediate *comfort*.

  Your colleague's argument fails because it assumes a **Consumer Sovereignty Model** of higher education without arguing for it. It assumes that students are customers purchasing a credential, rather than novices being initiated into a community of inquiry. If the purpose of a language requirement is to ensure cognitive flexibility, cultural literacy, or engagement with primary sources, then student dissatisfaction is irrelevant to the *justification* of the requirement, even if it is relevant to the *pedagogy*.

  ### 4. Characterizing the Error

  Since the argument is not formally invalid (once the premise is added), labeling it requires precision. There are three ways to characterize the mistake, ranging from logical to substantive.

  **A. Begging the Question (Petitio Principii)**
  This is the most precise logical characterization. Your colleague is assuming the conclusion within the premises. By arguing that the university "ought to respect revealed preferences," he is assuming that the university's only legitimate obligation is to respect those preferences. He has not offered an argument for *why* the university's mission should be defined by student comfort; he simply asserts it as the bridge to his conclusion.

  **B. The Naturalistic Fallacy (in a loose sense)**
  While G.E. Moore's specific definition involves defining "good" in natural terms, the broader spirit of the fallacy applies here. Your colleague is attempting to derive a value (the policy ought to change) directly from a fact (students dislike the policy) without a mediating value judgment. He treats "being preferred by students" as synonymous with "being educationally valuable," which is a category error.

  **C. Teleological Confusion**
  This is the most substantive philosophical characterization. Your colleague has misidentified the *end* (telos) of the institution. He treats the university as an instrument for student satisfaction, whereas the committee likely views the university as an instrument for intellectual formation. When the *telos* is disputed, one cannot settle the dispute by appealing to data that only makes sense under one specific conception of the *telos*.

  ### 5. Summary for Committee Deliberation

  To answer your specific questions directly:

  1.  **Is the move from descriptive to normative always illegitimate?**
      No. It is legitimate when the institution's defined purpose is the satisfaction of the preferences in question (e.g., a retail business).
  2.  **What principle distinguishes legitimate from illegitimate cases?**
      The **Principle of Teleological Alignment**. The inference is valid only if the satisfaction of the observed preference is constitutive of the institution's mission.
  3.  **What is the most precise way to characterize the mistake?**
      The argument commits the fallacy of **Begging the Question** regarding the mission of the university. It suppresses a normative premise ("The university's primary obligation is to minimize student burden/maximize preference satisfaction") that is as controversial as the conclusion itself.

  **Recommendation:**
  In your meeting, you might frame your objection this way: *"The data regarding student preference is accurate, but it only dictates policy if we agree that the university's primary obligation is to satisfy student preferences. If we believe our obligation is to ensure a specific type of education—one that students may not initially value or understand—then their revealed preferences are not decisive. By arguing we must follow the data, you are assuming the conclusion that the university is a service provider rather than an educational authority. We need to debate that mission before we debate the requirement."*

  This shifts the debate from the data (which is not in dispute) to the philosophy of education (which is the actual point of contention).
