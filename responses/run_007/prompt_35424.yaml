prompt: |-
  Okay so I've been spiraling about this for a few days and I need someone to actually put numbers on it instead of just vibes. My partner and I are both software engineers, and we've been following the whole-brain emulation stuff — not like we work on it, just reading papers and arguing at dinner. The thing we keep coming back to is: if someone actually pulls it off, scans a human brain at whatever the necessary resolution turns out to be, and runs the whole thing on a classical digital computer, would the resulting system be conscious? Not "would it act conscious" or "would it deserve rights as a precaution" — I mean, would there be something it's like to be that emulation, in the same basic way there's something it's like to be you right now?

  I want your honest credence on this, a number. But I mostly want the decomposition, because I think the number alone is kind of useless without knowing where it's fragile. The way I see it, the question breaks into at least: (a) whether the correct theory of consciousness is broadly computational/functional — that what matters for sentience is the right kind of information processing, not the specific physical stuff doing it; (b) conditional on computationalism being right, whether a whole-brain emulation at plausible scan resolutions actually preserves whatever causal or informational features the theory says are necessary (like, maybe you need molecular-level detail and we can't get that, or maybe spike-rate models are enough); (c) whether classical digital computation can even in principle implement the relevant causal structure — some people think you need analog or quantum or continuous dynamics; (d) whether there's some further fact about the unity of the subject or the binding problem that a digital emulation would fail even if it passes (a)-(c). Give me a probability for each, explain briefly how you got it, show how they combine, and then tell me which one your overall credence is most sensitive to. Like, if god descended and told you the answer to one of those sub-questions, which one would shift your number the most?

  Also my partner thinks the whole thing is moot because emulations would have totally different temporal dynamics — running slower or faster or in chunks — and that alone breaks consciousness. So if you think that matters, fold it in somewhere.
