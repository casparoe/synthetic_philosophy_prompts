answer: |-
  You have put your finger on one of the most persistent structural flaws in contemporary metaphysics and philosophy of science. Your intuition is correct: these are symmetrical failures of **inter-level explanation**.

  Both moves are ways of avoiding the hard work of explaining *how* organization creates causality.

  Here is the breakdown of the terminology, the symmetry, and where the legitimate boundary lies.

  ### 1. Naming Move A: "Greedy Reductionism"
  You are right that Dennett's **"Greedy Reductionism"** is the standard term. Gilbert Ryle called it **"Nothing-Buttery"** (e.g., "A marriage is nothing but a piece of paper").

  *   **The Error:** It confuses *constitution* with *identity*. Just because a statue is constituted by clay does not mean the statue is *identical* to the clay. The statue has properties (aesthetic value, historical significance) that the clay does not.
  *   **The Consequence:** It eliminates the phenomenon it claims to explain. If consciousness is "nothing but" neurons, then the *experience* of consciousness is an illusion. But who is being illuded?

  ### 2. Naming Move B: "Magic Emergence"
  There isn't one single canonical term for Move B, but there are several precise labels depending on which philosopher you ask.

  *   **"Strong Emergence" (Pejorative):** In philosophy of mind, "Weak Emergence" refers to patterns that are unexpected but derivable from the parts (e.g., traffic jams). "Strong Emergence" refers to properties that are *not* derivable from the parts even in principle. When people use Move B, they are often smuggling in Strong Emergence without admitting the metaphysical cost. Critics often call this **"Magic Emergence."**
  *   **"Skyhook Emergence":** Since you mentioned Dennett, this fits. A "Skyhook" is a mechanism that lifts complexity without a foundation. Using "emergence" as a thought-stopper is installing a skyhook and painting it to look like a crane.
  *   **"Covert Dualism":** The philosopher Jaegwon Kim argued that Non-Reductive Physicalism (Move B) is unstable. If the higher-level property isn't reducible to the lower level, but still has causal power, it violates the causal closure of the physical world. Therefore, Move B is often just **Dualism in physicalist clothing.**
  *   **"Explanatory Hand-Waving":** In systems theory, this is sometimes called **"Black Boxing."** You acknowledge the input (neurons) and the output (consciousness), but you treat the mechanism inside as a mysterious black box labeled "Emergence."

  ### 3. The Pair: "Explanatory Short-Circuiting"
  Is there a name for the pair? Not a single famous one, but they are collectively recognized as the **Scylla and Charybdis of Inter-Level Explanation.**

  They are symmetrical in that both are **Explanatory Short-Circuits.**
  *   **Move A** short-circuits by **collapsing** the levels. (There is no gap to bridge because the top level doesn't exist.)
  *   **Move B** short-circuits by **severing** the levels. (There is a gap, but we won't build a bridge; we'll just jump across it.)

  If you are looking for a term to coin or use, **"Ontological Ping-Pong"** or **"The Reduction-Emergence False Dilemma"** works well. However, the most accurate description of the shared error is a failure of **Mechanistic Explanation.** Both sides fail to describe the *constraints* and *organization* that allow the parts to generate the whole.

  ### 4. Are they equally bad?
  This is where the symmetry gets interesting. While they are structurally similar (both skip the mechanism), they have different epistemic vices.

  *   **Move A (Greedy Reductionism)** is empirically safe but ontologically stingy. It rarely makes false predictions, but it fails to capture reality. It's a "safe" error.
  *   **Move B (Magic Emergence)** is ontologically generous but empirically hollow. It feels profound, but it makes no predictions. It is a "deep-sounding" error.

  Many philosophers argue **Move B is worse** because it is more insidious. Move A is obviously unsatisfying (telling a grieving person "your loss is nothing but chemistry" is clearly missing something). Move B, however, *feels* like an explanation. It gives you the satisfaction of acknowledging the complexity without doing the work of unraveling it. It is a **placebo explanation.**

  ### 5. Where is the boundary? (Legitimate vs. Illegitimate)
  You asked where the line is between legitimate reduction/emergence and the fallacious versions. The boundary is **Derivability in Principle.**

  **Legitimate Reduction (Not Greedy):**
  *   **Claim:** "Water is H2O."
  *   **Why it works:** We can show how the micro-properties of H2O *constrain* and *generate* the macro-properties of water (wetness, boiling point). We don't say wetness is an illusion; we say wetness is what H2O does at scale.
  *   **The Test:** Can you simulate the parts and get the whole? If yes, reduction is valid.

  **Legitimate Emergence (Not Magic):**
  *   **Claim:** "A traffic jam is an emergent phenomenon."
  *   **Why it works:** You cannot find a "traffic jam" in a single car. But you *can* write equations showing how individual braking behaviors propagate backward to create a jam. The "emergence" is a description of the *mathematical relationship* between levels, not a substitute for it.
  *   **The Test:** Does "emergence" point to a specific mechanism of organization (feedback loops, constraints, phase transitions)? If yes, it's legitimate.

  **The Fallacious Boundary:**
  *   **Move A fails** when it claims the higher-level properties (meaning, function, experience) don't exist because the substrate exists.
  *   **Move B fails** when "emergence" is used as a noun rather than a verb. Emergence is a *process*, not a *substance*. If you say "Consciousness is an emergence," you have reified a verb. It should be "Consciousness emerges via [specific mechanism]."

  ### Summary
  *   **Move A:** Greedy Reductionism / Nothing-Buttery.
  *   **Move B:** Magic Emergence / Covert Dualism / Skyhook Emergence.
  *   **The Pair:** Explanatory Short-Circuiting (Collapsing vs. Severing).
  *   **The Fix:** **Mechanistic Explanation.** Show the organization. Show how the parts are constrained to create the whole.

  You aren't forcing a symmetry where there isn't one. You have identified the two primary ways philosophers avoid doing the hard work of **multi-scale modeling.** Move A denies the scale exists; Move B worships the scale without measuring it.
