      *   In the context of teleosemantics, it's often discussed as the **Indeterminacy Problem** or the **Swampman/Novelty Problem** (though Swampman is slightly different, it relates to history vs. current function). The specific issue of "dust mote vs. fly" in teleosemantics is often framed as the **Distality Problem** or simply the problem of **Normativity**.
