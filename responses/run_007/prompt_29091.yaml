      *   *Teleosemantics (e.g., Millikan, Papineau):* The appeal is to *proper function*. $R$ means $X$ because $R$ was selected for tracking $X$. If $R$ fires for $Y$ (dust mote), it is malfunctioning.
      *   *Is it the same problem?* Yes, fundamentally. Both seek to ground normativity (truth conditions) in natural facts. Teleosemantics was explicitly developed (in part by Millikan) to solve the problems plaguing simple causal theories, specifically the disjunction/error problem. However, teleosemantics faces its *own* version of the problem (e.g., what if the organism was selected to eat nutritious things, and the dust mote looks like a fly, but eating flies was the mechanism? Is the content 'fly' or 'nutritious thing'?). This is the **Distality Problem** (Burge).
