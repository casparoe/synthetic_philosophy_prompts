      *   Core claim held? Yes.

  7.  **Final Polish:**
      *   Make sure to emphasize that intention involves a belief about future action.
      *   Highlight the temporal disconnect.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm saying "you can't want the money." I need to say "you can't form the *intention*." The user says "adopting an intention is itself something I can do." I need to challenge whether "adopting an intention" is an action like swallowing a pill. It's more like setting a course.

      *Revised Plan:*
