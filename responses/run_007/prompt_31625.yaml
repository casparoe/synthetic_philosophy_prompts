      2. Explain that intention entails a belief in future performance, which is impossible here because future performance is irrational.

      *Draft:*
      The pill analogy fails because swallowing a pill is a completed action in the present, whereas forming an intention is adopting a plan for future conduct. When you swallow the pill, the difficult part is over immediately; the health benefit follows causally without further voluntary input from you. But an intention isn't a one-off mental event like swallowing; it's a sustained commitment that implies you believe you will follow through. You can't separate the "adopting" from the "doing" because the intention *is* the psychological state of planning to do. If you know you won't do it, you haven't truly intended it, you've only wished you could intend it.

      Here's the crux: at midnight, you must assess whether you will drink the toxin tomorrow. You know that tomorrow, the money will already be in your bank account (or not), so there will be zero reason to drink the toxin and every reason to avoid the sickness. A rational agent knows they won't perform an action they have no reason to perform. Therefore, at midnight, you know you won't drink. If you know you won't drink, you cannot genuinely intend to drink. The million dollars gives you a reason to *want* to intend, but it cannot give you a reason to *drink*, and without a reason to drink, the intention is rationally inaccessible.

