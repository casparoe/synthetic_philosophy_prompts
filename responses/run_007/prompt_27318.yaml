  - the flaw (or the bullet to bite) — ~150 words: 
  The argument is logically valid within standard modal epistemic logic, known as Fitch's Paradox. The error lies in accepting Premise 1 unrestrictedly. Specifically, Step 4 fails because it assumes the proposition "$p$ is true and nobody knows $p$" is knowable. While $p$ itself might be knowable, the conjunction is logically unknowable. Knowing the conjunction requires knowing the second conjunct ("nobody knows this"), but the act of knowing the conjunction makes that conjunct false. Thus, Premise 1 is false as stated; not every truth is knowable, because some truths (specifically contingent unknowns) lose their truth-value upon being known. We must reject the unrestricted Knowability Principle to avoid the contradiction. The flaw is not logical, but semantic.

  - why it looked fine — ~150 words: 
  Premise 1 captures a compelling anti-realist intuition: truth shouldn't outstrip our cognitive grasp. It seems plausible that any fact *could* be discovered, even if it hasn't been yet. The logical steps (distribution of knowledge, factivity) are standard axioms in epistemic logic. The contradiction arises subtly because knowing a conjunction requires knowing each part, and knowing the second part immediately renders it false. This dynamic interaction between knowledge and truth conditions is very easy to overlook in informal reasoning, making the derivation seem like a pure logical discovery rather than a refutation of the premise. The self-referential nature of step 3 also masks the issue by looking like a simple definition.

  - what it costs — ~200 words: 
  Rejecting the unrestricted Knowability Principle forces anti-realists to abandon the core idea that truth is fundamentally tied to possible verification. We must accept 'epistemic humility': there are truths that are essentially unknowable. Specifically, we must admit that for any unknown truth $p$, the proposition '$p$ is unknown' is true but unknowable. This creates a permanent class of 'stable unknowns.' We lose the comforting view that reality is fully transparent to rational inquiry. However, this is far less costly than accepting omniscience, which contradicts obvious empirical evidence of human ignorance. We sacrifice a strong semantic constraint on truth to preserve the obvious fact that we are not omniscient. This preserves the distinction between truth and knowledge, acknowledging that some facts are true precisely because they remain undiscovered. Furthermore, it requires verificationists to restrict their theory, admitting that truth can outrun verifyability in specific logical cases, weakening the anti-realist claim that existence equals knowability. This is a significant theoretical retreat but necessary to maintain coherence. Ultimately, we concede that the world contains facts that are inherently beyond our cognitive reach, limiting the scope of human understanding.

  - alternative diagnoses — ~150 words: 
  Some propose changing the logic. Intuitionistic logic blocks the final inference from 'no unknown truths exist' to 'all truths are known,' allowing one to maintain knowability without omniscience. Others suggest restricting the factivity of knowledge or the distribution rule over conjunction. I prefer rejecting Premise 1 because it preserves classical logic and standard epistemic axioms, which are very robust elsewhere. Changing logic to save a semantic principle seems like overkill; it's cheaper to limit the scope of knowability than to overhaul the laws of thought or the definition of knowledge. The classical diagnosis isolates the problem to the specific interaction of knowledge and contingency.
