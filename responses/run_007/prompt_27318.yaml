  ok so a friend in my epistemology seminar showed me this argument and i've been turning it over for like a week and i can't find the flaw. it seems to prove that if every truth is knowable, then every truth is actually known. which is obviously false — there are plenty of truths nobody knows (like the exact number of grains of sand on earth, or what i had for breakfast three tuesdays ago). but the reasoning looks air-tight:

  (1) assume for the sake of argument that every truth is knowable. formally: for any proposition p, if p is true then it's possible that someone knows p.

  (2) now consider the proposition "p is true and nobody knows p." call this an unknown truth. surely some propositions of this form are true — like the sand grains thing.

  (3) pick one such proposition and call it q. so q says: "q is true and nobody knows q."

  (4) by our assumption (1), since q is (by hypothesis) true, it must be knowable. so it's possible that someone knows q.

  (5) but what would it mean to know q? it would mean knowing that (q is true and nobody knows q). knowledge distributes over conjunction, so the knower would know that q is true, and would also know that nobody knows q.

  (6) knowledge is factive: if you know that nobody knows q, then indeed nobody knows q.

  (7) but wait — the knower themselves knows q (from step 5). so someone does know q. so "nobody knows q" is false.

  (8) so knowing q would require both knowing that nobody knows q (which implies nobody knows q) and knowing q (which implies someone knows q). that's a contradiction.

  (9) so it's impossible to know q. but step (4) said it's possible to know q. contradiction.

  (10) the only way out is to deny that q was ever true in the first place. so there are no unknown truths. every truth is known.

  this is wild. it seems to prove that if you're optimistic enough to think all truths are at least knowable (which sounds like a nice anti-mysterian view), you're comitted to the insane claim that all truths are actually known right now. i'm pretty sure the problem is somewhere in the modal logic — maybe something about how "knowable" interacts with quantifiers, or some scope issue with the possibility operator. but i can't pin it down.

  where does this argument go wrong? give me your diagnosis. if you think a specific step fails, tell me which one and why it looked plausible. if you think the argument is valid and we just have to bite the bullet on one of the premises, tell me which premise is least costly to give up and what we lose by giving it up.

  please structure your response like this:

  - the flaw (or the bullet to bite) — ~150 words: name the exact step or premise you're rejecting and state clearly what's wrong with it.
  - why it looked fine — ~150 words: explain what makes that step intuitively appealing or formally natural, and why it's easy to miss the problem.
  - what it costs — ~200 words: if you're rejecting a premise, what attractive philosophical position do we lose? if you're rejecting a logical step, what other inferences does that screw up? if you're biting the bullet, what uncomfortable consequences do we now have to live with?
  - alternative diagnoses — ~150 words: briefly sketch one or two other ways philosophers have tried to block this argument, and say why you find your diagnosis better.
