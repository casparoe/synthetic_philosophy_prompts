answer: |-
  The pattern you have identified is indeed a canonical problem in the history of philosophy, most commonly known as **Bradley's Regress**. It is also frequently discussed under the heading of **the Problem of the Unity of the Proposition** (in philosophy of language) or **the Problem of Ontological Unity** (in metaphysics). While the specific stakes vary depending on whether one is discussing facts, objects, or propositions, the logical structure is widely regarded as isomorphic across these domains.

  ### The Canonical Statement

  The argument is most famously articulated by the British Idealist F.H. Bradley in *Appearance and Reality* (1893), though versions of it appear in Plato's *Parmenides* and later in Russell's work on logical atomism. The canonical formulation runs as follows:

  1.  Suppose we have a complex fact or proposition composed of constituents, say, *a* and *b*, standing in a relation *R*.
  2.  For *a* and *b* to be unified by *R*, *R* must itself be related to *a* and to *b*.
  3.  If *R* is a distinct entity from *a* and *b*, we now require a further relation, *R₁*, to connect *R* to *a*, and another, *R₂*, to connect *R* to *b*.
  4.  But *R₁* and *R₂* are themselves distinct entities, requiring further relations (*R₃*, *R₄*, etc.) to connect them to their respective relata.
  5.  This generates an infinite regress.
  6.  Therefore, the original unity was never explained; the relation *R* fails to actually relate anything, and the complex is reduced to a mere list of constituents.

  Bradley's own conclusion was radical: relations are unintelligible and ultimately unreal, leading to his monistic view that only the absolute Whole is real. However, most contemporary philosophers accept the regress as a serious constraint on theories of combination without accepting Bradley's monism.

  ### One Problem or a Family?

  You ask whether the metaphysical version (facts/objects) and the linguistic version (propositions) are the same difficulty. The consensus among specialists is that they are **structurally identical but categorially distinct**.

  *   **Metaphysical Version:** Concerns how objects and properties constitute a state of affairs. The worry is ontological: how does the world contain facts rather than just heaps of objects?
  *   **Linguistic/Logical Version:** Concerns how names and predicates constitute a proposition capable of truth or falsehood. The worry is semantic: how does a sentence say something rather than just naming a list of things?

  Many philosophers (particularly truthmaker theorists) argue these are two sides of the same coin: the structure of the proposition mirrors the structure of the fact. However, some argue the linguistic version can be dissolved by syntactic or cognitive means (e.g., cognitive unity in the mind) even if the ontological version remains hard. The "flavour" you noticed—that the explanation presupposes the thing to be explained—is the hallmark of a **vicious explanatory regress**, distinguishing it from benign infinite series (like the integers).

  ### Main Lines of Response

  There are five primary strategies for resisting the regress:

  1.  **Primitivism:** Assert that the "tie" or "nexus" of unity is brute and unanalysable. Russell eventually adopted this, arguing that the unity of a proposition is a fundamental logical fact that cannot be further analysed without distortion.
  2.  **Unsaturatedness (Fregean):** Deny that the connector is an object. Frege argued that concepts (predicates) are "unsaturated" or gappy; they do not need a further glue to connect to objects because their very nature is to seek completion. This attempts to block the regress by claiming the connector is not a third *thing* alongside the relata.
  3.  **Substantivalism (States of Affairs):** Treat the complex (the fact or proposition) as the fundamental ontological unit, rather than the constituents. On this view, *a*'s being *F* is prior to *a* and *F* separately, so no glue is required to bind them.
  4.  **Non-Relational Ties:** Some metaphysicians (e.g., Strawson, Armstrong) posit a "non-relational tie" that performs the combining work without itself being a relation that requires further relating. This is often criticised as merely labelling the mystery rather than solving it.
  5.  **Elimativism/Nominalism:** Deny the existence of one of the relata (usually universals or relations) to avoid the need for combination altogether.

  ### Distinguishing from Nearby Regresses

  It is crucial to distinguish Bradley's Regress from other famous infinite regresses, as the diagnostic and remedial strategies differ.

  *   **Lewis Carroll's "What the Tortoise Said to Achilles":** This is a regress of **inference and justification**, not ontological unity. The Tortoise argues that accepting premises *P* and *P → Q* does not force one to accept *Q* without a further rule stating that if *P* and *P → Q* are true, *Q* must be accepted. The issue here is normative (what compels belief?) rather than constitutive (what makes a whole?). Carroll's regress is often solved by distinguishing between premises and rules of inference, whereas Bradley's regress challenges the very existence of complex entities.
  *   **The Third Man Argument:** This is a regress of **predication and universals**. If a man is like other men because they share a Form (Man), then that Form must be like the men, requiring a higher Form. While structurally similar (adding a third thing creates a need for a fourth), the Third Man relies on self-predication and similarity, whereas Bradley's Regress relies on the nature of relations and combination.
  *   **Epistemic Justification Regress (Agrippa's Trilemma):** This concerns reasons for beliefs. It is vicious if one demands inferential justification for every justification. Bradley's Regress is ontological; it persists even if no one is trying to justify a belief, because it concerns how reality is structured.

  ### Boundaries and Superficial Similarities

  You asked when this is a genuine problem versus a superficial similarity. The regress is genuine when the theory in question **reifies the connector**. If you treat the connection as an object or entity within the same logical category as the things being connected, the regress is almost inevitable. It becomes a superficial worry when the "connection" is treated as a formal feature, a syntactic rule, or a category mistake to posit it as an entity. For example, in modern model-theoretic semantics, the "connection" between a name and an object is handled by a valuation function external to the language; asking for the glue inside the language is then a category error. However, in metaphysics, where the valuation function itself must exist in reality, the problem resurfaces with full force.

  Summary: The pattern you describe is canonically known as Bradley's Regress, a vicious explanatory regress arising when the ontological or logical unity of a complex is analysed by positing a distinct connecting entity, and it is distinguished from other regresses by its focus on constitution rather than inference or justification.
