  This is a sophisticated and structurally significant observation that cuts to the heart of the debate between **myopic** (local) and **sophisticated/resolute** (global) choice in dynamic decision theory. You are correct that this specific difficulty is recognized in the literature, but it does not possess a single, universally canonical proper noun (like "The Allais Paradox" or "The Newcomb Problem") that isolates the *regress* aspect specifically.

  Instead, this problem is typically discussed under the broader header of the **Individuation Problem** (or the **Problem of Plan Individuation**) within the literature on **Resolute Choice** and **Dynamic Consistency**.

  Here is how the phenomenon sits relative to the existing concepts you mentioned:

  1.  **The Individuation Problem (McClennen/Hammond):** Edward McClennen, in *Rationality and Dynamic Choice* (1990), argues for resolute choice to avoid money pumps, insisting that the plan, not the isolated act, is the object of rational evaluation. The objection you describe—that there is no principled way to bound the "plan" (is it the sequence of trades? the day's transactions? the agent's life?)—is the standard **Individuation Objection** to resolute choice. Critics argue that without a principled boundary for the plan, the normative force of "following the plan" is ungrounded.
  2.  **The Scope Problem (Global Consequentialism):** In moral philosophy, this is structurally identical to the **Scope Problem** for global consequentialism (discussed by Pettit, Smith, and others). If the rightness of an act depends on the goodness of the global outcome, and the "global" has no boundary, evaluation becomes impossible. In decision theory, this translates to the **Boundary Problem for Diachronic Rationality**.
  3.  **The Ex Ante Perspective (Gustafsson/Rabinowicz):** Contemporary work on money pumps (e.g., Johan Gustafsson's *Money Pumps*, 2022) frames this as the **Problem of the Ex Ante Perspective**. To avoid the pump, the agent must adopt an *ex ante* perspective covering the sequence. The regress arises when asking "Ex ante to *what*?" If the perspective must be infinitely expansive to be truly global, it becomes cognitively and normatively inaccessible.

  While terms like "The Planning Regress" exist in Bratman's work, they refer to the *generation* of plans rather than the *normative boundary* for evaluation. Similarly, "The Frame Problem" is too broad. There is no single established term that exclusively denotes the *regress of global evaluation boundaries* in money pump arguments, though it is the core engine of the Individuation Objection.

