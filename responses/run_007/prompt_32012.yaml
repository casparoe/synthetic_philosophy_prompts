  2.  **Deconstruct the Inefficacy Objection (Philosophical Background):**
      *   *What is it?* The claim that individual actions in collective harm scenarios (climate change, factory farming) make no difference to the outcome.
      *   *Key Arguments:*
          *   *Causal Impotence:* My buying one chicken doesn't trigger the killing of one chicken (threshold problems).
          *   *Expected Utility:* Even if there's a tiny chance of making a difference, the expected value might still be positive (Nefsky, Norcross).
          *   *Complicity/Integrity:* It's about my own moral hands, not the outcome (Kantian/Virtue Ethics).
          *   *Expressive/Signaling:* Voting/consuming expresses values, influences norms.
          *   *Collective Action/Coordination:* The problem isn't individual action, it's the lack of a group agreement (Chignell, Lawford-Smith).
      *   *The "Good Place" Connection:* The show explicitly tackles moral accounting in a complex world.

  3.  **Analyze *The Good Place* (Textual Evidence):**
