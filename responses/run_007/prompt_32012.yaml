  7.  **Final Polish:** Check against the prompt's four specific requirements. Ensure the *Good Place* examples are accurate (e.g., distinguishing between the S1 twist and the S4 resolution). *Self-correction: Ensure I mention that the show moves from Individual Ethics to Political Ethics.*

  8.  *(Final thought before drafting)*: The user is feeling despair. The response should end on a note that validates their choice to go vegetarian regardless of the causal math, aligning with the show's ultimate message about growth and community.

