              *   *Integrity/Expressive:* Chidi embodies this (agonizing over the right rule). Eleanor embodies the shift to outcomes.
              *   *Coordination:* This is the big one. Season 4 is about *systemic change*, not individual purity. This aligns with "Collective Harm" literature (e.g., Travis Timmerman, Julia Nefsky).
          *   *2. Accuracy vs. Narrative:*
              *   *Right:* The complexity of modern morality. The psychological toll (Chidi's ulcers).
              *   *Distortion:* The "Afterlife Bureaucracy" solution is deus ex machina. In reality, we can't just reboot the system. It simplifies the *political* struggle into a *administrative* fix.
          *   *3. What the Show Adds:*
