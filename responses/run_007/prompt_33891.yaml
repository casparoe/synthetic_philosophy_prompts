      *   *Self-Correction on Memory:* The prompt mentions a *memory researcher* using it for eyewitness testimony. PP applies to memory (reconstructive), but the slogan is usually about *perception*. I need to note that bridging perception and memory is an extra step. The "hallucination" label fits memory reconstruction well (schema-driven), but conflating perception and memory needs to be flagged.

  8.  **Final Structure:**
      *   Intro: Acknowledge the frustration (it's a "semantic sinkhole").
      *   The Menu (3-4 distinct tiers).
      *   Evaluation of each (Truth value, PP backing, Eyewitness utility).
