prompt: |-
  I'm a science journalist who covers the predictive processing / free energy beat, and I keep running into the line "perception is a controlled hallucination." A few months ago a modeler at a conference used it to wave off a question about whether strong priors can override the signal entirely; last week a memory researcher used it in an interview to explain why eyewitness testimony is unreliable, saying the witness's brain was "hallucinating" the scene under top-down control. When I asked which part of the sentence was doing the work, I just got the line repeated back at me. I'd like to stop letting it end conversations. Can you lay out the distinct precise claims that sentence could be making — from the near-platitude reading (the brain actively constructs perception rather than passively recording it) through the substantive predicitive-processing reading (perceptual content is always a top-down best guess that gets corrected by prediction error) to the radical one (we literally hallucinate all the time and only call the shared hallucinations reality) — and for each reading say whether it's trivial, defensible, or false, how much actual predictive processing work supports it, and which reading is actually needed to get the eyewitness-memory conclusion. A menu I can pull out next time someone drops the slogan and moves on would be ideal.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science journalist covering predictive processing (PP) / free energy principle (FEP).
      *   **Problem:** The slogan "perception is a controlled hallucination" is being used as a conversation stopper or a vague hand-wave to explain various phenomena (strong priors overriding signal, eyewitness unreliability). When pressed, interlocutors just repeat the slogan.
      *   **Goal:** A "menu" of distinct precise claims hidden within that slogan, ranging from trivial to radical.
      *   **Requirements:**
          *   Categorize the claims (Platitude, Substantive PP, Radical).
          *   Evaluate each (Trivial/Defensible/False).
          *   Assess PP/FEP support for each.
          *   Identify which reading is actually required for the specific application (eyewitness testimony).
          *   Tone: Professional, precise, useful for a journalist (i.e., clear distinctions, actionable questions).

  2.  **Deconstruct the Slogan ("Perception is a Controlled Hallucination"):**
      *   *Origin:* Anil Seth is the most prominent popularizer, though the roots are in Helmholtz (unconscious inference), Gregory, and modern PP (Friston, Rao & Ballard).
      *   *Key Terms:* "Perception," "Controlled," "Hallucination."
      *   *Ambiguity:* "Hallucination" usually implies *false* perception without external stimulus. "Controlled" implies constraint. The tension is where the meaning lies.

  3.  **Drafting the "Menu" (Levels of Interpretation):**

      *   **Level 1: The Constructivist Platitude (Helmholtzian)**
          *   *Claim:* Perception isn't a camera; the brain adds stuff (filling in blind spots, color constancy).
          *   *Status:* Trivial/True. Accepted since 19th century.
          *   *PP Support:* Consistent, but doesn't *require* PP.
          *   *Eyewitness Relevance:* Weak. Explains gaps, not necessarily false memories of events that didn't happen.

      *   **Level 2: The Generative Model Claim (Standard PP)**
          *   *Claim:* Perceptual content is *generated* by top-down predictions. Bottom-up input only carries *error* signals, not content.
          *   *Status:* Defensible/Controversial. This is the core technical claim.
          *   *PP Support:* High. This is what the math says (posterior = prior + likelihood).
          *   *Eyewitness Relevance:* Strong. If content is top-down, strong priors (expectations) can dictate content if error is minimized or ignored.

      *   **Level 3: The Ontological Equivalence (Radical/Phenomenological)**
          *   *Claim:* There is no qualitative difference between "veridical" perception and "hallucination" from the inside. Both are simulations. Reality is just the hallucination everyone agrees on.
          *   *Status:* Defensible but slippery. Philosophically interesting, scientifically hard to test.
          *   *PP Support:* Mixed. Seth argues this, but Friston is more functionalist.
          *   *Eyewitness Relevance:* Dangerous. Can lead to "nothing is real" dismissal rather than specific mechanism analysis.

      *   **Level 4: The Precision Weighting Failure (Pathological)**
          *   *Claim:* Hallucinations happen when priors are weighted too high relative to sensory evidence (precision weighting). "Controlled" means precision is normally balanced; "Hallucination" means it's not.
          *   *Status:* Defensible/Specific.
          *   *PP Support:* High (Adams et al., Fletcher & Frith on psychosis).
          *   *Eyewitness Relevance:* Very Strong. This explains *why* the witness hallucinated: high prior precision (expectation) + low sensory precision (stress/distance).

  4.  **Addressing the Specific Use Cases:**
      *   *Modeler (Strong priors overriding signal):* This is about **Precision Weighting** (Level 4). If priors have high precision, they suppress error.
      *   *Memory Researcher (Eyewitness testimony):* This is about **Generative Content** (Level 2) combined with **Precision Weighting** (Level 4). The brain generated the scene based on schema (prior) rather than data.

  5.  **Refining the Evaluations (Trivial vs. Defensible vs. False):**
      *   *Platitude:* True but doesn't do the heavy lifting.
      *   *Standard PP:* Defensible, but often misunderstood as "no input." Input exists as error.
      *   *Radical:* Philosophically defensible, scientifically less useful for specific mechanisms.
      *   *False Reading:* "Perception is *just* hallucination" (ignoring the 'controlled' part).

  6.  **Developing the "Journalist's Toolkit" (Follow-up Questions):**
      *   Need questions that force specificity.
      *   "What is being generated?"
      *   "Where does the constraint come from?"
      *   "What mechanism fails in the eyewitness case?"

