answer: |-
  You are right to be suspicious. "Spooky action at a distance" (*spukhafte Fernwirkung*) is a rhetorical phrase coined by Einstein in a 1947 letter to Born, not a technical term of art. In a philosophy of physics context, using it as a precise premise is dangerous because it conflates **ontological structure** (how the world is) with **operational constraints** (what we can measure) and **aesthetic preferences** (what feels comfortable).

  Your professor is likely sliding between these meanings to make Standard Quantum Mechanics (SQM) look "safer" than Bohmian Mechanics, even though both face the same underlying mathematical constraints imposed by Bell's Theorem.

  Here is a taxonomy of the distinct readings of "spooky action at a distance," ranked from most precise to most hand-wavy, analyzed against your criteria.

  ### 1. Violation of Bell Locality (Local Causality)
  *   **Definition:** A theory violates the condition that the probability of an outcome at one wing of an experiment is independent of the setting and outcome at the other wing, given a complete specification of the past common cause (the "hidden variables").
  *   **Is it a genuine physical claim?** Yes. It is a mathematically precise condition defined by Bell (1976).
  *   **Implied by violating Bell Inequalities?** **Conditionally.** Bell's theorem proves that *Local Realism* is false. It does not prove Non-locality outright; it proves $\neg(\text{Local} \land \text{Real})$. You can avoid this violation by giving up Realism (as Copenhagen does) rather than Locality. However, if you assume Realism (as Bohm does), this violation is logically necessary.
  *   **Fair criticism of Bohm?** **Yes.** Bohmian mechanics is explicitly non-local in this sense. The velocity of a particle depends instantaneously on the positions of all other entangled particles via the wavefunction.
  *   **Status:** This is the only technically defensible reading in a formal context.

  ### 2. Superluminal Ontological Influence (Causal Non-locality)
  *   **Definition:** There exists a causal mechanism or physical dependency that propagates faster than light, even if it cannot be controlled.
  *   **Is it a genuine physical claim?** Yes, but it requires an ontology (a story about what exists). SQM (Copenhagen) often refuses to make this claim by denying the reality of the process between measurements.
  *   **Implied by violating Bell Inequalities?** **Conditionally.** Again, only if you maintain Realism. If measurement outcomes are not real properties until measured, there is no "influence" traveling, only a correlation in outcomes.
  *   **Fair criticism of Bohm?** **Yes.** Bohm posits a real particle and a real guiding wave. The guidance equation is explicitly non-local.
  *   **Status:** This is likely what your professor means when he says Bohm "accepts" spooky action. It is a fair description of Bohm's ontology.

  ### 3. Superluminal Signaling (Operational Non-locality)
  *   **Definition:** The ability to transmit information faster than light, allowing for causal paradoxes (like sending a message to your own past) in some reference frames.
  *   **Is it a genuine physical claim?** Yes. This violates the No-Signaling Theorem and Special Relativity.
  *   **Implied by violating Bell Inequalities?** **No.** Quantum mechanics (and Bohmian mechanics) satisfies the No-Signaling theorem. You cannot use entanglement to send a bit of data faster than light.
  *   **Fair criticism of Bohm?** **No.** This is a common misconception. While Bohm has superluminal *influences* (Reading 2), it is constructed specifically to prevent superluminal *signaling* (Reading 3) via the "quantum equilibrium hypothesis."
  *   **Status:** If your professor implies Bohm allows FTL communication, he is factually wrong. If he implies the *existence* of FTL influence risks FTL signaling, he is raising a stability concern, but not a direct contradiction.

  ### 4. Newtonian Action at a Distance (Field-less Force)
  *   **Definition:** A force acting instantaneously across space without a mediating field or carrier particle (like Newton's gravity before General Relativity).
  *   **Is it a genuine physical claim?** Yes, historically.
  *   **Implied by violating Bell Inequalities?** **No.** Bell violations do not require "forces" in the Newtonian sense. They require correlations that cannot be explained by common causes.
  *   **Fair criticism of Bohm?** **Unfair/Category Error.** Bohmian mechanics uses a wavefunction (a field on configuration space) to mediate the interaction. It is not "action at a distance" in the Newtonian sense of two particles affecting each other directly without a mediator; the mediator is just high-dimensional and non-local.
  *   **Status:** This is an anachronistic criticism often leveled by physicists unfamiliar with the details of pilot-wave theory.

  ### 5. Metaphysical Discomfort ("It feels wrong")
  *   **Definition:** The theory conflicts with a pre-theoretic intuition that physical causes should be local, or that Relativity should be "manifest" in the ontology, not just the phenomena.
  *   **Is it a genuine physical claim?** No. It is an aesthetic or philosophical preference.
  *   **Implied by violating Bell Inequalities?** **No.** Nature doesn't care about our comfort.
  *   **Fair criticism of Bohm?** **Subjective.** It is fair to say Bohm conflicts with the *spirit* of Special Relativity (by preferring a preferred foliation of spacetime), even if it doesn't conflict with the *predictions*.
  *   **Status:** This is often the real engine behind the dismissal, dressed up as a physical objection.

  ---

  ### Diagnosing Your Professor's Equivocation

  You suspected equivocation, and the taxonomy above confirms why. Your professor is likely switching between **Reading 2** and **Reading 3/5** depending on which theory he is discussing.

  **1. When he says: "If you want to avoid spooky action... give up realism."**
  *   **Reading:** He is using **Reading 1 or 2**.
  *   **The Logic:** He is arguing that *Realism* is the variable that forces Non-locality upon you. If you adopt an instrumentalist view (Copenhagen), you can claim there is no "action" because there is no "thing" acting until measurement.
  *   **Validity:** This is a standard (though contested) philosophical move. It relies on the idea that correlations without underlying causal mechanisms aren't "action."

  **2. When he says: "Bohm is just accepting spooky action."**
  *   **Reading:** He is implicitly invoking **Reading 3 or 5**.
  *   **The Logic:** Here, "spooky action" is treated as a *defect*. He is implying that because Bohm makes the non-locality explicit (ontological), it inherits the baggage of violating Relativity (signaling) or being metaphysically unacceptable.
  *   **Validity:** This is where the sleight of hand happens. He is penalizing Bohm for being honest about the non-locality that Bell's theorem says *any* realist theory must have. Standard QM hides this non-locality behind the "collapse" postulate; Bohm writes it into the equations.

  **The Equivocation:**
  He is treating "Spooky Action" as **avoidable** in the first statement (by dropping realism), but as a **fatal flaw** in the second statement (for Bohm).
  *   If SAAD is avoidable, it shouldn't be a fatal flaw for the theory that admits it's necessary for realism.
  *   If SAAD is a fatal flaw (because it violates Relativity), then Standard QM *also* has it (in terms of Bell Locality), it just masks it.

  ### Which reading should you assume?

  When he contrasts it with "giving up realism," you should assume he is using **Reading 2 (Superluminal Ontological Influence)**.

  *   **The Argument:** "If you want the world to be Real (particles have positions), you must accept that influences travel faster than light (Reading 2). If you don't want influences traveling faster than light, you must say particles don't have positions until measured (give up Realism)."
  *   **The Trap:** He is banking on you thinking Reading 2 implies Reading 3 (Signaling). If you confront him, ask this:

  > *"When you say Bohmian mechanics accepts 'spooky action,' do you mean it violates Bell Locality (which Standard QM also does), or do you mean it allows superluminal signaling (which it doesn't)? If it's the former, isn't Standard QM also 'spooky' but just hiding it behind the collapse postulate?"*

  This forces him to clarify whether his objection is physical (signaling) or metaphysical (preference for local ontology). Usually, they will retreat to the metaphysical preference, admitting that "spooky action" is really just a label for "ontologies that make non-locality manifest."
