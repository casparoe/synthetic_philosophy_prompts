prompt: |-
  In my philosophy of physics course we're covering Bell's theorem, and my professor keeps tossing around the phrase "spooky action at a distance" like it's an argument. He'll say things like "Bell's theorem shows that if you want to avoid spooky action at a distance, you have to give up either locality or realism" — but then other times he'll use it to dismiss Bohmian mechanics as "just accepting spooky action at a distance." The phrase seems to be doing a lot of different work depending on who he's arguing against.

  Can you unpack what precise claims someone could actually be making when they say a theory involves "spooky action at a distance"? I can think of at least a few: (a) the theory is non-local in the sense of violating Bell locality, (b) the theory has superluminal causation, (c) the theory has action at a distance in the Newtonian sense but without a mediating field, (d) the theory just feels weird and the person doesn't like it. Lay out the distinct readings, from the most precise/physics-based to the most hand-wavy, and for each one say whether it's a genuine physical claim, whether it's actually implied by violating Bell inequalities, and whether it's a fair criticism of Bohmian mechanics in particular. Also tell me which reading I should assume my professor is using when he's contrasting it with "giving up realism," because I'm starting to suspect he's equivocating between them.
