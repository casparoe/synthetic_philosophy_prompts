          *   *Resolution:* IBE is not enumerative induction. It posits a hidden cause. One can reject the *logic* of analogy (n=1) while accepting the *logic* of abduction (best explanation of data). However, there's a phenomenological tension: IBE feels theoretical; our engagement feels direct.
