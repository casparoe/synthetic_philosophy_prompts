      *   **Address the "Persisting Self" issue:** This is crucial for her novel. Descartes *does* smuggle in persistence, but he needs God to guarantee it over time. Without God, the *Cogito* is momentary.
      *   **Connect to the Novel (*The Inventory*):**
          *   If the *Cogito* only proves existence *now*, the protagonist is a new person every day.
