          *   *Step 2 & 5 (The Thin I):* This is the winner. Introduce Georg Lichtenberg. "It thinks" (*Es denkt*). This supports her view that the "I" might be grammatical fiction.
          *   *Step 6 (Persistence):* Crucial point. The *Cogito* is instantaneous. It does *not* prove I existed 5 minutes ago. Descartes needs God to bridge the gaps.
      *   **Implications for the Protagonist:**
