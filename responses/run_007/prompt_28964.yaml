answer: |-
  You are absolutely right to suspect that "consciousness is an illusion" is functioning as a slogan rather than a precise thesis. In your reading group, you are witnessing a classic case of **equivocation**: the word "consciousness" is shifting referents (phenomenality, selfhood, introspection), and the word "illusion" is shifting modes (misrepresentation, non-existence, error).

  When Keith Frankish or Daniel Dennett deploy this slogan, they are usually making a specific technical claim that differs significantly from a Buddhist "no-self" claim or a standard cognitive science "Cartesian Theater" claim.

  Here is a menu of four distinct theses that the slogan often masks. You can bring this to your group to disambiguate the conversation.

  ---

  ### 1. The Anti-Cartesian Theater Thesis
  **"There is no central place where it all comes together."**

  *   **What is Illusory:** The structural idea that there is a specific locus in the brain (or mind) where sensory inputs converge to be "viewed" by a subject. This includes the idea of a "homunculus" or a single stream of consciousness that is unified in a specific moment.
  *   **What Remains:** Distributed neural processing, parallel streams of information, and behavioral outputs. Consciousness is real, but it is not *centralized*.
  *   **Radicalness:** **Moderate/Trivial.** Almost no working neuroscientists or physicalist philosophers believe in a literal Cartesian Theater anymore. Accepting this does not require denying that experiences feel like something.
  *   **Proponents:** Daniel Dennett (*Consciousness Explained*), Gilbert Ryle, most contemporary cognitive scientists.
  *   **Key Distinction:** This denies a *model* of consciousness, not consciousness itself.

  ### 2. Phenomenal Illusionism (The "Hard" Illusionism)
  **"Phenomenal properties (qualia) do not exist."**

  *   **What is Illusory:** The intrinsic, ineffable, private "feel" of experience. The claim is that when you introspect, you *judge* that you have a raw feel (a "quale"), but that judgment is false. There is no "what it is like" over and above the functional/physical processing. The "glow" of consciousness is a user-interface trick the brain plays on itself.
  *   **What Remains:** Access consciousness (reportability, functional role), physical brain states, and the *belief* that one has phenomenal experiences. The "seeming" is real, but what it seems *to be* (phenomenal properties) is not.
  *   **Radicalness:** **Extremely Radical.** This denies the existence of the "Hard Problem." It claims the Hard Problem is a cognitive illusion generated by faulty introspection.
  *   **Proponents:** Keith Frankish, Daniel Dennett (*Quining Qualia*), Patricia Churchland (Eliminativism), some readings of Wilfrid Sellars.
  *   **Key Distinction:** This is the view that usually causes the heated arguments. It is incompatible with Phenomenal Realism (the view that qualia exist).

  ### 3. The No-Self Thesis (Illusion of Subjectivity)
  **"There is no 'owner' of the experience."**

  *   **What is Illusory:** The enduring subject, the "I," or the agent that stands behind experiences and possesses them. The sense that *someone* is watching the movie.
  *   **What Remains:** The experiences themselves (which may still be phenomenal/real), occurring as events in a body/brain. A "narrative center of gravity" (Dennett) or a bundle of perceptions (Hume), but no ontological self.
  *   **Radicalness:** **Radical (Metaphysically), Conservative (Phenomenally).** You can hold this view while still believing that pain feels like pain. It targets the *subject*, not the *experience*.
  *   **Proponents:** David Hume, Buddhist Philosophy (Anatta), Thomas Metzinger (*The Ego Tunnel*), Daniel Dennett (Center of Narrative Gravity).
  *   **Key Distinction:** A Phenomenal Realist can accept this. You can say "Pain is real and feels terrible, but there is no 'self' feeling it."

  ### 4. Introspective Skepticism (Error Theory)
  **"We are not authoritative about our own minds."**

  *   **What is Illusory:** The infallibility and transparency of introspection. The idea that we have direct, unmediated access to the nature of our mental states.
  *   **What Remains:** Fallible introspective mechanisms. We have mental states, but our *reports* about them are hypotheses generated by the brain, subject to error and confabulation.
  *   **Radicalness:** **Moderate/Empirical.** This is largely supported by empirical psychology (e.g., change blindness, confabulation studies). It challenges philosophy's reliance on "intuition pumps."
  *   **Proponents:** Eric Schwitzgebel, Peter Carruthers, Nisbett & Wilson, Dennett (Heterophenomenology).
  *   **Key Distinction:** This says our *knowledge* of consciousness is illusory, not necessarily consciousness itself.

  ---

  ### Compatibility Matrix: Can you hold them together?

  This is where you can cut through the noise in your group.

  1.  **Thesis 1 (No Theater) + Thesis 3 (No Self):** **Highly Compatible.** This is standard Dennett. There is no center, and there is no self.
  2.  **Thesis 1 (No Theater) + Thesis 2 (Phenomenal Illusionism):** **Highly Compatible.** This is the core Frankish/Dennett "Illusionist" package. No center, no qualia.
  3.  **Thesis 3 (No Self) + Phenomenal Realism:** **Compatible.** This is the Buddhist/Phenomenologist position. Experiences are real and have qualitative feel, but they are ownerless. *Note: If someone in your group is coming from a meditation background, they likely mean this, not Thesis 2.*
  4.  **Thesis 2 (Phenomenal Illusionism) + Phenomenal Realism:** **INCOMPATIBLE.** This is the source of the heat. You cannot consistently claim "qualia are illusions" and "qualia are the only thing we know for certain exist."
      *   *The Conflict:* When one person says "stop talking about 'what it's like'" (Thesis 2) and the other says "that's changing the subject" (defending Phenomenal Realism), they are disagreeing on whether the "what it's like" refers to a real property or a false judgment.

  ### Diagnostic Questions for Your Group

  Next time someone drops the slogan, interrupt politely and ask one of these three questions to pin down which thesis they mean:

  1.  **The Property Question:** "When you say it's an illusion, do you mean the *experience* doesn't exist, or just that the *properties* we attribute to it (like ineffability) don't exist?"
      *   *Targets:* Distinguishes Thesis 2 (Illusionism) from Thesis 1 (Anti-Theater).
  2.  **The Subject Question:** "Are you saying the 'I' having the experience is the illusion, or the experience itself?"
      *   *Targets:* Distinguishes Thesis 3 (No-Self) from Thesis 2 (Phenomenal Illusionism).
  3.  **The Error Question:** "Is the illusion that we *have* experiences, or that we *know the nature* of our experiences?"
      *   *Targets:* Distinguishes Thesis 2 (Illusionism) from Thesis 4 (Introspective Skepticism).

  ### Summary for the Meeting
  If you need a quick cheat sheet:
  *   **Homunculus Illusion:** "There's no little man inside." (Almost everyone agrees).
  *   **Self Illusion:** "There's no 'I'." (Buddhists & Dennett agree; Realists might too).
  *   **Phenomenal Illusion:** "There are no qualia/feels." (Frankish & Dennett; **Contested**).
  *   **Introspective Illusion:** "We don't know our own minds." (Psychologists & Dennett; **Contested**).

  The heat in your group is almost certainly coming from conflating the **Self Illusion** (which many accept) with the **Phenomenal Illusion** (which many reject as absurd). If you can separate those two, the conversation should become much more productive.
