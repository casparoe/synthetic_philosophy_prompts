answer: |-
  Here is a draft of the desiderata for your seminar, structured to provoke the kind of meta-theoretical reflection you are aiming for. It is designed to be handed out early in the term, before the specific theories are introduced, to frame the subsequent debate.

  ***

  # The Target Before the Arrow: Desiderata for a Theory of Emotion

  Before evaluating *how* to theorize emotion (judgment, perception, feeling, etc.), we must agree on *what* is being theorized. The following list represents the phenomena any adequate account of emotion should explain. Note that these are not necessarily agreed-upon facts, but rather the *explanatory burdens* a theory must carry.

  ### I. Structural Desiderata (The Architecture of the State)
  1.  **Intentionality (Aboutness):** The theory must explain how emotions are directed at objects.
      *   *Case:* Fear is not just a flutter; it is fear *of the bear*. Anger is anger *at the insult*. A theory that reduces emotion to non-directed physiological turbulence fails to distinguish fear from indigestion.
  2.  **Phenomenology (The "Feel"):** The theory must account for the distinctive qualitative character of emotional experience.
      *   *Case:* There is a difference between what it feels like to be nostalgic and what it feels like to be anxious, even if the physiological arousal is similar. A theory that treats emotion as a purely functional input-output mechanism risks explaining the role of emotion while leaving out the experience of it.
  3.  **The Mind-Body Interface:** The theory must relate the cognitive/evaluative dimension to the somatic/bodily dimension.
      *   *Case:* Emotions involve heart rates, facial expressions, and hormonal shifts, but also appraisals and beliefs. A theory must explain why these two dimensions are coupled rather than accidental neighbors.

  ### II. Functional Desiderata (What Emotions Do)
  4.  **Motivational Force:** The theory must explain the connection between emotion and action.
      *   *Case:* Fear typically motivates avoidance; anger motivates confrontation. Unlike a neutral belief (e.g., "it is raining"), an emotion provides a *reason for acting* that feels urgent.
  5.  **Rational Integrability:** The theory must explain how emotions can be rational or irrational, appropriate or inappropriate.
      *   *Case:* We argue about emotions ("You shouldn't be angry about that"). If emotions were mere reflexes like sneezing, they would be outside the space of reasons. If they are judgments, they are subject to logical norms.
  6.  **Recalcitrance:** The theory must explain how emotions can persist in direct conflict with conscious judgment.
      *   *Case:* I know the spider is harmless (judgment), yet I am terrified (emotion). If emotion *is* a judgment, this state is logically impossible (holding contradictory beliefs). If emotion is *not* a judgment, how can it be irrational to feel it?

  ### III. Scope and Boundary Desiderata (Drawing the Lines)
  7.  **Emotion vs. Mood:** The theory must distinguish between episodic emotions and diffuse moods.
      *   *Case:* Anger is usually at someone; irritability is a background state without a specific object. A theory that makes object-directedness essential must explain moods as a different category or a degenerate case.
  8.  **Developmental and Cross-Cultural Variability:** The theory must account for the tension between universal patterns and cultural specificity.
      *   *Case:* Facial expressions for basic distress appear cross-culturally, yet the German *Schadenfreude* or the Ifaluk *fago* suggest emotional categories are socially constructed. A theory must decide if "emotion" is a natural kind or a folk category.
  9.  **Non-Paradigmatic Agents:** The theory must specify its stance on infants and non-human animals.
      *   *Case:* A dog appears to feel guilt; an infant displays distress. If the theory requires complex concepts (e.g., "justice"), it excludes them. If it includes them, it must explain how emotion exists without language or sophisticated cognition.
  10. **Consciousness:** The theory must take a stance on whether an emotion must be felt to exist.
      *   *Case:* Can I be unconsciously angry? Implicit bias research suggests affective processing happens without awareness. If a theory requires consciousness, it may conflict with empirical data on unconscious affect.

  ***

  # Analysis for the Instructor

  ### 1. The Intractable Tensions
  The persistence of the debate stems from the fact that satisfying one desideratum often jeopardizes another. The list above is not a harmony; it is a set of trade-offs.

  *   **Rationality vs. Recalcitrance:** This is the engine of the Cognitivism vs. Perceptualism debate. To satisfy **Rational Integrability**, you want to link emotion to judgment (making it responsive to reason). But to satisfy **Recalcitrance**, you must decouple emotion from judgment (allowing it to resist reason). *Perceptual theories* attempt to solve this by modeling emotion on optical illusions (I see the stick is straight, but it looks bent), but this risks weakening the **Motivational Force** (illusions don't always drive action like fears do).
  *   **Intentionality vs. Non-Paradigmatic Agents:** To satisfy **Intentionality** robustly, you usually require conceptual content (fearing *that* the bear will attack). This threatens the inclusion of **Infants and Animals**, who may lack the requisite concepts. If you lower the bar to include them, you risk making the intentionality so thin it fails to distinguish emotion from mere appetite or reflex.
  *   **Phenomenology vs. Unconscious Processing:** Satisfying **Phenomenology** requires a conscious subject. Satisfying the empirical reality of **Unconscious Affect** requires functionalism that allows for sub-personal processing. You generally cannot have a theory that prioritizes "what it is like" while also fully embracing unconscious emotional states as *genuine emotions* rather than mere precursors.

  ### 2. The Most Exclusionary Requirement
  **The Consciousness Requirement (Desideratum #10).**

  While Intentionality is the most discussed, the requirement that emotions must be *conscious states* does the most work to exclude otherwise plausible theories.
  *   **Why:** It rules out functionalist accounts dominant in psychology and neuroscience, which treat emotion as a regulatory mechanism that can operate entirely sub-personally (e.g., threat detection systems that trigger avoidance before awareness). It also excludes Freudian accounts of repressed emotion and contemporary work on implicit bias, where affective valence drives behavior without phenomenological presence.
  *   **The Cost:** Insisting on consciousness preserves the link to **Phenomenology** and our first-person authority, but it severs the link between philosophy of emotion and affective science. It forces the theory to be about *experiences* rather than *mechanisms*. If you drop this requirement, you gain scientific traction but risk losing the "feeling" that makes emotion distinct from cold cognition.

  ### 3. The Vulnerability: Where the List Could Break
  The consideration most likely to force a revision of this list is the **Constructivist Challenge (from Desideratum #8).**

  *   **The Argument:** If research in cultural psychology and neuroscience (e.g., Lisa Feldman Barrett's theory of constructed emotion) demonstrates that there is no common physiological or neural fingerprint shared by all instances of "fear" or "anger," then "emotion" may not be a natural kind.
  *   **The Consequence:** If "emotion" is merely a folk category we use to group disparate states (like the category "weed" in botany), then searching for necessary and sufficient conditions (a taxonomy of theories) is a category mistake.
  *   **My Vulnerability:** I am currently operating under the assumption that there is a *thing* to be theorized. If the evidence suggests that the only thing unifying "emotions" is our social practice of labeling them, then **Desiderata 1, 2, and 5** (Intentionality, Phenomenology, Rationality) become contingent on culture rather than essential features of a mental state. This would force us to abandon the project of a universal taxonomy in favor of a pragmatic or pluralistic approach. That is the single argument that would compel me to tear up this list.
