prompt: |-
  I've been chewing on this idea about creativity for a while now and I'm hoping you can tell me if it's been studied properly or if it has a name. I'm not an academic — just someone who thinks about this stuff in my spare time — so forgive me if I'm stumbing toward something obvious.

  Here's the pattern I keep noticing. When someone makes something really creative — a piece of music, a joke, a new scientific theory, whatever — it almost never comes out of nowhere. It's like they take some existing thing that everybody knows, and then they start fiddling with it. Not randomly, but like there are these invisible sliders or dials on the concept, and they go through turning one up and another down, seeing what happens each time. A jazz musician takes a standard and starts bending the rhythm, then the harmony, then the phrasing — it's the same tune but with all the knobs at different settings. A comedian takes a normal situation and just keeps cranking up the absurdity dial one notch at a time, and each notch is a new joke. Even in science, someone takes an equation and goes "what if this term were negative instead of positive" or "what if this goes to infinity here" — they're just twiddling parameters on a familiar structure.

  I guess what I'm asking is: is there a name for this specific model of creativity — the idea that the crux of it is exploring a space of variations by tweaking parameters on a familiar theme? I'm not talking about general "thinking outside the box" or "divergent thinking" — those are too vague. I'm talking about this very specific mechanism where you have a mental representation of something and you systematically vary its features. The closest thing I've stumbled on is something about "conceptual blending" but that seems more about combining two different things into one, whereas what I'm describing is more like exploring the neighborhood of a single thing.

  You're an expert on creativity research and cognitive science — I'd love to know if there's established terminology for this, or if some philosopher or cognitive scientist has laid it out properly. And please don't just give me a name — I want to know how the concept is carved out, what its boundaries are, how it's different from nearby ideas like brainstorming or combinatorial creativity. If there isn't an established name, what would you call it? Take your time with this — maybe start by thinking through a few examples of your own to see if the pattern holds up, and then walk me through the conceptual landscape.
