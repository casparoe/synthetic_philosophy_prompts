  8.  **Final Polish:**
      *   Make sure the distinction between *measurement* and *optimization* is clear.
      *   Ensure the "Escalate" path is clear (when the goal itself is contested).
      *   Verify the time estimate (1 hour). The steps need to be concise enough.

  *(Self-Correction on the University Example)*: If I make the Police one the "No-Go," I should make the University one a "Proceed with Caution/Modification" to show nuance. Actually, the prompt asks for *at least one* to recommend against. The Police one is the obvious candidate for a hard stop. The University one is often accepted despite flaws, so showing *why* it needs modification is valuable. I will structure the University one to show it passes some tests but fails others, requiring mitigation, whereas the Police one fails a fundamental safety test.

  *(Refining the Procedure Name)*: "The Goodhart Stress Test" or "The Metric Integrity Protocol." Let's go with "The Metric Integrity Protocol (MIP)" to sound operational.

  *(Final check on constraints)*: "Begin by working through what conditions actually make a metric vulnerable..." -> I need to include a brief conceptual preamble before the procedure to satisfy the "Think carefully before you write" instruction, showing my reasoning on vulnerability conditions.

