prompt: |-
  I am a professor of philosophy who, for the past several years, has also been running a workshop for civil servants, engineers, and compliance officers on a problem they all recognize but rarely know how to handle: the tendency of a quantitative target to stop measuring what it was supposed to measure once anyone is actually held to it. In the economics literature this goes under the name of Goodhart's law; in AI safety it is called specification gaming; the underlying phenomenon is the same — an optimizer finds the path of least resistance through your metric rather than through the value the metric was meant to stand for. My workshop participants absorb the examples readily enough, but they keep asking the same question: "All right, we see the trap. What do we do on Tuesday morning?"

  I would like your help developing something I can hand them. Please act as an expert in both the conceptual structure of Goodhart-type failures and in translating philosophical analysis into operational procedure. Think carefully before you write — begin by working through what conditions actually make a metric vulnerable, what the distinct causal pathways to failure are, and which of those a practitioner can realistically detect from the inside, before you commit to any particular procedural step. Then produce the procedure itself.

  The deliverable is a decision procedure — a checklist or ordered sequence of tests — that a practitioner can run on a proposed metric or specification before it goes live. The practitioner might be a policy analyst designing a performance indicator for a government programme, an engineer writing a system specification, a regulator drafting a compliance standard, or a manager setting team KPIs. Assume they are intelligent and know their domain well, but have no background in philosophy, economics, or AI alignment. They have roughly an hour to spend per metric. The stakes are high: a gamed metric can waste large sums of money, distort an entire organization's activity, and destroy public trust.

  The procedure should do the following:

  1. Help the practitioner identify whether their metric is vulnerable to Goodhart-style degradation or specification gaming, and if so, how severely — distinguishing metrics that are fundamentally misaligned with the underlying value from metrics that are adequate under low pressure but will break under optimization.

  2. Walk them through a series of questions or tests in a fixed order, with clear stopping points: where they can proceed, where they should revise the metric, and where they should escalate because the question cannot be settled at their level.

  3. Flag every step that requires a judgment call rather than a mechanical test, and say honestly what kind of judgment is needed — domain expertise, values, political trade-offs, forecasting — so that the practitioner knows what they are being asked to supply and what they are not.

  4. State explicitly what the procedure cannot catch: which failure modes it is blind to, what background knowledge it assumes, and under what conditions it will produce false confidence.

  After laying out the procedure, apply it to two worked examples, showing the reasoning at each step:

  (a) A university is designing a metric for "research quality" to allocate funding across departments. The proposal is a weighted count of publications, with weights based on journal impact factors. Run the procedure on this metric.

  (b) A city government is designing a metric for "police effectiveness" and proposes using the number of arrests per officer per month. Run the procedure on this metric.

  For at least one of the two examples, the procedure should recommend against using the metric as designed — and ideally that should be the case where the recommendation will be politically unwelcome to the institution that proposed it. Part of what I want my workshop participants to see is that a well-built procedure will sometimes tell them what they do not want to hear.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Professor of philosophy running a workshop for civil servants, engineers, compliance officers.
      *   **Problem:** Goodhart's Law / Specification Gaming (metrics stop measuring value once optimized).
      *   **Need:** A practical decision procedure (checklist/ordered sequence) for practitioners to test metrics *before* they go live.
      *   **Constraints:**
          *   Practitioners are smart domain experts but not philosophers/economists/AI safety experts.
          *   Time budget: ~1 hour per metric.
          *   Stakes: High (money, organizational distortion, public trust).
          *   Must distinguish between fundamental misalignment vs. pressure-induced breakage.
          *   Must have fixed order, clear stopping points (proceed/revise/escalate).
          *   Must flag judgment calls (what kind of judgment?).
          *   Must state limitations (what it can't catch).
          *   Must include two worked examples (University Research, Police Arrests).
          *   One example must recommend *against* the metric (preferably the politically unwelcome one).
      *   **Tone:** Expert, operational, clear, honest about limitations.

  2.  **Deconstruct the Phenomenon (Goodhart/Specification Gaming):**
      *   *Why do metrics fail?*
          *   **Proxy Drift:** The metric ($M$) correlates with the Goal ($G$) naturally, but $M$ is not $G$. When you optimize $M$, you decouple it from $G$.
          *   **Gaming:** Agents actively manipulate $M$ without improving $G$ (cheating, cream-skimming).
          *   **Myopia:** Optimizing $M$ harms long-term $G$ (e.g., burning fuel to hit speed targets).
          *   **Complexity/Narrowness:** $G$ is multi-dimensional; $M$ captures only one slice, causing neglect of others.
      *   *Conditions for Vulnerability:*
          *   High stakes (rewards/punishments tied to $M$).
          *   Agent control (agents can influence $M$ independently of $G$).
          *   Information asymmetry (agents know how to game better than principals).
          *   Static metric in a dynamic environment.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* 1. Define goal. 2. Define metric. 3. Ask "Can you cheat?" 4. Ask "Is it complete?" 5. Decide.
      *   *Critique 1:* Too vague. Needs specific tests. Needs to distinguish "low pressure" vs. "high pressure" failure. Needs to flag judgment calls.
      *   *Attempt 2 (Adding Structure):* Let's create phases. Phase 1: Alignment. Phase 2: Controllability. Phase 3: Pressure Testing. Phase 4: Mitigation.
      *   *Refining for the User:* The user wants a "Tuesday Morning" tool. It needs to feel like a safety inspection. Let's call it the "Metric Stress Test."
      *   *Key Insight:* The core distinction is between *Correlation* (natural link) and *Causation* (does improving metric actually improve goal?). Also, the *Incentive Gradient* (how hard will people push?).

      *   *Developing the Steps:*
          1.  **Goal Definition:** What is the *actual* value? (Judgment: Values).
          2.  **Proxy Validity:** Does M track G *without* incentives? (Judgment: Domain expertise).
          3.  **Controllability:** Can agents move M without moving G? (Judgment: Process knowledge).
          4.  **Completeness:** Does M capture negative externalities? (Judgment: Ethics/Scope).
          5.  **Pressure Test:** What happens when bonuses/jobs depend on this? (Judgment: Behavioral forecasting).
          6.  **Decision:** Go/No-Go/Revise.

      *   *Adding "Stop/Proceed/Escalate":* Need clear gates. If Goal is vague -> Escalate. If Controllability is high -> Revise. If Pressure Test fails -> No-Go.
      *   *Flagging Judgments:* Explicitly label them [JUDGMENT CALL].

  4.  **Developing the Worked Examples:**
      *   **Example A (University Research):**
          *   Goal: Research Quality.
          *   Metric: Weighted Publication Count.
          *   Analysis: High controllability (salami slicing, predatory journals). Low completeness (ignores teaching, societal impact). High pressure (tenure/funding).
          *   Outcome: Likely "Revise" or "No-Go" depending on strictness. Let's make it "Revise heavily/Combine with qualitative."
      *   **Example B (Police Arrests):**
          *   Goal: Public Safety/Effectiveness.
          *   Metric: Arrests per Officer.
          *   Analysis: Extremely high controllability (arrest innocents, target easy crimes). Negative correlation possible (more arrests = less trust = less safety). High pressure (quotas).
          *   Outcome: Strong "No-Go." This is the politically unwelcome one.

  5.  **Refining the Limitations Section:**
      *   What can't this catch?
          *   Collusion (if everyone agrees to game).
          *   Black Swan events.
          *   Metrics that seem safe but become vulnerable due to external tech changes.
          *   The "Human Factor" (malice vs. incompetence).

  6.  **Writing the Content (incorporating the "Professor" persona):**
      *   Tone should be respectful of their expertise but firm on the logic.
      *   Structure: Introduction -> The Procedure (The "Metric Stress Test") -> Limitations -> Worked Examples.
      *   Ensure the "Tuesday Morning" feel is present (practical, actionable).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between low-pressure and high-pressure failure?
      *   *Fix:* Add a specific step about "Incentive Intensity." A metric might be okay for monitoring but not for bonuses.
      *   *Check:* Did I flag judgment calls?
      *   *Fix:* Use bold tags like **[JUDGMENT: DOMAIN EXPERTISE]**.
      *   *Check:* Is the order fixed?
      *   *Fix:* Number the steps 1-5 with clear "Gate" decisions.
      *   *Check:* Did I meet the "politically unwelcome" requirement?
