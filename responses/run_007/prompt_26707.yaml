          *   *Licenses Pacifism?* Yes, by definition. However, this reveals the slogan is actually a moral premise disguised as a factual observation.

      **The Trap:** The slogan's rhetorical power relies on ambiguity. Speakers invite listeners to accept the plausible truth of Thesis 2 (violence doesn't fix hearts) to subsidize the false empiricism of Thesis 1 (violence doesn't work) or the absolute prohibition of Thesis 4. A charitable interlocutor should press: "Do you mean violence is ineffective, or that it is immoral?" If ineffective, they are wrong. If immoral, they should argue ethics, not outcomes. If they mean it doesn't solve *animosity*, agree—but note that stopping murder doesn't require making friends.

