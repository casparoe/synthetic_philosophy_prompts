  The slogan "violence never solves anything" functions as a rhetorical chameleon. To evaluate it charitably, we must disentangle four distinct theses often conflated within it.

  1.  **Instrumental Inefficacy:** *Claim:* Violence cannot achieve immediate physical objectives.
      *   *Plausibility:* False. Violence coerces, destroys, and kills. Punching Richard Spencer knocks him down; Allied bombing degraded Nazi capacity.
      *   *Licenses Pacifism?* No. Since the claim is empirically false, it supports no logical conclusion.

  2.  **Permanent Conflict Resolution:** *Claim:* Violence cannot resolve underlying grievances or animosity.
      *   *Plausibility:* High. Killing a tyrant doesn't erase the ideology that spawned him.
      *   *Licenses Pacifism?* No. This is the crucial "true but irrelevant" case. Even if violence doesn't create lasting love, it may stop immediate slaughter (e.g., humanitarian intervention). Containment is valuable even if reconciliation fails.

  3.  **Net Negative Utility:** *Claim:* Violence always creates more problems than it fixes.
      *   *Plausibility:* Debatable. Often true in geopolitics, less so in immediate self-defense. Stopping an active shooter via violence clearly solves the problem of the shooter.
      *   *Licenses Pacifism?* Yes, *if* true. If violence invariably worsens aggregate outcomes, prohibition follows. However, counterexamples (stopping genocide) suggest the "never" qualifier is false.

  4.  **Moral Absolutism:** *Claim:* Violence is intrinsically wrong, regardless of outcome.
      *   *Plausibility:* A coherent ethical stance, but not an empirical claim about "solving."
      *   *Licenses Pacifism?* Yes, by definition. However, this reveals the slogan is actually a moral premise disguised as a factual observation.

  **The Trap:** The slogan's rhetorical power relies on ambiguity. Speakers invite listeners to accept the plausible truth of Thesis 2 (violence doesn't fix hearts) to subsidize the false empiricism of Thesis 1 (violence doesn't work) or the absolute prohibition of Thesis 4. A charitable interlocutor should press: "Do you mean violence is ineffective, or that it is immoral?" If ineffective, they are wrong. If immoral, they should argue ethics, not outcomes. If they mean it doesn't solve *animosity*, agree—but note that stopping murder doesn't require making friends. The slogan survives only by sliding between these meanings mid-argument.
