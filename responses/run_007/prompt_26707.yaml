      4. **Moral Absolutism:** Violence is intrinsically impermissible. *Plausibility:* Philosophical stance, not empirical. *License:* Yes, by definition. But this admits the slogan is moral, not factual. It disguises a value judgment as a description of reality.

      *Conclusion:* The slogan works best when listeners confuse Thesis 2 (true) with Thesis 1 (false) or Thesis 3 (debatable). It allows speakers to claim empirical high ground while asserting moral absolutes.

