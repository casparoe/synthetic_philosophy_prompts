answer: |-
  **INTERNAL GUIDANCE DOCUMENT: PROBABILITY INTERPRETATION & COMMUNICATION PROTOCOL (PICP)**

  **To:** Modeling Division, Risk Assessment Unit, Communications Office
  **From:** Policy Fellowship Unit
  **Subject:** Decision Procedure for Classifying and Communicating Probabilistic Claims
  **Time to Complete:** ~15 Minutes per Claim

  ---

  ### **1. PURPOSE**
  Probabilistic forecasts (e.g., "23% chance," "92% probability") are not uniform. Some describe the physical behavior of a virus; others describe the state of our knowledge. Confusing these leads to policy errors (e.g., treating ignorance as safety) and communication failures (e.g., overstating certainty).

  This protocol helps staff identify the *interpretive status* of a probability claim, determine if that status matters for the decision at hand, and select appropriate language. It does not replace statistical review but acts as a semantic and decisional filter.

  ---

  ### **2. THE PROCEDURE**

  Complete the following five steps. If you answer **YES** to any **ESCALATION FLAG**, stop and consult a Senior Analyst or the Philosophy/Policy Fellow before finalizing communication.

  #### **STEP 1: PROVENANCE CHECK (Where did the number come from?)**
  *Identify the statistical engine generating the claim.*

  1.  **Data Source:** Is the number derived primarily from:
      *   (A) Long-term surveillance data / repeated trials?
      *   (B) A single event / unique scenario (e.g., next quarter's outbreak)?
      *   (C) Expert opinion / prior belief updated by limited data?
  2.  **Model Structure:** Does the model treat the uncertainty as:
      *   (A) Random noise in a fixed system (Stochastic/Frequentist)?
      *   (B) Uncertainty about the parameters themselves (Bayesian/Epistemic)?
      *   (C) A weighted mix of multiple models (Ensemble)?

  > **ESCALATION FLAG 1:** If the answer is (C) for *both* questions, or if you cannot determine whether priors were used, **STOP**. The interpretation is likely hybrid/ambiguous.

  #### **STEP 2: INTERPRETATION MAPPING (What does the number *mean*?)**
  *Map the provenance to a philosophical interpretation.*

  3.  **The "Repeat" Test:** If we could rewind time and run this exact scenario 100 times, would the outcome vary *even if we knew everything*?
      *   **Yes:** The probability reflects **Aleatory Uncertainty** (Inherent randomness/Propensity).
      *   **No:** The probability reflects **Epistemic Uncertainty** (Ignorance/Subjective Belief).
      *   **Unsure/Mixed:** The probability is **Hybrid**.
  4.  **The "Information" Test:** If we got double the data tomorrow, would this number change significantly?
      *   **No (Stable):** It behaves like a **Frequency/Propensity**.
      *   **Yes (Fluid):** It behaves like a **Degree of Belief (Credence)**.

  > **ESCALATION FLAG 2:** If the "Repeat" Test suggests Aleatory but the "Information" Test suggests Epistemic, **STOP**. This indicates a "Masked Uncertainty" risk (treating ignorance as randomness).

  #### **STEP 3: DECISION SENSITIVITY (Does the distinction matter?)**
  *Determine if the interpretation changes the policy action.*

  5.  **The "Wait" Test:** Does interpreting this as "lack of knowledge" (Epistemic) suggest gathering more data, while interpreting it as "random risk" (Aleatory) suggests acting now (e.g., vaccination vs. surveillance)?
      *   **Yes:** Interpretation is **Decision-Critical**.
      *   **No:** Interpretation is **Decision-Neutral**.
  6.  **The "Blame" Test:** If the event occurs (or fails to occur), will stakeholders ask "Was the model wrong?" (Epistemic failure) or "Did we get unlucky?" (Aleatory outcome)?
      *   **Model Wrong:** Requires hedging language.
      *   **Got Unlucky:** Allows frequency language.

  > **ESCALATION FLAG 3:** If Interpretation is **Decision-Critical** and the two interpretations suggest *opposite* actions (e.g., Act vs. Wait), **STOP**. This requires Senior Leadership adjudication on risk tolerance.

  #### **STEP 4: COMMUNICATION TRANSLATION (How do we say it?)**
  *Select language that matches the mapping.*

  7.  **Select Framing:**
      *   **For Aleatory/Frequency:** Use "Expected frequency," "In similar scenarios," "Risk level."
      *   **For Epistemic/Belief:** Use "Confidence," "Current evidence suggests," "Likelihood based on available data."
      *   **For Hybrid:** Use "Projected probability," "Model estimate," explicitly mentioning uncertainty sources.
  8.  **Check for Collapse:** Does the proposed plain-language summary (e.g., "1 in 4 chance") hide a critical uncertainty source identified in Step 1 or 2?
      *   **Yes:** Revise language to include the source of uncertainty.
      *   **No:** Proceed.

  > **ESCALATION FLAG 4:** If the Communications Office insists on a "Percent Chance" phrasing for an **Epistemic** claim with high **Decision Sensitivity**, **STOP**. This is a misrepresentation risk.

  #### **STEP 5: VALUE JUDGMENT ACKNOWLEDGMENT**
  *Explicitly note where technical choices mask values.*

  9.  **Threshold Check:** Was a specific probability threshold (e.g., >20% = "High Risk") chosen based on statistical convention or policy consequence?
      *   *Note:* If policy consequence, this is a value judgment, not a statistical fact.
  10. **Prior Check:** If Bayesian priors were used, were they "conservative" (bias toward inaction) or "precautionary" (bias toward action)?
      *   *Note:* This is an ethical choice dressed as a statistical parameter.

  ---

  ### **3. CASE APPLICATIONS**

  Below is the procedure applied to two current agency forecasts. Note the divergence in output.

  #### **CASE A: Measles Outbreak Forecast**
  *Claim:* 23% probability of >500 cases in Region X next quarter.
  *Method:* Stochastic compartmental model, 5 years weekly data, no expert priors.
  *Proposed Comm:* "About a one-in-four chance."

  | Step | User Input / Observation | Output / Decision |
  | :--- | :--- | :--- |
  | **1. Provenance** | Data: Historical surveillance (A). Model: Stochastic noise (A). | **Frequentist/Propensity Lean.** |
  | **2. Mapping** | Repeat Test: Yes (transmission is inherently stochastic). Info Test: Number stable with more data (model is well-calibrated). | **Aleatory Uncertainty.** |
  | **3. Sensitivity** | Wait Test: No (surveillance is ongoing regardless). Blame Test: "Got Unlucky" if outbreak happens. | **Decision-Neutral.** |
  | **4. Translation** | Framing: Frequency. Check for Collapse: "One-in-four" accurately reflects long-run frequency in similar model runs. | **Endorse Proposed Language.** |
  | **5. Values** | Threshold: 500 cases is a policy threshold, but the 23% is model-derived. | **No Escalation.** |

  **Final Recommendation for Case A:**
  *   **Status:** **CLEARED.**
  *   **Guidance:** The proposed language ("one-in-four chance") is acceptable. The probability functions effectively as a propensity/frequency because the model is well-calibrated to historical stochasticity.
  *   **Caveat:** Ensure the briefing notes clarify that this assumes *no change* in vaccination coverage (ceteris paribus).

  ***

  #### **CASE B: Vaccine Efficacy Claim**
  *Claim:* 92% probability that efficacy is ≥80%.
  *Method:* Bayesian analysis, single-season trial, structured expert priors (n=12).
  *Proposed Comm:* "The vaccine is 92% likely to be highly effective."

  | Step | User Input / Observation | Output / Decision |
  | :--- | :--- | :--- |
  | **1. Provenance** | Data: Single trial (B). Model: Bayesian with Expert Priors (C). | **Hybrid / Epistemic Lean.** |
  | **2. Mapping** | Repeat Test: No (efficacy is a fixed biological property, we just don't know it). Info Test: Yes (number would shift with more trial seasons). | **Epistemic Uncertainty (Credence).** |
  | **3. Sensitivity** | Wait Test: **YES.** Epistemic view suggests "confidence is high but data is thin" (might warrant phased rollout). Aleatory view suggests "it works 92% of the time" (might warrant mass rollout). | **Decision-Critical.** |
  | **4. Translation** | Framing: Proposed language ("92% likely") sounds like a physical propensity. **Collapse Detected.** | **REVISE LANGUAGE.** |
  | **5. Values** | Prior Check: Experts may have been precautionary. | **ESCALATION FLAG 3 & 4.** |

  **Final Recommendation for Case B:**
  *   **Status:** **ESCALATED.**
  *   **Guidance:** Do **not** use "92% likely." This implies the vaccine's biological performance varies randomly. The number reflects *our confidence* given limited data and expert opinion.
  *   **Revised Language:** "Based on current trial data and expert assessment, we have **high confidence (92%)** that efficacy exceeds 80%."
  *   **Reason for Escalation:** The distinction matters for rollout speed. Treating this as a physical frequency ignores the risk that the expert priors were over-optimistic. Senior leadership must decide if "92% confidence" is sufficient for national rollout or if further data is required.

  ---

  ### **4. LIMITATIONS AND FAILURE MODES**

  This procedure is a tool for clarity, not a substitute for judgment. Users must be aware of the following boundaries:

  **1. What It Cannot Resolve:**
  *   **Ontological Disputes:** The procedure cannot determine if the world is *actually* deterministic or random. It only categorizes how the *model* treats uncertainty.
  *   **Conflicting Expert Priors:** If the "structured protocol" in Case B hid deep disagreement among the 12 experts (e.g., averaged out), this procedure treats the prior as a monolith. It cannot detect "consensus by averaging."
  *   **Political Mandates:** If Ministry leadership demands a "percent chance" regardless of epistemic uncertainty, this procedure flags the risk but cannot prevent the misrepresentation.

  **2. Inadequate Audiences:**
  *   **The General Public:** Even the revised language ("high confidence") is often interpreted as frequency by lay audiences. This procedure helps the *agency* speak honestly; it cannot guarantee the *public* hears accurately.
  *   **Legal Counsel:** In liability scenarios (e.g., vaccine injury), legal definitions of "probability" may override statistical interpretations.

  **3. Conditions for Misfire:**
  *   **Black Box Models:** If the modeling team cannot explain how the ensemble weights were derived (common in machine learning pipelines), Step 1 fails. The user must default to "Hybrid/Escalate."
  *   **Time Pressure:** In acute outbreak response, 15 minutes may be too long. In these cases, the default assumption should be **Epistemic** (assume we know less than the number suggests) to prevent overconfidence.
  *   **Value Judgments:** Step 5 asks users to identify value judgments, but does not provide a method to resolve them. A "precautionary prior" is an ethical stance. This procedure exposes it but does not validate it.

  ### **5. IMPLEMENTATION NOTE**
  This protocol is effective only if modelers are willing to disclose their interpretive commitments. It is recommended that all model output templates include a mandatory metadata field: **"Uncertainty Type (Aleatory/Epistemic/Hybrid)."** Without this, the burden of discovery falls on the risk assessor, increasing the likelihood of error.

  ---
  **Approved by:** Risk Assessment Division Head
  **Review Date:** 12 Months from Issuance
