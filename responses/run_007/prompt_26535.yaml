          *   *Nuance:* In (a), it's about "seeing it through" (Completion). In (d), it's about "signed agreement" (Contract). In (f), it's about "trust capacity" (Agent).
          *   In (b), (c), (e), the *agent/product* failed to deliver evidence of future success.
          *   *Refinement:* **The Principle of Committed Agency.** He distinguishes between *external* factors reducing efficiency (where he honors commitment/trust) and *internal* factors reducing viability (where he cuts).
