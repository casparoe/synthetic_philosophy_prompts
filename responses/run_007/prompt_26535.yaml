          *   In (f), reason was "legislation changed." He felt obligation due to trust in agent.
          *   In (b), (c), (e), the reason was "The grantee/product isn't delivering."
          *   *Core Principle:* **The Integrity of Agency Principle.**
          *   Dr. Okonkwo distinguishes between **exogenous shifts** (or completion proximity) where the grantee is still doing their best/holding up their end, versus **endogenous failure** where the grantee/product is demonstrably underperforming.
          *   If the grantee is holding up their end (even if the world changed or we found a better option), he honors the partnership.
