  3.  **Synthesize and Identify Candidate Principles:**

      *   *Observation 1:* Dr. Okonkwo is *not* a pure sunk-cost ignoramus. In (b), (c), and (e), he explicitly rejects sunk costs and terminates funding despite significant expenditure when the *future* value isn't there.
      *   *Observation 2:* He *does* continue funding in (a), (d), and (f) despite diminished marginal returns or changed circumstances.
      *   *Observation 3:* What distinguishes (a, d, f) [Fund] from (b, c, e) [Terminate]?
          *   (a) Film: "Nearly finished," "Obligation." (Completion/Relationship)
          *   (d) Fellowship: "Signed agreement," "Credibility." (Contract/Reputation)
          *   (f) Research: "Track record," "Trust capacity." (Agent Quality/Trust)
          *   ---
          *   (b) Health: "Null results," "Unlikely to yield." (Evidence of Failure)
          *   (c) Arts: "Less capable leadership." (Agent Quality Drop)
          *   (e) Tech: "Flat traction," "Numbers do not support." (Evidence of Failure)

      *   *Hypothesis 1: Pure Forward-Looking Utility.* (Rejects sunk costs).
          *   *Fail:* Doesn't explain (a). In (a), he admits marginal benefit < marginal cost but funds anyway due to "obligigation."

      *   *Hypothesis 2: Sunk Cost Fallacy.* (Throw good money after bad).
          *   *Fail:* Doesn't explain (b), (c), (e). He cuts losses there ruthlessly.

      *   *Hypothesis 3: Relational/Contractual Integrity vs. Evidentiary Failure.*
          *   He funds when there is a *promise* or *trust* involved that hasn't been violated, even if efficiency drops.
