          *   Dr. Okonkwo honors commitments (financial or relational) *unless* the grantee's performance or objective data demonstrates that further funding will not achieve the core intent of the grant. He treats sunk costs as irrelevant *except* where they represent a near-completion state or a formal covenant that carries reputational risk if broken.
