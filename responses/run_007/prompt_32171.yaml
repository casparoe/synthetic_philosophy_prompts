      *   **Requirements:**
          *   Write a decision procedure (sequence of questions, stopping rules, evidence standards).
          *   Flag value-laden decisions (where humans must decide, not the algorithm).
          *   Usable by a programme officer (no philosophy/econ degree, max 1 day research).
          *   Run the procedure on three specific cause areas:
              1.  Neglected Tropical Disease (NTD) Vaccine (200k affected, crowded field).
              2.  Electoral Reform Advocacy (Stable democracy, systemic impact).
              3.  UK Hospice End-of-Life Care Pilot (Local, tangible).
