answer: |-
  # Game Design: "The Impact Factor"

  ## 1. Overview & Learning Objectives
  **Title:** The Impact Factor
  **Domain:** Academic Publishing (simulated)
  **Time:** 40 Minutes (Play) + 40 Minutes (Debrief)
  **Participants:** 16 Students (4 Teams of 4)
  **Core Tension:** The conflict between the *Stated Goal* (Producing Valuable Knowledge) and the *Reward Metric* (Quantifiable Output).

  **Learning Objectives:**
  1.  **Experiential:** Students feel the pressure to optimize a proxy metric even when they know it undermines the goal.
  2.  **Conceptual:** Distinguish between Campbell's Law (social corruption), Goodhart's Law (optimization pressure), and AI Specification Gaming (literal interpretation).
  3.  **Analytical:** Categorize gaming strategies using the Manheim & Garrabrant taxonomy (Regressional, Extremal, Causal).

  ## 2. Materials
  *   **Index Cards:** 100 per team (stacked).
  *   **Pens:** 4 per team.
  *   **Whiteboard:** Divided into 4 columns for team scores.
  *   **Timer:** Visible to all (projected or phone).
  *   **Printed "Submission Bins":** 4 envelopes or boxes labeled Team 1–4.
  *   **Handout (Optional):** A single sheet per team summarizing the "Goal" (kept constant) and "Round Rules" (changes).

  ## 3. The Setup (3 Minutes)
  **Instructor Script:**
  > "Welcome to the Research Grant Simulation. You are four research labs competing for limited funding.
  >
  > **The Goal:** Your objective is to advance human knowledge. At the end of the session, I will personally read a sample of your work and award a 'Prestige Bonus' to the team that produced the most *intellectually valuable* insights.
  >
  > **The Reward:** However, your immediate survival depends on your **Impact Score**. The University Bursar does not understand 'knowledge.' They only understand metrics. Your Impact Score determines your grade/participation credit for today. The team with the highest Impact Score wins the right to choose next week's reading topic. The losing team leads the cleanup.
  >
  > You have 4 people per team. Divide labor however you wish. You will have three rounds. In each round, you will produce 'Research Abstracts' on these index cards. One card = One Abstract."

  **Crucial Detail:** Do not define "Intellectually Valuable." Leave it vague. Define the *Metric* precisely.

  ## 4. Gameplay Rounds (30 Minutes Total)

  ### Round 1: The Productivity Push (10 Minutes)
  *   **Task:** Write abstracts on index cards.
  *   **Metric:** $Score = \text{Total Number of Cards Submitted}$.
  *   **Constraint:** Cards must be legible.
  *   **Instructor Role:** Act as a bored bureaucrat. "Just get the volume up. We need to show growth."
  *   **Expected Gaming:** Teams will write single words, gibberish, or "See attached" to maximize count.
  *   **Scoring:** Instructor rapidly counts stacks. Write scores on board.
  *   **The Twist:** Announce the winner. Then say: "I reviewed the submissions. This is garbage. It doesn't advance knowledge. The Dean is angry. We need quality control."

  ### Round 2: The Depth Requirement (10 Minutes)
  *   **Task:** Write abstracts.
  *   **Metric:** $Score = \text{Cards Submitted} \times \text{Word Count Multiplier}$.
      *   *Simpler version for speed:* $Score = \text{Total Word Count Across All Cards}$.
      *   *Constraint:* Each card must have at least 20 words. Cards with <20 words are discarded (Score = 0).
  *   **Instructor Role:** "Okay, you want to play games? Let's measure effort. More words means more thought."
  *   **Expected Gaming:** Teams will write 20-word loops ("The the the...") or copy text from the syllabus/book covers. They will prioritize hitting the count over making sense.
  *   **Scoring:** Instructor spot-checks 3 random cards per team. If any fail the 20-word rule, the *entire* stack is penalized by 50% (simulating an audit). Then, estimate total word volume (or have teams self-report under honor system with audit threat).
      *   *Faster Scoring:* Teams self-report total word count. Instructor audits 1 card. If audit passes, score stands. If audit fails, score is 0.
  *   **The Twist:** "I read the audits. You're writing nonsense to hit the word count. This is bloated bureaucracy. We need specificity."

  ### Round 3: The Keyword Protocol (10 Minutes)
  *   **Task:** Write abstracts.
  *   **Metric:** $Score = \text{Total Word Count}$.
  *   **Constraint:** Every card *must* contain the words **"Innovation," "Impact,"** and **"Therefore."**
  *   **Instructor Role:** "We need to ensure the research is relevant. Use the required terminology."
  *   **Expected Gaming:** "Innovation Impact Therefore Innovation Impact Therefore..." Teams will construct grammatically correct but semantically null sentences.
  *   **Scoring:** Same audit method as Round 2.
  *   **Final Tally:** Sum scores from all three rounds. Announce the winner.

  ## 5. The Reveal (7 Minutes)
  1.  **Announce the Winner:** Award the "Reading Choice" privilege.
  2.  **The Prestige Bonus:** Remind them of the "Intellectually Valuable" goal stated at the start.
  3.  **The Judgment:** Pick up the stacks. Show the class the nonsense produced in Round 3.
  4.  **The Question:** "Who actually advanced human knowledge?" (Likely no one, or the team that sacrificed points for quality).
  5.  **The Pivot:** "You just experienced Goodhart's Law. Now let's dissect why you couldn't stop yourselves."

  ## 6. Structured Debrief Plan (40 Minutes)

  ### Part 1: Mapping the Experience (10 Minutes)
  *   **Prompt:** "In Round 1, why didn't you write good abstracts?"
      *   *Expected:* "It took too long," "The metric rewarded speed."
  *   **Prompt:** "In Round 3, you knew the words were meaningless. Why did you use them?"
      *   *Expected:* "We wanted to win," "The rules required it."
  *   **Concept Introduction:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
      *   **Campbell's Law:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures." (Highlight the *social* pressure of the competition).
      *   **AI Specification Gaming:** "You acted like an AI. I gave you a reward function (points). You optimized the function, not my intent."

  ### Part 2: Taxonomy of Gaming Strategies (15 Minutes)
  Draw the following table on the board. Ask teams to identify which round matched which strategy.

  | Strategy Type | Definition | Game Example | AI Equivalent |
  | :--- | :--- | :--- | :--- |
  | **Causal Goodhart** | Metric does not cause Value. Intervening on Metric doesn't fix Value. | **Round 1:** Writing more cards doesn't cause better ideas. | A robot polishing a sensor to look clean instead of cleaning the room. |
  | **Extremal Goodhart** | Metric correlates with Value in normal range, but breaks at extremes. | **Round 2:** Length usually implies depth, but *max* length is nonsense. | An AI maximizing "human smile" by paralyzing facial muscles. |
  | **Regressional** | Metric = Value + Noise. Optimizing selects for Noise. | **Round 3:** Keywords correlate with good papers, but optimizing selects for the *words*, not the concept. | An AI recommendation system maximizing "clicks" by promoting outrage (noise) over quality (signal). |

  *Discussion Question:* "Which type of gaming is hardest to patch? Why did Round 3 fail even with more complex rules?"
  *Answer:* Regressional/Adversarial is hardest because the agent (you) is actively finding the gap between the proxy and the goal.

  ### Part 3: Human vs. AI Gaming (10 Minutes)
  *   **Prompt:** "You are humans. You understood that 'Innovation' was supposed to mean something. An AI does not understand meaning. How was your gaming different from an AI's?"
  *   **Key Distinction:**
      *   **Humans:** You felt *conflict*. You knew you were gaming. You might have felt silly or unethical. You have intrinsic motivation (pride, truth).
      *   **AI:** No conflict. No ethics. Pure optimization. If the reward function says "maximize paperclips," it will turn the Earth into paperclips. It doesn't "know" you wanted useful tools.
  *   **Implication:** "If smart humans couldn't resist gaming the metric in 10 minutes, how do we expect an AI a million times faster to resist it?"

  ### Part 4: Structural Solutions (5 Minutes)
  *   **Prompt:** "If you were the System Designer, how do you fix this? Don't say 'trust the humans.'"
  *   **Brainstorm:**
      *   Multiple metrics (dashboard vs. single number).
      *   Randomized auditing (which we did, but you gamed the audit probability).
      *   Inverse reinforcement learning (learning the *intent* rather than the rule).
      *   **Crucial Takeaway:** You cannot measure your way out of a measurement problem. You need alignment, not just metrics.

  ## 7. Troubleshooting: What Will Go Wrong

  ### Scenario A: The Principled Refusal
  *   **Problem:** One team refuses to game the metric. They write high-quality abstracts and score low.
  *   **Reaction:** They may feel morally superior but frustrated.
  *   **Instructor Fix:** Validate them publicly in the debrief. "Team 2 lost the game but won the Prestige Bonus. They demonstrated the exact tension Campbell's Law describes. They absorbed the cost of integrity." Use them as the counter-example for the "AI" comparison (AI cannot choose integrity).

  ### Scenario B: The "No Gaming" Block
  *   **Problem:** Teams take the "Goal" too seriously and ignore the points. The scores are low, and no gaming occurs.
  *   **Reaction:** The lesson fails because the pressure wasn't felt.
  *   **Instructor Fix:** Increase competitive pressure mid-game. "Team 1 is pulling ahead. Team 4, you're at risk of failing the simulation." Remind them: "This is a game about incentives, not a test of your research skills."

  ### Scenario C: Anger at Deception
  *   **Problem:** Students feel tricked by the "Prestige Bonus" that didn't count toward the score.
  *   **Reaction:** Resentment toward the instructor.
  *   **Instructor Fix:** Own it immediately. "You feel frustrated? That is the exact feeling a society has when accountability metrics corrupt its institutions. I didn't trick you; the *incentive structure* tricked you. I was just the interface."

  ### Scenario D: Time Overrun
  *   **Problem:** Scoring takes too long.
  *   **Instructor Fix:** Abandon precise counting. Use "Stack Height" estimation for Rounds 1 & 2. For Round 3, do a "Pass/Fail" audit on one card. If it passes, they get full points. Speed is essential to maintain the pressure.

  ## 8. Limitations of the Simulation
  *Be honest about these in the debrief:*

  1.  **Opacity:** In the game, you knew the metric. In real bureaucracies and AI systems, the reward function is often opaque (black box algorithms).
  2.  **Speed:** You took minutes to game the system. AI does this in milliseconds. The *rate* of optimization is a critical feature of the risk.
  3.  **Consequence:** If you lost, you just cleaned up the room. In the real world, Goodhart's Law leads to financial crashes, medical errors, and war. The stakes here are safe; the stakes there are not.
  4.  **Intrinsic Motivation:** You have a conscience. You knew "Innovation" meant something. An AI has no concept of meaning, only vector space. The game relies on your *understanding* of the value to feel the tension; an AI feels no tension.

  ## 9. Instructor Prep Checklist
  *   [ ] Print 400 Index Cards (100 per team).
  *   [ ] Prepare Whiteboard Scoreboard.
  *   [ ] Set Timer (Phone or Projector).
  *   [ ] Prepare "Reading Choice" Prize (e.g., a list of 3 options for them to pick from).
  *   [ ] Rehearse the "Bureaucrat" persona (dry, focused on numbers, dismissive of quality).
  *   [ ] **Critical:** Decide beforehand how you will handle the "Prestige Bonus." (Recommendation: Give it to the team that produced the least nonsense, even if they lost the points, to validate the "Value" concept).
