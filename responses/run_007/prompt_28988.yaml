      *   *Who-is-fooled:* This needs deep dive. The "homunculus" risk. The illusionist says "the system is fooled." But if the system is just physical parts, what does "fooled" mean without a perspective?
      *   *Meta-Problem:* Illusionism *owns* this. It's their strong suit. But if the explanation posits a "quasi-phenomenal" property, it's a problem.
      *   *Collapse:* If the functional role is identical, does the ontology matter? (Chalmers' point).

  6.  **Developing the "Who-is-fooled" Argument (Priority):**
