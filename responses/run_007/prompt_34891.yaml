prompt: |-
  Right, so I'm revising for my epistemology final and Fitch's paradox is definately going to be on it. We've spent ages on it and I can write out the derivation in my sleep, but I know the exam question won't just ask for that. Our lecturer keeps going on about how the real point is to understand what the paradox *does* to the knowability principle — like, what it forces the anti-realist to give up and what they can still hold onto.

  Could you write me a proper practice exam question — upper-level undergrad epistemology — and then give me a model answer (say 700 words) and a marking scheme? I want the question to force me to engage with the philosophical upshot, not just the mechanics of the proof.

  The marking scheme should be the kind that separates answers by quality: what does a first-class answer (70+) have that a 2:1 (60-69) doesn't? And if there are common errors — I know some people in my course think the paradox just shows that the knowability principle is false, full stop, without thinking about whether it can be restricted or reformulated, or they confuse the knowability principle with the claim that all truths are actually known — please flag those in the marking notes.

  Also, our course covered a few responses: the restriction strategy (e.g. Tennant, Dummett), the intuitionistic logic response, and the idea that the paradox reveals something about the nature of propositions rather than about knowability per se. So the model answer should show awareness of at least some of these moves, and ideally say something about which responses are genuinely responsive to the problem rather than just changing the subject.
