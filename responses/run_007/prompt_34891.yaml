answer: |-
  ### Practice Exam Question

  **Module:** Epistemology & Metaphysics (Level 3)
  **Time Allowed:** 45 Minutes (for this specific question)

  **Question:**
  Fitch's Paradox is frequently presented as a *reductio* of semantic anti-realism. However, many anti-realists argue that the paradox targets a naive formulation of the Knowability Principle (KP) rather than anti-realism itself. Critically assess this defence. In your answer, explain what the paradox demonstrates about the relationship between truth and knowledge, and evaluate whether strategies such as logical revision or restricting the Knowability Principle successfully preserve the anti-realist position without conceding too much to the realist.

  ***

  ### Model Answer

  Fitch's Paradox poses a severe threat to semantic anti-realism, which characterises truth as epistemically constrained. The anti-realist typically endorses the Knowability Principle (KP): $\forall p(p \to \Diamond Kp)$, meaning all truths are possibly known. Fitch's derivation demonstrates that if KP is true, then $\forall p(p \to Kp)$: all truths are *actually* known. Since omniscience is patently false, KP appears false, and with it, the anti-realist conception of truth.

  The crux of the paradox lies in Fitchian propositions: conjunctions of the form $(p \land \neg Kp)$. If $p$ is true but unknown, this conjunction is true. By KP, it must be possible to know this conjunction. However, knowing $(p \land \neg Kp)$ entails knowing $p$ and knowing that one does not know $p$. Since knowledge implies truth ($Kp \to p$), the second conjunct becomes contradictory ($Kp \land \neg Kp$). Thus, there can be no unknown truths. The derivation is logically valid in classical modal logic; therefore, the anti-realist must reject a premise or the logic itself.

  A common but erroneous reaction is to abandon anti-realism entirely, accepting realism's mind-independent truth. However, sophisticated anti-realists argue this is premature. The paradox shows that *unrestricted* KP is untenable, not that epistemic constraints on truth are impossible. The philosophical upshot is that the anti-realist must refine what counts as a truth-apt proposition.

  One prominent defence is the **Restriction Strategy**, advocated by Neil Tennant. Tennant argues KP should only apply to "Cartesian" propositions—those for which it is logically consistent that they be known. Fitchian propositions are non-Cartesian because, as the proof shows, they are inconsistent to know. By restricting KP to Cartesian truths, the contradiction is avoided. The anti-realist retains the core intuition that truth is knowable, conceding only that some syntactic strings (like "p and I don't know p") are not genuine candidates for knowledge. Critics argue this is ad hoc, merely stipulating away the counter-examples. However, Tennant replies that anti-realism is a theory of *meaning*, and non-Cartesian propositions lack coherent truth conditions within a verificationist framework anyway. This strategy preserves KP's spirit while accepting that not all truths are *empirically* knowable, only those consistent with the nature of knowledge.

  A second approach involves **Logical Revision**. Dummett and Williamson suggest that the paradox relies on classical logic, specifically Double Negation Elimination. In intuitionistic logic, the derivation proves $\neg \neg \forall p(p \to Kp)$, but not $\forall p(p \to Kp)$. This means we cannot assert there are unknown truths, but we are not forced to assert omniscience either. We simply remain agnostic. This preserves anti-realism by altering the underlying logic of the discourse. However, this is a high cost: it requires abandoning classical logic across metaphysics and science, not just epistemology. Many find this revision too drastic compared to Tennant's restriction.

  A third response questions the **Nature of Propositions**. Some argue the paradox reveals that propositions are not stable across epistemic contexts. If knowing $p$ changes the context such that $\neg Kp$ becomes false, the proposition itself shifts. This dissolves the contradiction but risks making truth too volatile.

  In evaluation, the Restriction Strategy is the most robust defence. It acknowledges the paradox's force without abandoning classical logic or the core anti-realist intuition. It forces the anti-realist to give up the claim that *every* truth is knowable, substituting it with the claim that every *coherent* truth is knowable. While the realist may argue this distinction is merely verbal, it successfully blocks the *reductio*. The paradox does not destroy anti-realism; it forces it to mature from a naive verificationism into a nuanced theory of epistemic constraints. The anti-realist survives, but only by accepting that the domain of knowable truths is smaller than the domain of syntactically well-formed statements.

  ***

  ### Marking Scheme & Examiners' Notes

  **Total Marks:** 100
  **Target:** Upper-Level Undergraduate (Level 3)

  #### Grade Descriptors

  **First Class (70–100)**
  *   **Understanding:** Demonstrates precise understanding of the derivation without getting bogged down in symbolic mechanics. Clearly distinguishes between KP ($\Diamond K$) and Omniscience ($K$).
  *   **Critical Engagement:** Does not merely list responses but evaluates their *cost*. Discusses *why* a response works (e.g., Tennant's appeal to consistency vs. Williamson's logical revision).
  *   **Argument:** Takes a clear stance on which defence is most viable (e.g., favouring Restriction over Intuitionism due to logical cost).
  *   **Nuance:** Recognises that the paradox forces a *refinement* of anti-realism, not necessarily its abandonment.
  *   **Style:** Concise, philosophically rigorous, no wasted words.

  **Upper Second (2:1) (60–69)**
  *   **Understanding:** Correctly outlines the paradox and the threat to KP. May spend slightly too much time on the symbolic derivation.
  *   **Critical Engagement:** Discusses at least two responses (e.g., Restriction and Intuitionism) but evaluation is descriptive rather than critical (e.g., "Tennant says X, Williamson says Y" without weighing the trade-offs).
  *   **Argument:** Concludes that anti-realism can be saved, but the reasoning is less developed regarding *what* is sacrificed.
  *   **Nuance:** Might treat the responses as equally viable without discussing the "cost" (e.g., abandoning classical logic).

  **Lower Second (2:2) (50–59)**
  *   **Understanding:** Grasp of the basic problem (KP implies Omniscience) is present but may contain minor inaccuracies.
  *   **Critical Engagement:** Mentions one response superficially. Focus remains heavily on explaining the proof rather than the philosophical upshot.
  *   **Argument:** Conclusion is vague or hesitant.
  *   **Nuance:** Struggles to articulate why the anti-realist would choose one defence over another.

  **Fail (0–49)**
  *   **Understanding:** Fundamental confusion about the paradox (e.g., thinks it proves we are omniscient).
  *   **Critical Engagement:** No engagement with responses (Tennant/Dummett).
  *   **Argument:** Irrelevant or misses the prompt.

  #### Common Pitfalls & Examiner Notes

  **1. The "Omniscience" Confusion (Major Error)**
  *   *Error:* The candidate claims Fitch's Paradox proves that humans are omniscient.
  *   *Correction:* The paradox is a *reductio ad absurdum*. It shows that accepting KP (in classical logic) *entails* omniscience. Since omniscience is false, KP (or the logic) must be rejected. A 2:1+ answer must make this modal distinction clear.

  **2. The "KP is False" Simplification**
  *   *Error:* Concluding simply that "The Knowability Principle is false, so Realism wins."
  *   *Correction:* This ignores the prompt's requirement to assess anti-realist defences. A First-Class answer recognises that KP can be *restricted* or *reinterpreted* rather than outright discarded. Dismissing anti-realism entirely without discussing Restriction/Intuitionism caps the mark at 55.

  **3. Mechanics over Philosophy**
  *   *Error:* Spending 300+ words writing out the formal proof ($p \land \neg Kp$, etc.).
  *   *Correction:* The prompt asks for the *upshot*. The proof should be summarised in 2-3 sentences. Marks are awarded for discussing the *implications* of the proof, not the proof itself.

  **4. Misrepresenting the Responses**
  *   *Error:* Claiming Intuitionism denies the paradox arises.
  *   *Correction:* Intuitionism accepts the derivation but denies the final step to omniscience (blocking Double Negation Elimination).
  *   *Error:* Claiming Tennant thinks Fitchian propositions are false.
  *   *Correction:* Tennant argues they are not *Cartesian* (not consistently knowable), so KP does not apply to them.

  **5. Differentiation Note (70 vs 65)**
  *   To push a 65 answer to a 70+, the student must explicitly weigh the *theoretical cost*. For example, noting that Intuitionism saves KP but breaks classical mathematics, whereas Restriction saves classical logic but limits the scope of truth. The candidate who identifies this trade-off demonstrates the critical synthesis required for a First.
