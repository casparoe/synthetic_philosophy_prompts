answer: |-
  **To:** Internal Tools Governance Committee
  **From:** [Your Name]
  **Subject:** Recommendation: Voting System for Technical RFCs
  **Date:** Monday

  ### Executive Summary

  We need to replace the "stamina-based" decision model currently used in GitHub issues. After evaluating ranked-choice methods against our specific constraints (60 voters, high-stakes technical decisions, risk of tactical gaming), I recommend we adopt the **Schulze Method** (also known as the Beatpath Method).

  This is not Instant Runoff Voting (IRV). It is a Condorcet method used by Debian, Wikimedia, and KDE for technical governance. It is mathematically robust against the specific failure modes that threaten engineering consensus.

  Below is the justification, the mathematical tradeoff we are accepting, and the implementation plan.

  ---

  ### The Recommendation: The Schulze Method

  In the Schulze method, voters rank options (1st, 2nd, 3rd...). The winner is determined by calculating pairwise matchups between every option (e.g., does Option A beat Option B head-to-head?).

  Unlike IRV, which eliminates the lowest first-choice votes round-by-round, Schulze looks at the **strength of paths** between candidates. If a majority prefers A over B, and a majority prefers B over C, Schulze recognizes that A has a "beatpath" over C. The winner is the option that has the strongest beatpaths against all other opponents.

  **Why this fits us:**
  1.  **It Finds the Consensus Candidate:** In IRV, a broadly acceptable "second choice" (e.g., "Stick with Postgres") can be eliminated early if it lacks passionate #1 voters. In technical decisions, the safe, consensus choice is often the correct business decision. Schulze protects these candidates; IRV punishes them.
  2.  **It Resists "Burying":** In Borda Count or simple scoring, teams can game the system by ranking a competitor last (1 star) even if they actually like them. In Schulze, pairwise comparisons make this less effective. To hurt a competitor, you have to rank them below *everyone else*, which risks distorting your own preferences in other pairwise matchups.
  3.  **Industry Precedent:** It is the standard for open-source technical governance. If we are questioned, we can point to 20+ years of Debian project elections as a reference implementation.

  ---

  ### The Tradeoff: Violating Arrow's "IIA"

  You mentioned Arrow's Impossibility Theorem. Arrow proves that no ranked voting system can satisfy a specific set of fairness criteria simultaneously. We have to choose which criterion to violate.

  **We are choosing to violate Independence of Irrelevant Alternatives (IIA).**

  *   **What IIA means:** If Option A wins, adding a new Option D (that nobody really wants) should not cause Option B to win instead.
  *   **The Violation:** In rare edge cases with the Schulze method, introducing a "spoiler" option can change the beatpath dynamics between the front-runners, potentially altering the winner.
  *   **Why this is the least bad violation:**
      *   **Context:** We are a governance committee, not a public election. We control the ballot. We can enforce a **RFC Pre-Screening** process to ensure only viable, distinct technical options make it to a vote. This mitigates the "spoiler" risk at the source.
      *   **Alternative:** The alternative is violating the **Condorcet Criterion** (as IRV does). This means we could elect a candidate who would lose in a head-to-head matchup against every other option. In engineering, electing a technical standard that is objectively inferior in pairwise comparison is a greater risk than the theoretical IIA violation. We prioritize "does this beat the alternatives?" over "did the spoiler change the math?"

  ---

  ### The Strongest Objection (and Response)

  **Objection:** *"The Schulze method is a black box. It's too complex for the team to understand or audit. If people don't trust the math, they won't accept the outcome."*

  **Response:**
  This is a valid concern, but it is solvable with transparency, not simplification.
  1.  **Open Source Tooling:** We will not write our own counting script. We will use an established, open-source library (e.g., `schulze-method` in Python/JS) and pin the version in our repo.
  2.  **Public Ballots:** Every vote will be recorded anonymously but publicly (e.g., a hashed ID linked to the ballot). Any engineer can download the dataset and run the count locally to verify the result.
  3.  **Visualizer:** We will include a "Beatpath Matrix" in the RFC closure summary. It shows the pairwise wins (A > B, B > C) so engineers can see *why* the winner won, even if they don't calculate the paths themselves.

  Complexity is the price of robustness. We accept complexity in our database sharding strategies to ensure data integrity; we should accept it here to ensure decision integrity.

  ---

  ### Implementation Plan

  1.  **Tooling:** Integrate an existing Schulze voting bot into our GitHub/Slack workflow. Do not build custom.
  2.  **Ballot Access:** Voting is restricted to the 60 engineers, but results are public to the org.
  3.  **Quorum:** A vote requires 40% participation (24 voters) to be valid. If quorum isn't met, the RFC returns to "Draft."
  4.  **Tie-Breaking:** In the statistically unlikely event of an exact tie, the winner is decided by the option with the most 1st-place votes. If still tied, the RFC owner (the proposer) casts the tie-breaking vote.
  5.  **Pre-Screening:** To mitigate the IIA violation risk, the Governance Committee must approve the final list of options before voting opens. No "joke" candidates.

  ### Bottom Line

  We are adopting the **Schulze Method**.

  It prioritizes the **Condorcet Winner** (the option that beats all others head-to-head) over simplicity. It protects consensus candidates from being eliminated early. It is the standard for technical organizations. It requires us to manage the ballot options carefully to avoid IIA edge cases, but that is a process problem we can solve, whereas IRV's elimination of consensus candidates is a mathematical flaw we cannot fix.

  Let's stop voting with our stamina and start voting with our preferences.

  ---
  **Action Required:** Approval to proceed with integrating a Schulze-based voting bot by end of quarter.
