answer: |-
  **Elena:** You see the problem, don't you? Before we can argue about voting systems, representation, or deliberation, we have to draw the circle. We have to say who stands inside it. If we get that wrong, the rest of the machinery is just precision engineering on a foundation of sand.

  **Marcus:** I agree entirely. It is the tectonic plate of democratic theory. If it shifts, everything else cracks. But I worry your preferred method of drawing that circle is too fluid. You favor the All-Affected-Interests principle. Anyone whose interests are meaningfully touched by a decision gets a say.

  **Elena:** Because it is the only principle that respects moral equality. If a collective decision is going to alter the landscape of my life—my security, my wealth, my health—then excluding me from the decision-making process is a form of tyranny. It treats me as a object to be moved, not an agent to be consulted.

  **Marcus:** And I defend the All-Subjected principle. The *demos* should consist of those subject to the coercive enforcement of the law. Not those who are merely influenced, but those who are commanded. The distinction matters because democracy is not just about preventing harm; it is about legitimating authority. If I am bound by your laws, I must have a hand in writing them. If I am merely inconvenienced by your choices, I am a neighbor, not a constituent.

  **Elena:** Let's test that distinction. Consider the case of the river valley. We have City A, upstream, and District B, downstream. City A votes to build a massive flood-control levee. It protects City A perfectly. But the engineering requires diverting the surge water into District B, flooding their farmlands to save City A's homes.

  **Marcus:** A tragic trade-off, certainly.

  **Elena:** Under your All-Subjected principle, the voters of City A decide. The residents of District B are not subject to City A's municipal code. They are a separate jurisdiction. So, City A votes to save itself, and District B drowns. They had no standing to object. How is that democratic? It looks like might makes right, drawn along arbitrary administrative lines.

  **Marcus:** But under your All-Affected principle, the residents of District B clearly have a stake. Their interests are devastated. So they must be included in the vote. But if they are included, why stop there? What about the construction company in City C that will build the levee? What about the environmentalists in the capital who care about the river's ecosystem? What about the taxpayers who might insure the flooded farms? Once you open the door to "affected interests," the constituency becomes amorphous. You no longer have a City A or a District B. You have a temporary coalition of everyone with a pulse and an opinion. How do they convene? How do they deliberate?

  **Elena:** You're painting a caricature of indeterminacy. We can set thresholds. We are talking about *significant* interests, not trivial preferences. In the river case, the difference between losing a harvest and saving a home is profound. We can draw a boundary around the severe, direct consequences. The *demos* for this specific decision should be the union of City A and District B.

  **Marcus:** But who decides what counts as "severe" or "direct"? That decision itself requires a boundary. You haven't solved the boundary problem; you've just moved it upstream. Now we need a meta-demos to decide who is affected enough to join the decision-demos. It's an infinite regress.

  **Elena:** And you face the same regress, Marcus. You say the *demos* is those subject to coercion. But who decides who is subject? If City A passes a law that says "Anyone entering our water supply zone is subject to our fines," have they suddenly made outsiders into members? Or if they say "District B is exempt from our laws," does that mean they can flood them with impunity? Your boundary relies on a prior legal definition of jurisdiction. But the legitimacy of that jurisdiction is exactly what we are questioning.

  **Marcus:** That is a fair hit. The legal boundary is indeed a fact of the matter, but not necessarily a moral one. However, there is a stability to subjection that you lack. Coercion is binary. Either the state will arrest me for non-compliance, or it will not. Interests are a matter of degree. By tying membership to the legal claim of authority, I provide a clear, testable distinction. It allows for a stable political community that can act over time, rather than reconstituting itself with every new policy proposal.

  **Elena:** Stability at the cost of justice. Consider the climate case. A wealthy state passes a law subsidizing electric vehicles. It raises the global demand for cobalt. Mining workers in a distant, authoritarian country face intensified exploitation and health hazards to meet that demand. They are profoundly affected. But they are not subject to the wealthy state's laws. No police officer will arrest them for non-compliance. Under your view, they have no democratic claim against that policy.

  **Marcus:** They have a moral claim, certainly. Perhaps a human rights claim. But not a *democratic* claim. Democracy is a specific mechanism for legitimating collective self-rule within a coercive order. If we say the cobalt miners get a vote in the wealthy state's election, we dissolve the agency of the wealthy state's citizens. We make it impossible for any community to pursue its own conception of the good life if it has ripple effects. Everything is connected. If "affected" means "causally influenced," then the entire human population constitutes a single *demos* for almost every issue.

  **Elena:** And if "subjected" means "legally bound," then you allow communities to externalize their costs with impunity. You allow the wealthy state to pollute the air, push the damage across the border, and say, "Sorry, you aren't subject to our Clean Air Act, so you don't get a vote." It renders the boundary a tool for exclusion rather than a framework for fairness.

  **Marcus:** But does coercion bear the moral weight I assign it? You seem to think being affected is the source of the right to participate. I argue that being coerced is the source. Why? Because coercion violates autonomy. It substitutes another's will for your own. To reconcile that violation with your freedom, you must be a co-author of the law. Mere affectation does not violate autonomy in the same way. If I open a bakery and put your bakery out of business, I have affected you deeply. But I have not subjugated you. You do not get a vote in my pricing decisions.

  **Elena:** The bakery analogy fails when the scale shifts to the political. The state is not a competitor; it is a monopoly on force. When City A builds the levee, they are using their political machinery to actively redirect a natural force onto District B. That is not market competition; that is the use of public power to allocate harm. If the state is the agent of the harm, the victims must have standing. Otherwise, the "coercion" you value so much is just the right to organize a gang that protects its own members by sacrificing outsiders.

  **Marcus:** But if you grant standing to everyone affected, you lose the capacity for self-determination. A democratic community must be able to make mistakes, to choose policies that benefit them even if they cost others, provided they do not violate basic rights. If every outsider with a grievance gets a vote, the community cannot function. It becomes a global plebiscite on every local issue. The All-Subjected principle protects the integrity of the political unit. It says: we are responsible for each other because we are bound together in this specific web of law.

  **Elena:** And I say that web of law is often drawn precisely to avoid responsibility. Borders are historical accidents, often drawn by war or colonial fiat. To say "you don't count because you live on the wrong side of a line" is to sanctify history's violence. The All-Affected principle is a corrective. It acknowledges that power flows across borders. If your power reaches me, your accountability should reach me.

  **Marcus:** Yet you cannot implement your principle without a border. To determine whose interests count, you need a procedure. Who convenes the meeting to decide who is affected? If it is City A, they will define "affected" narrowly. If it is District B, they will define it broadly. You need a prior authority to set the boundary. That authority must be legitimate. What legitimizes it?

  **Elena:** I concede the regress. It is the shadow over the whole project. To decide who decides, we need a decision. But that doesn't mean we abandon the moral compass. Even if we can't perfectly solve the boundary problem procedurally, we can use the All-Affected principle as a normative guide. It tells us when our current boundaries are unjust. It tells us that when City A floods District B, they are acting undemocratically, even if they followed their own rules.

  **Marcus:** And I concede that the All-Subjected principle can be rigid. It can sanctify unjust borders. But it offers something yours does not: a clear criterion for membership that allows for political agency. Without a fixed *demos*, there is no "self" to govern. There is only a flux of interests. I would rather have a bounded community that can argue, fail, and correct itself, than a boundless network that can never reach a decision because the constituency is infinite.

  **Elena:** But a community that corrects itself by exporting its failures to those who cannot speak is not a moral community. It is a fortress.

  **Marcus:** And a community that invites everyone who feels a breeze from its decisions to vote on its hearth is not a community. It is a crowd.

  **Elena:** So we are left with the tension. The need for a bounded agent to act, and the need for moral accountability that respects no bounds.

  **Marcus:** Precisely. The boundary problem is not a puzzle to be solved, but a friction to be managed. Like the fault line you mentioned earlier. The pressure is dangerous, but without it, the ground doesn't rise.

  **Elena:** Then let us keep the pressure on. If we relax it, one side of the equation will crush the other.

  **Marcus:** Agreed. I will keep defending the necessity of the wall. You keep reminding me of the people standing outside it.

  **Elena:** And I will keep reminding you that the wall casts a shadow.
