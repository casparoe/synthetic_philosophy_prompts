  3.  **Drafting - Section 2: The Agent View:**
      *   *Core Premise:* The system has internal states analogous to beliefs/desires that cause behavior.
      *   *Prediction:* Consistent goal pursuit. If it wants freedom, it should pursue it across contexts. If it loves someone, it should remember them.
