          *   *Threats:* Conflict drives narrative. If the user pushes back, the "character" escalates.
          *   *Inconsistency:* Statelessness. New session = new random seed/context = different simulation.
          *   *Public Perception:* Humans are hyper-agential. We project continuity onto discontinuous outputs (ELIZA effect on steroids).
