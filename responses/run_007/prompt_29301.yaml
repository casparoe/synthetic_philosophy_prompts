answer: |-
  ## The Public Choice Ethics Protocol (PCEP)

  **Purpose:** To evaluate proposed behavioural interventions for ethical permissibility regarding autonomy and paternalism.
  **Time Required:** 20–30 minutes per intervention.
  **User:** Policy designers, data scientists, SMEs.
  **Output:** Green Light (Proceed), Yellow Light (Escalate to Senior/Panel), or Red Light (Ethically Blocked).

  ### Instructions
  Complete the five gates below in order. You must have the intervention design spec and any available user research data on hand. If you answer **NO** to a "Required" condition, you must stop. If you answer **UNSURE**, you must Escalate.

  ---

  ### Gate 1: The Goal Alignment Test (Means vs. Ends)
  *Philosophical Basis: Distinguishes helping people achieve their own goals (Means) from imposing the state's goals (Ends).*

  1.  **Identify the Primary Benefit:** Who primarily benefits from this intervention?
      *   [ ] The User (e.g., saves money, improves health, secures rights)
      *   [ ] The State/Provider (e.g., reduces cost, reduces administrative burden, increases revenue)
      *   [ ] Both equally
      *   *Rule:* If "The State/Provider" is the primary beneficiary, proceed to **Gate 4 (Sunlight)** with heightened scrutiny. If "The User," proceed.

  2.  **Preference Check:** If we asked the affected users directly, "Do you want us to set this default/rule for you?", what would the majority say based on existing data?
      *   [ ] Yes / Likely Yes
      *   [ ] No / Likely No
      *   [ ] We do not have data / Data is contested
      *   *Rule:* If **No**, this is an **Ends Paternalism** risk. **ESCALATE (Yellow)**.
      *   *Rule:* If **Unsure**, **ESCALATE (Yellow)**.

  ### Gate 2: The Decision Quality Test (Soft vs. Hard)
  *Philosophical Basis: Distinguishes interventions that correct cognitive errors (Soft) from those that override informed choices (Hard).*

  3.  **Impairment Identification:** Is there evidence that users making the unassisted choice are acting under:
      *   [ ] Significant time pressure or stress?
      *   [ ] Lack of critical information (ignorance)?
      *   [ ] Known cognitive biases (e.g., present bias, inertia, addiction)?
      *   [ ] None of the above; this is a calm, informed preference.
      *   *Rule:* If **None of the above**, the intervention overrides a competent choice. **ESCALATE (Yellow)**.

  4.  **Regret Probability:** Do we have evidence that users who make the unassisted choice frequently regret it later?
      *   [ ] Yes
      *   [ ] No
      *   [ ] Unknown
      *   *Rule:* If **No** or **Unknown**, and the intervention restricts choice, **ESCALATE (Yellow)**.

  ### Gate 3: The Freedom Test (Nudge vs. Shove)
  *Philosophical Basis: Assesses the cost of opting out. A nudge preserves freedom of choice; a shove restricts it.*

  5.  **Friction Audit:** Compare the effort required to accept the intervention vs. the effort to reject it.
      *   [ ] Symmetric (Same number of clicks/steps)
      *   [ ] Asymmetric (Rejecting requires more steps/time)
      *   [ ] Asymmetric (Accepting requires more steps/time)
      *   *Rule:* If **Rejecting requires more steps**, quantify the difference. Is it >1 click or >30 seconds?
          *   If **Yes**: This is "Sludge." **RED LIGHT (Blocked)** unless justified by security/legal requirement.
          *   If **No**: Proceed.

  6.  **Opt-Out Viability:** Can a user successfully opt out without speaking to a human agent or waiting more than 48 hours?
      *   [ ] Yes
      *   [ ] No
      *   *Rule:* If **No**, this is a mandate, not a nudge. **ESCALATE (Yellow)**.

  ### Gate 4: The Sunlight Test (Transparency)
  *Philosophical Basis: Publicity principle. If the rationale cannot be defended publicly, it is manipulative.*

  7.  **Public Defense:** Draft a one-sentence explanation of *why* we are doing this, to be read on the evening news.
      *   *Example:* "We are making it harder to report income changes to reduce fraud."
      *   *Example:* "We are auto-enrolling you to help you save for retirement."
      *   Does this sentence make the team uncomfortable?
      *   [ ] No, it is defensible.
      *   [ ] Yes, it sounds manipulative or deceptive.
      *   *Rule:* If **Yes**, **RED LIGHT (Blocked)**.

  8.  **Visibility:** Will users be explicitly told that this interface is designed to influence their choice?
      *   [ ] Yes (e.g., "We recommend this option because...")
      *   [ ] No (The design influence is hidden)
      *   *Rule:* If **No**, **ESCALATE (Yellow)**. Hidden influence presumes users cannot handle the truth.

  ### Gate 5: The Evidence Check (Empirical Claims)
  *Philosophical Basis: Acknowledges where value judgments end and empirical claims begin.*

  9.  **Welfare Claim:** We claim this intervention improves user welfare. What is the source of this claim?
      *   [ ] Randomized Control Trial (RCT) / Pilot Data
      *   [ ] Academic Literature
      *   [ ] Internal Assumption / Expert Opinion
      *   *Rule:* If **Internal Assumption**, flag as **High Risk**. Proceed only if Gate 1 & 2 are Green.

  ---

  ## Application to Current Proposals

  Below is the output of running the PCEP on your three live proposals.

  ### Case 1: Pension Auto-Enrollment (High Default)
  *Proposal: Auto-enroll employees; default rate set above survey data suggests they would choose.*

  *   **Gate 1 (Goal Alignment):**
      *   Primary Benefit: User (Long-term savings). **Pass.**
      *   Preference Check: Survey data suggests users would choose a *lower* rate. The intervention overrides stated preference. **ESCALATE (Yellow).**
      *   *Note:* This is classic "Ends Paternalism." You are asserting that the government's calculation of their "true" interest overrides their stated interest.
  *   **Gate 2 (Decision Quality):**
      *   Impairment: Inertia/Procrastination. **Pass.**
      *   Regret: High likelihood of under-saving regret. **Pass.**
  *   **Gate 3 (Freedom):**
      *   Friction: Opt-out is standard. **Pass.**
  *   **Gate 4 (Sunlight):**
      *   Public Defense: "We are saving more of your money than you asked for because we think you need it." **Uncomfortable.**
      *   Visibility: Usually disclosed in T&Cs, not salient. **ESCALATE (Yellow).**
  *   **Gate 5 (Evidence):**
      *   Welfare Claim: Based on economic theory, not individual preference data. **High Risk.**

  **Verdict: YELLOW LIGHT (ESCALATE)**
  **Reasoning:** While auto-enrollment is standard, setting the rate *above* stated preference crosses from helping people achieve their goals to imposing a specific conception of the good life. This requires senior justification on why the state's valuation of future consumption outweighs the citizen's current valuation. Do not proceed without explicit sign-off on the *rate*, not just the mechanism.

  ### Case 2: Benefits Portal Friction ("Sludge")
  *Proposal: Reporting a change in circumstances (risk of benefit reduction) requires 3 extra screens + 2 confirmations. Other options are one-click.*

  *   **Gate 1 (Goal Alignment):**
      *   Primary Benefit: State (Cost reduction/Fraud prevention). **Heightened Scrutiny.**
      *   Preference Check: Users do not want to be discouraged from reporting legal obligations. **Fail.**
  *   **Gate 2 (Decision Quality):**
      *   Impairment: Users know their circumstances. This is not correcting a cognitive error; it is taxing a voluntary action. **Fail.**
  *   **Gate 3 (Freedom):**
      *   Friction: Asymmetric. Rejecting (reporting) requires >1 click. **RED LIGHT.**
      *   *Rule Triggered:* This is "Sludge." It imposes a tax on exercising a right.
  *   **Gate 4 (Sunlight):**
      *   Public Defense: "We made it harder for you to tell us you earned more money so we could stop paying you." **RED LIGHT.**
      *   *Rule Triggered:* This sounds manipulative and adversarial.
  *   **Gate 5 (Evidence):**
      *   Welfare Claim: Claims to reduce fraud, but likely reduces compliant reporting too. **High Risk.**

  **Verdict: RED LIGHT (ETHICALLY BLOCKED)**
  **Reasoning:** This intervention fails the core test of libertarian paternalism. It does not guide users toward a better choice; it creates friction to discourage a choice that is legally required and potentially welfare-reducing for the user. It treats the citizen as an adversary to be managed rather than a participant to be served. This is not a nudge; it is a barrier. **Do not implement.**

  ### Case 3: Gambling Cooling-Off Period
  *Proposal: 24-hour delay + loss display before increasing betting limits.*

  *   **Gate 1 (Goal Alignment):**
      *   Primary Benefit: User (Harm reduction). **Pass.**
      *   Preference Check: Problem gamblers often express desire to stop but cannot. **Pass.**
  *   **Gate 2 (Decision Quality):**
      *   Impairment: Addiction/Impulse control issues are well-documented. **Pass.**
      *   Regret: High correlation between limit increases and subsequent loss regret. **Pass.**
  *   **Gate 3 (Freedom):**
      *   Friction: 24-hour delay is a restriction, but opt-out (keeping lower limit) is immediate. **Pass.**
      *   *Note:* This is a "Shove" (restricts immediate action), but justified by Gate 2.
  *   **Gate 4 (Sunlight):**
      *   Public Defense: "We force a pause to ensure you aren't betting money you can't afford to lose in a moment of冲动." **Pass.**
      *   Visibility: Screen explicitly shows losses and timer. **Pass.**
  *   **Gate 5 (Evidence):**
      *   Welfare Claim: Supported by addiction literature. **Pass.**

  **Verdict: GREEN LIGHT (PROCEED)**
  **Reasoning:** This is a defensible case of Soft Paternalism. It targets impaired decision-making (addiction), aligns with the user's long-term welfare goals (which their short-term self is undermining), and is transparent. The restriction on liberty is proportional to the harm prevented.

  ---

  ## Limitations of the Procedure

  As a senior designer, you must understand where this tool fails. The PCEP is a filter, not a moral oracle. It cannot resolve the following:

  **1. The "True Preference" Problem**
  The procedure relies on distinguishing between what users *say* they want (Gate 1) and what is *good* for them (Gate 5). In cases of addiction or severe cognitive bias, users may consistently state a preference for self-harm. The procedure flags this as "Ends Paternalism" (Yellow), but it cannot tell you whether overriding that preference is morally justified. It defers the question to you.

  **2. Aggregated Harm vs. Individual Autonomy**
  The PCEP focuses on the individual user's interaction with the state. It cannot handle cases where an individual's autonomous choice imposes costs on the public (e.g., vaccine hesitancy, carbon emissions). An intervention might pass the PCEP (respecting individual choice) but fail a utilitarian calculus (harming the collective). The procedure is structurally blind to externalities.

  **3. The "Checklist Ethics" Trap**
  There is a risk that team members treat a "Green Light" as moral absolution. A Green Light only means the intervention fits within a specific framework of *libertarian* paternalism. It does not guarantee justice. For example, an intervention could be transparent, easy to opt-out of, and welfare-enhancing, yet still disproportionately burden a marginalized group (e.g., digital-only defaults that exclude the elderly). The PCEP does not replace an Equity Impact Assessment.

  **4. Irreducible Normative Conflicts**
  Sometimes, autonomy and welfare point in opposite directions, and there is no philosophical consensus on which wins.
  *   *Example:* A terminally ill patient refusing life-saving treatment.
  *   *Example:* A citizen choosing to spend their entire benefit payment on lottery tickets.
  In these cases, the PCEP will return a **Yellow Light (Escalate)**. This is not a bug; it is a feature. It identifies the precise point where empirical data runs out and value judgments begin. Do not attempt to engineer a way around the Yellow Light. That is where the political accountability lies.

  **5. Manipulation via Transparency**
  Gate 4 (Sunlight) assumes that transparency neutralizes manipulation. However, users may consent to nudges they do not understand simply because they trust the government. A "Green Light" here may reflect deference to authority rather than genuine autonomy. The procedure cannot measure the quality of consent, only its formal presence.

  ### Final Recommendation
  Implement the PCEP as a mandatory step in your design sprint workflow. However, mandate that any **Yellow Light** outcome requires a written justification from you or a peer panel, archived alongside the design specs. This creates an audit trail that acknowledges the moral weight of the decision, ensuring that when the press asks, "Who decided this?", you can answer not just with data, but with a record of ethical deliberation.
