answer: |-
  ### 1. Essay Question

  **Question 4 (1 hour)**

  Behavioral economists often claim that hyperbolic discounting provides a scientific explanation for *akrasia* (weakness of will), modeling how preferences reverse over time as rewards become imminent. Philosophers of action, however, often define *akrasia* as a synchronic puzzle: how an agent can intentionally act against their own *current* all-things-considered judgment.

  Write an essay arguing for the following claim: **Does the hyperbolic discounting framework successfully *explain* philosophical akrasia, or does it merely *redescribe* the phenomenon in a way that dissolves the original philosophical problem?**

  In your answer, you must take a definitive position. If you argue it explains akrasia, defend how the model accounts for the agent's normative judgment. If you argue it only redescribes akrasia, articulate what is lost (the "cost") by adopting the economic framework over the philosophical one.

  ***

  ### 2. Model Answer

  The claim that hyperbolic discounting explains *akrasia* is seductive because it offers a mechanistic solution to a moral puzzle. However, upon closer inspection, the economic framework does not explain philosophical *akrasia*; it redescribes it in a way that dissolves the synchronic conflict essential to the concept. While hyperbolic discounting successfully predicts *preference reversal*, adopting this model comes at a significant cost: it eliminates the unified agent necessary for moral responsibility and normative judgment.

  To see why, we must distinguish the two frameworks. In the behavioral economic model, championed by George Ainslie, *akrasia* is a matter of time inconsistency. At time $t_1$, an agent prefers a larger, later reward (health) over a smaller, sooner reward (smoking). As $t_2$ approaches, the discount curve for the sooner reward steepens hyperbolically, crossing the curve for the later reward. At $t_2$, the agent genuinely prefers smoking. There is no conflict at the moment of action; there is only a shift in valuation. The "curves cross," and the agent follows their strongest current preference.

  In contrast, the philosophical account, notably articulated by Donald Davidson, defines *akrasia* as acting against one's *all-things-considered* judgment at the moment of action. For Davidson, the akratic agent at $t_2$ judges that, all things considered, they ought to do $X$, yet intentionally does $Y$. The puzzle is synchronic: how can the will fail when the judgment is present? The economic model bypasses this by denying the stability of the judgment. If the preference reverses, the judgment presumably reverses with it.

  Therefore, hyperbolic discounting does not solve the philosophical puzzle; it evaporates it. It turns a failure of *rationality* (acting against reason) into a failure of *stability* (changing reasons). This redescription is empirically robust but conceptually expensive. The primary cost is the fragmentation of the self. If the agent at $t_2$ is simply maximizing a different utility function than the agent at $t_1$, we are no longer dealing with one agent failing to govern themselves, but rather a sequence of temporal selves with competing interests.

  This fragmentation undermines the normative force of *akrasia*. In the philosophical tradition, *akrasia* is a vice because the agent fails to align action with reason. It implies a capacity for self-governance that was neglected. If we accept the economic redescription, the agent at $t_2$ is not irrational; they are merely responding to a changed incentive structure. The "weakness" disappears because there is no longer a standard of rationality they are violating at the moment of choice. They are doing exactly what they most want to do at that instant.

  Furthermore, this redescription struggles to account for the phenomenology of regret. We experience *akrasia* not just as a change of mind, but as a betrayal of a standing commitment. When I eat the cake while on a diet, I do not merely feel that my preferences changed; I feel I violated a principle I still endorse *while* eating. The economic model struggles to capture this endorsement. If the discount curve has crossed, the diet is no longer the utility-maximizing path. To say I "still endorse" the diet implies a judgment that stands apart from the immediate utility calculation, which the model explicitly rejects.

  One might object that this is merely semantic preciousness. If the behavior is the same, why does the explanation matter? It matters because explanations dictate interventions. If *akrasia* is a synchronic failure of judgment, we cultivate virtue and practical wisdom to strengthen the will. If it is a diachronic preference reversal, we use commitment devices (locking away the cigarettes) to constrain the future self. While commitment devices are useful, relying solely on them concedes that rational self-governance is impossible.

  In conclusion, hyperbolic discounting offers a powerful predictive model of time-inconsistent behavior, but it fails to explain philosophical *akrasia*. It achieves this predictive power by redefining the agent as a series of time-slices rather than a unified locus of judgment. The cost of this trade-off is the loss of the normative dimension of action. We gain the ability to predict when the curves cross, but we lose the ability to criticize the agent for crossing them.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Grade Boundaries & Criteria**

  | Grade | Marks | Criteria Description |
  | :--- | :--- | :--- |
  | **A** | **20–25** | **Critical Synthesis & Argument.** <br>• **Thesis:** Takes a clear, definitive position on the "explain vs. redescribe" debate.<br>• **The "Cost":** Explicitly articulates what is lost by adopting the economic view (e.g., normative force, unified agency, moral responsibility).<br>• **Conceptual Precision:** Clearly distinguishes *synchronic* conflict (Davidson) from *diachronic* preference reversal (Ainslie).<br>• **Engagement:** Does not merely summarize; uses the concepts to drive the argument forward. Acknowledges counter-arguments (e.g., "semantic preciousness") and rebuts them. |
  | **B** | **15–19** | **Competent Analysis.** <br>• **Thesis:** Takes a position, but it may be less nuanced or slightly wavering.<br>• **The "Cost":** Identifies that there is a difference between the models but may not fully develop the *consequences* of that difference (the "cost" is vague).<br>• **Conceptual Precision:** Correctly defines hyperbolic discounting and *akrasia*, but the distinction between synchronic and diachronic conflict may be implied rather than explicitly analyzed.<br>• **Engagement:** Good summary of both sides, but the integration is less tight than an A answer. May treat the two views as merely "different perspectives" rather than incompatible explanations. |
  | **C** | **10–14** | **Descriptive Summary.** <br>• **Thesis:** Weak or absent. May attempt to argue both sides without resolution.<br>• **The "Cost":** Fails to address the "at what cost" component of the prompt.<br>• **Conceptual Precision:** Shows basic understanding of hyperbolic discounting and *akrasia* but may conflate preference with judgment.<br>• **Engagement:** Mostly summarizes Davidson and Ainslie separately with a weak concluding paragraph stitching them together. |
  | **D/F** | **0–9** | **Inadequate.** <br>• Misunderstands core concepts (e.g., claims hyperbolic discounting proves *akrasia* is impossible without argument).<br>• No clear structure or argument.<br>• Significant factual errors regarding the philosophical or economic theories. |

  **Specific Marking Breakdown (for use within Grade Bands)**

  *   **Argument & Thesis (10 marks):** Is the position clear? Does it directly answer the "explain or redescribe" prompt?
  *   **Conceptual Accuracy (5 marks):** Correct use of "synchronic vs. diachronic," "all-things-considered judgment," and "preference reversal."
  *   **Critical Engagement (5 marks):** Does the student analyze the *implications* (the cost) rather than just the mechanics?
  *   **Clarity & Structure (5 marks):** Is the essay organized, readable, and within the expected scope for a 1-hour response?

  **Typical "B" Trap:**
  The most common reason an answer falls from an A to a B is the failure to articulate the **normative cost**. A B student will successfully argue that the models are different (one is synchronic, one is diachronic) but will stop there. An A student will explain *why that difference matters* for how we understand agency, responsibility, or rationality.

  **Typical "C" Trap:**
  The "Book Report" approach. The student writes 300 words on Davidson, 300 words on Ainslie, and 100 words saying "Both are interesting." This fails the prompt's requirement to *argue a position* on the relationship between the two.
