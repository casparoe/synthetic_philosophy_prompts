prompt: |-
  Okay so i teach this upper-level undergrad course called Philosophy of Action and Behavioral Economics, and my friend and I just spent two hours arguing about whether hyperbolic discounting actually explains akrasia or just redescribes it in a way that makes the original philosophical problem disappear. He's an economist and keeps saying "the curves cross, that's it, case closed" and I'm like — no, the whole puzzle is about how one agent at one moment can judge X better and still do Y, and your model spreads the conflict across time points, so there's no single moment of akratic choice. He thinks I'm being precious about definitions. Anyway it made me realize my students have probably never been pushed to see this tension either.

  For the final I want one essay question that makes them confront whether the hyperbolic discounting framework and the philosophical akrasia literature are even talking about the same thing. Not just "compare and contrast" — I want them to take a position on whether one can explain the other, and if so at what cost. I don't want separate summaries of Davidson and Ainslie with a paragraph stitched between them.

  Please write: (1) the question itself, worded so students know they have to argue a position, (2) a model answer of about 700 words, and (3) a marking scheme out of 25 marks. The marking scheme should say what distinguishes an A from a B from a C answer — name the specific philosophical moves an A answer must make, and the typical mistakes or omissions that drop an answer to a B. The exam is three hours total, this question should take about an hour.
