prompt: |-
  I'm putting together a worksheet for my metaphysics of science seminar, and I need a pair of contrasted cases that do one specific job: show why masks and finks are different problems for the simple conditional analysis of dispositions, in a way that makes the point stick.

  Quick refresher: the simple conditional analysis says x is disposed to M when S iff (if S were to occur, x would M). A mask is something that stops the manifestation without removing the disposition — the object's still fragile, it's just wrapped in bubble wrap. A fink is trickier: it removes the disposition itself when S occurs, so the disposition isnt there at the moment of the stimulus.

  What I want: two cases, as similar as possible. Case 1 has a mask. The simple conditional analysis says the object lacks the disposition (because S occurs and M doesn't), but that's wrong — the disposition is there, just blocked. A "ceteris paribus" or "in normal conditions" fix handles Case 1 fine: the object has the disposition, and in normal conditions (no bubble wrap) it would manifest. Case 2 is structurally parallel but involves a fink. Now the ceteris paribus fix fails too, because the disposition genuinely isn't present when S occurs. The cases should be ordinary — no wizards, no sci-fi. Lab or everyday settings are fine.

  After laying out both cases, walk through the verdicts: what the simple conditional says, what the ceteris paribus version says, what the correct verdict is, and why. Then point to the exact feature of Case 2 that makes the ceteris paribus clause fail where it worked in Case 1.

  Then one more thing: a fan of the simple conditional might say Case 2 isn't a counterexample because the object just doesn't have the disposition at the relevant time — so the conditional correctly says "no disposition." What would a dispositional realist (or essentialist) say to push back? Give me a tight paragraph on that.
