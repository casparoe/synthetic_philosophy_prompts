answer: |-
  # Worksheet: Masks, Finks, and the Conditional Analysis

  ### Part 1: The Cases
  **Background:** The Simple Conditional Analysis (SCA) claims: *Object $x$ is disposed to manifest $M$ upon stimulus $S$ iff, if $S$ were to occur, $x$ would $M$.*

  Below are two cases involving the same object type and stimulus. In both, the stimulus occurs, but the manifestation does not.

  **Case 1: The Insulated Wire (Mask)**
  A copper wire is fully conductive (it has the disposition to conduct electricity). However, it is tightly coated in thick rubber insulation. A technician connects the ends of the wire to a battery (Stimulus $S$). Because of the insulation, no current flows (Manifestation $M$ does not occur). The insulation prevents the contact required for conduction but does not change the copper's intrinsic conductivity.

  **Case 2: The Safety-Switch Wire (Fink)**
  A copper wire is fully conductive. It is connected to a "Safety Box" that monitors the wire's ends. The Box is programmed to detect any attempt to connect the wire to a voltage source. The millisecond the technician attempts to connect the wire to the battery (Stimulus $S$), the Box instantly severs the wire's internal filaments before contact is completed. Consequently, no current flows (Manifestation $M$ does not occur). The stimulus itself triggered the removal of the conductivity.

  ***

  ### Part 2: The Verdicts

  | | **Case 1 (Mask)** | **Case 2 (Fink)** |
  | :--- | :--- | :--- |
  | **Simple Conditional Analysis** | **False Negative.** <br>SCA says: Since $S$ occurred and $M$ did not, the wire lacks the disposition. <br>*(Verdict: Not Conductive)* | **False Negative.** <br>SCA says: Since $S$ occurred and $M$ did not, the wire lacks the disposition. <br>*(Verdict: Not Conductive)* |
  | **Correct Metaphysical Verdict** | **Has Disposition.** <br>The copper is still conductive; the insulation is an external blocker. | **Had Disposition.** <br>The wire was conductive *until* the stimulus triggered the mechanism that removed that very property. |
  | **"Ceteris Paribus" Fix** | **Works.** <br>We add: *"If $S$ were to occur, and no interferers were present..."* <br>Remove the insulation (interferer), and the current flows. The disposition remains stable. | **Fails.** <br>We add: *"If $S$ were to occur, and no interferers were present..."* <br>The "interferer" (Safety Box) is triggered *by* $S$. To remove the interferer is to change the setup so $S$ no longer removes the disposition. But if we keep the setup, the disposition vanishes upon $S$. |

  ***

  ### Part 3: Why the Fix Fails in Case 2

  The *ceteris paribus* (all else being equal) clause works for **Masks** because masks are **extrinsic blockers** that leave the intrinsic disposition intact. We can conceptually "subtract" the mask while holding the object's nature fixed.

  The clause fails for **Finks** because finks exploit the **temporal gap** between stimulus and manifestation. In Case 2, the "interfering" condition is not a static background fact (like insulation); it is a dynamic response *caused by the stimulus*.
  *   In the Mask case, we ask: "Would it conduct if the insulation weren't there?" (Yes).
  *   In the Fink case, we ask: "Would it conduct if the Safety Box weren't there?" This changes the object/system under evaluation. If we evaluate the *actual* system (Wire + Box), the disposition ceases to exist the moment $S$ happens. The *ceteris paribus* clause assumes the disposition persists through the stimulus; the Fink ensures it does not.

  ***

  ### Part 4: The Dispositional Realist's Pushback

  > **SCA Defender:** "In Case 2, you're wrong. At the exact moment the current *should* flow, the wire has already been severed. It literally lacks the disposition at the relevant time. So the SCA is correct to say 'no disposition.'"

  > **Dispositional Realist:** "This conflates the *loss* of a power with the *absence* of a power. The wire's categorical base (its molecular structure) grounded the disposition at $t_0$, immediately prior to the stimulus. The Safety Box is a distinct causal mechanism that *destroyed* that base upon contact. To say the wire 'lacked the disposition' is to ignore the truthmaker that existed moments before the finkish intervention. Dispositions are real properties that persist until destroyed; the SCA reduces them to mere predictions of outcomes. If a property can be present at $t_0$ and absent at $t_1$ solely because $S$ occurred, the conditional 'If $S$ then $M$' fails to capture the property's existence at $t_0$, which is the time at which we attribute the disposition."
