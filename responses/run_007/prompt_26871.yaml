prompt: |-
  My small business has been bidding on a contract against a competitor for months. We started with a reasonable offer, they undercut us, we undercut them, and now we're seven rounds in. At our current bid, we'd lose about $15,000 if we win — but we've already sunk over $30,000 into the proposal process itself, and pulling out means walking away with nothing to show for it. My business partner argues we have to see it through, because otherwise all that time and money was wasted. Something about this reasoning feels like a trap to me, but I can't put my finger on what's wrong with it. What's actually going on here, and how should we think about whether to keep bidding?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small business bidding on a contract.
      *   **Status:** 7 rounds of bidding (price war).
      *   **Financials:**
          *   Sunk costs (proposal process): $30,000+.
          *   Potential loss if won (at current bid): -$15,000.
      *   **Conflict:** User feels something is wrong; Business Partner argues to continue to avoid "wasting" the sunk costs.
      *   **Core Question:** What is this reasoning trap, and how should they decide whether to keep bidding?

  2.  **Identify the Cognitive Bias:**
      *   The partner's argument ("we have to see it through, because otherwise all that time and money was wasted") is a textbook definition of the **Sunk Cost Fallacy**.
      *   *Definition:* Continuing a behavior or endeavor as a result of previously invested resources (time, money, effort), even if the current costs outweigh the benefits.
      *   *Why it's a trap:* Past costs cannot be recovered. Decisions should be based on *future* costs and benefits.

  3.  **Analyze the Economic Situation:**
      *   **Current Bid:** Losing $15k.
      *   **Sunk Cost:** $30k (irrelevant to future decision making, psychologically relevant).
      *   **Total Loss if Won:** $30k (sunk) + $15k (operational loss) = $45k.
      *   **Total Loss if Quit:** $30k (sunk).
      *   **Comparison:** Quitting loses $30k. Winning loses $45k.
      *   **Escalation of Commitment:** This is also related to "escalation of commitment" or "throwing good money after bad." The competitive dynamic (7 rounds) suggests an **auction war** or **war of attrition**.

  4.  **Formulate the Advice:**

      *   **Name the Trap:** Explicitly identify the "Sunk Cost Fallacy." This validates the user's intuition.
      *   **Explain the Logic:** Clarify *why* it's a fallacy. The $30k is gone regardless. The decision is only about the *next* step.
      *   **Do the Math (Marginal Analysis):**
          *   Option A (Quit): Loss = $30,000.
          *   Option B (Win at current bid): Loss = $30,000 + $15,000 = $45,000.
          *   Option C (Bid lower to win): Loss > $45,000.
          *   *Conclusion:* Winning is financially worse than losing at this point.
      *   **Address the Competitive Dynamic:**
          *   Why 7 rounds? This is abnormal. It suggests the competitor might also be trapped, or the client is gaming the vendors.
          *   Winner's Curse: Winning a bidding war often means you underestimated the costs or overpaid to get it.
      *   **Strategic Considerations (Beyond immediate math):**
          *   Is there a long-term gain? (Loss leader strategy). If yes, is $15k the right marketing spend?
          *   Relationship with client? (Will they respect you more or less for lowering price?)
          *   Competitor's position? (Are they desperate? Can they sustain losses longer?)
      *   **Actionable Steps:**
          *   Stop the bleeding.
          *   Re-evaluate the "Why."
          *   Communicate with the partner (use the data).
          *   Consider a "Best and Final" withdrawal or a value-based pivot.

  5.  **Refine the Tone:**
      *   Empathetic but firm.
      *   Professional and analytical.
      *   Supportive of the user's intuition (which is correct).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Validate the feeling. Name the fallacy.
      *   *Section 1: The Sunk Cost Fallacy.* Explain it simply. The $30k is gone.
      *   *Section 2: The Real Math.* Compare the marginal outcomes. Quitting = -$30k. Winning = -$45k.
      *   *Section 3: The Winner's Curse.* Explain the danger of winning bidding wars.
      *   *Section 4: Strategic Exceptions.* When *might* it make sense? (Loss leader, strategic entry). But warn that $15k is expensive for that.
      *   *Section 5: How to talk to the partner.* Focus on future value, not past cost.
      *   *Conclusion:* Recommendation to walk away.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I miss anything?* Maybe the contract leads to huge upsells? I need to mention that as a caveat but warn against optimism bias.
      *   *Is 7 rounds normal?* No, highlight that this is a red flag about the client or the process.
      *   *Is the competitor irrational?* Possible. Don't try to beat an irrational actor.

  8.  **Final Polish:** Ensure clear headings and bullet points for readability. (This matches the structure of the final output).

  **(Self-Correction during drafting):** Make sure to emphasize that the $30,000 is *already spent*. It doesn't matter if they quit now or finish the job, that money is not coming back. The decision is purely: Do we want to lose an *additional* $15,000?

