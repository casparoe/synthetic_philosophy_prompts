      *   Negative: No physical coercion. Can leave the university.
      *   Republican: Rules are public, non-arbitrary, applied equally.
      *   Positive: The student is prevented from pursuing their "true" intellectual path/self-realization because the institution defines "education" differently (as broad cultivation vs. narrow expertise).
      *   *Wait, this is interference.* They are forced to take classes. Negative liberty says this *is* interference.
      *   *Correction:* Negative liberty is about *unjustified* or *specific* interference? No, Berlin says any coercion reduces negative liberty. So mandatory classes violate Negative Liberty. I need a case where Negative Liberty is *respect*.
      *   *Key Insight:* To respect Negative Liberty, there must be **no coercion**. To respect Republican Liberty, there must be **no arbitrary power**. To violate Positive Liberty, the agent must be **unable to self-realize**.
      *   How can one be unable to self-realize without coercion or arbitrary power?
      *   **Answer:** **Structural Incapacity / Lack of Enablement.**
      *   Positive liberty is often linked to *capacity* or *opportunity* to achieve one's higher goals, not just the absence of barriers. If the environment provides no *path* to the "true self," positive liberty is low, even if no one is stopping you.
      *   **Scenario:** A **Highly Specialized Research Grant**.
