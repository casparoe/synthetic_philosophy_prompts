answer: |-
  1. In this analogy, the glued surfaces correspond to the particular and the universal, while the glue itself represents the relation of instantiation. The act of sticking maps directly onto the metaphysical unity or exemplification that binds the relata into a fact.
  2. The analogy holds insofar as both glue and instantiation are defined by their functional role, making the demand for a further connector appear category-mistaken. Just as we do not ask what makes glue sticky, the defender argues we should not ask what makes instantiation relating.
  3. However, the analogy breaks down because physical glue relies on causal forces that themselves require explanation, whereas instantiation is purportedly a non-causal metaphysical tie. Furthermore, glue can fail to adhere, but an existing relation of instantiation cannot fail to relate its terms.
  4. The disanalogy regarding causal forces matters significantly because Bradley's regress targets the logical structure of external relations, while the similarity in functional role does not resolve the logical distinction. Consequently, the glue analogy fails to address the core logical worry that any relation remains distinct from its relata.
  5. The anti-Bradley conclusion does not survive on the strength of this analogy alone, as it requires a substantive theory of internal relations or non-relational ties. Without such independent metaphysical grounding, the analogy merely disguises the regress rather than resolving it.
