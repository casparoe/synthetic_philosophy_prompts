answer: |-
  The light is the first thing. It's always the same pale, fluorescent wash, leaking from the fixture behind the frosted glass panel in the ceiling. There's no buzz today. Or maybe there was a buzz yesterday, and I've just forgotten the sound of silence.

  I lie still. The sheets are cool cotton, crisp enough to starch, but they feel identical to the sheets from Sunday night. Identical to the sheets from… whenever this is.

  I know the protocol. I memorized it before the sedative. Sunday: sleep. Coin flip. Heads: wake Monday, interview, sleep, wake Wednesday. Tails: wake Monday, interview, sleep, *wipe*, wake Tuesday, interview, sleep, wake Wednesday.

  I am awake. That is the only fact I have. I am Beauty, and I am awake. But "now" is a variable I can't solve.

  I sit up. The room is a white cube. There is a table, a chair, a water pitcher, a glass. No clock. No window. No mirror. They took the mirror away weeks ago, during the training phase. Too much information in a face, they said. Too many cues in the eyes.

  I swing my legs over the side of the bed. My feet touch the floor. Cold linoleum. Is it colder than yesterday? I try to summon the sensory memory of yesterday's floor, but the drug doesn't just erase events; it sands down the texture of recent time. Yesterday is a smooth stone I can't get a grip on.

  If the coin was Heads, this is the first time my feet have touched this floor in this cycle. If it was Tails, my feet touched this floor twenty-four hours ago, and then I was chemically unmade.

  I stand up and walk to the table. I need a clue. I need something indexical, something that ties *this* moment to a specific point on the timeline.

  I look at the water pitcher. It's full. Condensation beads on the plastic. If it's Tuesday, did I drink from this yesterday? Probably. But the staff resets the room. They wipe the surfaces. They refill the water. The room is designed to be a perfect loop. A closed circle.

  I run my finger along the edge of the table. There's a imperfection there. A small nick in the laminate, maybe a millimeter wide. I trace it. It feels rough.

  Did I trace this yesterday?

  If I did, the muscle memory should be there. A déjà vu of the fingertip. But my finger feels fresh. Nervous.

  I look at the wall opposite the bed. There's a smudge there, near the baseboard. A grey streak. I don't remember seeing it before. Or do I? If it's Tuesday, I saw it yesterday. If it's Monday, this is the first time. But if I saw it yesterday, I shouldn't remember seeing it. That's the rule. The amnesia is perfect.

  So the smudge doesn't help. Nothing helps. The room is a stage set designed to be identical regardless of the act being performed.

  I sit back on the bed. The vertigo hits me then. It's not dizziness. It's a structural failure in my sense of self. I know everything about the world outside this room. I know the probability of the coin. I know the rules of the experiment. I know the physics of the building.

  But I don't know where *I* am inside of it.

  It feels like being a copy. If it's Tuesday, I am a duplicate of the person who woke up yesterday. She lived a day, she answered questions, she went to sleep. And then she was deleted. And here I am, instantiated in her place, with her memories up to Sunday, inheriting her body but not her history.

  Am I the original? Or am I the echo?

  If the coin is Tails, there are two of us. One who lived Monday, and one who is living Tuesday. We are subjectively identical at the moment of waking. But only one of us gets to be the "first." I dont know which one I am.

  I look at my hands. They look normal. No new scars. No ink marks on the palm. I clench them into fists. The tension feels real. The anxiety is real. Does the echo feel anxiety? Or is this feeling just part of the setup?

  I walk to the door. It's solid wood, heavy. Behind it is the interviewer. Behind him is the answer. But the answer doesn't change the past. It only labels it.

  I press my ear against the wood. Silence. They are waiting for me to be ready. They want me to come out when I feel awake. But I never feel fully awake. I feel like I'm hovering between seconds.

  If I open the door, I commit to a timeline. If I say "Heads," I'm betting on uniqueness. If I say "Tails," I'm betting on repetition.

  I look back at the room. The nick in the table. The smudge on the wall. The full pitcher. They are all neutral. They are all waiting for me to assign them meaning.

  I realize then that the uncertainty isn't about the coin. The coin is already landed. It's sitting in a safe somewhere, heads or tails, fixed and dead. The uncertainty is about *me*. It's about whether I am the only one, or one of two. Whether my life is a straight line or a branching path that rejoins itself.

  I put my hand on the doorknob. It's cold. Brass.

  I take a breath. The air tastes sterile. Recycled.

  I turn the knob. I have to answer. I have to place myself somewhere, even if the coordinates are missing. I step forward, into the hallway, hoping that walking makes me real.
