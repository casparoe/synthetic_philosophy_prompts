answer: |-
  This is a classic standoff in moral philosophy, and Kevin is making a sophisticated move. He's trying to deflect Williams's psychological critique by turning utilitarianism into a **rule-utilitarian** framework disguised as a **procedural** one. He's arguing that the "accounting" happens at the level of system design, not individual transaction.

  However, Williams's critique cuts deeper than procedure. It cuts into the metaphysics of the moral agent.

  Here is the audit of Kevin's analogy, broken down by the mapping, the structural failures, and the verdict on whether it can save utilitarianism from Williams.

  ---

  ### Part 1: The Audit (Mapping the Analogy)

  To see where the books don't balance, we first have to accept Kevin's ledger. Here is how the **Accounting Model of Morality** maps onto Utilitarianism:

  | Accounting Concept | Utilitarian Equivalent | Function |
  | :--- | :--- | :--- |
  | **The Ledger** | The Global Sum of Utility | The container where all value is aggregated. |
  | **The Entries** | Individual Interests/Pains/Pleasures | Discrete units of value. Crucially, they are **fungible** (a dollar from a stranger equals a dollar from kin). |
  | **The Accountant** | The Moral Agent | The entity responsible for processing entries. |
  | **GAAP (Generally Accepted Accounting Principles)** | Internalized Moral Rules | Heuristics (e.g., "don't lie") that speed up processing without recalculating utility every time. |
  | **The Bottom Line** | Maximization of Net Utility | The sole criterion for a "balanced" (right) action. |
  | **The Audit** | Moral Evaluation | Checking if the action matched the Bottom Line. |

  **Kevin's Defense:** When Williams complains about the "cold calculator," Kevin says: "No, the Accountant uses GAAP (internalized rules). They don't crunch numbers for every coffee purchase. They just follow the rules that *lead* to the best Bottom Line."

  **Kevin's Response to "One Thought Too Many":** He claims this is a **Deliberation Error**, not a **Right-Making Error**. The husband *should* save the wife. If he does it because of love, that's fine (good GAAP). If he thinks about utility, he's just being a clumsy accountant, but the books still balance.

  ---

  ### Part 2: Forensic Analysis (Where the Analogy Breaks)

  Kevin's distinction between *deliberation* and *right-making* is the weak point in the ledger. Williams would argue that in morality, unlike accounting, **the source of the justification constitutes the action.**

  Here are the three structural failures of the analogy:

  #### 1. The Fungibility Problem (The Entries)
  In accounting, a dollar is a dollar. It does not matter where it comes from. In the Utilitarian ledger, a unit of happiness is a unit of happiness.
  *   **The Break:** Williams argues that moral entries are **agent-relative**, not agent-neutral. My wife's life is not an entry of value $X$ that happens to be located near me. Her life is an entry of value $X^*$, where the asterisk denotes **"because she is mine."**
  *   **Why it matters:** In accounting, if I favor my own company's stock in the ledger without disclosure, it's fraud. In Williams's morality, favoring my wife *is* the moral point. The accounting analogy cannot represent **partiality** as a virtue; it can only represent it as a heuristic efficiency.

  #### 2. The Neutrality of the Accountant (The Agent)
  An accountant must be disinterested. If an accountant lets personal feelings alter the entries, they are corrupt.
  *   **The Break:** Williams argues that moral integrity requires the agent to be **essentially interested**. I am not a neutral channel through which the universe's satisfaction flows. I am a specific person with specific "ground projects" (commitments that give my life meaning).
  *   **Why it matters:** If the "Bottom Line" is the only thing that matters, then *I* don't matter, except as a vessel. The accounting analogy demands I view my own projects as just another set of entries to be weighed against the world's needs. This is what Williams calls the **loss of integrity**.

  #### 3. The "One Thought Too Many" is Structural, Not Procedural
  Kevin says the husband thinking about utility is just a clumsy deliberation. Williams says the *theory* demands that thought, even if it's unconscious.
  *   **The Break:** In accounting, if the Bottom Line is balanced, no one cares if you used an abacus or a supercomputer. In Williams's ethics, the **justification is part of the relationship.**
  *   **Why it matters:** If I save my wife, and the *ultimate reason* this is right is because "it maximizes utility," then I am not truly relating to *her*; I am relating to *Utility*, using her as the means to achieve it. The accounting analogy hides this. It suggests the "Bottom Line" is external to the relationship. Williams says the relationship *generates* the obligation, not the Bottom Line.

  ---

  ### Part 3: Surface vs. Structural Disanalogies

  To win this argument, you need to show Kevin that some disanalogies are just quibbles, but others kill the analogy's utility for his purpose.

  | Disanalogy | Type | Does it matter for Kevin's defense? |
  | :--- | :--- | :--- |
  | **"Accounting is boring/cold."** | Surface | **No.** Kevin is right that internalized rules make it feel less cold. This is a psychological objection, not a philosophical one. |
  | **"Accountants use calculators."** | Surface | **No.** Kevin is right that we don't calculate consciously. This is the "internalization" defense. |
  | **"Entries are fungible in accounting."** | **Structural** | **Yes.** This is fatal. If moral value isn't fungible (i.e., if *whose* pain it is matters), the ledger model fails. |
  | **"The Accountant is neutral."** | **Structural** | **Yes.** If moral agency requires partiality (integrity), a neutral auditor model cannot represent it. |
  | **"The Bottom Line justifies the entry."** | **Structural** | **Yes.** In Williams's view, the *commitment* justifies the action, not the outcome. The direction of justification is reversed. |

  **The Verdict on Kevin:** Kevin is trying to use the accounting analogy to solve a **psychological** problem (utilitarianism is too hard/weird to do). But Williams is raising a **constitutive** problem (utilitarianism makes you a different kind of person, one alienated from your own life).

  Even if the accountant internalizes the rules (GAAP), the *audit* still happens based on the Bottom Line. If the government (the Universe) audits my life and says, "You saved your wife, which was lucky, because if she had been a stranger, you should have let her drown," then my marriage was never truly a marriage in the moral sense. It was a provisional arrangement subject to utilitarian override. The accounting analogy cannot capture **unconditional commitment.**

  ---

  ### Part 4: A Better Analogy for Williams

  If the Accounting Analogy represents Utilitarianism, what represents Williams's view of Integrity and Ground Projects?

  **The Analogy of Authorship (or Narrative)**

  *   **The Book:** Your Life.
  *   **The Author:** You (The Moral Agent).
  *   **The Plot:** Your Ground Projects and Commitments (e.g., being a husband, a painter, a friend).
  *   **The Critic:** The Moral Evaluator.

  **How it works:**
  When an author writes a story, they don't ask, "Which sentence maximizes the pleasure of the reader?" They ask, "Is this **true to the character**? Is this **true to the story**?"

  If a writer changes the protagonist's personality in Chapter 10 just because market research says readers like that better, the book is ruined. It lacks **integrity**. It's not a coherent whole anymore.

  **Applying it to the Drowning Wife:**
  *   **Kevin (Accounting):** "Saving her balances the global ledger of happiness."
  *   **Williams (Authorship):** "Saving her is what a husband *does* in this story. To do otherwise would be to break the character I am writing. The justification isn't 'good outcomes,' it's 'fidelity to the narrative.'"

  **Why this beats Accounting:**
  1.  **Non-Fungibility:** In a story, *this* character matters more than *that* background extra. You can't swap them out for utility.
  2.  **Internal Justification:** The reason for the action comes from *inside* the narrative (the relationship), not from an external audit (global utility).
  3.  **Integrity:** A book can be "successful" (high sales/utility) but have no integrity (bad writing/inconsistent character). Williams argues a life can be "utilitarian" but lack integrity.

  ### Closing Argument for the Group

  Tell Kevin this:

  > "Kevin, the accounting analogy works if morality is about **managing outcomes**. But Williams is arguing morality is about **being someone**.
  >
  > In your analogy, the Agent is just a clerk processing data for the Ledger. Even if the clerk internalizes the rules, the clerk is still replaceable. Any other clerk could balance the same books.
  >
  > But in the 'One Thought Too Many' case, the husband is **not replaceable**. That's the whole point. If a stranger saves the wife, it's a good outcome (balanced ledger). But if the *husband* saves her, it's a moral expression of *their* bond.
  >
  > Your analogy treats the bond as a heuristic for utility. Williams treats the bond as the **source** of the obligation. You can't audit a marriage like a tax return. If you try, you've already misunderstood what a marriage is."

  The accounting analogy collapses because it assumes value exists *independently* of the agent, waiting to be tallied. Williams argues value is partly *created* by the agent's commitments. You can't balance a ledger on thin air.
