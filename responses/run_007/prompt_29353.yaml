      *   *Check:* Is the alternative analogy strong?
      *   *Correction:* Make sure the alternative isn't just "feelings." It needs to be about *reasons for action*. Authorship works because an author has reasons to write a specific plot that aren't "this plot sells the most copies."

  9.  **Final Polish:** Check for clarity, flow, and ensure I'm answering the prompt's specific requests (Audit, Mapping, Disanalogies, Alternative). (Proceed to generate output).

