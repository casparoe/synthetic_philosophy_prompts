answer: |-
  Your draft notes identify a robust structural distinction between the two problems, but the essay will only succeed if you clarify why weak dominance matters normatively rather than just descriptively.

  (a) Your characterizations of the decision theories are largely accurate but require one crucial precision regarding EDT in the mugging. You correctly note that standard EDT refuses because it updates on the observation "I am being asked," which screens off the heads world; however, you should explicitly state that this updating is the specific move UDT forbids. In XOR blackmail, your description of EDT is correct: it treats the action as evidence regarding the hidden state conditional on the message. For CDT, ensure you emphasize that it refuses in both cases because it sees no causal arrow from the present action to the past coin flip or the termite state, regardless of the predictor. For UDT, clarify that it refuses in blackmail not just because of weak dominance, but because the policy "refuse if message" yields higher expected utility across the prior distribution than "pay if message."

  (b) The weak dominance asymmetry is a valid separator, but it risks describing the symptom rather than the disease. In the mugging, the optimal policy involves a trade-off (lose in tails, win in heads), whereas in blackmail, the optimal policy involves a pure elimination of loss (lose same in termites, win in no-termites). This is a strong point, but do not present weak dominance as the fundamental justification for UDT; rather, present it as a sanity check that UDT passes and EDT fails. The "hard part" you worry about papering over is the account of subjunctive dependence: why does the agent's policy logically control the predictor's simulation in the mugging but not the termite state in the blackmail? Weak dominance helps distinguish the cases, but the deeper lesson is about which correlations are subjunctively dependent on the agent's algorithm. You should argue that weak dominance is the *result* of correctly mapping these dependencies, not the primary criterion itself.

  (c) The point that XOR blackmail is misnamed does real work and should be kept. Traditional blackmail implies a causal agent choosing to inflict harm contingent on payment, which invites CDT-style reasoning about threats. XOR blackmail is a logical constraint where the message is a function of state and action, not a threat issued by an agent. Clarifying this prevents readers from importing intuitions about deterrence or credibility that are irrelevant to the logical structure. However, do not dwell on semantics; use the renaming to pivot quickly to the logical structure (the XOR gate) which forces the correlation between action and state that tricks EDT.

  (d) These notes will make a good essay, but you must resolve the uncertainties in the notes rather than presenting them as open questions. Cut the final paragraph of uncertainties and instead integrate the answers into the main argument: argue that updatelessness is necessary but insufficient without a criterion for relevant correlations (like subjunctive dependence), and that weak dominance is a useful filter for identifying when EDT has gone wrong. Remove the detailed breakdown of CDT/EDT/UDT responses in the second paragraph if it becomes repetitive; focus instead on the structural comparison of the policy spaces. Ensure you explicitly define "policy" early on as a mapping from observations to actions, evaluated ex-ante, to avoid confusion between action-level and policy-level dominance. Finally, tighten the conclusion to emphasize that the joint lesson is about preserving access to counterfactual worlds that updating destroys.
