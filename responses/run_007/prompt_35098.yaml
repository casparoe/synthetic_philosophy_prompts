prompt: |-
  I teach a seminar on pragmatism — about 18 undergrads, mostly philosophy majors but a few from poli sci, one 80-minute session. We're about to hit Dewey's claim that democracy isn't just a decision procedure, it's a form of experimental inquiry: you've got a problematic situation, you form hypotheses, you test them in action, you learn from the consequences and revise, and the whole thing only works if everyone affected can participate in the inquiry. I can lecture this and they'll nod along, but I want them to feel why it's actually different from "democracy is voting" and what it costs to actually do it.

  Design an in-class activity where the group has to solve a collective problem that can only be cracked through something like experimental inquiry — pooling partial information, forming hypotheses, testing them, revising based on results. The activity should be structured so that if they just vote on what to do or defer to whoever talks loudest, they fail or at least do worse than groups that actually inquire. I want them to notice the structure of what they're doing before I name it.

  Details: 80 minutes total including setup and debrief, so the activity itself should run maybe 40-50 minutes. I can print materials. No real stakes needed but there should be some metric of success so they can see whether they did well or poorly. The debrief should map specific moments in the activity onto Dewey's concepts — the problematic situation, hypothesis, experimental testing, consequences as feedback, the role of free communication and diversity of standpoint, warranted assertability vs. certainty. Also tell me what predictably goes wrong when you run this (who dominates, what corners get cut, which groups never get to the insight) and how to handle it in the debrief rather than by intervening during the activity. Be honest about what feature of Dewey's view the activity can't capture — I'm guessing it's something about the open-endedness of real social inquiry or the fact that real problems don't have a known answer the facilitator is hiding.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Topic:** John Dewey's conception of democracy as experimental inquiry (not just voting/procedure).
      *   **Audience:** 18 undergrads (mostly philosophy, some poli sci).
      *   **Time:** 80 minutes total (40-50 mins for activity, rest for setup/debrief).
      *   **Goal:** Students must *feel* the difference between voting/authority and experimental inquiry. They need to pool partial info, hypothesize, test, revise, and include everyone.
      *   **Constraint:** If they just vote or defer to loud voices, they should fail or do worse.
      *   **Output:** Activity design, materials list, facilitation guide, debrief plan (mapping to Dewey), common pitfalls, and limitations of the analogy.

  2.  **Deconstruct Dewey's Core Claim:**
      *   Democracy $\neq$ Aggregation of pre-existing preferences (Voting).
      *   Democracy $=$ Method of social intelligence/experimentation.
      *   Key components: Problematic situation, diverse data (standpoints), hypothesis formation, action/testing, consequences/feedback, revision, inclusion (because excluded data = bad science).
      *   Goal: *Warranted Assertability* (working solution), not absolute Truth.

  3.  **Brainstorming Activity Types:**
      *   *Idea 1: Escape Room style.* Too puzzle-focused, often relies on one smart person.
      *   *Idea 2: Negotiation/Simulation.* Often devolves into bargaining/voting.
      *   *Idea 3: Hidden Information Puzzle.* This is the strongest candidate. If information is distributed unevenly, voting is blind. If the rules change based on actions, it requires experimentation.
      *   *Idea 4: The "Lost at Sea" survival ranking.* Classic, but usually about consensus, not experimentation.
      *   *Idea 5: A resource management game with hidden mechanics.*

      *Selection:* A **Hidden Mechanism Resource Allocation Game**.
      *   *Why:* It forces them to figure out *how* the system works (inquiry) rather than just deciding *what* they want (voting). It requires pooling info because no one has the full rule set. It requires testing because the rules aren't told, they must be discovered.

  4.  **Developing the Activity: "The Black Box Bureau"**
      *   **Scenario:** The class is a governing body managing a crisis (e.g., energy grid, water supply).
      *   **Goal:** Maximize "Stability Points" over 4 rounds.
      *   **Mechanic:** There is a hidden rule connecting their decisions to the outcome.
      *   **Twist:** Information is distributed. Some students know *inputs*, some know *outputs*, some know *context*.
      *   **Failure Condition:** If they vote on a policy without understanding the mechanism, they will likely hit a hidden threshold and crash. If they listen to the "expert" (a planted role or just a loud voice), they might miss a variable.

      *Refining the Mechanic for Dewey:*
      To make it truly about *inquiry*, the "rules" shouldn't just be a math puzzle. They need to represent social complexity.
      Let's try a **"Policy Lab"** setup.
      *   **Problem:** A city is facing a crisis (e.g., Traffic Congestion & Pollution).
      *   **Resources:** 3 Policy Levers (Tax, Infrastructure, Public Transit).
      *   **Hidden Reality:** The levers interact non-linearly. (e.g., Tax works only if Transit is > X).
      *   **Information Distribution:**
          *   Group A (Residents): Feel the pain (Congestion levels).
          *   Group B (Business): Feel the cost (Economic output).
          *   Group C (Engineers): See the technical constraints (Capacity).
      *   **Process:** They must propose a policy, see the result, adjust.
      *   **Voting Trap:** If they vote immediately on "Raise Taxes," they might crash the economy because they didn't check with Engineers about capacity.

      *Simplifying for 80 mins:*
      Let's make it a puzzle where the *solution* depends on integrating distinct perspectives.
      **Activity Name:** "The Broken Circuit" (or "The Policy Black Box").
      Let's go with **"The Urban Grid."**

      *Setup:*
      *   3 Teams (6 students each).
      *   Each team gets a different "Dashboard."
      *   Team 1 sees *Cost*.
      *   Team 2 sees *Public Satisfaction*.
      *   Team 3 sees *Environmental Impact*.
      *   The "Facilitator" (Me) holds the *Causal Model*.
      *   Task: Keep all three metrics in the "Green Zone" for 4 rounds.
      *   Constraint: They can only submit *one* joint policy per round.
      *   Constraint: They cannot show their dashboards to each other, only describe them. (Forces communication/translation, not just data dumping).

      *Wait, one big group vs. small groups?*
      Dewey is about *social* inquiry. One big group of 18 is better for observing the "democracy" dynamic. But 18 is too many for one conversation.
      *Compromise:* 3 groups of 6. They compete? No, Dewey is cooperative.
      *Better:* 3 groups of 6, but they are *committees* of one body. They must coordinate.
      *Actually, for the "Voting vs. Inquiry" contrast:*
      Let's make it **one large group of 18**, but with distributed info packets.
      *   6 students get "Economic Data."
      *   6 students get "Social Data."
      *   6 students get "Technical Data."
      *   They must agree on a single plan.
      *   The "Truth" is hidden. They must test policies to learn the truth.

      *The Trap:*
      If they vote: The Economic group (usually louder/urgent) will dominate. They will pick a policy that boosts economy but crashes Tech.
      If they inquire: They will realize they don't know the rules. They will propose a "pilot program" (small test), observe results, then scale.

      *Let's refine the "Hidden Rules":*
      The rules need to be simple enough to solve in 3 rounds but complex enough to fail if ignored.
      Rule: Policy Success = (Econ + Social + Tech) - (Conflict Penalty).
      Conflict Penalty occurs if Econ > Tech limit.
      Only Tech people know the limit. Only Econ people know the potential gain.
      If they vote: Econ says "Maximize Gain!" Tech says "Wait!" Social says "I don't care." Vote passes "Maximize Gain." Tech limit breached. Failure.
      If they inquire: "What are our constraints?" "We don't know, let's try a small version."

  5.  **Drafting the Plan:**
      *   **Title:** The Black Box Policy Lab.
      *   **Materials:** Role cards, Decision Sheets, Result Slides.
      *   **Timeline:**
          *   0-10: Intro & Dewey Context (Brief).
          *   10-20: Role Distribution & Rules.
          *   20-50: The Simulation (3 Rounds).
          *   50-80: Debrief (Mapping to Dewey).

  6.  **Addressing the "Voting Trap":**
      How to ensure voting fails?
      Make the "obvious" choice wrong.
      Example: Everyone wants to "Build Factory."
      Econ: +10 points.
      Social: +5 points.
      Tech: -20 points (Hidden overload).
      Net: -5 (Failure).
      To succeed, they need to "Build Small Factory + Upgrade Grid."
      Econ: +5. Social: +5. Tech: +5. Net: +15.
      The "Build Factory" option is salient and urgent. The "Upgrade Grid" is boring and invisible until asked.
      *Crucial:* The Tech students must have information that *contradicts* the Econ students' urgency, but they lack the authority to veto, only the data to warn. If the group votes, Econ wins. If they inquire, they ask Tech "Can we do this?"

  7.  **Addressing the Debrief:**
      *   Map the "Crisis" to Dewey's "Problematic Situation."
      *   Map the "Role Cards" to "Diversity of Standpoint" (essential for data, not just fairness).
      *   Map the "Rounds" to "Experimental Testing."
      *   Map the "Results" to "Consequences as Feedback."
      *   Map "Success" to "Warranted Assertability" (it worked for now, not eternal truth).

  8.  **Addressing Limitations:**
      *   Real democracy doesn't have a Facilitator with an Answer Key.
      *   Real problems don't resolve in 3 rounds.
      *   Power dynamics are harder to escape than role cards.

  9.  **Refining the Activity Mechanics (Self-Correction):**
      *   *Risk:* 18 people talking at once is chaos.
      *   *Fix:* Use a "Spokesperson" system that rotates, OR break into 3 groups of 6 that *think* they are competing but actually need to share data to win.
      *   *Better Fix for Dewey:* Keep them as one "Assembly." But give them a structured protocol for the first 5 minutes of deliberation. No, that interferes with the "natural" failure.
      *   *Best Fix:* Give them a physical constraint. They cannot leave their seats. They can only pass notes or send "Liaisons."
      *   *Actually, simplest:* 3 Tables of 6. Each table is a "Department." They must submit a joint recommendation. But the *score* is global. If Dept A optimizes for their metric and ignores Dept B, the Global Score fails.
      *   *Wait, the prompt asks for "The Group" to solve a problem.*
      *   Let's go with **One Big Group, Distributed Info.**
      *   To manage chaos: Use a "Talking Stick" or "Proposal Form."
      *   Actually, 18 is manageable if the task is structured.
      *   Let's give them 3 Rounds.
      *   Round 1: Open deliberation (Chaos likely).
      *   Round 2: Reflection.
      *   Round 3: Final.
      *   *Wait, I need them to fail if they vote.*
      *   Okay, I will act as the "Black Box." They submit a policy. I return the result.
      *   To prevent chaos: They must submit a *written* policy signed by 3 representatives from *different* information clusters. This forces cross-cluster communication.

      *Revised Plan:*
      1.  Divide class into 3 "Bureaus" (Econ, Social, Tech) of 6 people each.
      2.  Each Bureau gets private data.
      3.  They have 5 mins to read data.
      4.  They enter "Legislative Session" (All 18 together).
      5.  They must pass 3 Policies over 3 Rounds.
      6.  **The Kicker:** The scoring rule is hidden.
          *   Policy needs to balance all 3 metrics.
          *   If one metric tanks, everyone fails.
          *   *Hidden Interaction:* Econ growth causes Tech strain. Tech strain causes Social unrest.
          *   If they just vote "Maximize Econ," they lose.
          *   If they ask "What does Tech think about Max Econ?" they learn the constraint.
      7.  **Enforcing Inquiry:** I will not accept a vote. I will ask "What is your hypothesis for why this will work?" before I grade it. (This forces them to articulate the inquiry).

      *Wait, 80 minutes is tight.*
      Setup: 10 mins.
      Activity: 40 mins.
      Debrief: 30 mins.
      Activity needs to be tight. 3 Rounds is good.
      Round 1 (10 mins): Deliberation + Decision. (Likely failure/sub-optimal).
      Feedback (2 mins).
      Round 2 (10 mins): Deliberation + Decision. (Adjustment).
      Feedback (2 mins).
      Round 3 (10 mins): Deliberation + Decision. (Optimization).
      Debrief starts.

      *What if they succeed too fast?*
      Make the interaction non-obvious.
      *   Econ: "Build Dam" = +$100, -10 Tech Capacity.
      *   Tech: "Capacity Limit" = 15.
      *   Social: "Displacement" = -20 Satisfaction if Dam built.
      *   Solution: "Build Small Dam + Resettle People."
      *   This requires trading info. Econ doesn't know Tech limit. Tech doesn't know Social cost. Social doesn't know Econ benefit.
      *   If they vote: Econ dominates (Money is loud).
      *   If they inquire: They realize they are blind.

  10. **Finalizing the Design:**
      *   **Name:** The Tri-Committee Crisis.
      *   **Roles:** Economy, Ecology, Equity. (Alliteration helps).
      *   **Materials:** Role Cards, Decision Sheets, Projector for results.
      *   **Facilitator Script:** Crucial for the "Black Box" reveal.
      *   **Debrief Questions:** Specific mapping to Dewey.
      *   **Pitfalls:** Dominance by Philosophy majors (theorizing without acting), Poli Sci majors (procedural obsession), Silence of shy students.
      *   **Handling Pitfalls:** Don't stop the game. Note it. Use it in debrief. "Who spoke? Whose data was heard?"

  11. **Checking against constraints:**
      *   18 students? Yes.
      *   80 mins? Yes.
      *   Dewey concepts? Yes (Inquiry, Problematic Situation, Consequences).
      *   Voting fails? Yes, if info isn't shared.
      *   Limitations acknowledged? Yes.

  12. **Writing the Response:**
      *   Structure: Overview, Materials, Timeline, Activity Mechanics, Debrief Guide, Pitfalls, Limitations.
      *   Tone: Practical, pedagogical, philosophically precise.

      *(Self-Correction during drafting)*: Make sure the "Hidden Rule" is explicitly described in the facilitator notes so the user knows *why* voting fails.
      *Rule:* Total Score = (Econ + Ecol + Equity) - (Imbalance Penalty).
      *Imbalance Penalty:* If any two metrics differ by more than 20 points, subtract 50.
      *Why this works:* Maximizing one metric triggers the penalty. They must *balance*, which requires knowing all three baselines. Voting usually maximizes the most salient metric. Inquiry discovers the baselines.

      *Wait, one more thing:* Dewey emphasizes *action*. The activity needs to feel like *doing*, not just talking.
      *Adjustment:* The "Policy" isn't just a choice A/B/C. It's a budget allocation. $100M to allocate.
      *   Econ projects cost money, give Econ points.
      *   Ecol projects cost money, give Ecol points.
      *   Equity projects cost money, give Equity points.
      *   Hidden Rule: Some projects have side effects. (e.g., Econ Project X costs $50, gives +30 Econ, but -20 Ecol).
      *   Only Ecol card says "Project X harms Ecol."
      *   Only Econ card says "Project X helps Econ."
      *   If they vote on Project X without talking, Ecol tanks.
      *   This is clearer. I will use this "Budget with Externalities" model.

      *Let's refine the "Voting Fails" mechanism:*
      If they vote, they vote on *projects*.
      If they inquire, they vote on *information gathering* or *pilots* first?
      No, keep it simple. They vote on projects.
      Failure mode: They pick the "High Yield" project.
      Success mode: They pick the "Balanced Portfolio."
      To pick Balanced, Econ must know Ecol's constraints. Ecol must know Econ's needs.
      If they just vote, the "High Yield" (Econ) looks best to everyone because Ecol/Equity don't know the side effects until it's too late.
      *Correction:* If Ecol doesn't know the side effect, they can't warn.
      *Fix:* The Role Cards contain the *Side Effects*.
      *   Econ Card: "Project Alpha: +30 Econ, Cost $50." (Doesn't mention Ecol damage).
      *   Ecol Card: "Project Alpha: -30 Ecol." (Doesn't mention Econ gain).
      *   Equity Card: "Project Alpha: 0 Equity."
      *   If they don't share cards, Econ sees +30, Ecol sees -30.
      *   If they vote, Econ argues "Gain!" Ecol argues "Loss!" It becomes a tug-of-war (politics).
      *   If they *inquire*, they ask "Why do you say loss?" "Show me the card." "Oh, it produces gain *and* loss. How do we mitigate?"
      *   This captures the shift from *bargaining* (I want win, you want win) to *inquiry* (What is the nature of the situation?).

      *Okay, ready to write.*
answer: |-
  ## Activity Design: "The Black Box Budget"

  **Goal:** Demonstrate Dewey's claim that democracy is a method of social intelligence (experimental inquiry) rather than a mechanism for aggregating pre-existing preferences (voting).
  **Time:** 80 Minutes (10 Setup, 45 Activity, 25 Debrief).
  **Class Size:** 18 Students.
  **Materials:** Printed Role Cards (3 types), Decision Sheets, Projector (for results).

  ---

  ### 1. The Setup (10 Minutes)

  **The Narrative:**
  Tell the class they are the "Steering Committee" for a city facing a multi-dimensional crisis. They have **$100 Million** to allocate across a menu of 5 Projects. They must pass **3 Rounds** of budgets. The goal is to maximize the **City Viability Score** at the end of Round 3.

  **The Distribution:**
  Divide the class into **3 Bureaus** of 6 students each. Seat them in distinct clusters.
  *   **Bureau A (Economy):** Cares about GDP/Jobs.
  *   **Bureau B (Ecology):** Cares about Sustainability/Health.
  *   **Bureau C (Equity):** Cares about Housing/Equality.

  **The Rules:**
  1.  **Private Information:** Students cannot show their Role Cards to other Bureaus. They can only *describe* what is on them. (This forces translation/communication, not just data dumping).
  2.  **Joint Decision:** All 18 must agree on a single budget allocation per round.
  3.  **The Black Box:** You (the instructor) are the "City Simulator." You will not tell them the rules of how projects interact. They will only see the *results* after each round.
  4.  **No Voting:** Tell them: *"You can vote if you want, but I will not accept a decision unless you can state the hypothesis behind it. What do you think will happen and why?"* (This subtly penalizes blind voting).

  ---

  ### 2. The Activity (45 Minutes)

  **The Hidden Mechanics (For Instructor Eyes Only):**
  The projects have **hidden externalities**. Success requires discovering these interactions through testing and information sharing.

  *   **Project 1 (Factory Zone):** Cost $40. **+30 Econ**, **-20 Ecol**, **0 Equity**.
  *   **Project 2 (Green Transit):** Cost $40. **+10 Econ**, **+20 Ecol**, **+20 Equity**.
  *   **Project 3 (Luxury Housing):** Cost $20. **+10 Econ**, **-10 Ecol**, **-20 Equity**.
  *   **Project 4 (Community Grants):** Cost $20. **0 Econ**, **+10 Ecol**, **+30 Equity**.
  *   **Project 5 (Status Quo):** Cost $0. **0 All**.

  **The Trap (Why Voting Fails):**
  *   **The "Obvious" Vote:** Project 1 looks best to the Econ bureau. Project 4 looks best to Equity. If they vote based on *preference*, they deadlock or pick Project 1 (because Econ is usually framed as "urgent").
  *   **The Consequence:** If they pick Project 1, Ecol score tanks. If Ecol score drops below a threshold (hidden), *Econ points are halved* in the next round (environmental collapse hurts economy).
  *   **The Inquiry Solution:** They must realize Project 2 is the "keystone." It requires Econ to sacrifice short-term gain for long-term stability. They only learn this by asking *why* Ecol opposes Project 1, or by testing Project 1 in Round 1, seeing the crash, and revising.

  **Round 1 (15 Minutes): The Problematic Situation**
  *   **Task:** Allocate the $100M.
  *   **Dynamic:** Expect chaos. Econ bureau will likely push Project 1. Equity will push Project 4.
  *   **Instructor Role:** Walk around. If you hear "Let's just vote," don't stop them. Let them feel the friction. If they ask you "Is this allowed?", say "Check your data."
  *   **Outcome:** Most groups will choose a high-spend, unbalanced budget (e.g., 2x Project 1, 1x Project 3).
  *   **Feedback:** Project the results.
      *   *Econ: High. Ecol: Critical. Equity: Low.*
      *   *Announcement:* "Due to Environmental Collapse, next round's Economic output is reduced by 50%." (This is the *consequence as feedback*).

  **Round 2 (15 Minutes): Hypothesis & Revision**
  *   **Task:** Allocate $100M (New Budget).
  *   **Dynamic:** The "crash" forces a re-evaluation. This is the pivot point.
      *   *Failure Mode:* They blame the "rules" or the instructor. They vote for a "safe" mix without understanding why.
      *   *Success Mode:* Bureaus start cross-examining. "Why did Ecol crash?" "Because Project 1 hurts us." "Why didn't you say so?" "We weren't asked."
      *   They begin to treat the other Bureaus as *sources of data* rather than *opponents*.
  *   **Feedback:** Project results. If they moved toward Project 2 (Transit), scores stabilize.

  **Round 3 (15 Minutes): Warranted Assertability**
  *   **Task:** Final Allocation.
  *   **Dynamic:** They should now be proposing policies based on a shared model of the city. "If we do X, Y happens, so we need Z to mitigate."
  *   **Final Score:** Calculate total Viability. Compare with other sections (if applicable) or a "Expert Benchmark" (you have a pre-calculated optimal score).

  ---

  ### 3. The Debrief (25 Minutes)

  Do not start by explaining Dewey. Start by asking them to analyze their own process.

  **Phase 1: Phenomenology (5 mins)**
  *   "In Round 1, how did you decide? What was the dominant method?" (Likely answers: Voting, loudest voice, compromise).
  *   "In Round 3, how was it different?" (Likely answers: We asked more questions, we looked at the whole picture).
  *   "When did you feel the most frustrated? When did you feel the most productive?"

  **Phase 2: Mapping to Dewey (15 mins)**
  Use the board to map their experience to Dewey's terminology.

  | Activity Moment | Deweyan Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **The Crisis/Score** | **The Problematic Situation** | "Democracy doesn't start with voting; it starts with a shared problem that blocks habitual action. When did you realize your usual way of deciding wasn't working?" |
  | **Role Cards** | **Diversity of Standpoint** | "Why did I give you different cards? In Dewey's view, is diversity just 'fairness'? Or is it epistemic necessity?" (Key point: Excluding a group = losing data = bad science). |
  | **Round 1 Failure** | **Consequences as Feedback** | "Voting treats preferences as fixed. Inquiry treats them as hypotheses. How did the 'Environmental Collapse' change your preferences?" |
  | **Cross-Talk** | **Free Communication** | "Dewey argues communication isn't just talking; it's the creation of a shared mind. When did you stop *persuading* and start *investigating*?" |
  | **Final Budget** | **Warranted Assertability** | "Did you find the 'Truth' of the city? Or just a solution that worked for now? How is this different than claiming your policy is 'Right'?" |

  **Phase 3: The Cost of Democracy (5 mins)**
  *   "This took 45 minutes to allocate a fake budget. Real democracy is slow. Why does Dewey think this slowness is a feature, not a bug?"
  *   "What happens to the inquiry if one Bureau refuses to share their data? (Connect to voter suppression/propaganda)."

  ---

  ### 4. Predictable Pitfalls & Facilitation Notes

  **1. The "Philosophy Major" Trap (Theorizing without Acting)**
  *   *What happens:* 3 students stand up and debate the *definition* of justice for 10 minutes while the clock runs.
  *   *Don't Intervene:* Let the clock run. Let them feel the anxiety of the ticking timer.
  *   *Debrief Hook:* "Dewey warns against the 'spectator theory of knowledge.' You can't know the city by thinking about it; you have to act on it. How did over-theorizing hurt your score?"

  **2. The "Poli Sci" Trap (Procedural Obsession)**
  *   *What happens:* They spend 20 minutes designing a voting system instead of making a decision.
  *   *Don't Intervene:* Let them build the perfect procedure that yields no data.
  *   *Debrief Hook:* "Democracy is not a machine that runs itself. It requires the fuel of inquiry. You built the engine but didn't put gas in it."

  **3. The Dominant Voice**
  *   *What happens:* One student in the Econ Bureau dictates the strategy.
  *   *Don't Intervene:* Note who spoke and who didn't.
  *   *Debrief Hook:* "If the Equity Bureau had stayed silent, would you have known about the Housing crash? Dewey argues that silencing a group isn't just mean; it makes the whole group *stupid*."

  **4. The "Answer Key" Hunt**
  *   *What happens:* Students ask you, "Is Project 2 the right one?"
  *   *Response:* "I only report consequences. You must determine the value."
  *   *Debrief Hook:* "In real democracy, there is no Facilitator with the Answer Key. We only have each other and the consequences of our actions."

  ---

  ### 5. Limitations of the Analogy (Be Honest Here)

  In the final 5 minutes, acknowledge where the activity fails to capture Dewey's full vision. This builds trust and nuance.

  1.  **The Facilitator Problem:** In the activity, *you* hold the truth (the scoring rules). In Dewey's democracy, **there is no external truth**. The "truth" is created *by* the inquiry. The activity is too positivist; real social inquiry is more interpretive.
  2.  **The Endpoint:** The activity ends with a "Final Score." Real democracy is **open-ended**. There is no final round. The "solution" of Round 3 becomes the "problematic situation" of Round 4.
  3.  **The Stakes:** Students can walk away if they lose. In real democracy, **we are stuck with each other**. The "cost" of failure is shared suffering, not a lower grade.
  4.  **Power:** In the activity, the Econ Bureau *could* share info but chose not to. In reality, power structures actively **conceal** information (propaganda, secrecy). Dewey's model assumes a level of good faith that is often absent.

  ### Materials Checklist
  *   **3 Sets of Role Cards** (6 of each type). *Text should be large and clear.*
  *   **Decision Sheets** (One per round, requires signatures from all 3 Bureaus).
  *   **Projector Slide** with the 5 Project Options (Cost only, benefits hidden).
  *   **Timer** (Visible to students).

  ### Sample Role Card Text (Economy Bureau)
  > **YOUR GOAL:** Maximize Economic Growth.
  > **YOUR DATA:**
  > *   **Project 1 (Factory):** Generates high jobs. Essential for short-term stability.
  > *   **Project 2 (Transit):** Expensive, low immediate job return.
  > *   **Project 3 (Housing):** High construction contracts.
  > *   **Project 4 (Grants):** Pure cost. No economic return.
  > *   **WARNING:** If Growth stalls for 2 rounds, your Bureau faces budget cuts.
  > *(Note: You do NOT know the Environmental or Equity impacts).*

  *(Create corresponding cards for Ecology and Equity with complementary/contradictory data).*
