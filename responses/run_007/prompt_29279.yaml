answer: |-
  This is a critical juncture in a metaethics seminar. The Frege–Geach (F-G) problem is often taught as a specific objection to non-cognitivism, but for your students to grasp the contemporary landscape, they must see it as a constraint on the *interface* between semantics, logic, and the philosophy of mind. If they view it merely as "how do we validate *modus ponens*?", they will miss why the problem resists solution.

  Below is a systematic architecture of the desiderata. I have categorized them by the domain of theory they constrain (Logic, Semantics, Psychology). I have also flagged the "fault lines"—places where satisfying one desideratum threatens to violate another.

  ### I. The Architecture of Desiderata

  #### A. Logical and Semantic Constraints
  *These constraints ensure the solution respects the formal behavior of moral language.*

  **1. Preservation of Validity (The Logic Constraint)**
  *   **Motivation:** Moral arguments (e.g., "If murder is wrong, then getting your brother to murder is wrong; murder is wrong; therefore, getting your brother to murder is wrong") are intuitively valid. A solution must explain *why* they are valid, not merely stipulate that they are.
  *   **Status:** **Non-negotiable.** Any theory that implies these arguments are invalid commits a revisionary error that contradicts linguistic competence.
  *   **Tension Flag:** Satisfying this often requires a semantics that looks truth-conditional. If the expressivist adopts a truth-conditional semantics to secure validity, they risk collapsing into realism (see *Tension 1* below).

  **2. Semantic Uniformity / Univocality (The Geach Constraint)**
  *   **Motivation:** The term "wrong" must contribute the same semantic content in an asserted context ("Murder is wrong") as it does in an unasserted/embedded context ("If murder is wrong..."). If the meaning shifts, the argument commits the fallacy of equivocation.
  *   **Status:** **Non-negotiable.** This is the heart of Geach's original objection. Without this, there is no F-G problem, only a dissolution of it.
  *   **Tension Flag:** This is the primary source of friction with *Psychological Realism* (see Desideratum 5). It is difficult to maintain that the *meaning* is identical while the *psychological state* of the speaker differs radically between asserting and hypothesizing.

  **3. Compositionality (The Semantic Constraint)**
  *   **Motivation:** The meaning of a complex moral sentence must be determined by the meanings of its constituent parts and their mode of combination. We must be able to understand "It is not the case that stealing is wrong" without learning it as a new primitive.
  *   **Status:** **Non-negotiable.** Human language is productive; any semantic theory that fails compositionality fails to explain linguistic competence.
  *   **Tension Flag:** Standard compositionality operates on propositions (truth-bearers). Expressivism traditionally denies moral sentences express propositions. Satisfying compositionality without positing moral propositions is the central technical challenge of the last 30 years.

  #### B. Psychological and Metasemantic Constraints
  *These constraints ensure the solution remains distinctively *expressivist*.*

  **4. Preservation of the Expressivist Core (The Metasemantic Constraint)**
  *   **Motivation:** The solution must not solve the logical problem by secretly converting expressivism into realism. The fundamental insight—that moral judgment is essentially practical/action-guiding and distinct from belief—must remain intact.
  *   **Status:** **Non-negotiable (for Expressivism).** If a solution secures logic by positing moral facts/beliefs, it is a successful metaethical theory but a failed *expressivist* solution to F-G.
  *   **Tension Flag:** This is in direct tension with *Preservation of Validity* and *Compositionality*. The easiest way to satisfy logic and compositionality is to adopt cognitivism. Avoiding this "collapse" is what makes the problem hard.

  **5. Psychological Distinctness (The Mind Constraint)**
  *   **Motivation:** The mental state expressed by "Murder is wrong" must be distinct in kind from the state expressed by "Murder is happening." Typically, this is the belief/desire (or belief/planning) distinction.
  *   **Status:** **Non-negotiable.** If moral judgments are just a species of belief, the view is cognitivism.
  *   **Tension Flag:** This creates the **Negation Problem** (see *Tension 2* below). If "Wrong" expresses Attitude A, what attitude does "Not Wrong" express? It cannot be "Not Attitude A" (absence of attitude), nor can it easily be a contradictory attitude without looking like a contradictory belief.

  **6. Explanation of Inconsistency (The Rationality Constraint)**
  *   **Motivation:** The theory must explain why it is irrational to hold conflicting moral views (e.g., "Stealing is wrong" and "Stealing is not wrong") in the same way it is irrational to hold conflicting beliefs.
  *   **Status:** **Non-negotiable.** Moral disagreement exhibits a "clash" phenomenology that mere difference in taste does not.
  *   **Tension Flag:** Explaining inconsistency usually requires a logic of contradiction. If the mental states are not beliefs, defining "contradiction" for attitudes is notoriously difficult without borrowing the structure of belief.

  #### C. Linguistic Data Constraints
  *These constraints ensure the solution fits the actual usage of moral language.*

  **7. Truth-Aptness Simulation (The Surface Constraint)**
  *   **Motivation:** Moral sentences grammatically behave as truth-apt (they take "is true," embed under "knows that," etc.). The theory must explain this linguistic behavior.
  *   **Status:** **Preference / Version Dependent.** *Quasi-realists* (Blackburn) treat this as a non-negotiable explanatory target (we must earn the right to talk of truth). *Error theorists* or *Revisionists* might deny this is a requirement. However, for a standard expressivist solution, this is effectively non-negotiable.
  *   **Tension Flag:** "Earning the right" to truth-talk often looks like "pretending" to realists. Balancing the *simulation* of truth with the *denial* of truth-conditions is a delicate dialectical balance.

  **8. Embedding Flexibility (The Scope Constraint)**
  *   **Motivation:** The solution must handle not just conditionals, but negation, questions, modals ("It might be wrong"), and propositional attitudes ("John believes it is wrong").
  *   **Status:** **Non-negotiable.** A solution that works only for *modus ponens* but fails for negation or questions is incomplete.
  *   **Tension Flag:** This is where the **Negation Problem** arises most acutely. Handling conditionals is easier than handling negation while maintaining *Psychological Distinctness*.

  ---

  ### II. The Fault Lines: Jointly Unsatisfiable Desiderata

  You should warn your students that the literature is defined by attempts to navigate these tensions. In many cases, satisfying one set of desiderata appears to force the violation of another, given our current understanding of semantics and mind.

  **Tension 1: The Compositionality vs. Non-Propositionalism Dilemma**
  *   **The Conflict:** *Compositionality* (Desideratum 3) + *Expressivist Core* (Desideratum 4).
  *   **The Problem:** Standard compositional semantics builds complex meanings out of simpler meanings that function as arguments for functions (usually truth-values). If moral sentences do not express propositions (to satisfy the Expressivist Core), it is unclear what the "semantic value" of a moral term is that allows it to compose.
  *   **The Consequence:** Solutions often posit "proposition-like" entities (e.g., Gibbard's "norms," Blackburn's "commitments"). Critics argue these are propositions in all but name, threatening *Desideratum 4*. If the expressivist insists they are *not* proposition-like, they struggle to satisfy *Desideratum 3*.

  **Tension 2: The Negation Problem (Schroeder's Challenge)**
  *   **The Conflict:** *Semantic Uniformity* (Desideratum 2) + *Psychological Distinctness* (Desideratum 5) + *Explanation of Inconsistency* (Desideratum 6).
  *   **The Problem:** Consider "Murder is wrong" (expresses Attitude A) and "Murder is not wrong."
      *   If "not wrong" expresses the *absence* of Attitude A, then believing "wrong" and "not wrong" is not inconsistent (one can have an attitude and lack it simultaneously regarding different subjects, but here the subject is the same).
      *   If "not wrong" expresses a *contradictory* Attitude B, we need to explain why having Attitude A and Attitude B is inconsistent *without* appealing to the inconsistency of beliefs (to satisfy *Desideratum 5*).
      *   Most expressivist accounts of attitudes fail to generate a notion of "inconsistency" for attitudes that is as robust as logical inconsistency for beliefs.
  *   **The Consequence:** This specific triad ruled out the dominant Quasi-Realist and Norm-Expressivist accounts (Blackburn, Gibbard) for nearly a decade until hybrid or B-type solutions emerged.

  **Tension 3: Validity vs. Metasemantic Grounding**
  *   **The Conflict:** *Preservation of Validity* (Desideratum 1) + *Metasemantic Transparency* (Implicit in Desideratum 4).
  *   **The Problem:** An expressivist can *stipulate* a logic of attitudes that validates *modus ponens*. However, Geach's worry is not just that the logic works, but *why* it works. In realism, validity works because of truth-preservation. In expressivism, if validity is based on "consistency of attitudes," critics argue this does not match the *meaning* of logical connectives (which are truth-functional).
  *   **The Consequence:** The expressivist risks charging the connectives with double-duty: functioning truth-functionally for descriptive sentences and attitude-functionally for moral sentences. This threatens *Semantic Uniformity* for the *logical connectives* themselves, even if the moral terms are uniform.

  ---

  ### III. The Single Most Exclusionary Desideratum

  If you must identify the single requirement that has ruled out the largest number of prominent attempted solutions, it is:

  **Semantic Uniformity across Asserted and Unasserted Contexts (Desideratum 2), specifically as enforced by the Negation Problem.**

  **Why this is the killer:**
  1.  **Historical Body Count:** This requirement is what defeated the "Higher-Order Attitude" models (Blackburn) and the early "Norm-Expressivist" models (Gibbard). Both could explain conditionals reasonably well by positing complex attitudes. However, both failed to provide a uniform semantics for **negation** that preserved the distinctness of the moral attitude. They could not specify an attitude expressed by "Not Wrong" that was logically inconsistent with "Wrong" without that attitude simply being a belief.
  2.  **The Equivocation Trap:** Any solution that relaxes this constraint (e.g., by saying "wrong" means *boo* in assertions but *the property of being boo-ed* in conditionals) immediately solves the logical problem but fails as *expressivism* (it becomes a hybrid or realist view). Thus, holding this line is the narrowest path.
  3.  **Technical Difficulty:** It forces the theorist to construct a combinatorial semantics for *non-cognitive states*. We have a well-understood combinatorial semantics for propositions (set theory, possible worlds). We do not have a well-understood combinatorial semantics for plans, norms, or attitudes that mirrors logical operations (negation, disjunction) without reducing those operations to their propositional counterparts.

  **Pedagogical Tip:** Tell your students that if a proposed solution makes the meaning of "wrong" in "If murder is wrong..." different from "Murder is wrong," they have not solved Frege-Geach; they have dissolved it by changing the subject. If they make the meanings the same but the mental states different, they must explain how logic tracks meaning rather than mental states. This is the bottleneck.
