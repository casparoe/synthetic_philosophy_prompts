answer: |-
  The tension you are feeling is a classic problem in epistemology known as the problem of **Logical Omniscience**. Standard definitions of rationality often imply that if you believe *P*, and *P* entails *Q*, you ought to believe *Q*. But as your cases (specifically 2, 3, and 6) correctly intuit, no human is rationally required to be logically omniscient. We have cognitive limits.

  The conflict between Case 3 (Callum) and Case 5 (Evan) arises because you are treating "logical deduction" and "probabilistic calculation" as different categories, when under a bounded rationality framework, they are functionally the same: both are computational tasks required to detect inconsistency.

  To resolve this, I propose a single unifying principle. To make your verdicts consistent, you will need to revise your intuition on Case 5.

  ### The Principle: Competence-Relative Accessibility

  **Statement:**
  An agent is rationally criticizable for holding inconsistent attitudes (beliefs, credences, or intentions) if and only if the inconsistency is **accessible** to them. Accessibility is determined by two constraints:

  1.  **Cognitive Capacity:** The inference required to reveal the inconsistency must not exceed the agent's working memory or attentional resources (the *Bounds of Processing*).
  2.  **Conceptual Competence:** The agent must possess the conceptual tools and background knowledge necessary to recognize the relationship between the attitudes without specialized technical training (the *Bounds of Knowledge*).

  If an inconsistency is hidden by computational complexity (too many steps) or conceptual opacity (requires training one doesn't have), failing to resolve it is not irrational.

  ---

  ### Application to Your Seven Cases

  Here is how this principle handles your data. Note the necessary revision to Case 5.

  **1. Simple Modus Ponens (Alice)**
  *   **Analysis:** The inference is one step. It requires no specialized training and fits easily in working memory. It is highly accessible.
  *   **Verdict:** **Irrational.** (Matches your verdict).
  *   **Reasoning:** She fails the attentional component of Cognitive Capacity.

  **2. Long Chain (Ben)**
  *   **Analysis:** The inference requires 20 steps. This exceeds standard working memory limits.
  *   **Verdict:** **Not Irrational.** (Matches your verdict).
  *   **Reasoning:** Fails the Cognitive Capacity constraint.

  **3. Hidden Contradiction (Callum)**
  *   **Analysis:** The contradiction requires 3–4 inferential steps connecting complex social concepts ("interference," "employment," "exploitation"). This is on the border, but generally exceeds "casual reflection."
  *   **Verdict:** **Not Irrational.** (Matches your verdict).
  *   **Reasoning:** Fails the Cognitive Capacity constraint (too many conceptual bridges) and potentially the Conceptual Competence constraint (requires specific understanding of contract law implications).

  **4. Obvious Contradiction (Diane)**
  *   **Analysis:** The contradiction is semantic and immediate ("equal worth" vs. "matter more").
  *   **Verdict:** **Irrational.** (Matches your verdict).
  *   **Reasoning:** Fully accessible under both constraints.

  **5. Probabilistic Incoherence (Evan)**
  *   **Analysis:** Evan violates $P(A \lor B) \geq P(A)$. Detecting this requires knowledge of probability axioms. Evan lacks this training.
  *   **Verdict:** **Not Irrational.** (**Revision Required**).
  *   **Reasoning:** Fails the Conceptual Competence constraint. Just as Ben is not required to compute a 20-step logical chain, Evan is not required to compute probability axioms he has never learned. To call Evan irrational while excusing Ben is to privilege mathematical norms over logical norms without justification. Both are formal systems requiring training to navigate perfectly.

  **6. Unproven Theorem (Fatima)**
  *   **Analysis:** The link between axioms and the conjecture is currently unknown to humanity, let alone Fatima.
  *   **Verdict:** **Not Irrational.** (Matches your verdict).
  *   **Reasoning:** Fails the Cognitive Capacity constraint (the computation is currently impossible).

  **7. Forgotten Premise (Greg)**
  *   **Analysis:** The inference is one step (Modus Ponens). The delay (Wednesday to Friday) does not increase computational complexity; it is an attentional failure regarding a salient practical deadline.
  *   **Verdict:** **Irrational.** (Matches your verdict).
  *   **Reasoning:** Meets both constraints. A rational agent is required to attend to salient practical implications of their beliefs.

  ---

  ### Why You Must Revise Case 5

  Your hesitation on Case 5 likely stems from the idea that probabilistic coherence is a *constitutive* norm of belief. Some philosophers argue that to *have* a credence just *is* to be disposed to bet in certain ways, and if those dispositions are incoherent, you are defective by definition.

  However, your verdicts on Cases 2, 3, and 6 commit you to **Bounded Rationality**. You have already accepted that humans are not required to know all the consequences of their beliefs. Probability theory is simply the logic of partial belief. If Ben is excused for not knowing the logical consequences of his beliefs (Case 2), Evan must be excused for not knowing the probabilistic consequences of his credences (Case 5). Both require computational effort and technical knowledge they may lack.

  If you keep Case 5 as "Irrational," you must explain why logical ignorance (Case 3) is excusable but mathematical ignorance (Case 5) is not. There is no principled difference; both are failures of calculation beyond the agent's competence.

  ---

  ### The New Case: Distrust of the Arguer

  **The Case:** Someone believes the premises of a valid argument, can find no flaw in the reasoning, but rejects the conclusion because they distrust the arguer.

  **Application of the Principle:**
  1.  **Cognitive Capacity:** The inference is valid, and the agent "can find no flaw." This implies the logical link is accessible to their working memory.
  2.  **Conceptual Competence:** The agent understands the premises and the reasoning. Distrust of the *source* is not a conceptual tool for evaluating *validity*.

  **Verdict:** **Irrational.**

  **Reasoning:**
  Rationality is responsive to reasons, not sources. If the agent genuinely believes the premises ($P$) and genuinely acknowledges that the reasoning is flawlessly valid ($P \to Q$), then the conclusion ($Q$) is **Accessible**.

  Distrust of the arguer is a heuristic for determining whether the *premises* are true or whether there *might* be a hidden flaw. However, the case stipulates the agent *already believes the premises* and *can find no flaw*. At that point, the arguer's identity is irrelevant. To reject the conclusion is to assert that $P$ and $P \to Q$ are true, but $Q$ is false. This is a direct violation of the Principle of Accessible Coherence (specifically the Cognitive Capacity constraint, as the inference is immediate).

  **Nuance:**
  The only way this agent could be rational is if their distrust functions as a **defeater** for their own judgment. For example: *"I think this logic is sound, but because I know this arguer is a sophist, I suspect there is a subtle fallacy I am missing."*
  *   If they reject the conclusion because they suspect a hidden flaw: **Not Irrational** (They are doubting their assessment of the reasoning).
  *   If they reject the conclusion while maintaining the reasoning is sound: **Irrational** (They are refusing to follow the logic they endorse).

  Given your description ("can find no flaw in the reasoning"), the latter applies. They are prioritizing social heuristics over accessible logical norms.

  ### Summary of Advice

  1.  **Adopt the Principle of Competence-Relative Accessibility.** It unifies your intuitions about memory limits (Ben), attention (Alice/Greg), and knowledge limits (Callum).
  2.  **Revise Case 5.** Classify Evan as **Not Irrational**. His incoherence is inaccessible due to a lack of conceptual competence, exactly like Callum's hidden contradiction.
  3.  **Verdict on New Case.** The person is **Irrational**. Once premises and validity are accepted, the conclusion is accessible. Distrust of the source cannot rationally override a transparent logical implication.
