  I'm giving a talk at the Formal Epistemology Workshop in a couple months and I'm already loosing sleep over the Q&A. The paper is called something like "The Reference Class Problem as a Reductio of Objective Single-Case Probability," and the core argument goes: start with the standard reference class problem (you want the probability that this patient will respond to this drug, but they belong to infinitely many reference classes with different response rates, and there's no non-arbitrary way to pick one), then show that every proposed solution — the narrowest reference class rule, the principle of total evidence, natural kinds approaches, the various objective Bayesian moves — either fails to pick out a unique probability or tacitly imports subjective elements like priors over reference classes. I conclude that we should stop talking about objective single-case probabilities and instead treat all probability assignments to individual events as implicitly relative to a choice of reference class, which is itself a judgment call. The audience is mostly philosophers of probability and formal epistemologists, but there's a contingent of about five statisticians who work on causal inference and propensity scores, and they tend to get annoyed when philosophers tell them their methods lack foundations. There are at least two people in the room who've written defenses of the narrowest-reference-class principle, and one of them is my former advisor. I need a prep sheet for the questions: the objections I'll actually get, ordered from most to least damaging, phrased the way this specific crowd would phrase them (not the way a generic philosophy audience would), with a two-minute reply for each and a candid note on where my reply is softest. And please include the question I'm praying nobody asks. Write it all in continuous prose, no bullet points or headings or bold — just plain paragraphs, like you're writing me an email.
