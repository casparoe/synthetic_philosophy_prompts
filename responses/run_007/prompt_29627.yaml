prompt: |-
  I'm an undergrad and I help run our university's student prediction market, the one where people buy and sell contracts that pay a dollar if some campus event happens. I'm the only person on the team who has taken Decision Theory, so I'm the defacto odds person: each week I post the opening prices before trading opens, and we act as the counterparty, meaning we'll buy or sell a contract at the listed price until the order book takes over. The markets are small real-money things (capped stakes) like whether the library renovation finishes during fall term, whether the dinning-hall strike lasts past March, who wins the student election, whether the provost resigns. Last week we got taken apart on a library market: someone bought a combination of our contracts on 'finished during fall term,' 'finished during spring term,' and 'not finished by the end of spring term' that paid out no matter what, and it wasn't luck — our prices summed to more than a dollar across three outcomes that should sum to exactly a dollar. My co-managers just said the guy was sharp and we should post better prices, but I'm pretty sure we were Dutch-booked because our prices were incoherent. In class we proved the Dutch book theorem — a set of prices that violates the probability axioms is exploitable for sure loss — but going from the theorem to something I can actually run at 11pm before the market opens is a lot harder than I expected.

  So write me a procedure, a checklist I can actually use and hand to my co-managers who haven't taken the course, for deciding whether a set of prices we're about to post is coherent and won't expose us to a sure loss. Don't just say 'make them satisfy the probability axioms'; I need the questions in order, what counts as a good enough answer to each, where the procedure says stop and fix prices, where it says don't open the market at all, and where it has to hand the decision to a person because it's a judgment call. Then run it on at least these cases: (1) the library market from last week with prices 50¢, 30¢, and 25¢ on the three outcomes above; (2) a runoff-election market where we want to post 'A wins outright' at 60¢ and 'A makes the runoff' at 40¢; (3) a market everyone's been asking for on which professor gets tenure, where the outcomes aren't mutually exclusive and one of them is basically unverifiable — I suspect the procedure will say don't open it, which my co-managers will hate, but I need to know. Also be honest about what the procedure can't catch: correlated outcomes, people who know more than we do, thin markets, that kind of thing.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Undergraduate student, runs a university prediction market, sole Decision Theory background.
      *   **Problem:** Got "Dutch-booked" (sure loss) on a library market because prices summed to >100%. Co-managers don't understand the theory, just know they lost money.
      *   **Task:** Create a practical, actionable checklist/procedure for setting opening prices to ensure coherence (no Dutch book).
      *   **Requirements:**
          *   Step-by-step questions.
          *   Clear pass/fail criteria.
          *   Stop/fix/don't open triggers.
          *   Human judgment hand-off points.
          *   Apply to three specific cases (Library, Election, Tenure).
          *   Acknowledge limitations (correlation, information asymmetry, liquidity).
      *   **Tone:** Practical, authoritative but accessible to non-experts, honest about limitations.

  2.  **Deconstruct the Theory (Dutch Book Theorem & Probability Axioms):**
      *   *Axiom 1 (Non-negativity):* Prices must be $\ge 0$.
      *   *Axiom 2 (Normalization):* Prices of mutually exclusive and exhaustive outcomes must sum to 1 (or 100 cents).
      *   *Axiom 3 (Additivity):* Price of $A \cup B$ (where $A, B$ disjoint) = Price($A$) + Price($B$).
      *   *Conditional Probability:* Price($A|B$) * Price($B$) = Price($A \cap B$).
      *   *Arbitrage:* If Sum > 1, sell the bundle. If Sum < 1, buy the bundle.
      *   *Context:* The market acts as the counterparty (market maker). This means they *must* trade at posted prices. This makes coherence critical.

  3.  **Drafting the Procedure (The "Coherence Checklist"):**
      *   *Goal:* Make it usable at 11 PM by tired undergrads. No math jargon if possible.
      *   *Structure:*
          1.  Define the Outcomes.
          2.  Check Mutually Exclusive & Exhaustive (MECE).
          3.  Check Summation (The 100% Rule).
          4.  Check Logical Dependencies (Subsets/Conditionals).
          5.  Final Sanity Check.
      *   *Decision Points:* Green light, Fix Prices, Cancel Market.

  4.  **Developing the Steps (Iterative Refinement):**
      *   *Step 1: Outcome Definition.* Are they clear? If not, stop. (Addresses the Tenure case).
      *   *Step 2: MECE Check.* Do they cover everything? Do they overlap? (Crucial for the Library case).
      *   *Step 3: The Sum Rule.* If MECE, do they sum to 100¢? (The specific Library failure).
      *   *Step 4: Logical Consistency.* If A implies B, Price(A) $\le$ Price(B). (Crucial for the Election case).
      *   *Step 5: Verification.* Can we actually check the result? (Crucial for Tenure).

  5.  **Applying the Procedure to the Cases:**
      *   *Case 1 (Library):* Outcomes: Fall, Spring, Not by End of Spring. MECE? Yes. Sum: $0.50 + 0.30 + 0.25 = 1.05$. Fail. Action: Fix prices (lower spread/vig) before opening.
      *   *Case 2 (Election):* Outcomes: "A Wins Outright" vs. "A Makes Runoff". Wait, are these MECE? Usually, "Win Outright" means *no* runoff. "Makes Runoff" means *no* outright win. They are disjoint. But are they exhaustive? What if A drops out? What if B wins outright? The prompt implies a specific structure. Let's look closer: "A wins outright" (60¢) + "A makes runoff" (40¢). Sum = 100¢. *However*, logically, if A makes the runoff, they haven't won outright. But is it possible A *loses* the primary entirely? If "A makes runoff" implies A is top 2 but not #1, and "A wins outright" implies A is #1 with >50%. What if A gets 10% of the vote? Both contracts pay 0. So they aren't exhaustive. But the sum is 100¢. This implies the market thinks A *must* either win outright or make runoff. Is that coherent? It depends on the rules. If the rules guarantee A is a top contender, maybe. But usually, there's a "A loses early" option. If that option exists, Sum must be < 100¢. If Sum = 100¢, we are saying "A cannot lose early." If that's false, we are vulnerable. *Correction:* The prompt asks to run the procedure. I need to highlight the logical dependency. If "Win Outright" happens, "Make Runoff" cannot. If "Make Runoff" happens, "Win Outright" cannot. But Price(Win) + Price(Runoff) = 1.00 implies P(A loses early) = 0. Is that true? Probably not. This is a coherence risk.
      *   *Case 3 (Tenure):* Outcomes: Prof X, Prof Y, Prof Z. Not mutually exclusive (multiple can get tenure). Not exhaustive (none could get tenure). One unverifiable. Procedure should flag this as "Do Not Open."

  6.  **Addressing Limitations:**
      *   The procedure stops *internal* incoherence (Dutch Books).
      *   It does *not* stop *external* exploitation (Insider trading, better models).
      *   It does *not* fix liquidity risk (holding the bag).
      *   It does *not* fix ambiguous resolution (the "unverifiable" problem).

  7.  **Refining the Tone and Format:**
      *   Use bold headers.
      *   Use "STOP" warnings.
      *   Keep language simple ("cents" instead of "probabilities").
      *   Add a "Manager Handoff" section for judgment calls.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Election case clear?
      *   *Fix:* I need to be precise. If the contracts are "A Wins Round 1" and "A Reaches Round 2", these are mutually exclusive. If their prices sum to 100¢, we are asserting A *cannot* be eliminated in Round 1. If there is a chance A is eliminated in Round 1, the sum must be < 100¢. I will frame the checklist to catch this "Implicit Exhaustion" error.
      *   *Critique:* The Tenure case involves non-mutually exclusive outcomes.
      *   *Fix:* The checklist needs a specific step for "Overlap." If outcomes overlap, you can't just sum them. You need combinatorial contracts (e.g., "X AND Y"), which is too complex for a student market. Recommendation: Cancel or redesign.

  9.  **Final Polish:**
      *   Ensure the "Library" math is explicit ($1.05 > $1.00).
      *   Ensure the "Tenure" recommendation is firm (Don't open).
      *   Make sure the limitations section manages expectations for the co-managers.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic market-making problem. Your co-managers are right that the trader was sharp, but you are right that the loss was structural. When you act as the counterparty (the "house"), you are effectively selling a portfolio of state-contingent claims. If that portfolio violates the axioms of probability, you have created a money pump.

  Below is the **Market Coherence Protocol (MCP)**. It is designed to be printed and used by someone without Decision Theory training. It translates axioms into operational checks.

  ***

  # The Market Coherence Protocol (MCP)
  **Purpose:** Prevent sure-loss scenarios (Dutch Books) before markets open.
  **Who uses this:** The Duty Manager (any team member).
  **When:** 30 minutes before market open, after prices are drafted.

  ## Phase 1: Outcome Definition
  *Before looking at prices, look at the contracts.*

  **Q1: Is the resolution criteria crystal clear?**
  *   **Check:** Can a neutral third party look at the university records on the settlement date and determine the outcome without arguing?
  *   **Pass:** "Library renovation receives Certificate of Occupancy by Dec 31."
  *   **Fail:** "Library renovation is basically done by Dec 31." (What is *basically*?)
  *   **Action:** If **Fail**, **STOP**. Do not open the market. Rewrite the contract text.

  **Q2: Are the outcomes Mutually Exclusive?**
  *   **Check:** Can more than one contract pay out $1.00 simultaneously?
  *   **Pass:** Only one candidate can win the election.
  *   **Fail:** "Prof. Smith gets tenure" and "Prof. Jones gets tenure." (Both could happen).
  *   **Action:** If **Fail**, **STOP**. You cannot price these as a simple set. See *Manager Handoff* below.

  **Q3: Are the outcomes Collectively Exhaustive?**
  *   **Check:** Do the contracts cover *every* possible reality? Is there a scenario where *all* contracts pay $0?
  *   **Pass:** "Home Win," "Away Win," "Draw." (One must happen).
  *   **Fail:** "Candidate A wins," "Candidate B wins." (What if Candidate C wins? Or a tie?)
  *   **Action:** If **Fail**, you must include a "Field" or "Other" contract, OR acknowledge that the sum of prices must be **less than** $1.00.

  ---

  ## Phase 2: The Price Check
  *Now look at the opening prices (in cents).*

  **Q4: The 100-Cent Rule (For MECE Markets)**
  *   **Condition:** Applies ONLY if you passed Q2 (Exclusive) and Q3 (Exhaustive).
  *   **Check:** Add up the prices of all possible outcomes.
  *   **Pass:** Sum is exactly 100¢ (or slightly less to account for fees/spread, e.g., 98¢).
  *   **Fail:** Sum is greater than 100¢ (e.g., 105¢).
  *   **Action:** If **Fail**, **STOP**. **Do not open.** You are guaranteeing a loss. Reduce prices proportionally until the sum is ≤ 100¢.

  **Q5: The Subset Rule (For Nested Markets)**
  *   **Condition:** Applies if one outcome implies another (e.g., "Win Runoff" implies "Make Runoff").
  *   **Check:** Is the price of the specific outcome *lower* than the price of the general outcome?
  *   **Rule:** Price(Specific) ≤ Price(General).
  *   **Pass:** "A Wins Runoff" (20¢) is less than "A Makes Runoff" (40¢).
  *   **Fail:** "A Wins Runoff" (50¢) is greater than "A Makes Runoff" (40¢).
  *   **Action:** If **Fail**, **STOP**. Arbitrageurs will buy the General and sell the Specific for a risk-free profit. Fix prices.

  **Q6: The "Free Option" Check**
  *   **Check:** Is any price set at 0¢ or 100¢?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Action:** If **Fail**, **STOP**.
      *   If 0¢: Someone buys for free, gets a chance at $1. You lose expected value.
      *   If 100¢: Someone sells for $1, pays $1 later. You gain nothing but take liability.
      *   *Exception:* Only allowed if the event has already happened or is impossible (verify with Q1).

  ---

  ## Phase 3: Manager Handoff (Judgment Calls)
  *If the checklist triggers a STOP, the Duty Manager must escalate to the Senior Lead (you) if:*

  1.  **Outcomes Overlap (Q2 Fail):** We want to trade on overlapping events (e.g., multiple tenure candidates).
      *   *Decision:* **Do not open.** Combinatorial markets (bundling "Smith AND Jones") are too complex for our liquidity. Redesign as individual binary markets ("Will Smith get tenure? Yes/No") but warn traders that correlations exist.
  2.  **Outcomes Not Exhaustive (Q3 Fail):** We want to trade "A wins" and "B wins" without an "Other" contract.
      *   *Decision:* Permitted ONLY if Sum of Prices ≤ 90¢. The missing 10¢+ is our buffer for the "C wins" scenario. If the team wants to price them at 60¢ + 50¢ = 110¢, **deny**.
  3.  **Verification Risk (Q1 Fail):** The team insists the outcome is clear, but you suspect ambiguity.
      *   *Decision:* **Do not open.** Ambiguity leads to disputes, which kills market reputation.

  ***

  # Running the Protocol on Your Cases

  Here is how you apply the MCP to the three scenarios you mentioned. You can show this to your co-managers as a training example.

  ### Case 1: The Library Renovation (The Post-Mortem)
  *   **Outcomes:** (1) Finished Fall, (2) Finished Spring, (3) Not Finished by End of Spring.
  *   **Phase 1 Check:**
      *   Q1 (Clear?): Yes, "Certificate of Occupancy" date.
      *   Q2 (Exclusive?): Yes. It can't finish in Fall and Spring.
      *   Q3 (Exhaustive?): Yes. It must finish in Fall, Spring, or later.
  *   **Phase 2 Check:**
      *   Q4 (100-Cent Rule): Prices were 50¢ + 30¢ + 25¢ = **105¢**.
      *   **Result:** **FAIL.**
  *   **Verdict:** **STOP.** This is a guaranteed loss. A trader buys 1 unit of each for $1.05 total. No matter what happens, one contract pays $1.00. Wait, that's a loss of 5¢. *Correction:* If they buy 1 unit of each, they pay $1.05. One outcome occurs, they receive $1.00. Net loss to trader is 5¢. **Wait, I need to correct the Dutch Book logic for the user.**
      *   *Correction:* If the market *sells* at these prices, the trader *buys*. If the trader buys all three, they pay $1.05. They get $1.00 back. That's a loss for the trader.
      *   *The Real Dutch Book:* The market acts as counterparty. If the market posts **Bid/Ask** spreads, or if the market *buys* at these prices.
      *   *Scenario:* You said "we act as the counterparty... we'll buy or sell... at the listed price."
      *   If you post a single price (e.g., 50¢) and you are willing to take *either* side:
          *   Trader sells you "Fall" @ 50¢ (You pay 50¢).
          *   Trader sells you "Spring" @ 30¢ (You pay 30¢).
          *   Trader sells you "Not Spring" @ 25¢ (You pay 25¢).
          *   **Total You Pay:** $1.05.
          *   **Total You Receive:** $1.00 (whichever happens).
          *   **Your Loss:** 5¢ sure loss.
      *   **Verdict:** **FAIL.** The sum exceeds 100¢. If you are willing to buy at these prices, you are Dutch-booked.
      *   **Fix:** Prices must sum to ≤ 100¢ (e.g., 45¢, 28¢, 22¢ = 95¢). The remaining 5¢ is your "vig" or safety margin.

  ### Case 2: The Runoff Election
  *   **Outcomes:** (1) A Wins Outright, (2) A Makes Runoff.
  *   **Phase 1 Check:**
      *   Q2 (Exclusive?): Yes. You can't win outright and go to a runoff.
      *   Q3 (Exhaustive?): **NO.** What if A comes in 3rd place? A neither wins outright nor makes the runoff.
  *   **Phase 2 Check:**
      *   Q4 (100-Cent Rule): Since they are **NOT Exhaustive**, the sum *must* be less than 100¢.
      *   Proposed Prices: 60¢ + 40¢ = **100¢**.
      *   **Result:** **FAIL.** By pricing the sum at 100¢, you are asserting that "A coming in 3rd" is impossible (Probability = 0). If A comes in 3rd, both contracts pay $0. You keep the $1.00 premium. That sounds good for you, *but*...
      *   **The Risk:** If you believe there is *any* chance A comes in 3rd, your prices are incoherent with reality. However, strictly speaking, a sum of 100¢ on non-exhaustive events isn't a *mathematical* Dutch Book (you don't lose sure money), it's a **pricing error**.
      *   **The Real Danger:** If you allow trading on "A Loses Early" later, or if a smart trader realizes you priced out the 3rd place option, they can exploit the mispricing relative to other markets.
      *   **Better Check:** Q5 (Subset Rule). "A Makes Runoff" usually implies "A is in Top 2". "A Wins Outright" implies "A is #1". These are disjoint.
      *   **Verdict:** **CAUTION.** It is not a sure-loss Dutch Book (you won't lose money if A comes in 3rd), but it implies P(A loses early) = 0. If your team believes A could lose early, you must lower prices so Sum < 100¢ (e.g., 50¢ + 30¢ = 80¢).
      *   **Recommendation:** Lower prices to reflect the risk of A being eliminated in round 1.

  ### Case 3: The Tenure Market (The Trap)
  *   **Outcomes:** "Prof X gets tenure," "Prof Y gets tenure," "Prof Z gets tenure."
  *   **Phase 1 Check:**
      *   Q1 (Clear?): **FAIL.** "One of them is basically unverifiable." Tenure decisions are often confidential until a specific date, sometimes leaked, sometimes delayed. If the resolution date passes and the university hasn't announced, the market cannot settle.
      *   Q2 (Exclusive?): **FAIL.** Multiple professors can get tenure in the same cycle.
  *   **Phase 2 Check:**
      *   Cannot proceed to pricing.
  *   **Verdict:** **DO NOT OPEN.**
  *   **Reasoning:**
      1.  **Overlap:** If X and Y both get tenure, do you pay $2.00? If so, you can't treat these as a single 3-outcome market. They must be three separate binary markets ("Will X get tenure? Yes/No").
      2.  **Verification:** If the outcome is unverifiable, you will be forced to refund trades or make an arbitrary judgment. Both options destroy trust.
      3.  **Co-Manager Pushback:** Tell them: "If we can't verify the result, we can't pay out. If we can't pay out, we are running a casino, not a market. We skip this."

  ***

  # Limitations: What This Procedure Won't Catch
  *Be honest with your team. This checklist stops you from shooting yourself in the foot, but it doesn't make you invincible.*

  1.  **Information Asymmetry:** The checklist ensures your math is right, not that your *guess* is right. If a student knows the Provost is resigning tomorrow and you post a price of 10¢, you will get run over. The checklist won't stop this; only trading limits (caps) will.
  2.  **Correlated Markets:** If you have a market on "Democrat wins Presidency" and "Democrat wins Senate," the checklist treats them separately. A trader might know the correlation is higher than you priced. You need to review markets *together*, not just individually.
  3.  **Liquidity Risk:** You can be coherent (prices sum to 100¢) but still lose money if everyone bets on one side and you are forced to hold the bag until settlement. The checklist doesn't manage inventory risk.
  4.  **Dynamic Incoherence:** You check prices at 11:00 PM. At 11:05 PM, a trader buys all the "Yes" contracts. Your remaining inventory is now skewed. If you don't update prices immediately, the *next* trader can Dutch-book you. **Rule:** If one side of the market is fully bought/sold, close the market or update prices immediately.

  # Final Advice for the Team
  Print the **Market Coherence Protocol**. Tape it to the monitor. Tell your co-managers: *"We don't need to be smarter than the traders. We just need to be consistent. This checklist keeps us consistent."*

  If they complain about the Tenure market being cancelled, tell them: *"The checklist says the outcomes overlap and can't be verified. If you want to override the checklist, you need to sign this paper accepting personal liability for the loss when the market breaks."* (They won't sign it).
