  **Memorandum**

  **To:** Professor of Philosophy
  **From:** AI Research Assistant
  **Re:** Analysis of *Juliana v. United States* through the Lens of Intergenerational Justice

  **Introduction**

  The litigation in *Juliana v. United States* represents a singular moment in the intersection of legal practice and moral philosophy. As you propose, treating the case as a stress test for intergenerational justice (IGJ) theory is a fruitful methodological approach. The case forces abstract duties into the crucible of justiciability, requiring that theoretical obligations be translated into cognizable legal injuries. Below, I offer an analysis that moves bidirectionally: first applying IGJ frameworks to the litigation's structure, and subsequently using the litigation's friction points to critique and refine the theory itself.

  ### 1. Mapping the Litigation onto Intergenerational Justice Concepts

  The *Juliana* complaint functions as a practical instantiation of the "Just Savings" principle, though it transposes Rawlsian economic capital into ecological capital. In the Rawlsian model, the contracting parties in the original position represent family lines, ensuring that each generation passes on a sufficient base of resources and institutions to the next. The *Juliana* plaintiffs operationalize this by arguing that the federal government, as a trustee, has depleted the essential environmental background conditions (a stable climate system) required for the "pursuit of happiness" and liberty.

  **Parties and Structure of Wronging**
  In standard IGJ theory, the relevant parties are often abstracted as "the present generation" versus "future generations." *Juliana* concretizes this dyad. The plaintiffs are not merely representatives of the future; they are a "bridge generation"—living persons whose life trajectories will span the transition from relative stability to catastrophic disruption. Theoretically, this aligns with the "person-affecting view," which seeks to ground obligations in harms to specific individuals rather than impersonal states of affairs.

  **Alignment and Divergence: Legal vs. Philosophical Framing**
  The alignment between the legal and philosophical frameworks is strongest in the invocation of the **Public Trust Doctrine**. Philosophically, this mirrors the stewardship model of IGJ, where current agents hold natural resources in trust for successors. The complaint's allegation that the government knowingly fostered a fossil-fuel system despite scientific warning maps neatly onto the theoretical notion of a breach of fiduciary duty across time.

  However, significant divergences arise regarding **standing and redressability**.
  *   **Particularization:** IGJ theory often accommodates diffuse harms shared by a cohort. The law, conversely, demands particularized injury. The Ninth Circuit's eventual dismissal hinged on the lack of redressability—the inability of the judiciary to craft a remedy that would effectively solve the global climate crisis without encroaching on legislative prerogatives.
  *   **The Temporal Gap:** Legal standing requires imminent injury. IGJ theory must account for harms that are cumulative and probabilistic. The litigation struggled to reconcile the slow violence of climate change with the legal requirement for concrete, traceable causation. Where philosophy can posit a duty to maintain *systems*, the law demands proof of specific *damages*. This divergence reveals that while IGJ theory can justify the *duty*, it lacks a mechanism to enforce it within a separation-of-powers framework designed for discrete, retrospective adjudication.

  ### 2. Evaluating Parfit's Non-Identity Problem

  Derek Parfit's non-identity problem (NIP) posits that if a policy affects who comes into existence, future individuals cannot claim they were harmed by that policy, as they would not exist under the alternative, safer policy. Your prompt raises the question of whether *Juliana* dissolves or merely relocates this problem.

  **The "Existing Persons" Reading**
  The stronger reading is that *Juliana* largely dissolves the NIP for the named plaintiffs. The NIP is primarily a problem for *unconceived* future persons. The *Juliana* plaintiffs were alive at the time of filing and, crucially, at the time the government's affirmative actions (subsidies, permits) were ratified. Their claim is not that the government's actions caused their existence, but that those actions degraded the *conditions* of their existing lives and future life chances. They argue for a right to a "climate system capable of sustaining human life," not a right to have been born into a different genealogy. Because they are actual, existing rights-bearers, the comparison is not between existence and non-existence, but between a life with a stable climate and a life with a destabilized one.

  **The Counterfactual Complication**
  However, the NIP casts a shadow over the *causal* link. If the plaintiffs argue that specific government policies caused their injury, the defense could theoretically argue that those same economic policies created the social conditions under which the plaintiffs were conceived. Yet, this reading is weaker. The plaintiffs' injury is the *acceleration* of climate disruption during their lifespans, not the fact of their conception. The moral claim rests on the violation of their liberty interests and property rights during their actual lives.

  Therefore, *Juliana* suggests that the NIP is less of a barrier for "bridge generations" than for purely future generations. It indicates that IGJ theory should prioritize the rights of the living young over the abstract rights of the unborn, as the former bypass the metaphysical complications of the NIP while retaining the moral urgency of intergenerational equity.

  ### 3. Weaknesses in Intergenerational Justice Theory Exposed by the Case

  The litigation exposes three specific frailties in current IGJ theorizing:

  **A. The Problem of Specificity vs. Diffuse Harm**
  IGJ theory often struggles to explain why specific individuals have standing to claim harm from a global phenomenon. If climate change is a "tragedy of the commons," the wrong is diffuse. *Juliana* attempts to particularize this wrong, but the theory lacks robust resources to explain why *these* twenty-one plaintiffs suffer a distinct injustice compared to any other young person. The theory tends to treat "the future generation" as a monolithic bloc. The case reveals a need for a more granular theory of *differential vulnerability*, explaining how state action disproportionately loads risk onto specific subsets of the successor generation (e.g., based on geography or socioeconomic status).

  **B. Institutional Agency and Political Responsibility**
  Much of IGJ theory focuses on the moral obligations of "the present generation" as a collective moral agent. *Juliana* targets the *State*. This highlights a gap: IGJ theory is often silent on the mechanics of *political* responsibility. It explains why we should save, but not how the state, as a specific institutional actor, becomes the obligor. The case demonstrates that without a theory of the state as a trans-temporal trustee, IGJ remains a moral aspiration rather than a political claim. The Ninth Circuit's dismissal underscores that ethical duties do not automatically translate into judicially manageable standards. Theory must account for the *institutional capacity* to bear these duties.

  **C. The Discounting Dilemma in Practice**
  The litigation implicitly challenges the economic practice of discounting future harms. The plaintiffs argue that the long-term costs of inaction outweigh short-term economic gains. However, the legal system's reluctance to intervene suggests a practical "institutional discount rate." Courts are unwilling to impose massive present costs for uncertain future benefits. IGJ theory often argues against discounting on moral grounds (e.g., Ramsey's argument), but *Juliana* shows that without a mechanism to override institutional risk-aversion, the moral argument against discounting lacks traction. Theory needs to address not just the *rate* of discounting, but the *governance structures* that enforce non-discounting.

  ### 4. Verdict: Strengthening the Framework

  *Juliana v. United States* ultimately **strengthens** the case for intergenerational justice as a framework for climate ethics, though it necessitates a shift from ideal to non-ideal theory.

  **The Theoretical Lesson**
  The most powerful lesson the case teaches is that **rights-language is indispensable for intergenerational justice.** Abstract utilitarian calculations regarding future welfare proved insufficient to motivate political or legal action. The plaintiffs' success in surviving the initial motion to dismiss (before the Ninth Circuit reversal) was predicated on framing climate stability as a fundamental liberty interest. This suggests that IGJ theory must move beyond consequentialist frameworks (maximizing future welfare) toward deontological frameworks (protecting future rights). The "Just Savings" principle is too passive; it requires a "Just Institutions" corollary that empowers successors to claim entitlements against predecessors.

  **The Repairable Problem**
  The serious problem exposed is the **enforcement gap**. IGJ theory posits duties but lacks a theory of enforcement when the obligor (the current state) refuses to acknowledge the obligee (the future). The Ninth Circuit's assertion that the remedy lies in the political process reveals the limits of ethical theory alone.
  *Is this repairable?* Yes, but it requires integrating political philosophy with ethics. We must theorize the **legitimacy conditions** of the state. If a state violates the basic background conditions required for the liberty of its future citizens, does it lose legitimacy? *Juliana* hints at this. By framing the case around substantive due process and the public trust, the plaintiffs argued that the government's climate policy rendered it a violator of the social contract across time.

  **Conclusion**
  *Juliana* demonstrates that intergenerational justice cannot remain a matter of distant moral obligation. It must be operationalized through institutional design and rights-claims. The case weakens the notion that IGJ is purely a matter of benevolence or charity; it strengthens the argument that it is a matter of constitutional and political necessity. For your paper, I recommend focusing on how the legal failure of *Juliana* (regarding redressability) points to the need for new political institutions—perhaps a "Guardian for Future Generations"—that can bridge the gap between moral duty and legal enforceability. The theory is sound, but it requires a political vehicle that current liberal democracies lack.
