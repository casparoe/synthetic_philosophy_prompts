      *   **Tertiary Conflict:** (4) vs. (6). (6) is standard Austinian. (4) is Gricean. Griceans sometimes struggle with insincerity (if the intention is to deceive, is the force there?). But usually, they distinguish *meaning* from *belief*. So (4) can accommodate (6) if "communicative intention" includes the intention to undertake an obligation, even if the belief is lacking. This is manageable.

