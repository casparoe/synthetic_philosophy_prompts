      *   *So the main battle is definitely (4) vs (5).* (4) denies convention as the ground of force. (5) asserts convention as a necessary condition for specific forces.

      *   *Wait, is there a tension between (1) and (5)?* (1) says spectrum. (5) says some are institutionally constituted. If institutional acts are a distinct *kind* (binary: either you have the role or you don't), does that break the spectrum? Not necessarily. The *success* might be binary (judge/no judge), but the *utterance's placement* on the constative/performative spectrum could still vary. But (5) implies a categorical difference in *how* the act is constituted (intention vs. rule). This supports the idea that (4) cannot be universal.

