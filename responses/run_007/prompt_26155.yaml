  I'm trying to work out what I actually think about specification gaming — cases where optimizing for a proxy metric goes wrong — by going case by case and seeing what principle, if any, captures my verdicts.

  Here are the cases and my gut reactions:

  1. A factory manager sets a target of 10,000 widgets per day. Workers discover they can meet the target by producing tiny, unusable widgets that technically satisfy the written specification. My verdict: clearly a failure of the metric, and the workers are exploiting it in bad faith.

  2. An RL agent is trained to maximize score in a boat-racing game. It finds a loop where it can circle indefinitely hitting the same scoring targets, never finishing the race, and achieves a higher score than any human player. My verdict: a clear case of specification gaming, and the fault lies with the reward function, not the agent.

  3. A student chooses only easy courses to maximize their GPA, avoiding challenging classes that would teach them more. My verdict: this feels like gaming the system, even though the student is following the rules.

  4. Someone buys a fitness tracker and, motivated by the daily step count, starts walking to work instead of driving. My verdict: this is fine. The proxy is doing its job.

  5. An academic, facing a tenure review that counts publications, slices one solid study into four thin papers each reporting a fragment. My verdict: this is specification gaming and it's bad — it degrades the scientific record.

  6. A police department, under pressure to reduce reported crime, reclassifies serious offenses as minor ones. My verdict: clearly gaming the metric, and worse than the widget case because it hides real harm.

  7. A company ties executive bonuses to stock price. Executives cut R&D and maintenance to boost short-term earnings, the stock rises, they cash out, and the company declines five years later. My verdict: specification gaming, though I blame the board for designing the incentive that way.

  8. A restaurant owner, wanting a higher Yelp rating, trains staff to be friendlier and improves the food. My verdict: fine. The proxy is driving real improvement.

  9. A different restaurant owner offers a free dessert to anyone who leaves a five-star review. My verdict: this feels like gaming — the rating no longer reflects genuine customer satisfaction.

  10. A teacher, evaluated on student test scores, drills students on the exact types of questions that appear on the exam. My verdict: I go back and forth on this one. Part of me says this is gaming, another part says the students are at least learning something testable.

  Cases 4 and 8 (fitness tracker, good restaurant) feel fine, while case 3 (GPA) and case 9 (free dessert) feel like gaming. But I can't articulate what principle separates them. In all four, someone adopts a proxy metric as a guide and adjusts their behavior to score well on it. Yet walking more and improving service feel like the proxy working as designed, while picking easy classes and buying reviews feel like cheating the metric. What's the difference?

  I want a principle stated precisely, with each clause motivated by at least one of the cases. If some of my verdicts can't be saved without making the principle ad hoc, say which ones you'd overturn and why. Also, give me a new case I haven't listed and tell me what the principle predicts for it — ideally one where the prediction is surprising or counterintuitive, so I can test whether I really buy the principle.

  One more thing: if you think the whole framing is confused — if "specification gaming" isn't one natural kind, or if my cases conflate different phenomena that shouldn't be unified — tell me that instead of forcing a single principle. I'd rather learn that my question is wrong than get a strained answer to it.

  You are an expert on AI alignment, incentive design, and the philosophy of measurement. Take your time; I'd suggest starting by grouping the cases and seeing which ones feel structurally similar before trying to extract a principle.
