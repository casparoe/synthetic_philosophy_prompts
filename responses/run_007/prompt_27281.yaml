      While the answer is accurate, it accepts Goodman's solution somewhat uncritically. To achieve a First-Class mark (70%+), the student should have interrogated whether 'entrenchment' truly constitutes a *rational* basis or merely describes a psychological habit. A deeper analysis would question if appealing to past usage is circular (i.e., justifying induction by induction) or if it successfully dissolves Hume's scepticism. The assertion that entrenchment "supplies a pragmatic... justification" is stated rather than argued.

