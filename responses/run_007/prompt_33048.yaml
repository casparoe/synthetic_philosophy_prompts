  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON THE EPISTEMOLOGY OF DISAGREEMENT

  **Signatories:** The Conciliationist Signatory and The Steadfast Signatory
  **Date:** 24 May 2024

  ## 1. AGREED FOUNDATIONS

  Both signatories affirm the following claims as the common ground for this collaboration. These claims are intended to rule out sceptical and dogmatic extremes while establishing a shared vocabulary for the residual dispute.

  1.  **Definition of Epistemic Peerhood:** For the purposes of this discussion, an epistemic peer is defined as an individual who is roughly equal to oneself in terms of familiarity with the relevant evidence and competence in evaluating that evidence. Both signatories agree that perfect equality is not required, but significant asymmetries in evidence access or cognitive ability remove a case from the central 'peer disagreement' category.
  2.  **The Higher-Order Evidence Claim:** Both signatories agree that the fact of disagreement constitutes higher-order evidence. Specifically, learning that a peer disagrees provides evidence that one may have made an error in evaluating the first-order evidence. It is irrational to treat the fact of disagreement as evidentially inert.
  3.  **The Anti-Dogmatism Constraint:** Both signatories agree that it is irrational to completely ignore the fact of peer disagreement. A view that permits an agent to maintain exactly the same level of confidence regardless of the number of dissenting peers (provided those peers are recognised as such) is rejected by both parties as dogmatic.
  4.  **The Anti-Scepticism Constraint:** Both signatories agree that the existence of peer disagreement does not entail universal suspension of judgement. There are conditions under which maintaining a belief or credence in the face of disagreement is compatible with rationality, even if those conditions are disputed.
  5.  **Scope of Application:** The primary focus of this statement concerns contingent empirical propositions where evidence is complex and fallible. While the principles may extend to other domains, both signatories agree that a priori truths (such as simple logic or mathematics) present distinct complications and are not the central test cases for this collaboration.
  6.  **Doxastic Currency:** Both signatories agree that while full belief is the practical output of reasoning, credences (degrees of belief) provide the precise metric for analysing rational requirements. Disagreement is understood primarily as a divergence in credences.

  ## 2. PRECISE RESIDUAL DISAGREEMENT

  The disagreement between the signatories is not regarding whether disagreement matters, but regarding the *default weight* of the peer's opinion relative to one's own first-order reasoning, and the conditions under which one may rely on that reasoning to discount the peer.

  ### 2.1 The Core Dispute: The Independence Principle and Weight
  **The Conciliationist Signatory holds:**
  Rationality requires adherence to a strong **Independence Principle**. When evaluating the credibility of a peer's conflicting claim, one must do so without relying on the reasoning behind one's own initial claim. Because the peer's disagreement suggests a flaw in one's evaluation of the first-order evidence, one cannot use that potentially flawed evaluation to dismiss the peer. Consequently, the fact of peer disagreement normally mandates a significant revision of confidence towards the peer's view (often approximating a 'split the difference' rule), unless there is independent reason to doubt the peer's status or sincerity.

  **The Steadfast Signatory holds:**
  Rationality permits adherence to a **Total Evidence View**. One is permitted to rely on one's own assessment of the first-order evidence when evaluating the peer's disagreement. If, upon checking, one's reasoning appears robust and error-free, one may rationally conclude that the peer is the one who has erred, even absent independent proof of their error. Consequently, the fact of peer disagreement is merely one additional piece of evidence to be weighed against the first-order evidence; it does not automatically mandate a significant revision of confidence if the first-order evidence remains compelling.

  ### 2.2 The Uniqueness Thesis
  **The Conciliationist Signatory holds:**
  This view is committed to the **Uniqueness Thesis**: for any given body of evidence, there is exactly one rational doxastic attitude. Since peers share the same evidence, they ought to converge. Persistent disagreement implies at least one party is irrational.

  **The Steadfast Signatory holds:**
  This view is committed to **Permissivism**: for some bodies of evidence, there is a range of rational doxastic attitudes. Peers may rationally respond differently to the same evidence due to differing but permissible epistemic standards or weights assigned to specific evidence items.

  ### 2.3 Self-Undermining and Reflexivity
  **The Conciliationist Signatory holds:**
  Conciliationism applies to itself. If recognised peers disagree about the truth of conciliationism, the Conciliationist must reduce their confidence in conciliationism. This vulnerability is accepted as a feature of the view's consistency, not a bug.

  **The Steadfast Signatory holds:**
  The requirement to reduce confidence in conciliationism when peers disagree constitutes a **self-undermining reductio**. If a theory requires you to abandon it whenever it is disputed by peers, it cannot be rationally held in a pluralistic environment. The Steadfast view avoids this by permitting the retention of the steadfast norm even when disputed.

  ### 2.4 Superiors, Inferiors, and Scope
  **The Conciliationist Signatory holds:**
  Regarding epistemic superiors or inferiors, weight should be assigned proportionally to estimated reliability. If a superior disagrees, one must defer significantly. If an inferior disagrees, one may discount them, but only based on independent evidence of their inferiority, not merely on the fact that they disagree. This applies to both credences and full belief.

  **The Steadfast Signatory holds:**
  Regarding superiors or inferiors, the Total Evidence View still applies. One weighs the superior's opinion against one's own first-order assessment. While a superior's opinion carries more weight, it does not automatically override one's own reasoning if the first-order evidence strongly supports one's own view. This applies primarily to credences, with full belief adjusting once credences cross a certain threshold.

  ### 2.5 Verbal Disputes
  Both signatories acknowledge a potential verbal dispute regarding the term 'rational'. The Conciliationist tends to use 'rational' to mean 'most likely to converge with truth given social evidence', while the Steadfast Signatory tends to use 'rational' to mean 'faithful to one's own best assessment of the evidence'. However, both agree the dispute is substantive regarding the *normative requirements* of belief revision, not merely semantic.

  ## 3. CRUX TABLE

  The following table identifies concrete cases and arguments that bear on the residual disagreement. Both signatories agree these cases are diagnostic. The 'Prediction' columns detail what each signatory claims rationality requires in the specific scenario.

  | Crux | Case Description | Conciliationist Prediction | Steadfast Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Independence Case** | **Complex Calculation:** You and a peer separately solve a complex mathematical problem. You check your work three times and find no error. The peer says the answer is different. You have no independent reason to doubt their competence or sincerity. | You must significantly reduce confidence in your answer (e.g., to 0.5). You cannot rely on your own check to dismiss them, as that check is part of the disputed reasoning. | You may maintain high confidence (e.g., >0.8). Your three checks are part of the total evidence. The peer's disagreement is evidence of error, but your own verification outweighs it. |
  | **2. The Reflexive Case** | **Disagreement about Disagreement:** You are a Conciliationist. Your peer is a Steadfaster. You disagree about whether you should conciliate in Case 1. You recognise each other as peers regarding epistemological competence. | You must reduce confidence in Conciliationism. Since a peer rejects the norm you are using to evaluate them, you cannot consistently maintain full confidence in that norm. | You may maintain confidence in Steadfastness. The peer's disagreement is based on their (incorrect) epistemic norm. You are permitted to trust your own norm to evaluate their error. |
  | **3. The Reliability Case** | **Self-Assessment:** The proposition in dispute is: "I am currently reliable about this type of claim." You believe you are reliable. Your peer says you are not. | You must reduce confidence in your own reliability. The peer's assessment is evidence against your reliability, which you cannot dismiss without begging the question. | You may maintain confidence in your reliability. Your immediate access to your own cognitive state provides first-order evidence that outweighs the peer's external assessment. |
  | **4. The Conciliatory Evidence Case** | **Known Dispositions:** You know your peer is a committed Conciliationist. You are a Steadfaster. You disagree on a political claim. You know that if you conciliated, they would also conciliate (moving towards you). | The fact that they are conciliatory does not change the norm. You must still move towards them. Their disposition to move towards you is irrelevant to the current evidential weight of their opinion. | Their conciliatory disposition is relevant evidence. It suggests their current view is unstable and heavily influenced by social factors rather than first-order evidence, allowing you to discount their opinion slightly more. |
  | **5. The Cluster Case** | **Systematic Disagreement:** You and a peer disagree on 20 related empirical claims within a specific domain. On 18 of them, you have high confidence based on detailed study. On 2, you are unsure. | The pattern of disagreement suggests a systematic error in your framework. You must reduce confidence across the cluster, including the 18 claims, as the disagreement indicates a flaw in your background theory. | The pattern suggests a divergence in interpretation. On the 18 claims where your first-order evidence is strong, you may remain steadfast. The disagreement on the 2 unsure claims does not defeat the evidence for the 18. |
