      *   *Situationists (Sit):* Rely on social psychology (Milgram, Stanford Prison, Good Samaritan). Claim behavior is driven by situational factors, not internal traits. Global traits don't exist or are rare.
      *   *The Clash:* It's often about *what counts* as a trait. VE wants traits that support moral responsibility and flourishing. Sit wants traits that predict behavior across diverse contexts.
      *   *Key Concepts:* Consistency, Stability, Predictivity, Evaluative Integration, Empirical Adequacy, Folk Psychology alignment.

  3.  **Drafting the Requirements (Desiderata):**
      *   *Req 1: Empirical Adequacy.* Must fit the data (Milgram, etc.).
      *   *Req 2: Cross-Situational Consistency.* Traits should manifest in different situations (honesty at home and work).
      *   *Req 3: Stability over Time.* Traits shouldn't fluctuate wildly day-to-day.
      *   *Req 4: Explanatory Power.* Traits must explain *why* someone acted, not just describe the act.
      *   *Req 5: Folk Psychological Plausibility.* Must match how ordinary people think about character (otherwise, why call it "virtue"?).
      *   *Req 6: Normative Significance.* Traits must be suitable objects of praise/blame and cultivation (essential for VE).
      *   *Req 7: Evaluative Integration.* Virtues are connected (Unity of Virtues idea, or at least coherence).

  4.  **Classifying Requirements (NN vs. Parochial):**
      *   *Empirical Adequacy:* NN. If a theory contradicts robust data, it's false. (Though Sit and VE dispute the *interpretation* of data).
      *   *Cross-Situational Consistency:* P (mostly). Sit demands *high* consistency. VE needs *some*, but maybe not perfect. Sit says "Global traits require high consistency." VE might say "Traits are probabilistic."
      *   *Stability:* NN. A "trait" that changes hourly isn't a trait.
      *   *Explanatory Power:* NN. A theory of traits must explain behavior.
      *   *Folk Plausibility:* P. Eliminativists don't care if folk psychology is wrong.
      *   *Normative Significance:* P (VE specific). Situationists/Eliminativists don't care about moral cultivation, just descriptive accuracy.
      *   *Evaluative Integration:* P. Many reject the Unity of Virtues.

  5.  **Analyzing Tensions/Incompatibilities:**
      *   *The Big Tension:* High Cross-Situational Consistency (Sit demand for Globalism) vs. Empirical Adequacy (Sit data showing inconsistency).
      *   *The VE Dilemma:* To save Normative Significance (responsibility), you need robust traits. To save Empirical Adequacy, you need weak/local traits. Weak traits might not support robust responsibility.
      *   *The "Concession" Point:* If "Non-negotiable" includes strict Empirical Adequacy (as interpreted by Situationists) and strict Explanatory Power (as interpreted by VEs), Global Realism fails. If we lower the bar for traits to "Local," do we still have "Virtue Ethics"?

  6.  **Identifying the "Bottleneck" Requirement:**
      *   *Cross-Situational Consistency (Globalism).* This is the crux. If you demand high consistency, empirical data kills it. If you allow low consistency, the concept of "character" becomes thin, potentially undermining the normative project of VE.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the meta-philosophical nature of the prompt (desiderata vs. evidence).
      *   **The List of Requirements:** Group them logically (Descriptive, Explanatory, Normative). Use the NN/P classification.
      *   **Critical Analysis of Tensions:** Discuss the "Empirical vs. Normative" clash and the "Global vs. Local" definition fight.
      *   **The Concession Point:** Address whether meeting NN requirements forces a concession.
      *   **The Bottleneck:** Identify Cross-Situational Consistency.
      *   **Scoring (Optional but requested):** Briefly score Global, Local, Eliminativist against the list.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Be careful not to treat Situationist data as undisputed fact. VE's often challenge the *ecological validity* of the experiments. I need to frame Empirical Adequacy as "consistency with the best available psychological evidence *as interpreted by the debate*." Actually, better to frame it as "Consistency with Robust Behavioral Data."
      *   *Nuance:* Distinguish between "Global Traits" (Aristotelian) and "Local Traits" (Doris-style).
