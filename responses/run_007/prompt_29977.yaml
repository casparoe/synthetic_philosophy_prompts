      *   *Key Insight:* The Situationist claim is "Global traits don't exist." If the NN requirements force us to define traits as "Local/Fragmented," then we have conceded the central claim (Global traits don't exist), even if we save the word "trait."

  10. **Drafting the Response** (incorporating the above steps). *Self-Correction on Scoring:* Keep it brief as requested ("keep the weight on the criteria").

      *(Self-Correction during drafting the "Incompatibility" section)*: I need to be clear about the "Evaluative Consistency" vs. "Behavioral Consistency." Situationists argue behavior isn't consistent. VEs argue behavior *should* be consistent for virtue to exist. The tension is between *Is* and *Ought* in the definition of trait.

      *(Refining the Bottleneck)*: It's definitely the **Cross-Situational Consistency** requirement. It's the fulcrum.

      *(Refining the Concession)*: If we define traits as purely local to satisfy Empirical Adequacy (NN), we concede the Situationist claim that *Global* traits (the VE standard) are empirically unsupported.

