prompt: |-
  I'm a software engineer who works on digital provenance — cryptographic signatures, content-addressed storage, on-chain ownership registries. I keep encountering the philosophical puzzle about forgeries: why does it matter that a painting is a forgery if you can't tell it from the original even after expert examination? And why does the value of a work we have always admired collapse when we learn it was forged, even though nothing about the object itself has changed? Please restate this debate as faithfully as you can in the vocabulary I actually use: hashes and content identity, cryptographic signatures and provenance chains, the distinction between verifying that a file was signed by a given private key and verifying that it was signed by a given person, token identity versus type identity, and the difference between "this is the same file" and "this came from the same source." Then give me the residue report: which claims translate cleanly, which ones you had to fudge to fit, and which ones have no expression at all in my vocabulary. I want to know whether the philosophical problem reduces to a provenance-chain problem — or whether my framework is missing something the philosophers are right to insist on.
