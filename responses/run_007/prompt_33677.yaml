  7.  **Final Polish:** Ensure terminology is precise (at-issue content, not-at-issue, projection, extension, intension). Make sure to distinguish between the *general pragmatic view* and specific implementations (CI vs. Presupposition), as the user is undecided on the flavor. (Self-Correction: Make sure to highlight that "Truth-Conditional Equivalence" is the weakest link, more so than the pragmatic mechanism choice.)

