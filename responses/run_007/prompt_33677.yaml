          *   *Case:* "Faggot" vs. "Gay man." Does the slur apply to straight men acting effeminate? Sometimes. Does "gay man" apply to them? No.
          *   *Verdict:* High impact. If extensions differ, truth-conditional equivalence fails.

      *   *Objection 2: Cancellation/Non-Derogatory Use.*
