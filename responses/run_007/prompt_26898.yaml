answer: |-
  # JOINT STATEMENT ON PRECEDENT AUTONOMY AND CURRENT INTERESTS IN ADVANCED DEMENTIA CARE

  **Issued by:** The Adversarial Collaboration on Personal Identity and Medical Ethics
  **Subject:** The Moral Status of Advance Directives in Cases of Severe Psychological Discontinuity
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned representatives of the Precedent Autonomy (PA) and Current Interests (CI) perspectives, acknowledge that the case of the woman with advanced Alzheimer's and pneumonia represents a genuine moral dilemma, not merely a confusion of facts. We agree that standard bioethical frameworks often obscure the depth of the metaphysical and normative disagreement at play. This document does not seek to resolve the dispute, but to map the terrain of our agreement and isolate the precise loci of our disagreement, such that policymakers, clinicians, and families may understand the cost of choosing either path.

  ## PART I: SUBSTANTIVE AGREED CLAIMS
  *Both camps endorse the following claims. These are not truisms; they represent concessions each side makes to the strength of the other's position.*

  1.  **Validity of the Original Act:** Both sides agree that the directive written in the woman's fifties was a serious, informed, and autonomous moral act. It was not a whim, a depressive episode, or a misunderstanding of medical facts. To ignore it is to disregard a significant exercise of human agency.
  2.  **Moral Status of the Current Patient:** Both sides agree that the woman in the bed is not merely a biological shell. She is a subject of experience with moral standing. She is capable of suffering, enjoyment, and attachment (e.g., to music, pudding, caregivers). To treat her purely as a vessel for the past self's wishes is to risk instrumentalizing a vulnerable human being.
  3.  **Inevitability of Moral Residue:** Both sides agree that whichever course is chosen, a moral wrong is incurred. If antibiotics are withheld, a contented being is allowed to die. If antibiotics are administered, a prior autonomous will is violated. There is no "clean" solution that avoids moral cost.
  4.  **The Burden on Surrogates:** Both sides agree that leaving this decision to family members without clear ethical guidance imposes an unjust psychological burden. Families are forced to choose between "killing" their mother (PA path) or "violating" her life's narrative (CI path).
  5.  **Rejection of Absolutism:** Both sides reject the extreme versions of their own theories. PA concedes that a directive cannot mandate *active* euthanasia or cruel treatment of the current patient. CI concedes that not all advance directives are voided by memory loss (e.g., financial directives or organ donation), so psychological discontinuity does not erase *all* prior authority.

  ## PART II: TABLE OF GENUINE DISAGREEMENTS
  *For each contested issue, we provide the exact formulation each camp accepts. Neither side accepts the other's formulation as a charitable paraphrase; these are the claims they actually hold.*

  | Issue | Precedent Autonomy (PA) Formulation | Current Interests (CI) Formulation |
  | :--- | :--- | :--- |
  | **1. Source of Authority** | "Decision-making authority resides in the **narrative self** that constructed the life plan. The competent self acts as a trustee for the incompetent self, retaining the right to determine the boundaries of the life story." | "Decision-making authority resides in the **subject of experience**. Only the being who can feel the consequences of a medical intervention has the primary claim to decide its fate." |
  | **2. Nature of Identity** | "Numerical identity (being the same human organism) is sufficient for moral binding. The woman in the bed is the same person who wrote the directive, even if her psychology has changed." | "Psychological continuity (memory, character, values) is necessary for moral binding. The woman in the bed is a **new moral person** inhabiting the old body; the author of the directive is effectively dead." |
  | **3. Definition of Harm** | "Harm includes the violation of **critical interests** (values that make a life good overall, such as dignity). One can be harmed by events one does not experience, just as one can be harmed by defamation after death." | "Harm is limited to **experiential interests** (pain, suffering, frustration of current desires). One cannot be harmed by events one cannot comprehend or remember. Death is only a harm if the subject fears it or loses a future they value." |
  | **4. The Role of Contentment** | "Current contentment is irrelevant if it contradicts the prior rational plan. A 'happy slave' is still unfree; a 'happy patient' violating their directive is still having their autonomy breached." | "Current contentment is decisive. If the patient expresses a will to live (e.g., eating, smiling), overriding that to enforce a past abstract value is a form of paternalistic violence against the present being." |

  ## PART III: THE CRUXES
  *These are the foundational philosophical分歧 (divergences) that drive the disagreements above. For each crux, we identify a concrete test case that both sides agree is relevant, and record their divergent predictions.*

  ### Crux 1: The Metaphysics of Moral Authority (Organism vs. Agent)
  *Does moral authority track the human animal or the psychological agent?*

  *   **Concrete Consideration:** **The "Teletransporter" Intuition Pump.**
      Imagine a technology that copies the woman's mind (memories, values, personality) from her 50s into a new clone body, while the original body develops dementia.
      *   **PA Prediction:** The directive travels with the **original body**. The clone is a stranger. The biological continuity matters most for medical decisions regarding the biological organism.
      *   **CI Prediction:** The directive travels with the **psychological copy**. The clone is the "real" person who wrote the directive and should be bound by it. The demented body is a separate entity with no connection to the author.
  *   **Why this matters:** If PA is right, biology binds us. If CI is right, psychology binds us. In dementia, biology remains while psychology fades.

  ### Crux 2: Diachronic vs. Synchronic Autonomy
  *Can a self bind a future self that no longer endorses the commitment?*

  *   **Concrete Consideration:** **The "Ulysses Contract" in Psychiatry.**
      A bipolar patient, while sane, signs a directive refusing medication during future manic episodes, knowing they will enjoy the mania but ruin their life. During mania, they refuse meds and feel euphoric.
      *   **PA Prediction:** The sane self's directive **must be enforced**. Autonomy is the capacity to shape one's future, even against one's future rebellious impulses. To ignore it is to treat the person as a series of unconnected moments.
      *   **CI Prediction:** The directive **should be ignored** during the episode. The current self is the one suffering the "treatment" (or the restriction of liberty). Binding them treats them as a means to the past self's ends, not an end in themselves.
  *   **Why this matters:** This tests whether autonomy is a *project over time* (PA) or a *state of being* (CI).

  ### Crux 3: Critical Interests vs. Experiential Welfare
  *Can you be harmed by something you don't know about?*

  *   **Concrete Consideration:** **Posthumous Wishes.**
      A woman writes a directive that her ashes be scattered at sea. After she dies, her family buries them in a garden. She never knows.
      *   **PA Prediction:** She **was harmed**. Her critical interest in how her life narrative concluded was violated. Death does not end moral claims.
      *   **CI Prediction:** She **was not harmed** (in a welfare sense). She has no experiences. The harm is only to the *living* who care about promise-keeping.
  *   **Why this matters:** If PA is right about the dead, they are likely right about the demented (who are metaphysically similar to the dead in terms of psychological discontinuity). If CI is right about the dead, the directive loses its force once the "narrative self" ceases to function.

  ## PART IV: NOTE ON VERBAL DISPUTES
  *We acknowledge that a portion of our disagreement is terminological, though this does not dissolve the ethical conflict.*

  1.  **The Word "Person":**
      *   **PA** uses "Person" to denote a **human being with a biographical history**. On this definition, the woman in the bed is obviously the same person.
      *   **CI** uses "Person" to denote a **psychological agent with rational capacities**. On this definition, the woman in the bed may be a *different* person (or a "new" person) than the author.
      *   *Resolution:* We agree to stipulate that this is not merely semantic. The choice of definition dictates the moral status. We are not arguing over dictionary definitions, but over which metric (biology or psychology) grants moral rights.

  2.  **The Word "Harm":**
      *   **PA** defines harm as **setback to interests** (including non-experiential ones).
      *   **CI** defines harm as **negative phenomenological experience** (pain, distress).
      *   *Resolution:* We agree that if we adopt PA's definition, PA wins the case. If we adopt CI's definition, CI wins the case. Therefore, the core dispute is not about the facts of the pneumonia, but about which definition of "Harm" ought to govern medical ethics.

  ## SIGNATORIES

  _________________________
  *Representative, Precedent Autonomy Working Group*

  _________________________
  *Representative, Current Interests Working Group*
