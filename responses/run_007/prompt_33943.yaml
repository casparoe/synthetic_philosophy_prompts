answer: |-
  Your hypothesis is sharp, and largely correct. The debate has indeed stalled, and the diagnosis that it is now a modal-metaphysical dispute wearing philosophy-of-physics clothes is accurate. However, to understand *why* it stalls and what progress would look like, we need to refine your hypothesis slightly. It is not just a dispute about modal metaphysics (what counts as a distinct world); it is a **meta-ontological dispute about the relationship between mathematical formalism and physical commitment.**

  Here is the diagnosis of the friction, the nature of the disagreement, and the conditions for progress.

  ### 1. The Diagnosis: Why the Debate Stalled
  You are right that the physics is not in dispute. General Relativity (GR) is the background, and the Hole Argument is the pivot. The stalemate exists because the Hole Argument successfully transformed an empirical debate into a semantic one.

  Before Earman and Norton (1987), substantivalism was a claim about the causal efficacy of space (e.g., explaining inertial forces). After the Hole Argument, substantivalism became a claim about the **ontological status of manifold points** in the face of diffeomorphism invariance.

  The friction persists because the two sides have agreed on the physics but disagree on the **rules of ontological inference.**
  *   **The Substantivalist (typically "Sophisticated" now):** Argues that the mathematical formalism (the manifold) tracks ontology, but that diffeomorphic models represent the *same* physical state (Leibniz Equivalence). They accept the modal consequence to save the ontology.
  *   **The Relationist (or Structural Realist):** Argues that if diffeomorphic models represent the same state, the manifold points are ontological surplus. We should only be committed to the invariant structure.

  **The Stalemate:** Both sides can accommodate the Hole Argument. The substantivalist does so by biting the bullet on haecceitism (denying primitive thisness to points) or accepting Leibniz Equivalence. The relationist does so by denying the points exist at all. Since both positions are compatible with the exact same mathematical formalism and empirical predictions, no physical evidence can arbitrate between them.

  ### 2. The Nature of the Disagreement: Meta-Ontology, not Modal Metaphysics
  Your hypothesis identifies the modal element (what counts as a distinct possibility), but the deeper friction is **meta-ontological**. It is a disagreement about *when mathematical distinction implies ontological distinction.*

  *   **The Substantivalist Commitment:** Tend toward a "literalist" hermeneutic of the formalism. If the math has a variable for a point, there is a thing. If the theory is deterministic in its equations, the world should be deterministic in its ontology. They view the manifold as the necessary substrate for fields to inhere in.
  *   **The Relationist/Structuralist Commitment:** Tend toward a "parsimonious" hermeneutic. If a distinction in the math makes no difference to observables (gauge freedom), it is not a distinction in the world. They view the manifold as a coordinate artifact.

  This is why the moves haven't changed in decades. The argument is no longer about space; it is about **Ockham's Razor vs. Explanatory Depth.**
  *   The Relationist charges the Substantivalist with ontological bloating (positing invisible points).
  *   The Substantivalist charges the Relationist with failing to explain *what* is related (the "relata" objection) or lacking a truthmaker for spacetime claims.

  This is a methodological standoff. One side prioritizes minimizing entities; the other prioritizes a literal reading of the theory's causal structure.

  ### 3. Is the Question Ill-Posed?
  Partially. The binary "Substantivalism vs. Relationism" is a relic of the Newton-Leibniz era that no longer fits the topology of the logical space in post-Hole Argument philosophy.

  *   **Sophisticated Substantivalism** (accepting Leibniz Equivalence) is empirically and modally indistinguishable from **Spacetime Structuralism**.
  *   If two positions agree on all counterfactuals, all observables, and all symmetry interpretations, but disagree only on whether the word "exist" applies to the manifold points, the dispute risks becoming **merely verbal** (in the sense of Chalmers).

  If the dispute is merely verbal, it is ill-posed as a factual inquiry. It becomes a dispute about **conceptual engineering**: Which vocabulary is more useful for future physics?
  *   Is it more useful to talk as if points exist (facilitating quantization, field theory)?
  *   Or is it more useful to talk only of invariants (facilitating background independence)?

  ### 4. What Would Count as Progress?
  Since empirical physics (GR) cannot settle a meta-ontological dispute, progress must come from one of three directions:

  **A. Dissolution via Structuralism**
  Progress would look like abandoning the binary. Most working philosophers of physics have effectively moved to **Ontic Structural Realism**. This view holds that structure is fundamental, and "objects" (points) are derivative or eliminable. If the community consensus shifts to viewing the "substantivalism" label as obsolete for anyone who accepts Leibniz Equivalence, the debate dissolves into a terminological cleanup.

  **B. New Physics (Quantum Gravity)**
  This is the only route to a non-verbal resolution. The debate assumes spacetime is fundamental (as in GR). If a theory of Quantum Gravity (e.g., Loop Quantum Gravity, String Theory, Causal Set Theory) demonstrates that spacetime is **emergent** from non-spatiotemporal degrees of freedom, the debate is rendered moot.
  *   If spacetime emerges from entanglement or spin networks, asking if the "manifold points" are individuals is a category error.
  *   Progress here depends on whether QG recovers a manifold-like structure in the classical limit and how it treats diffeomorphism invariance at the fundamental level.

  **C. Clarifying the Role of Symmetry**
  Progress could come from a rigorous philosophical consensus on how to interpret symmetries. If we can definitively establish that **gauge symmetry always implies redundancy in description rather than contingency in the world**, the substantivalist position loses its motivation. However, this is itself a philosophical claim, not a physical one.

  ### Summary
  Your hypothesis is correct: the debate is a modal-metaphysical dispute about haecceitism and individuation, disguised as physics.
  *   **The Friction:** It is a meta-ontological clash between literalism (Substantivalism) and parsimony (Relationism/Structuralism) regarding the interpretation of mathematical formalism.
  *   **The Stalemate:** It persists because both sides can accommodate the physics (GR + Hole Argument) by adjusting their metaphysical commitments, leaving no empirical leverage.
  *   **Progress:** Will not come from better arguments within GR. It will come from either (1) acknowledging the dispute is verbal/terminological and adopting Structuralism, or (2) new physics (Quantum Gravity) that changes the ontological category of spacetime entirely.

  If you are looking for a research avenue, do not try to win the argument within GR. Investigate how **emergent spacetime** scenarios in Quantum Gravity reconfigure the ontology, or argue for **conceptual pluralism** where the "substantivalist" vocabulary is retained instrumentally without ontological weight.
