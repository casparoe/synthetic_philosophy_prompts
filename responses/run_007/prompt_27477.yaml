          *   E: The common cause defense (neural state causes both experience and judgment).
          *   E: The non-causal justification defense (acquaintance/presentation doesn't need causation).
          *   C: Counter-arguments to these specific defenses (evolutionary pressure, the nature of reference).

  2.  **Character Conception:**
      *   *Epiphenomenalist (Elias):* Calm, analytical, willing to accept counter-intuitive consequences if the logic holds. Focuses on metaphysical parsimony and the causal closure of the physical.
      *   *Critic (Clara):* Sharp, pragmatic, focused on epistemology and evolutionary biology. Worried about skepticism and the coherence of the theory.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the core conflict immediately. Clara raises the "self-undermining" charge. Elias accepts the premise but denies the conclusion.
      *   **Round 1: The Reliability Objection.**
