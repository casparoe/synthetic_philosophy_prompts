answer: |-
  (1) **The Problem**
  The difficulty is the epistemic circularity inherent in moral debunking: identifying a belief as a "bias" requires a normative standard of correctness, yet that standard is precisely what the debunking argument calls into question. This creates a stalemate where every criterion for distinguishing moral insight from cultural conditioning can itself be dismissed as a product of that same conditioning, leaving no neutral ground to adjudicate the dispute.

  (2) **Established Terms**
  Three concepts in the literature map onto this terrain, though none capture the reflexivity perfectly on their own. First, the **Genetic Fallacy** warns against rejecting a claim solely based on its origin, but your problem is deeper: you suspect the origin *might* be relevant to justification, not just that people misuse it. Second, **Evolutionary Debunking Arguments** (e.g., Sharon Street's "Darwinian Dilemma") specifically target the reliability of moral faculties shaped by natural selection, arguing that if evolution didn't track moral truth, our beliefs are unjustified; this is a specific instance of your broader genealogical worry. Third, and most structurally accurate, is **The Archimedean Problem** (discussed by Christine Korsgaard and Barry Stroud), which asks where one can stand outside of one's own normative practices to evaluate them without already presupposing the very norms under scrutiny.

  (3) **Can the Distinction Be Drawn?**
  **Moral Realism** argues the distinction can be drawn because moral truths exist independently of our psychology. Proponents claim that while biases (like class interest or disgust) are causal explanations for beliefs, they do not constitute reasons; through rational reflection, we can filter out the noise of causation to access mind-independent truths. The core argument is that the *content* of a moral judgment can be valid even if its *cause* is suspect, provided we have access to rational intuitions that transcend local conditioning.

  **Error Theory / Skepticism** argues the distinction cannot be drawn because there is no moral truth to distinguish bias from. Thinkers like J.L. Mackie or Nietzschean genealogists suggest that all moral claims are ultimately expressions of preference, power, or evolutionary utility disguised as objective facts. The core argument is that since we cannot step outside our own cognitive and cultural skins to verify a "moral reality," the claim of "moral insight" is itself just another bias wearing a mask.

  **Coherentism / Reflective Equilibrium** argues the distinction can be drawn, but only internally, without an external "view from nowhere." Associated with John Rawls and Norman Daniels, this view holds that we test specific judgments against general principles and background theories, revising both until they fit together coherently. The core argument is that justification is not about finding a bias-free foundation, but about achieving the most stable, defensible system of beliefs possible, where a "bias" is simply a belief that fails to cohere with our other considered judgments.

  (4) **Hard Cases**
  **Visceral Disgust:** When you feel revulsion at factory farming or certain sexual practices, is this a moral signal (perceiving harm or violation) or a biological contamination avoidance mechanism? This is hard because the phenomenology feels identical; the "gut feeling" presents itself as moral truth, yet we know disgust is easily manipulated by culture (e.g., historical taboos against interracial marriage) and biology (e.g., pathogen avoidance), making it impossible to tell if the feeling is tracking value or just physiology.

  **Special Obligations (Partiality):** Is the stronger duty you feel toward your child over a stranger a moral insight about the nature of relationships, or merely an evolutionary strategy for kin selection? This is hard because both moral theory (care ethics, contractualism) and evolutionary biology predict the same behavior; if the "bias" (kin preference) aligns perfectly with the "moral truth" (special obligations), no empirical observation can separate the two, leaving the debate purely theoretical.

  (5) **Your View**
  From an analytical perspective, the **Coherentist** position offers the most robust way out of the knot without begging the question. It accepts your premise that there is no neutral, bias-free vantage point (no "Archimedean point"), but refuses to conclude that all judgments are therefore equally arbitrary. By treating moral justification as a process of mutual adjustment—where you test a specific intuition against your broader commitments and empirical knowledge—you can identify biases as those beliefs that create friction or contradiction within your wider web of belief. This doesn't prove your morality is "true" in a cosmic sense, but it allows you to distinguish between *reflective* judgments and *unexamined* impulses functionally, which is sufficient to resolve the stalemate you described.
