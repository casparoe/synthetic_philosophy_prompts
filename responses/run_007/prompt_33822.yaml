  2. Criteria
  I define reduction as ontological derivability: can the higher-level phenomenon be fully explained by lower-level laws without invoking new fundamental forces? I weight in-principle derivability over computational tractability. If a phenomenon requires new conceptual frameworks (like order parameters) that aren't trivially aggregative, it counts as emergent, even if physically grounded. Computational hardness alone doesn't constitute emergence; ontological novelty does. This distinguishes "we can't calculate it" from "the calculation requires new categories." Thus, turbulence is clearly reducible, but superconductivity is emergent.

  3. Placement notes
  Chemical Bonding: Quantum mechanics derives bonding energies exactly; computational limits don't imply ontological gaps. It is the paradigmatic success story of twentieth-century reductionism. No new fundamental laws are needed, only approximation methods. Solving Schrödinger's equation really suffices.
  Turbulent Flow: Governed by Navier-Stokes equations; chaotic but classical. Complexity is purely mathematical, not metaphysical or organizational. It is computationally intractable but ontologically flat. Derivation is theoretically possible but practically truly impractical. No new physical laws really emerge.
  Thermodynamic Arrow: Depends on statistical coarse-graining and initial conditions; emergent via epistemic limitation, not fundamentally new physics. It requires ignoring micro-details to see macro-patterns. Time's arrow is arguably perspectival. It is really weak emergence.
  Superconductivity: Requires macroscopic wave functions and symmetry breaking; the paradigmatic case of Anderson's "More is Different." New order parameters are indispensable for explanation. Micro-physics alone is insufficiently descriptive here. Symmetry breaking is key.
  Life: Metabolism implies functional organization autonomous from specific substrate; physical but organizationally novel and functionally irreducible. It demands systemic descriptions beyond particle physics. Teleological language becomes very indispensable here too. Function overrides substrate.
  Consciousness: Qualia resist functional reduction; neural correlates don't explain subjective experience. The only ontological outlier. It poses the hard problem for physicalist reduction. Explanatory gap remains despite complete scientific progress. It really quite defies physicalism.

  4. Cut or keep
  Drop Turbulent Flow. It illustrates computational complexity better than philosophical emergence. Keep Phenomenal Consciousness. It is the strongest challenge to physicalism. Consciousness is really the stress test for reductionism. Turbulence is hard math; consciousness is a hard problem. Swap Turbulence for Protein Folding for biological complexity without metaphysical baggage.
