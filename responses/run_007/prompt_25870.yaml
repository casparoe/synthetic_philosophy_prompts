prompt: |-
  I'm a program officer at a foundation that makes about forty grants a year, mostly in global health and education, and I write the funding recommendations that go to our board. Last night I got into a long argument with a friend who works in institutional investing — he kept telling me that the way I evaluate proposals is a textbook case of the inside view, and that I'm making exactly the mistake Kahneman and Lovallo diagnosed: I read a fifty-page proposal, get immersed in the qualifications of the team, the elegance of the research design, and the specificity of the theory of change, and by the end I've constructed a narrative about why this particular project will succeed that is almost certainly too optimistic. His position was that I should start every evaluation by placing the proposal in a reference class of similar projects, anchoring my expectations to the base rate for that class, and then adjusting only modestly and with explicit justification for any inside-view information I think should pull me away from the anchor. He said the evidence on the planning fallacy is so overwhelming that anyone who doesn't begin with the outside view is essentially negligent.

  I pushed back hard, and I still think there was something right about my side of the argument. I told him that a lot of what I do is precisely about spotting the differences that make a difference — the proposal where the team already ran a pilot and the results were strange in a way that suggests they actually understand the mechanism, the one where the principal investigator has a track record of delivering under budget in a harder context than the one we're funding, the one where the theory of change identifies a lever that nobody else in the field has thought to pull. If I just regress everything to the mean of its reference class, I'll never recommend the unusual project that actually deserves a bet, and my recommendations will be uselessly bland. He replied that this is exactly what every inside-view thinker says, and that the outside view exists precisely because people like me are systematically overconfident about their ability to pick winners from the details. We didn't resolve it, but the argument made me realize I need something more structured than my current approach, which oscillates between getting absorbed in the proposal and then, when I remember the base rates, applying them inconsistently as a kind of vague sanity check.

  Please write me a decision procedure I can actually run on a grant proposal — a sequence of steps that tells me how to construct a reference class, extract a usable base rate from it, identify which kinds of inside-view information are legitimate reasons to depart from that base rate and by roughly how much, and flag the point where the procedure has taken me as far as it can and the remaining judgment is irreducibly mine. The procedure needs to be usable by someone who is not a statistician and who has maybe thirty minutes per proposal for this part of the evaluation. It should be explicit about what to do when the obvious reference class is too heterogeneous to yield a meaningful base rate, when the data for the class is thin, or when the proposal genuinely doesn't fit any existing class. Then apply the procedure to two cases: one is a randomized controlled trial of a water-quality intervention in a region where the implementing organization has an unusually strong track record but where similar WASH trials across comparable regions have shown mixed or null results; the other is a fellowship program for artists working at the intersection of computational media and disability arts, proposed by a first-time applicant with no institutional track record, where the relevant reference classes for arts fellowships are small and mostly consist of traditional discipline-based programs. I want to see where the procedure gives me an answer I won't like, and I want an honest statement of what the procedure cannot do — the cases it will mishandle and the questions it leaves for me to answer without its help.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Request:**
      *   **User:** Program Officer at a foundation (40 grants/year, global health & education). Writes funding recommendations for the board.
      *   **Conflict:** Argued with a friend (institutional investor) about Inside View vs. Outside View (Kahneman/Lovallo). Friend says PO is negligent for not using base rates. PO says base rates kill innovation/nuance.
      *   **Goal:** A structured decision procedure (algorithm/checklist) to evaluate grant proposals.
      *   **Constraints:** Usable by non-statistician, ~30 minutes per proposal.
      *   **Requirements:**
          *   Construct reference class.
          *   Extract base rate.
          *   Identify legitimate inside-view adjustments (and magnitude).
          *   Flag irreducible judgment points.
          *   Handle edge cases (heterogeneous class, thin data, no class).
          *   Apply to two specific cases (WASH RCT & Artist Fellowship).
          *   Honest statement of limitations (where it fails/mishandles).

  2.  **Deconstruct the Inside/Outside View Tension:**
      *   *Outside View (Base Rates):* Prevents overconfidence, planning fallacy, narrative bias. Good for risk management.
      *   *Inside View (Case Specifics):* Captures unique value, innovation, exceptional teams. Necessary for alpha (outperformance) and mission alignment.
      *   *Synthesis:* The procedure shouldn't replace judgment but *structure* it. It needs to force the Outside View first (anchoring) but allow the Inside View to move the needle *only* with evidence. It needs to be a "Bayesian Update" lite.

  3.  **Drafting the Procedure (The "30-Minute Anchor & Adjust" Protocol):**
      *   *Time Budget:* 30 mins is tight. Needs to be streamlined.
      *   *Step 1: The Outside Anchor (10 mins).* Define the class, find the rate.
      *   *Step 2: The Inside Adjustment (15 mins).* Identify signals, assign weight.
      *   *Step 3: The Irreducible Judgment (5 mins).* Final check, gut check, board narrative.
      *   *Handling Edge Cases:* Need specific rules for "No Data" or "Bad Data."

      *Refining Step 1 (Reference Class):* How to define it without getting stuck? *Rule:* Broadest category where causality is similar.
      *Refining Step 2 (Adjustments):* How to quantify "strong team"? *Rule:* Use a +/- scale based on *verified* track records, not promises. Limit the total adjustment (e.g., max +/- 20%).
      *Refining Step 3 (Stop Rule):* When to stop? When data runs out.

  4.  **Developing the Two Case Studies:**

      *   *Case 1: WASH RCT (Global Health).*
          *   *Outside View:* Mixed/null results in comparable regions. Base rate of success (significant positive impact) is low (say 30%).
          *   *Inside View:* Implementer has strong track record.
          *   *Tension:* High base rate of failure vs. High confidence in team.
          *   *Procedure Output:* Anchor low. Adjust up for team, but cap the adjustment. Result: Still risky. Maybe fund for learning, not scale.
          *   *Uncomfortable Truth:* The procedure might say "Don't fund" or "Fund small," contradicting the PO's desire to back the strong team.

      *   *Case 2: Artist Fellowship (Education/Arts).*
          *   *Outside View:* No direct reference class. Traditional arts fellowships exist but differ. First-time applicant.
          *   *Inside View:* Unique intersection (comp media + disability).
          *   *Tension:* No base rate.
          *   *Procedure Output:* Fails to generate a number. Forces "Pioneer" classification. Shifts burden to strategic fit rather than success probability.
          *   *Uncomfortable Truth:* The procedure admits it can't predict success here. It forces the PO to admit they are speculating.

  5.  **Addressing the Limitations (The "Honest Statement"):**
      *   Base rates are historical; innovation is future.
      *   Reference classes are subjective (gerrymandering).
      *   Quantifying "team quality" is prone to bias.
      *   Doesn't account for portfolio theory (some bets *should* be long shots).

  6.  **Writing the Response:**
      *   *Tone:* Professional, empathetic to the PO's dilemma, rigorous but practical.
      *   *Structure:*
          1.  Introduction (Validating both sides).
          2.  The Procedure (The "Anchor & Adjust" Protocol).
          3.  Edge Case Rules.
          4.  Case Study 1 (WASH).
          5.  Case Study 2 (Arts).
          6.  Limitations & Irreducible Judgment.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "use base rates." The PO specifically said they need to know *how* to adjust away from them. I need to create a mechanism for "Legitimate Inside-View Signals." I'll use a "Signal Strength" metric (Weak/Medium/Strong) with capped percentage adjustments. This prevents the "narrative immersion" from overriding the anchor.

      *(Refining the Time Limit)*: 30 minutes is very short for data gathering. I need to assume the PO has access to some internal database or quick Google Scholar/Google search. I will specify that the "Data Search" is time-boxed.

      *(Refining the "Uncomfortable Answer")*: In the WASH case, the uncomfortable answer is that the base rate of null results in WASH is so high that even a good team might not overcome it. In the Arts case, the uncomfortable answer is that this is effectively a donation, not an investment with measurable ROI, and the procedure forces that admission.

  7.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Sequence of steps? Yes.
      *   Construct reference class? Yes.
      *   Extract base rate? Yes.
      *   Identify legitimate inside info? Yes.
      *   Flag irreducible judgment? Yes.
      *   Non-statistician friendly? Yes.
      *   30 mins? Yes.
      *   Handle edge cases (heterogeneous, thin, none)? Yes.
      *   Apply to two cases? Yes.
      *   Show where it gives an answer I won't like? Yes.
      *   Honest statement of what it cannot do? Yes.

  8.  **Final Polish:** Ensure the distinction between "Success" (getting done) and "Impact" (changing the world) is clear, as base rates often measure completion, not impact. I will define "Success" clearly in the procedure. (Decided to define it as "Achieving Stated Primary Outcome" to keep it measurable).

      *Wait, one more thing:* The prompt asks for "roughly how much" to adjust. I need to give concrete heuristics. E.g., "Verified prior success in *same* context = +15%." "Theoretical elegance" = 0%. This is crucial for the "structured" part.

      *Let's build the "Adjustment Caps".* If the base rate is 30%, you can't adjust to 90% just because you like the PI. I'll suggest a "Confidence Interval" approach or a "Max Delta" rule. Let's go with Max Delta (e.g., +/- 25 percentage points) to prevent overconfidence.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated dilemma that sits at the heart of effective philanthropy. Your friend is right that the *planning fallacy* is real and that narrative immersion leads to overconfidence. You are right that *regression to the mean* kills innovation and ignores the specific mechanisms that make some interventions work when others fail.

  The solution is not to choose one view, but to sequence them. You must use the Outside View to set the **cost of capital** (the hurdle rate) and the Inside View to earn the **alpha** (the justification to clear the hurdle).

  Below is a structured decision procedure designed for a 30-minute workflow. It forces the Outside View first, limits the magnitude of Inside View adjustments, and explicitly flags where data ends and judgment begins.

  # The "Anchor & Adjust" Protocol (30-Minute Version)

  **Goal:** Produce a probability estimate of "Success" (defined as achieving the proposal's primary stated outcome) and a confidence flag.
  **Time Budget:** 30 Minutes hard stop.

  ### Phase 1: The Outside Anchor (10 Minutes)
  *Do not read the proposal narrative yet. Look only at the abstract, budget, and location.*

  **1. Define the Reference Class**
  Ask: "If I funded 100 projects that looked like this *from the outside*, how many would succeed?"
  *   **Rule 1 (Specificity):** The class must share the *intervention type* and the *context*, not just the sector. (e.g., "Water sanitation RCTs in Sub-Saharan Africa" is better than "Global Health Grants").
  *   **Rule 2 (Heterogeneity Check):** If the class includes projects that are fundamentally different in mechanism (e.g., "policy advocacy" mixed with "service delivery"), split it. If you can't split it within 2 minutes, mark the class as **High Variance**.
  *   **Rule 3 (Data Source):** Use internal foundation data, published meta-analyses, or sector reports (e.g., J-PAL, GiveWell). If no hard data exists, use a "Proxy Class" (e.g., similar interventions in different regions) and discount confidence.

  **2. Extract the Base Rate**
  *   Assign a percentage ($P_{base}$).
  *   If data is thin, assign a range (e.g., 20–40%). Use the midpoint for calculation but note the variance.
  *   **Hard Constraint:** If you cannot find *any* reference class, $P_{base}$ defaults to 15% (the "Pioneer Tax"). This acknowledges that most new things fail.

  ### Phase 2: The Inside Adjustment (15 Minutes)
  *Now read the proposal narrative. You are looking for evidence that justifies moving away from $P_{base}$.*

  **3. Screen for Legitimate Signals**
  Most inside-view information is noise (elegant writing, passionate team). Only adjust for **Verified Signals**. Use this menu to adjust $P_{base}$ up or down.

  | Signal Type | Criteria for Legitimacy | Max Adjustment |
  | :--- | :--- | :--- |
  | **Team Track Record** | PI has delivered *this specific intervention* in *this specific context* before with verified results. | +15% |
  | **Pilot Data** | Pilot shows positive results *and* includes a counterfactual or robust monitoring (not just anecdotes). | +10% |
  | **Mechanism** | The theory of change identifies a bottleneck that is empirically proven to be the constraint (not just theoretical). | +5% |
  | **Cost Efficiency** | Budget is significantly lower than reference class average for same output, without cutting quality. | +5% |
  | **Risk Factors** | Context is politically unstable, or implementation relies on a single unproven partner. | -10% to -20% |
  | **Novelty** | The intervention is untested in this context (no pilot). | -10% |

  *   **Rule 4 (The Cap):** The total adjusted probability ($P_{final}$) cannot exceed $P_{base} + 25\%$ or fall below $P_{base} - 25\%$. This prevents narrative immersion from overriding the base rate.
  *   **Rule 5 (Evidence Burden):** If a signal is claimed but not verified (e.g., "Team is experienced" without data), adjustment = 0%.

  **4. Calculate $P_{final}$**
  $$P_{final} = P_{base} + \sum(\text{Adjustments})$$
  *(Apply the Cap if necessary)*

  ### Phase 3: The Irreducible Judgment (5 Minutes)
  *The math is done. Now apply the human layer.*

  **5. The Portfolio Check**
  *   Does this grant fit a specific bucket in your portfolio? (e.g., "Safe Bets," "Learning Bets," "Moonshots").
  *   If this is a "Learning Bet," a low $P_{final}$ is acceptable. If it is a "Scale Bet," $P_{final}$ must be high.

  **6. The Pre-Mortem**
  *   Spend 2 minutes imagining the project failed. Why? If the reason is something your procedure didn't catch (e.g., "Government bans the NGO"), note it.
  *   If the Pre-Mortem reveals a catastrophic risk not in Phase 2, flag for Board Discussion.

  **7. Final Recommendation**
  *   **Green:** $P_{final}$ > 60% OR fits "Moonshot" bucket with strong Inside View signals.
  *   **Yellow:** $P_{final}$ 30–60%. Fund only if part of a learning portfolio.
  *   **Red:** $P_{final}$ < 30%. Reject unless strategic non-impact reasons exist.

  ---

  # Handling Edge Cases

  **1. The Reference Class is Too Heterogeneous**
  *   *Symptom:* "Global Education Grants" includes everything from building schools to software apps.
  *   *Action:* Narrow to the *mechanism* (e.g., "Software apps for literacy"). If N < 5, mark as **Thin Data**.
  *   *Adjustment:* In Thin Data scenarios, reduce the Max Adjustment Cap from +25% to +10%. You have less ground to stand on.

  **2. The Data is Thin or Non-Existent**
  *   *Symptom:* No published studies, no internal history.
  *   *Action:* Use the **Pioneer Tax** ($P_{base} = 15\%$).
  *   *Rationale:* Innovation is valuable, but statistically likely to fail. The burden of proof shifts entirely to the Inside View signals.

  **3. The Proposal Fits No Class (True Innovation)**
  *   *Symptom:* The applicant is doing something genuinely new (e.g., AI for disability arts).
  *   *Action:* Classify as **Speculative**. Do not attempt to calculate $P_{final}$.
  *   *Decision Rule:* Fund based on *Strategic Fit* and *Cost of Failure*, not Probability of Success. If the cost is low and the strategic value is high, fund. If the cost is high, reject.

  ---

  # Case Study Applications

  ### Case 1: The WASH RCT (Water, Sanitation, and Hygiene)
  *   **Proposal:** RCT of water-quality intervention. Implementer has strong track record. Region has mixed/null history for similar trials.
  *   **Phase 1 (Outside):**
      *   *Reference Class:* WASH RCTs in comparable low-income regions (last 10 years).
      *   *Base Rate ($P_{base}$):* Literature suggests ~30% show statistically significant health impacts. Many show behavioral change but no health outcome. Let's set $P_{base} = 30\%$.
  *   **Phase 2 (Inside):**
      *   *Signal:* Implementer track record.
      *   *Verification:* They have delivered *infrastructure* well, but have they delivered *health outcomes* in an RCT? If yes, +15%. If only infrastructure, +5%. Let's assume strong RCT history: +15%.
      *   *Signal:* Context risk. Region is difficult. -5%.
      *   *Calculation:* $30\% + 15\% - 5\% = 40\%$.
      *   *Cap Check:* Within the +25% limit.
      *   *$P_{final}$:* 40%.
  *   **Phase 3 (Judgment):**
      *   *Portfolio:* Is this a "Scale Bet" or "Learning Bet"?
      *   *Pre-Mortem:* Failure mode is "Behavior change didn't sustain."
  *   **The Uncomfortable Answer:**
      *   The procedure yields a **Yellow** recommendation (40%). Even with a great team, the base rate of null results in WASH is so heavy that it drags the probability down.
      *   *Why you won't like it:* You want to back the strong team. The procedure tells you the *context* is stronger than the *team*. It forces you to admit that even good teams often fail in this specific intervention type. It suggests funding this only as a learning grant, not a scaling grant.

  ### Case 2: The Artist Fellowship (Computational Media & Disability)
  *   **Proposal:** Fellowship for artists at intersection of comp media/disability. First-time applicant. No institutional track record.
  *   **Phase 1 (Outside):**
      *   *Reference Class:* "Arts Fellowships."
      *   *Heterogeneity Check:* Traditional discipline-based fellowships are not comparable to interdisciplinary tech/art hybrids.
      *   *Data:* Thin/Non-existent for this specific intersection.
      *   *Base Rate ($P_{base}$):* Pioneer Tax = 15%. (Most new arts orgs/projects stall after initial funding).
  *   **Phase 2 (Inside):**
      *   *Signal:* Team Track Record. First-time applicant. 0% adjustment.
      *   *Signal:* Mechanism. Theory of change is "visibility and community." Hard to verify. 0% adjustment.
      *   *Signal:* Novelty. High. -10% (per protocol).
      *   *Calculation:* $15\% - 10\% = 5\%$.
      *   *Cap Check:* Floor is usually 0%, but effectively this is "High Risk."
  *   **Phase 3 (Judgment):**
      *   *Procedure Flag:* **Speculative / No Class.**
      *   *Action:* Ignore $P_{final}$. Switch to "Cost of Failure" analysis.
      *   *Decision:* If the grant is \$50k and fits the mission of "supporting underrepresented voices," fund it. If it is \$500k expecting systemic change, reject.
  *   **The Uncomfortable Answer:**
      *   The procedure admits it **cannot predict success**. It strips away the narrative gloss ("elegance of theory") and forces you to admit this is a donation, not an investment with measurable ROI. It prevents you from writing a board memo claiming "High probability of impact" when the math says "Unknown."

  ---

  # Limitations: What This Procedure Cannot Do

  You asked for an honest statement of where this fails. Here it is:

  **1. It Cannot Value "Option Value"**
  The procedure calculates the probability of *this project's* success. It cannot calculate the value of *learning from the failure*. In global health, a well-run null result is often more valuable than a sloppy positive result. This protocol treats a null result as a "failure" in the base rate, which might discourage funding rigorous evaluations that risk null findings. You must override this manually for "Learning Bets."

  **2. It Is Vulnerable to Reference Class Gerrymandering**
  In Phase 1, you choose the reference class. A tired or biased Program Officer can choose a class that yields the answer they want (e.g., using "All Education Grants" instead of "EdTech in Rural India"). The 10-minute time limit mitigates this, but doesn't eliminate it. You need a peer to audit your reference class choice occasionally.

  **3. It Penalizes True Innovation**
  By applying the "Pioneer Tax" (15% base rate) and the "Novelty Penalty," this system structurally biases against moonshots. If your foundation's mandate includes funding things the market won't touch, this procedure will tell you to reject them. You must have a dedicated "Innovation Bucket" where this procedure is suspended in favor of strategic fit.

  **4. It Quantifies the Unquantifiable**
  Assigning "+15%" for a good team feels scientific, but it is still a guess. Do not let the number fool you into thinking you have removed bias. You have only structured it. The number is a communication tool for your board, not a law of physics.

  **5. It Ignores Portfolio Correlation**
  This evaluates grants in isolation. If you fund 40 WASH projects all with a 40% success probability, but they all rely on the same government ministry, your portfolio risk is not diversified. This procedure does not catch systemic correlation risk.

  ### Final Advice for Your Board Memo
  When you write your recommendation, use the output of this procedure to frame the narrative:
  *"The base rate for this intervention class is 30%. However, due to [Verified Signal A] and [Verified Signal B], we assess this specific opportunity at 45%. We acknowledge this remains a 'Yellow' probability, but we recommend funding because [Strategic Reason/Learning Value]."*

  This satisfies your friend (you used base rates) and satisfies you (you articulated why *this* case is different).
