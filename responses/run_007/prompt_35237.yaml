      *Self-Correction on Scanlon:* Scanlon actually argues *against* Taurek's strict coin toss in some later writings, but his framework explains *why* people feel the pull of non-aggregation. I should focus on Taurek as the primary label for the "numbers don't count" view, but mention Contractualism as the broader family.

