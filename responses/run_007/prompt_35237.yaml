prompt: |-
  I recently spent several months on a hospital ethics committee during a period in which a scarce treatment had to be allocated among more patients than could receive it, and I keep turning over a pattern of reasoning I encountered there, for which I have never found a satisfactory name.

  The pattern concerns forced choices between saving some number of people and saving a larger number. Almost everyone on the committee agreed, in the abstract, that if one had to choose between saving one patient and saving five equally needy patients, one should save the five. But a substantial minority of my colleagues denied this when the cases were made concrete. They did not claim that the single patient mattered more, or that we owed him special loyalty, or that the comparison was impossible. Their claim was that each of the six patients has a separate claim to be saved, and that these claims do not combine into a larger claim on one side of the ledger. The presence of five other patients, they argued, does not weaken or cancel the one patient's claim. From this they concluded that the bare fact that more people stand on one side does not settle what we should do. Some of them thought the only defensible procedure was a lottery giving each patient an equal chance; others thought any choice was permissible as long as we did not pretend that five equal claims added up to five times the weight of one.

  I later recognized the same pattern in a dispute about clearing a road after a storm, where some residents argued that the fact that one road contained more stranded people did not decide which road to clear first, because each stranded person's claim stood separately.

  I do not think this is the ordinary utilitarian view, and I do not think it is simply the familiar tendency to be moved more by an identified victim than by a statistical one, since the people who argued this way applied it to complete strangers and offered it as a principle. I also do not think it is the claim that lives are incommensurable, since they were willing to compare and choose. But I have no name for it, and I am not sure whether it is one position or a family of positions. What I would like to know is whether this stance — the refusal to let the number of separate claims settle a forced choice about who is saved — is a recognized position, and if so what it is called. I am equally interested in how it should be distinguished from nearby views, and where its boundaries lie: the same people who refused to count heads in the rescue case were often willing to approve public-health measures expected to save a larger number of statistical lives, and I cannot tell whether that combination is consistent or whether it marks the edge of the concept.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Context:** The user served on a hospital ethics committee during a resource scarcity crisis (triage situation).
      *   **The Phenomenon:** A specific pattern of reasoning where committee members agreed *in the abstract* that saving 5 is better than saving 1, but *in concrete cases*, refused to let numbers decide.
      *   **The Core Argument:** Each patient has a separate claim. These claims do not aggregate/combine. The presence of 5 others doesn't cancel the 1's claim. Therefore, numbers alone don't settle the choice.
      *   **Proposed Solutions by Proponents:** Lottery (equal chance) or permissibility of either choice (without claiming 5 > 1 in weight).
      *   **Analogous Case:** Clearing snow from roads (more stranded people on Road A vs. fewer on Road B; some argued numbers shouldn't decide).
      *   **What it is NOT:**
          *   Standard Utilitarianism (maximizing total good).
          *   Identifiable Victim Effect (emotional bias towards specific individuals), as this was argued as a *principle* applied to strangers.
          *   Incommensurability (they were willing to choose, just not based on aggregation).
      *   **Inconsistency/Puzzle:** Proponents often supported public health measures that save more statistical lives, suggesting a boundary between "rescue/triage" contexts and "policy/statistical" contexts.
      *   **The Request:** What is this position called? Is it a recognized position? How is it distinguished from nearby views? Where are its boundaries?

  2.  **Initial Brainstorming & Keyword Association:**
      *   Ethics, Triage, Allocation, Numbers, Aggregation, Claims.
      *   "Separate claims," "Non-aggregation," "Fairness," "Lottery."
      *   John Taurek (famous paper on this).
      *   "Should the Numbers Count?"
      *   Contractualism (Scanlon).
      *   Egalitarianism.
      *   Individualism vs. Collectivism in ethics.
      *   Micro-allocation vs. Macro-allocation.

  3.  **Identifying the Core Philosophical Position:**
      *   The description matches **John Taurek's** argument in his seminal 1977 paper, *"Should the Numbers Count?"*
      *   Taurek argued exactly what the user describes: Loss is suffered by individuals, not groups. There is no "super-losing" when 5 die vs 1. Each suffers their own loss. Therefore, we owe each an equal concern, which implies giving them an equal chance (coin toss), not saving the greater number.
      *   This is often called **Non-Aggregationism** or the **Taurekian View**.
      *   It is also closely related to **Contractualism** (specifically T.M. Scanlon's formulation), which emphasizes justifiability to each individual.
      *   It touches on **Fairness** and **Equal Concern**.

  4.  **Distinguishing from Nearby Views:**
      *   *Utilitarianism:* Aggregates welfare. 5 lives > 1 life. (The view the user's colleagues rejected).
      *   *Identifiable Victim Effect:* Psychological bias. (The user correctly noted this is a principled stance, not a bias).
      *   *Incommensurability:* Saying values can't be compared. (The colleagues *did* choose, just not via aggregation).
      *   *Prioritarianism:* Giving weight to the worse off. (Not quite the issue here).
      *   *Contractualism:* Scanlon argues that an act is wrong if it violates principles no one could reasonably reject. In rescue cases, the one person could reject a principle that always sacrifices them for the many. This supports the non-aggregation view.

  5.  **Addressing the "Inconsistency" (Public Health vs. Triage):**
      *   Why support saving more statistical lives in public health but not in triage?
      *   *Distinction:* **Ex-ante vs. Ex-post**. Public health is often *ex-ante* (rules set before anyone is at risk). Triage is *ex-post* (specific identified individuals are already at risk).
      *   *Distinction:* **Policy vs. Individual Decision**. Public health is systemic; triage is a direct interpersonal conflict of claims.
      *   *Distinction:* **Certainty vs. Probability**. Public health deals with probabilities across a population (everyone benefits from the rule). Triage deals with certain death for the unchosen.
      *   This is often discussed under **Rule Utilitarianism** vs. **Act Utilitarianism**, or **Macro-allocation** vs. **Micro-allocation**.
      *   Scanlon and others argue that aggregation is permissible in policy (where risks are shared) but not in rescue (where specific individuals are sacrificed).

  6.  **Structuring the Answer:**
      *   **Name the Position:** Start with the most direct answer. "Non-Aggregationism," specifically the **Taurek View** (from John Taurek's "Should the Numbers Count?"). Also mention **Contractualism** (Scanlon) as a sophisticated philosophical grounding for it.
      *   **Explain the Core Argument:** Reiterate the "separate claims" logic. Loss is individual. No "social sum" of loss.
      *   **Distinguish from Nearby Views:**
          *   Vs. Utilitarianism (Aggregation).
          *   Vs. Identifiable Victim (Bias vs. Principle).
          *   Vs. Incommensurability.
      *   **Address the Boundary/Consistency Issue (Public Health vs. Triage):** This is crucial. Explain the *Ex-ante/Ex-post* distinction and *Macro/Micro* allocation. Explain why a Taurekian/Contractualist can consistently hold both views (fairness in distribution of chance vs. minimizing risk overall).
      *   **Key Terminology:** Non-aggregation, Individualism, Fair Chances, Contractualism.

  7.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to say Taurek is the *only* proponent. Scanlon is a major figure who refined this without going as far as Taurek's coin toss (Scanlon sometimes allows numbers to count in specific contractualist frameworks, but the "individual complaint" model is key). Actually, Scanlon's *What We Owe to Each Other* discusses this specifically regarding the "Titanic" case. He argues for a view that respects the individual complaint.
      *   *Nuance:* The "Public Health" inconsistency is a classic objection to Taurek. The response is usually the distinction between *ex-ante* interests (everyone wants a policy that minimizes overall risk) and *ex-post* claims (I am here, dying now).
      *   *Terminology Check:* "Non-aggregationism" is the technical term in ethics literature. "The Numbers Problem" is the name of the debate.

  8.  **Drafting the Response:** (Mental Outline)
