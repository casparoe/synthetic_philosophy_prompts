answer: |-
  You have encountered one of the most persistent and debated problems in normative ethics. The position you describe is a recognized philosophical stance, most famously articulated by the philosopher **John Taurek** in his seminal 1977 paper, **"Should the Numbers Count?"**

  In the literature, this view is generally referred to as **Non-Aggregationism** (or the **Non-Aggregation View**). It is sometimes also discussed under the umbrella of **Contractualism** (specifically the work of T.M. Scanlon) or **Individualist Ethics**.

  Here is a breakdown of the position, its philosophical lineage, how it is distinguished from nearby views, and how to resolve the apparent inconsistency regarding public health measures.

  ### 1. The Name and Core Argument
  The specific argument your colleagues made—that claims belong to individuals and do not merge into a collective sum—is the hallmark of **Taurekian Non-Aggregationism**.

  *   **The Core Claim:** Taurek argued that "loss" is something that happens to individuals, not to groups. When five people die, there is not one "super-loss" that is five times greater than the loss of one person; there are simply five separate instances of loss.
  *   **Equal Concern:** Because we owe equal concern and respect to each person, we cannot simply override one person's claim to life because it is outnumbered. To do so would treat the single individual as a mere means to the survival of the group.
  *   **The Procedure:** Consequently, the only way to show equal concern to all six patients is to give them an **equal chance** of survival (e.g., a lottery or coin toss), rather than a guaranteed rescue to the majority.

  ### 2. Distinction from Nearby Views
  You correctly identified that this is not standard Utilitarianism, the Identifiable Victim Effect, or Incommensurability. Here is how it is technically distinguished in ethical theory:

  *   **Vs. Utilitarianism (Aggregationism):** Utilitarianism aggregates welfare. It posits a "social sum" where $5 \text{ lives} > 1 \text{ life}$. Non-aggregationists deny the moral existence of this sum. They argue that morality is fundamentally about relations between individuals, not the maximization of a total.
  *   **Vs. The Identifiable Victim Effect:** The Identifiable Victim Effect is a cognitive *bias* (an emotional reaction to a specific person vs. statistics). Your colleagues were not describing a psychological failure; they were offering a *normative principle*. They argued that even if all patients are strangers, the numbers *should not* count. This makes it a deontological or contractualist claim, not a psychological one.
  *   **Vs. Incommensurability:** Incommensurability suggests values cannot be compared (e.g., "liberty vs. security"). Your colleagues were willing to choose; they simply denied that *numbers* were the correct metric for that choice. They substituted "fair chance" for "maximal outcome" as the decision metric.

  ### 3. The Philosophical Home: Contractualism
  While Taurek provided the starkest version of this view, it finds a sophisticated home in **Contractualism**, particularly the work of **T.M. Scanlon** (e.g., *What We Owe to Each Other*).

  Scanlon argues that an act is wrong if it violates principles that no one could "reasonably reject." In a rescue case, the single individual could reasonably reject a principle that says, "You must always die if five others can be saved." Because that individual has a veto-worthy complaint, the numbers cannot automatically override them. This provides a rigorous philosophical foundation for the intuition your colleagues expressed: that the single patient's claim retains its force regardless of how many other claims stand opposite it.

  ### 4. Resolving the "Public Health" Inconsistency
  You noted a puzzle: *The same people who refused to count heads in the hospital were willing to approve public-health measures expected to save a larger number of statistical lives.*

  In ethical theory, this is not necessarily a contradiction. It is usually resolved by distinguishing between **Ex-Ante vs. Ex-Post** perspectives, or **Macro-Allocation vs. Micro-Allocation**.

  *   **Ex-Ante (Public Health):** When setting public health policy (e.g., vaccination programs, road safety), no specific individual is yet identified as the one who will die. Everyone is in a similar position of risk. A policy that saves more lives overall lowers the risk for *everyone*, including the person who might eventually be the "one." Therefore, everyone could reasonably agree to a policy that maximizes statistical survival because it serves their *ex-ante* interest.
  *   **Ex-Post (Triage/Rescue):** In the hospital scenario, the patients are already identified and in peril. The choice is no longer about lowering general risk, but about **sacrificing a specific individual** for the sake of others. At this stage, the "ex-ante" justification vanishes. The single patient can say, "This policy is not lowering my risk; it is sealing my fate."

  Therefore, a Non-Aggregationist can consistently hold that:
  1.  **In Policy:** We should minimize total statistical deaths (because this benefits everyone's probability of survival).
  2.  **In Rescue:** We should not sacrifice the identified one for the identified five (because this violates the specific claim of the one).

  This boundary is often described as the limit of **aggregation**. Aggregation is permissible when risks are shared and distributed (public health), but impermissible when burdens are concentrated on specific individuals against their will (triage).

  ### 5. Summary of Terminology
  If you wish to research this further or discuss it with colleagues, these are the terms to use:

  *   **The Numbers Problem:** The general name for the debate about whether the number of people saved matters in forced choices.
  *   **Non-Aggregationism:** The specific view that individual claims do not sum up.
  *   **The Taurek View:** The specific argument that we should give equal chances (lottery) rather than save the greater number.
  *   **Individualist Restriction:** The principle that the rights/claims of an individual restrict what can be done to them, regardless of the benefit to others.
  *   **Micro-allocation vs. Macro-allocation:** The distinction between bedside decisions (individual claims) and policy decisions (statistical lives), which explains the public health consistency.

  ### Conclusion
  Your colleagues were not confused; they were intuiting a robust, albeit minority, position in moral philosophy. They were arguing for **fairness in the distribution of chances** over **efficiency in the distribution of outcomes**. While Utilitarianism dominates bioethics guidelines (which usually mandate saving the greater number in triage), the Non-Aggregationist view remains a powerful critique, reminding us that patients are not containers of value to be summed, but rights-bearers with separate claims.
