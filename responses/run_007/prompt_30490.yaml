      *   *Constitutional Precommitment:* A polity (We the People) sets rules for future governments. Key features: Collective agent, intergenerational disconnect (Founders vs. Successors), democracy vs. rights/majority tyranny, hard to change (amendment procedures), benefit is stability/liberty.
      *   *Disanalogies:*
          1.  *Identity:* Individual vs. Collective. Does "The People" persist over time like an individual?
          2.  *Consent:* Self-consent vs. Lack of consent by future generations (Dead Hand Problem).
