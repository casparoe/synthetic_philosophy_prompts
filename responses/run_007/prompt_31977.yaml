answer: |-
  ### The Settled Core vs. The Contested Explanation

  To diagnose the stalemate, we must first rigorously separate the empirical data from the theoretical interpretations. In the literature surrounding the Knobe Effect (or Side-Effect Effect), the distinction between what is observed and what is inferred is often blurred, contributing to the lack of resolution.

  **What is Settled (The Empirical Consensus)**
  There is near-universal agreement on the following data points:
  1.  **The Asymmetry Exists:** The statistical asymmetry in intentionality judgments between the "harm" and "help" conditions is robust. It is not a statistical artifact.
  2.  **Robustness:** The effect replicates across diverse cultures, age groups (including children), and scenario variations. It is not dependent on the specific wording of the original Chairman case.
  3.  **Failure of Standard Models:** Traditional philosophical and psychological models of intentional action (typically based solely on belief, desire, and skill) fail to predict this asymmetry without modification. A purely descriptive, value-neutral model of the folk concept of "intentional" is empirically inadequate.
  4.  **Normative Sensitivity:** Folk judgments of intentionality are sensitive to normative features of the outcome (whether it is good, bad, or a violation of expectations).

  **What is Contested (The Theoretical Divide)**
  The disagreement lies entirely in the *explanation* of why the data looks this way. The camps are not arguing about the numbers; they are arguing about the cognitive architecture and semantic structure underlying them.
  1.  **Moral Penetration (The Radical View):** Proponents argue that moral considerations are *constitutive* of the concept of intentional action. On this view, you cannot fully grasp the meaning of "intentional" without referencing moral norms. The asymmetry exists because the concept itself is partly normative.
  2.  **Pragmatic/Epistemic Distortion (The Moderate/Deflationary View):** Proponents argue the concept of "intentional" is descriptive, but moral judgment biases the *application* of the concept. For example, people might be more motivated to find a target for blame in the harm case, leading them to stretch the definition of "intentional" to fit the need for accountability.
  3.  **Normative Expectations (The Generalist View):** Some argue the driver is not "morality" specifically, but any deviation from a norm (statistical or prescriptive). If a side effect is unexpected or violates a norm (even a non-moral one), it is judged intentional. Morality is just a salient type of norm.
  4.  **The Deep Self (The Attribution View):** This camp argues the asymmetry arises because people infer the agent's "true" values. Harming the environment aligns with a profit-driven "deep self," whereas helping does not. Intentionality is judged based on congruence with the agent's character, not the moral valence of the act itself.

  ### Diagnosis of the Stalemate

  The debate has stalled not because of a lack of data, but because the competing theories are often **empirically underdetermined** and operate at **conflicting levels of analysis**.

  **1. Conflation of Semantics and Psychology**
  A primary source of the impasse is that participants in the debate are often answering different questions under the same heading.
  *   **The Semantic Question:** "What are the truth conditions for the sentence 'The chairman intentionally harmed the environment'?"
  *   **The Psychological Question:** "What cognitive processes lead a subject to assent to that sentence?"

  Camp 1 (Moral Penetration) often treats the data as evidence for the *semantic* claim (morality is part of the meaning). Camp 2 (Pragmatic Distortion) treats the data as evidence for the *psychological* claim (morality biases the processing). Since both camps predict the same output (the asymmetry), no amount of standard survey data can distinguish whether the moral factor is inside the concept's definition or outside it as a biasing factor. This creates a verbal dispute disguised as a substantive one: if two theories predict identical behavior, the argument over whether morality is "in the concept" or "influencing the concept" may be merely terminological.

  **2. The Nature of "Concepts"**
  The stalemate reflects a deeper disagreement about what a concept *is*.
  *   If a concept is a **classical definition** (necessary and sufficient conditions), then the Knobe Effect suggests the definition must include moral clauses.
  *   If a concept is a **prototype or cluster**, then moral features might just be weighted heavily without being definitional.
  *   If concepts are **fragmented or pluralistic** (as suggested by recent work from philosophers like Edouard Machery), then there may be no single "folk concept" of intentionality to discover. There might be one concept used for blame and another for praise.

  As long as researchers assume there is a single, unified target ("The Folk Concept") that must be captured by a single theory, they will talk past one another. The data suggests the cognitive system is flexible, but the theoretical framework demands rigidity.

  **3. Empirical Equivalence and Hidden Variables**
  Most experiments measure the *output* (the judgment), not the *process*. Because the competing theories (Moral Penetration vs. Deep Self vs. Norm Violation) are highly correlated in the real world (moral badness often coincides with norm violation and negative character assessment), standard vignettes cannot disentangle them.
  *   **Hidden Empirical Question:** Is there a cognitive signature that distinguishes *retrieving a definition* from *applying a bias*?
      *   If morality is part of the concept (Semantics), accessing the concept should inherently activate moral processing.
      *   If morality is a bias (Pragmatics), moral processing should occur *after* or *parallel to* the initial conceptual retrieval.
      *   Current reaction-time and neuroimaging studies have not yet provided a decisive dissociation that rules out one camp entirely, often because the tasks are too complex to isolate these millisecond-level differences.

  ### What Would Count as Progress?

  Given this diagnosis, progress will not come from running another variation of the Chairman scenario with slightly different wording. The literature is saturated with such variations. Progress requires shifting the terrain of the debate.

  **1. Dissolving the Semantic Question**
  Progress would involve acknowledging that the question "Is morality part of the concept?" may be ill-posed. Philosophers should move toward **cognitive architecture models**. Instead of asking about the "true meaning," researchers should map the specific information-processing pathways.
  *   *Progress Marker:* A model that specifies exactly at which stage of processing moral valence interacts with action representation (e.g., during encoding, retrieval, or verdict formation) without relying on the ambiguous label of "concept."

  **2. Dissociation Experiments**
  To break the empirical equivalence, experiments must decouple the correlated variables. We need scenarios where:
  *   An action is morally bad but statistically normal.
  *   An action is morally neutral but violates a deep-self value.
  *   An action violates a norm but carries no moral weight.
  *   *Progress Marker:* A finding where intentionality judgments track *only* one of these variables (e.g., norm violation) while holding the others (e.g., moral badness) constant. If such a dissociation is found robustly, it would eliminate the "Moral Penetration" view in favor of a "Normative Expectation" view. (Note: Some studies claim this, but none have achieved consensus).

  **3. Developmental and Cross-Cultural Trajectories**
  If the concept is inherently moral, we should see moral sensitivity in intentionality judgments from the earliest age of concept acquisition. If it is a pragmatic bias, it might develop later as social reasoning becomes complex.
  *   *Progress Marker:* Longitudinal or cross-cultural data showing a divergence. For example, if a culture exists (or a developmental stage) where the Knobe Effect disappears while other moral judgments remain intact, it would suggest the effect is a contingent bias rather than a conceptual necessity.

  **4. Accepting Pluralism**
  Finally, progress may look like the abandonment of the goal to find *the* explanation. It is possible that different cognitive mechanisms trigger intentionality judgments in different contexts.
  *   *Progress Marker:* A consensus that "intentional action" is not a natural kind with a single explanation. Accepting that the Knobe Effect might be the result of multiple overlapping systems (one for blame, one for description, one for social coordination) would resolve the theoretical tension by allowing multiple camps to be partially right in different contexts.

  ### Summary
  The debate has stalled because it is fighting a **semantic war with psychological weapons**. The data shows that moral/normative factors influence judgment, but the data cannot distinguish whether that influence is constitutive (semantics) or biasing (pragmatics). Progress requires stopping the search for the "true definition" of intentionality and starting the search for the specific cognitive mechanisms that produce the judgment, potentially accepting that there is no single mechanism to find.
