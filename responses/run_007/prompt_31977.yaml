      *   *Result:* Harm = Intentional; Help = Unintentional.
      *   *Replication:* Cross-cultural, cross-age, robust.
      *   *Consensus:* The asymmetry exists. It is a real psychological phenomenon. Standard folk psychology models (purely belief/desire based) fail to predict it without modification.

  3.  **Analyze the Competing Explanations (The "Contested" Theory):**
      *   *Camp 1: Moral Penetration (Knobe's original view, Radicals).* Moral judgment *constitutes* the concept of intentionality. The concept itself is normative.
      *   *Camp 2: Non-Moral/Pragmatic/Epistemic (Moderates/Deflationaries).* The concept is descriptive, but moral factors influence *application* via pragmatics, blame allocation, or deep self attribution.
      *   *Camp 3: Deep Self/Values.* It's about aligning with the agent's true values, not morality per se (though morality often signals values).
      *   *Camp 4: Normative Expectations.* It's about violating norms (statistical or prescriptive), not necessarily "moral" badness.

  4.  **Diagnose the Stalemate (Why no progress?):**
      *   *Issue 1: Semantics vs. Psychology.* Are we asking "What does 'intentionally' mean?" (Semantics) or "What cognitive processes produce the judgment?" (Psychology). These often get conflated.
      *   *Issue 2: The "Concept" Problem.* What counts as evidence for a concept? Intuitions? Neural data? Usage patterns? If concepts are unstable, looking for *the* definition is futile.
      *   *Issue 3: Underdetermination.* Multiple theories predict the same data (the asymmetry). Distinguishing them requires very fine-grained experimental designs that often yield ambiguous results.
      *   *Issue 4: Verbal Dispute?* Maybe. If one side says "Moral features are part of the truth conditions" and the other says "Moral features are pragmatic implicatures," but both agree on when people say "intentional," is it just a theoretical labeling difference?
      *   *Issue 5: Theory-Laden Data.* Even the "neutral" scenarios often carry hidden normative weight.

  5.  **Formulate the Diagnosis:**
      *   It's not *just* a verbal dispute, but it has verbal elements.
      *   It is largely a disagreement about *levels of explanation* (competence vs. performance, semantics vs. pragmatics).
      *   It is also a disagreement about the *nature of concepts* (unitary vs. fragmented).
      *   *Hidden Empirical Question:* Is there a "pure" concept of intentionality separable from normativity? Or is the cognitive architecture inherently normative?

  6.  **Define Progress:**
      *   Moving away from "What is the *true* meaning?" to "What is the cognitive architecture?"
