prompt: |-
  I'm a machine learning engineer who works on few-shot and meta-learning systems, and I've been reading around in the cognitive science literature on how people induce concepts from a few examples — the line of work that descends from Bongard problems, where you're shown a handful of positive and negative instances and have to say what rule separates them. Once the engineering details are stripped away, I can't get a grip on what the philosophers and cognitive scientists in that literature are actually disagreeing about. There seems to be a live dispute about whether inducing a concept from a few examples is best understood as selecting among a pre-given space of candidate concepts, or as constructing something that wasn't already in the space; and a further dispute about whether there is any fact of the matter about which generalization is "right" when the examples underdetermine infinitely many rules. I'd like you to restate this debate — the positions, the arguments, and the places where they talk past one another — in the vocabulary I actually use: hypothesis classes, inductive bias, priors and posteriors, capacity and regularization, generalization error, meta-learning, in-context learning, training and test distributions. Do it as faithfully as you can, not as a loose analogy.

  Then give me the residue report. Which claims translate cleanly into that vocabulary, which ones had to be distorted or fudged to get across, and which ones have no counterpart at all? My working hypothesis is that from inside my vocabulary the whole thing looks like an argument about priors and hypothesis spaces, and I want to know whether that's right or whether my vocabulary is quietly assuming one side of the dispute. In particular, does the question "which of the infinitely many consistent rules is the right one?" survive the translation, or does my framework dissolve it into "pick the inductive bias that minimizes expected loss on the distribution you care about"? Where the residue points to something my vocabulary genuinely cannot say, tell me whether that is a limitation of my vocabulary or a sign that the original debate was less clear than it looks. Finally, flag where your own residue report is most fragile: which argument or consideration, if it went the other way, would change your verdict about what does and doesn't survive the translation.
