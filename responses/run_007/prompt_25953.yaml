answer: |-
  Dear Colleague,

  Teaching the Raven Paradox to students who view science as simple evidence gathering requires a careful architectural approach to the fifty minutes you have, because if you reveal the conclusion too quickly, they will dismiss it as a trick rather than engaging with the structural tension it reveals about confirmation. You should anchor the entire session on the classic hypothesis that all ravens are black, and while this example is standard, you must enforce specific constraints on how you use it for the logic to hold. The example needs to have clearly defined binary categories, so that any object is either a raven or not a raven and either black or not black, but it must lack any causal or mechanistic context about why ravens are black, because introducing biology or genetics will allow students to bypass the logical problem by appealing to causal relevance. You must begin the section by securing the two rules of confirmation they encountered in lecture, specifically Nicod's Criterion and the Equivalence Condition, and this step must precede everything else because the paradox is not a problem with the world but a problem arising from the joint acceptance of these two plausible principles. You cannot introduce the contrapositive until they have agreed that logically equivalent statements should be confirmed by the same evidence, because if they reject equivalence early, the paradox dissolves trivially and they will miss the lesson about confirmation theory.

  Once you have established that the statement all ravens are black is logically equivalent to all non-black things are non-ravens, you can move to the derivation stage where you ask them to apply Nicod's Criterion to the contrapositive. At this exact point, usually around the ten-minute mark, you will encounter the first predictable misconception where students will claim the logic is invalid or that the contrapositive does not apply to empirical claims. You must head this off immediately by reminding them that this is a lesson in logic and confirmation structure, not biology, and by forcing them to accept the logical equivalence as a given rule of the game for the sake of the argument. If you do not secure their acceptance of the logical equivalence here, the subsequent intuition clash will feel like a mistake in your reasoning rather than a paradox in their understanding of evidence. Once they accept that observing a non-black non-raven confirms the contrapositive, and therefore the original hypothesis, you should present a concrete instance, such as observing a red apple, and ask if this confirms that all ravens are black. This is the moment the paradox lands, and it depends entirely on the previous step where they agreed that the contrapositive is confirmed by its instances.

  Around the twenty-minute mark, as the implication sinks in, the second major misconception will arise, which is the intuition of irrelevance. Students will insist that a red apple has nothing to do with ravens and therefore cannot count as evidence. You must not allow them to dismiss this feeling, but instead you should validate it while pointing out that it conflicts with the logical rules they just accepted. You need to explain that their intuition relies on a background assumption about relevance that is not contained in the formal rules of hypothetico-deductive confirmation they learned earlier. This is the core dependency of the lesson: they must feel the tension between the formal derivation and their informal intuition before you can discuss solutions. If you move to solutions before they feel the discomfort of the contradiction, they will treat the solutions as abstract trivia rather than necessary repairs to their understanding of science. You should spend the next fifteen minutes outlining the two main ways philosophers handle this, such as Hempel's acceptance that the apple does confirm the hypothesis but the weight is negligible, or the Bayesian approach that argues the evidence is irrelevant given background knowledge.

  It is crucial that you do not present one of these solutions as the correct answer, and this is what you must openly refuse to resolve during the section. You should tell them explicitly that philosophers still disagree on which resolution is best because the disagreement stems from deeper commitments about what confirmation is, whether it is about logical relations or probabilistic relevance. If you resolve it for them, you reinforce their assumption that science problems have single right answers, which undermines the course goal of showing philosophy of science as an ongoing inquiry. You must leave them with the tension intact, emphasizing that the value of the paradox is not in solving it but in revealing the hidden assumptions in their model of evidence. This refusal to resolve depends on having successfully generated the tension in the first half of the class; if they do not feel the paradox, leaving it unresolved will just seem like you ran out of time.

  In the last three minutes, you need to assess whether they have grasped the structural conflict or just memorized the outcome, so you should ask them a specific diagnostic question. You should ask them to imagine a world where they know there are exactly one million objects, and they have checked all non-black objects and found them to be non-ravens, and then ask if finding one more green leaf changes their confidence in the raven hypothesis compared to finding one more black raven. This question works because it forces them to apply the logic of the paradox to a closed system where the intuition of irrelevance is harder to maintain, and it tests whether they understand that the paradox is about the definition of confirmation rather than the practical utility of observing apples. If they answer that the leaf confirms the hypothesis but less than the raven, they understand the Hempelian solution; if they say it does not confirm at all, they need to explain why they are rejecting the equivalence condition. Either way, their answer will show you if they are engaging with the logical structure or just relying on their pre-existing intuition that science is only about looking at ravens.

  You should close the section by reminding them that the paradox survives because both sides of the conflict feel right, and that their job as students of science is to recognize when their intuitive models of evidence clash with formal logic. This approach ensures that the dependency structure holds, where the rules must precede the derivation, the derivation must precede the intuition clash, and the clash must precede the discussion of solutions, all while keeping the example constrained enough to prevent causal bypasses. By refusing to solve the paradox and instead using the final question to probe their grasp of the conflict, you turn a fifty-minute section into a genuine philosophical investigation rather than a lecture on a curious puzzle. I hope this plan helps you guide your students through the discomfort of the paradox, as that discomfort is where the actual learning happens.

  Best regards,

  Your Colleague
