prompt: |-
  I'm a retired geologist who got into philosophy a few years ago — mostly ethics and political philosophy. My daughter works at a state environmental agency, and she's on a committee that has to pick a discount rate for cost-benefit analyses on projects with effects stretching out 50 to 200 years: wetlands restoration, climate adaptation infrastructure, that sort of thing. They're currently using 3% because that's what the federal guidelines say, but she's realized that at 3%, a life saved 200 years from now is worth basically nothing in present-value terms, and its been eating at her.

  Could you write her a decision procedure her committee could actually run for choosing a discount rate on very long-horizon projects? It should walk through the questions in order, and at each step say what the practical implication is for the number they plug in. It needs to be honest about which steps are settled by the philosophy (if any) and which are judgment calls dressed up as technical choices. The committee has economists, ecologists, and a couple of political appointees, so it can't assume everyones read Parfit or Ramsey. Then apply the procedure to two cases: a wetlands restoration whose benefits are mostly ecological and accrue over 100+ years, and a highway project whose safety benefits and maintenance costs stretch over 60 years. Flag where the procedure gives an answer the committee won't like. Please write in American English.
