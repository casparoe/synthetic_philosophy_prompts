answer: |-
  **Note to the User:**
  This is a classic problem in intergenerational ethics, often framed as the tension between the "Ramsey Rule" (ethics-based) and "Opportunity Cost of Capital" (market-based). Your daughter is right to be concerned; at 3%, a benefit worth $1,000,000 in 200 years has a present value of less than $3,000. That effectively silences the future in today's decisions.

  Below is a draft decision protocol written for her committee. It is designed to be technically rigorous but accessible to non-philosophers. It explicitly flags where ethical judgments are being disguised as economic inputs. I have written this in American English as requested.

  ***

  **DRAFT MEMORANDUM**

  **TO:** State Environmental Agency Project Evaluation Committee
  **FROM:** [Daughter's Name/Office]
  **SUBJECT:** Proposed Decision Protocol for Selecting Discount Rates on Long-Horizon Projects
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  Current federal guidelines suggest a standard discount rate of 3% for cost-benefit analyses. While appropriate for short-term infrastructure (0–50 years), this rate renders benefits and costs occurring beyond 100 years mathematically negligible. For projects involving climate adaptation, ecological restoration, and intergenerational equity, this creates a systematic bias against the future.

  This document outlines a five-step decision procedure for selecting discount rates on projects with horizons exceeding 50 years. It distinguishes between technical economic forecasts and ethical judgments to ensure transparency in our decision-making.

  ### 2. The Decision Procedure

  The committee shall determine the discount rate ($r$) by walking through the following five steps. At each step, the committee must record the chosen value and the justification.

  #### Step 1: Categorize the Project Timeline
  **The Question:** Does the project generate significant costs or benefits beyond 50 years?
  *   **Option A (Standard):** No significant impacts beyond 50 years.
      *   *Implication:* Use the standard federal rate (currently 3%). Stop here.
  *   **Option B (Long-Horizon):** Significant impacts extend 50 to 200+ years.
      *   *Implication:* Proceed to Step 2. A single flat rate is likely inappropriate.

  #### Step 2: Determine the "Pure Time Preference" (The Ethical Baseline)
  **The Question:** Do we value the well-being of a person in 2124 less than a person in 2024 simply because they live later?
  *   **Philosophical vs. Technical:** This is an **ethical judgment**, not a market observation. Market rates reflect impatience; public policy should reflect equity.
  *   **Choice:**
      *   *High Preference:* We prioritize current taxpayers significantly over future citizens. (Implies a higher rate).
      *   *Zero Preference:* We value future generations equally to the current one. (Implies a baseline near 0%).
  *   **Committee Recommendation:** For public environmental assets held in trust, the default should be **Zero Pure Time Preference**. We do not discriminate based on birth date.
  *   **Implication:** This removes the "impatience" portion of the discount rate, lowering the final number significantly.

  #### Step 3: Adjust for Expected Future Wealth (The Growth Adjustment)
  **The Question:** Will people in the future be richer than we are, and does an extra dollar matter less to them?
  *   **Philosophical vs. Technical:** This is a **mixed judgment**. It requires economic forecasting (growth rate) and an ethical assumption (diminishing marginal utility).
  *   **The Logic:** If future generations are wealthier, they may need less financial compensation to offset environmental damage. Conversely, if we expect economic collapse or resource scarcity, money might be *more* valuable to them.
  *   **Choice:**
      *   *Standard Growth:* Assume steady GDP growth. (Adds ~1–2% to the rate).
      *   *Conservative Growth:* Assume lower growth or account for climate damages reducing wealth. (Adds ~0–1% to the rate).
  *   **Implication:** If we assume the future is rich and resilient, the discount rate goes up (we invest less now). If we assume the future is precarious, the discount rate goes down (we invest more now).

  #### Step 4: Account for Uncertainty (The Declining Rate)
  **The Question:** How certain are we about economic conditions 100 years from now?
  *   **Philosophical vs. Technical:** This is a **technical risk assessment** with ethical consequences.
  *   **The Logic:** Uncertainty about future interest rates suggests we should use a lower rate for the distant future than for the near future. (This is known as the Weitzman effect).
  *   **Choice:**
      *   *Flat Rate:* Use one number for all years.
      *   *Declining Schedule:* Use ~3% for years 0–50, dropping to ~1% for years 50–100, and ~0.5% for years 100+.
  *   **Implication:** A declining schedule protects against the risk of undervaluing catastrophic long-term outcomes.

  #### Step 5: Final Rate Selection and Sensitivity Analysis
  **The Question:** What number do we plug into the model, and how do we defend it?
  *   **Action:** The committee must select a "Base Case" rate and a "Low Case" rate based on Steps 2–4.
  *   **Requirement:** All Long-Horizon projects must be tested against the "Low Case" (ethical) rate. If a project is viable only under the Low Case, the committee must explicitly acknowledge that the project is an **investment in intergenerational equity** rather than a standard fiscal return.

  ---

  ### 3. Application to Current Cases

  To demonstrate the procedure, we apply it to two active proposals.

  #### Case A: Coastal Wetlands Restoration
  *   **Timeline:** 150 years (ecological maturity and storm buffer duration).
  *   **Benefits:** Flood prevention, carbon sequestration, biodiversity.
  *   **Application:**
      *   *Step 1:* Long-Horizon (150 years).
      *   *Step 2:* Zero Pure Time Preference (Future residents deserve protection).
      *   *Step 3:* Conservative Growth (Climate risks may reduce future wealth/utility of money).
      *   *Step 4:* Declining Schedule (High uncertainty over 150 years).
  *   **Resulting Rate:** Starts at 2.5%, declines to 1% by year 100.
  *   **Outcome:** The Present Value of flood prevention in 2124 remains significant. The project likely passes cost-benefit analysis.
  *   **Comparison:** Under the standard 3% flat rate, benefits after year 80 are negligible. The project likely fails.

  #### Case B: Highway Safety & Maintenance Upgrade
  *   **Timeline:** 60 years (infrastructure lifespan).
  *   **Benefits:** Reduced fatalities, lower vehicle maintenance, resurfacing costs.
  *   **Application:**
      *   *Step 1:* Borderline Long-Horizon (60 years).
      *   *Step 2:* Zero Pure Time Preference (Safety is a right, not a commodity).
      *   *Step 3:* Standard Growth (Transport economics are stable).
      *   *Step 4:* Mild Decline (Uncertainty exists but is lower than ecological systems).
  *   **Resulting Rate:** Flat 2% or slight decline to 1.5%.
  *   **Outcome:** Safety benefits are valued higher than at 3%, but maintenance costs (negative benefits) are also valued higher. Net effect is neutral to positive.
  *   **Comparison:** Under 3%, future maintenance costs are discounted heavily, making the project look cheaper than it actually will be for future taxpayers.

  ---

  ### 4. Political and Budgetary Reality Check
  *Note to Committee: The following points are where this procedure conflicts with standard budgetary practices.*

  **1. The "Everything is Important" Problem**
  *   **The Issue:** If we lower the discount rate from 3% to 1% for long-term projects, the Present Value of future benefits skyrockets. Suddenly, *every* long-term project looks like a good investment.
  *   **The Uncomfortable Truth:** This procedure will make the project pipeline appear "over-subscribed." We will identify more beneficial projects than we have budget to fund.
  *   **Required Action:** We cannot use the discount rate to ration projects. If more projects pass the test than we can afford, we must raise taxes or cut spending elsewhere, not artificially inflate the discount rate to hide the demand.

  **2. Inconsistency Across Agencies**
  *   **The Issue:** The Department of Transportation may use 3% while we use 1.5% for wetlands.
  *   **The Uncomfortable Truth:** This is technically inconsistent but ethically defensible. Market-based infrastructure (highways) competes with private capital (justifying market rates). Public trusts (air, water, biodiversity) have no market substitute (justifying ethical rates).
  *   **Required Action:** We must document this distinction clearly so we are not accused of "cooking the books."

  **3. The Verdict on the 3% Standard**
  *   **The Issue:** The current 3% guideline is based on the return of private capital (what money could earn in the stock market).
  *   **The Uncomfortable Truth:** Using 3% for a 200-year project implies that if we don't invest this money in the market now, future generations will be so much richer that they won't care if their wetlands are gone.
  *   **Required Action:** If the committee retains 3%, we must formally state: *"We have determined that the economic growth of the next two centuries will outweigh the loss of natural capital."* This is a philosophical stance, not a financial calculation.

  ### 5. Recommendation
  The Committee should adopt a **Declining Social Discount Rate** for projects with horizons exceeding 50 years.
  *   **Years 0–50:** 2.5%
  *   **Years 51–100:** 1.5%
  *   **Years 101+:** 1.0%

  This acknowledges the opportunity cost of capital in the near term while respecting our ethical obligation to the distant future.

  ***

  **Note to the User (Dad):**
  You'll notice Step 2 is where the philosophy does the heavy lifting. Economists often try to hide "Pure Time Preference" inside market data, but for public policy, it's a moral choice. If the committee pushes back, your daughter's strongest argument is in Section 4, Point 3: If they keep the 3% rate, they are making an explicit philosophical claim that future wealth negates the need for environmental preservation. That is a hard position to defend in public.

  Good luck to her. She's asking the right questions.
