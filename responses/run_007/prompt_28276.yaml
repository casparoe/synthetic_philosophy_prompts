answer: |-
  Peace be with you, my brother. You bring me tidings from a future age that stir a deep sorrow in my breast, though they do not surprise me regarding the fallen nature of man. That your people should speak falsehoods so casually—two or three times between the rising and setting of the sun—suggests a world where the truth has become a burden too heavy to carry continually.

  You ask where I would place these "social lies" in the order of gravity. In the treatise I have recently completed, *On Lying*, I set out eight degrees of falsehood. The worst are those told in matters of religious doctrine, for they poison the soul toward God. The lower degrees involve lies told to protect the body or property, or merely to please in conversation.

  These lies you describe—where one says "I am well" when sick, or praises a meal to spare a cook's feelings, or claims busyness to avoid a gathering—these would fall into the lower grades. They are what I call "officious" lies; they are told to be of service or to avoid giving offense. They do not destroy a man's life, nor do they lead a soul into heresy. In terms of *damage* done to the neighbor, they are slight.

  But you must hear me carefully: just because a wound is small does not mean it is not a wound. Just because a poison is diluted does not mean it is not poison.

  You ask if I would demand Christians purge these from their lives, or if that is too great a demand. This is the crux of the matter. You speak of these lies as "lubricant" for society, as if friction between men is an evil to be avoided at the cost of truth. But I say to you: Truth is the very bond of charity. If we love our neighbor, we owe them truth, for God is Truth. When you tell a lie, even a small one, you cultivate a *duplex cor*—a double heart. You train your soul to be one thing before men and another before God.

  If a Christian tells two lies every day, he turns his face away from the Light seven hundred times a year. Over a lifetime, this is not a few stumbles; it is a dwelling in shadow.

  So, would I demand you purge them? Yes. Not because I believe you will achieve perfection in this mortal flesh—we know that "if we say we have no sin, we deceive ourselves." But we must aim at the mark, even if we do not always strike it. If we decide that these small lies are "acceptable," we make peace with sin. We say, "This much darkness is enough."

  However, I am not without compassion. I know that sometimes truth spoken without charity is a weapon, not a medicine. If a man asks you, "Is my cooking terrible?" and you say "Yes," you have spoken truth but killed love. Perhaps the sin here is not always in the tongue, but in the heart's laziness. It is easier to lie than to find a truthful way to be kind. It is easier to say "I am busy" than to say, "I cannot come, for I need rest," or "I do not wish to attend."

  Tell me, in this future time: when your people tell these small lies, do they feel a pang of conscience? Or has the heart become so calloused that the lie passes the lips as easily as breath? For if the conscience does not prick, the danger to the soul is far greater than the lie itself.
