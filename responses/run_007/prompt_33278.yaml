answer: |-
  The knowledge norm stands as the only viable candidate because it uniquely satisfies the non-negotiable desideratum of explaining the impropriety of lottery assertions, exposing an irreconcilable conflict between the truth norm's permissiveness and the pre-theoretic intuition that statistical probability alone never warrants assertion. To be adequate, any theory of assertion must deliver on the following specific criteria, divided by their dialectical weight:

  **1. The Challenge Data (Non-negotiable)**
  *Consideration:* An adequate theory must explain the specific form of criticism appropriate to assertion. When an assertion is challenged, the distinctive rebuke is "How do you know?" rather than "Is it true?" or "Do you believe it?" A theory fails if it cannot explain why lacking knowledge makes one liable to this specific challenge, even if the statement turns out to be true.

  **2. The Lottery Intuition (Non-negotiable)**
  *Consideration:* A theory must explain why asserting a lottery proposition (e.g., "Your ticket lost") based solely on statistical probability is improper, even when the proposition is true and the probability is near certainty. This is the primary phenomenological data point used to distinguish knowledge from mere true belief or high justification; ignoring this intuition renders a theory descriptively inaccurate regarding our actual linguistic practices.

  **3. The Moorean Constraint (Non-negotiable)**
  *Consideration:* A theory must explain the pragmatic absurdity of asserting conjunctions like "p, but I do not know p." While such statements might be true, asserting them strikes hearers as contradictory or insane. An adequate norm must generate this absurdity as a violation of the rule of assertion, not merely as a psychological quirk.

  **4. The Truth Sufficiency Principle (Camp-specific/Truth Norm)**
  *Consideration:* Proponents of the truth norm require that any true proposition be properly assertable. This desideratum prioritizes the metaphysical status of the proposition over the epistemic state of the speaker, arguing that the primary goal of assertion is to convey truth, regardless of how the speaker arrived at it.

  **5. The Belief Sufficiency Principle (Camp-specific/Belief Norm)**
  *Consideration:* Proponents of the belief norm require that sincere belief be sufficient for proper assertion. This desideratum prioritizes the speaker's sincerity and psychological state, arguing that assertion is an expression of belief and that requiring knowledge sets the bar too high for ordinary conversation.

  **6. The Gettier Sensitivity (Camp-specific/Knowledge Norm)**
  *Consideration:* Proponents of the knowledge norm require that the theory explain why asserting a true proposition based on Gettierized justification (lucky true belief) is improper. This desideratum ensures the norm is factive and robust against epistemic luck, distinguishing knowledge from accidental truth.

  The single desideratum that does the most work to narrow the field is **The Lottery Intuition**. It acts as the primary filter because it is the only test that simultaneously defeats the Truth Norm (since the lottery proposition is true) and the Belief/Justification Norms (since the speaker believes the proposition and has probabilistic justification). Only a factive norm strong enough to require knowledge can explain why high probability without knowledge renders an assertion improper, making this intuition the sharpest wedge for separating the knowledge norm from its competitors.

  The pair of desiderata that cannot be jointly satisfied is **The Truth Sufficiency Principle** and **The Lottery Intuition**. You cannot maintain that all true propositions are properly assertable while also maintaining that true lottery propositions are improperly asserted; since lottery propositions can be true, accepting the intuition that they are unassertable forces the abandonment of the principle that truth alone is sufficient. This incompatibility forces a choice between preserving a simple metaphysical norm (truth) or accommodating the nuanced epistemic data (lottery intuition), and the latter must win because a norm of assertion that licenses assertions we universally recognize as improper is functionally useless.
