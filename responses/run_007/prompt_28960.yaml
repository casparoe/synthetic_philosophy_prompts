  So I'm taking this philosophy of language course and we've been doing a unit on vagueness — you know, the sorites paradox, heap of sand, all that. And honestly I thought I understood the landscape pretty well (epistemicism, supervaluationism, degree theory, contextualism, the usual suspects) until my study group decided to play this game where we each have to guess each other's theory from case verdicts alone. One guy in the group, Ben, won't tell us what he thinks but he's given us a bunch of verdicts about heaps. Here's what we've gotten out of him:

  - 1 grain: not a heap. "Obviously."
  - 10,000 grains: a heap. "Come on."
  - 5 grains: not a heap, no hesitation.
  - 60 grains: a heap, no hesitation.
  - 14 grains: "I genuinly can't commit either way. The word just sort of gives out at that point."
  - 25 grains: "I'd call it a heap, but I wouldn't die on that hill."
