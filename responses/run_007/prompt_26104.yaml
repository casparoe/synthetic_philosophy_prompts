answer: |-
  The term you are looking for is **Minimally Counterintuitive (MCI) concepts**.

  This is a cornerstone concept in the **Cognitive Science of Religion (CSR)**. The pattern you identified is not just an anecdotal observation; it is the central thesis of Pascal Boyer's work, particularly in his book *Religion Explained* (2001), and has been extensively tested by researchers like Justin Barrett, Scott Atran, and others.

  Here is a breakdown of the terminology, the proposed mechanism, the edge cases, and the current state of the debate, tailored for your syllabus.

  ### 1. The Terminology
  *   **Intuitive Ontologies:** These are the domain-specific cognitive systems you alluded to (folk physics, folk biology, folk psychology). We expect objects to be solid (physics), living things to grow and die (biology), and agents to have beliefs and desires (psychology).
  *   **Counterintuitive Concepts:** Concepts that violate the expectations of these intuitive ontologies.
  *   **Minimally Counterintuitive (MCI):** The specific "sweet spot" where a concept violates *just enough* expectations to be salient, but preserves *enough* intuitive structure to remain cognitively manageable.

  ### 2. Mechanism: Why MCI and not just von Restorff?
  You asked if this is simply the **von Restorff effect** (the isolation effect), where distinct items are better remembered. While distinctiveness is part of the equation, CSR theorists argue MCI is more specific.

  *   **Inferential Potential:** The primary mechanism proposed is not just memorability, but *inferential potential*. A "maximally" counterintuitive concept (e.g., a rock that is omnipresent, timeless, non-agential, yet listens to prayers) is cognitively costly because you cannot run your standard intuitive software on it. You can't reason about its location, its timeline, or its motives.
  *   **The MCI Advantage:** A ghost (a person without a body) allows you to use your **folk psychology** intact. You can predict the ghost's desires, anger, or intentions. You only have to suspend **folk physics** regarding its solidity. This allows the concept to be surprising *and* useful for social reasoning.
  *   **Distinction:** The von Restorff effect explains why a word written in red ink is remembered in a list of black words. MCI explains why a *category violation* sustains cultural transmission over generations. It is about semantic processing, not just perceptual distinctiveness.

  ### 3. Edge Cases and Domains
  The literature suggests specific constraints on how many violations work and which domains matter most.

  **How many violations?**
  The consensus in the early CSR literature was that **one or two violations** is the optimal range for transmissibility.
  *   **Intuitive:** A normal snake. (Boring, not religious.)
  *   **MCI:** A talking snake. (One violation: biology/agency. Highly transmissible.)
  *   **Maximally Counterintuitive:** A snake that is invisible, omnipresent, made of fire, and exists outside of time. (Too many violations. Cognitively costly. Hard to recall or retell accurately.)

  Research by Boyer and Ramble (2001) showed that MCI concepts were recalled better than both purely intuitive and maximally counterintuitive concepts in experimental settings.

  **Which domains?**
  It does matter which domain you violate.
  *   **Folk Psychology (Agency):** Violations here tend to be the most religiously potent. A statue that *hears* (psychology violation) is more likely to become a religious object than a statue that *floats* (physics violation). This ties into the **Hyper-active Agency Detection Device (HADD)** hypothesis. We are evolutionarily primed to detect agents, so agents with weird properties are particularly sticky.
  *   **Contagion:** Another common MCI structure involves "magical contagion" (folk biology/physics violation), where a property is transferred via contact (e.g., a blessing, a curse, holy water).

  ### 4. Current Debates and Caveats (Crucial for a Syllabus)
  Since you are teaching this as a natural phenomenon, you should present the MCI hypothesis as a dominant but contested theory. There has been a **replication crisis** in this specific area of CSR over the last decade.

  *   **Context Dependence:** Some studies (e.g., Porubanova et al., 2014; Upal, 2005) suggest the MCI effect is not as robust as initially claimed. It may depend heavily on the narrative context. A weird concept might be remembered better if it is embedded in a coherent story, regardless of whether it is "minimal."
  *   **Theological Elaboration:** You noted that complex theology (e.g., the Trinity) doesn't travel as well as MCI concepts. CSR agrees. Justin Barrett distinguishes between **Theological Correctness** (the dogma) and **Natural Religious Cognition** (what people actually believe in practice). Your students will likely naturally default to MCI versions of complex doctrines (e.g., praying to God as if He is in one location, despite theological claims of omnipresence).
  *   **Cultural Variance:** Most MCI studies were conducted in Western, Educated, Industrialized, Rich, and Democratic (WEIRD) populations. There is ongoing debate about whether the "intuitive ontologies" are universal or culturally scaffolded.

  ### 5. Suggested Readings for the Syllabus
  To match the American English terminology your students will encounter:

  1.  **Pascal Boyer, *Religion Explained: The Natural Theory of Religion* (2001).** This is the primary source for the MCI concept. Chapter 3 is essential.
  2.  **Justin L. Barrett, *Born Believers: The Science of Children's Religious Belief* (2012).** Good for the development of intuitive ontologies.
  3.  **Stewart Guthrie, *Faces in the Clouds: A New Theory of Religion* (1993).** Pre-dates the specific MCI terminology but establishes the anthropomorphism/agency angle.
  4.  **For the Critique:** Look for papers by **Aiyana K. Willard** or **Rita Anne McNamara** regarding the replication of MCI effects, or the 2014 special issue of *Cognitive Science* on the topic.

  ### Summary for your Lecture Notes
  *   **Term:** Minimally Counterintuitive (MCI) concepts.
  *   **Field:** Cognitive Science of Religion (CSR).
  *   **Mechanism:** Balance between cognitive salience (distinctiveness) and inferential potential (usability).
  *   **Constraint:** Violations of Folk Psychology > Violations of Folk Physics.
  *   **Limit:** 1–2 violations optimal; >3 leads to cognitive load and transmission failure.

  This framework should give your students the precise vocabulary they need to locate the literature while acknowledging the philosophical implications of treating religious ideas as cognitive artifacts.
