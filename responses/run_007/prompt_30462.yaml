answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Resolution Strategies for the Liar Paradox and Naive Truth
  **Participants:** Proponent A (Dialetheism/Paraconsistency), Proponent B (Paracompleteness/Gap Theory)
  **Date:** October 24, 2023

  ## 1. AGREED CLAIMS
  *Both parties affirm the following propositions as the baseline for this collaboration. These claims rule out classical-naive solutions and establish the technical constraints of the debate.*

  1.  **The Incompatibility Thesis:** The conjunction of (i) Naive Truth (unrestricted T-schema: $T(\langle A \rangle) \leftrightarrow A$), (ii) Self-Reference (via diagonalization or primitive naming), and (iii) Classical Logic (specifically the structural rules enabling Explosion and/or Excluded Middle) is inconsistent. We agree that at least one must be restricted.
  2.  **Retention of the T-Schema:** Both parties prioritize retaining the T-schema in full strength over retaining classical logic. We agree that solutions which restrict the T-schema (e.g., Tarskian hierarchies) are less theoretically virtuous than solutions which restrict logic, provided they can handle Revenge.
  3.  **Failure of Bivalence:** We agree that the semantic value of the Liar sentence ($L$) cannot be modeled by a standard bivalent valuation function where every sentence is exclusively True or False. Classical Bivalence is false.
  4.  **Revenge Constraint:** An adequate solution must not merely solve the Simple Liar ($L \leftrightarrow \neg T(\langle L \rangle)$) but must also account for the Strengthened Liar ($S \leftrightarrow \neg T(\langle S \rangle)$ or $S \leftrightarrow \text{False}(\langle S \rangle)$) without retreating to an ineffable meta-language.
  5.  **Curry Constraint:** Any proposed logic must block Curry's Paradox ($C \leftrightarrow (T(\langle C \rangle) \to \bot)$) without collapsing into triviality. We agree this likely requires restricting Contraction or the properties of the Conditional, distinct from the negation restrictions used for the Liar.

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the residual disagreement. Phrasing has been negotiated to ensure each party recognizes their own position in their respective column.*

  | Feature of Disagreement | Proponent A (Dialetheist / LP-style) | Proponent B (Paracomplete / K3/Field-style) |
  | :--- | :--- | :--- |
  | **Semantic Status of $L$** | $L$ is **True and False**. It is a truth-value glut. The extension and anti-extension of 'True' overlap. | $L$ is **Neither True nor False**. It is a truth-value gap. The extension and anti-extension of 'True' do not exhaust the domain. |
  | **Behavior of Negation ($\neg$)** | Negation is **inversion**. $\neg A$ is true iff $A$ is false. Since $L$ is true and false, $\neg L$ is also true and false. Excluded Middle ($A \vee \neg A$) holds. | Negation is **exclusion** (or weak). $\neg A$ is true iff $A$ is false (and not true). Since $L$ is neither, $\neg L$ is not true. Excluded Middle fails. |
  | **Meaning of 'Not True'** | 'Not True' is equivalent to 'False'. To say $L$ is 'not true' is to assert a truth (since $L$ is false), but it is not the *whole* truth (since $L$ is also true). | 'Not True' is broader than 'False'. It covers both the False and the Gap. To say $L$ is 'not true' is to assert a truth that excludes $L$ from the extension of Truth. |
  | **Expressibility of Solution** | The distinction between 'True only' and 'True and False' **cannot** be expressed in the object language without generating a new paradox (Revenge). We must accept some ineffability or use a hierarchy of metainferences. | The distinction between 'True' and 'Gap' **can** be expressed in the object language (e.g., via a determinacy operator or non-classical conditional) without contradiction. |
  | **Rational Denial** | We can rationally deny $A$ even if $A$ is true (when $A$ is also false). Denial is a pragmatic attitude distinct from asserting negation. | We rationally deny $A$ iff $A$ is not true. Asserting $\neg A$ is appropriate only when $A$ is false, not when $A$ is gappy. |

  ## 3. CRUXES AND PREDICTIONS
  *Settling these sub-questions would significantly update the credence of at least one party. We commit to the following tests and predictions.*

  ### Crux 1: The Strengthened Liar and Expressibility
  **The Issue:** Can the theory consistently assert its own diagnosis of the Liar sentence within the object language?
  *   **The Test:** Formulate the sentence $R$: "This sentence is not true [in the sense defined by the theory]."
      *   **Proponent A (Dialetheist) Prediction:** Proponent B's theory will fail to assert "$R$ is gappy" without either (i) contradicting itself, or (ii) requiring a meta-language hierarchy that violates Claim #4 (Revenge Constraint). The notion of "Gap" will prove ineffable.
      *   **Proponent B (Gap) Prediction:** Proponent A's theory will fail to explain why we should not accept *all* contradictions. If "True and False" is acceptable for $L$, there is no non-arbitrary barrier to accepting "True and False" for any sentence, leading to trivialism. The notion of "Glut" will prove unstable under rational scrutiny.
  *   **Update Condition:** A demonstrates a consistent object-language predicate for "Gap" that avoids Revenge $\rightarrow$ A updates toward B. B demonstrates a non-pragmatic, logical barrier to triviality that doesn't rely on 'just not accepting' $\rightarrow$ B updates toward A.

  ### Crux 2: Curry's Paradox and the Conditional
  **The Issue:** Both theories must restrict logic to block Curry. The *method* of restriction reveals the underlying logic's stability.
  *   **The Test:** Evaluate the validity of Modus Ponens ($A, A \to B \vdash B$) and Contraction ($(A \to (A \to B)) \vdash (A \to B)$) for the naive conditional.
      *   **Proponent A (Dialetheist) Prediction:** Proponent B will be forced to weaken Modus Ponens or the Conditional so severely that it loses its utility for ordinary reasoning (e.g., Field's conditional). LP can retain a stronger conditional but must reject Disjunctive Syllogism.
      *   **Proponent B (Gap) Prediction:** Proponent A will be forced to accept that valid arguments can lead from True premises to False conclusions (since DS fails). This violates the normative function of logic. Gap theory preserves the link between Truth-preservation and Validity better.
  *   **Update Condition:** A shows LP can handle Curry without sacrificing the normative force of validity $\rightarrow$ B updates. B shows Field's conditional supports sufficient ordinary inference without collapse $\rightarrow$ A updates.

  ### Crux 3: The Normativity of Logic (Explosion vs. Excluded Middle)
  **The Issue:** Which classical principle is more costly to abandon?
  *   **The Test:** Consider a consistent theory $T$ containing a contradiction $P \wedge \neg P$.
      *   **Proponent A (Dialetheist) Prediction:** It is less costly to allow $T$ to be non-explosive (paraconsistent) than to allow $T$ to have sentences that are neither true nor false (paracomplete), because Excluded Middle is required for proof by cases, which is fundamental to mathematics.
      *   **Proponent B (Gap) Prediction:** It is less costly to allow $T$ to have gaps than to allow $T$ to contain true contradictions, because Explosion is required to prevent triviality, which renders theory choice impossible.
  *   **Update Condition:** Consensus on whether mathematical practice relies more heavily on Proof by Cases (EM) or Non-Triviality (Explosion).

  ## 4. NOTE ON VERBAL DISPUTES
  *After one year of discussion, we identify the following areas where disagreement was merely verbal or conceptual misalignment rather than substantive.*

  1.  **Definition of 'False':** Much of our past friction stemmed from Proponent A using 'False' to mean "True that $\neg$" (inversion), while Proponent B sometimes used 'False' to mean "Not True" (exclusion). Once we distinguished **Internal Negation** ($\neg A$ is true) from **External Negation** ($A$ is not true), several apparent disagreements about the Liar's status dissolved. We agree $L$ is internally false (A) and externally not-true (B).
  2.  **The Meaning of 'Logic':** We were previously talking past each other regarding whether logic is **descriptive** (how we actually reason) or **normative** (how we ought to reason). Proponent A treated the failure of Disjunctive Syllogism as a descriptive fact about truth; Proponent B treated it as a normative failure of the system. We agree to frame the debate as: "Which normative system best captures the naive truth intuitions?"
  3.  **'Acceptance' vs. 'Assertion':** We confused the act of asserting a proposition with the doxastic state of accepting it. Proponent A's claim that "We accept $L$" was heard by Proponent B as "We assert $L$ is exclusively true." We clarify that A means "We accept $L$ as part of a true conjunction," while B means "We assert neither $L$ nor $\neg L$."

  ***

  **Signed,**

  _________________________
  (Proponent A: Dialetheism)

  _________________________
  (Proponent B: Paracompleteness)
