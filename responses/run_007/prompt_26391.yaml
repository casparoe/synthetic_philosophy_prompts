answer: |-
  # The Precommitment Audit Protocol (PAP)

  **Purpose:** To distinguish between legitimate constitutional precommitment (Ulysses contracts) and illegitimate partisan entrenchment (Dead Hand control).
  **Timeframe:** Designed for completion within 5 working days.
  **Audience:** Ministers and Cabinet Committees.

  ## Part 1: The Decision Procedure

  Run the proposal through the following five gates in order. At each gate, record the evidence. If a gate triggers a "Stop," the classification is determined unless a "Political Judgment" override is invoked (see Gate 5).

  ### Gate 1: The Time-Inconsistency Test
  **Question:** Does this proposal solve a specific *time-inconsistency problem* where a future government has a rational, short-term incentive to act against the long-term interest of the state, which this rule prevents?
  *   *Examples of Valid Problems:* Inflation bias (printing money for short-term growth), sovereign default (borrowing too much then repudiating debt), torture/emergency powers (suspending rights during panic).
  *   *Examples of Invalid Problems:* "We might spend too much," "We might change policy X," "We might lose an election."
  *   **Sufficient Answer:** "Yes, there is a documented rational incentive for future actors to deviate from the optimal path *in a way this rule specifically constrains*."
  *   **Stop Condition:** If **No**, classify as **Illegitimate Entrenchment**. (Future majorities should not be bound by current policy preferences).

  ### Gate 2: The Specificity Test (Rule vs. Policy)
  **Question:** Does the proposal lock in a *principle/goal* or a *specific policy instrument*?
  *   *Legitimate:* "Maintain price stability" (Goal), "Respect human rights" (Principle).
  *   *Suspect:* "Tax rate shall not exceed X%" (Instrument), "Utility Y shall remain public" (Instrument).
  *   **Sufficient Answer:** "The constraint sets a standard for decision-making, not the outcome of the decision itself."
  *   **Stop Condition:** If it locks a **Specific Policy Instrument**, move to **Political Judgment** (unless it fails Gate 1, then it is **Illegitimate**). *Note: Locking instruments is usually entrenchment, but may be justified in natural monopolies or rights contexts.*

  ### Gate 3: The Symmetry Test
  **Question:** Does this constraint apply neutrally to all sides of normal political debate, or does it structurally advantage one ideological position?
  *   *Neutral:* "Budgets must be balanced" (Constrains spending and taxing).
  *   *Asymmetric:* "Taxes cannot be raised without 2/3 vote" (Constrains expansion of state, not contraction).
  *   **Sufficient Answer:** "The rule makes it equally difficult to move policy in Direction A as in Direction B."
  *   **Stop Condition:** If **Asymmetric**, classify as **Political Judgment**. *Note: High asymmetry strongly suggests partisan entrenchment.*

  ### Gate 4: The Exit Mechanism Test
  **Question:** Is there a democratic override available that is difficult but not impossible?
  *   *Legitimate:* Supermajority vote, Referendum, Dissolution of Parliament.
  *   *Illegitimate:* "Requires new Constitution," "No amendment possible," "Judicial veto with no appeal."
  *   **Sufficient Answer:** "The people or their representatives can reverse this decision if the consensus shifts significantly."
  *   **Stop Condition:** If **No Exit Mechanism**, classify as **Illegitimate Entrenchment**. (This violates the principle of parliamentary sovereignty without consent).

  ### Gate 5: The Political Judgment Handoff
  **Condition:** If the proposal passes Gate 1 but fails Gate 2 or 3, or if the "Time-Inconsistency" is debatable.
  **Action:** Classify as **Grey Area / Political Judgment**.
  **Required Output:** A "Burden of Proof" statement. Since the theory cannot settle this, the proponents must prove why the specific policy lock is necessary to solve the problem identified in Gate 1.

  ---

  ## Part 2: Honest Accounting of Value-Laden Steps

  This procedure is not a neutral algorithm. It embeds normative commitments derived from liberal democratic theory and rational-choice institutionalism. Users must be aware of the following biases:

  1.  **The Efficiency Bias (Gate 1):** The procedure assumes that *solving time-inconsistency* is a valid reason to limit democracy. This prioritizes long-term economic stability over short-term democratic responsiveness. A populist or radical democratic theorist would reject Gate 1 entirely, arguing no parliament can bind its successor.
  2.  **The Status Quo Bias (Gate 3):** The Symmetry Test assumes the "neutral" position is the current equilibrium. It treats constraints on *expanding* the state the same as constraints on *contracting* it. If your government believes the state is currently too small, a rule preventing further shrinkage might feel "symmetric" to you, but this procedure flags it as asymmetric if it locks current size.
  3.  **The Sovereignty Bias (Gate 4):** The Exit Mechanism test assumes Parliamentary Sovereignty is the default good. It treats "requiring a new Constitution" as a negative. In systems designed for rigid constitutionalism (e.g., USA, Germany), this step may need adjustment.
  4.  **The Rationality Assumption:** The whole protocol assumes politicians are rational actors responding to incentives. It does not account for corruption, coercion, or external threats where "irrational" entrenchment might be survival.

  ---

  ## Part 3: Application to Current Proposals

  ### Proposal 1: Constitutional Amendment Requiring 2/3 Majority for New Taxes
  *Framing: Protecting future generations from deficit spending.*

  **Audit:**
  *   **Gate 1 (Time-Inconsistency):** *Pass (Weak).* Deficit spending is a known time-inconsistency problem (current politicians spend, future politicians pay). However, this rule only constrains *revenue*, not *spending*. It solves only half the equation.
  *   **Gate 2 (Specificity):** *Fail.* It locks a specific policy instrument (taxation thresholds/procedures) rather than a fiscal goal (e.g., "Debt-to-GDP must not exceed X").
  *   **Gate 3 (Symmetry):** *Fail.* It is highly asymmetric. It makes expanding the state (raising taxes) harder than contracting it (cutting spending/services). It structurally advantages small-government ideologies.
  *   **Gate 4 (Exit):** *Pass.* Constitutional amendment is difficult but possible.

  **Classification: Illegitimate Entrenchment**
  **Analysis for Ministers:**
  While deficit control is a valid goal, this mechanism is theoretically flawed. By constraining revenue without constraining expenditure, it does not solve the time-inconsistency problem; it merely creates a legislative deadlock. It fails the Symmetry Test by hardwiring a bias against public revenue into the constitution. This is not a Ulysses contract against weakness; it is a shackle on future fiscal policy.
  **Recommendation:** Reject. If fiscal discipline is the goal, propose a balanced-budget *rule* (constraining both sides) rather than a tax *lock*.

  *(Note: This is the "teeth." This proposal is often framed as "fiscal responsibility." The procedure identifies it as asymmetric entrenchment.)*

  ### Proposal 2: Independent Central Bank with Price-Stability Mandate (Referendum Override)
  *Framing: Preventing inflationary monetization of debt.*

  **Audit:**
  *   **Gate 1 (Time-Inconsistency):** *Pass (Strong).* This is the textbook case. Governments have a rational incentive to print money for short-term growth, causing long-term inflation. Independent banks solve this.
  *   **Gate 2 (Specificity):** *Pass.* It locks a *mandate* (price stability), not a specific interest rate or policy tool. The Bank retains operational discretion.
  *   **Gate 3 (Symmetry):** *Pass.* Inflation hurts savers and wage-earners; deflation hurts debtors. Price stability is generally neutral regarding distributional politics compared to fiscal policy.
  *   **Gate 4 (Exit):** *Pass.* A referendum provides a clear, democratic "nuclear option" if the Bank fails or the mandate becomes obsolete.

  **Classification: Legitimate Precommitment**
  **Analysis for Ministers:**
  This proposal fits the criteria for a valid Ulysses contract. It addresses a proven market/government failure (inflation bias) without removing democratic oversight entirely (referendum override). It constrains the *means* of monetary policy to protect a long-term *goal*.
  **Recommendation:** Proceed.

  ### Proposal 3: Law Prohibiting Privatization of National Water Utility (New Constitution Required to Amend)
  *Framing: Protecting essential human rights and natural monopolies from market failure.*

  **Audit:**
  *   **Gate 1 (Time-Inconsistency):** *Grey.* There is no standard "time-inconsistency" problem regarding privatization. Future governments might want to privatize for ideological reasons or fiscal cash injections. This is a policy preference, not a correction of a rational failure. *However*, proponents argue natural monopolies + essential rights = market failure risk.
  *   **Gate 2 (Specificity):** *Fail.* It locks a specific ownership model (public), not a service standard (e.g., "Universal access at affordable rates").
  *   **Gate 3 (Symmetry):** *Fail.* It prevents moving from Public -> Private, but does not prevent moving from Private -> Public (if it were already private). It locks one ideological direction.
  *   **Gate 4 (Exit):** *Fail.* Requiring a "New Constitution" is effectively an exit ban. It places the barrier beyond the reach of normal amendment procedures.

  **Classification: Grey Area / Political Judgment**
  **Analysis for Ministers:**
  This proposal fails the Specificity and Exit tests decisively, which usually signals illegitimate entrenchment. However, it lands in "Political Judgment" because the *subject matter* (water as a human right/natural monopoly) allows for a normative argument that some assets are too essential to be subject to market cycles.
  **Burden of Proof:** Proponents must justify why a *ownership lock* is necessary rather than a *service standard lock*. They must also justify why the exit barrier is set at "New Constitution" rather than a Supermajority.
  **Recommendation:** Do not approve in current form. If the goal is protecting citizens, legislate a "Right to Water" with strict regulatory standards. This achieves the goal without the illegitimate entrenchment of ownership structure.

  ---

  ## Summary of Outcomes

  | Proposal | Classification | Key Failure Point |
  | :--- | :--- | :--- |
  | **1. Tax Supermajority** | **Illegitimate Entrenchment** | Fails Symmetry Test (Biased against revenue). |
  | **2. Central Bank** | **Legitimate Precommitment** | Passes all gates (Classic Time-Inconsistency solution). |
  | **3. Water Utility** | **Political Judgment** | Fails Exit/Specificity, but subject matter creates grey area. |

  **Note to the Unit:** The classification of Proposal 1 as "Illegitimate" is the most likely to generate pushback from fiscal conservatives. Stand firm on the Symmetry Test: a rule that makes it harder to raise money than to spend it is not fiscal discipline; it is ideological lock-in.
