  ### Decision Tree: Explanatory Commitments in the Naturalistic Study of Religion

  **Q1.** Does the cross-cultural recurrence of religious beliefs and practices require a functional explanation at all (i.e., did these traits persist because they solved a survival or reproductive problem), or is their recurrence sufficiently explained by ordinary cognitive machinery plus cultural transmission?
  *   **Ordinary Machinery + Transmission:** Go to Q2.
  *   **Functional Explanation Required:** Go to Q3.

  **Q2.** When analyzing a minimally counterintuitive story about a watchful ancestor spirit that spreads through a population, is this evidence of a unified 'religious' cognitive architecture (a natural kind), or merely the intersection of distinct systems for agency, intuition, and memory that the historian lumps together?
  *   **Intersection/Historian's Lump:** **Leaf 1: The Fractionationist Position.**
  *   **Unified Architecture:** **Leaf 2: The By-product Account.**

  **Q3.** In a community that demands costly, time-consuming initiation rites from its members, do these rites primarily benefit the *individual* practitioner by verifying their commitment to partners, or the *collective* by enhancing the group's overall survival and cohesion?
  *   **Individual Benefit:** **Leaf 3: The Costly Signaling Account.**
  *   **Collective Benefit:** Go to Q4.

  **Q4.** Regarding the historical emergence of moralizing high gods in large-scale societies, is this emergence driven primarily by the *content* of the belief (fear of supernatural surveillance and punishment), or by *social dynamics* independent of specific god-concepts (e.g., ritual synchrony or group competition)?
  *   **Content (Supernatural Surveillance):** **Leaf 4: The Supernatural-Punishment (Big Gods) Hypothesis.**
  *   **Social Dynamics:** Go to Q5.

  **Q5.** For social dynamics that enhance collective benefit, does the adaptive value arise primarily from *inter-group competition* selecting for groups with cohesive norms, or from *intra-group processes* that generate emotional solidarity and bonding?
  *   **Inter-group Competition:** **Leaf 5: The Cultural Group-Selection Account.**
  *   **Intra-group Solidarity:** **Leaf 6: The Durkheimian Ritual-Solidarity Account.**

  ***

  ### Analysis of Commitments and Logical Space

  **Hardest Commitments to Discharge (One Sentence per Leaf)**
  1.  **Fractionationist:** Defenders must explain why the category 'religion' remains heuristically useful for prediction if it fails to map onto any discrete cognitive or social reality.
  2.  **By-product:** Defenders must explain why religious beliefs are so systematically recurrent across cultures if they are merely noise rather than tuned adaptations.
  3.  **Costly Signaling:** Defenders must demonstrate that the costs incurred in rituals are truly wasteful enough to serve as honest signals rather than investments in direct personal spiritual benefits.
  4.  **Big Gods:** Defenders must account for the existence of large-scale cooperative societies that historically lacked moralizing high gods.
  5.  **Cultural Group-Selection:** Defenders must specify the mechanisms that prevent free-riders from undermining the group traits being selected for.
  6.  **Durkheimian:** Defenders must show how transient emotional states generated by ritual translate into long-term institutional stability without additional coercive mechanisms.

  **Empty or Unstable Combinations**
  The combination of a **by-product explanation with the claim that 'religion' is nevertheless a natural kind** (Leaf 2) is theoretically possible but largely unoccupied by live positions; it is **unattractive** because if religious phenomena are merely side-effects of domain-general cognition, the boundaries of the category 'religion' typically dissolve upon analysis, pushing theorists toward fractionation. While some early cognitive scientists treated 'religion' as a robust natural kind produced by by-products, the logical pressure of the by-product claim usually undermines the coherence required for natural-kind status.

  **Flagged Leaves: Separation Difficulties**
  The tree cannot cleanly separate **The By-product Account** and **The Fractionationist Position** (Leaves 1 and 2), as many by-product theorists agree that 'religion' is not a natural kind, effectively occupying the Fractionationist leaf while retaining by-product causal mechanisms. To separate them, one would need to ask: *"Is the label 'religion' indispensable for describing the output of cognitive systems, or should we discard the term entirely in favor of specific cognitive domains (e.g., theory of mind, hazard precaution)?"* A 'yes' to indispensability secures the By-product leaf; a 'no' secures the Fractionationist leaf.
