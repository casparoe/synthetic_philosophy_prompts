prompt: |-
  I'm a philosophy professor consulting for a philanthropic foundation, and I'd like you to produce a document I can share with their ethics committee. Please adopt the role of a senior scholar with deep expertise in Peter Singer's work on duties of rescue, the drowning-child argument, and the surrounding literature on moral demandingness and effective altruism.

  The foundation has a broad humanitarian mandate. Its ethics committee meets monthly to review intervention proposals — famine relief, emergency medical aid, disaster response, long-term health programs — and decides which to fund. The committee members are lawyers, physicians, and development professionals, not philosophers. They currently lack a shared framework for determining when a proposal triggers something like a duty of rescue and when it does not, and their decisions have been inconsistent. They have asked me for a procedure they can actually use.

  I want you to design a decision procedure — a structured sequence of questions with criteria for what counts as a sufficient answer at each step — that the committee can apply to a proposal to determine whether the foundation has a duty to intervene, and if so, with what degree of urgency and commitment. The procedure should be usable in a two-hour meeting by non-philosophers. It must distinguish between steps that turn on empirical facts (and say what facts are needed), steps that turn on normative judgment (and mark them as such), and steps where the procedure cannot resolve the question and the committee must deliberate.

  The procedure must handle at least these complications:
  - Uncertainty about whether the intervention will succeed (e.g., aid that may be intercepted, diverted, or wasted).
  - Situations where many other actors could also intervene but may or may not do so.
  - Chronic rather than acute need — not a drowning child but a population living in persistent malnutrition.
  - Costs to the foundation that are not purely financial: reputational risk, staff burnout, opportunity costs in other program areas.

  Once you have laid out the procedure, apply it step by step to two proposals:
  1. A request to fund emergency food airlifts to a region experiencing a sudden famine, where the best available estimate is a 60% chance the food reaches civilians and a 40% chance it is seized by armed groups.
  2. A request to fund a five-year deworming initiative in a region where the long-term developmental benefits are genuinely contested among economists — the evidence is mixed and reasonable people disagree about what it shows.

  Then identify at least one case where the procedure yields an answer the committee will find uncomfortable — either an intervention they would have funded that the procedure says they are not obligated to fund, or an intervention they would have dismissed that the procedure says they are obligated to fund — and explain what feature of the procedure produces that result.

  Finally, tell me what the procedure cannot do: what kinds of cases it is not designed to handle, what moral considerations it deliberately sets aside, and where someone might reasonably reject the entire framework rather than dispute a particular step.

  Before you write the procedure itself, I want you to begin by mapping the conceptual terrain. Think through what Singer's drowning-child argument actually establishes and what it leaves open, which standard objections (physical distance, diffusion of responsibility, demandingness, the difference between perfect and imperfect duties) the procedure must address and which it can set aside, and what the hardest translation problems will be when moving from the philosophical argument to an operational checklist. Then proceed to the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Role:** Senior scholar with deep expertise in Peter Singer's work (duties of rescue, drowning child, demandingness, effective altruism).
      *   **Audience:** Ethics Committee of a philanthropic foundation (lawyers, physicians, development professionals, *not* philosophers).
      *   **Goal:** Create a usable decision procedure (structured sequence of questions/criteria) for determining duty to intervene, urgency, and commitment.
      *   **Constraints:** Usable in a 2-hour meeting, distinguish empirical vs. normative vs. deliberative steps, handle specific complications (uncertainty, other actors, chronic need, non-financial costs).
      *   **Requirements:**
          1.  Map conceptual terrain (Singer's argument, objections, translation problems).
          2.  The Decision Procedure itself.
          3.  Apply procedure to two specific cases (Famine Airlift, Deworming Initiative).
          4.  Identify an "uncomfortable result" generated by the procedure.
          5.  Explain limitations (what it can't do, what it sets aside, where rejection is reasonable).
      *   **Tone:** Professional, academic yet accessible, authoritative but practical.

  2.  **Conceptual Terrain Mapping (Pre-writing):**
      *   *Singer's Core Argument:* "Famine, Affluence, and Morality" (1972). The drowning child analogy. Principle: If we can prevent something bad without sacrificing anything of comparable moral significance, we ought to do it.
      *   *Strong vs. Weak Principle:* Strong (prevent bad unless it sacrifices something *morally significant*), Weak (prevent bad unless it sacrifices something *comparable*). Singer usually argues for the strong, but practical application often leans toward a moderated version to avoid immediate burnout/repudiation.
      *   *Objections to Address:*
          *   *Distance:* Irrelevant morally, but relevant logistically/empirically.
          *   *Diffusion of Responsibility:* The "many hands" problem. Singer says others' inaction doesn't absolve you, but effective altruism (EA) adds nuance about *marginal* impact.
          *   *Demandingness:* The "too much" objection. The procedure needs a "stopping rule" or capacity constraint.
          *   *Perfect vs. Imperfect Duties:* Rescue is often seen as perfect (specific victim, specific time), but systemic aid is imperfect. The procedure needs to bridge this.
      *   *Translation Problems:* Turning "comparable moral significance" into budget line items. Turning "probability of success" into a go/no-go threshold. Moving from "individual duty" to "institutional mandate."

  3.  **Drafting the Decision Procedure:**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist. Let's use a Step-by-Step format with clear labels (Empirical, Normative, Deliberative).
      *   *Step 1: Severity & Imminence (The "Bad Thing").* Is it suffering/death? How bad?
      *   *Step 2: Causal Efficacy (The "Can Prevent").* Probability of success. Cost-effectiveness.
      *   *Step 3: Substitutability (The "Others").* Are others doing it? (Counterfactual impact).
      *   *Step 4: Cost to Agent (The "Comparable Significance").* Financial + Reputational + Operational.
      *   *Step 5: Urgency & Duration.* Acute vs. Chronic.
      *   *Output:* Duty (Mandatory), Permission (Optional), or Prohibition (Ineffective/Harmful).

  4.  **Applying to Case Studies:**
      *   *Case 1: Famine Airlift.* High severity. 60% success rate (Empirical). 40% seizure risk. High cost.
          *   *Analysis:* Singer would likely say 60% chance of saving lives outweighs financial cost unless the financial cost cripples the foundation. The seizure risk is a mitigation issue, not necessarily a veto.
      *   *Case 2: Deworming.* Chronic need. Contested evidence (Empirical uncertainty). Long-term.
          *   *Analysis:* If evidence is mixed, expected value calculation is key. If reasonable people disagree, does the precautionary principle apply? EA usually favors high-certainty interventions, but Singer's principle is about *preventing bad*. If the probability is low, the duty weakens.

  5.  **Identifying the "Uncomfortable Result":**
      *   *Idea:* The procedure might mandate funding a high-certainty, high-impact intervention that is politically unpalatable (e.g., direct cash transfers in a corrupt regime vs. visible airlifts) OR it might rule out a "pet project" that feels good but does little.
      *   *Better Idea:* The "Chronic vs. Acute" distinction. Singer's logic implies chronic suffering creates a *stronger* cumulative duty than acute suffering if the acute is a one-off. But humans feel more urgency for the acute. The procedure might say "Fund the deworming (chronic) over the airlift (acute)" based on cost-per-life saved, which feels counter-intuitive to emergency responders.
      *   *Alternative:* The "Other Actors" clause. If the UN is already funding the airlift, the procedure might say the Foundation has *no* duty, even if lives are at stake, because their marginal impact is zero. This conflicts with the "do something" instinct. Let's go with the *Marginal Impact/Other Actors* issue. It often leads to the conclusion that you shouldn't fund what others are already covering, even if the need is dire. This is the "Replacement" problem.

  6.  **Limitations & Critique:**
      *   *What it can't do:* Resolve deep value pluralism (e.g., rights vs. utility). Handle existential risk well (low prob, infinite cost). Account for special obligations (local vs. global).
      *   *Reasonable Rejection:* Contractualists (Scanlon) might reject the aggregative utilitarianism. Virtue ethicists might reject the focus on outcomes over character.

  7.  **Refining the Tone:**
      *   Must sound like a consultant memo to a committee. Clear headings, bold text for emphasis, no jargon without definition.
      *   Ensure the distinction between Empirical (E), Normative (N), and Deliberative (D) is clear at every step.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the 40% seizure risk in Case 1? Yes, needs to be factored into expected value.
      *   *Check:* Did I address the "mixed evidence" in Case 2? Yes, needs a threshold for epistemic confidence.
      *   *Check:* Is the "Uncomfortable Result" clearly explained? I need to make sure the *feature* of the procedure causing it is identified (likely the Marginal Impact calculation).
      *   *Check:* Did I map the conceptual terrain *first*? Yes, that's the first section.

  9.  **Final Polish:** Ensure the Singer scholarship is accurate (Strong vs. Weak Principle, Shallow Pond). Ensure the EA influence (counterfactuals, cost-effectiveness) is integrated but attributed correctly to the operationalization of Singer's views.

  *(Self-Correction on the "Uncomfortable Result")*: A more Singer-specific uncomfortable result is the *demandingness* aspect. If the procedure strictly follows the "comparable moral significance" clause, it might demand the foundation spend almost all its endowment on the most effective cause, leaving nothing for administration or other missions. However, since this is an *institutional* procedure, a "sustainability constraint" is usually built in. A better uncomfortable result is the *neglect of the identifiable victim*. The procedure might prioritize statistical lives (deworming) over identifiable lives (famine), which violates human psychological instincts and potentially legal fiduciary norms regarding specific mandates. Let's use the **Identifiable Victim vs. Statistical Life** tension. It's a classic philosophical problem that translates poorly to policy.

  *Wait, looking at the prompt again:* "Identify at least one case where the procedure yields an answer the committee will find uncomfortable... and explain what feature of the procedure produces that result."
  Okay, I will focus on the **Marginal Impact/Substitutability** feature. If another actor *might* step in, the procedure reduces the duty. This can lead to "buck-passing" or failing to fund because "someone else might." This is a known flaw in applying utilitarian calculus to coordination problems.

  *Actually, let's go with the "Chronic vs. Acute" tension.* The committee are emergency responders at heart. They want to save the drowning child. But Singer's logic (and EA) often favors chronic, preventative measures (deworming) because they are more cost-effective. The procedure might rank Deworming *higher* than Famine Relief. This will be uncomfortable for a committee focused on "rescue."

  *Decision:* I will use the **Cost-Effectiveness vs. Urgency** tension. The procedure prioritizes expected value (lives per dollar). This often favors chronic prevention over acute rescue. This will feel cold to the committee.

  *Wait, one more check:* The prompt asks to handle "Uncertainty," "Many Actors," "Chronic vs Acute," and "Non-financial costs."
  Okay, I need to make sure the procedure explicitly weighs these.

  Let's structure the document.
  1. Header/Memo format.
  2. Conceptual Terrain.
  3. The Decision Procedure (The "Singer-EA Operational Framework").
  4. Application to Cases.
  5. The Uncomfortable Result.
  6. Limitations.

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** The Ethics Committee, The Foundation
  **FROM:** [Your Name], Senior Consultant in Moral Philosophy
  **DATE:** October 26, 2023
  **SUBJECT:** Operationalizing the Duty of Rescue: A Decision Procedure for Intervention Proposals

  ### I. Conceptual Terrain: From the Shallow Pond to the Boardroom

  Before presenting the decision procedure, we must clarify the philosophical machinery we are adapting. The committee's current inconsistency stems from conflating *charity* (supererogatory generosity) with *obligation* (moral requirement). We are grounding this framework in Peter Singer's "drowning child" argument, as refined by subsequent literature on Effective Altruism (EA) and institutional ethics.

  **1. What Singer's Argument Establishes**
  Singer's core principle (from *Famine, Affluence, and Morality*) is: *If it is in our power to prevent something very bad from happening, without thereby sacrificing anything of comparable moral significance, we ought, morally, to do it.*
  *   **Relevance of Distance:** Physical or psychological distance does not diminish moral obligation. A dying child nearby and a dying child abroad command the same duty, ceteris paribus.
  *   **The "Comparable Significance" Clause:** This is the limiting principle. We are not required to sacrifice our own lives or cripple our capacity to do future good. For an institution, this translates to solvency and mission integrity, not mere comfort.

  **2. Objections Addressed vs. Set Aside**
  *   **Addressed:**
      *   *Diffusion of Responsibility:* The fact that others *could* help does not absolve us. However, EA literature introduces the concept of *counterfactual impact*. If others *will* help regardless of us, our duty diminishes because our marginal contribution is zero.
      *   *Demandingness:* We acknowledge that a duty to maximize good cannot require self-destruction. The procedure includes a "Sustainability Constraint."
      *   *Uncertainty:* We replace binary "success/failure" with "Expected Value" (Probability × Impact).
  *   **Set Aside:**
      *   *Rights-Based Objections:* We are not adjudicating whether recipients have a *right* to our funds, but whether we have a *duty* to provide them.
      *   *Special Obligations:* We are setting aside questions of whether the foundation owes more to its local community than to global strangers. We are operating under a broad humanitarian mandate that assumes global scope.

  **3. Translation Problems**
  Moving from philosophy to policy requires hardening soft concepts:
  *   *"Bad Thing"* $\rightarrow$ **Severity Threshold:** Death, permanent disability, or severe malnutrition.
  *   *"In Our Power"* $\rightarrow$ **Causal Link:** Evidence of efficacy and logistical feasibility.
  *   *"Comparable Significance"* $\rightarrow$ **Opportunity Cost:** Financial expenditure + Reputational/Operational risk relative to the Foundation's endowment and capacity.

  ---

  ### II. The Decision Procedure: The "Rescue & Impact" Framework

  **Instructions:** This procedure is designed for a 2-hour review. For each proposal, the Committee must move through Steps 1–5 sequentially.
  **Key:**
  *   **[E]** = Empirical Step (Requires data/evidence).
  *   **[N]** = Normative Step (Requires value judgment).
  *   **[D]** = Deliberative Step (Requires vote/consensus; procedure cannot automate this).

  #### Step 1: The Severity Threshold [N]
  *Question:* Does the situation involve harm that meets the Foundation's definition of "Severe Suffering"?
  *Criteria:*
  *   **Yes:** Imminent risk of death, permanent physical/cognitive impairment, or chronic severe malnutrition.
  *   **No:** Poverty, inconvenience, or moderate health issues without long-term sequelae.
  *   *Outcome:* If **No**, the proposal is a **Permission** (optional charity), not a **Duty**. Stop. If **Yes**, proceed to Step 2.

  #### Step 2: Causal Efficacy & Uncertainty [E]
  *Question:* What is the Expected Value (EV) of the intervention?
  *Data Needed:*
  1.  Total benefit if successful (e.g., lives saved, DALYs averted).
  2.  Probability of success ($P$), accounting for leakage, diversion, or failure.
  3.  Cost per unit of benefit.
  *Calculation:* $EV = (\text{Total Benefit} \times P) - \text{Cost}$.
  *Criteria:*
  *   **High Confidence:** $P \geq 0.7$ with robust data.
  *   **Moderate Confidence:** $0.4 \leq P < 0.7$ with mixed data.
  *   **Low Confidence:** $P < 0.4$ or highly speculative.
  *   *Outcome:* If **Low Confidence**, the Duty is significantly weakened (shifts toward Permission). If **High/Moderate**, proceed to Step 3.

  #### Step 3: Substitutability & Marginal Impact [E]
  *Question:* If the Foundation does *not* fund this, will the harm occur anyway?
  *Data Needed:* Assessment of other actors (governments, UN, other NGOs). Are they committed? Is their funding secure?
  *Criteria:*
  *   **Gap:** No other actor is willing/able to fill the need. (High Duty)
  *   **Redundancy:** Other actors are already fully funding the intervention. (Low/No Duty)
  *   **Catalytic:** Foundation funding unlocks other funding. (High Duty)
  *   *Outcome:* If **Redundant**, the Duty is negated (resources are better used elsewhere). If **Gap** or **Catalytic**, proceed to Step 4.

  #### Step 4: The Cost to the Agent [N] + [E]
  *Question:* Does the cost compromise the Foundation's ability to function or fulfill other duties?
  *Data Needed:*
  1.  Financial cost relative to annual budget/endowment.
  2.  Reputational risk assessment (e.g., association with armed groups).
  3.  Staff capacity/burnout risk.
  *Criteria:*
  *   **Sustainable:** Cost is within discretionary budget; risks are manageable.
  *   **Critical:** Cost threatens solvency or core operational capacity.
  *   *Outcome:* If **Critical**, the Duty is voided (Self-Preservation Principle). If **Sustainable**, proceed to Step 5.

  #### Step 5: Urgency vs. Efficiency [D]
  *Question:* Given the above, does the urgency of the need outweigh the efficiency of alternative uses of funds?
  *Context:* This step addresses the **Chronic vs. Acute** complication.
  *Deliberation:*
  *   **Acute:** Immediate loss of life (e.g., famine). High emotional/moral weight.
  *   **Chronic:** Long-term suffering (e.g., malnutrition, disease). Often higher cost-effectiveness.
  *   *Vote:* The Committee must vote to classify the intervention as **Mandatory** (Duty), **Preferred** (Strong Permission), or **Optional** (Weak Permission).
  *   *Guidance:* In ties between Acute and Chronic, prioritize the option with the higher *Expected Value per Dollar* unless the Acute threat involves immediate mass mortality.

  ---

  ### III. Application to Proposals

  Here we apply the framework to the two specific cases provided.

  #### Case 1: Emergency Food Airlift (Famine)
  *   **Step 1 (Severity):** **Yes.** Famine involves imminent death. [N]
  *   **Step 2 (Efficacy):** **Moderate Confidence.** 60% chance of success ($P=0.6$). 40% seizure risk is significant but does not reduce EV to zero. [E]
  *   **Step 3 (Substitutability):** **Gap.** Assume for this scenario no other airlift is planned. [E]
  *   **Step 4 (Cost):** **Sustainable.** Assume financial cost is high but within budget. Reputational risk exists (seizure by armed groups) but is manageable. [N/E]
  *   **Step 5 (Urgency):** **Acute.** Immediate mortality.
  *   **Verdict:** **Mandatory Duty.**
      *   *Reasoning:* Despite the 40% failure risk, the severity of the "bad thing" (death) is maximal. The cost is sustainable. The lack of other actors creates a gap. The 60% success rate yields a positive Expected Value that outweighs the financial cost under Singer's principle.

  #### Case 2: Five-Year Deworming Initiative
  *   **Step 1 (Severity):** **Yes.** Chronic malnutrition and cognitive impairment qualify as severe suffering, though not imminent death. [N]
  *   **Step 2 (Efficacy):** **Low/Moderate Confidence.** Evidence is contested. Economists disagree on long-term developmental benefits. Let us assign $P=0.5$ due to epistemic uncertainty. [E]
  *   **Step 3 (Substitutability):** **Partial.** Governments may scale this later, but not immediately. [E]
  *   **Step 4 (Cost):** **Sustainable.** Low financial cost, low reputational risk. [N/E]
  *   **Step 5 (Urgency):** **Chronic.**
  *   **Verdict:** **Preferred (Strong Permission), but not Mandatory.**
      *   *Reasoning:* While cost-effective *if* the evidence holds, the epistemic uncertainty (Step 2) weakens the duty. Under Singer's framework, we are obligated to prevent *certain* or *highly probable* bads first. When evidence is genuinely mixed among experts, the "Could Prevent" clause is weakened. It remains a high-priority permission, but the uncertainty prevents it from overriding acute, high-certainty rescue cases.

  ---

  ### IV. The Uncomfortable Result

  **The Case:** A proposal to fund **Direct Cash Transfers** to a region under a corrupt regime versus a proposal to fund a **Visible Infrastructure Project** (e.g., building a school) in a stable region.

  **The Procedure's Output:**
  The procedure will likely mandate the **Direct Cash Transfers** and reject the **School Project**, even if the School Project is safer and more popular.

  **Why this is Uncomfortable:**
  1.  **Reputational Risk:** Cash in a corrupt regime carries a high risk of diversion (Step 2 uncertainty) and reputational damage (Step 4 cost). However, if the *Expected Value* of the cash (even with leakage) is higher per dollar than the school (which is expensive and has lower marginal impact on mortality), the procedure flags it as the Duty.
  2.  **Identifiable Victim vs. Statistical Life:** The School Project offers a "ribbon-cutting" moment and identifiable beneficiaries. The Cash Transfer helps statistical lives. The Committee, composed of humans, will feel a stronger pull toward the School.
  3.  **The Feature Causing This:** This result is produced by **Step 2 (Causal Efficacy/Expected Value)** combined with **Step 5 (Urgency vs. Efficiency)**. The procedure prioritizes *outcome maximization* over *risk mitigation* or *public relations*. It forces the Committee to acknowledge that if their goal is to reduce suffering, they must sometimes choose "messy" interventions that save more lives over "clean" interventions that look better but save fewer.

  **Alternative Uncomfortable Result (The "Buck-Passing" Problem):**
  If the UN has *already* pledged to fund the Famine Airlift (Case 1), but their pledge is not yet secure, Step 3 (Substitutability) might suggest the Foundation has **No Duty** to intervene because the marginal impact is low (the UN *should* cover it).
  *   **Why Uncomfortable:** If the UN pledge falls through, people die. The procedure might advise waiting to see if the UN follows through to avoid "redundancy." This feels like gambling with lives.
  *   **Feature:** The **Marginal Impact** criterion. It treats the Foundation as one optimizer among many, rather than a guarantor of last resort.

  ---

  ### V. Limitations and Reasonable Rejections

  This procedure is a tool, not a moral oracle. The Committee must understand its boundaries.

  **1. What the Procedure Cannot Do**
  *   **Resolve Value Pluralism:** It assumes a consequentialist framework (outcomes matter most). It cannot adjudicate between stakeholders who believe *rights* or *intentions* matter more than outcomes.
  *   **Handle Existential Risk Well:** It struggles with low-probability, infinite-cost scenarios (e.g., pandemic prevention) where the "Expected Value" math breaks down.
  *   **Account for Special Relationships:** It treats all beneficiaries equally. It cannot easily account for why a Foundation might prioritize its home country or specific demographic groups without violating Step 1's neutrality.

  **2. Moral Considerations Deliberately Set Aside**
  *   **Virtue Ethics:** The procedure does not ask, "What does funding this say about our character?" It asks, "What does funding this *do*?"
  *   **Procedural Justice:** It does not evaluate whether the recipients had a voice in the proposal. It focuses on the *result* of the aid, not the *process* of its allocation.
  *   **Historical Rectification:** It does not consider whether the Foundation owes aid due to past harms caused by the donor nation. It looks forward, not backward.

  **3. Where Reasonable Rejection is Possible**
  A Committee member might reasonably reject this entire framework on **Contractualist** grounds (e.g., T.M. Scanlon). They could argue:
  *   *"We do not have a duty to maximize the good; we have a duty not to violate principles that no one could reasonably reject."*
  *   Under this view, the "Demandingness" of Singer's framework is itself a violation. A member could argue that the Foundation has a right to preserve its own culture and preferences, even if that means saving fewer lives globally.
  *   **The Clash:** If the Committee adopts this rejection, the Procedure's "Mandatory" classifications become merely "Optional." This is not a failure of the procedure, but a fundamental disagreement on the source of moral obligation.

  ### VI. Recommendation for the Committee

  Adopt this procedure as a **presumptive framework**. Use it to generate a "Duty Score" for each proposal. However, include a "Override Clause" in your bylaws: If the Committee votes unanimously to deviate from the Procedure's recommendation, they must record a **Public Justification** explaining which moral principle (e.g., Justice, Virtue, Loyalty) outweighed the Utilitarian calculation. This ensures that when you depart from the duty of rescue, you do so consciously, not accidentally.
