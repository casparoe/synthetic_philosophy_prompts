answer: |-
  You have hit on exactly the objection that has kept philosophers busy for the last 60 years. In fact, your intuition is shared by some of the biggest names in the field (like Galen Strawson, P.F. Strawson's own son, and Derk Pereboom).

  However, to see why "Freedom and Resentment" is considered a watershed moment, we need to correct one specific misunderstanding about what Strawson is actually claiming. You are interpreting his argument as:

  > **Premise:** We are psychologically incapable of giving up reactive attitudes (resentment, gratitude, etc.).
  > **Conclusion:** Therefore, moral responsibility is real/justified.

  If that were his argument, you would be absolutely right: that is a textbook naturalistic fallacy. Just because we are wired to believe in gods, or astrology, or conspiracy theories, doesn't make them true.

  But Strawson is making a deeper, more conceptual point. He isn't saying our psychology *validates* a metaphysical fact. He is arguing that **the concept of moral responsibility is constituted by those attitudes.** There is no "responsibility" floating out there in the universe waiting to be checked against determinism.

  Here is the breakdown of why this was such a big deal, and why your astrology analogy doesn't quite land.

  ### 1. He is attacking the question, not answering it
  Before Strawson, the debate was stuck between **Pessimists** (Incompatibilists) and **Optimists** (Compatibilists).
  *   **Pessimists** said: "If determinism is true, we are just puppets. Responsibility requires a magical, uncaused cause."
  *   **Optimists** said: "No, responsibility just means you weren't coerced and you acted on your desires. Determinism is fine."

  Strawson thought **both sides were wrong** because they both accepted a false premise: that moral responsibility depends on a specific *metaphysical fact* about the universe (like whether causal chains are broken or unbroken).

  Strawson's move is to say: "Stop looking at the physics of the universe. Look at what we are actually *doing* when we hold someone responsible."

  ### 2. The Astrology Analogy vs. The Language Analogy
  Your analogy is: *If I can't stop believing in astrology, that doesn't make astrology true.*
  This works for astrology because astrology makes a claim about the **external world** (the stars influence my personality). We can step outside our belief system and check the stars.

  A better analogy for Strawson is **language** or **chess**.
  *   Imagine someone asks: "Is the move 'Castling' in chess *really* valid, given the laws of physics?"
  *   That question doesn't make sense. "Castling" is a status that exists *only within the rules of chess*. There is no "Castling" outside of the game to be justified by physics.

  Strawson argues that "Moral Responsibility" is like "Castling." It is a status that exists *only within the framework of human interpersonal relationships* (the reactive attitudes).
  *   If you ask, "Is responsibility justified given determinism?" you are asking if the game of human relationships is justified by the laws of physics.
  *   Strawson says: You can't step outside the human framework to judge it. If you remove the reactive attitudes (resentment, indignation, gratitude), you don't have "unjustified responsibility." **You have no concept of responsibility at all.** You just have social engineering and behavior modification.

  ### 3. The "Objective Attitude" Loophole
  Strawson admits we *can* suspend reactive attitudes. He calls this taking the **Objective Attitude**. We do this with small children, people with severe dementia, or the severely mentally ill. We don't get *mad* at a toddler for knocking over a vase; we just manage their behavior.

  The Pessimist says: "If determinism is true, we should take the Objective Attitude toward *everyone*."

  Strawson replies: "You literally cannot do that globally." To view everyone objectively is to cease viewing them as people. It is to opt out of the human community. Since we are socially constituted beings, we cannot globally abandon reactive attitudes without ceasing to be who we are.

  Therefore, the question "Should we keep holding people responsible?" is empty. We *will* hold people responsible because that is what human interaction *is*. The only real question is: *Within* this framework, are there specific cases where we should suspend the attitude (e.g., insanity, coercion)?

  ### 4. So, what is the "Big Deal"?
  Why do philosophy students still read this 70 years later?

  1.  **It shifted the battlefield:** Before Strawson, free will was a topic in **metaphysics** (causation, physics, theology). After Strawson, it became a topic in **moral psychology and social philosophy**. He forced philosophers to explain *why* we care about responsibility, rather than just arguing about causal chains.
  2.  **It created "Strawsonian Compatibilism":** A whole generation of philosophers (like Gary Watson, John Fischer, and Michael McKenna) built careers trying to refine Strawson's view. They argue that responsibility isn't about "could have done otherwise" in a metaphysical sense, but about being an appropriate target of these reactive attitudes based on your moral competence.
  3.  **It exposed the "Ultimate Responsibility" trap:** He showed that the Pessimist demand for "ultimate responsibility" (that you must be the cause of yourself) is incoherent. Nothing can be the cause of itself. If that's the requirement for responsibility, then responsibility is impossible by definition, regardless of determinism. Strawson showed that this requirement is not actually part of our moral lives.

  ### 5. Where you are still right (The Criticisms)
  Despite all this, your skepticism is warranted. Strawson doesn't satisfy everyone, and for good reasons:

  *   **The "So What?" Objection:** Even if Strawson is right that we *can't* stop feeling resentment, the Pessimist can say: "Okay, so we are biologically tricked into feeling resentment even though no one is truly responsible. That's tragic, but it doesn't make responsibility *real*." Strawson changes the definition of "real" to "socially indispensable," which some find unsatisfying.
  *   **The Galen Strawson Objection:** P.F. Strawson's son argued that even if we accept the reactive attitudes, they still presuppose a belief in free will. If determinism is true, our reactive attitudes are based on a false belief (that the agent could have done otherwise). Therefore, the whole practice is built on an illusion, even if it's a necessary one.
  *   **Reformability:** Just because we are *currently* wired for resentment doesn't mean we *should* be. Maybe a more enlightened society would learn to suppress reactive attitudes in favor of therapeutic ones. Strawson assumes our current psychology is the final word, which seems conservative.

  ### Summary
  Strawson's contribution wasn't proving that free will exists. It was arguing that **the traditional debate is malformed.**

  He isn't saying "We believe it, so it's true." He is saying "The concept of 'truth' regarding responsibility only exists *inside* the practice of believing it."

  If you are looking for a metaphysical guarantee that you are truly the author of your actions in a universe of cause and effect, Strawson offers nothing. He basically shrugs and says, "That's not what responsibility means, and looking for that kind of guarantee is a philosophical dead end."

  Whether that solves the problem or just dissolves it is still the main fight in free will philosophy today.
