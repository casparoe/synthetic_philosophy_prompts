      *   *Section 3: Self-Deception vs. Testimony.* Stevens often hints he knows the truth (the "gentleman" definition). He constructs narratives to protect Darlington. This suggests the problem isn't testimony per se, but the psychological cost of maintaining the deference. The pessimist worries about autonomy; Ishiguro worries about humanity.
      *   *Section 4: The Optimist's Counter.* Could an optimist say Stevens deferred to the *wrong* person? If Darlington were Churchill, would it be okay? The novel suggests the structure of the relationship is the flaw, not just the content.
