      *   *Complication:* Is it *testimony*? Or is it *role-obligation*? Stevens doesn't just believe Darlington is right; he believes a butler *must not judge*. This shifts the issue from epistemology (how we know) to ethics of role (what we should do).
      *   *Further Complication:* Stevens's repression. He *knows* Darlington is wrong but suppresses it. This isn't pure deference; it's bad faith. Pessimism assumes the agent *adopts* the belief. Stevens *performs* the belief.
      *   *The "Corrosion" Aspect:* Pessimists say deference robs agency. Stevens shows it robs *affect* and *connection*. It's not just about "wrong beliefs"; it's about the inability to feel regret or love until it's too late.
      *   *Conclusion:* The novel supports the pessimist's intuition (deference is dangerous) but diagnoses the cause differently. It's not that moral testimony is impossible; it's that institutional hierarchy weaponizes it to bypass conscience.

