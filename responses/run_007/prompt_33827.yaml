      *   *Optimism (e.g., Jones, McGrath [sometimes], Sliwa):* Deferring is sometimes necessary/wise. Expertise exists in morality. Modesty requires acknowledging others know better.
      *   *Key Tension:* Is the problem the *source* of the belief (testimony) or the *psychological mechanism* (self-deception, bad faith, professional distortion)?

  3.  **Deconstruct the Novel (*The Remains of the Day*):**
