prompt: |-
  I direct a portfolio of software products at a mid-sized firm. Four times a year we run stage-gate reviews at which each active project is either continued, paused, or killed. The decisions are high-stakes (project budgets run to seven figures), they are made by an investment committee of non-specialists, and I have about half an hour per project to prepare a recommendation. I keep running into the same argument. One camp says the money and months already spent are sunk costs and should count for nothing; the other says that is naive, because in a dollar auction it can be rational to keep bidding once you have already bid heavily, since quitting locks in a loss whereas one more increment might win. I have read enough rationalist material to know that both sides are partly right: the correct default is to ignore sunk costs, but the dollar auction shows there are real cases where continuing is rational even though the project as a whole will never be worth what has been spent on it.

  Please write me a decision procedure I can actually run at these reviews. It should be a checklist or ordered set of questions, with, for each question, what counts as a sufficient answer and what the answer implies for the decision. It should distinguish a genuine dollar-auction structure (a contest in which quitting concedes something to a rival and the next increment can change who wins) from ordinary unilateral escalation, and it should say how to handle the grey cases: recoverable value, reputational and learning payoffs, the difference between a bid that improves your position and a bid that merely postpones admitting a mistake, and whether a precommitment cap set before the contest began should bind the review. It should also say where the procedure must stop and hand the decision to a person because the question is one of values rather than facts. Then run the procedure on three cases: (1) a project that is behind schedule and over budget with a competitor close to shipping a similar product; (2) a research prototype that has consumed its budget and needs more money to reach a demo, with no competitor in sight; and (3) a project that is technically healthy but whose business case has collapsed because a key customer left. Make sure at least one of these comes out with an answer my committee will dislike. Finally, tell me what the procedure cannot do — the failure modes it is blind to. Please write in British English. Your final line should be a one-sentence summary of the procedure, beginning 'Summary:'.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Director of a software portfolio at a mid-sized firm.
      *   **Context:** Quarterly stage-gate reviews, high-stakes decisions (7-figure budgets), non-specialist investment committee, 30 mins prep time per project.
      *   **Core Conflict:** Sunk Cost Fallacy vs. Dollar Auction Rationality (escalation of commitment).
      *   **Task:** Create a practical decision procedure (checklist/questions) to resolve this conflict during reviews.
      *   **Requirements:**
          *   Distinguish genuine dollar auctions from ordinary escalation.
          *   Handle grey cases (recoverable value, reputation, learning, precommitment caps).
          *   Identify where human judgment (values) takes over from facts.
          *   Run the procedure on three specific cases (one must yield an unpopular answer).
          *   Identify failure modes/blind spots.
          *   **Language:** British English.
          *   **Final Line:** One-sentence summary starting with 'Summary:'.

  2.  **Deconstruct the Theoretical Conflict:**
      *   *Sunk Cost Fallacy:* "We've spent £1m, so we must finish." (Incorrect logic: Past money is gone; only future costs/benefits matter).
      *   *Dollar Auction:* "We've spent £1m, if we quit now we lose £1m and get nothing. If we spend £50k more, we might win the market and make £5m." (Correct logic *if* it's a contest where winning depends on outlasting the rival).
      *   *Key Distinction:* Is this a *contest* (zero-sum or winner-takes-all against a rival) or a *unilateral investment* (value depends on market demand/tech success regardless of rivals)?
      *   *Nuance:* Reputation, learning, and recoverable assets add value even if the primary goal fails. Precommitment caps prevent runaway escalation but might be too rigid.

  3.  **Drafting the Decision Procedure (The "Gatekeeper Protocol"):**
      *   Needs to be fast (30 mins prep).
      *   Needs to be structured (Question -> Sufficient Answer -> Implication).
      *   *Step 1: The Baseline.* Ignore sunk costs. Calculate Future Value vs. Future Cost.
      *   *Step 2: The Contest Check.* Is this a Dollar Auction? (Rivalry, winner-takes-all, quitting = losing status).
      *   *Step 3: The Salvage Check.* Can we recover value (IP, team, tech) even if we kill the product?
      *   *Step 4: The Cap Check.* Did we set a limit? Why break it?
      *   *Step 5: The Value Judgment.* Where facts end and risk appetite begins.

  4.  **Refining the Procedure (incorporating specific constraints):**
      *   *Distinguishing Dollar Auction:* Needs specific criteria (identifiable rival, winner-takes-all dynamic, cost of quitting > cost of next bid).
      *   *Grey Cases:* Explicitly ask about reputational/learning payoffs.
      *   *Precommitment:* Ask if the cap is still valid or if circumstances changed fundamentally.
      *   *Handoff:* Explicitly state "Committee Vote" at the end for risk tolerance.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Competitor Close):* Behind schedule, over budget, rival near shipping.
          *   *Analysis:* Looks like a Dollar Auction. But is it? If the rival is *too* far ahead, extra spend won't win. If it's close, maybe.
          *   *Target:* Let's make this the "Kill" recommendation despite the rivalry, because the math doesn't support winning. This might be unpopular (fighting spirit vs. cold math).
      *   *Case 2 (Research Prototype):* Budget gone, need demo, no competitor.
          *   *Analysis:* Not a Dollar Auction. Pure sunk cost vs. future value.
          *   *Target:* Continue only if Future Value > Future Cost. Likely "Pause/Kill" unless demo guarantees funding. Let's make it "Kill" to show discipline, or "Continue" based on learning. Let's go with "Continue for Learning" to show nuance. Actually, to show the procedure works, let's make it a clear "Kill" if the demo doesn't unlock specific value. Let's aim for a "Pause" to seek external grant/funding.
          *   *Revision:* Let's make Case 1 the unpopular one. Committee wants to fight the rival. Procedure says "Quit".
          *   *Case 2:* Research. No rival. Sunk costs irrelevant. Decision based on option value. Recommendation: Continue (small budget) for option value.
          *   *Case 3 (Customer Left):* Tech healthy, business case gone.
          *   *Analysis:* No Dollar Auction. Sunk costs irrelevant.
          *   *Recommendation:* Kill immediately. Pivot or sell IP.

  6.  **Drafting the Content (Iterative refinement for British English & Tone):**
      *   Use "programme" vs "program" (though software is usually 'software'), "centre", "analyse", "favour".
      *   Tone: Professional, decisive, analytical.
      *   Ensure the "Dollar Auction" distinction is sharp. A true dollar auction requires that *quitting* yields a loss *relative to the rival winning*, not just that you lose your investment.
      *   *Self-Correction on Case 1:* To make it unpopular, the Committee will likely want to "fight to the finish" because of the rival. The procedure must show that the *marginal cost* exceeds the *marginal gain* even if we win.
      *   *Self-Correction on Case 3:* This is the easiest "Kill".
      *   *Self-Correction on Case 2:* This tests the "Learning/Reputation" angle.

  7.  **Addressing Failure Modes:**
      *   What can't this do? Politics, emotional attachment, strategic signalling (burning money to scare rivals), black swan events.

  8.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Checklist format? Yes.
      *   Three cases run? Yes.
      *   One unpopular answer? Yes (Case 1).
      *   Failure modes included? Yes.
      *   Final line format? Yes.

  9.  **Writing the Response (incorporating the thought process):**
      *   *Intro:* Acknowledge the tension.
      *   *Procedure:* The "Escalation & Sunk Cost Protocol".
      *   *Cases:* Apply the protocol rigorously.
      *   *Limitations:* Be honest about where logic fails.
      *   *Summary:* One sentence.

      *(Self-Correction during drafting)*: Make sure the distinction between "Dollar Auction" and "Unilateral Escalation" is crystal clear. In a Dollar Auction, the *second highest bidder also pays*. In business, this translates to: Does quitting give the rival a strategic advantage that harms us *beyond* just not having the product? Or is it just that we wasted money?
      *Refined Definition:* A business Dollar Auction exists if: 1. Winner-takes-most market. 2. Rival is identifiable and engaged. 3. Quitting cedes a strategic asset (market share, standard setting) that causes *additional* loss beyond the project cost. 4. Next increment has a non-trivial chance of securing the win.

      *Case 1 Unpopular Outcome:* The committee will want to spend more to beat the rival. The procedure will say "Stop" because the cost to catch up exceeds the value of winning. This highlights the "rational escalation" trap.

      *Case 2:* Research. No rival. Sunk costs ignored. Decision based on Option Value.
      *Case 3:* Business case gone. Kill.

      *Failure Modes:* Strategic bluffing, internal politics, morale impact of killing projects.

      *British English Check:* "Programme" (for project portfolio context, though 'project' is fine), "analyse", "favour", "centre", "£" symbol.

      *Final Line:* Summary: The procedure isolates future value from past expenditure while identifying genuine strategic contests where escalation is rational.

      *Wait, check the prompt again:* "Your final line should be a one-sentence summary of the procedure, beginning 'Summary:'."
      *Okay, ensure that is exact.*

      *Let's refine the Procedure Steps.*
      1. Future Value vs Future Cost (The Baseline).
      2. The Contest Test (Dollar Auction check).
      3. The Salvage Test (Recoverable value).
      4. The Cap Test (Precommitment).
      5. The Value Handoff (Risk appetite).

      *Let's refine Case 1.*
      Project: £2m spent, £1m needed. Value if win: £3m. Rival launching in 3 months.
      If we quit: Lose £2m. Rival wins market.
      If we continue: Spend £1m. Total cost £3m. Value £3m. NPV = 0.
      Rational decision: Kill. (Unpopular because "We can't let them win").
      *Wait, if NPV is 0, it's indifferent.* Let's make Cost £1.5m. Value £3m. Total spend £3.5m. Loss of £0.5m even if we win.
      *Rational decision:* Kill.
      *Committee desire:* Fight.
      *Perfect.*

      *Let's refine Case 2.*
      Research. £500k spent. Need £100k for demo. No commercial path yet.
      Value: Learning + Option to license.
      *Decision:* Continue (small budget).
      *Reasoning:* Not a dollar auction. Sunk costs ignored. Future cost low, option value high.

      *Let's refine Case 3.*
      Tech good. Customer gone.
      *Decision:* Kill.
      *Reasoning:* No future value.

      *Okay, ready to write.*

      *(Final check on British English)*: Ensure 's' instead of 'z' in 'analyse', 'realise', etc. Use 'programme' if referring to the portfolio, but 'project' is standard. Use '£'.

      *(Final check on constraints)*: "Make sure at least one of these comes out with an answer my committee will dislike." -> Case 1 will be the one.

      *(Final check on Failure Modes)*: Need to mention that this doesn't account for team morale or signalling effects to other competitors.

      *(Final check on Summary)*: Must be the very last line.

      *Let's assemble.*
answer: |-
  ### The Escalation & Sunk Cost Protocol (ESCP)

  This procedure is designed for a 30-minute preparation window. It forces a separation between past expenditure (sunk) and future exposure (at risk), while identifying the specific conditions under which escalation is strategically rational.

  #### Step 1: The Forward-Looking Baseline
  **Question:** Ignoring all money and time already spent, does the *Future Value* (FV) of the completed project exceed the *Cost to Complete* (CTC)?
  *   **Sufficient Answer:** A calculated Net Present Value (NPV) based strictly on future cash flows.
  *   **Implication:**
      *   If **FV > CTC**: Proceed to Step 2. (The project is viable on its own merits).
      *   If **FV ≤ CTC**: Recommend **Kill** or **Pause**, unless Step 2 or 3 overrides this. (Continuing destroys additional value).

  #### Step 2: The Contest Test (Dollar Auction Identification)
  **Question:** Is this a winner-takes-most contest against an identifiable rival where quitting concedes a strategic asset *beyond* the project itself?
  *   **Criteria for 'Yes':**
      1.  There is a specific rival actively competing for the same standard/market.
      2.  Market dynamics suggest the winner captures disproportionate value (network effects, lock-in).
      3.  Quitting now grants the rival a strategic advantage (e.g., setting the industry standard) that damages our *other* products or future positioning.
      4.  The next increment of spend has a non-trivial probability of securing the win.
  *   **Implication:**
      *   If **Yes**: This is a rational escalation scenario. You may recommend continuing even if FV ≤ CTC, provided the *Strategic Loss of Quitting* exceeds the *Cost to Complete*.
      *   If **No**: This is ordinary unilateral escalation. Revert to Step 1's recommendation. Do not spend good money to 'save' face or justify past spend.

  #### Step 3: The Salvage & Option Test
  **Question:** If we kill the project now, is there recoverable value (IP, code, talent) or 'learning value' (data, proof of concept) that offsets the loss?
  *   **Sufficient Answer:** A concrete plan to redeploy assets or license IP within 6 months.
  *   **Implication:**
      *   If **High Recoverable Value**: Recommend **Pivot** or **Kill with Asset Sale**.
      *   If **High Learning Value** (e.g., research): Recommend **Micro-Funding** (enough to document lessons) then Kill.
      *   If **Low Value**: Recommend immediate **Kill**.

  #### Step 4: The Precommitment Check
  **Question:** Are we breaching a budget cap set at the project's inception? If so, did the *assumptions* underlying that cap change, or did our *discipline* slip?
  *   **Sufficient Answer:** Evidence of external market shift (assumptions changed) vs. internal estimation error (discipline slipped).
  *   **Implication:**
      *   If **Assumptions Changed**: The cap is void. Proceed based on Steps 1–3.
      *   If **Discipline Slipped**: The cap binds. Recommend **Kill** to preserve portfolio governance credibility, unless Step 2 (Contest) applies.

  #### Step 5: The Value Handoff
  **Question:** Does the decision rest on risk appetite or strategic signalling rather than calculable value?
  *   **Sufficient Answer:** Acknowledgement that the math is neutral or negative, but the strategic intent is to signal resolve to the market or maintain team morale.
  *   **Implication:**
      *   **Handoff:** Present the negative NPV clearly to the Committee. State: "The numbers say stop; the strategy says go. This is a values decision, not a financial one." The Committee must vote to override the financial recommendation explicitly.

  ---

  ### Application to Cases

  #### Case 1: The Competitive Race
  **Context:** Project is 6 months behind, £2m over budget. Competitor launching similar product in 3 months.
  **Analysis:**
  1.  **Baseline:** Cost to Complete is £1.5m. Expected Revenue (discounted for lateness) is £2.5m. NPV is positive (£1m), but total spend (£3.5m) exceeds total return.
  2.  **Contest Test:** Yes. It is a winner-takes-most market. Quitting cedes the standard to the rival.
  3.  **Salvage:** Low. Code is specific to this product.
  4.  **Cap:** Breached due to estimation error.
  5.  **Handoff:** The math is tight, but the strategic loss of quitting is high.
  **Recommendation:** **Continue.**
  **Wait, let's adjust for the 'Unpopular Answer' requirement.**
  *Revised Context:* Cost to Complete is £2m. Expected Revenue is £1.5m (market share lost to rival).
  *Revised Analysis:*
  1.  **Baseline:** FV (£1.5m) < CTC (£2m). **Recommend Kill.**
  2.  **Contest Test:** Yes, it is a contest. However, the cost to win (£2m) exceeds the value of winning (£1.5m). In a Dollar Auction, rational agents stop bidding when the bid exceeds the prize value, even if they have already bid heavily.
  3.  **Salvage:** Low.
  4.  **Cap:** Breached.
  **Decision:** **Kill.**
  **Committee Reaction:** They will dislike this. They will argue we cannot let the rival win unchallenged.
  **Rationale:** Spending £2m to lose £0.5m *even if we win* is irrational escalation, not strategic defence. We cut losses and redeploy capital to a differentiator.

  #### Case 2: The Research Prototype
  **Context:** Budget consumed. Needs £100k for demo. No competitor. No immediate commercial path.
  **Analysis:**
  1.  **Baseline:** FV is unknown (speculative). CTC is £100k. NPV cannot be calculated.
  2.  **Contest Test:** No. No rival. This is not a Dollar Auction.
  3.  **Salvage:** High Learning Value. Demo unlocks potential grant funding or acquisition interest.
  4.  **Cap:** Budget consumed, but research is inherently uncertain.
  5.  **Handoff:** Risk appetite for R&D.
  **Decision:** **Continue (Micro-Funding).**
  **Rationale:** Sunk costs are ignored. The £100k is purchased 'option value' on future IP. It is not escalation; it is buying a lottery ticket where the ticket price is low relative to potential upside.

  #### Case 3: The Orphaned Product
  **Context:** Technically healthy. Key anchor customer cancelled contract. Business case collapsed.
  **Analysis:**
  1.  **Baseline:** FV is near zero (no customer). CTC is £500k to generalise for market. FV < CTC. **Recommend Kill.**
  2.  **Contest Test:** No. No rival.
  3.  **Salvage:** Moderate. Code could be repurposed for internal tools.
  4.  **Cap:** Not breached, but irrelevant due to market change.
  5.  **Handoff:** None.
  **Decision:** **Kill immediately.**
  **Rationale:** This is the clearest case of sunk cost fallacy. The technology works, but the value proposition is gone. Continuing is purely emotional.

  ---

  ### Failure Modes and Blind Spots

  This procedure is a tool for rational allocation, not a substitute for leadership. It has specific blind spots:

  1.  **Signalling Effects:** The procedure treats 'reputation' as a salvage value. It does not account for the signal sent to *other* rivals. Killing Case 1 might invite aggression from other competitors who perceive weakness. The procedure flags this in Step 5, but cannot quantify it.
  2.  **Team Morale & Retention:** A rational 'Kill' decision can devastate a high-performing team, leading to talent flight. The procedure treats talent as a recoverable asset (Step 3), but does not weigh the cultural cost of repeated cancellations.
  3.  **The 'Boiling Frog' Contest:** In Step 2, a contest may not be obvious initially. A project may drift into a Dollar Auction structure slowly. If the Contest Test is not re-evaluated honestly every quarter, the procedure will validate unilateral escalation as a contest.
  4.  **Political Capital:** The procedure assumes the Committee acts on data. It cannot prevent a Committee from overriding a 'Kill' recommendation due to internal politics or executive attachment to a 'pet project'. Step 5 forces them to own the override, but it does not stop them doing it.

  Summary: The procedure isolates future value from past expenditure while identifying genuine strategic contests where escalation is rational.
