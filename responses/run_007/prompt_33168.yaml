prompt: |-
  A friend and I just spent the evening arguing about whether utilitarianism can take the boundaries between persons seriously; he kept insisting that the separateness of persons objection is just a distributive complaint in disguise, and I left unsure whether he was right. Suppose I'm a philosophy PhD student with about three years to work on the objection and its implications for consequentialism. Which two or three open questions should I prioritize, and in what order? I'm weighing these: whether the objection is just the distributive complaint that utilitarianism ignores how well-being is distributed across lives, or something distinct about why aggregating across persons is objectionable in itself; whether distribution-sensitive consequentialisms such as prioritarianism can absorb the objection, or whether only non-aggregative, deontological views can; whether the objection's force depends on a particular view of personal identity over time; and whether it has practical consequences for how institutions should trade off harms and benefits across people. I want a defended agenda, not a survey: for each question, say why it is upstream of the others, how tractable it is for someone working with concepts and cases rather than empirical or legal material, and what result over the next few years would raise or lower its priority. Please also say how confident you are in what you claim, and single out the point you are least sure of.
