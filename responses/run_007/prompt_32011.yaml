      *   **Goal:** Create a specification (a set of requirements) to test theories of the "units of selection" debate.
      *   **Task:** Write precisely the requirements an adequate theory must meet (phenomena, cases, distinctions, consistency).
      *   **Mandatory Test Cases:** Segregation distorters, transposable elements, cancer, eusocial colonies, species-level traits (range/extinction).
      *   **Mandatory Distinctions:** Replicators vs. Vehicles vs. Interactors; Selection *of* vs. Selection *for*; Levels vs. Units; Genuine Group Adaptation vs. Statistical Side Effect.
      *   **Theoretical Constraints:** Price Equation decomposition (within/between), Major Transitions in Individuality.
      *   **Classification:** Mark requirements as Non-Negotiable vs. Camp Preference. Identify incompatibilities (trade-offs).
      *   **Scorecard:** Evaluate Genic Selectionism, Multilevel Selection (MLS), and Replicator/Interactor frameworks against the list.
      *   **Self-Critique:** Identify the weakest requirement, what would change the verdict, and what would force adding a new one.

  2.  **Deconstruct the "Units of Selection" Debate:**
      *   This is a foundational debate in evolutionary biology/philosophy of biology.
      *   Key players: Dawkins (Selfish Gene), Williams (Adaptation and Natural Selection), Gould/Lewontin (Hierarchy), Okasha (Evolution and the Levels of Selection), Godfrey-Smith (Darwinian Populations).
      *   Core tension: Is the gene the *only* real unit, or can higher levels (cells, organisms, groups, species) be genuine units of selection/adaptation?
      *   Formal tool: The Price Equation is the standard mathematical arbiter.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Empirical Coverage.* Must explain the mandatory test cases.
          *   *Case:* Segregation distorters (gene-level selfishness).
          *   *Case:* Cancer (cell-level selfishness within organism).
          *   *Case:* Eusociality (colony-level functionality).
          *   *Case:* Species sorting (macroevolution).
      *   *Requirement 2: Conceptual Distinctions.*
          *   Replicator/Interactor/Vehicle (Hull/Dawkins).
          *   Selection *of* (entity survives) vs. *for* (trait causes survival) (Sober).
          *   Levels (causal process) vs. Units (entity benefiting).
          *   Adaptation vs. Byproduct (Spandrels).
      *   *Requirement 3: Formal Consistency.*
          *   Price Equation partitioning (covariance terms).
          *   Major Transitions (suppression of lower-level conflict).
      *   *Requirement 4: Causal Specificity.*
          *   Must identify *what* is actually being selected, not just what correlates.

      *Refining the Requirements for Precision:*
      *   Need to make them look like a spec sheet. "REQ-01", "REQ-02", etc.
      *   Need to assign the "Non-Negotiable" vs. "Preference" tags carefully. This is tricky because much of the debate *is* about what is non-negotiable. I need to take a stance as a neutral arbiter constructing the test, or acknowledge the philosophical fault lines. The prompt asks me to be self-critical, so I should aim for a robust, consensus-seeking list but acknowledge where consensus breaks.

  4.  **Addressing Specific Distinctions:**
      *   *Replicator/Vehicle/Interactor:* Crucial for separating heredity from fitness.
      *   *Of vs. For:* Crucial for avoiding tautology.
      *   *Levels vs. Units:* Crucial for distinguishing process from beneficiary.
      *   *Adaptation vs. Side Effect:* Crucial for avoiding Panglossianism.

  5.  **Addressing Theoretical Constraints:**
      *   *Price Equation:* Any theory must map onto the covariance partitions ($Cov(w, z)$).
      *   *Major Transitions:* Must explain how lower-level selection is suppressed to allow higher-level individuality (Michod's work).

  6.  **Developing the Incompatibilities (Trade-offs):**
      *   Parsimony vs. Pluralism. (Gene-only is parsimonious but might obscure higher-level causality).
      *   Causal Process vs. Beneficiary. (Who gets the fitness credit?)
      *   Synchronic vs. Diachronic. (Is a unit defined by current selection or evolutionary history?)

  7.  **Drafting the Scorecard:**
      *   *Genic Selectionism:* Strong on distorters/transposons, weak/awkward on eusociality/species sorting (requires translation).
      *   *MLS:* Strong on eusociality/species sorting, needs care to avoid group selectionist fallacies on distorters.
      *   *Replicator/Interactor:* Good conceptual clarity, but sometimes hard to map to empirical cases (e.g., what is the replicator in species sorting?).

  8.  **Self-Critique Section:**
      *   Which requirement is weakest? Probably the "Genuine Group Adaptation" distinction. It's notoriously hard to define rigorously without circularity.
      *   What would change the verdict? A formal proof that group adaptation is mathematically reducible to gene selection without remainder (or vice versa).
      *   What would add a requirement? Discovery of non-genetic inheritance systems that function exactly like genes but aren't DNA (epigenetics/culture) challenging the "Replicator" definition.

  9.  **Review and Refine:**
      *   *Tone:* Precise, philosophical but grounded in biology.
      *   *Checklist:* Did I include all mandatory cases? Yes. All distinctions? Yes. Price Equation? Yes. Major Transitions? Yes. Scorecard? Yes. Self-critique? Yes.
      *   *Constraint Check:* "Mark each requirement as non-negotiable or as a preference." I need to be careful here. Calling something "non-negotiable" in this debate is controversial. I will frame "Non-Negotiable" as "Required for empirical adequacy" and "Preference" as "Metaphysical/Heuristic stance."
