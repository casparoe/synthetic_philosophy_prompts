  10. **Final Polish:** Ensure clear headings and logical flow. (Self-Correction: Make sure the distinction between "Levels of Selection" and "Units of Selection" is crisp, as this is often confused.)

  *(Self-Correction during drafting)*: I initially thought about marking "Gene as unique replicator" as a preference. But Dawkins would call it non-negotiable. Williams would too. Gould would call it a preference. I must adjudicate this as a *specification for a theory*, not a verdict on truth. So, a theory *must be able to account for* gene-level phenomena, but doesn't *have to claim* the gene is the only unit. I will frame the requirements as conditions of adequacy, not ontological commitments.

  *(Refining the "Incompatibilities" section)*: Mathematical equivalence (Price Equation) suggests no formal incompatibility. The incompatibility is heuristic and explanatory. I need to make sure this nuance is clear. A single theory *can* satisfy the math, but might fail the "explanatory privilege" test.

  *(Refining Self-Critique)*: Be honest. The "Adaptation vs. Side Effect" requirement is the hardest to operationalize.

