  The principle I commit to is the **Knowledge Norm of Assertion (KNA)**:

  > **Assert $p$ only if you know $p$.**

  This is the dominant view in contemporary epistemology (championed by Timothy Williamson and others) because it best explains the specific constraints on assertion that other norms (like Truth or Justified Belief) fail to capture. However, to make this principle work, we must refine your verdicts on cases (3) and (5). Specifically, **Verdict (5) must be rejected** in its strict form, and **Verdict (3) must be reframed**.

  Here is how the Knowledge Norm handles your cases, the necessary trade-offs, and the resolution of the Advisor case.

  ### 1. Application to Your Cases

  *   **(1) Lottery (Not Okay):** **Fits KNA.** You do not *know* the ticket is a loser based solely on odds. No matter how high the probability, statistical evidence alone does not yield knowledge (this is the classic "Lottery Paradox"). Since you don't know, you shouldn't assert.
  *   **(2) Moore's Paradox (Not Okay):** **Fits KNA.** You cannot know the conjunction "It is raining but I don't know it." If you know it's raining, the second conjunct is false; if you don't know it, the first conjunct cannot be known. Assertion represents knowledge; this sentence represents a lack of it.
  *   **(3) Teacher (Okay):** **Reframed to Fit KNA.** Strictly speaking, if she asserts "Humans evolved" while disbelieving it, she violates the norm. However, in a professional context, she is not asserting *her* knowledge but conveying the **consensus of the field**. She *knows* that "established biology holds that humans evolved." The assertion is proper because she knows the *status* of the proposition within the curriculum, even if she lacks personal belief.
  *   **(4) Guess (Not Okay):** **Fits KNA.** A guess, by definition, lacks knowledge. Even if true, the assertion was improper because the speaker lacked the requisite epistemic state.
  *   **(5) Train (Okay):** **Rejected/Refined.** This is the trade-off. Under KNA, this assertion was **improper** because you did not *know* the time (the proposition was false). However, it was **excusable**. You satisfied the *duty of diligence* even if you failed the *norm of truth*.

  ### 2. Defending the Trade-Off

  Why reject your intuition on the Train case (5) to save the principle?

  Because keeping (5) as "Proper" makes it impossible to explain why (1) is "Improper." In both cases, you have strong, fallible evidence. In the Train case, you relied on a schedule (authority/testimony). In the Lottery case, you relied on odds (statistics).
  *   If "Strong Fallible Evidence" makes assertion okay, then the Lottery assertion should be okay (99.9999% chance). But you correctly feel it is not.
  *   The only relevant difference is that schedule evidence is the *kind* of evidence that typically yields **knowledge**, whereas lottery odds are the *kind* of evidence that **never yields knowledge** (until the draw).
  *   Therefore, the norm must be Knowledge, not just Evidence. If we lower the norm to "Reasonable Belief" to save the Train case, we lose the explanation for the Lottery case. It is philosophically cheaper to classify the Train case as "Blameless Improperity" than to weaken the norm so much it fails to explain the Lottery intuition.

  **The Distinction:** We must distinguish between **Propriety** (satisfying the norm) and **Excusability** (not being blameworthy for violating it).
  *   **Train Case:** Improper (you didn't know), but Excusable (you did your due diligence).
  *   **Lottery Case:** Improper (you didn't know), and Less Excusable (you relied on mere statistics when specific knowledge was possible in principle).

  ### 3. The Advisor Case

  > *An advisor tells a client "this fund is safe" on the basis of a careful analysis that misses a hidden risk, and the fund collapses.*

  **Verdict:** This is like the **Train Case**.

  *   **Epistemic Status:** The advisor did not *know* the fund was safe (since it wasn't). Strictly speaking, under KNA, the assertion was **improper**.
  *   **Practical Status:** The advisor is **excusable**. They undertook context-appropriate due diligence ("careful analysis"). The risk was "hidden," meaning it was not part of the available evidence that would generate knowledge.
  *   **Implication:** While the assertion violates the epistemic norm (it was false and unknown), the advisor is not epistemically *negligent*. They are in the same position as the train informant: they satisfied the secondary duty of diligence, even if they failed the primary norm of knowledge.

  ### Summary

  *   **Principle:** Assert $p$ only if you know $p$.
  *   **Rejected Verdict:** (5) Train. It was not "okay" (proper), but it was "blameless" (excusable).
  *   **Reframed Verdict:** (3) Teacher. She asserts knowledge of the *curriculum's claim*, not personal fact.
  *   **Advisor Case:** Improper but excusable (like the Train).

  This trade-off is worth it because it preserves the crucial distinction between **statistical probability** (Lottery) and **evidential support** (Train/Advisor). Only the Knowledge Norm explains why high probability isn't enough for the lottery, while acknowledging that diligence protects you from blame when the world changes unexpectedly (Train/Advisor).
