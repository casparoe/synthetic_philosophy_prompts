      *   *Correction/Refinement:* The essay is written from the perspective of someone in a society where "white" is the generic term for human (like "man" is in ours). The reformers want to replace "white" with "person" (like we replace "man" with "person"). The narrator finds this absurd.
      *   *The Point:* By making the reader feel the absurdity of removing "white" as the generic, Hofstadter forces the reader to realize how absurd it *should* feel to remove "man" as the generic. It exposes the invisibility of male default.
      *   *The Conclusion:* Hofstadter is *not* arguing against language reform generally. He is arguing *for* gender-neutral language by showing the hypocrisy of resisting it while accepting racial neutrality (or rather, by showing how entrenched the male default is). He is definitely *not* suggesting we should be skeptical of reform projects because they just swap defaults. He is advocating for the specific reform of removing male-centric language.

