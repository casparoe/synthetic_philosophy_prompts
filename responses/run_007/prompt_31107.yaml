  2.  **Analyze the Source Text (Hofstadter's "A Person Paper on Purity in Language"):**
      *   *What is it?* A satirical essay where Hofstadter adopts the persona of a white supremacist ("William Satire," a pun on William Safire) arguing *against* gender-neutral language by comparing it to a hypothetical scenario where race-neutral language is enforced.
      *   *The Mechanism:* He creates a parallel universe where "white" is the marked term and "person" is the default, or rather, where "white" is treated the way "man" is treated in our world. Wait, let's look closer.
