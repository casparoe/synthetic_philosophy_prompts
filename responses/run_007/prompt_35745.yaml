answer: |-
  This is a classic philosophical puzzle, often referred to as the "Paradox of Promising." You have reconstructed a version of an argument that has troubled philosophers from Hume to Rawls to Scanlon. The fact that you are stuck in this trilemma suggests you are thinking about it with rigor, but the argument contains a structural flaw in how it categorizes the sources of obligation.

  The mistake lies primarily in **Premise (2)** and the interpretation of **Candidate (b)** in Premise (4).

  Here is the breakdown of where the argument fails, how to save the "Will View" (which you prefer), and what you must accept to do so.

  ### 1. The Mistake in Premise (2): A False Trilemma
  Your argument assumes that the three candidates are mutually exclusive rivals—that the obligation must arise *either* from expectations, *or* from will, *or* from practice.

  Most contemporary accounts of promising argue that these are not competitors, but **interdependent components** of a single normative phenomenon.
  *   **Practice** provides the *mechanism* (the convention that allows words to create duties).
  *   **Will** provides the *trigger* (the voluntary uptake of that mechanism).
  *   **Expectations** provide the *point* (the reason we value the mechanism).

  By treating them as rivals, you force each to do too much work. A robust theory of promising usually combines them. However, since you are inclined toward the **Will View (b)**, let's focus on how to defend that specifically, because the critique you offered against it relies on a specific misunderstanding of what "Will" means in this context.

  ### 2. Saving the Will View (Candidate b)
  Your critique in Premise (4) is: *If obligation depends on my will, I can escape it by claiming I didn't sincerely intend it.*

  This critique assumes a **Psychological Conception of Will**. It treats the "act of will" as a private, internal mental state (like feeling determined or hoping to follow through). If obligation rests on a private feeling, then yes, you can lie about the feeling to escape the obligation.

  **The Defense:**
  To save the Will View, you must shift to a **Normative Conception of Will**. This is the view championed by legal theorists like H.L.A. Hart and philosophers like Joseph Raz.

  On this view, promising is not about reporting your internal psychology; it is about **exercising a normative power**. When you say "I promise," you are not describing your mind; you are performing a public act that alters your normative landscape. You are invoking a social convention that allows you to bind yourself.

  **How this solves the "Fingers Crossed" problem:**
  If I promise with my fingers crossed, I have still *exercised the power*. I have invoked the convention. The obligation does not arise from my private sincerity, but from my **public assumption of obligation**.
  *   **The Cost:** To accept this, you must admit that the "Will" is not sovereign. You cannot simply will an obligation into existence in a vacuum. You can only exercise this power because a social context exists that recognizes it.
  *   **The Concession:** This means the Will View *cannot* stand entirely alone. It implicitly relies on Candidate (c) (Social Practice) to provide the framework within which the Will operates. You must accept that **the Will creates the obligation, but the Practice creates the Will's power to do so.**

  If you accept this hybrid "Normative Will" view, Premise (4) collapses. You are bound not because you *felt* bound, but because you *represented* yourself as bound, and you had the normative power to make that representation stick.

  ### 3. Addressing the Other Candidates (For Completeness)
  Even if you stick with the Will View, it helps to see why the other two critiques are also surmountable, further suggesting Premise (2) is the weak link.

  *   **Against (3) Expectations:** T.M. Scanlon (in *What We Owe to Each Other*) offers a refinement. It is not *mere* expectations that bind us (which would overgenerate). It is expectations **invited by a specific assurance** that it would be wrong to disappoint. This distinguishes a promise from a prediction. If I say "I intend to come," I create an expectation. If I say "I promise to come," I invite you to hold me accountable. The obligation comes from the wrong of manipulating that trust, not the reliance itself.
  *   **Against (5) Practice:** The critique here confuses the *justification* of the practice with the *detection* of a breach. A Rule Utilitarian would argue that the obligation exists because the *rule* ("keep promises") is valuable, not because *this specific breach* causes damage. Deathbed promises bind because the practice covers them, not because the dead person will suffer or the practice will visibly crumble. The obligation is to the *person*, justified by the *practice*.

  ### 4. Resolving Your Specific Dilemma
  You mentioned you broke a promise to keep a secret because you felt an obligation to disclose. Even if we solve the philosophical puzzle, you still need to know if you did wrong.

  The solution to the trilemma suggests that promissory obligations are **prima facie** (binding at first glance), not **absolute**.

  1.  **The Obligation Exists:** By making the promise, you exercised a normative power and invited your friend's trust. You incurred a genuine obligation.
  2.  **The Obligation Can Be Overridden:** Moral obligations often conflict. If the secret involved harm to others, a danger to life, or a significant injustice, the obligation to prevent harm likely outweighs the obligation to keep the secret.
  3.  **The Residue:** Even if breaking the promise was the *right all-things-considered action*, it does not mean the promise wasn't binding. It means it was **overridden**. This is why you feel guilt. You did a *pro tanto* wrong (a wrong in that specific respect) to achieve a greater good.

  ### Summary of the Fix
  To locate the mistake in your argument:
  1.  **Reject Premise (2):** The candidates are not mutually exclusive. The Will requires a Practice to function.
  2.  **Revise Premise (4):** The "Will" is a normative power, not a psychological state. Insincerity does not negate the exercise of the power.
  3.  **Accept the Cost:** To save the Will View, you must admit that your will is only effective because of a background social convention (conceding some ground to Candidate c).

  **What you commit yourself to:**
  If you keep Candidate (b) as your primary intuition, you are committing to the idea that **human beings have the special capacity to alter their moral landscape through voluntary action.** But you must accept that this capacity is not magic; it is a tool provided by the social world. You are bound by your promise not because you "felt like it," but because you voluntarily stepped into a role that carries duties, regardless of your private reservations at the time.

  You did wrong to break the promise *in the strict sense* that you violated a duty you voluntarily undertook. But you may have been right to break it *in the moral sense* that a higher duty demanded it. The tension you feel is the recognition of that conflict, not evidence that promising is incoherent.
