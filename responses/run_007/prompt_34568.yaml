answer: |-
  This is one of the most famous and unsettling problems in moral philosophy. Your friend has essentially reconstructed Galen Strawson's "Basic Argument" for hard incompatibilism, mixed with Thomas Nagel's problem of "Moral Luck."

  The reason it feels unbreakable is that it is logically valid *if* you accept a very specific, very strict definition of "control."

  To answer your specific question: **Yes, there is a sleight of hand.** It happens between **Premise (4) and Premise (5)**.

  Here is how you can diagnose the break, keep Premise (1), and avoid the insane conclusion (7), along with the costs of doing so.

  ### 1. Identify the Sneak: Two Different Types of Luck
  The argument conflates two distinct problems to force the nihilistic conclusion.

  *   **Steps (2)–(4) deal with *Resultant Luck*:** This is luck in how your actions turn out. (I texted, but did a kid happen to be there?)
  *   **Steps (5)–(6) deal with *Constitutive Luck*:** This is luck in who you are. (I am the kind of person who texts while driving because of my genes/upbringing.)

  The argument works by saying: *"Since you can't control the kid (Resultant), and you can't control your genes (Constitutive), you control nothing."*

  **The Break:** You can accept that we shouldn't blame people differently for *Resultant Luck* (the kid appearing) without accepting that we can't blame people for *Constitutive Luck* (the choice to text).

  ### 2. How to Keep Premise (1) Without Accepting (7)
  You said you want to keep **(1) "You can only be blamed for something if you had control over it."** You absolutely can. You just need to refine what "control" means. This is the **Compatibilist** solution.

  **The Fix:**
  Premise (5) claims: *"The choice itself came from how impulsive... they are, which came from genes... they never chose."*
  This assumes that to have control, you must be the **Ultimate Originator** of your own character. You must have chosen your own genes and parents to truly be responsible.

  **The Counter:**
  "Control" in ethics doesn't mean "Metaphysical First Cause." It means **"Guidance Control."**
  *   Did the driver's action flow from their own desires and reasoning? Yes.
  *   Was anyone holding a gun to their head forcing them to text? No.
  *   Were they coerced? No.

  If the action comes from *you* (your brain, your desires), you have control, even if *you* were shaped by things you didn't choose.

  **The Cost:**
  You have to admit that "free will" isn't magic. You have to accept that the driver *could not have done otherwise* given the exact state of the universe, but they are still responsible because the action was *theirs*. You are redefining "control" from "could have done otherwise in any universe" to "acted according to my own will without coercion."

  ### 3. Alternative: Attack Premise (4) (The Moral Luck Solution)
  If you don't like redefining control, you can attack the observation in **(4)**.

  **The Argument:**
  Premise (4) says: *"We do blame them differently... one gets called a killer... the other just gets a ticket."*
  This is an observation of *legal practice*, not necessarily *moral truth*.

  **The Counter:**
  You can argue that **our current legal system is wrong.** Morally, both drivers are equally blameworthy. They both imposed the same unjustified risk on the public. The fact that one is in prison and one isn't is a tragedy of the legal system, not proof of a metaphysical paradox.

  **The Cost:**
  This is actually a great Ethics Bowl position! You argue that the law *should* punish based on reckless endangerment (the text), not based on the outcome (the death). This keeps (1) and avoids (7), but it requires you to argue that the driver who killed the kid is being treated unfairly by the justice system (punished too harshly), while the driver who didn't is getting off too easy.

  ### 4. Alternative: Attack the Definition of "Blame" in (1)
  If you want to be radical, you can change the function of blame.

  **The Argument:**
  Premise (1) assumes blame is **Retributive** (you blame because they deserve pain for past actions).
  But what if blame is **Consequentialist** (you blame to shape future behavior)?

  **The Counter:**
  We blame the driver not because they are "evil deep down," but because labeling their action as "wrong" creates a social norm that saves lives. We hold them responsible because doing so *works*, not because they had metaphysical control.

  **The Cost:**
  You have to give up the idea of "just deserts." You are treating the driver as a means to social safety. Some find this dehumanizing.

  ### Summary for Your Team
  Your friend's argument is valid *only if* you accept that "Control" requires "Ultimate Origination" (being the god of your own soul).

  **To win this in Ethics Bowl:**
  1.  **Keep Premise (1).** It is too intuitive to drop.
  2.  **Reject the inference in (5).** Argue that we are responsible for actions that flow from our character, even if we didn't choose our character. (Compatibilism).
  3.  **Distinguish Risk from Outcome.** Argue that the *moral* blame is the same for both drivers (they both took the risk), even if the *legal* consequences differ due to the harm caused.

  **The "Soundbite" Rebuttal:**
  >"The argument assumes that to be responsible for my choices, I must have chosen my own parents and genes. But responsibility isn't about being the first cause of the universe; it's about being the author of the action. The driver authored the text message. That is enough control for blame, even if luck decided whether a kid was there to be hit."

  This allows you to keep your intuition that the driver is responsible, without falling into the trap that *nothing* is anyone's fault.
