      *   **Specific Tasks:**
          1.  List what an account must explain (cases, distinctions, empirical results).
          2.  Provide the rationale/case behind each requirement.
          3.  Classify requirements as "Non-Negotiable" (general philosophical/scientific constraints) vs. "Parochial" (specific to certain camps).
          4.  Identify any joint unsatisfiability (trilemmas/inconsistencies) and specify which desideratum must give way.
          5.  (Optional but requested) Score four views (Epiphenomenalism, Interactionist Dualism, HOT, +1 other) against the list to demonstrate discriminatory power.
      *   **Tone:** Philosophical, rigorous, clear, analytical.

  2.  **Analyze the Core Problem (The Paradox of Phenomenal Judgment):**
      *   *Source:* David Chalmers (primarily *The Conscious Mind*).
      *   *The Issue:* If physicalism is true (causal closure), and consciousness is distinct from the physical (or even if it's not, but we treat it as a distinct *concept*), how do our physical brains form accurate judgments *about* consciousness?
      *   *Epiphenomenalism:* Experience doesn't cause belief. Belief is caused by physics. Why is the belief true? (Coincidence problem).
      *   *Physicalism/Functionalism:* Experience *is* the physics/function. So the cause is the experience. But then why does it *seem* distinct? (Illusion problem).
      *   *Dualism:* Experience causes belief. But how does it interact with physics? (Causal closure violation).

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Requirement 1: Reliability of Introspection.* We generally trust that when we say "I am in pain," we are in pain. A theory can't make us systematic liars or hallucinators about our own minds without strong reason.
      *   *Requirement 2: Causal Explanation of Judgment.* Judgments are physical events (speech, neural firing). They need a cause.
      *   *Requirement 3: Phenomenal Distinctness (The "Hard Problem" intuition).* The theory needs to acknowledge that experience *feels* like something over and above mere functional processing.
      *   *Requirement 4: Causal Closure of the Physical.* Neuroscience suggests physical effects have physical causes.
      *   *Requirement 5: Non-Accidental Correlation.* The link between experience and judgment shouldn't be a cosmic coincidence (pre-established harmony).

  4.  **Classifying Desiderata (Non-Negotiable vs. Parochial):**
      *   *Non-Negotiable:* Causal Closure (scientific consensus), Reliability (methodological necessity), Causal Explanation (metaphysical basic).
      *   *Parochial:* Phenomenal Distinctness (Physicalists deny this is ontological), Non-Reductionism (Physicalists deny this).
      *   *Wait, refinement:* The prompt asks for what a theory *in this area* must deliver. If a theory denies phenomenal distinctness (illusionism), it handles the paradox by dissolving it. So, "Phenomenal Distinctness" might be a parochial commitment of Realists. However, the prompt implies we are taking the paradox seriously, which usually assumes realism. I need to be careful here. Let's frame it as "Accommodating the *Intuition* of Distinctness" vs. "Ontological Distinctness."
      *   *Better Classification:*
          *   **Core Constraints (Non-Negotiable):** Causal Closure of the Physical, Introspective Reliability (mostly), Explanatory Non-Accidentality.
          *   **Theoretical Commitments (Parochial):** Phenomenal Realism (vs. Illusionism), Irreducibility (vs. Reductionism).

  5.  **Identifying the Inconsistency (The Trilemma):**
      *   This is the crux of the prompt.
      *   The "Chalmers Trilemma" regarding Phenomenal Judgment:
          1.  **Causal Closure:** Physical events (judgments) have sufficient physical causes.
          2.  **Phenomenal Realism/Irreducibility:** Phenomenal properties are not identical to physical/functional properties.
          3.  **Introspective Reliability:** Our judgments about experience are caused by the experience and track it accurately.
      *   *Conflict:* If (1) is true, physical causes drive judgment. If (2) is true, experience is *not* those physical causes. If (3) is true, experience *must* cause judgment.
      *   *Resolution:* One must go.
          *   Drop (1) -> Interactionist Dualism.
          *   Drop (2) -> Physicalism/Functionalism.
          *   Drop (3) -> Epiphenomenalism (judgments are caused by physics, experience is inert, correlation is brute) OR Illusionism (judgments are mistaken).

  6.  **Developing the Scoring System:**
      *   Views to score:
          1.  Epiphenomenalism.
          2.  Interactionist Dualism.
          3.  Higher-Order Thought (HOT) (Representationalist).
          4.  Illusionism (Frankish/etc.) - *Good choice for contrast.*
      *   Criteria to score against:
          1.  Respects Causal Closure.
          2.  Secures Introspective Reliability.
          3.  Preserves Phenomenal Realism.
          4.  Avoids Systematic Coincidence.

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the depth of the problem (Chalmers' influence).
      *   **Section 1: The Desiderata:** List the requirements with rationale.
      *   **Section 2: Classification:** Non-negotiable vs. Parochial.
