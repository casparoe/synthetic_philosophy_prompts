      *   *Adjustment:* I need to validate that their intuition reveals something important about how we define "reasons." The user thinks a reason must be *internal to the options*. I need to show that a reason can be *external to the options* (e.g., saving time).
      *   *Key Insight:* The "reason" isn't "Box A is better." The reason is "I need to eat breakfast and standing here isn't helping." This shifts the locus of rationality.

  8.  **Final Polish:**
