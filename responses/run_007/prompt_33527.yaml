answer: |-
  It is a pleasure to correspond with a fellow traveler from the hard sciences. Your unease with the revealed-preference tautology is well-founded; it is the "elephant in the room" of microeconomic theory. Samuelson's operationalism saved economics from unmeasurable psychological states, but it risked turning utility into a mere scoreboard rather than a score.

  Let's treat your friend's choices as experimental data. We have three observations of binary choices between bundles $(X, Y)$.

  ### 1. Three Candidate Utility Functions

  To model her behavior, we need functions $U(x,y)$ that rank the chosen bundle higher than the rejected one in all three cases.

  **Model A: Cobb-Douglas (The "Trader")**
  *   **Function:** $U(x,y) = x \cdot y$
  *   **Logic:** This assumes goods are imperfect substitutes. She is willing to trade one for the other, but values balance. The marginal rate of substitution diminishes.
  *   **Fit to Data:**
