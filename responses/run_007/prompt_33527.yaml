      *   **Predicts:** She chooses **(1,7)**.

  **Model B: Leontief (The "Bottleneck")**
  *   **Function:** $U(x,y) = \min(x, y)$
  *   **Logic:** This assumes perfect complements. She only values the goods in fixed proportions (1:1). Extra units of one good without the other provide zero additional utility. She is maximizing the "limiting reagent."
  *   **Fit to Data:**
      1.  $\min(2,2) = 2$ vs $\min(3,1) = 1$. (Consistent: $2 > 1$)
      2.  $\min(4,3) = 3$ vs $\min(2,5) = 2$. (Consistent: $3 > 2$)
      3.  $\min(5,2) = 2$ vs $\min(1,8) = 1$. (Consistent: $2 > 1$)
  *   **Prediction for (1,7) vs (2,3):**
      *   $U(1,7) = 1$
      *   $U(2,3) = 2$
      *   **Predicts:** She chooses **(2,3)**.

  **Model C: Imbalance Aversion (The "Symmetrist")**
  *   **Function:** $U(x,y) = -(x - y)^2$
  *   **Logic:** She doesn't necessarily care about the total amount, but she has a strong psychological distaste for inequality between the two goods. She wants the bundle to lie on the 45-degree line.
  *   **Fit to Data:**
      1.  $-(0)^2 = 0$ vs $-(2)^2 = -4$. (Consistent)
      2.  $-(1)^2 = -1$ vs $-(-3)^2 = -9$. (Consistent)
      3.  $-(3)^2 = -9$ vs $-(-7)^2 = -49$. (Consistent)
  *   **Prediction for (1,7) vs (2,3):**
      *   $U(1,7) = -36$
      *   $U(2,3) = -1$
      *   **Predicts:** She chooses **(2,3)**.

