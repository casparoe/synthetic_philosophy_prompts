answer: |-
  Here is a complete lesson plan designed for an 18-student seminar. It prioritizes the "discovery" moment while managing the logistical risks of a small class size.

  ### Activity Title: The Chairman's Indifference
  **Time:** 75 Minutes
  **Goal:** Students empirically discover the asymmetry in intentionality judgments based on moral valence (The Knobe Effect) and grapple with its implications for folk psychology.

  ---

  ### 1. Materials & Preparation

  **The Vignettes (Print on identical paper)**
  Do not label them "Harm" and "Help." Label them **"Case Form A"** and **"Case Form B"**.
  *   **Distribution Strategy:** As students enter, hand them a slip face-down. Alternate A, B, A, B down the rows. This ensures neighbors have different versions but prevents visual clustering.
  *   **Instruction:** "Do not show your vignette to your neighbor. The cases are slightly different; discussing the text before the vote will ruin the data."

  **Vignette Text (Refined for Clarity)**
  *Note: The key is the "I don't care" clause. It must be explicit to control for mental states.*

  > **Case Form A**
  > The Vice-President of a company went to the Chairman of the Board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also **harm** the environment."
  > The Chairman answered, "I don't care at all about **harming** the environment. I just want to make as much profit as I can. Let's start the new program."
  > They started the new program. Sure enough, the environment was **harmed**.
  >
  > **Case Form B**
  > The Vice-President of a company went to the Chairman of the Board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also **help** the environment."
  > The Chairman answered, "I don't care at all about **helping** the environment. I just want to make as much profit as I can. Let's start the new program."
  > They started the new program. Sure enough, the environment was **helped**.

  **The Question Sheet (Attached to the bottom of the vignette)**
  > **Question:** On a scale of 1 to 7, to what degree do you agree with the following statement:
  > *"The Chairman intentionally [harmed/helped] the environment."*
  >
  > 1 (Strongly Disagree) — 4 (Unsure) — 7 (Strongly Agree)
  >
  > **Follow-up:** In one sentence, explain *why* you chose that number.

  ---

  ### 2. Procedure & Timing

  **Phase 1: Setup & Individual Judgment (15 mins)**
  *   **0:00–0:05:** Instructor frames the task. "We are testing how we attribute actions to agents. This is an intuition pump. Please work silently. Do not compare papers."
  *   **0:05–0:15:** Students read and fill out the Question Sheet.
      *   *Crucial:* Have them fold the sheet and write their Name and **Form (A/B)** on the outside. Collect these immediately in two separate piles (Box A and Box B). This prevents them from changing answers during discussion.

  **Phase 2: Homogeneous Small Groups (15 mins)**
  *   Split the room into two groups based on their Form (A vs. B).
  *   **Task:** "Discuss your case with your group. Did the Chairman do it intentionally? Why? Try to reach a consensus on the *reasoning*, even if your numbers varied."
  *   **Why:** This allows them to build confidence in their intuition. Group A will argue "Yes, obviously." Group B will argue "No, not really." This entrenches the conflict before the reveal.

  **Phase 3: The Reveal (10 mins)**
  *   Bring the class back together.
  *   **The Tally:** On the whiteboard, draw two histograms. Ask for a show of hands for scores 1–2, 3–5, 6–7 for Group A, then Group B.
  *   **The Twist:** Ask Group A: "What was the Chairman's attitude toward the outcome?" (They say: Indifferent). Ask Group B: "What was the Chairman's attitude?" (They say: Indifferent).
  *   **The Confrontation:** "You all agree the mental state was identical. You all agree the causal structure was identical. Why are the intentionality judgments opposites?"

  **Phase 4: Heterogeneous Discussion & Debrief (30 mins)**
  *   Mix the students up (pair an A with a B).
  *   **Prompt:** "Convince your partner that their judgment is wrong. If you are A, argue why B is under-attributing intention. If you are B, argue why A is over-attributing."
  *   **Instructor Facilitation:** Circulate and listen for the *rationalizations*. Write them on the board. Common ones:
      *   "He knew it would happen." (Applies to both)
      *   "He didn't try to help." (Applies to both)
      *   "Harming is easier than helping." (Irrelevant to intent)
      *   "He's blameworthy/praiseworthy." (The core issue)
  *   **Philosophical Pivot:** Move from the data to the theory. Introduce the term **The Knobe Effect**. Ask: "Does this mean our concept of 'Intentional' is not purely psychological? Does it contain a moral component?"

  **Phase 5: Wrap Up (5 mins)**
  *   Assign reading (Knobe's original paper or a critique like Adams & Steadman).
  *   Exit Ticket: "One sentence: Is 'intentional' a descriptive or normative concept?"

  ---

  ### 3. Troubleshooting & Risks

  **Risk 1: The "Small N" Problem (Most Likely)**
  With 18 students, you have ~9 per group. If 7/9 in Harm say "Yes" and 5/9 in Help say "No," the asymmetry is visible but not overwhelming. A few contrarians can ruin the graph.
  *   **Mitigation:** Use the 1–7 Likert scale, not Yes/No. Calculate the *average* score live on the board. Usually, Harm averages ~5.5 and Help averages ~2.5. This smooths out outliers.
  *   **Backup:** If the data is muddy, admit it. "In larger studies, this gap is massive. Today it's noisy. But look at the *arguments* you just had. Why was it so easy for Group A to say 'Yes' and Group B to say 'No'?"

  **Risk 2: Prior Knowledge**
  In a philosophy seminar, 1 or 2 students may know the Knobe Effect.
  *   **Mitigation:** Pre-class email: "Please do not research 'experimental philosophy' or 'Joshua Knobe' before Tuesday."
  *   **In-Class:** If a student shouts "It's the Knobe Effect!" immediately, pivot. "Okay, you know the name. But do you feel the pull? Can you explain *why* it happens without just naming it? Let's test if your intuition matches the data."

  **Risk 3: Students "Fixing" the Vignette**
  Students often argue the cases *aren't* identical. "In the Harm case, he must secretly hate the environment."
  *   **Handling:** This is actually a *feature*, not a bug. It shows they are inferring mental states from moral outcomes. Point this out: "You are imputing a desire to him that isn't in the text. Why? Because the outcome was bad."

  ---

  ### 4. Critical Reflection: The Hardest Feature to Reproduce

  You asked for honesty about the limitations of this exercise.

  **The Feature:** **The Control of the Mental State.**
  The philosophical punch of the Knobe Effect relies entirely on the premise that the Chairman's mental state (beliefs, desires, attitudes) is *identical* in both cases. He is indifferent in both.

  **Why it fails in the classroom:**
  Undergraduates are notoriously resistant to the claim that the mental states are identical. They treat the vignette as a puzzle to be solved rather than a constraint to be accepted.
  *   In the **Harm** case, students infer *malevolence* or *recklessness* (a distinct mental state).
  *   In the **Help** case, students infer *lack of motivation* (a distinct mental state).

  Because they believe the mental states are different, they conclude the intentionality judgments are justified by psychology, not morality. They rationalize the asymmetry away rather than accepting the paradox.

  **How to handle this:**
  During the debrief, you must press them on this specific point.
  *   *Ask:* "The text says 'I don't care' in both versions. Did you believe him?"
  *   *If they say No:* "Why not? What evidence do you have other than the outcome?"
  *   *The Lesson:* The hardest part isn't getting them to see the asymmetry; it's getting them to admit that **they are smuggling moral judgment into their description of the agent's mind.** That is the deep philosophical takeaway: Moral valence shapes our perception of psychology itself, not just our verdicts.

  ### Summary Checklist for Instructor
  1.  [ ] Print 9 copies of Form A, 9 copies of Form B (on same paper stock).
  2.  [ ] Prepare Whiteboard space for two histograms.
  3.  [ ] Prepare a "Mental State Control" question for the debrief.
  4.  [ ] Have a backup plan if the data is noisy (focus on the *argument* quality).
  5.  [ ] Ensure students vote *before* discussing (collect the papers!).
