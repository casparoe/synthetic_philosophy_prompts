  5.  **Drafting Section 3 & 4: Cruxes and Predictions:**
      *   *Crux 1: Propositionality.* Is "knowing what it's like" reducible to "knowing that"?
          *   *Test:* The "Old Fact/New Mode" response. Can Mary express the new knowledge in a sentence she couldn't affirm before?
