      *   *Crux 2: A Priori Entailment.* Could Mary deduce the experience from the physical data if she were logically omniscient?
          *   *Test:* The "Conceptual Competence" test. If she has all concepts, does the gap remain?
          *   *Prediction:* AP says gap remains (conceptual gap is ontological). P says gap closes (conceptual gap is epistemic only).
      *   *Crux 3: The Explanatory Role of Abilities.* Do abilities explain the "Wow"?
          *   *Test:* The "Ability Without Experience" case (e.g., blindsight or perfect simulation).
          *   *Prediction:* P says abilities suffice for the functional change. AP says abilities without the qualitative feel don't capture the gain.
      *   *Verbal Dispute Check:* Is "fact" the problem? Sometimes Physicalists redefine "fact" to exclude phenomenal truths. Need to note this.

  6.  **Refining the Tone:**
