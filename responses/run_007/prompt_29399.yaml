  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Knowledge Argument (Mary's Room)
  **Signatories:** [Name], Proponent of Physicalism; [Name], Proponent of Non-Physicalism
  **Date:** [Date]

  ## I. AGREED CLAIMS (THE SETUP AND STAKES)

  We, the undersigned, agree to the following stipulations regarding the thought experiment, the definitions of key terms, and the conditions under which physicalism would be falsified.

  1.  **Mary's Pre-Release Epistemic State:** Before leaving the room, Mary possesses all available *physical information*. This includes all physical truths regarding the wavelength of light, the neurophysiology of the visual cortex, the functional role of color processing, and the behavioral dispositions associated with color perception. She lacks only the first-person *experience* of seeing red.
  2.  **Mary's Post-Release Change:** Upon leaving the room and seeing a red tomato, Mary's epistemic state changes. She says, "Wow, I see red now," and indicates she has learned something she did not know before. Both sides agree she gains *some* form of knowledge or cognitive access.
  3.  **Definition of Physicalism:** Physicalism is true if and only if every truth about the world is either a physical truth or is logically entailed (deducible a priori) by the complete set of physical truths.
  4.  **The Burden of Proof:** For the Knowledge Argument to successfully refute physicalism, it must show that the new knowledge Mary gains constitutes a *truth* (a fact about the world) that was not entailed by the complete physical truth she already possessed.
  5.  **Distinction of Knowledge Types:** We distinguish between:
      *   **Propositional Knowledge (*Knowing-That*):** Knowledge of facts that can be expressed in declarative sentences and are truth-apt.
      *   **Non-Propositional Knowledge:** Including *Knowing-How* (abilities to imagine, recognize, remember) and *Knowledge by Acquaintance* (direct relational awareness of a property).
  6.  **The Verbal Constraint:** We acknowledge that a portion of our dispute may turn on the definition of "fact." We agree that if the disagreement reduces solely to whether "knowledge by acquaintance" counts as a "fact" in the sense relevant to ontology, we will classify this as a verbal dispute. However, we proceed under the assumption that the dispute is substantive regarding the *entailment* relation.
  7.  **Condition for Falsification:** Physicalism is false *only if* Mary's new knowledge is (a) propositional (or truth-apt in a way that describes the world) AND (b) not a priori entailed by the physical information she possessed in the room.

  ***

  ## II. RESIDUAL DISAGREEMENT

  While we agree on the setup and the conditions for falsification, we disagree on the classification of Mary's new knowledge and its implications for entailment.

  | **The Non-Physicalist Position** | **The Physicalist Position** |
  | :--- | :--- |
  | **Claim:** When Mary sees red, she learns a new **propositional fact** about the nature of conscious experience (e.g., *"Seeing red feels like *this*"*). | **Claim:** When Mary sees red, she gains **non-propositional knowledge** (abilities to recognize/imagine) and/or enters a **relation of acquaintance** with a physical property. |
  | **Implication:** This fact was not entailed by the complete physical information she possessed in the room. Therefore, the complete physical information does not entail all truths. | **Implication:** This new state does not add a new *truth* to her worldview. It adds a new *mode of presentation* or *conceptual capacity* regarding a physical truth she already knew. |
  | **Conclusion:** Physicalism is false because there are phenomenal truths that outrun physical truths. | **Conclusion:** Physicalism is true because all truths (including those about experience) are fixed by the physical truths; Mary simply lacked the phenomenal concept to grasp them. |

  ***

  ## III. CRUXES, TEST CASES, AND PREDICTIONS

  We have identified three specific sub-questions (cruxes) that drive our disagreement. For each, we specify a concrete argument or case that bears on the issue and record our opposing predictions.

  | **Crux** | **Concrete Case / Argument** | **Non-Physicalist Prediction** | **Physicalist Prediction** |
  | :--- | :--- | :--- | :--- |
  | **1. The Propositionality Crux**<br>*(Is the new knowledge truth-apt?)* | **The Indexical Test:** Can Mary, upon release, affirm a sentence *S* that expresses a truth she could not affirm before, where *S* is not merely indexical (like "I am here") but descriptive of the experience itself (e.g., "Red experiences have qualitative character Q")? | Mary can affirm a new truth about the *nature* of the experience. The content of her thought is not exhausted by physical/functional descriptions. The "what-it-is-like" is a truth-bearer. | Mary cannot affirm a new *truth*. She only acquires a new *concept* (a phenomenal concept) for a truth she already knew under a physical description. She can say "Wow," but this expresses a reaction, not a new proposition. |
  | **2. The Entailment Crux**<br>*(Is the gap epistemic or ontological?)* | **The A Priori Deduction Test:** If Mary were logically omniscient (could process all physical data instantly), could she deduce exactly what seeing red is like without leaving the room? | **No.** Even with logical omniscience, there is an explanatory gap. You cannot deduce phenomenal qualities from structural/functional data. The gap is ontological. | **Yes.** The gap is purely epistemic/conceptual. If she had the phenomenal concept *in the room* (via imagination or simulation), the deduction would hold. The lack of deduction is due to a lack of conceptual resources, not a lack of facts. |
  | **3. The Acquaintance Crux**<br>*(Does acquaintance threaten physicalism?)* | **The "Zombie Acquaintance" Case:** Could a physical duplicate of Mary (a zombie) stand in a relation of "acquaintance" to her visual states without having phenomenal experience? | **No.** Acquaintance *is* the phenomenal relation. If the zombie lacks experience, it lacks acquaintance. Therefore, acquaintance is a non-physical relation. | **Yes.** Acquaintance is a functional/causal relation between a subject and a brain state. A zombie could have the same relational access (for reporting, etc.) without the "feel." Acquaintance is physicalizable. |

  ### IV. VERBAL DISPUTE CLARIFICATION

  We acknowledge a potential verbal dispute regarding the word **"Fact."**

  *   **Source:** The Physicalist tends to reserve "fact" for "proposition expressible in physical language." The Non-Physicalist uses "fact" to mean "any truth about reality, including phenomenal truths."
  *   **Resolution:** We agree that if the Physicalist admits Mary gains a *truth* about the world that is not expressible in physical language, this counts as a victory for the Non-Physicalist's core intuition, even if the Physicalist refuses to label it a "fact." Conversely, if the Non-Physicalist admits Mary's new knowledge is *only* a change in cognitive ability without a corresponding change in worldly truth, this counts as a victory for the Physicalist.

  **Signed:**

  _________________________ (Physicalist)

  _________________________ (Non-Physicalist)
