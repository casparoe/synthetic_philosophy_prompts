  2.  **Deconstruct the Philosophical Positions:**
      *   **The Anti-Physicalist (AP):** Mary learns a *new fact* (propositional knowledge) that wasn't entailed by physical facts. Therefore, physicalism is false (incomplete ontology).
      *   **The Physicalist (P):** Mary learns *abilities* (know-how) and/or gains *acquaintance* (direct relation), but no new *propositional fact* about the world. Physicalism remains true because all facts are physical facts.
      *   **Common Ground:** Both accept the thought experiment setup (Mary knows all physical info, sees red for first time, says "Wow"). Both accept logical entailment is the standard for physicalism.

  3.  **Drafting Section 1: Agreed Claims (The Setup & Burden):**
      *   Need to define "Physicalism" clearly (all facts are physical facts/entailed by physical facts).
      *   Need to define Mary's pre-release state (omniscient regarding physical/functional structure, no color experience).
      *   Need to define the post-release change (she gains *something*).
      *   Need to define the stakes (if she gains a non-physical *fact*, physicalism is in trouble).
      *   *Drafting thought:* Make sure to distinguish between "knowledge by acquaintance" and "propositional knowledge" neutrally.

  4.  **Drafting Section 2: Residual Disagreement:**
