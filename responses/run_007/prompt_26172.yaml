answer: |-
  **Q&A PREP SHEET: Constitutional Precommitment as Democratic Self-Government**

  **Objection 1**
  **How they'll phrase it:** (From the Popular Constitutionalist contingent)
  "You lean heavily on the idea of 'internal self-binding,' but this elides the institutional reality. When you say the 'people' bind themselves, you're masking the fact that you're handing the key to the knot to a small cadre of unelected lawyers. If the legislature passes a law expanding the franchise, and the Court strikes it down as violating a 'precondition,' *who* is actually governing? You claim this is democratic self-rule, but isn't it just a juristocracy dressed up in the language of Ulysses?"

  **Reply:**
  "That's the central challenge, and it requires distinguishing between *policy* and *process*. My claim isn't that judges know better than legislatures about tax rates or foreign policy. It's that certain structural preconditions—like free speech, association, and minority integrity—are the *sine qua non* of the democratic game itself.
  When judicial review intervenes, it shouldn't be to substitute judicial policy preferences for legislative ones. It should be to police the boundaries of the democratic arena to ensure the 'self' in 'self-government' remains inclusive and capable of agency. Think of it less like a manager overruling a worker, and more like a referee enforcing the rules of the match so the players can actually play. If we leave the rules of the game to the players currently winning, we don't have democracy; we have elective dictatorship. The counter-majoritarian difficulty dissolves if we recognize that the Constitution constitutes the majority, rather than merely constraining it."

  **Weakest point:**
  This relies on a sharp distinction between "process" and "substance" that often collapses in practice. Judges inevitably make substantive value judgments when defining what counts as a "precondition" of democracy. If the Court defines "free speech" to include unlimited corporate spending, they are shaping democracy, not just refereeing it.

  ***

  **Objection 2**
  **How they'll phrase it:** (From the Dead-Hand Skeptic)
  "Let's grant the Ulysses analogy for a moment. Ulysses tied himself up because he knew his future self would be irrational. But why should we accept that the 'past self' of the polity—the framers, or even the ratifiers of twenty years ago—is more rational or legitimate than the present majority? Democracy is premised on the equality of citizens across time as well as space. By making amendment thresholds prohibitively high, you aren't facilitating self-binding; you're allowing a past generation to veto the moral learning of the present one."

  **Reply:**
  "The 'dead hand' critique assumes that constitutionalism is about freezing specific policy preferences in time. But on the view I'm defending, entrenchment isn't about preserving the *answers* of the past; it's about preserving the *capacity* of the future to answer for itself.
  We don't entrench a specific welfare policy; we entrench the right to organize for one. The supermajority requirement isn't a veto by the dead; it's a demand for broad consensus among the living. It forces the current majority to persuade a significant minority that their proposed change doesn't undermine the democratic infrastructure. This isn't about assuming the past was wiser; it's about recognizing that democracy requires stability to function. If the rules change every election cycle, political planning becomes impossible, and citizenship becomes reactive rather than proactive."

  **Weakest point:**
  In many real-world systems (like the U.S.), amendment thresholds are so high that they *do* effectively allow a small minority of the past to veto the present, regardless of the moral urgency. The "broad consensus" ideal often masks minority rule in practice.

  ***

  **Objection 3**
  **How they'll phrase it:** (From the Deliberative Democrat)
  "I'm sympathetic to the idea of preconditions, but I worry about the epistemic cost. If we insulate certain norms from ordinary majoritarian revision, don't we lose the opportunity for the citizenry to collectively reason through *why* those norms matter? If the Court guarantees free speech, citizens might stop valuing it as a democratic practice and start treating it as a legal entitlement. Doesn't constitutionalization depoliticize the very virtues democracy needs to survive?"

  **Reply:**
  "That's a serious risk, and I agree that constitutionalism shouldn't replace political culture. However, I'd argue the opposite effect often occurs. When rights are left to ordinary legislation, the debate becomes about *power*: 'Do we have enough votes to suppress this group?'
  When rights are constitutionalized, the debate shifts to *principle*: 'Does this law align with our constitutive commitments?' This elevates public reason rather than stifling it. Furthermore, judicial review often triggers broader public deliberation—think of the backlash and subsequent engagement following cases like *Roe* or *Obergefell*. The Constitution doesn't end the conversation; it sets the terms of the conversation, ensuring it happens on a terrain where basic dignity isn't up for a vote."

  **Weakest point:**
  There is empirical evidence that judicial resolution can cause citizens to disengage, feeling that "the Court has decided it, so my voice doesn't matter." The "elevated debate" doesn't always happen; sometimes polarization increases.

  ***

  **The Question I Hope Nobody Asks**
  **How they'll phrase it:**
  "You argue that these mechanisms protect the preconditions of democracy. But looking at the history of entrenched bills of rights, the 'preconditions' selected for entrenchment are almost exclusively negative liberties and property rights, not the material conditions required for actual political agency—like housing, healthcare, or economic security. If a citizen is starving or working three jobs, their formal right to vote is meaningless. Isn't your defense of constitutional precommitment just a way of locking in a specific liberal ideology that protects the wealthy from redistribution, under the guise of protecting 'democracy'?"

  **Why I dread it:**
  This strikes at the *content* of the precommitments, not just the *mechanism*. If I admit that current constitutions protect the wrong preconditions, I undermine the claim that they are constitutive of *true* democracy. If I defend the current selection, I look like an ideological partisan masking bias as neutral theory. There is no good two-minute answer to the charge that "constitutional democracy" often functions to insulate capital from democratic accountability.
