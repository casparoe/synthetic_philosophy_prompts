      *   Need to clarify that *The Theory of Moral Sentiments* (1759) came *before* *The Wealth of Nations* (1776).
      *   Smith didn't think humans were *only* self-interested. He thought self-interest was one drive among many (benevolence, justice, sympathy).
      *   The "Invisible Hand" is a specific economic metaphor, not a moral axiom.

  4.  **Deep Dive into the Impartial Spectator:**
