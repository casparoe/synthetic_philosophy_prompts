      *   **Development:** Moves from "actual spectators" (people around you) to the "ideal spectator" (the man within the breast).
      *   **Function:** It allows us to distance ourselves from our own passions. It's not just "what would my mom say?" it's "what would a neutral, well-informed observer say?"
      *   **Crucial Distinction:** It can contradict society. (Example: A soldier dying for a cause society doesn't understand, or resisting a mob mentality).

