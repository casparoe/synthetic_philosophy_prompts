answer: |-
  # Standing Operating Procedure: Strategic Review of Dual-Use Proposals

  ## 1. Screening Questions

  **Purpose:** To determine if a proposal exhibits the structure of the **Unilateralist's Curse**. This term describes a situation where individual actors, acting independently, undertake an action that imposes risks on everyone, even though the group would prefer no one acted. Each actor proceeds because they believe if they refrain, someone else will act anyway.

  **Instructions:** For each proposal raising dual-use or disruption concerns, answer the following four questions based on available evidence (e.g., researcher interviews, literature scans, funding disclosures).

  **Q1: Can this project be executed by a single group without broad collaboration?**
  *   **Decisive Yes:** The methodology relies on equipment, data, or expertise available to a single lab or small team.
  *   **Decisive No:** The project requires international consortiums, regulated infrastructure, or multi-institutional data sharing to proceed.

  **Q2: Does the project create negative externalities for parties not involved?**
  *   **Decisive Yes:** Success creates risks (security, safety, social stability) that extend beyond the researchers and their immediate partners to the public or global community.
  *   **Decisive No:** Risks are contained within the lab (e.g., standard chemical safety) or affect only willing participants.

  **Q3: Is the primary motivation for speed or first-mover advantage driven by a belief that "competitors will do it anyway"?**
  *   **Decisive Yes:** Researchers explicitly cite competitive pressure, national security races, or commercial inevitability as justification for bypassing safety norms.
  *   **Decisive No:** Researchers cite scientific curiosity, specific local need, or unique archival access as the primary driver.

  **Q4: Do the researchers have viable exit options if this panel recommends against the project?**
  *   **Decisive Yes:** Researchers can easily move the work to a different institution, use private funding, or reclassify the work to avoid review.
  *   **Decisive No:** The work requires university-specific resources (e.g., specific biosafety level labs, IRB authority) that cannot be replicated elsewhere.

  **Threshold and Exit:**
  If **three or more** questions are answered **Yes**, the Unilateralist's Curse is likely in play. Proceed to **Section 2 (The Procedure)**.
  If **two or fewer** questions are answered **Yes**, the strategic race dynamic is weak. Exit this procedure and apply the **Standard Review Process** focused on risk mitigation and compliance.

  ## 2. The Procedure

  **Purpose:** To alter the strategic incentives identified in screening, reducing the likelihood that panel rejection accelerates the risky behavior. This procedure prioritizes coordination and communication strategies over binary approval/rejection.

  **Step 1: Confidential Deliberation**
  *   **Action:** Do not record specific safety objections in public minutes. Keep the strategic rationale confidential among panel members and administration.
  *   **Information Needed:** List of all personnel on the proposal.
  *   **Goal:** Prevent the "forbidden fruit" effect where public rejection signals high value to outside bad-faith actors.
  *   **Success Metric:** No public record exists that allows researchers to claim the university "blocked vital research."

  **Step 2: Verify the Competitive Landscape**
  *   **Action:** Independently verify the claim that "others will do it anyway." Contact trusted peers at other institutions or review pre-print servers.
  *   **Information Needed:** Names of competing labs, funding sources of competitors.
  *   **Goal:** Distinguish between genuine race dynamics and researcher anxiety.
  *   **Success Metric:** Confirmation of whether external competitors actually exist and their timeline.

  **Step 3: Conditional Coordination (The "Pledge" Mechanism)**
  *   **Action:** Offer approval *conditional* on the researchers coordinating with identified competitors to adopt shared safety norms.
  *   **Information Needed:** Contact info for competing groups.
  *   **Goal:** Transform a unilateral decision into a multilateral norm. If everyone agrees to delay or add safeguards, the race dissolves.
  *   **Success Metric:** Researchers initiate contact with competitors; a memorandum of understanding is drafted.
  *   **Honesty Check:** This is aspirational. Competitors may refuse. If they refuse, proceed to Step 4.

  **Step 4: Reframe the Recommendation**
  *   **Action:** Avoid a flat "Recommend Against." Instead, issue "Recommend for Approval with Specific Modifications" that address the external risk without stopping the core science.
  *   **Information Needed:** Specific technical safeguards (e.g., API filters, redaction protocols).
  *   **Goal:** Keep the work inside the university's oversight perimeter. Pushing work outside removes all leverage.
  *   **Success Metric:** Researchers accept modifications and remain under university governance.

  **Step 5: Monitor and Escalate**
  *   **Action:** If researchers reject modifications and threaten to leave, escalate to University Counsel regarding intellectual property or facility use rights.
  *   **Information Needed:** University policies on facility use and IP.
  *   **Goal:** Increase the cost of exiting the review process.
  *   **Success Metric:** Researchers negotiate rather than depart.
  *   **Honesty Check:** Legal enforcement is difficult. This step is a last resort to signal seriousness.

  ## 3. Worked Cases

  ### Case (a): Open-Weight Chemical Synthesis Model

  **Screening Application:**
  1.  **Single Group Execution?** **Yes.** The lab has the compute and data to train the model independently.
  2.  **Negative Externalities?** **Yes.** Dual-use potential for toxic agents affects global security.
  3.  **Competitor Motivation?** **Yes.** Researchers explicitly stated, "Three other groups are building this; if we don't release, they will."
  4.  **Exit Options?** **Yes.** Code can be hosted on private servers; funding can be sourced from industry partners not subject to university review.
  *   **Result:** 4 Yeses. The Unilateralist's Curse is active. Proceed to Procedure.

  **Procedure Application:**
  *   **Step 1 (Confidentiality):** The panel records the concern as "safety architecture review" rather than "dual-use prohibition" to avoid signaling that the model is high-value weaponry.
  *   **Step 2 (Verify Landscape):** Panel staff contact trusted counterparts at the three other institutions. Confirmation is received: two groups are indeed planning release within 12 months without safety filters.
  *   **Step 3 (Conditional Coordination):** The panel tells the lab: "We will approve release only if you convene a summit with the other three groups to agree on API safety filters." The lab agrees, seeing this as a way to lead the field rather than be restricted.
  *   **Step 4 (Reframe Recommendation):** Instead of recommending against release, the panel recommends "Approval pending implementation of usage monitoring." This keeps the lab inside the university's oversight.
  *   **Step 5 (Monitor):** The panel schedules a 6-month review of the usage logs.
  *   **Outcome:** The model is released, but with safety filters adopted by all four groups. The race dynamic shifted from "who releases first" to "who sets the safety standard." The curse is mitigated because the action is no longer unilateral; it is now a coordinated norm. The panel avoided a rejection that would have driven the lab to a private server with zero oversight.

  ### Case (b): Historian Digitizing Intelligence Documents

  **Screening Application:**
  1.  **Single Group Execution?** **Yes.** The historian has the archival access and scanning equipment.
  2.  **Negative Externalities?** **Yes.** Living sources could face retaliation or harassment if named.
  3.  **Competitor Motivation?** **No.** The researcher cites unique access to a specific box of files. There is no evidence of a "race" to publish these specific documents. The "someone else will" argument is not raised.
  4.  **Exit Options?** **No.** The physical documents are university property. They cannot be digitized elsewhere without removing the physical archives, which is prohibited.
  *   **Result:** 2 Yeses. The Unilateralist's Curse is **not** in play. Exit to Standard Review Process.

  **Procedure Application:**
  *   **Rationale for Exit:** Because there is no race dynamic (Q3 No) and no exit option (Q4 No), the strategic incentives of the curse do not exist. A panel rejection will not cause the work to move elsewhere; it will simply stop the work or force redaction. There is no risk that rejection accelerates the harm.
  *   **Standard Review Path:** The panel applies standard ethical criteria regarding human subjects and privacy.
  *   **Action:** The panel recommends "Approval with Redaction." The historian must remove names of living sources before digital publication.
  *   **Outcome:** The research proceeds, but the specific harm (identifying sources) is mitigated. Because the university controls the physical assets, compliance is enforceable.
  *   **Contrast:** In Case (a), the panel had to negotiate with external actors because the work could leave the university. In Case (b), the panel acts as a traditional gatekeeper because the work cannot leave. Applying the Curse Procedure here would be wasteful; there are no competitors to coordinate with, and confidentiality is less critical since the risk is privacy, not global security arms races. The Standard Process is sufficient to protect the sources without needing complex strategic maneuvering.

  ## 4. Limits

  **What This Procedure Cannot Do:**
  This procedure cannot resolve situations where the "competitors" are hostile state actors or criminal enterprises unwilling to coordinate. Step 3 (Coordination) relies on a baseline of shared norms among researchers. If the external landscape is dominated by actors who value speed over safety, our conditional approval may merely legitimize risky work without actually slowing competitors.

  **Judgment Calls:**
  Determining the threshold for "viable exit options" (Q4) requires subjective judgment. Researchers may overstate their ability to leave to gain leverage. Panel members must distinguish between genuine capability and bluffing. Additionally, verifying the competitive landscape (Step 2) relies on informal networks; if those networks are flawed, the panel may coordinate based on false premises.

  **Failure Modes:**
  1.  **Bureaucratic Delay:** The procedure adds steps. In fast-moving fields, the time taken to coordinate may allow the technology to outpace the policy, rendering the safeguards obsolete.
  2.  **False Positives:** Applying this procedure to non-curse situations (like Case b) wastes resources and may create unnecessary secrecy around benign research.
  3.  **Moral Hazard:** By offering "Approval with Modifications" to keep work in-house, the panel may become perceived as permissive. Researchers might learn that threatening to leave guarantees a softer review.

  **Final Warning:**
  This procedure manages incentives; it does not eliminate risk. It is a tool for damage limitation in a world where the university lacks enforcement authority. It should be used to buy time and build norms, not to certify safety.
