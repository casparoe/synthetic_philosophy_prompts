      *   *Check:* Verbal vs. Substantive. Need to explicitly call out where the fight is about definitions (e.g., "utility") vs. reality (e.g., "can we measure").
      *   *Refinement on Weights:* Harsanyi's theorem *alone* doesn't give equal weights. It gives $W = \sum a_i U_i$. To get classical utilitarianism, you need an additional argument for $a_i = a_j$. Harsanyi uses the "Impartial Observer" argument for that. The document must distinguish the Aggregation Theorem from the Impartial Observer argument. *Correction:* The prompt asks about the Aggregation Theorem specifically, but the "Utilitarianism" claim usually conflates the two. I need to be precise that the Theorem gives Weighted Sum, and the "Utilitarian" label requires the extra step. I will make sure the Agreed Claims reflect this distinction.

  8.  **Finalizing the Output Structure:**
