prompt: |-
  I've been going back and forth on Harsanyi's aggregation theorem and whether it actually gets you utilitarianism. The pro camp says the theorem basically forces utilitarianism out of almost nothing: just vNM rationality for individuals and society plus a Pareto condition. The skeptic camp says it's a formal restatement of assumptions, and the only reason the conclusion looks like utilitarianism is that all the normative content is smuggled into the setup — especially what vNM utilities are supposed to represent, and what the Pareto condition is allowed to range over. Write the document those two camps would produce after a good-faith adversarial collaboration where they actually tried to converge, not just re-argue.

  I've read enough of the rationalist-blog debates about this to know the moving parts, so you can skip the basics and go straight at the load-bearing issues. I want: (1) a numbered agreed-claims section stating precisely what the theorem literally proves and what it doesn't, in wording both sides would sign — including the exact form of the representation, whether the weights are forced to be positive or equal, and what role the Pareto condition plays; (2) a disagreements table, each row giving the neutral question, then the pro-utilitarian formulation and the skeptic formulation, each written so its own side would own it; (3) the two or three cruxes — the sub-questions such that settling one would actually move at least one side, seperate from the merely verbal stuff; and (4) for each crux, a concrete argument or case both sides agree would bear on it, with each side's prediction recorded in advance. Be blunt about which parts you think are verbal rather than substantive — e.g. is the fight over whether vNM utility is really strength of preference versus risk attitude a real dispute or a terminological one? — and commit to the formulations and predictions rather than leaving everything as it-depends-on-your-theory.
