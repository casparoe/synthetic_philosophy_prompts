answer: |-
  # JOINT STATEMENT ON THE NORMATIVE IMPLICATIONS OF HARSANYI'S AGGREGATION THEOREM

  **Parties:** The Structuralist Camp (Pro) & The Normative Skeptic Camp (Skeptic)  
  **Date:** October 2023  
  **Status:** Adversarial Collaboration Output  

  ## 1. AGREED TECHNICAL & STRUCTURAL CLAIMS
  *Both parties sign off on the following mathematical and logical constraints. Disagreements lie in interpretation, not derivation.*

  1.  **Mathematical Form:** Given a set of individuals $I$ and a set of social lotteries $L$, if every individual $i \in I$ and the social planner satisfy the von Neumann-Morgenstern (vNM) axioms of rationality, and the social preference ordering satisfies the **Strong Pareto Condition** (if all $i$ prefer $A$ to $B$, society prefers $A$ to $B$; if all are indifferent, society is indifferent), then the social welfare function $W$ is a positive affine transformation of a linear combination of individual utility functions $U_i$.
      *   Formula: $W = \sum_{i=1}^n a_i U_i + b$, where $a_i \geq 0$.
  2.  **Weights Are Not Forced Equal:** The theorem *alone* does not require $a_i = a_j$. It permits weighted utilitarianism. To derive classical utilitarianism (equal weights), one must add a separate symmetry or impartiality axiom (e.g., Harsanyi's Impartial Observer argument) external to the aggregation theorem itself.
  3.  **Uniqueness Condition:** The representation is unique only up to positive affine transformations of the individual $U_i$ functions. Changing the zero-point or unit of an individual's utility scale changes the weight $a_i$ required to maintain the same social ordering.
  4.  **Role of Uncertainty:** The theorem strictly applies to choices under risk (lotteries). Extensions to deterministic outcomes require the assumption that social preferences over certain outcomes maintain the same structure as preferences over risky prospects (the "Independence" axiom applied to certainty).
  5.  **Pareto Necessity:** If the Pareto condition is weakened (e.g., to allow for rights-based constraints where society rejects an outcome everyone prefers), the linear representation fails. If Pareto holds, the linear representation holds.
  6.  **No Interpersonal Comparison Solved:** The theorem assumes individual utility functions $U_i$ are already given and cardinally measurable. It does not provide a method for comparing the *scale* of $U_i$ to $U_j$ without additional assumptions about how those scales are normalized.

  ---

  ## 2. MAP OF DISAGREEMENTS
  *Where we diverge on interpretation and normative force.*

  | Neutral Question | Structuralist (Pro) Formulation | Skeptic Formulation |
  | :--- | :--- | :--- |
  | **1. What do vNM utilities $U_i$ represent?** | $U_i$ represents the strength of an individual's rational preference. If preferences are informed and rational, $U_i$ is the best available proxy for individual well-being. Aggregating $U_i$ is therefore aggregating well-being. | $U_i$ represents a mixture of well-being, risk-attitude, and taste. A risk-averse person and a risk-seeking person with identical welfare levels can have different $U_i$ scalings. Aggregating $U_i$ aggregates risk profiles, not necessarily welfare. |
  | **2. What is the normative status of Pareto?** | Pareto is a minimal consistency requirement for social rationality. Rejecting it implies imposing a social preference that contradicts *everyone's* informed judgment, which is paternalistic or authoritarian. | Pareto is a substantive moral claim, not a rationality constraint. It rules out deontological constraints (rights, justice) by definition. Using it to prove utilitarianism is begging the question against non-consequentialists. |
  | **3. Does the result count as "Utilitarianism"?** | Yes. Any view that mandates maximizing a weighted sum of individual utility functions is structurally utilitarian. The specific weights are a calibration issue, not a structural one. | No. Classical utilitarianism requires summing *welfare* with *equal weights*. Since the theorem allows arbitrary weights and aggregates preference-satisfaction (which may diverge from welfare), it is "Paretian Liberalism" or "Preference Aggregation," not Utilitarianism. |
  | **4. Is the "Impartial Observer" fix sufficient?** | Yes. By requiring the social planner to have an equal probability of being any individual (behind a veil of ignorance), the weights $a_i$ are forced to equality, completing the derivation of classical utilitarianism. | No. The Impartial Observer argument assumes the observer's vNM utility over "being person $i$" is comparable to person $i$'s actual utility. This reintroduces the interpersonal comparison problem the theorem was supposed to bypass. |

  ---

  ## 3. IDENTIFIED CRUXES
  *These are the substantive sub-questions where resolution would force at least one side to abandon their current position. We have excluded purely verbal disputes (e.g., "what label to use").*

  ### Crux A: The Ontology of vNM Utility
  **Question:** Does vNM utility track *normatively relevant welfare* invariant of risk attitude, or is it contaminated by *risk attitude* itself?
  *   **Why it matters:** If $U_i$ scales with risk aversion, then a society maximizing $\sum U_i$ will prioritize satisfying the preferences of the risk-averse over the risk-neutral, even if their actual welfare stakes are identical. This violates the utilitarian intuition of "each counts for one."
  *   **Stakes:** If $U_i$ is contaminated by risk attitude, the Structuralists must concede the theorem justifies "Risk-Weighted Preference Aggregation," not Utilitarianism.

  ### Crux B: The Absolutism of Pareto
  **Question:** Are there coherent cases where *every* individual prefers Outcome A to Outcome B, but Morality requires Society to choose B?
  *   **Why it matters:** The theorem collapses if Pareto is rejected. If rights or justice can override unanimous preference, the linear form is broken.
  *   **Stakes:** If Skeptics can produce a robust case where Pareto fails morally, the theorem loses its normative force. If Structuralists can show all such cases rely on mistaken preferences (information deficits), the theorem stands.

  ---

  ## 4. ADJUDICATION PROTOCOL
  *Concrete cases and predictions for each Crux. We commit to these predictions in advance.*

  ### For Crux A (Ontology of Utility)
  **The Case:** *The Risk-Aversion Mismatch.*
  Two individuals, Alice and Bob, face a lottery: 50% chance of Health, 50% chance of Death.
  *   Alice is risk-neutral regarding health outcomes. Her vNM utility for Health = 1, Death = 0. Expected Utility = 0.5.
  *   Bob is extremely risk-averse. He values the *certainty* of a middling outcome highly. To match the lottery, he needs a sure thing of Health with probability 0.9. His vNM scaling makes the lottery worth 0.5, but the "units" of his utility are stretched compared to Alice's.
  *   **Scenario:** A social choice between giving a small benefit to Alice (increasing her EU by 0.1) vs. a small benefit to Bob (increasing his EU by 0.1). Because of Bob's risk aversion scaling, the "resource cost" to generate 0.1 EU for Bob might be vastly higher than for Alice, or vice versa depending on normalization.
  *   **Test:** Does the theorem mandate prioritizing the person whose utility scale is more sensitive to risk, even if the *welfare* gain is identical?

  | Side | Prediction / Commitment |
  | :--- | :--- |
  | **Structuralist** | We concede that vNM utility includes risk attitude. **However**, we argue that rational welfare *just is* the satisfaction of rational preferences under uncertainty. If Bob is risk-averse, satisfying that aversion *is* a welfare good. We predict that attempting to strip "risk attitude" from "welfare" leaves no measurable quantity to maximize. |
  | **Skeptic** | We predict that if you control for risk attitude (e.g., using a "cardinal welfare" metric distinct from vNM), the linear aggregation fails to maximize that metric. We commit that if an alternative measure of welfare (e.g., hedonic tone or capability) diverges from vNM utility in systematic risk cases, the theorem fails to justify Utilitarianism. |

  ### For Crux B (Absolutism of Pareto)
  **The Case:** *The Unanimous Rights Violation.*
  A community of 1,000 people. A minority of 1 person is held in slavery. The 1,000 derive significant economic and psychological utility from this arrangement. The slave derives massive negative utility.
  *   **Modification:** Suppose the slave is brainwashed or coerced into preferring their condition (adaptive preferences), or suppose the slave is excluded from the "individuals" count (e.g., future generations, non-human animals, or a disenfranchised class).
  *   **Strict Test:** A case where *all included agents* prefer A, but A violates a fundamental right of an included agent. (e.g., A voluntary slavery contract everyone approves of).
  *   **Test:** Does the social planner *must* approve the voluntary slavery contract because it is Pareto superior?

  | Side | Prediction / Commitment |
  | :--- | :--- |
  | **Structuralist** | We commit that if the preferences are fully informed and rational (no coercion, no adaptive preference distortion), the social planner *must* accept the outcome. To reject it is to assert the planner knows the agents' good better than they do. We predict Skeptics cannot define "rights" without appealing to some underlying preference frustration that the theorem already captures. |
  | **Skeptic** | We commit that there are cases of "Harmless Wrongdoing" or "Consensual Degradation" where Pareto holds but moral intuition demands rejection. We predict that if the Structuralists accept the voluntary slavery case, they have abandoned the "well-being" justification for utilitarianism and admitted the theorem is purely procedural. If they reject it, they have abandoned the Pareto axiom, breaking the theorem. |

  ---

  ## 5. NOTE ON VERBAL VS. SUBSTANTIVE DISPUTES
  *We explicitly categorize the remaining friction points.*

  1.  **Verbal:** Whether the result $W = \sum a_i U_i$ deserves the label "Utilitarianism."
      *   *Resolution:* We agree to call it **"Harsanyi Aggregationism."** Structuralists may treat this as a species of utilitarianism; Skeptics may treat it as a distinct category. This does not affect the math or the policy prescriptions.
  2.  **Verbal:** Whether vNM utility is "preference" or "welfare."
      *   *Resolution:* This is substantive *only if* preference and welfare come apart empirically. If they are definitionally linked (Preference Satisfaction Theory of Welfare), the dispute is verbal. If they are distinct (e.g., Objective List Theory), it is substantive. We treat it as **Substantive** for the purpose of Crux A.
  3.  **Substantive:** The validity of the **Independence Axiom** in moral contexts.
      *   *Resolution:* Both sides agree this is the weakest link. If moral agents exhibit Allais-Paradox-type behavior (violating Independence) regarding justice vs. risk, the vNM framework collapses. This is an empirical/psychological claim about moral reasoning, not a definition.

  **Signed,**  
  *The Structuralist Camp*  
  *The Normative Skeptic Camp*
