      *   *Crux 2: The Pareto Condition's Status.* Is rejecting Pareto coherent for a moral theory? (e.g., Rights-based objections).
      *   *Crux 3: The Impartial Observer/Scaling.* Can we non-arbitrarily fix the weights $a_i$?
      *   *Selection:* Let's focus on (1) The Ontology of Utility (Preference vs. Welfare) and (2) The Normative Status of Pareto (Rationality vs. Morality). These are the big ones.

  6.  **Drafting Section 4: Concrete Arguments/Cases per Crux:**
