answer: |-
  This is a remarkably precise phenomenological description of a problem that is only beginning to receive adequate attention in the philosophy of technology and social epistemology. You are correct to sense that existing vocabulary—'deskilling', 'transactive memory', 'epistemic dependence'—captures facets of the phenomenon but fails to carve out the specific normative and cognitive structure you have identified.

  The crux of your observation is not merely that a capacity is lost (deskilling), nor that information is stored externally (transactive memory), but that the *feedback loop required to maintain evaluative understanding* is severed by the tool's seamless performance. You are describing a state where the *output* remains reliable, but the *grasp* of the coherence and justification underlying that output dissolves, thereby undermining the very capacity to recognise the dependence as problematic.

  Here is an analysis of the existing conceptual landscape, followed by a proposal for how to name and define this phenomenon for your work.

  ### 1. The Existing Conceptual Landscape

  There is no single canonical term that captures this exact configuration, but three distinct literatures converge upon it.

  **A. Epistemic Deskilling (Shannon Vallor)**
  You mentioned Vallor's work on moral deskilling, but it is worth noting that in *Technology and the Virtues* (2015), she explicitly addresses **epistemic virtues** (e.g., intellectual honesty, curiosity, humility). She argues that technologies can erode the habits of mind required to cultivate these virtues. However, Vallor's focus is largely *aretaic* (concerned with character and habit) rather than *structural* (concerned with the architecture of understanding). Your case is slightly distinct: it is not necessarily a vice of character (you are not being lazy), but a structural erosion of cognitive capacity caused by a broken feedback loop. While 'epistemic deskilling' is the nearest established term, it often connotes the loss of procedural ability rather than the loss of *understanding* (the 'grasp' of coherence).

  **B. The Paradox of Automation (Lisanne Bainbridge)**
  In human factors engineering, Bainbridge (1983) described the 'ironies of automation'. As a system becomes more sophisticated, the human operator's role shifts from active control to monitoring. However, because the system rarely fails, the operator loses the practice required to intervene when it *does* fail. This captures the **masking mechanism** you describe: the tool's success hides the user's decay. Yet, this is typically applied to manual or procedural control, not the epistemic grasp of dialectical structures or experimental design.

  **C. The Device Paradigm (Albert Borgmann)**
  Borgmann's distinction between 'focal practices' and 'devices' is highly relevant. A device (e.g., a thermostat) delivers a commodity (heat) while concealing the machinery and effort required to produce it. When cognitive tools function as 'devices' in Borgmann's sense, they deliver the *conclusion* while concealing the *reasoning*. This leads to a disengagement from the 'means'. Your description fits this perfectly: the AI delivers the 'commodity' (the reconstructed argument or survey design) while rendering the 'machinery' (the logical steps) opaque and eventually inaccessible to you.

  ### 2. The Conceptual Gap: Loss of Evaluative Capacity

  The specific nuance you are tracking is the loss of **meta-cognitive evaluative capacity**. In standard epistemic dependence (e.g., relying on a colleague), I retain the capacity to assess *whether* I should trust them. In your scenario, the tool's integration is so seamless that the occasion for assessment never arises, and the capacity to assess atrophies.

  This distinguishes it from:
  *   **Benign Extension:** Where the tool amplifies capacity without replacing the internal grasp (e.g., a calculator used by a mathematician who still understands the proofs).
  *   **Transactive Memory:** Where I forget *facts* but know *where* to find them. Here, you are losing the *method* of finding/verifying them.
  *   **Simple Deskilling:** Where I cannot type as fast without a keyboard. Here, you cannot *think* through the structure without the model.

  ### 3. Proposal: 'Epistemic Hollowing'

  Given the lack of a precise existing term, I propose you adopt or adapt the concept of **Epistemic Hollowing**.

  This term captures the topology of the phenomenon you describe: the external shell of competence (the output) remains intact, even improves, but the internal substance (the understanding) is removed. It distinguishes the phenomenon from 'deskilling' (which implies a reduction in output quality or procedural speed) and 'dependence' (which implies a stable relationship between two competent nodes).

  **Definition:**
  > **Epistemic Hollowing** is a diachronic process of cognitive offloading wherein the reliance on an opaque technological scaffold maintains or enhances output reliability while progressively eroding the agent's internal grasp of the justificatory structure underlying that output. Crucially, this erosion includes the loss of the meta-cognitive capacity required to detect the tool's errors or to rationally assess the dependence itself.

  **Key Components:**
  1.  **Output-Competence Retention:** The agent continues to produce high-quality results (distinguishing it from simple incompetence).
  2.  **Justificatory Erosion:** The agent loses the ability to reconstruct *why* the result is correct (distinguishing it from benign extension).
  3.  **Feedback Masking:** The tool's reliability prevents the error signals that would normally trigger skill maintenance (distinguishing it from voluntary neglect).
  4.  **Evaluative Atrophy:** The specific loss of the capacity to audit the tool (distinguishing it from standard epistemic dependence).

  ### 4. Boundary Cases and Distinctions

  To ensure the concept is robust for your thesis, you should delineate its boundaries clearly.

  **Boundary 1: Benign Cognitive Scaffolding**
  *   *Case:* A philosopher uses a reference manager (e.g., Zotero).
  *   *Distinction:* The tool manages the *storage* of citations, but the philosopher retains full grasp of the *argumentative relevance* of those citations. The tool does not reason *for* them.
  *   *Verdict:* Not hollowing. The justificatory structure remains internal.

  **Boundary 2: Collaborative Epistemic Dependence**
  *   *Case:* A philosopher relies on a statistician for complex analysis.
  *   *Distinction:* The philosopher knows they are relying on a distinct agent. They can articulate the limits of their own knowledge and the grounds for trusting the statistician. They retain the meta-cognitive map of the division of labour.
  *   *Verdict:* Not hollowing. The dependence is transparent and rationally assessable.

  **Boundary 3: Procedural Deskilling**
  *   *Case:* A writer loses the ability to spell manually due to spellcheck.
  *   *Distinction:* This is a low-level procedural loss. It does not necessarily impair the writer's understanding of grammar, syntax, or argumentation.
  *   *Verdict:* Deskilling, but not necessarily *epistemic hollowing*, unless the spelling loss prevents them from recognising semantic ambiguities.

  **Boundary 4: The 'Google Effect' (Transactive Memory)**
  *   *Case:* Forgetting a date because one knows it can be Googled.
  *   *Distinction:* This is factual offloading. The user retains the capacity to verify the fact and understand its context.
  *   *Verdict:* Not hollowing. The capacity to reason about the fact remains.

  ### 5. Why This Matters for Your Thesis

  Using 'Epistemic Hollowing' (or a similar formulation like **'Evaluative Atrophy via Opaque Scaffolding'**) allows you to make a normative claim that is distinct from Luddite anxieties. You are not arguing that tools are bad; you are arguing that *seamlessness* can be epistemically dangerous when it decouples output from understanding.

  This connects powerfully to the **epistemology of understanding** (e.g., work by Linda Zagzebski, Duncan Pritchard, or Stephen Grimm). Understanding is often defined as a 'grasp of coherence' or the ability to manipulate information in counterfactual scenarios ('what if this premise changed?'). Your phenomenon describes a state where an agent has **True Belief (via tool)** without **Understanding (internal)**, yet behaves *as if* they have understanding.

  ### Recommendation

  While 'Epistemic Deskilling' is the closest established term in the literature (and you should cite Vallor), I recommend you explicitly refine it for your purposes. You might frame your contribution as identifying a specific subtype of deskilling: **'Constitutive Epistemic Deskilling'** or **'Epistemic Hollowing'**.

  In your writing, you might define it thus:

  > *'Unlike standard deskilling, which denotes the loss of procedural capacity, or transactive memory, which denotes the offloading of factual storage, **Epistemic Hollowing** denotes the erosion of the justificatory grasp required to validate the output of a cognitive tool. It is characterised by the invisibility of the loss, as the tool's competence masks the agent's growing inability to assess the tool's reliability.'*

  This carving respects the nuance you have observed: it is not merely that you cannot *do* the task; it is that you can no longer *know* that the task has been done correctly without the tool. That is a distinctively epistemic crisis, and it deserves a name that reflects the loss of the 'inner' capacity amidst the retention of the 'outer' performance.
