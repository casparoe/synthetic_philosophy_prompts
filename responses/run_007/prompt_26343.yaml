answer: |-
  This is a profound and common problem in clinical ethics. You are standing exactly where the rubber meets the road in moral philosophy: the collision between **Precedent Autonomy** (Dworkin: the past competent self binds the future self) and **Experiential Interests** (Dresser/Jaworska: the current self has moral standing and rights to well-being).

  The inconsistency you describe usually happens because committee members are silently prioritizing different frameworks. Some are "Dworkinians" (the signature on the document is sacred); others are "Best Interest" advocates (the smiling patient in front of us matters most).

  Below is a structured decision tool designed to run in 45 minutes. It does not solve the metaphysical question of personal identity. Instead, it bypasses it by focusing on **harm** and **authority**. It treats the Advance Directive (AD) as a presumptive authority that can be overridden only by specific evidence of current harm or prior misconception.

  ### The Prior-Present Interest Balancing Protocol (PPIBP)

  **Time:** 45 Minutes
  **Facilitator:** Ethics Committee Chair or Designee
  **Goal:** Move from "Who is the real person?" to "Whose interests carry more weight in this specific decision?"

  ---

  #### Phase 1: The Threshold Check (Facts Only)
  **Time:** 5 Minutes
  **Normative Load:** Low. This establishes the playing field.

  **Questions:**
  1.  **Validity:** Is the AD legally valid and was the patient demonstrably competent when signing it?
  2.  **Applicability:** Does the current medical condition match the condition specified in the AD? (e.g., AD says "terminal condition," patient has "severe dementia + pneumonia." Is pneumonia terminal *for this patient*?)
  3.  **Surrogate Status:** Is there a legally appointed healthcare proxy? If yes, what is their recommendation? (Note: A proxy usually *enforces* the AD, but can sometimes override it if they have specific evidence of changed wishes. Clarify their legal standing in your jurisdiction).

  **Guidance:** If the AD is invalid or medically inapplicable, stop. Follow standard surrogate decision-making. If valid and applicable, proceed to Phase 2.

  ---

  #### Phase 2: The "Prediction Accuracy" Check (Facts + Normative)
  **Time:** 10 Minutes
  **Normative Load:** Medium. This tests whether the past self was making an informed choice about *this* reality.

  **The Core Question:** *Did the patient's prior refusal rely on a factual assumption that is now proven false?*

  **Discussion Points:**
  *   Many ADs are written based on a fear of *suffering* ("I don't want to be a vegetable," "I don't want to suffer").
  *   If the patient is currently **not** suffering (e.g., enjoys pudding, smiles, no signs of distress), the condition the patient feared may not have materialized.
  *   **Key Distinction:** Did they refuse treatment because they feared *loss of dignity/cognitive capacity* (which is present) OR because they feared *pain/burden* (which is absent)?

  **Scoring:**
  *   **High Mismatch:** AD was based on avoiding suffering; patient is not suffering. (Points toward overriding AD).
  *   **Low Mismatch:** AD was based on avoiding a specific state of existence (e.g., "If I cannot recognize my children"), regardless of comfort. That state is present. (Points toward following AD).

  ---

  #### Phase 3: The Current Experiential Assessment (Facts + Normative)
  **Time:** 10 Minutes
  **Normative Load:** High. This is the Dresser/Jaworska check.

  **The Core Question:** *What is the net balance of harm and benefit for the patient **right now**?*

  **Discussion Points:**
  *   Do not ask "Is this life worth living?" Ask "Is this treatment a burden or a benefit to the *current* consciousness?"
  *   **Burden:** Is the treatment painful? Restrictive? Does it cause agitation (common in dementia)?
  *   **Benefit:** Does it relieve dyspnea? Pain? Does it allow continued engagement with pleasant stimuli (food, family, music)?
  *   **Capacity for Valuing (Jaworska):** Does the patient show attachment to caregivers or enjoyment of activities? If yes, they have "experiential interests" that deserve protection.

  **Scoring:**
  *   **High Current Burden:** Treatment causes significant agitation/pain. (Points toward following AD/Withholding).
  *   **Low Current Burden/High Benefit:** Treatment is easy (oral antibiotics) and restores comfort. (Points toward overriding AD/Treating).

  ---

  #### Phase 4: The Integrity & Trust Check (Normative)
  **Time:** 10 Minutes
  **Normative Load:** High. This is the Dworkin check.

  **The Core Question:** *What is the moral cost of ignoring the directive?*

  **Discussion Points:**
  *   **Integrity of the Life Narrative:** Did this person define their life by independence and control? Allowing them to exist in a state they deemed "undignified" may violate their critical interests, even if they don't know it.
  *   **Social Trust:** If we routinely override ADs when patients seem "happy," will people stop trusting ADs? (Does this matter for *this* patient? No. Does it matter for society? Yes.)
  *   **The "Ulysses" Factor:** Did the patient anticipate they might feel "happy" in dementia but reject that happiness as delusional? (Some ADs explicitly state: "Even if I seem happy, do not treat me.")

  **Scoring:**
  *   **Specific Warning:** AD explicitly says "Even if I seem content..." (Points strongly toward following AD).
  *   **General Value Statement:** AD says "No heroic measures" without specific context. (Points toward flexibility).

  ---

  #### Phase 5: The Decision Matrix (Synthesis)
  **Time:** 10 Minutes
  **Normative Load:** Final Judgment.

  Combine the scores from Phases 2, 3, and 4.

  | Scenario | Prediction Accuracy (Phase 2) | Current Burden (Phase 3) | Integrity Cost (Phase 4) | **Recommendation** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | High Mismatch (Feared suffering, none present) | Low Burden (Tx is easy) | Low (General AD language) | **OVERRIDE AD (Treat)** |
  | **B** | Low Mismatch (Feared this exact state) | High Burden (Tx is invasive) | High (Specific values) | **FOLLOW AD (Withhold)** |
  | **C** | Low Mismatch (Feared this exact state) | Low Burden (Tx is easy) | High (Specific values) | **JUDGMENT CALL** (See below) |
  | **D** | High Mismatch (Feared suffering, none present) | High Burden (Tx is invasive) | Low (General AD language) | **FOLLOW AD (Withhold)** |

  **Guidance for "Judgment Call" (Scenario C):**
  This is the hardest case (e.g., Patient wrote "No life support if I have severe dementia," now has dementia, seems happy, needs simple antibiotics).
  *   **Default Position:** In Scenario C, the protocol defaults to **TREATING**.
  *   **Rationale:** The harm of death is irreversible and total. The harm of violating precedent autonomy is serious but abstract. When the current patient is not suffering and the treatment is low-burden, the "benefit of the doubt" goes to the living being.
  *   **Exception:** If the AD contains *explicit* language anticipating this scenario ("Even if I seem happy, I do not want to live in this state"), the default flips to **WITHHOLD**.

  ---

  ### Normative Transparency: Where the Work Happens

  It is vital your committee knows that this tool is not value-neutral.
  1.  **Phase 2** privileges the *factual basis* of the prior wish. It assumes a wish based on false facts is less binding.
  2.  **Phase 3** privileges the *current subject*. It assumes the demented patient's pain/pleasure counts morally (Dresser).
  3.  **Phase 5 (The Default)** privileges *life/present interest* over *past autonomy* in cases of ambiguity. This is a conscious choice. A pure Dworkinian tool would default to the AD in all ties. This tool defaults to the living patient unless the AD is explicit.

  **On Personal Identity:**
  Notice the tool never asks, "Is this the same person?" It asks, "Does the past person's instruction apply to this medical situation, and does following it harm the current person?" This allows a chaplain and a neurologist to agree on the process without agreeing on metaphysics.

  ---

  ### Testing the Procedure

  Here is how the protocol performs on two structurally similar but distinct cases.

  #### Case 1: The "Happy Dementia" (Your Classic Case)
  *   **Facts:** 82F, severe dementia. AD refuses antibiotics for pneumonia in "late stage dementia." She is non-verbal but smiles, eats pudding, holds hands. Family wants treatment.
  *   **Phase 1:** AD Valid. Condition matches.
  *   **Phase 2 (Prediction):** **High Mismatch.** Most ADs refuse treatment fearing suffering/loss of dignity. She is not suffering. She likely did not foresee being *content*.
  *   **Phase 3 (Current Burden):** **Low Burden.** Antibiotics are oral or IV, low pain. Benefit is relief of dyspnea/fever.
  *   **Phase 4 (Integrity):** **Low/Medium.** Standard AD language ("no heroic measures"). No explicit clause about "even if I seem happy."
  *   **Matrix:** Matches **Scenario A**.
  *   **Recommendation:** **OVERRIDE AD (Treat).**
  *   **Committee Experience:** This feels right to most clinicians. It validates the family's observation that she isn't suffering.

  #### Case 2: The "Specific Value" (The Counter-Intuitive Test)
  *   **Facts:** 75M, TBI 5 years ago, now cognitively impaired similar to dementia. AD refuses feeding tube if he "cannot recognize his wife or engage in conversation." He currently does not recognize his wife, babbles, but seems content, listens to music, enjoys massages. He has developed a swallowing disorder. Family wants the tube placed; they say he enjoys life.
  *   **Phase 1:** AD Valid. Condition matches (cannot recognize/engage).
  *   **Phase 2 (Prediction):** **Low Mismatch.** He wrote the AD specifically about *recognition and engagement*, not just suffering. He explicitly tied his worth to relational capacity. That capacity is gone.
  *   **Phase 3 (Current Burden):** **Medium Burden.** Feeding tube is invasive, requires restraint sometimes to prevent pulling. But it prevents starvation.
  *   **Phase 4 (Integrity):** **High.** His core value was relational agency. Keeping him alive biologically violates the specific narrative he constructed for his life.
  *   **Matrix:** Matches **Scenario B/C border**. Because the AD was specific about *recognition*, the "Judgment Call" default flips.
  *   **Recommendation:** **FOLLOW AD (Withhold Tube).**
  *   **Committee Experience:** **This is the hard one.**
      *   *Why it feels wrong:* The patient is *here*. He enjoys music. He is not in pain. Denying food feels like killing a happy man.
      *   *Why the tool says it:* The tool respects that his *critical interest* (being a husband/partner) was more important to him than his *experiential interest* (enjoying music). To override this is to say, "You were wrong about what made your life valuable."
      *   *My Assessment:* As an AI, I do not have personal moral intuitions. However, I can identify that this outcome conflicts with a "Best Interest/Non-Maleficence" framework. Many clinicians will feel deep moral distress here. The tool forces you to acknowledge that **respecting autonomy sometimes requires allowing a content patient to die.** If your committee cannot stomach this, you must admit you are prioritizing "Sanctity of Life/Current Well-being" over "Autonomy," and adjust Phase 5 accordingly.

  ### Implementation Advice

  1.  **The "Dissent" Box:** On the committee worksheet, include a box for "Minority Opinion." If the tool says "Withhold" but 3 members feel strongly it's wrong, document that. Consistency is good, but moral distress is a risk factor for burnout.
  2.  **Training:** Run a 1-hour training with your committee using Case 2. If everyone rebels against the result, your committee culture is more "Dresser" than "Dworkin." You should then adjust Phase 5 to require *explicit* AD language to override current well-being.
  3.  **Family Communication:** When overriding an AD (Case 1), tell the family: "We are treating because the directive was based on avoiding suffering, and she is not suffering." When following an AD (Case 2), tell them: "We are honoring his specific definition of a life worth living, which was about connecting with you. We know he finds joy now, but he told us that joy wasn't enough without that connection."

  ### Limitations

  *   **Time:** If the family is combative, 45 minutes is not enough. This tool assumes good-faith deliberation.
  *   **The "Happy" Assessment:** Assessing happiness in severe dementia is subjective. A social worker's input here is more valuable than a physician's.
  *   **Legal Risk:** In some jurisdictions, a valid AD is legally binding regardless of current happiness. Ensure your legal counsel reviews Phase 5.

  This tool does not remove the tragedy from these cases. It simply ensures that when you make the decision, you know *why* you made it, and that you aren't making it for a different reason than you did last month.
