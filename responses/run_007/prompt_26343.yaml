prompt: |-
  I'm on the ethics committee at a mid-sized hospital, and we get maybe three or four cases a year where an advance directive says one thing but the patient, now cognitively impaired (dementia, usually, sometimes a TBI), seems to want something else. The classic case: a woman writes an advance directive refusing antibiotics for pneumonia if she ever has severe dementia, then ten years later she has severe dementia and gets pneumonia, and she seems perfectly content, smiles at visitors, enjoys pudding. The directive says let her die; the family says she's clearly not suffering. Our committee has to make a recommendation, and honestly we're just winging it each time — different members invoke different principles, we split along the same lines every meeting, and there's no consistency across cases. Last month we had two cases that were structurally identical and we went opposite ways, which nobody felt great about.

  I've been reading some of the philosophy on this — Dworkin on precedent autonomy, Dresser on experiential interests, Jaworska on the capacities that survive in dementia — and I want to turn whatever the best philosophical account is into an actual procedure we can run. Not a policy exactly, more like a structured decision tool: a sequence of questions we ask about each case, with guidance on what counts as a sufficient answer, where the procedure says "follow the directive," where it says "override the directive," and where it says "this is a judgment call, here's what's at stake and who should make it." The procedure has to be usable by a committee of clinicians, social workers, a chaplain, and one community member — most of whom haven't read any of this stuff. It should take maybe 45 minutes to run. And it should be honest about which steps are doing real normative work versus which are just clarifying facts. If the procedure sometimes tells us to do something that feels wrong, I want to know that too — test it on at least two cases, including one where it gives an answer you wouldn't personally endorse. Also, one thing I've noticed is that a lot of the philosophical debate turns on whether the demented patient is "the same person" as the one who wrote the directive, and I'm not sure our committee even has a working view on personal identity, so the procedure should either avoid that question entirely or give us a way to answer it without doing metaphysics.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a hospital ethics committee.
      *   **Problem:** Inconsistent handling of cases where advance directives (AD) conflict with the current apparent wishes/well-being of cognitively impaired patients (dementia/TBI).
      *   **Goal:** Create a structured decision tool/procedure (not just a policy) based on the best philosophical accounts (Dworkin, Dresser, Jaworska, etc.).
      *   **Constraints:**
          *   Usable by a mixed committee (clinicians, social workers, chaplain, community member).
          *   No deep philosophical knowledge required.
          *   Time limit: ~45 minutes.
          *   Must distinguish factual clarification from normative work.
          *   Must test on at least two cases (including one where the AI might "disagree" with the outcome to show honesty/robustness).
          *   Must address (or bypass) the "personal identity" problem.
          *   Needs to provide clear outputs: "Follow AD," "Override AD," or "Judgment Call."

  2.  **Philosophical Landscape & Synthesis:**
      *   *Ronald Dworkin (Precedent Autonomy):* The past competent self has authority over the future incompetent self. Critical interests (values, life narrative) trump experiential interests (pleasure/pain). *Verdict:* Follow the AD.
      *   *Rebecca Dresser (Experiential Interests):* The demented patient is a different moral entity. We owe duties to the *current* patient, not just the past one. Suffering and enjoyment matter now. *Verdict:* Often override AD if current life is pleasant.
      *   *Agnieszka Jaworska (Capacity for Valuing):* Even in dementia, some capacity for valuing/caring remains. If the patient can still form attachments or care about their existence, they have moral standing. *Verdict:* Nuanced; looks at the depth of current engagement.
      *   *Personal Identity:* This is the metaphysical trap. The committee shouldn't debate whether Soul A = Soul B. Instead, focus on *moral authority* and *harm*.
      *   *Synthesis for a Clinical Tool:* A pure Dworkin approach feels too rigid (letting a happy patient die). A pure Dresser approach undermines the purpose of ADs (planning for the worst). A hybrid approach is needed, often called the "Ulysses Contract with a Safety Valve" or a "Sliding Scale of Harm/Benefit."
      *   *Selected Framework:* I will adapt a **"Weighted Interest Balancing"** model. It acknowledges the AD's authority but allows for override if the *current* burden is high and the *past* intent was based on false assumptions. It avoids metaphysics by focusing on *harm* and *consistency of values*.

  3.  **Drafting the Procedure (The "AD-Conflict Resolution Protocol"):**
      *   *Structure:* Needs to be step-by-step.
      *   *Time:* 45 minutes means roughly 5-7 steps, 5-7 mins each.
      *   *Steps:*
          1.  Fact Check (Validity & Capacity).
          2.  The "Misapplication" Check (Did the scenario match the prediction?).
          3.  Current Well-being Assessment (The Dresser/Jaworska check).
          4.  The "Harm of Override" Check (What does ignoring the AD do to trust/integrity?).
          5.  Decision Matrix.
      *   *Avoiding Metaphysics:* Don't ask "Is she the same person?" Ask "Does the current state violate the core values the AD was meant to protect, or does treating her violate her current basic interests?"

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1 (Validity):* Is the AD legal? Was the patient competent when writing it? (Standard stuff).
      *   *Step 2 (Applicability):* Is this *exactly* what they feared? (e.g., Did they fear "suffering" but now they aren't suffering?). This is crucial. Many ADs are based on a misconception of what dementia feels like.
      *   *Step 3 (Current State):* Is the patient experiencing net positive or negative? (Pain, distress vs. joy, comfort).
      *   *Step 4 (The "Bridge"):* Can we reconcile? (e.g., Treat the pneumonia but agree no intubation later).
      *   *Step 5 (Decision):* Weighing the scales.

  5.  **Addressing the "Normative Work" Requirement:**
      *   I need to explicitly label which steps are factual (gathering data) and which are normative (making value judgments).
      *   I need to explain *why* the procedure leans a certain way philosophically without using jargon.

  6.  **Testing the Procedure (Case Studies):**
      *   *Case 1 (The Classic):* Happy dementia, pneumonia, AD refuses antibiotics.
          *   *Procedure Outcome:* Likely "Override AD" or "Judgment Call." Why? Because the harm of death is high, current suffering is low, and the AD might be based on a misconception of "dignity."
          *   *AI Critique:* I need to show a case where the procedure says "Follow AD" even if it feels sad, or "Override" even if it feels risky. Let's make Case 1 a "Follow AD" scenario to test the Dworkin side, or an "Override" to test the Dresser side. Let's go with the user's example: Happy patient, AD refuses tx.
          *   *Procedure Logic:* If the AD was specific about *this* state (severe dementia + pneumonia) and the patient is *not* suffering, Dworkin says treat as death. Dresser says treat as life. A balanced tool might lean toward treatment *unless* the AD evidence is overwhelming. Let's design the tool to prioritize *avoiding current suffering* but respecting *clear prior values*.
          *   *Revision:* Actually, to show the tool's bite, I should construct a case where the tool says "Follow the Directive" even though the patient looks happy. This tests the "Precedent Autonomy" muscle.
          *   *Wait, the prompt asks for:* "Test it on at least two cases, including one where it gives an answer you wouldn't personally endorse."
          *   *Strategy:* I will run the tool on the "Happy Dementia" case. I will personally lean towards treatment (Dresser/Jaworska). If the tool is weighted heavily toward Autonomy (Dworkin), it might say "Withhold." That works. OR, if the tool is weighted toward Well-being, it might say "Treat" even if the AD was very specific.
          *   *Better Strategy:* I will design the tool to be balanced. Then I will present a case where the tool says "Withhold Treatment" (Follow AD) because the prior values were specific and robust, even though the patient seems content. I will then note that *I* (the AI) might lean towards treatment, showing the tension.
          *   *Actually, let's look at the "Personally Endorse" constraint.* As an AI, I don't have personal endorsements. I should interpret this as "an answer that contradicts common intuition" or "an answer that highlights the tool's limitations." I will frame it as "an outcome that might feel counter-intuitive to a care-focused clinician."
          *   *Case 1:* The "Happy Dementia" case. Tool says: **Treat (Override AD).** (Aligns with intuition).
          *   *Case 2:* The "Specific Value" case. Patient wrote AD refusing feeding tube not because of suffering, but because "I do not want to be kept alive by machines if I cannot recognize my family." Now she can't recognize family, is fed via tube, seems content. Tool says: **Withhold (Follow AD).** This might feel wrong to some (she's happy), but respects the specific value.
          *   *Wait, I need to be careful.* If the tool is good, it shouldn't produce "wrong" answers. The prompt asks me to be honest: "If the procedure sometimes tells us to do something that feels wrong, I want to know that too."
          *   *Okay, Plan:* I will build the tool. I will test it on Case A (Happy Dementia/Pneumonia). I will test it on Case B (TBI/Agitation). I will explicitly note where the tool's output might clash with a "best interest" intuition.

  7.  **Addressing Personal Identity:**
      *   Explicitly state in the intro: "We do not decide if this is the 'same person.' We decide whose interests carry more weight *in this specific medical context*."

  8.  **Finalizing the Tool Structure:**
      *   **Name:** The "Prior vs. Present Interest Protocol" (PPIP).
      *   **Phases:**
          1.  Threshold Check (Validity).
          2.  The "Prediction Accuracy" Check (Did they foresee this?).
          3.  The "Current Suffering" Check (Dresser).
          4.  The "Core Value" Check (Dworkin).
          5.  The Decision Matrix.
      *   **Time:** 5 mins per phase + 10 mins deliberation = ~35-45 mins.

  9.  **Writing the Response:**
      *   *Tone:* Professional, practical, philosophically grounded but jargon-free.
      *   *Structure:*
          1.  Introduction (Acknowledging the difficulty, stating the philosophical synthesis).
          2.  The Procedure (Step-by-step).
          3.  Normative Transparency (Where the value judgments happen).
          4.  Case Studies (Testing the tool).
          5.  Limitations (Where it might feel wrong).
          6.  Implementation Tips.

  10. **Refining the "Personal Identity" Constraint:**
      *   Make sure Step 1 explicitly bypasses this. "Do not debate identity. Debate authority."

  11. **Refining the "Personally Endorse" Constraint:**
      *   I need to be careful here. As an AI, I don't have moral agency. I will interpret this as "an outcome that conflicts with a strong 'sanctity of life' or 'pure autonomy' intuition." I will choose a case where the tool recommends *following the AD to withhold treatment* on a patient who appears content, acknowledging that this feels harsh to many clinicians (the "Dworkin hard line").

  12. **Self-Correction/Review during drafting:**
      *   *Critique:* Is 45 minutes realistic?
      *   *Fix:* Keep the questions tight. Use a scoring system or a flowchart logic. Let's use a "Weighted Factors" approach rather than a rigid algorithm, but with clear guidance on how to weigh.
      *   *Critique:* Is the philosophy accurate?
      *   *Fix:* Ensure Dworkin (Critical Interests) and Dresser (Experiential Interests) are represented fairly. Jaworska helps with the "capacity to care" aspect.
      *   *Critique:* Is it usable?
      *   *Fix:* Add a "Facilitator Script" vibe to the steps.

  13. **Final Polish:** Check against all constraints one last time.
      *   Mid-sized hospital context? Yes.
      *   3-4 cases/year? Yes, tool needs to be robust but not bureaucratic.
      *   Mixed committee? Yes, language must be accessible.
      *   45 mins? Yes.
      *   Normative vs Factual? Yes, labeled.
      *   Test cases? Yes.
      *   Personal Identity? Yes, bypassed.

  *(Self-Correction on the "Personally Endorse" part)*: I will explicitly state: "In Case 2, the tool recommends withholding treatment. Many clinicians find this counter-intuitive when the patient appears happy. This is a feature, not a bug, of prioritizing precedent autonomy, but it must be acknowledged."

  Let's build the **"Prior-Present Interest Balancing Protocol (PPIBP)"**.

  *Step 1: Validity & Applicability (Facts)*
  *Step 2: Current Experiential State (Facts + Normative)*
  *Step 3: The "Why" of the Directive (Normative)*
  *Step 4: The Reconciliation Check (Normative)*
  *Step 5: Decision Matrix (Normative)*

