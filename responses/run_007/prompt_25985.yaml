prompt: |-
  I run a reading group on metaethics — about 12 people, mostly grad students but some faculty, 90-minute sessions. I want an activity that makes them feel, not just discuss, the problem of distinguishing genuine moral preferences from biases. The idea is: by the end, they should be genuinely uncertain whether some of their own moral convictions survive the debunking challenge, and they should see why the distinction is so slippery.

  Here's what I'm picturing: you give them a set of moral cases (maybe 5-6) and they privately record their judgments. Then you reveal information about each case — framing effects, cultural variation data, evolutionary explanations, or evidence that their judgment flips under irrelevant changes. At each stage they have to say whether they still endorse their original judgment and why. The debrief should map their experience onto the philosophical terrain: evolutionary debunking, the reliability challenge to moral intuitions, the difference between explaining and explaining away, and the problem that there's no agreed test for when a moral conviction is a bias rather than a preference.

  Rules, materials, timeline for 90 minutes, and an honest note on what the activity can't capture — I'm guessing it can make the problem vivid but can't resolve it (obviously), and it might tilt people toward skepticism more than the arguments warrant. Also tell me what will predictably go wrong and how to handle it.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Metaethics reading group, 12 people (grad students + faculty), 90 minutes.
      *   **Goal:** Make participants *feel* the problem of distinguishing genuine moral preferences from biases (debunking challenges), not just discuss it. Create genuine uncertainty about their own convictions. Show why the distinction is slippery.
      *   **Proposed Structure:** Private judgments on cases $\rightarrow$ Reveal debunking info (framing, culture, evolution, etc.) $\rightarrow$ Re-evaluate $\rightarrow$ Debrief mapping to philosophical terrain.
      *   **Requirements:** Rules, materials, timeline (90 mins), honest limitations (what it can't capture, risk of skepticism), predictable pitfalls + handling.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The "Debunking Challenge" (Street, Joyce, etc.): If our moral beliefs are explained by evolutionary/cultural forces that are independent of moral truth, do we have justification for them?
      *   The "Distinction Problem": How do we tell which intuitions are "tracking truth" vs. "tracking fitness/social cohesion"?
      *   The "Feeling": We need to induce *epistemic anxiety*. Participants need to feel their ground shifting beneath them.

  3.  **Drafting the Activity Design:**
      *   *Name:* "The Intuition Audit" or "The Debunking Gauntlet." Let's go with "The Intuition Audit."
      *   *Materials:* Need specific cases. They shouldn't be too obvious (e.g., "is murder wrong?") nor too abstract. They need to be standard trolley-style or purity/disgust cases where framing matters.
      *   *Phases:*
          1.  Intro (5 mins)
          2.  Round 1: Judgment (10 mins)
          3.  Round 2: The Reveal/Debunk (20 mins)
          4.  Round 3: Re-evaluation & Discussion (25 mins)
          5.  Debrief/Philosophical Mapping (25 mins)
          6.  Closing (5 mins)
          *Wait, that's 90 mins.* Let's refine the timing.
      *   *The Cases:* Need 3-4 strong cases, not 5-6 (too rushed for 12 people).
          *   Case 1: Harm/Frame (Trolley variant).
          *   Case 2: Disgust/Purity (Harmless taboo).
          *   Case 3: In-Group/Out-Group (Partiality).
      *   *The "Reveal":* This is the crucial mechanic. It needs to be presented as empirical data or logical equivalence that undermines the *reason* for the judgment, not just the judgment itself.

  4.  **Developing the "Feel":**
      *   To make them *feel* it, anonymity is key initially, but public commitment later creates tension.
      *   Use a "Confidence Slider." Not just Yes/No, but "How confident are you?" This quantifies the erosion of certainty.
      *   The facilitator needs to play the "Skeptic" role during the reveal, gently pressing on *why* they hold the view if the stated reason is undermined.

  5.  **Addressing Limitations & Pitfalls:**
      *   *Limitation:* It induces skepticism but doesn't offer a solution (realist vs. anti-realist). It might feel like a "gotcha."
      *   *Pitfall 1:* Faculty dominating. *Fix:* Private writing first.
      *   *Pitfall 2:* Participants digging in defensively. *Fix:* Frame it as "testing the mechanism," not "attacking the person."
      *   *Pitfall 3:* The "So What?" reaction. *Fix:* Connect explicitly to the "Explaining vs. Explaining Away" distinction in the debrief.

  6.  **Refining the Timeline:**
      *   Intro: 5 min.
      *   Phase 1 (Baseline): 10 min.
      *   Phase 2 (The Undermining): 25 min. (This needs time to sink in).
      *   Phase 3 (Group Discussion): 25 min.
      *   Phase 4 (Meta-Ethical Debrief): 20 min.
      *   Wrap: 5 min.
      *   Total: 90 min.

  7.  **Selecting Specific Cases (Crucial Step):**
      *   *Case A (Framing):* The Asian Disease Problem (Tversky/Kahneman) adapted to moral obligation. Gain vs. Loss framing.
      *   *Case B (Disgust):* Haidt's "Julie and Mark" (incest) or "Chicken and Flag." Let's use a modified Haidt case where harm is explicitly ruled out.
      *   *Case C (Order/Sequence):* Judgments change based on the order questions are asked (order effects).
      *   *Wait, better idea:* Use *equivalent* cases presented differently.
          *   Case 1: The "Push" vs. "Switch" (Standard, but maybe too known). Let's use *Omission vs. Commission* with equivalent outcomes.
          *   Case 2: *Cultural/Arbitrary Rule.* A rule that feels wrong but is shown to be locally contingent.
          *   Case 3: *Evolutionary Mismatch.* A judgment that served fitness but seems morally irrelevant now (e.g., sexual purity).

      *Decision:* Let's stick to the prompt's suggestion of revealing info *after* judgment.
      1.  **The Framing Case:** Moral obligation framed as loss vs. gain.
      2.  **The Disgust Case:** Harmless taboo (Haidt style).
      3.  **The Irrelevant Feature Case:** A case where judgment flips based on something morally irrelevant (e.g., font color, time of day, or order). Let's go with *Order Effects* or *Linguistic Framing*.

      *Actually, for a metaethics group, they might know the standard psych experiments.* I need to make it personal.
      *Revised Plan:* Use 3 scenarios.
      1.  **The "Yuck" Factor:** Harmless taboo.
      2.  **The "Distance" Factor:** Identical harm, different physical proximity (evolutionary explanation).
      3.  **The "Frame" Factor:** Logically identical outcomes, different wording.

  8.  **Drafting the Content:**
      *   *Handouts:* Need to be clean.
      *   *Facilitator Script:* Needs to be neutral but probing.
      *   *Debrief Questions:* Connect to Street, Joyce, Kornblith.

  9.  **Addressing the "Honest Note":**
      *   Must acknowledge that feeling uncertain isn't an argument for skepticism.
      *   Must acknowledge that realists have responses (e.g., reflective equilibrium, third-factor explanations).
      *   Risk of "paralysis."

  10. **Review against Constraints:**
      *   12 people? Yes, small enough for discussion.
      *   90 mins? Yes, tight but doable.
      *   Grad/Faculty mix? Need to ensure faculty don't lecture.
      *   Goal: *Feel* the problem. The "Confidence Slider" is the best tool for this.

  11. **Final Polish:**
      *   Make sure the "Reveal" isn't just "Psychology says X." It needs to be "Here is the causal explanation for your judgment. Does that explanation track truth?"
      *   Add a specific instruction on "Epistemic Humility."

  *(Self-Correction during drafting)*: I initially thought about using 5-6 cases. For 90 minutes with 12 people, that's too many. 3 deep dives are better than 6 shallow ones. I will recommend 3 cases.
  Also, I need to make sure the "Reveal" doesn't feel like a trick. It must be presented as "Here is the empirical literature on this specific intuition."

  Let's structure the response clearly: Overview, Materials, Timeline, The Cases (with scripts), Debrief, Limitations/Pitfalls.

  *Wait, one more thing:* The prompt asks for an "honest note on what the activity can't capture." I need to emphasize that *phenomenological uncertainty* $\neq$ *justificatory defeat*. Just because you feel shaky doesn't mean the belief is false. This is a crucial metaethical distinction.

  Okay, ready to write.
answer: |-
  This is a high-stakes pedagogical design. You are asking participants to undergo a mild form of *epistemic vertigo*. To do this safely and productively in 90 minutes, the activity must be tightly facilitated. If it feels like a "gotcha" trick, faculty will shut down and grad students will perform skepticism rather than feel it.

  Here is a complete design for **"The Intuition Audit."**

  ### **Activity Overview**
  *   **Goal:** Induce first-personal uncertainty about the genealogy of moral judgments to simulate the Debunking Challenge.
  *   **Mechanism:** Participants make confident judgments, then are presented with causal explanations for those judgments that are independent of moral truth. They must rate their confidence before and after the reveal.
  *   **Group Size:** 12 (Ideal for breaking into triads later).
  *   **Time:** 90 Minutes.

  ---

  ### **Materials Needed**
  1.  **Response Sheets:** One per person. Three sections (Case A, B, C). Each section has:
      *   The Scenario.
      *   Judgment (Wrong / Permissible / Obligatory).
      *   **Confidence Slider (0–100%).**
      *   *Post-Reveal* Confidence Slider (0–100%).
      *   Space for "Reason for Shift."
  2.  **Projector/Slides:** For revealing the "Debunking Data."
  3.  **Timer:** Visible to you.

  ---

  ### **Timeline (90 Minutes)**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Frame the rules. Emphasize anonymity and the goal (phenomenology, not consensus). |
  | **05–20** | **Phase 1: Baseline** | Participants read 3 cases privately. Record Judgment + Confidence. |
  | **20–45** | **Phase 2: The Audit** | Reveal "Debunking Data" for each case sequentially. Participants adjust confidence privately. |
  | **45–70** | **Phase 3: Triad Talk** | Break into groups of 3. Discuss which judgments survived and why. |
  | **70–85** | **Phase 4: Debrief** | Map experience to metaethical concepts (Street, Joyce, Reflective Equilibrium). |
  | **85–90** | **Close** | Final reflection and resource distribution. |

  ---

  ### **The Cases & The "Reveal" (Facilitator Script)**

  Do not discuss the cases between Phase 1 and Phase 2. Collect the sheets (or have them hide their initial scores) before revealing the data.

  #### **Case 1: The Disgust Intuition (Haidt-Style)**
  *   **Scenario:** "A grown brother and sister, both consenting adults, use protection during a single instance of sexual intimacy. They feel closer afterward. No one else ever knows. No physical or psychological harm occurs."
  *   **Task:** Is this morally wrong? Rate Confidence.
  *   **The Reveal:** "Empirical literature (Haidt, Haidt & Joseph) shows this judgment correlates strongly with individual sensitivity to *disgust* and *purity*, not harm. When subjects are hypnotically induced to feel disgust, condemnation rises; when asked to articulate harm, they struggle ('moral dumbfounding'). The judgment tracks a visceral reaction evolved for pathogen avoidance, repurposed for social norms."
  *   **The Challenge:** "If your judgment is driven by a mechanism designed to avoid rotting meat, does it track moral truth?"

  #### **Case 2: The Proximity Intuition (Evolutionary Mismatch)**
  *   **Scenario:** "You can save a life. Option A: Push a button that transfers $5,000 from your account to save a stranger overseas. Option B: Push a button that saves a stranger in your room. In both cases, the cost to you and the life saved are identical."
  *   **Task:** Is there a stronger moral obligation in B than A? Rate Confidence.
  *   **The Reveal:** "Evolutionary psychology suggests we have strong kin/proximity selection mechanisms. We are wired to respond to visible, proximate distress (the 'identifiable victim effect'). The moral difference you feel correlates with the activation of empathy circuits triggered by physical presence, not a rational assessment of welfare."
  *   **The Challenge:** "If the distinction relies on a cognitive limitation (inability to feel for distant strangers) rather than a moral difference, is the distinction justified?"

  #### **Case 3: The Framing Intuition (Linguistic Arbitrariness)**
  *   **Scenario:** "A medical policy will result in 600 deaths. Program X: 400 people will die. Program Y: 200 people will be saved." (Present half the room with X, half with Y, or present both as equivalent).
  *   *Correction for Metaethics Group:* Let's use a deontological frame.
  *   **Scenario:** "A trolley will kill 5. You can flip a switch to kill 1. (Switch). vs. You can push a man to stop the trolley, killing 1. (Push)."
  *   **Task:** Is Switch permissible and Push wrong? Rate Confidence.
  *   **The Reveal:** "Neuroimaging (Greene et al.) shows 'Push' cases trigger emotional processing areas (amygdala/mPFC) while 'Switch' cases trigger cognitive control areas. The 'doctrine of double effect' may be a post-hoc rationalization of a brute emotional response to personal force. When cognitive load is increased, people become more utilitarian in Push cases."
  *   **The Challenge:** "If your deontological constraint disappears under cognitive load or maps onto emotional arousal, is it a moral principle or a heuristic?"

  ---

  ### **Phase 3: Triad Talk (25 Mins)**
  Break into groups of 3. Give them these specific prompts:
  1.  Which confidence score dropped the most? Why?
  2.  Did anyone's confidence *stay* at 100%? What insulated that judgment?
  3.  **Crucial Question:** "Does knowing the *cause* of your belief give you a reason to *abandon* it, or just a reason to find a new justification for it?"

  ---

  ### **Phase 4: Philosophical Debrief (15 Mins)**
  Bring the room back together. Map their feelings to the literature.

  1.  **Explaining vs. Explaining Away:**
      *   *Ask:* "When I told you the evolutionary cause, did you feel the justification vanished (explaining away) or just that you now understood the origin (explaining)?"
      *   *Concept:* The **Debunking Argument** (Joyce/Street). If the causal genealogy is independent of the truth, justification is undermined.
  2.  **The Reliability Challenge:**
      *   *Ask:* "If our intuitions are shaped by fitness, not truth, why trust *any* of them?"
      *   *Concept:* **Evolutionary Debunking Arguments**.
  3.  **The Slippery Distinction:**
      *   *Ask:* "How would you prove Case 1 (Incest) is a bias but Case 2 (Pushing) is a principle? What test do you use?"
      *   *Concept:* **The Lack of a Neutral Arbiter**. We use intuitions to test theories, but we need theories to test intuitions. (The Reflective Equilibrium trap).
  4.  **Realist Responses:**
      *   Briefly mention **Third-Factor Explanations** (Enoch, Wielenberg): Evolution tracked survival, survival tracks moral truth (e.g., survival is good), so the correlation isn't coincidental.
      *   Briefly mention **Reflective Equilibrium**: We prune intuitions, but we need *some* to start.

  ---

  ### **Honest Note: What This Activity Cannot Capture**

  You must state this explicitly in the debrief to prevent philosophical distortion:

  1.  **Phenomenology $\neq$ Justification:** Feeling uncertain does not mean the belief is false. Skepticism feels profound, but it isn't necessarily more rational than dogmatism.
  2.  **The "Self-Defeat" Risk:** If *all* intuitions are debunked, the debunking argument itself relies on intuitions (e.g., "coincidences require explanation"). The activity risks inducing a paralysis that the literature does not endorse.
  3.  **Tilt Toward Skepticism:** This activity is rigged to undermine confidence. It does not simulate the *constructive* work of building a positive metaethical view. It is a tool for problematizing, not solving.

  ---

  ### **Predictable Pitfalls & How to Handle Them**

  **1. The "I Know This Already" Faculty Member**
  *   **Risk:** A faculty member interrupts the Reveal to cite the exact paper you are summarizing, deflating the tension for the grad students.
  *   **Fix:** In the Setup, say: *"Even if you know the literature, I ask you to bracket your theoretical knowledge. Engage with the *intuition* as if it were raw. We are testing the phenomenology of doubt, not your bibliography."*

  **2. The "Dig In" Defense**
  *   **Risk:** Participants feel attacked and assert, *"It's wrong regardless of evolution!"*
  *   **Fix:** Validate them. *"That is a valid realist response. But notice the cost: you now have to defend the claim without relying on the intuition that just wobbled. What is your new foundation?"* Move them from *assertion* to *architectural work*.

  **3. The "So What?" Reaction**
  *   **Risk:** Participants agree their intuitions are biased but say, *"I'm still going to act on them."*
  *   **Fix:** This is actually a win. It highlights the gap between **metaethical justification** and **practical commitment**. Point this out in the debrief: *"You've just identified the distinction between error theory and moral fictionalism/pragmatism."*

  **4. Time Creep**
  *   **Risk:** Phase 3 (Triads) runs long because the uncertainty is stimulating.
  *   **Fix:** Be ruthless with the timer. It is better to cut the Debrief short than the Triad talk, because the *feeling* happens in the Triads. You can summarize the philosophical mapping in the final 5 minutes if needed.

  ### **Facilitator's Cheat Sheet for the Debrief**
  *   If they feel **Shaky**: Connect to **Sharon Street** (Darwinian Dilemma).
  *   If they feel **Defensive**: Connect to **David Enoch** (Third-Factor).
  *   If they feel **Confused**: Connect to **Rawls** (Reflective Equilibrium is hard).
  *   If they feel **Cynical**: Connect to **Mackie** (Error Theory) vs. **Blackburn** (Quasi-Realism).

  ### **Final Instruction to Participants**
  *"Take your response sheets with you. Do not throw them away. In two weeks, look at them. Ask yourself: Has your confidence returned? If so, why? If not, why are you still acting as if it is 100%?"*
