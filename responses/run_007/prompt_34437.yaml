answer: |-
  This is one of the most robust and debated intuitions in modern moral philosophy. You have stumbled onto a problem that keeps professional ethicists up at night, specifically regarding **aggregation** and **commensurability**.

  Your intuition is coherent, it has a name (or several), and there are rigorous defenses for it. However, the "threshold problem" you identified is indeed the primary objection leveled against it.

  Here is a breakdown of the philosophical landscape, how defenders handle the vagueness, and where the weak seams are that might add texture to your novel.

  ### 1. What is this position called?

  There isn't one single label, but your view aligns closely with three overlapping concepts:

  *   **Lexical Utilitarianism (or The Lexical View):** This is the most precise fit. It holds that while some goods and bads can be traded off against each other, "higher" or "more intense" goods/bads have *lexical priority*. Just as in a dictionary the word "apple" comes before "zoo" regardless of how many "z"s you have, severe suffering outweighs any amount of mild pleasure. No quantity of the lower good can ever outweigh the higher bad.
  *   **Threshold Deontology:** This view suggests that consequentialist reasoning (doing the math) works fine *up to a point*. But once consequences cross a certain threshold of horror (e.g., torture, rights violation), deontological constraints kick in, and the math stops.
  *   **Negative Utilitarianism (Strong Priority):** A variation of utilitarianism that gives priority to the reduction of suffering over the promotion of pleasure. In its strongest form, it argues that suffering is morally more significant than pleasure.

  **Key Philosopher:** The heavyweight champion of this view is **Derek Parfit**, particularly in his later work *On What Matters*. He grappled extensively with how to avoid the "Repugnant Conclusion" (the idea that a world with billions of people living barely worth-living lives is better than a world with fewer people living amazing lives) by introducing lexical thresholds.

  ### 2. Why is she right? (The Coherence Argument)

  Your protagonist feels right because she is distinguishing between **quantitative** and **qualitative** differences.

  Classical Utilitarianism (Bentham) treats pain/pleasure as purely quantitative: push the "intensity" dial up, push the "duration" dial up, multiply by "number of people."

  Your view (and J.S. Mill's) suggests that at a certain point, a quantitative increase triggers a **qualitative shift**.
  *   **Below the threshold:** Pain is an *sensation*. It can be offset by pleasure. (A stubbed toe vs. a good meal).
  *   **Above the threshold:** Pain becomes *destructive*. It isn't just a negative sensation; it is an assault on the self.

  You described the suffering as "the kind that breaks a person." This is the philosophical key. If the suffering destroys agency, memory, or the capacity for future happiness, it is not just "more pain." It is a different *category* of event. It is the destruction of a moral subject, whereas the lost meals are merely the subtraction of positive experiences.

  **The Argument:** You cannot trade the *existence* of a moral agent (or their intactness) for the *experiences* of moral agents.

  ### 3. The Threshold Problem (The Sorites Paradox)

  You asked: *At what exact point does the exchange rate collapse?*

  This is the **Continuum Objection**. If pain is a spectrum from 1 to 10, and 1 is tradeable but 10 is not, where does the switch flip? At 5.5? 5.50001? If you can't name the number, isn't the theory vague?

  Here is how philosophers defend the view against this:

  **A. Vagueness is a feature, not a bug.**
  Many concepts we use successfully are vague. "Bald," "Tall," "Rich." There is no exact hair count where a man becomes bald, yet the concept is useful. Moral concepts might be the same. We can know that *torture* is over the line and *a pinch* is under the line, even if we cannot define the precise micronewton of pressure that separates them. Your protagonist doesn't need to know the exact number; she just needs to know which side of the canyon she is standing on.

  **B. The Threshold is Qualitative, not Sensory.**
  This is the strongest defense for your novel. The threshold isn't about *how much it hurts* (sensory intensity); it is about *what the pain does* (functional impact).
  *   **Zone 1:** Pain that distracts, annoys, or hurts but leaves the self intact. (Commensurable with pleasure).
  *   **Zone 2:** Pain that shatters the self, creates permanent trauma, or destroys the capacity for rational agency. (Incommensurable).
  The "cutoff" isn't a specific decibel of scream; it's the point where the human being behind the scream begins to dissolve. This makes the threshold less arbitrary.

  **C. The "Cliff" is Real.**
  Some defenders argue we should accept the cliff. Yes, it seems weird that adding one second of torture makes an outcome infinitely worse, but moral reality might actually be discontinuous. We accept discontinuities in physics (phase changes: water to ice); why not in ethics?

  ### 4. The Weak Seams (Where the tension lies)

  If you want your protagonist to feel the weight of this decision, you should understand where this philosophy is vulnerable.

  **1. The Marginal Case Problem:**
  If the threshold is at "Level 10" suffering, what about "Level 9.9"? If 1,000,000 people get Level 9.9 pain, can that outweigh one person getting Level 10?
  *   *If yes:* Then the threshold isn't real; it's just a very steep slope.
  *   *If no:* Then you are allowing a massive amount of near-torture to happen to save one person from actual torture.
  *   *For the Novel:* This is where your protagonist might doubt herself. Is she saving a person from hell, or is she ignoring a mountain of purgatory?

  **2. The Aggregation Paradox:**
  If mild pains can't aggregate to stop severe pain, can they aggregate to stop *mild* pain?
  If one person's finger is broken, can we break 100 people's fingers to stop it? Most say yes.
  If one person is tortured, can we torture 100 people to stop it? Most say... maybe?
  If we accept aggregation for small things but not big things, we need a principled reason why aggregation "turns off."
  *   *For the Novel:* This gives your character intellectual humility. She knows her logic holds for the extreme case, but she admits the gray area is messy.

  **3. The "Experience" vs. "Reality" Trap:**
  If the suffering is "nightmares years later," it is psychological. What if the mild pleasures are also psychological (e.g., the meaning derived from a community meal)?
  *   *For the Novel:* Ensure the "mild pleasure" is truly transient (sensory) and the "suffering" is truly structural (psychological/ontological). This strengthens her position.

  ### 5. How to write this (Without lecturing)

  You don't want your character quoting Derek Parfit. You want her to embody the **Lexical Intuition**.

  *   **Focus on the "Kind" not the "Amount":** Have her realize that the suffering isn't just "more badness." It's a different substance. It's acid; the pleasure is water. You can't dilute acid with enough water to make it safe to drink.
  *   **The Vagueness as Tension:** She can acknowledge the slippery slope. *"I don't know where the line is exactly. I only know that this,"* (gesturing to the victim) *"is on the other side of it."*
  *   **The Cost:** The tragedy of this view is that it requires ignoring the "math" of the many. She has to be willing to disappoint the thousands to save the one. That is a lonely, elitist, yet heroic position. She is essentially saying, *"Your dinners do not matter in the face of his destruction."* That is a powerful, conflict-generating stance.

  ### Summary for your Draft

  *   **The View:** Lexical Priority / Threshold Deontology.
  *   **The Justification:** Severe suffering is qualitatively different (agency-destroying) rather than quantitatively larger.
  *   **The Threshold:** Handled by accepting moral vagueness or focusing on psychological destruction rather than sensory intensity.
  *   **The Conflict:** The tension between the "clean" math of the many vs. the "absolute" demand of the one.

  Your protagonist is right, philosophically speaking, provided she frames the suffering not as "high intensity pain" but as "the destruction of a person." That distinction is the shield that protects her from the Sorites paradox.
