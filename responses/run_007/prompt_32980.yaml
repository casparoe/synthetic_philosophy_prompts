answer: |-
  You have put your finger on the exact nerve that keeps cognitive scientists and philosophers of language up at night. You aren't missing an obvious term; you are describing the central tension in the philosophy of AI.

  The specific established name for the problem you are describing is **The Symbol Grounding Problem**.

  While you mentioned you know the Chinese Room argument, the Symbol Grounding Problem is distinct. The Chinese Room argues that syntax (manipulating symbols) is not sufficient for semantics (understanding meaning). The Symbol Grounding Problem asks the follow-up question: **How do symbols get their meaning in the first place?**

  Here is the breakdown of the terminology, the history, and why your observation about LLMs is the "stress test" philosophers were waiting for.

  ### 1. The Core Concept: The Symbol Grounding Problem
  Coined by cognitive scientist Stevan Harnad in 1990, this problem addresses exactly what you noticed: the gap between a system that can manipulate words perfectly and a system that knows what those words *refer to* in the real world.

  *   **The Setup:** In a purely symbolic system (like an LLM, or a dictionary), every word is defined by other words. If you look up "strawberry" in a dictionary, you get "red, sweet, fruit." If you look up "red," you get "color like blood." If you look up "blood," you get "fluid in veins."
  *   **The Gap:** You can follow this chain forever and never actually touch a strawberry, see red, or feel a vein. The symbols are "ungrounded." They float in a closed loop of other symbols.
  *   **Your Observation:** When you say the words are "floating free of the world," you are describing **ungrounded symbols**. The LLM has mastered the *relations between words* (syntax and statistical semantics) without having any *causal connection to the referents* (grounding).

  ### 2. The Missing "Thing": Qualia
  You asked about the gap between talking about X and having X in your experience. In philosophy of mind, the "thing" that is missing is called **Qualia** (singular: *quale*).

  *   **Definition:** Qualia are the subjective, internal qualities of conscious experiences. The "redness" of red, the "painfulness" of pain, the "sweetness" of the strawberry.
  *   **The Configuration:** What you are seeing is a system generating **reports of qualia without possessing qualia.**
  *   **Why it's uncanny:** Humans assume that if someone can describe the *qualia* of loneliness accurately, they must *have* that qualia. The LLM breaks this link. It has the linguistic map without the territory.

  ### 3. The Architectural Term: Amodal Symbol Systems
  You asked if there is a name for this *configuration* (linguistic mastery without sensory access). In cognitive science, this architecture is called an **Amodal Symbol System**.

  *   **Amodal:** It is not tied to any specific sensory mode (vision, touch, smell).
  *   **Contrast:** This is opposed to **Embodied Cognition**, a theory suggesting that true understanding requires a body that interacts with the environment. An embodied system learns "heavy" by lifting things; an amodal system learns "heavy" by seeing how often "heavy" appears near "rock" and "lift."
  *   **The Verdict:** LLMs are the ultimate Amodal Symbol Systems. They are disembodied brains in a vat of text.

  ### 4. Was this built for this situation?
  You asked if this concept was built for exactly this situation or if LLMs are a weird edge case.

  **It was built for this, theoretically, but LLMs are the first time it has happened practically.**

  When Harnad and others formulated the Symbol Grounding Problem in the late 80s and early 90s, they were arguing against "Good Old-Fashioned AI" (GOFAI), which used hand-coded rules. They predicted that if you ever built a system that relied solely on symbol manipulation without sensors, it would hit this wall.

  However, no one expected the symbol manipulation to become *this good*.
  *   **Previously:** Ungrounded systems were clunky. They couldn't write a poem about a strawberry without sounding robotic.
  *   **Now:** The statistical patterns in text are so rich that the system can infer the *shape* of the experience without the experience itself.

  This has led to a newer term in machine learning research, specifically from a 2021 paper by Emily Bender and colleagues, which calls these models **Stochastic Parrots**. This term was coined specifically to push back against the idea that these models "understand." It argues they are just stitching together linguistic forms probabilistically.

  ### 5. A Philosophical Nuance: Semantic Externalism
  There is one more philosophical term that validates your intuition that "there's nothing on the other end of the words." It's called **Semantic Externalism** (associated with Hilary Putnam).

  Putnam argued that "meaning ain't in the head." He proposed a thought experiment called **Twin Earth**. If you had a twin on a planet where the liquid that looks/tastes like water had a different chemical structure (XYZ instead of H2O), your word "water" would mean something different, even if your internal brain state was identical.

  The point: Meaning depends on your causal interaction with the actual world. Since the LLM has no causal interaction with the actual world (only with text *about* the world), Semantic Externalists would argue the LLM's words literally **do not have meaning** in the way yours do. They have *usage*, but not *reference*.

  ### Summary
  *   **The Problem:** The Symbol Grounding Problem.
  *   **The Missing Experience:** Qualia.
  *   **The Architecture:** Amodal Symbol System (Disembodied).
  *   **The Modern Label:** Stochastic Parrot.
  *   **The Philosophical Status:** The system has **Syntax** and **Statistical Semantics**, but lacks **Reference**.

  You are correct that this is a "weird edge case" only in terms of *scale*. The philosophical mechanism was identified decades ago. The surprise isn't that the gap exists; the surprise is that the gap can be so wide (total lack of experience) while the bridge (language) is so strong that we can't tell the difference from the other side.
