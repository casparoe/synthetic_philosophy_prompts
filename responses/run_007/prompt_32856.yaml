answer: |-
  This is a brilliant observation, and you have put your finger on one of the most contentious nerve centers in modern political philosophy. You are absolutely right: in the literature on "dirty hands," the emotional aftermath is not treated as a mere footnote; for many theorists, it is the pivot point upon which the moral legitimacy of the leader turns.

  To answer your specific question: There isn't a single, catchy Latin phrase for this asymmetry (like *mens rea* in law), but in the philosophical literature, it is usually discussed under the headings of **"Moral Residue,"** **"Agent-Regret,"** or specifically within Michael Walzer's formulation as **"The Guilt of the Leader."**

  You asked whether remorse is *constitutive* (required for the act to count as justified dirty hands) or *evidentiary* (proof of good character). This is exactly the fault line in the debate.

  Let's map this out step-by-step, as a philosopher would, to help you sharpen the conflict in your novel.

  ### 1. The Baseline: What is "Dirty Hands"?
  First, we must distinguish "dirty hands" from simple utilitarianism or simple villainy.
  *   **Utilitarianism:** If the act saves more lives, it is the *right* act. Period. A utilitarian would prefer **Version B**. Version A is inefficient; their suffering is wasted utility.
  *   **Absolutism:** Torture/killing innocents is always wrong. Both versions are criminals. Version A is a criminal who cries; Version B is a criminal who sleeps.
  *   **Dirty Hands (The Walzerian View):** The act is *both* necessary (politically/morally) *and* wrong. It creates a paradox. You must do it, but you are guilty for doing it.

  Your intuition aligns with the third view. The audience rejects the Utilitarian (B) and the Absolutist (who would refuse to act), and gravitates toward the Tragic Hero (A).

  ### 2. Three Models of What Remorse Is Doing
  When philosophers analyze Version A vs. Version B, they generally fall into three camps regarding what the remorse is actually achieving.

  #### A. The Evidentiary View (Remorse as a Signal)
  *   **The Claim:** The act's justification is independent of the feeling. However, the feeling is crucial evidence of the agent's *future* reliability.
  *   **The Logic:** If a politician kills civilians to save a city (Version B) and sleeps soundly, what stops them from killing civilians to save a poll rating next time? Their moral threshold has shifted. Version A, by suffering, demonstrates that the moral prohibition against killing civilians is still intact.
  *   **Normative Work:** Remorse functions as a **constraint mechanism**. It assures the public that this was an exception, not a new policy.
  *   **Philosophical Proponent:** This is the pragmatic reading of **Michael Walzer**. In his seminal essay *Political Action: The Problem of Dirty Hands* (1973), Walzer argues that we should vote for the candidate who admits their guilt. He writes: "We have to choose a man who knows he will have to do wrong... and who is prepared to bear the guilt."

  #### B. The Constitutive View (Remorse as Part of the Justification)
  *   **The Claim:** The act is *not* fully justified as a "dirty hands" case unless the agent suffers. Without the suffering, it descends into mere *Realpolitik* or tyranny.
  *   **The Logic:** This view holds that moral reality has an objective weight. If you violate a deep moral norm (like "do not kill innocents"), that violation creates a "moral debt." Paying that debt *requires* psychological suffering. If you don't pay it (Version B), the debt remains unpaid, and the act remains simply *wrong*, regardless of the consequences.
  *   **Normative Work:** Remorse is the **price of admission**. It acknowledges the reality of the victim. To kill someone and feel nothing is to treat them as a mere object. To kill them and grieve is to acknowledge their humanity even while destroying it.
  *   **Philosophical Proponent:** This leans heavily on **Bernard Williams** and his concept of **"Agent-Regret."** In *Moral Luck*, Williams argues that a moral agent must feel a special kind of regret for things they caused, even if justified. Version B lacks agent-regret; they only have "regret that it happened." This disconnects them from the moral fabric of the world.

  #### C. The Protective View (Remorse as Self-Preservation)
  *   **The Claim:** The remorse isn't about the act's justification or the public's trust; it's about saving the agent's soul.
  *   **The Logic:** Version B is a monster not because they are untrustworthy, but because they have ceased to be a moral agent. They have corrupted their own character. Version A is a "tragic hero" because they have sacrificed their own moral integrity for the public good.
  *   **Normative Work:** Remorse preserves the **distinction between the person and the office**. Version B has become the office (a machine of statecraft). Version A remains a human being *in* the office.
  *   **Philosophical Proponent:** This is closer to a virtue ethics reading, often found in critiques of Machiavelli. It suggests that "dirty hands" inevitably damages the agent, and denying that damage (Version B) is a form of self-deception.

  ### 3. Why Version B is a "Monster" (The Normative Heavy Lifting)
  You asked what is doing the normative work here. Why do we judge B so harshly? I believe the strongest philosophical argument for your intuition comes from the concept of **Normalization**.

  If Version B is acceptable, then the "exception" becomes the "rule."
  *   **Version A** says: "This was a terrible violation of the moral order, necessitated by extreme circumstances. I bear the scar."
  *   **Version B** says: "This was a calculation. It was the correct move. I am comfortable with this."

  Version B implies that the moral prohibition against killing civilians was never real to begin with; it was just a preference that was outweighed. Version A affirms that the prohibition *is* real, which is why violating it causes pain.

  Therefore, the remorse is **constitutive of the moral boundary.** It marks the line between "statecraft" and "murder." Without the remorse, the act loses its tragic quality and becomes bureaucratic. In fiction (and politics), we forgive the sinner who knows they sin; we do not forgive the sinner who believes they are righteous.

  ### 4. Is There a Specific Name?
  While there isn't one single term, if you are looking for keywords to research or use in your notes, these are the most precise:
  1.  **Moral Residue:** The lingering negative moral status that remains after a justified wrong. Version A accepts the residue; Version B wipes it clean.
  2.  **Agent-Regret:** (Bernard Williams) The specific regret attached to being the *author* of the event, distinct from general regret.
  3.  **The Walzerian Condition:** Informally, some scholars refer to the requirement of guilt as the "Walzerian condition" for legitimate dirty hands.
  4.  **Integrity Objection:** The claim that Version B lacks integrity because their inner moral landscape does not match the outer moral reality.

  ### 5. A Nuance for Your Novel
  There is a counter-argument you should be aware of, which might add depth to a villain or an antagonist in your book.

  Some philosophers (like **C.A.J. Coady**) argue that demanding guilt (Version A) is a form of moral self-indulgence. They argue: *If the act was truly necessary to save the city, why are you wallowing? Your guilt doesn't bring the dead back. It just makes you feel noble.*
  *   **Version B's Defense:** "I did what was needed. To pretend I feel bad would be a lie. I honor the dead by ensuring their sacrifice wasn't in vain, not by drinking myself into a stupor."

  This is a powerful argument for a "hard man" character. It frames Version A's remorse as a luxury the world can't afford, and Version B's equanimity as a higher form of discipline. However, most audiences (and most moral psychologists) will still side with Version A, because Version B's stance risks turning human life into a spreadsheet.

  ### Summary for the Novelist
  To answer your core question: **Yes, the asymmetry is a standard and debated part of the dirty hands concept.** It is not merely a psychological preference; it is treated by many (especially Walzer and Williams) as a **necessary condition for the act to be politically legitimate rather than tyrannical.**

  *   **Version A** acknowledges that the moral law exists, even if it had to be broken.
  *   **Version B** implies the moral law is subordinate to their judgment.

  In your thriller, if you want the audience to trust the politician, they must suffer. If they don't suffer, they aren't a "leader with dirty hands"; they are a "technocrat of violence." The remorse is the receipt that proves they paid the price. Without it, we suspect they stole the goods.

  **Recommendation:** If you want to explore this philosophically in the text, have a character challenge Version A's guilt as "self-indulgent," and have another character challenge Version B's calm as "sociopathic." That is the exact tension Walzer identified in 1973, and it remains unresolved today.
