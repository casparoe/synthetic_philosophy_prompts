      *   *Did I think step-by-step?* (Yes, structured logically).

  9.  *(Self-Correction during drafting)*: I need to make sure I mention that some philosophers *disagree* with Walzer here. Coady, for instance, might argue that if the act is necessary, guilt is irrational. I should present the debate, not just Walzer's view. But Walzer is the one who captures the *intuition* the novelist described.

  10. **Final Polish:** Ensure the distinction between "justification of act" and "assessment of character" is clear, as that's where the philosophical tension lies. (Proceed to generate output).

