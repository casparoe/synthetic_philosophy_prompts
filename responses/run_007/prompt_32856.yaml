      *   *Nuance:* Distinguish between *guilt* (I did wrong) and *agent-regret* (I wish I hadn't had to do this).
      *   *Novelist Angle:* Keep it applicable to character development. Why does this matter for the story?

  7.  **Drafting the Response (incorporating the Persona):**
