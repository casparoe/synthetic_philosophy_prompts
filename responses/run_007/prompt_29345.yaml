  2.  **Deconstruct the Dollar Auction Model:**
      *   *Origin:* Martin Shubik (1971).
      *   *Mechanism:* A dollar is auctioned. Highest bidder wins the dollar. *Both* highest and second-highest bidders pay their bids.
      *   *Trap:* Once bids exceed $1, players escalate to minimize losses (sunk cost fallacy institutionalized in the rules).
      *   *Key Dynamic:* Non-cooperative equilibrium leads to irrational escalation beyond the value of the prize.

  3.  **Map Vietnam to the Dollar Auction:**
