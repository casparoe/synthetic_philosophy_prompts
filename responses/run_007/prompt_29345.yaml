answer: |-
  ### I. Formal Mapping: Vietnam as a Dollar Auction

  To map the Vietnam War onto Shubik's Dollar Auction, we must translate the game's specific structural constraints into the strategic environment of 1965–1973. The Dollar Auction is defined by two rules: (1) the highest bidder wins the prize, and (2) *both* the highest and second-highest bidders must pay their final bids.

  **1. The Bidders**
  *   **Bidder A:** The United States (representing the GVNs).
  *   **Bidder B:** North Vietnam (representing the NLF).
  *   *Constraint:* The model assumes unitary actors. For the mapping to hold, we must treat the US decision-making apparatus (President, NSC, JCS) as a single utility-maximizing agent, and similarly for the Politburo in Hanoi.

  **2. The "Dollar" (The Prize, $V$)**
  *   **Nominal Value:** A non-communist, sovereign South Vietnam.
  *   **Derived Value:** Global credibility (the "credibility of US commitments"). In rational-choice terms, $V$ is not static; it is a function of future deterrence value. $V_{total} = V_{territory} + \delta(V_{future\_credibility})$.
  *   *Note:* In the Dollar Auction, $V$ is fixed (one dollar). In Vietnam, $V$ was endogenous to the bidding process; the more the US bid, the higher the stakes for credibility became.

  **3. The "Bids" ($b$)**
  *   **Definition:** Irreversible investments of blood and treasure.
  *   **Metrics:** Troop increments, sortie rates, budgetary appropriations.
  *   **Sequence:** Discrete rounds of escalation (e.g., advisory mission $\to$ combat troops $\to$ bombing of North $\to$ invasion of Cambodia).
  *   **Visibility:** Bids were public (troop deployments are observable), satisfying the perfect information requirement regarding *actions*, though not *resolve*.

  **4. The Payoff Structure**
  *   **Winner:** Receives $V$ minus total cumulative bids ($C_{total}$). Payoff = $V - C_{total}$.
  *   **Loser (The Second-Highest Bidder):** Receives nothing but must pay cumulative bids ($C_{sunk}$). Payoff = $-C_{sunk}$.
  *   **The Trap:** Once $C_{sunk}$ approaches $V$, a rational actor faces a choice between realizing a certain loss ($-C_{sunk}$) or bidding higher ($b_{next}$) with a probability $P(win)$ of recovering costs.
  *   **Escalation Logic:** Escalate if $-C_{sunk} > P(win) \cdot (V - (C_{sunk} + b_{next})) + (1-P(win)) \cdot -(C_{sunk} + b_{next})$.
  *   Simplified: Escalate if the marginal cost of the next bid is less than the avoided loss of the sunk costs. This is the "sunk cost fallacy" institutionalized in the game rules.

  **5. The Rational Stopping Point**
  *   **Ex Ante:** A perfectly rational bidder with common knowledge of rationality should not enter the auction (bid $0$).
  *   **Ex Post (In-Game):** A rational bidder should stop when the marginal cost of the next bid exceeds the marginal increase in the probability of winning multiplied by the prize value ($\Delta C > \Delta P \cdot V$).
  *   **Dollar Auction Prediction:** Because the second-highest bidder *must* pay, players are incentivized to bid *beyond* the value of the dollar ($b > V$) to minimize the net loss relative to the opponent. The model predicts escalation until one bidder faces a binding budget constraint (bankruptcy or total regime collapse).

  ---

  ### II. Where the Model Breaks

  While the Dollar Auction captures the *logic* of the sunk-cost trap, it fails as a descriptive or predictive formal model of the Vietnam escalation for five structural reasons.

  **1. The "Second-Highest Bidder" Rule Does Not Hold**
  In the Dollar Auction, the loser *must* pay their bid even if they lose. In war, a state can withdraw. While the US incurred sunk costs ($C_{sunk}$), it was not forced to pay *future* bids once it decided to exit. The US withdrawal in 1973 was a refusal to place the next bid, accepting the sunk cost loss. The Dollar Auction predicts escalation until total resource exhaustion; the US stopped while still economically solvent and militarily potent. The "rule" that forces escalation beyond value was absent.

  **2. Asymmetric Valuations ($V_{US} \neq V_{NVN}$)**
  The model typically assumes symmetric or known valuations. In Vietnam, stakes were profoundly asymmetric. For the US, $V$ was geopolitical credibility (a public good). For North Vietnam, $V$ was national survival and unification (an existential good).
  *   *Implication:* Hanoi's reservation price was effectively infinite; Washington's was finite. The Dollar Auction does not account for cases where one bidder values the dollar at \$1 and the other at \$100. The US did not lose because of the auction mechanism; it lost because it was out-valued.

  **3. The Unitary Actor Assumption**
  The "US Bidder" was a committee. The escalation dynamic was driven as much by intra-bureaucratic bargaining (State Dept vs. Pentagon vs. White House) as by inter-state competition.
  *   *Mechanism:* Incrementalism ("graduated pressure") was a compromise between factions, not a calculated optimal bid. The Dollar Auction assumes a single utility function. In Vietnam, "escalation" was often the path of least resistance among domestic veto players, not a strategic bid to win the auction.

  **4. Private Information and Signaling**
  The Dollar Auction assumes bids are public and the only uncertainty is the opponent's budget. In Vietnam, the core problem was private information regarding *resolve*.
  *   *Signaling:* US escalation was intended as a signal to Hanoi to compel negotiation. Hanoi interpreted it as a signal of US desperation. The model lacks a signaling mechanism where bids convey information that alters the opponent's $P(win)$ assessment. The US kept bidding to signal resolve; Hanoi kept bidding to signal that US costs were unsustainable.

  **5. Endogenous Prize Value ($V$)**
  In the game, the dollar is worth \$1. In Vietnam, $V$ increased with every bid. This is the "credibility trap." Withdrawing early cost less blood but incurred higher reputational damage ($V_{credibility}$) than withdrawing late.
  *   *Break:* The Dollar Auction cannot model a prize that grows in value as the bidding intensifies. This endogeneity makes the "rational stopping point" moving and indeterminate.

  ---

  ### III. Theoretical Assessment

  **Does Vietnam confirm, refute, or misapply the Dollar Auction?**

  It **reveals the model was never designed for this case.**

  The Dollar Auction is a paradox of *individual* rationality under specific *institutional* rules (the second-highest bidder pays). It is a demonstration of how specific rules can generate perverse incentives. War, however, does not have a rulebook forcing the loser to pay the winner or the auctioneer.

  *   **Confirmation:** It accurately describes the *psychological* and *rhetorical* logic used by proponents of escalation (Johnson, Nixon, Kissinger). The argument that "withdrawal renders previous sacrifices meaningless" is the exact verbalization of the Dollar Auction trap.
  *   **Refutation:** It fails to predict the *outcome*. The model predicts escalation to the point of mutual ruin or until one side is physically incapable of bidding. The US exited via negotiation (Paris Peace Accords) while retaining significant military capacity. The "auction" ended via a side-payment (aid packages) and a face-saving mechanism, not bankruptcy.
  *   **Verdict:** The Dollar Auction is a useful *metaphor* for the sunk-cost dynamic, but a poor *formal model* for interstate conflict. It abstracts away the political mechanisms (domestic support, coalition maintenance) that actually determine the stopping point.

  ---

  ### IV. Alternative Models

  For a rational-choice scholar, other frameworks in the conflict literature capture the missed variance more effectively.

  **1. War of Attrition (Fearon 1994)**
  *   **Why it fits better:** This is the standard rationalist model for escalation. It treats war as a bargaining process under private information. Escalation occurs because sides have private information about their costs and resolve and use fighting to signal.
  *   **Advantage:** It explains why settlement wasn't reached earlier (incentives to misrepresent resolve) and allows for negotiated exits without total bankruptcy. It handles the asymmetric stakes better than the Dollar Auction.

  **2. Audience Cost Models (Fearon 1994; Schultz 2001)**
  *   **Why it fits better:** This explains the "second-highest bidder" constraint politically rather than structurally. Democratic leaders incur domestic punishment (audience costs) for backing down after making threats.
  *   **Advantage:** It endogenizes the "penalty" for losing. The US didn't pay the penalty because of game rules; it paid because domestic political survival depended on not appearing weak. This explains the incrementalism: leaders bid just enough to avoid immediate audience costs without triggering total war.

  **3. Prospect Theory (Kahneman & Tversky; applied by McDermott 1998)**
  *   **Why it fits better:** This addresses the psychological mechanism of the Dollar Auction without requiring the structural "second-bidder pays" rule. Actors are risk-acceptant in the domain of losses.
  *   **Advantage:** It explains why the US escalated when the expected utility was negative. Once the US was "in the red" (sunk costs), the reference point shifted. Withdrawal was a *certain loss*; escalation was a *gamble for resurrection*. This captures the irrationality of the escalation better than expected utility models.

  **Recommendation:** For your work, the **Audience Cost model** combined with **Prospect Theory** offers the most robust explanation. Audience costs explain the *constraint* (why they couldn't stop), and Prospect Theory explains the *risk tolerance* (why they kept bidding despite negative expected utility). The Dollar Auction remains a powerful pedagogical device for the sunk-cost fallacy, but it lacks the political machinery to explain the Vietnam case rigorously.
