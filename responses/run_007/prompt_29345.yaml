      *   *The "Dollar" (Prize):* A non-communist South Vietnam (geopolitical credibility, containment success).
      *   *The "Bids":* Troop levels, bombing tonnage, financial expenditure, political capital.
      *   *The "Rule" (Crucial):* Why do losers pay? In the dollar auction, the second-highest bidder pays but gets nothing. In war, the "cost" is sunk regardless of winning. The analogy holds if "losing after investing" is worse than "continuing to invest." The "payment" is the sunk cost of blood/treasure that is wasted if withdrawal happens *before* victory.
      *   *Payoffs:*
          *   Win: Prize Value ($V$) - Total Cost ($C$).
          *   Lose/Withdraw: - Total Sunk Cost ($C_{sunk}$).
          *   Escalate: Increase $C$, increase probability of Win ($P_w$).
      *   *Rational Stopping Point:* When Marginal Cost of Escalation > Marginal Expected Benefit (Increase in $P_w \times V$). In the Dollar Auction, rationality suggests stopping *before* bidding starts (if common knowledge of rationality), but once in, stopping occurs when the bid exceeds the value of the dollar *plus* the penalty of being the second-highest bidder.

