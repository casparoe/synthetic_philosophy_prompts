  2.  **Deconstruct the Philosophical Problem:**
      *   **Buck-Passing Account (BPA):** X is good/admirable iff there are reasons to value/admire X.
      *   **Wrong Kind of Reasons (WKR) Problem:** Sometimes there are reasons to value/admire X that have nothing to do with X's value/admirability (e.g., a demon threatens to kill you unless you admire a saucer of mud). BPA mistakenly counts these reasons as making X valuable/admirable.
      *   **Constraint Challenge:** Avoid demons/threats/bribes. The reason must come from the *subject's own projects or commitments*. This points towards "pragmatic" or "instrumental" reasons internal to the agent's life plan, rather than external coercion.
