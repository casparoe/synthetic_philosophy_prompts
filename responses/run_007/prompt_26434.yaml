answer: |-
  (1) Dependency structure
  Begin by establishing individual competence (p > 0.5) intuitively. Start with a show of hands on a simple fact to gauge baseline competence before introducing the model. Students must grasp that individuals are slightly better than coins before seeing groups improve this. Next, introduce majority rule as the aggregation mechanism. Only after demonstrating the benefit of adding voters should you introduce the independence assumption. This sequencing ensures the fragility of independence lands with impact; they see the gain first, then learn the condition required to sustain it. Finally, bridge to democracy only after dismantling the assumptions, ensuring they view the theorem as a model with strict limits rather than a normative proof. Logical flow: Competence → Aggregation → Independence → Fragility → Normative Caution. This prevents math-first confusion and ensures the political application is treated as a contingent analogy, not a direct mapping. Ensure they see the math as secondary to the logical structure.

  (2) The carrying example
  Use a medical diagnosis panel. Three doctors decide if a patient has a specific disease (Yes/No). There is an objective truth (patient either has it or doesn't). Each doctor has a 60% accuracy rate. This avoids political preferences, focusing on epistemic truth. It must avoid complex stakes or subjective values. Crucially, it allows you to easily manipulate independence: if doctors consult the same flawed textbook, errors correlate. This concrete scenario makes the abstract independence condition visible and breakable without needing political baggage. Keep the number of doctors small initially to allow mental calculation before scaling up. This builds confidence. Then expand.

  (3) Misconception map
  First, "Wisdom of Crowds" conflation arises immediately. Defuse at minute 5 by distinguishing CJT (binary truth) from Galton's ox weight (averaging estimates). Second, the "Independence is natural" misconception forms during the aggregation demo. Defuse at minute 25 by revealing the doctors share training; correlated errors halt accuracy gains. Show that 100 dependent voters equal one voter. Use the board to visually cross out the accuracy curve when dependence is introduced. Ask students to raise hands if they think correlation matters less than competence. Use this to pivot. Remind them that real voters talk to each other, watch same news, and share biases. This makes the independence assumption visibly unrealistic for large electorates. Third, "Condorcet proves democracy" emerges at the conclusion. Defuse at minute 40 by contrasting epistemic questions (truth exists) with political choices (competing preferences). Emphasize that CJT requires a correct answer, whereas politics often involves deciding what we want, not what is true. If there is no objective truth to track, the theorem is silent. This sequence prevents normative overreach and clarifies the epistemic limit of the model for real elections where preferences dominate. Conclude by asking if voting is about truth or power. This cements the distinction.

  (4) What to leave out
  Explicitly skip the binomial probability derivation and inequalities. State clearly: "We care about the logic, not the calculus." Skip heterogeneous competence models and historical context about Condorcet. These add cognitive load without clarifying the core fragility of independence. This keeps the focus on structural assumptions rather than mathematical robustness, preventing the "math anxiety" that lost last year's class. Focus on assumption fragility. Mention that relaxing assumptions changes results dramatically, but that is for another course.

  (5) The exit check
  Ask: "If 1,000 voters all copy one expert with 60% competence, does the probability of a correct majority verdict approach 100%?" Correct answer: No, it stays at 60%. This tests independence versus group size, confirming they grasp the theorem's critical constraint. It reveals if they really saw the independence condition.
