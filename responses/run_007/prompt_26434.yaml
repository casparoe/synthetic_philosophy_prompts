      *   **Total Word Count Check:** 150 + 100 + 200 + 75 + 50 = 575 words (approx). Need to be careful with limits.

  2.  **Drafting - Section by Section:**

      *   **(1) Dependency structure:**
          *   Need to establish intuition before math.
          *   Start with the binary choice scenario (Guilty/Innocent or True/False).
          *   Define competence (>0.5 probability) before introducing group size.
          *   Show the aggregation mechanism (majority rule) before showing the probability curve.
          *   Introduce independence *after* they see the benefit of adding voters, so the fragility hits harder.
          *   Finally, connect to democracy only after dismantling the assumptions.
          *   *Drafting thought:* Keep it tight. Focus on the logical flow: Individual competence -> Aggregation -> Independence -> Fragility -> Normative limits.

      *   **(2) The carrying example:**
          *   Needs to be binary, objective truth, low stakes but relatable.
          *   Avoid: Elections (too normative too soon), Stock markets (too noisy).
          *   Best: A jury deciding a factual question (e.g., "Did the defendant leave the building?") or a medical diagnosis panel.
