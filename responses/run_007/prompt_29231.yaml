answer: |-
  ### (1) Identification

  The established label is the "Wrong Kind of Reasons" (WKR) problem, often contrasted with "Right Kind of Reasons" (RKR). In epistemology, this maps onto the distinction between "epistemic" and "pragmatic" reasons for belief. In value theory, it is frequently framed as "object-given" versus "state-given" reasons. Prominent discussions appear in the work of Parfit, Rabinowicz, and Crisp regarding fitting-attitude analyses. While these labels identify the literature, they do not solve the problem. Merely naming the distinction does not explain *why* pragmatic reasons fail to make an object desirable or why evidence is uniquely suited for belief. The philosophical work lies in delineating the boundary, not assigning the taxonomy. Consequently, knowing the term "WKR" is insufficient without an account of what makes a reason the "wrong" kind. The phenomenon you describe is central to debates over fitting-attitude analyses of value and the normativity of belief, but the label itself is a placeholder for the explanatory challenge you have identified.

  ### (2) The core distinction

  The precise separation lies in whether the consideration bears on the *correctness conditions* of the attitude or the *utility* of holding it. Object-given reasons (the "right" kind) cite properties of the attitude's object that make the attitude fitting. For belief, truth-conducive evidence makes belief correct because belief constitutively aims at truth. For admiration, noble traits make admiration fitting because admiration responds to perceived excellence. For desire, valuable properties make desire appropriate because desire tracks the good. These reasons make the attitude successful in its own terms; they satisfy the internal standards of the attitude type. When you admire a hero, their courage justifies the admiration. When you believe it rains, the rain justifies the belief.

  State-given reasons (the "wrong" kind) cite benefits or costs associated with *being in* that mental state, regardless of the object's properties. The demon threat makes admiring him prudent, not fitting; the money makes desiring mud advantageous, not appropriate. The bribe for belief makes holding the belief beneficial, not true. Crucially, this is not merely about internal versus external motivation. It is about the direction of normativity. Object-given reasons align the mind to the world (or value); state-given reasons align the world (or consequences) to the mind's comfort. This aligns with the philosophical notion of direction of fit: object-given reasons push the mind to match the world, while state-given reasons push the world to match the mind's interests.

  In the belief case, evidence connects the belief to reality. In the desire and admiration cases, properties connect the attitude to value. The bribe or threat bypasses the object entirely, targeting the agent's welfare instead. Thus, the distinction marks the difference between reasons that justify the attitude *as such* (constitutive norms) and reasons that justify bringing it about *instrumentally* (external norms). Both cases fit because beliefs, desires, and admirations all have constitutive aims—truth, the good, the excellent—that state-given reasons fail to engage. A state-given reason tells you it is good *for you* to have the attitude; an object-given reason tells you the attitude is *correct* because its object warrants it. This explains why the mud remains undesirable despite the money: the money affects the agent, not the mud. The distinction isolates the normative force specific to the attitude's function from the normative force of practical rationality generally. Some philosophers frame this as a distinction between a 'reason for' the attitude (object-given) versus a 'reason to' have the attitude (state-given), emphasizing that the latter is a reason for action (inducing the state) rather than a reason constitutive of the state itself.

  ### (3) Boundaries and pressure points

  Are the desire and belief cases identical? Structurally, yes; metaphysically, debated. Most metaethicists treat the WKR problem as a unified structural issue across attitudes. However, some argue belief is uniquely constrained by truth, whereas desire is more flexible. Hard cases involve "contaminating" reasons. Consider Pascal's Wager: does the benefit of believing God exist become evidence? Most say no, but if belief is voluntary, the pragmatic reason might induce the belief, blurring the causal line. Another pressure point is self-fulfilling attitudes: believing you will succeed might cause success. Here, the pragmatic reason seems to make the belief true, challenging the object/state split.

  Does this distinction commit one to intrinsic value? No. One can be a constructivist about value and still distinguish reasons. For instance, a constructivist might say something is desirable if it would be desired under ideal conditions. A bribe distorts conditions, so it doesn't generate ideal desire. The distinction relies on the *structure* of the attitude (its aim or standards), not necessarily on mind-independent value properties. However, it does commit one to the idea that attitudes have normative standards independent of the agent's immediate welfare. The hardest boundary case is when the state-given reason alters the object. If the money makes the mud useful, is it then desirable? Yes, but derivatively. The core distinction holds so long as we separate the object's properties from the consequences of holding the attitude toward it. Some philosophers, like Nishi Shah, argue the distinction arises from the "transparency" of belief (we look to truth, not reasons), whereas desire lacks this transparency, suggesting the phenomena might differ in kind. Nevertheless, the prevailing view treats them as instances of a single normative puzzle regarding constitutive norms. Reductionists argue there is only one kind of reason, but this struggles to explain why bribes don't make beliefs true.

  ### (4) Verdict

  The phenomenon is best defined as the distinction between *constitutive* and *instrumental* reasons for attitudes. Constitutive reasons (object-given) satisfy the internal standards of the attitude, making it fitting or correct. Instrumental reasons (state-given) make holding the attitude beneficial without making it correct. This is not merely a distinction between moral and prudential reasons, nor does it require moral realism. It is a structural claim about how mental states relate to their objects. It is not simply a difference in strength of reason, nor is it a difference between internal and external justification. It fundamentally concerns the source of normative authority relative to the attitude's nature. The "Wrong Kind of Reasons" label identifies the puzzle, but the substance lies in the failure of pragmatic considerations to satisfy the constitutive aims of belief, desire, or admiration.
