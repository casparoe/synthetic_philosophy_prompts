answer: |-
  This is one of the most persistent and frustrating stalemates in the philosophy of mind and cognitive science. You are correct that the arguments have become ritualized. The fact that credences do not move suggests that the parties are not disagreeing about a single proposition that could be settled by evidence or logic.

  My diagnosis is that this is not a single disagreement, but a **conflation of three distinct layers of inquiry**: a semantic ambiguity, a methodological divergence, and an empirical void. The debate feels intractable because participants often shift between these layers without signaling the transition.

  Here is the breakdown of the diagnosis, followed by an assessment of what could actually resolve it.

  ### 1. The Semantic Layer: Equivocation on "Computation"
  You hypothesized that this is partly a verbal dispute. You are right, but it is more specific than just "thick vs. thin" definitions. It is a conflation of **ontological** claims with **descriptive** claims.

  *   **The Computationalist Slide:** When challenged on whether the brain is *literally* a computer (ontological), computationalists often retreat to the claim that the brain can be *modeled* as a computer (descriptive). They argue that since neural activity transforms input to output according to rules, it fits the mathematical definition of a function.
  *   **The Anti-Computationalist Trap:** Anti-computationalists (like Searle or Putnam in his later phase) attack the ontological claim. Searle argues that computation is observer-relative (syntax is not intrinsic to physics). Putnam argued that every physical system implements every finite automaton (the triviality argument).
  *   **The Clash:** The computationalist says, "Look, this neural circuit performs a logical AND operation." The anti-computationalist replies, "Only relative to an interpretation you imposed on the voltage levels."
  *   **Diagnosis:** This is a verbal/ontological deadlock. If "computation" means "universal Turing machine implementation," the brain likely isn't one (it's analog, noisy, and finite). If "computation" means "physical system whose states can be mapped to a function," then the brain computes, but so does a bucket of water (as Pour-El showed), rendering the claim trivial. The debate stalls because one side fears triviality while the other fears mysticism.

  ### 2. The Methodological Layer: Competing Ideals of Explanation
  Beneath the semantics is a Kuhnian clash regarding what counts as a satisfactory explanation. This is the "research-program aesthetics" you mentioned.

  *   **The Computational Ideal (Abstraction):** For figures like Fodor or Pylyshyn, the power of computationalism is **multiple realizability**. We want to explain vision without getting bogged down in the wetware. The "computational level" (Marr) is autonomous from the "implementation level." To them, insisting on biological details prematurely is a category error.
  *   **The Dynamical/Embodied Ideal (Coupling):** For figures like Van Gelder, Thompson, or Noë, this abstraction is the problem. They argue that cognition is not the manipulation of internal representations but the **dynamic coupling** of agent and environment. To separate the "computation" from the "biology" or the "world" is to destroy the phenomenon you are trying to explain.
  *   **Diagnosis:** This is not a factual disagreement but a disagreement about **granularity**. Computationalists want to carve nature at the joints of *information flow*. Enactivists want to carve nature at the joints of *sensorimotor loops*. Neither can prove the other "wrong" because they are optimizing for different explanatory virtues (generality vs. biological fidelity).

  ### 3. The Empirical Layer: The Missing Mechanism
  This is where your hypothesis about representation hits the mark. The debate persists because we lack the **mechanistic evidence** to adjudicate the methodological clash.

  *   **The Claim:** Computationalism is not just a metaphor; it is a hypothesis about physical mechanism. It claims there are **vehicles of representation** (neural states) that are manipulated by **processes** (algorithms) sensitive to the structure of those vehicles.
  *   **The Void:** We do not know what the vehicles are. We know neurons spike. We know synapses weight. But we do not know how a "variable" is physically stored or retrieved in the brain in a way that satisfies the requirements of a computational architecture (like a register or a memory address).
  *   **The Gallistel & King Argument:** In *The Memory Code*, Gallistel argues that until we find the read/write mechanisms for neural data, computationalism remains a "black box" psychology. We are describing input-output functions without knowing the internal machinery.
  *   **Diagnosis:** The debate is a placeholder for ignorance about the **neural code**. Computationalists assume the code exists and is representational. Anti-computationalists (specifically dynamical systems theorists) suspect there is no code, only trajectories in state space. We currently lack the tools to distinguish a high-dimensional dynamical system from a complex computational network empirically.

  ### What Could Move the Debate Forward?

  Philosophical argumentation has exhausted its utility here. Searle will not be refuted by a better thought experiment, and Fodor will not be converted by a critique of modularity. The resolution must come from one of three avenues:

  **1. A Mechanistic Discovery (The Strongest Candidate)**
  The debate would dissolve if neuroscientists could identify specific physical structures in the brain that function as **computational primitives**.
  *   *Vindication of Computationalism:* If we discover that neurons or glial cells utilize discrete, addressable memory states (e.g., specific molecular configurations that store bits of information independently of synaptic weight) that are accessed via a read/write mechanism, the "brain as computer" claim moves from metaphor to mechanism.
  *   *Vindication of Dynamical Systems:* If we demonstrate conclusively that neural processing is purely continuous, analog, and inseparable from the body's physical dynamics without any separable "variables" or "states," then the computational description is revealed as a useful fiction, like using Ptolemaic epicycles to predict planetary motion.
  *   *Current Status:* We are closer to the latter. Deep learning works, but it is not biologically realistic. We have not found the "registers" in the brain.

  **2. A Conceptual Distinction: Piccinini's Mechanistic Account**
  Philosopher Gualtiero Piccinini has attempted to carve the joint differently. He argues we should stop asking "Is the brain a computer?" and start asking "What kind of information processing mechanism is it?"
  *   He distinguishes between **digital** (discrete states), **analog** (continuous variables), and **hybrid** processors.
  *   If the field adopts this taxonomy, the debate shifts from a binary Yes/No to a structural engineering question. The "anti-computationalists" would mostly vanish, replaced by "analog-dynamical theorists," and "computationalists" would become "digital/hybrid theorists." This would dissolve the verbal dispute by forcing operational definitions.

  **3. The "Hard Problem" of Semantics (The Blocker)**
  The one thing that could keep the impasse going indefinitely is the **symbol grounding problem**. Even if we find the mechanism, we face the Searle/Chinese Room objection: *Why do these states mean anything?*
  *   If cognition requires *intrinsic* intentionality (aboutness), and computation only provides *derived* intentionality (assigned by an observer), then no empirical finding will satisfy the anti-computationalist.
  *   *Resolution:* This requires a naturalistic theory of content (e.g., teleosemantics or information-theoretic accounts) that gains wide acceptance. Until then, the "meaning" objection will remain a philosophical shield for anti-computationalism.

  ### Conclusion: Your Hypothesis and the Path Forward

  Your hypothesis is largely correct: the term "computation" is doing too much work. It conflates a mathematical description, a physical architecture, and a theory of mind.

  However, I would refine your conclusion. The residue is not just about the "role of representation." It is about the **physical vehicle of representation**.

  The debate will not end with a philosophical verdict. It will end when neuroscience becomes granular enough to show us the gears.
  *   If the gears look like logic gates or memory registers, computationalism wins.
  *   If the gears look like fluid dynamics or resonance fields, dynamical systems theory wins.
  *   If the gears are invisible because there are no gears (radical enactivism), then cognition is a process, not a thing.

  Until then, we should expect the impasse to continue. The rational move for a researcher is not to pick a side in the "Is it a computer?" debate, but to adopt **methodological pluralism**: use computational models where they predict well (e.g., vision, language), and use dynamical/embodied models where they predict well (e.g., locomotion, developmental psychology), without demanding that one ontology subsume the other. The "brain as computer" claim is currently a **research heuristic**, not a settled fact, and treating it as a metaphysical truth is what keeps the debate alive.
