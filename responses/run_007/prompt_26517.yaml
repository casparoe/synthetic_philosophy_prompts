  **1. The View Stated Clearly**
  You hold that 'basic desert' moral responsibility—the notion that agents merit praise or blame solely in virtue of who they are and what they have done, independent of consequentialist considerations—is metaphysically untenable. This is because it requires a form of free will (libertarian or robust sourcehood) incompatible with determinism and constitutive luck. Consequently, retributive punishment, justified by the claim that offenders deserve to suffer, is morally illegitimate. Penal practice must be reconstructed exclusively on consequentialist grounds: incapacitation, deterrence, and rehabilitation. Ambiguities remain regarding whether this scepticism extends to all forms of moral responsibility (e.g. Strawsonian accountability) or solely to desert-based blame, and whether it mandates the eradication of personal reactive attitudes like resentment, or merely their exclusion from state sanction. The core claim is normative: without basic desert, retribution is unjust.

  **2. What the View Commits Me To**
  Institutionally, you must oppose sentencing guidelines predicated on culpability-based proportionality and mandatory minimums grounded in outrage. You must endorse a 'public health quarantine' model, where detention is justified solely by risk and capacity for reform. This commits you to empirical bets: first, that a desert-free system can maintain social order without triggering vigilante vengeance; second, that risk-assessment tools can be sufficiently accurate and unbiased to justify liberty deprivation without desert; and third, that rehabilitation is empirically viable enough to justify confinement durations. Attitudinally, you are committed to cultivating forward-looking reactive attitudes (e.g. moral anger aimed at improvement) rather than backward-looking resentment. You must also accept that some dangerous individuals may require indefinite confinement despite lacking moral guilt, a pill many find harder to swallow than retribution. Finally, you bet that the psychological transition away from retributive intuition is feasible for legal practitioners and the public without eroding the normative force of law itself.

  **3. The Case Against: Defeaters Ranked**
  **1. Normative Grounding of Rights (Fatal/Conceptual):** The most severe threat is normative. If consequentialism cannot prohibit punishing the innocent when utility maximises, the view collapses into tyranny. Caruso attempts to ground rights in well-being rather than desert, but critics argue this is unstable without a deontological constraint. Sceptics concede this is their weakest normative link but deny it necessitates desert, insisting rights protect future welfare. If this defence fails, the view is morally untenable. This is a conceptual defeater they acknowledge requires robust philosophical work.

  **2. Compatibilist Redemption of Desert (Conceptual):** If 'desert' is shown to be coherent within determinism (e.g. Scanlon's relational account or Dennett's pragmatic view), the metaphysical barrier dissolves. Sceptics dismiss this as semantic revisionism—changing the subject from 'ultimate responsibility'—but if the legal concept of culpability aligns with compatibilism, their critique misses its target. If courts can justify proportionality without libertarian freedom, the sceptic's policy recommendations lose their urgency. Defenders insist ordinary people require ultimate responsibility for true desert, but if empirical psychology shows otherwise, their premise crumbles.

  **3. Empirical Viability of Prevention (Empirical):** If risk-assessment tools remain racially biased or inaccurate, a quarantine model may be more unjust than retribution. Caruso concedes this is a serious risk, requiring strict procedural safeguards. If preventive detention expands net-widening, detaining those who would not be punished under retributive limits, the view fails pragmatically. This is an empirical bet on criminological science improving sufficiently to justify liberty deprivation. Unlike the metaphysical claims, this is directly falsifiable by data on recidivism and bias.

  **4. Social Stability (Empirical):** If removing retributive rhetoric increases crime or vigilante violence, the consequentialist justification self-destructs. The view relies on the claim that understanding determinism reduces aggression. Sceptics bet on education reducing this risk but concede empirical uncertainty. If public belief in free will is functionally necessary for order, the view is socially dangerous. This is a pragmatic defeater they accept as a risk worth taking for moral truth.

  **5. Phenomenological Cost (Intuitive/Awkward):** If the 'illusion' of free will is necessary for mental health or social cohesion, dismantling it is harmful. Defenders accept this cost, prioritising truth over comfort, but if the psychological damage is severe, the view imposes undue harm. They argue adaptation is possible, but this remains an unproven psychological hypothesis.

  **6. Loss of Merit-Based Relationships (Intuitive/Conceded):** Caruso explicitly concedes that some forms of pride and gratitude must be modified. This is a genuine cost they accept, distinguishing it from a defeater. They argue relationships can survive on love rather than merit, but if this proves psychologically impossible for most, the view becomes elitist. They acknowledge this loss but deem it the price of coherence.

  Collectively, the conceptual challenges are fatal if successful, while the empirical ones are pragmatic defeaters. The sceptics treat the metaphysical claims as non-negotiable but admit the policy rests on contingent facts.

  **4. Insulation and Falsifiability**
  The charge of insulation carries weight. 'Basic desert' is defined precisely to be incompatible with determinism and luck, making it metaphysically impossible by stipulation. Critics argue this rigs the game: if desert is defined as requiring god-like causation, naturally no one has it. However, sceptics argue this merely clarifies the ordinary concept's hidden commitments. Regarding falsifiability, the core claim is normative ('retribution is unjust'), which is not empirically falsifiable. However, the view relies on empirical premises: that determinism/luck undermines agency, and that consequentialist systems work better. These are falsifiable. If neuroscience demonstrated agent-causal powers, or if criminology showed retribution reduces crime more effectively than rehabilitation without moral cost, the view would crumble. The insulation is thus partial: the metaphysical claim is shielded by definition, but the practical recommendation rests on vulnerable empirical bets. This is appropriate for a normative position, provided its empirical dependencies are acknowledged—which Caruso generally does.

  **5. Your Verdict**
  The view is metaphysically robust but normatively fragile. Its rejection of desert rests on a sturdy incompatibilist foundation that is difficult to shake without embracing libertarianism. However, its constructive programme—the consequentialist replacement—is far more exposed. It risks collapsing into utilitarianism's classic pitfalls or failing empirically to manage risk without liberty violations. It is not hedged into safety; rather, it shifts the risk from metaphysical coherence to practical implementation. You have adopted a position that is logically consistent but demanding in practice. It takes real risks regarding human psychology and institutional integrity. If those empirical bets fail, the moral high ground remains, but the policy becomes untenable. It is a brave view, but its vulnerability lies not in its scepticism, but in its proposed alternative.
