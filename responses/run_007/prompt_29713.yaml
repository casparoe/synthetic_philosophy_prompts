answer: |-
  ### Phase 1: Raw Data Brainstorm
  *Before we build the spec, here is the field data. These are the conversational moves, intuitions, and patterns any theory must account for. I'm separating robust phenomena from theory-laden interpretations.*

  1.  **The Challenge Pattern:** When I assert $p$, the standard appropriate challenge is "How do you know?" not "Why do you believe?" or "Is it true?" (Though "Is it true?" is a challenge, it targets the outcome, not the license).
  2.  **The Retraction Pattern:** If I learn $p$ is false, I say "I shouldn't have said that." If I learn I had no evidence, I say "I shouldn't have said that." If I learn I didn't know (Gettier), I often feel unease, but less clear retraction.
  3.  **Moore-Paradoxical Sounds:** "$p$ but I don't believe $p$" sounds absurd. "$p$ but I don't know $p$" also sounds absurd (Williamson's data). "$p$ but it isn't true" is a contradiction, not just absurd.
  4.  **The Lottery Intuition:** I cannot flat-out assert "Your ticket lost" before the draw, even if the odds are 1 in a million. I can assert "It's probable your ticket lost."
  5.  **The Conjunction Problem:** I can't assert the conjunction of all lottery propositions ("Ticket 1 lost and Ticket 2 lost..."), even though asserting each individually seems statistically identical.
  6.  **Selfless Assertion:** A doctor has overwhelming evidence for a diagnosis $p$, but due to a psychological block (or depression), does not believe $p$. She asserts $p$ to the patient. Intuition: She did nothing wrong in asserting.
  7.  **Lying vs. Mistake:** Asserting $p$ (false) believing $p$ is a mistake. Asserting $p$ (true) believing $\neg p$ is a lie. Both seem improper, but differently so.
  8.  **Hedging:** Saying "I think $p$" or "Probably $p$" changes the propriety conditions. It lowers the epistemic bar required to speak without criticism.
  9.  **Stakes Sensitivity:** In low stakes, I might assert "The bank is open Saturday." In high stakes (mortgage due), asserting the same thing on the same evidence feels improper.
  10. **Transmission:** Assertion is the primary vehicle for testimony. If assertion didn't carry epistemic weight, testimony wouldn't generate knowledge in the hearer.

  ---

  ### Phase 2: The Spec (Desiderata & Distinctions)
  *Organizing the data into requirements. I have marked these as **Hard** (theory fails without it) or **Soft** (theory can negotiate with explanation).*

  #### A. Structural Distinctions (Non-Negotiables)
  1.  **Propriety vs. Blamelessness [Hard]:** The theory must distinguish violating the norm from being blameworthy for the violation. (I can assert improperly but excusably).
  2.  **Act vs. Content [Hard]:** The norm governs the *act* of asserting, not just the truth of the proposition. (Truth is a condition of the content; the norm links the agent to the content).
  3.  **Constitutive vs. Prudential [Hard]:** Being paid to say $p$ (prudential reason) does not make the assertion *proper qua assertion*. The norm must be internal to the practice, not external incentives.
  4.  **Flat-Out vs. Hedged [Hard]:** The theory must explain why adding "I think" changes the normative status. A theory of assertion must explain what hedging *modifies*.

  #### B. Phenomenological Constraints (The "Must Explain" List)
  5.  **The Challenge Constraint [Hard]:** The theory must explain why "How do you know?" is the default challenge. If the norm were Truth, "Is it true?" should be the default. If Belief, "Do you believe it?"
  6.  **The Retraction Constraint [Hard]:** The theory must explain when retraction is mandatory. (Falsehood mandates retraction; lack of knowledge usually does too).
  7.  **The Moore-Paradox Constraint [Hard]:** The theory must explain the absurdity of "$p$ but I don't satisfy the norm for $p$." (e.g., if Norm=Knowledge, "$p$ but I don't know $p$" must sound absurd).
  8.  **The Lottery Constraint [Hard]:** The theory must explain why high statistical probability is insufficient for flat-out assertion. (Rules out simple Probabilistic/Truth norms).
  9.  **The Lying Constraint [Hard]:** The theory must explain why asserting $p$ while believing $\neg p$ is improper, even if $p$ turns out true. (Rules out Truth-only norms).

  #### C. Functional Requirements (The "Job Description")
  10. **Testimony Transmission [Hard]:** The norm must be strong enough that satisfying it typically puts the hearer in a position to know. (Assertion is a knowledge-generator).
  11. **Closure under Conjunction [Soft]:** Ideally, if you can assert $p$ and can assert $q$, you can assert $p \& q$. (The Lottery Conjunction problem suggests this might fail for statistical evidence, so this is negotiable).
  12. **Stakes Invariance [Soft]:** Preferable if the norm itself doesn't change with stakes, and only the *prudence* of asserting changes. (Contextualism saves the data but complicates the norm).

  ---

  ### Phase 3: The Tension Map (Incompatibilities)
  *Here is where the single invariant norm strains. You cannot satisfy all Hard constraints with one simple formula like "Assert $p$ only if you Know $p$."*

  **1. The Lottery vs. Conjunction Tension**
  *   **Data:** You can't assert single lottery propositions (Lottery Constraint). You definitely can't assert the conjunction of all of them.
  *   **Tension:** If the norm is probabilistic (e.g., $>0.99$), you *should* be able to assert the single ticket claim. If you can't, the norm must be non-probabilistic (e.g., Knowledge). But if it's Knowledge, why does the conjunction feel *worse* than the single claim? Both are unknown.
  *   **Status:** This kills pure Probabilistic norms. It puts pressure on Knowledge norms to explain the *aggregation* problem.

  **2. The Selfless Assertion vs. Knowledge Norm Tension**
  *   **Data:** In Selfless Assertion, the agent asserts $p$ with excellent evidence but *without belief*.
  *   **Tension:** Standard epistemology holds Knowledge entails Belief ($K \rightarrow B$). The Knowledge Norm says: Assert $p$ only if you Know $p$. Therefore, Assert $p$ only if you Believe $p$.
  *   **Conflict:** The Selfless Assertion case suggests the assertion is *proper* despite the lack of belief.
  *   **Status:** This is the hardest hit against the Knowledge Norm. To save the Knowledge Norm, you must either: (a) deny Selfless Assertion is proper (counter-intuitive), (b) deny $K \rightarrow B$ (radical), or (c) argue the norm is Knowledge but belief isn't required for Knowledge (radical).
  *   **Verdict:** **Selfless Assertion + $K \rightarrow B$ is incompatible with the Knowledge Norm.**

  **3. The Stakes Sensitivity vs. Invariance Tension**
  *   **Data:** High stakes make assertion feel improper on the same evidence.
  *   **Tension:** If the norm is invariant (Knowledge is constant), why does propriety shift?
  *   **Resolution:** Invariantists say the *norm* is met, but *prudence* forbids it. Contextualists say the *norm* shifts.
  *   **Status:** Negotiable. Invariantism is preferred for theoretical simplicity, but requires a robust account of "pragmatic encroachment" on propriety vs. prudence.

  ---

  ### Phase 4: The Killer Criterion
  *Which single requirement does the most damage to the field of contenders?*

  **The Moore-Paradoxical Constraint (specifically the "P but I don't know P" variant).**

  *   **Why:** It simultaneously knocks out the **Truth Norm** and the **Belief Norm**.
      *   If the norm were Truth: "$p$ but it isn't true" is a contradiction, but "$p$ but I don't know $p$" should be fine. It isn't. It sounds absurd.
      *   If the norm were Belief: "$p$ but I don't believe $p$" is absurd (good), but "$p$ but I don't know $p$" should be fine. It isn't.
      *   If the norm were Justification: "$p$ but I aren't justified" should be absurd. It is. But Gettier cases show justification isn't enough.
  *   **Result:** This constraint is the primary driver for the **Knowledge Norm**. It is the strongest argument *for* Knowledge.
  *   **Caveat:** As noted in the Tension Map, the **Selfless Assertion** case is the primary driver *against* the Knowledge Norm. The field is currently stuck between the Moore Data (favoring Knowledge) and the Selfless Data (favoring Justification/Evidence norms).

  ---

  ### Phase 5: Scorecard
  *Evaluation of major contenders against the Hard Desiderata.*

  | Norm Theory | Challenge Pattern | Lottery Constraint | Selfless Assertion | Moore-Paradox ($K$-version) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Truth Norm**<br>(Assert $p$ only if $p$) | **FAIL.** Doesn't explain "How do you know?" challenge. | **FAIL.** Lottery tickets are true/false, doesn't explain impropriety. | **PASS.** Truth is independent of belief. | **FAIL.** "$p$ but I don't know $p$" wouldn't be absurd. | **Dead.** Too weak. Ignores the agent's relation to $p$. |
  | **Belief Norm**<br>(Assert $p$ only if you believe $p$) | **FAIL.** Challenge would be "Do you believe it?" | **FAIL.** I can believe my ticket lost. | **FAIL.** Selfless assertion is proper without belief. | **PARTIAL.** Explains "$p$ but I don't believe," fails "$p$ but I don't know." | **Dead.** Allows too much (lottery), forbids too much (selfless). |
  | **Justification Norm**<br>(Assert $p$ only if justified) | **WEAK.** "How are you justified?" is close, but "Know" is specific. | **FAIL.** Statistical evidence is justification. | **PASS.** Selfless asserter has justification. | **FAIL.** Gettier cases are justified but asserting them feels off. | **Contender.** Best fit for Selfless, struggles with Gettier/Lottery. |
  | **Knowledge Norm**<br>(Assert $p$ only if you know $p$) | **PASS.** Perfectly fits "How do you know?" | **PASS.** You don't know lottery outcomes. | **FAIL.** (Assuming $K \rightarrow B$). Forbids proper selfless assertion. | **PASS.** Best explanation of the absurdity. | **Front Runner.** Best overall fit, but bleeds on Selfless cases. |
  | **Contextualist Norm**<br>(Know relative to context) | **PASS.** Explains stakes sensitivity. | **PASS.** Standards rise in lottery contexts. | **PASS.** Can adjust standards for psychological blocks. | **WEAK.** Makes Moore-paradoxes context-dependent (risky). | **Contender.** Saves phenomena by multiplying norms. Complex. |

  ---

  ### Phase 6: Flagged Bad Desideratum
  *One requirement often demanded that we must reject.*

  **"Every improper assertion must be blameworthy."**

  *   **Why it's bad:** This conflates the *norm* with *sanction*. Norms govern correctness; blame governs culpability.
  *   **The Data:** If I assert $p$ based on excellent evidence, and $p$ is false (Gettiered or misleading evidence), I have violated the Truth Norm (and arguably the Knowledge Norm). But I am not blameworthy. I am excusable.
  *   **Theoretical Cost:** If a theory requires blameworthiness for every violation, it cannot account for **excusable error**. A working theory of assertion must allow for **Proper but False** (impossible) vs **Improper but Excusable** (common).
  *   **Instruction:** Do not build a theory that makes violation entail blame. Build a theory that makes violation entail *criticizability*, where criticism can be deflected by excuses (evidence was good, stakes were low, etc.).

  ### Summary for the Working Epistemologist
  To build an adequate theory, you must prioritize the **Challenge/Retraction data** (which favors Knowledge) while finding a way to accommodate **Selfless Assertion** (which favors Justification/Evidence). The most promising path is likely a **Knowledge Norm** that decouples Knowledge from Belief (allowing Selfless Assertion) or a **Evidence Norm** that is strong enough to rule out Lottery propositions (mimicking Knowledge). Do not sacrifice the distinction between Propriety and Blamelessness to save a failing norm.
