answer: |-
  This is a fantastic pairing. You have identified exactly the right tension: Williams is often accused of focusing too much on the *agent's* psychological comfort (integrity) rather than the *victim's* suffering, while Omelas forces us to stare directly at the victim. Using them together prevents students from treating Williams's integrity objection as mere self-indulgence.

  Here is a reading of the two texts together, an analysis of where the analogy holds and breaks, and a suggestion for a different Williams concept that might fit even tighter.

  ### 1. The "One Thought Too Many" and the Stayers
  You are right to focus on the **justifications** the citizens of Omelas construct. This is the strongest point of contact with Williams.

  In Williams's "One Thought Too Many" example, the husband who calculates the utilitarian optimificness of saving his wife has already damaged the relationship. The calculation itself is a betrayal of the commitment.

  In Omelas, look at the passage where Le Guin describes the citizens' reaction after seeing the child. She writes that they know they *could* free the child, but they understand that if they did, "all the prosperity and beauty and delight of Omelas would vanish." Then comes the crucial paragraph:

  > *"Their tears at the bitter injustice dry when they begin to perceive the terrible justice of reality, and to accept it."*

  This is the Williamsian corruption.
  *   **The Initial Reaction:** Horror. This is the unmediated moral response (what Williams might call a "moral sentiment" grounded in their actual self).
  *   **The "One Thought":** The utilitarian calculus. "The happiness of thousands outweighs the misery of one."
  *   **The Corruption:** Once they accept that thought, they have to suppress the horror. They have to tell themselves the child is "too degraded" to feel much anyway, or that the child's suffering is the necessary price of "high culture."

  **Pedagogical Point:** The stayers don't just *do* the utilitarian thing; they *become* utilitarians. They internalize the calculus to protect their integrity from the cognitive dissonance of the horror. In Williams's terms, they have allowed the "impartial standpoint" to colonize their personal moral landscape. They have had "one thought too many" about the child's suffering, turning a human being into a variable.

  ### 2. The Walkers: Integrity or Irresponsibility?
  This is your sticking point: *Are the walkers the ones with integrity?*

  **The Williamsian Case for the Walkers:**
  For Williams, integrity is about fidelity to the projects and commitments that make you *you*. If my identity is grounded in "I am not a person who profits from torture," then staying in Omelas violates my integrity.
  The walkers refuse to let the utilitarian calculus define the boundaries of their moral life. They recognize that accepting the bargain makes them complicit in a way that fractures their moral self. Walking away is a **negative integrity**: it is the refusal to be the kind of person who can accept that trade-off.

  **The Williamsian Critique of the Walkers:**
  However, Williams is not a deontologist. He doesn't think rules (like "never profit from torture") are absolute if they lead to disaster.
  *   **The "Ineffectiveness" Objection:** The walkers don't free the child. They don't change the system. They just remove themselves. A hard-line Williamsian might ask: Is walking away just a way to keep your own hands clean while leaving the child in the basement? Is this integrity, or is it moral vanity?
  *   **The "Project" Problem:** Williams's integrity is usually tied to *ground projects* (writing a book, raising a family, a career). Walking away from Omelas isn't really a "project"; it's a negation. They walk into the dark without a destination. This suggests their integrity is purely formal—they know what they are *against*, but not what they are *for*.

  **Verdict:** The walkers embody Williams's warning that utilitarianism can demand too much alienation from our moral instincts. But they also highlight a limit in Williams: Integrity protects the *agent*, but it doesn't necessarily save the *victim*.

  ### 3. A Better Williams Pairing: "Jim and the Indians"
  While "One Thought Too Many" is great for discussing *motivation*, there is a Williams example that structurally mirrors Omelas much better. It is the **Jim and the Indians** thought experiment from *A Critique of Utilitarianism* (1973).

  **The Scenario:** Jim stumbles upon a village where a captain is about to execute 20 indigenous people. The captain offers Jim a deal: If Jim kills *one* of them himself, the captain will let the other 19 go. If Jim refuses, the captain will kill all 20.
  **The Utilitarian Answer:** Jim must kill the one. 1 death < 20 deaths.
  **Williams's Objection:** This ignores the distinction between **what I do** and **what happens**. If Jim kills the one, *he* is a murderer. Utilitarianism treats Jim as a mere channel for the outcome, ignoring his agency.

  **Why this fits Omelas better than "One Thought Too Many":**
  1.  **The Structure:** It is explicitly "suffering of one vs. flourishing of many."
  2.  **The Agency Problem:** This addresses your worry about complicity. In Omelas, the citizens aren't torturing the child (the Captain is). But by staying, they are accepting the deal (like Jim).
  3.  **The Integrity Objection:** Williams argues that Jim should feel a special responsibility for his *own* actions that outweighs the causal responsibility for the captain's actions.
      *   *Application to Omelas:* The citizens argue, "If we leave/free the child, the city falls (negative responsibility)." Williams would say, "But if you stay, *you* are the one choosing to accept the terms of the child's imprisonment (positive agency)."

  **Recommendation:** Assign the Jim excerpt alongside Omelas. It gives students the vocabulary to discuss why "maximizing good" might require becoming a person you don't want to be.

  ### 4. Where the Analogy Breaks Down (The Complicity Gap)
  You asked if Williams has the resources to condemn the *stayers*, given that they are beneficiaries, not torturers. This is the critical limit.

  *   **Williams is Agent-Centered:** Williams's integrity objection works best when the agent is asked to *commit* the atrocity (Jim pulling the trigger). It is weaker when the agent is asked to *tolerate* an atrocity committed by others.
  *   **Omelas is System-Centered:** Le Guin is interested in structural sin. The citizens of Omelas aren't just facing a one-off choice like Jim; they are living inside a machine.
  *   **The Gap:** Williams might say the citizens of Omelas are not violating their integrity by staying, because *they* didn't put the child in the basement. They are just enjoying the fruits of a society they didn't build.
  *   **The Counter:** Le Guin implies that their *continued presence* is what powers the magic. Their acceptance is the fuel. Here, Le Guin goes beyond Williams. She suggests that **beneficiary complicity** is enough to violate integrity. You don't have to pull the trigger; you just have to enjoy the safety the shooting provides.

  **Teaching this tension:** Ask students: *If Williams thinks Jim shouldn't kill the one Indian, would he tell the citizens of Omelas to leave?*
  *   If Williams says "Stay, you aren't the killers," he looks like a utilitarian.
  *   If Williams says "Leave, it corrupts you," he admits integrity applies to beneficiaries, not just agents.

  ### 5. Lesson Plan Suggestion
  Here is a way to structure the discussion to hit your specific goals:

  **Step 1: The Stayers' Rationalization (The "One Thought")**
  *   **Read:** The section of Omelas describing the citizens' tears drying and their acceptance of the "terrible justice."
  *   **Discuss:** What "thought" did they have that allowed them to stay?
  *   **Connect:** Introduce Williams's "One Thought Too Many." Ask: Does calculating the "greater good" change who you are? Does it alienate you from your initial horror?

  **Step 2: The Walkers and Integrity**
  *   **Read:** The ending ("They keep walking... into the darkness").
  *   **Discuss:** Why don't they try to free the child? (Le Guin says the terms are absolute; breaking them destroys everything).
  *   **Connect:** Is walking away an act of integrity (refusing to be complicit) or cowardice (refusing to engage with the hard moral calculus)?
  *   **Williams Check:** Does Williams value "keeping your soul clean" over "doing the most good"?

  **Step 3: The Jim Parallel (The Agency Problem)**
  *   **Read:** The Jim and the Indians summary.
  *   **Discuss:** Jim is offered a deal; Omelas citizens live inside a deal.
  *   **Crucial Question:** Williams says Jim shouldn't kill the one because it makes *him* a murderer. But the Omelas citizens aren't murderers. So why is staying wrong?
  *   **Goal:** Push students to see that Le Guin expands Williams. It's not just about *doing* evil; it's about *accepting* a world where evil is the foundation of your good.

  ### Summary for your prep
  *   **Vindication:** The story vindicates Williams's claim that utilitarian justifications can be psychologically corrupting (the stayers).
  *   **Limit:** The story exposes Williams's limitation regarding *structural* complicity. Williams focuses on the individual act; Le Guin focuses on the societal contract.
  *   **Best Concept:** Use **"Jim and the Indians"** for the structural parallel, but keep **"One Thought Too Many"** for the psychological analysis of the stayers.

  This pairing works because Le Guin forces the utilitarian calculus to its literal extreme (a literal child in a basement), while Williams provides the vocabulary for why a rational agent might reject that calculus even if the math is correct. The walkers aren't necessarily "right" in a consequentialist sense, but they are "whole" in a Williamsian sense.
