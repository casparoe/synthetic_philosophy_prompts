      *Move 5:* Strong Challenge. Clara identifies a genuine tension: if value is mind-independent, why does epistemic access matter? This forces David to explain how a hidden fact reduces value. It highlights the difference between *being* valuable and *being experienced as* valuable. If the forgery is undetectable, its "forgery-ness" remains inert regarding experience, challenging David's claim that history is *experienced*.
