  The situation you are describing lies at the heart of **Bayesian Epistemology**, specifically within the framework of **Jeffrey Conditionalization** (also known as **Probability Kinematics**). You have accurately identified that there is no single, settled "Gettier-style" label that encompasses the entire tangle of issues (underdetermination, partition choice, and rigidity) as one unified noun phrase. Instead, the literature typically treats them as distinct but related objections to Jeffrey Conditionalization.

  Here is how the established terminology breaks down:

  1.  **The Context:** The general scenario of updating on evidence that does not yield certainty (P(E) < 1) is standardly called **The Problem of Uncertain Evidence** (or sometimes **Soft Evidence** in AI/Statistics).
  2.  **The Framework:** The rule you are attempting to use is **Jeffrey Conditionalization** (Richard Jeffrey, 1965).
  3.  **The Rigidity Issue:** The constraint that conditional probabilities must remain fixed ($P_{new}(H|E) = P_{old}(H|E)$) is called the **Rigidity Condition** (or **Sufficiency Condition**). Criticisms of this are referred to as **The Rigidity Objection** (prominently discussed by David Christensen and Isaac Levi).
  4.  **The Partition Issue:** The problem that different partitions yield different posteriors is called **The Partition Problem** (or **Partition Dependence**). This is often discussed alongside **The Input Problem**, which asks where the new probabilities for the partition ($P_{new}(E_i)$) come from. While "The Input Problem" sometimes broadly covers *what* is learned (the partition) and *how much* (the probabilities), it does not typically encompass the Rigidity constraint.

  Because the literature treats these as separate objections (Rigidity vs. Partition/Input) rather than a single named paradox, there is no single established label for the *conjunction* of these difficulties. However, they collectively constitute the foundational challenges to the coherence of Probability Kinematics.

  Given the lack of a settled umbrella term for this specific cluster of underdetermination issues, the most fitting coinage is **The Kinematic Underdetermination Problem**. This label captures the framework (Probability Kinematics), the core symptom (the posterior is underdetermined), and distinguishes it from general underdetermination in science or other areas of belief revision.

