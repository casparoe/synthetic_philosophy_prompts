      Let's refine that to: "How do you verify the output of the deliberation without already knowing the answer?"

      *Actually, let's look at the "Indirect Normativity" specific weakness.* The weakness is: You need to specify the deliberation process. If you specify it wrong, you get garbage. If you specify it right, you basically solved alignment.
      *Dreaded Question:* "You said hard-coding values is bad. But you *are* hard-coding the deliberation process. Why is that code any less buggy than the values?" -> This is the strongest engineering objection.

  9.  **Finalizing the Output Structure:**
      *   Intro.
      *   The 8 Questions (Phrasing, Reply, Soft Spot).
      *   The Dreaded Question.
