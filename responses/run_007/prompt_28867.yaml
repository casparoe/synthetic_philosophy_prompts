      *   **Conclusion:** Summarize the verdict. The friend is right that it's a massive problem, but maybe wrong that it's strictly "self-defeating" in a logical sense. It makes the view costly.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Correction on Attribution:* The term "Paradox of Phenomenal Judgment" is specifically associated with **David Chalmers** (in *The Conscious Mind*), though he attributes the worry to others. Keith Frankish discusses it too. I should mention Chalmers as he is the most prominent modern defender who grapples with this.
      *   *Nuance on "Self-Defeating":* A theory is self-defeating if accepting it gives you a reason to reject it. If epiphenomenalism implies we can't know anything about consciousness, but the theory is *about* consciousness, that's bad. The friend says it undercuts the *evidence*. The epiphenomenalist says the evidence is *acquaintance*, not inference.
      *   *Key Distinction:* Knowledge by Acquaintance vs. Knowledge by Description/Judgment. Epiphenomenalists lean heavily on Acquaintance.
      *   *Tone:* Keep it balanced. Don't say the friend is "wrong," but rather that the argument is a standard, strong objection that has standard, costly replies.

  6.  **Refining the "Self-Defeating" Analysis:**
