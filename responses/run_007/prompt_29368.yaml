prompt: |-
  I'm a quality assurance manager at a pharmaceutical manufacturer. When we get out-of-spec results — a batch failing purity testing, say — we have to decide whether it's a one-off or shares a mechanism with other recent failures, because that determines whether we shut down a whole production line or just quarantine the one batch. The trouble is, we don't have a clear framework for what counts as 'the same mechanism.' Two failures can look similar but have different root causes; two failures can look quite different but trace back to the same upstream issue. I know there's philosophical work on mechanistic explanation and what individuates mechanisms, but I need it operationalised for people who aren't philosohpers. Write me a decision procedure my investigators can follow: questions to ask in order, what counts as evidence for sameness versus difference of mechanism, where the procedure has to hand off to engineering judgement, and where it might give an answer we'd rather not hear. Then run it on two cases: (a) two batches failing purity testing a week apart on the same line, with no other obvious changes, and (b) a purity failure on one line and a dissolution failure on another line that both started after a shared raw material supplier changed their process. Flag the steps where the procedure is really just judgement dressed up as a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Quality Assurance (QA) Manager at a pharmaceutical manufacturer.
      *   **Problem:** Need to distinguish between "same mechanism" vs. "different mechanism" for Out-of-Specification (OOS) results to decide on scope of corrective action (single batch vs. line shutdown).
      *   **Challenge:** Current framework is vague. Philosophical concepts exist (mechanistic explanation, individuation) but need operationalization for non-philosophers.
      *   **Deliverable:** A decision procedure (checklist/flowchart style) with specific questions, evidence criteria, handoff points to engineering judgment, and warnings about uncomfortable answers.
      *   **Application:** Run the procedure on two specific cases:
          *   Case (a): Two purity failures, same line, one week apart, no obvious changes.
          *   Case (b): Purity failure (Line 1) + Dissolution failure (Line 2), shared raw material supplier change.
      *   **Constraint:** Flag steps where the procedure is essentially "judgment dressed up as a checklist."

  2.  **Deconstruct "Mechanism" in a Pharma Context:**
      *   Philosophically, a mechanism is a structured set of entities and activities organized to produce a phenomenon (Machamer, Darden, Craver).
      *   In Pharma QA, "mechanism" translates to "Root Cause Pathway."
      *   *Same Mechanism:* Same entity (equipment, material, person) + Same activity (failure mode) + Same organizational linkage.
      *   *Different Mechanism:* Different entity OR Different activity OR Coincidental correlation.
      *   *Key nuance:* Surface symptoms (OOS type) $\neq$ Mechanism. Root cause = Mechanism.

  3.  **Drafting the Decision Procedure (The "Mechanistic Identity Protocol"):**
      *   *Goal:* Make it actionable, step-by-step, but honest about uncertainty.
      *   *Structure:*
          1.  Phenotypic Comparison (What does the failure look like?)
          2.  Temporal/Spatial Proximity (When and where?)
          3.  Component/Entity Tracing (What touched the product?)
          4.  Activity/Process Tracing (What happened during manufacturing?)
          5.  Intervention Test (If we fix X, does Y stop?)
          6.  Judgment Handoff (Where do we admit we don't know?)
      *   *Evidence Weighting:* Need to distinguish between *necessary* conditions and *sufficient* conditions for "sameness."
      *   *Uncomfortable Answers:* The procedure must allow for "Shutdown Line" even if it hurts production targets.

  4.  **Refining the Steps (incorporating philosophical underpinnings without jargon):**
      *   *Individuation:* How do we count mechanisms as one or two?
      *   *Step 1 (Phenotype):* Are the OOS profiles chemically/physically identical? (e.g., same impurity peak vs. different one).
      *   *Step 2 (Common Cause):* Is there a shared node in the process flow? (Material, Equipment, Utility, Human).
      *   *Step 3 (Failure Mode):* Is the *way* it broke the same? (e.g., thermal degradation vs. contamination).
      *   *Step 4 (Intervention):* This is the causal test. If we swap the component, does the error persist?

  5.  **Addressing the "Judgment dressed as Checklist" Constraint:**
      *   I need to explicitly mark where human expertise overrides the binary "Yes/No."
      *   Example: Defining "significant" similarity in impurity profiles.
      *   Example: Deciding if a supplier change is "relevant" to the specific failure mode.

  6.  **Developing the Two Cases:**
      *   *Case (a):* Same line, same test, close time. High suspicion of same mechanism. *Risk:* Assuming common cause when it's random noise (Type I error).
      *   *Case (b):* Different lines, different tests, shared material. High suspicion of systemic supply chain issue. *Risk:* Dismissing because tests are different (Type II error).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the philosophical basis (causal pathways) but keep it practical.
      *   *The Protocol:* Name it something official sounding. "Mechanistic Identity Assessment Protocol (MIAP)."
      *   *Steps:*
          1.  Symptom Mapping.
          2.  Process Path Overlap.
          3.  Failure Mode Physics.
          4.  The "Intervention" Logic.
          5.  The "Stop" Rule.
      *   *Flags:* Use icons or bold text to indicate "Judgment Zone."
      *   *Case Studies:* Walk through step-by-step.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too abstract?
      *   *Fix:* Add specific examples of evidence (e.g., "chromatogram overlay," "batch records").
      *   *Critique:* Did I address the "uncomfortable answer"?
      *   *Fix:* Add a specific section on "The Pre-Mortem" or "Uncomfortable Outcomes."
      *   *Critique:* Did I flag the judgment calls?
      *   *Fix:* Create a specific "Transparency Log" section in the procedure where they must write down *why* they made a judgment call.

  9.  **Final Polish:**
      *   Ensure tone is professional, authoritative, yet humble about uncertainty.
      *   Check that the distinction between "mechanism" (root cause pathway) and "symptom" (OOS result) is clear throughout.
      *   Make sure the philosophical concept of "mechanistic individuation" is translated into "Shared Causal Node."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic problem of **mechanistic individuation**. In philosophy of science, a mechanism is defined not by its output (the failure), but by the organized set of entities and activities that produce it. Two failures share a mechanism only if they share the *same causal pathway*, not just the same symptom.

  Below is the **Mechanistic Identity Assessment Protocol (MIAP)**. It is designed to move investigators from "These look alike" to "These *are* alike."

  ### Part 1: The Decision Procedure (MIAP v1.0)

  **Objective:** Determine if Failure A and Failure B are instantiations of the same causal mechanism.
  **Outcome:** "Common Mechanism" (Systemic Action) vs. "Distinct Mechanisms" (Localized Action) vs. "Indeterminate" (Precautionary Action).

  #### Phase 1: Phenotypic Mapping (The "What")
  *Goal: Determine if the failures are chemically/physically identical.*

  1.  **Overlay the Data:** Place the analytical data (chromatograms, spectra, particle size distributions) of Failure A and Failure B side-by-side.
      *   *Evidence for Sameness:* The specific impurity peaks, degradation products, or physical defects match in identity and relative ratio.
      *   *Evidence for Difference:* Failure A is Impurity X; Failure B is Impurity Y. Or, Failure A is high potency; Failure B is low potency.
      *   **[JUDGMENT FLAG 1]:** *Defining "Match."* Is a 5% shift in the ratio of two impurities a different mechanism or just noise? The investigator must document the tolerance threshold used here. There is no universal number; this is expertise dressed as a measurement.

  2.  **Characterize the Failure Mode:** Describe the physics/chemistry of the failure.
      *   *Examples:* Thermal degradation, shear stress, cross-contamination, microbial ingress.
      *   *Rule:* If the physics are mutually exclusive (e.g., Thermal Degradation vs. Freezing Damage), mechanisms are **Distinct**. Stop here.

  #### Phase 2: Causal Pathway Tracing (The "How")
  *Goal: Identify shared nodes in the process network.*

  3.  **Map the Process Intersection:** Trace the batch records backward from the failure point.
      *   *Question:* Did the batches share any physical entity (Equipment, Raw Material Lot, Utility Line, Operator)?
      *   *Evidence for Sameness:* Both batches used Mixer #4 and Raw Material Lot #123.
      *   *Evidence for Difference:* Batches used different lines, different material lots, and different shifts.
      *   **[JUDGMENT FLAG 2]:** *Relevance of Shared Nodes.* Sharing a building's HVAC is a shared node. Sharing a specific sieve is a shared node. The investigator must judge if the shared node is *capable* of causing the specific failure mode identified in Phase 1. This is causal reasoning, not just checklist ticking.

  4.  **Identify the Change Point:** Look for deviations in parameters at the shared nodes.
      *   *Question:* Did a parameter drift or change *before* the first failure and persist through the second?
      *   *Evidence for Sameness:* Inlet temperature drifted high on Day 1 and remained high on Day 7.
      *   *Evidence for Difference:* Parameters were stable; failures appear random.

  #### Phase 3: The Intervention Test (The "Why")
  *Goal: Counterfactual reasoning. If we remove the suspect cause, does the effect vanish?*

  5.  **The Substitution Logic:**
      *   *Question:* If we swap the suspected component (e.g., the raw material lot) with a known good one, does the process return to spec?
      *   *Evidence for Sameness:* A batch run with the *old* material passes; a batch run with the *new* material fails.
      *   *Evidence for Difference:* Swapping the material makes no difference; the failure persists (suggesting equipment damage).
      *   *Constraint:* You cannot always run this test in real-time. If you cannot run this test, you must downgrade confidence to "Probable."

  #### Phase 4: The Verdict & Handoff
  *Goal: Assign risk level and trigger action.*

  6.  **Scoring:**
      *   **High Confidence Common Mechanism:** Phase 1 (Match) + Phase 2 (Shared Node) + Phase 3 (Intervention supports). **Action:** Stop Line / Recall.
      *   **Probable Common Mechanism:** Phase 1 (Match) + Phase 2 (Shared Node) + Phase 3 (Not tested). **Action:** Quarantine all intervening batches / Investigate Line.
      *   **Distinct Mechanisms:** Phase 1 (Mismatch) OR Phase 2 (No Shared Node). **Action:** Quarantine specific batch only.
      *   **Indeterminate:** Data is conflicting or missing. **Action:** **Precautionary Principle Applies.** Treat as Common Mechanism.

  7.  **[JUDGMENT FLAG 3]:** *The "Uncomfortable Answer" Clause.*
      *   If the procedure points to "Common Mechanism" but the economic cost of a line shutdown is catastrophic, the investigator must sign a **Deviation Justification**. They must explicitly state: *"I am overriding the mechanistic evidence because..."*
      *   *Rule:* This requires QA Director approval. This prevents production pressure from masquerading as scientific judgment.

  ---

  ### Part 2: Running the Procedure on Your Cases

  #### Case (a): Two purity failures, same line, one week apart, no obvious changes.

  *   **Phase 1 (Phenotype):**
      *   *Check:* Impurity profiles overlaid. Both show a 0.2% spike in the same degradation product.
      *   *Result:* **Match.**
      *   *[Judgment Flag 1]:* Investigator notes that the spike is slightly higher in Batch 2. They judge this consistent with accumulation over time, not a different mechanism.
  *   **Phase 2 (Causal Path):**
      *   *Check:* Same blending vessel. Same operator shift.
      *   *Check:* "No obvious changes" in batch records.
      *   *[Judgment Flag 2]:* Investigator must decide if "no obvious changes" means "no changes" or "no *recorded* changes." They check maintenance logs. A seal replacement occurred 3 days before Batch 1.
      *   *Result:* **Shared Node Identified (Maintenance Event).**
  *   **Phase 3 (Intervention):**
      *   *Check:* Cannot run a new batch immediately without risking more failures.
      *   *Result:* **Not Tested.**
  *   **Verdict:** **Probable Common Mechanism.**
  *   **Action:** Quarantine all batches produced between the maintenance event and now. Inspect the seal. Do not release Batch 1 or 2.
  *   **Uncomfortable Truth:** If the seal looks fine upon inspection, the procedure forces you to admit the mechanism is unknown. You cannot release the batches. The procedure prevents you from saying "It was a fluke" without evidence.

  #### Case (b): Purity failure (Line 1) + Dissolution failure (Line 2), shared raw material supplier change.

  *   **Phase 1 (Phenotype):**
      *   *Check:* Purity failure (chemical) vs. Dissolution failure (physical).
      *   *Result:* **Mismatch.**
      *   *[Critical Junction]:* A naive checklist says "Distinct Mechanisms" because the tests are different. The MIAP requires checking *Failure Mode Physics*.
      *   *Re-evaluation:* Could a raw material change cause *both*? Yes. If the raw material particle size changed, it could affect dissolution (physical) and reactivity during blending (chemical purity).
      *   *Result:* **Physically Plausible Link.**
  *   **Phase 2 (Causal Path):**
      *   *Check:* Different lines, but shared Raw Material Supplier Lot.
      *   *Result:* **Shared Node Identified (Supply Chain).**
  *   **Phase 3 (Intervention):**
      *   *Check:* Run Line 1 with old material lot (if available).
      *   *Result:* Hypothetically, if old material passes, mechanism is confirmed.
  *   **Verdict:** **Probable Common Mechanism (Systemic Supply Issue).**
  *   **Action:** This is the dangerous one. Because the symptoms are different, production will argue they are unrelated. The procedure forces the link via the **Shared Node**. You must quarantine material from that supplier across *all* lines, not just the one that failed purity.
  *   **Uncomfortable Truth:** This shuts down more production than Case (a). It requires admitting that your incoming quality testing (which cleared the new material) was insufficient to detect the mechanistic risk.

  ---

  ### Part 3: Where the Procedure is "Judgment Dressed as a Checklist"

  You asked me to flag where this is really just expert intuition formalized. Here are the three critical failure points of the MIAP:

  **1. The "Relevance" Filter (Phase 2, Step 3)**
  *   **The Checklist:** "Did they share a node?"
  *   **The Judgment:** "Is this node *relevant*?"
  *   **Why it's subjective:** Two batches share the factory's electrical grid. If the failure is voltage-sensitive, that's a mechanism. If the failure is microbial, the grid is irrelevant. The procedure relies on the investigator's mental model of the process physics to filter shared nodes. If their mental model is wrong, the procedure validates the wrong conclusion.
  *   **Mitigation:** Require a "Causal Diagram" to be drawn and signed by Engineering, not just QA.

  **2. The "Noise vs. Signal" Threshold (Phase 1, Step 1)**
  *   **The Checklist:** "Do the profiles match?"
  *   **The Judgment:** "How close is close enough?"
  *   **Why it's subjective:** Analytical variance is real. Is a 2% difference in impurity ratio the same mechanism? It depends on the chemistry. The checklist cannot define this; only a chemist can.
  *   **Mitigation:** Use historical control charts to define "normal variance" statistically, rather than relying on gut feel.

  **3. The Precautionary Override (Phase 4, Step 7)**
  *   **The Checklist:** "If Indeterminate, treat as Common Mechanism."
  *   **The Judgment:** "Is the risk acceptable?"
  *   **Why it's subjective:** The procedure says "Shutdown," but management holds the budget. The "Deviation Justification" is a bureaucratic shield. It makes the judgment visible, but it doesn't remove the pressure to ignore the mechanism.
  *   **Mitigation:** The signature on the Deviation Justification must carry personal liability (e.g., named in the regulatory filing), ensuring the judgment is not taken lightly.

  ### Summary for your Investigators
  Tell them this: **"Symptoms tell you *that* it broke. Mechanisms tell you *why* it broke. This procedure forces you to prove the 'why' is the same before you treat the 'that' as the same. If you cannot prove the 'why', you must assume the worst."**
