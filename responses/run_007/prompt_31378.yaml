  To maintain the coherence of your magistrate's mind, we must treat his prior rulings not as a random assortment of decisions, but as data points generated by a specific judicial philosophy. Below is an analysis of the principles at work, the competing interpretations, and the resulting verdict on the lamp rule.

  ### 1. The Primary Rule: The Principle of Rebuttable Continuity
  This rule best explains the magistrate's prior verdicts as a unified system. It posits that inherited institutions carry a **presumption of latent utility**. The magistrate operates on the belief that in a long-settled city, survival bias has likely preserved useful traditions, even if their original logic is forgotten.

  *   **The Standard:** To abolish an institution, the petitioner must overcome this presumption.
  *   **The Mechanism:** The presumption is rebutted by **active harm** (cost, danger, obstruction). However, the *threshold* of proof required to establish that harm depends on **epistemic clarity**.
      *   If the original purpose is **known and obsolete** (Docking, Inheritance), the presumption of utility is already weakened; proof of active harm is sufficient to abolish.
      *   If the original purpose is **unknown** (Wall, Bell), the presumption of utility remains strong. The institution is kept unless the harm is negligible (Wall) or outweighed by a new, accrued social function (Bell).
  *   **Summary:** *Preserve tradition unless it is actively harmful; if its origin is unknown, the threshold for proving "harm" must be significantly higher.*

  ### 2. The Alternative Rule: The Strict Epistemic Gate
  This rule fits the prior verdicts equally well mathematically but implies a different character motivation. It posits that the magistrate views himself as a guardian of historical integrity rather than a utilitarian manager.

  *   **The Standard:** A magistrate lacks the authority to abolish an institution unless he can articulate *why* it was created and demonstrate that reason no longer applies.
  *   **The Mechanism:** Knowledge of origin is a **necessary condition** for abolition. Without knowing the "why," the magistrate cannot judge the "whether."
      *   **Known Origin + Obsolete + Harmful:** Abolish (Docking, Inheritance).
      *   **Unknown Origin:** Keep, regardless of cost, because the magistrate cannot certify the rule is truly obsolete (Wall, Bell).
  *   **Summary:** *You may not tear down a fence until you know why it was built.*

  ### 3. Predictions for the Lamp Rule

  *   **Under Rebuttable Continuity:** **Grant the Petition.**
      *   *Reasoning:* While the origin is unknown (which usually favors preservation), the harm is not merely economic or trivial; it is existential (frequent fires). The "harm threshold" for unknown institutions is high, but physical destruction of the city exceeds that threshold. The presumption of utility is rebutted by the threat to the city's survival.
  *   **Under Strict Epistemic Gate:** **Refuse the Petition.**
      *   *Reasoning:* The historians cannot recover the rationale. Therefore, the magistrate cannot certify the rule is obsolete. Even if it causes fires, he lacks the epistemic authority to remove it. He might order fire buckets placed near the lamps, but he cannot abolish the rule itself.

  ### 4. Best Guess: Grant the Petition
  **Reason for Preference:** The **Principle of Rebuttable Continuity** creates a more dynamic and responsible character. A magistrate who follows the *Strict Epistemic Gate* is a bureaucrat who values consistency over survival; a magistrate who follows *Rebuttable Continuity* is a steward who values the city's life above its history.

  Furthermore, the *Strict Epistemic Gate* fails to fully account for the **Boundary Wall** ruling. The wall was kept not just because its origin was unknown, but because its upkeep was *trivial*. If the wall were collapsing and crushing pedestrians, a magistrate following *any* coherent logic of governance would likely intervene, regardless of historical ignorance. The variable of "cost/harm" appears in every ruling (Trivial vs. Costly vs. Beneficial), whereas "knowledge" is only binary. Therefore, harm is the true switch, and knowledge is merely the sensitivity setting.

  Since the lamp rule causes **frequent fires** (catastrophic harm) and burdens the poor (social harm), while the night watch renders its likely original purpose (security) redundant, the harm outweighs the presumption of tradition.

  ### 5. Closest Analog: The Boundary Wall
  The **Boundary Wall** is the closest analog because it shares the critical legal feature: **Unknown Origin.**

  *   **Similarity:** In both cases, the historians drew a blank. The magistrate had to rule without knowing the "why."
  *   **Distinction:** The Wall imposed a *trivial* cost; the Lamp imposes a *destructive* cost.
  *   **Why this matters:** Ruling on the Lamp allows the magistrate to define the limit of his conservatism. He kept the Wall because it was harmless; he removes the Lamp because it is hazardous. This shows his traditionalism is not blind, but conditional on safety.

  ### 6. The Distinguishing Case
  To cleanly distinguish between the **Rebuttable Continuity** (Harm-focused) and **Strict Epistemic Gate** (Knowledge-focused) rules in a future chapter, introduce this case:

  **The Case of the Ceremonial Coin:**
  A petitioner asks to abolish an ancient tax requiring every guild to pay one copper coin to the magistrate's office on the winter solstice.
  *   **Facts:** The city antiquary **knows** the origin (it funded a medieval mercenary band long since disbanded), so the purpose is **known and obsolete**. However, the sum is **trivial**, causing no economic hardship or litigation.

  *   **Prediction under Rebuttable Continuity:** **Refuse.** The harm is negligible. The court does not waste time abolishing harmless relics, even if obsolete.
  *   **Prediction under Strict Epistemic Gate:** **Grant.** The origin is known and obsolete. The magistrate has the authority to remove it, regardless of the cost.

  *   **Character Insight:** If he keeps the coin, he is a pragmatist who only acts against harm. If he abolishes it, he is an ideologue committed to logical purity.
