answer: |-
  Your intuition is spot on. This is a classic example of "Gödel hype," where precise mathematical results are stretched into broad philosophical claims that do not strictly follow from the theorems. While the first sentence is a reasonable simplification, the subsequent sentences drift into controversy and error.

  Here is a sentence-by-sentence breakdown of what a logician would accept, what is an overstatement, and why.

  ---

  ### Sentence 1
  > *"Gödel proved that any formal system strong enough to do arithmetic is incomplete: there are true statements it can't prove."*

  *   **Logician's Verdict:** **Mostly Acceptable (with caveats).**
  *   **The Nuance:** This is the standard pop-sci summary of the First Incompleteness Theorem. However, a logician would add three technical conditions that are often omitted:
      1.  The system must be **consistent** (it doesn't prove contradictions).
      2.  The system must be **effectively axiomatizable** (there is a computer program that can list all the axioms).
      3.  The word "true" is tricky. The Gödel sentence is "true" in the *standard model* of arithmetic (the actual natural numbers), but within the system itself, it is merely *undecidable*.
  *   **Bottom Line:** For a general summary, this passes. It captures the core mechanic: syntax (proof) does not capture semantics (truth) completely.

  ### Sentence 2
  > *"That means some mathematical truths are unprovable in principle, by any method whatsoever, not just by one particular formal system."*

  *   **Logician's Verdict:** **False / Major Overreach.**
  *   **Why:** This confuses "incomplete system" with "absolutely unprovable truth."
      *   Gödel showed that for any *specific* formal system, there are statements it cannot prove.
      *   However, if a statement $G$ is unprovable in System $A$, you can simply create System $B$ by adding $G$ as a new axiom. System $B$ can now prove $G$.
      *   There is no theorem stating that there exists a mathematical truth that *no* formal system can ever prove. The theorem states that no *single* system can prove *all* truths.
  *   **The Error:** It implies there is a fixed set of "mathematical truths" that are forever beyond the reach of logic. In reality, mathematics is an open-ended process; we can always extend our axioms to prove previously unprovable statements (at the cost of creating new unprovable statements).

  ### Sentence 3
  > *"It also means AI can never match human mathematicians, because a computer program is just a formal system, so there will always be true statements it can't prove, while humans can just see those truths directly."*

  *   **Logician's Verdict:** **Rejected Speculation (The Lucas-Penrose Argument).**
  *   **Why:** This is a famous philosophical argument (championed by Roger Penrose), but it is **not** a logical consequence of Gödel's theorems, and most logicians and philosophers of mind reject it for several reasons:
      1.  **The "Human System" Problem:** To apply Gödel to humans, you must assume the human mind is a *consistent* formal system. Humans make mistakes and hold contradictory beliefs. If humans are inconsistent, Gödel's theorem doesn't apply to us.
      2.  **The Meta-System Loophole:** How do humans "see" the truth of the Gödel sentence? We don't do it by magic; we do it by reasoning in a *meta-system* (standing outside the original system). A computer program can also be programmed to reason about other systems. An AI isn't limited to one static formal system; it can operate within a hierarchy of systems, just as human mathematicians do.
      3.  **Complexity:** We do not know the "axioms" of the human brain. We cannot construct the specific Gödel sentence for the human mind to show that we can "see" it but the mind cannot.
  *   **Bottom Line:** Gödel limits *formal systems*, not *intelligence*. Inferring that human intuition transcends computation based on this theorem is a philosophical leap, not a mathematical proof.

  ### Sentence 4
  > *"And his second theorem showed that no such system can prove its own consistency, which is why we can never be certain that mathematics itself is consistent."*

  *   **Logician's Verdict:** **Half True, Half Pessimistic Exaggeration.**
  *   **Part A ("No such system can prove its own consistency"):** **True.** This is an accurate summary of the Second Incompleteness Theorem. If a system like Peano Arithmetic could prove its own consistency, it would actually be inconsistent.
  *   **Part B ("We can never be certain that mathematics itself is consistent"):** **Overstatement.**
      *   While System $A$ cannot prove its own consistency, System $B$ (which is stronger) can prove the consistency of System $A$. (For example, Gentzen proved the consistency of Peano Arithmetic using transfinite induction).
      *   We can be "certain" relative to stronger assumptions. The worry is that we eventually run out of stronger assumptions to ground the whole of mathematics (like ZFC set theory).
      *   However, saying we can "never be certain" implies a radical skepticism that isn't warranted. Mathematics has been used for a century since Gödel without a major inconsistency arising. Most mathematicians work under the *assumption* of consistency because it is pragmatically successful, not because they have a metaphysical guarantee.
  *   **Bottom Line:** We lack an *absolute* proof of consistency (one that relies on no assumptions), but we have strong relative proofs. The claim suggests a crisis of confidence that doesn't exist in actual mathematical practice.

  ---

  ### Summary of the Overreach

  1.  **Absolute Unprovability:** The book claims some truths are unprovable by *any* method. Gödel only says they are unprovable within a *fixed* system.
  2.  **Human Exceptionalism:** The book claims humans transcend algorithms. Gödel only says algorithms have limits; it does not prove humans don't share those limits (or that humans are consistent).
  3.  **Radical Skepticism:** The book claims we can't be certain math is consistent. In practice, we accept consistency based on strong evidence and relative proofs, even if an absolute, assumption-free proof is impossible.

  **The Correct Takeaway:**
  Gödel proved that **mathematics cannot be fully automated into a single, static machine.** You cannot write down a finite list of rules that generates every mathematical truth without ever generating a falsehood. However, this does not prevent AI from doing math (AI can change its rules), nor does it prevent humans from being confident in math (we can verify consistency using stronger tools).

  Your feeling of overreach was correct. The book is using Gödel to support a specific philosophical worldview (anti-mechanism/anti-AI) that goes well beyond the math.
