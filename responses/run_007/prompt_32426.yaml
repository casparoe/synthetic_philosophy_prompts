answer: |-
  You have hit on exactly the right tension. In fact, your intuition is sharper than many introductory summaries of the field. You aren't "missing something" in the sense that you've misunderstood the basics; you've identified the central friction point that keeps moral philosophers up at night.

  However, to answer your question directly: **Yes, you are missing something, but not because your logic is wrong.** You are missing the specific reasons why applying Expected Utility Theory (EUT) to morality turns out to be much messier than applying it to empirical facts.

  The literature isn't just rediscovering incommensurability, though that is a huge part of it. Here is the breakdown of why "moral uncertainty" is treated as a distinct beast, and where your skepticism is actually the most productive angle for your piece.

  ### 1. The "Fact" of the Matter (Metaphysics)
  Your argument rests on this premise: *"Uncertainty about which moral theory is correct... is just uncertainty about a fact: the fact of which moral theory is correct."*

  This is the first major hurdle. In empirical uncertainty (e.g., "Will it rain?"), we generally agree there is a mind-independent fact of the matter. In moral uncertainty, we are often dealing with **moral anti-realism**.

  If you are a moral anti-realist (believing moral statements aren't truth-apt facts but expressions of preference), then having a "credence" in utilitarianism is category error. It's like having a 60% credence that "chocolate is better than vanilla." There is no fact to be uncertain about; there is only your current psychological state.

  Even among moral realists, there is a debate about whether moral truths are *discoverable* in a way that warrants probabilistic credences. If moral truths are necessary truths (like math), some argue you should either know them or have no opinion, rather than assigning a probability. So, the very act of assigning a "60% credence" to a moral theory is philosophically contentious in a way that assigning 60% credence to a coin flip is not.

  ### 2. The Intertheoretic Comparison Problem (It's deeper than scaling)
  You identified this: *"Utilitarianism says '10 utils' and deontology says 'forbidden,' and you can't take an average."*

  You suggest this is just incommensurability. But in the moral uncertainty literature (pioneered by philosophers like William MacAskill and Toby Ord), this is treated as a problem specific to *uncertainty*, not just value theory.

  Here is why: If you are 100% Kantian, you don't need to compare Kantian value to Utilitarian value. You just follow Kant. The problem of incommensurability only becomes a decision-theoretic crisis **because** you are uncertain.

  Furthermore, it's not just about scaling (0–10 vs. 0–100). It's about **structural differences**.
  *   **Utilitarianism** is maximizing. It wants the *most* good.
  *   **Deontology** is constraining. It sets *limits*.
  *   **Virtue Ethics** is aretaic. It asks what a good person *would do*.

  How do you maximize expected value when one theory says "maximize value" and another says "do not violate rights regardless of value"? If you assign 40% credence to Deontology, does that mean you are allowed to violate rights 40% of the time? Or does the 40% credence act as a veto? EUT breaks down here because the *functions* of the theories are different, not just their units.

  ### 3. The "Fanaticism" Problem
  This is the most practical reason why moral uncertainty is distinct from factual uncertainty.

  In factual EUT, outcomes are usually bounded. In moral EUT, some theories posit **infinite or lexicographically higher values**.
  *   **Example:** Suppose you assign a 1% credence to a moral theory that says "Preventing suffering in the far future is infinitely more important than anything happening now."
  *   **Calculation:** 1% × Infinity = Infinity.
  *   **Result:** According to Maximize Expected Choice-worthiness (MEC), you must ignore all your other 99% of moral credences and devote your life to that 1% theory.

  This leads to "moral fanaticism," where a tiny sliver of uncertainty about an extreme theory hijacks your entire decision-making process. This doesn't happen in empirical uncertainty because empirical payoffs are rarely infinite. This forces the literature to develop new decision rules (like "variance voting" or "stochastic dominance") that differ from standard EUT.

  ### 4. Internal vs. External Uncertainty
  Your piece mentions being *"uncertain about their values themselves."* This points to a distinction the literature sometimes glosses over.

  *   **External Uncertainty:** "I know what I value, but I don't know which moral theory correctly describes the universe." (This is what MacAskill focuses on).
  *   **Internal Uncertainty:** "I don't even know what I value. Do I actually care more about loyalty or honesty?"

  Your skepticism is most potent here. If I am unsure about my *own* values, EUT doesn't help because I can't assign the utilities in the first place. This is more psychology/identity than moral philosophy. The academic literature often assumes the "External" model (uncertainty about moral truth), but real people often face the "Internal" model (uncertainty about self). If your piece focuses on real human decision-making, this is a crucial gap in the academic literature you could exploit.

  ### So, is it just incommensurability?
  You asked: *"Is the moral uncertainty literature kind of just an elaborate way of rediscovering the problem of value incommensurability?"*

  **Verdict:** It's not *just* incommensurability, but incommensurability is the engine that makes moral uncertainty distinct from factual uncertainty.

  In factual uncertainty, we assume a common currency (usually money or utility) across all hypotheses. In moral uncertainty, the hypotheses themselves **deny the existence of a common currency.**

  *   **Factual Uncertainty:** Hypothesis A and Hypothesis B both agree that "human welfare" is the metric; they disagree on whether Policy X increases it.
  *   **Moral Uncertainty:** Theory A says "human welfare is the metric." Theory B says "rights are the metric, and welfare is irrelevant."

  Therefore, you cannot simply "do EUT" because EUT requires a common utility function to calculate the expectation. The literature is essentially an attempt to build a "meta-utility function" that can contain theories which explicitly reject meta-utility functions.

  ### Angles for Your Piece
  Since you are a journalist, here is where the story lies:

  1.  **The "Moral Math" Trap:** Effective Altruists and rationalists try to use EUT for moral decisions (Maximize Expected Choice-worthiness). But because of the "Fanaticism Problem," this can lead to absurd conclusions (e.g., ignoring current suffering for a tiny chance of saving the universe). This shows the limits of applying math to values.
  2.  **The Experience of Uncertainty:** Philosophers treat moral uncertainty as "uncertainty about truth." But for normal people, it feels like "uncertainty about identity." When you say, "I'm not sure if abortion is wrong," are you unsure about a cosmic fact, or unsure about your own commitment to bodily autonomy vs. potential life? The literature mostly ignores the latter.
  3.  **The "Common Scale" Illusion:** Your insight about incommensurability is the killer app. We pretend we can weigh "freedom" against "security" on a single scale. Moral uncertainty reveals that this scale is a fiction we create to make decisions, not something that exists in the world.

  **Summary:** You aren't wrong to think EUT *should* work. That is literally the dominant view in the field (called **MEC**: Maximize Expected Choice-worthiness). But the field exists because when you actually try to do it, the math explodes due to incommensurability, infinite values, and the metaphysical status of moral claims. Your skepticism is a feature, not a bug—it highlights the gap between clean philosophical models and messy human valuation.
