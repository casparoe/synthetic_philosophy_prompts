answer: |-
  It is a pleasure to correspond with someone who has brought the observational precision of a chemist to the often murky solutions of moral philosophy. You have isolated a phenomenon that has, in the last two decades, become a central topic in the ethics of blame and moral responsibility. Your intuition is correct: the standard labels (*hypocrisy*, *tu quoque*) are insufficient because they conflate the *truth* of the claim with the *authority* of the speaker.

  Per your request, I will begin by brainstorming the nearest concepts to clear the ground, then settle on the established technical term, and finally address your specific questions regarding the nature, scope, and recoverability of this defect.

  ### Part 1: Brainstorming the Nearest Concepts

  To find the right term, we must distinguish the phenomenon from its neighbors.

  **1. Hypocrisy**
  This is the lay term you likely encountered first. Hypocrisy is a character vice. It describes a discrepancy between what one professes and what one practices. However, as you noted, calling someone a hypocrite is an *ad hominem* attack on their character. It doesn't necessarily explain why their specific *utterance* is infelicitous. One can be a hypocrite and yet speak the truth. The concept of hypocrisy describes the *person*; you are looking for a concept that describes the *normative status of the speech act*.

  **2. Tu Quoque ("You Also")**
  This is a logical fallacy. It occurs when a respondent rejects a premise or conclusion solely because the proponent is inconsistent. In logic, *tu quoque* is irrelevant; the fact that a smoker tells you smoking kills you does not make the claim "smoking kills you" false. However, in moral practice, *tu quoque* often feels compelling, not logically, but normatively. Philosophers have realized that *tu quoque* is often a clumsy attempt to point out a lack of **standing**. The fallacy lies in thinking the claim is *false*; the insight lies in feeling the speaker lacks the *right*.

  **3. The "Clean Hands" Doctrine**
  In law, there is a maxim: "He who comes into equity must come with clean hands." A plaintiff who has acted unethically regarding the subject of the lawsuit may be denied relief. This is very close to what you are describing. It is not that the plaintiff's claim is legally invalid, but that the court will not enforce it *for them*. This is a procedural bar, not a substantive one. Moral philosophy has imported this intuition.

  **4. Moral Authority**
  This is sometimes used, but it can be ambiguous. It often implies a hierarchical status (a parent has authority over a child). Your examples (friends, colleagues) suggest a relationship of moral equality. We need a term that applies to peers.

  ### Part 2: The Established Concept

  The term you are looking for is **Normative Standing** (specifically, **the Standing to Blame**).

  In contemporary moral philosophy (work by R. Jay Wallace, Gary Watson, Pamela Hieronymi, and others), "standing" refers to the normative prerogative to hold another person accountable. It is the moral equivalent of legal standing in a court of law.

  When your friend cheats on his taxes and then blames his brother-in-law for doing the same, the brother-in-law can rightly say: *"You lack the standing to criticize me for this."* This does not mean the criticism is false (it isn't). It means the friend has forfeited the normative privilege to issue that specific demand.

  ### Part 3: Analyzing the Defect

  You asked several precise questions about the edges of this concept. Here is how the literature on standing addresses them.

  **1. Does the defect attach to the blame itself, or only to the act of voicing it?**
  It attaches to the **act of voicing it** (the speech act), not the content.
  Think of it like a judge recusing themselves. If a judge owns stock in a defendant's company, the judge is not forbidden from *believing* the defendant is guilty. The evidence might be overwhelming. But the judge is forbidden from *issuing the verdict*.
  Similarly, when your friend lacks standing, the moral norm he is invoking ( "tax cheating is wrong") remains valid. The brother-in-law really is violating it. But the friend's act of blaming is **infelicitous**. It is a misfire. In some philosophical frameworks, blame issued without standing is not just inappropriate; it is itself a moral wrong (a form of disrespect), because it presumes an equality of commitment that does not exist.

  **2. How does it differ from plain hypocrisy?**
  Hypocrisy is the **condition**; lack of standing is the **consequence**.
  Hypocrisy is a description of the agent's moral state (they violate the norm they enforce). Lack of standing is the normative result of that state.
  Crucially, one can lack standing without being a hypocrite in the full sense. For example, if I committed the same fault ten years ago, repented, and have been perfect since, am I a hypocrite? Perhaps not. But I might still lack standing to blame *you* for it today, because my past involvement makes my criticism seem like a projection of my own guilt rather than a defense of the norm.
  Conversely, one can be a hypocrite but retain standing in certain contexts (e.g., a recovering alcoholic has standing to blame an active alcoholic, despite their own history, because their current commitment is clear).

  **3. Does it apply to all moral criticism or only to blame?**
  It applies primarily to **blame** and **accountability**, not to factual observation or advice.
  *   *Factual:* "You have spinach in your teeth." Standing is irrelevant. I can have spinach in my teeth and still tell you about yours.
  *   *Prudential:* "You shouldn't smoke." Standing is weak here. A smoker can advise a non-smoker not to start.
  *   *Moral Blame:* "You shouldn't have stolen that." Standing is strong here.
  The reason is that blame is not just describing a wrong; it is a **demand for accountability**. It implies, "I represent the moral community in holding you to this standard." If I flout the standard, I cannot represent it. I am no longer a legitimate proxy for the moral norm.

  **4. Do you lose it forever, or can you get it back?**
  Standing is **dynamic and recoverable**. It is not a permanent stain like a logical contradiction.
  The loss of standing stems from a lack of **commitment** to the norm. When you violate a norm and refuse to acknowledge it, you signal that you do not truly endorse the rule you are enforcing on others. This creates a "status inequality"—you are placing yourself above the rule while holding others below it.
  You regain standing by restoring that equality. This is typically done through:
  *   **Confession:** Acknowledging the violation.
  *   **Repentance:** Expressing regret and a commitment to the norm.
  *   **Atonement:** Making amends.
  Once you have "cleaned your hands" (to return to the legal metaphor), your standing is restored. In your tax example, if your friend admits his cheating, pays his back taxes, and *then* criticizes the brother-in-law, the criticism lands differently. It is no longer hypocritical projection; it is a shared acknowledgment of a difficult standard.

  ### Part 4: The Edge Cases (Where the Chemist in You Might Scrutinize)

  There are two "boundary conditions" in the literature that you might find interesting.

  **The "Small Hypocrite" Problem:**
  Does *any* violation remove standing? If I speed once, do I lose the standing to blame a murderer? Intuitively, no. Philosophers argue that standing is lost only when the hypocrisy undermines the **specific commitment** relevant to the blame. Speeding doesn't negate my commitment to "do not kill." But cheating on taxes *does* negate my standing to blame another for cheating on taxes. The fault must be relevantly similar.

  **The "Commitment Condition":**
  Some philosophers (like Wallace) argue that what matters is not perfect compliance, but **commitment**. If I struggle with temper but genuinely try to control it and apologize when I fail, I retain standing to blame others for violence. I am "in the same boat" of trying to be good. Standing is lost primarily when the blamer treats the norm as optional for themselves but mandatory for others (the "exemption" condition).

  ### Summary

  The word you were searching for is **Standing** (or **Normative Standing to Blame**).

  *   **The Defect:** It is a procedural defect in the speech act of blaming, not a truth defect in the proposition.
  *   **The Cause:** It is usually caused by hypocrisy (violating the norm one enforces), which signals a lack of genuine commitment to the norm.
  *   **The Scope:** It applies to moral accountability and blame, not factual correction.
  *   **The Remedy:** It is recoverable through confession, repentance, and realignment with the norm.

  You have identified the difference between the *validity* of a moral claim and the *licensure* of the moral agent. In chemistry, you might have a correct formula (the truth), but if your reagents are contaminated (the speaker), the reaction (the blame) will not proceed as intended. The formula is right, but the experiment is ruined.
