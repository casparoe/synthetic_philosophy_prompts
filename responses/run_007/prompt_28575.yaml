prompt: |-
  I keep coming back to a frustration with the satisficing and bounded rationality literature: the term gets used for a stopping rule, for a decision criterion, for a family of heuristics, and for a claim about what rationality requires under limited computational resources, and these senses slide into one another without anyone laying out the full job description first. Before I read any further, I want the specification. What must an adequate theory of satisficing actually get right? Write the desiderata, each with the case or consideration that makes it a requirement. Cover at least the following terrain and tell me which items are genuine requirements and which are just the tastes of one research program: distinguishing satisficing from maximizing with search costs added back in; the setting and revision of aspiration levels, including what happens after repeated failure or easy success; the difference between satisficing as a criterion for accepting an option and satisficing as a description of how search unfolds; whether a satisficing model must be behaviorally distinguishable from an optimizing model with enough extra parameters, or whether outcome-equivalence to optimization is acceptable; how the theory handles lexicographic and other non-compensatory choice rules; and what it says about why satisficing can be rational rather than merely a bias induced by cognitive limitations.

  For each requirement, mark it negotiable or non-negotiable, and say which single requirement does the most work in eliminating candidate theories. Then, if any subset of the requirements is jointly unsatisfiable—for example, if process realism about bounded computation and equivalence to some optimizing model cannot both be had, or if a mandatory aspiration-adjustment rule conflicts with empirical findings about how people actually search—say so plainly, because that is the part I most want to see. Close with a brief scorecard of how Simon-style aspiration-level models, search-cost and rational-inattention treatments, and the fast-and-frugal heuristics program fare against the list, but keep the scorecard short; the criteria themselves are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Satisficing and Bounded Rationality literature.
      *   **Problem:** The user is frustrated by the conflation of different senses of "satisficing" (stopping rule, decision criterion, heuristic family, normative claim).
      *   **Task:** Define the *desiderata* (requirements) for an adequate theory of satisficing.
      *   **Specific Content Requirements:**
          *   Distinguish satisficing from maximizing with search costs.
          *   Address aspiration level setting and revision (failure/success).
          *   Distinguish criterion vs. search process.
          *   Address behavioral distinguishability vs. outcome-equivalence to optimization.
          *   Handle non-compensatory rules (lexicographic).
          *   Address normative status (rational vs. bias).
          *   Mark each requirement as "Negotiable" or "Non-Negotiable".
          *   Identify the single requirement that does the most work in eliminating candidates.
          *   Identify any jointly unsatisfiable subsets (trade-offs/impossibility results).
          *   Provide a brief scorecard for three specific programs (Simon-style, Search-cost/Rational Inattention, Fast-and-Frugal).
      *   **Tone:** Rigorous, analytical, philosophical/economic precision, direct (no fluff).

  2.  **Deconstruct the Terrain (Drafting the Desiderata):**

      *   *Item 1: Satisficing vs. Maximizing with Search Costs.*
          *   *Issue:* Stigler (1961) argued satisficing is just optimization with search costs. A true satisficing theory needs to show it's distinct, not just a special case of optimization.
          *   *Requirement:* The theory must specify conditions under which satisficing yields different choices or processes than cost-inclusive optimization, or explicitly argue why the distinction is merely procedural.
          *   *Status:* Non-negotiable for a *distinct* theory of satisficing. If it collapses entirely into optimization, it's just optimization.

      *   *Item 2: Aspiration Level Dynamics.*
          *   *Issue:* Simon's original idea wasn't static. It adapts.
          *   *Requirement:* Must specify the mechanism for setting initial aspirations and the update rule (e.g., up after easy success, down after failure).
          *   *Status:* Non-negotiable. Static thresholds are just constraints, not satisficing.

      *   *Item 3: Criterion vs. Search Process.*
          *   *Issue:* Is it about *when to stop* or *what to pick*?
          *   *Requirement:* Must explicitly separate the stopping rule (search) from the acceptance criterion (choice).
          *   *Status:* Non-negotiable. Conflation causes the confusion the user hates.

      *   *Item 4: Behavioral Distinguishability vs. Outcome Equivalence.*
          *   *Issue:* "As-if" optimization (Friedman) vs. Process realism. Can any satisficing behavior be modeled as optimization with weird priors/costs?
          *   *Requirement:* Must take a stance. Either claim process realism is essential (distinguishable) or accept outcome equivalence but justify the descriptive simplicity.
          *   *Status:* Negotiable (depends on the goal: normative vs. descriptive). *Correction:* For a *theory of bounded rationality*, process realism is usually key. But let's mark it carefully. If the goal is "What is rational?", equivalence might be okay. If the goal is "How do humans decide?", it's not. Let's make it Non-Negotiable for a *psychological/cognitive* theory, but Negotiable for a *purely economic* one. Given the prompt's focus on "bounded rationality," I'll lean towards Non-Negotiable for process distinction.

      *   *Item 5: Non-Compensatory Rules.*
          *   *Issue:* Satisficing often implies "good enough on all dimensions" rather than "trade-off."
          *   *Requirement:* Must accommodate or rule out lexicographic/non-compensatory ordering.
          *   *Status:* Negotiable. Satisficing *can* be compensatory (aggregate score > threshold), but often isn't. The theory needs to specify which.

      *   *Item 6: Normative Status (Rational vs. Bias).*
          *   *Issue:* Is it a bug or a feature?
          *   *Requirement:* Must articulate the ecological or computational justification for why satisficing is *appropriate*, not just inevitable.
          *   *Status:* Non-negotiable. Without this, it's just a theory of error.

  3.  **Refining the Requirements (Adding Rigor):**

      *   *Refinement on Item 1:* The "Stigler Critique." The theory must define the *computational boundary*. Optimization assumes the cost function is known/optimizable. Satisficing assumes the cost of optimization is unknown or intractable.
      *   *Refinement on Item 4:* This is the "Identification Problem." If every satisficing rule can be rationalized as optimization with specific cost functions, is the theory empty? The requirement should be about *explanatory parsimony* or *process evidence*.

  4.  **Identifying the "Killer" Requirement:**
      *   Which one eliminates the most candidates?
      *   Likely the **Distinguishability from Optimization (Item 1/4 combo)**. If a model can be trivially rewritten as constrained optimization, it fails to be a distinct theory of bounded rationality. It becomes neoclassical economics with an extra variable.
      *   *Decision:* The requirement for **Process Distinctiveness (Non-collapsibility)** is the heavy lifter.

  5.  **Identifying Joint Unsatisfiability (The Trade-off):**
      *   *Conflict:* **Process Realism vs. Normative Optimality.**
      *   If you demand the model accurately reflects cognitive limits (Process Realism), it often fails to maximize utility (Normative Optimality).
      *   If you demand it be "Rational" (in the sense of achieving good outcomes), it often looks like Optimization with costs.
      *   *Specific Tension:* **Aspiration Stability vs. Empirical Volatility.** Simon's theory suggests stable adjustment. Empirical data shows people often stick to aspirations too long or adjust erratically.
      *   *Better Tension:* **Computational Tractability vs. Completeness.** A theory that fully specifies *how* aspirations are set requires a meta-algorithm. If that meta-algorithm is optimal, we regress to infinite regress (optimizing the optimization). If it's heuristic, why is *that* rational? This is the "Regress Problem."

  6.  **Drafting the Scorecard:**
      *   *Simon-style:* Good on aspirations, weak on specific search algorithms, vulnerable to Stigler critique.
      *   *Search Cost/Rational Inattention:* Good on normative justification, fails on process distinction (it *is* optimization).
      *   *Fast-and-Frugal:* Good on process/distinction, weak on normative generality (ecological rationality is context-specific).

  7.  **Review against Constraints:**
      *   Mark Negotiable/Non-Negotiable.
      *   Identify the single requirement doing the most work.
      *   Identify unsatisfiable subsets.
      *   Keep scorecard short.
      *   Tone: Precise, no fluff.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address "lexicographic"? Yes, include in the structure of preferences.
      *   *Check:* Did I address "revision after failure"? Yes, in aspiration dynamics.
      *   *Check:* Is the distinction between stopping rule and acceptance criterion clear? Yes.
      *   *Nuance:* Be careful with "Non-Negotiable." In philosophy of science, almost nothing is truly non-negotiable. I will frame them as "Non-Negotiable for a *robust* theory of Bounded Rationality" to be precise.
      *   *The "Killer" Criterion:* I need to be specific. It's the **Non-Collapsibility Condition**.
      *   *The Impossibility:* The **Regress of Meta-Rationality**. If you explain satisficing as rational, you need a model for choosing the satisficing rule. If that model is optimizing, you haven't escaped optimization. If it's satisficing, you need a meta-rule.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Self-Correction during final output generation)*: Ensure I explicitly answer the "which items are genuine requirements and which are tastes" part of the prompt. I will integrate this into the Negotiable/Non-Negotiable labels.

  *(Refining the Unsatisfiable Subset)*: The prompt asks for "jointly unsatisfiable." The classic tension is between **Descriptive Accuracy (Process)** and **Formal Tractability (Optimization Equivalence)**. You usually can't have a model that is psychologically realistic *and* mathematically equivalent to a smooth optimization problem without losing the realism. I will frame this as the **Process-Outcome Trade-off**.

  *(Refining the Scorecard)*: Keep it very tight.

  Let's write it.cw
answer: |-
  Here is the specification for an adequate theory of satisficing, structured as desiderata with associated justifications, modality, and critical analysis.

  ### Desiderata for a Theory of Satisficing

  **1. The Non-Collapsibility Condition**
  *   **Specification:** The theory must define conditions under which satisficing yields different predictions (process or outcome) than neoclassical optimization augmented with search costs (the Stigler critique). It must specify why the cost of *calculating* the optimal search cost is not itself optimized.
  *   **Case/Consideration:** If satisficing is merely optimization with an added cost parameter, it is not a distinct theory of rationality; it is neoclassical economics with a larger budget constraint. A distinct theory requires a discontinuity in the computational method, not just the inputs.
  *   **Status:** **Non-Negotiable.** Without this, "bounded rationality" is semantically empty.

  **2. Aspiration Dynamics (The Delta Rule)**
  *   **Specification:** The theory must provide a formal rule for setting initial aspiration levels and a revision function for updating them based on experience (e.g., raise after easy success, lower after repeated failure). It must specify the rate of adjustment and the memory window used.
  *   **Case/Consideration:** Static thresholds are simply constraints, not satisficing. The core of Simon's insight is the *adaptive* nature of the agent. A theory without revision mechanics cannot explain habituation, frustration, or the shift from exploration to exploitation.
  *   **Status:** **Non-Negotiable.**

  **3. Process/Outcome Decoupling**
  *   **Specification:** The theory must explicitly distinguish between the *stopping rule* (when search ends) and the *acceptance criterion* (which option is chosen from the set found). It must state whether these are governed by the same threshold or distinct mechanisms.
  *   **Case/Consideration:** Confusion arises when authors treat "finding the first option > $\alpha$" as identical to "choosing the best option found so far if > $\alpha$." These generate different choice distributions. A complete theory must separate the search termination logic from the final selection logic.
  *   **Status:** **Non-Negotiable.**

  **4. The Identification Stance**
  *   **Specification:** The theory must declare whether behavioral distinguishability from optimization is required. If outcome-equivalence is permitted, the theory must justify why the satisficing description is preferable (e.g., parsimony, cognitive plausibility) despite the existence of an isomorphic optimizing model.
  *   **Case/Consideration:** Friedman's "as-if" argument suggests outcome-equivalence is sufficient. Bounded rationality suggests process realism is necessary. A theory cannot hedge; it must state whether it aims to describe the *black box* or only the *input-output* relation.
  *   **Status:** **Negotiable** (Depends on whether the research program is psychological or economic). *However, for a theory of Bounded Rationality specifically, Process Realism is effectively Non-Negotiable.*

  **5. Structural Compatibility (Compensatory vs. Non-Compensatory)**
  *   **Specification:** The theory must specify whether satisficing operates on a unidimensional aggregate utility (compensatory) or across multiple independent dimensions (non-compensatory/lexicographic).
  *   **Case/Consideration:** "Good enough" can mean "total score > 50" or "no dimension below threshold." These are mathematically distinct preference structures. Satisficing is often associated with non-compensatory screening, but this is not logically necessary. The theory must commit.
  *   **Status:** **Negotiable** (A matter of model specification, though non-compensatory is more consistent with low-computation claims).

  **6. The Ecological Normativity Claim**
  *   **Specification:** The theory must articulate why satisficing is *adaptive* rather than merely *deficient*. It must specify the environmental structures (e.g., high uncertainty, non-stationary distributions) where satisficing outperforms optimization attempts.
  *   **Case/Consideration:** If satisficing is always dominated by optimization (even with costs), it is a theory of bias/error, not rationality. To claim "rationality," the theory must demonstrate domains where the heuristic yields higher net returns than optimization attempts.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Critical Analysis

  **The Single Requirement Doing the Most Work**
  **The Non-Collapsibility Condition (Item 1).**
  This is the filter that eliminates the majority of "bounded rationality" models that are secretly neoclassical. Most economic models of "search costs" fail this test because they assume the agent optimizes the marginal cost of search against the marginal benefit. A genuine satisficing theory must explain why the agent does *not* perform that marginal calculation. This requirement forces the theory to grapple with the regress problem (how do you choose the rule for choosing?) and eliminates "optimization under constraints" masquerading as satisficing.

  **Jointly Unsatisfiable Subsets (The Impossibility Results)**
  There is a fundamental tension between **Process Realism (Item 4)** and **Formal Tractability/Normativity (Item 6)**.

  1.  **The Regress of Meta-Rationality:** If you demand that the choice of the satisficing rule itself be *rational* (Item 6), you require a meta-model to select the rule. If that meta-model is optimizing, you have collapsed back into standard optimization (violating Item 1). If the meta-model is also satisficing, you face an infinite regress. You cannot simultaneously have a fully specified normative justification for the rule *and* a claim that the agent does not optimize rule selection.
  2.  **Aspiration Stability vs. Empirical Volatility:** A formal theory requires a stable revision function (Item 2) to generate predictions. However, empirical evidence suggests aspiration adjustment is highly context-dependent, emotional, and often inconsistent (hysteresis effects). A theory precise enough to be falsifiable (stable rules) often fails descriptive accuracy; a theory accurate to human volatility (adaptive rules) often becomes too parameter-heavy to be distinct from optimization (violating Item 1).

  You must sacrifice either **Normative Completeness** (admitting the rule selection is arbitrary/exogenous) or **Descriptive Precision** (admitting the revision rule is noisy/unspecified).

  ---

  ### Scorecard

  | Program | Non-Collapsibility | Aspiration Dynamics | Process/Outcome | Normativity | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Simon-Style (Cyert & March)** | **Pass.** Explicitly rejects marginal calculation. | **Pass.** Core feature (adaptive aspirations). | **Fail.** Often conflates stopping and choice. | **Weak.** "Rational" is procedural, not ecological. | **Foundational but incomplete.** |
  | **Search Cost / Rational Inattention** | **Fail.** Collapses into constrained optimization (Stigler). | **N/A.** Endogenous shadow prices replace aspirations. | **Fail.** Focuses on outcomes/Information acquisition. | **Strong.** Fully normative. | **Optimization in disguise.** |
  | **Fast-and-Frugal (Gigerenzer)** | **Pass.** Distinct heuristics (e.g., Take-the-Best). | **Weak.** Focuses on stopping rules, less on aspiration revision. | **Pass.** Clear distinction between search and choice. | **Strong.** Ecological rationality explicit. | **Best process fit, narrow scope.** |
