prompt: |-
  I run a programme evaluation unit at a mid-sized foundation. We fund interventions—job training, health outreach, educational software—and then try to determine whether they caused the outcomes we see. My analysts know their statistics, but I have noticed they default to one causal framework without realising there is a choice: they treat causation as a counterfactual (would the outcome have happened without the programme?) and never consider the interventionist alternative (is there a well-defined manipulation of the programme variable that changes the outcome, and can we isolate it from confounders?). I gather that the philosophical literature on causation has explored this distinction in depth, and that it matters practically—some causal claims that look fine under one framework are suspicious under the other, and vice versa.

  Write me a reusable decision procedure my team can follow when assessing a causal claim about a programme we have funded. It should walk an analyst through the questions that distinguish what the two frameworks demand, flag where they agree and where they diverge, and specify what kind of evidence is needed to satisfy each. The procedure must be usable by someone with graduate-level statistical training but no philosophy background, in under an hour per case. Mark the steps where judgment cannot be eliminated.

  Then apply the procedure to two cases:

  1. A job-training programme in a single city where we have a randomised controlled trial with clean compliance.
  2. A national advocacy campaign for vaccine uptake where randomisation is impossible and we are working with observational data and an instrumental variable whose exclusion restriction is debated.

  Your response should follow this structure:

  - **Distinction in Practice** (roughly 15%): a short, non-technical explanation of the counterfactual/interventionist distinction as it bears on programme evaluation—just enough for an analyst to see why the procedure asks the questions it does.
  - **The Procedure** (roughly 45%): the step-by-step decision procedure, presented as numbered questions with decision rules, branching logic, and explicit handoff points where an analyst must consult a supervisor or the procedure cannot settle the matter.
  - **Application: Job Training** (roughly 20%): run the procedure on this case, showing each step and the conclusion reached.
  - **Application: Vaccine Advocacy** (roughly 20%): run the procedure on this case, showing where the procedure forces a conclusion weaker or more awkward than the team's default counterfactual reasoning would deliver, and what the analyst should report as a result.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Head of a programme evaluation unit at a mid-sized foundation.
      *   **Problem:** Analysts default to the counterfactual framework (Potential Outcomes/Rubin Causal Model) without considering the interventionist framework (Manipulability/Interventionism/Woodward), leading to potentially unsupported causal claims.
      *   **Task:** Create a reusable decision procedure for assessing causal claims that distinguishes between these two frameworks, flags agreements/divergences, and specifies evidence needs. Then apply it to two specific cases.
      *   **Constraints:**
          *   Usable by someone with grad-level stats training but no philosophy background.
          *   Completion time: Under an hour per case.
          *   Structure: Distinction in Practice (15%), The Procedure (45%), Application: Job Training (20%), Application: Vaccine Advocacy (20%).
          *   Requirement: Mark steps where judgment cannot be eliminated.
      *   **Tone:** Professional, practical, rigorous but accessible.

  2.  **Deconstruct the Causal Frameworks:**
      *   *Counterfactual (Potential Outcomes):* Focuses on $Y(1)$ vs $Y(0)$ for the same unit. Key question: "What would have happened to *this* person if they hadn't got the treatment?" Relies heavily on exchangeability/ignorability (often via randomization or matching).
      *   *Interventionist (Manipulability):* Focuses on $P(Y | do(X))$. Key question: "Is $X$ something we can wiggle independently of other causes to see $Y$ change?" Relies on modularity and the ability to define a specific intervention.
      *   *The Tension:* Counterfactuals can be defined for non-manipulable attributes (e.g., race, gender, sometimes broad policies). Interventionists argue causation requires a well-defined "handle" to turn. In program evaluation, this often manifests as "What exactly are we scaling?" vs. "Did the treated group do better than the control?"

  3.  **Drafting Section 1: Distinction in Practice (15%)**
      *   Need to explain the difference without getting bogged down in metaphysics.
      *   *Counterfactual:* Comparison of worlds (Treatment vs. No Treatment). Good for internal validity of the specific trial.
      *   *Interventionist:* Focus on the *mechanism* and *manipulation*. Good for external validity and policy design.
      *   *Why it matters:* You can have a valid counterfactual estimate for a vague intervention (e.g., "community support") that fails the interventionist test because you can't replicate the "support" elsewhere. Conversely, a clear manipulation might fail counterfactual assumptions due to confounding.
      *   *Goal:* Keep it tight. Focus on "Definition of Treatment" and "Replicability."

  4.  **Drafting Section 2: The Procedure (45%)**
      *   Needs to be step-by-step, numbered, with branching logic.
      *   Must highlight "Judgment Required" points.
      *   *Step 1: Define the Cause.* Is it a specific action or a state of being?
      *   *Step 2: Counterfactual Check.* Can we estimate $E[Y|X=1] - E[Y|X=0]$ credibly? (Stats heavy).
      *   *Step 3: Interventionist Check.* Is the treatment well-defined enough to be manipulated elsewhere? (Woodwardian "invariance").
      *   *Step 4: Divergence Check.* Do the results hold if we tighten the definition?
      *   *Step 5: Reporting.* What claim is justified?
      *   *Time limit:* Keep steps concise enough to be done in <1 hour.
      *   *Handoffs:* Explicitly state when to call the boss (e.g., when frameworks contradict).

  5.  **Drafting Section 3: Application: Job Training (20%)**
      *   *Scenario:* Single city, RCT, clean compliance.
      *   *Analysis:*
          *   Counterfactual: Strong (RCT).
          *   Interventionist: Strong (Training is a specific manipulation).
          *   Agreement: Both frameworks support the claim.
          *   Nuance: External validity (will it work in another city?) is an interventionist concern, but internal validity is solid for both.
      *   *Outcome:* Robust causal claim.

  6.  **Drafting Section 4: Application: Vaccine Advocacy (20%)**
      *   *Scenario:* National campaign, observational, IV with debated exclusion restriction.
      *   *Analysis:*
          *   Counterfactual: Weak/Contested. Relies on IV assumptions (exclusion restriction). If the IV affects outcomes through other paths, counterfactual estimate is biased.
          *   Interventionist: Very Weak. What is "Advocacy"? Is it TV ads? Door knocking? If the IV is something like "distance to clinic" or "media market," does that capture the *manipulation* of advocacy?
          *   Divergence: Counterfactual might give a number (LATE), but Interventionist asks "What exactly are we buying?"
          *   *Outcome:* Claim must be downgraded. "Association under specific assumptions" rather than "Causal Impact of Advocacy."

  7.  **Review and Refine:**
      *   *Check Constraints:*
          *   15/45/20/20 split? (Need to monitor word count roughly).
          *   Grad-level stats knowledge assumed? (Yes, can use terms like LATE, exclusion restriction, ignorability).
          *   No philosophy background? (Avoid heavy jargon like "modularity" or "supervenience" without definition).
          *   Mark judgment steps? (Use bold/italics/icons).
          *   Under an hour? (Procedure needs to be streamlined).
      *   *Tone Check:* Is it authoritative but helpful?
      *   *Content Check:* Did I accurately represent the Interventionist view? (Yes, focus on "well-defined manipulation" per Woodward/Hitchcock). Did I accurately represent Counterfactual? (Yes, focus on Potential Outcomes/Rubin).

  8.  **Final Polish:**
      *   Ensure the "Judgment Required" markers are clear.
      *   Make sure the distinction in the Vaccine case highlights the "black box" problem of the IV vs. the policy lever.
      *   Ensure the Procedure has clear "Stop/Consult" points.

  *(Self-Correction during drafting)*: I initially thought about bringing in DAGs. While analysts know them, the prompt asks specifically about the *philosophical* distinction (Counterfactual vs. Interventionist). DAGs are a tool for both. I should focus on the *interpretation* of the variables rather than the graph structure itself. I will emphasize the *definition of X* as the key differentiator.

  *(Word Count Management)*: The prompt asks for specific percentages. I need to be careful not to make the "Distinction" too long or the "Applications" too short. I will aim for a total word count of around 2000-2500 words to allow for depth while respecting the ratios.

  *Let's calculate rough word counts:*
  Total target: ~2,200 words.
  Distinction: ~330 words.
  Procedure: ~990 words.
  App 1: ~440 words.
  App 2: ~440 words.

  *Refining the Procedure:* Make it a flowchart style in text.
  1. Define X.
  2. Counterfactual Validity (Stats).
  3. Interventionist Validity (Conceptual).
  4. Synthesis.

  *Refining the Vaccine Case:* The key here is that the IV (e.g., media market) might satisfy the statistical criteria for a counterfactual (LATE), but fails the interventionist criteria because "Media Market" isn't a policy lever the foundation can pull. The foundation funds "Advocacy," not "Media Market Assignment." This is the crux of the divergence.

