answer: |-
  - **Distinction in Practice**

  In programme evaluation, the **Counterfactual Framework** (Potential Outcomes) asks: *"For the units we treated, what would their outcome have been had we not treated them?"* It focuses on comparison and exchangeability. If you can construct a valid control group (via randomisation or matching), you satisfy this framework. It is excellent for internal validity but can be agnostic about *what* the treatment actually is, provided the assignment mechanism is understood.

  The **Interventionist Framework** (Manipulability) asks: *"Is the treatment a well-defined lever we can pull, and does pulling it produce the change independently of other pathways?"* It focuses on the stability of the causal mechanism. A claim passes this test only if the intervention is specific enough to be replicated and if the relationship holds when other background conditions change.

  **Why this matters:** You can have a statistically perfect counterfactual estimate for a vague intervention (e.g., "community resilience") that fails the interventionist test because no one can reproduce "resilience" on demand. Conversely, a clear manipulation (e.g., "send SMS reminder") might fail the counterfactual test due to confounding. Your analysts currently prioritise the first question (did the groups differ?) over the second (can we define and scale the lever?). This procedure forces both questions.

  - **The Procedure**

  **Time Limit:** 45–60 minutes per case.
  **User:** Senior Analyst.
  **Output:** A Causal Confidence Rating (High, Moderate, Low/Descriptive Only).

  **Step 1: Define the Cause (Variable X)**
  Write down the specific intervention as it appears in your statistical model.
  *   *Question:* Is X a specific action/event (e.g., "received 10 hours of tutoring") or a state/attribute (e.g., "lived in a high-support neighborhood")?
  *   *Decision Rule:* If X is a state/attribute, flag for **Judgment Required [J1]**. Interventionist causation requires a manipulable variable. If X is not manipulable, you cannot claim interventionist causation, only counterfactual association.
  *   *Action:* If flagged, consult the Programme Officer. Can the attribute be converted into a specific action? If no, proceed to Step 2 but cap final rating at "Moderate."

  **Step 2: Counterfactual Validity Check (Statistical)**
  Assess the identification strategy for the Potential Outcomes framework ($Y(1)$ vs $Y(0)$).
  *   *Question:* Is the assignment mechanism ignorable (RCT) or adequately controlled (IV, Matching, DiD)?
  *   *Decision Rule:*
      *   **RCT with clean compliance:** Pass.
      *   **Observational/Quasi-experimental:** Review assumptions (Ignorability, Exclusion Restriction, Parallel Trends). Are they plausible?
  *   *Handoff Point:* If assumptions rely on untestable claims (e.g., "no unobserved confounders"), mark as **Judgment Required [J2]**. Document the specific assumption.
  *   *Outcome:* Assign a *Statistical Confidence Score* (1–5).

  **Step 3: Interventionist Validity Check (Conceptual)**
  Assess the "well-definedness" of the manipulation.
  *   *Question 3a:* If we fund this programme in a new location, is it clear *exactly* what staff should do differently to replicate X?
  *   *Question 3b:* Does the statistical model isolate X from correlated factors? (e.g., If X is "training," does the model separate training from the motivation of those who select into training?)
  *   *Decision Rule:*
      *   If X is vague (e.g., "advocacy," "awareness") and the data aggregates multiple activities, flag **Judgment Required [J3]**.
      *   If the instrument (in IV) affects Y through channels other than X (violating exclusion), the interventionist claim fails even if the counterfactual math holds.
  *   *Outcome:* Assign a *Mechanism Confidence Score* (1–5).

  **Step 4: Divergence Analysis**
  Compare the scores from Step 2 and Step 3.
  *   *Scenario A (Agreement):* Both scores $\ge$ 4.
      *   *Conclusion:* Robust Causal Claim.
  *   *Scenario B (Counterfactual > Interventionist):* Stat Score $\ge$ 4, Mech Score $\le$ 3.
      *   *Meaning:* You have a reliable estimate of *something*, but you don't know what "lever" produced it.
      *   *Action:* **Consult Supervisor.** Do not publish as "Impact of [Programme]." Report as "Impact of [Specific Contextual Assignment]."
  *   *Scenario C (Interventionist > Counterfactual):* Mech Score $\ge$ 4, Stat Score $\le$ 3.
      *   *Meaning:* The lever is clear, but the data is confounded.
      *   *Action:* Downgrade to "Promising Mechanism, Unverified Impact."

  **Step 5: Final Reporting Specification**
  Draft the causal claim based on the lowest score.
  *   *Rule:* The strength of the causal claim is limited by the weaker framework.
  *   *Requirement:* Explicitly state the limitation identified in [J1], [J2], or [J3] in the executive summary.

  **[J-Markers Explanation]**
  *   **[J1] Manipulability Judgment:** Requires deciding if a concept is actionable.
  *   **[J2] Identification Judgment:** Requires deciding if statistical assumptions are "plausible enough."
  *   **[J3] Fidelity Judgment:** Requires deciding if the treatment in the data matches the treatment in reality.

  - **Application: Job Training**

  **Case:** Single-city job training programme. RCT with clean compliance (no crossovers). Outcome: Employment status at 12 months.

  **Step 1: Define the Cause**
  *   *Variable:* "Completion of 12-week vocational curriculum."
  *   *Assessment:* This is a specific action. It is manipulable (we can enroll someone or not).
  *   *Judgment:* No flag on [J1].

  **Step 2: Counterfactual Validity**
  *   *Strategy:* Randomised Controlled Trial.
  *   *Assessment:* Randomisation ensures $E[Y(0)|T=1] = E[Y(0)|T=0]$. Clean compliance means Treatment Received = Treatment Assigned.
  *   *Judgment:* [J2] not triggered. Assumptions are minimal and satisfied by design.
  *   *Statistical Confidence Score:* 5/5.

  **Step 3: Interventionist Validity**
  *   *Replicability:* The curriculum is manualised. A new city can purchase the same materials and hire trainers to the same specification.
  *   *Isolation:* Because it is an RCT, the "training" is isolated from participant motivation (since assignment was random, not self-selected).
  *   *Judgment:* [J3] not triggered. The "lever" is clear.
  *   *Mechanism Confidence Score:* 5/5.

  **Step 4: Divergence Analysis**
  *   *Comparison:* 5 vs 5. Agreement.
  *   *Analysis:* The counterfactual question ("Would they be employed without training?") and the interventionist question ("Does offering this training cause employment?") yield the same answer. The RCT satisfies the exchangeability requirement of the counterfactualist and the independent manipulation requirement of the interventionist.

  **Step 5: Final Reporting**
  *   *Claim:* "The programme *caused* an increase in employment."
  *   *Caveat:* External validity remains a separate question (will it work in a different labour market?), but internally, both frameworks endorse the causal claim.
  *   *Conclusion:* **High Causal Confidence.** Proceed with standard impact reporting.

  - **Application: Vaccine Advocacy**

  **Case:** National advocacy campaign. Observational data. Instrumental Variable (IV) used: "Media Market Intensity" (some regions got more ad slots due to pricing quirks). Exclusion restriction is debated (ads might correlate with local health infrastructure).

  **Step 1: Define the Cause**
  *   *Variable:* "Exposure to Advocacy Campaign."
  *   *Assessment:* In the model, this is proxied by "Media Market Intensity."
  *   *Judgment:* **[J1] Flagged.** "Media Market Intensity" is not a policy lever the foundation controls. We control "Advocacy Spend/Content," but the IV measures "Ad Slot Availability."
  *   *Action:* Note that the statistical cause is not the programme cause.

  **Step 2: Counterfactual Validity**
  *   *Strategy:* Instrumental Variables.
  *   *Assessment:* Relies on the Exclusion Restriction (Media Market affects Vaccination *only* through Advocacy Exposure).
  *   *Judgment:* **[J2] Flagged.** The prompt states this restriction is debated. If high-ad markets also have better clinics, the counterfactual estimate is biased.
  *   *Statistical Confidence Score:* 2/5 (Due to debated assumption).

  **Step 3: Interventionist Validity**
  *   *Replicability:* If we want to scale this, we cannot manipulate "Media Market Pricing Quirks." We manipulate "Ad Buy."
  *   *Isolation:* The IV estimates the Local Average Treatment Effect (LATE) for those persuaded by the *specific* ad slots available in those markets. It does not necessarily isolate the effect of the *message* from the *medium*.
  *   *Judgment:* **[J3] Flagged.** The "manipulation" in the data (pricing quirk) is not the "manipulation" in the policy (advocacy strategy).
  *   *Mechanism Confidence Score:* 1/5.

  **Step 4: Divergence Analysis**
  *   *Comparison:* Stat Score (2) vs Mech Score (1).
  *   *Analysis:* The analysts' default counterfactual reasoning might produce a number (e.g., "IV estimate = 5% uptake increase"). They might report: "The campaign caused a 5% increase."
  *   *Divergence:* The Interventionist framework rejects this. The "cause" in the model (pricing quirk) is not the "cause" in the foundation's portfolio (advocacy). Furthermore, the debated exclusion restriction means the counterfactual world (no ad slots) is not cleanly separated from other confounders (health infrastructure).
  *   *Handoff:* **Consult Supervisor Required.** The procedure forbids a standard causal claim.

  **Step 5: Final Reporting**
  *   *Claim:* Do **not** report "The campaign caused..."
  *   *Required Wording:* "In regions with higher media availability, we observe higher uptake. Under strong and debated assumptions, this suggests the advocacy *may* contribute, but we cannot isolate the advocacy effect from regional infrastructure differences."
  *   *Result:* **Low Causal Confidence.** The team must report this as associative evidence requiring further validation (e.g., a cluster RCT of ad buys), rather than a confirmed impact. The procedure successfully prevented an overclaim that the default counterfactual workflow would have allowed.
