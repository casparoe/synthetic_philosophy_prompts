      *   *Fact:* Re-classification reset trajectory tracking (treated as new object).
      *   *Fact:* Emergency braking disabled; action suppression delayed braking.
      *   *Fact:* Safety driver distracted.

      *   *Mapping to Narrow Frame Problem:* Did the system fail because it couldn't represent static background facts? Not really. The map didn't change. The car's position was known. The issue wasn't "did the road disappear?" It was "what is this moving thing?" This suggests the Narrow Logical problem isn't the primary culprit.
      *   *Mapping to Broad Frame Problem:* Did the system fail to determine relevance? Yes. It had data (sensor returns) but couldn't determine the *significance* of that data (a human crossing the road) because its relevance filters (crosswalk proximity) were too rigid. It couldn't contextualize the object outside its pre-defined "relevant" zones.

