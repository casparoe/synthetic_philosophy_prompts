          *   What would a fix look like? It needs to track *trajectory* independent of *classification*. It needs to treat "unknown moving object on collision course" as relevant, regardless of label.
          *   The Regress Issue: If you add a rule "track unknown objects," how do you define "unknown object" without infinite false positives (plastic bags, shadows)? You push the relevance problem to the training data or the reward function. You haven't solved the philosophical problem; you've hardcoded a specific relevance judgment.
      *   **Section 4: The Deflationary Line (Engineering vs. Philosophy):**
