answer: |-
  Imagine two ceramic mugs, Mug A and Mug B, resting on a shelf. To every intrinsic test—mass, chemical composition, microscopic surface topology, even the precise arrangement of glaze cracks—they are perfect duplicates. However, Mug A was thrown last Tuesday by Potter Alice in London using clay from Pit X, whilst Mug B was thrown last Wednesday by Potter Bob in Leeds using clay from Pit Y. They are intrinsically indiscernible but historically distinct. The question hangs on whether 'being made by Alice' counts as a genuine property of the mug itself, or merely a relational fact about its connection to Alice. If one argues that historical properties are simply relational properties stretched across time—akin to Black's spheres standing in spatial relations to one another—then admitting them might seem like begging the question against the Principle of Identity of Indiscernibles (PII). Yet, unlike the spheres, whose relations are simultaneous and symmetric, the mug's history is a fixed, asymmetric relation to a distinct past event, suggesting a potentially robust ground for individuation that doesn't rely on the existence of the other object.

  A defender of the PII would seize upon this historical difference to save the principle. They would argue that 'having been made by Alice' is a legitimate property of Mug A, just as much as 'being blue' or 'weighing 300 grams'. Since Mug A possesses this property and Mug B does not (possessing instead 'having been made by Bob'), the two objects are not indiscernible. Therefore, the PII remains intact; there are no two things that share *all* properties, provided we count historical properties in our ledger. The opponent, however, would cry foul. They would contend that the PII is only interesting if it restricts properties to intrinsic, qualitative features available at a single time. If we allow historical or relational properties, the principle becomes trivially true, for almost every object has a unique causal pedigree. The opponent argues that if two objects are qualitatively identical *now*, they should be numerically identical unless there is a 'thisness' (haecceity) distinguishing them, and hiding behind the Potter's identity merely shifts the burden of individuation elsewhere.

  This brings us to the objection that historical properties are just relational properties wearing a temporal hat. In Black's case, the spheres are individuated by their spatial relation to *each other* ('being two miles from the other sphere'), which is viciously circular because it presupposes the distinctness it tries to prove. However, the mug case escapes this trap. The relation is not between Mug A and Mug B, but between Mug A and Potter Alice. Potter Alice is already individuated independently of the mug. Thus, historical properties do add something new to the dialectic: they anchor individuation in external, already-distinct entities rather than in the symmetric relation between the twins themselves. This avoids the circularity that plagues Black's spheres, suggesting that historical properties are a more robust tool for the PII defender than spatial relations.

  The specific metaphysical commitment doing all the heavy lifting here is the definition of 'property' permissible for individuation. The dispute turns on whether one accepts **Historical Essentialism** (the view that an object's origin is essential to its identity) and whether one allows **extrinsic relational properties** to count towards discernibility. If you commit to the view that only intrinsic, non-relational properties count, the PII fails in this case. If you commit to the view that an object's causal history is a genuine property of the object, the PII survives.

  As for the kicker: if you stripped the historical difference out entirely—imagining the mugs popped into existence without makers or prior causes—the case would indeed collapse into something structurally identical to Black's spheres. You would be left with two intrinsically identical objects distinguished only by their spatial location (one here, one there). However, there is a subtle divergence: many philosophers argue that artefacts *cannot* exist without a history of creation, whereas Black's spheres are imagined as brute physical objects. So, whilst the logical structure mirrors Black's case, the metaphysical possibility of the 'stripped' mug scenario is far more contentious than the stripped sphere scenario.
