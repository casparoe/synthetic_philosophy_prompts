  2.  **Deconstruct the Mathematical Core:**
      *   The core conflict is the "Impossibility Theorem of Fairness" (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017).
      *   *Conditions:*
          1.  Calibration within groups: $P(Y=1 | S=s, G=a) = P(Y=1 | S=s, G=b) = s$.
          2.  Balance for Positive Class (Equal FNR): $P(S < t | Y=1, G=a) = P(S < t | Y=1, G=b)$.
          3.  Balance for Negative Class (Equal FPR): $P(S > t | Y=0, G=a) = P(S > t | Y=0, G=b)$.
      *   *Theorem:* These three cannot hold simultaneously unless base rates are equal ($P(Y=1|G=a) = P(Y=1|G=b)$) or the classifier is perfect.
      *   *Side A* prioritizes (1).
      *   *Side B* prioritizes (1) + (2) & (3) (or at least sees (2) & (3) as necessary for fairness).

