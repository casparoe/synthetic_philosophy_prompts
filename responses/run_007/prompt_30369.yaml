answer: |-
  # Joint Statement on Fairness Criteria in Pretrial Risk Assessment

  **Date:** October 26, 2023
  **Parties:** Working Group Members A (Calibration Focus) and B (Error Rate Focus)
  **Subject:** Reconciliation of Fairness Metrics in Risk Scoring

  After one year of adversarial collaboration regarding the deployment of risk assessment instruments in pretrial decision-making, we issue this joint statement. We agree on the empirical constraints of the data and the mathematical properties of the models. Our remaining分歧 (disagreements) are normative and concern the prioritization of competing ethical values under mathematical constraint.

  ## 1. Agreed Claims

  We jointly affirm the following claims as factually and mathematically accurate regarding the risk score $S$, the binary outcome $Y$ (e.g., rearrest within 2 years), and the protected group attribute $G$ (e.g., demographic group).

  1.  **Contextual Validity:** We accept the current dataset and evaluation protocol as sufficient for analyzing the statistical properties of the risk score, acknowledging that no model can account for all societal confounders, but rejecting the notion that the tool should be abandoned solely due to metric tension.
  2.  **Definition of Calibration:** A score is **calibrated within groups** if, for any risk score value $s$, the probability of the outcome is equal across groups:
      $$P(Y=1 \mid S=s, G=a) = P(Y=1 \mid S=s, G=b) = s$$
      We agree this ensures that a score of "70%" implies the same likelihood of recidivism regardless of group membership.
  3.  **Definition of Error Rate Balance:** A score satisfies **error rate balance** if the False Positive Rate (FPR) and False Negative Rate (FNR) are equal across groups at a given decision threshold $t$:
      $$P(S > t \mid Y=0, G=a) = P(S > t \mid Y=0, G=b)$$
      $$P(S < t \mid Y=1, G=a) = P(S < t \mid Y=1, G=b)$$
      We agree this ensures that the burden of classification errors is distributed equally across groups.
  4.  **The Compatibility Theorem (The Tradeoff):** We accept the mathematical proof (per Kleinberg et al., 2016; Chouldechova, 2017) that when base rates differ between groups ($P(Y=1 \mid G=a) \neq P(Y=1 \mid G=b)$) and the classifier is imperfect, it is **mathematically impossible** to satisfy Calibration within groups and Error Rate Balance simultaneously.
  5.  **Necessity of Choice:** Consequently, achieving fairness requires an explicit choice to relax one condition. A system cannot be "fair" in all statistical senses simultaneously. Optimizing for one metric necessarily degrades the other when base rates are unequal.

  ## 2. Disagreements Table

  The following table outlines our residual disagreement. We have drafted these positions to ensure each side recognizes their own view without caricature.

  | Issue | Member A (Calibration Focus) | Member B (Error Rate Focus) |
  | :--- | :--- | :--- |
  | **Primary Definition of Fairness** | Fairness is **interpretive consistency**. A risk score is a statement of fact about probability. If a 60% score means 60% risk for Group A but implies a different error burden for Group B, the number itself is still "honest." Fairness requires that the *meaning* of the score remains invariant across groups so decision-makers can treat like cases alike. | Fairness is **distributive justice**. The *consequences* of the score matter more than the *meaning* of the number. If Group A suffers twice the rate of false detention (False Positives) as Group B, the system is unjust, regardless of whether the probabilities were technically calibrated. |
  | **Priority of Metrics** | **Calibration is necessary and sufficient** for the scoring instrument itself. Error rates are a function of the *threshold* chosen by the judge/policy, not the score itself. We should provide the most accurate probability estimate and let the decision-maker weigh the costs. | **Calibration is necessary but insufficient.** The instrument must be constrained or adjusted to ensure error rates are balanced *before* reaching the decision-maker. Relying on downstream actors to correct for disparate error burdens is empirically unreliable. |
  | **Handling Base Rates** | Base rates reflect observed reality. To adjust the score to match error rates would require distorting the probability estimates (sacrificing calibration), effectively lying about the risk to achieve social balance. | Base rates may reflect historical bias in policing or charging. Strict adherence to calibrated scores based on biased base rates perpetuates historical disparities. Equalizing error rates is a corrective mechanism for biased base rates. |

  ## 3. Cruxes and Empirical Tests

  Our disagreement persists because we weigh the ethical implications of the mathematical tradeoff differently. However, there are specific sub-questions (cruxes) where empirical evidence could shift our positions or clarify that the dispute is purely normative.

  ### Crux 1: The Origin of Base Rate Differences
  *   **Question:** To what extent do the differing base rates ($P(Y=1|G)$) reflect true underlying behavioral differences versus differential enforcement/policing bias?
  *   **Agreed Evidence:** A comparison study of **self-reported offending data** (e.g., National Survey on Drug Use and Health) versus **arrest data** for the same jurisdiction and demographics.
  *   **Predictions:**
      *   *Member A predicts:* The gap between self-report and arrest data will be small enough that treating arrest data as a proxy for risk remains statistically valid for calibration purposes.
      *   *Member B predicts:* The gap will be significant, particularly for low-level offenses, demonstrating that base rates are contaminated by enforcement bias, justifying error-rate correction.
  *   **Resolution Condition:** If the gap is negligible, Member B concedes that base rates are not the primary driver of disparity. If the gap is large, Member A concedes that calibration on arrest data perpetuates bias.

  ### Crux 2: Judicial Interpretation of Scores
  *   **Question:** Do judicial decision-makers actually treat calibrated scores as "like cases," or do they implicitly apply different thresholds per group?
  *   **Agreed Evidence:** An **audit study** where identical case files with identical risk scores but varied demographic markers are presented to a randomized pool of judges/magistrates.
  *   **Predictions:**
      *   *Member A predicts:* Judges will detain at similar rates for identical scores regardless of demographics, validating that Calibration ensures "like treatment."
      *   *Member B predicts:* Judges will apply stricter thresholds to marginalized groups even at identical scores, meaning Calibration alone fails to ensure "like treatment" in practice.
  *   **Resolution Condition:** If judges ignore demographics when scores are present, Member A's focus on the score's integrity is vindicated. If judges bias their thresholds despite the score, Member B's focus on error outcomes is vindicated.

  ### Crux 3: The Cost of Errors
  *   **Question:** Is the social cost of a False Positive (detaining someone who would not reoffend) equivalent across groups, or is it higher for historically marginalized groups due to compounded socioeconomic harm?
  *   **Agreed Evidence:** A **longitudinal impact analysis** measuring employment loss, housing instability, and family separation resulting from pretrial detention, stratified by group.
  *   **Predictions:**
      *   *Member A predicts:* The marginal harm of detention is roughly uniform per unit of time; fairness requires minimizing total errors regardless of group.
      *   *Member B predicts:* The marginal harm is significantly higher for Group B due to existing structural vulnerabilities; fairness requires minimizing errors for Group B even at the cost of total accuracy.
  *   **Resolution Condition:** This is partially a value judgment, but the *magnitude* of the disparity is empirical. If the harm disparity is massive, Member A agrees error rates must be weighted. If harm is uniform, Member B agrees total error minimization is fairer.

  ## 4. Classification of Dispute Types

  We explicitly acknowledge that our remaining disagreement is not regarding the mathematics, which is settled (Claim 4), but regarding the following:

  1.  **Value Judgment (Normative):** The definition of "Fairness."
      *   *Why:* Mathematics cannot dictate whether "predictive accuracy" or "equal burden of error" is the superior moral good. This is a policy choice for stakeholders, not a derivation from data. We agree to label this as a **Normative Disagreement**.
  2.  **Verbal/Semantic:** The usage of the term "Bias."
      *   *Why:* Member A uses "bias" to mean *statistical miscalibration*. Member B uses "bias" to mean *disparate impact*. We agree to cease using the word "bias" without a qualifier (e.g., "calibration bias" vs. "outcome bias") to prevent talking past one another.
  3.  **Empirical:** The reliability of the label $Y$ (rearrest) as a proxy for true risk.
      *   *Why:* As outlined in Crux 1, if $Y$ is fundamentally flawed, the mathematical tradeoff rests on corrupted inputs. This is an empirical question subject to the evidence listed above.

  **Signed,**

  _________________________
  Member A (Calibration Focus)

  _________________________
  Member B (Error Rate Focus)
