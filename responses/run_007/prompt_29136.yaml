answer: |-
  # Decision Tree: The Legitimacy of Constitutional Precommitment

  **Instructions for Students:** Begin at the root question. Answer each branching question based on your own philosophical intuitions about political authority, time, and obligation. Follow the path to a leaf node to identify the theoretical position that best matches your commitments.

  ---

  ### **Root Question:**
  **Can a polity legitimately bind its future decision-making against the will of a current majority?**
  *   **No:** (You reject precommitment entirely; proceed to **Node 1**)
  *   **Yes:** (You accept precommitment is possible; proceed to **Node 3**)

  ---

  ### **Node 1: The Temporal Sovereignty Question**
  *(For those who answered "No" to the Root)*
  **Do future generations count as distinct moral agents from the founders, such that the founders' will expires with them?**
  *   **Yes:** The authority of the past dissolves upon the death of the generation that created it. Proceed to **Node 2**.
  *   **No:** The "People" is a continuous entity across time; the founders and successors are the same moral agent.
      *   *Logical Consequence:* If the People are continuous, you cannot consistently answer "No" to the Root Question. This path is **Incoherent**. (Return to Root and answer "Yes".)

  ### **Node 2: The Mechanism of Consent Question**
  *(For those who believe generations are distinct)*
  **Does the possibility of amendment (at high cost) constitute sufficient "fresh consent" to legitimize the binding nature of the original text?**
  *   **No:** Amendment procedures are too difficult to count as genuine consent for new generations; the original text remains an imposition.
      *   **LEAF 1: The Dead-Hand Objection** (e.g., Thomas Jefferson, Thomas Paine). *Constitutionalism is illegitimate tyranny by the past over the present.*
  *   **Yes:** If later generations can amend the constitution, their failure to do so counts as tacit consent to the existing framework.
      *   **LEAF 2: Supermajoritarian Consent Theory** (e.g., Sanford Levinson, some readings of Article V). *Precommitment is legitimate only insofar as the exit door remains practically open.*
  *   **[UNOCCUPIED REGION]:** **Burkean Traditionalism.**
      *   *Path:* Generations are Distinct (Node 1: Yes) + Precommitment Legitimate (Root: Yes) + Amendment Irrelevant (Node 2: No).
      *   *Why Unoccupied:* This position claims the past binds the future simply because it is the past, without continuous identity or consent mechanisms. While historically influential (Oakeshott/Burke), it is largely unoccupied in modern *liberal* political philosophy because it violates the principle of generational equality. It is normatively unattractive to those who view autonomy as a prerequisite for legitimacy.

  ---

  ### **Node 3: The Nature of the Bond Question**
  *(For those who answered "Yes" to the Root)*
  **Is the constitution binding primarily because it *coordinates* behavior (functional) or because it *constitutes* the political agent (identity/autonomy)?**
  *   **Coordinates (Functional):** The constitution is a tool to solve collective action problems, reduce transaction costs, or stabilize expectations. Proceed to **Node 4**.
  *   **Constitutes (Autonomy):** The constitution is an expression of the People's rational will, binding the self to enhance its own freedom or identity. Proceed to **Node 5**.

  ### **Node 4: The Reality of Obligation Question**
  *(For those who view the constitution as Functional)*
  **Does this coordination create a genuine moral obligation to obey, or is it merely a descriptive prediction of behavior?**
  *   **Merely Descriptive/Coordination:** The constitution is a "Schelling point" or focal point. We follow it because others do, not because we *ought* to. It is a useful fiction.
      *   **LEAF 3: The Fictionalist View** (e.g., Russell Hardin, Kenneth Shepsle). *Precommitment is never genuinely binding; it is a stable equilibrium of expectations.*
  *   **Genuine Obligation:** Stability and coordination are moral goods that generate a duty to comply, even against immediate preference.
      *   **LEAF 4: Consequentialist Stability** (e.g., Richard Posner, pragmatic constitutionalism). *Precommitment is legitimate because it produces better outcomes (order, predictability) than the alternative.*

  ---

  ### **Node 5: The Scope of Binding Question**
  *(For those who view the constitution as Constitutive/Autonomy-based)*
  **Does the "self" have the right to bind its future self on *substantive ends* (what to decide), or only on *procedures* (how to decide)?**
  *   **Only Procedures:** We can bind the rules of the game, but not the outcomes. Substantive values must remain open to democratic revision.
      *   **LEAF 5: The Proceduralist View** (e.g., John Hart Ely). *Precommitment is legitimate only for reinforcing the channels of political change and protecting minorities' participation, not for enforcing specific rights.*
  *   **Substantive Ends:** We can bind the future on specific values or rights to protect them from temporary majorities. Proceed to **Node 6**.

  ### **Node 6: The Justification of Substance Question**
  *(For those who support Substantive Precommitment)*
  **Is the substantive binding justified because it protects the *preconditions of democracy* itself, or because it protects *rights independent of democracy*?**
  *   **Preconditions of Democracy:** We bind the future to ensure the political system remains democratic (e.g., free speech is protected so democracy can function).
      *   **LEAF 6: Dualist Democracy** (e.g., Bruce Ackerman). *Precommitment is legitimate when it reflects "higher lawmaking" moments that preserve the democratic order against ordinary politics.*
  *   **Rights Independent of Democracy:** We bind the future to protect individual autonomy or justice, even if it frustrates the democratic will.
      *   **LEAF 7: The Strong Ulysses Model** (e.g., Jon Elster, Stephen Holmes). *Precommitment is legitimate as rational self-binding; like Ulysses tying himself to the mast, the polity restricts its future options to prevent passion from overriding reason.*
  *   **[UNOCCUPIED REGION]:** **Substantive Proceduralism.**
      *   *Path:* Constitutive (Node 3) + Substantive Ends (Node 5) + No Justification (Node 6).
      *   *Why Unoccupied:* It is logically incoherent to argue for substantive precommitment without a justification for *why* those substances are insulated. Any defense inevitably collapses into either protecting democracy (Dualist) or protecting rights (Ulysses).

  ---

  ### **Note on Indistinguishable Leaves**
  **Leaf 6 (Dualist Democracy) and Leaf 7 (Strong Ulysses Model)** are difficult to separate in practice.
  *   **The Overlap:** Both justify substantive constitutional constraints (like free speech or due process) against ordinary majorities. Both rely on a distinction between the "true" will of the people (higher law/rational self) and the "temporary" will (ordinary politics/passion).
  *   **The Distinction:** The **Ulysses Model** is psychological and individualistic (Reason vs. Passion); the **Dualist Model** is institutional and collective (The People vs. The Government).
  *   **Further Distinction Needed:** To cleanly separate them, a student must answer: *Is the constitution binding because it represents a past moment of superior democratic mobilization (Dualist), or because it represents a rational constraint on human cognitive frailty regardless of democratic mobilization (Ulysses)?*

  ---

  ### **Instructor's Note: The Most Contestable Node**

  **Node 1: The Temporal Sovereignty Question** (*Do future generations count as distinct moral agents?*)

  This is the most philosophically contestable node because it rests on a metaphysical claim about collective identity rather than a normative claim about justice. A reasonable person's answer here is most likely to shift depending on whether they view the "People" as a biological succession of individuals (favoring the **Dead-Hand Objection**) or as a corporate moral person that transcends time (favoring **Ulysses/Proceduralism**).

  **Why my reasoning might fail:**
  I have structured the tree to treat "Continuous People" as the gateway to legitimacy. However, a sophisticated **Dead-Hand** theorist might argue that generations are distinct (Node 1: Yes) but that precommitment is *still* legitimate due to intergenerational reciprocity (we benefit from the past, so we owe the future). This argument would bypass Node 2 and jump directly to a legitimacy claim, occupying the region I labeled "Burkean Traditionalism." If students raise this reciprocity argument, the tree requires an additional branch at Node 2 distinguishing between *Consent* and *Gratitude/Reciprocity* as sources of obligation.
