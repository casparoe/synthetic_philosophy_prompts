  ### (1) The Two Positions

  Ultimately, Peirce defines truth as the opinion fated to be agreed upon by all who investigate sufficiently. It is objective, anchored in an external reality that constrains inquiry, ensuring convergence regardless of individual bias. He rejects the notion that truth is merely what is currently useful, insisting on the long-run ideal limit. James, conversely, defines truth functionally: a belief is true if it proves profitable to our lives, guiding us through experience without clash. He rejects the idea that truth is a static property awaiting discovery, emphasizing instead the process of verification. For James, truth *happens* to an idea; for Peirce, truth *is* the destination. Both reject simplistic subjectivism: James requires coherence with the whole body of experience, while Peirce acknowledges inquiry starts from present doubts. The tension lies between Peirce's regulative ideal and James's practical cash-value.

  ### (2) Where the Debate Stalls

  The impasse arises from conflicting temporal and normative priorities. Peirce argues that defining truth by present utility collapses truth into mere expediency, losing the normative force that makes inquiry corrective. If truth is only what works now, error becomes impossible whenever a belief feels useful. James counters that Peirce's "final opinion" is metaphysically occult and practically inert; it offers no guidance for believers who must act before inquiry ends. For James, Peirce's truth is a placeholder for reality itself, not a tool for navigation. Consequently, Peirce accuses James of psychologism, reducing logic to individual satisfaction. James accuses Peirce of scholastic realism, positing entities beyond experiential verification. They stall because Peirce prioritizes the *authority* of truth (its ability to command assent eventually), while James prioritizes the *utility* of truth (its ability to facilitate action now). Each sees the other's criterion as either too weak to distinguish truth from comfort (Peirce on James) or too distant to guide conduct (James on Peirce). Neither concedes that the other's concern might be legitimate within a different scope. This creates a dialectical loop: Peirce demands objectivity James cannot provide without abandoning radical empiricism; James demands immediacy Peirce cannot provide without abandoning fallibilism. The argument cycles because each treats the other's necessary condition as a sufficient definition.

  ### (3) Diagnosis

  This is not merely a verbal dispute, nor purely substantive disagreement about a single concept. It is a clash of methodological priorities disguised as a definition contest. Peirce is engaged in a normative logic of science, seeking conditions for the possibility of objective knowledge. James is engaged in a descriptive psychology of belief, seeking the value of truth-claims for living agents. When they argue about "truth," Peirce refers to the *telos* of inquiry, while James refers to the *instrument* of inquiry. Calling it "verbal" understates the stakes: their divergent definitions entail different commitments about reality. Peirce requires a realist metaphysics to guarantee convergence; James requires a pluralistic universe where truths are made. However, the diagnosis holds that they are talking past each other because they assume their specific pragmatic maxim exhausts the concept. Peirce assumes the maxim must secure objectivity; James assumes it must secure vitality. The stalemate persists because neither acknowledges the legitimacy of the other's project as complementary rather than competitive. It is a category error to expect James's functionalism to satisfy Peirce's logical requirements, and vice versa. The disagreement is substantive regarding metaphysics (realism vs. pluralism) but verbal regarding the label "truth," which both appropriate for distinct philosophical ends. Recognizing this dissolves the expectation of a single winner, revealing instead two incompatible but coherent frameworks for understanding cognitive success. The question "What is truth?" is ill-posed here because it assumes a univocal concept where there are two distinct philosophical tools. The impasse signals not failure, but the limits of monistic pragmatism. We must see Peirce as securing the *authority* of science and James as securing the *agency* of the believer. The debate stalls because they fight over who owns the word, not realizing they are building different houses.

  ### (4) What Would Count as Progress

  Progress requires reframing the dispute as a division of labor rather than a competition for correctness. We should distinguish "Truth-capitals" (Peirce's objective limit) from "truth-lowercase" (James's verified assertions). A formal result would involve mapping the conditions under which Jamesian verification reliably leads to Peircean convergence, bridging the short-term and long-term. Progress looks like acknowledging that Peirce answers "What makes inquiry possible?" while James answers "What makes belief livable?" The debate should dissolve into a pluralistic meta-pragmatism that deploys Peircean norms for scientific communities and Jamesian norms for individual ethical or religious contexts. Expecting a single definition is the error. Instead, we should analyze the specific contexts where each account fails or succeeds. This transforms a standoff into a toolkit. Progress is recognizing the question was ill-posed: there is no single "truth" property, only truth-functions relative to inquiry's stage.
