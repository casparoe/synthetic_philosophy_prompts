  In my philosophy of biology module we have been reading Dennett on natural selection and the intentional stance, and I am stuck on his notion of free-floating rationales. As I understand him, Dennett claims that evolution produces reasons before any mind is around to represent them: he writes that "there were reasons before there were reason representers." I can see only two ways to take this claim. Either a free-floating rationale is a mind-independent item of some sort, in which case it seems to add something mysterious and redundant to a causal explanation that already tells us why the trait was selected; or it is just a way of describing the trait's causal history, in which case the claim that there were reasons before reasoners seems trivial, no more interesting than saying that a plant "wants" the light. What exactly is Dennett asserting here, and how does his view avoid collapsing into one of these two options? Please also tell me which consideration would most likely lead you to revise your answer, and where you think your reasoning is most likely to fail. Please answer in British English.
