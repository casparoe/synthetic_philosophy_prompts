      *   *Premise 2 (Evidence):* Cites Milgram (obedience), Darley & Batson (Good Samaritan/hurry), Isen & Levin (dime/helping).
      *   *Intermediate Conclusion:* Behavior is almost entirely a function of the situation, not stable character traits.
      *   *Claim:* There are no stable character traits of the kind virtue ethics needs (Global Traits).
      *   *Counter-move attribution:* Virtue ethicists retreat to "local traits."
      *   *Final Conclusion:* This retreat is just redescribing inconsistency; the Aristotelian project is empirically bankrupt.

  3.  **Evaluate Each Claim against the Literature (Mental Knowledge Retrieval & Verification):**

      *   *Claim 1: Situationists (Doris, Harman) use social psychology to attack virtue ethics.*
          *   **Status:** Accurate/Settled. This is the core of the situationist challenge (late 90s/early 2000s).
      *   *Claim 2: The Studies (Milgram, Darley & Batson, Isen & Levin).*
          *   **Status:** Accurate citations. These are the canonical studies used in the debate.
          *   **Nuance:** Replication crises affect some of these (especially Isen & Levin), but in the context of the *philosophical argument*, these are the correct references.
      *   *Claim 3: "What people do is almost entirely a function of the situation."*
          *   **Status:** Contested/Exaggerated. Situationists argue situations are *significant*, often more than we think. "Almost entirely" is too strong. Person-situation interaction is the modern psychological consensus.
      *   *Claim 4: "There simply are no stable character traits of the kind virtue ethics needs."*
          *   **Status:** Contested. Situationists deny *global* robust traits. Virtue ethicists argue the definition of "trait" needs refinement, not abandonment.
      *   *Claim 5: "Virtue ethicists have tried to salvage it by retreating to a much weaker claim... 'local' traits."*
          *   **Status:** Partially Accurate but Simplified. Some (like Doris) suggest local traits. Virtue ethicists (Snow, Kamtekar, Sreenivasan) argue that Aristotelian virtues were never meant to be "global" in the simplistic sense situationists attack. They argue for *integrated* or *phronetic* traits, not just "local" fragments.
      *   *Claim 6: "That's not virtue anymore... empirically bankrupt."*
          *   **Status:** Highly Contested. This is the host's conclusion, not a settled fact. Many virtue ethicists believe the project survives intact.

  4.  **Structure the Response:**
