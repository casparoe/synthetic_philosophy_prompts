      *   **Section 1: The Empirical Premises (The Studies).** Address Milgram, Darley & Batson, Isen & Levin. Note replication issues and interpretation.
      *   **Section 2: The Psychological Claim (Traits vs. Situation).** Address the "almost entirely" claim. Discuss the Person-Situation interaction.
      *   **Section 3: The Philosophical Target (What is a Virtue?).** Address whether virtue ethics actually requires "global" traits in the way situationists define them. (Crucial point: The "Straw Man" objection).
      *   **Section 4: The Response (Local Traits vs. Refinement).** Address the "retreat" to local traits. Explain that virtue ethicists see this as a refinement, not a surrender.
      *   **Section 5: The Conclusion (Empirically Bankrupt?).** Evaluate the final verdict.
