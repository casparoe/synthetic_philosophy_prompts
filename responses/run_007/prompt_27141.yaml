      *Wait, I need to make sure they don't just coordinate.*
      **Rule:** Secret allocation. You want to maximize *your* points.
      **Prize:** Top 3 scorers get candy.
      This creates a "market" dynamic which illustrates the crowdedness well.

      *Wait, one more thing:* The prompt asks for *why* picking a cause isn't just about biggest problem.
