      **Cause 2 (Low Scale, Low Crowd, High Tractability):** "The Local Fix." Pool = 50 points per token.
      **Cause 3 (High Scale, Low Crowd, Low Tractability):** "The Future Tech." Pool = 5 points per token.
      *If 12 people, 10 tokens each.*
      If they flock to Cause 1 (120 tokens). 1000 / 120 = 8.3 points per token.
      If they go Cause 2. 50 points per token.
      *Winner:* Cause 2.
      *Intuition:* People want to help the "Global Crisis."
