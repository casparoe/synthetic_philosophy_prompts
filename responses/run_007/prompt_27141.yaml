      *   *Cause X (The Popular Tragedy):* Scale: 1000 units. Efficiency: 1 point per token. Saturation: -10% per token already placed (by "other donors").
      *   *Cause Y (The Boring Glitch):* Scale: 50 units. Efficiency: 10 points per token. Saturation: 0% (Empty).
      *   *Cause Z (The Impossible Dream):* Scale: 1,000,000 units. Efficiency: 0.0001 points per token. Saturation: 0%.
      *   *Wait, keep it simple for high schoolers.*
      *   Let's use a formula: **Impact = (Scale) $\times$ (Tokens) $\times$ (Multiplier)**.
      *   The Multiplier decreases as total tokens increase (Neglectedness/Diminishing Returns).
      *   The Base Impact per token varies (Tractability).
      *   The Scale varies (Importance).

      *   *Refined Plan:*
          *   **Currency:** "Grant Chips" (10 per student).
          *   **Causes:** 3 Options.
          *   **Round 1:** Read descriptions. Allocate chips.
          *   **Scoring:** Facilitator calculates based on hidden rules.
          *   **Round 2:** Reveal the "Agency Reports" (the hidden rules). Re-allocate (or just discuss).
          *   **Actually, 1 hour is tight.** Let's do one round of allocation, then reveal the math, then calculate scores together. Then discuss *why* they chose what they chose.
          *   *Better:* Do two rounds. Round 1 (Gut feeling). Reveal Math. Round 2 (Strategic). Compare scores. This proves the point.

  6.  **Developing the Rules & Materials:**
      *   **Materials:** Paper, pens, chips/tokens (or just write numbers), Cause Cards, Scoreboard.
