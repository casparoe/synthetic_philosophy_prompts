          *   Cause 2: "The Quiet Fix." 1 Token = 5 Lives Saved. Value never drops.
          *   Cause 3: "The Deep Abyss." 1 Token = 0.1 Lives Saved. Value never drops.
          *   *Wait, where is Scale?*
          *   Let's try: **Total Impact = (Your Tokens) $\times$ (Base Value) $\times$ (Diminishing Return Factor)**.
          *   Cause A (Popular): Base 10. Factor = 1 / (Total Tokens in A).
          *   Cause B (Neglected): Base 2. Factor = 1 (Constant).
          *   Cause C (Hard): Base 0.1. Factor = 1 (Constant).
          *   *If 12 people put 1 token each in A:* Total 12. Your share = 1/12. Impact = 10 * (1/12) = 0.83.
          *   *If 12 people put 1 token each in B:* Total 12. Your share = 1. Impact = 2 * 1 = 2.
          *   *This works.* It shows crowdedness hurts.

  7.  **Addressing "What Will Go Wrong":**
      *   *Gaming the system:* Someone figures out the math immediately.
      *   *Boredom:* Math is boring.
      *   *Cynicism:* "This is fake."
      *   *Dominant Voice:* One kid tells everyone what to do.
      *   *Mitigation:* Individual scoring, not group scoring. Secret ballots.

  8.  **Drafting the Debrief:**
      *   Connect the game mechanics to ITN.
      *   Cause A = Neglectedness (Crowded).
      *   Cause B = Tractability (High return).
      *   Cause C = Importance (Scale, but low return).
      *   Discuss emotional pull vs. math.

  9.  **Refining the Limitations:**
      *   Real life doesn't have clear numbers.
      *   Moral uncertainty (is saving a life the only goal?).
      *   Collaboration vs. competition (in real life, we want to coordinate, in the game, you compete for points).

  10. **Final Review against Constraints:**
      *   No ITN words until debrief? Check.
      *   1 hour? Check.
      *   12 people? Check.
      *   Payoff scheme? Check (Candy).
      *   Honest about limitations? Check.

  11. **Writing the Content:** (Self-Correction during drafting)
      *   *Make sure the math is easy enough to calculate on the fly.*
      *   *Ensure the "Crowded" cause looks attractive initially.*
      *   *Make sure the "Boring" cause looks unappealing initially.*
      *   *Name the causes evocatively.* "The Visible Tragedy" vs "The Invisible Glitch."

