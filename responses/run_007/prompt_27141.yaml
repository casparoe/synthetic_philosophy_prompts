      *   **Tone:** Practical, honest, engaging for teens.

  2.  **Deconstruct the Core Concept (ITN):**
      *   *Importance (Scale):* How many lives are affected? How bad is the problem?
      *   *Tractability (Solvability):* How much progress can be made per unit of resource?
      *   *Neglectedness (Crowdedness):* How many others are working on this? (Diminishing returns).
      *   *The Lesson:* The "saddest" problem isn't always the best one to fund if it's impossible to solve or already flooded with resources.

  3.  **Brainstorming the Game Mechanic:**
      *   *Idea 1: Dice Rolling.* Assign dice to causes. Roll to see success. (Too random, doesn't capture diminishing returns well).
      *   *Idea 2: Auction.* Bid on causes. (Good, but might get competitive in a bad way).
      *   *Idea 3: Resource Allocation with Hidden Multipliers.* Give players tokens to distribute. Each cause has a hidden formula for "Impact Points."
      *   *Selection:* Idea 3 is best. It allows for calculation and strategy. Let's make it a "Grantmaking Simulation."

  4.  **Designing the "Grantmaking Simulation":**
