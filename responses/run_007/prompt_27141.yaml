          *   *Cause 3 (The Black Hole):* "The Infinite Void." Huge suffering, but tokens do almost nothing (low tractability).
      *   **Payoff:** The group with the most "Impact Points" wins a prize (candy, bragging rights).
      *   **The Twist:** The rules for calculating points shouldn't be obvious at first. Or, better yet, give them the formulas but make them interpret them.
      *   *Revised Mechanic:* Give them the formulas *after* round 1? No, that feels like a trick. Give them the info upfront but encoded.
      *   *Best Approach:* Give them "Cause Cards" with specific stats, but describe them in narrative terms first, then reveal the math in the debrief? No, they need to make decisions based on *something*.
      *   *Let's try this:* Give them the narrative. Let them allocate. Then reveal the "Reality Check" (the math).
      *   *Actually, for a 1-hour session:* They need to play, see the results, and adjust. Two rounds.
      *   **Round 1:** Intuition only. Narrative descriptions.
      *   **Round 2:** Data revealed (Efficiency, Saturation, Scale).
      *   **Comparison:** Compare scores.

