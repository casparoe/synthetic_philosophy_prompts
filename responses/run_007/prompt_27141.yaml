answer: |-
  Here is a complete session plan designed for your 12-person high school club. It fits into a 60-minute block, requires minimal prep, and forces the intuition you want without the jargon.

  # Activity: The Impact Market

  **Time:** 60 Minutes
  **Players:** 12 Students
  **Goal:** Maximize your personal "Impact Score" by allocating resources across three causes.
  **Materials:**
  *   3 Large sheets of paper (taped to walls or tables), labeled **Cause A**, **Cause B**, **Cause C**.
  *   120 small tokens per person (can be poker chips, slips of paper with names, or even just tally marks on a sheet). Let's use slips of paper with their initials for tracking.
  *   Candy bars or cool stickers (for the top 3 scorers).
  *   Whiteboard/Marker.
  *   Printed "Cause Cards" (script below).

  ---

  ## Part 1: The Setup (5 Minutes)
  **Do not explain the math.** Do not use the words *importance*, *tractability*, or *neglectedness*.

  **Say this:**
  "Welcome. Today we're running a simulation. You are all grantmakers. You each have 10 'Grant Chips' (slips of paper). There are three causes on the walls. Your goal is simple: **Maximize your personal Impact Score.** The top 3 scorers get [prize].

  You will have two rounds to allocate your chips. You cannot talk to each other during the allocation phase. You must place your chips on the cause sheets secretly (fold them up). After Round 1, I will reveal how scoring works. Then you can adjust for Round 2."

  ---

  ## Part 2: Round 1 - Intuition (10 Minutes)
  Hand out the **Cause Cards** (read them aloud or print them). The descriptions are designed to trigger emotional responses and assumptions.

  *   **Cause A: The Visible Tragedy**
      *   *Description:* "A sudden, heartbreaking disaster is happening right now. Images are on the news. Thousands are suffering visibly. Everyone is talking about it. It feels urgent to help."
  *   **Cause B: The Boring Glitch**
      *   *Description:* "A technical inefficiency in a supply chain. It's not emotional. No one is talking about it. But fixing it stops resources from being wasted. It seems easy to fix."
  *   **Cause C: The Deep Future**
      *   *Description:* "A massive theoretical risk that could affect everyone in 100 years. It's huge in scale, but we don't know how to stop it yet. Progress is very slow."

  **Action:**
  1.  Give students 3 minutes to decide where to put their 10 chips.
  2.  Have them walk up and drop their folded chips into piles on the three sheets.
  3.  **Collect the chips.** Do not count them yet. Keep the piles separate.

  ---

  ## Part 3: The Reveal & Scoring (15 Minutes)
  Now you reveal the "Hidden Mechanics." Write this on the whiteboard.

  *   **Cause A Scoring Rule:** There is a **Fixed Pool of 500 Points**. This pool is split evenly among *every* chip placed on Cause A (by everyone in the room).
      *   *Formula:* $500 \div (\text{Total Chips on A}) = \text{Points Per Chip}$
  *   **Cause B Scoring Rule:** Each chip is worth **40 Points**. This does not change based on how many chips are there.
      *   *Formula:* $40 \times (\text{Your Chips on B}) = \text{Points}$
  *   **Cause C Scoring Rule:** Each chip is worth **5 Points**. This does not change.
      *   *Formula:* $5 \times (\text{Your Chips on C}) = \text{Points}$

  **The Calculation:**
  1.  Count the chips on Cause A publicly.
  2.  Calculate the "Points Per Chip" for Cause A.
  3.  Ask students to calculate their own scores based on where they put their chips.
  4.  Ask for a show of hands: "Who put most chips on A? B? C?"
  5.  Announce the Top 3 Scorers and give them candy.

  **Predicted Outcome:**
  Most students will flock to **Cause A** because it sounds urgent and heartbreaking.
  *   *If 80 chips land on Cause A:* Each chip is worth $500 \div 80 = 6.25$ points.
  *   *Cause B chips:* Worth 40 points each.
  *   *Cause C chips:* Worth 5 points each.
  *   **Result:** The students who ignored the "heartbreaking" cause and picked the "boring glitch" will win by a massive margin (40 pts vs 6.25 pts).

  ---

  ## Part 4: Round 2 - Strategy (10 Minutes)
  **Say this:**
  "You now know the rules. You have another 10 chips. Re-allocate them to maximize your score. Remember, your score depends on where *everyone else* puts their chips, especially for Cause A."

  **Action:**
  1.  Let them allocate silently again.
  2.  Count and Score immediately.
  3.  **Observation:** You will likely see Cause A empty out. Students will crowd into Cause B.
  4.  **Twist (Optional):** If everyone floods Cause B, announce that Cause B is now "Saturated" and the value drops to 5 points for Round 3 (if you have time). If not, skip to debrief.

  ---

  ## Part 5: The Debrief (20 Minutes)
  This is where you map the game to real EA concepts. Draw three columns on the board: **What Happened**, **Real World Equivalent**, **EA Term**.

  **1. The "Visible Tragedy" (Cause A)**
  *   *Ask:* "Why did most of you choose this first?" (Answers: Felt urgent, sad, everyone else was doing it).
  *   *Ask:* "Why did the score drop so low?" (Answers: Too many people, the pot was split).
  *   *Concept:* Just because a problem is big (Scale) doesn't mean your dollar helps much if millions of others are already donating there.
  *   **Reveal Term:** **Neglectedness**. (How crowded is the space?)

  **2. The "Boring Glitch" (Cause B)**
  *   *Ask:* "Why did this win?" (Answers: High points per chip, didn't matter what others did).
  *   *Concept:* Some problems are easier to solve than others. A dollar here buys more "progress" than a dollar elsewhere.
  *   *Reveal Term:* **Tractability**. (How easy is it to make progress?)

  **3. The "Deep Future" (Cause C)**
  *   *Ask:* "Why did almost no one pick this?" (Answers: Too small reward, too far away).
  *   *Concept:* This represented huge Scale, but low Tractability.
  *   *Reveal Term:* **Importance** (Scale).

  **4. The Formula**
  Write on the board:
  $$ \text{Impact} = \text{Importance} \times \text{Tractability} \times \text{Neglectedness} $$
  Explain: "In the game, Cause A had Importance, but low Neglectedness. Cause B had high Tractability and Neglectedness. To do the most good, we have to look at all three, not just the one that makes us feel the most emotion."

  ---

  ## What Will Predictably Go Wrong (And How to Fix It)

  **1. The "Math Whiz" Ruins It**
  *   *Risk:* One student reads the rules in Part 3, calculates the optimal move instantly, and tells everyone in Round 2.
  *   *Fix:* Emphasize in Round 2 that they must write their allocation secretly. If they shout out answers, disqualify them from the candy prize (keep it lighthearted). The lesson holds even if they coordinate; the *first round* intuition is what matters for the debrief.

  **2. Cynicism / "This is Fake"**
  *   *Risk:* Students say, "Real life isn't a game with point values."
  *   *Fix:* Agree with them! Say: "Exactly. In real life, we don't have these numbers. That's why this is hard. We have to estimate these numbers. This game gave you perfect info so you could feel the *mechanism*. In real life, we have to guess the numbers."

  **3. Cause A Gets Too Few Chips**
  *   *Risk:* If only 5 chips go to Cause A, each chip is worth 100 points ($500 \div 5$). Cause A wins.
  *   *Fix:* This actually teaches a *better* lesson (find the niche!). But if it happens, explain: "Cause A was actually the best choice *only because* you all ignored it. That proves the point: the value depends on how many others are there."

  **4. Time Overrun**
  *   *Risk:* Counting chips takes forever.
  *   *Fix:* Pre-count the chips into stacks of 10 before the session. Ask students to take whole stacks. Counting stacks is faster.

  ---

  ## Honest Limitations (Share this at the very end)
  Be transparent about what the game *didn't* capture. This builds trust.

  1.  **Collaboration vs. Competition:** "In the game, you competed against each other for points. In real life, we want to coordinate. If Cause A is truly important, we *want* 1,000 people working on it, even if your personal 'credit' is lower."
  2.  **Uncertainty:** "In the game, you knew the exact point values. In real life, we are guessing. We might think a cause is 'tractable' and be wrong."
  3.  **Moral Value:** "The game assumed 'Points = Good.' In real life, we have to argue about what counts as good. Is saving a life better than making people happier? The game skipped that hard question."

  ## Facilitator Cheat Sheet (The Math)
  *Keep this hidden until Part 3.*

  *   **Cause A (Crowded):** Total Pool 500. Divided by Total Chips.
      *   *Break-even:* If total chips > 12, Cause B is better. (Since $500 \div 12 = 41.6$, and Cause B is 40).
      *   *Goal:* You want the total chips on A to stay *very* low for it to win.
  *   **Cause B (Tractable):** Flat 40 points per chip.
  *   **Cause C (Scale/Low Tractability):** Flat 5 points per chip.

  *Why this works:* With 12 students having 10 chips each (120 total chips), if they distribute evenly (40 each), Cause A pays $500 \div 40 = 12.5$ points. Cause B pays 40. Cause B wins 3x over. This forces them to realize that "Popular" $\neq$ "High Impact."
