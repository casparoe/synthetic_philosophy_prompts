answer: |-
  Yes, there is an established name for exactly this phenomenon. It is called **conceptual slippage** (or simply **slippage**).

  This term comes from the work of **Douglas Hofstadter** and the **Fluid Analogies Research Group (FARG)** at Indiana University in the 1980s and 90s. The specific puzzle you described (`aabc` $\to$ `aabd`, therefore `ijkk` $\to$ ?) is one of the canonical test cases from their computer model, **Copycat**.

  You have independently rediscovered a core insight of cognitive science: that human reasoning is not a rigid application of symbolic logic, but a fluid process of perception where concepts deform to fit the context.

  Here is a breakdown of what conceptual slippage is, how it works, and how to distinguish it from the neighboring concepts you mentioned.

  ### 1. What is Conceptual Slippage?
  Conceptual slippage is the unconscious shifting of a concept into a neighboring concept when the original concept encounters "pressure" from the context.

  In your example, the initial rule seems to be:
  *   **Object:** Rightmost letter
  *   **Action:** Replace with successor

  When the context changes from `abc` to `aabc`, and the target from `ijk` to `ijkk`, a literal application of the rule creates friction. `ijkk` has two "rightmost" letters. A rigid logician might say the rule is undefined. A human, however, feels a **pressure** to resolve the ambiguity.

  To relieve this pressure, the concepts slip along lines of similarity:
  *   "Letter" slips to "Group of identical letters."
  *   "Rightmost letter" slips to "Rightmost group."
  *   "Change that letter" slips to "Change that group."

  Crucially, the person does not feel they have changed the rule. They feel they have understood the *spirit* of the rule. Slippage is the mechanism that preserves the *gist* while sacrificing the *syntax*.

  ### 2. What It Is Not (The Edges)
  You asked for distinctions. This is where the concept becomes most useful.

  **Slippage vs. Ordinary Analogy**
  *   **Analogy** is the mapping between two domains (Source: `abc` $\to$ `abd`; Target: `ijk` $\to$ `?`).
  *   **Slippage** is what happens *inside* the nodes of that mapping.
  *   *Distinction:* In a rigid analogy, `A` maps to `A'`. In a fluid analogy with slippage, `A` maps to `A'`, but only because `A` was allowed to slip to `A_near` to make the fit work. Slippage is the *engine* that allows deep analogies to form where surface analogies fail.

  **Slippage vs. Rule-Switching**
  *   **Rule-Switching** implies a conscious or discrete choice between two distinct algorithms (e.g., "Oh, the first rule doesn't work, I'll try the second rule I have in my toolbox").
  *   **Slippage** feels continuous. The user insists they are following the *same* rule. If you ask them, "Did you change the rule?" they will say "No, obviously `ijkk` to `ijkl` would be wrong; the rule is clearly about the changing part."
  *   *Distinction:* Rule-switching is discrete and often conscious; slippage is continuous and almost always unconscious.

  **Slippage vs. Ambiguity Resolution**
  *   **Ambiguity** implies a word or symbol has two static meanings (e.g., "bank" = river or money).
  *   **Slippage** implies the *meaning itself* is flexible and context-dependent. It isn't that "letter" has two definitions; it's that the concept "letter" has a halo of related concepts (group, character, symbol) that it can melt into under pressure.
  *   *Distinction:* Ambiguity is a property of the code; slippage is a property of the cognitive processing.

  ### 3. The Mechanism: Pressure and Neighborhoods
  Hofstadter describes concepts as existing in a semantic network with "neighbors."
  *   **Successor** is a neighbor of **Predecessor**.
  *   **Letter** is a neighbor of **Group**.
  *   **Right** is a neighbor of **Left**.

  Slippage occurs when **Pressure** is applied. Pressure arises when a literal interpretation leads to a contradiction, an impossibility, or an aesthetic awkwardness.

  *   **Example 1 (Boundary Pressure):** `abc` $\to$ `abd`, so `xyz` $\to$ ?
      *   Literal rule: Replace rightmost with successor.
      *   Pressure: `z` has no successor.
      *   Slippage: "Successor" slips to "Predecessor."
      *   Result: `xyw`. (Or "Successor" slips to "Wrap around," result `xya`).
  *   **Example 2 (Directional Pressure):** `abc` $\to$ `abd`, so `cba` $\to$ ?
      *   Literal rule: Change rightmost.
      *   Pressure: The string is reversed. Changing the `a` feels like it violates the "end of the alphabet" spirit.
      *   Slippage: "Rightmost" slips to "Leftmost" (because `cba` is structurally `abc` running backwards).
      *   Result: `dba`.

  ### 4. Why This Matters for Your Game
  You noted that people do this "without noticing they've changed the rule." This is the hallmark of slippage. It reveals that human rules are not computer code; they are **descriptions of relationships**.

  When you design your puzzles, you are essentially tuning the **pressure**.
  *   **Low Pressure:** `abc` $\to$ `abd`, `ijk` $\to$ `ijl`. (No slippage needed).
  *   **Medium Pressure:** `aabc` $\to$ `aabd`, `ijkk` $\to$ `ijll`. (Slippage of "letter" to "group").
  *   **High Pressure:** `abc` $\to$ `abd`, `xyz` $\to$ `xyw`. (Slippage of "successor" to "predecessor").

  If the pressure is too high (the concepts are too far apart in the semantic network), people won't slip; they will just say the puzzle is broken. If the pressure is too low, they won't slip; they will just apply the literal rule. The "sweet spot" for your game is where the slippage is non-obvious but feels inevitable once seen.

  ### 5. Recommended Reading
  If you want to dive deeper into the mechanics of this, there are two key texts:

  1.  **"Fluid Analogies" (The Copycat Project):** This is the technical basis. It details the computational model that simulates this slippage.
  2.  ***Surfaces and Essences: Analogy as the Fuel and Fire of Thinking*** **(Hofstadter & Sander, 2013):** This is the popular science exposition of the theory. It is filled with hundreds of examples exactly like the ones you are creating. It argues that *all* categorization is a form of slippage.

  ### Summary
  The phenomenon is **Conceptual Slippage**.
  *   **It is:** The fluid deformation of concepts to preserve the deep structure of a rule under contextual pressure.
  *   **It is not:** Choosing a different rule, resolving static ambiguity, or standard structural mapping.
  *   **The Edge:** It stops when the "distance" between concepts is too great for the pressure to bridge (e.g., `abc` $\to$ `abd` rarely leads to `ijk` $\to$ `91011` unless the context primes "numbers").

  You are effectively gamifying the core mechanism of human cognition. The fact that your players agree on the slippage (e.g., most say `ijll`) shows that our conceptual neighborhoods are shared, not private.
