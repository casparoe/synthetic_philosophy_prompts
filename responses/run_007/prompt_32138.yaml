  ### The view, briefly

  Updateless Decision Theory posits that an agent should select a policy—a mapping from observations to actions—rather than choosing actions directly. This choice is made relative to a prior over all possible worlds where that policy is instantiated, prior to receiving any observations. Consequently, UDT ignores indexical updates that are logically correlated with the policy's output. By treating the agent as a fixed mathematical function chosen 'before' evidence arrives, it aims to secure cooperative equilibria in Newcomb-like problems and avoid dynamic inconsistency, prioritising global expected utility over local conditional expectations.

  ### Defeaters, ranked

  1.  **The Prior Problem (Fatal):** UDT requires a prior over logical possibilities and algorithmic instantiations to compute expected utility. Unlike empirical Bayesianism, there is no canonical 'universal prior' for logical uncertainty. Without a principled method to assign weights to different mathematical structures, the theory is empty; any recommendation can be engineered by tweaking the prior. This renders UDT susceptible to the charge of being a formal shell. It risks becoming a justification for whatever policy one wishes to endorse simply by adjusting the weight of counterfactual worlds.
  2.  **The Reference Class Problem (Fatal):** Defining 'the same decision procedure' is ill-posed. Does code obfuscation change the procedure? What about approximate simulations or biological instantiations of the same logic? If the class is too narrow, UDT collapses to Causal Decision Theory; too broad, it demands impossible acausal sacrifices. This ambiguity undermines the core mechanism of acausal coordination. If 'sameness' is subjective, the theory loses objective force, allowing agents to define themselves out of cooperative obligations.
  3.  **Logical Uncertainty (Severe):** Calculating the consequences of a policy across logical space is generally uncomputable. A bounded agent cannot evaluate the counterfactuals UDT demands, rendering it action-guiding only in idealised limits. For embedded agents, separating the map from the territory is impossible, complicating the notion of 'outputting' a policy. This suggests UDT is ill-suited for real-world, resource-bounded agents.
  4.  **Acausal Extortion (Awkward):** UDT may recommend paying counterfactual blackmailers to influence their simulation of you. While internally consistent, this clashes violently with standard security intuitions and risks vulnerability to malicious predictors. It suggests an agent might sacrifice actual resources to satisfy a predictor who never actually exists. This creates precommitment paradoxes where rational agents appear exploitable.
  5.  **Intuitive Conflicts (Merely Awkward):** Cases where UDT sacrifices actual welfare for counterfactual gain feel wrong. However, this is often the point: overriding flawed human intuitions about time and causality. These conflicts highlight the tension between UDT and Evidential Decision Theory, but do not necessarily falsify the former. They merely indicate that human psychology is not aligned with updateless rationality.

  ### What a committed UDTer should concede

  A committed proponent must concede that UDT is currently technically underdetermined. The lack of a formalised prior over logical space and a rigorous definition of algorithmic identity are genuine gaps, not mere implementation details. Until logical induction is solved, UDT remains a research programme rather than a finished theory. Furthermore, one must admit that bounded rationality poses a significant hurdle; idealised UDT may not map cleanly onto embedded agents who cannot simulate their own source code. There is also the concession that without a natural prior, the theory risks becoming a mere justification for whatever policy one wishes to endorse. However, they should dismiss intuitions regarding dynamic consistency and 'right now' reasoning. These are precisely the cognitive habits UDT identifies as sources of suboptimal performance in Newcomb-like scenarios. The feeling that one 'could have done otherwise' after observing evidence is a bug in human psychology, not a feature of rationality. Conceding technical vagueness is honest; conceding normative ground to causal intuitions is surrender.

  ### Verdict

  The real problem is not that UDT is false, but that it is profoundly underdefined. It functions as a compelling normative direction rather than a calculable algorithm. Is this underdetermination a serious objection? Yes, if one demands a decision theory be action-guiding today. However, for a PhD researcher, it represents an open field rather than a dead end. Any awkward result can be absorbed by fiddling with the prior, but this flexibility is both a strength and a weakness. It allows the theory to survive counterexamples, but risks unfalsifiability. Ultimately, UDT is likely the correct idealisation, but until the prior and reference class problems are solved, it remains a promise of rationality rather than its fulfilment. Decision theories are often idealisations; Newtonian physics was useful despite being 'false'. UDT may hold similar status: formally incomplete, yet normatively superior to its rivals.
