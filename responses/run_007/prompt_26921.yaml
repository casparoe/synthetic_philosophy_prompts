answer: |-
  This is a sharp dissection of a problem that often gets glossed over in "economic approaches to ethics." You have essentially reconstructed the tension between **welfarist/consequentialist aggregation** and **deontological constraints**, but framed it through the lens of Coasean bargaining.

  Your intuition is correct: the argument breaks at **Premise (2)** (Content Neutrality) and **Premise (4)** (The nature of the *pro tanto* reason).

  Here is where the logic fails, why the "abortion vs. schools" case feels different from "civil rights vs. highways," and what you have to give up to resolve it without throwing out the baby (compromise) with the bathwater (moral horror).

  ### 1. The Category Error: Preferences vs. Constraints
  The economic model of gains-from-trade assumes that all values are **preferences over outcomes** that can be represented as continuous variables in a utility function.
  *   **The Benign Case:** Alice and Bob treat "abortion access" and "school funding" as *policy preferences*. They are arguing over the distribution of resources and legal permissions within an agreed-upon framework.
  *   **The Abhorrent Case:** The racist agent treats "ethnic homogeneity" not as a preference, but often as a **constitutive rule** of the society.

  **Where it breaks:** Premise (2) assumes that all values are fungible weights. But many moral values function as **side-constraints** (to use Nozick's term) rather than utility weights.
  *   If I value "Liberty" as a weight (0.2), I can trade it off.
  *   If I value "Liberty" as a *right*, it is a constraint on action. It says, "Do not cross this line, regardless of the utility gain elsewhere."

  **The Fix:** You must distinguish between **Distributive Values** (how we slice the pie) and **Constitutive Values** (who is allowed at the table, and what rights they bring with them).
  *   *School funding* is distributive.
  *   *Civil rights* are constitutive.
  *   *Ethnic homogeneity* (enforced by policy) is a violation of constitutive status.

  You cannot use gains-from-trade logic to negotiate the *preconditions* of trade itself. If you trade away civil rights, you are altering the status of the participants such that future trade (or even the legitimacy of the current trade) becomes impossible.

  ### 2. The Coasean Critique: Property Rights Must Precede Trade
  The Coase Theorem (the basis of the gains-from-trade argument) relies on a hidden assumption: **Well-defined property rights must exist *prior* to the negotiation.**
  *   I can trade you my apple for your orange because we already agree that I own the apple and you own the orange.
  *   If we disagree on *who owns the apple*, we cannot use market logic to resolve it without begging the question.

  In your "Civil Rights vs. Highways" scenario, the racist party is effectively claiming ownership over the bodily autonomy or social status of the minority group.
  *   **The Benign Trade:** Alice and Bob agree that citizens own their own bodies and that the state owns the budget. They are trading *state budget allocations* and *regulatory thresholds*.
  *   **The Abhorrent Trade:** The racist is asking to trade *ownership of people*.

  **What you have to give up:** You have to give up the idea that the gains-from-trade framework is **foundational**. It is not a meta-ethical solvent that dissolves all conflicts. It is a tool that only works *inside* a moral framework that has already settled questions of basic status and rights.

  If you try to apply market logic to the definition of rights themselves, you get the repugnant conclusion. The market logic presupposes the rights it is trying to trade.

  ### 3. The Integrity/Complicity Objection (Addressing your hypothesis)
  You mentioned: *"moral values aren't just weights in a utility function because they make claims on everyone, not just on the holder."*

  This is close, but the stronger version is about **Agent-Integrity**.
  When you engage in a trade, you are not just affecting the outcome; you are **endorsing the mechanism**.
  *   **Benign Trade:** When I trade school funding for abortion restrictions, I am engaging in democratic logrolling. I am saying, "I accept the legitimacy of the democratic process to determine these policy levels." I am not necessarily endorsing the *moral truth* of the other side, but I am endorsing the *procedural legitimacy* of the compromise.
  *   **Abhorrent Trade:** When I trade civil rights for highways, I am endorsing the *legitimacy of racism* as a bargaining chip. I am making myself an agent of the racist value system.

  This creates an **agent-relative constraint**. Even if the *outcome* (Highways + Less Civil Rights) has higher utility by my own lights than the status quo (No Highways + Civil Rights), the *action* of trading violates my integrity as a moral agent who recognizes certain rights as non-negotiable.

  **Why this doesn't kill the benign case:**
  In the benign case, neither party is asking the other to violate a core duty of recognition. Alice isn't asking Bob to admit that fetuses are non-persons; she's asking him to allocate budget differently. In the abhorrent case, the racist is asking you to admit that some humans are lesser. That is a demand to violate a duty of recognition, which is a constraint on *you*, not just an outcome in the world.

  ### 4. The "Dynamic/Slippery Slope" Constraint
  There is also a pragmatic, second-order reason to reject Premise (4).
  *   **Normalization:** Engaging in trade on fundamental rights lowers the "price" of violating those rights in the future.
  *   **Signaling:** Refusing to trade on civil rights signals that they are not fungible. If you trade them, you signal they are commodities.

  Even if the single instance of the trade looks positive (Pro Tanto), the **systemic effect** of establishing a market in rights is negative. This is similar to the argument against selling votes or babies. The market itself corrupts the good being traded.

  ### Summary: How to Resolve the Dilemma

  You do not need to abandon the gains-from-trade model for ethics, but you must **domain-restrict** it.

  1.  **Reject Premise (2):** The logic is *not* content-neutral. It applies to **policy preferences** (tax rates, speed limits, budget allocations) but not to **status claims** (rights, personhood, basic liberties).
  2.  **Modify Premise (4):** There is no *pro tanto* reason to take a trade that requires violating a deontological constraint (like complicity in rights violations), even if the outcome is preferred. The "value left on the table" is illusory because it was never legitimate currency to begin with.
  3.  **The Distinction:**
      *   **Legitimate Trade:** "I care more about X, you care more about Y. Let's swap influence on X and Y." (Where X and Y are within the Overlapping Consensus of legitimate state action).
      *   **Illegitimate Trade:** "I care about X, you care about Z. Z involves denying the moral standing of a group. I will help you deny their standing if you help me with X."

  **What you have to give up:**
  You have to give up the hope that **all** moral disagreement is resolvable through negotiation. Some disagreements are about the *rules of the game* rather than the *score of the game*. You cannot negotiate the rules using the logic of the score.

  The rationalist impulse to "dissolve" moral conflict into preference conflict is powerful, but it fails when it encounters values that are **constitutive of the agents themselves**. You can trade what you *have*; you cannot trade what you *are* (or what others *are*) without destroying the basis for trade.
