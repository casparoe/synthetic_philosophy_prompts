  A spark ignites. A stone begins to fall.
  An atom swerves. A leaf hits on the ground.
  No force compels. No power drives it all.
  Just distinct points where qualities are found.
  The cup shatters. The water spills across.
  The sun rises. No hand pushes it.
  There is no glue. Necessity is loss.
  Just local matters, each distinct bit.
  Then call this Law? Mere systematizing.
  The best system compressing the event.
  No prescript rules, but just recognizing.
  Mere descriptions to which we assent.
  The pattern holds, yet holds no power to bind.
  One thing follows, leaving cause behind.

  ***

  **Note**

  The strongest objection is explanatory circularity. If laws are merely summaries of the mosaic, they cannot explain *why* the mosaic exhibits stable regularities. Anti-Humeans argue laws possess modal force—they govern or produce events. The poem becomes untenable if objective chance exists irreducibly. Lewis's "Big Bad Bug" shows that objective probabilities cannot supervene on the Humean mosaic without contradiction. If chances are real features of the world not fixed by particular facts, the supervenience base collapses, and the mosaic is no longer fundamental.
