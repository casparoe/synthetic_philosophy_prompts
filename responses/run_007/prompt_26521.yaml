answer: |-
  This is one of the sharpest cuts in decision theory, and you have correctly identified the slippery slope between the two. The confusion arises because both the Sophisticated and Resolute choosers produce the same *behavior* (avoiding the money pump), but they justify it with fundamentally different *normative architectures*.

  Here is the breakdown of the distinction, followed by the structured summary you requested.

  ### The Strategic vs. The Normative

  To understand the difference, we have to look at how each agent views the relationship between their temporal selves.

  **The Sophisticated Chooser** operates on a model of **strategic anticipation**. This agent accepts the standard decision-theoretic axiom of *Separability*: when you arrive at a choice node, you should maximize your utility based on your preferences *at that moment*. The Sophisticate knows their future preferences will shift (e.g., they will become impatient tomorrow). Therefore, they use backward induction to figure out what their future self *will* do, not what they *should* do. If the future self will succumb to a money pump, the present self treats that future weakness as a physical constraint, like a wall or a budget limit. They choose the best available path that the future self won't sabotage.

  In this view, the agent is essentially a sequence of distinct players in a game. The "Present Self" is playing against "Future Self." Sophistication is a form of self-management. It concedes that the preference structure is diachronically inconsistent (and thus, by standard lights, irrational) but argues that the *agent* can still be instrumentally rational by navigating around their own brokenness. It does not rescue the rationality of the preferences; it rescues the agent from the worst consequences of those preferences.

  **The Resolute Chooser**, most famously associated with Edward McClennen, operates on a model of **plan-based agency**. This agent rejects *Separability*. They argue that rationality is a property of the agent *over time*, not just at a specific time-slice. When a Resolute chooser makes a plan, that plan generates a reason for action that persists even when local preferences shift. If they prefer A to B today, and plan to choose A tomorrow, they choose A tomorrow *even if* their local preference has shifted to B. They do not treat the preference shift as a constraint to be routed around; they treat it as an impulse to be overridden by the authority of the plan.

  In this view, the agent is a single entity extended through time. Resoluteness claims that sticking to the plan *is* the rational act, regardless of the local preference shift. This approach attempts to rescue the rationality of the original preferences by redefining diachronic rationality. It argues that dynamic inconsistency isn't a flaw in the agent, but a flaw in the standard theory that demands we maximize local utility at every node.

  ### The Core Tension

  Your intuition that they require the same "capacity" is partially correct: both require the cognitive ability to model the future and inhibit current impulses. However, the *source of authority* differs.

  For the Sophisticate, the authority comes from **prediction**. "I won't eat the cake because I know Future-Me will regret it, and I want to minimize that regret now."
  For the Resolute chooser, the authority comes from **commitment**. "I won't eat the cake because I decided not to, and my past decision binds my present action."

  This leads to your question about whether either rescues rationality.
  *   **Sophistication** admits the preferences are "broken" (intransitive or dynamically inconsistent) but argues the *choice function* is rational. It's a pragmatic workaround.
  *   **Resoluteness** argues the preferences are fine, but the *norm of choice* (maximize local utility) is wrong. It's a theoretical reconstruction.

  If your goal is to show that an agent with intransitive preferences isn't "crazy," Resoluteness is the stronger philosophical defense because it challenges the Money Pump argument's underlying assumption (that rationality requires maximizing at every node). Sophistication essentially agrees with the Money Pump argument ("Yes, I would be pumped if I didn't constrain myself") and simply builds a cage.

