  I am a university student currently taking a philosophy of probability and decision theory course, and I would be grateful for a careful explanation of something I keep getting tangled in. In our lecture on the St Petersburg paradox and its descendants, we were introduced to Nover and Hájek's Pasadena game. As I understand the setup: a fair coin is tossed until it lands heads for the first time; if the first heads occurs on the nth toss, the payoff is +2^n/n dollars when n is odd and −2^n/n dollars when n is even. The expected value is therefore represented by the series whose nth term is (−1)^(n−1)/n, i.e. 1 − 1/2 + 1/3 − 1/4 + … . Our lecturer said that the expected value of this game is not infinite but undefined, because the expectation is a conditionally convergent series.

  I am having trouble seeing exactly what the contrast between 'infinite' and 'undefined' is doing here. The St Petersburg game has an expectation that diverges to positive infinity, and we treat that as an infinite expected value; but in the Pasadena game the natural-order sum converges to ln 2, so I would have expected the problem to be that the expected value is ln 2, not that it is undefined. I gather the point is that conditional convergence makes the sum order-sensitive, but I do not yet see why order-sensitivity should matter for the expectation of a game, where the outcomes are just a set of possibilities rather than a sequence with a privileged ordering.

  Please take on the role of an expert in the philosophy of probability and decision theory. Think through the issue carefully, and before writing your explanation, briefly brainstorm how you will structure it. Then explain: (a) precisely why the expectation of the Pasadena game is standardly said to be undefined rather than equal to ln 2 or infinite; (b) how this differs from the St Petersburg case; and (c) what, if anything, this shows about expected utility theory. Aim the explanation at a serious undergraduate who has seen sequences and series, including conditional and absolute convergence, but has not studied measure theory. Please write the final answer in British English.
