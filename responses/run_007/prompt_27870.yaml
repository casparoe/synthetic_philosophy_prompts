  1. The case is constructed as a single realistic paragraph set in ordinary life involving only human observation and credible threats.
  2. The principle of alternative possibilities denies responsibility because the threat ensures Elias could not have refrained from signing the contract.
  3. The Frankfurt-style verdict affirms responsibility because Elias signs freely in the actual sequence without Mara's intervention.
  4. The flicker theorist argues the involuntary hitch constitutes a robust alternative, but the case survives because moral responsibility cannot hinge on involuntary physiological states.
  5. The involuntary trigger blunts the flicker strategy, and removing it allows the theorist to claim the prior sign was a free action grounding responsibility.
