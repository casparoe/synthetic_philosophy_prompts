          *   No -> Coherentism or Skepticism.
      *   Q3 (Coherentism/Skepticism branch): Can a set of beliefs justify each other mutually (even if it loops)?
          *   Yes -> Coherentism.
          *   No -> Skepticism.

      *Critique:* This is a bit too linear. Infinitists usually deny Q1 (No basic beliefs) but affirm infinite chains. Coherentists deny Q1 and deny infinite chains (they want loops). Skeptics deny that *any* solution works.
      Let's refine the "No" branch of Q1. If justification *must* come from another belief, then we have a chain. What does the chain look like?
