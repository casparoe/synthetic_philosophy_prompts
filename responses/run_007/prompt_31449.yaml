      *Refining the "Indistinguishable" requirement:*
      *   Modest Foundationalism and Coherentism can blur. A "Modest Foundationalist" might allow that coherence *adds* justification, but isn't the *source*. The tree needs to be clear that Foundationalism requires *some* non-inferential source.
