prompt: |-
  I keep needing a distinction and I dont know the standard name for it, so I'm hoping someone can point me to the right carving. The clearest case is blindsight: a person with damage to part of visual cortex insists they see nothing in that region, but when you make them guess whether a light was flashed there, they're correct far above chance. The information is evidently getting in and steering their responses, but there's nothing it's like for them. I've also seen the reverse configuration floated, where someone seems to have a rich experience but can report only a thin slice of it, though I'm less confident those cases hold up.

  What I'm after isn't the name for the condition itself. I'm after the underlying split between information being available for report and control on the one side, and being consciously experienced on the other. I keep seeing people use "conscious" to mean only the first side — available for report, broadcast to other parts of the system, usable for reasoning — and that feels like it's collapsing exactly the difference I'm trying to keep track of. Does this split have an established name? Is it generally treated as a real difference or as two descriptions of one thing? And if it does have a name, what are the edge cases people fight about — in particular the reverse direction, where experience is present without the usual reportability?
