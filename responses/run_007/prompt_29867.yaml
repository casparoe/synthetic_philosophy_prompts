answer: |-
  The distinction you are looking for is standardly called the distinction between **Access Consciousness** and **Phenomenal Consciousness**.

  This terminology was most famously codified by the philosopher **Ned Block** in his 1995 paper *"On a Confusion about a Function of Consciousness."* It is the canonical framework used in philosophy of mind and cognitive science to prevent exactly the conceptual collapse you are frustrated by.

  Here is the breakdown of the terms, the status of the debate, and the edge cases you asked about.

  ### 1. The Definitions

  *   **Phenomenal Consciousness (P-Consciousness):** This is the "what it is like" aspect. It is the raw subjective experience, the qualia, the feeling of redness or pain. If there is "something it is like" to be the system, it has P-consciousness.
  *   **Access Consciousness (A-Consciousness):** This is the functional aspect. A state is access-conscious if its content is available for use in reasoning, for the rational control of action, and crucially, **for verbal report.**

  In your blindsight example: The patient has visual information steering their guesses (a form of functional access for action), but they lack the *experience* of seeing. Block analyzes this as a dissociation where functional processing occurs without phenomenal consciousness.

  ### 2. Is it a Real Difference or One Thing?

  This is one of the most heated debates in contemporary cognitive science. There are two main camps:

  **The Separatists (Block, Victor Lamme, etc.):**
  They argue P-consciousness and A-consciousness are empirically and conceptually distinct. You can have one without the other.
  *   *Neuroscientific correlate:* They often align with **Recurrent Processing Theory (RPT)**. This suggests that local recurrent processing in sensory cortex is sufficient for experience (P-consciousness), even if that information never reaches the prefrontal cortex for global broadcasting (A-consciousness/report).

  **The Unity Theorists (Daniel Dennett, Stanislas Dehaene, Michael Cohen, etc.):**
  They argue that the distinction is a confusion. For them, consciousness *just is* access. If information is not available for report or global control, it is not conscious.
  *   *Neuroscientific correlate:* They align with **Global Neuronal Workspace Theory (GNWT)**. This theory posits that consciousness arises when information is broadcast globally to working memory and report systems. If it isn't broadcast, it isn't conscious.
  *   *The Dennett View:* Dennett argues that "phenomenal consciousness" without access is a philosophical fiction. If you can't report it, reason with it, or act on it, there is no fact of the matter about whether you experienced it.

  ### 3. The Edge Cases: The "Reverse Direction"

  You mentioned being less confident about the reverse case (rich experience, thin report). This is the specific battleground known as the **Overflow Debate**.

  The question is: **Does Phenomenal Consciousness Overflow Access Consciousness?**

  **The Argument for Overflow (P > A):**
  Proponents argue we experience more than we can report.
  *   **Sperling's Iconic Memory:** In a classic experiment, subjects are flashed a grid of letters for a split second. They report feeling like they saw *all* the letters (rich P-consciousness), but they can only report 3 or 4 before the image fades (limited A-consciousness/working memory). Block argues the experience was rich, but access was bottlenecked.
  *   **Peripheral Vision:** You feel like you have a rich, high-resolution experience of your entire visual field, but if tested, you cannot report details in the periphery without moving your eyes. Separatists say the experience is rich; Unity theorists say the richness is an illusion generated by the potential to access it.

  **The Argument Against Overflow (P = A):**
  Critics argue that what feels like rich experience is actually just a belief or a high-capacity sensory buffer that isn't yet conscious.
  *   **Postdiction:** Some argue that when you attend to a part of the scene to report it, your brain "fills in" the experience retroactively. You didn't consciously see the whole grid; you consciously saw the 4 letters, and your brain creates the *impression* that you saw more.
  *   **Methodological Constraint:** Since science relies on report (A-consciousness) to measure experience (P-consciousness), Unity theorists argue we should not posit entities (unreportable experiences) that are scientifically unmeasurable.

  ### 4. Other Relevant Terminology

  While "Access vs. Phenomenal" is the standard carving, you may encounter these related terms:

  *   **Awareness vs. Consciousness:** Sometimes used to map onto this distinction (e.g., "perceptual awareness" vs. "reflective consciousness"), but usage is inconsistent.
  *   **Qualia:** Refers specifically to the intrinsic properties of Phenomenal Consciousness.
  *   **The Hard Problem:** Coined by David Chalmers. This distinction is essentially the opening move in addressing the Hard Problem. If Access = Phenomenal, the Hard Problem dissolves into the "Easy Problems" of function. If they come apart, the Hard Problem remains.

  ### Summary for your usage

  If you want to be precise in writing or conversation:

  1.  Use **Phenomenal Consciousness** when referring to the subjective experience ("what it's like").
  2.  Use **Access Consciousness** when referring to reportability, reasoning, and global control.
  3.  Acknowledge that **Blindsight** is the standard case for Access (functional) without Phenomenal.
  4.  Acknowledge that **Iconic Memory / Overflow** is the contested case for Phenomenal without Access.

  Your intuition that using "conscious" to mean only "reportable" collapses the distinction is exactly Ned Block's argument. He calls this **"The Confusion."** Maintaining the distinction is the standard move for anyone arguing that subjective experience is not fully reducible to functional output.
