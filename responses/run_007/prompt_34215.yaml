      *   *Film:* Entropy is a switchable property of an object/person. You can invert a bullet, a car, or a person while the rest of the world stays normal.
      *   *Physics:* Entropy is a statistical property of a *system* (ensemble), not an intrinsic label on a particle. The "arrow" emerges from boundary conditions (Past Hypothesis), not local dynamics. You can't locally reverse entropy without isolating the system perfectly (which the film acknowledges slightly with masks/air, but contradicts with physical contact).
      *   *Film:* Inverted objects move "backward" in time relative to normal matter.
      *   *Physics:* Microphysical laws are mostly time-symmetric (T-symmetry). Reversing time looks like valid physics *except* for the thermodynamic gradient.
      *   *Film:* "What's happened, happened." (Fatalism).
      *   *Physics:* Time reversal invariance doesn't imply determinism or fatalism in the macroscopic sense, though block universe views might.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the ambition of the film. State the thesis: *Tenet* is a "thought experiment gone wrong" in physics terms but a "thought experiment gone right" in phenomenological terms. It treats entropy as a substance/force rather than a statistical state.

      *   **1. The Category Error: Entropy as Intrinsic Property vs. Statistical State:**
          *   *Concept:* Boltzmann. Entropy is about configurations of many particles, not a single bullet.
          *   *Film:* Treats entropy like a charge or a switch.
