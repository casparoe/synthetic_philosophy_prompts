          *   *Nuance:* The film *does* notice the interaction problem (inverted fire freezes, need inverted air). This shows they know contact matters, but they solve it with "inverted materials" rather than acknowledging the statistical impossibility of maintaining a low-entropy gradient amidst high-entropy surroundings without infinite energy/isolation.

      *   **2. The Past Hypothesis and the Global Arrow:**
          *   *Concept:* The arrow exists because the universe started low entropy (Big Bang).
          *   *Film:* The "Algorithm" can invert the *whole* world.
          *   *Analysis:* This is actually conceptually consistent *if* you view the Algorithm as resetting the boundary condition. If the whole universe inverts, the arrow flips. But the film wants *local* inversion within a *global* arrow.
          *   *Critique:* A locally inverted object in a normal world should thermally equilibrate instantly. The film hand-waves this with "turnstiles." The turnstile is a magical boundary condition setter.

      *   **3. Loschmidt and Micro-Reversibility:**
          *   *Concept:* Micro laws are reversible. If you reverse all momenta, the system retraces its path.
          *   *Film:* Inverted bullets fly back into guns.
          *   *Analysis:* This is the film's strongest physics link. It dramatizes Loschmidt's point: if $t \to -t$, the movie looks the same (mostly).
          *   *Critique:* It ignores the *probability*. Retracing the path requires precise coordination of every particle. The film treats this as a property of the object, not the state of the universe.

      *   **4. Fatalism ("What's Happened, Happened"):**
          *   *Concept:* Does time reversal imply determinism?
