          *   *Nuance:* The film conflates the Block Universe (eternalism) with Thermodynamic Inversion. You can have a block universe without entropy inversion. You can have entropy inversion (hypothetically) without fatalism (if quantum indeterminacy holds). The film smuggles in a specific metaphysics of time to serve the plot.

