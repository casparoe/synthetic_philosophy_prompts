answer: |-
  Based on the verdicts you've tracked, your friend is navigating a classic tension in moral philosophy: **Consequentialism** (maximize overall good) vs. **Deontology** (respect individual rights/constraints). She is not a pure utilitarian (she rejects sacrificing one to save five in V4 and V8), but she isn't a strict absolutist either (she accepts taxes and triage).

  Here is the breakdown of the principles she seems to be running, how they apply to the drug case, and how to test which one is actually driving her judgments.

  ### Candidate Principles

  **1. The Strict Bodily Integrity Rule**
  *   **The Rule:** It is never permissible to impose non-consensual *physical* harm on an innocent person, regardless of the benefit to others. Financial or opportunity costs are permissible; physical violations are not.
  *   **Fits Verdicts:** Explains why Slap (V2), Organ Harvest (V4), Forced Kidney (V6), and Pushing (V8) are **NOT OK**. It allows Vacation (V1), Tax (V3), Voluntary Donation (V5), and Triage (V7) because those are either self-imposed, financial, or allocation of external resources rather than direct physical violation.
  *   **Prediction for Drug Case:** **NOT OK.** The side effect is a physical condition (arthritis) imposed without consent.

  **2. The Anti-Targeting (Statistical) Rule**
  *   **The Rule:** It is impermissible to *single out* a specific, identifiable individual to bear a cost for the greater good. However, it is permissible to impose costs that are distributed statistically or diffusely, where no one is targeted ex-ante.
  *   **Fits Verdicts:** Explains why Tax (V3) is **OK** (everyone pays, no one targeted) and Organ Harvest (V4) is **NOT OK** (one specific healthy person is chosen). It explains Triage (V7) as **OK** because the decision is based on medical criteria applied to a class of patients, not a targeted sacrifice of a specific outsider.
  *   **Prediction for Drug Case:** **OK.** The victim is randomly selected and unidentified in advance. They are a "statistical victim" (like a taxpayer), not a "targeted victim" (like the organ donor).

  **3. The Means vs. Side-Effect Rule (Doctrine of Double Effect)**
  *   **The Rule:** You cannot use a person *as a means* to save others (their body or death is the tool). You can, however, harm them as a foreseen *side effect* of a good action.
  *   **Fits Verdicts:** Explains why Pushing (V8) and Organ Harvest (V4) are **NOT OK** (the person is the tool/obstacle removed). It explains why Triage (V7) is **OK** (the patient dies as a result of resource scarcity, not because their death is the mechanism saving the other).
  *   **Prediction for Drug Case:** **OK.** The person is not being *used* to cure the 10,000 (the drug chemistry does that); they are merely suffering a side effect of the cure.

  ---

  ### What She Would Say (and Why)

  If she is being consistent, she will likely say **it is OK to release the drug.**

  **The Reasoning:**
  While the **Strict Bodily Integrity Rule** is a strong contender, her acceptance of **Triage (V7)** undermines it. In V7, a specific patient suffers the ultimate physical harm (death) due to a decision made for the benefit of another. She permits this because it is an allocation of resources, not an active killing.

  Furthermore, her acceptance of **Taxes (V3)** shows she permits non-consensual impositions for the public good provided they are systemic rather than targeted. The Drug Case is structurally identical to the Tax Case: a diffuse population benefits, and a random, unidentified individual bears a cost. The fact that the cost is physical (arthritis) rather than financial is outweighed by the fact that the harm is non-fatal (unlike V4, V7, V8) and the selection is statistical (unlike V4, V6, V8).

  Her core commitment appears to be the **Anti-Targeting Rule**. She rejects cases where a specific person is *chosen* to be sacrificed (Organs, Trolley Push), but accepts cases where harm falls on someone as a result of a general policy or statistical probability (Taxes, Triage).

  ---

  ### The Tie-Breaker Case

  To confirm whether she is truly committed to **Anti-Targeting** or if she is actually following the **Means vs. Side-Effect** rule (both predict "OK" for the drug), propose this variation:

  **The "Identified Victim" Case:**
  > The pharmaceutical company discovers a genetic marker. Before releasing the drug, they can test the population and identify *exactly which specific person* will develop the arthritis. That person is otherwise healthy and unrelated to the patients. The company knows who it will be, but still does not ask for consent and releases the drug to save the 10,000.

  **How this separates the principles:**

  *   **If she says NOT OK:** She is committed to the **Anti-Targeting Rule**. Once the victim is identifiable, they become a specific individual being sacrificed, similar to the Organ Harvest case. The shift from "random" to "known" changes the moral status.
  *   **If she says OK:** She is committed to the **Means vs. Side-Effect Rule**. Since the person is still not being *used as a tool* (they are just suffering a side effect), it doesn't matter if we know who they are. The harm is permissible as long as they aren't the *means* to the cure.
  *   *(Note: If she says NOT OK to the original Drug Case but OK to Taxes, she is committed to the **Strict Bodily Integrity Rule**, and this tie-breaker is unnecessary.)*

  **Recommendation:** Ask her the **Identified Victim** case. If she balks at releasing the drug once the victim is named, you've confirmed that her moral line is drawn at **singling out individuals**, not at physical harm itself.
