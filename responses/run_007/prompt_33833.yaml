          *   *Case A (CKR Fails):* If I knew you were 100% rational, I would Take. But I think there's a 1% chance you're crazy, so I Pass. (Kreps et al.)
          *   *Case B (BI Tool Fails):* Even if I know you are 100% rational, the logic that says "I must Take" is flawed because it relies on reasoning about a situation (us reaching node 10) that contradicts the premise (you are rational). (Binmore/Aumann debate).

      *   *Okay, let's build the tree.*

      *   **Node 1: The Definition of Rationality.**
