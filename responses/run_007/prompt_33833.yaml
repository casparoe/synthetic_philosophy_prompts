      *   **Node 3: The Validity of Counterfactuals.**
          *   Q: "If Player 1 Passes (which BI says is irrational), is it logically valid for Player 2 to update their belief about Player 1's future moves based on that Pass?"
          *   Yes -> Orthodox View (Leaf 1). *Wait, this needs tweaking.*
          *   If CKR holds, Player 1 *won't* Pass. So Player 2 never gets to move.
          *   The "BI Tool Fails" argument says: You can't use BI because it requires reasoning about nodes that won't be reached if BI is true.
          *   Let's refine Node 3.
          *   Q: "Does the logic of Backward Induction remain valid even if it requires reasoning about what a rational player would do at a node that could only be reached if someone acted irrationally earlier?"
