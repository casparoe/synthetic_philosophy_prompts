      *   *Empty Seats:*
          *   What if someone says "CKR Fails" AND "BI Tool is Invalid"?
          *   This is a coherent position (Skeptical about knowledge AND logic), but usually, people pick one battle. It's an "overkill" position. I should flag it.
          *   What if someone says "CKR Holds" BUT "Team Reasoning"? That's contradictory by definition of Team Reasoning (which redefines rationality).

  4.  **Refining the Questions for the Audience:**
      *   Avoid "Common Knowledge" without definition.
