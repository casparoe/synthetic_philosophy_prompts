answer: |-
  # Taxonomy of Reduction and Emergence
  **Seminar Handout: Mapping the Terrain**

  ### **ROOT QUESTION:**
  ### Is there at least one real case where the behavior of a whole isn't derivable *even in principle* from the behavior of its parts plus their arrangement?

  │
  ├─── **NO** (Derivation is possible in principle; the micro-level fixes the macro-level)
  │    │
  │    └─── **BRANCH:** Do the higher-level terms (e.g., "belief," "temperature") refer to *genuine ontological entities*, or are they merely useful fictions?
  │         │
  │         ├─── **FICTIONS** (Higher-level discourse is strictly false or misleading)
  │         │    └─── **LEAF: Eliminative Reductionism** (e.g., Churchland)
  │         │         *Awkward Commitment:* **Common-sense psychology is a false theory comparable to demonology, and most of our self-reports are literally untrue.**
  │         │
  │         └─── **REAL ENTITIES** (Higher-level terms pick out real properties identical to micro-configurations)
  │              └─── **LEAF: Nagel-Style Reductionism** (Classical Unity of Science)
  │                   *Awkward Commitment:* **We must accept brute, unexplained "bridge laws" that connect distinct vocabularies without explaining why the connection holds.**
  │
  │
  └─── **YES** (Derivation is impossible; the macro-level is in some sense independent)
       │
       └─── **BRANCH:** Does this failure of derivability entail the existence of *novel fundamental causal powers* (i.e., does it violate the causal closure of physics)?
            │
            ├─── **YES** (Macro-entities exert causal influence not exhausted by micro-powers)
            │    │
            │    └─── **BRANCH:** Do these novel powers exert *downward causation* on the micro-constituents?
            │         │
            │         ├─── **YES**
            │         │    └─── **LEAF: Strong Emergence** (e.g., C.D. Broad, Alexander)
            │         │         *Awkward Commitment:* **The causal closure of the physical world is false, implying that fundamental physics is incomplete and conservation laws may be locally violable.**
            │         │
            │         └─── ***EMPTY POSITION: Strong Emergence without Downward Causation***
            │              *(Status: Logically possible but metaphysically idle)*
            │              *Why Unheld:* **If a property has novel causal powers but never acts upon the parts that constitute it, it is an "ontological dangler" that violates the principle that to be real is to make a difference.**
            │
            │
            └─── **NO** (Physical causal closure is preserved; macro-powers are a subset of micro-powers)
                 │
                 └─── **BRANCH:** What is the primary *source* of the derivability failure?
                      │
                      ├─── **COMPUTATIONAL** (The system is only predictable by simulation; no analytic shortcut exists)
                      │    └─── **LEAF: Weak Emergence** (e.g., Bedau)
                      │         *Awkward Commitment:* **"Emergence" is not a metaphysical feature of nature but merely a measure of our computational inability to compress the description of a system.**
                      │
                      └─── **REALIZATIONAL** (The same macro-property can be realized by heterogeneous micro-structures)
                           └─── **LEAF: Non-Reductive Physicalism** (e.g., Fodor, Putnam, Kim*)
                                *Awkward Commitment:* **To avoid causal overdetermination, higher-level properties risk being causally impotent "epiphenomena" (The Exclusion Problem).**

  ---

  ### **Instructor Notes on the "Empty" Branch**
  You will notice the flagged position under Strong Emergence: *Novel Powers but No Downward Causation*.
  *   **Logical Coherence:** It is not strictly contradictory. One could posit a property that arises from the whole and affects *other* wholes, but never its own parts.
  *   **Why it's empty:** It is deeply unattractive. If the emergent property cannot act on the parts that sustain it, it is difficult to explain how it persists or how we detect it. It renders the "Strong" emergence empirically indistinguishable from epiphenomenalism, stripping it of the explanatory power defenders seek.

  ### **Instructor Notes on Non-Reductive Physicalism (NRP)**
  *   **Placement:** Note that NRP sits under the "Derivation Impossible" branch. This distinguishes it from Nagelian Reduction. However, it sits under "No Novel Powers," distinguishing it from Strong Emergence.
  *   **Tension:** This is the most crowded spot in the taxonomy. Defenders (like Fodor) want the autonomy of the special sciences without the metaphysical cost of Strong Emergence. Critics (like Kim) argue this position collapses into Eliminativism or Strong Emergence once the *Exclusion Problem* is pressed.

  ### **Instructor Notes on Weak Emergence (Bedau)**
  *   **Placement:** This is often treated as a subset of NRP, but it is distinct because its criterion is *computational incompressibility* rather than *multiple realizability*.
  *   **Distinction:** A system could be multiply realizable (NRP) but analytically solvable (Not Weakly Emergent). A system could be computationally irreducible (Weakly Emergent) but have only one possible micro-realization (Not NRP). This split clarifies why Bedau's view is often preferred in complexity science over traditional philosophical NRP.
