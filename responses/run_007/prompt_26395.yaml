      *(Self-Correction during drafting)*: Make sure to distinguish between *instrumental* success (GPS/airplanes) and *novel predictive* success. The NMA relies heavily on *novel* prediction. The student's example is largely instrumental/application. This is a key weakness. I will incorporate this into the analysis of the readings.

      *(Refining the "Miracle" definition)*: In R1, miracle = surprising coincidence. In R4, miracle = metaphysical absurdity.

      *(Refining the PMI interaction)*: PMI says $S \not\to T$. NMA says $\neg T \to \text{Miracle}$. So $S \to T$. The conflict is on the link between Success and Truth.

