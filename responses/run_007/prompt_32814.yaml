answer: |-
  Here is a mapping of the distinct claims underlying the Mencius-Xunzi debate, arranged from the most definitional (where they may be talking past each other) to the most substantive (where they offer competing visions of human psychology and moral cultivation).

  ### 1. The Definitional Reading (Verbal Dispute)
  *   **Claim:** The term "nature" (*xing*) refers to the characteristics that distinguish humans from animals.
  *   **Mencius:** Yes, "nature" refers to our unique moral potential (the sprouts), not our shared biological urges.
  *   **Xunzi:** No, "nature" refers to raw, spontaneous biological drives (hunger, thirst, desire) which we share with animals.
  *   **Analysis:** On this reading, the dispute is merely verbal. Mencius defines "human nature" as "what makes us morally human," while Xunzi defines it as "what we are born with before learning." They agree on the facts but label them differently.

  ### 2. The Innate Moral Psychology Reading (Empirical Dispute)
  *   **Claim:** Humans are born with innate, specific moral predispositions (e.g., compassion, shame).
  *   **Mencius:** Yes, everyone has the "four sprouts" (e.g., alarm at seeing a child fall into a well) prior to education.
  *   **Xunzi:** No, humans are born with desires only; moral feelings are the result of conscious training and habituation.
  *   **Analysis:** This is a genuine psychological dispute. Mencius argues moral intuition is immediate; Xunzi argues it is always mediated by social conditioning.

  ### 3. The Spontaneous Social Outcome Reading (Sociological Dispute)
  *   **Claim:** If humans follow their spontaneous impulses without restriction, social order will result.
  *   **Mencius:** Yes, provided basic material needs are met, people naturally tend toward cooperation and virtue.
  *   **Xunzi:** No, if people follow their spontaneous impulses, resource scarcity and unlimited desire will inevitably lead to conflict and chaos.
  *   **Analysis:** This is a genuine empirical dispute about human behavior in a state of nature. Mencius is optimistic about spontaneous sociality; Xunzi is Hobbesian.

  ### 4. The Locus of Moral Authority Reading (Epistemological Dispute)
  *   **Claim:** The source of moral motivation and authority is internal to the agent.
  *   **Mencius:** Yes, morality is "seeking the lost heart"; the standards are within us to be discovered.
  *   **Xunzi:** No, morality is "accumulating artifice"; the standards are external (sages/rituals) and must be imposed on us.
  *   **Analysis:** This is a deep philosophical dispute about whether ethics is discovery (realism/internalism) or construction (externalism/imposition).

  ### 5. The Teleology of Cultivation Reading (Metaphysical Dispute)
  *   **Claim:** Becoming virtuous is a process of natural growth versus artificial reshaping.
  *   **Mencius:** Virtue is like growing barley; it unfolds naturally if not obstructed.
  *   **Xunzi:** Virtue is like straightening crooked wood; it requires forceful correction against the grain.
  *   **Analysis:** This is the most substantive disagreement regarding the metaphysics of selfhood. Mencius sees the true self as the moral self; Xunzi sees the true self as the raw self that must be transcended.

