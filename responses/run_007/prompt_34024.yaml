          2.  *Career Fork (Suffering Reduction vs. Beauty Creation):* Incommensurable/Hard Choice. No error either way.
          3.  *Trivial vs. Catastrophic (Headache vs. Life):* Commensurable. Life wins "full stop."
          4.  *Aggregation Puzzle (Millions Moderate Pain vs. 1 Person Tortured):* Non-aggregative. Torture world is worse (rejects simple summing).
