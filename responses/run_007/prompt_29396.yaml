answer: |-
  **Grade: 9/10**

  **General Feedback:**
  This is an excellent answer that demonstrates a sophisticated conceptual understanding of heritability. You have correctly identified the three major fallacies associated with heritability estimates (individual causation, malleability, and group differences). Your writing is clear, and your examples are appropriate. The only reason this is not a perfect score is a technical error in your explanation of how environmental variance affects the heritability ratio, along with a minor imprecision in your definition of narrow-sense heritability.

  **Point-by-Point Breakdown:**

  **(i) Individual's Trait (3/3 points)**
  *   **Credit Earned:** You correctly identified that $h^2$ is a population statistic regarding variance, not a metric of individual causation. Your statement ("partitions variance across individuals, not causes within a single person") is the precise distinction required for full credit.
  *   **Comment:** This is the most common misconception in the field, and you dismantled it perfectly.

  **(ii) Environmental Interventions (3/3 points)**
  *   **Credit Earned:** You correctly noted that high heritability does not imply immutability. The height/nutrition example is the standard, canonical example for this concept and was used effectively.
  *   **Comment:** You successfully decoupled the *origin* of variation (genes) from the *sensitivity* of the trait to environmental change.

  **(iii) Mean Differences Between Groups (3/3 points)**
  *   **Credit Earned:** You correctly stated that within-group heritability does not predict between-group differences. Your explanation regarding the sources of variation being distinct is accurate.
  *   **Comment:** This demonstrates a clear understanding of Lewontin's argument, which is central to this course.

  **Technical Precision & Definitions (-1 point)**
  *   **Error 1 (Variance Ratio Logic):** In your final paragraph, you wrote: *"equal environments leave less environmental variance, so the genetic proportion drops."* **This is mathematically incorrect.**
      *   *Correction:* Heritability is $h^2 = V_G / (V_G + V_E)$. If you equalize environments, $V_E$ decreases. If the denominator ($V_P$) shrinks while the numerator ($V_G$) remains constant, the ratio ($h^2$) **increases**, not drops. Heritability is highest when environmental variance is minimized. A hasty grader might miss this because your overall conclusion (that $h^2$ is population-specific) is correct, but the mechanistic explanation is reversed.
  *   **Error 2 (Narrow-sense Definition):** The question specified **narrow-sense** heritability ($h^2$), which specifically refers to *additive* genetic variance ($V_A$). Your definition ("attributable to genetic differences") is slightly loose and could imply broad-sense heritability ($H^2$, which includes dominance and epistasis). In an upper-level course, distinguishing $V_A$ from total $V_G$ is important.
      *   *Correction:* Define it as the proportion of phenotypic variance attributable to *additive* genetic variance.

  **Summary:**
  You have mastered the conceptual interpretation of heritability, which is the primary learning goal of this module. However, be careful with the quantitative mechanics of variance components; understanding how $V_E$ changes impact the $h^2$ ratio is crucial for your future work in behavioral genetics. Great work overall.
