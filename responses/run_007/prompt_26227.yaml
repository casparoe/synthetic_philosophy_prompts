  ### Logical Space & Flags

  **Unoccupied Combinations:**
  1.  **Accept All Premises:** Accepting mental causation, physical closure, distinctness, the exclusion principle, and no overdetermination is logically incoherent; this combination generates the contradiction itself and has no defenders.
  2.  **Reject Closure + Reject Mental Causation:** Denying that physical events have physical causes while also denying mental events cause physical events leaves physical effects uncaused (or caused by God/occasionalism); this is generally viewed as unattractive or theological rather than philosophical.

  **Inseparable Pair:**
  *   **Counterfactual Dependence vs. Interventionist Response:** These two leaves are difficult to distinguish in plain English because both define causation as "difference-making." One asks "would the effect change if the cause changed?" while the other asks "can we manipulate the cause to change the effect?"—practically identical for students without technical training.

  ### Decision Tree Structure

  1.  **Are mental events exactly the same thing as physical brain events?**
      *   Yes → **Identity Theory**
      *   No → Go to 2
  2.  **Do physical events always have a sufficient physical cause?**
      *   No → Go to 3
      *   Yes → Go to 4
  3.  **Are mental events a separate substance or just new properties of physical stuff?**
      *   Separate Substance → **Interactionist Dualism**
      *   Properties of Physical → **Strong Emergentism**
  4.  **Do mental events actually cause anything, or just seem to?**
      *   Just Seem To → **Epiphenomenalism**
      *   Actually Cause → Go to 5
  5.  **Can one event have two sufficient causes without being overdetermined?**
      *   No (Requires Overdetermination) → Go to 6
      *   Yes (Exclusion Principle False) → Go to 7
  6.  **Is the mental cause a separate backup cause (like two shooters)?**
      *   Yes → **Systematic Overdetermination**
      *   No → (Incoherent)
  7.  **Is the mental event made of the physical event (like a statue is clay)?**
      *   Yes → **Constitution View**
      *   No → Go to 8
  8.  **Is causation about what would happen if things were different?**
      *   Yes (General Counterfactual) → **Counterfactual Dependence**
      *   Yes (Specific Manipulation) → **Interventionist Response**

  ### Leaf Nodes

  1.  **Identity Theory:** You believe mental events are literally identical to physical brain events, so there is only one cause doing the work, not two.
  2.  **Interactionist Dualism:** You believe mental events are separate substances that can cause physical effects even though physical events do not always have sufficient physical causes.
  3.  **Strong Emergentism:** You believe mental events are properties of physical stuff that can cause effects even though physical events do not always have sufficient physical causes.
  4.  **Epiphenomenalism:** You believe mental events exist but are causally inert byproducts that do not actually produce physical effects.
  5.  **Systematic Overdetermination:** You believe mental and physical events are distinct causes that systematically both suffice to produce the same physical effect.
  6.  **Constitution View:** You believe mental events are constituted by physical events, so the mental causes the effect in virtue of the physical without being a second cause.
  7.  **Counterfactual Dependence:** You believe mental events cause physical effects because the effects would not have occurred if the mental events had not occurred.
  8.  **Interventionist Response:** You believe mental events cause physical effects because manipulating the mental events allows us to manipulate the physical effects.
