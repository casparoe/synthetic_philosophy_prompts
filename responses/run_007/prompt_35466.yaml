  2.  **Identify the Concept:**
      *   The description is a textbook definition of **Goodhart's Law**.
      *   *Quote:* "When a measure becomes a target, it ceases to be a good measure." (Often attributed to Marilyn Strathern, but originally Charles Goodhart).
      *   *Alternative:* Campbell's Law (similar, often used in social sciences/education). "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."
      *   *Comparison:* Goodhart's Law is the more common pop-culture/economic term for this exact dynamic. Campbell's Law is more specific to social indicators and corruption/distortion.
      *   *Intentionality:* Goodhart's Law doesn't strictly require malicious intent; it covers systemic distortion whether intentional (gaming) or unintentional (myopic optimization).

  3.  **Drafting the Response:**
      *   *Name:* Goodhart's Law.
