      *   *Word Count Check:* Need to be concise.

  4.  **Refining the Content (Mental Draft):**
      You're describing **Goodhart's Law**. The classic formulation is: "When a measure becomes a target, it ceases to be a good measure." Coined by economist Charles Goodhart, it precisely captures the breakdown of correlation once optimization begins.

      Campbell's Law is similar but focuses more on social indicators and corruption. Goodhart's is the broader economic/systemic term you want.

      Regarding intent: It doesn't require malicious gaming. While "gaming the system" (intentional exploitation) is a common cause, the law also covers unintentional drift. If people naturally focus energy on the measured variable at the expense of unmeasured variables (like writing verbose code to hit line counts), the correlation breaks regardless of intent. The mechanism is *optimization pressure*, not necessarily malice.

      Boundaries: To qualify, the metric must initially correlate with the goal. The failure occurs specifically because the metric was *used* for control or evaluation. If a metric fails without being targeted, that's just a bad metric, not Goodhart's Law.

      So, it's not just "perverse incentives"; it's the specific lifecycle of a metric dying under the weight of its own importance.

