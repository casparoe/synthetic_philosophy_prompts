answer: |-
  This is a profound philosophical trap, and it is excellent that you have encountered it before finishing your book. It is the trap of **Thrasymachus** in Plato's *Republic* (who argues justice is nothing but the advantage of the stronger), and it is the trap of **Legal Positivism** taken to its nihilistic extreme.

  Your reconstruction of the argument is logically tight *if* one accepts a specific definition of truth. However, it is not valid. There is a slide between step (3) and step (4).

  You asked which step to reject and what it costs. I am going to argue that you do not need to reject premises (1), (2), or even (3). You can keep the grim, realistic mechanics of your world. Instead, you must reject the **inference to (4)**.

  Here is where the logic breaks, why it breaks, and how fixing it saves your novel from nihilism and turns it into a tragedy.

  ### The Logical Flaw: The "Pretense" Counter-Argument

  The move from (3) to (4) assumes that because power *mimics* justice to gain legitimacy, justice *is nothing but* that mimicry.

  **The Counter-Argument:**
  If justice were truly nothing more than "what the strong say it is," the strong would have no need to dress their power up as justice. A lion does not pretend to be a sheep to eat the sheep; it simply eats them. If "Might made Right" were ontologically true, tyrants would say, "Obey me because I have the guns," and people would obey because that is the definition of good.

  The fact that the strong *feel compelled* to justify their force in the language of justice proves that **justice exists as an independent standard that power fears.** Power dresses up as justice because it knows it is not justice. It knows it is borrowing authority from a source it does not control.

  Therefore, (4) is false. The fact that justice is *enforced* by power does not mean justice *is* power. It means justice is **hostage** to power.

  ### What Rejecting (4) Costs You

  If you reject (4), you must accept that **Justice is real, but fragile.**

  *   **The Cost:** You lose the comfort of cynicism. You can no longer say, "Everyone is corrupt, it's all the same." You have to admit that there is a difference between the regime and the revolutionaries, even if the revolutionaries fail to live up to it.
  *   **The Benefit:** You gain **Tragedy.**
      *   **Nihilism (Your current path):** The revolutionaries become tyrants because *all* organization is tyranny. There is no failure here, only inevitability. The reader shrugs.
      *   **Tragedy (The corrected path):** The revolutionaries become tyrants because they *betrayed* their own ideals. They looked at the hard reality of (1) and (2) and decided (4) was true to excuse their own corruption. They *could* have done otherwise, but they chose the easier path of force over the harder path of building legitimate justice.

  This makes your characters responsible for their fall. It makes their corruption a moral failure, not a sociological certainty.

  ### Re-evaluating Pascal

  You mentioned you can't get Pascal out of your head. It is worth noting that your reading of Pascal is slightly darker than his intent.

  Pascal was a Jansenist Catholic. He believed in an objective, Divine Justice. When he says "what is strong must be made just," he is not saying "Justice is a lie we tell to make power palatable." He is saying: **"Human beings are too corrupted to agree on Justice on their own, so we need Force to keep the peace while we strive for Justice."**

  For Pascal, Force is a necessary *scaffold*, not the *building*. The tragedy of the human condition is that we often mistake the scaffold for the building.

  If you apply this to your novel:
  *   **The Regime:** Mistakes the scaffold (Force) for the building (Justice).
  *   **The Revolutionaries:** Start by trying to build the building, but as the war drags on, they become obsessed with the scaffold. They start believing Pascal's warning is actually a recipe.

  ### How to Fix the Argument (Without Losing the Grit)

  You said you'd rather keep (1) and (2) than swallow (4). Good. You can. Here is the revised argument that preserves the realism of your world without conceding the nihilism:

  1.  **For a social order to hold, rules must be seen as legitimate.** (Keep)
  2.  **Power accumulates according to its own logic, not merit.** (Keep)
  3.  **Therefore, unjust regimes often mimic the language of justice to survive.** (Modified from your original 3)
  4.  **However, the *need* to mimic proves that justice is a standard external to power.** (New Step)
  5.  **Therefore, a regime can be powerful and stable, yet still be objectively unjust.** (Rejects your original 4)

  ### Narrative Application: The "Hole" in Your Characters' Logic

  This philosophical distinction gives you a specific tool for your character arcs.

  The horror of your novel shouldn't be that "Justice is impossible." The horror should be that **your characters stop believing Justice is possible.**

  At the beginning of the book, your revolutionaries should act as if (4) is false. They should take risks to be just when it would be easier to be strong. They should refuse to execute prisoners, or hold elections in war zones, or protect the innocent at tactical cost.

  The turning point of the novel—the moment they become the regime—is the moment they have a council meeting where a pragmatic leader stands up and articulates *your original argument*.
  *   "We want to be just. But justice without force is helpless (Pascal). We are losing. So we must make what is strong just. We must become the monster to kill the monster."

  If you write that scene, you show the audience exactly where the logic fails. The audience will scream, "No! If you do that, you aren't the good guys anymore!"

  But the characters, seduced by the apparent air-tight logic of your reconstruction, will say, "It doesn't matter what we are. It matters that we win."

  ### Summary

  *   **Which step to reject?** Reject the inference from (3) to (4).
  *   **What is the hole?** The "Argument from Pretense." Tyrants mimic justice because justice has authority *independent* of force.
  *   **What does it cost?** It costs you the excuse that "everyone does it." It forces you to admit your characters *choose* corruption.
  *   **Why do this?** It transforms your book from a cynical statement ("All power corrupts") into a tragic warning ("Power corrupts those who believe justice is impossible").

  Your revolutionaries were idealists. They became tyrants not because idealism is a lie, but because they stopped believing in it when the price got too high. That is a much more devastating story.
