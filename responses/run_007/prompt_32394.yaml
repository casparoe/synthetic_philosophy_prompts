          *   *Verdict:* Partially correct historically, but misleading regarding modern understanding. It *is* statistical, but not violable in a closed system.

      *   *Sentence 2:* "The demon sits at a tiny frictionless door between two chambers of gas and sorts fast molecules to one side and slow molecules to the other without doing any work, so one side heats up and the other cools down: heat flows from cold to hot."
