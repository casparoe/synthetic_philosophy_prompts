answer: |-
  Your intuition is excellent. You have spotted the single most common misconception in popular explanations of Maxwell's Demon. The article you read conflates an early hypothesis (by Leo Szilard) with the modern consensus (established by Rolf Landauer and Charles Bennett).

  Here is a sentence-by-sentence breakdown of what a physicist or philosopher of physics would accept, wince at, or reject, followed by a clarification of the "information is energy" claim.

  ### Sentence 1
  > *"Maxwell's demon showed that the second law of thermodynamics isn't a real law in the way we thought—it's just a statistical regularity that a smart enough being could in principle violate."*

  *   **Verdict:** **Half-Right / Historically Accurate but Physically Misleading.**
  *   **The Nuance:** It is true that Maxwell originally proposed the thought experiment (in 1867) to argue that the Second Law is statistical, not absolute like Newton's laws. He believed a being *could* violate it.
  *   **The Wince:** Modern physics disagrees with the conclusion that it can be violated. The modern consensus is that when you account for the thermodynamics of the demon itself, the Second Law holds firm. The demon does not violate the law; it elucidates the connection between thermodynamics and information. Saying it "could in principle violate" suggests the law is breakable, whereas today we say the law is robust *because* it includes information processing.

  ### Sentence 2
  > *"The demon sits at a tiny frictionless door between two chambers of gas and sorts fast molecules to one side and slow molecules to the other without doing any work, so one side heats up and the other cools down: heat flows from cold to hot."*

  *   **Verdict:** **Accept.**
  *   **The Nuance:** This is an accurate description of the thought experiment's setup. The phrase "without doing any work" is the crux of the paradox. In the context of the *idealized* thought experiment, this is the premise that needs to be challenged by the resolution.

  ### Sentence 3
  > *"Modern physics rescued the second law by showing that the demon's measurements cost energy."*

  *   **Verdict:** **Wrong.** (This is the specific error you suspected).
  *   **The Nuance:** This reflects Leo Szilard's 1929 analysis. Szilard hypothesized that the act of *measurement* must generate entropy to save the Second Law. However, in 1982, Charles Bennett (building on Rolf Landauer's 1961 work) proved that **measurement can be performed reversibly.**
  *   **The Physics:** You can measure a molecule's speed and record it without dissipating heat, provided you don't erase previous data. The measurement itself does not have to cost energy. The "rescue" of the Second Law comes later in the process.

  ### Sentence 4
  > *"Every time it measures a molecule's speed it has to pay at least kT ln 2 of energy per bit, and that payment heats the gas by more than the sorting cools it, so the law survives."*

  *   **Verdict:** **Wrong Mechanism.**
  *   **The Nuance:** The number ($kT \ln 2$) is correct; this is **Landauer's Principle**. However, Landauer's Principle applies to the **erasure of information**, not the acquisition (measurement) of it.
  *   **The Physics:** The demon can measure and store data for free (thermodynamically speaking). But the demon has a finite memory. To continue operating as a perpetual engine, it must eventually clear its memory to make room for new measurements. It is this **resetting/erasing** of the memory that is logically irreversible and *must* dissipate at least $kT \ln 2$ of heat per bit into the environment. The article attributes the cost to the wrong step in the cycle.

  ### Sentence 5
  > *"But it only survives because information is a form of energy."*

  *   **Verdict:** **Philosophical Wince / Imprecise.**
  *   **The Nuance:** Physicists generally dislike the phrase "information is a form of energy." It is a catchy pop-sci slogan, but it is category error.
  *   **The Physics:** Information is not energy; information is related to **entropy**. Landauer's Principle establishes a conversion rate between information and *heat* (energy), mediated by temperature. A better phrase is "Information is physical." Information requires a physical substrate, and manipulating that substrate has thermodynamic consequences. Saying information *is* energy is like saying "time is money"—it describes a relationship/exchange rate, not an identity.

  ---

  ### Deep Dive: Why Your Instinct Was Right

  You mentioned you heard that "measurement doesn't have to cost energy and the real issue is erasing the demon's memory." **You are correct.**

  Here is the standard modern resolution (the Bennett-Landauer resolution):

  1.  **Measurement:** The demon measures a molecule. It writes a "1" (fast) or "0" (slow) to its memory tape. This can be done reversibly. No heat is generated.
  2.  **Sorting:** The demon opens the door based on the memory. This uses the information to extract work (or create a temperature gradient).
  3.  **The Trap:** The demon's memory is now full. It knows the state of the molecules, which means its own entropy has decreased (it is in a specific state rather than a random one). To complete the cycle and return to its initial state (so it can act as a cyclic engine), it must reset its memory to blank.
  4.  **Erasure:** According to Landauer's Principle, logically irreversible operations (like resetting a bit to 0 regardless of whether it was 1 or 0) *must* dissipate heat.
  5.  **Result:** The heat generated by erasing the memory is exactly equal to (or greater than) the work extracted by sorting the molecules. The Second Law is saved.

  ### Does "Information is a Form of Energy" Follow?

  No, that upshot does not follow from the correct physics.

  If the article's premise (measurement costs energy) were true, one might argue that information acquisition is an energetic process. But since the actual cost is in **erasure**, the relationship is between information and **entropy**.

  The correct takeaway is:
  *   **Information is Negentropy:** Having information about a system reduces your uncertainty about it, which is thermodynamically equivalent to lowering entropy.
  *   **The Exchange Rate:** You can trade information for work (as the demon does), but you must pay for it in entropy elsewhere (during erasure).
  *   **Physicality:** Information cannot exist without a physical medium (a brain, a tape, a hard drive), and the laws of thermodynamics apply to that medium.

  ### Summary for Your Mental Model

  *   **Trust:** The description of the demon's action (sorting fast/slow).
  *   **Discard:** The claim that measurement costs energy.
  *   **Replace:** Replace "measurement costs energy" with "erasing memory dissipates heat."
  *   **Refine:** Replace "information is energy" with "information is physical and linked to entropy."

  The article you read is a classic example of "pop science fossilization." It taught the 1950s understanding of the problem (Szilard's view) as if it were the modern solution. Your skepticism was well-founded.
