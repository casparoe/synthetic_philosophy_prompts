prompt: |-
  I was reading one of those "physics for the rest of us" articles and it summarized Maxwell's demon like this: "Maxwell's demon showed that the second law of thermodynamics isn't a real law in the way we thought—it's just a statistical regularity that a smart enough being could in principle violate. The demon sits at a tiny frictionless door between two chambers of gas and sorts fast molecules to one side and slow molecules to the other without doing any work, so one side heats up and the other cools down: heat flows from cold to hot. Modern physics rescued the second law by showing that the demon's measurements cost energy. Every time it measures a molecule's speed it has to pay at least kT ln 2 of energy per bit, and that payment heats the gas by more than the sorting cools it, so the law survives. But it only survives because information is a form of energy." I have a feeling a couple of these sentances are subtly off—I'd heard somewhere that the measurement itself doesn't have to cost energy and the real issue is erasing the demon's memory, but the article was pretty confident and I don't know enough to say which parts to trust. Go sentence by sentence and tell me which parts a physicist or philosopher of physics would accept, which parts they'd wince at, and which are just wrong, and whether the "information is a form of energy" upshot actually follows from anything correct in the summary.
