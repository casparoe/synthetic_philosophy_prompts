      *   *Sentence 3:* "Modern physics rescued the second law by showing that the demon's measurements cost energy."
          *   *Analysis:* **Major Red Flag.** This is the specific point the user questioned. Szilard argued measurement costs energy. But Bennett (1982) showed measurement can be reversible (cost-free). The cost comes from *erasure*.
          *   *Verdict:* Technically incorrect/outdated. This is the "Szilard engine" view, superseded by Landauer's Principle/Bennett's resolution.

      *   *Sentence 4:* "Every time it measures a molecule's speed it has to pay at least kT ln 2 of energy per bit, and that payment heats the gas by more than the sorting cools it, so the law survives."
