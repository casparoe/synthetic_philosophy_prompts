answer: |-
  1. If every triangular object in the universe were instantly destroyed, but minds remained, what would happen to the property of triangularity?
  A) It would cease to exist entirely.
  B) It would continue to exist independently of objects and minds.
  C) It would continue to exist as a concept within those minds.

  2. What fundamentally explains why two specific red apples are similar in color?
  A) They both participate in or instantiate the same mind-independent universal entity.
  B) They each possess their own distinct particular property that resembles the other.
  C) There is no property entity; the objects simply resemble each other brutely.
  D) They are similar only because our minds classify them together.

  3. Where does the universal 'Justice' exist when no just actions are being performed?
  A) Nowhere; universals exist only in their instances.
  B) In a transcendent realm separate from space and time.
  C) It does not exist; 'Justice' is merely a label or concept.

  4. If no intelligent beings existed to categorize things, would the distinction between 'gold' and 'silver' still be real?
  A) Yes, the distinction exists in nature independently of us.
  B) No, kinds are constructs of human understanding.
  C) Yes, because the universal 'Goldness' exists even without instances.

  5. Consider the exact mass of two perfectly identical iron spheres. Are these masses numerically identical?
  A) Yes, they are one and the same universal entity present in both.
  B) No, they are two distinct particular property-instances (tropes).
  C) No, there are no property-instances; there are just the spheres resembling each other.
  D) The identity depends on how our minds categorize the measurement.

  ***

  **Scoring Key**

  Tally your answers to determine your metaphysical commitment. Most consistent respondents will cluster into one of the following five positions:

  *   **Platonic Realism:** Mostly **B** on Q1, **A** on Q2, **B** on Q3, **C** on Q4, **A** on Q5.
      *   *Commitment:* Universals exist independently of both particulars and minds.
  *   **Aristotelian Realism:** Mostly **A** on Q1, **A** on Q2, **A** on Q3, **A** on Q4, **A** on Q5.
      *   *Commitment:* Universals exist, but only insofar as they are instantiated in particulars.
  *   **Conceptualism:** Mostly **C** on Q1, **D** on Q2, **C** on Q3, **B** on Q4, **D** on Q5.
      *   *Commitment:* Universals exist, but only as mental constructs or classifications.
  *   **Trope Theory:** Mostly **A** on Q1, **B** on Q2, **C** on Q3, **A** on Q4, **B** on Q5.
      *   *Commitment:* Only particular property-instances (tropes) exist; similarity is explained by resemblance between tropes.
  *   **Resemblance Nominalism:** Mostly **A** on Q1, **C** on Q2, **C** on Q3, **A** on Q4, **C** on Q5.
      *   *Commitment:* Only particulars exist; there are no properties (universal or particular), only brute resemblance between objects.

  **Incoherent Combinations**
  If your answers mix these patterns significantly, you may hold an undefended position. Common impossible combinations include:
  *   **Q1(B) + Q5(C):** Claiming universals exist independently of objects (Platonic) while denying property entities exist (Nominalism) is contradictory. If universals exist independently, there *are* property entities.
  *   **Q1(A) + Q3(B):** Claiming properties cease when objects are destroyed (Aristotelian/Nominalist) while claiming they exist in a transcendent realm (Platonic) is logically inconsistent.
  *   **Q2(A) + Q4(B):** Claiming objects share a mind-independent universal (Realism) while claiming kinds are mind-dependent constructs (Conceptualism) creates a tension regarding the status of the universal.

  **Identical Positions**
  None of the five positions above yield identical answers to all five questions in this specific diagnostic. However, **Trope Theory** and **Resemblance Nominalism** are the closest neighbors; both deny universals (Q1-A) and affirm mind-independence (Q4-A). They are split only by Q2 and Q5, which probe whether properties exist as particular entities (tropes) or not at all (nominalism). If a respondent struggles to distinguish between "distinct property-instances" and "objects simply resembling," they may hover between these two views.
