      *   Confidence + Least sure point.

      *Self-Correction on Move 1:* Is it "Clearly Mistaken" or "Defensible but Overstated"? Arrow's theorem *does* imply that any ranked system producing a social ordering has flaws. RCV produces a winner, but implicitly relies on rankings. Many experts summarize Arrow as "no perfect voting system." So "Defensible but Overstated" is fairer than "Clearly Mistaken," which implies she's talking nonsense. She's talking common shorthand, just imprecise.
