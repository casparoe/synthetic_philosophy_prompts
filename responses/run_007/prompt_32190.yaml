answer: |-
  This is an exceptionally sharp diagnosis of the state of Just War Theory (JWT). You have correctly identified that the debate has reached a point of diminishing returns, where interlocutors often reaffirm their axioms rather than bridging the gap.

  Your hypothesis—that this is a clash between an **institutional perspective** (Walzer) and an **individual perspective** (McMahan)—is largely correct, but it is the surface manifestation of a deeper, multi-layered disagreement. It is not merely one of the options you listed (empirical, verbal, legal/moral); it is a **compound disagreement** that involves all of them simultaneously.

  Here is a diagnosis of what kind of disagreement this really is, followed by what actual progress would look like.

  ### I. The Diagnosis: A Four-Layered Clash

  The stalemate persists because the Traditionalists and Revisionists are often answering different questions using the same vocabulary. The disagreement operates on four distinct levels:

  #### 1. The Methodological Layer: Reductionism vs. Exceptionalism
  This is the deepest philosophical rift.
  *   **Revisionists (McMahan)** are **Reductionists**. They argue that the morality of killing in war is continuous with ordinary morality. If you can't kill a policeman in peacetime because he is acting in good faith, you can't kill a soldier in war under similar conditions. For them, war does not create new moral facts; it only changes the empirical context.
  *   **Traditionalists (Walzer)** are **Exceptionalists**. They argue that war is a distinct moral sphere with its own conventions. The "state of war" creates a unique relationship between combatants that suspends ordinary moral rules.
  *   **The Impasse:** You cannot argue for Reductionism without assuming ordinary morality applies, and you cannot argue for Exceptionalism without assuming war creates a unique moral topology. If you start from opposite meta-ethical commitments, you will talk past each other.

  #### 2. The Semantic Layer: Objective vs. Subjective Permissibility
  You suspected a verbal dispute about "permissible." You are right.
  *   **Revisionists** generally mean **Objective Permissibility**: "Is this act actually justified by the facts of the matter?" (i.e., Is the cause actually just?)
  *   **Traditionalists** often mean **Subjective/Excusable Permissibility**: "Is this agent blameworthy given their epistemic limitations and role obligations?"
  *   **The Impasse:** McMahan says the unjust combatant is *objectively* doing wrong. Walzer says the unjust combatant is *subjectively* blameless (and thus "permissible" to fight). When Walzer says "moral equality," he often means "equal immunity from prosecution/blame." When McMahan says "moral inequality," he means "unequal liability to defensive harm." They are using the same words to track different normative statuses.

  #### 3. The Epistemic Layer: The Fog of War
  This is the hidden empirical question you identified.
  *   **The Revisionist Burden:** If liability tracks the justice of the cause, soldiers must be able to *know* the justice of the cause. Revisionists often gloss over how difficult *jus ad bellum* judgments are for a private on the ground.
  *   **The Traditionalist Defense:** Walzerian MEC is often defended as a **heuristic**. Even if it is metaphysically false that soldiers are equal, it might be epistemically necessary to treat them as such because soldiers cannot reliably distinguish just from unjust wars.
  *   **The Impasse:** Revisionists treat epistemic uncertainty as an excuse (mitigating blame), whereas Traditionalists treat it as a constitutive rule (defining the role).

  #### 4. The Functional Layer: Morality vs. Law/Convention
  You noted the confusion between morality and law. This is perhaps the most productive distinction.
  *   **Walzer** is often describing the **ethos of the profession** and the **laws of war (LOAC)**. The LOAC *requires* MEC for pragmatic reasons (to encourage surrender, limit brutality, maintain reciprocity).
  *   **McMahan** is doing **ideal moral theory**. He is interested in the truth of the matter, not necessarily the rules that generals should hand out in briefing books.
  *   **The Impasse:** Walzer is often right about *regulation*, while McMahan is often right about *responsibility*. When they debate, Walzer sounds like a pragmatist and McMahan sounds like a purist, and neither admits the other is governing a different domain.

  ---

  ### II. What Would Count as Progress?

  If the disagreement is this layered, "resolving" it by one side winning is unlikely. Progress will not come from proving MEC true or false, but from **disaggregating the questions**. Here is what productive work looks like now:

  #### 1. The "Two-Tier" Approach (Division of Moral Labor)
  Progress lies in accepting that McMahan is right about **deep morality** but Walzer is right about **institutional rules**.
  *   **The Project:** Develop a theory that acknowledges unjust combatants are morally liable to be killed (Revisionist truth) but argues that the *rules of engagement* should still treat them as equals (Traditionalist pragmatism).
  *   **Why it helps:** It stops the debate over whether MEC is "true" and asks instead: "Under what conditions should we enforce a rule we know to be morally imperfect?" This shifts the debate to political philosophy and institutional design. (See work by Seth Lazar or Henry Shue on this).

  #### 2. Epistemic Thresholds and "Invincible Ignorance"
  Instead of arguing about liability in the abstract, progress requires a granular analysis of **epistemic access**.
  *   **The Project:** Determine exactly *when* a soldier becomes culpable for fighting an unjust war. Is it at the invasion? After a war crimes report? When the UN condemns it?
  *   **Why it helps:** It moves the debate from "Are they equal?" (No) to "When does the inequality become action-guiding?" This bridges the empirical gap. If most soldiers are invincibly ignorant, MEC holds practically even if it fails theoretically.

  #### 3. Empirical Ethics (Psychology and Behavior)
  This is the most underutilized avenue. The debate is currently armchair philosophy.
  *   **The Project:** Empirical study of combatants. Does believing in MEC reduce atrocities? Does believing in Revisionist liability make soldiers more hesitant to fight (deterrence) or more prone to radicalization (if they feel criminalized)?
  *   **Why it helps:** If believing in MEC actually saves lives by facilitating surrender and reciprocity, then Walzer wins on consequentialist grounds, even if McMahan wins on deontological grounds. This turns a metaphysical stalemate into a testable hypothesis.

  #### 4. Refining "Liability"
  Revisionists rely heavily on the concept of **liability to defensive harm**. This concept is doing too much heavy lifting.
  *   **The Project:** Nuance the concept of liability. Perhaps unjust combatants are liable to *some* harm but not *lethal* harm? Perhaps liability is scalar rather than binary?
  *   **Why it helps:** It allows for a middle ground where unjust combatants are not "morally equal" but are also not "murderers" in the full sense. It creates space for a gradient of moral status that matches the gradient of knowledge and responsibility.

  ### Summary
  Your hypothesis is correct: the debate is stalled because it conflates **individual morality** with **institutional rules**.

  However, it is not a hopeless question-begging loop. Progress is possible if philosophers stop trying to prove MEC is universally "true" or "false" and start asking: **Is MEC a truth claim about the universe, or a regulatory norm for institutions?**

  If the field accepts that MEC is **false as morality** (McMahan) but **necessary as law** (Walzer), the debate dissolves into a more interesting question: *How do we maintain a legal fiction of equality without eroding the moral truth of responsibility?* That is a problem worth solving.
