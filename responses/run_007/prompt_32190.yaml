      *   *Is it empirical?* Yes, specifically regarding *epistemic access*. If soldiers can't know the justice of the cause, MEC might be a necessary heuristic.
      *   *Is it Law vs. Morality?* This is crucial. Walzer often conflates *jus in bello* (law/rules) with moral permissibility. Revisionists strictly separate them.

      *Synthesis:* It's a **multi-layered disagreement**. It's not *just* one of the user's options, but a combination. It's a clash between **Reductionism** (war morality = ordinary morality) vs. **Exceptionalism** (war has unique rules), complicated by **Epistemic Constraints** and the **Law/Morality distinction**.

  4.  **Developing the Diagnosis (The "What kind of disagreement is this?" part):**
