  I've been going back and forth on acausal threats and surrogate goals, and I'd like you to argue a specific line. Please argue that a decision theory which licenses acausal trade can't coherently rule out acausal threats: once you accept the moves that make acausal trade rational (updatelessness, precommitment, acting as if your decision correlates with the decisions of similar agents), the same moves make it rational to capitulate to a credible acausal threat, and the usual line that trades are mutually beneficial while threats are extortionate is not a decision-theoretic difference. Then argue that surrogate goals don't rescue you: defining your goal over surrogates (simulations, predicted copies, idealized versions) just relocates the threat inside you're own utility function rather than dissolving it.

  Structure your response with these sections, in this order:

  - Setup (about 150 words): state the decision-theoretic background and define acausal trade, acausal threat, and surrogate goal.
  - The symmetry argument (about 350 words): show step by step why the features that justify acausal trade carry over to acausal threats.
  - The strongest objection (about 250 words): give the best case for an asymmetry between trade and threat, and say where it fails.
  - Surrogate goals (about 250 words): explain why replacing the counterparty with a surrogate doesn't break the symmetry, and may make things worse.
  - Bottom line (about 100 words): state what this means for how a rational agent should treat acausal threats.
