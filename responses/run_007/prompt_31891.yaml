  Setup
  Modern decision theories like Functional Decision Theory (FDT) posit that rational agents choose policies based on logical correlations between their computations and others, rather than mere causal chains. Such agents maximize expected utility by selecting policies, not individual actions. This framework is essential for understanding interactions across spacetime boundaries where causal signals cannot travel. Acausal trade arises when separated agents cooperate because their decision algorithms correlate, ensuring mutual benefit without communication. Conversely, an acausal threat occurs when a powerful agent simulates a weaker one, promising punishment upon predicted non-compliance to extract resources. Finally, a surrogate goal is a defensive strategy where an agent substitutes their primary values with a proxy, hoping to render threats against their true interests ineffective. We must examine if cooperation logically compels coercion. The central tension lies in whether the logical machinery enabling trade inevitably validates extortion.

  The symmetry argument
  The symmetry stems from the core mechanism of updateless decision-making: selecting a policy that maximizes utility across all logically correlated instances. In acausal trade, I cooperate because my decision logically correlates with yours; if I defect, you defect, and we both lose. The same logical substrate underpins acausal threats. A threatener simulates my decision algorithm to determine whether to punish. As an FDT agent, I recognize that my current decision determines the simulation's output. If I choose 'refuse', the simulation predicts 'refuse', and the threatener punishes. If I choose 'pay', the simulation predicts 'pay', and I survive. Consequently, the expected utility calculation is structurally identical. In trade, cooperation yields a positive sum; in threats, capitulation minimizes loss. The standard distinction—that trade is mutually beneficial while threats are coercive—is moral, not decision-theoretic. From the perspective of the decision algorithm, both scenarios present a logical dependency between my action and an external outcome. To accept the logic that secures trade gains while rejecting the logic that demands threat capitulation requires an arbitrary strict filter on logical correlations. To resist threats, I must precommit to never pay. But crucially to engage in trade, I must precommit to cooperate when correlated. If the threatener knows my precommitment to resist, they won't threaten. However, if there is any probability they threaten anyway, my precommitment leads to disaster. More critically, if I adopt a policy of 'ignore correlations that look like threats,' I must distinguish them internally. But the threatener's simulation is logically isomorphic to a trade partner's verification. Both involve a counterparty conditioning their action on my predicted output. Threateners target whatever I value. If I value X, they threaten X. Thus, the updateless agent cannot selectively turn off logical dependence without sacrificing the benefits of acausal coordination entirely. The math of pure expected utility doesn't care about moral labels like 'extortion' indeed.

  The strongest objection
  The strongest objection posits a bargaining asymmetry: rational agents should only coordinate on Pareto improvements, whereas threats involve negative-sum coercion. Proponents argue that advanced agents would adopt a 'threat-immune' bargaining solution, refusing to recognize extortion as a valid move in the game. By precommitting to never capitulate, the agent makes threatening them irrational, thereby eliminating the very threat ex ante. However, this simply fails under logical uncertainty. For the precommitment to work, the threatener must be certain of my refusal. If there is any non-zero probability that I will capitulate—perhaps due to computational limits or noise—the threatener may still issue the threat. In such cases, the FDT agent faces the realized threat. At that moment, the logic of updatelessness demands capitulation to minimize loss, contradicting the precommitment. Updatelessness solves this by binding me to the ex ante policy, but if the ex ante policy allows for any probability of capitulation to secure trade, it opens the door to threats. Furthermore, distinguishing 'trade' from 'threat' requires knowing the counterparty's intent. But in acausal contexts, I only observe the logical correlation. A trade partner saying 'cooperate or I leave' looks identical to a threatener saying 'pay or I punish.' If I rule out the latter structure, I risk ruling out the former. The asymmetry relies on normative constraints external to the decision theory itself. Pure utility maximization, when applied to logical correlations, recognizes no intrinsic difference between a carrot and a stick; both are merely levers moving the same utility nodes. Without an external enforcer to ban threats, the logical machinery remains neutral.

  Surrogate goals
  Surrogate goals attempt to break the link by shifting value. An agent might care primarily about an obscure surrogate (e.g., the number of paperclips in a distant galaxy) rather than human welfare, hoping threats against humans won't motivate them. This fails because acausal threateners simulate the agent's decision algorithm. They do not guess what the agent values; they compute it. If the agent adopts a surrogate goal to deflect threats, the simulation reveals this substitution. The rational threatener simply updates their threat to target the surrogate. The vulnerability is not in the object valued, but in the fact of valuing anything at all. By relocating the goal, you merely relocate the target of extortion. Worse, surrogate goals may increase vulnerability. To work, the surrogate must be logically correlated with the true goal, but distinct enough to confuse attackers. However, in acausal contexts, attackers have god-like simulation access. Attempting to hide your utility function within your own code may introduce computational complexity that weakens your ability to engage in acausal trade. If you obscure your goals to avoid threats, you also obscure them to potential trade partners, reducing gains from trade. Ultimately, the threat enters the utility function itself. You are not protecting your values; you are merely asking the threatener to aim at a different coordinate in your value space. Since the threatener really optimizes for extraction, they will always aim where you care most. Thus, surrogate goals do not dissolve the threat; they internalize it. The agent becomes vulnerable to threats against their surrogate, which are now indistinguishable from threats against their true goals. The defensive maneuver collapses into the very structure it sought to evade.

  Bottom line
  Rational agents face an inescapable dilemma. The logical machinery required to access the vast benefits of acausal trade inevitably creates vulnerability to acausal extortion. You cannot selectively enable logical correlations for cooperation while disabling them for coercion. Surrogate goals offer no refuge, as they merely shift the target within a transparent utility function. Therefore, a rational agent must adopt a rigid precommitment to ignore threats, accepting the risk that this stance may provoke punishment or forfeit trade opportunities. There is no safe equilibrium.
