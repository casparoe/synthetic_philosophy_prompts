prompt: |-
  hey, i'm a longtime lurker on lesswrong and the rationalist diaspora blogs — you know the scene. i teach an upper-level undergrad seminar called "Philosophy Through Satire" and i'm putting together the final exam.

  we spent two weeks on hofstadter's "a person paper on purity in language" — the one from Metamagical Themas where he does the full gender-role swap, 'person' for 'man,' 'woperson' for waitress, 'herstory' for history, and by the end you viscerally feel what it's like when your language's default isn't you. the students got really into it, which is rare for a philosophy class, so i want to reward the ones who actually *got* it rather than the ones who just memorized the summary slide.

  here's my problem: i want a question that can't be answered by just regurgitating the piece. the bright-ish students who can say "language shapes thought" and gesture at sapir-whorf should not automatically get an A. the whole mechanism of the person paper is that it works via emotional jiu-jitsu rather than by laying out premises and conclusions — the satire *shows* you something that an analytic argument would have to *argue for*, and that difference is itself philosophically interesting. i want a question that gets at that.

  so i want you to act as an expert philosopher who also understands how rhetoric and cognition actually work (not just "arguments all the way down" boringness — steelmanning is great but sometimes the medium is the message). think carefully, maybe do a bit of brainstorming on what makes satirical defamiliarization genuinely different from standard analytic-feminist argumentation on gendered language, what each can do that the other can't, and whether the distinction maps onto anything in epistemology. then write me:

  1. the exam question itself (worth 25 marks, about 90 minutes of writing time, in a 3-hour exam with two questions total)
  2. a model answer (~800 words)
  3. a marking scheme that clearly separates A / B / C answers, naming the specific conceptual moves a student must make to get each grade. don't just say "A is clearer and more detailed" — give me the actual *ideas* that distinguish the levels. for a C: what's the surface-level reading they need to at least get right? for a B: what's the real insight most students miss? for an A: what's the move that shows they've dissolved the question rather than just answering it?

  bonus points if the question structure itself makes students do the comparison between satirical and argumentative modes rather than me having to spoon-feed them "compare and contrast." i want the question to be a bit of a puzzle — they should have to figure out what's being asked before they can answer it.

  oh and dont worry if the prompt feels a little rough around the edges — this isnt for publication, just for my actual flesh-and-blood students. a typo or two is fine.
