      *   **Class Size/Time:** ~18 students, 80 minutes.
      *   **Topic:** Duhem-Quine Thesis, Underdetermination of Theory by Evidence.
      *   **Goal:** Make them *feel* the problem before reading. Avoid "cheap skeptical trick" perception.
      *   **Activity Structure:**
          *   Small groups.
          *   Same dataset (graph/coordinates).
          *   Task: Find the "best" theory (function/curve).
          *   Twist 1: Multiple curves fit equally well (initially).
          *   Twist 2: New data rules some out, but *not all* (underdetermination persists).
          *   Debrief: Connect to extra-empirical criteria (simplicity, etc.) and philosophical concepts.
      *   **Requirements:** Definite design (no menus), specific dataset, timing, script/facilitation notes, troubleshooting (what goes wrong), and limitations of the analogy.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Duhem:* You can't test a hypothesis in isolation; you test it with auxiliary assumptions. (This is slightly harder to capture in a pure curve-fitting exercise, but the "background assumptions" part fits).
      *   *Quine/Underdetermination:* For any finite set of data, there are infinite hypotheses compatible with it. Evidence alone doesn't dictate theory choice.
      *   *Key Insight:* Students need to realize they are bringing *their own* criteria (Occam's Razor, smoothness, physical plausibility) to the table without realizing it.

