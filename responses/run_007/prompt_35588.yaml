  ### Part 2: Specific Query on (3), (5), and (6)

  > *I am especially interested in whether (3) and (6) can be sustained without tacitly relying on the very idea of basic desert that (5) rejects.*

  **Verdict:** They can be sustained, but not in their current phrasing.

  1.  **Regarding (3):** To sustain "fittingness" without "basic desert," you must shift from a **Desert Model** to a **Reasons-Responsiveness** or **Relationship Model**.
      *   *Current Phrasing:* "The character of the act itself makes resentment appropriate." (Sounds like Desert).
      *   *Required Revision:* "The agent's quality of will (Commitment 2) makes resentment appropriate as a demand for moral recognition, not as a metaphysical payback."
      *   *Risk:* If you do not make this distinction explicit, (3) will be read as smuggling in the very desert (5) rejects.

  2.  **Regarding (6):** To sustain proportionality without desert, you must treat proportionality as a **side-constraint** rather than a **goal**.
      *   *Current Phrasing:* "A system that punished shoplifting more harshly... would be unjust."
      *   *Required Revision:* You must argue that disproportionate punishment violates the offender's **rights** or treats them merely as a **means** (Kantian constraint), rather than claiming they "deserve" a specific amount of pain.
      *   *Risk:* If you ground (6) in "unfairness," you must explain what "fairness" means without desert. (e.g., Fairness as equal treatment under rules, not fairness as getting what one metaphysically deserves).

