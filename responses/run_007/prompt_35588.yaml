  ### Part 3: The Least Costly Single Revision

  **The Revision:** **Modify Commitment (1).**

  **Current (1):** "Ultimate moral responsibility is therefore impossible." (Implies the Basic Argument defeats the normativity of responsibility practices).

  **Proposed Revision:** "While the Basic Argument shows that *Ultimate* Moral Responsibility (in the *causa sui* sense) is impossible, this does not preclude the possibility of *Compatibilist* Moral Responsibility, which is sufficient to ground reactive attitudes and punishment."

  **Why this is the least costly:**
  1.  **Aligns with (2):** You cite Frankfurt and Watson. Their entire philosophical project is to argue that the regress identified by Galen Strawson is **irrelevant** to moral responsibility. By keeping (1) as a "defeater," you are undermining the authors you cite in (2). Revising (1) brings your metaphysics in line with your moral psychology.
  2.  **Saves (3) and (6):** If you keep (1) as a hard skeptic (Galen Strawson style), you *must* abandon the normative "fittingness" in (3) and the "unjust" claim in (6), reducing them to pragmatic tools. This would require rewriting your entire moral theory. Revising (1) allows you to keep the normative force of (3) and (6).
  3.  **Preserves (5):** You can still maintain that *Basic* Desert (Libertarian desert requiring UMR) is unintelligible. You are simply arguing that we don't need *Basic* Desert for responsibility; we only need *Compatibilist* Desert (based on reasons-responsiveness or identification).

  **The Cost:**
  *   You must concede that Galen Strawson's Basic Argument, while sound regarding *Ultimate* Responsibility, is **question-begging** regarding *ordinary* Moral Responsibility. You have to argue that Galen Strawson sets the bar for responsibility impossibly high.
  *   You must explicitly distinguish between "Ultimate Desert" (rejected) and "Compatibilist Desert" (accepted). This requires careful terminological work in the chapter to ensure you aren't accused of equivocation.

  ### Summary Recommendation for the Chapter

  1.  **Reframe (1):** Present the Basic Argument as establishing the impossibility of *Libertarian/Ultimate* freedom, but deny that this is the kind of freedom required for the practices in (3), (4), and (6).
  2.  **Clarify (3):** Define "fittingness" in terms of **moral address** or **quality of will** (Frankfurt/Watson) rather than metaphysical payback.
  3.  **Ground (6):** Justify proportionality as a **rights-based constraint** on consequentialist aims, ensuring it doesn't silently rely on the "Basic Desert" rejected in (5).

  This path allows you to remain a **Compatibilist** (2) who rejects **Libertarian Metaphysics** (1 & 5) while preserving the **Normativity of Blame** (3) and **Justice** (6). Keeping (1) as currently written forces you into Hard Incompatibilism, which would require dismantling (2), (3), and (6).
