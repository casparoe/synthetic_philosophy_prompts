answer: |-
  # Game Title: The Peacock's Burden
  **Time:** 75 Minutes
  **Participants:** 18 Students (12 Signalers, 6 Receivers)
  **Goal:** Experience how costly displays filter partners without using theoretical jargon until the end.

  ---

  ## 1. Roles and Rules

  **The Setup:**
  Divide the class into two groups.
  *   **Signalers (12 students):** Sit at desks/tables arranged in a "marketplace" (two rows of six).
  *   **Receivers (6 students):** Stand/Walk. They are the "selectors."

  **Hidden Quality:**
  *   Each Signaler receives a sealed envelope. Inside is a card: **Type A** (High Quality) or **Type B** (Low Quality).
  *   There are exactly 6 Type A and 6 Type B envelopes distributed randomly.
  *   **Secret:** Signalers know their own type. Receivers do not. Signalers cannot show their envelope to Receivers.

  **The Interaction (Per Round):**
  1.  **Signal:** Signalers choose a **Display Level** (0, 1, 2, or 3). They write this number on a index card and place it face up on their desk.
  2.  **Cost:** To support this display, Signalers must pay "Vitality Chips" (paper squares) into a central "Burn Pile" on their desk. The cost per level depends on the Round Condition (see Section 3).
  3.  **Selection:** Receivers walk the marketplace. They see the Display Level and the Chips in the Burn Pile. They choose **one** Signaler to partner with. They place a "Contract Token" on that Signaler's desk.
  4.  **Resolution:** Each Receiver can only sign one contract. If multiple Receivers choose one Signaler, the Signaler picks one ( Receivers get nothing). If a Signaler gets no contract, they get nothing.
  5.  **Scoring:** Points are recorded secretly on a score sheet.

  **Constraint:** No talking between Signalers and Receivers about Type. Signalers cannot reveal their envelope.

  ---

  ## 2. Materials (Facilitator Prep)

  *   **18 Envelopes:** 6 marked "Type A" (High), 6 marked "Type B" (Low), 6 empty (for Receivers).
  *   **Vitality Chips:** ~200 small paper squares (or poker chips).
  *   **Display Cards:** 12 index cards per Signer (to write levels 0-3).
  *   **Contract Tokens:** 6 distinct objects (e.g., colored coins) for Receivers.
  *   **Score Sheets:** 18 sheets (one per student) to track personal points.
  *   **Condition Cards:** 3 large signs to hang up for each round (Condition 1, 2, 3).
  *   **Timer:** Visible to the class.

  ---

  ## 3. Payoffs and Costs

  **Payoff Structure (Constant across all rounds):**
  *   **Receiver:**
      *   Partner with Type A: **+20 Points**
      *   Partner with Type B: **-20 Points** (Emphasize this risk!)
      *   No Partner: **0 Points**
  *   **Signaler:**
      *   Secure a Partner: **+30 Points**
      *   No Partner: **0 Points**
      *   *Minus* Cost of Display (paid from initial endowment or subtracted from total).

  **Cost Conditions (The Variable):**
  Signalers start each round with **40 Vitality Chips**. Unspent chips are worth **0** at the end of the round (they must be "burned" or spent to count toward the display). *Correction for simplicity:* Chips are subtracted from the +30 match bonus.

  *   **Condition 1 (Cheap Talk):**
      *   Cost per Display Level: **0 Chips** for everyone.
  *   **Condition 2 (Flat Cost):**
      *   Cost per Display Level: **5 Chips** for everyone (Type A and Type B).
      *   *Max Display (3) Cost:* 15 Chips.
      *   *Net Signaler Profit:* 30 - 15 = 15. (Still profitable for Type B to mimic).
  *   **Condition 3 (Differential Cost):**
      *   Cost per Display Level (Type A): **5 Chips**.
      *   Cost per Display Level (Type B): **15 Chips**.
      *   *Max Display (3) Cost Type A:* 15 Chips (Net 15).
      *   *Max Display (3) Cost Type B:* 45 Chips (Net -15). **Loss.**

  ---

  ## 4. Round Sequence (Total Play Time: 30 Minutes)

  **Introduction (10 Minutes):**
  *   Distribute roles and envelopes.
  *   Explain the mechanics strictly procedurally ("If you match, write +30. If Type B, Receiver writes -20").
  *   **Do not explain why.** Do not mention "honesty," "signals," or "evolution."
  *   Tell them: "Your goal is to maximize your own points."

  **Round 1: The Empty Display (5 Min Play + 3 Min Tally)**
  *   **Condition:** Cheap Talk (Cost = 0).
  *   **Action:** Signalers pick a level. Receivers choose.
  *   **Expected Outcome:** All Signalers display Level 3 (it's free). Receivers cannot distinguish A from B. Receivers will likely randomize or refuse to play. Many Receivers score -20.
  *   **Facilitator Note:** Ask Receivers: "How did you decide?" (Answer: "Guesswork"). Ask Type B Signalers: "Why did you display 3?" (Answer: "To get the match").

  **Round 2: The Uniform Tax (5 Min Play + 3 Min Tally)**
  *   **Condition:** Flat Cost (5 Chips/level for all).
  *   **Action:** Repeat.
  *   **Expected Outcome:** Most Signalers (A and B) still display Level 3. The cost (15) is less than the reward (30). Type B still mimics Type A. Receivers still get burned occasionally.
  *   **Facilitator Note:** Point out that even though signaling was "harder," the mix of partners didn't change much.

  **Round 3: The Burden (5 Min Play + 3 Min Tally)**
  *   **Condition:** Differential Cost (A=5, B=15 Chips/level).
  *   **Action:** Repeat.
  *   **Expected Outcome:** Type A Signalers display Level 3. Type B Signalers drop to Level 0 or 1 (Level 3 is suicidal). Receivers learn to only pick Level 3. Matches become mostly Type A.
  *   **Facilitator Note:** Watch for Type B frustration. Watch for Receivers becoming confident.

  **Role Swap (Optional/Time Permitting):**
  *   If time allows (unlikely in 75 mins), swap roles. If not, proceed to debrief. The data from 12 Signalers is sufficient.

  ---

  ## 5. Debrief (30 Minutes)

  *Do not lecture. Ask questions that map their experience to the theory.*

  **Phase 1: The Failure of Cheap/Flat Signals (10 mins)**
  *   **Ask Receivers (Round 1 & 2):** "When everyone displays Level 3, what information does Level 3 give you?"
      *   *Target Concept:* **Pooling Equilibrium.** When the action is the same, the information is zero.
  *   **Ask Type B Signalers:** "In Round 2, you paid chips to display 3. Did it help you hide?"
      *   *Target Concept:* Mere cost isn't enough. If the cost is the same, the lie is still affordable.
  *   **Ask Receivers:** "Why were you skeptical in Round 1?"
      *   *Target Concept:* Rational skepticism. Without risk, claims are worthless.

  **Phase 2: The Success of the Burden (10 mins)**
  *   **Ask Type B Signalers (Round 3):** "Why did you stop displaying Level 3?"
      *   *Target Concept:* **Differential Cost.** The cost wasn't just high; it was *higher for you* than for Type A.
  *   **Ask Type A Signalers:** "Was displaying Level 3 wasteful for you?"
      *   *Target Concept:* **The Handicap.** Yes, it cost you chips (15), but you could afford it. The waste proves the quality.
  *   **Ask Receivers:** "Why did you trust Level 3 in Round 3 but not Round 1?"
      *   *Target Concept:* **Separating Equilibrium.** The behavior separated the types.

  **Phase 3: Stability and Skepticism (10 mins)**
  *   **Hypothetical:** "What if, in Round 3, Receivers decided to trust Level 1 instead?"
      *   *Discussion:* Signalers would drop to Level 1. The equilibrium shifts.
      *   *Target Concept:* **Multiple Equilibria.** The system only works if Receivers *expect* it to work. If they stop checking, Signalers stop signaling.
  *   **Final Question:** "Is the chip burning 'useful'?"
      *   *Target Concept:* The waste *is* the message.

  ---

  ## 6. Troubleshooting

  **1. Pooling Equilibrium Emerges Early (Signalers stop displaying)**
  *   *Symptom:* In Round 3, Type A Signalers also drop to Level 0 because they fear no one will trust them.
  *   *Fix:* Pause. Remind Type A: "You gain 30 for a match. Level 3 costs you only 15. If you display 3 and a Receiver sees it, do they gain by picking you?" Let them recalculate. Encourage one brave Type A to try Level 3.

  **2. Receivers Trust Cheap Signals (Friendliness Bias)**
  *   *Symptom:* In Round 1, Receivers pick partners randomly and smile, ignoring the -20 penalty.
  *   *Fix:* Enforce the score. At the end of Round 1, publicly announce the total Receiver score. If it's negative, highlight it. "You lost 40 points total. Does smiling fix the score?" Make the penalty sting.

  **3. Low-Quality Signaler Complains "It's Unfair"**
  *   *Symptom:* A Type B student argues the cost structure is rigged against them.
  *   *Fix:* **Validate this.** "Exactly. In nature, being low quality *is* unfair. The system doesn't care about fairness; it cares about what works. Hold onto that feeling for the debrief." This is a teaching moment, not a bug.

  **4. Collusion / Information Leakage**
  *   *Symptom:* Signalers whisper "I'm Type A" to Receivers.
  *   *Fix:* Immediate disqualification of that match (0 points for both). "In biology, you can't just say 'I'm healthy.' You have to show it. Verbal claims are banned."

  ---

  ## 7. Honest Note for the Facilitator

  **What This Game Cannot Reproduce:**
  1.  **Rationality vs. Selection:** The students are playing via *conscious calculation* ("If I spend 15, I net 15"). In biology, peacocks do not calculate. Traits spread because individuals with those traits *survived*, not because they chose to. You must explain in the debrief that the "points" represent reproductive success, and the "choices" represent inherited strategies selected over generations.
  2.  **Empirical Contestation:** The Handicap Principle (Zahavi/Grafen) is dominant but not universally accepted. Some biologists argue for "Index Signals" (unfakeable physical constraints, like voice pitch) rather than "Handicaps" (wasteful costs). Others argue that costs need not be differential, just absolute.
  3.  **The "Why":** The game shows *how* differential cost stabilizes signaling. It does not prove *that* this is how all animal signaling works.

  **Closing Instruction:**
  End the seminar by acknowledging that while the logic holds mathematically (as they felt in the game), finding empirical proof of differential costs in wild animals remains one of the hardest challenges in evolutionary biology. The game solves the logic puzzle; nature has to solve the engineering one.
