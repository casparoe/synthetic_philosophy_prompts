      *   *Claim:* No violation of Indiscernibility of Identicals (Leibniz's Law) because the properties aren't the same.
      *   *Risk:* Collapsing into Relative Identity (Geach) or denying genuine de re modality.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Pluralists (Coincidence).*
          *   *Focus:* Ontological cheating. "You want the benefits of distinctness without the cost."
          *   *Phrasing:* "You're just relativizing properties to avoid counting objects."
          *   *Damage:* High. This is the standard objection to constitution-as-identity.
          *   *Reply:* Deny the cost. One object, one set of properties, just indexed differently.
          *   *Weakness:* Is it just verbal?

      *   *Objection 2: The Four-Dimensionalist (Perdurantist).*
          *   *Focus:* Temporal parts solve this easily. Why complicate semantics?
          *   *Phrasing:* "This is just a linguistic band-aid for a mereological mistake."
          *   *Damage:* Medium-High. They think the puzzle is dissolved, not solved.
          *   *Reply:* Endurantism is viable; my view preserves intuition without ontological proliferation of parts.
          *   *Weakness:* Why prefer complex semantics over simple ontology (parts)?

      *   *Objection 3: The Finean Essentialist (Grad Student).*
          *   *Focus:* Essence is prior to sortals. What grounds the sortal?
          *   *Phrasing:* "Which essence is the *real* one? You haven't explained the ground."
          *   *Damage:* Medium. Gets at the metaphysical grounding of the sortals.
          *   *Reply:* Sortals track conceptual modes of presentation; no "real" essence beyond that.
          *   *Weakness:* Risks anti-realism about essence.

      *   *Objection 4: The General Audience (Relative Identity).*
          *   *Focus:* Is this just Geach in disguise?
          *   *Phrasing:* "Identity is absolute. You're making it sortal-relative."
          *   *Damage:* High. If successful, the view is incoherent.
          *   *Reply:* Identity is absolute; *properties* are sortal-relative. Distinction is crucial.
          *   *Weakness:* Hard to maintain the distinction under pressure.

      *   *The "Fear" Question:*
          *   *Focus:* The "Which Object?" question or the "Grounding" question.
          *   *Idea:* "If I point to the clay, did I point to the statue?" (Too easy).
          *   *Better:* "What determines which sortal applies when?" or "Is there a fact of the matter about what the object *really* is?"
          *   *Best:* The "Too Many Sortals" problem. If sortals determine properties, can I invent a sortal 'Statump' that survives squashing? If so, trivialization. If no, what constrains sortals?

  4.  **Refining the Content (Tone and Specificity):**
