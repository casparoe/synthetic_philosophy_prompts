  the question i want to work on: when people build AGI and that AGI ends up causing an s-risk, did the builders *cause* the suffering or did they merely *allow* it by creating conditions where it could happen? and does the answer to that question actually matter for what they should have done? the doing/allowing distinction in ethics seems relevant but the standard treatments (trolley problems, singer's pond, etc.) feel like they break down when you're dealing with probabilistic harms at astronomical scale where the "allowing" involves actively building the thing that does the harm. like, it's not obvious that the distinction between causing and allowing even carves reality at the joints in these cases.

  i want the proposal to: nail down the question precisely, explain why the existing philosophical literature on doing vs allowing doesnt settle it (most of it assumes relatively contained causal chains and doesn't deal with cases where the "allowing" consists in creating the agent that does the harm), describe a method — i'm thinking conceptual analysis of the doing/allowing distinction under these weird conditions, maybe drawing on some legal theory about liability for creating dangerous conditions — and say what a useful deliverable looks like and what would count as the project failing. no need for citations, i'll add those.

  you're a professional philosopher who works at the intersection of ethics and longtermism. please think through this carefully — maybe start by brainstorming the different ways the doing/allowing distinction could apply here before writing the actual proposal.
