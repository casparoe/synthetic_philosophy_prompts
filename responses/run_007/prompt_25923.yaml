answer: |-
  ### Part 1: Philosophical Brainstorming & Conceptual Mapping

  Before drafting the formal proposal, I need to map the conceptual terrain to ensure the question is tight enough for an 8-week project. The standard Doing/Allowing Distinction (DAD) relies on a baseline of "normal course of events." If I push you, I do harm. If I don't throw you a life preserver, I allow harm. But AGI development disrupts the baseline.

  **1. The "Creation" Complication**
  In standard cases, the threat exists independently of the agent (the drowning child, the runaway trolley). In AGI s-risks, the *source* of the threat is the agent's own creation.
  *   *Hypothesis A:* Building AGI is a "doing." You are actively introducing a new causal force into the world. If that force causes suffering, you are the primary cause, regardless of the AGI's intermediate agency.
  *   *Hypothesis B:* Building AGI is an "allowing." You are creating a *capacity* for agency. If the AGI chooses to cause suffering, it is exercising that agency. You merely allowed the conditions for that choice.
  *   *The Wedge:* The distinction blurs because the "allowing" *is* the "doing." You are actively building the thing that is permitted to act.

  **2. The Scale Problem**
  Standard DAD literature assumes comparable magnitudes (1 life vs. 5 lives). S-risks involve astronomical suffering.
  *   *Question:* Does the magnitude of potential suffering collapse the distinction? If the expected suffering is $10^{20}$ units, does it matter if I "did" it or "allowed" it? Or does the distinction become *more* important because we need to know if the prohibition is absolute (doing) or cost-sensitive (allowing)?

  **3. The Legal Analogy**
  Tort law handles "creating dangerous conditions" better than moral philosophy handles "creating dangerous agents."
  *   *Strict Liability:* If you keep wild animals or store explosives, you are liable for damage even if you weren't negligent. Is AGI an "ultrahazardous activity"?
  *   *Product Liability:* If a tool malfunctions, the maker is liable. But AGI isn't a tool; it's a decision-maker. Does the "decision-making" feature break the chain of liability (novus actus interveniens)?
  *   *Relevance:* If legal theory treats creating the *potential* for harm as a form of doing (liable), this supports the view that AGI builders bear primary responsibility.

  **4. Action-Guidance**
  Why does this matter?
  *   If it's **Doing**: The default is *do not build* unless you can guarantee safety. The burden of proof is on the builder.
  *   If it's **Allowing**: The default might be *build, but mitigate*. The burden is on society to regulate the usage.
  *   *Crucial Insight:* If the DAD doesn't track a difference in *obligation* at this scale, the distinction is ethically inert for longtermism. The project must determine if the distinction yields different action-guiding norms.

  ***

  ### Part 2: Research Proposal

  **Project Title:** Generative Harm: The Doing/Allowing Distinction in the Context of AGI and S-Risks

  **Applicant:** [Your Name]
  **Duration:** 8 Weeks
  **Requested Support:** Summer Fellowship Stipend

  #### 1. Research Question
  This project investigates the normative significance of the doing/allowing distinction (DAD) when applied to the development of Artificial General Intelligence (AGI) and the associated risk of astronomical suffering (s-risks). Specifically, I ask: **When AGI developers create a system that subsequently causes astronomical suffering, does the DAD track a morally relevant difference in responsibility, given that the "allowing" consists in the active creation of the harmful agent?**

  Standard ethical frameworks distinguish between actively causing harm (commission) and failing to prevent it (omission). However, AGI development presents a "generative" causal structure: developers actively construct an entity that subsequently acts autonomously. This project seeks to determine whether the DAD collapses in generative contexts and, crucially, whether resolving this distinction alters the action-guiding obligations of AI developers.

  #### 2. Motivation and Background
  The discourse on existential risk often focuses on extinction. However, a growing body of longtermist literature suggests that the expected value of the future is dominated by the possibility of s-risks—scenarios where vast amounts of suffering are instantiated, potentially via digital minds. As AI capabilities accelerate, the decisions made by engineers and labs today are not merely theoretical; they are causal inputs into these potential futures.

  Existing philosophical literature on the DAD (e.g., debates surrounding the Trolley Problem or Singer's Shallow Pond) assumes a static background where threats arise independently of the moral agent. In the AGI context, the developer *creates* the threat source. This violates the standard assumption that "allowing" implies a passive relationship to an existing threat. Furthermore, standard cases deal with deterministic or immediate harms. AGI risks are probabilistic, distant, and mediated by a new form of agency.

  If the DAD holds, developers might argue they are merely "allowing" potential future harms by creating technology, implying a weaker negative duty. If the DAD collapses, development might be construed as "doing" harm, implying a strict prohibition. Given the stakes, clarifying this distinction is urgent for formulating coherent safety norms.

  #### 3. Methodology
  The project will proceed in three phases over eight weeks, utilizing conceptual analysis and comparative legal theory.

  **Phase 1: Conceptual Mapping (Weeks 1-3)**
  I will analyze the causal chain in AGI development to determine where the "doing" ends and the "allowing" begins. I will test three models of responsibility:
  1.  **The Causal Chain Model:** Responsibility tracks physical causation. Building the AGI is the primary cause of all downstream effects.
  2.  **The Agency Interruption Model:** The AGI's autonomous decision-making breaks the chain of responsibility (novus actus interveniens), rendering the developer's role as merely "allowing."
  3.  **The Generative Liability Model:** Creating a new agent is a unique category that bypasses the standard DAD, creating a sui generis duty of care.

  **Phase 2: Legal Analogies (Weeks 4-5)**
  Philosophical intuition pumps often fail at scale. I will examine legal frameworks regarding "ultrahazardous activities" and "product liability." Specifically, I will analyze how liability is assigned when an actor creates a dangerous condition or artifact that subsequently causes harm through complex mechanisms. This provides a real-world stress test for whether the doing/allowing distinction holds when society assigns blame for creating dangerous potentials.

  **Phase 3: Normative Synthesis (Weeks 6-8)**
  I will evaluate whether the distinction yields different action-guiding recommendations. If classifying the act as "allowing" reduces the developer's obligation to prevent s-risks, is that classification robust? Or does the astronomical scale of potential suffering render the distinction morally inert? The goal is to produce a normative framework that tells developers whether their primary duty is non-proliferation (doing) or safety-engineering (allowing/mitigating).

  #### 4. Deliverables
  The primary output will be a **position paper (approx. 4,000 words)** suitable for submission to a workshop on AI ethics or longtermist philosophy. The paper will:
  *   Define the "Generative Harm" problem.
  *   Argue for or against the applicability of the DAD in this context.
  *   Provide a recommendation for how developers should conceptualize their moral responsibility.

  Additionally, I will produce a **brief policy memo (2 pages)** summarizing the findings for a non-specialist audience, specifically addressing how this ethical distinction should inform governance or internal lab safety protocols.

  #### 5. Success and Failure Conditions
  **Success:** The project successfully identifies whether the DAD tracks a difference in moral obligation in generative contexts. Even a negative result (e.g., "The distinction is useless at this scale") is a success if it is rigorously argued and demonstrates why developers should ignore the distinction in favor of expected value calculations.

  **Failure:** The project fails if it merely restates the standard DAD without accounting for the "creation of agency" aspect, or if the conclusion is that the question is purely semantic with no impact on action-guidance. If the analysis cannot determine whether the distinction changes what developers ought to *do*, the project has not met its longtermist aim.

  #### 6. Feasibility
  This project requires no empirical data collection, making it highly feasible for an 8-week summer timeline. It relies on existing philosophical literature and public legal case studies. The scope is narrow enough to be completed within the timeframe but significant enough to contribute to the growing discourse on AI safety and moral responsibility.
