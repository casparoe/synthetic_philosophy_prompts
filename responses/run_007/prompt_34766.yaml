          2.  If resolvable from above, the tangle isn't real (just descriptive).
          3.  Therefore, tangled hierarchies aren't real.
          4.  Therefore, self-reference isn't real.
          5.  Therefore, Gödel, consciousness, and this argument are illusory/incoherent.
          6.  Contradiction/Absurdity.
