  settles on staying, he becomes convinced Death will appear here; if he settles on
  fleeing, he becomes convinced Death will be there. he can''t outrun the prediction.
  i want to write his reasoning the way a genuinely intelligent person would think,
  but i''m stuck on what the logic actually says he should do. it seems like whatever
  he decides, he''ll have a reason to switch after he decides, and then switch back.
  is there a stable rational move in this kind of situation, or does his deliberation
  just loop forever? i''m not looking for story tips, more for the philosophical logic
  of the dilemma.'
