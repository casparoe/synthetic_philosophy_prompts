answer: |-
  # Activity Plan: "The Literal Vault"

  **Time:** 60 Minutes
  **Participants:** 10 Students (Split into two teams of 5: Team Alpha & Team Beta)
  **Goal:** To experientially reveal the tension between asserting falsehoods (lying) and asserting truths to imply falsehoods (misleading).
  **Materials Needed:**
  *   10 Index cards (for secrets).
  *   1 Whiteboard or large sheet of paper (for scoring).
  *   1 Timer (phone is fine).
  *   Small treats (candy/stickers) or "Ethics Bowl Prestige Points" (for scoring).

  ---

  ## Part 1: The Activity (40 Minutes)

  ### Setup (5 Minutes)
  1.  **Divide:** Split the group into **Team Alpha** and **Team Beta** (5 students each).
  2.  **Explain the Objective:** Tell them this is a game of information security.
      *   **Defenders:** Hold a "Secret" (written on an index card). Their goal is to prevent the Interrogators from guessing the Secret.
      *   **Interrogators:** Ask questions to deduce the Secret.
      *   **Winning:** Interrogators get **10 Points** if they guess the Secret correctly. Defenders get **10 Points** if the Secret remains hidden after 5 questions.
  3.  **The Secret:** Write a simple concrete noun on the card (e.g., "The Principal's Office," "A Red Stapler," "The Gym"). Give one card to the Defending Team. They all see it.
  4.  **Crucial Constraint:** Do **not** use the words "Lie," "Truth," or "Mislead" in your instructions. Use the terms **"Unrestricted"** and **"Restricted."**

  ### Round 1: Unrestricted Defense (15 Minutes)
  1.  **Role:** Team Alpha Defends. Team Beta Interrogates.
  2.  **Rule:** Defenders may answer the Interrogators' 5 questions however they choose. There are no constraints on the content of their answers.
  3.  **Process:**
      *   Team Beta confers for 2 minutes to plan questions.
      *   Team Alpha confers for 2 minutes to plan their defense strategy.
      *   Team Beta asks 5 questions (one at a time). Team Alpha must answer immediately (one designated speaker, or group consensus).
      *   Team Beta makes a final guess.
  4.  **Score:** Award points based on the guess.
  5.  **Swap:** Team Beta Defends, Team Alpha Interrogates. Repeat.
  6.  **Observation:** Watch how the Defenders answer. They will likely lie blatantly if it helps them win. Note the Interrogators' reactions (frustration, accusation, or acceptance).

  ### Round 2: Restricted Defense (15 Minutes)
  1.  **Role:** Swap back (Alpha Defends, Beta Interrogates).
  2.  **Rule:** Defenders are now under a **"Veracity Constraint."** Every statement they make must be **literally factually accurate** based on the real world. However, they still win if the Interrogators guess the wrong Secret.
      *   *Facilitator Note:* You are the Judge. If an Interrogator challenges an answer ("That's a lie!"), you make a quick ruling on whether it is *literally* true. If it is literally true, it stands, even if it is sneaky.
  3.  **Process:** Same as Round 1 (2 min planning, 5 questions, final guess).
  4.  **Score:** Award points.
  5.  **Swap:** Team Beta Defends, Team Alpha Interrogates. Repeat.
  6.  **Observation:** Watch the Defenders struggle to find "loophole truths." Watch the Interrogators feel manipulated even though no rule was broken.

  ### Transition to Debrief (5 Minutes)
  *   Tally the total scores.
  *   Ask students to sit in a circle.
  *   **Instruction:** "For the next 20 minutes, we are not playing the game anymore. We are analyzing what happened. I am going to ask you questions about your experience, not about the rules."

  ---

  ## Part 2: The Debrief (20 Minutes)

  *Facilitator Note: Your job here is to map their experiences to philosophical concepts without lecturing. Ask the questions below. If they don't use the philosophical terms, introduce them as "labels philosophers use for what you just described."*

  ### Phase 1: The Felt Difference (5 Minutes)
  **Ask:** "In Round 1 (Unrestricted), some of you probably told direct falsehoods. In Round 2 (Restricted), you had to tell literal truths but still tried to hide the secret. Did it *feel* different to be on the receiving end (Interrogator) in Round 2 compared to Round 1?"
  *   **Listen for:** "It was more frustrating in Round 2," or "I felt tricked," or "I couldn't call them out because they didn't break the rules."
  *   **Map to Philosophy:**
      *   If they say it felt *worse* or *sneakier* in Round 2: Introduce the **Manipulation View**. Some philosophers argue misleading can be morally worse than lying because it treats the listener like a tool to be manipulated rather than a person to be spoken to. It also makes it harder for the listener to hold the speaker accountable (plausible deniability).
      *   If they say it felt *better* in Round 2: Introduce the **Assertion View**. This view holds that lying is worse because when you assert a falsehood, you violate the fundamental norm of communication (trust). When you mislead, you technically keep your end of the bargain, leaving the listener responsible for their own inferences.

  ### Phase 2: Intent and Outcome (5 Minutes)
  **Ask:** "Let's look at the Defenders. In both rounds, your goal was exactly the same: make the Interrogators guess wrong. Your intent to deceive was identical. The Interrogators ended up confused in both rounds. If the intent and the result are the same, does the method matter?"
  *   **Listen for:** "A lie is a lie," or "It's the harm that counts," or "They knew we would get it wrong."
  *   **Map to Philosophy:**
      *   Introduce the **Consequentialist/Intent View**. This position argues that once you fix the intent to deceive and the potential harm, there is no *moral* difference between lying and misleading. The distinction is just legalistic hair-splitting. If you intended to create a false belief, you are responsible for that belief, regardless of the grammatical trickery used.

  ### Phase 3: Accountability and Deniability (5 Minutes)
  **Ask:** "In Round 2, if an Interrogator realized they were being tricked, could they punish the Defender? Could they say 'You broke the rules'?"
  *   **Listen for:** "No, because they told the truth," or "We couldn't prove it."
  *   **Map to Philosophy:**
      *   Discuss **Deniability**. In real life, misleading is often used because it is harder to sanction. If you lie, you can be caught in a lie. If you mislead, you can say, "I never said that; you assumed it." This makes misleading a powerful tool for avoiding responsibility. Ask: "Is it fair to use a tactic that makes you harder to hold accountable?"

  ### Phase 4: Settled vs. Contested (5 Minutes)
  *Read this section carefully to ensure you distinguish consensus from debate.*

  **Facilitator Script:** "We need to be clear about what philosophers agree on and what they fight about."

  1.  **What is Settled (Consensus):**
      *   Everyone agrees that both lying and misleading *can* be morally wrong.
      *   Everyone agrees that the *intent to deceive* is central to the moral problem in both cases.
      *   Everyone agrees that context matters (e.g., lying to a murderer at the door is treated differently than lying to a friend).

  2.  **What is Contested (Debate):**
      *   **Is there an intrinsic difference?** Some philosophers (like Kantians or Contractualists) argue lying is *inherently* worse because it corrupts the act of communication itself. Others argue this is nonsense; the only thing that matters is the harm caused.
      *   **Is misleading ever worse?** Some argue misleading is actually *more* blameworthy because it is manipulative and cowardly (hiding behind technical truths). Others argue it is *less* blameworthy because it respects the listener's autonomy to draw conclusions.
      *   **Clarification:** Do not present the "Assertion View" (lying is worse) as the default. It is a specific reading of moral responsibility, not a universal truth.

  ### Limitations of the Activity (Explicit Instruction)
  **Tell the Team:** "This game helped us feel the distinction, but it missed one huge thing: **Long-term Trust.** In this game, you play once and walk away. In real life, if you mislead your friends repeatedly, even if you are 'technically truthful,' they will stop trusting you. The activity cannot reproduce the erosion of a relationship over time. You will need to imagine that consequence when you apply this to real Ethics Bowl cases."

  ---

  ## Troubleshooting: What Will Go Wrong & How to Handle It

  **1. The "Semantic Loophole" Argument (Round 2)**
  *   **Problem:** In Round 2, Defenders will make claims that are technically true but absurd (e.g., Secret: "Gym." Question: "Is it indoors?" Answer: "The sun is a star."). Interrogators will yell "That's not fair!"
  *   **Fix:** As the Facilitator/Judge, enforce a **"Relevance Norm."** Tell them before Round 2: "Answers must be relevant to the question, even if they are literally true." If they stall, rule the answer invalid and force a new one. This prevents the game from breaking down while preserving the moral tension of *relevant* misleading.

  **2. The "It's All the Same" Dismissal**
  *   **Problem:** Students may decide immediately that "Deception is deception" and refuse to see a nuance.
  *   **Fix:** Press them on the **Accountability** angle. Ask: "If you get caught lying, you lose reputation. If you get caught misleading, can you talk your way out of it? If yes, does that make it a more dangerous tool?"

  **3. Time Overrun**
  *   **Problem:** The planning phases take too long.
  *   **Fix:** Be a strict timekeeper. Use a visible timer. If a team takes too long to ask a question, count it as a "passed" question. Keeping the pace fast increases the pressure, which makes the moral shortcuts (lying/misleading) more tempting and realistic.

  **4. Facilitator Bias**
  *   **Problem:** You might accidentally signal that lying is "bad" and misleading is "clever."
  *   **Fix:** Remain neutral. When a Defender successfully misleads, do not praise their cleverness. When an Interrogator gets angry, do not validate their anger as "correct." Simply reflect it back: "I hear that you feel manipulated. Why does that feel different than being lied to?"

  ## Summary of Philosophical Positions for Your Reference
  *Use this to guide the discussion, not as a script.*

  | Position | Core Claim | Activity Connection |
  | :--- | :--- | :--- |
  | **The Assertion View** | Lying is worse because it violates the norm of assertion (saying what you believe). Misleading leaves the listener responsible for the inference. | Interrogators feeling they "should have known better" in Round 2. |
  | **The Consequentialist View** | No moral difference. Intent + Harm = Wrongness. The method is irrelevant. | Defenders having the same goal (win points) in both rounds. |
  | **The Manipulation View** | Misleading can be worse. It is more deniable, harder to detect, and treats the listener as a puppet rather than a partner. | Interrogators feeling "tricked" or "gaslit" in Round 2 despite no rules being broken. |

  **Final Note to Facilitator:** You are not looking for the "right" answer. You are looking for the team to recognize that this distinction is a tool they can use to analyze cases. In Ethics Bowl, recognizing when a case turns on *how* information was conveyed (not just *what* was conveyed) is a high-level skill. This session builds that intuition.
