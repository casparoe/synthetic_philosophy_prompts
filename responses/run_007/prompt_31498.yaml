answer: |-
  Given your background, think of ECL not as philosophy but as a signal-processing problem in a high-noise environment. You are trying to isolate a specific signal (your agency's impact on correlated agents) from a baseline of spurious correlations and causal noise. An adequate "spec" for ECL must define the resolution, the baseline subtraction, and the integration limits.

  Below is the specification for an adequate theory of Evidential Cooperation in Large Worlds (ECL).

  ### The ECL Specification: Desiderata Table

  | Requirement | Concrete Case / Consideration | Status | Tension / Notes |
  | :--- | :--- | :--- | :--- |
  | **Twin Coordination** | **Twin Prisoner's Dilemma:** Two identical algorithms, no causal channel. Theory must prescribe Cooperation (C) over Defection (D). | **Non-Negotiable** | Eliminates CDT immediately. If you defect here, you aren't doing ECL. |
  | **Spurious Correlation Filter** | **Smoking Lesion:** An agent correlates with cancer due to a common cause (lesion), not agency. Theory must *not* prescribe avoiding smoking to avoid cancer. | **Non-Negotiable** | Eliminates plain EDT. ECL must distinguish *agentic* correlation from *passive* correlation. |
  | **Reference Class Non-Arbitrariness** | **The Similarity Metric:** In a large world, who counts as "you"? Must define similarity without circularity or arbitrariness (e.g., "everyone I want to cooperate with"). | **Non-Negotiable** | **The Bottleneck.** Eliminates plain FDT (requires exact logical identity) and EDT (too broad). |
  | **Anthropic Measure Specification** | **Self-Locating Beliefs:** If there are $10^{100}$ copies of you, how do you weight their utility? Must plug into a specific anthropic framework (SSA, SIA, etc.). | **Non-Negotiable** | Eliminates standard CDT/EDT/FDT which lack explicit measures over observer-moments. |
  | **Cosmological Transparency** | **Universe Size:** Does your obligation to vote change if the universe is infinite vs. finite? Theory must explicitly state the dependency function. | **Contingent** | *Taste:* ECL proponents accept dependence; critics demand independence. Theory must not hide the variable. |
  | **Computational Tractability** | **Finiteness:** Can a human (or AI) actually calculate the reference class without summing over infinite copies? | **Contingent** | *Taste:* Ideal theory vs. Heuristic. Strict ECL may be intractable; a "good enough" spec allows approximations. |
  | **Commitment Stability** | **Parfit's Hitchhiker:** You are safe in the city; paying the driver now costs utility. Theory must prescribe paying. | **Non-Negotiable** | Tests ability to bind future selves/instances. CDT fails; EDT/FDT pass. |

  ### Incompatibility Flags (No-Go Theorems)

  You asked to flag subsets that cannot be jointly satisfied. There is one fundamental tension in ECL akin to an uncertainty principle:

  **The Cosmological Sensitivity vs. ECL Leverage Trade-off**
  *   **The Conflict:** To gain the "Large World" leverage (the benefit of ECL), you must define your reference class broadly enough to include many copies across the cosmos. However, if the reference class is broad enough to capture these copies, your expected utility becomes mathematically dependent on the total size and structure of the universe (cosmology).
  *   **The Impossibility:** You cannot simultaneously satisfy **High ECL Leverage** (cooperating with distant copies) and **Cosmological Independence** (everyday choices remaining stable regardless of universe size).
  *   **The Spec Consequence:** An adequate theory must choose. Most ECL proponents sacrifice Cosmological Independence. If a theory claims to offer ECL benefits *without* cosmological dependence, it is mathematically incoherent.

  ### The Killer Requirement

  The single requirement that does the most work to eliminate the usual contenders (plain EDT, CDT, FDT) as adequate foundations for ECL is:

  **Reference Class Non-Arbitrariness**

  Here is why this specification filters the field:

  1.  **Eliminates Causal Decision Theory (CDT):** CDT defines the relevant class as "causal descendants." In a Twin PD or Large World scenario, this class is empty (no causal channel). CDT fails the **Twin Coordination** requirement because its reference class definition is too narrow to capture the signal.
  2.  **Eliminates Plain Evidential Decision Theory (EDT):** EDT defines the class as "statistically correlated." In a Smoking Lesion case, this class includes passive biological markers. EDT fails the **Spurious Correlation Filter** because its reference class definition is too broad (includes noise).
  3.  **Eliminates Plain Functional Decision Theory (FDT):** FDT defines the class as "logically identical algorithms." In a physical Large World, no two agents are *logically* identical (thermal noise, hardware differences, slight memory variations). FDT fails the **Finiteness/Physical Instantiation** constraint because its reference class is a Dirac delta function (exact match only) in a world of broadened spectral lines. It cannot handle *graded* similarity, which is required for ECL to work in a messy physical universe.

  ### Summary for the Spectroscopist

  *   **CDT** has high resolution but zero sensitivity to the signal (non-causal correlations).
  *   **EDT** has high sensitivity but zero resolution (picks up all noise).
  *   **FDT** has perfect resolution but requires a vacuum (exact logical identity) that doesn't exist in physical media.
  *   **ECL** requires a theory that can integrate over a broadened peak (graded similarity) while subtracting the baseline (spurious correlations), all while acknowledging that the total signal strength depends on the size of the container (cosmology).

  Currently, no theory fully meets this spec. FDT is the closest carrier, but it lacks the calibrated anthropic measure required to weight the "copies" in the integral. Until the **Anthropic Measure Specification** is solved, ECL remains a qualitative heuristic rather than a decision procedure.
