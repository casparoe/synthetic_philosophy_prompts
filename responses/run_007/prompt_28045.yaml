      *   *Actually, looking closer at (6):* The user says "both are actual features... that remove Jones's control in some sense." This is the contention. In FC, control is *not* removed in the actual sequence. In Manipulation, it *is*. I need to hammer this point.

  6.  **Final Plan:**
