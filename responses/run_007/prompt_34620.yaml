answer: |-
  This is one of the most profound and difficult problems in bioethics, often framed as the debate between **precedent autonomy** (the authority of the past self) and **current well-being** (the interests of the present self). Your colleague has presented a version of the "Psychological Continuity Argument," famously associated with philosophers like Derek Parfit and applied to dementia by Rebecca Dresser.

  The argument is logically valid, which is why it feels inescapable. However, it is not sound. To escape the conclusion while preserving your moral intuitions (specifically that promises/obligations persist and that advance directives matter), you must reject a specific premise.

  Here is the analysis of where to cut the knot, what it costs, and how to reconcile the tension.

  ### The Weak Link: Reject Premise (2)

  The premise you should reject is **(2): "An earlier self's directive can override those present interests only if the earlier self and the present patient are the same person."**

  This is the bridge between the metaphysical claim (about identity) and the moral claim (about authority). The argument assumes that **moral authority requires strict personal identity.**

  **Why reject it?**
  Premise (8) already gives you the weapon to reject (2). Premise (8) states that we *do* and *should* hold people to promises and debts despite psychological change.
  *   If a man incurs a debt, develops amnesia, and changes his personality, we still collect the debt from his assets.
  *   If a woman makes a vow, later loses her memory, we still consider her bound by the vow (or at least, her estate is).

  If moral obligations (debts, promises, responsibilities) can survive a rupture in psychological continuity, then **moral authority does not depend on strict psychological identity.** Therefore, Premise (2) is false. An advance directive can have authority over the present patient even if the "psychological person" has changed, just as a debt binds the "psychological successor."

  ### The Cost: You Must Qualify Premise (1)

  You mentioned you would most like to keep (1) and (8). The hard truth is that **you cannot keep Premise (1) exactly as written** if you reject (2).

  Premise (1) states: *"Once a patient can no longer decide for herself, her medical care should be governed by her present interests and preferences."*

  If you reject (2) to save the advance directive, you are admitting that care should **not** be governed *solely* by present interests. It must be governed by a combination of present interests *and* past critical interests (values, life plan, dignity).

  **The Cost:**
  By rejecting (2), you accept a tragic burden. You acknowledge that honoring the directive might mean acting against the wishes of the currently existing, perhaps content, individual. You are prioritizing the **integrity of the life as a whole** over the **experiential well-being of the current chapter.**
  *   **Emotional Cost:** It feels like betraying the smiling mother in front of you to honor the fearful woman who is gone.
  *   **Philosophical Cost:** You must accept that "persons" are extended beings over time, not just momentary consciousnesses.

  ### Why This Is the Best Path

  Rejecting (2) is superior to rejecting Premise (3) (the definition of identity).
  *   **If you reject (3):** You argue she *is* the same person psychologically. This is often factually dubious in late-stage dementia. It requires denying the reality of her cognitive loss.
  *   **If you reject (2):** You admit the cognitive loss is real and profound (validating Premise 4), but you insist that **respect for autonomy extends across that loss.** This aligns better with the legal and moral reality of proxies. We are not just advocates for the *body* in front of us; we are stewards of the *life* that led to this body.

  ### Reconciling the Argument

  Here is how the revised logic looks, which allows you to escape the colleague's conclusion without accepting the absurdity of (7):

  1.  **Modified (1):** Once a patient can no longer decide, care should be governed by her present interests **weighted against her prior competent directives.**
  2.  **Reject (2):** An earlier self's directive **can** override present interests even if psychological continuity is broken, because moral authority rests on **narrative integrity and precedent autonomy**, not just psychological identity.
  3.  **Keep (3) & (4):** Acknowledge that psychological continuity is indeed damaged in dementia.
  4.  **Reject (5) & (6):** Because identity is not the sole source of authority, the directive retains authority.
  5.  **Keep (8):** This is now consistent. We hold people to promises/debts/directives not because they are psychologically identical, but because we respect the **continuity of moral agency** over a lifetime.

  ### Practical Application to Your Situation

  While the philosophy clarifies the authority of the directive, your specific situation has a crucial nuance: **Early-Stage vs. Late-Stage.**

  The directive applies to *late-stage* dementia. Your mother is currently in *early-stage* dementia.
  1.  **Capacity Assessment:** In early-stage dementia, patients often retain the capacity to make medical decisions, or their capacity fluctuates. If she currently has capacity, her *current* refusal or acceptance of treatment overrides the directive *for now*. Advance directives only activate when capacity is lost.
  2.  **Consistency of Wishes:** You note she "sometimes says she wants to go on living." In early stages, fear of death is common. The critical question for the future is: **When she reaches the late stage specified in the directive, will she be capable of expressing a preference?**
      *   If the directive is triggered only when she can no longer communicate or understand, her current "I want to live" statements do not invalidate the directive. They are the wishes of the *early-stage* self, not the *late-stage* self the directive anticipates.
      *   If she reaches late-stage and *still* says "I want to live," you face the full philosophical weight of the argument above.

  ### Summary Advice

  1.  **Tell your colleague:** "I reject Premise (2). Moral authority does not require strict psychological identity. We honor debts and promises across psychological changes; we should honor medical directives the same way."
  2.  **Tell yourself:** It is okay to feel conflict. You are balancing two different moral goods: the **beneficence** owed to the current suffering/joying being, and the **autonomy** owed to the person who planned this life.
  3.  **The Decision:** If the clinical conditions match the directive's trigger (late-stage, no capacity), the philosophical weight favors honoring the directive (rejecting 2). If she is not yet in that stage, her current voice carries more weight.

  By rejecting (2), you preserve the sanctity of promises (8) and the importance of the advance directive, at the cost of admitting that present interests (1) are not the absolute final word. This is the standard ethical position in most legal jurisdictions: **Precedent autonomy generally trumps current best interests when the patient is incapacitated.**
