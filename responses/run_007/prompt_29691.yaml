      *   Contexts: Courts (reasons matter), Legislatures (outcomes matter).
      *   Impossibility: List & Pettit theorem (can't have everything).
      *   Deliberation: The "soft" fix.

  9.  **Final Polish:** Check tone (professional, informative, philosophical but accessible). Ensure the distinction between the *paradox* (the phenomenon) and the *dilemma* (the choice of procedure) is clear. (Actually, the terms are often used interchangeably, but "Dilemma" emphasizes the choice of procedure).

