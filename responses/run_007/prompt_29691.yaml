prompt: |-
  I've noticed a recurring pattern in committee decisions that I don't have a word for, and I'm hoping you can tell me whether it has an established name and how people think about resolving it.

  Suppose a three-judge panel is deciding a contract case. The defendant is liable only if two conditions both hold: there was a valid contract, and there was a breach. The judges vote as follows:

  Judge A: contract yes, breach no → not liable
  Judge B: contract no, breach yes → not liable
  Judge C: contract yes, breach yes → liable

  Each judge is perfectly consistent individually. But if the panel votes issue-by-issue, they get: contract yes (2–1), breach yes (2–1), yet liable no (2–1). The group's collective position is that there was a contract and there was a breach, but no liability — which contradicts the legal rule they all accept.

  I have seen the same structure in hiring committees (a candidate must satisfy three criteria; each criterion gets majority support but the candidate is rejected), in board decisions, and in faculty votes on curriculum changes that have multiple necessary conditions. It seems like a deep problem: you cannot just tell people to vote differently, because each vote was individually reasonable. And it is not simply a matter of poor procedure — it seems like any issue-by-issue majority vote can produce this, even when everyone is perfectly rational.

  Is there an established name for this phenomenon? What are the main positions on how a group should handle it — should they privilege the conclusion vote and revise the premise votes, or the reverse, or something else? And does the answer depend on what kind of group it is (a court versus a legislature versus a hiring committee)?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Phenomenon:** A group makes decisions on multiple premises (issues) via majority vote, leading to a collective conclusion that contradicts the logical implication of those premises, even though every individual member is logically consistent.
      *   **Example:** 3-judge panel. Liability = Contract AND Breach.
          *   Judge A: Contract (Y), Breach (N) $\rightarrow$ Liable (N)
          *   Judge B: Contract (N), Breach (Y) $\rightarrow$ Liable (N)
          *   Judge C: Contract (Y), Breach (Y) $\rightarrow$ Liable (Y)
          *   Majority on Contract: Y (2-1)
          *   Majority on Breach: Y (2-1)
          *   Majority on Liable: N (2-1)
          *   Result: Collective view is (Contract Y, Breach Y, Liable N), which violates the rule (Contract Y + Breach Y $\rightarrow$ Liable Y).
      *   **Questions:**
          1.  Is there an established name for this?
          2.  What are the main positions on resolving it (conclusion-driven vs. premise-driven)?
          3.  Does the answer depend on the type of group (court, legislature, committee)?

  2.  **Identify the Phenomenon:**
      *   This is a classic problem in social choice theory and legal philosophy.
      *   **Name:** The *Discursive Dilemma* (or the *Doctrinal Paradox*).
      *   **Key Figures:** Philip Pettit, Christian List, Lewis Kornhauser, Lawrence Sager.
      *   **Context:** It's a generalization of the Condorcet Paradox but specifically applies to interconnected propositions (premises leading to a conclusion).

  3.  **Address Question 1: The Name:**
      *   Primary term: **The Discursive Dilemma**.
      *   Legal-specific term: **The Doctrinal Paradox**.
      *   Connection to broader theory: It's a specific instance of judgment aggregation problems.

  4.  **Address Question 2: Resolving the Dilemma (Premise vs. Conclusion):**
      *   There are two main procedural approaches to fixing this:
          1.  **Conclusion-Based Procedure (CBP):** Vote directly on the final outcome (Liability). Ignore the inconsistency in the premises.
              *   *Pros:* Respects the direct democratic will on the outcome; simpler.
              *   *Cons:* Opacity (don't know *why*); might ignore the reasoning structure required by law/policy.
          2.  **Premise-Based Procedure (PBP):** Vote on the premises (Contract, Breach) and derive the conclusion logically from the majority premises.
              *   *Pros:* Transparency, consistency with the rule of law, reason-giving.
              *   *Cons:* Can lead to an outcome (Liable) that no individual actually voted for (in this specific example, only Judge C voted Liable, but PBP makes them Liable). This is the "unanimity deficit."
      *   **The "Dilemma":** Both procedures violate some desirable democratic norm. CBP violates logical integrity. PBP violates the "responsiveness" to individual judgments on the final outcome.

  5.  **Address Question 3: Context Dependence (Courts vs. Legislatures vs. Committees):**
      *   **Courts:** Generally lean towards *Premise-Based*. Why? Because legal reasoning requires justification. A judgment without reasons is often invalid. The "Doctrinal Paradox" literature specifically highlights that courts need to establish precedent (the premises matter for future cases).
      *   **Legislatures:** Often *Conclusion-Based*. They vote on bills (the conclusion). The reasons (premises) are debated but not necessarily voted on as binding logical conditions. However, committee structures might use PBP.
      *   **Hiring/Promotion Committees:** Mixed. Often *Conclusion-Based* (do we hire?) to protect candidate privacy and avoid reducing a person to a checklist. However, tenure cases often require specific criteria (PBP).
      *   **Expert/Technical Boards:** Often *Premise-Based* to ensure safety/standards are met logically.

  6.  **Synthesize and Structure the Response:**
      *   **Introduction:** Validate the user's observation. It's a well-known, studied problem. Give the names (Discursive Dilemma/Doctrinal Paradox).
      *   **Theoretical Background:** Briefly mention Judgment Aggregation Theory. Mention Pettit and List.
      *   **The Two Solutions (Procedures):**
          *   Explain Premise-Based Procedure (PBP).
          *   Explain Conclusion-Based Procedure (CBP).
          *   Explain the trade-off (Reasoning vs. Outcome).
      *   **Contextual Application:**
          *   *Judicial:* PBP favored (precedent, reasoning).
          *   *Legislative:* CBP favored (sovereignty, final outcome).
          *   *Administrative/Hiring:* Depends on transparency needs vs. holistic judgment.
      *   **Advanced/Nuanced Points:**
          *   Mention that there is no "perfect" solution (Impossibility Theorems).
          *   Mention deliberation as a potential fix (changing votes before voting).
      *   **Conclusion:** Summarize the takeaway.

  7.  **Refine the Content (Self-Correction/Check):**
      *   *Correction:* Make sure to distinguish between the *Doctrinal Paradox* (legal specific) and *Discursive Dilemma* (generalized). The user described the generalized version but used a legal example. I should mention both.
      *   *Nuance:* In the user's example, PBP leads to "Liable" (supported by 1 judge), while CBP leads to "Not Liable" (supported by 2 judges). This highlights the tension: PBP overrides the majority will on the *outcome* to preserve logical integrity on the *reasons*.
      *   *Reference:* Ensure Lewis Kornhauser and Lawrence Sager are credited for the legal origin (1986/1993), and Pettit/List for the formalization.

  8.  **Drafting the Response:** (Mental or scratchpad)
