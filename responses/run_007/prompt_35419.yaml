      *   *Paragraph 2 (Rationality vs. Irrationality):*
          *   "Shows it can be rational to be irrational."
          *   "Make yourself into someone who genuinely feels bound by promises... driver will pick you up... survive."
          *   "Being irrational about promise-keeping ends up serving your rational self-interest."
          *   "Rationality basically tells you to stop being rational in some areas."
          *   *Assessment:* This is the crux of Parfit's argument in *Reasons and Persons*. Parfit argues that being "rationally required" to pay (once in town) is false on standard Self-Interest Theory (S), but having the *disposition* to pay is rational. The phrasing "rational to be irrational" is a common shorthand for Parfit's conclusion about Self-Interest Theory being "self-defeating."
          *   *Nuance Check:* Parfit distinguishes between the *act* of paying (which S-theory says is irrational once safe) and the *disposition* (which is rational to have). The student captures this distinction well ("cultivate dispositions").
          *   *Verdict:* Strong, captures the "self-defeating" nature of narrow rationality.

      *   *Paragraph 3 (Self-Defeating Theories & Utilitarianism):*
          *   "Parfit uses this to make a bigger point about self-defeating theories."
          *   "Just like act utilitarianism... individual rationality can be self-defeating too."
          *   "Solution... follow rules or cultivate dispositions instead of calculating case by case."
          *   "This is basically why rule utilitarianism was invented, and the hitchhiker case shows the same logic applies to rationality."
