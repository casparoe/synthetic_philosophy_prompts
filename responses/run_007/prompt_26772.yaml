answer: |-
  This is one of the most profound and enduring problems in philosophy. Your friend has independently reconstructed a version of what is known in academic philosophy as **Galen Strawson's "Basic Argument"** (or sometimes the "Impossibilist Argument").

  It is a sophisticated position. To answer your question directly: **Your friend's argument is logically valid, but whether it is *sound* depends entirely on how you define "responsibility."**

  Here is a breakdown of where the argument stands, where it might go wrong, and what it means for Daniel.

  ### 1. The Logic of the Regress
  Your friend's reasoning relies on a specific condition for moral responsibility, often called **Ultimate Responsibility (UR)**. The logic runs like this:

  1.  To be responsible for an action, you must be responsible for the mental state (character/trait) that caused it.
  2.  To be responsible for that mental state, you must have chosen to form it.
  3.  To choose to form it, you must have had a prior mental state that guided that choice.
  4.  Therefore, to be ultimately responsible, you must have chosen your own nature.
  5.  But you cannot choose your nature without already *having* a nature to choose with.
  6.  **Conclusion:** Ultimate responsibility is impossible.

  Logically, this regress is very hard to break. If you demand that a person be the *absolute, uncaused cause* of themselves to be blameworthy, your friend is correct: no human being meets that bar. We are all products of genetics, environment, and prior causes.

  ### 2. Where the Argument Might "Go Wrong" (The Compatibilist Defense)
  Most contemporary philosophers (and likely your intuition when you felt the argument "proved too much") are **Compatibilists**. They agree that our actions are caused by prior factors, but they argue that moral responsibility is still compatible with this.

  They would say your friend's argument goes wrong in **Premise 1**.

  **The Flaw:** The argument assumes that responsibility requires *metaphysical self-creation*. Compatibilists argue that responsibility only requires **agential capacity**.
  *   **Reasons-Responsiveness:** Was Daniel capable of understanding moral reasons? Did he have the ability to recognize that stealing was wrong and the capacity to act on that recognition? If yes, he is responsible, even if his *inclination* to steal came from his upbringing.
  *   **The "Proves Too Much" Objection:** You felt this argument dissolves blame for everyone. A Compatibilist says: *Good.* That shows the definition of responsibility being used is too high. We don't need "God-like" self-creation to hold people accountable. We only need them to be rational agents operating within a social contract.
  *   **P.F. Strawson's Insight:** In his famous essay *Freedom and Resentment*, philosopher P.F. Strawson argued that blame isn't a theoretical judgment about the cosmos; it is a **reactive attitude**. When someone harms us, we naturally feel resentment. To abandon blame entirely would be to view all humans as objects or patients rather than agents. This would make human relationships impossible.

  **Verdict:** If you define responsibility as "being a rational agent who could have responded to reasons," your friend's argument fails. It sets an impossible standard that isn't actually required for society to function.

  ### 3. If the Argument Is Sound (The Hard Incompatibilist View)
  Let's assume your friend is right. Let's assume that because Daniel didn't choose his genes or his upbringing, he cannot be truly blameworthy. This position is called **Hard Incompatibilism**.

  If this is true, the implications are radical but manageable:

  **A. Retributive Blame is Unjustified**
  We cannot punish Daniel because he *deserves* it. The idea of "just deserts" vanishes. It is unjust to inflict suffering on someone for events they could not ultimately prevent.

  **B. Forward-Looking Responsibility Remains**
  Even if Daniel isn't *blameworthy*, he is still **dangerous**. We can still hold him accountable for the sake of safety and rehabilitation.
  *   **Analogy:** If a car has faulty brakes, we don't "blame" the car, but we do take it off the road. We fix the brakes or scrap the car.
  *   **Application:** Daniel should face consequences (prison, restitution, loss of license), not as punishment, but as **quarantine and reform**. We restrict his liberty to protect the brother and the business, and we mandate therapy to alter the causal chain that leads to theft.

  **C. Praise and Gratitude Change**
  If Daniel isn't to blame for the theft, he also isn't truly praiseworthy for any good deeds he did previously. This can be emotionally difficult. It suggests we should view human achievement with humility and compassion rather than judgment.

  ### 4. How to Resolve the Argument
  You and your friend are actually disagreeing about the **purpose of blame**, not just the facts of Daniel's case.

  *   **Your Friend** is viewing blame as a **Metaphysical Judgment**: "Is Daniel the ultimate source of this evil?"
  *   **You** are viewing blame as a **Social Tool**: "Did Daniel violate a norm we need to enforce to live together?"

  **Where to meet in the middle:**
  You can concede to your friend that Daniel is not *cosmically* to blame. He is a product of a tragic chain of causes. However, you can insist that **accountability** is necessary.

  You might say to your friend:
  > "I agree that Daniel didn't choose his parents or his genes. In a cosmic sense, he is unlucky. But we don't live in a cosmic court; we live in a society. If we don't hold people like Daniel accountable, we invite more theft. We can treat him with compassion and understand *why* he did it (his upbringing, his impulses) without absolving him of the *consequences*."

  ### Summary
  *   **Is the argument sound?** It is logically valid, but it relies on a definition of responsibility (Ultimate Origination) that many philosophers reject as unnecessary and impossible.
  *   **Where does it go wrong?** If you believe responsibility is about **capacity to respond to reasons** rather than **origin of character**, the regress stops mattering.
  *   **What should we conclude?** Even if your friend is right, we cannot simply let Daniel go. We must shift from **retribution** ("You are bad, suffer for it") to **protection and reform** ("You are dangerous, we must stop this behavior and help you change").

  Your friend has won the metaphysical debate, but you win the practical one. Daniel may not be a "sinner" in the eyes of the universe, but he is a liability in the eyes of the law, and that distinction is what matters for the brother's business.
