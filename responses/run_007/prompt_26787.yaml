answer: |-
  Your hypothesis is astute, but it is only half-right. You have correctly identified that the testimony debate is symptomatic of a broader fracture in epistemology, but locating that fracture solely in the **Internalism/Externalism** divide oversimplifies the map. Tyler Burge, the champion of modern anti-reductionism, argues for an *a priori* entitlement that is accessible to the subject (Internalist), while many reductionists are happy to ground testimonial justification in external reliability statistics (Externalist). If the debate were purely about access to reasons, Burge and Fricker should agree more than they do.

  Here is the diagnosis you requested.

  ### 1. The Real Structure: Epistemic Individualism vs. Epistemic Sociality

  The stalemate persists because Reductionism and Anti-Reductionism are not merely disagreeing about the *conditions* for justification; they are disagreeing about the **ontology of the epistemic agent.**

  *   **Reductionism is committed to Epistemic Individualism.** It treats the hearer as a "lonely knower" who happens to be surrounded by noise. On this view, testimony is merely a causal channel for evidence, akin to perception or memory. The epistemic burden rests entirely on the hearer to filter signal from noise. The core intuition here is **Autonomy**: To be justified is to be self-governing. To accept a claim without independent validation is to surrender one's epistemic agency.
  *   **Anti-Reductionism is committed to Epistemic Sociality.** It treats the hearer as a node in a communicative network. On this view, testimony is a distinct, generative source of knowledge, not just a transmission belt. The core intuition here is **Cooperation**: Communication is a normative practice governed by norms of truth-telling. To demand independent verification for every claim is to misunderstand the nature of communication itself.

  The agreement you noted—that gullibility is bad—is superficial.
  *   For the **Reductionist**, gullibility is a failure of *vigilance* (I didn't check the evidence).
  *   For the **Anti-Reductionist**, gullibility is a failure of *defeater-sensitivity* (I ignored a red flag).

  They agree on the verdict (gullibility is bad) but disagree on the virtue required to avoid it. One prizes skepticism; the other prizes receptivity.

  ### 2. Is it a Verbal Dispute or Bedrock Intuitions?

  It is not a verbal dispute. Both sides are using "justification" to track genuine normative stakes. It is a clash of **bedrock intuitions about the Presumptive Status of Communication.**

  *   **The Reductionist Intuition:** In a world of liars and error, the default stance must be neutrality. Belief requires a positive push.
  *   **The Anti-Reductionist Intuition:** In a world of language users, the default stance must be trust. Belief is the natural state; skepticism requires a push (a defeater).

  This is why empirical psychology cannot solve the debate. Developmental psychology shows that children are surprisingly good at tracking reliability (which Reductionists love) but also that they default to trusting caregivers (which Anti-Reductionists love). The empirical data underdetermines the normative question: *Ought* we default to trust, even if we *do*?

  The debate is stalled because it has reached the limit of "evidentialist" frameworks. Both sides assume justification is a matter of the relationship between a *subject* and a *proposition*. Reductionists say the link is forged by evidence; Anti-Reductionists say it is forged by a principle of rationality. Both ignore the **speaker**.

  ### 3. What Counts as Progress?

  Given this diagnosis, further tinkering with the reduction/anti-reduction distinction will yield diminishing returns. We should not expect progress from more empirical results (we know testimony is reliable but not infallible) or formal results (probability models just replicate the initial priors of the modeler).

  Progress requires a **category shift**. There are two viable paths forward that dissolve the dichotomy:

  #### A. The Assurance View (Second-Personal Epistemology)
  This is the most promising avenue for progress (championed by Richard Moran, Edward Hinchman, and Benjamin McMyler).
  *   **The Shift:** Stop asking "Does the hearer have evidence?" or "Does the hearer have an entitlement?" Start asking "What did the *speaker* do?"
  *   **The Mechanism:** When I tell you *p*, I am not just providing evidence that *p* is true. I am **assuring** you that *p* is true. I am inviting you to believe me, and in doing so, I take responsibility for the truth of *p*.
  *   **Why it solves the stalemate:** It bypasses the need for inductive evidence (satisfying Anti-Reductionists) but avoids blind entitlement because the justification is grounded in the speaker's explicit commitment to the hearer (satisfying Reductionist worries about responsibility). Justification becomes a **second-personal reason** ("I believe because *you* told me and vouched for it"), not a third-personal observation of reliability.

  #### B. Pragmatic Encroachment / Contextualism
  This path suggests the debate is context-sensitive.
  *   **The Shift:** The standards for testimonial justification vary based on the **stakes** and the **context of inquiry**.
  *   **The Mechanism:** In low-stakes environments (asking for the time), Anti-Reductionism holds (default trust). In high-stakes environments (medical advice, legal testimony), Reductionism holds (positive reasons required).
  *   **Why it solves the stalemate:** It acknowledges that both intuitions are correct in different domains. The "lonely knower" model applies to scientific verification; the "social knower" model applies to everyday conversation.

  ### Conclusion

  Your hypothesis was close: the debate is indeed a proxy for a deeper dispute. But it is not merely about the structure of justification (Internal/External); it is about the **ethics of belief in a social world**.

  *   **Diagnosis:** The debate is exhausted because it tries to solve a relational problem (speaker-hearer) using monadic tools (hearer's evidence vs. hearer's entitlement).
  *   **Prognosis:** No progress will be made within the current Reductionist/Anti-Reductionist framework.
  *   **Prescription:** Progress requires adopting the **Assurance View**. We must stop treating testimony as a form of evidence and start treating it as a form of **commitment**. If we do this, the question changes from "Am I justified in believing?" to "Has the speaker given me a right to believe?" This moves epistemology out of the solitary mind and into the space of reasons shared between agents.

  If you are looking for a research program, do not defend Reductionism or Anti-Reductionism. Argue that both are mistaken because they ignore the normative force of the speech act itself. That is where the live action is.
