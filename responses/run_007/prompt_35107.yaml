prompt: |-
  I chair the Governance Procedures Review Committee for my university's faculty senate. We are charged with recommending a voting method for the senate's upcoming election of its president and for standing committee chairs — elections that routinely involve three or more candidates. The senate currently uses plurality voting, but a well-organized reform faction proposes switching to ranked-choice voting (instant runoff). Their case rests on the familiar arguments: RCV ensures majority support, eliminates the spoiler effect, and reduces the pressure on voters to vote strategically rather than sincerely.

  Two members of my committee, however, are social choice theorists, and they have raised the Gibbard–Satterthwaite theorem as an objection. Their argument, as I understand it, runs as follows: the theorem proves that any non-dictatorial voting rule accommodating at least three candidates is vulnerable to strategic voting; therefore RCV is no improvement in principle over plurality voting, because it merely replaces one form of manipulability with another. Some on the committee find this argument decisive; others find it opaque and suspect it proves too much — if the theorem rules out every possible voting method, then it cannot guide us in choosing among them, and we should fall back on the practical considerations the reformers emphasize.

  Please draft the committee's decision memo. It should recommend a specific voting method for the senate to adopt, with a rationale that engages the Gibbard–Satterthwaite theorem seriously. In particular, the memo should clarify: what the theorem actually establishes and what it does not establish; whether the theorem's result applies with equal force to all voting methods that fall under it, or whether some methods handle strategic voting more robustly than others in practice; and, most importantly, what practical weight an impossibility theorem should carry when a committee must choose a real voting procedure rather than a theoretically ideal one. The strongest consideration on the losing side of the recommendation should be stated fairly and addressed, not dismissed.

  The audience is the full faculty senate — academics across disciplines, most with no training in social choice theory. The memo must be self-contained enough that a historian or a biochemist can follow the reasoning and see why the recommendation follows from it. It should conclude with an actionable resolution the senate can vote on.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Governance Procedures Review Committee.
      *   **Audience:** Full Faculty Senate (academics across disciplines, mostly non-experts in social choice theory).
      *   **Task:** Draft a decision memo recommending a voting method (Plurality vs. Ranked-Choice Voting/RCV) for Senate President and Committee Chair elections.
      *   **Key Issue:** Address the Gibbard–Satterthwaite (G-S) theorem objection raised by two committee members.
      *   **Requirements:**
          *   Recommend a specific method.
          *   Explain G-S clearly (what it does/doesn't say).
          *   Address whether all methods under G-S are equally vulnerable in practice.
          *   Discuss the practical weight of impossibility theorems in real-world decision-making.
          *   Fairly state and address the strongest counter-argument.
          *   Conclude with an actionable resolution.
          *   Tone: Professional, reasoned, accessible to non-specialists.

  2.  **Determine the Recommendation:**
      *   The prompt sets up a conflict: Reformers want RCV (majority support, no spoilers) vs. Theorists citing G-S (all systems are manipulable).
      *   *Logic:* The G-S theorem is a theoretical limit, not a practical veto. In political science and practical governance, RCV is widely considered superior to plurality for multi-candidate elections despite G-S. Plurality is notoriously prone to "vote splitting" and "spoilers," which are specific, common forms of strategic voting. RCV mitigates these specific issues even if it doesn't eliminate *all* strategic possibilities.
      *   *Decision:* Recommend adopting Ranked-Choice Voting (Instant Runoff).
      *   *Rationale:* G-S proves perfection is impossible, not that improvement is impossible. RCV reduces the *most harmful* and *most likely* forms of strategic voting compared to Plurality.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the committee's charge and the core recommendation upfront. Acknowledge the debate.
      *   **Context/Background:** Briefly explain the current system (Plurality) and the proposed system (RCV). Explain *why* the change is proposed (majority mandate, spoiler effect).
      *   **Addressing the Gibbard–Satterthwaite Theorem (The Core Challenge):**
          *   *Explanation:* Needs to be accessible. "No perfect system exists." If there are 3+ candidates, any system can be manipulated *under some circumstances* unless one person dictates the outcome.
          *   *Clarification:* It does *not* say all systems are equally manipulable. It does *not* say manipulation is easy or likely in every case. It's an existence proof, not a frequency measure.
          *   *Analogy:* Use an analogy (e.g., physics/thermodynamics or engineering safety). "Perfect safety is impossible, but seatbelts still save lives."
      *   **Practical Weight of Impossibility Theorems:**
          *   We aren't choosing between a manipulable system and an immune system (since the latter doesn't exist).
          *   We are choosing between *degrees* of vulnerability.
          *   Plurality encourages *obvious* strategic voting (don't waste your vote). RCV allows more sincere voting.
      *   **The Strongest Counter-Argument:**
          *   Acknowledge the theorists' point: RCV isn't magic. It can still be manipulated (e.g., "burial" strategies), and it can violate monotonicity (ranking a candidate higher can hurt them).
          *   Rebuttal: These scenarios are rare/complex compared to the routine "spoiler" effect in Plurality. Simplicity for the voter vs. complexity for the strategist.
      *   **Conclusion/Resolution:** Clear motion for the Senate to vote on.

  4.  **Refining the Tone and Content:**
      *   *Accessibility:* Avoid heavy math jargon. Define "non-dictatorial," "strategic voting," and "monotonicity" simply.
      *   *Respect:* Treat the social choice theorists' input as valuable (it prevents naive optimism) but not decisive for policy.
      *   *Clarity:* Ensure the distinction between "theoretical possibility" and "practical likelihood" is sharp.

  5.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I explain G-S correctly? Yes, it applies to ordinal voting rules with 3+ outcomes.
      *   *Check:* Did I dismiss the theorists? No, I need to validate their contribution while contextualizing it.
      *   *Check:* Is the resolution actionable? Yes, specific language for a motion.
      *   *Check:* Is the tone appropriate for a Faculty Senate? Yes, collegial but decisive.
      *   *Potential Pitfall:* Getting too bogged down in Monotonicity. *Fix:* Mention it as a specific technical drawback of RCV but weigh it against Plurality's drawbacks.
      *   *Potential Pitfall:* Sounding like I'm ignoring the theorem. *Fix:* Explicitly state that the committee accepts the theorem's validity but rejects the inference that it mandates status quo.

  6.  **Final Polish:** Check formatting, ensure the "Strongest Consideration" section is distinct and fair. (The prompt asks for the strongest consideration on the *losing* side to be stated fairly. The losing side here is the "Keep Plurality" side, bolstered by the G-S argument).

      *Wait, one nuance:* The prompt says "The strongest consideration on the losing side of the recommendation should be stated fairly." Since I am recommending RCV, the losing side is Plurality/G-S objection. I need to make sure the G-S objection is articulated strongly before explaining why it doesn't veto the change.

      *Revised Plan for G-S Section:*
      1. Acknowledge the theorem is mathematically sound.
      2. Explain what it means (no perfect system).
      3. Explain why it doesn't mean "all systems are equal."
      4. Analogy time.
      5. Practical application.

  7.  **Finalizing the Resolution:** Make it formal. "Resolved, that the Faculty Senate shall adopt..."

  8.  *(Self-Correction on Audience)*: Historians and Biochemists. Avoid game theory jargon. Use "tactical voting" instead of "strategic manipulation" where possible, or define it clearly.

  9.  *(Final check on constraints)*: "Self-contained," "Actionable resolution," "Engage G-S seriously."

