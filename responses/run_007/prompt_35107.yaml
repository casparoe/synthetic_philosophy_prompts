answer: |-
  **MEMORANDUM**

  **TO:** The University Faculty Senate
  **FROM:** Governance Procedures Review Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Methods for Senate Leadership Elections

  **1. Introduction and Recommendation**

  The Governance Procedures Review Committee was charged with evaluating the voting methods used for the election of the Faculty Senate President and Standing Committee Chairs. These elections frequently feature three or more candidates. Currently, the Senate uses **plurality voting** (each voter selects one candidate; the candidate with the most votes wins). A reform proposal suggests adopting **Ranked-Choice Voting (RCV)**, also known as Instant Runoff Voting.

  After reviewing testimony from reform advocates, current officeholders, and two committee members specializing in social choice theory, the Committee recommends that the Senate **adopt Ranked-Choice Voting** for all elections involving three or more candidates.

  This recommendation rests on the conclusion that while no voting system is theoretically perfect, RCV significantly reduces the most common and harmful forms of strategic voting present in our current system. The Committee believes this practical improvement outweighs the theoretical limitations identified by social choice theorems.

  **2. Background: Plurality vs. Ranked-Choice**

  *   **Current Method (Plurality):** Voters select one candidate. If three candidates run (A, B, and C) and support is split 35%-33%-32%, Candidate A wins with only 35% support. This often leads to the "spoiler effect," where two candidates with similar platforms split the vote, allowing a less popular candidate to win. It also pressures voters to vote *strategically* (voting for a "lesser evil" likely to win) rather than *sincerely* (voting for their actual favorite).
  *   **Proposed Method (Ranked-Choice Voting):** Voters rank candidates in order of preference (1st, 2nd, 3rd). If no candidate receives a majority of first-choice votes, the last-place candidate is eliminated, and their votes are transferred to the voters' next choices. This continues until one candidate commands a majority. This allows voters to support their favorite candidate first without fearing they are "wasting" their vote.

  **3. The Gibbard–Satterthwaite Theorem: Understanding the Objection**

  During our deliberations, two committee members raised a significant theoretical objection based on the **Gibbard–Satterthwaite theorem**. It is vital that the Senate understands this argument, its validity, and its limits.

  **What the Theorem Establishes**
  Proven independently in the early 1970s, this theorem is a foundational result in social choice theory. In plain language, it states that for any voting system with three or more candidates, one of three conditions must be true:
  1.  The system is **dictatorial** (one voter determines the outcome);
  2.  The system restricts voters to choosing between only **two candidates**; or
  3.  The system is **vulnerable to strategic voting** (there are scenarios where a voter can achieve a better outcome by lying about their preferences).

  Since our Senate elections are democratic (non-dictatorial) and often feature more than two candidates, the theorem proves that **some** vulnerability to strategic voting is mathematically unavoidable. There is no "perfect" voting method that eliminates tactical maneuvering entirely.

  **What the Theorem Does Not Establish**
  The Committee notes that some opponents of reform have interpreted this theorem to mean that *all* voting systems are equally flawed. **This is incorrect.** The theorem is an "impossibility result," proving that a perfect immune system does not exist. It is *not* a comparative measure of how easily different systems can be manipulated.

  To use an analogy from engineering: The laws of thermodynamics dictate that no engine can be 100% efficient. However, this does not mean a modern engine is no better than a steam engine from 1850. Similarly, while G-S proves no voting system is immune to manipulation, it does not prove that all systems are *equally* susceptible in real-world conditions.

  **4. Practical Weight of Impossibility Theorems**

  The Committee must choose a working procedure, not a theoretical ideal. In making this choice, we must weigh the *likelihood* and *impact* of strategic voting under each system.

  *   **Under Plurality:** Strategic voting is frequent, obvious, and high-stakes. The "wasted vote" dilemma is intuitive to every voter. If a voter prefers a minor candidate but fears a major candidate they dislike will win, they are strongly incentivized to abandon their sincere preference. This distorts election results and suppresses diverse viewpoints.
  *   **Under RCV:** Strategic voting is still theoretically possible (as G-S guarantees), but it is far more difficult to execute successfully. To manipulate an RCV election, a voter usually needs detailed knowledge of how others will vote and must engage in complex "burial" strategies (ranking a strong competitor artificially low). For the average voter, the safest and most effective strategy under RCV is usually to vote sincerely.

  Therefore, the Committee concludes that the Gibbard–Satterthwaite theorem should not paralyze decision-making. It reminds us to be humble about our rules, but it does not forbid us from choosing rules that make strategic voting harder and sincere voting easier.

  **5. The Strongest Counter-Argument**

  The Committee wishes to address the strongest argument against this recommendation fairly. The social choice theorists on our committee correctly note that RCV introduces a specific vulnerability known as **non-monotonicity**.

  In rare scenarios, ranking a candidate *higher* on your ballot can actually cause them to *lose*, or ranking them *lower* can cause them to *win*. This occurs due to the complex mathematics of vote transfers during elimination rounds. While this phenomenon is counter-intuitive and theoretically troubling, the theorists argue it undermines the claim that RCV is "fairer."

  **Committee Response:**
  We acknowledge this flaw. However, empirical studies of real-world RCV elections suggest non-monotonic outcomes are exceedingly rare (occurring in less than 1% of competitive elections). By contrast, the "spoiler effect" under plurality voting is common and routinely alters outcomes in multi-candidate fields.

  We are therefore choosing between a system with a **common, obvious flaw** (Plurality's spoiler effect) and a system with a **rare, complex flaw** (RCV's non-monotonicity). We believe it is better to eliminate the everyday pressure to vote strategically than to worry about a theoretical anomaly that rarely materializes.

  **6. Conclusion**

  The Gibbard–Satterthwaite theorem teaches us that perfection is impossible. It does not teach us that improvement is futile. Our current system systematically discourages sincere voting and frequently produces winners who lack majority support. Ranked-Choice Voting mitigates these specific issues, fostering a governance culture where coalition-building and broad support are rewarded.

  The Committee believes the Senate should prioritize practical robustness over theoretical purity. We recommend adopting RCV to ensure our leaders are elected by a majority of participating faculty, with minimal pressure to vote tactically.

  **7. Resolution**

  The Governance Procedures Review Committee moves the following resolution for adoption by the Faculty Senate:

  > **Resolved,** that the Faculty Senate shall amend its Governance Procedures to require the use of Ranked-Choice Voting (Instant Runoff) for all elections involving three or more candidates, specifically including the election of the Senate President and the Chairs of all Standing Committees.
  >
  > **Resolved,** that the Senate Administrative Office be directed to procure or configure electronic voting tools capable of securely administering Ranked-Choice ballots and tabulating results according to standard Instant Runoff protocols prior to the next election cycle.
  >
  > **Resolved,** that an educational campaign be undertaken to inform the faculty of how to rank candidates effectively before the first election held under this new system.

  ***

  **Attachment:** *Summary of Committee Vote (12-2 in favor of recommendation)*
