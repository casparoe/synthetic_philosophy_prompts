answer: |-
  This is a classic reconstruction of the **Disjunction Problem**, most famously articulated by Jerry Fodor against causal theories, but which applies with equal force to early versions of teleosemantics. You have correctly identified the pressure point: if content is fixed by historical correlation, and the correlations are co-extensive (in the history of the organism), then content is indeterminate.

  To save the selection-based picture (teleosemantics), you must reject **Step 5**.

  Step 5 claims: *"The selection history can't distinguish 'fly' from 'small dark moving speck'... the same history is equally consistent with the detector's having been selected to detect either."*

  Teleosemanticists (most notably Ruth Millikan and David Papineau) argue that this is false. Selection history *does* distinguish between the two, but not merely by looking at what triggered the mechanism. It distinguishes them by looking at **what explained the success** of the mechanism.

  Here is how you reject Step 5, how you save the theory, and what it costs you.

  ---

  ### 1. How to Reject Step 5: The "Normal Explanation"

  The error in Step 5 is assuming that selection cares only about the *trigger* of the state. In teleosemantics, selection cares about the *consequence* of the state relative to the system's **Proper Function**.

  Millikan's solution relies on the distinction between the **Producer** of the representation (the visual system) and the **Consumer** of the representation (the snapping/digestive system).

  *   **The Argument:** The frog's snapping mechanism was not selected merely because it was triggered by dark specks. It was selected because those triggers led to *nutrition* and *reproduction*.
  *   **Normal Conditions:** We must evaluate the function under "Normal Conditions" (capital N). Normal Conditions are the conditions that prevailed during the selection history *when the trait successfully performed its function*.
  *   **The Asymmetry:**
      *   When the detector fired at a **Fly**, the downstream systems (tongue, stomach) successfully processed it. This success explains why the detector persists.
      *   When the detector fires at a **Pellet**, the downstream systems fail (no nutrition, wasted energy). This does *not* contribute to the selection history.
  *   **The Content Fix:** The content is fixed by the condition that *makes the function succeed*. Since pellets do not make the function succeed (they don't nourish), they are not part of the "Normal Explanation" of the trait's existence. Therefore, the content is "Fly" (or "Nutritious thing"), not "Fly or Pellet."

  By rejecting Step 5, you assert that selection history is not a blind record of correlations; it is a record of **successful mappings** between the organism and the world. Pellets are noise because they fall outside the conditions under which the mechanism was selected to work.

  ### 2. What Does This Cost?

  Rejecting Step 5 saves the theory from the Disjunction Problem, but it forces you to pay a significant theoretical price. You can no longer hold a simple "causal correlation" view of content. Here are the three main costs:

  #### A. The Cost of Normativity (The "Normal" Problem)
  To make this work, you must lean heavily on the notion of **Normal Conditions**. You have to say: "The content is what the state corresponds to *under Normal Conditions*, even if it correlates with something else in abnormal conditions."
  *   **The Risk:** This introduces a modal/idealized element into naturalism. You are no longer just looking at what *did* happen (actual history); you are making claims about what *should* happen or what counts as the "standard" operation of the system.
  *   **The Challenge:** You must define "Normal" without smuggling in intentional terms. If you say "Normal conditions are those where the frog represents correctly," you are circular. You must define "Normal" purely biologically (e.g., "conditions under which the ancestor organisms survived"). This is difficult to cash out precisely without vagueness.

  #### B. The Cost of Specificity (The "Grain" Problem)
  Even if you distinguish "Fly" from "Dark Speck," you face a new disjunction problem.
  *   **The Issue:** Why is the content "Fly" and not "Protein Source" or "Small Moving Thing That Is Nutritious"?
  *   **The History:** In the selection history, every fly was a protein source, and every protein source caught was a fly. The selection history is equally consistent with the detector meaning *Protein* as it is with *Fly*.
  *   **The Cost:** To solve this, you must get very granular about the **Consumer**. You have to argue that the digestive system is specifically tuned to *fly chemistry*, not just generic protein. This ties your philosophy of mind tightly to specific empirical claims about evolutionary biology. If the biology turns out to be more general (e.g., the frog digests anything nutritious), your theory of content shifts accordingly. You lose the ability to determine content via armchair philosophy; it becomes an empirical biological question.

  #### C. The Cost of Complexity (Producer-Consumer Mapping)
  Simple teleology says: "The eye detects X." Sophisticated teleology (Millikan's) says: "The eye maps to the tongue/stomach, which expects X."
  *   **The Shift:** You are no longer analyzing a single state in isolation. You must analyze the **entire system** of production and consumption.
  *   **The Burden:** This makes the account much more complex. You cannot say "this neuron means fly." You must say "this neural state, in the context of this specific motor system and digestive history, has the function of coordinating a snap at a fly." Misrepresentation is no longer just a mismatch between mind and world; it is a mismatch between the Producer's output and the Consumer's expectations.

  ### Summary of the Trade-off

  | **If you keep Step 5** | **If you reject Step 5** |
  | :--- | :--- |
  | **Benefit:** Simple, purely extensional history. | **Benefit:** Saves misrepresentation; keeps teleosemantics alive. |
  | **Cost:** No error is possible (Disjunction Problem). | **Cost:** Must define "Normal Conditions" non-circularly. |
  | **Result:** Theory fails. | **Cost:** Content depends on downstream consumers, not just triggers. |
  | | **Cost:** Vulnerable to the "Grain/Specificity" problem. |

  ### Recommendation

  Reject **Step 5**, but accept that you are moving from a **Causal-Correlational** teleology to a **Functional-Consumer** teleology.

  Your revised premise 5 should read:
  *(5*) The selection history distinguishes 'fly' from 'speck' because only 'fly' figures in the **Normal Explanation** of the system's reproductive success. Pellets are deviations from the conditions under which the consumer systems were designed to operate.*

  This preserves the naturalistic core (it's still about selection history) but acknowledges that selection history is not just a list of triggers—it is a history of *successful functions*. The cost is that you must do the hard work of defining "Proper Function" and "Normal Conditions" without presupposing the very intentionality you are trying to explain. This is the central project of Millikan's *Language, Thought, and Other Biological Categories*, and while controversial, it is the standard exit route from the trap you have found.
