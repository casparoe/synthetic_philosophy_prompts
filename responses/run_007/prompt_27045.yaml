          2.  Function = Selection History.
          3.  Example: Frog snaps at flies, but also at pellets.
          4.  Intuition: Function = Fly, Pellet = Error.
          5.  Problem: Selection history correlates perfectly with "Fly" and "Small Dark Moving Speck" (SDMS).
          6.  Conclusion: Content is indeterminate or disjunctive (Fly OR SDMS), eliminating error.
          7.  Verdict: Teleosemantics fails because it can't handle misrepresentation.
      *   **User's Goal:** Keep the selection-based picture (teleosemantics) but find the flaw in the argument.
      *   **Task:** Identify which step to reject, explain the solution, and articulate the costs/implications of that rejection.

  2.  **Identify the Philosophical Context:**
