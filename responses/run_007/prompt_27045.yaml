      *   *Millikan's Move:* The frog's snapping mechanism was selected because it caught *nutritious flies*, not because it caught *pellets*. The "Normal Explanation" of the mechanism's survival involves flies, not pellets.
      *   *The "Normal Conditions":* Teleosemantics relies on "Normal Conditions" (capital N). The function is defined relative to the conditions under which the trait historically succeeded.
      *   *Distinction:* "Fly" explains the success. "SDMS" is too broad because most SDMSs (pellets, ash, shadows) do *not* lead to nutrition/reproduction. The selection pressure is specifically for the *nutritive* outcome associated with flies.
      *   *Refining the Content:* The content isn't just "Fly" vs. "SDMS". It's closer to "Nutritious thing at location L". But usually, it's framed as "Fly" because that's the historical cause of the success.
      *   *Asymmetry:* Flies cause success. Pellets do not. Therefore, the function is fixed by the successful cases, not the failed ones.

  5.  **Address the "Cost" (What does rejecting Step 5 entail?):**
