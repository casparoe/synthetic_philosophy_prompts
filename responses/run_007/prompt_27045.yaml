      *   *Step 4 (Intuition):* This is what we want to save (that pellets are errors).
      *   *Step 5 (The Indeterminacy Claim):* **This is the weak link.** This is where teleosemanticists (like Millikan and Papineau) fight back. They argue that selection history *can* distinguish between "Fly" and "SDMS" based on the *mechanism of success*, not just correlation.
      *   *Step 6 (The Conclusion):* Follows from 5. If 5 is false, 6 doesn't follow.
