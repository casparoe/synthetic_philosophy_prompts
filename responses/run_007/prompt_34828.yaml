answer: |-
  This is a fantastic problem to have, because it means you've identified the central thematic engine of your book. The debate you're describing isn't just historiographical; it's fundamentally dramatic. It's the conflict between Fate (Structure) and Free Will (Contingency).

  For a novel, choosing one exclusively usually weakens the other. If you go pure structural, the characters become puppets, and the tension drains away because the outcome is predetermined by sociology. If you go pure contingency, the war feels like a mistake rather than a tragedy, which can trivialize the scale of suffering that follows. The richest ground for fiction is actually the collision of the two: the feeling that the characters are running as hard as they can, making specific choices, only to find themselves swept up by a machine they helped build but can no longer control.

  Since your frame is the 1970s, you are perfectly positioned to exploit this. This was the era of the "Fischer Controversy" (structural German war guilt) clashing with A.J.P. Taylor's ideas (war by timetable/accident). Your historians aren't just arguing abstractly; they are arguing in the shadow of Vietnam, where questions of imperial overreach (structure) vs. specific policy blunders (contingency) were deeply personal.

  You don't need to resolve the philosophical question to write the book. In fact, resolving it would kill the mystery. The novel should feel like the war itself: a sense of looming inevitability punctuated by frantic, specific human attempts to stop it that fail for both structural and accidental reasons. You can dramatize the disagreement by tying each historian's professional view to their personal blind spots. The structuralist might be ignoring their own agency in their failing marriage; the contingencist might be refusing to see the systemic patterns ruining their career.

