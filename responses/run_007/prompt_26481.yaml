prompt: |-
  Okay so I've been having this recurring argument with a friend who's a computational linguist, and it's gotten to the point where we're just talking past each other. The core question is whether current LLMs actually understand language or are just doing something that mimics understanding really well. He's firmly in the stochastic parrots camp — says there's no there there, it's all just next-token prediction on steroids. I'm less sure, but I also don't want to be the guy who gets wowed by a chatbot and declares the singularity.

  I'd like you to approach this as a professional philosopher of mind who's been tracking the debate closely. I want your honest credence — a number between 0 and 1 — on this specific claim: "At least one currently deployed frontier LLM (think GPT-4, Claude 3.5 Sonnet, Gemini 1.5 Pro tier) genuinely understands natural language, in a sense of 'understanding' that most philosophers of language and mind would recognize as the real thing, even if it's not human-level understanding." Don't give me "it depends on your definition" — pick the definition you think is most defensible and run with it, just flagging where definitional choices matter.

  Then I want the decomposition. What are the sub-questions your credence hinges on? I'm imagining things like: Is a causal or externalist theory of meaning correct, or is some kind of use-theory or inferential-role semantics closer to the truth? Does genuine understanding require grounding in perception and action, or can it be purely linguistic? Are transformer architectures even in principle capable of implementing whatever the right theory of understanding requires? Does the training objective — next-token prediction — actually preclude understanding, or is it just a weird way to get there? Could scale alone close whatever gaps remain? Assign a rough probability to each sub-question, give a one-liner justification, show how they combine, and then tell me which one you're least confident about and what kind of evidence would shift it most.

  Before you commit to numbers, think out loud for a bit — I want to see you wrestle with it rather than just spit out answers.
