  *(Self-Correction Note)*: I need to make sure I don't get bogged down in the specific mechanics of the Prakash surgery (cataracts vs. corneal opacity) unless relevant. Stick to the perceptual outcome. The key is the *immediate* failure vs. *rapid* success.

