          *   *Philosophical Hook:* Spatial geometry is amodal. The *structure* of space is unitary. The delay in Held's study was due to attentional overload or cognitive load, not a fundamental lack of spatial understanding.
          *   *Nuance:* Maybe the "Yes" isn't about immediate *naming*, but immediate *recognition of structural invariance*. Or, argue that the rapid learning implies the connection was latent, just unmasked.
          *   *Better Angle for "Yes":* Focus on the *rapid learning*. If it takes 5 minutes, is that "immediate" in philosophical time? Also, challenge the interpretation of the failure. Did they fail to see the shape, or fail to map the word/task?
          *   *Refined "Yes" Argument:* The geometric properties (occlusion, shading, contour) specify depth *optically* (Gibsonian). The blind person understands depth via touch. The optical information is sufficient. The failure is a performance error, not a competence error.

      *   **The Deeper Puzzle (The "Common Currency"):**
          *   Does "sphere" mean the same thing to the hand and the eye?
