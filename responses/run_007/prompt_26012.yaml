          *   *Beyond the Data:* It's not just "Held said so." It's about the *format* of representation. Vision is retinotopic/egocentric initially; Touch is haptic/procedural.
          *   *Philosophical Hook:* The "Common Currency" problem. Shape isn't a universal abstract object; it's a modality-specific affordance. The visual system needs to *calibrate* to the haptic system. The failure isn't a lack of *concept*, it's a lack of *translation manual*.
          *   *Neuro Angle:* V1 vs. Somatosensory cortex. Different maps.

      *   **The "Yes" Character (Let's call him Marcus):**
