      *   **Overall Judgment:** Who is *more* defensible?
          *   *Standard Legal Theory:* Aldrich is correct. (Hart, Kelsen).
          *   *Nomic Specifics:* Suber's analysis suggests that while Aldrich is logically consistent, Nomic allows for "self-amendment" that might seem paradoxical. However, the *standard* interpretation of Nomic (and legal systems generally) is that the current rule governs its own amendment.
          *   *Crucial Distinction:* Moran argues the rule becomes "entrenched." Aldrich argues it's just "procedurally protected." Entrenchment implies *impossibility*. Protection implies *difficulty*. Since 2/3 is possible, it's not immutable. Therefore, Moran's claim that it contradicts Nomic's premise is weak.
          *   *The "60%" Factor:* The fact that 60% wanted it doesn't matter if the rule says 66%. If 60% could change a 66% rule, then the 66% rule never existed effectively.
          *   *Conclusion:* Aldrich is legally/logically stronger. Moran identifies a philosophical tension but proposes a solution (ignoring the current threshold) that destroys the game's structure.
          *   *Nuance:* I need to mention that Nomic *can* include rules that allow for "revolutionary" changes, but absent such a rule, Aldrich holds.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Nomic have a specific rule about this?* The prompt implies a generic Nomic scenario based on Suber's literature. Suber's book *The Paradox of Self-Amendment* is the key reference. Suber argues that self-amendment is logically possible *if* the rule permits it. But does the rule permit it using the *new* standard or the *old*?
      *   *The "Bootstrapping" Problem:* You can't pull yourself up by your bootstraps. You need ground to stand on. The ground is the current rule.
      *   *Moran's "Privilege" Argument:* Moran says treating the amendment rule as binding makes it "fundamental." Aldrich would say *all* rules are binding until changed. The amendment rule isn't special; *every* rule requires its own conditions to be changed. If Rule X says "X changes with 90% vote," you need 90%. If Rule Amendment says "Amendment changes with 2/3," you need 2/3. It's not privileged; it's consistent.
      *   *Verdict:* Aldrich is right on the logic of rules. Moran is right on the spirit of democracy, but democracy in Nomic is defined by the rules.
      *   *Final Decision:* Aldrich is more defensible within the context of a rule-based system. Moran's argument leads to infinite regress or chaos (which rule applies to the vote? The new one? But the new one isn't valid yet. The old one? Then Aldrich is right.).

