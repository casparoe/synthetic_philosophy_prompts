      *   **The Scenario:** Rule A says "Amendments require 2/3 vote." A motion proposes changing Rule A to "Amendments require simple majority." The vote is 60% (Majority yes, < 2/3 yes). Did it pass?
      *   **Aldrich's Position:** No. You must follow the rule *as it exists* at the time of the vote. Self-reference doesn't negate current validity. Analogy: Constitutional law.
      *   **Moran's Position:** Yes (or at least, Aldrich's logic is flawed). If Aldrich is right, the amendment rule is entrenched/immutable, violating Nomic's core premise (mutability). The players' sovereignty (majority will) should trump procedural catch-22s. The rule shouldn't be privileged.
      *   **Task:** Analyze the exchange move-by-move, assess who wins each point, and provide an overall judgment on which position is more defensible.

  2.  **Deconstruct the Arguments (Move-by-Move):**

      *   **Move 1: The Core Dispute (The Vote)**
          *   *Scenario:* 60% vote to change threshold from 66% to 50%.
          *   *Aldrich:* Failed. Old rule applies to the vote changing the old rule.
          *   *Moran:* Problematic. Makes the rule immutable. Violates Nomic spirit.
          *   *Analysis:* This is the classic "Amendment Paradox." Aldrich relies on temporal priority (status quo ante). Moran relies on systemic coherence (mutability).

      *   **Move 2: Aldrich's Self-Reference/Constitutional Analogy**
          *   *Aldrich:* It's not a paradox, just self-reference. Constitutions work this way. You use the existing key to change the lock.
          *   *Moran:* Analogy fails. Constitutions have hierarchies (fundamental vs. ordinary). Nomic doesn't. Treating the amendment rule as hard-to-change makes it *de facto* fundamental without text.
          *   *Analysis:* Aldrich is legally sound (standard jurisprudence). Moran is philosophically sound regarding Nomic's specific design (radical mutability).

      *   **Move 3: Moran's Sovereignty Argument**
          *   *Moran:* 60% want it. Players are sovereign. Will > Procedure.
          *   *Aldrich:* (Implied counter) Rules define sovereignty. Without rules, it's anarchy, not Nomic.
          *   *Analysis:* This touches on the "Rule of Recognition" (Hart). If the players *are* the source of validity, can they override procedure?

  3.  **Evaluate the Philosophical/Legal Underpinnings:**

      *   **Nomic's Nature:** Peter Suber's *Nomic* is explicitly designed to explore paradoxes of self-reference and legal systems. The initial ruleset (Rule 1-10) usually establishes mutability.
      *   **The Paradox:** This is a variation of the "Paradox of Sovereignty" or the "Amendment Paradox."
      *   **H.L.A. Hart:** Distinguishes between primary rules (conduct) and secondary rules (change/adjudication). The amendment rule is a secondary rule. Can a secondary rule change itself? Yes, but usually according to its own terms.
      *   **Hans Kelsen:** The *Grundnorm* (Basic Norm). If the Basic Norm changes, the system changes.
      *   **Suber's Own View:** Peter Suber has written about this. In *The Paradox of Self-Amendment*, he explores this exact issue. He generally leans towards the idea that logical consistency requires the old rule to apply, *unless* the system allows for "revolutionary" changes outside the rules. However, Nomic is designed to be *fully* mutable.
      *   **The "Entrenchment" Issue:** If a rule requires 2/3 to change, and that requirement applies to itself, it is *procedurally* entrenched, but not *logically* immutable. You can still change it if you get 2/3. It's just harder. Moran claims this makes it "effectively unchangeable," but that's only true if you can't get 2/3. In this specific case, they *didn't* get 2/3. So, is it immutable? No, just unamended *this time*.
      *   **Moran's Error:** Moran conflates "hard to change" with "immutable." The fact that they failed to get 2/3 means the system worked as designed. The rule isn't privileged; it just sets a high bar.
      *   **Aldrich's Strength:** He adheres to the rule of law. If you ignore the current rule to change the current rule, you break the chain of validity.
      *   **Moran's Strength:** He identifies the tension in Nomic between "rule-following" and "player sovereignty."

