prompt: |-
  So I've been covering global development for a few years now, and I've gotten to know the numbers pretty well — GiveWell-type stuff about how far a dollar goes on malaria nets or vitamin A supplements. Recently I've been working on a piece about cost-effectiveness, and it's gotten under my skin in a way it hadn't before. The math is basically that for something like five grand, you can pretty reliably prevent a child from dying. I'm not wealthy but I'm a journalist in a rich country, I have that much. But here's the thing: I was about to use that exact amount to finally fix the foundation on my house, which has been causing problems for years. Not a luxury exactly but also not life-or-death.

  My partner thinks I've lost the plot. She says I didn't cause any of those kids to be sick, I don't know them, and if I started giving away every spare dollar until it hurt I'd burn out in six months and stop giving anything. She says theres a difference between helping someone right in front of you — like if our neighbor's kid was choking we'd do the Heimlich, obviously — and feeling responsible for statistical lives on another continent.

  And honestly I don't know what to say to that. It feels wrong to just shrug and fix the foundation. But I also don't know if that feeling is just guilt that I should get over, or if its tracking something real about what I owe. How do I think about this?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User:** A journalist covering global development. Knowledgeable about cost-effectiveness (GiveWell, malaria nets, etc.). Not wealthy but comfortable (has $5k spare).
      *   **The Dilemma:** $5k can save a life (statistically) via effective charity *OR* fix their house foundation (a significant personal need, not luxury, but not life-or-death).
      *   **The Conflict:** Intellectual understanding of effective altruism (EA) vs. personal well-being/burnout vs. partner's pushback.
      *   **Partner's Argument:** Proximity matters (neighbor choking vs. statistical lives), no causal responsibility for distant suffering, risk of burnout if giving "until it hurts."
      *   **User's Feeling:** Guilt, uncertainty about moral obligation ("what I owe").
      *   **Goal:** Help the user think through this ethical dilemma without being preachy, dismissive, or overly prescriptive. Provide a framework for decision-making.

  2.  **Deconstruct the Ethical Frameworks:**
      *   *Effective Altruism (EA):* Maximize good per dollar. $5k = ~1 life saved (roughly). Strong obligation to give until marginal utility equals.
      *   *Common Sense Morality/Partiality:* We have special obligations to ourselves and our loved ones. Proximity matters psychologically, if not morally.
      *   *Sustainability:* Burnout helps no one. Long-term giving > short-term self-sacrifice.
      *   *The "Foundation" Issue:* It's not a luxury. A damaged foundation affects safety, property value, stress, and future financial stability.

  3.  **Evaluate the Partner's Points:**
      *   *Burnout:* Valid. Radical self-sacrifice often leads to quitting.
      *   *Proximity/Responsibility:* Philosophically debatable (Peter Singer would disagree), but psychologically real. We aren't robots.
      *   *Causal Responsibility:* True, but EA argues capability creates responsibility, not just causality.

  4.  **Evaluate the User's Feelings:**
      *   The guilt is a signal. It shouldn't be ignored, but it shouldn't dictate action without scrutiny.
      *   The "journalist" aspect: They cover this beat. Does that create a *professional* obligation or just heightened awareness?

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the weight of this. It's a classic "Singer's Drowning Child" scenario but personalized. It *should* feel heavy. Don't dismiss the guilt.
      *   **Reframing the Foundation:** Is it really just "personal comfort"? A cracked foundation can lead to mold, structural failure, loss of asset value. It's an investment in future stability, which enables future giving.
      *   **Addressing the Partner's Argument:**
          *   *Burnout:* She's right about sustainability. Marathon, not sprint.
          *   *Proximity:* Distinguish between *moral* weight and *psychological* capacity.
      *   **The "Journalist" Angle:** Does their role change things? Maybe their work *is* the contribution (shining a light), and financial stability supports that work.
      *   **Middle Ground/Compromise:** It doesn't have to be all or nothing. Can they split the $5k? Can they fix the foundation *and* give something?
      *   **Long-term Strategy:** Instead of a one-off crisis decision, build a policy (e.g., give 10% always). This reduces decision fatigue.
      *   **Philosophical Nuance:** Mention "satisficing" vs. "maximizing." You don't have to be a saint to be good.

  6.  **Refining the Tone:**
      *   Empathetic, thoughtful, non-judgmental.
      *   Avoid saying "You must give" or "You must fix the house."
      *   Focus on *sustainability* and *integration* of values.
      *   Acknowledge the specific tension of working in the field (compassion fatigue).

  7.  **Key Considerations to Include:**
      *   *The "Life-Saving" Math:* Gently nuance the "$5k saves a life" claim. It's probabilistic, not guaranteed. (Important for managing expectations).
      *   *Asset Protection:* The house is likely their biggest asset. Neglecting it could lead to poverty, reducing future giving capacity.
      *   *Moral Licensing:* Beware of thinking "I wrote about it, so I don't have to pay for it."
      *   *The "Enough" Threshold:* Defining what "enough" security looks like.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest they give the $5k and rent? *Correction:* No, that's too prescriptive and ignores the partner's stance.
      *   *Initial thought:* Cite Peter Singer. *Correction:* Keep it practical. The user knows the theory; they need help applying it to *their* life.
      *   *Check:* Did I address the partner's "neighbor choking" analogy? *Yes,* need to explain why statistical lives feel different but matter morally.

  9.  **Final Polish:** Organize into clear thematic points. End with a supportive conclusion. (This aligns with the structure of the final output).

  **(Self-Correction Note):** I need to be careful not to validate the "statistical lives aren't real" argument too much, as the user knows they are real. The partner's point is more about *psychological capacity* and *scope of obligation*. I should frame it that way.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is one of the hardest, most honest questions a person in your position can ask. You are standing right at the intersection of abstract moral philosophy and concrete lived reality. It is completely understandable that this is "getting under your skin." In fact, if it *wasn't* getting under your skin, given what you know, that would be the worrying part.

  You are describing the classic tension between **Effective Altruism (EA)** and **Common Sense Morality**, but you are living it, not just theorizing it. Your partner is arguing from the standpoint of sustainability and psychological realism; you are arguing from the standpoint of moral consistency. Both of you are pointing at real things.

  Here is a framework for thinking through this without burning out or dismissing your values.

  ### 1. Nuance the "Life-Saving" Math
  You mentioned that for $5,000 you can "pretty reliably prevent a child from dying." As a journalist in this space, you know the numbers better than most, but it is worth reminding yourself of the probabilistic nature of that claim.
  *   **It is not a transaction:** You are not buying a specific child's life for $5k. You are funding an intervention that reduces risk across a population.
  *   **The counterfactual:** If you don't give the $5k, a specific child does not necessarily die. The funding might come from elsewhere, or the program might run slightly less effectively.
  *   **Why this matters:** This isn't to talk you out of giving. It is to lower the stakes from "I am choosing to kill a child by fixing my floor" to "I am choosing between two high-value uses of capital." One saves lives abroad; one secures your own stability. Framing it as a direct causal link increases guilt without increasing accuracy.

  ### 2. The Foundation as Future Capacity
  Your partner's argument about burnout is crucial, but there is also a pragmatic argument for fixing the foundation.
  *   **Asset Preservation:** For most people, a home is their primary store of wealth. Letting a foundation degrade can lead to catastrophic structural issues later, costing $50k instead of $5k. If you lose your financial stability, your ability to give *anything* in the future disappears.
  *   **Psychological Bandwidth:** Living with structural anxiety (literally and figuratively) drains cognitive resources. If fixing the foundation allows you to work more effectively as a journalist, you might amplify good *through your work* in a way that outweighs the one-time donation.
  *   **The "Oxygen Mask" Principle:** You cannot pour from an empty cup. Securing your own base of operations is not necessarily selfish; it is maintenance of the machine that does the good.

  ### 3. Proximity and "The Neighbor"
  Your partner's analogy about the choking neighbor is the standard defense of partiality. Philosophically, Peter Singer would say the distance doesn't matter. Psychologically, however, your partner is right: **We are not built to live in a state of constant emergency response.**
  *   If you treated every statistical death as an immediate emergency (like the choking neighbor), you would indeed burn out in six months.
  *   Moral obligations must be sustainable to be virtuous. A martyr helps no one. A sustainable donor helps for decades.
  *   There is a moral difference between *negligence* (ignoring a choking neighbor) and *allocation* (deciding how to distribute limited resources over a lifetime). You are in the allocation phase, not the emergency phase.

  ### 4. The Danger of the "All or Nothing" Trap
  The guilt you feel often stems from the idea that unless you give *everything* spare, you are doing *nothing* good. This is a cognitive distortion.
  *   **Satisficing vs. Maximizing:** Do you need to be the *best* possible moral agent (maximizing), or a *good enough* one (satisficing)? Most ethical systems allow for a "personal prerogative" to spend some resources on yourself and your loved ones.
  *   **The Policy Approach:** Instead of facing this crisis decision every time you have $5k, consider adopting a **giving policy**. For example, commit to giving 10% or 20% of your income effectively, no matter what.
      *   If you have a policy, the $5k decision isn't a moral failure; it's part of a larger portfolio.
      *   This protects you from decision fatigue and protects your partner from fearing you'll give away the rent money next time.

  ### 5. Your Role as a Journalist
  You have a specific lever that most donors don't: **Amplification.**
  *   If you write a piece that convinces *one* wealthy donor to give $100k effectively, you have done more good than giving your own $5k.
  *   To do that work well, you need credibility and stability. If you are living in financial precarity or domestic stress, your journalism may suffer.
  *   However, be wary of "moral licensing"—the idea that *writing* about the problem absolves you of *funding* the solution. The answer isn't to give nothing because you write; it's to find a balance where you do both.

  ### A Proposed Path Forward
  You don't have to choose between "Saint" and "Selfish." Try to find the **Sustainable Steward**:

  1.  **Fix the Foundation:** Acknowledge that securing your home is a valid moral priority because it preserves your future capacity to help.
  2.  **Make a Significant Gift Anyway:** Can you fix the foundation and still give *something*? Even $500 or $1,000 to a top charity signals commitment without triggering the burnout your partner fears. It breaks the "all or nothing" spell.
  3.  **Formalize Your Giving:** Sit down with your partner and agree on a percentage of income or windfalls that goes to effective charity automatically. This makes it a shared value, not a source of conflict.
  4.  **Forgive Yourself:** The guilt you feel is a signal of your empathy, not necessarily a verdict on your actions. You did not create the global inequality that makes $5k worth so much more elsewhere. You are just one person navigating a broken world.

  If you fix the foundation, you are not choosing to let a child die. You are choosing to remain a stable, functional human being who can continue to care about these issues for the next 30 years, rather than flaming out in 6 months. That is a valid moral calculation.
