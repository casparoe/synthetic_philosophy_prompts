answer: |-
  This is one of the most honest and penetrating questions one can ask about the state of analytic philosophy. You have correctly identified that the Newcomb impasse is not a standard philosophical disagreement. Usually, when philosophers disagree for fifty years, it is because they disagree about the facts, the metaphysics, or the definitions. In Newcomb's Problem, as you note, the protagonists agree on the payoff matrix, the causal structure, and the reliability of the predictor.

  If the inputs are identical and the logic is valid on both sides, the divergence must stem from a deeper stratum of the theoretical framework. Here is a diagnosis of the structure of the impasse, the nature of the disagreement, and the prospects for resolution.

  ### 1. The Diagnosis: It Is Not Verbal, It Is Teleological

  It is tempting to dismiss the debate as verbal—that "rationality" means *instrumental success* to one-boxers and *procedural correctness* to two-boxers. While there is truth to this, it is too shallow. Both sides know this distinction exists. The two-boxer does not say, "I will lose money, but I am rational." They say, "I am taking the action that *makes sense* to take, and if the universe punishes sense, that is a problem with the universe, not my decision theory."

  The disagreement is **teleological**. It is a clash over the *purpose* of decision theory.

  *   **The One-Boxer's Telos:** Decision theory is a guide to **winning**. Its function is to navigate the world such that the agent secures the best possible outcome. If a theory consistently leads to less money in a scenario you knew was coming, the theory is defective. For them, rationality is fundamentally about *efficacy*.
  *   **The Two-Boxer's Telos:** Decision theory is a guide to **agency**. Its function is to delineate the relationship between an agent's will and the physical world. Since the agent cannot causally influence the past, a theory that suggests they can (even via correlation) is asking them to engage in magical thinking. For them, rationality is fundamentally about *causal integrity*.

  When you teach this, you are not just teaching a puzzle; you are forcing students to choose between valuing *outcomes* over *process* or *process* over *outcomes*. This is why they don't switch sides. Switching sides requires a shift in what they value most in the concept of "rational action."

  ### 2. The Hidden Claim: The Metaphysics of Counterfactuals

  You asked if there is a hidden empirical or formal claim buried in the disagreement. There is. It lies in the **semantics of counterfactuals**.

  Both sides use conditional reasoning, but they are evaluating different conditionals.
  *   **Two-boxers (CDT)** evaluate: "If I *were to do* X, what would happen?" They hold the past fixed. In this closest possible world, Omega's prediction is already made. Therefore, my choice now changes nothing about the box contents.
  *   **One-boxers (EDT)** evaluate: "If I *do* X, what is the probability of Y?" They treat the choice as evidence. In the set of worlds where I do X, Omega likely predicted X.

  The hidden claim is about **logical dependence vs. causal independence**.
  The two-boxer assumes that because there is no *causal* arrow from Choice to Prediction, there is no *relevant* dependency for decision-making. They treat the agent as a "causal atom."
  The one-boxer assumes that if the prediction is reliable, there is a *logical* or *subjunctive* dependency between the algorithm producing the choice and the algorithm producing the prediction. They treat the agent as an instance of a computational pattern.

  The impasse persists because standard decision theory (both CDT and EDT) lacks the vocabulary to formally adjudicate the status of **logical counterfactuals**. CDT says they don't exist. EDT says they are just probabilities. Neither fully captures the intuition that "If I am the kind of agent who one-boxes, Omega predicts that" is a fact about the *structure of the situation*, not just a correlation.

  ### 3. Why Argument Fails: The "Reflective Equilibrium" Trap

  The reason the literature is stuck is that both positions are in **reflective equilibrium** with different sets of deep intuitions.

  *   **The Two-Boxer's Intuition:** "I cannot change the past." This is a bedrock metaphysical intuition. To deny it feels like accepting backward causation or magic. Any argument for one-boxing looks like an argument for superstition.
  *   **The One-Boxer's Intuition:** "I want the money." This is a bedrock pragmatic intuition. To deny it feels like worshipping a ritual (taking both boxes) that guarantees poverty. Any argument for two-boxing looks like an argument for losing on principle.

  When you argue against a two-boxer, you attack their metaphysical intuition. When you argue against a one-boxer, you attack their pragmatic intuition. Neither intuition is provable; they are the axioms upon which their respective decision theories are built. Consequently, arguments simply bounce off. The two-boxer hears the one-boxer and thinks, "You don't understand causality." The one-boxer hears the two-boxer and thinks, "You don't understand winning."

  ### 4. Can It Be Resolved?

  If the above diagnosis is correct, the impasse is **fundamentally unresolvable within the current paradigm**.

  We cannot prove that "winning" is more important than "causal integrity," nor can we prove the reverse. These are normative priors. However, there are two paths that *might* dissolve the problem, though neither has succeeded in converting the majority of the profession yet.

  **Path A: A New Formalism (Functional Decision Theory)**
  In recent years, researchers (notably in the rationalist/alignment community, e.g., Yudkowsky, Soares) have proposed **Functional Decision Theory (FDT)**. FDT attempts to formalize the "logical dependency" intuition. It argues that you should decide as if you are selecting the output of a function, knowing that Omega's prediction is the output of a similar (or identical) function.
  *   *Pros:* It mathematically recovers the one-boxing payoff without violating causal structure (by shifting the locus of decision from the physical act to the logical algorithm).
  *   *Cons:* It requires accepting a controversial metaphysics of "logical counterfactuals" that many mainstream philosophers reject as incoherent. It hasn't penetrated the mainstream philosophy journals enough to shift the consensus.

  **Path B: Decision Theoretic Pluralism**
  The other resolution is to accept that there is no single "Rationality." There is **Causal Rationality** and **Evidential Rationality**.
  *   If you want to be the kind of agent who never acts on correlations without causal mechanisms, be a Two-Boxer.
  *   If you want to be the kind of agent who ends up rich in Newcomb-like scenarios, be a One-Boxer.
  *   *Implication:* This admits that "Rationality" is not a natural kind. It is a cluster concept. The debate persists because people are fighting over which cluster gets to own the word.

  ### 5. Implications for Decision Theory

  If you accept that this impasse is unresolvable because it rests on incompatible normative priors, the implications for your field are significant:

  1.  **Decision Theory is Not Physics:** We often treat decision theory as if it were a search for the "laws of rational motion," analogous to Newton's laws. Newcomb's Problem suggests it is more like **Ethics**. Just as Deontology and Consequentialism agree on the facts but disagree on the verdict due to foundational values, CDT and EDT agree on the setup but disagree on the verdict due to foundational norms.
  2.  **The "Ideal Agent" is Underdetermined:** There may be no unique mathematical specification for an "ideal rational agent." There may only be agents optimized for different environments. CDT agents thrive in causal worlds; EDT/FDT agents thrive in worlds with predictors or logical correlations. Since we don't know for sure which kind of world we inhabit (or how to formalize "logical correlation" in physical law), the theory remains incomplete.
  3.  **Pedagogical Shift:** In your seminar, you might stop trying to lead students to the "correct" answer. Instead, frame Newcomb's Problem as a **Rorschach test for metaphysical commitment**. The value of the problem isn't the solution; it's that it forces the student to locate their own breaking point between causal intuition and pragmatic desire.

  ### Summary

  The disagreement is not verbal, nor is it empirical in the standard sense. It is a **normative clash regarding the primacy of causal structure versus outcome optimization**, underpinned by a **metaphysical disagreement about the nature of counterfactual dependence**.

  It is likely unresolvable because it asks us to choose between two bedrock intuitions that are mutually irreducible. This implies that Decision Theory, at its foundations, is not a single unified science but a landscape of competing normative frameworks, each valid relative to its own axioms of agency. The stagnation you feel is not a failure of argumentation; it is the sound of two ships passing in the night, sailing toward different definitions of what it means to be an agent.
