answer: |-
  Dear friend, it is completely understandable that you are finding the usage of this phrase confusing in your seminar, because esse est percipi is one of those philosophical slogans that is often stripped of its original context and repurposed to do heavy lifting in arguments where it does not quite fit. To get clear on what is happening in your classroom, it helps to distinguish between the epistemic readings, which concern how we know things exist, and the ontological readings, which concern what existence actually is. The most modest interpretation of the claim is essentially verificationist, suggesting that for a statement about existence to be meaningful, it must be possible to verify it through perception. On this reading, the slogan does not necessarily deny that unperceived objects exist, but rather claims that we cannot coherently assert their existence if they are in principle beyond any possible perception. This view has a certain historical plausibility given its role in logical positivism, but most contemporary philosophers find it too restrictive because it struggles to account for theoretical entities or past events that are no longer perceivable. Regarding your colleague's objection to dark matter, this verificationist reading would only license the objection if one argues that dark matter is in principle unverifiable, but since dark matter is posited to explain perceived gravitational effects, this modest reading does not actually rule it out.

  Moving toward a more radical position, we encounter the ontological interpretation known as subjective idealism, which claims that the very substance of reality consists in being perceived by a mind. Here, the slogan is not about knowledge but about being itself, implying that there is no mind-independent matter and that objects are merely collections of ideas or sensations. This reading is far less plausible to most modern thinkers because it conflicts with the scientific consensus that the universe existed before conscious observers evolved, though it remains a logically coherent position if one is willing to accept its counterintuitive consequences. If your seminar mate is operating under this specific reading, they might argue against dark matter by claiming that since dark matter is defined as non-interacting with light and thus lacking direct sensory qualities, it cannot be part of the mental fabric of reality. However, this is still a shaky argument because idealism does not necessarily deny unperceived causes, only unperceivable substances.

  The most precise reading, and the one George Berkeley actually held, adds a theological dimension to the ontological claim to avoid the absurdity of objects popping in and out of existence when humans look away. Berkeley argued that while finite minds do not perceive everything constantly, the infinite mind of God perceives all things continuously, thereby sustaining their existence even when no human is looking. This version is internally consistent within a theistic framework and saves the phenomena of a stable world, making it more plausible than subjective idealism alone, though it naturally depends on the acceptance of God's existence. Under this Berkeleyan reading, the objection to dark matter collapses entirely, because dark matter would simply be part of the ideas perceived by God, even if humans cannot directly sense it. Consequently, the only reading that actually licenses the dark matter objection is a crude hybrid of verificationism and subjective idealism that ignores both scientific inference and the theological loophole, insisting that existence requires direct human sensory contact. This is likely the baffling argument you heard, as it treats the slogan as a prohibition against theoretical entities rather than a metaphysical thesis about the nature of substance. I hope this helps you navigate the discussion next time you meet.

  Best wishes
