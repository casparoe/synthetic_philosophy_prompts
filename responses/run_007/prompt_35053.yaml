answer: |-
  A game theory professor is giving a lecture on the Dollar Auction.

  "The mechanics are simple," he tells the class. "The highest bidder wins the dollar, but the second-highest bidder must pay their bid and gets nothing. This creates a trap where rational players escalate bids beyond a dollar to minimize their losses. The only winning strategy is to never place the first bid."

  Suddenly, his phone buzzes. He glances at the text, turns pale, and starts shoving his notes into his bag.

  "Class dismissed," he announces, rushing for the door.

  "Why?" a student calls out. "Is everything okay?"

  "My wife just texted me," the professor yells over his shoulder. "She bid 99 cents on a dollar, and I'm currently the second-highest bidder at 98 cents."

  "So walk away!" the student says. "You'll only lose 98 cents."

  The professor stops at the exit, horrified. "Are you insane? If I quit, I lose 98 cents. If I bid $1.00, I break even. It's the only rational move!"

  "But then she'll be second at 99 cents!" the student argues. "She'll bid $1.01!"

  "I know!" the professor screams, sprinting down the hall. "That's why I have to bid $1.02!"
