answer: |-
  # Joint Statement on Moral Discourse and Metaphysics

  ### I. Agreed Claims
  1. Moral sentences like "torturing cats is wrong" are assertible and play a central, non-negotiable role in practical deliberation.
  2. Moral disagreements are genuine conflicts requiring resolution, not merely clashes of taste like preferring vanilla over chocolate.
  3. Moral reasoning follows logical rules; we can validly infer conclusions from moral premises.
  4. There are standards for correct and incorrect moral judgment, and some agents are objectively mistaken in their moral views.
  5. The word "true" can be applied to moral claims in ordinary discourse without grammatical error or category mistake.

  ### II. Table of Disagreements

  | Issue | Robust Moral Realist Formulation | Expressivist Formulation |
  | :--- | :--- | :--- |
  | **Semantic Function** | Moral sentences primarily function to represent states of affairs involving normative properties. | Moral sentences primarily function to express non-cognitive, conative attitudes (plans, norms, commitments). |
  | **Metaphysical Ground** | The truth of some moral claims depends on mind-independent normative facts that obtain regardless of our attitudes. | The "truth" of moral claims is a projection of our practical stances; there are no normative properties existing independently of human valuation. |
  | **Mental State** | Making a moral judgment is fundamentally a matter of holding a belief about the way the world is. | Making a moral judgment is fundamentally a matter of adopting a practical stance toward the world. |

  ### III. Cruxes and Predictions

  **Crux 1: The Frege-Geach Problem (Logic in Embeddings)**
  *   **Question:** Does the word "wrong" contribute the same semantic content when embedded in a conditional ("If stealing is wrong...") as it does in an assertion ("Stealing is wrong")?
  *   **Concrete Case:** Evaluating the validity of the argument: (1) If stealing is wrong, then getting your brother to steal is wrong. (2) Stealing is wrong. (3) Therefore, getting your brother to steal is wrong.
  *   **Realist Prediction:** The argument is valid because the term "wrong" refers to the same property in both premises, preserving truth from premises to conclusion.
  *   **Expressivist Prediction:** The argument is valid because accepting the premises while rejecting the conclusion entails a clash of attitudes (inconsistency in planning), not necessarily a contradiction in descriptive beliefs.

  **Crux 2: Motivational Internalism**
  *   **Question:** Is there a conceptual connection between judging an act wrong and being motivated to avoid it?
  *   **Concrete Case:** The "Amoralist" thought experiment: A person who sincerely asserts "torturing cats is wrong" but feels no motivation whatsoever to stop doing it and no blame toward others who do.
  *   **Realist Prediction:** The Amoralist is conceptually possible; moral judgments are beliefs which, like other beliefs, require a separate desire to motivate action.
  *   **Expressivist Prediction:** The Amoralist is conceptually incoherent or is not actually making a moral judgment; to judge wrong *just is* to be in a motivational state of opposition.

  **Crux 3: The Nature of Truth (Verbal vs. Substantive)**
  *   **Question:** When we say a moral claim is "true," are we describing a robust relation to reality or merely endorsing the claim?
  *   **Concrete Case:** Analyzing the sentence "It is true that torture is wrong" compared to "It is true that snow is white."
  *   **Realist Prediction:** "True" functions univocally; both sentences assert a correspondence between language and mind-independent reality.
  *   **Expressivist Prediction:** "True" functions minimally; saying it is "true" that torture is wrong is just a way of re-asserting the attitude that torture is wrong, without positing extra metaphysical objects.

  ### IV. Note on Verbal Disputes
  We explicitly acknowledge that a significant portion of our past conflict was verbal, centering on the terms "fact," "belief," and "truth." The Expressivist is willing to call moral commitments "moral beliefs" and moral stances "facts" in a deflationary or minimal sense, which the Realist initially interpreted as a concession of mind-independence. The substantive disagreement remains not over whether we can *use* this vocabulary, but over the best explanation of *why* the vocabulary works: does it work because we are tracking independent properties, or because we are coordinating shared practical attitudes?

  The fundamental disagreement is whether moral judgments primarily function to represent mind-independent normative properties or to express and coordinate conative attitudes.
