answer: |-
  You have put your finger on the central philosophical and PR contradiction of the current AI boom. What you are describing is a **performative contradiction** rooted in an opportunistic switching between two incompatible definitions of intelligence.

  To answer your question directly: **Yes, the practice is incoherent.** It relies on an equivocation on the word "understanding."

  When the model succeeds, the industry adopts a **Behaviorist/Functionalist** view (intelligence is defined by output). When the model fails, it retreats to a **Mechanistic/Internalist** view (intelligence is defined by internal process).

  Here is a breakdown of the specific tensions you are observing, why they exist, and what a coherent view would actually require.

  ### 1. The Two Conflicting Definitions

  **View A: The Behaviorist Stance (Used for Benchmarks)**
  *   **Premise:** Intelligence is defined by input-output mapping. If a system produces the correct answer to a Bar Exam question, it is functionally equivalent to a human who understands law.
  *   **Implication:** The internal mechanism (next-token prediction) is irrelevant. This is the "Turing Test" legacy.
  *   **Usage:** Marketing, investor decks, papers claiming "emergent abilities."
  *   **Claim:** "The model demonstrates reasoning."

  **View B: The Mechanistic Stance (Used for Failures)**
  *   **Premise:** Intelligence requires a specific causal structure (mental models, symbolic manipulation, grounded reality). If the system arrives at the answer via statistical correlation rather than causal deduction, it is not "real" understanding.
  *   **Implication:** The internal mechanism is everything.
  *   **Usage:** Engineering post-mortems, safety disclaimers, explaining away brittleness.
  *   **Claim:** "It's just stochastic parrots; it doesn't know what the numbers mean."

  **The Incoherence:** You cannot claim the output proves the *presence* of a property (understanding) while simultaneously claiming the mechanism proves the *absence* of that same property when convenient.

  ### 2. Why This Happens: Strategic Ambiguity

  This isn't just philosophical confusion; it is incentivized by the industry structure.

  *   **For Capital and Adoption (View A):** To justify valuations and enterprise integration, you must claim the technology is robust, general, and "smart." If you admit it's just curve-fitting on training data, the Total Addressable Market shrinks.
  *   **For Liability and Safety (View B):** When the model hallucinates or fails a safety guardrail, you need to lower expectations. If you claimed it "understands" ethics, you are liable for its ethical failures. If it's "just math," it's a tool error, not an agent's moral failing.

  This creates a **"Heads I win, Tails you lose"** dynamic for the developer.
  *   *Model passes Bar Exam:* "AGI is near."
  *   *Model fails at counting 'r's in strawberry:* "It's just a language model, don't anthropomorphize."

  ### 3. The Technical Reality: Robustness vs. Competence

  Your example about the numbers changing touches on a specific technical concept: **Systematic Generalization.**

  Human understanding is compositional. If I understand $A + B = C$, I understand that $X + Y = Z$ follows the same rule, regardless of the symbols.
  Current LLMs often rely on **spurious correlations**. They might solve the math problem not because they learned the algorithm of addition, but because the specific phrasing and number distribution matched a cluster in the training data.

  *   **Benchmark Performance** measures **Competence** (can it do the task in distribution?).
  *   **Trivial Perturbations** measure **Robustness** (does it hold out of distribution?).

  A coherent view of intelligence requires **both**. A system that is competent but not robust is not "understanding"; it is **memorization with interpolation.**

  ### 4. What View Does This Presuppose?

  The industry currently presupposes a **Pragmatic Instrumentalism**.

  This view holds that "understanding" is not a real, binary state of being, but a **social attribution** we grant to systems based on utility.
  *   When the system is useful, we grant it the status of "understanding" to facilitate trust.
  *   When the system is broken, we revoke that status to facilitate debugging and risk management.

  In philosophy of mind, this is close to Daniel Dennett's **"Intentional Stance."** We treat the system *as if* it has beliefs and desires because it is useful to do so, without committing to the metaphysical claim that it *actually* has them.

  **The problem is that the industry speaks in metaphysical claims ("It has acquired deep understanding") while operating on pragmatic grounds.**

  ### 5. Resolving the Tension

  You asked if we have to stop claiming understanding from benchmarks OR stop using the "pattern matching" excuse. To be coherent, you essentially have to choose one of three paths:

  **Path 1: Radical Functionalism (Own the "Understanding" Claim)**
  *   **Stance:** If it passes the benchmark, it understands. Period.
  *   **Consequence:** You must admit that when it fails on trivial perturbations, it has **lost** understanding or has a "brain lesion." You can't say it "never understood." You have to treat brittleness as a critical cognitive failure, not a structural feature.
  *   **Risk:** High liability. If it "understands" medicine but gives bad advice, it is malpractice, not a bug.

  **Path 2: Mechanistic Rigor (Drop the "Understanding" Claim)**
  *   **Stance:** "Understanding" requires causal models. LLMs do not have them.
  *   **Consequence:** You must stop writing blog posts about "reasoning capabilities." You refer to everything as "capability," "competence," or "approximation." Benchmarks measure *performance*, not *cognition*.
  *   **Risk:** Deflates the hype cycle. Harder to sell "AGI."

  **Path 3: Dimensional Intelligence (The Nuanced View)**
  *   **Stance:** Understanding is not binary. It is a vector of capabilities.
  *   **Consequence:** You claim the model has "high surface-level semantic competence" but "low structural robustness." You stop using the word "understanding" unqualified.
  *   **Benefit:** This is the most scientifically honest path. It acknowledges that "next-token prediction" can *simulate* reasoning effectively enough to pass benchmarks without possessing the *invariance* of true reasoning.

  ### Summary

  The practice is inconsistent. It relies on a **motivated switching of definitions**.

  If you took it seriously, you would have to admit that **benchmarks measure the ability to mimic understanding, not the possession of it.**

  The "just next-token prediction" defense is technically accurate regarding the *mechanism*, but it is often used dishonestly to shield the *claims*. If the mechanism is "just next-token," then the benchmark success is "just next-token prediction succeeding," not "understanding emerging."

  To fix this, the industry needs to decouple **Performance** from **Ontology**.
  *   **Don't say:** "It scored 90% on MATH, so it reasons."
  *   **Do say:** "It scores 90% on MATH, indicating high utility for mathematical tasks, despite lacking robust generalization."

  Until that linguistic discipline is adopted, the tension you feel is the friction of marketing colliding with engineering reality.
