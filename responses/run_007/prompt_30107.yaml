prompt: |-
  so i work at an AI company and i've been thinking about this weird tension in how we evaluate our models. when we run them on benchmarks like MATH or the bar exam and they score well, the papers and blog posts say they "demonstrate reasoning" or "have acquired deep understanding" of the domain. but then when the same model fails on some trivial thing — like it can solve a math problem formatted one way but not the exact same problem with the numbers changed — the engineers shrug and say "well it doesn't actually understand anything, its just doing next-token prediction." and i'm trying to figure out: what view of understanding or intelligence does this whole practice presuppose? like, can you coherently claim a system understands something based on benchmark performance while also dismissing its failures by saying it never understood in the first place? or is the practice just inconsistent, and if we took it seriously we'd have to either stop claiming understanding from benchmarks or stop using the "its just pattern matching" excuse?
