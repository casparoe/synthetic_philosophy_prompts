prompt: |-
  So I just got back from a long argument with a friend about Mary's room, and I'm still not sure whether he was being fair to the argument or just steamrolling it. His version went roughly like this. Mary is a neuroscientist who's spent her whole life in a black-and-white room and has read everything there is to read about color vision, so she knows all the physical facts about what goes on in the brain when someone sees red. When she finally gets out and sees a red tomato, she learns what red actually looks like — and that's a new fact she didn't know before. Since she already knew every physical fact, this new fact has to be non-physical, so physicalism is false. And anyway, my friend said, Jackson himself later gave up on the argument, so we dont need to take it seriously.

  I have a hunch a couple of those steps are doing more work than they should, but I couldn't put my finger on it in the moment. Can you go through his version claim by claim and tell me which parts are right, which parts are subtle distortions or overstatements, and whether the conclusion actually follows once you fix the details? I'd like a verdict on the argument itself, not just on his summary of it. And please write in American English.
