answer: |-
  You have good instincts. Your friend got the basic setup of the thought experiment right, but he glossed over the most controversial logical steps and used Frank Jackson's change of heart as a conversation-stopper rather than a data point. That is a bit of steamrolling, because it treats settled what is actually highly contested.

  Here is a claim-by-claim breakdown of your friend's version, followed by a verdict on the argument itself.

  ### Part 1: Claim-by-Claim Analysis

  **Claim 1: "Mary knows all the physical facts about what goes on in the brain when someone sees red."**
  *   **Verdict:** **Accurate to the thought experiment.**
  *   **Analysis:** This is the standard setup. Jackson's original 1982 paper stipulates that Mary has complete physical knowledge. However, in the real debate, physicalists often attack the coherence of this premise. They argue that "physical knowledge" might inherently include the capacity to simulate experiences, or that one *cannot* know all physical facts without having the sensory apparatus to process them. But within the rules of the game your friend described, this premise is correct.

  **Claim 2: "When she finally gets out and sees a red tomato, she learns what red actually looks like — and that's a new fact she didn't know before."**
  *   **Verdict:** **Intuitively correct, philosophically loaded.**
  *   **Analysis:** Almost everyone agrees Mary learns *something*. The disagreement is over the category of that "something." Your friend calls it a "new fact." Physicalists argue she gains a new *ability* (to recognize, imagine, or remember red) or a new *mode of access* to an old fact, rather than a new fact about the world. By calling it a "fact" without qualification, your friend begged the question against the physicalist response.

  **Claim 3: "Since she already knew every physical fact, this new fact has to be non-physical."**
  *   **Verdict:** **The Logical Leap (The Weak Point).**
  *   **Analysis:** This is where the argument stands or falls, and your friend treated it as obvious. It relies on the assumption that all knowledge is propositional (knowledge *that*). If Mary gains knowledge *how* (an ability) or knowledge by *acquaintance* (a direct relation), she hasn't discovered a new non-physical property of the universe; she has just engaged with a physical property in a new way.
      *   *Example:* You can know every physical fact about how to ride a bike (balance, friction, muscle mechanics) without knowing *how* to ride a bike. When you finally ride, you learn something new, but that doesn't prove bikes have non-physical magic. Your friend skipped the debate over whether "what it's like" is a fact or an ability.

  **Claim 4: "So physicalism is false."**
  *   **Verdict:** **Valid deduction, unsound premise.**
  *   **Analysis:** If you accept Claim 3, this conclusion follows logically. The argument is *valid* (the structure works), but many philosophers argue it is *unsound* because Claim 3 is false. Physicalism isn't defeated unless you prove the new knowledge is about the *ontology* of the world, not just the *epistemology* of the observer.

  **Claim 5: "Jackson himself later gave up on the argument, so we don't need to take it seriously."**
  *   **Verdict:** **True premise, false implication.**
  *   **Analysis:** It is true that Frank Jackson changed his mind around 2006. He eventually adopted a representationalist view, arguing that qualia (subjective experiences) are physical properties represented by the brain in a specific way.
      *    However, saying "we don't need to take it seriously" is an appeal to authority fallacy. In philosophy, an argument lives or dies on its logic, not its author's later opinion. Many prominent philosophers (like David Chalmers) still consider the Knowledge Argument to be the strongest case against physicalism, even if Jackson stopped using it. Dismissing it solely because Jackson recanted is intellectual laziness.

  ### Part 2: Verdict on the Argument Itself

  So, was your friend fair? **Mostly no.** He presented a contested inference as a settled fact and used the author's recantation to shut down debate rather than engage with the counter-arguments.

  Is the argument itself sound? **It is currently undecided, but highly respected.**

  Here is the state of play:

  1.  **The Strength:** The Knowledge Argument successfully highlights the "explanatory gap." It demonstrates that even a complete physical description of the brain seems to leave out the subjective *feeling* of experience. It forces physicalists to explain why objective data feels like something from the inside.
  2.  **The Weakness:** The strongest counter-argument is the **Phenomenal Concept Strategy**. This suggests that Mary learns no new *facts*, but rather acquires a new *concept* for an old fact. Think of it like this: You can know "Mark Twain wrote Huckleberry Finn" and "Samuel Clemens wrote Huckleberry Finn." If you didn't know Twain was Clemens, learning they are the same person teaches you something new, but it doesn't mean there are two different authors. Similarly, Mary might be learning that "brain state X" is identical to "seeing red," without "seeing red" being a non-physical thing.
  3.  **The Jackson Factor:** Jackson didn't give up because the logic was proven wrong; he gave up because he became convinced that the alternative (dualism) created more problems than it solved, specifically regarding how non-physical minds interact with physical bodies (the problem of causal exclusion). He decided it was more plausible that our intuition about Mary was misleading than that physics is incomplete.

  ### Final Summary

  Your friend was right about the setup and the intuition, but he steamrolled the nuance. He treated the definition of "knowledge" as settled when it is the main battleground, and he used Jackson's change of heart as a trump card when it is merely a historical footnote.

  The Knowledge Argument remains one of the most important arguments in the philosophy of mind. It hasn't been "solved," and it certainly hasn't been dismissed. If you want to push back, focus on the distinction between **knowing-that** (facts) and **knowing-how** (abilities), or point out that Jackson's recantation doesn't invalidate the logic for those who still find the intuition compelling.
