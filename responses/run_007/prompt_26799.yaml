answer: |-
  Here is the restatement of the Frame Problem using your formal methods vocabulary, followed by the residue report analyzing the translation.

  ---

  ### Part 1: The Computational Frame Problem
  **Restated in Formal Methods Vocabulary**

  In your daily work, you define a system by a **state** vector $S$ (the valuation of all variables) and a **specification** $Spec$ (usually a temporal formula describing allowed behaviors). An action is a relation $Action(s, s')$ between a pre-state $s$ and a post-state $s'$.

  The **Computational Frame Problem** is the problem of specification verbosity and maintenance cost when defining $Action$.

  In a naive TLA+ specification, if an action modifies variable $x$, you must explicitly assert that all other variables $y, z, \dots$ remain unchanged to prevent stuttering or unintended state transitions.
  $$ Action(s, s') \triangleq (x' = f(x)) \land (y' = y) \land (z' = z) \land \dots $$
  If your state space has $N$ variables, every action definition requires $O(N)$ clauses. This violates **modularity**: changing the state schema (adding a variable) requires refactoring every action operator, even those logically independent of the new variable.

  **The Engineering Solution:**
  You solve this using **frame conditions** and **local reasoning**.
  1.  **TLA+:** You use the `UNCHANGED` operator or structure your `Next` relation to implicitly quantify over variables not mentioned. You rely on **abstraction** to hide irrelevant state components at higher levels of **refinement**.
  2.  **Separation Logic:** You use the **Frame Rule**. If you have a triple $\{P\} \ C \ \{Q\}$, the rule allows you to infer $\{P * R\} \ C \ \{Q * R\}$. Here, $R$ is the **frame** (the part of the heap/state untouched by $C$). This allows you to verify a component without enumerating the global **invariant** of the entire system, provided the **footprint** of $C$ is disjoint from $R$.

  **Summary:** The computational frame problem is the $O(N)$ cost of explicitly declaring $v' = v$ for all $v \notin \text{footprint}(Action)$ in a closed-world specification.

  ---

  ### Part 2: The Philosophical Frame Problem
  **Restated in Formal Methods Vocabulary**

  The philosophical version shifts the burden from *writing* the frame condition to *deriving* it. It questions the feasibility of defining the **footprint** itself in an open-world context.

  In formal verification, you (the engineer) manually determine the **footprint** of an action. You decide which variables belong in the precondition and which are preserved. The philosophical problem asks: **How is the footprint determined algorithmically by a bounded reasoner?**

  Consider a robot (an agent) operating in an environment.
  1.  **Open World vs. Closed State:** In TLA+, the set of variables is fixed at spec time. In the philosophical version, the "state" includes indefinitely many facts (e.g., "the number of red cars in London," "the gravitational constant"). The agent cannot maintain a state vector of infinite size.
  2.  **Relevance as Dependency:** The agent must determine which parts of the state are relevant to a goal $G$. In formal terms, it must compute a **dependency graph** dynamically. If the goal is "make coffee," the agent must know that `cup_location` is in the footprint, but `stock_price` is not.
  3.  **The Invariant Discovery Problem:** To safely ignore a fact (to treat it as part of the frame $R$), the agent must know that the fact is an **invariant** with respect to the action. The philosophical problem is: How does the agent know that `stock_price` is an invariant of `make_coffee` without explicitly checking the causal link?

  **Summary:** The philosophical frame problem is the **specification discovery problem**. It asks how a bounded agent constructs a valid **specification** (identifying preconditions, postconditions, and frame conditions) from a raw, unstructured environment where the **state** schema is not given, and the **invariants** linking facts are not pre-declared.

  ---

  ### Part 3: Residue Report

  Here is the analysis of what translated cleanly, what required bending, and what was lost in translation.

  #### 1. What Translated Cleanly
  *   **Frame Axioms $\leftrightarrow$ `UNCHANGED` / Separating Conjunction:** The core mechanical issue maps perfectly. The explosion of axioms in AI logic is identical to the verbosity of writing $y'=y \land z'=z$ in TLA+.
  *   **The Frame Rule $\leftrightarrow$ Modularity:** The philosophical desire to "ignore irrelevant facts" is exactly what the Separation Logic Frame Rule grants programmatically. It formalizes the intuition of modularity: if I don't touch it, I don't need to reason about it.
  *   **Invariants $\leftrightarrow$ Stability:** The philosophical notion of "facts that stay true" maps directly to temporal invariants ($\Box P$) or stability properties in a specification.

  #### 2. What Had to Be Bent
  *   **Relevance $\leftrightarrow$ Footprint:** In your tools, "relevance" is binary and syntactic. A variable is either in the footprint (mentioned in the code/spec) or it isn't. In the philosophical version, relevance is semantic and probabilistic. Bending this into formal terms requires assuming a dependency graph exists. The philosophical problem is *finding* that graph; the formal tool assumes you *drew* it.
  *   **Bounded Reasoner $\leftrightarrow$ Model Checker/Prover:** A model checker is bounded by memory; a prover is bounded by time. But both operate on a *given* spec. The philosophical "bounded reasoner" is bounded by its inability to even *formulate* the spec without exponential search. We had to bend "reasoning" to mean "verification" rather than "formulation."

  #### 3. What Has No Counterpart (The Residue)
  *   **Ontology Construction:** Your tools assume a fixed set of variables (the state schema). The philosophical frame problem assumes the agent must *invent* the variables (predicates) that matter. There is no TLA+ operator for "decide which variables should exist."
  *   **Semantic Causality:** In Separation Logic, disjointness is determined by memory addresses (syntactic/structural). In the real world, disjointness is causal (painting a wall doesn't change the moon's orbit). Formal tools do not model causality; they model state transitions. You verify the transition; you don't verify *why* the transition doesn't affect other variables (you assume it via the frame rule).
  *   **Common Sense Defaults:** Humans assume facts persist unless told otherwise (non-monotonic reasoning). Formal logic is monotonic (adding axioms never invalidates previous proofs). Your tools require explicit persistence conditions (`UNCHANGED`); the philosophical problem is about how to assume persistence without explicit declaration.

  ---

  ### Part 4: The Verdict

  **Is the philosophical version just the computational version dressed up?**

  **No.** It is not merely dressed up; it addresses a different layer of the stack.

  *   **The Computational Frame Problem** is a **Verification/Representation** problem. It asks: *Given a specification, how do we represent it efficiently?* Your tools (TLA+, SepLog) solve this completely. The Frame Rule is the definitive solution to the computational frame problem for closed systems.
  *   **The Philosophical Frame Problem** is a **Specification/Discovery** problem. It asks: *Given a world, how do we generate the specification?*

  **Is this a limitation of your tools or a sign the philosophical version is less precise?**

  It is primarily a **limitation of the tools' scope**, not a lack of precision in the philosophy.

  1.  **Tool Limitation:** Formal methods are designed for **closed-world reasoning**. They require the universe of discourse (variables, types, state) to be declared *before* verification begins. The philosophical frame problem arises in **open-world reasoning**, where the universe is not fully known. Your tools cannot handle this because their soundness depends on the state space being enumerable and fixed.
  2.  **Precision:** The philosophical version is *less* precise, but not because it is confused. It is less precise because it deals with **semantics** (meaning, causality, relevance) rather than **syntax** (state transitions, logic).
      *   In your work, if you miss a variable in the frame condition, the model checker finds a counter-example.
      *   In the philosophical version, if an agent misses a "variable" (e.g., fails to notice the oxygen level is dropping while focusing on a task), there is no model checker to catch it. The "spec" was wrong because the ontology was incomplete.

  **Conclusion for the Engineer:**
  You do not encounter the philosophical frame problem because **you are the oracle**. You supply the abstraction boundary. You decide which variables exist and which actions affect them. The philosophical frame problem is the problem of **automating the engineer**. It asks how to build a system that can write its own TLA+ specs (identify invariants and footprints) without human intervention in an environment it hasn't fully modeled.

  Your tools solve the problem of *checking* the frame. The philosophical problem is about *finding* the frame. Until you have a tool that generates the specification from raw observation, the philosophical residue remains outside your vocabulary.
