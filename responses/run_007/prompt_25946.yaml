      *   **2. The Ethical/Intentional Layer (Dutton/Lessing):** Why is forgery worse than a copy?
          *   *Forgery:* It's a lie about *achievement*. It claims a breakthrough that didn't happen. It steals the "credit" for the creative risk.
          *   *Honest Copy:* It claims to be a copy. It values the *craft* and the *proximity* to the master, not the innovation.
          *   *The "Parasitism" difference:* Forgery parasitizes the *reputation* to deceive. Copying parasitizes the *design* to preserve/distribute.
      *   **3. The Scarcity & Token/Type Distinction:** Economics plays a role. Paintings are unique tokens. MP3s are instances of a type. Scarcity drives market value, but *authentic* scarcity, not artificial.
      *   **4. Can a Hedonist Participate? (The Philosophical Underdetermination):**
          *   Strict hedonist (value = pleasure): Shouldn't care about provenance.
          *   *But:* Knowledge affects experience (The "Psychological Penetration" of Aesthetic Experience). Knowing it's a fake changes the *feeling*. So a sophisticated hedonist might still reject fakes because the knowledge ruins the pleasure (feeling of betrayal, loss of connection).
