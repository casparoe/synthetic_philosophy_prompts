answer: |-
  This is a profound question that cuts to the core of aesthetic ontology, the ethics of representation, and the economics of culture. The inconsistency you perceive is not a bug in the art market's logic; it is a feature of a specific, widely shared (though often implicit) philosophical theory of what art *is*.

  To reconstruct the implicit theory that makes these practices coherent, we need to look at three intersecting frameworks: the ontological (what kind of object is this?), the intentional (what human act produced this?), and the institutional (what rules govern this community?).

  Here is a reconstruction of the theory of value that underpins the art market's treatment of forgery.

  ### 1. The Ontological Distinction: Autographic vs. Allographic
  The philosopher Nelson Goodman, in *Languages of Art* (1968), provides the most famous technical solution to your MP3 vs. Painting puzzle. He distinguishes between **autographic** and **allographic** arts.

  *   **Allographic arts (Music, Literature, Dance):** The work is defined by a notation or a structure. A performance of Beethoven's 5th is an instance of the work. Whether the MP3 comes from a master tape or a CD is irrelevant because the work is the *structure*, not the physical carrier. As long as the structural properties are preserved, the identity of the work is preserved.
  *   **Autographic arts (Painting, Sculpture):** The work is defined by its specific history of production. The physical object *is* the work. There is no notation that can fully specify the work. Therefore, the history of its creation is constitutive of its identity.

  **The Implication:** In painting, "origin" is not an external tag attached to the object; it is part of the object's ontology. A Van Meegeren forged as a Vermeer is not a "Vermeer that we now know is by Van Meegeren." Ontologically, it *never was* a Vermeer. When the forgery is discovered, the market isn't changing the price of the *same* object; it is recognizing that the object they thought they were buying (a Vermeer) does not exist. They possess a Van Meegeren, which is a different commodity entirely.

  ### 2. The Theory of Achievement: Why Forgery is Worse than Copying
  You ask why an honest workshop copy retains value while a forgery collapses. Both lack the master's hand. The difference lies in the **claim to creative achievement.**

  *   **The Honest Copy:** A workshop copy from the 17th century claims to be a product of that studio, perhaps for pedagogical purposes or to meet demand. It is honest about its causal chain. Its value derives from its proximity to the master, its historical status as an artifact of that era, and its craft. It does not lie about *who solved the artistic problems*.
  *   **The Forgery:** A forgery (like Van Meegeren's) is not just a copy; it is a false testimony to art history. When Van Meegeren painted a "new" Vermeer, he claimed that *Vermeer* solved the aesthetic problems of composition, color, and expression in the 1660s.
      *   **The Parasitism:** You asked about the difference in parasitism. An honest copy parasitizes the *design*; a forgery parasitizes the *reputation and the historical narrative*.
      *   **The Achievement:** We value art not just for the visual stimulus, but as a record of human agency. We admire Vermeer for seeing the world in a way no one else had. If Van Meegeren solves the problem in the 1930s, that is a different achievement (perhaps impressive, perhaps derivative). But if he sells it as Vermeer, he is stealing credit for a historical breakthrough. The market collapses because the "asset" was purchased as a certificate of Vermeer's genius. When that certificate is voided, the asset is worthless *as that specific asset*.

  ### 3. The Epistemic Penetration of Aesthetic Experience
  You ask if a hedonist (someone who values only the experience) could consistently participate in this market. This depends on whether aesthetic experience is "cognitively penetrable."

  *   **Strict Hedonism:** If value is *only* the immediate sensory qualia, then the hedonist should buy forgeries. The light hitting the retina is identical.
  *   **Sophisticated Hedonism (Walton/Danto):** Most philosophers argue that *how* we see is determined by *what we know* we are seeing. Kendall Walton, in "Categories of Art," argues that we perceive art within categories. A painting looks "bold" if we know it was the first of its kind (Vermeer); it looks "derivative" if we know it was painted later (Van Meegeren).
      *   **The Betrayal:** The experience of art involves a relationship of trust between viewer and maker. When a forgery is revealed, the experience retroactively changes. The viewer feels foolish or betrayed. The "pleasure" is contaminated by the knowledge of deception.
      *   **Conclusion:** A sophisticated hedonist might reject forgeries not because of a moral commitment to truth, but because the knowledge of forgery actively degrades the aesthetic experience. However, a *pure* sensory hedonist (ignoring all context) would find the market irrational.

  ### 4. The Science Analogy: Why Provenance Matters There Too
  Your comparison to science is insightful, but perhaps slightly off. In science, a result *does* lose value if the provenance is fraudulent.
  *   If a physicist publishes a breakthrough but it is discovered they faked the data, the paper is retracted, even if the theory turns out to be true later.
  *   Why? Because science values the *method of discovery* as much as the conclusion. We need to know the path to truth is replicable.
  *   Similarly, art values the *path of creation*. A forgery is like faked data: it presents a false path to the aesthetic conclusion.

  ### 5. What If We Adopted a Purely Experiential Theory?
  If we shifted the art world to a purely experiential theory of value (where origin doesn't matter, only the visual impact), the changes would be radical:

  1.  **Museums:** Would become "Experience Centers." Labels would read "Untitled, c. 1660 style" rather than "Vermeer." The layout would prioritize lighting and sightlines over chronology or attribution.
  2.  **Conservation:** We would restore paintings to look "best" even if it meant painting over original brushstrokes. Currently, conservators preserve the *original material* even if it looks worse, because the material history is the value. Under experientialism, a perfect digital restoration replacing the canvas would be acceptable.
  3.  **The Market:** The market for unique originals would collapse. Value would shift to high-quality reproductions. Why buy the dirty, cracked original if a perfect digital scan offers a better visual experience? Scarcity would no longer drive price; perceptual quality would.
  4.  **Art History:** Would cease to exist as a discipline of attribution and become a discipline of visual psychology. The narrative of "influence" and "innovation" would vanish, replaced by a catalog of visual effects.

  ### Summary: The Implicit Theory
  The art market presupposes that **an artwork is a performance of agency, not just a visual object.**

  *   **Value resides in:** The successful translation of a specific artist's intention into a specific material form at a specific moment in history.
  *   **Why Forgery fails:** It lies about the agency. It claims a specific historical performance (Vermeer's) occurred when it did not.
  *   **Why Copies survive:** They tell the truth about the agency (a student's hand, a later date). They are valued as historical artifacts of *craft*, not as singular moments of *genius*.
  *   **Why MP3s differ:** Music is allographic; the performance is the instance, not the physical disc. The "agency" is in the composition and the specific performance, not the plastic of the CD.

  The inconsistency you see is only an inconsistency if you assume art is primarily a **visual stimulus**. The art market operates on the theory that art is a **communicative act**. A forgery is a lie in a conversation. Once the lie is exposed, the communication breaks down, and the value (which was invested in the relationship with the artist) evaporates. The honest copy, however, is a truthful statement about admiration and craft, so the communication remains intact, albeit at a lower valuation.
