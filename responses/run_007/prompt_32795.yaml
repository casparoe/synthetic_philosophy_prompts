  Dear Colleague,

  It is a pleasure to engage with the intuitive verdicts you have gathered from your seminar, as they map quite neatly onto the central tensions in the contemporary literature on the norms of assertion. Your cases collectively suggest that while knowledge is the core epistemic requirement for proper assertion, it is not the only factor determining whether an assertive act is appropriate in a given context. The first, second, and fourth cases provide strong support for what is known as the Knowledge Norm of Assertion. In the first case, the colleague lacks knowledge because her true belief is merely a guess, and your judgment that the assertion is improper aligns with the view that truth and belief alone are insufficient. The second case reinforces this by showing that even justified true belief is not enough if the justification is flawed by a false lemma, such as the forged document, which typically precludes knowledge. The fourth case serves as your baseline control, where knowledge is present and the assertion is properly made. These three cases together build a compelling argument that knowledge is a necessary condition for warranted assertion.

  However, your reactions to the third and sixth cases indicate that knowledge is not a sufficient condition. In both instances, the speaker knows the truth, yet you judge the assertions to be improper. In the third case, the impropriety stems from a misleading implicature, and in the sixth, it arises from irrelevance. These verdicts suggest that assertion is governed not only by an epistemic norm but also by broader conversational norms, such as Gricean maxims of quality, quantity, and relation. If you were to seek a single principle that captures all six verdicts without exception, you would face a difficulty because a strictly epistemic principle like the Knowledge Norm cannot account for the impropriety in cases where knowledge is present but conversational norms are violated. Consequently, if you wish to maintain a single constitutive principle for assertion, specifically the Knowledge Norm, you would need to overturn your verdict on the fifth case, assuming you accept the standard externalist view that the speaker in the fake barn scenario lacks knowledge. Your intuition that the assertion is proper in case five conflicts with the verdicts in cases one and two if the speaker indeed lacks knowledge. To preserve the Knowledge Norm as the sole governing principle, you would need to judge the assertion in case five as improper, thereby aligning it with the luck-based impropriety of case one. Alternatively, you could maintain your verdict on case five by adopting a contextualist epistemology where the speaker does know, but this relies on contested ground.

  Regarding the third and sixth cases, if you are committed to a single norm of assertion, you would need to reinterpret your verdicts to say that while the assertions satisfy the norm of assertion, the acts themselves violate distinct norms of conversation. However, since you explicitly labeled them improper assertions, the most coherent theoretical approach that respects all your initial intuitions is to adopt a small set of principles rather than a single one. This set would consist of the Knowledge Norm of Assertion as the constitutive rule, supplemented by conversational norms that govern the appropriateness of the act in context. This composite view accommodates all six cases without requiring you to overturn any verdicts, provided we resolve the epistemic status of case five in favor of the speaker having knowledge or accept that proper assertion requires both knowledge and conversational appropriateness.

  Applying this analysis to the new case you proposed, where a speaker asserts a known truth to an audience that already knows it for the purpose of assuring them of the speaker's knowledge, the principle predicts that the assertion is proper. Under the Knowledge Norm, the epistemic condition is satisfied since the speaker knows the proposition. Under the conversational constraints, although the assertion might initially seem to violate the maxim of quantity by providing information the audience already possesses, the specific purpose of establishing common ground or signaling competence provides a valid conversational reason for the utterance. Therefore, the assertion serves a legitimate communicative function and does not violate the norms of conversation in a way that renders it improper.

  I am highly confident in this overall analysis, particularly regarding how cases one, two, and four anchor the Knowledge Norm and how cases three and six necessitate the inclusion of conversational constraints. The point I am least sure of is the epistemic status of the speaker in your fifth case involving the fake barns, as this depends entirely on whether one accepts an externalist or internalist theory of knowledge, and your own verdict there seemed hedged precisely because of this contestation. Resolving that specific epistemological question is the key to determining whether case five is a true counterexample to the Knowledge Norm or merely a reflection of divergent epistemic intuitions.

  Sincerely,

  Your Colleague
