answer: |-
  # Handout: Mapping the Dutch Book Logical Space

  **Instructions:** Start at the top. Answer each question based on your intuitions about rationality, belief, and betting. Follow the arrows to find your position. Read the "Uncomfortable Consequence" at the leaf to see what commitment you've inherited.

  ---

  ### THE DECISION TREE

  **START:** You accept that agents have "degrees of belief" (credences) that can be roughly measured.

  **Q1. The Belief–Betting Link**
  *Is accepting a bet at odds $p$ a constitutive part of (or strictly entailed by) having a degree of belief $p$?*
  *   **NO:** You deny the link is tight enough to ground an argument. → **Go to Leaf A**
  *   **YES:** Beliefs commit you to betting dispositions. → **Proceed to Q2**

  **Q2. The Normative Force**
  *If an agent's betting dispositions guarantee a sure loss (a Dutch Book), does this demonstrate a failure of **rationality**?*
  *   **NO:** You think vulnerability is merely unfortunate, not irrational. → **Go to Leaf B**
  *   **YES:** Vulnerability indicates a normative failure. → **Proceed to Q3**

  **Q3. The "Whole Book" Objection**
  *Does the agent's awareness of the bookie's strategy (knowing the full set of bets in advance) allow them to rationally decline the bets, thereby neutralizing the argument?*
  *   **YES:** Transparency defeats the book. (Note: In Synchronic cases, agents *do* see the whole book). → **Go to Leaf C**
  *   **NO:** The commitment comes from the beliefs, not the ignorance; the trap still holds. → **Proceed to Q4**

  **Q4. Synchronic vs. Diachronic Symmetry**
  *Do Dutch Book arguments establish **Probabilism** (static coherence) and **Conditionalization** (dynamic coherence) with equal force?*
  *   **NO:** One works, but the other fails (or requires extra premises). → **Go to Leaf D**
  *   **YES:** They stand or fall together as a package. → **Proceed to Q5**

  **Q5. The Nature of the Irrationality**
  *Does the Dutch Book show the agent is **pragmatically** irrational (prudent to avoid loss) or **epistemically** irrational (intellectually inconsistent)?*
  *   **PRAGMATIC:** The flaw is in the decision to bet/lose money. → **Go to Leaf E**
  *   **EPISTEMIC:** The flaw is in the belief state; the money is just a proxy. → **Go to Leaf F**

  ---

  ### THE POSITIONS (LEAVES)

  **Leaf A: The Betting Skeptic / Credence Primitivist**
  *   **Path:** Q1 = NO.
  *   **Position:** You reject the operationalization of belief via betting. You might prefer accuracy-first arguments or primitivist accounts of credence.
  *   **Uncomfortable Consequence:** You must explain how to measure or verify degrees of belief without appealing to any behavioral dispositions.
  *   **Status:** Widely defended (e.g., Eriksson, Hájek).

  **Leaf B: The "So What?" Theorist**
  *   **Path:** Q1 = YES, Q2 = NO.
  *   **Position:** You admit the link and the vulnerability, but deny it implies irrationality.
  *   **Uncomfortable Consequence:** You must defend the claim that an agent who can be guaranteed to lose money (given their own valuations) is nonetheless fully rational.
  *   **Status:** **⚠️ LOGICALLY POSSIBLE BUT RARELY DEFENDED.** Most find it too costly to sever vulnerability from irrationality.

  **Leaf C: The Strategic Skeptic**
  *   **Path:** Q1 = YES, Q2 = YES, Q3 = YES.
  *   **Position:** You think Dutch Books only work on ignorant agents. If the agent sees the trap, they are rational to refuse.
  *   **Uncomfortable Consequence:** You must accept that Synchronic Dutch Books fail (since agents *do* see the synchronic book), undermining the standard argument for Probabilism.
  *   **Status:** Defended by some (e.g., Maher), but forces a retreat from standard Probabilism arguments.

  **Leaf D: The Synchronic-Only Bayesian**
  *   **Path:** Q1 = YES, Q2 = YES, Q3 = NO, Q4 = NO.
  *   **Position:** You accept DBA for Probabilism, but reject it for Conditionalization (usually because Diachronic DBA requires extra assumptions about future beliefs).
  *   **Uncomfortable Consequence:** You must find a *non*-Dutch Book argument to justify Conditionalization (e.g., accuracy-domination or expected utility), creating a theoretical split in your epistemology.
  *   **Status:** Common among modern Bayesians (e.g., Earman, Skyrms).

  **Leaf E: The Classic Pragmatist (Ramsey/de Finetti)**
  *   **Path:** Q1 = YES, Q2 = YES, Q3 = NO, Q4 = YES, Q5 = PRAGMATIC.
  *   **Position:** Standard Bayesianism. Rationality *is* coherence of preferences; epistemic norms reduce to pragmatic consistency.
  *   **Uncomfortable Consequence:** You must accept that a "true belief" that leads to sure loss is less rational than a "false belief" that avoids it; epistemology is subordinate to prudence.
  *   **Status:** The historical standard, though less common in contemporary pure epistemology.

  **Leaf F: The Depragmatized Coherentist (Joyce/Christensen)**
  *   **Path:** Q1 = YES, Q2 = YES, Q3 = NO, Q4 = YES, Q5 = EPISTEMIC.
  *   **Position:** "Depragmatized" DBA. The money is a mere analogy for representational inconsistency.
  *   **Uncomfortable Consequence:** You must explain why "inconsistency" in belief states is irrational *independently* of the pragmatic loss, essentially needing a separate accuracy-based argument anyway.
  *   **Status:** Dominant in contemporary formal epistemology.

  ---

  ### EMPTY REGIONS & DIAGNOSIS

  **1. The "Diachronic-Only" Coherentist**
  *   **Path:** Q4 = NO (but favoring Diachronic over Synchronic).
  *   **Diagnosis:** **⚠️ LOGICALLY INCOHERENT.** You cannot be dynamically coherent (satisfy Conditionalization) if you are not statically coherent (satisfy Probabilism). If the Synchronic DBA fails, the Diachronic DBA usually collapses with it. Nobody defends this.

  **2. The "Pragmatic-Only" Epistemologist**
  *   **Path:** Q5 = PRAGMATIC, but claims *no* Epistemic relevance.
  *   **Diagnosis:** **⚠️ UNSTABLE.** If the irrationality is *only* about losing money, it is hard to see why this governs *belief* rather than just *betting*. This position tends to collapse into Leaf A (rejecting the link) or Leaf E (accepting pragmatism as the whole story).

  **3. The "Whole Book" Partialist**
  *   **Path:** Q3 = YES for Diachronic, but NO for Synchronic.
  *   **Diagnosis:** **⚠️ UNDEREXPLORED / HARD TO MOTIVATE.** This requires arguing that seeing a set of simultaneous bets doesn't defeat the argument, but seeing a strategy over time does. While some argue Diachronic DBA requires extra premises (Leaf D), claiming the *knowledge itself* is the differentiator is a nuanced, rare distinction.

  ---

  ### SUMMARY

  The debate over Dutch Books is not about whether the math works, but about whether avoiding guaranteed loss is the *source* of epistemic normativity or merely a *symptom* of it.
