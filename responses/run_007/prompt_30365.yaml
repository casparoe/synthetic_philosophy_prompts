  2.  **Deconstruct the Two Norms:**
      *   **Knowledge Norm (KN):** Assert $p$ only if you know $p$. (Williamson). Focuses on the speaker's epistemic state.
      *   **Truth Norm (TN):** Assert $p$ only if $p$ is true. (Weiner, etc.). Focuses on the fact of the matter, regardless of the speaker's state.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the journalist's context. Define the stakes (why do we care about rules of talking?). Introduce the contenders.

      *   **Case 1: The Lucky Guess:**
          *   *Scenario:* Speaker guesses "The meeting is at 3," turns out true, but had no clue.
          *   *KN Verdict:* Improper. You didn't know.
          *   *TN Verdict:* Proper (technically). $p$ is true.
          *   *Analysis:* Our intuition is criticism ("You got lucky"). KN explains this directly. TN needs to explain away the criticism (e.g., "You violated a norm of *belief* or *evidence*, but not *assertion*").
          *   *Journalistic Angle:* The "out of turn" feeling.

      *   **Case 2: Lottery Propositions:**
          *   *Scenario:* "Your ticket will lose." Odds are 1 in a million. It loses.
          *   *KN Verdict:* Improper. We don't *know* lottery outcomes based on odds alone (fallibilism issue).
          *   *TN Verdict:* Proper. It was true.
          *   *Analysis:* This is the battleground. Most people feel it's weird to assert a lottery loss before the draw. KN captures the "premature" feel. TN says "Wait, it was true!" TN proponents argue we conflate *assertability* with *knowledge*.
          *   *Nuance:* Context matters. If the prize is small, maybe it's okay? But standard philosophical intuition says it's improper.

      *   **Case 3: Gettier-Style Cases:**
          *   *Scenario:* Justified True Belief (JTB) but lucky connection (e.g., stopped clock, fake barns).
          *   *KN Verdict:* Improper. No knowledge.
          *   *TN Verdict:* Proper. It's true.
          *   *Analysis:* This is tricky because JTB without knowledge is rare in everyday conversation. But if it happens, do we criticize? If I say "The clock says 2 PM" (it's broken but stopped at 2 PM), and you assert "It's 2 PM," did you do wrong? KN says yes. TN says no.
          *   *Key Point:* TN struggles with the feeling that the speaker was epistemically irresponsible, even if right.

      *   **Theoretical Costs:**
          *   *KN Costs:* Requires a robust theory of knowledge. Faces the "Skeptical Pressure" (if knowledge is hard, we assert too little). Needs to explain why we assert things we aren't 100% sure of (contextualism or pragmatic encroachment might be needed).
          *   *TN Costs:* Decouples assertion from the speaker's mind. Makes criticism of true assertions hard to explain (must appeal to secondary norms). Risks making assertion too easy (liars who tell the truth are "proper" asserters?).

      *   **Assessment & Unresolved Problem:**
          *   *Choice:* The Knowledge Norm is generally the dominant view in contemporary epistemology for a reason. It ties assertion to the function of conveying information.
          *   *Reasoning:* It explains the *criticism* better. If I assert without knowing, you can challenge me ("How do you know?"). If I assert truth without knowing, you can still challenge me.
          *   *Unresolved Problem:* The "Lottery Paradox" pressure or the "Strictness" problem. Does KN demand too much? Do we really *know* the things we everyday assert? (e.g., "I know I'll meet you for lunch" - but I could get hit by a bus). This leads to Contextualism or Subject-Sensitive Invariantism as patch-ups. I should highlight the tension between the norm and fallibilism.

