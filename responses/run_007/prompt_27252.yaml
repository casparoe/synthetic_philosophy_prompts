answer: |-
  Anchor the session on the shift from "generating options" to "structuring pressure," using a melody as your universal data structure.

  **Dependency Order**
  1.  **Representation (10 mins):** Draw "Happy Birthday" as a graph: nodes are pitches, edges are intervals. This is the *conceptual skeleton*. For CS, it's a data structure; for Psych, a schema; for Music, a lead sheet.
  2.  **Slippage (15 mins):** Introduce the "knobs." Transposing key is one knob; changing rhythm is another. Show that twisting a knob changes surface features while preserving the skeleton. This is *slippage*.
  3.  **Pressure (15 mins):** Explain why we don't twist all knobs at once. Context (lyrics, instrument range, emotional goal) creates *pressure* that locks certain knobs and forces others to turn.

  **Carrying Example**
  Use a single melody. It avoids the dryness of Hofstadter's letter-strings but retains the structural rigor CS needs. Everyone understands that "Happy Birthday" played in a minor key is still "Happy Birthday," but played with random notes is not.

  **Misconceptions**
  *   *"It's just random mutation":* Head this off during **Slippage** by drawing a dial versus a die. A dial implies continuous, meaningful adjustment within a range; a die is blind.
  *   *"It's only combinatorics":* Tackle this during **Pressure**. Use the whiteboard to show "valid" vs. "beautiful" zones. Combinatorics fills the space; pressure finds the valley.
  *   *"Can't explain breakthroughs":* Save for the end. Explain that "radical" means smashing the graph and redrawing the nodes (re-representation), not just twisting edges.

  **Leave Out**
  Skip the codelet architecture, temperature equations, and the specific Copycat microworld mechanics. They are implementation details, not conceptual tools. Do not get bogged down in how the pressure is computationally calculated; focus on *that* it exists.

  **Final Question**
  "If creativity is knob-twiddling, what does it look like when you realize you're holding the wrong object?"
