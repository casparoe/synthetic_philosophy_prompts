      *   **Translation:** Baillie (known for being a bit archaic/obscure, which adds to the difficulty).
      *   **Specific Passage:** "In this movement we see the process repeated which came before us as the play of forces; in the present case, however, it is found in consciousness. What in the former had effect only for us [contemplating experience], holds here for the terms themselves. The middle term is self-consciousness which breaks itself up into the extremes; and each extreme is this interchange of its own determinateness, and complete transition into the opposite."
