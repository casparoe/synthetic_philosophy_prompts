answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Groom]'s friend for over a decade.

  We met in our first week of a Master's degree in Metaphysics. Most friendships start over a shared love of music, or sport, or perhaps a reasonable disagreement about politics. Ours began because we were both horrified by the way undergraduates were being taught about persistence. We've been arguing about it ever since.

  For the family, I promise I'll keep the jargon to a minimum. But to put it simply: [Groom] believes that a person is wholly present at every moment. He thinks the man standing here tonight is exactly the same person as the boy he was in school, just older. He believes in a stable, unchanging core.

  I, on the other hand, take the view that we are extended through time like we are through space. I see us as a series of connected moments—a long, four-dimensional story rather than a single, static point.

  Now, you might wonder why this matters at a wedding. It matters because it shapes how we view promises. For [Groom], a vow is made by the whole of him, once and for all. For me, a vow is a commitment that every future version of me must choose to uphold. It's a lot of pressure, honestly. I once tried to tell him he couldn't stay angry at me for something I did in 2011, because the "me" of 2011 was technically a different temporal part than the "me" of 2012. He didn't buy it. He said, "You're still the one who owes me a drink." He was right. I still owe him that drink.

  But watching him with [Bride], I've had to reconsider what matters.

  [Groom], you argue that you endure unchanged. But I've watched you change. I've watched the sharp edges of your arguments soften when you speak to [Bride]. I've watched your priorities shift, your patience grow, and your world expand. If I were to look at the timeline of your life as a whole structure, the section that includes [Bride] is brighter, more stable, and more beautifully complex than anything that came before.

  And [Bride], thank you. You ground him. You give his trajectory a direction that makes sense. There is a continuity in the way he looks at you that even a skeptic like me has to respect. It's a causal chain of care, moment after moment, that adds up to something undeniable.

  To the philosophers in the room: I am not going to say that [Groom] is numerically identical to the man [Bride] met eight years ago. I am not going to claim their love is a single, indivisible substance that defies temporal segmentation.

  But to the rest of the room, who are here to celebrate a lifetime together: I will say this.

  I have seen [Groom] in many different moods, in many different years, and under a great deal of pressure. And in every single instance where [Bride] was involved, he showed up. He showed up with kindness, with loyalty, and with a determination to make things work. Whether that is because he is the "same man" or because he keeps rebuilding the bridge to her every single day, the result is the same. He is devoted to her.

  Marriage, to my way of thinking, isn't about freezing time. It isn't about promising that you will never change. It is about promising that, no matter how many chapters you write, no matter how much you grow, you will keep writing them together. It is about ensuring that the future parts of your lives are woven so tightly together that you become a single, unified narrative.

  [Groom], I may not believe you are the same man who started this journey. But I believe the man standing here today is the best version of you yet. And I believe that as long as you keep choosing [Bride], moment by moment, stage by stage, you are building something that will last as long as your story does.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May your path be long, may your connection be strong, and may every stage of your journey together be as happy as this one.

  To the happy couple.
