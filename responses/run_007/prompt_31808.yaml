prompt: |-
  I'm to be best man at the wedding of my oldest friend next month, and I am quietly dreading the speech. He and I met in our first week of a metaphysics MPhil, bonded over a shared horror at the state of the undergraduate teaching on persistence, and have been arguing ever since. He is a thoroughgoing endurantist: he holds that a person is wholly present at every moment at which she exists, that there are no such things as temporal parts, and that when he makes a vow he makes it with the whole of himself. I am a perdurantist, and have been for as long as either of us can remember. On my view, what we call a person at a moment is a temporal slice of a larger four-dimensional object — a spacetime worm — and identity across time is not the simple thing he takes it to be. This is not an abstract disagreement for us; it has shaped how we talk about loyalty, regret, self-improvement, and, more than once, whether it made sense for him to stay angry at me for something my earlier temporal part did in 2011.

  The room will be a proper mix. About a dozen of the guests are philosophers of time and metaphysics who will catch every conceptual move I make and will know exactly what I am refusing to say. The other eighty-odd guests are family — his mother, her grandmother, cousins who run pubs and teach primary school — who have never heard the word 'endurantism' and who have come to witness two people pledge their lives to each other. I want to give a speech that is warm, funny, and genuinely celebratory, that lands for both halves of the room, and that does not feel like a man trying to smuggle a metaphysics seminar into a wedding reception. But I cannot, in good faith, say the things best men are supposed to say: that he is the same man now as the boy she fell in love with eight years ago, that they will grow old together as two enduring selves moving side by side through time, that their love has been one continuous thing from the start. Every one of those claims, on my view, is either false or badly in need of a paraphrase I cannot give in a five-minute speech. Please write the toast — roughly five minutes when spoken — in a way that honours the friendship and the occasion without ever asking me to say something I believe to be untrue.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Role:** Best Man.
      *   **Occasion:** Wedding of oldest friend (next month).
      *   **Relationship:** Met in first week of a Metaphysics MPhil. Bonded over horror at undergraduate teaching on persistence. Friends ever since.
      *   **Core Conflict:** Groom is an *Endurantist* (wholly present at every moment, simple identity over time). Best Man (Speaker) is a *Perdurantist* (4D spacetime worms, temporal parts, identity is complex).
      *   **Audience:** Mixed. ~12 philosophers of time/metaphysics (will catch nuances), ~80 non-philosophers (family, friends, need warmth/accessibility).
      *   **Constraint:** The speaker *cannot* in good faith say standard best man tropes (e.g., "he's the same man," "grow old together as enduring selves," "love is one continuous thing"). These are metaphysically false to a perdurantist.
      *   **Goal:** Warm, funny, celebratory, accessible to laypeople, intellectually honest for the philosophers, ~5 minutes spoken length (approx. 750-900 words).

  2.  **Deconstruct the Metaphysical Problem:**
      *   *Endurantist view (Groom):* I am the *same* person who vowed this. My love is a constant substance.
      *   *Perdurantist view (Speaker):* People are extended in time like they are in space. The "him" of 2011 is a different temporal part than the "him" of today. Love isn't a single continuous thread, but a relation between stages.
      *   *The Trap:* Standard wedding speeches rely on endurance ("Always," "Forever," "Same love").
      *   *The Solution:* Reframe permanence not as *identity* but as *connection*, *pattern*, or *commitment across stages*. Focus on the *structure* of the relationship rather than the *substance* of the self. Use the 4D view to make the commitment *more* impressive, not less. If every moment requires a new decision, that's dedication.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the friendship, the meeting place (MPhil), and the shared passion (arguing). Keep it light for the family.
      *   **The Metaphysical Elephant:** Address the disagreement without jargon. Explain it simply (Space vs. Time). Make it funny.
      *   **The Pivot to the Bride/Partner:** How does this view affect *her*? Why is she perfect for him? (She grounds him).
      *   **The Vows/Commitment (The Crux):** This is where the perdurantist constraint matters most. Instead of "You are the same," say "You are a beautiful extension." Instead of "Forever," say "Every stage." Frame the marriage as a collaborative project of building a spacetime worm together.
      *   **The Toast:** Bring it all together. Warmth for the family, a wink for the philosophers.

  4.  **Navigating the Constraints (The "Good Faith" Check):**
      *   *Avoid:* "He hasn't changed," "Same old [Name]," "Eternal love."
      *   *Use:* "Consistent," "Reliable," "Connected," "Next chapter," "Every version of him."
      *   *Philosophical Wink:* Use terms like "extension," "trajectory," "parts," "whole" in ways that work for both audiences. The philosophers will hear the perdurantism; the family will hear poetic sentiment.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. We met at uni arguing about time. He thinks time is static; I think it flows (wait, no, that's A/B theory, stick to persistence). He thinks he's wholly here; I think he's a worm.
      *   It sounds nerdy, but it matters. He thinks if he promises, *he* promises. I think a future part of him has to keep it.
      *   But looking at him with [Bride], I see a pattern.
      *   To the philosophers: I'm not saying he endures. To the family: He's a great guy.
      *   Toast to the worm? No, too weird. Toast to the journey.

  6.  **Drafting - Iteration 2 (Refining Tone and Content):**
      *   Need to make sure the family doesn't feel alienated. The metaphysics should be the *flavor*, not the *meal*.
      *   The "2011 incident" mentioned in the prompt is a great anecdote to include.
      *   The commitment needs to be framed as a *causal connection* between stages, which a perdurantist can accept.
      *   *Key Insight:* A perdurantist can value a life well-lived. It's about the shape of the worm. A marriage is two worms intertwining.

  7.  **Writing the Speech (incorporating the constraints):**
      *   *Intro:* Establish the bond. The MPhil story.
      *   *Middle:* The disagreement. Keep it accessible. "He thinks he's the whole picture; I think he's a frame in a movie."
      *   *The Bride:* She makes the timeline make sense.
      *   *The Vows:* This is the tricky part. Don't say "same man." Say "every version of him." Don't say "eternal." Say "across the distance."
      *   *Conclusion:* The Toast.

  8.  **Review against Constraints:**
      *   *Did I say he's the same man?* No. I'll talk about the "story" or the "path."
      *   *Did I say love is continuous?* I'll describe it as a series of choices or a structure.
      *   *Is it warm?* Yes, focus on loyalty and care.
      *   *Is it funny?* Yes, lean into the nerdiness but poke fun at myself.
      *   *Length?* Aiming for ~800 words.

  9.  **Polishing the Metaphysics:**
      *   Ensure I don't accidentally slip into endurance language.
      *   *Bad:* "He has always been..."
      *   *Good:* "From the earliest parts of his life we know..."
      *   *Bad:* "Forever."
      *   *Good:* "As far as the timeline extends."
      *   *For the Philosophers:* Use "temporal parts," "extension," "causal connection."
      *   *For the Family:* These sound like "chapters," "growth," "history."

  10. **Final Polish:** Check the rhythm. Ensure the transition from the joke about the 2011 incident to the sincere wish for the couple is smooth. (Self-Correction: Make sure the 2011 incident doesn't sound like he *shouldn't* be angry, but rather how they resolve things).

  11. **Final Word Count Check:** 5 minutes spoken is roughly 750-850 words at a moderate pace.

  *(Self-Correction during drafting)*: I need to be careful not to sound *too* cold. Perdurantism can sound detached. I need to emphasize that the *connections* between temporal parts are where the love lives. The "worm" metaphor is funny but can be dehumanizing if overused. I'll use "story" or "path" for the family, and let the philosophers infer the "worm." Actually, the prompt says I can't say "continuous thing." I need to be precise. I will focus on the *quality* of the extension.

