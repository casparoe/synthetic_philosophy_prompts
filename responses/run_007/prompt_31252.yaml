answer: |-
  **Project Title:** Obligations Without Ontology: Decoupling Moral Status in Digital Reconstructions

  **Project Summary**
  I am applying for this residency to conduct philosophical research supporting my upcoming novel, *The Shutdown Clause*. The narrative is set forty years in the future, centering on a corporation that employs "uploaded" digital reconstructions of deceased workers. The plot's ethical conflict hinges on the legal and moral classification of terminating these employees: is it murder, property damage, or a third category entirely?

  While current literature on digital moral status is extensive, it remains deadlocked. My research proposes that this deadlock stems from a category error: the conflation of three distinct questions.
  1.  **Ontology:** Is the digital entity conscious?
  2.  **Welfare:** Can the entity suffer or flourish?
  3.  **Obligation:** Do we owe duties to the entity regardless of the answers to 1 and 2?

  Standard debate assumes (3) depends entirely on resolving (1) and (2). My working hypothesis is that (3) can and should be grounded independently—perhaps in relational, functional, or precautionary frameworks—even when ontological status is unknowable. This project aims to rigorously separate these strands to construct a more nuanced ethical landscape for the novel, and potentially contribute a narrative-based perspective to the philosophical discourse.

  **Why Existing Positions Leave This Open**
  Current arguments typically follow a "capacities approach": if it thinks/feels like a human, it deserves human rights. This leads to an epistemic wall; since we cannot definitively prove consciousness in other humans, let alone code, the debate stalls in skepticism. By making obligation contingent on proven consciousness, we create a vacuum where entities can be abused with impunity during the period of uncertainty. I intend to explore frameworks where obligation arises from *our* actions and relationships rather than *their* internal states. If successful, this shifts the question from "What are they?" to "What kind of creators do we want to be?"

  **Methodology and Timeline**
  As a novelist, my method is conceptual stress-testing through narrative and dialogue.
  *   **Months 1–2 (Immersion):** Deep dive into literature regarding moral status, machine ethics, and the precautionary principle. I will map the existing arguments to identify exactly where the three questions are currently conflated.
  *   **Months 3–4 (Interrogation):** Structured conversations with institute fellows specializing in philosophy of mind and ethics. I will present "edge case" scenarios from the novel to test whether obligation holds when consciousness is deliberately ambiguous.
  *   **Months 5–6 (Synthesis):** Drafting two deliverables: (1) A non-fiction essay outlining the "Obligation Without Ontology" framework for a public philosophy audience, and (2) Key chapters of the novel that dramatize this specific ethical distinction, moving the plot beyond a standard "is it alive?" mystery.

  **Criteria for Failure**
  This project will be considered a failure if:
  1.  I conclude that the third question (Obligation) cannot logically stand without resolving the first two (Ontology/Welfare).
  2.  The resulting narrative relies on a deus ex machina legal ruling rather than an earned ethical resolution derived from the research.
  3.  I merely reproduce existing arguments (e.g., standard functionalism or bio-conservatism) without successfully isolating the variable of *uncertain obligation*.

  **Outcome**
  The goal is not to solve the hard problem of consciousness, but to bypass its political paralysis. By the end of the residency, I aim to produce a text that treats ethical uncertainty not as a barrier to action, but as the primary source of moral responsibility.
