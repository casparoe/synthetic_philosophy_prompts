          *   *Follow-up:* If procedure alone can't rule out deliberating into sadism, doesn't the SMS need substantive constraints, thereby admitting external elements?

      *   **Topic 2: The Apathetic/Self-Destructive Agent**
          *   *Issue:* Williams uses the "gin/petrol" case. But what about someone who *doesn't care* about their future (depression, nihilism)? Externalists say they still have a reason to eat. Internalists say if no link to SMS, no reason. This seems counterintuitive.
          *   *Draft Q:* How do you handle the agent with no future-oriented desires?
          *   *Standard Reply:* We try to find a link (e.g., they want to avoid pain now, which requires eating). Or we say they genuinely have no reason (error theory for that case).
          *   *Follow-up:* If you say they have *no* reason to avoid starvation, aren't you stripping "reason" of its normative grip, making it merely descriptive of psychology?

      *   **Topic 3: McDowell's Challenge (Conversion)**
          *   *Issue:* McDowell argues some changes (e.g., becoming virtuous) aren't deliberative routes from *old* values but a new perspective entirely. Williams says this is "conversion," not reasoning.
          *   *Draft Q:* McDowell says virtue involves seeing reasons previously invisible. Isn't this external?
          *   *Standard Reply:* That's not reasoning; that's a change in character. We are talking about reasons *for* the agent as they are.
          *   *Follow-up:* But if the "new" perspective is objectively better (more rational), doesn't that imply a standard of rationality independent of the prior SMS?

      *   **Topic 4: Categorical Force of Moral Reasons**
          *   *Issue:* Morality feels binding even if I don't care. Internalism makes morality hypothetical ("If you care about X...").
          *   *Draft Q:* How do you account for the "ought" that binds even the uninterested?
          *   *Standard Reply:* Reject categorical imperatives. Morality is only binding if you care about being moral.
          *   *Follow-up:* Doesn't this make the "wrongness" of genocide contingent on the genocidaire's psychology? If they don't care, it's not irrational?

      *   **Topic 5: Expanding the SMS (The "Extension" Problem)**
