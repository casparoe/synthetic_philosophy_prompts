          *   *Follow-up:* If the idealized self is sufficiently different from the actual self, in what sense are those reasons *yours*?

      *   **Topic 7: Normativity and Explanation**
          *   *Issue:* Williams links reasons to explanation of action. Externalists separate them.
          *   *Draft Q:* Why tie reasons so tightly to motivational explanation?
          *   *Standard Reply:* Otherwise reasons are metaphysically queer (error theory).
          *   *Follow-up:* Isn't the "queerness" argument just a prejudice against non-natural properties? Why privilege naturalistic explanation over normative truth?

      *   **Topic 8: The "Rational Requirement" Objection**
          *   *Issue:* Some argue rationality *requires* certain ends (e.g., means-end coherence).
          *   *Draft Q:* Is instrumental rationality the only constraint?
          *   *Standard Reply:* Yes, substantive ends come from SMS.
          *   *Follow-up:* What about consistency? If I value A and B, but they conflict, does reason dictate a resolution independent of my preference strength?

