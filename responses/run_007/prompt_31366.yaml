answer: |-
  Here is a brainstorming analysis followed by the complete session plan.

  ### Part 1: Brainstorming Candidate Mechanics

  Before settling on the design, here are three ways you could structure the betting environment, along with their pedagogical strengths and weaknesses.

  **1. The "Free-Choice" Poker Chip Game**
  *   **Mechanic:** Give everyone 100 chips. Flip a biased coin (60% heads) 20 times. Players write down how many chips they want to bet each round.
  *   **Teaches:** The psychological difficulty of sizing. People feel the pain of loss more than the joy of gain (loss aversion).
  *   **Breaks:** Variance masks the lesson. One "All-In" player might get lucky and win big, while a "Kelly" player hits a bad streak and loses. In a 90-minute room, you cannot rely on the law of large numbers to save you. You risk ending the session with the wrong conclusion ("It's just luck").

  **2. The "Continuous Die" Multiplier**
  *   **Mechanic:** Roll a 10-sided die. 1-5: lose 50% of bet. 6-10: gain 80% of bet. Players bet a percentage of their bankroll.
  *   **Teaches:** That positive arithmetic expectation ($0.5 \times -0.5 + 0.5 \times 0.8 = +15\%$) can still result in negative geometric growth if volatility is too high.
  *   **Breaks:** Mental math friction. Calculating 80% of a changing bankroll 20 times is tedious for adults without calculators. The cognitive load shifts from *strategy* to *arithmetic*, killing the "gut feel."

  **3. The "Fixed Sequence" Fund Simulation (Selected)**
  *   **Mechanic:** You pre-generate a specific sequence of 30 Wins/Losses (e.g., W-L-W-W-L...). Everyone plays against the *same* sequence. You assign participants to specific "Investment Funds" with fixed betting rules (All-In, 50% Bet, 20% Bet).
  *   **Teaches:** Isolates bet size as the *only* variable. Guarantees the mathematical outcome (All-In busts, Over-betting shrinks, Kelly grows) regardless of luck.
  *   **Breaks:** Feels less "free" than gambling. Requires you to be firm that this is a simulation of *time*, not a contest of luck.
  *   **Why it wins:** For a 90-minute educational session, **clarity trumps freedom.** You need the data to converge visibly so the debrief lands.

  ---

  ### Part 2: The Session Plan
  **Title:** The Ruin of the Rational Maximizer
  **Time:** 90 Minutes
  **Participants:** 18 Adults
  **Goal:** Visually and viscerally demonstrate that maximizing Arithmetic Expected Value (EV) leads to ruin, while maximizing Geometric Growth (Log Wealth) leads to compounding.

  #### I. Materials & Setup
  *   **Projector/Screen:** To display the "Market Sequence" (a pre-determined list of W/L outcomes).
  *   **Trackers:** 18 printed scorecards (simple columns: Round, Outcome, Bankroll).
  *   **Calculators:** 18 basic calculators (or allow phones).
  *   **Tokens:** Poker chips or colored beads (optional, but physical tokens help the "gut" feeling. Let's use **paper bankrolls** for speed, tracked on the scorecard).
  *   **The "Market Deck":** A stack of 30 cards, pre-written with 18 Wins and 12 Losses (60% win rate), shuffled *before* the session. Or, simpler: a pre-generated list projected one by one.

  #### II. The Payoff Scheme (The Trap)
  *   **The Coin:** 60% chance to Win, 40% chance to Lose.
  *   **The Odds:** Even Money. (Bet \$10, Win \$10. Bet \$10, Lose \$10).
  *   **The Math:**
      *   **Arithmetic EV:** $(0.6 \times 1) + (0.4 \times -1) = +0.2$. **Every bet is profitable on average.**
      *   **The Trap:** If you bet too much, the *sequence* of returns drags you down.

  #### III. Timeline & Run of Show

  **0:00 – 0:15 | Introduction & The Intuition Trap**
  *   **Hook:** Ask the room: "If I offer you a coin that lands heads 60% of the time, and I pay you even money, how many of you would bet your entire life savings on the first flip?" (Few hands). "How many would bet 10%?" (More hands).
  *   **Concept:** Introduce the game. "We are going to play 30 rounds. The odds are in your favor. The goal is to have the most money at the end."
  *   **Grouping:** Divide the 18 participants into **Three Funds** (6 people per Fund).
      *   **Fund Alpha (The Maximizers):** You must bet **100%** of your current bankroll every round.
      *   **Fund Beta (The Aggressives):** You must bet **50%** of your current bankroll every round.
      *   **Fund Gamma (The Compounders):** You must bet **20%** of your current bankroll every round.
  *   **Why:** This forces the variable. We aren't testing their gambling instinct; we are testing the *math of the strategy*.

  **0:15 – 0:45 | The Simulation (30 Rounds)**
  *   **Pace:** 1 minute per round.
  *   **Process:**
      1.  Reveal the outcome (Project "WIN" or "LOSS").
      2.  Participants calculate their new bankroll.
          *   *Win:* Bankroll + (Bankroll × Bet %)
          *   *Loss:* Bankroll - (Bankroll × Bet %)
      3.  **Crucial Facilitator Move:** Walk around. Help Fund Alpha do the math. When Fund Alpha loses *once*, their bankroll goes to **0**. They are out. Mark them as "RUINED."
      4.  Keep the pace brisk. Play music if needed.
  *   **The Sequence:** Use a pre-shuffled deck of 30 cards (18 Win, 12 Loss). *Tip: Ensure there is a Loss within the first 5 rounds.* This guarantees Fund Alpha goes bust early, creating tension for the rest of the game.

  **0:45 – 1:15 | The Reveal & Data Aggregation**
  *   **Stop Play:** Ask each Fund to report their final average bankroll.
  *   **Expected Outcome:**
      *   **Fund Alpha (100%):** Almost certainly \$0. (One loss wipes them out).
      *   **Fund Beta (50%):** Likely *less* than they started with. (This is the shocker. Positive EV bets, but they lost money).
      *   **Fund Gamma (20%):** Significant growth.
  *   **Visual:** Draw three lines on a whiteboard. Alpha flatlines at 0. Beta trends down. Gamma trends up.

  **1:15 – 1:30 | The Debrief (The Math of the Gut)**
  *   *See script below.*

  ---

  #### IV. The Debrief Script (Mapping Experience to Theory)

  **1. The Arithmetic Lie (0-5 mins)**
  *   **Ask Fund Alpha:** "You had the highest expected value per bet. Why are you broke?"
  *   **Explanation:** "You were maximizing the *Arithmetic Mean*. If you could play a billion games simultaneously, you'd be rich. But you played one game *sequentially*. In a sequence, a 100% loss cannot be recovered. You hit an 'absorbing barrier' (zero)."

  **2. The Volatility Drag (5-10 mins)**
  *   **Ask Fund Beta:** "You never went to zero. But many of you lost money. How? The odds were 60/40 in your favor!"
  *   **Explanation:** "This is **Volatility Drag**. Mathematically: If you lose 50%, you need a 100% gain to get back to even. The losses hurt more than the wins help because they happen on a larger base.
      *   Start with \$100. Bet \$50.
      *   Lose: You have \$50.
      *   Win: You gain 50% of \$50 (\$25). You have \$75.
      *   **Result:** One win, one loss. Net result: -\$25.
      *   **Lesson:** Positive Arithmetic EV $\neq$ Positive Geometric Growth."

  **3. Log Wealth & Ergodicity (10-15 mins)**
  *   **Ask Fund Gamma:** "You grew steadily. Why 20%?"
  *   **Explanation:** "You were intuitively maximizing the **Geometric Mean**, which is equivalent to maximizing the **Logarithm of Wealth**.
      *   **The Formal Distinction:**
          *   **Ensemble Probability (Arithmetic):** What happens if 1,000 people bet once? (Everyone gets rich).
          *   **Time Probability (Geometric):** What happens if 1 person bets 1,000 times? (You go bust if you bet too big).
      *   **Ergodicity:** A system is 'ergodic' if the average of many people equals the average of one person over time. Money compounding is **non-ergodic**. The group average lies to you about your individual future."

  ---

  #### V. Predictable Failure Modes & Mitigation

  **1. The "Math is Hard" Drag**
  *   **Risk:** Participants struggle to calculate 50% of \$137 repeatedly. The game slows, energy dies.
  *   **Fix:** Provide a "Cheat Sheet" on the tracker.
      *   *If Bet Size is 50%:* Win = Multiply by 1.5. Loss = Multiply by 0.5.
      *   *If Bet Size is 20%:* Win = Multiply by 1.2. Loss = Multiply by 0.8.
      *   Tell them: "Just use the multiplier, don't calculate the bet amount."

  **2. The "Unlucky Sequence" Complaint**
  *   **Risk:** Fund Gamma gets a string of losses and underperforms Fund Beta by chance.
  *   **Fix:** **Pre-determine the sequence.** Do not flip a live coin. Use a fixed list of 30 outcomes (18W, 12L) that you have tested in a spreadsheet beforehand to ensure Gamma wins and Beta loses. Project this same sequence for everyone. This removes variance and isolates the strategy.

  **3. The "Gambler's Rebellion"**
  *   **Risk:** Participants ignore the assigned Fund rules and change their bet size.
  *   **Fix:** Frame it as "You are an employee of this Fund. Your job is to execute the strategy, not choose it." Collect the sheets at the end to verify compliance (gamify the compliance).

  ---

  #### VI. What This Activity Cannot Teach (The Limitations)

  As the facilitator, you must be honest about where the metaphor ends. You need to supply this context verbally during the debrief.

  **1. Utility is Not Linear**
  *   **The Gap:** The game assumes \$1,000 is 1,000 times better than \$1. In real life, going from \$0 to \$10,000 matters more than \$1M to \$1.01M.
  *   **The Fix:** Acknowledge that Kelly betting (20%) is aggressive for real humans. Most people should bet *half-Kelly* (10%) because the pain of ruin is psychological, not just mathematical.

  **2. Markets are Not Coin Flips**
  *   **The Gap:** The game uses Independent, Identically Distributed (i.i.d.) events. Real markets have "fat tails" and correlation.
  *   **The Fix:** Explain that in the real world, we don't know the odds (the 60%). Because we are uncertain, we must bet *smaller* than the math suggests to account for estimation error.

  **3. The "Edge" is Rare**
  *   **The Gap:** The game gives them a 60% edge. This is incredibly rare in investing.
  *   **The Fix:** Conclude with: "The hardest part of investing isn't sizing the bet; it's finding a bet where the odds are actually in your favor. But if you find one, don't ruin yourself by betting too big."

  ### Facilitator's Cheat Sheet (The Math Behind the Curtain)

  *   **Sequence to Pre-Generate:** Ensure the first 5 rounds contain at least one Loss (to bust Alpha). Ensure the total count is roughly 60% Wins.
  *   **Fund Alpha (100%):** $Wealth_{final} = Wealth_{start} \times 2^{Wins} \times 0^{Losses}$. If Losses $\ge$ 1, Wealth = 0.
  *   **Fund Beta (50%):** Growth Factor per pair (1W, 1L) = $1.5 \times 0.5 = 0.75$. **They lose 25% of their money for every win/loss pair.** This is the visceral punchline.
  *   **Fund Gamma (20%):** Growth Factor per pair (1W, 1L) = $1.2 \times 0.8 = 0.96$. Wait, 20% is Kelly for 60/40 even money?
      *   Kelly Formula: $f^* = p - q/b$. Here $b=1$ (even money). $f^* = 0.6 - 0.4 = 0.2$.
      *   So 20% is optimal.
      *   Growth Factor per pair: $1.2 \times 0.8 = 0.96$? **Wait.**
      *   Let's check the Geometric Mean: $\sqrt{1.2 \times 0.8} = \sqrt{0.96} < 1$.
      *   *Correction:* With 60% win rate, you don't get 1W/1L. You get 3W/2L on average.
      *   3 Wins ($1.2^3 = 1.728$) $\times$ 2 Losses ($0.8^2 = 0.64$) = $1.105$.
      *   **Yes, Gamma grows.**
      *   Beta (50%): 3 Wins ($1.5^3 = 3.375$) $\times$ 2 Losses ($0.5^2 = 0.25$) = $0.84$. **Beta shrinks.**
      *   *This confirms the lesson works.*

  ### Final Advice for the Facilitator
  Your role is not to teach them the Kelly Criterion formula. Your role is to make them feel the **panic of Fund Alpha** and the **confusion of Fund Beta**. When Fund Beta asks, "But the odds were in our favor?", lean in. That confusion is the exact moment where "Arithmetic Expectation" dies and "Geometric Reality" is born. Let them sit in that confusion for a moment before you resolve it with the math.
