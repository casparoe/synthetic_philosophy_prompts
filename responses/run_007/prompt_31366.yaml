prompt: |-
  I cover science and ideas for a general-interest magazine, and lately I've been going down a rabbit hole about a claim that keeps showing up in peices on rationality and investing. It goes roughly like this: a bet can have positive expected value — genuinely favorable, on average — and still be a terrible bet to make over and over, because money compounds, and a string of losses can knock you out even when the odds were in your favor. The real thing to maximize, supposedly, is the logarithm of your wealth, or the geometric growth rate, not the arithmetic average payoff. I can follow the math, but I want a roomful of adults with no special math background to feel it in their gut before anyone names it.

  I'm running a 90-minute session at a science festival, about 18 people, and I want a betting game that doesn't use real money — tokens, points, a spreadsheet, whatever — where participants place repeated bets with positive expected value and discover, from what happens to them, that the size of the bet is doing all the philosophical work. The all-in expected-value maximizers should tend to go bust while the fractional bettors compound, and the group should notice this themselves rather than being told. Please give me the full runnable plan: rules, materials, a payoff scheme, a timeline, and a debrief that maps specific moments in the game onto the formal distinction between arithmetic and geometric expectation, and onto the idea that what compounds is log wealth. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about wich feature of the idea the activity can't reproduce — the facilitator will have to supply that part.

  You're an expert on probability theory, rational choice, and the Kelly-criterion side of this, the kind of person who could explain ergodicity to a smart lay audience without slides. Before you commit to a final design, brainstorm two or three candidate game mechanics and say what each one would teach and where it would break; then give me the version you'd actually run.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** General-interest magazine readers / Science festival attendees (18 adults, no special math background).
      *   **Goal:** Demonstrate the difference between Arithmetic Expected Value (EV) and Geometric Growth (Kelly Criterion/Log Wealth) through experience, not just lecture.
      *   **Core Concept:** A bet can have positive EV but ruin you if bet sizes are too large (volatility drag/ruin). Maximizing log wealth is the sustainable strategy.
      *   **Format:** 90-minute session, interactive betting game (no real money).
      *   **Deliverables:**
          1.  Brainstorm 2-3 game mechanics (pros/cons).
          2.  Select the best one and provide a full runnable plan (rules, materials, timeline, debrief).
          3.  Identify predictable failure modes and mitigation.
          4.  Identify what the activity *cannot* teach (limitations).
      *   **Tone:** Expert but accessible, practical, facilitator-focused.

  2.  **Brainstorming Game Mechanics:**

      *   *Idea 1: The Coin Flip All-In.*
          *   **Mechanic:** Flip a biased coin (60% heads). Heads = double money, Tails = lose money. Participants choose bet size each round.
          *   **Pros:** Simple, classic Kelly setup.
          *   **Cons:** "Double or nothing" is too extreme. If you lose, you're at zero immediately. It doesn't show *compounding* drag as well as partial losses. It feels too much like gambling ruin rather than investment drag.
          *   **Verdict:** Too binary. Needs more nuance in the payoff structure to show "positive EV but negative growth."

      *   *Idea 2: The Die Roll Multiplier.*
          *   **Mechanic:** Roll a 6-sided die. 1-3: lose 50% of bet. 4-6: gain 80% of bet. (EV is positive). Players bet a % of their bankroll.
          *   **Pros:** Shows partial losses. Easy to calculate mentally (half, 80%).
          *   **Cons:** Mental math might slow things down for 18 people over many rounds. Tracking percentages of changing bankrolls is error-prone without spreadsheets.
          *   **Verdict:** Strong contender, but needs streamlined tracking.

      *   *Idea 3: The "Bag of Tokens" (Physical Probability).*
          *   **Mechanic:** Draw from a bag. 5 red (win), 5 black (lose). Payoff is fixed multiplier.
          *   **Pros:** Tangible.
          *   **Cons:** Sampling without replacement changes odds, complicating the EV calculation. Sampling with replacement is fine but requires a facilitator to manage the bag, slowing the pace.
          *   **Verdict:** Logistically messy for 18 people.

      *   *Idea 4: The Spreadsheet/Calculator Hybrid (Selected Concept).*
          *   **Mechanic:** A specific biased coin flip (e.g., 50/50 win/loss, but win = +1.5x bet, loss = -1x bet). Wait, that's standard. Let's look at the "Haghani & Dewey" experiment structure.
          *   **Refinement:** Let's use a simple multiplier game. 60% chance to win. Win = +100% of bet. Loss = -100% of bet. *Wait, that's ruin.*
          *   **Better Refinement:** Win = +50% of *total bankroll*? No, bet size is the variable.
          *   **Best Structure:** The "60% Biased Coin" is the gold standard for this. To make it visceral without math:
              *   Event: 60% Win, 40% Loss.
              *   Payoff: Win = Gain amount bet. Loss = Lose amount bet. (Even money odds).
              *   *Wait, if odds are even money and P(win) > 0.5, Arithmetic EV is positive.*
              *   *If you bet 100% (All-In), you eventually go bust.*
              *   *If you bet 20% (Kelly), you grow.*
              *   *Problem:* If it's even money payoff (bet 10, win 10), the Kelly fraction is $2p - 1$. If $p=0.6$, Kelly = 0.2 (20%). This is perfect.
              *   *Tracking:* Use a simple tracker sheet or a shared Google Sheet projected on screen? No, individual sheets are better for personal experience.
              *   *Speed:* 30 rounds is needed to see divergence. 90 mins allows for this.

      *   *Decision:* I will propose the **"Biased Coin Tournament"**. It's the cleanest mapping to the theory. I need to ensure the tracking is easy so they focus on the *feeling* of the bet size, not the arithmetic.

  3.  **Developing the Selected Plan:**

      *   **The Hook:** Start with the intuition trap. "Who thinks betting everything on a favorable coin is smart?"
      *   **The Game:** 30 Rounds. 60% chance to win. Even money payoff.
      *   **Groups:** Split the 18 people into 3 strategies (forced or chosen?). *Better:* Let them choose their "Persona" or "Strategy Card."
          *   Group A: The Maximizer (Bet 100% / All-In).
          *   Group B: The Conservative (Bet 10%).
          *   Group C: The Optimizer (Bet 20% - Kelly).
          *   *Actually, letting them choose freely is more powerful.* They discover the bust themselves. But for a 90-min session, we need guaranteed outcomes for the debrief.
          *   *Hybrid:* Let them choose freely for Round 1-10. Then reveal the "Secret Strategies" for Round 11-30 to ensure we have data for the debrief.
          *   *Simpler:* Assign roles. It's a demonstration *with* participation. If everyone goes bust, it's depressing. If everyone wins, no lesson.
          *   *Best Approach:* Everyone plays freely for 5 rounds. Then we split into three "Funds" (All-In, Fixed %, Kelly). We run the simulation for the Funds together. This guarantees the contrast needed for the debrief while letting them feel the anxiety of choice first.

      *   **Materials:** Tokens (poker chips), Trackers (paper), Biased Coin mechanism (digital randomizer projected is fastest and fairest).
      *   **Timeline:**
          *   Intro (15m)
          *   Free Play (15m)
          *   Structured Funds (30m)
          *   Debrief/Math (30m)
      *   **Debrief:** Connect "going bust" to Geometric Mean < 1. Connect "growth" to Log Wealth.
      *   **Failure Modes:** Math errors, boredom during 30 rounds, skepticism about the coin.
      *   **Limitations:** Real markets aren't i.i.d. (independent and identically distributed). Utility of money isn't linear.

  4.  **Refining the Math for the Facilitator:**
      *   $p = 0.6$, $q = 0.4$. Payoff $b = 1$ (bet 1 win 1).
      *   Arithmetic EV per bet = $0.6(1) + 0.4(-1) = 0.2$ (20% of bet amount). Positive!
      *   Geometric Growth Rate $g = p \ln(1+f) + q \ln(1-f)$.
      *   If $f=1$ (All In): $0.6 \ln(2) + 0.4 \ln(0) \to -\infty$. (Ruin).
      *   If $f=0.2$ (Kelly): Maximize $g$.
      *   If $f=0.5$ (Overbetting): $0.6 \ln(1.5) + 0.4 \ln(0.5) \approx 0.6(0.4) + 0.4(-0.7) = 0.24 - 0.28 = -0.04$. Negative growth despite positive EV! *This is the key insight.* Betting 50% loses money on average over time, even though each bet is +EV. I must include the "Overbetting" group (e.g., 50%) to show this specific nuance.

  5.  **Drafting the Content:**
      *   *Tone:* Professional, encouraging, slightly provocative.
      *   *Structure:*
          1.  Brainstorming (as requested).
          2.  Selected Design (The "Three Funds" Experiment).
          3.  Run of Show.
          4.  Debrief Script.
          5.  Failure Modes & Limitations.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 rounds too long?
      *   *Fix:* Use a digital randomizer to generate the sequence *once* and project it. Everyone plays the *same* sequence of wins/losses. This removes luck variance between players and isolates the *bet size* variable. This is crucial. If Player A goes bust and Player B wins, they might argue "you just got bad luck." If they play the *same* coin flips, the only variable is strategy.
      *   *Correction:* Generate a fixed sequence of 30 outcomes (e.g., W W L W L L...) beforehand. Project them one by one. This ensures the "All-In" person *will* hit a loss eventually and bust. The "50% bettor" *will* decline. The "20% bettor" *will* grow. This makes the debrief airtight.

  7.  **Final Polish:**
      *   Ensure the distinction between Arithmetic (ensemble average) and Geometric (time average) is clear in the debrief.
      *   Make sure the "Log Wealth" concept is explained as "resilience to volatility."
      *   Check timing: 90 mins is tight for 30 rounds + discussion. Maybe 20 rounds is enough if the sequence is rigged to show the effect quickly (e.g., ensure a loss happens early for the All-In group). No, keep it random but fixed. 20 rounds is sufficient for divergence.

  8.  **Finalizing the Output:** (Proceeding to generate response based on these thoughts).
      *   *Brainstorming:* Coin Flip (Binary), Die Roll (Continuous), Fixed Sequence (Controlled).
      *   *Selection:* Fixed Sequence Biased Coin.
      *   *Plan:* Detailed steps.
      *   *Caveats:* Ergodicity assumption, utility function.

  *(Self-Correction on the "Overbetting" nuance)*: I need to make sure I explain that betting 50% loses money *in the long run* even though every single bet has positive expected value. This is the "gut punch." I will assign one group to bet 50%.

  *(Self-Correction on Materials)*: Keep it analog where possible to avoid tech failure, but use a projector for the "Market Sequence" to ensure everyone sees the same reality.

