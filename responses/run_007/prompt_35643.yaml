answer: |-
  This is a fantastic application of moral philosophy to historical jurisprudence. You have identified what might be called a "limit case" for the standing-to-blame (STB) literature. Most of the work by Wallace, Fritz, Miller, and Bell focuses on interpersonal relationships—friends, colleagues, family members. Scaling that up to international relations and state-sponsored atrocity puts significant stress on the concepts.

  As a geologist, you know that when you push a model to its limits (like high pressure or temperature), you find out where the fault lines are. Nuremberg is that high-pressure environment for STB theory.

  Here is an analysis of the Nuremberg Trials through the lens of the standing-to-blame literature, mapping the charges, the hypocrisy objections, and where the theory might need refinement.

  ### 1. Mapping the Charges and the "Hypocrisy" Objections

  To apply STB theory, we first need to establish the norms invoked at Nuremberg and compare them to the Allies' conduct. The STB literature (particularly Fritz & Miller) argues that you lose standing to blame if you violate the *same norm* you are invoking, thereby demonstrating a lack of commitment to that norm.

  | Nuremberg Charge Category | The Norm Invoked | Allied Counter-Examples (The "Hypocrisy" Claim) | STB Analysis of Similarity |
  | :--- | :--- | :--- | :--- |
  | **Crimes Against Peace** (Aggressive War) | Sovereignty; prohibition of unprovoked invasion. | **USSR:** Invaded Poland (1939), Finland (1939). <br>**UK/FR:** Colonial expansion/maintenance. | **High Similarity.** In terms of international law at the time, the Soviet invasion of Finland is structurally similar to German aggression. |
  | **War Crimes** (Conduct in War) | Distinction (combatant vs. civilian); Proportionality. | **US/UK:** Firebombing of Dresden, Tokyo; Atomic bombs. <br>**USSR:** Katyn Massacre; Rape of German civilians. | **Moderate/High Similarity.** Area bombing intentionally targeted civilian morale. Katyn was the execution of POWs. These violate the *same* laws of war. |
  | **Crimes Against Humanity** (Persecution/Extermination) | Protection of populations from state-sponsored extermination based on identity. | **USSR:** The Gulag; Holodomor. <br>**Allies:** Colonial atrocities (e.g., Bengal famine, though debated as intentional). | **Low Similarity (Qualitative).** While Soviet repression was brutal, the *industrialized, biological intent* of the Holocaust differs in kind from political repression or colonial neglect. |

  ### 2. Applying the Standing-to-Blame Framework

  Let's apply the specific arguments from the philosophers you mentioned to this map.

  #### A. The Commitment Condition (Fritz & Miller)
  Fritz and Miller argue that hypocrisy undermines standing because it shows a lack of *commitment* to the moral norm. If I blame you for lying while I lie, I show I don't actually care about truth-telling; I just care about wielding power.

  *   **Application to Nuremberg:** On the charge of **Aggressive War**, the Soviets clearly lacked standing by Fritz & Miller's lights. They invaded neighbors just as the Nazis did. On **War Crimes**, the US and UK's area bombing campaigns suggest a wavering commitment to the principle of non-combatant immunity.
  *   **The Verdict:** Strictly speaking, the STB literature suggests the Allies had **diminished or null standing** on several counts. If standing requires "clean hands" regarding the specific norm, the Allies fail.

  #### B. The Authority Condition (R. Jay Wallace)
  Wallace focuses on the *authority* to hold someone accountable. Blame is a demand for compliance with moral obligations. Do the Allies have the authority to make this demand?

  *   **Application to Nuremberg:** Wallace might argue that standing is tied to the relationship between the parties. In interpersonal cases, we share a moral community. In international relations, is there a shared community?
  *   **The Verdict:** The Allies could claim standing not as *moral peers*, but as *enforcers of a breached social contract*. However, Wallace's framework struggles here because the "community" was destroyed by the war. The Allies were asserting a *new* normative order, not enforcing an existing shared one.

  #### C. The Emotional/Communicative Condition (Macalester Bell)
  Bell views blame as a communicative act involving emotions like resentment. She asks: Is this blame an appropriate way to relate to the wrongdoer?

  *   **Application to Nuremberg:** Hypocritical blame often communicates arrogance ("I am better than you"). The "Victor's Justice" critique suggests Nuremberg communicated: "We won, so we define right and wrong."
  *   **The Verdict:** If the blame feels like domination rather than moral accountability, Bell would say the standing is compromised. The fact that no Allied leaders were tried fuels this sense of arrogance.

  ### 3. Why Nuremberg Feels Different: Three Theoretical Exits

  You noted that it feels "absurd" to say Nuremberg was illegitimate despite the hypocrisy. This intuition suggests the standard STB model is missing variables when scaled to atrocity. Here are three ways to refine the theory to accommodate Nuremberg.

  #### Refinement 1: Representative Standing (The "Proxy" Argument)
  In standard STB cases, I blame you for wronging *me* or *us*. At Nuremberg, the Allies were not blaming the Nazis primarily for wronging *the Allies* (though that happened), but for wronging *the victims* (Jews, Roma, disabled persons, occupied civilians).

  *   **The Fix:** We can refine STB to allow for **Representative Standing**. If I am blaming you on behalf of a third party who cannot speak (the dead), my own moral record is less relevant than my willingness to represent *them*.
  *   **Implication:** The US might lack standing to blame Nazis for bombing civilians (because the US did it too), but they *retain* standing to blame Nazis for gassing Jews (because the US did not do that, and they represent the victims). This splits the standing by charge.

  #### Refinement 2: Gravity-Weighted Standing
  Standard STB treats norms somewhat equally (lying vs. stealing). But in international law, there is a hierarchy (*jus cogens* norms).

  *   **The Fix:** Standing might be **sliding-scale based on the gravity of the violation**. Minor hypocrisy does not revoke standing to blame major atrocities.
  *   **Analogy:** A police officer who speeds (violating traffic law) does not lose the standing to arrest a murderer (violating penal law). The norms are in different weight classes.
  *   **Implication:** The Allied firebombing (War Crimes) might undermine their standing to prosecute German officers for firebombing, but it does not undermine their standing to prosecute the Holocaust (Crimes Against Humanity). The qualitative difference you sensed is codified here: The Holocaust violated a norm of such gravity that only comparable moral failure could revoke standing to blame it.

  #### Refinement 3: Institutional vs. Interpersonal Standing
  This is the most critical refinement. The literature you are reading is mostly about *interpersonal* blame (I blame You). Nuremberg was *institutional* blame (The Tribunal blames The Defendant).

  *   **The Fix:** Institutions derive standing from **procedure and mandate**, not the moral purity of their agents.
  *   **Implication:** The Tribunal's standing came from the London Charter and the surrender of the German state, not the moral biography of Churchill or Stalin. If we view Nuremberg as a legal mechanism rather than a moral conversation, the "hypocrisy" objection shifts from "lack of standing" to "procedural unfairness."
  *   **Problem:** This risks legal positivism ("might makes right"). To avoid this, the *law itself* must be morally sound. Since the laws against genocide were morally sound, the Tribunal had standing, even if the judges were flawed.

  ### 4. Does Nuremberg Expose a Limitation in the Theory?

  Yes, it exposes two specific limitations in the current STB literature:

  1.  **The Dyadic Trap:** STB theory assumes a two-party relationship. It struggles with triadic structures (Blamer -> Wrongdoer -> Victim). In cases of mass atrocity, the "Victim" is the primary stakeholder. If the Blamer is acting as an agent for the Victim, the Blamer's personal hypocrisy is less relevant.
  2.  **The "All or Nothing" Problem:** Current theory often suggests hypocrisy *vitiates* (nullifies) standing. Nuremberg suggests standing is **partial and specific**. The Allies had standing on Count 4 (Crimes Against Humanity) but shaky standing on Count 1 (Crimes Against Peace). The theory needs to allow for *charge-specific standing*.

  ### 5. Conclusion: A Proposal for Refinement

  If we want to save the intuition that Nuremberg was legitimate while acknowledging Allied crimes, we should refine the Standing to Blame framework to include a **Jurisdictional Clause**.

  In geology, you distinguish between local erosion and systemic collapse. We should do the same here.
  *   **Interpersonal Blame:** Requires high moral consistency (clean hands). If I lie, I can't blame you for lying.
  *   **Institutional/Atrocity Blame:** Requires **Representative Authority**. The question isn't "Are you sinless?" but "Are you authorized to enforce this specific norm on behalf of those harmed?"

  Under this refined view:
  *   The Soviets lacked standing on **Aggressive War** (they were co-aggressors).
  *   The US/UK had weakened standing on **War Crimes** (due to area bombing), suggesting a moral deficit that should have been acknowledged (perhaps by limiting the scope of prosecution).
  *   The Allies retained full standing on **Crimes Against Humanity** (Holocaust), because no Allied action constituted a comparable violation of *that specific norm*, and they acted as proxies for the exterminated.

  **The Takeaway:**
  Nuremberg doesn't break the theory, but it forces it to grow up. It moves STB from a question of personal virtue ("Am I good enough to blame?") to a question of normative jurisdiction ("Am I the right agent to enforce *this* rule?"). The Allies' "standing" wasn't derived from their moral purity, but from the collapse of the German state and the necessity of representing the victims of a unique evil. The hypocrisy matters—it stains the legacy and validates the "Victor's Justice" critique—but it does not erase the standing to prosecute the core crimes against humanity.

  This aligns with your geological intuition: The stratigraphy of the moral landscape at Nuremberg has different layers. You can't judge the bottom layer (genocide) by the erosion on the top layer (bombing). They are different formations, requiring different assays.
