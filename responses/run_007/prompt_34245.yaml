      *   *Is Tom completely wrong?* No. He's right that the girlfriend *did* wrong. Hypocrisy doesn't exonerate the cheater. I need to make sure the user understands that Alex's lack of standing doesn't mean the girlfriend is innocent.
      *   *The "Reformed Criminal" point:* Tom argues a reformed criminal *can* blame. Mira argues they can if they repented. This is a crucial distinction. The "Commitment Account" of standing supports Mira here.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Who is right?" summary is balanced. (Proceed to draft response).

