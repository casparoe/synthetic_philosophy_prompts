answer: |-
  This is a fantastic example of a genuine philosophical debate that often plays out in ethics seminars, not just dinner parties. Your friends stumbled into a well-documented problem in moral philosophy known as **the standing to blame.**

  Both Mira and Tom are making defensible points, but they are talking past each other because they are defining "blame" differently. Tom is treating blame as a **statement of fact**, while Mira is treating blame as a **social practice.**

  Here is a breakdown of who is right about what, where the arguments hold up, and where they go wrong.

  ### 1. The Core Disagreement: Truth vs. Authority
  **Tom:** *"The truth of the moral claim doesn't depend on who's saying it."*
  **Mira:** *"Blame isn't just stating a proposition—it's a kind of social act."*

  *   **Who is right:** **Both.**
  *   **The Breakdown:**
      *   **Tom is right about Truth:** Logically, the statement "Cheating is wrong" is true regardless of whether a saint or a sinner says it. If Alex says, "You violated our agreement," that is a factual claim about the relationship. Alex's past behavior does not change the fact that his girlfriend cheated. This is the logical principle behind avoiding the *tu quoque* fallacy (appealing to hypocrisy).
      *   **Mira is right about Authority:** Blame is not just describing the world; it is trying to *change* it. When you blame someone, you are demanding they feel guilt, make amends, or acknowledge a debt to you. Philosophers (like R. Jay Wallace or Pamela Hieronymi) argue that to make this demand, you need **standing**. If you violate the very norm you are enforcing, you undermine your authority to demand compliance from others.
  *   **Where they go wrong:** Tom assumes that if the *content* is true, the *act* is valid. Mira assumes that if the *act* is invalid, the *content* loses weight. They need to agree that the content can be true even if the act is inappropriate.

  ### 2. The "Reformed Criminal" Objection
  **Tom:** *"Nobody who's ever done something wrong can ever blame anyone... So a reformed criminal can't blame crime?"*
  **Mira:** *"It's different if you've actually repented or at least acknowledged what you did."*

  *   **Who is right:** **Mira.**
  *   **The Breakdown:**
      *   **Tom's Trap:** Tom is setting up a slippery slope. He suggests that if hypocrisy removes standing, then *any* past sin removes standing. This would lead to a moral silence where no imperfect human can ever correct anyone else.
      *   **Mira's Escape:** Mira successfully navigates this by introducing the **Commitment Condition**. The problem with hypocrisy isn't that you *broke* the rule; it's that you show you don't *care* about the rule. A reformed criminal acknowledges, "What I did was wrong, and I hold myself to the standard I am holding you to." Alex, by contrast, is acting as though the rule applies to everyone *except* him (in the past) and *especially* to his girlfriend (now).
  *   **Where Tom goes wrong:** He conflates *fallibility* (having done wrong) with *hypocrisy* (condemning in others what you excuse in yourself). Moral standing requires consistency of commitment, not moral perfection.

  ### 3. Manners vs. Normative Force
  **Tom:** *"Maybe Alex is being annoying and oblivious... but I think what Mira's really objecting to is just bad manners."*
  **Mira:** *"Standing isn't about manners... If someone with no standing blames you, you're not actually answerable to them... The blame doesn't land."*

  *   **Who is right:** **Mira.**
  *   **The Breakdown:**
      *   **Tom's Reduction:** Tom tries to downgrade Mira's argument to etiquette ("unseemly," "annoying"). He thinks the worst thing Alex is doing is being rude.
      *   **Mira's Insight:** Mira identifies that blame has a specific job: to hold someone accountable. If you lack standing, you cannot hold someone accountable. It's not just that Alex is being rude; it's that his girlfriend is philosophically permitted to "swat away" his blame. She can say, "You don't get to demand this from me," and she would be right. The blame fails to perform its function.
  *   **Where Tom goes wrong:** He misunderstands the stakes. This isn't about politeness; it's about the **normative relationship** between two people. If you lack standing, the other person does not owe you the usual response to blame (guilt/apology).

  ### 4. Moral Relativity
  **Tom:** *"I still don't see how that works unless you think moral truth is somehow speaker-relative."*
  **Mira:** (Implied) *"No, the authority is relative, not the truth."*

  *   **Who is right:** **Mira (but Tom's concern is valid).**
  *   **The Breakdown:**
      *   **Tom's Fear:** Tom worries that if Alex can't blame, then cheating isn't wrong for Alex. He thinks Mira is saying morality changes based on who is speaking.
      *   **The Reality:** Mira is not saying cheating is okay. She is saying Alex is not the right person to administer the judgment. Think of it like a judge: If a judge breaks the law, they might be recused from presiding over a similar case. That doesn't mean the law doesn't exist; it means *that judge* can't enforce it.
  *   **Where Tom goes wrong:** He creates a false dichotomy. He thinks either (A) Moral truth is objective and anyone can enforce it, or (B) Moral truth is subjective. He misses option (C): Moral truth is objective, but the **right to enforce it** is conditional on the enforcer's relationship to that truth.

  ### Summary Verdict

  **Where Tom is Stronger:**
  *   He is right that Alex's girlfriend **did wrong.** Alex's hypocrisy does not exonerate her. She still betrayed him.
  *   He is right that the **proposition** "Cheating is bad" remains true regardless of Alex's history.

  **Where Mira is Stronger:**
  *   She is right about the **nature of blame.** Blame is a social transaction that requires authority.
  *   She is right that **hypocrisy forfeits standing.** Specifically, *unacknowledged* hypocrisy (which Alex has).
  *   She is right that this is **not just manners.** Alex's blame lacks "normative force." His girlfriend isn't morally required to accept his indictment in the way she would be if he were innocent.

  ### The Final Resolution
  If I had to judge the debate: **Mira wins on the philosophy of blame, but Tom wins on the morality of the act.**

  Tom is treating this like a math problem (Is statement X true?). Mira is treating it like a legal or social problem (Does Person Y have the jurisdiction to enforce Rule X?).

  **The Synthesis:**
  Alex is correct that he was wronged (Tom's point). However, because Alex has not reconciled his own past behavior with his current moral outrage, he lacks the standing to demand moral accountability from his girlfriend in the way he is trying to (Mira's point).

  **Practical Advice for the Group:**
  Alex is allowed to be hurt. But he is not allowed to be self-righteous. Until he acknowledges his own past cheating, his anger will feel "hollow" to his friends (and likely his girlfriend), because he is demanding a standard he has not applied to himself. Mira correctly identified that the *weight* of his anger is undermined by his history, even if the *cause* of his anger is valid.
