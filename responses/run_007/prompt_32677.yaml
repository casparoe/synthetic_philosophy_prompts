      *   **Task:** Identify candidate rules underlying the professor's classifications, determine what each rule predicts for the new case, evaluate which prediction is best (based on Nyāya theory), and suggest a tie-breaker case if necessary.

  2.  **Analyze the Data (The Ledger):**
      *   *Case 1:* Seeing rain $\rightarrow$ *Pratyakṣa* (Perception).
      *   *Case 2:* Wet pavement $\rightarrow$ Rain earlier $\rightarrow$ *Anumāna* (Inference).
      *   *Case 3:* Neighbor says post office closed $\rightarrow$ *Śabda* (Testimony).
      *   *Case 4:* Description of *gavaya* $\rightarrow$ Seeing *gavaya* $\rightarrow$ Recognition $\rightarrow$ *Upamāna* (Comparison).
      *   *Case 5:* Spotting bird $\rightarrow$ Kingfisher (via plumage) $\rightarrow$ *Anumāna* (Inference).
