          3.  *The Memory-Mediation Rule:* Heavy reliance on memory comparison pushes toward Inference (or *Upamāna*), but immediate recognition is Perception.
      *   **Prediction for Voice Case:**
          *   Most likely *Anumāna*.
          *   Reasoning: The voice is the *hetu* (mark), the mother is the *sādhya*. Analogous to the Kingfisher case (Plumage $\rightarrow$ Bird). Distinct from Cinnamon (Taste *is* the flavor).
          *   Nyāya Technicality: *Śabda-pramāṇa* is for *meaning*, not speaker ID. *Pratyakṣa* is for direct contact. We contact the sound, not the mother.
