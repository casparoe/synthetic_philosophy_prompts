  3.  **Analyze the Nyāya Theoretical Background (Crucial Step):**
      *   *Pratyakṣa (Perception):* Direct contact between sense organ and object. Usually involves *nirvikalpaka* (indeterminate) and *savikalpaka* (determinate). Crucially, in Nyāya, *savikalpaka* perception involves recognizing a substance qualified by a property (e.g., "This is a pot"). However, there's a debate about recognition (*pratyabhijñā*). Is recognition perception or memory/inference? Nyāya generally treats recognition as a complex cognition involving memory, but often classifies the *current* awareness as perceptual if the sense contact is direct.
      *   *Anumāna (Inference):* Knowledge of a probandum (*sādhya*) based on knowledge of a probans (*hetu*) and a universal relation (*vyāpti*). Requires a middle term. "There is fire because there is smoke."
      *   *Śabda (Testimony):* Verbal authority. Reliable speaker.
      *   *Upamāna (Comparison):* Knowledge of the relation between a name and a thing based on similarity to a known thing. (The *gavaya* case is the classic textbook example for *Upamāna*).

      *   *Specific Tension in the Ledger:*
          *   Kingfisher (Plumage $\rightarrow$ Species) = *Anumāna*.
          *   Cinnamon (Taste $\rightarrow$ Substance/Flavor) = *Pratyakṣa*.
          *   Voice (Sound $\rightarrow$ Person) = ?

      *   *Why Kingfisher = Anumāna?* In Nyāya, identifying a specific species based on *marks* (plumage) often involves a mental process: "This bird has blue plumage; all birds with blue plumage of this shape are kingfishers; therefore this is a kingfisher." It relies on a *liṅga* (mark) to establish an unobserved fact (the species identity).
      *   *Why Cinnamon = Pratyakṣa?* Taste is a direct sense object (*rasana*). If I taste cinnamon, the quality of "cinnamon-ness" (or the specific flavor profile) is directly presented to the tongue. There is no intermediate "mark" distinct from the flavor itself. The flavor *is* the object of the sense.
      *   *Why Gavaya = Upamāna?* This is the standard definition. Learning the name of a new thing via similarity to a known thing.

  4.  **Formulate Candidate Rules:**

      *   **Rule A: The "Direct Sense Contact" Rule (Strict Sensory Definition).**
          *   *Logic:* If the object is directly presented to a sense organ without a mediating mark/reasoning step, it's *Pratyakṣa*. If it requires reasoning from a mark to a hidden property, it's *Anumāna*.
          *   *Application:*
              *   Rain (Seen) $\rightarrow$ Direct $\rightarrow$ *Pratyakṣa*.
              *   Wet Pavement $\rightarrow$ Rain (Unseen/Past) $\rightarrow$ Indirect $\rightarrow$ *Anumāna*.
              *   Cinnamon $\rightarrow$ Taste is direct $\rightarrow$ *Pratyakṣa*.
              *   Kingfisher $\rightarrow$ Plumage is the mark, Species is the conclusion $\rightarrow$ *Anumāna*.
          *   *Prediction for Voice:* Is the *person* directly perceived via sound? Or is the sound a mark for the person?
              *   *Nuance:* In Nyāya, sound (*śabda*) is the object of hearing (*śrotra*). But recognizing *who* produced it involves memory and association.
              *   *Prediction:* Likely *Anumāna*. The voice is the *hetu* (mark), the mother is the *sādhya* (conclusion). "This voice has timbre X; Mother's voice has timbre X; Therefore this is Mother."

      *   **Rule B: The "Natural Kind vs. Quality" Rule.**
          *   *Logic:* Recognizing specific substances/kinds (Kingfisher) is inferential. Recognizing sensory qualities (Cinnamon flavor, Rain) is perceptual.
          *   *Application:*
              *   Rain (Event/Quality of weather) $\rightarrow$ *Pratyakṣa*.
              *   Cinnamon (Flavor) $\rightarrow$ *Pratyakṣa*.
              *   Kingfisher (Species/Kind) $\rightarrow$ *Anumāna*.
          *   *Prediction for Voice:* Is "Mother" a natural kind or a specific individual identified by a quality?
              *   Recognizing a specific person is often treated like recognizing a specific substance.
              *   *Prediction:* Could go either way, but leans *Anumāna* because "Mother" is an individual identified via the mark of the voice, not a direct sensory quality like "loudness" or "pitch."

      *   **Rule C: The "Memory-Dependence" Rule (Pratyabhijñā).**
          *   *Logic:* If the cognition relies heavily on recalling a past impression to identify the present object, is it Perception or Inference?
          *   *Nyāya View:* Nyāya accepts *pratyabhijñā* (recognition) as a form of perception (*savikalpaka pratyakṣa*), *provided* the current sense contact is direct. However, if the identification relies on a *liṅga* (inferential mark), it shifts to *anumāna*.
          *   *Ledger Clue:* Kingfisher is *Anumāna*. Why? Because plumage is a *sign* of the species. Cinnamon is *Pratyakṣa*. Why? Because the taste *is* the cinnamon (in that moment).
          *   *Prediction for Voice:* The voice is the sign. The mother is the source. We don't hear "Mother," we hear "Voice."
          *   *Prediction:* *Anumāna*.

      *   **Rule D: The "Testimony/Artifact" Rule (Śabda).**
          *   *Logic:* If the source is a linguistic utterance intended to convey information, it's *Śabda*.
