answer: |-
  A municipal health board must allocate a fixed budget between a pain management clinic and a public parks expansion, where funding one necessitates canceling the other. The clinic treats 1,000 residents suffering from a chronic neurological condition, while the parks provide daily recreational joy to 50,000 residents without alleviating any pain. In the base case, the condition involves debilitating cluster headaches that prevent work and sleep, leading both the classical utilitarian (CU) and the suffering-focused negative utilitarian (NU) to agree on funding the clinic. In the varied case, the severity is modestly reduced to chronic tension headaches which are painful and distracting but allow for normal function; here, the CU switches to funding the parks, calculating that the aggregate happiness gains outweigh the reduced suffering relief, while the NU maintains funding for the clinic, holding that the reduction of suffering categorically overrides the promotion of happiness regardless of the magnitude of pleasure foregone.

  (a) In the base case, both theories converge on funding the clinic but via distinct calculations. The CU computes net utility by subtracting the happiness lost from the parks (positive utility forgone) from the suffering prevented by the clinic (negative utility removed); because the severity of cluster headaches represents a massive negative utility, its removal outweighs the lost recreational joy. The NU, operating on a categorical distinction, views the clinic's outcome as a moral imperative (suffering reduction) and the parks' outcome as morally secondary or neutral (happiness promotion); since the primary category of suffering reduction is satisfied, the opportunity cost in happiness is irrelevant to the verdict.

  (b) When the condition's severity is varied to moderate tension headaches, the verdicts diverge because the trade-off threshold is crossed for only one theory. The CU recalculates the net utility: the utility value of the suffering prevented has dropped significantly due to the lower severity, while the happiness lost from the parks remains constant; consequently, the net utility becomes negative, prompting a switch to funding the parks. The NU, however, does not recalculate based on a shared scale; because the intervention still reduces suffering (however moderate) and the alternative only promotes happiness, the lexical priority of suffering reduction remains intact, and the verdict stays fixed on funding the clinic.

  (c) The structural feature doing the work is the fungibility of value versus lexical priority. Classical utilitarianism employs a single cardinal scale where suffering and happiness are fungible counters that can offset one another linearly; thus, a sufficient quantity of happiness can morally outweigh a quantity of suffering. Suffering-focused negative utilitarianism treats suffering reduction and happiness promotion as inhabiting different moral categories, often imposing a lexical hierarchy where any amount of suffering reduction takes precedence over any amount of happiness promotion, rendering them non-fungible.

  (d) A classical utilitarian would argue that the negative utilitarian's verdict in the divergent case reveals the "fanaticism" problem inherent in lexical prioritization. By insisting on funding the clinic for moderate headaches at the cost of significant recreational joy for 50,000 people, the NU demonstrates an inability to account for the moral relevance of positive well-being and opportunity costs. The CU would contend that a moral theory that mandates sacrificing massive amounts of human flourishing to alleviate relatively minor discomfort is counterintuitive and impractical, suggesting that suffering and happiness must be commensurable to reflect reasonable policy trade-offs.
