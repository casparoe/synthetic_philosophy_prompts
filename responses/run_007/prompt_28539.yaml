      *   *Ethical/Moral:* Is it permissible to engage?
      *   *Institutional/Economic:* Should it be sold/shown?
      *   *Psychological:* Can we actually do it?

  4.  **Drafting the Taxonomy (Iterative Process):**

      *   *Category 1: The Ontological Claim (The "Existence" Thesis).*
