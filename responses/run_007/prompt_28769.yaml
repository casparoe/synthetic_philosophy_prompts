answer: |-
  The stalemate you describe is not merely a lack of empirical data; it is a structural collision between two incompatible epistemic frameworks. Your hypothesis—that the impasse is about what counts as *data*—is close, but it is too shallow. It is not just about which data are admitted, but about the *epistemic status* of the first-person perspective itself.

  Here is a diagnosis of the structure of the disagreement, an analysis of its verbal and substantive components, and a proposal for what constitutes progress.

  ### 1. The Structure: A Clash of Epistemic Foundations
  The debate is structured as a **Moorean Shift**.
  *   **The Realist** treats the existence of phenomenal properties (qualia) as a "Moorean fact"—something more certain than any philosophical argument to the contrary. For the Realist, the *appearance* of consciousness is the *reality* of consciousness. To deny the appearance is to perform a performative contradiction.
  *   **The Illusionist** treats the closure of the physical world (or the success of functional explanation) as the Moorean fact. For the Illusionist, the *structure of scientific explanation* is more certain than the introspective report. Therefore, if introspection reports something incompatible with physical closure (i.e., non-physical qualia), introspection must be in error.

  The impasse exists because neither side can concede their Moorean fact without collapsing their entire worldview. The Realist cannot concede that experience is an illusion without admitting they don't know the one thing they claimed to know best. The Illusionist cannot concede that qualia are real without abandoning a naturalistic ontology.

  ### 2. Verbal vs. Substantive Disagreement
  The disagreement is hybrid. It begins as a verbal dispute that hardens into a substantive one.

  **The Verbal Component: "Phenomenal Consciousness"**
  *   **Realist Definition:** Refers to the *immediate felt character* of experience (the "what-it-is-like-ness").
  *   **Illusionist Definition:** Refers to the *theoretical property* introspection claims experience has (ineffability, intrinsicness, privacy).
  *   **The Friction:** When the Illusionist says, "Phenomenal consciousness does not exist," the Realist hears, "Feelings do not exist." The Illusionist means, "Feelings do not have the *metaphysical properties* we intuitively attribute to them."
  *   **Diagnosis:** If the Illusionist admitted, "There is felt character, but it is physical/functional," the Realist would likely be satisfied (this is essentially Physicalist Realism). But Illusionists often insist the *concept* is incoherent. Thus, the verbal dispute masks a substantive disagreement about whether the *intuition* of non-physicality is part of the phenomenon itself or a commentary upon it.

  **The Substantive Component: The Nature of Introspection**
  This is the true locus of the fight.
  *   **Realist View:** Introspection is **constitutive**. The act of attending to pain partly constitutes the pain. Therefore, it cannot misrepresent the pain's existence or its immediate quality. Error is possible about the *cause* of the pain, but not the *presence* of the pain.
  *   **Illusionist View:** Introspection is **detective**. It is a cognitive mechanism that scans internal states and generates a model. Like vision, it can suffer from illusions, confabulations, and systematic errors.
  *   **Diagnosis:** The substantive fight is over **Incorrigibility**. Can the mind be wrong about its own current state? If yes, Illusionism is possible. If no, Realism is mandatory.

  ### 3. Engaging the Moves

  **The Self-Refutation Charge**
  *   *Realist Move:* "An illusion is an experience. To say qualia are an illusion presupposes qualia."
  *   *Illusionist Reply:* "The *state* is real; the *property* is not."
  *   *Diagnosis:* This reveals the substantive core. The Realist assumes a **Naïve Realist** theory of introspection: to seem to have property P is to have property P. The Illusionist assumes a **Representationalist** theory: to seem to have property P is to be in a state that represents P.
  *   *Verdict:* This is not verbal. It is a disagreement about the metaphysics of mind. If the mind is representational, the Illusionist wins this point. If the mind is presentational (acquaintance-based), the Realist wins. Neither side can prove their model of introspection without begging the question.

  **The Explanatory Gap**
  *   *Realist Move:* "Functions don't add up to feelings."
  *   *Illusionist Move:* "The gap is the signature of the user-illusion."
  *   *Diagnosis:* The Realist treats the gap as **ontological** (a missing bridge between matter and mind). The Illusionist treats the gap as **cognitive** (a missing bridge between mechanism and self-model).
  *   *Verdict:* They are answering different questions. The Realist asks, "How does matter produce experience?" The Illusionist asks, "How does matter produce the *belief* that it produces experience?" Because the questions differ, the "Gap" functions as a proof of failure for one and a prediction of success for the other.

  **The Appeal to Introspective Error**
  *   *Illusionist Move:* Cites change blindness/confabulation to show introspection is fallible.
  *   *Realist Counter:* Distinguishes *external* attribution (what object caused this?) from *internal* character (that there is a character).
  *   *Diagnosis:* The Illusionist tries to generalize from peripheral errors to central errors. The Realist blocks this by claiming a firewall between the *content* of experience and the *judgment* about the content.
  *   *Verdict:* This is an empirical stalemate. Neuroscience shows judgments about experience are fallible, but it cannot show whether the *raw feel* accompanying those judgments is veridical.

  ### 4. Are They Answering Different Questions?
  Yes.
  *   **Realists** are doing **Phenomenological Ontology**: "What is the nature of the entity revealed in reflection?"
  *   **Illusionists** are doing **Cognitive Genealogy**: "What evolutionary and cognitive processes led to the report of such an entity?"

  The Realist wants a description of the *object* of awareness. The Illusionist wants a causal explanation of the *subject's report*. They talk past each other because the Realist thinks the report *is* the object, while the Illusionist thinks the report is data about a cognitive mechanism.

  ### 5. Is the Question Ill-Posed?
  There is a strong case that the question is ill-posed due to a **category mistake** regarding "Introspection."
  Both sides largely assume introspection is a form of *inner perception* (a "mind's eye").
  *   If introspection is perception-like, the Illusionist is right: perceptions can be illusory.
  *   If introspection is *acquaintance* (a non-relational direct knowing), the Realist is right: you cannot be acquainted with a non-existent property.

  However, if introspection is neither perception nor acquaintance, but rather a **skillful conceptualization** (a la Sellars or Wittgenstein), then the debate dissolves. On this view, "phenomenal consciousness" is not a datum found, nor an illusion generated, but a *status we assign* to certain reports within a linguistic community. The "feel" is not a thing to be real or unreal; it is a mode of engagement.

  ### 6. What Counts as Progress?

  Given this diagnosis, empirical experiments (neuroscience) will not solve the problem, because the data is already agreed upon (reports exist, brains exist); the dispute is over the *interpretation* of the relation between them. Formal results are unlikely to help, as the dispute is not logical but metaphysical/epistemic.

  **Progress would take one of three forms:**

  1.  **Conceptual Engineering (The Deflationary Path):**
      Progress consists in showing that "Phenomenal Consciousness" is a *folk-psychological kind term* that fails to carve nature at its joints. We would replace the binary "Real vs. Illusion" with a graded account of **access, reportability, and self-modeling**. If we can explain why the brain *must* model itself as having private qualia to function socially, the "illusion" loses its sting without denying the "reality" of the functional state. This dissolves the ontological worry.

  2.  **A New Theory of Introspection (The Metaphysical Path):**
      Progress requires a third option beyond "Inner Perception" (Illusionism) and "Direct Acquaintance" (Realism). A theory of **Transparent Self-Representation** could argue that the brain represents its states *without* representing the representation. This would explain the "immediacy" the Realist cherishes (no intermediate vehicle felt) while allowing the "error" the Illusionist requires (the representation format misleads the system). If this model can be formally specified, it bridges the gap.

  3.  **Acceptance of Cognitive Closure (The Quietist Path):**
      The most honest progress may be the argument that **no progress should be expected**. If human cognition evolved to model the external world and social agents, it may lack the computational architecture to model its own processing accurately (the "User Interface" theory of perception). On this view, the Realist intuition and the Illusionist explanation are both inevitable artifacts of our cognitive limitations. We are structurally barred from knowing if qualia are real or illusory, just as a camera cannot take a picture of its own lens without a mirror.

  **Recommendation:**
  The most productive immediate step is **Option 1 (Conceptual Engineering)**. The debate stalls because "Phenomenal Consciousness" is treated as a natural kind. Demonstrating that it is a *theoretical construct* generated by specific cognitive limitations (e.g., the need to distinguish self from other, or the limitations of working memory) allows us to keep the Realist's data (the reports) and the Illusionist's ontology (physicalism) without forcing a verdict on the "reality" of the qualia themselves. We stop asking "Is it real?" and start asking "What cognitive function does the *belief* in its reality serve?" This moves the debate from metaphysics to cognitive science, where traction is possible.
