      *   *Progress:* Likely requires a change of question or a dissolution of the framework. Empirical data (neuroscience) hasn't solved it because the dispute is about *interpretation* of that data relative to first-person authority.

  3.  **Drafting the Diagnosis - Section by Section:**

      *   **Structure of the Disagreement:** It's a "Moorean Shift" scenario. Realists hold common sense/phenomenology as fixed and adjust theory. Illusionists hold physicalist closure as fixed and adjust phenomenology. It's a clash of *starting points*.
