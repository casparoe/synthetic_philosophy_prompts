answer: |-
  **Session Objective:** To demonstrate that Douglass's reversal was a methodological shift in constitutional interpretation (Text vs. Intent), not a political compromise.

  **Total Time:** 25 Minutes

  ### I. Pedagogical Sequence (The Order of Ideas)

  **0:00–5:00: Establish the Garrisonian Baseline (The "Why it made sense" phase)**
  *   **Goal:** Students must feel the *force* of the pro-slavery reading before you dismantle it. If they think the Garrisonian view was stupid, they won't understand the reversal.
  *   **Action:** Briefly list the three pillars of the Garrisonian view:
      1.  Historical context (the framers were slaveholders).
      2.  The "compromises" (the document protected the institution).
      3.  The moral intuition (a deal with the devil is still a deal).
  *   **Key Point:** Emphasize that for Garrison, the Constitution was a *covenant* with slaveholders. To understand Douglass's shift, students must see that he initially agreed with this *method*: judging the document by the *intentions of the men who wrote it*.

  **5:00–10:00: The Methodological Turn (The "How he changed" phase)**
  *   **Goal:** Introduce the interpretive distinction. This is the engine of the session.
  *   **Action:** Define the shift. Douglass moves from **Original Intent** (What did the framers *mean* to do?) to **Textualism** (What does the law *say* it does?).
  *   **Crucial Distinction:** The Constitution is not a private contract between framers; it is public law addressed to "We the People." Its power lies in its enacted words, not the secret thoughts of its drafters.
  *   **Misconception Check (Political Convenience):** *Address this here.* State clearly: "Douglass did not change his mind to ally with political parties. He changed his mind because he realized Garrison's method made the Constitution immutable. If the text is pro-slavery because of *intent*, it can never be used to end slavery. If the text is judged by its *words*, it becomes a weapon."

  **10:00–20:00: The Anchor Clause (The "Proof" phase)**
  *   **Goal:** Apply the method to a specific text.
  *   **Action:** Distribute the text of **Article IV, Section 2, Clause 3 (The Fugitive Slave Clause)**.
  *   **Exercise:** Ask students to find the word "slave." (They won't). Ask them to identify what is being returned ("Person held to Service or Labour").
  *   **Douglass's Move:** Argue that "Service or Labour" implies a contractual debt, not property in man. The clause does not *create* slavery; it assumes state laws exist and mandates cooperation. It grants no federal power to *establish* slavery.
  *   **Misconception Check (Secret Intent):** *Address this here.* Students will argue, "But everyone *knew* this meant slaves." Counter with Douglass: "It matters what the law *authorizes*. If the text does not explicitly sanction property in man, the federal government has no warrant to support it, regardless of what the framers whispered."

  **20:00–25:00: Synthesis and Assessment**
  *   **Goal:** Verify understanding of the interpretive move.
  *   **Action:** Pose the assessment question (see below). Facilitate a 3-minute discussion.

  ---

  ### II. The Anchor Clause: Why This One?

  **Selected Clause:** **The Fugitive Slave Clause (Article IV, Section 2, Clause 3).**
  *   *Text:* "No Person held to Service or Labour in one State... escaping into another, shall... be delivered up on Claim of the Party to whom such Service or Labour may be due."

  **Why it works:**
  1.  **High Stakes:** This is the most morally repugnant clause to modern readers. If Douglass can read *this* as anti-slavery, the method holds.
  2.  **Textual Absence:** It relies on the absence of the word "slave" or "property." It forces students to look at the specific vocabulary ("Person," "Service," "Labour").
  3.  **Federalism:** It allows Douglass to argue that slavery is a creature of *state* law, while the federal Constitution is neutral or hostile to it.

  **Why NOT the Three-Fifths Clause?**
  *   **The Trap:** The Three-Fifths Clause (Article I, Section 2) explicitly counts "other Persons" (a euphemism for slaves) for representation.
  *   **The Problem:** To read this as anti-slavery, Douglass has to make a comparative argument: "It's better than counting them as whole persons." This concedes that the clause *is* about slaves, just less pro-slavery than it could be.
  *   **The Pedagogical Risk:** Using the Three-Fifths Clause tempts students to think Douglass is playing math games. The Fugitive Clause allows for a cleaner philosophical argument: The text *never acknowledges property in man*. Stick to the Fugitive Clause to keep the focus on the **Text vs. Intent** distinction, not on political arithmetic.

  ---

  ### III. Misconception Map

  | Misconception | What it sounds like | Where to Head It Off | How to Counter |
  | :--- | :--- | :--- | :--- |
  | **"Political Convenience"** | "Douglass just wanted to work with Lincoln/the Republicans, so he lied about the Constitution." | **Minute 5-10** (During the Methodological Turn) | Frame the shift as *radicalizing* his stance. The Garrisonian view made the Constitution untouchable. The Textualist view made it a tool for abolition. It was a move toward *more* action, not less. |
  | **"Secret Framer Intent"** | "Douglass is saying the Framers were actually abolitionists in disguise." | **Minute 15** (During the Clause Analysis) | Be explicit: Douglass admits the Framers compromised. His point is that they failed to write those compromises into the *supreme law*. The text outstripped their intent. |
  | **"Semantic Gymnastics"** | "He's just playing word games; everyone knew 'Person' meant 'Slave'." | **Minute 18** (End of Clause Analysis) | Acknowledge the historical reality, but reiterate the legal principle: In a republic, the *published law* binds the citizen, not the private diary of the lawmaker. |

  ---

  ### IV. Assessment Question

  Do not ask: *"What was Douglass's second position?"* (This tests memory).
  **Ask this instead:**

  > "Imagine a scenario where the Framers privately signed a document agreeing to protect slavery forever, but the public Constitution they ratified contained no mention of slavery and granted no power to enforce it. According to Douglass's **later** method, is the Constitution pro-slavery? Why?"

  **Correct Answer Indicators:**
  *   Students should say **No**.
  *   They must reference the **text** over the **intent**.
  *   They should note that public law binds the government, not private agreements.

  ---

  ### V. What to Explicitly Set Aside

  To survive the 25-minute limit, write these on the board as "Out of Scope" at the start:

  1.  **Biography:** Do not discuss Douglass's escape, his time in England, or his relationship with John Brown. Focus only on the *argument*.
  2.  **The Civil War Context:** Do not get bogged down in the 1860 election or the secession crisis. This is a seminar on *political thought*, not history.
  3.  **Post-War Amendments:** Do not discuss the 13th or 14th Amendments. Douglass's 1860 argument is about the *original* document, not the reconstructed one.
  4.  **Garrison's Reaction:** Do not spend time on how Garrison felt about the split. Keep the focus on Douglass's reasoning.
