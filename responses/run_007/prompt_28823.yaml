prompt: |-
  I'm an undergraduate in a seminar on American political thought, and next week I have to lead a twenty-five-minute session for my classmates on the change in Frederick Douglass's view of the Constitution—from his early Garrisonian position that the document was pro-slavery to his later position that, read by its own language rather than by the framers' compromises, it is an anti-slavery text. Don't explain the two positions to me; give me a teaching plan. I need the order in which the ideas have to come: what the students must grasp about the Garrisonian reading before the reversal can make sense, which interpretive distinction does the actual work, and what has to be in place before I go through individual clauses. Pick one constitutional clause to carry the whole session—explain what it must do to work as the example, and why not the three-fifths clause if you think it is the wrong choice. I also need a map of the misconceptions my classmates will bring or form, especially the suspicion that the shift was just political convenience and the assumption that the later reading requires saying the framers secretly meant to abolish slavery; tell me where in the sequence to head each one off. End with one question I can put to the room that would show whether they have understood the interpretive move itself rather than just memorized the two positions. Tell me what I should explicitly set aside as beyond this session.
