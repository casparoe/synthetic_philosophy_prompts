      *   *Actually, the best clause for Douglass's specific argument about "no mention of slavery" is often the **Fugitive Slave Clause** or the **Importation Clause**.* Let's go with the **Fugitive Slave Clause**. It forces the confrontation: Does the text recognize *property* in man? Douglass says no, it recognizes a contractual labor debt enforceable by state law, not a federal property right.
      *   *Alternative:* **Article I, Section 9 (Migration or Importation).** Douglass argues this treats slaves as persons (migration) not property (importation).
      *   *Decision:* The **Fugitive Slave Clause** is the most dramatic. However, for a 25-minute session, the **Preamble + "We the People"** combined with the **absence of the word "Slave"** is often the broader stroke. But the prompt asks for *one clause*. Let's stick with the **Fugitive Slave Clause (Art. IV, Sec. 2)**. It's the hardest hill to climb, so if students get it here, they get the method.
      *   *Wait, looking at Douglass's "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860).* He spends a lot of time on the fact that the words "slave" or "slavery" do not appear. He focuses on the **Fugitive Slave Clause** to argue it doesn't establish slavery, it assumes it exists under state law.
      *   *Refinement:* Actually, the **Three-Fifths Clause** is often the *first* thing students ask about. If I don't use it, I must explain why. I will choose the **Fugitive Slave Clause** because it demonstrates the "Text vs. Intent" distinction more sharply regarding *federal power*.
      *   *Wait, let's look at the "Interpretive Distinction."* The core is **Original Intent (Framers' Compromises) vs. Textual Meaning (What the words say).**
