      *   *Option B: Fugitive Slave Clause.* Strong candidate. Deals directly with the return of enslaved people.
      *   *Option C: Article I, Section 9 (Slave Trade).* Good, but deals with importation, not the status of existing slavery.
      *   *Option D: The Preamble/General Welfare.* Too vague for a 25-minute close reading.
      *   *Selection:* **The Fugitive Slave Clause (Article IV, Section 2, Clause 3).**
      *   *Why?* It's the most morally urgent. If the Constitution *is* anti-slavery, how can it mandate returning freedom seekers? Douglass's argument here is nuanced: the text says "Person held to Service or Labour," not "Slave." It relies on state law, not federal creation of property. This highlights the "Text vs. Intent" distinction perfectly.
