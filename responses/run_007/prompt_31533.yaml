answer: |-
  **Project Title:** Wild Animal Welfare and the Ethics of Habitat Degradation: A Conceptual Analysis

  **Statement of the Question**
  When human activity destroys or degrades a habitat, does the resulting effect on wild animal welfare render that activity morally permissible, or even obligatory? Specifically, what exactly does a claim about the "net welfare" of an ecosystem assert, and under what precise conditions would habitat destruction count as reducing wild animal suffering? This project seeks to resolve the conceptual deadlock regarding whether a dense, high-suffering population is morally preferable to a sparse, low-suffering one.

  **Background and Significance**
  Current debates regarding wild animal welfare are stalled between two intuitive but incompatible positions. Conservation-oriented views often assume that sustaining high-population, high-productivity habitats is intrinsically good. Conversely, welfare-oriented views argue that because wild lives frequently involve predation, disease, and starvation, high-productivity habitats may generate net negative welfare. Consequently, habitat destruction could theoretically reduce total suffering by preventing these lives from occurring.

  This dispute cannot be settled by ecological data alone. Ecology can determine population densities and mortality rates, but it cannot determine how to compare two counterfactual populations: one that exists (dense, high-suffering) and one that does not (sparse, low-suffering). The debate turns on unresolved problems in population ethics: specifically, whether a state of affairs can be better without being better for any particular individual, and whether death should be aggregated as a loss of a potential life or the termination of an actual one. Without a coherent philosophical framework, policy decisions regarding land use and conservation rest on unexamined axiological assumptions.

  **Methodology and Work Plan**
  This project requires a philosophical rather than ecological approach because the barrier to progress is not a lack of data, but a lack of a coherent metric for valuation. Ecological models presuppose a value framework (e.g., that biodiversity or biomass is good); this project interrogates that framework.

  *   **Months 1–2: Conceptual Mapping.** I will analyze existing literature on population ethics and the non-identity problem to isolate the specific axiological commitments required to claim an ecosystem has "net welfare." I will categorize existing arguments into totalist, average, and critical-level theories to determine which, if any, apply to non-human populations.
  *   **Months 3–4: Argument Construction.** I will construct a decision procedure for evaluating habitat loss. This involves defining the conditions under which preventing a life counts as a benefit versus a harm. I will test this procedure against edge cases, such as invasive species removal and rewilding projects.
  *   **Months 5–6: Drafting and Refinement.** I will draft the final manuscript, focusing on clarity and rigor. The goal is a journal-ready article that defines the necessary and sufficient conditions for habitat destruction to be welfare-positive.

  **Scope and Feasibility**
  A six-month, one-course release fellowship provides the necessary time to engage deeply with population ethics without the distraction of a full teaching load. The scope is limited to the *conceptual* conditions of the evaluation, not a empirical calculation of specific ecosystems. I will not attempt to calculate the net welfare of a specific forest; rather, I will establish the formula by which such a calculation would be judged valid.

  **Conditions for Project Failure**
  This project will be deemed unsuccessful if it fails to distinguish between claims that are "better simpliciter" and claims that are "better for someone." If the analysis concludes that the concept of "net ecosystem welfare" is logically incoherent or linguistically meaningless without a specific subject of harm, the project must explicitly argue for this eliminativist conclusion. Failure would consist only in leaving the relationship between habitat loss and welfare as ambiguous as it currently stands, without either providing a decision procedure or demonstrating the impossibility of one.
