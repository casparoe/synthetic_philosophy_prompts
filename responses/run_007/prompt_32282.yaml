      *   To ensure the "Race" feeling, the "Binding" action needs to be irreversible and visible.
      *   Let's use a "Sealed Envelope" method for the Binding Demand.
      *   Actually, simpler: "The Red Card."
      *   Each pair has a negotiation sheet.
      *   They can write an agreement.
      *   OR, either player can slide a Red Card to the instructor.
