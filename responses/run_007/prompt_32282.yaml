answer: |-
  # Activity Design: The Red Seal Protocol

  ## (a) Setup and Materials

  **Room Configuration:**
  *   Arrange desks in 9 pairs (for 18 students). Partners sit facing each other.
  *   Instructor station at the front with a visible countdown timer and a "Submission Box."

  **Materials per Pair:**
  *   **Negotiation Log:** A single sheet of paper to record agreements.
  *   **Demand Slips:** 10 small slips of paper per student.
  *   **Red Seals:** 2 red stickers (or red markers) per student.
  *   **Envelopes:** 2 large manila envelopes per pair (labeled "Pair #").

  **Materials for Instructor:**
  *   **Payoff Table:** Projected on screen (only after the game).
  *   **Timer:** Visible to all.
  *   **Status Board:** To track pair status (Negotiating, Committed, Resolved).

  **Incentive Structure:**
  *   Students earn "Policy Points" (PP) convertible to a portion of their participation grade.
  *   Individual accumulation matters (not pair total). This prevents pure collusion.

  ## (b) Rules and Roles

  **Scenario:**
  Each pair represents two states negotiating the division of a resource (the "Pot"). The Pot starts at 100 Points.

  **Phase 1: Flexible Negotiation**
  *   Students discuss how to split the Pot.
  *   They may submit an **Agreement Slip** to the instructor at any time. If both signatures match, the points are awarded, and the pair is done.
  *   If no agreement is reached by the end of the round, the Pot dissolves (0 Points each).

  **Phase 2: The Commitment Mechanism (The Red Seal)**
  *   At any point, a student may choose to **Commit**.
  *   To Commit, a student writes a demand (e.g., "I require 70 Points") on a Demand Slip, places a **Red Seal** on it, and hands it privately to the instructor.
  *   **Irreversibility:** Once a Red Seal is submitted, that student *cannot* accept less than their demand. They are mechanically barred from signing an Agreement Slip that gives them less.
  *   **Visibility:** Upon receiving a Red Seal, the instructor immediately notifies the *opponent* verbally: "Player A has Committed." The opponent does *not* see the specific number yet, only that a Commitment exists.
  *   **Response:** The opponent now has 60 seconds to either:
      1.  **Yield:** Accept the Committer's demand (instructor reveals the number; if compatible with remaining Pot, deal struck).
      2.  **Counter-Commit:** Submit their own Red Seal with a demand.

  **The Crash Condition:**
  *   If both players submit Red Seals with incompatible demands (e.g., A demands 60, B demands 60; Total > Pot), the Pot is destroyed. Both receive 0 Points.
  *   **Simultaneity Rule:** If two Red Seals from the same pair arrive at the instructor's desk within 10 seconds of each other, they are deemed "Simultaneous." The instructor does not reveal them to each other. They are opened together. If incompatible -> Crash (0 Points). This creates the **Race** dynamic.

  **Pot Decay:**
  *   The Pot starts at 100 Points.
  *   Every 3 minutes, the Pot shrinks by 10 Points (100 -> 90 -> 80...).
  *   This creates pressure to resolve the game quickly, incentivizing early Commitment to lock in a share of a larger Pot.

  ## (c) Payoff Structure

  | Outcome | Player A Points | Player B Points | Strategic Logic |
  | :--- | :--- | :--- | :--- |
  | **Mutual Flexibility** (Agreement reached) | 50 (avg) | 50 (avg) | Cooperative optimum. |
  | **A Commits, B Yields** | 70 (A's demand) | Remainder (e.g., 20) | Commitment Power. |
  | **B Commits, A Yields** | Remainder (e.g., 20) | 70 (B's demand) | Commitment Power. |
  | **Mutual Commitment** (Incompatible) | 0 | 0 | The Commitment Race Tragedy. |
  | **No Agreement** (Time out) | 0 | 0 | Failure to coordinate. |

  *Note: Demands must be integers. If A commits to 60 and B yields, B gets the remaining Pot value at that time.*

  ## (d) Timeline (120 Minutes)

  **1. Introduction & Rules (15 Minutes)**
  *   Distribute materials.
  *   Explain mechanics clearly. **Do not mention "commitment races," "Schelling," or "game theory."**
  *   Frame it as: "A simulation of high-stakes diplomatic bargaining with procedural constraints."
  *   Run a 1-minute practice round to ensure they understand the Red Seal submission process.

  **2. Round 1: Baseline Bargaining (15 Minutes)**
  *   **Rule:** Red Seals are **disabled**. Only Flexible Agreements allowed.
  *   **Goal:** Establish the cooperative baseline (50/50 split is common).
  *   **Outcome:** Most pairs should succeed. This creates a reference point for later frustration.

  **3. Round 2: Introduction of Commitment (30 Minutes)**
  *   **Rule:** Red Seals **enabled**. Pot decay active (10 pts every 5 mins).
  *   **Instruction:** "You may now use Red Seals to secure your position. Use them wisely."
  *   **Dynamic:** Students will feel the temptation to seal early to force the other to yield. Some crashes will occur.

  **4. Round 3: High-Stakes Race (30 Minutes)**
  *   **Rule:** Red Seals enabled. Pot decay **accelerated** (10 pts every 2 mins).
  *   **Instruction:** "Resources are depleting faster. Security is paramount."
  *   **Dynamic:** Pressure to commit early intensifies. Simultaneous submissions (Crashes) should peak here.

  **5. Debrief & Theoretical Mapping (30 Minutes)**
  *   See Section (e).

  ## (e) Debrief Guide

  **Step 1: Emotional Mapping (5 Minutes)**
  *   Ask: "In Round 3, at what moment did you feel anxiety?"
  *   Ask: "Who here submitted a Red Seal because they feared their partner would submit one first?"
  *   *Goal:* Surface the feeling of pre-emptive action driven by fear of the other's commitment.

  **Step 2: Structural Analysis (10 Minutes)**
  *   Draw the Payoff Matrix on the board based on their results.
  *   **Key Question:** "In Round 1 (No Seals), what was the optimal outcome?" (Mutual Agreement).
  *   **Key Question:** "In Round 3, why did Mutual Agreement become unstable?"
  *   **Explanation:** Introduce the term **Commitment Race**. Explain that the Red Seal represents *conspicuous irreversibility*.
  *   **Distinction from Prisoner's Dilemma:**
      *   In PD, Defect is dominant *regardless* of what the other does.
      *   In this game, Committing is only good if the other *does not* Commit. If you know they Committed, your best move is to Yield.
      *   The tragedy is not that everyone defects; it's that everyone tries to *force* the other to yield by removing their own ability to yield.

  **Step 3: The Logic of Power (10 Minutes)**
  *   Discuss Schelling's insight: "The power to constrain an adversary may depend on the power to bind oneself."
  *   Ask: "Why did the Red Seal give you power?" (Because it made your threat credible).
  *   Ask: "Why did that power become dangerous?" (Because both sides had access to it).

  **Step 4: Real-World Applications (5 Minutes)**
  *   Brainstorm examples where actors bind themselves to win, risking mutual loss:
      *   **Nuclear Brinkmanship:** Publicly declaring red lines.
      *   **Labor Strikes:** Union members voting to authorize a strike (binding leadership).
      *   **Constitutional Design:** Pre-commitment clauses (e.g., debt ceilings) that limit future flexibility.
      *   **Corporate Strategy:** Publicly announcing a price war to deter entry.

  ## (f) Predictable Problems & Solutions

  **1. Collusion ("Let's both ignore the Red Seals")**
  *   *Problem:* Students may agree verbally to never use Red Seals to guarantee 50/50 splits.
  *   *Solution:* Emphasize individual grading. Remind them verbally during Round 2: "Remember, points are individual. If you stay flexible and your partner commits, they win big." The temptation to betray the pact is necessary for the lesson.
  *   *Instructor Action:* If a pair is too cooperative, whisper to one student in Round 3: "Your partner is considering a Red Seal. Just a rumor." (Use sparingly).

  **2. Simultaneity Disputes**
  *   *Problem:* Students argue about whether submissions were within the 10-second window.
  *   *Solution:* Use a dedicated TA or assistant to timestamp submissions precisely. State clearly in rules: "Instructor's timestamp is final."

  **3. Confusion Over "Yielding"**
  *   *Problem:* Students don't understand how to yield after a Commitment.
  *   *Solution:* Simplify the yield mechanic. If Player A Commits, Player B simply signs a slip saying "I Accept Player A's Demand." No negotiation on the number remains.

  **4. Early Exhaustion**
  *   *Problem:* Pairs finish Round 2 quickly and get bored.
  *   *Solution:* Have a "Side Task" for finished pairs (e.g., write a 1-sentence justification for their strategy) to keep them engaged while others finish.

  ## (g) Limitations of the Simulation

  **1. Perfect Information of Rules**
  *   *Limitation:* In the game, everyone knows exactly how the Red Seal works and what the payoffs are.
  *   *Real World:* Actors often misperceive the other side's resolve or payoff structure.
  *   *Instructor Note:* In debrief, highlight that real commitment races are worse because actors often *don't know* if the other side has truly committed or is bluffing.

  **2. Lack of Audience Costs**
  *   *Limitation:* The game is private between pairs.
  *   *Real World:* Commitments are often public (speeches, treaties). Backing down incurs reputational damage (audience costs) which reinforces the commitment.
  *   *Instructor Note:* Explain that adding "publicity" to the Red Seal would make yielding even harder, increasing the risk of crash.

  **3. Rationality Assumption**
  *   *Limitation:* The game assumes students want to maximize points.
  *   *Real World:* Leaders may value "honor" or "ideology" over material payoff, making them willing to crash even if they know the other has committed.
  *   *Instructor Note:* Mention that "irrationality" can actually be a strategic asset in commitment races (the "Madman Theory"), which this game does not fully capture.

  **4. No Communication Channels for De-escalation**
  *   *Limitation:* Once a Red Seal is down, the rules are rigid.
  *   *Real World:* Backchannels often exist to quietly undo public commitments.
  *   *Instructor Note:* Discuss how institutional design (like hotlines) aims to create escape hatches from commitment races.
