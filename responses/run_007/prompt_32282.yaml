          *   A Flexible, B Commits Hard: 2, 10 (B wins)
          *   Both Commit Hard: 0, 0 (Conflict)
          *   (Note: Committing Soft is possible but dominated by Flexible usually, unless Soft vs Hard yields something different. Let's simplify: Commit = Hard Demand. Flexible = Willing to Compromise.)
      *   *Wait, if Commit = Hard, then Both Commit = Conflict.*
      *   *The Race:* I want to Commit before you do. If I Commit first, you see it and choose Flexible (getting 2 is better than 0). If you Commit first, I get 2. If we Commit simultaneously, we get 0.
      *   *This captures the logic.*

  3.  **Refining the Design to Avoid PD/Collaboration:**
      *   In PD, Cooperate/Cooperate is optimal socially but Defect is dominant individually.
      *   Here, Flexible/Flexible is optimal socially (5+5=10) and individually (5 each).
      *   However, Committing is *conditionally* dominant. If I think you will stay Flexible, I want to Commit (10 > 5). If I think you will Commit, I want to stay Flexible (2 > 0).
      *   This is Chicken, not PD. The *Commitment Race* is the dynamic within Chicken where players try to force the outcome by restricting their own freedom.
      *   *Crucial Addition:* To make it feel like a *race*, there needs to be a risk that if you wait too long, you lose the ability to commit effectively, or the "Flexible" option degrades.
      *   *Better:* The "Notification Lag." If I commit, it takes time for you to know. If you commit while I'm committing, we crash.
      *   *Simplest Classroom Version:* Discrete rounds.
      *   Round 1: Submit "Open" or "Sealed".
      *   If both Open -> Round 2.
      *   If One Sealed, One Open -> Game Over (Sealer wins).
      *   If Both Sealed -> Game Over (Crash).
      *   *Problem:* This is just one-shot Chicken.
      *   *Need:* The ability to commit *during* negotiation.
      *   *Revised Plan:* 15-minute negotiation window. Players sit across from each other. They can talk. They have a "Commitment Card". If they play it, they must stick to their current demand. The instructor monitors.
      *   *Actually, written submission is better for control.*
      *   *Let's go with the "Escalating Risk" model.*
      *   Rounds 1, 2, 3.
      *   In each round, players submit a choice: "Yield" or "Hold".
      *   If both Hold, risk of Crash increases.
      *   *No, that's War of Attrition.*
      *   *Back to Schelling:* The power is in *losing control*.
      *   *Game:* "The Doomsday Machine."
      *   Each pair gets a shared pot of points (100).
      *   They must agree on a split (e.g., 50/50, 70/30, 90/10).
      *   They have 10 minutes to talk.
      *   *Twist:* Each player privately holds a "Veto Token". If they play it, the split *must* be in their favor (e.g., 80/20 minimum). If both play it, the pot is destroyed (0/0).
      *   *Race:* You want to play the token early to signal you won't accept less. But if you play it too early, they might play theirs. If you wait, they might play theirs first.
      *   *Refinement:* The token isn't just a veto, it's a *binding commitment*.
      *   *Let's finalize the mechanic:* "The Binding Offer."
      *   Players negotiate a split of 100 points.
      *   At any point, a player can submit a "Binding Offer" to the instructor. This offer says "I will accept nothing less than X."
      *   If the other player agrees to X or more, deal made.
      *   If the other player also submits a Binding Offer incompatible with the first, both get 0.
      *   If time runs out with no Binding Offers, default to 50/50.
      *   *Incentive:* If I bind at 70, you must accept 30 or we risk 0. But if you bind at 70 first, I must accept 30.
      *   *Race:* Who binds first?
      *   *Risk:* If we bind simultaneously (or before seeing the other's bind), we crash.
      *   *Implementation:* Students write demands on slips. They can mark them "Binding" or "Non-Binding".
      *   Instructor collects. If both Non-Binding -> Keep talking. If One Binding -> Reveal to other. Other must accept or Bind (risk crash).
      *   *Wait, if I reveal my Binding offer, you know.*
      *   *To make it a race:* There must be a cost to waiting.
      *   *Cost:* The total pot shrinks over time (decay). 100 -> 90 -> 80.
      *   *Now it's a race.* I want to bind early to force you to accept a shrinking pot share, rather than risk you binding first.
      *   *But if I bind too early, you might bind against me.*
      *   *Okay, this works.*

