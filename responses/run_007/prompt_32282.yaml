prompt: |-
  You are a political philosopher who also designs and runs negotiation simulations for diplomats and policy professionals. I teach a master's-level seminar called 'Strategic Interaction and Institutional Design' — about 18 students, mostly from political science, philosophy, and economics. We have a two-hour session, and I want to devote it entirely to an in-class game that makes students feel the logic of commitment races.

  The core idea I want them to experience, before anyone names it, is this: in certain strategic situations, the ability to bind yourself irreversibly to a course of action is a source of power, not weakness — and when multiple parties have this ability, the race to commit first can produce outcomes that are worse for everyone than if no one could commit at all. This is the dynamic that Schelling analysed, and it is distinct from a prisoner's dilemma, where defection is dominant regardless of what the other player does. The game should isolate the commitment-race dynamic so that it does not collapse into one of the more familiar strategic situations students already recognise.

  The activity should work as follows: students should feel the pressure to commit early, the temptation to escalate, and the moment where the structure of the situation becomes visible — all through the rules and incentives, not through a lecture. I will not introduce the term 'commitment race' until the debrief, and I will not explain the logic beforehand. After the game, we debrief: map what happened to the formal structure, clarify the distinction from a prisoner's dilemma, and discuss where real-world commitment races arise (arms races, brinkmanship, union negotiations, constitutional pre-commitments).

  Please design the full activity. Include: (a) setup and materials, (b) rules and roles, (c) a payoff structure that creates the right incentives without needing real money, (d) a timeline for the two-hour session showing how long each phase should take, (e) a debrief guide that connects specific moments in the game to the theoretical ideas, (f) what will predictably go wrong the first time I run it and how to handle it, and (g) an honest note on which features of real-world commitment races the game cannot reproduce and that I will need to supply in discussion myself.

  Before you write the final design, take some time to think through what the core strategic dynamic of a commitment race is and how to isolate it cleanly in a game, so that the activity does not end up demonstrating something else — a coordination problem, a public-goods problem, or a standard bargaining game.

  Begin with the activity itself, with no preface or commentary.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Political philosopher & negotiation simulation designer.
      *   **Target Audience:** Master's students (PolSci, Philosophy, Economics) in a seminar called 'Strategic Interaction and Institutional Design'.
      *   **Task:** Design a 2-hour in-class game/activity.
      *   **Core Concept:** Commitment Races (Schelling). Key insight: Binding oneself irreversibly is power; multiple parties doing this leads to worse outcomes than if no one could commit. Distinct from Prisoner's Dilemma (PD).
      *   **Requirements:**
          *   (a) Setup & Materials.
          *   (b) Rules & Roles.
          *   (c) Payoff Structure (no real money needed, but incentives must be clear).
          *   (d) Timeline (2 hours).
          *   (e) Debrief Guide (connect game to theory, distinguish from PD).
          *   (f) Predictable Problems & Solutions.
          *   (g) Limitations of the Simulation (what it misses).
      *   **Constraint:** Begin with the activity itself, no preface or commentary.
      *   **Critical Instruction:** Think through the core strategic dynamic first to ensure it isolates the commitment race and doesn't collapse into PD, coordination, or standard bargaining.

  2.  **Deconstruct the Commitment Race Dynamic:**
      *   *What is it?* It's a situation where players have an incentive to restrict their own future options to influence the other player's behavior. If both do this, they lock into a conflictual outcome.
      *   *Key Feature 1: Irreversibility.* Once you commit, you can't back down without high cost.
      *   *Key Feature 2: First-Mover Advantage (in commitment).* The person who commits first forces the other to accommodate.
      *   *Key Feature 3: Mutual Harm.* If both commit to incompatible positions, both lose compared to a scenario where they could remain flexible.
      *   *Distinction from PD:* In PD, defection is dominant *regardless* of the other's choice. In a commitment race, the optimal move depends on whether the other has already committed. If they haven't, you want to commit. If they have, you might want to yield (unless you've also committed). The tragedy is mutual commitment.
      *   *Distinction from Chicken:* Chicken is the underlying payoff structure often associated with commitment races. In Chicken, mutual defection (crash) is worst. Commitment races are the *process* by which players try to force the other into yielding in a Chicken-like scenario. The game needs to simulate the *act of committing* itself, not just the payoff matrix of Chicken.
      *   *Design Challenge:* How to make "committing" a distinct action from "choosing a strategy"?
      *   *Idea:* Players choose a demand (High vs. Low). But they can pay a cost to make that demand irreversible. If both make irreversible High demands, they crash. If one commits High and the other stays flexible, the flexible one yields. If both stay flexible, they negotiate a split.
      *   *Refinement:* To make it a *race*, there needs to be a temporal element or a mechanism where committing early locks the other out.
      *   *Mechanism:* A multi-round game where players can "lock in" a position. Once locked, they cannot change. The earlier you lock, the more "credibility" you have, or perhaps the lock-in itself is the only way to secure the high payoff if the other yields.
      *   *Better Mechanism:* The "Burn Bridges" mechanic. Players start with a flexible position. They can choose to "burn bridges" (commit) to a specific demand. If both burn bridges to incompatible demands, disaster. If one burns and the other doesn't, the burner wins. If neither burns, they get a moderate compromise.
      *   *Crucial Twist:* To make it a *race*, there must be an incentive to commit *before* the other person does. Why? Because if I commit first, you see my commitment and must yield. If you commit first, I must yield. If we commit simultaneously, we crash.
      *   *Simulation Design:* "The Brinkmanship Protocol."
      *   *Roles:* Two parties (e.g., Nation A and Nation B).
      *   *Actions:* In each round, players submit a move: "Flexible" or "Commit to High Demand".
      *   *Payoffs:*
          *   Both Flexible: Compromise (Medium, Medium).
          *   One Commits, One Flexible: Committer gets High, Flexible gets Low (but better than crash).
          *   Both Commit: Crash (Lowest, Lowest).
      *   *The Race Element:* How to ensure they feel the pressure to commit *early*?
      *   *Modification:* Allow commitment at any point, but once committed, you cannot change. The game ends when both have locked in or time runs out. If time runs out with both flexible, default to Compromise.
      *   *Problem:* If they can wait, they might wait until the end.
      *   *Solution:* Introduce a "Cost of Waiting" or a "Risk of Accident" that increases over time, OR make the commitment itself the only way to signal resolve credibly.
      *   *Schelling's Insight:* The power lies in the *loss of freedom*.
      *   *Revised Design:* "The Lock-Box Game."
      *   Players have a choice between Outcome X (Better for A) and Outcome Y (Better for B). Outcome Z (Compromise) is okay for both. Outcome W (Conflict) is terrible for both.
      *   To get Outcome X, Player A must commit to rejecting Y. To get Outcome Y, Player B must commit to rejecting X.
      *   If both commit to rejecting the other's preference, they get W.
      *   If neither commits, they get Z.
      *   *The Race:* Players submit decisions sequentially or in rounds. But to make it a race, the commitment must be visible.
      *   *Let's try a specific mechanism:* "The Escalation Ladder."
      *   Rounds 1-5. In each round, players choose "Stand Firm" or "Yield".
      *   Wait, that's just War of Attrition or Chicken.
      *   *Focus on the Commitment Act:* The game needs a specific action called "Bind".
      *   *Setup:* Pairs of students.
      *   *Scenario:* Territorial Dispute.
      *   *Options:* Demand All (Hard), Demand Half (Soft).
      *   *Mechanism:* Players have 3 "Commitment Tokens". Spending a token makes your current demand irreversible for the rest of the game.
      *   *Incentive:* If you are Irreversible Hard and opponent is Flexible, you win All. If both Irreversible Hard, War (0 points). If both Flexible, Split (5 points).
      *   *Race:* You want to commit before they do. If you see them commit, you must yield. So you want to commit *first* to force them to yield.
      *   *Refinement for Classroom:* Needs to be simple enough to explain quickly but deep enough for Masters students.
      *   *Structure:* 3 Phases.
          1.  Negotiation (Flexible).
          2.  Commitment Phase (Can lock in).
          3.  Resolution.
      *   *Actually, let's make it continuous time or discrete rounds where locking is an option.*
      *   *Best approach for 18 students:* 9 pairs.
      *   *Game Name:* "The Red Seal Protocol."
      *   *Core Mechanic:* Players write demands on paper. They can choose to seal them in an envelope (Commit) or leave them open (Flexible). Once sealed, cannot change. If both seal incompatible demands, disaster. If one seals and other open, sealer wins. If both open, compromise.
      *   *Adding the Race:* They can seal at any time during a 15-minute window. Once sealed, the other player is notified immediately (via instructor or slip of paper).
      *   *Wait, notification is key.* If I seal, you must know I sealed to feel the pressure.
      *   *Logistics:* Instructor acts as the channel.
      *   *Payoff:* Points towards participation grade or just prestige. Let's use points.
      *   *Payoff Matrix:*
          *   Both Flexible: 5, 5 (Compromise)
