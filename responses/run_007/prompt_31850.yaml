prompt: |-
  I've been reading about metaethics on my own, without any formal training, and I recently came across a passage in a popular book about human nature that summarizes the is–ought gap. The book puts the point roughly like this:

  "Hume proved that you cannot derive an ought from an is: no moral conclusion can ever be drawn from purely factual premises. Since science deals only in facts, it follows that science can have nothing to say about ethics. Anyone who tries to base a moral claim on human nature, evolution, or well-being is committing the naturalistic fallacy — the mistake of trying to define 'good' in natural terms, which G. E. Moore showed is always a mistake. So all attempts to ground ethics in science are not just unsupported; they are logically confused."

  Something about this feels overconfident to me, especially the leap from the point about deriving oughts to the conclusion that science has nothing to say about ethics, and I've seen the phrase "naturalistic fallacy" used in ways that don't seem to line up with this. But I can't tell which parts are right and which are overstatements, because the passage mixes several claims together.

  I'd like you to act as a professional philosopher working in metaethics and the history of ethics. Please think carefully about this. Before giving your final answer, brainstorm the distinct claims packed into the summary and how a careful defender of each side would treat them. Then go through the summary roughly sentence by sentence and tell me: which parts a careful philosopher would accept, which are common simplifications, which are subtly wrong, and whether the final conclusion about science and ethics actually follows from the accurate parts. I want an accuracy audit I can act on, not just a general impression.
