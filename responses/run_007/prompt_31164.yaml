answer: |-
  You have touched upon a nerve that I have felt trembling beneath my own fingers many times. It is a keen observation, and I thank you for it. To accuse a writer of contradicting himself is rarely an insult; often, it is merely to point out that he is alive, and that his thoughts have moved, or perhaps that they have collided.

  Let us consider the nature of the medium in which we work. I am a man of letters, not a metaphysician, though I have always been tempted by the seductions of philosophy. When I sit at this desk in Buenos Aires, surrounded by the encyclopedias and the dusk, I am bound by the laws of syntax. Language itself is sequential. One word must follow another; one sentence must succeed the previous one. To write is to submit to time. Even if I wish to deny the reality of the clock, the ink dries in a sequence, and the eye of the reader travels across the page in a succession of moments. If I were to write a story in which nothing succeeds anything, I would be forced into silence. And silence, while perhaps more honest, is not literature.

  So, there is the first concession: I write within the illusion because I inhabit the illusion. As Berkeley suggested, the world exists only insofar as it is perceived. I perceive a succession of states. Whether that succession is grounded in an external reality called "Time" or is merely a habit of my own consciousness is, for the purposes of living—and writing—irrelevant. I am trapped in the succession.

  But you ask why, if I hold time to be a delusion, I do not simply ignore it, but rather embellish it? Why branch it, freeze it, loop it?

  I believe it is precisely because time is a delusion that it becomes so fertile a subject for fiction. If time were a rigid, absolute container, as Newton imagined, there would be less room for wonder. It would be a prison with iron walls. But if time is mental, if it is a construct of the mind, then it is malleable. It is clay. In "The Secret Miracle," Jaromir Hladík is granted a year of subjective time within the objective instant of his execution. Is this possible? Physically, no. But psychologically, yes. We have all known moments that stretch into eternities and years that collapse into a single afternoon. My stories are not attempts to describe the universe as it is measured by astronomers, but the universe as it is felt by the dreamer.

  In "A New Refutation of Time," I argued that the discrete moments of our experience do not necessarily connect. The present does not require the past to exist. But in my fictions, I explore what happens if we take the connectivity of those moments and twist it. If time is a labyrinth, as I suggest in "The Garden of Forking Paths," then every possible path must exist somewhere, for if it did not, the labyrinth would be incomplete. And God, or the universe, dislikes incompleteness almost as much as I do.

  You suggest this might be a contradiction. I am inclined to agree. But I have always found contradictions to be more interesting than truths. A truth is a dead end; a contradiction is a doorway. If I assert in an essay that time does not exist, and then in a story I show a man living a year in a second, am I contradicting myself? Or am I showing two different maps of the same territory? The essay is a map drawn by the intellect, which seeks to simplify. The story is a map drawn by the imagination, which seeks to complicate.

  Perhaps the truth lies in the tension between them. I am like a man who knows that the mirror in his hallway shows only a reflection, no depth, no reality beyond the silvered glass—and yet, every time he passes it, he cannot help but glance into it, half-expecting to see something move behind the surface. I know time is a construct. But I am haunted by it. My stories are the record of that haunting.

  Furthermore, we must consider the humility of the author. I do not believe I create these stories so much as I discover them. They seem to arrive fully formed, as if dictated by some other voice. If that voice chooses to speak in terms of branching futures or circular ruins, who am I to censor it? I am merely the scribe. If the scribe believes time is an illusion, but the dictation speaks of time, the scribe must write what he hears. To do otherwise would be a greater falsification.

  So, I do not see it as a limitation of narrative, but rather as the very condition of it. We are temporal beings dreaming of eternity. We cannot step outside the stream to observe it without getting wet. My essays attempt to dry off; my stories embrace the water.

  Does this satisfy you? Or do you find this duality merely a convenient evasion? I confess, I am often unsure myself. I write to clarify my confusion, and usually, I end up only complicating it. But there is a certain pleasure in that complication, is there not? Like walking through a garden where the paths fork endlessly, knowing that no matter which way you turn, you are still walking in a dream.
