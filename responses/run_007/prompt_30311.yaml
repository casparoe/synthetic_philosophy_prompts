      *   Actually, a more nuanced one: **The Principle of Proportionate Stewardship.**
      *   Let's stick to something clearer for a magazine audience. **"The Harm-Complicity Threshold."**
      *   *Decision:* I will formulate it as **"The Principle of Non-Complicity in Substantial Harm,"** grounded in three distinctions: *Capacity, Reversibility, and Vulnerability.*

  10. **Final Review of the Logic:**
