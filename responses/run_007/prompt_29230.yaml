answer: |-
  The position is internally consistent within narrow rescue dyads but faces fatal exposure when scaled to threshold cases or precise probabilistic implementation, where it either mandates intuitively monstrous outcomes or collapses into the aggregationist weighting it explicitly rejects.

  **1. Threshold Cases (1 vs. Thousands or Millions)**
  *   **The Defeater:** If the number of people never counts "by itself," the view implies you should flip a coin between saving one person and saving five million. The compelling observation required to defeat the view here is the near-universal intuition that at some magnitude, numbers *must* count, such that saving the one becomes morally monstrous rather than merely permissible.
  *   **Defender's Response:** A committed defender typically bites the bullet, dismissing the intuition as a psychological bias toward large numbers rather than a moral truth, or argues that no threshold is non-arbitrary. They would concede the outcome but deny it is unacceptable.
  *   **Settled vs. Contested:** It is **contested** whether the intuition constitutes valid moral data; however, it is **settled** that no non-arbitrary threshold principle has been successfully formulated that satisfies both the anti-aggregationist's constraints and the aggregationist's intuitions. If you concede a threshold, you must explain why 5,000 counts but 5 does not, which risks collapsing into the view you oppose.

  **2. Precision of "Equal Chance" (The Collapse Problem)**
  *   **The Defeater:** To implement "equal chance" precisely, you must choose between giving each *group* a 50% chance or each *person* a 1/6 chance. If you choose the latter (each person 1/6), you must save the five with 5/6 probability, which effectively aggregates numbers and undermines the core premise that losses don't add up. If you choose the former (each group 50%), you treat the five as a collective unit, violating the methodological individualism that motivates the view.
  *   **Defender's Response:** A defender would likely insist on the group flip (50/50) to maintain the strict non-aggregation stance, dismissing the person-centric probability calculation as importing aggregationist assumptions about what fairness requires. They would argue fairness is about respecting the claim of each *side* in a conflict, not maximizing individual ex-ante odds.
  *   **Settled vs. Contested:** It is **settled** mathematically that equal ex-ante chance per person requires weighting by numbers; it is **contested** whether moral fairness requires equal chance per person or equal chance per conflicting party. This is a fatal internal tension if the view claims to be grounded in individual claims yet treats groups as units.

  **3. Non-Rescue Trade-offs (Scope and Consistency)**
  *   **The Defeater:** If the anti-aggregation principle applies outside rescue cases—for example, allocating a scarce drug where one person needs it to live and a million need it to avoid minor blindness—the view mandates ignoring the million. The compelling observation is that in public policy and welfare economics, aggregating small benefits is standard and often required for justice; refusing to do so makes the view incompatible with broadly accepted frameworks of resource allocation.
  *   **Defender's Response:** A defender might restrict the view to "life-and-death" cases or "loss of what is one's own," arguing that small benefits do not generate the same kind of claim as survival. However, this looks ad hoc unless they can explain why aggregation is permissible for blindness but not for life.
  *   **Settled vs. Contested:** It is **settled** that standard welfare economics requires aggregation of small benefits; it is **contested** whether moral theory should override economic rationality in these cases. If the view cannot explain the boundary between rescue and allocation without appealing to numbers, it loses its theoretical unity.

  **4. The "Failure to Respond" Intuition**
  *   **The Defeater:** The view struggles to explain why a rescuer who saves the one is often judged to have *failed* morally, not just chosen differently. The compelling argument is that moral obligations often involve responding to the strength of claims, and if five claims outweigh one, ignoring them is a failure of responsiveness, not just a different permissible path.
  *   **Defender's Response:** A defender would dismiss this as a confusion between "optimizing" and "obligating," arguing that moral residue or blame is misplaced when no one's rights are violated. They would concede the social pressure but deny the moral truth of the judgment.
  *   **Settled vs. Contested:** It is **contested** whether moral blame requires a violation of obligation or can attach to sub-optimal permissible choices. This is merely awkward for the view unless paired with the threshold argument, as it relies on phenomenological reports rather than logical inconsistency.
