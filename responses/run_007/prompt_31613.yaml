  Based on Maya's track record, here is the breakdown of her likely verdict, the rule she is actually using, and how to test it.

  ### 1. The Verdict on the Ulcer Case
  Maya will almost certainly classify the *H. pylori* discovery as a **Paradigm Shift**.

  **Why?**
  Look at her "Paradigm Shift" list: Copernicus (Earth moves), Lavoisier (Combustion reverses), Relativity (Time bends). In each case, a **core ontological commitment** of the field was overturned.
  *   **Copernicus:** Overturned "Earth is the stationary center."
  *   **Lavoisier:** Overturned "Combustion releases a substance (phlogiston)."
  *   **Relativity:** Overturned "Time and space are absolute."

  Now look at the Ulcer case. The core commitment of gastroenterology for decades was that the stomach environment was too acidic to sustain life (**"The Stomach is Sterile"**) and that ulcers were physiological responses to **stress/acid**. Marshall and Warren didn't just find a new variable; they overturned the sterile stomach dogma and reclassified the disease from a lifestyle condition to an infectious one. This mirrors the Lavoisier case (changing the fundamental cause of a phenomenon) much more than the Neptune case (finding a missing object within the existing laws).

  ### 2. The Rule She Is Running
  Maya is not primarily tracking **Incommensurability** (change in meaning); she is tracking **Abandonment of Core Commitments** (Crisis/Anomalies).

  **The Evidence:**
  The key to decoding Maya is the **Modern Synthesis**.
  *   **Incommensurability Argument:** The Modern Synthesis *did* change the meaning of terms. "Gene" went from a vague unit of heredity to a population statistic, and "Species" became defined by reproductive isolation. If Maya were strictly tracking whether terms changed meaning, she might have called this a Paradigm Shift.
  *   **Core Commitment Argument:** However, she called it **Normal Science**. Why? Because the *core commitment* of Darwinism—**Natural Selection**—was not abandoned; it was saved. The anomaly (how inheritance works) was solved by adding Mendel, not by throwing out Darwin.

  This distinguishes her rule from pure Incommensurability. She classifies an episode as **Normal Science** if the central theory survives and is merely extended or articulated (Neptune, Modern Synthesis). She classifies it as a **Paradigm Shift** if the central theory is discarded or fundamentally inverted (Copernicus, Lavoisier, Relativity, Ulcers).

  ### 3. A Better Test Case
  To confirm this, you need an episode where **Meaning Changes** (Incommensurability) but **Core Commitments Stay** (No Crisis).

