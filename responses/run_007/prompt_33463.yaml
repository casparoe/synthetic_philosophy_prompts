answer: |-
  Here are the desiderata for a theory of standing to blame, structured for seminar use.

  ### I. The Desiderata List

  **A. Conceptual Distinctions (The "Logic" Constraints)**
  1.  **The Truth/Standing Gap:** The theory must explain how a blame act can be *accurate* (the blamee did wrong) and *deserved* (the blamee is responsible), yet still be *improper* due to the blamer's position.
      *   *Force:* Ordinary practice. We say, "You're right that he lied, but you can't say it."
  2.  **The Utility/Standing Gap:** The theory must distinguish standing from prudence. Telling a hypocrite to shut up isn't just because it's counterproductive; it's because they lack the *right*.
      *   *Force:* We rebuke blamers even when their blame would be effective (e.g., a hypocritical parent stopping a child from smoking).
  3.  **The Exoneration Constraint:** Denying a blamer standing must not exonerate the blamee. The wrong remains a wrong.
      *   *Force:* "Who are you to talk?" is not a defense against the accusation, only against the accuser.

  **B. Case-Based Intuitions (The "Extension" Constraints)**
  4.  **The Unrepentant Hypocrite:** An agent currently engaging in the same wrong (or relevantly similar) lacks standing to blame another for it.
      *   *Force:* The paradigmatic case. (e.g., The cheating spouse blaming the partner).
  5.  **The Reformed/Time-Distanced Wrongdoer:** An agent who committed the same wrong long ago, but has repented/reformed, *retains* (or regains) standing.
      *   *Force:* We accept advice/blame from recovering addicts or reformed criminals. A theory that makes standing permanent-loss fails here.
  6.  **The Meddling Stranger:** A total stranger with no relational stake often lacks standing to blame for "private" or "internal" wrongs, but may have standing for "public" or "severe" wrongs.
      *   *Force:* Distinguishes between "That's none of your business" and "That's a crime against humanity."
  7.  **The Complicit Participant:** An agent complicit in a *systemic* version of the wrong (but not the specific token act) has diminished or contested standing.
      *   *Force:* The climate activist who flies private jets; the corporate employee blaming a peer for minor theft.
  8.  **The Victim's Friend:** A friend of the victim often has *more* standing than a stranger, even if the friend wasn't directly wronged.
      *   *Force:* Second-party blame seems stronger than third-party blame.

  **C. Phenomenological Data (The "Experience" Constraints)**
  9.  **The "Who Are You?" Reaction:** The theory must capture the specific reactive attitude involved in denying standing. It is not anger at the *act*, but rejection of the *authority*.
  10. **The Non-Cancellation of Content:** When standing is denied, the *content* of the blame (the moral claim) usually remains in force, even if the *speech act* is voided.

  ---

  ### II. Classification: Non-Negotiable vs. Camp-Specific

  | Desideratum | Status | Notes |
  | :--- | :--- | :--- |
  | **1. Truth/Standing Gap** | **Non-Negotiable** | If you collapse these, you aren't theorizing standing; you're theorizing correctness. |
  | **2. Utility/Standing Gap** | **Non-Negotiable** | Standing is deontic, not consequentialist. |
  | **3. Exoneration Constraint** | **Non-Negotiable** | Standing is about the *blamer*, not the *blamee*. |
  | **4. Unrepentant Hypocrite** | **Non-Negotiable** | Any theory that grants standing here is revisionist. |
  | **5. Reformed Wrongdoer** | **Contested** | *Hardliners* (some Kantians) say past guilt taints forever; *Moderates* say reform restores standing. Most theories aim for Moderate. |
  | **6. Meddling Stranger** | **Contested** | *Relationship View* says strangers lack standing; *Moral Community View* says humanity grants standing. |
  | **7. Complicit Participant** | **Contested** | Depends on how tightly the theory links standing to *clean hands* vs. *relational authority*. |
  | **8. Victim's Friend** | **Contested** | Requires a theory that allows standing to transfer or amplify via relationship. |
  | **9 & 10. Phenomenology** | **Non-Negotiable** | A theory that ignores how standing feels in practice is purely abstract. |

  ---

  ### III. The Consistency Check: Is "Standing" a Unified Category?

  **Verdict: There is strong evidence that the requirements are jointly unsatisfiable under a single normative ground.**

  The tension lies between **Desideratum 4 (Hypocrite)** and **Desideratum 6 (Stranger)**.

  *   **If standing is grounded in Moral Consistency (Fairness):** You easily explain why the Hypocrite lacks standing (they violate fairness). But you struggle to explain why the Stranger lacks standing (the Stranger is consistent, just uninvolved). Why does consistency grant authority to a stranger?
  *   **If standing is grounded in Relationships (Authority):** You easily explain why the Stranger lacks standing (no relationship) and why the Friend has it. But you struggle to explain the Hypocrite. If I have a relationship with you, why does my own bad behavior sever my authority to hold *you* to our shared norms? (Unless the relationship *is* defined by mutual compliance, which circles back to consistency).

  **The Fragmentation Hypothesis:**
  It is likely that "standing" is a placeholder for two distinct norms that ordinary language conflates:
  1.  **A Norm of Fairness:** (Addresses the Hypocrite). "You can't hold me to a standard you flout."
  2.  **A Norm of Jurisdiction:** (Addresses the Stranger). "This is not your sphere of authority."

  A unified theory usually succeeds by reducing one to the other, but only by violating a Contested Desideratum (e.g., claiming strangers *do* have standing, or that reformed hypocrites *don't*).

  ---

  ### IV. Brief Scorecard: Main Moves Against the List

  **1. The Hypocrisy-Based View (e.g., Wallace, Duff)**
  *   *Ground:* Moral consistency/fairness.
  *   *Wins:* Unrepentant Hypocrite (D4), Truth/Standing Gap (D1).
  *   *Loses:* Meddling Stranger (D6). If standing is just about clean hands, a consistent stranger should have standing. They often have to add ad-hoc clauses about "moral community" to block strangers.
  *   *Status:* Strong on D4, weak on D6.

  **2. The Relationship-Based View (e.g., Bell, Macalester)**
  *   *Ground:* Normative authority generated by specific relationships.
  *   *Wins:* Meddling Stranger (D6), Victim's Friend (D8). Explains "none of your business."
  *   *Loses:* Unrepentant Hypocrite (D4). Why does my infidelity sever my authority to blame *your* infidelity if we are still friends? They must argue hypocrisy damages the relationship itself, which risks collapsing standing into relationship-health.
  *   *Status:* Strong on D6, works hard for D4.

  **3. The Eliminativist View (e.g., Friedland, some Consequentialists)**
  *   *Ground:* There is no distinct normative category; only fittingness and reasons.
  *   *Wins:* Consistency. Dissolves the "Joint Unsatisfiability" by denying the unity of standing.
  *   *Loses:* Phenomenology (D9, D10). Cannot explain the specific "Who are you?" rebuke without treating it as just a pragmatic warning or a claim about desert. Violates the Non-Negotiable Truth/Standing Gap (D1) by definition.
  *   *Status:* Theoretically clean, phenomenologically costly.

  **Recommendation for your seminar:** Push the **Fragmentation Hypothesis**. Ask whether the seminar is trying to solve for *Fairness* (Hypocrisy) or *Jurisdiction* (Relationships). If they claim to do both, press them on the Stranger vs. Hypocrite tension. That is the fracture point.
