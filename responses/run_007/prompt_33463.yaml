  2.  **Deconstruct "Standing to Blame":**
      *   What is it? It's the *authority* or *position* to hold someone accountable, distinct from the *correctness* of the accusation.
      *   Key intuition: "Who are *you* to talk?" vs. "You're wrong about what happened."
      *   Key distinction: Standing is a *procedural* or *relational* norm, not a *substantive* moral norm about the act itself.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *D1: The Hypocrite Case.* Unrepentant hypocrites lack standing. (Classic Wallace/Duff intuition).
      *   *D2: The Reformed/Time-Distanced Case.* Does past wrongdoing always kill standing? No. There must be a distinction between *current* hypocrisy and *past* failure.
      *   *D3: The Third Party/Stranger Case.* Do you need a relationship? Some say yes, some say no. A theory must explain why a total stranger might lack standing (meddling) or have it (humanity).
      *   *D4: The Distinction Constraint.* Standing $\neq$ Truth. Standing $\neq$ Prudence.
      *   *D5: The Practice Data.* When we deny standing, we don't usually deny the wrongness of the act. The blame is "fitting" but "out of place."
      *   *D6: The Complicity Case.* If I'm involved in a systemic wrong, do I lose standing to blame a specific actor? (Nuance needed).

  4.  **Classifying Requirements (Non-Negotiable vs. Camp-Specific):**
      *   *Non-Negotiable:* D1 (Hypocrite intuition is central), D4 (Conceptual distinction), D5 (Phenomenology of blame).
      *   *Camp-Specific:* D2 (How much time/reform is enough?), D3 (Relationship requirement - Bell vs. Wallace), D6 (Scope of complicity).

  5.  **Addressing the "Joint Unsatisfiability" (The Deep Cut):**
      *   This is the core philosophical insight requested.
      *   *Tension:* If standing is about *moral authority*, why does a hypocrite (who identifies the truth) lack it? If it's about *relationships*, why do strangers sometimes have standing? If it's about *effectiveness*, why does sincere blame from a hypocrite fail?
      *   *The "Fragmentation" Hypothesis:* It is highly likely that "standing" is a placeholder for at least two distinct norms: (1) A norm of *consistency/fairness* (hypocrisy) and (2) A norm of *relational authority* (who counts).
      *   *Verdict:* Yes, there is a tension between the "Moral Truth" constraint and the "Relational Authority" constraint. A unified theory often forces one to swallow counter-intuitive bullets.

  6.  **Evaluating the Main Moves (Brief Scorecard):**
      *   *Hypocrisy-Based (Wallace, Duff):* Great on hypocrites, struggles with strangers/non-hypocritic meddlers.
      *   *Relationship-Based (Bell, Macalester):* Great on friends/strangers distinction, struggles to explain why *moral* hypocrisy specifically matters (vs. just lack of closeness).
      *   *Eliminativist (Friedland, perhaps):* Says it's all just about reasons/fittingness. Solves the unity problem by dissolving it, but ignores the phenomenology of "Who are you?"

  7.  **Refining and Polishing:**
