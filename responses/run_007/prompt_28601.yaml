      *   *Best:* **Correlation as a Resource.** It's not the *bits* themselves, it's the *correlation* between the demon and the gas. The cost is restoring the independence (decorrelation).
      *   *Refinement:* Let's go with the **"Non-Equilibrium Resource"** analogy. Information isn't fuel; it's a deviation from equilibrium.

