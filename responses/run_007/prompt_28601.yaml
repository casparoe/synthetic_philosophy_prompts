      *   **User Persona:** Retired experimental physicist. This means they have a strong grasp of thermodynamics, statistical mechanics, and likely the mathematical formalism. They are not looking for a pop-sci explanation but a rigorous philosophical and physical audit. They are skeptical of the "information is physical" slogan as a mere hand-waving resolution.
      *   **Topic:** Maxwell's Demon, Landauer's Principle, Bennett's resolution, Thermodynamics of Computation.
      *   **Core Task:** Audit the "Information as Fuel" analogy.
