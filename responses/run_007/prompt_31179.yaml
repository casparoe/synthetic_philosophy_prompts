          *   "Blind" Watchmaker -> Optimization Algorithm (gradient descent, market forces, bureaucracy).
          *   Evolutionary Quirks (peacock tails) -> Goodharting (teaching to the test, reward hacking).

  3.  **Identify Breakdowns/Disanalogies:**
      *   *Intent/Teleology:* Evolution is blind; optimization often has a designer with intent (the human setting the metric). Evolution doesn't "care" about anything; optimizers are built to care about the metric.
      *   *Timescale/Feedback:* Evolution is slow, generational, retrospective. Optimization (especially AI) can be fast, prospective, and simulatable.
      *   *Constraint Structure:* Evolution is constrained by physics and historical path dependence (local optima). Optimization algorithms might have more freedom to search global optima or exploit loopholes humans didn't anticipate (especially in digital spaces).
      *   *The "True" Objective:* In evolution, fitness *is* the objective (survival/reproduction). In metric optimization, there is a distinction between the *proxy* (metric) and the *true* goal (what we actually want). In evolution, there isn't really a "true goal" beyond reproduction itself. The analogy conflates "fitness" (which is real in evolution) with "proxy metric" (which is imperfect by definition in the human context).
      *   *Agency:* Evolving organisms don't choose to game the system; they just exist. Optimizing agents (especially AI or humans) might actively model the metric and exploit it strategically.
      *   *Stationarity:* Evolutionary landscapes change (Red Queen hypothesis). Metric landscapes are often static until changed by regulators.

  4.  **Evaluate the Strong Conclusion (Structural Inevitability):**
      *   Does the breakdown undermine the claim that specification gaming is inevitable?
