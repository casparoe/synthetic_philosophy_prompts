          *   Another key disanalogy: Reflexivity. We can change the metric. Evolution can't change the definition of survival easily.
          *   Does the conclusion survive? The claim is that gaming is structurally inevitable. The analogy supports this by saying "optimization pressure always finds paths." This is true. But the analogy implies we can't stop it, like we can't stop evolution. We *can* stop it by reducing pressure or changing the metric. So the "inevitability" is conditional on maintaining the pressure and the gap.

      *   *Alternative:* The "Water" analogy. Optimization pressure is like water pressure. The metric is a container. If there are cracks (misalignment), water will leak. It captures the inevitability of flow without implying biological agency or blind teleology. Or the "Tax Code" analogy: legislators write laws (metrics) to achieve social good (true goal), taxpayers (agents) minimize liability (optimize). Loopholes are inevitable because language is imperfect.

      *   *Decision:* I will weave the "Tax/Law" analogy in as a potentially clearer framework for human institutions, while acknowledging the evolutionary one works well for AI/RL.

