prompt: |-
  I edit a social-science journal and I need a decision procedure my associate editors can use to decide whether a submission is scientific enough to send out for peer review. We get a lot of borderline stuff: psychoanalytic readings of political movements, rational-choice models with no empirical test, advocacy papers with a thin layer of footnotes, qualitative work where you genuinely can't tell what would count as a counterexample. 'Is it falsifiable?' is too crude and everyone knows it — Duhem-Quine alone makes a mess of that as a gatekeeping rule, nevermind the fact that half of respectable science doesn't look falsificationist on the ground. But I also can't just say 'we know it when we see it' because my editors disagree constantly.

  I need a checklist someone can run in twenty minutes without a philosophy degree, that catches the genuinely unscientific stuff without gatekeeping in a way that just enforces methodological conservatism. For each step, say what demarcation criterion or idea from philosophy of science it's operationalizing, what it catches, and what it might unfairly exclude. Then run the procedure on three borderline submissions and tell me what it decides:

  (1) A paper arguing from clinical case material that rising authoritarianism reflects a collective oedipal dynamic. No quantitative data, just interpretive readings of political events through a Freudian lens.

  (2) A paper using rational-choice models to argue that climate activism is counterproductive because of free-rider dynamics. The models are internally consistent, the math checks out, but there's no attempt to test the predictions against any data.

  (3) A survey study finding that people who read literary fiction score higher on empathy measures than people who dont, where the authors state in the introduction that they designed the study specifically to generate evidence in favor of arts funding, and the discussion section treats the hypothesis as confirmed.

  Flag any cases where the procedure says 'no' but a reasonable editor might say 'maybe,' and vice versa. And be honest about which steps are judgment calls dressed up as a checklist — I'd rather know where the procedure is leaning on taste than pretend it isn't.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Editor of a social-science journal.
      *   **Problem:** Too many borderline submissions (pseudo-science, pure theory without testing, advocacy masquerading as research, unfalsifiable qualitative work).
      *   **Constraint:** Needs a decision procedure for Associate Editors (AEs).
      *   **Requirements:**
          *   Take ~20 minutes.
          *   No philosophy degree required.
          *   Avoid crude falsificationism (acknowledges Duhem-Quine).
          *   Avoid mere "I know it when I see it" (needs consistency).
          *   Avoid enforcing methodological conservatism (needs to allow innovation).
          *   Structure: Checklist steps, underlying philosophical criterion, what it catches, what it might exclude unfairly.
          *   Application: Run on three specific borderline cases.
          *   Reflection: Flag disagreements (Procedure vs. Reasonable Editor) and admit where judgment/taste is disguised as rules.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Demarcation Problem:* Popper (falsifiability) is too strict. Kuhn (paradigms) is too descriptive. Lakatos (research programmes) is good but complex. Feyerabend (anything goes) is useless for gatekeeping.
      *   *Social Science Specifics:* Needs to handle qualitative work, theory building, and normative implications without succumbing to ideology.
      *   *Key Concept:* **Inferential Risk.** Science requires that the author risks being wrong. If the argument can accommodate any outcome, it's not scientific.
      *   *Key Concept:* **Transparency of Warrant.** How do we get from evidence to claim? Is the bridge clear?
      *   *Key Concept:* **Engagement with Counter-evidence.** Does the author acknowledge things that would weaken their claim?

  3.  **Drafting the Checklist (Iterative Process):**

      *   *Attempt 1 (Popperian):* Is it falsifiable? *Critique:* User explicitly rejected this. Too crude.
      *   *Attempt 2 (Methodological):* Is there a methods section? *Critique:* Too conservative. Excludes theoretical pieces that are still scientific.
      *   *Attempt 3 (Epistemic):* Focus on *how* claims are supported.
      *   *Selected Criteria:*
          1.  **Specificity of Claim:** Vague claims can't be wrong. (Operationalizes Precision/Testability).
          2.  **Evidence-Claim Link:** Is the bridge explicit? (Operationalizes Warrant/Inference).
          3.  **Risk/Counter-evidence:** Did the author consider what would prove them wrong? (Operationalizes Falsifiability *spirit* without the letter).
          4.  **Independence of Data:** Is the evidence independent of the conclusion? (Operationalizes Objectivity/Bias).

      *   *Refining for 20 Minutes:* Needs to be punchy. Let's call it the "Epistemic Risk Checklist."

      *   *Step 1: The "What Would Change Your Mind?" Test.* (Operationalizes Falsifiability/Lakatos).
      *   *Step 2: The "Bridge" Test.* (Operationalizes Inference/Warrant).
      *   *Step 3: The "Surprise" Test.* (Operationalizes Empirical Content).
      *   *Step 4: The "Advocacy" Test.* (Operationalizes Mertonian Norms/Value-Neutrality).

      *   *Wait, let's look at the "Methodological Conservatism" constraint.* I need to make sure qualitative work doesn't fail just because it's not quantitative.
      *   *Revision:* Focus on *systematicity* rather than *quantification*.
      *   *Revised Steps:*
          1.  **Constraint on Interpretation:** Can the evidence *actually* contradict the theory? (Duhem-Quine aware).
          2.  **Transparency of Inference:** Is the move from data to claim clear?
          3.  **Engagement with Alternatives:** Are rival explanations considered?
          4.  **Separation of Is and Ought:** Is the normative goal distinct from the empirical claim?

  4.  **Developing the Procedure Details:**
      *   For each step, I need: Criterion, Catches, Excludes.
      *   *Honesty Check:* I need to explicitly state where this is subjective.

  5.  **Running the Procedure on the Cases:**

      *   *Case 1 (Psychoanalytic/Authoritarianism):*
          *   Constraint: Can political events contradict the Oedipal dynamic? Probably not. It's interpretive.
          *   Inference: Bridge is metaphorical, not systematic.
          *   Alternatives: Likely ignores materialist/institutional explanations.
          *   Verdict: Reject (or Major Revise to clarify status as theory, not science).
      *   *Case 2 (Rational Choice/Climate):*
          *   Constraint: Models make predictions, but no test.
          *   Inference: Math is clear, empirical link is missing.
          *   Alternatives: Ignores empirical reality.
          *   Verdict: Borderline. Theory papers exist. But "no attempt to test" is risky.
      *   *Case 3 (Fiction/Empathy/Advocacy):*
          *   Constraint: Survey data exists.
          *   Inference: Correlation vs Causation?
          *   Advocacy: Designed to confirm. Discussion treats as confirmed.
          *   Verdict: Reject (Confirmation bias/Advocacy).

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* The prompt asks for honesty about "judgment calls dressed up as a checklist." I need a section dedicated to this.
      *   *Critique:* The prompt asks to flag where the procedure says 'no' but a reasonable editor might say 'maybe.'
      *   *Case 2 Nuance:* Pure theory papers *are* published in social science. If I reject Case 2 outright, I might be enforcing conservatism. I need to calibrate Step 2 to allow formal theory *if* it proposes empirical implications.
      *   *Case 1 Nuance:* Qualitative/Interpretive work is valid. But "clinical case material" applied to "political movements" is a category error (level of analysis problem). The checklist needs to catch *analogical* reasoning masquerading as *causal* reasoning.

  7.  **Finalizing the Checklist Structure:**
      *   Name: The "Epistemic Commitment Checklist."
      *   4 Questions.
      *   Scoring: 0-2 per question. Threshold for review.
      *   Philosophy mapping for each.
      *   Case Studies.
      *   Meta-Commentary on limitations.

  8.  **Drafting the Content (incorporating the "Honesty" requirement):**
      *   Make sure to mention Kuhn, Lakatos, Popper, Merton where appropriate but keep it accessible.
      *   Ensure the "Advocacy" case is handled carefully (advocacy isn't bad, but *biasing the design* is).
      *   Ensure the "Rational Choice" case distinguishes between *formal theory* (valid) and *untouched modeling* (less valid).

  9.  **Final Review against constraints:**
      *   20 mins? Yes, 4 questions.
      *   No phil degree? Yes, plain English.
      *   Catch unscientific stuff? Yes.
      *   Avoid conservatism? By focusing on *commitment* rather than *method*.
      *   Run on 3 cases? Yes.
      *   Flag disagreements? Yes.
      *   Admit judgment calls? Yes.

      *(Self-Correction on Case 2)*: A rational choice model without empirical testing is often published in journals like *JPT* or *AJPS* as a "theory note." If I reject it, I am being conservative. I should adjust the checklist to allow it *if* it generates testable hypotheses, even if not tested *in this paper*. The prompt says "no attempt to test the predictions against any data." It doesn't say "no hypotheses generated." I will treat this as a "Major Revise" or "Conditional Accept" scenario in the analysis to show nuance. Actually, the prompt says "decide whether... to send out for peer review." So the question is: Is it *reviewable*? A model with no empirical link might be math, not social science. I'll lean towards "Desk Reject" but flag the tension.

      *(Self-Correction on Case 1)*: Psychoanalytic political theory is a thing (e.g., Frankfurt School). But is it *scientific* in the social science sense? Usually, it's critical theory. If the journal is "social science," this might be a category mismatch. I will flag this as a "Scope" issue vs "Science" issue.

      *(Self-Correction on Case 3)*: This is p-hacking/confirmation bias disguised as research. Clear reject.

      *Let's build the response.*
answer: |-
  Here is a decision procedure designed for your Associate Editors (AEs). It is titled the **Epistemic Commitment Checklist**.

  It avoids crude falsificationism by focusing on **risk** and **inference** rather than truth or method. It asks: *Has the author put something on the line that the world could potentially knock over?* This accommodates qualitative work (which can be risky) and formal theory (which can be risky) while filtering out tautologies, advocacy, and unconstrained interpretation.

  ### The Epistemic Commitment Checklist
  **Time required:** 15–20 minutes
  **Passing score:** 6 out of 8 points (see scoring below)

  For each of the four questions below, assign a score:
  *   **0 (Fail):** Clear violation.
  *   **1 (Borderline):** Ambiguous or partially addressed.
  *   **2 (Pass):** Clearly satisfied.

  ---

  #### 1. The Constraint Question
  **Question:** Does the author specify what kind of evidence would *weaken* or *complicate* their central claim, even if they argue it wouldn't fully refute it?
  *   **Philosophical Criterion:** **Lakatosian Protective Belts.** (Operationalizes the *spirit* of falsifiability without demanding a single "killer experiment." It acknowledges Duhem-Quine by allowing auxiliary assumptions to be adjusted, but demands that the core claim has boundaries.)
  *   **What it catches:** "Heads I win, tails you lose" arguments; theories that explain everything and therefore predict nothing; qualitative work where every piece of data is interpreted as confirmation.
  *   **What it might exclude:** Early-stage exploratory research; highly complex systems where isolating variables is genuinely impossible (though these should usually admit uncertainty).

  #### 2. The Inference Question
  **Question:** Is the bridge between the evidence presented and the conclusion drawn explicit enough that a competent scholar could disagree with the *step*, not just the *conclusion*?
  *   **Philosophical Criterion:** **Toulmin's Warrant.** (Operationalizes the logic of inference. Science requires that the move from Data to Claim be governed by a rule that is open to scrutiny.)
  *   **What it catches:** Intuitive leaps disguised as analysis; "reading between the lines" without a stated hermeneutic method; statistical significance treated as causal proof without argument.
  *   **What it might exclude:** Creative or highly interpretive humanities-style work that relies on reader resonance rather than logical warrant (this may be a scope issue, not a science issue).

  #### 3. The Alternative Question
  **Question:** Does the paper engage with at least one plausible rival explanation for the phenomenon and explain why their account is preferred?
  *   **Philosophical Criterion:** **Inference to the Best Explanation (Abduction).** (Operationalizes the idea that scientific claims are comparative. A claim is only strong if it survives competition.)
  *   **What it catches:** Straw-man arguments; ideology that assumes its premises are self-evident; models that assume their axioms are the *only* rational ones.
  *   **What it might exclude:** Highly specialized technical notes that build directly on a specific prior paper (though even these usually acknowledge limitations).

  #### 4. The Independence Question
  **Question:** Is the empirical evidence independent of the normative goal? (i.e., Could the data have come out the other way without the author dismissing it as "irrelevant"?)
  *   **Philosophical Criterion:** **Mertonian Universalism/Disinterestedness.** (Operationalizes the separation of *is* and *ought*. Advocacy is permitted in the discussion, but not in the design or data selection.)
  *   **What it catches:** Activist research designed to confirm a pre-determined outcome; cherry-picked case studies; "policy papers" that lack an empirical component.
  *   **What it might exclude:** Participatory Action Research (PAR) or explicitly critical methodologies where the goal is transformation, not description (again, potentially a scope issue).

  ---

  ### Application to Borderline Submissions

  Here is how the checklist performs on your three specific cases.

  #### Case 1: The Psychoanalytic Political Paper
  *Argument: Rising authoritarianism reflects a collective oedipal dynamic (Clinical case material applied to politics).*

  *   **Constraint (0):** No. Political events are interpreted *through* the lens. There is no specification of what political behavior would indicate a *lack* of oedipal dynamic. The theory absorbs all data.
  *   **Inference (0):** No. The bridge from "individual clinical dynamic" to "collective political movement" is analogical/metaphorical, not methodological. A reviewer cannot critique the step, only the metaphor.
  *   **Alternative (0):** No. Materialist, institutional, or economic explanations for authoritarianism are likely dismissed as superficial compared to the "deep" psychoanalytic truth.
  *   **Independence (1):** Borderline. The authors likely believe they are neutral, but the lens dictates the outcome.
  *   **Total Score:** 1/8.
  *   **Decision:** **Desk Reject.**
  *   **Editorial Note:** This is likely Critical Theory or Humanities, not Social Science. It lacks epistemic risk.

  #### Case 2: The Untested Rational-Choice Model
  *Argument: Climate activism is counterproductive due to free-rider dynamics (Math checks out, no empirical test).*

  *   **Constraint (2):** Yes. Formal models are inherently constrained. If the math changes, the outcome changes. The parameters define the boundaries.
  *   **Inference (2):** Yes. The bridge from axioms to equilibrium is mathematical and transparent.
  *   **Alternative (1):** Borderline. Does it engage with rival models (e.g., cooperation models)? If it assumes free-riding is the *only* rational response, it scores low. Let's assume 1 for "thin engagement."
  *   **Independence (2):** Yes. The model is value-neutral regarding the outcome; it derives a logical consequence, not a desired one.
  *   **Total Score:** 7/8.
  *   **Decision:** **Send for Review.**
  *   **Editorial Note:** *However*, the AE should flag to the editor that reviewers must be asked to judge **empirical relevance**, not just mathematical consistency.
  *   **Conflict Flag:** A reasonable editor might say "Maybe/Reject." Many empirical journals reject pure theory. This checklist identifies it as *scientific* (logical/risky), but not necessarily *empirical social science*. This is where the checklist protects against methodological conservatism (rejecting theory) but requires AE judgment on journal scope.

  #### Case 3: The Advocacy Survey Study
  *Argument: Literary fiction increases empathy (Designed to generate evidence for arts funding).*

  *   **Constraint (1):** Borderline. They likely admit limitations, but the design was biased toward confirmation.
  *   **Inference (1):** Borderline. Correlation vs. Causation is likely glossed over to support the funding argument.
  *   **Alternative (0):** No. Rival explanations (e.g., educated people read fiction *and* score higher on empathy) are likely minimized in the discussion.
  *   **Independence (0):** No. The prompt states the study was *designed* to generate evidence in favor of funding. This violates the separation of Is and Ought. The "goal" contaminated the "design."
  *   **Total Score:** 2/8.
  *   **Decision:** **Desk Reject.**
  *   **Editorial Note:** This is advocacy masquerading as science. The normative goal compromised the empirical warrant.

  ---

  ### Meta-Commentary: Where the Checklist Lies to You

  You asked for honesty about where this procedure relies on taste disguised as rules. Here are the three pressure points your AEs need to know about.

  **1. The "Constraint" Trap (Judgment Call)**
  *   **The Lie:** The checklist implies we can objectively spot if an author specifies weakening evidence.
  *   **The Reality:** Skilled writers can bury this in a footnote ("Of course, if X were observed, this theory would need refinement"). An AE who likes the paper will read that as a Pass (2); an AE who dislikes the paper will read it as a hedging Fail (0).
  *   **Mitigation:** Tell AEs: If the "weakening evidence" is relegated to the conclusion as a "limitation," score it a 1. It must be in the theory section to be a 2.

  **2. The "Alternative" Bias (Methodological Conservatism)**
  *   **The Lie:** Asking for "plausible rival explanations" sounds neutral.
  *   **The Reality:** What counts as "plausible" is paradigm-dependent. A quantitative AE might reject a qualitative paper because it didn't test a quantitative rival. A Marxist AE might reject a liberal institutionalist paper for ignoring class structure.
  *   **Mitigation:** This is the highest risk point for enforcing conservatism. Instruct AEs: The rival explanation must be one *the author acknowledges as relevant to their sub-field*, not one the AE personally prefers.

  **3. The "Independence" vs. "Critical Science" Conflict (Scope Issue)**
  *   **The Lie:** That normative goals always corrupt empirical design.
  *   **The Reality:** In critical social science (feminist, post-colonial, PAR), the goal *is* emancipation. Case 3 failed because the *design* was rigged, not because they wanted arts funding. But an AE might conflate "advocacy conclusion" with "advocacy design."
  *   **Mitigation:** Distinguish between **Motivation** (Why I did it) and **Construction** (How I did it). Case 3 failed on Construction. If a paper says "I want to help workers" but uses rigorous methods, it passes Independence. If it says "I want to help workers" and selects data that only helps workers, it fails.

  ### Summary of Disagreements (Procedure vs. Reasonable Editor)

  | Case | Procedure Says | Reasonable Editor Might Say | Why the Gap? |
  | :--- | :--- | :--- | :--- |
  | **1 (Psychoanalytic)** | **Reject** (1/8) | **Maybe** (if journal is interdisciplinary) | The checklist defines "science" narrowly. Some journals value "insight" over "risk." If your journal is strictly social science, the procedure is right. If it's "Social Studies," it's too harsh. |
  | **2 (Rational Choice)** | **Review** (7/8) | **Reject** (if journal is empirical) | The checklist validates *formal* science. Many editors view untested models as "math exercises." This is the specific point where you must instruct AEs on journal scope. |
  | **3 (Advocacy)** | **Reject** (2/8) | **Reject** (2/8) | **Agreement.** This is the clearest case. The procedure aligns with standard editorial intuition here. |

  ### Final Instruction to AEs
  *"This checklist is a filter for **epistemic risk**, not a judgment on **truth** or **value**. A paper can pass this checklist and still be wrong. A paper can fail this checklist and still be politically important. Our job is to curate the science, not the politics. If a paper scores low, it is not 'bad,' it is 'not reviewable by our standards.'"*
