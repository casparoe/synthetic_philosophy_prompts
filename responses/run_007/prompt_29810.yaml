answer: |-
  Your intuition is spot-on. The blog post you read is a classic example of "pop-mathematics": it captures the *vibe* of Arrow's Impossibility Theorem correctly but gets the technical details wrong enough to lead to a misleading philosophical conclusion.

  A social choice theorist would nod at the mention of Condorcet cycles but would wince at the definition of the axioms and strongly reject the "doomed in principle" conclusion.

  Here is a sentence-by-sentence breakdown of what is accurate, what is imprecise, and what is wrong, followed by an explanation of the missing conditions and the verdict on whether voting is actually "doomed."

  ---

  ### Sentence-by-Sentence Analysis

  #### 1. "Arrow proved that no voting system can be truly fair."
  *   **Theorist Reaction:** **Wince.**
  *   **Why:** "Fair" is not a mathematical term. Arrow did not prove that voting is unfair; he proved that no rank-order voting system can satisfy a specific set of *logical consistency criteria* simultaneously.
  *   **Nuance:** A system can be "fair" in a moral or democratic sense (e.g., one person, one vote) while still violating one of Arrow's axioms (usually Independence of Irrelevant Alternatives). Equating "mathematically impossible to satisfy all axioms" with "unfair" is a category error.

  #### 2. "Any method of combining individual preference rankings into a group ranking must fail at least one of three basic conditions: transitivity of the group ranking, non-dictatorship, or independence of irrelevant alternatives."
  *   **Theorist Reaction:** **Mostly Wrong / Incomplete.**
  *   **Why:** This lists only three conditions, but Arrow's Theorem relies on **four** input axioms plus one output requirement.
      1.  **Missing:** *Unrestricted Domain (Universal Domain):* The system must work for any possible set of individual preferences.
      2.  **Missing:** *Pareto Efficiency (Unanimity):* If everyone prefers A over B, the group ranking must prefer A over B.
      3.  **Confusion:** *Transitivity* is not an input condition; it is a requirement for the **output**. The theorem states that if you satisfy the input axioms, the output *cannot* be guaranteed to be transitive. The blog post phrases it as if transitivity is a rule you can choose to break like the others, rather than a property of the resulting order.
  *   **Correction:** It should read: "No rank-order voting system can satisfy Unrestricted Domain, Pareto Efficiency, IIA, and Non-Dictatorship simultaneously while producing a transitive social ordering."

  #### 3. "Majority rule fails transitivity because of Condorcet cycles..."
  *   **Theorist Reaction:** **Accept.**
  *   **Why:** This is accurate. Pairwise majority voting satisfies almost all of Arrow's conditions (including Pareto and Non-Dictatorship), but it fails to produce a transitive group ranking when preferences cycle (A>B, B>C, C>A). This is the Condorcet Paradox.

  #### 4. "...and ranked-choice voting fails IIA because a third candidate can spoil a race."
  *   **Theorist Reaction:** **Accept (with minor caveats).**
  *   **Why:** Instant Runoff Voting (RCV) does fail the Independence of Irrelevant Alternatives (IIA). The "spoiler effect" is a common real-world manifestation of IIA failure (though spoilers can also relate to monotonicity violations). If candidate C drops out, the winner between A and B might change, which violates IIA.

  #### 5. "So all real voting methods are either secretly dictatorial or produce irrational group preferences, and the search for a fair voting method is doomed in principle."
  *   **Theorist Reaction:** **Wrong.**
  *   **Why:** This is the nihilistic overreach.
      *   **"Secretly dictatorial":** No real voting method is dictatorial. They simply fail one of the *other* axioms (usually IIA or Universal Domain).
      *   **"Irrational group preferences":** Most systems produce a rational (transitive) winner most of the time; they just can't *guarantee* it under *all* theoretical circumstances.
      *   **"Doomed in principle":** This ignores the many ways to escape the theorem (see below).

  ---

  ### The Missing Conditions (Your Vague Memory)

  You were right to suspect more conditions. For Arrow's Theorem to hold, the voting system must be a **Social Welfare Function** (it produces a full ranking of all candidates, not just a winner) based on **Ordinal Ballots** (rankings, not scores).

  The four standard axioms are:
  1.  **Unrestricted Domain:** Voters can hold any preference order they want.
  2.  **Pareto Efficiency:** If every voter prefers X over Y, the group ranking must prefer X over Y.
  3.  **Independence of Irrelevant Alternatives (IIA):** The group's ranking of X vs. Y should depend *only* on how individuals rank X vs. Y, not on their opinions about Z.
  4.  **Non-Dictatorship:** No single voter's preferences automatically become the group's preferences.

  **The Theorem:** If a system satisfies 1, 2, 3, and 4, it cannot produce a **Complete and Transitive** social ordering.

  The blog post omitted **Unrestricted Domain** and **Pareto Efficiency**. This is crucial because if you relax either of those, Arrow's impossibility disappears.

  ---

  ### Is the Search "Doomed in Principle"?

  **No.** The conclusion that voting is doomed is false for three main reasons.

  #### 1. Arrow Only Applies to Ordinal Rankings
  Arrow's Theorem assumes voters provide a **rank order** (1st, 2nd, 3rd). It does not apply to **Cardinal Voting** systems (like Score Voting or Approval Voting), where voters rate candidates independently (e.g., 0 to 5 stars).
  *   In Score Voting, you can satisfy Pareto, Non-Dictatorship, and a modified version of IIA without running into Arrow's contradiction.
  *   Theorem: **Arrow's Impossibility does not apply to cardinal utility systems.**

  #### 2. We Can Relax "Unrestricted Domain"
  Arrow assumes voters can have *any* preference structure. However, in many real-world political contexts, preferences are **Single-Peaked** (voters prefer candidates closer to their ideology on a left-right spectrum).
  *   **Black's Median Voter Theorem:** If preferences are single-peaked, simple Majority Rule *does* satisfy transitivity and all other Arrow conditions.
  *   So, voting isn't doomed; it just works best when the political landscape isn't extremely polarized in multiple dimensions.

  #### 3. "Fair" Doesn't Require Satisfying All Axioms
  Social choice theorists generally view Arrow's Theorem not as a stop sign, but as a menu of trade-offs.
  *   Most democracies choose to violate **IIA** (using systems like Plurality or RCV) because IIA is considered the least essential of the axioms for practical democracy.
  *   Violating IIA means "spoilers" are possible, but it doesn't mean the system is "dictatorial" or "irrational." It just means the context of the choice matters.

  ### The Real "Doom" Theorem
  If you want a theorem that is more pessimistic about voting, you are likely thinking of the **Gibbard-Satterthwaite Theorem**.
  *   **What it says:** Any voting system that picks a single winner (with at least 3 candidates) is either dictatorial or susceptible to **tactical voting** (strategic insincerity).
  *   **Verdict:** This proves that voters will sometimes have an incentive to lie about their preferences. This is a stronger argument for "doomed" than Arrow, but even then, some systems (like Score Voting) minimize the impact of strategy significantly compared to others.

  ### Summary Verdict

  | Blog Claim | Accuracy | Theorist Correction |
  | :--- | :--- | :--- |
  | "No system is truly fair" | **Misleading** | "No ordinal system satisfies all 4 specific axioms." |
  | "Fail one of 3 conditions" | **Wrong** | There are 4 axioms + 1 output requirement. |
  | "Majority fails transitivity" | **Correct** | Condorcet cycles are real. |
  | "RCV fails IIA" | **Correct** | Spoilers are an IIA violation. |
  | "Doomed in principle" | **False** | Cardinal voting and domain restrictions escape the theorem. |

  **Conclusion:** The blog post is a "telephone game" version of the theorem. Arrow proved that **rank-based** voting systems involve trade-offs, not that fairness is impossible. The search is not doomed; it just requires choosing which mathematical property you are willing to relax (usually IIA) or switching to a different type of ballot (cardinal/score).

  Your skepticism was well-founded. The "doomed" conclusion is a dramatic oversimplification that ignores the last 40 years of mechanism design and cardinal voting research.
