      *   **Thesis:** The line between manipulation and legitimate persuasion is drawn by a "co-deliberative criterion": influence is legitimate if offered as a consideration the target could, upon full disclosure, recognize as a reason from within their own deliberative standpoint. It's *not* about rational vs. emotional or conscious vs. non-conscious processes.
      *   **Audience:** 25 people (ethicists, political philosophers). Specific subgroups: 3 Kantians (autonomy/consent), 2 Aristotelians (shared ends/character), 1 Empiricist (psych literature), rest agnostic/other.
      *   **Requirements:**
          *   Order objections logically (as they would arise).
          *   Phrase objections in the audience's voice.
          *   Provide 2-minute replies.
          *   Identify the "soft spot" in each reply.
          *   Include the "Prayer Question" (the one to avoid).
          *   **Crucial Constraint:** If the framing is fundamentally confused/flawed, point that out *before* the prep sheet. Do not enable a disaster.

  2.  **Evaluate the Thesis (The "Tear Apart" Check):**
      *   *Thesis:* Manipulation vs. Persuasion turns on whether the target could recognize the influence as a reason from their own deliberative standpoint upon full disclosure.
      *   *Potential Fatal Flaw:* This sounds suspiciously like a hybrid of Scanlonian contractualism ("principles no one could reasonably reject") and a transparency condition.
      *   *The Problem:* "Recognize as a reason from within their own deliberative standpoint" is doing *too much work*.
          *   *Issue 1 (The Manipulated Believer):* A cult member or radicalized individual *does* recognize the influence as a reason from within their standpoint. Does that make cult indoctrination legitimate persuasion? If the user says "No, because their standpoint is corrupted," they slide into paternalism (judging the standpoint) or circularity (defining the legitimate standpoint by the legitimate influence).
          *   *Issue 2 (The Unreasonable Target):* What if the target is stubborn, biased, or irrational? If I offer a good reason, but they *wouldn't* recognize it as a reason due to their own flaws, is my persuasion now manipulation? The criterion seems to make legitimacy dependent on the target's actual psychological capacity rather than the offeror's action.
          *   *Issue 3 (Disclosure):* "Upon full disclosure" is the classic transparency test. But manipulators often disclose. "I am using a scarcity tactic to make you buy this." If you know I'm doing it, and you still buy it, did I manipulate you? Many theorists say yes (exploitation of bias), even with disclosure. The user's criterion says if they recognize it as a reason *upon disclosure*, it's okay. But sometimes we recognize a reason ("I'm afraid of missing out") but still feel manipulated because the reason was *triggered* non-rationally.
      *   *Verdict:* The thesis isn't *incoherent*, but it is vulnerable to the "Corrupted Standpoint" objection and the "Transparency isn't Enough" objection. It risks collapsing into a subjective test (what the target happens to accept) rather than an objective normative test (what counts as a valid reason).
      *   *Decision:* I need to warn the user about the "Corrupted Standpoint/Cult" problem. It's the most likely avenue for destruction. However, it's not a *fatal* error if they have a response ready (e.g., distinguishing between *actual* recognition and *reasonable* recognition). I will flag this prominently but proceed with the prep sheet because the core intuition (reasons-responsiveness) is a standard and defensible move in ethics.

  3.  **Drafting the Objections (Ordering & Voice):**
      *   *Order:* Usually, Q&A starts with clarifications, then moves to internal coherence, then external implications.
      *   *1. The Kantians (Autonomy/Consent):* They usually jump early. They care about the structure of the will.
      *   *2. The Aristotelians (Virtue/Ends):* They care about the relationship and the good.
      *   *3. The Empiricist (Psych/Science):* They care about application and evidence.
      *   *4. The General/Agnostic (Counterexamples):* Hard cases.
      *   *5. The "Prayer" Question:* The metaphysical/normative grounding that undermines the whole project.

  4.  **Developing the Replies & Soft Spots:**
      *   *Kantian Objection:* "Is this just hypothetical consent?"
          *   *Reply:* No, it's about *reasons*, not consent. Consent is an act; recognizing a reason is a cognitive/normative stance.
          *   *Soft Spot:* Distinguishing "recognizing a reason" from "agreeing to a maxim" is tricky.
      *   *Aristotelian Objection:* "What about shared ends/character?"
          *   *Reply:* Shared ends are the background, but manipulation can happen *within* shared ends. My criterion filters the *means*.
          *   *Soft Spot:* If the ends aren't shared, is *any* persuasion legitimate?
      *   *Empiricist Objection:* "Priming/Nudges. Disclosure doesn't stop bias."
          *   *Reply:* My view predicts that disclosed nudges are legitimate *if* the bias aligns with the agent's goals (e.g., saving for retirement).
          *   *Soft Spot:* Empirical evidence often shows people feel manipulated even when disclosed.
      *   *General Objection:* "The Cult Problem" (Corrupted Standpoint).
          *   *Reply:* Distinguish between *procedural* recognition and *substantive* validity. (This is the hardest part).
          *   *Soft Spot:* Risks paternalism.

  5.  **Refining the "Prayer Question":**
      *   What kills this view? The idea that "reasons" are not neutral. If the influencer defines what counts as a "reason from their standpoint," the criterion is empty.
      *   *Question:* "Who adjudicates the 'deliberative standpoint'? If the target is depressed, biased, or indoctrinated, their standpoint is compromised. If you appeal to an objective standard of reasons, you've abandoned the standpoint condition. If you stick to the subjective standpoint, you legitimize manipulation of the vulnerable."

  6.  **Review against Constraints:**
      *   *Tone:* Direct, professional, slightly critical (as requested: "tell me that before you give me the prep sheet").
      *   *Format:* Warning first, then Prep Sheet.
      *   *Timing:* 2-minute replies (approx. 250-300 words spoken).

  7.  **Final Polish:**
