answer: |-
  # Joint Statement on the Linguistics of Slurs

  **Preamble**
  We, the undersigned representatives of the Semanticist and Pragmatist camps, acknowledge our deep disagreement regarding the location of derogatory force in slurs. However, we agree on the empirical data requiring explanation. This document outlines our common ground, exact disagreements, and the specific linguistic cruxes that would resolve our dispute.

  ### I. Agreed Claims and Tolerated Data
  The following claims describe linguistic phenomena. We distinguish between claims we both endorse as theoretical commitments ([Agreed]) and claims we accept as observed data despite disagreeing on their theoretical explanation ([Tolerated as Data]).

  1.  **Phenomenological Offense:** Uttering a slur typically causes greater offense and harm than uttering its neutral counterpart (e.g., *[slur]* vs. *[neutral]*), even in identical contexts. [Agreed]
  2.  **Intent Independence:** A slur can cause offense and constitute a harmful act even if the speaker lacks malicious intent or was unaware of the word's status. [Agreed]
  3.  **Context Sensitivity:** The perceived offensiveness of a slur varies across social contexts, particularly regarding the identity of the speaker and audience. [Agreed]
  4.  **Embedding Behavior:** Derogatory force appears to persist when the slur is embedded under negation or conditionals (e.g., "He is not a *[slur]*"). [Semanticists: Agreed; Pragmatists: Tolerated as Data]
  5.  **Reclamation Possibility:** Members of the targeted group can sometimes use the slur among themselves without generating offense or derogation. [Agreed]
  6.  **Mention vs. Use:** Discussing the word itself (mention) is often less offensive than using it to refer to a person, though mention is not always neutral. [Pragmatists: Agreed; Semanticists: Tolerated as Data]

  ### II. Disagreements Table
  The following table states each camp's position in terminology acceptable to that camp, isolating the exact residual disagreement.

  | Issue | Semanticist Position | Pragmatist Position | Exact Residual Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Locus of Force** | Derogatory content is encoded in the word's lexical entry (truth-conditional, expressive, or presuppositional). | Derogatory force is generated by norms of use, taboo, or conversational implicature associated with the word. | Is the offensive potential intrinsic to the word *type* (semantic) or extrinsic, arising only upon *token* usage (pragmatic)? |
  | **Cancellability** | Derogatory content is non-cancelable without changing the meaning of the word. If it disappears, the word is no longer being used as a slur. | Derogatory force is cancelable by context. A speaker can use the word without derogating if contextual cues override default norms. | Can the derogatory force be stripped away while the word remains semantically identical, or does stripping force change the semantics? |
  | **Reclamation** | Reclamation involves a shift in lexical meaning or a suspension of semantic content within specific contexts. | Reclamation reveals the word's semantic content was always neutral; the derogatory force was merely a pragmatic overlay that has been removed. | Does reclamation create a *new* meaning or recover an *old* (neutral) meaning obscured by usage norms? |

  ### III. Cruxes: Evidence and Predictions
  Settling the following sub-questions would move at least one camp. We specify the concrete linguistic evidence and our respective predictions.

  **Crux 1: Projection under Negation and Embedding**
  *   **Concrete Case:** Compare "John is not a *[slur]*" with "John is not a *[neutral]*."
  *   **Evidence Required:** Does the utterance still imply John belongs to the derogated class or deserves derogation, despite the negation? We require acceptability judgments on follow-ups like: "John is not a *[slur]*, #but he is still deserving of contempt."
  *   **Semanticist Prediction:** The derogatory content projects. The follow-up is contradictory or infelicitous because the slur encodes the contempt regardless of negation.
  *   **Pragmatist Prediction:** The derogatory force is an implicature or tone that can be blocked. The follow-up is acceptable because the negation cancels the application of the term, and the force does not necessarily survive.

  **Crux 2: In-Group Reclamation**
  *   **Concrete Case:** An in-group member says to another, "You are my favorite *[slur]*."
  *   **Evidence Required:** Does this usage retain any derogatory truth-conditions or expressive content, even if no offense is taken? We require tests on embedding: "If you are my favorite *[slur]*, then..."
  *   **Semanticist Prediction:** The lexical entry is locally modified or suspended. The word functions as a distinct lexical item with different truth-conditions during reclamation.
  *   **Pragmatist Prediction:** The semantic content remains neutral (identical to the *[neutral]* counterpart). The lack of offense confirms the derogatory force was never semantic, only pragmatic.

  **Crux 3: Mention vs. Use and Contagion**
  *   **Concrete Case:** A linguist states, "The word *[slur]* has five letters."
  *   **Evidence Required:** Is this utterance judged as offensive by naive hearers? Does it require hedging (e.g., "the s-word") to avoid offense?
  *   **Semanticist Prediction:** High risk of offense (contagion). Because the meaning is encoded, mentioning the word activates the derogatory content regardless of communicative intent.
  *   **Pragmatist Prediction:** Low risk of offense. Because the force arises from *use* to refer/derogate, mere mention lacks the pragmatic conditions necessary to generate harm.

  ### IV. Verbal Dispute Identification
  We identify a partial verbal dispute regarding the term **"Conventional Meaning."**

  *   **Semanticists** define "conventional meaning" narrowly as content fixed by linguistic rules independent of specific speaker intentions (including lexical presuppositions or expressives).
  *   **Pragmatists** define "conventional meaning" strictly as truth-conditional content, categorizing social norms of use as "conventions of usage" rather than "semantic conventions."

  **Why this is verbal:** If Semanticists expanded their definition of "semantic" to include "stable pragmatic norms," the Pragmatists would object that this empties the semantics/pragmatics distinction. Conversely, if Pragmatists acknowledged "conventions of use" as a form of "meaning," Semanticists would agree the force is conventional but insist it remains pragmatic.

  **Resolution Path:** We agree to distinguish **"Lexical Encoding"** (Semanticist focus) from **"Normative Stability"** (Pragmatist focus). If the derogatory force is shown to be immune to contextual cancellation (Lexical Encoding), the Semanticist view prevails. If the force is shown to vary strictly with speaker audience norms without lexical change (Normative Stability), the Pragmatist view prevails. We will not adjudicate which label ("meaning" vs. "use") applies to the winner.
