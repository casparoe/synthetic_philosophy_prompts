prompt: |-
  Draft the joint statement of an adversarial collaboration between two camps in the philosophy of language who disagree about slurs. One camp holds that a slur's derogatory force is part of its conventional meaning — what the word itself encodes, whether truth-conditionally or as expressive or presuppositional content. The other camp holds that the derogatory force is not part of conventional meaning but arises from use — taboo, tone, conversational implicature, or the attitudes speakers and hearers bring to the word. Begin with a numbered list of claims about slur behavior that both camps can sign, distinguishing what is genuinely agreed from what each side merely tolerates. Then provide a disagreements table in which each side's position is stated in wording that side would accept, with the residual disagreement made exact rather than slanted. Next identify the cruxes: the sub-questions about slur behavior — for example, projection under negation and embedding, mention versus use, reclamation, and the roles of speaker intent and audience uptake — such that settling them would move at least one camp. For each crux, give the concrete case or linguistic evidence both camps agree would bear on it, and record each camp's prediction in advance. If part of the dispute turns out to be verbal, say which part and why; do not adjudicate the underlying disagreement. Keep the entire document under 1,400 words.
