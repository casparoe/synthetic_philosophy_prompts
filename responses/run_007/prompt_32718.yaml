  ## Part 3: Blurry Distinctions & Flags

  Some leaves are logically distinct but often look the same in practice. If you land here, you aren't necessarily wrong; the field hasn't settled.

  ### 1. Computational Bayesian vs. Instrumentalist
  *   **The Blur:** Both positions refuse to specify *how* the brain implements the math.
  *   **The Difference:** It comes down to scientific realism. The **Computational** view thinks "Bayesian" is the *correct* functional description (we just lack the neural data). The **Instrumentalist** view thinks "Bayesian" is a *fiction* (like frictionless planes in physics) that helps us predict behavior but shouldn't be reified.
  *   **In Practice:** Many researchers oscillate between these depending on whether they are writing a grant (Realist) or a philosophy paper (Instrumentalist).

  ### 2. Gibsonian vs. Radical Enactivism
  *   **The Blur:** Both deny contentful representations and inferential processing. Both emphasize the environment-agent coupling.
  *   **The Difference:** **Gibsonians** focus heavily on the *optic array* and *affordances* (information is external). **Radical Enactivists** focus on *basic cognition* and *autopoiesis* (cognition is brought forth by the organism, not picked up).
  *   **In Practice:** Many modern "4E Cognition" researchers hold a hybrid view. If you deny representations but love affordances, you might sit on the line.

  ### 3. Universal FEP vs. FEP as Biological Dynamics
  *   **The Blur:** Both accept the Free Energy Principle applies to bacteria.
  *   **The Difference:** **Standard Universal FEP** claims the bacterium is doing "Bayesian Mechanics" (inference). **Biological Dynamics** claims the bacterium is just minimizing thermodynamic surprise without any "inference" or "belief" semantics attached.
  *   **In Practice:** This is a semantic fight about whether "inference" requires a mind. If you think "inference" implies a mind, you are in the Dynamics leaf. If you think "inference" is just physics, you are in the Universal FEP leaf.

