answer: |-
  # Sorting the Predictive Processing Family: A Decision Tree Handout

  **Purpose:** This tree is designed to locate your position in the current debates around Predictive Processing (PP) and the Free Energy Principle (FEP). Answer the questions based on your intuitions about specific cases (e.g., bacteria, occluded objects, tennis shots).

  ---

  ## Part 1: The Logical Space (Dimensions of Disagreement)

  Before using the tree, it helps to know *what* is being disputed. We identified five key dimensions:

  1.  **Scope:** Is this a theory of *brains* specifically, or a law of *life/matter* (including bacteria and plants)?
  2.  **Ontology:** Is the math (free energy, prediction error) a **literal description** of physical mechanisms, or just a **useful model** (instrumental)?
  3.  **Content:** Do neural states **represent** hidden causes (e.g., "there is a cup"), or are they non-contentful dynamics that just keep the organism alive?
  4.  **Action:** Is action controlled by the **same mechanism** as perception (minimizing expected free energy), or is it a separate control loop?
  5.  **Implementation:** If it is literal, is it specifically **hierarchical prediction error minimization**, or just generic Bayesian approximation?

  ### Impossible/Empty Combinations
  *   **Literal Mechanism + 'As-If':** You cannot claim neurons *literally* calculate error signals while also claiming the math is *only* a useful fiction.
  *   **Active Inference + Separate Action:** By definition, Active Inference unifies perception and action under one minimization principle.
  *   **Universal FEP + Brain-Only:** If the principle is universal (applies to bacteria), it cannot be restricted to brains.

  ---

  ## Part 2: The Decision Tree

  *Start at the top and follow the path that matches your view.*

  ### Q1: The Bacterium Test (Scope)
  **"Does the same mathematical principle that explains human perception also explain why a bacterium swims up a glucose gradient?"**

  *   **YES:** Go to **Branch A (Universal Scope)**.
  *   **NO:** (It's specific to nervous systems/cognition) Go to **Branch B (Brain Scope)**.

  ---

  ### Branch A: Universal Scope
  *You believe the Free Energy Principle applies to all self-organizing systems.*

  #### Q2: The Representation Test (Content)
  **"When the bacterium swims toward glucose, is it literally representing the location of the glucose and inferring the best path, or is it just physically coupled to the chemical gradient?"**

  *   **It is literally inferring/representing (Bayesian Mechanics):**
      *   **LEAF: Universal FEP (Standard)**
      *   *View:* All life performs Bayesian inference. Brains are just complex instances of this universal physics.
  *   **It is just physical coupling (No Inference):**
      *   **LEAF: FEP as Biological Dynamics (Non-Inferential)**
      *   *View:* The thermodynamics of FEP are real, but 'inference' is a metaphor. Systems minimize surprise without representing hidden causes. (Note: Distinct from Enactivism because it accepts the FEP formalism).

  ---

  ### Branch B: Brain Scope
  *You believe this is a theory about minds/brains, not necessarily bacteria.*

  #### Q3: The Truth Test (Ontology)
  **"When we say the brain 'minimizes prediction error', is that a physical description of what neurons are actually doing, or is it just a useful model for us to predict behavior?"**

  *   **Just a useful model ('As-If' / Functional):** Go to **Branch C (Model View)**.
  *   **A physical description (Literal):** Go to **Branch D (Mechanism View)**.

  ---

  ### Branch C: Model View
  *You think the math works, but you aren't committing to neural reality.*

  #### Q4: The Commitment Test (Truth Value)
  **"Is the Bayesian model *true* of the brain's function (we just don't know the implementation), or is it *false* but instrumentally useful?"**

  *   **True function, implementation unknown:**
      *   **LEAF: Bayesian Brain (Computational-Level)**
      *   *View:* The brain approximates Bayes. Marr's Level 2. We remain agnostic about the neural code.
  *   **False but useful fiction:**
      *   **LEAF: Instrumentalist ('As-If')**
      *   *View:* The brain doesn't actually compute probabilities. Treating it 'as-if' it does yields accurate behavioral predictions.
      *   *(Note: See "Blurry Distinctions" below for why this often overlaps with Computational Bayesian).*

  ---

  ### Branch D: Mechanism View
  *You think neurons literally implement this machinery.*

  #### Q5: The Tennis Test (Action)
  **"When a tennis player adjusts their swing mid-motion, is that adjustment driven by the same 'minimize surprise' machinery that sees the ball, or a separate motor-control system?"**

  *   **Separate system (Perception only):**
      *   **LEAF: Literal Predictive Coding**
      *   *View:* Perception is hierarchical error minimization. Action is a downstream consequence or separate control loop.
  *   **Same machinery (Perception-Action Loop):**
      *   **LEAF: Active Inference**
      *   *View:* Action is performed to minimize *expected* free energy. Perception and action are the same process viewed differently.

  ---

  ### Branch E: The Non-Inferential View
  *(Return to Q1 if you answered NO to "Is it inference?" but didn't fit the FEP formalism)*

  *You reject the idea that perception is inference, regardless of the math.*

  #### Q6: The Light Test (Information Source)
  **"When you see an object, is the information needed to perceive it already fully present in the light array (optic flow), or is perception constructed through embodied interaction?"**

  *   **Information is in the light (Pickup):**
      *   **LEAF: Gibsonian / Ecological Psychology**
      *   *View:* Direct perception of affordances. No internal models needed.
  *   **Perception is embodied sense-making (No Content):**
      *   **LEAF: Radical Enactivism**
      *   *View:* Basic cognition has no content. It is not inference, nor is it necessarily 'pickup' of information. It is direct coupling/enaction.
      *   *(Note: See "Blurry Distinctions" below).*

