answer: |-
  **JOINT STATEMENT ON THE STATUS OF FOLK PSYCHOLOGY**
  **An Adversarial Collaboration between Eliminative Materialism and Intentional Realism**

  **Date:** October 26, 2023
  **Signatories:** [Representative of Eliminative Materialism] & [Representative of Intentional Realism]
  **Purpose:** To delineate the empirical and conceptual boundaries of the debate regarding the ontological status of propositional attitudes (beliefs, desires, etc.), establishing criteria for adjudication acceptable to both parties.

  ---

  ### Section 1: Substantive Points of Agreement

  The undersigned parties, despite their divergent conclusions regarding the ultimate fate of Folk Psychology (FP), affirm the following claims as the common ground upon which the dispute rests. These are not merely definitional stipulations but substantive commitments regarding the nature of scientific inquiry and the mind.

  1.  **Causal Closure and Physicalism:** Both parties affirm that the physical world is causally closed. Any causal efficacy attributed to mental states must be realized by, or supervene upon, physical states of the central nervous system. Dualism is rejected by both sides.
  2.  **Folk Psychology as a Theoretic Framework:** Both parties agree that FP functions as a conceptual framework for predicting and explaining behavior. It posits internal states (beliefs, desires) to bridge the gap between sensory input and behavioral output. It is not merely a linguistic convenience but embodies commitments about the causal structure of the agent.
  3.  **The Authority of Neuroscience:** Both parties agree that the ultimate arbiter of the ontology of the mind is mature cognitive neuroscience. Philosophical intuition cannot override empirical data regarding how the brain actually processes information. If neuroscience demonstrates that the brain does not process information in a manner isomorphic to FP categories, FP must yield.
  4.  **The Fallibility of FP:** Both parties acknowledge that FP is not infallible. It fails to account for significant portions of human cognition (e.g., visual processing, motor control, mental pathology, sleep learning). Its domain of successful application is restricted to conscious, rational, propositional behavior.
  5.  **Criteria for Reduction vs. Elimination:** Both parties agree on the logical distinction between theoretical reduction and theoretical elimination.
      *   *Reduction* occurs when the entities of an older theory are shown to correspond systematically to entities in a newer theory (e.g., temperature to mean kinetic energy), preserving the causal roles.
      *   *Elimination* occurs when the entities of an older theory are shown to have no counterparts in the newer theory because the underlying mechanisms are structurally discontinuous (e.g., phlogiston to oxidation).
      *   The dispute is strictly about which of these two relations holds between FP and neuroscience.
  6.  **Historical Precedents are Mixed:** Both parties agree that the history of science provides precedents for *both* reduction (genes $\rightarrow$ DNA; heat $\rightarrow$ kinetic energy) and elimination (phlogiston; caloric fluid; demonic possession). The debate is not about the history of science generally, but about which historical analogy correctly maps onto the specific case of FP.
  7.  **The "Verbal" Component is Non-Trivial but Non-Dissolving:** Both parties acknowledge that the definition of terms like "belief" influences the debate. However, both agree that the dispute is not *merely* verbal. Even if the word "belief" were retired, the factual question remains: *Does the brain contain discrete, content-bearing states that causally interact according to logical/syntactic rules?* Agreement on terminology would not resolve this empirical question.

  ---

  ### Section 2: Disagreements and Cruxes

  #### Table of Disagreements

  | Point of Contention | Eliminative Materialist Position | Intentional Realist Position |
  | :--- | :--- | :--- |
  | **1. Ontological Status** | Propositional attitudes (beliefs, desires) do not exist. They are posits of a radically false theory, comparable to witches or phlogiston. | Propositional attitudes are real, causally efficacious internal states. They exist independently of our current vocabulary, comparable to genes or tectonic plates. |
  | **2. Neural Implementation** | The brain operates via distributed, vector-based transformations (connectionism). There is no neural correlate for discrete, sentence-like structures with semantic content. | The brain implements a "Language of Thought" (LOT). Neural states possess combinatorial syntax and semantics isomorphic to propositional structure. |
  | **3. Track Record of FP** | FP has been stagnant for millennia. It has not progressed, integrated with other sciences, or explained its own domain's failures (e.g., mental illness). It is a degenerating research program. | FP is robustly successful within its proper domain (rational agency). Its lack of progress on *sub-personal* mechanisms (vision, memory) is a feature, not a bug, of its level of abstraction. |
  | **4. Intertheoretic Mapping** | No smooth "bridge laws" will ever connect neurophysiology to FP. The mapping will be many-to-many and chaotic, necessitating replacement, not reduction. | Bridge laws are discoverable. Functional states will be mapped to physical states, allowing FP to be reduced to neuroscience much like thermodynamics was reduced to statistical mechanics. |

  #### Cruxes: Empirical and Conceptual Adjudicators

  The following sub-questions represent the specific points where future data could force a revision of one or both views.

  **Crux 1: The Format of Neural Representation**
  *   **Question:** Does the brain encode information in discrete, symbol-like structures (localist or combinatorial) or in distributed activation patterns across networks?
  *   **Evidence Required:** High-resolution neural imaging and decoding showing whether specific semantic contents map to specific structural neural configurations (symbolic) or to holistic state-space vectors (connectionist).
  *   **Eliminativist Prediction:** Data will show that cognitive processing is best modeled by vector transformations in high-dimensional state spaces, with no identifiable "sentence-like" neural structures.
  *   **Realist Prediction:** Data will reveal neural mechanisms that respect syntactic structure and compositionality (e.g., a neural equivalent of predicates and arguments), validating the Language of Thought hypothesis.

  **Crux 2: The Success of Artificial Cognitive Systems**
  *   **Question:** Will successful artificial general intelligence (AGI) be built on symbolic architectures or on connectionist/sub-symbolic architectures?
  *   **Evidence Required:** The architectural basis of AI systems that match or exceed human reasoning capabilities without relying on explicit FP rules.
  *   **Eliminativist Prediction:** Mature AI will be purely connectionist/deep-learning based. It will exhibit intelligent behavior without possessing internal states that correspond to human "beliefs," proving such states are unnecessary for intelligence.
  *   **Realist Prediction:** To achieve human-level flexibility and systematicity, AI will require hybrid or symbolic architectures that explicitly instantiate propositional structures, proving these structures are functionally necessary.

  **Crux 3: Intertheoretic Derivability**
  *   **Question:** Can the generalizations of FP (e.g., "If an agent desires X and believes action Y achieves X, they will tend to do Y") be derived from laws of neuroscience?
  *   **Evidence Required:** A formal demonstration that neurophysiological laws entail FP generalizations, or a formal proof that they are incommensurable.
  *   **Eliminativist Prediction:** Derivation will fail. Neuro-laws will describe dynamics that cut across FP categories, showing FP generalizations are rough-and-ready heuristics with no strict nomological backing.
  *   **Realist Prediction:** Derivation will succeed (perhaps via functional abstraction). FP generalizations will be shown to be high-level descriptions of lower-level neuro-computational processes, preserving their truth.

  ---

  ### Annotation on the "Verbal Dispute"

  **Issue:** A significant portion of the apparent disagreement stems from the definition of "belief."
  *   The **Eliminativist** tends to define "belief" strictly as a *classical, sentence-like, functionally discrete internal representation*. Under this definition, if the brain is connectionist, beliefs do not exist.
  *   The **Realist** tends to define "belief" more broadly as a *dispositional state that plays a specific causal role in behavior*, regardless of the specific neural implementation. Under this definition, even if the brain is connectionist, beliefs exist as functional kinds.

  **Why this does not dissolve the disagreement:**
  If the dispute were purely verbal, the parties could agree on all physical facts and simply choose different words. However, the dispute is not merely about the label "belief." It is about the **causal structure of cognition**.
  1.  **Systematicity:** If the Realist is correct, the brain *must* support systematic cognitive abilities (if you can think "John loves Mary," you can think "Mary loves John"). If the Eliminativist is correct, this systematicity is an illusion or a byproduct of statistical similarity, not a structural constraint.
  2.  **Causal Efficacy:** If the Eliminativist is correct, citing a "belief" in an explanation is like citing "phlogiston"—it points to nothing real in the causal chain. If the Realist is correct, citing a "belief" identifies a real node in the causal network, even if the vocabulary changes.

  Therefore, while clarifying definitions reduces heat, the core disagreement remains empirical: **Is the architecture of the human mind isomorphic to the structure of Folk Psychology, or is it fundamentally alien to it?** Both sides agree that neuroscience must answer this, and both sides have staked their positions on specific predicted outcomes.
