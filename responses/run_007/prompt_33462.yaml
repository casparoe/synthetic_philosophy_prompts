answer: |-
  Dear Friend,

  I have been thinking deeply about your questions regarding governance systems and the promises of futarchy, specifically the claim that separating value judgments from factual predictions can optimize social outcomes. You asked for a concrete scenario where this separation fails structurally, even under ideal conditions, so I have constructed a thought experiment set in a small housing cooperative called the Elm Street Co-op. Imagine a community of fifty resident-owners who share ownership of the buildings and the surrounding land, including a central courtyard garden that has been the social heart of the community for thirty years. The co-op faces a pressing financial crisis due to unexpected structural repairs and rising insurance premiums, requiring them to raise a significant sum of money quickly to avoid insolvency. In the spirit of rational governance, the members decide to adopt futarchy. They hold a democratic deliberation to choose a welfare metric that will guide their decisions, agreeing unanimously on a measure they believe captures their collective well-being: the sum of Individual Equity Value and Resident Safety Scores. This metric was chosen in good faith, with full transparency, under the assumption that financial stability and physical security are the primary constituents of their welfare during a crisis.

  Once the metric is set, the proposal phase begins, and three distinct policies are submitted to the prediction market. The first policy is a special assessment, requiring each member to pay a lump sum from their savings. The second is a substantial increase in monthly dues over ten years. The third policy, proposed by a financially savvy but socially tone-deaf member, involves selling the central courtyard garden to a commercial developer to build a secure parking structure, the revenue from which would not only cover the repairs but create a surplus reserve, while the new structure includes advanced security gating. The prediction market, which we are assuming is perfectly accurate and well-calibrated, evaluates these policies against the chosen metric. It correctly predicts that the special assessment will lower equity values due to immediate cash outflow and cause some stress. It predicts the dues increase will stabilize equity but slowly erode it over time. However, the market predicts with certainty that the third policy, selling the garden, will maximize the metric significantly. The cash surplus boosts Individual Equity Value to record highs, and the secure gating maximizes the Resident Safety Score. Because the market is perfect, it knows these numerical outcomes will occur. Consequently, futarchy selects the third policy.

  Now consider what would have happened under traditional majority voting on policies. In that scenario, members would evaluate the policies holistically, bringing their full range of values to bear on the specific proposals before them. When confronted with the concrete reality of selling the garden, every single member would realize that the garden holds sentimental and communal value that was not captured in the ex ante metric of Equity and Safety. They would recognize that a co-op without a shared communal space violates the very spirit of their association, turning their homes into mere financial assets rather than a community. In a direct vote, every single member would vote against the garden sale, preferring either the assessment or the dues increase, because upon seeing the specific tradeoff, they unanimously agree that the loss of the garden is unacceptable regardless of the financial gain. Thus, we have a situation where the prediction market worked perfectly, the metric was chosen democratically and in good faith, yet the outcome is unanimously regarded as worse than what majority voting would have produced. The failure is not in the math or the market, but in the assumption that values can be fully specified before policies are known.

  The exact feature that causes this divergence is the context-dependence of value weights. When the members voted on the metric, they assigned weights to Equity and Safety based on an imagined set of normal policies, such as fixing roofs or hiring guards. They did not anticipate a policy that would achieve those goals by liquidating the community's soul. Their valuation of the garden was latent; it only became salient when a specific policy threatened it. In economic terms, the utility function is not stable across the choice set; it changes depending on the nature of the options presented. Futarchy assumes that the welfare metric is a fixed target that policies aim at, but in reality, humans often discover what they value only when confronted with the specific means proposed to achieve those values. The metric was too coarse to capture the deontological constraint against selling communal heritage, not because the members were irrational, but because that constraint was not relevant until the specific policy made it relevant.

  A natural reply from a futarchist would be to argue that the members simply chose a bad metric and should have included a term for Communal Space Preservation or Social Cohesion. However, this reply leads to an infinite regress or begs the question. If they include Social Cohesion in the metric, they must define how to measure it. If they measure it by survey, the prediction market might correctly predict that members will adapt to the loss of the garden over time and report high cohesion due to the financial relief, still leading to the sale. If they measure it by the existence of the garden, they have effectively hardcoded a policy constraint into the metric, which collapses futarchy back into direct voting on policies. To specify a metric that avoids this failure, the members would need to know in advance which policies will be proposed and how those policies will interact with their latent values. But if they need to know the policies to set the metric, they might as well vote on the policies directly. The demand for a better metric assumes that values can be fully articulated independent of the means, which is precisely what the thought experiment disproves.

  This thought experiment reveals that the deepest limitation of futarchy is its reliance on the separability of ends and means. It assumes that we can agree on what is good without knowing how it might be achieved, but human values are often constituted by the methods used to pursue them. We do not just want safety; we want safety achieved in a way that respects our freedom. We do not just want equity; we want equity that does not require betraying our neighbors. When a governance system separates the definition of welfare from the selection of policies, it blinds itself to the moral texture of the policies themselves. This limitation is not unique to futarchy but applies to any system that tries to rigidly separate values from policy choice, including certain forms of technocratic utilitarianism. However, futarchy is uniquely vulnerable because it institutionalizes this separation, giving the market the authority to ignore any value that was not successfully quantified in the initial metric phase. In the end, the Elm Street Co-op learns that while markets are excellent at finding truths about the world, they are poor at preserving truths about us that we have not yet thought to write down.

  Warmly,

  Your Colleague
