answer: |-
  **JOINT STATEMENT ON STATUTORY INTERPRETATION**
  **Annual Jurisprudence Workshop | Adversarial Collaboration**
  **Signatories:** [Name], Proponent of Textualism; [Name], Proponent of Purposivism
  **Date:** October 26, 2023

  ### I. AGREED CLAIMS

  We, the undersigned, affirm the following propositions as a shared foundation for our ongoing debate. We accept these claims without reservation, acknowledging that our divergence occurs *within* the space created by these agreements, not outside of it.

  1.  **The Objective of Interpretation:** The primary aim of statutory interpretation is to ascertain and apply the law established by the legislature, not to substitute the court's view of optimal policy. Both of us reject the notion that judges are free to update statutes based on contemporary moral preferences absent textual warrant.
  2.  **The Canonical Easy Cases:** We agree that in a substantial majority of cases (estimated by both sides at >80%), the text and the purpose yield the same result. In these cases, the methodological dispute is inert. We further agree on the classification of specific canonical examples (e.g., *Green v. Bock Laundry Machine Co.*) as "easy" cases where both text and purpose clearly align.
  3.  **The Genuinely Hard Cases:** We agree on the classification of specific cases as "hard" (e.g., *Holy Trinity Church*, *Bostock v. Clayton County*). We agree that in these instances, the semantic meaning of the text and the inferred purpose of the statute point in divergent directions. Our disagreement is not about *whether* these cases are hard, but about *how* to resolve them.
  4.  **Institutional Structure:** We agree that the Constitution vests legislative power in Congress and judicial power in the Courts. We agree that this structure prohibits judges from rewriting statutes to fix perceived drafting errors if doing so requires assuming legislative function. We also agree that the legislative process is imperfect, characterized by compromise, incomplete information, and strategic ambiguity.
  5.  **Acknowledged Limits and Concessions:**
      *   **The Textualist Concession:** The Textualist concedes that the Purposivist is correct that words cannot be interpreted in a vacuum; context is necessary to fix semantic meaning. The Textualist further concedes that a rigid adherence to dictionary definitions that leads to results demonstrably contrary to the statutory scheme's coherence risks undermining the legislature's actual achievement.
      *   **The Purposivist Concession:** The Purposivist concedes that the Textualist is correct that "purpose" is not a free-floating license for judicial discretion. The Purposivist agrees that purpose must be tethered to the enacted text and that reliance on unenacted legislative history (e.g., floor speeches by non-sponsors) carries significant epistemic risk and democratic legitimacy concerns.

  ---

  ### II. TABLE OF DISAGREEMENTS

  The following table isolates the specific points of divergence. For each point, we have articulated the positions in language each signatory endorses. We have then identified the **Crux**: the specific empirical or conceptual sub-question that, if resolved, would compel at least one of us to revise our position.

  | Point of Divergence | Textualist Position | Purposivist Position | The Crux (Specific Sub-Question) | Evidence/Argument Bearing on the Crux | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of Legislative History** | Committee reports and floor debates are not law. They are unreliable indicators of the "deal" struck because they are often manipulated by staff or lobbyists after the vote. Using them allows judges to cherry-pick evidence to support preferred outcomes. | Legislative history is essential context. Statutes are not drafted in a vacuum; reports explain the "mischief" the law addresses. Ignoring them forces judges to guess at purpose based solely on text, which is often under-inclusive. | **Epistemic Reliability:** Does the consultation of legislative history *increase* or *decrease* the accuracy of judicial identification of the legislative compromise, compared to text-only analysis? | A controlled empirical study where legal experts attempt to identify the "compromise intent" of mock statutes using (A) Text only, and (B) Text + History, with the "true intent" verified by the drafters. | **Textualist:** Group A will be more accurate; history introduces noise and manipulation.<br>**Purposivist:** Group B will be more accurate; text alone is too ambiguous to identify the specific compromise. |
  | **2. Unanticipated Applications** | If the text clearly covers a scenario the legislature did not anticipate, the court must apply it. To do otherwise is to update the law, which is the legislature's job. The "absurdity doctrine" is reserved only for results that are logically impossible or constitutionally forbidden, not merely unwise. | If a scenario was unanticipated, the court must ask: "Would the legislature have wanted this result given the statute's purpose?" If the answer is no, the text should be narrowed. Fidelity to the *design* matters more than fidelity to the *words* in edge cases. | **Counterfactual Authority:** Do judges have the institutional competence to reliably reconstruct counterfactual legislative intent ("what they *would* have done") without crossing into legislation? | Analysis of legislative reactions: In cases where courts narrowed text based on unanticipated applications, how often did the legislature subsequently *ratify* the court's narrowing vs. *overturning* it? | **Textualist:** Legislatures will frequently overturn these rulings, proving the courts guessed wrong about the counterfactual.<br>**Purposivist:** Legislatures will rarely act, implying tacit ratification that the court correctly identified the statutory boundary. |
  | **3. Ordinary Meaning vs. Technical Context** | "Ordinary meaning" is the default. If a term has a settled public meaning at the time of enactment, that meaning controls unless the statute explicitly defines it otherwise. This ensures citizens can read the law and know what it means. | "Ordinary meaning" is often a fiction in complex regulatory schemes. Terms should be interpreted in light of the technical problem the statute solves. A "vehicle" in a park ban might include bicycles if the purpose is noise reduction, even if the public meaning is ambiguous. | **Audience Reliance:** Who is the relevant "reader" of the statute for whom predictability is designed: the ordinary citizen or the regulated entity/legal counsel? | Survey data on reliance interests: Do regulated entities rely more on the plain text of statutes or on agency guidance/case law interpreting the purpose when planning compliance? | **Textualist:** Reliance is on the text; citizens cannot afford to litigate purpose.<br>**Purposivist:** Reliance is on the regulatory scheme; counsel always investigates purpose/context regardless of text. |

  ---

  ### III. HOUSEKEEPING: VERBAL AND NORMATIVE DISTINCTIONS

  We suspect that a portion of our long-running dispute is attributable to terminological imprecision or divergent normative priors rather than substantive legal theory. We flag the following distinctions to prevent talking past one another.

  #### A. Verbal Disputes (Terminological Operationalization)
  *We agree that the following disagreements reduce to definitions. Once operationalized as below, these are no longer substantive disputes.*

  1.  **"Legislative Intent"**
      *   *Disagreement:* The Purposivist often speaks of "intent" as if it were a psychological state of the collective body. The Textualist rejects this as a fiction.
      *   *Operationalization:* We agree to use "Intent" solely as a shorthand for **"The public meaning of the text as understood in the context of the problem the legislature was addressing."** If the Purposivist uses "intent" to mean "psychological state," the Textualist objects. If the Purposivist uses it to mean "objective purpose derived from context," the Textualist accepts the term but prefers "Purpose."
  2.  **"Plain Meaning"**
      *   *Disagreement:* The Textualist is often accused of looking only at dictionaries. The Purposivist is accused of ignoring text.
      *   *Operationalization:* We agree that "Plain Meaning" includes **contextual semantic meaning**, not just dictionary definitions. The Textualist agrees context matters for meaning; the Purposivist agrees context cannot override clear semantic bounds. The dispute is not *whether* context matters, but *which* context (public usage vs. legislative history) is admissible to establish it.

  #### B. Normative Disputes (Value Judgments)
  *We agree that the following disagreements are not conceptual or empirical, but normative. No amount of empirical evidence will resolve these; they represent different weightings of democratic values.*

  1.  **Predictability vs. Fidelity to Design**
      *   *The Conflict:* In hard cases, the Textualist prioritizes **Predictability** (citizens can rely on the text as written). The Purposivist prioritizes **Fidelity to Design** (the law should achieve the goal the legislature set, even if the text is imperfect).
      *   *Normative Premise:* The Textualist values the *Rule of Law* (formal notice) higher than optimal outcomes in edge cases. The Purposivist values *Democratic Representation* (effectuating the will of the majority) higher than formal notice in edge cases.
  2.  **The Role of the Judge in a Democracy**
      *   *The Conflict:* The Textualist views the judge as a **Faithful Agent** who must not risk usurping legislative power, even if it leads to a "bad" result that Congress could easily fix. The Purposivist views the judge as a **Cooperative Partner** who helps perfect the legislative scheme to avoid requiring constant legislative correction.
      *   *Normative Premise:* This turns on the view of legislative capacity. The Textualist assumes Congress *can* and *should* fix errors. The Purposivist assumes Congress is often gridlocked, and judicial flexibility is necessary to prevent statutory obsolescence.

  ---

  **Conclusion**
  This document serves as our working map. We agree that progress will not be made by restating our general theories, but by addressing the **Crux** questions in Section II. We commit to reviewing the empirical predictions listed therein as new data becomes available.
