      *   **Goal:** Not a compromise, but a precise map of agreement, divergence, and conditions for changing minds.
      *   **Structure Requirements:**
          1.  Opening: Numbered list of agreed claims (goals of interpretation, easy/hard cases, institutional structure, limits of opposing views).
          2.  Disagreements Table: Point of disagreement, Textualist position, Purposivist position, The Crux (specific sub-question), Evidence/Argument that bears on it, Predictions from each side.
          3.  Housekeeping: Flag verbal disputes (terminology) and normative disputes (values/roles).
      *   **Tone:** Neutral facilitator, honest rendering of positions (each side recognizes their own view), precise, not mushy.

  2.  **Deconstruct the Positions (Textualism vs. Purposivism):**
      *   *Textualism:* Focus on the ordinary meaning of the words at the time of enactment. Law is what is written. Legislative history is generally irrelevant or secondary. Predictability and rule of law are key. Judges shouldn't guess intent.
      *   *Purposivism:* Focus on the purpose behind the law. What was the mischief the legislature sought to remedy? Legislative history is crucial. Flexibility to handle unanticipated cases. Fidelity to the legislative design/goal.
      *   *Common Ground:* Both believe in judicial restraint (mostly), both respect the text (though differently), both acknowledge some cases are easy and some hard, both want to serve the rule of law (defined differently).

  3.  **Drafting - Section 1: Agreed Claims (The Common Ground):**
      *   Need numbered claims both sign without reservation.
      *   *Claim 1 (Goal):* Interpretation aims to apply the law, not make it.
      *   *Claim 2 (Easy Cases):* Most cases are clear regardless of method.
      *   *Claim 3 (Hard Cases):* Ambiguity exists; classification of "hardness" is agreed upon.
      *   *Claim 4 (Institutions):* Legislature makes law, Courts apply it. Constitution sets bounds.
      *   *Claim 5 (Concessions):* Textualists admit purpose matters for ambiguity; Purposivists admit text constrains purpose.

      *Refining the language:* Make it sound like legal philosophy. Use terms like "semantic content," "institutional competence," "constraint."

  4.  **Drafting - Section 2: Disagreements Table (The Core):**
