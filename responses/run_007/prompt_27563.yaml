          *   Purposivist: Purpose limits scope.
          *   Crux: Counterfactual intent vs. Actual enactment.
          *   Evidence: How legislatures react to judicial "corrections."
      *   *Point 3: Ordinary Meaning vs. Technical Meaning.*
          *   Textualist: Ordinary public meaning.
          *   Purposivist: Contextual/Technical meaning fitting the scheme.
          *   Crux: Who is the relevant audience?
          *   Evidence: Corpus linguistics data vs. Legislative drafting manuals.

      *Refining the "Crux":* This is the most important part. It must be the *specific* question that, if answered, shifts the view.
      *Refining "Predictions":* What do they expect the evidence to show?

  5.  **Drafting - Section 3: Housekeeping (Verbal & Normative):**
      *   *Verbal:* "Intent" (psychological state vs. objective purpose), "Plain Meaning" (Dictionary vs. Contextual).
      *   *Normative:* Democracy (Accountability vs. Representation), Stability (Predictability vs. Justice in application).

