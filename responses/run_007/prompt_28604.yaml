      *   **Language:** American English.

  2.  **Deconstruct the Film's Ending (Ethical Landscape):**
      *   *Maggie's Position:* Severe spinal injury (C1-C2), ventilator dependent, losing limbs to infection, sees her life as over/undignified. She wants control. (Autonomy, Quality of Life).
      *   *Frankie's Position:* Devout Catholic, initially refuses, visits priest (who condemns it), visits Maggie (who bites her tongue to prove commitment), finally agrees. (Sanctity of Life, Duty of Care, Love).
      *   *The Act:* Unplugging the ventilator (passive?) + Biting the mouthpiece/Injection (active?). *Correction:* In the film, he unplugs the ventilator, but to ensure death/speed it up and prevent panic, he administers a massive dose of adrenaline (epinephrine). This is active euthanasia.
      *   *The Aftermath:* Frankie disappears. He is a fugitive morally/legal ly, but spiritually redeemed in his own eyes (or at least at peace).

  3.  **Address the Specific Ethical Debates:**

      *   **Autonomy vs. Sanctity of Life:**
          *   *Film:* Maggie's autonomy is absolute. She refuses food, bites her tongue. The film validates her assessment that her life is no longer worth living *for her*.
          *   *Counter:* The priest represents the institutional view (Sanctity of Life). Frankie's internal struggle represents the personal moral weight.
          *   *Simplification:* The priest is a caricature (stern, unyielding). Real pastoral care might be more nuanced. Maggie's family is depicted as vultures, removing the "family objection" angle often found in real cases.

      *   **Active Killing vs. Letting Die:**
          *   *Film:* Frankie unplugs the machine (letting die) but gives the adrenaline shot (killing).
          *   *Philosophy:* The Doctrine of Double Effect. Is the intent to relieve suffering or cause death?
          *   *Nuance:* The film blurs this. He does both. It suggests the distinction might be moot in the face of mercy.

      *   **"Giving Up" vs. Mercy:**
          *   *Film:* Scrap (Morgan Freeman) narrates that Frankie did the right thing. The alternative was Maggie being eaten alive by infection and her greedy family.
          *   *Risk:* Does the film suggest disabled life is inherently undignified? This is a major disability rights critique.

      *   **Emotional Intelligibility vs. Moral Rightness:**
          *   *Film:* It doesn't necessarily argue it's *legal* or *theologically* right, but it argues it was an act of *love*. "Mo Chuisle" (My Darling).
          *   *Commitment:* It leans heavily towards justification through love, bypassing rigid moral frameworks.

  4.  **Identify Concrete Moments for Discussion:**
      *   The Priest Scene (Frankie seeking absolution/guidance).
      *   The Tongue-Biting Scene (Maggie proving seriousness).
      *   The Family Visit (Maggie's biological family wanting money vs. Frankie wanting her well-being).
      *   The Final Act (The injection/unplugging).
      *   The Epilogue (Frankie's disappearance).

  5.  **Address "What Philosophy Flattens":**
      *   Philosophy deals in principles (Autonomy, Utility).
      *   Film deals in *relationship*. The specific bond between Frankie and Maggie (father/daughter surrogate) changes the ethics. It's not a doctor/patient transaction; it's a personal sacrifice.
      *   The sensory experience of suffering (the smell of rot, the silence of the room).

