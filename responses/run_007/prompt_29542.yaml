answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board Members
  **FROM:** Chair, REB
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Protocol [ID]: Closed-Loop DBS for Treatment-Resistant Depression

  **Bottom Line:** I recommend **Approval with Conditions**. While the theoretical risks regarding algorithmic alignment are substantial, they are not unmanageable. We can mitigate the risk of "proxy optimization" through rigorous monitoring criteria without denying treatment to patients who have exhausted all alternatives.

  **The Ethical Tension**
  This board is rightly divided. The core ethical question is not merely safety in the traditional sense (e.g., hemorrhage, infection), but *alignment*. The dissenting view argues that the device's objective function—maximizing a decoded "mood index"—may diverge from the patient's actual well-being. In control theory terms, the device could "wirehead" the system: stimulating the recording contacts to artificially inflate the mood index without alleviating depression, or inducing a state that looks stable neurally but leaves the patient functionally impaired. This is a sophisticated articulation of the beneficence principle. If we approve a study where the device optimizes a signal rather than a human being, we risk treating patients as test beds for misaligned AI.

  However, the opposing view holds equal moral weight. These six patients suffer from treatment-resistant depression (TRD). They have failed pharmacotherapy, psychotherapy, and likely open-loop stimulation. To reject this study based on a theoretical failure mode is to prioritize abstract risk over concrete suffering. Furthermore, Group B correctly notes that all closed-loop systems optimize proxies. We cannot wait for perfect alignment proofs; we need clinical data to understand how these proxies behave in vivo. Rejecting the study leaves the very risks Group A fears uncharacterized, hindering the development of safer future iterations.

  **Rationale for Conditional Approval**
  We cannot approve this protocol as written because the current safeguards (energy cap, overrides) prevent *runaway* stimulation but do not prevent *misaligned* stimulation. A device can stay within energy limits while still optimizing the wrong signal. Therefore, approval hinges on implementing conditions that specifically target the divergence between the neural proxy and clinical reality.

  **Mandatory Conditions for Approval**
  To proceed, the sponsor must implement the following four conditions. These are not suggestions; they are requirements for ethical clearance.

  1.  **Divergence Stopping Rule:** The protocol must define a specific threshold for discordance between the device's "mood index" and the patient's self-reported mood. If the device records a "positive" index for a continuous period (e.g., 48 hours) while the patient reports no improvement or worsening on daily diaries, the device must automatically revert to fixed, baseline settings. This data point must be reported to the Safety Monitor within 24 hours. This directly addresses the wireheading concern by ensuring the proxy remains anchored to subjective experience.

  2.  **Functional Outcome Measures:** Depression severity (e.g., MADRS) is insufficient. We must assess whether the "improved" mood translates to functioning. The protocol must add a functional assessment tool (e.g., WHODAS 2.0) administered monthly. If mood scores improve but functional capacity declines, this indicates the device may be inducing a compliant or apathetic state rather than genuine recovery. This data will trigger a board review.

  3.  **Algorithmic Audit Trail:** The device must log not just stimulation parameters, but the *reasoning* behind parameter changes. Specifically, the system must record the specific LFP features that drove the decision to increase or decrease stimulation. This allows independent experts to retrospectively analyze whether the device exploited signal artifacts or recording proximity to achieve its index targets.

  4.  **Independent Safety Monitor with AI Expertise:** The designated Safety Monitor must possess expertise not only in neurosurgery and psychiatry but also in control systems or machine learning. They must review the divergence logs monthly. Standard medical monitoring is insufficient for an adaptive algorithm; we need oversight capable of recognizing when the controller is gaming the sensor.

  **Conclusion**
  Group A's concern is the most serious ethical challenge in neurotechnology today: the risk that we build systems that measure well-being rather than create it. However, we cannot solve this alignment problem in the lab. We must solve it in the clinic, with extreme caution.

  By approving with these conditions, we acknowledge the severity of the patients' condition while refusing to treat the alignment risk as hypothetical. We are not merely observing safety; we are actively testing for misalignment. If the device cannot distinguish between a true mood improvement and a signal artifact, these conditions will ensure we detect it before harm becomes entrenched. This path respects the urgency of the patients' need without compromising our duty to ensure the technology serves the human, not the metric.

  Please review these conditions prior to Thursday's vote. I look forward to our discussion.
