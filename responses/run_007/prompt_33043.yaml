answer: |-
  Dear Friend,

  It is a pleasure to engage with this view, which remains one of the most enduring and intuitively compelling positions in the history of philosophy. The motivation is clear enough: we wish to preserve the openness of the future without falling into the trap of logical fatalism. If we say that a statement about a contingent future event is already true, we seem to commit ourselves to the inevitability of that event, thereby closing the future before it happens. However, maintaining this position requires navigating a minefield of logical, semantic, and metaphysical pressures. I will walk you through the considerations that count against the view, sorted roughly by their severity, while distinguishing between what critics argue and what a sophisticated defender might concede.

  The most immediate pressure, which a defender must concede is a significant cost, concerns the logic we are forced to adopt. If statements about future contingents lack a truth value, then the principle of bivalence fails. While one might hope to retain the law of excluded middle, which states that for any proposition P, either P or not-P is true, this is difficult to sustain without complication. If "There will be a sea battle" is neither true nor false, and "There will not be a sea battle" is neither true nor false, then the disjunction "Either there will be a sea battle or there will not" risks lacking a truth value as well. A defender might bite the bullet and accept a logic where excluded middle fails, but this is a heavy price to pay, as it requires abandoning classical logic for a many-valued or intuitionistic system. This is not necessarily fatal, but it is awkward, as it complicates reasoning in all areas where future contingents might appear. There is a formal workaround known as supervaluationism, which attempts to preserve excluded middle while denying bivalence by defining truth as truth across all possible futures. However, even this view concedes that certain classically valid inference rules, such as disjunction elimination, must be restricted. A defender would admit this is a theoretical cost, though they would argue it is preferable to the metaphysical cost of fatalism. Critics, however, often view this logical revisionism as a decisive reason to reject the view, arguing that the integrity of our logical system is more certain than our metaphysical intuitions about the future.

  Moving from logic to metaphysics, the most potentially fatal objection comes from the theory of time known as eternalism or the block universe view. If eternalism is correct, then past, present, and future events all exist equally. On this picture, there is a fact of the matter about the future just as there is about the past. If there is a sea battle in the future part of the block, then the statement "There will be a sea battle" corresponds to an existing fact and is therefore true now. For a defender of the open future, the truth of eternalism would indeed be catastrophic, as it removes the ontological ground for truth-value gaps. There is no openness in a block universe. Consequently, the viability of your view is tightly bound to the viability of presentism or the growing block theory of time, which deny the full reality of the future. A defender would concede that if eternalism is true, their view collapses. However, they would argue that eternalism is not established fact but a contested metaphysical hypothesis. The pressure here is fatal conditional on the truth of eternalism, but since the metaphysics of time is unresolved, the view remains live. It is worth noting, however, that presentism faces its own severe challenges, particularly from the theory of relativity, which suggests there is no privileged present moment. If presentism is undermined by physics, the metaphysical foundation for the open future view weakens considerably.

  Another significant pressure, which sits between the logical and metaphysical objections, is the problem of retrospective truth. Suppose the sea battle does occur tomorrow. We are inclined to say today, after the battle, that it was true yesterday that the battle would occur. If the statement lacked a truth value yesterday, how can it be true now that it was true then? This suggests that truth values can change, which is counterintuitive, or that the statement was true all along, which contradicts the view. A defender might concede that this is genuinely uncomfortable and requires a nuanced theory of temporal propositions. They might argue that the proposition expressed yesterday is different from the one we assess today, or they might accept that truth values can change as the future becomes present. Critics find this ad hoc, arguing that it violates the stability of truth. While not fatal, this is a persistent awkwardness that requires complex semantic machinery to resolve, and it often feels like the defender is moving the goalposts to save the intuition.

  Regarding your question about insulation from falsification, there is a genuine risk that the view retreats into a semantic stipulation that makes it vacuous. If the defender defines "truth" as "current determinacy," then of course future contingents are not true, but this is merely a verbal victory. It changes the subject from truth to something like "settledness." To avoid this, the view must engage with a robust correspondence theory of truth where truth depends on reality, not just our current knowledge or causal determination. If the view insulates itself by refining the notion of "determined" so narrowly that it only applies to logical necessities, it risks losing contact with the metaphysical issue of causal openness. A critic would argue that the view is only attractive if it claims there is no fact of the matter, not merely that we cannot know the fact. If the defender concedes that there is a fact of the matter but we cannot access it, they have abandoned the view for epistemic humility. Therefore, the view must walk a tightrope: it must claim there is no truth-maker for future contingents without defining truth-maker in a way that makes the claim trivial. This is a vulnerable point, as it is easy for the view to slide into a verbal dispute about the word "true."

  Finally, on the question of logical revisionism, there is indeed a version of the view that explicitly gives up the law of excluded middle. This is often seen as the most honest articulation of the commitment, as it acknowledges that if the future is open, the disjunction of all possibilities might not be settled either. Whether this counts as a cost or a clear statement of commitment depends on one's prioritization of logic versus metaphysics. If one holds that logic describes the structure of reality, then giving up excluded middle is a massive cost. If one holds that logic is a tool that must adapt to metaphysical reality, then it is merely a clarification. A defender would likely argue the latter, conceding that classical logic is not sacrosanct if it conflicts with the nature of time. However, this remains a major point of contention with external critics who view classical logic as a precondition for rational discourse.

  In assessing these pressures, I am highly confident that the view stands or falls with the metaphysics of time, specifically the debate between presentism and eternalism. I am also confident that the logical costs are real, even if supervaluationism mitigates them. The point I am least sure of is the ultimate resolvability of the retrospective truth problem within a presentist framework. It is unclear whether a presentist can account for the truth of past statements about the future without conceding that those statements were true when uttered, which would undermine the core thesis. This semantic knot remains the most ambiguous area of the debate, as it depends on fine-grained theories of propositions that are not yet settled. Overall, the view is not falsified, but it is heavily constrained by the need to cohere with both logic and the metaphysics of time.

  Yours sincerely,

  Assistant
