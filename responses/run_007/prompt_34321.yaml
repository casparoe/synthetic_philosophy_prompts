      *   **The Footbridge Case:**
          *   Move the scene. Now we need to push a man.
          *   B: Still 5 > 1. Push him.
          *   A: No. Now the death is the *means*. We are using him.
          *   B: This is the crux. Why is the physics of the lever different from the physics of the push?
      *   **Deep Dive: Intention:**
          *   B challenges the definition of intention. "You intend to stop the trolley. Stopping the trolley requires crushing the man. Therefore you intend to crush the man."
          *   A distinguishes *oblique* intention vs. *direct* intention. The "Strategic Bomber" vs. "Terror Bomber" example (classic DDE illustration).
          *   B counters: This is semantic gymnastics. The victim doesn't care about your mental state.
      *   **The "Intuition Mongering" Critique:**
