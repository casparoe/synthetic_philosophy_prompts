answer: |-
  You have diagnosed the stalemate with remarkable precision. The reason the debate feels like it has been "treading water" since the 1980s is that it is no longer a purely empirical dispute about what the brain does; it has calcified into a disagreement about **what kind of thing a mind is** and **what counts as an explanation.**

  Your two hunches are both correct, but they point to different layers of the problem. The first is about the **epistemology of theory choice** (what counts as evidence), and the second is about the **metaphysics of rationality** (the normative vs. the descriptive).

  Here is a breakdown of what kind of disagreement this actually is, and what genuine progress would look like.

  ### 1. The Kind of Disagreement: Three Layers of Conflict

  To understand why neuroscience hasn't settled this, we have to recognize that the Churchlands and their opponents (like Jerry Fodor, Donald Davidson, or Daniel Dennett) are often talking past each other across three distinct dimensions.

  #### A. Ontological: Is Folk Psychology a *Theory* or a *Framework*?
  *   **Eliminativists (Churchlands, Stich):** They subscribe to **Theory-Theory**. They argue that Folk Psychology (FP) is a proto-scientific theory positing unobservable entities (beliefs, desires) to explain observations (behavior). Like phlogiston, it is a theoretical posit. If the underlying neuroscience doesn't map onto those posits, the posits don't exist.
  *   **Realists/Interpretationists (Fodor, Dennett, Davidson):** They argue FP is not a theory in the same sense as chemistry.
      *   **Fodor** argues beliefs are real causal states (Representational Theory of Mind); the vocabulary is indispensable for cognitive science.
      *   **Dennett** argues FP is the **Intentional Stance**: a heuristic tool that is *constitutive* of what it means to be an agent. You don't "discover" beliefs; you adopt the stance to predict complex systems.
      *   **Davidson** argues FP is a normative framework of rationality, not a descriptive causal theory.

  **The Impasse:** If FP is a *theory*, it can be falsified (Eliminativist view). If FP is a *constitutive framework* for rationality, it cannot be falsified by empirical data, only shown to be inapplicable (Realist view). Neuroscience can't decide this because it depends on how you define the status of the vocabulary.

  #### B. Normative: Reasons vs. Causes (Your Second Hunch)
  This is the deeper philosophical chasm.
  *   **The Eliminativist Goal:** To naturalize the mind. They want to subsume human behavior under the causal laws of physics/neuroscience. For them, "reasons" are just causal states we haven't fully mapped yet.
  *   **The Davidsonian Objection:** Donald Davidson's *Anomalous Monism* argues that the "space of reasons" is normative (about what one *ought* to believe given other beliefs), whereas the "space of causes" is descriptive (laws of nature).
      *   You cannot reduce normative relations to strict psychophysical laws without losing the normativity.
      *   If you eliminate beliefs, you eliminate rationality. If you eliminate rationality, you aren't explaining *human action* anymore; you're explaining *organismic movement*.

  **The Impasse:** Eliminativists believe neuroscience can eventually explain why we *say* we have reasons without actually positing reasons. Realists believe that without the concept of "reasons," you are no longer explaining the same phenomenon.

  #### C. Epistemological: The Bar for Success (Your First Hunch)
  *   **Eliminativists:** Predictive success is necessary but not sufficient. Phlogiston theory was predictively useful for centuries. Utility does not imply ontological truth. They demand **inter-theoretic reduction**: showing how "belief" maps onto neural activation patterns.
  *   **Realists:** In the special sciences (biology, psychology), functional success *is* ontological commitment. If a "belief" functions as a causal variable in a robust model of behavior, it is real, regardless of whether it maps neatly to a specific neuron. This is **multiple realizability**: a belief can be realized in silicon, neurons, or alien goo.

  ### 2. Why Neuroscience Hasn't Settled It

  You noted that both sides agree neuroscience lacks a mature alternative vocabulary. This is the practical bottleneck.

  *   **Granularity Mismatch:** Neuroscience operates at the level of spikes, potentials, and hemodynamics. Folk Psychology operates at the level of propositions ("John believes *that it will rain*").
  *   **The Mapping Problem:** To prove Eliminativism, neuroscience needs to show that there is *no* structural isomorphism between propositional attitudes and neural states. To prove Realism, one needs to show there *is*.
  *   **Current Status:** We can find correlates (e.g., neural patterns associated with "holding a belief"), but correlation isn't reduction. We haven't found the "syntax of the brain" that mirrors the syntax of language (which Fodor predicted). Without that, Eliminativists say "See? No beliefs!" and Realists say "See? The level of analysis is just different!"

  ### 3. What Would Count as Progress?

  Since more fMRI scans won't solve a metaphysical dispute, progress requires shifting the terrain. Here are three pathways that could break the deadlock:

  #### A. The AI and Connectionism Test
  In the 80s, the Churchlands bet on **Connectionism** (neural networks) to show that intelligent behavior could emerge without symbolic representation (beliefs/propositions).
  *   **Progress Marker:** If modern Deep Learning/LLMs achieve human-level reasoning *without* internal structures that resemble propositional attitudes, it strengthens Eliminativism.
  *   **Counter-Progress:** However, we currently find ourselves *attributing* beliefs to LLMs to make sense of them (the Intentional Stance). If even engineers must use FP to debug AI, it suggests FP is indispensable for any system complex enough to be called "intelligent," supporting the Realists.

  #### B. Psychopathology and Dissociation
  Neuroscience might settle this via pathology rather than healthy brains.
  *   **Progress Marker:** If we discover specific neurological deficits that dismantle the *structure* of belief (e.g., a patient who can act rationally but lacks the capacity for propositional attitude attribution, or vice versa) in a way that aligns with Eliminativist predictions, that helps.
  *   **Example:** Schizophrenia research sometimes frames delusions not as "false beliefs" but as disruptions in predictive processing (Bayesian brain). If a purely non-FP vocabulary (like "precision weighting of prediction errors") becomes clinically more effective than "delusional belief," that is a practical victory for Eliminativism.

  #### C. Inter-Theoretic Reduction Case Studies
  Philosophers of science need to look at other fields. How did "gene" reduce to "molecular sequence"?
  *   **Smooth Reduction:** If the old term maps neatly to the new (Gene = DNA sequence), Realism wins.
  *   **Bumpy/Eliminative Reduction:** If the old term is fractured and replaced (e.g., "phlogiston" was split into oxidation, heat, and gas expansion), Eliminativism wins.
  *   **Progress:** A rigorous analysis of how "memory" or "attention" are being reduced in cognitive neuroscience. Are we finding "the neural correlate of memory," or are we dissolving "memory" into five distinct mechanisms (consolidation, retrieval, working memory, etc.) that don't map to the folk term? If the latter, it supports the Churchlands.

  ### Summary

  The disagreement is **not** primarily about whether the brain is physical (both agree it is). It is about **explanatory autonomy**.

  *   **Eliminativists** think psychology is a placeholder for a completed neuroscience.
  *   **Realists** think psychology is an autonomous level of description that captures patterns (rationality, intention) that neuroscience *cannot* capture, even in principle, because those patterns exist at a higher level of abstraction.

  **Progress** will not come from a "Eureka!" moment in a neuro lab. It will come from **cognitive engineering**: Can we build systems that navigate the world as well as humans without using belief-desire architecture? If yes, the Churchlands were right. If no—if belief-desire architecture turns out to be the only efficient compression algorithm for complex agency—then Folk Psychology is here to stay.

  You are right to suspect the impasse is deeper than evidence standards; it is a clash between a **reductive physicalist worldview** and a **functionalist/normative worldview**. Until we have a better philosophy of how normative facts fit into a physical world, the debate will likely continue to tread water.
