prompt: |-
  So I'm a therapist, been practicing about 9 years, and I do a lot of dream work — the kind where you treat the dream like something the client actually went through and you unpack it together. But here's the thing that's been messing with me. About four months ago I started having these super vivid lucid dreams, the kind where you know you're dreaming and you can actually make decisions. And when I wake up I genuinely cannot tell whether I was *having an experience* or whether my brain just assembled the whole thing at the moment of waking and handed it to me as a memory. It feels like a memory of something that happened. But I can't tell if anything actually happened.

  This has kind of thrown my clinical work into question, because I've been treating dream reports as if they're reports of experiences — the client experienced the dream, we work with it like we'd work with a memory. But now I'm not sure that's always right. I fell down a rabbit hole reading about the Malcolm vs. Dennett debate on whether dreams are experiences (Malcolm says no, you're asleep, you can't make judgments, the whole thing is a story you tell when you wake up; Dennett says yes, they're experiences, you just can't report them while they're happening). And I realized I need an actual framework for this in session.

  Can you write me a decision procedure I can use? Something I can run in my head while the client is talking. The procedure should help me decide, for a given dream report, whether to treat it as a report of an experience (and do the usual dream-work) or whether to treat it as a waking narrative the client is constructing right now (and shift to a different approach — like, what does this story you're telling me right now say about what's on your mind).

  Constraints: I have 50-minute sessions, I'm not a philosopher, and the steps need to be clear enough that I can actually use them. The stakes aren't life-or-death but I could waste a lot of sessions going down the wrong path. Give me the steps in order, what counts as a sufficient answer at each step, where the procedure stops with "treat as narrative" and where it stops with "treat as experience," and flag the points where the procedure has to hand off to clinical judgment because the philosophy genuinely can't decide.

  Then run it on three dream reports:

  1. Client says they dreamed they were back in their childhood home, searching every room for their mother and not finding her. They felt panicked, and they remember thinking "she must be in the basement, check the basement." They woke up before finding her.

  2. Client says they dreamed they were a tree. Not a person turning into a tree, just a tree, standing there. They felt peaceful. They don't remember making any decisions or having any thoughts.

  3. Client says they dreamed they were at their wedding but their spouse's face kept changing into different people's faces — their ex, their boss, a stranger. They felt confused but also kind of detached, like "oh, this again."

  And be straight with me: give me a case where the procedure tells me to do something I'm not gonna like, and tell me what the procedure just can't handle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Therapist (9 years experience), specializes in dream work (treats dreams as lived experiences).
      *   **Problem:** Personal experience with lucid dreaming has triggered an epistemological crisis. They can't distinguish between *having* a dream experience and *constructing* a dream narrative upon waking. This undermines their clinical framework (Malcolm vs. Dennett debate).
      *   **Task:** Create a decision procedure (algorithm/flowchart style) to use *in session* to decide whether to treat a dream report as a "recorded experience" (standard dream work) or a "waking narrative construction" (narrative therapy/story analysis).
      *   **Constraints:** 50-minute sessions, practical steps (not philosophical abstraction), clear stopping points, flagging clinical judgment areas.
      *   **Deliverables:**
          1.  The Decision Procedure.
          2.  Application to three specific dream reports.
          3.  A "hard truth" case (where the procedure suggests something uncomfortable).
          4.  A limitation statement (what the procedure *can't* handle).

  2.  **Deconstruct the Philosophical/Clinical Conflict:**
      *   *Malcolm's View:* Dreams aren't experiences; they are stories we tell ourselves upon waking based on vague impressions. Treating them as memories is a category error.
      *   *Dennett's View:* Dreams are experiences (qualia exist), but memory access is limited. Treating them as memories is valid.
      *   *Clinical Reality:* It doesn't actually matter *ontologically* whether the dream "happened" in real-time during sleep. What matters is *therapeutic utility*. However, the user is asking for a procedure to distinguish the *phenomenology* to guide the *approach*.
      *   *The Pivot:* I need to translate the philosophical debate into clinical markers.
          *   "Experience" markers: Sensory detail, agency/choice within the dream, emotional continuity, surprise/unexpectedness.
          *   "Narrative Construction" markers: Logical gaps filled seamlessly, thematic coherence that feels too neat, lack of sensory grounding, "telling" rather than "reliving."

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A mental checklist the therapist runs while listening.
      *   *Step 1: Phenomenological Density.* Is there sensory data? (Experience) vs. Summary? (Narrative).
      *   *Step 2: Agency & Surprise.* Did things happen *to* them or did they make it happen? Was there surprise? (Experience implies unpredictability).
      *   *Step 3: Emotional Resonance.* Is the emotion tied to the dream content or the telling?
      *   *Step 4: The "Lucid/Pre-Lucid" Check.* (Crucial given the user's trigger). Did the client have meta-awareness *in* the dream?
      *   *Decision Nodes:* If it feels lived -> Experience Work. If it feels told -> Narrative Work.
      *   *Clinical Judgment Flags:* Where the data is ambiguous.

  4.  **Refining the Procedure (Self-Correction/Optimization):**
      *   *Critique:* Wait, if I tell the therapist to decide based on "truth," I'm falling into the Malcolm/Dennett trap myself. The *therapeutic* stance is what matters.
      *   *Adjustment:* The procedure shouldn't try to solve the metaphysical truth (because we can't). It should assess the *utility of the stance*.
      *   *Revised Approach:* The procedure determines which *frame* yields more clinical material.
      *   *Wait, reading the prompt again:* The user explicitly asks: "decide... whether to treat it as a report of an experience... or whether to treat it as a waking narrative." They want a heuristic to choose the *mode of intervention*.
      *   *Key Insight:* The distinction isn't about ontological truth (which is unknowable), but about *phenomenological richness*. Rich, sensory, surprising dreams benefit from "experience" work (Gestalt, IFS, etc.). Abstract, summary-like dreams benefit from "narrative" work (meaning-making, cognitive).
      *   *Structure:*
          1.  Sensory Specificity Check.
          2.  Agency/Passivity Check.
          3.  Coherence vs. Fragmentation Check.
          4.  Affect Check.
      *   *Outcome:* High specificity/passivity/affect = Experience. High coherence/summary/detachment = Narrative.

  5.  **Running the Procedure on the Three Cases:**
      *   *Case 1 (Childhood Home/Mother):* High emotion (panic), specific action (checking basement), unresolved ending. -> *Treat as Experience.*
      *   *Case 2 (The Tree):* Static, no thoughts, peaceful. This is tricky. It's an experience of *being*, but no narrative. -> *Treat as Experience (Somatic/State-based).*
      *   *Case 3 (Wedding/Face Changing):* "Oh, this again" (Detachment), logical symbolism (faces changing). -> *Treat as Narrative/Construction.*

  6.  **Addressing the "Hard Truth" and "Limitations":**
      *   *Hard Truth:* There will be cases where the client *insists* it was real/experiential, but the procedure flags it as a narrative construction (e.g., a dream that perfectly solves a problem too neatly). The therapist has to gently shift away from "uncovering truth" to "exploring meaning," which might feel like invalidating the client's reality.
      *   *Limitation:* The procedure cannot determine ontological truth. It only measures *report quality*. A well-told lie (narrative) can look like an experience. A poorly remembered trauma (experience) can look like a narrative. The procedure is about *clinical leverage*, not metaphysics.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic to the therapist's crisis, pragmatic.
      *   Formatting: Clear steps, bold text for decision points.
      *   Check against constraints: 50-min session friendly? Yes. Clear steps? Yes.

  8.  **Wait, one nuance:** The user is struggling because *they* had lucid dreams. Lucid dreams blur the line because you *make decisions*. Does that make them more "real" or more "constructed"? In the procedure, I need to account for *agency*. High agency can mean "lucid experience" OR "conscious fabrication." I need to distinguish *dream-logic agency* vs. *waking-logic agency*.
      *   *Refinement:* In Step 2, distinguish between "Dream Agency" (constrained by dream logic) and "Narrative Control" (story flows too logically).

  9.  **Final Review of the Output:**
      *   Does it answer the prompt directly? Yes.
      *   Is the philosophical debate acknowledged but bracketed? Yes.
      *   Are the three cases analyzed? Yes.
      *   Is the "hard truth" included? Yes.

  *(Self-Correction during drafting the response)*: I need to be careful not to validate Malcolm *or* Dennett as "correct." The clinical utility is the only truth that matters here. I must emphasize that the procedure is a *heuristic for intervention*, not a *detector of truth*. If I don't make that clear, I'm feeding the therapist's anxiety rather than resolving it. The "Hard Truth" section is the perfect place to drive this home.

  Let's build the "Dream Report Triage Protocol."

  *Step 1: Sensory Granularity.*
  *Step 2: The Surprise Factor.*
  *Step 3: Emotional Lag.*
  *Step 4: The Coherence Trap.*

  Okay, ready to write.
answer: |-
  This is a profound clinical pivot point. You are experiencing what we might call "ontological countertransference." Your own phenomenological uncertainty is bleeding into the frame you hold for clients.

  Here is the hard clinical truth before we begin: **The Malcolm/Dennett debate is undecidable in the session.** You cannot know if the dream "happened" in real-time neural processing or was instantiated at wakefulness. However, **clinical utility does not require ontological certainty.** It requires phenomenological density.

  If a report has high sensory density, emotional immediacy, and dream-logic unpredictability, treating it as an *experience* yields more material. If a report is summary-like, thematically neat, or lacks sensory grounding, treating it as a *narrative construction* yields more material.

  Here is a decision procedure designed for a 50-minute hour. It is not a truth detector; it is a **leverage detector**.

  ### The Dream Report Triage Protocol (DRT-P)

  Run these four steps sequentially while the client is reporting. You are looking for *markers of immediacy* vs. *markers of editing*.

  **Step 1: Sensory Granularity Check**
  *   **Ask yourself:** Is the client describing sensory data (light, texture, sound, spatial relations) or plot points?
  *   **Experience Marker:** "The wallpaper was peeling," "The light was hummy," "I couldn't move my legs."
  *   **Narrative Marker:** "I was in my house," "It was scary," "I needed to find something."
  *   **Decision:**
      *   High Granularity → Proceed to Step 2.
      *   Low Granularity (Summary) → **STOP. Treat as Narrative.** (Shift to: "What does it mean that this is the story your mind chose to tell today?")

  **Step 2: The Surprise/Resistance Test**
  *   **Ask yourself:** Did the dream world resist the client's will, or did it flow logically?
  *   **Experience Marker:** Things happened *to* them. Doors were locked. People acted out of character. The geography shifted unexpectedly.
  *   **Narrative Marker:** The client moved from scene to scene seamlessly. The symbolism is obvious. The plot resolves neatly.
  *   **Decision:**
      *   High Resistance/Surprise → Proceed to Step 3.
      *   High Logic/Flow → **STOP. Treat as Narrative.** (Shift to: "Notice how smoothly this story moves. What is being smoothed over?")

  **Step 3: Emotional Lag Check**
  *   **Ask yourself:** Is the emotion tied to the *recall* or the *event*?
  *   **Experience Marker:** Client re-experiences affect while talking (voice shakes, breathing changes). The emotion matches the specific moment being described.
  *   **Narrative Marker:** Client describes a terrifying event flatly. Or, the emotion seems to be about the *meaning* of the dream ("It was sad because it represents my childhood") rather than the event itself.
  *   **Decision:**
      *   High Somatic/Emotional Resonance → **Treat as Experience.** (Use Gestalt/IFS/Exposure: "Go back to the door. What happens?")
      *   Detached/Intellectualized Affect → **Treat as Narrative.** (Use Narrative/CBT: "If this dream were a movie title, what would it be?")

  **Step 4: The Agency Ambiguity Flag (Clinical Judgment Handoff)**
  *   **Context:** This is where your lucid dreaming issue lives.
  *   **The Check:** Did the client make a choice *inside* the dream?
  *   **Judgment Call:**
      *   If the choice was constrained by dream logic (e.g., "I tried to run but moved in slow motion") → **Treat as Experience.**
      *   If the choice was meta-cognitive (e.g., "I decided to fly because I knew I was dreaming") → **HANDOFF.**
      *   **Handoff Protocol:** You cannot decide this philosophically. Ask the client: *"When you made that choice, did it feel like discovering something was possible, or like you were directing a scene?"*
          *   "Discovering" → Treat as Experience.
          *   "Directing" → Treat as Narrative.

  ***

  ### Application to Your Three Cases

  Here is how the protocol runs on the reports you provided.

  #### Case 1: Childhood Home / Missing Mother
  *   **Step 1 (Granularity):** High. "Searching every room," "Basement." Specific spatial navigation.
  *   **Step 2 (Surprise):** High. Mother is not found. Waking occurs before resolution (interruption/resistance).
  *   **Step 3 (Affect):** High. "Felt panicked."
  *   **Step 4 (Agency):** Constrained. They *thought* "check the basement," but woke up before acting. The dream resisted completion.
  *   **Protocol Verdict:** **Treat as Experience.**
  *   **Clinical Move:** Do not analyze what the mother represents yet. Put them back in the dream. "You're standing at the basement door. Your heart is racing. Do you open it?" Work the panic somatically.

  #### Case 2: The Tree
  *   **Step 1 (Granularity):** Low/Mixed. "Just a tree, standing there." Static image.
  *   **Step 2 (Surprise):** Low. Nothing happened. No resistance.
  *   **Step 3 (Affect):** Present ("Peaceful"), but static.
  *   **Step 4 (Agency):** None.
  *   **Protocol Verdict:** **Treat as Experience (with a caveat).**
  *   **Why:** While it lacks plot (Narrative marker), it lacks *editing*. It is a report of a *state of being*, not a story. Treating it as a narrative construction ("Why did you choose to be a tree?") risks intellectualizing a somatic state.
  *   **Clinical Move:** Treat it as an experiential state, not a story. "Stay with the feeling of being rooted. Where do you feel that peace in your body right now?" This bypasses the narrative/experience split by focusing on *sensation*.

  #### Case 3: Wedding / Changing Faces
  *   **Step 1 (Granularity):** Low. Faces changing is a concept, not a sensory description.
  *   **Step 2 (Surprise):** Low. "Oh, this again." The client recognizes the pattern. The dream is familiar/repetitive.
  *   **Step 3 (Affect):** Detached. "Confused but kind of detached."
  *   **Step 4 (Agency):** Meta-cognitive. They are observing the dream as a dream ("This again").
  *   **Protocol Verdict:** **Treat as Narrative.**
  *   **Clinical Move:** Do not send them back into the wedding. The dream is functioning as a commentary, not an immersion. Ask: "You said 'this again.' What is the story you tell yourself about your relationships that feels this familiar?"

  ***

  ### The Hard Truth: A Case You Won't Like

  Here is a scenario where the protocol will force you to abandon your preferred modality, and it will feel like you are invalidating the client.

  **The Case:** A client brings a dream that is incredibly vivid, sensory-rich, and emotionally charged (Step 1 & 3 pass). However, the dream content perfectly mirrors a conversation you had with them last week, solving a problem you discussed in a way that is therapeutically convenient (Step 2 fails on Surprise/Resistance).

  **The Protocol's Command:** **Treat as Narrative.**
  **Why:** The dream lacks *resistance*. It is too coherent with the waking therapeutic agenda. It is likely a "wish-fulfillment construction" generated at wakefulness to please the therapist or resolve cognitive dissonance.
  **The Uncomfortable Reality:** You have to stop doing dream work. You cannot say, "This dream is fake." You have to say, "I notice this dream lines up perfectly with what we talked about last week. I'm wondering if your mind is trying to settle that score for you right now."
  **Why you won't like it:** It kills the magic. It shifts the work from the mysterious unconscious to the here-and-now relational dynamic. It risks making the client feel their inner world is just "echoing" you. But following the protocol prevents you from reinforcing a dependency where the client produces "good dreams" to show progress.

  ### What The Procedure Cannot Handle

  The procedure cannot distinguish between **Repressed Memory** and **Dream Metaphor**.

  If a client dreams of being abused in a basement, and they *were* abused in a basement as a child, the report will pass all "Experience" markers (High Granularity, High Affect, High Resistance).
  *   **Dennett:** It's an experience of the memory trace.
  *   **Malcolm:** It's a narrative constructed from the memory trace.
  *   **The Procedure:** Treat as Experience.

  **The Limitation:** The protocol assumes the *origin* of the report doesn't change the *intervention*. But if the client believes this is a recovered memory of a new event, and you treat it as a dream metaphor, you risk gaslighting. If you treat it as a memory, and it was a dream, you risk false memory implantation.

  **The Handoff:** At the point where dream content overlaps with potential trauma history, the DRT-P suspends. You must switch to a trauma-informed verification framework. You cannot use dream work heuristics on potential factual memories. The philosophy ends where safeguarding begins.

  ### Final Note for the Therapist

  Your crisis comes from wanting the dream to be *ontologically real* so that the work is *clinically valid*.

  The procedure above sidesteps that. It says: **Validity comes from the client's engagement, not the dream's history.** If treating it as an experience unlocks affect, it is clinically "true" enough for the hour. If treating it as a narrative unlocks insight, that is also "true" enough.

  You are not a historian of the client's sleep. You are a curator of their meaning-making. When you wake up unsure if your lucid dream "happened," remind yourself: The anxiety you feel about it is real. The work you do with that anxiety is real. The ontological status of the dream is irrelevant to the therapy.
