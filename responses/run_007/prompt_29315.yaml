          Three camps dominate. First, the neurobiological restrictivists argue consciousness requires specific neural architecture, typically a cortex or homologous structures. For them, a fish avoiding a hook is merely reflexive; without the right hardware, there's no "inner light." Second, behavioral functionalists claim complex, flexible learning—like an octopus opening a jar or a bee detouring—constitutes sufficient evidence of sentience. If it acts like it feels, it feels. Third, structuralists (often aligned with Integrated Information Theory) argue consciousness arises from specific causal dynamics, potentially existing in simpler systems than expected, though perhaps differently than in humans. Each side cites the same behaviors but interprets them through different theoretical lenses: hardware vs. software vs. structure. The data remains constant; the interpretation shifts based on prior metaphysical commitments regarding what kind of physical process could possibly generate experience.
