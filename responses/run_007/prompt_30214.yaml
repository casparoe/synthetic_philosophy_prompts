      *   *Refinement:* I need to emphasize the **Baseline**. The PP applies to *new* interventions that introduce *new* uncertainties. If the status quo is dangerous, changing it isn't "precautionary" in the same sense; it's remediation. But usually, PP is invoked against *novel* technologies.
      *   *Better Refinement:* Focus on the distinction between **Uncertainty** and **Risk**. The friend's Premise 2 assumes we know the risks of omission equal the risks of action. But PP is triggered when we *don't* know. If we don't know the risk of the new action, but we have historical data on the omission (status quo), they aren't symmetrical.
      *   *Best Refinement:* Go with the **Procedural Interpretation**. The PP doesn't say "Don't do X." It says "If you want to do X, you must demonstrate safety first." It doesn't apply to *not* doing X because *not* doing X doesn't require demonstration.
