prompt: |-
  A friend in my decision theory reading group sketched this argument and now I can't shake it:

  (1) Rational agents update their beliefs by conditionalizing on their evidence.
  (2) If two agents start from the same prior and conditionalize on different evidence, any difference in their posterior beliefs is fully explained by the difference in evidence.
  (3) For any two agents with different priors, we can always imagine a more fundamental "ur-prior" from which both of their priors would result by conditionalizing on their respective background experiences and upbringing.
  (4) So any two rational agents can be treated as sharing an ur-prior and having different total evidence.
  (5) Therefore, all disagreement between rational agents must be traceable to differences in evidence.
  (6) But if all disagreement is evidence-driven, then when rational agents pool their evidence, they must converge to the same beliefs.
  (7) Yet we routinely see intelligent, careful people who have access to the same evidence — think of economists disagreeing about fiscal policy, or philosophers disagreeing about free will — and they don't converge.
  (8) So either these people aren't rational, or one of the earlier steps fails.

  I want to keep (7) — it just seems obvious that reasonable people can disagree. But I also don't see an obvious flaw in (1) through (6). Which step would you reject, and what's the cost of rejecting it? I'm especially interested in whether rejecting (3) commits me to saying that priors are just brute arational starting points, and wether that's as bad as it sounds.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Decision theory reading group.
      *   **Problem:** An argument (Aumann-style agreement theorem variant) suggests rational agents with common priors and common knowledge of posteriors cannot agree to disagree. The user finds the conclusion (no reasonable disagreement) counterintuitive compared to observation (economists, philosophers disagree).
      *   **Constraint:** The user wants to keep premise (7) (reasonable people disagree).
      *   **Task:** Identify which step (1-6) to reject, explain the cost, and specifically address the implications of rejecting (3) regarding "brute arational priors."

  2.  **Deconstruct the Argument:**
      *   (1) Conditionalization (Standard Bayesianism).
      *   (2) Same Prior + Diff Evidence -> Diff Posteriors (Logic of Conditionalization).
      *   (3) The "Ur-Prior" Assumption (Common Prior Assumption - CPA).
      *   (4) Reduction to Common Prior + Diff Evidence.
      *   (5) Disagreement = Evidence Difference.
      *   (6) Pooling Evidence -> Convergence (Aumann's Agreement Theorem logic).
      *   (7) Observation: Persistent disagreement among experts with shared evidence.
      *   (8) Conclusion: Irrationality or False Premise.

  3.  **Evaluate Potential Rejection Points:**

      *   **Reject (1) Conditionalization:**
          *   *Pros:* Allows for non-Bayesian updating (e.g., Jeffrey conditionalization, inference to the best explanation).
          *   *Cons:* Undermines standard decision theory, opens door to Dutch Books, makes "rationality" harder to define formally.
          *   *Verdict:* Too costly for a decision theory group context usually.

      *   **Reject (2) Logic of Conditionalization:**
          *   *Pros:* Hard to reject; it's math.
          *   *Cons:* Incoherent.
          *   *Verdict:* Don't touch.

      *   **Reject (3) The Ur-Prior / Common Prior Assumption (CPA):**
          *   *Pros:* Saves the phenomenon of reasonable disagreement. Acknowledges psychological/biological diversity.
          *   *Cons:* Commits to "brute priors." Are they rational? How do we critique them?
          *   *Verdict:* This is the standard move in philosophy (Subjective Bayesianism vs. Objective Bayesianism).

      *   **Reject (6) Convergence upon Pooling:**
          *   *Pros:* Allows for disagreement even with shared evidence.
          *   *Cons:* Requires rejecting Aumann's theorem conditions (common knowledge of posteriors, honesty, etc.). Or implies evidence isn't fully shareable (indexicals, qualia).
          *   *Verdict:* Strong contender, especially regarding "evidence" definition.

      *   **Reject (7) Observation:**
          *   *Pros:* Consistent with strict Bayesianism.
          *   *Cons:* User explicitly wants to keep (7).
          *   *Verdict:* Off the table per prompt.

  4.  **Focus on the User's Specific Interest: Rejecting (3).**
      *   The user asks: *Does rejecting (3) commit me to saying priors are just brute arational starting points, and is that as bad as it sounds?*
      *   *Analysis:* Yes, rejecting (3) means denying there is a *unique* rational ur-prior. This is the stance of **Subjective Bayesianism** (or Permissivism).
      *   *Is it bad?* It depends.
          *   *Bad:* Makes rationality less constraining. Anything goes if the prior is weird enough (e.g., Inductive Skeptic).
          *   *Good:* Reflects human diversity. Avoids the "One True Prior" dogmatism.
      *   *Nuance:* We can reject (3) without saying *all* priors are rational. We can have constraints (coherence, regularity) without having a *unique* prior. This is "moderate permissivism."

  5.  **Focus on Alternative: Rejecting (6) / The Definition of Evidence.**
      *   Often, the "Common Prior" argument fails not because priors differ, but because *evidence isn't actually shared*.
      *   *Indexical Evidence:* "I am me."
      *   *Private Evidence:* Qualia, introspective states.
      *   *Processing Costs:* Bounded rationality (agents can't actually pool all evidence).
      *   *Ambiguity:* Evidence isn't a simple proposition; it's interpreted through the prior (theory-ladenness).

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the strength of the argument (it's essentially Aumann's Agreement Theorem wrapped in philosophical premises). Validate the intuition that (7) is correct.
      *   **Primary Recommendation:** Reject (3). This is the most philosophically robust move for preserving reasonable disagreement.
      *   **Addressing the "Brute Priors" Worry:**
          *   Distinguish between *unconstrained* priors (anything goes) and *constrained but non-unique* priors (rational constraints exist, but don't dictate a single function).
          *   Term: **Epistemic Permissivism**.
          *   Analogy: Moral philosophy (many right actions, not just one).
          *   Cost: We lose the ability to say someone is *irrational* solely based on their starting point, only on how they update. It makes critique harder but more humane.
      *   **Secondary Recommendation:** Reject/Qualify (6) or the definition of "Evidence" in (5).
          *   Evidence isn't fully shareable (indexicals, private experience).
          *   Bounded rationality (computational limits prevent actual pooling).
          *   Theory-ladenness (what counts as evidence depends on the prior).
      *   **Comparison:** Rejecting (3) is cleaner than rejecting (1) or (2).
      *   **Conclusion:** Summarize the trade-off.

  7.  **Refining the "Brute Priors" point:**
      *   I need to be careful not to say "rejecting (3) means *no* constraints."
      *   Standard Subjective Bayesianism: Priors must be probabilistically coherent.
      *   Objective Bayesianism: Priors must also satisfy symmetry/entropy principles (leading to unique prior).
      *   Rejecting (3) aligns with Subjective Bayesianism.
      *   Is it "arational"? Not necessarily. It's "underdetermined by reason." Reason sets the fence, but doesn't pick the spot inside the fence.
      *   *Key phrase:* "Rational permissibility" vs. "Rational requirement."

  8.  **Refining the "Evidence" point:**
      *   If I reject (3), I save disagreement.
      *   If I keep (3) but reject (6), I need to explain why pooling fails.
      *   *Aumann's Theorem* requires *common knowledge* of posteriors. In real life, we don't know the other person's exact posterior credence function. We just hear their opinion.
      *   Also, *computational complexity*.
      *   This is a practical rejection vs. a principled rejection. The argument seems principled. So rejecting (3) is better for a principled stand.

  9.  **Structure of the Answer:**
      *   **Verdict:** Reject (3).
      *   **Why (3) is the weak link:** The "Ur-Prior" is a metaphysical posit, not an empirical fact.
      *   **The Cost (Brute Priors):** Explain Permissivism. It's not "anything goes," it's "many right ways."
      *   **Alternative:** Qualify (5)/(6) regarding the nature of evidence (indexicality, theory-ladenness).
      *   **Synthesis:** A combination of Permissivism + Bounded Rationality is the most realistic view.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about whether brute priors are "as bad as it sounds"?
      *   *Adjustment:* I need to explicitly argue that it's *not* as bad as it sounds. It shifts the locus of rationality from *origin* to *process*.
      *   *Check:* Did I respect the decision theory context?
      *   *Adjustment:* Use terms like "Subjective vs. Objective Bayesianism," "Aumann's Agreement Theorem," "Permissivism."

  11. **Final Polish:** Ensure tone is collegial (reading group context) and rigorous. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a classic reconstruction of the logic behind **Aumann's Agreement Theorem**, dressed up in epistemological clothing. Your friend has effectively argued that if Bayesianism is true and the Common Prior Assumption (CPA) holds, rational agents cannot agree to disagree.

  Since you want to hold onto (7) — the obvious fact that reasonable experts disagree — you must break the chain earlier. While there are ways to attack (6) (regarding the practicality of pooling evidence), the most philosophically robust move is to **reject (3)**.

  Here is the case for rejecting (3), an analysis of the "brute prior" worry, and a secondary option regarding the nature of evidence.

  ---

  ### The Primary Move: Reject (3) (The Common Prior Assumption)

  Premise (3) claims that for any two agents, there exists a fundamental "ur-prior" from which their actual priors derive via conditionalization on background experience. This is the **Common Prior Assumption (CPA)**.

  Rejecting (3) means accepting that rational agents can start with different priors that are *not* reducible to a shared starting point plus different data.

  #### Does this commit you to "Brute Arational Priors"?
  You asked if this is "as bad as it sounds." The short answer is: **No, provided you adopt a view called Epistemic Permissivism.**

  There is a spectrum of views on priors:
  1.  **Objective Bayesianism:** Reason dictates a unique correct prior (e.g., via the Principle of Indifference or Maximum Entropy). This accepts (3).
  2.  **Subjective Bayesianism:** Priors are subjective, provided they are probabilistically coherent. This rejects (3).
  3.  **Moderate Permissivism (The Sweet Spot):** Reason imposes *constraints* on priors (e.g., regularity, coherence, perhaps some symmetry), but does not dictate a *unique* prior.

  If you reject (3), you are not saying priors are *arational* (outside the scope of reason); you are saying they are **underdetermined by reason**.

  **Why this isn't catastrophic:**
  *   **Rationality as Process, Not Origin:** You shift the locus of rationality from *where you start* to *how you move*. A prior isn't "irrational" just because it differs from yours; it is only irrational if it violates coherence axioms (e.g., assigning probability 1 to a contingent falsehood).
  *   **Cognitive Diversity:** Different priors can be viewed as different cognitive "risk profiles." One agent might be naturally more skeptical (requires more evidence to move credence); another might be more adventurous. Both can be rational strategies for navigating an uncertain world.
  *   **Avoids Dogmatism:** Accepting (3) often smuggles in a specific objective prior under the guise of "reason." Rejecting (3) acknowledges that we don't actually know what the "One True Prior" looks like.

  **The Cost:**
  The cost is that you lose the ability to condemn someone as *irrational* solely based on their starting intuitions. You cannot tell the climate skeptic or the conspiracy theorist, "Your prior is irrational." You can only say, "Given your prior, your updating is wrong," or "Your prior is highly idiosyncratic compared to the community standard." It makes normative critique slightly softer, but more honest.

  ---

  ### The Secondary Move: Qualify (5) and (6) (The Nature of Evidence)

  If you are hesitant to embrace permissive priors, the other place to break the chain is at the definition of **Evidence**. The argument assumes evidence is a public, shareable commodity (like a dataset).

  #### 1. Indexical and Private Evidence
  Evidence often contains indexicals ("I am here," "I am in pain"). Even if I tell you "I am in pain," you do not have my evidence; you have evidence *that I am in pain*.
  *   **Implication:** Two agents can never truly have the "same total evidence" because they occupy different spatiotemporal locations and have different qualitative experiences.
  *   **Cost:** This makes convergence very difficult, perhaps impossible, even in principle. It saves disagreement but risks making communication futile.

  #### 2. Theory-Ladenness of Evidence
  Premise (2) assumes evidence is distinct from the prior. However, in complex domains (economics, philosophy), what counts as evidence is often determined by the prior.
  *   *Example:* To a Keynesian, a drop in investment is evidence of low aggregate demand. To an Austrian, it is evidence of prior malinvestment.
  *   **Implication:** They aren't conditionalizing on the *same* proposition $E$. They are conditionalizing on $E_1$ and $E_2$, which look similar linguistically but differ semantically.
  *   **Cost:** This undermines the idea of "pooling evidence." If we can't agree on what the evidence *is*, we can't conditionalize on a shared set.

  #### 3. Bounded Rationality (Rejecting 6 practically)
  Aumann's theorem requires **common knowledge of posteriors**. In the real world, I don't know your exact credence function; I only hear your assertion. I also don't know if you are lying, mistaken, or if you processed the data correctly.
  *   **Cost:** This saves rationality by appealing to computational limits. It says, "People *would* converge if they were infinite computers, but they aren't." This is less satisfying philosophically because it treats the disagreement as a bug rather than a feature.

  ---

  ### Recommendation for Your Reading Group

  I recommend you **reject (3)** and defend **Moderate Permissivism**.

  Here is how to frame it to your group:

  1.  **Acknowledge the Math:** Admit that *if* (3) holds, Aumann is right. The math is sound.
  2.  **Challenge the Metaphysics:** Argue that (3) is a metaphysical posit, not a logical truth. There is no empirical reason to believe all human minds are conditionalized versions of a single "Ur-Mind."
  3.  **Reframe "Brute Priors":** Argue that priors are not "brute arational facts" but rather **rational permissions**. Just as there are many morally permissible life plans, there are many epistemically permissible starting points.
  4.  **The "Reasonable Disagreement" Defense:** Conclude that reasonable disagreement is not a failure of rationality, but a reflection of the fact that the world underdetermines our starting attitudes.

  **The Verdict:**
  Rejecting (3) is the least costly error. It preserves the Bayesian framework (1 & 2), acknowledges reality (7), and avoids the implausible claim that all disagreement is due to hidden evidence or irrationality. It forces you to accept that rationality is a wide tent, but that is a feature, not a bug.

  **Suggested Reading:**
  *   **Thomas Kelly**, "The Epistemic Significance of Disagreement" (Defends the idea that peers can disagree rationally).
  *   **Roger White**, "Epistemic Permissiveness" (Argues against permissivism, good for steel-manning the opposition).
  *   **David Christensen**, "Putting Logic in Its Place" (Discusses the limits of logical constraints on belief).

  If you reject (3), you aren't saying "anything goes." You're saying "many things go, provided you update correctly." That is a very defensible position in decision theory.
