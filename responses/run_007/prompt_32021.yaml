          *   *Cost:* Heavy logical revision. Requires adopting intuitionistic logic for epistemic contexts. Williamson is a big proponent here.
          *   *Nuance:* Intuitionists deny the equivalence of $\neg \forall x \phi$ and $\exists x \neg \phi$. They can accept "Not all truths are known" without committing to "There exists a specific truth that is unknown."

      *   **Option 3: Reject Distribution (Non-Adjunction).**
          *   *Idea:* Maybe $K(A \land B)$ does not imply $K A \land K B$.
