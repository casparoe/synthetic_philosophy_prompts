      *   **Analyze the Exit Routes:**
          1.  *Restricting Knowability (The Standard Move):* Admit some truths are unknowable (the Moorean ones). Discuss the "Cartesian" restriction.
          2.  *Intuitionistic Logic (The Williamson Move):* Deny the classical inference from "Not all known" to "Some unknown."
          3.  *Contextualism/Semantics:* Truth values shift with context of utterance vs. context of assessment.
