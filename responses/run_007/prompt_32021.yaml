      *   *Premise 2 (Existence of Unknown Truths):* $\exists p (p \land \neg K p)$
      *   *Derivation:*
          1.  Assume $p \land \neg K p$ is true (for some specific $p$).
          2.  By Knowability: $\Diamond K(p \land \neg K p)$.
          3.  Assume a world $w$ where $K(p \land \neg K p)$ holds.
          4.  Distribution (K-Axiom): $K p \land K(\neg K p)$.
          5.  Factivity (T-Axiom): $p$ and $\neg K p$.
          6.  From $K(\neg K p)$ and Factivity: $\neg K p$.
          7.  From $K p$ (step 4) and Factivity: $p$ (redundant but okay).
          8.  Crucial Step: From $K(\neg K p)$, does it imply $\neg K p$? Yes, by factivity. But we also have $K p$ in that same world.
          9.  Contradiction: $K p \land \neg K p$.
          10. Therefore, $\neg \Diamond K(p \land \neg K p)$.
          11. By Knowability ($p \rightarrow \Diamond K p$), this implies $\neg (p \land \neg K p)$.
          12. Which means $p \rightarrow K p$.
      *   *Conclusion:* If all truths are knowable, all truths are known.

  3.  **Identify the Core Tension:**
      *   The paradox arises from the interaction of three principles:
