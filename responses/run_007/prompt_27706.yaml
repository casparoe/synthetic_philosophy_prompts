answer: |-
  This is an exceptionally sharp set of observations. You have independently reconstructed one of the most significant meta-ethical challenges to classical utilitarianism and hedonistic theories of well-being. You are correct that Mill's distinction does not solve the foundational definitional problem you are encountering.

  Here is the carving you are looking for, the established terminology, and an analysis of how this problem functions within the literature.

  ### 1. The Established Name
  The specific difficulty you are describing is standardly referred to as **The Heterogeneity Problem** (or **The Heterogeneity of Pleasure**).

  It is sometimes discussed under the umbrella of the debate between **Feeling Theory** (or Sensation Theory) versus **Attitudinal Theory** of pleasure.
  *   **Feeling Theory:** Pleasure is a distinct, introspectible qualitative character (a "hedonic tone") present in experiences.
  *   **Attitudinal Theory:** Pleasure is a pro-attitude (being pleased *that* something is the case) toward a state of affairs, regardless of the sensory feel.

  Your intuition that there is "no single thread" is the phenomenological core of the Heterogeneity Problem. It was famously pressed by **G.E. Moore** (in *Principia Ethica*) and **Gilbert Ryle** (in *The Concept of Mind*), who argued that searching for a common "feeling" of pleasure is a category mistake.

  ### 2. The Carving: One Problem or Several?
  It is best understood as **one metaphysical dilemma with two prongs**, which forces a choice between two different definitions of "pleasure."

  **Prong A: The Phenomenological Objection (The "Common Thread" Problem)**
  This is what you are experiencing with your examples.
  *   *The Worry:* If pleasure is a sensation (like the warmth of a bath), where is the sensation in the satisfaction of a proof? If pleasure is a "tingle," the calm of meditation lacks it. If pleasure is a "rush," the relief of a headache lacks it.
  *   *The Implication:* There is no natural kind called "pleasure" in the way there is a natural kind called "redness." Therefore, Hedonism cannot be built on a unified *sensation*.

  **Prong B: The Intentionality Objection (The "Object" Problem)**
  This arises from your example of the colleague failing.
  *   *The Worry:* Some pleasures are "about" something (propositional). You are pleased *that* the colleague failed. Other pleasures are non-intentional (sensory). You are not pleased *that* the bath is warm in the same way; you just feel the warmth.
  *   *The Implication:* If "pleasure" covers both sensory feels and propositional attitudes, it is too broad to do the normative work Hedonism requires without further qualification.

  **Is it fatal?**
  *   **To Sensory/Classical Hedonism:** **Yes.** If you define hedonism as "maximizing positive sensations," the Heterogeneity Problem shows the theory is built on a fiction. There is no single currency to maximize.
  *   **To Attitudinal Hedonism:** **No.** This version (championed in contemporary literature by **Fred Feldman**) accepts the Heterogeneity Problem. It concedes that there is no common *feeling*. Instead, it defines pleasure functionally/attitudinally: A person takes pleasure in $X$ if they have a pro-attitude toward $X$ (they are glad $X$ is happening). This unifies the bath, the proof, and the revenge fantasy under "being pleased that..." rather than "feeling a buzz."
  *   **To Qualitative Hedonism (Mill):** **Complicated.** Mill needs a common currency to weigh "higher" against "lower." If there is no common thread, the "competent judge" test becomes difficult to ground.

  ### 3. Differentiation from Nearby Worries
  It is crucial to distinguish the Heterogeneity Problem from the other objections you mentioned, as they attack different layers of the theory.

  | Objection | Target | The Core Question | Relation to Your Problem |
  | :--- | :--- | :--- | :--- |
  | **Heterogeneity Problem** | **Metaphysical / Definitional** | *What is pleasure?* Is it a feeling, an attitude, or a cluster concept? | **This is your problem.** It asks if the term refers to anything unified enough to ground a theory. |
  | **Paradox of Hedonism** | **Psychological / Prudential** | *How do we get pleasure?* Does pursuing it directly defeat the aim? | Distinct. The Paradox assumes we know what pleasure is but argues it is elusive. You can have a unified definition of pleasure and still face the Paradox. |
  | **Experience Machine** (Nozick) | **Axiological / Normative** | *Is pleasure all that matters?* Do we value contact with reality? | Distinct. Nozick assumes the machine *could* give you perfect pleasure. Your problem questions whether "perfect pleasure" is even a coherent concept across different experiences. |
  | **Base Pleasures Objection** | **Moral / Normative** | *Are all pleasures good?* (e.g., Sadism). | Related to your "ugly" revenge example. But your worry is phenomenological ("I wish I didn't feel this"), whereas the Base Pleasures objection is moral ("This shouldn't count toward well-being"). |

  ### 4. How to Frame This in Your Paper
  If there were no established name, I would suggest calling it **The Problem of Phenomenological Disunity**. However, since **The Heterogeneity Problem** is the standard term, you should use that to signal familiarity with the literature.

  **Recommended Boundaries for Your Definition:**
  To state hedonism precisely enough to defend or reject it, you must explicitly choose which theory of pleasure your hedonism relies on. You cannot simply say "pleasure and pain."

  **Option A: Sensory Hedonism (Vulnerable to Heterogeneity)**
  > "Well-being consists in the maximization of positive phenomenological tones and the minimization of negative phenomenological tones."
  > *Critique:* Vulnerable to the Heterogeneity Problem. Fails to account for intellectual or relief-based pleasures that lack a distinct "tone."

  **Option B: Attitudinal Hedonism (Resilient to Heterogeneity)**
  > "Well-being consists in the maximization of episodes where a subject is pleased *that* something is the case, and the minimization of episodes where a subject is displeased *that* something is the case."
  > *Critique:* Solves the Heterogeneity Problem (no common feel required). However, it risks collapsing into **Desire-Satisfaction Theory** (as you noted in your prompt).
  > *Defense:* Feldman argues they are distinct because one can take attitudinal pleasure in something one did not desire beforehand (surprise joy), and one can satisfy a desire without taking pleasure in it (relief of a burden).

  **Option C: Pluralistic Hedonism (The Millian Compromise)**
  > "Well-being consists in the maximization of various distinct goods (sensory, intellectual, aesthetic) that are all intrinsically pleasant, though they share no common phenomenology."
  > *Critique:* This saves the examples but sacrifices the theoretical elegance of Hedonism. It becomes a form of Objective List Theory where "pleasure" is just a label for the items on the list.

  ### 5. Key References for Your Bibliography
  To ground this in the literature, you should engage with:
  1.  **G.E. Moore, *Principia Ethica* (1903):** The classic source of the heterogeneity objection.
  2.  **Gilbert Ryle, *The Concept of Mind* (1949):** Argues pleasure is not a "sensation" but a manner of attending to things.
  3.  **Fred Feldman, *Pleasure and the Good Life* (2004):** The definitive modern defense of **Attitudinal Hedonism** specifically designed to bypass the Heterogeneity Problem.
  4.  **Roger Crisp, *Reasons and the Good* (2006):** Discusses the feeling theory vs. attitudinal theory distinction clearly.
  5.  **Ben Bramble, "The Distinctive Phenomenology of Pleasure" (2013):** A contemporary attempt to save Feeling Theory by arguing there *is* a distinctive feel, just a subtle one. (Good for a counter-argument).

  ### Summary Advice
  Your intuition that "hedonism starts to look like desire-satisfaction in disguise" if you use a functional definition is astute. This is the **Attitudinal Hedonism vs. Desire Satisfaction** debate.

  *   **Desire Satisfaction:** I want $X$ to happen. (Future-directed).
  *   **Attitudinal Pleasure:** I am glad $X$ is happening. (Concurrent).

  If you want to defend Hedonism, you should adopt **Attitudinal Hedonism**. It accepts the Heterogeneity Problem as a refutation of *Sensory* Hedonism but claims Hedonism survives by shifting to attitudes.
  If you want to reject Hedonism, you should argue that the Heterogeneity Problem shows "pleasure" is not a natural kind, and therefore cannot serve as the *sole* currency of value. If "pleasure" is just a label for "things we like," then Hedonism is tautological (Life goes well to the extent you like your life), which offers no explanatory power.

  **Final Verdict:** Call it **The Heterogeneity Problem**. Treat it as a metaphysical challenge to the *definition* of pleasure, distinct from normative challenges about the *value* of pleasure. It is fatal to Sensory Hedonism but survivable for Attitudinal Hedonism.
