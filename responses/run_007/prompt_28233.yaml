answer: |-
  Here is a Q&A prep sheet tailored to your position and audience.

  ### **Q&A Prep Sheet: Pasadena & Domain Restrictions**

  **Strategy Note:** Your core vulnerability is the charge that "incomplete preferences" is just a euphemism for "I have no theory here." You must frame the domain restriction not as a bug, but as a feature of respecting the mathematical structure of expectation. Do not try to solve Pasadena; try to dissolve the demand that it *must* be solved.

  ---

  #### **1. The Completeness Challenge (From the two committed completeness proponents)**
  **The Objection:** "You're saying rational agents can have incomplete preferences over well-defined gambles. But if I offer you the Pasadena game for free, and you refuse it, and I offer it to me for free, and I take it, haven't you violated a basic norm of rationality? Completeness isn't just a mathematical convenience; it's required to avoid leaving value on the table. If EU can't handle it, EU is the problem, not the gamble."

  **2-Minute Reply:** "I deny that rationality requires a comparative judgment in every case. Completeness is a powerful axiom, but it's not a free good. In the Pasadena case, the expectation integral is conditionally convergent. Its value depends on the order of summation, which corresponds to the labeling of states. Since the states in the setup don't come with a privileged ordering, there is no fact of the matter about the expected utility. To demand a preference here is to demand the agent impose an arbitrary structure on the world that isn't there. Refusing to compare isn't irrationality; it's recognizing that the comparison question is ill-posed. We restrict EU to where the math is stable (absolute convergence) and admit silence elsewhere."

  **Soft Spot:** This sounds like giving up. It risks making decision theory look impotent in precisely the paradoxical cases where we need it most.
  **Concede:** Concede that this limits the *guidance* decision theory can offer. Admit that you are trading normative completeness for mathematical stability.
  **Don't Concede:** Do not concede that a rational agent *must* have a price for every gamble.

  #### **2. The Money Pump / Dynamic Consistency Objection**
  **The Objection:** "If your preferences are incomplete, I can money-pump you. I offer you Game A. You're indifferent or undecided between A and B. I swap you to B for a fee. Then I swap you back to A for a fee. If you don't have a strict preference, you'll bleed money. If your theory allows incompleteness, it allows pragmatic self-defeat."

  **2-Minute Reply:** "This assumes that 'incomplete preference' entails 'indifference to swapping.' It doesn't. My view includes structural principles, specifically that you shouldn't pay to swap labels on states. In a dynamic context, the agent can adopt a policy: 'I do not trade gambles that are incomparable under absolute expectation unless dominance is violated.' The money pump relies on the agent treating incomparability as indifference. If the agent treats incomparability as a 'stop' signal—a refusal to engage in the trade cycle—the pump is blocked. The rationality constraint shifts from 'maximize utility' to 'do not enter cycles of dominated trades.'"

  **Soft Spot:** Defining the "stop signal" precisely without smuggling in a complete ordering is notoriously difficult (see Aumann's critiques).
  **Concede:** Concede that this requires a more complex model of dynamic choice than standard EU.
  **Don't Concede:** Do not concede that incompleteness *necessarily* leads to pumping.

  #### **3. The Altadena / Dominance Puzzle**
  **The Objection:** "Consider the Altadena game: it's identical to Pasadena, but every payoff is increased by $1. Altadena statewise dominates Pasadena. Do you prefer Altadena? If yes, you're acting as if Pasadena has a value (V) and Altadena has (V+1). If no, you've violated statewise dominance. You can't have dominance without values."

  **2-Minute Reply:** "I can accept statewise dominance without assigning a scalar value. I can say 'I prefer Altadena to Pasadena' because for every state *s*, U(Altadena, *s*) > U(Pasadena, *s*). That is a valid ordinal judgment derived directly from the utility function on outcomes, without summing across states. The mistake is thinking that to prefer A to B, I must believe E[A] > E[B]. In this domain, preference is grounded in statewise comparison, not expected value calculation. I get the dominance result without committing to the claim that E[Pasadena] exists."

  **Soft Spot:** If you prefer Altadena, can you be sold Altadena for $X and Pasadena for $X+1? This starts to look like pricing again.
  **Concede:** Concede that your preference relation is partial and cannot always be represented by a utility function over gambles.
  **Don't Concede:** Do not concede that dominance requires a summation convention.

  #### **4. The "Arbitrary Line" Objection**
  **The Objection:** "Why absolute convergence? That's a very strong condition. Conditional convergence is mathematically respectable. By drawing the line at absolute summability, you're just cherry-picking the cases where EU works and ignoring the rest. It looks ad hoc to save the theory rather than fixing it."

  **2-Minute Reply:** "It's not ad hoc; it's about invariance. Absolutely convergent series are invariant under rearrangement. Conditionally convergent series are not. In decision theory, the labeling of states should not determine the value of the gamble (the 'reordering invariance' principle). Absolute convergence is the *only* mathematical condition that guarantees this invariance. So the line isn't drawn to save EU; it's drawn to respect the structural requirement that the value of a gamble shouldn't depend on how we index the states."

  **Soft Spot:** Some might argue that physical processes induce a natural ordering (e.g., time), making rearrangement irrelevant.
  **Concede:** Concede that if a natural ordering exists (e.g., temporal sequences), conditional convergence might be manageable, but not for abstract state spaces.
  **Don't Concede:** Do not concede that absolute convergence is too restrictive for theoretical purposes.

  #### **5. The "Ban Infinity" Objection (From the Probability Philosopher)**
  **The Objection:** "You're trying to patch EU to handle infinite gambles. But the real lesson of Pasadena is that infinite state spaces are illegitimate in decision theory. Physical reality is finite. We shouldn't be building theories to accommodate mathematical monsters. Just ban infinite gambles."

  **2-Minute Reply:** "While physical reality may be finite, decision theory is a normative theory about reasoning, not just physics. We use infinite models to approximate large finite ones, much like we use continuous probability for discrete coins. If our theory breaks down in the limit, it suggests our understanding of the finite cases is fragile. Furthermore, banning infinite spaces doesn't solve the conceptual issue: it just sweeps the convergence problem under the rug. We need to know *why* the expectation fails, not just pretend the space is finite."

  **Soft Spot:** The economist and philosopher might ally here to say "approximations don't need to be exact."
  **Concede:** Concede that for *applied* work, finite approximations are sufficient.
  **Don't Concede:** Do not concede that foundational theory should ignore infinite cases.

  #### **6. The "Who Cares?" Objection (From the Economist)**
  **The Objection:** "No real-world gamble has an infinite payoff structure or infinite states. This is angels on pinheads. Why should we care about a restriction on EU that never binds in practice?"

  **2-Minute Reply:** "Because the Pasadena game isn't about the payoff; it's about the logic of aggregation. It reveals that 'summing utilities' is not a coherent operation in all contexts. Even in finite cases with very large numbers, if we rely on intuition about expectations that behaves like conditional convergence, we risk instability. Understanding the boundary conditions of EU tells us when our standard tools are robust and when they are sensitive to modeling choices. That's relevant for risk management and long-termist planning, where tails matter."

  **Soft Spot:** It's hard to prove a finite case behaves "like" Pasadena without actually being infinite.
  **Concede:** Concede that direct applications are rare.
  **Don't Concede:** Do not concede that foundational clarity is irrelevant to practice.

  #### **7. The Secret Hope (The Question You Don't Want)**
  **The Question:** "You say you don't assign a value, but you accept dominance and label invariance. Haven't you just reinvented Easwaran's Weak Expectation or a specific summation convention without admitting it? If your structural principles yield a unique recommendation in all cases, isn't that functionally equivalent to assigning a value?"

  **Why it hurts:** If your structural principles *do* the work of a summation convention, your claim that "assigning a value is a mistake" collapses. You're doing the same math but refusing to call it a "value."

  **2-Minute Reply:** "There is a difference between generating a recommendation and assigning an expectation value. Weak Expectation attempts to define a number that represents the gamble. My structural principles merely rule out *incoherent* choices (like paying to swap labels). They might narrow the set of permissible options without singling out a unique 'value' in the sense of a real number that satisfies the algebra of expectation. I am offering a logic of choice, not a calculus of valuation."

  **Soft Spot:** This distinction is thin. If the logic of choice is deterministic, it looks like a valuation.
  **Concede:** Concede that the *action-guiding* force might be similar to Weak Expectation.
  **Don't Concede:** Do not concede that this commits you to the *existence* of the expectation value itself.

  ---

  ### **Confidence Assessment**

  **Confidence Level:** **85%**
  I am highly confident in the standard objections (Completeness, Money Pump, Altadena) as these are well-trodden ground in the literature surrounding Nover, Hájek, and Easwaran. The replies provided align with the standard "domain restriction" defense (similar to Colyvan's or Easwaran's earlier positions).

  **Least Sure Point:** **The Money Pump Reply.**
  I am least confident in the robustness of the "stop signal" defense against money pumps. There is a significant body of literature (e.g., by Ted Seidenfeld or Isaac Levi) suggesting that incomplete preferences are extremely difficult to make dynamically consistent without essentially reconstructing a complete ordering. If the audience presses on *how* the agent commits to the "no trade" policy without a higher-order utility function, you may find yourself in a regress. Be prepared to admit that dynamic choice with incomplete preferences is an open research problem, rather than claiming you have a settled solution.
