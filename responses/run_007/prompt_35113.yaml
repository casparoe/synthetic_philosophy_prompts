answer: |-
  Sir, you press me with a vigour that does you honour, and I confess that your objection strikes at the very heart of the difficulty. It is the natural revolt of reason when it perceives the ambiguity of our condition. You ask if I have not merely dressed tyranny in the robes of necessity, and if my union of force and justice does not ultimately surrender truth to the sword.

  I must beg you to observe a distinction which is often lost in the heat of dispute, though it is as clear as any geometric axiom: the distinction between what *is* just in itself, and what is *called* just among men.

  When I write that justice without force is powerless, I am not speaking of the eternal law of God, which stands immutable regardless of the armies of the earth. I am speaking of the justice of this world, of civil society, of the commerce of men. Here, you must concede the melancholy truth of our experience. If a law be perfectly equitable, yet lacks the power to compel obedience, what becomes of it? It is mocked by the wicked. The weak are devoured. The order of society collapses into the state of nature, which is a war of all against all. Thus, force is the instrument by which justice is *preserved*, not that by which it is *created*.

  You fear that I hand the definition of justice to whoever holds the sword. I answer you: in the tribunals of kings, this is often the tragic reality. I do not deny it; I lament it. Is it cynicism to point out a wound? I describe the misery of man, not to justify it, but to show you why we cannot rely upon human virtue alone. Because men are corrupted—this is the Augustinian truth we must not flee—they will not follow justice merely because it is beautiful. They must be compelled.

  However, do not mistake my meaning. I do not say that because a king enforces a law, that law becomes true in the eyes of Heaven. I say only that for peace to endure among such creatures as we are, the authority must be respected. When custom has established a law, we obey it not always because it is perfect—for many customs are founded upon ancient errors or conquests—but because to dispute every foundation is to invite chaos. As I have noted elsewhere, we do not destroy the ship because it was built by hands that might have been steadier; we sail it to avoid drowning.

  So, when I say we must make what is strong just, I am prescribing a duty to those who govern, not granting a licence to tyrants. It is a command to the powerful: "You have the force; now bend your will to align it with true justice, so far as a fallen mind can perceive it." And to the subject, I say: "Obey the force, for order is a good, but keep your conscience reserved for God."

  Your objection assumes that I believe earthly justice is the final justice. But I am a Christian, Sir. I know that true justice resides only in the Divine. Earthly laws are but shadows. If the powerful pronounce their cause just, they may deceive the world, but they do not deceive God. My framework does not guarantee that might makes right in the eternal sense; it guarantees only that without might, right is trampled in the temporal sense.

  Is this not a distinction of consequence? To acknowledge that we need a sword to keep the peace is not to say that the sword is the source of truth. It is merely to admit that we are not angels. If we were angels, we would need neither force nor laws. Since we are men, wounded by concupiscence, we need both. To demand that justice stand alone without force is to demand of this world what it cannot give. It is to seek the City of God amidst the ruins of Babylon.

  I ask you, then: do you prefer the tyranny of the wicked who oppress without law, or the ordered imperfection of a state that strives, however clumsily, to wed the sword to the scale? I choose the latter, not because it is perfect, but because it is the only refuge from total barbarism. We must not confuse the scaffold with the truth, but neither must we dismantle the scaffold and leave the innocent to the mercy of the wolf.
