answer: |-
  # Lesson Plan: The Speculative Market Simulation
  **Topic:** Epistemology of Markets / No-Trade Theorems (Milgrom-Stokey, Aumann)
  **Time:** 80 Minutes
  **Students:** 14 (Upper-level Philosophy/Economics)
  **Goal:** Students experience the erosion of speculative gain through information revelation before learning the formal theory.

  ---

  ## I. Setup and Materials

  **Room Arrangement:**
  *   7 tables, 2 students per table.
  *   Students at the same table are **partners** for the session but **counterparties** in the market. They cannot talk to other tables.
  *   Instructor station with projector.

  **Materials:**
  1.  **Signal Envelopes (14 per round):** Each contains a card reading either **GOOD NEWS** or **BAD NEWS**.
  2.  **Order Sheets (14 per round):** A simple form with fields: *Name, Signal, Action (Buy/Sell/Pass), Price Limit, Signature.*
  3.  **Scorecards (1 per student):** To track points across rounds.
  4.  **Projector Slides:**
      *   Slide 1: Asset Rules & Payoffs.
      *   Slide 2: Round Timer.
      *   Slide 3: Market Results (Volume, Clearing Price).
      *   Slide 4: True Value Reveal.
  5.  **Currency:** "Epistemic Points" (EP). 10 EP = 1% toward final course participation grade. (Cap losses at 0 for the session to prevent anxiety, but track negative theoretical balances).

  **The Asset ("Venture Bond"):**
  *   **True Value ($V$):** Either **\$0** or **\$100**.
  *   **Prior Probability:** $P(V=\$100) = 0.5$. (Publicly announced).
  *   **Private Signal:** Each student receives one signal correlated with $V$.
      *   If $V=\$100$: 80% chance of **GOOD**, 20% **BAD**.
      *   If $V=\$0$: 80% chance of **BAD**, 20% **GOOD**.
  *   **Transaction Cost:** Any trade incurs a **\$2 fee** (deducted from both parties).
      *   *Buyer Payoff:* $V - \text{Price} - 2$
      *   *Seller Payoff:* $\text{Price} - V - 2$
      *   *No Trade Payoff:* $0$

  ---

  ## II. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & Instructions (No Theory)
  *   **Seating:** Assign pairs.
  *   **Handouts:** Distribute Scorecards and Slide 1 (Rules).
  *   **Script:** "You are traders in a market for a Venture Bond. The bond pays \$0 or \$100. The probability is 50/50. You will receive private information. You may propose to buy or sell to your partner. If you agree, you trade. If not, you hold. Your goal is to maximize Epistemic Points. There is a \$2 transaction fee on every trade. Do not discuss your signals with your partner until the end of the session."
  *   **Check:** Ensure they understand the fee makes breaking even insufficient; they need a \$2+ edge to profit.

  ### 0:10 – 0:25 | Round 1 (The Naive Market)
  *   **0:10:** Distribute Signal Envelopes. (Instructor pre-draws $V$ for this round, e.g., $V=100$, then draws signals consistent with probabilities).
  *   **0:12:** Students open signals.
  *   **0:13:** **Trading Phase (5 mins).** Students write a Bid (if buying) or Ask (if selling) on the Order Sheet. They show it to their partner.
      *   *Rule:* If Bid $\ge$ Ask, trade executes at the midpoint. Both sign.
      *   *Rule:* If no agreement, both mark "No Trade."
  *   **0:18:** Collect Order Sheets.
  *   **0:20:** **Market Announcement.** Project Slide 3: "Round 1 Volume: X trades. Average Price: \$Y." **Do not reveal $V$ yet.**
  *   **0:22:** **Reflection Prompt (Written):** "If you traded, what does your partner's willingness to trade tell you about their signal? Does this change your estimate of $V$?"
  *   **0:25:** Reveal $V$ (Slide 4). Students calculate payoffs on Scorecards.

  ### 0:25 – 0:40 | Round 2 (The Adjustment)
  *   **0:25:** Reset. New $V$ drawn (e.g., $V=0$). New Signals distributed.
  *   **0:27:** **Trading Phase (5 mins).** Same rules.
  *   **0:32:** Collect Sheets. Announce Volume/Price.
  *   **0:35:** **Intervention:** "Look at your Round 1 payoffs. Did the traders make money on average? Remember the \$2 fee."
  *   **0:37:** Reveal $V$. Calculate Payoffs.
  *   **0:40:** *Observation:* Typically, volume drops here as students realize the "Winner's Curse" logic.

  ### 0:40 – 0:55 | Round 3 (The Equilibrium)
  *   **0:40:** Reset. New $V$ drawn. New Signals.
  *   **0:42:** **Trading Phase (5 mins).**
  *   **0:47:** Collect Sheets.
  *   **0:48:** **Pause.** Before revealing volume or $V$, ask for a show of hands: "How many pairs traded?"
  *   **0:50:** Reveal Volume (Likely near zero). Reveal $V$. Calculate Payoffs.
  *   **0:55:** Collect all materials.

  ### 0:55 – 1:20 | Debrief & Theory (The "Aha" Moment)
  *   **0:55:** **Empirical Review.** Plot Round 1, 2, 3 volume on the board. It should trend down.
  *   **1:00:** **The Epistemic Autopsy.** Pick a Round 1 trade.
      *   "Buyer had GOOD. Valued at \$80. Seller had BAD. Valued at \$20. Price \$50."
      *   "Buyer thought: 'I gain \$30 minus fee.'"
      *   "But: The fact that Seller sold at \$50 reveals Seller had BAD news."
      *   "If Buyer updates on *that*, Buyer's info is {GOOD, BAD}. Net signal is neutral. $E[V] = \$50$."
      *   "Payoff at \$50 is \$0. Minus \$2 fee = -\$2."
      *   "Rational move? Don't trade."
  *   **1:10:** **Formal Mapping.** Introduce terms: *Common Prior, Common Knowledge, Bayesian Updating.* State the **No-Trade Theorem**.
  *   **1:15:** **Real World Contrast.** Why do real markets trade? (Liquidity needs, hedging, non-common priors, bounded rationality).
  *   **1:20:** Dismiss.

  ---

  ## III. The Debrief: Mapping Game to Theory

  Do not lecture until this point. Use the Socratic method to draw the theory out of their experience.

  | Game Moment | Formal Concept | Instructor Script / Connection |
  | :--- | :--- | :--- |
  | **The 50/50 Prior** | **Common Prior** | "We all started with the same probability distribution. No one had a 'hunch' about the market structure itself." |
  | **The Private Card** | **Private Information** | "Your signal was correlated with value, but noisy. This created initial disagreement." |
  | **The Order Sheet** | **Action as Signal** | "When you wrote 'Buy at \$60', you didn't just state a price. You sent a message. You revealed your signal was likely GOOD." |
  | **The Partner's Acceptance** | **Common Knowledge** | "When your partner accepted, it became common knowledge that *they* were willing to trade at that price. You knew they knew you were willing." |
  | **The \$2 Fee** | **Strict Inequality** | "Without the fee, expected gain was 0. With the fee, expected gain was negative. Rational agents require strictly positive expected utility to act." |
  | **Round 3 Silence** | **No-Trade Equilibrium** | "By Round 3, you realized that any price acceptable to both of you implies the asset is worth exactly that price (minus fees). Trade evaporates." |
  | **Real Markets** | **Violating Assumptions** | "So why does Wall Street exist? Because people have different priors, need cash for rent (liquidity), or aren't perfect Bayesians." |

  **Key Theorem to State:**
  "The **Milgrom-Stokey No-Speculative-Trade Theorem**: If agents are risk-neutral Bayesians with common priors, and trade is common knowledge, no speculative trade occurs. Willingness to trade reveals information that eliminates the gain from trade."

  ---

  ## IV. Troubleshooting: What Will Go Wrong

  **1. Students Trade Aggressively in Round 3**
  *   **Cause:** Gambling behavior or misunderstanding the fee.
  *   **Fix:** In the debrief, calculate their *actual* losses. "You traded at \$50. Value was \$0. You lost \$52. Why did you ignore the signal sent by the seller?" Use the loss to prove the theorem's normative force.

  **2. Volume Doesn't Drop (Persistent Trade)**
  *   **Cause:** Students view it as a "game" to beat the partner, not an optimization problem.
  *   **Fix:** Highlight the *aggregate* score. "The class lost 50 points total in Round 2. The market destroyed value. This is the 'Deadweight Loss' of ignoring epistemic constraints."

  **3. Confusion on Bayesian Updating**
  *   **Cause:** Mental math is hard under time pressure.
  *   **Fix:** Have the posterior calculations pre-printed on a "Cheat Sheet" handed out *after* Round 1.
      *   *Signal GOOD:* $E[V] = \$80$.
      *   *Signal BAD:* $E[V] = \$20$.
      *   *Signal GOOD + Partner Sells (implies BAD):* $E[V] = \$50$.
      *   This removes calculation error as an excuse for trading.

  **4. Collusion / Signaling**
  *   **Cause:** Partners whispering ("I have Good, you?").
  *   **Fix:** Strict silence rule. "If I hear communication, the round is voided and everyone gets 0 points." The threat must be credible.

  **5. The "Zero Sum" Confusion**
  *   **Cause:** Students think one must win and one must lose.
  *   **Fix:** Emphasize the *Transaction Cost*. It makes the game Negative-Sum. The only way to "win" is not to play. This mirrors the theorem's claim that speculative trade is welfare-reducing under these constraints.

  ---

  ## V. Limitations: What This Activity Cannot Do

  Be candid with the students in the final 5 minutes about the gap between the classroom and the theorem.

  1.  **Enforced Common Prior:** In the game, I *told* you the prior was 50/50. In reality, we never truly share priors. You might think I'm rigging the signals. The theorem assumes we *know* we share priors.
  2.  **Common Knowledge of Rationality:** The game relies on you believing your partner is a rational Bayesian. If you think your partner is a gambler, you *should* trade against them (as a "noise trader"). The theorem collapses if rationality isn't common knowledge.
  3.  **The "Price" Mechanism:** In the game, price is a midpoint negotiation. In formal models (like Aumann's), the theorem holds even without a price mechanism—it's about agreeing on probabilities. We used price to make it tangible, but the core logic is about *belief convergence*.
  4.  **Dynamic Updating:** Real markets update continuously. We did discrete rounds. The "No-Trade" result in reality is a dynamic process of orders being cancelled, not just a static refusal to trade.
  5.  **Instructor's Role:** I had to enforce the rules (the "structure of the world"). In the theorem, the structure is logical necessity. I am the external enforcer of the "Common Prior" condition; in the wild, that condition must be internal to the agents.

  **Closing Note to Instructor:**
  You must supply the **normative weight**. The game shows them *that* trade stops (or loses money). You must explain *why* this is a feature, not a bug. A market that refrains from speculative trade when information is symmetric is an **efficient information processor**, not a failed one. The silence of the market in Round 3 is the sound of rationality working.
