  # JOINT STATEMENT ON TELETRANSPORTATION AND PERSONAL IDENTITY
  **Adversarial Collaboration between the Psychological Continuity Camp (PCC) and the Bodily Continuity Camp (BCC)**

  **Date:** October 26, 2023
  **Signatories:** Representing the Psychological Continuity Camp (Parfitian/Reductionist) and the Bodily Continuity Camp (Animalist/Biological)

  ## 1. AGREED CLAIMS

  We, the undersigned, agree to the following premises and boundaries for this collaboration. We acknowledge that while we share a vocabulary, we assign different ontological weights to specific terms.

  1.  **The Mechanics of the Case:** We agree on the standard *Star Trek* description of the transporter: It scans the complete physical state of a person, transmits that information to a remote location, reconstructs a physical duplicate using new matter, and (critically) destroys the original body during the scan. We agree to treat the technology as functionally perfect (no data loss, no reconstruction errors).
  2.  **The Fission Problem:** We agree that cases of "fission" (where one psychological stream splits into two equally valid successors, e.g., hemispheric transplantation) pose a logical problem for strict numerical identity. Since identity is transitive (if A=B and A=C, then B=C) but fission produces two distinct people, strict identity cannot hold in fission cases without contradiction.
  3.  **What This Is Not About:**
      *   **Semantics Only:** We agree this is not merely a verbal dispute about the word "person." It is a substantive disagreement about what grounds rational self-concern, moral responsibility, and survival.
      *   **Technological Feasibility:** We bracket the engineering difficulties of Heisenberg compensators or bandwidth. We are discussing the metaphysical implications of the *process*, assuming it works as described.
      *   **Non-Physical Souls:** We agree to bracket dualistic claims regarding immaterial souls unless those claims can be cashed out in terms of functional or causal continuity.
      *   **Git Analogies:** We acknowledge that while software analogies (branching, rebasing, copying) are useful heuristics for information flow, they are insufficient to resolve the debate. Code is abstract and type-identical; human beings are concrete and token-identical. A `git commit` does not feel pain; a human organism does.

  ## 2. DISAGREEMENTS AND CRUXES

  The following table outlines our residual disagreements, phrased to ensure charitable interpretation, followed by the specific "cruxes" (empirical or conceptual tests) that bear on them.

  | Domain | Psychological Continuity Camp (PCC) | Bodily Continuity Camp (BCC) |
  | :--- | :--- | :--- |
  | **Core Claim** | **Survival is Pattern Preservation.**<br>What matters in survival is the continuity of psychology (memories, character, intentions). If the pattern continues, *I* survive, even if the substrate changes. The transporter preserves what matters. | **Survival is Organism Persistence.**<br>I am a human animal. Survival requires the continued biological existence of this specific organism. The transporter kills the organism; therefore, it kills me. The recipient is a distinct, qualitatively identical individual. |
  | **View on Death** | **Death is Irreversible Information Loss.**<br>If the psychological pattern is preserved and instantiated elsewhere, biological cessation of the original substrate is not "death" in the morally relevant sense. | **Death is Biological Cessation.**<br>When the biological functions of the organism cease (are vaporized), the person ceases to exist. A duplicate appearing elsewhere does not negate the death of the original. |
  | **Fission Implication** | **Identity Is Not What Matters.**<br>In fission, strict identity fails, but *survival* succeeds (double survival). This proves identity is not the basis of rational self-concern. | **Fission Creates New People.**<br>In fission, the original organism ceases to be uniquely continuous. The result is the death of the original and the creation of two new, distinct organisms who inherit the original's history. |

  ### CRUXES
  *Sub-questions where settling the fact or intuition would force at least one side to revise their position.*

  | # | Crux Question | Concrete Case / Argument | PCC Prediction / Stance | BCC Prediction / Stance |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Non-Destruction Variant**<br>Does the *destruction* of the original matter, or is it incidental? | The transporter malfunctions and fails to vaporize the original. There are now two physically present individuals (Original and Copy) with identical psychology up to T=0. | **Two People.**<br>We admit there are now two distinct persons. This proves identity is not what matters, as both have equal claim to the past. Destruction is just a practical cleanup step, not metaphysical magic. | **One Person + One Copy.**<br>The Original remains *the* person. The Copy is a new entity. If the transporter *always* leaves the original alive, it is clearly a copying machine. Destroying the original doesn't change the copy's status; it just hides the evidence of death. |
  | **2** | **Gradual Replacement (Ship of Theseus)**<br>At what point does substrate replacement break identity? | We replace your neurons one by one with synthetic functional equivalents over 10 years. By the end, 100% of your biological matter is replaced, but psychological and biological function is continuous. | **Identity Preserved.**<br>Continuity of function and psychology is sufficient. There is no magic moment where "you" vanish, provided the transition is gradual and continuous. | **Identity at Risk.**<br>While gradual replacement is more plausible than teleportation, a 100% synthetic replacement eventually constitutes a new entity. I am my biology; if the biology is fully swapped, the animal is gone. |
  | **3** | **Rational Self-Concern**<br>Why should I care about the future person? | You are about to be teleported. You are asked: "Should you fear death as much as if you were executed without a copy?" | **No Fear.**<br>Rational self-concern tracks psychological connectedness. Since the person on the other end has my memories and goals, my current self-concern extends to them. Fear is irrational. | **Total Fear.**<br>Rational self-concern tracks numerical identity. Since the organism here will cease, I should fear this exactly as much as execution. The copy's happiness does not alleviate *my* cessation. |

  ***

  ## 3. META-NOTE: VULNERABILITY ASSESSMENT

  **Most Pivotal Crux:**
  **Crux #1 (The Non-Destruction Variant)** is the structural weak point of this document. If the PCC concedes that the *presence* of the original makes the remote person a "copy," but the *absence* of the original makes the remote person "survival," the BCC will argue this is metaphysical magic (i.e., "death by teleportation is just a magic trick that relies on hiding the body"). If the PCC holds firm that the remote person is "you" regardless of whether the original lives or dies, they must accept that "you" can be in two places at once, which strains the definition of identity. **If this crux is settled against the PCC (i.e., if it is agreed that the survival of the original negates the identity of the copy), the PCC section of this document requires a total rewrite**, as it undermines the claim that the transporter preserves the person rather than creating a successor.

  **Shakiest Wording / Risk of Rejection:**
  The **BCC Core Claim ("I am a human animal")** is the most likely to be rejected by an actual Animalist as uncharitable, specifically the phrase *"The duplicate... is a distinct, qualitatively identical individual."*
  *   **Reason:** Hardline Animalists (like Eric Olson) often argue that the duplicate is not just a "distinct individual" but arguably *not a person* in the same moral sense, or they may object to the implication that "biological cessation" is the only metric. Some Animalists might argue that if the brain is transplanted, the animal goes with it. The wording here implies a "whole organism" view that might be too broad for Animalists who focus on *brain* continuity as the key biological function.
  *   **Risk:** A BCC signatory might argue I have softened their view too much by focusing on "organism" rather than "brainstem function." Conversely, the PCC phrasing *"Death is Irreversible Information Loss"* risks being rejected by Parfitians who argue that "Death" is the wrong word entirely—they don't think death occurs, so defining it differently is a concession they shouldn't make. However, the BCC wording is shakier because it treads closer to "meat chauvinism" which they dislike, whereas the PCC wording is their standard elevator pitch.

  **Overall Stability:**
  The document is stable *provided* both sides accept that "Survival" and "Identity" are being treated as potentially distinct concepts (the Parfitian move). If the BCC insists that Survival *requires* Identity, the "Agreed Claims" section on Fission becomes contradictory. The collaboration holds only if the BCC accepts that Fission breaks Identity but maintains that it also breaks Survival.
