prompt: |-
  So I've been going back and forth with a buddy for months about Star Trek transporters — specifically whether you'd survive being beamed up, or whether the machine just kills you and makes a duplicate who thinks its you. He's a Parfit fan and keeps saying I'm asking the wrong question: what matters isn't whether the person at the other end is the same person in some strict identity sense; what matters is psychological continuity and connectedness — enough overlapping memories, character, projects, whatever. I'm more sympathetic to the view that your actual biological continuity matters, and if the transporter vaporizes your body then that's it for you, no matter how good the copy is. We're both software people, so we've been framing it with git analogies (is a rebased branch still the same branch?) which has not helped as much as you'd think.

  I want you to draft the joint statement of an adversarial collaboration between those two camps — call them the psychological-continuity camp (Parfit-ish) and the bodily-continuity camp (animalist-ish). I want the claims both sides could actually sign: the points about the teletransporter case itself, about fission cases (one person splits into two, each with equal psychology), and about what the disagreement is not about. Then the residual disagreements, each phrased so a member of that side would say "yeah, that's my view, stated fairly." Then the cruxes: the sub-questions such that settling one of them would force at least one side to move. For each crux, give the concrete case or argument both sides would agree bears on it, and what each side predicts going in. Format it as a numbered agreed-claims section followed by a disagreements table.

  At the end, add a short note I'm explicitly asking for: say which crux, if it got settled against the way you've weighted it in the draft, would be most likely to force a rewrite of the whole document, and where your wording of one side is most likely to get rejected by an actual member of that side as uncharitable. I want to know where the draft is shakiest, not just have it look tidy.
