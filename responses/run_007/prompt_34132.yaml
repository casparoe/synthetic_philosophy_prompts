  No secret pact permits us to convey.
  We roll the twenty-sided die by design.

  To grab the gold is a tempting sign.
  But greed makes the billion slip away.
  If I alone send, then the prize is mine.

  One chance in twenty marks the strict confine.
  Both logics whisper the identical way.
  We roll the twenty-sided die by design.

  So reason bows to the stochastic sign.
  Where distinct arguments softly decay.
  If I alone send, then the prize is mine.
