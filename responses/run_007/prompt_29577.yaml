      *   *Crux 2: The Boundary Problem.* How are minds separated? CP needs to explain why a brain is one mind, not a billion. COS needs to explain why *I* am not *You*.
      *   *Crux 3: Evolutionary Continuity.* CP fits gradual evolution better? COS fits sudden dissociation?
      *   *Crux 4: Quantum/Physical Integration.* Does physics suggest bottom-up emergence or top-down constraint?

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is this too abstract?
