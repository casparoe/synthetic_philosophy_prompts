      *   *Dimension 2: Nature of Fundamental Subjects.* CP: Plurality of simple subjects. COS: Singular complex subject.
      *   *Dimension 3: The Core Mechanism.* CP: Phenomenal Composition (Summation/Integration). COS: Phenomenal Dissociation (Partitioning/Filtering).
      *   *Dimension 4: The "Harder" Problem.* CP admits Combination is hard. COS admits Individuation is hard. Where is the friction? It's about which is *more* intelligible.
      *   *Dimension 5: Physical Correlates.* CP looks for integration mechanisms (IIT-ish). COS looks for boundary mechanisms (membranes, decoherence).

  5.  **Drafting Section 3: Cruxes:**
