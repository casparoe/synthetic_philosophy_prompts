      *   **Cosmopsychism (COS):** The Universe as a whole is the fundamental conscious entity. Macro-subjects (humans) are dissociated alters or fragments of the cosmic subject. *Problem:* How does the One become Many? (The De-combination/Individuation Problem).
      *   **Common Ground:** Physicalism is insufficient for consciousness (the Hard Problem). Consciousness is fundamental or ubiquitous. Structural/functional accounts fail to capture phenomenal character.
      *   **Genuine Disagreement:** Direction of metaphysical dependence (Bottom-up vs. Top-down). The nature of subjecthood (Atomic vs. Holistic). The mechanism of relation (Composition vs. Dissociation).

  3.  **Drafting Section 1: Shared Claims (Common Ground):**
