answer: |-
  **MEMORANDUM**

  **TO:** Style Committee, University Press
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Nonsexist Language Policy for Revised Style Guide

  **Purpose**

  This memo outlines a recommendation regarding the proposed mandatory nonsexist-language policy for the Press's revised house style guide. As we prepare for Thursday's meeting, my goal is to bridge the divide between the faction advocating for inclusive language mandates and the faction, led by our Senior Editor, advocating for a descriptivist approach that records rather than legislates usage.

  After reviewing the arguments, I recommend adopting a **modified mandatory policy**. This approach distinguishes between text generated by the Press and text generated by authors, ensuring our institutional voice meets modern standards of inclusivity without compromising scholarly integrity or imposing undue burdens on contributors.

  **Engaging the Descriptivist Position**

  The Senior Editor's position rests on a robust linguistic principle: a style guide should describe accepted usage rather than impose ideological preferences. The argument is that generic *he* and compounds like *manpower* are settled conventions that competent readers process effortlessly as gender-neutral. To ban them is to prioritize political signaling over clarity and tradition, potentially dating our publications or alienating authors in fields where these terms remain standard.

  This is not a trivial objection. Prescriptivism can indeed slide into pedantry, and there is value in a press that reflects the language of the academy rather than dictating it. However, a house style guide is, by definition, a prescriptive document for the institution that publishes it. We already legislate usage on hyphenation, citation, and capitalization. The question is not *whether* we legislate, but *where* we draw the line.

  **The Stakes: Recoverability and Harm**

  The crux of the disagreement lies in whether the recoverability of meaning settles the question of harm. The descriptivist view holds that if a reader understands "the author... he" to mean "the author... he or she," no communication has failed.

  Douglas Hofstadter's satirical *A Person Paper on Purity in Language* (published under the pseudonym William Satire) sharpens this issue without requiring us to accept every premise of the satire. Hofstadter constructs a parallel argument regarding racial language, demonstrating that the defense of "tradition" and "ease of processing" often masks an unwillingness to bear the cost of inclusion. The satire reveals that just because a reader *can* recover an intended meaning does not mean the language is neutral. Generic terms often function as a default setting that implicitly excludes non-male persons from the category of "standard" human experience.

  If we accept Hofstadter's reductio, the argument that "readers understand generic *he*" is insufficient. The issue is not cognitive load; it is signaling. When our catalog copy or editorial introductions use male defaults, we signal that the Press's institutional voice assumes maleness as the norm. For a university press dedicated to the diffusion of knowledge, signaling exclusion is a reputational and ethical risk we cannot afford.

  **Recommended Policy**

  To balance inclusivity with scholarly freedom, I propose the following tiered policy:

  1.  **Press-Generated Prose (Mandatory):** All text written by Press staff must adhere to gender-neutral standards. This includes catalog copy, marketing materials, series introductions, prefaces written by editors, and the style guide itself.
      *   *Requirements:* No generic *he*; no *man*-compounds (e.g., use *chair*, *workforce*, *synthetic*); balanced examples in usage notes.
      *   *Rationale:* This is the voice of the institution. We have full control here and must model the standards we wish to see.

  2.  **Author Manuscripts (Required with Waiver):** New publishing contracts will require manuscripts to adhere to gender-neutral language.
      *   *Requirements:* Authors will be asked to revise generic pronouns and compounds during copyediting.
      *   *Discretion:* Exceptions will be granted for disciplinary conventions (e.g., historical texts, specific philosophical contexts) or where revision would distort the author's argument. This respects the Senior Editor's concern about ideological imposition while establishing a default expectation of inclusivity.

  3.  **Quoted Material (Protected):** No alterations will be made to quoted material, primary sources, or historical documents.
      *   *Rationale:* We cannot alter the historical record. Integrity of citation supersedes style preferences.

  **Implementation Timeline**

  *   **Immediate:** Style Committee to finalize specific wording for the guide based on this vote.
  *   **January 1, 2024:** New policy applies to all new publishing contracts and all Press-generated marketing copy.
  *   **Fall 2024:** Full compliance expected for all books entering production. Backlist titles will be updated only upon reprint.

  **Conclusion**

  We can acknowledge the descriptivist insight that language changes slowly without conceding that the Press should be passive in that change. By mandating neutrality in our own prose and setting it as the default for authors, we respect the scholarship we publish while ensuring the Press itself remains an inclusive institution.

  **Motion for Vote**

  I move that the Style Committee adopt the "Tiered Nonsexist Language Policy" as outlined above, requiring gender-neutral usage in all Press-generated prose and as a default standard for new author manuscripts, with explicit protections for quoted material and disciplinary waivers.

  ***

  **Action Required:** Please review this recommendation prior to Thursday's session. I look forward to discussing how we can refine the waiver process to ensure it is applied fairly.
