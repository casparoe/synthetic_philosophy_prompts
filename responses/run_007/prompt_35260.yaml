      *   *Principle 2: Moral Forfeiture / Character-Based Retributivism (Nuanced Backward-Looking).* Punishment is deserved based on the *moral character* demonstrated by the act. If the character has fundamentally changed, the basis for punishment might vanish. OR, perhaps a "Statute of Limitations" moral principle? No, that's usually pragmatic. Let's look for a philosophical distinction.
