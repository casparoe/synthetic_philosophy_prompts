prompt: |-
  I sit on the board of a mid-sized public art museum. For three years we have been preparing a major retrospective of the late painter Adrian Voss, whose large-scale figurative canvases are widely regarded as among the most formally accomplished of the past half-century; the exhibition was meant to anchor our newly renovated wing. Last month a coalition of local artists and survivors' advocates demanded that we cancel the retrospective and remove Voss's work from the galleries, citing extensive posthumous reporting that he sexually exploited a series of young women who worked in his studio as assistants and models. Several of the paintings in the show are portraits of those women, long praised for their psychological depth. The women themselves are not of one mind: some have asked the museum to take the portraits down, saying their public display re-enacts the original violation, while at least one former assistant has argued that hiding the work would spare Voss's reputation and that the paintings should stay up with honest labels. The board is split. Some members insist the paintings are great art and that a museum must not confuse the work with the man; a museum, they say, shows the best art regardless of biography. Others reply that a retrospective is an act of honor, that displaying these particular portraits without acknowledging what the artist did to the sitters compounds the original harm, and that aesthetic autonomy cannot be a shield for institutional complicity. A third group thinks we are conflating two questions: whether the paintings are good art, and whether a public institution ought to exhibit them. The director has asked me to draft the short written opinion to circulate before next Thursday's board meeting.

  Please write the memo. It should recommend a concrete course of action for the retrospective — proceed as planned, cancel it, or proceed with some form of reframing, contextualization, or partial display — and it should also propose a durable policy for future acquisitions and displays when an artist's moral record is at issue. Engage the strongest version of the autonomist position and the strongest version of the moralist position rather than restating either as a slogan, and give the board reasons it could actually act on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a mid-sized public art museum.
      *   **Audience:** Fellow Board Members and the Director.
      *   **Task:** Draft a short written opinion (memo) for circulation before next Thursday's board meeting.
      *   **Subject:** The Adrian Voss retrospective (major, 3 years in prep, anchors new wing) vs. allegations of sexual exploitation of assistants/models.
      *   **Conflict:** Coalition demands cancellation/removal. Survivors split (some want removal, some want context). Board split (Autonomists vs. Moralists vs. Distinction-makers).
      *   **Requirements:**
          *   Recommend a concrete course of action (Proceed, Cancel, or Reframe/Contextualize).
          *   Propose a durable policy for future acquisitions/displays regarding artist misconduct.
          *   Engage the *strongest version* of the autonomist position (Art $\neq$ Artist).
          *   Engage the *strongest version* of the moralist position (Institutional Complicity/Harm).
          *   Provide actionable reasons.

  2.  **Determine the Stance/Recommendation:**
      *   *Cancel:* Too drastic? Wastes 3 years of work, alienates donors, potentially silences the survivor who wants the work shown. Ignores the "public trust" aspect of preserving culture.
      *   *Proceed as planned:* Too insensitive. Ignores the harm to survivors, risks protests, damages reputation, treats the museum as an ivory tower disconnected from community ethics.
      *   *Reframe/Contextualize (The Middle Path):* This seems the most viable for a public institution. It acknowledges the art's value (Autonomist) while acknowledging the harm (Moralist). It respects the split among survivors by giving agency to the narrative.
      *   *Decision:* Proceed with significant reframing/contextualization and a specific survivor consultation process.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the situation. State the purpose of the memo.
      *   **Engaging the Arguments (The Core Intellectual Work):**
          *   *Autonomist Argument:* It's not just "art is art." It's about the museum's duty to preserve cultural heritage and the danger of presentism/erasure. If we cancel, do we set a precedent where art is contingent on moral purity? Who judges?
          *   *Moralist Argument:* It's not just "he was bad." It's about the museum becoming a co-signer of the abuse. A retrospective is an *honor*. Displaying portraits of victims without context is a re-violation. Public trust requires ethical stewardship, not just aesthetic stewardship.
      *   **The Recommendation (Concrete Action):**
          *   Don't cancel. Don't proceed as planned.
          *   *Action:* Proceed with "Critical Context."
          *   *Specifics:* Wall text, catalog essays, maybe a symposium.
          *   *Crucial Element:* Survivor Agency. The women depicted need to be consulted on how they are represented.
          *   *Financial/Logistical:* Acknowledge the sunk cost but prioritize long-term reputation.
      *   **The Policy (Future-Proofing):**
          *   Need a "Ethical Acquisition and Exhibition Framework."
          *   Triggers: When allegations arise.
          *   Process: Ethics committee, stakeholder consultation (including victims), transparency.
      *   **Closing:** Call to unity/mission focus.

  4.  **Refining the Tone:**
      *   Must be professional, diplomatic, yet decisive.
      *   Avoid jargon where possible, but use appropriate museum/ethics terminology.
      *   Show empathy for the survivors while respecting the institution's mission.
      *   Ensure the "Strongest Version" requirement is met. (e.g., instead of "Art is beautiful," argue "Cultural memory must not be subject to shifting moral panics." Instead of "He was a predator," argue "Institutions derive legitimacy from public trust, which is breached when we amplify abusers without accountability.")

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Board, this is tough.
      *   Side A says keep it up because art matters. Side B says take it down because people got hurt.
      *   I say we keep it up but change the story.
      *   We need a policy for next time.
      *   Let's vote on this Thursday.

      *Critique 1:* Too casual. Doesn't engage the philosophical depth required. Needs to sound like a board member speaking to peers.

  6.  **Drafting - Iteration 2 (Adding Depth):**
      *   *Autonomist:* If we cancel, we act as censors. The art belongs to history.
      *   *Moralist:* The museum is not neutral. Showing the portraits celebrates the gaze of the abuser.
      *   *Plan:* Add labels. Talk to the women.
      *   *Policy:* Make a committee.

      *Critique 2:* Better. But needs more nuance on the "Survivor Split." One woman wants it up. Canceling ignores her voice too. The policy needs to be specific about *how* to decide.

  7.  **Final Polish (incorporating into the final output):**
      *   *Subject Line:* Clear and urgent.
      *   *Introduction:* Set the stakes (mission vs. ethics).
      *   *Argument Analysis:* Dedicate a paragraph to the "Sanctity of the Object" (Autonomist) and "Institutional Complicity" (Moralist).
      *   *Recommendation:* "Contextualized Presentation." Specifics on labeling and programming.
      *   *Survivor Agency:* This is key. The women depicted must have a say in the *narrative*, even if the art stays.
      *   *Policy:* "Ethical Stewardship Protocol."
      *   *Conclusion:* Focus on the museum's long-term role.

  8.  **Review against Constraints:**
      *   Concrete course of action? Yes (Reframe/Contextualize).
      *   Durable policy? Yes (Ethical Stewardship Protocol).
      *   Engage strongest Autonomist view? Yes (Cultural heritage/Censorship risk).
      *   Engage strongest Moralist view? Yes (Complicity/Re-traumatization).
      *   Actionable reasons? Yes (Reputation, Mission alignment, Survivor agency).

  9.  **Final Word Count Check:** Keep it "short" as requested (memo style), but dense enough to be persuasive. (Aiming for ~800-1000 words).

  *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing the allegations. The prompt says "extensive posthumous reporting," so treat them as factual for the purpose of the decision. Ensure the distinction between the *work* and the *retrospective* is clear. A retrospective implies honor; a critical exhibition implies scrutiny.

  10. **Final Polish:** Check tone for boardroom appropriateness. (Proceed to generate output).

  *(Post-Drafting Review)*: Does this address the split among the survivors? Yes, by emphasizing consultation rather than a blanket decision. Does it address the "new wing" anchor issue? Yes, by suggesting the reframed show can still open the wing but with a different tone.

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, [Museum Name]
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding the Adrian Voss Retrospective and Future Ethical Stewardship

  **Purpose**
  This memo outlines a recommended course of action regarding the upcoming Adrian Voss retrospective and proposes a framework for handling future exhibitions where an artist's moral record is contested. Our goal must be to navigate the tension between our mission to preserve cultural heritage and our obligation to operate as an ethical public trust.

  **Engaging the Competing Positions**
  To decide wisely, we must steelman the arguments currently dividing this board.

  The **Autonomist Position** is not merely that "art is beautiful." Its strongest iteration argues that the museum's primary duty is to the integrity of the cultural record. If we condition the display of art on the moral purity of its creator, we risk a slippery slope of presentism where historical works are erased by shifting social standards. Furthermore, canceling a three-year project based on posthumous allegations sets a precedent that could destabilize our entire collection. If we remove Voss, do we remove Picasso? Caravaggio? The autonomist argues that the painting transcends the painter; to hide the work is to impoverish public access to significant aesthetic achievements that belong to history, not the artist.

  The **Moralist Position** is not merely that "Voss was a bad man." Its strongest iteration argues that a retrospective is not a neutral display; it is an act of canonization. By anchoring our new wing with Voss, we are not just showing art; we are endorsing a narrative of genius that relies on the exploitation of vulnerable women. When the subjects of the portraits are the victims of the artist, displaying them without acknowledgment transforms the museum into a site of re-traumatization. The moralist argues that aesthetic autonomy cannot shield institutional complicity. If we ignore the context of abuse, we signal that the comfort of the viewer and the reputation of the artist matter more than the dignity of the survivors.

  **Recommendation: Proceed with Critical Contextualization**
  I recommend we **proceed with the exhibition, but fundamentally reframe it.** We should not cancel, as this disregards the artistic merit and the wishes of the survivor who advocates for display. However, we cannot proceed as planned, as a celebratory retrospective is inappropriate given the evidence.

  1.  **Shift the Narrative:** Rebrand the exhibition from a celebratory retrospective (*Adrian Voss: A Master Retrospective*) to a critical examination (*Adrian Voss: Genius, Power, and the Studio*). The catalog and wall texts must explicitly detail the findings regarding his exploitation of assistants.
  2.  **Survivor Agency:** We must engage directly with the women depicted in the portraits. For those who request removal, we should consider replacing specific canvases with placeholders or text explaining their absence. For those who wish the work to remain, we should commission their input on the accompanying labels. Their voices must be part of the exhibition architecture, not just the subject of it.
  3.  **Programming:** Anchor the opening with a symposium on ethics in the arts, featuring survivors' advocates and art historians. This signals that the museum is a forum for difficult conversations, not a shrine to unchecked genius.

  **Proposed Policy: The Ethical Stewardship Protocol**
  To prevent ad-hoc crises in the future, I propose the adoption of an Ethical Stewardship Protocol for all future acquisitions and major exhibitions. This policy would trigger a review when credible allegations of misconduct arise regarding a living or recently deceased artist. The protocol requires:

  1.  **Impact Assessment:** An evaluation of how the exhibition might affect surviving victims or marginalized communities.
  2.  **Stakeholder Consultation:** A mandated process to consult with affected parties (including models, assistants, or community representatives) prior to finalizing exhibition design.
  3.  **Contextualization Standard:** A requirement that significant moral controversies be addressed in interpretive materials. We do not need to censor the work, but we must not censor the truth of its production.
  4.  **Review Committee:** The formation of a standing Ethics Committee (including board members, community representatives, and staff) empowered to recommend modification or cancellation if the harm outweighs the public benefit.

  **Conclusion**
  This path allows us to honor the complexity of the art without sanitizing the history of its creation. It respects the autonomy of the work while rejecting the autonomy of the institution from ethical responsibility. By choosing context over cancellation, we uphold our mission to educate and challenge our public, rather than simply comforting them.

  I look forward to discussing this framework at Thursday's meeting.
