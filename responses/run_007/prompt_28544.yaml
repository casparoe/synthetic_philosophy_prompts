  My best guess is she will grant the vote. The strongest precedent is the permanent expat citizen. That ruling establishes that physical presence and current impact are not necessary conditions for national voting rights; legal status is sufficient. The "never lived" detail is an intensifier of the expat case, but unlikely to flip the binary. The professor distinguishes sharply between citizens (votes) and non-citizens (input/residence-based local votes). Since this individual is a citizen, she falls on the "vote" side of the bright line, regardless of attachment. The dementia ruling further suggests a bias against exclusion: if someone with severe cognitive impairment gets a proxy, someone with mere geographical distance shouldn't lose rights. The principle is likely "Citizenship constitutes membership; membership grants national suffrage," treating citizenship as a portable status rather than a reward for contribution or presence. This maintains a clear, clearly administrable boundary despite theoretical fuzziness.

  ### The telling further case

  The telling case is a long-term resident non-citizen voting in a *national* referendum on tax policy. This pits the Hybrid principle against itself. If she says YES, affectedness/residence trumps citizenship for national issues. If she says NO, citizenship is the exclusive key for national power, confirming the "never-lived" citizen gets a vote while the long-term resident does not. This clarifies whether the boundary is political status or substantive stake. It forces a choice between affectedness and formalism. This is the crucial test.
