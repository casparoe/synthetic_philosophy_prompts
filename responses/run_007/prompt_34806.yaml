answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Frege–Geach Problem and the Semantics of Moral Discourse  
  **Parties:** The Expressivist (Non-Cognitivist) & The Truth-Conditional Descriptivist (Cognitivist)  
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS (THE COMMON GROUND)

  We, the undersigned, agree that any adequate metaethical theory must account for the following linguistic and logical data. We affirm the following claims without hedging or reservation. Both sides accept these as constraints on a successful theory.

  1.  **Embedding Data:** Moral sentences function grammatically and semantically like ordinary declarative sentences when embedded in complex structures. Specifically:
      *   **Negation:** "Stealing is not wrong" is a meaningful denial of "Stealing is wrong."
      *   **Conditionals:** "If stealing is wrong, then getting your little brother to steal is wrong" is a meaningful conditional.
      *   **Disjunction:** "Either stealing is wrong or it is permissible" is a meaningful disjunction.
      *   **Questions:** "Is stealing wrong?" is a meaningful interrogative.
      *   **Attitude Reports:** "Alice thinks that stealing is wrong" correctly reports Alice's mental state using the same content as the unembedded sentence.
  2.  **Compositionality:** The meaning of a complex moral sentence (e.g., a conditional) is determined by the meanings of its constituent parts ("stealing," "wrong," "if...then") and their mode of combination.
  3.  **Univocality:** The term "wrong" contributes the same semantic content to the sentence "Stealing is wrong" whether it appears unembedded (asserted) or embedded (e.g., in the antecedent of a conditional). There is no systematic ambiguity between asserted and unasserted contexts.
  4.  **Logical Validity:** The following argument is valid in the ordinary, pre-theoretical sense of logical validity:
      *   *P1:* Stealing is wrong.
      *   *P2:* If stealing is wrong, then getting your little brother to steal is wrong.
      *   *C:* Therefore, getting your little brother to steal is wrong.
  5.  **Inconsistency:** Asserting "Stealing is wrong" and asserting "Stealing is not wrong" constitutes a logical inconsistency. A speaker cannot coherently hold both positions simultaneously.

  ## 2. CORE DISAGREEMENTS

  While we agree on the data (Section 1), we disagree on the best explanation of that data. The following table summarizes our divergent positions. Each position is stated in terms acceptable to the holder of that view.

  | Feature | **The Expressivist Position** | **The Truth-Conditional Descriptivist Position** |
  | :--- | :--- | :--- |
  | **Primary Semantic Function** | The primary function of asserting a moral sentence is to express a non-cognitive, desire-like attitude (e.g., disapproval, norm-acceptance, or a plan), not to describe a state of affairs. | The primary function of asserting a moral sentence is to express a belief that represents the world as being a certain way, specifically regarding moral properties or facts. |
  | **Semantic Content** | The content of a moral sentence is determined by the type of attitude it is conventionally used to express. It does not inherently possess truth conditions in the robust, descriptive sense. | The content of a moral sentence is constituted by its truth conditions. To understand the sentence is to know under what conditions it would be true. |
  | **Mental State Expressed** | Asserting "Stealing is wrong" expresses a conative state (a stance toward actions) rather than a cognitive state (a belief about facts). | Asserting "Stealing is wrong" expresses a cognitive state (a belief) that is apt for truth or falsity. |
  | **Explanation of Validity** | Validity is explained by the inconsistency of attitudes. To accept the premises and reject the conclusion is to be in a state of practical or normative incoherence. | Validity is explained by the preservation of truth. It is impossible for the premises to be true and the conclusion false. |

  ## 3. CRUXES: TEST CASES AND PREDICTIONS

  We identify three specific problems where our explanations diverge sharply. For each, we specify a concrete case and record our predictions in advance. Settling these would force at least one side to revise their theory.

  ### Crux I: The Negation Problem
  **The Issue:** If "Stealing is wrong" expresses disapproval, what attitude does "Stealing is *not* wrong" express? If it merely expresses the *absence* of disapproval, it is not inconsistent with disapproval (one can both disapprove and not disapprove at different times, or lack an attitude). We need an account of the attitude that guarantees inconsistency.

  *   **Concrete Case:** A speaker says, "I disapprove of stealing, but stealing is not wrong." We agree this sounds Moore-Paradoxical or contradictory.
  *   **Descriptivist Prediction:** This is contradictory because the speaker asserts *P* and *not-P*. The mental states are belief that *P* and belief that *not-P*, which are logically incompatible by definition.
  *   **Expressivist Prediction:** This is contradictory because the attitude expressed by "Stealing is wrong" (e.g., being *for* blaming for stealing) is logically incompatible with the attitude expressed by "Stealing is not wrong" (e.g., being *for* not blaming for stealing). We predict we can specify a complex attitude type (following Schroeder's 'being for' framework) that mirrors logical negation without invoking truth conditions.

  ### Crux II: Mixed Conditionals
  **The Issue:** Can the Expressivist assign a single, unified attitude to conditionals with moral antecedents and descriptive consequents without smuggling in truth conditions?

  *   **Concrete Case:** "If stealing is wrong, then grass is green." (Assume for the sake of argument the speaker believes grass is green).
  *   **Descriptivist Prediction:** This sentence has standard truth conditions. It is true if either stealing is not wrong or grass is green. The speaker asserts a proposition that is truth-apt.
  *   **Expressivist Prediction:** This sentence expresses a complex attitude, such as "accepting the disjunction of (not disapproving of stealing) or (believing grass is green)." We predict we can define this attitude purely in terms of commitment/incoherence conditions without referencing the *truth* of the antecedent. If we must reference the *truth* of the antecedent to explain the attitude, Expressivism fails.

  ### Crux III: Extension of Validity (Mixed Arguments)
  **The Issue:** Can an Expressivist account of validity (incoherence of attitudes) match the extension of classical logical validity for *all* arguments, particularly those mixing moral and descriptive premises?

  *   **Concrete Case:** 
      1. Stealing is wrong. (Moral)
      2. If stealing is wrong, then God forbids stealing. (Mixed)
      3. Therefore, God forbids stealing. (Descriptive)
  *   **Descriptivist Prediction:** This argument is valid because truth is preserved. If (1) and (2) are true, (3) *must* be true. Any theory that cannot explain this necessity via truth conditions fails to capture logic.
  *   **Expressivist Prediction:** This argument is valid because accepting (1) and (2) while rejecting (3) involves a clash of commitments. Specifically, accepting the conditional commits one to having a descriptive belief (that God forbids stealing) upon having the moral attitude (that stealing is wrong). We predict we can map this onto classical logic without positing moral truth-makers. If our logic yields different validity verdicts than classical logic, Expressivism fails.

  ## 4. ASSESSMENT: VERBAL VS. SUBSTANTIVE

  We conclude by assessing the nature of our disagreement.

  **Merely Verbal Disputes:**
  We acknowledge that some portion of our debate is verbal, specifically regarding the definitions of **"belief"** and **"truth."**
  *   The Expressivist is willing to use "belief" and "true" in a minimalist or deflationary sense (e.g., "It is true that stealing is wrong" just means "Stealing is wrong").
  *   The Descriptivist insists on a robust, representational notion of belief and truth that implies correspondence to mind-independent (or response-dependent) facts.
  *   *Agreement:* If the Expressivist adopts minimalist truth talk, they may *sound* like Descriptivists, but this does not resolve the underlying metaphysical divergence.

  **Substantive Disputes:**
  The disagreement is **not** merely verbal. Even if we align our vocabulary, the following substantive issues remain:
  1.  **Metaphysics:** The Descriptivist is committed to the existence of moral properties/facts that make sentences true. The Expressivist denies this commitment is necessary for moral discourse to function.
  2.  **Psychology:** The Descriptivist claims the mental state underlying moral judgment is fundamentally cognitive (world-to-mind direction of fit). The Expressivist claims it is fundamentally conative/normative (mind-to-world or planning direction of fit).
  3.  **Explanation of Logic:** The Descriptivist holds that truth-preservation is the *only* genuine explanation of logical validity. The Expressivist holds that consistency of attitudes is a sufficient explanation. These are competing explanatory claims, not just terminological differences.

  **Signed,**

  _________________________  
  (The Expressivist)

  _________________________  
  (The Truth-Conditional Descriptivist)
