prompt: |-
  ok so I'm the student council secretary at my high school and basically every month someone brings a proposal to raise money or improve efficiency by selling something we normally dont sell. last month it was selling cuts in the lunch line for two bucks, and someone wanted to let people pay to vote extra times in the prom royalty election, and now theres a proposal to auction off the good parking spots to fund the spring dance. the other officers keep saying these are obviously different cases but nobody can explain why, and I'm the one who has to write up a recommendation for each proposal before we vote.

  I keep seeing this idea that some markets are repugnant or that putting a price on certain things corrupts them, like the arguments about selling kidneys or votes. I want a decision procedure we could actually run at our meetings, not just vibes. like a checklist of questions in order. for each question say what a sufficient answer looks like, where the procedure stops with a no, and where it stops and says this is a values call and a person has to decide.

  then run the procedure on three proposals: (1) selling line cuts at lunch, (2) letting people buy extra votes in prom royalty, (3) auctioning the good parking spots. I want at least one case where the procedure gives an answer I'm not gonna like, and be honest about which steps are judgment dressed up as rules. also say what the procedure can't catch, like cases where the checklist would approve something that still feels wrong or block something harmless.

  constraints: we have maybe 20 minutes per proposal in the meeting, none of us have done philosophy, and whatever we decide has to be explainable to the principal and to students who are mad about it. if the actual theory says two of those proposals are the same kind of thing in a surprising way, or different in a way that would annoy people, say that straight out.
