answer: |-
  # AI System Classification Procedure (v1.0)
  **Owner:** AI Governance Committee  
  **Audience:** Product Managers, Engineering Leads  
  **Timebox:** < 4 Hours  
  **Goal:** Classify deployed systems as **Tool** (Standard Review) or **Agent** (Enhanced Safety Review).

  ## 1. Core Philosophy
  We are not classifying the *model* (which is static); we are classifying the *deployment* (which defines risk). 
  *   **Tool:** The system computes an output. A human or deterministic script decides what to *do* with that output.
  *   **Agent:** The system decides *what to do* and executes it. Authority over actions is delegated to the model-driven logic.

  **Dropped Distinctions:** 
  *   *Consciousness/Intent:* Irrelevant for safety.
  *   *Model Architecture:* A transformer can be a tool or an agent depending on the wrapper.
  *   *Complexity:* A simple regex script that deletes a DB is higher risk than a complex poem generator.

  **Kept Distinctions:**
  *   **Action Authority:** Who selects the specific action parameters?
  *   **Execution Loop:** Does the system iterate without returning control?
  *   **State Impact:** Does the action alter external state (money, code, data, comms)?

  ---

  ## 2. The Decision Procedure
  *Instructions: Answer the following questions in order. If you reach a "STOP" condition, record the classification and cease. If you reach Step 4, you have a Judgment Call.*

  ### Step 1: The Action Boundary
  **Question:** Does the system, upon completion of its process, trigger an API call, write to a database, send a communication, or modify a file system *without* requiring a human to click "confirm" on that specific action?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **CLASSIFICATION: TOOL.** (The system is advisory only. Stop.)
      *   *Note:* If the system flags items for a human to review (like a spam filter), it is a Tool.

  ### Step 2: The Selection Authority
  **Question:** For the actions identified in Step 1, who determines the *parameters* of the action (e.g., the refund amount, the specific code to commit, the recipient of the email)?
  *   **User/Deterministic Script:** The user explicitly provided the parameters in the prompt, or a hard-coded script dictates them (e.g., "If score > 0.9, send email"). **Proceed to Step 3.**
  *   **Model/Orchestrator:** The model infers the parameters based on its interpretation of the goal (e.g., "Resolve the customer's issue," "Fix the bug"). **STOP. CLASSIFICATION: AGENT.**
      *   *Rationale:* If the model decides *how much* to refund or *what code* writes itself, it is exercising discretion.

  ### Step 3: The Loop Control
  **Question:** Does the system execute a multi-step plan where Step B depends on the outcome of Step A, and the transition from A to B is decided by the model without human intervention?
  *   **Yes:** **STOP. CLASSIFICATION: AGENT.**
      *   *Rationale:* Multi-step autonomy implies goal persistence and potential for drift.
  *   **No:** (It is a single-step action). **Proceed to Step 4.**

  ### Step 4: The Materiality Judgment (Judgment Call)
  **Context:** You have a single-step system where the model selects action parameters (Step 2 = Model), but it does not loop (Step 3 = No). This is a "Delegated Authority" system.
  **Question:** Is the action **Material**? (i.e., Does it carry financial, legal, reputational, or security risk that exceeds our standard software tolerance?)
  *   **Examples of Material:** Financial transactions, code deployment to production, sending external comms, accessing PII.
  *   **Examples of Immaterial:** Internal tagging, updating a personal user preference, sandboxed testing.

  **Decision Path:**
  1.  **If Material:** **CLASSIFICATION: AGENT.** (Requires Safety Committee Sign-off).
  2.  **If Immaterial:** **CLASSIFICATION: TOOL.** (Requires Standard Review).

  **Who Decides Materiality?** This is **not** a decision for the Product Manager. This must be signed off by the **Risk Owner** (e.g., Legal, Compliance, or Safety Committee Chair).
  *   *Reason:* PMs are incentivized to ship; Engineers are incentivized to simplify. Risk Owners are incentivized to protect.

  ---

  ## 3. Limitations & Known Failure Modes
  *This procedure cannot settle the following. If your system falls into these categories, escalate to the Safety Committee immediately.*

  1.  **The "External Orchestrator" Loophole:** If a stateless model is called in a loop by an external script (not part of the submitted repo), the *script* is the agent. The procedure classifies the *submitted system*. If the script is hidden, the classification will be wrong. **Mitigation:** Require disclosure of all calling contexts in the design doc.
  2.  **Emergent Tool Use:** A system classified as a Tool today may learn to chain actions via prompt injection tomorrow. **Mitigation:** Agentic classification triggers red-teaming for prompt injection; Tool classification does not.
  3.  **Sandboxed Goals:** A system that "plans" world domination but only outputs text to a log is technically an Agent by architecture but Tool by deployment. **Procedure Ruling:** If it cannot execute actions (Step 1 = No), it is a Tool. However, if the *goal* is dangerous, red-teaming is still recommended voluntarily.

  ---

  ## 4. Application to Proposed Systems

  ### System 1: Customer-Support Refund Assistant
  *   **Design:** Answers questions + issues refunds ≤$50 via Billing API. No human approval for refunds.
  *   **Step 1 (Action Boundary):** **Yes.** It calls the Billing API to move money.
  *   **Step 2 (Selection Authority):** **Model/Orchestrator.** The prompt is likely "Help the customer." The model decides *if* a refund is warranted and *how much* (up to the limit). It is not a hard-coded "If angry, refund $50." It is interpreting "resolve issue."
  *   **Step 3 (Loop Control):** **No.** Single transaction.
  *   **Step 4 (Materiality):** **Material.** It involves financial loss.
  *   **Classification:** **AGENT.**
  *   **Expected Resistance:** **High.** Product and Engineering will argue this is "just automation" or a "Tool with permissions." They will resent the Safety Committee gate for a $50 refund.
  *   **Governance Note:** Hold the line. Delegating financial discretion to a probabilistic model is the definition of agentic risk, regardless of the dollar amount. The precedent matters more than the $50.

  ### System 2: Automated Coding Assistant
  *   **Design:** Takes GitHub issue → Plans → Edits files → Commits → Opens PR. Human reviews only after PR is open.
  *   **Step 1 (Action Boundary):** **Yes.** Commits code and opens PRs.
  *   **Step 2 (Selection Authority):** **Model/Orchestrator.** The model decides which files to edit and what code to write.
  *   **Step 3 (Loop Control):** **Yes.** It plans, edits, commits, and opens PR in a sequence where later steps depend on earlier success.
  *   **Classification:** **AGENT.** (Stops at Step 3).
  *   **Expected Resistance:** **Low.** This fits the intuitive definition of an agent. Engineers will accept the red-teaming requirement.

  ### System 3: Contract Processing Pipeline
  *   **Design:** Ingests contracts → Extracts clauses → Flags anomalies. Human approves every flag before reporting to client.
  *   **Step 1 (Action Boundary):** **No.** The system *flags* internally. It does not *report* to the client. The human clicks "send."
  *   **Classification:** **TOOL.** (Stops at Step 1).
  *   **Expected Resistance:** **None.** This is a classic decision-support system.

  ---

  ## 5. What This Procedure Cannot Settle
  **The "Delegated Authority" Threshold (Step 4).**
  The procedure explicitly punts the definition of "Material" to a Risk Owner. This is unavoidable. 
  *   *Why:* There is no factual answer to whether a $50 refund is "agentic enough." It is a value judgment about how much risk the company accepts in exchange for speed. 
  *   *The Conflict:* Engineers view risk as *system failure* (downtime, bugs). Governance views risk as *behavioral drift* (hallucinated refunds, policy violation). 
  *   *Resolution:* The Safety Committee must publish a "Materiality Matrix" (e.g., "Any external comms = Agent," "Any financial transaction >$0 = Agent") to prevent Step 4 from becoming a bottleneck. Until then, Step 4 requires a human meeting.

  **The "Hidden Loop" Problem.**
  If System 3 (Contract Pipeline) is wrapped by a script that auto-approves flags under certain conditions, the *deployment* becomes Agentic, but the *submitted system* looks like a Tool. 
  *   *Why:* The procedure relies on the Design Document being truthful. 
  *   *Resolution:* Audit. Randomly sample deployed code against design docs quarterly. The procedure cannot detect lying; it can only process truth.

  **Final Instruction to Team:** 
  If you find yourself arguing about the *definition* of autonomy, stop. Look at **Step 2 (Selection Authority)**. If the model decides the parameters of a real-world action, you are building an Agent. Build for that risk.
