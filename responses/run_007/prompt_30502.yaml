answer: |-
  You are right to be frustrated. In jurisprudence, the slogan "You can't legislate morality" is notorious for being a "conversation stopper" that conflates distinct philosophical claims. It is often deployed to shut down a debate about *legitimacy* by asserting an impossibility.

  Given your specific argument—that the Harm Principle itself rests on a moral foundation and therefore no bright line exists between "permissible" and "impermissible" moral enforcement—your friend's slogan is largely ineffective unless it is interpreted in a very specific way.

  Here is the breakdown of the distinct claims hidden inside that sentence, their truth value, and their relevance to your argument.

  ### 1. The Empirical Claim: "Law cannot effectively change moral beliefs or virtues."
  *   **The Claim:** Legislation can regulate outward behavior, but it cannot make people virtuous or change their internal moral convictions. Trying to do so is futile.
  *   **Truth Value:** **Plausible but Contestable.**
      *   *Plausible:* You cannot force someone to *believe* murder is wrong via statute; you can only punish the act. State coercion often produces resentment rather than moral conversion.
      *   *Contestable:* Law has an expressive function. Over time, legislation *does* shift moral norms (e.g., civil rights laws, smoking bans, seatbelt laws). The law educates and shapes culture, not just behavior.
  *   **Relevance to Your Argument:** **Changes the Subject.**
      *   Your argument is about whether the law *may prohibit* conduct, not whether it can successfully convert the sinner. Legal moralism (as defended by figures like Lord Devlin) does not necessarily claim the law will make people virtuous, only that society has a right to protect its moral fabric by prohibiting certain acts. Whether the law changes hearts is irrelevant to whether it has the authority to ban the act.

  ### 2. The Conceptual Claim: "Law and Morality are logically distinct categories."
  *   **The Claim:** It is a category error to mix law and morality. "Law" is defined by procedure, sovereignty, or coercion, while "Morality" is defined by conscience, virtue, or divine command. If law enforces morality, it ceases to be "law" in the proper sense.
  *   **Truth Value:** **False.**
      *   This is a crude misunderstanding of legal positivism. Even strict positivists (like H.L.A. Hart) admit that law and morality *contingently* overlap. Furthermore, as you correctly noted, legal concepts are saturated with moral judgment (*mens rea*, negligence, reasonableness, cruelty). To say law *cannot* embody morality is descriptively false; all criminal law embodies a judgment that the prohibited act is "wrong."
  *   **Relevance to Your Argument:** **Fails to Block.**
      *   This reading actually concedes your point. If you argue "The Harm Principle is a moral position," you are highlighting that law *does* embody morality. If your friend insists law *can't* embody morality, they are denying a visible reality. This interpretation makes your friend's position untenable.

  ### 3. The Normative Claim: "The state lacks the legitimate authority to enforce morality."
  *   **The Claim:** Even if the state *could* enforce morality, it *ought not* to. The proper sphere of state power is limited to preventing harm to others (Mill's Harm Principle), and enforcing "private morality" exceeds that authority.
  *   **Truth Value:** **Contestable (This is the actual debate).**
      *   This is the core of the Hart-Devlin debate. Liberals argue the state must remain neutral on conceptions of the "good life." Legal moralists argue that a society is constituted by shared morals, and the state may preserve them just as it preserves the government itself. Neither side has a "knockdown" proof; it is a clash of first principles.
  *   **Relevance to Your Argument:** **Blocks the Argument (if phrased correctly).**
      *   This is the only reading that engages your point. However, the slogan "You *can't*" is misleading here. It should be "You *mustn't*."
      *   *The Problem:* Your specific argument is that **there is no principled line** between the morality of harm (which liberals accept) and the morality of vice (which liberals reject). If the friend asserts this normative claim, they must explain *why* the Harm Principle isn't just one more moral preference. If they simply say "You can't legislate morality," they are begging the question against your claim that the Harm Principle *is* legislation of morality.

  ### 4. The Epistemic/Pluralist Claim: "There is no single 'morality' to legislate."
  *   **The Claim:** In a pluralistic society, there is no objective moral truth accessible to all. Therefore, legislating "morality" is actually just legislating the preferences of the majority.
  *   **Truth Value:** **Plausible.**
      *   This is the modern liberal defense. It argues that because we disagree on the "good," the state should only manage the "right" (procedural justice and harm prevention).
  *   **Relevance to Your Argument:** **Changes the Subject / Partial Block.**
      *   This sidesteps your metaphysical point. You are arguing about the *structure* of legal justification (that it is inevitably moral). This claim argues about *social consensus*. It doesn't refute your claim that banning harm is moral; it just says "we shouldn't ban morals because we can't agree on them."

  ---

  ### What Your Friend Needs to Claim to Win

  For the slogan "You can't legislate morality" to do the work your friend wants it to do (i.e., to defeat your argument that there is no principled line), they need to be making a specific version of the **Normative Claim**, but they need to supplement it with a defense of the **Public/Private Distinction**.

  Your argument is: *Since banning murder is based on a moral judgment, banning sodomy (for example) is also based on a moral judgment. Therefore, if one is allowed, the other should be.*

  To block this, your friend cannot simply say "Law != Morality." They must argue:
  1.  **Distinction of Kind:** There is a qualitative difference between **public morality** (rules necessary for social coexistence, e.g., do not kill, do not steal) and **private morality** (rules regarding personal virtue or salvation, e.g., do not gamble, do not commit adultery).
  2.  **Legitimacy Boundary:** The state's coercive power is legitimate only for *public morality* (harm/coexistence), not *private morality*.

  **Why the slogan failed you:**
  The slogan "You can't legislate morality" suggests that the law is morally neutral. Your argument successfully pierces that by showing the law is *never* morally neutral.

  **The Verdict:**
  *   **Empirical reading:** Irrelevant to your point.
  *   **Conceptual reading:** False, and concedes your point.
  *   **Normative reading:** The only relevant one, but the slogan obscures it.

  **What you should tell your friend:**
  "You are using 'can't' when you mean 'shouldn't.' If you mean the state *shouldn't* enforce private virtue, that is a normative claim we can debate. But if you mean the law *does not* embody moral judgments, you are wrong. The Harm Principle is a moral judgment. So, your slogan doesn't explain why the law is permitted to enforce the morality of 'harm' but forbidden from enforcing the morality of 'vice.' You need to explain the line, not deny the terrain."
