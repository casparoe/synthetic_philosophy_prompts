      *   *Failures:* Students thinking the Monitor *caused* the action. Students thinking the sign isn't reliable.
      *   *Limitations:* Metaphysical possibility vs. physical setup. The "Flicker of Freedom."

  4.  **Refining the "Prior Sign" for a Classroom:**
      *   We can't actually read minds. We have to *stipulate* it as part of the game rules. "In this simulation, the Monitor has perfect prediction." This is standard for thought experiments.
