      *   *Revised Mechanism:*
          1.  Agent writes down intention secretly.
          2.  Controller sees intention.
          3.  If Intention == Target, Controller does nothing. Agent reveals choice.
          4.  If Intention != Target, Controller swaps the paper. Agent reveals choice (which is now forced).
          5.  *Problem:* If the paper is swapped, the Agent knows.
      *   *Better Mechanism (The "Neural Monitor" Simulation):*
