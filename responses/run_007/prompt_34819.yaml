          *   **Agent:** Makes the choice.
          *   **Controller (Intervener):** Wants a specific outcome. Has the power to override.
          *   **Observer/Judge:** The rest of the class. They assess responsibility.
          *   **Facilitator:** The professor (me).
      *   *The Twist:* The Controller *only* acts if the Agent shows a sign of wavering. If the Agent chooses the "right" way freely, the Controller stays idle.
