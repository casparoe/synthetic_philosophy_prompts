      *   *Refinement:* To make it feel real, the Agent shouldn't know the Intervener is there *initially*, or at least shouldn't know the mechanism. But for a seminar, transparency about rules (but not outcomes) is better. Let's make it a "Mind-Reader" game.
      *   *Mechanism:* The "Prior Sign." In Frankfurt cases, this is often a neural sign. In class, we can use a subtle cue or a sealed prediction. Let's use a "Secret Signal" system.
