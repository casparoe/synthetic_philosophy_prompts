prompt: |-
  I'm teaching an upper-level undergrad seminar on moral responsibility (14 students, 80 minutes) and I want to run a classroom activity that makes them feel the pull of Frankfurt-style cases before I've given them any labels. The idea I want them to hit on their own is roughly this: someone can be morally responsible for what they did even if they couldn't have done otherwise, because a hidden intervener stood ready to force the same action if the person had wavered. Design a live role-play or game that stages this. It should have clear roles (at least an agent and an intervener), a decision the agent makes, a prior sign the intervener relies on, and stakes or payoffs small enough that no real money is needed. No lecture up front, and don't say the word Frankfurt until the debrief. Then write a debrief that maps what actually happened in the activity onto the parts of the case (the prior sign, the counterfactual intervener, the actual sequence, the responsibility intuition), says what will predictably go wrong the first time I run it, and is honest about which bits of the philosophical debate the activity can't reproduce and I'll need to supply in discussion afterwards.

  Give me the whole thing as a JSON object with fields: overview, materials, roles, setup, timeline (an array of steps with durations), debrief (an array mapping moments in the activity to features of the case), likely_failures (an array with the problem and the fix), and limitations (an array of what the activity can't capture and how to handle it in discussion).
