answer: |-
  **MEMORANDUM**

  **TO:** The Chair of the Faculty Senate
  **FROM:** The Rules and Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on the Orderliness of Proposed Amendment to Article XIV

  **I. QUESTION PRESENTED**

  Whether a motion to amend Article XIV of the Faculty Senate Bylaws is in order when the proposed amendment raises the voting threshold for future amendments from two-thirds to four-fifths, given that the proponents possess the two-thirds vote required under the *current* text but would not possess the four-fifths vote required under the *proposed* text.

  **II. BRIEF ANSWER**

  The Committee recommends that you rule the motion **IN ORDER**.

  The validity of an amendment is determined by the procedural rules in force at the moment of its adoption. The proposed amendment operates prospectively. To require the proposal to satisfy the threshold it seeks to establish would render the bylaws immutable regarding increases to the amendment threshold, creating an illogical asymmetry in the Senate's power to govern its own procedure.

  **III. DISCUSSION**

  This question touches on a fundamental conceptual issue in governance: how a set of rules authorizes its own transformation. There are two competing ways to understand the logic of Article XIV.

  **A. The Proponent's View: Temporal Succession**
  The proponents argue that amendment clauses function as keys. The current Article XIV is the key currently in the lock. It authorizes the Senate to change the text of the bylaws, including the text of Article XIV itself. Once the vote occurs and the amendment is adopted, the old key is discarded, and a new key (the four-fifths requirement) is installed for *future* use.

  Under this view, the validity of the amendment is fixed at the moment of passage. At that specific moment, the governing law is the existing bylaw. The Senate is exercising the power it currently possesses. Once that power is exercised to change the rule, the new rule governs subsequent actions. This is the standard understanding of parliamentary procedure and legislative sovereignty: a body acts under the rules it has, to create the rules it will have.

  **B. The Opponent's View: Self-Application**
  The opponents argue that a rule defines the conditions of its own validity. If Article XIV is amended to say "Amendments require four-fifths," that statement implies a standard of legitimacy. If the amendment itself did not meet that standard, it suffers from a logical defect. It claims to establish a requirement that it failed to meet.

  We take this objection seriously. It is not merely a technical quibble; it rests on a principled concern for consistency and stability. The opponents are effectively arguing that the *standard* of protection (four-fifths) is superior to the *act* of changing it (two-thirds). They worry that allowing a lower threshold to enact a higher threshold permits a temporary majority to "lock in" their preferences against future supermajorities. They contend that if a rule demands a high level of consensus to change, that demand should apply to the change itself, ensuring that any new rigidity has broad support.

  **C. Why the Opponent's View Must Be Rejected**
  While the opponents' concern for stability is valid, their procedural interpretation leads to untenable logical and practical consequences.

  1.  **The Problem of the "One-Way Ratchet":**
      If the opponents' logic holds—that an amendment must satisfy the threshold it creates—then it becomes impossible to ever *increase* an amendment threshold.
      *   To change a threshold from 2/3 to 4/5, you would need 4/5. But if you had 4/5, you wouldn't need to change the rule to 4/5; you already have the consensus the rule seeks to protect.
      *   Conversely, you could easily *lower* a threshold (e.g., from 4/5 to a simple majority) because a simple majority is easier to achieve than 4/5.
      *   This creates a "one-way ratchet" where the bylaws can become easier to amend, but never harder. There is no conceptual reason why Article XIV should permit the Senate to loosen its constraints but forbid it from tightening them.

  2.  **The Source of Authority:**
      The authority to amend the bylaws does not come from the *text* of Article XIV in the abstract; it comes from the *Senate* acting under that text. The current Senate possesses the sovereignty to bind the future Senate. If the current Senate, by a two-thirds vote, decides that future decisions require four-fifths, that is an exercise of the power currently vested in them.
      To demand that the new rule validate its own creation is to confuse the *product* with the *process*. The new threshold is the product. The current voting rule is the process. The process validates the product; the product does not retroactively invalidate the process.

  3.  **The "Lock and Key" Analogy:**
      Consider a physical lock on a door. The current bylaw is the key that currently opens the door. The Senate wishes to replace the lock with one that requires a more complex key (a higher threshold). To install the new lock, one must use the current key to open the door. It is impossible to use the *new* key to install the *new* lock, because the new key does not exist yet. The opponents are effectively arguing that because the new lock requires a different key, the old key cannot be used to install it. This would mean the lock could never be changed.

  **IV. RECOMMENDATION**

  The Committee advises that you rule the motion **IN ORDER**.

  The opponents' argument relies on a timeless view of rules, where the text exists outside of time and judges its own creation. However, governance occurs in time. The Senate is currently operating under Article XIV as it stands. That text grants the power to amend by a two-thirds vote. That power includes the power to alter the magnitude of the vote required for future amendments.

  To rule the motion out of order would be to assert that the Senate lacks the capacity to make its own rules more difficult to change. This would fundamentally limit the Senate's sovereignty over its own governance.

  **A Note on Prudence**
  While the motion is *in order*, the Committee notes that the opponents' underlying concern regarding entrenchment is politically significant. Raising the amendment threshold significantly alters the balance of power between the current faculty and future faculties. While procedural rules permit this action, the Senate should weigh carefully whether establishing a four-fifths requirement is wise governance, even if it is permissible procedure. However, questions of wisdom are for the Senate to debate; questions of order are for the Chair to decide. On the question of order, the path is clear.

  **V. CONCLUSION**

  The amendment is procedurally valid because it complies with the bylaws currently in force. The new threshold will apply only to amendments proposed *after* the adoption of this change. We recommend you allow the vote to proceed.
