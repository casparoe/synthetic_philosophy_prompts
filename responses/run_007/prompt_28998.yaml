  Your colleague's verdicts present a classic puzzle in population ethics, often referred to as the **Asymmetry**. Her views align with what is sometimes called 'ordinary morality' or a moderate person-affecting view: she rejects the Total Utilitarian idea that we ought to maximise the number of happy people (verdicts 2 and 7), but she accepts that we have strict duties not to create people who will suffer (verdicts 3, 5, and 6).

  To predict her verdict on the 'net zero' case, we must identify the underlying principle that generates her first seven verdicts. There are two plausible candidate principles that fit her existing views equally well but diverge on the new case.

  ### Candidate Principles

  **1. The Harm-Constraint Principle**
  This principle holds that procreation is morally forbidden only if it inflicts a net harm on the child. Conversely, it is permissible provided no net harm is inflicted.
  *   *Formula:* Wrong if Expected Utility $< 0$; Permissible if Expected Utility $\ge 0$.
  *   *Fit with V1–V7:* It explains why suffering lives are forbidden (V3, V5, V6) and why happy lives are allowed (V1, V4). It accommodates the lack of obligation (V2, V7) by treating procreation as a liberty that is only restricted by the duty not to harm.

  **2. The Benefit-Justification Principle**
  This principle holds that because procreation imposes existence upon a being who otherwise would not exist, it requires a positive justification in the child's interests. Mere absence of harm is insufficient; the child must gain a net benefit.
  *   *Formula:* Wrong if Expected Utility $\le 0$; Permissible if Expected Utility $> 0$.
  *   *Fit with V1–V7:* It explains V1 and V4 (benefit justifies the act) and V3, V5, V6 (harm forbids the act). It also fits V2 and V7, as there is no duty to confer benefits, only a restriction against acting without them.

  ### The Verdict on the Net Zero Case

  Here the principles diverge sharply.

  *   **Under the Harm-Constraint Principle:** A net zero life involves no net harm. Since the prohibition is triggered only by harm, the couple **may permissibly** have the child. The default position is liberty; without harm, there is no veto.
  *   **Under the Benefit-Justification Principle:** A net zero life confers no net benefit. Since the permission is granted only by benefit, the couple **ought not** to have the child (it would be wrong or impermissible). To impose a life of exact equilibrium is to impose the burdens of existence without the offsetting good of a life worth living.

  ### Which Principle is More Likely?

  I believe your colleague is more likely operating with the **Benefit-Justification Principle**, and therefore would judge the net zero case as **wrong (or impermissible)**.

  There are two reasons for this. First, consider the phrasing of verdict 4. She specifies that a 'modestly positive' balance makes the act permissible. If the Harm-Constraint were her guiding light, she might have said 'non-negative' or 'not unhappy'. By explicitly requiring a *positive* balance for permissibility in V4, while requiring a *negative* balance for wrongness in V5, she linguistically excludes the zero point from the permissible category.

  Second, and more philosophically, her strong emphasis on the lack of obligation (V2, V7) suggests she views existence as something that needs to be *won* by the prospect of well-being, rather than a default state that is allowed unless it is miserable. If there is no duty to create a happy child, there is certainly no justification for creating a neutral one. In ethical frameworks concerning the imposition of risks or burdens (which procreation inherently is), the absence of a benefit usually renders the imposition gratuitous, and gratuitous imposition on another being is typically deemed morally impermissible.

  ### A Decisive Test Case

  To definitively distinguish between the Harm-Constraint and Benefit-Justification principles, you should present her with a case where the child's welfare is neutral, but the *parents'* welfare is positive.

  **The Case:**
  > A couple desires a child deeply. Having a child would bring them immense happiness and fulfilment. However, due to genetic and environmental factors, they know with certainty that the child's own life would be exactly net zero (as much suffering as happiness). The child would not be harmed in a net sense, but would not benefit either.

  **Why this distinguishes the principles:**
  *   **The Harm-Constraint Principle** (especially if combined with a general utilitarian view of the parents' interests) would likely deem this **permissible**. The child is not harmed, and the parents benefit. There is no net negative in the world.
  *   **The Benefit-Justification Principle** (specifically the child-centred version implied by V1–V7) would deem this **wrong**. Her first seven verdicts focus exclusively on the *child's* expected quality of life as the criterion for permissibility. If the justification for procreation must be a benefit *to the child*, parental happiness cannot substitute for the child's lack of benefit.

  If she says it is permissible, she is likely a Harm-Theorist (or allows parental interests to trump child neutrality). If she says it is wrong, she is a strict Child-Centred Benefit-Theorist, confirming that the net zero case in your original query would also be forbidden.

  ***

  **Summary for your colleague:**
  If she wishes to remain consistent with the implication that a 'positive' balance is required for permission (V4), she should rule that creating a net-zero life is **impermissible**. The absence of suffering is not a sufficient reason to impose existence; the presence of a net good is required.
