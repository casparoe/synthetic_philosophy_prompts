  ### Instructor's Cheat Sheet (Payoff Verification)
  *Ensure your printed tables match this exactly:*
  *   **N1:** P1 Takes (20, 0)
  *   **N2:** P2 Takes (0, 30)
  *   **N3:** P1 Takes (40, 10)
  *   **N4:** P2 Takes (10, 50)
  *   **N5:** P1 Takes (60, 20)
  *   **N6:** P2 Takes (20, 70) OR End (50, 50)
  *   *BI Check:* N6(Take)>End → N5(Take)>Pass(20) → N4(Take)>Pass(10) → N3(Take)>Pass(10) → N2(Take)>Pass(0) → N1(Take)>Pass(0).
  *   *Result:* P1 Takes at N1 for 20 points.
  *   *Social Optimum:* End at N6 for 50 points each.
