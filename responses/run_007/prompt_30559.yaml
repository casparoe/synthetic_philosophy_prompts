answer: |-
  ### Preamble: Mechanic Selection

  **Candidate 1: Digital/Software Interface.**
  Students log into a platform (e.g., Veconlab) to play against anonymous partners.
  *Rejection:* While this guarantees anonymity and prevents collusion, it abstracts the decision into a click. For philosophy students, the *tension* of the paradox is best felt when the choice is physical and the partner is a human being sitting across the table. The social friction is a feature, not a bug, of the pedagogical goal.

  **Candidate 2: Verbal Bargaining.**
  Players discuss their moves before committing.
  *Rejection:* This turns the activity into a negotiation exercise. It conflates the strategic logic of the Centipede Game with the ethics of promise-keeping or the psychology of persuasion. We want to isolate the logic of backward induction, not the dynamics of cheap talk (which will be introduced later as a specific variant).

  **Candidate 3: Physical Token with Written Log (Chosen).**
  Pairs use a printed game board with a movable token and a mandatory "Decision Log" sheet. Players must write their choice (Take/Pass) on the log *before* moving the token.
  *Selection:* This strikes the right balance. It is tactile and sequential, making the "Pass" an active gesture of trust. The Written Log creates a record for the debrief without requiring complex prep (like stuffing envelopes). It allows the instructor to monitor compliance and prevents "slips of the hand."

  ---

  ### Activity Design: The Centipede Tension

  **Class Profile:** 18 Students (9 Pairs), 75 Minutes.
  **Goal:** Experience the conflict between Backward Induction (BI) and intuitive cooperation before formalizing the theory.

  #### 1. Materials List
  *   **9 Game Boards:** Printed sheets showing a linear track of 6 nodes (labeled 1 to 6). Node 1, 3, 5 are marked "P1 Decision"; Node 2, 4, 6 are marked "P2 Decision".
  *   **9 Tokens:** Distinct markers (e.g., colored poker chips) to place on the current node.
  *   **18 Decision Log Sheets:** One per student. Columns: *Round, Node, Choice (T/P), Reason (Optional)*.
  *   **9 Payoff Tables:** Laminated cards showing the point values for ending at each node.
  *   **Pens.**
  *   **Projector/Board:** For aggregate results only (not instructions on strategy).

  **Payoff Scheme (Points):**
  The pot grows, but the "Taker" grabs the larger share. The final node forces a choice between a smaller "cooperative" split and a larger "selfish" take.
  *   **Node 1 (P1):** Take = **(20, 0)** | Pass →
  *   **Node 2 (P2):** Take = **(0, 30)** | Pass →
  *   **Node 3 (P1):** Take = **(40, 10)** | Pass →
  *   **Node 4 (P2):** Take = **(10, 50)** | Pass →
  *   **Node 5 (P1):** Take = **(60, 20)** | Pass →
  *   **Node 6 (P2):** Take = **(20, 70)** | **End (Pass)** = **(50, 50)**
  *   *Note:* At Node 6, P2 prefers 70 (Take) over 50 (Pass). This anchors the backward induction.

  #### 2. Minute-by-Minute Timeline

  *   **00:00 – 00:10: Setup & Neutral Instructions.**
      *   Seat students in 9 pairs. Assign P1/P2 roles (odd/even seat numbers).
      *   Distribute materials.
      *   **Script:** "You will play a game of points. Your goal is to maximize your own points. P1 starts at Node 1. You may Take the points shown for that node, ending the game, or Pass, moving the token to the next node. If you Pass, it becomes the other player's turn. If the token reaches the end of Node 6 without a Take, the End Payoff applies. You must write your choice on your Log Sheet before touching the token. No talking during the move phase."
      *   Run a 1-minute practice round with zero stakes to check understanding.

  *   **00:10 – 00:25: Variant 1 (Baseline: Anonymous One-Shot).**
      *   Pairs play one game.
      *   **Constraint:** Absolute silence. No eye contact encouraged (look at the board).
      *   Instructor collects Log Sheets immediately upon game end to prevent revision.
      *   Record aggregate "Stop Node" on the board (e.g., "5 pairs stopped at Node 1, 2 at Node 3...").

  *   **00:25 – 00:40: Variant 2 (Cheap Talk).**
      *   Reshuffle pairs (new partners).
      *   **Rule Change:** Before the token moves, players have 60 seconds to talk. They may make promises or predictions.
      *   **Constraint:** Once the 60 seconds are up, silence returns. Agreements are non-binding.
      *   Play one game. Record results.

  *   **00:40 – 00:55: Variant 3 (Repeated Play).**
      *   Return to original partners.
      *   **Rule Change:** You will play 5 games in a row. The game ends after 5 rounds regardless of moves.
      *   **Crucial Instruction:** "You know exactly when the last game begins. I will announce 'Final Game' before Round 5."
      *   Play 5 rounds. Record results for Round 1 and Round 5 specifically.

  *   **00:55 – 01:10: Formal Debrief.**
      *   Connect observed behavior to game theoretic concepts (see Script below).

  *   **01:10 – 01:15: Exit Questions.**
      *   Students answer on index cards and submit.

  #### 3. Variants: Predictions & Interpretations

  **Variant 1: One-Shot Anonymous**
  *   **BI Prediction:** P1 Takes at Node 1. (Unraveling: P2 Takes at 6 → P1 Takes at 5 → ... → P1 Takes at 1).
  *   **Empirical Prediction:** Most pairs will Pass at least once. Many will reach Node 4 or 5. Very few will Take at Node 1.
  *   **Divergence Meaning:** If students Pass, they are either violating the assumption of common knowledge of rationality (they think their partner might be irrational/altruistic) or they reject the normative force of BI in favor of a cooperative equilibrium.

  **Variant 2: Cheap Talk**
  *   **BI Prediction:** No change from Variant 1. Talk is "cheap" (non-binding). A rational player cannot commit via words alone.
  *   **Empirical Prediction:** Cooperation rates (Passing) will increase compared to Variant 1.
  *   **Divergence Meaning:** Shows that human rationality incorporates social signaling and reputation even when formally irrelevant. It highlights the difference between *binding commitment* and *belief formation*.

  **Variant 3: Repeated Play (Known Endpoint)**
  *   **BI Prediction:** Same as One-Shot for every round. Specifically, in Round 5 (the last one), it is structurally identical to Variant 1, so unraveling must happen immediately in Round 5. By induction, it should happen in Round 1.
  *   **Empirical Prediction:** High cooperation in Rounds 1-4. Sharp increase in "Taking" in Round 5.
  *   **Divergence Meaning:** If they cooperate in Rounds 1-4, they are using a "strategy of reputation" that BI rules out. If they defect in Round 5, they acknowledge the logic of the end-game. This isolates the *time horizon* as the variable driving the logic.

  #### 4. Debrief Script (Mapping Play to Theory)

  *Do not lecture on Rosenthal or Aumann yet. Use their data.*

  **Instructor:** "Look at the board. In Variant 1, how many of you Took at Node 1?" (Likely few). "The theory says 100% of you should have. Let's reconstruct why."

  **Concept 1: Backward Induction as Procedure.**
  "Start at Node 6. Player 2, look at your Payoff Table. 70 points for Take, 50 for Pass. What do you do?"
  *Class:* "Take."
  "Instructor: "So if the token gets to Node 6, P2 Takes. Player 1, look at Node 5. If you Pass, you know P2 Takes at 6, leaving you with 20. If you Take, you get 60. What do you do?"
  *Class:* "Take."
  "Instructor: "This chain reaction is **Backward Induction**. It is a computational procedure. If everyone follows it, the game ends at Node 1."

  **Concept 2: Subgame-Perfect Equilibrium (SPE).**
  "The outcome (Take at 1) is the **Subgame-Perfect Equilibrium**. It means your strategy is optimal at *every* node, even nodes you never reach. If you Passed at Node 1, did you have an SPE strategy?"
  *Student:* "No, I hoped they wouldn't Take at 6."
  "Instructor: "Exactly. You were betting on a non-equilibrium path."

  **Concept 3: Common Knowledge of Rationality (CKR).**
  "Why didn't you Take at 1?"
  *Student:* "I thought my partner was nice."
  "Instructor: "BI requires **Common Knowledge of Rationality**. I know you are rational. You know I know. I know you know I know. If you Pass, you are assuming I might *not* be rational, or that I might not know *you* are rational. In this room, do we have CKR?"
  *Class:* "No."
  "Instructor: "Correct. You know you are in a philosophy class, not a lab of profit-maximizing robots. You assumed **Common Belief**, not Common Knowledge."

  **Concept 4: Normative vs. Predictive.**
  "Does BI tell you what you *should* do (Normative), or what you *will* do (Predictive)?"
  *Discussion:* "It says what a rational agent *would* do. But if being 'rational' means getting 50 points instead of 20, maybe the theory's definition of rationality is too narrow."

  #### 5. Troubleshooting: Predictable Failure Modes

  **1. Coordination/Collusion:**
  *   *Risk:* Students agree "Let's both Pass to get 50/50."
  *   *Fix:* In Variant 1, enforce "Silent Phase." If heard, disqualify that pair's points. In Variant 2, explicitly state: "Agreements are not enforceable. You can lie."

  **2. Contamination (The "Spoiler"):**
  *   *Risk:* A student who knows game theory shouts "Take at Node 1!" during Variant 1.
  *   *Fix:* Pre-brief: "If you know the solution, your goal is now to observe whether others find it. Speaking ruins the data." Collect Log Sheets immediately after each variant so they can't change answers based on new info.

  **3. Speed (Finishing in 2 minutes):**
  *   *Risk:* P1 Takes immediately, leaving 10 minutes idle.
  *   *Fix:* The "Decision Log" requirement slows them down. Additionally, instruct: "You must write a brief reason for your choice on the log before moving." This forces reflection.

  **4. Joking/Generosity:**
  *   *Risk:* "I don't care about points, you take them."
  *   *Fix:* Frame points as "Course Credit" or "Priority on Paper Topic Selection." If impossible, frame it as "Winning the Logic Puzzle." Emphasize that the *goal* is to test the theory, not be nice.

  **5. Payoff Confusion:**
  *   *Risk:* Students misread who gets what.
  *   *Fix:* Payoff Table must be bold: **YOU / PARTNER**. Instructor circulates during the practice round to verify every pair can read the table correctly.

  #### 6. Honest Note on Limitations

  **The CKR Problem:**
  This activity cannot instantiate **Common Knowledge of Rationality**. In a formal model, CKR is an axiom. In a classroom, it is an empirical falsehood. Students know that students are not perfectly rational maximizers; they know their friends are in the room; they know the instructor is watching.
  *   *Facilitator Duty:* You must explicitly state this in the debrief. "The theory assumes we are machines that only want points and know everyone else is a machine. We are not. The paradox arises because the logic is sound, but the *premise* (CKR) is false in this room."
  *   *Anonymity:* Even with shuffled pairs, students are not truly anonymous. Social reputation bleeds into the game. This is not a bug for a philosophy class—it demonstrates why the *assumption* of anonymity is so heavy a lift for the theory.

  #### 7. Exit Questions (Index Cards)

  1.  **Computation vs. Recommendation:** "Backward Induction is a method for finding an equilibrium. Did you treat it today as a *calculation* of what must happen, or a *recommendation* for what you ought to do? Explain."
  2.  **Assumptions:** "At the moment you chose to 'Pass' at Node 3 (or earlier), what specific assumption were you making about your partner's choice at Node 4?"
  3.  **Normative vs. Predictive:** "If everyone in the room had Taken at Node 1, would that prove Backward Induction is *true*? If everyone Passed to Node 6, does that prove Backward Induction is *false*? Distinguish between the logic holding and the prediction failing."

