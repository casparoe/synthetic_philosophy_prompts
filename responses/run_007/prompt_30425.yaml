prompt: |-
  So I've been reading about embedded agency — you know, the whole thing where the agent is part of the environment it's trying to model, so you can't just assume a clean Cartesian boundary between agent and world. There's this split between people who think this is a genuinely deep problem that requires new formal foundations (logical induction, infra-Bayesianism, that whole cluster) and people who think it's overblown — that existing tools like POMDPs or computational Bayesianism can handle the apparent paradoxes just fine, and the fancy new frameworks are solving problems we don't actually have.

  I want you to draft the joint statement these two camps could produce after a good-faith adversarial collaboration. I want:

  - A numbered list of claims both sides can sign. These should be substantive, not just "we agree that agents exist." Get into the actual commitments: what does it mean for an agent to be embedded, what are the canonical problem cases (the procrastination paradox, the self-reference in Newcomb's problem when the predictor is running a simulation of you, etc.), and what would a satisfactory resolution even look like.

  - A disagrements table. Each row should state the exact point of disagreement in neutral language, then give each camp's position phrased so each camp would endorse the wording. Don't caricature either side.

  - The cruxes: the sub-questions where, if you could settle them, at least one side would update substantially. For each crux, describe a concrete thought experiment or empirical test that both sides agree bears on it, and state what each side predicts about the outcome.

  If you think part of the disagreement is merely verbal — that they're using "embeddedness" or "optimality" in different ways — say so and disentangle it.
