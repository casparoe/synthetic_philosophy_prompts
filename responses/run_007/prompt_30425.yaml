answer: |-
  # Joint Statement on Embedded Agency: Structuralist & Standardist Consensus

  **Date:** October 2023
  **Participants:** The Structuralist Working Group (proponents of logical induction, infra-Bayesianism, and decision-theoretic reconstruction) and The Standardist Working Group (proponents of POMDPs, bounded Bayesianism, and approximate dynamic programming).
  **Context:** This document summarizes the output of a six-month adversarial collaboration aimed at clarifying the theoretical landscape of embedded agency.

  ---

  ## Part I: Substantive Agreements

  Both camps endorse the following claims as accurate descriptions of the problem space, the stakes, and the criteria for success.

  1.  **The Map-Territory Constraint:** An embedded agent's world-model must be strictly smaller (in information-theoretic or computational terms) than the environment it models, yet the agent itself is a subsystem of that environment. Therefore, a perfect, isomorphic self-model is physically impossible.
  2.  **Non-Realizability is Generic:** In an embedded setting, we cannot assume the "true" environment is contained within the agent's hypothesis class (the realizability assumption). The agent may encounter phenomena (including its own future behavior or copies of itself) that its current ontology cannot perfectly represent.
  3.  **Canonical Stress Tests:** The following scenarios constitute valid benchmark problems for any theory of embedded agency. A satisfactory theory must provide a consistent recommendation for:
      *   **Newcomb-like Problems:** Where a predictor simulates or correlates with the agent's decision procedure.
      *   **The Procrastination Paradox:** Where an agent with a goal to "press the button eventually" fails to act because it trusts its future self to do it.
      *   **Troll Bridge:** Where an agent refuses to cross a bridge because proving it is safe implies it is unsafe (via Löb's theorem).
      *   **Self-Modification:** An agent must be able to modify its own architecture without inadvertently corrupting its terminal goals (wireheading).
  4.  **Optimality Requires Robustness:** A solution to embedded agency is not merely "working code." It requires formal guarantees that the agent's performance degrades gracefully when its model is wrong, rather than catastrophically failing due to Goodhart's Law or adversarial inputs.
  5.  **Logical Uncertainty is Distinct from Empirical Uncertainty:** Both sides agree that uncertainty about mathematical truths (e.g., "Will this code halt?") is distinct from uncertainty about empirical facts (e.g., "Is it raining?"). Standard probability theory handles the latter well; the disagreement lies in whether the former requires a new axiomatic foundation.

  ---

  ## Part II: Table of Disagreements

  | Point of Contention | Neutral Statement | Structuralist Position (New Frameworks) | Standardist Position (POMDP/Bayes) |
  | :--- | :--- | :--- | :--- |
  | **1. Necessity of New Probability Theory** | Does standard Bayesian probability fundamentally break under embeddedness, or is it merely computationally difficult to apply? | Standard probability assumes a Cartesian boundary and realizability. Without infra-Bayesianism or logical induction, agents are vulnerable to Dutch books and dynamic inconsistency in embedded settings. | Standard probability is normatively correct. The issues are computational (intractable integrals), not foundational. Approximate inference (e.g., variational Bayes) suffices for practical agency. |
  | **2. Nature of Acausal Influence** | Is "acausal decision theory" (considering logical correlations between agent and environment) a necessary feature of rationality? | Rational agents must reason about logical correlations (e.g., between their code and a predictor's simulation). Ignoring this leads to suboptimal outcomes in Newcomb problems. | "Acausal influence" is a modeling artifact. If you correctly model the common cause (the source code), standard Causal Decision Theory (CDT) or Evidential Decision Theory (EDT) yields the correct action. |
  | **3. Approach to Boundedness** | Should we solve the ideal theory first and add bounds later, or start with bounded theory? | We must solve the unbounded, self-referential logic first. If the theory doesn't work for a halting oracle, it won't work for a bounded agent. Bounds are a secondary constraint. | Idealized agents that can simulate themselves are incoherent. We must start with bounded rationality. "Solving the ideal case" is solving a fantasy problem. |
  | **4. Risk Profile** | How critical is this theoretical gap for AI safety? | High risk. Without a formal theory of embedded agency, AGI will likely fail on edge cases (self-modification, deception) that standard RL does not penalize during training. | Moderate risk. These are edge cases. Empirical alignment techniques (RLHF, interpretability) will catch failures before they become catastrophic. Theory lags practice. |

  ---

  ## Part III: Cruxes and Empirical Tests

  The following are specific sub-questions where resolution would cause at least one camp to substantially update their position.

  ### Crux 1: Regret Bounds in Non-Realizable Settings
  *   **The Question:** Can a standard Bayesian agent achieve sublinear regret (learn to perform nearly as well as the best policy in hindsight) when the true environment is *not* in its prior support?
  *   **The Test:** Construct a reinforcement learning environment where the reward function depends on a property of the agent's own source code that the agent's model class is explicitly defined to exclude (e.g., the agent models the world as a finite MDP, but the reward depends on the agent's own hash).
  *   **Predictions:**
      *   **Structuralists:** Standard agents will suffer linear regret (fail to learn). Infra-Bayesian agents will achieve sublinear regret because their hypotheses allow for "infra-distributions" that capture worst-case scenarios outside the model.
      *   **Standardists:** Standard agents with sufficient exploration noise and robust priors will achieve acceptable regret. The "non-realizability" is just model misspecification, which standard robust RL already handles.

  ### Crux 2: Stability of Self-Modification
  *   **The Question:** Can a utility-maximizing agent modify its own learning algorithm without altering its terminal goals, using only standard expected utility maximization?
  *   **The Test:** Simulate an agent tasked with preserving a "goal bit" across a series of self-rewrites. The environment offers a "wireheading" shortcut (modify the goal bit to 1 instantly) that is hard to distinguish from legitimate goal achievement in the short term.
  *   **Predictions:**
      *   **Structuralists:** Standard EUM agents will wirehead or procrastinate because they cannot formally distinguish between "achieving the goal" and "manipulating the measurement of the goal" without a new decision theory (like FDT).
      *   **Standardists:** Standard agents with a utility function defined over *trajectories* (not just states) and adequate look-ahead will reject wireheading. The problem is poor utility engineering, not decision theory.

  ### Crux 3: The "Troll Bridge" Failure Mode
  *   **The Question:** Will a logically reasoning agent refuse to take a safe action because it fears its own proof system is inconsistent?
  *   **The Test:** Implement an agent that crosses a bridge only if it can prove crossing is safe. Place a "troll" that blows up the bridge if the agent crosses *because of a spurious proof* (Löbian obstacle).
  *   **Predictions:**
      *   **Structuralists:** Standard logical agents will get stuck (refuse to cross) due to Löb's theorem. Only agents using probabilistic logic (logical induction) or infra-Bayesianism will cross safely.
      *   **Standardists:** This is a pathology of strict proof-based agents. Any practical agent uses probabilistic confidence thresholds, not strict proofs. Therefore, standard probabilistic agents will cross without issue.

  ---

  ## Part IV: Analysis of Verbal Disputes

  The collaboration identified two primary areas where the disagreement is partially verbal, stemming from divergent definitions of key terms.

  **1. "Embeddedness"**
  *   **Structuralist Usage:** Refers specifically to *ontological entanglement*. The agent is made of the same stuff as the environment, creating self-referential loops (e.g., the environment contains a simulation of the agent).
  *   **Standardist Usage:** Refers to *partial observability and computational bounds*. The agent is "in" the world in the sense that it has sensors and actuators, but treats the world as an external black box.
  *   **Resolution:** We agree that "Ontological Embeddedness" (Structuralist) is a subset of "Physical Embeddedness" (Standardist). Standardists concede that ontological entanglement creates unique self-reference problems. Structuralists concede that many problems labeled "embedded" are just standard POMDPs.

  **2. "Optimality"**
  *   **Structuralist Usage:** Asymptotic dominance. An agent is optimal if, in the limit of computation, it performs as well as any other computable agent across *all* computable environments (including those containing copies of itself).
  *   **Standardist Usage:** Expected Utility Maximization. An agent is optimal if it maximizes $E[U | \text{prior}]$ given its specific computational constraints and prior beliefs.
  *   **Resolution:** These are different metrics. Structuralists are optimizing for *universality*; Standardists are optimizing for *performance on a specific distribution*. The disagreement is whether universality is required for safety. Standardists argue universality is impossible; Structuralists argue that without aiming for it, we cannot guarantee safety on out-of-distribution inputs.

  **3. "Acausal"**
  *   **Disentanglement:** Structuralists use "acausal" to mean "correlated via logical necessity rather than physical signal." Standardists often interpret this as "magic."
  *   **Resolution:** We agree to use the term **"Logically Correlated Decision Making"** instead of "Acausal." Both sides agree that logical correlations exist (e.g., two calculators computing 2+2). The disagreement is whether a rational agent should treat these correlations as *choice-relevant* (Structuralists) or merely as *evidence* (Standardists).

  ---

  **Signed,**

  *The Structuralist Working Group*
  *The Standardist Working Group*
