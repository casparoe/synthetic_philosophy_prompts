prompt: |-
  I am trying to evaluate the claim, defended by some metaontologists, that many traditional metaphysical disputes are merely verbal. Before I assess any particular criterion for drawing the verbal/substantive distinction, I want the specification: what exactly must a theory of verbal disputes accomplish? Please write the desiderata. For each requirement, give the case or consideration that motivates it. I especially want to know: which desiderata are non-negotiable constraints on any such theory, and which are optional commitments that only some metaontological views would insist on? Are any pairs of desiderata jointly unsatisfiable — that is, does the very project of giving a criterion face internal tensions before we even get to the candidates? And which single requirement, if you had to pick one, rules out the most familiar proposals (e.g., the simple "they mean different things by the term" test, the disquotational test, Hirsch's quantifier variance, or the idea that a dispute is verbal just when the parties can agree on all the non-linguistic facts)? If the desiderata themselves already push toward either a deflationary or a heavyweight metaontology, I want that flagged explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Metaontology, specifically the distinction between verbal and substantive disputes.
      *   **Task:** Specify the *desiderata* (requirements/goals) for a theory of verbal disputes.
      *   **Structure:**
          *   List each requirement.
          *   Provide the motivating case/consideration for each.
          *   Distinguish between *non-negotiable constraints* (must-haves) and *optional commitments* (view-dependent).
          *   Identify *joint unsatisfiability* (internal tensions/trade-offs).
          *   Identify the *single most exclusionary requirement* (which rules out familiar proposals).
          *   Flag if the desiderata bias toward deflationary or heavyweight metaontology.
      *   **Tone:** Philosophical, precise, analytical.

  2.  **Deconstruct the Problem (Metaontological Context):**
      *   The "verbal dispute" claim is often used to dismiss traditional metaphysics (e.g., composition, persistence, existence of numbers).
      *   Key figures: Carnap (frameworks), Quine (ontological commitment), Hirsch (quantifier variance), Chalmers (verbal disputes), Sider (writing the book of the world), Thomasson (deflationism).
      *   The core challenge: How do we tell if two people are disagreeing about the *world* or just about *words/concepts*?

  3.  **Brainstorming Desiderata:**
      *   *Extensional Adequacy:* It needs to classify clear cases correctly (e.g., "football" vs. "soccer" is verbal; "is there a god?" is likely not).
      *   *Non-Triviality:* It shouldn't make *all* disputes verbal or *no* disputes verbal.
      *   *Epistemic Accessibility:* Parties should ideally be able to figure out if it's verbal.
      *   *Metaphysical Neutrality:* The criterion shouldn't presuppose the answer to the metaphysical question (begging the question).
      *   *Factivity:* If it's verbal, there's no fact of the matter (usually).
      *   *Reformability:* Can the dispute be resolved by clarifying terms?
      *   *Connection to Reality:* Substantive disputes must track mind-independent reality.

  4.  **Categorizing Desiderata (Non-negotiable vs. Optional):**
      *   *Non-negotiable:* Extensional adequacy (must match intuitions on paradigm cases), Non-circularity (can't use the metaphysical answer to decide if the dispute is verbal).
      *   *Optional:* Epistemic transparency (some think verbal disputes are hidden), Deflationary implication (some think verbal = no fact of the matter, others think verbal = conceptual but still objective).

  5.  **Identifying Tensions (Joint Unsatisfiability):**
      *   *Neutrality vs. Extensional Adequacy:* If we stay neutral on metaphysics, we might fail to classify metaphysical disputes as verbal (because heavyweights insist there *is* a fact). If we classify them as verbal, we seem to presuppose deflationism.
      *   *Charity vs. Substantiveness:* If we interpret parties charitably (Davidson/Quine), we might make disagreements disappear (making them verbal), but this undermines the idea of substantive disagreement.
      *   *The "Agreement on Non-Linguistic Facts" criterion:* This is the big one. If parties agree on all non-linguistic facts, is it verbal? Heavyweights say "there *are* further ontological facts." Deflationists say "no." So this criterion begs the question.

  6.  **Selecting the "Most Exclusionary" Requirement:**
      *   The prompt asks which single requirement rules out the most familiar proposals (simple meaning difference, disquotational, Hirsch, agreement on non-linguistic facts).
      *   *Candidate:* **Metaphysical Neutrality / Non-Begging the Question.**
      *   *Why?*
          *   "They mean different things" is too broad (substantive disputes often involve different concepts).
          *   "Agreement on non-linguistic facts" assumes we know what the non-linguistic facts are (presupposes deflationism).
          *   Hirsch's quantifier variance assumes a specific semantic view.
          *   A robust criterion must not decide the metaphysical dispute *by fiat*.
      *   *Alternative Candidate:* **Extensional Adequacy regarding Paradigm Metaphysical Disputes.** If the theory *must* classify composition/persistence as substantive, it rules out deflationism. If it *must* classify them as verbal, it rules out realism.
      *   *Decision:* The strongest tension lies in **Metaphysical Neutrality**. Most familiar proposals fail because they implicitly assume a stance on the very dispute they are evaluating.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Set the stage (Carnap vs. Quine legacy).
      *   *Desiderata List:*
          1.  Extensional Adequacy (Paradigm Cases).
          2.  Metaphysical Neutrality (Non-circularity).
          3.  Epistemic Accessibility (Recognizability).
          4.  Factivity/Truth-Aptness (What happens to truth values?).
          5.  Reparability/Resolvability (Can we fix it?).
      *   *Classification:*
          *   Non-negotiable: Extensional Adequacy, Neutrality.
          *   Optional: Epistemic Accessibility (maybe some are opaque), Factivity (depends on realism vs. anti-realism).
      *   *Tensions:* The "Neutrality vs. Adequacy" tension is the big one. To call a metaphysical dispute "verbal" often looks like taking a side (deflationism). To call it "substantive" looks like taking a side (realism).
      *   *The "Killer" Desideratum:* **Metaphysical Neutrality.** It kills the "agreement on non-linguistic facts" test immediately because heavyweights deny the premise. It kills simple meaning variance because substantive disputes involve meaning variance too.
      *   *Bias Check:* Does listing these push toward deflationism? Yes, usually the *project* of finding verbal disputes is deflationarily motivated. I need to flag this.

  8.  **Refining the "Killer" Argument:**
      *   Why does "Metaphysical Neutrality" rule out the "Agreement on Non-Linguistic Facts" test? Because to apply that test, you need a prior inventory of "non-linguistic facts." If the ontologist says "composition facts are non-linguistic," the test fails. If the deflationist says "they are linguistic," the test succeeds. The test presupposes the conclusion.
      *   Why does it rule out "Different Meanings"? Because in substantive disputes (e.g., water is H2O vs. XYZ), meanings differ or evolve, but the dispute is about the world.
      *   Why does it rule out Hirsch? Hirsch assumes quantifier variance is the *explanation*, which is a substantive semantic claim.

  9.  **Final Review against Constraints:**
      *   Did I list desiderata? Yes.
      *   Did I give motivations? Yes.
      *   Did I distinguish non-negotiable vs. optional? Yes.
      *   Did I identify joint unsatisfiability? Yes (The Metaontological Dilemma).
      *   Did I pick the single most exclusionary requirement? Yes (Neutrality).
      *   Did I flag deflationary/heavyweight bias? Yes.

  10. **Polishing:** Ensure philosophical terminology is precise (e.g., "question-begging," "extensional adequacy," "quantifier variance"). Make sure the distinction between "verbal" and "merely verbal" is clear. (Self-Correction: Ensure I don't conflate "verbal" with "false". A verbal dispute can involve true/false claims relative to frameworks, but no absolute fact.)

  11. **Final Output Generation** (Proceed to write response based on these thoughts).
answer: |-
  To evaluate the claim that traditional metaphysical disputes are merely verbal, one must first establish the criteria for what counts as a "verbal dispute." This is not merely a semantic exercise; it is a metaontological gatekeeping mechanism. If the criteria are too loose, all metaphysics dissolves into linguistics (deflationism). If too tight, no metaphysical dispute is ever verbal (heavyweight realism).

  Below are the desiderata for a theory of verbal disputes, categorized by their necessity, followed by an analysis of their internal tensions and bias.

  ### I. The Desiderata

  #### 1. Extensional Adequacy (Paradigm Cases)
  *   **Requirement:** The theory must correctly classify clear, pre-theoretical cases of verbal and substantive disputes.
  *   **Motivation:** Any philosophical criterion must save the phenomena.
      *   *Verbal Paradigm:* Two people arguing whether a "tomato is a fruit" where one uses the botanical definition and the other the culinary definition, while agreeing on all biological and culinary properties.
      *   *Substantive Paradigm:* Two people arguing whether "there is a cat on the mat" where one sees it and the other denies it, despite agreeing on the meanings of words.
  *   **Status:** **Non-negotiable.** A theory that classifies the tomato case as substantive or the cat case as verbal is fundamentally broken.

  #### 2. Metaphysical Neutrality (Non-Circularity)
  *   **Requirement:** The criterion for identifying a verbal dispute cannot presuppose the truth or falsity of the metaphysical claim under dispute.
  *   **Motivation:** To avoid begging the question. If you want to prove that the dispute over composition (e.g., do tables exist?) is verbal, you cannot use a criterion that assumes tables do not exist (or that existence is merely a linguistic convention). The test for verbalness must be prior to the resolution of the ontological question.
  *   **Status:** **Non-negotiable.** Without this, the "verbal dispute" claim is not an argument against the metaphysician; it is merely a contradictory assertion.

  #### 3. Epistemic Accessibility (Recognizability)
  *   **Requirement:** It must be possible, at least in principle, for the disputing parties to recognize that their dispute is verbal.
  *   **Motivation:** If a dispute is merely verbal, it implies a confusion or a talking-past-each-other. If the parties *cannot* in principle realize this (even under ideal reflection), the distinction loses its normative force for ending the debate. It motivates the idea that verbal disputes are resolvable through conceptual clarification.
  *   **Status:** **Optional.** Some views (e.g., certain forms of error theory or deep quantifier variance) might hold that disputes are verbal due to deep semantic facts inaccessible to the speakers. However, most dialetheic or deflationary programs insist on this.

  #### 4. Truth-Aptness / Factivity
  *   **Requirement:** The theory must specify the truth-value of claims made in a verbal dispute.
  *   **Motivation:** In a paradigm verbal dispute (tomato), both parties can be said to be speaking truly relative to their frameworks, or neither is speaking truly *simpliciter*. A theory must explain whether verbal disputes lack truth-values, have relative truth-values, or have absolute truth-values that the parties are misdescribing.
  *   **Status:** **Optional (View-Dependent).**
      *   *Deflationists* typically require that verbal disputes lack a "fact of the matter" (no absolute truth).
      *   *Conceptual Pluralists* might allow that both are true relative to different conceptual schemes.
      *   *Heavyweights* might argue that even if verbal, one usage is "elite" or "natural," making one side objectively wrong.

  #### 5. Reparability (Resolvability)
  *   **Requirement:** A verbal dispute must be dissolvable by clarifying language or concepts, without requiring empirical investigation or metaphysical insight.
  *   **Motivation:** The point of labeling a dispute "verbal" is usually to show it is wasted effort. If clarifying terms does not end the disagreement (because they still disagree on the world), it was not verbal.
  *   **Status:** **Non-negotiable.** This is the functional core of the distinction. If the dispute persists after semantic clarification, it was substantive.

  ---

  ### II. Non-Negotiable vs. Optional Commitments

  | Desideratum | Classification | Reason |
  | :--- | :--- | :--- |
  | **Extensional Adequacy** | **Non-Negotiable** | Without matching intuitions on clear cases, the theory has no anchor. |
  | **Metaphysical Neutrality** | **Non-Negotiable** | Without this, the criterion is question-begging and dialectically useless. |
  | **Reparability** | **Non-Negotiable** | If clarification doesn't resolve it, the "verbal" label is empty. |
  | **Epistemic Accessibility** | **Optional** | Some semantic externalists might argue verbalness is hidden from speakers. |
  | **Truth-Aptness** | **Optional** | Depends on whether one is an anti-realist (no fact of the matter) or pluralist (multiple facts) about the domain. |

  ---

  ### III. Joint Unsatisfiability: The Metaontological Dilemma

  There is a severe tension, potentially a joint unsatisfiability, between **Extensional Adequacy** and **Metaphysical Neutrality** when applied to *borderline* metaphysical cases (e.g., composition, persistence, abstract objects).

  **The Tension:**
  1.  **To satisfy Extensional Adequacy:** The theory must classify traditional metaphysical disputes (e.g., Universalism vs. Nihilism about composition) as either verbal or substantive.
      *   If the theory classifies them as **verbal**, it aligns with Deflationary intuitions (Carnap, Hirsch, Thomasson).
      *   If the theory classifies them as **substantive**, it aligns with Heavyweight intuitions (Sider, Van Inwagen).
  2.  **To satisfy Metaphysical Neutrality:** The theory cannot assume the Deflationary or Heavyweight stance *in order to* make that classification.

  **The Problem:**
  Most criteria for verbal disputes implicitly rely on an inventory of "the facts."
  *   If you say, "A dispute is verbal if they agree on all **non-linguistic facts**," the Heavyweight ontologist replies: "We *don't* agree on all non-linguistic facts; we disagree on whether the table exists, and that is a non-linguistic fact."
  *   To insist they *do* agree on all non-linguistic facts is to assume Deflationism (that ontological facts are linguistic).
  *   To insist they *don't* is to assume Heavyweight Realism.

  Thus, satisfying Extensional Adequacy (by classifying the dispute) seems to require violating Metaphysical Neutrality (by presupposing the ontology). This suggests the project of a **neutral** criterion for verbal disputes in metaphysics may be internally incoherent.

  ---

  ### IV. The Single Most Exclusionary Requirement

  If I must pick one requirement that rules out the most familiar proposals, it is **Metaphysical Neutrality**.

  Here is how **Metaphysical Neutrality** dismantles the standard candidates:

  1.  **The "Agreement on Non-Linguistic Facts" Test:**
      *   *Proposal:* A dispute is verbal iff parties agree on all non-linguistic facts.
      *   *Failure:* This violates Neutrality. To apply this, you need a pre-established list of what counts as a "non-linguistic fact." If the ontological status of tables is in question, you cannot list "table facts" as non-linguistic without begging the question against the deflationist, nor exclude them without begging the question against the realist.
  2.  **The "Different Meanings" Test:**
      *   *Proposal:* A dispute is verbal iff parties mean different things by the key term.
      *   *Failure:* This violates Neutrality/Extensional Adequacy. In substantive scientific disputes (e.g., "Is heat mean kinetic energy?"), parties often have different conceptual associations (meanings) before the discovery. If meaning difference entails verbalness, all substantive theoretical progress would be classified as verbal.
  3.  **Hirsch's Quantifier Variance:**
      *   *Proposal:* Disputes are verbal because there are multiple equally good interpretations of the existential quantifier.
      *   *Failure:* This violates Neutrality. It assumes a specific semantic thesis (variance) to solve an ontological dispute. The Heavyweight realist denies variance is possible or "equally good." Using variance to prove the dispute is verbal assumes the realist is wrong about semantics to prove they are wrong about ontology.
  4.  **The Disquotational Test (Chalmers-style):**
      *   *Proposal:* A dispute is verbal if there is a disambiguation under which both parties' claims are true.
      *   *Failure:* While sophisticated, this often relies on a "scrutability" base. If the heavyweight claims the base is incomplete (missing ontological facts), the test fails. Applying the test requires assuming the base *is* complete, which is a deflationary assumption.

  **Verdict:** **Metaphysical Neutrality** is the killer constraint. Most proposals fail because they smuggle in an ontological conclusion (usually deflationary) to generate the verdict that the dispute is verbal.

  ---

  ### V. Bias Flag: Deflationary vs. Heavyweight

  **The Desiderata Push Toward Deflationism.**

  Explicitly flagging this is crucial: The very project of seeking a criterion for "merely verbal disputes" in metaphysics is historically and structurally biased toward **Deflationary Metaontology**.

  1.  **The Burden of Proof:** The desiderata place the burden on the *substantiveness* of the dispute. The default assumption in setting up these criteria is often that disputes *should* be resolvable via facts, and if they aren't, they are verbal. This privileges the deflationary view that ontological questions are unlike empirical questions.
  2.  **Extensional Adequacy Bias:** When philosophers list "Paradigm Verbal Cases," they often include metaphysical-sounding disputes (e.g., "Do holes exist?"). When they list "Paradigm Substantive Cases," they list empirical ones ("Is there a cat?"). This setup primes the theory to classify metaphysics as verbal.
  3.  **Neutrality Impossibility:** As noted in the tension section, a truly neutral criterion is likely impossible. Since the "verbal dispute" claim is almost exclusively wielded by deflationists to dissolve heavyweight metaphysics, a criterion that satisfies the desiderata will almost inevitably look like a deflationary ontology in disguise.

  **Conclusion:**
  To assess the claim that metaphysical disputes are verbal, you cannot simply apply a test. You must first acknowledge that **Metaphysical Neutrality** is the critical bottleneck. Any theory that satisfies Neutrality will likely be too weak to classify metaphysical disputes as verbal (satisfying the Heavyweight). Any theory strong enough to classify them as verbal will likely violate Neutrality (satisfying the Deflationist). Therefore, the choice of a criterion is not a pre-ontological neutral step; it is itself a first-order metaontological commitment.
