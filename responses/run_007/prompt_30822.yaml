answer: |-
  It is entirely understandable that you find the dogmatic deployment of this slogan frustrating. In contemporary philosophy of language, the slogan 'Assert only what you know' is typically associated with the Knowledge Norm of Assertion (KNA), most prominently defended by Timothy Williamson. However, in seminar discussion, it is often treated as a self-evident truism rather than the substantive, controversial thesis it actually is. Your colleague is effectively begging the question against the justified-true-belief (JTB) account of proper assertion by assuming the KNA is the correct norm without argument.

  To assist you in pressing your colleague precisely, I have laid out a menu of distinct readings of the slogan. These readings vary by the epistemic standard they impose, the modal force of the norm, and its metaphysical or normative status.

  ### A Menu of Readings for 'Assert Only What You Know'

  #### 1. The Strong Knowledge Norm (Williamsonian)
  *   **Content:** Knowledge ($K$).
  *   **Force:** Necessary condition. (One must not assert $p$ unless one knows $p$).
  *   **Status:** Constitutive. (This rule defines the practice of assertion; to assert without knowledge is to make a move that is defective *qua* assertion, akin to moving a bishop diagonally in chess).
  *   **Plausibility:** Highly contested. It explains why we challenge assertions with 'How do you know?', but struggles to explain why Gettierised assertions often feel intuitively permissible.
  *   **Verdict on your case:** **Improper.** Since the speaker lacks knowledge (due to the misleading evidence/Gettier structure), the assertion violates the constitutive rule.
  *   **Analysis:** This is the reading your colleague is likely invoking. It is substantive, not trivial, but it is not settled doctrine. It requires an argument that knowledge is the unique norm governing assertion, which is precisely what your Gettier-style case challenges.

  #### 2. The Truth Norm
  *   **Content:** Truth ($T$).
  *   **Force:** Necessary condition. (One must not assert $p$ unless $p$ is true).
  *   **Status:** Constitutive or Semantic. (Assertion aims at truth; a false assertion is a failed assertion).
  *   **Plausibility:** Plausible as a baseline, but widely considered too weak. It permits assertions based on lucky guesses, which seems epistemically irresponsible.
  *   **Verdict on your case:** **Proper.** The proposition asserted is true.
  *   **Analysis:** If your colleague accepts this reading, they must concede the assertion was permissible. If they reject it, they admit the slogan implies more than mere truth.

  #### 3. The Justified Belief Norm (Traditional)
  *   **Content:** Justified Belief ($JB$).
  *   **Force:** Necessary (and often argued as Sufficient) condition. (One must not assert $p$ unless one justifiably believes $p$).
  *   **Status:** Epistemic/Rational. ( grounded in the ethics of belief).
  *   **Plausibility:** Intuitively strong for much of the 20th century. It captures the idea that one must have evidence, but it does not demand the factivity required by the KNA.
  *   **Verdict on your case:** **Proper.** The speaker has strong evidence and is justified, even if the belief does not amount to knowledge.
  *   **Analysis:** This reading renders the slogan false if interpreted literally as 'knowledge', but captures the spirit of 'assert only what you have grounds for'. Your colleague dismisses this view by fiat.

  #### 4. The Reasonable-to-Believe Norm (Dutant, Brown)
  *   **Content:** It is reasonable for the speaker to believe $p$ (given their available evidence).
  *   **Force:** Necessary condition.
  *   **Status:** Epistemic.
  *   **Plausibility:** Currently the strongest rival to the KNA. It handles Gettier cases well: in a Gettier case, it is reasonable to believe $p$, so assertion is permissible even if knowledge is absent.
  *   **Verdict on your case:** **Proper.** The misleading evidence does not negate the reasonableness of the belief from the speaker's perspective.
  *   **Analysis:** This reading suggests the slogan is false. It distinguishes between the speaker's internal epistemic position (which licences assertion) and the external fact of knowledge (which does not).

  #### 5. The Certainty Norm (Cartesian)
  *   **Content:** Certainty ($C$).
  *   **Force:** Necessary condition.
  *   **Status:** Epistemic/Pragmatic.
  *   **Plausibility:** Generally regarded as too strong for ordinary discourse. We routinely assert things we are not certain of (e.g., 'The train leaves at 5pm') without censure.
  *   **Verdict on your case:** **Improper.** Gettier cases typically involve a lack of certainty (since the evidence is misleading).
  *   **Analysis:** If your colleague interprets 'know' in the slogan as implying Cartesian certainty, the norm is likely false because it prohibits too much ordinary assertion.

  #### 6. The Conversational Maxim (Gricean)
  *   **Content:** Quality (Do not say what you believe to be false / for which you lack adequate evidence).
  *   **Force:** Regulatory (not constitutive).
  *   **Status:** Conversational/Pragmatic.
  *   **Plausibility:** High as a description of cooperative dialogue, but low as a metaphysical constraint on the act of assertion itself.
  *   **Verdict on your case:** **Proper.** The speaker satisfied the maxim of Quality (they had adequate evidence and believed the truth).
  *   **Analysis:** This treats the slogan as a rule of thumb for smooth communication rather than a strict norm. Violating it causes conversational friction, but does not necessarily render the act 'improper' in a deep philosophical sense.

  ---

  ### Analysis: Triviality, Substance, and Falsity

  To answer your colleague precisely, you must identify which of the above they are relying upon. The slogan oscillates between being trivial, substantive, or false depending on the reading.

  1.  **Where the slogan is near-trivial:**
      If interpreted as **Reading 2 (Truth Norm)**, the claim 'Assert only what is the case' is nearly trivial, but it fails to capture the epistemic responsibility we expect of asserters. If interpreted as **Reading 6 (Conversational Maxim)**, it is a harmless platitude about cooperation, but lacks the normative bite to condemn your speaker.

  2.  **Where the slogan is substantive and defensible:**
      This is **Reading 1 (The Strong Knowledge Norm)**. This is the only reading that does real philosophical work. It claims that knowledge is the *sui generis* norm of assertion. However, because it is substantive, it is open to counter-example. Your Gettier-style case is precisely the standard counter-example used in the literature (see, for example, the work of Jessica Brown or Jennifer Lackey). To maintain this reading, your colleague must argue that our intuition that the speaker was permissible is mistaken, or that 'knowledge' survives the misleading evidence (a difficult line to hold).

  3.  **Where the slogan is false or unsupported:**
      If interpreted as **Reading 5 (Certainty)**, it is false because it prohibits standard assertions. If interpreted as **Reading 3 or 4 (Justification/Reasonableness)**, the slogan is literally false (since it demands *knowledge* rather than *justification*), though the underlying norm might be correct.

  ### Strategic Recommendation

  Your colleague is using the slogan to bypass the argument about whether knowledge is necessary for proper assertion. You might respond along these lines:

  > 'The slogan "Assert only what you know" is ambiguous between a constitutive norm of knowledge and a norm of reasonable belief.
  >
  > If you mean the **Truth Norm**, my speaker satisfies it, so the assertion was proper.
  > If you mean the **Justified Belief Norm**, my speaker satisfies it, so the assertion was proper.
  > If you mean the **Strong Knowledge Norm**, you are assuming the very thesis under dispute. The Gettier-style case I described is the standard counter-example to that norm. It shows that a speaker can satisfy all internal rational requirements for assertion (truth, belief, justification) yet lack knowledge.
  >
  > To dismiss the speaker as improper, you must argue that the absence of knowledge renders the assertion defective *even when* justification and truth are present. Merely repeating the slogan begs the question against the Reasonable-to-Believe Norm, which licences the assertion in this exact scenario.'

  By forcing your colleague to select a reading from this menu, you expose that their dismissal relies on the most controversial reading (Reading 1) while treating it as a platitude. In British philosophical discourse, we ought to be precise about whether we are discussing the *conditions for the act* or the *conditions for the agent*, and your colleague has conflated the two.

  **References for your further consideration:**
  *   Williamson, T. (2000). *Knowledge and Its Limits*. (For the constitutive KNA).
  *   Brown, J. (2008). 'Subject-Sensitive Invariantism and the Knowledge Norm for Practical Reasoning'. (For the Reasonable-to-Believe alternative).
  *   Lackey, J. (2007). 'Norms of Assertion'. (For arguments against KNA using Gettier cases).

  I hope this menu provides the analytical leverage you require to advance the seminar discussion.
