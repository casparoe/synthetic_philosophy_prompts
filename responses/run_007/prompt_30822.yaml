prompt: |-
  As a doctoral student in philosophy of language, I keep encountering the slogan 'assert only what you know' deployed as though it settled arguments about whether a particular utterance was permissible. Most recently, in a graduate seminar on testimony, I defended a speaker who asserted a proposition that was true and supported by strong evidence, but whose evidence was in fact misleading in the familiar way in which a justified true belief can fail to amount to knowledge. A colleague dismissed the speaker's assertion as improper on the grounds that she did not know the proposition; when I pressed him, he simply repeated the slogan.

  I want to be able to answer him precisely, rather than either conceding or pushing back vaguely. Please lay out the distinct principles that 'assert only what you know' could be used to express, as a menu of readings rather than a single reconstruction. For each reading, specify the content of the norm being proposed (truth, belief, justification, knowledge, certainty, or something else), its force (a necessary condition on permissible assertion, a sufficient condition, or both), its status (constitutive of assertion, merely conversational, or ethical), and its plausibility. Then indicate which of these readings would actually license the conclusion that the true, justified, but non-knowledgeable assertion in my example was improper, and which would not. I am especially interested in where the slogan turns out to be near-trivial, where it is substantive and defensible, and where it is false or unsupported. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in philosophy of language.
      *   **Context:** Graduate seminar on testimony. Colleague uses "Assert only what you know" (the Knowledge Norm of Assertion, or KNA) to dismiss a specific case (Gettier-style case: true, justified, but not knowledge).
      *   **Problem:** The colleague uses the slogan dogmatically without distinguishing nuances. The user wants a precise counter-argument or analysis.
      *   **Task:** Lay out distinct principles behind the slogan as a "menu of readings."
      *   **Requirements for each reading:**
          *   Content of the norm (Truth, Belief, Justification, Knowledge, Certainty, etc.).
          *   Force (Necessary, Sufficient, Both).
          *   Status (Constitutive, Conversational, Ethical).
          *   Plausibility.
          *   Application to the specific case (True, Justified, Non-Knowledge).
          *   Analysis of triviality, substantiveness, or falsity.
      *   **Tone/Style:** Academic, precise, British English.

  2.  **Deconstruct the Slogan ("Assert only what you know"):**
      *   The slogan is often associated with Timothy Williamson (Knowledge Norm of Assertion).
      *   However, in casual discourse, it conflates several distinct normative claims.
      *   I need to separate these claims to show the colleague where their reasoning might be weak or where the slogan is ambiguous.

  3.  **Drafting the Menu of Readings:**

      *   *Reading 1: The Strong Knowledge Norm (Williamsonian).*
          *   Content: Knowledge.
          *   Force: Necessary condition (You must know to assert).
          *   Status: Constitutive (Assertion is defined by this rule).
          *   Plausibility: High among proponents, controversial generally (Gettier cases are the battleground).
          *   Application: Rules the assertion improper.

      *   *Reading 2: The Truth Norm.*
          *   Content: Truth.
          *   Force: Necessary.
          *   Status: Constitutive or Semantic.
          *   Plausibility: High (asserting falsehoods seems wrong), but maybe too weak (you shouldn't assert truths you just guessed).
          *   Application: Rules the assertion *proper* (since it's true). This challenges the colleague if they care about truth.

      *   *Reading 3: The Justified Belief Norm (Traditional View).*
          *   Content: Justified Belief.
          *   Force: Necessary (and maybe Sufficient).
          *   Status: Epistemic/Rational.
          *   Plausibility: Intuitively strong (we blame people for asserting without evidence), but Gettier cases show justification isn't enough for knowledge.
          *   Application: Rules the assertion *proper* (since it's justified).

      *   *Reading 4: The Reasonable-to-Believe Norm (Dutant/Brown).*
          *   Content: Reasonable to believe (based on available evidence).
          *   Force: Necessary.
