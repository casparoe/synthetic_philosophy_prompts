      *   *The 'Only' in the slogan:* "Assert *only* what you know" implies Knowledge is a Necessary Condition. It does *not* imply that if you know, you *must* assert (Sufficient). I need to make sure I distinguish Necessary vs. Sufficient clearly.
      *   *The Gettier Objection:* This is the user's specific leverage point. The KNA struggles with Gettier cases unless one adopts a 'factive' view of evidence that survives Gettierization, or argues that intuitive propriety is misleading. I should mention the 'Knowledge-First' defence vs. the 'Reasonable Belief' alternative.
