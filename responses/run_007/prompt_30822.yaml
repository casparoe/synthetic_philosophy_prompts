      *(Self-Correction during drafting)*: I need to be careful not to simply say KNA is false. Many prominent philosophers defend it. I must present it as *one* reading among others, highlighting that its application to Gettier cases is the specific point of contention, not a settled matter. The colleague is treating a contested thesis as a slogan.

      *Reading 1 (KNA):* Content: Knowledge. Force: Necessary. Status: Constitutive. Verdict: Improper.
      *Reading 2 (Truth):* Content: Truth. Force: Necessary. Status: Constitutive/Semantic. Verdict: Proper (but norm is too weak).
      *Reading 3 (Justified Belief):* Content: Justified Belief. Force: Necessary. Status: Epistemic. Verdict: Proper.
      *Reading 4 (Reasonable to Believe):* Content: Evidence-supported belief. Force: Necessary. Status: Epistemic. Verdict: Proper.
