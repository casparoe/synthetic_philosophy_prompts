      *   **Section 3: The Dissolved Tension (The "Aggregation" Problem).** Focus on (2) vs. (3). Explain why community isn't just "more dispositions." It's about *normative correction*.
      *   **Section 4: The Coherent Core.** (1), (6), (7) fit well with (3).
