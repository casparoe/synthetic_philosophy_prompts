  2.  **Analyze the Commitments:**
      *   (1) Kripke's paradox is deep/real (not a confusion).
      *   (2) Dispositionalism fails as a *straight* solution (finite dispositions $\neq$ infinite rules; idealization smuggles normativity).
      *   (3) Skeptical Solution is broadly right (meaning = social practice/community agreement).
