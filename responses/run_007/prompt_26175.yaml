          *   *Fix:* (5) needs to be reinterpreted as compatible with non-factualism (e.g., meaning is real but not fact-stating in the robust sense) OR (1) needs to be qualified (the paradox is deep but solvable via a Straight Solution that restores facts).

      *   **(4) vs. (5):**
