          *   *Severity:* **Moderate.** If meaning is real, surely statements about meaning are true/false? (4) says we only have assertibility.
          *   *Fix:* Adopt a deflationary theory of truth. "True" just means "assertible." This reconciles (4) and (5).

      *   **(6) & (7):**
