      6. Suggest "Idealized Internalism" as a middle ground if Externalism feels too cold.

  9.  (Final Review of the "Drinker" logic): If the drinker *only* wants to die, and we say they have a reason not to, we are saying their desire is irrelevant to the reason. That is pure Externalism. I need to be clear about that.

  10. (Final Review of the "Brother" logic): Depression often removes the *capacity* to feel desire. Internalism struggles here. Externalism handles it well (Health is a reason).

