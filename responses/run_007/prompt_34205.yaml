answer: |-
  This is a fantastic exercise. What you're doing is essentially "reflective equilibrium"—testing general principles against specific intuitions and adjusting until they cohere. Your gut reactions are actually quite sophisticated and align with the biggest tensions in modern IP theory (Labor vs. Incentive vs. Personality).

  Here is an attempt to systematize your verdicts into a coherent framework, resolve the Physicist/Twitter tension, and apply it to fan fiction.

  ### 1. The Proposed Framework: "Labor, Norms, and Transformation"

  Your intuitions seem to rely on a triad of factors rather than a single rule. You aren't a strict Lockean (labor alone doesn't justify the Pharma case) or a strict Hegelian (personality doesn't justify blocking the Math case).

  Instead, your moral calculus seems to weigh three variables:

  1.  **Substantial Labor/Investment:** Did the originator put in significant work? (Board Game: Yes. Tweet: No.)
  2.  **Normative Expectation:** Was there an implicit social contract or context implying restricted use? (Physicist: Yes, academic norms. Twitter: No, public broadcast.)
  3.  **Transformative Addition:** Did the second party create something new, or just copy? (Sampling: High transformation. Board Game: Low transformation.)

  **The Principle:** *Intellectual ownership claims are strongest when there is substantial labor, a normative expectation of control, and low transformation by the taker.*

  ### 2. Resolving the Tension: Physicist vs. Twitter

  You feel the Physicist case is worse than the Twitter case, even though both involve "ideas in public." Here is why your framework distinguishes them, and where you might need to sharpen your intuition.

  **The Physicist (Verdict: Wrong)**
  *   **Norms:** Academia operates on a specific gift economy. Citations are currency. Q&A is understood as collaborative refinement, not a public domain dump. By not citing, the listener violated a **community trust**.
  *   **Labor Specificity:** An "offhand suggestion" in physics is often the key to a lock the speaker has been trying to open for years. The listener didn't just get a "premise"; they got the *solution*.
  *   **Verdict:** This is **Unjust Enrichment via Norm Violation.**

  **The Twitter Screenplay (Verdict: Ambivalent)**
  *   **Norms:** Twitter is a broadcast medium. The normative expectation is dissemination, not confidentiality. There is no implicit contract of citation.
  *   **Labor Specificity:** A "premise" (e.g., "Die Hard but on a spaceship") is abstract. Copyright law (and your intuition) distinguishes between *idea* and *expression*. The tweeter provided the seed; the writer grew the tree.
  *   **Verdict:** This is **Inspiration, not Appropriation.**

  **How to make them coherent:**
  If you want total coherence, you have to decide if **Specificity** matters more than **Medium**.
  *   *Adjustment:* If the Tweet contained a detailed beat-sheet, character arcs, and specific dialogue snippets, your intuition *should* shift toward "Theft."
  *   *Adjustment:* If the Physicist's suggestion was vague ("Have you tried looking at it from a topological angle?") and the listener did all the math, your intuition *should* shift toward "Not Theft."

  **Recommendation:** Keep your current verdicts but ground them in **Specificity**. The physicist stole a *solution*; the screenwriter stole a *prompt*.

  ### 3. The Outlier: The Pharma/Biopiracy Case

  This is the case that breaks a pure Lockean "Labor Theory." The Pharma company *did* mix their labor with the commons (isolating the compound, running trials). Why does it feel wrong?

  *   **The Lockean Proviso:** Locke argued you can appropriate from the commons only if you leave "enough and as good" for others. Biopiracy violates this by enclosing knowledge that was previously shared/communal.
  *   **Distributive Justice:** Your intuition here isn't about IP; it's about **Historical Exploitation**. The company is profiting from centuries of *other people's* labor (the indigenous community) without compensation.

  **Coherence Check:** To keep this verdict, your principle must include a **Provenance Clause**: *You cannot claim exclusive ownership over knowledge derived from prior communal labor without recognizing or compensating that source.*

  ### 4. Which Intuition Should You Reconsider?

  For the sake of philosophical coherence, the **Twitter/Screenplay** intuition is the weakest link.

  *   **Why:** If you believe the Indie Game Designer deserves protection because they spent two years building a system, you must acknowledge that *systems* and *mechanics* are hard to protect. But if you believe the Tweeter has *no* claim because they only wrote three sentences, you are drawing a hard line at "expression."
  *   **The Conflict:** If the Tweeter posted a detailed treatment (10 pages) and someone else filmed it, that is theft. If they posted three sentences, it's not.
  *   **Suggestion:** Refine your view to: **"Protection scales with the concreteness of the expression."** A premise is not property; a script is. This aligns with current copyright law (idea/expression dichotomy) and saves your intuition from contradiction.

  ### 5. Application to Fan Fiction

  Let's run Fan Fiction through your **Labor, Norms, and Transformation** framework.

  *   **Labor:** The fanfic author puts in massive labor (writing, plotting).
  *   **Norms:** This is the hinge. The original creator holds the legal right (Norm: "All rights reserved"). However, there is a subcultural norm that non-commercial fanwork is tolerated or encouraged (Norm: "Don't monetize, and we won't sue").
  *   **Transformation:**
      *   *High Transformation:* A story that uses the characters to explore new themes (e.g., a political thriller set in Hogwarts). This feels like the **Sampling** case. It creates new value without erasing the source.
      *   *Low Transformation:* A chapter-by-chapter rewrite of the original book. This feels like the **Board Game** case. It substitutes for the original.

  **The Verdict:**
  *   **Non-Commercial Fanfic:** Your principles suggest this is **Permissible**. It honors the "Sampling" intuition (transformative) and respects the "Norms" (not profiting off the original creator's labor). It aligns with a Hegelian view that the characters have taken on a life of their own in the public consciousness.
  *   **Commercial Fanfic:** Your principles suggest this is **Wrong**. It violates the "Indie Game" intuition. You are selling a product that relies entirely on the labor and brand equity of another without their consent.

  ### Summary of Your Philosophical Position

  You are not a Lockean Labor Theorist. You are not a Utilitarian.
  You are arguably a **Kantian Social Contract Theorist regarding IP.**

  Your view seems to be: *Intellectual property rights are not natural rights inherent in the object, but social privileges granted to encourage creation, bounded by community norms and fairness.*

  1.  **Theft** occurs when you violate a specific trust or norm to profit from another's labor (Board Game, Physicist).
  2.  **Independence** is respected when labor is parallel and truth is discovered, not made (Math).
  3.  **Justice** requires acknowledging prior communal contributions (Pharma).
  4.  **Culture** requires allowing transformation and building upon ideas, provided the core expression isn't hijacked for profit (Sampling, Fan Fiction).

  If you write your paper arguing that **IP legitimacy relies on Contextual Norms rather than Abstract Labor**, you'll have a very strong thread connecting all these cases.
