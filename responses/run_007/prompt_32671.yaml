      *   **The Tension:** Classical view equated determinism with predictability (Laplace's Demon). Chaos theory suggests limits on predictability due to infinite precision requirements.
      *   **The Questions:**
          1.  Does chaos theory *sever* the link between determinism and predictability, or just push it to ideal limits?
