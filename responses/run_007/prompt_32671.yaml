      *   *Determinism vs. Predictability:* Philosophers of science generally agree chaos theory *does* sever the practical link, but the *conceptual* link is trickier. Determinism is an ontological claim (about how the world *is*). Predictability is an epistemological claim (about what we can *know*).
      *   *Chaos:* It doesn't introduce randomness (usually). It's deterministic chaos. So the future *is* fixed by the past, but calculating it requires infinite precision.
