      *   *Correction on Claim 2:* Is it *always* weighting? Yes, mathematically it's a weighted average issue. But implying the aggregate is *never* real is the trap. I'll mark it "Accurate" regarding the math, but note the causal implication is missing.
      *   *Correction on Claim 4:* This is the most dangerous claim. I must emphasize that causal structure (DAGs) decides which number is real.
