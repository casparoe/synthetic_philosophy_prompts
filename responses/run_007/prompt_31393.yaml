prompt: |-
  I just started a data analyst job at a health insurance company, and I've been asked to look at whether a new patient outreach program reduces hospital readmissions. The weird thing is that overall, the outreach group has a *higher* readmission rate, but when I split patients by how sick they were at intake, the program looks like it helps in every severity bucket. My coworker sent me a blog post on Simpson's paradox that says (this is my paraphrase, not a direct quote):

  "Simpson's paradox shows that an association can point one way in the aggregate and the opposite way in every subgroup, so the aggregate number is really just an artifact of how the groups happen to be weighted. The usual lesson is that correlation is meaningless as a guide to causation: the same data can show a drug helps overall while hurting in every subgroup, and there's no fact of the matter about which effect is the real one — it just depends on how you slice. That's why you can't conclude anything about causes from observational data, and why even randomized trials get suspect once you start looking at subgroups, since you can always find some slice of the data that flips the effect."

  I keep rereading this and it feels like its overstating things, but I don't know enough to say exactly where. Can you audit the summary for me? Go claim by claim and tell me which parts are accurate, which are simplifications, and which are just wrong — and whether the practical conclusion (that I can't trust my readmissions analysis unless it comes from an RCT) actually follows from the accurate parts.

  Format: give me a table, one row per claim in the summary. Columns: (1) the claim, (2) verdict — accurate, simplification, wrong, or depends, (3) what's right about it, (4) what's off or missing, and (5) your confidence in that verdict (high/medium/low or a percentage). After the table, add a short note saying how confident you are in the overall audit and which single verdict you're least sure about.
