  | **"...there's no fact of the matter about which effect is the real one — it just depends on how you slice."** | **Wrong** | It highlights that choosing the wrong metric leads to wrong decisions. | This is statistically dangerous. There *is* a fact of the matter determined by causal structure. If "sickness" caused selection into the program (confounder), the subgroup estimate is real. If the program caused "sickness" (mediator), the aggregate might be real. You don't just pick; you analyze the causal graph. | High (95%) |
  | **"That's why you can't conclude anything about causes from observational data."** | **Wrong** | Observational data is harder to interpret than experimental data due to lack of randomization. | Modern causal inference (propensity scoring, instrumental variables, regression discontinuity) allows causal conclusions from observational data. Health insurance relies on this daily because RCTs are often impossible. | High (100%) |
  | **"...even randomized trials get suspect once you start looking at subgroups, since you can always find some slice of the data that flips the effect."** | **Simplification** | Subgroup analysis in RCTs reduces sample size and breaks randomization guarantees, increasing false positive risk. | "Always find some slice" describes *p-hacking* (data dredging), not Simpson's Paradox. In a properly powered RCT, true Simpson's reversals in subgroups are rare. This conflates statistical noise with structural paradox. | Medium (85%) |
  | **Practical Conclusion: "I can't trust my readmissions analysis unless it comes from an RCT."** | **Simplification** | RCTs are the gold standard for causal inference and remove the ambiguity of confounding. | In health operations, RCTs are often unethical or too costly. You *can* trust observational analysis if you adjust for confounders (like severity) using appropriate methods. Your specific case (severity is a confounder) suggests the subgroup analysis is likely trustworthy. | High (90%) |

  ### Auditor's Note

  **Overall Confidence:** High.
  The blog post summary you received mixes valid statistical warnings with philosophical nihilism that isn't supported by modern data science. While it is correct that raw aggregates can be misleading (Claim 1 & 2), the conclusion that "there is no fact of the matter" (Claim 4) is incorrect. In causal inference, we use Directed Acyclic Graphs (DAGs) to determine which number is the valid causal estimate.

  **Least Sure Verdict:** The claim about **RCT subgroups** (Claim 6).
  I marked this as a "Simplification" rather than "Wrong" because there is a kernel of truth: subgroup analysis in RCTs *is* riskier than the main effect analysis. However, the blog post conflates the risk of false positives due to small sample sizes with Simpson's Paradox specifically. Simpson's Paradox in an RCT is theoretically possible due to chance imbalances in randomization, but it is not as systematic as in observational data. The blog post uses this to overstate the impossibility of knowing truth, which is why I downgraded the confidence slightly—it's a nuanced distinction between "statistical noise" and "structural bias."

  **Advice for your specific case:**
  In your readmissions analysis, "severity at intake" is almost certainly a **confounder** (sicker patients were selected for outreach *and* are more likely to be readmitted). Therefore, the **subgroup analysis** (controlling for severity) is likely the correct causal estimate, not the aggregate. You do not need an RCT to trust this, but you should use a method like propensity score matching or multivariate regression rather than just simple splits to ensure you've fully adjusted for the severity differences.
