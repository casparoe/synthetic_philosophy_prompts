prompt: |-
  My reading group has been stuck on the special composition question for months, and two members — a committed universalist and a committed nihilist — have finally agreed to do an adversarial collaboration instead of just talking past each other. They need someone to draft the document they'd both sign.

  The document should open with a numbered list of claims both can accept: about the mereological formalism, about what the debate isn't about, about what common sense and science do and don't commit them to, about where the burden of proof lies. Then a disagreements table: the exact points where they part ways, with each side's position stated in wording its own proponent would endorse. Then identify the cruxes — the sub-questions such that settling one would actually move at least one of them — and for each crux, give a concrete case or argument both agree bears on it, with each side's prediction about how it would come out. If any part of their dispute turns out to be merely verbal once they've tightened their formulations, say which part and why.

  Please write the answer in British English.
