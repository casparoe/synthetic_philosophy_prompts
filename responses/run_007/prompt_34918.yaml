answer: |-
  **ADVERSARIAL COLLABORATION PROTOCOL: THE SPECIAL COMPOSITION QUESTION**

  **Date:** 24 October 2023
  **Parties:** The Universalist Proponent (UP) and The Nihilist Proponent (NP)
  **Facilitator:** Reading Group Secretariat

  **Preamble**
  This document formalises the terms of engagement regarding the Special Composition Question (SCQ): *Under what conditions do some things compose a further thing?* The purpose of this protocol is to isolate substantive metaphysical disagreement from methodological or linguistic confusion. By signing below, both parties agree to abide by the following framework for the duration of this collaboration.

  ***

  ### 1. Agreed Preliminaries

  Both parties affirm the following numbered claims as the baseline for discourse. These claims are selected to ensure the debate remains ontological rather than linguistic or sceptical.

  1.  **Mereological Formalism:** Both parties agree to utilise Classical Extensional Mereology (CEM) as the formal language for describing parthood and composition relations. Both agree that if composition occurs, it is timeless, unique, and associative. The disagreement concerns the *instantiation* of the composition relation, not the logical rules governing it *if* instantiated.
  2.  **Ontological Scope:** This debate is not concerning scepticism about the external world. Both parties agree that there are mind-independent concrete entities (simples). The debate is strictly regarding whether any plurality of these simples constitutes a further, composite entity.
  3.  **Common Sense and Science:** Both parties agree that ordinary discourse and scientific practice frequently employ singular terms and quantifiers that appear to refer to composite objects (e.g., 'tables', 'atoms', 'organisms'). Both parties agree that the truth of such discourse does not *automatically* settle the ontological question; a paraphrase strategy (for the NP) and a literalist strategy (for the UP) are both permissible starting points.
  4.  **The Nature of Simples:** Both parties agree that there exists a fundamental level of reality comprising mereological simples (entities with no proper parts). The disagreement is not about the existence of the base, but whether there is anything *over and above* the base.
  5.  **Burden of Proof:** Both parties agree that the burden of proof cannot be discharged solely by appeal to pre-theoretic intuition (e.g., 'It just seems obvious that tables exist' or 'It just seems obvious that trout-turkeys do not'). Arguments must rely on theoretical virtues such as parsimony, explanatory power, or logical coherence.
  6.  **Quantification:** Both parties agree to interpret the existential quantifier ($\exists$) in the Quinean sense (as the objectual range of bound variables) for the purpose of formal argumentation, acknowledging that natural language 'existence' may diverge from this formal usage.

  ***

  ### 2. Table of Disagreements

  The following table isolates the precise points of divergence. Each position is phrased to ensure the respective proponent can endorse it without concession.

  | Issue | Universalist Proponent (UP) Position | Nihilist Proponent (NP) Position |
  | :--- | :--- | :--- |
  | **The SCQ Answer** | For any plurality of entities $xx$, there exists a $y$ such that $xx$ compose $y$. Composition is unrestricted. | For any plurality of entities $xx$, there does not exist a $y$ (distinct from the $xx$) such that $xx$ compose $y$. Composition never occurs. |
  | **Ontological Commitment** | The domain of quantification includes both simples and complex fusions. To quantify over $xx$ is to commit to their fusion. | The domain of quantification includes only simples. Talk of composites is a *façon de parler* regarding simples arranged in a specific manner. |
  | **Truthmakers** | The sentence 'There is a chair' is made true by the existence of the composite object *chair*. | The sentence 'There is a chair' is made true by the existence of simples *arranged chairwise*. |
  | **Parsimony** | Quantitative parsimony (counting objects) is less important than qualitative parsimony (counting kinds of laws/facts). Unrestricted composition simplifies the logic of existence. | Quantitative parsimony is a primary theoretical virtue. Positing entities without causal powers distinct from their parts is ontologically profligate. |
  | **Vagueness** | Vagueness is linguistic, not ontological. Since restricted composition would entail ontological vagueness (which is impossible), composition must be unrestricted. | Vagueness is linguistic. The fact that 'object' is vague does not force us to accept arbitrary fusions; it merely shows the term 'object' is not a precise ontological category. |

  ***

  ### 3. Cruxes and Predictive Cases

  A 'crux' is defined here as a sub-question such that settling it would compel at least one party to revise their position or concede significant ground. For each crux, a concrete case is identified, along with each side's prediction regarding its resolution.

  **Crux 1: The Argument from Vagueness**
  *   **Sub-question:** Can ontological vagueness exist in the world, or is all vagueness representational?
  *   **Concrete Case:** A sorites series of particles gradually coalescing into a solid sphere. At no precise instant does composition 'switch on' if it is restricted.
  *   **UP Prediction:** If it is proven that ontological vagueness is incoherent, the NP must accept Unrestricted Composition (or Nihilism, but Nihilism is ruled out by the existence of simples). The UP argues restricted composition entails vague existence, which is impossible.
  *   **NP Prediction:** If it is proven that vagueness is purely semantic, the UP loses the primary argument against restriction. The NP maintains that 'compose' is a vague predicate that does not carve reality at the joints, allowing for Nihilism without ontological vagueness.

  **Crux 2: Scientific Indispensability**
  *   **Sub-question:** Does our best fundamental physics require quantification over composite objects to be true, or can it be paraphrased into plural quantification over simples?
  *   **Concrete Case:** Solid-state physics equations referring to 'lattices' or 'phonons'.
  *   **UP Prediction:** If it is shown that physics cannot be reformulated without singular reference to composites (i.e., plural paraphrase fails to capture the causal powers), the NP must accept the existence of composites.
  *   **NP Prediction:** If it is shown that all physical predictions can be derived from the interactions of simples alone (nominalisation), the UP loses the argument from scientific realism. The NP predicts paraphrase is always possible in principle.

  **Crux 3: Causal Exclusion**
  *   **Sub-question:** Do composite objects possess causal powers over and above the collective causal powers of their parts?
  *   **Concrete Case:** A brick breaking a window. Did the *brick* cause it, or the *simples arranged brickwise*?
  *   **UP Prediction:** If composites are denied, we face systematic causal overdetermination or epiphenomenalism regarding macroscopic events. To save causal efficacy, composites must exist.
  *   **NP Prediction:** If composites are posited, we face causal overdetermination (the brick and the simples both cause the break). To save parsimony, only the simples cause the break. The NP predicts the UP cannot solve the exclusion problem without redundancy.

  ***

  ### 4. Analysis of Potential Verbal Dispute

  Upon tightening the formulations above, the collaborators identify one area where the dispute risks being merely verbal.

  **The Disputed Element:** The semantics of the existential quantifier ($\exists$).

  **Diagnosis:**
  If the UP defines 'exists' as 'is a value of a bound variable in a true theory' and the NP defines 'exists' as 'is a fundamental entity with causal powers', they may be talking past one another.
  *   The UP says: "There exists a fusion of the trout and the turkey." (Meaning: The quantifier ranges over it).
  *   The NP says: "There does not exist a fusion of the trout and the turkey." (Meaning: It is not a fundamental entity).

  **Resolution Protocol:**
  To ensure the dispute is substantive, both parties agree to frame their claims in terms of **ontological fundamentality** rather than bare existence.
  *   The UP must argue that the fusion is *something over and above* the parts, not merely that it falls within a quantifier range.
  *   The NP must argue that the paraphrase strategy ('simples arranged thus-and-so') captures all the *facts* without requiring the *object*.

  If, after this adjustment, the UP admits the fusion adds no new fundamental facts, and the NP admits the quantifier ranges over the fusion, the dispute is declared verbal and dissolved. If the UP insists the fusion adds a fact (e.g., a fact of unity) and the NP insists it does not, the dispute remains substantive.

  ***

