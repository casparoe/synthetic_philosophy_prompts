answer: |-
  The position that there is a morally significant difference between lying and merely misleading is commonly referred to as **the asymmetry thesis**, the contrary view is **the equivalence thesis** (or **parity thesis**), and the boundary puzzles you describe are analyzed under the framework of **assertoric commitment** within the philosophy of language and ethics.

  The **asymmetry thesis** holds that lying (asserting what one believes to be false) violates a distinct normative duty—often tied to the norms of assertion itself—that merely misleading (implicating what one believes to be false while asserting truth) does not. Proponents argue that lying corrupts the institution of communication more deeply because it abuses the convention of truth-telling directly, whereas misleading exploits the listener's own inferential reasoning. This view has Kantian roots, suggesting a strict duty against false assertion, and historically contrasts with **casuistry** (particularly Jesuitical doctrines of "mental reservation"), which sought to permit misleading truths to evade the sin of lying. The **equivalence thesis**, often held by consequentialists, argues that the moral weight lies entirely in the intent to deceive and the resulting harm, rendering the linguistic mechanism morally irrelevant; on this view, your Cases 1 and 2 are morally identical because the outcome and intention are the same.

  The boundary puzzles you outline (Cases 3–6) fall under the technical debate over **the definition of lying**, specifically focusing on **assertoric commitment**. Contemporary philosophers like Jennifer Saul, Don Fallis, and J. E. Mahon analyze these cases using **Gricean pragmatics**, which distinguishes between **what is said** (literal content) and **what is implicated** (inferred content). Your Cases 3 and 4 (winks and tone) test the limits of **common ground** and **mutual knowledge**: if the speaker signals insincerity, have they still undertaken the commitment to the truth required for a lie? Your Cases 5 and 6 (omissions and conventions) probe the difference between **conversational implicature** (inferred from context) and **conventional implicature** (attached to specific words or community norms). If a community conventionally understands a true statement as a guarantee of truthfulness (Case 6), many philosophers argue the speaker has implicitly undertaken assertoric commitment to the false implication, potentially collapsing the distinction back into lying.

  While "the asymmetry thesis" is the standard label for the moral claim, it is a descriptive term within analytic philosophy rather than a rigid school name like "Utilitarianism." The phenomenon you are tracking is precisely the tension between **semantic content** and **pragmatic effect** in moral evaluation. The literature does not always agree on a single name for the cluster of boundary puzzles, but they are universally recognized as the **problem of assertoric commitment** or the **lying-misleading boundary problem**. If you search for work by **Jennifer Saul** (*Lying, Misleading, and What is Said*) or **Thomas Carson** (*Lying and Deception*), you will find the exact taxonomy you are looking for, including detailed treatments of "bald-faced lies" (similar to your Case 4) and the moral relevance of **conversational norms**.
