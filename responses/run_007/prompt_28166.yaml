  ## 6. Why This Design Works for Your Seminar
  1.  **Experiential:** Students don't just hear about the Hitchhiker case; they *are* the Hitchhiker feeling the temptation to Stiff, and the Driver feeling the fear of being Stiffed.
  2.  **Clear Data:** The point differential (8 vs 0) makes the advantage of commitment undeniable.
  3.  **Philosophical Precision:** The debrief explicitly separates the *mechanical enforcement* (game) from the *dispositional enforcement* (Parfit), allowing you to discuss the "irrationality" nuance without breaking the game mechanics.
  4.  **Manageable:** 16 students is the perfect size for 8 pairs; rotation ensures they don't get stuck with one "defector" partner and lose faith in the game.
