answer: |-
  # Game Design: The Desert Crossing Seminar

  **Topic:** Diachronic Rationality, Commitment Devices, and Parfit's Hitchhiker.
  **Time:** 80 Minutes.
  **Students:** 16 (8 Pairs).
  **Materials:** Printed payoff sheets, decision slips (two colors), tokens/points ledger (projected or whiteboard), small prize (chocolate/bookmark).

  ---

  ## 1. Learning Objective
  Students will experience the **Time-Consistency Problem**: actions that are rational at the moment of choice ($t_2$) lead to suboptimal outcomes from the perspective of the earlier self ($t_1$). They will test mechanisms (commitment devices) that allow the $t_1$ self to constrain the $t_2$ self to secure cooperation.

  ## 2. Payoff Structure (The "Desert Matrix")
  Use **Survival Points (SP)**. Tell students the student with the most SP at the end wins a prize.

  **Roles:**
  *   **Driver (D):** Has a vehicle.
  *   **Hitchhiker (H):** Stranded in the desert.

  **The Sequence:**
  1.  **D chooses:** *Rescue* (costly) or *Pass* (safe).
  2.  **If Pass:** Game ends. Payoffs: **D=0, H=0**.
  3.  **If Rescue:** H is saved (H gains value). Now H chooses: *Pay* (reward D) or *Stiff* (keep all).
      *   **H Pay:** D gets reward, H pays cost. Payoffs: **D=+5, H=+10**.
      *   **H Stiff:** D gets nothing, H keeps all. Payoffs: **D=-5, H=+20**.

  **The Rational Trap:**
  *   At $t_2$ (after rescue), H compares Pay (+10) vs. Stiff (+20). **Rational choice: Stiff.**
  *   At $t_1$ (before rescue), D anticipates H will Stiff. D compares Rescue (-5) vs. Pass (0). **Rational choice: Pass.**
  *   **Equilibrium:** (Pass, Stiff). Payoffs: **(0, 0)**.
  *   **Pareto Optimal:** (Rescue, Pay). Payoffs: **(5, 10)**.

  ---

  ## 3. Game Flow (80 Minutes)

  ### Introduction (10 mins)
  *   Distribute payoff sheets. Walk through the matrix.
  *   **Crucial Framing:** "This is not a test of morality. It is a test of strategic rationality. Your goal is to maximize your own points. Do not cooperate out of kindness; cooperate only if it is in your interest."
  *   Assign roles: 8 Drivers, 8 Hitchhikers. Use name tents or cards.

  ### Phase 1: The Baseline (20 mins)
  *   **Rounds 1–3.**
  *   **Procedure:**
      1.  Pairs sit back-to-back or use dividers (no eye contact).
      2.  H writes "Pay" or "Stiff" on a **Red Slip**. Folds it. (This is a *promise*, but unenforced).
      3.  D decides "Rescue" or "Pass" on a **Blue Slip**.
      4.  Slips exchanged simultaneously.
      5.  If D Rescues, reveal H's slip. Record points.
      6.  Rotate partners every round.
  *   **Expected Outcome:** Most Drivers will Pass. Hitchhikers who get rescued will Stiff. Class average score stays low.
  *   **Instructor Note:** If cooperation is high (due to social pressure), note it but proceed. "In the real desert, you won't know these people. Let's assume anonymity."

  ### Phase 2: The Commitment Mechanism (30 mins)
  *   **Rounds 4–6.**
  *   **New Rule:** Before Round 4, Hitchhikers may optionally purchase a **"Reputation Bond."**
      *   **Cost:** 2 SP (deducted immediately from H's total).
      *   **Effect:** The Bond is public. Drivers see who has a Bond.
      *   **Enforcement:** If a Bonded H chooses *Stiff*, they pay a **Penalty of 15 SP** (enforced by instructor). If they *Pay*, no penalty.
      *   **Unbonded H:** Play as in Phase 1 (no penalty).
  *   **Procedure:**
      1.  H decides: Buy Bond (pay 2 SP) or Stay Free.
      2.  D observes H's status (Bonded vs. Free).
      3.  D decides Rescue/Pass.
      4.  H decides Pay/Stiff.
      5.  Penalties applied if applicable.
      6.  Rotate partners.
  *   **Expected Outcome:**
      *   Drivers will Rescue Bonded H (because Pay is now rational for H: +10 Pay vs. +20 Stiff - 15 Penalty = +5).
      *   Drivers will Pass Free H (expecting Stiff).
      *   Bonded H Net Gain: -2 (cost) + 10 (payoff) = **+8**.
      *   Free H Net Gain: **0** (no one rescues them).
      *   *Result:* Students who constrained themselves did better.

  ### Debrief & Philosophical Mapping (20 mins)
  *   Tally scores. Announce winner.
  *   Lead the discussion using the guide below.

  ---

  ## 4. Debrief Guide

  ### A. Mapping the Equilibrium (Synchronic Rationality)
  *   **Ask Phase 1 Hitchhikers:** "When you held the 'Stiff' slip, why did you choose it?"
      *   *Target Answer:* "At that moment, I had already been rescued. Paying cost me 10 points. Stiffing cost me nothing. It was the rational choice *at that moment*."
  *   **Concept:** **Synchronic Rationality.** At $t_2$, defecting dominates.
  *   **Ask Phase 1 Drivers:** "Why did you drive past?"
      *   *Target Answer:* "I knew they would stiff me."
  *   **Concept:** **Backward Induction.** Because $t_2$ rationality is known at $t_1$, the beneficial transaction never happens.

  ### B. The Value of Constraint (Diachronic Rationality)
  *   **Ask Phase 2 Bonded Hitchhikers:** "You paid 2 points to limit your future self. Was it worth it?"
      *   *Target Answer:* "Yes, because it made the Driver trust me. I ended with more points than the Free Hitchhikers."
  *   **Concept:** **Diachronic Rationality.** It was rational at $t_1$ (start of game) to constrain $t_2$ (end of game), even though the constraint limits $t_2$ freedom.
  *   **Key Takeaway:** Rationality isn't just about maximizing utility at the instant of choice; it's about managing your future choices to make yourself a better partner *now*.

  ### C. The Philosophical Gap (Penalty vs. Disposition)
  *   **The Hard Question:** "In Phase 2, the Bond worked because I (the instructor) enforced a penalty. If you Stiffed, you lost points. That made Paying *synchronically rational* (+10 vs +5). Does this capture Parfit's point about **irrationality**?"
  *   **Discussion Points:**
      1.  **The Game's Limit:** In the game, the commitment device *changed the payoffs*. Paying was no longer irrational at $t_2$; it was just the new maximizing choice.
      2.  **Parfit's Claim:** Parfit argues for cultivating a **Disposition** (e.g., being a "Promise-Keeper") where you Pay *even without the penalty*, even though it costs you points at $t_2$.
      3.  **Why bother?** If everyone knows you have the Disposition, they Rescue you. You get the +10 benefit. If you were a pure Maximizer, you'd get 0.
      4.  **The Tension:** It is rational to *become* the kind of person who acts irrationally (by immediate standards) in specific situations.
      5.  **Real World:** Emotions (guilt, pride) act as internal penalties. We don't need a contract to pay a waiter; we feel bad if we don't. That "feeling bad" is the internal Bond.

  ### D. Addressing Predictable Problems
  *   **Problem:** "In Phase 1, some students cooperated anyway."
      *   **Response:** "This shows that in real life, we *already* have dispositions. You couldn't turn off your social training. The game assumes 'Homo Economicus,' but you are 'Homo Socialis.' The philosophical puzzle is: *Should* we train ourselves to be more like Homo Economicus, or is our social training the rational commitment device?"
  *   **Problem:** "In Phase 2, some Free Hitchhikers got rescued."
      *   **Response:** "This is 'noise.' Drivers took a risk. But over many rounds (or in the real desert), that strategy goes extinct. The Bonded strategy is stable."
  *   **Problem:** "Is this just manipulation?"
      *   **Response:** "It's self-binding. You aren't tricking the Driver; you are changing the facts of your own psychology so the Driver can rely on you."

