  ## 5. Instructor Cheat Sheet: Numbers & Logistics

  **Payoff Summary Table (Project this):**

  | Scenario | Driver Points | Hitchhiker Points |
  | :--- | :---: | :---: |
  | **Driver Passes** | 0 | 0 |
  | **Driver Rescues + H Stiffs** | -5 | +20 |
  | **Driver Rescues + H Pays** | +5 | +10 |
  | **H Bond Penalty (if Stiff)** | N/A | -15 |
  | **H Bond Cost (Upfront)** | N/A | -2 |

  **Net Calculation for Bonded H who Pays:**
  -2 (Cost) + 10 (Payoff) = **+8**.
  **Net Calculation for Free H (No Rescue):**
  **0**.

