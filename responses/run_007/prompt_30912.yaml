  # JOINT STATEMENT ON THE STATUS OF INTENTIONALITY
  **An Adversarial Collaboration**

  **Signatories:**
  *   **Representative A (The Biological Naturalist):** Holds that there is a genuine, principled distinction between original (intrinsic) and derived intentionality.
  *   **Representative B (The Interpretive Naturalist):** Holds that all intentionality is derived, with "original intentionality" serving as a placeholder for an unexplained gap rather than a natural kind.

  ---

  ## I. AGREED CLAIMS

  We, the undersigned, affirm the following propositions as common ground for this debate. These claims delineate the scope of our inquiry and exclude categories of disagreement that are not central to our specific dispute.

  1.  **Naturalism:** Both sides reject substance dualism. We agree that minds are caused by biological processes in the brain and that there is no supernatural component to intentionality.
  2.  **The Phenomenon:** We agree that "intentionality" refers to the "aboutness" or content-bearing capacity of mental states (e.g., believing *that p*, fearing *x*). We agree this is a real phenomenon that requires naturalistic explanation.
  3.  **Derived Intentionality:** We agree that artifacts (sentences, maps, computer states) possess "derived intentionality." Their aboutness is parasitic on the intentional states of agents who create or interpret them.
  4.  **Explanatory Target:** We agree that any successful theory must explain how physical systems (specifically organisms) come to represent states of affairs in the world.
  5.  **Scope Limitation:** This debate is not primarily about *qualia* or the subjective "feel" of experience (phenomenal consciousness), though we acknowledge overlaps. Our focus is strictly on *content* (intentionality).
  6.  **Evolutionary Origin:** We agree that human beings and their cognitive capacities are the product of natural selection. There was no moment in evolutionary history where a non-intentional soul was inserted into a physical body.

  ---

  ## II. POINTS OF DISAGREEMENT

  The following table isolates the precise metaphysical and explanatory divergences between our positions. Each formulation is phrased to be acceptable to the respective signatory.

  | Issue | Representative A (Biological Naturalist) Formulation | Representative B (Interpretive Naturalist) Formulation |
  | :--- | :--- | :--- |
  | **1. The Status of "Original" Intentionality** | Original intentionality is a **causal, intrinsic biological feature** of certain brain states, analogous to digestion or photosynthesis. It exists independently of any observer's interpretation. | "Original" intentionality is a **useful fiction** or shorthand for systems so complex that their derived intentionality is transparent to us. All intentionality is relative to an interpretive stance. |
  | **2. The Metaphysical Gap** | There is a **principled distinction** between systems that possess original intentionality (brains) and systems that merely simulate it (computers), regardless of functional isomorphism. | There is **no metaphysical chasm**, only a difference in degree of complexity and organizational structure. The distinction is pragmatic, not ontological. |
  | **3. Sufficiency of Syntax/Function** | Syntax (symbol manipulation) and functional organization are **not sufficient** for semantics (meaning). You cannot get "aboutness" out of formal processes alone. | Syntax plus the right causal history and organizational complexity **is sufficient** for semantics. Meaning is constituted by the role states play in the system's interaction with the environment. |
  | **4. The Source of Normativity** | Normativity (truth conditions, correctness) is grounded in the **biological conditions of satisfaction** intrinsic to the organism. | Normativity is grounded in the **predictive utility** of adopting the intentional stance toward the system. |

  ---

  ## III. CRUXES AND TEST CASES

  We identify the following sub-questions as "cruxes." Settling these empirically or conceptually would force at least one side to revise their position. For each crux, we specify a concrete case and record our divergent predictions.

  ### Crux 1: The Evolutionary Continuum
  **Question:** Can intentionality emerge via a continuum of non-intentional steps without a discrete metaphysical leap?

  *   **Concrete Case:** The transition from simple chemotaxis in bacteria (moving toward sugar) to perceptual representation in frogs (snapping at flies).
  *   **Representative A Prediction:** At some point in this lineage, biological causation creates intrinsic content. Before that point, there is only causal correlation. There is a fact of the matter about where the line is drawn, even if epistemically hard to locate.
  *   **Representative B Prediction:** There is no line. We gradually adopt the intentional stance as complexity increases. To ask if the bacterium "really" represents sugar is a bad question; the only question is whether the stance yields predictive power.

  ### Crux 2: The Silicon Substrate
  **Question:** Is biological substrate causally necessary for original intentionality?

  *   **Concrete Case:** A functionally isomorphic artificial system (e.g., a perfect neural simulation of a human brain) implemented in silicon rather than carbon.
  *   **Representative A Prediction:** The silicon system will lack original intentionality. It will simulate understanding without possessing it, because it lacks the specific biological causation of the brain.
  *   **Representative B Prediction:** The silicon system will possess intentionality equal to the human. If it behaves indistinguishably and maintains the same organizational relations, the substrate is irrelevant. Denying this is "bio-chauvinism."

  ### Crux 3: The Fact of the Matter (Normativity)
  **Question:** Is there a fact of the matter about what a system means independent of an interpreter?

  *   **Concrete Case:** A lone human survives the extinction of all other interpreters. Do their thoughts still have content?
  *   **Representative A Prediction:** Yes. Their thoughts retain intrinsic content because the biological conditions of satisfaction remain intact regardless of external interpretation.
  *   **Representative B Prediction:** No (or the question is moot). Content is essentially relational. Without a community or an interpretable context, the attribution of specific content becomes indeterminate, though the capacity for interpretation remains.

  ---

  ## IV. ASSESSMENT OF VERBAL DISPUTE

  We have analyzed whether our disagreement is merely verbal. We conclude that while there is a verbal component, it does not dissolve the substantive disagreement.

  **1. The Verbal Component:**
  There is a terminological overlap regarding the word "derived."
  *   **Representative A** uses "derived" to mean *ontologically dependent on prior original intentionality* (e.g., words depend on minds).
  *   **Representative B** uses "derived" to mean *attributed via an interpretive stance* (e.g., minds are attributed intentionality by observers).
  *   **Resolution:** We agree to stipulate that when Representative B says "all intentionality is derived," they do not mean it depends on a *prior* mind (which would lead to infinite regress), but rather that it is not *intrinsic* in the sense of being observer-independent.

  **2. The Substantive Component:**
  Even after clarifying terminology, a metaphysical disagreement remains.
  *   **Representative A** insists on **Observer-Independence:** They claim there is a fact about whether a system has intentionality that holds true even if no one is there to interpret it (provided the biology is present).
  *   **Representative B** insists on **Stance-Dependence:** They claim that intentionality is a property like "being a tool"—it exists only relative to a user/interpreter.
  *   **Why it is not merely verbal:** This is a disagreement about the structure of reality. If Representative A is right, there are intrinsic semantic properties in the universe. If Representative B is right, semantic properties are relational/extrinsic. This affects how we approach AI development, cognitive science, and the definition of life.

  **3. Conclusion on Verbal Dispute:**
  We acknowledge that Representative B could concede that brains are "special" without calling it "original intentionality," and Representative A could concede that biology is a continuum without denying intrinsicness. However, until we agree on whether intentionality is an **intrinsic physical feature** (like mass) or a **relational heuristic** (like value), the debate remains substantive.
