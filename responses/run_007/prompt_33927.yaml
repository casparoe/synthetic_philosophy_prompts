  You're conflating the basis for the individual beliefs with the basis for the global doubt, and that's where the symmetry breaks down. In the preface case, I don't believe claim $p_1$ because of a base rate; I believe it because I verified it. The base rate only enters when I step back and consider the collection, generating the humble belief that at least one claim is false. So the tension is between specific verification and general fallibility. In the lottery, the base rate is the *only* reason I have for believing ticket 1 loses. There is no verification. This isn't a psychological quirk; it's a structural difference in justification. The preface paradox shows that justified belief isn't agglomerative; the lottery paradox shows that high probability isn't sufficient for justification. If you solve the lottery by lowering the probability threshold, you haven't touched the preface problem, because the author's beliefs aren't grounded in probability at all. They're grounded in evidence that happens to be fallible. Treating them as identical ignores where the epistemic weight actually sits.
