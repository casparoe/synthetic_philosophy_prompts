answer: |-
  # JOINT STATEMENT ON THE INTERPRETATION AND APPLICATION OF PROBABILITY THEORY

  **Signatories:** The Frequentist Working Group & The Subjectivist Bayesian Working Group
  **Date:** October 26, 2023

  ## PART I: AREAS OF CONSENSUS

  We, the undersigned, acknowledge that while our philosophical interpretations of probability differ fundamentally, we share a common mathematical language and recognize the pragmatic utility of each other's methodologies in specific contexts. We agree to the following claims:

  1.  **Mathematical Formalism:** We both accept the Kolmogorov axioms as the correct mathematical foundation for probability calculus. We agree that theorems derived from these axioms (e.g., Bayes' Theorem, the Law of Large Numbers, the Central Limit Theorem) are mathematically valid regardless of interpretive stance.
  2.  **The Likelihood Function:** We agree that the likelihood function, $P(Data | Hypothesis)$, represents the same mathematical object for both sides. We acknowledge that disagreements arise not from the calculation of likelihoods, but from how they are combined with priors or evaluated against sampling distributions.
  3.  **Mutual Utility:**
      *   The Frequentist signatory acknowledges that Bayesian methods are superior for sequential analysis, decision theory under uncertainty, and incorporating external information via priors when such information is robust.
      *   The Bayesian signatory acknowledges that Frequentist methods provide essential guarantees regarding long-run error rates (coverage, Type I/II error control), which are critical for regulatory standards and quality control.
  4.  **Verbal vs. Genuine Disagreement:** We explicitly distinguish between verbal and substantive disputes.
      *   **Verbal:** We agree that much of our historical debate concerns the definition of the word "probability." The Frequentist reserves the term for long-run relative frequencies of repeatable events. The Bayesian reserves the term for coherent degrees of belief. We acknowledge that if we simply agreed to use distinct terms (e.g., "frequency" vs. "credence"), many apparent contradictions would vanish.
      *   **Genuine:** We acknowledge genuine disagreement remains regarding which concept is *normatively primary* for scientific inference and whether rational belief can be uniquely determined by data alone.
  5.  **Limits of the Frequentist View:** The Frequentist signatory acknowledges difficulty in assigning probabilities to unique, non-repeatable events (e.g., "The probability that this specific patient survives surgery") without invoking hypothetical infinite populations, which may feel metaphysically extravagant.
  6.  **Limits of the Bayesian View:** The Bayesian signatory acknowledges that in the absence of informative data, posterior distributions can remain overly sensitive to the choice of prior, potentially allowing subjective bias to influence scientific conclusions under the guise of "updating."
  7.  **Conditions for Theoretical Abandonment (Frequentist):** The Frequentist signatory would consider their position falsified if it were demonstrated that long-run frequency stabilization fails to occur in physically random processes (e.g., quantum decay, fair coin tosses) under controlled conditions, or if Frequentist procedures were proven to be systematically incoherent (sure-loss contracts) in decision-making scenarios where Bayesian methods succeed.
  8.  **Conditions for Theoretical Abandonment (Bayesian):** The Bayesian signatory would consider their position falsified if it were demonstrated that rational agents with identical information could not converge on similar posteriors even with infinite data, or if subjective priors were shown to inevitably lead to worse predictive accuracy than frequency-based estimators in the long run, regardless of the domain.

  ## PART II: TABLE OF DISAGREEMENTS

  The following table isolates the remaining substantive disagreements. We have phrased the formulations to ensure each signatory accepts the description of their own view.

  | (a) Precise Formulation of Disagreement | (b) The Crux (Sub-question to settle) | (c) Agreed Test, Case, or Argument | (d) Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Single-Case Probability**<br><br>**Frequentist:** Probability statements regarding single, non-repeatable events (e.g., "Probability Candidate X wins") are category errors; they are either 0 or 1, or merely shorthand for a reference class frequency.<br><br>**Bayesian:** Probability statements regarding single events are meaningful and necessary; they quantify the uncertainty of a rational agent given current information. | Is probability a property of the *external world* (process) or the *internal state* (knowledge)? | **The Unique Event Bet:** A one-time wager on a unique future event (e.g., the outcome of a specific election or a specific clinical trial for a rare disease) where no historical frequency data exists. | **Frequentist:** Refuses to assign a numeric probability, or assigns one only as a heuristic based on similar cases, acknowledging it lacks strict truth conditions.<br><br>**Bayesian:** Assigns a specific probability based on background theory and expert elicitation, treating it as a coherent betting quotient. |
  | **2. Justification of Priors**<br><br>**Frequentist:** Prior probabilities introduce subjective bias into objective science. There is no unique, rational method to select a prior in the absence of data.<br><br>**Bayesian:** All inference requires assumptions. Priors make assumptions explicit. "Objective" priors (e.g., reference priors) exist, and subjective priors are rational if coherent. | Can rationality constrain prior selection sufficiently to make scientific consensus possible without frequency data? | **Small-Sample Inference:** Estimation of a parameter where $N$ is very small (e.g., $N=5$) but strong theoretical constraints exist. | **Frequentist:** Prefers unbiased estimators with wide confidence intervals, admitting high uncertainty rather than risking prior bias.<br><br>**Bayesian:** Prefers a posterior distribution incorporating theoretical priors, arguing it yields lower expected error and more actionable information. |
  | **3. The Reference Class Problem**<br><br>**Frequentist:** To define a probability, one must identify the correct sequence of repeatable events. Selecting the class is a practical difficulty but theoretically solvable.<br><br>**Bayesian:** The "reference class" is simply the set of conditioning information. There is no single "correct" class, only more or less informative conditioning. | Is there a unique, ontologically privileged reference class for any given event? | **Medical Prognosis:** Predicting survival for a patient with multiple overlapping conditions (e.g., age, genetics, lifestyle). | **Frequentist:** Acknowledges ambiguity; the probability changes depending on which class (age-group vs. genetic-group) is selected, creating a paradox of specificity.<br><br>**Bayesian:** Treats all traits as conditioning variables in a multivariate model; no paradox exists, only updating on more information. |
  | **4. Role in Scientific Inference**<br><br>**Frequentist:** The goal of inference is to control long-run error rates (e.g., ensuring false positives occur <5% of the time over many experiments).<br><br>**Bayesian:** The goal of inference is to quantify the current plausibility of hypotheses to maximize expected utility of decisions. | What is the primary normative goal of science: *Truth Tracking* (calibration) or *Rational Decision* (coherence)? | **Regulatory Approval (e.g., FDA):** Deciding whether to approve a drug based on borderline evidence. | **Frequentist:** Focuses on whether the null hypothesis can be rejected at $\alpha=0.05$. Concerned with the rate of approving ineffective drugs over decades.<br><br>**Bayesian:** Focuses on the posterior probability that the drug is effective and the expected loss/cost of approval vs. rejection. |

  ## PART III: CONCLUSION ON THE NATURE OF THE DISPUTE

  We conclude that the dispute is hybrid. It is **verbal** insofar as we argue over the label "probability," which the Frequentist ties to *ontology* (how the world behaves) and the Bayesian ties to *epistemology* (how we reason about the world).

  However, the dispute is **genuine** regarding methodology and norms. We disagree on which errors are more costly: the Frequentist fears systematic bias introduced by subjective inputs; the Bayesian fears the inefficiency and incoherence of ignoring available information (priors) and failing to quantify uncertainty about parameters. We agree that future collaboration should focus not on converting one side to the other, but on developing hybrid methodologies (e.g., Bayesian methods with Frequentist calibration checks) that leverage the strengths identified in Part I while mitigating the risks identified in Part II.
