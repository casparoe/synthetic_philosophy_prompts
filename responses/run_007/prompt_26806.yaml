answer: |-
  # HANDOUT: Epistemic Commitments in Strategic Situations
  **Seminar:** Epistemic Game Theory  
  **Time:** ~10 Minutes  
  **Starting Assumptions:** All players are Bayesian Expected-Utility Maximizers. Rationality is Common Knowledge (CKR).

  ---

  ## PART I: THE DECISION TREE
  *Answer the following questions about the concrete case in front of you. Follow the path to your theoretical destination.*

  **Q1. Is the interaction dynamic (sequential moves) or static (simultaneous/one-shot)?**
  *   **Dynamic:** Go to **Q2**.
  *   **Static:** Go to **Q5**.

  **Q2. (Dynamic) Is the game structure and payoff structure perfectly known to all players?**
  *   **Yes (Perfect Information):** Go to **Q3**.
  *   **No (Uncertainty/Noisy Communication):** Go to **Q4**.

  **Q3. (Dynamic + Perfect Info) Does the prediction require specifying actions at every node, even those off the equilibrium path?**
  *   **Yes:** $\rightarrow$ **LEAF A: Backward Induction**
  *   **No:** (Incoherent for dynamic solution concepts; see Part III).

  **Q4. (Dynamic + Uncertainty) Does common knowledge rely on a finite chain of confirmations subject to a small probability of failure?**
  *   **Yes:** $\rightarrow$ **LEAF B: Email Game / Coordinated Attack**
  *   **No:** (Standard Incomplete Information; see Global Games if static).

  **Q5. (Static) Are payoff-relevant states Common Knowledge, or observed only through noisy private signals?**
  *   **Noisy Private Signals:** $\rightarrow$ **LEAF C: Global Games Selection**
  *   **Common Knowledge:** Go to **Q6**.

  **Q6. (Static + CK Payoffs) Do the players share a Common Prior?**
  *   **No:** $\rightarrow$ **LEAF D: Rationalizability**
  *   **Yes:** Go to **Q7**.

  **Q7. (Static + Common Prior) Is the information structure partitional (S5 knowledge)?**
  *   **No:** (Diagnosed as Incoherent in Part III).
  *   **Yes:** Go to **Q8**.

  **Q8. (Static + CP + Partitional) Are we predicting strategy correlation, belief convergence, or asset trade?**
  *   **Strategy Correlation (Mediator/Signal):** $\rightarrow$ **LEAF E: Correlated Equilibrium**
  *   **Belief Convergence:** $\rightarrow$ **LEAF F: Aumann Agreement**
  *   **Asset Trade:** $\rightarrow$ **LEAF G: No-Trade Theorem**
      *(Note: Leaves F and G occupy the same logical space; see Part II).*

  ---

  ## PART II: THE LEAVES
  *Your position, its logical requirements, and its cost.*

  ### LEAF A: Backward Induction
  *   **Path:** Dynamic + Perfect Info + Actions at all nodes.
  *   **Position:** CKR in perfect information games implies players maximize utility at every subgame, eliminating dominated strategies sequentially from the end.
  *   **Awkward Commitment:** It requires players to maintain beliefs about rationality at nodes that common knowledge of rationality itself says will not be reached.

  ### LEAF B: Email Game / Coordinated Attack
  *   **Path:** Dynamic + Uncertainty + Finite confirmation chain.
  *   **Position:** When common knowledge is only approximate (built on fallible communication), coordination on Pareto-dominant equilibria collapses even with arbitrarily high probability of message delivery.
  *   **Awkward Commitment:** It implies that $99.9\%$ certainty of mutual knowledge is strategically equivalent to $0\%$ certainty in coordination tasks.

  ### LEAF C: Global Games Selection
  *   **Path:** Static + Noisy Private Signals.
  *   **Position:** Introducing vanishingly small noise into private signals about fundamentals selects a unique equilibrium, resolving multiplicity in coordination games.
  *   **Awkward Commitment:** It relies on the limit as noise goes to zero, yet real-world noise is fixed and may be large enough to sustain multiple equilibria.

  ### LEAF D: Rationalizability
  *   **Path:** Static + CK Payoffs + No Common Prior.
  *   **Position:** Without a common prior, CKR only restricts players to strategies that are best responses to some hierarchy of beliefs consistent with rationality.
  *   **Awkward Commitment:** It is often too permissive, failing to rule out outcomes that seem intuitively implausible because it imposes no constraint on belief correlation.

  ### LEAF E: Correlated Equilibrium
  *   **Path:** Static + Common Prior + Partitional + Strategy Focus.
  *   **Position:** With a common prior, CKR implies players' actions are distributed as if they were following the recommendations of a correlation device (mediator).
  *   **Awkward Commitment:** It assumes players can correlate their strategies without explicit communication, or requires positing an external mediator not present in the game description.

  ### LEAF F: Aumann Agreement
  *   **Path:** Static + Common Prior + Partitional + Belief Focus.
  *   **Position:** If posteriors regarding an event are common knowledge, they must be identical; agents cannot agree to disagree.
  *   **Awkward Commitment:** It implies that mere knowledge of an opponent's opinion should fully update one's own, regardless of the private evidence underlying that opinion.

  ### LEAF G: No-Trade Theorem
  *   **Path:** Static + Common Prior + Partitional + Trade Focus.
  *   **Position:** Speculative trade cannot occur among risk-averse agents with a common prior, as the willingness to trade reveals private information that kills the surplus.
  *   **Awkward Commitment:** It forces us to explain real-world trading volume via liquidity needs or irrationality, rather than differences in information.

  ---

  ## PART III: DIAGNOSTICS & GRAY ZONES

  ### 1. The Unseparated Pair: Aumann Agreement & No-Trade
  **Status:** **Logically Identical.**
  Leaves F and G rest on the exact same epistemic foundation (Common Prior + Partitional Information + CKR). The "Agreement Theorem" (1976) concerns probabilities; the "No-Trade Theorem" (Milgrom & Stokey, 1982) concerns asset valuations.
  *   **Diagnosis:** The tree separates them only by the *dependent variable* (beliefs vs. actions), not by assumptions. If you accept one, you must accept the other. They are distinct applications of the same impossibility result regarding "agreeing to disagree."

  ### 2. Unoccupied Combinations (The Empty Zones)
  *   **Static + Common Prior + Non-Partitional Information:**
      *   **Diagnosis:** **Incoherent.** In a Bayesian framework with a common prior, non-partitional information structures (where knowledge is not S5) typically invite Dutch Books or dynamic inconsistency. While studied in non-standard epistemic logic, they are generally rejected in standard epistemic game theory.
  *   **Dynamic + Perfect Info + No Common Prior:**
      *   **Diagnosis:** **Underexplored.** This leads to "Extensive Form Rationalizability." It is a valid position but lacks the sharp predictive power of Backward Induction because heterogeneous priors allow for persistent disagreement about off-path behavior. It is rarely treated as a distinct "named" solution concept in the same vein as BI.
  *   **Dynamic + Noisy Signals + Common Prior (Non-Communication):**
      *   **Diagnosis:** **Absorbed by Global Games.** If the dynamic element is irrelevant to the information structure (i.e., signals are received once before action), this collapses into the Global Games framework (Leaf C). If the dynamics involve communication, it collapses into the Email Game (Leaf B).

  ### 3. Instruction for Use
  If your case lands in an **Empty Zone**, you must relax an assumption (e.g., drop the Common Prior or enforce Partitional Information) to reach a named leaf. If your case lands in the **Unseparated Pair**, acknowledge that the distinction is economic (trade vs. talk) rather than epistemic.
