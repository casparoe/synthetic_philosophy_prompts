      *(Self-Correction on the Principle Name)*: Let's call it the **Fittingness-Prudence Distinction**.
      *(Self-Correction on the Friend Case)*: Be careful not to give moral advice, but normative analysis. The conflict is between epistemic norms (truth) and moral norms (kindness).

      *(Final check on the "Reason to Believe" vs "Reason to Cause Belief")*: This is the most important philosophical pivot. I need to make sure the user sees that their uncertainty ("I am not sure whether the money is really a reason to believe...") is the exact point where the literature splits. I will side with the view that Type 2 considerations are reasons to *bring about* the state, not reasons that count in favor of the *content* of the state.

