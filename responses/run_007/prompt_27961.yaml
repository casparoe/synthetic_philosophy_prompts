answer: |-
  The fundamental deadlock in consciousness studies arises because the two most robust desiderata—the irreducibility of subjective experience and the causal closure of the physical world—appear logically incompatible when held simultaneously. This incompatibility constitutes the 'Hard Problem', forcing any viable theory to sacrifice either scientific orthodoxy or phenomenological integrity. Below is the specification of requirements an adequate theory must address, flagged by their status, followed by an analysis of the tensions and a scorecard for the leading contenders.

  ### The Core Incompatibility
  Before listing the desiderata, one must recognise the trilemma that renders them difficult to jointly satisfy. A theory typically cannot secure **Phenomenal Realism** (experience is real and irreducible), **Causal Closure** (all physical effects have sufficient physical causes), and **Explanatory Transparency** (we can understand why physical processes generate experience) all at once.
  *   **Physicalism** secures Closure and Transparency (in principle) but struggles with Realism.
  *   **Panpsychism** secures Realism and Closure (via constitutive relations) but struggles with Transparency (the Combination Problem).
  *   **Illusionism** secures Closure and Transparency but denies Realism.

  ### The Desiderata Specification

  **1. Accommodate the Phenomenal Datum**
  *   **Requirement:** The theory must acknowledge that there is 'something it is like' to be a conscious subject; experience exists as a first-person reality.
  *   **Case:** Denying this contradicts the immediate evidence of one's own existence (Descartes' *cogito*).
  *   **Status:** **Non-Negotiable** for Realists; **Negotiable** for Illusionists (who argue the datum is a cognitive error).
  *   **Failure Cost:** If failed, the theory is revisionary to the point of denying the very phenomenon it purports to explain.

  **2. Respect Causal Closure of the Physical**
  *   **Requirement:** Physical events must have sufficient physical causes; consciousness cannot inject energy or information into the physical world in a way that violates physics.
  *   **Case:** Neuroscience and physics show no gaps in causal chains where mind could intervene without violating conservation laws.
  *   **Status:** **Non-Negotiable** for Naturalists; **Negotiable** for Substance Dualists (who posit psychophysical laws).
  *   **Failure Cost:** If failed, the theory conflicts with established empirical science and risks empirical falsification.

  **3. Maintain Psychophysical Supervenience**
  *   **Requirement:** There can be no difference in conscious state without a difference in physical state.
  *   **Case:** Empirical correlation; anaesthesia, brain lesions, and stimulation reliably alter or extinguish experience.
  *   **Status:** **Non-Negotiable** (Empirically).
  *   **Failure Cost:** If failed, the theory is inconsistent with neurological data.

  **4. Provide Explanatory Link (No Brute Facts)**
  *   **Requirement:** The theory must explain *why* specific physical processes give rise to specific experiences, not merely assert that they do.
  *   **Case:** Science seeks understanding, not just correlation; asserting identity without explanation leaves the 'explanatory gap' open.
  *   **Status:** **Non-Negotiable** for a complete theory; **Negotiable** for Mysterians (who claim it is beyond human cognition).
  *   **Failure Cost:** If failed, the theory offers prediction without understanding.

  **5. Account for Introspective Authority**
  *   **Requirement:** The theory must explain why subjects have privileged access to their own states, even if that access is not infallible.
  *   **Case:** We know we are in pain before anyone else does; a theory making this impossible is counter-intuitive.
  *   **Status:** **Mostly Non-Negotiable**.
  *   **Failure Cost:** If failed, the theory makes self-knowledge inexplicable.

  **6. Solve the Combination Problem**
  *   **Requirement:** If consciousness is fundamental or ubiquitous, the theory must explain how micro-experiences combine into unified macro-experiences.
  *   **Case:** We experience a unified field, not a collection of atomic feelings; mere aggregation does not explain unity.
  *   **Status:** **Camp Preference** (Specific to Panpsychism/Constitutive views); **Irrelevant** for Emergentists.
  *   **Failure Cost:** If failed, the theory cannot account for the unity of human consciousness.

  **7. Evolutionary Plausibility**
  *   **Requirement:** The theory should offer an account of why consciousness evolved rather than unconscious 'zombie' behaviour.
  *   **Case:** Traits generally persist due to selective advantage; consciousness is metabolically expensive.
  *   **Status:** **Camp Preference** (Epiphenomenalists deny consciousness has a function).
  *   **Failure Cost:** If failed, the theory renders consciousness a biological spandrel or accident.

  ### Scorecard: Physicalism, Panpsychism, Illusionism

  | Desideratum | Physicalism (Type Identity/Functionalism) | Panpsychism (Constitutive) | Illusionism (Eliminativist) |
  | :--- | :--- | :--- | :--- |
  | **1. Phenomenal Datum** | **Struggles.** Often reduces experience to function, leaving the 'feel' unexplained. | **Passes.** Takes experience as fundamental. | **Fails.** Denies the reality of the datum (claims it is an illusion). |
  | **2. Causal Closure** | **Passes.** Mind is physical, so causation is standard. | **Passes.** Mind is intrinsic to physical matter. | **Passes.** Only physical processes exist to cause things. |
  | **3. Supervenience** | **Passes.** Built into the definition. | **Passes.** Macro-consciousness supervenes on micro-consciousness. | **Passes.** Illusions supervene on physical mechanisms. |
  | **4. Explanatory Link** | **Struggles.** The 'Hard Problem' remains; identity is asserted, not explained. | **Struggles.** The 'Combination Problem' blocks the link from micro to macro. | **Passes.** Explains the *belief* in consciousness via cognitive science. |
  | **5. Introspection** | **Passes.** Treated as internal monitoring. | **Passes.** Fundamental entities have proto-access. | **Reinterprets.** Access is real, but the object accessed is not. |
  | **6. Combination** | **N/A.** Emergence handles unity. | **Fails.** No consensus on how subjects combine. | **N/A.** No real subjects to combine. |
  | **7. Evolution** | **Passes.** Consciousness has a functional role. | **Passes.** Consciousness is ubiquitous, not just evolved. | **Passes.** The *illusion* has a functional role. |

  ### Summary of Trade-offs
  The most critical incompatibility lies between **Desideratum 1 (Phenomenal Datum)** and **Desideratum 4 (Explanatory Link)** within a framework that insists on **Desideratum 2 (Causal Closure)**. Physicalism preserves 2 and 3 but leaves 1 and 4 in tension (the Explanatory Gap). Panpsychism preserves 1 and 2 but fails 4 regarding combination (the Combination Problem). Illusionism preserves 2 and 4 but sacrifices 1 entirely. Consequently, no current theory satisfies all non-negotiable criteria without incurring significant metaphysical costs.
