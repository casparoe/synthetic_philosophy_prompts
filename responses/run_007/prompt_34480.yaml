prompt: |-
  You are a professional philosopher specializing in causation and counterfactual reasoning. Please think through the issue carefully, perhaps by first brainstorming a few candidate cases, before settling on your best example.

  Give an example of a conceptual puzzle that arises specifically for causation by omission. Your example should illustrate a case where two omissions are counterfactually on a par — each is such that, had the agent acted differently, the outcome would not have occurred — yet our intuitive causal judgments treat them differently. Explain what seems to drive the asymmetry in our judgments, and why this asymmetry poses a challenge for reductive accounts of causation by omission.
