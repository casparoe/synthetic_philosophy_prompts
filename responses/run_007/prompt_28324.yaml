prompt: |-
  Lately I've been fighting with my best friend about a local ballot measure, and it's made me realize I have no stable rule for how much I should let someone's disagreement move me when they're basically my epistemic peer — my equal in smarts, information, and honesty. So I sat down and wrote out my gut reactions to a bunch of cases, and I'm hoping you can tell me what principle, if any, captures them, or which of my reactions I'd have to give up. I've been reading alot about this stuff — conciliationism vs. steadfastness and all that — but I don't want a survey; I want you to work through my cases and figure out what I actually think, then test it against cases I haven't considered.

  Here are the cases, seperately, as best I can articulate them. First, splitting a restaurant bill: my friend and I both did the mental math on our own and we're about equally good at arithmetic; I got $47 and she got $54. I think we should each end up around 50/50. Second, an eyewitness thing: we both saw the same near-accident from the same sidewalk, both attentive and sober; I'm confident the cyclist ran the red and she's confident the driver cut him off. I came away genuinely unsure, like 50/50. Third, the ballot measure: my friend and I read the same news, know the same local history, and are equally sharp, but I'm at .8 that the measure will hurt the tenants it's meant to help and she's at .8 that it will help. I'd move to maybe .7, but I wouldn't split the difference, and I don't think I should. Fourth, a philosophical question I've worked on for years — whether there's objective moral truth. I meet someone at a conference who has read everything I have, is just as smart, and has thought about it just as long, and she's convinced of the opposite. I'd barely move, from .9 to .85, and I don't feel like that's a failure. Fifth, taste: a friend and I disagree about whether a movie was good. I don't move at all, and I don't think I should. Sixth, memory: a friend and I remember differently who made a cutting remark at a wedding years ago. She's as reliable as I am in general, but I'm sticking with my memory at around .75 rather than dropping to .5, because it's my own memory. Seventh, professional judgment: another doctor and I, same training and same years of experience, look at the same x-ray; I think it's a hairline fracture and she thinks it's a vessel artifact. I don't just average us — I treat both readings as live and order another view — but I can't tell whether my underlying confidence is doing what my gut says it should. That one I go back and forth on.

  My rough sense is that I split the difference when there's a definite answer and a shared method, but I stick to my guns when the disagreement is downstream of values, temperament, or my own first-person access to my own memory. But that sounds like it might just be a rationalization, and I'd rather know if there's a cleaner principle behind all this. So: what principle captures my verdicts, or comes close? State it precisely, say which clause is doing the work in which case, tell me what it predicts for a couple of cases I haven't listed, and be honest about which of my verdicts it can't accommodate. If the choice is between a complicated principle that saves all my gut reactions and a simpler one that overturns one or two, I want to know what I'd be buying with the complexity.

  Please write the whole thing as continuous prose, the way you'd write an email — no headings, no bullet points, no bold, no tables. And American English, please.
