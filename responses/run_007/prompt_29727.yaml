answer: |-
  Your confusion is well-founded. The blog summary you encountered is a standard "textbook" shorthand, but like many such summaries, it conflates distinct arguments and elides crucial distinctions that are necessary to understand why the "verdict" appears to reverse.

  To answer your question directly: The summary is **faithful** regarding Lange's proposal and the mid-20th-century consensus, but it **conflates** Mises and Hayek, misattributes the "equations" argument, and creates a false dichotomy regarding the Soviet experience.

  Here is a detailed breakdown of where the account succeeds, where it fails, and how the specific parties (Lange and Hayek) would object to it.

  ### 1. Faithful Elements vs. Conflations

  **The "Equations" Caricature**
  *   **The Blog:** Claims Mises and Hayek argued planning is impossible because planners cannot solve "millions of simultaneous equations."
  *   **The Reality:** This is a significant conflation. It was not Mises or Hayek who framed the problem as one of mathematical equations; it was the neoclassical economists (like Enrico Barone) who interpreted the market as a system of equations.
  *   **Mises's Actual Argument:** Mises (1920) argued that without private property in the means of production, there can be no genuine market prices for capital goods. Without prices, there is no common denominator to compare input costs against output values. Therefore, economic *calculation* is impossible. It is not a computational problem; it is a categorical impossibility.
  *   **Hayek's Actual Argument:** Hayek (1935, 1945) shifted the ground. He argued that even if the equations *could* be solved in principle, the data required to solve them (knowledge of time and place, tacit knowledge, local conditions) is dispersed among millions of individuals and cannot be aggregated by a central board.
  *   **Verdict:** The blog attributes the neoclassical framing of the problem to the Austrians. Lange actually accepted the neoclassical framing (that the economy is a system of equations) and argued the CPB could solve it iteratively.

  **Mises vs. Hayek**
  *   **The Blog:** Groups them together ("Mises and Hayek argued...").
  *   **The Reality:** While allies, their critiques were distinct. Mises focused on **property and prices** (the *a priori* impossibility of calculation). Hayek focused on **knowledge and incentives** (the practical impossibility of gathering data and the dynamic nature of the market).
  *   **Verdict:** Conflation. This matters because Lange's model addresses the Misesian price problem (by simulating prices) but fails to address the Hayekian knowledge problem.

  **Lange's Model**
  *   **The Blog:** Describes Lange's "trial and error" method (announce prices, check surpluses/shortages, adjust).
  *   **The Reality:** This is a faithful summary of the Lange-Lerner-Taylor model of "Market Socialism." Lange argued the Central Planning Board (CPB) could act as a Walrasian auctioneer.
  *   **Verdict:** Faithful.

  ### 2. The Soviet Vindication Puzzle

  You asked: *Does the Soviet experience actually support the Austrian conclusion in the way the blog implies?*

  The blog implies a contradiction: If Lange won theoretically, why does the Soviet failure vindicate the Austrians? The resolution lies in the distinction between **Market Socialism** (Lange) and **Command Socialism** (USSR).

  **Why the Soviet Failure Vindicates Hayek (but not necessarily Mises against Lange)**
  The Soviet Union did **not** implement Oskar Lange's model.
  *   **Lange's Model:** Required a CPB to set prices based on scarcity, while state managers minimized costs and consumers chose freely. It was a simulated *market*.
  *   **Soviet Reality:** Used physical quotas, administrative allocation, and fixed prices that often did not reflect scarcity. It was a *command* economy.

  Therefore, the collapse of the USSR vindicates Hayek's critique of **centralized command planning** (the Knowledge Problem). It proved that a bureaucracy cannot aggregate the dispersed knowledge required to run a complex economy.

  **Why it doesn't strictly refute Lange (The Lange Defender's View)**
  A defender of Lange would argue: "The Soviets didn't try my model. They tried brute-force command planning. Lange's Market Socialism uses price signals; the Soviets ignored them. You cannot judge the viability of market socialism by the failure of command socialism."

  **Why Austrians claim it vindicates them against Lange, too**
  Austrians argue that even if the Soviets *had* tried Lange's model, it would have failed.
  1.  **No Real Property:** Without private owners risking their own capital, "prices" set by a CPB are just accounting numbers, not reflections of subjective time preference and risk.
  2.  **Incentives:** Lange assumed state managers would follow the rules (minimize cost, obey prices). Austrians (and Public Choice theorists) argue managers would game the system, hoard resources, and lobby the CPB, distorting the "trial and error" process.

  ### 3. What a Careful Defender of Lange Would Object To

  If you presented this blog summary to a modern proponent of Market Socialism, they would raise three main objections:

  1.  **The "Not Invented Here" Objection:** "The Soviet Union was a command economy, not a market socialist one. Lange explicitly criticized the Soviet methods of his time for being too bureaucratic. The failure of the USSR is an indictment of Stalinist planning, not Langean market socialism."
  2.  **The Computational Objection:** "Lange wrote in the 1930s. He famously noted that perhaps in the future, computers could solve the equations faster than the market. With modern Big Data and AI, the 'calculation' problem is less daunting than it was in Hayek's day." (Note: Austrians counter that AI still lacks tacit knowledge, but Lange defenders lean on this).
  3.  **The Incentive Distinction:** "The calculation debate focuses on information. The real problem in the USSR was incentives and authoritarianism. A democratic market socialism could solve the incentive problem through worker cooperatives or different managerial contracts, which the USSR never attempted."

  ### 4. What Hayek Would Object To

  Hayek (and modern Austrian economists) would find the blog's summary of their position particularly frustrating for two reasons:

  1.  **The Equilibrium Fallacy:** The blog says Lange could reach "exactly the equilibrium a competitive market would reach." Hayek would object that the market is **not** a mechanism for reaching equilibrium; it is a **discovery procedure**.
      *   In Lange's model, the data (preferences, technology) are assumed to be given or discoverable via shortages.
      *   For Hayek, competition *generates* new knowledge. Entrepreneurs discover goods consumers didn't know they wanted. A CPB adjusting prices based on past surpluses can never anticipate future innovations.
  2.  **The Nature of Prices:** Hayek would argue that Lange treats prices as **parameters** (numbers to be adjusted), whereas in a real market, prices are **institutions** embedded in property rights.
      *   In Lange's model, if a manager makes a mistake, the state absorbs the loss.
      *   In a market, the entrepreneur risks their own capital. This "skin in the game" is essential for the price signal to be credible. Without private property, the "trial and error" is costless for the decision-maker, leading to reckless experimentation or extreme risk aversion.

  ### 5. Summary: Resolving the "Verdict Reversal"

  The blog summary is not logically inconsistent, but it is historically imprecise. Here is how to reconcile the "Lange won" vs. "Austrians vindicated" narrative:

  1.  **Round 1 (Theory, 1930s-1960s):** Lange "won" because he accepted the neoclassical terms of the debate (General Equilibrium Theory). Within that framework, he showed mathematically that a CPB *could* simulate a market. Most economists accepted this theoretical possibility.
  2.  **Round 2 (Practice, 1970s-1990s):** The Austrians "won" because the real world demonstrated the **Knowledge Problem** and the **Incentive Problem**.
      *   The Soviet collapse showed that central direction fails (Hayek).
      *   The transition economies showed that without private property, you cannot create functioning capital markets (Mises).
      *   Even Western attempts at indicative planning failed to match market dynamism.

  **Conclusion**
  The blog summary is a useful heuristic but fails to distinguish between **Command Planning** (which the USSR did and failed) and **Market Socialism** (which Lange proposed and was never fully implemented).

  *   **Faithful:** Lange's trial-and-error mechanism; the mid-century consensus that Lange won the theoretical debate.
  *   **Oversimplified:** The Austrian argument (reduced to "equations"); the conflation of Mises and Hayek.
  *   **Misleading:** The implication that the Soviet failure directly refutes Lange's specific model. It refutes the broader socialist project, but Lange defenders maintain their specific model remains untested.

  The "reversal" you sensed is the shift from a **theoretical victory** for Lange (within the confines of neoclassical statics) to a **practical/historical victory** for the Austrians (based on dynamic reality and institutional analysis).
