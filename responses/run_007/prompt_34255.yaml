answer: |-
  The light coming through the kitchen window was the same grey it had been every morning for the last thirty years, but today it felt thinner, as if the glass had been polished too clean. Elena stood at the counter, her hands wrapped around a mug of tea that had gone lukewarm. She was waiting for the pill to kick in, the small white coin she swallowed dry every six hours to keep the ache in her ribs from becoming a shout.

  Outside, the garden was waking up. The hydrangeas were heavy-headed with rain, their blooms browning at the edges. It was October. She had roughly three more seasons. Maybe four, if the winter was mild and the medicine held.

  She watched a robin land on the fence post. It tilted its head, eyed a patch of turned earth, and flew off. It did not know it was October. It did not know it was the last October the fence post would have a witness.

  The back door opened. Sarah didn't knock anymore. She walked in with a gust of wind and the smell of wet pavement, carrying a bag of groceries that clinked.

  "Mom? You're up early."

  "Couldn't sleep," Elena said. She didn't turn around. She watched the robin's empty spot on the fence.

  "I brought those plums you like. And I found that recipe for the preserve. We can do it this weekend." Sarah set the bag down. The plastic crinkled, a loud, vibrant sound in the quiet kitchen. "Actually, about the weekend. I was thinking, for Christmas, maybe we go to the coast? Just the two of us. Rent that cabin near the headlands. You've been saying for years you wanted to see the storm waves."

  Elena turned then. She leaned her hip against the counter, feeling the solid wood against her bone. Sarah was thirty-two, her hair pulled back in a messy knot, her face open and expectant. Sarah was living in a timeline that stretched out like a highway, mile markers visible for decades. Elena was standing at a toll booth that was closing.

  "The coast in December is freezing, Sarah."

  "We'll bundle up. It'll be bracing." Sarah opened the fridge, started putting away milk and eggs. "I looked at the calendar. There's a window right after my project wraps up. Mid-December. We can be back by New Year's."

  Elena looked at the calendar on the wall. It was a landscape photo of a vineyard, rows of vines stretching into a hazy distance. December was a small square, empty except for a dentist appointment she had cancelled yesterday.

  "Let's see how I feel," Elena said.

  "Mom." Sarah stopped. She held a carton of eggs in both hands. "Don't do the 'let's see' thing. You need to commit. You need something to look forward to."

  "I am looking forward to it," Elena lied. She wasn't looking forward to December. She was looking at the floor tiles, counting the grout lines. "It's just a lot of packing."

  "I'll pack for you. I'll drive." Sarah came around the island and put a hand on Elena's arm. Her grip was warm, solid. "Please. I want to do this. Next year."

  *Next year.* The words hung in the air. To Sarah, *next year* was a destination. To Elena, it was a place on a map she would not visit.

  "I'll think about it," Elena said.

  Sarah squeezed her arm, sensing the resistance but choosing to ignore it. It was the only way she knew how to love her mother now: by pretending the cliff edge wasn't there. "Okay. I'll look at cabins. Think about the blue one, the one with the fireplace."

  Sarah stayed for an hour. They talked about the neighbor's dog, the price of heating oil, the leak in the bathroom sink. They talked about the architecture of the mundane, building a shelter of small talk against the sky. When Sarah left, the house settled back into its silence.

  Elena went upstairs. She needed to find the box.

  It was in the attic, tucked behind a stack of old National Geographics. It was a shoebox, the cardboard soft with age. Inside were not photos of her, but photos of the life that waited for her.

  She sat on the dusty floorboards and lifted the lid. There was a picture of the house, taken in 1963. Her parents stood on the lawn. They were young, their faces unlined by the worry of children. The garden was there, but the oak tree in the corner was a sapling, staked with wooden poles. The lawn was patchy. The sky was a flat, featureless white.

  Elena ran her thumb over the glossy surface. In 1963, she did not exist. She was not a ghost haunting the house; she was not a potentiality waiting in the wings. She was nothing. The silence in that photograph was absolute.

  She tried to summon the feeling of that time. She closed her eyes and reached back, past her childhood, past her birth, into the winter of '63. She tried to remember the cold. She tried to remember the dark.

  There was nothing to remember. And yet, the thought of it did not frighten her. It felt like sleep without dreams. It felt like the space between two breaths. It was a neutral zero. Lucretius would have nodded at this photo. *Look,* he would say. *You were not there. Did you suffer? Were you cold? Did you fear the dark?* No. It was a perfect peace.

  She opened her eyes and looked at the sapling in the photo. It had grown. It had drunk the rain and eaten the sun and become the giant that now scraped the roof gutters outside.

  Elena put the 1963 photo down and picked up the calendar from the kitchen, which she had brought up with her. She turned it to January 2025.

  It was the same month. The same angle of the sun. The same cold air that would rattle the window frames. The oak tree would still be there, likely shedding its leaves. Sarah would be thirty-three. She might be in the cabin by the headlands. She might be cooking a meal. She might be laughing.

  But Elena would not be there.

  She stared at the square for January 14th. She tried to project herself into the silence of that future. She tried to feel the same peace she had felt looking at 1963.

  *It is the same nothing,* she told herself. *The silence before the music and the silence after the song. Why is the first silence a rest, and the second a theft?*

  She pressed her thumb into the paper of the calendar, denting the square.

  In 1963, she had no claim on the world. She had no investments. She hadn't planted the hydrangeas. She hadn't taught Sarah to ride a bike. She hadn't memorized the way the light hit the kitchen tiles at 6:00 AM. Because she had never held those things, losing them was impossible.

  But now? Now she was full of things. She was a vessel filled with water, and death was not just the end of the vessel, it was the spilling of the water. The deprivation wasn't about her missing the world; it was about the world missing the specific shape of her attention.

  If she died, who would notice that the robin preferred the left side of the fence? Who would know that the tea tasted better when it was slightly bitter?

  The asymmetry wasn't in the non-existence. It was in the accumulation. The past nothingness was empty, so it was light. The future nothingness was full of ghosts, so it was heavy.

  She sat in the attic dust for a long time. The house creaked. The heating system kicked on with a groan of metal.

  Downstairs, the phone rang. She let it go to voicemail. She knew who it was. It was the clinic, checking on dosage. Or perhaps it was Sarah, calling to say she found a cabin with a hot tub.

  Elena put the photos back in the box. She slid the box behind the magazines. She stood up, her knees popping, and walked to the dormer window.

  From here, she could see the garden. She could see the patch of turned earth where she had dug up the lilies yesterday. She had meant to replant them. She had meant to divide the bulbs and put them back in the ground so they would sleep through the winter and wake up in May.

  But she hadn't finished. The bulbs were sitting in a basket on the potting bench, exposed to the air, their roots drying out.

  If she didn't plant them, they would die. They would not wake up in May.

  If she did plant them, she would not be here to see them bloom.

  She went downstairs, put on her boots, and walked out into the yard. The air was sharp, smelling of wet leaves and decay. It was a good smell. It was the smell of things returning to the soil.

  She picked up the trowel. The handle was worn smooth by her own hands. She knelt by the patch of earth. It was cold, dark, and receptive.

  She dug a hole. She placed a bulb inside. It was a small, hard thing, wrapped in papery skin. It looked like a stone. It looked like a closed eye.

  She covered it with dirt. She patted it down.

  She dug another hole.

  She thought about the winter of 1963. She thought about the winter of 2025.

  In 1963, the ground was just as cold. The worms were just as blind. The world turned on its axis without asking for permission.

  In 2025, the ground would be the same.

  The difference was not in the earth. The difference was in the kneeling.

  Elena pressed the dirt firm around the second bulb. Her hands were stained with mud. Her ribs throbbed, a dull reminder of the clock ticking inside her chest. She felt a sudden, fierce surge of anger—not at the dying, but at the leaving. She was being asked to vacate a room she had just finished furnishing.

  And yet, as she reached for the third bulb, her hand hesitated.

  If she didn't plant them, the garden would be bare. Sarah would come over in the spring and see empty dirt. She would be sad.

  If she did plant them, Sarah would see flowers. She might be sad then, too, but she would have the color.

  Elena realized she was gardening for a witness she would never meet. She was planting for the eyes of her daughter in a spring she would not see. She was bridging the gap between the two nothings with a small, white root.

  It didn't solve the equation. It didn't make the future nothingness feel like the past nothingness. The fear was still there, a cold stone in her throat. The unfairness of it was still a jagged edge in her mind. Why should the future feel like a loss when the past felt like a rest?

  She didn't know.

  She placed the third bulb in the earth. She covered it.

  The wind picked up, rustling the oak tree above her. The leaves whispered, a sound like dry paper rubbing together. It was the sound of the world continuing. It was indifferent to her. It was indifferent to 1963. It was indifferent to 2025.

  Elena sat back on her heels. She wiped her hands on her trousers. The mud smeared, dark against the denim.

  She looked at the patch of ground. It looked exactly as it had before she started. To a passerby, nothing had changed. But she knew what was underneath. She knew that something was sleeping there, waiting for a sun she would not feel.

  She stood up, her joints stiffening. She looked toward the house. The kitchen window was dark now, the morning light having moved on.

  She walked back to the door. She would go inside. She would make a fresh pot of tea. She would call Sarah back and tell her to book the cabin.

  She would go to the coast. She would feel the cold wind. She would stand on the edge of the continent and look out at the water, knowing that the water would be there long after she was not. And for a moment, standing there, she would be the only thing in the universe that knew it was looking.

  That would have to be enough.

  Elena opened the door and stepped inside, leaving the garden to the dark, to the cold, and to the slow, blind work of the roots.
