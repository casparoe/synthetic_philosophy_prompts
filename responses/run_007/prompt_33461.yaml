      *   **Case 2: Sanborn (Coffee Hater).** Experience same (taste same), reaction changed (liking changed). User says not decisive. Report ("tastes same") doesn't settle if taste quale is same or if memory/reaction shifted. *Verdict: Skeptical about report authority.*
      *   **Case 3: Inverted Spectrum (Two People).** Behaviorally identical. User feels there *is* a fact of the matter (same or swapped). *Verdict: Realist about qualia existence/independence.*
      *   **Case 4: Inverted Spectrum (One Person/Time).** Neural procedure swaps colors. User says experience genuinely changed, but admits uncertainty about whether it's the quale or the memory. Report authoritative that *something* changed, not *what*. *Verdict: Realist about change, skeptical about specific content identification.*
      *   **Case 5: Phantom Limb.** Pain is real, has felt quality, doesn't reduce to dispositions/behavior. *Verdict: Strong Realist about qualia (phenomenal character).*
      *   **Working Principle:** Qualia = "Leftover after subtraction" (intrinsic, private, directly-known, non-functional).
      *   **Tension:** Chase/Sanborn suggest reports don't latch onto the "leftover." Inverted Spectrum/Phantom Limb suggest the "leftover" exists and matters.
      *   **Goal:** Find a principle that unifies these verdicts, or advise which verdicts to drop. Also, test the "leftover" definition. Apply to a new case (Afterimage vs. Knowledge).

  2.  **Evaluate the Coherence of the Verdicts:**

      *   *Tension Point:* The user is a *Phenomenal Realist* (Inverted Spectrum, Phantom Limb) but an *Epistemic Skeptic* regarding first-person reports in specific contexts (Chase/Sanborn).
      *   *The "Leftover" Definition:* This is the classic Dennett/Churchland target. If you subtract dispositions, functions, memories, and reports, is anything left? The user's Phantom Limb verdict says "Yes." The Chase/Sanborn verdicts say "We can't be sure we're tracking it."
      *   *Consistency Check:* Is it consistent to say "Qualia exist (Phantom/Inverted)" but "Reports don't reliably track them (Chase/Sanborn)"? Yes, this is a standard Realist position (e.g., Lockean or Kantian noumenal/phenomenal distinction, or just fallibilism about introspection).
      *   *The Problem:* The user's definition of qualia ("leftover after subtraction") is notoriously difficult to defend. If it's causally inert (subtracted from function/disposition), how do we talk about it? How does it cause the report?

  3.  **Develop Candidate Principles:**

      *   *Principle A: Phenomenal Realism with Introspective Fallibilism.* Qualia exist (Phantom/Inverted), but our access to them is mediated by cognitive systems that can shift (Chase/Sanborn).
      *   *Principle B: Representationalism.* The "what it's like" is actually a representation of properties. Chase/Sanborn are changes in representation or judgment. Phantom limb is a misrepresentation. Inverted spectrum is a change in representational vehicle.
      *   *Principle C: Illusionism.* Qualia don't exist as "leftovers." The *judgment* that they exist is the phenomenon. (This would require giving up the Inverted Spectrum/Phantom Limb realism).
      *   *Principle D: Phenomenal Concept Strategy.* We have unique concepts for experiences. The "fact of the matter" exists because of the concept, not necessarily a distinct ontological entity.

      *Best Fit:* The user seems most committed to **Phenomenal Realism + Introspective Fallibilism**. They believe there is "something it is like" (Phantom, Inverted) but doubt our ability to perfectly isolate it from cognitive processing (Chase, Sanborn).

  4.  **Address the "Leftover" Definition:**

      *   This is the weak link. If you subtract *all* functional roles, the quale becomes epiphenomenal. If it's epiphenomenal, how does it cause the report in the Phantom Limb case?
