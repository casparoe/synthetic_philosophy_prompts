      *   **Propose a Unifying Principle:** "Phenomenal Realism with Introspective Fallibilism."
          *   *Ontology:* Qualia exist (Phantom, Inverted).
          *   *Epistemology:* Introspection is a cognitive process subject to error/confusion (Chase, Sanborn).
      *   **Analyze the "Leftover" Coherence:** Explain why "leftover" is problematic (causal exclusion). Suggest reframing qualia as the *intrinsic aspect* of neural/functional states, not something *outside* them.
      *   **Apply to Afterimage Case:**
          *   Under the Unifying Principle: Afterimage has phenomenal character (qualia). Knowledge does not (or has different qualia).
