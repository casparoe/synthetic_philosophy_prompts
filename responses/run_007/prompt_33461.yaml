      *   *Conflict:* If it doesn't reduce to disposition, how do we know it's there? Via introspection. But Chase/Sanborn says introspection is shaky.
      *   *Resolution:* Introspection is *generally* reliable (Phantom, Inverted) but *specifically* fallible regarding the *source* of change (Chase/Sanborn).
      *   *The "Leftover" Issue:* This is the biggest target. If I subtract the disposition to say "ouch," is the pain still there? User says yes. But if I subtract the disposition to *attend* to it? This needs careful handling. I should suggest that the "leftover" definition is the source of the incoherence, not the verdicts themselves.

  8.  **Final Structure:**
