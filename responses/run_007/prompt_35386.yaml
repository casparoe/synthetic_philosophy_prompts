answer: |-
  **SEMINAR Q&A PREP SHEET: DEFENDING THE TRUTH NORM**
  **Audience:** Epistemology-heavy, Williamsonian leanings.
  **Goal:** Survive Q&A without conceding the constitutive status of the Truth Norm (TNA).

  ### Section 1: Strategic Concessions (State these early in the talk)
  *Do not wait for Q&A to clarify these. Pre-empt the "straw man" accusations by granting the following in your introduction or preliminary remarks:*

  1.  **Knowledge is the *Standard* Goal:** I am not denying that knowledge is the primary *epistemic goal* of assertion. In ordinary conversation, we aim to convey knowledge. My claim is narrower: knowledge is the *target*, but truth is the *constitutive rule* governing the move. Analogously, in chess, the goal is checkmate, but the constitutive rules govern piece movement.
  2.  **Blamelessness vs. Correctness:** I grant that justification determines *blamelessness* (whether you are criticizable as an agent), while truth determines *correctness* (whether the assertion satisfies the norm). I am not saying it is ethically or epistemically responsible to assert lucky guesses; I am saying such assertions violate the norm of the *act type*, even if the *agent* is blameless.
  3.  **Pragmatic Constraints Remain:** Defending TNA as the *constitutive* norm does not eliminate ethical, prudential, or conversational constraints. You still shouldn't assert truths that are irrelevant, harmful, or rude. TNA is the floor, not the ceiling.
  4.  **The Data is Shared:** I agree with the Williamsonian that assertion is a knowledge-transmitting device. The disagreement is whether the *rule* that makes it so is "Know $p$" or "Truthfully represent $p$." I am not rejecting the data about challenges or lottery paradoxes; I am offering a better explanation of them.

  ***

  ### Section 2: Objections & Replies (Ordered by Likelihood)

  **1. The "Lucky Guess" Objection (The Classic)**
  *   **Their Phrasing:** "Your norm is too weak. If I assert a true proposition based on a coin flip, TNA says I've followed the rule. But that assertion is clearly defective. KNA explains the defect; TNA licenses recklessness."
  *   **Your Reply:** Distinguish *satisfying the norm* from *asserting responsibly*. A lucky guess satisfies the truth condition (correctness) but fails the justification condition (responsibility). We criticize the *asserter*, not the *assertion's fit to the rule*. KNA conflates the evaluation of the agent with the evaluation of the act.
  *   **Weakness:** They will press that a constitutive norm should *guide* action. If TNA licenses lucky guesses as "correct," the norm loses its normative force. Be prepared to lean heavily on the Correctness/Blamelessness distinction.

  **2. The Challenge Data ("How Do You Know?")**
  *   **Their Phrasing:** "The constitutive norm explains our linguistic practices. When we challenge an assertion, we ask 'How do you know?', not 'Is it true?'. This linguistic data points directly to KNA. TNA can't explain the practice."
  *   **Your Reply:** "How do you know?" is a pragmatic proxy for "Is it true?" Because we lack direct access to truth, we test for knowledge as the best available indicator. The challenge practice tracks *evidence of compliance*, not the compliance condition itself.
  *   **Weakness:** This is their strongest linguistic data. If you say it's "just a proxy," you risk making the norm invisible to the participants. You need to argue that truth is the *constitutive* aim, even if knowledge is the *operational* test.

  **3. The Lottery Paradox (Turning Your Argument)**
  *   **Their Phrasing:** "You claim KNA fails on lottery cases because we criticize false assertions. But TNA fails worse. If I have 99.9% statistical evidence for a losing ticket, TNA forbids assertion (since it might be false). KNA also forbids it (since you don't know). Where is the explanatory gain for TNA?"
  *   **Your Reply:** The gain appears when the ticket *wins*. If I assert "Ticket #5 lost" based on odds, and it turns out true, KNA says I violated the norm (I didn't know). TNA says I satisfied the norm (it was true). We don't criticize true assertions retroactively as harshly as false ones. TNA captures the asymmetry of criticism better.
  *   **Weakness:** They may argue that we *should* criticize the assertion even if true, because the basis was statistical. This leads to a stalemate on intuitions.

  **4. Moorean Paradoxes**
  *   **Their Phrasing:** "Williamson explains 'p and I don't know p' as a violation of KNA. You explain 'p and I believe not-p' via TNA. But KNA unifies the explanation of assertion and belief. Your view fragments the norm of belief (truth) and assertion (truth) without explaining the *knowledge* intuition in Moorean sentences."
  *   **Your Reply:** KNA struggles with "p and I don't know p" when $p$ is known. TNA explains the absurdity via the mismatch between the truth-aim of belief and the report. The problem isn't always a lack of knowledge; it's a contradiction in the truth-commitment.
  *   **Weakness:** Williamson's explanation of Moorean paradoxes is elegant and widely accepted. Challenging it requires careful handling of the belief-assertion parallel.

  **5. Gettier Overgeneration**
  *   **Their Phrasing:** "You say KNA overgenerates because we don't blame Gettiered assertions. But in Gettier cases, the subject lacks a factive reason. Asserting without a factive reason is improper. We just don't blame them because they're blameless, not because the assertion was correct."
  *   **Your Reply:** If the assertion is improper, there should be *some* criticism. But in standard Gettier cases, once the truth is revealed, criticism evaporates. This suggests the norm was satisfied. KNA forces you to say the assertion was defective even though true and justified. TNA aligns with the intuition that truth 'redeems' the assertion.
  *   **Weakness:** Some epistemologists insist Gettiered beliefs are not knowledge and therefore assertions based on them are defective *qua* knowledge-transmission.

  **6. The Belief-Analogy Argument**
  *   **Their Phrasing:** "You argue assertion is the external face of belief, and belief aims at truth. But many argue belief aims at *knowledge* (or that knowledge is the norm of belief). If belief's norm is knowledge, your analogy backfires."
  *   **Your Reply:** The "belief aims at truth" thesis is more fundamental. Knowledge is a *species* of successful belief. The constitutive aim is truth; knowledge is the successful realization of that aim. Assertion inherits the aim, not necessarily the successful realization condition.
  *   **Weakness:** If they are "Knowledge First" epistemologists, they reject that truth is more fundamental than knowledge. You may need to grant this is a foundational axiological disagreement.

  **7. Guidance / "Ought Implies Can"**
  *   **Their Phrasing:** "Norms must be followable. I can follow 'Assert only what you know' because I can reflect on my knowledge. I cannot follow 'Assert only truths' because I lack a truth-detector. TNA violates the guidance constraint on norms."
  *   **Your Reply:** Constitutive rules don't always guide consciously (e.g., grammatical rules). We aim at truth via justification. The norm sets the *standard of success*, not necessarily the *heuristic for deliberation*.
  *   **Weakness:** This is a major vulnerability. If a norm cannot guide deliberation, why call it a *norm* rather than a *condition of success*? Be careful not to concede it's merely a success condition.

  **8. The Value of Knowledge**
  *   **Their Phrasing:** "If knowledge is the primary epistemic value, why anchor the norm of assertion in the lesser value of truth? Assertion is a tool for spreading knowledge. TNA makes assertion a tool for spreading mere truth."
  *   **Your Reply:** Truth is the *constitutive* value; knowledge is the *instrumental* value of assertion in conversation. We want knowledge, but the rule that makes the move an *assertion* is truth. You can't have knowledge without truth, so truth is the anchor.
  *   **Weakness:** This risks sounding like you undervalue knowledge. Reiterate Concession #1: Knowledge is the goal, Truth is the rule.

  ***

  ### Section 3: The Question I'm Dreading
  **The "Normative Force" Objection:**
  *"If I assert a lucky guess that turns out true, you say I've satisfied the norm. But intuitively, that assertion has no epistemic weight. I can't build on it. If the norm of assertion is what gives assertion its authority in our epistemic economy, and TNA grants authority to lucky guesses, then TNA fails to explain the authority of assertion. Why should I trust an assertion that merely satisfies TNA?"*

  **How to Handle It:**
  Do not try to prove the lucky guess *is* trustworthy. Concede it isn't. Argue that **authority comes from the presumption of compliance with the norm, coupled with the expectation of justification.** When I assert, I invite you to presume I satisfy TNA. But you are also entitled to presume I am *blameless* (justified). The "epistemic weight" comes from the justified belief that I am likely satisfying TNA, not from TNA itself.
  *Honest Note:* This is the softest spot. If they press that the *norm itself* should guarantee authority, you are in trouble. Your best move is to shift the burden: KNA doesn't guarantee authority either (fallibilism), it just raises the bar. TNA + Justification does the same work without misidentifying the constitutive rule.
