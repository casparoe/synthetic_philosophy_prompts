prompt: |-
  Ok so I'm in this philosophy of biology course and we've been reading about the whole "DNA is a code" thing. I've basically landed on the side that it's a metaphor that got out of hand — like, people started talking about DNA as if it literally contains information in the same way a computer program does, and that's messed up how we think about genetics. I'm thinking of writing my term paper defending something like: the genetic "code" is a useful heuristic but its not literally a code, and treating it as one leads to conceptual confusion (like the idea that the genome is a "blueprint" or "program").

  But I'm aware this is a position I could be wrong about, and I want to stress-test it before I commit. So: what would count against the view that DNA isn't literally a code? I mean this in a pretty specific way — not just "what are the standard objections," but what evidence, arguments, or conceptual moves would actually make me reconsider? What would the world have to look like, or what would we have to discover, for the literal-code view to be the better one?

  I'd like the defeaters ranked from "this would basically settle it against me" to "this is awkward but I could live with it." And I want to know which of these the literal-code people would themselves point to as their strongest cards, not just what critics of my view say.

  Also, if there are things that have already been discovered or argued that should count against my view and I'm just not appreciating them, I want to know that too.

  One more thing: if the whole way I'm setting this up is confused — like if the distinction between literal and metaphorical codes doesn't hold up, or if I'm asking the wrong question entirely — please just say that. I'd rather get straightened out now than find out from my professors comments on the final draft.
