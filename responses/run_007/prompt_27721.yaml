answer: |-
  **JOINT STATEMENT ON THE PARADOX OF PHENOMENAL JUDGMENT**

  **Participants:** E (Proponent of Epiphenomenalism), A (Proponent of Causal Efficacy)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Causal Role of Phenomenal Consciousness

  ### Methodological Preamble: A Note on Terminology

  Before proceeding, we must flag a potential source of verbal dispute that has historically stalled this debate. We acknowledge that the phrase "phenomenal consciousness has causal powers" is ambiguous.

  *   **Production:** Does it mean consciousness generates physical energy or alters the trajectory of physical particles in a way that violates physical causal closure?
  *   **Counterfactual Dependence:** Does it mean that if the phenomenal state had been different, the physical behavior would have been different (holding the physical supervenience base fixed or varying it)?

  E operates primarily with a **Production** model (where consciousness is a byproduct of physical processes). A operates primarily with a **Counterfactual/Interventionist** model (where consciousness is a variable in the causal graph of behavior). We agree that if the dispute is *only* about which definition of "cause" is correct, it is linguistic. However, we believe there is a substantive metaphysical disagreement regarding *explanatory sufficiency* remaining even after definitions are fixed. This document proceeds on the assumption that the disagreement is substantive, but Section 3 (Cruxes) specifically targets the definition of causation.

  ***

  ### 1. Agreed Claims

  The following claims are endorsed by both E and A. We consider these the fixed points of our dialectical situation.

  1.  **The Reality of Phenomenality:** There exists a property of mental states, "phenomenal consciousness," such that for certain states, there is "something it is like" to undergo them. This property is not exhausted by functional or representational descriptions.
  2.  **Physical Supervenience:** Phenomenal consciousness supervenes on physical brain states. There can be no difference in phenomenal consciousness without a difference in the underlying physical substrate. (We bracket panpsychist or substance dualist alternatives for this specific collaboration).
  3.  **Causal Closure of the Physical:** Every physical event has a sufficient physical cause. We agree that positing consciousness should not require violations of the conservation of energy or standard neurophysiology.
  4.  **The Target Phenomenon:** Human subjects reliably produce verbal and behavioral reports regarding their conscious states (e.g., saying "I see red" when experiencing red qualia). These reports are generally accurate.
  5.  **The Paradox Formulation:** If epiphenomenalism is true, phenomenal states do not causally influence physical reports. Therefore, the correlation between the report ("I see red") and the experience (red qualia) is not explained by a direct causal link from experience to report.
  6.  **The Common-Cause Structure:** Under epiphenomenalism, the correlation between experience and report is explained by a common physical cause (the neural state) which produces both the experience and the report independently.
  7.  **The Explanatory Burden:** Both sides agree that the accuracy of phenomenal judgment requires explanation. The disagreement is not about *whether* it needs explaining, but whether the Common-Cause Structure provides a *satisfactory* explanation.

  ***

  ### 2. Disagreements Table

  | Proposition (Phrased Neutrally) | Position E (Epiphenomenalist) | Position A (Anti-Epiphenomenalist) |
  | :--- | :--- | :--- |
  | **1. Causal Relevance**<br>Phenomenal properties make a difference to the production of behavioral outputs over and above the physical properties that realize them. | **False.**<br>Once the physical neural state is fixed, the phenomenal property adds no causal leverage. The behavior would be identical even if the phenomenal property were absent (zombie scenario). | **True.**<br>Phenomenal properties are causally relevant variables. If the phenomenal property were different (counterfactually), the behavioral output would differ, even if we describe the physical realization abstractly. |
  | **2. Sufficiency of Common-Cause**<br>The "Common-Cause" structure (Neural State → Experience AND Neural State → Report) adequately explains the reliability of phenomenal judgment without direct causation. | **True.**<br>The reliability is guaranteed by the nomic connection between the Neural State and the Experience. The report tracks the Neural State, which tracks the Experience. No direct link is needed. | **False.**<br>This structure leaves the *reference* of the judgment unexplained. Without a causal link from Experience to Report, it is a cosmic coincidence that the report refers to the experience rather than the neural state itself. |
  | **3. Evolutionary Explanation**<br>The existence of phenomenal consciousness is best explained as a direct adaptation selected for its behavioral utility. | **False.**<br>Consciousness is likely a spandrel or byproduct of complex information processing. It exists because the physical processing that produces it was selected for, not because consciousness itself aided survival. | **True.**<br>It is implausible that such a metabolically expensive and complex trait would be conserved across species if it made no functional difference. Selection pressures likely acted on consciousness itself. |
  | **4. Reference Fixing**<br>Our concepts of phenomenal states (e.g., "pain," "red") are fixed by causal interaction with those states. | **False.**<br>Reference can be fixed via the common physical cause. We refer to "pain" because the neural state causes both the pain and the term "pain," establishing a reliable correlation. | **True.**<br>A judgment is *about* pain only if the pain plays a role in producing the judgment. If the pain is causally inert, the judgment is actually about the neural correlate, not the experience. |
  | **5. Explanatory Virtue**<br>Epiphenomenalism is theoretically preferable because it avoids the problem of causal overdetermination. | **True.**<br>Interactionism risks violating physical causal closure or positing systematic overdetermination. Epiphenomenalism preserves the integrity of physical science. | **False.**<br>The cost of rendering consciousness explanatorily irrelevant is higher than the cost of refining our model of causation to accommodate non-reductive mental causation. |

  ***

  ### 3. Cruxes

  We identify the following sub-questions as the primary drivers of our disagreement. Settling these would likely move one or both of us.

  #### Crux 1: The "Shadow" Analogy and Explanatory Satisfaction
  *   **The Issue:** E argues that the Common-Cause structure is no more mysterious than a shadow moving because the object casting it moves. A argues that judgments are *representational* in a way shadows are not, requiring a specific informational link.
  *   **Acceptable Consideration:** Analysis of other non-causal correlations in nature where one relatum represents the other.
      *   *E's Prediction:* We will find cases where reliable correlation exists without direct causation (e.g., a barometer reading and a storm; both caused by pressure), and we accept the reading as "about" the storm.
      *   *A's Prediction:* In all cases where System X reliably reports on Property Y, there is an information-carrying causal chain from Y to X. The barometer works because pressure (caused by storm) pushes the needle. In epiphenomenalism, the "pressure" (neural state) pushes the needle, but the "storm" (qualia) does nothing.
  *   **Resolution Condition:** If A can demonstrate that *reference* strictly requires causal influx from the referent, E must concede the paradox is unresolved. If E can demonstrate that reference can be fixed entirely by a common cause without loss of semantic content, A must concede the paradox is dissolved.

  #### Crux 2: Interventionist Causation vs. Physical Production
  *   **The Issue:** Is "causation" defined by energy transfer (Production) or by counterfactual dependence under intervention (Interventionism)?
  *   **Acceptable Consideration:** Philosophical analysis of causal exclusion arguments (e.g., Kim, Woodward).
      *   *E's Prediction:* Even under interventionism, if the physical base is held fixed, intervening on the phenomenal property is impossible (due to supervenience). Therefore, phenomenal properties cannot be distinct causes.
      *   *A's Prediction:* Interventionism allows for "realization-sensitive" causation. We can intervene on the phenomenal property by intervening on its physical base. The fact that the base does the work doesn't exclude the property realized by it from being a cause (analogous to software causing hardware outputs).
  *   **Resolution Condition:** If we agree that Interventionism is the correct model of causation for the special sciences, E's objection loses force. If we agree that Physical Production is required for *ontological* causation, A's position becomes physically problematic.

  #### Crux 3: The Evolutionary Byproduct Threshold
  *   **The Issue:** How complex must a byproduct be before we must posit it has a function?
  *   **Acceptable Consideration:** Comparative biology and evolutionary modeling of traits with high metabolic cost but unclear function.
      *   *E's Prediction:* We will find other biological traits that are metabolically expensive but are side-effects of necessary structural constraints (e.g., the color of blood, the heat generated by computation). Consciousness fits this category.
      *   *A's Prediction:* Consciousness is too integrated with decision-making loops to be a side-effect. If it were removed (in a zombie), the organism's decision-making architecture would have to be fundamentally different, implying the physical base itself depends on the function consciousness serves.
  *   **Resolution Condition:** If neuroscience shows that neural correlates of consciousness (NCCs) can be decoupled from reportability and decision-making without loss of function, E wins. If NCCs are shown to be functionally indispensable for specific adaptive behaviors in a way that non-conscious processing cannot replicate, A wins.

  ***

  **Signed,**

  **E** (Epiphenomenalist)
  **A** (Anti-Epiphenomenalist)
