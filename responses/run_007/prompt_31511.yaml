      *   **Statelessness vs. Stateful Tracking:** In serial thinking, you have to keep track of *where you are* in the decomposition. In HCH, the tree structure *is* the state management.
      *   **Specialization (Emergent):** Even if initialized identically, nodes can specialize based on the subproblem they receive. (Though the prompt says "same knowledge," the *effective* knowledge becomes specialized).
      *   **Error Correction/Verification:** One branch can check another. In serial thinking, checking your own work is prone to the same blind spots. HCH allows for adversarial sub-agents.
      *   **Depth of Recursion:** There's a limit to how many steps a human can chain in thought before losing the thread. HCH formalizes the handoff.

  4.  **Connect to AI Alignment/IDA (Iterated Distillation and Amplification):**
