      *   *Context Switching Overhead:* In serial thinking, switching between subproblems costs energy and risks losing context. HCH isolates contexts.
      *   *The "State" Argument:* This is the strongest technical point. A Turing machine with infinite time but finite tape (memory) is less powerful than one with infinite tape. HCH provides the "infinite tape" via the tree structure.
      *   *Epistemic Diversity (Nuance):* Even if initialized the same, different prompts lead to different trajectories. This allows for "debate" or "redundancy" that a single mind can't easily simulate without bias.
      *   *Alignment Implications:* Why does this matter for alignment? Because we want to scale *judgment*, not just speed. If the bottleneck is judgment quality per step, HCH preserves that. If the bottleneck is memory, HCH solves it.
