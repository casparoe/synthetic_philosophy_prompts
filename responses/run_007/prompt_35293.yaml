          2.  **Framing/Conceptual Schemes:** Disagreement might be verbal or conceptual, not factual.
          3.  **The Epistemic Trap:** As the prompt notes, rejecting epistemic realism undermines the argument itself. The argument *uses* epistemic norms (IBE, probability) to argue against moral norms. It presupposes epistemic realism. Therefore, Premise (2) cannot be universally true across all domains.
      *   *The Cost (What the Moral Realist must say):*
