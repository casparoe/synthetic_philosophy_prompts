answer: |-
  This is an excellent pedagogical pivot. Moving students from the *mechanics* of the money pump to its *normative foundation* is where the real philosophy happens. The mechanics are just a thought experiment; the conceptual geography tells us what kind of creatures we are supposed to be.

  Here is a breakdown of the conceptual structure of money pump arguments, divided into the two axes you identified: the source of the norm (exploitability vs. coherence) and the temporal scope (synchronic vs. diachronic).

  ### 1. What is the Argument For? (Exploitability vs. Coherence)

  You asked whether the irrationality consists in the vulnerability to exploitation or if the pump is just a dramatization of a deeper coherence problem. The consensus in the literature is that **exploitability is the symptom, not the disease.**

  If you tell students that cyclic preferences are irrational *because* you lose money, a clever student will reply: "So what? I enjoy cycling through these options, and the small fee is the price of my amusement. Or, I simply refuse to play the trader's game."

  To counter this, you need to distinguish between **Pragmatic Consistency** and **Structural Coherence**.

  **A. The Pragmatic Interpretation (The "Don't Be a Sucker" View)**
  On this view, rationality is instrumental. If you have goals (e.g., keeping your money), cyclic preferences frustrate those goals.
  *   *Weakness:* This makes rationality contingent on caring about money. If an agent is indifferent to wealth, the pump loses its bite. It turns rationality into a prudential heuristic rather than a constitutive norm of agency.

  **B. The Structural Interpretation (The "Conditions of Agency" View)**
  This is the stronger, standard philosophical view. The money pump is a *reductio ad absurdum* designed to show that cyclic preferences cannot represent a coherent ranking of value.
  *   **The Dominance Argument:** The real force of the money pump isn't the loss of the fee; it's that the agent ends up back at their starting point (Option A) but with less money. This means they have chosen **A-minus-fee** over **A**. Since they started with A, and ended with A-minus-fee, they have effectively chosen a strictly dominated option.
  *   **The Representation Theorem Link:** The pump demonstrates why we need transitivity to model an agent as a *utility maximizer*. If preferences cycle, there is no stable "better than" relation. The agent isn't maximizing anything; they are merely reacting. The pump dramatizes the fact that without transitivity, the concept of "choice" loses its meaning. You aren't choosing *for a reason*; you are just oscillating.

  **Teaching Tip:** Ask your students: "If a genie guaranteed no traders existed in the universe, would it still be irrational to prefer A > B, B > C, and C > A?" If they say yes, they admit the irrationality lies in the *structure of the preferences*, not the *loss of money*. The money pump is just the visible proof of that structural defect.

  ### 2. The Diachronic Extension (Preference Change Over Time)

  This is where the geography gets rugged. The move from synchronic cycles (A > B > C > A at $t_1$) to diachronic reversals (A > B at $t_1$, B > A at $t_2$) requires a significant shift in normative assumptions.

  **A. The Disanalogy**
  In the synchronic case, the inconsistency is logical. You cannot hold all three preferences simultaneously without contradiction.
  In the diachronic case, there is no logical contradiction in preferring A to B on Monday and B to A on Tuesday. People grow, learn, and change tastes. If the money pump argument is to work here, it cannot rely on transitivity alone. It must rely on a norm of **Dynamic Consistency**.

  **B. The Presupposition of a Unified Subject**
  You hit the nail on the head: the diachronic pump only works if we presuppose the agent across time is a **unified subject**.
  *   **The "Team of Selves" Objection:** If we view the Monday-Self and Tuesday-Self as distinct agents (like players in a game), the trader isn't pumping an irrational individual; they are facilitating trade between two different agents with different valuations. There is no irrationality here, just gain from trade.
  *   **The Requirement of Stability:** For the diachronic pump to demonstrate irrationality, we must assume that *mere passage of time* is not a rational reason for preference reversal. If I prefer A to B today, and I know I will prefer B to A tomorrow *without any new information or reflection*, I am defective as a temporally extended agent.

  **C. Separability and Resoluteness**
  The diachronic pump argument usually leans on the **Separability Principle** (or Dynamic Consistency). This principle states that your plan at $t_1$ should not be overturned at $t_2$ unless something relevant has changed.
  *   **The Norm:** Rational agents should be *resolute*. If I plan to choose A over B, and nothing changes to make B more valuable, I should stick to the plan.
  *   **The Exploit:** The trader exploits the gap between my *planning self* and my *acting self*. The irrationality consists in a failure of **self-governance**. I am not governing my future actions according to my current values.

  **Teaching Tip:** Distinguish between **Endogenous** and **Exogenous** change.
  *   *Exogenous:* I prefer coffee to tea on Monday. On Tuesday, I learn tea has health benefits I didn't know about. I switch to tea. (Rational change; pump fails).
  *   *Endogenous:* I prefer coffee to tea on Monday. On Tuesday, I just feel like tea more. No new info. (Arbitrary change; pump succeeds).
  The diachronic money pump argues that *arbitrary* preference change is irrational because it fragments the agent's agency over time.

  ### 3. Mapping the Conceptual Geography for Students

  To help your students visualize this, you might present the money pump landscape as having two dimensions: **Structure** and **Time**.

  | | **Synchronic (At one time)** | **Diachronic (Across time)** |
  | :--- | :--- | :--- |
  | **The Defect** | **Intransitivity.** (A>B, B>C, C>A) | **Dynamic Inconsistency.** (Plan A at $t_1$, Choose B at $t_2$) |
  | **The Norm** | **Coherence.** Preferences must form a coherent ordering to represent value. | **Stability/Resoluteness.** Preferences should not shift without new reasons. |
  | **The Loss** | **Dominance.** You choose an option strictly worse than one you already hold. | **Fragmentation.** Your future self defeats your past self's plans. |
  | **The Presupposition** | That the agent acts for reasons. | That the agent is a unified entity over time. |

  ### Summary of the Conceptual "Punchline"

  1.  **On Exploitability:** The money pump is not an argument that "losing money is bad." It is an argument that **if** you are vulnerable to a money pump, your preferences do not represent a coherent ranking of value. The loss of money is merely the empirical cashing-out of a logical flaw. It turns a silent structural defect into a loud practical failure.
  2.  **On Diachronic Change:** The diachronic pump is a stronger, more controversial claim. It argues that rational agency requires **temporal integration**. It posits that a rational agent is not a series of time-slices, but a single entity that must govern its future states. If you allow preferences to shift arbitrarily, you cease to be a planner and become a series of reacting impulses. The trader exploits not your logical inconsistency, but your **failure of will**.

  ### Suggested Seminar Discussion Questions
  To push them past the mechanics, try these:
  1.  *The Happy Cyclist:* "If an agent knows they have cyclic preferences but enjoys the process of trading, are they irrational? Does the money pump assume we must prefer more money to less?" (Targets the Exploitability vs. Coherence distinction).
  2.  *The Changing Self:* "If I prefer to be a smoker at 20 and a non-smoker at 40, is a money pump argument valid against me if a trader exploits that shift? Where is the line between rational growth and irrational instability?" (Targets the Unified Subject presupposition).
  3.  *The Isolated Agent:* "If an agent with cyclic preferences lives on a desert island with no traders, are they irrational? If yes, why? If no, does that mean rationality is social?" (Targets the source of the norm).

  This framework should help you move the seminar from "here is how the trick works" to "here is what this trick tells us about the nature of rational agency."
