answer: |-
  # The Frege-Geach Diagnostic Tree

  **Start Here:** To explain why moral arguments are valid (e.g., "If stealing is wrong, then lying is wrong; Stealing is wrong; Therefore, lying is wrong"), do moral sentences need to function like ordinary facts that can be **true or false**?

  *   **YES** (They must function like truth-apt facts)
      *   **Go to:** [The Cognitivist Path]
  *   **NO** (They function primarily as expressions of attitude/commitment)
      *   **Go to:** [The Expressivist Path]
  *   **BOTH** (They express beliefs *and* attitudes equally)
      *   **Go to:** [The Hybrid Path]
  *   **THE QUESTION IS FLAWED** (The distinction between "fact" and "attitude" is confused)
      *   **Go to:** [The Dissolution Path]

  ---

  ### [The Cognitivist Path]
  **Question:** If moral sentences function like facts, **do moral facts actually exist in the world?**

  *   **YES** (There are moral facts that make these sentences true)
      *   **→ LEAF: Realist Cognitivism**
      *   *(View: The Frege-Geach problem is a reason to reject expressivism. Moral sentences are beliefs about real properties.)*
  *   **NO** (Moral sentences aim at facts, but there are none)
      *   **→ LEAF: Error Theory**
      *   *(View: The Frege-Geach problem shows expressivism fails, but realism fails too. All moral sentences are false.)*
  *   **UNEXPLORED/INCOHERENT** (They function like facts but facts don't exist and sentences aren't false)
      *   *(This box is empty. If sentences function like facts but no facts exist, they are false. That leads to Error Theory.)*

  ---

  ### [The Expressivist Path]
  **Question:** Is the Frege-Geach problem a serious obstacle we must overcome by making attitudes **look like** they have logic?

  *   **NO** (Logic doesn't strictly apply to attitudes; the problem is overstated)
      *   **→ LEAF: Traditional Non-Cognitivism**
      *   *(View: Ayer/Stevenson. Moral sentences express emotion. Logical validity in moral arguments is loose or secondary.)*
  *   **YES** (We must explain how attitudes embed in logic)
      *   **Question:** How do we solve the embedding problem?
          *   **By showing norms/plans have their own consistency logic**
              *   **→ LEAF: Norm-Expressivism**
              *   *(View: Gibbard. Moral judgments are plans. Plans can be logically inconsistent.)*
          *   **By earning the right to talk "as if" they are true (mimicking truth)**
              *   **→ LEAF: Quasi-Realism**
              *   *(View: Blackburn. We project attitudes but construct a logic that allows truth-talk.)*
          *   **UNEXPLORED** (We solve it by denying language has logic)
              *   *(This box is empty. Denying language has logic makes communication impossible.)*

  ---

  ### [The Hybrid Path]
  **Question:** If sentences express both beliefs and attitudes, **which part is doing the logical work?**

  *   **The Belief Part** (The cognitive content handles the embedding)
      *   **→ LEAF: Hybrid Cognitivism**
      *   *(View: Copp. The belief component secures truth conditions; the attitude component adds motivation.)*
  *   **The Attitude Part** (The expressive content handles the embedding via complex attitudes)
      *   **→ LEAF: Hybrid Expressivism**
      *   *(View: Ridge. The attitude itself is complex enough to handle logical operators.)*
  *   **BOTH EQUALLY** (Neither alone solves it; they work in tandem)
      *   **→ LEAF: Global Hybrid (Unexplored)**
      *   *(View: Unexplored. Most hybrids prioritize one component for semantics. A view relying equally on both is theoretically unstable but logically possible.)*

  ---

  ### [The Dissolution Path]
  **Question:** What is the main source of the confusion creating the problem?

  *   **Truth is too easy** (Truth is just a linguistic device, not a heavy metaphysical requirement)
      *   **→ LEAF: Deflationary Dissolution**
      *   *(View: The problem vanishes once we see "true" is just a tool for endorsement, not a property.)*
  *   **Context does the work** (Meaning changes based on use, not fixed content)
      *   **→ LEAF: Pragmatic Dissolution**
      *   *(View: Later Wittgenstein/Stevenson updates. Logic is a feature of dialogue, not sentence structure.)*
  *   **Facts/Attitudes aren't separate** (The dichotomy itself is the error)
      *   **→ LEAF: Conceptual Dissolution**
      *   *(View: Putnam/Scanlon-ish. Moral facts are inherently reason-giving; the split is artificial.)*
  *   **UNATTRACTIVE** (The problem is real but humans just can't solve it)
      *   *(This box is empty. This leads to skepticism, which collapses into Error Theory or Non-Cognitivism.)*

  ---

  ### Instructor's Commentary & Design Reasoning

  **1. Logical Space vs. Defended Positions**
  This tree is built on the *logical commitments* required to solve the Frege-Geach (FG) problem, rather than historical labels. The primary split (Fact vs. Attitude vs. Both vs. Flawed) maps the semantic terrain.
  *   **Empty Boxes:** I have flagged three empty boxes.
      *   *Cognitivism + No Facts + Not False:* Incoherent. If you claim to state facts but none exist, the statement is false (Error Theory).
      *   *Expressivism + Deny Language Logic:* Incoherent. If moral language has no logic, it cannot function in conditionals at all, rendering it useless for reasoning.
      *   *Dissolution + Skepticism:* Unattractive/Unstable. Claiming the problem is unsolvable usually forces a collapse into Error Theory (if you think facts are needed) or Traditional Non-Cognitivism (if you think attitudes are primary).
  *   **Unexplored Boxes:** The "Global Hybrid" leaf represents a logical possibility (both belief and attitude share semantic weight equally) that is rarely defended because it risks redundancy or instability. Most hybrid theorists (like Ridge or Copp) privilege one component for the semantic heavy-lifting.

  **2. Indistinguishable Positions**
  *   **Quasi-Realism vs. Deflationary Dissolution:** These two leaves are notoriously difficult to separate cleanly. Blackburn's Quasi-Realism often employs deflationary truth. The distinction here rests on *attitude toward the problem*: Quasi-Realists see FG as a challenge to be *met* by constructing a logic of attitudes that earns truth-talk; Deflationary Dissolvers see FG as a confusion that *vanishes* once we correct our theory of truth. In practice, students may find these positions merge.
  *   **Traditional Non-Cognitivism vs. Norm-Expressivism:** Both deny robust moral facts. The split relies on whether the student thinks attitudes *need* a logic (Gibbard) or whether logic is secondary to expression (Ayer/Stevenson). Historically, Traditional Non-Cognitivism is considered "refuted" by FG, but as a student position, it represents the view that FG demands too much of moral language.

  **3. Why These Questions?**
  *   **Accessibility:** I avoided terms like "truth-conditional semantics," "ontology," or "propositional content." Instead, I used "function like ordinary facts," "exist in the world," and "logical work." This allows students to answer based on their intuitions about language and reality without needing to know the jargon beforehand.
  *   **Focus on Solution:** The prompt asked to sort by what students think *solves* the problem. Notice the Expressivist branch asks "Is FG a serious obstacle we must overcome?" This separates the historical view (which struggled with FG) from modern expressivists (who build systems to solve it).
  *   **Leaf Count:** There are 11 leaves total. This fits the 8–12 constraint while covering all requested positions (Traditional NC, Quasi-realism, Gibbard, Hybrid, Realist, Error, Dissolution) plus necessary logical distinctions (Hybrid Cognitivism vs. Hybrid Expressivism; types of Dissolution).

  **4. Pedagogical Use**
  *   **Diagnostic:** Students can trace their answers to find a "home" position.
  *   **Critical:** If a student lands on an "Empty" or "Unexplored" leaf, it prompts a discussion: "Why do you think no one defends this? Is it impossible, or just difficult?"
  *   **Nuance:** The Hybrid path forces students to decide *which* part of their view is doing the philosophical labor, preventing them from hiding behind the label "Hybrid" without committing to a semantic mechanism.
