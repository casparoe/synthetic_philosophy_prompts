answer: |-
  You have identified the exact methodological gap that stalls progress in this field: researchers are building engines without agreeing on the destination. The literature often assumes a "maximalist" job description (solve everything while keeping all finite intuitions) which leads to impossibility theorems, or it silently drops constraints to make the math work.

  Below is the job description for an adequate theory of infinite ethics, broken down by domain coverage, normative principles, and formal constraints, followed by the known impossibility frontiers and a classification of what is hard versus negotiable.

  ### 1. Domain Coverage Requirements
  *What inputs must the theory accept and compare?*

  *   **Infinite Populations (Spatial):** The theory must evaluate worlds containing infinitely many subjects existing simultaneously (e.g., an infinite universe).
      *   *Consideration:* Longtermism and cosmology suggest the number of potential beings may not be finite.
  *   **Infinite Horizons (Temporal):** The theory must evaluate streams of utility extending infinitely into the future.
      *   *Consideration:* If humanity survives indefinitely or creates digital successors, the time horizon is potentially unbounded.
  *   **Unbounded Value Density:** The theory must handle cases where utility per location/agent is unbounded (not just bounded between 0 and 1).
      *   *Consideration:* Avoids artificial caps on welfare that distort high-stakes scenarios (e.g., extreme suffering or ecstasy).
  *   **Finite-Infinite Comparisons:** The theory must be able to compare a finite world against an infinite world.
      *   *Consideration:* We need to know if creating an infinite future is better than ensuring a finite but perfect one; theories that only rank infinite-vs-infinite are action-guidingly incomplete.
  *   **Probabilistic Mixtures:** The theory must handle expected value calculations where outcomes involve infinite utilities or infinite probabilities.
      *   *Consideration:* Decision-making under uncertainty requires comparing lotteries over infinite worlds, not just deterministic worlds.

  ### 2. Normative Axioms
  *Which ethical intuitions must the theory preserve?*

  *   **Pareto Principle (Strong):** If every individual in World A is at least as well off as in World B, and at least one is strictly better off, then A is better than B.
      *   *Consideration:* Core to almost all welfarist views; violating this implies you can ignore someone's benefit for no reason.
  *   **Pareto Principle (Weak):** If every individual is strictly better off in A than B, then A is better than B.
      *   *Consideration:* A weaker fallback if Strong Pareto conflicts with other axioms.
  *   **Anonymity (Permutation Invariance):** The value of a world should not depend on the *indices* or labels of the individuals, only on the distribution of welfare.
      *   *Consideration:* Captures impartiality; Person 1 having utility 10 should matter the same as Person 1,000,000 having utility 10.
  *   **Separability (Independence):** The evaluation of a subset of locations/agents should not depend on the utility values at distant/infinite other locations.
      *   *Consideration:* Prevents "swamping," where local improvements are rendered morally invisible by distant infinities.
  *   **Non-Elitism:** No finite set of individuals should dictate the value of the whole infinite world.
      *   *Consideration:* Prevents leximin-style rules where the worst-off person dictates value regardless of the infinite good elsewhere.
  *   **Addition Principle:** Adding a life with positive welfare (without affecting others) should not make the world worse.
      *   *Consideration:* Prevents "Sadistic" conclusions common in population ethics.

  ### 3. Formal & Structural Constraints
  *What logical and mathematical properties must the ordering satisfy?*

  *   **Transitivity:** If A ≥ B and B ≥ C, then A ≥ C.
      *   *Consideration:* Required for rational choice; without this, money-pump arguments apply and decision theory collapses.
  *   **Completeness:** For any two worlds A and B, either A ≥ B or B ≥ A (or both).
      *   *Consideration:* Required for decisive action-guidance; incompleteness implies some choices are rationally permissible regardless of outcome.
  *   **Continuity:** Small changes in utility should not lead to discontinuous jumps in value ranking.
      *   *Consideration:* Prevents lexical thresholds where a tiny amount of suffering outweighs infinite happiness.
  *   **Representability:** The ordering can be represented by a real-valued function (or hyperreal/surreal function).
      *   *Consideration:* Useful for calculation and integration with standard decision theory, but potentially an aesthetic constraint rather than ethical.
  *   **Consistency with Finite Ethics:** In cases where both worlds are finite, the theory must reduce to standard standard aggregation (e.g., total utilitarianism).
      *   *Consideration:* Infinite ethics is an extension problem; it should not contradict established finite ethics where they apply.

  ### 4. The Impossibility Frontier
  *Which requirements are jointly unsatisfiable?*

  You cannot satisfy all the above. The following conflicts are proven in the literature (e.g., Basu & Mitra 2003; Lauwers 2010; Arrhenius 2018):

  1.  **Pareto + Anonymity + Completeness:** There is no complete ordering over infinite utility streams that satisfies both Weak Pareto and Anonymity while being representable by a real-valued function. (If you drop representability, you can have an ordering, but it is non-constructive).
  2.  **Pareto + Separability + Infinite Summation:** Standard summation violates Separability in infinite contexts (changing a finite number of values doesn't change the infinite sum, violating Strong Pareto).
  3.  **Completeness + Avoidance of Paradoxes:** To maintain Completeness, you often must accept counterintuitive results like the "Rearrangement Paradox" (where shuffling utilities makes a world better despite no one gaining) or "Infinity Swamping" (finite improvements matter zero).

  ### 5. Classification: Hard vs. Negotiable
  *Where should the theory draw the line?*

  | Requirement | Classification | Rationale for Classification |
  | :--- | :--- | :--- |
  | **Transitivity** | **Hard** | Without this, rational choice is impossible. |
  | **Consistency (Finite)** | **Hard** | If it fails here, it is not an extension of ethics but a replacement. |
  | **Pareto (Weak)** | **Hard** | Violating this implies ignoring unanimous benefit. |
  | **Completeness** | **Negotiable** | Many philosophers accept "incomparability" to save Pareto and Anonymity. |
  | **Anonymity** | **Negotiable** | Some theories (e.g., discounting) sacrifice this to ensure convergence. |
  | **Representability** | **Negotiable** | Preferring real numbers is mathematical convenience, not ethical necessity. |
  | **Separability** | **Negotiable** | Infinite contexts may inherently require holistic evaluation. |
  | **Pareto (Strong)** | **Negotiable** | May need to be weakened to Weak Pareto to avoid impossibility results. |

  ### 6. Brief Note on Contenders
  *   **Standard Summation:** Fails Pareto (finite changes don't affect infinite sums) and Separability.
  *   **Overtaking/Catching-Up Criteria:** Satisfies Pareto and Anonymity but sacrifices Completeness (some worlds are incomparable).
  *   **Hyperreal/Surreal Aggregation:** Satisfies Completeness and Pareto but sacrifices Representability (in standard reals) and often Anonymity (depends on ordering of summation).
  *   **Discounting:** Satisfies Completeness and Math constraints but sacrifices Anonymity (future people count less) and Pareto (in some formulations).

  ### Summary
  The project of infinite ethics is not finding a theory that satisfies all intuitive constraints, but rather selecting which impossibility theorem to instantiate by explicitly choosing which core axiom (Completeness, Anonymity, or Pareto) to sacrifice.

  \answer{An adequate theory of infinite ethics must explicitly specify which core finite ethical axioms it abandons to resolve the inherent impossibility of satisfying Pareto, Anonymity, and Completeness simultaneously over infinite domains.}
