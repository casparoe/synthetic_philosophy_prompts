      *   *Claim 3: The Combination.* "Together... prove that the mind is just an illusion." -> **Problematic.** Dennett is a realist about consciousness, but a specific kind (illusionism regarding *qualia* as traditionally conceived, but not regarding the *phenomenon* of consciousness itself).
