      *   *Mencius's Strain:* If nature is good, why did *ordinary* students become monsters so fast? Mencius would say they "lost their heart." But why so easily? He needs to emphasize the fragility of the sprouts.
      *   *Xunzi's Strain:* If nature is bad, where does the capacity for reform come from? The fact that they stopped (eventually) and felt bad suggests a capacity for recognition of wrong, which leans slightly Mencian. Also, Xunzi believes in the possibility of becoming a Sage; the SPE shows how hard that is.

