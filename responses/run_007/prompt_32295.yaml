prompt: |-
  I'm in a philosophy of medicine seminar and last week two of my classmates got into it after class about the therapy/enhancement distinction, and I've been turning it over in my head ever since. It started when we were discussing coverage decisions for ADHD medications.

  Elena said the therapy/enhancement distinction is basically the only thing keeping health insurance from becoming a lifestyle subscription service. If you can't say that treating a disease is different from making a well person better-than-well, then there's no principled limit on what gets covered, and the whole risk-pooling model collapses. Marcus pushed back and said the distinction is a phantom: it just picks out whatever we happen to think is normal human functioning, and "normal" is a statistical notion, not a moral one. He pointed out that if the average person's vision is 20/20, then LASIK is enhancement, but if the average shifts because everyone gets LASIK, suddenly it's... what, therapy for the unaided? That's absurd.

  Elena said that's not quite right because you can define normal functioning in terms of species-typical functioning, not the statistical average—the idea being that there's a biological baseline set by what human organisms are organized to do, and disease is a departure from that. Marcus said that's even worse: species-typical functioning would rule out eyeglasses for most of human history, and it also means the standard is set by whatever evolution happened to produce, which is a naturalistic fallacy. Elena came back and said that's too quick: the line doesn't have to be sharp to be real, and the fact that we can argue about borderline cases (is mild ADHD a disorder or just the low end of a normal distribution?) doesn't mean there's no difference between treating depression and taking modafinil to pull an all-nighter.

  Marcus said that's a pragmatic fudge, not a principled distinction. He said the real work is being done by suffering and functional impairment, not by some concept of "normal," and once you admit that, you've already conceded that enhancement is sometimes justified—because if you live in a society where everyone else is cognitively enhanced, your unenhanced state might involve genuine suffering and functional impairment relative to the social baseline. Elena said that's exactly the kind of ratchet she's worried about: once you let the social baseline set the standard, you're in an arms race where everyone has to enhance just to keep up, and that's a different kind of harm from the one Marcus is pointing at—it's a collective action problem, not an individual welfare issue.

  They went back and forth for another ten minutes and I honestly couldn't tell who was getting the better of it. Can you go through their exchange and adjudicate it move by move—who's right about what, which points land, which ones don't, and whether there's a way to reconcile their positions?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of medicine seminar.
      *   **Topic:** Therapy/Enhancement distinction (specifically regarding ADHD meds, insurance coverage, and the definition of "normal" functioning).
      *   **Characters:** Elena (defends the distinction as necessary for insurance/principled limits) vs. Marcus (attacks the distinction as arbitrary/statistical/socially constructed).
      *   **Task:** Adjudicate the exchange move-by-move, evaluate who is right/wrong on specific points, and suggest reconciliation.
      *   **Tone:** Academic, balanced, philosophical, insightful.

  2.  **Deconstruct the Dialogue (Move-by-Move Analysis):**

      *   *Move 1: Elena's Opening (Insurance & Risk Pooling)*
          *   Claim: Distinction is necessary to prevent insurance from becoming a lifestyle subscription. Without it, no principled limit.
          *   Strength: Pragmatic concern about resource allocation and the purpose of insurance (restoring health vs. optimizing life).
          *   Weakness: Assumes insurance *must* be limited to therapy. Doesn't prove the distinction is metaphysically real, just practically useful.

      *   *Move 2: Marcus's Pushback (The Phantom Distinction & Statistical Normality)*
          *   Claim: Distinction is based on "normal," which is statistical. LASIK example: If everyone does it, unaided vision becomes "abnormal."
          *   Strength: Highlights the instability of statistical norms (the "Lake Wobegon" effect). Shows how technology shifts baselines.
          *   Weakness: Equates "normal" solely with statistical average. Most philosophers of medicine (Boorse, etc.) distinguish statistical average from functional normality.

      *   *Move 3: Elena's Correction (Species-Typical Functioning)*
          *   Claim: Normal = Species-typical functioning (Boorsean biostatistical theory). Disease = departure from biological design.
          *   Strength: Moves away from mere statistics to biological teleology. Addresses the LASIK shifting baseline objection (LASIK doesn't change species design).
          *   Weakness: Marcus's counter (glasses/evolution) is strong. Is "species-typical" descriptive or normative? Evolution produces flaws (e.g., bad backs).

      *   *Move 4: Marcus's Counter (Naturalistic Fallacy & Historical Variance)*
          *   Claim: Species-typical rules out glasses (most humans historically had bad vision by modern standards? Or rather, reliance on tech isn't "species-typical"). Also, evolution $\neq$ good (Naturalistic Fallacy).
          *   Strength: "Is-Ought" problem. Just because evolution made us a certain way doesn't mean we *ought* to stay that way.
          *   Weakness: Misinterprets "species-typical" slightly (glasses restore function to the species-typical range, they don't enhance beyond it usually). But the naturalistic fallacy point sticks.

      *   *Move 5: Elena's Retreat (Fuzzy Boundaries)*
          *   Claim: Line doesn't need to be sharp to be real. Borderline cases (mild ADHD) don't negate clear cases (depression vs. modafinil).
          *   Strength: Sorites paradox defense. Vagueness doesn't imply non-existence (the "heap" argument).
          *   Weakness: Concedes the principle is hard to define, relying on intuition ("we know it when we see it").

      *   *Move 6: Marcus's Pivot (Suffering & Functional Impairment)*
          *   Claim: Real metric is suffering/impairment. Social context matters (if everyone enhances, not enhancing causes impairment).
          *   Strength: Shifts to a consequentialist/harm-based view. Addresses the reality of social competition.
          *   Weakness: Opens the door to the "arms race" Elena fears. Defines health relative to social competition, not biology.

      *   *Move 7: Elena's Final Warning (The Ratchet/Arms Race)*
          *   Claim: Social baseline leads to collective action problems (arms race). Distinct from individual welfare.
          *   Strength: Identifies the ethical risk of Marcus's view (coercive enhancement).
          *   Weakness: Doesn't solve the definitional problem, just highlights the consequence of Marcus's definition.

  3.  **Evaluate the Philosophical Landscape:**
      *   **Key Theories:**
          *   *Normative:* Health as a value (Engelhardt).
          *   *Naturalist:* Health as biological function (Boorse).
          *   *Normative-Naturalist Hybrid:* (Daniels, "Normal Species Functioning").
          *   *Social Constructivist:* Health as social agreement.
      *   **Key Tension:** Conservation of resources/definition of medicine (Elena) vs. Relief of suffering/fair opportunity (Marcus).
      *   **Who "Won"?** It's a draw, but Marcus landed heavier blows on the *definition*, while Elena landed heavier blows on the *consequences*.

  4.  **Drafting the Adjudication:**
      *   *Introduction:* Acknowledge the depth of the debate. It's a classic bioethics stalemate (Boorse vs. Daniels vs. Enhancement proponents).
      *   *Round 1 (Insurance vs. Phantom):* Elena wins on pragmatism; Marcus wins on metaphysics.
      *   *Round 2 (Species-Typical vs. Naturalistic Fallacy):* Marcus wins here. Boorse's theory is notoriously vulnerable to the "evolution isn't moral" critique.
      *   *Round 3 (Fuzzy Lines vs. Suffering):* Elena is right about vagueness (Sorites), but Marcus is right that suffering is the moral engine.
      *   *Round 4 (The Arms Race):* Elena wins on political philosophy. Marcus's view leads to the "Red Queen" effect.
      *   *Synthesis/Reconciliation:* Look for a middle ground. Norman Daniels' "Fair Equality of Opportunity" is the bridge. It keeps therapy (protecting opportunity) distinct from enhancement (expanding opportunity), but acknowledges the social context.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I represent Marcus's LASIK point correctly? Yes, it's the "shifting baseline" argument.
      *   *Check:* Did I capture Elena's insurance point? Yes, it's about the *purpose* of the institution.
      *   *Nuance:* Make sure to mention that ADHD is a particularly hard case because it sits on a spectrum (temperament vs. disorder).
      *   *Tone:* Keep it neutral. Don't say "Elena is wrong." Say "Elena's position faces difficulty here."

  6.  **Final Polish:**
      *   Structure with clear headings.
      *   Use philosophical terminology correctly (Naturalistic Fallacy, Sorites, Biostatistical Theory, Fair Equality of Opportunity).
      *   Conclude with a actionable takeaway for the seminar.

  7.  *(Final Review against constraints)*: The user wants an adjudication move-by-move, evaluation of points, and reconciliation. Ensure all three are present.

  **(Self-Correction Note):** I need to be careful not to simply say "Daniels solves it." Daniels is part of the debate. I should present his framework as a *potential* reconciliation tool, not the absolute truth. Also, acknowledge that the ADHD case is the stress test for these theories.

