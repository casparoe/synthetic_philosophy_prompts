prompt: |-
  So I got into a long argument with a friend last night about climate change and how much we owe people who don't exist yet, and it left me wanting the full specification before I read any more actual theories. My friend does economics and kept saying you have to discount future damages — that a life saved in 2200 just counts for less than one saved now because it's later, and anyway future people will be richer so a dollar to them matters less than a dollar to us. He even pulled out the 3% line: a dollar of climate damage in 200 years is worth about two cents now. I pushed back that none of that shows their suffering is less real, and that our policies change which particular people will exist, so who exactly is the complaint on behalf of? We went in circles and I dont trust either of our intuitions anymore.

  So here's what I want. You're an expert on intergenerational justice and climate ethics — a professional philosopher, not a policy person. Before recommending any theory, write me the desiderata: the full list of requirements any adequate account of our obligations to future generations has to meet, with the case or consideration behind each. I want to know which requirements are non-negotiable and which are just the preferences of particular camps (economists with their discount rates, person-affecting theorists, utilitarians, sufficientarians, whatever). Mark any pair or subset that you suspect cannot be jointly satisfied — that's the part I most want, because I suspect some of these requirements secretly contradict each other. Then tell me which single requirement does the most work in ruling out the popular views. Don't just list labels; for each requirement show me the case that forces it. Start by brainstorming the hard cases — non-identity, pure time preference, uncertainty about what future people will want, an indefinitely long future, low-probability catastrophe, the present poor versus the future rich — before you commit. Keep any scorecard of existing views brief; the criteria are what I'm after.
