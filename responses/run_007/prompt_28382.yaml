answer: |-
  This is the correct place to start. Before we adjudicate between utilitarianism, sufficientarianism, or rights-based approaches, we must establish the *constraints* any viable theory must operate within. Your argument with your friend touches on two distinct layers: the *economic parameters* (discount rates) and the *metaphysical structure* of harm (non-identity). A robust philosophical account must navigate both.

  Below is the specification of desiderata for a theory of intergenerational justice. I have derived these from the hard cases you mentioned. I have marked which are widely considered **Non-Negotiable** (required to avoid moral absurdity) and which are **Contested** (theoretical preferences of specific camps).

  ### Phase 1: The Hard Cases (The Raw Material)
  *These are the phenomena any theory must explain without collapsing.*

  1.  **Pure Time Preference:** Your friend's 3% discount rate. If we value welfare less simply because it occurs later, we justify ignoring catastrophic suffering in 2200. If we value it equally, we may justify crippling the present to save the future.
  2.  **The Non-Identity Problem:** Climate policy changes energy prices, which changes who meets whom, which changes which sperm fertilizes which egg. The specific people living in 2200 under a "high carbon" policy *would not exist* under a "low carbon" policy. Therefore, they cannot claim you harmed *them* (they owe their existence to the harm).
  3.  **The Repugnant Conclusion:** If the future is indefinite, a theory that maximizes *total* welfare might require us to impoverish everyone to maximize the sheer number of people who exist.
  4.  **Uncertainty & Catastrophe:** We don't know future technology or preferences. But we do know some outcomes (civilizational collapse) are lexically worse than others. A theory must handle "fat tails" (low probability, infinite loss).
  5.  **Present Poverty vs. Future Wealth:** Mitigation costs money now. If the present poor pay to save the future rich, is that justice or exploitation?
  6.  **Compliance & Feasibility:** A theory that demands the current generation sacrifice everything for the future will be ignored. A theory that demands nothing is useless.

  ---

  ### Phase 2: The Desiderata (The Requirements)
  *Any adequate account must satisfy the following. I have indicated the status of each.*

  #### 1. The Time-Neutrality Requirement [Non-Negotiable]
  *   **The Case:** Mere temporal location is not a morally relevant difference. A child drowning in a pond is equally bad whether it happens today or in ten years, all else being equal.
  *   **The Constraint:** The theory cannot apply a *pure* rate of time preference (discounting value solely because it is in the future). It may discount based on *probability* of existence or *marginal utility* of wealth, but not time itself.
  *   **Why:** To accept pure time preference is to say the date on the calendar changes the moral weight of suffering. This is widely regarded (since Ramsey, 1928) as ethically indefensible.

  #### 2. The Identity-Insensitivity Requirement [Non-Negotiable]
  *   **The Case:** The Non-Identity Problem. If our obligations vanish because our actions change *who* is born, then we have no obligations regarding long-term climate policy, nuclear waste, or genetic engineering.
  *   **The Constraint:** The theory must ground obligations in *states of affairs* or *quality of life*, not merely in *harm to specific identifiable individuals*.
  *   **Why:** To deny this is to accept that we can knowingly create a miserable future generation provided we ensure they are a *different* miserable generation than would have otherwise existed.

  #### 3. The Risk-Sensitivity Requirement [Non-Negotiable]
  *   **The Case:** Low-probability catastrophes. If there is a 1% chance of human extinction, standard cost-benefit analysis might ignore it. But extinction is lexically worse than economic slowdown.
  *   **The Constraint:** The theory cannot treat risk linearly. It must assign disproportionate weight to outcomes involving irreversible loss of agency or existence.
  *   **Why:** Expected utility theory fails when the "loss" is the end of the game itself.

  #### 4. The Marginal-Utility Adjustment [Contested / Economic Preference]
  *   **The Case:** Your friend's argument that future people will be richer. A dollar (or unit of welfare) matters less to a rich person than a poor one.
  *   **The Constraint:** Obligations may be adjusted based on the *relative wealth* of future generations compared to the present.
  *   **Why:** This is the only morally defensible form of "discounting." However, it is contested because it relies on empirical predictions about future growth which may be false (e.g., if climate change makes them poorer).

  #### 5. The Non-Demandingness Constraint [Contested / Deontological Preference]
  *   **The Case:** Present poverty. If Time-Neutrality is strict, the present generation might have to sacrifice almost all consumption to ensure the future is safe.
  *   **The Constraint:** The theory cannot require the current generation to sacrifice their basic rights or subsistence for the sake of future gains.
  *   **Why:** Morality must be humanly possible. However, strict utilitarians reject this, arguing that if the future loss is big enough, the sacrifice is required.

  #### 6. The Separateness of Persons [Contested / Liberal Preference]
  *   **The Case:** Aggregation. We cannot simply sum up welfare across generations as if they were one big container of happiness.
  *   **The Constraint:** The theory must respect the distinctness of generations. We cannot sacrifice Generation A entirely just to make Generation B slightly happier.
  *   **Why:** This blocks the "Repugnant Conclusion" and extreme utilitarianism, but makes aggregation mathematically difficult.

  ---

  ### Phase 3: The Incompatibilities (The Logical Friction)
  *Here is the critical section. You suspected some requirements contradict. You are right. A theory cannot satisfy all of the above simultaneously.*

  #### Incompatibility Set A: The Non-Identity Trilemma
  You cannot jointly satisfy these three:
  1.  **Person-Affecting Intuition:** An act is only wrong if it makes some *particular* person worse off than they would otherwise have been.
  2.  **Non-Identity Fact:** Climate policies change the identities of future people.
  3.  **Intuitive Obligation:** We clearly have an obligation to avoid catastrophic climate outcomes.

  *   **The Conflict:** If (1) and (2) are true, then (3) must be false. If we change identities, the future people in the "bad climate" world are not worse off than they would have been (they wouldn't exist in the "good climate" world). So we haven't harmed them.
  *   **The Resolution:** To keep (3), you **must reject (1)**. You must accept the **Identity-Insensitivity Requirement**. This forces you away from common-sense morality (which is person-affecting) toward impersonal theories (utilitarianism, prioritarianism).

  #### Incompatibility Set B: The Ramsey-Stiglitz Tension
  You cannot jointly satisfy these three:
  1.  **Time-Neutrality:** Zero pure time preference.
  2.  **Standard Growth Models:** Future generations will be significantly richer than us.
  3.  **Non-Demandingness:** The present generation should not have to sacrifice drastically.

  *   **The Conflict:** If time is neutral (1), and future people are richer (2), then the marginal utility of money is higher for us now than for them. Rational optimization requires we transfer massive wealth to them (invest heavily in mitigation). If the time horizon is infinite, the required savings rate approaches 100% of surplus.
  *   **The Resolution:** Economists usually break (1) (add discounting). Philosophers usually break (2) (argue climate change will make them poorer) or break (3) (accept high demandingness).

  #### Incompatibility Set C: The Aggregation Paradox
  You cannot jointly satisfy these three:
  1.  **Total Utilitarianism:** Maximize the sum total of welfare.
  2.  **Separateness of Persons:** Respect generational boundaries.
  3.  **Indefinite Future:** Generations continue forever.

  *   **The Conflict:** If the future is infinite, any finite sacrifice now yields infinite utility later. This leads to "tyranny of the future." Alternatively, maximizing total welfare leads to the Repugnant Conclusion (more people with barely livable lives is better than fewer happy people).
  *   **The Resolution:** You must adopt a "sufficientarian" or "averaging" view, which violates strict Total Utilitarianism.

  ---

  ### Phase 4: The "Killer" Requirement
  *You asked which single requirement does the most work in ruling out popular views.*

  **The Identity-Insensitivity Requirement.**

  This is the philosophical pivot point.
  *   **It rules out your friend's Economics:** Economics generally treats welfare as additive, but it relies on *existing* agents to calculate harm. It struggles to account for obligations to *potential* people whose identities are contingent on the policy.
  *   **It rules out Common-Sense Morality:** Most people (and you, initially) operate on a **Person-Affecting View** ("I can't harm him, because if I didn't do this, he wouldn't exist"). Accepting Identity-Insensitivity forces you to admit that morality is about *creating good states of affairs*, not just *protecting specific rights-bearers*.
  *   **It rules out Rights-Based Theories:** Standard rights theories struggle because rights are typically held by *persons*. If the persons don't exist yet, and their existence is contingent on the violation, they have no standing to complain.

  While the **Time-Neutrality Requirement** is the one that kills your friend's 3% discount rate, the **Identity-Insensitivity Requirement** is the one that kills the intuition that *you* were using to push back. It forces the realization that the complaint is not on behalf of *specific* future individuals, but on behalf of the *condition* of the future itself.

  ---

  ### Phase 5: Brief Scorecard of Existing Views
  *How do the major camps fare against the Desiderata?*

  | View | Time-Neutrality | Identity-Insensitivity | Risk-Sensitivity | Non-Demandingness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Economics** (Nordhaus, etc.) | **FAIL** (Uses pure time preference) | Pass (Implicitly impersonal) | **FAIL** (Linear risk) | Pass | Ruled out by Req 1. |
  | **Common-Sense Morality** | Pass | **FAIL** (Person-Affecting) | Pass | Pass | Ruled out by Req 2 (Non-Identity). |
  | **Total Utilitarianism** | Pass | Pass | Pass | **FAIL** (Too demanding/Repugnant) | Ruled out by Req 5 & 6. |
  | **Sufficientarianism** (Ensure threshold) | Pass | Pass | Pass | Pass | **Strongest Contender.** |
  | **Prioritarianism** (Weight the worse off) | Pass | Pass | **Mixed** | **Mixed** | **Strong Contender.** |

  ### Summary for Your Argument
  Your friend is violating **Requirement 1 (Time-Neutrality)**. There is no ethical defense for a *pure* time discount rate; it is essentially prejudice against the future. However, you are relying on an intuition that violates **Requirement 2 (Identity-Insensitivity)**. If you insist that we can only owe duties to specific identifiable people, you lose the ability to claim climate policy is obligatory, because climate policy changes who is born.

  To win the argument, you must concede that obligations are **impersonal** (we owe it to the *future* to be habitable, not to *Bob in 2200*), while insisting that **time itself is not a discount factor**. This forces the discussion onto **Requirement 4 (Marginal Utility)**: *Are* future people actually going to be richer? If climate collapse occurs, they won't be. If they aren't richer, the economic argument for low mitigation collapses even on its own terms.
