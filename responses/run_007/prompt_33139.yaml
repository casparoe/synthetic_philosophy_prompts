answer: |-
  This is a classic problem in the philosophy of action. You are running into the wall that separates **descriptive models** (like hyperbolic discounting) from **normative accounts** (like weakness of will/akrasia).

  Hyperbolic discounting explains *why* your preferences reverse in Case 1. It describes the curve of your valuation. But it cannot tell you whether breaking a diet is morally or rationally distinct from breaking a smoking cessation plan (Case 6), nor can it explain why buying a gym membership you know you won't use isn't irrational (Case 2). Discounting is about *preference*; weakness of will is about *governance*.

  The principle that best captures your verdicts is a version of **Richard Holton's Resolution Account**, refined with **Michael Bratman's Planning Theory**.

  ### The Principle: Unjustified Surrender of Resolution

  **Weakness of will is not merely acting against a prior intention. It is the abandonment of a resolution in the face of temptation, without a justified re-evaluation of the underlying reasons.**

  This principle distinguishes between **surrender** (weakness) and **revision** (rational updating). It relies on three components:
  1.  **Resolution:** A specific kind of intention designed to block re-deliberation (e.g., "I will not smoke" vs. "I prefer not to smoke").
  2.  **Temptation:** The presence of a contrary desire that threatens the resolution.
  3.  **Justification:** Whether the later self has new information or a valid normative reason to break the plan, or is merely succumbing to the weight of the immediate desire.

  Here is how this principle handles your six cases, followed by the costs you must pay.

  ---

  ### Applying the Principle to Your Cases

  **Case 1 (Money): Not Weakness.**
  *   **Verdict:** Consistent.
  *   **Analysis:** This is pure time preference, not a resolution. You never formed a resolution to "maximize long-term wealth" that you then violated. You simply revealed a discount rate. Hyperbolic discounting explains this fully; the Resolution Account correctly identifies it as outside the scope of *akrasia*.

  **Case 2 (Gym): Not Weakness.**
  *   **Verdict:** Consistent.
  *   **Analysis:** You did not form a resolution to "work out for a year." You formed a resolution to "purchase the opportunity to work out." You kept that resolution. You paid for the option value of being the *kind of person* who tries. Since the resolution was fulfilled (you bought the membership and tried), quitting is not a violation of will, but the expiration of an option.

  **Case 3 (Alarm): Weakness.**
  *   **Verdict:** **Tension.**
  *   **Analysis:** You had a resolution (run at 6). You faced temptation (sleep). You abandoned the resolution. The fact that you "didn't feel torn" is phenomenologically interesting but normatively irrelevant. Weakness of will does not require a Shakespearean internal monologue; it requires acting against a standing resolution due to a contrary desire.
  *   **Cost:** You must drop the intuition that the *lack of struggle* exonerates you. This is "sleepy akrasia." The governance failed even if the drama was absent.

  **Case 4 (Dentist): Strength.**
  *   **Verdict:** Consistent.
  *   **Analysis:** You had a resolution (go to dentist). You faced temptation (avoid pain/anxiety). You maintained the resolution. This is the paradigm of willpower. The lack of drama indicates the resolution was robust, not that the will was absent.

  **Case 5 (Colloquium): The Diachronic Conflict.**
  *   **Verdict:** **Tension.**
  *   **Analysis:** This is the hardest case. September-you formed a resolution. April-you faces temptation (avoid work) but also claims a *change in judgment* ("work seems pointless").
      *   If April-you is merely rationalizing to avoid effort, it is weakness.
      *   If April-you genuinely believes the normative grounds for the talk have vanished, Holton argues you are permitted to reconsider. Resolutions are meant to block *temptation*, not *new evidence*.
      *   However, if we allow April-you to cancel whenever the work "feels pointless," we make resolutions toothless.
  *   **Cost:** The principle forces you to drop the thought that "Canceling would be akratic." If April-you sincerely judges the work pointless, canceling is rational revision, not weakness. The weakness lies with September-you for making a resolution that didn't account for April-you's epistemic position. You cannot bind your future self's normative judgment, only their susceptibility to temptation.

  **Case 6 (Smoking vs. Sugar): The Crucial Distinction.**
  *   **Verdict:** Consistent (with nuance).
  *   **Analysis:** Structurally, they are identical. Normatively, they differ in the **status of the resolution**.
      *   **Smoking:** A "quit date" is typically a *hard resolution*. It is binary. Moving the date is a surrender to the addiction (temptation) without a change in the reason (you still know smoking is bad). It is an unjustified abandonment.
      *   **Sugar:** Diets are often *soft resolutions* or heuristics. Eating dessert on Tuesday may be viewed as a "revision" of the plan (e.g., "I'll be stricter later," or "This is a special occasion"). Unless you view sugar as an addiction equivalent to nicotine, the social and normative context allows for revision without it counting as a total collapse of will.
      *   *Alternative:* The difference is **Identity**. Smoking threatens the identity of "Non-Smoker." Sugar threatens "Dieter." The former is often treated as a state of being; the latter as a project. Surrendering a state of being feels like weakness; adjusting a project feels like management.

  ---

  ### The Unlisted Cases: Pre-commitment

  **Case A: The Fee Account / The Pill**
  *   **Verdict:** Rational Strength, not Weakness.
  *   **Analysis:** Under the Resolution Account, pre-commitment is the rational acknowledgment that one's future self may face unjustified temptation.
      *   **The Pill:** Removes the possibility of weakness entirely. You cannot be weak if you cannot act on the temptation. This is the ultimate victory of the earlier self.
      *   **The Fee Account:** Raises the cost of surrender. If you withdraw the money, you still display weakness (you surrendered to temptation despite the cost). But setting up the account is an act of **planning rationality**.
      *   **Principle:** Pre-commitment devices are tools to protect resolutions. Using them is consistent with having a strong will; needing them is an acknowledgment of human frailty, but not a moral failing.

  ---

  ### Summary of Costs

  To adopt the **Resolution Account (Unjustified Surrender)** as your unifying principle, you must sacrifice two of your current intuitions:

  1.  **The Phenomenology of Struggle (Case 3):** You must accept that turning off the alarm *is* weakness of will, even if you felt no conflict. Weakness is a failure of governance, not a feeling of angst. The "obviousness" of sleep at 6 a.m. is the temptation successfully masking itself as reason.
  2.  **The Sovereignty of the Past (Case 5):** You must accept that if April-you genuinely judges the talk pointless, canceling is *not* akratic. You cannot define weakness as "breaking a past promise" if the normative grounds for that promise have dissolved. To insist April-you is weak is to privilege September-you's authority over April-you's current rational judgment. The weakness was in the over-commitment, not the cancellation.

  ### Why Hyperbolic Discounting Fails You
  Hyperbolic discounting predicts you *will* switch preferences in Case 1 and Case 6. It predicts you *might* quit the gym in Case 2. But it treats the Dentist (Case 4) and the Smoking (Case 6) as mathematically identical problems of cost-benefit analysis over time.

  Your intuitions reject that. You feel the Dentist case is *good* and the Smoking case is *bad*, even if the discount rates are similar. That is because you are tracking **integrity**, not just utility. You are tracking whether the later self is serving the agent's long-term ends (Dentist) or hijacking the agent for a local impulse (Smoking).

  The Resolution Account captures this: The Dentist visit upholds a resolution that serves your ends. The Smoking relapse abandons a resolution to serve a temptation. The Money case (1) involves no resolution, so it is merely a preference, not a failure of will.

  **Recommendation for your course:**
  Use your own data. Show the students that hyperbolic discounting explains the *timing* of the failure, but only a normative theory of **Resolution and Reconsideration** explains the *blame*. The gap between Case 6 (Smoking) and Case 6 (Sugar) is the gap between economics and moral psychology.
