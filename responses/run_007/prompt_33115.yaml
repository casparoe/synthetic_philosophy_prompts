      *   *Note on Scope:* I should probably suggest Scope as a "Year 2" or "Future Project" rather than a core 18-month goal, or bundle it with Conflict. Actually, the prompt asks for 2-3. I'll recommend Ground, then Conflict. Scope is important but relies on the first two. I will advise treating Scope as an *application* of the Ground/Conflict solution rather than a foundational project.

