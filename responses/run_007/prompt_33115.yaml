      *   *Selection:* Do Ground and Conflict. Deprioritize Interpretive. (Scope is important, but often relies on Ground/Conflict. Actually, Scope is a better "constructive" output than Ground. Maybe Ground -> Scope? No, Conflict is the bigger philosophical hurdle for CRE. Scope is often handled by "extending roles." Conflict is the hard stop. Let's stick with Ground -> Conflict. Scope can be the "implications" section of the Conflict paper.)
      *   *Actually, looking at the field:* The "Scope" problem is where the most new work is happening (environmental ethics). But the "Ground" problem is where the theory is most vulnerable to the "Virtue Ethics" reduction. A postdoc needs to secure the theory first.
      *   *Let's look at the "Interpretive" option again.* If I spend 2 years arguing Ames is right against Slingerland, I have written commentary on commentary. The user explicitly wants to avoid this. So Interpretive MUST be the deprioritized one.
      *   *So the choice is between Ground, Conflict, Scope.*
