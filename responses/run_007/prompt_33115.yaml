answer: |-
  Here is a defended research agenda tailored to your constraints: two years of funding, analytic/comparative training, and a commitment to avoiding pure exegetical commentary.

  ### The Ordering: Ground $\rightarrow$ Conflict

  You should tackle **The Ground Problem** first, followed immediately by **The Conflict Problem**. You should explicitly **deprioritize The Interpretive Problem**.

  Here is the rationale, the workflow, and the success criteria for each.

  ---

  ### 1. Priority One: The Ground Problem (Months 1–9)
  **Specific Formulation:** *Is the normativity of roles constitutive or derivative? Specifically, is* ren *a trans-role virtue that grounds role obligations, or is it the qualitative excellence of role-performance itself?*

  **Why it is Upstream:**
  This is the metaphysical and meta-ethical foundation. If *ren* (humaneness) is an independent virtue that *grounds* why we should fulfill roles, then Confucian Role Ethics (CRE) is structurally Virtue Ethics with relational window dressing. The "roles" become merely the *location* where virtue is exercised, not the *source* of the obligation.
  *   **If you solve this:** You secure the distinctness of CRE. If you can argue that *ren* is internally defined by specific role-relations (i.e., there is no "being humane" apart from "being a father" or "being a ruler"), you block the reduction to Virtue Ethics.
  *   **Downstream impact:** Once you establish that normativity is internal to the role-structure, you change the terms of the Conflict Problem. You aren't looking for an external principle to resolve conflicts; you are looking for an internal structural adjustment.

  **Tractability for Analytic/Comparative:**
  This is highly tractable for your background. It requires meta-ethical precision (distinguishing between *regulative* rules and *constitutive* norms) applied to textual data. You don't need to be a philologist; you need to be a meta-ethicist analyzing the logical structure of *ren* in the *Analects*.
  *   **Analytic Tool:** Use the distinction between "practice-dependent" and "practice-independent" reasons (à la Rawls or Scanlon, adapted).
  *   **Comparative Tool:** Contrast with Kantian (principle-grounded) and Aristotelian (virtue-grounded) sources of normativity.

  **18-Month Evidence/Milestones:**
  *   **Move Up/Continue:** You produce a paper distinguishing *ren* not as a "master virtue" but as a "relational quality." If you can show that *Analects* 1.2 ("*ren* is the root...") refers to the root of the *roles*, not the root of the *person*, you have a defensible position.
  *   **Drop/Pivot:** If textual evidence overwhelmingly suggests *ren* functions as an independent character trait that critiques roles (e.g., passages where *ren* demands breaking a role), you must concede CRE is a hybrid view. Pivot immediately to Conflict, acknowledging the hybrid nature.

  **Field Status Check:**
  This is **genuinely contested**. Ames/Rosemont argue roles are ontologically basic. Critics (e.g., Slingerland, Huang Yong) argue *ren* functions as a universal virtue that constrains roles. It is *not* settled that CRE avoids the Virtue Ethics reduction.

  ---

  ### 2. Priority Two: The Conflict Problem (Months 10–18)
  **Specific Formulation:** *Is there a decision procedure for role conflict that is not merely aesthetic ("do what fits") and not merely principled ("maximize harmony")?*

  **Why it is Downstream:**
  This is the stress test. Once you have argued (in Phase 1) that roles are the source of normativity, the immediate objection is: "What when roles clash?" (e.g., Father vs. Ruler).
  *   **Dependency:** If you failed to secure the Ground (i.e., if *ren* is an independent virtue), you resolve Conflict by appealing to *ren*. If you secured the Ground (roles are basic), you cannot appeal to an external *ren*. You must find the resolution *within* the role dynamics.
  *   **The Trap:** Most CRE responses bottom out in "the exemplary person (*junzi*) perceives the right fit." In analytic terms, this is often dismissed as vacuous intuitionism. Your job is to give an account of *what the junzi is perceiving* that isn't a hidden principle.

  **Tractability for Analytic/Comparative:**
  This leverages analytic action theory and dilemma literature. You can model role conflict not as a clash of *rules*, but as a clash of *identities* or *narratives*.
  *   **Analytic Tool:** Use "specificationism" (Richardson) or "particularism" (Dancy) to argue that the content of the role *shifts* in the conflict situation, rather than one role overriding the other.
  *   **Comparative Tool:** Use the *Analects* 13.18 (Father covers for son) not as a case study to be solved, but as a data point to show that "justice" is internally redefined by the father-role, not overridden by it.

  **18-Month Evidence/Milestones:**
  *   **Move Up/Continue:** You develop a model of "Role Harmonization" that explains *how* the content of the "subject" role changes when it conflicts with the "son" role, without erasing the "subject" role.
  *   **Drop/Pivot:** If you find that every resolution requires a "meta-role" (e.g., "Citizen of the Cosmos") that functions exactly like a universal principle, you must admit CRE has a principle-based core. Pivot to a "Hybrid Confucianism" paper.

  **Field Status Check:**
  This is the **standard objection** to CRE. It is not settled. Some argue Confucianism accepts "tragic remainder" (you just choose and bear the guilt); others argue there is a harmony that resolves it.

  ---

  ### 3. Deprioritize: The Interpretive Problem
  **Why Drop It:**
  You explicitly stated you want to avoid "commentary on commentary." The Interpretive Problem (*"Is Ames/Rosemont right about the text?"*) is inherently a debate about secondary literature and philological consensus.
  *   **The Trap:** Spending 18 months arguing against Slingerland or Van Norden about whether *li* means "ritual" or "social grammar" yields a paper for *Philosophy East & West* that historians will ignore and ethicists will treat as provisional.
  *   **The Strategy:** Treat the Ames/Rosemont reading as a **philosophical reconstruction**, not a historical claim. Your premise is: *"If we read the text this way, does the ethics work?"* This allows you to use the text without being held hostage by sinological consensus.
  *   **Caveat:** You must still avoid *contradicting* clear textual evidence. But your primary metric is philosophical viability, not historical fidelity.

  **Field Status Check:**
  The Role Ethics reading is **not consensus**. It is a dominant paradigm in *comparative philosophy*, but many sinologists view it as anachronistic. Engaging this debate directly is a career-long project, not a 2-year postdoc project.

  ---

  ### Note on The Scope Problem (Strangers/Animals)
  I am not listing this as a primary project because it is **downstream of Conflict**.
  *   **Reasoning:** The "Stranger Problem" is just a specific instance of the Conflict Problem where one of the roles is thin or non-existent. If you solve Conflict (how to weigh thick vs. thick roles), you can extend that logic to thick vs. thin roles.
  *   **Integration:** Do not write a standalone paper on "Confucian Environmental Ethics." Instead, make the Scope issue the *limit case* of your Conflict paper. Show how your resolution mechanism for Father/Ruler conflict scales down to Human/Stranger interaction.
  *   **Risk:** If you tackle Scope first, you risk stretching the definition of "role" (as you noted). Solve the structure of roles first (Ground/Conflict), then see if "role" can stretch.

  ### Summary of the 2-Year Arc

  1.  **Months 1–9 (Ground):** Publish "The Source of Normativity in Confucian Role Ethics." Argue *ren* is intra-role, not trans-role. Secure the theory against Virtue Ethics reduction.
  2.  **Months 10–18 (Conflict):** Publish "Resolving Role Conflict without Principles." Argue for a specificationist or narrative model of role-adjustment. Address the "Father Steals Sheep" case directly.
  3.  **Outcome:** You have a monograph-ready manuscript that defends CRE as a distinct, robust normative theory, not just an interpretive lens.

  **Why this wins:** It moves the field from *"Is this a good reading of Confucius?"* (Interpretive) to *"Is this a viable ethical theory?"* (Constructive). That is where the analytic philosophy job market and top journals are currently focused.
