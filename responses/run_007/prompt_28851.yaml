answer: |-
  The legal regime you describe is the core of the modern **Law of Armed Conflict (LOAC)**, specifically the separation between *jus ad bellum* (the justice of going to war) and *jus in bello* (the justice of conduct within war). To reconstruct the implicit theory of moral liability here, we must distinguish between the law's **operational logic** and the **moral metaphysics** that might underpin it.

  Here is the reconstruction of the implicit theory, the distinction between what it presupposes versus what it accommodates, and the consequences of shifting to a "justice-dependent" liability model.

  ### 1. The Implicit Theory: Functional Conventionalism

  The practice does not strictly presuppose a deep moral truth about the soldiers themselves. Instead, it presupposes a theory of **Functional Conventionalism**.

  Under this theory, liability to attack is not a natural moral fact (like "this person is guilty of aggression") but an **institutional status** created by the convention of war itself. By putting on the uniform and carrying arms openly, the soldier enters a specific legal relationship with the enemy. This relationship is defined by **reciprocity**: I accept the risk of being killed by you, provided you accept the risk of being killed by me, and provided we both agree not to kill civilians.

  The "switch" of the uniform is not a moral transubstantiation; it is a **signal of epistemic limitation and functional role**. The law presupposes that:
  1.  **Epistemic Constraint:** Ordinary soldiers cannot reliably judge the *jus ad bellum* (the complex geopolitical reasons for the war).
  2.  **Agency Constraint:** Soldiers are instruments of the state, lacking the autonomy to be held fully responsible for the state's decision to wage aggressive war.
  3.  **Humanitarian Necessity:** To minimize suffering, the law must incentivize soldiers to follow *jus in bello* rules (don't kill civilians). If unjust soldiers knew they were already "criminals" liable to be killed simply for fighting, they would have no incentive to follow the rules of war.

  ### 2. Strict Presuppositions vs. Mere Compatibility

  It is crucial to distinguish what the law *requires* to function versus what moral theories can *explain* it.

  **What the Law Strictly Presupposes:**
  *   **The Independence of *Jus in Bello*:** The law strictly presupposes that rules of conduct must be enforceable regardless of the cause. It presupposes that **identifiability** (uniforms) is the only viable proxy for liability in the fog of war.
  *   **Reciprocal Risk:** It presupposes that combat is a symmetrical activity where risk is mutually assumed. If one side claims immunity based on justice, the convention collapses.
  *   **Epistemic Humility:** It presupposes that international tribunals can judge *leaders* (who have access to intelligence and make policy) but cannot judge *soldiers* (who operate under orders and limited information).

  **What the Law Merely Fits With (Compatibility):**
  *   **The Moral Equality of Combatants (MEC):** This is the Traditionalist view (e.g., Michael Walzer). It holds that soldiers on both sides *actually possess* an equal moral right to kill. The law fits this view perfectly, but the law does not *prove* it. The law could function even if MEC were morally false, provided everyone *acted* as if it were true.
  *   **Revisionism + Pragmatism:** This is the view (e.g., Jeff McMahan) that unjust combatants *are* morally liable (they are essentially murderers), but the law grants them **pragmatic immunity**. The law fits this view because it allows for the prosecution of leaders (acknowledging the war was unjust) while shielding soldiers (to preserve the *in bello* regime).

  **The Verdict:** The law does **not** strictly presuppose the Moral Equality of Combatants as a moral truth. It presupposes the **utility of treating combatants as equals**. The fact that the law prosecutes leaders for aggression proves that the law acknowledges the war can be unjust. If the law truly presupposed MEC as a moral absolute, aggression could not be a crime, because there would be no "unjust side" to criminalize. Therefore, the soldier's immunity is a **legal privilege**, not a **moral right**.

  ### 3. The Leader/Soldier Asymmetry

  The prosecution of leaders for aggressive war while immunizing soldiers is the linchpin of this reconstruction. It resolves the tension between *jus ad bellum* and *jus in bello*.

  *   **Leaders:** They possess the *mens rea* (guilty mind) regarding the aggression. They have the capacity to know the war is unjust and the authority to stop it. Therefore, they bear **moral and legal liability for the existence of the threat**.
  *   **Soldiers:** They bear liability only for the **manner** in which they pose a threat. By wearing a uniform, they become a "public threat" rather than a "private criminal."

  This squares with the legal practice by creating a **division of moral labor**. The law assigns responsibility for the *cause* to the political leadership and responsibility for the *conduct* to the military. If soldiers were held liable for the justice of the cause, the division of labor would collapse, and every firefight would require a moral trial before a shot was fired.

  ### 4. The Counterfactual: If Liability Depended on Justice

  If we replaced the presupposed view (Functional Conventionalism) with the Revisionist view (liability depends on the justice of the cause), the legal system would have to undergo radical, likely destructive, changes:

  1.  **Collapse of Combatant Privilege:** The "uniform switch" would cease to function. An unjust soldier would be legally indistinguishable from a common murderer. Captured unjust soldiers would not be Prisoners of War (POWs) entitled to repatriation; they would be detainees subject to criminal prosecution for every enemy combatant they killed.
  2.  **Epistemic Impossibility:** The law would require a mechanism to determine, in real-time, which side is "just." Since *jus ad bellum* is often ambiguous (e.g., preemptive self-defense vs. aggression), soldiers would have to act as judges. This would lead to paralysis or, more likely, every soldier claiming *their* side is just, resulting in total war with no agreed-upon rules.
  3.  **Erosion of *Jus in Bello*:** If unjust soldiers know they are already criminals liable to be killed simply for participating, they lose the incentive to spare civilians. Why follow the rules of war if you are going to be hanged for aggression anyway? The "quid pro quo" that protects civilians (I spare your civilians if you spare mine) relies on the mutual immunity of combatants.
  4.  **Asymmetrical Warfare:** The "just" side would be legally permitted to target unjust combatants without restriction (no requirement for proportionality or necessity in the same way), while the "unjust" side would have no legal right to fight back. This effectively bans the losing side from surrendering, incentivizing them to fight to the death.

  ### Summary

  The implicit theory of the current legal system is **Functional Conventionalism**. It strictly presupposes that **regulatory efficacy requires separating the justice of the war from the liability of the fighter.**

  It is **compatible** with the Moral Equality of Combatants, but it does not **presuppose** it as moral truth. The prosecution of leaders for aggression demonstrates that the law recognizes moral asymmetry at the strategic level but enforces moral symmetry at the tactical level for pragmatic reasons.

  To shift to a system where liability depends on the justice of the cause would require abolishing the concept of "lawful combatancy." It would transform war from a regulated state of conflict into a global law enforcement operation, likely increasing civilian casualties and removing the incentives for unjust combatants to adhere to humanitarian norms. The law sacrifices deep moral accuracy (punishing every unjust killer) to secure a greater moral good (limiting the horrors of war).
