prompt: |-
  Under international humanitarian law, a soldier who kills an enemy soldier in combat hasn't commited a crime, even if he's fighting for the aggressor in a plainly unjust war and even if he volunteered. But if the same soldier deliberately kills a civilian, that's a war crime, even if the civilian's death would have helped his side more than killing the enemy soldier would. So the law treats being in uniform as a kind of switch that makes you killable, and treats the justice of the cause as irrelevant to whether killing you is lawful. What theory of moral liability does this practice presuppose? Does it actually presuppose the moral equality of combatants—that soldiers on both sides have the same permission to kill each other—or is it compatible with the view that unjust combatants do wrong but the law simply declines to punish them for it? And how does that square with the fact that the same legal system will prosecute the leaders who planned the aggressive war while leaving the ordinary soldiers who carried it out alone? I want the implicit theory reconstructed, with a clear statement of what the practice strictly presupposes versus what it merely fits with, and a sense of what would have to change in the law if we replaced that presupposed view with the view that a soldier's liability to be killed depends on wether his side is fighting justly.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** IHL (International Humanitarian Law) distinguishes between combatants (killable) and civilians (protected), regardless of the *jus ad bellum* (justice of the war). It also distinguishes between leaders (prosecutable for aggression) and ordinary soldiers (immune from prosecution for mere participation).
      *   **Key Questions:**
          1.  What theory of moral liability does this practice presuppose?
          2.  Does it presuppose the "Moral Equality of Combatants" (MEC), or is it compatible with the view that unjust combatants do wrong but aren't punished (pragmatic immunity)?
          3.  How does this square with prosecuting leaders for aggression but not soldiers?
          4.  **Task:** Reconstruct the implicit theory.
          5.  **Requirement:** Distinguish between what the practice *strictly presupposes* vs. what it *merely fits with*.
          6.  **Requirement:** Explain what would have to change in the law if we adopted the view that liability depends on the justice of the cause (Revisionist Just War Theory).

  2.  **Initial Brainstorming & Theoretical Landscape:**

      *   *Traditional Just War Theory (Walzerian):* Michael Walzer's *Just and Unjust Wars* is the touchstone. He argues for the "War Convention" which separates *jus ad bellum* (justice of war) from *jus in bello* (justice in war). This leads to the Moral Equality of Combatants (MEC). Soldiers are "dangerous men" engaged in a mutual risk.
      *   *Revisionist Just War Theory (McMahan, Rodin, etc.):* Jeff McMahan argues MEC is false. Liability to attack depends on moral responsibility for unjust threat. Unjust combatants are essentially murderers; just combatants are law enforcement/self-defense.
      *   *Legal Positivism/Pragmatism:* The law isn't necessarily a mirror of deep morality. It's a regulatory framework designed to minimize suffering. It might *bracket* moral truth for functional reasons.
      *   *The "Switch" Metaphor:* The prompt uses the uniform as a "switch." This implies a status-based liability rather than a conduct-based or responsibility-based liability.

  3.  **Analyzing Question 1: What theory of moral liability does this presuppose?**

      *   *Strict Presupposition:* The law *operates as if* status (combatant vs. civilian) determines liability. It does not *strictly* require a deep moral theory, but it functions best under a theory of **Status-Based Liability** coupled with **Epistemic Humility**.
      *   *MEC:* The law *codifies* MEC, but does it *presuppose* it as moral truth? Not necessarily. It could be a pragmatic fiction.
      *   *Distinction:* The prompt asks for the *implicit theory*. The most accurate reconstruction is a **Conventionalist** theory. Liability is created by the convention itself, not pre-existing moral facts.

  4.  **Analyzing Question 2: MEC vs. Pragmatic Immunity?**

      *   *MEC View:* Both sides have equal right to kill.
      *   *Pragmatic View:* Unjust soldiers *are* morally liable, but we pretend they aren't to encourage compliance with *jus in bello* and prevent total war.
      *   *The Leaders vs. Soldiers Distinction:* This is crucial. If soldiers were truly morally equal, why punish leaders for aggression? The fact that leaders *are* punished for *jus ad bellum* violations suggests the law *acknowledges* asymmetry at the top. This implies the soldier's immunity is **functional**, not **ontological**.
      *   *Conclusion:* The law is *compatible* with Revisionism (unjust soldiers do wrong) but *codifies* Traditionalism (MEC) for practical reasons. It doesn't strictly presuppose MEC as moral truth; it presupposes the *utility* of treating soldiers as equals for the sake of regulation.

  5.  **Analyzing Question 3: Leaders vs. Soldiers:**

      *   Leaders have *mens rea* (guilty mind) regarding the overall conflict. Soldiers are seen as instruments or coerced (even if volunteers, the pressure of the state is immense).
      *   This supports the "Pragmatic/Functional" reading over the "Strict Moral Equality" reading. If moral equality were absolute, aggression wouldn't be a crime for anyone. If moral liability were purely revisionist, all unjust soldiers would be war criminals. The middle ground suggests a **division of moral labor**.

  6.  **Drafting the Reconstruction (Iterative Process):**

      *   *Introduction:* Acknowledge the tension between *jus ad bellum* and *jus in bello*.
      *   *The Implicit Theory:* Call it "Conventionalist Status Liability." It's not about deep moral desert, but about functional categorization.
      *   *Strict Presupposition vs. Compatibility:*
          *   *Strict:* The law presupposes that *identifiability* and *reciprocity* are necessary for regulation. It presupposes that soldiers cannot be expected to adjudicate the justice of the war.
          *   *Compatible:* It is compatible with MEC (Walzer) AND compatible with Revisionism + Pragmatism (McMahan + Positivism). It does *not* strictly prove MEC is morally true.
      *   *The Leader/Soldier Split:* This is the smoking gun against strict MEC. It shows the law knows the war can be unjust. Therefore, soldier immunity is a *privilege* granted to secure *in bello* compliance, not a *right* derived from moral equality.
      *   *The Revisionist Shift:* What if we changed the law to match Revisionism (liability depends on justice)?
          *   Combatant status loses meaning.
          *   Every engagement requires a moral trial.
          *   Incentives for *in bello* compliance vanish for the "unjust" side (they are criminals anyway).
          *   Epistemic nightmare (who decides justice?).

  7.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to say the law *is* moral philosophy. It's a legal regime. The prompt asks what theory it *presupposes*.
      *   *Nuance:* The "volunteer" aspect in the prompt is important. Even volunteers get immunity. This strengthens the "Epistemic Humility" argument (soldiers can't know the full diplomatic picture).
      *   *Key Terminology:* Use "Jus ad Bellum" vs. "Jus in Bello," "Moral Equality of Combatants," "Revisionist Just War Theory," "Epistemic Constraint," "Functional Independence."

  8.  **Final Structure:**

      1.  **Introduction:** Define the separation of *ad bellum* and *in bello*.
      2.  **The Implicit Theory:** "Functional Conventionalism." Liability is institutional, not natural.
      3.  **Strict Presuppositions vs. Compatibility:**
          *   Strict: Epistemic limits, need for reciprocity.
          *   Compatible: Both Walzerian MEC and Revisionist+Pragmatism.
      4.  **The Leader/Soldier Asymmetry:** Explain how this undermines strict MEC and supports the Pragmatic view.
      5.  **The Revisionist Counterfactual:** What happens if we change the law to match moral liability based on justice? (Collapse of IHL).

  9.  **Final Polish:** Ensure the tone is analytical and philosophical, addressing the specific constraints of the prompt (strictly presupposes vs. fits with). (Self-check: Did I answer the specific question about the "switch"? Yes, treat it as a conventional marker.)

  *(Self-Correction during drafting)*: I need to make sure I don't just summarize Walzer vs. McMahan. I need to answer what the *law itself* presupposes. The law is a positivist system. It presupposes that *rules work better than moral adjudication in the fog of war*.

  10. **Final Review against Prompt:**
      *   Reconstruct implicit theory? Yes.
      *   Clear statement of strict presupposition vs. compatibility? Yes.
      *   Address Leader vs. Soldier prosecution? Yes.
      *   Address changes required if liability depended on justice? Yes.

