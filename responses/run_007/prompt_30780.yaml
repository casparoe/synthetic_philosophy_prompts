answer: |-
  Dear Friend,

  It is great to hear that you have found a stable position on verisimilitude, because frankly, the intuition that some false theories are closer to the truth than others is so robust that abandoning it feels like admitting defeat against skepticism. You are right that Popper's original definition was too brittle, collapsing under the Miller and Tichý proofs which showed that under his logical content account, no false theory could be closer to the truth than another. Treating that as a bug in the specific definition rather than the concept itself is the standard move for the similarity approach, championed by people like Ilkka Niiniluoto and Graham Oddie. However, since you asked for a serious map of the terrain that should worry you, I am going to lay out the objections in order of severity, starting with the ones that threaten to collapse the whole project and moving down to the technical headaches that merely require careful management.

  The most serious challenge, the one that should make you consider giving up the view if it cannot be satisfactorily answered, is the language dependence or translation argument. You mentioned you think this worry is overblown, but I suspect you might be underestimating the formal force of it. The problem, originally sharpened by David Miller, is that if truthlikeness is an objective feature of theories, the ranking of theories should not flip simply because we describe the world using different but logically equivalent predicates. Miller showed using weather examples that if you define your states of nature using hot, rainy, and windy, one false theory might come out closer to the truth than another. However, if you translate those predicates into logically equivalent but gerrymandered ones, like minnesotan and arizonan, the ordering can reverse. If the distance to the truth depends on the language we use to describe the possibilities, then truthlikeness is not an objective relation between theory and world, but a relation between theory, world, and linguistic framework. Defenders of the similarity approach usually concede this is a major problem but bite the bullet by arguing that not all languages are equal. They claim there is a privileged set of natural properties or constituents that carve nature at its joints, and the metric must be applied to those rather than arbitrary logical constructions. The cost of this move is that you are no longer doing pure logic or semantics; you are smuggling in a robust metaphysical realism about natural kinds to save the semantic notion. If you are not willing to defend a theory of natural properties independently, this objection remains a dealbreaker because it suggests the ordering is not intrinsic to the theories themselves.

  Closely related to the language problem, and the one you identified as your biggest worry, is the arbitrariness of the similarity metric. Even if we agree on the right language and the right constituents, we need a way to weight errors. Is being wrong about the mass of an electron closer to the truth than being wrong about its charge? Is a theory that gets all the laws right but the constants wrong closer than one that gets the constants right but the laws wrong? The similarity approach requires a metric space over the constituents, but there is no formal principle within the logic itself that tells us how to measure the distance between possibilities. Defenders typically concede that there is no unique, context-independent metric. They argue that the weighting of attributes depends on the specific scientific context or the causal importance of the properties in question. While this saves the view from formal inconsistency, it comes at a high philosophical price. It suggests that truthlikeness is not a purely semantic or epistemic virtue but is entangled with pragmatic values about what matters to us. If the metric is determined by what we care about, then truthlikeness risks losing its normative force as a guide to objective truth. A committed defender will admit this is a significant cost but will argue it is better than abandoning the intuition that progress is real. They will say that science itself determines the metric through its practice, but you must accept that this makes the account less formal and more dependent on external metaphysical or pragmatic assumptions.

  Moving down the scale of severity, there is the question of whether truthlikeness actually earns its keep in the scientific realism debate. The main motivation for reviving truthlikeness was to save realism from the pessimistic meta-induction, allowing realists to say that past theories were false but still close to the truth. However, critics argue that if we cannot measure truthlikeness independently of empirical success, the concept is explanatorily idle. If the only reason we think theory B is closer to the truth than theory A is that B is more empirically successful, then truthlikeness is just a redescription of empirical adequacy rather than an explanation of it. To avoid circularity, you need a way to estimate truthlikeness that does not simply reduce to predictive success. Defenders concede this is difficult but argue that theoretical virtues like coherence, unification, and explanatory depth provide independent evidence for truthlikeness. However, if these virtues are themselves contested, the utility of truthlikeness in saving realism is weakened. This is not a fatal blow, but it does mean you cannot simply posit truthlikeness as a magic bullet against the pessimistic meta-induction without doing heavy lifting to show how we access it.

  Another technical but significant issue is the problem of idealizations and approximations. The similarity approach works best when theories are modeled as sets of possible worlds or conjunctions of literals in a logical language. However, much of actual science involves idealizations that are strictly false in a way that does not fit neatly into a constituent analysis. A theory positing a frictionless plane is not just slightly wrong about friction; it posits an entity that does not exist. Similarly, theories involving limits or infinite populations are not easily mapped onto a finite space of possibilities. If the similarity metric cannot handle these structural idealizations, its scope is limited to a certain kind of propositional theory that may not represent the most important cases of scientific progress. Defenders usually wave this off as a technical challenge to be solved by expanding the formalism, perhaps using structuralist accounts rather than simple propositional ones. This is likely a technical annoyance you can live with, provided you believe the formalism can be extended, but it does highlight that the current models are somewhat idealized themselves.

  Finally, I need to address your question about whether you have insulated the position so much that nothing could count against it. This is a meta-philosophical worry that hovers over the previous points. If every counter-example regarding language dependence is met with the claim that the wrong language was used, and every counter-example regarding metric weighting is met with the claim that the wrong metric was applied, the view risks becoming unfalsifiable. A concept that is objectively real but whose metrics and language are always adjustable to fit our intuitions about progress looks suspiciously like a rationalization of our current preferences rather than a discovery about the world. A committed defender will argue that the constraints on natural language and physical metrics are tight enough to prevent total arbitrariness, but you must be honest that this relies on a faith in the stability of scientific categories. If you treat the view as immune to empirical or formal refutation by always retreating to the claim that we haven't found the right natural kinds yet, you are indeed insulating it. This is a problem because it moves the view from a substantive philosophical thesis to a regulative ideal. To avoid this, you need to be willing to specify conditions under which the view would be false, such as admitting that if no stable natural kind ontology can be defended, then truthlikeness collapses.

  In sum, the translation argument is the sword of Damocles that threatens to cut the head off the project if you cannot defend a privileged language. The metric arbitrariness is a heavy theoretical cost that concedes pragmatism plays a role in what counts as close to truth. The explanatory utility and idealization problems are significant hurdles but likely surmountable with further work. The insulation worry is a constant vigilance requirement to ensure the concept remains meaningful. Defenders of the similarity approach concede all of these to varying degrees, usually arguing that the alternative is an unacceptable skepticism about scientific progress. They bite the bullet on the need for natural kinds and context-dependent metrics because the intuition of progress is too strong to abandon. Whether that is a virtuous preservation of a core insight or a dogmatic protection of a metaphysical posit depends on how much weight you place on formal purity versus scientific practice. I hope this helps you stress-test your conviction, because the view is viable, but only if you are willing to carry the baggage that comes with it.

  Best regards,

  Your Philosophical Correspondent
