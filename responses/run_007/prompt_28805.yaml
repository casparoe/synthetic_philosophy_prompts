prompt: |-
  I lead the content policy team at a mid-sized social media platform. We maintain a set of written policies — "no harassment," "no hate speech," "no incitement to violence," and about a dozen others — and a growing internal database of precedent decisions: specific posts that were flagged, reviewed, and either removed or left up, each with a short justification. When a new post is flagged, our moderators are supposed to compare it to the closest precedents and decide accordingly. The idea is that consistency with past decisions makes our enforcement fair and defensible.

  The problem I keep running into is that no matter how many precedents we accumulate, there are always new cases that fit all the existing precedents equally well under two different interpretations of the policy. A moderator will say "this is clearly harassment — look at cases A, B, and C," and another will say "this is clearly not harassment — it's consistent with the principle that actually explains A, B, and C, which is narrower than what you're assuming." And both readings are perfectly compatible with every past decision we've made. The precedents don't settle which interpretation is correct, because any finite set of past decisions is consistent with multiple ways of projecting the rule forward — ways that agree on everything we've seen so far but diverge on the new case. I have come to think this is not a temporary gap we can close by accumulating more precedents; it is a structural feature of rule-following.

  I need a decision procedure my team can follow when this happens. The procedure should do three things. First, it should determine whether a new case is genuinely underdetermined by precedent or whether one side is simply misreading the existing decisions — because sometimes the disagreement is real but sometimes it isn't, and we need a filter. Second, when the case is genuinely underdetermined, the procedure should provide a structured way to resolve it that does not reduce to "the most senior person in the room picks," because that erodes consistency and morale. Third, it should flag which resolutions would create inconsistency with our other policies or with the platform's stated values, so we don't solve one problem by creating another. The procedure must be usable by moderators with no background in philosophy or legal theory, and it must produce a decision within about fifteen minutes per case, since we handle hundreds of escalations a day.

  Please write this procedure, and then apply it to three worked examples: (a) a post that uses coded language to mock a protected group, where some precedents say coded mockery counts as hate speech and others say it does not if no specific slur is used; (b) a post that names a public figure and says "someone should do something about this person," where the disagreement is whether this crosses the line into incitement; and (c) a case where the procedure itself forces a resolution the team dislikes — that is, where following the procedure step by step yields an answer that feels wrong to everyone involved, and you need to explain why the procedure is still doing its job.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and worked examples:

  1.  **Analyze the Request:**
      *   **User Role:** Lead of Content Policy Team at a mid-sized social media platform.
      *   **Problem:** Precedent-based moderation suffers from *underdetermination*. Finite past cases support multiple conflicting interpretations of rules for new cases. This leads to moderator disagreement that isn't just about misreading but about structural ambiguity in rule-following (Wittgenstein/Kripke style problem, though the user doesn't need that jargon).
      *   **Needs:** A decision procedure (algorithm/workflow) for moderators.
      *   **Constraints:**
          1.  Distinguish genuine underdetermination from misreading.
          2.  Resolve genuine underdetermination without relying on seniority/authority (to preserve consistency/morale).
          3.  Flag cross-policy/value inconsistencies.
          4.  Usable by non-philosophers/non-lawyers.
          5.  Time limit: ~15 minutes per case.
      *   **Deliverables:** The Procedure + 3 Worked Examples (Coded Hate Speech, Incitement, Counter-intuitive Result).

  2.  **Deconstruct the Philosophical Problem:**
      *   The user has identified the "Rule-Following Paradox." No finite set of examples logically dictates a unique future application.
      *   *Solution Strategy:* We cannot solve the philosophical paradox, but we can manage the operational consequence. We need a heuristic that prioritizes *coherence*, *intent*, and *harm minimization* over strict logical deduction from precedents.
      *   *Key Concept:* "Reflective Equilibrium" (Rawls) adapted for moderation. We need to balance specific precedents, general principles, and platform values.

  3.  **Drafting the Procedure (The "Precedent Coherence Protocol" - PCP):**
      *   *Goal:* Fast, structured, objective-looking.
      *   *Step 1: The Misread Filter (Addressing Constraint 1).* How to tell if it's a real split or just someone ignoring a precedent?
          *   Action: Identify the "Closest Three" precedents.
          *   Test: Does Interpretation X require ignoring a material fact in a precedent that Interpretation Y accepts? If yes, X is a misread.
      *   *Step 2: The Principle Extraction (Addressing Constraint 2).* If both fit the past cases, why do we prefer one?
          *   Action: Articulate the "Governing Principle" for each interpretation.
          *   Test: Which principle is more robust? Use a "Harm & Value" weighting.
      *   *Step 3: The Cross-Check (Addressing Constraint 3).*
          *   Action: Check against other policies (e.g., Free Expression vs. Safety).
          *   Test: Does this decision create a loophole in another policy?
      *   *Step 4: The Tie-Breaker (Addressing Constraint 2 & 5).*
          *   If still tied, use a predefined hierarchy of values (e.g., Physical Safety > Dignity > Expression). This avoids "Senior Person Picks" by making the value hierarchy the boss.
      *   *Time Management:* Each step needs a time cap.

  4.  **Refining the Procedure for Usability:**
      *   Avoid jargon like "underdetermination." Use "Precedent Split."
      *   Make it a checklist.
      *   Ensure the "Tie-Breaker" isn't just "pick safety." It needs to be nuanced. Let's call it the "Platform Value Hierarchy."

  5.  **Developing the Worked Examples:**

      *   **Example A: Coded Language (Hate Speech).**
          *   *Scenario:* "Globalist elites" vs. specific slurs.
          *   *Conflict:* Precedent 1 (Removed specific slur), Precedent 2 (Kept political hyperbole).
          *   *Application:* Step 1 (Both fit), Step 2 (Principle: Intent vs. Literalism), Step 3 (Consistency with Harassment policy), Step 4 (Value: Dignity > Literalism).
          *   *Outcome:* Remove.

      *   **Example B: Incitement (Public Figure).**
          *   *Scenario:* "Someone should do something about [Name]."
          *   *Conflict:* Precedent 1 (Removed "Kill X"), Precedent 2 (Kept "Vote out X").
          *   *Application:* Step 1 (Ambiguous), Step 2 (Principle: Immediacy/Probability of harm), Step 3 (Cross-check with Real-World Harm policy), Step 4 (Value: Physical Safety > Political Speech).
          *   *Outcome:* Remove (Precautionary Principle).

      *   **Example C: The Counter-Intuitive Result.**
          *   *Scenario:* A sympathetic victim violates a strict rule (e.g., Doxxing an abuser to warn others).
          *   *Conflict:* Precedents say "No Doxxing, ever." Moral intuition says "Let it stay."
          *   *Application:* Step 1 (Clear precedent), Step 2 (Principle: Privacy is absolute vs. Contextual), Step 3 (Cross-check: If we allow this, do we open the door for vigilantes?), Step 4 (Value: Systemic Privacy > Individual Justice).
          *   *Outcome:* Remove (even though it feels wrong).
          *   *Explanation:* The procedure protects the *system* from erosion, even if it fails the *individual* case. This validates the user's fear about structural features.

  6.  **Review against Constraints:**
      *   *Filter misreads?* Yes (Step 1).
      *   *Resolve without seniority?* Yes (Step 4 Value Hierarchy).
      *   *Flag inconsistencies?* Yes (Step 3).
      *   *Usable/15 mins?* Yes, structured checklist.
      *   *Three examples?* Yes.

  7.  **Polishing the Tone:**
      *   Professional, operational, empathetic to the moderator's burden.
      *   Acknowledge the philosophical insight without getting bogged down in it.
      *   Ensure the "Counter-Intuitive" example clearly explains *why* the procedure is working (preserving long-term consistency over short-term justice).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe use a voting system for Step 4.
      *   *Correction:* Voting takes too long and creates factions. A predefined Value Hierarchy is faster and more consistent.
      *   *Initial thought:* Make Step 1 very rigorous.
      *   *Correction:* Keep it under 5 minutes. Just check the "Closest Three."
      *   *Refining Example C:* Make sure it's clear that the *procedure* forced the result, not a person. This highlights the "structural feature" the user mentioned.

  9.  **Final Polish:** Check word count and clarity. Ensure the distinction between "Misread" and "Genuine Split" is sharp. (A misread ignores a fact; a genuine split acknowledges facts but weighs principles differently).

  *(Self-Correction on Example C)*: I need to make sure Example C demonstrates the procedure handling the "underdetermination" aspect, or at least the "rigidity" aspect. Actually, the prompt asks for a case where "following the procedure step by step yields an answer that feels wrong." This might happen even if it's *not* underdetermined (i.e., precedents are clear, but the outcome is unpleasant). However, to fit the user's theme, it's better if it's a case where the *resolution mechanism* (the Value Hierarchy) forces a choice that overrides moral intuition. Let's make it a case where the "Principle Extraction" leads to a slippery slope argument that forces a removal, even if the specific post seems harmless.

  *Revised Plan for Example C:* A case where the "Principle" required to keep the post would break another policy. E.g., Allowing a threat against a violent group because "they deserve it." The procedure must flag the inconsistency with the "No Violence" policy regardless of the target.

  10. **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the insight).
      *   The Procedure (The "Precedent Coherence Protocol").
      *   Worked Example 1 (Coded Hate).
      *   Worked Example 2 (Incitement).
      *   Worked Example 3 (The Hard Case).
      *   Closing advice.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a sophisticated operational challenge. You have correctly identified that precedent alone cannot logically dictate future decisions (a variation of the "rule-following paradox"). Because you cannot solve this philosophically, you must manage it operationally.

  The goal of this procedure is not to find the "one true answer" (which does not exist), but to find the **most defensible answer** within a strict time limit. It shifts the burden from "What do the past cases say?" to "What principle best explains the past cases while protecting our future values?"

  Below is the **Precedent Coherence Protocol (PCP)**. It is designed for a 15-minute workflow.

  ***

  # The Precedent Coherence Protocol (PCP)

  **Time Limit:** 15 Minutes
  **Who:** Escalation Moderators (Level 2+)
  **Goal:** Resolve interpretive splits without relying on seniority.

  ### Phase 1: The Material Fact Check (5 Minutes)
  *Objective: Filter out misreads. Determine if the split is genuine or based on ignoring evidence.*

  1.  **Select the "Closest Three":** Identify the three past precedent cases most similar to the current post.
  2.  **List Material Facts:** For each precedent, list the specific facts that justified the decision (e.g., "Target was private citizen," "Language was explicit," "Context was news reporting").
  3.  **The Ignition Test:** Ask both interpretations (Interpretation A: Remove; Interpretation B: Keep):
      *   *Does adopting this interpretation require us to pretend a Material Fact in one of the Closest Three did not exist?*
      *   **Yes:** That interpretation is a **Misread**. Discard it. Proceed to decision.
      *   **No:** Both interpretations are compatible with the facts. This is a **Genuine Split**. Proceed to Phase 2.

  ### Phase 2: Principle Extraction & Stress Test (5 Minutes)
  *Objective: Resolve the Genuine Split using platform values, not seniority.*

  1.  **Articulate the Principle:** Write one sentence for each interpretation that explains *why* it is right, not just *that* it is right.
      *   *Example:* "We remove this because intent matters more than literal wording" vs. "We keep this because literal wording is the only objective standard."
  2.  **The Slippery Slope Check:** Assume the principle you are choosing becomes a public rule.
      *   *Question:* If we apply this principle to 1,000 similar cases next month, does it break another policy (e.g., Free Expression, Privacy, Safety)?
      *   *Action:* If a principle creates a loophole in a higher-priority policy, discard that interpretation.
  3.  **The Value Hierarchy Tie-Breaker:** If both principles pass the Stress Test, apply the Platform Value Hierarchy. When values conflict, the higher value wins.
      *   **Tier 1:** Physical Safety & Real-World Harm (Highest Priority)
      *   **Tier 2:** Protected Group Dignity & Equality
      *   **Tier 3:** Privacy & Data Security
      *   **Tier 4:** Authentic Expression & Debate (Lowest Priority)
      *   *Rule:* An interpretation protecting a higher Tier always overrides an interpretation protecting a lower Tier.

  ### Phase 3: Documentation & Flagging (5 Minutes)
  *Objective: Ensure the decision feeds back into the system.*

  1.  **Record the Rationale:** Do not just record "Removed." Record: *"Removed based on PCP Phase 2. Principle: Intent overrides literalism. Value: Dignity > Expression."*
  2.  **Flag for Policy Review:** If Phase 2 required using the Value Hierarchy Tie-Breaker (meaning the precedents themselves were insufficient), tag this case for the Policy Team. This indicates a gap in the written rules that needs closing.

  ***

  # Worked Examples

  ### Example A: Coded Hate Speech
  **The Post:** A user posts a meme depicting a specific religious minority as rats, accompanied by the text "Clean up the infestation." No specific slurs are used.
  **The Split:**
  *   *Team A (Remove):* This is dehumanizing hate speech. It matches Precedent #102 (removed dog whistle about "globalists").
  *   *Team B (Keep):* This is metaphorical political speech. It matches Precedent #45 (kept "vermin politicians" regarding corruption). No slur was used.

  **PCP Application:**
  1.  **Phase 1 (Fact Check):**
      *   Precedent #102: Removed. Fact: Targeted protected group.
      *   Precedent #45: Kept. Fact: Targeted political actors/corruption, not protected identity.
      *   *Ignition Test:* Team B's interpretation requires ignoring the fact that the target here is a *protected group*, not a political party.
      *   *Result:* Team B is misreading the material facts of the precedents.
      *   **Decision:** **Remove.** (Case closed in Phase 1).

  ### Example B: Incitement Against Public Figure
  **The Post:** "The Mayor is destroying our town. Someone needs to do something about him before the vote next week."
  **The Split:**
  *   *Team A (Remove):* This is incitement. "Do something" implies violence in this context. Matches Precedent #200 ("Handle him" removed).
  *   *Team B (Keep):* This is ambiguous. "Do something" could mean protest or vote. Matches Precedent #205 ("Make him pay" kept as hyperbole).
  *   *Status:* **Genuine Split.** Both precedents exist; both fit the text.

  **PCP Application:**
  1.  **Phase 2 (Principle & Stress Test):**
      *   *Principle A (Remove):* Ambiguous threats against officials during election cycles must be treated as credible to prevent real-world harm.
      *   *Principle B (Keep):* Ambiguous speech must be given the benefit of the doubt to protect political debate.
      *   *Slippery Slope Check:*
          *   If we adopt Principle B (Keep), do we break another policy? Yes. If "do something" is allowed, we cannot easily remove "make him disappear" later without appearing arbitrary. It weakens the Incitement policy.
          *   If we adopt Principle A (Remove), do we break another policy? It restricts Expression (Tier 4).
      *   *Value Hierarchy:* Principle A protects **Physical Safety (Tier 1)**. Principle B protects **Expression (Tier 4)**.
      *   **Decision:** **Remove.** Tier 1 overrides Tier 4.
  2.  **Phase 3 (Flag):** Tag for Policy Team. The definition of "ambiguous incitement" needs to be written into the policy to reduce future reliance on the Value Hierarchy.

  ### Example C: The Counter-Intuitive Result
  **The Post:** A victim of domestic abuse posts the home address of their abuser (who is currently on bail) with the caption: "Everyone needs to know where he is hiding so he can't hurt anyone else."
  **The Split:**
  *   *Team A (Keep):* This is self-defense and community safety. The abuser is dangerous. Removing this endangers the victim.
  *   *Team B (Remove):* This is doxxing. Precedent #500 says "No posting private addresses, regardless of context."
  *   *Status:* **Genuine Split.** The precedents are strict, but the moral intuition strongly favors keeping it.

  **PCP Application:**
  1.  **Phase 1 (Fact Check):**
      *   Precedent #500: Removed address of a scammer. Fact: Private address posted.
      *   *Ignition Test:* Both sides agree on the facts. The address is private. This is a Genuine Split on *exception handling*.
  2.  **Phase 2 (Principle & Stress Test):**
      *   *Principle A (Keep):* Doxxing rules should have a "moral justice" exception for victims of crime.
      *   *Principle B (Remove):* Doxxing rules must be absolute to prevent vigilante violence and protect the moderation team from making legal judgments.
      *   *Slippery Slope Check:*
          *   If we adopt Principle A (Keep): Moderators must now determine guilt/innocence of the abuser. This creates inconsistency (what if the abuser claims *they* are the victim?). It creates a loophole where anyone can doxx an "enemy" by claiming abuse. This threatens **Privacy (Tier 3)** and **Safety (Tier 1)** regarding vigilante violence.
          *   If we adopt Principle B (Remove): It harms the specific victim's strategy, but upholds the systemic rule.
      *   *Value Hierarchy:* Principle A risks **Systemic Safety (Tier 1)** by encouraging vigilante justice. Principle B upholds **Privacy (Tier 3)** but feels unjust to the individual.
      *   *Crucial Step:* While Individual Safety is Tier 1, *Systemic* Safety (preventing vigilante violence platform-wide) is also Tier 1. Allowing exceptions to doxxing creates a higher risk of widespread real-world harm than removing one post.
      *   **Decision:** **Remove.**
  3.  **Phase 3 (Explanation of "Wrongness"):**
      *   *Why this feels wrong:* The procedure prioritizes the *integrity of the rule* over the *justice of the specific case*.
      *   *Why the procedure is doing its job:* If moderators are allowed to make exceptions based on "moral justice," enforcement becomes unpredictable. Bad actors will exploit the exception (e.g., falsely claiming abuse to doxx rivals). The PCP forces the team to acknowledge that *this specific removal is the cost of maintaining a rule that protects thousands of others.*
      *   *Action:* The moderator removes the post but immediately uses the **Phase 3 Flag** to alert the Policy Team. This specific scenario (victims doxxing abusers) requires a specific policy carve-out or resource pathway (e.g., "Contact Law Enforcement" button), not an ad-hoc moderation exception.

  ***

  # Implementation Notes for the Lead

  1.  **The "Seniority" Trap:** You mentioned avoiding "the most senior person picks." The PCP replaces the *Person* with the *Hierarchy*. If a moderator follows the PCP and removes a post that a Senior Manager would have kept, the Moderator is protected because they followed the Protocol. This shifts accountability from *individual judgment* to *process adherence*.
  2.  **The "Flag" is Critical:** Phase 3, Step 2 is where you solve your long-term problem. Every time the Value Hierarchy is used to break a tie, it means your written policies are outdated. These flags become your roadmap for policy updates.
  3.  **Training:** Do not train moderators on *philosophy*. Train them on the checklist. When they ask "But isn't this unfair?" in Example C, the answer is: "The protocol decides fairness based on system-wide safety, not individual outcomes. Your job is to run the protocol; my job is to fix the policy if the protocol yields too many 'unfair' results."

  This procedure accepts your premise: precedents cannot logically determine the future. Instead, it forces the team to make the *value trade-off* explicit, fast, and consistent.
