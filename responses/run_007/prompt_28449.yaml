answer: |-
  Based on the five verdicts you provided, your friend is not operating on a standard "Separate Art from Artist" rule, nor is she judging based on the severity of the crime. Instead, she is applying a principle of **Thematic Integrity** (or **Aesthetic Hypocrisy**).

  ### The Rule: Does the Sin Contradict the Claim?

  Her verdicts consistently hinge on whether the artist's misconduct directly undermines the specific truth-claim, moral premise, or emotional promise of the artwork itself.

  *   **When she separates (Painter, Abstract Artist, Director):** The artwork makes no claim that the artist's behavior contradicts.
      *   *Landscapes* do not claim the painter is a good husband.
      *   *Abstract forms* do not claim the painter is not a racist.
      *   *Movies* (in her view) do not claim the director was kind on set, especially since film is collaborative.
      *   **The Art remains valid because the Lie is external to the Work.**

  *   **When she does not separate (Novelist, Singer):** The artwork explicitly promises a virtue that the artist violated.
      *   *Books on Integrity* written by a fraud feel "hollow" because the text claims moral authority the author lacks.
      *   *Confessional Songs* written by a manipulator feel like a "con" because the persona promises emotional honesty the singer lacks.
      *   **The Art is invalidated because the Lie is internal to the Work.**

  ### Prediction: The Nature Poet

  **Verdict:** She will likely **separate the art from the artist**, but she will feel more uncomfortable about it than in the Painter case.

  **Reasoning:**
  You specified that the poems are "not preachy environmental stuff" but rather "close observation." Under her rule, a descriptive observation is fact-based, not moral-based.
  *   If the poem says, *"The heron stands still in the water,"* that statement remains true even if the poet poisoned the water. The *observation* was accurate when made.
  *   Unlike the Novelist (who wrote about *Justice*) or the Singer (who sang about *Honesty*), the Poet is not making a moral claim about *Stewardship*. He is making an aesthetic claim about *Beauty/Precision*.
  *   Therefore, the pollution is a sin against the world, but not necessarily a lie against the text. It fits the **Painter** model (Subject matter $\neq$ Moral behavior) more than the **Novelist** model (Subject matter $=$ Moral behavior).

  **However,** this is the weakest link in her logic. The fact that he *destroyed the subject matter* introduces a new variable: **Complicity.** If she feels that appreciating the poem makes her complicit in the destruction of the wildlife described, she might flip to "Do Not Separate."

  ### The Tie-Breaker Case

  To know for sure, you need to test whether she cares about **Harm to the Subject** or only **Contradiction of the Theme.**

  **The Case to Propose:**
  > "Consider a poet who writes tender, intimate, celebrated love poems dedicated to his wife. It comes out that he was physically abusing that same wife while writing them."

  **Why this forces the issue:**
  This case isolates the variable of **Subject-Relevance**.
  *   **Like the Painter:** It involves domestic abuse (which she previously separated).
  *   **Like the Poet:** The victim of the sin is the *subject* of the art.
  *   **Like the Singer:** The art promises intimacy/love, which the behavior violates.

  **How to interpret her answer:**
  *   **If she says "The poems are ruined":** Then she will likely reject the Nature Poet too. It proves that harming the specific subject of the art invalidates the work, regardless of whether the text is "preachy."
  *   **If she says "The poems stand":** Then she will definitely accept the Nature Poet. It proves that only *textual hypocrisy* matters to her (i.e., lying about integrity), and physical harm to the subject is irrelevant to the aesthetic value.

  This case strips away the environmental politics and tests the core of her "Thematic Integrity" rule: **Does the blood on the artist's hands matter if the ink on the page is clean?**
