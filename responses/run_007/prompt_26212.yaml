      *   *Section 4:* Need ~2 paragraphs. Revision vs. Drop.

      *Refining Section 3 (The Big Tension):* The conflict between (4) and (5) is the "Kolodny Critique". If rationality is reasons-responsiveness, then means-end coherence is only required if there is a reason to be coherent. If (5) says the requirement exists *regardless* of reasons, (4) is false. This is a hard contradiction.
      *Refining Section 3 (The Objectivism Tension):* If reasons are facts (1) and ought is objective (3), then rationality (4) requires accessing facts. But we often can't. This leads to the conclusion that most agents are irrational most of the time. It's consistent but implausible (the "ought implies can" pressure).

      *Refining Section 4:*
      *   *Revision:* Soften (4). Allow rationality to have two components: substantive (reasons) and structural (coherence).
      *   *Drop:* Drop (5). It's the easiest to jettison to save the "Reasons-First" brand.

      *Check Paragraph Counts:*
