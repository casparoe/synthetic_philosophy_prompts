  Anscombe relies on a distinction between *intention* and *foresight*. Choosing death as a "means" implies the killing is part of your successful plan. If the innocents survive, your plan fails. In Truman's case, civilian death was the mechanism to force surrender; thus, it was intended murder.

  Conversely, you can foresee death without intending it. Even if death is statistically certain, the distinction remains: is the death *doing the work*? If you bomb a military target, civilians might die. Their death does not help your goal; it is a tragic side effect. You do not choose their death as a tool. This answers your confusion: "knowing" an outcome will occur is not the same as "choosing" it as your method. You can regret the foreseen outcome while still acting.

  However, Anscombe adds a critical constraint: foresight carries moral responsibility. "Unscrupulousness in considering the possibilities" means failing to take serious care to avoid these side effects. If you know innocents will die and proceed without attempting to minimize harm or weighing the proportionality, your recklessness makes you culpable. You didn't intend the death, but your indifference to known lethal consequences violates the duty to protect life, transforming the act into murder through negligence.

  The cases come apart based on whether the death is instrumental to the goal (means) or merely consequential (side effect). Yet, the second case only remains non-murderous if you scrupulously minimize the risk. If you ignore the risk, your lack of care equates to malice. Truman's action was murder primarily because the deaths were the means, but Anscombe notes that even legitimate actions become murder if performed with unscrupulous disregard for foreseeable innocent death.
