      *   *(b) Equivocation on 'Irrational':* This is a strong semantic point. "Not representable by EUT" $\neq$ "Foolish." The normative force comes from linking representation to pragmatic loss. *Verdict:* Plausible, but the Dutch Book argument *tries* to bridge this gap via pragmatic loss.
      *   *(c) Reject Premise (3):* Pragmatic incoherence isn't the *sole* mark of rationality. Or, pragmatic incoherence isn't always irrational (e.g., if the cost of calculation is high). This opens the door for alternative norms (e.g., risk-weighted utility, imprecise probabilities). *Verdict:* Very strong candidate. This is where most modern critiques land.
