answer: |-
  You have independently rediscovered one of the most famous problems in the philosophy of causation, often called **the Problem of Abundant Omissions** (or sometimes the "Problem of Negative Causation"). Philosophers like Hart & Honoré, David Lewis, and more recently Joseph Halpern have wrestled with exactly this set of claims.

  Your intuition is correct: **These claims do not currently hang together.** Specifically, your normative condition (2) fights with your metaphysical test (3) and your symmetry claim (5).

  Here is the breakdown of the tensions, ranked by severity, followed by the "cheapest fix" that preserves most of your intuitions while making the system coherent.

  ---

  ### The Tensions (Ranked by Severity)

  #### 1. The "Abundance" Conflict: (2) vs. (3) [Severity: Critical]
  This is the fatal flaw in the current set.
  *   **Claim (3)** says the test is purely counterfactual: *If I had watered it, would it have died?*
  *   **Claim (2)** says the cause depends on a norm: *Only because I promised.*
  *   **The Conflict:** The counterfactual truth value does not change based on your promise.
      *   *Scenario:* You promised to water the plant. The President did not.
      *   *Counterfactual (You):* If you had watered it, it would live. (True)
      *   *Counterfactual (President):* If the President had watered it, it would live. (Also True)
      *   If (3) is the *only* test, then **both you and the President caused the plant to die.**
      *   But (2) says only *you* caused it.
      *   **Result:** You cannot hold both that the counterfactual test is sufficient *and* that norms determine causation. One must give.

  #### 2. The Symmetry Conflict: (2) vs. (5) [Severity: High]
  *   **Claim (5)** says omissions and actions are symmetric (same kind of causation).
  *   **Claim (2)** says omissions require a norm/duty to be causal.
  *   **The Conflict:** Do actions require a norm to be causal?
      *   If I shoot a plant, it dies. I don't need a "duty to shoot" for my action to be the physical cause of death.
      *   If omissions require a duty (2) but actions do not, then they are **not symmetric** (5).
      *   **Result:** If you keep (2), you must sacrifice (5). Omission causation is pragmatically different from action causation.

  #### 3. The Debugging Conflict: (3) vs. (4) [Severity: Medium]
  *   **Claim (3)** says counterfactuals decide causation.
  *   **Claim (4)** distinguishes between a missing null check (cause) and missing input validation (not cause).
  *   **The Conflict:** Counterfactually, *both* are causes.
      *   If you had written the null check, no crash.
      *   If you had written the input validation, no crash.
      *   Why does one feel like a "bug" (causal) and the other like a "missing feature" (non-causal)?
      *   **Result:** Pure counterfactuals (3) cannot explain your intuition in (4). You need a way to filter which counterfactuals "count."

  ---

  ### The Cheapest Fix: "Normalized Counterfactuals"

  You don't need to abandon your core intuitions. You just need to upgrade your definition of the **Counterfactual Test (3)**.

  In standard philosophy (specifically the work of **Halpern and Pearl** on actual causality), the fix is to acknowledge that counterfactuals are evaluated against a **model of normality**.

  **The Fix:** Modify Claim (3).
  *   **Old (3):** An omission is a cause if the outcome would not have happened had the action been performed.
  *   **New (3):** An omission is a cause if the outcome would not have happened had the action been performed, **and that action was part of the expected/normal course of events.**

  #### How this resolves the tensions:

  1.  **Resolves (2) vs. (3):** The "norm/duty" in (2) isn't a magical force that creates causation; it is what establishes **normality**.
      *   *Plant:* Because you promised, watering is "normal." Your not watering is a "deviation." Deviations are causes.
      *   *President:* He made no promise. Him not watering is "normal." Normal non-events are not causes.
      *   *Result:* The counterfactual test still runs, but it only runs on "abnormal" omissions.

  2.  **Resolves (4) (The Code Example):** This maps perfectly to Software Engineering.
      *   *Missing Null Check:* In most languages/teams, handling nulls is a **default expectation** (a norm). Omitting it is a deviation from the "normal" safe code model. -> **Cause.**
      *   *Missing Input Validation:* If the spec didn't require it, or if handling *all* malformed input is considered out-of-scope (not "normal"), then omitting it is not a deviation. -> **Not a Cause (it's a feature request).**
      *   *Result:* This explains why some missing lines are bugs and others are just technical debt.

  3.  **Resolves (5) (Symmetry):** You have to slightly soften (5).
      *   Actions are usually "abnormal" interventions (we notice things that happen).
      *   Omissions are "normal" background states unless a norm makes them abnormal.
      *   *Adjustment:* Causation is symmetric in *structure* (counterfactual dependence), but asymmetric in *detection* (we detect deviations from norms).

  ---

  ### The "Software Engineer" Translation

  If you want to operationalize this for your work without getting bogged down in metaphysics, here is the coherent model:

  1.  **Causation is Contrastive:** We don't ask "Did X cause Y?" We ask "Did X *rather than X'* cause Y *rather than Y'*?"
      *   *Plant:* Did *your not watering* (rather than your watering) cause death? Yes.
      *   *Plant:* Did *the President's not watering* (rather than his watering) cause death? No, because his not watering is the default state.
  2.  **The "Spec" is the Norm:** In code, the "norm" is the Spec, the Type System, or Team Conventions.
      *   If the code violates the Spec/Convention -> It's a **Bug** (Causal Omission).
      *   If the code works but lacks extra safety not in Spec -> It's a **Risk** (Non-Causal Omission).
  3.  **Blame vs. Cause:**
      *   Keep (1): Omissions are real causes.
      *   Keep (2): But only relative to a baseline expectation.
      *   Drop (5): Accept that identifying omission-causes requires context (norms), whereas action-causes are more physical.

  ### Summary of Changes to Your Position

  To make your view consistent with the **Cheapest Fix**:

  *   **Keep (1):** Yes, omissions are causes.
  *   **Keep (2):** But rephrase it: Norms determine which omissions are **salient** causes, not whether they are physically effective.
  *   **Modify (3):** The counterfactual test must be evaluated against a **default model**. (If I had acted *as expected*, would the outcome change?)
  *   **Keep (4):** This is now explained by the "default model." Null checks are default; arbitrary validation is not.
  *   **Drop (5):** Accept that omission causation is inherently pragmatic/normative, while action causation is physical. They are not perfectly symmetric.

  **Verdict:** The tension between **(2) and (3)** is the engine of the problem. By embedding the norm (2) *into* the counterfactual test (3) as a "normality condition," you save the system. This aligns with how you actually debug: you aren't looking for *any* change that fixes the crash; you're looking for the change that restores the code to its **intended specification**.
