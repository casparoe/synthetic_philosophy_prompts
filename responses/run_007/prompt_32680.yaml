  Based on the verdicts you've listed, your professor is operating under a strict version of **Gricean Semantic Minimalism**.

  Here is the breakdown of the rule she is running, how it applies to your new case, and how you can test it further.

  ### 1. The Rule She Is Running: Semantic Minimalism
  Your professor adheres to the view that **"what is said" is limited to the conventional meaning of the words, plus disambiguation and the fixing of indexicals (reference assignment).**

  *   **The Pattern:** In every case you listed, she has stripped away any content that is not syntactically mandated or lexically encoded.
      *   *Some:* Logically means "at least one." "Not all" is a pragmatic inference (Scalar Implicature). $\rightarrow$ **Implicated.**
      *   *And:* Logically commutative ($A \land B$). Temporal order is a pragmatic inference. $\rightarrow$ **Implicated.**
      *   *Therefore:* The causal link is non-truth-conditional. $\rightarrow$ **Conventional Implicature.**
      *   *Cold:* The proposition "it is cold" is complete; the request is a speech act derived via relevance. $\rightarrow$ **Implicated.**

  She is rejecting **Truth-Conditional Pragmatics (Contextualism)**, which argues that "what is said" must be a complete, intuitive proposition, even if that requires "free enrichment" from context (e.g., adding "today" or "in Paris" even if the words aren't there).

  ### 2. Competing Predictions for "I've had breakfast"

  **The Case:** "I've had breakfast" (said in the morning).
  **The Question:** Is the restriction to "today" part of *what is said* or *implicated*?

  *   **Prediction A: Semantic Minimalism (Her Likely Rule)**
      *   **Logic:** The present perfect tense ("have had") semantically encodes "at some time prior to the moment of speech." It does *not* syntactically demand the time be "today." The proposition "I have had breakfast [at some point in my life prior to now]" is truth-evaluable (it is either true or false). Therefore, narrowing the time to "today" is a pragmatic enrichment based on relevance (why else mention it in the morning?).
      *   **Verdict:** "Today" is **Implicated**.

  *   **Prediction B: Truth-Conditional Contextualism (Recanati, Travis)**
      *   **Logic:** A sentence only expresses a proposition if it is fully truth-evaluable in context. "I've had breakfast" is intuitively incomplete without a time frame. If you had breakfast in 1999 but not today, and you say this in the morning, you are misleading. The context supplies the time "today" to make the proposition complete *before* implicatures are calculated.
      *   **Verdict:** "Today" is part of **What Is Said** (an unarticulated constituent).

  ### 3. My Best Guess
  **She will rule that "today" is Implicated.**

  **Why?**
  Her previous verdicts show a commitment to the **Syntactic Constraint**. She consistently argues that if the grammar doesn't force a piece of information into the truth conditions, it belongs to the implicature.
  *   With "Some," she prioritized logical semantics over intuitive usage.
  *   With "And," she prioritized logical semantics over narrative order.
  *   With "Breakfast," she will likely prioritize the semantic definition of the present perfect (time $< t_{speech}$) over the pragmatic expectation of daily routines.

  She views "what is said" as the bare skeletal proposition. Any flesh added by context to make it *useful* or *specific* is relegated to implicature. To rule otherwise would contradict her handling of "Some" and "And," where she refused to let pragmatic expectations alter the truth conditions.

  ### 4. The Decisive Test Case
  To confirm whether she is a true Semantic Minimalist or a covert Contextualist, you need a case where the proposition is **not truth-evaluable at all** without contextual enrichment, yet there is **no syntactic slot** for that enrichment.

  **The Case:** **"It's raining."**

  *   **The Setup:** Suppose it is raining in London but sunny in New York. A speaker in London says, "It's raining."
  *   **The Question:** Is the location ("in London") part of *what is said* or *implicated*?

  **How the Rules Split:**
  1.  **Minimalist (Her Current Track):** The verb "rain" does not have a location argument in its syntax (unlike "It's raining *in Paris*"). Therefore, the proposition is simply "Rain is occurring [somewhere]." Since rain is occurring somewhere (London), the statement is true. The specific location "London" is **Implicated**.
  2.  **Contextualist:** "It's raining" is incomplete. It implies "It's raining *here*." Without the location, there is no complete proposition to evaluate. Therefore, the location is part of **What Is Said**.

  **Why this settles it:**
  If she rules that the location in "It's raining" is **implicated**, she is a consistent Semantic Minimalist, and my prediction about the breakfast case holds. If she rules that the location is **said**, she is actually a Contextualist who has been treating your previous examples as special cases, and she might surprise you with the breakfast case by ruling "today" is **said**.

  Given her drill on "Some" and "And," I would bet she calls the location in "It's raining" **implicated**.
