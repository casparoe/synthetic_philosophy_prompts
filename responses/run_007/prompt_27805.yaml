answer: |-
  # Q&A Prep Sheet: "The Epistemic Cost of Intuition Pumps"

  **Context:** Department Colloquium
  **Audience:** 24 Faculty (Ethics, Metaphysics, Phil Mind, Empirical Cognitivists)
  **Goal:** Survive scrutiny without conceding the core thesis (that TE-dependent conclusions are epistemically suspect).

  ---

  ### 1. The Self-Defeat Objection (The "Intuition about Intuitions" Problem)
  **Who asks:** The Senior Metaphysician or a sharp Graduate Student.
  **The Question:** "You argue that we shouldn't trust conclusions derived from intuitions elicited by vivid narratives. But isn't *your* conclusion—that these methods are epistemically suspect—itself based on an intuition? You're asking us to have an intuition about the unreliability of intuitions. If your argument holds, it undermines its own warrant."

  **2-Minute Reply:**
  "That's the standard worry, and it's why I was careful to frame my claim as *epistemic suspectness*, not *falsity*. I'm not arguing that intuition-driven conclusions are false; I'm arguing they lack a specific kind of justification. My claim rests on a distinction between *psychological persuasiveness* and *epistemic warrant*. I'm inviting you to reflect on the *source* of your conviction. If the only reason you believe P is that a story made P feel obvious, that's a psychological fact. My argument is that psychological facts about vividness don't track truth conditions in modal or normative space. I'm not asking for a new intuition; I'm asking for a shift in what we count as evidence. The warrant for my claim comes from analyzing the structure of the argument, not from a competing pump."

  **Soft Spot:** This is the hardest philosophical hit. If pressed, you risk admitting your critique relies on a "meta-intuition" about good methodology, which might be just as culturally situated as the Trolley Problem. You need to pivot quickly to the *structural* analysis of the arguments, not the *feeling* of them.

  ### 2. The Positive Program Objection (The "Vacuum" Problem)
  **Who asks:** The Senior Ethicist (Trolley specialist).
  **The Question:** "You've told us what not to do. You've attacked the violinist, fission, and zombies. But you closed with only a sketch of an alternative. If we strip these tools away, what *actually* replaces them? If your alternative methodology can't generate the same granularity of distinction in moral or metaphysical theory, haven't you just advocated for philosophical silence?"

  **2-Minute Reply:**
  "I'm not advocating silence; I'm advocating for a shift in burden of proof. In ethics, instead of isolating variables in fictional worlds, we look at reflective equilibrium with actual considered judgments and empirical data on moral psychology. In metaphysics, we look for theoretical virtues like coherence and explanatory power in the actual world, rather than modal intuitions. Yes, this makes some traditional debates harder to resolve. But that's a feature, not a bug. If a debate turns entirely on who can tell the more vivid story, perhaps that debate wasn't tracking truth to begin with. I'd rather have unresolved questions than false precision."

  **Soft Spot:** Your "sketch" at the end of the talk was likely too vague. If they press for a concrete example of how to solve the Personal Identity problem *without* fission cases, you might struggle to provide a compelling alternative that feels like *philosophy* to them.

  ### 3. The Modal Epistemology Objection
  **Who asks:** The Metaphysician (Personal Identity book author).
  **The Question:** "Metaphysics is partly about mapping modal space—what is possible and what is necessary. Thought experiments are the primary tool for testing possibility claims. Fission cases aren't just stories; they are claims about metaphysical possibility. If you reject them, how do you access modal facts? Are you reducing metaphysics to actual-world physics?"

  **2-Minute Reply:**
  "I'm not denying we can talk about possibility. I'm denying that *narrative vividness* is a reliable guide to *metaphysical possibility*. Just because I can vividly imagine a fission scenario doesn't mean it's metaphysically possible in the way required to ground identity claims. Often, these scenarios smuggle in conceptual contradictions disguised as narrative details. My proposal is that we treat possibility claims as theoretical posits that need to earn their keep in a broader system, rather than as data points delivered by imagination. We shouldn't let the tail of the story wag the dog of the theory."

  **Soft Spot:** This concedes a lot of ground to naturalism. If the metaphysician argues that conceivability *is* the guide to possibility (a la Chalmers), you need a specific rebuttal to the conceivability-possibility link, which you may not have fully developed.

  ### 4. The Empirical Deficit Objection
  **Who asks:** The Empirically Oriented Cognitivists.
  **The Question:** "You're making a psychological claim: that vividness and emotional salience cause cognitive bias that resists scrutiny. But you haven't cited a single study. You're doing armchair psychology to criticize armchair philosophy. Where is the experimental data supporting your claim that these specific features correlate with error?"

  **2-Minute Reply:**
  "That's a fair challenge, and I acknowledge this talk is a philosophical argument *for* doing that empirical work, not the work itself. However, we don't need a full fMRI scan to recognize that rhetoric affects judgment. Dennett's point, which I'm extending, is structural: when a device is designed to bypass reflective scrutiny via emotional engagement, it functions as a pump. Whether the specific bias is 'affect heuristic' or 'narrative transport' is an empirical question. But the philosophical point stands: if the *design* of the argument relies on bypassing scrutiny, the *justification* is compromised, regardless of the specific cognitive mechanism."

  **Soft Spot:** This group will not be satisfied with "Dennett said so." They want operationalized variables. If they gang up on this, you look like you're making scientific claims without scientific rigor.

  ### 5. The Discovery vs. Justification Objection
  **Who asks:** A mid-career Pragmatist or Generalist.
  **The Question:** "Aren't you conflating the context of discovery with the context of justification? Thought experiments might be how we *find* the argument (the pump), but surely we can reconstruct them as formal arguments (the machinery). If the formal argument holds, why does it matter that it started as a story?"

  **2-Minute Reply:**
  "I agree that reconstruction is the goal. My claim is that for the cases I discussed—the Chinese Room, the Violinist—the narrative framing isn't just heuristic; it's *essential* to their persuasive force. If you strip away the vividness and the emotion, the formal argument often loses its grip or reveals hidden premises. When the narrative does the heavy lifting, you can't fully separate the pump from the machinery. The suspicion arises when the proponent resists reconstruction because the 'obviousness' of the case relies on the story remaining intact."

  **Soft Spot:** You have to be prepared to show where the reconstruction fails for your specific cases. If they successfully reconstruct the Chinese Room as a purely logical argument, this objection sticks.

  ### 6. The Dennett Exegesis Objection
  **Who asks:** The Phil of Mind (Zombie argument user).
  **The Question:** "You're leaning on Dennett, but Dennett didn't say 'stop using intuition pumps.' He said 'check the pumps.' He wanted us to tune them to see if they still work when the irrelevant details are changed. You seem to be arguing for abandonment rather than calibration."

  **2-Minute Reply:**
  "You're right that Dennett called for calibration. But my observation of the literature—on zombies, on fission—is that calibration rarely happens. These cases become canonical *because* of their vividness, and that vividness makes them resistant to tuning. When a thought experiment becomes a 'move' in a debate rather than a tool for inquiry, it ceases to function as a pump we can tune and becomes a rhetorical shield. I'm arguing that for this specific class of 'canonical' cases, the calibration has failed, and we should treat the conclusions as provisional."

  **Soft Spot:** Several people in the room have read Dennett more carefully than you. If they quote *Elbow Room* or *Consciousness Explained* to show Dennett thought pumps were indispensable, you'll look like you're misusing the authority you invoked.

  ### 7. The Case-Specific Objection (Chinese Room)
  **Who asks:** The Phil of Mind.
  **The Question:** "The Chinese Room isn't just an intuition pump; it's an argument about syntax and semantics. The story illustrates a logical point about symbol manipulation. Even if the story is vivid, the conclusion follows from the premises about formal systems. Why lump it in with moral cases?"

  **2-Minute Reply:**
  "Searle presents it as a logical argument, but its uptake in the field relied heavily on the intuition that 'the man in the room doesn't understand.' That intuition is driven by the narrative framing of a monolingual English speaker shuffling cards. If you change the framing to a distributed system or a different temporal scale, the intuition shifts. The logical premise—that syntax isn't semantics—is contestable, but the *persuasion* relied on the pump. I'm arguing that the pump did more work than the logic in convincing the community."

  **Soft Spot:** This is a technical fight about AI and semantics. If you aren't deeply versed in the functionalist replies to Searle, they can bog you down in technicalities that distract from your methodological point.

  ### 8. The "Hope Nobody Asks" Question (The Normative Anchor)
  **Who asks:** The Senior Ethicist (Quietly, at the end).
  **The Question:** "You say we shouldn't treat these conclusions as 'established.' But 'established' is a normative epistemic status. If we can't trust the intuitions that ground our ethical and metaphysical theories, what *does* ground the normativity of your own critique? Why should we value 'resistance to scrutiny' if that value is itself an intuition you haven't justified?"

  **2-Minute Reply:**
  *(Pause. Take a breath.)*
  "That's the crucial question. My defense is that I'm appealing to a procedural norm common to all inquiry, not a substantive moral or metaphysical intuition. The norm is: 'Claims should be supported by reasons that can be publicly examined, not by psychological states that resist examination.' This isn't an intuition about *what is right* or *what exists*; it's a commitment to the practice of argumentation itself. If you reject that norm, we aren't doing philosophy; we're doing rhetoric. I'm asking you to value the practice over the specific conclusions."

  **Soft Spot:** **This is the kill shot.** If they argue that "procedural norms" are *also* intuition-driven (which many meta-ethicists believe), your entire project collapses into the self-defeat you tried to avoid. You have no non-intuitive foundation for your critique. If this comes up, your only move is to stand firm on the *pragmatics* of the discipline: "If we can't agree on that norm, we can't talk." But be warned: that's a conversation-ender, not an argument-winner.

  ---

  ### General Strategy Notes:
  *   **Don't get bogged down in the cases.** If they want to debate the Violinist specifically, remind them the talk is about the *method*, not the *result*.
  *   **Validate the Empiricists.** They are your natural allies, but they demand rigor. Acknowledge the need for data repeatedly.
  *   **Yield on "Falsity."** Never say the conclusions are *false*. Say they are *unearned*. This makes you harder to attack.
  *   **Watch the Clock.** If a questioner starts a monologue, interrupt politely: "I want to make sure I address your core point before time runs out..."
