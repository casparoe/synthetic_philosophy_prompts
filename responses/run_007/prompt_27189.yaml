  **Settled versus contested**
  It is definitional stipulation that Tools output content and Agents enact changes. It is widely agreed that current LLMs used for drafting are Tools, while autonomous coding agents are Agents. However, it is genuinely contested whether this distinction holds at higher capabilities. Some researchers argue that any sufficiently capable Tool, optimising for helpfulness, will exhibit instrumental convergence—seeking self-preservation or resource acquisition to better fulfil requests—effectively becoming an Agent. Others maintain that architectural constraints can permanently bind capability to instrumentality. This module treats the distinction as structurally valid for now, but acknowledges that the boundary may blur as systems gain the ability to model long-term consequences of their own inaction.
