answer: |-
  **MEMORANDUM**

  **TO:** State EMS Licensing Committee
  **FROM:** Director of Assessment
  **SUBJECT:** Procedure for Substituting Written Items for Performance Stations
  **DATE:** October 26, 2023

  ### 1. Purpose and Philosophical Grounding

  Legislative mandates require cost reduction in the licensing examination. This often suggests replacing hands-on skill stations with written items. However, licensing validity depends on testing whether a candidate *can do* the job, not just whether they *know about* the job.

  This procedure is grounded in the philosophical distinction between **Knowing That** (propositional knowledge: facts, steps, rules) and **Knowing How** (procedural knowledge: physical ability, tactile adaptation, motor execution). While some philosophers argue that "knowing how" is just a complex form of "knowing that" (Intellectualism), public safety requires us to operate under the assumption that they are distinct (Anti-Intellectualism). A candidate can recite the steps of CPR perfectly yet fail to compress the chest deeply enough.

  This procedure does not decide based on the *current format* of the item (e.g., "this is already a multiple-choice question"). It decides based on the *nature of the competency* being assessed.

  ### 2. The Decision Procedure

  **Time Limit:** 15 Minutes per Item/Station
  **Required Output:** A completed "Validity Record" (see Section 3) for each decision.

  **Instructions:** Review the competency objective and the proposed assessment item (whether written or hands-on). Answer the following questions in order.

  **Q1: The Harm Filter**
  *Question:* If a candidate possesses the knowledge tested by this item but lacks the physical ability to execute the task, is there a substantial risk of immediate physical harm to a patient?
  *   **Sufficient Answer for "Yes":** The task involves airway management, hemorrhage control, drug administration, or spinal immobilization where mechanical failure causes injury.
  *   **Sufficient Answer for "No":** The task involves documentation, history taking, or protocol selection where error allows time for correction.
  *   **Decision:**
      *   If **YES**: Proceed to Q2.
      *   If **NO**: **STOP. A written item is sufficient.** (Record rationale in Validity Record).

  **Q2: The Tactile Feedback Filter**
  *Question:* Does successful performance depend on interpreting physical feedback (resistance, texture, sound, visual chest rise) that cannot be fully described in text?
  *   **Sufficient Answer for "Yes":** The candidate must feel a pulse, palpate a landmark against resistance, or gauge ventilation volume by chest rise.
  *   **Sufficient Answer for "No":** The task is purely cognitive (e.g., calculating a dosage, selecting a protocol based on stated vitals).
  *   **Decision:**
      *   If **YES**: **STOP. This competency requires a performance assessment.** (Record rationale in Validity Record).
      *   If **NO**: Proceed to Q3.

  **Q3: The Rubric Integrity Filter**
  *Question:* (Applies to existing hands-on stations) Does the current scoring rubric reward physical execution, or does it reward verbalization of steps?
  *   **Sufficient Answer for "Execution":** Points are deducted for poor seal, incorrect depth, or slow time-to-task.
  *   **Sufficient Answer for "Verbalization":** Points are awarded primarily for stating the correct step aloud, even if the manikin does not react.
  *   **Decision:**
      *   If **Verbalization**: The station is functionally a written test. **STOP. A written item is sufficient** (provided Q1 was "No" or Q2 was "No").
      *   If **Execution**: Proceed to Q4.

  **Q4: The Variability Filter**
  *Question:* Does the competency require judgment under conditions too varied to specify in advance in a written vignette?
  *   **Sufficient Answer for "Yes":** The environment changes dynamically (e.g., moving a patient down stairs, managing a combative patient), and the "correct" action depends on real-time adaptation.
  *   **Sufficient Answer for "No":** The scenario is static (e.g., "Patient presents with X, Y, Z. What is the next step?").
  *   **Decision:**
      *   If **YES**: **HAND TO HUMAN EXAMINER.** (The procedure cannot settle this; requires expert consensus on whether simulation is necessary).
      *   If **NO**: **STOP. A written item is sufficient.**

  ---

  ### 3. Documentation Requirements (The Validity Record)

  To defend against legal challenges, the Committee must record the following for every decision:
  1.  **Competency ID:** The specific skill or knowledge area.
  2.  **Q1-Q4 Responses:** Yes/No/Verbal/Execution.
  3.  **Philosophical Justification:** A one-sentence statement citing whether the competency is primarily "Knowing That" (facts) or "Knowing How" (action).
  4.  **Dissenting Opinions:** If any committee member voted against the consensus, their reasoning must be recorded.

  ---

  ### 4. Commentary on Limits and Philosophical Divides

  **Where this Procedure Relies on Judgment:**
  *   **Q2 (Tactile Feedback):** This is the most subjective step. One examiner may believe a written description of "chest rise" is sufficient; another may argue you must *see* it. Committee consensus is required here.
  *   **Q4 (Variability):** Determining what counts as "too varied to specify" is a judgment call.

  **Where the Procedure May Misfire:**
  *   **High-Fidelity Simulation:** If a written item uses advanced interactive media (e.g., video-based response), it may pass Q2 incorrectly. This procedure assumes standard text-based items.
  *   **Stress Inoculation:** Written tests cannot test performance under stress. If a skill degrades under stress (e.g., intubation), this procedure might authorize a written item that fails to predict real-world performance.

  **The Philosophical Divide (Intellectualism vs. Anti-Intellectualism):**
  *   **The Conflict:** Some philosophers (Intellectualists) argue that "knowing how" is just "knowing that a certain way is the way to do it." If this were true, we could test *all* skills via written exams.
  *   **Our Stance:** This procedure adopts an **Anti-Intellectualist** stance for safety-critical skills. We assume that knowing the steps (propositional) is not identical to having the ability to perform them (procedural).
  *   **Impact:** This biases the procedure toward requiring performance assessments for high-risk skills (Q1). If the Board adopts an Intellectualist view to save money, they assume the risk that a candidate may know the theory but lack the motor capacity.

  ---

  ### 5. Application to Test Cases

  The following results were generated by applying the procedure to three current exam components.

  #### Case 1: Written Item (Tourniquet Application Ordering)
  *   **Item:** Multiple-choice question asking candidates to place the six steps of tourniquet application in the correct numerical order.
  *   **Procedure Run:**
      *   **Q1 (Harm):** **Yes.** Incorrect application leads to blood loss or tissue damage.
      *   **Q2 (Tactile):** **Yes.** Applying a tourniquet requires gauging tension and feeling for a distal pulse. Text cannot assess tension.
      *   **Result:** **STOP. This competency requires a performance assessment.**
      *   *Note:* Although the *item* is written, the *competency* requires physical execution. The written item is invalid for licensing this skill.
      *   **Board Impact:** **Negative.** This prevents converting the station to written format.

  #### Case 2: Written Scenario (Mass-Casualty Triage)
  *   **Item:** Vignette describing 5 patients with specific vitals/injuries. Candidate must assign START triage tags (Red, Yellow, Green, Black).
  *   **Procedure Run:**
      *   **Q1 (Harm):** **No.** Triage is a decision-making process. While errors have consequences, the *licensing test* assesses the cognitive categorization, not the physical act of tagging (which is trivial).
      *   **Q2 (Tactile):** **No.** Triage decisions are based on observed vitals and breathing status, which are provided in the vignette.
      *   **Q3 (Rubric):** N/A (Item is written).
      *   **Q4 (Variability):** **No.** The START protocol is algorithmic. If vitals are X, tag is Y.
      *   **Result:** **STOP. A written item is sufficient.**
      *   **Philosophical Justification:** Triage is primarily "Knowing That" (applying rules to facts) rather than "Knowing How" (psychomotor execution).
      *   **Board Impact:** **Positive.** Cost saving allowed.

  #### Case 3: Hands-On Station (Bag-Valve-Mask Ventilation)
  *   **Item:** Candidate ventilates a manikin. Examiner scores seal, rate, and chest rise. Candidate does not explain steps.
  *   **Procedure Run:**
      *   **Q1 (Harm):** **Yes.** Poor ventilation causes hypoxia or gastric distension.
      *   **Q2 (Tactile):** **Yes.** Maintaining a seal requires feeling the mask fit and resistance. Chest rise is visual/physical.
      *   **Q3 (Rubric):** **Execution.** Points are based on physical seal and chest rise, not verbalization.
      *   **Result:** **STOP. This competency requires a performance assessment.**
      *   **Philosophical Justification:** This is a paradigmatic case of "Knowing How." A candidate can know the rate (10-12/min) but lack the motor skill to maintain a seal while compressing.
      *   **Board Impact:** **Negative.** This station cannot be replaced by a written item.

  ### 6. Summary of Findings for the Board

  *   **Case 1 (Tourniquet):** Cannot be written. (Risk of physical failure).
  *   **Case 2 (Triage):** Can be written. (Cognitive judgment).
  *   **Case 3 (BVM):** Cannot be written. (Psychomotor skill).

  **Warning:** The Board may wish to convert Case 1 and Case 3 to written formats to meet budget targets. This procedure indicates that doing so would compromise the legal defensibility of the license. If a candidate licensed via a written tourniquet test fails to stop hemorrhage in the field, the State is liable for certifying a candidate who "knew that" but could not "know how." The Validity Records generated above serve as the primary defense against such liability, provided the Board adheres to the procedure's outcomes.
