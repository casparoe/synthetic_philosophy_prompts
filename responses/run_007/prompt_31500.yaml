prompt: |-
  I cover courts and behavioral science for a magazine, and for the last few years I've been following a constitutional court that keeps ruling on what are basically Ulysses contracts scaled up to a whole country—provisions that bind future legislatures and voters to stop them from doing something they might later want to do. I'm working on a piece that reverse-engineers the rule the court seems to be running, and I'd like to test my read agaisnt a case it hears next term. You're an expert on constitutional theory and the logic of precommitment; think through this carefully, and maybe start by brainstorming two or three principles that could fit the court's track record before you commit to one.

  The court's recent decisions, roughly: it upheld a balanced-budget amendment with a three-fifths supermajority escape hatch for emergencies; upheld a fixed election date the legislature can move only by a two-thirds vote; upheld a central-bank independence clause whose governors can be removed only for cause; struck down a statutory no-repeal clause that permanently banned nuclear power; and struck down a constitutional amendment declaring a social market economy an unamendable principle of the state. Now it has to decide on a new amendment that permanently abolishes the death penalty, with no override mechanism whatsoever. The amendment is defended on the grounds that capital punishment is the one punishment where mistakes can't be undone and that majorities get swept up in retributive panic after notorious crimes.

  What should the court decide if it wants to be consistent with itself? Which of its earlier decisions is the closest analog, and which of the candidate rules you brainstormed actually does the work in that analog? If the track record genuinely underdetermines the answer, say so and tell me what principle the court would be adopting with each choice, and what further case would most cleanly settle which rule it's really running. And one more thing: flag clearly what's settled here and what's genuinely contested among people who study this stuff—don't present a contested reading of these precedents as if it were the consensus.
