answer: |-
  This is a fascinating problem because it sits right at the intersection of philosophy of language, epistemology, and philosophy of mind. Both you and your editor are correct, but you are operating in different domains. Your editor is looking at the **logic of assertion**, while you are describing the **phenomenology of trauma**.

  Here is the breakdown of what is settled, what is contested, and how you can defend (or tweak) the line to satisfy a philosophically literate reader without losing the emotional truth.

  ### 1. The Settled Ground: Moore's Paradox
  Your editor is intuitively reacting to what philosophers call **Moore's Paradox**. Named after G.E. Moore, this refers to sentences of the form:
  > *"P, but I don't believe that P."*
  > (Example: "It is raining, but I don't believe it is raining.")

  **The Consensus:**
  *   **Logical Status:** It is **not** a logical contradiction. It is entirely possible for it to be raining while you don't believe it is (you could be unaware, or in denial). The world does not contradict itself.
  *   **Pragmatic Status:** It is **pragmatically absurd to assert**. In standard philosophy of language (following Wittgenstein and others), the act of asserting "P" implies that you believe "P." Therefore, when you say the second half ("but I don't believe it"), you undermine the authority of the first half. It sounds like nonsense because it violates the norms of communication.

  **The Verdict for Your Novel:**
  Your editor is right that the sentence is *pragmatically inconsistent*. However, that does not make it "nonsense" in a literary context. In fact, Moore's Paradox is often used in philosophy to demonstrate the limits of rational self-reporting. If your character is in a state of shock, she is precisely in a state where the norms of rational assertion have broken down.

  ### 2. The Contested Ground: Self-Deception and Partitioning
  You asked what is going on philosophically when someone knows something but doesn't believe it. This enters the territory of **self-deception**, which is genuinely contested.

  **The Problem:**
  Standard epistemology defines Knowledge as **Justified True Belief**. You cannot technically "know" something you do not "believe." If you say, "I know he is cheating, but I don't believe it," a strict epistemologist would say you don't *know* it; you just have evidence of it.

  **The Models (Contested):**
  *   **Intentionalist Model:** The character is actively lying to herself. She holds the belief "he is cheating" in one part of her mind and actively suppresses it. (Critics say this requires too much conscious effort).
  *   **Motivational/Deflationary Model:** The character isn't actively lying; her desire for the marriage to work biases how she processes the evidence. She accepts the evidence intellectually but refuses to let it update her emotional worldview.
  *   **The "Divided Mind" (Davidson):** The mind is partitioned. One "structure" holds the evidence, another holds the comforting belief. They don't talk to each other.

  **Safe Bet for a Novelist:**
  Do not commit your character to a specific *mechanism* of self-deception (e.g., don't imply she is consciously choosing to ignore it if she isn't). The safest philosophical ground is **mental partitioning**. It is widely accepted that the human mind is not a single, unified agent. We can hold conflicting attitudes simultaneously.

  ### 3. A Philosophical Tool for You: "Belief" vs. "Alief"
  If you want to arm yourself against a pedantic reviewer, look into the work of philosopher **Tamar Gendler** on **Alief**. This is a respected, contemporary concept that solves your problem elegantly.

  *   **Belief:** A cognitive, propositional attitude. (e.g., "I accept the proposition that my husband is cheating based on evidence.")
  *   **Alief:** An automatic, associative, emotional tendency. (e.g., "My gut reacts to him as my safe, faithful husband.")

  Gendler argues that we often act on *alief* even when it contradicts our *belief*. (Example: Walking on a glass skywalk. You *believe* it is safe, but you *alieve* danger, so your knees shake.)

  **How this helps your line:**
  When your character says, "He's having an affair, but I don't believe it," she is effectively saying:
  > *"My intellect accepts the proposition (Belief), but my worldview/emotional reality has not updated (Alief)."*

  This makes the line coherent. She is reporting a conflict between her cognitive assessment and her doxastic (belief-based) commitment.

  ### 4. Recommendations for the Text
  You have three options to handle this, ranging from "fight for the line" to "philosophical precision."

  **Option A: Keep the line, lean into the paradox.**
  If you keep *"He's having an affair, but I don't believe it,"* ensure the surrounding narration makes it clear she is reporting a fracture in her psyche, not a fact about the world.
  *   *Why:* It captures the Moorean Paradox, which highlights the absurdity of her trauma.
  *   *Defense:* She isn't making a rational assertion; she is confessing a dissociation.

  **Option B: Tweak for Epistemic Precision.**
  Since "Knowledge entails Belief," avoid having her say "I know." Instead, focus on the evidence vs. the acceptance.
  *   *Revision:* "I have the proof he's having an affair. But I don't believe it."
  *   *Why:* This removes the logical contradiction ($K \rightarrow B$) while keeping the psychological tension. It separates the *evidence* (external) from the *belief* (internal).

  **Option C: Use the "Can't" Modifier.**
  Your intuition mentioned: *"I know it's true but I can't bring myself to believe it."*
  *   *Analysis:* This is psychologically stronger. The "can't" implies a volitional or emotional blockage. It acknowledges the truth of the first clause while explaining the failure of the second.
  *   *Philosophical reading:* This suggests that "believing" isn't just a switch you flip when you see evidence; it's an integration process that is currently failing.

  ### Summary for Your Editor
  If you need to justify this to your editor, you can say:

  > "I understand this triggers Moore's Paradox, which makes it pragmatically odd. But that's exactly the point. The character is in a state of acute cognitive dissonance where her intellectual assessment ('He is having an affair') has outpaced her doxastic commitment ('I believe it'). The sentence isn't meant to be a logical report; it's a description of a mind that has temporarily split to protect itself."

  ### The Bottom Line
  *   **Settled:** Asserting "P but I don't believe P" is pragmatically irrational, but logically possible.
  *   **Settled:** You cannot strictly "know" something you don't "believe."
  *   **Contested:** Exactly how the mind manages to hold contradictory states (self-deception mechanisms).
  *   **Recommendation:** The line is psychologically real and philosophically defensible as a report of **mental partitioning**. However, to be bulletproof, consider changing "He's having an affair" (Fact) to "I have proof he's having an affair" (Evidence). This sidesteps the assertion norm while keeping the emotional impact.

  **Proposed Tweak:**
  *"I have the proof. He's having an affair. But I don't believe it."*
  Breaking it into fragments allows her to assert the fact, then separately assert her failure to integrate it, which feels more like the stuttering rhythm of shock.
