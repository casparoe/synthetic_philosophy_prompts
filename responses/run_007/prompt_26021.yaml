      *   *Why?* Assertion implies belief. To say "P" implies "I believe P." So saying "P and I don't believe P" contradicts the norm of assertion.
      *   *Is it settled?* Yes, among philosophers of language and mind, Moore's Paradox is a well-known phenomenon. It's generally agreed that asserting it is irrational *from the perspective of the speaker at that moment*, even if the proposition itself isn't a logical contradiction (like $P \land \neg P$).

  3.  **Psychological/Phenomenological Assessment:**
