answer: |-
  # The Diachronic Self Quiz: Whose Future Beliefs Bind You?

  **Instructions:** Read each scenario below. In each case, you have a current credence (degree of belief) in a proposition. You also know what your credence *will be* at a specific future time. The question is always the same: **Given what you know about your future self, how should you adjust your credence *right now*?**

  *   **Move Toward:** Adjust your current credence to match the future credence.
  *   **Stay Put:** Keep your current credence unchanged.
  *   **Move Away:** Adjust your current credence to actively oppose the future credence.

  ---

  ### Case 1: The Forgetfulness Pill
  You are about to take a pill that will selectively erase a specific piece of evidence you currently possess. You know that immediately after taking it, your credence in Proposition A will drop from **0.7** to **0.5** solely because that evidence is gone. You remain otherwise rational.
  *   **Q:** Should you move your current credence toward 0.5 now?

  ### Case 2: The Expert Friend
  A friend who is currently investigating Proposition X has access to a much larger dataset than you. She is rational and honest. She tells you, "Tomorrow, after I finish my analysis, my credence in X will be **0.9**." You trust her assessment of her own future state.
  *   **Q:** Should you move your current credence toward 0.9 now?

  ### Case 3: The Drunk Driver
  You are at a party. You know that in three hours you will be heavily intoxicated. You currently believe the probability of you driving home safely is **0.1**. You know that once drunk, your credence in driving safely will skyrocket to **0.9** due to alcohol-induced overconfidence.
  *   **Q:** Should you move your current credence toward 0.9 now?

  ### Case 4: The Ideological Conversion
  You are currently a secular skeptic. You know that next month you will attend a retreat that you currently regard as epistemically corrupting (brainwashing). You predict that post-retreat, your credence in the retreat's central dogma will rise from **0.1** to **0.9**. You view this shift as a corruption of your rational faculties, not an update.
  *   **Q:** Should you move your current credence toward 0.9 now?

  ### Case 5: The Dementia Diagnosis
  A doctor informs you that a progressive condition will soon cause you to form vivid false memories. You currently believe the proposition "I was at home yesterday" is **false (0.1)**. You know that next year, due to the condition, you will be confidently certain it is **true (0.9)**.
  *   **Q:** Should you move your current credence toward 0.9 now?

  ### Case 6: The Ulysses Contract
  You are trying to write a thesis. You currently value finishing it (Credence in "Thesis is valuable": **0.9**). You know that tomorrow morning you will be tired and tempted to quit (Future Credence in "Thesis is valuable": **0.4**). You have the option to lock your computer today (bind your future self).
  *   **Q:** Should you lower your current credence in the thesis's value to 0.4 to match your future self, or keep it at 0.9?

  ### Case 7: Standard Learning
  You are waiting for the results of a reliable, calibrated scientific test regarding Proposition Y. You know that tomorrow you will see the result and update via conditionalization. You anticipate your future credence will be **0.8**.
  *   **Q:** Should you move your current credence toward 0.8 now?

  ---

  ## Scoring Key & Logical Space Analysis

  ### 1. The Logical Space
  To interpret your answers, we map the cases onto three diagnostic axes. Your pattern of "Toward" (Deference) vs. "Put/Away" (Autonomy) reveals your location in this space.

  *   **Axis A: Information Sensitivity.** Do you defer when the future self has *less* information? (Tests Case 1).
  *   **Axis B: Rationality Sensitivity.** Do you defer when the future self is *impaired* or *corrupted*? (Tests Cases 3, 4, 5).
  *   **Axis C: Agency vs. Belief.** Do you treat the future self as an authority to be obeyed (Belief) or a subordinate to be managed (Action)? (Tests Case 6).

  ### 2. Position Profiles
  Tally your **"Move Toward"** answers for the specific cases listed below.

  #### **A. The Strict Reflectionist**
  *   **Pattern:** Move Toward on **Case 1 (Pill)** AND **Case 7 (Standard)**.
  *   **Philosophy:** You hold that your future credence is a sufficient statistic for your current belief, regardless of *why* it changed. If you know you will believe it later, you should believe it now. You view the temporal gap as epistemically irrelevant.
  *   **Logical Location:** High Deference on Info Loss + High Deference on Info Gain.

  #### **B. The Qualified Reflectionist**
  *   **Pattern:** Move Toward on **Case 7 (Standard)** AND **Case 2 (Friend)**, BUT Stay Put on **Case 1 (Pill)** and **Case 3 (Drunk)**.
  *   **Philosophy:** You defer to your future self only when you expect them to be *at least as rational and well-informed* as you are now. You treat Reflection as a principle of rational learning, not a mystical bond between time-slices. Forgetting or impairment breaks the deference obligation.
  *   **Logical Location:** High Deference on Info Gain, Low Deference on Info Loss/Impairment.

  #### **C. The Planning Theorist**
  *   **Pattern:** Stay Put on **Case 1, 2, 3, 4, 5, 7**, BUT you endorse **binding** in **Case 6 (Ulysses)**.
  *   **Philosophy:** You do not view your future self as an epistemic authority whose beliefs you must adopt. Instead, you view your future self as a distinct agent within the same body. You maintain your current credences (Stay Put) but use *actions* (binding) to manage future behavior. You separate belief from planning.
  *   **Logical Location:** Low Deference on Belief, High Regulation on Action.

  #### **D. The Epistemic Presentist**
  *   **Pattern:** Stay Put on **Case 1, 2, 3, 4, 5, 7**. (May or may not bind in Case 6, but only for prudential, not epistemic, reasons).
  *   **Philosophy:** Your current self is the only locus of epistemic justification. Future beliefs are merely predictions about the world (like the friend's beliefs), not commands. You update only on current evidence, never on anticipated future opinions.
  *   **Logical Location:** Low Deference on Belief, Low/Prudential Regulation on Action.

  ### 3. Unoccupied Logical Space
  There is one combination of answers that is logically possible but philosophically barren:
  *   **The "Reverse-Reflectionist":** Stay Put on **Case 7 (Standard Learning)** but Move Toward on **Case 3 (Drunk)**.
  *   **Why it's empty:** This position claims you should ignore your future self when they are rational and better informed, but defer to them when they are irrational and impaired. No serious epistemological theory advocates trusting a drunk self more than a sober one.

  ### 4. Indistinguishable Positions (The "Blind Spot")
  This quiz cannot fully separate **The Planning Theorist** from **The Epistemic Presentist**.
  *   **Why:** Both positions answer "Stay Put" to all *credence* questions (Cases 1–5, 7). They agree that you should not change your beliefs simply because your future self will hold different ones.
  *   **The Distinction:** They differ on the *normative status of binding* in Case 6.
      *   The **Planner** says binding is *rationally required* to maintain agency coherence.
      *   The **Presentist** says binding is merely *prudentially permitted* (like tying up a hostile stranger) because the future self is effectively a different person.
  *   **To separate them:** Ask the group: "When you bind your future self in Case 6, are you exercising authority *over* yourself (Presentist) or exercising authority *as* yourself across time (Planner)?"

  ### 5. Summary Table for Quick Scoring

  | Position | Case 1 (Pill) | Case 3 (Drunk) | Case 7 (Standard) | Case 6 (Ulysses) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Strict Reflection** | **Toward** | **Toward** | **Toward** | Unnecessary (Belief binds) |
  | **Qualified Reflection** | **Put** | **Put/Away** | **Toward** | Permitted |
  | **Planning View** | **Put** | **Put/Away** | **Put** | **Required (Action)** |
  | **Presentism** | **Put** | **Put/Away** | **Put** | Prudential Only |

  *(Note: "Put/Away" indicates that Qualified, Planning, and Presentist views all reject deference here, though some might actively lower credence to compensate for the impairment.)*
