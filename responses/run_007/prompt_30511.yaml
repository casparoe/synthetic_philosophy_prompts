prompt: |-
  I'm putting together a "which view of your own future opinions do you actually hold?" quiz for a small reading group on Bayesian epistemology, and I want the sorting key to do actual work rather than asking people wether they endorse the Reflection principle by name. Write me a six- or seven-case quiz, each case with two or three answer options. Use at least these cases: you're about to take a pill that will erase one piece of evidence and you know your credence in A will drop from .7 to .5; a friend who reliably has more evidence than you will tell you tomorrow that her credence in X is .9; you'll be drunk tonight and will become wildly overconfident about driving safely; you know you'll undergo a conversion you currently regard as epistemically corrupting; a doctor tells you your dementia will later make you confident in a false memory; and a Ulysses case where you can bind your future self against a foreseeable bad call. For each, ask whether you should now move toward the future credence, away from it, or leave it put. Then supply a scoring key that maps answer patterns onto at least these positions: strict Reflection (defer even to a forgetful or impaired future self), qualified Reflection (defer only to a future self that's rational and at least as well-informed), the planning view (you don't defer, but you can rationally bind yourself), and presentism (your current self is the only one you answer to). Build the key from the logical space first: the splitting questions are things like whether the future self is more or less informed, more or less rational, and whether binding is possible—then locate the named positions in that space, and flag both unoccupied combinations (with a guess at why nobody lives there) and any two positions your cases can't separate.
