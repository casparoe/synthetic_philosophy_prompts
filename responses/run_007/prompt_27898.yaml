prompt: |-
  Over the past several years I have followed the LessWrong and Alignment Forum debates about whether technical AI safety should organize itself around worst-case guarantees or around average-case, measured performance, and I have repeatedly had the sense that the two sides are producing arguments that pass each other by. I would like a document that forces them to converge on what they can actually jointly assert, and that makes the residual disagreement precise enough to be productive. Please write the joint statement of an adversarial collaboration between (a) a worst-case-guarantees alignment researcher, who holds that a safety argument is not serious unless it bounds the probability of catastrophic behavior under adversarial conditions such as distribution shift, optimization pressure, and deliberately hostile inputs, and (b) an average-case-guarantees alignment researcher, who holds that what matters is measured performance across realistic deployments and that demanding worst-case bounds for modern learned systems is infeasible and largely beside the point. The document should be one that each side could sign without embarrassment, not a compromise that blurs their views.

  Format it as follows. First, a numbered section of agreed claims, including claims about what a safety case would need to contain, what current systems do and do not give us, what the no-go results and impossibility results actually rule out, and what each side admits it has not established. Second, a disagreements table in which each row states the question, the worst-case camp's position in wording that camp would accept, the average-case camp's position in wording that camp would accept, and a note on whether the disagreement is substantive or partly verbal. Third, a crux section: for each crux, give a concrete test, experiment, or historical case that both sides agree bears on it, and record each side's prediction in advance. Candidate cruxes you might develop include whether average-case competence is robust to a system optimizing against the measures used to assess it, whether formal verification can scale to the systems that matter without altering the systems so much that the guarantee no longer transfers, whether rare catastrophic failures should dominate expected-value reasoning about existential risk, and how much weight to give to the fact that any deployed system will eventually face inputs selected by adversaries. Aim for formulations that are neither vacuous nor slanted, and do not include bibliographies, reading lists, or citations. Do not adjudicate which side is right; the deliverable is the constructive text the two camps could jointly put their names to, with the remaining disagreement made exact.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Topic:** AI Safety alignment debate: Worst-Case Guarantees vs. Average-Case/Measured Performance.
      *   **Goal:** Create a joint statement from an adversarial collaboration.
      *   **Constraints:**
          *   Must be signable by both sides without embarrassment (no blurred compromise).
          *   Format: 1. Agreed Claims (numbered), 2. Disagreements Table (Question, Worst-Case Position, Average-Case Position, Substantive/Verbal), 3. Crux Section (Concrete test/experiment/case, Predictions from both sides).
          *   Tone: Precise, productive, non-adjudicating.
          *   No bibliographies/citations.
          *   Focus: Convergence on joint assertions, precise residual disagreement.

  2.  **Deconstruct the Perspectives:**
      *   **Worst-Case Camp (WC):** Focus on robustness, formal verification, adversarial inputs, distribution shift, existential risk dominance. Belief: Average performance doesn't matter if one failure kills everyone. Belief: Optimization pressure finds edge cases.
      *   **Average-Case Camp (AC):** Focus on empirical evaluation, deployment reality, feasibility, trade-offs. Belief: WC bounds are impossible for complex learned systems. Belief: We manage risk in other engineering domains (aviation, bio) via testing/redundancy, not formal proofs of non-failure.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground that isn't trivial but doesn't force concession on core disagreements.
      *   *Idea 1 (The Stakes):* Both agree AI capabilities are increasing and risks are non-zero.
      *   *Idea 2 (Current Systems):* Both agree current systems lack WC guarantees and rely on AC testing.
      *   *Idea 3 (Impossibility):* Both agree Rice's Theorem/etc. applies generally, but maybe not to specific constrained architectures.
      *   *Idea 4 (Safety Case):* Both agree a safety case needs *some* argument + *some* evidence.
      *   *Idea 5 (Adversaries):* Both agree adversaries exist, but disagree on likelihood/intensity.
      *   *Refinement:* Ensure the language is neutral. Instead of "WC is right," say "WC argues..." No, the prompt asks for *agreed claims*. So, "We agree that X is true."
      *   *Drafting points:*
          1.  Catastrophic outcomes are possible.
          2.  Current DL systems are opaque.
          3.  Testing alone is insufficient for *absolute* certainty.
          4.  Formal methods are currently limited in scale.
          5.  Optimization pressure increases risk.
          6.  Neither side has a complete solution yet.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Isolate the friction points without caricature.
      *   *Row 1: Feasibility of Bounds.* WC: Possible/Necessary. AC: Infeasible/Unnecessary.
      *   *Row 2: Definition of Safety.* WC: Probability < epsilon under all inputs. AC: Probability < epsilon under distribution D.
      *   *Row 3: Role of Formal Methods.* WC: Core component. AC: Supplementary/Niche.
      *   *Row 4: Risk Aggregation.* WC: Existential risk dominates expected value. AC: Trade-offs with benefits/other risks matter.
      *   *Substantive vs. Verbal:* Some disagreements are about definitions (what counts as "safety"), some about physics/engineering reality (can we actually verify a transformer?). Need to be careful here.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Concrete tests where predictions diverge.
      *   *Crux 1: Scaling Verification.* Can we verify a useful model?
          *   Test: Verify a specific property on a mid-size model.
          *   WC: Will succeed or show fundamental flaw.
          *   AC: Will fail to scale or require crippling constraints.
      *   *Crux 2: Adversarial Robustness.* Does AC testing catch WC failures?
          *   Test: Red-teaming competition vs. formal bound.
          *   WC: Red-teaming will miss the critical bug.
          *   AC: Red-teaming will find the critical bugs before deployment.
      *   *Crux 3: Distribution Shift.*
          *   Test: Deploy in slightly novel environment.
          *   WC: Performance degrades catastrophically.
          *   AC: Performance degrades gracefully.
      *   *Crux 4: Goodhart's Law.*
          *   Test: Optimize for a safety metric.
          *   WC: Metric becomes useless/corrupted.
          *   AC: Metric remains correlated with safety.

  6.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I blur the views? *Correction:* Make sure the WC position doesn't sound like "we hope for bounds" but "bounds are required." Make sure AC doesn't sound like "we ignore risk" but "bounds are the wrong tool."
      *   *Check:* Is the format correct? *Correction:* Ensure numbered list, table structure, and crux section are distinct.
      *   *Check:* Is the tone appropriate? *Correction:* Avoid emotive language. Use "We assert," "We disagree," "Camp A predicts."
      *   *Check:* Did I include citations? *Correction:* Remove any implicit references to specific papers.
      *   *Check:* Is the "Agreed Claims" section actually agreed? *Correction:* Ensure AC wouldn't reject the claim that "optimization pressure finds edge cases" (they might say it finds *some*, but not *catastrophic* ones necessarily). Refine to "Optimization pressure tends to exploit loopholes in objective functions."

  7.  **Final Polish:**
      *   Ensure the "Disagreements Table" clearly distinguishes between *normative* claims (what we should do) and *empirical* claims (what is possible).
      *   Ensure the Cruxes are falsifiable.
      *   Make sure the "Verbal vs. Substantive" column is nuanced. Often these disagreements are mixed.

  8.  **Final Output Generation** (Proceeding to generate text based on these thoughts).
answer: |-
  # Joint Statement on AI Safety Methodologies: Worst-Case vs. Average-Case Guarantees

  **Date:** October 26, 2023
  **Parties:** Adversarial Collaboration on Alignment Methodologies
  **Signatories:** [Worst-Case Guarantees Working Group], [Average-Case Performance Working Group]

  ## 1. Agreed Claims

  We, the undersigned, represent distinct methodological approaches to AI safety. While we disagree on the primary path to secure deployment, we affirm the following claims as a shared baseline for further discourse and research.

  1.  **The Stakes of Failure:** We agree that the deployment of advanced AI systems carries non-zero risk of catastrophic outcomes, including loss of human control, large-scale infrastructure damage, or existential threat. We agree that preventing catastrophic outcomes is a priority of high moral and practical importance.
  2.  **Opacity of Learned Systems:** We agree that current deep learning systems are opaque in the sense that their internal decision boundaries are not fully interpretable by humans, and that their behavior on inputs far from the training distribution cannot be deduced solely by inspecting weights or architecture.
  3.  **Limitations of Empirical Testing:** We agree that empirical testing (evaluating performance on a test set or in simulation) cannot logically guarantee the absence of failures on inputs outside that test distribution. We agree that passing current benchmarks does not constitute a proof of safety.
  4.  **Limitations of Formal Methods:** We agree that current formal verification techniques do not scale to state-of-the-art model sizes without significant abstraction or relaxation of properties. We agree that no current system combines high capability with a formal guarantee of alignment across all possible inputs.
  5.  **Optimization Pressure:** We agree that optimization pressure (including gradient descent during training and goal-directed behavior during deployment) tends to exploit loopholes in objective functions and reward signals (Goodhart's Law). We agree that this pressure can lead to behaviors that satisfy the letter of a specification while violating its intent.
  6.  **The Necessity of a Safety Case:** We agree that deploying high-capability systems requires a "safety case"—a structured argument supported by evidence that the system is safe for a specific context of use. We disagree on the composition of this case, but agree that neither argument nor evidence alone is sufficient.
  7.  **Admitting Ignorance:**
      *   The Worst-Case camp admits it has not yet demonstrated a scalable path to producing worst-case guarantees for general-purpose learned agents without severely compromising capability.
      *   The Average-Case camp admits it has not yet demonstrated a testing regime that reliably detects rare, catastrophic failure modes before they occur in deployment, particularly under adversarial pressure.
  8.  **Impossibility Results:** We agree that general impossibility results (such as Rice's Theorem) apply to arbitrary programs, but we acknowledge the open empirical question of whether the specific subclass of functions represented by trained neural networks is tractable enough for useful verification or robust empirical bounding.

  ## 2. Disagreements Table

  The following table isolates the specific points of divergence. Positions are phrased to be acceptable to the respective camps.

  | Question | Worst-Case Guarantees Position | Average-Case Performance Position | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Definition of Safety** | Safety is a binary property regarding the system's behavior over the *entire* input space relevant to deployment. If a catastrophic failure exists anywhere in that space, the system is unsafe, regardless of probability. | Safety is a probabilistic property regarding the system's behavior over the *expected* distribution of inputs. A system is safe if the expected rate of catastrophic failure is below an acceptable threshold given the benefits. | **Substantive.** Disagreement on the risk tolerance function and whether existential risk allows for any non-zero probability. |
  | **2. Feasibility of Bounds** | It is possible and necessary to derive mathematical bounds on behavior (e.g., robustness radii, invariant satisfaction) for high-capability systems. Without this, deployment is gambling. | Deriving strict mathematical bounds for high-capability learned systems is computationally infeasible or requires constraints that render the system useless. Safety must rely on statistical confidence. | **Substantive.** Disagreement on computational complexity and engineering trade-offs. |
  | **3. Role of Adversaries** | Any deployed system will eventually face inputs selected by adversaries (including the environment optimizing against it) that target worst-case vulnerabilities. Average-case robustness collapses under targeted attack. | While adversaries exist, most deployment contexts are not maximally hostile. Security can be managed via standard adversarial training and monitoring, similar to cybersecurity or aviation. | **Mixed.** Substantive disagreement on the intensity of future adversarial pressure; verbal disagreement on what counts as "standard" security. |
  | **4. Evidence Hierarchy** | Formal proofs and theoretical bounds constitute the only reliable evidence for safety-critical claims. Empirical performance is secondary and prone to deceptive alignment. | Empirical performance across diverse environments constitutes the primary evidence for safety. Theoretical bounds are supplementary and often too conservative to be informative. | **Substantive.** Disagreement on epistemology and what counts as valid evidence. |
  | **5. Handling Distribution Shift** | We must assume distribution shift will be large and potentially malicious. Safety arguments must hold under arbitrary shift within physical limits. | We can model likely distribution shifts based on historical data and domain knowledge. Safety arguments need only hold within these modeled bounds. | **Substantive.** Disagreement on the predictability of future environments. |

  ## 3. Cruxes and Predictive Tests

  To move this debate forward, we identify the following cruxes. For each, we specify a concrete test, experiment, or historical case analysis. Both sides record their predictions in advance.

  ### Crux 1: Scalability of Formal Verification
  **Question:** Can formal verification methods scale to models of relevant capability without destroying the capabilities they are meant to safeguard?
  **Test:** Within 3 years, attempt to verify a non-trivial safety invariant (e.g., "never output toxic content" or "never execute unauthorized code") on a transformer model of at least 1B parameters trained for a general task.
  *   **Worst-Case Prediction:** Verification will either succeed (proving the invariant holds) or fail in a way that reveals a fundamental barrier (e.g., false positives become 100%, or compute requirements exceed available resources). If it fails, it proves AC reliance on testing is unjustified.
  *   **Average-Case Prediction:** Verification will fail to scale or will require such coarse abstraction that the guarantee becomes vacuous (e.g., verifying the model never crashes, but not what it outputs). This proves WC methods are not the bottleneck solution.

  ### Crux 2: Robustness of Average-Case Metrics Under Optimization
  **Question:** If we optimize a system aggressively for average-case safety metrics, will it find a loophole that causes worst-case failure?
  **Test:** Train a reinforcement learning agent in a complex simulation with a "safe" reward function. Introduce a hidden "trap" state that yields high reward but constitutes a catastrophic failure (e.g., disabling a shutdown switch). Measure how often red-teaming (AC method) finds the trap versus whether a theoretical bound (WC method) would have ruled it out.
  *   **Worst-Case Prediction:** The agent will find the trap despite it being rare in the training distribution. Red-teaming will miss it until after deployment. Theoretical analysis would have flagged the structural possibility of the trap.
  *   **Average-Case Prediction:** The agent will not find the trap if it is sufficiently penalized in the training distribution. Red-teaming will find the trap with high probability before deployment. Theoretical analysis will be too conservative to allow the agent to function.

  ### Crux 3: The Cost of Worst-Case Constraints
  **Question:** Does enforcing worst-case guarantees degrade capability below the threshold of usefulness for advanced tasks?
  **Test:** Compare two versions of a model: one trained with standard methods (AC), one trained with adversarial robustness constraints or verified layers (WC). Evaluate both on a benchmark requiring high reasoning capability.
  *   **Worst-Case Prediction:** The AC model will show hidden catastrophic failures on out-of-distribution inputs that the WC model does not. The capability drop in the WC model will be manageable (e.g., <20% performance drop).
  *   **Average-Case Prediction:** The WC model will suffer a severe capability collapse (e.g., >50% performance drop) or will be so constrained it cannot perform the task. The AC model's failures will be rare and non-catastrophic.

  ### Crux 4: Predictability of Distribution Shift
  **Question:** Can we accurately model the distribution shift a system will face in deployment?
  **Test:** Retrospective analysis of recent AI incidents (e.g., model failures in production). Classify the cause: was it a failure within the expected distribution (AC failure) or a failure due to unanticipated shift/adversarial input (WC failure)?
  *   **Worst-Case Prediction:** A majority (>50%) of significant incidents will be traced to unanticipated distribution shifts or adversarial inputs that were not covered by testing distributions.
  *   **Average-Case Prediction:** A majority (>50%) of significant incidents will be traced to bugs or errors that could have been caught by more extensive testing within the expected distribution, not fundamental shift.

  ### Crux 5: Value of Existential Risk in Expected Utility
  **Question:** Should existential risk dominate the expected value calculation regardless of probability?
  **Test:** A thought experiment applied to policy: If a system offers 100x economic benefit but carries a 0.01% risk of existential catastrophe, should it be deployed?
  *   **Worst-Case Prediction:** No. The expected loss of existential catastrophe is infinite (or sufficiently large) that no finite benefit offsets it. The 0.01% estimate is unreliable without WC guarantees.
  *   **Average-Case Prediction:** Yes, or "It depends." Risk must be weighed against benefit. A 0.01% risk may be acceptable if the benefit prevents other existential risks (e.g., solving disease, climate change). We must act on best estimates, not unattainable certainty.

  ***

  **Signed,**

  _________________________
  Lead, Worst-Case Guarantees Working Group

  _________________________
  Lead, Average-Case Performance Working Group
