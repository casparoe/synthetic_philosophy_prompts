prompt: |-
  I teach a graduate seminar on decision-making under uncertainty (about 16 students, one 90-minute session), and I have recently been making professional decisions in which I caught myself treating options with known probabilities quite differently from options whose probabilities I could not pin down, so I want to teach this material in a way that actually lands. Design an in-class game that makes students feel the force of ambiguity aversion before any theory is named. They already know expected utility theory but have not seen the Ellsberg paradox. The game should have them make a series of real, points-based choices between lotteries with known composition (for instance, an urn with 50 red and 50 black balls) and lotteries with unknown composition (for instance, an urn with 100 balls in unknown red/black proportions), arranged so that most students prefer the known-probability option in both directions and thereby produce a pattern that no single assignment of subjective probabilities can rationalize. Include at least one control pair where both options have known probabilities, so the class can see that what is doing the work is not ordinary risk aversion. Give me exact rules, materials, a payoff scheme that does not require real money, and a debrief that reconstructs the students' choices on the board and shows exactly where expected utility fails. Also tell me what will predictably go wrong the first time I run it—students hedging, changing answers to look consistent, or being primed by the setup—and how to handle it, and be frank about which feature of ambiguity aversion the game cannot reproduce on its own (for example, the distinction between ambiguity about the urn's composition and mere uncertainty about the draw) and that I will need to supply.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Graduate students (approx. 16), already know Expected Utility Theory (EUT), haven't seen Ellsberg Paradox.
      *   **Goal:** Create an in-class game/experience that makes them *feel* ambiguity aversion before theory is named.
      *   **Constraints:** 90-minute session (this is just one part of it), points-based payoff (no real money), needs specific rules, materials, payoff scheme, debrief, and troubleshooting.
      *   **Key Mechanism:** Choices between known probabilities (Risk) and unknown probabilities (Ambiguity) that lead to a contradiction in EUT (preferring known in both directions).
      *   **Requirements:** Include a control pair (Risk vs. Risk), explain exactly where EUT fails on the board, predict failure modes (hedging, consistency bias), and admit limitations of the game.

  2.  **Deconstruct the Ellsberg Paradox for the Classroom:**
      *   *Standard Setup:* Urn A (50 Red, 50 Black). Urn B (100 Red/Black, unknown ratio).
      *   *Choice 1:* Bet on Red from A vs. Bet on Red from B. (Most pick A).
      *   *Choice 2:* Bet on Black from A vs. Bet on Black from B. (Most pick A).
      *   *Contradiction:* If I think Urn B has $p$ chance of Red, I must think it has $1-p$ chance of Black. If I prefer A in Choice 1, I imply $0.5 > p$. If I prefer A in Choice 2, I imply $0.5 > 1-p$ (or $p > 0.5$). Contradiction.
      *   *Adaptation for Class:* Needs to be quick, engaging, and use points.

  3.  **Design the Game ("The Two-Urn Challenge"):**
      *   *Materials:* Two physical urns (or boxes/bags).
          *   Urn 1 (Risk): Transparent or clearly labeled. 50 Red chips, 50 Black chips.
          *   Urn 2 (Ambiguity): Opaque. 100 chips, ratio determined by a random process *before* class but sealed, or simply "unknown to you."
      *   *Payoff:* Course credit points or "class currency" redeemable for a small privilege (e.g., dropping a quiz, choosing a topic). Let's use "Seminar Points" redeemable for a minor grade bonus or simply bragging rights + chocolate. To make it "real" without money, tie it to a raffle at the end of the semester or a small immediate reward (candy/coffee). Let's suggest a "Seminar Credit" system where top scorers get a small participation boost.
      *   *Structure:*
          1.  Control Pair (Risk vs. Risk).
          2.  Ellsberg Pair 1 (Risk vs. Ambiguity - Color A).
          3.  Ellsberg Pair 2 (Risk vs. Ambiguity - Color B).
      *   *Anonymity:* Crucial to prevent consistency bias. Use secret ballots.

  4.  **Drafting the Protocol:**
      *   *Setup:* 10 mins.
      *   *Game:* 20 mins.
      *   *Debrief:* 30 mins.
      *   *Theory:* 30 mins (though the prompt focuses on the game/debrief).
      *   *Steps:*
          1.  Show Urn 1 (50/50).
          2.  Show Urn 2 (100 balls, unknown mix).
          3.  Round 1 (Control): Bet Red on Urn 1 vs. Bet Red on Urn 1 (different payoff? No, keep it simple). Actually, better Control: Bet Red on Urn 1 vs. Bet Black on Urn 1. (Indifference expected). Or Bet Red Urn 1 vs. Bet Red Urn 1 (Trivial). Let's do: Bet Red Urn 1 vs. Bet Black Urn 1. EUT says indifferent.
          4.  Round 2: Bet Red Urn 1 vs. Bet Red Urn 2.
          5.  Round 3: Bet Black Urn 1 vs. Bet Black Urn 2.
      *   *Incentive:* One random student's sheet gets drawn for actual points. This ensures truth-telling (incentive compatibility).

  5.  **Refining the Payoff/Incentive:**
      *   Graduate students care about grades/time.
      *   Mechanism: "One sheet will be drawn at random. That student gets 1 bonus point for every winning bet they made."
      *   This creates ex-ante incentive to maximize expected points on every line.

  6.  **Developing the Debrief (The Math):**
      *   Board work is essential.
      *   Define $P(R_1) = 0.5$, $P(B_1) = 0.5$.
      *   Define subjective $P(R_2) = p$. Therefore $P(B_2) = 1-p$.
      *   Show the inequalities derived from majority choices.
      *   Show $0.5 > p$ AND $0.5 > 1-p \Rightarrow 1 > 1$, impossible.
      *   Conclusion: EUT assumes additive probabilities. Ambiguity aversion violates this.

  7.  **Anticipating Failure Modes:**
      *   *Hedging:* Students might split choices to look rational. *Fix:* Emphasize "pick the one you genuinely prefer."
      *   *Consistency Bias:* If they see the pattern, they might change answers. *Fix:* Collect sheets immediately after each round or use a single sheet folded up.
      *   *Trust:* Do they believe Urn 2 is truly unknown? *Fix:* Have a student shuffle/seal Urn 2 before class starts or in front of them.
      *   *Confusion:* Risk aversion vs. Ambiguity. *Fix:* The Control Pair handles risk aversion (linear payoff makes them risk neutral usually, but the control shows symmetry).

  8.  **Addressing the "Limitations" Requirement:**
      *   The game shows *behavior* but doesn't explain *why*.
      *   It doesn't distinguish between "uncertainty about the draw" (risk) and "uncertainty about the parameter" (ambiguity) without verbal framing.
      *   It doesn't capture dynamic ambiguity (learning over time).
      *   It relies on the "One Random Sheet" incentive mechanism which assumes risk neutrality over the *experiment* itself (though with 16 students, the probability is low enough it feels like a lottery).

  9.  **Structuring the Response:**
      *   **Title:** The Two-Urn Protocol.
      *   **Materials:** Specific list.
      *   **Incentive Structure:** How to make points matter.
      *   **Procedure:** Step-by-step script.
      *   **The Board Work:** Visualizing the contradiction.
      *   **Troubleshooting:** What goes wrong.
      *   **Limitations:** What the instructor must add verbally.

  10. **Refining the Control Pair:**
      *   If I do Red Urn 1 vs Black Urn 1, risk aversion shouldn't matter (same variance).
      *   Better Control: Red Urn 1 (Win 10 pts) vs Red Urn 1 (Win 10 pts). No, that's trivial.
      *   Best Control for Risk Aversion: A sure thing vs. a gamble. But Ellsberg is about Risk vs. Ambiguity.
      *   Let's stick to the prompt's request: "Control pair where both options have known probabilities."
      *   Choice C: Bet Red on Urn 1 vs. Bet Black on Urn 1.
      *   Why? If they prefer Red over Black on the *known* urn, they have a color bias. If they are indifferent, it establishes the baseline.
      *   Actually, a better control for *Risk Aversion* specifically is: Option A (50% win) vs Option B (50% win).
      *   Let's use: **Choice 0:** Bet Red on Urn 1 vs. Bet Black on Urn 1. (Tests color bias).
      *   **Choice 1:** Bet Red on Urn 1 vs. Bet Red on Urn 2.
      *   **Choice 2:** Bet Black on Urn 1 vs. Bet Black on Urn 2.
      *   This is the standard Ellsberg 2-Urn setup.

  11. **Final Polish:**
      *   Make sure the tone is appropriate for a graduate seminar (respectful of their intelligence, focused on pedagogy).
      *   Ensure the "One Random Student" rule is clear (incentive compatibility).
      *   Check the math in the debrief section.

  12. **Self-Correction on "Risk Aversion Control":**
      *   The prompt asks for a control to show "what is doing the work is not ordinary risk aversion."
      *   Standard Ellsberg uses linear payoffs (Win 100 or 0). Risk aversion applies to concave utility over wealth. If the stakes are small (points), utility is roughly linear.
      *   However, to be rigorous: A control pair where both are *known* but one has higher variance? No, Ellsberg compares Known 50/50 vs Unknown.
      *   The best control is simply showing that they are indifferent between Red and Black on the Known Urn. If they were just risk-averse, they would treat Urn 1 and Urn 2 the same (both are 50/50 *objectively* or *subjectively* under Laplace).
      *   Wait, the prompt says: "Include at least one control pair where both options have known probabilities."
      *   Okay, I will add **Choice 0**: Win if Red (Urn 1) vs. Win if Black (Urn 1).
      *   If they pick Red here, they have a color bias. We need to net that out.
      *   Actually, a better control for *Risk Aversion* in the context of Ellsberg is usually implicit because the variance of the ambiguous urn is often perceived as higher.
      *   Let's interpret the prompt's request literally: A choice between Two Knowns.
      *   I will add a "Calibration Choice": Urn 1 (Red) vs Urn 1 (Black). This establishes that $U(Red) = U(Black)$ for the known urn.

      *(Self-Correction)*: Wait, to show it's not risk aversion, we need to show they treat two *risky* lotteries consistently, but treat *risky* vs *ambiguous* inconsistently.
      *   Okay, I will stick to the standard 3 choices but emphasize the symmetry of Urn 1 in the debrief.
      *   Actually, I can add a 4th choice: Urn 1 (Red) vs Urn 1 (Red). (Trivial).
      *   Let's stick to the strongest pedagogical move: **Choice 0: Urn 1 Red vs Urn 1 Black.** This proves they acknowledge the 50/50 nature of Urn 1. If they split 50/50 on this, but cluster on Urn 1 for the other two, it's not risk aversion, it's ambiguity.

  13. **Final Review against constraints:**
      *   16 students? Yes, small enough for discussion.
      *   90 mins? Yes, game fits in 30-40 mins leaving time for theory.
      *   Points based? Yes.
      *   Debrief on board? Yes.
      *   Predictable errors? Yes.
