answer: |-
  # The Two-Urn Protocol: An In-Class Experiment on Ambiguity Aversion

  This protocol is designed for a 90-minute graduate seminar. It consumes approximately 35 minutes of class time (10 min setup, 10 min play, 15 min debrief), leaving ample time for the formal theory (Maxmin Expected Utility, Smooth Ambiguity, etc.).

  ## 1. Materials & Preparation

  *   **Two Opaque Containers:** Labeled **Urn A** and **Urn B**. (Tupperware with lids or cloth bags work best; they must not be see-through).
  *   **200 Poker Chips or Colored Balls:** 100 Red, 100 Black.
  *   **Decision Sheets:** Small slips of paper (one per student).
  *   **Incentive:** A bag of high-quality chocolates or a "Seminar Credit" ledger (e.g., top 3 scores get +1% on final participation grade).
  *   **Pre-Class Prep:**
      *   **Urn A (Risk):** Place exactly 50 Red and 50 Black chips inside. Seal it. Write "50 Red, 50 Black" on the outside.
      *   **Urn B (Ambiguity):** Place 100 chips inside. **Crucial:** The ratio must be determined by a process unknown to the students. *Best method:* Before class, roll a die or use a random number generator to pick a number $k$ between 0 and 100. Put $k$ Red and $100-k$ Black chips in Urn B. Seal it. Write "100 Chips. Ratio Unknown" on the outside.
      *   **Verification:** Invite a student volunteer at the start of class to verify Urn A's contents and verify that Urn B is sealed and contains 100 chips (by weight or counting into a temporary container and back) without revealing the color mix.

  ## 2. Incentive Scheme (Incentive Compatibility)

  Graduate students will not care about "fake" points. You need **Random Lottery Incentive System (RLIS)**.

  **The Rule:** "At the end of class, I will draw one student's name at random. I will then draw one of their three choices at random. If that bet wins, you receive [Reward X]. If it loses, you receive nothing."

  *   **Reward X:** 5 Bonus Points toward participation / A $20 Gift Card / A Bag of Premium Chocolate.
  *   **Why this works:** It makes every decision individually consequential. A risk-neutral expected-utility maximizer should maximize the probability of winning on *every* line, because any line could be the one that pays.

  ## 3. The Game Procedure (10 Minutes)

  Distribute the Decision Sheets. They should look like this:

  > **Name (Optional):** _______________
  >
  > **Payoff:** If your selected bet wins, you get [Reward].
  >
  > **Choice 0 (Control):**
  > ( ) **A-Red:** Draw from Urn A. Win if **Red**. (Known: 50 Red, 50 Black)
  > ( ) **A-Black:** Draw from Urn A. Win if **Black**. (Known: 50 Red, 50 Black)
  >
  > **Choice 1:**
  > ( ) **A-Red:** Draw from Urn A. Win if **Red**. (Known: 50 Red, 50 Black)
  > ( ) **B-Red:** Draw from Urn B. Win if **Red**. (Unknown Ratio)
  >
  > **Choice 2:**
  > ( ) **A-Black:** Draw from Urn A. Win if **Black**. (Known: 50 Red, 50 Black)
  > ( ) **B-Black:** Draw from Urn B. Win if **Black**. (Unknown Ratio)

  **Script:**
  1.  **Introduce Urns:** Show Urn A (transparently labeled 50/50). Show Urn B (sealed, unknown mix).
  2.  **Explain Incentives:** Read the RLIS rule clearly. Emphasize: *"Treat every choice as if it is the only one that matters."*
  3.  **Silence:** Ask students to fold their sheets immediately after marking to prevent peer influence.
  4.  **Collection:** Collect sheets in a box.
  5.  **The Draw (Optional but dramatic):** If time permits, draw the winning student and the winning choice immediately. If the bet is on Urn B, open Urn B, draw a chip, and resolve. If the bet is on Urn A, draw from Urn A. *Note: If you resolve Urn B now, you destroy the ambiguity for the debrief. Better to resolve the payoff after class or keep the ratio secret.* **Recommendation:** Do not open Urn B until after the debrief is complete to preserve the "unknown" state during the theory discussion. Promise to email the result.

  ## 4. The Debrief: Reconstructing the Contradiction (15 Minutes)

  This is the core pedagogical moment. Do not name "Ellsberg" yet. Ask students to describe what they did.

  **Step 1: Tally the Votes**
  Draw a table on the board. Ask for a show of hands for each choice.

  | Choice | Option 1 (Urn A) | Option 2 (Urn B) | Indifferent |
  | :--- | :---: | :---: | :---: |
  | **0 (Control)** | A-Red | A-Black | |
  | **1** | A-Red | B-Red | |
  | **2** | A-Black | B-Black | |

  *Predicted Result:*
  *   Choice 0: Roughly 50/50 split (no color bias).
  *   Choice 1: Majority pick **A-Red**.
  *   Choice 2: Majority pick **A-Black**.

  **Step 2: The Expected Utility Reconstruction**
  Ask a student to define the Expected Utility of a bet. Write the standard formulation on the board.

  *   Let $U(Win) = 1$ and $U(Lose) = 0$.
  *   For Urn A, we know objective probabilities: $P(A_{Red}) = 0.5$, $P(A_{Black}) = 0.5$.
  *   For Urn B, under Subjective Expected Utility (SEU), you must have a subjective probability estimate for Red. Let's call it $p$.
  *   Consequently, your subjective probability for Black must be $1-p$.

  **Step 3: Deriving the Contradiction**
  Walk through the majority choices mathematically.

  1.  **Analyze Choice 1:** "Most of you preferred A-Red over B-Red."
      *   $EU(A\text{-}Red) > EU(B\text{-}Red)$
      *   $0.5 \times 1 > p \times 1$
      *   **Implies:** $0.5 > p$
      *   *Interpretation:* You acted as if Urn B has *less than* 50% Red balls.

  2.  **Analyze Choice 2:** "Most of you preferred A-Black over B-Black."
      *   $EU(A\text{-}Black) > EU(B\text{-}Black)$
      *   $0.5 \times 1 > (1-p) \times 1$
      *   **Implies:** $0.5 > 1 - p$
      *   **Rearrange:** $p > 0.5$
      *   *Interpretation:* You acted as if Urn B has *more than* 50% Red balls.

  3.  **The Collision:**
      *   Write on board: **$p < 0.5$ AND $p > 0.5$**.
      *   Ask: "Is there a number $p$ that satisfies this?" (No).
      *   Ask: "Does this mean you are irrational?" (Let them debate).
      *   Ask: "Could this be Risk Aversion?"
          *   Point to Choice 0. In Choice 0, both options had variance. You were roughly indifferent.
          *   In Choices 1 & 2, Urn A had the *same* variance in both cases. Urn B had the *same* variance in both cases.
          *   If you were simply avoiding variance (risk aversion), your preference between A and B should not flip depending on whether you bet on Red or Black. The variance of the *payoff* is identical in Choice 1 and Choice 2 (50% win chance vs unknown win chance).
          *   **Conclusion:** Standard Risk Aversion (concave utility over wealth) cannot explain this. The problem is not the *risk* (variance), it is the *ambiguity* (unknown probability measure).

  **Step 4: Naming It**
  Now introduce the **Ellsberg Paradox (1961)**. Explain that this violation led to models like **Maxmin Expected Utility (Gilboa & Schmeidler)**, where agents maximize utility against the "worst-case" prior.
  *   In Choice 1, worst case for Urn B is $p \approx 0$.
  *   In Choice 2, worst case for Urn B is $1-p \approx 0$ (so $p \approx 1$).
  *   Since the "worst case" changes depending on the bet, you switch preferences.

  ## 5. Predictable Failure Modes & Troubleshooting

  **1. The "Hedging" Problem**
  *   **What happens:** Students realize the contradiction during the game and split their choices (Pick A in Choice 1, Pick B in Choice 2) to appear rational.
  *   **Fix:** Emphasize anonymity. "I will not look at individual sheets unless you are the random winner. I am interested in the aggregate distribution, not your personal consistency." Collect sheets face down immediately.

  **2. The "Trust" Problem**
  *   **What happens:** Students suspect Urn B is actually 50/50 and you are tricking them.
  *   **Fix:** Have a student shuffle and seal Urn B at the very beginning of class, before you even announce the game. Put the remaining chips in a separate bag so they know the total population was 100, but the allocation was random.

  **3. The "Risk Aversion" Confusion**
  *   **What happens:** Students argue, "I just prefer the known variance."
  *   **Fix:** This is actually the definition of ambiguity aversion, but they often conflate it with standard risk aversion (diminishing marginal utility). Use the Control Pair (Choice 0). If they were risk-averse regarding variance, they should be indifferent between A-Red and A-Black (same variance). They are. The shift happens only when comparing Known vs. Unknown. Remind them that under SEU, "Unknown" simply collapses to a number $p$. If they assign $p=0.5$ (Laplace principle), they should be indifferent. If they assign $p \neq 0.5$, they should switch preferences between Red and Black bets. They do neither.

  **4. Low Stakes / Boredom**
  *   **What happens:** 16 grad students might not care about chocolate.
  *   **Fix:** Tie it to the seminar culture. "The winner gets to choose the topic for Week 10" or "The loser buys coffee." Or, use the "Random Student" draw to excuse one homework assignment. Make the stakes social or academic, not just monetary.

  ## 6. Limitations: What the Game Cannot Do

  Be frank with your students about what this experiment leaves out. You must supply the following verbally:

  1.  **Source vs. Parameter Uncertainty:** The game treats "unknown composition" as a static state. It does not distinguish between *fundamental uncertainty* (the universe hasn't decided yet) and *epistemic uncertainty* (the universe decided, I just don't know). In real professional decisions (like your own), ambiguity often comes from a lack of data rather than a sealed urn. The game abstracts this away.
  2.  **Dynamic Learning:** In the real world, if you could draw from Urn B ten times, the ambiguity would resolve. This game is one-shot. It does not capture the value of information seeking, which is a major component of professional ambiguity management.
  3.  **Competence Hypothesis:** Research (e.g., Heath & Tversky) suggests people are ambiguity *seeking* if they feel competent in the domain. If you asked these students to bet on a topic within their specific dissertation expertise vs. a random urn, they might prefer the "ambiguous" expert judgment over the known random chance. The urn game forces ambiguity aversion because no one is an "expert" on chips. You need to discuss how domain expertise flips the preference.
  4.  **The "Sure Thing" Nuance:** This is the 2-Urn version. The original Ellsberg 3-Color paradox is logically tighter because it controls for subjective probability priors more rigorously. The 2-Urn version relies on the assumption that students *should* assign $p=0.5$ to Urn B under SEU (Principle of Insufficient Reason). A sophisticated student might argue, "I didn't assume 0.5; I assumed a distribution over $p$." You will need to explain that even with a distribution over $p$, SEU integrates to a single expected $p$, leading back to the contradiction.

  ## 7. Summary Checklist for the Instructor

  *   [ ] **Verify Urn B** is truly sealed and ratio unknown (use a student witness).
  *   [ ] **Prepare Decision Sheets** with the 3 choices clearly laid out.
  *   [ ] **Define Reward** clearly (RLIS mechanism).
  *   [ ] **Board Work:** Pre-plan the space for the $p < 0.5$ vs $p > 0.5$ contradiction.
  *   [ ] **Closing:** Have a plan to resolve the winning bet (open Urn B after class or via email) to maintain trust for future sessions.

  This design forces the contradiction physically and financially before you write down a single axiom. When you finally introduce the math, they aren't learning a puzzle; they are learning a formal description of their own behavior.
