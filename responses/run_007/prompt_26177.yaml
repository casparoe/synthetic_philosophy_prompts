      *   *Which verdicts must be abandoned?*
          *   To be consistent with epiphenomenalism (or even non-reductive physicalism without overdetermination), the user must abandon the intuition that consciousness *itself* causes the report in the **Stubbed Toe** and **Lucid Dream** cases.
          *   They must also refine the **Blindsight/Anaesthesia** verdict: it's not the *absence of consciousness* causing the report, but the *physical state associated with that absence*.

