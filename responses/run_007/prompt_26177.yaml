  2.  **Evaluate the User's Cases & Verdicts:**
      *   *Stubbed Toe:* User says consciousness causes the report. (Intuitively strong, but philosophically contentious for epiphenomenalists).
      *   *Blindsight:* User says *absence* of consciousness causes the report. (Problematic: if consciousness is epiphenomenal, its absence shouldn't matter causally either, unless the absence correlates with a physical difference).
      *   *Anton's Syndrome:* User says epiphenomenal (brain damage causes both). (Consistent with epiphenomenalism).
      *   *Anaesthesia:* User says *absence* causes report, but realises this breaks epiphenomenalism. (Good catch).
      *   *Change Blindness:* User says epiphenomenal (common cause). (Consistent with epiphenomenalism).
      *   *Lucid Dream:* User says consciousness causes report. (Similar to stubbed toe).

  3.  **Identify the Core Philosophical Tension:**
      *   The user is oscillating between *phenomenological intuition* (it feels like my pain made me speak) and *physicalist causation* (the neural correlate did the work).
      *   The "Anaesthesia/Blindsight" problem highlights a category error. If $C$ (consciousness) is epiphenomenal, then $\neg C$ (absence of consciousness) is also causally inert *qua* consciousness. The causal work is always done by the physical substrate ($P$).
      *   The user's intuition that "absence of experience causes the report" in blindsight/anaesthesia is actually shorthand for "the physical state corresponding to the absence of experience causes the report."

  4.  **Formulate a Unifying Principle:**
      *   We need a principle that respects the physicalist closure of the causal domain (which a molecular biologist would likely accept) while accounting for the *explanatory relevance* of consciousness.
      *   *Principle:* **The Common Cause Principle (or Screening Off).** In all these cases, the neural substrate ($N$) causes both the conscious state ($C$) and the behavioural report ($R$).
      *   If $N \rightarrow C$ and $N \rightarrow R$, then $C$ does not cause $R$. $C$ is a side effect.
      *   *Why the intuition differs:* In some cases (Stubbed Toe, Lucid Dream), $C$ supervenes on $N$ in a way that makes $C$ a reliable *marker* for $N$. In others (Anton's, Change Blindness), the dissociation is clearer.
      *   *Better Principle for the User:* **The Causal Closure of the Physical.** If we accept physicalism (which molecular biology suggests), every physical event (speaking) has a sufficient physical cause. If the conscious state is non-physical (or distinct from the physical state), it has no work to do.
      *   *Refined Principle:* **The Distinction between Causal Efficacy and Explanatory Relevance.** Consciousness might not be *causally efficacious* (it doesn't push neurons), but it is *explanatorily relevant* (knowing $C$ tells us about $N$).
      *   *Wait, let's look for a principle that forces a choice.* The user wants to know which verdict to abandon.
      *   *The "Overdetermination" Trap:* If $N$ causes $R$ and $C$ causes $R$, $R$ is overdetermined. Most philosophers reject systematic overdetermination.
      *   *The Principle:* **Causal Exclusion.** If a physical cause is sufficient for an effect, no distinct non-physical cause is needed or possible.
      *   *Application:* If we accept Causal Exclusion, *none* of the cases where the user says "consciousness causes the report" (Stubbed Toe, Lucid Dream) can be literally true. The neural correlate did it.
      *   *However,* the user's intuition about "absence" in Blindsight/Anaesthesia is also tricky. The absence of $C$ is just the presence of $\neg N$ (the specific neural state).

