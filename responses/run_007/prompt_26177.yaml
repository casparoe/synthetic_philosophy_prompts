      *   Ensure the distinction between *causal efficacy* and *counterfactual dependence* is clear, as this often resolves the "stubbed toe" intuition. (i.e., If the pain hadn't been there, the neurons wouldn't have been there, so I wouldn't have spoken. But the neurons did the pushing, not the qualia).

