answer: |-
  ### Sidebar: The Same Data, Two Verdicts

  **The Scenario**
  A team preregisters a direct replication of a well-known psychological finding: the "Anchoring Effect," where exposure to a high number increases subsequent estimates. The original study reported a standardized effect size of **Cohen's *d* = 0.50**.

  The replication team commits to two analysis plans in advance:
  1.  **Frequentist:** A standard two-sided *t*-test on the replication data alone ($\alpha = 0.05$).
  2.  **Bayesian:** A model updating a prior belief based on the original literature with the new replication data.

  **The Data**
  The study is completed with **100 participants** (50 per condition). The data are clean, with no exclusions or optional stopping.
  *   **Observed Effect (*d*):** 0.38
  *   **Standard Error (SE):** 0.20

  ***

  **Analysis 1: The Frequentist**
  The analyst calculates a *t*-statistic to test the null hypothesis that the true effect is exactly zero ($H_0: \theta = 0$).

  *   **Calculation:** $t = \text{Effect} / \text{SE} = 0.38 / 0.20 = 1.90$.
  *   **Degrees of Freedom:** 98.
  *   **p-value (two-tailed):** 0.060.
  *   **95% Confidence Interval:** $-0.02$ to $0.78$.

  **Verdict:** **Effect Not Significant.**
  Because $p > 0.05$ and the confidence interval includes zero, the analyst concludes the replication **failed**. The data are statistically compatible with the null hypothesis.

  ***

  **Analysis 2: The Bayesian**
  The analyst argues that in a replication, we should not start from total ignorance. They construct an **informative prior** centered on the original finding, reflecting the belief that if the effect exists, it is likely near the original estimate.
  *   **Prior Distribution:** Normal($\mu=0.50, \sigma=0.15$).
  *   **Likelihood (The Data):** Normal($\mu=0.38, \sigma=0.20$).

  Using standard Bayesian updating formulas (precision-weighted averaging), the analyst derives the **Posterior Distribution**:
  *   **Posterior Mean:** 0.46
  *   **Posterior SD:** 0.12
  *   **Probability Effect > 0:** 99.9% (Z-score = 3.83).
  *   **95% Credible Interval:** $0.22$ to $0.70$.

  **Verdict:** **Effect Supported.**
  Because the 95% credible interval excludes zero and the probability of a positive effect is near-certainty, the analyst concludes the replication **succeeded**. The data strongly shift belief away from the null.

  ***

  **Why They Disagree**
  The divergence is not arithmetic; it is structural.
  *   **The Frequentist** asks: *"Is this data unlikely if the effect were exactly zero?"* With $p=0.06$, the answer is "not quite unlikely enough." The test treats the null as a fixed point of reference.
  *   **The Bayesian** asks: *"Given what we knew before, where is the effect likely to be now?"* Because the prior concentrated probability mass away from zero (based on the original study), and the data were consistent with that mass, the posterior remains far from zero.

  **The Critical Feature: The Prior**
  The disagreement hinges entirely on the Bayesian's **informative prior**.
  *   **If removed:** If the Bayesian used a "default" prior (e.g., a wide distribution centered at zero, agnostic to the original study), the Bayes Factor would likely favor the null ($BF_{10} < 1$) because $t=1.90$ is weak evidence for a point-null test in isolation. The Bayesian would then agree with the Frequentist.
  *   **Why keep it?** A replication specialist argues the prior is defensible: ignoring the original study's data when analyzing a replication wastes information. The prior represents the state of knowledge *before* the replication was run.

  **Mutual Criticism**
  *   **The Frequentist's Critique:** "Your conclusion is circular. You assumed the effect was real (by centering your prior at 0.50), so naturally, you concluded it was real. A replication should test the effect against zero, not against itself."
  *   **The Bayesian's Critique:** "Your binary threshold is brittle. You treat $p=0.06$ as 'failure' and $p=0.04$ as 'success,' even though the data are nearly identical. By ignoring the prior literature, you treat a replication as an isolated event, requiring it to be louder than the original study to count as evidence."

  ***

  **Check the Arithmetic**
  *   **Frequentist CI:** $0.38 \pm (1.984 \times 0.20) \approx [-0.02, 0.78]$. (Uses $t_{crit}$ for $df=98$).
  *   **Posterior Precision:** $1/\sigma^2$. Prior Precision $= 1/0.15^2 \approx 44.4$. Data Precision $= 1/0.20^2 = 25.0$. Total Precision $= 69.4$.
  *   **Posterior Mean:** $[(44.4 \times 0.50) + (25.0 \times 0.38)] / 69.4 \approx 0.46$.
  *   **Posterior SD:** $1 / \sqrt{69.4} \approx 0.12$.
  *   **Posterior Z:** $0.46 / 0.12 = 3.83 \rightarrow P > 99.9\%$.
