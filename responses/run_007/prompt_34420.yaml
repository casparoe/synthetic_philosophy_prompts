answer: |-
  You have hit on one of the most sophisticated and common sticking points in Putnam's "The Meaning of 'Meaning'." Your intuition is sharp: there *is* a relationship between Twin Earth and the Division of Linguistic Labor (DoLL), but they are doing two different jobs.

  To answer your main question directly: **Yes, for the Twin Earth argument to work as a refutation of internalism, the chemical difference must be undiscovered by everyone (including experts) at the time of the comparison.**

  Here is how to resolve the tension you're feeling between the two parts of Putnam's paper.

  ### 1. The "1750" Clause is Crucial
  You noticed that if Twin Earthlings *know* their water is XYZ, their heads are different from ours. You are absolutely right. If they have the belief "Water is XYZ" and we have the belief "Water is H2O," then our psychological states differ. If psychological states differ, an internalist could say, "Aha! Meaning is in the head, and since your heads are different, your meanings are different."

  To block this, Putnam explicitly sets the Twin Earth thought experiment in **1750**.
  *   In 1750, chemistry was not advanced enough to distinguish H2O from XYZ.
  *   Therefore, the "experts" on Twin Earth *also* believe water is a simple liquid.
  *   Therefore, Oscar (Earth) and Twin-Oscar (Twin Earth) have **identical narrow psychological states**.

  Putnam needs the difference to be undiscovered to prove that **reference is determined by the actual physical environment, not by the description or beliefs in the speaker's head.** If the difference were known, the argument would collapse into a trivial case of "different beliefs cause different meanings."

  ### 2. Twin Earth vs. Division of Linguistic Labor
  Your confusion stems from thinking that if the difference is undiscovered, the **Division of Linguistic Labor (DoLL)** is doing all the heavy lifting. It feels like: *"The meaning is fixed by the experts who will eventually find the hidden structure."*

  But Putnam uses these two arguments for different purposes:

  **Twin Earth establishes Externalism (Metaphysics of Reference):**
  This argument proves that what fixes the reference of a word is the **causal connection** between the word and the stuff in the world, not the concepts in the head. Even if there were *no* experts on Twin Earth (e.g., if Twin-Oscar were a hermit), his word "water" would still refer to XYZ, not H2O. Why? Because he is causally interacting with XYZ. The DoLL is not required for reference to be external; it is only required for *social communication*.

  **Division of Linguistic Labor explains Competence (Sociology of Usage):**
  This argument explains how *you and I* can use words like "elm" or "gold" correctly even though we can't identify them ourselves. It explains how reference is **transmitted** through a community.
  *   **Twin Earth says:** Reference is fixed by the world (Externalism).
  *   **DoLL says:** You don't need to know *how* it's fixed to use the word; you can borrow the reference from experts (Social Externalism).

  ### 3. The Role of the Experts
  Here is the subtle correction to your worry about the experts. You wrote: *"the meaning was always fixed by the hidden structure."*

  Putnam would say: **The meaning is fixed by the stuff, not by the experts' knowledge of the stuff.**

  On Twin Earth (1750), the experts *do not know* it is XYZ. They think it is water. If the meaning depended on the *experts' knowledge*, then the meaning on Twin Earth would be the same as Earth (because the experts have the same knowledge).
  *   **Internalist/Descriptivist view:** Meaning = What the experts describe/believe. (In 1750, experts on both planets believe the same thing. So meaning should be the same.)
  *   **Putnam's view:** Meaning = The actual underlying nature of the stuff the experts are interacting with. (In 1750, experts on Earth interact with H2O, experts on Twin Earth interact with XYZ. So meaning is different, *even though the experts don't know it yet*.)

  So, the DoLL doesn't save internalism here. The DoLL just explains how the *non-experts* get to ride the coattails of that causal connection.

  ### 4. Resolving the Tension
  To summarize the fit between the two arguments:

  1.  **Twin Earth (1750)** creates a scenario where **Heads are Identical** but **Worlds are Different**.
      *   *Result:* Meanings are Different.
      *   *Conclusion:* Meaning isn't in the head (Internalism is false).
  2.  **Division of Linguistic Labor** explains how **Individual Ignorance** is compatible with **Correct Reference**.
      *   *Result:* I can say "gold" without knowing atomic number 79.
      *   *Conclusion:* I rely on the community's causal link to the stuff.

  **Your Dilemma Solved:**
  *   **If the difference is known:** The heads are different. Twin Earth fails as a counterexample to internalism. (Putnam avoids this by using 1750).
  *   **If the difference is unknown:** The heads are identical. Twin Earth succeeds. This is *not* just DoLL, because DoLL explains how I borrow reference, whereas Twin Earth explains *what the reference is borrowed from* (the physical essence).

  ### The Takeaway
  You aren't missing a contradiction; you are seeing the dependency between the two arguments.
  *   **Twin Earth** proves that meaning depends on the external world (Externalism).
  *   **Division of Linguistic Labor** explains how that external meaning gets distributed through society so that non-experts can use it.

  Without Twin Earth, DoLL doesn't work (because if meaning were in the head, experts couldn't fix it for us). Without DoLL, Twin Earth leaves us wondering how normal people use scientific terms. They fit together as **Metaphysical Foundation** (Twin Earth) + **Social Mechanism** (DoLL).

  So, your instinct was right: For the logic to hold, the chemical nature *must* be hidden from everyone at the time of the thought experiment. Putnam knows this, which is why he insists on the year 1750.
