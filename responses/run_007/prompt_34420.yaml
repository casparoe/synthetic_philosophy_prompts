      *   **Twin Earth (1750):** Crucial detail. Putnam specifies the year 1750. Why? Because chemistry wasn't advanced enough to distinguish H2O from XYZ *anywhere*.
      *   **Division of Linguistic Labor:** This explains how *non-experts* refer to things they can't identify. It supports externalism by showing that even if *I* don't know the essence, the word still picks out the essence via the community.
      *   **Relationship:** Twin Earth establishes the *metaphysical* point (reference is determined by causal connection to stuff). DoLL establishes the *sociological* mechanism (how that reference gets transmitted to non-experts).

  3.  **Address the User's Dilemma Point-by-Point:**

