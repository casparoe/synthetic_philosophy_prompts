          *   If they knew it was XYZ, they would have a concept like "XYZ" or "Twin-Water," and their internal state would differ. Putnam wants to show that even with *identical* internal states, extension differs.

      *   *Point 2: Is Twin Earth just a special case of DoLL?*
          *   No, they do different jobs.
          *   Twin Earth shows that *environment* matters (Externalism).
          *   DoLL shows that *individual competence* isn't required for reference (Social Externalism).
          *   Even if there were no experts (e.g., a hermit on Twin Earth), the hermit's "water" would still refer to XYZ because of the causal link to the liquid, not because of an expert. DoLL explains how the *community* shares the reference, but Twin Earth explains *what fixes the reference* in the first place.

      *   *Point 3: The "Heads Aren't Identical" Objection (Scenario B).*
          *   The user is right: If Twin Earthlings know it's XYZ, their heads are different.
          *   But Putnam's argument relies on the 1750 scenario precisely to avoid this. The "Narrow Psychological State" is defined as what is identical between the duplicates. If knowledge differs, narrow state differs. So, for the argument to hold, the chemical nature *must* be hidden from everyone (including experts) at the time of the comparison.

