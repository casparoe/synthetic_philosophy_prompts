      *   Refining for punchiness: The legal system implicitly relies on a hybrid theory of punishment that uses retributive desert as a constraint on liability but permits consequentialist factors like dangerousness and culpability to determine sentence length, treating prior convictions as evidence of heightened moral blameworthiness rather than double jeopardy or pure risk prediction.

  5.  **Develop the Reasoning:**
