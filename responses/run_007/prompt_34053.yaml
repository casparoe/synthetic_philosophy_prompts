answer: |-
  The legal system implicitly operates on a hybrid theory of punishment that restricts liability to wrongful acts but calibrates severity based on heightened culpability and proven dangerousness, treating prior convictions as aggravating factors of the current offense rather than separate punishments or pure risk predictions.

  This hybrid model, often called "limited retributivism," resolves your first puzzle by arguing that a repeat offender is more morally blameworthy for the *current* act than a first-time offender. When you commit a crime after already being punished and warned by the state, your action demonstrates a stronger defiance of legal norms and a firmer commitment to criminal conduct. Therefore, the increased sentence is not double jeopardy for the past crime, but a proportionate response to the increased moral guilt inherent in the new crime given the agent's history. The prior conviction transforms the context of the new act from a potential lapse in judgment to a deliberate rejection of social contracts, thereby increasing the "desert" for the current offense.

  Your second puzzle regarding risk scores highlights the system's commitment to the "act requirement" as a safeguard against tyranny. While the system cares about dangerousness, it refuses to punish based solely on status or probability because doing so would treat individuals as means to social safety rather than autonomous agents responsible for their choices. A prior conviction is an objective, proven fact of wrongdoing that satisfies the requirement for a voluntary act (*actus reus*), whereas a risk score is a probabilistic prediction that could penalize someone for circumstances beyond their control or statistical associations. The system demands a new criminal act to trigger state coercion, even if the *length* of the sentence is justified by the risk that act implies.

  This framework is internally tense but not necessarily incoherent; it attempts to balance the retributive constraint that you cannot punish without a crime against the consequentialist goal of protecting society from those proven to be dangerous. However, the consistency breaks down if risk assessment tools are viewed as equally reliable as prior convictions; if a risk score accurately predicts danger, refusing to use it while using priors suggests the system values the symbolic legitimacy of punishing "acts" over the utilitarian efficiency of preventing harm.

  If you replaced this implicit theory with pure retributivism, recidivism enhancements would be abolished, and sentences would depend solely on the harm and intent of the current crime, treating each offense as an isolated moral transaction. Conversely, if you adopted pure consequentialism, the system would implement preventive detention based on risk scores regardless of criminal history, shifting from fixed sentences to indeterminate confinement until the individual is deemed no longer dangerous. The current system avoids both extremes by using the past crime as a proxy for dangerousness that satisfies the moral requirement of proven wrongdoing.
