      *   **Address Puzzle 2 (Why not risk scores?):** Explain the "Rule of Law" constraint. Punishing based on statistical risk alone treats the person as a means to an end (pure utilitarianism) and violates the principle that punishment requires a voluntary wrongful *act* (actus reus). A prior conviction is an objective, proven fact of wrongdoing; a risk score is a probabilistic prediction. The system requires a "trigger" crime to justify state coercion, even if the *length* is justified by risk/culpability.
      *   **Assess Consistency:** Is it internally consistent? Mostly, but there's tension. It tries to have it both ways. It claims to punish acts but scales based on history. It claims to protect society but refuses to detain the dangerous unless they commit a crime. This is "Limited Retributivism" (Norval Morris).
