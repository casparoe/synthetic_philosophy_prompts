      *   **Goal:** Identify the implicit theory, assess consistency, and explore alternatives.

  3.  **Identify the Implicit Theory:**
      *   Pure Retributivism (Kantian): Punishment must fit the crime. Prior record shouldn't matter for the *current* crime's desert. So, the system isn't purely retributive.
      *   Pure Utilitarianism/Consequentialism (Deterrence/Incapacitation): Punish to prevent future harm. If someone is high risk, punish them more, regardless of past convictions. So, the system isn't purely consequentialist (since it rejects risk scores without convictions).
      *   Hybrid Theory (Limited Retributivism or "Modified Just Deserts"): The system operates on a mix. It uses desert as a *limit* (you can't punish without a crime) but uses consequentialist reasoning (dangerousness, culpability) to determine *degree* within those limits.
      *   Specific Nuance on Recidivism: Why do priors matter?
          *   *Culpability View:* You know better now. You chose to break the law after being warned/punished. Your moral blameworthiness is higher.
          *   *Dangerousness View:* You are proven to be dangerous.
          *   *Legal Constraint:* You can't punish for status (being dangerous) without an act (conviction). This explains why risk scores alone don't work—you need the *actus reus* + *mens rea* of a new crime to trigger the enhancement, even if the enhancement is justified by risk/culpability.

  4.  **Formulate the Bottom Line:**
