          4.  Identify which reading the *classmate* needed for their argument to be legitimate.
          5.  Compare the two (are they the same?).
          6.  Address the Burkean claim ("institutions store accumulated wisdom") – where does it fit, and is it necessary for the classmate's argument?

  2.  **Deconstruct "Chesterton's Fence":**
      *   What is the core intuition? Don't destroy things you don't understand.
      *   Why? Because there might be a good reason you haven't seen yet.
      *   What are the varying strengths of this claim?
          *   Weak: Don't be rash. (Prudence)
          *   Medium: Burden of proof is on the changer. (Procedural)
          *   Strong: The thing probably *has* a good reason. (Epistemic presumption)
          *   Radical: The thing *definitely* has a good reason derived from tradition. (Ontological/Teleological claim about tradition)

  3.  **Drafting the Theses (Trivial to Radical):**
      *   *Thesis 1 (Epistemic Humility):* Ignorance is not a good basis for action. If you don't know why X exists, don't break X yet.
      *   *Thesis 2 (Burden of Proof):* The person proposing change must justify the change, not the defender justify the status quo.
      *   *Thesis 3 (Presumption of Rationality):* Existing institutions likely have a functional purpose, even if obscure.
      *   *Thesis 4 (Presumption of Wisdom):* Existing institutions encode the superior wisdom of the past (Burkean).
      *   *Thesis 5 (Immunity):* If the reason is unknown, the institution cannot be touched *at all* (or until the reason is found).

  4.  **Evaluating the Theses:**
      *   *T1:* Platitude. Hard to argue against.
      *   *T2:* Substantive/Defensible. Standard in law/policy, but debatable in moral urgency cases.
      *   *T3:* Substantive/Defensible. Evolutionary argument. But can be false (path dependence, power dynamics).
      *   *T4:* Radical/Controversial. Assumes past was wiser or conditions haven't changed.
      *   *T5:* False/Paralysis. Leads to stagnation. Some things must go even if we don't know why they arrived.

  5.  **Analyzing the Original Passage:**
      *   Chesterton says: "If you don't see the use of it, I certainly won't let you clear it away. Go away and think. Then, when you can come back and tell me that you do see the use of it, I may allow you to destroy it."
      *   Key phrases: "Go away and think," "I *may* allow you."
      *   This supports T1 (Humility) and T2 (Burden of Proof). It implies T3 (Likely a use), but explicitly allows for destruction later. It does *not* support T5 (Immunity).

  6.  **Analyzing the Classmate's Usage:**
      *   Classmate said: "My inability to produce a good reason... was not an argument against it; it only showed that I had not yet done the work, and *until I had, the policy deserved to stand*."
      *   This leans heavily on T2 (Burden of Proof) but slides into T5 (Immunity/Status Quo Bias). The classmate treated the *current* lack of knowledge as a veto, rather than a pause for investigation.
      *   To make the argument stick as a *conclusion* (policy stays), the classmate needs T3 or T4 (Presumption that the reason is good/exists). If the fence is there for no reason, finding the reason reveals it's nonsense, and it should go. The classmate assumes finding the reason will justify the fence.

  7.  **Comparing Original vs. Classmate:**
