      *   *Nuance:* Chesterton's "I may allow you" is key. It implies the *intelligent reformer* holds the keys. The classmate acted as if the *fence* holds the keys.
      *   *Burke:* Burke is stronger than Chesterton here. Burke argues tradition *is* wisdom. Chesterton argues tradition *might be* practical sense.
      *   *Legacy Admissions:* Specifically, if the reason is "fundraising," Chesterton's fence says "Okay, now weigh that use against the harm." The classmate said "There is a use, so stop."

  11. **Final Polish:** Organize into sections: The Menu of Theses, The Textual Analysis, The Classmate's Move, The Burkean Connection. (Proceed to generate response).

  *(Self-Correction during drafting)*: I need to make sure I explicitly answer "whether those two are the same." (Answer: No). And "whether the fence slogan needs [the Burkean claim] in order to do the work my classmate made it do." (Answer: Yes, effectively).

