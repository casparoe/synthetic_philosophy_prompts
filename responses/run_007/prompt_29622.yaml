answer: |-
  Dear Colleagues

  I am writing to offer my perspective on the proposed revision to our triage policy regarding the allocation of scarce ICU resources when patients are medically indistinguishable. After careful consideration of the arguments presented, including the compelling case made by the minority faction, I recommend that we retain the current draft which explicitly excludes citizenship and immigration status as a tiebreaker. While I understand the intuition behind prioritizing members of the political community, implementing such a policy would undermine the specific ethical mandate of a public health institution and introduce practical hazards that outweigh the theoretical benefits of compatriot priority.

  The argument put forward by the minority rests on a solid foundation in political philosophy, specifically the idea that states and their institutions owe special obligations to their own members. It is true that public hospitals are funded by tax revenue and that there is a legitimate debate to be had about whether the benefits of collective social insurance should be restricted to those who hold formal membership in that collective. In the abstract, a state may prioritize its citizens in the distribution of certain public goods, and if we viewed the hospital bed purely as a distributive asset of the state similar to a voting right or a welfare benefit, the claim that citizens should jump the queue would carry significant weight. This is not merely nationalist bias but a reflection of the partiality that defines political communities, where we accept that compatriots have claims on us that strangers do not. I want to acknowledge that this position is coherent and deserves respect, as it appeals to the reciprocity expected between a state and its constituents.

  However, the context of emergency medical triage alters the moral landscape significantly. The primary mission of a hospital is not to enforce the boundaries of political membership but to alleviate suffering and preserve life within its catchment area. When we move from the abstract theory of political obligation to the concrete reality of clinical ethics, the relevance of citizenship diminishes while the relevance of trust and public health safety increases. If we institute a policy where legal status determines survival in a tiebreak scenario, we risk eroding the trust between the medical institution and the broader community. Undocumented residents, fearing that seeking care could flag their status or disadvantage them relative to others, may delay presentation until their conditions are critical, which ultimately harms public health outcomes for everyone, including citizens. A public hospital functions best when it is viewed as a safe harbor for all residents, regardless of their legal standing, because disease and trauma do not respect borders and the containment of health risks requires universal cooperation.

  Furthermore, there is a significant implementation problem that threatens the viability of the minority's proposal. To enforce a citizenship tiebreaker, clinical staff or administrators would be required to verify immigration status during a crisis situation. This transforms medical personnel into agents of border control, creating a conflict of interest that compromises the healer-patient relationship. It also introduces administrative delays that are incompatible with the urgency of ICU triage. Additionally, the assumption that citizenship correlates neatly with taxpayer contribution is empirically shaky in our city, where many undocumented residents contribute to public revenue through sales taxes, property taxes via rent, and often income taxes, while frequently utilizing fewer public services than citizens. If the argument is truly about reciprocity and contribution rather than status alone, then citizenship is a poor proxy for the actual economic relationship between the resident and the institution.

  Ultimately, when medical factors are equal, we are forced to choose a secondary principle, and that principle should align with the core values of the institution. Choosing based on citizenship introduces a morally arbitrary factor regarding the patient's health need and capacity to benefit, which is the central currency of medical ethics. While the state may have special obligations to its citizens, the hospital's obligation is to the sick. Preserving the integrity of the triage process requires that we remain impartial to factors that do not influence medical outcome or institutional mission. Therefore, I urge the committee to vote against the amendment and affirm that citizenship and immigration status must never function as a tiebreaker in allocating life-saving resources. This stance protects the vulnerable, maintains public trust, and ensures our staff can focus on medicine rather than immigration enforcement.

  Sincerely

  Dr. [Your Name]
  Ethics Committee Member
