answer: |-
  It is fascinating to stare into the mechanics of a coin toss and see the collision between our metaphysical intuitions about chance and the gritty reality of Newtonian physics. When the NFL captains stand at midfield, the practice treats the coin as a locus of objective chance, specifically a chance of one-half for each outcome. If we take the Principal Principle seriously, which dictates that a rational agent's credence should match the objective chance once they have conditionalized on admissible evidence, then the captains are obligated to set their credence to fifty percent. But as you note, if the coin's flight is deterministic, the objective chance relative to the complete physical history of the universe is actually one or zero. This creates a tension between what the practice seems to presuppose and what the physics suggests is true. To reconstruct the implicit theory here, we have to distinguish between what the practice strictly requires to function and what metaphysical baggage we might be tempted to attach to it.

  The practice does not strictly presuppose that the universe is indeterministic at the level of macroscopic objects. It does not require that the coin possess a magical propensity to land heads or tails independent of initial conditions. Instead, what the practice commits us to is a theory of chance relative to a specific level of description and a specific information state. The chance is not a property of the coin alone, nor is it purely a property of our ignorance; it is a relational property emerging from the interaction between the physical setup and the epistemic constraints placed on the agents. The NFL rulebook constructs a context where certain information is deemed inadmissible by fiat. The physics of the flip—the force of the thumb, the air resistance, the angular momentum—is treated as off-limits for the purpose of the decision. Therefore, the objective chance the practice relies on is compatible with determinism, provided that the determining factors are inaccessible to the agents. This suggests a compatibilist view of chance, where objective probabilities can exist even in a deterministic world, so long as we are restricting our view to a coarse-grained description of events where the micro-details are hidden.

  If we were to adopt a flatly deterministic view where the only chances are subjective credences, the coin toss would not necessarily become a sham, but its status would shift from a discovery of fate to a ritual of agreed-upon ignorance. It would remain a valid mechanism for coordination because the function of the toss is not to tap into metaphysical randomness but to ensure symmetry between the competitors. As long as neither captain has an advantage in predicting the outcome, the epistemic chance remains fifty-fifty for both, and the procedure satisfies the requirement of fairness. The toss becomes a sham only if the determinism is exploitable by one party. If the outcome is fixed by physics but unknown to both, it serves the same social and competitive function as genuine indeterminism. The practice survives the removal of robust objective chance because what matters for the game is not the ontology of the flip but the equality of the captains' epistemic positions.

  This brings us to the crucial question of admissible information. In the context of the Principal Principle, admissible evidence is typically information about the past that does not reveal the future outcome directly. For the coin toss, the admissible evidence includes the fact that a fair coin is being used and that it is being flipped according to standard procedure. Inadmissible information would be any data that breaks the symmetry of ignorance regarding the specific trajectory of this particular flip. If one captain had a slow-motion feed that allowed them to calculate the trajectory before the coin landed, while the other did not, the practice would collapse. This is not because the coin ceased to be deterministic, but because the information asymmetry violated the condition of shared ignorance that underpins the fifty-fifty credence. The captain with the feed would have evidence that renders the chance either zero or one relative to their information state, while the other captain would still hold a credence of one-half.

  In that scenario, the toss would cease to be a chance device and would become a test of technological advantage, rendering it unfair. The practice presupposes that the initial conditions of the flip are inadmissible evidence for both parties. This is why the referee flips the coin and not the captains themselves; it externalizes the control to a neutral party to maintain the barrier against inadmissible information. If we accept that chance is relative to a level of description, then the slow-motion feed changes the level of description for one captain but not the other. For the captain with the feed, the event is no longer a coin toss at the macroscopic level of heads or tails, but a calculable physical trajectory at the microscopic level. The practice cannot survive this asymmetry because the shared presupposition of equal epistemic access is broken.

  Ultimately, the implicit theory of chance here is pragmatic rather than deeply metaphysical. It treats chance as a stable feature of the world relative to human-scale interactions and information limits. The practice commits us to the idea that there are facts about probability that are true relative to our standard modes of interaction, even if those facts dissolve under a god's-eye view of total physical knowledge. We do not need to believe the coin is metaphysically free to land either way; we only need to believe that the outcome is insensitive to the will or knowledge of the competitors. If we replaced the presupposed view with a hard deterministic one, the ritual remains intact as long as the determinism remains opaque. The coin toss is not a sham unless the opacity is pierced. It is a mechanism for generating a decision that is independent of skill or strategy, and that independence is preserved by ignorance just as well as it is by indeterminism. The chance is real enough for the game because the game is played by humans, not by Laplacean demons, and the rules are designed to keep us in the dark just enough to make the light of probability shine at fifty percent.
