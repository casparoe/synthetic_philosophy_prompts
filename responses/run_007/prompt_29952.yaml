prompt: |-
  I'm giving a talk next month to our department's moral psychology reading group, defending Galen Strawson's Basic Argument: that nobody can be truly or ultimately morally responsible for what they do. My line is his. You act from the way you are; so to be truly responsible for what you do, you'd have to be truly responsible for the way you are; but to be responsible for the way you are you'd have to have chosen it, which would mean being responsible for the way you were when you chose it, and so on back. Self-creation is impossible, so ultimate responsibility is too. I'll stress this isn't a point about determinism — the regress bites either way — and I'll allow that ordinary praise and blame can survive, they just don't amount to the real thing. The audience: mostly reasons-responsive compatibilists of the Fischer sort, one agent-causal libertarian who thinks the regress stops at the agent, and a couple of people who work on blame and the reactive attitudes rather than the free will debate proper. Draft my Q&A prep sheet: the objections I'll actually get from this crowd, ordered by how likely and how damaging they are, each phrased the way one of them would actually put it, with a two-minute reply and a note on where that reply is softest. Include the question I'm hoping nobody asks, and say why it scares me. Finish with a machine-readable last line — Verdict: ... — naming the one objection I should prepare hardest for.
