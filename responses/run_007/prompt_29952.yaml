answer: |-
  # Q&A Prep Sheet: Defending Strawson's Basic Argument

  **Context:** Moral Psychology Reading Group
  **Core Claim:** Ultimate Moral Responsibility (UMR) is impossible due to the regress of self-creation.
  **Concession:** Ordinary responsibility/praise/blame survive (compatibilist sense).

  ---

  ### 1. The "Bar Too High" Objection (Fischer-style Compatibilist)
  **Likelihood:** High | **Damage:** High
  **The Question:** "Galen, you've conceded that agents can be reasons-responsive, that they can guide their actions, and that our ordinary practices of praise and blame remain intact. So, you've only eliminated a metaphysical ghost called 'Ultimate Responsibility.' Why should we care that we lack *that* specific property if everything that matters for moral life survives?"

  **The 2-Minute Reply:**
  "I grant that ordinary life goes on. But we must distinguish between *pragmatic* responsibility and *desert-entailing* responsibility. The Fischer-style view gives us a license to manage behavior, like training a dog or fixing a car. It justifies intervention, but it doesn't justify *retributive* desert in the deep sense.
  If I lack UMR, I am not the *ultimate source* of my actions. If I'm not the ultimate source, I don't *ultimately deserve* suffering or reward for them, even if I am reasons-responsive. The reason to care is ethical: we shouldn't inflict retributive punishment or claim deep moral credit if the agent couldn't possibly be the *causa sui*. We can keep the practices, but we must drain them of their retributive venom. We treat agents as responsible, but we know, metaphysically, that luck is all the way down."

  **Soft Spot:**
  This relies on the audience caring about "ultimate desert." If they are pragmatic consequentialists about blame, they will say, "If the practice works, why worry about the metaphysical source?" You risk sounding like you're solving a problem nobody else feels.

  ### 2. The "Practice Is Reality" Objection (Reactive Attitudes Group)
  **Likelihood:** Medium | **Damage:** Medium-High
  **The Question:** "Following P.F. Strawson, isn't 'responsibility' just constituted by our reactive attitudes? By positing this 'Ultimate' standard outside our human practices, aren't you just reifying a metaphysical fantasy and then knocking it down? Responsibility *is* what we do when we hold each other to account."

  **The 2-Minute Reply:**
  "That conflates the *concept* of responsibility with the *practice* of holding responsible. P.F. Strawson showed us why we can't stop blaming, but he didn't prove that blaming is always *justified* in the ultimate sense.
  My argument shows there is a gap between our practices and the metaphysical reality required to fully justify them. Just because we are psychologically compelled to play the game doesn't mean the game is metaphysically fair. I'm not saying we should stop blaming; I'm saying we should recognize that when we do, we are participating in a necessary fiction. The 'fantasy' isn't my invention; it's embedded in the intuition that you truly *earned* that praise or *deserved* that blame."

  **Soft Spot:**
  They can argue that "desert" is internal to the practice. If the practice defines the norm, there is no "outside" perspective from which to call it a fiction. You risk begging the question against naturalistic accounts of normativity.

  ### 3. The "Agent-Cause Stops the Regress" Objection (The Libertarian)
  **Likelihood:** Low | **Damage:** Medium
  **The Question:** "Your regress assumes event-causation. But if I am a substance-cause, an agent, I don't need to be created by a prior self. I initiate the chain. The regress stops at the agent. Why is self-creation impossible if the agent is a primitive ontological category?"

  **The 2-Minute Reply:**
  "Because to be responsible for an action, you must be responsible for the *will* that produced it. Even if you are a prime mover, *why* did you move that way? If it's random, it's luck. If it's determined by your nature, we're back to square one: where did that nature come from?
  Positing 'agent-causation' is just labeling the mystery, not solving it. To be ultimately responsible for the choice, you must have chosen to be the kind of agent who makes that choice. If you didn't choose your agent-nature, you are still the victim of constitutive luck. The regress isn't about time; it's about explanation. An uncaused cause doesn't escape the need for self-creation if it claims *moral* ownership."

  **Soft Spot:**
  It is difficult to definitively prove agent-causation is incoherent in a live Q&A. You risk getting bogged down in metaphysics of substance vs. event, which distracts from the moral point.

  ---

  ### The Feared Question
  **The Question:** "If ordinary responsibility survives, and we can't change our practices, isn't your conclusion practically inert? Are you just making a semantic point that 'responsibility' means 'Ultimate Responsibility' in your lexicon, while the rest of us use it to mean 'Reasons-Responsiveness'? If so, haven't you just defined the problem away?"

  **Why It Scares Me:**
  This attacks the *significance* of the project, not just the logic. If I admit "ordinary responsibility" survives, I risk conceding that the only thing I've killed is a word. If I can't show that "Ultimate Responsibility" is the *only* kind that justifies deep moral emotions (like genuine guilt or righteous anger), then the Basic Argument is a metaphysical curiosity with no ethical teeth. It exposes the possibility that I am stipulating a definition of responsibility that nobody actually needs, making the talk a sophisticated verbal dispute.

  ---

  Verdict: The "Bar Too High" Objection
