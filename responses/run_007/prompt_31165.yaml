      *   *Borda:* The prompt says they nearly adopted it because "Borda rewards consensus." This is the specific myth to bust. Borda rewards consensus *under honest voting*. Under strategic voting, it rewards factions who bury opponents.
      *   *IRV:* Monotonicity is the key technical flaw to mention, but keep it simple. "Voting for a candidate can cause them to lose."
