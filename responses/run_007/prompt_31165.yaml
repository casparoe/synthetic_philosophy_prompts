      *   *Step 6: The "Unknowns".* Fairness criteria not covered by G-S (Condorcet, Monotonicity, etc.).

  4.  **Analyzing the Three Methods:**

      *   **Instant-Runoff Voting (IRV / Hare / RCV):**
          *   *G-S Status:* Applies. Ordinal, deterministic, $\ge 3$ candidates.
          *   *Manipulation:* Yes.
          *   *Specifics:* "Pushover" (strategic nomination/voting), "Compromising" (ranking a viable second choice first to stop a hated winner). Monotonicity failure is the big technical headache (ranking higher can hurt you).
          *   *Union Context:* Good for majority mandate, bad for consensus. Can eliminate consensus candidates early.

      *   **Borda Count:**
          *   *G-S Status:* Applies. Ordinal, deterministic, $\ge 3$ candidates.
          *   *Manipulation:* Yes, highly susceptible.
          *   *Specifics:* "Burying" (ranking a strong rival last even if you like them). "Cloning" (running similar candidates to split points).
          *   *Union Context:* The prompt mentions they *nearly* adopted this because "it rewards consensus." This is the uncomfortable truth. Borda rewards consensus *only if everyone votes honestly*. If factions strategize, Borda punishes consensus candidates because they get "buried" by polarizing candidates.
