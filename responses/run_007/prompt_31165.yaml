answer: |-
  # The Gibbard–Satterthwaite Audit Tool
  ### A Decision Procedure for Voting Method Proposals

  **Purpose:** To provide the Standing Rules Committee with a standardized, theoretically grounded method for evaluating proposed voting systems. This tool does not determine which method is "best" in a moral sense, but rather exposes the strategic vulnerabilities inherent in each method so the committee can write an honest recommendation.

  **Core Principle:** The Gibbard–Satterthwaite (G-S) theorem proves that no voting system is perfect. Specifically, any system that selects a single winner from three or more options is either **dictatorial** (one person decides), **restrictive** (limits voter expression), or **manipulable** (voters can benefit by lying about their preferences). Our goal is not to find a system immune to manipulation (none exists), but to choose the system whose manipulation risks are most manageable for our union.

  ---

  ## Part 1: The Audit Procedure

  Run every proposed voting method through these five steps.

  ### Step 1: The Applicability Test
  *Does the G-S theorem strictly apply to this method?*
  Check the following four boxes. If **all four** are checked, the theorem applies directly.
  1.  **Single Winner:** Does the method elect one person/option at a time?
  2.  **Deterministic:** Is the result determined solely by the ballots (no coin flips or lotteries)?
  3.  **Unrestricted Domain (Ordinal):** Are voters asked to submit a rank ordering of candidates (1st, 2nd, 3rd...)?
  4.  **Three or More Outcomes:** Are there realistically three or more candidates/options who could win?

  *   **If YES to all:** Proceed to Step 2. The method is mathematically proven to be manipulable.
  *   **If NO to any:** Proceed to Step 3. Identify which assumption fails.

  ### Step 2: The Inevitability Verdict (For Methods where G-S Applies)
  *Since manipulation is proven to exist, what form does it take?*
  The theorem guarantees that there is *some* scenario where a voter benefits by voting insincerely. You must identify the **most likely** scenario for your union.
  *   **Compromising:** Voting for a less-preferred candidate to prevent a hated candidate from winning.
  *   **Burying:** Ranking a strong competitor artificially low to help your favorite win.
  *   **Truncation:** Refusing to rank lower candidates to avoid helping them.
  *   **Order Reversal:** Ranking a candidate higher than you actually like them to change elimination orders.

  ### Step 3: The Loophole Analysis (For Methods where G-S Does Not Apply)
  *If the method failed Step 1, why? Does that protect us?*
  Most methods fail the **Ordinal** requirement (e.g., they use scores or binary approval).
  *   **The Trap:** Escaping G-S by changing the ballot type does not escape manipulation; it moves it.
  *   **The Question:** Where does the strategy hide now?
      *   *Example:* In Approval Voting, you cannot rank, so you cannot "bury." But you must decide where to set the "approval threshold." Strategy shifts from **ordering** to **scoring**.
      *   *Guidance:* If the method is not ordinal, identify the **Strategic Parameter** (e.g., "How many candidates do I approve?" or "What score do I give the frontrunner?").

  ### Step 4: The Vulnerability Profile
  *List the specific distortions this method invites.*
  Use plain language. Do not just say "manipulable." Say:
  *   "This method encourages factions to run 'clone' candidates to split the vote."
  *   "This method punishes voters who honestly rank a consensus candidate first."
  *   "This method requires voters to guess how others will vote to avoid wasting their ballot."

  ### Step 5: The Context Check (Hard Cases)
  *Adjust the findings based on our specific reality.*
  *   **Electorate Size (900 members):** Large enough that individual vote buying is unlikely, but small enough that organized factions can coordinate strategy.
  *   **Open Secrets:** If member preferences are known (e.g., "The north side tenants always vote together"), manipulation is not just *possible* (as G-S says); it is *probable*.
  *   **Candidate Set:** Is the list fixed? If candidates can enter late, methods like Borda are vulnerable to "cloning" (adding similar candidates to drain points from a rival).
  *   **Ties/Truncation:** If the method allows equal rankings or incomplete ballots, does that reduce strategy or complicate the count?

  ---

  ## Part 2: Application to Current Proposals

  Below is the audit run on the three methods currently under consideration for single-winner officer elections.

  ### Proposal A: Instant-Runoff Voting (IRV / RCV)

  **1. Applicability Test:**
  *   Single Winner? **Yes.**
  *   Deterministic? **Yes.**
  *   Ordinal? **Yes.**
  *   3+ Outcomes? **Yes.**
  *   **Verdict:** G-S Theorem **Applies Directly.**

  **2. Inevitability Verdict:**
  Manipulation is guaranteed to exist. In practice, IRV is vulnerable to **Tactical Compromising** and **Pushover Strategy**.
  *   *Scenario:* A voter prefers Candidate A (longshot), then B (moderate), then C (frontrunner). If A is eliminated early, the voter might strategically rank B first to ensure A's votes transfer to B rather than C.

  **3. Vulnerability Profile:**
  *   **Non-Monotonicity:** This is the critical flaw. In IRV, **ranking a candidate higher can cause them to lose.** (e.g., If too many people rank Candidate B first, B might survive a round only to be eliminated in the next round by a rival they would have beaten head-to-head).
  *   **Center-Squeeze:** Consensus candidates who are everyone's second choice often get eliminated before the polarizing candidates who have strong first-choice bases.
  *   **Guidance for Members:** "Vote for your true favorite only if you think they can survive the first round. Otherwise, vote for the most viable candidate you can tolerate."

  **4. Context Check:**
  *   With 900 members, counting is manageable but slower than plurality.
  *   If factions are known, they will coordinate to ensure their candidate survives the first elimination round.
  *   **Committee Note:** IRV ensures the winner has majority support *among those who remained*, but it does not guarantee the Condorcet winner (the person who beats everyone head-to-head) will win.

  ***

  ### Proposal B: Borda Count

  **1. Applicability Test:**
  *   Single Winner? **Yes.**
  *   Deterministic? **Yes.**
  *   Ordinal? **Yes.**
  *   3+ Outcomes? **Yes.**
  *   **Verdict:** G-S Theorem **Applies Directly.**

  **2. Inevitability Verdict:**
  Manipulation is guaranteed to exist. Borda is **highly susceptible** to strategic "Burying."
  *   *Scenario:* If you support Candidate A, and Candidate B is the strongest rival, you should rank B last—even if you actually like B— to minimize B's point total.

  **3. Vulnerability Profile:**
  *   **The Consensus Myth:** Proponents claim Borda rewards consensus. **This is only true if everyone votes honestly.** Because G-S proves honest voting is not a stable strategy, Borda actually rewards **organized factions** who agree to bury opponents. A polarizing candidate with a loyal base can beat a consensus candidate if the consensus candidate's supporters fail to bury the polarizing candidate's rivals.
  *   **Cloning:** If the candidate set is not fixed, a faction can run multiple similar candidates (clones). Since Borda assigns points based on rank, running three similar candidates pushes rivals down the ballot, draining their points.
  *   **Guidance for Members:** "Do not rank a strong rival honestly. If you want your candidate to win, you must rank all serious competitors last."

  **4. Context Check:**
  *   **Uncomfortable Truth:** This is the method the committee nearly adopted based on the claim that it "rewards consensus." The G-S audit reveals this claim is fragile. In a union with organized factions (which we have), Borda incentivizes negative campaigning (burying) more than almost any other method.
  *   **Truncation:** If members are allowed to leave blanks, the system breaks (members will only rank their favorite). If full rankings are required, members will fill them out randomly at the bottom, introducing noise.

  ***

  ### Proposal C: Approval Voting

  **1. Applicability Test:**
  *   Single Winner? **Yes.**
  *   Deterministic? **Yes.**
  *   Ordinal? **No.** (Voters select a set of candidates; no ranking between them).
  *   3+ Outcomes? **Yes.**
  *   **Verdict:** G-S Theorem **Does Not Apply Directly** (fails Ordinal condition).
  *   *Note:* Gibbard's 1978 extension covers this, meaning manipulation is still inevitable.

  **2. Loophole Analysis:**
  *   **Failed Assumption:** Ordinality.
  *   **Protection?** No. The strategy shifts from **Ranking** to **Threshold Setting**.
  *   **Strategic Parameter:** "How many candidates do I approve?"
  *   *Scenario:* You love Candidate A, like Candidate B, and dislike Candidate C. If A and B are close, approving B might help B beat A. You must decide whether to "bullet vote" (approve only A) to maximize A's chances, or approve B to ensure C loses.

  **3. Vulnerability Profile:**
  *   **Threshold Dilemma:** There is no "correct" way to vote. Your best move depends entirely on who you think is likely to win. This places a high cognitive burden on voters to poll the electorate.
  *   **Lack of Intensity:** You cannot express that you *strongly* prefer A over B, only that you accept both.
  *   **Guidance for Members:** "Approve your favorite and any other candidate you find acceptable. However, if your favorite is in a tight race, consider approving only them to avoid helping a rival."

  **4. Context Check:**
  *   **Simplicity:** Easiest to count and explain to 900 members.
  *   **Strategy:** Less complex than IRV or Borda. The "strategy" is simply deciding who is "acceptable."
  *   **Consensus:** Tends to elect broadly acceptable candidates rather than polarizing ones, provided voters do not bullet vote excessively.

  ---

  ## Part 3: Committee Recommendation Guidance

  When writing your recommendation to the full membership, you must distinguish between **Strategy-Proofness** and **Fairness**. The G-S theorem tells us about the former, not the latter.

  **1. What the Theorem Cannot Decide**
  *   **Fairness:** A dictatorship is strategy-proof (no one else can manipulate), but it is not fair. G-S does not tell us which method is most democratic.
  *   **Condorcet Efficiency:** G-S does not tell us which method is most likely to elect the candidate who would beat all others in a head-to-head matchup. (IRV and Borda often fail this; Approval varies).
  *   **Ease of Use:** G-S does not account for spoiled ballots. A complex method that is theoretically robust may fail in practice if members fill it out incorrectly.

  **2. Addressing the "Uncomfortable Truth"**
  You must address the Borda Count proposal explicitly.
  *   *Drafting Language:* "While Borda Count is often described as a 'consensus' method, social choice theory demonstrates that this relies on all voters ranking candidates honestly. Because every ordinal system invites strategic voting, Borda is uniquely vulnerable to 'burying' tactics where factions rank strong rivals last regardless of true preference. In a union environment with organized caucuses, this risks electing polarizing candidates rather than consensus builders."

  **3. Final Decision Matrix**
  Use this summary to frame your recommendation:

  | Method | G-S Status | Primary Strategic Risk | Best For... | Worst For... |
  | :--- | :--- | :--- | :--- | :--- |
  | **IRV** | Applies | Compromising / Non-monotonicity | Ensuring majority support for winner | Consensus candidates (2nd choice favorites) |
  | **Borda** | Applies | Burying / Cloning | Theoretical consensus (if honest) | **Environments with organized factions** |
  | **Approval** | Exempts* | Threshold Setting / Bullet Voting | Simplicity / Broad acceptability | Expressing strong preference intensity |

  *\*Exempts from G-S strict conditions, but not from Gibbard's broader manipulation theorem.*

  **Committee Action:**
  1.  **Reject Borda** for officer elections due to high vulnerability to factional burying in a known-preference environment.
  2.  **Compare IRV vs. Approval.** If the goal is a mandate with >50% support, choose IRV. If the goal is broad acceptability and simplicity, choose Approval.
  3.  **Disclose:** In the recommendation, explicitly state: "No voting system prevents strategic voting. We are choosing the system whose strategic risks we are best equipped to manage."

  ---

  ### Summary for the Committee Chair
  The Gibbard–Satterthwaite audit confirms that **no method eliminates strategy.** The choice is not between "honest" and "strategic" voting, but between **which strategies are easier to execute** and **which distortions are more damaging** to union solidarity.

  The audit reveals that **Borda Count** carries the highest risk for our specific context (organized factions, known preferences) because it incentivizes negative ranking ("burying"). **IRV** risks eliminating consensus candidates early. **Approval** shifts the burden to the voter to set thresholds but minimizes negative campaigning.

  Use this procedure to defend your recommendation: You are not claiming the chosen method is perfect; you are claiming its flaws are the least damaging to the union's goals.
