answer: |-
  Your hypothesis is remarkably astute. As someone coming from experimental physics, you are detecting a structural feature of the debate that many insiders, having lived with it for decades, sometimes overlook. You are correct: the impasse over the Principal Principle (PP) is not primarily a failure of probability theory. The mathematics is stable. The instability lies in the metaphysics of the *relata*—specifically, the nature of objective chance.

  To answer your questions directly: The impasse is a mixture of verbal disagreement and divergent research programs, driven by a substantive metaphysical disagreement that cannot be empirically settled. Consequently, "progress" in this domain looks less like a theorem and more like a map of trade-offs.

  Here is the diagnosis of the debate, structured by your questions.

  ### 1. Substantive, Verbal, or Research Programs?

  It is best understood as **divergent research programs operating under a shared label.**

  In physics, if two groups disagree on the mass of the electron, they agree on what "mass" and "electron" refer to; they disagree on the value. In the PP debate, the parties often disagree on the *ontology* of the thing the principle is supposed to govern.

  *   **The Humean Program (Lewisian):** Here, chance is not a primitive physical magnitude. It is a summary statistic of the "Humean mosaic" (the total distribution of qualitative properties in spacetime). Chance supervenes on actual events. For this group, the PP is a constraint on how rational agents should align their beliefs with these summary statistics. The "undermining future" counterexamples arise because, in this view, the future mosaic helps *define* the chance, but the chance is supposed to guide credence about the future. This creates a circularity that the PP struggles to formalize.
  *   **The Primitivist/Propensity Program:** Here, chance is a physical magnitude (a propensity, a dispositional property) akin to a field strength. It does not supervene on the mosaic; it helps *generate* the mosaic. For this group, the PP is an epistemic access principle: how do we know the value of this hidden physical parameter?
  *   **The Functionalist Program:** This aligns with your second suggestion. Chance is defined by the role it plays. If a property doesn't obey the PP (or something close to it), it isn't "chance."

  The debate persists because these groups are trying to fit the same formal principle (the PP) onto different metaphysical structures. When a counterexample arises (like undermining futures), the Humean must tweak the principle to save the metaphysics, while the Primitivist might tweak the metaphysics to save the principle. They are using the word "chance" to point at different targets, but because the term is pre-theoretically intuitive (we all have a grip on "it was a 50/50 chance"), they believe they are talking about the same thing.

  ### 2. The Hidden Question

  If the disagreement is substantive, what is the hidden question? It is not empirical (we cannot measure chance directly, only frequencies) and not formal (the probability calculus is agreed upon).

  The hidden question is **metaphysical grounding vs. epistemic access.**

  The Principal Principle attempts to bridge the gap between *mind* (credence) and *world* (chance). The impasse exists because we cannot agree on how the world anchors the "chance" side of the equation.

  *   **The Humean Dilemma:** If chance supervenes on events (which feels scientifically respectable), it is vulnerable to "undermining." (i.e., There is a non-zero chance that the future pattern of events will be such that the *true* chance function would have been different). Lewis called this the "Big Bad Bug." He hoped to fix the PP to accommodate this.
  *   **The Anti-Humean Dilemma:** If chance is a primitive magnitude (which saves the PP from undermining), it becomes epistemically occult. How does a rational agent know the value of a primitive propensity? If you say "by observing frequencies," you risk collapsing back into Humeanism.

  The hidden question is: **Can we have a notion of chance that is both metaphysically robust (independent of our knowledge) and epistemically accessible (capable of guiding belief)?**

  The literature suggests the answer might be "No." This is the conceptual tension driving the cycle of repair. Every formulation of the PP represents a different compromise on this trade-off.
  *   Lewis's original PP favors epistemic clarity but breaks under Humean metaphysics.
  *   The "New Principle" (Hall, Thau, etc.) saves Humean metaphysics but makes the principle incredibly complex and arguably less action-guiding.
  *   Primitivist accounts save the simplicity of the principle but obscure the epistemic access.

  ### 3. What Counts as Progress?

  Given this diagnosis, you should not expect a theorem that settles the debate. A theorem requires agreed-upon axioms, and the axioms here (about the nature of reality) are the contested variable.

  Progress in this field takes three forms, none of which will satisfy a physicist's desire for convergence:

  1.  **Impossibility Results (No-Free-Lunch Theorems):** The most valuable progress would be formal proofs showing that certain clusters of desiderata are incompatible. For example, proving that no principle can satisfy *Humean Supervenience*, *Admissibility of Statistical Evidence*, and *Simple Conditionalization* simultaneously. This forces the parties to admit they must drop a commitment. (Some work by Alan Hájek and others gestures this way, but a definitive "no-go theorem" for chance is still elusive).
  2.  **Conceptual Disambiguation:** Progress occurs when philosophers admit there are two concepts at play. For example, distinguishing *statistical probability* (frequency in the mosaic) from *modal probability* (propensity). If the literature agreed to use "chance" for one and "probability" for the other, the PP debate would dissolve into two smaller, manageable debates.
  3.  **Model-Relative Validity:** The most mature outcome is accepting that the PP is like an equation of state. It holds under certain conditions (e.g., "If you are a Primitivist, use PP1; if you are a Humean, use PP2"). Progress is mapping the domain of applicability for each formulation rather than seeking a universal one.

  ### Advice for Your Reading

  Your intuition that "formal principles either work or they don't" is the correct instinct for physics. In metaphysics, formal principles work *relative to a model of the world*.

  When you read these papers, treat the Principal Principle not as a law of nature, but as a **boundary condition** for a theory of chance.
  *   If an author proposes a repair to the PP, ask: **What metaphysical cost did they pay to make the math work?**
  *   Did they make "admissible evidence" so narrow that the principle is vacuous?
  *   Did they make the definition of "chance" so functionalist that it no longer refers to a physical property?

  You should expect to live with the plurality. The debate persists not because philosophers are failing to find the truth, but because "objective chance" may be a **cluster concept** that no single metaphysical picture can fully capture. We want chance to be physical (like mass), we want it to be modal (about possibilities), and we want it to be epistemic (guiding belief). The PP impasse is the friction generated by trying to force these three distinct roles onto a single variable.

  The "resolution" is not a new formula. It is the realization that the search for a single, universal Principal Principle is a category error. The principle is valid only relative to the metaphysics you are willing to buy.
