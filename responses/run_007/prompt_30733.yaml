answer: |-
  It is entirely understandable that this argument has left you unsettled. Your friend is correct that in many commercial contexts, average performance is the only metric that matters for profitability. However, you are correct that in consequential domains, a low average error rate can mask a high frequency of catastrophic failure for a vulnerable minority. This is not merely a technical disagreement; it is a question of risk allocation.

  When the cost of failure is asymmetric—where a false positive costs a company money, but a false negative costs a person their liberty, health, or livelihood—average-case metrics are insufficient.

  Below is a reusable decision procedure designed for your specific context: a time-constrained panel of mixed expertise needing a defensible rationale. I have titled this the **Consequence-First Review Protocol (CFRP)**. It is designed to be completed within your one-to-two-hour window.

  ***

  ### The Consequence-First Review Protocol (CFRP)

  **Purpose:** To determine whether average-case performance evidence is sufficient for deployment, or whether worst-case guarantees are required.
  **Users:** Review Panel members (technical and non-technical).
  **Time Required:** 45–90 minutes per proposal.

  #### Phase 1: Harm Characterisation
  *Goal: Establish the nature of the 'Bad Thing' if the system fails.*

  **Q1. What is the specific, immediate harm to an individual if the system makes a high-confidence error?**
  *   *Acceptable Answer:* A specific description of the outcome (e.g., 'Loan denied despite ability to repay', 'Nurse allocated double shift without rest', 'Pump not flagged before rupture').
  *   *Stop Condition:* If the harm cannot be described concretely, **STOP**. Request resubmission. Do not proceed on abstract metrics.

  **Q2. Is this harm reversible or compensatable?**
  *   *Acceptable Answer:* 'Yes, with explanation' (e.g., 'Applicant can reapply next month', 'Shift can be swapped'). OR 'No' (e.g., 'Patient injury', 'Bankruptcy', 'Loss of life').
  *   *Decision Rule:*
      *   If **Yes**: Proceed to Phase 2.
      *   If **No**: **Immediate Requirement for Worst-Case Guarantees.** Average-case performance is insufficient. Skip to Phase 3.

  **Q3. Is the risk of harm distributed evenly, or concentrated on a specific subgroup?**
  *   *Acceptable Answer:* Evidence of performance across protected characteristics (age, gender, ethnicity, location) or operational edge cases.
  *   *Decision Rule:*
      *   If performance varies significantly (>10% deviation) across subgroups: **Requirement for Worst-Case Guarantees** regarding fairness.
      *   If uniform: Proceed to Phase 2.

  #### Phase 2: Operational Safeguards
  *Goal: Determine if human oversight mitigates the need for algorithmic guarantees.*

  **Q4. Is there a 'human-in-the-loop' with the authority and capacity to override the system?**
  *   *Acceptable Answer:* 'Yes, named role, with time allocated to review.'
  *   *Decision Rule:*
      *   If **Yes**: Average-case evidence *may* be sufficient, provided the human is not suffering from 'automation bias' (trusting the machine blindly).
      *   If **No** (fully automated): **Requirement for Worst-Case Guarantees.**

  **Q5. Is there a 'circuit breaker'?**
  *   *Acceptable Answer:* A mechanism to shut the system down if error rates spike in production.
  *   *Decision Rule:*
      *   If **No**: **STOP.** Deployment cannot be approved regardless of performance metrics.

  #### Phase 3: Selecting the Guarantee
  *Goal: Define what 'Safe' means for this specific proposal.*

  *If Phase 1 or 2 triggered a 'Requirement for Worst-Case Guarantees', the proposal must provide one of the following:*

  1.  **Bounded Harm:** A proof or empirical bound that no single decision can exceed a specific harm threshold (e.g., 'No nurse will be scheduled for >12 hours').
  2.  **Adversarial Robustness:** Evidence that the system does not fail catastrophically on plausible out-of-distribution inputs (e.g., 'System degrades gracefully on unusual loan histories rather than rejecting outright').
  3.  **Impossible Events:** A logical guarantee that certain outcomes cannot occur (e.g., 'System cannot flag a patient for discharge without a doctor's prior digital signature').

  *If the proposal only provides average accuracy (e.g., '95% AUC'), it fails this phase.*

  #### Phase 4: The Value Hand-Off
  *Goal: Identify questions that are ethical, not mathematical.*

  **Q6. Is the 'Acceptable Risk' defined by the business or the affected individual?**
  *   *Observation:* If the proposal defines risk as 'financial loss to the company', but the harm is 'clinical injury to patient', this is a values mismatch.
  *   *Action:* **Hand-off to Compliance Director / Ethics Board.** The panel cannot sign off. This requires a policy decision on liability and duty of care.

  **Q7. Does the efficiency gain justify the residual risk?**
  *   *Observation:* Even with worst-case guarantees, some risk remains.
  *   *Action:* **Hand-off to Senior Management.** The panel certifies the *safety*, but management must accept the *liability*.

  ***

  ### Application to Hypothetical Proposals

  Here is how the CFRP applies to three proposals you might encounter.

  #### Proposal 1: Predictive Maintenance for HVAC Units
  **Description:** An ML system analyses vibration data to flag air conditioning units needing repair before they break.
  **Harm:** If the system misses a fault, the unit breaks. A technician is sent to fix it.
  **CFRP Run:**
  *   **Q1 (Harm):** Temporary loss of cooling; cost of emergency repair.
  *   **Q2 (Reversible?):** **Yes.** Equipment can be fixed; no physical injury anticipated.
  *   **Q3 (Concentration?):** Risk is financial, borne by the company.
  *   **Q4 (Human-in-loop?):** Yes, facilities managers review flags.
  *   **Verdict:** **Average-Case Performance is Sufficient.**
  *   **Rationale:** The harm is low-stakes and reversible. Optimising for efficiency (average case) is appropriate here. The panel can approve based on standard accuracy metrics.

  #### Proposal 2: Hospital Shift Allocation System
  **Description:** A system allocates nursing shifts to minimise overtime costs while meeting staffing requirements.
  **Harm:** If the system fails, nurses may be overworked or wards understaffed.
  **CFRP Run:**
  *   **Q1 (Harm):** Nurse burnout; potential risk to patient safety due to fatigue.
  *   **Q2 (Reversible?):** **No.** Fatigue-related clinical errors are not reversible.
  *   **Q3 (Concentration?):** Risk concentrated on staff and vulnerable patients.
  *   **Q4 (Human-in-loop?):** Yes, but head nurses are often overruled by 'system requirements'.
  *   **Verdict:** **Requirement for Worst-Case Guarantees.**
  *   **Specific Guarantee Required:** **Bounded Harm.** The system must guarantee (hard constraint) that no nurse is scheduled for more than 12 hours in a 24-hour period, regardless of optimisation goals. Average overtime reduction is irrelevant if the worst case violates safety regulations.
  *   **Outcome:** Approved *only if* the hard constraints are code-enforced, not just loss-function penalties.

  #### Proposal 3: Automated Small-Business Loan Screening (The Unpopular Outcome)
  **Description:** A new model reduces default rates by 15% compared to the current system. It processes applications in seconds. It uses alternative data (cash flow patterns, utility payments).
  **Harm:** Rejection of viable businesses, leading to insolvency.
  **CFRP Run:**
  *   **Q1 (Harm):** Business failure, personal bankruptcy for sole traders.
  *   **Q2 (Reversible?):** **No.** Bankruptcy has long-tail legal and psychological effects.
  *   **Q3 (Concentration?):** **Critical Failure.** The validation data shows the model performs exceptionally well on average, but rejects 80% of applicants in two specific postcode districts, despite similar creditworthiness to approved areas.
  *   **Q4 (Human-in-loop?):** **No.** Fully automated for loans under £50k.
  *   **Phase 3 Check:** The proposal offers average default rates (1.5%) but no bound on rejection rates by region.
  *   **Verdict:** **REJECT.**
  *   **Why the Panel Will Not Like This:** The model is *more profitable* than the current one. The 15% reduction in defaults is a significant commercial gain. The panel members may feel pressure to approve a system that makes the company money and is 'better on average'.
  *   **Rationale:** Because the harm is irreversible (bankruptcy) and the risk is concentrated (geographic discrimination), average performance is ethically and legally indefensible. The proposal must return with a worst-case guarantee on approval rate parity or a human-review pathway for flagged postcodes.
  *   **Phase 4 Hand-Off:** The Compliance Director must sign a statement accepting the liability of potential discriminatory lending litigation if they choose to override the panel.

  ***

  ### What This Procedure Cannot Do

  You must be clear with your colleagues about the limits of this tool. It is a scaffold for reasoning, not a substitute for judgement.

  1.  **It Cannot Prove Safety:** A checklist does not make a system safe. It only ensures you have asked the right questions. A system can pass the CFRP and still fail in the wild due to unanticipated edge cases.
  2.  **It Cannot Resolve Value Conflicts:** Phase 4 explicitly hands off value judgements. If the company decides profit outweighs the risk of bankruptcy in Proposal 3, this procedure cannot stop them. It only ensures the decision is explicit and documented, rather than hidden behind 'average accuracy' claims.
  3.  **It Cannot Replace Expertise:** If your panel lacks someone who understands the clinical reality of a hospital ward, Q1 will be answered incorrectly. The procedure relies on the panel having at least one member who represents the 'victim' of the potential failure.
  4.  **It Is Not Static:** As the system learns or the environment changes (e.g., a pandemic changes hospital shift needs), the answers to these questions change. This review is valid only for the context at the time of deployment.

  ### Closing Advice

  Your friend's argument relies on the assumption that the future will look like the past. In stable environments (like HVAC maintenance), this is often true. In social environments (loans, healthcare), distributions shift, and adversaries emerge.

  When you sit on the panel, your role is not to maximise the company's utility function. Your role is to ensure that when the system inevitably encounters a case it was not trained on, the fallout does not destroy a human life. If a proposal cannot survive the scrutiny of its worst case, it does not deserve to be deployed, regardless of how good its average looks.

  Use the CFRP to make that distinction explicit. It will not make you popular with the sales team, but it will keep your rationale defensible when things go wrong.
