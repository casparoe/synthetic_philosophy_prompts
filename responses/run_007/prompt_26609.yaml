prompt: |-
  I run an upper-level undergraduate seminar in formal epistemology with about 16 students. We have 80 minutes. Design a classroom activity that makes students feel the force of the common prior assumption — specifically, the claim that if rational agents share a common prior and have common knowledge of each other's posterior probabilities, they cannot "agree to disagree." The activity should put students in a situation where they receive different private information, form probability judgments, and then have to reconcile those judgments publicly. The rules should be arranged so that they discover for themselves what happens when they do (and do not) share a common prior, before the concept is named. Include: the setup and materials needed, the sequence of rounds with precise instructions for the facilitator, a payoff scheme that does not require real money, a structured debrief that maps what happened in each round onto the formal idea, and an honest note on which features of the theorem the activity cannot reproduce. Also tell me what will predictably go wrong the first time I run it and how to handle it.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduate seminar in formal epistemology (approx. 16 students).
      *   **Time Limit:** 80 minutes.
      *   **Core Concept:** Aumann's Agreement Theorem (Common Prior Assumption, Common Knowledge of Posteriors, No Agreeing to Disagree).
      *   **Goal:** Design an activity where students *feel* the force of the assumption. They need to receive private info, form judgments, reconcile them, and discover the difference between sharing/not sharing a common prior *before* the concept is named.
      *   **Requirements:** Setup/materials, sequence of rounds (facilitator instructions), payoff scheme (no real money), structured debrief (mapping to formal theory), limitations note, and "predictable failures" + troubleshooting.

  2.  **Deconstruct the Theorem (Aumann's Agreement Theorem):**
      *   *Premise 1:* Common Prior (everyone starts with the same probability distribution over states of the world).
      *   *Premise 2:* Common Knowledge of Posteriors (everyone knows everyone's updated probability, everyone knows that everyone knows, etc.).
      *   *Conclusion:* Posteriors must be identical. If they differ, at least one premise is false.
      *   *Pedagogical Challenge:* "Common Knowledge" is hard to simulate in a classroom. "Common Prior" is easy to manipulate (give different instructions to different groups).

  3.  **Brainstorming the Activity:**
      *   *Idea 1: Estimating a jar of coins.* Too noisy. Hard to control priors.
      *   *Idea 2: Logic puzzles.* Too abstract, doesn't feel like probability updating.
      *   *Idea 3: A hidden state (e.g., a card color or a die roll) where students get private signals.* This is the standard "information partition" model.
      *   *Constraint:* 16 students. Need to pair them up or make small groups to facilitate interaction. Let's go with pairs (8 pairs).
      *   *Mechanism:* There is a "Truth" (State of the World). Students get private signals. They announce probabilities. They talk. They announce again.
      *   *Manipulation:* Round 1 = Common Prior (everyone told the same base rate). Round 2 = Different Priors (groups told different base rates).
      *   *Interaction:* They need to exchange information until they reach "Common Knowledge" of their posteriors. In a classroom, true common knowledge is hard. We can simulate it by having them announce numbers publicly until the numbers stop changing.

  4.  **Developing the "State of the World":**
      *   Let's use a bag of colored chips or a deck of cards.
      *   Simpler: A single hidden card (Red or Blue).
      *   Signals: Students draw a card from a sub-deck that correlates with the hidden card.
      *   *Wait, 80 minutes is tight.* Setting up physical draws might take too long and introduce noise.
      *   *Better:* Use a pre-generated "signal sheet" for each student.
      *   *State:* $S \in \{0, 1\}$. (e.g., Is the hidden coin Heads or Tails?)
      *   *Signal:* Each student gets a slip of paper saying "Heads" or "Tails" with some reliability (e.g., 75% accurate).
      *   *Prior:* The base rate of Heads vs. Tails.

  5.  **Refining the Activity Structure:**
      *   **Pairs:** 8 pairs of students.
      *   **Task:** Estimate $P(State = 1 | Information)$.
      *   **Round 1 (Common Prior):** All told $P(1) = 0.5$. Signals are correlated with truth.
      *   **Round 2 (Divergent Priors):** Group A told $P(1) = 0.8$, Group B told $P(1) = 0.2$.
      *   **Communication:** They must talk to their partner to agree on a joint probability.
      *   **Payoff:** Points based on accuracy (Brier score simplified) + Bonus for agreement (to incentivize the "Agreement" part of the theorem). *Correction:* Aumann's theorem says they *must* agree if rational. If we incentivize agreement, they might just lie to agree. We need to incentivize *accuracy*, and observe if accuracy forces agreement.
      *   *Revised Payoff:* Points for accuracy. If they disagree at the end, they get a penalty (simulating the "irrationality" of agreeing to disagree). Actually, to show the *force* of the theorem, the payoff should reward accuracy. The *discovery* is that when priors are common, accuracy drives them to the same number. When priors differ, accuracy drives them to different numbers even after sharing signals.

  6.  **Drafting the Steps:**
      *   **Prep:** Slips of paper with Signals and Priors.
      *   **Round 1:** Common Prior. Share signals. Update. Announce.
      *   **Round 2:** Different Priors. Share signals. Update. Announce.
      *   **Debrief:** Compare Round 1 convergence vs. Round 2 divergence.

  7.  **Addressing "Common Knowledge":**
      *   In the theorem, it's not enough to tell each other once. It's iterative. "I know that you know that I know..."
      *   *Classroom Hack:* Have them announce their probability publicly to the pair. If they differ, they must discuss *why* (reveal partition) and announce again. Repeat until numbers match. This simulates the iterative process leading to common knowledge.

  8.  **Addressing Predictable Failures:**
      *   *Math Anxiety:* Students might not know Bayes' rule. *Fix:* Provide a calculator or a lookup table. Or keep the math trivial (e.g., signals are definitive, or just ask for intuitive confidence). *Decision:* Upper-level formal epistemology students should know Bayes. But to save time, provide a "Bayes Calculator" worksheet.
      *   *Gaming:* Students might just average their numbers to agree quickly. *Fix:* Reveal the Truth at the end. Accuracy matters for the "grade."
      *   *Time:* 80 mins is short. Need strict timing.
      *   *Common Knowledge:* Students will think "I told him my number, now we have common knowledge." They won't do the infinite iteration. *Fix:* Facilitator must enforce "If numbers differ, you haven't finished."

  9.  **Developing the Payoff (No Money):**
      *   "Epistemic Utility Points" (EUPs).
      *   Winner gets a tangible reward (choice of seminar topic, coffee, or just glory).
      *   Scoring: Brier Score ($1 - (p - outcome)^2$).
      *   Agreement Bonus: If the pair submits the *same* number, they get a multiplier. If they submit different numbers, they get 0. This forces them to confront the "Agree to Disagree" constraint. *Wait, Aumann says they CAN'T disagree if rational.* If we penalize disagreement, we force the behavior. If we *don't* penalize disagreement, they might disagree.
      *   *Better approach for the lesson:* Tell them: "You must submit a joint number. You cannot submit until you agree." This forces the interaction. The lesson comes from *how hard* it is to agree in Round 2 vs Round 1.

  10. **Refining the "Different Prior" Condition:**
      *   To make the divergence clear, the signals shouldn't be strong enough to override the prior difference.
      *   Prior A: 90% Heads. Prior B: 10% Heads.
      *   Signal reliability: 60%.
      *   Even after sharing signals, the posterior gap should remain.

  11. **Structuring the Debrief:**
      *   Map "Slip of Paper Prior" to $\mu$.
      *   Map "Signal" to Partition/Information Set.
      *   Map "Announcing until match" to Common Knowledge of Posteriors.
      *   Map "Round 1 vs Round 2" to Common Prior Assumption.

  12. **Review against Constraints:**
      *   16 students? Yes (8 pairs).
      *   80 mins? Yes (tight but doable).
      *   No real money? Yes (Points).
      *   Predictable errors? Yes (included in plan).

  13. **Final Polish:**
      *   Make instructions crisp.
      *   Ensure the math is doable in 5 mins.
      *   Emphasize the *feeling* of frustration in Round 2.

  *(Self-Correction during drafting)*: I need to make sure the "Common Knowledge" aspect is highlighted. In Aumann's theorem, simply exchanging signals isn't enough; they exchange *posteriors*. If I have them exchange signals, they are pooling information. If they pool information, they *should* agree even with different priors if they treat the other's signal as evidence *about the world*.
  *Wait, critical theoretical point:* If agents have different priors but share all private information (pooling), they will still have different posteriors because they weight the evidence differently relative to their priors.
  *However*, Aumann's theorem is about exchanging *posteriors*, not raw signals.
  *Pedagogical adjustment:* To make it feel like Aumann, they should announce their *current probability*, not just read their signal.
  *Round 1:* I say 0.7. You say 0.6. Why? Oh, you got a 'Tails' signal. Okay, I update to 0.65. You update to 0.65. We agree.
  *Round 2:* I say 0.9 (because my prior is high). You say 0.2 (because your prior is low). I know your prior is low. You know mine is high. We know why we differ. Can we agree? No.
  *Instruction:* Students must announce their *Credence*, not just their signal. They can reveal signals to explain the credence.

  *Let's finalize the payoff:* To make them feel the "force," the rule is: **You cannot leave the round until you submit a single, joint number.** This forces the "Agreement" condition. The pain comes in Round 2 where agreement feels irrational because they know *why* they differ.

  *Wait, one more check:* If they know *why* they differ (different priors), and they are forced to agree, they will compromise. This might dilute the lesson.
  *Alternative:* Allow them to submit different numbers in Round 2, but penalize it.
  *Best for Epistemology Class:* Let them discuss freely. In Round 1, they naturally converge. In Round 2, they naturally stall or agree to disagree. Then the facilitator steps in: "You must agree to get points." In Round 1, this is easy. In Round 2, this feels like lying. *This is the sweet spot.* It highlights that with a Common Prior, agreement is truth-tracking. With Different Priors, agreement is arbitrary compromise.

  *Okay, let's write it.*
answer: |-
  # Activity: The Consensus Trap
  **Topic:** Aumann's Agreement Theorem & The Common Prior Assumption
  **Time:** 80 Minutes
  **Class Size:** 16 Students (8 Pairs)
  **Level:** Upper-Level Undergraduate Formal Epistemology

  ## 1. Learning Objective
  Students will experience the difference between **informational asymmetry** (which can be resolved) and **prior asymmetry** (which cannot be resolved by sharing information). They will discover that when priors are common, sharing posteriors forces convergence. When priors differ, sharing posteriors leaves a residue of disagreement that can only be bridged by arbitrary compromise, not rational updating.

  ## 2. Materials Needed
  *   **8 Envelopes** (labeled Pair 1 through Pair 8).
  *   **Inside each envelope:**
      *   2 "Prior Cards" (one for each student).
      *   2 "Signal Cards" (one for each student).
      *   1 "Recording Sheet" for the pair.
      *   1 "Bayes Calculator" (a simple lookup table to speed up math).
  *   **Projector/Board:** To display the "True State" and scores.
  *   **Timer:** Visible to the class.

  ## 3. The Setup (Hidden from Students)
  There is a "True State" of the world for the whole class, determined by the instructor before class starts.
  *   **State:** A coin flip (Heads or Tails).
  *   **Truth:** Let's fix it as **Heads** for the whole seminar (simplifies debrief).
  *   **Signal Reliability:** Signals are 75% accurate (if Truth is Heads, 75% of signals say "Indication H", 25% say "Indication T").

  **The Manipulation (The Common Prior Variable):**
  *   **Pairs 1–4 (Group Common):** Both students get a Prior Card saying: *"Base Rate: 50% Heads, 50% Tails."*
  *   **Pairs 5–8 (Group Divergent):** Student A gets *"Base Rate: 90% Heads."* Student B gets *"Base Rate: 10% Heads."*
      *   *Crucial:* In Group Divergent, students are told **explicitly** that their partner might have a different Base Rate card, but they don't know which one.

  ## 4. Payoff Scheme: "Epistemic Utility Points" (EUPs)
  No money changes hands. The reward is academic capital.
  *   **Accuracy Score:** Calculated using a simplified Brier Score: $100 - 100 \times (Reported Probability - Actual Outcome)^2$. (e.g., If Truth is Heads (1) and you report 0.8, Score = $100 - 100(0.2)^2 = 96$).
  *   **The Consensus Rule:** To receive *any* points for a round, the pair must submit **one single joint probability**. If they submit two different numbers, both get 0 for that round.
  *   **Winning:** The pair with the highest total EUPs across all rounds chooses the reading topic for the final week of the seminar.

  ## 5. Sequence of Rounds (Facilitator Script)

  ### Introduction (10 Minutes)
  1.  **Distribute Envelopes.** Tell students: "Do not open until instructed."
  2.  **Explain the Goal:** "You are estimating the probability of a hidden State (Heads/Tails). You want to be accurate. You also must agree with your partner to score."
  3.  **Explain the Math:** Point to the Bayes Calculator. "If your Prior is 50% and you see 'Indication H', your posterior is 75%. If Prior is 90% and you see 'Indication H', your posterior is 97%." (Pre-calculate these values on the handout so they don't waste time on arithmetic).
  4.  **Open Envelopes.** Give them 2 minutes to read their private cards silently. **Emphasize:** "Your Prior and Signal are private. Do not show the card. You may only speak."

  ### Round 1: The Calibration (15 Minutes)
  *   **Instruction:** "Discuss with your partner. Share whatever information you think is necessary. You must submit one joint probability. You have 10 minutes."
  *   **Facilitator Note:** In Group Common, this should be easy. They share signals, realize they have the same prior, calculate the same posterior, and agree. In Group Divergent, they will immediately hit a wall.
  *   **Collection:** Collect Recording Sheets. Do not reveal scores yet.

  ### Round 2: The Iteration (20 Minutes)
  *   **Instruction:** "Same pairs. Same envelopes. However, there is a new rule: **Common Knowledge Protocol.** You cannot just tell each other your number once. You must announce your current credence. If they differ, you must explain *why* (reveal your signal or reasoning), update, and announce again. You repeat this loop until your numbers match exactly. Only then do you write it down."
  *   **Facilitator Note:** Walk around. Listen to Group Divergent. They will say things like, "I know you have a low prior, but my signal says H." "I know, but my prior is low." They will realize that knowing the *reason* for the disagreement doesn't make the disagreement go away.
  *   **Intervention:** If Group Divergent is stuck at 5 minutes, announce: "Remember, if you don't agree, you get zero points. You *must* find a consensus." (This forces the "Agree to Disagree" tension).
  *   **Collection:** Collect Sheets.

  ### Round 3: The Reveal (10 Minutes)
  *   **Instruction:** "Open your envelopes again. Look at your partner's Prior Card. Now you have full information."
  *   **Task:** "Calculate what the probability *should* have been if you had pooled all information (both signals + both priors). Write this 'Ideal Probability' on a new sheet."
  *   **Reveal:** Announce the True State (Heads).
  *   **Scoring:** Calculate EUPs on the board.

  ### Debrief & Formal Mapping (25 Minutes)
  *This is the most critical section. Do not rush.*

  **Step 1: Data Display (5 mins)**
  *   Project a table: Pair # | Round 1 Agreement? | Round 2 Time to Agree | Round 3 Ideal Prob.
  *   Highlight the split: Pairs 1-4 agreed quickly. Pairs 5-8 struggled or compromised arbitrarily.

  **Step 2: Mapping to Aumann (15 mins)**
  Ask the following questions and map their answers to the board:

  1.  **"In Round 1, Group Common agreed easily. Why?"**
      *   *Student Answer:* "We had the same starting point."
      *   *Formal Map:* **Common Prior ($\mu$).**
  2.  **"In Round 2, I forced you to iterate announcements. Group Common didn't change their minds much after the first talk. Group Divergent kept talking but didn't converge naturally."**
      *   *Student Answer:* "We knew why we disagreed."
      *   *Formal Map:* **Common Knowledge of Posteriors.** In Group Common, sharing posteriors implies sharing partitions (signals), leading to identical updates. In Group Divergent, posteriors became common knowledge, but they *remained different*.
  3.  **"In Round 2, Group Divergent, how did you finally agree to get the points?"**
      *   *Student Answer:* "We averaged them," or "We just picked one."
      *   *Formal Map:* **Violating Rationality.** Aumann's theorem says rational agents *cannot* agree to disagree. If you agreed, one of you had to act irrationally (ignoring your own prior) to satisfy the payoff rule.
  4.  **"What is the one assumption that Group Common had and Group Divergent did not?"**
      *   *Formal Map:* **The Common Prior Assumption (CPA).**

  **Step 3: The "Force" of the Theorem (5 mins)**
  *   Conclude: "The theorem doesn't say agreement is good. It says agreement is *inevitable* if CPA holds. If you disagree, either you aren't rational, or you don't share a prior. In this activity, Group Divergent felt the 'force' because the only way to agree was to lie about your epistemic state."

  ## 6. Limitations: What This Activity Cannot Reproduce
  Be honest with the students about where the analogy breaks down:
  1.  **Infinite Iteration:** Aumann's theorem relies on infinite common knowledge ("I know that you know that I know..."). In class, you only simulated 2-3 rounds of announcement. True common knowledge is a logical limit, not a conversation.
  2.  **Honesty:** The theorem assumes agents truthfully report posteriors. In Round 2, Group Divergent likely lied or compromised to get points. The theorem predicts they *wouldn't* agree, not that they *shouldn't*.
  3.  **Partitions:** In the formal model, information partitions are fixed. Here, students chose how much of their signal to reveal.
  4.  **Priors as "Given":** In reality, priors are often formed by past evidence. The activity treats them as arbitrary starting points, whereas Bayesians might argue priors should converge with enough shared history (Harsanyi Doctrine).

  ## 7. Predictable Failures & Troubleshooting

  **Failure 1: The "Math Panic"**
  *   *Problem:* Students freeze on Bayes' rule calculations, eating up discussion time.
  *   *Fix:* The "Bayes Calculator" handout must be a lookup table.
      *   *Row 1:* Prior 50% + Signal H = 75%
      *   *Row 2:* Prior 50% + Signal T = 25%
      *   *Row 3:* Prior 90% + Signal H = 97%
      *   *Row 4:* Prior 90% + Signal T = 79%
      *   *Row 5:* Prior 10% + Signal H = 21%
      *   *Row 6:* Prior 10% + Signal T = 3%
  *   *Instruction:* "Do not derive. Look it up. Save your brainpower for the argument."

  **Failure 2: The "Polite Compromise" in Round 1**
  *   *Problem:* Group Divergent students might just average their numbers immediately (e.g., 0.9 and 0.1 $\to$ 0.5) to be nice, missing the tension.
  *   *Fix:* Change the payoff instruction. "You will be asked to justify your number individually after the game. If your submitted number does not match your private calculation based on your prior, you will be penalized for 'Epistemic Dishonesty'." This forces them to hold their ground.

  **Failure 3: "Common Knowledge" Confusion**
  *   *Problem:* Students think telling each other once is enough.
  *   *Fix:* As facilitator, interrupt Group Common in Round 2. "Student A, you said 0.75. Student B, you said 0.75. Do you *know* that Student A knows that you know?" Force them to verbally confirm the loop once to simulate the concept.

  **Failure 4: Time Overrun**
  *   *Problem:* Debate drags on.
  *   *Fix:* Use a loud timer. At 5 minutes remaining in a round, announce: "Final Call. Submit what you have." The pressure mimics the decision-theoretic pressure of the theorem.

  ## 8. Facilitator Cheat Sheet (The "Why" Behind the Moves)
  *   **Why force agreement?** To make them feel the violation of rationality. Aumann says disagreement is the natural state for different priors. Forcing agreement makes them feel the "cost" of the Common Prior Assumption.
  *   **Why reveal priors in Round 3?** To show that the disagreement wasn't due to hidden information (signals), but structural differences (priors).
  *   **Why 16 students?** 8 pairs is enough for statistical noise to average out (some pairs work better than others) but small enough to manage in 80 mins.
  *   **Why no real money?** Real money encourages risk-aversion that complicates probability reporting. Points keep it abstract and focused on the epistemic norm.

  ## 9. Closing Statement for the Class
  "Aumann's theorem is often cited as a proof that rational disagreement is impossible. Today, you felt why that is. When you shared a prior, agreement was automatic. When you didn't, agreement felt like a betrayal of your own evidence. The theorem doesn't tell us we *should* agree. It tells us that if we don't, we must admit we are starting from different worlds."
