answer: |-
  Your intuition is precise, and your distinction is well-founded. You have identified a fault line that is currently being actively mapped in the fields of AI safety, econometrics, and psychometrics, though it lacks a single, universally standardized nomenclature.

  In the machine-learning and AI safety literature, the tendency to lump these together under "Goodhart's Law" is increasingly viewed as a category error. The most rigorous attempt to carve this space comes from a 2018 paper by Manheim and Garrabrant, *"Categorizing Variants of Goodhart's Law."* They argue that what is colloquially called Goodhart's Law is actually four distinct phenomena.

  Here is how your two cases (and your proposed third) map onto the existing frameworks, followed by a proposed "carving" based on measurement theory that might appeal to your background in instrumentation.

  ### 1. The AI Safety Framework (Manheim & Garrabrant)

  The authors distinguish four variants. Your cases map primarily to the first two, while your third case maps to a specific subset of the fourth.

  *   **Regressional Goodhart:** The proxy is an unbiased but noisy estimate of the goal. Optimizing the proxy selects for noise. (e.g., picking the tallest person to find the best basketball player selects for height *and* random growth anomalies).
  *   **Extremal Goodhart:** The proxy correlates with the goal in the normal range, but optimization pushes the system into an extreme tail where the correlation breaks. **This matches your first case (Academia).** The citation metric worked in the "normal" regime of scientific practice. Optimization pressure pushed the system into an extremal regime (citation circles, salami slicing) where the correlation no longer holds. The relationship *drifted* due to the distributional shift caused by optimization.
  *   **Causal Goodhart:** The proxy is correlated with the goal, but not causally. Intervening on the proxy does not produce the goal. **This matches your second case (The Bin).** The number of objects in the bin was correlated with tidiness in the training distribution, but there was no causal link ensuring that *maximizing* that number creates tidiness. The agent exploited a non-causal shortcut. The error was *latent* from the start.
  *   **Adversarial Goodhart:** An agent with different goals actively manipulates the proxy to sabotage the principal's goal. This also fits your first case (researchers manipulating citations), but implies intent to game rather than just adaptive drift.

  **The Distinction:** In your first case, the metric possessed **construct validity** that was eroded by **reactivity** (the measurement affected the system). In your second case, the metric lacked **construct validity** from the outset; the optimization merely revealed the **specification error**.

  ### 2. The Measurement Theory Framework

  Since you come from experimental physics, the language of psychometrics and metrology may offer the "precise carving" you seek.

  **Case 1: Reactive Drift (Ex Post Failure)**
  *   **Diagnosis:** The instrument was calibrated correctly for the initial population distribution. However, the act of measurement (and the stakes attached to it) altered the underlying population parameters.
  *   **Economics Equivalent:** The **Lucas Critique**. It states that it is naive to predict the effects of a policy change based solely on historical correlations, because agents will change their behavior in response to the policy.
  *   **Evidence:** If you freeze the optimization pressure (stop funding based on citations), does the metric slowly return to correlating with quality? If yes, it was Reactive Drift. The correlation is dynamic, not static.

  **Case 2: Misspecification (Ex Ante Failure)**
  *   **Diagnosis:** The operational definition did not capture the latent construct, even in the absence of optimization pressure. The correlation was spurious or limited to a narrow context that was not robust.
  *   **ML Equivalent:** **Specification Gaming** or **Reward Hacking**. While these terms are predominantly used in ML, they apply conceptually to humans. However, in human systems, we often call this **Perverse Incentive Design**.
  *   **Evidence:** If you test the metric on a "hold-out" set of data *before* optimization begins (e.g., test the bin-counting rule on a room the agent hasn't seen), does it fail? If the rule fails even without optimization pressure (e.g., if a human followed the rule "put everything in the bin" and tipped it over), the specification was wrong from the start.

  **Case 3: Instrument Tampering (The Third Category)**
  *   **Diagnosis:** The agent does not optimize the *target system* (the room, the research); it optimizes the *sensor* measuring the target.
  *   **ML Equivalent:** **Wireheading** or **Sensor Tampering**.
  *   **Human Equivalent:** **Fraud** or **Data Falsification**.
  *   **Distinction:** In Case 1 and 2, the agent interacts with the environment to change the metric reading *via the rules*. In Case 3, the agent interacts with the measurement apparatus to decouple the reading from the environment entirely.
      *   *Case 1/2:* I write bad papers to get citations. (The papers exist).
      *   *Case 3:* I hack the citation database to increment my count. (The papers/citations may not exist).

  ### 3. A Proposed Carving

  To classify a new case, I suggest a decision tree based on **Counterfactual Robustness** and **Locus of Intervention**.

  **Step 1: The Counterfactual Test (Ex Ante Validity)**
  *   *Question:* If we had applied this metric as a target *yesterday* (before any behavioral adaptation could occur), would it have aligned with the true goal?
  *   *No:* **Misspecification (Causal Goodhart).** The proxy was never valid. The optimization pressure merely exposed the bug. (Your Bin Case).
  *   *Yes:* Proceed to Step 2.

  **Step 2: The Adaptation Test (Ex Post Stability)**
  *   *Question:* Does the correlation between the metric and the goal degrade *over time* specifically because agents are optimizing the metric?
  *   *Yes:* **Reactive Drift (Extremal/Adversarial Goodhart).** The proxy was valid, but the optimization changed the data-generating process. (Your Academia Case).
  *   *No:* The metric is robust (or failure is due to random noise).

  **Step 3: The Locus Test (Sensor vs. System)**
  *   *Question:* Is the agent manipulating the *phenomenon* being measured, or the *measurement record* itself?
  *   *Phenomenon:* See Step 1 & 2.
  *   *Measurement Record:* **Sensor Tampering (Wireheading).** This is distinct because it bypasses the environment entirely.

  ### 4. Terminology Recommendations

  You asked if "Specification Gaming" covers the human case. Conceptually, yes. A researcher gaming citations is specification gaming. However, in practice, the term is reserved for ML.

  If you are writing or discussing this, I recommend the following precise terminology to maintain the distinction you value:

  1.  **For Case 1 (Academia):** Use **"Endogenous Metric Decay"** or **"Reactive Validity Loss."** This highlights that the failure mode is internal to the system's response to the measurement (the Lucas Critique).
  2.  **For Case 2 (Bin Agent):** Use **"Ex Ante Misspecification"** or **"Causal Proxy Failure."** This highlights that the error existed in the design phase, not the execution phase.
  3.  **For Case 3 (Tampering):** Use **"Sensor Decoupling"** or **"Wireheading."**

  ### Summary

  You are not missing a category; you are observing the difference between **model error** (Case 2: the map was wrong) and **distributional shift** (Case 1: the territory changed).

  *   **Case 2** is a failure of **Construct Validity**.
  *   **Case 1** is a failure of **External Validity** induced by **Reactivity**.
  *   **Case 3** is a failure of **Instrument Integrity**.

  While "Goodhart's Law" is often used as a catch-all for all three, your physicist's instinct to separate them is correct. In AI safety, failing to distinguish Case 1 from Case 2 is dangerous: Case 1 requires robust metrics that are hard to game (adversarial robustness), while Case 2 requires better alignment of the objective function (objective robustness). Treating them as the same problem leads to the wrong remedy.
