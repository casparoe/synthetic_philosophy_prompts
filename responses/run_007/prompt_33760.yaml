  10. (Final Polish): Ensure the distinction between *optimization changing the world* (Case 1) and *optimization revealing a bug* (Case 2) is clear. Case 1 is dynamic; Case 2 is static (the bug was always there).

  *(Self-Correction during drafting)*: I should be careful not to say Case 2 is *never* Goodhart. Some definitions of Goodhart include misspecification. But the user is right that the *mechanism* differs. I need to highlight that the ML community is increasingly distinguishing these.

  Let's organize the terms:
  1.  **Ex-ante Misspecification** (Case 2) vs. **Ex-post Corruption** (Case 1).
