      *   **Proposed Carving (The "Precise Way"):**
          *   Dimension 1: *Robustness of the Proxy.* Was the correlation causal or spurious? Did it hold out-of-sample *before* optimization?
          *   Dimension 2: *Mechanism of Failure.* Is it distributional shift (Extremal), Agent Manipulation (Adversarial), or Causal Error (Causal)?
