answer: |-
  Your intuitions align with a sophisticated position in the philosophy of economics that rejects crude instrumentalism (the "F-twist") in favor of a form of **structural realism** about models. You are not asking whether assumptions are *true* (you admit they are false), nor solely whether they *predict* (you reject epicycles). You are asking whether the *source* of the model's success is faithful to the *source* of the world's behavior.

  The tension in the "falling bodies vs. climate" pair is the key to unlocking your commitments. In the falling bodies case, air resistance is a *perturbation* on a dominant force (gravity). In the climate case, atmospheric mixing is not a perturbation; it is the *medium* of the phenomenon. To assume instant mixing is not to simplify the dynamics; it is to eliminate the time-lags and transport mechanisms that *constitute* climate change.

  Based on your verdicts, here is the principle that systematizes your judgments.

  ### The Principle of Constitutive Relevance

  **Statement:**
  > A false assumption (idealization) is methodologically permissible if and only if the factor being distorted or denied is not **constitutively relevant** to the generative mechanism of the specific phenomenon (the *explanandum*) the model aims to capture.

  **Elaboration:**
  An assumption is *constitutively relevant* if the causal or logical process that produces the target outcome depends essentially on the structure or magnitude of that factor.
  1.  **Permissible Idealizations (Noise Reduction):** The assumption removes a factor that is empirically subordinate to the dominant mechanism (e.g., air resistance vs. gravity) or isolates a logical benchmark without negating the mechanism of interest (e.g., Coase).
  2.  **Impermissible Idealizations (Mechanism Destruction):** The assumption removes or fundamentally distorts the factor that drives the phenomenon (e.g., rationality in a panic, mixing in climate dynamics).

  ---

  ### Application to Your Verdicts

  Here is how the Principle of Constitutive Relevance (PCR) accounts for your cases:

  1.  **Frictionless Plane / Falling Bodies:** **Permissible.**
      *   *Reasoning:* The *explanandum* is the law of gravitational acceleration. Gravity is the constitutive mechanism; air resistance is a secondary, perturbing force. Setting friction to zero isolates the dominant mechanism without destroying it.
  2.  **Spherical Cow:** **Permissible.**
      *   *Reasoning:* The *explanandum* is heat loss scaling. Surface-area-to-volume ratio is the constitutive mechanism. Fur texture or leg shape are subordinate details.
  3.  **Coase Theorem (Zero Transaction Costs):** **Permissible.**
      *   *Reasoning:* The *explanandum* is the logical relationship between property rights and efficiency. Transaction costs are frictions on the *realization* of trade, not the *logic* of the rights assignment itself. The model functions as a benchmark isolation, not a claim that costs are zero in reality.
  4.  **Friedman's Billiards/Leaves:** **Permissible (with caveat).**
      *   *Reasoning:* The *explanandum* is the *trajectory* of the ball or the *position* of the leaf. The constitutive mechanism of the trajectory is Newtonian physics, not the agent's psychology. The assumption ("as if" calculation) is about the upstream cause, which is irrelevant to the downstream physical outcome.
  5.  **Financial Crises (Rational Expectations/Complete Markets):** **Impermissible.**
      *   *Reasoning:* The *explanandum* is the *crisis* (e.g., a liquidity run or asset bubble). These phenomena are constitutively generated by coordination failures, asymmetric information, or panic. Assuming rational expectations and complete markets logically precludes the possibility of these specific failures. The assumption destroys the mechanism it purports to explain.
  6.  **Ptolemaic Epicycles:** **Impermissible.**
      *   *Reasoning:* The *explanandum* is planetary order (implicitly). While epicycles predict *positions* (kinematics), they misrepresent the *forces* and *system architecture* (dynamics). The "machinery" (geocentrism) is constitutively relevant to a true explanation of the solar system, even if it is not strictly necessary for positional prediction. Your unease indicates you value explanatory depth over mere kinematic fit.
  7.  **Climate Models (Instant Mixing):** **Impermissible.**
      *   *Reasoning:* The *explanandum* is climate dynamics (heat/carbon distribution over time). Atmospheric transport is the constitutive mechanism. Assuming instant mixing removes the time-lags and spatial gradients that drive climate feedback loops. Unlike air resistance in falling bodies, mixing is not noise; it is the signal.

  ---

  ### Prediction for a New Case: The Representative Agent

  **Case:** A macroeconomic model assumes a single "Representative Agent" (RA) to study business cycles.

  **PCR Verdict:** **It depends on the *Explanandum*.**

  1.  **Scenario A: Long-run Growth Trends.**
      *   *Verdict:* **Permissible.**
      *   *Reasoning:* If the phenomenon is aggregate capital accumulation over decades, individual heterogeneity often averages out. The constitutive mechanism is the intertemporal trade-off between consumption and savings. The RA preserves this logic.
  2.  **Scenario B: Financial Instability or Inequality-Driven Recessions.**
      *   *Verdict:* **Impermissible.**
      *   *Reasoning:* If the phenomenon is a crisis driven by wealth distribution (e.g., the rich save too much, the poor borrow too much, leading to a demand shortfall), heterogeneity is *constitutively relevant*. An RA model cannot, by definition, generate distributional conflict. Using an RA here would be like using a rational-expectations model to explain a panic: it removes the very engine of the phenomenon.

  ---

  ### Limitations and Tensions

  While the Principle of Constitutive Relevance captures most of your judgments, there is one tension you must address in your chapter.

  **The Tension: Friedman's Billiards vs. Ptolemaic Epicycles.**
  You accept Friedman's billiards player (false psychology, true prediction) but reject Ptolemaic epicycles (false astronomy, true prediction).
  *   **PCR Resolution:** PCR explains this by distinguishing *upstream inputs* from *system structure*. In billiards, the psychology is an upstream input to a physical system (the ball's path). In epicycles, the geometry *is* the system structure.
  *   **The Cost:** To maintain this consistency, you must concede that your principle is **not purely instrumentalist**. You are demanding that for system-level models (climate, astronomy, macro), the *internal structure* of the model must map to the *internal structure* of the world, even if a "black box" model could predict the output.
  *   **The Verdict You Might Have to Give Up:** If you strictly adhere to PCR, you must be wary of **any** model that predicts well but relies on a "wrong" mechanism, even in economics. This puts pressure on your acceptance of Friedman. If you accept Friedman's billiards *solely* for prediction, you must explain why you don't accept Epicycles *solely* for prediction.
      *   *Suggested Resolution:* Argue that in the billiards case, we have independent knowledge of the true mechanism (physics), so the false assumption is known to be harmless. In the epicycle case (historically), the false assumption was taken to *be* the mechanism. Your principle thus includes an epistemic clause: *Idealizations are permissible only when we have independent warrant that the distorted factor is not constitutive.*

  ### Summary for Your Chapter
  You are advocating for a **Mechanism-Preservationist** view of modeling. You argue that tractability is a valid reason to simplify, but never a valid reason to delete the causal engine of the phenomenon you are studying. Your principle distinguishes between **simplifying assumptions** (which remove noise to reveal the signal) and **distorting assumptions** (which remove the signal itself). This allows you to keep the frictionless plane while discarding the efficient-market hypothesis in the context of crashes.
