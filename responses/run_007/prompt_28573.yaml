prompt: |-
  I write the "Big Ideas" column for a pop science and culture magazine, and my editor just greenlit a piece on the paradox of deontology — though she admitted she's not entirely sure our readers will stick with it. Her words: "make it hurt." I've got maybe 900 words, and my readers are sharp but not trained in philosophy. They've probably caught an episode of a philosophy podcast once, they know deontology is about rules rather than consequences, and thats about the extent of it. I don't want to just explain the thing; I want to figure out the right sequence to build it so the reader actually feels why it's troubling rather than filing it under "philosophers overthinking things again." What I need is the teaching architecture. What concept has to be in place before what — what's the dependency chain? What one example or scenario should carry the whole piece, and what does it need to have and what must it not have? What misconceptions are my readers going to form along the way — I'm especially worried they'll just decide deontology is obviously dumb and stop thinking — and exactly where in the sequence should I head each one off? And what's the check at the end that tells me they understood the problem rather than just nodded along? Give me the plan as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
