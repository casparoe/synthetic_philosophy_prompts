  3.  **Addressing the "Probability 1/2" Fallacy:**
      *   Why isn't it 1/2?
      *   This is the core of the *Piccione & Rubinstein (1997)* paradox.
      *   There are two main approaches to solving this:
          1.  **Modified Beliefs (Aumann, Hart, Perry):** The probability of being at a node depends on the strategy being played. If you exit with $p=1$, you are *never* at Intersection 2 (because you exited at 1). So $P(X_2) = 0$. If you exit with $p=0$, you are always at $X_2$ (conditional on reaching an intersection, assuming you started).
          2.  **Consistency/Constrained Maximization:** You cannot treat the probability of being at a node as independent of your strategy. The "absent-mindedness" means the information set contains both nodes. The probability of being at node $n$ within information set $I$ is determined by the path probabilities.
      *   *Calculation of Beliefs:*
          *   Let $p$ be the probability of exiting.
          *   Prob(Reach $X_1$) = 1.
          *   Prob(Reach $X_2$) = $1-p$ (must continue at $X_1$).
          *   Total probability of being at an intersection = $1 + (1-p) = 2-p$.
          *   $P(X_1 | \text{at intersection}) = \frac{1}{2-p}$.
          *   $P(X_2 | \text{at intersection}) = \frac{1-p}{2-p}$.
