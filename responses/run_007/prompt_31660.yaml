answer: |-
  The core pedagogical insight is that you must frame Goodman not as a skeptical challenge to induction's validity (Hume) but as a structural problem about which hypotheses are confirmed by their instances, forcing students to see that logical form alone cannot distinguish lawlike generalizations from accidental ones.

  ### Reasoning for this Approach
  Your students are stuck in "Hume mode," thinking the problem is getting from *past* to *future*. Goodman's point is that even if we grant the move from past to future is permissible, we still can't decide *which* future follows. To kill the "word game" misconception, you must emphasize that "grue" isn't just a label but a competing prediction about the physical state of emeralds after time *t*. To distinguish from Hempel, clarify that Hempel showed our intuitions about evidence clash with logic (Paradox of Confirmation), whereas Goodman shows our logic of confirmation is too permissive (New Riddle of Induction). Hempel asks, "Does this evidence count?" Goodman asks, "Which hypothesis does this evidence count for?"

  ### 75-Minute Teaching Sequence

  **1. Setup and Distinction (0:00–0:10)**
  *   **Hume Recap (3 mins):** Briefly acknowledge they know Hume: we can't justify induction without circularity. State that Goodman accepts we *do* induce successfully and asks *how* to codify the rules we actually use.
  *   **Hempel Distinction (7 mins):** Explicitly contrast with last week's Raven Paradox. Draw a table on the board:
      *   *Hempel:* Problem of **Evidence**. (Does a red shoe confirm 'All ravens are black'?)
      *   *Goodman:* Problem of **Hypothesis**. (Does observed green emeralds confirm 'All emeralds are green' OR 'All emeralds are grue'?)
      *   *Key Takeaway:* Hempel worries that confirmation is too hard to get; Goodman worries it is too easy to get.

  **2. The Grue Setup (0:10–0:25)**
  *   **The Example:** Use emeralds, but fix a specific date (e.g., "January 1, 2030"). Define *grue* as: examined before 2030 and green, OR examined after 2030 and blue.
  *   **The Data:** Assume today is 2024. We have observed 10,000 emeralds, all green.
  *   **The Conflict:** Write two hypotheses on the board:
      1.  All emeralds are green.
      2.  All emeralds are grue.
  *   **The Punchline:** Ask what happens to the next emerald found in 2035. Hypothesis 1 says Green. Hypothesis 2 says Blue. Both are equally supported by the 10,000 observations.
  *   **Immediate Misconception Check:** Ask the room, "Why are you smiling?" They will say "Because grue is made up."

  **3. Head Off the "Just a Definition" Objection (0:25–0:40)**
  *   **Timing:** Address this *now*, immediately after the conflict is established. If you wait until the end, they will have spent the whole session dismissing the premise.
  *   **The Symmetry Argument:** Do not defend "grue." Instead, attack "green." Define *bleen* (examined before 2030 and blue, OR after 2030 and green).
  *   **The Move:** Ask a student to define "green" using only "grue" and "bleen" (no color terms).
      *   *Solution:* Green = (grue and examined before 2030) OR (bleen and examined after 2030).
  *   **The Lesson:** From the perspective of a "grue/bleen" speaker, *green* is the gerrymandered, time-dependent predicate. There is no logical asymmetry between the predicates themselves. The objection "it's just a definition" fails because definitions are symmetric; the asymmetry must come from elsewhere.

  **4. Projectibility and Entrenchment (0:40–0:55)**
  *   **The Real Problem:** Now that logic and definitions are ruled out as differentiators, ask: "What breaks the tie?"
  *   **Goodman's Solution:** Introduce **entrenchment**. We project "green" not because it matches nature better (we can't know that yet) but because it has a history of successful projection.
  *   **The Shift:** Emphasize that this moves epistemology from a static relation between evidence and hypothesis to a dynamic, historical practice of language use. Induction is valid only relative to a linguistic practice.

  **5. Discussion and Implications (0:55–1:10)**
  *   **Open Floor:** Ask if entrenchment feels satisfying. (It usually doesn't).
  *   **Philosophy of Science Link:** Connect to theory choice. Why do we prefer Newtonian mechanics over a gerrymandered rival that fits the data equally well? Because of entrenched concepts (mass, force) vs. ad hoc ones.
  *   **Revisit Misconceptions:** Briefly ask again, "Is it still just a word game?" Ensure they see that if they say yes, they must admit *all* scientific prediction is just a word game, since all predicates are theoretically replaceable by grue-like variants.

  **6. Assessment (1:10–1:15)**
  *   **The Question:** Do not ask them to define grue. Ask this:
      > "We have observed 10,000 green emeralds. This evidence logically entails both 'All emeralds are green' and 'All emeralds are grue.' Since the evidence alone cannot distinguish them, what specific fact determines that 'green' is projectible and 'grue' is not, and is that fact about the world or about us?"
  *   **What to Listen For:**
      *   *Failure:* They talk about emeralds actually being green (begging the question) or say grue is "complex" (false symmetry).
      *   *Success:* They identify **entrenchment/past usage** as the tie-breaker and acknowledge this makes projectibility a feature of **our linguistic practices**, not just the evidence or the world.
