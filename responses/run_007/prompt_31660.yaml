prompt: |-
  I'm a third-year PhD student in philosophy of science and I got roped into teaching a guest session for a second-year epistemology course next week. The topic is Goodman's grue paradox, and I have seventy-five minutes. The students have already done Hume on induction — they know the basic worry about justifying inductive inference, theyve seen the standard responses (uniformity of nature, reliabilism, etc.) and why they're unsatisfying. So they're arriving with a sense that induction is in trouble but we somehow manage anyway, and I want to use that as the launching pad.

  Here's what I need from you: don't explain grue to me. I've read the book. I need a teaching plan. What has to go in what order so that grue lands as a genuinely new problem rather than just a cute restatement of Hume dressed up in funny vocabulary? I'm especially worried about two misconceptions: first, that grue is just a silly word game — "well nothing is actually grue, so who cares" — and second, that they'll confuse it with Hempel's raven paradox, which they read last week and which also messes with confirmation in a superficially similar way. What's the right carrying example to anchor the whole thing (I'm guessing it's not just "all emeralds are green" vs. "all emeralds are grue" straight out of the gate — or is it?), and at what point in the sequence should I explicitly head off the "it's just a definition" objection so it doesn't fester? Also, give me one question I can ask in the last five minutes that will tell me whether they've actually understood what's at stake with projectibility, as opposed to just being able to describe the paradox and parrot "entrenched predicates." And please lead with the bottom line — the core pedagogical insight — in the first sentence, then walk me through the reasoning and the sequence, no preamble and no restating the question.
