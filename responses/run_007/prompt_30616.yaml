prompt: |-
  I'm an actuary at a health and life insurer, so my working vocabulary is risk classification, underwriting, experience rating, moral hazard, adverse selection, community rating, guaranteed-issue rules, and the difference between risks you can price and risks you can't. Lately I keep getting pulled into bioethics and public-policy arguments where people talk as if the central question is whether a person's bad situation came from their choices or from their circumstances — 'brute luck' versus 'option luck.' From what I can tell this is the luck egalitarian position, associated with Dworkin and the literature after him: a distribution is fair to the extent it is sensitive to people's ambitions and choices but insensitive to their unchosen endowments and circumstances. Inequalities that trace to gambles people knowingly took are, if not fine, at least not something society owes them compensation for; inequalities that trace to unchosen bad luck are unjust and call for redress.

  Here's what I want. Restate that whole position in the vocabulary of insurance, as faithfully as you can: translate the brute-luck/option-luck distinction, the ambition-sensitivity/endowment-sensitivity test, and the claim that people should bear the costs of their choices but not their unchosen circumstances into the terms I actually use — insurable and uninsurable risk, adverse selection, moral hazard, actuarial fairness, risk classification, ex ante versus ex post. Be honest about the translation: don't smuggle in the luck egalitarian's categories and then pretend they were already in the actuarial toolkit, and don't force an actuarial category to do philosophical work it wasn't built for.

  Then give me the residue report. Which parts of luck egalitarianism map cleanly onto insurance concepts, which ones you had to distort or fudge to make them fit, and which ones have no expression at all in the actuarial vocabulary? For each piece of residue, say whether it points to something the actuarial framework is missing (and what a corrected framework would need) or whether it suggests the philosophical distinction is less sharp than it looks once you try to operationalize it. In particular I want to know whether the brute/option luck line survives contact with underwriting, or whether it mostly dissolves into something like 'risks we can observe, classify, and price' versus 'risks we can't.' You're an expert in both political philosophy and the economics of insurance. Think carefully before you write; start by brainstorming the main candidate translations and the likely points of resistance, then give me the translation and the residue report in a form I could take to my colleagues.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Actuary at a health/life insurer. Familiar with terms like risk classification, underwriting, experience rating, moral hazard, adverse selection, community rating, guaranteed-issue, insurable vs. uninsurable risk, ex ante/ex post.
      *   **Topic:** Luck Egalitarianism (Dworkin, Cohen, Arneson, etc.). Specifically the distinction between "brute luck" (unchosen circumstances) and "option luck" (chosen gambles), and the normative claim that society should compensate for the former but not the latter (ambition-sensitive, endowment-insensitive).
      *   **Task 1:** Translate the luck egalitarian position *into* actuarial vocabulary faithfully.
      *   **Task 2:** Provide a "Residue Report" analyzing the fit. What maps cleanly? What requires distortion? What has no expression? Does the brute/option luck distinction survive underwriting scrutiny, or does it collapse into "pricable vs. unpricable"?
      *   **Constraint:** Be honest. Don't smuggle philosophy into actuarial science or vice versa. Acknowledge where the frameworks diverge.
      *   **Tone:** Professional, analytical, peer-to-peer (actuary to actuary), but philosophically rigorous.

  2.  **Brainstorming Translations (Actuarial $\leftrightarrow$ Philosophical):**

      *   *Brute Luck:* Unchosen endowments (genetics, birthplace).
          *   *Actuarial:* Unclassifiable risk? Pre-existing conditions? Systemic risk? Risks excluded from underwriting (community rating)?
      *   *Option Luck:* Chosen gambles (smoking, extreme sports, investment choices).
          *   *Actuarial:* Lifestyle rating? Behavioral risk factors? Moral hazard (sort of)? Risks subject to deductibles/copays?
      *   *Ambition-Sensitivity:* You pay for your choices.
          *   *Actuarial:* Experience rating? Risk-based pricing? Underwriting adjustments?
      *   *Endowment-Insensitivity:* You don't pay for what you didn't choose.
          *   *Actuarial:* Community rating? Guaranteed issue? Subsidies? Pooling of uncorrelated risks?
      *   *Compensation for Brute Luck:*
          *   *Actuarial:* Indemnity? Social insurance? Reinsurance for high-risk pools?
      *   *No Compensation for Option Luck:*
          *   *Actuarial:* Exclusions? Waiting periods? Higher premiums based on behavior?
      *   *Ex Ante vs. Ex Post:*
          *   *Actuarial:* Pricing (ex ante) vs. Claims experience (ex post). Luck egalitarianism is often concerned with ex post outcomes, but insurance is fundamentally an ex ante contract.

  3.  **Drafting the Translation (The "Actuarial Luck Egalitarianism"):**

      *   *Core Principle:* A fair risk pool is one where premiums reflect *controllable* risk factors (option luck) but pool *uncontrollable* risk factors (brute luck).
      *   *Brute Luck $\rightarrow$ Uninsurable/Unclassifiable Risk:* These are risks where information asymmetry prevents pricing or where regulation forbids classification (e.g., genetics). In a pure market, these lead to adverse selection or market failure. Luck egalitarianism says these must be socialized (community rated).
      *   *Option Luck $\rightarrow$ Insurable/Classifiable Risk:* These are risks where the insured has agency. Underwriting can price these. If you choose to smoke, you pay the smoker rate. This is "actuarial fairness."
      *   *Moral Hazard:* This is the tricky one. In insurance, moral hazard is *bad* (it distorts pricing). In luck egalitarianism, "option luck" implies responsibility. If I choose to ski without a helmet, that's my option luck. Insurance might cover it but charge a premium, or exclude it.
      *   *The Normative Claim:* The "Fair Premium" = Price of Option Risk + Shared Cost of Brute Risk.

  4.  **Developing the Residue Report (The Critical Analysis):**

      *   *Clean Mappings:*
          *   Endowment-insensitivity $\approx$ Community Rating/Pooling of uncorrelated risks.
          *   Ambition-sensitivity $\approx$ Risk-based pricing/Underwriting on behavioral factors.
      *   *Distortions/Fudges:*
          *   *Moral Hazard vs. Option Luck:* Insurance tries to *minimize* moral hazard (via deductibles). Luck egalitarianism accepts the *consequences* of option luck. Insurance says "don't take the risk or pay more"; Luck Egalitarianism says "if you take the risk, you own the loss."
          *   *Information Asymmetry:* Actuarial science cares if we *can* price it (data availability). Philosophy cares if we *should* price it (normative status). Just because we *can* price genetics doesn't mean luck egalitarians think we should (that's brute luck).
      *   *No Expression/Gap:*
          *   *The Cut-off Point:* Actuarial science doesn't have a concept of "unchosen." It only has "correlated" vs. "uncorrelated" or "observable" vs. "unobservable."
          *   *Ex Post Redistribution:* Insurance is ex ante (premiums paid before loss). Luck egalitarianism is often ex post (compensating the actual loser). Insurance equalizes *cost*, Luck Egalitarianism wants to equalize *outcome* (or opportunity).
      *   *The Big Question (Brute/Option vs. Pricable/Unpricable):*
          *   Underwriting collapses the distinction. If we can predict it (e.g., credit score as proxy for responsibility), it becomes "pricable." Luck egalitarians might argue credit score is brute luck (poverty trap). Actuaries see it as predictive.
          *   *Conclusion:* The philosophical line dissolves into "regulatory constraints on classification" vs. "actuarially justified classification."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to equate "uninsurable" with "brute luck." In insurance, "uninsurable" often means "too correlated" (catastrophic) or "too uncertain." Brute luck can be highly predictable (e.g., Huntington's disease).
      *   *Correction:* Moral Hazard is technically a *change* in behavior due to coverage. Option Luck is the *gamble* itself. I need to distinguish these. Option luck is closer to "Lifestyle Rating."
      *   *Nuance:* Dworkin actually used an insurance model (hypothetical insurance market) to define luck egalitarianism. I should acknowledge that but focus on the *actual* actuarial vocabulary the user knows, not Dworkin's thought experiment.
      *   *Tone Check:* Ensure I'm not preaching philosophy. Speak like a colleague analyzing a model's limitations.

  6.  **Final Structure:**
      *   **Introduction:** Acknowledge the overlap (Dworkin did use insurance metaphors).
      *   **Part 1: The Translation:** Map the concepts directly.
          *   Brute Luck $\rightarrow$ Unclassifiable/Community-Rated Risk.
          *   Option Luck $\rightarrow$ Classifiable/Experience-Rated Risk.
          *   Fairness $\rightarrow$ Actuarial Fairness + Regulatory Constraints.
      *   **Part 2: The Residue Report:**
          *   Clean Fits.
          *   The Distortions (Moral Hazard, Predictive vs. Normative).
          *   The Null Set (Ex Post vs. Ex Ante).
          *   The Underwriting Test (Does the line hold?).
      *   **Conclusion:** Summary for the team.

  7.  **Drafting the Content (incorporating specific actuarial terms):**
      *   Use "Risk Classification" for the sorting mechanism.
      *   Use "Adverse Selection" to explain why we can't just ignore brute luck.
      *   Use "Predictive Validity" vs. "Causal Agency."
      *   Highlight the difference between *pricing* risk and *bearing* risk.

  8.  **Final Review against constraints:**
      *   Did I use the user's vocabulary? Yes.
      *   Did I avoid smuggling? Yes, by highlighting the gaps in the Residue Report.
      *   Is the brute/option luck line tested against underwriting? Yes, that's a key part of the residue.

  *(Self-Correction during final polish)*: Make sure to emphasize that insurance is about *pooling*, whereas luck egalitarianism is about *justice*. Insurance pools to stabilize loss; Luck Egalitarianism pools to neutralize fate. This is a crucial teleological difference.

  9.  **Final Polish:** Check tone. Ensure it sounds like a memo or briefing for a technical audience. (Proceed to generate output).

  *(Wait, one more thought)*: I need to make sure I address the "ex ante vs ex post" distinction specifically requested. Insurance is ex ante pricing. Luck egalitarianism is often ex post compensation. This is a major friction point. I will add a specific section on this.

  *(Another thought)*: The prompt asks about "risks you can price vs risks you can't." I need to be clear that "can't" in actuarial terms usually means "data is insufficient" or "correlation is too high," whereas in philosophy it means "morally impermissible." This is the core tension.

