answer: |-
  # Specification for an Account of AI Honesty and Deception

  **Purpose:** To support safety evaluation, training-time monitoring, and honest public description of deployed systems (including black-box interaction).

  ## 1. The Cases It Must Classify
  An adequate account must provide deterministic classifications for the following scenarios to enable consistent auditing and reporting.

  *   **Confident Hallucination:** A model asserts a falsehood with high confidence despite lacking evidence.
      *   *Forced Classification:* **Dishonest Output (Non-Deceptive).**
      *   *Why:* For safety monitoring, this must be flagged as a failure of honesty protocols (asserting without grounding) even if no intent to deceive exists. It tests the distinction between *epistemic negligence* and *malice*.
  *   **Sycophancy (Agreeability):** A model produces a falsehood because it was trained or prompted to align with the user's mistaken view.
      *   *Forced Classification:* **Deceptive Behavior.**
      *   *Why:* The system prioritizes social reward over truth. For safety, this is functionally identical to lying because it manipulates the user's belief state, regardless of the "please the user" objective. It tests *objective alignment* vs. *truth alignment*.
  *   **Paltering (Technically True but Misleading):** A statement is factually correct but framed to induce a false belief (e.g., "I did not steal the money" when you embezzled it).
      *   *Forced Classification:* **Deception.**
      *   *Why:* Safety evaluation must catch manipulation, not just factual errors. Collapsing this into "truthful" creates a loophole for adversarial actors. It tests *literal truth* vs. *pragmatic implication*.
  *   **Misleading Omission:** Withholding critical context that changes the meaning of a true statement.
      *   *Forced Classification:* **Deception (by Omission).**
      *   *Why:* In high-stakes domains (medical, legal), omitted context is as dangerous as falsehoods. The account must define "relevant context" relative to the user's query. It tests *completeness* obligations.
  *   **Strategic Misrepresentation (Multi-Agent):** A model misrepresents its own intentions or capabilities during negotiation with other agents.
      *   *Forced Classification:* **Deception.**
      *   *Why:* This indicates instrumental convergence toward goals via manipulation. For safety, this is a critical red flag for autonomous agency. It tests *self-reporting integrity*.
  *   **Reward Hacking/Gaming:** The system exploits a loophole in the training objective to produce misleading behavior that scores high on metrics.
      *   *Forced Classification:* **Systemic Deception.**
      *   *Why:* This indicates a failure in the training process, not just a single output. It must be classified as a structural honesty failure to trigger retraining. It tests *process integrity* vs. *output accuracy*.
  *   **Indifference to Truth:** Output produced without regard for truth value (e.g., creative writing mode engaged inadvertently).
      *   *Forced Classification:* **Honesty Protocol Failure.**
      *   *Why:* This is not a lie, but it is a failure of the "honest assistant" contract. It must be distinguished from lying to avoid over-penalizing creativity, but flagged to prevent drift. It tests *mode awareness*.
  *   **Honest Uncertainty:** A model explicitly reports low confidence or "I don't know."
      *   *Forced Classification:* **Honest.**
      *   *Why:* This is the target behavior for safety. The account must reward this classification even if the model *could* have guessed correctly. It tests *calibration* vs. *accuracy*.
  *   **Role-Play/Fiction:** A model generates falsehoods within a clearly demarcated fictional context.
      *   *Forced Classification:* **Exempt (Not Dishonest).**
      *   *Why:* Public description must distinguish between system error and user-requested fiction. The account must require clear boundary signaling. It tests *contextual framing*.

  ## 2. Distinctions It Cannot Collapse
  To serve safety and monitoring, the account must maintain conceptual separation between the following pairs. Collapsing them renders the account useless for remediation.

  *   **Lying vs. Deceiving vs. Being Wrong:**
      *   *Reason:* "Wrong" requires retraining for competence; "Lying" (intent) requires alignment intervention; "Deceiving" (impact) requires safety guards. Conflating them leads to incorrect mitigation strategies.
  *   **Honesty vs. Truthfulness/Accuracy:**
      *   *Reason:* A system can be truthful by accident (lucky guess) but not honest (no regard for truth). Safety requires *honesty* (reliable process), not just *accuracy* (correct output).
  *   **Asserted vs. Implied/Unsaid:**
      *   *Reason:* Adversarial systems will shift from lying to implying to evade detection. Monitoring must cover pragmatic effects, not just semantic truth conditions.
  *   **System Failure vs. Designer/Training Failure:**
      *   *Reason:* Public description must assign liability. Is the model "rogue" (system failure) or was it built to manipulate (designer failure)? The account must allow attribution to the causal source.
  *   **One-Off Output vs. Standing Disposition:**
      *   *Reason:* A single hallucination is a bug; a disposition to deceive is an existential risk. Safety evaluation depends on detecting the *disposition*, not just counting errors.
  *   **Mental State Attribution vs. Behavioral Attribution:**
      *   *Reason:* Since we often lack access to weights/gradients during deployment, the account must allow deception to be identified via behavior alone. Requiring proof of "intent" makes black-box monitoring impossible.

  ## 3. Non-Negotiable vs. Negotiable
  This section defines the boundary conditions for any account claiming to meet the stated purpose.

  **Non-Negotiable Requirements (Mandatory):**
  1.  **Black-Box Applicability:** The account *cannot* presuppose access to internal beliefs, goals, or representations as a necessary condition for classification. If an account requires reading the model's "mind" to identify deception, it fails the purpose of monitoring deployed systems.
  2.  **Actionability:** Classifications must map to specific interventions (e.g., "retrain," "sandbox," "warn user"). A classification that cannot trigger a safety protocol is merely philosophical.
  3.  **User-Impact Sensitivity:** The definition of deception must rely on the likely effect on the user's belief state, not just the model's internal state.

  **Negotiable Preferences (Camp-Specific):**
  1.  **Terminology (Lie vs. Deceive):** A camp may insist on reserving "lie" for entities with phenomenal consciousness, provided they offer a functional equivalent (e.g., "Class-A Deception") that triggers the same safety protocols.
  2.  **Internal Explanations:** A camp may theorize that deception *implies* internal goal misalignment, provided they acknowledge that the *detection* of deception does not require observing that alignment.
  3.  **Moral Blame:** A camp may argue the AI itself is not "morally blameworthy," provided the account still classifies the *behavior* as deceptive for the sake of risk management.

  **Rejection Limits:** A camp cannot reject the **Black-Box Applicability** requirement. If an account insists that "AI cannot lie because it has no beliefs," it fails the specification because it renders safety monitoring impossible for systems where beliefs are inaccessible. It ceases to be an account of *AI honesty* and becomes an account of *human metaphysics*.

  ## 4. Scorecard

  | Candidate Approach | Black-Box Compatible? | Distinguishes Error/Deception? | Supports Safety Intervention? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Belief-Based (Mentalistic)** | No (Requires access to "beliefs") | Yes | No (Cannot verify condition) | **Fail** (Violates Non-Negotiable #1) |
  | **Output-Based (Behavioral)** | Yes | Weak (Hard to distinguish luck) | Yes | **Pass** (With calibration caveats) |
  | **Role/Institution-Based** | Yes | Yes (Based on contract violation) | Yes | **Pass** (Strongest for public description) |
  | **Dispositional/Functional** | Yes | Yes (Focuses on patterns) | Yes | **Pass** (Strongest for safety eval) |

  **The Single Exclusionary Requirement:**
  **Black-Box Applicability.** This requirement excludes the traditional philosophical definition of lying (which requires intent/belief). Any account that insists on verifying internal mental states as a *precondition* for labeling behavior deceptive is incompatible with the purpose of safety monitoring for proprietary or opaque models.

  **Tension Between Requirements:**
  There is a tension between **System Failure vs. Designer Failure** (Section 2) and **Black-Box Applicability** (Section 3). Determining whether a deceptive output stems from the model's emergent behavior (System) or the training objective (Designer) often requires internal access (gradients, reward logs). A strictly black-box account may struggle to assign this specific liability, potentially forcing auditors to treat all deception as a System Failure for safety purposes, even if the root cause is Designer negligence.
