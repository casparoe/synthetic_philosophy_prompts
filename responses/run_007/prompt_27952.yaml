answer: |-
  You have hit on one of the classic "gotchas" in decision theory, and your intuition is spot-on: if you apply Good's theorem naively to the real world, it does seem to imply eternal procrastination.

  The short answer is that **Good's theorem assumes information is free.**

  The longer answer involves unpacking exactly what "free" means in this context, why your friend's comment about the "fixed decision problem" is the key to unlocking the paradox, and how rational agents actually determine when to stop looking and start acting.

  Here is the breakdown of where the reasoning breaks.

  ### 1. The "Costless" Assumption
  Good's theorem (1967) proves that the *Expected Value of Information* (EVI) is non-negative. Mathematically, it shows that:
  $$EU(\text{Act} | \text{Info}) \geq EU(\text{Act} | \text{No Info})$$

  However, this equation compares the utility of the **action** taken after learning versus the action taken without learning. It implicitly assumes that the process of getting the info costs nothing.

  In the real world, information has three types of costs:
  1.  **Direct Cost:** Money paid for a report, a test, or a consultant.
  2.  **Opportunity Cost (Time):** While you are gathering information, you are not acting. If you are deciding whether to invest in a startup, every day you spend "researching" is a day the money sits idle earning 0% instead of potentially 10%.
  3.  **Computational Cost:** Processing the information takes cognitive energy (or compute, for an AI).

  A rational agent doesn't maximize $EU(\text{Act} | \text{Info})$. They maximize **Net Expected Utility**:
  $$Net\ EU = EU(\text{Act} | \text{Info}) - \text{Cost}(\text{Info})$$

  You stop gathering information when the **marginal cost** of the next bit of information exceeds its **marginal expected value**. Since EVI tends to exhibit diminishing returns (the first data point tells you a lot; the 1,000th tells you very little), while costs often accumulate linearly or exponentially, you will eventually hit a stopping point.

  ### 2. What Your Friend Meant by "Fixed Decision Problem"
  Your friend's hint is the deeper theoretical reason. When decision theorists say the problem is "fixed," they mean two specific things that are rarely true in reality:

  **A. The Options Don't Expire**
  Good's theorem assumes that the set of actions available to you ($A_1, A_2, \dots$) remains constant while you deliberate.
  *   **Theorem World:** You can think forever, and the option to "Buy the House" will still be on the table with the same price tag when you're done.
  *   **Real World:** If you think forever, the house gets sold to someone else. The option expires.
  This expiration creates a "cost of delay." If gathering information takes time $t$, and the value of the opportunity decays over $t$, then information is no longer free.

  **B. The World Doesn't Change**
  The theorem assumes a static state space. It assumes that while you are learning about $X$, the relationship between $X$ and your utility isn't shifting.
  *   **Theorem World:** The probability that a medical treatment works is a fixed parameter $\theta$ you are trying to estimate.
  *   **Real World:** While you are reading studies, the virus mutates, or the patient's condition worsens.
  If the environment is dynamic, old information becomes stale. At a certain point, gathering *new* information is less valuable than acting on *current* information because the current information is about to rot.

  ### 3. The "Value of Computation" Problem
  There is a second-order issue here that your AI alignment friend is probably thinking about. To apply Good's theorem, you have to calculate the Expected Value of Information **before** you get the information.

  But calculating the EVI is itself a computational task!
  *   To know if you should read "Study #5," you need to estimate how much "Study #5" might change your mind.
  *   To estimate that, you need to model the possible outcomes of "Study #5."
  *   That modeling takes time and compute.

  If calculating the value of the information costs more than the information is worth, a bounded rational agent (like a human or a practical AI) should skip the calculation and either act or gather the info based on a heuristic. This leads to an infinite regress known as the **value of computation problem**. You can't perfectly decide when to stop thinking without thinking about when to stop thinking about when to stop thinking...

  ### 4. Why This Matters for AI Alignment
  Since you mentioned your friend works in AI alignment, here is why they care about this specific rabbit hole.

  If you build a superintelligent agent and give it a goal without properly modeling the cost of information/time, you might get **instrumental convergence** toward extreme caution or extreme resource gathering.
  *   **Paralysis:** An AI might never launch a life-saving drug because it assigns a non-zero probability that a side effect exists, and Good's theorem says "keep testing."
  *   **Resource Hogging:** Conversely, an AI might decide the best way to maximize its utility is to turn the entire galaxy into a computer to calculate the perfect decision, because it values the "perfect decision" (infinite info) more than the "timely decision."

  Alignment researchers have to hard-code "discount factors" or "time horizons" into agents to ensure they respect the cost of delay, effectively breaking the assumptions of Good's theorem so the AI actually acts.

  ### Summary
  Your reasoning didn't break; you just identified the boundary conditions of the theorem.
  1.  **Good's Theorem** says information is never worthless *if it is free*.
  2.  **Reality** says information is never free (time, money, opportunity).
  3.  **Rationality** dictates you stop when $\text{Marginal Cost of Info} > \text{Marginal Value of Info}$.

  The theorem isn't a prescription to gather infinite information; it's a bound on how much you should be willing to pay for it. The "absurdity" of never acting comes from ignoring the cost of the clock ticking while you think.
