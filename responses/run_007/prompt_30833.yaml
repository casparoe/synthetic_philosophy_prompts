          *   **Point 3: The Justification vs. Explanation.** Hume never claimed induction was *valid*. He claimed it was *inevitable*. Grue shows it's not inevitable for *any* predicate, only *entrenched* ones. Hume would say entrenchment *is* custom.
      *   *The Verdict:* Hume would treat it as a confirmation of his skepticism but a challenge to his simplicity. He'd say, "I told you reason can't decide, but I didn't realize language could trick us into thinking there are more options than psychology allows."
