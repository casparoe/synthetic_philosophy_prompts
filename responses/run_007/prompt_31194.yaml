      *   **Section 3: The Standpoint of Others.** Arendt's "enlarged mentality." Stevens specifically rejects this to maintain professional distance. But he feels the loss (Miss Kenton).
      *   **Conclusion:** What does Ishiguro add? The *cost* to the perpetrator. Arendt focuses on the crime; Ishiguro focuses on the hollowing out of the soul. Stevens is a warning about the *human price* of the banality of evil, not just the political price.

  6.  **Drafting - Key Nuances to Hit:**
