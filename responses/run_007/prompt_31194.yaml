      *   *Scope of Harm:* Eichmann facilitated genocide. Stevens facilitated fascism/appeasement, but his direct harm is interpersonal (Miss Kenton, the maids) and political (indirect). The stakes feel different, though the mechanism is similar.
      *   *Aestheticization:* Stevens aestheticizes his servitude. It's not just bureaucracy; it's an art form. Eichmann was boring; Stevens is tragic.
