  7.  **Refining the Tone:**
      *   Avoid jargon where possible, but keep it rigorous.
      *   Ensure Arendt isn't caricatured (she knew thoughtlessness was dangerous, not harmless).
      *   Ensure Stevens isn't let off the hook (he is complicit).

  8.  **Self-Correction/Review during drafting:**
