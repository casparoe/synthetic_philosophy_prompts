      *   Reasoning: Case 7 is the key. If subjective preference ruled, age could matter. But she ruled valid consent because age is trivial/objectively immaterial to the act. Wealth/Status is similarly external to the physical act and core identity (unlike the Twin case).
      *   Distinguishing Hypothetical: A man lies he is sterile vs. lies he is rich. Or: A man lies he loves her (marriage promise) vs. lies he is rich. Let's go with the "Love/Marriage" hypothetical vs. "Wealth" to test inducement vs. identity. Actually, to distinguish Subjective vs. Objective: "A woman says she only sleeps with vegetarians. Man lies he is vegetarian." Subjective = No Consent. Objective = Valid Consent.

  6.  **Refining for Word Count:**
      *   Need to be concise.
