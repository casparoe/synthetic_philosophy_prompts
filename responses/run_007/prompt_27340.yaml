      *   Ensure Case 7 (Age) is the anchor.

  7.  **Final Polish:**
      *   Check word count.
      *   Check tone (analytical but helpful for a novelist).

      *   *Self-Correction on Rule A:* Case 7 explicitly says "she later says the lie made no difference." This leaves open whether subjective materiality *would* rule if she *had* said it made a difference. However, legal/philosophical consistency usually leans toward objective standards to avoid Case 7 becoming "No Consent" if she lied about age to a woman who only dates younger men. Adeyemi's consistency suggests an objective threshold for "fraud in the factum."
