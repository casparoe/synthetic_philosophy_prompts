  3.  **Identify Candidate Rules:**
      *   *Rule A (Subjective Materiality):* Consent is invalid if the deception concerns any fact the victim subjectively deems deal-breaking.
      *   *Rule B (Objective Materiality/Transaction Core):* Consent is invalid only if deception concerns the physical act, identity (biological/legal), or direct health risks. Status/wealth lies are external inducements, not core to the act.
      *   *Rule C (Fraud in the Factum vs. Inducement):* Consent is invalid if deception changes the *nature* of the act (e.g., who, what, safety), but valid if it merely provides a *reason* for the act (e.g., career gain, love promises).

  4.  **Evaluate Rules against Prior Cases:**
