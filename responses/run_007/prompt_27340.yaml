      *   *Rule C:* Similar to B. Distinguishes "what is happening" vs. "why it is happening." Case 1 is "who" (factum). Case 2 is "safety" (factum). Case 7 is "why" (inducement). New Case is "why" (career). Predicts Valid Consent.

      *   *Conflict:* Case 7 suggests subjective materiality isn't enough (she said age lie made no difference). But what if she *had* said age mattered? Case 1 implies identity is objective. Case 2 implies health is objective.
      *   *Refinement:* Adeyemi seems to distinguish between deception regarding the *nature of the act/partner* vs. deception regarding *collateral benefits*.
      *   Case 1 (Twin): Wrong person (Nature of partner).
      *   Case 2 (STD): Physical risk (Nature of act).
      *   Case 3 (Condom): Condition of act (Nature of act).
      *   Case 7 (Age): Attribute not central to identity/act.
      *   New Case (Wealth/Status): Attribute/Collateral benefit. Like Age (Case 7), not like Twin (Case 1).

      *   *Best Guess:* Adeyemi rules based on **objective materiality concerning the physical act or core identity**, not subjective deal-breakers regarding external benefits. She likely views sex as a specific transaction; lies about the transaction void it, lies about the surrounding context (wealth, age, love) do not.
      *   *Prediction:* Valid Consent. (Like Case 7, unlike Case 1).

  5.  **Drafting the Response:**
