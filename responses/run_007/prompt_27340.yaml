  2.  **Analyze the Prior Rulings:**
      *   Case 1 (Impersonation): No consent. (Identity deception vitiates consent.)
      *   Case 2 (STD Lie): No consent. (Health risk deception vitiates consent.)
      *   Case 3 (Stealthing): No consent. (Condition of protection violated vitiates consent.)
      *   Case 4 (Quid Pro Quo): No consent. (Coercion vitiates consent.)
      *   Case 5 (Drunk): No consent. (Incapacity vitiates consent.)
      *   Case 6 (Tipsy): Valid consent. (Capacity retained.)
      *   Case 7 (Age Lie): Valid consent. (Trivial deception does not vitiate consent.)

      *   **Pattern:** Consent is invalid when deception/coercion/incapacity concerns *material* facts about the act, the person's identity, or significant risks/consequences. Consent is valid when deception is trivial or capacity is intact.
      *   **Key Distinction:** Case 2 (STD) vs. Case 7 (Age). Health risk matters; age (usually) doesn't. Case 1 (Twin) vs. Case 7 (Age). Identity matters; attributes might not.
