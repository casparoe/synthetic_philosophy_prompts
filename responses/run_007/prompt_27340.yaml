      *   *Looking at Case 2:* STD is physical risk.
      *   *New Case:* No physical risk.
      *   *Looking at Case 7:* Age is a personal attribute. Wealth/Status is a personal attribute/circumstance.
      *   *Conclusion:* Adeyemi likely treats Wealth/Status like Age (Case 7), not like Identity (Case 1) or Safety (Case 2).
      *   *Prediction:* Valid Consent.

      *   *Distinguishing Hypothetical:* Needs to test if *any* subjective deal-breaker voids consent.
      *   *Hypo:* "A woman states she will only sleep with a Catholic. A man lies he is Catholic." If Adeyemi says No Consent, she holds Subjective Materiality. If Valid Consent, she holds Objective Core.

