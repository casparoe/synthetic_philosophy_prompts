answer: |-
  The fragmentation you observe is not accidental; it stems from the fact that "vagueness" is a cluster concept pulling in contradictory directions. We want language to be precise enough for logic but flexible enough for the world. Below is an explicit audit of the desiderata, their motivations, and their negotiability, followed by an analysis of the structural tensions between them.

  ---

  ### Part I: The Six Desiderata

  #### 1. Sorites Resolution
  *   **The Datum:** The Sorites paradox (e.g., one grain is not a heap; adding one grain never makes a heap; therefore, a million grains are not a heap). The conclusion is false, the reasoning appears valid, and the premises appear true.
  *   **The Requirement:** A theory must identify exactly where the argument fails. It must either:
      1.  **Block Validity:** Show the inference rule (e.g., Modus Ponens) fails for vague predicates.
      2.  **Deny a Premise:** Identify a specific cutoff point where the inductive step fails.
      3.  **Dissolve the Argument:** Show the terms shift meaning during the sequence (contextualism).
  *   **The Explanatory Burden:** Merely blocking the paradox is insufficient. Because the premises are *plausible*, a theory must provide an **error theory**: an explanation of why competent speakers find the false premise true or the invalid inference valid. If you deny the inductive premise, you must explain why we cannot identify the cutoff.
  *   **Status:** **Non-negotiable.** A theory of vagueness that does not resolve the Sorites is not a theory of vagueness. However, *how* it resolves it (logic vs. semantics) is the primary battleground.

  #### 2. The Nature of Borderline Cases
  *   **The Datum:** There are objects (e.g., a specific shade of color, a specific height) for which it seems categorically wrong to say "It is F" and categorically wrong to say "It is not F," yet bivalence suggests one must be true.
  *   **The Requirement:** The theory must assign a semantic status to these cases that distinguishes them from clear cases and from ignorance of a fact. It must explain why stipulation (e.g., "Let's decree this shade is red") feels like a change of subject rather than a discovery.
  *   **Scope Limit:** The theory is **not** required to explain *why* specific predicates (like 'heap') are vague while others (like 'prime') are not. That is a question of metaphysics or language acquisition, not the logic of vagueness. A theory of vagueness can take the existence of vague predicates as a brute input.
  *   **Status:** **Non-negotiable.** If a theory treats borderline cases as merely "unknown sharp boundaries" (Epistemicism), it satisfies this by redefining the datum. If it treats them as truth-value gaps, it satisfies it differently. Ignoring the phenomenology of the borderline is fatal.

  #### 3. Higher-Order Vagueness (HOV)
  *   **The Datum:** If you draw a line between 'clearly F' and 'borderline F', that line itself seems vague. There are cases where it is borderline whether the case is borderline.
  *   **The Requirement:** A theory must not replace the vagueness of 'F' with a sharp boundary between 'F' and 'not-F' (or 'true' and 'not-true'). If it introduces a new precise operator (e.g., "Definitely"), it must ensure that "Definitely" does not generate a new Sorites paradox.
  *   **Status:** **Contested.**
      *   *Non-negotiable for:* Supervaluationists, Degree Theorists, Contextualists. For them, sharp boundaries are the *explanandum* to be avoided.
      *   *Negotiable for:* Epistemicists. They argue sharp boundaries are real but unknowable. For them, HOV is just ignorance about where the boundary of ignorance lies.
      *   *Assessment:* This is the hardest technical hurdle. Many theories solve first-order vagueness only by positing a sharp boundary in the metalanguage (e.g., between truth value 1 and 0.99). A robust theory must handle HOV without infinite regress.

  #### 4. Logical Conservation vs. Revision
  *   **The Datum:** Classical logic (CL) underpins mathematics and science. Vague predicates seem to violate the Law of Excluded Middle (LEM) (e.g., "This is red or this is not red" feels unsettled for borderline cases).
  *   **The Requirement:**
      *   *Conservative View:* Preserve CL validities. If LEM fails, explain why it *seems* to hold.
      *   *Revisionist View:* Adopt a non-classical logic (e.g., Intuitionistic, Fuzzy). If doing so, provide a translation manual or justification for why standard reasoning remains safe in precise contexts.
  *   **Status:** **Preference/Trade-off.** This is the main dividing line.
      *   *Epistemicism* preserves CL completely.
      *   *Supervaluationism* preserves CL validities (global truth) but rejects truth-functionality (local truth).
      *   *Many-Valued Logics* revise CL (LEM fails).
      *   *Constraint:* A revisionist theory owes an account of why classical reasoning works so well in non-vague domains. A conservative theory owes an account of why LEM holds for borderline cases.

  #### 5. Penumbral Connections
  *   **The Datum:** Vague predicates stand in logical relations. Nothing can be *clearly red* and *clearly orange* all over. If *x* is clearly tall, *x* is not clearly short.
  *   **The Requirement:** The semantics must ensure that logical incompatibilities hold even in the penumbra. If 'Red' has value 0.5 and 'Orange' has value 0.5, the conjunction 'Red and Orange' should not be true (or 0.5).
  *   **Status:** **Non-negotiable.** This is a major technical filter. Simple Many-Valued Logics (like Łukasiewicz) often fail here (if Red=0.5 and Not-Red=0.5, the conjunction might be non-zero). Supervaluationism handles this well (true on all precisifications). Epistemicism handles this trivially (classical logic holds).
  *   **Constraint:** This rules out any semantics where truth values are assigned independently to related predicates without constraints.

  #### 6. The Forced-March Sorites
  *   **The Datum:** If a speaker is forced to classify every item in a Sorites sequence one by one (e.g., "Is patch 1 red?" "Is patch 2 red?"), they will eventually switch from "Yes" to "No." This seems to commit them to a sharp cutoff, contradicting the claim that there is no cutoff.
  *   **The Requirement:** The theory must explain this shift without admitting a semantic sharp boundary. Options include:
      *   *Contextualism:* The meaning of 'red' shifts with each judgment.
      *   *Psychologism:* The shift is a performance error, not semantic competence.
      *   *Tolerance:* The theory denies the speaker is committed to the cutoff (e.g., the switch is arbitrary).
  *   **Status:** **Debated.** Some theorists argue this is not a semantic test but a psychological one. However, a theory that predicts speakers *should* be able to march through without contradiction (when they demonstrably cannot) is empirically inadequate. It is a strong constraint on Contextualist and Relativist views.

  ---

  ### Part II: Incompatibilities and Impossibility Results

  You asked if there is a subset of desiderata that cannot be jointly satisfied. **Yes.** There is a well-known trilemma in the literature, often attributed to arguments by Timothy Williamson and Roy Sorensen.

  **The Trilemma of Vagueness:**
  You cannot jointly hold the following three claims:
  1.  **Classical Logic:** The logic of vague predicates is classical (Bivalence and LEM hold).
  2.  **Semantic Indeterminacy:** Vagueness is a semantic phenomenon (there is no fact of the matter about borderline cases), not merely epistemic ignorance.
  3.  **No Sharp Boundaries:** There are no sharp boundaries in the extension of vague predicates (not even hidden ones).

  **The Tension:**
  *   If you keep **Classical Logic** and **Semantic Indeterminacy**, you are forced into **Sharp Boundaries**. (This is the Supervaluationist result: there is a sharp boundary in every *precisification*, even if no boundary is common to *all* precisifications. Williamson argues this still entails sharp boundaries exist, we just don't know which ones).
  *   If you keep **Semantic Indeterminacy** and **No Sharp Boundaries**, you must revise **Classical Logic**. (This is the Many-Valued or Intuitionistic route: LEM fails because there is no fact of the matter).
  *   If you keep **Classical Logic** and **No Sharp Boundaries**, you must deny **Semantic Indeterminacy**. (This is Epistemicism: boundaries are sharp, logic is classical, so the indeterminacy must be purely ignorance).

  **The Impossibility Result:**
  There is no model that satisfies **Classical Logic**, **Semantic Indeterminacy**, and **No Sharp Boundaries** simultaneously without generating a contradiction or an infinite hierarchy of metalanguages.
  *   *Why?* If logic is classical, every sentence is True or False. If there are no sharp boundaries, there must be a case *n* where *F(n)* is True and *F(n+1)* is False (to avoid the Sorites conclusion). That *is* a sharp boundary. To avoid this, you must say *F(n)* is neither True nor False. But that violates Classical Logic (Bivalence).
  *   *Higher-Order Complication:* If you try to fix this by adding a third value ("Borderline"), you create a sharp boundary between "True" and "Borderline." To fix that, you need a fourth value. This leads to the **Higher-Order Vagueness Regress**. Avoiding this regress while keeping Classical Logic is widely considered impossible.

  ---

  ### Part III: The Single Eliminator

  If I had to pick one desideratum that eliminates the largest number of candidate theories in a single stroke, it is:

  **The Requirement to Account for Higher-Order Vagueness without Sharp Boundaries.**

  **Why?**
  1.  **Eliminates Epistemicism:** Epistemicism explicitly accepts sharp boundaries (hidden ones). It fails the "No Sharp Boundaries" clause of this desideratum immediately.
  2.  **Eliminates Simple Supervaluationism:** Standard Supervaluationism draws a sharp line between "admissible precisifications" and "inadmissible ones." This creates a sharp boundary at the meta-level. To fix this, you need "Super-Supervaluationism," leading to regress.
  3.  **Eliminates Simple Degree Theories:** Standard Fuzzy Logic draws a sharp line between "Perfectly True" (value 1) and "Less than Perfectly True" (<1). This boundary is vulnerable to a higher-order Sorites.
  4.  **Eliminates Simple Contextualism:** If context shifts to avoid boundaries, there must be a rule governing *when* it shifts. If that rule is precise, there is a sharp boundary. If it is vague, the regress begins.

  **The Verdict:**
  Almost every "first-pass" theory solves first-order vagueness by positing a precise mechanism (truth values, precisifications, cutoff points). The demand that the *mechanism itself* be vague (to avoid higher-order boundaries) destroys the precision required to make the theory formally tractable.

  This is why the literature has moved toward **pluralism** (vagueness is different things in different contexts) or **epistemicism** (accepting the sharp boundaries as the price of logic). The desideratum of **Higher-Order Vagueness without Sharp Boundaries** is the filter that separates the "toy models" from the "serious contenders," and it leaves almost nothing standing. It forces a theorist to choose: either accept sharp boundaries (and explain away the intuition), accept logical revision (and pay the cognitive cost), or accept an infinite hierarchy (and pay the complexity cost). You cannot have it all.
