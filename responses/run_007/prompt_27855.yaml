      *   *The Two Versions:*
          *   Distinguish Common Consequence (your first example) vs. Common Ratio (your second example).
          *   Explain they are technically distinct violations but both fall under Allais.
      *   *The Certainty Effect:* Connect this to Kahneman & Tversky's Prospect Theory. The drop from 100% to <100% is psychologically massive. This explains Pair 1 of Example 1 and Pair 1 of Example 2.
      *   *The "Mistake" Question:* This is the nuance.
