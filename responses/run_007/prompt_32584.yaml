          4.  *Cultural/Linguistic:* Offloading trials to others/tools/symbols (humans). Trial-and-error across society/time.
      *   **The Ask:** Is this an established framework? Does it have a name? Are these distinct kinds or a continuum? Where are the boundaries? What are the edge cases (social learning, implicit skill, pre-linguistic children)?
