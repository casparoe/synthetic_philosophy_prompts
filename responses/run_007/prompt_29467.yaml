answer: |-
  The stalemate you describe is a classic example of a **methodological impasse over theoretical virtues**, rather than a simple first-order dispute about value or a purely verbal confusion. Your working theory is largely correct: the disagreement is about which element of the theoretical package is more negotiable. However, characterizing it merely as "verbal" understates the substantive costs involved. The dispute is mixed: it is verbal insofar as the parties are operating with slightly different concepts of 'better than' (one phenomenological, one structural), but it is substantive because each choice carries a heavy price tag that neither side wants to pay.

  On one side, the **Intransitivists** (e.g., Temkin, Rachels) treat the pairwise intuitive judgments as the hard data. For them, 'better than' reports a phenomenological or moral reality that is sensitive to context or magnitude. To deny that $A$ is better than $B$ when the difference is perceptible is to deny the evidence of moral perception. Their cost is accepting that rationality might not require transitivity, which opens the door to money-pump arguments and cyclical preferences. They argue this cost is manageable or that standard Dutch Book arguments don't apply to moral value.

  On the other side, the **Transitivists** (e.g., Broome, Qizilbash) treat the structural constraint of transitivity as constitutive of the concept 'better than'. For them, a non-transitive 'better than' is not a different kind of value relation; it is a failure of the concept to get off the ground. Their cost is denying the pairwise intuitions. They must argue that there is a "zone of indeterminacy" or "imprecise equality" somewhere in the chain where $A$ is not better than $B$, even if they look different. This feels like a "forced error" to the other side, akin to denying a visible color difference to save a logical rule.

  The reason this hasn't moved in decades is that both sides have successfully defensive positions. The Intransitivists have shown that non-transitive logics can be coherent. The Transitivists have shown that vague predicates can handle sorites without abandoning bivalence or transitivity (via supervaluationism or epistemicism). The stalemate persists because there is no neutral arbiter to weigh the cost of "moral blindness" (Transitivist cost) against the cost of "structural irrationality" (Intransitivist cost).

  **What counts as progress?**
  More examples or intuitions will not help; we are saturated with them. Progress requires a **conceptual or formal innovation** that dissolves the forced choice. Specifically, progress would look like a semantic model that validates the pairwise intuitions as *vague* or *context-sensitive* without generating exploitable cycles, or a pragmatic argument showing that 'better than' functions differently in local comparisons versus global rankings. If a theorist can demonstrate how to retain the phenomenological data without inviting money pumps (perhaps by restricting the domain of transitivity), or conversely, show exactly where the pairwise intuition fails without arbitrariness, the stalemate breaks. Until then, the dispute remains a standoff over which theoretical sin is venial and which is mortal.

