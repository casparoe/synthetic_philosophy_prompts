answer: |-
  You have put your finger on one of the central, unresolved tensions in the philosophy of medicine and psychiatry. The pattern you are describing is well-known to philosophers of science, though it rarely makes it into public discourse.

  There isn't one single word that captures the rhetorical *and* conceptual nature of this move, but there are three specific frameworks that name exactly what you are seeing.

  ### 1. The Philosophical Framework: Naturalism vs. Normativism
  In the philosophy of medicine, this is known as the **Naturalist-Normativist Debate**.

  *   **Naturalism (The "Fact" Claim):** This view, championed by philosophers like Christopher Boorse, argues that disease is a purely biological fact. It is a deviation from normal species functioning, detectable by science (like a broken bone or a virus). On this view, values (suffering, social approval) are irrelevant to whether something *is* a disease, even if they matter for treatment.
  *   **Normativism (The "Value" Claim):** This view, associated with thinkers like H. Tristram Engelhardt, argues that "disease" is inherently a value judgment. A biological difference only becomes a disease when we decide it is *bad* or *undesirable*. On this view, you cannot define illness without referencing human goals and suffering.

  **The Move You Noticed:** When defending the reality of ADHD or depression, proponents often start with a **Naturalist** argument (brain scans, genetics) to secure the ontological status of the condition (making it "real" like diabetes). But when challenged on why that biological state constitutes an *illness* rather than a *variation*, they silently switch to a **Normativist** argument (suffering, impairment).

  In academic terms, this is often called **"Conceptual Hybridity"** or **"The Fact-Value Entanglement."** The diagnosis relies on both, but the defense often pretends it relies only on the Fact.

  ### 2. The Rhetorical Framework: The Motte-and-Bailey Doctrine
  If you are looking for the name of the *argumentative tactic* (the sliding between the two claims to win a debate), the closest fit is the **Motte-and-Bailey Doctrine**.

  *   **The Motte (The defensible position):** "There are measurable biological differences associated with this condition." (Hard to deny, but doesn't prove "illness").
  *   **The Bailey (The desired position):** "This condition is a medical disease that warrants intervention." (Valuable claim, but vulnerable to the "variation vs. disease" critique).

  When you challenge the Bailey ("Why is this difference an illness?"), the arguer retreats to the Motte ("Because the brain looks different!"). When you challenge the Motte ("People have that brain difference and are fine"), they advance to the Bailey ("But they aren't functioning well!").

  The frustration you feel comes from the fact that the arguer treats the Motte and the Bailey as if they are the same claim, when they are logically distinct.

  ### 3. The Formal Solution: "Harmful Dysfunction"
  The philosopher of psychiatry **Jerome Wakefield** developed a specific analysis to address exactly what you noticed. He calls it the **Harmful Dysfunction Analysis (HDA)**.

  Wakefield argues that a "disorder" *must* have two components:
  1.  **Dysfunction (Factual):** A failure of a psychological mechanism to perform its evolved function (the Naturalist part).
  2.  **Harm (Evaluative):** The dysfunction causes negative consequences as judged by social values (the Normativist part).

  Wakefield's point aligns with your observation: **Neither part is sufficient on its own.**
  *   If you have the dysfunction but no harm (e.g., a genetic mutation that gives you perfect memory and no distress), it is not a disorder.
  *   If you have the harm but no dysfunction (e.g., grief after a death, or being illiterate in a society that values reading), it is not a disorder (it is a problem in living).

  When your brother or online interlocutors slide between the two without acknowledging both are required, they are effectively trying to bypass the rigorous definition Wakefield proposes. They want the authority of the "Dysfunction" without the limitations of the "Harm" criteria, or vice versa.

  ### Is this a Fallacy or a Feature?

  This is the crux of your question. Is this slippage a bug in the system, or how the system works?

  **It is a Feature of Medicine, but often a Fallacy of Argumentation.**

  **Why it's a Feature:**
  Medicine is not physics. It is a *teleological* practice (it is about goals and functions). Even in "hard" physical medicine, we slide between fact and value.
  *   **Hypertension:** The threshold for "high blood pressure" has been lowered over time. Biologically, there is no bright line where blood pressure becomes "diseased." The line is drawn based on *risk* (a value judgment about how much suffering we want to prevent).
  *   **Osteoporosis:** Bone density exists on a spectrum. We call it a disease only when it crosses a threshold where fractures become likely.

  The concept of "disease" is inherently a **socio-biological hybrid**. It requires a biological substrate *and* a judgment that the substrate interferes with human flourishing. Because the concept itself is hybrid, the language used to describe it will inevitably slide between fact and value.

  **Why it's a Fallacy (in this context):**
  The fallacy occurs when the slide is used to **reify** the condition.
  *   **Reification** is treating an abstract concept or social construct as if it were a concrete physical object.
  *   By emphasizing the biology (scans, chemistry), the arguer implies the condition is a "thing" waiting to be discovered (like a bacterium).
  *   By emphasizing the suffering, they imply the condition is defined by its impact.
  *   The deception lies in implying that the *biology causes the suffering in a direct, mechanical way* (like a virus causes fever), when in mental health, the relationship is often circular or socially mediated.

  If someone says, "ADHD is a brain disease," they imply the biology is the *sufficient* cause. If they admit, "ADHD is a brain difference that becomes a problem in modern schooling environments," they are admitting the normative/social component is doing half the work. The slide allows them to claim the former while relying on the latter.

  ### Connection to the "Myth of Mental Illness"
  You asked how this fits with the old argument (Thomas Szasz) that mental illness is a myth.

  Szasz argued that "mental illness" is a **category error**. He claimed:
  *   Physical illness = Lesion/Pathology in the body (Fact).
  *   Mental illness = "Problems in Living" (Value/Behavior).

  Szasz argued that by calling behavioral/moral/social problems "illnesses," psychiatry medicalizes deviance.

  **Your observation validates a modern refinement of Szasz's critique.**
  Modern psychiatry tries to refute Szasz by finding the "lesions" (brain scans, genetics). But as you noticed, when those lesions are found in people who are doing fine, psychiatry retreats to the "suffering/impairment" criterion.
  *   **Szasz's point:** If you have to define it by "impairment" and "suffering" rather than just "lesion," you are making a moral/social judgment, not a medical discovery.
  *   **The Counter-argument:** All medicine involves value judgments (e.g., is infertility a disease? It depends on if you value reproduction).

  The "Two-Step" you identified is the mechanism psychiatry uses to survive Szasz's critique. It claims the **ontology of physical disease** (to gain medical authority and insurance coverage) while relying on the **criteria of social dysfunction** (to actually identify patients).

  ### Summary of Terms
  If you want to name this in future arguments, here is the precise vocabulary:

  1.  **The Fact-Value Distinction:** The philosophical problem you identified.
  2.  **The Harmful Dysfunction Analysis:** The philosophical framework (Wakefield) that admits both are necessary.
  3.  **Reification:** The error of treating the hybrid concept as a purely biological object.
  4.  **Motte-and-Bailey:** The rhetorical tactic of sliding between the biological evidence and the normative definition.

  **The Edge of the Concept:**
  The edge lies in **etiology**. In strep throat, the bacteria is the *cause* of the harm. In depression, the "brain difference" is often correlated with the harm, but the harm (trauma, poverty, isolation) might also cause the brain difference. When the biology is the *cause*, the Naturalist claim holds. When the biology is a *marker* of a life going badly, the Normativist claim holds. The "Two-Step" obscures which one is happening.

  You are correct: The label is doing two jobs. It is trying to be a **description of nature** and a **judgment of life** simultaneously. When people pretend it is only the former, they are engaging in a form of scientific obfuscation, even if the condition itself is genuinely distressing.
