      *   *Epistemic Humility/Decision Theory:* We can't act on such uncertain probabilities (Pascal's Mugging style).
      *   *Practicality:* We can't help them anyway, so the argument is moot.
      *   *Definition Shopping:* Redefining consciousness to exclude insects by fiat.
      *   *Evolutionary Argument:* Consciousness is costly; insects wouldn't evolve it.
      *   *The "Switch" Problem:* If we accept this for insects, do we accept it for bacteria? (Slippery slope/reductio).

  4.  **Select and Refine Objections for the List:**
