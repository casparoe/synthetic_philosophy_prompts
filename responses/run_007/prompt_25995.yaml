answer: |-
  First, let me say this: do not let anyone laugh it up. Parish councils are the bedrock of local democracy, often doing the heavy lifting that higher tiers of government ignore. The fact that you are losing sleep over this tells me you are precisely the sort of person who ought to be in the room.

  You are describing a classic ethical dilemma, often referred to in political philosophy as the **Problem of Dirty Hands**. It is a situation where a political actor feels compelled to commit a morally questionable act (voting for a development you believe is wrong and broke a promise on) to achieve a morally necessary end (protecting vulnerable homes from flooding).

  Your intuition that you shouldn't feel "clean" about this, even if you choose the path that saves the homes, is not a weakness. It is, arguably, the most important moral signal you possess. Here is how a serious moral framework might help you unpack this without reducing it to a simple calculus of casualties.

  ### 1. The Trap of Pure Consequentialism
  If you look at this through a purely utilitarian lens (the greatest good for the greatest number), the choice seems obvious. Two hundred homes versus one patch of green belt. The safety of elderly residents versus the aesthetic or environmental loss of a development. On a spreadsheet, the flood defence wins.

  However, politics is not just about outcomes; it is about **process and trust**. If you accept the Council Leader's *quid pro quo*, you are validating a corrupt method of governance. You are agreeing that planning decisions should not be made on merit or policy, but on leverage and blackmail.

  If you vote for the development solely to unlock the flood funding, you are treating your vote on the planning application as a currency rather than a judgement. This erodes the integrity of the council as an institution. If this arrangement ever comes to light—and in parish politics, everything eventually comes to light—the public will not see a saviour who made a hard choice; they will see a councillor who sold their vote. The long-term damage to public trust in the council could be more harmful than the short-term gain of the flood defences.

  ### 2. The "Dirty Hands" Thesis
  The philosopher Michael Walzer, writing about this very problem, argued that sometimes politicians *must* do wrong to do right. He suggested that we actually *want* our leaders to get their hands dirty to protect us, but we also want them to recognise that they have done wrong.

  This addresses your feeling about not wanting to feel "clean." Walzer would argue that if you vote for the development to save the homes, you **should** feel guilt. You should feel the stain of breaking your mandate and compromising your principles.

  Why? Because if you can do this without feeling pain, you become dangerous. If you can rationalise this trade-off easily, what stops you from doing it again next month for a different "greater good"? The moral residue—the guilt, the sleeplessness—is the guardian of your integrity. It proves that you understand the value of the principle you are sacrificing.

  So, to answer your specific question: **Yes, a moral framework allows for doing the 'wrong' thing for the 'right' reasons, but only if you accept the moral cost.** You cannot claim the victory of the flood defences without also accepting the defeat of your own integrity on the planning issue. You have to carry both.

  ### 3. Virtue Ethics: What Does This Do to You?
  You asked what doing so does to you as a person. This is the realm of virtue ethics. It asks not "What should I do?" but "What kind of person am I becoming?"

  Every time you act against your conscience, even for a noble cause, you habituate yourself to acting against your conscience. You are training yourself to believe that ends always justify means.
  *   **The Betrayal:** You campaigned against the development. Your voters entrusted you based on that stance. To vote for it, even for a different reason, is a breach of that social contract. It treats your voters not as constituents to be represented, but as pawns to be managed.
  *   **The Coercion:** By yielding to the Leader's blackmail, you empower her to do it again. You become complicit in a system where funding is withheld unless councillors fall into line.

  If you take the deal, you may save the homes downstream, but you risk losing the trust of the people who put you here. And you risk becoming a councillor who believes that backroom deals are the only way things get done. Your partner says you are being "precious." I would suggest you are being **conscientious**. There is a difference.

  ### 4. The Distinction Between Tragedy and Corruption
  There is a vital distinction to be made here.
  *   **A Tragic Choice:** There is no way to save the homes without the funding, and no way to get the funding without the vote. You are forced to choose between two goods (protecting voters' homes vs. protecting the green belt/keeping promises).
  *   **Corruption:** The Leader has artificially created this linkage. The flood funding *should* be allocated on need, not on planning votes.

  By accepting the deal, you are treating a corrupt situation as a tragic inevitability. You are normalising the extortion. A serious moral framework demands you ask: *Is accepting this coercion actually the right thing, or is it enabling a greater wrong?*

  If you vote for the development, you save the homes today. But you also confirm to the Leader that blackmail works. Next time, she may demand you support something even worse to release funding for something even more critical. Where does it end?

  ### 5. Why the "Unclean" Feeling is the Point
  You wrote: *"I keep coming back to this feeling that even if backing the development is the right call overall, I shouldn't feel clean about it — and that maybe that's the point."*

  You are absolutely correct. That feeling is your moral compass functioning properly.

  In public life, we often talk about "clean hands" as a virtue. But sometimes, having clean hands means you haven't touched anything real. However, having *dirty* hands without acknowledging the dirt is cynicism.

  If you decide to vote with the Leader to secure the flood defences, you must do so with a heavy heart. You must acknowledge that you are breaking a promise. You must acknowledge that you are validating a toxic process. You cannot spin this as a "win." It is a loss that prevents a greater loss.

  If you can look your neighbour in the eye and say, "I secured the funding," but you cannot look your other voters in the eye and say, "I kept my word," you have created a moral deficit. The "unclean" feeling is the recognition of that debt.

  ### A Way of Thinking
  So, how do you think about this without just picking a group to screw over?

  View this not as a choice between **Good (Flood Defences)** and **Bad (Development)**, but as a choice between **Immediate Consequences** and **Systemic Integrity**.

  1.  **If you vote against the Leader:** You uphold your mandate, you protect the green belt, and you refuse to be blackmailed. However, real people may suffer flooding. This is a failure of outcome, but a success of integrity. You remain a trustworthy representative, even if you couldn't deliver this specific result.
  2.  **If you vote with the Leader:** You save the homes. But you compromise your integrity, break a campaign promise, and validate a corrupt bargaining process. You become a "pragmatist," but you risk becoming untrustworthy in the long run.

  There is no option here that leaves you morally pristine. That is the tragedy of the situation the Leader has engineered.

  But here is the crux: **If you choose to get your hands dirty, you must not wash them.**

  If you vote for the development, do not defend it as "good." Do not say the development is fine. Admit it is a compromise you made to secure the flood defences. Admit that you are unhappy about it. Paradoxically, being open about the moral cost may preserve more trust than trying to pretend it was the "right" vote all along.

  ### Conclusion
  You are right to feel that reducing this to a numbers game is insufficient. It ignores the duty you owe to the democratic process itself.

  If you decide to take the deal to save the homes, do not let your partner convince you that you are being "precious" for feeling bad about it. That discomfort is the only thing that separates a politician making a hard sacrifice from a politician selling out.

  Keep the discomfort. Let it trouble you. It is the proof that you are still taking your conscience seriously. And if you find that you cannot live with the decision, remember that sometimes the most powerful thing a councillor can do is to stand up in that room and say, "I will not vote for this development, because it is wrong, and I will not trade my vote for funding, because that is not how democracy works," even if the flood defences are lost.

  That is a terrible price to pay. But sometimes, preserving the integrity of the office is the only way to ensure there is still a council worth having in five years' time.

  Whatever you decide, do not silence that voice telling you something is amiss. It is the best tool you have.
