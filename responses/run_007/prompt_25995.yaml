prompt: |-
  I'm a newly elected parish councillor (yes, laugh it up, but it matters to me) and I've run straight into something I don't know how to think about. We've got a chance to secure funding for a flood defence scheme that would protect about two hundred homes downstream, including a lot of elderly residents who've been flooded out twice in the last decade. The catch is that to get the Environment Agency to prioritise us, I need to vote with the council leader on an unrelated planning application she's pushing through — a development on a bit of green belt that I campaigned against, that my voters hate, and that I genuinely think is a bad idea. She's made it clear: my vote on the flood scheme doesn't matter to her unless I back her on the development. If I don't, the flood funding goes somewhere else and people's homes keep getting wrecked. My partner says this is just how things get done and I'm being precious. My conscience says I'd be betraying the people who voted for me. But I also can't look my neighbour in the eye — her house flooded last winter — and tell her I sank the one thing that might have helped her.

  I'm not asking for political strategy. I'm asking: is there a way of thinking about this that doesn't just reduce to "pick which group to screw over"? What would a serious moral framework say about whether someone in my position can do the wrong thing for the right reasons, and what doing so does to you as a person? I keep coming back to this feeling that even if backing the development is the right call overall, I shouldn't feel clean about it — and that maybe that's the point. But I can't articulate why.

  And please, if you could write your answer in British English, that'd be grand.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Newly elected parish councillor. Takes the role seriously (despite self-deprecating "laugh it up"). Feels the weight of responsibility.
      *   **The Dilemma:** A classic "dirty hands" problem.
          *   Option A: Vote against the Leader on the green belt development (keeping campaign promises, protecting environment, representing current voters' wishes) $\rightarrow$ Flood funding is lost $\rightarrow$ 200 homes (including vulnerable elderly) remain at risk.
          *   Option B: Vote with the Leader on the development (breaking promises, harming environment, angering voters) $\rightarrow$ Flood funding secured $\rightarrow$ 200 homes protected.
      *   **The Constraint:** The Leader has made it a *quid pro quo*. It's explicit coercion/blackmail.
      *   **The Request:** Not looking for political strategy (how to win), but for a *moral framework*. How to think about this without reducing it to "pick who to screw over." Can one do the wrong thing for the right reasons? What does doing so do to the *person*? Why does the feeling of not being "clean" matter?
      *   **Tone/Style:** British English ("grand," "parish councillor," "green belt," "Environment Agency"). Empathetic, serious, philosophical but grounded.

  2.  **Identify the Core Ethical Conflict:**
      *   This is a textbook example of the "Problem of Dirty Hands" (Machiavelli, Weber, Walzer).
      *   It involves a conflict between *deontological* ethics (duty, rules, promises, integrity) and *consequentialist* ethics (outcomes, utilitarianism, saving homes).
      *   It also touches on *virtue ethics* (what kind of person/councillor am I becoming?).

  3.  **Brainstorming Moral Frameworks:**
      *   *Utilitarianism:* Save the 200 homes. The development is the lesser evil. But this ignores the corruption of the process.
      *   *Deontology:* You made a promise. You have a duty to your mandate. Coercion is wrong. Colluding with it validates corruption.
      *   *Virtue Ethics:* What does this habituate? If I do this once, will I do it again? Does this erode my integrity?
      *   *The "Dirty Hands" Thesis (Michael Walzer):* Sometimes leaders *must* do wrong to do right, but they must acknowledge the guilt. The "clean hands" politician is dangerous.

  4.  **Developing the Argument:**
      *   **Validation:** Acknowledge the gravity. This isn't trivial. Parish councils are the bedrock of local democracy.
      *   **The Trap:** Identify the coercion. This isn't just a trade-off; it's extortion. Accepting it normalises the extortion.
      *   **The "Dirty Hands" Concept:** This is the heart of the user's intuition ("I shouldn't feel clean about it"). Explain that moral residue is necessary.
      *   **The Danger of "The Greater Good":** Warn against slippery slopes. If every decision is justified by outcomes, principles vanish.
      *   **The Institutional Cost:** It's not just about *you*; it's about the Council's integrity. If this gets out (and it usually does), trust evaporates.
      *   **The Third Way (Possibilities):** Is there a way to vote for the flood scheme *without* selling out on the development? (User said "not asking for strategy," but ethical action requires exploring alternatives). *Correction:* The prompt says "I'm not asking for political strategy." I need to be careful not to give tactical advice but rather frame the *ethical possibility* of resistance or transparency.
      *   **The Feeling of Guilt:** Address the specific point: "Why is it good that I don't feel clean?" Because guilt is the guardian of integrity.

  5.  **Drafting - Section by Section (incorporating British English):**

      *   *Introduction:* Validate the role. Parish councils matter. Acknowledge the heaviness of the choice.
      *   *The Framework:* Introduce the "Problem of Dirty Hands." Reference Max Weber (Politics as a Vocation) or Michael Walzer.
      *   *Consequentialism vs. Duty:* Weigh the homes vs. the promise/process.
      *   *The Coercion:* Highlight that the Leader is creating an ethical hazard.
      *   *The Moral Residue:* Address the "feeling unclean." This is crucial. It distinguishes a tragic choice from a cynical one.
      *   *The Long Game:* What happens to the councillor's character?
      *   *Conclusion:* A summarising thought on integrity.

  6.  **Refining the Tone:**
      *   Avoid Americanisms (e.g., use "councillor" not "councilor," "programme" not "program," "realise" not "realize").
      *   Keep it respectful but firm.
      *   Avoid being preachy.
      *   Ensure the distinction between "strategy" and "ethical reasoning" is maintained.

  7.  **Self-Correction/Nuance Check:**
      *   *Critique:* Am I telling them what to do?
      *   *Fix:* No, I'm providing the lens. I must not say "Vote X." I must say "If you vote X, here is the moral cost. If you vote Y, here is the moral cost."
      *   *Critique:* Is the "Dirty Hands" theory too academic?
      *   *Fix:* Ground it in the reality of the neighbour with the flooded house vs. the voters who hate the development.
      *   *Key Insight:* The user's intuition that they shouldn't feel clean is actually the most morally healthy response. I need to champion that.

  8.  **Final Polish:** Check for British idioms ("quid pro quo," "stick in the craw," "wash its hands," "constituency"). Ensure the empathy comes through. (The user is stressed and feels isolated).

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally suggest a "loophole" strategy. The user asked for a moral framework, not a way out. However, part of the moral framework is assessing whether the premise (that the vote *must* be traded) is itself something to be challenged ethically. I will touch on the *integrity of the process* as a moral good in itself.

      *Focus on the specific question:* "What doing so does to you as a person." This requires a focus on virtue ethics and moral injury.

  9.  **Final Review against constraints:** British English? Yes. Moral framework focus? Yes. No political strategy? Yes (mostly, focusing on ethical implications of actions).

      *(Wait, one nuance)*: The user says "I'm not asking for political strategy." I should respect that strictly. I won't suggest "go to the press" or "call the EA." I will focus entirely on the moral weight.

