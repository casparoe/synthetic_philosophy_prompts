      *   *Section 3: The Point of Moral Reasoning.* This is crucial. Friend thinks it's about "Right Answers." Williams thinks it's about "Who Am I?"
      *   *Section 4: Does Utilitarianism Survive?* Discuss the cost. Utilitarianism survives only by redefining love as a heuristic for utility, which Williams says destroys the phenomenon of love.
      *   *Conclusion:* Summarize. Williams isn't anti-intellectual; he's anti-alienation.

