          *   As $N \to \infty$, $(1-p)^N \to 0$, so Prob $\to$ 1.
          *   Yes, the math holds. The curse is real in this model.

      *   *Failure B: The "Contradiction" in Premise (5).*
          *   The colleague claims: "The same evidence cannot make the group both converge to the truth and converge to error."
          *   Is this true? The *evidence* (the set of signals) is the same. But the *aggregation function* is different.
          *   CJT says aggregation function $f_{maj}$ converges to truth.
          *   Curse says aggregation function $f_{unil}$ converges to implementation (error if state is Bad).
          *   Is there a logical contradiction in saying different functions yield different limits? No. That's trivial.
          *   The colleague seems to think there's a deeper epistemic contradiction: "How can rational individuals using good signals produce a bad group outcome?"
