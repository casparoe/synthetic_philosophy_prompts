      *   *Premise (1):* Majority Rule $\to$ Truth as $N \to \infty$ (Condorcet Jury Theorem - CJT).
      *   *Premise (2):* Unilateral Rule $\to$ Implementation as $N \to \infty$ (regardless of state). Specifically, if Bad, Implementation $\to$ 1.
      *   *Premise (3):* Same signals lead to Truth (Majority) vs. Error (Unilateral) in the limit.
      *   *Premise (4):* Individual acts are locally rational (based on $p > 0.5$).
