          *   But if the rule is dumb *epistemically*, that supports the normative principle.
          *   The colleague's real punchline is in (5): "The same evidence cannot make the group both converge to the truth and converge to error." He thinks this implies the Curse description is wrong. But the Curse description (Premise 2) is mathematically correct. So he must mean the *interpretation* is wrong.

      *   *Failure D: The Interpretation of "Convergence" (The crux).*
