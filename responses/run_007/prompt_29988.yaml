      *   *Conclusion (6):* Normative principle (defer to group) is unsupported.

  3.  **Brainstorm Potential Failures:**

      *   *Failure A: The Mathematical Calculation.* Is Premise (2) actually true?
          *   If state is Bad, prob(signal=Good) = $1-p < 0.5$.
