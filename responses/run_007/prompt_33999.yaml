answer: |-
  # Diagnostic Decision Tree: The Moral Validity of Consent

  **Instructions for Students:**
  This instrument is designed to locate your intuitive judgments within the logical space of consent theory. Do not worry about matching your answers to a specific named theory. Answer each node based on your moral judgment of the case or claim presented. Follow the path indicated by your answer to reach a leaf node, which describes the position your answers imply.

  ---

  ### **ROOT NODE: The Scope of Deception**
  **Case:** *The Sterility Lie.*
  Alex consents to sex with Blake. Blake explicitly lies, saying, "I am sterile," to avoid using a condom. Alex would not have consented if they knew the truth. However, Alex knows they are having sex, and Alex knows the partner is Blake (no identity deception).
  **Claim:** *Consent is morally invalid because Alex was deceived about a consequence they deemed essential.*

  *   **YES (Deception Invalidates):** Go to **Node 2A**.
  *   **NO (Deception Does Not Invalidate):** Go to **Node 2B**.

  ---

  ### **NODE 2A: Structural Pressure (Reached if YES on Deception)**
  **Case:** *The Desperate Landlord.*
  Taylor is facing eviction and homelessness through no fault of the landlord, Jordan. Jordan says, "I will not evict you if you sleep with me." Jordan makes no threat to worsen Taylor's situation (e.g., "I will evict you if you don't"); Jordan merely offers to maintain the status quo in exchange for sex.
  **Claim:** *Consent is morally invalid because the economic pressure is so severe that Taylor has no reasonable alternative, even if Jordan made no explicit threat.*

  *   **YES (Pressure Invalidates):** Go to **Node 3A**.
  *   **NO (Pressure Does Not Invalidate):** Go to **Node 3B**.

  ---

  ### **NODE 2B: Structural Pressure (Reached if NO on Deception)**
  **Case:** *The Desperate Landlord.*
  (Same case as above: Jordan offers to withhold eviction in exchange for sex.)
  **Claim:** *Consent is morally invalid because the economic pressure is so severe that Taylor has no reasonable alternative, even if Jordan made no explicit threat.*

  *   **YES (Pressure Invalidates):** Go to **Node 3C**.
  *   **NO (Pressure Does Not Invalidate):** Go to **Node 3D**.

  ---

  ### **NODE 3A: Internal State vs. External Expression (Reached if YES on Deception + YES on Pressure)**
  **Case:** *The Reluctant Yes.*
  Casey says "Yes" clearly, soberly, and voluntarily to sex. There are no lies and no economic threats. However, internally, Casey feels deep anxiety and reluctance due to a fear of disappointing their partner.
  **Claim:** *Consent is morally invalid because Casey's internal mental state (reluctance) does not match their external speech.*

  *   **YES (Internal State Determines Validity):** **Leaf 1**.
  *   **NO (External Expression Determines Validity):** **Leaf 2**.

  ---

  ### **NODE 3B: Internal State vs. External Expression (Reached if YES on Deception + NO on Pressure)**
  **Case:** *The Reluctant Yes.*
  (Same case as above: Clear "Yes," internal reluctance/anxiety, no threats.)
  **Claim:** *Consent is morally invalid because Casey's internal mental state (reluctance) does not match their external speech.*

  *   **YES (Internal State Determines Validity):** **Leaf 3**.
  *   **NO (External Expression Determines Validity):** **Leaf 4**.

  ---

  ### **NODE 3C: Internal State vs. External Expression (Reached if NO on Deception + YES on Pressure)**
  **Case:** *The Reluctant Yes.*
  (Same case as above: Clear "Yes," internal reluctance/anxiety, no threats.)
  **Claim:** *Consent is morally invalid because Casey's internal mental state (reluctance) does not match their external speech.*

  *   **YES (Internal State Determines Validity):** **Leaf 5**.
  *   **NO (External Expression Determines Validity):** **Leaf 6**.

  ---

  ### **NODE 3D: Internal State vs. External Expression (Reached if NO on Deception + NO on Pressure)**
  **Case:** *The Reluctant Yes.*
  (Same case as above: Clear "Yes," internal reluctance/anxiety, no threats.)
  **Claim:** *Consent is morally invalid because Casey's internal mental state (reluctance) does not match their external speech.*

  *   **YES (Internal State Determines Validity):** **Leaf 7**.
  *   **NO (External Expression Determines Validity):** **Leaf 8**.

  ---

  ### **LEAF NODES: Position Taxonomy**

  **Leaf 1: The Substantive/Feminist View** (Occupied)
  *   **Answers:** Deception Invalidates / Pressure Invalidates / Internal State Invalidates.
  *   **Description:** Consent requires substantive autonomy, free from systemic oppression, deception, and internal conflict.
  *   **Awkward Commitment:** This view risks classifying the majority of sexual activity under current patriarchal or capitalist conditions as morally invalid due to background structural coercion.

  **Leaf 2: The Contextual Performative View** (Unoccupied)
  *   **Answers:** Deception Invalidates / Pressure Invalidates / External Expression Valid.
  *   **Diagnosis:** **Unstable.** It is difficult to justify why external economic pressure invalidates consent if the external speech act ("Yes") is still considered sufficient to override internal reluctance. It prioritizes external factors over the agent's will inconsistently.

  **Leaf 3: The Liberal Autonomy View** (Occupied)
  *   **Answers:** Deception Invalidates / Pressure Does Not Invalidate / Internal State Invalidates.
  *   **Description:** Consent is invalid if force or fraud (broadly construed) is used, but economic baselines do not count as coercion.
  *   **Awkward Commitment:** This view validates sexual agreements made under desperate economic duress (e.g., survival sex) provided no explicit threat was uttered by the partner.

  **Leaf 4: The Information-Fetishist View** (Unoccupied)
  *   **Answers:** Deception Invalidates / Pressure Does Not Invalidate / External Expression Valid.
  *   **Diagnosis:** **Unattractive.** This position prioritizes information transparency over both voluntariness and internal will, implying a lie about sterility is worse than economic coercion or internal terror.

  **Leaf 5: The Inconsistent Contextualist** (Unoccupied)
  *   **Answers:** Deception Does Not Invalidate / Pressure Invalidates / Internal State Invalidates.
  *   **Diagnosis:** **Incoherent.** It claims that economic context and internal feelings invalidate consent, but lies about the physical consequences of the act do not. This severs the link between informed choice and valid agency.

  **Leaf 6: The Contextual Contractualist** (Unoccupied)
  *   **Answers:** Deception Does Not Invalidate / Pressure Invalidates / External Expression Valid.
  *   **Diagnosis:** **Unexplored.** This view focuses entirely on the fairness of the bargaining situation and the speech act, ignoring both the agent's internal will and the informational basis of their choice.

  **Leaf 7: The Attitudinal View (e.g., Hurd, Alexander)** (Occupied)
  *   **Answers:** Deception Does Not Invalidate / Pressure Does Not Invalidate / Internal State Invalidates.
  *   **Description:** Consent is a mental act of will; external speech is merely evidence. Only deception about the *nature* of the act (not consequences) vitiates the will.
  *   **Awkward Commitment:** This view validates sex where a partner lies about sterility or HIV status, provided the victim knows they are engaging in sexual intercourse.

  **Leaf 8: The Strict Performative View (e.g., Green)** (Occupied)
  *   **Answers:** Deception Does Not Invalidate / Pressure Does Not Invalidate / External Expression Valid.
  *   **Description:** Consent is a speech act that changes normative relations; internal states and background conditions are largely irrelevant.
  *   **Awkward Commitment:** This view validates consent given in jest, under mild social pressure, or while intoxicated, provided the words "I consent" are clearly uttered.

  ---

  ### **Diagnostic Limitations: Unseparated Positions**

  **1. The Attitudinal View vs. The Normative Competence View**
  *   **Positions:** Leaf 7 (Attitudinal) vs. theories like Japa Pallikkathayil's.
  *   **Why they aren't separated:** Both positions answer "YES" to the Internal State question (Leaf 7 path) and generally "NO" to the Deception/Pressure questions in this specific configuration.
  *   **Explanation:** This tree tests *conditions* for validity (what breaks consent?), not the *meta-ethical nature* of consent. The Attitudinal View says consent *is* a mental state. The Normative Competence View says consent is the *exercise of a power* that requires a mental state. They yield the same verdicts on these cases but disagree on what consent *is*.

  **2. The Strict Performative View vs. The Convention-Based View**
  *   **Positions:** Leaf 8 (Strict Performative) vs. theories like Scott Anderson's.
  *   **Why they aren't separated:** Both answer "NO" to the Internal State question, prioritizing the external signal.
  *   **Explanation:** Both views prioritize the external expression over the internal feeling. However, the Strict Performative view treats "Yes" as a magic speech act, while the Convention-Based view treats it as a social signal that can be overridden by context (e.g., if said sarcastically). This tree's "Reluctant Yes" case assumes the "Yes" is sincere but anxious, which fails to probe the *sincerity* vs. *convention* distinction.
