  2.  **Deconstruct the Thesis & Audience Tensions:**
      *   *Douglass's View:* The Constitution's text, properly read without the "slave power" gloss, contains no sanction for slavery. The Preamble ("secure the Blessings of Liberty") and the Due Process Clause control the specific clauses often cited for slavery (3/5ths, Fugitive Slave, Importation).
      *   *Originalist View:* Meaning is fixed at ratification. Intent of the framers/ratifiers matters. Many originalists acknowledge the Constitution *was* pro-slavery in 1787 but argue the 14th Amendment fixed it.
      *   *The Conflict:* If Douglass is right that the *1787* text was anti-slavery, then originalism (focused on 1787) yields abolitionism. If originalists reject Douglass, they must admit the text *allowed* slavery, which undermines the "glorious liberty document" narrative often used to sanctify the Constitution. If they accept Douglass, they might have to accept a "living" application of "Liberty" that they usually resist.
      *   *The "Uncomfortable" Angle:* The user wants to argue that Douglass's method *is* originalism/textualism, but the *result* is radical equality, which modern originalists might shy away from if it implies broad federal power or substantive due process.

  3.  **Brainstorming Objections (The "Hit List"):**
      *   *Objection 1 (The History):* The historical evidence shows the Framers intended to protect slavery. Douglass is ignoring intent.
      *   *Objection 2 (The Text):* The Fugitive Slave Clause is explicit. You can't text your way out of "Person held to Service."
      *   *Objection 3 (The Method):* Douglass changed his mind. It was political, not legal. He wasn't doing jurisprudence; he was doing activism.
      *   *Objection 4 (The 14th Amendment):* Why does Douglass's 1787 reading matter? The 14th Amendment is the real fix. Focusing on 1787 distracts from Reconstruction.
      *   *Objection 5 (Judicial Role):* Even if Douglass is right textually, judges in 1850 couldn't just ignore precedent (like *Prigg* or *Dred Scott*). It's an argument for legislators, not courts.
      *   *Objection 6 (Public Meaning):* The "public meaning" in 1787 included slavery. Douglass is imposing a modern moral reading, not recovering original public meaning.
      *   *Objection 7 (The "Uncomfortable" Twist):* If Douglass is an originalist, why do *you* (the author) support outcomes originalists hate (affirmative action, etc.)? Is this just trojan horse living constitutionalism?
