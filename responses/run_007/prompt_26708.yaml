  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Respectful but sharp. Law profs speak in "distinguishing cases," "original public meaning," "judicial restraint." Historians speak in "contingency," "archival evidence," "reception history."
      *   *Replies:* Need to be 2 minutes spoken (approx. 250-300 words). Must leverage Douglass's actual arguments (e.g., "Liberty" is the rule, slavery the exception; burden of proof).
      *   *Soft Spots:* Must be honest. The user isn't a lawyer. The weak point is usually how a judge applies this *in the moment* without being accused of activism.

