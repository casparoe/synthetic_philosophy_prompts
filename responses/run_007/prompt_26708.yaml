      *   *Medium:* The "Judicial Role/Precedent" objection (Lawyers will ask this).
      *   *Medium:* The "Living Constitutionalism in Disguise" objection (Challenges the user's consistency).
      *   *Lower (but tricky):* The "Garrisonian Counterfactual" (Why was Garrison wrong specifically on text?).
      *   *Nightmare:* A specific doctrinal trap about *how* a judge applies this without legislating.

      *Refining the Order:* Let's order by "Damage to the specific thesis that Douglass was a rigorous textualist/originalist."
      1.  Public Meaning vs. Moral Reading (The core originalist critique).
      2.  The Fugitive Slave Clause (The specific textual hole).
