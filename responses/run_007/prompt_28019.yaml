answer: |-
  It is excellent that you paused on that summary. Your instinct is correct: the book you read presented a caricature, specifically one that conflates the *Redundancy Theory* (an early, crude version) with modern *Deflationism* (which is more sophisticated).

  As a chemist, you are trained to distinguish between a substance's intrinsic properties (like electronegativity or bond energy) and the labels or notation we use to describe them. The book's summary treats "truth" as if deflationists claim it is merely a label we can discard. In reality, deflationists argue it is a logical tool that is indispensable, even if it doesn't name a "deep" physical or metaphysical property.

  Here is a sentence-by-sentence breakdown of that summary, followed by an analysis of the "work" truth does.

  ### 1. "Deflationists deny that truth is a real property."
  **Verdict: Imprecise / Conflation.**

  This is the most technically contentious sentence. A careful deflationist would likely quibble with the word "real."
  *   **The Nuance:** Deflationists deny that truth is a *substantive* or *robust* property. In your field, "mass" or "valence" are substantive properties; they explain how a substance interacts with the world. Deflationists argue truth is not like that. It does not causal powers.
  *   **The Correction:** Some deflationists (like Paul Horwich) argue truth *is* a property, but it is a *logical* property, not a natural one. Others (like Frege or early Ramsey) argued it isn't a property at all. The book simplifies this internal debate into a flat denial. A deflationist would say: "Truth is not a property that explains *why* a statement corresponds to reality; it is merely a device for asserting the statement."

  ### 2. "On their account, to say that 'snow is white' is true is just to say that snow is white..."
  **Verdict: Accurate.**

  This is the core of the view, often called the **Equivalence Schema** (derived from Tarski).
  *   **The Nuance:** The assertion "It is true that P" is cognitively equivalent to the assertion "P." There is no extra "glow" of truth added to the proposition. If you understand "snow is white," you understand everything there is to understand about the truth of that sentence.
  *   **Why it matters:** This denies the "Correspondence Theory" intuition that we need to check a statement against reality *and* apply a separate property called "truth." For the deflationist, checking the statement against reality *is* what calling it "true" amounts to.

  ### 3. "...and since 'is true' never adds anything, the concept of truth is basically idle..."
  **Verdict: Overstatement.**

  This is where the summary starts to mislead. "Adds anything" is ambiguous.
  *   **Content vs. Function:** "Is true" adds no *descriptive content*. Saying "It is true that snow is white" describes the world no differently than "Snow is white."
  *   **The Error:** However, calling it "idle" suggests it is useless. In logic and language, a term can be content-free but functionally vital. Think of the equals sign ($=$) in an equation. It adds no physical mass to the numbers, but it is not "idle"; it performs a structural function. Deflationists argue "is true" is a logical operator, not a descriptive adjective.

  ### 4. "...a bit of language we could drop without losing anything."
  **Verdict: False.**

  This is the specific point you flagged, and your skepticism was well-founded. This statement contradicts the primary argument *for* the truth predicate in modern deflationism.
  *   **The Generalization Argument:** We cannot eliminate "is true" because we need it to make generalizations about infinite sets of sentences.
  *   **Example:** Consider the statement: *"Everything the witness said is true."*
      *   If you drop "is true," you cannot simply say *"Everything the witness said."* That is not a complete sentence.
      *   To eliminate "is true," you would have to list every single sentence the witness uttered and assert them individually (e.g., "The car was blue" AND "The light was red" AND...).
      *   If the witness spoke infinitely many sentences, or if you don't know exactly what they said, you *cannot* make the assertion without the truth predicate.
  *   **The Chemist Analogy:** Think of "is true" like a variable in an equation (like $x$). You can solve specific problems without variables (e.g., $2 + 2 = 4$), but you cannot express general laws (e.g., $F = ma$) without them. The variable doesn't have a specific value, but it is not "idle"; it allows for generalization.

  ### 5. The Final Claim: "...truth does no real work."
  **Verdict: Depends on what you mean by "work."**

  This is the philosophical crux. Does the book's conclusion follow from the accurate parts? Only if you define "work" narrowly.

  **A. Causal/Explanatory Work (No)**
  Deflationists agree truth does no *causal* work.
  *   **Inflationist View:** A belief leads to successful action *because* it possesses the property of truth (which might mean corresponding to facts). Truth is part of the explanation for success.
  *   **Deflationist View:** A belief leads to successful action because the content of the belief matches the world. We don't need to invoke "truth" as an intermediate explanatory entity.
  *   **Example:** If you believe "water quenches thirst" and you drink water, your thirst is quenched. A deflationist says your success is explained by the chemistry of water and your physiology, not by the metaphysical property of "truth" attached to your belief.

  **B. Logical/Linguistic Work (Yes)**
  As established in sentence #4, truth does indispensable *logical* work. It allows for quantification over propositions. It allows us to endorse claims without repeating them (e.g., "What she said").
  *   **Conclusion:** The book is wrong to imply we could drop the concept. We cannot drop it without losing the ability to reason generally. However, the book is right that truth does not do *metaphysical* work (it doesn't "hook" language to the world; usage does that).

  ### Summary for your mental model

  If I may offer an analogy suited to your background:

  Think of **Truth** not as a chemical element (like Oxygen) that exists in the mixture and reacts with other things.
  Think of **Truth** as **Stoichiometric Notation**.

  1.  **Is it real?** The notation isn't a physical substance, but it represents a real relationship.
  2.  **Does it add content?** Writing "$2H_2 + O_2 \rightarrow 2H_2O$" doesn't add hydrogen to the beaker. It just asserts the relationship.
  3.  **Is it idle?** No. You cannot do chemistry without the notation, even if the notation itself isn't a reagent.
  4.  **Can we drop it?** You could try to describe reactions purely verbally without symbols, but you would lose the ability to generalize laws efficiently.

  **The Verdict on the Book:**
  The book conflated **Deflationism** (truth is a logical device, not a substantive property) with **Eliminativism** (we should get rid of the concept entirely). Most deflationists are not eliminativists. They argue that while truth isn't a "deep" property waiting to be analyzed, the *predicate* "is true" is a vital tool for managing language and logic.

  You spotted the exact tension that separates a pop-philosophy summary from the actual academic debate. Your reading instincts are serving you well.
