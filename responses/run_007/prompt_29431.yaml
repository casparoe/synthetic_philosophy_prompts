          *   I will recommend the **Likelihoods conditioned on Construction** approach because it handles Case 7 ($T_1$ vs $T_2$) better than simple counterfactuals. It explains *why* the counterfactual prior should differ.
          *   Formula: Compare $P(E | T \text{ is true} \& \text{Construction Context})$ vs $P(E | T \text{ is false} \& \text{Construction Context})$.
      *   **Analyzing the Verdicts:**
