answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone bringing the disciplined perspective of the natural sciences to these foundational questions in philosophy and artificial intelligence. Your intuition that the frame problem is not a single monolith but rather a cluster of related difficulties is well-founded, and your desire to understand the criteria for a solution before evaluating the solutions themselves is exactly the right approach. In the literature, the desiderata for solving the frame problem are often scattered across technical papers and philosophical treatises, so let me attempt to synthesize them for you in a continuous narrative, distinguishing between what is universally demanded and what depends on one's theoretical commitments.

  To begin with the narrow version of the problem, which concerns formal representation in artificial intelligence, there are three requirements that are effectively non-negotiable across the field. First, any proposed solution must achieve representational economy. The core complaint McCarthy and Hayes raised was that a system should not be required to list every fact that remains unchanged after an action occurs. If a formalism requires a frame axiom for every fluent and every action to specify non-change, it fails this requirement. This is not merely a preference for elegance; it is a requirement because a system that must explicitly represent non-change cannot scale to complex environments. Second, the solution must ensure logical correctness or soundness. The system must reliably infer what does change and what does not change without contradiction. If a solution is efficient but frequently predicts that a loaded gun becomes unloaded when fired, or that a moved object remains in its original location, it is not a solution to the frame problem but a failure of reasoning. Third, the solution must be computationally tractable. It is settled in the literature that a brute-force check of all known facts before every action is impossible for any finite agent. Therefore, a solution must allow the system to determine the effects of an action without searching the entire database of beliefs. These three requirements, economy, correctness, and tractability, constitute the hard constraints for the narrow logical problem.

  However, when we move to the broader version of the problem, which concerns how any finite creature manages relevance detection in a holistic world, the desiderata become more contested. For the broad frame problem, a solution must explain how an agent isolates relevant information from irrelevant background knowledge without prior stipulation of what counts as relevant. Here, a significant divergence appears between research programs. For those working in classical symbolic artificial intelligence, a non-negotiable requirement is that the mechanism be explicable in terms of information processing rules or algorithms. They insist that if the mind solves the frame problem, there must be a describable procedure for doing so. Conversely, for those working in connectionism or dynamic systems theory, this requirement is merely a preference of the symbolic program. They argue that relevance might emerge from subsymbolic interactions or neural weights without any explicit rule for ignoring information. Thus, whether the solution must be algorithmically explicit is a point of contention, not a settled desideratum.

  Another contested requirement concerns cognitive plausibility. Philosophers of mind, particularly those following Jerry Fodor, insist that a solution to the broad frame problem must align with the known properties of human cognition, such as speed and isotropy, meaning that any belief can potentially be relevant to any other. For these theorists, a solution that works for a robot but violates how humans reason is not a true solution to the philosophical problem. However, for many engineers and roboticists, this is merely a preference. They are satisfied if the machine acts appropriately, regardless of whether its method matches human psychology. Consequently, you will find proposed solutions that are computationally adequate but cognitively implausible, and vice versa. It is crucial to note that there is no consensus on whether cognitive plausibility is a necessary condition for solving the broad frame problem, only that it is necessary for solving the problem of human cognition specifically.

  Regarding the compatibility of these requirements, there is a profound tension that has so far resisted being fully resolved, and some argue it reveals a joint unsatisfiability between generality and efficiency. This is often referred to as the relevance problem. To be general, a system must be able to consider any fact in its database as potentially relevant to a current action. To be efficient, it must ignore almost all facts. The difficulty is that determining which facts to ignore often requires knowing the effects of the action, but knowing the effects requires knowing which facts are relevant. In the literature, this is sometimes framed as the impossibility of solving the broad frame problem within a classical computational architecture. Fodor famously argued that this makes the central systems of the mind non-computational. While many AI researchers reject this conclusion, pointing to modern machine learning systems that seem to bypass the issue by learning relevance statistically, there is no consensus that the tension is dissolved. The pair of requirements consisting of global holism of relevance and local computational tractability remains the primary friction point. If a solution demands that relevance is determined logically across the whole belief system, it violates tractability. If it demands tractability via modularity, it violates the holistic nature of the broad problem.

  It is also important to distinguish what is settled from what is genuinely debated regarding the status of the narrow problem. It is largely settled among logicians and knowledge representation researchers that the narrow frame problem has been technically solved within specific formalisms. Successor state axioms in the situation calculus, for instance, provide a way to represent change without explicit frame axioms, satisfying the requirements of economy and correctness. However, it is contested whether this technical solution translates to the broad problem. Some argue that the narrow problem was a pseudo-problem dissolved by better logic, while others argue it was just a simplified slice of the deeper epistemological issue. You should be wary of any text that presents the technical solution to the logical frame problem as a solution to the philosophical frame problem, as this conflates the two distinct senses you have already identified.

  Finally, there is a desideratum regarding robustness in dynamic environments that is increasingly seen as non-negotiable for practical applications but remains theoretically difficult. A solution must handle exogenous events, or changes that happen without the agent's actions. Early solutions often assumed a closed world where only the agent's actions caused changes. A robust solution must account for the fact that the world changes independently of the agent, without triggering a combinatorial explosion of updates. While everyone agrees this is necessary for a real-world agent, there is no consensus on how to integrate this into a unified theory of action and belief revision without reintroducing the very inefficiencies the frame problem was meant to avoid.

  In summary, if you are evaluating a proposed solution, you should look first for whether it meets the non-negotiable triad of representational economy, logical correctness, and computational tractability. If it fails any of these, it does not solve the narrow problem. For the broad problem, you must decide whether you require cognitive plausibility and algorithmic explicitness, as these are program-specific preferences rather than universal demands. Be particularly attentive to how the proposal handles the tension between holistic relevance and computational efficiency, as this is the area where claims of solution are most frequently contested. The literature is clear that while we have formalisms that manage change efficiently in restricted domains, the general account of how finite agents isolate relevance in an open world remains one of the deepest unsolved questions in cognitive science. I hope this mapping of the terrain serves your inquiry well as you delve deeper into these fascinating issues.

  Sincerely,

