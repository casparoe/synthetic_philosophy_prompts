answer: |-
  # Handout: A Two-Envelope Case with a Proper Prior

  ### 1. The Setup and Prior Distribution
  In this scenario, the two envelopes contain amounts $(S, 2S)$, where $S$ is the smaller amount. The possible values for $S$ are powers of 2: $\{1, 2, 4, 8, \dots\}$. 

  We define a **proper prior probability distribution** over the smaller amount $S$. Let $k$ be a non-negative integer ($0, 1, 2, \dots$). The probability that the smaller amount is $2^k$ is given by:

  $$ P(S = 2^k) = \frac{1}{3} \left( \frac{2}{3} \right)^k $$

  **Verification that this is a proper prior:**
  The sum of probabilities over all possible $k$ is a geometric series:
  $$ \sum_{k=0}^{\infty} \frac{1}{3} \left( \frac{2}{3} \right)^k = \frac{1}{3} \times \frac{1}{1 - 2/3} = \frac{1}{3} \times 3 = 1 $$
  The probabilities sum to exactly 1, and every specific dollar amount is finite.

  ### 2. Expected Value Calculation After Opening
  Suppose you pick an envelope at random and open it to find amount $x$. The other envelope contains either $2x$ (if you have the smaller amount $S$) or $x/2$ (if you have the larger amount $2S$).

  To calculate the Expected Value (EV) of switching, we need the posterior probability that $x$ is the smaller amount ($S$) versus the larger amount ($2S$).

  **Case A: You see $x = 2$**
  *   **Scenario 1 (You have Small):** The pair is $(2, 4)$. This requires $S=2$.
      *   Prior weight: $P(S=2) = \frac{1}{3}(\frac{2}{3})^1 = \frac{2}{9}$.
  *   **Scenario 2 (You have Large):** The pair is $(1, 2)$. This requires $S=1$.
      *   Prior weight: $P(S=1) = \frac{1}{3}(\frac{2}{3})^0 = \frac{1}{3} = \frac{3}{9}$.

  Since you picked the envelope at random, the likelihood of seeing $x$ is proportional to these prior weights.
  *   Probability you have Small: $\frac{2/9}{2/9 + 3/9} = \frac{2}{5} = 0.4$.
  *   Probability you have Large: $\frac{3/9}{2/9 + 3/9} = \frac{3}{5} = 0.6$.

  **EV of Switching:**
  $$ EV = 0.4(2x) + 0.6(x/2) = 0.4(4) + 0.6(1) = 1.6 + 0.6 = \mathbf{2.2} $$
  Since $2.2 > 2$, **switching is favorable.**

  **Case B: You see $x = 4$**
  *   **Scenario 1 (You have Small):** The pair is $(4, 8)$. Requires $S=4$.
      *   Prior weight: $P(S=4) = \frac{1}{3}(\frac{2}{3})^2 = \frac{4}{27}$.
  *   **Scenario 2 (You have Large):** The pair is $(2, 4)$. Requires $S=2$.
      *   Prior weight: $P(S=2) = \frac{2}{9} = \frac{6}{27}$.

  *   Probability you have Small: $\frac{4/27}{4/27 + 6/27} = \frac{4}{10} = 0.4$.
  *   Probability you have Large: $\frac{6/27}{4/27 + 6/27} = \frac{6}{10} = 0.6$.

  **EV of Switching:**
  $$ EV = 0.4(2x) + 0.6(x/2) = 0.4(8) + 0.6(2) = 3.2 + 1.2 = \mathbf{4.4} $$
  Since $4.4 > 4$, **switching is favorable.**

  *(Note: Because the ratio of probabilities $P(S=2^{k-1}) / P(S=2^k)$ is constant at $1.5$ for all $k$, the EV of switching is always $1.1x$ for any $x$ you observe.)*

  ### 3. Which Feature of the Prior is Doing the Work?
  The work is being done by the **decay rate** of the prior distribution. 

  For switching to be favorable, it must be more likely that you are holding the smaller envelope than the larger one, relative to the payoff odds. Specifically, we need $P(S=x) > \frac{1}{2}P(S=x/2)$. In our prior, the probability mass decreases by a factor of $2/3$ for each doubling of the amount. Because $2/3 > 1/2$, the probability of the smaller amount ($x$) stays "heavy" enough compared to the larger amount ($x/2$) to make the $2x$ payoff dominate the expectation. 

  Essentially, the prior puts enough weight on very large numbers that, for any finite $x$ you see, it is statistically more likely that there is "room above" $x$ than "room below" $x$.

  ### 4. The Symmetry Objection
  **Objection:** *"Before I opened the envelope, the two envelopes were symmetric. I had a 50% chance of picking the larger one. How can opening the envelope break that symmetry and make switching always better? If switching is always better, I should have just switched without looking. But if I should have switched without looking, the envelopes weren't symmetric to begin with."*

  **Response:**
  The symmetry holds **ex-ante** (before opening), but the expected values involved are **infinite**. 

  If you calculate the unconditional expected value of the envelope you hold ($E[X]$) using this prior, the sum diverges to infinity. Similarly, the expected value of the other envelope is also infinity. Since $\infty = \infty$, there is no advantage to switching before you open the envelope; symmetry is preserved.

  The paradox arises because the **conditional** expected value (after seeing $x$) is finite ($1.1x$), while the **unconditional** expected value is infinite. It is mathematically possible to have $E[\text{Other} \mid X=x] > x$ for every $x$, while $E[\text{Other}] = E[X] = \infty$. You cannot sum up the conditional gains to get a total gain because the average payoff of this game does not converge. The "gain" is real for any specific instance you play, but it cannot be realized as an average profit over many trials because the variance is too high (the "heavy tail" of the prior).
