  8.  *(Self-Correction during drafting)*: Wait, the user says "The show seems to treat these as basically the same kind of problem." I need to confirm if they do. Yes, both lead to the same outcome (no points). But the *reasoning* in the show is that modern life makes *any* clean action impossible. So, Trolley (forced harm) and Tomato (unintended harm) are treated as equivalent barriers. My analysis should focus on why the show equates them (to prove the system is broken) vs. why philosophy distinguishes them (to assign blame).

