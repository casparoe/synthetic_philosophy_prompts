      *   *Doctrine of Double Effect (DDE):* Aquinas (roots), Catholic moral theology, Philippa Foot/Elizabeth Anscombe (modern). Intentionality is key. Good effect intended, bad effect merely foreseen. Proportionality (good must outweigh bad). No other way to achieve the good.
      *   *The User's Point:* The show focuses heavily on "unintended consequences" (the tomato example). This is actually more about *moral luck* (Nagel/Williams) and *consequentialism vs. deontology* regarding knowledge, but the user specifically links it to DDE. I need to validate their intuition while clarifying the taxonomy. The "broken point system" is actually more about *epistemic limitations* and *globalized consequentialism* than strict DDE, but DDE is a useful lens for the *intentionality* aspect.

  3.  **Analyze *The Good Place*:**
      *   *Season 1-2:* The Point System. Why no one gets in. Complexity of modern life. Unintended consequences. (This aligns with the user's "tomato" observation).
