answer: |-
  # Q&A Prep Sheet: Selective Realism & Novel Predictive Success

  **Context:** Departmental Colloquium
  **Your Position:** Selective Realism (Working Posits Variant)
  **Audience:** Historians (Ether/Chemical Revolution), Bayesians (2), Structural Realist (1)

  ---

  ### 1. The "Fresnel Counter-Example" (The Ether)
  **Who:** The Historians (especially your friend) & The Structural Realist
  **Likelihood:** Certain. **Damage:** High.
  **Phrasing:** *"You hang your hat on posits essential to novel predictions. But look at Fresnel. The luminiferous ether was absolutely essential to his derivation of the white spot prediction. It wasn't decorative background; it was the engine of the model. Yet there is no ether. It wasn't approximated; it was deleted. If your criterion can't save the ether, what makes you think it will save the electron?"*

  **Your Two-Minute Reply:**
  "I agree the ether *substance* was discarded, but we must distinguish the *ontological commitment* from the *causal role*. Fresnel's derivation relied on the posit of a medium supporting transverse wave propagation with specific elasticity properties. When Maxwell and later Einstein discarded the mechanical ether, they did not discard the posit of a field possessing those specific propagation properties. The 'working posit' wasn't 'a jelly-like substance,' it was 'a locus of energy capable of transverse oscillation.' That functional role survives in the electromagnetic field. My claim isn't that the *name* or the *mechanical analogy* survives, but that the specific causal capacity posited to generate the prediction is retained in the successor theory. The ether wasn't 'false' in the sense of being idle; it was 'approximately true' in the sense that the field inherits its predictive load."

  **Where this is weakest:**
  You risk conceding too much to the Structural Realist. If the "posit" is just a set of mathematical properties without a underlying substance, the historian will say you've just redefined "truth" to mean "empirical adequacy," and the Bayesian will ask what ontological work is left for the posit to do.

  ---

  ### 2. The "Hindsight Essentiality" Objection
  **Who:** The Historians & Philosophers of Science
  **Likelihood:** Very High. **Damage:** Very High.
  **Phrasing:** *"This smells of cheating. You decide which parts of a theory were 'essential' to the prediction only after you know which parts survived. In real-time, scientists can't distinguish the working posits from the idle wheels. If your selectivity relies on hindsight, it offers no guidance for current theory choice and doesn't actually block the PMI for today's theories."*

  **Your Two-Minute Reply:**
  "That's a common worry, but it conflates *epistemic access* with *metaphysical status*. My claim is about what *actually* latches onto reality, not necessarily what scientists can certify in the moment. However, we aren't entirely blind. We can reconstruct derivations logically. If a posit can be removed without breaking the derivation of the novel prediction, it's idle. If the math breaks without it, it's working. We see this in the transition from Bohr to Schrödinger: the stationary orbits were idle for the spectral lines' general pattern; the quantization of action was essential. We don't need perfect foresight, just rigorous reconstruction of the derivation relation. The PMI assumes all successful posits are equally likely to be false; I'm arguing the derivation structure gives us a filter."

  **Where this is weakest:**
  Historians know that derivations are often messy. Scientists often use false posits that *cancel out* errors elsewhere in the math to get the right answer. Logical reconstruction might show a posit was "essential" to the *derivation*, but not essential to the *truth* of the result.

  ---

  ### 3. The Bayesian Prior Challenge
  **Who:** The Two Confirmation Theorists
  **Likelihood:** High. **Damage:** Medium (They may dismiss the whole project).
  **Phrasing:** *"You're running a No-Miracles Argument in disguise. But without priors, 'success' doesn't tell us about truth. How do you know the prior probability of a posit being approximately true isn't vanishingly small? If the base rate of true posits is low, even novel success won't boost the posterior enough to warrant belief. You're ignoring the base rate fallacy."*

  **Your Two-Minute Reply:**
  "I'm not asking you to calculate a posterior probability from a subjective prior. I'm arguing that the PMI itself relies on a prior—specifically, a prior that treats all theoretical posits as equally susceptible to falsification regardless of their role. My argument is that the *type* of evidence matters. Novel prediction constrains the hypothesis space much more tightly than accommodation. I'm not claiming success guarantees truth; I'm claiming it shifts the burden of proof. To maintain the PMI, you have to argue that nature systematically conspires to make *only* the essential posits false while keeping the predictions true. That requires a more complex skeptical hypothesis than the realist one."

  **Where this is weakest:**
  Bayesians hate "burden of proof" arguments. They want numbers. By refusing to engage with priors, you look like you're dodging the formal constraint they care about most.

  ---

  ### 4. The Structural Realist "Friendly Fire"
  **Who:** The Structural Realist
  **Likelihood:** Medium. **Damage:** Medium.
  **Phrasing:** *"You say the 'posit' survives. I say only the 'structure' survives. Why posit an ontology at all? In the ether case, the equations survived, the 'stuff' didn't. Isn't your view just Epistemic Structural Realism with extra steps?"*

  **Your Two-Minute Reply:**
  "Structure doesn't float free. A relation requires relata. When I say the posit survives, I mean the *property-bearing entity* survives, even if our conception of its 'nature' changes. The electromagnetic field isn't just a set of equations; it's a physical thing that carries energy and momentum. If we strip away all ontological commitment, we lose the explanation for *why* the structure holds. My selective realism is a middle ground: we commit to the entities *required* by the structure that generates predictions, but we remain agnostic about their non-essential properties."

  **Where this is weakest:**
  This draws a line that is hard to defend. If you admit the "nature" changes completely (mechanical ether $\rightarrow$ relativistic field), the Structural Realist will argue you've admitted *only* the structure survived, not the entity.

  ---

  ### 5. THE QUESTION YOU HOPE NOBODY ASKS
  **Who:** Any of them (The "Base Rate" Killer)
  **Phrasing:** *"Okay, let's grant your selectivity works. But the PMI is a statistical argument. For every posit that survives via novel prediction, how many died? If 90% of 'essential' posits from the 19th century were discarded, your selectivity filter is too leaky to warrant rational belief. Do you have a success-to-failure ratio, or are you just cherry-picking the winners?"*

  **Why this is dangerous:**
  You don't have the data. Historians know the graveyard of science is vast. If you admit you don't know the base rate, your claim that realism is the "best explanation" looks like an anecdotal fallacy. If you guess a number, they will dismantle it.

  **Emergency Deflection:**
  "The PMI relies on a qualitative intuition that 'most theories die.' But that counts *theories*, not *posits*. A theory dies, but its components scatter. We need a granular audit of posits, not theories. Until that audit is done, the PMI is an assumption, not a datum. My claim is that *if* we look at novel prediction, the survival rate is significantly higher than the PMI assumes, enough to warrant tentative belief." (Then pivot back to the Fresnel case).
