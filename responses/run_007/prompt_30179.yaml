prompt: |-
  I'm giving a departmental colloquium next month defending a selective realism about scientific theories: roughly, that when a theory has a track record of novel predictive success, the specific theoretical posits that were actually used to derive those novel predictions—rather than the theory's full ontology or the background story told about those posits—are likely to survive, approximately, into successor theories, and that this restricted claim is enough to blunt the pessimistic meta-induction. The audience will be mostly historians of science who treat the pessimistic meta-induction as settled, several of them working on the chemical revolution and nineteenth-century ether theories, plus two confirmation theorists who think of themselves as Bayesians and are impatient with any no-miracles reasoning, and one structural realist. Last night I had a long argument about this with a friend, a historian of nineteenth-century physics, who kept returning to the luminiferous ether: a posit that did genuine predictive work and was then abandoned outright. The argument showed me my replies are not ready. Prepare my Q&A prep sheet: the objections I will actually get from this audience, ordered by how likely and how damaging each is, phrased the way these particular people would phrase them, each with a two-minute reply and a note on where that reply is weakest. Include the question I am hoping nobody asks.
