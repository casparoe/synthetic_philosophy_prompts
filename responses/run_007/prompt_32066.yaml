  # Workshop Activity: The Liquidity Cycle

  **Target Audience:** 12 Adults (Engineers/Grad Students)
  **Duration:** 2 Hours
  **Goal:** Experiential demonstration of time inconsistency (hyperbolic discounting) leading to a dynamic money pump.
  **Materials:** Printed "Certificates," a clear lockbox (for prize fund), whiteboard, timer.

  ## Part 1: Game Design & Flow

  ### The Setup (0:00 – 0:20)
  **Narrative:** "We are running a market for time-delayed value. You will earn 'Workshop Points' (WP). At the end of the session, WP will be converted into raffle tickets for a $50 Gift Card. 100 WP = 1 Ticket. You want to maximize tickets."

  1.  **Endowment:** Every participant receives a **"Cash Certificate"** worth **100 WP**, redeemable *immediately*.
  2.  **The Bank:** You (the Facilitator) act as the Bank. You place a visible stack of raffle tickets (or cash equivalent) in a clear lockbox to prove solvency.
  3.  **Rule:** Trades are voluntary, private (written on slips), and irreversible once accepted.

  ### Phase 1: The Investment (0:20 – 0:30)
  **Offer:** "The Bank is offering a high-yield upgrade. You may trade your **Cash Certificate (100 WP Now)** for a **Gold Certificate (120 WP at End of Workshop)**."
  *   **Rational Choice:** Take the Gold. It is a 20% risk-free return.
  *   **Expected Outcome:** 90%+ of participants trade. They now hold 120 WP (Delayed).
  *   **Facilitator Note:** Collect the Cash Certificates. Issue Gold Certificates.

  ### Phase 2: The First Liquidity Shock (1:00 – 1:10)
  *(40 minutes of normal workshop content passes. Participants are engaged but the delay is becoming salient.)*

  **Offer:** "Market conditions have changed. The Bank is offering early liquidity. You may trade your **Gold Certificate (120 WP at End)** for a **Silver Certificate (105 WP at 1:45 PM)**."
  *   **The Trap:** 1:45 PM is 35 minutes before the end. 105 is less than 120.
  *   **Psychology:** The "End of Workshop" feels abstract and distant. 1:45 PM feels concrete. The 15-point loss feels like a "fee" for liquidity, which engineers often accept as a cost of doing business.
  *   **Expected Outcome:** 40-60% of participants trade. They rationalize this as "locking in gains" or "reducing risk."
  *   **Facilitator Note:** Collect Gold. Issue Silver.

  ### Phase 3: The Final Cash-Out (1:45 – 1:55)
  *(35 minutes pass. Participants are tired. The end is in sight.)*

  **Offer:** "Final settlement window. You may trade your **Silver Certificate (105 WP at 1:45)** for **Cash (90 WP Now)**."
  *   **The Trap:** 90 is significantly less than 105. But "Now" is viscerally powerful compared to "15 minutes from now."
  *   **Psychology:** Present bias peaks. The mental transaction cost of waiting 15 minutes feels worth more than 15 points.
  *   **Expected Outcome:** 50%+ of those holding Silver will trade.
  *   **Final State:** These participants started with 100 WP potential (or 120 WP invested) and ended with 90 WP. They have been "pumped."

  ### Part 2: The Debrief (1:55 – 2:00)
  **Reveal:**
  1.  Ask for a show of hands: "Who ended with 90 WP?"
  2.  Ask: "Who started with the option for 120 WP?"
  3.  **The Reveal:** "You just lost 25% of your potential value through a series of trades you voluntarily accepted."
  4.  **Name Drop:** "This is a **Dynamic Money Pump**."

  ---

  ## Part 3: Debrief Script & Mapping

  Do not simply explain the theory; map it to their specific choices.

  **1. Mapping the Instability (5 mins)**
  *   **Ask:** "At 0:20, who preferred 120 Later over 100 Now?" (Most hands).
  *   **Ask:** "At 1:45, who preferred 90 Now over 105 Later?" (Many hands).
  *   **The Formal Argument:** "If you prefer A > B at Time 1, and B > C at Time 2, you should prefer A > C. But many of you chose A (120 Later) initially, then traded to C (90 Now). You violated *transitivity across time*. Your 'self' at 0:20 and your 'self' at 1:45 had different utility functions."

  **2. Present Bias vs. Changing Minds (5 mins)**
  *   **Challenge:** "Maybe you just legitimately changed your mind? Maybe 90 Now is actually better?"
  *   **Counter:** "If 90 Now was always better, you would have chosen it at 0:20. You didn't. You only wanted it when 'Now' became immediate. This is **Hyperbolic Discounting**: we discount the future heavily when it is close, but lightly when it is far."
  *   **Engineer Analogy:** "It's like optimizing a function with a bug that changes the weight of a variable based on proximity to the deadline."

  **3. Analyzing the Defenses (5 mins)**
  *   **Defense 1:** "I could have just refused the final trade."
      *   **Rebuttal:** "You *could* have. But the pump relies on the fact that your future self cannot be trusted to make the choice your past self wanted. You lacked **binding commitment**."
  *   **Defense 2:** "The trades felt different."
      *   **Rebuttal:** "Exactly. The *context* changed, but the *value* shouldn't have. A rational agent's preferences should be stable regardless of when the choice is presented, provided the information is the same."

  **4. Commitment Devices (5 mins)**
  *   **Question:** "How could you have protected your 120 WP?"
  *   **Solutions:**
      *   **Ulysses Contract:** Hand the Gold Certificate to a neighbor and tell them, 'Do not give this back to me no matter what I say.'
      *   **Costly Signaling:** Pay a 5 WP fee at the start to *lock* the Gold Certificate (make it non-tradable).
      *   **Automation:** Set up rules that execute automatically (e.g., retirement accounts).

  ---

  ## Part 4: Predictable Failure Modes & Mitigation

  **1. The "Skeptic" Failure (Risk Aversion)**
  *   **What happens:** Participants suspect the Bank won't pay the 120 WP at the end. They cash out early to "cut losses."
  *   **Mitigation:** Put the physical prize (gift cards or cash) in a clear box at the front of the room at 0:00. Do not touch it until the end. Explicitly state: "This box is the collateral."
  *   **Debrief Point:** If they cite risk, acknowledge it. "Real-world money pumps often hide inside risk premiums. But if the bank is solvent, the loss is pure preference inconsistency."

  **2. The "Gamer" Failure (Collusion/Meta-Gaming)**
  *   **What happens:** Someone whispers, "This is a trick. Don't trade."
  *   **Mitigation:**
      *   Make trades **private**. Use folded slips of paper collected in a hat.
      *   Frame the offers as "Market Opportunities" rather than "Workshop Tasks."
      *   If someone calls it out early: "You might be right. But the question is: Can you resist the urge even if you know it's a test?" (Turns it into a challenge of will).
  *   **Debrief Point:** "Knowing the bias exists doesn't cure it. That's why we need structural commitment, not just awareness."

  **3. The "Boredom" Failure (Time Drag)**
  *   **What happens:** The 40-minute wait feels too long; participants disengage.
  *   **Mitigation:** Do not make them *wait* idly. Run the workshop content *during* the wait. The game runs in the background. The "Liquidity Shocks" interrupt the normal flow.
  *   **Debrief Point:** "Notice how the workshop content distracted you from your long-term goal? That's how real-world pumps work—distraction + immediacy."

  **4. The "Rational Fee" Defense**
  *   **What happens:** Participants argue the point loss was a fair "fee" for liquidity.
  *   **Mitigation:** In the debrief, calculate the *annualized interest rate* of their discounting.
      *   "You gave up 15 WP to wait 35 minutes less. That is an implied discount rate of X% per hour. Extrapolated, you value money at 10,000% APR."
      *   This usually shocks engineers into realizing the irrationality.

  ---

  ## Part 5: Limitations of the Game

  Be explicit about what this game *cannot* do. You must supply these points verbally.

  **1. The "Cycle" is Dynamic, Not Static**
  *   **Limitation:** A classic money pump requires intransitive preferences over static goods (A > B, B > C, C > A). This game demonstrates **Time Inconsistency** (A > B at T1, B > A at T2).
  *   **Facilitator Supply:** "In a single linear timeline, you can't return to T1 to close the loop. However, in a *repeated* game (like saving for retirement every year), this becomes a true cycle. You pump yourself every year, ending up poorer than if you had stuck to the plan."

  **2. Stakes are Artificial**
  *   **Limitation:** Points are not rent money. The "pain" of loss is muted.
  *   **Facilitator Supply:** "With real money, the emotional arousal would be higher, which might *increase* present bias (stress makes us impatient) or *decrease* it (fear makes us cautious). The mechanism, however, remains the same."

  **3. No Secondary Market**
  *   **Limitation:** In a real money pump, an external agent exploits you. Here, the Facilitator is the exploiter.
  *   **Facilitator Supply:** "In the real world, the 'Trader' is a credit card company, a payday lender, or a subscription service offering 'easy cancellation' that isn't. They profit from the gap between your T1 intentions and your T2 actions."

  ## Facilitator Cheat Sheet (Key Numbers)
  *   **Start:** 100 WP (Now)
  *   **Trade 1:** 120 WP (End) — *Gain 20*
  *   **Trade 2:** 105 WP (35m early) — *Loss 15*
  *   **Trade 3:** 90 WP (Now) — *Loss 15*
  *   **Total Loss:** 30 WP (25% of potential peak value).
  *   **Break-even:** Participants must refuse *both* early withdrawal offers to win.
