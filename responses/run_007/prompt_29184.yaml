answer: |-
  # Activity Design: The Envelope Seduction
  **Duration:** 90 Minutes  
  **Participants:** 14 (Retired Scientists/Engineers)  
  **Materials:** 28 identical opaque envelopes, cash (approx. $300 total), whiteboard/markers, printed worksheets (one per person).  
  **Facilitator Role:** Neutral Game Master. Do not mention "Two-Envelope Problem," "Paradox," or "Bayesian" until the Debrief.

  ---

  ## Part 1: Immersion (25 Minutes)
  *Goal: Induce the intuitive urge to switch without providing the theoretical framework.*

  **1. Setup (5 mins)**
  *   **Seating:** Arrange 7 tables of 2.
  *   **The Stakes:** Explain that you have funded a pool. No one risks personal money. Winnings are theirs to keep, donate, or return to the pool at the end.
  *   **The Rule:** "At each table, there are two envelopes. One contains exactly double the amount of the other. The specific amounts vary from table to table. You will not know the range of possible values."
  *   **Distribution:** Hand one envelope to each participant. Instruct them **not** to open them yet.

  **2. Round 1: The Silent Intuition (5 mins)**
  *   **Action:** Participants open envelopes. They see the amount (e.g., $10). They do *not* show their partner.
  *   **Decision:** On their worksheet, they mark "Keep" or "Switch."
  *   **Constraint:** No talking. No calculating. Go with gut instinct.
  *   **Collection:** Collect the worksheets. Do not reveal the decisions yet.

  **3. Round 2: The Negotiation (10 mins)**
  *   **Action:** Participants reveal their amounts to their partner. (e.g., Table 1 has $10 and $20).
  *   **Task:** "Discuss with your partner whether switching was advantageous. You must agree on a joint recommendation for a *third* hypothetical player joining your table with the same information."
  *   **Prompt:** If they are stuck, ask: "If you hold $A$, what are the possible values in the other envelope? What are the odds of each?"
  *   **Output:** Each pair writes a brief justification on a fresh card.

  **4. Round 3: The Mathematician's Pitch (5 mins)**
  *   **Action:** Hand out a slip of paper containing the following argument (verbatim):
      > "Let $A$ be the amount in your envelope. The other envelope contains either $0.5A$ or $2A$. Since you had no prior information, both are equally likely (50%). The expected value of switching is $0.5(0.5A) + 0.5(2A) = 1.25A$. Since $1.25A > A$, you should always switch."
  *   **Task:** "Does this argument match your reasoning in Round 2? Does it convince you? Mark 'Convincing' or 'Flawed'."

  ---

  ## Part 2: The Autopsy (30 Minutes)
  *Goal: Map the activity moments to the formal premises of the paradox.*

  **1. The Board Work (15 mins)**
  Draw four columns on the whiteboard. Ask the group to populate them based on their experience.

  | Activity Moment | Formal Premise | The Seduction | The Doubt |
  | :--- | :--- | :--- | :--- |
  | **Round 1 (Gut)** | **Symmetry:** "It doesn't matter which I picked." | Both envelopes looked identical. | But I *did* pick one. Does that break symmetry? |
  | **Round 2 (Odds)** | **Conditional Prob:** $P(\text{Other}=2A \mid \text{Seen}=A) = 0.5$ | "I don't know the range, so it's a coin flip." | Is it really 50/50 for *any* number I see? |
  | **Round 3 (Math)** | **Expectation:** $E = 0.5(0.5A) + 0.5(2A)$ | The math says I gain 25%. | $A$ is fixed in my hand, but variable in the formula. |
  | **Iteration** | **Universal Quantification:** "Always Switch." | Works for $10, $100, $1000. | If I switch, I should switch back. Infinite loop. |

  **2. Locating the Break (15 mins)**
  Guide the discussion to pinpoint the exact failure.
  *   **Question:** "In Round 2, did anyone see a number that made them feel the 50/50 odds were wrong?"
  *   **Likely Response:** Someone who saw a very large number (relative to expectations) or a very small number (e.g., $1).
  *   **Facilitator Note:** If no one noticed, introduce a hypothetical: "What if you opened your envelope and found $1,000,000? Would you still believe there is a 50% chance the other has $2,000,000?"
  *   **The Pivot:** This reveals that the probability $P(\text{Other}=2A \mid \text{Seen}=A)$ is not constant. It depends on the prior distribution of money in the envelopes.

  ---

  ## Part 3: Resolutions & Costs (25 Minutes)
  *Goal: Distinguish between fixing the math and fixing the model.*

  Present three "Repairs" to the reasoning. Ask the group to evaluate the "cost" of each.

  **Resolution A: The Bayesian Repair (Reject Conditional Probability)**
  *   **The Fix:** We admit we *do* have a prior belief about how much money exists in the world. If I see $A$, the likelihood that $A$ is the smaller amount vs. the larger amount depends on how likely $A$ and $A/2$ were to be chosen initially.
  *   **The Cost:** We lose the "ignorance" premise. We must specify a distribution $P(X)$. Once we do, the 50/50 assumption vanishes for some values of $A$.
  *   **Verdict:** Mathematically sound, but requires information we claimed not to have.

  **Resolution B: The Logical Repair (Reject Expectation Calculation)**
  *   **The Fix:** The variable $A$ is not a constant in the expectation formula. In the term $0.5(0.5A)$, $A$ represents the *larger* amount. In $0.5(2A)$, $A$ represents the *smaller* amount. You cannot sum them as if $A$ is the same fixed value.
  *   **The Cost:** We must abandon the convenient notation that treats the observed amount as a fixed anchor for both possibilities. It feels like a trick of notation, but it is a category error.
  *   **Verdict:** Logically rigorous, but unsatisfying to those who feel the "gain" is real.

  **Resolution C: The Physical Repair (Reject Unboundedness)**
  *   **The Fix:** In the real world (and this room), there is a maximum cap $M$. If you see $A > M/2$, you know switching loses.
  *   **The Cost:** This admits the paradox is an artifact of idealization (infinity). It solves the *practical* problem but leaves the *theoretical* problem (what if there is no cap?) intact.
  *   **Verdict:** Pragmatically correct for scientists, but dodges the epistemological puzzle.

  ---

  ## Part 4: The Missing Feature (10 Minutes)
  *Goal: Address the finite-stakes limitation without lecturing.*

  **1. The "Infinity" Gap**
  *   **Statement:** "In this room, I had a finite budget. There was a maximum envelope. If you had found it, the 'Always Switch' argument would have failed immediately."
  *   **Question:** "So, where does the paradox actually live?"
  *   **Desired Insight:** It lives only in the assumption of an **improper prior**—a probability distribution that is uniform over an infinite range $(0, \infty)$.
  *   **Facilitator Move:** Do not derive the integral. Instead, say: "For the 50/50 assumption to hold for *every* possible value $A$ you might open, the probability of finding any specific amount must be infinitesimally small but non-zero across an infinite range. Such a distribution cannot be normalized. It does not exist in physics, and it does not exist in probability theory."
  *   **Closing:** "The paradox is not a puzzle about envelopes. It is a warning sign that you have tried to apply finite logic to an infinite state space without checking boundary conditions."

  ---

  ## Predictable Failure Modes & Mitigation

  **1. Risk Aversion ("I'll just keep what I have.")**
  *   **Prediction:** Participants, being prudent retirees, may refuse to switch even if convinced by the math, citing utility curves.
  *   **Mitigation:** Pre-frame the money as "House Money." Explicitly state: "For the purpose of this exercise, assume you are risk-neutral. We are testing the logic, not your pension strategy."

  **2. The Monty Hall Confusion**
  *   **Prediction:** Someone will argue, "Opening the envelope gives me information, like Monty opening a door."
  *   **Mitigation:** Intervene immediately. "In Monty Hall, the host *knows* and *avoids* the prize. Here, the amount was fixed before you arrived. Opening the envelope reveals a value, but it does not eliminate a specific option based on knowledge. Distinguish *revealing* from *filtering*."

  **3. Inferring the Filling Rule Too Quickly**
  *   **Prediction:** A participant might ask, "What was the max amount?" or try to deduce the distribution from the 14 envelopes.
  *   **Mitigation:** Acknowledge this is the *correct* scientific instinct. "If you can infer the distribution, you have solved the Bayesian version. For the paradox to work, you must pretend you cannot infer the distribution. Suspend that instinct for Round 3."

  **4. Discussion Collapse into "It's 50/50"**
  *   **Prediction:** The group may get stuck arguing whether the odds are truly 50/50 without moving to the expectation calculation.
  *   **Mitigation:** Use the Worksheet in Round 3. Force them to write down the equation $0.5(0.5A) + 0.5(2A)$. Make the math the object of scrutiny, not just the odds.

  **5. Disappointment at the "Finite" Solution**
  *   **Prediction:** They may feel cheated that the solution is just "there's a max cap."
  *   **Mitigation:** Emphasize that the *mathematical* paradox persists even with caps if the agent doesn't *know* the cap. The real lesson is about **improper priors**. Remind them of their oceanography background: "It's like assuming a wave spectrum extends to infinite frequency. The math works until you calculate total energy, then it blows up. This is the same spectral error."

  ---

  ## Facilitator's Cheat Sheet: The Exact Flaw
  *Keep this for your reference to guide the debrief.*

  The argument fails because it treats $A$ as a **constant** in the inequality ($1.25A > A$) but as a **random variable** in the expectation calculation ($0.5(0.5A) + 0.5(2A)$).
  *   In the term $0.5(0.5A)$, $A$ is the *larger* amount ($2X$).
  *   In the term $0.5(2A)$, $A$ is the *smaller* amount ($X$).
  *   You cannot sum these expectations unless the probability of $A$ being the smaller amount is exactly 0.5 *regardless of the value of A*.
  *   This requires $P(X) = P(2X) = P(4X) \dots$ for all $X$, which is impossible for a normalized probability distribution.

  **Final Instruction to Facilitator:**
  Your goal is not to prove them wrong, but to help them locate the *assumption* that broke. Let them feel the seduction first. If they leave believing "The math looks right but reality says no," you have succeeded. If they leave understanding "The math looks right because it assumes an impossible universe," you have excelled.
