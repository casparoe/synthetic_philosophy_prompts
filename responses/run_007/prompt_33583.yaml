prompt: |-
  I've been thinking about dispositions — like a wine glass being fragile — and I keep getting stuck on two ways a thing can fail to do what its disposed to do when you trigger it. In one, the disposition itself gets switched off right when the trigger hits (I've been calling this a fink). In the other, the disposition is still there but something's in the way so it can't show up (I've been calling this a mask). Build me a pair of cases, same object and same trigger, one fink and one mask, where from the outside they look exactly the same. Constraint: no magic, no guardian angels — ordinary household or workshop stuff only. After the scenario, run both cases through the simple test "it's disposed to X exactly when, if you triggered it, it would X" and show what that test says about each, and why it can't tell your two cases apart. Then say which feature of the cases is doing the real work, and what someone who likes the simple test would say to keep it alive.
