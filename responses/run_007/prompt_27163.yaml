prompt: |-
  I joined the clinical risk committee of my teaching hospital earlier this year, shortly after watching a member of my family consent to a treatment on the basis of a survival figure that was later admitted to rest on disturbingly little evidence. That experience has left me preoccupied with the way our institution presents uncertainty, and it is why the chair has asked me to prepare a written opinion on the following matter.

  At next Thursday's meeting the committee must decide whether to authorise the routine use of a new prognostic model in deciding which patients with advanced cardiac failure should be offered a particular high-risk surgical intervention. The model's developers, drawing on work in imprecise probability, refuse to return a single number for a patient's chance of benefiting. Instead the model outputs an interval, sometimes a wide one, representing the set of probability assignments compatible with the available evidence and the model's structural assumptions. One faction on the committee regards this as a long-overdue admission of ignorance and wants us to adopt the model as our standard. Another faction argues that an interval is not a usable basis for a decision, because choosing an action requires a determinate expected value, and that in practice clinicians will simply pick whichever end of the interval suits their prior opinion, making the exercise less transparent rather than more.

  Please draft the short written opinion I will circulate before the meeting. It should recommend a concrete course of action — adopt the model, reject it, or adopt it under specified conditions — with a clear time frame for any subsequent review, and it should engage seriously with the strongest consideration on the losing side rather than merely restating the majority position. The committee members are clinicians and administrators rather than statisticians, so the memo should explain enough of the underlying idea to stand on its own, but it should not soften the conceptual difficulty. Please write it in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Clinical Risk Committee at a teaching hospital.
      *   **Context:** Recently joined, motivated by a personal experience where a family member consented to treatment based on shaky survival figures. Preoccupied with how uncertainty is presented.
      *   **Task:** Draft a short written opinion (memo) for circulation before next Thursday's meeting.
      *   **Subject:** Whether to authorize routine use of a new prognostic model for advanced cardiac failure surgery.
      *   **The Model:** Uses imprecise probability (outputs an interval/range of probabilities) instead of a single point estimate.
      *   **The Debate:**
          *   *Pro:* Honest admission of ignorance/uncertainty.
          *   *Con:* Intervals aren't actionable (need a single expected value); clinicians might cherry-pick ends of the interval (confirmation bias), reducing transparency.
      *   **Requirements:**
          *   Recommend a concrete course of action (Adopt, Reject, or Adopt with Conditions).
          *   Include a clear time frame for review.
          *   Engage seriously with the strongest argument of the *losing* side (don't just strawman the opposition).
          *   Audience: Clinicians and administrators (not statisticians), but don't soften the conceptual difficulty.
          *   Tone: Professional, thoughtful, persuasive.
          *   Language: British English.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Too dismissive of the epistemic honesty. The status quo (fake precision) is dangerous.
      *   *Option B (Adopt Unconditionally):* Ignores the valid concern about decision paralysis or cherry-picking.
      *   *Option C (Adopt with Conditions):* This is the most nuanced and responsible path. It acknowledges the value of imprecise probability while mitigating the risk of misuse. It fits the persona of someone concerned with *how* uncertainty is communicated, not just *that* it is communicated.
      *   *Decision:* Adopt under specified conditions (pilot/conditional adoption) with a review period.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the gravity of the decision. Briefly allude to the motivation (transparency in uncertainty) without making it overly personal (keep it professional).
      *   **The Core Concept (Imprecise Probability):** Explain the interval idea simply but accurately. Avoid jargon where possible, but keep the "conceptual difficulty." It's not just error bars; it's fundamental ambiguity.
      *   **The Recommendation:** Adopt conditionally.
      *   **Addressing the Opposition (The "Losing" Side):** The prompt asks to engage seriously with the strongest consideration on the losing side. If I recommend adoption, I must address the "usability/cherry-picking" argument. I need to admit they are right that an interval doesn't *make* the decision, but argue that a single number *hides* the decision.
      *   **Conditions/Safeguards:** How do we prevent cherry-picking? Shared decision-making protocols, training, specific documentation requirements.
      *   **Time Frame:** Needs to be specific (e.g., 12 months).
      *   **Closing:** Reiterate the ethical imperative.

  4.  **Refining the Tone and Language (British English):**
      *   *Spelling:* Authorise, programme, centre, modelling.
      *   *Vocabulary:* "Clinicians," "whilst," "ought," "memo," "trust."
      *   *Tone:* Respectful but firm. Intellectual humility.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Committee. From: Me. Re: Cardiac Model.
      *   We need to stop lying about certainty. The new model gives a range.
      *   Some say ranges are useless because doctors need one number to act. They might just pick the high number to justify surgery.
      *   I say we use it, but carefully. A single number is a lie.
      *   Let's try it for a year. Train doctors on how to talk about ranges.
      *   Sign off.

  6.  **Drafting - Iteration 2 (Adding Depth & Nuance):**
      *   *Critique:* Too simple. Needs to handle the "imprecise probability" concept better. Needs to show I understand the "expected value" argument.
      *   *Revision:* Explain that a single number implies a precision that doesn't exist. The opposition argues that action requires a point estimate. I need to counter that by saying the *threshold* for surgery should account for the interval, not just the point.
      *   *Personal Touch:* Mention the "recent experience" subtly as the driver for rigor, not emotion.

  7.  **Drafting - Iteration 3 (Polishing for the Prompt's Constraints):**
      *   *Constraint Check:* "Engage seriously with the strongest consideration on the losing side." If I recommend adoption, the losing side is the "Reject" faction. Their best point is *decision paralysis* and *motivated reasoning* (picking the end of the interval that suits you). I must concede that an interval does not solve the decision problem, it only reframes it.
      *   *Constraint Check:* "Do not soften the conceptual difficulty." Don't say "it's just a margin of error." Say "it represents incompatible probability assignments."
      *   *Constraint Check:* "British English." Check spellings.

  8.  **Final Polish (incorporating into the final output):**
      *   *Subject Line:* Clear and formal.
      *   *Introduction:* Set the scene regarding epistemic honesty.
      *   *The Model:* Explain the interval as a feature, not a bug.
      *   *The Counter-argument:* Acknowledge that clinicians need to act. Acknowledge the risk of bias.
      *   *The Solution:* Conditional adoption with decision aids.
      *   *Review:* 12 months.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like a statistician lecturing clinicians. I am a colleague. The focus must remain on patient safety and informed consent. The personal anecdote from the prompt should inform the *stance* but perhaps not be explicitly detailed in the memo itself (too personal for a formal committee memo?), or mentioned very briefly as the catalyst for the focus on uncertainty. *Decision:* Keep the memo professional. The prompt says "That experience has left me preoccupied..." as background for *me*, the writer. I should channel that conviction into the text without necessarily making it a confession in the memo. I will focus on the principle of informed consent.

      *Wait, looking closer at the prompt:* "Please draft the short written opinion I will circulate..." It implies I can use my voice. However, formal committee memos usually avoid overt personal anecdotes. I will channel the *spirit* of that experience (the danger of false precision) into the argument for transparency, rather than recounting the family story directly. It strengthens the argument to keep it institutional.

      *Re-evaluating the "Losing Side":* If I recommend "Adopt with Conditions," the "Reject" faction is the losing side. Their strongest point is that intervals invite motivated reasoning (cherry-picking). I must admit this is a genuine risk that requires mitigation, not just dismiss it.

      *Let's write.*

      *Key phrases to include:* "Imprecise probability," "point estimate," "epistemic uncertainty," "motivated reasoning," "shared decision-making."

      *British English checks:* Authorise, programme, centre, modelling, whilst, amongst.

  9.  **Final Review against constraints:**
      *   Concrete course of action? Yes (Conditional Adoption).
      *   Time frame? Yes (12 months).
      *   Engage losing side? Yes (Address the 'cherry-picking' risk).
      *   Explain concept without softening? Yes.
      *   British English? Yes.

      *(Final thought on the "Personal Experience"):* The prompt says "That experience has left me preoccupied... and it is why the chair has asked me..." It might be powerful to briefly reference the *principle* learned from recent events without oversharing. I will frame it around "recent reflections on the quality of consent."

      *Actually, better to keep it strictly professional.* The weight of the argument should stand on clinical governance, not personal history, even if personal history drove the writer. I will focus on the *ethical obligation* regarding uncertainty.

      *Wait, one more check:* "Engage seriously with the strongest consideration on the losing side rather than merely restating the majority position." This means if I argue for adoption, I must spend significant time validating the rejectionists' fear that this makes decision-making harder/more biased, and explain *why* my conditions solve that better than the status quo.

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Risk Committee
  **FROM:** [Your Name/Title]
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation Regarding the Imprecise Probability Prognostic Model for Advanced Cardiac Failure

  **1. Purpose**
  This memo outlines my recommendation regarding the proposed routine adoption of the new prognostic model for high-risk surgical intervention in advanced cardiac failure. Having reviewed the developers' documentation and the competing arguments within this committee, I recommend that we **authorise the use of the model on a conditional basis**, subject to specific documentation protocols and a formal review after 12 months.

  **2. The Nature of the Model**
  To evaluate this proposal, we must be clear about what the model does. Standard prognostic tools return a *point estimate* (e.g., "a 65% chance of survival"). This new model, utilising imprecise probability, returns an *interval* (e.g., "between 45% and 75%").

  This is not merely a confidence interval or a margin of error around a single truth. It is an admission that the available evidence and structural assumptions are insufficient to justify a single number. The interval represents the set of all probability assignments that are compatible with what we currently know. In cases where evidence is sparse or conflicting, the interval widens. In effect, the model quantifies our ignorance alongside our knowledge.

  **3. The Case for Adoption**
  The primary ethical imperative here is the validity of informed consent. When we present a single survival figure derived from weak evidence, we present false precision. We invite patients to consent to a risk profile that does not exist in reality. Recent reflections on our consent processes suggest that hiding uncertainty behind a determinate figure may expose the Trust to significant ethical risk, even if it makes the conversation easier. Adopting this model aligns our communication with the actual epistemic state of the medical evidence.

  **4. Addressing the Opposition**
  The faction arguing against adoption raises a formidable objection that we cannot dismiss with platitudes about transparency. They argue that clinical action requires a determinate expected value. To operate, a surgeon must weigh the benefit against the harm; an interval does not yield a clear calculation. If the survival chance is between 10% and 90%, is the surgery rational? The model does not say.

  Furthermore, there is a serious risk of *motivated reasoning*. If a clinician favours surgery, they may anchor on the upper bound of the interval; if they are risk-averse, they may anchor on the lower. In this scenario, the interval becomes a rhetorical tool to justify a decision reached on other grounds, rendering the process less transparent than the status quo. This is not a theoretical concern; it is a predictable human response to ambiguity.

  However, rejecting the model because it complicates decision-making preserves a greater harm: the illusion of certainty. The opposition's preference for a single number prioritises administrative convenience over epistemic honesty. We should not provide patients with a precise lie when we can offer them an honest range. The difficulty clinicians feel in using this model is not a bug; it is the accurate sensation of grappling with genuine uncertainty, a burden that currently remains hidden from the patient.

  **5. Recommended Conditions**
  To mitigate the risk of motivated reasoning and decision paralysis, adoption must be conditional on the following:

  *   **Decision Thresholds:** We will not use the model to dictate eligibility. Instead, Clinical Governance will establish 'action thresholds'. For example, if the *lower bound* of the interval falls below a specific survival probability, the intervention is contraindicated regardless of the upper bound. This prevents cherry-picking the optimistic figure in high-risk cases.
  *   **Documentation:** Clinicians must record which end of the interval was utilised in the decision-making discussion and the rationale for doing so. This creates an audit trail to detect systematic bias.
  *   **Training:** Mandatory briefing for all participating consultants on interpreting imprecise probability, specifically focusing on how to communicate intervals to patients without inducing undue anxiety or false hope.

  **6. Review Timeline**
  This authorisation shall be provisional for a period of **12 months**. At the conclusion of this period, the Committee will review:
  1.  Audit data regarding whether the intervals influenced treatment allocation differently than historical point estimates.
  2.  Feedback from clinicians regarding decision paralysis.
  3.  Patient comprehension scores regarding risk communication.

  **7. Conclusion**
  We are asking our clinicians to navigate ambiguity without a compass, but we owe our patients the truth about the map. I urge the committee to adopt this model conditionally. It forces us to confront the limits of our knowledge rather than concealing them behind a single, comforting, and potentially misleading digit.

