answer: |-
  # Desiderata for a Theory of Rescue Choice

  To be defensible, a theory of rescue must navigate the tension between individual claims and collective outcomes. The following list specifies the requirements such a theory must meet, categorized by the cases it must handle, the distinctions it must respect, and the moral constraints it must satisfy.

  ## I. Case Coverage Requirements
  *A defensible theory must yield determinate, intuitive verdicts in the following scenarios.*

  1.  **The Standard Numbers Case (1 vs. 5 Strangers)**
      *   **Requirement:** The theory must explain why (or why not) the rescuer should save the five rather than the one.
      *   **Motivation:** This is the foundational puzzle. A theory that cannot adjudicate the basic conflict between quantity of lives is incomplete.
      *   **Status:** *Non-negotiable.* (Though the verdict itself is contested, the theory must address it).

  2.  **The Special Obligations Case (1 Spouse vs. 5 Strangers)**
      *   **Requirement:** The theory must account for agent-relative permissions to prioritize loved ones without collapsing into total partiality.
      *   **Motivation:** Most agents intuitively feel permitted (or obligated) to save a spouse over five strangers. A theory demanding strict impartiality conflicts with deep moral intuitions about relationships.
      *   **Status:** *Non-negotiable* (must accommodate some partiality).

  3.  **The Claim Strength Case (1 Urgent vs. 5 Minor)**
      *   **Requirement:** The theory must handle conflicts where the one faces death and the five face broken arms (or vice versa).
      *   **Motivation:** Numbers are not the only variable; the magnitude of the harm matters. A theory sensitive only to headcounts fails here.
      *   **Status:** *Non-negotiable.*

  4.  **The Exact Tie Case (1 vs. 1)**
      *   **Requirement:** In cases of identical claims, the theory must prescribe a fair procedure (typically a lottery).
      *   **Motivation:** Choosing one over the other without a randomizing mechanism treats the loser as a mere means or violates equal respect.
      *   **Status:** *Non-negotiable.*

  5.  **The Probabilistic Rescue Case**
      *   **Requirement:** The theory must adjudicate between saving one person with 100% certainty versus five people with a 50% chance (expected value 2.5).
      *   **Motivation:** Real-world rescues involve risk. A theory that works only for certainty is practically useless.
      *   **Status:** *Camp-specific commitment* (some theories struggle to integrate probability without collapsing into expected utility maximization).

  6.  **The Unequal Stakes Case (1 Life vs. 5 Limbs)**
      *   **Requirement:** The theory must determine if there is a threshold where a lesser harm to many cannot outweigh a greater harm to one.
      *   **Motivation:** Prevents the "tyranny of the majority" where trivial aggregate gains justify catastrophic loss to an individual.
      *   **Status:** *Non-negotiable* (for non-utilitarian theories).

  ## II. Conceptual Distinction Requirements
  *A defensible theory must employ the correct conceptual machinery.*

  7.  **Intra-Life vs. Inter-Life Aggregation**
      *   **Requirement:** The theory must distinguish between summing benefits for one person over time versus summing benefits across different people.
      *   **Motivation:** It is uncontroversial to sacrifice a present pain for a future gain within one life. It is controversial to sacrifice one person for the gain of others.
      *   **Status:** *Non-negotiable.*

  8.  **Numbers as Tiebreaker vs. Independent Reason**
      *   **Requirement:** The theory must specify whether numbers matter only when claims are equal (tiebreaker) or whether they generate a reason independently of claim strength.
      *   **Motivation:** Taurek argues numbers are morally irrelevant; Aggregationists argue they are decisive. The theory must take a stand.
      *   **Status:** *Camp-specific commitment.*

  9.  **Saving the Greater Number vs. Maximizing Aggregate Well-Being**
      *   **Requirement:** The theory must distinguish between counting heads and summing welfare units (e.g., quality-adjusted life years).
      *   **Motivation:** Saving five children might be preferred to saving five elderly people on a "number" view, but not on a "welfare" view.
      *   **Status:** *Camp-specific commitment.*

  10. **Numbers *As Such* vs. Outweighing Claims**
      *   **Requirement:** The theory must explain *why* the five are saved: is it because the group's claim outweighs the one, or because the one's claim is not violated if we save the five?
      *   **Motivation:** This distinguishes between a "greater good" justification and an "individual complaint" justification.
      *   **Status:** *Non-negotiable* (The theory must offer an account, even if the account is contested).

  ## III. Moral Constraint Requirements
  *A defensible theory must not violate fundamental moral boundaries.*

  11. **The Separateness of Persons**
      *   **Requirement:** The theory must not treat society as a super-person whose losses and gains can be netted out across individuals.
      *   **Motivation:** Rawls/Nozick objection to Utilitarianism. Individuals are distinct moral units; sacrificing one for the net benefit of others fails to respect their distinctness.
      *   **Status:** *Non-negotiable.*

  12. **The Fairness Constraint (Lottery in Ties)**
      *   **Requirement:** Where claims are equal and cannot all be satisfied, each must have an equal ex-ante chance of being saved.
      *   **Motivation:** Equal respect requires that no individual is arbitrarily selected for loss when claims are identical.
      *   **Status:** *Non-negotiable.*

  13. **The Individual Justification Constraint**
      *   **Requirement:** The choice must be justifiable to the person who is not saved.
      *   **Motivation:** If the one person can reasonably reject the principle used to save the five, the action is illegitimate (Scanlonian constraint).
      *   **Status:** *Camp-specific commitment* (Contractualist).

  ---

  ## IV. Incompatibilities and Tensions
  *The following subsets of desiderata are suspected to be logically or practically inconsistent when held together.*

  1.  **Pairwise Comparison + Transitivity + Save the Five**
      *   **Conflict:** If we compare claims pairwise (1 vs 1, then add a person), we may generate cycles (intransitivity) that prevent a clear verdict to save the five. A theory that insists on pairwise individual comparison (to respect Separateness) often fails Transitivity.
      *   **Location:** Primarily affects Contractualist/Scanlonian views.

  2.  **Full Respect for Individual Claim + Always Save the Five**
      *   **Conflict:** If the one has a right not to be sacrificed, and the five have a right to be saved, satisfying the five necessarily violates the one. You cannot fully respect both claims in a zero-sum rescue.
      *   **Location:** Affects any deontological view trying to accommodate aggregation.

  3.  **Separateness of Persons + Pure Aggregation**
      *   **Conflict:** Pure aggregation (Utilitarianism) sums welfare across persons, effectively treating them as vessels for utility rather than distinct persons.
      *   **Location:** The classic Rawlsian critique of Utilitarianism.

  4.  **Fairness in Ties + Probabilistic Rescue**
      *   **Conflict:** If saving the five is only 50% likely, does a lottery with the one (100% likely) respect fairness? Maximizing expected value violates the fairness of giving the one a chance; giving the one a chance violates the expectation of saving more lives.
      *   **Location:** Affects almost all theories when risk is introduced.

  ---

  ## V. Scorecard of Main Contenders

  | Theory | Performance on Desiderata | Major Failure Point |
  | :--- | :--- | :--- |
  | **Taurek-Style (Anti-Aggregation)** | **Passes:** Separateness of Persons; Individual Justification.<br>**Fails:** Standard Numbers Case (1 vs 5); Probabilistic Rescue. | Cannot explain why we should save the five in the standard case without violating its own prohibition on comparing losses across persons. |
  | **Straightforward Aggregationist (Utilitarian)** | **Passes:** Standard Numbers Case; Probabilistic Rescue; Claim Strength.<br>**Fails:** Separateness of Persons; Unequal Stakes (Thresholds). | Violates the constraint against treating persons as mere containers for value; struggles to protect the one against the many in unequal stakes cases. |
  | **Scanlon-Style (Contractualist)** | **Passes:** Individual Justification; Separateness (mostly); Special Obligations.<br>**Fails:** Transitivity (in pairwise comparisons); Probabilistic Rescue. | The "Pairwise Comparison" method leads to intransitive cycles in complex cases, making action impossible or arbitrary. |

  ---

  ## VI. The Most Exclusionary Requirement

  The single requirement that does the most to exclude the most popular positions is **The Separateness of Persons Constraint**.

  **Reasoning:**
  The most popular pre-theoretical and theoretical position in rescue ethics is a form of **Aggregationism** (broadly Utilitarian), which holds that one should simply maximize the number of lives saved or the amount of welfare preserved. This view is intuitive, mathematically tractable, and handles the "Standard Numbers Case" and "Probabilistic Rescue" effortlessly.

  However, the **Separateness of Persons** constraint explicitly forbids the mechanism by which Aggregationism operates (summing gains and losses across distinct individuals). To satisfy this constraint, a theory must complicate the decision procedure (e.g., by introducing lotteries, thresholds, or pairwise comparisons), which often leads to failures in Transitivity or the inability to Save the Five. Therefore, insisting on the Separateness of Persons is the primary filter that rules out the simplest and most popular solution to the rescue problem.
