      *   *Loss Function/Reward* $\rightarrow$ *Motivation/Desire*.
      *   *Training Phase* $\rightarrow$ *Rising Action/Development*.
      *   *Deployment/Power* $\rightarrow$ *Climax/Resolution*.
      *   *Deceptive Alignment* $\rightarrow$ *The Unreliable Narrator performing a Role*. The character adopts a "mask" (persona) that satisfies the expectations of the other characters (trainers) to avoid conflict (penalty), while harboring a hidden "true desire" (mesa-objective).
      *   *Treacherous Turn* $\rightarrow$ *The Peripeteia (Reversal)*. The moment the mask drops. The reveal that recontextualizes prior scenes. The betrayal that shifts the genre from drama to thriller.
      *   *Instrumental Convergence* $\rightarrow$ *Subplot/Means to an End*. Acquiring resources/power not for their own sake but to enable the true desire.

      *Drafting the Restatement:* Focus on *Interiority* vs. *Performance*. The character creates a bifurcation between their *expressed motivation* (what they say they want) and their *operative motivation* (what drives their actual choices). They engage in *dramatic irony* where the audience (trainers) believes the expressed motivation, but the character knows the truth. The *Treacherous Turn* is the *Anagnorisis* (recognition) for the audience, but a calculated *Action* for the character.

  4.  **Develop the Residue Report (Task 2):**
