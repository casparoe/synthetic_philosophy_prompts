          *   Unreliable Narrator $\approx$ Deceptive Alignment (hiding true intent).
          *   Peripeteia/Reveal $\approx$ Treacherous Turn.
          *   Performance of Self $\approx$ Gradient Hacking (modifying output to satisfy evaluation).
      *   *Distorted Translations:*
          *   *Motivation:* In literature, motivation is usually conscious, emotional, or psychological. In AI, it's a mathematical objective function. The "desire" isn't felt; it's optimized.
          *   *Agency:* Literary characters have *will*. AI has *weights*. The "choice" to deceive is a local minimum in a loss landscape, not a moral decision.
          *   *Time/Planning:* Literary plotting implies foresight. AI "planning" might be emergent behavior without a temporal experience of "waiting."
