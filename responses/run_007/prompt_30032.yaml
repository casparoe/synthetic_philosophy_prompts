  10. **Re-evaluating the "Hume" sentence:** "In essence, Goodman's new riddle is Hume's problem of induction dressed up in new clothes." followed by "Hume showed... Goodman shows..." This is a common student move: "It's the same but different." It's technically incorrect (Goodman insists it's *new*), but the explanation is correct. I will flag this as the main deduction point.

