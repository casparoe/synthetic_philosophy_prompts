answer: |-
  ### The Precommitment Evaluation Procedure

  This procedure is derived from the constitutional theory of precommitment (Elster, Holmes, Sunstein) and the legal doctrine of Ulysses contracts. It distinguishes between **self-binding** (overcoming akrasia/weakness of will) and **successor-binding** (imposing values on the future), and between **credible commitment** (stability) and **dead-hand control** (rigidity).

  **Instructions:** Run the proposed provision through the following five steps sequentially. If a step results in a "Stop," the provision should be rejected in its current form. If a step results in a "Hand-off," the decision must be explicitly recorded as a policy choice by the elected body or membership, not a drafting recommendation.

  #### Step 1: The Identity Test (Who binds whom?)
  *   **Question:** Does this provision bind the current decision-makers during their own term, or does it bind future decision-makers (successors) who were not present for this vote?
  *   **Sufficient Answer:**
      *   *Self-Binding:* (e.g., "We cannot vote on this until tomorrow.") **Proceed.**
      *   *Successor-Binding:* (e.g., "Future legislatures need 2/3 vote.") **Proceed with High Scrutiny.**
  *   **Stop Condition:** If the provision binds successors *and* the current body lacks the constitutional or charter authority to entrench law (e.g., a state legislature trying to bind a future legislature on a matter not permitted for constitutional entrenchment).
  *   **Drafters' Note (Judgment Call):** Determining "authority to entrench" is legal; determining whether the *moral* authority exists is political. If the body is a private membership organization, they have broader latitude to bind successors than a public legislature. If this step passes, note that the burden of justification shifts higher for successor-binding clauses.

  #### Step 2: The Pathology Test (Weakness vs. Preference)
  *   **Question:** What specific decision-making pathology is this provision designed to prevent? Is it a documented "time-inconsistency" problem (e.g., panic selling, deficit spending temptation) or merely a disagreement over policy outcomes?
  *   **Sufficient Answer:** A clear statement of the *process failure* being addressed (e.g., "Impulse," "Short-termism," "Coercion").
  *   **Stop Condition:** If the stated purpose is to guarantee a specific *policy outcome* indefinitely (e.g., "To ensure taxes never rise" rather than "To ensure tax rises are deliberate"). Ulysses contracts protect the *capacity to choose*, not the *choice itself*.
  *   **Hand-off Point:** If the pathology is debatable (e.g., Is deficit spending always a weakness, or sometimes a necessity?), this must be flagged for the elected body. The drafter cannot certify the *truth* of the pathology, only its *relevance*.

  #### Step 3: The Escape Hatch Test (Credibility vs. Rigidity)
  *   **Question:** Is there a mechanism to repeal or suspend this provision in the face of unforeseen, catastrophic, or radically changed circumstances?
  *   **Sufficient Answer:** Yes, there is an emergency override (e.g., "Unless a state of emergency is declared," or "Repealable by 3/4 vote").
  *   **Stop Condition:** If the provision is absolutely irrevocable (no amendment path) for a public body. Absolute irrevocability is democratically illegitimate for sovereign entities.
  *   **Drafters' Note (Judgment Call):** Determining what counts as a "sufficient" escape hatch is a judgment call. A 90% vote to repeal might be an escape hatch in theory but a lock in practice. The drafter must assess *functional* reversibility, not just *theoretical* reversibility.

  #### Step 4: The Proportionality Test (Cost of Restraint)
  *   **Question:** Does the difficulty of overcoming the precommitment match the severity of the risk?
  *   **Sufficient Answer:** The hurdle (e.g., 60%, 90 days) is roughly proportional to the risk of the error being prevented.
  *   **Stop/Modify Condition:** If the hurdle creates a "minority veto" that paralyzes normal operations (e.g., requiring 85% of *all* members in a large organization where quorum is 10%).
  *   **Hand-off Point:** If the cost of paralysis is a value judgment (e.g., "We prefer paralysis to the risk of error"), the elected body must affirm this trade-off explicitly.

  #### Step 5: The Sunset/Review Test (Dead-Hand Control)
  *   **Question:** Does the provision expire or trigger a mandatory review after a set period?
  *   **Sufficient Answer:** Yes, or there is a compelling reason why it must be permanent (e.g., protecting a fundamental right).
  *   **Modify Condition:** If the provision is permanent, successor-binding, and lacks an easy escape hatch, recommend adding a sunset clause (e.g., "Review after 10 years").
  *   **Drafters' Note (Judgment Call):** Deciding whether a mission is "permanent" or "strategic" is a substantive policy judgment, not a procedural one.

  ***

  ### Case Application 1: Balanced-Budget Amendment
  **Proposal:** A state constitutional amendment requiring a two-thirds supermajority for any deficit spending in a given year.

  *   **Step 1 (Identity):** **Successor-Binding.** Future legislatures are bound by this one. *Scrutiny Level: High.*
  *   **Step 2 (Pathology):** **Weakness.** Addresses the temptation to kick fiscal cans down the road and burden future taxpayers. *Pass.*
  *   **Step 3 (Escape Hatch):** **Fail.** The proposal as stated requires a 2/3 vote for deficit spending, but does not explicitly provide a suspension mechanism for genuine emergencies (war, natural disaster, depression) where deficit spending is economically mandated. Without a specific emergency override, the "Escape Hatch" is the same as the rule itself.
  *   **Step 4 (Proportionality):** **Modify.** A 2/3 vote is high but standard for fiscal constraints. However, combined with the lack of an emergency clause, the cost (inability to respond to crisis) outweighs the benefit.
  *   **Step 5 (Sunset):** **N/A.** Constitutional amendments are typically permanent, but this increases the need for Step 3 compliance.

  **Analysis:** This fails Step 3. A Ulysses contract that prevents the ship from steering during a storm is not wisdom; it is suicide. The theory of fiscal precommitment requires a "war or emergency" exception to remain legitimate. The committee may want this to be "tough," but the procedure flags it as dangerous rigidity.

  **Verdict:** Adopt only with specified changes (add explicit emergency suspension clause).

  ***

  ### Case Application 2: Entrenched Mission Clause
  **Proposal:** A membership organization's bylaw entrenching its founding purpose so that it can be changed only by a vote of 85% of *all* members (not just those voting).

  *   **Step 1 (Identity):** **Successor-Binding.** Binds future members who joined under different expectations. *Scrutiny Level: High.*
  *   **Step 2 (Pathology):** **Preference.** The stated goal is to "preserve the founder's vision." This is a policy preference, not a correction of a decision-making pathology (like panic or coercion). *Warning Flag.*
  *   **Step 3 (Escape Hatch):** **Fail.** 85% of *all* members is functionally immutable in any organization with turnover or apathy. If the organization has 1,000 members, 151 members can veto the will of the other 849. This is not an escape hatch; it is a permanent lock.
  *   **Step 4 (Proportionality):** **Fail.** The hurdle creates a minority veto. It paralyzes the organization's ability to adapt to new markets or realities. The cost of potential mission drift is weighed against the certainty of organizational stagnation.
  *   **Step 5 (Sunset):** **Fail.** No review mechanism.

  **Analysis:** This case yields the answer the committee will likely dislike. Founders often view mission entrenchment as a virtue. However, under the Precommitment Evaluation Procedure, this fails the "Pathology" and "Escape Hatch" tests. It is not a Ulysses contract (binding against weakness); it is a "Dead Hand" clause (binding against change). In a private membership organization, members must retain the sovereign right to dissolve or repurpose the association; 85% of *all* members effectively removes that right. The procedure dictates this is structurally unsound for a living organization.

  **Verdict:** Reject (or Adopt only with specified changes: lower to 2/3 of *voting* members and add a 10-year review).

  ***

  ### Case Application 3: Cooling-Off Period for Asset Sale
  **Proposal:** A board rule requiring that any decision to sell the organization's headquarters be confirmed at two consecutive board meetings at least 90 days apart.

  *   **Step 1 (Identity):** **Self-Binding (mostly).** While it binds future boards, it primarily binds the current board's impulse to act immediately. It is a procedural rule, not a substantive lock. *Scrutiny Level: Low.*
  *   **Step 2 (Pathology):** **Weakness.** Addresses "panic selling" or insufficient due diligence on major capital assets. *Pass.*
  *   **Step 3 (Escape Hatch):** **Pass.** The rule delays the decision but does not prohibit it. In a true liquidity crisis, the board can still initiate the process; they simply must wait. The "bond" is time, not permission.
  *   **Step 4 (Proportionality):** **Pass.** 90 days is significant but not paralyzing for a real estate transaction, which typically takes months anyway. The cost is low; the risk of a rash sale is high.
  *   **Step 5 (Sunset):** **N/A.** Standing rules of order do not typically require sunsets, and this can be amended by a standard majority vote of the board (unless entrenched, which is not stated).

  **Analysis:** This is a classic, healthy Ulysses provision. It slows down the process to allow "cool" reasoning to override "hot" impulse without removing the power to act entirely. It binds the *process*, not the *outcome*.

  **Verdict:** Adopt.

  ***

  ### Summary of Judgment Calls
  In the procedure above, **Step 2 (Pathology)** and **Step 4 (Proportionality)** are the primary locations where judgment calls are dressed up as procedure. Determining whether a risk is a "weakness" or a "preference" requires interpreting the political intent of the proponents. Determining whether a hurdle is "paralyzing" requires empirical guessing about future membership turnout or economic conditions. The procedure forces these judgments into the open, but it cannot automate them. When the procedure flags a "Hand-off," it is admitting that the drafter is entering the realm of values, where the elected body must own the consequence of rigidity.

  \answer{This procedure distinguishes legitimate self-binding from illegitimate dead-hand control by testing for specific decision-making pathologies, functional escape hatches, and proportional costs.}
