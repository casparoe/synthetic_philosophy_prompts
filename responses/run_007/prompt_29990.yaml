      *   **Underlying Philosophical Themes:** Philosophy of Technology, Political Philosophy, Urban Design, Ethics of Artifacts.
      *   **Key Thinkers/Concepts to Recall:** Langdon Winner ("Do Artifacts Have Politics?"), Don Ihde (Postphenomenology), Bruno Latour (Actor-Network Theory), Foucault (Discipline/Power), "Hostile Architecture."

