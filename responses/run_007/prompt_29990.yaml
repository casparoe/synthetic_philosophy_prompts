answer: |-
  You have hit on one of the classic problems in the philosophy of technology and urban politics. What you are describing is often called **"hostile architecture"** or **"defensive design,"** but your questions go deeper than the sociology of it—you are asking about the ontology of objects and their relationship to power.

  To answer you directly: The city's position is almost certainly **inconsistent**, and the bench is **not neutral**.

  Here is a breakdown of the philosophical commitments at play, using the framework of thinkers like Langdon Winner, Don Ihde, and Bruno Latour, to help you articulate what is happening.

  ### 1. The Neutrality Claim vs. The Scripted Object
  The city claims the plaza is "neutral shared space." In philosophy of technology, this is the **Instrumentalist View**: technology (and design) is merely a tool, neutral until a human picks it up and uses it for good or bad.

  However, a bench with a center armrest is not a neutral tool. It is what design theorists call a **scripted object**. Before anyone sits on it, the bench has already "voted."
  *   It votes for sitting.
  *   It votes against lying down.
  *   It votes for short-term rest (transit) over long-term dwelling (rest).

  If the bench were truly neutral, it would be a flat plane. By shaping the physical environment to allow *Action A* (sitting) and physically prevent *Action B* (sleeping), the object itself is enforcing a rule. As the political theorist **Langdon Winner** famously asked in his 1980 essay *"Do Artifacts Have Politics?"*: If a bridge is built too low for public buses to pass under it, is that a technical necessity or a political decision to keep low-income riders out of a certain neighborhood? (In that famous case, it was the latter).

  Your city is presupposing that **politics only happens in laws and speeches, not in concrete and steel.** They are trying to move a political decision (we do not want homeless people sleeping here) into the realm of "technical design" (this is for ergonomics/pigeons) to make it immune to debate. You can vote to remove a law; you cannot vote to remove a welded armrest.

  ### 2. "Values Built-In" vs. "Uses Made Easier"
  You asked: *"Whether the bench has values built into it, or just makes some uses easier and some harder, and whether those are different claims."*

  This is a crucial distinction.
  *   **Claim A:** The bench just makes uses easier/harder (Affordance).
  *   **Claim B:** The bench has values built into it (Moral/Political Agency).

  In practice, **Claim A inevitably becomes Claim B.**
  To make a use "harder" is to express a preference against that use. If you design a staircase that is too steep for a wheelchair, you haven't just "made walking easier and rolling harder"; you have valued the walker over the roller. You have embedded a hierarchy of bodies into the architecture.

  Therefore, the bench **does have values built into it.** It values:
  1.  **Order over Comfort:** It prioritizes the visual aesthetic of an empty ledge over the physical need of a tired body.
  2.  **Transit over Presence:** It assumes the user is passing through, not inhabiting the space.
  3.  **Exclusion over Inclusion:** It defines "everybody" as "everybody except those who need to lie down."

  If you accept that making some uses harder is a way of enforcing values, then the "neutral tool" argument collapses. The design *is* the policy.

  ### 3. Can "Technology as Tool" and "Design is Political" coexist?
  You asked if saying the design is political means the "technology-is-just-a-tool" way of talking has to go.

  **Yes, in this context, they cannot both be true.**
  *   If the bench is **just a tool**, then its effects are solely determined by the user. But the armrest determines the effect *before* the user arrives.
  *   If the design is **political**, then the object itself is an agent of power. It is doing the work of a security guard or a law, but without the ability to be questioned.

  The city wants to have it both ways. They want the **power** of the political design (exclusion) without the **responsibility** of the political admission (acknowledging they are targeting homeless people). They use the "tool" narrative as a shield. When criticized, they say, "It's just a bench/tool for sitting." When praised for cleanliness, they imply, "Our design successfully managed behavior."

  This is what philosophers call **depoliticization**. It is the act of taking a contested political issue (how we treat the homeless in public space) and disguising it as a technical management issue (pest control and ergonomics).

  ### 4. What Picture of Objects and Politics is the City Presupposing?
  The city is operating on a **Liberal-Technocratic** model of space.
  *   **The Liberal part:** They claim the space is "public" and "open to all."
  *   **The Technocratic part:** They believe social problems can be solved through engineering rather than social policy.

  **The Inconsistency:**
  The inconsistency lies in the definition of "Public."
  *   **Definition 1 (Rhetorical):** Public means "accessible to every citizen regardless of status."
  *   **Definition 2 (Material):** Public means "accessible to every citizen who conforms to specific behavioral norms."

  By installing hostile architecture, the city reveals that Definition 2 is the real one, while continuing to speak using Definition 1. This creates a **performative contradiction**. They say "All are welcome," but the concrete says "Only some are welcome."

  ### 5. Summary: What is the bench doing?
  To use the language of **Actor-Network Theory (Bruno Latour)**: The bench is a "moral delegate."
  The city has a moral command: *"Do not let homeless people sleep here."*
  Instead of hiring a human to enforce this (which is expensive, visible, and contestable), they delegate that command to the metal armrest. The armrest now acts as a silent policeman.

  *   **Is it neutral?** No. It is an encoded instruction.
  *   **Does it have values?** Yes. It values exclusion and order.
  *   **Is the city consistent?** No. They are claiming universal access while engineering specific exclusion.

  **The Verdict:**
  You are right to feel that the "practical design" explanation is insufficient. While it may be *true* that armrests help older people stand (a positive affordance), that does not negate the *political function* of preventing sleep (a negative constraint). In philosophy, we call this **overdetermination**: the object has multiple causes, but ignoring the political cause in favor of the technical one is a choice the city is making to avoid accountability.

  The bench is not waiting for you to give it meaning. It has already spoken. It says: *"You may rest, but you may not stay."* Acknowledging that doesn't mean we can't use benches, but it does mean we have to admit that our built environment is legislating behavior, and we should be allowed to debate that legislation.
