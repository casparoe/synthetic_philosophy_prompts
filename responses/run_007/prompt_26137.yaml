prompt: |-
  Compare Mencius and Xunzi on human nature. I know the basic contrast — Mencius says it's good, Xunzi says it's bad — but I want to get past that. Specifically, they seem to mean different things by "nature" (xing): Mencius focuses on characteristic human inclinations like the sprouts of compassion and shame, while Xunzi focuses on raw inborn desires and impulses. Take a committed position: once you control for this difference in what they mean by xing, is there still a genuine substantive disagreement between them, or does it all collapse into a verbal dispute? Defend your answer.
reasoning: |-
