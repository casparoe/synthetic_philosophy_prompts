  1.  **Analyze the Request:**
      *   **Topic:** Compare Mencius and Xunzi on human nature (*xing*).
      *   **Common Knowledge:** Acknowledge the basic "good vs. bad" contrast.
      *   **Specific Focus:** Move beyond the surface level. Address the definitional difference of *xing* (Mencius = moral sprouts/potential; Xunzi = raw desires/impulses).
      *   **Task:** Take a *committed position*. Is there a genuine substantive disagreement, or is it merely a verbal dispute (terminological difference)?
      *   **Requirement:** Defend the answer.

