answer: |-
  This is one of the most enduring debates in the history of philosophy. The standard introductory summary—Mencius says nature is good, Xunzi says nature is bad—is indeed misleadingly simplistic. As you noted, they operate with divergent definitions of *xing* (nature). Mencius defines *xing* teleologically (what distinguishes humans and what we are meant to become), while Xunzi defines it descriptively (what we are born with prior to conscious activity).

  However, to claim that this reduces their conflict to a mere verbal dispute is a philosophical error. It assumes that if two philosophers define a term differently, they cannot disagree about the world.

  **My position is this:** While the definitional divergence is real, it does **not** render the disagreement merely verbal. There is a profound, substantive disagreement between Mencius and Xunzi regarding the **ontology of moral value** and the **mechanics of self-cultivation**. Mencius is a moral realist who believes value is discovered within; Xunzi is a moral constructivist who believes value is imposed from without. Once you control for the definition of *xing*, you are left with two incompatible visions of how human beings relate to the moral order.

  Here is the defense of that position.

  ### 1. The Definitional Gap is Real, But Not Exhaustive
  It is true that Mencius and Xunzi are looking at different psychological data.
  *   **Mencius** argues that if you define *xing* as that which separates humans from beasts, then *xing* is good. He points to the "four sprouts" (e.g., the instinctive alarm one feels seeing a child about to fall into a well). For Mencius, *xing* includes our moral potentialities.
  *   **Xunzi** argues that *xing* is "what is so by itself, not dependent on effort." This includes hunger, thirst, sexual desire, and envy. Since following these impulses leads to conflict and scarcity, *xing* is "bad."

  If the debate ended at "what counts as nature," it would be semantic. But it doesn't. The definition of *xing* drives their respective accounts of where morality comes from.

  ### 2. The Ontology of Value: Discovery vs. Construction
  The substantive core of the disagreement lies in the source of moral authority.

  **Mencius holds that morality is internal and discovered.**
  For Mencius, the moral order (the *Dao*) is continuous with human nature. When we act morally, we are aligning with our deepest selves. The Sage is not someone who created a new system; the Sage is someone who fully realized the potential inherent in everyone. Moral value exists in the cosmos and is reflected in the human heart. To be moral is to be *authentic*.

  **Xunzi holds that morality is external and constructed.**
  For Xunzi, the universe is indifferent. Nature (*xing*) produces chaos. Order (*zhi*) is produced by the conscious activity (*wei*) of the ancient Sage Kings. They invented ritual (*li*) and righteousness (*yi*) specifically to curb and channel human desires, much like a potter shapes clay or a carpenter straightens warped wood. Moral value is a human artifact. To be moral is to be *cultivated* against one's initial grain.

  This is not a verbal dispute; it is a metaphysical clash.
  *   If Mencius is right, morality is a form of **self-expression**.
  *   If Xunzi is right, morality is a form of **self-constraint**.

  ### 3. The Mechanics of Cultivation: Agriculture vs. Craftsmanship
  This ontological difference leads to divergent practical philosophies regarding education and politics.

  Mencius uses agricultural metaphors. You "nourish" the sprouts. You remove obstacles (like a woodcutter hacking at the Ox Mountain). The effort required is to *protect* and *extend* what is already there. If you fail to be moral, it is because you have "lost" your heart or neglected it. The trajectory of growth is natural; failure is an interruption.

  Xunzi uses craft metaphors. You "straighten" the wood with a press frame. You "sharpen" metal on a grindstone. The effort required is to *transform* and *remake* the self. If you fail to be moral, it is because you lacked a teacher or failed to apply effort. The trajectory of nature is toward disorder; success is an artificial achievement.

  This has substantive political implications. A Mencian government seeks to create conditions where people's innate goodness can flourish (light taxes, benevolent rule). A Xunzian government emphasizes the importance of strict teachers, clear rituals, and social hierarchy to keep innate desires in check. One trusts the populace's latent capacity; the other trusts the Sage's external framework.

  ### 4. Why the "Verbal Dispute" Theory Fails
  Proponents of the "verbal dispute" theory argue that both men agree on the necessity of moral cultivation, so the "good vs. bad" label is irrelevant.

  This argument fails because it ignores the **direction of fit**.
  *   For Mencius, the mind fits the world. Our moral intuitions track objective moral truths.
  *   For Xunzi, the world (society) must be fitted to the mind (through ritual). Moral truths are created to solve the problem of scarcity and conflict.

  If you tell a Mencian, "Morality is just a social construct to curb desire," they would say you are denying the reality of your own heart. If you tell a Xunzian, "Morality is just following your natural impulses," they would say you are inviting social collapse. They are not just using the word "nature" differently; they are making incompatible claims about the relationship between human psychology and social order.

  ### Conclusion
  Mencius and Xunzi do define *xing* differently, but that difference is the *engine* of their disagreement, not a barrier to it.

  If we control for the definition of *xing*, we find that Mencius believes moral value is **immanent** (inherent in the structure of life), while Xunzi believes moral value is **transcendent** (imposed upon life by conscious human agency). One views the moral life as a homecoming; the other views it as a conquest. That is not a verbal dispute. It is a fundamental disagreement about what it means to be human and where the good comes from.
