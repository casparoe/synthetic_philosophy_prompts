      *   *Nuanced View (A.C. Graham, Donald Munro, etc.):* They define *xing* differently. Mencius looks at what distinguishes humans from animals (moral potential). Xunzi looks at what humans are born with before learning (biological drives).
      *   *The "Verbal Dispute" Hypothesis:* If they are talking about different things, maybe they agree on the *process* (cultivation is needed) but disagree on the *label*.
      *   *The "Substantive Dispute" Hypothesis:* Even if definitions differ, their views on *how* morality arises, the role of effort, the source of value, and the metaphysical grounding of ethics differ significantly.

  3.  **Formulating a Position:**
