answer: |-
  There is no single, canonical term in political science that perfectly encapsulates this specific *logical loop* regarding sortition, though it is a well-recognized phenomenon in critical governance studies.

  However, there are existing concepts that describe pieces of it, and I can offer you a specific term that synthesizes them for your novel.

  ### The Existing Academic Vocabulary

  If your characters are political scientists or wonks, they might refer to this using one of these three terms:

  1.  **Participatory Co-optation:** This is the closest academic term. It describes when an institution absorbs a challenging idea (like citizen power) into a safe, controlled format (an advisory board) to neutralize the threat it poses to the existing power structure. The radical demand is "co-opted" into a harmless procedure.
  2.  **Depoliticization:** This refers to the process of taking a political question (Who should rule?) and turning it into a technical or administrative one (How do we run this pilot?). By making it a "test," you remove the ideological stakes.
  3.  **The Permanent Pilot:** Borrowed from public administration and tech, this describes projects that are kept in a perpetual beta state. They are never "launched" fully because launching them would require committing resources or power that the institution wants to withhold.

  ### Why It Isn't the Other Things

  To help your characters articulate why this is frustratingly unique, here is how you distinguish it from the concepts you mentioned:

  *   **Vs. Regulatory Capture:** Capture is when an external interest group (like an industry) takes control of a regulator. This dynamic is the *reverse*: The existing institution is creating a *new* body specifically to absorb and defuse external pressure. It is defensive, not offensive.
  *   **Vs. The Overton Window:** The Overton Window is about what ideas are culturally acceptable. In your scenario, the idea *is* acceptable (they agreed to the pilot!). The trap isn't about *acceptability*; it's about *implementation*.
  *   **Vs. Foot-Dragging:** Foot-dragging is passive delay ("We'll look into it next year"). This dynamic is active and performative. They *are* doing something. They are holding hearings, publishing reports, and spending money. The activity itself is the weapon used to justify inaction.

  ### A New Term for Your Novel

  Since you are writing fiction, you have the license to coin a term that captures the *emotional* and *logical* reality of the trap.

  I propose calling this: **"The Advisory Ceiling."**

  **Why it works:**
  *   **Visual:** Like a "glass ceiling," it implies a barrier that is invisible but solid. The assembly can rise, but only to a certain height (advisory status) before they hit the limit.
  *   **Structural:** It suggests the limit isn't an accident; it's part of the architecture.
  *   **The Logic:** It encapsulates the double-bind you described.
      *   *If they hit the ceiling gently (success):* "See, you fit perfectly under the ceiling. No need to raise it."
      *   *If they crash into the ceiling (failure):* "See, you can't fly higher. The ceiling is for your own safety."

  **Alternative Option: "The Containment Pilot"**
  If you want something that sounds more cynical/conspiratorial, use this. It implies the pilot was never intended to test *viability*, but to test *containment*. The goal of the pilot is to prove the system can safely absorb the demand for change without actually changing.

  ### How to Describe the Dynamic in-World

  Here is a snippet of how a character might explain this distinction in your novel, using the term **The Advisory Ceiling**:

  > "It's not foot-dragging. Dragging implies they don't want to move. They *are* moving. They built us a whole assembly, gave us staff, gave us a budget. But they built it in a basement with no doors.
  >
  > "It's the **Advisory Ceiling**. If we produce garbage, they say sortition is incompetent. If we produce gold, they say, 'Wonderful work, keep advising us.' Success is used as proof that we don't need power, and failure is used as proof that we can't handle it. It's a rigged validation. They aren't testing our ability to govern; they're testing our willingness to stay in the box."

  ### Summary for Your Research Notes
  *   **Real-world concept:** Participatory Co-optation / Depoliticization.
  *   **Logical structure:** A Double Bind (Heads I win, Tails you lose).
  *   **Proposed Term:** The Advisory Ceiling.
  *   **Key Distinction:** It uses *activity* to justify *inaction*, whereas foot-dragging uses *inactivity* to justify *inaction*.

  This dynamic is a fantastic source of conflict for a political novel because it pits idealists against a system that is smart enough to mimic reform without actually undergoing it. Good luck with the book!
