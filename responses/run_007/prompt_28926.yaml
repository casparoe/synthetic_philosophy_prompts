  Based on the pattern of your friend's rulings, here is an analysis of her implicit species concept, her likely verdict on the lizards, and how to test the limits of her rule.

  ### 1. The Diagnosis: She is a "Lineage Splitter" (PSC/ESC)
  Your friend has explicitly rejected the **Biological Species Concept (BSC)**. The BSC defines species by reproductive isolation. She ignores reproductive isolation in bears, humans, and salamanders, and the BSC cannot apply to fossils or asexual organisms.

  Instead, her rulings align with a mix of the **Phylogenetic Species Concept (PSC)** and the **Evolutionary Species Concept (ESC)**.
  *   **The Core Rule:** A species is a **diagnosably distinct evolutionary lineage**.
  *   **Key Evidence:**
      *   **Hybridization doesn't matter:** (Bears, Humans, Ensatina). She prioritizes *distinct identity* over *reproductive purity*.
      *   **Time counts as separation:** (Fossils). She accepts **chronospecies**, meaning she views species as segments of a lineage through time, not just branching points.
      *   **Arbitrariness is acceptable:** She admits fossil boundaries are arbitrary. This suggests she values **diagnosability** (can we tell them apart?) over strict ontological reality (are they truly separate fates?).

  ### 2. The Prediction: Multiple Species
  **Verdict:** She will almost certainly rule that the clonal lizard complex consists of **multiple species**.

  **Reasoning:**
  *   **Diagnosability:** You stated the clusters are "genetically and morphologically distinct." This satisfies her requirement for distinct identity (just like lions vs. tigers).
  *   **Lineage:** Even without sex, the clones represent separate evolutionary lineages (mutational trajectories) that do not merge. This satisfies her lineage criterion (just like the fossil splits).
  *   **Precedent:** She already accepts splitting lineages that exchange genes (bears/humans); she will have no trouble splitting lineages that exchange *no* genes but look different.

  ### 3. Candidate Rules and Divergence
  While her verdict is clear, the *justification* could rest on two slightly different concepts that fit her history but might diverge on edge cases.

  **Candidate A: The Phylogenetic/Diagnosability Concept (PSC)**
  *   **Rule:** If a group is diagnosably distinct (unique traits/genotypes), it is a species.
  *   **Fit:** Explains the "arbitrary" fossil splits (if morphology shifts, you split) and the hybridizing bears (if they remain distinct clusters, they are species).
  *   **Lizard Verdict:** **Split.** (They are distinct clusters).

  **Candidate B: The Evolutionary Species Concept (ESC)**
  *   **Rule:** A species is a lineage with a **separate evolutionary fate** and identity.
  *   **Fit:** Explains the bears/humans (separate niches/fates despite gene flow) and fossils (lineage segments).
  *   **Lizard Verdict:** **Split.** (Distinct clusters imply separate trajectories).

  **Where they *could* diverge on the lizards:**
  If the "distinct clusters" are **transient**.
  *   **PSC:** If they are diagnosably distinct *now*, they are species.
  *   **ESC:** If one cluster is a temporary variant destined to be absorbed or go extinct immediately (no "separate fate"), an ESC adherent might lump them.
  *   *However*, given your friend admits fossil boundaries are *arbitrary*, she leans heavily toward **Candidate A (PSC/Diagnosability)**. She cares more about *distinctness* than *long-term fate*.

  ### 4. The Tie-Breaker Case
  To distinguish whether she is a strict **Diagnosability Splitter (PSC)** or a **Fate-Based Lineage Splitter (ESC)**, present her with a case where **form and fate decouple**.

  **The Best Case: Cryptic Species vs. Polyphenism**
  Ask her about **two populations that are genetically distinct lineages but morphologically identical (Cryptic Species)**.
  *   **If she says "Two Species":** She is a **Lineage/PSC** thinker. (Genetic history matters more than looks).
  *   **If she says "One Species":** She is a **Morphological** thinker. (If you can't see the difference, it's not a species).

  **Alternative Tie-Breaker: Polyphenism**
  Ask her about **a single genetic clone that produces two distinct morphs based on temperature (e.g., seasonal forms)**.
  *   **If she says "One Species":** She is a **Lineage** thinker. (Same genome/fate, different looks).
  *   **If she says "Two Species":** She is a **Morphological** thinker. (Different looks = different species).

  **Summary:** Your friend is a **Lineage Splitter** who prioritizes **diagnosable distinctness** over reproductive compatibility. She will call the lizards **multiple species**. To probe deeper, ask her if **invisible genetic differences** are enough to make a species without morphological change.
