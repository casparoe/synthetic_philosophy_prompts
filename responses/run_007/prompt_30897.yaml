          *   Identify what *not* to settle (metaphysics, etc.).
          *   Design a final question/exercise to test grasp (contested claim vs. eroded shared world vs. cynicism).

  2.  **Deconstruct the Audience (Early-Career Political Reporters):**
      *   *Mindset:* They live in the news cycle. They value accuracy but are pressured by speed and balance. They are likely trained in "he said/she said" journalism to avoid bias claims. They might be cynical or burnt out.
      *   *Potential Blind Spots:* They might think "fact-checking" is the solution. They might conflate "bias" with "lying." They might view truth as something to be "found" rather than "established." They might resist Arendt's idea that truth is "coercive" (sounds anti-democratic).
      *   *Goal:* Move them from "checking claims" to "protecting the common world."

  3.  **Develop the Core Argument (The Spine):**
      *   Arendt argues factual truths (what happened) are different from rational truths (2+2=4) and opinions (policy preferences).
      *   Facts are fragile because they could have been otherwise.
      *   Politics is about opinion/persuasion. Facts interrupt this flow.
      *   Therefore, politicians lie about facts to regain control.
      *   The danger isn't the lie itself, but the destruction of the *ground* we stand on.

  4.  **Determine Prerequisites (What must be in place):**
      *   Before they care about Arendt, they need to feel the *friction* of facts.
      *   They need to distinguish between "interpretation of events" and "occurrence of events."
      *   They need to understand that "neutrality" can sometimes aid the erasure of facts.

