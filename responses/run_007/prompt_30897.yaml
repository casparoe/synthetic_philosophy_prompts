      *   *Actually, let's go with the 2003 Iraq WMD claims.* It involves intelligence (facts), public statements (politics), and the aftermath (erasure of the error).
      *   *No, keep it simpler.* **The 2017 Crowd Size** is the cleanest "Factual Truth" example. Photos don't lie. The administration lied. The press fact-checked. The administration doubled down on the *right to define reality*. That is pure Arendt. I will use this but ensure I emphasize the *systematic* follow-up, not just the gaffe.

