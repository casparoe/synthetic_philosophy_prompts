      *   *Selection:* **The 2003 Iraq War "Yellowcake/Uranium" Claim or the broader WMD intelligence vs. public certainty.** Actually, let's go with something slightly more contained but illustrative of the *mechanism*.
      *   *Better Selection:* **The "Death Panels" claim (2009/2010 ACA debate).**
          *   *Why:* It's settled (no death panels existed). It was a specific fabrication. It had lasting political effects. It shows how a lie creates a *narrative* that outlives the fact-check.
          *   *Wait, is it too partisan?* Maybe.
      *   *Best Selection:* **The 2004 "Swift Boat Veterans for Truth" Campaign against John Kerry.**
          *   *Why:* It's historical enough (20 years). It involves a specific factual record (military service). It shows *organized* lying (not just a slip). It shows the erosion of the record (documents vs. TV ads). It bridges the gap between old media and new organized disinformation.
          *   *Alternative:* **The 2017 "Alternative Facts" (Inaugural Crowd Size).**
          *   *Why:* It is the purest example of Arendt's point. The photos exist. The lie was unnecessary except to assert dominance over reality. It marks the shift to "post-truth."
          *   *Decision:* **The 2017 Inaugural Crowd Size.** It is visually undeniable, the lie was immediate, and the response ("Alternative Facts") explicitly attacks the category of factual truth. It's perfect for Arendt.

  6.  **Map Misconceptions & Interventions:**
      *   *Misconception 1:* "Facts are socially constructed." (Head off early, define factual vs. rational truth).
