answer: |-
  **PROJECT TITLE:** The Comparative Heterogeneity Objection: Is Hedonism Uniquely Vulnerable?

  **PROJECT SUMMARY**
  The heterogeneity objection is the standard critique of hedonism: the experiences we call "pleasure" (the warmth of a bath, the relief of solving a puzzle, the burn of a hard run) share no single felt quality, suggesting "pleasure" is not a unified natural kind capable of grounding a theory of well-being. However, rival theories face structurally similar worries. Desire-satisfaction theories must aggregate heterogeneous desires (thirst quenching vs. career achievement); objective list theories must aggregate heterogeneous goods (knowledge vs. friendship).

  Existing literature focuses on defending hedonism internally (e.g., shifting from felt-quality to attitudinal accounts). It rarely asks the comparative question: *Does heterogeneity impose a unique structural burden on hedonism that it does not impose on rivals?* This project seeks to determine if there is a specific feature of hedonism—such as the demand for phenomenological unity, its status as a sole primitive, or its aggregative mechanism—that makes the heterogeneity problem fatal for hedonism but survivable for other theories.

  **RESEARCH QUESTION**
  The project pursues a determinate answer to the following question: **Is there a structural disanalogy between the heterogeneity of pleasure and the heterogeneity of desires or objective goods such that the objection uniquely undermines hedonism?**

  A successful project will yield one of two determinate conclusions:
  1.  **The Unique Burden Thesis:** Yes, heterogeneity is uniquely damaging to hedonism because [Specific Feature, e.g., phenomenological immediacy is required for aggregation].
  2.  **The Symmetry Thesis:** No, the problem is symmetric. If heterogeneity defeats hedonism, it defeats all major theories of well-being, requiring a wholesale revision of how we conceptualize well-being primitives.

  **SETTLED VS. CONTESTED CLAIMS**
  To ensure philosophical precision, this proposal distinguishes between background consensus and the specific ground this project contests.

  *   **Settled Background:**
      *   All three major families of well-being theory (hedonism, desire-satisfaction, objective list) rely on a central category that admits of heterogeneous instances.
      *   Standard defenses of hedonism (felt-quality vs. attitudinal) address the definition of pleasure but do not compare the *cost* of that definition against rival definitions.
      *   Heterogeneity creates *some* theoretical friction for all three views (e.g., commensurability issues).

  *   **Genuinely Contested (The Project's Focus):**
      *   Whether the *type* of heterogeneity matters. (e.g., Is phenomenological heterogeneity worse than intentional heterogeneity?)
      *   Whether hedonism requires a "natural kind" in a way desire theories do not.
      *   Whether the aggregative function of well-being (summing goods) breaks down more easily when the inputs are feelings rather than propositional attitudes or objective states.
      *   Whether the "sole primitive" status of pleasure in hedonism makes unity more necessary than in pluralistic objective list theories.

  **METHOD AND WORK PLAN**
  The method is conceptual analysis via comparative reconstruction. I will construct parallel test cases across the three theories to isolate where the heterogeneity objection gains traction. This comparative approach beats the standard alternative (re-litigating the nature of pleasure) because it controls for the general difficulty of unifying value categories. If the problem persists only for hedonism across controlled cases, the fault lies in hedonism's structure, not in the general difficulty of value theory.

  **Month 1: Mapping the Analogues**
  *   **Goal:** Formalize the heterogeneity objection for all three theories using parallel syntax.
  *   **Task:** Construct a taxonomy of heterogeneity types: *Phenomenological* (feelings), *Intentional* (propositional contents of desire), and *Categorical* (types of objective goods).
  *   **Test Cases:**
      *   *Hedonism:* The "burn" of exercise vs. the "calm" of reading.
      *   *Desire Theory:* The urge to scratch an itch vs. the desire for a just society.
      *   *Objective List:* Physical health vs. aesthetic appreciation.
  *   **Deliverable:** A matrix showing where "unity" is required in each theory (e.g., unity of experience vs. unity of satisfaction conditions).

  **Month 2: Stress Testing Structural Features**
  *   **Goal:** Identify if a specific structural feature of hedonism creates the unique vulnerability.
  *   **Task:** Test two hypotheses for the "Special Feature."
      *   *Hypothesis A (The Primitive Argument):* Hedonism fails because it posits one *sole* primitive. If that primitive fractures, the theory collapses. Desire/Objective theories are often implicitly pluralistic.
      *   *Hypothesis B (The Aggregation Argument):* Hedonism requires real-time aggregation of feelings, whereas desire satisfaction can be aggregated formally (counting satisfied propositions) regardless of content.
  *   **Test Cases:** Scenarios involving trade-offs. Does swapping 10 minutes of "puzzle pleasure" for 10 minutes of "bath pleasure" seem coherent compared to swapping "itch satisfaction" for "justice satisfaction"?
  *   **Deliverable:** Draft arguments evaluating Hypothesis A and B. One will likely be eliminated as insufficient to explain the asymmetry.

  **Month 3: Synthesis and Drafting**
  *   **Goal:** Finalize the argument and prepare the manuscript.
  *   **Task:** Synthesize findings into a single argument. If the Symmetry Thesis holds, argue for a generalized "Heterogeneity Problem for Well-Being." If the Unique Burden Thesis holds, isolate the specific hedonistic commitment that must be abandoned.
  *   **Deliverable:** A complete draft article (8,000 words) ready for submission.

  **EXPECTED OUTCOMES AND SUCCESS CRITERIA**
  A successful result is not necessarily a defense of hedonism. Success is defined as **locating the precise locus of the disagreement.**
  *   **Success:** The project produces a clear distinction showing *why* heterogeneity hurts one theory more than another (e.g., "Heterogeneity defeats hedonism only if one accepts Phenomenal Primitivism, but not if one accepts Attitudinal Hedonism, whereas Desire Theory faces a parallel problem regarding Global Desires").
  *   **Success:** The project establishes that the objection is theory-neutral, forcing a shift in the literature from defending specific theories to addressing the general metaphysics of value unification.

  **RISK ASSESSMENT AND FAILURE CONDITIONS**
  *   **Failure Condition 1 (Indeterminacy):** The analysis reveals that "heterogeneity" is too vague a predicate to apply uniformly across theories (e.g., phenomenological difference is categorically distinct from intentional difference), making comparison impossible.
      *   *Mitigation:* If this occurs, the output will shift to a meta-ethical paper on the taxonomy of value primitives rather than a comparative critique.
  *   **Failure Condition 2 (Triviality):** The result is that the problem is unique to hedonism only because of a trivial definition (e.g., "Hedonism defines itself as a single feeling").
      *   *Mitigation:* I will pre-empt this by engaging with sophisticated attitudinal hedonism in Month 1 to ensure the target is not a straw man.
  *   **Failure Condition 3 (Stalemate):** The arguments for Symmetry and Unique Burden are equally balanced.
      *   *Mitigation:* The manuscript will present the stalemate itself as a contribution, highlighting the need for new criteria in well-being theory beyond simple heterogeneity checks.

  **SIGNIFICANCE**
  This project moves the debate beyond the defensive posture of "saving hedonism." By treating the heterogeneity problem as a comparative stress test, it clarifies whether the objection is a local bug for hedonism or a systemic feature of well-being theorizing. This allows future research to focus on viable structural solutions rather than endlessly redefining pleasure.
