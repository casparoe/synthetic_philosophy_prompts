prompt: |-
  I am a novelist. My current protagonist is a county judge in a small, religiously divided community, and a large part of the book turns on how she reasons about hard cases: a promise made to a dead friend, a lie that would spare a family, a sentence she is legally free to soften. I want her moral reasoning to be a genuine and stable intellectual position, not a mood that changes from scene to scene, and I want the reader to be able to reconstruct it from what she does and says.

  Please build me a sorting instrument, a "which moral epistemology does this character actually hold?" quiz, that I can use to diagnose her and, later, to test whether any scene I draft is consistent with her.

  Specifications:

  - Eight to ten questions. Each question presents a concrete case from ordinary or professional life: a promise, a lie, a medical or judicial decision, a case involving a novel or unfamiliar consideration. Each question has two or three answer options. The options must be things the character would say, do, or feel, never statements of doctrine and never invitations to pick a label. The instrument must sort by how the character responds to cases, not by which school she admires.

  - The scoring key should map patterns of answers onto at least these positions: (1) a generalism of pro tanto principles, of roughly Rossian shape; (2) a particularism of roughly Dancy's shape, on which what is a reason in one case may be no reason or an opposite reason in another and on which moral judgment is not codifiable; (3) a strict-rule generalism on which at least some moral rules hold without exception. Add any further positions that fall naturally out of the logical space you build, provided you characterize each one defensibly and give it a name or an explicit "unnamed" marking.

  - Build from the distinctions first, not from the list of names. Lay out the axes you take to separate the positions, for example whether reasons must be general, whether there are codifiable principles, whether principles carry pro tanto weight or absolute force, whether a feature's moral valence can shift with context. Then locate each named position in the resulting space, and tell me which cells are empty. For each empty cell, say briefly whether it is empty because the combination is incoherent, merely unattractive, or simply unexplored, to your knowledge.

  - Include at least three cases on which a Rossian generalist and a particularist give different verdicts, not merely different post hoc rationalizations. These are the cases I most need, since only they will actually separate those two positions in a character's visible behavior. For each such case, tell me which feature of the case is doing the separating work.

  - Flag explicitly any pair of positions the quiz cannot separate, and say what would need to be added, if anything would, to separate them.

  - For each leaf, give me one short paragraph I can use while drafting: what this character is likely to notice first in a morally difficult scene, what she is likely to feel guilty about afterward, and what sort of thing she would say when asked to justify herself.

  The point of the instrument is to keep a fictional character honest. A case that merely stipulates the verdict, or a question that rewards the character for mouthing the right slogan, is useless to me; the questions must generate the diagnosis from concrete responses.
reasoning: |-
  Here's a thinking process that leads to the suggested sorting instrument:

  1.  **Analyze the Request:**
      *   **User:** Novelist creating a protagonist (county judge in a religiously divided community).
      *   **Goal:** Create a "sorting instrument" (quiz) to diagnose the character's moral epistemology and ensure consistency in drafting.
      *   **Core Requirement:** The character's reasoning must be a stable intellectual position, not a mood. The reader must be able to reconstruct it from actions/words.
      *   **Specifications:**
          *   8-10 questions (concrete cases, options must be actions/words/feelings, not doctrine).
          *   Scoring key mapping to specific positions: Rossian Generalism (pro tanto principles), Dancy-style Particularism (context-dependent reasons, no codification), Strict-Rule Generalism (absolutism). Plus any others that emerge.
          *   **Crucial:** Build from distinctions/axes first, then locate positions. Explain empty cells.
          *   **Crucial:** Include at least 3 cases where Rossian and Particularist verdicts *diverge* (not just rationalizations). Explain the separating feature.
          *   **Crucial:** Flag pairs of positions the quiz cannot separate.
          *   **Crucial:** For each leaf (position), provide a drafting paragraph (notice, guilt, justification).
      *   **Tone:** Practical for a writer, philosophically rigorous but accessible.

  2.  **Deconstruct the Philosophical Space (The Axes):**
      *   To distinguish Ross (Prima Facie Duties), Dancy (Particularism), and Absolutism (Strict Rules), I need specific variables.
      *   *Axis 1: Codifiability.* Can moral truth be captured in a finite set of rules? (Yes -> Generalism; No -> Particularism).
      *   *Axis 2: Invariance of Reasons.* Does a feature (e.g., "it's a lie") always count in the same moral direction, or can it switch valence? (Invariant -> Generalism; Variable -> Particularism).
      *   *Axis 3: Conflict Resolution.* When principles clash, is there a hierarchy/exceptionless rule, or is it a matter of judgment/weighting? (Hierarchy/Absolutism -> Strict Rule; Weighting -> Ross; Holistic Judgment -> Particularism).
      *   *Axis 4: The Role of Principles.* Are principles decision procedures (use them to decide) or summaries (use them to explain)?

      *   *Mapping the Positions:*
          *   **Strict-Rule Generalism (Absolutism):** Codifiable, Invariant, Exceptionless.
          *   **Rossian Generalism (Moderate Generalism):** Codifiable (pro tanto), Invariant (a duty is always a duty, though outweighed), Weighted/Overridable.
          *   **Dancy-style Particularism:** Non-codifiable, Variable Valence, Holistic Judgment.
          *   *Potential Fourth Position:* **Rule Utilitarianism / Pragmatic Generalism.** Principles are useful heuristics but not ultimately binding. (Maybe too close to Ross for this specific quiz, but worth considering if the axes allow). Let's stick to the requested three + maybe one "Pragmatic/Institutional" variant suitable for a judge. Actually, the prompt asks to add positions that fall naturally. A "Legal Positivist/Institutional" stance fits a judge well. Let's call it **Institutional Formalism**.

  3.  **Developing the Cases (The Questions):**
      *   Need 8-10 questions.
      *   Need 3 specific "Ross vs. Dancy" divergences.
      *   *Divergence 1: The Switching Valence.* A feature that is usually bad becomes good.
          *   *Case:* A lie told to protect someone.
          *   *Ross:* Lying is a *prima facie* duty not to do. It counts against the action, even if overridden by beneficence. The character should feel "residue" or regret about the lie itself.
          *   *Dancy:* In this context, the "lie" feature might not be negative at all, or might be positive (protective). No residue.
      *   *Divergence 2: The Novel Case.* A situation with no precedent.
          *   *Case:* A new technology or social situation.
          *   *Ross:* Look for analogous principles. Apply existing duties.
          *   *Dancy:* Principles don't help. Look at the specific contours of *this* situation.
      *   *Divergence 3: The Conflict of Duties.* Two strong principles clash.
          *   *Case:* Promise vs. Emergency.
          *   *Ross:* Both remain duties. One outweighs the other. The overridden one still exerts force (guilt/regret).
          *   *Dancy:* The "promise" feature might lose its reason-giving force entirely in the face of the emergency. It's not outweighed; it's silenced.

      *   *Drafting the Questions:*
          *   Q1: The Promise to the Dead (Ross vs. Dancy on silence/weight).
          *   Q2: The White Lie (Ross vs. Dancy on valence).
          *   Q3: The Sentencing Discretion (Strict vs. Ross/Dancy).
          *   Q4: The Unforeseen Loophole (Strict vs. others).
          *   Q5: The Conflicting Obligation (Ross vs. Dancy on residue).
          *   Q6: The Precedent vs. Fairness (Legal vs. Moral).
          *   Q7: The Religious Community Pressure (External rules vs. Internal judgment).
          *   Q8: The Technical Truth (Strict vs. Nuance).

      *   *Refining Options:* Must be behavioral/verbal, not theoretical.
          *   Bad: "I believe in prima facie duties."
          *   Good: "I'll do it, but I need to sit with the discomfort of breaking my word."

  4.  **Constructing the Scoring & Axes:**
      *   Define the axes clearly first.
      *   Map the answers to the positions.
      *   Identify empty cells (e.g., Variable Valence + Strict Rules is incoherent).
      *   Identify indistinguishable pairs (e.g., Ross vs. Rule Utilitarian might be hard to separate without asking about *why* the rule exists).

  5.  **Drafting the Content (Iterative Process):**

      *   *Axes:*
          1.  Invariance (Does a reason keep its sign?)
          2.  Codifiability (Can you write it all down?)
          3.  Overridability (Can a rule be broken without sin?)
      *   *Positions:*
          1.  **Absolutism (Strict-Rule):** Invariant, Codifiable, Non-overridable.
          2.  **Principled Pluralism (Rossian):** Invariant, Codifiable (pro tanto), Overridable.
          3.  **Holistic Particularism (Dancy):** Variable, Non-codifiable, Context-sensitive.
          4.  **Institutional Formalism (Judge-specific):** Rules bind because of office, not morality. (Added value for a judge character).

      *   *The 3 Divergence Cases:*
          1.  *The Protective Lie:* Ross sees a negative feature overridden. Dancy sees no negative feature.
          2.  *The Broken Promise for Greater Good:* Ross sees a remaining duty (guilt). Dancy sees the promise-duty silenced (no guilt).
          3.  *The Novel Precedent:* Ross seeks analogy. Dancy seeks unique fit.

      *   *The Quiz:* Write the scenarios. Ensure options reflect the *phenomenology* of the decision.
      *   *The Scoring:* Tally the responses.
      *   *The Empty Cells:* Explain why "Variable Valence + Strict Rules" doesn't work.
      *   *The Drafting Guides:* Focus on attention, emotion, and speech.

  6.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   Concrete cases? Yes.
      *   Options are actions/words? Yes.
      *   Scoring key maps to Ross, Dancy, Strict? Yes.
      *   Axes laid out first? Yes.
      *   Empty cells explained? Yes.
      *   3 Ross/Dancy divergence cases identified? Yes.
      *   Indistinguishable pairs flagged? Yes.
      *   Drafting paragraphs included? Yes.

  7.  **Final Polish:**
      *   Ensure the tone is helpful to a writer, not just a philosopher.
      *   Make sure the "Judge" context is woven in (sentencing, promises, community pressure).
      *   Check that the Ross/Dancy distinction is sharp. This is the hardest part philosophically. Ross says "Lying is always wrong *prima facie*." Dancy says "Lying isn't always wrong, even *prima facie*; it depends on the context." The quiz needs to capture the *feeling* of that difference.
      *   *Self-Correction on Q2 (The Lie):* Make sure the Ross option admits the lie is bad *even if necessary*. The Dancy option should treat the lie as morally neutral or positive *in that moment*.
      *   *Self-Correction on Q5 (Conflict):* Ross feels "moral residue" (regret). Dancy feels "resolution" (no regret if right).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## Part I: The Philosophical Axes

  Before administering the quiz, we must define the logical space. We are not sorting by "which philosopher she read," but by how her moral cognition functions. We distinguish positions along three axes:

  1.  **Invariance of Valence:** When a feature (e.g., "breaking a promise") counts as a moral reason in one case, does it *always* count in the same direction (negative), or can it be neutral or positive in a different context?
      *   *Invariant:* Generalism.
      *   *Variable:* Particularism.
  2.  **Codifiability:** Can the correct moral decision be captured by a finite set of principles or rules that the agent can consult?
      *   *Yes:* Generalism.
      *   *No:* Particularism.
  3.  **Overridability:** When two principles conflict, does one simply cancel the other, does one outweigh the other while the other remains a burden, or is one exceptionless?
      *   *Exceptionless:* Strict-Rule Generalism.
      *   *Outweighed (with residue):* Rossian Generalism.
      *   *Silenced/Transformed:* Particularism.

  ### The Map of Positions

  Based on these axes, we locate four defensible positions. Three are requested; one emerges naturally for a judge.

  1.  **Strict-Rule Generalism (Absolutism):**
      *   *Coordinates:* Invariant, Codifiable, Non-overridable.
      *   *Definition:* Certain rules (e.g., "Do not lie," "Keep promises") hold without exception. If rules conflict, one was misidentified; true rules never clash.
  2.  **Principled Pluralism (Rossian):**
      *   *Coordinates:* Invariant, Codifiable (pro tanto), Overridable.
      *   *Definition:* There are stable principles (duties of fidelity, beneficence, etc.). They always count in the same direction, but they can be outweighed. When a duty is overridden, it leaves "moral residue" (regret/obligation to make amends).
  3.  **Holistic Particularism (Dancy-style):**
      *   *Coordinates:* Variable, Non-codifiable, Context-sensitive.
      *   *Definition:* A feature's moral weight depends entirely on the context. "Lying" is not inherently bad; it is bad in *this* context. Principles are at best summaries of past judgments, not guides for new ones. No moral residue if the judgment was sound.
  4.  **Institutional Formalism (The Judge's Shield):**
      *   *Coordinates:* Invariant (Legally), Codifiable (Statutory), Overridable (Morally).
      *   *Definition:* Moral reasoning is separated from legal reasoning. The "rules" of the office bind absolutely, even if they conflict with personal morality. This is a role-ethic distinct from personal ethics.

  ### Empty Cells

  *   **Variable Valence + Strict Rules:** *Incoherent.* If a feature (like lying) can switch from bad to good depending on context, you cannot have a strict rule against it.
  *   **Non-codifiable + Strict Rules:** *Incoherent.* If rules are strict and exceptionless, they constitute a code. If morality is non-codifiable, there are no strict rules.
  *   **Invariant + Non-codifiable:** *Unexplored/Unattractive.* This suggests reasons always count the same way, but we can never write them down or learn them systematically. It implies a moral intuition that is reliable but unteachable. Rarely held as a stable theory.

  ### Indistinguishable Pairs

  *   **Rossian vs. Rule Utilitarian:** This quiz may struggle to separate these. Both use principles as guides that can be overridden. To separate them, you would need a question about *why* the principle exists (intrinsic duty vs. aggregate good). For a novelist, these often look identical in behavior.
  *   **Particularism vs. High-Context Intuitionism:** A character who acts like a particularist might simply be a generalist who hasn't articulated her rules. To separate them, you must press her on whether she believes her reasoning *could* be written down.

  ---

  ## Part II: The Sorting Instrument

  **Instructions:** Read each scenario. Choose the option that best matches how your character *actually* reacts, speaks, or feels. Do not choose what she thinks is "smart"; choose what is true to her internal machinery.

  **Q1. The Promise to the Dead**
  A deceased friend asked her to destroy a letter that would exonerate a man currently in prison. The letter proves the man's innocence. Keeping the promise honors the dead; breaking it frees the innocent.
  *   **A.** She burns the letter. "A promise is a debt. I can't pay it with someone else's freedom, but I can't default on it either. I'll resign rather than break my word."
  *   **B.** She releases the letter. "The duty to justice outweighs the duty to fidelity. I'll do it, but I need to sit shiva for that friendship. I betrayed him to save the innocent."
  *   **C.** She releases the letter. "In this light, keeping the promise isn't loyalty; it's complicity. The 'promise' feature doesn't even count as a reason to hide the truth here."

  **Q2. The Protective Lie**
  A mother asks if her son is hiding in the judge's chambers. He is. He is innocent of the crime he's accused of, but the law requires his surrender.
  *   **A.** "He is not here." She feels a sharp sting in her chest. "I lied. It was necessary, but I stained my own hands. I won't do it again unless I must."
  *   **B.** "He is not here." She feels calm. "Saying those words wasn't a lie in the moral sense. It was a shield. The truth would have been a weapon."
  *   **C.** "I cannot answer that." She refuses to speak. "I will not break the rule against lying, nor will I break the rule against aiding evasion. I recuse myself from the interaction."

  **Q3. The Sentencing Discretion**
  The law allows a range of 5 to 10 years. The defendant is remorseful and has a sick child. The guidelines suggest 8 years.
  *   **A.** She sentences 5 years. "The guidelines are a baseline. Mercy is a principle just as real as order. I am balancing them."
  *   **B.** She sentences 5 years. "Guidelines can't see this child. If I follow the number, I'm not judging; I'm calculating. This case demands 5."
  *   **C.** She sentences 8 years. "The law is the law. If I start bending it for sympathy, I'm legislating from the bench. My feelings don't change the statute."

  **Q4. The Novel Loophole**
  A new financial instrument allows a wealthy donor to bypass a campaign finance restriction without technically violating the text of the law.
  *   **A.** She rules against the donor. "The spirit of the law is the constraint. The text is just a map, and the map isn't the territory."
  *   **B.** She rules for the donor. "The rule is the text. If the legislature wanted to close this, they should have written it. I won't invent a new rule."
  *   **C.** She rules against the donor. "This transaction has the same moral shape as the banned ones. The specific mechanism doesn't change the corruption."

  **Q5. The Conflicting Duty (Residue Test)**
  She must miss her daughter's recital to handle a judicial emergency that prevents a wrongful eviction.
  *   **A.** She handles the emergency. She cries in the car afterward. "I did the right thing, but I still wronged my daughter. I owe her an explanation, not just a hug."
  *   **B.** She handles the emergency. She feels sad but clear. "Being a mother and a judge aren't separate hats. In this moment, the judge-duty swallowed the mother-duty. There's nothing to apologize for."
  *   **C.** She handles the emergency. She feels angry. "The system shouldn't put me here. I followed the protocol for emergencies. The fault is structural, not mine."

  **Q6. The Religious Pressure**
  A church leader asks her to recuse herself from a marriage equality case, citing religious doctrine.
  *   **A.** "My oath is to the Constitution, not the scripture. But I understand why you ask. I will hear the case, but I will fast while I deliberate."
  *   **B.** "My oath is to the Constitution. Your doctrine is irrelevant to the legal question. I will not fast; I will read the briefs."
  *   **C.** "I hear you. I will pray on whether I am the right person for this case. If my conscience binds me, I must step aside."

  **Q7. The Technical Truth**
  She knows a witness is testifying to a technical truth that implies a falsehood. She can interrupt to clarify or let it stand.
  *   **A.** She interrupts. "Allowing the implication is a form of lying. The feature 'deceptive' attaches to the act, not just the sentence."
  *   **B.** She lets it stand. "It's not my job to fix the witness's phrasing. The truth is on the record. The jury's misunderstanding is their own."
  *   **C.** She interrupts. "In this context, silence is endorsement. The valence of 'letting it pass' shifts from neutrality to complicity."

  **Q8. The Precedent**
  A past ruling she admires legally seems to produce an unjust outcome in the current case.
  *   **A.** She follows the precedent. "Consistency is a moral good. Unjust outcomes are for the legislature to fix, not me."
  *   **B.** She distinguishes the case. "Precedent is a principle of stability, not a straitjacket. Justice is a higher principle. I will narrow the ruling."
  *   **C.** She ignores the precedent. "That case was about different people. This case has its own gravity. I decide what is right here, now."

  **Q9. The Unfamiliar Consideration**
  A defendant claims a cultural practice mitigates his intent. There is no legal precedent for this.
  *   **A.** She considers it. "Ignorance of culture is like ignorance of fact. It changes the moral landscape of the intent."
  *   **B.** She rejects it. "The law must be blind to culture. To treat him differently is to treat him unequally."
  *   **C.** She considers it. "Rules about intent are generalizations. This specific cultural fact changes the meaning of his action."

  **Q10. The Justification**
  After a controversial ruling, a reporter asks, "How do you sleep at night?"
  *   **A.** "I weigh the duties. Sometimes the heavier one crushes the lighter. I feel the weight of the lighter one, but I sleep."
  *   **B.** "I look at the case. Not the rules, the case. It was the only thing to do. I sleep because I saw clearly."
  *   **C.** "I follow the code. If the code is wrong, that's not on me. I sleep because I did my job."

  ---

  ## Part III: Scoring Key & Diagnosis

  Tally the responses. While a mix is possible, a dominant pattern reveals the epistemology.

  *   **Mostly A (Principled Pluralism / Rossian):**
      *   *Diagnosis:* She believes in stable moral principles that sometimes conflict. When they do, one outweighs the other, but the overridden principle still exerts a pull (moral residue).
      *   *Key Marker:* She feels guilt/regret even when she knows she did the "right" thing (Q1, Q2, Q5).
  *   **Mostly B (Holistic Particularism / Dancy-style):**
      *   *Diagnosis:* She believes moral reasons depend on context. A feature (like lying) isn't inherently bad. She trusts her perception of the specific case over general rules.
      *   *Key Marker:* She denies the conflict or the negative valence of the overridden option (Q1, Q2, Q5). She sees no residue.
  *   **Mostly C (Strict-Rule / Absolutist or Formalist):**
      *   *Diagnosis:* She believes rules (moral or legal) are exceptionless or binding by virtue of authority. Conflicts are avoided by hierarchy or recusal.
      *   *Key Marker:* She refuses to choose between clashing rules or follows the code regardless of outcome (Q2, Q3, Q10). *Note: Distinguish between Moral Absolutist (Q2 Option C) and Institutional Formalist (Q3 Option C).*
  *   **Mixed A/C (Institutional Formalism):**
      *   *Diagnosis:* She holds personal Rossian views but adopts Strict Formalism in her professional capacity.
      *   *Key Marker:* She separates "what I would do as a person" from "what I must do as a judge."

  ---

  ## Part IV: The Three Divergence Cases (Ross vs. Particularist)

  These are the critical scenes where a Rossian and a Particularist will behave differently, not just talk differently.

  **1. The Protective Lie (Q2)**
  *   **The Feature:** The act of uttering a falsehood.
  *   **Rossian Verdict:** The act is *prima facie* wrong. It counts against the action. Even if she lies to save the son, she acknowledges she has done something morally negative that required justification. She feels the "sting."
  *   **Particularist Verdict:** The act is not inherently wrong. In the context of "protecting the innocent from unlawful seizure," the feature "uttering a falsehood" loses its negative valence. It might even be positive. She feels no sting.
  *   **Separating Work:** The presence or absence of *moral residue* (guilt/regret) after a necessary transgression.

  **2. The Broken Promise for Greater Good (Q1)**
  *   **The Feature:** The history of a prior commitment.
  *   **Rossian Verdict:** The promise remains a duty. It is outweighed by justice, but it is not erased. She owes the dead friend an apology or restitution (even if impossible). The promise continues to be a reason, just a weaker one.
  *   **Particularist Verdict:** The promise feature is *silenced*. In the context of "wrongful imprisonment," the fact that "I promised" ceases to be a reason at all. It is not outweighed; it is rendered irrelevant.
  *   **Separating Work:** Whether the agent tries to make amends for the broken promise *after* doing the right thing.

  **3. The Novel Precedent (Q8/Q9)**
  *   **The Feature:** Similarity to past cases.
  *   **Rossian Verdict:** She looks for the general principle underlying the past case (e.g., "fairness") and applies it. She tries to codify the new decision into a rule for the future.
  *   **Particularist Verdict:** She looks at the unique contours of *this* case. She resists turning her decision into a rule. She might decide Case X one way and Case Y (which looks similar) differently because of a subtle contextual shift.
  *   **Separating Work:** Consistency across similar cases. The Rossian strives for consistency of principle; the Particularist accepts inconsistency if the contexts differ morally.

  ---

  ## Part V: Drafting Guides (The Leaves)

  Use these paragraphs to check your scenes. If your character's internal monologue contradicts this, you have broken her epistemology.

  ### 1. The Principled Pluralist (Rossian)
  *   **Notices First:** Conflicts between duties. She sees the scene as a tug-of-war between "Fidelity," "Justice," and "Beneficence."
  *   **Feels Guilty About:** The duty she had to override. Even if she knows she made the right choice, she feels she has incurred a moral debt that needs repaying.
  *   **Justification:** "I know I broke my word. But the duty to save a life was heavier. I still owe you an apology for the word I broke."

  ### 2. The Holistic Particularist (Dancy-style)
  *   **Notices First:** The unique texture of the situation. She ignores "rules" and looks at the specific relationships and harms present *now*.
  *   **Feels Guilty About:** Misreading the context. If she did the "right" thing, she feels no guilt about the action itself, only regret if her perception was blurry.
  *   **Justification:** "It wasn't about breaking a rule. In that moment, with that family, saying 'no' would have been the cruelty. The situation didn't call for a promise; it called for mercy."

  ### 3. The Strict-Rule Generalist (Absolutist)
  *   **Notices First:** Violations of code. She scans the scene for breaches of established boundaries (religious, legal, or personal).
  *   **Feels Guilty About:** The breach itself, regardless of the outcome. If she breaks a rule to save a life, she believes she has sinned, even if it was necessary.
  *   **Justification:** "The rule exists for a reason. I cannot make an exception without destroying the principle. I must accept the consequence of following the law."

  ### 4. The Institutional Formalist (The Judge's Shield)
  *   **Notices First:** Jurisdictional boundaries. She notices what is "before the court" versus what is "outside the court."
  *   **Feels Guilty About:** Overstepping her office. She does not feel guilty about harsh outcomes if they are legally mandated; she feels guilty if she acts *ultra vires* (beyond her power).
  *   **Justification:** "My personal view doesn't matter. I am the mouthpiece of the statute. If you want to change the outcome, change the law, not the judge."

  ---

  ## Part VI: Consistency Check for the Novelist

  To ensure the character remains honest:

  1.  **The Residue Test:** In every scene where she breaks a norm, check her aftermath. If she is a Rossian, she must show scars. If she is a Particularist, she must show clarity. If she shows both, you have blurred the epistemology.
  2.  **The Explanation Test:** When challenged, does she appeal to a *principle* ("I had to keep the promise") or a *perception* ("This was what this moment needed")? Rossians appeal to principles; Particularists appeal to perception.
  3.  **The Novelty Test:** When faced with a new problem, does she search for an analogy (Rossian) or dive into the specifics (Particularist)?

  **Warning:** If you find yourself making her a Particularist when it suits the plot (to allow flexibility) and a Rossian when it suits the plot (to create angst), you are using her morality as a mood. Pick a lane. The most tragic and compelling version of this character is often the **Rossian**: she sees the rules, she sees why they must be broken, and she bears the weight of the break.
