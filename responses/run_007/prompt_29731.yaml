prompt: |-
  After my foundation's most recent portfolio review, I had to sit with an uncomfortable fact: the proposals I had argued hardest for were disproportionately the ones whose narratives were most detailed and causally specific, and their success rate was no better than the field average for their category, while proposals I found narratively less satisfying did no worse. I have concluded that I have been systematically overweighting what is usually called the inside view — the particulars of the proposed project, its team, its mechanism, and its plan — and underweighting the outside view, the distribution of outcomes for relevantly similar projects in the past. I want to correct this without swinging to the opposite error of ignoring case-specific information altogether.

  I am a program officer at a private foundation that makes roughly forty grants a year in early-stage biomedical and public health research. For each proposal I write a recommendation — advance, decline, or advance with conditions — for a committee that mostly defers to my recommendation. I typically have about ninety minutes of focused attention per proposal, I have no formal statistical training beyond the basics, and the proposals vary widely enough that no single reference class is obvious in most cases. The grants are multi-year and the cost of my being wrong, in either direction, is substantial.

  Please write me a reusable decision procedure, grounded in the inside view/outside view distinction and a sensible form of epistemic modesty, that I could actually run in that time. In particular, it should tell me: how to construct an outside view for a proposal without gerrymandering the reference class to get the answer my narrative already suggests; how to decide what information from the proposal counts as legitimate evidence that this case is an exception to the base rate rather than merely vivid detail; how to combine the outside view and the inside view into a recommendation; where the procedure must hand the decision back to judgment; and which steps are judgment calls dressed up as mechanical rules.

  Then apply the procedure to three representative proposals, including at least one where it tells me to decline a project I would otherwise find genuinely compelling, and one where it tells me to advance a project whose proposal is not especially persuasive on its face. I would also like an honest statement of what the procedure cannot do — for example, whether it can correct for my ability to select a self-serving reference class, and whether it can distinguish warranted modesty about my own judgment from simple deference to a base rate.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Program Officer at a private foundation (biomedical/public health).
      *   **Context:** ~40 grants/year, early-stage research. Multi-year grants, high cost of error.
      *   **Problem:** Realizes they overweight the "inside view" (narrative, specifics, plan) and underweight the "outside view" (base rates, reference classes). Narratively satisfying proposals aren't performing better than average.
      *   **Goal:** A reusable decision procedure (algorithm/heuristic) to balance inside/outside views within a 90-minute review window. Needs epistemic modesty.
      *   **Specific Requirements:**
          *   How to construct an outside view without gerrymandering.
          *   How to distinguish legitimate exception evidence from vivid detail.
          *   How to combine views into a recommendation.
          *   Where judgment is required vs. mechanical rules.
          *   Application to 3 representative proposals (including a "decline compelling" and "advance unpersuasive").
          *   Honest statement of limitations (self-serving bias, modesty vs. deference).

  2.  **Deconstruct the Core Concepts:**
      *   **Inside View:** The specific story, the PI's track record, the methodology, the innovation.
      *   **Outside View:** Base rates of success for similar grants, similar fields, similar career stages.
      *   **The Bias:** Narrative Fallacy / Illusion of Validity. The user feels good about detailed plans, but data shows no correlation with success.
      *   **Constraint:** 90 minutes per proposal. No advanced stats. Diverse portfolio (hard to find reference classes).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be step-by-step, time-boxed.
      *   *Step 1: The Outside View (Base Rate).* How to avoid gerrymandering? Use a "Pre-Commitment" strategy. Define the class *before* reading the details. Use broad categories if specific ones aren't available.
      *   *Step 2: The Inside View (Evidence).* How to filter vividness? Look for *predictive* validity, not *explanatory* coherence. Does the PI have a track record of *this specific type* of risk? Is the mechanism proven elsewhere?
      *   *Step 3: The Adjustment.* How to combine? Start with the base rate probability. Adjust up or down *only* for strong, specific evidence. Cap the adjustment (regression to the mean).
      *   *Step 4: The Decision Rule.* Map probability to recommendation (Advance, Decline, Conditions).
      *   *Step 5: The Meta-Check.* Acknowledge where judgment creeps in.

  4.  **Refining the "Outside View" Construction:**
      *   Problem: "No single reference class is obvious."
      *   Solution: Use a hierarchy. 1. Foundation-wide success rate. 2. Field-wide success rate (e.g., early-stage oncology). 3. Career-stage success rate.
      *   Anti-Gerrymandering Rule: Define the reference class *before* reading the Specific Aims. Write it down.

  5.  **Refining the "Inside View" Filtering:**
      *   Problem: "Vivid detail" vs. "Legitimate evidence."
      *   Solution: The "Counterfactual Test." If this detail were removed, would the probability of success change? If it's just a smooth story, it's vividness. If it's preliminary data or a proven method applied anew, it's evidence.
      *   Rule: Only adjust the base rate for *verified* track records or *replicated* preliminary data. Ignore "innovative methodology" claims unless backed by prior publication.

  6.  **Refining the Combination/Adjustment:**
      *   Use a "Bayesian Lite" approach.
      *   Start with Base Rate (e.g., 20% success).
      *   Add/Subtract points for specific factors (e.g., +10% for PI success in *this* niche, -5% for unproven tech).
      *   *Crucial:* Cap the final probability. Don't let a great story push a 20% base rate to 90%. Maybe cap at 60% for early stage.

  7.  **Developing the Three Cases:**
      *   *Case 1 (The Trap):* Narratively perfect, high innovation, but base rate is terrible (e.g., Alzheimer's cure, early stage). PI is charismatic but new to this specific mechanism. *Outcome: Decline.*
      *   *Case 2 (The Sleeper):* Dry proposal, standard methods, boring narrative. But PI has a solid track record of incremental wins in this exact sub-field. Base rate is decent. *Outcome: Advance.*
      *   *Case 3 (The Balanced):* Good narrative, solid preliminary data, reasonable base rate. *Outcome: Advance with Conditions.*

  8.  **Addressing the Limitations (The "Honest Statement"):**
      *   Can it stop self-serving reference class selection? Only if enforced rigorously (writing it down first).
      *   Modesty vs. Deference? The procedure forces modesty, but the user still chooses the weights. It doesn't solve the "illusion of objectivity."
      *   Black Swans: Early-stage research *needs* outliers. A strict base rate approach might kill the next mRNA tech. Need to acknowledge this tension.

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is 90 minutes enough for all this?
      *   *Fix:* Time-box the steps. 15 mins for Outside View setup, 45 mins for Inside View analysis, 15 mins for Calculation, 15 mins for Write-up/Reflection.
      *   *Critique:* Is "probability" too fake for a non-statistician?
      *   *Fix:* Use a "Score" system (0-100) that maps to probabilities, or just use rough percentage buckets (Low, Med, High). Let's stick to percentages but keep them coarse (increments of 10).
      *   *Critique:* The user asked for "where the procedure must hand the decision back to judgment."
      *   *Fix:* Explicitly label steps as "Mechanical" vs. "Judgment."

  10. **Final Polish:** Ensure tone is professional, empathetic to the difficulty of the role, and rigorous without being academic. (Make sure to explicitly answer the prompt's specific questions about gerrymandering and vivid detail).

  *(Self-Correction on Case 1)*: Make sure the "Decline Compelling" case isn't just "bad science." It needs to be *good* science that fits a *bad* base rate (e.g., high risk, low prior probability of success category).
  *(Self-Correction on Case 2)*: The "Advance Unpersuasive" case needs to rely on the PI's history, not the proposal text.

  11. **Final Output Structure:**
      *   Introduction (Acknowledging the insight).
      *   The Protocol (The 90-Minute Reference-Class Protocol).
      *   Step-by-Step Breakdown (with time limits).
      *   Application to Three Cases.
      *   Limitations & Epistemic Honesty.

  12. (Drafting content based on these thoughts...) *Wait, need to ensure I explicitly address the "gerrymandering" and "vivid detail" questions within the procedure.* I will add specific "Guardrails" to the steps.

  13. *Final check on constraints:* 40 grants/year is about 1 per week. 90 mins is tight but doable for a structured review. The procedure must be efficient.

  Let's write it.cw
answer: |-
  ## The 90-Minute Reference-Class Protocol

  You have identified a classic cognitive trap: the **Illusion of Validity**. You feel confident in your predictions because the stories are coherent, not because they are accurate. The following procedure is designed to force the Outside View into the room before the Inside View is allowed to speak, and to limit the magnitude with which the Inside View can override the baseline.

  This protocol is divided into four phases. Strict timekeeping is essential.

  ### Phase 1: The Blind Base Rate (15 Minutes)
  **Goal:** Establish the Outside View *before* engaging with the specific narrative to prevent gerrymandering.

  1.  **Define the Reference Class (Mechanical):** Before reading the Specific Aims or Innovation sections, categorize the proposal using only three objective variables:
      *   **Field:** (e.g., Oncology, Epidemiology, Neurology).
      *   **Stage:** (e.g., Early-career PI, Established Lab, High-risk/High-reward).
      *   **Intervention Type:** (e.g., Basic Mechanism, Translational, Clinical Trial).
  2.  **Retrieve the Base Rate (Mechanical):** Consult your foundation's historical data or public databases (e.g., NIH RePORTER) for the success rate of grants matching those three variables over the last 5–10 years.
      *   *Constraint:* If your internal data is too sparse, use the broader field average. Do not narrow the class further to find a higher success rate.
      *   *Output:* A **Base Probability (P_base)**. (e.g., "Early-stage oncology mechanism grants succeed 15% of the time.")
  3.  **The Gerrymandering Guardrail:** Write down your chosen reference class on a cover sheet *before* opening the proposal PDF. If you find yourself wanting to change the class after reading the proposal (e.g., "Actually, this is more like immunology"), you are forbidden from changing the P_base. You must note the discrepancy in the "Judgment Log" (see Phase 4).

  ### Phase 2: The Evidence Filter (45 Minutes)
  **Goal:** Evaluate the Inside View, distinguishing *predictive evidence* from *narrative coherence*.

  Read the proposal, but tag every claim as either **Vivid** or **Validated**.

  1.  **The Validated Tag (Mechanical):** A claim counts as Validated only if it meets one of these criteria:
      *   **Replicated Preliminary Data:** The PI shows data *they* generated that replicates a known finding or extends it directly.
      *   **Track Record:** The PI has successfully completed a grant of *similar scope and risk* in the past 5 years.
      *   **Methodological Provenance:** The proposed method is already in use in a peer-reviewed context (even by other labs).
  2.  **The Vivid Tag (Mechanical):** A claim is Vivid if it relies on:
      *   **Narrative Necessity:** "This step is crucial because..." (All steps are crucial; this is storytelling).
      *   **Team Chemistry:** Descriptions of how well the team works together.
      *   **Innovation Claims:** Statements that the approach is "novel" or "paradigm-shifting" without citation of prior validation.
      *   **Contingency Planning:** Detailed plans for what happens if things go wrong. (While responsible, these rarely prevent failure in early-stage research).
  3.  **The Adjustment Calculation (Mechanical):**
      *   Start with **P_base**.
      *   Add **+10%** for each Validated Track Record item (Max +20%).
      *   Add **+5%** for each Validated Preliminary Data item (Max +15%).
      *   Subtract **-10%** if the proposal relies >50% on Vivid claims for its core mechanism.
      *   **The Modesty Cap:** No early-stage proposal may exceed a **60%** probability of success, regardless of how compelling the Inside View. (This acknowledges that early-stage biomedical research is inherently stochastic).
      *   *Output:* **Adjusted Probability (P_adj)**.

  ### Phase 3: The Decision Rule (15 Minutes)
  **Goal:** Map probability to action without re-litigating the score.

  *   **P_adj < 25%:** **Decline.** (The base rate suggests failure, and the Inside View did not provide sufficient evidence to overcome it).
  *   **P_adj 25% – 45%:** **Advance with Conditions.** (The project is viable but risky; recommend milestones or reduced budget).
  *   **P_adj > 45%:** **Advance.** (The project is as safe as early-stage research gets).

  ### Phase 4: The Judgment Log (15 Minutes)
  **Goal:** Identify where the procedure failed or where human intuition is overriding the math.

  Answer three questions in writing:
  1.  **The Reference Class Check:** Did I feel the Base Rate was unfair? If yes, why? (This identifies where your internal model of the field diverges from historical data).
  2.  **The Exception Claim:** Am I recommending *Advance* on a low P_adj (or *Decline* on a high P_adj)? If yes, I must write one paragraph justifying why *this* case is a statistical outlier, citing only Validated evidence.
  3.  **The Comfort Check:** On a scale of 1–5, how "satisfied" does the narrative make me feel? If the score is 5 but P_adj is low, note this as a high-risk bias zone.

  ---

  ## Application to Three Representative Proposals

  Here is how the protocol functions in practice, including the requested counter-intuitive outcomes.

  ### Case 1: The "Moonshot" (Decline a Compelling Project)
  **Proposal:** A novel mechanism for reversing Alzheimer's neurodegeneration using a proprietary peptide.
  **Narrative:** Extremely detailed. The PI describes the exact cascade of protein folding, the delivery mechanism across the blood-brain barrier, and a compelling personal story about a family member with the disease. The contingency plans are exhaustive.
  **PI Profile:** Brilliant, but early-career. Previous work is in basic protein chemistry, not neurology or therapeutics.

  *   **Phase 1 (Outside View):**
      *   Class: Early-career / Neurology / Therapeutic Mechanism.
      *   P_base: **10%** (Historical success rate for early-stage neuro therapeutics is abysmal).
  *   **Phase 2 (Inside View):**
      *   Validated Evidence: None. No preliminary data in neuronal models. No prior therapeutic grants.
      *   Vivid Details: High. The mechanism explanation is coherent and satisfying.
      *   Adjustment: -10% (Reliance on Vivid claims).
      *   P_adj: **0%** (Capped at floor of 5% for calculation purposes).
  *   **Phase 3 (Decision):** **Decline.**
  *   **Phase 4 (Judgment Log):**
      *   *Comfort Check:* 5/5 (Narrative is incredibly satisfying).
      *   *Exception Claim:* None warranted. The proposal relies entirely on the Inside View.
      *   *Outcome:* You decline a project that feels like a winner. The protocol saves you from funding a high-failure-rate category based on narrative strength.

  ### Case 2: The "Incrementalist" (Advance an Unpersuasive Project)
  **Proposal:** Extending a known assay for inflammatory markers to a slightly new population cohort.
  **Narrative:** Dry. The writing is dense. The "Innovation" section admits the method is standard. It lacks a "hook."
  **PI Profile:** Mid-career. Has successfully completed three foundation grants in this exact sub-field. Preliminary data shows the assay works in 80% of samples.

  *   **Phase 1 (Outside View):**
      *   Class: Mid-career / Public Health / Observational.
      *   P_base: **35%** (Solid average for established observational work).
  *   **Phase 2 (Inside View):**
      *   Validated Evidence: +20% (Track record of 3 completed grants). +10% (Strong preliminary data).
      *   Vivid Details: Low.
      *   Adjustment: +30%.
      *   P_adj: **60%** (Hit the Modesty Cap).
  *   **Phase 3 (Decision):** **Advance.**
  *   **Phase 4 (Judgment Log):**
      *   *Comfort Check:* 2/5 (Narrative is boring).
      *   *Exception Claim:* Not needed; the math supports advancement.
      *   *Outcome:* You fund a boring project. The protocol forces you to recognize that "boring" often correlates with "executable," whereas "exciting" correlates with "speculative."

  ### Case 3: The "Pivot" (Advance with Conditions)
  **Proposal:** An established epidemiologist moving into wet-lab genomics.
  **Narrative:** Strong. The logic for the pivot is clear.
  **PI Profile:** Star in epidemiology, novice in genomics.
  *   **Phase 1:** P_base = 25% (Established PI, but new technical domain increases risk).
  *   **Phase 2:** Validated: +10% (General grant management skill). Vivid: High (The genomic plan is theoretical). Adjustment: 0%.
  *   **Phase 3:** P_adj = 35%. **Advance with Conditions.**
  *   **Outcome:** You fund the PI's competence but mitigate the technical risk via milestones.

  ---

  ## Limitations and Epistemic Honesty

  You asked for an honest statement of what this procedure cannot do. It is vital you read this before implementing the protocol.

  **1. It cannot fully cure Self-Serving Reference Class Selection.**
  In Phase 1, I instructed you to write down the class *before* reading. However, you still choose the categories. If you unconsciously categorize a risky project as "High-Risk/High-Reward" (which might have a different base rate in your mind) rather than "Early-Stage Basic Science," you can still game the system.
  *   *Mitigation:* You must periodically audit your own categorization choices against a peer's. If you consistently categorize "risky" projects into "high-success" buckets, the protocol is failing.

  **2. It cannot distinguish Warranted Modesty from Learned Helplessness.**
  There is a difference between saying, "I cannot predict the future" (Modesty) and "The base rate is low, so I shouldn't try" (Defeatism). Early-stage science *requires* outliers. If you follow this protocol strictly, you may systematically filter out the "Black Swans"—the projects that succeed *because* they ignored the base rate.
  *   *Mitigation:* Reserve 10% of your portfolio for "Wildcard" grants where you explicitly ignore the P_adj and follow your Inside View intuition. This acknowledges that your intuition might be right about outliers, even if it's wrong on average.

  **3. It creates an Illusion of Objectivity.**
  The percentages (10%, 25%, 60%) are fake precision. There is no statistical law that says a track record adds exactly 10%.
  *   *Mitigation:* Treat the numbers as forcing functions, not truths. The value is not in the calculation, but in the *pause* the calculation forces you to take before falling in love with a story.

  **4. It cannot solve the "Cost of Error" asymmetry.**
  You noted the cost of being wrong is substantial. However, the cost of a False Negative (declining a cure) is arguably higher than a False Positive (funding a failure). This protocol biases you toward False Negatives (protecting capital).
  *   *Mitigation:* Use the "Advance with Conditions" category aggressively. It is the safety valve that allows you to fund uncertain projects without committing full resources upfront.

  ### Final Recommendation
  Adopt this procedure for the next 10 grants. Do not judge its success by how "good" the funded projects feel. Judge it by whether your **Judgment Log** shows a correlation between high "Narrative Comfort" scores and actual project outcomes. If the correlation remains zero, you have successfully decoupled your funding decisions from your narrative bias.
