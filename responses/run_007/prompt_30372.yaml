answer: |-
  ### The Brexit Referendum as a Populist Case Study: Mapping the "Will of the People"

  To analyze the 2016 Brexit referendum through the lens of populism, we must adopt the standard political science definition, most notably articulated by Cas Mudde: populism is a "thin-centered ideology" that considers society to be ultimately separated into two homogeneous and antagonistic camps, **"the pure people"** versus **"the corrupt elite,"** and argues that politics should be an expression of the **volonté générale** (general will) of the people.

  Unlike thick ideologies (like socialism or liberalism), populism does not offer a detailed policy program. Instead, it offers a moral framework for interpreting power. In the Brexit context, this framework was not merely a backdrop; it was the primary engine used to interpret the result.

  #### 1. Constructing "The People"
  In liberal democratic theory, "the people" is a legal category comprising all citizens with equal standing. In the populist logic deployed during and after Brexit, "the people" became a moral category.

  *   **The 52% as the "Real" People:** Post-referendum, the populist narrative (championed by figures like Nigel Farage and sections of the Conservative Party) identified "the people" specifically with the 17.4 million who voted Leave. This was not just a majority; it was the *authentic* nation. Farage's declaration on referendum night that this was a "victory for real people" explicitly coded the Leave voter as the normative standard of citizenship.
  *   **The 48% and the Elite:** The status of the Remain voters is where the populist lens distorts. In a pluralist system, the 48% are the loyal opposition. In the populist framework, they faced a binary choice: either they were part of "the people" who had been misled by the elite, or they were complicit with the elite. Hardline Brexiteers often framed the 48% as "citizens of nowhere" (Theresa May), metropolitan, globalist, and detached from the national interest. They were not treated as a minority within the people, but as agents of the elite project (the EU).
  *   **The Non-Voters:** The 28% who did not vote were rhetorically claimed by the Leave side as "silent Leavers"—people so disillusioned by the elite that they couldn't be bothered to register. This allowed populists to inflate the "will" beyond the actual ballot count, claiming a mandate that exceeded the 52%.
  *   **The Territorial Fracture:** The populist "people" was defined as the *British* people. This construction deliberately subsumed the distinct majorities in Scotland and Northern Ireland who voted Remain. By prioritizing the UK-wide aggregate, the populist definition of "the people" invalidated the specific will of the Scottish and Northern Irish electorates, treating them as subordinate to the broader national will.

  #### 2. Defining "The Will"
  Populism posits that the people's will is unitary, transparent, and immediately knowable. It rejects the idea that the "will" requires mediation, interpretation, or compromise.

  *   **The Binary Illusion:** The referendum question was binary (Leave/Remain), but the outcome was multidimensional. The populist lens treated the vote as a direct instruction on *policy*, not just *direction*. It assumed that voting "Leave" equated to a specific will for ending free movement, leaving the Single Market, and stopping ECJ jurisdiction.
  *   **The Monolithic Mandate:** Despite the Leave campaign being a coalition of incompatible visions (e.g., the free-market libertarians of Conservatives for Britain vs. the protectionist nationalists of UKIP), the result was treated as a homogeneous command. The populist lens cannot accommodate the idea that "the people" might want contradictory things (e.g., both lower immigration and no economic damage). Therefore, the "will" was defined by the faction that seized the narrative control post-vote (the Hard Brexiteers).
  *   **Timelessness:** The populist "will" is treated as static. Attempts to check the result (via Parliament or courts) were framed as "betrayal." The idea that the "will" might change, or that the specifics might need ratification, was anathema to the populist logic, which views the referendum result as a sacred, unalterable instruction.

  #### 3. Where the Lens Fits: The Rhetorical Reality
  The populist lens accurately describes how the result was *used* politically, even if it misdescribes the legal reality.

  *   **Moral Supremacy over Legal Status:** Although the referendum was legally advisory, the populist framing made it politically binding. To question the implementation was to question the legitimacy of "the people." This is why the slogan "Brexit Means Brexit" was so effective; it shut down debate by equating policy specifics with the moral validity of the vote itself.
  *   **The Enemy of the People:** When the High Court ruled in the *Miller* case that Parliament must vote to trigger Article 50, the *Daily Mail* famously headlined the judges as "Enemies of the People." This is a textbook populist move: when an institution (the judiciary) acts as a check on the majority's asserted will, it is recast as an illegitimate elite obstacle.
  *   **Parliamentary Subordination:** MPs who sought to scrutinize the withdrawal agreement were accused of trying to "stop Brexit." In populist logic, Parliament is not a deliberative body; it is a transmission belt for the people's will. If Parliament deliberates, it is obstructing.

  #### 4. Where the Lens Breaks: Legal and Political Reality
  The populist map fails when overlaid on the constitutional terrain of the United Kingdom.

  *   **Parliamentary Sovereignty:** The UK constitution rests on Parliamentary Sovereignty, not popular sovereignty. Only Parliament can make or unmake law. The populist claim that the referendum result was self-executing was legally false. The lens breaks because it demands a direct democracy mechanism that the UK constitution does not possess.
  *   **The Heterogeneity of the Will:** The lens assumes a homogeneous people. The legislative process revealed that there was no parliamentary majority for *any* specific version of Brexit (Hard, Soft, Norway, Canada). The "will of the people" shattered when forced into legislative text. The populist lens could not explain why "the people's will" resulted in three years of parliamentary deadlock; it could only explain it by accusing Parliament of treachery.
  *   **The Advisory Nature:** The government had published a pamphlet before the vote stating the referendum was advisory. The populist lens requires the vote to be binding to maintain the myth of the direct will. Acknowledging the advisory status would have admitted that "the will" requires mediation, which undermines the core populist claim.

  #### 5. Normative Implications: What Actors "Should" Have Done
  If we analyze the actions of key actors *by the lights of populist theory* versus *constitutional theory*, we see an irreconcilable conflict.

  *   **The Government (May/Johnson):**
      *   *Populist Logic:* They should have triggered Article 50 immediately without parliamentary legislation, ignoring the *Miller* challenge. They should have implemented the Leave campaign's promises (e.g., £350m for NHS) regardless of feasibility, as these were part of the "will." Compromise with the EU was betrayal.
      *   *Constitutional Reality:* They were required to respect Parliamentary Sovereignty, seek authorization to trigger Article 50, and negotiate a deal that could pass legislation.
  *   **The Parliament:**
      *   *Populist Logic:* Parliament should have acted as a rubber stamp. Scrutinizing the deal was illegitimate because the "decision" had already been made by the people.
      *   *Constitutional Reality:* Parliament had a duty to scrutinize the treaty changes and ensure the outcome was in the national interest, representing both the 52% and the 48%.
  *   **The Judiciary:**
      *   *Populist Logic:* The courts should have deferred to the executive's interpretation of the referendum.
      *   *Constitutional Reality:* The courts correctly identified that the executive could not use prerogative powers to override statutory rights (European Communities Act 1972).

  The tragedy of Brexit, viewed through this lens, is that actors tried to satisfy populist demands within a liberal constitutional framework. This led to the paralysis of 2017–2019, where the government could not satisfy the "pure will" (because it was impossible) and Parliament could not satisfy the "populist mandate" (because it was illegal to ignore procedure).

  #### 6. Conclusion: The Hollowness of the "Will"
  The Brexit episode does not confirm the populist concept of the "will of the people"; it refutes its coherence and reveals its function as a rhetorical weapon.

  *   **Refutation of Homogeneity:** Brexit demonstrated that "the people" do not have a single will. They have conflicting preferences that a binary vote cannot resolve. The idea that 52% of voters on a single day constitute a monolithic entity with a specific policy mandate is empirically false.
  *   **Rhetorical Work:** The concept of the "will of the people" did work, but not as a descriptive tool. It worked as a **silencing mechanism**. By claiming to embody the "will," Brexiteers could delegitimize opposition without engaging in argument. If you oppose the policy, you oppose the people.
  *   **The Empty Signifier:** Ultimately, the "will of the people" in Brexit was an empty signifier. It had no content until the government filled it with specific policy choices (Hard Brexit). Once those choices led to difficulties, the "will" was invoked again to prevent reconsideration.

  Brexit reveals that the populist "will of the people" is not a pre-existing fact waiting to be discovered in a ballot box. It is a political construct created *after* the vote to justify power. The episode shows that treating a plebiscite as a direct transmission of the popular will is incompatible with complex governance, leading not to the empowerment of the people, but to the concentration of power in the hands of those who claim to speak for them.
