prompt: |-
  Analyze the 2016 Brexit referrendum as a case study for populism's idea of the will of the people. I know the basic facts: leave won 52-48 on about 72% turnout, the referendum was legally advisory, and the result was treated as a mandate. What I want is a careful mapping using the standard account of populism as a thin ideology that splits society into a pure people and a corrupt elite and treats the people's will as something you can read directly off a popular vote. Who is the people in this case — all voters, the 52%, the ones who stayed home, the nation as a whole — and what exactly is the will? Does the 48% count as part of the people or get recast as the elite? Then say what the lens gets right about how the result was used, where it breaks against the legal and political reality (the advisory status, parliamentary sovereignty, the fact that the leave coalition contained incompatible visions of what leaving meant), and what each actor should have done by the lights of the theory once the result was in. Finish with what the episode shows about the concept itself: does Brexit confirm it, refute it, or reveal that the will of the people was doing rhetorical work it couldnt actually support?
