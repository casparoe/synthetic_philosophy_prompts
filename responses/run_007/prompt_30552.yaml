      *   (5) Skepticism about Dispositions: Finitude, error, normativity gap.
      *   (6) Interim Conclusion: None of the three candidates work.
      *   (7) Generalization Premise: If not these three, then no fact.
      *   (8) Skeptical Conclusion: No fact of the matter about meaning.
