      *   *Stacking the Deck:* It assumes *all* civilizations share the same axioms (survival above all). It assumes *no* mechanism for verification or trust-building is possible across light-years. It assumes technological explosions are unpredictable and dangerous enough to warrant immediate genocide.

  5.  **Separate Empirical vs. Strategic:**
      *   *Empirical:* Why is the sky silent? Answer: Everyone is hiding.
      *   *Strategic:* If we detect someone, should we shoot? Answer: Yes.
