      *   *Key Insight:* The debate isn't about definition; it's about **resistance**. Hart wants a concept that lets us say "This is law but I won't obey." Fuller wants a concept that lets us say "This isn't law so I don't have to obey."
      *   *Wait, is that right?* Fuller says if it violates internal morality, it's not law. Hart says it is law.
      *   *Better Diagnosis:* It is a disagreement about **what kind of failure constitutes a conceptual failure**. Hart thinks moral failure is external. Fuller thinks procedural failure is internal/conceptual.
