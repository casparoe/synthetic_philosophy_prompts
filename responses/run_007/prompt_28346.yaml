      *   Can a theory about the limits of X be subject to the limits of X without being invalidated? Yes. Consider evolutionary epistemology: "All knowledge is evolved." Is that statement evolved? Yes. Does that make it false? No, it makes it contingent but potentially reliable.

  4.  **Formulate a Definite Position:**
