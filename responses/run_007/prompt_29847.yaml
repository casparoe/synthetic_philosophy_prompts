      *   **The Counterfactual:** Why does Schopenhauer claim music would still be significant even if the physical world (world of representation) didn't exist?
      *   **Constraint:** No biographical/historical background. Focus on the *conceptual move*.
      *   **Requirement:** Explain the underlying picture and explicitly spell out internal tensions (don't smooth them over).

