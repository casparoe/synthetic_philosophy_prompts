      *   *Initial thought:* Say ordinary cases are totally different.
      *   *Correction:* Too strong. They share the logic of commitment, but the *payoff structure* differs (iterated vs. one-off). Need to be precise here.
      *   *Key Terminology:* Ensure terms like "ex ante," "ex post," "time-inconsistency," and "constrained maximisation" are used correctly.

  9.  **Final Plan:**
      *   Validate the professor's intuition (this is Kavka's Paradox).
      *   Pinpoint Premise (3) as the primary culprit (narrow rationality).
      *   Explain the "Dispositional" counter-argument.
