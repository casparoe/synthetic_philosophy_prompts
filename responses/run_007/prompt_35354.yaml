          *   *Nuance:* Even in nuclear cases, there are smaller escalatory steps (conventional war, limited nuclear strike) where reputation matters.

      *   *Refining Premise 1 (Credibility):*
          *   Does the adversary need to believe I am rational in the narrow sense? Or just that I *will* do it?
