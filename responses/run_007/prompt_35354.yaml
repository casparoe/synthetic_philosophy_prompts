  *(Self-Correction on British English)*: Check words like "defense/defence", "offense/offence", "rationalize/rationalise", "program/programme". Ensure "s" instead of "z" where appropriate for Oxford spelling conventions usually expected in UK academia, though standard British English is fine. I will stick to standard British conventions (e.g., "rationalise", "defence").

