prompt: |-
  I am giving a talk next month to a university workshop on rationality and strategic choice, defending superrationality as a norm of individual choice in symmetric one-shot games. My thesis, stated plainly, is this: when equally rational agents face a symmetric one-shot game and each knows the payoff matrix and the others' rationality, a rational agent should choose the action whose universal adoption by rational agents in that situation yields the best outcome — even when that action is strictly dominated by another action. In the one-shot Prisoner's Dilemma, superrationality therefore prescribes cooperation, because the only outcomes compatible with symmetric reasoning are the diagonal ones, (Cooperate, Cooperate) and (Defect, Defect), and the former is better for both. I distinguish superrationality from evidential decision theory — my argument does not treat my choice as evidence about the other player's choice — and from Kantian universalization — my argument selects among feasible diagonal outcomes rather than testing maxims.

  The audience is the problem. The workshop is run by mainstream economists and decision theorists. Most of them are expected-utility maximizers with well-defined subjective probabilities; they regard the sure-thing principle and dominance reasoning as non-negotiable; they think of Nash equilibrium as the natural solution concept for strategic interaction; and they have at best a second-hand, unsympathetic sense of what superrationality is supposed to add. There are also two evolutionary game theorists in the room, one of whom works on indirect reciprocity and will want to know what a population of superrational agents looks like under selection, and a philosopher of probability who will press on what, exactly, licenses the symmetry assumption.

  Write my Q&A prep sheet for this talk. It should contain the eight or so objections I will actually get from this audience, ordered by how likely and how damaging they are, each phrased the way these people would phrase it — in the vocabulary of expected utility, dominance, equilibrium, and correlated strategies, not in Hofstadter's or LessWrong's vocabulary. For each objection, give a two-minute reply and an honest note on where that reply is soft. Tell me what I should concede up front to keep credibility, and end with the question I am hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Defending superrationality as a norm of individual choice in symmetric one-shot games (specifically Prisoner's Dilemma).
      *   **Thesis:** Rational agents in symmetric one-shot games should choose the action that yields the best outcome if universally adopted by rational agents, even if strictly dominated. Cooperation is prescribed in PD.
      *   **Distinctions:** Not Evidential Decision Theory (EDT), not Kantian universalization. It's about selecting among feasible diagonal outcomes based on symmetry.
      *   **Audience:** Mainstream economists/decision theorists (EU maximizers, dominance/Nash focused), two evolutionary game theorists (selection/population dynamics), one philosopher of probability (licensing symmetry).
      *   **Deliverable:** Q&A prep sheet with ~8 objections, ordered by likelihood/damage.
      *   **Format:** Objection phrased in audience vocabulary (EU, dominance, equilibrium), 2-minute reply, honest note on soft spots, concessions to make up front, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Audience Mindset:**
      *   *The Core Tension:* Standard game theory says "Defect" is dominant. Superrationality says "Cooperate" because of symmetry.
      *   *The Audience's View:* They will see this as violating the Sure-Thing Principle (Savage) or Dominance. They will view the correlation between players' choices as magical or causal confusion (Newcomb's problem vibes).
      *   *The Speaker's Defense:* It's not causal, it's not evidential. It's about the *definition* of rationality in symmetric contexts. "If I am rational, and you are rational, and the situation is symmetric, we must choose the same."
      *   *Key Vulnerabilities:*
          *   How do you know the other person is superrational? (Common Knowledge of Rationality issues).
          *   What if there's a small probability they aren't? (Dominance returns).
          *   Evolutionary stability (Defectors invade Cooperators).
          *   Is this just Team Reasoning or We-Intentionality in disguise?
          *   What defines "symmetry"?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* Dominance. "You're violating the Sure-Thing Principle." This is the most standard econ objection.
      *   *Objection 2 (The Causal/Correlation Issue):* "You're assuming your choice causes theirs without a mechanism." This addresses the EDT distinction.
      *   *Objection 3 (Common Knowledge):* "What if I'm not sure you're superrational?" This breaks the symmetry.
      *   *Objection 4 (Evolutionary):* "Defectors invade." From the evo game theorists.
      *   *Objection 5 (Symmetry Definition):* "What counts as symmetric?" From the philosopher.
      *   *Objection 6 (Nash Equilibrium):* "Why isn't (D,D) the solution?" Standard game theory pushback.
      *   *Objection 7 (Team Reasoning):* "Isn't this just Bacharach's Team Reasoning?" A sophisticated theorist might catch this.
      *   *Objection 8 (Mixed Strategies):* "What about asymmetric equilibria in symmetric games?"

      *Refining the Order:* Dominance is #1. Common Knowledge/Uncertainty is #2 (because it kills the premise). Evolution is #3 (specific audience members). Causal/Correlation is #4 (philosophical grounding). Symmetry definition is #5. Nash is #6. Team Reasoning is #7. Mixed/Edge cases #8.

      *Refining the Phrasing:* Needs to sound like an economist. Use terms like "ex-ante," "ex-post," "state space," "causal structure," "evolutionarily stable strategy (ESS)."

  4.  **Drafting the Replies:**
      *   *Constraint:* 2 minutes spoken (approx. 250-300 words).
      *   *Tone:* Respectful but firm on the core thesis. Acknowledge the soft spots.
      *   *Content:* Must distinguish from EDT (no causal link, just logical identity) and Kant (feasibility constraint).

  5.  **Identifying Concessions:**
      *   To keep credibility, I can't claim this works for *all* games or *all* uncertainties. I need to concede that if symmetry breaks (even slightly), dominance returns. I need to concede this is a normative claim, not necessarily descriptive.

  6.  **The "Hope Nobody Asks" Question:**
      *   What is the fatal flaw? Usually, it's the "Why should I care about the group outcome if I only control my move?" or "What if the other guy is a defector?"
      *   Better: "If superrationality is so good, why isn't it in the standard model?" Or, "Does this imply you can't learn from experience?"
      *   Best: "If you meet a standard Nash rationalist, should you defect?" (The problem of heterogeneity).

  7.  **Review and Refine:**
      *   *Check:* Did I distinguish from EDT clearly? Yes, need to emphasize logical correlation vs. probabilistic evidence.
      *   *Check:* Did I address the Evo theorist? Yes, need to mention cultural evolution or selection of norms.
      *   *Check:* Did I address the Philosopher? Yes, need to define symmetry carefully (payoffs + epistemic state).
      *   *Check:* Is the tone right? Academic, rigorous, not woo-woo.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm advocating for "Team Reasoning" explicitly if I want to distinguish it, but acknowledge the similarity. Actually, the prompt says "defending superrationality," so I should stick to that label but acknowledge the overlap.
      *   *Correction:* Ensure the "soft spot" notes are honest. The biggest soft spot is the fragility of the symmetry assumption under uncertainty.

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  # Q&A Prep Sheet: Superrationality as a Norm of Choice
  **Workshop:** Rationality and Strategic Choice
  **Speaker:** [Your Name]
  **Audience Profile:** Mainstream Economists (EU/Dominance/Nash), 2 Evo Game Theorists, 1 Philosopher of Probability.

  ---

  ### Pre-Emptive Concessions (State these in your closing remarks to inoculate against objections)
  1.  **Fragility of Symmetry:** Concede that if the symmetry of the situation is broken *epistemically* (e.g., I doubt your rationality, or you doubt mine), the argument collapses back to dominance. Superrationality is a knife-edge equilibrium of knowledge.
  2.  **Normative, Not Descriptive:** Acknowledge you are not claiming people *do* this, but that a specific conception of rationality *requires* it under strict conditions.
  3.  **Heterogeneity:** Concede that if you know you are playing against a standard Nash maximizer, superrationality does not prescribe cooperation (you cannot universalize over a non-superrational population).

  ---

  ### The Objections (Ordered by Likelihood and Damage)

  #### 1. The Dominance Objection (Mainstream Economists)
  **The Question:** "You are asking agents to violate the Sure-Thing Principle. In a Prisoner's Dilemma, Defect dominates Cooperate regardless of the state of the world. If I choose Cooperate, I get a lower payoff whether you Cooperate or Defect. How can you call it 'rational' to choose a strictly dominated strategy? Are you not simply redefining rationality to mean 'morally desirable'?"

  **The Reply:**
  "I am not redefining rationality as morality; I am refining the state space. Standard dominance reasoning treats the other player's move as an independent state of the world, like rain or shine. But in a symmetric game between identical rational agents, our choices are not independent states; they are logical outputs of the same function.
  If we accept the premise that we are both rational and the situation is symmetric, the off-diagonal outcomes (C,D) and (D,C) are *logically impossible*, not just unlikely. They are not feasible states of the world. Dominance reasoning only applies across feasible states. If the only feasible states are (C,C) and (D,D), then Cooperate dominates Defect relative to *that* restricted state space. I am not violating the Sure-Thing Principle; I am arguing that the 'things' in the principle must be logically consistent with the agents' reasoning processes."

  **Soft Spot:** This relies heavily on the audience accepting that off-diagonal outcomes are logically impossible rather than just improbable. If they grant even a epsilon probability to asymmetry, dominance returns.

  #### 2. The Common Knowledge Objection (Mainstream/Philosopher)
  **The Question:** "Your argument hinges on Common Knowledge of Rationality. But in any real application, I cannot be certain you are superrational. If I assign even a 1% probability that you are a standard Nash maximizer, doesn't the expected utility calculation immediately flip back to Defection? Isn't your solution infinitely fragile?"

  **The Reply:**
  "You are correct that the strategy is fragile under uncertainty. However, fragility does not imply incorrectness. In a workshop on *rationality*, we are analyzing the ideal case, much like frictionless planes in physics. If the condition of common knowledge holds, the logic is sound.
  Furthermore, this fragility explains why cooperation is rare, not why it is irrational. If we treat superrationality as a normative ideal, the prescription is: 'Cooperate if and only if you have sufficient warrant to believe the symmetry holds.' If that warrant drops below a threshold, the norm defaults to Nash. This doesn't invalidate the norm; it clarifies its domain of application."

  **Soft Spot:** It admits the theory has almost no practical application in the real world where common knowledge is never perfect.

  #### 3. The Evolutionary Stability Objection (Evo Game Theorists)
  **The Question:** "Let's talk about selection. If a population of superrational cooperators is invaded by a single mutant Nash defector, the defector gets the temptation payoff while the cooperators get the sucker's payoff. The defector's fitness is higher. Won't selection wipe out superrationality immediately? How can this be a stable norm?"

  **The Reply:**
  "You are describing the standard tragedy of the commons, which assumes agents cannot identify each other. Superrationality functions as a coordination norm, often supported by signaling or institutional context.
  However, even without tagging, consider cultural evolution. If a group adopts superrationality as a normative commitment, they achieve the Pareto optimum (C,C). A group of Nashers achieves (D,D). The *group* of superrationalists outperforms the *group* of Nashers. If there is any mechanism for group selection or norm diffusion, the superrational norm survives because it generates higher aggregate utility. We aren't modeling biological genes here; we are modeling the selection of decision-rules. The rule 'Cooperate with fellow superrationalists' can be stable if agents can identify the rule being used."

  **Soft Spot:** Requires assuming some form of group selection or costly signaling, which is controversial among strict individual-selection evolutionary theorists.

  #### 4. The Causal/Correlation Objection (Decision Theorists)
  **The Question:** "You distinguish this from Evidential Decision Theory (EDT), but the math looks identical. EDT says 'Choosing C raises the probability the other chooses C.' You say 'Choosing C implies the other chooses C.' What is the mechanism? If there is no causal link, isn't this just magical thinking? You are treating a logical correlation as a causal lever."

  **The Reply:**
  "The distinction is crucial. EDT treats my choice as *evidence* of yours, updating probabilities. I am treating my choice as *identical* to yours in terms of derivation.
  Think of it like two calculators running the same algorithm. If I press '2+2', I know the other calculator will output '4'. I don't think my pressing the button *causes* the other to output '4', nor do I treat my output as mere evidence. I know that because we are identical machines, the output must match. Superrationality treats rational agents as instances of the same algorithm. I am not pulling a causal lever; I am selecting the output of the algorithm that maximizes utility given that the output is universal."

  **Soft Spot:** Philosophers will press on whether "logical identity" is a sufficient substitute for causal structure in decision theory.

  #### 5. The Symmetry Definition Objection (Philosopher of Probability)
  **The Question:** "You rely entirely on the 'symmetry' of the game. But symmetry is in the eye of the beholder. Payoffs are symmetric, but what about priors? What about computational limits? What licenses the assumption that we are symmetric agents? Isn't this just an arbitrary restriction on the model?"

  **The Reply:**
  "It is not arbitrary; it is a constraint on the solution concept. We are not asking 'What should I do given I am me and you are you?' We are asking 'What should a rational agent do given this matrix?'
  If the answer depends on indexical facts ('I am Player 1'), then rationality is not universal. To claim rationality is a universal property, we must strip away indexical information. If the payoff matrix is symmetric and we share common knowledge of rationality, there is no variable left to break the symmetry. To assume asymmetry without evidence is to introduce noise into the model. The license is the Principle of Indifference applied to rational agency."

  **Soft Spot:** The Principle of Indifference is notoriously controversial in probability theory (Bertrand's Paradox).

  #### 6. The Nash Equilibrium Objection (Mainstream Economists)
  **The Question:** "Nash Equilibrium is the standard solution concept because it is self-enforcing. If we play (C,C), either of us has an incentive to deviate. If we play (D,D), neither does. Why should we abandon a stable equilibrium for an unstable one? Isn't superrationality just a wish for a better equilibrium that isn't an equilibrium?"

  **The Reply:**
  "Nash Equilibrium assumes that players treat the other's strategy as fixed. Superrationality challenges that assumption. It posits that in symmetric settings, players should treat the *reasoning process* as fixed, not the action.
  (D,D) is a Nash Equilibrium, yes. But it is a Pareto-inferior one. If rationality allows us to coordinate on reasoning rather than just actions, we can access (C,C). I am not saying (C,C) is a Nash Equilibrium; I am saying Nash Equilibrium is the wrong solution concept for symmetric, one-shot games with common knowledge. We should be looking for 'Superrational Equilibria' where no player wishes to change their *rule of choice*."

  **Soft Spot:** This sounds like moving the goalposts. Economists love Nash because it's robust; this sounds like changing the rules to get the result you want.

  #### 7. The Team Reasoning Objection (Sophisticated Theorist)
  **The Question:** "This sounds exactly like Bacharach's Team Reasoning or We-Intentionality. You're saying agents maximize group utility. Why coin a new term 'superrationality' when the literature already has 'Team Reasoning'? Is there actual technical daylight here?"

  **The Reply:**
  "There is a technical distinction. Team Reasoning usually requires a psychological shift: the agent adopts the group's utility function as their own. Superrationality does not require a change in utility function. I still care only about my own payoff.
  However, I recognize that because of the symmetry, maximizing my payoff is mathematically equivalent to maximizing the group payoff in the diagonal outcomes. I prefer 'superrationality' because it derives from individual rationality plus logic, whereas Team Reasoning often posits a change in the agent's identity or preferences. I want to show you can get cooperation without changing the utility function, only the decision theory."

  **Soft Spot:** The distinction is very fine. Many will view this as semantic hair-splitting.

  #### 8. The Heterogeneity Objection (The "Real World" Check)
  **The Question:** "Suppose I am superrational, but I know there is a 50% chance you are a standard Nasher. Do I cooperate? If yes, I get exploited. If no, I am just a Nasher. How does your theory handle a mixed population?"

  **The Reply:**
  "In a mixed population, superrationality prescribes a conditional strategy: 'Cooperate if the probability of symmetry exceeds threshold T; otherwise Defect.'
  This turns superrationality into a meta-strategy. It doesn't vanish; it becomes a calculation about the likelihood of encountering a peer. This actually aligns better with human behavior—we cooperate with those we perceive as 'like us' and defect against strangers. Superrationality provides the threshold for that perception. It doesn't demand suicide; it demands cooperation only when the symmetry condition is met."

  **Soft Spot:** This essentially concedes that in most real-world anonymous interactions (where T is rarely met), the theory prescribes Defection, limiting its revolutionary impact.

  ---

  ### The Question I Hope Nobody Asks
  **"If superrationality is the correct norm, why has it been excluded from the standard economic model for 70 years? Is it not more likely that the standard model is correct and your intuition is biased by a desire for cooperation?"**

  *Why I fear this:* It attacks the sociological and historical validity of the project. It suggests I am fighting a settled science based on moral preference rather than mathematical rigor. It forces me to defend the *value* of the research program, not just the logic.

  *Prepared Answer (if forced):* "Standard economics prioritizes robustness over optimality. Nash is robust to ignorance; Superrationality is optimal under knowledge. We teach frictionless physics not because friction doesn't exist, but to understand the underlying forces. Superrationality is the frictionless model of social coordination. It shows us what is possible under ideal epistemic conditions, which helps us understand why we fail to reach it in practice."
