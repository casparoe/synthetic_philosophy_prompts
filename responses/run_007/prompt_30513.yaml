prompt: |-
  I am working through Maimonides' treatment of animal sacrifice in the Guide of the Perplexed, Part III, Chapter 32, and I want to understand exactly what kind of claim he is making in the following passage, from Friedländer's translation:

  "But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them; religious and ascetic persons were in those days the persons that were devoted to the service in the temples erected to the stars, as has been explained by us. It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action. For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings, and of things imaginary and unreal, and commanded us to serve Him in the same manner; viz., to build unto Him a temple; comp. “And they shall make unto me a sanctuary” (Exod. xxv. 8); to have the altar erected to His name; comp. “An altar of earth thou shalt make unto me” (ibid. xx. 21); to offer the sacrifices to Him; comp. “If any man of you bring an offering unto the Lord” (Lev. i. 2), to bow down to Him and to burn incense before Him. He has forbidden to do any of these things to any other being; comp. “He who sacrificeth unto any God, save the Lord only, he shall be utterly destroyed” (Exod. xxii. 19); “For thou shalt bow down to no other God” (ibid. xxxiv. 14). He selected priests for the service in the temple; comp. “And they shall minister unto me in the priest’s office” (ibid. xxviii. 41). He made it obligatory that certain gifts, called the gifts of the Levites and the priests, should be assigned to them for their maintenance while they are engaged in the service of the temple and its sacrifices. By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established; this result was thus obtained without deterring or confusing the minds of the people by the abolition of the service to which they were accustomed and which alone was familiar to them."

  I am trying to get clear on three connected points. First, is Maimonides saying that the sacrificial cult is only a concession to the historical circumstances of the Israelites, so that its ultimate point would be to lead them away from sacrifice, or is he still treating these as commandments with a permanent positive value? Second, what exactly is the analogy to the gradual development of natural things doing in his argument? Is it a claim about how God must act, a claim about human psychology, or an explanatory comparison rather than a justificatory premise? Third, how should one handle the apparent tension between saying that God commanded these practices and saying that they were allowed only because the people could not suddenly abandon them? I want an analysis of the passage's argumentative structure, not a general overview of Maimonides' views or a survey of later debates. Please attend closely to the wording, especially the terms "allowed," "transferred," and "commanded us to serve Him in the same manner."
