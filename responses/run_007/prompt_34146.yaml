  # Diagnostic Decision Tree: The Badness of Death

  **Instructions:** Answer each question based on your intuition about the case described. Do not worry about philosophical labels; answer "Yes" or "No" based on what seems true to you. Follow the arrows to find your position.

  ### **Node 1: The Missed Cure**
  **Case:** A person dies at age 20. Tomorrow, a cure arrives that would have restored them to health, allowing them to live happily to age 80.
  **Question:** Is this death bad *for the person who died*?
  *   **No** → Go to **Node 3**.
  *   **Yes** → Go to **Node 2**.

  ---

  ### **Node 2: The Time Before Birth**
  **Case:** Consider the 100 years before this person was born. They did not exist then, just as they do not exist now.
  **Question:** Is that time before birth bad for them in the *same way* their death at 20 is bad?
  *   **Yes** → **Leaf 1**.
  *   **No** → Go to **Node 5**.

  ---

  ### **Node 3: Dreamless Unconsciousness**
  **Case:** Imagine this person had instead fallen into a dreamless coma for one year and then woken up unchanged.
  **Question:** Was that year bad for them *while they were in the coma*?
  *   **Yes** → **Leaf 2**.
  *   **No** → Go to **Node 4**.

  ---

  ### **Node 4: Cryonic Suspension**
  **Case:** Imagine this person was frozen in cryonic suspension for 100 years and then successfully revived.
  **Question:** Is that time frozen bad for them *while they are suspended*?
  *   **Yes** → **Leaf 3**.
  *   **No** → **Leaf 4**.

  ---

  ### **Node 5: Posthumous Reputation**
  **Case:** After the person dies, enemies destroy their life's work and slander their name. They never know this happens.
  **Question:** Is this destruction bad *for the person who died*?
  *   **Yes** → **Leaf 5**.
  *   **No** → Go to **Node 6**.

  ---

  ### **Node 6: The Unwanted Future**
  **Case:** Return to the death at 20. Suppose the person was exhausted and desperately *wanted* to die, but the 60 years they missed would have been happy.
  **Question:** Is death bad for them?
  *   **No** → **Leaf 6**.
  *   **Yes** → Go to **Node 7**.

  ---

  ### **Node 7: The Miserable Future**
  **Case:** Return to the death at 20. Suppose the person *wanted* to live, but the 60 years they missed would have been mostly painful and dreary.
  **Question:** Is death bad for them?
  *   **Yes** → **Leaf 7**.
  *   **No** → **Leaf 8**.

  ---

  ## **Position Leaves**

  **Leaf 1: Symmetric Deprivationist**
  *   **Diagnosis:** Merely Unattractive (Few accept this asymmetry reversal).
  *   **Awkward Commitment:** You must lament the infinite time you were not born earlier just as much as you fear death.

  **Leaf 2: Inconsistent Experientialist**
  *   **Diagnosis:** Incoherent (Violates the no-subject constraint applied to death).
  *   **Awkward Commitment:** You claim non-existence is harmless in death but harmful in sleep, despite the subjective experience being identical.

  **Leaf 3: Inconsistent Continuity Theorist**
  *   **Diagnosis:** Incoherent (Privileges temporary interruption over permanent cessation without reason).
  *   **Awkward Commitment:** You claim being frozen for a century is bad, but ceasing to exist forever is not.

  **Leaf 4: Strict Epicurean**
  *   **Diagnosis:** Occupied (Standard Epicurean view).
  *   **Awkward Commitment:** You must deny that a young person dying is any worse for them than a long, dreamless nap.

  **Leaf 5: Posthumous Harm Theorist**
  *   **Diagnosis:** Unexplored (Often combined with Deprivationism, rarely held alone).
  *   **Awkward Commitment:** You must explain how events can harm a subject who no longer exists to be the locus of that harm.

  **Leaf 6: Desire-Satisfactionist**
  *   **Diagnosis:** Occupied (Standard Desire view).
  *   **Awkward Commitment:** Death is not bad for the suicidal person, even if they are mistaken about their future happiness.

  **Leaf 7: Absolute Deprivationist**
  *   **Diagnosis:** Occupied (Standard Deprivationist view).
  *   **Awkward Commitment:** It is bad for you to die even if your continued life would have been unbearable.

  **Leaf 8: Threshold Deprivationist**
  *   **Diagnosis:** Occupied ("Worth Continuing" view).
  *   **Awkward Commitment:** Death ceases to be bad the moment your future life dips slightly below neutrality, even if you want to live.

  ---

  ## **Limitations and Unseparated Positions**

  **1. Posthumous Harm vs. Deprivation**
  *   **Issue:** The tree isolates **Leaf 5** for those who affirm Posthumous Harm but does not distinguish those who accept *both* Posthumous Harm and Deprivation (Node 7) from those who accept *only* Posthumous Harm.
  *   **Further Question:** "If the person's reputation remains intact but they lose 60 happy years, is death still bad?" (Yes = Deprivationist + Posthumous; No = Pure Posthumous).

  **2. Actual vs. Informed Desires**
  *   **Issue:** **Leaf 6** groups all Desire theorists together. It does not separate those who focus on *actual* desires (even irrational ones) from those who focus on *informed* desires (what you would want if rational).
  *   **Further Question:** "If the person irrationally wants to die, but would want to live if they knew the future, is death bad?" (Yes = Informed Desire; No = Actual Desire).

  **3. Unoccupied Combinations**
  *   **Leaf 1 (Symmetric Deprivationist):** While logically coherent, this position is rarely occupied by those who affirm death is bad; most adopt asymmetry to avoid the absurdity of lamenting prenatal non-existence.
  *   **Leaf 2 & 3 (Inconsistent Views):** These combinations are diagnosed as incoherent because they apply conflicting criteria to phenomenologically identical states (non-experience) or temporally distinct interruptions (temporary vs. permanent).
