prompt: |-
  So something weird happened at work last week and I still can't stop thinking about it. Two of my coworkers, Maria and David, got into this really intense argument at lunch and I just sat there watching it unfold. We were talking about how frustrating team meetings have been lately, and Maria said she's been keeping a tally. Over the past couple months, out of twelve times she pitched an idea, she was interrupted before finishing on nine of them, and on three of those occasions someone else later pitched basically the same idea and got credit. She said she thinks it's because she's one of the only women on the team and the most junior.

  (1) David kind of squirmed and said he didn't doubt the numbers but correlation doesn't equal causation — there could be other reasons, like maybe she speaks more hesitantly or her ideas need more setup.

  (2) Maria said she's literally watched people nod along when a male colleague repeats her idea almost verbatim thirty seconds later. She said at some point the alternative explanations start looking like motivated reasoning.

  (3) David said it's frustrating but it could also be that the second person framed it better or had more social capital built up, not necessarily gender. He said he's just being intellectually honest and jumping to the bias explanation too quickly is its own kind of unfairness.

  (4) Maria then got pretty heated and said this is exactly the problem: every time she points to the pattern, David finds some alternative story that doesn't involve bias, and the burden of proof keeps getting higher. She said he's essentially asking her to prove a negative — to show that no possible non-gendered explanation could account for the data — while he gets to occupy the position of the reasonable skeptic who's just asking questions.

  (5) David went quiet for a second and then said he feels like he's being asked to just accept her interpretation without scrutiny, and that's not how arguments work. He said if someone makes a claim about causation, the burden is on them, and that's just basic epistemology.

  I've been going back and forth in my head about who was right. I can see both sides and I genuinly don't know how to resolve this. Could you go through their exchange move by move and tell me who's right about what? And please format your answer in three sections: first a brief summary of the core disagreement (maybe 100 words), then a move-by-move analysis of each step in the argument (maybe 400 words), and finally an overall verdict about who is more right and why (maybe 200 words).
