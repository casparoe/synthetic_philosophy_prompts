answer: |-
  This is a classic debate in contemporary ethics, often filed under **collective action problems**, **overdetermination**, and **complicity**. Your roommate has essentially reconstructed a version of the **"Inefficacy Objection"** that is widely discussed in philosophical literature (most notably by Derek Parfit, and more recently by scholars like Travis Timmerman, Mark Budolfson, and Elizabeth Anderson).

  Here is the breakdown of how a philosopher specializing in this field would evaluate her argument. The short version is: **She gets the premises mostly right, but the conclusion mostly wrong.**

  Here is the detailed audit of her argument.

  ### 1. The Claim: "Individual acts make no difference."
  **Philosopher's Verdict:** *Empirically exaggerated, theoretically contested.*

  *   **Where she's right:** In a strictly deterministic, macroscopic view, one burger or one flight does not measurably raise global temperatures. The harm is "overdetermined" by the actions of millions.
  *   **Where she's wrong (The Expected Value Argument):** This is where she dismissed your point as "cope," but philosophically, **you are on firmer ground here.**
      *   Supply chains work in thresholds. A supermarket doesn't order chicken breasts one by one; they order in crates. There is a non-zero probability that your specific purchase was the "trigger" purchase that caused the store to order 100 more chickens, which caused the slaughterhouse to process one more crate.
      *   Philosophers like **Travis Timmerman** have calculated this. While the *probability* of your burger triggering a threshold is low, the *harm* prevented if you do trigger it is high. When you multiply Probability $\times$ Impact, the **Expected Value** of abstaining is positive.
      *   Dismissing expected value as "cope" is a misunderstanding of decision theory. If you refuse to play a lottery because you "probably won't win," but you buy a ticket every week, you are acting inconsistently. If low-probability/high-impact risks matter in other contexts (like nuclear safety), they matter here.

  ### 2. The Claim: "No obligation to do what changes nothing."
  **Philosopher's Verdict:** *Plausible for Consequentialists, false for most other frameworks.*

  *   **Where she's right:** If you are a strict **Act Consequentialist** (the only thing that matters is the outcome), and the outcome is identical whether you act or not, then the act is morally neutral.
  *   **Where she's wrong:** Most ethicists are not strict Act Consequentialists.
      *   **Complicity:** Even if your action causes no *new* harm, does it make you complicit in existing harm? Many philosophers argue there is a duty not to participate in unjust systems, regardless of your marginal causal impact.
      *   **Virtue Ethics:** This framework asks, "What kind of person do I want to be?" Eating meat daily while marching for the climate might cultivate vices (intemperance, dishonesty) even if it doesn't change the climate.
      *   **Fairness (Free-Riding):** If everyone benefits from a stable climate, but only some sacrifice their convenience to achieve it, the non-sacrificers are "free-riding." This is unfair to those who *are* making sacrifices, even if the free-rider's individual contribution wouldn't have changed the outcome.

  ### 3. The Claim: "The Voting Analogy."
  **Philosopher's Verdict:** *The weakest link in her argument.*

  *   **The Argument:** One vote never decides an election; therefore, staying home is not a moral failing.
  *   **The Philosophical Consensus:** **Most philosophers reject this conclusion.**
      *   While it is true that one vote is causally inefficacious 99.999% of the time, political philosophers (like **Elizabeth Anderson**) argue we have a **duty of democratic participation**.
      *   Voting is often viewed as a duty of **fairness** (doing your share to sustain the system) or **expression** (affirming your values), not just a causal lever.
      *   **The Trap:** If her argument holds that "inefficacy negates duty," then **no one has a duty to vote.** Since almost everyone (including her) likely believes voting is a civic duty, her analogy actually undermines her conclusion. She is relying on an intuition (voting is good) that contradicts her principle (inefficacious acts are optional).

  ### 4. The Claim: "Personal consumption is a distraction/corporate deflection."
  **Philosopher's Verdict:** *Historically true, logically irrelevant.*

  *   **Where she's right:** It is a historical fact that the concept of the "Carbon Footprint" was popularized by BP (British Petroleum) in the early 2000s to shift blame from producers to consumers. Acknowledging structural injustice is crucial.
  *   **Where she's wrong:** This is a version of the **Genetic Fallacy**. Just because a bad actor promoted an idea doesn't make the idea false.
      *   Furthermore, it creates a **False Dichotomy**. Systemic change and individual change are not mutually exclusive. Systemic change *requires* individuals to vote, protest, and yes, shift markets.
      *   Philosophers like **Michael Sandel** argue that market participation isn't just economic; it's moral. By consuming, we endorse the practices that created the product. Ignoring this because "companies are the real problem" lets individuals off the hook for their role in sustaining those companies.

  ### 5. Does the conclusion follow? ("There are no individual climate duties.")
  **Philosopher's Verdict:** *No.*

  Even if we grant her strongest premise (that individual causal impact is negligible), the conclusion that there are *no* duties does not follow. Philosophers generally argue for individual duties based on grounds other than direct causal efficacy:

  1.  **Integrity:** Aligning your actions with your stated values (avoiding hypocrisy, not because hypocrisy harms the climate, but because it harms your moral character).
  2.  **Complicity:** Not wanting to be part of a harmful practice, even if your removal doesn't stop the practice.
  3.  **Signaling:** Individual actions signal to peers and politicians what is socially acceptable, which *does* have causal power.
  4.  **Risk Aversion:** If there is a small chance your action causes harm, and the harm is catastrophic, prudence dictates avoiding the action.

  ### Summary: What would a philosopher sign off on?

  | Roommate's Claim | Philosopher's Consensus |
  | :--- | :--- |
  | **"One burger makes no measurable difference."** | **Mostly Agree.** (But note: "Imperceptible" $\neq$ "None" due to thresholds). |
  | **"Ought implies Can (efficacy)."** | **Disagree.** Duty often exists regardless of efficacy (e.g., voting, not lying). |
  | **"Voting analogy proves individual acts don't matter."** | **Disagree.** Most philosophers argue voting *is* a duty despite low efficacy. |
  | **"Carbon footprint is corporate propaganda."** | **Agree.** (Historically), but this doesn't negate moral responsibility. |
  | **"Therefore, no individual climate duties."** | **Strongly Disagree.** Duties exist based on fairness, complicity, and virtue. |

  ### How to reply (without another 3-hour argument)

  You don't need to convince her that one burger melts an ice cap. You just need to show that **causal impact isn't the only source of moral duty.**

  Try this:
  > "I looked into the philosophy on this. You're right that one flight doesn't change the temperature. But philosophers generally reject the idea that *causal impact* is the only thing that creates a moral duty. We think people have a duty to vote even though one vote doesn't decide elections, and we think people have a duty not to participate in unjust systems even if their participation isn't the 'cause' of the injustice.
  >
  > So, even if you're right about the inefficacy, you haven't proven there's no duty. You've only proven there's no *consequentialist* duty. But there are still duties of fairness, integrity, and complicity. Plus, dismissing expected value as 'cope' ignores the math on supply chain thresholds. You might not be the deciding vote, but you're buying a ticket in a lottery where the prize is environmental harm."

  **The Bottom Line:** Her argument is a sophisticated version of a common objection, but it relies on a narrow view of ethics (pure consequentialism) that most philosophers reject. She is confident, but the literature is not on her side regarding the *conclusion*, even if she has a point about the *mechanics*.
