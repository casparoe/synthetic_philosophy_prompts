answer: |-
  # Prioritarian Commissioning Decision Procedure

  **To:** Commissioning Board Members, Finance Director, and Chair
  **From:** Director of Commissioning
  **Subject:** Monthly Resource Allocation Decision Protocol
  **Date:** October 2023

  ## 1. Purpose and Scope
  This procedure ensures that monthly decisions on shifting spending between population groups are consistent, transparent, and grounded in our agreed ethical framework: **Prioritarianism**.

  **Core Principle:** We prioritise improvements in well-being for those who are worse off. We do not value equality for its own sake. We do not support reducing inequality if it makes everyone worse off or leaves everyone else unchanged (the 'Levelling-Down' constraint).

  **Time Allocation:** This checklist is designed to be completed within 45 minutes of a two-hour meeting, leaving time for discussion and factual review.

  **Roles:**
  *   **The Board:** Provides factual estimates of well-being impact and applies pre-agreed priority weights.
  *   **The Chair:** Resolves deadlocks on value judgements (weights).
  *   **The Finance Director:** Confirms financial feasibility (outside this ethical checklist).

  ---

  ## 2. The Decision Checklist

  **Pre-Meeting Requirement:** The Board must have pre-agreed 'Priority Weights' for each population group (e.g., Severe Needs = 3, Moderate Needs = 2, Well = 1). These are value judgements and should not be renegotiated monthly unless population definitions change.

  ### Step 1: Identify Affected Groups and Direction of Change
  **Question:** Which specific population groups will experience a change in their expected well-being under this proposal?
  **Action:** List every group. For each, state whether their expected well-being will **Increase**, **Decrease**, or **Stay the Same**.
  **Sufficient Answer:** A clear list with a direction of change for every affected group.
  **Stop Condition:** If no groups are identified, the proposal is null.

  ### Step 2: The Levelling-Down Filter (Mandatory Pass/Fail)
  **Question:** Does this proposal make **at least one** population group better off?
  **Action:** Check the list from Step 1.
  *   **If YES:** Proceed to Step 3.
  *   **If NO:** **STOP.** The proposal must be **Rejected**.
  **Reasoning:** Under our prioritarian framework, reducing inequality is not a benefit if no one gains well-being. We do not support 'levelling down'.
  **Hand-off:** None. This is a rule-based filter.

  ### Step 3: Estimate Well-being Impact (Factual Judgement)
  **Question:** What is the magnitude of the change in expected well-being for each affected group?
  **Action:** Estimate the change in 'Well-being Units' (WU).
  *   *If numerical data exists:* Use the projected units (e.g., +10 WU, -5 WU).
  *   *If numerical data is unavailable:* Use a consensus qualitative scale converted to units (e.g., Minor = 1, Moderate = 5, Substantial = 10).
  **Sufficient Answer:** A numerical or converted estimate for every group identified in Step 1.
  **Hand-off:** If the team cannot agree on the factual impact (e.g., clinical evidence is contradictory), pause the decision. Refer to the Clinical Lead for a factual determination before voting. Do not proceed to Step 4 until facts are agreed.

  ### Step 4: Apply Priority Weights (Evaluative Judgement)
  **Question:** What is the Priority Weight for each affected group?
  **Action:** Apply the pre-agreed weight to each group's Well-being Impact from Step 3.
  *   *Calculation:* `Weighted Score = Well-being Impact × Priority Weight`
  *   *Note:* Losses are negative numbers. Gains are positive numbers.
  **Sufficient Answer:** A Weighted Score for each group.
  **Hand-off:** If a Board member challenges the *weight itself* (e.g., "The severe group should be weight 4, not 3"), this is a value dispute. The Chair must decide whether to uphold the pre-agreed policy or call a special vote to change the weights. Do not change weights ad hoc for a single proposal without recording the precedent.

  ### Step 5: Aggregate and Decide
  **Question:** What is the Total Priority-Weighted Score?
  **Action:** Sum the Weighted Scores from Step 4.
  *   **If Total > 0:** **Approve** the proposal.
  *   **If Total < 0:** **Reject** the proposal.
  *   **If Total = 0:** **Reject** the proposal (no net moral gain).
  **Sufficient Answer:** A clear Approve/Reject recommendation based on the sum.
  **Hand-off:** If the result is 'Approve' but the Finance Director confirms the cost is unaffordable, the proposal fails on financial grounds, not ethical ones.

  ---

  ## 3. Application to Current Proposals

  Below is the application of the checklist to the three proposals currently on the agenda.

  ### Case (a): Levelling Down
  *Proposal: Withdraw a service used mainly by a better-off group. Makes that group worse off, makes no other group better off, narrows the gap.*

  *   **Step 1 (Identify):** Better-off group (Decrease). All other groups (Stay the Same).
  *   **Step 2 (Levelling-Down Filter):** Does at least one group get better off? **No.**
  *   **Decision:** **REJECT.**
  *   **Reasoning:** The procedure stops at Step 2. Even though inequality narrows, no one gains well-being. Our framework forbids treating inequality reduction as a good in itself.
  *   **Outcome:** The proposal fails immediately.

  ### Case (b): Unequal Growth
  *Proposal: Substantially improves the worst-off group, but improves a better-off group by even more. Inequality widens.*

  *   **Step 1 (Identify):** Worst-off group (Increase). Better-off group (Increase).
  *   **Step 2 (Levelling-Down Filter):** Does at least one group get better off? **Yes** (Both do). Proceed.
  *   **Step 3 (Facts):** Assume Worst-off gain +10 WU. Better-off gain +20 WU.
  *   **Step 4 (Weights):** Assume Worst-off weight = 3. Better-off weight = 1.
      *   Worst-off Score: +10 × 3 = +30.
      *   Better-off Score: +20 × 1 = +20.
  *   **Step 5 (Aggregate):** Total = +50.
  *   **Decision:** **APPROVE.**
  *   **Reasoning:** The total priority-weighted well-being increases significantly.
  *   **Note on Inequality:** The gap between groups widens (20 vs 10 gain). However, because our framework states equality has no intrinsic value, this widening does not count against the proposal.

  ### Case (c): Priority Transfer
  *Proposal: Transfer resources from moderately ill to severely ill. Moderate loss = 12 WU. Severe gain = 9 WU. Weight for Severe = 3x Moderate.*

  *   **Step 1 (Identify):** Moderately ill group (Decrease). Severely ill group (Increase).
  *   **Step 2 (Levelling-Down Filter):** Does at least one group get better off? **Yes** (Severely ill). Proceed.
  *   **Step 3 (Facts):** Moderate = -12 WU. Severe = +9 WU.
  *   **Step 4 (Weights):** Moderate weight = 1. Severe weight = 3.
      *   Moderate Score: -12 × 1 = -12.
      *   Severe Score: +9 × 3 = +27.
  *   **Step 5 (Aggregate):** Total = +15.
  *   **Decision:** **APPROVE.**
  *   **Reasoning:** The priority-weighted gain (+27) outweighs the priority-weighted loss (-12).
  *   **Unwelcome Outcome:** This decision is likely unwelcome to the Board. It requires actively making the moderately ill group *worse off* (a loss of 12 units) to help the severely ill, even though the *total raw well-being* in the population falls (loss of 12 vs gain of 9).
  *   **Why the Procedure Requires It:** Prioritarianism is not concerned with maximising the *total sum* of well-being (Utilitarianism), but with the *moral value* of that well-being. Because the severely ill are worse off, their gains count for more. The procedure mandates accepting a net loss in raw well-being to achieve a net gain in priority-weighted well-being. To reject this would be to abandon the prioritarian commitment in favour of utilitarianism or harm-aversion.

  ---

  ## 4. Limitations and Residual Judgements

  This procedure is a tool, not a substitute for governance. The Board must be aware of the following constraints:

  **1. What the Procedure Cannot Answer**
  *   **Defining 'Well-being':** The procedure assumes we can measure or estimate well-being. It cannot resolve philosophical disputes about whether well-being is health, happiness, or capability. This must be defined in our strategic plan.
  *   **Setting the Weights:** The procedure separates facts from values, but it does not generate the Priority Weights (e.g., why 3x and not 4x?). These are residual value judgements the Board must own. If the weights feel wrong, the procedure will output a 'correct' but morally unintuitive result.
  *   **Rights and Entitlements:** The procedure is consequentialist. It does not account for individual rights or legal entitlements that might forbid harming a group even if the weighted sum is positive. Legal advice overrides this checklist.

  **2. Where It Will Predictably Misfire**
  *   **Small Numbers:** If a proposal affects a very small number of people with extreme needs versus a large number with moderate needs, the aggregation in Step 5 may obscure the intensity of suffering for the few. The Board should review 'distributional impact' separately if a proposal affects fewer than 100 individuals.
  *   **Uncertainty:** Step 3 requires factual estimates. If evidence is weak, the 'Garbage In, Garbage Out' principle applies. The procedure creates a false sense of precision if the Well-being Units are guessed.

  **3. Residual Judgements for the Board**
  *   **The 'Smell Test':** If Step 5 yields an 'Approve' but the Board feels profound moral discomfort (as in Case c), the Chair should call a 'Value Review'. This does not change the immediate decision but triggers a quarterly review of the Priority Weights.
  *   **Financial Reality:** This procedure assesses moral value, not budgetary sustainability. A proposal can pass this checklist and still be rejected by the Finance Director due to cash flow.
  *   **Political Accountability:** The Board is accountable to the public. A decision that is mathematically correct under this procedure may be politically unsustainable. The Chair retains the discretion to defer a decision if public consultation is required, provided this is not used to bypass the Levelling-Down Filter (Step 2).

  **Signed:**
  Director of Commissioning
