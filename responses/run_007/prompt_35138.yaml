answer: |-
  **Project Title:** The Integrity of Exchange: Distinguishing Moral Compromise from Constitutive Betrayal

  **Project Overview and Research Question**
  In economics, the logic of voluntary exchange is well-understood: agents with divergent preference rankings can achieve mutual improvement through trade without converging on a shared valuation of goods. This dissertation project investigates whether this structure of "gains from trade" applies to moral and political compromise. In contexts ranging from legislative bargaining to international human rights negotiations, parties with incompatible value systems frequently reach agreements. Sometimes, these agreements are celebrated as pragmatic victories that improve the status quo for all sides. At other times, structurally identical agreements are denounced as corrupt betrayals, even by those who secured material concessions.

  The central puzzle is that the difference between a legitimate compromise and a corrupt betrayal cannot be explained merely by the magnitude of the concession. Small concessions on certain issues are often felt as more damaging to integrity than large concessions on others. This suggests that the moral texture of compromise depends on the internal structure of the commitments being traded. My research oscillates between two competing hypotheses: first, that value systems function like partially ordered preference sets where compromise is valid whenever it Pareto-dominates the status quo internal to each system; and second, that this analogy is fundamentally misleading because some commitments are constitutive of the agent, such that trading them alters the identity of the valuer rather than satisfying their values.

  The primary research question is: **What structural features of a moral commitment determine whether it can be subject to trade-offs without violating the agent's integrity?**

  To answer this, I will seek a determinate classification of commitments into those that are *fungible* (amenable to economic-style trade) and those that are *constitutive* (resistant to trade without identity alteration). The goal is not merely to describe when compromise occurs, but to provide a normative criterion for when compromise is coherent from the first-person perspective of the committed agent.

  **The Gap in Existing Literature**
  Current philosophical discussions of compromise leave this question open because they typically approach the phenomenon from the outside in, rather than the inside out.

  First, the literature on **toleration** focuses on the duty to refrain from interfering with opposing views. While this explains coexistence, it does not account for active collaboration or joint decision-making where values are mutually adjusted. Toleration is passive; compromise is transactional.

  Second, the tradition of **modus vivendi** treats compromise as a strategy for stability or peace. This approach explains why agents *might* agree to stop fighting, but it remains agnostic on whether the agreement is experienced as a normative improvement or a necessary evil. It fails to distinguish between a ceasefire born of exhaustion and a settlement born of mutual gain.

  Third, work on **institutional design** focuses on procedures—voting rules, bargaining protocols, and constitutional constraints—that facilitate agreement. While vital, this literature treats the input (the commitments) as black boxes. It assumes that if the procedure is fair, the outcome is legitimate. It does not address the phenomenological and logical problem of how a specific commitment survives the process of bargaining without dissolving.

  None of these approaches adequately addresses the internal logic of the commitment itself. They explain the conditions for agreement, but not the conditions for *integrity-preserving* agreement. My project fills this gap by analyzing the ontology of the commitment prior to the bargaining table.

  **Methodology and Twelve-Month Plan**
  This project will not proceed via pure conceptual analysis, which risks becoming unmoored from political reality, nor through a mere catalogue of case studies, which risks lacking generalizability. Instead, I will employ a method of **structural reconstruction and reflective equilibrium**. I will construct a formal model of moral exchange and test its limits against paradigmatic cases to refine the definitions of "fungible" and "constitutive."

  *   **Months 1–3: Formalizing the Economic Analogy.** I will rigorously map the economic notion of Pareto improvement onto moral value systems. This involves defining what it means for a moral outcome to be "better" relative to a specific value system without appealing to a neutral metric. I will draft the axioms for a "moral preference set" and identify where standard decision theory breaks down when applied to deontological or identity-based constraints.

  *   **Months 4–6: Developing the Constitutive Counter-Model.** I will articulate the alternative hypothesis: that some commitments function as identity-constituting rules rather than objective-functions. I will draw on theories of integrity and personal identity to define the conditions under which a trade changes the agent. The output will be a working distinction between *instrumental commitments* (held for the sake of an end) and *constitutive commitments* (held as part of the self).

  *   **Months 7–9: Case Reconstruction.** I will select three distinct domains of compromise: legislative bargaining (e.g., budget negotiations), religious accommodation (e.g., school board curricula), and international norms (e.g., human rights treaties). I will not simply describe these cases but will reconstruct them using the models developed in the first two phases. I will ask: Does the economic model predict the actors' sense of integrity in these cases? Where does it fail?

  *   **Months 10–12: Synthesis and Writing.** I will refine the taxonomy of commitments based on the case reconstructions. The final dissertation chapter will propose a diagnostic framework for distinguishing legitimate compromise from corruption. I will complete the full draft of the dissertation core and prepare two articles for publication.

  **Outcomes, Failure Conditions, and Risk Assessment**
  A **successful result** will be a robust taxonomy of moral commitments that predicts when the "gains from trade" analogy holds. It will provide a vocabulary for political actors to distinguish between pragmatic adjustment and self-betrayal. Success looks like a theory that explains why a politician can compromise on tax rates without loss of integrity but cannot compromise on a core civil rights principle without being accused of corruption, even if the political math is identical.

  **Project failure** would occur if I cannot sustain the distinction between fungible and constitutive commitments. If it turns out that all commitments are ultimately tradable given a high enough price, the economic model swallows the moral one, and the project collapses into a form of consequentialism I intend to critique. Conversely, if all commitments prove to be constitutive, then moral compromise becomes logically impossible, rendering the theory politically inert.

  Finally, there is a risk that the **question itself is ill-posed**. This would be revealed if the sense of "betrayal" turns out to be purely rhetorical—a strategic move by actors to signal resolve—rather than a reflection of the logical structure of their values. If the phenomenology of corruption is shown to be manipulable and unconnected to the actual content of the commitment, then the search for a structural basis for integrity is a category error. In this scenario, the dissertation would pivot to argue that "integrity" in compromise is a performative speech act rather than a logical state. While this would negate the original hypothesis, it would still constitute a significant contribution to the philosophy of political negotiation by debunking the metaphysics of moral trade.

  This project offers a necessary correction to how political philosophy understands agreement. By moving beyond stability and procedure to the logic of the commitment itself, it seeks to explain not just how we live together, but how we do so without losing ourselves.
