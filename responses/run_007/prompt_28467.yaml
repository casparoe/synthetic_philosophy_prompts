  ### The two positions, stated properly

  The covering-law model, championed by Carl Hempel, argues that historical explanation shares the logical structure of natural science. To explain an event is to show it was to be expected, given certain initial conditions and a general law. For Hempel, saying 'Louis XIV invaded Holland because he was ambitious' is incomplete unless backed by a regularity linking ambition to aggression. These laws need not be strict determinisms; probabilistic regularities suffice. Without such laws, history is merely descriptive chronicle, lacking explanatory force. The goal is objective validation through subsumption, ensuring explanations are testable and not merely persuasive stories. It treats historical events as instances of broader classes.

  Conversely, narrative theorists like William Dray contend that history explains by making events intelligible through continuity, not subsumption. They argue historians trace connections between actions, motives, and contexts to show how one event led to another. For this camp, explaining the French Revolution involves reconstructing the agents' reasons and the specific sequence of pressures, not invoking universal laws of human behaviour. Dray distinguishes between explaining why something *had* to happen versus showing how it *could* have happened rationally. The narrative itself provides the understanding; forcing it into a law-like structure distorts the historical material. While Hempel fears subjectivity without laws, narrativists fear triviality with them. Both sides claim to capture what it means to understand the past, but they prioritise different criteria of success: one seeks expectation, the other intelligibility. The covering-law model demands logical validity; the narrative model demands contextual coherence.

  ### Where the debate keeps sticking

  The deadlock arises because each side absorbs the other's counterexamples without conceding. When narrativists offer a compelling story without explicit laws, Hempelians reply that generalisations are merely implicit; if the explanation works, a law *must* be lurking, even if unstated. When Hempelians demand these laws be stated, narrativists argue the resulting generalisations are either trivial ('people act on motives') or false ('ambitious leaders always invade').

  Furthermore, they talk past each other regarding evidence and completeness. For the covering-law advocate, a successful explanation allows for potential prediction; if you couldn't expect it, you don't understand it. They view narrative gaps as logical failures. For the narrativist, success is measured by coherence and plausibility within a specific context; prediction is irrelevant to understanding unique events. They view law-based gaps as irrelevant abstractions. Consequently, every example becomes a battleground where one side sees a hidden law and the other sees a unique configuration. Neither can prove the other wrong because they are evaluating the explanation against different standards of what 'working' means. The debate stalls because each position is internally consistent but mutually untranslatable.

