answer: |-
  This is a compelling line of argument, and I think you have identified a genuine pressure point in the illusionist literature. While the general terrain is well-trodden, your specific framing—focusing on the *semantic content* of the illusory representation rather than the metaphysics of the subject—offers a fresh angle that is well-suited to a cognitive science perspective.

  Here are my thoughts on the viability of the argument, the likely responses you will face, and how you might sharpen the case for a UK-based philosophical audience.

  ### 1. Does the argument have legs?

  Yes, it does. In the literature, this is often referred to as the 'coherence objection' or the 'intelligibility objection'. However, your formulation improves upon the standard version by avoiding the trap of simply asserting that 'illusion requires a feel'. Many illusionists (notably Keith Frankish) have successfully parried the claim that an illusion requires a phenomenally conscious subject to be fooled. They argue that a non-conscious system can misrepresent its own states.

  Your move to focus on the *content* of that misrepresentation is stronger. The crux of your dilemma is this: **How can a non-phenomenal state carry the content 'phenomenal property'?**

  *   **Horn (a)** relies on a principle of acquaintance: that to possess a concept of a qualitative property, one must be acquainted with that property. This is intuitively powerful but metaphysically loaded.
  *   **Horn (b)** relies on the charge of changing the subject. If the content is merely functional, then the illusionist hasn't explained why we believe in *qualia*; they have only explained why we believe in *complex functional states*.

  This is a robust dilemma. It forces the illusionist to explain the *origin* of the specific qualitative character of the illusion without smuggling qualia in through the back door. If the content of the representation is purely structural or functional, it is unclear why the system interprets this as 'reddishness' rather than 'wavelength detection'. The gap between the functional description and the phenomenal 'feel' of the illusion remains unbridged.

  ### 2. Anticipating Illusionist Responses

  To make your essay watertight, you must anticipate how a sophisticated illusionist (like Frankish, Dennett, or Kammerer) would reply. Here are the two main counters you should address:

  **The 'Quasi-Phenomenal' Reply**
  Frankish (2016) argues that we do not represent ourselves as having *phenomenal* properties (which don't exist), but rather as having *quasi-phenomenal* properties. These are complex, introspectively opaque functional properties that we *mistake* for simple, ineffable qualities.
  *   *Your Counter:* You need to press the point that this merely relocates the problem. If the system represents a state as 'quasi-phenomenal', does that representation itself have a qualitative character? If yes, you are back to Horn (a). If no, why does the system interpret 'quasi-phenomenal' as 'phenomenal'? The error theory requires an explanation of why the misrepresentation takes the specific form of *qualitative experience* rather than some other error.

  **The 'Opaque Access' Reply**
  Illusionists often claim that introspection is a 'user interface'. Just as a desktop icon represents a complex file structure as a simple image, introspection represents complex neural states as simple qualia. The content is functional, but the *format* is simplified.
  *   *Your Counter:* This is where your cognitive science background is an asset. You can argue that a user interface still presents *visual* properties (colour, shape) to a user. If there is no user (no phenomenal subject), then the 'icon' is not appearing to anyone. To say the system represents the state *as if* it were qualitative is to say the system deploys a phenomenal concept. If the system lacks acquaintance, how does it deploy the concept? You might argue that 'opacity' explains ignorance, but it does not generate positive qualitative content. Ignorance of mechanism does not automatically yield the impression of 'reddishness'; it merely yields a lack of information.

  ### 3. Sharpening the Argument

  To ensure this stands up to philosophical scrutiny, I suggest the following refinements:

  **Clarify the Notion of 'Content'**
  Distinguish between *vehicle* and *content*. Illusionists are happy to admit the vehicle is a physical brain state. Your argument is that the *semantic content* cannot be fixed without phenomenal properties. You might draw on the notion of 'phenomenal concepts' (as discussed by David Chalmers or Brian Loar). If phenomenal concepts are recognitional concepts that rely on the experience itself for their reference, then a system without experiences cannot possess the concepts required to generate the illusion.

  **Strengthen Horn (b)**
  The claim that the illusionist is 'changing the subject' is your strongest card. Frame this as an explanatory gap. Even if we grant that the system represents itself functionally, this does not explain the *hard problem intuition*. The hard problem isn't just that we think we have secrets; it's that we think we have *feelings*. If the content of the illusion is exhausted by functional descriptions, the illusionist has not explained why the hard problem arises, only why we might be confused about functional architecture.

  **Avoid the 'Homunculus' Trap**
  Be careful not to imply that there must be a 'little man' inside viewing the illusion. Stick firmly to the representational level. The problem is not that there is no one to see the illusion; it is that the representation *says* something that cannot be true in the way the system understands it.

  ### 4. Suggested Reading (Integrated)

  Rather than a list, here is how you should engage with specific texts to bolster your position:

  *   **Keith Frankish, 'The Illusionist Stance' (2016) and *Illusionism as a Theory of Consciousness* (2017):** You must engage with Frankish's distinction between 'phenomenal' and 'quasi-phenomenal' properties. This is the primary target for your Horn (b). If you can show that 'quasi-phenomenal' is just 'phenomenal' by another name, you win.
  *   **François Kammerer, 'Illusionism about Phenomenal Consciousness: Can the Doctrine be Stated Coherently?' (2019):** Kammerer explicitly tackles the coherence objection. He argues that we can understand the doctrine without possessing phenomenal concepts. You need to challenge his account of how we grasp the content of 'phenomenal consciousness' if we lack acquaintance.
  *   **David Chalmers, 'The Meta-Problem of Consciousness' (2018):** While Chalmers is not an illusionist, his discussion of the 'problem of intuition' is relevant. He distinguishes between explaining why we *report* consciousness and why we *believe* we have it. Your argument aligns with the worry that illusionism explains the reporting mechanism but fails to account for the specific content of the belief.
  *   **Galen Strawson, 'Consciousness and Its Place in Nature' (2006):** Strawson's 'realistic physicalism' offers a useful contrast. He argues that experience is the only thing we know to exist. You can use this to underwrite Horn (a): if experience is the primary datum, any concept referring to it must be grounded in it.

  ### 5. Stylistic Note for a UK Journal

  Since you are aiming for a British publication, ensure your spelling and idioms align (e.g., 'analyse', 'defence', 'programme', 'colour'). Beyond orthography, UK philosophical writing tends to value a certain understated rigour. Avoid overstating your case; phrases like 'it seems plausible to suggest' or 'this raises a significant difficulty' often carry more weight than 'this proves illusionism is false'.

  Furthermore, ensure you clearly define 'phenomenal consciousness' at the outset. UK journals (such as *Mind*, *Analysis*, or *The Philosophical Quarterly*) expect precision regarding the 'what-it-is-like-ness' (Nagel) versus 'access consciousness' (Block). Illusionists often conflate the two; your argument gains traction if you show they are relying on access consciousness to explain away phenomenal consciousness.

  ### Summary

  Your argument is sound and targets a genuine vulnerability in the illusionist programme. The key to success will be resisting the illusionist's attempt to redefine the content of the illusion in functional terms. If you can maintain that the *content* of the illusion is irreducibly qualitative, then the illusionist is left with a representation that refers to nothing, possessed by a system that cannot grasp it. That is a formidable contradiction.

  Good luck with the essay. It sounds like a valuable contribution to the debate.
