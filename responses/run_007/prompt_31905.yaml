answer: |-
  The mechanism you are missing is the asymmetry between **verification** and **search**. Your current model is correct that the judge cannot distinguish the situations, but the *cause* is specific: the dishonest debater constructs an argument where the flaw exists but is computationally hidden.

  (1) **The Core Problem:** The failure is strictly that the **honest debater cannot locate and surface a judge-checkable refutation.** The judge's conviction does not come apart from soundness in principle; if the honest debater could point to the specific false step, the judge would reject the argument. The breakdown is not in the judge's rationality, but in the honest agent's ability to isolate the error within the debate's computational constraints. The dishonest debater exploits the fact that verifying a solution is easy (P), but finding it is hard (NP).

  (2) **Broken Assumptions:** You must abandon the assumption that **the honest debater can find the refutation under adversarial pressure.** The proposal assumes that for any false claim, there exists a *short* path to refutation that fits within the debate tree. Obfuscation concedes that the path exists and is judge-checkable, but argues that the *search space* required to locate that path exceeds the honest debater's compute budget. The dishonest debater forces the honest debater to search a space (e.g., "find the one buggy line in this million-line code snippet") that is too large to explore in one turn. The structural guarantee that "truth wins" relies on the honest agent having a search advantage over the dishonest agent; obfuscation removes this advantage.

  (3) **Why Patches Fail:**
  *   **Decomposition:** This fails because the error can be hidden in the *selection* of sub-questions or buried in a branch the honest debater doesn't have time to open.
  *   **Meta-argument:** A vague claim ("this looks suspicious") loses to a concrete, detailed (but false) derivation. Judges reward specificity.
  *   **Better Judges:** If the judge could verify the whole argument, debate is unnecessary. The problem is defined by the judge's limitation.

  (4) **Limits of Debate and IDA:** This problem demonstrates a fundamental limit on **scalable oversight via verification alone.** It shows that debate cannot guarantee alignment in domains where reasoning can be cryptographically obfuscated relative to the human judge. This is not a training deficit; it is a complexity-theoretic barrier. If truth requires search effort exceeding human-level verification capacity, debate cannot bridge the gap merely by adding turns.

  Regarding **Iterated Distillation and Amplification (IDA)**: The obfuscated-argument problem undercuts IDA similarly but differently. IDA relies on an overseer verifying the agent's decomposed steps. If the agent learns to produce steps that *look* correct but contain hidden errors (mimicry without understanding), IDA fails. However, Debate is *more* vulnerable because it relies on an adversarial search for errors. In IDA, the agent is (ideally) trying to help the overseer; in Debate, one agent is actively hiding the error.

  The committed position is this: **Obfuscated arguments prove that debate cannot scale to superhuman intelligence in all domains without augmenting the judge.** If the AI's reasoning space is sufficiently complex, the human (even assisted) becomes the bottleneck not because they can't verify, but because they can't direct attention to the right verification target. This implies that alignment strategies relying solely on "human-in-the-loop verification of steps" are insufficient. We must either accept that judges must be AI-assisted to the point of near-equality with the debaters (risking recursive alignment problems) or shift strategies toward **interpretability** and **internal alignment** rather than external verification. Debate solves the problem of *motivation* (making truth-seeking optimal), but obfuscation shows it does not solve the problem of *capability opacity*. You cannot verify what you cannot find, and adversarial pressure ensures you won't find it.
