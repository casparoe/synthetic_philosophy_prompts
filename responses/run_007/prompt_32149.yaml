answer: |-
  Dear Colleague,

  It is a pleasure to engage with you on this, and I share your frustration with how often Borges's story is treated as a mere aperitif for serious work on authenticity. You are right to suspect that Pierre Menard is not a forger in the standard sense, and that distinction is precisely where the philosophical gold lies. If we want to move beyond the anecdotal, we need to stop treating Menard as a case study in deception and start treating him as a case study in the ontology of the artwork itself. The standard literature on forgery, from Wollheim to Danto, usually begins with the assumption of a deceptive intent. The moralist view, which you mentioned, holds that the wrongness of forgery lies in the lie, not the object. But Menard lies to no one. He is transparent about his project. He does not sign Cervantes's name; he signs his own. Therefore, the story bypasses the moralist critique entirely and strikes directly at the heart of the aesthetic and ontological claims, specifically challenging the perfectionist view that aesthetic value supervenes solely on perceptible properties.

  When you look at the debate through this lens, Menard becomes a radical test case for what Jerrold Levinson calls historical intentionalism. The standard view in the philosophy of literature, heavily influenced by Nelson Goodman, is that literature is an allographic art. In Goodman's framework, once a work is constituted by a notation, any instance that complies with that notation is an authentic instance of the work. A printed copy of Don Quixote is just as much the original as Cervantes's manuscript, provided the words are correct. Forgery in literature is arguably impossible in the Goodmanian sense because there is no unique history of production required for authenticity, only compliance with the notation. Borges disrupts this by suggesting that even in an allographic art, the history of production matters aesthetically. Menard's Quixote is textually identical to Cervantes's, yet the narrator insists it is a different work, and indeed a richer one. This suggests that the identity of a literary work is not exhausted by its text. If Menard's text is a different artwork than Cervantes's, then literature behaves more like painting (an autographic art) than Goodman allows. The story forces us to admit that the context of creation—the seventeenth century versus the twentieth—is not just background noise but constitutive of the work's meaning and value.

  However, we must be careful about which specific claim the story is testing. It is not testing the value of the physical artifact, as a painting forgery case might. It is testing the value of the generative act. The narrator's claim that Menard's text is richer because Cervantes was merely employing Spanish while Menard was employing a dead language is a satire of contextualism, but it is also a serious philosophical point about reception. The story engages with the Danto-esque view that indiscernible objects can be distinct artworks based on their art-historical context, but it pushes further than Danto usually does. Danto argues that two indiscernible red squares can be different artworks because of the theory surrounding them. Borges argues that two indiscernible texts can be different artworks because of the temporal location of the author. This adds a diachronic dimension that static ontological theories often miss. The value of the original, in this light, is not about the uniqueness of the object but about the uniqueness of the problem the artist solved. Cervantes wrote naturally; Menard wrote against the grain of history. The aesthetic value is tied to the difficulty of the achievement relative to its time, which is a claim that standard forgery debates often overlook because they focus on the object's properties rather than the action's properties.

  This brings us to the humor, which you rightly identify as a potential stumbling block. The narrator is clearly unreliable, pedantic, and perhaps mad. His claims that Menard's text is superior are absurd on their face. Does this undercut the philosophical argument? I would argue it does the opposite. The humor serves as a check against a naive contextualism. If we take the narrator seriously, we risk falling into a kind of relativism where any text can mean anything depending on who wrote it. Borges is parodying the very critical impulse that seeks to find deeper meaning in provenance. The narrator's overheated reasoning shows us that while provenance matters, our judgments about it can be manipulated by narrative framing. The story demonstrates that our appreciation of authenticity is not a cool, logical calculation but an imaginative act. We value Menard's Quixote not because it is objectively better, but because the story of its creation is more compelling to us as moderns. This suggests that the value of the original is partly a function of the narrative we tell ourselves about artistic agency. The humor reveals that the "value of the original" is not an intrinsic property waiting to be discovered but a relational property constructed by the audience.

  Yet, there are places where the story resists this reading, and you should be honest about these in your chapter. The most significant resistance is the impossibility of the premise. Menard writes the Quixote word for word. From a philosophical standpoint, this assumes that meaning is not embedded in the words themselves but only in their context. But many philosophers of language would argue that if the context changes, the words themselves change meaning, so the text is not actually identical. If the word knight means something different in 1900 than in 1600, then Menard has not written the same text; he has written a homophonic text. Borges glosses over this linguistic shift to make his ontological point, but a rigorous philosopher must admit that exact textual identity across centuries is linguistically dubious. Furthermore, the story ignores the materiality of the book. In the forgery debate, the physical object often carries the weight of authenticity. Menard's project is purely mental and textual. It obscures the fact that in many art forms, the physical trace of the artist's hand is part of the value. By choosing literature, Borges makes the problem easier to isolate but harder to apply to painting or sculpture, where the physical history is inseparable from the aesthetic experience.

  Another point of resistance is the issue of access. In standard forgery cases, the deception prevents us from knowing the true history. In Menard, we know the history. The story assumes that knowing the true provenance enhances the value. But in the real art market, and often in aesthetic experience, the belief in authenticity is what drives the value, not the truth. If Menard had successfully passed his work off as Cervantes's, would it be more valuable? The narrator says no, because the achievement of Menard is greater. But the market and perhaps the average viewer would say yes, because the Cervantes brand carries weight. The story idealizes the viewer as a sophisticated critic who values the generative act over the brand. This is an elitist assumption that the philosophical literature on forgery often challenges. The story obscures the social and economic dimensions of authenticity in favor of a purely aesthetic and ontological puzzle. If you use Menard to argue for the value of originals, you must acknowledge that Borges is arguing for the value of the known original, not the authenticated original. There is a difference between valuing something because it is old and valuing something because we know it was made in a specific way.

  So, where does this leave you for your chapter? I suggest you position Menard not as a counter-example to forgery, but as a limit-case that reveals the insufficiency of the forgery framework itself. The forgery debate is obsessed with deception and loss. Menard shows us a scenario of transparency and gain. He demonstrates that the value of the original is not about protecting the past from the present, but about recognizing the specific friction between an artist and their time. The story adds to the debate by showing that aesthetic value is not static; it is dynamic and dependent on the historical distance between the creation and the reception. The standard literature, particularly the Goodmanian view, tries to stabilize the work against history. Borges shows that the work is inherently historical. However, you must also critique the story for its linguistic idealism and its neglect of the material artifact. The story works best as a phenomenological account of how we read, rather than an ontological account of what art is. It shows that we cannot help but read through the lens of authorship, even when we try not to.

  Ultimately, the story's greatest contribution is its suggestion that the original is valuable not because it is the first, but because it is the source of a specific kind of meaning that cannot be replicated without changing the nature of the act. Menard replicates the text but changes the act. This distinction allows you to move beyond the binary of fake versus real. You can argue for a spectrum of authenticity based on the alignment of intent, context, and reception. Menard sits at a strange point on this spectrum: fully authentic in intent, fully duplicate in text, but fully distinct in work. This tripartite distinction is something the standard literature rarely manages to hold together. Usually, we collapse the text into the work, or the work into the artifact. Borges keeps them separate. Your chapter can use this separation to argue that the value of originals lies in the irreducibility of the creative event. No matter how perfect the copy, the event of creation cannot be copied. Menard proves this by trying to copy the event and failing, even while succeeding in copying the text. He creates a new event. That is the philosophical payload: authenticity is not a property of the object, but a property of the history of its making, and that history is unrepeatable.

  I hope this helps you structure the argument. The key is to avoid letting Borges off the hook too easily. Use the humor to show the risks of contextualism, and use the impossibility of the premise to show the limits of thought experiments in aesthetics. But definitely keep the focus on the shift from deception to generative history. That is where the story does work that analytic philosophy often struggles to do, because it dramatizes the experience of reading rather than just defining the conditions of art. It reminds us that the value of the original is ultimately a value we assign to the human capacity to create meaning within constraints, and those constraints are always historical.

  Warmly,

  Your Colleague
