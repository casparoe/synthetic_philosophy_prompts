answer: |-
  The central tension is reconciling the subjective immediacy of experience with the functional constraints of cognitive access without circularly defining one in terms of the other.

  1. **Report-Independence.** Evidence for phenomenality cannot rely solely on verbal report. *Forcing Case:* No-report paradigms (e.g., binocular rivalry tracked via eye movements) reveal awareness signatures without motor output. *Requirement:* Report imposes working memory and attention demands distinct from experience; conflating them measures post-perceptual processing, not phenomenality. Evidence must be filtered through access without being constituted by it. **Non-negotiable.**

  2. **Capacity Mismatch.** Accounts must explain the divergence between felt richness and reportable sparsity. *Forcing Case:* Sperling's partial-report shows high-capacity iconic memory decaying before verbalization. *Requirement:* Subjects consistently report a rich field exceeding the sparse contents that survive full report; denying this contradicts first-person data essential to defining 'phenomenal'. **Non-negotiable.**

  3. **Causal Efficacy.** Accounts must specify how phenomenal states influence reasoning if not via standard access. *Forcing Case:* Blindsight patients navigate obstacles while denying vision. *Requirement:* If inaccessible P has no cognitive use, it is epiphenomenal; a theory must explain how inaccessible content guides behavior or admit causal inertness. It must distinguish inaccessible P from unconscious processing, otherwise the distinction collapses. **Non-negotiable.**

  4. **Dissociability.** Accounts must clarify whether P can exist without global broadcast. *Forcing Case:* Philosophical zombies and claims of unconscious perception. *Requirement:* Separatists require this to maintain the distinction; Unity theorists deny it to avoid positing unobservable states. **Camp-specific.**

  5. **Operational Verifiability.** Accounts must provide non-circular criteria for identifying P without presupposing A. *Forcing Case:* The "hard problem" critique of functionalism. *Requirement:* Without independent markers, claims of P without A are unfalsifiable assertions; science requires public criteria. **Non-negotiable.**

  **Conflicts:**
  Desiderata 2 (Richness) and 3 (Causal Efficacy) create a dilemma: If rich content is inaccessible (per 2), how does it guide behavior (per 3) without becoming accessed? Resolving this often requires positing multiple access routes or accepting epiphenomenalism. Furthermore, Desideratum 3 clashes with the definition of Access: if P influences reasoning, is it not thereby Accessed? This threatens to dissolve the P/A distinction entirely.

  Desiderata 1 (Report-Independence) and 5 (Verifiability) conflict: Removing report removes the subject's testimony, leaving only neural correlates which require interpretation. We risk replacing the "hard problem" with a "neural correlation problem," where we measure brain states but lose the phenomenology. If we cannot report it, and it does not affect reasoning, its existence becomes scientifically opaque.

  **GWT Scorecard:**
  Global Workspace Theory (GWT) equates consciousness with global availability.
  1. **Pass:** Uses neural broadcasting markers beyond simple report.
  2. **Fail:** Treats phenomenological richness as an illusion of access; claims only accessed content is conscious.
  3. **Pass:** Consciousness is defined by causal role in reasoning/control.
  4. **Fail:** Denies P without A; rejects dissociation.
  5. **Pass:** Operationalizes consciousness via task performance and broadcasting.

  GWT satisfies functional requirements but struggles with the phenomenological surplus mandated by Desideratum 2. It resolves the tension by collapsing P into A, satisfying Unity theorists but alienating Separatists. This makes it robust for prediction but vulnerable to phenomenological critique. It sidesteps the conflict between 2 and 3 by denying 2, asserting that the feeling of richness is itself a product of access mechanisms rather than a property of inaccessible states. Consequently, GWT meets the non-negotiable functional criteria but fails the non-negotiable phenomenological criteria regarding richness, marking it as a Unity theory that prioritizes causal efficacy over subjective surplus.
