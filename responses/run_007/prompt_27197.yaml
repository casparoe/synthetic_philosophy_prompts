          *   *Strength:* Explains choice. If a reason favors $A$ and $B$ equally, why $A$?
          *   *Weakness:* This is the standard target in Buridan's Ass literature. Many philosophers argue for *sufficient* reasons vs. *decisive* reasons. A reason can make an action permissible without making it uniquely choice-worthy.
          *   *Cost of Rejection:* Need to explain how a reason favors $A$ without favoring it *more* than $B$. This leads to the distinction between "favoring" (weight) and "justifying" (threshold).

