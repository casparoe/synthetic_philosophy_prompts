answer: |-
  The leveling-down objection (LDO) argues that it is absurd to claim a situation is better in any respect if no one is better off and some are worse off. It targets **telic egalitarianism**, specifically the claim that **equality is intrinsically valuable**. If equality is a standalone good, then moving from an unequal distribution (10, 5) to an equal one (5, 5) increases equality. Consequently, telic egalitarianism implies the leveled-down state is better in at least one respect, despite the welfare loss. The LDO rejects this, insisting that a change benefiting no one cannot be an improvement.

  Prioritarianism avoids this objection through its value function, $V = \sum f(w_i)$, where $f$ is strictly increasing and strictly concave. While concavity ensures that benefits to the worse-off matter more (giving priority), it is the **strictly increasing** property that blocks the LDO. In a leveling-down scenario (10, 5 $\to$ 5, 5), the better-off individual suffers a welfare loss. Because $f$ is strictly increasing, $f(10) > f(5)$. Therefore, the total value of the unequal state exceeds the leveled-down state ($f(10) + f(5) > f(5) + f(5)$). Prioritarianism judges the leveled-down outcome as strictly worse, not better in any respect. Concavity explains why we might prefer equality *if* it involves raising the worse-off, but monotonicity ensures that pure welfare losses always reduce value.

  Consider a modified view where $f$ has a threshold above which marginal value is zero (not strictly increasing). If both individuals are above this threshold, $f(10) = f(5)$. In this case, the view judges (10, 5) and (5, 5) as equally valuable. Technically, this view is **not vulnerable to the LDO**, as it does not claim the leveled-down state is *better*. However, it violates the Pareto principle. This comparison reveals that what truly shields prioritarianism from the LDO is not its priority weighting (concavity), but its commitment to **strict monotonicity**. Immunity to the LDO relies on the welfarist constraint that any welfare loss constitutes a value loss. Without strict increasingness, a view may avoid the specific claim that leveling down is *better*, but it loses the robust intuition that leveling down is *worse*, thereby undermining the core welfarist defense against egalitarian absurdities.
