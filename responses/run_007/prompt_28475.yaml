      *   Actually, for 1st years, a tiny bit of setup is needed so they aren't lost.
      *   *Revised Plan:* 5 mins setup (Callosum + Contralateral), 15 mins Experiment, 20 mins Philosophy, 10 mins Wrap/Check.
