answer: |-
  You've identified a genuine gap in the standard taxonomy. There is no single canonical term equivalent to "falsification," but the phenomenon is widely recognized. The closest established labels are **"Paradigm Obsolescence"** or **"Conceptual Displacement."**

  Ian Hacking's notion of **"Styles of Reasoning"** fits best. He argues new styles create new objects of inquiry without necessarily falsifying old ones; the old questions simply cease to be askable or worth asking. Similarly, Larry Laudan's work on **"Problem Status"** suggests problems can lose importance without being solved. If I were to coin a precise term for your description, I would call it **"Non-refutational Displacement."**

  Here is how it distinguishes from your three categories:

  (a) **Kuhnian Crisis:** Requires anomalies and failure to solve puzzles. Your case involves sustained success; the "death" is due to shifting interests, not empirical failure.
  (b) **Lakatosian Degeneration:** Requires ad-hoc adjustments and a halt in novel predictions. Your case involves a program that remained predictive but became culturally or heuristically exhausted.
  (c) **Reduction/Limiting Case:** Requires the old theory to be preserved as a special case (e.g., Newtonian physics within Relativity). In your examples, the old framework isn't preserved mathematically or ontologically; it's abandoned as a descriptive language (regional geology isn't a "limiting case" of plate tectonics; it's a different granularity).

  This is death by irrelevance, not falsity. It suggests scientific progress isn't just truth-accumulation but also a shift in what counts as a valuable question.

  **Confidence:** 85%. The philosophical literature acknowledges this dynamic (especially post-Kuhn), but lacks a standardized noun.
  **Least Sure:** Whether a specific sociologist of scientific knowledge (e.g., Andrew Abbott or Richard Whitley) has coined a niche term like "disciplinary exhaustion" that hasn't crossed into mainstream philosophy of science.
