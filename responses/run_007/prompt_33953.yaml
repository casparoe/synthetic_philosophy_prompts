answer: |-
  Hey, I've been turning over our conversation from the other night about blame and responsibility, and that line your friend kept using really stuck with me. It's a powerful intuition, and honestly, it's one of the oldest and hardest problems in philosophy, even if it comes up over beers. The reason you felt stuck is that the slogan you didn't choose to be who you are is doing a lot of heavy lifting without showing its work. It sounds like one single claim, but depending on how you parse it, it ranges from a boring biological fact to a wild metaphysical assertion. I think the best way to handle this is to separate out the different layers of what that sentence could actually mean, because only one of those layers actually gets him to the conclusion that nobody deserves blame, and that's the only one that needs serious defending.

  The first and most boring reading of his claim is simply that you didn't choose your starting conditions. This is the version where he means you didn't pick your parents, your genetics, your country of birth, or the socioeconomic status you were born into. This claim is trivially true. Nobody chooses their DNA or their childhood environment. However, this version does not support his conclusion that nobody is morally responsible. Just because you didn't choose your starting stats doesn't mean you aren't responsible for how you play the hand. We hold people responsible for managing things they didn't choose all the time. You didn't choose the legacy codebase you inherited at work, but you are still responsible for how you maintain it or whether you introduce bugs. If this is all he means, then he's stating a fact about luck that doesn't actually eliminate agency or responsibility. It just means responsibility is about response-ability, or how you react to the constraints you're given, rather than having chosen the constraints themselves.

  The second reading is a bit deeper and touches on psychology. Here, the claim is that your character, values, and impulses were formed by processes outside your control, especially during childhood. This is substantive but largely defensible. Developmental psychology backs the idea that our early moral framework is installed by upbringing and culture before we have the capacity to critique it. If your friend stops here, he's saying that because the foundation was laid without your consent, the building is not truly yours. This gets closer to his conclusion, but it still doesn't quite get there because it ignores the capacity for reflection and change later in life. Most adults have some ability to examine their impulses and override them. If you have a temper because of your upbringing, you didn't choose the temper, but you might be responsible for whether you seek help or learn to manage it once you're an adult. So this version weakens responsibility, perhaps mitigating blame, but it doesn't erase it entirely unless you argue that adults never really change, which is a much harder claim to prove.

  The third reading is where the real engine of his argument lives, and this is the one you need to press him on. This is the claim that to be truly morally responsible, you must be the ultimate cause of yourself. In this view, you can only be blamed for an action if you chose the character that produced the action, and you can only be responsible for that character if you chose the values that formed it, and so on, back to infinity. This is often called the requirement for ultimate responsibility. This claim is substantive and highly controversial, and many philosophers argue it is actually false because it sets an impossible standard. It requires you to be what is known as a causa sui, or self-caused, which is logically incoherent. You can't choose your nature before you have a nature to do the choosing. If this is the version he is relying on, then yes, it does lead to his conclusion that nobody deserves blame, but only because it defines responsibility in a way that nothing could ever satisfy. It's like saying nobody is truly tall because nobody chose their height without relying on genetics. The standard is rigged.

  The fourth and final reading is the metaphysical one, which is often hiding behind the other three. This is the claim that every event, including your thoughts and decisions, is fully determined by prior physical causes. Here, the slogan you didn't choose to be who you are is shorthand for hard determinism. The argument is that because the universe operates on cause and effect, your decision to drink the beer or skip the gym was the inevitable result of prior states of the universe. This claim is substantive and defensible within a certain worldview, but it is not proven fact. It relies on a specific interpretation of physics and the mind that is still debated. If this is true, then his conclusion follows, but notice that this is a completely different argument than the one about choice. It's an argument about causality. Often, people conflate not choosing your personality with the universe being deterministic, but they are distinct. You could have free will in a probabilistic universe and still not have chosen your genes. So if he wants to say nobody is responsible, he needs to defend determinism, not just point out that we didn't pick our parents.

  When you go back to him, the key is to show him that the slogan works only if he smuggles in that third or fourth interpretation. The trivial stuff about genes and upbringing doesn't kill responsibility, it just contextualizes it. The only way to get to total moral nihilism is to insist that you must have created yourself from scratch to be accountable for your actions. That is a much heavier lift than just saying we didn't choose our childhoods. You can tell him that you agree we didn't choose our starting code, but you disagree that running the code doesn't count as agency. If he wants to prove nobody deserves blame, he has to defend the idea that responsibility requires self-creation, which is an impossible bar, or he has to prove hard determinism, which is an open scientific question. Until then, the intuition that people can be held accountable for how they manage the hand they were dealt remains standing. I think that distinction gives you enough ground to push back without getting bogged down in abstract metaphysics, and it keeps the focus on what that slogan is actually doing in the argument.
