prompt: |-
  i'm a software engineer and i got into it with a friend over drinks about whether anyone ever really deserves blame — like, genuinely deserves it, in some deep sense. and he just kept coming back to this one line: "you didn't choose to be who you are." his argument was: everything you do flows from your character, your values, your impulses, your capacities — but you didn't choose any of that. you didn't choose your genes, your upbringing, your temperament, your intelligence, or even your capacity for effort. so if you trace any action back far enough, you hit something you didn't choose. and if you aren't responsible for the source, you can't be responsible for what flows from it. so nobody is ever truly morally responsible for anything.

  and i was like, that can't be right, but i couldn't really say why. the line "you didn't choose to be who you are" sounds obviously true on its face — of course i didn't choose my genes or my childhood. but the leap from that to "therefore nobody is ever morally responsible for anything" feels like it's smuggling in a lot of machinery.

  what i need is someone to lay out the different precise claims that slogan could be making, from the most boring and uncontroversial to the most wild. for each one, tell me whether it's trivial, substantive but defensible, or actually false. and then tell me which of these readings actually get my friend to his conclusion, and which ones just sound like they do. i want to be able to go back to him and say: look, here are the different things you could mean by that, and only some of them actually support where you ended up, and those are the ones that need defending.

  also, please write this as continuous prose, like a long email — no bullet points, no headings, no bold, no tables. i'm going to forward chunks of it and i dont want it to look like i had an AI write me a term paper.
