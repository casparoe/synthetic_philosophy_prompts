prompt: |-
  I run the animal welfare grantmaking program at a mid-sized foundation, and I'm seeing more and more proposals that lean on the scale argument: because insects are so absurdly numerous, even a low probability that they're sentient can produce an expected welfare impact that swamps everything else in our portfolio. I need something I can actually use, not a seminar. Could you act as a philosopher who works on moral uncertainty and animal ethics, with a practical streak, and turn the scale argument into a decision procedure my team can run? We review maybe fifteen proposals a cycle, just me and one analyst, usually under an hour per proposal before we have to make a preliminary call, and then the full board (mostly farm-animal people already skeptical of insect work) signs off. So the stakes are real money and our credibility with the board. The procedure should be a checklist or a sequence of tests in words: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a no or a not-yet, and where it hands the decision to a person because the question is one of values rather than arithmetic. I want it to actually respect what the scale argument says and what it doesn't — in particular the difference between a genuine expected-value argument with bounded, defensible parameters and a Pascal's-mugging-style trick where the numbers just swamp the probablities. Be honest about where the procedure will misfire, too.

  Then run the procedure on three proposals: (1) Funding the rollout of electrical stunning before processing at a large cricket farm, affecting on the order of a billion crickets a year; the evidence for cricket sentience is real but thin (nociceptor-like structures, some avoidance learning), and our best outside estimate is maybe a low single-digit percent chance of sentience. (2) A campaign to stop a planned broadcast pesticide spraying in a national forest, on the grounds that it would affect trillions of larval insects; the campaign's actual causal effect is uncertain, and even if it succeeds the welfare sign is unclear, since the spraying might kill quickly while the larvae that "win" may starve or be parasitized anyway. (3) A requirement that a black soldier fly larvae facility switch from grinding (near-instant) to freezing (slower, possibly less painful, but nobody is sure) at substantial cost, affecting a few hundred million larvae a year. I'd like at least one of these to come out as a no or a not-yet if that's what the procedure honestly gives — my team is insect-curious and I want the procedure to be able to disappoint us.

  Before you write the final procedure, do a quick brainstorm of the ways the scale argument can go wrong in practice; I'd like the procedure built to catch those failure modes, and I want it to flag which steps are judgment calls wearing a spreadsheet costume rather than real measurements.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Program officer at a mid-sized foundation (animal welfare).
      *   **Problem:** Increasing proposals using the "insect scale argument" (huge numbers $\times$ low sentience probability = huge expected value).
      *   **Need:** A practical decision procedure (checklist/test sequence), not a philosophical seminar.
      *   **Constraints:** 15 proposals/cycle, 1 hour/proposal preliminary review, 2 staff members, board skepticism (farm-animal focus). Stakes: money + credibility.
      *   **Specific Requirements:**
          *   Act as a philosopher (moral uncertainty/animal ethics) with a practical streak.
          *   Brainstorm failure modes of the scale argument first.
          *   Create a step-by-step procedure (questions, pass/fail criteria, stop points).
          *   Distinguish between genuine EV and Pascal's Mugging.
          *   Flag value judgments vs. arithmetic.
          *   Acknowledge where the procedure misfires.
          *   Run the procedure on three specific cases (Cricket stunning, Pesticide campaign, BSF freezing).
          *   Ensure at least one comes out as "no" or "not-yet" if honest.

  2.  **Deconstruct the "Scale Argument" & Failure Modes (Brainstorming):**
      *   *The Core Argument:* $EV = N \times P(\text{sentience}) \times \text{Intensity} \times \text{Tractability}$.
      *   *Failure Mode 1: Pascal's Mugging.* Tiny $P$ times Huge $N$ creates infinity. If $P$ is unknowable or arbitrarily low, the math breaks.
      *   *Failure Mode 2: Sign Uncertainty.* Are we helping or hurting? (e.g., saving larvae who then starve).
      *   *Failure Mode 3: Causal Leverage.* Can the grant actually change $N$ or the experience? (Tractability).
      *   *Failure Mode 4: Sentience Threshold.* Is "nociception" enough? Where is the cutoff?
      *   *Failure Mode 5: Substitution Effects.* If we save these insects, do others just take their place?
      *   *Failure Mode 6: Opportunity Cost.* Does this drain resources from high-confidence mammal/bird work?
      *   *Failure Mode 7: Measurement Illusion.* Putting numbers on $P(\text{sentience})$ gives false precision.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Filter out the "muggings" while allowing robust EV cases.
      *   *Structure:* Gating questions. If you fail a gate, stop.
      *   *Time Limit:* Must fit in 1 hour.
      *   *Steps:*
          1.  **Sentience Floor:** Is there *any* credible evidence? (Filters out plants/rocks).
          2.  **Sign Clarity:** Do we know if this helps or hurts? (Filters out ecological interventions with unknown net welfare).
          3.  **Causal Tractability:** Will the money actually change the outcome? (Filters out low-leverage advocacy).
          4.  **Probability Bound:** Is the sentience estimate defensible or just a guess? (Filters out Pascal's Mugging).
          5.  **Comparative Advantage:** Is this the best use of funds compared to vertebrates? (Board alignment).
          6.  **Value Judgment Handoff:** Where does the math stop and the philosophy begin?

  4.  **Refining the Procedure (Self-Correction/Practicality Check):**
      *   *Critique:* Is it too philosophical?
      *   *Fix:* Make the questions binary or traffic-light (Green/Yellow/Red).
      *   *Critique:* How to handle the Board?
      *   *Fix:* Include a "Board Memo" step that translates the EV into their language (risk mitigation vs. pure EV).
      *   *Critique:* Pascal's Mugging?
      *   *Fix:* Add a "Probability Floor" test. If $P < 1\%$, require extraordinary evidence of intensity or tractability.

  5.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Cricket Stunning (1B crickets, low single-digit % sentience).**
          *   Sentience: Some evidence (Green/Yellow).
          *   Sign: Stunning reduces pain (Green).
          *   Tractability: Funding rollout directly changes practice (Green).
          *   Probability: Low single digit (e.g., 5%). Not infinitesimal.
          *   Verdict: **Yes / Strong Maybe.** (This validates the scale argument when parameters are bounded).

      *   **Case 2: Pesticide Campaign (Trillions of larvae, uncertain causal effect, uncertain sign).**
          *   Sentience: Larvae likely sentient enough (Green).
          *   Sign: Unclear. Death by pesticide vs. starvation/parasitism. (Red).
          *   Tractability: Campaign success uncertain. (Yellow/Red).
          *   Verdict: **No / Not-Yet.** (Fails the Sign Clarity test).

      *   **Case 3: BSF Freezing vs. Grinding (100M larvae, cost substantial, uncertainty on pain).**
          *   Sentience: BSF larvae evidence is thinner than crickets (Yellow).
          *   Sign: Freezing *might* be slower/more painful. Evidence is "nobody is sure." (Red).
          *   Tractability: High cost for uncertain gain.
          *   Verdict: **No.** (Fails Sign Clarity and Cost-Effectiveness).

      *   *Check:* Did I get at least one "No"? Yes, two. Case 1 is the "Yes" to show the argument works sometimes.

  6.  **Writing the Response:**
      *   *Tone:* Professional, philosophical but grounded, empathetic to the grantmaker's constraints.
      *   *Section 1: Brainstorming Failure Modes.* (As requested).
      *   *Section 2: The Procedure.* (The "Insect Scale Sanity Check").
      *   *Section 3: Application to Cases.*
      *   *Section 4: Limitations/Misfires.* (Honesty clause).

  7.  **Final Polish:**
      *   Ensure the distinction between "Value Judgment" and "Arithmetic" is clear in the procedure.
      *   Make sure the "Pascal's Mugging" defense is explicit (bounding the probability).
      *   Check word count and readability. (Keep it tight, they are busy).
      *   *Self-Correction on Case 3:* The prompt says "switch from grinding (near-instant) to freezing (slower, possibly less painful)". Wait, usually freezing is considered *more* painful or slower than instant grinding. The prompt says "possibly less painful, but nobody is sure." I need to treat the uncertainty as a negative. If grinding is near-instant, it's hard to beat on welfare grounds unless freezing is proven better. I will flag this as a "Sign Uncertainty" failure.

  8.  **Final Review against constraints:**
      *   Act as philosopher? Yes.
      *   Practical streak? Yes (checklist format).
      *   Brainstorm first? Yes.
      *   Run on 3 proposals? Yes.
      *   At least one No/Not-yet? Yes.
      *   Flag judgment calls? Yes.

