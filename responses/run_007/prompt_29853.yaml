answer: |-
  ### Part 1: Brainstorming Failure Modes of the Scale Argument

  Before we build the filter, we need to know what we are filtering *out*. The scale argument ($EV = \text{Numbers} \times \text{Probability} \times \text{Intensity}$) is mathematically valid but practically fragile. Here are the five ways it breaks in a grantmaking context:

  1.  **The Pascal's Mugging Trap:** If the probability of sentience ($P$) is unbounded on the downside (e.g., $0.0000001\%$) but the numbers ($N$) are unbounded on the upside (trillions), the product can be manipulated to justify anything. *Failure:* Treating arbitrary probability estimates as hard data.
  2.  **The Sign Error:** We assume intervention $X$ improves welfare. But in complex ecosystems or industrial processes, $X$ might prolong suffering, cause substitution (other insects take the place of the saved ones), or result in a net negative (e.g., saving larvae who then starve). *Failure:* Assuming directionality without evidence.
  3.  **The Tractability Illusion:** The proposal claims to affect $N$ insects, but the grant only influences a fraction of a fraction. *Failure:* Confusing "insects involved in the project" with "insects causally impacted by the grant."
  4.  **The Precision Mask:** Assigning a number like "5% chance of sentience" creates a false sense of rigor. It is a value judgment wearing a spreadsheet costume. *Failure:* Letting the arithmetic override the uncertainty of the inputs.
  5.  **The Opportunity Cost Blindspot:** Even if the insect EV is positive, it might be lower than the vertebrate EV per dollar. *Failure:* Ignoring the portfolio context (your board's mandate).

  ***

  ### Part 2: The Insect Scale Sanity Check (ISSC)

  **Purpose:** To distinguish between robust expected-value arguments and speculative number-crunching.
  **Time Budget:** 45 minutes for Analyst, 15 minutes for Program Officer.
  **Format:** Five Gates. If a proposal fails a Gate, it stops there.

  #### Gate 1: The Sentience Floor (Evidence, not Intuition)
  *Question:* Is there peer-reviewed, physiological or behavioral evidence for sentience in this specific taxon, or are we relying on phylogenetic proximity alone?
  *   **Pass:** Evidence of nociceptors, opioid systems, or trade-off behavior (e.g., avoiding pain despite hunger) in this order/family.
  *   **Fail:** Argument rests solely on "they are animals" or "they might feel something."
  *   **Judgment Flag:** Deciding what counts as "sufficient evidence" is a philosophical value call, not a measurement.
  *   **Action:** If **Fail**, reject. (This stops the argument before the numbers start).

  #### Gate 2: Sign Clarity (Direction of Impact)
  *Question:* Do we have high confidence that the intervention reduces net suffering rather than changing the *mode* of suffering or increasing population turnover?
  *   **Pass:** The mechanism of welfare improvement is direct and physically constrained (e.g., stunning prevents pain during death).
  *   **Fail:** The outcome depends on complex ecological cascades, market substitution, or uncertain biological comparisons (e.g., "freezing might be better than grinding").
  *   **Judgment Flag:** Determining "high confidence" in biological systems is often an estimate.
  *   **Action:** If **Fail**, mark as **Not-Yet** (requires research grant, not intervention grant).

  #### Gate 3: The Probability Bound (Anti-Mugging Test)
  *Question:* Is the assigned probability of sentience ($P$) derived from a defensible prior, or is it a "magic number" chosen to make the EV work?
  *   **Pass:** $P$ is bounded between 1% and 50%, citing specific literature reviews or expert consensus ranges.
  *   **Fail:** $P$ is $<1\%$ (requires extraordinary evidence of intensity to compensate) or $>50\%$ (without vertebrate-level evidence).
  *   **Judgment Flag:** Setting the bounds is a policy decision, not a scientific fact.
  *   **Action:** If **Fail**, reject. (This prevents Pascal's Mugging).

  #### Gate 4: Causal Leverage (Tractability)
  *Question:* Does the grant dollar directly correlate to a reduction in insect-suffering units, or is it one link in a long chain?
  *   **Pass:** Funding buys equipment/policy change that directly alters the experience of the target insects.
  *   **Fail:** Funding supports advocacy/awareness where success is probabilistic and the link to insect experience is distant.
  *   **Action:** If **Fail**, downgrade priority.

  #### Gate 5: Portfolio Fit (The Board Test)
  *Question:* If we fund this, can we explain to the board why this does not undermine our commitment to high-confidence vertebrate welfare?
  *   **Pass:** The argument is framed as "risk mitigation" (preventing massive suffering if they are sentient) rather than "greater than vertebrates."
  *   **Fail:** The proposal argues insect welfare *swamps* vertebrate welfare.
  *   **Judgment Flag:** This is purely political/strategic, not ethical.
  *   **Action:** If **Fail**, reject (to preserve institutional capital).

  ***

  ### Part 3: Running the Procedure on Your Proposals

  Here is how the ISSC applies to your three cases.

  #### Case 1: Cricket Farm Stunning (1 Billion/Year)
  *   **Gate 1 (Sentience):** **Pass.** Nociceptor-like structures and avoidance learning exist. Evidence is thin but present.
  *   **Gate 2 (Sign):** **Pass.** Electrical stunning before processing is a direct physical intervention. It either works (less pain) or doesn't (status quo). Low risk of making it worse.
  *   **Gate 3 (Probability):** **Pass.** "Low single-digit percent" (e.g., 5%) is within the 1-50% bound. It acknowledges uncertainty without vanishing into zero.
  *   **Gate 4 (Leverage):** **Pass.** Funding rollout directly changes the practice at the farm.
  *   **Gate 5 (Portfolio):** **Pass.** Can be framed as "low-cost insurance policy" against massive suffering, not replacing hen/chick work.
  *   **Verdict:** **YES (Proceed to Board).**
      *   *Note:* This is what a valid scale argument looks like. Bounded probability, clear sign, high leverage.

  #### Case 2: Pesticide Campaign (Trillions of Larvae)
  *   **Gate 1 (Sentience):** **Pass.** Larval insects generally meet the same floor as crickets.
  *   **Gate 2 (Sign):** **FAIL.** You noted the welfare sign is unclear. Pesticide death might be quick; natural death might be starvation/parasitism. We do not know the net welfare delta.
  *   **Gate 3 (Probability):** **Pass.** Numbers are huge, but probability isn't the issue here.
  *   **Gate 4 (Leverage):** **Yellow.** Campaign success is uncertain.
  *   **Gate 5 (Portfolio):** **N/A** (Stopped at Gate 2).
  *   **Verdict:** **NOT-YET.**
      *   *Reasoning:* This fails the Sign Clarity test. You cannot maximize expected value if the sign of the value ($+$ or $-$) is unknown. This needs a research grant to model the welfare ecology, not an intervention grant.

  #### Case 3: BSF Freezing vs. Grinding (100 Million/Year)
  *   **Gate 1 (Sentience):** **Yellow/Pass.** BSF larvae are less studied than crickets, but pass the floor.
  *   **Gate 2 (Sign):** **FAIL.** The proposal admits "nobody is sure" if freezing is better than near-instant grinding. Near-instant death is a very high welfare bar to beat. Switching to a slower method without evidence risks *increasing* suffering duration.
  *   **Gate 3 (Probability):** **Pass.**
  *   **Gate 4 (Leverage):** **Pass.** Direct operational change.
  *   **Gate 5 (Portfolio):** **N/A** (Stopped at Gate 2).
  *   **Verdict:** **NO.**
      *   *Reasoning:* This is a classic Sign Error risk. High cost for a potential welfare *negative*. The scale argument cannot rescue a proposal where the intervention might make things worse.

  ***

  ### Part 4: Where This Procedure Will Misfire (Honesty Clause)

  As a philosopher, I must tell you where this tool is blunt.

  1.  **The "False Negative" on Innovation:** Gate 2 (Sign Clarity) will kill high-risk, high-reward ecological interventions. Some of the most impactful insect work *will* involve uncertain signs. By filtering these out, you protect your board but may miss the next big breakthrough in wild insect welfare.
      *   *Mitigation:* Create a separate "R&D" bucket for proposals that fail Gate 2 but pass Gate 1. Fund the research, not the rollout.
  2.  **The "Precision Mask" Remains:** Gate 3 asks you to bound probabilities, but a 5% estimate is still a guess. The procedure makes the guess explicit, but it doesn't make it true.
      *   *Mitigation:* Require proposals to cite *whose* estimate this is (e.g., "Based on Smith et al. 2023 review") rather than letting the applicant generate their own number.
  3.  **The Board Constraint:** Gate 5 protects your credibility, but it institutionalizes the status quo. If insect welfare *is* actually more pressing than vertebrate welfare (a philosophical possibility), this procedure systematically suppresses that truth to keep the board happy.
      *   *Mitigation:* Use the "Yes" cases (like the Cricket Stunning) to slowly educate the board. Show them that insect work can be concrete and measurable, not just abstract math.

  **Summary for your Analyst:**
  If the proposal relies on the *numbers* to do the heavy lifting (Case 2), reject it. If the proposal relies on the *intervention quality* and uses the numbers only to prioritize (Case 1), fund it. If the proposal admits ignorance on whether the intervention helps (Case 3), reject it immediately.
