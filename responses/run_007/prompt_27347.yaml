answer: |-
  The confusion in your seminar is well-founded. "Dirty hands" is one of the most overused and under-defined metaphors in political theory. Since Michael Walzer's seminal 1973 essay *Political Action: The Problem of Dirty Hands*, the term has been stretched to cover everything from "making hard choices" to "war crimes."

  To cut through the noise, here are the four distinct claims usually hiding behind the phrase, ranked from the trivial to the substantive, with definite verdicts on their plausibility.

  ### 1. The Conflict Reading ("Politics involves tragic choices")
  **The Claim:** Political leaders often face situations where two moral values conflict (e.g., honesty vs. security), and satisfying one requires violating the other.
  **The Verdict:** **Implausible as a distinct concept.**
  **The Reason:** This is simply a description of moral dilemmas, which exist in private life just as much as in public life. If a parent must choose between feeding one child or two, they face a tragic choice, but we do not say they have "dirty hands." If "dirty hands" just means "hard decisions," the term adds no analytical value. It reduces political theory to applied psychology.

  ### 2. The Override Reading ("The ends justify the means")
  **The Claim:** Certain political goods (national security, public order) are so valuable that they morally override standard prohibitions (against lying, killing, torturing). The hands are "dirty" only in a metaphorical sense; the act is ultimately justified.
  **The Verdict:** **Implausible.**
  **The Reason:** This is standard consequentialism or utilitarianism dressed in dramatic clothing. If the ends *truly* justify the means, then the act is **right**. If the act is right, the hands are clean. To call them "dirty" while simultaneously arguing the act was the correct thing to do is linguistically and morally incoherent. It attempts to have the benefit of the wrongdoing without the moral cost.

  ### 3. The Walzerian Reading ("Justified Wrongdoing")
  **The Claim:** A politician may be *right* to commit a moral violation (e.g., ordering torture to stop a ticking bomb) in order to serve the public good, but the act remains **objectively wrong**. Consequently, the leader is justified in acting, but not innocent. They must accept guilt, not merely regret.
  **The Verdict:** **Plausible.**
  **The Reason:** This is the only reading that respects the paradox. It acknowledges that political necessity can compel an action that is simultaneously the "right thing to do" (politically/consequentially) and a "moral wrong" (ethically/deontologically). It preserves the integrity of the moral prohibition (torture is still wrong) while acknowledging the burden of office. It explains why we might vote for a leader who did something terrible, provided they acknowledge the terribleness of it.

  ### 4. The Selection Reading ("We want sinners")
  **The Claim:** Because politics requires moral violation, we should actively prefer leaders who are willing to violate morality for the greater good, provided they feel the weight of it. A leader with "clean hands" is dangerous because they are unwilling to do what is necessary.
  **The Verdict:** **Plausible but Normatively Dangerous.**
  **The Reason:** This is plausible as a description of voter psychology and the functional requirements of executive power. However, as a normative theory, it is highly unstable. It creates a perverse incentive structure where candidates may perform "dirty hands" scenarios to signal strength, or genuinely immoral actors may use "necessity" as a shield. It is plausible that we *do* select this way, but dangerous to argue we *should* institutionalize it without rigorous safeguards.

  ***

  ### Which Reading Makes "Dirty Hands" a Distinct Problem?

  **Only Reading 3 (The Walzerian Reading) makes "dirty hands" a distinct philosophical problem.**

  Here is why the others fail the distinctness test:
  *   **Reading 1** is just **General Ethics**. Every human faces conflicting values.
  *   **Reading 2** is just **Consequentialism**. It dissolves the problem by calculating the net good.
  *   **Reading 4** is just **Political Sociology**. It describes how we choose leaders, not the moral structure of the action itself.

  **Reading 3 is distinct because it challenges the coherence of moral theory itself.**
  Standard moral theories (Kantianism, Utilitarianism) strive for consistency. They want an action to be either Right or Wrong. The "Dirty Hands" problem (under Reading 3) asserts that in politics, an action can be **Right and Wrong simultaneously**.

  *   It is **Right** because the leader fulfilled their specific political obligation to protect the community.
  *   It is **Wrong** because they violated a universal moral prohibition.

  This creates a **moral remainder**. In standard ethics, if you make the right choice, you are cleared of blame. In the Dirty Hands problem, even if you make the right choice, you retain **guilt**. This distinguishes "dirty hands" from standard dilemmas where the agent might feel *regret* (sadness that the situation occurred) but not *guilt* (acknowledgment of personal wrongdoing).

  **Seminar Advice:**
  When someone invokes "dirty hands," ask them this: *"Are you saying the act was justified and therefore right, or that it was necessary but remains wrong?"*
  *   If they say **Right**: They are utilitarians. Tell them to drop the "dirty hands" metaphor; it's misleading.
  *   If they say **Wrong**: They are invoking the distinct problem. Ask them: *"If it's wrong, why are we allowing it? And if we allow it, how is the guilt not just performative?"*

  That is where the actual theoretical work begins.
