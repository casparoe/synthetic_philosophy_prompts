prompt: |-
  In my political theory seminar, people keep invoking "dirty hands" as if it's a settled concept — "well, that's just the problem of dirty hands," or "you're ignoring the dirty hands aspect." When I pressed someone on what exactly they meant, I got three different answers from three different people. So before I nod along again: what are the distinct precise claims that "dirty hands" could be making about political action? Separate the readings — from the fairly obvious (politicians sometimes face tragic choices) to the more substantive and controversial (there's something specially political about the justification, or the moral remainder isn't just regret but something closer to guilt, or we should actually want leaders who are willing to do wrong and feel bad about it). For each reading, tell me whether it's plausible or not, and don't just hedge — give me a definite verdict with reasons. And then tell me: which reading, if any, would actually make "dirty hands" a distinct problem rather than just applied ethics with dramatic language?
