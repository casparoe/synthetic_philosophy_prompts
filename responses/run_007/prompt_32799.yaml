prompt: |-
  So in my philosophy of biology class we've been doing the units of selection debate, and two people in my study group got into it after lecture. They were arguing about whether group selection is needed to explain human cooperation. I took some notes but they were going fast. Here's roughly what they said:

  Maya: Look, the basic problem is that in any group of cooperators, a free-rider who takes the benefits without contributing does better than the cooperators. So within the group, selfishness wins. The only way cooperation evolves is if groups with more cooperators outcompete groups with more free-riders. That's group selection, and for humans it's the only game in town — we cooperate with strangers in huge numbers, way beyond what kin selection would predict.

  Liam: But that's exactly what reciprocal altruism plus reputation explains. I help you, you help me, and if you cheat you get a reputation as a cheater and nobody helps you. That's all individual-level selection. No group selection needed.

  Maya: That only works in small groups where you can keep track of who did what. Humans cooperate in the thousands. Tit-for-tat doesn't scale.

  Liam: That's where punishment comes in. People punish cheaters, even at a cost to themselves. So free-riding becomes a bad bet even in large groups. Still individual-level selection — punishers do better than non-punishers over a lifetime because they deter exploitation.

  Maya: But who punishes the punishers? Punishment is a public good — if I sit back and let someone else do the punishing, I get the benefits of a cooperative group without paying the cost. So punishment has the same free-rider problem you started with. You've just pushed it back a level.

  Liam: Punishers gain reputation. People trust them more, want to cooperate with them. So punishing is individually beneficial in the long run. It's not altruistic.

  Maya: That feels like a just-so story. And even if it works, you're describing a system where everyone is constantly monitoring everyone else and calculating reputations. Where did those psychological adaptations come from? You need group selection to explain why we have the moral emotions — the anger at cheaters, the guilt at our own cheating — that make us want to punish in the first place.

  Liam: The moral emotions are just the proximate mechanisms that implement the individual-level strategy. Evolution doesn't need us to consciously calculate costs and benefits; it just needs emotions that track the right cues. A desire to punish cheaters can evolve at the individual level if punishers on average do better.

  Then we had to go to our next class. I'm not sure who got the better of it. Can you go through their exchange move by move and say who's right about what? And overall, does human cooperation actually require group selection, or can individual-level selection handle it?

  Also, I'd appreciate it if you could say how confident you are in your conclusions and flag the point you're least sure about.

  For the format, could you structure it as: (1) "What's at stake" (briefly set up the debate, ~100 words), (2) "Move-by-move" (evaluate each exchange in order, ~500 words), (3) "Overall verdict" (who's more right and what's being missed, ~200 words), and (4) "Confidence and uncertainties" (how confident you are and the shakiest point, ~100 words).
