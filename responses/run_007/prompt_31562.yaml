prompt: |-
  I teach a course on rational choice and behavioral economics to about 25 undergraduates; we have one 75-minute session. Design an in-class game that makes students feel the logic of the dollar auction — the way sunk costs and the desire to avoid a sure loss can drive two people into a bidding war where both end up worse off than if neither had started. I want them to experience the escalation of commitment from the inside, not just hear about it.

  Please provide: the rules of the game (including exactly how bids work, what the payoff structure is, and whether real money is involved or some substitute like points toward a grade), a timeline for the session, and a debrief plan that maps specific moments in the game onto the theoretical concepts (sunk cost fallacy, escalation of commitment, the point at which the game becomes a trap). Also tell me what predictably goes wrong the first time I run it, and be honest about which features of real-world escalation the game cannot capture and I will need to supply in discussion.
