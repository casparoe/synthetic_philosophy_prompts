answer: |-
  Here is a complete lesson plan for running the Dollar Auction in a 75-minute undergraduate session.

  ### **Game Design: The "Twenty-Dollar Trap"**

  **Objective:** To viscerally demonstrate how rational individual decisions lead to collectively irrational outcomes when sunk costs and loss aversion interact.

  **Currency:** **Real Cash (Recommended)** or **Course Points**.
  *   **Option A (High Impact):** You place a **$20 bill** on the table. The winner receives the $20. The runner-up must pay their final bid amount to *you* (or donate it to a charity of the class's choice). *Note: Check your university's gambling policy. If cash is prohibited, use Option B.*
  *   **Option B (Safe/Standard):** **10 Bonus Points** on the final exam. The winner gets +10 points. The runner-up loses their bid amount from their *participation/attendance* grade bucket.
  *   **Why this matters:** The pain of loss must be real. If the "cost" is hypothetical, students will bid to infinity for fun. If it affects their wallet or grade, the anxiety kicks in.

  **The Rules (Project these on the screen):**
  1.  **The Prize:** $20 (or 10 Points) is available to the highest bidder.
  2.  **The Catch:** The **highest** bidder gets the prize. The **second-highest** bidder must pay their bid amount but gets **nothing**.
  3.  **Bidding:** Bids must increase by at least $1 (or 1 Point).
  4.  **Process:** Bids are public. You raise your hand and state your bid.
  5.  **Termination:** The auction ends when no new bids are made after a 10-second count.
  6.  **Collusion:** Any agreement between students to split profits results in disqualification of all parties involved.

  ---

  ### **Session Timeline (75 Minutes)**

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Setup** | Place the $20 bill visibly on the desk. Read the rules clearly. **Do not** editorialize or warn them about the trap. Ask: "Who understands the rules?" |
  | **00:05 – 00:25** | **The Auction** | Run the game. Keep the pace brisk. If bidding stalls early, seed it ("Do I hear $1?"). Stop the auction immediately once bids exceed $20 significantly (e.g., $25–$30) to save time for debrief. |
  | **00:25 – 00:30** | **Settlement** | Collect the "loss" from the second-highest bidder (symbolically or actually). Hand the prize to the winner. Acknowledge the tension in the room. |
  | **00:30 – 01:10** | **Debrief** | Structured discussion mapping game events to theory (see below). |
  | **01:10 – 01:15** | **Wrap-up** | Distribute a one-page summary of the concepts. Assign a short reflection prompt. |

  ---

  ### **Debrief Plan: Mapping Experience to Theory**

  Do not lecture immediately. Ask questions to extract the theory from their experience.

  **Phase 1: The Rational Start (Bids $1 – $9)**
  *   **Ask:** "Who bid $1? What was your logic?"
  *   **Concept:** **Expected Utility.** At the start, the risk is low, and the potential gain ($19 profit) is high. This is standard rational choice.
  *   **Ask:** "When did you first feel a twinge of anxiety?" (Usually around $10).

  **Phase 2: The Sunk Cost Turn (Bids $10 – $19)**
  *   **Ask:** "At $15, the second-highest bidder has already bid $14. If they stop, they lose $14. If they bid $16 and win, they profit $4. Why bid?"
  *   **Concept:** **Sunk Cost Fallacy.** Students will say, "I had too much invested to quit." Explain that the $14 is gone regardless. The only rational choice is to look at *marginal* cost vs. *marginal* gain.
  *   **Key Insight:** The game changes from "How much is this worth?" to "How much will it cost to get my money back?"

  **Phase 3: The Trap (Bids $20+)**
  *   **Ask:** "Once we passed $20, both of you were guaranteed to lose money. Why continue?"
  *   **Concept:** **Loss Aversion & Escalation of Commitment.**
      *   *Loss Aversion:* Losing $22 feels worse than losing $20. We take risks to avoid a *sure* loss, even if it increases expected loss.
      *   *Escalation:* You are no longer bidding for the prize; you are bidding to punish the other player or minimize the bleeding.
  *   **Ask:** "Did anyone feel angry at the other bidder? Did you want to 'win' just to make them lose?" (This introduces **Spite** and non-monetary utility).

  **Phase 4: The Theoretical Wrap**
  *   **Nash Equilibrium:** Technically, the only way to win is not to play. But once playing, there is no stable equilibrium until resources are exhausted.
  *   **Real World Analogy:** Connect to the **Concorde Fallacy** (British/French governments funding a plane they knew wouldn't be profitable), **Vietnam War**, or **bidding wars for startups**.

  ---

  ### **Predictable Pitfalls (What Goes Wrong)**

  1.  **Collusion (The "Cartel"):**
      *   *What happens:* Two friends agree one will bid $1, the other won't bid, and they split the $19 profit later.
      *   *Fix:* Announce strictly: "If I hear any whispering or side deals, the prize is voided and both of you owe me the bid amount." Usually, the threat of public shaming is enough.
  2.  **The "Rich Kid" / "Joker":**
      *   *What happens:* A student bids $100 immediately to end the game or show off.
      *   *Fix:* You must enforce the "Ability to Pay" rule. "Do you actually have $100 on you? If not, your bid is invalid." Keep bids incremental.
  3.  **The "Freeze" (No Bidders):**
      *   *What happens:* Behavioral econ students are savvy. They might read the room and refuse to start.
      *   *Fix:* Have a TA or a confident student pre-briefed to make the opening $1 bid. Once one person bids, competitive instinct usually takes over.
  4.  **Payment Enforcement:**
      *   *What happens:* The second-highest bidder refuses to pay the $25 they owe.
      *   *Fix:* If using cash, keep the stakes low enough ($20 prize) that $25 is payable. If using points, ensure your syllabus allows for point deduction. If a student genuinely cannot pay, have them donate to a charity in front of the class to maintain the "pain of payment" without financial hardship.

  ---

  ### **Limitations: What This Game Cannot Capture**

  Be honest with your students. This game is a model, not reality. You must supply the missing context in your discussion.

  1.  **Fog of War:** In the game, you know exactly what the other person bid. In real escalation (e.g., a price war or military conflict), you often don't know the opponent's costs or commitment level.
  2.  **Turn-Taking:** The game is sequential (I bid, then you bid). Real-world escalation is often simultaneous or continuous, making it harder to identify the exact moment to exit.
  3.  **Organizational Dynamics:** This game is individual. Real escalation usually happens in **groups** (committees, governments). In groups, "diffusion of responsibility" makes escalation worse because no single person feels the pain of the sunk cost.
  4.  **Reputation:** In class, you likely won't see these peers again. In business, backing down might signal weakness to the market, encouraging further attacks. The game ignores **reputational collateral**.
  5.  **The "Win" Condition:** In the game, winning is monetary. In real life, leaders often redefine "winning" mid-stream (e.g., "We aren't fighting for oil anymore, we're fighting for freedom") to justify further costs. The game's goalpost is fixed; real-world goalposts move.

  ### **Instructor Script Snippet (For the Debrief)**
  > "Notice that at $5, you were investors. At $15, you were managers trying to salvage a project. At $25, you were prisoners trying to minimize a sentence. The logic of rational choice didn't change—*you* always wanted to maximize utility. But your definition of 'utility' shifted from 'gain' to 'avoiding pain.' That is the heart of behavioral economics."
