      *   *Phase 1 (The Race):* Players can submit a "Binding Claim" card at any time during a 60-second window.
      *   *Phase 2 (The Resolution):* If one claims and one doesn't, Claimer wins big, Waiter gets small. If both claim, both get nothing (crash). If neither claims, they enter a negotiation phase (or get a moderate default).
      *   *Critique:* This feels like a standard pre-play communication game.
      *   *Refinement for "Commitment Race":* The core of a commitment race is that you want to commit *before* the other person commits, but you'd both be better off if *neither* could commit (allowing for coordination).
      *   *Game Design:* "The Lockbox Dilemma."
      *   *Setup:* Pairs. There is a "Safe Deal" (10 points each) and a "Risky Deal" (20 points for winner, 0 for loser).
