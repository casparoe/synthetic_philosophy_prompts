      *   What defines a commitment race? It's not just a first-mover advantage. It's a situation where the *ability* to commit is valuable, but the *timing* of the commitment is dangerous.
      *   Key tension: If I wait, you might commit first and force me into a worse outcome. If I commit too early, I might lock in a bad deal before information is revealed or before I can negotiate.
      *   Classic example: Two cars speeding toward each other (Chicken), but with the option to rip out your steering wheel *before* the game starts. If both rip out steering wheels, crash. If neither, they can swerve. If one does, that one wins.
      *   Pedagogical challenge: In a classroom, "ripping out steering wheels" is hard to simulate without it becoming just "who raises their hand first."
