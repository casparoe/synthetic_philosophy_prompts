answer: |-
  \summary{This activity forces students into a timed pre-play phase where the incentive to visibly bind themselves to an aggressive strategy before their opponent does creates a race that systematically destroys value through mutual pre-commitment.}

  ### Activity Title: The Pre-Commitment Dash

  #### 1. The Rules (Read Aloud in <3 Minutes)
  "Pair up with the person next to you. You are now a bargaining dyad. Each of you has one index card labeled **COMMIT**.

  **The Objective:** Maximize your individual point total over two rounds.

  **The Mechanism:** You have 60 seconds. At any moment, you may slide your **COMMIT** card face-up to the center of the table.
  *   Once a card touches the table, it **cannot be retrieved**. You are locked in.
  *   If your card is still in your hand when I call 'Time,' you have chosen **WAIT**.

  **The Payoffs:**
  1.  **One Commits, One Waits:** The Committer gets **20 points**. The Waiter gets **5 points**.
  2.  **Both Wait:** Both get **10 points**.
  3.  **Both Commit:** Both get **0 points** (Collision).

  **The Race:** If you commit *before* your partner, you secure the 20. If you wait while they commit, you get the 5. If you both try to secure the 20, you crash.

  I will act as the arbiter. If cards hit the table simultaneously, I will call it a Collision (0 points). Begin Round 1 now."

  #### 2. Minute-by-Minute Sequence (80-Minute Session)

  *   **00:00 – 05:00:** **Setup.** Distribute one index card per student (marked "COMMIT" on one side, blank on the other). Arrange seating into 9 pairs. Draw the Payoff Matrix on the whiteboard.
  *   **05:00 – 07:00:** **Read Rules.** (As above). Answer clarifying questions only (no strategy talk).
  *   **07:00 – 08:00:** **Round 1 Preparation.** Students sit with hands in laps. Emphasize: "You may move at any second. Watch your partner."
  *   **08:00 – 09:00:** **Round 1 Play.** Start stopwatch. Walk the room. Note pairs where hands hover nervously vs. those who slam cards down immediately. Call "Time" at 60s.
  *   **09:00 – 14:00:** **Scoring & Recording.** Pairs self-report outcomes to you. Write results on the board anonymously (e.g., Pair 1: 20/5, Pair 2: 0/0, Pair 3: 10/10). Calculate running totals.
  *   **14:00 – 19:00:** **Silent Reflection.** Ask students to write down one sentence on why they chose their move. *Do not let them talk to partners yet.*
  *   **19:00 – 21:00:** **Round 2 Setup.** "Same rules. Same partners. New cards. Go."
  *   **21:00 – 22:00:** **Round 2 Play.** Run the 60-second timer again.
  *   **22:00 – 27:00:** **Scoring & Recording.** Update board totals. Identify the "Top Scorer" for the bonus incentive.
  *   **27:00 – 80:00:** **Debrief & Lecture.** (See Debrief Plan below).

  #### 3. Payoff Structure & Logic
  **Matrix:**
  | | Partner Commits | Partner Waits |
  | :--- | :---: | :---: |
  | **You Commit** | 0, 0 (Crash) | 20, 5 (Win) |
  | **You Wait** | 5, 20 (Lose) | 10, 10 (Peace) |

  **Why this creates a Commitment Race:**
  *   **Incentive to Commit Early:** If I believe there is *any* chance you will Commit, my best response is to Commit *before* you. If I wait and you commit, I get 5. If I commit before you, I get 20. The gap (15 points) drives the race.
  *   **Incentive to Wait:** If we both Commit, we get 0. If we both Wait, we get 10. The "Peace Dividend" (10) is better than the "Crash" (0).
  *   **The Race Dynamic:** Unlike standard Chicken (simultaneous choice), the 60-second window allows players to *observe* commitment. The moment you slide your card, you have removed your ability to Wait. Your partner sees this and is forced to capitulate (Wait) to avoid the 0. Therefore, the strategic move is to commit **just early enough** to force the partner's hand, but **not so early** that you trigger a simultaneous reaction.
  *   **Not a Coordination Problem:** In pure coordination, we just want to match. Here, we want to *mismatch* (one Commit, one Wait), but we both prefer to be the Committer.
  *   **Not a War of Attrition:** In attrition, you win by waiting longer. Here, you win by acting *sooner* to lock the other out.

  #### 4. Debrief Plan (53 Minutes)

  **Phase 1: The Data (10 mins)**
  *   Look at the board. Count the (0,0) crashes vs. (10,10) peace vs. (20,5) wins.
  *   Ask: "Did behavior change from Round 1 to Round 2?"
      *   *Likely outcome:* Round 1 has random variance. Round 2 often polarizes (either everyone learns to Wait, or everyone gets faster at Committing).
  *   Ask a pair that Crashed (0,0): "At what second did you slide your card?" Usually, they will say "Around 10 seconds." Ask the partner: "When did you slide?" "Around 11 seconds."
  *   **Point:** You were racing to limit your own freedom.

  **Phase 2: Mapping to Theory (20 mins)**
  *   **Schelling's Steering Wheel:** Map the index card to "ripping out the steering wheel." Once the card is on the table, you *cannot* swerve.
  *   **Commitment Race vs. First-Mover Advantage:**
      *   *First-Mover Advantage:* Moving first gives you a benefit (e.g., occupying territory).
      *   *Commitment Race:* Moving first gives you a benefit *only if* the other person sees it and yields. If they don't yield (because they also moved first), you are worse off than if neither had moved.
      *   *Ask:* "Is this a First-Mover Advantage?" **Answer:** No. It is a **First-Commitment Advantage** that carries a systemic risk of collapse.
  *   **Wars of Attrition:** Contrast this. In attrition (e.g., bidding fee auctions), you win by enduring cost longer. Here, you win by incurring cost (loss of flexibility) *sooner*.

  **Phase 3: The Normative Question (20 mins)**
  *   **Question:** "Is it rational to regret winning?"
  *   **Scenario:** Address the student who got 20 points in Round 1. "You won. But imagine a world where neither of you had index cards. You would have both Waited and gotten 10. You got 20, your partner got 5. Total social welfare = 25. In the 'No Cards' world, total welfare = 20. You gained, they lost."
  *   **Deepen:** "Now imagine the pairs that got 0,0. Total welfare = 0. If you couldn't commit, you'd have 20. Is it rational to wish you lacked the *capacity* to commit?"
  *   **Schelling's Paradox:** Yes. It is rational to wish you were *unable* to commit, because that inability forces the other player to commit, yielding the prize to them (if you value peace) or forcing a negotiated settlement.
  *   **Real World Application:** Nuclear pre-delegation, burning bridges in negotiation, public threats on Twitter. When does making yourself "crazy" or "bound" help, and when does it cause a crash?

  **Phase 4: Conclusion (3 mins)**
  *   Summarize: Commitment is a tool. But when the tool is available to both sides in a contest, it becomes a weapon that can destroy the value both sides seek.

  #### 5. Predictable Failure Modes & Fixes

  **Failure Mode 1: The "Polite Standoff" (Everyone Waits)**
  *   *What happens:* In Round 1, no one slides a card. All pairs get 10/10.
  *   *Why:* Students are conflict-averse or treat it as a cooperative classroom exercise.
  *   *Fix:* In Round 2, announce: "The bonus for top scorer requires a score above 30 points." This forces aggression. Or, during the debrief, highlight this as a "Successful Norm" but ask: "What if one person defected? Would you feel stupid?" This surfaces the instability of the peace.

  **Failure Mode 2: Simultaneity Confusion**
  *   *What happens:* Two cards hit the table at the exact same moment. Students argue about who was first.
  *   *Why:* Human reaction time is imprecise.
  *   *Fix:* Pre-announce the rule: "If I cannot clearly distinguish a sequence, I rule it a Collision (0,0)." Be ruthless in Round 1. This increases the risk of the race, making the "Wait" option more attractive in Round 2.

  **Failure Mode 3: The "Bluffer"**
  *   *What happens:* A student slides the card face *down*, or hovers it, trying to see if the partner moves.
  *   *Why:* They are trying to get the benefit of commitment without the cost.
  *   *Fix:* Rule enforcement. "Card must be face up to count. Hovering counts as Wait." This reinforces that commitment requires *visibility* and *irreversibility*.

  **Failure Mode 4: One Dominant Pair**
  *   *What happens:* One pair figures out the "collusive" strategy (alternate who wins) and racks up points, skewing the bonus.
  *   *Why:* Repeated game logic kicks in too fast.
  *   *Fix:* Randomize partners for Round 2 if possible, or explicitly forbid communication between rounds. If they do collude, use it in the debrief: "They escaped the race by forming an institution. How do states escape commitment races?" (Treaties/Verification).

  #### 6. Limitations & Compensation

  **Limitation:** **Reversibility.** In the game, a student *could* theoretically snatch the card back before the 60 seconds are up, despite the rules. In real commitment races (e.g., burning a bridge), the action is physically irreversible.
  *   **Compensation:** In the debrief, explicitly state: "In this game, I enforced irreversibility. In reality, reputational costs enforce irreversibility. If a President threatens war and backs down, they lose credibility. That 'cost' is what makes the card hard to pick up."

  **Limitation:** **Perfect Information.** Students see each other across a small table. In reality, commitment is often signaled through intermediaries or media, introducing noise.
  *   **Compensation:** Ask: "How would this game change if you sat back-to-back?" (It becomes standard Chicken). This highlights that commitment races require the *observation* of the commitment to function.

  **Limitation:** **Single Issue.** The game is one-off. Real commitment races often happen over multiple issues.
  *   **Compensation:** Mention in the debrief that "Linkage" (connecting this issue to another) is how actors slow down commitment races in diplomacy.

  \summary{This activity forces students into a timed pre-play phase where the incentive to visibly bind themselves to an aggressive strategy before their opponent does creates a race that systematically destroys value through mutual pre-commitment.}
