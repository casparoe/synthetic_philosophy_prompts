      *   *Wait, the prompt asks for "committing early should sometimes be a mistake... and sometimes be essential."*
      *   *Adjustment:* Introduce uncertainty.
      *   *Game:* "The Resource Grab."
      *   *Pairs.* There are two resources: Gold (20 pts) and Silver (10 pts).
