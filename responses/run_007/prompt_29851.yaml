prompt: |-
  I've been poking around the history-of-science side of the current astrology app boom and I keep coming back to Kepler. You know the picture: the guy who gave us the laws of planetary motion also spent a lot of time casting horoscopes, including for Wallenstein, and he had a carefully worked-out position where most of the astrology around him was nonsense but astrology itself could be saved. He thought the zodiac signs were mostly arbitrary earthly conventions, and that the real causal channel was the angular relationships between planets — the aspects — which he believed acted on the soul through a kind of built-in geometrical sensitivity. So here's the counterfactual I want: drop Kepler into the present, hand him a phone with Co-Star's push notifications and an LLM that produces a daily horoscope from your birth chart, and let him react. What would he recognize as his own project, what would he think is the same old vulgar stuff with better typography, and where might he think the new tools accidentally got closer to his reformed astrology than the tradition ever did? I know its speculative — I want you to actually do the work of distinguishing what follows from his documented views from what your inventing, tell me how confident you are, and point at the one claim you're least sure about.
