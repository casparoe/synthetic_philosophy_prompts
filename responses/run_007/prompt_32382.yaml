answer: |-
  Subject: Re: Lewis triviality debate

  Thanks for sending this through, and I hope you're feeling better after what sounds like a pretty intense session. It is honestly no surprise you both ended up going in circles because this is one of the notorious hard problems in philosophical logic, and even people who work on this full-time disagree about the upshot. Since you asked me to adjudicate without pulling punches, I am going to walk through the dialectic step by step and tell you where each of you was on solid ground and where you slipped up, before giving you my verdict on the overall state of play.

  Starting with the opening moves, your friend was technically correct about the core of Lewis's result in point one. Lewis did show that if you assume indicative conditionals express propositions and that the probability of that proposition equals the conditional probability, then under plausible assumptions about how probability functions update, you get a collapse where the probability of the conditional equals the probability of the consequent. That part of his setup is standard and your friend summarized it accurately. However, in point two, you made a very sharp technical objection that often gets overlooked in introductory discussions. You are right that Lewis's original proof relies on the assumption that the equation holds for all probability functions reachable by conditionalization. If you restrict the Ramsey test equation to only the agent's current credence function, the original proof does not go through. This is a legitimate escape route known in the literature. But your friend pushed back correctly in point three by appealing to stronger results. It is not just Lewis who worked on this; Alan Hajek produced several triviality results in the nineties that show even restricted versions of the equation lead to triviality unless the probability function is extremely simple or the logic is very weak. So while you were right that the original proof relies on closure, your friend was right that restricting the equation to current credence does not actually save the truth-conditional view from triviality without incurring massive costs elsewhere. On the specific technicality of the original proof you were right, but on the broader implication that restriction saves the day, your friend had the stronger grasp of the subsequent literature.

  Moving on to the semantic alternatives, your suggestion in point four about three-valued semantics is actually one of the most popular ways contemporary philosophers handle this. If you adopt a semantics where conditionals are true when the antecedent and consequent are true, false when the antecedent is true and consequent false, and undefined or void when the antecedent is false, then Lewis's result does not apply because Lewis assumes classical bivalence. Philosophers like Jeffrey and more recently Bradley have worked on this. So you were right that this dodges the triviality proof. However, your friend's response in point five touches on a deeper philosophical worry. When you say these approaches give up classical truth conditions, your friend is right to ask whether what remains is really a truth condition in the sense that matters for propositional attitude ascriptions. Dorothy Edgington's view, which your friend cited, is that conditionals are not truth-apt at all but are instead devices for expressing conditional degrees of belief. Your friend was a bit unfair to call three-valued semantics mere relabeling, because it is a rigorous formal system, but they were right that the structural lesson of triviality is that conditionals do not behave like standard factual propositions. Neither of you was wrong here, but you were talking past each other about what counts as a truth condition.

  This brings us to the embedding problem, which is where I think you landed the strongest blow in the debate. In point six, you correctly identified the biggest headache for the non-propositional view. If conditionals do not express propositions, it is very hard to explain why they can be embedded in disjunctions, negations, and quantifiers. We say things like either if it rains the match is cancelled or if it snows the match is cancelled and that sentence seems meaningful and truth-evaluable. If the conditional parts aren't propositions, what is the disjunction joining? This is a massive hurdle for views like Edgington's. Your friend's response in point seven was the weakest part of their performance. They claimed that not if A then C is equivalent to if A then not C, but that is highly controversial and arguably false on most accounts. Usually the negation of a conditional is taken to be compatible with the antecedent being true and the consequent false, whereas if A then not C makes a claim about what happens when A is true. Equating them solves the embedding problem only by adopting a very specific and contentious logic. Furthermore, dismissing nested conditionals as notoriously weird is a bit of a dodge because they appear in natural language often enough that a semantic theory needs to handle them. On the embedding issue, you were clearly right to press this as a major cost of the non-propositional view.

  Finally, regarding logic and validity in points eight and nine, you both identified real costs on both sides. You are right that if conditionals lack truth conditions, we need a new account of validity, typically cashed out in terms of probability preservation rather than truth preservation, following the work of Ernest Adams. This is less intuitive than the classical model. However, your friend was also right that the truth-conditional story is not without sin. The material conditional fails to capture the meaning of indicatives, and possible worlds semantics like Stalnaker's avoid triviality only by denying that the probability of the conditional equals the conditional probability. Your friend missed a crucial nuance here though. There is a middle ground where you keep truth conditions but deny the Ramsey test holds for probabilities rather than acceptance. Stalnaker argues that we assess conditionals by the Ramsey test for acceptability, but that does not mean the probability of the proposition expressed is the conditional probability. This allows one to keep truth conditions and avoid triviality, though it requires saying our intuitive probability judgments are slightly misleading. Your friend presented the choice as between truth conditions with triviality or no truth conditions, missing this sophisticated truth-conditional escape route.

  So to give you a final verdict, I would say that on the specific technical details of Lewis's proof and the restriction move, you were initially correct but your friend was right about the broader implications given Hajek's results. On the semantic options, you were right that three-valued semantics avoids triviality, but your friend was right that it comes with metaphysical costs. On the embedding problem, you were definitely right and your friend glossed over a serious difficulty. On the logic and the overall landscape, your friend was right that non-propositionalism takes the Ramsey test more seriously, but they were wrong to ignore the Stalnaker-style view that keeps truth conditions by denying the probability equation. Overall, I think you had the slightly stronger position because the embedding problem is currently the biggest weapon against non-propositionalism, and your friend did not have a satisfactory answer for it. However, the current consensus in the field is not that one side has won, but rather that we have to choose which bullet to bite. Most working logicians tend to favor truth-conditional accounts like Stalnaker's or three-valued accounts because they handle embedding better, while epistemologists often lean toward the non-propositional view because it handles the probability data better. The triviality results are devastating for the naive view that conditionals are propositions and probabilities match conditional probabilities, but they are not devastating for truth-conditionalism broadly construed, provided you are willing to deny the Ramsey equation for probability. So you were right to resist the conclusion that truth conditions are dead, but your friend was right that the naive equation has to go. I hope that helps clear things up, and maybe stick to coffee next time you discuss probabilistic logic.
