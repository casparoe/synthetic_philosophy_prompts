  This order reflects logical precedence over immediate tractability, ensuring foundational clarity before data collection. It prioritizes framework building over empirical accumulation to avoid validity gaps.

  1.  **Operationalizing Valence:** Define whether welfare is affective or functional to prevent measuring irrelevant proxies across taxa.
  2.  **Evidence Standards:** Establish minimal neurobehavioral criteria for credence in valenced experience specific to decapod and teleost nervous systems.
  3.  **Cross-Species Weighting:** Develop a framework for comparing welfare intensity across species with divergent life histories and neural densities.
  4.  **Intervention Mapping:** Identify which farm modifications hinge on resolving conceptual uncertainties rather than engineering limits.
  5.  **Neural Correlates:** Fund comparative neuroanatomy only where it directly tests the evidence standards established in question two.

  ### Criteria and dependencies

  I am prioritizing based on **logical precedence** over immediate tractability. If we measure the wrong thing, precision is worthless. **Importance** is maximal because these questions govern the validity of all subsequent empirical work. **Neglectedness** is high; most funding flows to applied welfare science assuming mammalian-centric models of pain apply directly to fish or shrimp, which is epistemically risky. **Tractability** is moderate; conceptual clarity is hard, but a dedicated interdisciplinary team can produce frameworks within two years.

  **Dependencies:** Questions 1 (Operationalizing Valence) and 2 (Evidence Standards) are strictly upstream of Question 4 (Intervention Mapping). You cannot determine if stocking density harms welfare if you haven't defined whether welfare is primarily affective or functional. Question 3 (Cross-Species Weighting) is upstream of portfolio allocation between fish and crustacean projects. Question 5 (Neural Correlates) is downstream of Question 2; collecting neural data without agreed evidence standards is just data hoarding. The bottleneck is not a lack of data points, but a lack of a coherent theory linking neural/behavioral data to moral status. Therefore, funding must target the framework builders, not just the data collectors. Without this architecture, empirical results remain incomparable across labs and species. Most existing metrics are validated on mammals, creating a validity gap for aquatic species that is rarely acknowledged. Furthermore, Question 3 is critical because without it, we cannot prioritize between helping many small animals versus fewer large ones.

  ### The case for the top two

  Funding Question 1 (Operationalizing Valence) is the highest-leverage investment because the field currently oscillates between anthropomorphic projection and behaviorist skepticism. A two-year project led by a philosopher of mind paired with a welfare scientist can produce a **Taxon-Specific Welfare Framework**. This document would explicitly state whether we are optimizing for preference satisfaction, affective state, or biological functioning for shrimp versus salmon. The deliverable is not just a paper, but a standardized metric protocol for certification bodies to adopt, preventing the current fragmentation where "humane" means different things across schemes.

  Question 2 (Evidence Standards) addresses the "citation-slinging" deadlock you described. Current debates fail because proponents use mammalian benchmarks for invertebrate nervous systems. A dedicated team can develop a **Bayesian Credence Model** for sentience. Instead of binary "sentient/not," researchers would output probability distributions based on specific markers (e.g., opioid responsiveness, trade-off behavior) weighted by phylogenetic distance. The concrete deliverable is a decision tree for grantmakers and regulators: "If species X shows behavior Y with neural structure Z, credence rises to P%." This allows funding to flow to high-probability interventions without waiting for impossible proof of subjective experience. Together, these projects transform welfare science from a collection of disjointed facts into a cumulative discipline. Without this, we risk optimizing farms for human comfort rather than animal experience. We need to know if we are reducing suffering or just reducing visible distress signals. The risk of inaction is substantial: we may spend millions optimizing water quality for fish that do not experience discomfort from ammonia in the way we assume, while ignoring cognitive frustration in crustaceans. By funding the conceptual architecture first, we ensure that every subsequent dollar spent on empirical trials buys actual welfare improvement rather than merely satisfying regulatory checklists.

  ### What I would deprioritize

  I would deliberately underfund **specific intervention efficacy trials**, such as comparing CO2 versus electrical stunning for salmon. While this feels urgent to practitioners, it is downstream of the conceptual work. If we haven't agreed on whether welfare is primarily about unconsciousness speed (affect) or stress hormones (functioning), a trial optimizing for one might worsen the other. Funding engineering tweaks now assumes we know what "better" looks like. We do not. These trials should wait until the Welfare Framework (Question 1) defines the target outcome. Money spent here now risks generating precise answers to the wrong questions. Furthermore, industry partners often prefer these tangible trials because they delay harder ethical questions. Resist that pressure.

  ### Tripwires

  For Question 1, if major certification bodies adopt a unified welfare definition independently, this project moves down as the market solves the coordination problem. Conversely, if new neurobiology reveals aquatic nervous systems are fundamentally incompatible with current affective models, Question 1 moves up as urgent crisis management. For Question 2, if a breakthrough study demonstrates a universal neural signature for valence across vertebrates and invertebrates, the need for a Bayesian model diminishes, moving it down. However, if regulatory bodies begin legally defining sentience binary (yes/no) rather than probabilistically, Question 2 moves up critically to prevent bad policy. These tripwires ensure we pivot if the conceptual landscape shifts unexpectedly. We must remain agile; if the philosophy proves intractable, we must pivot to robust proxy measures, but only after a genuine attempt at foundational clarity.
