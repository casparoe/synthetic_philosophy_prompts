      *   Instead of "Awkward," use "Scope Limiters" (reduce where CP applies).
      *   *Crucial Nuance:* The user says "reliable guide," not "infallible guarantee." This makes "Fatal" harder. A "Fatal" objection must show it's *not reliable*, i.e., no better than chance, or systematically biased.
      *   *Revised Ranking:*
