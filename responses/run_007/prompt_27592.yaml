          3.  **The Ontological Cost:** If CP forces you into Dualism or Panpsychism to avoid contradiction. (High theoretical cost).
          4.  **The Idealization Problem:** If "ideal conceivability" is inaccessible to humans. (Awkward/Practical).

  7.  **Addressing the "Defender's Concession":**
