      *   **Goal:** A decision procedure (checklist/flowchart style) grounded in philosophical action theory (shared intention, joint commitment) but usable by non-philosophers.
      *   **Requirements:**
          *   Sequence of questions with stopping rules (Joint, Parallel, Escalate).
          *   Evidence types for each question.
          *   Standard of proof for each step.
          *   Application to three specific cases.
          *   Honest limitations assessment (judgment calls, circumstantial evidence, divergent understandings, arbitrary lines).

  2.  **Theoretical Foundation (Philosophy of Action):**
      *   *Key Thinkers:* Michael Bratman (Shared Intention), Margaret Gilbert (Joint Commitment), Raimo Tuomela (We-Mode).
      *   *Core Concepts:*
          *   **Mutual Responsiveness:** Participants adjust their actions based on the others' actions/intentions.
          *   **Commitment to the Joint Activity:** It's not just "I do X" and "You do Y," but "We do Z."
          *   **Common Knowledge/Mutual Belief:** Each knows the other intends to participate, and knows the other knows, etc.
          *   **Interdependence:** My action makes sense *because* you are doing yours.
      *   *Translation to Compliance:* Move away from "Did they talk?" to "Did they act as a unit?"

  3.  **Drafting the Decision Procedure (The "Joint Action Assessment Protocol" - JAAP):**
      *   *Structure:* Needs to be linear but allow for looping/escalation.
      *   *Tone:* Professional, investigative, evidentiary.
      *   *Steps:*
          1.  **Explicit Agreement (The "Smoking Gun"):** Direct evidence of planning.
          2.  **Mutual Responsiveness/Interdependence:** Did actions depend on each other?
          3.  **Common Knowledge:** Did they know others were participating?
          4.  **Benefit/Outcome Structure:** Does the outcome require multiple actors to work?
          5.  **Post-Hoc Behavior:** Cover-ups, alibis, consistent stories.
      *   *Standards of Proof:* Preponderance of Evidence (typical for internal investigations), but nuanced per step.
      *   *Stopping Rules:* Clear "Joint," "Parallel," or "Escalate."

  4.  **Refining the Procedure (Self-Correction/Constraint Check):**
