  9.  **Final Polish:** Check formatting for readability (bolding, lists). Ensure the "Philosophical Limitations" section is robust, as requested. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I explicitly name the philosophical concepts (Shared Intention, Mutual Responsiveness) in the introduction so the user knows it's grounded, but keep them out of the checklist itself so it remains usable. I also need to ensure the "Escalate" condition is clear—it's not just "we don't know," it's "this requires senior judgment/legal review."

