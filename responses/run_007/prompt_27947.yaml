      *   *Critique:* What about the "arbitrary line"?
      *   *Fix:* Acknowledge in the limitations section that "shared intention" is a mental state we infer, not observe.

  5.  **Running the Cases:**

      *   **Case 1 (Expense Reports):**
          *   *Facts:* Identical reports, same week, no communication evidence, same training.
          *   *Analysis:* High similarity suggests a common source (training), but lacks interdependence. Did Manager A need Manager B to submit for their submission to work? Probably not.
          *   *Verdict:* Likely Parallel (with a note on "common cause" vs. "collusion").

      *   **Case 2 (Engineers/Test Falsification):**
          *   *Facts:* Verbal suggestion, nod, denial, claim of authority.
          *   *Analysis:* This is classic implicit joint action. The nod signifies acceptance. The interdependence is high (one suggests, one executes). The "authority" defense complicates the *mens rea* but not necessarily the joint nature of the act.
          *   *Verdict:* Joint Action (though culpability might differ).

      *   **Case 3 (Slack/HR Complaints):**
          *   *Facts:* Channel discussion, proposal for identical wording, emojis, some file identical, one files separate but references, one files silent but similar.
          *   *Analysis:* This is a spectrum. The emoji agreetors who filed are clearly joint. The separate filer referencing the group is a hybrid (joint intent, individual execution). The silent reader is the hardest (parallel influenced by group).
          *   *Verdict:* Mixed. Core group = Joint. Silent reader = Escalate/Parallel.

  6.  **Addressing Limitations & Philosophical Honesty:**
