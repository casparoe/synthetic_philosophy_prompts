answer: |-
  This is a sophisticated request that touches on the intersection of legal compliance, organizational psychology, and the philosophy of action. To build this, I have drawn primarily on **Michael Bratman's theory of Shared Intention** (focusing on mutual responsiveness and commitment to the joint activity) and **Margaret Gilbert's theory of Joint Commitment** (focusing on the creation of a "plural subject").

  The following protocol translates these abstract concepts into an investigative tool. It moves beyond the binary of "communication vs. silence" to focus on **interdependence** and **mutual knowledge**.

  ***

  # The Joint Action Assessment Protocol (JAAP)

  **Purpose:** To distinguish between *Joint Action* (collusion, conspiracy, coordinated misconduct) and *Parallel Individual Action* (coincidence, common cause, independent convergence).
  **Standard of Proof:** Preponderance of the Evidence (>50% likelihood) for internal classification. *Note: If sanctions require a higher legal standard (e.g., termination for cause), escalate accordingly.*
  **Usage:** Investigators should proceed sequentially. A "Yes" at any stage may establish Joint Action. A "No" at all stages suggests Parallel Action. Ambiguity at critical junctures requires Escalation.

  ### Step 1: Explicit Agreement (The "Smoking Gun")
  **Question:** Is there direct evidence of an agreement, plan, or explicit request to coordinate the specific misconduct?
  *   **Evidence:** Emails, chats, meeting minutes, recorded calls, signed documents, witness testimony confirming verbal agreements.
  *   **Standard:** Clear and Convincing.
  *   **Stopping Rule:**
      *   **YES:** Classify as **Joint Action**. (Stop).
      *   **NO:** Proceed to Step 2.

  ### Step 2: Mutual Responsiveness (Interdependence)
  **Question:** Did Participant A's actions depend on, adjust to, or enable Participant B's actions in a way that makes no sense in isolation?
  *   **Philosophical Basis:** Bratman's "Mutual Responsiveness." In joint action, I do my part *because* you are doing yours.
  *   **Evidence:**
      *   *Timing:* Actions occur in a sequence where the second action relies on the first (e.g., A approves a fake invoice, B processes payment).
      *   *Content:* A's report references B's data; B's alibi supports A's timeline.
      *   *Division of Labor:* Tasks are split to avoid detection (e.g., one person deletes logs, another alters the backup).
  *   **Standard:** Preponderance of the Evidence.
  *   **Stopping Rule:**
      *   **YES (High Interdependence):** Classify as **Joint Action**. (Stop).
      *   **NO (Independent Viability):** If A's action would have happened exactly the same way even if B never acted, proceed to Step 3.

  ### Step 3: Common Knowledge of Participation
  **Question:** Did each participant know the others were participating, and did they know the others knew?
  *   **Philosophical Basis:** "Common Knowledge" or "Mutual Belief." Parallel action lacks this; I might know you are doing it, but I don't know that you know I am doing it to support you.
  *   **Evidence:**
      *   *Acknowledgement:* Nods, winks, "thumbs up" emojis, CC'ing on emails without comment.
      *   *Opportunity:* Were they in a room together when the decision was made? (Even if unrecorded).
      *   *Post-Act Behavior:* Consistent stories developed after the fact; checking in with each other before speaking to investigators.
  *   **Standard:** Preponderance of the Evidence.
  *   **Stopping Rule:**
      *   **YES:** Classify as **Joint Action**. (Stop).
      *   **NO:** Proceed to Step 4.

  ### Step 4: Common Cause vs. Coordination
  **Question:** Can the similarity in conduct be fully explained by a shared external factor (training, policy, market pressure) without requiring interpersonal coordination?
  *   **Philosophical Basis:** Distinguishing "We-Mode" (joint) from "I-Mode" (parallel).
  *   **Evidence:**
      *   *Policy/Training:* Did a new rule incentivize this specific behavior for everyone equally?
      *   *Market/Environment:* Did a supply shock force all vendors to raise prices simultaneously?
      *   *Template Usage:* Are the similarities due to using the same software template rather than copying each other?
  *   **Standard:** Preponderance of the Evidence.
  *   **Stopping Rule:**
      *   **YES (Explained by Common Cause):** Classify as **Parallel Individual Action**. (Stop).
      *   **NO (Similarity exceeds Common Cause):** **ESCALATE**. (This indicates tacit collusion or requires senior judgment).

  ### Step 5: Commitment to Joint Outcome (The "We" Test)
  **Question:** Did the participants act to protect the *group's* interest in the misconduct, rather than just their own?
  *   **Philosophical Basis:** Gilbert's "Joint Commitment." Participants feel obligated to the group unit.
  *   **Evidence:**
      *   *Cover-ups:* One participant lies to protect another, not just themselves.
      *   *Resource Sharing:* Sharing tools or access rights to facilitate the other's part of the act.
      *   *Risk Distribution:* Agreeing (implicitly or explicitly) to split the blame if caught.
  *   **Standard:** Preponderance of the Evidence.
  *   **Stopping Rule:**
      *   **YES:** Classify as **Joint Action**. (Stop).
      *   **NO:** Classify as **Parallel Individual Action**. (Stop).

  ***

  # Case Applications

  ### Case 1: The Inflated Expense Reports
  *   **Facts:** Three managers, identical reports, same week, no communication evidence, same recent training.
  *   **JAAP Run:**
      *   *Step 1 (Explicit Agreement):* **No.** No emails or comms found.
      *   *Step 2 (Mutual Responsiveness):* **No.** Manager A's submission did not depend on Manager B's. Each could have submitted alone.
      *   *Step 3 (Common Knowledge):* **No.** No evidence they knew the others were submitting inflated claims *at that time*.
      *   *Step 4 (Common Cause):* **Yes.** All attended the same compliance training two weeks prior. It is highly probable the training inadvertently highlighted a loophole or ambiguity that all three exploited independently.
      *   *Step 5 (Commitment):* **N/A.**
  *   **Classification:** **Parallel Individual Action.**
  *   **Investigative Note:** While the conduct is identical, the "common cause" (training) explains the convergence without requiring shared intention. Sanctions should be individual, not collective.

  ### Case 2: The Falsified Test Result
  *   **Facts:** Verbal suggestion, nod, execution. One denies suggesting, one claims coercion/authority.
  *   **JAAP Run:**
      *   *Step 1 (Explicit Agreement):* **Inconclusive.** No recording, conflicting testimony.
      *   *Step 2 (Mutual Responsiveness):* **Yes.** The falsification required two roles: the suggestion/authorization and the data entry. The entry relied on the suggestion.
      *   *Step 3 (Common Knowledge):* **Yes.** The "nod" constitutes non-verbal acknowledgment. The second engineer knew the first was proposing misconduct; the first knew the second was the gatekeeper for data entry.
      *   *Step 4 (Common Cause):* **No.** External pressure doesn't explain the specific division of labor (suggest vs. enter).
      *   *Step 5 (Commitment):* **Yes.** The second engineer proceeded to protect the workflow/relationship, indicating a commitment to the joint outcome over compliance.
  *   **Classification:** **Joint Action.**
  *   **Investigative Note:** The "insubordination" defense addresses *mitigation* or *culpability levels*, not the existence of joint action. The nod established the shared intention. This requires escalation to Legal/HR to determine if the "authority" claim mitigates the second engineer's liability, but the act itself was joint.

  ### Case 3: The Slack Channel HR Complaints
  *   **Facts:** Group discussion, proposal for identical wording, emojis, mixed filing methods (identical, referenced, silent echo).
  *   **JAAP Run:**
      *   *Step 1 (Explicit Agreement):* **Mixed.** The proposal to use "identical wording" was explicit. Emoji agreements count as explicit acceptance in digital comms.
      *   *Step 2 (Mutual Responsiveness):* **Mixed.** The three who filed identical wording acted jointly. The one who filed separately but referenced the group showed responsiveness. The silent reader did not respond to the group.
      *   *Step 3 (Common Knowledge):* **Mixed.** The channel participants knew who was in. The silent reader knew the group's intent, but the group did not know the silent reader was acting.
      *   *Step 4 (Common Cause):* **No.** While they share a grievance (supervisor), the coordination on *wording* exceeds common cause.
      *   *Step 5 (Commitment):* **Mixed.**
  *   **Classification:** **Split Classification.**
      *   *Proposer + Emoji Agreers who Filed:* **Joint Action.** (Shared intention to file coordinated complaint).
      *   *Separate Filer (Referenced Group):* **Escalate.** (Hybrid case: Individual execution, but reliant on group strategy. Likely Joint Action regarding the *strategy*, Individual regarding the *filing*).
      *   *Silent Reader:* **Parallel Individual Action.** (Influenced by the group, but lacked the "common knowledge" loop—the group didn't know they were in. This is "parallel action influenced by public information").
  *   **Investigative Note:** This case highlights that "Joint Action" is not a binary switch for a whole group; it applies to specific dyads or clusters within a group.

  ***

  # Limitations, Judgment Calls, and Philosophical Honesty

  As requested, here is an honest assessment of where this procedure fails, where it forces arbitrary lines, and what it cannot do.

  ### 1. The Problem of Circumstantial Evidence and Denial
  **Can it distinguish joint from parallel action when all evidence is circumstantial and participants deny coordination?**
  **Honestly: No.**
  The JAAP relies on inferring mental states (intention, knowledge) from behavior. If three people commit fraud perfectly in sync but leave no digital trail and deny talking, the JAAP will likely flag Step 2 (Interdependence) as "Yes" due to the statistical improbability of the sync. However, it will hit a wall at Step 4 (Common Cause).
  *   **The Limit:** The procedure cannot *prove* a secret meeting occurred. It can only prove that the behavior is *inconsistent* with parallel action. In these cases, the procedure forces an **ESCALATE**. It cannot give a definitive "Joint" verdict without risking a false positive based on coincidence.
  *   **Philosophical Reality:** Shared intention is a psychological fact. If we cannot access the psychology (via confession or comms), we are left with behavioral proxies. These proxies are fallible.

  ### 2. Divergent Understandings (The "Bratman Problem")
  **Does the procedure handle cases where parties had different understandings of what they were jointly doing?**
  **Honestly: Only partially.**
  Philosopher Michael Bratman notes that shared intention does not require identical motives. I might help you rob a bank because I want money; you might help me because you want to destroy the bank's records. We still share the intention to *rob the bank*.
  *   **The Procedure's Handling:** Step 5 (Commitment to Joint Outcome) captures this. If they protect the *act*, the motive matters less.
  *   **The Gap:** If Engineer A thinks they are "temporarily bending rules to save the project" and Engineer B thinks they are "permanently falsifying data to hide negligence," the JAAP classifies this as **Joint Action** (because they jointly falsified the data).
  *   **The Risk:** This is practically necessary but philosophically rough. It treats them as co-conspirators for the *act*, even if their *mens rea* (guilty mind) differs significantly. The procedure classifies the *conduct*, not the *moral culpability*. You will need a separate mitigation phase for sentencing.

  ### 3. The Arbitrary Line: "Influence" vs. "Commitment"
  **Where does the procedure draw a line that is philosophically arbitrary but practically necessary?**
  **The Line:** Step 3 (Common Knowledge) regarding the "Silent Reader" in Case 3.
  *   **The Philosophy:** In social theory, if I read your plan and adopt it without telling you, am I part of your "group agent"? Some theorists say yes (we are aligned); others say no (no mutual obligation).
  *   **The Procedure's Choice:** The JAAP draws the line at **Mutuality**. If the group doesn't know the silent reader is in, there is no joint commitment *to the silent reader*.
  *   **Why it's Arbitrary:** The silent reader's conduct is functionally identical to the group's. The harm to the organization is the same. But because the "feedback loop" wasn't closed, we classify them as Parallel.
  *   **Practical Necessity:** If we classified silent alignment as Joint Action, *every* employee who reads a company-wide memo and independently decides to violate the policy based on that memo could be charged with collusion with the memo's author. We must limit Joint Action to cases where there is a *feedback loop* of intention.

  ### 4. The "Nod" and Non-Verbal Coordination
  **Judgment Call:** Step 1 and 3 rely on investigators interpreting non-verbal cues (nods, winks, silence).
  *   **The Risk:** This is highly subjective. One investigator sees a "conspiratorial nod"; another sees "acknowledgement of hearing."
  *   **Mitigation:** The procedure requires corroboration (Step 2 Interdependence). A nod alone is not enough; the subsequent action must depend on that nod. If the engineer nodded but *didn't* falsify the data, there is no joint misconduct. The action validates the interpretation of the signal.

  ### 5. What This Procedure Cannot Do
  1.  **It cannot determine "Who is the Leader."** Shared intention theory treats participants as partners in the intention, even if one is more dominant. Determining ringleaders requires a separate hierarchy analysis.
  2.  **It cannot quantify "Degrees of Collusion."** It is a binary classifier (Joint vs. Parallel). It cannot tell you if a case is "51% collusive" vs "90% collusive."
  3.  **It cannot replace legal counsel on conspiracy.** Legal definitions of conspiracy often require an *overt act* in furtherance of an agreement. This procedure identifies *philosophical joint action*, which is broader than legal conspiracy in some ways (tacit understanding) and narrower in others (requires mutual knowledge). **Always escalate Joint Action findings to Legal before charging "Conspiracy."**

  ### Final Recommendation for Implementation
  Treat the JAAP as a **triage tool**, not a verdict.
  *   **Parallel:** Close case or sanction individually.
  *   **Joint:** Escalate to Legal/HR for coordinated sanctioning and potential "concerted activity" analysis (especially in unionized environments).
  *   **Escalate:** Assign your most senior investigator. These are the cases where the philosophy runs out and human judgment must take over.
