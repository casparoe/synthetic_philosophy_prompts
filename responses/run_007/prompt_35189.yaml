  a friend of mine who reads the same rationalist blogs as me keeps dismissing evo psych as just-so stories. his move is: for any trait you can invent an adaptionist story about how it was useful in the ancestral environment, the story is unfalsifiable because we can't go check the pleistocene, so the whole field is basically bedtime stories with statistics. he pulled this on me last week to wave away a study on sex differences in disgust sensitivity, and i found myself half-agreeing but also suspecting the analogy is doing more work than it can carry. i want an audit of the just-so story analogy, not a defense or a hit piece. give me the correspondence table first: what in evo psych plays the role of the fanciful origin, the animal getting its trait, and the tidy etiological punchline. then the places the mapping breaks. which disanalogies actually matter for the conclusion people draw — that evo psych isnt science and this specific finding can be ignored — and which are just surface-level? does the conclusion survive once theyre on the table, or was the analogy carrying it the whole time? and if theres a better analogy for what good vs bad evo psych actually looks like, give me that too. keep it under 600 words, table included.
