  10. (Final check against constraints): Rank tensions. Give cheapest fix. Say what to give up. Done.

  *(Wait, one nuance)*: The user asks "which pairs are actually in tension and which only look like they are." I need to be careful not to say they *are* contradictory, but that they conflict with *intuition* or require specific definitions. Actually, (2) and (3) *are* in tension if (4) is the mechanism. If (4) is true, (3) is arguably false (it's not *genuine* oneness). I need to highlight that.

