answer: |-
  This is a incredibly common and frustrating dynamic. You are right that it isn't the bystander effect (which is about inaction due to diffusion of responsibility) or groupthink (which is about conformity suppressing dissent).

  There isn't one single "law" named after a psychologist for this, but there are precise terms from **political science, game theory, and organizational theory** that describe exactly what you are seeing.

  ### The Names

  **1. The *Fait Accompli* (The Outcome)**
  The most accurate label for the situation itself is a **Fait Accompli** (French for "accomplished fact"). In diplomacy and military strategy, this refers to presenting an action that has already been taken, forcing the other party to accept the new reality rather than fight it. When your group member sends the email before consensus, they are creating a *fait accompli*.

  **2. Strategic Commitment / "Burning Bridges" (The Tactic)**
  In Game Theory (specifically the work of Thomas Schelling), this is called a **Strategic Commitment**. By acting unilaterally, the individual changes the "payoff matrix" for the rest of the group.
  *   **Before the action:** The cost of "Not Doing It" is low.
  *   **After the action:** The cost of "Undoing It" becomes high (social awkwardness, financial loss, looking incompetent).
  The actor has effectively "burned their bridges" to force the group down their preferred path.

  **3. The Action Bias / Agency Problem (The Psychology)**
  In organizational behavior, this is often a specific type of **Agency Problem**. The individual (the agent) acts in their own interest (or according to their own judgment) contrary to the principal (the group), relying on the fact that the group's **coordination costs** are too high to stop them.

  ---

  ### The Exact Conditions: Why It Works

  You asked for the specific conditions that make this possible. It is not magic; it is a calculation of costs. Here is the breakdown of the mechanics.

  #### 1. Irreversibility vs. Reversal Costs
  You asked: *Does the action have to be irreversible?*
  **No.** It does not need to be physically impossible to reverse. It only needs to be **socially or transactionally expensive.**

  *   **Physical Irreversibility:** Spending non-refundable money.
  *   **Social Irreversibility:** Sending an email that makes the group look committed. Un-sending it makes the group look flaky or disorganized.
  *   **The Mechanism:** The actor relies on the group's **Status Quo Bias**. Once the new state exists (the email is sent), it becomes the new default. Humans are wired to prefer the current state over the effort required to change it. The "awkwardness" you feel is a **transaction cost**. If the cost of reversing the decision is higher than the cost of accepting the bad decision, the group will accept the bad decision.

  #### 2. Speed vs. Decision Latency
  For a *fait accompli* to succeed, the **speed of execution** must exceed the **speed of group governance.**
  *   If the group has a rule that says "No purchases over $50 without a vote," but the person buys a $45 item, they exploit the gap between the rule and the enforcement.
  *   If the group is still debating via email chain, and one person just *calls* the vendor, the phone call wins. The asynchronous nature of group decision-making (slow) is vulnerable to synchronous individual action (fast).

  #### 3. Intent: Strategic vs. Reckless
  You asked: *Is it the same when they know vs. when they didn't check?*
  **The outcome is the same, but the dynamic is different.**

  *   **Strategic (Knows):** This is a power play. They know the group would say no, so they calculate that the group values harmony/completion over correctness. They are weaponizing your politeness against you.
  *   **Reckless (Didn't Check):** This is an **Empathy Gap** or **False Consensus Effect**. They genuinely believe everyone agrees, or they believe their autonomy outweighs the need for consensus.
  *   **Why the group tolerates both:** In both cases, the group faces the same **Collective Action Problem**. To stop the action, *someone* has to take responsibility for the conflict. Everyone waits for someone else to object, and by the time anyone speaks up, the email is sent.

  #### 4. Diffusion of Responsibility (The Group's Failure)
  You mentioned the group sees it coming but can't stop it. This is a variation of the **Bystander Effect**, but specifically regarding **enforcement**.
  *   Everyone thinks: "Surely someone else will stop them."
  *   Everyone thinks: "I don't want to be the difficult one who causes conflict."
  *   Result: No one acts. The unilateral actor faces zero resistance until it is too late.

  ---

  ### How to Prevent It (Counter-Strategies)

  If you want to stop this from happening, you cannot rely on "let's all agree not to do this." You have to change the structural incentives.

  **1. Lower the Reversal Cost**
  Normalize walking things back. If the group culture treats "Oops, we need to recall that email" as a normal part of process rather than a social failure, the *fait accompli* loses its power.
  *   *Script:* "Thanks for moving this forward, but we hadn't finalized the decision. Let's pause this and I'll send a follow-up clarification."

  **2. Implement a "Cooling Off" Period**
  Create a rule that no external action can be taken within $X$ hours of a proposal. This neutralizes the speed advantage.

  **3. Assign a Gatekeeper (Single Point of Failure)**
  Designate one person who has the *only* password, credit card, or admin access. This removes the *ability* to act unilaterally. It shifts the power from "who is fastest" to "who has the key."

  **4. Explicit Veto Power**
  In game theory, this is giving every member **Veto Player** status. Make it explicit that *any* single member can halt an action before it goes external. This legitimizes objection, removing the social cost of speaking up.

  ### Summary
  The phenomenon is a **Fait Accompli** driven by **Strategic Commitment**.
  It works because **Reversal Costs (social/practical) > Cost of Bad Decision.**
  It succeeds because the **Speed of Action > Speed of Consensus.**
  It persists because of **Diffusion of Responsibility** among the group members who see it happening but don't want to be the enforcer.
