          4.  Ranking of defeaters (fatal vs. awkward, insider concession vs. dismissal).
      *   **Tone:** Philosophical rigor, empirical grounding, honest assessment of the debate's state.

  2.  **Deconstruct the Position (Cognitive Impenetrability):**
      *   *Proponents:* Jerry Fodor (classic), Zenon Pylyshyn (vision specific), Firestone & Scholl (recent defenders).
      *   *Core Claim:* Top-down effects exist (attention, expectation), but they affect *selection* or *decision*, not the *content* of early visual experience itself.
      *   *Key Distinction:* Perception vs. Cognition (and Perception vs. Post-perceptual judgment).

  3.  **Drafting Section 1: Empirical Findings (Direct Falsification):**
      *   *What counts?* A change in low-level phenomenology (color, shape, motion) driven by high-level state (belief, desire), controlling for attention and response bias.
      *   *Paradigms:*
          *   Color perception (e.g., "The Dress", memory color effects).
          *   Size/Distance (e.g., golf hole size).
          *   Categorical perception (e.g., distinguishing shades based on linguistic categories).
          *   Desire-based perception (e.g., thirsty people seeing water bottles as closer).
      *   *Key Studies:*
          *   *Hansen et al. (2006) / "Memory Color":* Gray bananas look yellowish. *Defense:* Response bias or association, not experience.
          *   *Levin & Banaji (2006):* Race affects lightness perception. *Defense:* Post-perceptual judgment.
          *   *Witzel et al. (2011):* Categorical perception of color. *Defense:* Discrimination tasks vs. appearance tasks.
          *   *Firestone & Scholl (2016):* They critique almost all of these.
      *   *Clean Demonstration:* Needs to rule out *demand characteristics*, *response bias*, *attention shifts*, and *judgment effects*. Ideally, a forced-choice task where the subject reports phenomenology directly (e.g., matching) rather than categorizing.
      *   *Dismissibility:* Impenetrability theorists (like Firestone & Scholl) are very good at offering alternative explanations (the "Alternative Explanations Strategy"). To falsify, one must rule out *all* non-perceptual alternatives.

  4.  **Drafting Section 2: Conceptual/Architectural Considerations:**
      *   *The Distinction:* If "perception" and "cognition" are not distinct natural kinds, impenetrability loses its meaning.
      *   *Predictive Processing (PP):* This is the biggest architectural threat. PP posits a unified hierarchy where top-down predictions *constitute* perception. If PP is true, impenetrability is likely false by definition of the mechanism.
      *   *Modularity:* Fodor's modularity is the bedrock. If modularity is abandoned for interactive networks, impenetrability loses its home.
      *   *Commitment:* Yes, it is committed to a specific feed-forward/encapsulated architecture. If the brain is fundamentally recurrent and interactive (which it seems to be), the view is threatened.
      *   *Refuted vs. Irrelevant:* If the distinction collapses, the claim becomes irrelevant (category error) rather than empirically false.

  5.  **Drafting Section 3: Positive Case & Predictions:**
      *   *Burden of Proof:* Usually on the penetrability theorist because impenetrability is the "null hypothesis" of modularity.
      *   *Shifting the Burden:* Requires showing that alternative explanations (bias, attention) are *less* plausible than the perceptual change explanation.
      *   *Unique Predictions:* Impenetrability predicts neural dissociation (V1-V4 activity shouldn't correlate with belief states). Penetrability predicts feedback loops to early visual cortex modulating activity based on semantic content.
      *   *Unfalsifiability Risk:* Yes, the "Early" and "Direct" qualifiers are vulnerable. If every counter-example is reclassified as "late" or "indirect" (via attention), the theory becomes a tautology. Firestone & Scholl have been accused of this.

