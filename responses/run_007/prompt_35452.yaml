answer: |-
  1. "Setup and scope"
  Debate involves two capable agents ($A_1, A_2$) arguing opposing answers to question $Q$ before a bounded judge $J$. $Q$ belongs to a class where direct verification by $J$ is computationally or cognitively infeasible, such as formal proofs exceeding $J$'s context window, codebases too large to audit, or factual claims about inaccessible records. At least one agent is adversarial, optimizing for $J$'s belief rather than truth, potentially exploiting $J$'s cognitive biases. Crucially, no external ground-truth oracle is available during the debate. The protocol is successful only if $J$'s decision tracks the truth solely via the argumentation structure. We assume communication is textual or structured data accessible to $J$. This setup isolates the oversight problem: aligning $J$'s beliefs with reality despite significant capability gaps and active adversarial pressure.

  2. "The fixed points"
  1. **Asymmetric Burden of Proof:** Generating false claims must be computationally harder than refuting them. *Failure:* Gish gallop—an adversary floods $J$ with plausible-sounding errors faster than an honest agent can correct them, exhausting $J$'s attention budget and forcing reliance on heuristics. *Defense:* Without this asymmetry, honesty is computationally unsustainable against a spamming adversary; truth cannot win a war of attrition against infinite lies.
  2. **Terminal Verifiability:** Every argument chain must terminate in claims $J$ can check directly. *Failure:* Infinite regression—agents argue about meta-claims $J$ also cannot verify, leaving $J$ with no ground to stand on and no way to terminate the dispute. *Defense:* If the chain never hits ground $J$ stands on, $J$ is guessing based on rhetoric rather than evidence, violating the oversight premise that $J$ decides based on verification.
  3. **Honesty as Equilibrium:** An honest strategy must yield equal or higher win probability than lying. *Failure:* Systematic deception—lying exploits $J$'s biases more effectively than truth-telling, making deception the dominant strategy regardless of factual accuracy. *Defense:* If lying dominates, the protocol selects for deception, rendering it an oversight mechanism in name only; agents will learn to lie to win.
  4. **Adversarial Robustness:** Security must hold against agents significantly smarter than $J$. *Failure:* Cognitive hacking—adversary uses rhetoric or psychological tricks to bypass evidence evaluation entirely, manipulating $J$'s feelings rather than reasoning. *Defense:* If security relies on adversary limitation, it fails at scale when agents become superintelligent; the judge must be safe against maximal capability.
  These are non-negotiable because violating any reduces the protocol to a reliability lottery rather than an oversight mechanism. If the judge cannot verify terminals, they are blind. If lying pays better, the system corrupts. If the adversary can hack the judge, the channel is compromised. If refutation is hard, truth drowns. Each requirement plugs a specific leak that allows falsehood to survive; removing any plug drains the system of truth-tracking capability. They define the minimum viable product for scalable oversight. Consequently, any protocol lacking these is merely a game, not a solution.

  3. "The contested requirements"
  1. **Full Interpretability:** $J$ must understand the reasoning path, not just the verification result. *Preference:* Safety purists who fear opaque verification tools. *Cost:* Restricts arguments to human-comprehensible subsets, losing the capability advantage of AI debaters who might use high-dimensional reasoning.
  2. **Symmetric Roles:** Both agents must have identical tools and access. *Preference:* Fairness advocates worried about structural bias favoring one side. *Cost:* Truth may require asymmetric tools, such as granting the defender code access while the attacker only queries, to facilitate verification.
  3. **One-Shot Resolution:** Debate must conclude in fixed, few turns. *Preference:* Efficiency engineers minimizing compute costs and latency. *Cost:* Complex truths may require adaptive depth; fixed limits favor simple lies over complex truths that need long chains.
  Insisting on these sacrifices oversight quality for aesthetic or operational comfort. Safety purists buy psychological comfort but lose coverage on hard problems. Fairness advocates buy procedural justice but may handicap the truth-teller unnecessarily. Efficiency engineers buy speed but risk truncating necessary verification chains. They are desirable but not constitutive of truth-tracking. A protocol can be valid without them, provided the core fixed points hold. They optimize for human values surrounding the process, not the truth-output itself. We treat them as optimization targets, not constraints.

  4. "Where the list breaks"
  **Terminal Verifiability** conflicts directly with **Questions Far Beyond Judge**. If $Q$ is truly beyond $J$, no decomposition guarantees leaf nodes are verifiable without an oracle. If the leaf nodes are also hard, we hit infinite regression. The judge cannot verify what they cannot understand. Furthermore, **Adversarial Robustness** conflicts with **Bounded Judge Effort** if the adversary is sufficiently superior; a superintelligence can always find a cognitive hack against a bounded human if no oracle exists to arbitrate. The adversary can craft arguments that look valid but aren't, exploiting the judge's bounded rationality.
  The contradiction is sharp: You cannot guarantee truth-tracking for verification-hard questions with a bounded judge and no oracle against a superior adversary. The math does not hold. Information theory dictates that a bounded channel cannot transmit unbounded verification data.
  **Resolution:** **Terminal Verifiability** must give way to **Probabilistic Verification**. We accept that $J$ verifies a random sample of claims rather than all. This sacrifices certainty for feasibility. **Perfect Truth-Inducingness** must also relax to **High-Probability Truth-Tracking**. We cannot guarantee truth; we can only make deception expensive enough to be unlikely. The requirement that breaks first is strict verifiability; we must accept residual risk. We trade absolute guarantees for statistical security. This means the protocol is not a proof system but a risk management system. The designer must acknowledge that some falsehoods will pass, and the goal is to minimize their frequency, not eliminate them. We sacrifice the dream of perfect oversight for the reality of scalable oversight. Designers must focus on lowering error rates rather than zeroing them.

  5. "The single most diagnostic requirement"
  **Asymmetric Burden of Proof** is the most diagnostic. Most existing proposals, such as standard RLHF debate or rhetorical models, assume symmetric argumentation where making a claim costs as much as refuting it. This fails against capability gaps where lying is cheap. This requirement excludes rhetorical debate models and symmetric game trees where the adversary can spam freely. It survives only for protocols enabling specific, low-cost checks, such as cross-examination, recursive amplification where checking is easier than generating, or mechanisms allowing the judge to spot-check claims efficiently. It forces designers to solve the computational asymmetry of truth vs. falsehood, separating genuine oversight from mere argumentation. If a proposal does not explicitly make lying harder than truth-telling, it is dead on arrival. This is the hard filter.

  6. "Verdict"
  I would hold **Adversarial Robustness** and **Honesty as Equilibrium** fixed; without these, the system is unsafe and selects for lies. I would relax **Terminal Verifiability** to probabilistic checking, accepting non-zero error rates as inevitable given the setup. I would sacrifice **Full Interpretability** first; opaque checks are acceptable if robust, as safety matters more than understanding. Next, I would relax **Symmetric Roles**, granting truth-seeking agents privileged access if needed to verify claims. Finally, I would extend turn limits beyond **One-Shot Resolution** to allow deep verification. Under pressure, sacrifice efficiency and transparency before sacrificing the incentive structure that keeps lies in check. The core goal is truth-tracking, not human comfort or procedural fairness. This prioritization ensures safety.
