          *   **Assessment:** "Direct copy of the inner nature" is good (Schopenhauer calls it a "copy of the Will itself"). "Without concepts" is Kantian/Schopenhauerian aesthetic theory generally.
      *   *Sentence 6:* "This also explains why Schopenhauer thinks music can express specific emotions like grief or joy in a way that painting or poetry cannot: because these emotions are just local manifestations of the Will's strivings, and music captures the striving itself rather than its particular instances."
