          *   Other Arts = Copy Ideas (Level 1).
          *   Music = Copy Will (Thing-in-itself) directly.
      *   **Analogy:** Music is to the Will what the world of phenomena is to the Ideas. (Parallelism).
      *   **Emotions:** Music expresses the *essence* of emotions (joy, sorrow, etc.) without the particular motives or circumstances. It is the "ununiversalized" universal.
      *   **Key Distinction:** Music is *not* an Idea. The Will is *not* an Idea.

