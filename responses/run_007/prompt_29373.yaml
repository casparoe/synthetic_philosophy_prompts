      *Let's map the "One Revision":* Modifying C2 to be "Statistical typicality is the *standard indicator* of dysfunction, but dysfunction is fundamentally about functional design/capacity, which can diverge from statistics in mismatched environments." This saves C4, keeps C1/C5 mostly intact, and helps with C3 (reference classes track design, not just stats).

      *Wait, C3 is also tricky.* If reference classes are interest-relative, does that import values *into* the disease concept? The user says "I do not think this threatens objectivity." I should challenge this gently. If I choose a reference class to make a condition look atypical, I am valuing the classification.
      *Better Global Revision:* Shift from "Statistical Typicality" (C2) to "Functional Design/Capacity" as the core, with statistics as evidence. This resolves Caries (C4) and softens the Reference Class (C3) issue (we choose classes that best track design, not just stats).

      *Let's stick closer to the user's text.* They want to know where *their* text has tension.
