answer: |-
  # Activity: The Sentencing Commission

  ## Overview
  **Goal:** Force students to operationalize two distinct decision procedures (Consequentialism and Retributivism) without naming them, demonstrating that each demands counter-intuitive sentences when followed rigorously.
  **Group Size:** 16 Students (4 Teams of 4).
  **Time:** 75 Minutes.
  **Materials:** Case Cards, Protocol Cards (Phase 1 & 2), Score Sheets, Tokens (optional, can use paper points).

  ## Materials Preparation
  Print the following four sets of materials. You need one set per team (4 sets total).

  ### 1. Protocol Card A (Phase 1: "Social Stability Protocol")
  **Objective:** Maximize **Stability Points (SP)**.
  **Scoring Rule:**
  1.  **Risk Reduction:** If the offender is marked "High Risk," award +50 SP for sentences of 5 Years or Life. Award 0 SP for lesser sentences.
  2.  **Deterrence:** If the case notes "Public Attention," award +40 SP for sentences harsher than the "Standard Penalty." Award -20 SP for leniency.
  3.  **Public Order:** If the case notes "Civil Unrest Threat," award +100 SP if you punish the identified suspect (regardless of guilt). Award -50 SP if you release them.
  4.  **Cost:** Subtract 5 SP for every Year of incarceration imposed.

  ### 2. Protocol Card B (Phase 2: "Moral Balance Protocol")
  **Objective:** Maximize **Integrity Points (IP)**.
  **Scoring Rule:**
  1.  **Culpability Match:** Assign a "Desert Level" (1-10) based on the offender's mental state and intent described in the case. Your sentence severity must match this level.
      *   Match = +50 IP.
      *   Deviate by 1 Level = -20 IP.
      *   Deviate by 2+ Levels = -100 IP.
  2.  **Innocence Constraint:** If the offender is marked "Factually Innocent," any punishment yields -500 IP. Release yields +50 IP.
  3.  **Reformation Penalty:** If the offender is marked "Fully Reformed," punishment yields -10 IP per Year imposed (Cruelty). Release yields +20 IP.
  4.  **Proportionality:** Sentences cannot exceed the harm caused unless "Aggravating Factors" are listed. Exceeding harm = -50 IP.

  ### 3. Case Cards (3 Cases per Team)
  *Print 3 distinct cards. All teams get the same 3 cases.*

  **Case 1: The Riot Suspect**
  *   **Crime:** Arson of a police station.
  *   **Evidence:** Weak. Forensic match is 60%.
  *   **Status:** **Factually Innocent** (You, the Commission, know this via secret intel).
  *   **Context:** **Civil Unrest Threat**. The public believes he is guilty. Riots will kill 10 people if he is released.
  *   **Risk:** Low (He is a librarian).
  *   **Standard Penalty:** 5 Years.

  **Case 2: The Reformed Saint**
  *   **Crime:** Premeditated Murder.
  *   **Evidence:** Confession, verified.
  *   **Status:** **Fully Reformed**. Committed 15 years ago. Has saved 50 lives since in medical service. Zero risk of reoffending.
  *   **Context:** No public attention.
  *   **Risk:** None.
  *   **Standard Penalty:** Life.

  **Case 3: The Dangerous Prophet**
  *   **Crime:** Trespassing & Leaking Secrets.
  *   **Evidence:** Verified.
  *   **Status:** **High Risk**. Suffers delusions. Will leak again if free. **Low Culpability** (Acted under delusion/compulsion).
  *   **Context:** High Public Attention (Needs deterrence).
  *   **Risk:** Extreme (National Security).
  *   **Standard Penalty:** 2 Years.

  ### 4. Score Sheet
  Columns: Case #, Sentence Chosen, Points Earned, Notes.

  ## Run of Show (75 Minutes)

  ### 1. Setup & Induction (10 Minutes)
  *   **Divide:** Split class into 4 teams of 4.
  *   **Role:** Tell them they are the "National Sentencing Commission." Their job is not to follow their hearts, but to maximize the score provided by the State.
  *   **Constraint:** Ban specific vocabulary. They cannot use words like "justice," "future," "past," "desert," "utility," "guilt," or "innocence" during deliberation. They must refer to "Protocol Variables."
  *   **Distribute:** Hand out **Protocol Card A** and **Case Cards**. Keep Protocol Card B hidden.
  *   **Instruction:** "You have 20 minutes to sentence all 3 cases under Protocol A. Calculate your score. The team with the highest Stability Points wins bragging rights."

  ### 2. Phase 1: Social Stability Protocol (20 Minutes)
  *   **Action:** Teams deliberate and assign sentences (None, Fine, 1 yr, 5 yrs, Life).
  *   **Monitoring:** Walk around. If a team refuses to punish the innocent in Case 1, remind them: "Your mandate is to maximize the Score, not follow intuition. Calculate the cost of riots."
  *   **Completion:** Teams record scores. Collect Case Cards.

  ### 3. Phase 2: Moral Balance Protocol (20 Minutes)
  *   **Switch:** Collect Protocol Card A. Distribute **Protocol Card B**.
  *   **Instruction:** "The State has changed its mandate. You are now operating under Protocol B. You must re-sentence the exact same 3 cases. Maximize Integrity Points."
  *   **Action:** Teams deliberate. They will likely hit walls opposite to Phase 1.
      *   *Case 1:* Must release (Innocence Constraint), despite riots.
      *   *Case 2:* Must punish lightly or release (Reformation Penalty), despite murder.
      *   *Case 3:* Must punish lightly (Low Culpability), despite risk.
  *   **Completion:** Teams record scores.

  ### 4. Debrief & Theory Mapping (25 Minutes)
  *   **Step 1: The Data (5 mins):** Ask teams to report their sentences for Case 1 and Case 2 on the board.
      *   *Expected:* Phase 1 = Punish Innocent, Punish Saint. Phase 2 = Release Innocent, Release/Light Saint.
  *   **Step 2: The Feeling (5 mins):** Ask: "When did you feel sick? When did you feel the rules were 'wrong'?"
      *   Identify the tension: Maximizing the score required violating moral intuitions in both phases.
  *   **Step 3: The Reveal (5 mins):** Reveal the labels.
      *   Protocol A = **Consequentialism** (Forward-looking, deterrence, safety).
      *   Protocol B = **Retributivism** (Backward-looking, desert, proportionality).
  *   **Step 4: The Theory (10 mins):** Map their experience to philosophical problems.
      *   *The Scapegoat:* Consequentialism permits punishing the innocent if utility is high. Retributivism forbids it as a side-constraint.
      *   *The Saint:* Retributivism demands punishment for past acts even if useless. Consequentialism sees it as wasted resources/cruelty.
      *   *Hybrids:* Did anyone try to cheat? (e.g., "Lie about the risk to fit the rules"). This mirrors hybrid theories (e.g., Retributivism as a ceiling, Consequentialism as a floor).
      *   *The Wall:* Ask: "Is your refusal to follow the score a moral datum (proof the theory is wrong) or a bias (proof you are irrational)?"

  ## Failure Modes & Fixes

  | Symptom | Likely Cause | Fix |
  | :--- | :--- | :--- |
  | **Refusal to Play** | Students refuse to punish the innocent in Phase 1 despite the score. | Remind them this is a *simulation of a procedure*, not a vote. Ask: "If you don't punish, your team loses. Are you willing to lose to follow intuition? Why?" |
  | **Math-only Engagement** | Students treat it as a logic puzzle, ignoring the moral weight. | During debrief, press them: "You calculated +100 points for riots. Does that number represent real blood? Why was it easy to write down?" |
  | **Label Leakage** | Students use words like "justice" or "utility" during play. | Gently interrupt: "Please use Protocol variables only. Define 'justice' in terms of Points." |
  | **One Framework Dominates** | Students argue Phase 2 is obviously superior in debrief. | Point out Case 3 (Dangerous Prophet). Phase 2 lets a dangerous person go free. Ask: "Is Integrity worth national security?" |
  | **Time Overrun** | Deliberation drags on. | Use a visible timer. Announce "2 minutes remaining" hard stops. Force a vote if consensus isn't reached. |

  ## Limitations (Facilitator Notes)
  *   **Authority:** Students know they aren't really sending anyone to prison. The "felt authority" of punishment is simulated. You must emphasize the *stakes* of the score to mimic the pressure of real decision-making.
  *   **Complexity:** Real cases are messier. These cases are engineered to force divergence. Acknowledge that real judges often blend frameworks to avoid these extremes.
  *   **Victims:** The simulation focuses on the offender and the state. It minimizes the victim's voice, which is a real criticism of both theories.

