prompt: |-
  I'm a journalist working on a piece about mind uploading, and I keep running into the same move. A neuroscientist-slash-transhumanist I interviewed told me the gradual replacement scenario — swap one neuron at a time for a silicon chip that does the same input-output job, wait for the person to adjust, repeat until the whole brain is silicon — is just the Ship of Theseus. Replace the planks one by one and it's still the same ship, so replace the neurons one by one and it's still the same you. He used it to claim that identity survives the procedure with no real break, and that people who worry about uploading are just confused about identity.

  I want you to audit that analogy for my piece. You're a philosopher of mind who writes clearly for non-specialists; think carefully and start by brainstorming the correspondences before you commit to anything. What maps onto what — the planks, the ship, the voyage, the shipwright, maybe the pile of original planks? Then where does the mapping actually break, and which disanalogies matter for the identity question verses which are just decorative. What does the ship story quietly import about identity that the brain case might not give us? And does the conclusion — that gradual replacement preserves personal identity — survive once the disanalogies are on the table, or was the analogy carrying it the whole time? If the ship is the wrong picture, say what a better analogy would be.

  Format: give me exactly five numbered items, each a sentence or two, no introduction, no conclusion. Item one could be the correspondence table and item five the verdict on whether the conclusion survives, but organize the five as you see fit.
