answer: |-
  It was a pleasure to read your query regarding the philosophical underpinnings of neural network interpretability, as it cuts to the heart of what we often leave implicit in our technical discussions. You have accurately described the prevailing methodology, where researchers train linear probes on hidden activations to recover properties like truthfulness or syntax, use activation patching to test causal efficacy, and subsequently describe these findings using the language of circuits and encoded concepts. To reconstruct the implicit theory of representation here, we must distinguish between the mathematical operations performed and the semantic gloss applied to them. The practice itself operates on a functionalist foundation that is strictly compatible with instrumentalism, yet the reporting conventions heavily borrow from a realist framework that attributes genuine semantic content to internal states. When a researcher claims that a direction in activation space encodes a concept, they are employing a realist vocabulary that suggests the model possesses an internal state analogous to a human belief or representation. However, the methods used to arrive at this claim do not logically necessitate this realism. A linear probe successfully separating activations labeled as true versus false demonstrates only that the information is linearly recoverable from those states, not that the model uses that information to generate its outputs or that the state possesses intrinsic meaning. Similarly, activation patching demonstrates causal leverage, showing that manipulating a state changes the output, but this is a statement about counterfactual dependence rather than semantic content. Therefore, the practice does not strictly presuppose realism; it presupposes only that there are stable statistical correlations and causal dependencies within the network that can be isolated and manipulated.

  The tension you suspect between probing, patching, and circuit claims is indeed present and stems from the fact that they do not presuppose the same thing. Probing is fundamentally a structural claim about information availability, whereas patching is a functional claim about causal usage. These can come apart, creating a philosophical friction within the methodology. It is entirely possible for a probe to successfully decode a property from a layer of activations while activation patching reveals that those activations are causally inert with respect to the model's final output. In such a case, the realist interpretation that the model represents that property becomes untenable, because the representation is epiphenomenal. If the field were strictly realist, successful probing would be sufficient evidence of representation, but because interpretability researchers often prioritize patching results to confirm a circuit, they implicitly acknowledge that information presence is not enough. This suggests that the field actually relies on a hybrid view, where representation is treated as genuine only when it is both recoverable and causally efficacious. However, the language often lags behind this nuance, continuing to speak of encoding even when causal usage has not been fully established. This creates a situation where the rhetoric implies a robust realism about mental content, while the methodological rigor adheres to a more cautious instrumentalism that cares only about predictability and control.

  If the field were to explicitly replace realism with a purely instrumentalist account, the methods would remain largely identical, but the reporting conventions and the epistemic status of the findings would shift significantly. Under instrumentalism, a probe would no longer be evidence that the model possesses a concept or knows a fact; instead, it would be evidence that the activation space is structured in a way that allows an external observer to predict a property with high accuracy. The claim would shift from the model encoding truthfulness to the model maintaining states that are linearly separable by truthfulness labels. This is a subtle but profound difference, moving the locus of representation from the internal state of the model to the relationship between the model and the interpreter. Consequently, the language of circuits would require revision to avoid implying modular semantic processing. Instead of saying a circuit implements a task, researchers would describe it as a causal pathway whose manipulation reliably alters behavior. The term encoding would likely be abandoned in favor of terms like correlating with or supporting prediction of. This shift would not invalidate the research, but it would deflate the cognitive science aspirations of the field. We would no longer be reverse-engineering a mind but rather mapping the control surfaces of a complex function.

  Ultimately, the choice between realism and instrumentalism in this context determines whether we view interpretability as a branch of psychology or a branch of engineering. The current practice hovers between the two, using engineering tools to draw psychological conclusions. If you were to adopt a purely instrumentalist stance in your course discussions, you would argue that the internal states of the network are representational only in the sense that they serve as useful instruments for us to predict and intervene upon the system, not because they carry content in any intrinsic sense. This would require you to treat the success of probes as a measure of our ability to compress the model's behavior rather than a discovery of the model's ontology. The circuit claims would then be understood as descriptions of causal topology rather than functional architecture in the cognitive sense. While this might seem like a diminishment of the field's scope, it offers a more philosophically defensible position that avoids the hard problem of assigning meaning to matrix multiplications. The methods would survive this transition intact, but the story we tell about what those methods reveal would change from a narrative about artificial minds to a narrative about artificial mechanisms. I hope this reconstruction helps clarify the commitments lurking beneath the technical surface of your readings.
