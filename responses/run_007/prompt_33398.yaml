answer: |-
  You have stumbled directly into one of the most active debates in contemporary epistemology: **The Norms of Assertion.**

  Philosophers do have a map for this. The intuition you are describing—that there is a specific rule governing when we are allowed to make a claim—is the central premise of the field. The specific phenomenon you noticed regarding the lottery is widely discussed, often under the umbrella of the **Lottery Paradox** applied to speech, or the problem of **Statistical Evidence.**

  Here is the shape of the debate, the candidate rules, and how they handle your specific examples.

  ### 1. The Central Candidate: The Knowledge Norm
  The dominant theory in this territory is the **Knowledge Norm of Assertion (KNA)**. Most famously championed by philosopher **Timothy Williamson**, it states:

  > **You should assert that $p$ only if you know that $p$.**

  This norm is attractive because it cleanly handles your "Stopped Clock" case.
  *   **The Stopped Clock (Gettier Case):** You look at a stopped clock. It says 2:00. It is 2:00. You believe it is 2:00.
  *   **Verdict:** You do not *know* it is 2:00 (because your belief is accidentally true). Therefore, under KNA, you should not have asserted it.
  *   **Fit:** This matches your intuition perfectly. The assertion felt defective because it lacked knowledge, even though it was true and justified.

  **The Problem for KNA (Your Lottery Case):**
  The KNA actually *agrees* with your intuition about the lottery. It says: "You are right to feel you overstepped. You do not *know* the ticket will lose (there is a possible world where it wins), so you should not assert it flat-out."

  However, the KNA then faces a challenge from your **Weather Case**.
  *   **The Weather Forecast:** You assert "It won't rain." You have a 99% forecast.
  *   **The Challenge:** Do you *know* it won't rain? If the KNA is strict, you don't (it could still rain). If you don't know, you shouldn't assert it. But we *do* assert weather predictions constantly without blinking.
  *   **The KNA Defense:** Proponents argue either (a) we actually *do* know the weather (contextualism: in everyday contexts, 99% counts as knowledge), or (b) we actually *shouldn't* assert weather flat-out; we should say "It probably won't rain," and we are just being sloppy.

  ### 2. The Rival Candidates
  To understand why KNA is the frontrunner, you have to see why the alternatives fail your specific test cases.

  **A. The Truth Norm**
  *   **Rule:** Assert $p$ only if $p$ is true.
  *   **Failure:** Fails the **Stopped Clock**. You asserted the truth, but it still feels wrong. Truth is necessary, but not sufficient.

  **B. The Justified Belief Norm**
  *   **Rule:** Assert $p$ only if you have justified belief that $p$.
  *   **Failure:** Fails the **Lottery**. You are justified in believing the ticket will lose (1 in a million odds). If justification were the only rule, you should be allowed to tell your friend "You're going to lose." But you feel you shouldn't. This suggests justification is not enough; you need something stronger (like knowledge).

  **C. The Reasonable Belief / Warranted Assertibility Norm**
  *   **Rule:** Assert $p$ if it is reasonable for you to believe $p$ given the context.
  *   **Failure:** This is the main competitor to KNA. It tries to solve the Weather vs. Lottery problem by appealing to **Pragmatic Encroachment**.
  *   **The Explanation:** The "reasonableness" of an assertion depends on the **stakes**.
      *   *Weather:* Stakes are low. If you're wrong, you get wet. High probability is enough.
      *   *Lottery:* Stakes are high (emotionally and financially). Telling a friend they will lose crushes hope. Therefore, the threshold for "reasonable" rises. You need near-certainty, which statistics don't provide.
  *   **Verdict:** This handles your intuition well, but critics say it makes the rule too subjective.

  ### 3. The Specific Distinction: Statistical vs. Causal Evidence
  You asked: *"What makes the lottery context different from the weather context?"*

  This is a specific sub-debate often called the problem of **Statistical Evidence vs. Individual Evidence** (or Causal Evidence). This is heavily discussed in both epistemology and legal theory (often using the **Gatecrasher Paradox**).

  *   **Lottery (Statistical):** Your evidence is purely mathematical. It applies to the ticket, not the specific physical causal chain of the draw. It is **insensitive**. If the ticket *were* going to win, your evidence (the odds) would be exactly the same. You would still say "You'll lose."
  *   **Weather (Causal/Evidential):** Your evidence is based on atmospheric models, pressure systems, etc. It is **sensitive**. If it *were* going to rain, the atmospheric data would likely be different, and the forecast would change.

  Many philosophers argue that assertion requires **sensitive** evidence. You can assert based on evidence that would change if the fact were different (weather), but not on evidence that stays the same regardless of the outcome (lottery odds). This explains why the lottery assertion feels "defective" even if the probability is identical to the weather forecast.

  ### 4. Terminology Map
  If you want to search for more on this, here are the terms of art:

  *   **The Norm of Assertion:** The general field.
  *   **The Knowledge Norm (KNA):** The theory that you must know what you say.
  *   **The Lottery Paradox:** Originally by Henry Kyburg (1961), regarding rational belief. Applied to assertion, it asks: "Can we assert lottery losses?"
  *   **Gettier Cases:** The "Stopped Clock" scenario. Used to show that Truth + Justification $\neq$ Knowledge.
  *   **Pragmatic Encroachment:** The theory that knowledge/assertion norms depend on practical stakes (why weather is okay but lottery isn't).
  *   **Assertion and Statistical Evidence:** The specific literature on why bare statistics feel insufficient for assertion (often citing **Judith Jarvis Thomson** or **David Enoch**).

  ### 5. Is there a position that handles both cleanly?
  The position that best captures your intuitions is likely a **Hybrid View** combining the **Knowledge Norm** with a **Sensitivity/Safety Condition**.

  1.  **Stopped Clock:** You fail the Knowledge Norm (no knowledge due to luck). **Result:** Don't assert.
  2.  **Lottery:** You fail the Sensitivity Condition. Your belief is not sensitive to the truth (you'd believe it even if false). Therefore, it doesn't count as Knowledge in a robust sense. **Result:** Don't assert.
  3.  **Weather:** You satisfy the Knowledge Norm (in a contextualist sense) AND the Sensitivity Condition (the forecast tracks the reality). **Result:** Okay to assert.

  **Summary of the Debate Shape:**
  *   **Strict Invariantists (Williamson):** You need Knowledge. Lottery assertions are forbidden (you don't know). Weather assertions are forbidden unless you actually know (we are often sloppy).
  *   **Contextualists:** The standard for "Knowledge" shifts. In casual chat, weather forecasts count as knowledge; lottery tickets do not because the possibility of winning is salient.
  *   **Pragmatists:** It's not about knowledge, it's about stakes. Lottery assertions are rude/risky; weather assertions are low-risk.

  Your intuition that the lottery assertion is "defective" despite high probability is the primary motivation for rejecting a simple **Probability Norm** in favor of a **Knowledge Norm** or a **Sensitivity Norm**. You are essentially arguing for the **Knowledge Norm of Assertion** without realizing it.
