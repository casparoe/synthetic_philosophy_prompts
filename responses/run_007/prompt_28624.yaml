      *   *Correction on "Spontaneity":* It's not that the husband *cannot* think. It's that the *justification* shouldn't be the *motivation*. The thought "she is my wife" is sufficient. Adding "and morality allows this" distances the agent from the action.
      *   *Correction on "Utilitarianism is False":* Williams doesn't necessarily claim to *disprove* utilitarianism in a logical sense (like a contradiction); he argues it is *unlivable* or attacks *integrity*. It's a pragmatic/psychological critique as much as a logical one.
