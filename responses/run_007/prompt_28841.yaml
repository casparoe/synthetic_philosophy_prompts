answer: |-
  You have identified one of the most significant fault lines in the foundations of probability and decision theory. Your intuition is correct: the standard Bayesian framework (often called "Precise Bayesianism") demands a level of specificity that our evidence often does not warrant.

  To answer your primary question directly: The established name for the position that rational belief should be represented by sets of probability distributions rather than a single distribution is **Imprecise Probability** (or **Imprecise Bayesianism**). In philosophy, the specific representational tool is often called a **Credal Set**, and the state of belief is sometimes referred to as **Mushy Credence** or **Indeterminate Credence**.

  Since you are in economics, you will also find this formalized in decision theory under **Maximin Expected Utility (MEU)** (Gilboa & Schmeidler, 1989) and in macroeconomics/finance under **Robust Control** (Hansen & Sargent).

  Here is a breakdown of the view, why it argues "picking one" is a mistake, and how it handles the challenge of arbitrariness.

  ### 1. The Core Argument: Why "Just Pick One" is a Mistake

  Proponents of Imprecise Probability (such as the philosopher Isaac Levi, the statistician Peter Walley, and more recently, Jim Joyce) argue that there is a normative gap between **evidence** and **precise credence**.

  In Precise Bayesianism, you are required to map your evidence $E$ to a single function $P(\cdot|E)$. The Imprecise Bayesian argues that for many bodies of evidence, there is no unique rational function. Instead, the evidence constrains the *range* of permissible functions.

  **The Argument from Epistemic Honesty:**
  If your evidence supports $P(H) \in [0.2, 0.6]$ but does not distinguish between values inside that interval, picking $0.4$ is not a "best guess"; it is the fabrication of information. It treats ignorance as knowledge.
  *   **Precise Bayesianism:** Requires you to have a betting quotient for every proposition. If you say 0.4, you must be willing to bet at 0.41 odds.
  *   **Imprecise Bayesianism:** Allows you to say, "I will bet at 0.2 odds (lower probability), but I will not sell at 0.21, and I will buy at 0.6 odds, but I will not sell at 0.59." The gap between your buying and selling price represents the thickness of your uncertainty.

  **The Argument from Weight of Evidence (Keynes):**
  Keynes distinguished between the *probability* of a hypothesis and the *weight* of the argument supporting it. Two hypotheses might both have a calculated probability of 0.5, but one is based on massive data and the other on a hunch. Precise probability collapses this distinction; Imprecise Probability captures it by making the *set* wider for the hunch and narrower for the data.

  ### 2. Clarifying Your Terminology Confusion

  You mentioned tripping over Knightian uncertainty and ambiguity aversion. Here is how they fit into the Imprecise Probability framework:

  *   **Knightian Uncertainty:** In modern formal economics (specifically Gilboa & Schmeidler), Knightian Uncertainty is *modeled* using sets of priors. So, while your colleagues might use "Knightian" loosely to mean "unknown unknowns," the formal decision-theoretic definition is exactly what you are describing: a situation where the agent cannot settle on a unique prior.
  *   **Ambiguity Aversion:** This is the *behavioral* implication of having a Credal Set. If you have a set of probabilities, and you evaluate acts by looking at the worst-case scenario within that set (Maximin), you will display ambiguity aversion (e.g., preferring a known 50/50 urn over an urn with unknown composition). You were right that ambiguity aversion is about preferences, but Imprecise Probability provides the *epistemological foundation* for those preferences.
  *   **Second-Order Probability:** You rightly rejected using a uniform prior over $[0.2, 0.6]$. That would be a second-order probability (a distribution over distributions). Imprecise Probability is distinct because it does not assign probabilities *to* the distributions in the set. The set itself is the primitive representation of belief.

  ### 3. The "Meta-Arbitrariness" Challenge

  You asked a profound question: *Does this view run into its own version of the arbitrariness problem when you have to specify the boundaries of the set?*

  If you say $P \in [0.2, 0.6]$, a critic can ask: "Why not $[0.19, 0.61]$? Isn't drawing the line at 0.2 just as arbitrary as picking 0.4?"

  **The Imprecise Bayesian Response:**
  1.  **Constraints vs. Assertions:** Picking 0.4 is a positive assertion ("The world is like *this*"). Picking $[0.2, 0.6]$ is a negative constraint ("The world is *not like that*"). It is easier to justify ruling out extremes than it is to justify pinpointing a center.
  2.  **Sensitivity Analysis:** In practice (and in Robust Control), the set is often defined by a "contamination" parameter. You start with a reference model $P_0$ and say, "The true model is within $\epsilon$ distance of $P_0$." While $\epsilon$ is chosen by the agent, the resulting decisions are often *insensitive* to small changes in $\epsilon$. If your policy recommendation holds for $\epsilon=0.1$ and $\epsilon=0.15$, the arbitrariness of the boundary doesn't matter for the decision.
  3.  **Dilation:** Ironically, Imprecise Probability can show that sometimes gathering *more* evidence makes your set *wider* (a phenomenon called dilation). This is counter-intuitive but mathematically demonstrable. It highlights that precision is not always the goal of inquiry; avoiding error is.

  **The Cost:**
  The challenge is not just arbitrariness, but **decisional indeterminacy**. If you have a wide credal set, you might face two options, $A$ and $B$, where some distributions in your set prefer $A$ and others prefer $B$. Precise Bayesianism forces a choice; Imprecise Bayesianism allows you to say, "I cannot rationally choose between these yet." For an economist, this is frustrating (it doesn't solve for $x$), but for a philosopher, it is a feature (it accurately reflects the suspension of judgment).

  ### 4. Connections to Economics (For your specific context)

  Since you are a grad student in economics, three specific literatures will resonate with you:

  1.  **Robust Control (Hansen & Sargent):** This is essentially Imprecise Bayesianism applied to macroeconomics. They assume the agent has a "reference model" but fears it is misspecified. They consider a set of models within an entropy ball around the reference model and optimize for the worst case. This formalizes your intuition that you shouldn't trust a single distribution.
  2.  **Multiple Priors (Gilboa & Schmeidler):** As mentioned, this axiomatizes decision-making under Knightian uncertainty. It drops the Sure Thing Principle (Savage's P2) to allow for sets of priors.
  3.  **Partial Identification (Manski):** In econometrics, Charles Manski's work on partial identification argues that without strong (unjustifiable) assumptions, we often cannot identify a point parameter, only a bound. This is the frequentist/structural equivalent of your Bayesian credal set.

  ### 5. Recommended Reading

  If you want to pursue this seriously, here is the roadmap:

  *   **The Classic Defense:** Isaac Levi, *The Enterprise of Knowledge* (1980). He argues that representing belief as a set is necessary to separate *credal probability* from *values*.
  *   **The Statistical Foundation:** Peter Walley, *Statistical Reasoning with Imprecise Probabilities* (1991). This is the technical bible of the field.
  *   **The Economic Formalization:** Gilboa, I., & Schmeidler, D. (1989). "Maximin Expected Utility with Non-Unique Prior." *Journal of Mathematical Economics*.
  *   **The Contemporary Debate:** Look for the debate between **Roger White** ("Evidential Symmetry and Mushy Credence") who argues *against* imprecise credence, and **Jim Joyce** ("A Defense of Imprecise Credences") who argues *for* it. This will give you the current state of the philosophical argument.
  *   **For the Econ Grad Student:** Lars Peter Hansen's Nobel Lecture ("Uncertainty Outside and Inside Economic Models") is an accessible entry point into why economists are moving toward set-based uncertainty.

  ### Summary

  You are describing **Imprecise Bayesianism** using **Credal Sets**.

  *   **Is "pick one" a mistake?** Yes, because it conflates *risk* (known distribution) with *ambiguity* (unknown distribution), violating the normative principle that belief should match the weight of evidence.
  *   **Is the boundary arbitrary?** Less so than a point estimate, because boundaries represent the *limits* of what evidence can rule out, rather than a positive claim about where the truth lies. However, it does introduce indeterminacy in decision-making, which is the price of epistemic honesty.

  Your frustration is not a bug in your understanding; it is a bug in the standard toolkit. You are looking for tools that handle **model uncertainty** rather than just **parameter uncertainty**, and the literature on Imprecise Probability and Robust Control is exactly where you should look.
