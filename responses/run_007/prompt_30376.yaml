answer: |-
  # Q&A Prep Sheet: Defending the Strawsonian Line
  **Context:** Department Talk. **Audience:** Hard Incompatibilists (Pereboom), Robust Compatibilists (Fischer-style), X-Phi (Knobe/Nichols lineage).
  **Goal:** Defend reactive attitudes as constitutive, not metaphysical; deny determinism undermines them.

  ---

  ### 1. The "Basic Desert" Objection (Pereboom Camp)
  **The Question:** "You say resentment is part of a relationship, but resentment *feels* like it demands basic desert. If determinism is true, no one basically deserves resentment. Aren't you just redefining 'responsibility' to avoid the hard metaphysical bullet? Why isn't this just a verbal shuffle?"

  **Two-Minute Reply:**
  I'm not redefining responsibility; I'm locating it. The incompatibilist assumes responsibility requires a metaphysical "open future" to be *fair*. I'm arguing fairness is internal to the practice, not external to it. When I resent you, I'm not making a cosmological claim about your causal history; I'm registering a demand for good will within our relationship. If determinism is true, it applies to *both* of us equally. It doesn't introduce a new fact that breaks the relationship; it just describes the physics of the relata. To ask if the resentment is "really" fair from a God's-eye view is to ask a question that has no purchase on human life. We aren't shuffling words; we're refusing to accept a standard of fairness that requires being outside the human form of life.

  **Concede Up Front:** I concede that *some* feelings of resentment involve metaphysical baggage people *think* they need. I'm not defending every phenomenological nuance of anger, only the core participatory stance.
  **Softest Point:** The move from "we can't help but feel this" to "this is normatively authoritative."
  **What Would Change My Mind:** If it were demonstrated that deep, intimate interpersonal relationships could be sustained *without* any reactive attitudes (e.g., a community that loves deeply but views all wrongs as purely medical/causal without loss of intimacy).
  **Follow-Up Failure:** I will likely struggle if pressed on *why* the objective stance is a "loss" rather than an evolution. If they press that we *could* evolve past resentment, my "human nature" defense looks like conservatism.

  ### 2. The "Normative Gap" Objection (Robust Compatibilists)
  **The Question:** "Strawson describes our practices, but he doesn't justify them. You tell us *that* we hold people responsible, but not *when it is fitting*. Without an account of agential capacities (like guidance control), you can't distinguish between a justified resentment and a mob mentality. Isn't this just sociological quietism?"

  **Two-Minute Reply:**
  It's not quietism to say the justification is internal. The "fittingness" of resentment isn't determined by a metaphysical audit of the agent's causal powers; it's determined by whether the agent participated in the interpersonal demand. Guidance control is a useful heuristic for *exemptions* (did they know what they were doing?), but it's not the *ground* of responsibility. The ground is the relationship itself. If I demand a metaphysical theory to tell me when resentment is fitting, I've already stepped into the objective stance. I'm not avoiding the normative question; I'm saying the normativity comes from the commitment to the relationship, not from a theory of agency.

  **Concede Up Front:** I concede Strawson is thin on the *specific* conditions for exemptions. We do need some account of capacity to determine who is a participant.
  **Softest Point:** Distinguishing "internal norms" from "mob rule" without appealing to external criteria.
  **What Would Change My Mind:** If it could be shown that the "internal norms" of our practice are systematically incoherent or self-defeating in a way that requires an external metaphysical anchor to resolve.
  **Follow-Up Failure:** They will press for a specific case (e.g., implicit bias) where our intuitions clash. Without a theory of capacity, I may lack the resources to say who is right.

  ### 3. The "Empirical Universality" Objection (X-Phi)
  **The Question:** "Strawson rests on a claim about 'human nature' and the inevitability of reactive attitudes. But our cross-cultural data shows massive variation in how blame is attributed and expressed. In some cultures, the participant/objective distinction doesn't map onto your categories. Isn't your 'bedrock' just WEIRD psychology?"

  **Two-Minute Reply:**
  Variation in *expression* isn't variation in *structure*. The data might show that some cultures express blame more ritually or less individually, but the underlying data still shows a distinction between dealing with a person (who can be reasoned with) and dealing with a force/object (which must be managed). Even in collectivist cultures, there is a reaction to *ill will* distinct from *accident*. Strawson isn't claiming every culture resents the same way; he's claiming that wherever you have interpersonal relationships, you have expectations of good will, and the violation of those expectations triggers a specific kind of response. If you remove that, you don't have a different culture of responsibility; you have a different form of life entirely.

  **Concede Up Front:** I concede the *phenomenology* and *scripts* of blame are culturally contingent. Strawson over-romanticized the uniformity.
  **Softest Point:** Defining the "structure" narrowly enough to be universal but broadly enough to matter.
  **What Would Change My Mind:** Empirical evidence of a functioning society where the "objective stance" is the default mode of interaction for all members, including family, without social collapse.
  **Follow-Up Failure:** If they present specific ethnographic cases where "ill will" is treated purely as contamination or imbalance rather than a relational breach, my structural claim weakens.

  ### 4. The "Manipulation Argument" (Pereboom Camp)
  **The Question:** "If a neuroscientist manipulated you to resent your spouse, that resentment wouldn't be fitting. But if determinism is true, your history is just a natural version of that manipulation. Why is the causal history relevant in the manipulation case but irrelevant in the determinism case?"

  **Two-Minute Reply:**
  Because manipulation *bypasses* the agency of the participant in a way that standard determinism does not. In the manipulation case, the neuroscientist is an external agent imposing a state. In the determinism case, the resentment arises from *your* cares, *your* commitments, and *your* history. It's still *you* reacting. The manipulation argument works only if you assume that causal determination is akin to coercion. But on my view, coercion matters only insofar as it negates the interpersonal demand. If you are determined to resent me, but that resentment tracks my actual behavior toward you, it remains a move in our relationship. The manipulation case is a local exception; determinism is the global background.

  **Concede Up Front:** I concede the line between "bypassing" and "causing" is notoriously difficult to draw metaphysically.
  **Softest Point:** Explaining why global determinism isn't just "universal manipulation."
  **What Would Change My Mind:** A proof that there is no relevant difference between being determined by past states and being programmed by a scientist regarding the *sourcehood* of the attitude.
  **Follow-Up Failure:** They will push the "Four-Case Argument." If I admit Case 4 (determinism) is relevantly different from Case 1 (direct manipulation), I need a principle they will reject.

  ### 5. The "Victim's Burden" Objection (Ethical/Revisionist)
  **The Question:** "You say we *can't* give up reactive attitudes. But for victims of abuse, holding onto resentment is often traumatic. Pereboom suggests we can move to a forward-looking moral system. Why insist victims stay in the participant stance if it harms them? Isn't this cruel optimism?"

  **Two-Minute Reply:**
  Strawson allows for the objective stance as a *temporary* or *local* modification. We can suspend reactive attitudes for self-protection. But to make that the *wholesale* system is to isolate the victim from the possibility of reconciliation, apology, and restored trust. The forward-looking system treats the abuser as an object to be managed, which might be safe, but it forecloses the possibility of them re-entering the moral community as a responsible agent. I'm not saying victims *must* resent; I'm saying that if we abandon the *practice* entirely, we lose the language of apology and forgiveness that allows healing. Safety is compatible with exemptions; it doesn't require abandoning the framework.

  **Concede Up Front:** I concede that the demand to "stay in the participant stance" can be oppressive if misapplied. Exemptions are vital.
  **Softest Point:** Balancing the victim's psychological safety with the philosophical claim that the stance is indispensable.
  **What Would Change My Mind:** Evidence that forward-looking, non-reactive systems provide *better* psychological outcomes for victims and *better* behavioral reform for offenders than reactive systems.
  **Follow-Up Failure:** If they argue that forgiveness in a Strawsonian framework still presupposes a "desert" that the victim shouldn't have to grant.

  ### 6. The "Truth Value" Objection (Metaphysical Realists)
  **The Question:** "You say the question 'Is anyone really responsible?' is a confusion. But science asks 'Is this real?' about everything else. Why is responsibility the one thing that gets a pass? If responsibility supervenes on physical facts, and physical facts don't include 'desert', isn't responsibility an illusion?"

  **Two-Minute Reply:**
  Science asks "Is this real?" about objects within a framework. Responsibility isn't an object; it's a framework. Asking if the framework is "true" relative to physics is a category error. It's like asking if "checkmate" is real in terms of wood and lacquer. Checkmate is real *in chess*. Responsibility is real *in human life*. If you want to know if responsibility is real, look at whether people actually hold each other responsible, not at whether particles have desert. The illusion isn't responsibility; the illusion is that responsibility needs to be validated by particle physics to be legitimate.

  **Concede Up Front:** I concede this sounds like a "separate magisteria" dodge. It risks making responsibility seem less "real" than mass or charge.
  **Softest Point:** Explaining why this isn't just anti-realism dressed up.
  **What Would Change My Mind:** A demonstration that the "framework" of responsibility makes predictions that conflict with the "framework" of physics in a way that forces a choice.
  **Follow-Up Failure:** They will argue that if physics is the fundamental ontology, everything else is derivative and potentially eliminable.

  ### 7. The "Moral Luck" Objection (General)
  **The Question:** "Reactive attitudes track intent, but our practices track outcomes. We resent the drunk driver who hits a kid more than the one who doesn't. Strawson says attitudes are about good will. Doesn't the prevalence of moral luck show our attitudes are irrational, and we *should* revise them?"

  **Two-Minute Reply:**
  Strawson acknowledges our practices are messy. The fact that we are susceptible to moral luck doesn't show the *practice* is wrong; it shows we are imperfect participants. But the core of the practice—the demand for good will—remains stable. We *know* the lucky driver was just as negligent. The variation in resentment is a bug, not a feature. However, fixing that bug doesn't require abandoning reactive attitudes for the objective stance; it requires refining our reactive attitudes to focus more on quality of will. That's an internal reform, not a metaphysical revolution.

  **Concede Up Front:** I concede our actual practices are inconsistent and often unfair regarding luck.
  **Softest Point:** Justifying why we shouldn't just eliminate the outcome-sensitive part of resentment if it's irrational.
  **What Would Change My Mind:** Proof that outcome-responsibility is *constitutive* of the practice, such that removing it collapses the distinction between participant and objective stances.
  **Follow-Up Failure:** If they argue that "quality of will" is inaccessible and we *only* have outcomes to judge, making the Strawsonian core empty.

  ### 8. The Question I Hope Nobody Asks (The Self-Undermining Objection)
  **The Question:** "You are giving us arguments to convince us to adopt the participant stance. But if your theory is true, arguments are just causal pushes. Are *you* taking the objective stance toward us by trying to causally determine our beliefs, or are you asking us to freely accept your view? If the former, why listen? If the latter, aren't you presupposing the very freedom you say we don't need to justify?"

  **Two-Minute Reply:**
  This is the transcendental trap. I am not trying to causally determine you; I am appealing to your reason. But "appealing to reason" isn't a metaphysical freedom; it's a move within the participant stance. I am treating you as a participant by arguing with you. If you step back and view my argument as mere causal noise, you are adopting the objective stance toward me, which makes dialogue impossible. I can't prove to you that you shouldn't do that without already assuming we are in a dialogue. So, yes, I am presupposing the stance. But that's not a contradiction; it's the condition of the possibility of asking the question. You can't argue against the participant stance without using it.

  **Concede Up Front:** I concede this is circular. It is a transcendental argument, not a linear proof.
  **Softest Point:** The accusation of pragmatism over truth. "So it's only true because we can't help but believe it?"
  **What Would Change My Mind:** If I could be shown a way to argue for the participant stance from a truly detached, objective premise without smuggling in participatory norms. (I suspect this is impossible, but if someone showed me how, I'd be stunned).
  **Follow-Up Failure:** This is the hardest spot. If they refuse to play the language game and insist on the external view, I have no leverage. I have to hope the social pressure of the Q&A keeps them in the participant stance.

  ---

  ### General Strategy Notes
  *   **Tone:** Do not sound defensive. Sound like you are inviting them back into the human community.
  *   **Pereboom:** Treat them as concerned about fairness. Validate the concern, relocate the solution.
  *   **Compatibilists:** Treat them as wanting rigor. Validate the need for clarity, deny the need for metaphysics.
  *   **X-Phi:** Treat them as empirical partners. Validate the data, reinterpret the conclusion.
  *   **Watch Out For:** The "Is/ought" slide. Don't let them trap you in "We do it, therefore it's right." Keep the line: "We do it, therefore 'right' has no meaning outside of it."
