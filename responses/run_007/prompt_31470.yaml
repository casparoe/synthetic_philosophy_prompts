  Pascal's fragment 298 posits a stark dilemma: justice without force is powerless, force without justice is tyrannical. The solution is to 'make the strong just'. The International Military Tribunal (IMT) at Nuremberg offers a rigorous stress test for this realist anthropology.

  Mapping the trial onto Pascal's model reveals a deliberate, if imperfect, synthesis. 'Force' was unequivocal: the Allied occupation, military police custody, and the ultimate power to hang. 'Justice' resided in the London Charter, the specific indictment counts, and the procedural rights afforded defendants, such as counsel and cross-examination. The Tribunal was the mechanism to bind them. Yet the seams showed visibly. The Soviet judge, Nikitchenko, openly viewed the trial as a continuation of war by other means, embodying force infiltrating justice. The charge of 'Crimes Against Peace' was arguably *ex post facto*, stretching legal norms to fit political necessity. Here, the Allies attempted Pascal's injunction: using their overwhelming strength not merely to crush, but to legitimise punishment through law. They recognised that raw force alone would not secure the peace. The trial was the architectural attempt to house force within justice.

  What does this lens explain? It clarifies why the Allies invested heavily in legal form despite holding absolute power. Summary execution would have been efficient force, but tyrannical. By adopting due process, they sought to clothe force in justice to secure lasting legitimacy. Pascal explains the 'victor's justice' critique perfectly: when force dictates the terms of justice, the accusation of tyranny remains plausible, regardless of procedural scrupulousness. The trial was an attempt to resolve the cognitive dissonance of victorious power claiming moral authority. It highlights why Jackson worried so much about the record; he knew force without the appearance of justice is unstable.

  However, Pascal's dichotomy is static. He views justice and force as distinct substances to be mixed. Nuremberg was generative; it aimed to *create* a new legal order, not merely apply existing norms. Pascal's lens obscures the moral education of the German public and the archival function of victim testimony. These were not about enforcing power, but establishing truth. Furthermore, Pascal assumes justice lacks intrinsic power. Nuremberg suggested that legitimate justice *generates* compliance, reducing the need for raw force over time. It was not just about binding force, but transforming it.

  Flipping the direction, what does Nuremberg show about Pascal? It vindicates his realism regarding the immediate necessity of force. Without the Allied army, the dock would have been empty. Justice could not arrest the defendants itself. Yet, the subsequent development of international law challenges his pessimism. The ICC and universal jurisdiction suggest justice can institutionalise force, rather than merely borrowing it from sovereigns. However, one might argue the ICC still relies on state cooperation (force), proving Pascal right in the long run: justice remains parasitic on power. When the Security Council refuses enforcement, justice is again powerless.

  Nuremberg confirms Pascal's diagnosis of the present but perhaps not the future. It shows that while force is the prerequisite for justice, justice can eventually tame force. Pascal's warning remains vital: without the continual effort to make the strong just, force reverts to tyranny. Nuremberg was not the solution, but the attempt. It proved that while you cannot make justice strong by itself, you can build institutions where strength is channelled through just procedures. Pascal's ruthlessness is validated, but his resignation is challenged. The trial demonstrated that force must be submitted to justice to endure, yet justice remains vulnerable without the sword.
