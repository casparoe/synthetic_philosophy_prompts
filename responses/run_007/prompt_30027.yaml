answer: |-
  **(a) Defeaters a Committed Counterpart Theorist Concedes**

  1.  **Truth of Haecceitism (Fatal):** CT is committed to *qualitative supervenience*: worlds cannot differ solely by swapping individuals' identities. If metaphysical argument proves haecceitistic distinctions (worlds differing only in *which* individual is which, qualitatively identical), CT is false. Lewis concedes this would refute the view.
  2.  **Validity of Standard Quantified Modal Logic (Awkward):** CT predicts standard QML principles (e.g., Barcan Formula) fail without translation into counterpart language. Proponents concede this is a theoretical cost, requiring complex translation manuals to match rival systems' logical simplicity.

  **(b) Defeaters Only Critics Raise**

  1.  **Fixed Essence Intuitions (Fatal if Correct):** Critics argue essential properties (e.g., origin) are context-independent. CT commits to *contextualism*: essence varies with which counterpart relation is salient. If essence is objectively fixed, CT's contextual insulation makes it false, not just vague.
  2.  **Multiple Counterparts (Awkward):** Critics argue having two counterparts in one world violates identity logic (I cannot be two people). CT commits to *one-many counterpart relations*. Defenders shrug this off by denying *de re* modality obeys identity logic, but this risks making modal discourse unintelligible to non-theorists.
  3.  **Humphrey Objection (Merely Awkward):** Critics claim counterparts are irrelevant to *my* properties. CT commits to *analysis*: modal claims *are* about counterparts. Dismissing this as a verbal misunderstanding is reasonable for a defender, as it targets intuition rather than truth-conditions.

  **(c) Decisive Developments**

  1.  **Rigid Designation Proof (Fatal):** If proper names are proven to be rigid designators picking out the *same* transworld individual (not a counterpart), CT collapses into transworld identity (TWI). CT commits to *non-identity across worlds*. Kripkean semantics suggests names function this way; if this is metaphysically constitutive, CT is false.
  2.  **Actuality Operator Rigidity (Fatal):** If "actually" fixes reference to an individual across all worlds (fixed actuality) rather than indexing to the world of utterance (indexical actuality), CT fails. CT predicts *indexical actuality*. A proof that "actually" operates rigidly on individuals would force adoption of TWI.
  3.  **Persistence and Temporary Intrinsics (Decisive Analogy):** If perdurance/stage theory fails for temporal persistence (the temporal analog to CT), CT loses its primary structural support. CT predicts *modal perdurance*. If temporal stages are rejected for endurantism, the pressure to accept modal counterparts increases, but the loss of symmetry weakens the theoretical unity Lewis relied on.

  **Closing: Insulation and Commitments**

  Counterpart Theory is heavily insulated by qualifications: counterpart relations are vague, context-sensitive, and interest-relative. This insulation is not necessarily a vice; it mirrors the flexibility of modal discourse better than TWI's rigid essentialism. However, this flexibility is the view's vulnerability. CT cannot give up **qualitative supervenience** or **context-sensitive counterpart relations** without quietly becoming TWI. If modal truths are sharp and context-independent, CT is false. The view risks making modal metaphysics too linguistic, but it gains explanatory power over essentialist variance. It is not insulated from truth-tracking defeaters like haecceitism or rigid designation; it is only insulated from intuitions about identity. If reality is haecceitistic or names are rigid designators of transworld individuals, CT is dead. If not, its insulation is a virtue, capturing the nuance rivals miss.
