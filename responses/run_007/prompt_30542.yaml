answer: |-
  # Runbook: Resource Arbitration via the Kalai–Smorodinsky Procedure

  **Version:** 1.0
  **Audience:** Platform Engineering Team
  **Subject:** Algorithmic allocation of fixed compute resources between two competing service teams.

  ## 1. Executive Summary

  You are tasked with dividing a fixed resource (e.g., GPU hours) between two teams. The **Kalai–Smorodinsky (KS) solution** is a mathematical rule for splitting a surplus. Unlike a simple 50/50 split, it accounts for how much each team *needs* the resource and what happens if they get nothing.

  **The Core Intuition:** The KS solution finds an allocation where both teams make an equal *relative concession*. If Team A could theoretically gain 100 units of value but only gets 60, they have conceded 40%. The KS solution ensures Team B also concedes exactly 40% of their theoretical maximum gain.

  **Warning:** This procedure requires teams to express their needs as numbers ("utility"). If these numbers are dishonest, the output will be garbage. This tool removes political ambiguity but introduces input vulnerability.

  ---

  ## 2. Step-by-Step Procedure

  ### Step 1: Define the Resource and Allocation Variable
  Identify the fixed resource pool $R$ (e.g., 1,000 GPU-hours/week).
  Define the allocation variable $x$, representing the amount given to **Team A**.
  Consequently, **Team B** receives $R - x$.
  *Constraint:* $0 \leq x \leq R$.

  ### Step 2: Elicit Utility Functions (The "Value" Curve)
  You cannot compare "latency" to "revenue" directly. You must ask each team to map resource allocation to a **Normalised Value Score (NVS)** between 0 and 1.
  *   **0.0:** The minimum acceptable value (often zero utility).
  *   **1.0:** The maximum possible value they could extract if they had the entire resource pool $R$ to themselves.

  **Input Required from Teams:**
  Do not ask for "utility". Ask: *"If we give you $x$ resources, what is your estimated performance/output as a percentage of your maximum possible output?"*
  *   **Team A:** Function $U_A(x)$ mapping $x \to [0, 1]$.
  *   **Team B:** Function $U_B(R-x)$ mapping $(R-x) \to [0, 1]$.

  *Engineering Note:* If a team cannot provide a continuous function, ask for 5 data points (e.g., at 0%, 25%, 50%, 75%, 100% of $R$) and interpolate linearly or via spline in code.

  ### Step 3: Establish the Disagreement Point ($d$)
  The disagreement point represents the value each team receives if negotiations fail and no new allocation is agreed upon.
  *   **Standard Practice:** Use the **Status Quo**. What allocation did they have last week? What value did that generate?
  *   **Input:** $d_A = U_A(\text{current\_allocation}_A)$ and $d_B = U_B(\text{current\_allocation}_B)$.
  *   **Constraint:** If $d_A$ or $d_B$ is 1.0 (they already have everything they need), the procedure terminates (no surplus to bargain).

  ### Step 4: Calculate the Ideal Point ($u^*$)
  This is the maximum feasible gain for each party, assuming the other party does not constrain them (i.e., they get the whole resource $R$).
  *   **Ideal A:** $U_A(R)$ (Usually 1.0 by definition of normalisation).
  *   **Ideal B:** $U_B(R)$ (Usually 1.0 by definition of normalisation).
  *   **Maximum Feasible Gain:**
      *   $Gain_{max, A} = Ideal_A - d_A$
      *   $Gain_{max, B} = Ideal_B - d_B$

  ### Step 5: Compute the Kalai–Smorodinsky Point
  The KS solution is the allocation $x$ where the **ratio of actual gain to maximum possible gain** is equal for both parties, subject to the allocation being efficient (on the Pareto frontier).

  **The Equation to Solve:**
  $$ \frac{U_A(x) - d_A}{Ideal_A - d_A} = \frac{U_B(R-x) - d_B}{Ideal_B - d_B} $$

  Since we normalised $Ideal$ to 1.0 in Step 2, this simplifies to:
  $$ \frac{U_A(x) - d_A}{1 - d_A} = \frac{U_B(R-x) - d_B}{1 - d_B} $$

  **Implementation:**
  1.  Define a function $f(x) = \text{LHS} - \text{RHS}$.
  2.  Use a root-finding algorithm (e.g., Brent's method or binary search) to find $x$ where $f(x) = 0$ within the range $[0, R]$.
  3.  Verify that the resulting $U_A(x)$ and $U_B(R-x)$ are not lower than $d_A$ and $d_B$ (Individual Rationality).

  ### Step 6: Handling Edge Cases

  | Edge Case | Detection | Resolution |
  | :--- | :--- | :--- |
  | **Non-Convex Feasible Set** | The utility functions have "jumps" or diminishing returns that spike suddenly. | The root-finder may find a local optimum. Plot the functions. If multiple $x$ satisfy the equation, choose the one that maximises total value $U_A + U_B$. |
  | **Maximum Equals Disagreement** | $d_A \approx 1.0$ (Team A is already saturated). | Division by zero risk. If $d_A = 1.0$, Team A gets no additional resources. Allocate surplus to Team B. |
  | **Multiple Solutions** | Flat regions in utility functions where the ratio stays equal over a range. | Select the allocation $x$ that minimises unused resource or favours the revenue-critical service (requires judgement). |
  | **More Than Two Parties** | >2 teams competing for $R$. | **Stop.** KS is strictly a 2-party solution. Do not attempt to generalise. Run pairwise tournaments or hierarchical allocation (e.g., split by department first, then teams). |

  ### Step 7: Judgement Calls vs. Mechanical Steps

  *   **Mechanical:** Solving the equation, normalising the scores, calculating the ratios.
  *   **Judgement (Human-in-the-Loop):**
      1.  **Validating Utility:** Is Team A's claim that 10 GPUs yield 100% value realistic? Platform engineering must audit these curves.
      2.  **Setting Disagreement:** Is the status quo a valid disagreement point? If the current allocation was a historical accident, using it as $d$ entrenches inefficiency. You may need to reset $d$ to a "minimum viable" baseline.
      3.  **Veto:** If the KS result degrades a critical SLA below a hard safety limit, override the number.

  ---

  ## 3. Kalai–Smorodinsky vs. Nash Bargaining Solution

  You may encounter the **Nash Bargaining Solution (NBS)**. It is the more common alternative. Here is why you might prefer KS in an engineering context.

  **The Difference:**
  *   **Nash:** Maximises the *product* of the gains: $(U_A - d_A) \times (U_B - d_B)$.
  *   **Kalai–Smorodinsky:** Equalises the *ratio* of gains to maximum possible gains.

  **Why it Matters (Individual Monotonicity):**
  Imagine the feasible set changes such that Team A's potential maximum value increases (e.g., they optimise their code to get more value per GPU), but Team B's potential stays the same.
  *   **Nash:** Might not change the allocation. Nash relies on the "Independence of Irrelevant Alternatives". It ignores options that weren't chosen.
  *   **KS:** Will explicitly reward Team A. Because Team A's "Maximum Feasible Gain" denominator increased, to keep the ratios equal, Team A must be awarded more resources to increase their numerator.

  **Engineering Implication:** KS incentivises efficiency. If a team proves they can squeeze more value out of the hardware, KS gives them more hardware. Nash might treat that potential as irrelevant if the current frontier hasn't shifted yet.

  ---

  ## 4. Worked Cases

  ### Case 1: GPU Hours (Saturating vs. Linear)
  **Context:** 100 GPU-hours/week.
  *   **Team A (Training):** Diminishing returns. Needs 40 hours to reach 90% model accuracy; extra hours add little.
  *   **Team B (Serving):** Linear value. More hours = more requests served = more revenue.

  **Inputs:**
  *   $R = 100$.
  *   $d_A = 0.2$ (Current 20 hours gives 20% value).
  *   $d_B = 0.2$ (Current 20 hours gives 20% value).
  *   $U_A(x) = \sqrt{x/100}$ (Saturating curve).
  *   $U_B(x) = x/100$ (Linear curve).
  *   $Ideal_A = 1.0, Ideal_B = 1.0$.

  **Computation:**
  Solve for $x$ (Team A's share):
  $$ \frac{\sqrt{x/100} - 0.2}{0.8} = \frac{(100-x)/100 - 0.2}{0.8} $$
  $$ \sqrt{x/100} - 0.2 = 1 - x/100 - 0.2 $$
  $$ \sqrt{x/100} = 1 - x/100 $$
  Let $u = \sqrt{x/100}$. Then $u = 1 - u^2 \Rightarrow u^2 + u - 1 = 0$.
  Positive root $u \approx 0.618$.
  $x/100 = 0.618^2 \approx 0.382$.
  $x \approx 38.2$ hours.

  **Allocation:** Team A gets 38 hours. Team B gets 62 hours.
  **Gaming Vector:** Team A could claim their curve is steeper (e.g., logarithmic instead of square root), arguing they saturate faster and thus deserve their "peak" allocation sooner.

  ### Case 2: Bandwidth (Latency vs. Hard Ceiling)
  **Context:** 10 Gbps guaranteed bandwidth.
  *   **Team A (API):** Latency sensitive. Value drops off a cliff below 2 Gbps.
  *   **Team B (Batch):** Data transfer. Value linear up to 8 Gbps, then hard cap (cannot ingest faster).

  **Inputs:**
  *   $R = 10$.
  *   $d_A = 0.5$ (Currently have 5 Gbps, operating safely).
  *   $d_B = 0.5$ (Currently have 5 Gbps).
  *   $U_A(x)$: Sigmoid shape. Low value < 2, high value > 4.
  *   $U_B(y)$: Linear up to $y=8$, flat thereafter. $Ideal_B$ is reached at 8 Gbps, not 10.

  **Computation:**
  Note: $Ideal_B$ is technically capped at 8 Gbps utility 1.0. If we normalise to $R=10$, $U_B(10) = 1.0$.
  However, KS requires the *feasible* ideal. If Team B cannot use more than 8, their $Ideal$ is reached at 8.
  If we set $Ideal_B = 1.0$ at 8 Gbps, then giving them 10 Gbps provides no extra gain.
  The KS line intersects the frontier where Team B hits their cap.
  If Team A needs 4 Gbps for high utility and Team B caps at 8 Gbps:
  Total needed = 12 Gbps. Resource = 10 Gbps.
  KS will split the shortage proportionally.
  **Allocation:** Team B gets 8 Gbps (Saturation). Team A gets 2 Gbps.
  **Wait:** If Team A gets 2 Gbps, their utility might crash below $d_A$.
  **Correction:** The KS solution must satisfy Individual Rationality ($U(x) \geq d$). If the KS point gives Team A < $d_A$, the solution is invalid. You must revert to the disagreement point or manual arbitration.

  **Gaming Vector:** Team B claims their ingestion cap is 10 Gbps (lying) to prevent Team A from claiming the surplus bandwidth that B cannot use.

  ### Case 3: Fragile Inputs (Inflated Maximum)
  **Context:** Storage Budget.
  *   **Team A:** Claims they can use 100TB effectively ($Ideal_A$).
  *   **Team B:** Claims they can use 100TB effectively ($Ideal_B$).
  *   **Reality:** Team A only has 10TB of data.
  *   **Disagreement:** Both currently have 5TB ($d_A = 0.5, d_B = 0.5$ assuming linear utility).

  **Inputs:**
  *   Team A states $U_A(100TB) = 1.0$. But $U_A(10TB) = 1.0$ physically.
  *   If Team A lies and says $U_A(50TB) = 0.5$, the curve looks linear up to 100TB.

  **Computation:**
  KS normalises based on the *stated* Ideal.
  If Team A inflates their Ideal (says they can use more than they can), the denominator $(Ideal_A - d_A)$ becomes larger.
  To match Team B's ratio, Team A's numerator $(U_A(x) - d_A)$ must be larger.
  This pushes allocation $x$ towards Team A.

  **Allocation:** Team A receives more storage than they can fill. Team B is starved.
  **Gaming Vector:** "Sandbagging" the Ideal. By claiming you can utilise infinite resources, you increase your denominator, which mathematically entitles you to a larger share of the actual limited pool to maintain the equal-ratio condition.

  ---

  ## 5. Limitations and Operational Warnings

  This procedure is a tool, not a truth machine. It rests on three fragile assumptions that often break in engineering organisations.

  **1. Commensurability of Utility**
  KS assumes we can compare Team A's "gain" to Team B's "gain". In Step 2, we forced both to a 0–1 scale. This implies that going from 0.5 to 0.6 value is equally "good" for both teams.
  *   **The Risk:** Team A might be a revenue-generating service (0.1 gain = £1M). Team B might be an internal tool (0.1 gain = developer happiness). KS treats these gains as equal.
  *   **The Perverse Outcome:** The procedure might allocate critical GPU capacity to a low-impact internal tool simply because that tool's engineers provided a more optimistic utility curve, starving the revenue service. As the platform owner, you must apply a **weighting factor** to the utility scores based on business criticality before running the KS algorithm.

  **2. The Disagreement Point Trap**
  KS is highly sensitive to $d$. If you set $d$ to the *current allocation*, you reward historical hoarding.
  *   **The Risk:** A team that inefficiently used 90% of the budget last quarter has a high $d$. A team that efficiently used 10% has a low $d$. KS will view the inefficient team as having "more to lose" and protect their allocation.
  *   **Recommendation:** Set $d$ based on *minimum viable service levels*, not historical spend.

  **3. Truthfulness**
  The KS solution is not "strategy-proof". Teams have an incentive to misrepresent their utility functions (as seen in Case 3).
  *   **The Risk:** The procedure becomes a contest of who can best justify their need with charts, rather than who actually needs the resource.
  *   **Mitigation:** You must audit the utility curves. If Team A claims linear scaling to 1000 GPUs, but their architecture is single-threaded, reject the input.

  **Final Verdict:**
  Use the Kalai–Smorodinsky procedure to **generate a baseline proposal** for your meetings. Do not use it to **automate the decision**. It removes the ambiguity of "fairness" by defining it mathematically, but it cannot account for the strategic reality of your business. When the math says one thing and your operational risk assessment says another, trust your risk assessment.
