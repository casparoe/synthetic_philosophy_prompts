answer: |-
  You have identified one of the most pervasive and consequential heuristics in quantitative science. You are correct that while neighboring concepts exist, none quite capture the specific *inferential move* of treating independence as the epistemically neutral default in the absence of joint information.

  The formal name for the principle that justifies this move is the **Principle of Maximum Entropy (MaxEnt)**.

  However, in practice, across the fields you mentioned, it goes by several specific names depending on the context. There is no single universal noun phrase (like "The Smith Principle") that covers the heuristic itself, but the mathematical justification is unique and well-defined.

  Here is the carving you are looking for: the formal definition, the philosophical justification, the field-specific aliases, and the precise conditions under which the move is vindicated or condemned.

  ### 1. The Formal Justification: Maximum Entropy

  The move you describe is the direct consequence of applying the **Principle of Maximum Entropy** to marginal constraints.

  **The Theorem:**
  Given random variables $X$ and $Y$, and known marginal distributions $P(X)$ and $P(Y)$, the joint distribution $P(X, Y)$ that maximizes the Shannon Entropy $H(X, Y)$ subject to those marginal constraints is the product distribution:
  $$P(X, Y) = P(X)P(Y)$$

  **Why this matches your description:**
  *   **"Adds no extra structure":** In information theory, "structure" is synonymous with "information." A distribution with lower entropy contains more information (more constraints). By maximizing entropy, you are explicitly choosing the distribution that is *maximally non-committal* regarding missing information.
  *   **"Epistemically neutral":** E.T. Jaynes, the primary architect of this view, argued that probability is an extension of logic. If your premises (the marginals) do not logically entail a correlation, asserting a correlation is an assertion of knowledge you do not possess. Independence is not a claim about the physical world; it is a claim about the state of your knowledge.

  Therefore, the inferential move is formally **Maximum Entropy Factorization**.

  ### 2. Field-Specific Instantiations

  While MaxEnt is the umbrella, the heuristic has distinct names in the domains you cited. Recognizing these helps locate the literature on its failure modes.

  *   **Statistical Mechanics: The *Stosszahlansatz* (Molecular Chaos)**
      *   **The Move:** Boltzmann assumed that particle velocities are uncorrelated before collisions.
      *   **The Name:** *Stosszahlansatz* (collision number assumption) or **Mean Field Theory**.
      *   **The Limit:** It fails near **phase transitions** (critical points). At criticality, correlation lengths diverge to infinity. The "independence" assumption breaks down spectacularly here because the system develops long-range order that marginals cannot detect. This is the physics analog of your "spectacular failure" condition.

  *   **Analytic Number Theory: Cramér's Model**
      *   **The Move:** Treating primality as a random process with probability $1/\log n$.
      *   **The Name:** **Cramér's Random Model** or the **Probabilistic Method** in number theory.
      *   **The Limit:** It fails due to **arithmetic constraints**. For example, Cramér's model predicts twin primes correctly to a first order, but it misses the "Hardy-Littlewood correction factors." Why? Because divisibility by small primes creates local correlations (e.g., if $n$ is odd, $n+2$ is odd; if $n$ is a multiple of 3, $n+2$ is not). The marginals ($1/\log n$) smooth over this, but the joint structure is constrained by modular arithmetic.

  *   **Machine Learning: Mean-Field Variational Inference**
      *   **The Move:** Approximating a complex posterior $P(Z|X)$ with a factorized distribution $Q(Z) = \prod Q(Z_i)$.
      *   **The Name:** **Mean-Field Approximation** or **Factorized Variational Inference**.
      *   **The Limit:** It fails when the true posterior has **strong dependencies** (e.g., in highly connected graphical models). It tends to underestimate variance (the "variance collapse" problem) because it cannot capture the covariance structure.

  *   **Risk Analysis: The Independence Heuristic**
      *   **The Move:** Multiplying failure probabilities of components.
      *   **The Limit:** **Common Cause Failure**. If two generators rely on the same cooling system, their failures are correlated. The marginals look fine; the joint is catastrophic. This is the "latent common cause" failure mode you noted.

  ### 3. The Philosophical Carving: Epistemic vs. Ontological

  The core confusion surrounding this move stems from conflating two types of independence:

  1.  **Ontological Independence:** The physical mechanisms generating $A$ and $B$ do not interact.
  2.  **Epistemic Independence:** I have no information linking $A$ and $B$.

  Your observation is that practitioners often use **Epistemic Independence** as a proxy for **Ontological Independence**, hoping the latter is true or that the error is negligible.

  **When is the move vindicated?**
  *   **High-Dimensional Limits:** In high dimensions, under certain conditions, projections of distributions tend toward independence (concentration of measure).
  *   **Mixing Systems:** In dynamical systems with strong mixing properties, correlations decay rapidly. Assuming independence for sufficiently separated time steps is justified.
  *   **Regularization:** In ML, assuming independence (Naive Bayes) acts as a strong regularizer. It reduces variance at the cost of bias. If the dataset is small, the "wrong" independent model often outperforms the "right" dependent model because the latter overfits the noise in the joint estimation.

  **When is the move reckless?**
  *   **Conservation Laws:** If $A + B = C$ is fixed, $A$ and $B$ are perfectly negatively correlated. Marginals cannot reveal this.
  *   **Selection Bias (Berkson's Paradox):** Conditioning on a collider induces correlation between independent causes. If you estimate marginals from selected data, assuming independence in the population is fatal.
  *   **Criticality:** As noted in physics, near phase transitions, the "mean field" (independence) assumption yields incorrect critical exponents.

  ### 4. Is There a Better Name?

  Since "Maximum Entropy" describes the *optimization* but not the *heuristic stance*, and "Naive Bayes" is too narrow, the most precise term for the inferential move itself is **The Principle of Epistemic Independence**.

  However, in the literature of **Copulas**, this is referred to as selecting the **Independence Copula** (or Product Copula) as the **Reference Copula**.

  If you are looking for a term to use in your own writing to describe this specific pattern, I recommend:
  **"The Maximum Entropy Independence Assumption"**

  This distinguishes it from "Naive Bayes" (which is conditional) and "Mean Field" (which is physical/variational). It highlights that the justification is *informational* (entropy) rather than *mechanistic*.

  ### 5. Summary of the Literature

  If you wish to pursue the formal justification and limits, these are the key touchstones:

  1.  **E.T. Jaynes, *Probability Theory: The Logic of Science*:** Specifically the chapters on Maximum Entropy. Jaynes explicitly argues that independence is the null hypothesis of "no information."
  2.  **Imre Csiszár, "I-Divergence Geometry of Probability Distributions" (1975):** Formalizes the geometry. The independent distribution is the "projection" of the unconstrained space onto the manifold of distributions with fixed marginals, minimizing KL-divergence.
  3.  **Nelsen, *An Introduction to Copulas*:** Discusses the independence copula as the center of the space of dependence structures.
  4.  **Wainwright & Jordan, "Graphical Models, Exponential Families, and Variational Inference" (2008):** Discusses mean-field approximations as minimizing KL divergence to a factorized family.

  ### Conclusion

  The move is not a fallacy, but it is an **epistemic commitment**. It is the statement: *"I will not model correlations that I cannot detect from my constraints."*

  It is justified by the **Principle of Maximum Entropy**. It is vindicated when correlations are weak, data is scarce (bias-variance tradeoff), or the system is high-dimensional and mixing. It is condemned when latent structure, conservation laws, or critical phenomena impose strong dependencies that marginals obscure.

  It does not have a single common name beyond "Maximum Entropy," but **"Epistemic Independence"** captures the philosophical stance you described: treating independence as the baseline state of ignorance rather than a discovered fact about the world.
