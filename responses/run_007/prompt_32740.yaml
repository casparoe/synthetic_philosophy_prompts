          3.  **1+5 vs. 6 (Pragmatic Self-Defeat):** If the theory condemns everyone, and that makes it useless, why keep the theory?

      *   *Refining the "Real Problem":* The user is likely a **Satisficing Consequentialist** or a **Hybrid Theorist** but is labeling their view as **Maximizing Act Consequentialism**. Claim 1 is the liar here. It's doing too much work. It claims to be maximizing, but 3 and 4 imply it isn't.
      *   *Claim 2* is also doing weird work. If 5 is true (we are acting wrongly), then the demands *are* high. Claim 2 says they aren't unreasonable. This is a subjective vs. objective clash.

  6.  **Final Polish:**
