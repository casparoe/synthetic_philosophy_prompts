      *   *Integrity:* Williams' objection. AC says sacrifice integrity. User says "Integrity objection is better." This implies the user thinks the theory *should* accommodate integrity. But 1 says "maximize aggregate." Aggregate doesn't care about integrity unless integrity produces aggregate good.
