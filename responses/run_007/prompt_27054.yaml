answer: |-
  Good's theorem establishes only that costless information cannot reduce the expected utility of action selection given outcome-dependent preferences, not that information is intrinsically beneficial, meaning apparent counterexamples of rational information avoidance should be classified as exposing a common but overstated gloss of the theorem rather than valid refutations of its mathematical core.

  The theorem demonstrates that for a rational agent maximizing expected utility, the expected utility of choosing an action after observing a free signal is always greater than or equal to the expected utility of choosing without that signal. This result relies critically on the assumption that the agent's utility function is defined solely over final actions and states of the world, remaining independent of the agent's epistemic state or the mere fact of knowing. In the cases you describe, such as declining a test for an untreatable condition, the agent's utility function violates this assumption because the state of knowledge itself enters the utility function as a direct source of disutility (e.g., anxiety or grief), distinct from any physical outcome the information might help avert.

  Consequently, these cases do not invalidate the theorem but rather highlight why it is often over-read: decision theorists and philosophers frequently conflate the instrumental value of information for choice optimization with the broader notion of personal welfare or happiness. In the restricted sense guaranteed by Good, costless information has non-negative expected value only relative to the goal of maximizing expected utility over external consequences, assuming the agent can condition their actions on the information received. When utility depends on ignorance itself, the theorem's axioms are not met, and the guarantee dissolves, revealing that the popular claim "information is always valuable" is an overstated gloss that ignores the psychological costs of knowledge.
