      *   **Time:** Roughly 10 minutes (approx. 1,000 - 1,300 words spoken at a moderate pace).
      *   **Honoree's Philosophy:** Deeply Rortyan/Neopragmatist. Antirepresentationalist, ironic, contingent. Saw philosophy as therapy, not doctrine. Believed truth is about coping, not mirroring.
      *   **Honoree's Personality:** Warm, funny, loved even by critics.
      *   **Audience:** Mixed.
          *   Rorty specialists (know the jargon).
          *   Critics/Analytic philosophers (think antirepresentationalism is wrong/trivial).
          *   Family (non-philosophers, grieving).
      *   **Key Challenge:** Honor her philosophy without lecturing. Comfort the grieving without using representationalist metaphors (e.g., "she's in a better place," "her legacy lives on in the eternal realm of ideas") that she would reject. Address the tension: If truth is just what helps us cope, what does it mean to say her life *mattered* or that we are *diminished*?
      *   **Tone:** Loving, reflective, ironic but sincere, not argumentative. "A speech she could have listened to without wincing."

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Problem:* Traditional eulogies often rely on metaphysics (souls, eternal truths, objective legacies). A Rortyan rejects these.
      *   *The Rortyan Solution:* Meaning isn't found; it's made. Solidarity isn't discovered; it's created. Grief isn't a recognition of an objective loss in the fabric of the universe; it's a disruption of our shared vocabulary and practices.
      *   *The Hook:* How do we talk about "loss" without assuming a "presence" that was objectively real in a metaphysical sense?
      *   *The Angle:* Focus on *conversation*, *vocabularies*, and *solidarity*. Her death changes the conversation. The "truth" of her goodness is in how her vocabulary helps us cope and expand our sense of "us."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Acknowledge the mixed room. Set the tone (warm, not academic).
          *   *Idea:* Start with the irony of memorializing a skeptic of eternal truths.
          *   *Drafting thought:* Don't say "We gather here to honor..." Say something more like "We are here to talk."

      *   **Addressing the Philosophy (Lightly):** Explain her stance without jargon.
          *   *Idea:* She didn't think philosophy was about getting it right. It was about keeping the conversation going.
          *   *Key Rortyan concept:* "Solidarity" over "Objectivity."
          *   *Connection to family:* To the family, she wasn't a philosopher. To the philosophers, she wasn't just a person. She bridged these.

      *   **Addressing the Grief (The Core Challenge):** How to speak of loss without metaphysics?
          *   *Idea:* If there's no mirror of nature, grief isn't about a hole in the universe. It's about a silence in *our* room.
          *   *Metaphor:* A voice stopping. A vocabulary going quiet.
          *   *Reframing "Truth":* Saying "she was good" isn't stating a fact about the cosmos; it's expressing a commitment to continue what she started.

      *   **Addressing the Critics:** Acknowledge the disagreement gently.
          *   *Idea:* Even those who thought she was wrong loved her. Why? Because philosophy is a human activity, not just a truth-tracking machine.
          *   *Rortyan point:* We can have solidarity without agreement.

      *   **Addressing the Family:** Validate their loss without spiritual fluff.
          *   *Idea:* To you, she was the warmth. To us, she was the arguments. But they are the same thing. Her irony was her kindness.

      *   **Closing:** Bring it back to the present. What do we do now?
          *   *Idea:* We keep talking. We use her words. That's how she stays "real."
          *   *Final Image:* Not a monument, but a conversation.

  4.  **Refining the Tone (The "Wince" Test):**
      *   *Avoid:* "She is looking down on us," "Her spirit lives on," "She discovered the truth."
      *   *Use:* "We miss her voice," "Her words still help us," "We are less equipped without her."
      *   *Check:* Is it too academic? *Adjustment:* Simplify the pragmatism. Talk about "tools" and "stories" rather than "antirepresentationalism."
      *   *Check:* Is it too sentimental? *Adjustment:* Keep the irony. Acknowledge the contingency. She would laugh at us taking this too seriously.

