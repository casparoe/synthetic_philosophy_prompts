      *   *New Case:* If the user says qualia are "over and above functional facts," then a functional duplicate without qualia (Super-Blindsight) is possible *conceptually*. But if they are physicalists (Verdict 4), and the physical substrate is normal, qualia *must* exist. I need to point out this tension. If the physical brain is normal, the Type-B Physicalist says qualia are present regardless of report. If the brain is different (to explain the report), then it's just a brain damage case. I will assume the case implies functional equivalence to a normal human but no experience.
      *   *Decision:* I will treat the New Case as a "Super-Blindsighter." Given Verdict 5 (Blindsight = no qualia despite some processing) and Verdict 1 (Qualia > Function), the user should predict **No Qualia**. But this risks contradicting Verdict 4 (Zombies impossible) if this person is a physical duplicate. I need to clarify that distinction.

  8.  **Final Polish:** Ensure the distinction between "Qualia" (Dennett's target) and "Phenomenal Properties" (User's target) is clear. This is the key to saving the coherence.

