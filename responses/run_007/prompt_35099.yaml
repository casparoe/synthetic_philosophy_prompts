  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Verdict 1:* "Qualia are something over and above functional facts." If they are Type-B Physicalists, qualia *are* physical states, just not *conceptually* reducible to functional facts. I need to make sure I distinguish *ontological* vs. *conceptual* distinctness. The user says "something over and above," which sounds ontological. But then they say "doesn't show they're non-physical." This is the tightrope. I need to highlight that this is the hardest part of their view to maintain without slipping into dualism.
