  **MEMORANDUM**

  **TO:** Clinical Ethics Committee, University Teaching Hospital
  **FROM:** Ethics Consultation Service
  **DATE:** October 24, 2023
  **SUBJECT:** Ethical Recommendation Regarding Patient LB (Case #774-B)

  ### I. Recommendation and Implementation Protocol

  After deliberation regarding the conflicting expressions of preference exhibited by Patient LB, the Ethics Committee issues the following recommendation:

  **Recommendation:** **Withhold chemotherapy.** The oncology team should not initiate the proposed cytotoxic regimen at this time. Instead, the care plan should immediately transition to a palliative focus aimed at symptom management and quality of life, while maintaining openness to revisiting disease-modifying treatment should the conflict in expressed preference resolve.

  **Protocol and Timeline:**
  1.  **Immediate Action (0–48 Hours):** The attending physician will inform LB (verbally) and LB's partner that chemotherapy will not be initiated based on the presence of explicit non-verbal refusal. A palliative care consult will be ordered to manage pain, nausea, and anxiety.
  2.  **Observation Period (7 Days):** Nursing staff will document any further non-verbal communications from the left hand (writing, gesturing) and any changes in LB's verbal statements. Specifically, staff should note if the verbal preference shifts when the immediate pressure of consent is removed.
  3.  **Re-evaluation Conference (Day 7):** The ethics committee, oncology, neurology, and palliative care teams will reconvene with LB's partner. If the left hand ceases refusal behaviors and LB verbally reaffirms consent, a second capacity assessment utilizing the new "Bimodal Protocol" (see Section III) will be attempted. If the conflict persists, the palliative plan becomes the standing order for the duration of LB's prognosis.

  ### II. Ethical Rationale and Engagement with Opposing View

  The Committee's decision rests on the principle that valid informed consent requires the absence of explicit refusal. In standard cases, verbal refusal trumps written consent, or vice versa, depending on the most recent competent expression. Here, we face simultaneous, contradictory expressions from a single biological organism. In conditions of uncertainty regarding the validity of consent, the ethical default must be non-maleficence: we cannot impose a burdensome, non-curative intervention on a patient whose body is actively resisting it.

  **Engagement with the "Unified Agent" Argument**
  We acknowledge the strength of the argument positing that LB is a unified agent whose verbally articulated preferences should govern. This view relies on the "Narrative Self" theory of personhood. Proponents argue that the left hemisphere (LH), which controls speech, is the locus of autobiographical memory, future planning, and reason-giving. LB's verbal justification for treatment (wanting to witness specific future events) demonstrates a reflective endorsement of values over time. By contrast, the right hemisphere's (RH) refusal, expressed through writing "NO" or hiding forms, appears reactive, emotional, and incapable of justification. To privilege the silent hand over the speaking voice is to privilege impulse over reason, potentially violating the autonomy of the person LB claims to be.

  The Committee finds this argument compelling regarding *identity*, but insufficient regarding *bodily integrity*. Even if we accept the LH as the primary narrator of LB's life, the RH is not merely a passive instrument; it controls 50% of the patient's motor function and somatic experience. The RH's actions (hiding forms, writing "let me go") are not reflexive spasms but purposeful, goal-directed behaviors. To force chemotherapy would require physically restraining the left hand and overriding its active resistance to administer toxins that will cause systemic suffering.

  In bioethics, the right to refuse treatment is generally held to be stronger than the right to demand it. When one locus of will within a patient says "yes" and another says "no," we do not have affirmative consent; we have contested consent. To proceed would be to treat the RH as a mere object to be manipulated by the LH, rather than a center of experience that will share the burden of the side effects. We cannot ethically sanction the LH imposing severe physical suffering on the RH against the RH's explicit will, even if the LH believes the trade-off is worth it. Therefore, the veto power of the refusing hemisphere must prevail to prevent battery and non-consensual bodily intrusion.

  ### III. Implications for Future Policy and Capacity Assessment

  This case exposes a critical blind spot in our institutional protocols for assessing decision-making capacity. Our standard tools (e.g., MacArthur Competence Assessment Tool for Treatment) rely almost exclusively on verbal output. For the general population, we assume the hand writes what the mouth says. For split-brain patients, this assumption is empirically false.

  **Policy Revision:**
  The Committee recommends the adoption of a **Bimodal Capacity Assessment Protocol** for any patient with a history of commissurotomy or confirmed interhemispheric disconnection. This protocol must include:
  1.  **Dual-Modality Querying:** Questions regarding treatment preference must be asked both verbally (for LH response) and via blind tactile selection or left-hand writing (for RH response).
  2.  **Conflict Adjudication Clause:** If interhemispheric conflict is detected, the default position shall be the preservation of bodily integrity (withholding invasive treatment) until a consensus is reached or a legal guardian (if applicable) provides guidance consistent with the patient's prior unified values.
  3.  **Advance Directive Specificity:** Neurology and Ethics services should collaborate to create template advance directive language for patients undergoing callosotomy, allowing them to specify *ex ante* which hemisphere's preference should govern in the event of future conflict.

  **Conclusion:**
  LB has lived a unified life for thirty-five years, but the biology of the disconnection now presents an irreconcilable conflict of wills. We cannot resolve the metaphysical question of whether LB is one person or two. We must, however, resolve the clinical question of consent. In the face of a silent "no" that writes itself upon the world, we cannot ethically proceed with the "yes" that speaks it.

  **Approved by:**
  The Clinical Ethics Committee
  University Teaching Hospital
