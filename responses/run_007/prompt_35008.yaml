  1.  **Analyze the User and Request:**
      *   **User:** High school student in an optional reading group (philosophy/economics). This means they are likely bright and motivated but might lack advanced formal training in logic or social choice theory. The explanation needs to be intuitive but rigorous enough not to talk down to them.
      *   **Topic:** Amartya Sen's Liberal Paradox (The Impossibility of a Paretian Liberal).
      *   **Specific Focus:** The user understands the basic setup (Universal Domain, Pareto, Minimal Liberty) but is unsettled by *why* such a weak liberty condition causes a breakdown. They want to understand the *structure of the conflict*, not just the "Lady Chatterley's Lover" example.
