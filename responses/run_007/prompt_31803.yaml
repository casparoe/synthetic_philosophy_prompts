  5.  **Determine the "Cheapest Fix":**
      *   *Option A: Drop Illusionism (1).* Move to Representationalism or Functionalism. Keep WIL (3), keep Hard Problem as "explanatory gap" (4), keep Physicalism (2). This makes the view more standard (Type-B Physicalism). Cost: Lose the specific "introspective misrepresentation" mechanism which might be the user's unique contribution.
