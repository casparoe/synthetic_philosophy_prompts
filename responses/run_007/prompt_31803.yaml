          *   *Verdict:* High Tension. You can't easily say "Qualia are an illusion" AND "The Hard Problem is real." The Hard Problem *is* the problem of explaining Qualia. If Qualia are illusions, the Hard Problem vanishes.

      *   **Cluster B: The Epistemology (1, 5).**
          *   (1) says introspection misrepresents (we think we have qualia, we don't).
