      *   **Position 4 (Hard Problem is Genuine):** Illusionists (like Frankish) typically argue the Hard Problem is a *pseudo-problem* generated by the illusion. If the Hard Problem is genuine, it implies there's an explanatory gap that needs bridging, not just debunking.
      *   **Tension 1 vs. 4:** If Illusionism is true, the Hard Problem dissolves (because the thing needing explaining doesn't exist). If the Hard Problem is genuine, Illusionism seems inadequate (because it denies the datum the Hard Problem is built on).
      *   **Position 5 (Reports Reliable):** Illusionism relies on the idea that people are *wrong* about their own minds (they think they have qualia, they don't). This creates tension with (5). If reports are reliable, and people report qualia, qualia exist.
      *   **Position 6 (Zombies Unsound, not Type-A):** Type-A says zombies are inconceivable. Type-B says conceivable but not metaphysically possible. The user is not Type-A. This suggests Type-B. But Type-B usually accepts qualia are real (contradicting 1).

