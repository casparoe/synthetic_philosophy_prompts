answer: |-
  ### The pattern
  You are observing that we selectively attribute causal power to specific absences or failures to act, depending on whether there was an expectation or obligation for that thing to occur. While physically identical to countless other non-events, certain omissions are treated as causes because they violate a norm, whereas others are ignored as background conditions. This implies that causation is not merely a physical relation but a normative one.

  ### What this is usually called
  Philosophers typically label this **causation by omission** or **negative causation**, often analyzed through counterfactual theories where the cause is defined by what *would* have happened had the absence not occurred. However, standard counterfactual accounts struggle to explain why your neighbor's inaction counts while mine does not, since both satisfy the condition that "if they had watered, the plants would live." To solve this, contemporary metaphysicians like Hart and Honoré or Jonathan Schaffer propose **normative** or **default-relative** theories, suggesting we only count an absence as a cause when it deviates from a prescribed duty, statistical normality, or expected functional design.

  ### Where the real dividing line is
  The dividing line is drawn at **defaults and norms**, distinguishing between a mere logical possibility and a contextually expected occurrence. An absence becomes causal when it represents a deviation from a "normal course of events," whether that normality is defined by statistical frequency, physical function, or moral obligation. In your example, the neighbor's failure is a deviation from a social contract, whereas your inaction is consistent with the background expectation that strangers do not water each other's plants.

  This gets weird at the edges where norms conflict or vanish. If a doctor fails to save a patient, it is causation by omission, but if a passerby fails to save the same patient, it usually isn't, unless a "Good Samaritan" norm is legally enforced. Further complications arise in **preemption cases**: if the neighbor didn't water the plants, but an automatic sprinkler system also malfunctioned, determining which absence "caused" the death depends on which system was the primary expected safeguard. These edge cases reveal that causal selection is often pragmatic, shifting based on who is asking the question and what they intend to fix or blame.

  ### A name, if there isn't one
  While "causation by omission" is the standard term, a more precise label for the specific mechanism you are describing is **normative causal selection**. This captures the idea that we filter physical non-events through a lens of expectation to decide which nothings matter.
