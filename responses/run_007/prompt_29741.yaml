answer: |-
  Here is the job description for a theory of valid consent in medicine and research. This list is designed to stress-test metaphysical commitments (mental-state vs. performative) against practical constraints (clinical workflow, research design).

  ### The Desiderata List

  **1. The Factum/Inducement Distinction (Deception)**
  *   **Requirement:** The theory must distinguish between deception about the *nature of the act* (fraud in the factum, e.g., "this is a vaccine" when it is saline) and deception about *collateral facts* (fraud in the inducement, e.g., "this vaccine was developed by Nobel winners" when it was not). The former must void consent; the latter may not.
  *   **Status:** **Non-negotiable.** Law and basic moral intuition treat these differently. A theory that collapses them (e.g., claiming all lies void consent) makes placebo-controlled trials and therapeutic privilege impossible; a theory that ignores the distinction validates battery.
  *   **Camp Tension:** Mental-state views struggle here if the subject *believes* they are consenting to the act, regardless of the lie. Performative views handle this better by focusing on the scope of authority transferred.

  **2. The Validity/Appropriateness Gap**
  *   **Requirement:** The theory must allow for consent that is *valid* (normatively transforms the permission) but *wrong* (ethically impermissible to accept). Example: A patient demands an antibiotic for a viral infection. They understand the risks/benefits. They consent. The doctor should still refuse.
  *   **Status:** **Non-negotiable.** If validity entails ethical permissibility, paternalism becomes incoherent. We need to be able to say, "You have the right to choose this, but I have a duty not to offer it."
  *   **Camp Tension:** Pure welfare-based theories collapse this distinction. Autonomy-based theories preserve it.

  **3. The Withdrawal Cost Threshold**
  *   **Requirement:** The theory must specify when costs attached to withdrawal render the initial consent involuntary. Withdrawal can be administratively burdensome (filling a form) but not punitive (losing access to standard care).
  *   **Status:** **Non-negotiable.** Research ethics (Belmont/CIOMS) mandates the right to withdraw without penalty. However, "penalty" is undefined. A theory must draw the line between a *consequence* of withdrawal (data gap) and a *sanction* for withdrawal (provider abandonment).
  *   **Camp Tension:** Contractualist views struggle here (breach of contract implies penalty). Rights-based views handle it better.

  **4. The Broad Consent Accommodation**
  *   **Requirement:** The theory must explain how authorization can cover *unspecified future uses* of tissue/data (biobanking) without violating the "informed" condition.
  *   **Status:** **Contested (Camp Preference).** Strict "Informed Consent" theories (Faden & Beauchamp style) cannot accommodate this without contradiction. Legal frameworks (GDPR, Common Rule) allow it. A theory aiming to match current regulatory practice *must* accommodate this; a theory aiming for ideal autonomy *should* reject it.
  *   **Camp Tension:** This is the biggest fracture point. Mental-state views (requiring actual understanding) generally fail here. Performative/Trust views (authorizing an institution) succeed.

  **5. The Coercion/Baseline Problem**
  *   **Requirement:** The theory must distinguish between a *threat* (coercion, e.g., "join the trial or I fire you") and a *pre-existing hard choice* (non-voluntary but not coerced, e.g., "join the trial or you remain uninsured").
  *   **Status:** **Non-negotiable.** If all hard choices count as coercion, half of clinical care is coercive. If no hard choices count, exploitation is validated. The theory must define the *normative baseline* against which the offer is measured.
  *   **Camp Tension:** Subjective views (how the patient feels) fail here. Objective views (what they are owed) are required but difficult to specify non-arbitrarily.

  **6. Capacity: Scalar vs. Threshold & Global vs. Relative**
  *   **Requirement:** The theory must reconcile the psychological reality that capacity is *scalar* (degrees of understanding) and *decision-relative* (high risk = high bar) with the legal necessity of a *binary* threshold (valid/invalid) and often *global* adjudication (guardianship).
  *   **Status:** **Non-negotiable (with tension).** Clinical practice requires the sliding scale (risk-sensitive). Law requires the binary switch. A theory that insists capacity is purely scalar cannot explain when the switch flips. A theory that insists it is purely global contradicts clinical reality.
  *   **Camp Tension:** Philosophical theories prefer scalar/relative; Legal theories prefer binary/global.

  **7. Assent vs. Consent**
  *   **Requirement:** The theory must account for *assent* (agreement by one lacking full authority, e.g., children, cognitively impaired) as distinct from *consent* (authorization by one with authority). Assent should carry weight but not veto power in all cases.
  *   **Status:** **Non-negotiable.** Pediatric ethics relies on this. If assent = consent, parents lose authority. If assent = irrelevant, the child is instrumentalized.
  *   **Camp Tension:** Performative views handle this well (different speech acts). Mental-state views struggle to differentiate the internal state of a child assenting vs. an adult consenting.

  **8. Wronging vs. Harming**
  *   **Requirement:** The theory must explain why proceeding without valid consent is a *wronging* (rights violation/battery) even if it results in no *harm* (successful surgery, improved health).
  *   **Status:** **Non-negotiable.** This is the core of the doctrine of informed consent. If the theory cannot explain the independent wrong of bypassing autonomy, it reduces consent to a risk-management tool.
  *   **Camp Tension:** Consequentialist theories struggle immensely here. Deontological theories require it.

  ---

  ### The Theory Killer

  **The Single Requirement that Excludes the Most Popular Theories:**
  **Requirement #4: The Broad Consent Accommodation.**

  This requirement kills the "Gold Standard" Mental-State Theory of Informed Consent (the view dominant in 1980s/90s bioethics). If you hold that valid consent requires *actual subjective understanding* of the specific risks, benefits, and procedures, **biobanking is impossible.** You cannot understand what you cannot describe.
  To satisfy this requirement, you must adopt a **Performative/Authorization View** (consent is granting permission to a trusted agent to decide later) or a **Hybrid View** that downgrades "understanding" from a validity condition to an ideal aspiration. Any theory that insists on specific comprehension for specific acts is rendered obsolete by modern genomic research needs.

  ### The Jointly Unsatisfiable Pair

  **Requirement #6 (Capacity as Scalar/Relative) + The Need for Binary Validity.**

  Psychology and ethics agree capacity is a spectrum and task-specific. However, the *function* of consent in medicine is to provide a clear normative switch: the surgeon is either liable for battery or they are not. There is no "0.6 valid" consent in a malpractice court.
  *   **The Conflict:** A theory that accurately models capacity (scalar) cannot generate a clear action-guiding rule for the clinician without introducing an arbitrary cutoff. A theory that provides a clear rule (binary) misrepresents the psychological reality of the agent.
  *   **Result:** You must choose between **Descriptive Accuracy** (capacity is scalar) and **Normative Clarity** (consent is binary). No theory currently solves the "cutoff problem" without stipulation.

  ---

  ### Scorecard of Existing Views

  **Mental-State View (e.g., Faden & Beauchamp)**
  *   **Core:** Consent is a complex internal act of will + understanding.
  *   **Pros:** Captures the moral weight of autonomy; explains "wronging vs. harming."
  *   **Cons:** Fails Broad Consent; makes validity epistemically inaccessible to clinicians (you can't see mental states); struggles with the binary cutoff for capacity.

  **Performative/Communicative View (e.g., O'Neill, Alexander)**
  *   **Core:** Consent is a public speech act that transfers authority.
  *   **Pros:** Solves the epistemic problem (clinicians see the signature/hear the yes); handles Broad Consent well (authorization of trust); distinguishes assent/consent easily.
  *   **Cons:** Risks becoming "formalism" (signing a form you don't read counts as valid); struggles to explain why deception voids consent if the speech act was still performed.

  **Hybrid/Pragmatic View**
  *   **Core:** Validity is performative (for legal safety), but Ethics requires mental-state engagement (for respect).
  *   **Pros:** Matches clinical workflow; allows "Valid but Wrong" distinctions.
  *   **Cons:** Theoretically unstable; creates a two-tier system where a patient can be "consented" (legally) but "violated" (ethically) simultaneously, which confuses policy.
