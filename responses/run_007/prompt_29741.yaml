prompt: |-
  im a bioethics phd student trying to get the lay of the land on consent before I commit to a view, and I keep finding that everyone argues from their own pet hard case without saying what the full job description of a theory of consent is. so before i read anything else, write me the desiderata for a theory of valid consent to count as adequate, aimed at medicine and research rather than just sex or contracts. what does such a theory have to get right? give me the requirements list — the cases it has to handle, the distinctions it can't collapse, the legal or psychological results it can't contradict — with the case or consideration behind each. for each requirement, say whether it's non-negotiable or just a preference of one camp (mental-state view vs performative view vs hybrid; full disclosure vs materiality). then tell me which single requirement does the most to exclude the popular theories, and whether any pair of requirements looks jointly unsatisfiable.

  dont stop at the obvious ones about competence and voluntariness. i want the in-the-weeds stuff too: deception about collateral facts (the surgeon's experience, a partner's identity, who funds the study) versus deception about the act itself; assent vs consent; consent that is valid but wrong to give; whether withdrawal can be made costly without being blocked; whether broad consent for biobanking can ever count as informed; the line between coercion and merely bad options (the worker who 'chooses' a trial because the alternative is losing a job); capacity as threshold vs scalar and as global vs decision-relative; and whether proceeding without valid consent is fundamentally a wronging or a harming. for each of these, tell me whether it's a genuine requirement on a theory of consent or just one camp's aesthetic. keep any scorecard of existing views to a few lines by view-type, no citations.
