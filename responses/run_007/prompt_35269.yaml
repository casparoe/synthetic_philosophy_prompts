answer: |-
  You have hit on something that most discussions of the Surprise Exam (or Unexpected Hanging) Paradox gloss over: the sociology of the debate is just as puzzling as the paradox itself. You are correct that the literature is stratified into silos that have been talking past one another since Quine, Shaw, and Montague.

  The reason there is no consensus after 80 years is not that the problem is unsolvable, but that **the paradox is not a single problem.** It is a "cluster concept" masking a disagreement about how to formalize natural language epistemology.

  Here is a diagnosis of the impasse, broken down by the nature of the disagreement, why consensus is blocked, and what progress actually looks like in this context.

  ### 1. The Core Diagnosis: Underdetermination of Formalization
  The primary reason for the stalemate is that the natural language announcement ("There will be an exam next week and you won't know the night before") is radically **underdetermined**. It does not specify the logical properties of "know," the temporal logic of the week, or the status of the announcement itself.

  Different camps are not solving the same equation; they are writing different equations based on different philosophical priors.

  *   **The Epistemic Logic Camp** assumes "know" behaves like a modal operator in a system like **S5** (which includes the KK principle: $Kp \rightarrow KKp$). If you accept S5, the students' reasoning is valid, and the announcement is self-contradictory. Their "solution" is to say the teacher lied.
  *   **The Weak Knowledge Camp** argues that "know" in this context implies a lower threshold (perhaps just justified true belief without introspection). If you drop KK, the backward induction breaks at step one. Their "solution" is that the exam is possible.
  *   **The Pragmatics/Speech Act Camp** argues the issue isn't truth conditions but **assertability**. The announcement might be true, but it cannot be *coherently asserted* to the students because the act of asserting it changes the epistemic state (Dynamic Epistemic Logic).

  **The Impasse:** There is no neutral arbiter to decide which formalization is "correct." If you are a formal epistemologist, S5 looks natural. If you are a linguist, the context-sensitivity looks natural. The disagreement is not about the math; it's about **model selection.**

  ### 2. Substantive vs. Verbal: It's Both
  You asked if this is a verbal dispute or a substantive one. It is a **substantive disagreement disguised as a verbal one.**

  *   **Verbal Aspect:** If the camps agreed on a precise definition of "know" and "surprise," the paradox would likely dissolve into a trivial logical derivation. Much of the shouting match is indeed people defining "knowledge" differently.
  *   **Substantive Aspect:** However, *why* they define it differently reveals deep rifts in epistemology.
      *   Is knowledge transparent to the knower? (The KK Principle debate).
      *   Can a true proposition be unknowable? (Fitch's Knowability Paradox connection).
      *   Does the act of learning a truth change its truth value? (Moore's Paradox connection).

  The impasse persists because resolving the paradox requires taking a stance on these deeper, unresolved issues in epistemology. The Surprise Exam Paradox is essentially a proxy war for the debate over **introspection and factivity.** Consensus is impossible because there is no consensus on the underlying nature of knowledge.

  ### 3. Talking Past Each Other: Normative vs. Descriptive
  A major source of the fragmentation is that different camps are answering different normative questions.

  *   **The Logicians** are asking: *Is the set of propositions consistent?* (Focus: Truth)
  *   **The Game Theorists** are asking: *What is the rational strategy for the student?* (Focus: Rationality)
  *   **The Psychologists/Pragmatists** are asking: *Why does the student feel surprised?* (Focus: Phenomenology)

  When the "Simple Solution" crowd says the students can't eliminate Friday, they are often making a point about **trust** (a pragmatic constraint). When the Epistemic Logicians say the announcement is false, they are making a point about **consistency** (a semantic constraint).

  They talk past each other because one side thinks the paradox is about the **limits of logic**, and the other thinks it's about the **limits of communication.** Until the literature distinguishes between the *logical possibility* of the exam and the *communicative felicity* of the announcement, the debate will remain circular.

  ### 4. Why Consensus is Blocked: The Lack of Empirical Traction
  In physics, a stalemate is often broken by a new experiment. In the Surprise Exam Paradox, there is no empirical traction.
  *   You cannot run the experiment to see who is right, because the outcome depends on whether the students *actually reason* the way the paradox says they do.
  *   If real students are surprised on Wednesday, the Logician says, "Ah, but they were irrational." The Pragmatist says, "See, the announcement worked."
  *   Because the paradox relies on idealized rational agents, it is immune to empirical falsification. It is a **reflective equilibrium** problem. We are left weighing intuitions against intuitions (the intuition that backward induction is valid vs. the intuition that the exam happened).

  Consensus is blocked because there is no "cost" to being wrong. A logician can maintain the announcement is contradictory without any real-world consequence. This allows incompatible frameworks to coexist indefinitely.

  ### 5. What Counts as Progress?
  Given this diagnosis, expecting a "final solution" is a category error. Progress in this domain does not look like a proof that eliminates all other views. Progress looks like **mapping the logical space.**

  We should stop looking for the *one* correct formalization and start treating the paradox as a **diagnostic tool** for epistemic systems. Progress consists of:
  1.  **Impossibility Results:** Proving exactly which combinations of axioms (e.g., Factivity + KK + Public Announcement) lead to contradiction. (We have some of this, but it needs to be synthesized).
  2.  **Taxonomy of Assumptions:** Clearly cataloging which solution requires dropping which epistemic principle. For example: "Solution A works if and only if you reject the KK principle."
  3.  **Integration with Related Paradoxes:** Explicitly linking the Surprise Exam to Fitch's Paradox, Moore's Paradox, and the Liar. Recognizing them as manifestations of the same tension between **truth** and **knowability**.

  ### Summary
  The impasse exists because the Surprise Exam Paradox is not a puzzle with a missing piece; it is a **fracture point in our conceptual scheme.**

  *   **Is it verbal?** Yes, in that "knowledge" is underspecified.
  *   **Is it substantive?** Yes, in that specifying it forces a choice between competing theories of mind and logic.
  *   **Are they talking past each other?** Yes, because they are prioritizing consistency, rationality, or pragmatics differently.

  **The Verdict:** The disagreement is genuine and unlikely to be resolved because it reflects a fundamental tension in epistemology: **The tension between the objective truth of a proposition and the subjective accessibility of that truth.**

  Progress will not come from one camp "winning." It will come from a meta-analysis that accepts the paradox as a **limitative result** (like Gödel's Incompleteness Theorems). The lesson isn't "here is how the exam happens"; the lesson is "here is why our standard models of knowledge break down when applied to self-referential predictions." The stagnation you perceive is actually a stable equilibrium of incompatible but internally coherent frameworks. The "solution" is to recognize that the paradox reveals a bug in the concept of knowledge itself, not in the students' reasoning.
