  I just spent three hours arguing with my flatmate about Taurek and now I can't sleep. He's convinced that Taurek is basically right — when you can save one stranger or five strangers, you're not obligated to save the five. You can flip a coin, because each person's claim is separate and there's no collective entity "the five" whose claim outweighs the one's. I pushed back and ended up constructing an argument that seems to show Taurek's view has completely mad implications, but my flatmate says I've made a mistake somewhere and he won't tell me where — says I should figure it out myself. Here's what I gave him:

  (1) If the numbers don't count in the one-versus-five rescue case, then the fact that more people are in one group than another is never by itself a reason to favour the larger group. (2) If the size difference is never by itself a reason to favour the larger group, then a health system choosing between funding a drug for a disease that kills 100,000 people a year and a drug for a disease that kills 50 people a year has no size-based reason to prefer the former. (3) If there's no size-based reason to prefer the former, then the health system should be indifferent between the two — or at most flip a coin. (4) But no reasonable person, including Taurek, would accept that a health system should be indifferent between saving 100,000 lives and saving 50. (5) Therefore Taurek's claim about the one-and-five case must be false.

  I feel like something goes wrong between (1) and (2) — maybe the move from rescue cases to health-system allocation changes something important — but I can't articulate exactly what. Or maybe the argument is valid and Taurek really does have to bite the bullet on (3), which seems insane. Which step should I reject, and what does rejecting it cost? Give me exactly five points, each a sentence or two, no introduction or conclusion, and write in British English please.
