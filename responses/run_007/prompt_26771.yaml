answer: |-
  ### (1) Diagnosis

  This structure is a rhetorically strategic deployment of **convergent argumentation**, modified to evade cumulative scrutiny. Logically, it posits independent premises where any single premise is sufficient for the conclusion ($A \vdash C$; $B \vdash C$; therefore $A \lor B \vdash C$). The structural peculiarity lies in the defensive maneuver: while the arguer often presents the premises cumulatively to suggest robustness, they defend them disjunctively under pressure. Unlike the **motte-and-bailey**, which retreats from a bold conclusion to a modest one, this structure maintains a bold conclusion while retreating between bold premises. Unlike **equivocation**, the terminology remains stable; the shift occurs in the *weight of justification*.

  The critical distinction is that standard convergent arguments invite cumulative scrutiny to increase confidence; premises share the load. Here, the arguer avoids joint scrutiny. By never defending the conjunction ($A \land B$), they evade the probability calculus that would govern the union of two uncertain claims. This specifically exploits the difference between additive and multiplicative probability. If the arguer claimed both premises must be true, the probabilities multiply (lowering confidence). By claiming either suffices, they add (raising confidence). But by rhetorically implying both are true, they gain the persuasive power of the conjunction without the probabilistic cost. The structure functions as a logically valid form exploited to insulate a conclusion from falsification: if one premise is falsified, the other is invoked not to add weight, but to sustain the original claim entirely. This creates an illusion of conjunctive strength with the safety net of disjunctive logic.

  ### (2) Boundary cases

  Consider a medical diagnosis: A doctor claims a patient has Disease X because of Symptom A and Symptom B. If Symptom A is explained away, the doctor insists Symptom B alone confirms X. This is legitimate **convergent reasoning** if medical literature confirms B is independently sufficient and the doctor transparently acknowledges this independence. It becomes problematic **disjunctive fortification** if the doctor initially implied both were necessary for certainty, yet retreats to B only when challenged, without adjusting the confidence level of the conclusion. 

  Conversely, consider **shifting ground**: if the doctor changes the diagnosis to Disease Y when Symptom A fails, that is a different error (moving the goalposts). The edge case lies in *explicit sufficiency*. If a climate scientist argues, "Models OR paleoclimate data show warming," acknowledging the disjunction, the argument is transparent. If they present both as mutually reinforcing evidence but defend only one when the other is debunked, without adjusting the confidence level of the conclusion, the structure becomes problematic. In the longtermism case, if the defender admitted "AI risk is low, so we rely solely on stakes," the urgency might diminish. By keeping both in play, they maintain maximum urgency. The boundary is whether the independence of support is disclosed or concealed to maintain unwarranted confidence.

  ### (3) Name and justification

  I propose **"Disjunctive Fortification."** Standard terms like "convergent arguments" describe the logic but miss the rhetorical strategy of using independence as a shield. "Motte-and-bailey" is incorrect because the conclusion does not retreat. "Disjunctive" captures the logical reliance on alternative sufficiency ($A \lor B \vdash C$), while "Fortification" describes the rhetorical effect: the position appears impregnable because it has multiple walls, even if each wall is individually fragile. This name distinguishes the structure from honest convergent argumentation by highlighting the defensive utility of the disjunction against joint scrutiny. It signals that the arguments are functioning less as pillars holding up a roof together, and more as separate escape routes from a sinking ship.
