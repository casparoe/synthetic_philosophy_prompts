  ok so ive been stuck on a decision for like a month and it's making me a little crazy. one option is a data-science job that pays really well and scratches the puzzle-solving itch, the other is a role at a small climate nonprofit where I actually believe in the work but the pay is rough and id have to move across the country away from my dad, who's not in great health. whenever I bring it up people say 'you cant compare apples and oranges,' and then act like that closes the case—just go with your gut. but I keep feeling like they're using the saying to mean there's no rational way to weigh the two options at all, not just that weighing them is hard. I want to know how far that analogy actually holds. can you give me a correspondence table—what maps to the apple, what maps to the orange, what 'comparing' maps to, what plays the role of the scale or the tastebuds—and then the places where the mapping breaks down? one thing I keep tripping on: apples and oranges are both fruit, both edible, both have a price, so in a literal sense you obviously can compare them. is that a disanalogy that matters for how people use the saying, or is it beside the point? and the part I actually care about: does the 'apples and oranges' move license the conclusion that there's no better or worse here and I should just pick, or does it only show something weaker? if the analogy is doing sneaky work, what would be a better analogy for whats actually going on when two options are hard to choose between?
