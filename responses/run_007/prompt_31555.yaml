prompt: |-
  I'm a forensic psychologist and I do violence risk assessments for a court two or three times a week, so the stakes are usually whether someone gets detained or released. The way I was trained, you pick an actuarial tool and it hands you a number — something like 'this person falls in a group with a 34% five-year reoffense rate.' But I've started noticing that the number changes alot depending on which tool I pick, or which population the tool was normed on, or how narrowly I slice the comparison group: all men with his diagnosis, all men with his age and prior record, everyone who scored in the same range, all first-time violent offenders. Each of those choices is defensible on its own, and they give wildly different probabilities, and I have to defend whatever I picked under cross-examination. A colleague keeps telling me to just pick the tool and report its number, but I've watched two experts come to opposite recommendations about the same man by slicing the comparison group differently. I gather this is what philosophers of probability call the reference class problem, but I don't know the literature.

  What I want is a decision procedure for choosing the reference class for an individual case, before I even get to the instrument: a checklist or ordered set of questions I can actually run in an afternoon, with what counts as a good enough answer to each, where the procedure stops with 'there is no defensible number' instead of forcing one, and where it stops with 'this is a values call, not a statistics call.' Then run it on two cases: (1) a 42-year-old man with a long history of alcohol-related assaults and a recent schizophrenia diagnosis, and (2) a 23-year-old with one group assault and no other record. Make sure at least one of the worked examples comes out in a way I'm not going to like — I want to see what the procedure actually costs me, not just where it confirms what I'd already do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Forensic psychologist conducting violence risk assessments for courts (2-3 times/week). High stakes (detention vs. release).
      *   **Problem:** The "Reference Class Problem." Different actuarial tools or different sub-groupings within tools yield wildly different probabilities (e.g., 34% vs. something else). Colleagues say "just pick one," but the user sees experts reaching opposite conclusions based on slicing data differently. Needs a defensible decision procedure.
      *   **Goal:** A decision procedure (checklist/ordered questions) for choosing a reference class *before* applying the instrument. It needs to allow for stopping at "no defensible number" or "this is a values call."
      *   **Requirement:** Run the procedure on two specific cases. At least one result must be uncomfortable/unexpected (showing the cost of the procedure).
      *   **Tone:** Professional, rigorous, pragmatic, acknowledging the philosophical underpinnings without getting bogged down in pure theory.

  2.  **Deconstruct the Reference Class Problem in Forensic Context:**
      *   *What is it?* Assigning a probability to a single case based on group data. Which group? (Reichenbach, Salmon, Hájek).
      *   *Forensic Reality:* Tools like VRAG, HCR-20, LS/CMI, STATIC-99 (though that's sexual) rely on specific norms.
      *   *The Tension:* Specificity (narrow class = more like the individual) vs. Stability (broad class = larger N, more reliable stats).
      *   *Legal/Ethical Duty:* Daubert/Frye standards (reliability, error rates), ethical codes (APA, specialty guidelines).

  3.  **Develop the Decision Procedure (The "Protocol"):**
      *   Needs to be step-by-step.
      *   Needs "Stop Rules" (when to bail out).
      *   Needs to distinguish statistical validity from ethical/legal judgment.
      *   *Drafting the Steps:*
          1.  *Instrument Validity:* Is the tool validated for *this* purpose and *this* population?
          2.  *Base Rate Alignment:* Does the tool's development base rate match the current context?
          3.  *Specificity vs. Stability:* Is the subgroup too small? (The "n < 30" rule of thumb).
          4.  *Dynamic vs. Static:* Are we ignoring changeable factors?
          5.  *The "Values" Check:* Is the difference between classes morally/legally significant?
          6.  *The "No Number" Stop:* When uncertainty exceeds utility.

  4.  **Refining the Procedure (Making it actionable):**
      *   Let's call it the **Reference Class Validity Protocol (RCVP)**.
      *   *Step 1: Instrument-Population Fit.* (Is the tool normed on people like this?)
      *   *Step 2: Base-Rate Transportability.* (Does the setting match?)
      *   *Step 3: The Specificity Threshold.* (Is the subgroup large enough to be stable?)
      *   *Step 4: The Divergence Check.* (Do different valid classes yield conflicting risk levels?)
      *   *Step 5: The Stop/Values Rule.* (If divergence is high, admit uncertainty or shift to risk *management* rather than risk *prediction*.)

  5.  **Developing the Case Studies:**
      *   **Case 1:** 42M, Alcohol-related assaults, Recent Schizophrenia dx.
          *   *Potential Classes:* General violent offenders, Mentally disordered offenders, Substance users, Schizophrenia specific.
          *   *Conflict:* Schizophrenia alone doesn't raise violence risk much without substances. Substance abuse raises it. Combined?
          *   *Desired Outcome:* Maybe this one shows that a specific number *cannot* be given confidently because the interaction effects are poorly normed. Or, it shows that the "Mental Illness" class is a red herring compared to the "Substance" class. Let's make this the one that *confirms* a number but requires dropping the diagnosis as a primary driver (which might be counter-intuitive to a clinician focused on psychopathology).
      *   **Case 2:** 23M, One group assault, No other record.
          *   *Potential Classes:* General population, First-time offenders, Gang-related (implied by "group"), Young males.
          *   *Conflict:* General recidivism for young males is high. First-time offenders is low. "Group assault" implies situational vs. predatory.
          *   *Desired Outcome:* This should be the "uncomfortable" one. The procedure should force the psychologist to admit *no defensible number exists* because the "first-time" class is too heterogeneous and the "young male" class is too broad, and the specific act is ambiguous. This costs the user the ability to give a clean percentage to the court.

      *Wait, let's swap.* The prompt asks for "at least one... in a way I'm not going to like."
      *   *Case 1 (Schizophrenia/Alcohol):* Clinicians often over-weight mental illness. The procedure should force them to acknowledge that the *alcohol* class is the statistically valid one, and the schizophrenia class is noise. This might be uncomfortable if they believe the psychosis drives the risk.
      *   *Case 2 (Young/One Offense):* This is the classic "low base rate" problem. Predicting rare events in low-risk groups is statistically fraught. The procedure should likely conclude "No defensible number." This is uncomfortable because the court wants a number.

      *Decision:* Let's make Case 2 the "No Number" outcome. That is the highest cost. Case 1 can be the "Values Call" or the "Pick the Substance Class" outcome. Actually, let's make Case 1 the "Values Call" (treatment vs. detention) and Case 2 the "No Number."
      *   *Re-evaluating Case 1:* A 42-year-old with long history of alcohol assaults + recent schizophrenia.
          *   *Reference Class A:* Violent offenders with substance use (High risk).
          *   *Reference Class B:* Schizophrenia patients (Low risk relative to substance users).
          *   *Reference Class C:* Older first-time violent offenders (doesn't fit history).
          *   *Procedure Outcome:* The procedure should dictate prioritizing the *historical violence + substance* class over the *diagnosis* class because the predictive validity of substance + history is higher than diagnosis alone. This might be annoying if the clinician thinks the psychosis is the key.
      *   *Re-evaluating Case 2:* 23-year-old, one group assault, no record.
          *   *Reference Class A:* Males 18-25 (High general violence rate).
          *   *Reference Class B:* First-time violent offenders (Low recidivism).
          *   *Reference Class C:* Gang-affiliated (Unknown, but implied).
          *   *Procedure Outcome:* The divergence between Class A and Class B is too high, and the sample size for "One group assault, no prior, specific demographic" is too small for stability. Result: **No defensible number.** This is the "cost."

  6.  **Drafting the Content:**
      *   **Introduction:** Validate the user's concern. Acknowledge the Reference Class Problem (Hájek, Salmon).
      *   **The Protocol:** Create the **Forensic Reference Class Selection Protocol (FRCSP)**.
          *   Include "Stop Rules."
          *   Include "Values Flag."
      *   **Case 1 Application:** Show the trade-off (Substance > Diagnosis).
      *   **Case 2 Application:** Show the hard stop (No Number).
      *   **Cross-Examination Prep:** How to defend the *process* rather than just the *number*.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but keep the philosophical rigor.
      *   Be direct about the limitations.
      *   Ensure the "uncomfortable" outcome feels real (i.e., telling a judge "I can't give you a probability" is risky for the expert's credibility, but ethically necessary).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "values call" requirement? Yes, need to ensure the protocol identifies when the choice of class changes the outcome enough that it becomes a policy decision (detain vs. release) rather than a statistical one.
      *   *Check:* Is the procedure runnable in an afternoon? It needs to be concise.
      *   *Check:* Did I cite the literature? Mention Hájek, Salmon, and forensic specific lit (e.g., Hart, Kropp, or more philosophical forensic ethics).
      *   *Check:* Is the "uncomfortable" outcome truly uncomfortable? Telling a court you can't assess risk is career-risky. I need to frame it as "Defensible Uncertainty."

  9.  **Final Polish:** Ensure the distinction between *actuarial tools* and *reference classes* is clear. The tool provides the class; the psychologist chooses the tool/class. The protocol guides that choice.

  *(Self-Correction on Case 1)*: If I make Case 1 about Substance > Diagnosis, that's clinically standard now (violence risk is more tied to substance/history than diagnosis). That might not be *that* uncomfortable.
  *(Idea)*: What if Case 1 forces the psychologist to use a tool normed on a population they dislike (e.g., general prisoners vs. psychiatric patients) because it's more valid?
  *(Better Idea)*: Let's stick with the Substance vs. Diagnosis tension. It's uncomfortable because the clinician's training emphasizes the psychopathology, but the stats emphasize the behavior/substance.
  *(Case 2)*: The "No Number" outcome is the real kicker.

