answer: |-
  Your hypothesis is astute, and it resonates with a growing meta-philosophical consensus regarding the "problem of promising." You have correctly identified that the stalemate is not merely a failure of imagination but a structural feature of the debate. However, I would refine your diagnosis slightly: the camps are not *merely* talking past each other (which would imply a verbal disagreement), nor are they engaged in a straightforward substantive disagreement about a single shared object.

  Rather, the impasse arises because the debate is simultaneously **conceptual**, **normative**, and **metaphysical**, and the participants disagree on which of these dimensions is primary.

  Here is a diagnosis of the disagreement, an analysis of why the counterexample strategy fails to resolve it, and a proposal for what actual progress would look like.

  ### 1. The Diagnosis: A Dispute Over Explanatory Priority (Grounding)

  Your hypothesis suggests the three camps are answering different questions. I would argue they are answering the *same* question ("What grounds promissory obligation?") but operating with incompatible **constraints on explanation**.

  *   **The Practice Theorist** assumes that normativity is essentially social. For them, a "promise" without a background convention is not just unbinding; it is conceptually incoherent (like moving a knight diagonally in chess without the rules of chess).
  *   **The Will Theorist** assumes that normativity is essentially agential. For them, if a social practice is required to bind me, my autonomy is heteronomous (subject to external law). True obligation must spring from the self.
  *   **The Expectation Theorist** assumes that normativity is essentially relational/harm-based. For them, obligation must be reducible to broader moral principles (like non-maleficence) to avoid mysticism.

  The disagreement is not just about *which* mechanism binds, but about **Explanatory Monism**. Each camp assumes there must be a *single* fundamental source of promissory obligation.
  *   If you are a Will theorist, you view the Practice account as *mistaken* because it locates the source outside the agent.
  *   If you are a Practice theorist, you view the Will account as *mystical* because it posits a normative power without a social medium.

  Therefore, the disagreement is **foundational**. It is a clash of normative metaphysics. They are not talking past each other; they are fighting for jurisdiction over the same territory using different maps.

  ### 2. Why Counterexamples Don't Work (The "Protective Belt" Problem)

  You noted that each side handles counterexamples by adding refinements. In Lakatosian terms, each research program has a "hard core" (the source of obligation) and a "protective belt" (auxiliary hypotheses to handle cases).

  The reason counterexamples fail to kill the theories is that **each theory treats the rival's counterexamples as category errors.**

  *   **The Solitary Promise:** The Will theorist uses the "solitary promise" (Robinson Crusoe promising God, or a promise made in a normative vacuum) to refute the Practice theorist. The Practice theorist responds by saying, "That isn't a promise; it's a vow or an intention. You've changed the subject."
  *   **The Harmless Breach:** The Expectation theorist uses a case where a promise is broken but no reliance/harm occurs to refute the Expectation account. The Will theorist responds, "Exactly, obligation is distinct from harm." The Expectation theorist responds, "Then your obligation is fetishistic."

  The impasse persists because there is no neutral arbiter for what counts as a "paradigm case."
  *   For the **Will** theorist, the paradigm is the **solemn vow** (high agency, low social context).
  *   For the **Practice** theorist, the paradigm is the **social contract** (high convention, coordinated expectation).
  *   For the **Expectation** theorist, the paradigm is the **reliance scenario** (induced expectation, potential harm).

  Because they disagree on the *extension* of the concept "promise" in borderline cases, empirical or intuitional data (cases) cannot settle the dispute. The data is theory-laden.

  ### 3. Is the Question Ill-Posed?

  You ask if we should expect the impasse to persist because the question is ill-posed. **Yes, but with a specific caveat.**

  The question "Why do promises bind?" presupposes **Normative Monism**. It assumes there is *one* "because" that completes the sentence.
  *   "Promises bind *because*..." (fill in the blank).

  If promissory obligation is actually **overdetermined** or **pluralistic**, the search for a single ground is a category mistake. It is possible that:
  1.  The **Will** creates the *possibility* of the obligation (normative power).
  2.  The **Practice** provides the *content* and *recognition* of the obligation (conventional rules).
  3.  The **Expectation** provides the *moral force* or *reason for compliance* in specific contexts (harm prevention).

  If this is true, the debate is stuck because each side is trying to reduce the other two dimensions to their own. The Will theorist tries to derive convention from will; the Practice theorist tries to derive will from convention.

  ### 4. What Would Count as Progress?

  Given this diagnosis, standard moves (new cases, refined definitions) will not work. Progress requires a shift in the meta-normative framework. Here are three viable paths:

  **A. Hierarchical Integration (The Scanlonian Move)**
  T.M. Scanlon's *Principle F* attempt is the most famous effort here. He tries to ground promising in a broader principle of fidelity (expectations) without reducing it to mere reliance. Progress here looks like showing how one ground (e.g., Will) is *necessary* but not *sufficient*, requiring a second ground (e.g., Practice) to complete it.
  *   *Success Condition:* A hybrid account that explains why the "solitary promise" feels different from the "social promise" without positing two different words.

  **B. Normative Pluralism (The "Cluster Concept" Move)**
  This approach accepts your hypothesis fully. It argues that "promising" is a cluster concept where different elements bind in different contexts. In legal contexts, the Practice/Convention element dominates. In intimate relationships, the Will/Expectation element dominates.
  *   *Success Condition:* Abandoning the search for a "Theory of Promising" in favor of a "Taxonomy of Commitment." This dissolves the impasse by denying the unity of the subject matter.

  **C. Meta-Ethical Resolution (The "Constructivist" Move)**
  The debate might only be resolvable by settling broader meta-ethical questions.
  *   If you are a **Naturalist**, the Expectation account wins (obligations must reduce to natural facts like harm).
  *   If you are a **Non-Naturalist/Realist**, the Will account becomes more viable (normative powers are real properties).
  *   If you are a **Constructivist**, the Practice account wins (obligations are constructed by rational agents in community).
  *   *Success Condition:* Progress in the philosophy of promising is currently bottlenecked by progress in meta-ethics. We cannot know why promises bind until we know what *any* obligation is.

  ### 5. Conclusion: The "Feature, Not Bug" Verdict

  You are right to suspect this is a feature of the debate. The literature on promising has become a proxy war for broader disagreements in moral philosophy.

  *   **The Disagreement:** It is a substantive disagreement about **Normative Grounding**, disguised as a conceptual disagreement about **Definition**.
  *   **The Impasse:** It persists because the participants are **Explanatory Monists** fighting over a **Pluralistic Phenomenon**.
  *   **The Path Forward:** The most promising (pun intended) route is to stop asking "Which theory is correct?" and start asking "Under what conditions does each mechanism become the primary source of obligation?"

  If you are writing on this, I suggest focusing on the **metaphysics of normative powers**. The Will theorist's biggest hurdle is explaining how a mental act changes the normative landscape. The Practice theorist's biggest hurdle is explaining how a convention generates *moral* (not just club-rule) obligations. The Expectation theorist's hurdle is explaining the "binding" nature distinct from general beneficence.

  The impasse will likely persist as long as philosophers demand a **reductive** account. If you can argue that promising is a **sui generis** normative practice that *involves* will, practice, and expectation without being *reducible* to any one of them, you may break the deadlock. That is the distinction that counts.
