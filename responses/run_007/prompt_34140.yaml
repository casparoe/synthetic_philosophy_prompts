  # JOINT STATEMENT ON THE ONTOLOGY AND AESTHETICS OF MUSIC
  **Prepared by:** The Schopenhauerian Working Group & The Hanslickian Formalist Working Group
  **Date:** After one year of adversarial collaboration

  ## I. JOINT CLAIMS
  *The following propositions are affirmed by both parties. Wording has been negotiated to ensure neutrality regarding metaphysical commitments or reductionist physicalism.*

  1.  **Distinctness of Medium:** Music operates according to principles of organization distinct from those of language, visual representation, or discursive logic. Its primary material is temporal sound structure.
  2.  **Non-Conceptual Comprehension:** A listener can fully grasp the aesthetic significance of a musical work without the mediation of definite concepts, images, or linguistic labels.
  3.  **Structural-Affective Correlation:** There exists a robust, non-arbitrary correlation between specific musical structures (e.g., harmonic tension, rhythmic density, melodic contour) and specific human affective states (e.g., agitation, calm, striving, resolution).
  4.  **Intrinsic Value:** The value of a musical work is intrinsic to the experience of the work itself and is not dependent on its utility for external purposes (e.g., religious ritual, background entertainment, or moral instruction).
  5.  **Universality of Capacity:** The capacity to be moved by music is a human universal, though the specific codes and structures utilized vary across cultures and historical periods.
  6.  **Inadequacy of Translation:** No verbal description can fully substitute for the experience of hearing the music itself; the music says something that cannot be said in words.

  ***

  ## II. DISAGREEMENTS TABLE
  *Where the joint claims end, the interpretation of *why* they hold begins. The following table isolates the remaining substantive divergences.*

  | Point of Disagreement | Schopenhauerian Formulation | Hanslickian Formalist Formulation | Neutral Statement of Stake |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Status of Content** | Music is a **direct copy of the Will**. It reveals the inner nature of the world (the thing-in-itself) bypassing the veil of phenomena (Ideas). | Music's content is **tonally moving forms**. It creates an autonomous aesthetic object with no reference to extra-musical reality. | Is music's content *metaphysical* (revealing reality's essence) or *autonomous* (creating a self-contained reality)? |
  | **2. The Role of Emotion** | Emotion is the **recognition** of the Will within the listener. Music makes us feel the essence of striving, suffering, and satisfaction directly. | Emotion is a **physiological/psychological effect** caused by form. It is a side-effect (pathological), not the aesthetic object itself. | Is feeling the *means of understanding* the music (Schopenhauer) or a *consequence* of processing the music (Hanslick)? |
  | **3. Explanation of Depth** | Music's profound impact is explained by its **metaphysical proximity** to the listener's own core being (the Will). | Music's profound impact is explained by the **complexity and perfection** of its internal logical relations. | Does "depth" require a metaphysical anchor, or is it a function of structural complexity and cognitive engagement? |
  | **4. Specificity of Meaning** | Music parallels the **grades of the Will's objectification**. Bass corresponds to inorganic nature; melody to intellectual striving. | Music parallels **dynamic patterns of motion**. Any association with "nature" or "intellect" is poetic projection by the listener. | Does the hierarchy of musical voices map onto a hierarchy of reality, or is it merely a hierarchy of auditory attention? |

  ***

  ## III. CRUXES AND EVIDENTIARY TESTS
  *These are the sub-questions on which at least one side acknowledges their position would be weakened or strengthened by specific evidence. Both parties agree these tests are relevant.*

  ### Crux 1: The "Specific Emotion" Discrimination Test
  *   **The Question:** Can instrumental music convey *specific* emotions (e.g., "jealousy" vs. "hope") reliably enough to suggest inherent content, or only *dynamic* categories (e.g., "agitated" vs. "calm")?
  *   **The Test:** A large-scale, cross-cultural listening study. Participants are given a list of 50 specific emotional concepts and 50 dynamic descriptors. They listen to 100 excerpts of unknown instrumental music. They must match the excerpt to the list.
  *   **Schopenhauerian Prediction:** Listeners will converge significantly on specific emotional concepts (e.g., "longing," "triumph") beyond mere dynamics, because the Will manifests in specific strivings.
  *   **Formalist Prediction:** Listeners will converge only on dynamic descriptors (e.g., "fast," "tense," "loud"). Agreement on specific concepts will be no better than chance, proving specific emotions are projected, not contained.
  *   **Stakes:** If Formalists are right, Schopenhauer's claim that music copies the *specific* grades of the Will is weakened. If Schopenhauerians are right, Hanslick's claim that music contains only "form" is weakened.

  ### Crux 2: The "Perfect Form/Zero Affect" Case
  *   **The Question:** Is it possible to construct music that is formally perfect (complex, coherent, novel) but generates zero affective resonance? If so, is it still "great music"?
  *   **The Test:** Algorithmic composition using strict generative rules to create structurally flawless works that are vetted by theorists for coherence but tested on listeners for "chills" or emotional engagement (which are absent).
  *   **Schopenhauerian Prediction:** Such works will be judged as "dead" or "hollow." Without the connection to the Will, formal perfection is insufficient for aesthetic value.
  *   **Formalist Prediction:** Such works can still be judged as "beautiful" by experts, even if they do not arouse strong emotion. Aesthetic beauty resides in the apprehension of the form, not the arousal of feeling.
  *   **Stakes:** This tests whether "beauty" is separable from "affective power." Schopenhauer binds them; Hanslick separates them.

  ### Crux 3: The Neuroaesthetics of "The Sublime"
  *   **The Question:** When listeners report the deepest musical experiences (the "sublime" or "transcendent"), does neural imaging show activity consistent with *pattern recognition* or with *primitive drive states*?
  *   **The Test:** fMRI studies comparing brain activity during "formal analysis" tasks vs. "deep immersion" tasks.
  *   **Schopenhauerian Prediction:** Deep immersion will light up areas associated with primal drives, motor planning, and limbic systems (the biological seat of the Will), bypassing higher-order cognitive processing.
  *   **Formalist Prediction:** Even deep immersion will show heightened activity in areas associated with complex pattern prediction, syntax processing, and temporal integration (the cognitive seat of Form).
  *   **Stakes:** If the "deep move" is purely cognitive/predictive, the metaphysical "Will" becomes an unnecessary hypothesis (Occam's Razor). If it is primal/pre-cognitive, Formalism struggles to explain why *syntax* triggers *drive*.

  ***

  ## IV. COMMITMENT AND ANALYSIS
  *Following the collaboration, the facilitators offer the following adjudication on the state of the dispute.*

  **1. On Verbal Disputes**
  A significant portion of the disagreement regarding **Emotion (Point 2 in Table)** is verbal.
  *   **Diagnosis:** Hanslick defines "aesthetic content" narrowly as *that which can be analyzed in the score*. Schopenhauer defines "content" broadly as *that which is experienced in the listening*.
  *   **Resolution:** When Hanslick says "Music does not represent emotions," he means "Music does not contain the *concept* of an emotion." When Schopenhauer says "Music represents the Will," he means "Music induces the *feeling* of volition."
  *   **Verdict:** Once this distinction is made, the Formalist position is revealed to be a methodological constraint (study the score), while the Schopenhauerian position is a phenomenological claim (study the experience). They are not strictly contradictory, but they talk past one another.

  **2. On Explanatory Power**
  The Schopenhauerian holds the better argument regarding the **intensity** of musical experience; the Formalist holds the better argument regarding **methodology**.
  *   **Why Schopenhauer wins on Intensity:** Formalism struggles to explain why a resolved cadence feels like *relief* rather than just *completion*. To say "it is a convention" is insufficient; the physicality of musical tension (dissonance requiring resolution) mirrors biological tension. Schopenhauer's "Will" is a robust metaphor for this pre-reflective, bodily engagement that Formalism often dismisses as "pathological."
  *   **Why Hanslick wins on Methodology:** Schopenhauer's metaphysics are unfalsifiable. To claim music is a "copy of the Will" relies on accepting Schopenhauer's entire philosophical system (Platonic Ideas, the noumenal Will). If one rejects his metaphysics, his aesthetics collapse. Hanslick's claim ("Music is tonal form") requires no metaphysical commitment. It is empirically grounded in the audible object.

  **3. Final Adjudication**
  The Formalist position is **philosophically safer**, but the Schopenhauerian position is **phenomenologically richer**.
  *   **Recommendation:** The dispute cannot be resolved without abandoning one side's foundational premises. However, the Schopenhauerian claim that music "bypasses concepts" is the strongest point of convergence.
  *   **Critical Weakness:** The Schopenhauerian view is vulnerable to **Occam's Razor**. If cognitive science can explain the "deep move" of music through predictive processing and embodied cognition (as suggested in Crux 3), the metaphysical "Will" becomes a redundant entity. The Formalist should concede that form is *embodied*, not abstract. The Schopenhauerian should concede that the "Will" is a *metaphor* for human psychology, not a cosmological truth.

  **Signed:**
  *The Schopenhauerian Working Group*
  *The Hanslickian Formalist Working Group*
