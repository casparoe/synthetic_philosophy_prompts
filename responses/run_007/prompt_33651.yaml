prompt: |-
  So I've been going through my late grandfather's papers and found a little stash of old Irish banknotes along with a notebook where he'd copied out questions from Berkeley's Querist about money, and I fell down a rabbit hole. Berkeley was arguing, way back, that money isn't real wealth in itself — it's more like a record or token for moving around claims on a community's actual productive work, and he wanted Ireland to have its own paper currency instead of sitting there with the gold drained out of the country. The whole thing got under my skin because I'm currently trying to decide wheter to put some savings into Bitcoin, and my uncle, a gold bug, keeps telling me crypto is fake because it isn't backed by anything physical, which sounds like exactly the attitude Berkeley was pushing against, except maybe flipped.

  Here's what I'd love to work through. If Berkeley were alive today, what would he likely make of Bitcoin, and would a central bank digital currency be closer to or further from what he was actually after? On one hand, Bitcoin seems like the logical endpoint of the idea that money is just a token rather than a commodity. On the other hand, Berkeley wanted money to circulate so it would stimulate domestic industry and employment, and people mostly sit on Bitcoin as a store of value, which sounds a lot like the hoarding he hated. Which strand is more central to his actual position, and how much of this is me projecting modern categories onto someone writing about 1730s Ireland?

  You're a historian of philosophy who specializes in Berkeley and early modern monetary thought. Think carefully and don't just pattern-match to the idea that Berkeley would like fiat money. Maybe start by brainstorming the distinct commitments in his position, then reconstruct what he'd say about crypto and CBDCs, and flag clearly where you're going beyond what his actual texts support.
