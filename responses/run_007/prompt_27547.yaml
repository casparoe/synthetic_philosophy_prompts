prompt: |-
  I write about biology and the philosophy of science for a general-interest magazine, and I am preparing a feature on why the species count keeps shifting — why a single population of birds or orchids gets split into three species and then re-lumped, and why two competent systematists can disagree about where one species ends and another begins without either having made a factual error. Before I present the rival species concepts to my readers, I want the specification first: what would any adequate account of what a species is have to deliver in order to count as adequate at all, where the point of the account is to let an intelligent nonspecialist understand what taxonomists are doing and why their classifications change.

  Produce the desiderata list. It should include the cases an adequate account must handle honestly — asexual and parthenogenetic lineages, ring species, hybrid zones and introgression, fossil chronospecies for which only morphology survives, bacteria and archaea with horizontal gene transfer, and populations too poorly studied for breeding or genomic data — and the phenomena it must explain rather than explain away, such as why some groups form discrete-looking clusters while others grade into one another. It should include the distinctions the account may not collapse: between the species category and a particular species taxon, between a diagnostic trait and the thing being diagnosed, and between a species being real and a species being a convenient unit. It should include the results from evolutionary biology it cannot contradict, such as population thinking, gene flow, and incomplete lineage sorting. For each desideratum, give the case or consideration that makes it a requirement rather than a preference.

  Then mark which requirements are non-negotiable and which are commitments of a particular school; flag any subsets that look jointly unsatisfiable, and say whether that forces pluralism about species concepts or a more deflationary conclusion; and identify the single requirement that does the most work in excluding the familiar candidates. A sentence or two on how each major contender fares against the list is welcome, but keep the weight on the criteria and their motivating cases.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Target Audience:** General-interest magazine readers (intelligent nonspecialists).
      *   **Author's Goal:** Explain *why* species counts shift and why competent experts disagree without error (prior to explaining specific concepts).
      *   **Task:** Produce a list of *desiderata* (requirements) for an adequate account of "what a species is."
      *   **Specific Content Requirements:**
          *   Handle specific hard cases (asexuals, ring species, hybrids, fossils, microbes, data-poor populations).
          *   Explain phenomena (discrete clusters vs. gradation).
          *   Maintain specific distinctions (category vs. taxon, trait vs. thing, real vs. convenient).
          *   Align with evolutionary biology results (population thinking, gene flow, ILS).
          *   For each desideratum: Provide the motivating case/consideration.
          *   **Analysis:** Mark non-negotiable vs. school-specific commitments. Flag jointly unsatisfiable subsets. Discuss implications for pluralism vs. deflationism. Identify the single most exclusionary requirement.
          *   **Brief Evaluation:** Briefly note how major contenders (BSC, PSC, etc.) fare.
      *   **Tone:** Philosophical but accessible, rigorous, precise.

  2.  **Deconstruct the "Species Problem":**
      *   The core issue is that "species" is used to do too many jobs at once (unit of evolution, unit of classification, unit of conservation, unit of reproduction).
      *   An "adequate account" for a *general audience* needs to explain the *instability* of the count, not necessarily solve the metaphysical problem once and for all (though it must be metaphysically sound enough not to mislead).
      *   The prompt asks for the *specification* of what an account must deliver *before* presenting rival concepts. This is a meta-philosophical task.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Empirical Coverage.* Must handle the hard cases listed in the prompt.
          *   *Motivation:* If a definition works for birds but fails for bacteria, it's not a general account of life.
      *   *Requirement 2: Explaining Discontinuity.* Why do we see clusters at all?
          *   *Motivation:* If evolution is gradual, why aren't all intermediates present?
      *   *Requirement 3: Distinctions.* Category vs. Taxon.
          *   *Motivation:* Confusing "Specieshood" with "Homo sapiens" leads to category errors.
      *   *Requirement 4: Realism vs. Instrumentalism.*
          *   *Motivation:* Are we discovering joints of nature or drawing lines on a map?
      *   *Requirement 5: Evolutionary Consistency.* Population thinking, gene flow.
          *   *Motivation:* Cannot contradict the mechanism that produces species.
      *   *Requirement 6: Operationalizability.*
          *   *Motivation:* Taxonomists need to actually identify them in the field/lab.

      *Refining based on prompt constraints:* The prompt specifically asks to include distinctions (category/taxon, trait/thing, real/convenient) and specific cases (asexuals, ring species, etc.). I need to make sure these are explicit desiderata.

  4.  **Structuring the List:**
      *   Group into logical categories (Empirical Scope, Metaphysical/Conceptual Clarity, Evolutionary Consistency).
      *   Ensure each has the "Case/Consideration" as requested.

  5.  **Analyzing Constraints & Conflicts (The "Marking" Phase):**
      *   *Non-negotiable:* Must not contradict established evolutionary theory (e.g., variation exists). Must handle the distinction between the concept and the instance.
      *   *School-specific:* "Reproductively isolated" is BSC-specific. "Monophyletic" is Phylogenetic-specific.
      *   *Jointly Unsatisfiable:* This is the crux. You generally cannot have a single definition that handles sexual vertebrates (BSC works well) AND asexual bacteria (BSC fails) AND fossils (BSC impossible) while maintaining strict discreteness (which evolution often violates).
      *   *Implication:* This points strongly toward **Pluralism** (different concepts for different jobs) or **Deflationism** (species aren't natural kinds in the strict sense).
      *   *Most Exclusionary Requirement:* Likely the demand to handle *both* sexual and asexual organisms with a single criterion of cohesion, or the demand for discreteness in the face of gradualism. Let's pick the "Universal Applicability across Reproductive Modes" as the biggest filter.

  6.  **Drafting the Content (incorporating specific prompt instructions):**

      *   *Intro:* Set the stage.
      *   *The List:* Numbered, bold headers, specific motivating cases.
      *   *The Analysis:* Non-negotiable vs. Contingent. The "Trilemma" or conflict. Pluralism conclusion.
      *   *The Exclusionary Requirement:* Identify it clearly.
      *   *Contender Scorecard:* Brief summary of BSC, PSC, Ecological, etc.

  7.  **Refining the Tone:**
      *   Avoid overly dense jargon where possible, but maintain philosophical precision (e.g., using "taxon" vs "category" correctly).
      *   Ensure the distinction between "what species *are*" (ontology) and "how we *identify* them" (epistemology) is clear, as this is often where the confusion lies for readers.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include horizontal gene transfer? Yes, under microbes.
      *   *Check:* Did I include the distinction between diagnostic trait and the thing? Yes.
      *   *Check:* Did I explain *why* counts shift? The desiderata should hint that no single account satisfies all conditions simultaneously, leading to shifts as emphasis changes.
      *   *Check:* Is the "Non-negotiable" marking clear? I will use a specific notation or section.
      *   *Check:* Did I identify the single requirement doing the most work? I need to be decisive here. The "Universality" requirement is usually the killer.

  9.  **Final Polish:** Check against the "intelligent nonspecialist" constraint. The language should be crisp, like a high-end magazine feature (e.g., *Aeon*, *Nautilus*, *The Atlantic*).

  *(Self-Correction on the "Single Requirement"):* The prompt asks for the requirement that excludes familiar candidates. The requirement that "A single criterion must apply to all life forms" is what kills the Biological Species Concept. The requirement that "Species must be discrete" kills strict gradualism. I will argue that the requirement for **Universal Operationalizability across Divergent Evolutionary Mechanisms** is the hardest hurdle.

  *(Self-Correction on Pluralism):* I need to be careful not to solve the problem, but to show why the desiderata *force* the pluralism conclusion.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Specifications for an Adequate Account of "Species"

  To serve a general readership, an account of the species category must do more than define a term; it must explain the *instability* of the term without implying incompetence on the part of scientists. It must clarify why the map (classification) changes even when the territory (nature) remains constant. The following desiderata specify what such an account must deliver to be considered adequate.

  #### I. Empirical Scope and Hard Cases
  An adequate account must not retreat to "model organisms" when confronted with biological diversity that violates standard assumptions.

  1.  **Reproductive Mode Neutrality**
      *   **Requirement:** The account must apply to sexually reproducing vertebrates, asexual lineages (parthenogenetic lizards, dandelions), and organisms with mixed mating systems without resorting to ad-hoc exceptions.
      *   **Motivating Case:** The Biological Species Concept (BSC) defines species by interbreeding. This renders all asexual organisms "species-less" or forces the absurd conclusion that every asexual individual is its own species. An adequate account must explain how lineage continuity functions without sex.
  2.  **Temporal Depth (The Fossil Constraint)**
      *   **Requirement:** The account must provide criteria for individuating units in the fossil record where behavior, genetics, and breeding compatibility are inaccessible.
      *   **Motivating Case:** *Chronospecies*. A lineage of trilobites changes morphology over five million years. Where does one species end and the next begin? If an account relies on contemporary gene flow, it cannot classify the past, rendering paleontology conceptually disjoint from neontology.
  3.  **Microbial and Horizontal Reality**
      *   **Requirement:** The account must accommodate lineages where vertical descent is complicated by horizontal gene transfer (HGT).
      *   **Motivating Case:** Bacteria and Archaea. In prokaryotes, genes often move laterally between distinct lineages. An account insisting on strict tree-like divergence (cladogenesis) misrepresents the web-like reality of microbial evolution.
  4.  **Data-Poor Tolerance**
      *   **Requirement:** The account must allow for the provisional assignment of species status in the absence of genomic or breeding data.
      *   **Motivating Case:** Cryptic diversity in the tropics. We cannot wait for breeding experiments on every beetle. An account that requires proof of reproductive isolation before granting species status halts conservation and cataloging efforts.

  #### II. Phenomenological Honesty
  The account must explain the patterns we see, not explain them away as illusions.

  5.  **The Cluster Explanation**
      *   **Requirement:** The account must explain why organisms often group into discrete morphological or genetic clusters rather than forming a continuous smear of variation.
      *   **Motivating Case:** Why are there gaps between lions and tigers in the wild? If evolution is gradual, distinct clusters require an explanation (e.g., stabilizing selection, reproductive barriers), not just an assertion of difference.
  6.  **The Gradation Explanation**
      *   **Requirement:** The account must equally explain why, in other cases, boundaries dissolve into gradients.
      *   **Motivating Case:** Ring species (e.g., *Ensatina* salamanders) and hybrid zones. If species are discrete natural kinds, hybrid zones should be rare anomalies. An adequate account must treat introgression as a feature of the system, not a failure of classification.

  #### III. Conceptual Distinctions
  The account must maintain logical boundaries between related but distinct ideas.

  7.  **Category vs. Taxon**
      *   **Requirement:** The account must distinguish between the *species category* (the rank or status) and a *species taxon* (a specific group, e.g., *Canis lupus*).
      *   **Motivating Case:** Confusing the two leads to the error of thinking "Species" is a physical object like a rock, rather than a status assigned to a population. We must understand what it means to *be* a species before listing *which* groups are species.
  8.  **Diagnosis vs. Ontology**
      *   **Requirement:** The account must distinguish between the *diagnostic trait* used to identify a species (e.g., wing color) and the *underlying reality* that makes it a species (e.g., reproductive isolation).
      *   **Motivating Case:** Two birds may look identical (cryptic species) but be distinct biologically, or look different (morphs) but be one species. An account that equates the marker with the thing fails when the marker evolves faster than the underlying separation.
  9.  **Reality vs. Convenience**
      *   **Requirement:** The account must specify whether species are discovered (mind-independent natural kinds) or imposed (heuristic units for human convenience).
      *   **Motivating Case:** Conservation law. If species are merely convenient units, protecting a "species" is arbitrary. If they are real evolutionary units, their loss represents a distinct ontological loss. The account cannot remain agnostic here without misleading policy implications.

  #### IV. Evolutionary Consistency
  The account cannot contradict the mechanisms known to produce biological diversity.

  10. **Population Thinking**
      *   **Requirement:** The account must treat variation within a group as fundamental, not as noise obscuring a "type."
      *   **Motivating Case:** Essentialism. Pre-Darwinian views held that species had a fixed essence. An adequate account must accommodate the fact that no single individual possesses all the traits of the species.
  11. **Process Compatibility**
      *   **Requirement:** The account must be consistent with gene flow, incomplete lineage sorting, and the time-lag between divergence and diagnosability.
      *   **Motivating Case:** Incipient speciation. Two populations may be diverging but still exchange genes. An account demanding complete isolation denies the existence of speciation *in process*; an account allowing total flow denies the existence of separate species.

  ***

  ### Analysis of Requirements

  #### Non-Negotiable vs. School-Specific Commitments
  *   **Non-Negotiable:** Requirements **1, 7, 8, 10, and 11** are non-negotiable. Any account that contradicts population thinking (10) or collapses the distinction between a trait and the entity (8) is scientifically obsolete or logically incoherent. Requirement 1 (Reproductive Mode Neutrality) is non-negotiable for a *general* account of life, though specific sub-disciplines may waive it.
  *   **School-Specific:** Requirement **5** (The Cluster Explanation) is often a commitment of Realist schools (who argue clusters prove reality), whereas Deflationists might argue clusters are ephemeral. Requirement **9** (Reality vs. Convenience) is the primary fault line between Species Realists and Nominalists.

  #### Jointly Unsatisfiable Subsets
  There is a tension, if not a contradiction, between **Requirement 1 (Universality)**, **Requirement 5 (Discreteness)**, and **Requirement 11 (Process Compatibility)**.
  *   **The Conflict:** Evolution is a continuous process (11), yet we observe discrete clusters (5). However, the mechanisms creating clusters in sexual vertebrates (reproductive isolation) do not apply to bacteria (1).
  *   **The Implication:** You cannot satisfy Universality, Discreteness, and Process Compatibility simultaneously with a *single* criterion. If you demand a single criterion (Monism), you must deny the reality of one of these biological domains.

  #### Pluralism or Deflationism?
  This conflict forces a choice.
  *   **Pluralism:** Accept that "species" refers to different things in different contexts (e.g., reproductive communities in animals, monophyletic lineages in bacteria). This satisfies the empirical scope but sacrifices the unity of the concept.
  *   **Deflationism:** Argue that "species" is not a natural kind at all, but a pragmatic cutoff point on a continuum. This satisfies Process Compatibility but weakens the "Reality" requirement (9).
  *   **Conclusion:** For a general-interest explanation of *why counts shift*, **Pluralism** is the stronger fit. It explains why ornithologists (using BSC) and bacteriologists (using genetic divergence) disagree: they are carving nature at different joints because the bone structure differs.

  #### The Single Most Exclusionary Requirement
  **Requirement 1 (Reproductive Mode Neutrality)** does the most work in excluding familiar candidates.
  *   **Why:** The **Biological Species Concept (BSC)**, the most famous and intuitive definition for the public, fails this requirement immediately. It cannot handle asexuals, fossils, or hybrids without major contortions. By insisting that an adequate account must handle *all* life, the BSC is relegated from a "definition of species" to a "definition of sexually reproducing species."

  ***

  ### Brief Scorecard of Major Contenders

  *   **Biological Species Concept (BSC):** Fails **Req 1, 2, 3**. Excellent at explaining **Req 5** (clusters in animals) and **Req 11** (gene flow), but collapses when sex is removed. Best for explaining why birders care about breeding, worst for explaining why microbiologists disagree.
  *   **Phylogenetic Species Concept (PSC):** Satisfies **Req 1, 2, 3** (works on fossils and asexuals via DNA/morphology). However, it struggles with **Req 6** (gradation), often splitting populations into too many species based on trivial diagnostic traits, violating **Req 8** (confusing trait with entity).
  *   **Ecological Species Concept:** Handles **Req 1** well (niche applies to asexuals). Struggles with **Req 5** (distinct niches can overlap) and is difficult to operationalize for **Req 4** (data-poor populations).
  *   **Deflationary/Pragmatic Accounts:** Satisfy **Req 11** (process) and **Req 6** (gradation) perfectly. However, they struggle to satisfy **Req 9** (Reality), leaving the reader with the unsatisfying conclusion that species are "just" human conventions, which undermines the urgency of conservation.

  **Summary for the Feature:** An adequate account must tell readers that "species" is a tool used to cut a continuous loaf of evolutionary time. The reason the count shifts is that different scientists are using different knives (concepts) for different loaves (taxa), and sometimes the bread is too stale (fossils) or too gooey (hybrids) to hold a clean slice.
