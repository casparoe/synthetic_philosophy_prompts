  # JOINT STATEMENT ON ANTHROPIC REASONING: SSA/SIA ADVERSARIAL COLLABORATION

  **Signatories:** [Representative of Self-Sampling Assumption] & [Representative of Self-Indication Assumption]
  **Date:** October 26, 2023
  **Subject:** Formalizing Consensus, Divergence, and Resolution Conditions in Anthropics

  ## I. AGREED-UPON CLAIMS

  We, the undersigned, acknowledge that while our posterior credences diverge on key anthropic problems, we share a common formal foundation. We commit to the following substantive claims, acknowledging that accepting these constraints limits the freedom of our respective theories to avoid counterintuitive results.

  1.  **The Centered-Worlds Formalism:** Both parties agree that anthropic problems are best modeled using *centered worlds* (pairs of a possible world and a location/observer within that world). We agree that standard uncentered Bayesianism is insufficient for anthropic problems without a rule for weighting centered hypotheses.
  2.  **Indexical Information is Evidential:** We agree that the proposition "I am this specific observer" constitutes indexical information that can rationally update credences over uncentered hypotheses (e.g., the total number of observers in the universe). We reject the "No New Evidence" view that claims learning one's existence never updates priors regarding world size.
  3.  **The Validity of Baseline Thought Experiments:** We agree that the setups for the **Doomsday Argument**, **Sleeping Beauty**, **God's Coin Toss**, and **The Presumptuous Philosopher** are coherent scenarios. Disagreement lies solely in the posterior probabilities derived from these setups, not in their logical construction or relevance.
  4.  **The Bullet-Biting Concession:**
      *   The SSA signatory acknowledges that a naive application of SSA yields the **Doomsday Argument**, implying a high prior probability that humanity will go extinct soon, independent of empirical risk factors.
      *   The SIA signatory acknowledges that a naive application of SIA yields the **Presumptuous Philosopher** result, implying we should be extremely confident the universe is spatially infinite or contains vast numbers of observers, independent of empirical physical data.
      *   *Both agree that these implications are prima facie absurd and that a successful theory must either justify them robustly or mitigate them via reference class restrictions.*
  5.  **Reference Class Non-Arbitrariness:** We agree that the "Reference Class" (the set of observers one considers oneself a sample from) cannot be chosen *ad hoc* solely to produce desired results. Any definition of the reference class must be grounded in objective similarities (e.g., informational state, physical constitution, or causal history).
  6.  **Decision-Theoretic Alignment:** We agree that anthropic credences should, in principle, cash out in betting behavior. A theory of anthropics that systematically leads its adherents to lose money in Dutch Book scenarios (where bets are settled based on observer-moment frequency) is defective.

  ## II. DISAGREEMENTS TABLE

  | Issue | SSA Position | SIA Position | Crux? |
  | :--- | :--- | :--- | :--- |
  | **1. The Weight of Existence** | **Existence is not evidence for world size.** The fact that I exist is guaranteed in any world containing me. Therefore, priors over world sizes should not be updated merely by the number of observers in them. | **Existence is evidence for world size.** I should reason as if I am a random sample from the set of all *possible* observers. Worlds with more observers are more likely to contain "me." | **YES** |
  | *Auxiliary Consideration* | *Test Case:* **The God's Coin Toss (Large vs. Small).** If a coin toss creates 10 observers on Heads and 1 on Tails, and I find I am one of the observers... | *Prediction:* SSA predicts credence in Heads should remain near the prior (50%), adjusted only by reference class overlap. SIA predicts credence in Heads should shift to ~91% (10/11). | |
  | **2. Reference Class Scope** | **Narrow Reference Class.** The reference class should be restricted to observers "like me" (e.g., same informational state, same era). This blocks the Presumptuous Philosopher but enables Doomsday. | **Broad Reference Class.** The reference class should include all possible observers (or all conscious entities). This blocks Doomsday but enables the Presumptuous Philosopher. | **YES** |
  | *Auxiliary Consideration* | *Test Case:* **Alien Observers.** If we discover non-human intelligent life with radically different phenomenology... | *Prediction:* SSA predicts this discovery should not significantly alter anthropic probabilities regarding human extinction. SIA predicts this should significantly alter probabilities (by expanding the reference class). | |
  | **3. Sleeping Beauty** | **Halfer View (Standard).** Upon waking, Beauty's credence that the coin landed Heads should remain 1/2. The number of awakenings does not change the probability of the coin toss. | **Thirder View (Standard).** Upon waking, Beauty's credence that the coin landed Heads should be 1/3. She is more likely to be woken in a Tails world. | **NO** (See Section III) |
  | *Auxiliary Consideration* | *Test Case:* **Betting Setup.** If Beauty is paid per awakening vs. paid per experiment. | *Prediction:* Both sides agree on the optimal *bet*. Disagreement is on whether "credence" maps to "betting odds per awakening" or "betting odds per experiment." | |
  | **4. The Doomsday Argument** | **Valid.** Given my birth rank, it is more likely I am in a smaller total population than a larger one. | **Invalid.** The SIA prior exactly cancels the Doomsday update. My existence is more likely in a large population, offsetting the sampling probability. | **YES** |
  | *Auxiliary Consideration* | *Test Case:* **Future Population Cap.** If we discover a physical hard limit on the number of human brains the universe can support... | *Prediction:* SSA predicts this limit should lower our estimated survival time. SIA predicts this limit is irrelevant to the probability of early extinction. | |

  ## III. VERBAL DISAGREEMENTS AND DISSOLUTION

  Upon close inspection, we identify two major areas of conflict that appear substantive but are actually verbal or methodological. We propose the following reformulations to dissolve these tensions.

  ### 1. The "Credence vs. Decision" Dissolution (Sleeping Beauty)
  **The Conflict:** The SSA advocate argues for "Halfer" credences (1/2), while the SIA advocate argues for "Thirder" credences (1/3) in the Sleeping Beauty case.
  **The Diagnosis:** This disagreement largely stems from differing definitions of what "credence" is tracking. The SSA advocate defines credence as the probability of the *world-state* (Heads/Tails). The SIA advocate defines credence as the probability of the *current observer-moment* being in a Heads/Tails world.
  **Proposed Reformulation:** Both sides agree on the **Betting Odds**.
  *   If Beauty is paid once per *experiment*, both sides agree she should bet as if P(Heads) = 1/2.
  *   If Beauty is paid once per *awakening*, both sides agree she should bet as if P(Heads) = 1/3.
  *   **Resolution:** We agree to label the former "Uncentered Credence" (SSA preference) and the latter "Centered Credence" (SIA preference). We acknowledge that neither is "wrong"; they are answers to different questions. The substantive disagreement is only about which credence should guide action in specific decision-theoretic contexts.

  ### 2. The "Updateless" Dissolution (Presumptuous Philosopher & Doomsday)
  **The Conflict:** SSA fears SIA allows us to deduce the universe is huge from our armchairs (Presumptuous Philosopher). SIA fears SSA allows us to deduce humanity will end soon from our armchairs (Doomsday).
  **The Diagnosis:** Both "naive" results arise from conditioning on "I exist" at a specific point in the causal chain. Recent work in **Updateless Decision Theory (UDT)** suggests that the optimal strategy is to choose a policy *before* knowing which observer you are.
  **Proposed Reformulation:**
  *   We agree that if we treat anthropic reasoning as a tool for **policy selection** rather than **belief updating**, the divergence narrows significantly.
  *   An Updateless SSA agent and an Updateless SIA agent often converge on the same decisions regarding existential risk mitigation, even if their posterior *beliefs* about world size differ.
  *   **Resolution:** We classify the Doomsday and Presumptuous Philosopher problems as artifacts of *conditionalization* on indexical information. We agree to treat "Anthropic Updating" as a heuristic for "Anthropic Decision Theory." Where the decision theories diverge (e.g., in acausal trade scenarios), we acknowledge this as a genuine remaining crux regarding the nature of counterfactuals, not merely sampling.

  ## IV. CONDITIONS FOR CHANGING MINDS

  To ensure this collaboration remains live, we specify the conditions under which each party would abandon their primary assumption.

  **The SSA Signatory will abandon SSA if:**
  1.  It is demonstrated that SSA violates **Reflection Principle** in a way that leads to guaranteed losses in sequential betting scenarios where the agent knows the setup in advance.
  2.  A definition of the Reference Class is produced that blocks the Doomsday Argument without becoming so narrow that it renders anthropic reasoning impossible (e.g., a reference class of size 1).

  **The SIA Signatory will abandon SIA if:**
  1.  It is demonstrated that SIA implies we should ignore empirical physical evidence regarding the size of the universe in favor of armchair anthropic deduction (i.e., if the Presumptuous Philosopher conclusion cannot be blocked by physical constraints on observer density).
  2.  It is shown that SIA violates **Bayesian Conditionalization** by treating "I exist" as evidence that is not screened off by the physical facts of the world.

  ***

  **Signed,**

  _________________________
  *Advocate, Self-Sampling Assumption*

  _________________________
  *Advocate, Self-Indication Assumption*
