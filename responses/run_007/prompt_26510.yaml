prompt: |-
  I spent forty years as a research neuroscientist studying the dopaminergic reward system and its role in decision-making. Since retiring, I have been volunteering at a nonprofit that provides structured life-planning conversations to adults at transition points—career changes, retirement, serious medical diagnoses, the dissolution of a long partnership. Our counselors are intelligent generalists, not trained in philosophy, and they see roughly eight clients per week for one-hour sessions.

  I have been reading the philosophical literature on well-being, and I am struck by how Nozick's experience machine thought experiment and the subsequent debate among hedonistic, desire-satisfaction, and objective-list theories could genuinely help a person think through a concrete life decision. But the literature is dialectical and abstract; I cannot hand our counselors Parfit or Sumner and expect them to extract a usable tool.

  I want a reusable decision procedure—a sequence of questions with explicit stopping rules—that a counselor can walk a client through in about twenty minutes. The procedure should operationalize the central insight of the experience machine literature: that there is a distinction between a life that feels good from the inside and a life that is good, and that this distinction bears on actual decisions. It should draw on the conceptual resources of the main theories of well-being without naming them or presupposing any one of them, and it should help the client notice when their reasons for a choice collapse into purely hedonic or desire-based considerations in a way they might not, on reflection, endorse.

  The procedure must handle at least the following hard cases:

  - A client whose stated values and their felt motivational pull point in opposite directions (e.g., "I believe family matters most, but I feel most alive when I am working").
  - A client who responds to every question with some version of "but that is what I want" or "that would make me happy."
  - A client who, when the experience machine is described to them in simplified terms, insists they would enter it without hesitation and sees no force in the distinction the procedure is trying to draw.

  For each question in the procedure, specify what counts as a sufficient answer to move forward, where the procedure stops with a tentative conclusion, and where it hands the decision back to the client with an honest acknowledgment that the procedure has nothing further to contribute.

  Then apply the procedure to two cases:

  1. A mid-career software engineer considering leaving a well-compensated, comfortable position to teach mathematics in a public high school—a change that would reduce their income by more than half, strain their marriage, and eliminate their savings rate, but which they describe as "what I am supposed to do."

  2. A recent widow deciding whether to relocate to be near her adult children, who want her close by, or to move to a retirement community in a warm climate where she knows no one but has dreamed of living since she was young.

  Finally, I ask that you identify where this procedure is most likely to fail: which step rests on a contested philosophical claim, where a client with a different temperament or cultural background would reach a different conclusion for reasons the procedure cannot adjudicate, and what argument or empirical finding would lead you to redesign the procedure substantially. I want to know what would change your mind about the structure you have built.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Retired research neuroscientist (40 years in dopaminergic reward/decision-making), now volunteering at a nonprofit (life-planning conversations at transition points).
      *   **Goal:** Create a reusable, 20-minute decision procedure for counselors (intelligent generalists, 8 clients/week) based on the philosophical literature on well-being (specifically Nozick's Experience Machine and the Hedonic/Desire/Objective List debate).
      *   **Constraints:**
          *   Must operationalize the distinction between "feeling good" and "being good" without using jargon (Nozick, Parfit, Sumner, etc.).
          *   Must handle hard cases (values vs. motivation, "I just want to be happy," pro-Experience Machine clients).
          *   Must include explicit stopping rules and sufficiency criteria for each question.
          *   Must apply to two specific cases (Software Engineer -> Teacher; Widow -> Relocation).
          *   Must identify failure points, contested claims, cultural/temperament biases, and what would cause a redesign.
      *   **Tone:** Professional, rigorous, practical, respectful of the user's expertise (neuroscience) and the philosophical depth required.

  2.  **Deconstruct the Philosophical Core:**
      *   *Hedonism:* Well-being = pleasure/pain balance. (Experience Machine satisfies this).
      *   *Desire Satisfaction:* Well-being = getting what you want. (Experience Machine satisfies this if you want the experience).
      *   *Objective List/Perfectionism:* Well-being = achieving certain goods (truth, connection, accomplishment) regardless of feeling. (Experience Machine fails this).
      *   *The Insight:* Humans often value *contact with reality*, *agency*, and *narrative coherence* over mere positive affect. The procedure needs to surface these values without preaching them.
      *   *Neuroscience Angle:* The user knows dopamine drives "wanting" vs. "liking." The procedure should help distinguish between the *anticipation* of reward (dopaminergic drive) and the *valuation* of the outcome (prefrontal/reflective).

  3.  **Drafting the Procedure (The "Reality Check" Protocol):**
      *   *Name:* Needs to be neutral. "The Three Horizons" or "The Grounding Protocol." Let's go with "The Grounding Protocol."
      *   *Structure:* 4 Steps.
          1.  Map the Option (Concrete visualization).
          2.  The Feeling Test (Hedonic/Desire check).
          3.  The Reality Test (Nozickian check without naming Nozick).
          4.  The Legacy/Narrative Test (Objective List/Coherence check).
      *   *Stopping Rules:* Crucial. If they pass through without friction, endorse the choice. If friction arises, pause. If they reject the premise (pro-Experience Machine), stop and acknowledge.

      *   *Refining Step 3 (The Core Nozickian Move):* How to ask "Would you plug in?" without saying "Plug in?"
          *   *Idea:* Ask about the *source* of the satisfaction. "If you could have this feeling without the struggle/consequence, would you?"
          *   *Better:* "The Magic Button." If a button gave you the *sense* of accomplishment without the actual teaching, would you press it?
      *   *Refining Step 4 (Values vs. Motivation):* Address the "I believe X but feel Y" conflict.
          *   *Idea:* Distinguish between the *actor* and the *observer*. "If you watched a movie of your life, would you be proud?"

      *   *Handling the "I just want happiness" client:* The procedure must validate this but ensure it's a *considered* choice, not a default.
      *   *Handling the "Pro-Machine" client:* If they truly value experience over reality, the procedure must respect that autonomy while ensuring informed consent.

  4.  **Developing the Steps (Iterative Process):**

      *   *Step 1: The Snapshot.* Define the choice clearly.
      *   *Step 2: The Inner Weather.* How does it feel? (Hedonic).
      *   *Step 3: The Source.* Is the value in the feeling or the fact? (Nozick).
      *   *Step 4: The Story.* Does this fit the life you are writing? (Narrative/Objective).

      *   *Stopping Rules:*
          *   Stop if Step 2 reveals pure avoidance of pain (fear-based).
          *   Stop if Step 3 reveals they don't care about reality (validate, don't argue).
          *   Stop if Step 4 reveals deep incoherence (refer out or pause).

  5.  **Applying to Case Studies:**

      *   *Case 1 (Engineer -> Teacher):*
          *   High conflict between security (hedonic/desire) and meaning (objective/narrative).
          *   Step 3 is key: Would he teach if no one knew? If students didn't learn?
          *   Likely outcome: The procedure reveals the value is in *actual impact*, not just the *label* of teacher.
      *   *Case 2 (Widow -> Children vs. Dream):*
          *   Conflict between duty/connection (objective) and autonomy/dream (desire/hedonic).
          *   Step 4 is key: The narrative of her life. Is she the "sacrificing mother" or the "woman who lived"?
          *   Likely outcome: Nuanced compromise or clear prioritization.

  6.  **Identifying Failure Points (The "Red Team" Analysis):**
      *   *Philosophical Contention:* The procedure assumes reality matters. A strict hedonist will find Step 3 nonsensical.
      *   *Cultural Bias:* Individualistic "narrative" vs. Collectivist "duty." The "Legacy" step might privilege Western autonomy.
      *   *Neuroscience Critique:* If "values" are just higher-order desires (dopamine on abstraction), the distinction is illusory.
      *   *Redesign Trigger:* If empirical data shows people who "fail" the Reality Test live just as happy lives, the procedure is paternalistic.

  7.  **Review against Constraints:**
      *   20 minutes? Yes, 4 steps is tight.
      *   No jargon? Yes.
      *   Stopping rules explicit? Yes.
      *   Hard cases addressed? Yes.
      *   User expertise acknowledged? Yes (tone should match a peer).

  8.  **Final Polish:**
      *   Ensure the tone respects the user's neuroscience background (acknowledge the machinery of reward without reducing the philosophy to it).
      *   Make sure the "Pro-Experience Machine" handling is robust—it's the hardest philosophical objection.
      *   Check the "Values vs. Motivation" hard case.

      *(Self-Correction during drafting)*: I initially thought about asking "Is this moral?" No, that's too loaded. Keep it to "Is this *you*?"
      *(Self-Correction on Step 3)*: Make sure the "Magic Button" analogy doesn't sound like a trick. It needs to be framed as "isolating the variable."
      *(Refining the "Pro-Machine" response)*: If they say "Yes, I'd plug in," the counselor shouldn't argue. The procedure should flag this as a "Hedonic Priority" and move to risk assessment (since real life isn't a machine).

  9.  **Final Output Structure:**
      *   Introduction (acknowledging the user's background).
      *   The Procedure (The "Grounding Protocol").
      *   Application to Cases.
      *   Failure Analysis & Redesign Conditions.

  10. (Final check of the prompt requirements): "Specify what counts as a sufficient answer to move forward, where the procedure stops with a tentative conclusion, and where it hands the decision back." -> *Must be very explicit in the procedure section.*

