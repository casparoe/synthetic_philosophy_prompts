              *   **Decision:** **The "Memorization vs. Generalization" Circuit in Arithmetic.**
              *   **Specifics:** A model trained on `a + b = c` for small numbers.
              *   **Case A:** `2 + 2 = 4`. (Could be memorized or computed).
