answer: |-
  This is an exceptionally sharp framing for a seminar session. You are asking students to move beyond the *moral* intuition the piece provokes ("racism is bad, just like sexism") and interrogate the *pragmatic machinery* that allows the moral intuition to be triggered in the first place.

  Here is a close reading of Hofstadter's "A Person Paper on Purity in Language" through the lens of presupposition theory and normative pragmatics, structured to facilitate your seminar discussion.

  ---

  ### 1. The Stalnakerian Mechanism: Local vs. Global Accommodation

  To analyze the satire, we must first distinguish between the **actual Common Ground (CG)** of the reader and the **local CG** demanded by the text.

  In a Stalnakerian framework, a presupposition is a proposition that the speaker assumes is already in the CG (or can be easily added to it). When a speaker utters something carrying a presupposition $P$ that is not in the CG, the listener faces a choice: reject the utterance as infelicitous, or **accommodate** $P$ (add it to the CG) to preserve the cooperative principle (Lewis 1979).

  **The Satirical Demand:**
  Hofstadter's persona writes sentences like: *"We must not allow the word 'person' to erase the specific contributions of white culture."*
  *   **Trigger:** The definite description/the generic usage implies a distinction between "persons" (the new generic) and "whites" (the specific group being erased).
  *   **Presupposition ($P_{racist}$):** "Whites are the marked, specific category; 'persons' is a category that excludes or dilutes whites." (Or more starkly, in the logic of the swap: "Blacks are not persons.")

  **The Reader's Dilemma:**
  If the reader refuses to accommodate $P_{racist}$, the text becomes pragmatically incoherent. The arguments made by the persona (e.g., that "person" is an erasure) rely entirely on $P_{racist}$ being true within the discourse.
  *   **If we fail to accommodate:** The text reads as the ravings of a madman. The structural parallel to sexist language is lost because we dismiss the premises as absurd.
  *   **If we successfully accommodate:** We enter the "game." We temporarily update the local CG to include $P_{racist}$ so we can process the argument.

  **The Verdict on Your Core Question:**
  The satirical force depends on **successful local accommodation followed by meta-pragmatic horror.**
  The reader *must* accommodate the presupposition to understand the text *as an argument*. If we didn't, we wouldn't feel the "click" of recognition when we map it back to gender. The horror arises not because we refused to update the CG, but because we realize **how easily the mechanism of accommodation allowed us to simulate a racist worldview.**

  This reveals that accommodation is not merely a semantic repair strategy; it is a **compliance mechanism**. By accommodating, we momentarily submit to the speaker's definition of reality.

  ### 2. The Normative Dimension: Presupposition as Exercitive

  This is where the work of Langton (2018), McGowan (2009), and Haslanger becomes crucial. On the Stalnakerian view, accommodation is about *truth* conditions (what we accept as true for the conversation). On the normative view, accommodation is about *score* (what we accept as permissible/authoritative).

  **Presupposition as Enactment:**
  McGowan argues that conversational contributions can be **exercitives**: speech acts that change the norms of the conversation. When a speaker presupposes a social hierarchy, and the listener accommodates, the listener is not just accepting a proposition; they are **ratifying the authority** of the speaker to define that hierarchy.

  **In the "Person Paper":**
  *   **The Persona's Move:** By using "person" as an exclusive term (analogous to "man"), the persona attempts to enact a norm where whiteness is the standard and "personhood" is a dilution.
  *   **The Reader's Complicity:** To read the essay fluently, we must allow this norm to hold sway *within the text*. We must let the "score" of the conversation reflect the hierarchy the persona demands.
  *   **The Revelation:** The satire forces us to experience what it feels like to have a hierarchical norm enacted upon us via grammar.
      *   In the **race swap**, the hierarchy is explicit and repugnant. We feel the friction of accommodating it.
      *   In the **gender original** ("mankind"), the hierarchy is implicit and familiar. We do not feel the friction.

  **Seminar Point:** The "Person Paper" suggests that default-male language functions not merely by describing a male-dominated world, but by **enacting** it every time it is accommodated. The satire works because it takes a hierarchy that is *no longer* in our actual CG (white supremacy) and forces us to accommodate it locally, thereby exposing the mechanism we use effortlessly for gender (which *is* still partially in our actual CG).

  ### 3. What This Reveals About Default-Male Language

  Your second question asks what this tells us about non-satirical contexts: *Does default-male language work by getting speakers to accommodate a presupposition they would reject, or by exploiting one they have internalized?*

  The "Person Paper" suggests the latter, but with a caveat.

  1.  **Internalization vs. Accommodation:** In the satire, the racial presupposition is *not* internalized by the contemporary reader. We have to work to accommodate it. In standard sexist discourse, the presupposition (that "man" includes women, or that men are the default humans) is often *already* in the Common Ground.
  2.  **The Danger of the "Given":** The satire reveals that when a presupposition is already in the CG (internalized), accommodation is invisible. We don't notice we are updating the score because the score is already set.
  3.  **The Mechanism of Change:** The satire implies that challenging default-male language requires **blocking accommodation**. Just as the reader wants to reject the racist presupposition in the "Person Paper," feminists must train listeners to reject the sexist presupposition in "mankind."

  **Conclusion on Mechanism:** Default-male language functions by exploiting **internalized presuppositions** that no longer trigger resistance. The "Person Paper" reactivates the resistance by swapping the variable. It turns a "silent" accommodation (gender) into a "loud" accommodation (race).

  ### 4. Limits of the Presuppositional Lens

  For an advanced seminar, it is vital to show where this framework strains. The "Person Paper" is not *only* about presupposition.

  **A. Expressives and Slurs (Potts 2007)**
  Presupposition theory deals with truth-conditional content and background assumptions. However, the "Person Paper" relies heavily on the **expressive content** of the swapped terms.
  *   When the persona uses "person" to exclude Blacks, the term functions pragmatically like a slur or a coded dog whistle.
  *   **Limit:** A Stalnakerian account explains *why* the sentence is processed, but not the *affective punch*. The horror isn't just logical (the CG is updated); it's emotional (the expressive content is derogatory).
  *   **Seminar Question:** Is the satire effective because of the *presupposition* (Blacks aren't persons) or the *expressive* (using "person" in this way is an act of degradation)? If it's the latter, does presupposition theory miss the primary harm of sexist language?

  **B. Irony and Echoic Mention (Sperber & Wilson)**
  The entire text is an instance of **irony**. The actual author (Hofstadter) does not hold the presuppositions of the persona.
  *   **Limit:** In standard accommodation, the listener adds $P$ to the CG because they believe the speaker believes $P$. In irony, the listener recognizes the speaker is *mentioning* $P$ to ridicule it.
  *   **Complication:** If the reader treats the text as ironic immediately, they never actually accommodate the racist presupposition, even locally. They attribute it to the persona, not the author.
  *   **Refinement:** The satire works best if there is a **lag**. The reader must accommodate the presupposition *first* (to follow the argument) and only later recognize the irony. If the irony is detected too early, the satirical force dissipates. This suggests that accommodation is fast and automatic, while critical reflection is slow.

  **C. Implicature vs. Presupposition**
  Some of the persona's arguments rely on **implicature** rather than presupposition.
  *   *Example:* "If we use 'person', we imply that white history doesn't matter."
  *   This is a conversational implicature derived from the maxim of Quantity or Manner, not a hard semantic presupposition.
  *   **Limit:** Implicatures are easier to cancel than presuppositions. If the harm of sexist language lies in implicature (e.g., "using 'he' implies women are less relevant"), it is more fragile than if it lies in presupposition. The "Person Paper" conflates the two, treating implicatures as if they were hard presuppositions to maximize the rhetorical force.

  ### 5. Suggested Seminar Trajectory

  1.  **The Accommodation Test:** Ask students to identify a specific sentence in the "Person Paper" that feels "off." Have them formalize the presupposition required to make it felicitous. (e.g., *"The struggle for personhood should not erase the white experience."* $\rightarrow$ Presupposes: Whites are not fully covered by personhood/Blacks are the default persons).
  2.  **The Normative Shift:** Introduce McGowan's "Conversational Exercitives." Ask: When you read that sentence and understood it, did you merely understand a proposition, or did you momentarily grant the speaker the authority to define "personhood"?
  3.  **The Lag Hypothesis:** Pose your core question. Did you accommodate *then* recoil, or did you recoil *thereby* failing to accommodate? (Argue for the former: the recoil proves the accommodation happened).
  4.  **The Limits:** Ask students where presupposition theory fails. (e.g., Does it explain the anger the text generates? Or do we need a theory of slurs/expressives?)
  5.  **Application:** Apply the "Lag Hypothesis" to a real-world example of generic "man." Do we accommodate it silently because it's internalized, or do we accommodate it because the grammatical structure forces it before we can critically reflect?

  ### Summary for the Syllabus
  *   **Anchor:** Hofstadter, "A Person Paper on Purity in Language."
  *   **Theory:** Stalnaker (Common Ground), Lewis (Accommodation), McGowan (Exercitives), Langton (Speech Acts).
  *   **Key Insight:** The satire functions by forcing **localized accommodation** of a hierarchical presupposition that is no longer globally accepted. This exposes the **automaticity of accommodation** in standard sexist discourse, where the hierarchy remains globally accepted (or at least unchallenged), rendering the accommodation invisible.
  *   **Caveat:** The mechanism is not purely presuppositional; it relies on the **affective force of expressives** and the **temporal lag of ironic recognition**.

  This approach moves the seminar from "Hofstadter says sexism is like racism" to "Hofstadter demonstrates that the pragmatics of oppression rely on the cooperative principles of conversation itself."
