answer: |-
  You are absolutely right to be suspicious. In professional philosophy, the "is-ought" slogan (often called **Hume's Law** or the **Is-Ought Problem**) is treated as a serious structural constraint, but it is rarely treated as the conversation-ending trump card your dinner-party friend wielded. The move from "there is a logical distinction" to "empirical science is irrelevant" is indeed a non-sequitur in most contexts.

  Here is a menu of the distinct claims hidden inside that slogan, ordered from the weakest (most trivial) to the strongest (most controversial). For each, I've flagged its philosophical status and whether it actually supports the "science is irrelevant to ethics" move.

  ---

  ### The Menu of Claims

  #### 1. The Logical Validity Claim
  *   **The Claim:** You cannot validly deduce a conclusion containing a normative term (e.g., "ought," "good") from a set of premises that contain *only* descriptive terms (e.g., "is," "blue," "heavy"), unless you include at least one normative premise.
  *   **Status:** **Trivially True.** This is just a rule of formal logic. It's like saying you can't get the word "apple" out of a syllogism that never mentions fruit. If your premises are purely "X causes Y" and "Y causes Z," you cannot logically conclude "You ought to do X" without a premise like "You ought to pursue X."
  *   **Does it support the Dinner-Party Move?** **No.**
      *   *Why:* This claim only requires *one* normative premise to bridge the gap. It does not say science cannot provide the *other* premises. In fact, most ethical arguments look like this:
          1.  *Normative:* We ought to reduce suffering.
          2.  *Empirical (Science):* Policy X reduces suffering more than Policy Y.
          3.  *Conclusion:* We ought to do Policy X.
      *   Science is doing the heavy lifting in premise 2. The slogan doesn't make science irrelevant; it just says science can't do the *whole* job alone.

  #### 2. The Semantic/Conceptual Claim
  *   **The Claim:** Normative concepts (like "good" or "right") are not *synonymous* with descriptive concepts (like "pleasure" or "evolutionarily adaptive"). To say "X is good" means something different than "X is pleasant."
  *   **Status:** **Substantive but Widely Accepted.** This is the core of G.E. Moore's "Open Question Argument." Even if good things *are* pleasant, it still makes sense to ask, "But is pleasure *good*?" If the words meant the exact same thing, that question would be nonsense (like asking "Is a bachelor an unmarried man?").
  *   **Does it support the Dinner-Party Move?** **No.**
      *   *Why:* Distinct meanings don't imply distinct referents. "Water" and "H₂O" have different meanings (one is about a liquid you drink, the other about molecular structure), but they refer to the same thing in the world. Science discovered that water *is* H₂O. Similarly, science could discover that "goodness" *is* a specific natural property (e.g., well-being), even if the *words* mean different things.

  #### 3. The Epistemic Claim
  *   **The Claim:** You cannot come to *know* a moral truth solely through empirical observation. You need a separate faculty (like rational intuition or practical reason) to grasp normative truths.
  *   **Status:** **Contested.** This is where the real fight is. Moral naturalists (who think moral facts are natural facts) deny this. Non-naturalists (like many Kantians or Intuitionists) accept it.
  *   **Does it support the Dinner-Party Move?** **Partially.**
      *   *Why:* If this is true, then a microscope or a brain scan cannot *directly* reveal a moral truth. However, it still doesn't make science *irrelevant*. Empirical evidence can still rule out moral theories (e.g., if your moral theory requires humans to be able to fly, biology falsifies it). It limits science's authority but doesn't exile it.

  #### 4. The Metaphysical Claim (Non-Naturalism)
  *   **The Claim:** Normative facts are a fundamentally different *kind of thing* than natural facts. They do not exist in space-time, have no causal power, and are not part of the physical universe. (J.L. Mackie called this the "Argument from Queerness.")
  *   **Status:** **Strong and Controversial.** This is a heavy metaphysical commitment. It requires believing in "spooky" entities that science cannot, even in principle, detect. Many modern philosophers reject this because it makes moral knowledge mysterious (how do we see these non-physical facts?).
  *   **Does it support the Dinner-Party Move?** **Yes.**
      *   *Why:* If moral facts are literally outside the natural order, then evolutionary psychology, neuroscience, and physics literally cannot study them. This is the only version of the slogan that actually justifies dismissing empirical work on ethics. But you have to buy into a very specific, controversial metaphysics to get there.

  #### 5. The Autonomy of Ethics Claim
  *   **The Claim:** Ethical truths are entirely independent of natural truths. No change in the physical world could ever force a change in moral judgment.
  *   **Status:** **Probably False.** Most philosophers accept the **Supervenience of the Normative**: if two situations are identical in all physical/descriptive respects, they must be identical in moral respects. You can't say "Lying is wrong in Case A, but Lying is right in Case B" if Case A and Case B are physically identical.
  *   **Does it support the Dinner-Party Move?** **Yes, but at a high cost.**
      *   *Why:* If this were true, science would be useless for ethics. But accepting this leads to absurdities (e.g., that morality could remain the same even if humans were immortal, felt no pain, or couldn't communicate). Rejecting this claim is usually seen as more reasonable than accepting it.

  ---

  ### Hume vs. The Internet

  You asked for bonus points on what Hume actually meant versus how the slogan is used today.

  **What Hume Meant (Treatise 3.1.1):**
  Hume wasn't laying down a metaphysical law that "is" and "ought" are forever separate. He was making a **rhetorical and dialectical point** about the moralists of his day (religious and rationalist philosophers). He noticed they would spend pages describing how the world *is* (God's design, human nature, cosmic order) and then suddenly conclude what we *ought* to do without explaining the connection.
  *   **Hume's Point:** "Hold on, you shifted topics. You need to explain *how* you got from the description to the prescription."
  *   **Hume's Goal:** He wanted moral philosophy to be more rigorous, not to declare it impossible. In fact, Hume himself grounded morality in human sentiment and psychology (empirical matters). So, ironically, **Hume would likely disagree with your dinner-party friend.** Hume thought science (the study of human nature) was essential to ethics.

  **What Internet/Pop-Philosophy Means:**
  In online arguments and dinner parties, the slogan has morphed into a **Shield Against Naturalism**.
  *   **The Move:** "Science describes facts; I hold values. Therefore, science cannot touch my values."
  *   **The Error:** This conflates the **Logical Validity Claim** (Level 1) with the **Metaphysical Claim** (Level 4). They assume that because logic requires a normative premise, empirical facts cannot constrain, inform, or ground that premise.

  ### The Verdict on Your Dinner Party

  Your suspicion is correct. The move from "there's a logical gap" to "science is irrelevant" is sloppy.

  1.  **If they meant Claim 1 (Logic):** They are right, but it doesn't help them. Science provides the facts that plug into the moral equation. (e.g., AI Alignment *needs* to know what humans *do* value to align with what they *should* value).
  2.  **If they meant Claim 4 (Metaphysics):** They are making a huge, undefended metaphysical assumption. They are asserting that values are "spooky non-natural entities" without argument.
  3.  **The Reality:** Most serious work in ethics (including AI alignment and evolutionary ethics) acknowledges the gap. They don't try to derive an "ought" from *only* an "is." They propose a bridge (e.g., "Suffering is bad" + "Evolution causes suffering" = "We ought to mitigate evolutionary impulses").

  **How to respond next time:**
  *"I agree you can't deduce an 'ought' from *only* an 'is.' But that just means we need a bridge premise. Science is incredibly good at telling us whether that bridge holds up. If your moral theory requires humans to be able to fly, biology falsifies your ethics. So science isn't irrelevant; it's the constraint system for our values."*
