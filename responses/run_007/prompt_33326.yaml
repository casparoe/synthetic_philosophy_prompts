prompt: |-
  I'm a PhD student in computer science working on programming language semantics and formal verification, and I'm trying to get a handle on the causal exclusion argument in philosophy of mind. My working vocabulary is the one I use every day: abstraction layers, compilation (and more generally, realization of a specification in a lower-level implementation), interpretation, virtual machines, multiple realizability, supervenience, and the distinction between a program (as an abstract object) and the process that runs it.

  Restate the causal exclusion argument using that vocabulary, as precisely and honestly as you can. The argument, roughly, runs like this: physical events have sufficient physical causes (causal closure of the physical); mental events are distinct from physical events (non-reductive physicalism); and we should not accept widespread causal overdetermination. From these premises, it seems to follow that mental events are causally idle — they do no causal work beyond what their physical realizers already do. I want to see how this looks when its pieces are mapped onto the distinction between a high-level program and its low-level implementation, the idea that the machine state is causally closed, the fact that the same program can be realized by different machine codes, and so on. Be explicit about what maps to what.

  Then give me the residue report. Which parts of the argument translate cleanly? Which parts did you have to distort, and how? Which parts have no counterpart in my vocabulary at all? And — this is the part I most care about — tell me whether the residue points to something my framework is missing, or whether it suggests that the philosophical problem is less substantive than it looks, perhaps an artifact of how the debate is framed rather than a genuine puzzle about the world.

  Please say how confident you are in the claims you make, and single out the point you are least sure of.

  Keep the response to at most 900 words.
