prompt: |-
  I just spent two hours arguing with a freind who writes Haskell for a living, and I need someone to turn the mess into something I can actually use. I was trying to explain Bradley's regress to him: the worry that if a proposition (or a fact, or a state of affairs) is just a bunch of constituents — say, a relation and its terms — then you need something to tie the relation to its terms; but then that tying-thing is itself related to the relation and the terms, so you need another tying-thing, and you're off. His response, roughly, was "this is a solved non-problem: in code you just apply the function to its arguments and that's it. Application is primitive; nobody asks what glues a function to its arguments." I pushed back that a proposition isn't a function applied to its arguments, because writing it that way already builds in a mode of combination, which is the very thing in question. He said that's exactly his point: the mode of combination is syntax, not another entity. Round and round.

  Here's what I want, and I want it honest rather than diplomatic. Restate Bradley's regress and the unity-of-the-proposition problem in the vocabulary of someone who thinks natively in terms of function application, currying, tuples/records, evaluation, and maybe algebraic data types — as faithfully as you can, piece by piece. Where does it translate cleanly (does the relation/terms distinction become function/arguments, or constructor/fields, or something else)? Where do you have to fudge or stretch the programmer's concepts to get them to carry the philosophical point? And then give me the residue report: which parts of the original worry have no counterpart in that vocabulary at all, and is that because the programmer's frame is genuinely missing something, or because the original worry was less clear than it looks. I especially want to know whether "application is primitive" is an answer to the regress or a change of subject — and whether anything that gets dropped in translation is something a programmer would actually care about. I can follow Haskell-ish talk fine, but don't assume I know type theory beyond the basics; and please don't settle it by quietly assuming the programming frame wins.
