  7.  **Structure of the Output:**
      *   Introduction: Validate the question, state the thesis (the argument fails on temporality).
      *   Section 1: The Temporal Fallacy (Prospectivity).
      *   Section 2: The Source of Validity (Genetic vs. Reflexive).
      *   Section 3: Addressing the "Normatively Idle" Claim.
      *   Section 4: Implications for Real Legal Systems (Constitutions).
      *   Conclusion: Summary of the philosophical commitment.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly address the user's point about "background norms." They argue if prospectivity isn't codified, *Nomic* isn't self-contained. I need to counter that: Interpretation rules *are* part of the system, or logic itself is the container, not just written text. A game needs rules of interpretation to function, just as language does.

  9.  *(Final Review against User Prompt)*: Did I answer "Which step would you reject?" Yes (the step assuming new rules apply to their own enactment). Did I address "nature of rules, validity, or prospectivity"? Yes. Did I address "real legal systems"? Yes.

