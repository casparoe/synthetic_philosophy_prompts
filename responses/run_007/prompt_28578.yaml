answer: |-
  First, take a deep breath. You are not being incoherent, and you are certainly not alone. In fact, your position is one of the most robust and intellectually defended spaces in contemporary philosophy of religion. Your friend is arguing from a framework called **Logical Positivism** or **Scientific Realism**, which was dominant in the early 20th century but has been largely dismantled by philosophers of language, even secular ones.

  His argument rests on a specific theory of meaning: that a statement is only meaningful if it can be verified empirically (like "the table is in the room") or if it is a tautology (like math). Anything else is either nonsense or mere emotion. This is a very narrow view of how human language actually works.

  Here is a breakdown of how we might approach this philosophically, followed by the argument I think serves you best.

  ### Brainstorming Three Philosophical Responses

  **1. The Non-Realist / Symbolic Approach (e.g., Don Cupitt, Ronald Dworkin)**
  *   **The Gist:** This view agrees with your friend that there is no supernatural "person" in the sky. However, it disagrees that this makes religion "just emotions." Instead, "God" is a symbol for the highest human values (Justice, Love, Being).
  *   **The Truth Claim:** When you pray, you aren't talking *to* someone; you are aligning yourself *with* something. The "truth" of the prayer is measured by how well it orientates you toward the good.
  *   **Pros:** Very intellectually honest regarding science.
  *   **Cons:** Might feel too cold for you. It risks reducing God to a projection of human ideals, which might not capture the sense of *receiving* something you feel in shul.

  **2. The Wittgensteinian "Language Game" (e.g., D.Z. Phillips)**
  *   **The Gist:** Ludwig Wittgenstein argued that language has different functions in different contexts. The rules of chess don't apply to football. Similarly, the rules of scientific description don't apply to religious practice.
  *   **The Truth Claim:** Asking if God "exists" like a table exists is a category mistake. Religious language is about shaping a "form of life." The meaning of the prayer is found in its use within the community, not in its correspondence to a metaphysical fact.
  *   **Pros:** Validates your "way of life" intuition. It shuts down the friend's demand for empirical evidence as irrelevant.
  *   **Cons:** Can sound like you're saying religion is "true only inside the bubble," which might feel like you're dodging the question of reality.

  **3. The Relational / Ontological Approach (e.g., Martin Buber, Emmanuel Levinas)**
  *   **The Gist:** This is deeply rooted in Jewish philosophy. It argues that God is not an "object" to be believed in (an *It*), but a presence encountered in relationship (a *Thou*). Existence isn't a property you have; it's a way you meet.
  *   **The Truth Claim:** The truth of prayer isn't that a message was sent and received by a cosmic ear. The truth is that the *relationship itself is real*. The encounter transforms reality.
  *   **Pros:** Captures the depth and "realness" of the experience without requiring supernatural literalism.
  *   **Cons:** Requires shifting your definition of "existence" significantly.

  ***

  ### The Strongest Argument: Truth as Faithfulness and Disclosure

  I recommend you adopt a synthesis of the **Wittgensteinian** and **Relational** approaches. This allows you to tell your friend: *"You are assuming that 'truth' only means 'correspondence to physical facts.' I am arguing that religious truth is 'faithfulness to a covenant' and 'disclosure of meaning.'"*

  Here is how to dismantle his two-option picture and articulate your third option.

  #### 1. Where Your Friend's Picture Goes Wrong
  Your friend is committing a **category error**. He assumes that all meaningful statements must be *descriptive* (describing the state of the universe). But consider these statements:
  *   "I promise to love you."
  *   "This music is heartbreaking."
  *   "That was a rude thing to do."

  None of these are "factual claims" in the sense of "the table is in the room." You cannot put "love" or "rudeness" under a microscope. If your friend applied his logic to marriage, he would say: *"Either 'till death do us part' is a factual prediction (which might be false if you divorce), or it's just a pep talk. If you don't believe it's a factual prediction, you're play-acting."*

  But that's absurd. A wedding vow is a **performative utterance**. It doesn't describe a reality; it *creates* one. It changes your status. It binds you.

  Your friend thinks religion is a **theory** about the world. You experience religion as a **commitment** to the world.

  #### 2. Redefining "Belief" (Emunah vs. Assent)
  In Hebrew, the word often translated as "belief" (*Emunah*) is closer to "trust," "faithfulness," or "steadiness." It is relational, not intellectual.
  *   **Intellectual Assent:** "I accept the proposition that a Supernatural Being exists." (This is what your friend thinks you mean).
  *   **Relational Trust:** "I am placing my weight on this covenant. I am living *as if* this relationship is the most real thing about me."

  When you say the prayers, you are not submitting a physics paper. You are renewing a vow. You can renew a vow without having a metaphysical theory about who is listening. The "truth" of the vow lies in your fidelity to it, not in the ontological status of the witness.

  #### 3. What Does It Mean for Prayer to Be "True"?
  If prayer isn't a factual claim, can it still be true? Yes, but in a different sense. Philosophers call this **alethic pluralism** (there are multiple kinds of truth).

  *   **Moral Truth:** "Torture is wrong." This is true, not because you can find "wrongness" particles in torture, but because it correctly identifies a moral reality.
  *   **Disclosive Truth:** A great poem or song reveals something about the human condition. It is "true" because it illuminates reality, not because it lists facts.

  When you pray on the High Holidays, the prayer is "true" if it **discloses** your vulnerability, your gratitude, and your connection to your ancestors and community. If the prayer moves you to be more compassionate, more humble, or more connected, it has achieved a *real effect in the real world*.

  Your friend says practice must be grounded in a claim you believe. You can respond: **"The practice *is* the belief."**
  In Judaism, *Halakha* literally means "the way of walking." You don't walk in order to get to the theory of walking. You walk to be on the path. By keeping the food rules and saying the prayers, you are embodying a worldview. You are training your desires. As the Jewish philosopher Abraham Joshua Heschel said, *"We do not step out of the world to find God; we step into the world to find God."*

  #### 4. Addressing the "Play-Acting" Charge
  Your friend says if you don't believe a supernatural being is listening, you are play-acting.
  **Counter-argument:** When a judge says, "I sentence you to five years," they are using a ritual formula. They aren't invoking magic. But the words *do* something real. They change a person's life.
  When you say the *Kaddish* or the *Shema*, you are participating in a ritual that binds you to a history and a moral framework. It is not play-acting because it has **consequences**. It shapes how you treat your neighbors, how you face death, and how you understand your obligations.

  If you stand for the *Aleinu* and it reminds you that you are part of a people tasked with repairing the world (*Tikkun Olam*), and you go out and volunteer, the prayer was "true." It worked. It connected you to reality.

  ### How to Explain This to Your Friend

  Next time he presses you, try saying something like this:

  > "You're assuming that for my prayers to be real, God has to be an object in the universe like a table or a star. But I don't relate to God as an object; I relate to the *idea* of God as a demand on my life and a connection to my people.
  >
  > You say it's either a factual claim or a pep talk. I'm saying it's a **vow**. When I say 'I do' at a wedding, I'm not describing a fact; I'm making a commitment. Is that 'play-acting' if I don't have a scientific theory of love? No. It's binding.
  >
  > My practice isn't grounded in a theory about the sky; it's grounded in the reality of the community and the ethics I'm trying to live by. The 'truth' of my prayer isn't that a message was sent; it's that I was changed by saying it. If language can be used to promise, to marry, to condemn, and to bless, why do you insist religious language can only be used to describe furniture?"

  ### Summary
  You are not having it both ways. You are rejecting the premise that "factual description" is the only way language hooks onto reality. You are a **religious non-realist** or a **relational theist**. You hold that the *practice* generates the *meaning*, and that meaning is objectively real in its effects on your life and community, even if it doesn't correspond to a supernatural entity. That is a coherent, philosophically respected, and deeply Jewish position.
