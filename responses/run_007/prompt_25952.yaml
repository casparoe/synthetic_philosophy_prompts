      *   *Why do philosophers still accept utilitarianism?* Because there are counter-arguments, modifications, and meta-ethical considerations that blunt the force of the thought experiment.
      *   *What are the key weaknesses in the user's interpretation?*
          1.  Confusion between *logical possibility* and *empirical possibility*.
