      *   **Key Counter-Arguments (The "Why"):**
          1.  *Empirical Implausibility:* Monsters don't exist. Utilitarianism is a guide for the real world.
          2.  *Diminishing Marginal Utility:* The standard economic/philosophical assumption is that the 10th unit gives less utility than the 1st. A monster violates this.
          3.  *Definition of Utility:* If utility is tied to preference satisfaction or well-being, is it *possible* for one being to outweigh billions?
          4.  *Biting the Bullet:* Some utilitarians accept the conclusion (if the monster's gain *truly* outweighs everyone's loss, maybe we *should* feed it).
