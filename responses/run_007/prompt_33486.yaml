      *   *Is it a serious limitation?* It's a known philosophical tension. Some critics (e.g., Colombo & Wright) argue FEP is unfalsifiable because priors can be tuned post-hoc. Proponents (Friston et al.) argue it's a necessary feature of any goal-directed system.

