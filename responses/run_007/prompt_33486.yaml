      *   *What is Active Inference?* The process by which agents minimize free energy. This involves *perception* (updating models) and *action* (changing sensory input).
      *   *The Dark Room Problem:* A classic objection. If surprise minimization is the only goal, sensory deprivation is optimal.
      *   *The Standard Solution (Priors on Preferences):* Agents have "prior preferences" over states. These aren't just cognitive beliefs; they are encoded as attractor states in the generative model.
      *   *The Evolutionary Angle:* Where do these priors come from? Evolution. Organisms that didn't have priors favoring food/safety died. FEP describes the *mechanism* of persistence, not the *content* of the goals (which is selected by evolution).

