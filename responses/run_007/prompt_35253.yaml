answer: |-
  This is a classic problem in metaontology and the philosophy of language. You have correctly identified that the standard "Taboo" test (often associated with Eliezer Yudkowsky or David Chalmers) is a *necessary* condition for identifying verbal disputes, but it is not *sufficient* for classifying them as *merely* verbal in the sense of "trivial" or "not worth having."

  Your intuition is tracking a distinction that contemporary philosophy has recently formalized: the difference between a **Verbal Dispute** (confusion about usage) and a **Metalinguistic Negotiation** (disagreement about which usage *ought* to govern).

  If we treat all Taboo-resolvable disagreements as "merely verbal," we lose the ability to explain why scientists fight over "Is a virus alive?" or why activists fight over "Is a trans woman a woman?" These aren't confusion; they are conflicts over how to carve the world for specific purposes.

  Here is the principle that captures your verdicts, followed by the analysis you requested.

  ### The Principle: Conceptive Utility & Normative Aim

  A dispute over a term $T$ is **Merely Verbal** if and only if:
  1.  **Factual Convergence:** After tabooing $T$, both parties agree on all underlying non-semantic facts (physics, biology, behavior, etc.).
  2.  **Normative Indifference:** There is no significant conflict regarding which precisification of $T$ *ought* to be adopted, because the choice of concept carries no downstream consequences for theory-building, normative status, or practical inference.

  A dispute is **Substantive** (specifically, a *Substantive Metalinguistic Negotiation*) if:
  1.  **Factual Convergence** holds (they agree on the facts).
  2.  **Normative Conflict** holds: The parties disagree on which concept *should* be associated with $T$ because they have conflicting **theoretical goals** (e.g., predictive power, explanatory integration) or **normative goals** (e.g., justice, rights, social organization).

  ---

  ### Why This Principle Fits Your Cases

  This principle relies on the work of philosophers like David Plunkett, Tim Sundell, and Sally Haslanger. It treats concepts not as mirrors of nature, but as **tools**. A dispute is merely verbal if the tool choice doesn't matter. It is substantive if the tool choice changes what we can *do* with the theory or society.

  #### 1. Cases that force Clause 2 (Normative Indifference)
  *   **Tomato (Fruit/Vegetable), Hot Dog (Sandwich), Sound (Forest):**
      *   **Analysis:** In these cases, Factual Convergence is met. But crucially, Normative Indifference is also met. Whether we classify a tomato as a fruit in a botany textbook vs. a vegetable in a cookbook changes nothing about how we grow it, cook it, or tax it (unless a specific law says otherwise). The context resolves the utility.
      *   **Why it forces the clause:** If you only had Clause 1 (Factual Convergence), these would be grouped with Virus and Pluto. You intuitively feel they are different. Clause 2 explains why: there is no "better" concept fighting for dominance; the concepts coexist peacefully in different contexts.

  #### 2. Cases that force the "Substantive" Verdict (Normative Conflict)
  *   **Virus (Alive?):**
      *   **Analysis:** Biologists agree on the facts (replication, no metabolism). But the dispute is substantive because "Life" is a theoretical tool. If "Life" tracks *evolutionary history*, viruses are in. If "Life" tracks *thermodynamic autonomy*, viruses are out. The choice changes how we model biology.
      *   **Why it fits:** This is a conflict of **Theoretical Goals**. It is not merely verbal because the classification dictates which laws of biology apply to the entity.
  *   **Pluto (Planet?):**
      *   **Analysis:** Astronomers agree on the orbital facts. The dispute was substantive because "Planet" is a tool for modeling solar system formation. If Pluto is a planet, our model of "clearing the neighborhood" breaks.
      *   **Why it fits:** Like the virus, this is about **Explanatory Integration**. The IAU vote wasn't just dictionary editing; it was a decision about which conceptual framework yields better predictions.
  *   **Trans Woman (Woman?):**
      *   **Analysis:** Parties may agree on biological traits and self-identification facts. The dispute is substantive because "Woman" is a **Social/Kind Concept**. One side aims for a concept that tracks reproductive biology (for specific medical or statistical aims); the other aims for a concept that tracks social identity and protects against oppression (ameliorative project).
      *   **Why it fits:** This is a conflict of **Normative Goals**. It is not merely verbal because the classification governs access to rights, spaces, and social recognition. The "stakes" you mentioned are actually *conceptual consequences*.
  *   **Free Will:**
      *   **Analysis:** Compatibilists and Incompatibilists often agree on the physics. The dispute is about which capacity is the **Ground of Moral Responsibility**.
      *   **Why it fits:** Conflict over the **Normative Aim** of the concept (justifying punishment vs. describing causal chains).

  ---

  ### Application to New Cases

  #### (i) Is a tomato a vegetable for tariff purposes?
  *   **Verdict:** **Substantive.**
  *   **Reasoning:** While botanically trivial, the context ("for tariff purposes") introduces a **Normative Aim**. The classification determines tax liability and legal outcomes. *Nix v. Hedden* (1893) was not a botany lesson; it was a ruling on which concept serves the intent of the Tariff Act. The dispute is about legal consequence, not plant biology.
  *   **Principle Check:** Factual Convergence (Yes) + Normative Conflict (Yes, money/law depends on it).

  #### (ii) Is mathematics discovered or invented?
  *   **Verdict:** **Substantive.**
  *   **Reasoning:** This looks verbal (what do you mean by "discover"?), but it is substantive because it reflects a conflict over the **Ontological Status** of abstract objects. If math is discovered, it implies Platonism (math exists independently). If invented, it implies Formalism or Constructivism. This changes how we view truth, necessity, and the relationship between mind and reality.
  *   **Principle Check:** Factual Convergence (Yes, agree on theorems) + Theoretical Goal Conflict (Yes, nature of reality).

  #### (iii) Is someone in a persistent vegetative state (PVS) alive?
  *   **Verdict:** **Substantive.**
  *   **Reasoning:** Biologically, they are metabolically active. But "Alive" in this context functions as a proxy for **Moral Status**. If they are "alive" in the full sense, certain rights attach. If they are "biologically functioning but person-dead," different norms apply. This is a high-stakes conceptual negotiation regarding end-of-life care.
  *   **Principle Check:** Factual Convergence (Yes) + Normative Conflict (Yes, rights/ethics depend on it).

  ---

  ### Honesty Check: Limitations and Overturning Verdicts

  I am **85% confident** in this principle as a diagnostic tool. It aligns with the state-of-the-art in metaontology (specifically the "Metalinguistic Negotiation" framework). However, there are tensions.

  #### 1. The Verdict You Should Consider Overturning: Pluto
  You leaned toward "Pluto is Substantive." While my principle validates that (due to theoretical goals), many philosophers of science argue the IAU decision was ultimately a **stipulative cleanup** to save a useful generalization.
  *   **The Tension:** If the scientific community *agrees* on the new definition (as they mostly have now), the dispute *becomes* merely verbal in hindsight. The substantive part was the negotiation *during* the debate. Now, it is settled usage.
  *   **Advice:** Treat Pluto as **Historically Substantive, Currently Verbal.** The fight mattered then; now it's just terminology.

  #### 2. The Point of Least Confidence: Free Will
  The Free Will case is the messiest. Some hard incompatibilists argue the Compatibilists are *changing the subject* (truly verbal). Some Compatibilists argue Incompatibilists are *obsessed with magic* (substantive error).
  *   **The Risk:** My principle classifies it as Substantive (Metalinguistic Negotiation). But it is possible that one side is simply making a factual error about the requirements of responsibility. If one side is factually wrong about the nature of responsibility, it's not a negotiation; it's a mistake.
  *   **Confidence:** Low. This case might bleed out of "verbal vs. substantive" into "correct vs. incorrect normative theory."

  #### 3. The "Trans Woman" Case Nuance
  I must be precise here. Classifying this as a "Substantive Metalinguistic Negotiation" does **not** imply both sides have equal validity. It means the *structure* of the disagreement is about which concept to use.
  *   **Philosophical Consensus:** Most contemporary social ontologists (like Haslanger) argue that the **Ameliorative Project** (defining concepts to serve justice) is the correct methodological approach. Therefore, the dispute is substantive because one side is arguing for a concept that fails to capture the relevant social reality (oppression/identity), while the other is arguing for one that does.
  *   **Why it's not "Just Verbal":** If it were merely verbal, we could say "You use definition A, I'll use definition B, no harm done." But because the concept governs social treatment, we *cannot* do that. We must decide which concept governs. That necessity makes it substantive.

  ### Summary
  Your "Taboo" test detects **Factual Convergence**. You need to add a test for **Conceptive Utility**.
  *   **Merely Verbal:** We agree on facts, and it doesn't matter which word we use (Tomato/Culinary).
  *   **Substantive:** We agree on facts, but we are fighting over which tool (concept) is better for the job we are trying to do (Science, Law, Justice).

  This preserves your intuitions without resorting to "stakes" as a brute force explanation. The "stakes" are high *because* the conceptual utility is high.
