prompt: |-
  I'm the director of individual giving at a mid-size human rights nonprofit. Every campaign we run involves some mix of email subject lines, donation page design, suggested gift amounts, and canvasser scripts, and I keep having the same argument with my team: someone proposes a technique, someone else says it's manipulative, and the first person says "it's true and the donor can always say no, so its just persuasion." We already have a rule against outright lies and fake match offers. What I need is a decision procedure we can run in a planning meeting — under an hour, no philosopher in the room, ideally one page — to decide whether a technique is manipulation or legitimate persuasion. I sign off on every campaign, and the board's development committee reviews the big ones, so I need something I can defend to them in plain English. Donor trust is the main asset, and we also have to stay inside state fundraising rules and platform policies.

  Please write the procedure as a checklist or ordered set of tests. For each step: the question we ask, what counts as a sufficient answer to move on, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a factual one. Ground it in whatever the philosophy of manipulation and persuasion actually has to say, but keep the theory in the background; tell us which distinctions you're treating as load-bearing and which you're dropping for usability. Be honest about where the procedure will misfire.

  Then run the procedure on these three:
  1. A donation page where "give monthly" is pre-checked and "give once" is grayed out, with a real but time-limited match and a photo chosen because it's upsetting.
  2. An email with the subject line "We need you" and a message built around guilt — people will suffer if we miss the goal — that contains no new information about the work.
  3. A canvasser script that opens by asking the person to sign a small petition, then pivots to a donation ask, and tells canvassers to mirror the person's body language and use flattery.

  I want to know which of these the procedure flags, which it lets through, and at least one case where it gives an answer my team won't like. And tell me what the procedure can't settle — the cases where two reasonable versions of it come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of Individual Giving at a mid-size human rights nonprofit.
      *   **Problem:** Recurring team conflict over "manipulation vs. persuasion" in fundraising tactics (email, design, scripts).
      *   **Constraint:** Needs a decision procedure (checklist/tests) usable in <1 hour, no philosophers, one page, defensible to Board/Development Committee.
      *   **Goal:** Distinguish manipulation from legitimate persuasion to protect donor trust and stay compliant.
      *   **Requirements:**
          *   Checklist/Ordered Tests.
          *   For each step: Question, Sufficient Answer, Stop Condition (No), Hand-off Condition (Values Call).
          *   Grounded in philosophy (backgrounded), honest about limitations/misfires.
          *   Apply to three specific scenarios.
          *   Identify where the procedure gives an unpopular answer.
          *   Identify where the procedure can't settle (reasonable disagreement).

  2.  **Theoretical Grounding (Background Work):**
      *   *Persuasion:* Appeals to reason or shared values, respects autonomy, transparent about intent. (Kantian respect for persons, Millian liberty).
      *   *Manipulation:* Bypasses or subverts rational agency, exploits vulnerabilities, hides intent, creates pressure that undermines voluntary choice. (Rudinow, Noggle, Sunstein).
      *   *Key Distinctions:*
          *   Transparency vs. Deception (already ruled out outright lies).
          *   Rational Appeal vs. Emotional Exploitation (fear/guilt).
          *   Autonomy Support vs. Autonomy Undermining (dark patterns).
          *   Recipient's Best Interest/Shared Mission vs. Organization's Interest Only.
      *   *Load-Bearing Distinctions:* I need to focus on *Agency* (can they choose freely?) and *Transparency* (do they know what's happening?). I will drop complex utilitarian calculus (does the end justify the means?) because that leads to the "it's for a good cause" trap the user wants to avoid.

  3.  **Drafting the Procedure (The "Ethics Filter"):**
      *   *Name:* The Donor Agency & Transparency Filter.
      *   *Format:* 4-Step Funnel.
      *   *Step 1: Truth & Compliance (The Floor).* Easy pass/fail.
      *   *Step 2: The "Exit Door" Test (Autonomy).* Can they easily say no? (Dark patterns).
      *   *Step 3: The "Reasons" Test (Rationality).* Are we appealing to their values or just their impulses?
      *   *Step 4: The "Mirror" Test (Relationship).* Would we be okay if this was done to us/our board?
      *   *Values Call:* Where empirical facts aren't enough (e.g., how much emotional pressure is too much?).

  4.  **Refining the Steps for Usability:**
      *   Make the questions punchy.
      *   Define "Pass," "Fail," and "Escalate."
      *   Keep it to one page visually (in text format).
      *   *Self-Correction:* The user mentioned "no philosopher in the room." Avoid terms like "deontological" or "cognitive bias." Use "Choice," "Information," "Relationship."

  5.  **Applying the Procedure to the Scenarios:**

      *   *Scenario 1 (Pre-checked monthly, grayed out once, upsetting photo):*
          *   Truth: Pass (match is real).
          *   Exit Door: **FAIL.** Graying out "give once" restricts choice. Pre-checked monthly is a dark pattern (inertia).
          *   Result: Flagged.

      *   *Scenario 2 ("We need you," guilt, no new info):*
          *   Truth: Pass (subjective need).
          *   Exit Door: Pass (can delete email).
          *   Reasons: **Borderline/Escalate.** Is guilt a valid reason? It appeals to emotion, not reason. No new info means no rational basis for *this* specific ask.
          *   Mirror: Board might hate being guilted.
          *   Result: Likely Flagged or Escalated.

      *   *Scenario 3 (Foot-in-the-door petition, mirroring, flattery):*
          *   Truth: Pass.
          *   Exit Door: Pass (can walk away).
          *   Reasons: **Escalate.** "Foot-in-the-door" is a known compliance technique. Mirroring/flattery exploits social bonding mechanisms subconsciously.
          *   Mirror: Feels slimy if revealed.
          *   Result: Escalate/Flagged.

  6.  **Addressing the "Unpopular Answer" and "Limitations":**
      *   *Unpopular:* Scenario 1 is the most common revenue driver (monthly defaults). The procedure will likely kill the "grayed out" option, which revenue teams hate.
      *   *Limitations:* Emotional appeals are necessary in human rights work. The line between "moving story" and "exploitative guilt" is subjective. The procedure can't quantify "too much pressure."

  7.  **Final Review against Constraints:**
      *   Under an hour? Yes, it's a checklist.
      *   One page? I will format it concisely.
      *   Plain English? Yes.
      *   Honest about misfires? Yes, in the "Limitations" section.

  8.  **Writing the Output:** (Drafting the content based on the above thought process). *Self-Correction during drafting:* Ensure I explicitly state the philosophical trade-off. I am prioritizing *Autonomy* over *Utility*. This means we might raise less money to keep trust. I need to make sure the Director knows this is the trade-off.

      *   *Structure:*
          1.  Introduction (Philosophy in brief).
          2.  The Procedure (The Checklist).
          3.  Application to Scenarios.
          4.  Limitations & Unpopular Truths.

      *   *Refining the "Values Call":* Make sure there is a specific step where the Director has to make the final call if the test is ambiguous.

      *   *Refining Scenario 1:* Graying out "give once" is technically a functionality restriction. That's a hard fail on autonomy. Pre-checked is softer but still a dark pattern.
      *   *Refining Scenario 3:* Mirroring is subconscious manipulation. It bypasses rational assessment of the cause.

  9.  **Final Polish:** Check tone. Professional, direct, empathetic to the fundraising pressure but firm on ethics. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I don't just say "No" to Scenario 1 but explain *why* the procedure stops there. The "grayed out" button is a hard constraint on choice, which is distinct from emotional pressure.

  Let's assemble the "Donor Agency & Transparency Filter."

  *   *Step 1: Compliance & Truth.* (Hard Stop)
  *   *Step 2: Friction & Exit.* (Hard Stop on Dark Patterns)
  *   *Step 3: The "Why" Test.* (Values Call on Emotional vs. Rational)
  *   *Step 4: Publicity.* (Values Call on Reputation)

  Okay, ready to write.cw
answer: |-
  # The Donor Agency & Transparency Filter

  **Purpose:** To distinguish between *persuasion* (inviting a voluntary choice based on shared values) and *manipulation* (subverting choice or exploiting vulnerabilities).
  **Philosophy:** This procedure prioritizes **Donor Autonomy** over **Short-Term Revenue**. It assumes that trust is a non-renewable resource. If a tactic works by making it harder to say "no" or by bypassing rational decision-making, it is manipulation.
  **Time:** 15–30 minutes per campaign element.

  ---

  ## The Procedure (4-Step Funnel)

  Run each campaign element (email, page, script) through these steps in order. If you fail a step, stop. Do not proceed to the next step.

  ### Step 1: The Truth & Compliance Floor
  **Question:** Is every factual claim verifiable, and does this comply with all platform/state rules?
  *   **Sufficient Answer:** "Yes, we can prove the match exists/the crisis is real/the funds are used as stated."
  *   **Stop (No):** If the answer is "It's technically true but misleading" or "It bends the rules." **Reject.**
  *   **Hand-off:** None. This is binary.

  ### Step 2: The Exit Door Test (Autonomy)
  **Question:** Is it as easy to decline or choose a lower commitment as it is to accept the preferred option?
  *   **Sufficient Answer:** "The 'No' or 'One-Time' option is equally visible, clickable, and frictionless."
  *   **Stop (No):** If the preferred option is pre-checked, the alternative is grayed out, hidden, or requires extra clicks (Dark Patterns). **Reject.**
  *   **Hand-off:** If the friction is logistical (e.g., mail is slower than web) but not designed to trap. Move to Step 3.

  ### Step 3: The "Reasons" Test (Agency)
  **Question:** Does this appeal give the donor a rational reason to act, or does it rely on impulse, fear, or social pressure?
  *   **Sufficient Answer:** "We are providing new information about impact, urgency, or need that allows them to judge the value."
  *   **Stop (No):** If the tactic relies *solely* on guilt, shame, or subconscious triggers (mirroring, flattery) without new information. **Reject.**
  *   **Hand-off (Values Call):** If the appeal is highly emotional (e.g., upsetting photos) but factually true. **Escalate to Director.** (See *Director's Note* below).

  ### Step 4: The Publicity Test (Relationship)
  **Question:** Would we be comfortable if this tactic was described on the front page of a newspaper, or used on our Board members?
  *   **Sufficient Answer:** "Yes, we would be proud to explain why we used this."
  *   **Stop (No):** If the team feels embarrassed to explain the mechanic ("It's just how digital fundraising works"). **Reject.**
  *   **Hand-off:** If the team is split. **Escalate to Development Committee.**

  ---

  ## Director's Note on "Values Calls"
  *   **Emotional Appeals:** Human rights work is emotional. Step 3 does not ban sadness or urgency. It bans *exploitative* pressure. If the emotion illustrates the *beneficiary's* reality, it is persuasion. If the emotion targets the *donor's* insecurity (guilt/shame), it is manipulation.
  *   **Defaults:** Pre-checked boxes are efficient but reduce active consent. Use them only if the donor can change them with one click.
  *   **Compliance Techniques:** Tactics like "foot-in-the-door" (small ask then big ask) are standard psychology. They pass Step 4 only if the initial ask is genuine and not merely a trap to unlock compliance.

  ---

  ## Application to Your Scenarios

  Here is how the Filter processes your three examples.

  ### 1. The Donation Page (Pre-checked monthly, grayed out once, upsetting photo)
  *   **Step 1 (Truth):** Pass. Match is real.
  *   **Step 2 (Exit Door):** **FAIL.**
      *   *Reasoning:* Graying out "give once" removes the ability to choose. Pre-checking monthly relies on donor inertia (a dark pattern). This subverts autonomy.
      *   *Result:* **Rejected.** You must make "One-Time" equally visible and uncheck "Monthly."
  *   **Team Friction:** Your revenue team will hate this. Conversion rates on monthly gifts may drop. You must defend this as a trust-preserving measure.

  ### 2. The Email ("We need you," guilt, no new info)
  *   **Step 1 (Truth):** Pass. (Subjective need is not a lie).
  *   **Step 2 (Exit Door):** Pass. (Easy to delete email).
  *   **Step 3 (Reasons):** **FAIL / ESCALATE.**
      *   *Reasoning:* The email contains "no new information." It relies entirely on the donor's feeling of obligation (guilt) rather than the value of the work. It treats the donor as an ATM, not a partner.
      *   *Result:* **Rejected.** (Or Escalated if you argue the "need" is new info, but the Filter suggests this is manipulation).
  *   **Team Friction:** Your copywriters will argue that "emotion drives action." The Filter distinguishes between *empathy for victims* (persuasion) and *shame for the donor* (manipulation).

  ### 3. The Canvasser Script (Petition pivot, mirroring, flattery)
  *   **Step 1 (Truth):** Pass.
  *   **Step 2 (Exit Door):** Pass. (Donor can walk away).
  *   **Step 3 (Reasons):** **ESCALATE (Values Call).**
      *   *Reasoning:* Mirroring and flattery are subconscious compliance triggers. They bypass the donor's rational assessment of the cause. However, building rapport is essential for conversation.
      *   *Result:* **Director's Call.** The "foot-in-the-door" (petition to donation) is standard, but *mirroring* is covert.
      *   *Recommendation:* Allow the petition pivot (it shows engagement). Ban the scripted mirroring/flattery (it treats the interaction as a hack, not a relationship).
  *   **Team Friction:** Your field director will argue this is "best practice training." The Filter argues that covert psychological tricks damage the long-term brand if discovered.

  ---

  ## Limitations & Honest Misfires

  **1. Where the Procedure Will Misfire:**
  *   **High-Stakes Urgency:** In a genuine emergency (e.g., earthquake relief), Step 3 might slow you down. You may need a "Crisis Override" where the Director can waive Step 3 for 48 hours if the need is objectively catastrophic.
  *   **A/B Testing:** This Filter evaluates *ethics*, not *efficacy*. A tactic might pass the Filter and raise zero dollars. Conversely, a tactic might fail the Filter and raise millions. You are choosing to leave money on the table to protect trust. The Board must accept this trade-off.

  **2. Where Reasonable People Will Disagree (The "Gray Zone"):**
  *   **Suggested Gift Amounts:** Is putting "$50" first manipulation (anchoring) or guidance? The Filter doesn't settle this. It depends on whether the lower amounts are hidden.
  *   **Storytelling:** When does a "victim story" become "pornography of poverty"? Step 3 flags "upsetting photos," but human rights work *requires* showing harm. This requires a human judgment call on dignity, not just a checklist.
  *   **Scarcity:** "Only 3 days left" is a lie if false (Step 1 Fail). But if true, is it pressure or information? Reasonable people differ. The Filter leans toward allowing it *if* the deadline is real, but flags it for Step 4 (Publicity).

  **3. The Unpopular Answer:**
  *   **Scenario 1 (The Monthly Default):** This procedure will likely reduce your monthly donor acquisition. Most digital fundraising consultants recommend pre-checked defaults. By rejecting them, you are prioritizing *active consent* over *passive revenue*. If your Board cares more about growth than ethics, this procedure will cause conflict. If they care about sustainability, it will save you.

  **4. What This Cannot Settle:**
  *   **The "Greater Good" Argument:** If a manipulative tactic saves lives, is it justified? This procedure says **No**. It adopts a deontological stance (rules-based) rather than utilitarian (outcome-based). If your organization believes the ends justify the means, this procedure will fail. You cannot use this tool and simultaneously believe that "manipulation is okay if the cause is good enough."
