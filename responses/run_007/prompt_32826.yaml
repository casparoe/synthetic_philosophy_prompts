answer: |-
  ### Brainstorming the Temporal Map

  To ensure the poem's structure mirrors the hyperbolic discount function, I will map each stanza to a specific phase in the timeline of a preference reversal:

  1.  **Tercet 1 (The Cool State):** Time $t_0$. The agent is distant from the temptation. The discount curve is flat. The Planner (A1) sets the goal, acknowledging the Doer (A2) exists but is currently quiescent.
  2.  **Tercet 2 (The Approach):** Time $t_1$. The temptation draws near. The hyperbolic curve begins to steepen. The Planner (A1) reasserts the plan, trying to hold the line against the rising marginal utility of the immediate reward.
  3.  **Tercet 3 (The Switch Point):** Time $t_{switch}$. The curves cross. The immediate reward's value spikes above the future reward. The Doer (A2) takes over; preference reversal occurs.
  4.  **Tercet 4 (The Aftermath):** Time $t_2$. Consumption is complete. The immediate utility is gone, leaving the future cost. The Planner (A1) returns, but only in the form of regret.
  5.  **Tercet 5 (The Reset):** Time $t_3$. The cycle begins anew. The agent plans for the next period, ignoring the lesson of the previous failure. The Doer (A2) lurks, ready for the next cycle.
  6.  **Quatrain (The Synthesis):** The two voices speak together. This represents the ontological truth: there are not two people, but one agent whose preferences are time-inconsistent.

  ***

  ### The Curve of Will

  The future prize is mine if I abstain.  
  From distant view the curve is flat and bright.  
  The present bite relieves the present pain.  

  I map the path where logic should remain.  
  The slope grows steep within the narrow sight.  
  The future prize is mine if I abstain.  

  The smaller now outweighs the larger main.  
  And sends all rationality to flight.  
  The present bite relieves the present pain.  

  I wake to find the promise was in vain.  
  The morning breaks with unforgiving light.  
  The future prize is mine if I abstain.  

  We stitch the broken timeline once again.  
  Though future hands reject the binding tight.  
  The present bite relieves the present pain.  

  One agent split by time's unyielding chain.  
  Two selves who share the same exhausted night.  
  The future prize is mine if I abstain.  
  The present bite relieves the present pain.  

  ***

  ### Author's Note on Theoretical Liberties

  This poem leans heavily on the **picoeconomic model** of George Ainslie rather than the purely mechanistic discount functions of David Laibson, though it utilizes the mathematics of both. 

  First, the poem portrays a **naive hyperbolic discounter**. The speaker in the fourth tercet ("I wake to find the promise was in vain") expresses surprise at the preference reversal. A *sophisticated* discounter would anticipate the reversal at $t_0$ and seek commitment devices (locking away the credit card, etc.). I chose naivety here because the villanelle's cyclical form demands a failure of will that repeats; sophisticated agents might break the cycle through constraint, which would resolve the tension too early for the poem's tragic arc.

  Second, the closing quatrain asserts "One agent split." This aligns with Ainslie's view that the "planner" and "doer" are not distinct homunculi but rather the same valuation system operating at different temporal distances. However, the Thaler/Shefrin "Planner-Doer" metaphor often treats them as distinct players in an intrapersonal game. I synthesized these views to emphasize that the conflict is not between two enemies, but between two temporal slices of a single identity borrowing utility from a future self who cannot consent to the loan. The rhymes locking together in the final couplet are intended to signify that the Planner's resolution and the Doer's impulse are ultimately paid from the same account.
