prompt: |-
  I'm an undergraduate in an upper-division metaethics seminar, and we're working through non-cognitivism and the Frege–Geach problem this week. A handout my TA distributed summarizes the dialectic as follows:

  "Expressivism is the view that moral judgments are not beliefs but expressions of non-cognitive attitudes, paradigmatically approval and disapproval; 'murder is wrong' is roughly equivalent to 'boo to murder.' The Frege–Geach problem is that moral sentences also occur in embedded contexts, as in 'If murder is wrong, then getting your little brother to murder is wrong,' where the speaker plainly is not expressing disapproval of murder, and so expressivism cannot explain what the sentence means there. The deeper difficulty is that valid inference, as in modus ponens, requires truth-apt premises; since expressivist moral judgments are neither true nor false, expressivism makes moral reasoning impossible. Expressivists have replied by saying that moral terms have both descriptive and prescriptive meaning, but this reply is generally regarded as abandoning the view, because once descriptive meaning is admitted moral judgments become beliefs again and the position collapses into a kind of subjectivism."

  I have a vague sense that this runs together a few different positions and maybe overstates the force of the problem, but I don't trust my own reading enough to pin down where. Could you go through the summary sentence by sentence and tell me which parts a careful expressivist would accept, which are simplifications, and which are inaccurate or unfair? I'd particularly like to know whether the conclusion that expressivism "makes moral reasoning impossible" follows from anything true in the summary, and whether the descriptive-plus-prescriptive reply is really just an abandonment of expressivism.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Undergraduate upper-division metaethics seminar.
      *   **Topic:** Non-cognitivism (Expressivism) and the Frege-Geach Problem.
      *   **Input:** A TA's handout summary of the dialectic.
      *   **Task:** Critique the summary sentence by sentence. Identify what's accurate, what's simplified, and what's inaccurate/unfair from the perspective of a *careful expressivist*.
      *   **Specific Concerns:** Does expressivism really make moral reasoning impossible? Is adding descriptive meaning an abandonment of the view?

  2.  **Analyze the TA's Handout (Sentence by Sentence):**

      *   *Sentence 1:* "Expressivism is the view that moral judgments are not beliefs but expressions of non-cognitive attitudes, paradigmatically approval and disapproval; 'murder is wrong' is roughly equivalent to 'boo to murder.'"
          *   *Critique:* Classic definition. "Boo/Hurrah" is Ayer's emotivism. Modern expressivists (Gibbard, Blackburn) dislike this simplification. It ignores the complexity of normative attitudes (plans, commitments) vs. simple emotions.
          *   *Verdict:* Accurate historically (emotivism), but a simplification/stereotype of contemporary expressivism.

      *   *Sentence 2:* "The Frege–Geach problem is that moral sentences also occur in embedded contexts, as in 'If murder is wrong, then getting your little brother to murder is wrong,' where the speaker plainly is not expressing disapproval of murder, and so expressivism cannot explain what the sentence means there."
          *   *Critique:* This is the core of the problem. The "unasserted context" issue. In a conditional, you aren't actually booing. So what does "wrong" mean there?
          *   *Verdict:* Fairly accurate statement of the problem's setup.

      *   *Sentence 3:* "The deeper difficulty is that valid inference, as in modus ponens, requires truth-apt premises; since expressivist moral judgments are neither true nor false, expressivism makes moral reasoning impossible."
          *   *Critique:* This is the contentious part. Does validity *require* truth-apt premises? Expressivists (Blackburn, Gibbard) argue no. They develop quasi-realism or norm-expressivist logic to save validity. The claim that it makes reasoning *impossible* is the "logic objection" strand of Frege-Geach, but stating it as a fact rather than an objection is biased.
          *   *Verdict:* Controversial/Inaccurate. Assumes a truth-conditional theory of validity which expressivists reject.

      *   *Sentence 4:* "Expressivists have replied by saying that moral terms have both descriptive and prescriptive meaning, but this reply is generally regarded as abandoning the view, because once descriptive meaning is admitted moral judgments become beliefs again and the position collapses into a kind of subjectivism."
          *   *Critique:* This conflates hybrid expressivism with simple descriptivism. Admitting descriptive content doesn't necessarily mean collapsing into subjectivism (which is a cognitive view about mental states). Hybrid views exist (e.g., Copp, Ridge). Also, quasi-realism tries to earn the right to talk of truth without descriptive content. The "collapse into subjectivism" claim is technically confused (subjectivism is cognitive; expressivism is non-cognitive).
          *   *Verdict:* Inaccurate/Unfair. Mischaracterizes the options (Quasi-realism vs. Hybridity) and the definition of subjectivism.

  3.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's intuition. Yes, the handout is a bit dated and stacks the deck against expressivism. It reads like a mid-20th-century critique (maybe Geach himself or early critics) rather than a reflection of the last 40 years of debate (Blackburn, Gibbard, Schroeder).
      *   *Structure:* Go sentence by sentence as requested. Then address the two specific questions (reasoning impossibility, descriptive meaning abandonment).
      *   *Tone:* Academic, supportive, precise (appropriate for an upper-division seminar).

      *   *Sentence 1 Analysis:* Distinguish Emotivism (Ayer) from Expressivism (Blackburn/Gibbard). "Boo/Hurrah" is a caricature of modern views. Modern expressivists talk about "plans" (Gibbard) or "commitments" (Blackburn).
      *   *Sentence 2 Analysis:* This is the most accurate part. It correctly identifies the embedding issue.
      *   *Sentence 3 Analysis:* This is the big philosophical pivot. The handout assumes a truth-conditional semantics for logic. Expressivists challenge this. Mention Blackburn's "logic of attitudes" or Gibbard's "normative logic." The claim "makes moral reasoning impossible" is the *objection*, not a proven fact.
      *   *Sentence 4 Analysis:* This is the messiest part.
          *   Point A: Quasi-realism doesn't add descriptive meaning; it explains truth-talk without it.
          *   Point B: Hybrid expressivism *does* add descriptive meaning but denies it collapses into subjectivism (subjectivism = belief about one's own attitudes; hybrid = belief + attitude).
          *   Point C: "Collapses into subjectivism" is a category error. Subjectivism is cognitivist.

      *   *Addressing Specific Question 1 (Reasoning):* No, it doesn't follow. It only follows if you accept truth-conditional validity. Expressivists offer alternative accounts of validity (consistency of attitudes).
      *   *Addressing Specific Question 2 (Descriptive Meaning):* No, it's not an abandonment. Hybrid expressivism is a stable position. Also, Quasi-realism avoids this by not actually adding descriptive content but mimicking it.

  4.  **Refining the Content (Self-Correction/Nuance Check):**
      *   *Check:* Did I distinguish between Emotivism and Expressivism clearly? *Correction:* Make sure to note that the handout treats them as identical, which is the first error.
      *   *Check:* Is the definition of Subjectivism accurate? *Correction:* Ensure I note that Subjectivism is a *cognitive* view (beliefs about attitudes), whereas Expressivism is *non-cognitive* (having attitudes). So collapsing into subjectivism would actually be *becoming cognitivist*, which contradicts the handout's implication that descriptive meaning just makes it "subjective" in a loose sense.
      *   *Check:* Mention Mark Schroeder? *Decision:* Yes, *Being For* is the modern standard for solving Frege-Geach. Worth a mention for an undergrad to look up.
      *   *Check:* Is the handout *wrong* or just *one side*? *Decision:* It presents objections as settled facts. That's the main unfairness.

  5.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Quasi-Realism" (saving expressivism without descriptive content) and "Hybrid Expressivism" (accepting descriptive content) is clear, as the handout conflates them.

  6.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Your intuition is excellent. This handout is a classic example of a "stacked deck" summary. It presents mid-20th-century objections to emotivism as if they are settled refutations of contemporary expressivism. It conflates distinct views (emotivism, expressivism, quasi-realism, hybridity) and presents contested philosophical premises (about logic and truth) as undeniable facts.

  For an upper-division seminar, you are right to be suspicious. A careful contemporary expressivist (like Simon Blackburn, Allan Gibbard, or Mark Schroeder) would accept very little of this summary without significant qualification.

  Here is a sentence-by-sentence breakdown of what a careful expressivist would accept, what they would call a simplification, and what they would reject as inaccurate.

  ### Sentence 1
  > "Expressivism is the view that moral judgments are not beliefs but expressions of non-cognitive attitudes, paradigmatically approval and disapproval; 'murder is wrong' is roughly equivalent to 'boo to murder.'"

  *   **Accept:** The claim that moral judgments are not primarily beliefs and involve non-cognitive attitudes.
  *   **Simplification:** The identification of expressivism with the "Boo/Hurrah" model. This is **Emotivism** (A.J. Ayer, C.L. Stevenson), which is the grandfather of expressivism. Contemporary expressivists generally reject the "Boo" model as too simplistic. They prefer to characterize the attitudes as *plans* (Gibbard), *commitments* (Blackburn), or *norm-acceptances*. Moral judgment is more like deciding what to do than like cheering at a football game.
  *   **Inaccuracy:** By equating expressivism with the "Boo" model, the handout sets up a straw man. It makes the view seem psychologically shallow, which makes the subsequent logical problems seem more devastating than they are for more sophisticated versions of the view.

  ### Sentence 2
  > "The Frege–Geach problem is that moral sentences also occur in embedded contexts, as in 'If murder is wrong, then getting your little brother to murder is wrong,' where the speaker plainly is not expressing disapproval of murder, and so expressivism cannot explain what the sentence means there."

  *   **Accept:** This is a fair statement of the **embedding problem** (the first horn of the Frege-Geach dilemma). In a conditional antecedent ("If murder is wrong..."), the speaker is not actually expressing an attitude. If the meaning of "wrong" *is* the expression of an attitude, the conditional seems to lack meaning.
  *   **Simplification:** It implies expressivists have *no* explanation. Contemporary expressivists argue that the attitude is present in a different mode (e.g., hypothetically accepted) or that the semantic content is distinct from the psychological state.
  *   **Verdict:** This is the strongest part of the handout. It correctly identifies the linguistic data that any expressivist must explain.

  ### Sentence 3
  > "The deeper difficulty is that valid inference, as in modus ponens, requires truth-apt premises; since expressivist moral judgments are neither true nor false, expressivism makes moral reasoning impossible."

  *   **Accept:** That this is a common *objection* raised against expressivism (the **logic problem**).
  *   **Inaccurate/Unfair:** This sentence presents a contested philosophical premise as a fact. It assumes a **truth-conditional theory of validity** (that an argument is valid only if it preserves truth between propositions). Expressivists explicitly reject this.
      *   **Blackburn's Quasi-Realism:** Argues we can talk of "truth" and "validity" in ethics without committing to moral facts, by analyzing what it *means* to call an argument valid (roughly: you cannot hold the premises without being committed to the conclusion).
      *   **Gibbard/Schroeder:** Argue for a logic of consistency among attitudes/plans. Validity isn't about truth-preservation; it's about **attitude-consistency**. If you disapprove of murder, and you accept the conditional, logic demands you disapprove of getting your brother to murder. You aren't "reasoning about truths," you are "reasoning about attitudes."
  *   **Verdict:** The claim that expressivism "makes moral reasoning impossible" is the *conclusion of the objection*, not a neutral description of the view. A careful expressivist would say, "Expressivism requires a *different explanation* of reasoning, not the abandonment of reasoning."

  ### Sentence 4
  > "Expressivists have replied by saying that moral terms have both descriptive and prescriptive meaning, but this reply is generally regarded as abandoning the view, because once descriptive meaning is admitted moral judgments become beliefs again and the position collapses into a kind of subjectivism."

  *   **Simplification:** This conflates two very different expressivist strategies: **Quasi-Realism** and **Hybrid Expressivism**.
      *   **Quasi-Realists (Blackburn/Gibbard):** Do *not* admit descriptive meaning. They try to explain why moral language *looks* descriptive without it actually being so. The handout ignores this entire (dominant) strand of the literature.
      *   **Hybrid Expressivists (e.g., Daniel Copp, Michael Ridge):** *Do* admit descriptive meaning but argue this does not collapse the view.
  *   **Inaccurate:** The claim that admitting descriptive meaning collapses the view into **subjectivism** is technically confused.
      *   **Subjectivism** is a *cognitivist* view (e.g., "X is wrong" means "I disapprove of X"). It claims moral judgments are beliefs about one's own psychology.
      *   **Expressivism** claims moral judgments are the attitudes themselves.
      *   If an expressivist admits descriptive content, they become a **Hybrid Expressivist** (the sentence expresses a belief *and* an attitude). This is distinct from Subjectivism. It does not "abandon" the core insight that moral judgment essentially involves a non-cognitive attitude.
  *   **Verdict:** This is the most misleading sentence. It suggests the only way to solve Frege-Geach is to become a descriptivist/subjectivist, ignoring Quasi-Realism (which solves it without descriptivism) and Hybridity (which solves it without becoming subjectivism).

  ---

  ### Addressing Your Specific Questions

  #### 1. Does the conclusion that expressivism "makes moral reasoning impossible" follow from anything true in the summary?
  **No.** It only follows if you accept the premise in Sentence 3 that "valid inference... requires truth-apt premises."

  This premise is the heart of the debate, not a neutral starting point. Expressivists argue that logic is not solely about truth-preservation. For example, imperative logic exists ("Close the door!" implies "Don't leave the door open!"), even though imperatives aren't true or false. Similarly, expressivists argue there is a logic of attitudes.

  If you accept the truth-conditional definition of validity, then yes, expressivism struggles. But a careful expressivist will challenge the definition of validity, not the expressivist theory. Therefore, the claim that reasoning is "impossible" is an exaggeration used to motivate the objection, not a proven consequence of the view.

  #### 2. Is the descriptive-plus-prescriptive reply really just an abandonment of expressivism?
  **No.** This is a significant mischaracterization of **Hybrid Expressivism**.

  Traditional ("Pure") Expressivism says:
  *   "Murder is wrong" expresses *only* an attitude (No belief).

  Subjectivism says:
  *   "Murder is wrong" expresses *only* a belief about attitudes (No attitude expressed directly).

  Hybrid Expressivism says:
  *   "Murder is wrong" expresses *both* a belief (e.g., that murder violates social norms) *and* an attitude (disapproval).

  Admitting descriptive content does not force you to say moral judgments are *merely* beliefs (which would be cognitivism/subjectivism). As long as you maintain that the *essential* function of moral judgment is to guide action via non-cognitive attitudes, you are still an expressivist. You are just a more complex one.

  Furthermore, as noted above, the handout completely ignores **Quasi-Realism**, which is the most famous reply to Frege-Geach. Quasi-realists (like Blackburn) argue you don't need descriptive meaning at all; you just need to explain why moral language *mimics* descriptive language so well. To say the only reply is "add descriptive meaning" is to ignore the last 40 years of metaethical literature.

  ### Summary for Your Seminar
  If you want to push back in class, your strongest points are:
  1.  **Distinction:** The handout conflates **Emotivism** (Boo/Hurrah) with **Expressivism** (Plans/Commitments).
  2.  **Logic:** The handout assumes a truth-conditional theory of logic is the only game in town. Expressivists offer alternative accounts of validity (consistency of attitudes).
  3.  **Options:** The handout ignores **Quasi-Realism** (earning the right to truth-talk without descriptive content) and mischaracterizes **Hybrid Expressivism** (which admits content without collapsing into subjectivism).

  The handout reads like a summary written by a critic of expressivism (perhaps from the 1970s) rather than a neutral overview of the current dialectic.
