          3.  Strict Presuppositions vs. Compatible Ideas.
          4.  Pure Retributivist Analysis & Concrete Changes.
          5.  Pure Consequentialist Analysis & Concrete Changes.
          6.  Conclusion/Summary.

      *   *Refining the "Implicit Theory":* It's best described as 'Limit Retributivism'. Desert sets the bounds, utility moves the needle within them. Or 'Mixed Theory'. Let's go with a 'Hybrid of Culpability and Administrative Utility'.
      *   *Key Distinction:* Is the discount a *reward* (consequentialist) or a *recognition of reduced blameworthiness* (retributive)? The current system claims both.
      *   *British English Check:* "Offence," "Defence," "Programme," "Centre," "Labour," "Authorise," "Sentencing Council," "Crown Court."

      *(Self-Correction during drafting)*: I need to be careful not to say the current system *is* incoherent. The prompt asks if it *is* coherent. I should argue it represents a specific type of coherence (hybridity) rather than a logical failure, but highlight where the tensions lie.
      *   *Strict Presupposition:* The practice *requires* that the state's interest in efficiency is a legitimate mitigating factor. It *requires* that culpability is dynamic.
      *   *Pure Retributivism:* Would likely reject the "efficiency" justification entirely. Might accept "remorse" as reducing culpability.
      *   *Pure Consequentialism:* Would make the discount flexible and risk-based, not tariff-based.

  9.  **Final Review against Constraints:**
      *   British English? Yes.
