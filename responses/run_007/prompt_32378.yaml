  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Criminal law student confused by the apparent contradiction between retributive rhetoric ("just deserts," punishment fits the crime) and the practical reality of early guilty plea discounts (sentence reduction for procedural efficiency/remorse).
