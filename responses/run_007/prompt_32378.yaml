      *   Start with "Summary:"? Yes.
      *   Address all parts of the prompt? Yes.

  10. **Final Polish:** Ensure the distinction between "what the practice presupposes" and "what fits well" is sharp. The practice *presupposes* that justice has an administrative cost that can be traded against desert. It *fits well* with rehabilitation but doesn't *require* it.

      *(Drafting the Summary)*: Needs to be one sentence. "The early guilty plea discount presupposes a hybrid theory of limit retributivism where desert sets the boundaries but administrative utility and dynamic culpability determine the specific quantum, meaning pure theories would either abolish the efficiency-based reduction or make the discount uncapped and risk-dependent." -> A bit long. Let's tighten. "The practice presupposes a hybrid theory where desert sets the sentencing range but administrative utility and dynamic culpability justify mitigation, implying that pure retributivism would abolish efficiency-based discounts while pure consequentialism would render them uncapped and risk-dependent."

