      *   *Premise (3) & (4):* This is the crux of the extension. It claims the structure of promising is identical to the Toxin Puzzle regarding the *temporal location of benefits*. It asserts that the "benefit" of promising (social capital, gratitude) is received *now*, leaving the future act cost-only.
