answer: |-
  This is a fantastic puzzle, and your friend has effectively reconstructed a version of the "Skeptical Challenge to Obligation" that philosophers like David Gauthier and Gregory Kavka himself wrestled with in the 80s and 90s. It's a powerful argument because it uses the intuitive impossibility of the Toxin Puzzle to infect our everyday moral practices.

  However, the argument relies on a subtle but fatal equivocation in **Step (4)**.

  While you could reject Premise (1) (the theory of intention), doing so comes with a high philosophical bill (it risks making intention seem magical or irrational). The cleaner, more robust move is to reject **Step (4)** by exposing the disanalogy between the Toxin Puzzle and real-world promising.

  Here is the breakdown of why Step (4) fails, followed by the "bill" you have to pay to accept that rejection.

  ### The Primary Rejection: Step (4) (The Disanalogy)

  Your friend's argument hinges on the claim that the "social benefit is banked immediately" upon promising, leaving the future act cost-only. This is empirically and structurally false.

  **1. The Payoff Structure is Different**
  *   **In the Toxin Puzzle:** The billionaire's mechanism is *magic*. He pays based on a scan of your *intention* at midnight. The actual drinking is causally severed from the reward. Once midnight passes, the game is over. Drinking the toxin literally changes nothing about your wealth or status.
  *   **In Promising:** The "reward" (trust, reciprocity, relationship stability, self-conception as a reliable person) is **contingent on performance**, not just utterance.
      *   If you promise to help move on Saturday, you do *not* "bank" the gratitude on Wednesday. You bank the *opportunity* for gratitude.
      *   If you fail to show up on Saturday, the gratitude vanishes, and you incur a cost (betrayal, loss of reputation, guilt).
      *   Therefore, on Saturday morning, you *do* have a sufficient reason to help: **avoiding the cost of betrayal and maintaining the relationship.**

  Your friend treats the promise like a transaction where the goods are exchanged at the counter (the moment of promising). But a promise is more like a credit line; the value is only realized if the debt is serviced.

  **2. The "Circularity" Charge is False**
  Your friend argues in (4) that "you said you would" is only a reason if you already take the promise to bind you, which is circular.
  *   **The Counter:** Promises create **normative reasons** through the mechanism of *invited reliance* (a la T.M. Scanlon). When you promise, you intentionally induce an expectation in another person and invite them to rely on you.
  *   On Saturday, the reason to act isn't just "I said so." The reason is: "If I don't act, I will have manipulated my friend's reliance to their detriment." That is a fresh, sufficient reason that exists *on Saturday*, distinct from the need for help (which existed before).

  ### The Secondary Rejection: Premise (1) (The Theory of Intention)

  If you want to be thorough, you should also soften Premise (1).
  *(1) You can only intend to $\phi$ if you believe you will have sufficient reason to $\phi$ when the time comes.*

  This premise assumes a theory of intention called **Straightforward Maximization**. It suggests intention is just a prediction of what your future self will want to do. But many philosophers (most notably **Michael Bratman**) argue that intention is a **planning state**.

  *   **Planning Agency:** Part of being a rational agent is the ability to bind your future self to avoid procrastination or weakness of will. We form intentions *now* precisely to *create* reasons for later.
  *   **The Ulysses Contract:** If I tie myself to the mast (intend to stay), I do so knowing that when the Sirens sing (later), I will have no reason to stay tied. But my *current* intention restricts my *future* options to ensure a better outcome.
  *   If we accept Bratman's view, Premise (1) is too strict. You can intend to $\phi$ now because you have a reason *now* to restrict your future deliberation, even if you know your future self will complain.

  ### The Verdict

  **Reject Step (4).**

  The Toxin Puzzle is a "closed system" thought experiment designed to sever the link between intention and action. Real-life promising is an "open system" where action validates the intention. Your friend has imported the magic rules of the Toxin Puzzle (reward decoupled from action) into the real world (where reward is coupled to action).

  ### What's The Bill?

  If you reject Step (4) and defend the rationality of promising, here is the philosophical price you pay:

  **1. You must accept that Social Facts are Prudential Reasons.**
  You have to accept that things like "reputation," "trust," and "social standing" are not just fuzzy moral concepts but hard, prudential reasons that exist at the time of action. You are claiming that on Saturday, the fear of being seen as a liar is a "sufficient reason" comparable to physical discomfort. If your friend is a hardcore egoist who thinks reputation doesn't matter, this argument won't land.

  **2. You must accept the Normative Power of Speech.**
  You have to accept that saying words ("I promise") can literally change the rational landscape of the future. This leans into **Institutional Fact** (Searle) or **Principle of Fidelity** (Scanlon). You are asserting that the act of promising creates a new reason (the obligation itself) that did not exist before. If your friend demands a physicalist reduction of all reasons, this is a hard sell.

  **3. You abandon Act-Utilitarianism.**
  The friend's argument works perfectly if you assume that every action must be justified by its immediate consequences *at the time of action* (Act-Utilitarianism / Straightforward Maximization). To defeat it, you must adopt **Rule-Utilitarianism**, **Constrained Maximization** (Gauthier), or **Planning Theory** (Bratman). You are arguing that it is rational to follow a disposition (keeping promises) even when breaking it might seem locally optimal in a specific instance.

  ### How to Reply to Your Friend

  Here is a script to put the ball back in their court:

  > "Your argument works for the Toxin Puzzle because the billionaire pays for *intention*, not *action*. Once I have the money, drinking is pure loss. But promises don't work like that. I don't get the 'social benefit' of being a reliable friend until I actually show up on Saturday.
  >
  > If I flake, I lose the trust I was hoping to gain. So on Saturday morning, I *do* have a sufficient reason to help: preserving the friendship and my reputation. The Toxin Puzzle is unique because it severs the link between intention and consequence. Promising strengthens that link. So Step (4) is false: the benefit isn't banked immediately; it's escrowed until performance."

  If they push back and say, "But what if you could get away with breaking the promise secretly?" then you move to the secondary rejection: "Then we rely on the fact that rational agents can bind their future selves (Bratman). I intend now to exclude the option of breaking it later, because being the *kind of person* who keeps promises is more valuable than the specific utility of skipping one move."
