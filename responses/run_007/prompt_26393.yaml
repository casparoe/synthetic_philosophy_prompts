      *   *Selection:* I will advise rejecting **(4)** as the primary move, with a side of softening **(1)**. The disanalogy is that in the Toxin case, the *incentive structure* is severed between intention and action. In promising, the incentive structure (social, moral, psychological) remains attached to the *action*.

