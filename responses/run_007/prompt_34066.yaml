answer: |-
  The dominance of prediction-based training commits the field to a behaviorist view where intelligence is equated with output competence rather than internal cognitive development, whereas fully realizing Turing's educational vision would require abandoning static optimization in favor of embodied, lifelong interaction. Current methods operate on the assumption that understanding emerges from compressing statistical regularities in vast datasets, treating the mind as a fixed function approximator rather than a developing organism. This approach implies that learning is fundamentally about fitting parameters to data distributions, making any appearance of reasoning a byproduct of scale rather than a structural feature of the system. The addition of human feedback does not resolve this philosophical tension because it functions as a reward signal to align outputs with preferences, not as a pedagogical dialogue that reshapes internal reasoning processes. Consequently, the practice remains inconsistent, combining a statistical foundation with a superficial layer of normative guidance without achieving genuine instruction. To adopt Turing's model seriously, developers would need to replace massive pre-training with curated curricula, design architectures capable of continuous structural plasticity rather than fixed weights, and evaluate systems based on their capacity for conceptual growth and adaptation over time instead of static benchmark performance.
