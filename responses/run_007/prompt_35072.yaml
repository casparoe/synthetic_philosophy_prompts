prompt: |-
  So I just had this massive argument with a mate who's doing a philosophy PhD, about Wittgenstein's private language argument — the one where he says a language only you could understand is impossible because there'd be no difference between following a rule correctly and just thinking you're following it, since there's no external check on whether you got it right. I'm a backend engineer and I kept saying this sounds exactly like stuff we deal with all the time, and he kept saying I was missing the point, and we went round in circles for hours.

  Here's what I want. Restate the private language argument in the vocabulary of software engineering — the stuff I work with day to day: private fields vs public APIs, unit tests, the compiler as an external verifier, code review, regression tests, the distinction between "it compiles" and "it's correct", type systems as shared constraints, all of that. Be as faithful as you can. Then give me the residue report: what maps cleanly, what you had to stretch, and what in Wittgenstein's argument has no counterpart in my vocabulary at all.

  And then the bit I actually care about: is my friend right that I'm missing something deep, or is the argument less mysterious than philosophers make it sound once you restate it in terms where the gap between "seems right to me" and "is right" already has a concrete, operational meaning? I want to know whether my engineering vocabulary is adequate to the argument or whether it's flattening something important — specifically, whether the whole thing reduces to "you need a test suite and a reviewer" or whether there's a genuine philosophical remainder that can't be captured that way.

  Keep it to 500 words max. I'm not reading another essay after the one my mate just gave me.
