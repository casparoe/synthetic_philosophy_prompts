answer: |-
  # The Desiderata of Valid Consent

  An adequate theory of consent must explain how an individual's authorization transforms an action that would otherwise be wrongful (e.g., battery, trespass, breach of duty) into a permissible one. To be successful, the theory cannot merely define the word; it must accommodate the normative work consent performs across different social and legal contexts. Below are the core desiderata any such theory must satisfy, followed by an analysis of domain divergence, internal tensions, and the theoretical constraint that proves most destructive to existing accounts.

  ## I. Core Desiderata

  **1. The Normative Transformation Requirement**
  *   **Definition:** The theory must explain the mechanism by which consent alters the moral or legal status of an act. It must account for the "normative power" of the agent to waive rights or authorize intrusion.
  *   **Case/Consideration:** *Medical Ethics.* Without consent, a surgeon cutting into a patient commits battery. With consent, the same physical act is healing therapy. A theory must explain what changes—the physical act is identical, so the change must be in the normative relationship.
  *   **Domain:** Medical Ethics / Criminal Law.

  **2. The Volitional Integrity Constraint**
  *   **Definition:** Consent is invalid if it does not stem from the agent's genuine will. The theory must accommodate invalidating conditions such as coercion, severe deception, or incapacity, even if outward signs of agreement are present.
  *   **Case/Consideration:** *Sexual Ethics.* If a person says "yes" to sex because a partner has threatened to release private photos (sextortion), the act is rape. A theory that validates consent based solely on the utterance "yes" fails this constraint.
  *   **Domain:** Sexual Ethics / Contract Law (Duress).

  **3. The Epistemic Security Requirement**
  *   **Definition:** Consent must be perceptible to the recipient. The theory must protect the recipient's reasonable reliance on outward manifestations of consent, ensuring that social coordination is possible without mind-reading.
  *   **Case/Consideration:** *Contract Law.* Under the "objective theory of contracts," a party is bound by how their offer appears to a reasonable person, even if they secretly intended something else (e.g., *Lucy v. Zehmer*, where a farm sale agreed upon while drinking was binding despite the seller's claim of jest).
  *   **Domain:** Contract Law.

  **4. The Revocability Constraint**
  *   **Definition:** The theory must account for the agent's ability to withdraw consent prior to or during the act. Consent cannot be a one-time irrevocable transfer of authority in contexts involving bodily integrity.
  *   **Case/Consideration:** *Sexual Ethics.* Consent to begin sexual activity does not imply consent to continue it. If an agent says "stop" midway, the partner must cease immediately. Continued action becomes wrongful despite prior consent.
  *   **Domain:** Sexual Ethics / Medical Ethics (Withdrawal of treatment).

  **5. The Scope Specificity Requirement**
  *   **Definition:** Consent is not a blanket waiver; it is limited to the specific act, time, and conditions authorized. Exceeding the scope invalidates the consent.
  *   **Case/Consideration:** *Medical Ethics.* A patient may consent to a biopsy of a mole but not to the amputation of a limb. If the surgeon amputates, the consent is voided regarding the limb, even if the patient authorized the biopsy.
  *   **Domain:** Medical Ethics / Tort Law.

  ---

  ## II. Domain Divergence

  While the desiderata above are general, their weighting and application diverge significantly across domains. An adequate theory must either explain these divergences or admit that "consent" is a family-resemblance concept with no unified theory.

  *   **Security vs. Integrity:** In **Contract Law**, the *Epistemic Security Requirement* dominates. The law prioritizes the stability of transactions over the subjective will of the parties (hence the objective theory of contracts). In **Sexual Ethics**, the *Volitional Integrity Constraint* dominates. A "yes" obtained through subtle pressure or given jokingly is often deemed invalid if the internal will was absent, placing the risk of error on the recipient.
  *   **Revocability:** In **Sexual Ethics** and **Medical Ethics**, the *Revocability Constraint* is nearly absolute; bodily autonomy allows an agent to change their mind at any second. In **Contract Law**, revocability is limited. Once consideration is exchanged or reliance is incurred, an offer or agreement often cannot be revoked without penalty (breach of contract).
  *   **Formalism:** **Contract Law** often requires specific formalities (signatures, writing) to satisfy the *Epistemic Security Requirement*. **Sexual Ethics** increasingly moves toward affirmative verbal or non-verbal communication but generally rejects rigid formalism in favor of contextual understanding.

  ---

  ## III. Tensions and Incompatible Desiderata

  There are pairs of desiderata that appear to pull in opposite directions, creating a structural tension that no theory can fully resolve without prioritizing one value over another.

  **The Tension: Volitional Integrity vs. Epistemic Security**
  *   **The Conflict:** To satisfy *Volitional Integrity*, we must invalidate consent whenever the internal will is compromised (e.g., by hidden coercion or internal hesitation). To satisfy *Epistemic Security*, we must validate consent whenever the outward signs are clear, so recipients can act without fear of retroactive invalidation.
  *   **Why they cannot be jointly satisfied:** If we prioritize Integrity, recipients can never be secure; they risk liability for acts that appeared consensual but were internally coerced. If we prioritize Security, agents lose protection; their "no" (internal or whispered) is overridden by their "yes" (external or coerced).
  *   **Example:** In a **Sexual Ethics** context, if a partner freezes in fear (fawning response) and does not resist, *Epistemic Security* suggests consent (no "no" was signaled), but *Volitional Integrity* suggests violation (no genuine will was present). A theory must choose which error is worse: punishing a confused recipient or violating an silenced agent.

  ---

  ## IV. The Theory-Killing Requirement

  The single requirement that eliminates the most popular families of theories is **The Dual-Aspect Requirement**.

  **The Requirement:** Valid consent must be *simultaneously* an internal exercise of normative authority (Subjective) and an externally verifiable communication (Objective), where neither aspect is reducible to the other.

  **Justification:**
  This requirement dismantles the three dominant families of consent theory:

  1.  **Mental-State Accounts (Eliminated):** These theories argue consent is solely a change in the agent's internal mental state (e.g., "I intend to waive my right"). They fail the **Epistemic Security Requirement**. If consent is purely mental, a recipient can never know if they have permission, making social coordination impossible. They cannot explain why a surgeon is liable for operating on a willing patient who failed to communicate that willingness.
  2.  **Performative/Communicative Accounts (Eliminated):** These theories argue consent is solely the utterance or performance of a conventional sign (e.g., "Saying 'I do'"). They fail the **Volitional Integrity Constraint**. They struggle to explain why consent given at gunpoint, or by an actor on a stage, is invalid despite the clear performance. They reduce the agent to a speech-act machine, ignoring the autonomy that gives the speech act its force.
  3.  **Hybrid Views (Severely Strained):** While hybrids attempt to combine mental states and communication, they typically fail the **Non-Reducibility** clause of this requirement. They usually prioritize one side as the "real" consent and the other as "evidence." When the two come apart (e.g., internal will says yes, external says no, or vice versa), hybrid theories collapse into one of the two pure accounts to resolve the case, thereby inheriting that account's fatal flaw.

  By demanding that consent be *both* authentically internal and reliably external without allowing one to trump the other in all cases, **The Dual-Aspect Requirement** exposes the inability of current theories to handle the messy reality where minds and behaviors diverge.
