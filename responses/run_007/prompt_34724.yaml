  A friend of mine who's into philosophy of math summarized Benacerraf's dilemma for me like this: "Benacerraf showed that platonism about math is false because we can't causally interact with abstract objects, so we couldn't possibly know anything about them. It's basically the same argument as the evolutionary debunking argument against moral realism — if our beliefs are caused by something unrelated to the truth of the propositions, they're unjustified."

  I've heard enough to suspect this isn't quite right but I'm not sure where. Go through it sentence by sentence: what's accurate, what's a common misreading, and what would a platonist push back on? Also, my friend seems to think the dilemma refutes platonism — is that right, or does it just create a burden? And how fair is the comparison to evolutionary debunking?

