prompt: |-
  I am a novelist. My working vocabulary is the vocabulary of narrative craft: point of view, free indirect discourse, narrative tense and mood, story versus discourse, focalization, the ontology of fictional worlds, and the tacit contract between writer and reader about what counts as true within a fiction. I have been reading about the philosophical distinction between indicative conditionals (If Oswald did not shoot Kennedy, someone else did) and subjunctive or counterfactual conditionals (If Oswald had not shot Kennedy, someone else would have). I gather there is a live debate about whether these two kinds of conditional differ in truth conditions or merely in the conditions under which they are assertible, about what the distinction reveals concerning how we reason about possibilities, and about whether a unified semantic theory can cover both.

  Restate this debate—its main positions, its canonical examples, and what is philosophically at stake—in the vocabulary of narrative craft as faithfully as you can. For instance: does the indicative–counterfactual distinction map onto the difference between a character reasoning from within the story-world about what follows from what they know, and an author or reader reasoning about the story from outside about what would have followed had things gone otherwise? Does free indirect discourse, which blends a character's perspective with the narrator's, generate conditionals that are systematically ambiguous between indicative and counterfactual readings, and is that ambiguity philosophically revealing or merely a stylistic artifact? Are there narrative techniques that do things the philosophical semantics predicts should be difficult or impossible, or the reverse?

  Then give me the residue report: which parts of the philosophical debate translate cleanly into narrative terms, which parts you had to distort or fudge, and which parts have no expression in my vocabulary at all. I want to know whether the residue points to something the philosophers are confused about—a distinction that does not cut at the joints of actual narrative practice—or to something my craft vocabulary cannot capture but that a novelist arguably ought to understand.

  Finally, tell me what would change your mind about the translation: which kind of philosophical argument or which kind of narrative example would most likely reveal that your mapping is wrong or incomplete, and where in your reasoning you are least confident.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Novelist with a sophisticated grasp of narrative theory (POV, free indirect discourse, focalization, story/discourse, ontology of fiction, etc.).
      *   **Topic:** The philosophical debate on indicative vs. subjunctive (counterfactual) conditionals (truth conditions vs. assertibility, reasoning about possibilities, unified semantics).
      *   **Task 1:** Restate the philosophical debate using the vocabulary of narrative craft.
      *   **Task 2:** Provide a "Residue Report" (what translated well, what was distorted, what didn't translate).
      *   **Task 3:** Specify what would change my mind about the translation (falsification conditions/confidence levels).
      *   **Constraint:** Faithful translation into narrative terms, exploring the intersection of philosophical semantics and narrative technique.

  2.  **Deconstruct the Philosophical Debate:**
      *   *Indicative Conditional:* "If $P$, then $Q$." (e.g., "If Oswald didn't shoot Kennedy, someone else did.") Assumes the antecedent is epistemically possible within the actual world. Often linked to the Ramsey Test (add $P$ to knowledge stock, see if $Q$ follows).
      *   *Subjunctive/Counterfactual Conditional:* "If $P$ had been, then $Q$ would have been." (e.g., "If Oswald hadn't shot Kennedy, someone else would have.") Assumes the antecedent is false in the actual world but true in nearby possible worlds. Linked to possible worlds semantics (Stalnaker/Lewis).
      *   *The Debate:* Do they differ in *truth conditions* (what makes them true) or just *assertibility conditions* (when it's appropriate to say them)? (The "Adams Thesis" vs. Possible Worlds). Can one theory cover both?
      *   *Stakes:* How we understand causality, knowledge, and the structure of reality vs. epistemic states.

  3.  **Translate to Narrative Craft (Task 1):**
      *   *Concept:* Actual World vs. Story World.
      *   *Indicative:* Character reasoning *within* the diegesis. "If the butler didn't do it (as far as I know), the gardener did." This is epistemic uncertainty within the established text.
      *   *Counterfactual:* Reader/Author reasoning *about* the diegesis. "If the butler hadn't done it, the plot would have collapsed." Or, within the story, a character imagining an alternative past that they know is false.
      *   *Focalization:* Indicative aligns with internal focalization (what the character knows). Counterfactual aligns with external omniscience or retrospective narration (knowing the "true" outcome and imagining deviations).
      *   *Free Indirect Discourse (FID):* The blur zone. "If he hadn't left, she would be here." Is this the character regretting (counterfactual) or deducing (indicative)?
      *   *Story vs. Discourse:* Story (fabula) is the chronological truth. Discourse (sjuzhet) is the presentation. Indicatives often live in Discourse (uncertainty of presentation). Counterfactuals often live in Story (alternative timelines).
      *   *The "Contract":* Indicative respects the current textual reality. Counterfactual breaches it to test its structural integrity.

  4.  **Drafting the Restatement (Iterative Process):**
      *   *Attempt 1 (Mental):* Indicative is like a detective guessing. Counterfactual is like an author rewriting.
      *   *Refinement:* Need more technical terms. Use "epistemic horizon," "narrative necessity," "ontological stability."
      *   *Key Mapping:*
          *   Truth Conditions $\rightarrow$ Narrative Ontology (what is "canon").
          *   Assertibility $\rightarrow$ Narrative Voice/Authority (who is allowed to say this).
          *   Possible Worlds $\rightarrow$ Drafts/Versions/Unwritten Scenes.
          *   Ramsey Test $\rightarrow$ Character Consistency Check.

  5.  **Developing the Residue Report (Task 2):**
      *   *Clean Translations:* The epistemic vs. ontological split maps well to Character Knowledge vs. Authorial Design. FID ambiguity is a great fit for the assertibility debate.
      *   *Distortions:* Philosophy cares about logical truth; Novels care about emotional/narrative truth. "Truth conditions" in fiction are slippery (is it true if the narrator lies?).
      *   *Missing:* The logical formalism (material implication). Novels don't do truth tables. The specific linguistic markers (tense backshifting) are stylistic, not just semantic.

  6.  **Developing the "Change My Mind" Section (Task 3):**
      *   *Philosophical Argument:* If a logician shows that FID conditionals *must* resolve to one type logically, my ambiguity argument fails.
      *   *Narrative Example:* A text that explicitly treats an indicative as a counterfactual without tense shift (e.g., present tense experimental fiction). Or a case where a character's false belief drives the plot in a way that mimics a counterfactual semantic structure.
      *   *Low Confidence:* The mapping of "Possible Worlds" to "Drafts." Philosophers mean metaphysical possibilities; I mean textual variants. This is the weakest link.

  7.  **Refining the Tone:**
      *   Must sound like I'm speaking to a peer (novelist to novelist), not a lecturer to a student.
      *   Use the specific terms requested (focalization, ontology, etc.).
      *   Ensure the philosophical accuracy remains intact despite the metaphorical translation.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address the "Unified Semantic Theory"?
