  ### The Principle: Hierarchy and Non-Fungibility

  Your verdicts are captured by two interacting rules. You can treat this as an algorithm for moral conflict resolution.

  **Rule 1: The Hierarchy of Obligations**
  If one obligation clearly outweighs the other based on a stable hierarchy of value, the conflict is resolved. The weaker obligation is overridden, and fulfilling the stronger one is the "fully right" option.
  *   *Your Hierarchy:* Family/Children > Professional/Colleague > General Strangers. (Seen in Cases 5, 7, and 1).
