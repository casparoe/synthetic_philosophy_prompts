  The bar was loud, the kind of dimly lit APA haunt where name tags stick to damp coasters. N slid into the booth opposite U, setting down a pint of something dark.

  "That brutalism talk was a disaster," N said, signaling the waiter. "Primitive composition facts? Just brute necessities floating out there? I'd rather eat my hat."

  U laughed, loosening a tie. "Agreed. At least universalism has a principle. Everything composes. Clean. Simple. But I saw you shaking your head when I nodded during the Q&A."

  "Because 'clean' isn't always true," N said. "You really buy it? The trout-turkey? The object composed of that trout over there and the turkey in the freezer back at the hotel?"

  "Why not?" U shrugged. "There are some things. They exist. Therefore, there is something composed of them. It's just logic. To deny it, you need a restriction. And where do you draw the line? Contact? Fusion? Life? Any line you draw looks magical. Why *here* and not *there*?"

  "It's not magic, it's parsimony," N countered, leaning in. "Look, I don't deny the trout exists. I don't deny the turkey exists. I deny that there's a *third* thing, a 'trout-turkey,' over and above them. You're multiplying entities without necessity. You're ontologically bloated."

  "Bloated?" U swirled his drink. "Lewis would say I'm taking common sense seriously. You're the one telling me there are no tables. No chairs. No beers. Just simples arranged beer-wise. That's the real cost. You're asking me to deny obvious truths to save on ontology. I'd rather pay the ontological tax."

  "But are we denying the same truths?" N asked. "When I say 'there are no tables,' I mean there are no fundamental composite objects. I can still say 'there are simples arranged tablewise.' I can keep all the ordinary discourse. I'm just giving you a paraphrase. You keep the object; I keep the arrangement. What's the substantive difference?"

  "The difference is the quantifier," U said firmly. "When I say 'there exists a table,' I mean there is an object in the domain of my unrestricted quantifier that is a table. When you say it, you're speaking loosely. We're disagreeing about reality, not just language. If your ideology is simpler but your ontology requires me to deny I'm holding a glass, your theory fails the common sense test."

  N sighed. "Common sense is a bad guide to metaphysics. Common sense said the sun went around the earth. The cost of universalism isn't just ontological bloat; it's that you make existence trivial. If *any* plurality composes an object, then 'existence' loses its weight. You're saying reality is just an infinite heap of overlapping gerrymandered chunks. It makes composition uninformative."

  "Uninformative? Or universal?" U pushed back. "Think about the alternative. You're a nihilist. So when I sit on a chair, I'm hovering over simples. But then, why do the simples support me? Because they're arranged chairwise. So the work is being done by the arrangement, not the object. The object is idle. But if the object is idle, why posit it? Wait—no, that's my argument against *you*. You posit no object. I posit the object. But if the work is done by the simples, why do I need the composite? Because language and thought track composites. We carve the world at its joints. Sometimes the joints are arbitrary, sure, but they're useful."

  "Useful isn't true," N said. "And 'arbitrary' is doing too much work for you. You say any restriction is arbitrary. I say universalism is arbitrary too. Why think composition is automatic? That's just as unmotivated as thinking it only happens for living things. The default should be no composition. Prove composition happens."

  "The default?" U smiled. "Plurality is given. I see the trout. I see the turkey. To say there is *nothing* composed of them is to say there's a gap in reality. A hole where an object could be. That's the magic. I'm not adding anything; I'm just acknowledging that if there are some things, there is a sum of them. It's analytic."

  "It's not analytic if 'sum' implies a unified entity," N shot back. "But look, here's my worry, and be honest. Are we talking past each other? You weigh common sense heavily. I weigh parsimony heavily. You think ontological inflation is cheap; I think it's expensive. You think revisionism about tables is devastating; I think it's a bullet I'm willing to bite. Is there a fact of the matter about who's right, or are we just pricing theoretical costs differently?"

  U paused, taking a long sip. "I want to say there's a fact of the matter. The quantifier is univocal. One of us is wrong about what exists. But... maybe you're hitting on something. If your nihilism saves you from arbitrariness, and my universalism saves me from revisionism, maybe the stalemate is real. But I'd rather be revisionist than magical. I won't posit a brute fact about where composition stops. That's metaphysical superstition."

  "And I won't posit a universe infested with invisible, useless objects just to save the word 'table'," N said. "Maybe that's it. You're protecting language; I'm protecting reality."

  "Or," U said, raising his glass, "you're protecting ideology, and I'm protecting ontology. And neither of us is willing to trade."

  N clinked his glass against U's. "To the Special Composition Question. May it remain special."

  "And may we never agree on the answer," U smiled. "Otherwise, what would we talk about next year?"
