      *   *Objection 2: Commutativity.* If I learn $E$ then $F$, vs $F$ then $E$, SC gives the same result. JC doesn't unless the partitions are independent. If JC is the *real* rule, why does order of experience matter so much?
      *   *Objection 3: Dutch Book.* You can be Dutch-booked if you use JC instead of SC when the evidence *is* certain. If you claim evidence is *never* certain, you're making an empirical claim that might be false.
