prompt: |-
  I'm giving a talk at a formal epistemology workshop next month defending Jeffery conditionalization — not as a handy generalization of Bayes for when you're unsure what you saw, but as the claim that strict conditionalization is basically never what's actually happening when we update. The argument is that all evidence is uncertain evidence; learning experiences that set some proposition to probability 1 are a limiting case that real agents never occupy. The audience is mostly hardcore Bayesians who've spent their careers on strict conditionalization and Dutch-book arguments, plus a couple accuracy-first epistemologists who are sympathetic but will push on the technical details. Nobody in the room works on imprecise probabilities — they just think Jeffrey's rule is a kludge you reach for when your experiment had a measurement error.

  I need a Q&A prep sheet. Give me the objections I'm going to get, in roughly the order they'll come, phrased as closely as possible to how these people would actually say them at the mic. For each objection: a two-minute reply I can give, and a note on where the reply is softest. Order them by how damaging they are, not by how likely. End with the question I'm praying nobody thinks to ask.

  Format it as a numbered list, each entry with:

  1. **The objection** (as a direct quote I might hear)
     - *My reply*: (short paragraph, ~2 min spoken)
     - *Weak spot*: (one sentence on where this could fall apart)
