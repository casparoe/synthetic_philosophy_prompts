  in my decision theory course we've been doing the allais paradox, and i've basically come down on the side that the independence axiom is normatively right — the usual allais choices are just a mistake, with the certainty of the $1M getting a psychological weight it shouldn't have. but i realized i can't actually say what would change my mind about that. so what would count against the independence axiom as a normative constraint on preferences, as opposed to just a description of how people choose? i don't mean the standard allais pattern again. i mean the experimental results that should actually move me (does it matter if the pattern survives incentives, or if people still endorse the allais choices after the common-consequence structure is made obvious and they've seen the sure-thing argument?), and the formal results too — like whether rejecting independence forces you into dynamic inconsistency or regret-type problems, and whether a committed expected utility person should treat those as costs or just bite the bullet. could you rank the possible defeaters from fatal to merely awkward, and be honest about whether the view ends up set up so that its impossible for it to lose? i think i'd personally be most persuaded by evidence that reflective, informed people don't just exhibit allais preferences but defend them as reasonable even after the sure-thing argument is on the table.
