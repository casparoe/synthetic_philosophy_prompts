answer: |-
  Here is a complete lesson plan designed to make the No-Trade Theorem visceral. It focuses on the mechanism of **adverse selection via willingness to trade**, which is the intuitive engine behind Milgrom-Stokey and Aumann.

  ## Activity Title: "The Unraveling Market"

  **Objective:** Students will experience how the mere *willingness* to trade at a specific price conveys private information that should update the counterparty's beliefs, theoretically eliminating gains from trade.

  **Time Allocation:**
  *   **Setup & Instructions:** 15 minutes
  *   **Trading Rounds:** 20 minutes
  *   **Debrief & Theory Mapping:** 55 minutes

  **Materials Needed:**
  *   8 Envelopes (one per pair).
  *   Inside each envelope:
      *   1 "State Card" (Hidden until end): Says **HIGH** (\$100) or **LOW** (\$0).
      *   2 "Signal Cards" (Private): One for Student A, one for Student B.
      *   1 "Trade Log Sheet" (To record offers and decisions).
      *   1 "Reflection Sheet" (Must be filled out before accepting a trade).
  *   Whiteboard for tracking aggregate class results.

  ---

  ### Part 1: Setup & Instructions (15 Minutes)

  **1. The Asset (3 mins)**
  Tell the class: "We are trading an asset. Its true value is either **\$100** or **\$0**. Before you get any information, the probability of each is 50%. The Expected Value (EV) is **\$50**."

  **2. The Information Structure (5 mins)**
  "Inside your envelope is a State Card (the truth) and two Signal Cards. Do not open them yet.
  *   If the State is **HIGH**: 80% of signals will say **'h'**, 20% will say **'l'**.
  *   If the State is **LOW**: 80% of signals will say **'l'**, 20% will say **'h'**.
  *   *Bayesian Check:* If you see **'h'**, your personal EV is **\$80**. If you see **'l'**, your personal EV is **\$20**."
  *(Write these numbers on the board. Keep the math trivial so they focus on the strategy.)*

  **3. The Roles & Rules (5 mins)**
  "Pair up. One is the **Holder** (owns the asset), one is the **Buyer** (has cash).
  *   **Goal:** Maximize your points.
  *   **Mechanism:** 3 Rounds of negotiation.
      *   **Round 1:** Holder makes a Take-It-Or-Leave-It offer. Buyer Accepts or Rejects.
      *   **Round 2:** If Rejected, Holder makes a new offer.
      *   **Round 3:** Final offer. If Rejected, no trade.
  *   **The Catch:** Before the Buyer checks 'Accept' on the Trade Log, they **must** fill out the Reflection Sheet."

  **4. The Reflection Sheet (2 mins)**
  Show the sheet on the projector. It has one critical question:
  > *"If the Holder is willing to sell at this price, what does that tell you about their Signal? How does that change your Expected Value of the asset?"*

  **5. Distribute Envelopes (2 mins)**
  Tell them not to open until you say "Go."

  ---

  ### Part 2: The Trading Game (20 Minutes)

  **Round 1 (7 mins)**
  *   Students open envelopes. They see their private signal. They do *not* see the State Card or their partner's signal.
  *   Holder proposes a price (e.g., \$50).
  *   **Crucial Step:** Walk around. If a Buyer is about to accept, point to the Reflection Sheet. "Have you updated your belief based on the fact that they are selling?"
  *   Record results on the board (Pair #, Price, Trade? Y/N).

  **Round 2 & 3 (8 mins)**
  *   If no trade, they negotiate again.
  *   Encourage them to talk *only* about price, not signals (to simulate the theorem's condition where only the offer is observed, though in reality, cheap talk often happens).
  *   *Instructor Note:* If everyone trades immediately at \$50, stop the game early. That is a data point.

  **Reveal & Scoring (5 mins)**
  *   Students open the "State Card."
  *   Calculate profits:
      *   **Holder:** Price Received (if sold) OR True Value (if kept).
      *   **Buyer:** True Value - Price Paid (if bought) OR 0 (if no trade).
  *   Ask for a show of hands: "Who made a loss on the trade?" (Usually, the Buyer who bought a \$0 asset for \$50).

  ---

  ### Part 3: Debrief & Theory Mapping (55 Minutes)

  This is where the learning happens. Do not just lecture; use their game results.

  **1. The Empirical Result (10 mins)**
  *   Look at the board. Did trade happen? At what price?
  *   *Likely Outcome:* Many pairs traded at \$50 (the prior).
  *   *Ask:* "Pair 3, you traded at \$50. Buyer, what was your signal?" (Likely 'h'). "Holder, what was yours?" (Likely 'l').
  *   *The Trap:* "Buyer, you thought EV was \$80. Holder thought EV was \$20. You met at \$50. You felt like you gained. But look at the State Card. It was LOW (\$0). You lost \$50."
  *   *Ask:* "Why did you lose? You had good information!"
  *   *Target Answer:* "Because the Holder was too eager to sell."

  **2. Mapping to the Theorem (20 mins)**
  Draw the connection between their experience and Milgrom-Stokey/Aumann.

  *   **Common Priors:** "We all started with the 50/50 prior and the 80/20 signal accuracy. That was common knowledge."
  *   **Rationality:** "The theorem assumes we know the other person is rational. In the game, did you assume your partner was trying to win?"
  *   **The Signal of Willingness:** "This is the core. If I am rational, and I hold an asset, I only sell to you if I think the price is *higher* than my value. If you know I am rational, my offer tells you I think the value is low."
  *   **The Unraveling:** "If I offer \$50, you should think: 'He wouldn't sell at \$50 if he had an 'h' signal (EV \$80). He must have an 'l' signal.' If you infer he has an 'l' signal, your EV drops from \$50 to roughly \$20. You won't pay \$50. Market collapses."

  **3. Why Didn't It Collapse in Class? (15 mins)**
  Students will point out that they *did* trade. This is the most important teaching moment.

  *   **Bounded Rationality:** "The theorem requires *common knowledge of rationality*. You knew you were rational. Did you *know* your partner was rational? Did you know they knew *you* were rational?"
  *   **The 'Fool' Model:** "In the game, you traded because you thought: 'Maybe I'm smarter than him,' or 'Maybe he doesn't understand the signals.' The No-Trade theorem breaks if you think there is a chance your counterparty is irrational (a 'noise trader')."
  *   **Risk Preferences:** "The theorem assumes risk neutrality. If the Buyer was risk-seeking, they might gamble on the \$100 outcome even with bad news."

  **4. Real World Implications (10 mins)**
  *   **Financial Markets:** "If this theorem holds, why do stock markets exist?"
      *   *Answer 1:* Liquidity needs (hedging), not speculation. (I need cash for tuition, so I sell stock even if I think it will go up).
      *   *Answer 2:* We don't have common priors. (I think the tech boom is real; you think it's a bubble. We disagree on the model, not just the signal).
      *   *Answer 3:* Bounded rationality. (I think I'm smarter than you).
  *   **Takeaway:** "The No-Trade theorem isn't a description of reality; it's a benchmark. If you see trade happening, one of the assumptions (common priors, rationality, no hedging motives) must be violated. Your job as economists is to find which one."

  ---

  ### Troubleshooting: What Will Go Wrong & How to Handle It

  **1. Students trade instantly at \$50 without thinking.**
  *   **Prediction:** This is the most common outcome. They treat it like a standard supply/demand game.
  *   **Fix:** Do not stop them. Let them trade. In the debrief, use this as evidence of *violated assumptions*. "The theorem says you shouldn't have traded. You did. Therefore, in your mind, you did not believe your partner was fully rational, or you didn't process the signal of their offer." This validates the theorem by showing the cost of ignoring it (the Buyers who lost money).

  **2. Students share signals verbally ("I have an 'h', you?").**
  *   **Prediction:** They will try to collude to "beat the market."
  *   **Fix:** Allow it for one pair, forbid it for others. In the debrief, compare them. "Pairs that shared signals found the true value faster. Pairs that didn't share but traded anyway got burned. This shows that *private* information + trade is dangerous; *public* information eliminates the speculation motive entirely."

  **3. The Bayesian Math is too hard.**
  *   **Prediction:** Students freeze on the EV calculation.
  *   **Fix:** Put the EV numbers (\$80 for 'h', \$20 for 'l') on the board *before* the game starts. Do not make them calculate it. The lesson is about the *strategic inference*, not the arithmetic.

  **4. Students get bored/frustrated if no trade happens.**
  *   **Prediction:** If a pair figures out the theorem mid-game, they stop trading.
  *   **Fix:** Award a small "consolation bonus" (5 points) to pairs that *did not trade*. This incentivizes them to find the No-Trade equilibrium, reinforcing the lesson.

  ### Instructor's Note on Limitations (For the Debrief)

  Be honest about where the analogy breaks. The classroom game cannot enforce **Common Knowledge of Rationality (CKR)**.
  *   **In the Game:** You can tell them "Assume your partner is rational." But they won't *believe* it deep down. They will think, "Maybe Sarah didn't read the instructions."
  *   **In the Theorem:** CKR is an infinite recursion (I know you know I know...).
  *   **The Gap:** The theorem describes a world of pure logic. The classroom (and Wall Street) is a world of psychology. The value of the theorem is that it forces you to ask: *"Am I trading because I have information, or because I think the other guy is dumb?"* If it's the latter, you are gambling, not investing.

  ### Summary of Takeaways for Students
  1.  **Trade is Informative:** An offer is not just a price; it is a signal of private information.
  2.  **Adverse Selection:** In markets with asymmetric information, the only people willing to trade at the "average" price are those who know the value is below average.
  3.  **The "Greater Fool":** Speculative trade requires believing you are smarter than the counterparty. If you assume everyone is equally smart (common priors + rationality), speculative trade vanishes.
