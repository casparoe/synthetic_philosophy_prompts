          *   *Self-Locating Uncertainty (Sebens-Carroll):* Focuses on the moment *after* branching but *before* the observer knows the result. There is genuine uncertainty about *which* copy you are.
          *   *What they capture:* They address the *normative* aspect (credence/action) rather than just the *ontological* aspect (existence of branches). They don't rely on spatial intuition which misleads in Hilbert space.

