answer: |-
  **Essay Question**

  Parfit's leveling-down objection is often taken to refute telic egalitarianism in favor of prioritarianism. However, this victory may come at a cost. Write an essay that addresses the following four points in continuous prose: (i) State the leveling-down objection, ensuring you distinguish between a leveled-down outcome being better in one respect versus better all things considered; (ii) Identify the precise premise of telic egalitarianism that prioritarianism rejects to escape this objection; (iii) Assess whether prioritarianism can adequately explain the comparative complaint that it is unfair for one person to be worse off than another through no fault of their own, even in cases where no feasible transfer could raise the worse-off person's welfare, without smuggling the abandoned premise back in; and (iv) Reach a reasoned verdict on whether the leveling-down objection successfully establishes prioritarianism or merely shows that egalitarians must refine their view.

  ***

  **Model Answer**

  The leveling-down objection posits a scenario where equality is achieved solely by harming the better-off, leaving the worse-off no better than before. Telic egalitarianism, which holds that equality is intrinsically valuable, appears committed to the claim that this leveled-down outcome is better in at least one respect than the unequal status quo. Prioritarianism escapes this counterintuitive result by denying that the leveled-down world is better in any respect. To understand the significance of this escape, one must distinguish between an outcome being better *pro tanto* (in one respect) and better *all things considered*. A sophisticated telic egalitarian can concede that leveling down is worse all things considered because the loss of welfare outweighs the gain in equality. However, the objection bites because the egalitarian must still affirm that the leveled-down world is *pro tanto* better regarding equality. Prioritarianism avoids this by denying that there is any respect in which the leveled-down world is an improvement. Since no one benefits from leveling down, and the view is concerned solely with weighted welfare levels, the outcome is simply worse, full stop.

  To achieve this immunity, prioritarianism rejects a specific premise of telic egalitarianism: the claim that the *relation* of equality between persons possesses intrinsic value. Telic egalitarianism asserts that it is good if people are equally well off, regardless of absolute levels. Prioritarianism, conversely, asserts that we should give priority to benefiting those who are worse off, but the value of the benefit depends only on the recipient's absolute level of welfare, not on how that level compares to others. By shifting the locus of value from the comparative gap to the absolute level (weighted by priority), prioritarianism renders the relation of equality morally inert. The view is essentially individualistic; it cares about how badly off A is, but not that A is worse off than B.

  This structural shift creates a difficulty when addressing the comparative complaint of unfairness. Consider a case of brute luck inequality where A is disabled and B is able-bodied, but no feasible transfer can improve A's welfare without harming B. The telic egalitarian argues this situation is objectionable partly because of the *relationship* between A and B; it is unfair that A is worse off *than B*. The prioritarian must analyze this complaint without referencing the relationship. They can say A's low welfare is bad and merits priority, but if no transfer is possible, the prioritarian has no grounds to object to the *inequality* itself. To claim the situation is unfair because A is lower than B would be to smuggle the abandoned premise back in. If the value of the distribution depends only on weighted absolute levels, then once we have accounted for A's low absolute level, there is no moral residue left to condemn the gap. The prioritarian can explain why we should help A if we can, but they struggle to explain why the state of affairs remains morally regrettable specifically *as an inequality* when help is impossible. They risk reducing the complaint of unfairness to a complaint about low absolute welfare, thereby losing the distinctively comparative force of the egalitarian intuition.

  Consequently, the leveling-down objection does not conclusively establish prioritarianism as the sole plausible view; rather, it demonstrates that *telic* egalitarianism is untenable. The objection successfully kills the idea that equality is intrinsically valuable, but it does not prove that equality is irrelevant to fairness. A reasoned verdict suggests that while prioritarianism is superior as an axiology of the good, it may be incomplete as a theory of justice. Egalitarians can refine their view by retreating from telic to deontic or relational egalitarianism. On these views, equality is not a state of affairs to be maximized but a requirement of how individuals must be treated or regarded. Thus, the leveling-down objection forces egalitarianism to abandon the intrinsic value of patterns, but it does not force the abandonment of the claim that comparative relations matter for fairness. Prioritarianism avoids the absurdity of leveling down, but only by blinding itself to the comparative dimension of injustice that persists even when absolute levels cannot be raised.

  ***

  **Marking Scheme (25 Marks)**

  | Criteria | Marks | Descriptor |
  | :--- | :---: | :--- |
  | **1. LDO & Distinction** | **5** | **5:** Clearly states LDO; explicitly distinguishes *pro tanto* better vs. *all things considered* better.<br>**3-4:** States LDO but distinction is vague or implied.<br>**1-2:** Describes leveling down but misses the *pro tanto* distinction.<br>**0:** Irrelevant or incorrect. |
  | **2. Rejected Premise** | **5** | **5:** Identifies rejection of the *intrinsic value of the relation/comparison*.<br>**3-4:** Identifies rejection of equality generally but lacks precision on "intrinsic/relation".<br>**1-2:** Claims prioritarianism rejects helping the poor (false).<br>**0:** No identification. |
  | **3. Unfairness & Smuggling** | **10** | **8-10:** Deep analysis of the "no transfer" case; clearly articulates why prioritarianism struggles to name comparative unfairness without contradiction.<br>**5-7:** Identifies the problem but explanation of "smuggling" is thin.<br>**3-4:** Asserts prioritarianism handles unfairness easily (misses the point).<br>**0-2:** Fails to address the "no transfer" constraint. |
  | **4. Verdict** | **5** | **5:** Nuanced verdict (e.g., Telic defeated, but Relational survives); justified by previous analysis.<br>**3-4:** Clear verdict but lacks nuance or connection to analysis.<br>**1-2:** Verdict is contradictory or unsupported.<br>**0:** No verdict. |

  **Differentiation & Capping Errors**

  *   **A Range (20–25):** Demonstrates insight into the *residue* of unfairness prioritarianism cannot capture. The distinction between *pro tanto* and *all things considered* is used analytically, not just definitional. The verdict acknowledges the survival of non-telic egalitarianism.
  *   **B Range (15–19):** Correctly defines views and the objection. Explains the "no transfer" problem but treats it as a simple trade-off rather than a conceptual gap. Verdict is binary (one view wins completely).
  *   **C Range (10–14):** Recites definitions of prioritarianism and egalitarianism. Mentions LDO but misses the *pro tanto* distinction. Struggles to explain *why* prioritarianism rejects the premise.
  *   **Fail (0–9):** Fundamental misunderstandings of the theories.

  **Common Capping Errors & Misunderstandings**

  | Error | Cap | One-Line Note on Misunderstanding |
  | :--- | :---: | :--- |
  | Confusing prioritarianism with utilitarianism. | 12 | Treats priority weighting as simple aggregation without moral weight for the worse-off. |
  | Claiming prioritarianism values equality instrumentally. | 15 | Misses that prioritarianism values absolute levels, not equality even as a means. |
  | Failing to distinguish *pro tanto* from *all things considered*. | 14 | Assumes egalitarians think leveling down is good overall, attacking a strawman. |
  | Arguing prioritarianism solves the "no transfer" unfairness easily. | 16 | Fails to see that without comparison, "unfairness" reduces to "unfortunate." |
  | Verdict claims Telic Egalitarianism is correct despite LDO. | 10 | Ignores the force of the objection regarding the *pro tanto* betterment of harm. |
