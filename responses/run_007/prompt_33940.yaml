answer: |-
  # Activity: The Embarked Wager

  **Course Context:** Philosophy of Religion (Undergraduate)
  **Class Size:** 25 Students
  **Duration:** 75 Minutes
  **Materials:** 
  *   25 "Soul Point" ledgers (index cards with student names).
  *   30 small slips of paper (for voting).
  *   A opaque bag or box.
  *   A standard 6-sided die.
  *   A deck of 52 playing cards (sealed in an envelope).
  *   Projector/Whiteboard for the Ledger.
  *   Incentives: 10 Soul Points = 1 Homework Pass OR 1% Extra Credit on Final Paper (capped).

  **Incentive Structure:**
  Every student begins with **20 Soul Points (SP)**. Points are tracked publicly on the board. At the end of class, students may cash out SP for real course benefits. This creates "skin in the game" without using money.

  ---

  ## Part 1: The Game Rules & Timeline

  ### Introduction (5 Minutes)
  Distribute ledgers. Explain that SP are redeemable for grade benefits. Emphasize that choices are private (write on slips, fold, hand in) but outcomes are public (you update the ledger).

  ### Stage 1: Ordinary Prudence (15 Minutes)
  **Goal:** Establish baseline risk assessment with known probabilities.
  **Setup:** Project the options.
  *   **Option A (Safe):** Gain **5 SP** guaranteed.
  *   **Option B (Risky):** Roll a d6. On 4, 5, or 6 (50% chance), gain **11 SP**. On 1, 2, or 3, gain **0 SP**.
  **Action:** Students vote via slip. You roll the die publicly for those who chose B. Update ledgers.
  **Expected Value (EV):** Option A = 5. Option B = 5.5. They are rationally close.
  **Pedagogical Note:** Some will pick Safe (risk-averse), some Risky (risk-seeking). This is normal prudence.

  ### Stage 2: The Unknown Variable (15 Minutes)
  **Goal:** Introduce unknown probabilities with a high payoff to shift intuition toward the "Wager."
  **Setup:** Hold up the sealed envelope containing the shuffled deck.
  *   **Option A (Certain Cost):** Lose **2 SP** immediately. (Frame this as the "cost of living" or opportunity cost).
  *   **Option B (The Wager):** Lose **2 SP** immediately. However, you receive a "Ticket." At the end of class, I will draw one card from the sealed deck. If it is the **Ace of Spades**, you gain **500 SP**. If not, you gain nothing further.
  **Action:** Students vote. Do *not* reveal the probability (1/52). Just say, "The card is in there somewhere. It is possible."
  **Rational Pull:** Even if the probability is tiny, the EV (500 * p) quickly outstrips the certain loss of Option A, provided *p* > 0.004. Most students should flock to Option B here.

  ### Stage 3: The Forced Commitment (15 Minutes)
  **Goal:** Simulate the "We are Embarked" claim. No abstaining.
  **Setup:** Announce that this choice binds their "philosophical stance" for the remainder of the semester (symbolically).
  *   **Option A (The Skeptic's Life):** Keep your current SP total. No further changes.
  *   **Option B (The Believer's Life):** Pay **10 SP** now (a significant sacrifice). If "Truth Exists" (determined by a hidden variable I hold), you receive **Infinite SP** (capped at 100% course grade + public acclaim). If "Truth Does Not Exist," you lose the 10 SP.
  **Constraint:** You must choose A or B. No blank slips. If you turn in a blank slip, you are automatically assigned Option A and penalized 5 SP for "indecision."
  **Action:** Collect votes. Do *not* resolve the "Truth" condition yet. Hold the tension.

  ### Debrief & Discussion (25 Minutes)
  **Goal:** Map the game to Pascal's arguments and objections.

  1.  **Mapping the Stages:**
      *   **Stage 1 = Ordinary Prudence:** We weigh costs and benefits when odds are known. (Aristotelian deliberation).
      *   **Stage 2 = Expected Value Argument:** When the payoff is sufficiently high, even a low/unknown probability justifies the cost. This is the mathematical core of Pascal's wager ($\infty \times p > \text{finite cost}$).
      *   **Stage 3 = "We are Embarked":** Pascal claims we cannot abstain from the wager. By forcing the choice (and penalizing blank slips), the game simulates the claim that *not choosing* is itself a choice with consequences.

  2.  **Dominance vs. Expected Utility:**
      *   Ask students: "Why did you pick Option B in Stage 2?"
      *   If they say "Because 500 points is huge," they are using **Expected Utility**.
      *   If they say "Because I couldn't afford to miss out if the Ace was there," touch on **Dominance**. In Pascal's true Dominance argument, Belief is better *if* God exists, and roughly equal (or only finitely worse) *if* God doesn't. In our game, Option B was strictly better *if* the Ace existed, but strictly worse if it didn't (due to the cost). Clarify that Pascal argues the "cost" of belief (finite life) is negligible compared to the gain (infinite bliss), making Belief dominant in the "God Exists" column and negligible in the "God Doesn't" column.

  3.  **Testing Objections against Behavior:**
      *   **The Many Gods Objection:** Ask, "What if the envelope contained a deck of Tarot cards, or a different God rewards the *Skeptic's Life*?" In Stage 2, what if the Ace of Spades pays *you*, but the King of Hearts pays someone else? If you don't know *which* ticket wins, the wager collapses.
      *   **Doxastic Voluntarism (Belief at Will):** Ask Stage 3 Believers: "Did you actually *believe* the Ace was coming, or did you just *buy the ticket*?" Pascal requires faith, not just a bet. Can you force yourself to believe for 10 SP? If not, is the wager pragmatic or epistemic?
      *   **Unbounded Utilities:** In Stage 3, I capped the "Infinite SP" at a grade boost. Did that cap change your decision? If the gain isn't truly infinite, does the math still hold against a low probability?

  ---

  ## Part 2: Facilitator Notes

  ### Predictable Failure Point: The Cynical Refusal
  **What will go wrong:** In Stage 3, 1-3 students may refuse to choose on principle, arguing the game is manipulative or that "Truth" cannot be gambled. They may turn in blank slips or write protests.
  **How to handle it:** Do not argue. Mark them as "Option A (Skeptic)" and apply the "indecision penalty" as stated in the rules. Use this in the debrief: "Pascal argues that by refusing to wager, you have effectively wagered against God. Your refusal *was* a choice. The game forced you to reveal that you value principled refusal over potential gain. That is a valid philosophical position, but it confirms Pascal's claim that you cannot *not* choose."

  ### The Limitation Statement
  **Honest Constraint:** This game successfully simulates the *prudential rationality* of the wager (why it is smart to bet), but it cannot reproduce the *epistemic requirement* (why it is possible to believe). Pascal acknowledges one cannot simply choose belief; he suggests habituation ("Take holy water, have masses said"). The game makes students *act* like believers for points, but it cannot make them *feel* the doxastic struggle of adopting a worldview they may not accept. You must supply the philosophical bridge between "betting as if" and "believing that."

  ### One-Sentence Summary
  This activity uses a three-stage point-betting game to viscerally demonstrate the shift from ordinary risk assessment to the forced, high-stakes rationality of Pascal's Wager before introducing the formal philosophical arguments.
