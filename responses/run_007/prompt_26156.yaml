answer: |-
  Here is a 50-minute lesson plan designed to move students from superficial intuition to philosophical precision.

  ### 1. The Sequence of Introduction (and Dependencies)

  You cannot start with the machine. If you start with the machine, they will treat it as a sci-fi problem rather than a value problem. You must build the trap before you spring it.

  1.  **The Plausibility of Hedonism (Minutes 0–10):**
      *   **Why first:** You need them to feel the pull of the theory Nozick is attacking. If they think hedonism is obviously stupid from the start, the Experience Machine is a sledgehammer on a gnat.
      *   **Dependency:** The machine only works as a *counterexample* if the theory it counters is initially plausible.
      *   **Action:** Don't define hedonism abstractly. Give them a "Happy Lie" scenario. *Example:* "Your partner is faithful, but you could take a pill that makes you 10% happier for life, with no side effects. Is it irrational to take it?" Most will say yes. Push further: "Your partner is cheating, but you will never know, and you'll live a happy life. A friend knows. Should they tell you?" If they say "No, let me be happy," they are endorsing hedonism. Get them to commit to the idea that **mental states are what matter.**

  2.  **The Experience Machine Reveal (Minutes 10–20):**
      *   **Why second:** Now that they've tentatively agreed that happiness/pleasure is the primary good, introduce the machine as the logical conclusion of that commitment.
      *   **Dependency:** Depends on Step 1. If they haven't bought into "mental states matter," the machine seems obviously bad for trivial reasons.
      *   **Action:** Present the machine not as a prison, but as a guarantee.

  3.  **The Forced Choice (Minutes 20–30):**
      *   **Why third:** You need to create cognitive dissonance.
      *   **Dependency:** Depends on Step 2. They must see that the Machine offers *more* of what they said they valued in Step 1.
      *   **Action:** Ask for a show of hands: "Who plugs in?" Then ask: "Who thinks a *consistent hedonist* plugs in?" (These two groups must be distinguished).

  4.  **Nozick's Diagnosis (Minutes 30–40):**
      *   **Why fourth:** Only after they have refused the machine do you explain *why* Nozick thinks they refused.
      *   **Dependency:** Depends on Step 3. The "Three Lessons" (We want to *do* things, we want to *be* things, we want contact with *reality*) are explanations for the data point generated in Step 3.

  5.  **Scope and Limits (Minutes 40–47):**
      *   **Why fifth:** Prevent overgeneralization.
      *   **Dependency:** Depends on Step 4. Once they know what the argument proves, you must tell them what it *doesn't* prove.

  6.  **Assessment (Minutes 47–50):**
      *   **Why last:** Check for conceptual uptake, not opinion.

  ---

  ### 2. The Core Example: The Experience Machine

  Use the machine itself, but you must curate the description carefully.

  **Features to Foreground Immediately:**
  *   **The Guarantee:** Emphasize that the pleasure is *guaranteed* and *maximized*. It is not a gamble.
  *   **The Indistinguishability:** Emphasize that while plugged in, they will not know they are plugged in. To them, it is reality.
  *   **The Pre-programming:** Make sure they understand they do not choose the experiences in real-time; they choose a "life script" beforehand. This is crucial for the "agency" objection later.

  **Features to Hold Back (until objections arise):**
  *   **The "Forever" Clause:** Initially, describe it as "for the rest of your life," but if students object based on boredom or "what if I change my mind?", clarify that the machine adjusts to your desires. Don't let them reject it because they think they'll get bored of paradise; Nozick's point is about *reality*, not *variety*.
  *   **The Physical Body:** Do not discuss what happens to their physical body in the tank (do they die? are they fed?). If you mention the tank too early, they will fixate on the grossness of the tank rather than the value of the experience. Keep the focus on the *internal* experience.

  ---

  ### 3. Misconceptions and Intervention Points

  Here are the three specific misconceptions you smell, and the exact moment to kill them.

  **Misconception A: "Nozick is saying pleasure doesn't matter."**
  *   **When to head it off:** **Minute 10 (after defining Hedonism).**
  *   **Intervention:** Explicitly state: "Nozick is not saying pleasure is worthless. He is saying it is not the *only* thing of value." If you don't say this, they will leave thinking he is an ascetic.
  *   **Script:** "If you think Nozick is saying pleasure is bad, you've missed the point. He's saying pleasure is *incomplete*."

  **Misconception B: "I wouldn't plug in, so the argument works."**
  *   **When to head it off:** **Minute 25 (during the Forced Choice).**
  *   **Intervention:** This is the most critical moment. If a student says, "I wouldn't plug in, therefore Nozick is right," stop them.
  *   **Script:** "Wait. Your refusal is the *data*, not the *conclusion*. The argument only works if we agree that a person who *only* valued pleasure *would* plug in. If you refuse, you are admitting you value something *other* than pleasure. The argument isn't 'Don't plug in.' The argument is 'What does your refusal tell us about what you value?'"

  **Misconception C: "This is just about authenticity."**
  *   **When to head it off:** **Minute 35 (during Nozick's Diagnosis).**
  *   **Intervention:** Students love the word "authenticity." It is a philosophical stopper.
  *   **Script:** "Don't just say 'It's not authentic.' That's a label, not an explanation. Nozick gives three specific reasons. Is it that you want to *act*? Is it that you want to *be* a certain character? Or is it that you want contact with a deeper reality? Pick one. 'Authenticity' is just a buzzword for one of those three."

  ---

  ### 4. What to Refuse to Settle (Scope Limits)

  You are correct about Well-being vs. Right Action, but there is a second limit you must enforce.

  **1. Prudential Value vs. Morality (The Well-being/Right Action Gap)**
  *   **The Limit:** Do not let them argue that plugging in is *immoral*.
  *   **Why:** The Experience Machine targets a theory of *well-being* (what makes a life go best for the person living it), not a theory of *morality* (what we owe others).
  *   **Instruction:** If a student says, "But if everyone plugged in, society would collapse," shut it down.
  *   **Script:** "We are not asking if it's good for *humanity*. We are asking if it's good for *you*. This is a selfish thought experiment. If it's bad for you even when it helps no one else, then hedonism is wrong about well-being."

  **2. Epistemology vs. Axiology (Skepticism vs. Value)**
  *   **The Limit:** Do not let them argue that we can't *know* we aren't in the machine already.
  *   **Why:** This turns the class into a Descartes/Matrix discussion about knowledge. Nozick doesn't care if we are in a matrix; he cares if we *would choose* to enter one.
  *   **Instruction:** If they ask, "How do we know we aren't in it now?"
  *   **Script:** "That's a question for epistemology. For this hour, assume you are currently in reality. The question is: Would you leave reality for a guaranteed better feeling? Keep it about value, not knowledge."

  ---

  ### 5. The Final Assessment Question

  Do not ask "Would you plug in?" That tests their preferences. Do not ask "Is hedonism wrong?" That tests their memory of your conclusion.

  Ask this in the last three minutes, ideally as a "think-pair-share" or a quick written slip:

  > **"If a committed hedonist believes that pleasure is the *only* thing that makes a life better, are they rationally required to plug into the Experience Machine? Yes or No, and why?"**

  **Why this works:**
  *   If they answer **"No"**: They failed to understand the definition of hedonism (Misconception A).
  *   If they answer **"Yes, because the machine is fake"**: They failed to understand the counterexample (Misconception B).
  *   If they answer **"Yes, because pleasure is the only intrinsic good, even if we wouldn't do it ourselves"**: They understand that the argument targets the *theory*, not the *choice*.
  *   If they answer **"No, because there are other values like reality"**: They understand Nozick's conclusion.

  This forces them to separate their own intuition (I won't plug in) from the theoretical commitment (A hedonist must plug in). That distinction is the entire philosophical payload of the lecture.
