prompt: |-
  I'm teaching a first-year intro to ethics section next week and I've got fifty minutes on Nozick's experience machine. The students will have read the two-page excerpt from *Anarchy, State, and Utopia* but most of them will have skimmed it and come away thinking Nozick's point is just "the matrix is bad" or "fake pleasures don't count." I don't want to explain the argument *to* you — I want you to plan how *I* should explain it.

  What I need: the order in which the pieces have to be introduced and why each one depends on the last. The one example or scenario that should carry the whole thing (and if it's the experience machine itself, tell me what features of it I should foreground and which I should deliberately hold back until later). The misconceptions they'll form — I can already smell "Nozick is saying pleasure doesn't matter," "this is just about authenticity," "I wouldn't plug in so the argument works" — and the exact point in the sequence where I should head each one off rather than letting it fester. What I should openly refuse to settle or even get into at this level (I'm guessing the difference between a theory of well-being and a theory of right action, but tell me if I'm wrong). And one question I can ask in the last three minutes that will tell me whether they've understood what the argument is actually targeting, as opposed to whether they've just formed an opinion about the machine.

  A bit of context: these students are sharp but most haven't done philosophy before, and about half of them are taking the course because it fulfills a distribution requirement. They'll nod along if I tell them hedonism is wrong, but I want them to feel the pull of it first so the machine actually does work as a counterexample rather than just confirming what they already think.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Task:** Plan a 50-minute intro to ethics lecture on Nozick's Experience Machine.
      *   **Audience:** First-year students, sharp but mostly new to philosophy, many fulfilling a requirement. They've skimmed the text and have superficial takeaways ("Matrix is bad," "fake pleasure doesn't count").
      *   **Goal:** Make them *feel* the pull of hedonism first, so the machine works as a counterexample, not just a confirmation of bias.
      *   **Specific Requirements:**
          *   Order of introduction (and dependencies).
          *   One core example/scenario (features to foreground/hold back).
          *   Misconceptions to head off (and *when*).
          *   What *not* to settle/discuss (scope limits).
          *   One final assessment question (tests understanding of the argument's target, not just opinion).
      *   **Constraint:** Do not explain the argument *to* the AI; the AI must plan how the *user* explains it.

  2.  **Deconstruct the Philosophical Problem:**
      *   Nozick's target: Hedonism (specifically, the theory that pleasure/happiness is the *only* intrinsic good).
      *   The Trap: Students often reject the machine for reasons Nozick anticipates and dismisses (e.g., "it's fake," "I want to do things, not just feel like I did them"). Nozick's point is deeper: we value *contact with reality*.
      *   The Pedagogical Challenge: If students immediately say "I wouldn't plug in," the argument seems to work, but for the *wrong reasons* (e.g., mistrust of technology, fear of death, valuing "authenticity" in a vague sense). They need to understand *why* a hedonist *should* plug in, so that refusing reveals a commitment to something *other* than pleasure.

  3.  **Drafting the Sequence (The "Order of Operations"):**
      *   *Step 1: Establish the Target.* Can't refute hedonism without defining it. Need to make it plausible first.
      *   *Step 2: The Intuition Pump.* Introduce the machine.
      *   *Step 3: The Hedonist's Verdict.* What *should* a hedonist say?
      *   *Step 4: The Student's Verdict.* What do *they* say?
      *   *Step 5: The Gap.* Why the difference? (The Three Lessons).
      *   *Step 6: Scope/Limits.* What this doesn't prove.

  4.  **Selecting the Core Example:**
      *   Is it the Experience Machine itself? Yes, but it needs framing.
      *   *Foreground:* The guarantee of pleasure. The pre-programming aspect.
      *   *Hold Back:* The "forever" aspect initially (make it seem like a vacation), then reveal it's for a lifetime. This prevents the "boredom" objection too early. Also hold back Nozick's specific "three lessons" until after they've wrestled with their own reasons.

  5.  **Identifying Misconceptions & Intervention Points:**
      *   *Misconception 1: "Nozick says pleasure doesn't matter."* -> Head off during Step 1 (Define Hedonism).
      *   *Misconception 2: "It's just about authenticity/being real."* -> Head off during Step 5 (Distinguish 'doing' from 'feeling like doing').
      *   *Misconception 3: "I wouldn't plug in, so the argument works."* -> Head off during Step 3 (Crucial: They must admit a *consistent hedonist* must plug in).
      *   *Misconception 4: "This proves utilitarianism is false."* -> Head off during Step 6 (Scope limit: Well-being vs. Morality).

  6.  **Determining Scope Limits (What not to discuss):**
      *   Well-being (Prudential Value) vs. Morality (Right Action). This is the big one. Intro students conflate "what makes life go best for me" with "what is the moral thing to do."
      *   Technical metaphysics of reality (Brain in a Vat skepticism). Keep it focused on value, not epistemology.

  7.  **Crafting the Final Question:**
      *   Needs to test if they know what theory is being attacked.
      *   Bad question: "Would you plug in?" (Tests opinion).
      *   Good question: "If pleasure were the *only* thing that mattered, what would be the rational choice?" (Tests understanding of the target).

  8.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Critique:* Is 50 minutes enough?
      *   *Adjustment:* Keep the definition of hedonism tight. Don't get bogged down in historical Epicureanism. Focus on "Mental State Theory."
      *   *Critique:* How to make them feel the pull of hedonism?
      *   *Adjustment:* Use a "Painful Truth vs. Happy Lie" mini-example before the Machine. E.g., Would you want to know your spouse is cheating if you'd never find out and it would destroy your happiness? This primes the "pleasure is what matters" intuition.
      *   *Wait, the prompt says:* "I want them to feel the pull of it first." Okay, so I need to sell hedonism before I sell Nozick.
      *   *Revised Sequence:*
          1.  Sell Hedonism (The "Happy Lie" test).
          2.  Introduce Machine (as the ultimate Happy Lie).
          3.  Force the Hedonist Choice.
          4.  Reveal the Intuition (Refusal).
          5.  Analyze the Refusal (Nozick's 3 points).
          6.  Boundaries.

  9.  **Finalizing the Output Structure:**
      *   Follow the user's requested structure: Order/Dependencies, Core Example, Misconceptions (with timing), Scope Limits, Final Question.
      *   Tone: Professional, pedagogical, respectful of the instructor's expertise.

  10. **Writing the Content:** (Mental check of Nozick's specific text points).
      *   Nozick's 3 points: 1. We want to *do* things, not just have the experience. 2. We want to *be* a certain way (courageous, kind), not an indeterminate blob. 3. We want contact with a deeper reality.
      *   Make sure the plan emphasizes that the *refusal* is the data point, not the machine itself.

  11. **Final Review against constraints:**
      *   Did I explain the argument to the AI? No.
      *   Did I plan how the *user* explains it? Yes.
      *   Is the timing realistic? Yes, 50 mins is tight but doable if focused.
      *   Is the final question diagnostic? Yes.

