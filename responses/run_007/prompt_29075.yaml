          *   Provide a model answer (~600 words).
          *   Provide a marking scheme (distinguishing A from B, specifying moves and mistakes).
          *   Model answer must *adjudicate* (take a stance/evaluate), not just report.
          *   Marking scheme must penalize mere summary.

  2.  **Drafting the Essay Question:**
      *   *Goal:* Force the student to evaluate coherence, not just explain.
      *   *Draft 1:* Is Mill a hypocrite regarding India? Discuss. (Too vague, invites moralizing rather than philosophical analysis).
      *   *Draft 2:* Compare On Liberty and Mill's writings on India. Do they fit together? (Too broad for 1 hour).
      *   *Draft 3 (Closer):* Mill argues that liberty applies only to those capable of improvement by free discussion. Does his application of this to India reveal a principled consistency or a contradiction in his liberalism? Engage with the tension between his anti-paternalism and his colonial paternalism.
      *   *Refinement:* Need to make sure they hit the specific pressure points mentioned in the prompt. Let's frame it around the *conditions* for liberty and the *mechanism* of development.
      *   *Final Polish:* "Mill restricts the liberty principle to those in 'the maturity of their faculties,' excluding societies he deems backward. Critically evaluate whether this exclusion functions as a coherent, principled extension of his utilitarian liberalism or as an unacknowledged contradiction. In your answer, address the tension between his epistemic fallibilism in *On Liberty* and his administrative confidence in colonial contexts, AND assess the empirical plausibility of his claim that despotic tutelage cultivates the capacities required for self-government." (This hits fallibilism vs. confidence and means-end efficacy).

  3.  **Drafting the Model Answer:**
      *   *Length:* ~600 words.
      *   *Stance:* Needs to adjudicate. A nuanced "incoherent in practice despite theoretical consistency" or "theoretically consistent but empirically flawed" approach works best. Let's aim for: Theoretically consistent within his developmental framework, but empirically and epistemically unstable (undermining the consistency).
      *   *Key Points to Cover:*
          1.  Thesis: The exclusion is theoretically consistent with his developmentalism but collapses under the weight of his own epistemic standards.
          2.  Point 1: Anti-paternalism vs. Imperial Paternalism. The distinction is "capacity for improvement."
          3.  Point 2: Fallibilism vs. Colonial Confidence. How can administrators know what's best if opinion is fallible?
          4.  Point 3: Means-End. Does despotism actually teach liberty?
          5.  Conclusion: It's a betrayal of the *spirit* of fallibilism, making it an embarrassment, not just an extension.
      *   *Drafting - Section by Section:*
          *   Intro: State the tension. Thesis: It fails the test of fallibilism.
          *   Body 1: The developmental defense. Mill isn't inconsistent on *goal* (progress), but on *method*.
          *   Body 2: The epistemic problem. *On Liberty* says truth comes from clash. Colonialism suppresses clash.
          *   Body 3: The empirical claim. Despotism creates passivity, not agency.
          *   Conclusion: Verdict.

      *(Self-Correction during drafting)*: Keep it tight. 600 words is short. Focus heavily on the Fallibilism vs. Confidence tension as the killer argument.

  4.  **Drafting the Marking Scheme:**
      *   *Goal:* Distinguish A (critical engagement, adjudication) from B (summary, description).
      *   *Criteria:*
          *   Thesis/Adjudication.
          *   Engagement with Pressure Points (need 2).
          *   Use of Evidence/Text.
          *   Avoidance of Pitfalls (mere summary).
      *   *Specifics:*
          *   A: Takes a stand, connects fallibilism to colonial confidence, critiques the means-end logic.
          *   B: Explains the "barbarism" exception accurately but doesn't critique its coherence.
          *   C/F: Misstates the Harm Principle or ignores India.

  5.  **Review against Constraints:**
      *   1-hour question? Yes, scope is narrow enough.
      *   Two pressure points? Yes (Fallibilism/Confidence + Means-End/Paternalism).
      *   Model answer adjudicates? Yes.
      *   Marking scheme penalizes summary? Yes.
      *   Word count? Model answer needs to be checked.

  6.  **Final Polish:** Check tone (academic, rigorous). Ensure the distinction between "consistent extension" and "standing embarrassment" is central. (Proceed to generate output).

