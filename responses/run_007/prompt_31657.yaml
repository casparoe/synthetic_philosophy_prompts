  I'm a software engineer with no formal philosophy background, so go easy on me and skip the jargon. A friend and I have been going back and forth about a weird mismatch in how the law and medicine treat cases where a child is born with a serious genetic condition. On one side, courts in a lot of places reject wrongful life suits: the child sues saying the clinic missed the condition prenatally and that she never should have been born with it, and the court says you can't compare being alive with never existing, and that being alive isn't the kind of thing you can call a harm. On the other side, the same system is fine with parents using embryo screening to pick a embryo without that exact condition, and with donor sperm or eggs, where a different child results. So the system lets parents deliberately avoid bringing one child into existence, but tells the child who does get born that she wasn't wronged, partly because the only alternative for her was to never exist. To me that sounds like the system is quietly committed to the idea that a person is tied to the particular sperm and egg they came from, so a different embryo would just be a different person, not a healthier version of the same one. Is that right? What theory of personal identity or origins does this practice actually presuppose, what does it merely fit with, and is the practice internally consistent? And if we swapped in a different theory of identity, what would have to change in how wrongful life cases and embryo selection are handled?

  Please answer in American English. Take the role of a professional philosopher who works on metaphysics and the philosophy of law. Think carefully: start by brainstorming two or three candidate readings of what the practice might presuppose before you commit to one, and flag the places where the practice is underdetermined by the philosophy.

  Structure your answer like this:
  1. The practice (150–250 words): lay out the two sides concretely.
  2. The implicit theory of identity (300–400 words): reconstruct the view the practice seems to presuppose, including the sperm-and-egg point.
  3. Forced vs optional (200–300 words): what the practice strictly presupposes versus what it merely fits with.
  4. Consistency check (200–300 words): whether the parts of the practice presuppose the same thing.
  5. What would change (200–300 words): how the practice would shift under a rival theory of identity.
  6. Bottom line (100–150 words): your overall verdict.
