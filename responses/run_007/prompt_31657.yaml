  1. The practice
  In many legal systems, a child born with a severe genetic condition cannot sue for "wrongful life." Courts rule that being alive, even with suffering, cannot be compared to never existing, so no harm occurred. The judge says you cannot claim you were harmed by being born because the only alternative was non-existence. Yet, those same systems permit parents to use embryo screening to select against that condition. If parents choose a different embryo to avoid the disease, a different child is born. The law allows parents to ensure a specific potential child never exists to prevent suffering, but tells the child who *is* born that their existence isn't a legal harm because their only alternative was non-existence. This creates a puzzle: the system permits avoiding the birth of Child A to have Child B, but denies Child A compensation for being born, citing that Child A couldn't have been born differently. The practice treats the specific biological starting point as definitive of the person, yet handles the value of that existence differently depending on who is asking. This tension suggests the law assumes a specific link between biological origins and personal identity, even if it doesn't say so outright.

  2. The implicit theory of identity
  To understand this, we must consider three candidate views. First, psychological continuity suggests you are your memories and mind; this doesn't apply to embryos lacking psychology. Second, legal personhood suggests rights begin at birth; this explains the suit rejection but fails to explain why embryo selection isn't seen as harming a future rights-bearer. Third, origin essentialism claims you are identical to your specific biological starting materials. The legal practice strongly presupposes this third view. It operates on the intuition that a child is inextricably linked to the specific zygote from which they developed. When courts say the child couldn't have been born healthy, they mean *this* specific individual couldn't have existed without that specific genetic makeup. If the genetics were different, it would be a different person. Similarly, when parents select a different embryo, the law treats this as creating a different person, not healing the first. This view avoids the paradox of saying the same person was harmed by being created, by insisting that the "healthy version" of that child is metaphysically impossible. The law doesn't use philosophical terms, but its logic requires that personal identity is fixed at conception based on specific biological origins. Without this assumption, the distinction between selecting a healthy embryo and harming a specific child collapses. The practice assumes that swapping gametes swaps identities. This shields clinics from liability: they didn't harm *this* child by missing the diagnosis, because *this* child could not have existed without the diagnosis being missed. It also shields parents: they aren't rejecting a specific future person's health, they are choosing which person to invite into existence. The metaphysics here is robust: you are your origins. This theory resolves the logical tension by making the healthy alternative a different person entirely. It implies that identity is narrow and exclusive. You cannot be born from different parents or different cells and remain you. The law relies on this to prevent infinite liability while preserving reproductive freedom. By fixing identity to the biological starting point, the law creates a stable unit for rights and duties. It prevents the claim that "I was harmed by being born" because the counterfactual "I could have been born healthy" is deemed false. You could not have been born healthy and still be you. Thus, the practice isn't just compatible with origin essentialism; it requires it to make sense of the wrongful life dismissal.

  3. Forced vs optional
  The practice strictly requires that the law can distinguish between potential persons at the embryonic stage. It must treat Embryo A and Embryo B as distinct entities with separate moral statuses. However, it does not strictly require true metaphysical origin essentialism. The law could adopt this view merely as a pragmatic heuristic rather than a truth about reality. It is underdetermined whether the law believes you *are* essentially your gametes, or simply that it *treats* you as such for liability purposes. The practice fits with origin essentialism, but it could also fit with a conventionalist view where society agrees to count gametes as the marker of identity for legal clarity. The deep metaphysics are optional; the operational distinction is forced. The law needs a cutoff point where a specific individual comes into view, and conception is the clearest available line. It doesn't need to prove that a different sperm would make a different soul, only that it makes a different legal subject. This underdetermination allows the system to function without settling deep philosophical debates. It avoids claiming that identity is impossible across different origins, only that for the purpose of torts and reproduction, we will act as if it is. This flexibility lets the law adapt if biological definitions of conception shift, without collapsing the underlying liability framework. The philosophy supports the practice, but the practice doesn't mandate the philosophy. Consequently, a lawyer could argue the identity rule without believing it metaphysically. The system remains agnostic on *why* the embryos are different, only that they are distinct enough to bear different rights and outcomes. This gap between legal utility and metaphysical truth is where the practice remains underdetermined.

  4. Consistency check
  Is the practice internally consistent? Regarding personal identity, yes. Both wrongful life dismissals and embryo selection rely on the same rule: different biological origins mean different people. The court says Child A wasn't harmed because Child A couldn't exist otherwise; parents choose Child B because Child B is a different person who won't suffer. The identity theory holds steady across both scenarios. However, there is a tension in how value is assigned. In embryo selection, the system implicitly accepts that non-existence is preferable to a life with severe suffering (otherwise, why select?). In wrongful life suits, the system denies that non-existence is a valid baseline for harm (otherwise, the child could sue). This creates an ethical inconsistency, even if the metaphysical one is stable. The law says to parents: "It is better that Child A never exists." But it says to Child A: "You cannot claim it would have been better if you never existed." The practice presupposes the same identity theory but applies conflicting standards of harm. It protects reproductive choice by valuing non-existence, yet protects medical providers by invalidating non-existence as a harm comparator. This inconsistency is functional, not logical. It serves different policy goals: freedom for parents, immunity for doctors. So, while the theory of identity is consistent, the moral reasoning shifts depending on the litigant. The system tolerates this because the identity rule prevents the two positions from directly colliding in court. Since Child A cannot claim they could have been Child B, the conflicting values never meet in a single legal claim. The consistency is maintained by keeping the parties separate.

  5. What would change
  If we swapped in a rival theory where identity isn't tied to specific gametes, the legal landscape would shift dramatically. Suppose identity follows a "future child" concept, where the parents' intention defines the person, regardless of the specific embryo. Under this view, selecting a healthy embryo would be seen as curing the same child, not creating a new one. Consequently, wrongful life suits would become viable. The child could argue, "I could have existed as me, but healthy, and you failed to ensure that." The defense that "the only alternative was non-existence" would fail, because the alternative would be "existence as a healthy version of you." Liability for clinics would skyrocket, as failing to detect a condition would be direct harm to that specific person. Conversely, embryo selection might face new ethical constraints. If it's the same child, do parents have a duty to select the healthy version? It might shift from a right to choose to a duty to cure. The non-identity problem would vanish, replaced by standard negligence claims. The law would treat genetic conditions like birth injuries caused by malpractice, rather than inevitable conditions of existence. This would erase the protective barrier currently provided by origin essentialism. The legal system would need a new way to limit liability, perhaps by capping damages or redefining duty of care. Ultimately, loosening the link between origins and identity makes existence itself actionable. It would force courts to compare quality of life against non-existence directly, a task they currently avoid. The entire framework of reproductive law would need rebuilding to handle these new claims.

  6. Bottom line
  The legal practice effectively relies on a pragmatic version of origin essentialism. It assumes you are your specific biological starting point to manage liability and reproductive rights. This metaphysical stance is internally consistent across wrongful life and embryo selection cases. However, the ethical reasoning is inconsistent: it values non-existence for parents but invalidates it for children. This double standard protects both reproductive freedom and medical providers. Changing the identity theory would collapse this protection, opening clinics to massive liability and altering parental obligations. The system works not because it is philosophically perfect, but because it balances competing interests using a stable, if debatable, theory of identity. It is a functional compromise, not a metaphysical truth.
