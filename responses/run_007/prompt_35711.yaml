answer: |-
  First off, I am sorry you are feeling so worked up. Losing something you thought you had, even if it is only a story about an object, is a genuine kind of grief. It is completely understandable that you are unsettled.

  To answer your question directly: yes, there is a very philosophically respectable way to argue that your painting is genuinely less valuable than you thought, and that your friend is relying on an overly narrow definition of what an object *is*. Your friend is arguing from a position often called **aesthetic formalism**, which holds that the value of art lies solely in its visual properties. While that is one valid perspective, it is not the *only* rational one, and most contemporary philosophy of art would actually side with you.

  Here is how you can articulate why your friend is missing something fundamental, broken down into a few key arguments.

  ### 1. The Distinction Between the 'Object' and the 'Work'
  Your friend says nothing has changed because the physical object (canvas, pigment, wood) is the same. Philosophically, this conflates the **physical vehicle** with the **artwork** itself.

  The philosopher Arthur Danto famously argued that two physically indistinguishable objects can be fundamentally different artworks. His thought experiment involved Brillo Boxes: a stack of Brillo pads in a supermarket is just a box; a stack of Brillo pads made by Andy Warhol is art. Physically, they might be identical. But their value and status are different because of the history and theory surrounding them.

  Similarly, the philosopher Nelson Goodman distinguished between **autographic** and **allographic** arts. Music is allographic; if you play a perfect copy of a score, it is the same work. Painting is autographic; the history of production matters. A painting is not just a pattern of colours; it is a record of a specific performance by a specific person at a specific time. When you discovered it was a copy, the 'work' changed, even if the 'object' did not. You no longer possess a 1920s landscape; you possess a 1940s copy of one. Those are two different things historically, even if they look the same.

  ### 2. Performance Value and Authenticity
  There is a concept known as **performance value**. When we value an original, we are valuing the human achievement behind it. We are valuing the fact that a specific artist solved specific visual problems in a specific way.

  Denis Dutton, in *The Art Instinct*, argues that we value art partly because it is a display of skill and intention. If you watch a live magician perform a trick, it is thrilling. If you later learn it was done with camera tricks and editing, the performance loses value, even if the visual experience was identical. Why? because the *achievement* was different.

  Your friend calls this snobbery, but it is actually about honesty in representation. Valuing the original is not just about status; it is about valuing the authentic human gesture. The copy, no matter how skilled, is a different kind of achievement (the achievement of copying) than the original (the achievement of creating). Therefore, the object genuinely possesses less 'artistic' value because it represents a lesser creative act.

  ### 3. Relational and Heirloom Value
  This is perhaps the most important point for your specific situation. You are not just valuing the painting as a piece of art for a gallery; you are valuing it as an **heirloom**.

  The value of an heirloom is inherently relational. It derives from the connection between the object, the giver, and the receiver. Your gran told you a story about that specific object: that she bought it, that it was by this painter, that it was from that era. That narrative was woven into the identity of the object for you.

  When the provenance proved false, the relational link was damaged. It is exactly as you said: the difference between a letter from your grandad and a photocopy. The photocopy contains the same information (the visual data), but it lacks the **trace**. The original letter bears the physical trace of his hand; the painting you thought you had bore the historical trace of your gran's life and the artist's time.

  Philosophers of emotion would argue that feelings are not just 'in your head' separate from the world; they are responses to perceived values. If the object's history is part of its identity, and that history has changed (or rather, your knowledge of it has corrected the identity), then your emotional response is rational. You haven't lost a 'false belief'; you have lost the object that satisfied the conditions of your attachment.

  ### 4. Market Value is a Social Fact
  Your friend suggests the economics shouldn't matter if you aren't selling. However, market value is not just about greed; it is a **social consensus** on value. The fact that the art market values the original at £10,000 and the copy at £500 is not arbitrary snobbery; it is a collective agreement that provenance matters.

  By participating in society, we accept certain social facts. Money is just paper, but we agree it has value. Provenance is just paperwork, but we agree it confers authenticity. To say you shouldn't care about the drop in market value is like saying you shouldn't care if a £10 note turns out to be a forgery because 'the paper feels the same'. The value is partly constituted by the agreement that it is genuine.

  ### Conclusion
  Your friend is arguing that value is intrinsic to the physical atoms of the painting. You are arguing that value is contextual, historical, and relational. Both are coherent positions, but yours is arguably more robust when dealing with human artefacts.

  You are not being precious. You are recognising that human objects carry history, and when the history is altered, the object is altered. The painting you have now is a different thing than the painting you thought you had. It is a copy of a memory, rather than the vessel of the memory itself. It is perfectly rational to mourn that shift.

  Take a breath. You haven't lost the visual beauty, and you haven't lost the love for your gran. But you have lost the authenticity of the token, and that is a real loss, defensible by any measure.
