  **Recommendation**

  The Council should vote to dismiss the charge against M. based on procedural invalidity. The administration failed to follow mandatory enactment steps outlined in the handbook, rendering the rule unenforceable by this body. Should the Council feel bound to find a violation, we must recommend reducing the penalty to a warning, citing disproportionate severity. This vote must occur during Thursday's session to ensure timely resolution before grading periods close. We must simultaneously transmit a formal request to the Administration to rectify the policy process. This approach upholds procedural integrity while avoiding complicity in an unjust outcome. We must affirm that future enforcement requires strict adherence to handbook amendment protocols.

  **Background and the question before us**

  Over the summer, the Administration inserted a strict academic-integrity rule into the student handbook prohibiting AI use for generating or outlining assignments. Violations carry a semester suspension and permanent transcript notation. The handbook requires such changes to pass a Faculty Senate vote and a Student Government comment period; neither occurred. M., a junior, used AI to outline an essay but wrote the content herself. She faces charges under this new rule. The Council is divided: some members believe we must apply the text as written, while others argue that improper enactment and excessive penalties invalidate the rule's authority. Our task is to determine whether procedural defects or substantive unfairness relieve us of the duty to enforce.

  **The case for treating the rule as binding and enforcing it as written**

  Proponents of enforcement argue that legal stability requires honoring announced rules regardless of their creation process. Once published in the handbook, students and faculty rely on these texts as authoritative. To allow the Council to question the Administration's enactment process risks destabilizing the school's governance structure. This view separates the existence of a rule from its moral quality; a rule is valid if issued by recognized authority and communicated clearly. Furthermore, the Council's mandate is typically adjudicative, not legislative. We interpret violations, not validate policies. If we refuse to apply the rule, we usurp the Administration's role. Consistency demands that we treat the handbook as binding law, leaving challenges to policy validity to higher administrative channels, not student judicial bodies.

  **The case against treating the rule as binding, or at least against applying its penalty**

  Opponents contend that authority derives from legitimacy, not merely announcement. A rule bypassing required checks lacks the consent necessary for binding obligation. This aligns with the principle that unjust laws may lack moral force. Here, the penalty—suspension and transcript notation for outlining—is grossly disproportionate to the harm caused. Enforcing such a sanction violates fundamental fairness, making the Council complicit in injustice. Additionally, vague terms like "substantially revise" fail to provide fair notice, violating due process. If a rule is too vague or enacted secretly, it cannot guide conduct. Therefore, the Council has a moral duty to refuse enforcement when procedural safeguards are ignored or penalties shock the conscience. We are guardians of honor, not blind automatons.

  **Analysis: separating the procedural-validity question from the proportionality question**

  We must distinguish two distinct questions: procedural validity and substantive proportionality. Procedural validity asks whether the rule was created according to established methods. The handbook specifies steps—Senate vote, student comment—that were skipped. In legal theory, this touches on whether a rule's origin determines its status. If the handbook is a contract, the Administration breached it, potentially voiding the clause. Substantive proportionality asks whether the punishment fits the offense, regardless of enactment. Even if the rule were properly passed, a semester suspension for outlining may exceed reasonable bounds. These issues work differently. Procedural defects undermine the rule's authority entirely; it never became "law." Disproportionality affects how we apply discretion within a valid rule. Conflating them muddies our reasoning. We should prioritize the procedural argument because it resolves the case without requiring us to judge the morality of AI use itself. However, if we deem the rule valid procedurally, the proportionality question becomes our only shield against injustice. We must decide if our role allows mitigating unjust outcomes under valid rules.

  **Settled and contested ground**

  Among legal scholars, it is settled that procedural regularity enhances legitimacy and stability. Everyone agrees that skipping required steps weakens a rule's claim to obedience. However, it remains genuinely contested whether a procedurally defective rule is void automatically or merely voidable by higher authority. Similarly, scholars debate whether extreme injustice strips a rule of its legal character entirely, or whether it remains law that ought to be disobeyed. Some argue validity and morality are separate; others insist they are intertwined. We should not pretend one view dominates. The Council must acknowledge that reasonable people disagree on whether an unjust rule is still a rule. Our decision will reflect a choice between these competing philosophical traditions, not merely a technical calculation.

  **Conditions and next steps**

  If the Administration rejects our dismissal, we should request a formal appeal process involving the Faculty Senate. We must document our reasoning carefully to protect Council members from retaliation. Simultaneously, we should initiate a policy review committee to clarify AI guidelines and enactment procedures before next semester. This ensures future cases rest on clear, mutually agreed-upon standards. We should also publish an anonymized summary of this decision to educate the student body on their rights and our limitations. Transparency here reinforces trust. Finally, we must schedule a follow-up meeting with Administration representatives to discuss the handbook amendment process, ensuring procedural compliance becomes a shared priority rather than a point of conflict.
