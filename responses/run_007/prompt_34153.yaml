      *   If we fix it by modifying the argument (distinguishing reasons), the cost is accepting that moral philosophy is more complex than a single calculus.

  9.  **Final Polish:** Ensure tone is empathetic but rigorous. Use the Williams reference effectively. Make sure to explicitly answer "Where does it go wrong?" and "What is the cost?"

      *(Self-Correction during drafting)*: I should be careful not to say (1) is definitely false. Many philosophers defend (1). The error is better located in the inference from (1)/(2) to (3). The inference assumes that moral justification *crowds out* personal reasons. That's the "crowding out thesis" which is highly contested.

