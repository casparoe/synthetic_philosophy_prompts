prompt: |-
  You're a moral philosopher who works on Smith's sentimentalism and has taught this material enough times to know exactly where students get lost. Think carefully before committing — start by sketching the dependancy structure, and only then pick the example and the order.

  I'm a grad student covering my advisor's first-year PPE section on Thursday. The topic is Smith's impartial spectator, one fifty-minute session, and the students have done about five pages of the assigned reading but they're leaving the lecture using 'sympathy' to mean feeling sorry for someone. I don't want an explanation of the spectator; I want the teaching plan. First, the dependency order: which idea has to be in place before I can even introduce the spectator without the whole thing collapsing into 'just think about what other people would say', and what breaks downstream if I skip it. Second, give me the one worked example that should carry the hour and that I can return to as each new piece of machinery gets added. I'm tempted to use a grieving friend, but I suspect that loads the wrong picture in from the start — tell me whether to abandon it and what the replacement has to have and to lack. Third, the misconception map: the wrong ideas they'll arrive with or form mid-sequence ('sympathy is pity', 'the spectator is public opinion', 'it's a tiny judge inside your head', or whatever else you'd predict), and for each one the exact point in the sequence where heading it off is cheap rather than expensive. Finish with a single question I can ask in the last five minutes that would show you whether they've actually got the idea of an internalized corrected standpoint, or whether they've just learned the phrase 'impartial spectator'. And tell me what I should openly refuse to cover at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Moral philosopher specializing in Smith's sentimentalism, experienced teacher.
      *   **Task:** Create a teaching plan for a 50-minute PPE (Philosophy, Politics, Economics) first-year section on Smith's *Impartial Spectator*.
      *   **Constraints:**
          *   Students have read ~5 pages (likely *TMS* Part I, Section I & II).
          *   Major misconception: "Sympathy = Pity."
          *   Do *not* explain the spectator (I need to provide the plan, not the content itself).
          *   Deliverables:
              1.  Dependency Structure (what must come before what).
              2.  The One Worked Example (evaluate "grieving friend," propose replacement if needed, justify).
              3.  Misconception Map (when to head off specific errors).
              4.  Final Assessment Question (tests internalized corrected standpoint vs. catchphrase).
              5.  Scope Refusal (what *not* to cover).
      *   **Tone:** Professional, pedagogical, precise, slightly authoritative (expert colleague to grad student).

  2.  **Deconstruct Smith's Argument (Dependency Structure):**
      *   What is the core mechanism? It's *mutual adjustment* of sentiments to achieve *concord*.
      *   What is the foundation? *Sympathy* (Smithian sense: fellow-feeling with *any* passion, not just sorrow).
      *   What is the problem? Natural selfishness/partiality makes concord difficult.
      *   What is the solution? We imagine how an *uninvolved* party would feel.
      *   What is the result? The *Impartial Spectator* (the internalized standard of propriety).
      *   *Critical Dependency:* You cannot introduce the Spectator until students understand that sympathy is a *process of negotiation*, not just mirroring. If they think sympathy is just "feeling what you feel," the Spectator becomes redundant or just "public opinion."
      *   *Order:*
          1.  Redefine Sympathy (Fellow-feeling/Concord).
          2.  The Problem of Asymmetry (I feel my pain more than you do).
          3.  The Mechanism of Adjustment (I lower my tone, you raise your empathy).
          4.  The Standard Emerges (The point of concord = Propriety).
          5.  Internalization (The Spectator).

  3.  **Evaluate the Worked Example:**
      *   *Candidate:* Grieving Friend.
      *   *Pros:* Intuitive, emotional.
      *   *Cons:* Strongly triggers the "Sympathy = Pity" misconception. It focuses on *suffering*, whereas Smith is equally concerned with *joy*, *anger*, and *ambition*. It makes the "lowering of passion" seem like suppression of grief rather than calibration for social intelligibility.
      *   *Verdict:* Abandon it for the *primary* mechanistic explanation. It can be a side note, but it loads the wrong intuition.
      *   *Requirement for Replacement:* Needs to involve a passion where "too much" is annoying but "too little" is cold. Needs to be social but not purely tragic. Needs to show *mutual* effort.
      *   *Selection:* **The Annoyed Colleague/Roommate (Minor Injustice).**
      *   *Why:* It involves anger/resentment. Smith spends a lot of time on resentment. It shows the spectator checking *excessive* anger (calm down) and the observer checking *insufficient* empathy (get mad on their behalf). It avoids the "pity" trap. It's relatable to students.

  4.  **Map the Misconceptions:**
      *   *Misconception 1: Sympathy = Pity.*
          *   *Fix:* Minute 5. Define terms immediately. Use the "joy" counter-example.
      *   *Misconception 2: Spectator = Public Opinion/Actual Others.*
          *   *Fix:* Minute 30. Distinguish between the *actual* crowd (who might be biased) and the *imagined* ideal observer.
      *   *Misconception 3: Spectator = Conscience/Freudian Superego.*
          *   *Fix:* Minute 40. Emphasize it's a *social* standard internalized, not a divine voice or pure reason.
      *   *Misconception 4: It's just "What would Jesus/Gandhi do?"*
          *   *Fix:* Throughout. It's about *propriety* (fittingness), not saintliness.

  5.  **Drafting the Final Question:**
      *   Needs to distinguish between "What would people say?" (External) and "What is the fitting response given the situation?" (Internalized Standard).
      *   *Scenario:* A situation where public opinion is *wrong* or *biased*.
      *   *Idea:* A whistleblower or someone unpopular but right. If the Spectator is just "public opinion," they condemn the person. If it's "impartial," they approve the motive despite the crowd's anger.

  6.  **Determining Scope Refusal:**
      *   What's too much for 50 mins/5 pages reading?
      *   *Don't cover:* The distinction between Propriety and Merit (Part II).
      *   *Don't cover:* The historical context (Hume comparison).
      *   *Don't cover:* The "Man Within the Breast" theological implications.
      *   *Focus:* The *mechanism* of judgment in Part I.

  7.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Check:* Did I address the dependency structure clearly? Yes.
      *   *Check:* Is the example justified? Yes, the anger example is better for "calibration."
      *   *Check:* Is the tone right? Needs to be mentor-like. "Here is where they fall off the cliff."
      *   *Nuance:* Make sure to emphasize that the Spectator isn't a *person*, it's a *standpoint*.
      *   *Timing:* 50 minutes is tight. Need to allocate minutes.

  8.  **Final Review against constraints:**
      *   Dependency order? Yes.
      *   One worked example? Yes (The Resentful Roommate).
      *   Misconception map? Yes.
      *   Final question? Yes.
      *   Scope refusal? Yes.

      *(Self-Correction on the Example)*: Wait, Smith uses the grief example extensively. Why abandon it? Because the prompt says students *already* think sympathy is pity. Using grief reinforces that. I need an example where sympathy is *harder* to grasp as pity. Anger is perfect. Smith argues we sympathize with anger *only if* it is proportionate. This highlights the *judgment* aspect of sympathy, which is the gateway to the Spectator.

      *(Refining the Dependency)*: The crucial link is that Sympathy requires *Judgment* before it yields *Feeling*. You don't feel with me until you judge my situation. The Spectator is just that judgment mechanism crystallized.

      *(Refining the Final Question)*: Make it concrete. A scenario where the crowd is biased.

      *(Refining Scope)*: Explicitly mention "Merit vs. Propriety." That's the biggest time-sink.

  9.  **Final Polish:** Organize with clear headings. Ensure the voice is "senior colleague advising junior colleague." (Proceed to generate output).

  *(Wait, one last thought on the example)*: The prompt asks me to tell them whether to abandon the grieving friend. I should be decisive. "Abandon it as the *primary* engine." It can be a footnote, but not the load-bearing wall.

  *(Wait, one last thought on dependencies)*: The most critical dependency is that **Sympathy is not mirroring.** It is **imaginative transposition.** If they miss this, the Spectator makes no sense. I need to highlight this.

  Okay, ready to write.cw
answer: |-
  Here is the teaching plan. I have taught this section a dozen times; the structure below is designed to prevent the specific collapse you are worried about.

  ### I. The Dependency Structure
  You cannot introduce the Impartial Spectator until the students understand that Smithian sympathy is a **negotiation**, not a **mirroring**. If they believe sympathy is merely "catching" another's emotion (like yawning), the Spectator becomes redundant.

  **The Order of Operations:**
  1.  **Sympathy as Concord (Not Pity):** Establish that sympathy is the *agreement* of sentiments between two parties. It applies to joy, anger, and grief equally.
      *   *Why first?* If they think sympathy = pity, they cannot understand why we need to moderate joy or anger.
  2.  **The Asymmetry Problem:** Establish that the agent feels the passion more intensely than the observer ever can. (I feel my toothache more than you do).
      *   *Why second?* This creates the *need* for adjustment. Without asymmetry, there is no friction to resolve.
  3.  **The Mechanism of Adjustment:** The agent must lower their passion to meet the observer; the observer must raise their empathy to meet the agent.
      *   *Why third?* This is the active process. The "point of agreement" is what Smith calls **Propriety**.
  4.  **The Internalization:** We get tired of asking actual people. We imagine an ideal observer who knows all the facts and has no bias.
      *   *Why last?* The Spectator is just the *crystallized standard* of step 3. If you introduce this before they understand the negotiation, it becomes "What would my neighbors think?" (Public Opinion) rather than "What is the fitting response?" (Propriety).

  **What breaks if you skip:**
  If you skip **Asymmetry**, the Spectator looks like a killjoy telling you to suppress emotions. If you skip **Adjustment**, the Spectator looks like a magical voice rather than a social habit.

  ---

  ### II. The Worked Example
  **Verdict:** **Abandon the "Grieving Friend" as your primary engine.**
  You are correct to be suspicious. Because students enter thinking "sympathy = pity," using grief loads the track in the wrong direction. It makes the "moderation" of emotion look like cold-heartedness ("Why shouldn't I cry if my dad died?"). It obscures the *judgment* component of sympathy.

  **The Replacement: The Resentful Roommate.**
  **Scenario:** Your roommate comes home furious because a professor graded them unfairly (say, a 88 instead of a 90). They are slamming doors and yelling.

  **Why this works:**
  1.  **It tests the limits of sympathy:** We do not automatically sympathize with anger (unlike grief). We only sympathize if the anger is *proportionate* to the cause. This forces the **Judgment** step immediately.
  2.  **It requires双向 (Two-way) Adjustment:**
      *   *The Roommate (Agent):* Must lower their rage to a level where you can understand it (stop slamming doors, explain the grade).
      *   *You (Observer):* Must try to feel their frustration, but you will stop short if they remain hysterical.
  3.  **It isolates Propriety:** The "Impartial Spectator" is simply the question: "Is a 2-point grade difference worth *this* level of rage?"

  **How to run it through the hour:**
  *   **Min 10:** Describe the rage. Ask: "Do you feel their anger immediately?" (No).
  *   **Min 20:** Ask: "What must the roommate do to get you to sympathize?" (Calm down, explain). This is **lowering the passion**.
  *   **Min 30:** Ask: "What if the professor actually stole their paper?" (Now the rage is fitting). This establishes the **standard of propriety**.
  *   **Min 40:** Ask: "What if everyone else in the dorm thinks the roommate is crazy, but you know the facts?" This introduces the **Impartial Spectator** (you judge based on facts, not the crowd's opinion).

  ---

  ### III. The Misconception Map
  Here is where they will fall off, and exactly when to patch the hole.

  | Misconception | When it arises | The "Cheap Fix" (Intervention Point) |
  | :--- | :--- | :--- |
  | **"Sympathy is Pity"** | Minute 5 (Definitions) | **Do not let this slide.** Explicitly write on the board: *Smithian Sympathy = Fellow-feeling with ANY passion (including joy/anger).* Give a counter-example: "Do you sympathize with a fan winning the World Cup?" |
  | **"The Spectator is Public Opinion"** | Minute 35 (Introduction of Spectator) | **Distinguish the 'Actual' from the 'Imagined'.** Use the Roommate example: "What if the whole dorm thinks he's crazy, but he's actually right?" The Spectator sides with *him* (the facts), not the *dorm* (the crowd). |
  | **"It's a Tiny Judge in My Head"** | Minute 45 (Internalization) | **Emphasize it is a Standpoint, not a Person.** Say: "It is not a homunculus. It is the *habit* of viewing your own conduct from the distance of the observer." |
  | **"It Demands Perfection"** | Minute 48 (Normative force) | **Clarify Propriety vs. Saintliness.** The Spectator asks "Is this fitting?", not "Is this heroic?" It allows for normal human weakness, just not excess. |

  ---

  ### IV. The Final Assessment Question
  Do not ask: "What is the Impartial Spectator?" (They will recite the definition).
  Do not ask: "Is the Spectator useful?" (They will say yes).

  **Ask this instead (Last 5 minutes):**
  > "Imagine you are a whistleblower exposing corruption in your company. Your colleagues, your friends, and your family all think you are a traitor and are furious with you. They are the 'public.'
  >
  > According to Smith, if you consult the **Impartial Spectator**, does it tell you to stop because everyone hates you? Or does it tell you that your resentment against the corruption is proper, even if no actual person sympathizes with you right now? **Why?**"

  **What to listen for:**
  *   **Fail:** "It tells you to stop because the Spectator is what society thinks." (They confuse Spectator with Public Opinion).
  *   **Fail:** "It tells you to follow your conscience because God says so." (They import external moral sources).
  *   **Pass:** "It tells you your resentment is proper because an *imagined* observer who knows the *facts* would agree with you, even if actual people don't." (They grasp the **internalized corrected standpoint**).

  ---

  ### V. Scope Refusal (What to Explicitly Skip)
  You have 50 minutes and students with 5 pages of reading. If you touch these, you will lose the core mechanism.

  1.  **Propriety vs. Merit:** Do not distinguish between judging the *appropriateness* of an action (Propriety) and the *worthiness of reward/punishment* (Merit). That is Part II of *TMS*. Stick to Propriety.
  2.  **The "Man Within the Breast":** Do not get into the theological or quasi-religious implications of the Spectator as a divine surrogate. It confuses the secular/social mechanism.
  3.  **Hume Comparison:** Do not compare Smith's sympathy to Hume's. It is a fascinating rabbit hole, but it requires a mastery of Hume they do not have yet.
  4.  **Self-Command:** Mention it only as the *tool* used to lower the passion. Do not make it a separate topic.

  **Final Advice:**
  Your job is not to make them love Smith. Your job is to ensure that when they write their essay, they do not write "Smith thinks we should pity the sad." If you secure the **Sympathy = Concord** definition and the **Spectator ≠ Public Opinion** distinction, you have won the hour.
