answer: |-
  (1) Exam Question

  **Final Examination: Normative Ethics**
  **Time Allowed: 90 Minutes**

  **Question 1**
  In biomedical ethics, withdrawing life-sustaining treatment (such as disconnecting a ventilator at a competent patient's request) is standardly classified as "letting die" rather than "killing," despite the fact that disconnecting the machine is physically an action.

  Write an essay that addresses the following:
  1.  Explain why this classification creates a decisive problem for accounts of the doing/allowing distinction grounded solely in the metaphysical difference between acting and refraining, or in the bare fact of causal involvement in a death.
  2.  Assess whether the distinction can be salvaged by revising it to focus on (a) the difference between initiating a lethal sequence versus declining to continue aid, or (b) the patient's right to refuse bodily intrusion.
  3.  Argue whether such revisions successfully preserve a non-consequentialist distinction or whether they render the doctrine ad hoc or collapse it into consequentialism in disguise.

  ***

  (2) Model Answer

  The classification of withdrawing life-sustaining treatment as "letting die" presents a fatal counterexample to naive formulations of the doing/allowing distinction. If the distinction rested merely on the metaphysical difference between bodily movement (action) and stillness (omission), withdrawing treatment would constitute killing. Disconnecting a ventilator requires physical manipulation; it is not a refraining. Similarly, if the distinction relied on bare causal involvement, withdrawing treatment would also qualify as killing. Removing the support causes the patient's death just as directly as administering a lethal injection. In both cases, had the agent acted differently, the patient would live. Therefore, any account grounding the distinction in physical act-types or simple counterfactual causation fails to accommodate the widely accepted moral intuition that honoring a refusal of treatment is permissible letting die, not impermissible killing.

  To salvage the distinction, theorists often propose structural revisions rather than metaphysical ones. The first revision distinguishes between initiating a new lethal sequence and declining to continue an aid that is already in place. On this view, the disease is the cause of death in withdrawal cases; the agent merely stops interfering with the natural course. The second revision grounds the distinction in rights. Here, the classification depends not on the agent's movement, but on the patient's entitlement. Because a competent patient has a right to bodily integrity, they may demand the cessation of unwanted intrusion. When a physician complies, they are respecting a right, not violating a duty not to kill.

  However, these revisions face significant theoretical pressure regarding whether they are ad hoc or consequentialist. The "lethal sequence" revision risks being ad hoc. Critics argue that drawing a moral line based on who started the causal chain is arbitrary unless backed by a deeper principle. If the outcome (death) is identical, privileging the "natural" cause over the "artificial" removal of a barrier looks like a post-hoc rationalization to preserve a traditional doctrine. Without an independent justification for why nature's causality matters morally, this revision appears tailored specifically to save the distinction in medical cases while failing elsewhere.

  The rights-based revision is more robust but invites the charge of consequentialism in disguise. If the only reason withdrawing treatment is "letting die" is that it respects autonomy, one might argue the distinction itself has no intrinsic moral weight. Instead, the moral work is being done entirely by the right to autonomy. If violating that right produces better overall consequences (e.g., keeping a patient alive to care for dependents), a consequentialist might override it. Thus, if the doing/allowing distinction is merely a proxy for rights-violations, it is not a fundamental moral category but a derivative rule of thumb. However, a non-consequentialist can resist this by arguing that rights function as side-constraints, not merely as weights in a utility calculation. On this view, the distinction remains vital because it marks the boundary of permissible agency regardless of outcomes.

  Ultimately, the doing/allowing distinction cannot survive on metaphysical grounds alone. The withdrawing treatment case proves that physical action and causal involvement are insufficient criteria. The distinction can be preserved only if grounded in normative facts, specifically patient rights and the moral significance of imposed versus unimposed harm. While this risks making the distinction derivative of rights theory, it does not necessarily collapse into consequentialism provided those rights are treated as inviolable constraints. Therefore, the distinction remains viable, but only as a normative construct rather than a descriptive fact about motion or causation.

  ***

  (3) Marking Scheme

  **Total Marks: 20**

  **Grading Breakdown**

  *   **Part 1: The Problem (0–5 marks)**
      *   **A Range (4–5):** Clearly explains that withdrawing is physically an action and causally efficacious, demonstrating why "act/omission" and "cause/non-cause" definitions fail to match the moral classification.
      *   **B Range (2–3):** Identifies that withdrawing is an action but offers a vague explanation of why this undermines causal accounts.
      *   **C Range (0–1):** Merely states the case without explaining the theoretical conflict.

  *   **Part 2: The Revisions (0–5 marks)**
      *   **A Range (4–5):** Accurately articulates both the "lethal sequence" and "rights-based" revisions, distinguishing between causal history and normative entitlement.
      *   **B Range (2–3):** Describes one revision well but conflates the two or misses the nuance of the "sequence" argument.
      *   **C Range (0–1):** Fails to identify specific revisions beyond general appeals to "intent."

  *   **Part 3: Critical Assessment (0–5 marks)**
      *   **A Range (4–5):** Deeply analyzes the "ad hoc" and "consequentialism" charges. Explains how rights can be side-constraints (blocking consequentialism) or how sequence arguments might lack independent principle (ad hoc).
      *   **B Range (2–3):** Identifies the charges but asserts a conclusion without explaining the mechanism (e.g., states "it is not consequentialist" without explaining why).
      *   **C Range (0–1):** Ignores the theoretical cost of the revisions.

  *   **Structure and Clarity (0–5 marks)**
      *   **A Range (4–5):** Cogent, logical flow; precise philosophical terminology; no wasted space.
      *   **B Range (2–3):** Understandable but somewhat disorganized or verbose.
      *   **C Range (0–1):** Difficult to follow or fails to address all three parts of the prompt.

  **Distinct Realistic Mistakes (Deduct 2 marks each if present)**

  1.  **The Physicalist Error:** Claiming that disconnecting a ventilator is physically an "omission" or "inaction."
      *   *Misunderstanding:* Reveals a confusion between moral classification and physical description.
  2.  **The Consequentialist Caricature:** Asserting that consequentialism necessarily accepts the doing/allowing distinction as morally fundamental.
      *   *Misunderstanding:* Reveals a failure to grasp that consequentialism typically evaluates outcomes, not the act/omit pathway itself.
  3.  **The Rights Conflation:** Arguing that because a patient has a right to die, the physician is "killing" them justifiably.
      *   *Misunderstanding:* Reveals a confusion between the definition of the act (killing vs. letting die) and the justification of the act.
