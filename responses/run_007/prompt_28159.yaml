answer: |-
  Consider the human arrector pili muscles responsible for goosebumps, which were evolutionarily selected in furry ancestors to fluff coat for insulation against cold and to increase apparent size during threat displays, thereby securing their etiological function as thermoregulatory and defensive tools. In modern humans, these muscles still contract detectably in response to cold or adrenaline, raising body hair despite our lack of significant pelage, creating a scenario where the selected-effects account maintains the trait retains its function because its presence is explained by that past selection history. However, the causal-role account denies it has a function relative to the current organism because the contraction no longer contributes to any actual capacity of the human system—it neither meaningfully retains heat nor intimidates predators, rendering the activity a causal dead-end that explains no current systemic capacity.

  **Walkthrough**
  The trait was selected for **thermoregulation and threat display** in a furry ancestral environment. Currently, it **contracts to raise hair (goosebumps)** when the sympathetic nervous system is triggered by cold or fear. The causal-role account withholds function because, on this view, a function is defined by a trait's current causal contribution to a capacity of the containing system; since human hair elevation contributes nothing to the capacities of "maintaining body temperature" or "social signaling" in our current phenotype, the activity is merely a causal occurrence, not a functional role.

  **Deep Dive**
  The feature doing the real work is the **phenotypic-environmental mismatch** (specifically the loss of fur) that decouples the trait's activity from any beneficial systemic outcome. If you removed this feature by restoring a thick fur coat, the hair elevation would once again trap heat, and the causal-role account would immediately reassign a function because the activity would again contribute to the system's thermoregulatory capacity. A causal-role theorist would most plausibly push back by arguing that functions are relative to an *analysis* of capacity; they would claim the trait *does* have a function relative to the capacity "responding to sympathetic nervous system stimuli," thereby preserving the function assignment by shifting the target capacity from survival benefits to mere physiological connectivity, though this risks making the account trivially permissive.
