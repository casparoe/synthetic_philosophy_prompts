answer: |-
  # Diagnostic Quiz: The Boundaries of Cognition

  **Introduction for Participants:**
  This quiz is designed to map your pre-theoretical intuitions about where cognitive processes begin and end. There are no "correct" answers in the standard sense; rather, your pattern of responses reveals which philosophical commitments you already hold regarding the mind, body, and world. Please read each scenario vividly. Imagine yourself in the situation. Then select the option that best matches your judgment about the *status* of the external resource described.

  **Response Options (Constant for all questions):**
  *   **(A) Constitutive:** The external resource is best described as **part of the cognitive process itself**. (Removing it would not just hinder the person; it would diminish or alter the cognitive process in the way losing a brain region would).
  *   **(B) Causal:** The external resource is **a mere tool** that provides input to or output from a cognitive process that is wholly internal. (Removing it hinders performance, but the thinking itself remains inside the head).
  *   **(C) Ambiguous:** The case falls **in between**, depends on further details not provided, or resists clean classification.

  ---

  ### The Scenarios

  **1. The Notebook (Otto's Memory)**
  Otto has Alzheimer's disease and cannot retain new information in his biological memory. He carries a notebook everywhere. When he learns the Museum of Modern Art is on 53rd Street, he writes it down. When he wants to go there, he consults the notebook. He trusts the notebook completely and never leaves home without it.
  *Is the information stored in the notebook part of Otto's memory?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **2. The Blind Person's Cane (Sensorimotor Loop)**
  Elena has been blind since childhood and navigates her city using a white cane. She moves fluidly, detecting textures, curbs, and obstacles through vibrations in her hand. She reports that she "feels" the sidewalk at the tip of the cane, not in her palm.
  *Is the cane part of Elena's perceptual system?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **3. The Smartphone (Digital Extension)**
  Marcus uses his smartphone for almost everything: navigation, contact numbers, calendar scheduling, and factual lookups. The phone is always in his pocket, unlocked via fingerprint, and he accesses it reflexively without conscious deliberation. He feels anxious when separated from it.
  *Is the smartphone part of Marcus's active cognitive system?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **4. The Whiteboard (Reasoning)**
  Dr. Aris is solving a complex logical proof. She cannot hold all the variables in her head. She writes symbols on a whiteboard, steps back, looks at them, erases some, draws arrows, and writes new ones. The reasoning happens in the loop between her eyes, her hand, and the marks on the board.
  *Are the marks on the whiteboard part of the reasoning process?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **5. The Novice Calculator (Integration Test)**
  Sam is learning to use a complex scientific calculator for the first time. He needs to solve a physics problem. He has to consciously think about which buttons to press, looks up the manual frequently, and often enters data incorrectly. The calculator is performing the computation, but Sam's interaction with it is clumsy and effortful.
  *Is the calculator part of Sam's cognitive system during this task?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **6. The Thinking Couple (Social Extension)**
  Juno and Leo have been partners for twenty years. When planning a trip, they sit together. Juno remembers dates; Leo remembers budgets. They finish each other's sentences. If asked individually, neither can produce the full plan. Together, they function as a single planning unit.
  *Is the couple, rather than the individuals, the unit of cognitive analysis for this task?*
  *   (A) Constitutive (The couple is the thinker)
  *   (B) Causal (They are two thinkers exchanging information)
  *   (C) Ambiguous

  **7. The Neural Implant (The Boundary)**
  Kai has a neural implant that allows him to control a cursor on a screen with his thoughts. Over time, the interface becomes transparent; he no longer thinks "move cursor," he simply thinks "select that," and the external device responds as if it were a limb.
  *Is the external cursor/screen system part of Kai's motor cognition?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  **8. The Ship Navigation Team (Distributed System)**
  A naval vessel enters a harbor. No single person knows the ship's exact position. One person reads the radar, another checks the chart, another steers, another communicates with the tower. The "knowledge" of where the ship exists only in the flow of information between them and their instruments.
  *Where is the cognitive process of "navigating the ship" located?*
  *   (A) Constitutive (It is distributed across the team and tools as a single system)
  *   (B) Causal (It is the sum of individual internal processes coordinated together)
  *   (C) Ambiguous

  **9. The Google Search (Immediate Access)**
  Priya is in a trivia contest. She doesn't know the answer. She pulls out her phone and Googles it. The answer appears in 2 seconds. She did not know it before searching, nor does she retain it after. The information was available, but not "in" her.
  *Is the Google search engine part of Priya's memory retrieval process?*
  *   (A) Constitutive
  *   (B) Causal
  *   (C) Ambiguous

  ---

  # Scoring Key and Diagnostic Guide

  **Note to the Facilitator:**
  This quiz does not yield a single "score." Instead, it generates a **Profile of Commitments**. Philosophical positions in this space are often overlapping clusters rather than mutually exclusive boxes. Use the following guide to interpret patterns.

  ### 1. The Intracranialist Profile
  *   **Typical Pattern:** Predominantly **(B)** across all scenarios.
  *   **Diagnostic Logic:** This respondent maintains a strict boundary at the skull (or perhaps the skin). Even in cases of high fluency (Otto, Smartphone) or embodiment (Cane), they view external resources as *causal inputs* that trigger internal processing, but never as *constitutive parts* of the processing itself.
  *   **Philosophical Alignment:** Traditional Cartesianism, Methodological Individualism, some forms of Neurocentrism.
  *   **Discussion Point:** Ask them: "If we replaced Otto's notebook neurons with silicon chips inside his head, would that be memory? If so, why does the location (inside vs. outside skull) matter if the function is identical?"

  ### 2. The Embodied Cognition Profile
  *   **Typical Pattern:** **(A)** on Scenario 2 (Cane) and Scenario 7 (Implant/Motor); **(B)** or **(C)** on Scenario 1 (Notebook), 3 (Smartphone), and 4 (Whiteboard).
  *   **Diagnostic Logic:** This respondent is willing to extend cognition into the *biological body* or tools that function as bodily prosthetics (sensorimotor loops), but draws the line at abstract artifacts or information stores. They see the mind as enacted through the body, but not necessarily offloaded onto the world.
  *   **Philosophical Alignment:** Enactivism, Sensorimotor Theory (O'Regan & Noë), some interpretations of Merleau-Ponty.
  *   **Discussion Point:** "Why is the cane part of the perceptual system but the notebook not part of the memory system? Both transform a dispositional state into an active engagement with the world."

  ### 3. The Extended Cognition (Parity) Profile
  *   **Typical Pattern:** **(A)** on Scenario 1 (Notebook), 3 (Smartphone), and 4 (Whiteboard). Potentially **(B)** on Scenario 5 (Novice).
  *   **Diagnostic Logic:** This respondent relies on the **Parity Principle**: "If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process." They focus on *functional role* over physical location.
  *   **Philosophical Alignment:** Clark & Chalmers (1998) "The Extended Mind."
  *   **Discussion Point:** "Does functional equivalence alone suffice? If I memorize a route internally, it's memory. If I write it down, is it *the same kind* of state, or just a functionally equivalent substitute?"

  ### 4. The Extended Mind (Integration/Trust & Glue) Profile
  *   **Typical Pattern:** **(A)** on Scenario 1 (Otto) and 3 (Smartphone); **(B)** or **(C)** on Scenario 5 (Novice) and 9 (Google).
  *   **Diagnostic Logic:** This respondent accepts extension but adds **constraints**. They distinguish between Otto (high integration) and the Novice (low integration). They look for "Trust and Glue": the resource must be reliably available, automatically endorsed, and easily accessible. They might reject the Google case (Scenario 9) because the information isn't *persistently* available or endorsed.
  *   **Philosophical Alignment:** Clark (2008, 2010) *Supersizing the Mind*, "Trust and Glue" criteria.
  *   **Discussion Point:** "Why does the history of interaction matter? If the Novice calculator gives the right answer, why isn't it cognitive? Is 'feeling' part of cognition?"

  ### 5. The Socially Extended Cognition Profile
  *   **Typical Pattern:** **(A)** on Scenario 6 (Couple); potentially **(A)** on Scenario 8 (Ship). May vary on artifacts.
  *   **Diagnostic Logic:** This respondent believes the boundaries of the mind can include *other minds*. They see interpersonal coordination not just as communication between two systems, but as the formation of a new, larger cognitive system.
  *   **Philosophical Alignment:** Social Extended Cognition (Theiner, Gilbert), Joint Intentionality.
  *   **Discussion Point:** "If the couple is the thinker, where is the consciousness located? Can a system have beliefs that neither individual possesses?"

  ### 6. The Distributed Cognition Profile
  *   **Typical Pattern:** **(A)** on Scenario 8 (Ship) and 4 (Whiteboard); may mark **(C)** on individual-focused questions (1, 2, 3).
  *   **Diagnostic Logic:** This respondent often finds the question "Is X part of the *person's* process?" misleading. They argue the *unit of analysis* is the system (Person + Artifact + Environment). They are likely to answer (A) on the Ship scenario but might hesitate on Otto, not because Otto isn't extended, but because focusing on Otto misses the systemic properties.
  *   **Philosophical Alignment:** Hutchins (1995) *Cognition in the Wild*, Distributed Cognition (DistCog).
  *   **Discussion Point:** "If the system is the cognitive unit, does the concept of 'individual mind' dissolve entirely, or just become less useful for explanation?"

  ### Ambiguous and Unoccupied Spaces

  **The "Coupling-Constitution" Fallacy Suspicion**
  *   **Pattern:** **(C)** on almost all "Extended" cases (1, 3, 4), but **(A)** on Embodied cases (2).
  *   **Interpretation:** This respondent suspects that just because two things are coupled (Otto and Notebook), it doesn't mean they constitute one thing. They accept embodiment (body is special) but reject artifact extension. This is a stable, defended position (often associated with Adams & Aizawa's "Mark of the Cognitive" critique).

  **The "Google" Gap (Unoccupied Position)**
  *   **Pattern:** **(A)** on Scenario 9 (Google Search) but **(B)** on Scenario 1 (Otto).
  *   **Interpretation:** This position is rarely defended. It suggests that *transient* access (Google) is more constitutive than *persistent* access (Notebook). If a respondent selects this, probe them. They may have misunderstood the scenarios, or they may hold a novel view that "availability on demand" is more cognitively real than "local storage." This is likely an incoherent combination unless they argue that the *network* is the mind, not the device.

  **The "Implant" Boundary**
  *   **Pattern:** **(A)** on Scenario 7 (Implant) but **(B)** on Scenario 3 (Smartphone).
  *   **Interpretation:** This is a very common intuition (the "Skull Boundary"). It separates Intracranialists from Extensionists. However, if they answer (A) on Implant but (B) on Cane, they hold a "Cranialist" view that only *internal* tech counts. This is philosophically difficult to defend (why does a silicon chip inside the skull differ from one outside connected by wire?), making it a fruitful spot for debate.

  ### Facilitator's Guide to Group Dynamics

  1.  **Look for Clusters:** If most of your group scores as **Intracranialists**, the reading will be a shock. Frame Clark & Chalmers as challenging their deepest intuitions.
  2.  **Look for Splits:** If the group splits on Scenario 5 (Novice), you have a live debate between **Parity** (Function is all that matters) vs. **Integration** (History/Relation matters). This is the cutting edge of the debate.
  3.  **Look for Social/Distributed:** If several participants select **(A)** on Scenario 8 (Ship) but **(B)** on Scenario 1 (Otto), you have a tension between *Individual Extension* (Clark) and *Systemic Distribution* (Hutchins). This is a crucial distinction: Clark wants to save the individual agent by expanding them; Hutchins wants to replace the individual agent with the system.

  **Final Note:** Remind participants that changing their answers after reading Clark & Chalmers is the goal of the seminar. This quiz captures their *starting point*, not their final destination.
