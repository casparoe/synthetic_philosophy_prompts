      *   *Why it's not factual:* Knowing how many religious people feel marginalized doesn't tell us if marginalization is unjust or necessary for peace.
      *   *Prospects for Progress:* Pessimistic but nuanced. No "solution" is possible because it's a clash of ultimate values. *However*, progress looks like "modulation" or "hybridity" (e.g., Wide Public Reason, Conscience exemptions) rather than victory.
