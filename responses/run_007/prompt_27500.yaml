          2.  **Lewis-Halfer (Standard Halfer):** $P(H) = 1/2$ on waking. $P(H | Mon) = 2/3$. Treats "I am awake" as no new info, but "It is Monday" as new info that shifts probability toward Heads (since Tails has more days to be *not* Monday).
          3.  **Double-Halfer:** $P(H) = 1/2$ on waking. $P(H | Mon) = 1/2$. Maintains 1/2 throughout. Often requires rejecting standard conditionalization or treating "It is Monday" differently.
          4.  **SIA/SSA Variants:** Sometimes diverge on extreme cases (e.g., 1000 awakenings).
          5.  **Hybrid/Contextual:** Credence depends on betting context vs. abstract belief.

