answer: |-
  An adequate theory of indicative conditionals must bridge semantics (truth conditions) and epistemology (credence). The field fractures because five natural requirements cannot jointly hold. Below are the desiderata, their motivations, and their status.

  **Desiderata**

  1.  **Propositionality:** Conditionals express truth-evaluable propositions.
      *   *Motivation:* Embedding. We negate them ("It's not the case that if A, C"), disjoin them, and place them in antecedents. Truth-functional operators require propositional inputs.
      *   *Status:* **Camp Preference.** (Suppositionalists deny this.)
  2.  **The Equation:** Rational credence in $A \to C$ equals conditional credence $P(C|A)$.
      *   *Motivation:* The Die Case. For a fair die, credence that "if even, then six" is 1/3, matching $P(\text{six}|\text{even})$, not the material conditional's 2/3.
      *   *Status:* **Non-negotiable** (for most), though some restrict its scope.
  3.  **Modus Ponens:** From $A$ and $A \to C$, infer $C$.
      *   *Motivation:* Inference. We assert conditionals primarily to license deductive steps in reasoning.
      *   *Status:* **Non-negotiable.**
  4.  **Classical Probability:** Credences obey Kolmogorov axioms (sum to 1, etc.).
      *   *Motivation:* Decision Theory. Standard Dutch book arguments require classical probability to avoid guaranteed loss.
      *   *Status:* **Non-negotiable.**
  5.  **Non-Triviality:** Contingent conditionals admit intermediate probabilities.
      *   *Motivation:* Uncertainty. We are rarely certain about conditionals; probabilities shouldn't collapse to 0 or 1.
      *   *Status:* **Non-negotiable.**

  **The Incompatibility**

  Triviality results prove that **Propositionality + The Equation + Classical Probability + Non-Triviality** is an inconsistent set. If conditionals are propositions with classical probabilities that always match conditional probabilities, all conditional probabilities collapse to 0 or 1. You must sacrifice one desideratum.

  **Costs of Escape Routes**

  *   **Deny Propositionality:** (Suppositional View) Saves The Equation and Non-Triviality.
      *   *Cost:* Fails Propositionality. Embeddings become semantically mysterious. If conditionals aren't propositions, what does negation operate on? Logic becomes non-standard, complicating the account of complex sentences.
  *   **Restrict The Equation:** (Stalnaker-style) Saves Propositionality, Logic, and Classical Probability.
      *   *Cost:* Fails The Equation (universally). Admits that sometimes $P(A \to C) \neq P(C|A)$. This severs the tight link between conditionals and Bayesian updating, requiring error theories for intuitive cases like the die roll.
  *   **Modify Probability:** (Non-classical credences) Saves Propositionality and The Equation.
      *   *Cost:* Fails Classical Probability. Requires exotic decision theory. Abandoning standard Dutch book arguments makes rationality hard to define and loses compatibility with standard statistics.
  *   **Accept Triviality:** (Material/Strict) Saves Propositionality and Classical Probability.
      *   *Cost:* Fails Non-Triviality or The Equation. Material conditionals yield wrong probabilities (2/3 vs 1/3); Strict conditionals make most ordinary conditionals false or trivially certain.

  **Scorecard**

  *   **Material Conditional:** Preserves classical logic and propositions but catastrophically fails The Equation and intuitive truth conditions.
  *   **Strict Conditional:** Preserves necessity and propositions but renders most ordinary indicatives false or trivially certain.
  *   **Stalnaker-Style:** Preserves propositions and logic but must restrict The Equation to avoid triviality results.
  *   **Suppositional View:** Preserves The Equation and intuition but denies propositions, complicating embeddings and logical operators.
