prompt: |-
  I'm in a seminar on conditionals and probability, and before I read any more theories I want to nail down what a theory of indicitive conditionals is even supposed to do, because right now the field looks like a pile of facts pulling in different directions. People will happily say that "if the die comes up even, it comes up six" deserves probability 1/3, not the 2/3 the material conditional would give it; but the same people use conditionals in modus ponens without blinking, and they embed them (however awkwardly) in negations, disjunctions, and antecedents. Meanwhile Lewis's triviality results seem to say you can't have everything at once: if indicative conditionals are ordinary propositions, and their probabilities live in a classical probability calculus, and their probability always equals the corresponding conditional probability, the whole setup collapses into triviality. I'd rather get the requirements list straight before I go theory-shopping.

  So: write the desiderata an adequate theory of indicative conditionals has to meet, where "adequate" means good enough to serve as a semantics of natural-language indicatives and to say how rational credences should interact with them. For each requirement, give the case or result that motivates it. Mark which requirements are non-negotiable and which are just camp preferences. Then flag any subset of the list that can't be jointly satisfied — I especially want to see what each way out (denying that conditionals express propositions, restricting the Adams thesis, messing with the probability calculus) costs you against the rest of the desiderata. Close with a one-sentence scorecard for the material conditional, a strict conditional, a Stalnaker-style selection-function view, and a no-truth-value suppositional view.

  Hard cap: 800 words. And no citations or reading list — I dont want the bibliography, I want the spec.
