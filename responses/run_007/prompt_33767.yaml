prompt: |-
  I'm putting together a short position statement for a reading group on Hofstadter's strange loops and the inviolate level, and I'd like a consistency check before I circulate it. Here's roughly the set of things I believe, as I'd defend them:

  (1) The Drawing Hands paradox is only apparent. Each hand draws the other, but the loop is anchored in an inviolate level — the actual lithograph, Escher's real hand, the fixed drawing — which neither drawn hand can reach or alter. Strange loops never float free; they always rest on something that isn't itself in the loop.

  (2) I think the self is a strange loop in that family: the mind is a self-referential pattern running on the brain, not a separate substance or a homunculus.

  (3) I think every strange loop has an inviolate level, including the mind. For the mind, that inviolate level is the neural substrate (or the physics underneath it). So the self can't be causa sui — it can't get underneath its own ground or bootstrap itself into existence.

  (4) But I also think people can revise their own deepest commitments through reflection: someone can reason their way out of a worldview they were raised in, or change what they fundamentally value, and I want to say they genuinely rewrite the rules, not just move pieces around inside rules that stay fixed.

  (5) I think a running program could be a self if it ran the right sort of self-referential pattern, and I think it's fine for such a program to rewrite its own source code — as long as the interpreter or hardware stays fixed. That looks to me like the inviolate level doing its job.

  (6) Seperately, I think a person can in principle come to see the actual machinery of their own thought through reflection or meditation — not just tell a flattering post-hoc story about it, but really catch sight of the rules doing the work.

  Does this hang together? I can't tell whether these fit together or whether I'm smuggling in something the rest rules out. Go through the commitments in pairs and tell me which are actually in tension, which only look like they are, and rank the real tensions by severity. For each real tension, say what would have to give and what the cheapest fix is, and then tell me which single revision would clean up the most.

  I'd like you to answer as a professional philosopher who works on self-reference, formal systems and philosophy of mind, and who knows Hofstadter's Gödel, Escher, Bach well. Think carefully — maybe brainstorm the candidate tensions first, then give your considered ranking. And I want a committed answer: take a definite position on which commitment should be dropped or weakened, and defend it, rather than laying out options and leaving me to choose.

  Please write the answer in British English.
