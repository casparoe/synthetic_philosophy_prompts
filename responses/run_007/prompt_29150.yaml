  DANIEL DENNETT: Cheers for meeting me, Gregg. I'll have a flat white, thanks. I've been reading your latest papers on the public health quarantine model, and whilst I admire the compassion behind it, I worry you're throwing the baby out with the bathwater. You seem to think that if determinism is true, the notion of 'just deserts' evaporates entirely. But surely, desert isn't a metaphysical magic trick; it's a status we confer within a social practice. When we hold someone responsible, we're acknowledging their capacity to respond to reasons, not claiming they possess some uncaused cause within their soul.

  GREGG CARUSO: Cheers, Daniel. I'll stick to black coffee, myself. I appreciate the pragmatism, truly I do. But here's the rub: even if we treat responsibility as a social practice, the infliction of harm based on 'desert' requires a deeper justification. If an agent's actions are the result of factors ultimately beyond their control—their genetics, their upbringing, the luck of the draw—then inflicting suffering because they 'deserve' it seems fundamentally unjust. It's not about whether they can respond to reasons; it's about whether they are the ultimate authors of their choices. If they aren't, retribution is just vengeance dressed up in moral clothing.

  DANIEL DENNETT: But that demand for 'ultimate authorship' is a red herring. It sets the bar so high that nothing could ever clear it, not even a god. What matters for justice is avoidability. Could the agent have done otherwise *if* they had chosen to? If the answer is yes, then they are liable. When we punish, we aren't seeking metaphysical revenge; we're maintaining the 'space of reasons'. We're signalling to the community that certain behaviours are unacceptable. If we remove the sting of retribution, we risk undermining the very norms that protect us. You can't run a society on a purely clinical basis.

  GREGG CARUSO: I'd challenge the idea that we need the sting of retribution to maintain norms. We can certainly signal that behaviours are unacceptable without invoking basic desert. Think of it like carrying a dangerous pathogen. If someone is infectious, we quarantine them to protect the public, not because they're 'evil' for being sick. We treat them with dignity, aiming for rehabilitation and release. Why not apply this to criminal justice? We detain based on risk and need for rehabilitation, not because they deserve to suffer. That preserves dignity without relying on the illusion of ultimate responsibility.

  DANIEL DENNETT: The quarantine analogy is tidy, but it's dehumanising in its own way. It treats the offender as a vector of disease rather than a moral agent. Part of respecting someone as a person is holding them accountable for their misdeeds, which entails a backward-looking element. It says, 'You did this wrong, and you owe a debt.' If you remove the backward-looking blame, you remove the opportunity for moral growth through guilt and restitution. A purely forward-looking system treats people as objects to be managed, not agents to be reasoned with.

  GREGG CARUSO: I'd argue the opposite, Daniel. Treating someone as a moral agent in the retributive sense actually diminishes their dignity because it holds them accountable for things they couldn't ultimately help. We can have accountability without basic desert. We can say, 'This action was harmful, you are responsible for making amends,' without saying, 'You deserve to suffer for this.' We can foster moral growth through restorative justice and counselling rather than punitive suffering. The focus shifts from 'how much pain do they deserve?' to 'how do we repair the harm and prevent recurrence?' That seems more humane, not less.

  DANIEL DENNETT: But there's a danger in severing the link between wrongdoing and negative consequences entirely. Human psychology is wired for reciprocity. If society refuses to express moral outrage through proportionate punishment, victims may feel abandoned, and the communal sense of justice erodes. The feeling that a wrongdoer has 'paid their debt' is crucial for social closure. If we adopt your model, we risk a system that looks too much like preventive detention to the public eye. People need to feel that justice has been done, not just that safety has been secured. Otherwise, you'll have vigilantes taking matters into their own hands.

  GREGG CARUSO: That's a fair concern about public perception, but public perception can be educated. We've shifted views on capital punishment and corporal punishment before; we can shift views on retribution. The vigilante risk is real, but it stems from a desire for vengeance, which we ought to be dampening, not catering to. If we build a system focused on repair and safety, we model a better way of relating to one another. We show that we value human welfare over payback. It's a bold programme, yes, but clinging to 'just deserts' in a deterministic universe means clinging to a myth that causes real harm.

  DANIEL DENNETT: I suppose we agree that harm reduction is vital, but I maintain that 'desert' isn't a myth; it's a functional reality within our form of life. To deny it is to undermine the competences that make us human. However, I recognise you're not advocating for letting criminals roam free. You're proposing a different justification for confinement. I just fear that without the language of responsibility and desert, we lose the normative force required to sustain a liberal democracy. It's a gamble, Gregg.

  GREGG CARUSO: And I fear that with it, we sustain a system that inflicts suffering on people who are, in the grand scheme of things, victims of luck. It's a gamble either way, Daniel. But I'd rather bet on a system that admits the truth of our situation and seeks to minimise harm, rather than one that justifies harm through a comforting fiction. Perhaps we can agree that whatever system we adopt must be empirically tested against outcomes—recidivism, well-being, safety—rather than just metaphysical intuition.

  DANIEL DENNETT: On that, at least, we can certainly raise a cup. To empirical testing.

  GREGG CARUSO: To empirical testing. And to keeping the conversation going.
