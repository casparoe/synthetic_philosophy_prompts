answer: |-
  The central impossibility results (specifically Kleinberg et al. and Chouldechova) demonstrate that three statistical conditions cannot be simultaneously satisfied unless underlying group prevalence rates are equal or the classifier is perfect. Translated into Title VII doctrine, the conflict is between **predictive consistency** (calibration), **error rate balance** (equalized odds), and **underlying qualification prevalence** (base rates).

  **Predictive Consistency** corresponds to the *business necessity* defense. If a selection criterion assigns a risk score, that score must mean the same thing across protected classes. If "high risk" predicts failure 80% of the time for Group A, it must do so for Group B. This is the statistical embodiment of requiring a criterion to be "job-related and consistent with business necessity." Without this, the test lacks validity.

  **Error Rate Balance** corresponds to a strict form of *disparate impact* avoidance. It requires that the False Positive Rate (selecting unqualified candidates) and False Negative Rate (rejecting qualified candidates) be equal across groups. Under Title VII, a practice that screens out a protected group at a higher rate triggers liability unless justified. Error rate balance demands that the *mistakes* of the selection process be distributed equally, regardless of the outcome.

  **Underlying Qualification Prevalence** is the observed rate of actual job performance or risk in each group.

  The impossibility result restated: If underlying qualification prevalence differs between protected classes (e.g., due to historical educational disparities), an employer cannot maintain a selection criterion that is both predictively consistent (valid/business necessary) and produces equal error rates (no disparate impact in screening errors). You must sacrifice either the validity of the test (business necessity) or the equality of error distribution (disparate impact).

  ### Residue Report

  **Clean Translations:**
  *   **Disparate Impact → Error Rate Balance:** The legal concern that a neutral practice screens out protected groups maps cleanly to disparities in False Negative Rates.
  *   **Business Necessity → Predictive Consistency:** The requirement that a criterion accurately predict job performance maps to calibration. If a test is not calibrated across groups, its business necessity is suspect because it measures different constructs for different populations.

  **Distortions:**
  *   **The Four-Fifths Rule:** The law uses a rough heuristic (80% selection rate) to trigger scrutiny. The impossibility results deal in exact mathematical incompatibility. The law allows a *prima facie* case to be rebutted; the math says simultaneous satisfaction is logically impossible.
  *   **Less Discriminatory Alternatives:** Title VII requires adopting a less discriminatory alternative if available. The impossibility result proves that for certain definitions of "discriminatory" (e.g., error rate imbalance), no alternative exists that preserves validity. The law assumes a solution space that the math shows may be empty.

  **No Counterpart:**
  *   **Base Rates as Exogenous:** CS literature typically treats base rates as fixed inputs. Anti-discrimination law often treats them as suspect outputs of prior discrimination. The law might challenge the validity of the "qualification" itself (e.g., arrest records vs. conduct), whereas the math takes the label as ground truth.

  ### Blind Spot or Normative Choice?

  The residue reveals **both**.

  **The Law's Blind Spot:** Title VII doctrine assumes a coherent concept of "job-relatedness" that is compatible with eliminating disparate impact. The impossibility results demonstrate that these are competing goods when base rates differ. The law lacks a meta-principle for adjudicating which statistical definition of fairness (predictive consistency vs. error balance) takes precedence. It treats the conflict as evidentiary rather than structural.

  **CS Normative Choices:** The algorithmic fairness literature embeds normative choices into its definitions. By defining "fairness" as error rate balance, CS scholars prioritize equalizing the burden of mistakes. By defining it as calibration, they prioritize the accuracy of individual predictions. The law deliberately leaves this open for regulatory determination (EEOC) rather than mathematical proof.

  **Conclusion:** The impossibility results do not invalidate Title VII, but they formalize its inherent tension. They show that "fairness" is not a single statistical state discoverable by optimization, but a political choice between competing validities. The law's flexibility is not a bug, but a necessary feature to navigate a landscape where mathematical compatibility is impossible. The blind spot is the assumption that a technically perfect, legally compliant test exists; the normative choice is deciding which inequality the law is willing to tolerate.
