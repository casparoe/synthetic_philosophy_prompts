      *   **User:** Philosopher specializing in discrimination law (US Title VII doctrine). Knows disparate treatment, disparate impact, business necessity, job-relatedness, protected classes, four-fifths rule, etc.
      *   **Problem:** Colleagues in CS mention "impossibility results" in algorithmic fairness (calibration, equalized odds, etc.), but the vocabulary doesn't map cleanly to legal concepts.
      *   **Task:**
          1.  Restate the central impossibility results (specifically the Kleinberg et al. / Chouldechova results regarding compatibility of fairness metrics) using legal vocabulary (disparate impact, business necessity, etc.).
          2.  Provide a "residue report": What translates cleanly? What needs distortion? What has no counterpart?
          3.  Answer the core question: Does this reveal a blind spot in law, or normative choices in CS definitions (or both)?
      *   **Constraints:** ~800 words. High precision, no hand-waving. Define CS terms in legal terms if introduced. Expert nuance on both sides.

  2.  **Deconstruct the Impossibility Results:**
      *   *The Math:* You cannot simultaneously satisfy Calibration (risk scores mean the same thing across groups), Equalized Odds (equal TPR and FPR across groups), and Base Rate Parity (equal prevalence of the outcome across groups) unless base rates are equal or the classifier is perfect.
      *   *The Legal Translation:*
          *   *Calibration:* Predictive validity consistency. If the model says "80% risk" for Group A and "80% risk" for Group B, the actual outcome rate should be 80% for both. This relates to *job-relatedness* and *business necessity* (the score means the same thing regarding job performance/risk).
          *   *Equalized Odds (Error Rate Balance):* Equal False Positive Rates (FPR) and False Negative Rates (FNR) across groups. This maps to *disparate impact* in errors (screening out qualified candidates at different rates).
          *   *Base Rates:* The underlying prevalence of the trait (e.g., actual job performance or recidivism) differs across groups.
          *   *The Impossibility:* If base rates differ (e.g., due to historical disadvantage), you cannot have a test that is equally predictive (calibrated) *and* produces equal error rates (no disparate impact in errors) simultaneously.

  3.  **Drafting - Section 1: Translation of Impossibility Results:**
      *   Need to frame this as a conflict between *validation* (business necessity) and *selection rates* (disparate impact).
      *   *Concept 1: Calibration.* Define as "Predictive Consistency." If a score predicts success, it must predict success equally well across groups. This is core to *business necessity* (the criterion must be job-related).
      *   *Concept 2: Error Rate Balance (Equalized Odds).* Define as "Equal Screening Error." The rate at which qualified members of Protected Class A are rejected (False Negatives) must match Protected Class B. The rate at which unqualified members are accepted (False Positives) must match. This is a strict form of *disparate impact* avoidance.
      *   *The Conflict:* If the underlying rate of qualification (base rate) differs between groups (perhaps due to prior societal discrimination), a selection criterion cannot be both perfectly predictive (calibrated) AND produce equal error rates.
      *   *Legal Framing:* You cannot satisfy the *business necessity* defense (validity/calibration) and simultaneously eliminate *disparate impact* (error rate balance) if base rates differ.

  4.  **Drafting - Section 2: Residue Report:**
      *   *Clean Translations:* Disparate impact maps to Error Rate Balance (specifically FPR/FNR disparities). Business necessity maps to Calibration/Validity.
      *   *Distortions:* The law allows *some* disparate impact if justified by business necessity. The math often treats metrics as binary constraints (satisfied or not). The law is more flexible (reasonable necessity).
      *   *No Counterpart:* "Base Rates." The law generally treats existing qualifications as given but prohibits criteria that *create* barriers. CS treats base rates as fixed statistical facts. The law might ask *why* base rates differ (historical discrimination); CS often takes them as exogenous inputs.
      *   *Normative Choices:* CS metrics define "fairness" as statistical parity or error parity. Law defines it as process-oriented (no intentional discrimination) + outcome-oriented (no unjustified disparate impact).

  5.  **Drafting - Section 3: The Core Question (Blind Spot vs. Normative Choice):**
      *   It's both.
      *   *Law's Blind Spot:* Law assumes you can validate a test and minimize impact. The math proves a trade-off is inevitable when base rates differ. Law lacks a framework for choosing *which* metric to sacrifice.
      *   *CS Normative Choices:* CS metrics embed a specific theory of justice (e.g., error parity vs. predictive parity). The law deliberately leaves this open for legislative/regulatory determination (EEOC guidelines).
      *   *Conclusion:* The impossibility results show that "fairness" is not a single statistical property. The law knows this intuitively (balancing test), but the math formalizes the incompatibility.

  6.  **Refining and Editing (Word Count & Precision Check):**
