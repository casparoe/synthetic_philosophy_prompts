      *   **The Philosophical Context (The "Grad School" bit):** Mention key names (Lenman, Greco, Parfit) and distinctions (Objective vs. Subjective, Act vs. Rule). This adds credibility and depth.
      *   **Synthesis/Resolution:** How do philosophers actually solve this? (Subjective consequentialism, rules of thumb, ignoring low-probability high-impact tails).
