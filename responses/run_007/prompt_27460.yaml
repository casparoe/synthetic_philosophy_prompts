      *Re-evaluating the "All technologies" claim:* Winner writes, "I am suggesting that we think of politics as *sometimes* embedded in technology." The summary says "Winner's broader claim is that all technologies are inherently political." This is an overstatement. Winner is more careful. He suggests *many* or *significant* technologies, or that we should *look* for politics in them. I should note this.

