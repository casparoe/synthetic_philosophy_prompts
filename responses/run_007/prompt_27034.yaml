answer: |-
  ### The Kitchen Counter Thought Experiment

  **Base Scenario**
  An autonomous agent is tasked with sliding a heavy ceramic mug across a dry, laminate kitchen countertop. The agent applies a standard force and must predict the distance the mug will travel before friction brings it to a stop. In the base scenario, the countertop is clear except for a salt shaker located on a distant shelf, well outside the kitchen work zone. Both the frame-based system and the on-demand relevance checker correctly predict that the mug will slide exactly 40 centimeters. The frame-based system succeeds because it holds a pre-compiled marker stating `Irrelevant(Distant_Static_Object, Kinematic_Action)`, allowing it to ignore the salt shaker entirely. The on-demand system succeeds because, when it queries for factors affecting "Surface Friction" and "Obstruction," its backward-chaining search terminates without finding any link between the salt shaker and the mug's path. Both systems agree: the background fact of the salt shaker is genuinely irrelevant, and the prediction is accurate.

  **The Modification**
  A single new object is introduced to the countertop: a sealed glass bottle of cooking oil, placed 15 centimeters to the side of the mug's sliding path. The bottle is capped tightly, standing upright, and does not touch the mug, the path, or any liquid; it is causally inert with respect to the mug's motion.

  **The Divergence**
  In this modified scenario, the two systems diverge sharply. The frame-based system predicts the mug will slide 40 centimeters, exactly as before. Its pre-compiled irrelevance marker for `Static_Container` in the context of `Sliding_Action` remains active. Because the bottle does not trigger a specific "Collision" or "Spill_Detected" override, the system treats the bottle as transparent noise. It does not even process the material properties of the bottle's contents. Consequently, it correctly ignores the inert object and predicts the standard stopping distance.

  The on-demand system, however, predicts the mug will slide 80 centimeters (overshooting the target). Its reasoning fails not because it lacks the fact that the bottle is sealed, but because of the structure of its relevance search. When the agent queries "What determines Friction?", the system scans the immediate context for objects belonging to categories associated with friction modification. It detects the "Cooking Oil" category. In an on-demand architecture, the presence of a category-match often acts as a "relevance trigger" that prioritizes potential causal chains over settled state observations. The system reasons: "Oil is present in the context. Oil reduces friction. Therefore, the Friction variable is compromised."

  The structural error occurs because the on-demand system treats the *presence* of the oil bottle as making the *property* of "slipperiness" relevant to the query. Once relevance is established via the category match, the system defaults to a safety heuristic ("Assume hazard is active unless proven otherwise") rather than verifying the specific state ("Is the oil contained?"). It re-opens a settled judgment about the surface dryness based on the proximity of a relevant *type* of object. The frame-based system, by contrast, never opens that judgment because the object itself is marked irrelevant before its properties are even evaluated. The on-demand system's flexibility allows a spurious semantic connection (Oil -> Slippery) to override perceptual data (Sealed Cap), leading to a false prediction.

