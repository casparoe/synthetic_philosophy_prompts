  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A member of a hospital data-governance committee.
      *   **Observation:** Information privacy violations seem context-dependent. Same info, same consent, same audience size, but different moral weight depending on the *setting* or *relationship* (pharmacist vs. neighbor, wearable care vs. wearable selling data).
      *   **Core Question:** Is there an established name for this view? How does it differ from "privacy as control"?
      *   **Requirements:** Define the view, explain what it rules in/out, explain why violations are wrong (not just surprising), discuss edges/limitations.
      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. Like an email or letter.

  2.  **Identify the Concept:**
      *   The user is describing **Contextual Integrity** (CI).
      *   Key theorist: Helen Nissenbaum.
      *   Core idea: Privacy is not secrecy or control, but the appropriate flow of information according to context-specific norms.
      *   Contrast: Privacy as control (Westin, etc.) vs. Privacy as contextual integrity.

  3.  **Drafting - Section by Section (Mental Outline):**
      *   **Salutation/Opening:** Acknowledge the user's insight, validate their observation.
      *   **Naming the Concept:** Introduce "Contextual Integrity" and Helen Nissenbaum.
      *   **Defining the View:** Explain contexts, actors, attributes, and transmission principles. It's about flow, not stasis.
      *   **Contrast with Control:** Explain why "control" fails (e.g., consenting to something that violates norms anyway, or the paradox of consent). CI says consent isn't enough if the flow violates contextual norms.
      *   **Why it's Wrong (Normative Force):** It's not just surprise; it's a violation of trust and the structure of social relationships. It undermines the purpose of the context (healthcare vs. commerce).
      *   **Edges/Limitations:** Contexts evolve, conflicts between contexts, who defines the norms? It's not static tradition but reasoned evaluation.
      *   **Closing:** Encouragement for their committee work.

  4.  **Refining the Tone:**
      *   Needs to be professional, thoughtful, empathetic, and explanatory.
      *   Must adhere strictly to the formatting constraints (no bold, no bullets, etc.).
      *   Continuous prose.

  5.  **Drafting - Step-by-Step (incorporating constraints):**

      *   *Opening:* Dear Colleague, or just start. Let's start directly but warmly. "Your observation strikes at the heart of one of the most significant shifts in privacy theory..."
      *   *The Name:* The framework is called Contextual Integrity. Developed by Helen Nissenbaum.
      *   *The Definition:* Privacy is not about hiding info (secrecy) or owning info (control). It's about the flow of information respecting contextual norms. Contexts have purposes (healthcare, education, friendship). Norms govern who sends, who receives, what info, and under what constraints.
      *   *The Contrast:* Control theory says if I consent, it's okay. CI says consent doesn't override contextual norms always. Example: Selling health data. Even if I clicked "agree," if it violates the healthcare context's norm of care, it's a violation.
      *   *The Wrongness:* Why is it wrong? Because it disrupts the social order. Trust is built on expectations of flow. If a doctor shares with an insurer without care purpose, it breaks the doctor-patient relationship structure. It's not just surprise; it's a breach of the moral architecture of that setting.
      *   *The Edges:* Contexts change. Technology disrupts contexts. CI isn't just "tradition." We must evaluate if new flows serve the context's values. Sometimes contexts collide.
      *   *Closing:* This is a robust tool for governance.

  6.  **Review against Constraints:**
      *   Continuous prose? Yes.
