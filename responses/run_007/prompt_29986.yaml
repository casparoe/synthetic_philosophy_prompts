      *   *Check:* Did I address the "local convention" worry? (Yes, by explaining that norms are reasoned based on values, not just arbitrary custom).

      *Drafting thought:* Make sure not to sound too academic but still precise. Ensure the transition between paragraphs is smooth since there are no headings.

      *Refining the "Control" contrast:* The user specifically asked about "privacy is control over information about oneself." I need to make sure I explicitly contrast CI with this. Control implies ownership and transaction. CI implies relational appropriateness.

      *Refining the "Wrongness":* The user asks why violations are "genuinely wrong rather than merely surprising." I need to emphasize that these norms uphold specific values (like health, friendship, democracy). Violating them harms those values.

      *Refining the "Edges":* The user worries about "local convention." I need to explain that CI allows for critique of existing norms if they don't serve the context's values, so it's not just status quo bias.

      *Final Polish:* Check for any forbidden formatting markers. Ensure it reads as a single coherent piece of text.

