      Dear Colleague,

      Your observation strikes at the heart of one of the most significant shifts in privacy theory over the last few decades, and you have articulated the intuition behind a framework known as contextual integrity. This concept, most prominently developed by the philosopher Helen Nissenbaum, posits that privacy is neither secrecy nor individual control, but rather the appropriate flow of personal information according to norms specific to a given social context. What you are noticing in your hospital committee is not merely a local convention or a vague feeling, but a structural feature of how human societies organize trust and cooperation. Under this view, every social setting, whether it is a medical clinic, a classroom, or a friendship, operates with a specific purpose and a set of entrenched expectations regarding how information should move between actors. When you visit a doctor, the context is healthcare, the actors are patient and provider, and the norm is that information flows to facilitate treatment. When that same information flows to an advertiser or a neighbor, the context shifts or the transmission principles are violated, even if the data points remain identical.

      To understand how this differs from the familiar idea of privacy as control, we must look at what each theory identifies as the core harm. The control paradigm, often associated with early privacy laws and commercial privacy policies, assumes that information is a commodity owned by the individual. In this view, a violation occurs primarily when someone takes or uses your data without your permission. If you sign a consent form, the transaction is complete, and no moral wrong has occurred because you exercised your control. Contextual integrity challenges this by arguing that consent is not always sufficient to legitimize information flow. You might click agree on a terms of service document because you have no real choice, or you might consent to something that undermines the very relationship you are engaging in. For example, if a patient consents to have their health data sold to a data broker, the control theorist sees a valid transaction, but the contextual integrity theorist sees a violation because the flow of information contradicts the foundational values of the healthcare context, which are centered on care and confidentiality rather than commerce. The wrongness lies not in the lack of permission, but in the disruption of the normative structure that makes the relationship possible in the first place.

      This distinction explains why the violations you are witnessing feel genuinely wrong rather than merely surprising. If privacy were only about surprise, then informing people of a new data practice would cure the ethical problem. However, under contextual integrity, a violation is wrong because it undermines the values embedded in the social context. In the hospital setting, the flow of information is designed to support health and healing. When a pharmacist shares prescription details with a neighbor, they are treating medical information as social currency, which erodes the trust required for patients to be honest with providers. When a wearable device sells heartbeat data to an insurer, it transforms a tool of self-care into a tool of risk assessment and potential discrimination. These actions are wrongful because they betray the implicit contract of the setting. They introduce motives and constraints that are alien to the context, thereby destabilizing the relationships that depend on specific expectations of information flow. It is a breach of fidelity to the role one plays within that community, not just a breach of data security.

      You also raised a crucial concern about whether these expectations are merely local conventions that shift over time, which touches on the edges and limitations of this framework. It is true that contextual norms are not eternal laws of physics; they vary across cultures and evolve with technology. However, contextual integrity does not demand blind adherence to tradition. It provides a heuristic for evaluating whether new information flows are acceptable. When a new technology or practice emerges, we do not simply ask if it is customary, but whether it serves the values and ends of the context. If a new data practice enhances healthcare outcomes without undermining patient trust, it may be an acceptable evolution of the norm. If it serves external interests at the expense of the context's primary purpose, it is a violation. This means the framework can accommodate change without collapsing into relativism. The edge of the theory lies in determining when a context has fundamentally changed versus when it is being violated. For instance, if social media transforms friendship from a private bond into a public performance, contextual integrity asks us to recognize that shift and decide whether we wish to accept the new norms or resist them to preserve the old values.

      Ultimately, adopting this lens in your data-governance committee will allow you to move beyond binary questions of consent and secrecy. You will be better equipped to ask whether a proposed data use fits the moral architecture of the hospital environment. It validates your intuition that the pharmacist's breach is severe not because the information was secret, but because it crossed a boundary that defines the professional relationship. It explains why selling wearable data feels like a betrayal even if the user agreed to it, because the agreement does not rewrite the moral expectations of the care relationship. By focusing on the appropriateness of information flows relative to the context's values, you can identify harms that control-based models miss, such as the erosion of trust and the distortion of social roles. This approach treats privacy as a vital component of social order rather than just an individual right, offering a robust language for protecting the integrity of the institutions you serve.

