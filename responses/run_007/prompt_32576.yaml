answer: |-
  # Q&A Prep Sheet: Defending Frankfurt-Style Cases
  **Context:** Department Colloquium | **Topic:** FSCs vs. PAP | **Stance:** FSCs Succeed (FoF & DD Fail)

  ### 1. The Flicker Proponent (Specialist)
  **Question:** "You claim there are no alternative possibilities in the actual sequence. But even if the agent cannot do otherwise, isn't there still a *flicker* of freedom? For instance, the agent could have *started* to choose otherwise, triggering the intervener. Doesn't the availability of that prior sign constitute an alternative possibility, however thin, that preserves PAP?"

  **Reply:** "The flicker strategy relies on the idea that *any* alternative possibility preserves the spirit of PAP. But PAP is motivated by the idea that responsibility requires the ability to *avoid* the outcome. In Frankfurt cases, the agent cannot avoid the outcome. The 'flicker'—say, the prior sign—is not a robust alternative in the morally relevant sense. It's a difference that makes no difference to the outcome. If PAP requires the ability to do otherwise *regarding the action for which one is responsible*, the flicker fails. The flicker is merely a technicality, not the kind of freedom that grounds responsibility."

  **Candid Weakness:** This relies on the contested distinction between "robust" and "non-robust" alternatives. If the flicker proponent argues that *any* AP undermines the claim that AP is unnecessary, I have to dig into the normative significance of alternatives, which is murky.

  ### 2. The Incompatibilist (Specialist)
  **Question:** "Your defense rests on a dilemma: either the counterfactual intervener's presence is determined or it isn't. If it is determined, you've smuggled determinism into the actual sequence, which incompatibilists reject as a basis for responsibility. If it isn't, the intervener might fail, restoring alternative possibilities. How do you escape this dilemma without begging the question against incompatibilism?"

  **Reply:** "The dilemma assumes that the *presence* of the intervener must be causally relevant to the *actual sequence* of the agent's decision. But the Frankfurt setup is designed so the intervener remains idle. The actual sequence proceeds exactly as it would have without the intervener. The determinism of the *counterfactual* scenario doesn't infect the *actual* scenario. We can construct cases where the actual sequence is indeterministic, yet the counterfactual guarantee holds. The dilemma conflates the metaphysics of the backup mechanism with the metaphysics of the actual choice."

  **Candid Weakness:** This is the standard reply, but it's vulnerable to the claim that a reliable predictor *requires* causal determination of the actual sequence. If reliability implies determination, the incompatibilist wins.

  ### 3. The Generalist (Ethicist)
  **Question:** "I'm not bogged down in the technicalities of flickers, but intuitively, if someone *couldn't* have done otherwise, blaming them feels like blaming a rock for falling. If you remove the 'could have done otherwise' condition entirely, aren't you just redefining responsibility to fit your theory, rather than capturing our actual moral practices?"

  **Reply:** "That intuition is powerful, but it conflates *regulative control* (the ability to choose otherwise) with *guidance control* (the ability to act based on your own reasons). In the Frankfurt case, the agent acts on their own reasons, without coercion or manipulation in the actual sequence. We hold people responsible because of *how* the action came about, not because of metaphysical branching paths. Our practices already reflect this: we excuse people due to coercion (interference with actual sequence), not merely due to determinism. FSCs just isolate that intuition."

  **Candid Weakness:** This appeals to a compatibilist intuition that the generalist may not share. If they are a hard incompatibilist at heart, "guidance control" will sound like a euphemism for "determined puppet."

  ### 4. The Strawsonian (Specialist)
  **Question:** "Why are we even having this debate? The entire project of analyzing responsibility in terms of alternative possibilities is a category mistake. Responsibility is about the appropriateness of reactive attitudes within a community, not about metaphysical leeway. Doesn't defending FSCs just validate a misguided framework?"

  **Reply:** "While I sympathize with the reactive attitudes approach, the PAP debate isn't pointless. PAP is a widely held necessary condition for moral responsibility. If PAP is false, it shifts the burden of proof significantly for incompatibilists and libertarians. Even if the ultimate ground of responsibility is Strawsonian, showing that AP is not *necessary* clears the field of a major obstacle. We aren't validating the framework as ultimate; we are clearing away a specific philosophical obstacle within it."

  **Candid Weakness:** The Strawsonian might reply that clearing obstacles within a bad framework is a waste of time. I risk conceding that the framework *is* misguided just to win the point about PAP.

  ### 5. The Sourcehood Theorist (Generalist/Specialist Hybrid)
  **Question:** "If alternative possibilities aren't required, what *is* required? If you say 'sourcehood,' aren't you just moving the goalposts? If the source of the action is compatible with determinism, haven't you just become a compatibilist by another name?"

  **Reply:** "It's true that rejecting PAP often aligns with compatibilism, but the logical point stands independently. Sourcehood focuses on the actual history of the action. Whether that history is compatible with determinism is a further question. My claim is strictly negative: AP is not necessary. What positively grounds responsibility is a separate, though related, question. We can reject PAP without settling the compatibilism/incompatibilism debate immediately, though it does weaken the incompatibilist position."

  **Candid Weakness:** This invites the follow-up: "If sourcehood is the real requirement, why did we spend 50 years talking about AP?" It makes the FSC project look like a detour.

  ### 6. The Flicker Proponent (Round 2 - Robustness)
  **Question:** "You dismissed the flicker as non-robust. But if the agent could have initiated a different causal chain, even if blocked later, isn't that enough to ground the *concept* of freedom? If freedom is about being the originator, doesn't the ability to *try* otherwise matter?"

  **Reply:** "The ability to 'try' otherwise only matters if the *trying* is something for which we are responsible. But in the Frankfurt case, the agent is responsible for the *action*, not the trying. If the outcome is inevitable, the 'trying' is morally inert. Responsibility tracks the action and its reasons. A freedom that cannot result in a different outcome is a freedom without consequence, and moral responsibility is inherently consequentialist in terms of accountability."

  **Candid Weakness:** "Responsibility is inherently consequentialist" is a strong, controversial claim. An ethicist might pounce on the idea that responsibility isn't about outcomes.

  ### 7. The Historian of Early Modern
  **Question:** "This sounds remarkably like Hobbes' distinction between liberty and necessity. Hobbes argued we are free if we aren't externally hindered, even if determined. Are Frankfurt cases just a high-tech way of resurrecting Hobbesian compatibilism? If so, what's new here?"

  **Reply:** "The structural similarity is there, but the argumentative role is different. Hobbes was arguing against the notion of 'liberty of spontaneity.' Frankfurt cases are designed specifically to test the *Principle of Alternative Possibilities*, a formulation that gained traction in the mid-20th century (via van Inwagen etc.). The novelty is the *counterfactual intervener*, which isolates the AP condition in a way Hobbes couldn't. It's not just 'no hindrance'; it's 'no possibility, yet still responsible.' That's a stronger claim than Hobbes made."

  **Candid Weakness:** If they know their Hobbes well, they might argue Frankfurt adds nothing substantive, just complexity. It risks looking like reinventing the wheel.

  ### 8. The Question I Hope Nobody Asks (The Actual Sequence Determination)
  **Question:** "For the intervener to *know* with certainty that they need not intervene, doesn't there have to be a prior sufficient cause for the agent's action in the actual sequence? If so, isn't the actual sequence determined? And if the actual sequence is determined, haven't you just conceded the incompatibilist's main point: that responsibility requires indeterminism, and FSCs only work by assuming determinism?"

  **Reply:** "That assumes that 'certainty' requires 'causal determination.' One could posit a world with reliable indicators that are not causally determining (e.g., divine foreknowledge or non-causal laws). However, even if we grant actual sequence determination for the sake of the case, the point of FSCs is to show that *even if* you are a compatibilist, PAP is still false. It refutes PAP independently of the determinism debate. But strictly speaking, we can construct FSCs with indeterministic actual sequences and probabilistic interveners."

  **Candid Weakness:** This is the weakest point. Constructing an indeterministic FSC that retains the "guarantee" is notoriously difficult (the *Problem of Causal Determination*). If I admit the actual sequence is likely determined, I alienate the libertarians. If I deny it, I face the "how do they know?" challenge. This cuts to the metaphysical coherence of the case itself.

  ***

  ### Overall Assessment & Vulnerability Analysis

  **Most Vulnerable Argument:**
  My position is most vulnerable on the **metaphysical coherence of the counterfactual intervener** (Question #8). The entire force of the Frankfurt case rests on the claim that the intervener *would* intervene if necessary, but *doesn't* in the actual sequence.
  *   **Why it's vulnerable:** If the intervener's reliability depends on the actual sequence being causally determined up to the point of action, then the case presupposes compatibilism to prove compatibilism (or at least, to refute PAP). If the actual sequence is *not* determined, it is unclear how the intervener can guarantee the outcome without affecting the actual sequence (the "Prior Sign" problem).
  *   **Risk:** If I cannot satisfactorily explain how the intervener knows without determining, the case collapses into either a deterministic scenario (which incompatibilists reject for MR) or a scenario where the agent *could* have fooled the intervener (restoring PAP).

  **Where My Reasoning on Ranking Might Fail:**
  I have ranked the **Strawsonian objection (#4)** as moderate damage. I might be underestimating this.
  *   **Why:** In a department setting, if the Strawsonian is charismatic, they can shift the room's mood from "Is PAP true?" to "Why are we talking about PAP?" This renders my technical defenses of FSCs irrelevant. If the audience decides the *framework* is the problem, my defense of the *cases* within that framework becomes a victory in a battle they no longer care about winning.
  *   **Adjustment:** I should prepare to bridge the gap: acknowledge the Strawsonian insight but insist that PAP is a *constraint* many philosophers still accept, so removing it has value even for non-analytic approaches to responsibility.

  **Final Advice:**
  Watch the **Incompatibilist Specialist** closely. They will likely wait for the Generalists to raise the "Intuition of Coercion" (#3) and then amplify it with the "Dilemma" (#2). If you lose the Generalists on intuition, the Specialists will use that consensus to dismantle the technical details. Secure the room's intuition first (Guidance Control), then handle the technical metaphysical objections.
