prompt: |-
  ok so im in this philosophy of mind course and we've been doing the free will unit — compatibilism, the consequence argument, all that — and next week i have to run a study session for like 6 people on sphexishness. you know, the Sphex wasp thing from Dennett where the wasp does this elaborate seeming-smart routine (drags a cricket to the burrow, goes in to check, comes back out, drags it in) but it's actually just a rigid fixed-action pattern, and if you move the cricket an inch while she's inside checking, she'll just redo the checking step and never learn. the point being that what looks like intelligence or free choice might just be mechanical rigidity, and the real question is what seperates genuinely flexible behavior from sphexish behavior.

  i get the concept but i have no idea how to teach it in a way that actually sticks. the session is 40 minutes. the other students were assigned the Dennett reading but let's be real, maybe two of them did it.

  don't explain sphexishness to me. i need a teaching plan. give me a JSON object with these fields:

  - "sequence": an ordered array of steps, each with "title", "point" (the idea to land at that step), and "ordering_rationale" (why this step has to come here, what it depends on)
  - "carrying_example": the one case that does the heavy lifting — say what it is, why it works better than just telling the wasp story, and what it deliberately leaves out
  - "misconceptions": an array of misunderstandings to expect, each with "misconception", "cause", and "step_to_head_it_off" (which step from the sequence it should be addressed at)
  - "understanding_check": one question or mini-exercise for the end that tells me whether they actually got the sphexish/flexible distinction and not just the wasp anecdote
  - "leave_out": what i should explicitly say we're not covering and why

  and if the wasp example isnt actually the best carrying case for this — like if theres a better everyday example that makes the same point without people getting stuck on "but insects are just automata anyway" — then use that instead and just mention the wasp in passing.
