      *(Self-Correction during drafting)*: I need to make sure I don't just say "they are different disciplines." I need to explain *why* that causes an impasse specifically here. It's because Virtue Ethics *claims* to be action-guiding based on human nature. If human nature is situationist, VE loses its grip. So it *is* empirical, but the *interpretation* of the empirical is theory-laden.
      *Better Diagnosis:* It is a **disagreement about the granularity of explanation.** Situationists demand micro-causal consistency. Virtue Ethicists allow for macro-narrative consistency.

      *Let's go with the "Normative vs. Descriptive" clash but deepen it.* It's about **Idealization.**
      *   Situationists: Idealization is empirically false.
      *   Virtue Ethicists: Idealization is normatively necessary.
      *   Impasse: Neither can prove their standard of "necessary" to the other without circularity.

