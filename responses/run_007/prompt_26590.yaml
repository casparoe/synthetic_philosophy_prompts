answer: |-
  Here is a committed diagnosis of the impasse.

  ### The Diagnosis: A Structural Clash of Teleology, Not Empirics

  The debate is not stalled because of ambiguous data or semantic confusion, though both are present. It is stalled because it is a **structural category error regarding the teleology of "character."**

  The situationists and the virtue ethicists are using the word "trait" to pick out two fundamentally different kinds of entities with incompatible success conditions.
  *   **For the Situationist,** a character trait is a **causal mechanism.** Its validity is determined by its *predictive power* across varying contexts. If entity $X$ (courage) does not reliably produce behavior $Y$ (standing firm) across situations $A, B,$ and $C$, then $X$ does not exist as a scientific posit.
  *   **For the Virtue Ethicist,** a character trait is a **normative standard.** Its validity is determined by its *evaluative utility* in constituting a flourishing life. If entity $X$ (courage) serves as a rational ideal for organizing one's life, it exists as a moral posit, regardless of statistical frequency.

  The impasse is structural because **Virtue Ethics requires psychological realism to be action-guiding, but requires normative idealization to be defensible.**
  *   If Virtue Ethics concedes too much to the Situationists (admitting traits are fragile), it loses its grip on agency and becomes merely a theory of moral luck.
  *   If Virtue Ethics concedes too little (insisting traits are robust), it becomes empirically falsified by the data.

  The Situationists are treating a normative theory as a descriptive hypothesis. The Virtue Ethicists are treating a descriptive challenge as a normative misunderstanding. Neither can move because to do so would require abandoning the core function their respective disciplines assign to "character."

  ### Truth Conditions: What Each Side Needs to Be Right

  To see why this is a deadlock rather than a solvable dispute, consider what must be the case for one side to definitively defeat the other.

  **1. For the Situationists to Win:**
  They must prove that Virtue Ethics *necessarily* entails strong cross-situational consistency.
  *   **The Condition:** They must demonstrate that the concept of *phronesis* (practical wisdom) or *hexis* (stable disposition) is incoherent without behavioral globalism. They must show that a "sensitive" virtue (one that changes behavior based on context) is indistinguishable from "no virtue at all."
  *   **Why they fail:** They cannot prove this without dictating terms to the philosophical tradition. Virtue ethicists can always retreat to the claim that "true virtue includes knowing *when* not to act," rendering the inconsistency a feature of the virtue, not a bug. The Situationist data shows we aren't *currently* virtuous; it does not prove we *cannot* be.

  **2. For the Virtue Ethicists to Win:**
  They must prove that the Situationist data is irrelevant to the normative project.
  *   **The Condition:** They must demonstrate that a theory of moral development can be robust even if the underlying psychological architecture is fragmented. They must show that "acting *as if* one has a robust trait" yields the same eudaimonic outcomes as "actually having a robust trait."
  *   **Why they fail:** They cannot prove this without conceding the Situationist point. If the psychology is fragmented, then "cultivating virtue" is not a matter of internal disposition but of external situation-management. This collapses Virtue Ethics into a form of consequentialist social engineering, abandoning the core claim that the *agent's internal state* is the locus of moral value.

  ### The Verdict: The Impasse is Permanent on Current Terms

  Because this is a clash of teleology (prediction vs. evaluation), **no amount of new experimentation will resolve it.** New experiments will simply be absorbed: Situationists will cite them as proof of fragmentation; Virtue Ethicists will cite them as proof of contextual sensitivity.

  Similarly, **no conceptual distinction will resolve it** because both sides already acknowledge the distinction between "global" and "local" traits. The disagreement is not about the definition, but about which definition is *permitted* to carry the weight of moral theory.

  ### What Would Count as Progress?

  Since the impasse is structural, progress requires **changing the question** rather than answering the current one. The debate should be abandoned in favor of a **Moral Ecology Framework.**

  **1. Abandon the "Trait Existence" Question**
  Stop asking "Do robust character traits exist?" This is a false dichotomy. The answer is clearly "It depends on how you define 'exist' and 'robust'."
  *   **Progress:** Shift to asking, "Under what environmental conditions do normative ideals become psychologically stable?"

  **2. Adopt a "Scaffolding" Model**
  Progress lies in a formal model that integrates the Situationist insight (behavior is context-dependent) with the Virtue Ethicist goal (stable agency).
  *   **The Model:** Treat virtues not as internal causal engines, but as **scaffolding structures.** A virtue is not a gear inside the machine that always turns; it is a repair manual and a set of external tools that allow the machine to function better *if* the operator chooses to use them.
  *   **The Experiment:** Instead of testing if people *have* virtues, test if people can *sustain* virtues when situational variables are manipulated to support them. This validates the Situationist claim (situations matter) while preserving the Virtue Ethicist claim (agents can cultivate stability).

  **3. The "Moral Ecology" Turn**
  The most productive path forward is to admit the Situationists are right about *descriptive psychology* but wrong about *ethical theory*, and admit the Virtue Ethicists are right about *ethical theory* but wrong about *descriptive psychology*.
  *   **Implication:** If traits are situationally fragile, then moral philosophy's primary job is not "cultivating character" in a vacuum, but **designing situations** that make virtue the path of least resistance.
  *   **Progress:** This moves the debate from metaphysics (do traits exist?) to political philosophy and institutional design (how do we build a world where virtues stick?).

  ### Summary
  The impasse is not a failure of argument; it is a **boundary dispute between science and normativity.** The Situationists are correct that the *folk-psychological* view of character is empirically false. The Virtue Ethicists are correct that the *normative* view of character is indispensable.

  Progress will not come from proving one side right. It will come from dissolving the assumption that normative ideals must map 1:1 onto descriptive psychological mechanisms. The future of the debate lies not in defending the existence of the "virtuous agent" as a psychological given, but in engineering the "virtuous environment" as a psychological necessity.
