answer: |-
  This is a sharp request. You have correctly identified that the literature often conflates the *semantic* frame problem (how to represent non-change without infinite axioms) with the *inferential* frame problem (how to compute what persists without checking everything).

  As a software engineer, you are looking for the **System Requirements Specification (SRS)** for a cognitive architecture that solves this. Below is that spec, broken down by functional requirements, constraints, and architectural tensions.

  ---

  ### Part 1: The Core Desiderata (Non-Negotiable)

  These are the requirements any solution must meet to function in a non-toy environment. If a formalism fails these, it is a theoretical curiosity, not an engineering solution.

  #### 1. Soundness of Persistence (The "No-Spurious-Change" Constraint)
  *   **Spec:** If an action $A$ is executed, and there is no causal law linking $A$ to fluent $F$, the system must not infer that $F$ changed.
  *   **Consideration:** Without this, the agent hallucinates side effects. (e.g., Picking up a block does not change the color of the wall).
  *   **Status:** **Non-Negotiable.**

  #### 2. Soundness of Change (The "Causal-Closure" Constraint)
  *   **Spec:** If an action $A$ is executed, and a causal law links $A$ to fluent $F$, the system must infer that $F$ changes (subject to preconditions).
  *   **Consideration:** Without this, the agent fails to plan effectively because it assumes the world is more static than it is.
  *   **Status:** **Non-Negotiable.**

  #### 3. Computational Tractability (The "Real-Time" Constraint)
  *   **Spec:** The cost of projecting the state after action $A$ must be polynomial (ideally linear) in the number of *relevant* fluents, not the total number of fluents in the knowledge base.
  *   **Consideration:** In a real world, the number of facts is effectively infinite. An $O(N)$ check against the entire database per time-step is a hard crash.
  *   **Status:** **Non-Negotiable.**

  #### 4. Elaboration Tolerance (The "Modularity" Constraint)
  *   **Spec:** Adding a new action type or a new fluent to the domain should not require rewriting existing axioms or re-compiling the entire inference engine. The "frame axioms" for existing actions should not need explicit updating when new actions are added.
  *   **Consideration:** In software terms, this is loose coupling. If adding a `OpenDoor` action requires you to touch the code for `PickUpBlock` to assert that `OpenDoor` doesn't move the block, the architecture is brittle.
  *   **Status:** **Non-Negotiable.**

  #### 5. Handling Incomplete Knowledge (The "Open World" Constraint)
  *   **Spec:** The system must reason correctly even when the initial state of some fluents is unknown, and when percepts are noisy or partial.
  *   **Consideration:** Toy blocks-worlds are fully observable. Real robots are not. A solution that requires a Closed World Assumption (CWA) fails here.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Part 2: Contested Desiderata (Camp Preferences)

  These are often presented as requirements, but they are actually architectural choices. Different camps trade these off differently.

  #### 1. Monotonicity vs. Non-Monotonicity
  *   **Spec:** Can new information invalidate previous conclusions?
  *   **Preference:** **Logic Camp** prefers monotonicity (classical logic) for proof stability. **Commonsense Camp** prefers non-monotonicity (default logic) to handle exceptions (e.g., "Birds fly" vs. "Penguins fly").
  *   **Status:** **Preference.** (Though Non-Monotonicity is practically required for robustness, strict logical purity often forbids it).

  #### 2. Ontological Commitment (Fluents vs. Events)
  *   **Spec:** Is the primitive unit of change a state variable (Fluent) or a happening (Event)?
  *   **Preference:** **Situation Calculus** favors Fluents/Situations. **Event Calculus** favors Events/Timepoints.
  *   **Status:** **Preference.** (Both can be made to work, but they impose different data structures).

  #### 3. Determinism vs. Probabilistic Outcomes
  *   **Spec:** Do actions have guaranteed effects?
  *   **Preference:** **Classical Planning** assumes determinism. **RL/Probabilistic AI** assumes distributions.
  *   **Status:** **Preference.** (Though a true "real world" spec arguably demands probabilistic handling, the *Frame Problem* itself is distinct from uncertainty, so classical solutions claim validity here).

  ---

  ### Part 3: Jointly Unsatisfiable Pairs (The Trade-Offs)

  You cannot maximize all dimensions simultaneously. These are the architectural tensions you must manage.

  #### Tension A: Expressiveness vs. Tractability
  *   **Conflict:** If you allow highly expressive logic (e.g., full Second-Order Logic or unrestricted Circumscription) to define causal laws, inference becomes undecidable or intractable.
  *   **Resolution:** You must restrict the language (e.g., to STRIPS-like effects or limited Situation Calculus) to guarantee polynomial projection.
  *   **Impact:** You lose the ability to represent complex, nested causal dependencies naturally.

  #### Tension B: Elaboration Tolerance vs. Compilation Efficiency
  *   **Conflict:** To make projection fast (Tractability), you often want to compile axioms into a specific data structure (like Reiter's Successor State Axioms). However, compilation usually requires knowing the *set of all actions* upfront.
  *   **Resolution:** If you allow dynamic addition of actions (Elaboration Tolerance), you often lose the ability to pre-compile the efficient inference structure.
  *   **Impact:** Systems are either fast but static, or flexible but slow.

  #### Tension C: Logical Completeness vs. Real-Time Response
  *   **Conflict:** A logically complete solver will search until it finds a proof of persistence or change. In a dynamic world, the world changes while the agent is thinking.
  *   **Resolution:** You must accept "good enough" heuristic inference (anytime algorithms) rather than logical certainty.
  *   **Impact:** You introduce the possibility of error (violating Soundness) to meet timing constraints.

  ---

  ### Part 4: The Killer Requirement

  If you must pick one requirement that eliminates the most popular proposed solutions, it is this:

  #### **Tractable Projection under Elaboration Tolerance in an Open World**

  Here is why this single conjunction kills the major historical candidates:

  1.  **Kills Classical Situation Calculus (McCarthy & Hayes):**
      *   *Why:* The original formulation required explicit frame axioms for every action/fluent pair ($O(A \times F)$). This violates **Tractability** and **Elaboration Tolerance**. Adding an action requires adding $F$ new axioms.

  2.  **Kills Circumscription (McCarthy):**
      *   *Why:* While it solves the representation problem elegantly (minimizing change), general circumscription is computationally intractable (often $\Pi^P_2$-complete or worse). It violates **Tractability**. It also struggles with **Open World** reasoning because minimizing predicates often implicitly assumes you know all the relevant predicates.

  3.  **Kills Reiter's Successor State Axioms (SSA):**
      *   *Why:* This is the hardest hit, because SSA is the "standard" solution. SSA provides tractable projection ($O(1)$ per fluent). *However*, to construct the SSAs, you must know the **complete set of all possible actions** that can affect a fluent at compile time.
      *   *The Failure:* If a new, unanticipated action type is introduced (violating the Closed World of Actions), the SSA is incomplete. It fails **Elaboration Tolerance** in dynamic, open environments where the agent cannot enumerate all potential causal forces in the universe.

  4.  **Kills Pure Neural/Connectionist Approaches:**
      *   *Why:* While tractable, they generally lack **Soundness of Persistence** and **Explainability**. They cannot guarantee that a specific symbol *will not* change without empirical testing, violating the logical spec of the Frame Problem.

  ### Summary for the Engineer

  The "Frame Problem" is not a bug; it is a complexity bound.

  *   **The Spec:** You need a system that infers non-change in $O(1)$ (or $O(\text{relevant effects})$) without explicit axioms, allows new rules to be added without global recompilation, and works when it doesn't know everything about the state.
  *   **The Reality:** No symbolic system currently satisfies **Elaboration Tolerance** and **Tractability** simultaneously in a fully **Open World**.
  *   **The Modern Workaround:** Modern robotics and software agents do not "solve" the frame problem logically. They bypass it using:
      1.  **Scoped Contexts:** Limiting the "world" to a known, bounded set of objects (violating Open World).
      2.  **Perceptual Anchoring:** Re-checking state via sensors rather than inferring persistence logically (trading compute for I/O bandwidth).
      3.  **Probabilistic Filters (e.g., Kalman/Particle):** Assuming continuity unless evidence suggests otherwise (violating Logical Soundness for Statistical Likelihood).

  If you are building an agent, do not look for a logical proof of persistence. Look for an architecture that minimizes the **cost of verification** for the fluents that matter to your current goal. That is the only engineering solution that scales.
