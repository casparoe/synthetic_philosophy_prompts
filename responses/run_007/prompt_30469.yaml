answer: |-
  # Session Plan: Lewis's Triviality Results (120 Minutes)

  ## 1. The Running Example
  **Case:** A single fair die roll, hidden under a cup.
  **Antecedent ($A$):** The die is even $\{2, 4, 6\}$.
  **Consequent ($C$):** The die is low $\{1, 2, 3\}$.
  **Conditional ($A \to C$):** "If the die is even, it is low."

  **Why this example?**
  *   **Finite Sample Space:** Allows you to draw the six outcomes on the board. Philosophers comfortable with possible worlds can treat these as six worlds.
  *   **Non-Extremal Probability:** $P(C|A) = 1/3$. This is crucial. If the conditional probability were 0 or 1, triviality wouldn't look like a problem. You need a case where we are confident the probability is *not* 0 or 1 to generate the contradiction.
  *   **Epistemic, not Objective:** Frame this as *your* uncertainty about the roll, not objective chance. This prevents the objection that "conditionals are about objective chances, not beliefs."

  ---

  ## 2. Session Timeline

  ### Part I: The Setup (0–30 mins)
  **Goal:** Secure agreement on the two premises that will later clash.

  *   **0–10: The Probability Thesis (The Equation).**
      *   Introduce the example. Ask: "How confident are you that *if* the die is even, it is low?"
      *   Elicit the intuition that confidence should match the proportion of $A$-worlds that are $C$-worlds ($1/3$).
      *   Formalize: **The Thesis:** $P(A \to C) = P(C|A)$.
      *   *Constraint:* Emphasize this is meant to hold for *any* rational credence function $P$, not just the initial uniform one.
  *   **10–20: The Proposition Assumption.**
      *   Ask: "What makes that confidence correct or incorrect?"
      *   Since the audience knows possible worlds, ask: "Is there a set of worlds where 'If even, then low' is true?"
      *   Secure the assumption: **Propositionality:** $A \to C$ expresses a proposition $X$ with truth conditions. Therefore, $P(A \to C)$ is just the probability that $X$ is true (sum of probabilities of worlds in $X$).
  *   **20–30: The Probability Toolkit.**
      *   Distribute a handout with only three rules (do not derive them):
          1.  **Conditional Probability:** $P(C|A) = P(A \& C) / P(A)$.
          2.  **Law of Total Probability:** $P(Y) = P(Y|Z)P(Z) + P(Y|\neg Z)P(\neg Z)$.
          3.  **Conditionalization:** If you learn $Z$ (and nothing stronger), your new probability $P_{new}(Y) = P_{old}(Y|Z)$.

  ### Part II: The Trap (30–75 mins)
  **Goal:** Derive the contradiction slowly. Do not jump to the algebra; motivate each step philosophically.

  *   **30–45: The Update Intuition.**
      *   Suppose you learn that the proposition $X$ (the truth of the conditional) is **true**.
      *   Ask: "If you know 'If even, then low' is *true*, and you then learn the die *is* even, what must you believe about it being low?"
      *   Answer: You must believe it is low. $P_{new}(C|A) = 1$.
      *   By the Thesis, $P_{new}(A \to C)$ must also be 1.
      *   *Key Move:* By Conditionalization, $P_{new}(A \to C) = P_{old}(A \to C | X)$. Since $X$ *is* $(A \to C)$, $P_{old}(X|X) = 1$. This step is just consistency.
      *   *The Kicker:* If you learn $X$ is true, your conditional probability $P(C|A)$ becomes 1.
  *   **45–60: The Negative Update.**
      *   Suppose you learn $X$ is **false**.
      *   Ask: "If you know 'If even, then low' is *false*, and you learn the die is even, what must you believe?"
      *   Answer: You must believe it is *not* low. $P_{new}(C|A) = 0$.
      *   So, if $X$ is false, $P(C|A)$ becomes 0.
  *   **60–75: The Collapse (The Algebra).**
      *   Now return to your *original* state of ignorance (the 1/3 credence).
      *   Use the **Law of Total Probability** on the proposition $X$ (the conditional itself).
      *   $P(C|A) = P(C|A \& X)P(X) + P(C|A \& \neg X)P(\neg X)$.
      *   Substitute the results from the previous steps:
          *   Given $X$, $P(C|A) = 1$.
          *   Given $\neg X$, $P(C|A) = 0$.
      *   Equation becomes: $P(C|A) = (1 \times P(X)) + (0 \times P(\neg X))$.
      *   Therefore: $P(C|A) = P(X)$.
      *   But $P(X)$ *is* $P(A \to C)$. So we just get the Thesis back? **No.**
      *   *Correction for the room:* Wait, look at the substitution again.
      *   $P(C|A)$ must equal $P(X)$. But we established earlier that if $X$ is true, $P(C|A)=1$, and if $X$ is false, $P(C|A)=0$.
      *   This implies $P(C|A)$ can only take values 0 or 1 (because it equals the probability of a truth-valued proposition $X$ which forces the conditional probability to collapse to the extremes upon learning its truth value).
      *   *Simpler route for the board:*
          1. Assume $P(A \to C) = P(C|A)$ for all $P$.
          2. Let $P$ be a function where $0 < P(C|A) < 1$ (like our die case, 1/3).
          3. Let $P_X$ be the function after learning $A \to C$ is true.
          4. $P_X(C|A) = 1$ (Modus Ponens).
          5. By Thesis, $P_X(A \to C) = 1$.
          6. But $P_X(A \to C)$ is just $P(A \to C | A \to C)$, which is trivially 1.
          7. *The Real Trap:* Use the Total Probability on $P(C|A)$ partitioning by $A \to C$.
          8. $P(C|A) = P(C|A \& (A \to C))P(A \to C) + P(C|A \& \neg(A \to C))P(\neg(A \to C))$.
          9. First term: If $(A \to C)$ is true, $P(C|A)=1$.
          10. Second term: If $(A \to C)$ is false, $P(C|A)=0$.
          11. So $P(C|A) = 1 \cdot P(A \to C) + 0 \cdot P(\neg(A \to C))$.
          12. So $P(C|A) = P(A \to C)$.
          13. *Wait, that's just the thesis.* Where is the contradiction?
          14. *Correction:* The contradiction is that $P(C|A)$ is now shown to be equal to the unconditional probability of the proposition $X$. But $P(C|A)$ is supposed to vary independently of $P(X)$ in non-trivial languages.
          15. *Best Pedagogical Route:* Stick to Lewis's original intuition. If $A \to C$ is a proposition, learning it rules in/out worlds. But $P(C|A)$ depends on the *ratio* of worlds. You cannot fix the ratio by merely ruling worlds in/out unless the ratio was already 0 or 1.
          16. **Action:** Draw the 6 worlds. Show that to make $P(C|A)=1$, you must rule out 4 and 6. To make it 0, you must rule out 2. But the proposition $A \to C$ must be the *same* set of worlds regardless of your probability function. You can't have a set of worlds that forces the ratio to be 1/3 for one agent and 1/2 for another.
          17. **Conclusion:** The only way a fixed set of worlds (truth conditions) can satisfy the Thesis for *all* probability functions is if no probability function assigns non-extremal values to $P(C|A)$.

  ### Part III: The Aftermath (75–105 mins)
  **Goal:** Discuss the escape routes and manage misconceptions.

  *   **75–85: Break.**
  *   **85–95: Escape Route 1 (Deny Propositionality).**
      *   Adams/Expressivism: Conditionals don't have truth conditions. They have *assertability* conditions.
      *   $P(A \to C)$ is not the probability a proposition is true; it's a primitive measure of belief.
      *   This saves the Thesis but costs embedding (conditionals in negation/disjunction).
  *   **95–105: Escape Route 2 (Deny the Thesis).**
      *   Stalnaker/Truth-Conditionalism: Keep truth conditions, reject the Equation as a general constraint.
      *   The Equation holds only for *initial* credences, not updated ones.
      *   This saves logic/embedding but costs the intuitive link between belief and conditionals.

  ### Part IV: Misconceptions & Check (105–120 mins)
  **Goal:** Solidify understanding.

  *   **105–115: Preempting Misconceptions.**
      *   *Misconception A: "This refutes Possible Worlds Semantics."*
          *   *Correction:* No. It refutes the *combination* of Possible Worlds + The Thesis. Stalnaker keeps PW semantics by restricting the Thesis.
      *   *Misconception B: "Conditionals are meaningless."*
          *   *Correction:* Expressivists argue they have a different kind of meaning (normative/assertability), not truth-conditional meaning. They aren't nonsense; they just don't describe facts.
  *   **115–120: Final Comprehension Check.**

  ---

  ## 3. What to Openly Leave Out
  1.  **Generalized Triviality:** Do not discuss Hájek's results or triviality for subjunctives. Keep it strictly to Lewis (1976) and indicatives.
  2.  **Kolmogorov Axioms:** Do not derive the probability rules. Treat them as background logic, like Modus Ponens.
  3.  **The "Import-Export" Principle:** This is often used in newer proofs, but it adds a layer of logical complexity that distracts from the core probabilistic clash. Stick to the Law of Total Probability.
  4.  **Bradley's Representation Theorems:** Too technical for a 2-hour intro.

  ---

  ## 4. Final Comprehension Check Question
  Do not ask: "What is Lewis's result?" (They will recite the slogan).
  Do not ask: "What is the Equation?" (They will write the formula).

  **Ask this:**
  > "If we choose the Expressivist route to avoid triviality (denying truth conditions), we lose the ability to easily account for conditionals inside negations (e.g., 'It is not the case that if A, C'). If we choose the Truth-Conditional route (keeping Stalnaker semantics), we must restrict the Equation ($P(A \to C) = P(C|A)$). **Which of these two costs do you think is more damaging for a theory of *assertion*, and why does the Triviality result force that specific choice?**"

  **Why this works:**
  *   It forces them to identify the *trade-off* (Logic/Embedding vs. Probabilistic Intuition).
  *   It checks if they understand that the Triviality result is the *reason* the choice must be made (it forces the fork).
  *   It distinguishes between "assertion" (Expressivism's strength) and "embedding" (Truth-Conditionalism's strength).
