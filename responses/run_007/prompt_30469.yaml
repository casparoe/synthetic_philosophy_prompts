          1.  Conditionals express propositions (have truth conditions).
          2.  The probability of a proposition is the probability it is true.
          3.  The Probability of the Conditional = Conditional Probability (The Thesis/Equation).
          4.  Standard Probability Theory (Kolmogorov axioms).
      *   The conflict arises when you update on new information (conditionalize). If $P(A \to C) = P(C|A)$ holds for *all* probability functions, you end up proving that $P(C|A)$ can only take values 0 or 1 (or that $A$ and $C$ are probabilistically independent in a way that makes the language trivial).
      *   *Key Pedagogical Challenge:* Making the probability calculus intuitive for non-specialists without getting bogged down in algebra.

  3.  **Drafting the Sequence (The "Inevitability" Arc):**
      *   *Start:* Establish the intuitive appeal of the Thesis (Adams/Stalnaker). Why do we want $P(A \to C) = P(C|A)$?
      *   *Middle:* Introduce the assumption that conditionals are propositions (truth-conditional). This is standard for possible worlds folks.
      *   *Conflict:* Show how updating information breaks the equation if both assumptions hold.
      *   *Conclusion:* One must go. Usually, we drop truth-conditions (expressivism/non-propositionality).
      *   *Order:*
          1.  Intuition Pump (The Thesis).
          2.  The Standard Assumption (Propositionality).
          3.  The Clash (Lewis's Argument).
          4.  The Aftermath (Options).

  4.  **Selecting the Example:**
      *   Needs to be simple enough for probability calculations but philosophical enough to matter.
      *   *Coin toss?* Too simple, might suggest objective chance rather than epistemic probability.
      *   *Die roll?* Good, finite sample space.
      *   *Political example?* Too messy.
      *   *Selection:* A simple urn or die scenario is best for *calculations*, but for *philosophy*, a "Match" example (Lewis's own) or a "Party" example is often clearer for assertability. However, for the *proof* to land, a finite probability space is needed. Let's use a **Die Roll** but framed epistemically. It allows concrete numbers ($1/6, 1/2$, etc.) which prevents the "algebra fog."
      *   *Constraint:* It must allow for updating. So, learning that the result is even, or learning that the result is low.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "Refutes all possible-worlds semantics."*
          *   *Correction:* It refutes *truth-conditional* semantics combined with the Probability Thesis. Stalnaker's semantics is possible-worlds but might need to abandon the Thesis or accept triviality (which Stalnaker tried to avoid by restricting the Thesis).
          *   *Timing:* Address this after the proof, when discussing "ways out."
      *   *Misconception 2: "Conditionals are meaningless."*
          *   *Correction:* They have assertability conditions, just not truth conditions (Expressivism).
          *   *Timing:* Address this in the "What do we give up?" section.

  6.  **What to Omit:**
      *   Bradley's generalizations.
      *   Detailed Kolmogorov axioms (just use standard rules).
      *   The difference between Indicative and Subjunctive (keep it focused).
      *   Lewis's specific 1976 proof details (use the simplified Hájek or standard textbook reconstruction).

  7.  **Developing the Session Plan (2 Hours):**
      *   *0-15 min:* Setup & The Thesis.
