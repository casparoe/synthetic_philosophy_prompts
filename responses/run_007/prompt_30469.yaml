prompt: |-
  I'm a PhD student and I've been asked to run a two-hour reading group on Lewis's triviality results for indicative conditionals. The group are philosophers of language who're fine with truth tables and possible worlds but have never touched probability logic. Don't explain the results to me — plan the session. I need the order in which the pieces have to go so the proof feels inevitable rather than like a trick: what depends on what, and why. For instance, how do truth conditions vs assertability, the Adams/Stalnaker thesis that the probability of a conditional is the conditional probability, and the assumption that conditionals express propositions need to be sequenced? What one example or case should carry the whole thing, and what must it have or lack? Which misconceptions should I expect — I'm guessing at least 'the result refutes all possible-worlds semantics for conditionals' and 'conditionals are meaningless' — and exactly where in the sequence should I head each one off? What should I openly leave out at this level, and what's one question I can ask at the end to check whether they've actually understood rather than just nodded along?
