          *   *Verdict:* Acceptable simplification for a gloss.

      *   *Sentence 2:* "The standard view says blame is a speech-act-like practice that requires authority, and someone who commits the very wrong she is blaming others for forfeits that authority, so her blame isn't just rude, it's void."
          *   *Assessment:*
              *   "Speech-act-like": Yes, many view blame as communicative (Bell, Watson).
              *   "Requires authority": Yes, standing is often cashed out as a normative authority/power.
              *   "Forfeits that authority": Yes, hypocrisy undermines standing.
              *   "Isn't just rude, it's void": This is the crucial philosophical claim (the "nullification" view). Defenders like Fritz or Bell might say the *protest* is inappropriate or the *demand* is illegitimate. "Void" is a strong legalistic metaphor, but fits the "standing" analogy.
          *   *Verdict:* Defenders would generally accept this, though some might quibble on "void" vs. "appropriately dismissed."

      *   *Sentence 3:* "The person being blamed is then entitled to dismiss the criticism entirely, since a blamer without standing has no right to make the accusation at all."
          *   *Assessment:*
              *   "Entitled to dismiss": Yes, the "tu quoque" response is legitimate.
              *   "Dismiss the criticism entirely": Here's the rub. Does "criticism" mean the *act* of blaming or the *content* (that they did wrong)?
              *   "No right to make the accusation": Accurate regarding the *normative force* of the blame.
          *   *Verdict:* Mostly accurate, but "dismiss the criticism entirely" is ambiguous. If it means "ignore the moral claim," that's problematic. If it means "reject the *authority* of the claim," it's right.

      *   *Sentence 4:* "This is usually presented as a point about the blamer rather than about whether the target really did wrong, which is why critics say the whole view is an elaborate way of letting wrongdoers off the hook."
          *   *Assessment:*
              *   "Point about the blamer rather than... whether the target really did wrong": **This is the key.** Defenders *insist* that standing does not affect blameworthiness. The target is still blameworthy; the hypocrite just can't *express* it appropriately.
              *   "Critics say... letting wrongdoers off the hook": This is a common objection (e.g., from consequentialists or those who think blame is just about desert).
