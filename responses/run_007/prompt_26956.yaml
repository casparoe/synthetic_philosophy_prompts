              *   *The Problem:* The gloss implies the *defenders* present it in a way that *leads* critics to say it lets wrongdoers off the hook. But defenders would vehemently deny that lacking standing lets the wrongdoer "off the hook" regarding their *moral status* or *desert*. It only lets them off the hook regarding *this specific interaction*.
              *   *Verdict:* The first half is accurate (defenders say it's about the blamer). The second half (critics' charge) is accurate as a report of the criticism. *However*, the implication that the criticism is valid or that the view *actually* lets them off the hook (rather than just appearing to) is where the spin lies. The gloss makes it sound like the "letting off the hook" charge is a natural consequence, whereas defenders argue it's a misunderstanding of what blame is for.

