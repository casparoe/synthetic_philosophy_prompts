          2.  Analyze the four cases one by one.
          3.  Discuss the "Costless" assumption (crucial).
          4.  Philosophical significance (Normative vs. Descriptive).
      *   *Refining Case 1 (Game Theory):* Mention the Hirshleifer effect. Distinguish between "information about a fixed state" vs. "information that alters strategic equilibrium."
      *   *Refining Case 2 (Bounded Rationality):* Distinguish between *naive* and *sophisticated* agents. For sophisticated, the theorem holds (value is negative, so don't look). For naive, they aren't EUM agents.
          *   *Correction:* Good's theorem says value is *non-negative*. If processing costs exist, value is negative. The theorem assumes *costless*. If "cost" includes cognitive load, the theorem doesn't apply.
      *   *Refining Case 3 (Causal):* Distinguish Evidential vs. Causal Decision Theory. Good's theorem is compatible with CDT if the causal structure is modeled. But if the info *is* the intervention, it's not just a signal.
      *   *Refining Case 4 (Preferences):* This is the "Changing Self" problem. Good's theorem assumes a stable utility function.
