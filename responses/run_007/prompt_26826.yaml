  4.  **Develop Candidate Principles:**

      *   *Candidate 1: The Appraisal Theory (Cognitive Evaluation).* Emotions require an evaluation of significance relative to goals.
          *   *Fits:* Traffic anger (goal blocked), Fictional sadness (goal/value violation), Parking lot fear (threat assessment).
