      *   **Object/Intentionality:** Traffic (cut off) = Specific. Parking Lot (vague) = Specific enough. Startle (door slam) = Reflex (no cognitive appraisal?). Fictional (character) = Real emotion despite unreal object.
      *   **Bodily vs. Cognitive:** Hunger (bodily) = Not Emotion. Startle (bodily) = Not Emotion. Anger (bodily + cognitive) = Emotion.
