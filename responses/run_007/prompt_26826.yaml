      *   *Selection:* The **Appraisal + Intentionality** hybrid seems strongest for philosophy of emotion (e.g., Nussbaum, Solomon). It best captures the distinction between reflex (no meaning) and emotion (meaning), and mood (diffuse) vs. emotion (specific).

  5.  **Drafting the Response - Section by Section:**

