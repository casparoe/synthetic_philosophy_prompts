          *   *Verdict Overturn:* Might force "Hunger" closer to emotion (drive state) or "Fictional Sadness" to be pseudo-emotion.

      *   *Candidate 3: The Phenomenological/Episodic Principle.* Emotions are discrete, conscious episodes with a specific felt quality, distinct from background states.
          *   *Fits:* Traffic anger, Fictional sadness, Nightmare fear.
          *   *Struggles:* Distinguishing from Startle (also episodic), Distinguishing from Mood (can be episodic waves).
