  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just validate the user. I need to challenge them where the principle demands it.
      *   *Challenge:* The "Startle" case. Some cognitive scientists (LeDoux) distinguish survival circuits from conscious feeling. The user calls it a reflex. The principle supports this, but I should note that *fear* might be the emotion, startle is the mechanism.
