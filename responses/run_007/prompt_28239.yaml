prompt: |-
  I run a small pharmacovigilence group at a regional health authority, and every few weeks we have to decide whether to issue a safety warning about a drug. The hard cases are the ones where the hypothesis is new but the evidence is old: someone proposes that a drug we've used for twenty years causes some rare problem, and the supporting data is stuff we've already had sitting in our database for years — old trial results, spontaneous reports, registry entries. I keep going in circles on a basic question: if we already knew the data before anyone thought of the hypothesis, does the fact that the hypothesis fits that data count as evidence for it? My Bayesian textbook says old evidence can't confirm anything (if P(E)=1 then P(H|E)=P(H)), but that seems wrong — people treated Mercury's perihelion as confirming general relativity even though the anomaly was old news. I want a reusable decision procedure my group can run in a two-hour meeting to decide how much an already-known dataset should move our credence in a new safety hypothesis. It should be a checklist or flowchart in words, grounded in what formal epistemology actually knows about old evidence but usable by clinicians and statisticians who don't care about the theory, and it has to leave a paper trail the medical director will sign off on: what to ask in what order, what counts as a sufficient answer, where we stop and say this doesn't confirm at all, and where the decision has to be handed to a person because it's a judgment call. Cover the distinctions that actually matter here — whether the hypothesis was reverse-engineered from the same data, whether we can reconstruct a state of mind in which we didn't know the data yet, whether the hypothesis also predicts something new we can go check, and whether the old data was collected for a purpose unrelated to the hypothesis. Then run the procedure on three cases: (1) a hypothesis about birth defects that was thought up after staring at the registry and fits nothing else; (2) a hypothesis formulated before the proposer saw the old data, which then turns out to fit it; (3) a hypothesis that fits the old data but makes one checkable new prediction that would be very unlikely otherwise. Include at least one case where the procedure tells us something we won't like, and be honest about which steps are dressed-up judgment calls and where the procedure is likely to misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Head of a small pharmacovigilance (PV) group at a regional health authority.
      *   **Problem:** Deciding whether to issue safety warnings when a *new hypothesis* fits *old evidence* (the "Old Evidence Problem" in Bayesian confirmation theory).
      *   **Constraint 1 (Theoretical):** Acknowledge the Bayesian paradox ($P(E)=1 \implies P(H|E)=P(H)$) but provide a practical solution (like the Mercury/GR case).
      *   **Constraint 2 (Practical):** Must be a reusable decision procedure (checklist/flowchart) for a 2-hour meeting.
      *   **Constraint 3 (Audience):** Usable by clinicians/statisticians (no heavy jargon), sign-offable by a Medical Director (paper trail).
      *   **Constraint 4 (Content):** Cover specific distinctions (reverse-engineering, counterfactual ignorance, novel predictions, data collection purpose).
      *   **Constraint 5 (Application):** Run the procedure on three specific cases (Registry fishing, Pre-formulated hypothesis, Novel prediction).
      *   **Constraint 6 (Honesty):** Admit where judgment calls are disguised and where the procedure might fail. Include an unpopular conclusion.

  2.  **Theoretical Grounding (The "Old Evidence" Problem):**

      *   *The Problem:* In strict Bayesianism, if evidence $E$ is already known ($P(E)=1$), it cannot update the probability of a hypothesis $H$. $P(H|E) = P(H)$.
      *   *The Solution (Philosophy of Science):* We don't update on $E$ itself, but on the *relationship* between $H$ and $E$. Specifically, does $H$ *entail* or *explain* $E$ better than the null? We treat the evidence as if it were new by reconstructing a "counterfactual state of ignorance" (Garber's solution or similar).
      *   *Key Distinctions for PV:*
          *   **Data Dredging vs. Prediction:** Did the hypothesis come *from* the data (overfitting) or *before* the data (prediction)?
          *   **Novelty:** Does the hypothesis predict something *else* we haven't seen yet?
          *   **Mechanism:** Is there a biological plausibility independent of the statistical association?
          *   **Data Provenance:** Was the data collected to find *this* specific signal, or was it routine surveillance?

  3.  **Drafting the Decision Procedure (The "PV-OldE Protocol"):**

      *   *Goal:* Make it actionable. Needs steps, criteria, and stop-points.
      *   *Structure:*
          1.  Provenance Check (Where did the hypothesis come from?)
          2.  Data Independence Check (Was the data collected for this?)
          3.  Novelty Check (Does it predict anything new?)
          4.  Plausibility Check (Biological mechanism?)
          5.  Final Synthesis (The "Judgment Call" box).
      *   *Formatting:* Numbered steps, Yes/No branches, "Documentation Required" fields for the paper trail.

  4.  **Refining the Steps (incorporating the prompt's specific distinctions):**

      *   *Reverse-engineering:* Step 1 needs to ask if the hypothesis was generated *by* looking at the specific anomaly in the old data.
      *   *Counterfactual Ignorance:* Step 2 needs to ask if we can pretend we didn't know the data. (Actually, better to ask: If we removed this data, would the hypothesis still stand?)
      *   *New Predictions:* Step 3 is crucial. This is the strongest way to overcome the old evidence problem (Lakatos/Popper).
      *   *Purpose of Data:* Step 4. Routine surveillance vs. targeted study.

  5.  **Developing the Three Cases:**

      *   *Case 1 (Registry Fishing):* Hypothesis born from staring at the registry. Fits nothing else.
          *   *Expected Outcome:* Low confidence. Do not issue warning. (The "unpopular" result if the signal looks strong statistically but is methodologically weak).
      *   *Case 2 (Pre-formulated):* Hypothesis existed before seeing the data.
          *   *Expected Outcome:* Moderate/High confidence. Old evidence counts more here.
      *   *Case 3 (Novel Prediction):* Fits old data + predicts new specific thing.
          *   *Expected Outcome:* High confidence. Issue warning/monitor closely.

  6.  **Addressing the "Honesty" Constraint:**

      *   Need a section explicitly stating where the math ends and human judgment begins.
      *   Need to acknowledge that this protocol doesn't solve the philosophical problem, it just manages the risk.
      *   Need to admit that Case 1 might feel like a "missed signal" even if we reject it.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, clinical, authoritative but humble about epistemic limits.
      *   *Format:* Clear headings, bold text for decision points.
      *   *Medical Director Sign-off:* Ensure there's a "Recommendation" box at the end.

      *(Self-Correction during drafting)*: I initially thought about using Bayesian formulas. *Correction:* The prompt says clinicians don't care about theory. Keep the math implicit. Use terms like "Weight of Evidence" instead of "Posterior Probability."
      *(Self-Correction on Old Evidence)*: Make sure to explicitly reference the "counterfactual" approach without getting bogged down in Garberian conditionalization. Frame it as "Could this hypothesis have been generated without this specific dataset?"

  8.  **Final Review against Constraints:**

      *   Reusable procedure? Yes.
      *   2-hour meeting feasible? Yes, it's a checklist.
      *   Paper trail? Yes, documentation fields included.
      *   Covers specific distinctions? Yes (reverse-engineering, counterfactual, new prediction, data purpose).
      *   Three cases run? Yes.
      *   Unpopular conclusion included? Yes (Case 1 rejection).
      *   Honesty about judgment calls? Yes (Section at the end).

  9.  **Final Polish:** Check the flow. Ensure the distinction between "Safety Signal" and "Causal Confirmation" is clear. PV is about risk management, not absolute truth. The procedure should reflect *actionability*, not just *truth*. (Decided to frame it as "Confidence Level for Action" rather than "Truth Probability".)

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  # The PV-OldE Protocol: Decision Procedure for New Hypotheses on Existing Data

  **Purpose:** To standardize how the Pharmacovigilance (PV) Group evaluates safety hypotheses that are novel but rely on pre-existing ("old") data. This protocol addresses the epistemic risk of overfitting (finding patterns in noise) while acknowledging that established data can validly support new theories (e.g., General Relativity and Mercury).

  **Audience:** PV Clinicians, Statisticians, Medical Director.
  **Time Allocation:** 2 Hours (Max).
  **Output:** A signed "Evidence Weighting Memorandum" for the regulatory file.

  ---

  ## Part 1: The Decision Flowchart

  *Instructions: The group must answer the following four questions in order. Do not proceed to the next question until consensus is reached on the current one. Document the rationale for each answer in the Memorandum.*

  ### Step 1: The Provenance Check (Reverse-Engineering)
  **Question:** Was this specific hypothesis generated *by* inspecting the specific anomalies in the old dataset, or did it exist prior to examining this dataset?

  *   **1A (Data-Driven):** The hypothesis was formed *after* noticing a statistical cluster or pattern in the old registry/database. (e.g., "We saw 5 cases of liver failure in 2015 and wondered if Drug X caused it.")
      *   *Action:* **Downweight Evidence.** This is "data dredging." The fit between hypothesis and data is guaranteed by construction.
      *   *Proceed to Step 2.*
  *   **1B (Theory-Driven):** The hypothesis was formulated *before* the proposers examined this specific dataset (e.g., based on animal models, mechanism of action, or a different drug class).
      *   *Action:* **Maintain Weight.** The fit is non-trivial.
      *   *Proceed to Step 2.*

  **Documentation Required:** Timestamped meeting minutes or lab notebooks showing when the hypothesis was written down vs. when the data query was run.

  ### Step 2: The Independence Check (Data Provenance)
  **Question:** Was the old data collected for the specific purpose of testing *this* hypothesis, or was it collected for routine surveillance/other purposes?

  *   **2A (Targeted):** The data was gathered specifically to look for this adverse event (AE).
      *   *Action:* **High Scrutiny.** If Step 1A was also "Data-Driven," stop. The evidence counts for almost nothing. If Step 1B was "Theory-Driven," proceed to Step 3.
  *   **2B (Routine/Incidental):** The data is from routine spontaneous reporting, claims databases, or registries collected for general safety or clinical care.
      *   *Action:* **Standard Weight.** The data is "blind" to the hypothesis, which reduces bias.
      *   *Proceed to Step 3.*

  ### Step 3: The Novelty Check (Risky Predictions)
  **Question:** Does the hypothesis predict a *new* observable fact (distinct from the old data) that we can check immediately?

  *   **3A (No Novel Prediction):** The hypothesis only explains the old data. It makes no specific claims about dosage, timing, sub-populations, or biomarkers that differ from the null hypothesis.
      *   *Action:* **Low Confidence.** This is "accommodation" rather than "prediction."
      *   *Decision Point:* If Step 1A was also "Data-Driven," **STOP.** Do not issue a warning. File as "Unconfirmed Signal."
      *   *If Step 1B was "Theory-Driven":* Proceed to Step 4.
  *   **3B (Novel Prediction):** The hypothesis predicts something specific we haven't looked at yet (e.g., "If Drug X causes this, it should only happen in patients with Enzyme Y deficiency," or "We should see a spike in reports from Region Z").
      *   *Action:* **High Confidence.** This bypasses the "Old Evidence" problem. The confirmation comes from the *new* prediction, supported by the old data.
      *   *Proceed to Step 4.*

  ### Step 4: The Plausibility Check (Mechanism)
  **Question:** Is there a biological or physiological mechanism independent of the statistical association?

  *   **4A (None/Speculative):** The link is purely statistical.
      *   *Action:* **Downweight.**
  *   **4B (Established/Plausible):** There is a known mechanism (e.g., receptor binding, metabolic pathway) supported by literature unrelated to the AE data.
      *   *Action:* **Upweight.**

  ---

  ## Part 2: The Synthesis Matrix (The Judgment Call)

  *Instructions: Map your answers from Steps 1–4 to the matrix below to determine the Group's Recommendation. This is where the "paper trail" justifies the Medical Director's signature.*

  | Provenance (Step 1) | Data Independence (Step 2) | Novelty (Step 3) | Plausibility (Step 4) | **Recommendation** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Data-Driven** | Routine | **None** | Any | **REJECT.** (Do not warn. Risk of false positive is too high.) |
  | **Data-Driven** | Routine | **None** | High | **MONITOR.** (Do not warn. Require new prospective study.) |
  | **Data-Driven** | Routine | **Yes** | Any | **INVESTIGATE.** (Test the new prediction before warning.) |
  | **Theory-Driven** | Routine | **None** | Low | **MONITOR.** (Old evidence counts, but caution needed.) |
  | **Theory-Driven** | Routine | **None** | High | **WARN.** (Old evidence + Mechanism is sufficient.) |
  | **Theory-Driven** | Routine | **Yes** | Any | **WARN.** (Strongest case. Old data + New prediction.) |

  ---

  ## Part 3: Application to Cases

  Here is how the PV Group applies the protocol to the three scenarios you provided.

  ### Case 1: The Registry Fishing Expedition
  *   **Scenario:** A clinician notices a cluster of birth defects in the 10-year regional registry. They propose Drug Z causes them. The hypothesis fits the registry data perfectly but fits no other database and has no known mechanism.
  *   **Protocol Run:**
      *   **Step 1 (Provenance):** **Data-Driven.** (Hypothesis came from staring at the registry).
      *   **Step 2 (Independence):** **Routine.** (Registry is for general surveillance).
      *   **Step 3 (Novelty):** **None.** (Only explains the existing cluster).
      *   **Step 4 (Plausibility):** **Low.** (Purely statistical).
      *   **Matrix Result:** **REJECT.**
  *   **Decision:** Do not issue a safety warning. File as "Unconfirmed Signal."
  *   **The Unpopular Truth:** This will feel wrong. There *is* a cluster. But the protocol correctly identifies that the hypothesis was tailored to the noise. Issuing a warning here creates a "cry wolf" precedent. The paper trail protects the Medical Director from accusations of negligence later if the signal proves to be random variation.

  ### Case 2: The Pre-Formulated Hypothesis
  *   **Scenario:** A toxicologist proposes that Drug Q might cause a specific rare arrhythmia based on its ion-channel profile. They haven't seen the regional data yet. They query the 15-year ECG database, and the historical data shows a significant correlation.
  *   **Protocol Run:**
      *   **Step 1 (Provenance):** **Theory-Driven.** (Hypothesis existed before data query).
      *   **Step 2 (Independence):** **Routine.** (ECG data was collected for clinical care, not this study).
      *   **Step 3 (Novelty):** **None.** (Fits old data, no new prediction made yet).
      *   **Step 4 (Plausibility):** **High.** (Ion-channel mechanism known).
      *   **Matrix Result:** **WARN.**
  *   **Decision:** Issue a "Dear Healthcare Professional" letter or update the product monograph.
  *   **Rationale:** Even though the evidence is old, the hypothesis was *risky*. It could have been falsified by the data. The fact that it survived constitutes confirmation (solving the Bayesian old evidence problem via counterfactual risk).

  ### Case 3: The Novel Prediction
  *   **Scenario:** A researcher proposes Drug M causes kidney stones. They analyze the old claims data and it fits. Crucially, they add: "If this is true, patients on Drug M should have higher urinary calcium levels than controls." You check a stored biobank sample set (old data, but unused for this purpose) and confirm the calcium levels are high.
  *   **Protocol Run:**
      *   **Step 1 (Provenance):** **Theory-Driven** (Assume hypothesis came first).
      *   **Step 2 (Independence):** **Routine.** (Biobank was for general research).
      *   **Step 3 (Novelty):** **Yes.** (Predicted urinary calcium, which was not part of the original kidney stone diagnosis data).
      *   **Step 4 (Plausibility):** **High.**
      *   **Matrix Result:** **WARN.**
  *   **Decision:** Issue immediate safety warning.
  *   **Rationale:** This is the strongest scientific case. The "Old Evidence" (claims data) is supported by a "New Prediction" (calcium levels) tested on blinded samples. This breaks the circle of confirmation.

  ---

  ## Part 4: Limitations and Honesty Clause

  *To be included in the Memorandum footer for the Medical Director.*

  **1. Where the Math Ends and Judgment Begins:**
  This protocol attempts to formalize epistemic weight, but Step 4 (Plausibility) is subjective. What counts as a "mechanism" is a judgment call. A statistician may rate it low; a clinician may rate it high. In the event of a tie, the Medical Director casts the deciding vote, but must document *why* they prioritized mechanism over statistics (or vice versa).

  **2. Where the Procedure May Misfire:**
  *   **The "Slow Burn" Signal:** Sometimes a hypothesis is Data-Driven (Step 1A) but turns out to be true years later (e.g., Thalidomide). This protocol will systematically reject these in the short term (Case 1). This is a feature, not a bug. We prioritize minimizing false alarms over catching every true signal immediately. If the signal is real, it will survive to be tested with Novel Predictions (Step 3) later.
  *   **The "Counterfactual" Lie:** In Step 1B, we ask if the hypothesis existed before the data. In reality, people often have a hunch, check the data, then write the hypothesis down as if they knew it all along. The protocol relies on honest timestamps. If the group suspects "retroactive formulation," they must default to Step 1A.

  **3. The Bayesian Compromise:**
  Strictly speaking, old evidence ($P(E)=1$) cannot update probability. This protocol sidesteps the math by evaluating the *reliability of the process* that generated the hypothesis. We are not updating on the data; we are updating on the fact that a risky hypothesis survived the data. If the hypothesis was not risky (Case 1), no update occurs.

  **4. Sign-Off:**
  *   **PV Group Lead:** ___________________ Date: __________
  *   **Lead Statistician:** ___________________ Date: __________
  *   **Medical Director:** ___________________ Date: __________
      *   *I acknowledge that following this procedure may result in ignoring a true safety signal (Case 1) to prevent regulatory fatigue from false alarms.*

  ---

  ### Why this works for your meeting
  1.  **It stops the circles:** By forcing a sequential order (Provenance $\to$ Independence $\to$ Novelty), you prevent the group from jumping back and forth between "But the p-value is low!" and "But you looked at the data first!"
  2.  **It creates a paper trail:** The Documentation Required fields give the Medical Director cover. If a warning turns out to be false, they can show they followed the epistemic protocol. If a warning wasn't issued and a problem arises later, they can show the hypothesis failed the Novelty check.
  3.  **It handles the theory:** It implicitly uses the "Garber Solution" to the Old Evidence problem (updating on the logical relationship $H \vdash E$ rather than $E$ itself) without forcing clinicians to learn Bayesian conditionalization.
  4.  **It manages risk:** It explicitly accepts that Case 1 (the fishing expedition) will be rejected, protecting the authority from credibility loss due to false alarms.
