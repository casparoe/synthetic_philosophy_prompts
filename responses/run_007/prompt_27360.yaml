prompt: |-
  I sit on my high school's Honor Council, and we are about to vote on a case that has split the Council down the middle. I need to draft the written opinion I will circulate before our meeting on Friday.

  The facts are not in dispute. A junior, M., copied roughly a third of a history research paper from an online source without attribution. M. admits this fully. Our school's Academic Integrity Policy states: "Any student found to have committed plagiarism shall receive a failing grade in the course and shall be suspended for one academic semester." The policy contains no provision for mitigating circumstances, no sliding scale, and no language about intent.

  The circumstances, however, are these: M.'s mother was hospitalized for the two weeks before the paper was due, with a serious condition that required surgery. M. was working evening shifts at a grocery store to help cover household expenses during that period. M. has no prior disciplinary record of any kind and a GPA above 3.8. Before the teacher even noticed the plagiarism, M. approached the teacher, confessed, explained the situation, and submitted a completely new paper written from scratch, asking only that it be considered for a late grade. The teacher brought the case to the Council only because the policy requires reporting all plagiarism, and the teacher has submitted a letter urging leniency.

  Half the Council argues that the rule is clear, that it was democratically approved by the student body and faculty, and that making an exception here — however sympathetic the case — would mean we are substituting our own judgment for a rule we are charged with applying. They say that once we start carving out exceptions, the policy loses its force, and future cases will turn on which students can tell the most compelling story.

  The other half argues that applying the rule mechanically to this case would be unjust in a way the rule's authors never intended. The policy, they say, was written to deter students who cheat cynically to gain an advantage — not to punish a student who, under extraordinary strain, made a bad decision, immediately owned it, and did the work properly without being asked. To suspend M., they say, would be to treat a rule as an idol rather than as a tool for justice.

  Please draft the written opinion I will circulate. It should recommend a concrete course of action — whether to impose the full penalty, impose a reduced penalty (specify what), or impose no penalty — with a time frame if relevant. It should give reasons for the recommendation, and it should engage seriously with the strongest consideration on the losing side rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a High School Honor Council.
      *   **Task:** Draft a written opinion to circulate before a meeting on Friday regarding a split vote case.
      *   **Case Facts:** Junior (M.) plagiarized ~1/3 of a history paper. Admits it fully.
      *   **Policy:** "Any student found to have committed plagiarism shall receive a failing grade in the course and shall be suspended for one academic semester." No mitigating circumstances, no intent language.
      *   **Mitigating Circumstances:** Mother hospitalized (surgery), M. working evening shifts to help expenses, no prior record, GPA > 3.8.
      *   **Remedial Action:** M. confessed *before* teacher noticed, explained situation, wrote a new paper from scratch, asked only for late grade consideration.
      *   **Teacher's Stance:** Reported because policy requires it, but urged leniency.
      *   **The Split:**
          *   *Side A (Rule of Law):* Rule is clear/democratic. Exceptions undermine policy/fairness (slippery slope).
          *   *Side B (Equity/Intent):* Rule meant to deter cynical cheating, not punish stress-induced errors + confession. Mechanical application is unjust.
      *   **Requirements:** Recommend concrete action (full/reduced/no penalty + timeframe), give reasons, engage seriously with the strongest counter-argument.

  2.  **Determine the Stance:**
      *   *Option 1: Full Penalty.* Hard to justify given the confession, the new paper, and the extreme hardship. Ignores the teacher's plea and the spirit of honor codes (which usually value honesty).
      *   *Option 2: No Penalty.* Too lenient. Plagiarism did occur. Undermines the seriousness of academic integrity.
      *   *Option 3: Reduced Penalty.* The middle ground. Acknowledges the violation but accounts for the mitigation. This is the most persuasive position for a split council. It respects the rule while interpreting "found to have committed" in light of the self-reporting.
      *   *Decision:* I will argue for a **reduced penalty**. Specifically: A failing grade on the *original* assignment (or the course, depending on how strict we want to be, but let's aim for the course grade reduction but no suspension), *but* waiving the suspension due to the self-reporting and remediation. Actually, looking at the policy ("failing grade in the course"), I need to be careful. If I recommend a failing grade, that's harsh given she wrote a new paper.
      *   *Refined Decision:* The policy says "failing grade in the course." The teacher accepted a new paper. The Council's power is usually to recommend or enforce the sanction. If the Council recommends *not* suspending, that's the big win. The grade is often up to the teacher, but the suspension is the Council's domain.
      *   *Best Compromise:* Uphold the finding of plagiarism (integrity is paramount) but recommend a sanction that reflects the *self-reporting* as a mitigating factor.
      *   *Specific Recommendation:* Find M. responsible for plagiarism. Waive the one-semester suspension (replace with probation/community service). Allow the teacher's decision on the grade (which seems to be accepting the new paper for credit, perhaps with a penalty) to stand, or recommend a grade penalty on the assignment rather than the course.
      *   *Wait, let's look closer at the policy:* "Any student found to have committed plagiarism shall receive a failing grade in the course and shall be suspended."
      *   *Legalistic angle:* M. was "found" by the Council, but M. *self-reported* before being "caught." Does self-reporting negate the "found" status? No, the facts say M. copied.
      *   *Equity angle:* The purpose of the suspension is removal/deterrence. M. has already shown rehabilitation.
      *   *Final Plan:* Recommend a finding of responsibility, but invoke the Council's equitable power to reduce the suspension to disciplinary probation, citing the self-reporting as a distinction from "being found out."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Introduction:** State the purpose of the memo. Acknowledge the difficulty of the case.
      *   **Statement of Facts:** Briefly recap the undisputed facts (plagiarism occurred, but so did the hardship and confession).
      *   **The Core Argument (The "Why"):**
          *   Acknowledge the validity of the "Rule of Law" argument (Side A). It's crucial for trust.
          *   Counter with the "Spirit of the Law" argument (Side B). Honor codes are about *honor*, not just policing.
          *   Synthesis: Self-reporting changes the nature of the violation. It moves from "deception" to "error + honesty."
      *   **The Recommendation:**
          *   Finding: Responsible for plagiarism.
          *   Sanction: Waive the suspension. Replace with Probation + Educational Penalty (e.g., workshop).
          *   Grade: Defer to the teacher (who wants leniency), or recommend a failing grade on the *assignment* but not the *course*. Let's stick to the Council's main lever: The Suspension.
      *   **Addressing the Counter-Argument:** Dedicate a specific section to the "Slippery Slope/Fairness" concern. Explain why this isn't a slippery slope (it sets a precedent for *confession*, not just *hardship*).
      *   **Conclusion:** Call for unity and a decision that reflects the school's values.

  4.  **Refining the Tone:**
      *   Needs to be respectful, thoughtful, and persuasive.
      *   Avoid emotional manipulation; focus on principles.
      *   Acknowledge the weight of the vote.
      *   Ensure the distinction between "excusing the behavior" and "mitigating the sanction" is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is waiving the suspension too soft?
      *   *Fix:* Add a robust alternative sanction (e.g., 20 hours community service, academic integrity workshop) to show there are consequences.
      *   *Critique:* Did I address the policy language ("shall receive")?
      *   *Fix:* Argue that the Council has inherent equitable discretion, or that "found to have committed" implies a process of discovery which was short-circuited by the confession. Actually, better to argue that the Council has the authority to recommend modifications based on the *totality* of the circumstances, even if the policy is rigid. Most Honor Councils have some discretion. I will frame it as interpreting the *purpose* of the sanction.
      *   *Critique:* The prompt asks to engage seriously with the losing side.
      *   *Fix:* Make sure the "Rule of Law" section is robust and not a strawman. Acknowledge that consistency is a virtue.

  6.  **Final Polish:** Check the formatting and ensure the recommendation is concrete (No suspension, but probation).

  *(Self-Correction on the Grade)*: The policy says "failing grade in the course." The teacher accepted a new paper. If the Council mandates a failing grade, it overrides the teacher. If the Council waives the suspension, that's the main issue. I will recommend the Council focus on the suspension (our primary jurisdiction) and recommend the administration/teacher handle the grade in a way that reflects the learning outcome. Actually, to be decisive, I should recommend a specific sanction. Let's recommend: Finding of Violation, Waiver of Suspension (replaced with Probation), and a recommendation to the Administration that the course grade reflect the new paper (perhaps with a letter grade penalty) rather than an automatic F.
  *Wait, simpler is better.* The prompt asks for a concrete course of action. I will recommend: **Finding of Responsibility, but a waiver of the mandatory suspension, replaced with one semester of Disciplinary Probation and a requirement to complete an Academic Integrity workshop.** Regarding the grade, I will recommend upholding the teacher's discretion (since the teacher urged leniency), effectively bypassing the "failing grade" mandate through teacher discretion + Council leniency on the suspension.
  *Actually, the most defensible position:* The Council determines the *disciplinary* sanction (suspension). The teacher determines the *academic* sanction (grade). I will focus my recommendation on the suspension.

  *Revised Plan:*
  1.  Find M. responsible.
  2.  Suspend the *application* of the mandatory suspension penalty.
  3.  Impose Disciplinary Probation + Service.
  4.  Argue that self-reporting distinguishes this from the "cynical cheater" the policy targets.

  Let's write it.

  *Wait, one more check:* The prompt says "The policy contains no provision for mitigating circumstances." This makes my job harder. I need to argue why we can deviate.
  *Argument:* The Council is not a robot. We are judges. Judges interpret laws. The *intent* of the law is deterrence and justice. Applying it unjustly violates the intent. Also, the act of confession fundamentally changes the "plagiarism" from a completed deception to an admitted error.

  Okay, ready to draft.

  *Structure:*
  1.  Header.
  2.  Introduction (Gravity of the vote).
  3.  The Case for Strict Compliance (The Counter-Argument).
  4.  The Case for Equitable Discretion (My Argument).
  5.  The Distinction: Confession vs. Discovery.
  6.  Recommendation.
  7.  Closing.

  *Tone Check:* Collegial, serious, principled.

  *Specific Recommendation:*
  - Verdict: Responsible.
  - Sanction: One semester Disciplinary Probation (instead of Suspension).
  - Grade: Recommend Administration allow the teacher's grading decision (new paper) to stand.
  - Condition: Completion of Integrity Workshop.

