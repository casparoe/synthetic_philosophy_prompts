  2.  **Deconstruct Kant's Position on Animals (Step 1):**
      *   *Core Text:* *Lectures on Ethics* (Collins, Vigilantius), *Metaphysics of Morals* (Doctrine of Virtue).
      *   *Status:* Animals are "things" (*Sachen*), not "persons" (*Personen*). They lack autonomy and rationality.
      *   *Duties:* No *direct* duties *to* animals. Only *indirect* duties *regarding* animals, owed to humanity (specifically, oneself).
      *   *Reasoning:* Cruelty to animals dulls the "natural predisposition" (*Naturanlage*) to sympathy, which is useful for moral duties toward humans. It violates a duty to oneself to maintain moral sensitivity.
      *   *Nuance:* Kant acknowledges animals feel pain and have analogues of reason, but this doesn't grant moral standing. He condemns cruelty strongly, but the *wrong* is ultimately against the human agent's moral character.

  3.  **Identify Load-Bearing Joints (Step 2):**
      *   *Essential (Non-negotiable):*
          *   Moral status is grounded in autonomy/rationality (the capacity to legislate the moral law).
          *   The Formula of Humanity (treat humanity as an end, never merely as a means). "Humanity" = rational nature.
          *   The distinction between price (relative value) and dignity (intrinsic worth). Only rational beings have dignity.
          *   Duty is derived from the Categorical Imperative, which requires a will capable of universalization.
      *   *Contingent/Revisable:*
          *   Empirical claims about animal cognition (Kant knew 18th-century biology).
          *   The specific psychological mechanism linking animal cruelty to human cruelty (the "dulling of sympathy" argument).
          *   The strict binary of Person vs. Thing (though this is tightly woven into the metaphysics).

  4.  **Engage with Singer (Step 3):**
      *   *Singer's Argument:* Sentience (capacity to suffer) is the boundary. Speciesism is arbitrary prejudice. Utilitarian calculation of interests.
      *   *Kant's Reaction:*
          *   *Rejection of Foundation:* Kant rejects consequentialism/utilitarianism. Moral worth isn't about minimizing suffering but respecting rational agency.
          *   *Rejection of Criterion:* Sentience is passive; morality requires activity (autonomy). Suffering matters prudentially, not morally *in the strict sense*.
          *   *Speciesism Charge:* Kant would deny it's arbitrary. Rationality is the only non-arbitrary ground for *moral obligation* (which is reciprocal). Animals cannot be members of the "Kingdom of Ends."
          *   *Verdict:* Outright rejection of the theoretical framework. However, he might agree with the *practical* outcome (don't torture animals) but for entirely different reasons.

  5.  **Engage with Regan (Step 3):**
      *   *Regan's Argument:* "Subject-of-a-life." Inherent value. Rights (not just utilitarian interests). Deontological constraints.
      *   *Kant's Reaction:*
          *   *Resonance:* Regan is deontological. He talks about rights and inherent value. This is closer to Kant than Singer is.
          *   *The Clash:* Regan decouples "inherent value" from "rational autonomy." Kant couples them tightly. For Kant, value is conferred by the moral law, which requires rationality to grasp.
          *   *Potential Accommodation:* If Regan can prove animals have a form of *practical* rationality or a will (not just desires), Kant might budge. But Regan argues for value based on *having* a welfare, not *legislating* it.
          *   *Verdict:* Kant would find Regan more intelligible but ultimately mistaken on the *source* of value. To accept Regan, Kant would need to sever the link between Dignity and Autonomy. This is a major structural change.

