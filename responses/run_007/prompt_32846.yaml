      *   *Nuance:* Kant's argument isn't just "animals can't reason." It's that duties are relations between wills. An animal has no will in the moral sense.
      *   *Singer:* Make sure to emphasize that for Kant, suffering is a pathological state, not a moral ground.
      *   *Regan:* This is the more interesting challenge. If animals have inherent value, do they have dignity? Kant says dignity is above all price. If animals have it, the Formula of Humanity must change to the Formula of Sentient-Life? No, that breaks the CI.
      *   *Key Insight:* The reciprocity condition. Duties imply obligations. Animals cannot owe us duties. Therefore, they cannot be owed duties (in the strict juridical sense). This is a hard stop for Kant.

  8.  **Final Polish:** Check tone (scholarly, precise). Ensure all parts of the prompt are addressed. (Clarify position -> Identify joints -> Engage Singer/Regan -> Verdict on revision).

