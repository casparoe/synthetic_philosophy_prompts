      *   *Dworkinians:* They agree law and morality are connected but think Fuller's proceduralism is too thin. They want substantive moral principles, not just procedural hurdles.
      *   *Natural Lawyer:* Will agree with the conclusion but might think Fuller doesn't go far enough (e.g., Aquinas requires substantive justice, not just procedure).
      *   *Key Vulnerability:* The "Nazi Law" problem. A system can be procedurally perfect but substantively evil. Does Fuller actually prove a *moral* connection or just an *efficacy* connection?

  3.  **Drafting the Objections (Iterative Process):**
      *   *Objection 1 (The Big Gun):* The "Efficiency vs. Morality" objection. Raz/Hart say Fuller confuses "good for law" with "morally good." If I make a poison perfectly, it's good poison, not moral poison. *Damage: High.*
