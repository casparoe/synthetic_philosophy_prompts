      *   *Objection 6 (Natural Lawyer):* Why stop at procedure? What about the Common Good? *Damage: Low-Medium.*
      *   *Objection 7 (The "Single Violation" Problem):* Does one retroactive law destroy the whole system? *Damage: Low.*
      *   *Objection 8 (Authority):* Raz's service conception of authority. Law claims authority; Fuller's view undermines authority if it depends on moral evaluation by subjects. *Damage: Medium.*

      *Refining the Order:* The most damaging are those that strike at the core definition of law and the nature of "morality."
      1.  The Instrumentalist Objection (Efficiency $\neq$ Morality).
      2.  The Wicked Regime Objection (Procedural perfection + Substantive evil = Law?).
      3.  The Defect vs. Non-Existence Objection (Bad knife analogy).
