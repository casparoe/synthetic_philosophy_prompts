prompt: |-
  I'm a philosophy professor working on Dennett's real patterns and the three stances, and I've got a collaborator who's an ML researcher — they work on interpretability, trying to figure out what neural networks are actually doing under the hood. They're sharp but they've never read Dennett, and I want to explain the core ideas to them in a vocabulary they'll recognize. Here's what I need: restate Dennett's view — the three stances (physical, design, intentional), the claim that the intentional stance picks out real patterns even though it's "just" a predictive strategy, and the idea that there's no deeper fact of the matter about which stance is "correct" — in the vocabulary my collaborator actually uses. They think in terms of: model weights vs. activations vs. features, different levels of analysis for understanding a network (individual neurons, circuits, layers, the whole model), the distinction between predictive and mechanistic understanding, and the common practice of ascribing "goals" or "intentions" to model components without literally believing they have mental states.

  Do the translation as faithfully as you can — don't just say "the intentional stance is like prompting a language model," I want the systematic mapping. Then give me the residue report: what translates cleanly, what you had to fudge, and what can't be expressed in the ML vocabulary at all. I want to know whether the ML framework is genuinely missing something important, or whether Dennett's view actually has less content than it looks like when you peel of the philosophical jargon.

  And be honest: how confident are you in this translation overall, and what's the one point you're least sure about?
