      *   **Collaborator:** ML Researcher (Interpretability focus).
      *   **Task:** Translate Dennett's core concepts (Three Stances, Real Patterns, Ontological Status) into ML/Interpretability vocabulary (weights, activations, features, levels of analysis, predictive vs. mechanistic, goal ascription).
      *   **Requirements:**
          1.  Systematic mapping (not superficial analogies).
          2.  Residue Report (what translates, what gets fudged, what's lost).
