answer: |-
  This is a classic problem in social epistemology: the **demarcation problem** for conspiracy theories. Your professor is distinguishing between the *structure* of the claim (a secret plot) and the *status* of the claim (how it is investigated and sustained).

  The pre-Snowden NSA case is the "smoking gun" in your data set. If the rule were simply "false beliefs" or "unproven claims," pre-Snowden NSA surveillance would have been a conspiracy theory. The fact that it wasn't suggests the distinction lies in the **epistemic community** supporting the claim, not just the truth value.

  Here are the three candidate rules, their predictions for the social media case, an assessment of which is most likely, and a test case to distinguish them.

  ### Candidate Rule 1: The Epistemic Immunity Rule (Your Hunch)
  **The Rule:** A belief is a conspiracy theory if it is held in a way that is **self-sealing** or **unfalsifiable**. Evidence against the theory is reinterpreted as evidence *for* the conspiracy (e.g., "The lack of proof proves how good the cover-up is"). Non-conspiracy theories are held tentatively and allow for counter-evidence to falsify them.
  *   **Fits Data:** Explains why Moon/9/11 are CTs (often reject official reports as part of the lie) and Watergate is not (Nixon resigned when evidence mounted).
  *   **Prediction for Social Media Case:** **Ambiguous/Depends on the Believer.** If the claim is "There is evidence of coordination, but I will change my mind if internal logs show otherwise," she will call it **Not a Conspiracy Theory**. If the claim is "They deny it, which proves they are coordinating," she will call it a **Conspiracy Theory**.

  ### Candidate Rule 2: The Institutional Provenance Rule
  **The Rule:** A belief is a conspiracy theory if it originates from and is sustained by **fringe epistemic communities** outside of mainstream institutional authority (academia, credible journalism, congressional oversight, courts). If a claim is investigated by mainstream institutions (even if unproven), it is a "hypothesis," "allegation," or "investigation."
  *   **Fits Data:** Explains the pre-Snowden NSA case (alleged by whistleblowers/ACLU/WSJ, not fringe blogs). Explains Iraq/Oil (mainstream geopolitical debate). Explains MKUltra/COINTELPRO (Congressional hearings validated them). Explains why Moon/QAnon are CTs (no institutional support).
  *   **Prediction for Social Media Case:** **Not a Conspiracy Theory.** There are credible sources for this claim (e.g., the "Twitter Files," Congressional hearings on censorship, lawsuits like *Murthy v. Missouri*). Because mainstream journalists and legislators are investigating it, she will likely classify it as an **"Alleged Collusion"** or **"Investigative Claim."**

  ### Candidate Rule 3: The Secrecy Plausibility Rule
  **The Rule:** A belief is a conspiracy theory if the conspiracy required to make it true would demand an **impossible level of secrecy or competence** from the conspirators. If the plot could realistically be kept secret due to compartmentalization or bureaucratic inertia, it is not a CT.
  *   **Fits Data:** Moon Landing (thousands of engineers couldn't keep a secret) vs. MKUltra (small, compartmentalized units). Iraq/Oil (doesn't require a secret meeting, just aligned incentives).
  *   **Prediction for Social Media Case:** **Not a Conspiracy Theory.** It is highly plausible that tech CEOs talk to White House officials (they do regularly) and that algorithms might align with state interests without a grand, smoky-room pact. The mechanism is bureaucratically plausible.

  ---

  ### Which Rule Is She Running?
  **The Institutional Provenance Rule (Rule 2) is the most likely.**

  Here is why: The **pre-Snowden NSA case** is the dealbreaker.
  *   **Against Epistemic Immunity:** Before Snowden, many people who believed in NSA warrantless surveillance *were* dogmatic about it, yet she classified it as "Not a CT." If she were tracking epistemic practices, the pre-Snowden belief (which lacked hard proof) often functioned like a CT for many believers.
  *   **Against Secrecy Plausibility:** While NSA surveillance is plausible, so is the idea that the government might fake a moon landing to win the Cold War (in terms of raw possibility). The distinction is that the NSA claim was taken seriously by the *New York Times* and the *ACLU* before it was proven. The Moon Hoax was not.
  *   **For Institutional Provenance:** She explicitly distinguishes Watergate as a "documented criminal conspiracy." This implies that once the *institutions* (Courts, Congress) validate the plot, it exits the "theory" category. But she also excluded pre-Snowden NSA, which means **institutional attention** (credible allegations worthy of investigation) is enough to remove the "conspiracy theory" label, even before documentation.

  She is teaching you that "Conspiracy Theory" is a sociological label about **who is allowed to speak**, not just a logical label about **what is spoken**.

  ---

  ### The Test Case: The Satanic Panic (1980s)
  To cleanly distinguish between **Institutional Provenance** and **Epistemic Immunity**, you should ask her about the **Satanic Ritual Abuse panic of the 1980s**.

  **The Case:** In the 80s and 90s, there was a widespread belief that underground networks of satanists were abusing children in daycare centers.
  *   **Institutional Status:** High. Police, prosecutors, therapists, and social workers investigated these claims. There were congressional hearings. It was not a "fringe" belief; it was the official stance of many authorities.
  *   **Epistemic Status:** Low. The beliefs were self-sealing. Lack of physical evidence was explained by "satanic powers" or "repressed memory." It was largely unfalsifiable and eventually debunked.

  **The Predictions:**
  1.  **If she says it WAS a Conspiracy Theory:** She is running the **Epistemic Immunity Rule** (because the beliefs were self-sealing and false, despite institutional support).
  2.  **If she says it WAS NOT a Conspiracy Theory (but rather "Moral Panic" or "Failed Investigation"):** She is running the **Institutional Provenance Rule** (because it was sanctioned by police/courts at the time).

  **Why this works:** It forces her to choose between the *source* of the belief (Institutions vs. Fringe) and the *structure* of the belief (Falsifiable vs. Self-Sealing). Given her track record with the NSA, my money is on her saying it wasn't a "conspiracy theory" per se, but a "mass hysteria" or "investigative failure," preserving the rule that CTs are primarily fringe phenomena.
