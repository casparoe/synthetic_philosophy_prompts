      *   "Does happen": Is actual simpliciter (equal ontological footing).
      *   Status: Substantive commitment (often leads to Branch Counting).
      *   Born Rule Impact: Conflicts with Born Rule (unless weights are added). If all are equal, probability is uniform, not $|\psi|^2$.

      *Refining Reading 3 (Self-Locating/Subjective):*
      *   "Can happen": Outcomes compatible with pre-measurement state.
      *   "Does happen": Is experienced by *some* successor.
      *   Status: Substantive (Everettian).
      *   Born Rule Impact: Renames it. Problem becomes "Why should *I* expect to be on a high-weight branch?" (Self-locating uncertainty).

      *Refining Reading 4 (Deterministic/Block Universe):*
      *   "Can happen": Physically possible trajectories.
      *   "Does happen": Is part of the block.
