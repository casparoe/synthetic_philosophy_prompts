          *   **Tone/Style:** Disambiguation with verdicts, not defending a single interpretation. Rigorous, philosophical, suitable for grad students.

  2.  **Deconstruct the Slogan:**
      *   The core slogan is: "Everything that can happen does happen."
      *   Variations: "Every possible outcome occurs," "All branches are actual."
      *   Key ambiguity 1: Modality ("can happen"). What is the space of possibilities?
      *   Key ambiguity 2: Actuality ("does happen"). What is the ontological status of these events?
      *   Key ambiguity 3: Probability/Measure. How do we count or weigh these events?

  3.  **Drafting the Readings (The "Menu"):**
