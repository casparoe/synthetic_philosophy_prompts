      *   *Reading 3: The Epistemic/Subjective Claim.* Focus on observer experience.
      *   *Reading 4: The Measure-Theoretic Claim.* Focus on the weights (amplitudes).

      *Refining Reading 1 (Kinematic):*
      *   "Can happen": Non-zero amplitude terms in the universal wavefunction.
      *   "Does happen": Exists as a component of the vector.
      *   Status: True/Platitude (within MWI framework).
      *   Born Rule Impact: Leaves it intact. Existence $\neq$ Probability.

      *Refining Reading 2 (Ontological/Branch Counting):*
