answer: |-
  You have hit on exactly the right insight. If you teach *The Metamorphosis* as a text about insect sentience, it will fail. But if you teach it as a text about the **social construction of the "pest,"** it becomes a devastating critique of the psychological mechanisms that make pest control ethically invisible.

  You are correct: the philosophical literature on insect ethics is largely obsessed with the *ontological* question (Do they feel? Do they count?). Kafka bypasses that to ask the *sociological* question (How do we decide who counts, and how do we justify removing them?).

  Here is a breakdown of what the story genuinely adds to the debate, how to use your selected scenes, and where you must flag the metaphor's limits.

  ### 1. What the Story Adds: The Ethics of Classification
  Standard animal ethics papers often assume that if we can prove sentience, moral consideration will follow. *The Metamorphosis* suggests the opposite: moral consideration can be withdrawn even when sentience is undeniable.

  **A. "Pest" is a Relational Category, Not a Biological One**
  In philosophy, we often treat "pest" as a biological designation. Kafka shows it is a *relational* one. Gregor is the same entity on Tuesday as he was on Monday, but his status has shifted from "Son/Provider" to "Vermin" (*Ungeziefer*).
  *   **Philosophical Parallel:** This mirrors the distinction between a "wild animal," a "pet," and a "pest." A mouse in a field is neutral; a mouse in a pantry is a pest. The story reveals that "pesthood" is assigned based on **inconvenience and location**, not intrinsic nature.
  *   **Class Discussion:** Does an insect become a "pest" only when it intersects with human economic interests? If so, is pest control inherently anthropocentric utilitarianism?

  **B. The Gradual Erosion of Empathy (The "Slippery Slope")**
  The family does not wake up and decide to murder Gregor. It happens through a series of small compromises. They move the furniture (erasing his history). They stop cleaning his room (erasing his dignity). They stop feeding him properly (erasing his biological needs).
  *   **Philosophical Parallel:** This challenges the idea that extermination is a singular moral event. It suggests that mass killing is enabled by a prior **process of de-subjectification**. Before we spray the insecticide, we conceptually turn the insect into "noise" or "dirt."
  *   **Class Discussion:** Is the moral wrong in pest control the act of killing, or the prior mental act of reclassifying a living being as "waste"?

  **C. Economic Utility as Moral Worth**
  Gregor's value to the family was largely economic. He was the traveling salesman paying off the parents' debt. Once he cannot work, his moral standing collapses.
  *   **Philosophical Parallel:** This parallels how we treat animals. Bees are valued for pollination (labor); locusts are destroyed for consuming crops (economic loss). The story forces students to ask: **Do we only grant moral status to animals that provide us a net service?**
  *   **Class Discussion:** If Gregor had turned into a bug but could still earn money (perhaps by being exhibited), would the family have treated him differently? (Textual evidence suggests yes—the father is more violent when Gregor is useless).

  ### 2. Using Your Selected Scenes

  **The Apple-Throwing Incident**
  *   **The Scene:** The father bombards Gregor with apples; one becomes embedded in his flesh, rotting and causing infection.
  *   **The Ethical Point:** This is the transition from *neglect* to *active violence*. It marks the moment the family accepts that harming him is permissible for the sake of "order."
  *   **Discussion:** Compare this to the threshold in pest control. When does defense of property become gratuitous violence? The apple rots in Gregor's back—a lingering reminder of the injury that the family ignores. This mirrors how we ignore the environmental residue of insecticides.

  **Grete's Speech ("We must try to get rid of it")**
  *   **The Scene:** Grete, who was his primary caretaker, argues that "this creature" is tormenting them and cannot be her brother. She says, "If it were Gregor, he would have seen long ago that human beings can't live with such a creature."
  *   **The Ethical Point:** This is the **linguistic severing**. By switching from "he" to "it" (or *es* in German), she retroactively justifies the extermination. She claims to know what Gregor *would* want (death) to assuage her own guilt.
  *   **Discussion:** This is the core of the "pest" mentality. We assume the pest "would want" to be gone if it understood our human needs. It is a projection of human convenience onto the other.

  **The Charwoman Disposing of the Body**
  *   **The Scene:** After Gregor dies, the charwoman says, "Come and look, it's kicked the bucket," and sweeps the body away. The family feels a sense of relief and takes a trolley ride into the countryside.
  *   **The Ethical Point:** The **banality of disposal**. Gregor's death is not a tragedy; it is a sanitation issue. The family's relief highlights that their morality is based on *comfort*, not *justice*.
  *   **Discussion:** Connect this to the end-of-life phase of pest control. The goal is not mourning; it is hygiene. The trolley ride into the sun symbolizes the restoration of "natural order" once the anomaly is removed.

  ### 3. Where the Metaphor Breaks Down (Crucial for Critical Thinking)

  You must flag these limitations, or students might walk away thinking the story proves insect sentience. It doesn't.

  **A. Epistemic Certainty vs. Uncertainty**
  *   **The Breakdown:** We *know* Gregor suffers. We have access to his thoughts. In the real world, we have **epistemic uncertainty** about insects. We don't know if a cockroach feels pain or is just reacting mechanically.
  *   **The Lesson:** The story actually makes the ethical problem *harder*, not easier. If we struggle to treat a *known person* (Gregor) ethically when he looks like a bug, how much harder is it to treat an *actual bug* ethically when we aren't sure if it's a person? It suggests our bias is visual, not evidential.

  **B. Scale and Anonymity**
  *   **The Breakdown:** Gregor is singular and named. Pest control deals with trillions of anonymous lives. It is easy to mourn Gregor; it is hard to mourn a colony of aphids.
  *   **The Lesson:** The story highlights the **identifiable victim effect**. We are wired to care about individuals, not statistics. Pest control relies on statistical thinking ("crop yield loss") while ethics often relies on individual thinking ("this suffering being"). How do we bridge that gap?

  **C. Malice vs. Systemic Indifference**
  *   **The Breakdown:** The family is emotionally distressed by Gregor. They argue and cry. Modern pest control is bureaucratic and industrial. It is done by machines and chemicals, not angry fathers throwing apples.
  *   **The Lesson:** Kafka shows the *emotional cost* of dehumanization to the dehumanizer (the family becomes colder). Modern insecticide use removes that emotional cost entirely. Does making killing "cleaner" make it ethically worse because it requires less psychological effort?

  ### 4. Summary for Your Syllabus

  If I were framing this for students, I would posit *The Metamorphosis* not as a text about insects, but as a text about **Moral Exclusion**.

  **The Core Thesis for the Class:**
  > "Philosophical debates often ask: *'Do insects have enough traits to deserve moral status?'* Kafka asks: *'How do we strip moral status from beings who clearly have it?'* The story suggests that 'pest control' is not just a biological necessity, but a psychological boundary-drawing exercise that allows 'ordinary decent people' to commit violence without viewing themselves as violent."

  This approach respects the philosophical literature (by not claiming Kafka solves the sentience problem) while using the literature to illuminate the *human* side of the ethics equation, which is often ignored in utilitarian calculations of insect suffering.
