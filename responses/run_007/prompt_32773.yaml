      *   **Which Verdicts to Overturn?** The weakest link is (2). If (1) is true (Psych continuity suffices), why does the existence of the Earth body negate the Mars body's identity? Parfit argues we should say *neither* is strictly identical in (2), or that identity is indeterminate. Insisting the Earth body is *me* privileges the body over the mind, contradicting (1). *Recommendation:* Adopt Parfit's view: In (2), strict identity is empty/indeterminate for both, but *survival* applies to both.
      *   **Predictions:**
