answer: |-
  It is entirely understandable that you felt the discussion moved too quickly, for Putnam's slogan is often wielded as a conversation stopper when it actually functions as a conversation starter. Your suspicion that the slogan is doing more work than it can bear is well-founded, primarily because the phrase meanings just ain't in the head is ambiguous between several distinct philosophical claims ranging from the nearly trivial to the highly controversial. To be fair to your colleague while preserving the integrity of your project, it helps to disentangle these readings. The weakest and most defensible reading concerns public linguistic meaning rather than individual psychology. On this view, the extension of a term in a public language is not fixed solely by an individual speaker's internal states. This claim is close to trivial given the Twin Earth cases, since Oscar and Twin Oscar use the word water to refer to different substances despite being internally identical. However, this reading is fully compatible with a robust notion of narrow content, because one can maintain that while public reference depends on the environment, the psychological state underlying the use of the term remains shared. Dismissing narrow content requires more than showing that public language meaning is wide.

  A slightly stronger reading focuses on the division of linguistic labor, suggesting that what determines the reference of a speaker's term often depends on the expertise of others in their community rather than their own internal knowledge. This is substantive and defensible, as Putnam argued regarding terms like elm or gold. Yet, this too is compatible with narrow content. One can hold that a speaker possesses a narrow conceptual role or mode of presentation that is identical to their duplicate's, even if the external reference is fixed by social norms. This reading does not license dismissing narrow content because it addresses the conditions for reference fixation in a public language, not the exhaustive nature of psychological content. It leaves open the possibility that there is a component of content that is independent of these external factors.

  Moving from language to mind, a third reading asserts that the reference of mental states themselves depends on the environment. This is the claim that what my thought is about is determined partly by factors outside my skin. This is substantive and defensible based on the standard Twin Earth intuition pumps, which suggest that Oscar's thought is about H2O while Twin Oscar's is about XYZ. While this establishes the existence of wide content, it does not logically entail the non-existence of narrow content. It is compatible with a two-factor theory where mental states have both a wide component (reference) and a narrow component (psychological role). Therefore, this reading alone does not license dismissing narrow content, as it only proves that some aspect of content is wide, not that all aspects are.

  The reading that would actually license dismissing narrow content is the claim that no psychologically relevant property supervenes on internal states, or equivalently, that there is no notion of content that captures what internally identical subjects share. This is a strong claim that goes beyond what the Twin Earth cases strictly demonstrate. The cases show that reference varies with environment, but they do not prove that there is no other property varying with internal state that deserves the name content. Consequently, relative to the standard Twin Earth cases, this reading is an overstatement. It assumes that because wide content exists, it must be the only kind of content, which is a substantive metaphysical commitment rather than a direct consequence of the thought experiment. Accepting this reading would rule out narrow content by fiat, but it is not forced upon us by the data.

  A further reading concerns psychological explanation, asserting that only wide content is relevant for explaining behavior. This is substantive and highly debated, forming the core of the dispute between individualists and anti-individualists. If true, this would render narrow content explanatorily idle, though not necessarily non-existent. However, many argue that narrow content is precisely what is needed for causal explanations of behavior since twins behave identically despite different environments. Thus, this claim is not settled by the slogan itself. It is compatible with narrow content if one believes narrow content plays a unique explanatory role, but it dismisses narrow content if one assumes explanation requires wide individuation. This is a separate argument that requires more support than the slogan provides.

  When your colleague used the slogan to close down the exchange, they were most likely trading on a slide from the defensible claim that reference is wide to the overstated claim that all content is wide. They seem to be arguing that because Twin Earth shows meanings are not in the head, there is nothing in the head that matters for content. This argument is invalid because it commits a fallacy of composition or exhaustiveness. It moves from the premise that some properties of meaning are external to the conclusion that no properties of meaning are internal. The Twin Earth cases successfully establish externalism about reference, but they do not establish eliminativism about narrow content. To dismiss narrow content, one needs an additional premise that content is exhausted by reference or that psychological explanation requires wide individuation, neither of which is contained in the slogan itself.

  You are right to press for precision here. The slogan is a memorable summary of externalism about reference, but it is not a refutation of internalism about psychological states. A careful defense of narrow content acknowledges that meanings in the public language sense ain't in the head, while maintaining that the psychological vehicles or conceptual roles that mediate our interaction with those meanings are in the head. Your colleague's dismissal was premature because it treated a specific thesis about reference determination as a general thesis about the nature of the mind. You should feel confident continuing your work on viability, provided you clearly distinguish between the wide content that fixes reference and the narrow content that captures psychological similarity. The debate is far from settled, and the slogan is not the final word.
