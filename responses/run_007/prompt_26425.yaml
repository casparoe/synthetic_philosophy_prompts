answer: |-
  The frustration you are experiencing is well-founded. The slogan "truth is what works" is one of the most durable and damaging caricatures in the history of American philosophy. It functions as a philosophical Rorschach test: people project their own preferred level of metaphysical commitment onto it. In your seminar, the slogan is being used to paper over a genuine, substantive rift between Peirce and James.

  To write a strong term paper, you need to dismantle the slogan by distinguishing three distinct theses it conceals. I will lay these out from the most defensible (but least interesting) to the most radical (and most problematic). Then I will evaluate the four moves you described against these theses.

  ### Part I: Three Theses Hidden in the Slogan

  #### 1. The Epistemic (Heuristic) Thesis
  **The Claim:** Practical success is the reliable *sign* or *criterion* of truth, but not its definition. If a belief guides action successfully over the long run, we are warranted in calling it true.
  *   **Plausibility:** High. This is commonsensical. If your map leads you to the destination, it is likely an accurate map.
  *   **Peirce:** **Yes.** Peirce holds that successful prediction is the *test* of reality. However, he insists that the success must be independent of what we wish to be the case. The "work" must be compelled by an external reality.
  *   **James:** **Yes, but...** James accepts this as a starting point but pushes further. He often treats the criterion as if it were the definition.
  *   **Status:** This is the only version of the slogan that is philosophically robust, but it is also the least "pragmatic" in the revolutionary sense. It is compatible with the Correspondence Theory (success indicates correspondence).

  #### 2. The Semantic (Operational) Thesis
  **The Claim:** The *meaning* of a truth-claim is exhausted by its practical consequences. To say a belief is "true" is just to say that holding it yields specific verifiable experiences. There is no "hidden" reality behind the success.
  *   **Plausibility:** Moderate. This anticipates logical positivism and verificationism. It faces the objection that two distinct theories could have identical practical consequences (the underdetermination problem).
  *   **Peirce:** **Yes.** This is the core of Peirce's "Pragmatic Maxim." He cares about clarifying concepts. For Peirce, if two hypotheses produce the same sensible effects, they are the same hypothesis.
  *   **James:** **Yes.** This is James's "cash-value." He argues that if a metaphysical dispute makes no practical difference to anyone's life, the dispute is idle.
  *   **Status:** This is a theory of *meaning*, not strictly a theory of *truth*. However, it is often conflated with a theory of truth.

  #### 3. The Metaphysical (Humanist) Thesis
  **The Claim:** Truth is *constituted* by practical satisfactoriness. A belief becomes true *because* it works (satisfies desires, resolves tension, fits with existing beliefs). Reality is malleable to the extent that our successful interactions "make" the truth.
  *   **Plausibility:** Low. This invites the charge of relativism (what works for me might not work for you) and confuses *goodness* with *truth*.
  *   **Peirce:** **No.** Peirce explicitly rejected this. He was a Scholastic Realist; he believed truth is independent of what you or I think. He renamed his doctrine "Pragmaticism" specifically to distance himself from this reading.
  *   **James:** **Yes.** In *Pragmatism* (1907), James explicitly argues that truths are "made." He writes, "The truth of an idea is not a stagnant property inherent in it. Truth happens to an idea. It becomes true, is made true by events."
  *   **Status:** This is the "radical" reading. It is the most controversial and the one most often attacked by critics (like Bertrand Russell).

  ---

  ### Part II: Evaluating the Four Seminar Moves

  Now we can assess the four moves you heard in class. My position is that your classmates are largely conflating these theses to make arguments that do not hold up under scrutiny.

  #### Move 1: "Peirce and James hold the same theory; the difference is just emphasis."
  *   **Which Thesis supports this?** Only if you conflate the **Epistemic Thesis** with the **Metaphysical Thesis**. If you assume "what works" means the same thing for both, they look identical.
  *   **Verdict:** **False.** This is a bad reading.
  *   **Defense:** The difference is not emphasis; it is ontological. Peirce believes inquiry converges on a truth that is *already there* waiting to be found (Realism). James believes inquiry *creates* truth through the process of verification (Humanism/Nominalism). Peirce's "works" means "predicts sensory experience correctly regardless of desire." James's "works" includes "satisfies psychological needs and fits coherently with other beliefs." If you use the Metaphysical Thesis, Peirce and James are opponents. If you use the Epistemic Thesis, they are allies, but you have stripped James of his distinctiveness. For your paper, argue that the convergence picture (Peirce) and the cash-value picture (James) are incompatible at the limit: one is discovery, the other is creation.

  #### Move 2: "Truth isn't mirroring reality; truth is what works." (Dismissing Correspondence)
  *   **Which Thesis supports this?** The **Semantic Thesis** or the **Metaphysical Thesis**.
  *   **Verdict:** **Partially Valid, but often sloppy.**
  *   **Defense:** The **Epistemic Thesis** does *not* dismiss correspondence; it merely says we access correspondence through working. To dismiss correspondence, you must adopt the **Metaphysical Thesis** (James). However, this move is vulnerable. Even if truth is defined by working, "working" usually implies navigating a resistant environment. That resistance looks a lot like "reality." A sophisticated correspondence theorist can agree that true beliefs "work" without agreeing that "working" defines truth. The slogan only defeats correspondence if you accept the radical claim that there is no reality independent of our verification. That is a heavy metaphysical burden to place on a slogan.

  #### Move 3: "Quantum mechanics is true because it works." (Scientific Instrumentalism)
  *   **Which Thesis supports this?** The **Semantic Thesis**.
  *   **Verdict:** **Plausible, but limited.**
  *   **Defense:** This is the most defensible use of the slogan in a scientific context. It aligns with Peirce's view that the meaning of a scientific concept lies in its experimental consequences. However, calling it "true" rather than "empirically adequate" (as van Fraassen would) requires the **Metaphysical Thesis**. If you are a scientific realist, you believe QM is true because it describes the structure of the electron, not just because it lets us build lasers. The slogan supports instrumentalism (science is a tool), but it undermines scientific realism (science is a description of nature). If your seminar is discussing pragmatism and science, note that Peirce was a realist about scientific laws, whereas this slogan pushes toward anti-realism.

  #### Move 4: "Religious beliefs can be true if they produce good effects." (The Religious Defense)
  *   **Which Thesis supports this?** Only the **Metaphysical Thesis**.
  *   **Verdict:** **Invalid.** This is a category error.
  *   **Defense:** This is the most egregious misuse of the slogan. Even James, who defended the *right to believe* in "The Will to Believe," was careful. In *Pragmatism*, James argues that if belief in God produces a "better fit" with experience (including moral experience), it has cash value. However, conflating "good effects" (psychological comfort, moral motivation) with "truth" (accuracy regarding existence) is a fallacy. A placebo works, but the proposition "this pill contains medicine" is false. The **Epistemic Thesis** cannot support this (good effects don't prove existence). The **Semantic Thesis** cannot support this (the meaning of "God exists" involves ontological claims, not just feelings). Only the **Metaphysical Thesis** allows this, by redefining truth as "what is good to believe." But if you do that, you have changed the subject. You are no longer talking about truth; you are talking about utility. This move is philosophically bankrupt unless one accepts James's radical redefinition of truth, which most realists (including Peirce) reject.

  ### Recommendation for Your Term Paper

  Do not let the seminar settle for the slogan. Your paper should argue that "truth is what works" is a catastrophic oversimplification that obscures the central tension in classical pragmatism.

  1.  **Thesis:** Peirce and James offer competing accounts of the relationship between practice and truth. Peirce subordinates practice to reality (Realism); James subordinates reality to practice (Humanism).
  2.  **Argument:** Show that the "convergence" view (Peirce) requires a notion of truth that transcends current utility, whereas the "cash-value" view (James) ties truth to the specific satisfactions of the believer.
  3.  **Conclusion:** The slogan "truth is what works" is only defensible if interpreted as the **Epistemic Thesis**, but that interpretation is too weak to support the radical claims your classmates are making (especially regarding religion and the dismissal of correspondence). If interpreted strongly enough to support those claims (the **Metaphysical Thesis**), it becomes implausible and drives a wedge between Peirce and James rather than uniting them.

  Your classmates are using a slogan to close inquiry. As pragmatists (especially Peirceans), they should know better: the slogan is an obstacle to clear thinking, not a solution.
