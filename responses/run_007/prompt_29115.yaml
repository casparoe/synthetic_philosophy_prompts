  **Frank Jackson's Mary the color scientist:** The argument collapses without the temporal unfolding of Mary's release and the sensory concreteness of seeing red, as the claim relies entirely on the reader simulating a qualitative experience to grasp the knowledge argument.

  **Robert Nozick's experience machine:** The refutation of hedonism depends on the reader's visceral identification with the protagonist facing the choice, utilizing defamiliarization to make an abstract value judgment tangible and immediate.

  **Judith Jarvis Thomson's violinist:** The narrative's sensory detail of kidnapping and bodily intrusion performs the ethical work of bypassing responsibility objections, though the core claim about bodily autonomy remains intelligible abstractly.

  **John Searle's Chinese Room:** Protagonist identification with the man shuffling papers generates the intuition that syntax lacks semantics, yet the logical distinction between simulation and reality survives without the room metaphor.

  **Derek Parfit's teletransporter:** The sci-fi staging isolates variables of psychological continuity, but the narrative is not load-bearing because Parfit's reductionist conclusion rests on logical relations rather than the teleportation story.

  **Judith Jarvis Thomson's people-seeds:** The absurdist imagery illustrates the consent analogy effectively, but the argument functions as a structural comparison of property rights that stands without the specific seed metaphor.

  **Philippa Foot's trolley problem:** The narrative is a schematic diagram where the train and switch are interchangeable variables, leaving the utilitarian calculus fully intact when stated as an abstract trade-off.

  **Hilary Putnam's Twin Earth:** The scenario acts as a static logical model rather than a narrative, meaning the externalist conclusion follows from the chemical distinction alone without needing the story of Oscar.
