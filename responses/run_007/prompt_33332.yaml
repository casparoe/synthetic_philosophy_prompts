  I'm a graduate student in metaphysics, and I'm trying to get clear on what's really at stake in the debate over the identity of indiscernibles. I've read all the standard stuff — Black's spheres, the Leibnizian responses, the stuff about haecceities and relational properties — but I keep feeling like the real action is in a particular move that doesn't get discussed enough.

  Here's what I want: a thought experiment where two objects are indiscernible in every qualitative intrinsic respect, and also indiscernible in every spatiotemporal relational respect (so they can't be distinguished by where they are or by their spatial relations to other things), but there's still a strong intuition that they are two objects and not one. The only properties that seem to distinguish them are what you might call "identity-involving" relational properties — things like "being numerically distinct from object A" or "being the object that is not identical to B." The Leibnizian will say these aren't admissable properties because they presuppose the very distinctness that's at issue. The sceptic will say that's exactly the point: the identity of indiscernibles only works if you rule out the very properties that actually do the individuating.

  Constraints on the scenario: it should be realistic — no empty universes, no possible worlds, no exotic physics. It should fit in one paragraph. And the objects should be ordinary things, not abstracta. I want the case to be genuinely harder for the Leibnizian than Black's spheres, not just a warmed-over version of it.

  After you give the scenario, please walk through:
  (a) What the Leibnizian says — do they identify the two objects, and on what grounds? What admissible property do they point to, if any?
  (b) What the sceptic says — why they think the objects are distinct, and why they think the Leibnizian's move fails.
  (c) Which feature of the case is doing the real work, and what happens if you remove it — does the case collapse back into Black's spheres, or into something else?
  (d) If the Leibnizian bites the bullet and says there's only one object after all, what's the most uncomfortable consequence they have to accept — the thing that would make even a sympathetic reader squirm?

  You're an expert metaphysician — think carefully, and start by brainstorming possible scenarios before you commit to one. I want the case to be original if possible, not something I'd have already read in a paper. And honestly, if you think the spec I've given is impossible to satisfy, tell me that too and explain why — that's useful data for my paper.
