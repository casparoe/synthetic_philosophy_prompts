answer: |-
  I must begin with a candid assessment of your constraints: for **ordinary material objects** within a **realistic** physical framework (classical mereology and Newtonian/Einsteinian physics), the scenario you requested is impossible. The principle of impenetrability dictates that two distinct material substances cannot occupy the exact same spatiotemporal coordinates; if they did, they would constitute a single material object. This is precisely why the literature defaults to Max Black's spheres (which rely on spatial *separation*) or quantum mechanics (which relies on "exotic" physics like bosonic superposition). To give you the metaphysical analysis you need without misleading you about the physics, I will present a *stipulated* conceptual case that isolates the logical issue, acknowledging that it requires suspending the law of impenetrability.

  Consider two clay statues, *Statue A* and *Statue B*, formed simultaneously from distinct but qualitatively identical lumps of clay, shaped by identical molds, and placed in the exact same location such that they perfectly interpenetrate without merging or displacing one another. They share every intrinsic qualitative property (mass, color, shape, molecular structure) and every spatiotemporal relational property (distance to the wall, distance to each other is zero). They exist for the same duration and undergo the same changes. The only apparent difference is that *Statue A* is not *Statue B*, and each bears identity-involving relations to itself that the other does not (e.g., *A* is identical to *A*). Intuitively, because they were formed from distinct lumps, there are "two things" here, yet there is no qualitative or spatiotemporal fact that distinguishes them.

  (a) **The Leibnizian Response:** The strict Leibnizian must identify *Statue A* and *Statue B* as a single object. They argue that "being formed from lump 1" vs. "being formed from lump 2" are not admissible qualitative properties if the lumps themselves are indiscernible; they are merely disguised identity claims. The Leibnizian points to the property "occupying region R at time t." Since only one object can occupy a region (by their lights), and both candidates occupy it, there is only one object. They reject the intuition of "twoness" as a cognitive error arising from tracking the *history* of the clay, which, if truly indiscernible, provides no metaphysical grounding for distinctness.

  (b) **The Sceptic's Response:** The sceptic argues that numerical distinctness is primitive and does not require a qualitative ground. They maintain that *Statue A* and *Statue B* are distinct because identity is not reducible to qualitative similarity. The Leibnizian's move fails because it begs the question: by defining "admissible properties" to exclude identity-involving ones, the Leibnizian makes PII a tautology rather than a substantive metaphysical principle. The sceptic insists that the intuition of "twoness" survives even when all qualitative and spatiotemporal filters are removed, proving that *haecceity* (thisness) is real.

  (c) **The Critical Feature:** The feature doing the real work is **co-location without merger**. In Black's spheres, the sceptic can argue that "being 2 miles from the other sphere" is a valid relational property distinguishing them. By removing spatial separation, this case blocks the Leibnizian from using spatial relations as individuating factors. If you remove co-location (returning to Black's spheres), the case collapses into a debate about whether symmetric relations count as discerning properties. If you remove the "ordinary object" constraint (moving to quantum particles), the case becomes about permutation invariance rather than metaphysical individuation. This scenario isolates the question: *Can number exist without quality?*

  (d) **The Uncomfortable Consequence:** If the Leibnizian bites the bullet and says there is only one statue, they must accept **mereological essentialism or coincidence denial** in its strongest form: they must claim that distinct causal histories (two lumps vs. one) cannot result in distinct objects if the end state is qualitatively identical. The squirm-inducing consequence is that **counting becomes opaque**; we cannot know if we are looking at one object or a thousand interpenetrating indiscernible objects, rendering the concept of "object" epistemically unstable. It implies that distinctness is not a feature of the world, but a feature of our description, which undermines the realist intuition that metaphysics is about mind-independent reality.
