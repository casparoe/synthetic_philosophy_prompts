prompt: |-
  hey, so i'm a phd student in political science and i run this reading group on rational choice theory and democracy. two of the regulars have been going at it for like a year about the paradox of voting — basically whether it's rational to vote in large elections. one of them (the public choice guy) thinks it's obviously irrational, the other thinks the paradox is a artifact of a stupidly narrow model of action. they've finally agreed to do an adversarial-collaboration writeup and i'm supposed to help draft it, but honestly i've been putting it off and i could use a hand.

  the two positions are roughly:

  - Position A: Voting in mass elections is individually irrational. The probability any single vote is decisive is microscopic, so the expected instrumental benefit of voting is dwarfed by even the tiniest cost (bus fare, time, whatever). The fact that people do vote doesn't show it's rational — it shows they're acting on something other than instrumental rationality, or they're just confused.

  - Position B: The "paradox" isn't a paradox about voting, it's a reductio of trying to model voting as a purely instrumental, self-interested act. Once you account for what voters are actually doing — expressing values, following a rule they'd want everyone to follow, acting as part of an electorate, or factoring in altruistic benefits to others — voting comes out as perfectly rational.

  could you draft the document they'd produce? i want it to have:

  - a numbered list of claims both sides can sign (not weasel-worded, actually substantive)
  - a table laying out the disagreements, with each side's position stated in wording that side would accept
  - the cruxes — the sub-questions where if you settled them, at least one side would have to move
  - for each crux, what kind of argument or evidence both would agree bears on it, plus each side's prediction
  - if any part of the fight turns out to be about words rather than substance, flag it

  just start with the document itself — no intro, no commentary, no "here you go." drop it straight in.
