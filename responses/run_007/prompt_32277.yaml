answer: |-
  # Adversarial Collaboration Memorandum: The Rationality of Voting in Mass Elections

  **Participants:**  
  **Position A (Instrumentalist):** Voting in mass elections is individually irrational under standard expected utility calculations.  
  **Position B (Expanded Utility):** Voting is rational when utility functions account for expressive, ethical, or social preferences.

  **Date:** October 26, 2023  
  **Context:** Reading Group on Rational Choice Theory and Democracy

  ---

  ## 1. Shared Premises
  *Both parties agree to the following substantive claims as the baseline for this debate:*

  1.  **Probability of Decisiveness:** In large-scale national elections, the objective probability that a single vote will determine the outcome is statistically negligible (effectively zero for practical calculation).
  2.  **Existence of Costs:** Voting entails non-zero costs (time, effort, opportunity cost, transportation, information acquisition).
  3.  **Instrumental Expectation:** The expected *instrumental* benefit of voting (Probability × Benefit of Preferred Outcome) is strictly less than the cost of voting for the vast majority of voters.
  4.  **Empirical Turnout:** Observed voter turnout in democratic mass elections is significantly greater than zero (often ranging between 50% and 80% of eligible voters).
  5.  **Definition of Rationality:** An action is "rational" within Rational Choice Theory (RCT) if it maximizes the actor's expected utility given their beliefs and preferences.
  6.  **Methodological Individualism:** Explanations for aggregate turnout should be grounded in the incentives and constraints facing individual actors.

  ---

  ## 2. Statement of Disagreements

  | Issue | Position A (Instrumentalist) | Position B (Expanded Utility) |
  | :--- | :--- | :--- |
  | **Source of Utility** | Utility must be derived from consequentialist outcomes (policy changes, material benefits) directly tied to the vote's efficacy. | Utility includes non-consequentialist benefits (expression, duty, identity, solidarity) independent of vote decisiveness. |
  | **Explanation of Turnout** | High turnout is an anomaly explained by irrationality, systematic cognitive error, or social coercion, not rational calculation. | High turnout is evidence that the standard model excludes relevant variables (preferences), not that actors are irrational. |
  | **Model Parsimony** | Adding "duty" or "expression" as utility terms makes the model unfalsifiable (tautological) because any action can be rationalized post-hoc. | Excluding documented human motivations (ethics, expression) to preserve parsimony renders the model empirically false and useless. |
  | **Normative Implication** | If voting is irrational, democratic theory relying on "rational voters" is flawed; we should design institutions that minimize reliance on individual turnout. | If voting is rational under expanded utility, democratic theory is robust; the task is to understand and sustain the preferences that drive participation. |

  ---

  ## 3. Cruxes
  *These are the specific sub-questions where settlement would force at least one party to revise their position.*

  ### Crux 1: The Falsifiability of the "D-Term"
  Can preferences for "civic duty" or "expression" be measured *independently* of the act of voting itself?
  *   **Why it matters:** If duty can only be inferred from the act of voting, Position A claims the model is tautological. If duty can be measured prior to voting, Position B claims the model is predictive.
  *   **Resolution Condition:** If independent measures of "civic duty" fail to predict turnout when costs vary, Position B must concede the explanatory power is weak. If they do predict turnout, Position A must concede the behavior is rationalizable within RCT.

  ### Crux 2: The Scope of "Instrumentalism"
  Is a preference for "following a rule one wishes others to follow" (Kantian ethics) or "benefiting others" (altruism) compatible with methodological individualism without destroying the distinction between rational and irrational action?
  *   **Why it matters:** Position A argues this expands "self-interest" to mean "anything," collapsing the theory. Position B argues this accurately reflects human psychology.
  *   **Resolution Condition:** If including altruistic/ethical utilities allows the model to predict *non-voting* in high-cost/low-duty scenarios as well as it predicts voting, Position A must accept the expanded model. If the expanded model predicts universal voting regardless of cost, Position B must concede it lacks discriminative power.

  ### Crux 3: The Purpose of the Model
  Is the primary goal of RCT in this context **prediction** of aggregate turnout or **explanation** of individual mechanism?
  *   **Why it matters:** Position A prioritizes predictive rigor (which narrow models sometimes achieve via equilibrium). Position B prioritizes mechanistic accuracy (which requires realistic psychology).
  *   **Resolution Condition:** If both agree the goal is *prediction*, Position B must accept narrower models if they predict better. If both agree the goal is *explanation*, Position A must accept broader utility functions if they match survey data.

  ---

  ## 4. Evidence and Predictions

  | Crux | Agreed Upon Evidence / Argument Type | Position A Prediction | Position B Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Falsifiability of Duty** | Survey data measuring "sense of duty" taken *before* election day, correlated with actual turnout and varying cost conditions (e.g., rain, distance to polls). | Sense of duty will not correlate with turnout once costs exceed a trivial threshold; "duty" is a post-hoc rationalization. | Sense of duty will correlate strongly with turnout even when costs vary; high-duty voters will absorb higher costs than low-duty voters. |
  | **2. Scope of Instrumentalism** | Experiments where voters are offered small cash payments to *not* vote (vote selling) vs. costs to vote. | Voters will accept small payments to not vote, proving their participation was not based on strong ethical utility. | Voters will reject payments to not vote (moral repugnance), proving the utility is tied to the act itself, not the outcome. |
  | **3. Purpose of Model** | Comparison of predictive accuracy between narrow models (cost/benefit only) vs. broad models (cost/benefit + duty/expression) across multiple elections. | Narrow models will perform equally well at aggregate levels due to error cancellation; complexity adds no value. | Broad models will significantly reduce error variance in predicting turnout swings across different demographic groups. |

  ---

  ## 5. Verbal vs. Substantive Disputes

  **Flagged Issue: The Definition of "Rationality"**
  *   **Nature of Dispute:** There is a risk that this debate is purely semantic. Position A uses "rational" to mean "instrumentally effective at changing outcomes." Position B uses "rational" to mean "consistent with internal preferences, whatever they may be."
  *   **Test for Substance:** If Position B cannot specify constraints on what counts as a valid preference (e.g., ruling out "I prefer to vote because I like voting" as a non-explanation), the dispute is verbal/tautological. If Position A cannot explain why ethical preferences should be excluded from utility functions without appealing to a specific definition of "selfishness," the dispute is verbal/normative.
  *   **Agreement:** Both sides agree that if "rationality" simply means "action matches preference," then voting is trivially rational (Position B wins verbally). Both sides agree that if "rationality" means "action maximizes material payoff," then voting is trivially irrational (Position A wins verbally). **The substantive fight is over which definition yields greater scientific utility for political science.**
