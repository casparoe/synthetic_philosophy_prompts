answer: |-
  This is a classic philosophical stalemate, and your frustration is well-founded. The literature on moral testimony has reached a point of diminishing returns because the participants are often arguing past one another on different registers. Your working theory—that this is actually three debates wearing one coat—is remarkably close to the mark, but I would refine it slightly.

  The disagreement is not merely multidimensional; it is **structurally heterogeneous**. The pessimists and optimists are often prioritizing different normative values, operating with different conceptions of moral psychology, and using key terms (like "understanding" and "deference") in ways that are stipulative rather than neutral.

  Here is a diagnosis of the impasse, a breakdown of what is actually settled versus contested, and concrete suggestions for how your group might generate progress.

  ### 1. Diagnosis: What Kind of Disagreement Is This?

  It is not simply a substantive disagreement about a single proposition. It is a **cluster disagreement** involving three distinct layers that are rarely disentangled in the papers you are likely reading.

  #### A. The Conceptual Layer (Verbal/Stipulative)
  A significant portion of the stalemate is verbal, specifically regarding the definition of **moral understanding**.
  *   **Pessimists** (e.g., Hills, Hopkins) often define moral understanding as *grasping the reasons* why a claim is true. If you define knowledge this way, then by stipulation, testimony (which transmits belief without necessarily transmitting the grasp of reasons) cannot yield moral understanding.
  *   **Optimists** (e.g., Jones, McGrath) often define knowledge in reliabilist terms (true belief produced by a reliable process). If you define it this way, testimony is a reliable process, so it yields knowledge.
  *   **The Impasse:** When pessimists say "You lack knowledge," they mean "You lack understanding." When optimists say "You have knowledge," they mean "You have justified true belief." They are talking past each other because they haven't agreed on whether *understanding* is a necessary condition for *moral knowledge* or merely a distinct, higher-order good.

  #### B. The Normative Layer (Value Clash)
  This is the substantive core. The two camps prioritize different moral/epistemic values.
  *   **Pessimists prioritize Moral Autonomy and Integration.** They argue that moral belief is not just about tracking truth; it is about being a certain kind of agent. To be morally good, your actions must spring from your own grasp of the good. Deference creates a fracture between your will and the moral truth.
  *   **Optimists prioritize Epistemic Humility and Accuracy.** They argue that getting the moral truth right is the primary duty. If you are bad at moral reasoning and an expert is good, refusing to defer is arrogance that leads to worse moral outcomes.
  *   **The Impasse:** There is no agreed-upon exchange rate between *Autonomy* and *Accuracy*. Pessimists think Autonomy trumps Accuracy in the moral domain; Optimists think Accuracy trumps Autonomy (or that Autonomy is overrated).

  #### C. The Empirical/Psychological Layer
  This is the layer your group has likely touched on least, yet it drives the intuitions.
  *   **The Existence of Experts:** Pessimists often argue (implicitly or explicitly) that moral expertise is fundamentally different from scientific expertise because moral reasons must be *appreciated* to be effective. Optimists assume moral expertise is analogous to other forms of expertise.
  *   **The Psychology of Deferral:** There is an unstated empirical claim about what happens psychologically when we defer. Pessimists assume deference creates "alienation" from the belief. Optimists assume deference is psychologically seamless (like trusting a doctor).
  *   **The Impasse:** Armchair philosophy cannot settle whether moral deference *actually* causes alienation or whether moral experts are *actually* reliable.

  ### 2. Settled vs. Contested Claims

  To help your group map the terrain, here is a breakdown of where the literature actually stands.

  **Genuinely Settled (or Near-Consensus):**
  1.  **The Asymmetry Intuition:** Almost everyone agrees there is *some* intuitive weirdness in moral deference that is less present in non-moral deference (e.g., the "boiling point of tungsten" vs. "abortion is wrong" case). The debate is about the *source* and *significance* of this weirdness, not its existence.
  2.  **Truth-Tracking:** Both sides agree that deference can lead to *true* moral beliefs. The pessimist does not deny that the deferrer ends up believing the truth; they deny the *status* or *value* of that belief.
  3.  **The Value of Understanding:** Both sides agree that moral understanding (grasping reasons) is *good*. The disagreement is whether it is *necessary* for justified belief/action, or just a valuable bonus.
  4.  **Pure vs. Impure:** There is consensus that "impure" deference (where you get some reasons but not all, or you trust the person to explain later) is less problematic than "pure" deference (blind acceptance of the verdict).

  **Deeply Contested:**
  1.  **The Unavailability Thesis:** Is moral knowledge *unavailable* via testimony (Pessimism), or just *harder to get* (Optimism)?
  2.  **The Source of the Norm:** Is the prohibition on deference an *epistemic* norm (you don't know), a *moral* norm (you shouldn't outsource conscience), or a *pragmatic* norm (it doesn't help you act)?
  3.  **Moral Motivation:** Does believing a moral proposition without understanding the reasons motivate action in the same way? (Internalists tend toward pessimism; Externalists tend toward optimism).
  4.  **The Scope:** Does the problem apply to *all* moral beliefs, or only "contested" or "fundamental" ones? (e.g., Is it okay to defer on tax policy morality but not on the value of human life?)

  ### 3. How to Make Progress

  If your group wants to move beyond the stalemate, you need to stop asking "Who is right?" and start asking "Under what conditions does each view hold?" Here are four specific moves to unstick the discussion.

  #### A. Shift from "Belief" to "Action"
  Most literature focuses on *moral belief*. Try shifting the focus to *moral action*.
  *   **The Question:** Can you act *virtuously* based on deferred belief?
  *   **Why it helps:** A pessimist might concede you can have a "true belief" via testimony but argue you cannot act *praiseworthily* on it. An optimist might argue that if the action helps the victim, the internal state matters less. This forces the group to clarify whether the problem is about *truth* or *virtue*.

  #### B. Distinguish "Initial Formation" from "Maintenance"
  The literature often treats deference as a one-off event. Break it down temporally.
  *   **The Distinction:** Is it problematic to *initially* adopt a belief via testimony, or to *maintain* it indefinitely without seeking reasons?
  *   **Why it helps:** Optimists often win on initial formation (I need to know *now* if this is safe). Pessimists often win on maintenance (I cannot remain a moral agent if I never seek the reasons). A hybrid view might emerge: Deference is permissible as a placeholder, but there is a duty to seek understanding eventually.

  #### C. Test the "Expertise" Assumption Empirically
  Your group is likely treating "moral expert" as a philosophical placeholder.
  *   **The Move:** Ask: "Who exactly are we deferring to?"
  *   **Why it helps:** If the "expert" is a saint, deference seems more acceptable. If the "expert" is a philosopher or a committee, it seems less so. The pessimist's case is strongest when the expert's authority is institutional; the optimist's case is strongest when the expert's authority is based on demonstrated wisdom. Disaggregating the *type* of expert might dissolve the intuition pump.

  #### D. The "Partial Deference" Middle Ground
  Stop treating deference as binary (all or nothing).
  *   **The Move:** Explore cases of **weighted deference**. I believe *p* because the expert says so, but I assign a lower confidence level than if I derived it myself, and I remain open to revision.
  *   **Why it helps:** This avoids the "outsourcing conscience" charge (I am still monitoring the belief) while accepting the "epistemic humility" argument (I acknowledge my limitations).

  ### Summary Recommendation for the Group

  Your diagnosis is correct: this is several questions under one heading. To break the deadlock, I recommend you **suspend the question of "Knowledge"** for one session.

  Instead, ask: **"What is the function of moral judgment?"**
  *   If the function is **coordination and truth-tracking**, the Optimists win.
  *   If the function is **character formation and autonomy**, the Pessimists win.

  The literature is stuck because it tries to answer the epistemic question ("Can I know?") without settling the functional question ("What is morality *for*?"). If your group can identify which functional view they each hold, you will realize you aren't disagreeing about testimony; you are disagreeing about the point of morality itself. That is a much more productive fight.
