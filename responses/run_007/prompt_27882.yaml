answer: |-
  This is a classic problem in the philosophy of science, but your specific list of verdicts reveals a coherent, albeit unstated, heuristic. You aren't applying a single rule like "predictive power" or "transparency." Instead, you are applying a **two-part test regarding the *function* of the assumption and the *status* of the conclusion.**

  Here is the principle you are implicitly running, followed by the tensions it resolves, the verdict it forces you to revise, and its application to your new case.

  ### The Principle: Instrumental Baselines vs. Ontological Claims

  Your implicit rule distinguishes between models that use unrealistic assumptions as **tools** (to calculate, to bound, or to approximate) and models that use unrealistic assumptions as **foundations** (to explain mechanism or define reality).

  **Assumptions are "Fine" when:**
  1.  **Tractability/Necessity:** The assumption is made because the alternative is computationally or physically impossible *right now* (Ideal Gas, Climate, Frictionless).
  2.  **Null/Benchmark:** The model is explicitly a counterfactual baseline used to measure deviation (Hardy-Weinberg, Modigliani-Miller *as theorem*).
  3.  **Phenomenological Proxy:** The assumption is an "as-if" shortcut that successfully predicts *outcomes* without claiming to describe *internal processes* (Friedman, Black-Scholes *for pricing*).

  **Assumptions are "Not Fine" when:**
  1.  **Causal Loading:** The unrealistic assumption is the primary engine driving the result, such that relaxing it collapses the conclusion (Rational Expectations).
  2.  **Reification:** The model's counterfactual conclusion is treated as a description of reality rather than a benchmark (EMH, Modigliani-Miller *in policy*).

  ### Resolving Your Tensions

  **1. Friedman's Billiard Player vs. Rational Expectations**
  This is your biggest cognitive dissonance, but the principle resolves it cleanly.
  *   **Friedman (Fine):** This is a **Phenomenological Proxy**. You don't care *how* the player knows where to hit the ball; you care *where* the ball goes. The assumption of "calculation" is a proxy for "skill." It predicts the *trajectory*, not the *neuroscience*.
  *   **Rational Expectations (Not Fine):** This is a **Causal Claim**. RE doesn't just predict inflation; it claims the equilibrium *exists because* agents know the true model. The assumption isn't a proxy for skill; it's a claim about information processing that is impossible in aggregate. As you noted, the falsification drives the results. If agents learn rather than know, the equilibrium often vanishes.
  *   **The Fix:** You accept Friedman because it is *instrumentalist* (predicts output). You reject RE because it is *realist* (claims to explain the mechanism of equilibrium via impossible knowledge).

  **2. Modigliani-Miller vs. Efficient Market Hypothesis**
  *   **Modigliani-Miller (Fine/Not Fine):** You already have the right intuition here. MM is a **Null/Benchmark**. It says, "In a frictionless vacuum, capital structure doesn't matter." That is a true theorem about a hypothetical world. It becomes "Not Fine" only when reified into policy (ignoring taxes/frictions).
  *   **EMH (Not Fine):** EMH started as a benchmark but hardened into an **Ontological Claim**. It was treated as "Prices *are* right," rather than "Prices are hard to beat." Because it was treated as a description of reality, the unrealistic assumption (perfect information processing) was shielded from critique.
  *   **The Fix:** Your verdicts are consistent. MM is a theorem; EMH became a dogma.

  ### The Verdict You Must Revise

  To fully align with this principle, you need to tighten your view on **Case 8: Climate Models.**

  You currently give them a pass based on **Necessity** ("What else are you supposed to do?"). This fits the "Tractability" branch of your principle. However, you note that the parameterizations "affect the projections."
  *   **The Conflict:** If the cloud parameterization is a "rough approximation" that significantly shifts the sensitivity of the model, it moves from a *tractability enabler* (like frictionless planes) to a *causal loader* (like Rational Expectations).
  *   **The Revision:** You must treat Climate Models with the same epistemic humility as Modigliani-Miller. They are fine as **exploratory baselines** (showing directionality or physical bounds), but they are **not fine** if their specific quantitative projections are treated as precise predictions without acknowledging that the "rough parameterization" is doing heavy lifting on the final number.
  *   **Why:** In Ideal Gas, adding volume (van der Waals) corrects the pressure slightly. In Climate, if the cloud feedback loop is parameterized crudely, it can flip the sign of the feedback or double the sensitivity. That makes it structurally similar to Rational Expectations, where the assumption drives the magnitude of the result. You can keep the verdict "Fine," but only if you downgrade the *status of the output* from "forecast" to "projection under specific parameter assumptions."

  ### The New Case: Agent-Based Models (ABM) in Epidemiology

  **Case:** *Agent-based models in epidemiology that assume every individual follows identical simple interaction rules.*

  **Verdict:** **Fine, with a strict caveat.**

  **Application of the Principle:**
  1.  **Tractability:** Simulating 330 million unique humans is impossible. Identical rules are a **Necessity**.
  2.  **Null/Benchmark:** If the model is used to show *emergent properties* (e.g., "even with simple rules, we see superspreading"), it is a **Benchmark**. It tells you what is *possible* given the network structure.
  3.  **The Risk (Reification):** If the model is used to claim *this is exactly how the virus will spread* and policy is locked in based on the specific curve, it violates the principle. Humans do not follow identical rules; behavior changes (masking, distancing) based on risk perception.
  4.  **Comparison to Rational Expectations:** If the ABM assumes agents *do not react* to the infection rate (fixed rules), it is a **Causal Loader** that will fail (similar to RE). If the ABM includes adaptive rules (agents react to local infection), it moves closer to **Friedman's Billiard Player** (predicting aggregate outcome via simple heuristics).

  **Conclusion:** The model is **Fine** as an exploratory tool to understand network topology and potential tipping points (Instrumental Baseline). It is **Not Fine** if the identical rules are treated as a realistic description of human behavior used for precise long-term forecasting (Ontological Claim).

  ### Summary of Your Coherent Position

  You are a **Critical Instrumentalist**.

  You believe models are maps, not territories. Unrealistic assumptions are the price of admission for making a map.
  *   You accept the price when the map is labeled "Sketch" (Frictionless), "Vacuum Test" (MM), or "Navigation Aid" (Friedman).
  *   You reject the price when the map is sold as "Satellite Imagery" (EMH, RE) or when the distortion from the assumptions is large enough to render the navigation dangerous (Climate sensitivity, Policy MM).

  Your inconsistency was not in the verdicts, but in failing to articulate that **the acceptability of the assumption depends on the claim being made by the modeler.** Rational Expectations isn't inherently evil; it's evil when used to explain *why* markets clear rather than to solve a DSGE model for fun. Modigliani-Miller isn't inherently true; it's useful only when kept in the vacuum.
