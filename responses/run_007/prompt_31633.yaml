prompt: |-
  You are a professional philosopher specializing in personal identity and philosophy of mind. I'm teaching an undergrad course on philosophy of mind and next week we're doing personal identity, specifically the whole mind-uploading / gradual-replacement cluster. I want to give them a handout that's a decision tree — start from "here's a scenario, what's your intuition" and by the end they land on a named position. The idea is they figure out what they actually believe from the cases, not from which label sounds cool.

  I want the tree built around the Ship of Theseus-style gradual replacement thought experiment: suppose we replace your neurons one at a time with functionally identical silicon chips, and at the end there's a silicon brain running your mind. (Or maybe we upload you by scanning and destructively copying — different branch.) The positions I want as leaves are at least: psychological continuity theory (with and without the no-branching clause), biological continuity / animalism, the narrative / self-constitution view, and something like "the question is confused / there's no fact of the matter." If there's a natural leaf for "only the original is you, period" (some kind of substance dualism or brute haecceity view) that's fine too.

  Each branch node should be a concrete question about a case — not "do you endorse psychological criterion B?" but something like "after the procedure, the original biological brain is kept alive but unconscious. who, if anyone, is you?" 

  Important: flag any two positions your tree can't cleanly separate with the cases you've got, and note any logical-combination leaves that are empty (nobody defends that combination) and briefly say why — is it incoherent, just unattractive, or unexplored?

  The audience is smart undergrads who've done a few weeks of philosophy of mind but haven't read Parfit or anyone on this topic yet. The tree should fit on two sides of a single sheet of paper.

  Please think through the logical space carefully — start from the branching questions and the possible combinations of answers, then map the named positions onto that space, rather than starting from the labels and trying to split them apart. Also, for each leaf, give me one sentence on the most awkward thing that position has to swallow — the bullet they're biting.

  I want you to flag how confident you are in the overall taxonomy and single out the one branching decision or leaf assignment you're least sure about. Write in American English, and don't make it sound like a textbook. A typo or two is fine, it's a handout draft.
