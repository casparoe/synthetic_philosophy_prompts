answer: |-
  # PERSONAL IDENTITY: WHERE DO YOU STAND?
  **A Decision Tree for the Mind-Uploading Cluster**

  **START HERE: The Slow Swap**
  Imagine we replace your neurons one-by-one with functionally identical silicon chips over ten years. You feel fine throughout. At the end, you have a silicon brain but remember everything.
  **Q1: Is the person at the end of the process *you*?**

  *   **NO** → Go to **Branch A** (You didn't survive the swap).
  *   **YES** → Go to **Branch B** (You survived the swap).
  *   **INDETERMINATE / VAGUE** → **Leaf 1: No Fact of the Matter**
      *   *The Bullet:* There is no truth about whether you survive certain medical procedures.

  ---

  ### BRANCH A (No, Silicon isn't you)
  **Q2: Suppose we stop the swap halfway. The biological body is kept alive but unconscious. Is *that* organism you?**

  *   **YES** → **Leaf 2: Biological Continuity (Animalism)**
      *   *The Bullet:* You survive total brain destruction as long as your body breathes.
  *   **NO** → **Leaf 3: Substance Dualism / Brute Haecceity**
      *   *The Bullet:* You are a ghostly essence that vanishes when biology changes.

  ---

  ### BRANCH B (Yes, Silicon is you)
  **The Branching Case:** Now imagine we scan you to create the Silicon Person, but we *don't* destroy the Original Biological You. Both wake up.
  **Q3: Who is you?**

  *   **ONLY THE ORIGINAL** → **Leaf 4: Psychological Continuity (No-Branching Clause)**
      *   *The Bullet:* You cease to exist if a perfect copy is made, even if you survive.
  *   **ONLY THE COPY** → **[EMPTY LEAF]** (See notes below).
  *   **BOTH ARE ME** → **Leaf 5: Psychological Continuity (Branching Allowed)**
      *   *The Bullet:* You are literally two people at once (identity logic gets weird).
  *   **NEITHER / QUESTION IS WRONG** → **Q4: What actually matters?**
      *   *"Survival matters, identity doesn't"* → **Leaf 6: Reductionism (Parfitian)**
          *   *The Bullet:* You don't survive, but someone exactly like you does (and that's enough).
      *   *"Depends on which life-story holds together"* → **Leaf 7: Narrative / Self-Constitution**
          *   *The Bullet:* You can literally write yourself into or out of existence.

  ---

  ### INSTRUCTOR NOTES (DRAFT)

  **1. Positions the tree can't cleanly separate:**
  *   **Narrative vs. Reductionism:** Both land on "Identity doesn't hold in branching." The tree separates them by *why* (story vs. survival), but in practice, students often conflate the two. Narrative is technically a metaphysical claim about constitution, while Reductionism is about what matters, but they look identical in this test.
  *   **Substance Dualism vs. Animalism:** Both say "No" to the Silicon Swap. The tree separates them via the unconscious body case, but some Dualists might claim the soul stays with the body anyway, muddying Q2.

  **2. Empty / Incoherent Leaves:**
  *   **"Only the Copy" (Branch B):** Almost no one defends this. It requires believing the original ceases to exist *because* a copy was made, but that the copy inherits identity despite being causally secondary. It's logically possible but unattractive/unexplored.
  *   **Biological + Psychological:** You can't be both in the Slow Swap case (since one says Yes, one says No). The tree forces a choice.

