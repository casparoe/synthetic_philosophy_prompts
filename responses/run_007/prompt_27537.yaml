answer: |-
  Here is the specification of the desiderata for a decision theory adequate to handle the Pasadena and Altadena games, followed by the analysis of their compatibility.

  ### The Desiderata

  An adequate theory must provide a valuation function $V$ (or a preference relation $\succeq$) over gambles. The following five principles are the standard candidates for the core requirements.

  **1. Finite Agreement (Standard EU Recovery)**
  *   **Specification:** For any gamble with finite support, or any gamble where the expectation sum converges absolutely, the theory must assign the standard Expected Utility value.
  *   **Argument:** Any deviation here breaks continuity with established decision theory and arithmetic. If a theory cannot handle the finite cases correctly, it lacks face validity. This anchors the theory to standard probability calculus.

  **2. Statewise Dominance**
  *   **Specification:** If gamble $A$ yields a payoff at least as high as gamble $B$ in every possible state, and strictly higher in at least one state with non-zero probability, then $A \succ B$.
  *   **Argument:** This is the minimal requirement of rationality. If you know $A$ will perform better than $B$ no matter what happens, preferring $B$ (or being indifferent) constitutes a sure loss of utility. In your specific case: Altadena ($A$) pays exactly £1 more than Pasadena ($P$) in every state. Therefore, $A \succ P$ is non-negotiable.

  **3. Description Invariance (Permutation Invariance)**
  *   **Specification:** The value of a gamble must not depend on the labeling or ordering of the states. If two descriptions refer to the same probability space and payoff mapping (up to a bijection of state indices), they must receive the same value.
  *   **Argument:** The "states" (e.g., "first heads on toss $n$") are ontological features of the world; the indices ($n=1, 2, 3...$) are descriptive tools. A rational valuation should depend on the *outcomes*, not the *order in which the accountant lists them*. Mathematically, this requires the expectation sum to be independent of the order of summation.

  **4. Completeness (Value Definiteness)**
  *   **Specification:** The theory must assign a determinate value (or a determinate preference ranking) to every well-defined gamble. "Undefined" is not an acceptable output for a decision guide.
  *   **Argument:** Decision theory is a guide to action. If an agent faces a choice between Pasadena and a sure £0, and the theory returns "Undefined," the agent is paralyzed. Pragmatists argue rationality requires a verdict, even in pathological cases.

  **5. Additivity (Constant Shift)**
  *   **Specification:** $V(X + c) = V(X) + c$ for any constant $c$. Adding a sure amount to every payoff shifts the value by exactly that amount.
  *   **Argument:** This captures the linearity of utility in money (assuming risk neutrality over the added constant) and separates the *risk* of the gamble from the *baseline* endowment. It ensures that the valuation of the "noise" (Pasadena) is distinct from the valuation of the "sure thing" (the extra pound).

  ---

  ### The Incompatibility Result

  You suspected a conflict between Dominance and Additivity. Strictly speaking, **Dominance and Additivity are logically compatible** ($x+1 > x$ holds for all real $x$). The conflict arises when you introduce **Description Invariance** and **Completeness** into a context of **Conditional Convergence**.

  Here is the worked-out impossibility for the Pasadena/Altadena pair:

  1.  **The Mathematical Fact:** The expectation of the Pasadena game is the alternating harmonic series $\sum \frac{(-1)^{n-1}}{n}$. This series is *conditionally* convergent. By the Riemann Rearrangement Theorem, for any real number $L$ (including $\pm \infty$), there exists a reordering of the terms that sums to $L$.
  2.  **The Invariance Violation:** Reordering the terms of the sum corresponds to re-indexing the states (relabeling which toss count is called "1", "2", etc.). If **Description Invariance** holds, the value must be the same regardless of this re-indexing. However, since different reorderings yield different sums, no unique real number satisfies Invariance.
  3.  **The Completeness Violation:** To satisfy Invariance, the theory must refuse to assign a specific real number. It must declare the value **Undefined**. This violates **Completeness**.
  4.  **The Dominance Violation:** If the theory declares both Pasadena and Altadena "Undefined" to save Invariance, it typically fails to rank them. Yet Altadena dominates Pasadena state-by-state. If the theory cannot say $A \succ P$, it violates **Statewise Dominance**.
  5.  **The Additivity Nuance:** If you try to save Completeness by picking a specific summation order (e.g., natural order), you assign $V(P) = \ln 2$ and $V(A) = \ln 2 + 1$. This satisfies Additivity and Dominance *for that specific ordering*. But it violates **Description Invariance**, because a different ordering would yield $V(P) = 100$ and $V(A) = 101$, changing the absolute value of the gamble without changing the physical payoffs.

  **The Trilemma:** You cannot jointly satisfy **Description Invariance**, **Completeness**, and **Statewise Dominance** for conditionally convergent gambles.
  *   Keep Invariance + Completeness $\rightarrow$ You must assign a value, but no value is invariant $\rightarrow$ Contradiction.
  *   Keep Invariance + Dominance $\rightarrow$ You must say "Undefined" (to avoid arbitrary values), but then you cannot rank $A$ over $P$ $\rightarrow$ Violates Dominance.
  *   Keep Completeness + Dominance $\rightarrow$ You must pick an order to get a value, but then value depends on description $\rightarrow$ Violates Invariance.

  ### Camp Preferences vs. Non-Negotiables

  *   **Non-Negotiable:** **Statewise Dominance** is the hardest principle to drop. Denying that a gamble paying £1 more in every state is better looks like a failure of rationality, not just a technical adjustment. **Finite Agreement** is also effectively non-negotiable; a theory that breaks standard arithmetic is useless.
  *   **Camp Preference:** **Completeness** is the main divider.
      *   *Pragmatists (e.g., some decision theorists):* Insist on Completeness. They are willing to sacrifice Invariance (accepting that value depends on how the problem is framed/indexed) or weaken Dominance.
      *   *Purists (e.g., many mathematicians/philosophers):* Accept that some gambles are **Undefined**. They sacrifice Completeness to save Invariance and Dominance (by arguing that if values are undefined, the preference relation can still hold via a separate mechanism, or by accepting that rational choice is indeterminate here).
  *   **Camp Preference:** **Additivity**. While intuitive, some proposed fixes (like certain truncation methods) violate linearity to preserve convergence. This is usually seen as a cost, not a fatal blow, whereas violating Dominance is fatal.

  ### The Single Most Constraining Requirement

  **Description Invariance** does the most work in ruling out candidates.

  Almost every proposed "fix" (Cesàro summation, Abel summation, principal values, weak expectations) works by imposing a specific *method* of summation. Every specific method privileges a specific ordering or grouping of states.
  *   If you propose "Use the natural order," you violate Invariance.
  *   If you propose "Use the average of all rearrangements," the average is undefined for conditionally convergent series.
  *   If you propose "Weak Expectation" (convergence in probability), you often sacrifice Statewise Dominance (as shown by Easwaran), because a gamble can dominate state-by-state yet have the same weak expectation.

  Invariance is the constraint that forces the value to be "Undefined." Once you accept "Undefined," you are forced to choose between abandoning Completeness or engineering a complex preference relation that bypasses values to save Dominance.

  ### Scorecard of Proposals (Brief)

  *   **Standard Expectation:** Verdict: **Undefined**. Saves Invariance and Dominance (by refusing to value), fails Completeness.
  *   **Weak Expectation (Easwaran):** Verdict: **Defined** (convergence in probability). Saves Completeness, but **violates Statewise Dominance** (Altadena and Pasadena can have the same weak expectation).
  *   **Truncation / Principal Value:** Verdict: **Defined**. Saves Completeness, but **violates Description Invariance** (value shifts if you reorder the states before truncating).

  ### Summary Recommendation
  If you must hold **Statewise Dominance** (Altadena > Pasadena) and **Finite Agreement**, you are forced to abandon either **Completeness** (accept that the value is undefined) or **Description Invariance** (accept that the value depends on the indexing of the states). There is no mathematical reconciliation for conditionally convergent series that preserves all three. Your "nagging sense" about the pound shift was close: the shift works *if* values exist, but the requirement that values *must* exist (Completeness) is what breaks the system when combined with Invariance.
