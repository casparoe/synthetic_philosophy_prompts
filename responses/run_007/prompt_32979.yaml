  2.  **Deconstruct the Arguments (Philosophical Mapping):**
      *   **Sam's Position:** This is essentially the *Indeterminacy of Function* objection. It's closely related to Fodor's original critique but pushed back to the etiological basis. It echoes Quine's "gavagai" or Goodman's "grue" applied to selection. Key reference: Godfrey-Smith (1991), Neander (responses), perhaps Fodor's "Psychosemantics". The core worry is that selection selects for *correlations*, and correlations are abundant/ubiquitous. Why is the function *detecting flies* and not *detecting food* or *detecting small black things*? If the content is determined by the function, and the function is indeterminate, the content is indeterminate.
      *   **Leah's Position:** This is the *Causal/Realist* defense. It aligns with Millikan's "Pushmi-Pullyu" representations or Neander's etiological account. The claim is that the *world* determines the cause, not our description. If the organism consumed *Musca domestica*, then that is the cause. This relies on a robust realism about natural kinds and causal relations. Key reference: Millikan (1984, 1989), Neander (1995), Papineau.
      *   **The Impasse:** Sam thinks Leah is smuggling in intentionality by picking the "right" description of the cause. Leah thinks Sam is falling into a skeptical trap that would undermine all science/causation.

