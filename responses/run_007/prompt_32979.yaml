  6.  **Final Polish:** Organize into the three requested sections. Add a bibliography/recommended reading list for a PhD student. (Millikan, Neander, Fodor, Godfrey-Smith, Shea).

  7.  *(Final thought before generating)*: Make sure to emphasize that Sam's argument is essentially the *Quinean Indeterminacy* applied to biology, while Leah's is *Scientific Realism*. The resolution often lies in *Consumer Semantics*.

