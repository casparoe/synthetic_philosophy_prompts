  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Prompt:**
      *   **Claim:** Lewis's theory of convention is fundamentally incapable of explaining norm change. This is not a gap but a structural flaw (wrong picture).
      *   **Core Argument:** Lewis models conventions as equilibria in coordination games (common knowledge, stable regularity, shared expectations). Norm change is messy, indeterminate, lacks common knowledge, and involves strategic ambiguity during transition. Therefore, Lewis describes "frozen equilibria," not living conventions.
      *   **Implication:** If it can't explain birth, shift, or death of conventions, it fails as a theory of convention (language, law, social norms).
      *   **Requirements:** Make the strongest case, anticipate/respond to objections, engage seriously with Lewis's actual text (precedent, past conformity), and address whether this is specific to Lewis or general to equilibrium accounts.

  2.  **Deconstruct Lewis's Theory (Mental Sandbox):**
      *   *Convention:* A regularity $R$ in population $P$ in circumstance $C$.
      *   *Conditions:* Everyone conforms, everyone expects everyone to conform, everyone prefers to conform *if* others conform (coordination problem), there is an alternative $R'$.
      *   *Common Knowledge:* Crucial. Everyone knows, everyone knows that everyone knows, ad infinitum.
      *   *Precedent:* Past conformity creates expectations for future conformity.
      *   *The "Freeze":* Lewis focuses on the *maintenance* of convention. How do we get from $R$ to $R'$? Lewis suggests salience or precedent, but does he explain the *process*?

  3.  **Develop the Core Argument (The "Messy Transition"):**
      *   Lewis's model is static/synchronic. It takes a snapshot of a stable state.
      *   Norm change is dynamic/diachronic.
      *   During change, the Lewisian conditions fail:
          *   *Regularity:* No longer universal (some do $R$, some do $R'$).
          *   *Expectations:* Fractured. I don't know what you expect.
          *   *Common Knowledge:* Impossible during transition. If we knew the new norm was the norm, it would already be the norm.
          *   *Coordination:* It's often a conflict game or assurance game during transition, not a pure coordination game.
      *   *Conclusion:* Lewis explains the *plateau*, not the *climb*. But a convention is defined by its history and trajectory, not just its plateau.

  4.  **Anticipate Objections (Steel-manning Lewis):**
      *   *Objection 1: Precedent.* Lewis talks about precedent. Salient solutions allow jumping to new equilibria.
          *   *Rebuttal:* Precedent explains the *selection* of a new equilibrium, not the *process* of getting there. It assumes the jump is instantaneous or ignores the friction.
      *   *Objection 2: Gradualism via Sub-populations.* Conventions can change locally first, then spread.
          *   *Rebuttal:* Lewis requires common knowledge within the population. If sub-populations differ, the global convention doesn't exist yet. The theory describes the end state, not the diffusion mechanism.
      *   *Objection 3: It's not supposed to explain change.* It's a functionalist account of *what a convention is*, not a sociological history.
          *   *Rebuttal:* If "what a convention is" excludes its temporal nature, the definition is inadequate. A river isn't a river if it doesn't flow.

  5.  **Address the "Equilibrium Generally" Question:**
      *   Is this just Lewis, or all Game Theory?
      *   Evolutionary Game Theory (EGT) tries to fix this (replicator dynamics).
      *   *Argument:* EGT helps, but Lewis's specific reliance on *Common Knowledge* and *Rational Choice* (rather than blind evolution) makes his specific account rigid. Lewisian agents are too hyper-rational to tolerate the ambiguity of transition.

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the contrast between the clean mathematical model and the messy social reality. State the thesis: Lewis offers a taxonomy of stability, not a theory of social practice.
      *   **The Lewisian Snapshot:** Briefly define Convention (Regularity, Expectation, Preference, Common Knowledge, Alternatives). Emphasize the "Common Knowledge" requirement as the anchor.
      *   **The Phenomenology of Change:** Describe how norms actually change (citation styles, email, dating). Highlight ambiguity, mixed strategies, and lack of common knowledge.
      *   **The Incompatibility:** Show point-by-point why the transition phase violates Lewis's conditions.
          *   No Regularity.
          *   Fractured Expectations.
          *   The Common Knowledge Paradox (you can't commonly know a new norm exists before it exists).
      *   **Engaging Lewis on Precedent:** Lewis uses precedent to solve the coordination problem.
          *   *Critique:* Precedent is backward-looking. It explains inertia. To explain change, you need a *break* in precedent. Lewis treats precedent as a focal point, but focal points don't explain the *cost* of moving.
      *   **The "Frozen Equilibrium" Charge:** If the theory only applies to stable states, it reifies conventions. It treats them as things rather than processes.
      *   **Objection Handling:**
          *   *Scope Objection:* "Lewis only defined the state, not the history." -> Response: A definition that excludes the life-cycle is defective.
          *   *Evolutionary Objection:* "EGT fixes this." -> Response: That abandons Lewis's rationalist/common knowledge framework.
      *   **Conclusion:** Summarize. The theory is a morphology of corpses, not a biology of life.

  7.  **Refining and Polishing:**
      *   *Tone:* Philosophical, rigorous, persuasive.
      *   *Key Terms:* Common Knowledge, Coordination Equilibrium, Precedent, Salience, Diachronic vs. Synchronic.
      *   *Check:* Did I address the "wrong picture" aspect? Yes, the picture of social life as a series of stable states rather than a flow.
      *   *Check:* Did I engage with Lewis's text? Need to reference *Convention* (1969), specifically the conditions and the discussion of precedent.

  8.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe Lewis allows for probabilistic expectations.
      *   *Correction:* Lewis is pretty strict on "almost everyone" and common knowledge. Probabilistic expectations weaken the coordination equilibrium definition. I should lean into the strictness of Common Knowledge as the breaking point.
      *   *Nuance:* Make sure not to say Lewis is *wrong* about stable conventions, but that his account is *incomplete* to the point of being a different category of thing.

  9.  **Final Review against Prompt:**
      *   Argue claim? Yes.
      *   Not just a gap, but wrong picture? Yes.
      *   Messy process vs. equilibrium jump? Yes.
      *   Engage Lewis on precedent/past conformity? Yes.
      *   Lewis vs. Equilibrium generally? Yes.

