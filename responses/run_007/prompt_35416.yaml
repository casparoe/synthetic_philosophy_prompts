answer: |-
  **Title:** The Morphology of Corpses: Why Lewisian Convention Cannot Account for Normative Change

  **Introduction**

  David Lewis's *Convention* (1969) is arguably the most influential account of social norms in analytic philosophy. By modeling conventions as solutions to coordination problems sustained by common knowledge and mutual expectations, Lewis provided a rigorous framework for understanding how arbitrary regularities acquire normative force. However, this rigor comes at a steep price. Lewis's theory is fundamentally synchronic; it offers a taxonomy of stability, not a biology of social practice. The central claim of this essay is that Lewis's theory is not merely incomplete regarding norm change—it is structurally incapable of describing it. This is not a gap to be filled but a symptom of a deeper error: Lewis models conventions as "frozen equilibria." By prioritizing the conditions of maintenance over the processes of emergence and transition, Lewis presents a picture of social life that is statically coherent but dynamically inert. If a theory of convention cannot explain how conventions live, move, and die, it fails to capture the phenomenon it purports to define.

  **The Lewisian Snapshot**

  To understand why Lewis's theory fails to handle change, we must first recognize the strictness of his conditions. For Lewis, a convention is a regularity $R$ in behavior within a population $P$ such that:
  1.  Everyone conforms to $R$.
  2.  Everyone expects everyone else to conform to $R$.
  3.  Everyone prefers to conform to $R$ on the condition that others do (a coordination equilibrium).
  4.  There is an alternative regularity $R'$ that could have served the same purpose.
  5.  These facts are *common knowledge* within $P$.

  The linchpin here is common knowledge. It is not enough that I know you will signal "left" when turning; I must know that you know that I know, ad infinitum. This epistemic structure creates a self-reinforcing loop of expectations that locks the population into an equilibrium. Lewis relies heavily on *precedent* to explain how we get into these equilibria: past conformity creates a salient focal point for future expectations.

  The problem is that this account is a description of a plateau. It describes what a convention looks like when it is successfully functioning. It treats the convention as a state of affairs rather than a process. As Lewis writes, precedent provides a "coordination device." But a device implies a mechanism already in place. Lewis explains how we stay coordinated, but his framework dissolves when we attempt to use it to explain how we move from one coordination point to another.

  **The Phenomenology of Transition**

  Consider the shift in academic citation practices. Twenty years ago, including a URL in a bibliography was often discouraged; today, it is mandatory for digital sources. During the transition period, there was no Lewisian convention. Some journals required URLs, some forbade them, and many authors were uncertain. Expectations were fractured: I might expect you to include a URL, but I also expect that you expect me to omit it to save space.

  This transitional phase is characterized by three features that directly violate Lewis's conditions:
  1.  **Lack of Regularity:** Behavior is mixed. There is no single $R$ that "everyone" conforms to.
  2.  **Strategic Ambiguity:** Agents often act ambiguously to hedge bets (e.g., including a URL but hiding it in a footnote), which contradicts the clear signaling required for common knowledge.
  3.  **Absence of Common Knowledge:** If it were common knowledge that the new norm was in force, the transition would be complete. If it were common knowledge that the old norm was still in force, the transition would not have started. The transition exists precisely in the epistemic gap where common knowledge is impossible.

  For Lewis, if these conditions are not met, there is no convention. But this implies that during the period of change—which can last years or decades—there is *no convention* governing the behavior. This is counterintuitive. We are still navigating a normative landscape; we are still subject to social pressure; we are still making mistakes. To say there is "no convention" during the shift is to say that a river ceases to be a river when it changes course. Lewis's theory forces us to say that conventions blink out of existence and pop back into being once the new equilibrium is settled. This is not an explanation of change; it is a denial of its continuity.

  **The Precedent Trap**

  A Lewisian defender might object by pointing to Lewis's discussion of precedent and salience. Lewis acknowledges that conventions can change if a new solution becomes salient. He argues that precedent is not absolute; a new precedent can override an old one if it becomes sufficiently prominent (e.g., a new technology or a decree from authority).

  However, this response conflates the *selection* of an equilibrium with the *process* of migration. Lewis explains why, if we are looking for a new solution, we might all pick $R'$ instead of $R''$. He does not explain how we coordinate the jump while the old equilibrium is still pulling us back. In a Lewisian world, agents are hyper-rational maximizers. If the old convention is still in place, deviating from it incurs a coordination cost (miscommunication). For the population to jump, a critical mass must deviate simultaneously to make the new deviation rational.

  But how is this critical mass coordinated without the very common knowledge that Lewis says defines the convention? If I deviate to the new norm, I risk being the only one doing so. Lewis's model suggests I should not deviate until I know you will deviate. But you are thinking the same thing. This is a deadlock. Lewis's reliance on precedent actually reinforces inertia. Precedent is backward-looking; it validates what *has* been done. To explain change, we need a mechanism that validates what *is being* done before it *has* been done. Lewis's rational agents, bound by the weight of past conformity, lack the resources to break the chain.

  **The "Frozen Equilibrium" Charge**

  This leads to the deeper charge: Lewis is not offering a theory of convention, but a theory of *institutional stability*. He has reified conventions into objects. By defining convention through the necessary and sufficient conditions of a stable state, he excludes the temporal dimension essential to social norms.

  Social norms are essentially diachronic. Their normativity often arises from the tension between the old and the new. Consider norms around dating communication. The shift from "waiting three days to call" to "texting immediately" wasn't a jump between two clean equilibria. It was a long period of social friction where "texting immediately" was interpreted differently by different sub-groups. During this time, the norm was not absent; it was contested.

  A theory that cannot describe contestation cannot describe normativity. If norms are only real when they are universally followed and commonly known, then the most interesting moments of social life—the moments where norms are negotiated, challenged, and reshaped—are rendered invisible. Lewis gives us a morphology of corpses: he can tell us a lot about a convention once it has settled and hardened, but he cannot tell us about the living practice. If philosophers reach for Lewis to explain language or law, they are reaching for a tool that can describe the grammar of a dead language but cannot explain how slang evolves into standard usage.

  **Objections and Replies**

  *Objection 1: The Scope Objection.*
  One might argue that Lewis never intended to explain the *dynamics* of change, only the *definition* of the state. Just as a definition of "water" ($H_2O$) doesn't need to explain the hydrological cycle, a definition of "convention" doesn't need to explain normative evolution.

  *Reply:* This distinction fails because conventions are essentially functional entities defined by their role in coordinating behavior over time. Water is a substance; convention is a practice. A practice is defined by its performance. If a theory of "dance" only described dancers frozen in mid-pose, it would fail to capture the essence of dance. Similarly, if a theory of convention excludes the temporal flow of adherence, it misidentifies the phenomenon. The "state" of convention is an abstraction from the flow of practice, not the practice itself.

  *Objection 2: The Evolutionary Game Theory (EGT) Objection.*
  Perhaps the problem is not with equilibrium analysis per se, but with Lewis's specific reliance on common knowledge and hyper-rationality. Evolutionary Game Theory models norms as stable states but uses replicator dynamics to explain transitions. Doesn't this save the equilibrium approach?

  *Reply:* This concedes the main point. Adopting EGT requires abandoning the core of Lewis's account: the reliance on *common knowledge* and *intentional rational choice*. Lewis's agents conform because they *know* others conform. EGT agents conform because successful strategies proliferate, often without knowledge or intent. If we must abandon common knowledge and rational expectation to explain change, then Lewis's specific theory is indeed incapable of the task. We would be replacing Lewis's theory, not fixing it. Furthermore, even EGT struggles with the "stasis problem," often requiring exogenous shocks to explain equilibrium shifts, which mirrors the Lewisian inability to generate endogenous change.

  *Objection 3: Sub-Populations.*
  Lewis allows for conventions to hold within sub-populations. Couldn't change be modeled as the new convention spreading from a sub-group to the whole?

  *Reply:* Lewis defines a convention relative to a population $P$. If $P$ is the whole society, and only a sub-group follows $R'$, then relative to $P$, there is no convention $R'$. There is merely deviance. For $R'$ to become the convention for $P$, the conditions must eventually be met for $P$. Lewis's theory describes the moment the sub-group becomes the majority, but it remains silent on the mechanism of that growth. It treats the expansion as a black box. The theory describes the *result* of the spread (the new equilibrium), not the *mechanism* of the spread.

  **Conclusion**

  David Lewis provided philosophy with a powerful lens for viewing social order. He showed us how arbitrary rules can bind us through mutual expectation. But in doing so, he cast social life in plaster. By making common knowledge and universal regularity necessary conditions for convention, Lewis rendered the theory blind to the messy, ambiguous, and indeterminate processes through which norms actually evolve.

  The inability to explain norm change is not a minor oversight; it indicates that the theory is built on the wrong picture of social reality. It pictures society as a series of static snapshots rather than a continuous film. It treats conventions as destinations rather than journeys. A theory of convention that cannot account for the birth, life, and death of norms is not a theory of convention at all. It is a theory of frozen equilibria. And while frozen equilibria are useful for analyzing stable institutions, they are useless for understanding the social world we actually inhabit—a world in flux, where the most important norms are often the ones currently being fought over. To understand convention, we need a theory that can tolerate ambiguity, not one that requires it to vanish.
