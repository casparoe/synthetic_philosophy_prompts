answer: |-
  Dear Friend,

  After spending considerable time working through the arguments together, we have drafted the following statement to clarify where we stand, where we diverge, and what would actually be required to move the debate forward. We begin with what we both accept as true. We agree that any viable ethical theory must be empirically adequate, meaning it cannot make claims about human psychology that are demonstrably false. We agree that situational factors exert a far more powerful influence on behavior than common sense or traditional virtue ethics has historically acknowledged, and we concede that the evidence for robust, global character traits that manifest consistently across widely varying situations is weak at best. We further agree that the classic situationist experiments, such as those by Milgram, Darley and Batson, and Isen, successfully demonstrate that seemingly minor environmental variables can override dispositional tendencies in specific contexts. Finally, we agree that moral improvement is a legitimate goal for both empirical psychology and normative ethics, and that understanding the situational levers of behavior is essential for any project aimed at making people better.

  Despite this common ground, we retain significant disagreements regarding the implications of this evidence for virtue ethics. The situationist maintains that the empirical data shows character traits, if they exist at all, are so fragmented and situation-specific that they cannot support the explanatory or normative work virtue ethics requires, rendering the concept of virtue practically useless for moral evaluation and development. The virtue ethicist counters that this critique targets an implausible straw man of global consistency that no sophisticated virtue theory actually demands, arguing instead that virtues are local competencies that are stable enough within relevant contexts to ground moral responsibility, and that the normative force of virtue ethics is aspirational rather than descriptive, so the rarity of fully virtuous agents does not undermine the theory. While the situationist has the better of the empirical argument regarding the scarcity of global traits, the virtue ethicist retains the stronger position on the philosophical point that normative theories are not falsified merely by the difficulty of embodying them, provided the ideal remains coherent and humanly possible in principle.

  To resolve these residual disagreements, we have identified three specific cruxes that need settling. The first crux concerns the threshold of consistency required for moral attribution, specifically whether a trait that manifests only in ecologically similar situations is sufficient to ground claims about character and responsibility. The second crux involves the ecological validity of the situationist experiments, questioning whether behavior in high-pressure, artificial, or unique scenarios like the Milgram obedience study is the appropriate metric for evaluating traits that are cultivated over a lifetime of habituation. The third crux is the relationship between description and normativity, asking whether virtue ethics is primarily a theory about how people do behave or a theory about how they ought to behave and what they might become under ideal conditions of upbringing and education.

  Regarding evidence and argument, we agree that the first crux would be moved by longitudinal psychological studies that track behavioral consistency not across all situations, but across morally relevant clusters of situations over extended periods, rather than relying on single-experiment snapshots. The second crux requires philosophical argumentation about the scope of virtue ethics, specifically whether the theory claims to describe the average person or the fully matured phronimos, alongside empirical work on how training and habituation alter sensitivity to situational pressures. The third crux depends on metaethical clarification regarding whether the truth of virtue ethics hinges on the current prevalence of virtuous agents or on the possibility of becoming one, which is a philosophical question that empirical data alone cannot settle. We also explicitly flag that a portion of our dispute is verbal, centering on the definition of character trait, since the situationist tends to define traits as global behavioral regularities while the virtue ethicist defines them as complex cognitive-affective dispositions that include sensitivity to context, meaning we are sometimes talking past each other when we ask whether traits exist. We hope this document serves as a useful map for anyone else trying to navigate this debate without getting lost in the same weeds we did.

  Best regards,

  The Collaborators
