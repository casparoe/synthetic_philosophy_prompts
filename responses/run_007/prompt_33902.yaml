prompt: |-
  I chair the monthly risk committee of a mid-sized insurer. For familiar lines — car collisions, house fires — our actuaries give us clean numbers and we price accordingly. But we are increasingly asked to underwrite exposures with no stable frequency behind them: a new class of ransomware attack, a first-of-its-kind industrial process, a liability line for a technology that barely exists. The analysts still want a single probability for each, and they get frustrated when I say the number is doing no real work.

  Keynes's account of probability and uncertainty holds that probability is often not a single number at all: some comparisons are only partial, some matters admit no calculable probability, and the amount of evidence behind a probability — what he called the weight of argument — matters as much as the probability itself. Turn that into a procedure my committee can actually run in a two-hour meeting. It should be a fixed sequence of questions with rules for what counts as a sufficient answer, a point at which we must refuse to assign a number and classify the case as uncertainty rather than measurable risk, and a point at which the decision is handed to human judgment because it turns on values or risk appetite rather than calculation. Do not offer me a menu of considerations; commit to one procedure and defend each choice.

  Then run the procedure on two cases: (1) pricing coverage for a new strain of ransomware attack where we have only a handful of incidents worldwide, and (2) deciding whether to enter a market for insuring autonomous-vehicle fleets before any major loss data exists. Mark the steps at which reasonable people could follow your procedure and still disagree.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User Role:** Chair of a monthly risk committee at a mid-sized insurer.
      *   **Problem:** Traditional actuarial pricing works for stable risks (car, fire) but fails for novel/uncertain risks (ransomware, new tech, new liability). Analysts want single probabilities; the Chair knows these numbers are often spurious.
      *   **Theoretical Framework:** John Maynard Keynes's *A Treatise on Probability* (specifically the distinction between *risk* (measurable probability), *uncertainty* (unmeasurable), and the concept of *weight of argument* (amount of evidence)).
      *   **Task:** Create a *single, fixed procedure* (sequence of questions, rules for sufficiency, stop-points for uncertainty vs. risk, hand-off points for judgment) that fits a 2-hour meeting.
      *   **Constraint:** Do not offer a menu. Commit to one procedure and defend choices.
      *   **Application:** Run the procedure on two specific cases: (1) New ransomware strain, (2) Autonomous vehicle fleets.
      *   **Requirement:** Mark steps where reasonable disagreement is possible despite following the procedure.

  2.  **Deconstruct Keynes's Framework for this Context:**
      *   *Probability ($p$):* The ratio of favorable cases to total cases (only valid when classes are homogeneous and data is sufficient).
      *   *Uncertainty:* When no numerical probability can be assigned due to lack of logical basis or data.
      *   *Weight of Argument ($w$):* The amount of relevant evidence. A high probability based on thin evidence is less reliable than a moderate probability based on thick evidence.
      *   *Action:* Decisions shouldn't just depend on $p$, but on $w$. If $w$ is too low, don't calculate $p$.

  3.  **Design the Procedure (The "Keynesian Gate"):**
      *   *Time Limit:* 2 hours. Needs to be tight.
      *   *Structure:* Needs to move from Evidence -> Probability -> Weight -> Decision.
      *   *Step 1: Evidence Audit (The "Weight" Check).* Before asking "what is the probability?", ask "what is the evidence?" If evidence is too thin, stop.
      *   *Step 2: Reference Class Validity.* Can we group this with past events? If not, probability is invalid.
      *   *Step 3: The Probability Range (not point).* Keynes disliked spurious precision. Use ranges.
      *   *Step 4: The Weight Threshold.* Is the evidence heavy enough to act on the probability?
      *   *Step 5: The Risk Appetite Hand-off.* If the math passes, does it fit our values/capital?
      *   *Defense of Choices:* Why this order? Because analysts jump to Step 3 too fast. Step 1 forces them to confront the lack of data. Step 4 institutionalizes the "uncertainty" classification.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Draft 1 Idea:* Ask for data, then probability, then decide. *Critique:* Too standard. Doesn't capture Keynes.
      *   *Draft 2 Idea:* Focus heavily on "Weight of Argument." *Critique:* Needs to be actionable.
      *   *Final Structure:*
          1.  **The Reference Class Test:** Can we define a homogeneous group? (Yes/No). If No -> Uncertainty.
          2.  **The Evidence Inventory:** Count the relevant past instances. (Threshold: $N \ge 30$? Or qualitative sufficiency?). Let's use a qualitative "Sufficiency Rule" based on variance.
          3.  **The Weight Score:** Rate the completeness of evidence (1-5).
          4.  **The Probability Band:** If Steps 1-3 pass, assign a range, not a point.
          5.  **The Judgment Gate:** If Weight is low but Risk is high, defer to Senior Judgment/Capital, not Pricing.

      *Refining for the Prompt's Constraints:* The prompt asks for *rules for what counts as a sufficient answer* and *a point at which we must refuse to assign a number*.
      *   *Revised Procedure:* "The Keynesian Gate Protocol."
      *   *Step 1: Homogeneity Check.* (Pass/Fail).
      *   *Step 2: Evidence Count.* (Pass/Fail threshold).
      *   *Step 3: Weight of Argument Assessment.* (Low/Medium/High).
      *   *Step 4: Pricing vs. Judgment.* (Decision Rule).

      *Defending the choices:* I need to explain *why* I chose these specific thresholds and order. The order prevents anchoring on a number. The thresholds prevent false precision.

  5.  **Running the Cases:**

      *   **Case 1: New Ransomware Strain.**
          *   Data: Handful of incidents worldwide.
          *   Step 1 (Homogeneity): Are old ransomware attacks the same class? Maybe not (different vector).
          *   Step 2 (Evidence): $N < 10$. Fails threshold.
          *   Step 3 (Weight): Low.
          *   Outcome: Classify as Uncertainty. Do not price. Use exclusions or capacity limits.
          *   *Disagreement Point:* Is the class homogeneous? (Analysts might say yes, Chair says no).

      *   **Case 2: Autonomous Vehicle (AV) Fleets.**
          *   Data: No major loss data. But lots of testing miles?
          *   Step 1 (Homogeneity): Are human-driven cars a reference class? No (different risk profile).
          *   Step 2 (Evidence): Zero major losses.
          *   Step 3 (Weight): Low on loss, High on engineering data?
          *   Outcome: Uncertainty.
          *   *Disagreement Point:* Can we use simulation data as "evidence"?

  6.  **Refining the Output:**
      *   Tone: Professional, authoritative, suitable for a Committee Chair.
      *   Formatting: Clear headings, bold text for rules.
      *   Defense Section: Explicitly justify the design choices based on Keynes.
      *   Case Studies: Walk through step-by-step.
      *   Disagreement Markers: Clearly label where subjectivity enters.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I commit to *one* procedure? Yes.
      *   *Check:* Did I defend the choices? Yes, in the preamble.
      *   *Check:* Is it feasible in 2 hours? Yes, it's a checklist, not a deep dive model.
      *   *Check:* Did I capture "Weight of Argument"? Yes, Step 3 is dedicated to it.
      *   *Check:* Did I distinguish Risk vs. Uncertainty? Yes, the "Stop Rule."
      *   *Check:* Did I distinguish Calculation vs. Values? Yes, the "Judgment Gate."
      *   *Keynes Nuance:* Ensure I don't just say "no data." Keynes argues that even with data, if the *relevance* is low, the weight is low. I need to make sure Step 3 captures *relevance*, not just count.
      *   *Adjustment:* In Step 3, define Weight as "Relevance + Completeness," not just sample size.

  8.  **Final Review against Prompt:**
      *   "Turn that into a procedure my committee can actually run in a two-hour meeting." -> Keep it tight.
      *   "Fixed sequence of questions." -> Numbered list.
      *   "Rules for what counts as a sufficient answer." -> Pass/Fail criteria.
      *   "Point at which we must refuse to assign a number." -> The "Uncertainty Stop."
      *   "Point at which the decision is handed to human judgment." -> The "Appetite Gate."
      *   "Do not offer me a menu." -> Singular path.
      *   "Defend each choice." -> Section included.
      *   "Run the procedure on two cases." -> Section included.
      *   "Mark the steps at which reasonable people could... disagree." -> Annotations included.

  9.  (Final Polish of the text to ensure the voice is appropriate for a Committee Chair addressing peers/analysts.) *Make sure the distinction between Risk (measurable) and Uncertainty (unmeasurable) is sharp.*

  *(Self-Correction on the "Threshold"):* Setting a hard number like $N=30$ might be too actuarial. Keynes is more philosophical. Let's make the threshold about the *stability* of the frequency, not just the count. But for a procedure, it needs to be operational. I will use a "Stability Test" based on variance in the available data. If variance is unbounded, stop. Actually, simpler: "The Reference Class Stability Rule." If the frequency changes significantly when adding/removing the last 3 data points, the weight is too low.

  *Wait, keep it simpler for a 2-hour meeting.*
  Let's go with:
  1. Reference Class Validity.
  2. Evidence Sufficiency (Count + Relevance).
  3. Weight Assessment (Qualitative).
  4. Decision (Price, Decline, or Judgment).

  Okay, ready to write.
answer: |-
  # The Keynesian Gate Protocol
  **For the Monthly Risk Committee**

  **Objective:** To distinguish between *Risk* (measurable probability suitable for pricing) and *Uncertainty* (unmeasurable exposure suitable only for judgment or avoidance), preventing false precision in underwriting novel exposures.
  **Time Allocation:** 120 Minutes (Strict).
  **Facilitator:** Committee Chair.

  ---

  ## Part 1: The Procedure

  This protocol consists of four sequential gates. The committee must pass through each gate in order. If a gate fails, the process stops, and the output is predetermined. Do not skip ahead to pricing discussions until Gate 3 is passed.

  ### Gate 1: The Reference Class Test (15 Minutes)
  **Question:** Can we identify a stable, homogeneous class of past events to serve as the denominator for a frequency calculation?
  **Rule of Sufficiency:** The class must be defined by *causal mechanism*, not just outcome. (e.g., "House fires caused by faulty wiring" is valid; "Property losses in 2023" is not).
  **Stop Rule:** If the committee cannot agree on a single causal definition that applies to both past data and the proposed exposure, **classify as Uncertainty**. Do not proceed to Gate 2.
  **Output:** A defined Reference Class or a "Uncertainty" classification.

  ### Gate 2: The Evidence Inventory (30 Minutes)
  **Question:** How many relevant instances exist within the Reference Class, and how relevant are they to the current exposure?
  **Rule of Sufficiency:**
  1.  **Count:** There must be at least 30 distinct, verified loss events within the class.
  2.  **Relevance:** No single data point can account for more than 10% of the total loss value in the dataset (prevents outlier dominance).
  **Stop Rule:** If Count < 30 OR Relevance fails, **classify as Uncertainty**. Do not proceed to Gate 3.
  **Output:** A validated Dataset or a "Uncertainty" classification.

  ### Gate 3: The Weight of Argument Assessment (45 Minutes)
  **Question:** Even if we have a probability, how complete is the evidence supporting it? (Keynes's *Weight*).
  **Procedure:** The committee assigns a **Weight Score (1–5)** based on three sub-criteria:
  1.  **Completeness:** Do we know what we don't know? (1 = Hidden variables likely; 5 = All material variables observed).
  2.  **Stability:** Has the frequency remained stable over the last three observation periods? (1 = Volatile; 5 = Stable).
  3.  **Independence:** Are the events independent, or is systemic correlation likely? (1 = Highly correlated/Systemic; 5 = Independent).
  **Rule of Sufficiency:** The average Weight Score must be **≥ 4**.
  **Stop Rule:** If Weight Score < 4, **classify as Uncertainty**. Even if a probability exists, the evidence is too thin to rely on it for automated pricing.
  **Output:** A Weight Score and a decision to proceed to Pricing or Judgment.

  ### Gate 4: The Judgment Gate (30 Minutes)
  **Question:** Given the Probability and Weight, does this fit our risk appetite and capital constraints?
  **Condition:** This gate is *only* reached if Gates 1–3 are passed (i.e., it is a measurable Risk).
  **Procedure:** If Gates 1–3 failed (i.e., it is Uncertainty), this gate changes question: "Are we willing to accept this Uncertainty based on strategic value, regardless of calculation?"
  **Rule of Sufficiency:** A 75% majority vote is required to accept an Uncertainty classification (Gate 1–3 failure). A simple majority is required to price a Risk (Gate 1–3 pass).
  **Output:** Final Underwriting Decision (Price, Decline, or Strategic Accept).

  ---

  ## Part 2: Defense of Design Choices

  **1. Why the Reference Class Test comes first:**
  Analysts naturally anchor on numbers. By forcing a definition of the *class* before allowing a *count*, we prevent them from lumping dissimilar risks together to manufacture a sample size. Keynes argues probability is a logical relation between propositions; if the propositions (events) aren't comparable, the relation is null. This stops the "all cyber attacks are the same" fallacy.

  **2. Why the Count Threshold is 30:**
  This is not arbitrary actuarial science; it is a heuristic for the Law of Large Numbers. Below 30, the variance of the variance is too high to claim stability. Keynes emphasizes that probability requires a basis for numerical comparison. A handful of incidents provides a guess, not a probability. This rule forces the "Uncertainty" classification when data is sparse.

  **3. Why Weight of Argument (Gate 3) is separate from Probability:**
  This is the core Keynesian innovation. A 50% probability based on 30 data points is not equal to a 50% probability based on 3,000 data points. Standard risk committees treat $p$ as the sole input. By scoring *Weight* separately, we acknowledge that high uncertainty requires higher capital margins or a refusal to underwrite, even if the expected loss looks acceptable.

  **4. Why the Voting Threshold changes for Uncertainty:**
  If the math works (Risk), standard governance applies. If the math fails (Uncertainty), we are making a strategic bet, not a calculated trade. Therefore, the consensus bar must be higher (75% vs. 50%) to prevent individual optimism from overriding the committee's recognition of fundamental ignorance.

  ---

  ## Part 3: Running the Procedure

  ### Case 1: New Strain of Ransomware Attack
  **Context:** A specific new encryption method targeting cloud infrastructure. 5 known incidents globally in the last 6 months.

  *   **Gate 1 (Reference Class):**
      *   *Discussion:* Analysts propose "All Cyber Liability Claims." Chair argues the mechanism (cloud encryption vs. data theft) changes the loss distribution.
      *   *Decision:* Committee agrees to narrow class to "Cloud Encryption Ransomware."
      *   *Status:* **PASS.** (Class defined).
      *   *[Disagreement Marker]:* Reasonable members could argue that *all* ransomware shares enough causal structure (extortion via denial of access) to be one class. If they did, Gate 2 would look different.

  *   **Gate 2 (Evidence Inventory):**
      *   *Discussion:* Count of verified loss events in "Cloud Encryption Ransomware" class is 5.
      *   *Rule Check:* Count (5) < Threshold (30).
      *   *Status:* **FAIL.**
      *   *Outcome:* **Classify as Uncertainty.** Stop. Do not generate a probability number.

  *   **Gate 4 (Judgment Gate - Uncertainty Path):**
      *   *Question:* Do we accept this Uncertainty for strategic positioning?
      *   *Discussion:* Some members argue we must be first-to-market. Others argue the tail risk is unknowable.
      *   *Vote:* 60% Yes, 40% No.
      *   *Rule Check:* 60% < 75% Threshold for Uncertainty.
      *   *Final Decision:* **Decline Coverage.**

  ### Case 2: Autonomous Vehicle (AV) Fleets
  **Context:** Insuring a fleet of Level 4 autonomous delivery vans. No at-fault major injury losses exist for this specific model. However, there are 1 million miles of testing data.

  *   **Gate 1 (Reference Class):**
      *   *Discussion:* Analysts propose "Commercial Delivery Vans." Chair argues AV software failure is not comparable to human error.
      *   *Decision:* Committee defines class as "Level 4 AV Commercial Operations."
      *   *Status:* **PASS.**
      *   *[Disagreement Marker]:* Reasonable members could argue that physical collision physics makes human-driven vans a valid proxy class. If they did, Gate 2 would pass easily.

  *   **Gate 2 (Evidence Inventory):**
      *   *Discussion:* Count of *loss events* (claims) is 0. Count of *miles* is 1,000,000.
      *   *Rule Check:* The rule requires "verified loss events," not exposure units. Count (0) < Threshold (30).
      *   *Status:* **FAIL.**
      *   *Outcome:* **Classify as Uncertainty.** Stop.

  *   **Gate 4 (Judgment Gate - Uncertainty Path):**
      *   *Question:* Do we accept this Uncertainty for strategic positioning?
      *   *Discussion:* The potential premium volume is high. The risk is systemic (a software bug could crash the whole fleet).
      *   *Vote:* 80% Yes, 20% No.
      *   *Rule Check:* 80% > 75% Threshold for Uncertainty.
      *   *Final Decision:* **Accept via Judgment.**
      *   *Condition:* Coverage is written not on a priced probability, but on a fixed capacity limit (e.g., max $10M aggregate) with a clause to withdraw if *any* major loss occurs.

  ---

  ## Part 4: Analysis of Disagreement Points

  In both cases, the procedure forces a binary outcome, but reasonable people could disagree at specific junctures without violating the protocol.

  **1. The Definition of the Reference Class (Gate 1)**
  *   *In Case 1:* An analyst could argue that restricting the class to "Cloud Encryption" is overly conservative and that "Ransomware" is the true causal class. If the committee accepted this broader definition, the data count might rise to 500, passing Gate 2.
  *   *In Case 2:* An analyst could argue that "Vehicle Collision" is the reference class, regardless of driver type. This would allow the use of human-driver data, passing Gate 2.
  *   *Why this matters:* Keynes acknowledges that probability is relative to the evidence *we choose to consider*. The procedure cannot eliminate the subjectivity of choosing the evidence, but it forces that subjectivity into the open at Gate 1 rather than hiding it inside a model at Gate 3.

  **2. The Definition of "Loss Event" vs. "Exposure" (Gate 2)**
  *   *In Case 2:* The committee ruled that testing miles do not count as evidence because they are not *losses*. A reasonable counter-argument is that miles without accidents *are* evidence of safety (survival data).
  *   *Why I chose Loss Events:* Keynes's weight of argument relies on relevant evidence. In insurance, survival data (miles without crash) is often less weighted than failure data (crashes) because it doesn't capture tail risk (black swans). However, a committee could vote to count "10,000 accident-free miles" as one positive evidence point. This would change the outcome.

  **3. The Weight Score (Gate 3)**
  *   *Hypothetical:* If Case 1 had 50 incidents, it would pass Gate 2. At Gate 3, members might disagree on "Independence." One member might see 50 independent hacks; another might see 50 hacks all vulnerable to the same patch (Systemic).
  *   *Why this matters:* This is where the "Weight of Argument" does its heaviest lifting. It captures the *quality* of the data, not just the quantity. Two committees could follow this procedure and arrive at different Weight Scores based on their interpretation of systemic correlation.

  **Conclusion for the Chair:**
  This procedure does not eliminate disagreement. Instead, it relocates disagreement from the *calculation* (where it is hidden in decimals) to the *classification* (where it is visible in policy). By forcing the "Uncertainty" label when Gates 1 or 2 fail, you protect the firm from pricing ignorance as knowledge. By raising the voting threshold for Uncertainty, you protect the firm from strategic optimism overriding prudence.
