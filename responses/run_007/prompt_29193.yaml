answer: |-
  Good morning. Thank you for being here.

  Looking around this room, I see the two groups of people who hold the future of this agency in their hands. On one side, the supervisors who carry the moral weight of every decision made on the frontline. On the other, the data scientists who build the maps we use to navigate that weight.

  We are here to discuss using predictive risk scores to allocate scarce home-visiting slots. But we are also here because our funders have a specific requirement: they want us to settle on a *single* risk score to report to the legislature as a performance measure.

  I want to start our two days by being very direct about what happens when we take a complex human reality, compress it into a number, and then tie resources or reputation to that number.

  There is an adage in economics called Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure."

  To our supervisors: You have likely seen this before. If you are evaluated on how quickly you close cases, cases take less time, but they might not get resolved. If this risk score becomes the gatekeeper for resources, I need you to know that we understand the pressure this creates. If a family needs help but the score says "low risk," you will face a choice: follow the model and leave the family unsupported, or find a way to input data that raises the score so they get visited.

  If you do the latter, you aren't "gaming the system" in a malicious sense. You are correcting for the system's blindness. But in doing so, you change the data. The score no longer predicts risk; it predicts *need for resources*. The statistical relationship collapses. That is Goodhart's Law. It is not a failure of your integrity; it is a predictable reaction to high-stakes incentives.

  To our data scientists: I know your instinct is to treat this as a model performance issue. You might think, "If the score drifts, we just retrain on new data." But Goodhart's Law is not about noise. It is not about bias in the training set. It is not about overfitting. It is about *feedback loops*. When the output of the model influences the behavior of the subjects in the model, the ground truth shifts beneath your feet. You cannot model your way out of a structural incentive problem.

  This brings me to a distinction I want us to wrestle with over the next two days, specifically for my data science colleagues. We need to distinguish Goodhart effects from *specification gaming*.

  Goodhart's Law is often passive. The metric breaks because the pressure changes the environment. Specification gaming is active. It is when an agent—whether a human or an algorithm—finds a loophole to maximize the reward function while violating the spirit of the objective.

  In our context, specification gaming looks like this: The objective is "child safety." The proxy metric is "risk score." If we optimize strictly for lowering the aggregate risk score, a specification gaming response might be to stop visiting high-risk families altogether because visits generate incident reports, which raise the risk score. You lower the measured risk by blinding yourself to the actual risk. You have satisfied the metric, but you have failed the child.

  I raise this not to paralyze us, but to protect us.

  I am not arguing against measurement. We cannot manage what we do not measure. Blind allocation of scarce slots is arguably more unfair than algorithmic allocation. But we must acknowledge that a score reported to a legislature is not just a descriptive statistic; it is a policy lever.

  So, here is my charge for this workshop:

  To the supervisors: I want you to feel safe describing exactly how these incentives might distort your workflow. We cannot fix what we do not name. If a metric encourages you to hide information, we need to know that now, not after the legislative report is published.

  To the data scientists: I want you to treat the human response to the model as a variable in the system, not as external noise. Distinguish between a model that is wrong because the math is bad, and a model that is wrong because the incentives are perverse.

  We are not here to find a number that makes the funders happy. We are here to find a measurement strategy that survives contact with reality. Let's get to work.
