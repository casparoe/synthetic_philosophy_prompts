prompt: |-
  I teach an upper-level philosophy of language seminar — about 16 students, one 80-minute session. We're about to read Quine on radical translation and the gavagai example, and I'd like an in-class game that makes them feel the indeterminacy of translation before they read it: the discovery that two rival translation manuals can fit all the evidence, and that no further evidence could settle which is right. Design the activity — roles, rules, a small artificial language, printable materials, a timeline — plus a debrief that maps what happened onto the philosophical point. No lecture up front, and they shouldn't hear the word indeterminacy untill afterwards. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of Quine's claim the game can't reproduce and I'll have to supply myself.
