      *   **Question:** Which step to reject, and what is the cost?

  2.  **Deconstruct the Friend's Argument (Logical Analysis):**
      *   Premise 1 (Semantic/Conceptual): 'Horse' $\rightarrow$ Shape, 'White' $\rightarrow$ Color. (Plausible).
      *   Premise 2 (Distinctness): Color $\neq$ Shape. (True).
      *   Premise 3 (Composition): 'White horse' $\rightarrow$ Color + Shape. 'Horse' $\rightarrow$ Shape. (Plausible).
      *   Premise 4 (Identity Principle): If Name(A) $\neq$ Name(B), then Object(A) $\neq$ Object(B). *This is the crux.*
      *   Conclusion: White Horse $\neq$ Horse.

      *   *Second Route (Extensional):*
          *   Extension("Horse") $\supset$ Extension("White Horse").
          *   Extension("Horse") $\neq$ Extension("White Horse").
          *   Therefore, White Horse $\neq$ Horse.
          *   *Flaw:* Confusing *class identity* with *member identity*.

  3.  **Identify the Weak Points:**
      *   **Step 4 is the main culprit.** It confuses *sense* (meaning/intension) with *reference* (object/extension). Two terms can have different meanings but refer to the same object (or one can be a subset of the other).
      *   **The "Is" of Identity vs. Predication/Inclusion:** The statement "A white horse is a horse" uses "is" to mean *is a member of the class* or *falls under the concept*, not *is identical to the concept*.
