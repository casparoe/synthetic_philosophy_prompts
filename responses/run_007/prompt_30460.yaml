answer: |-
  You are assuming Schellenberg claims God would force a relationship on the unwilling; he actually claims God would never remain hidden from the *willing*.

  Here is the walkthrough of why that distinction matters:

  **1. The Mischaracterization of "Relationship"**
  Your argument rests on the idea that unmistakable presence equals coercion. Schellenberg disagrees. He argues that knowing someone exists is not the same as being forced to love them. You can know your neighbor exists unmistakably and still choose to hate them or ignore them. Schellenberg's point is that a loving God would ensure anyone *open* to a relationship has the basic knowledge required to enter one, not that God would force the relationship itself.

  **2. The Core Category: "Non-Resistant Non-Belief"**
  This is the engine of Schellenberg's argument. He isn't talking about people who actively reject God (where your autonomy argument holds water). He is talking about "non-resistant non-believers"—people who are not opposing God, who might even want to believe, but find themselves unable to because the evidence isn't there. If God is all-loving, He would not withhold Himself from people who are already saying "yes" or at least not saying "no."

  **3. Hiddenness as a Barrier, Not a Boundary**
  You view hiddenness as a respectful boundary (like not entering a room without permission). Schellenberg views hiddenness as a locked door (preventing entry even when permission is granted). If God remains hidden from someone who is seeking Him, God isn't respecting their autonomy; He is making Himself inaccessible to their consent.

  **4. The Actual Conflict**
  Schellenberg's argument isn't that God should override autonomy. It's that divine hiddenness makes a personal relationship *impossible* for many who desire it. If a loving parent hides from their child who is looking for them, that isn't respect—it's neglect. Schellenberg argues that a perfectly loving God would never neglect those open to being loved.
