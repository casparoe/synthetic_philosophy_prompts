      *   *Philosophical Consensus:* Most contemporary metaethicists agree the Frege-Geach problem is the biggest hurdle for expressivism. While "solutions" exist (Gibbard's norm-expressivism, Schroeder's hybrid views), they come with costs realists don't bear. Therefore, Clara's stance that it is a "devastating" (or at least structurally burdensome) problem is theoretically stronger than David's "it's just metaphysical decoration."
      *   *Adjustment:* I will argue Clara wins the exchange because David's defenses rely on deflections (parity arguments) that don't hold up under scrutiny, specifically regarding compositionality.

  6.  **Final Polish:** Ensure the distinction between the "classic" Frege-Geach (validity) and the "embedding" (compositionality) is clear. Ensure I don't just summarize but *judge*.

      *   *Round 1:* Clara sets the trap. David tries to jump out by redefining validity. Clara's trap is logical; David's jump is pragmatic. Clara wins the point on *logic*.
      *   *Round 2:* Clara identifies the category mistake. David calls it metaphysics. Clara is right: logic isn't psychology. Clara wins.
      *   *Round 3:* Clara brings the recursion (Schroeder). David claims parity. Parity fails. Realists have function/argument composition. Expressivists have vague "higher order attitudes." Clara wins.
