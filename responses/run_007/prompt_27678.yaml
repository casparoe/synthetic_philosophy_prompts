answer: |-
  This is a classic metaethical standoff, rehearsing the debate between robust cognitivism (Clara) and quasi-realist expressivism (David). To adjudicate this, we need to look past the rhetorical confidence of each speaker and examine the technical philosophical commitments underlying their moves.

  Here is the step-by-step adjudication of the exchange, followed by a definitive verdict.

  ### Round 1: The Equivocation Charge vs. The Parity Argument

  **Clara:** She lays out the classic Frege–Geach objection: in an unasserted context (the antecedent of a conditional), the moral term cannot be expressing an attitude because no attitude is being held. Therefore, the term "wrong" changes meaning between the premise "Lying is wrong" and the conditional "If lying is wrong..." This entails equivocation, destroying validity.

  **David:** He attempts a parity argument. He claims realists also ground validity in the rational incoherence of accepting premises and rejecting conclusions. Therefore, expressivists can ground validity in the incoherence of holding certain combinations of attitudes.

  **Adjudication:** **Clara scores the point.**
  David's move here is the standard quasi-realist opening (reminiscent of Blackburn), but it is too quick. Clara is pointing out a semantic gap: if "wrong" in the antecedent doesn't pick out the same semantic value as "wrong" in the assertion, the argument is formally invalid, regardless of psychological incoherence. David's response conflates the *criterion* for validity (truth-preservation or attitude-incoherence) with the *explanation* of the terms involved. He hasn't explained what "wrong" means in the antecedent; he has only asserted that the inference feels valid. Without a semantic account of the unasserted context, the charge of equivocation stands. David is offering a pragmatic substitute for a semantic solution.

  ### Round 2: Logical Validity vs. Psychological Consistency

  **Clara:** She sharpens the blade. Validity is a property of the argument's structure, independent of anyone's psychology. An argument is valid even if no minds exist to feel the "clash." David's account reduces logic to psychology.

  **David:** He counters that "logical structure" independent of mental states is the "mysterious realist posit" expressivism seeks to avoid. He argues Blackburn's "clash of commitments" is sufficient for moral reasoning and the rest is metaphysical decoration.

  **Adjudication:** **Clara scores the point.**
  David is committing a category error. While it is true that realists struggle to explain the metaphysics of logical relations, positing abstract relations is not obviously more mysterious than positing that logical validity *just is* a feeling of psychological discomfort. Clara is correct that validity is normative in a way that transcends individual psychology. If a genius logician constructs a valid argument that no human finds psychologically compelling (perhaps due to cognitive bias), it remains valid. David's reduction of logic to "commitments we can't hold together" fails to capture the mind-independence of logical truth. By calling logical structure "metaphysical decoration," David dismisses the very thing logic is supposed to study. Clara correctly identifies that expressivism risks explaining away logic rather than explaining it.

  ### Round 3: Recursion and Compositionality

  **Clara:** She escalates to the "embedding problem" (often associated with Mark Schroeder). Complex embeddings ("If if A then B...") require higher-order attitudes about higher-order attitudes. She argues there is no uniform account of what "wrong" contributes across these contexts.

  **David:** He claims this is a general compositionality problem. He argues realists haven't solved it either; they just "help themselves to propositions" without explaining how they compose.

  **Adjudication:** **Clara scores the point decisively.**
  This is where David's position collapses. David's claim that realists "haven't solved" compositionality is factually incorrect in the context of semantic theory. Truth-conditional semantics has a robust, mathematical framework for compositionality (e.g., functions from possible worlds to truth values). We know exactly how the meaning of "if" and "not" compose with propositions to yield new truth conditions.

  Expressivists, however, lack a consensus on the *type* of mental state corresponding to complex sentences. Is the state expressed by "If lying is wrong..." a desire? A belief about desires? A plan? Every time the embedding gets deeper, the expressivist must posit a new, distinct type of non-cognitive state to avoid equivocation. This leads to an explosion of mental state types that lacks the uniformity of the realist's "proposition." Clara is right: the problem recurses, and David's parity argument fails because the realist *does* have a uniform account (truth-conditions), whereas the expressivist is forced into increasingly ad-hoc psychological contortions.

  ### Overall Verdict

  **Clara emerges with the stronger position.**

  David argues like a pragmatist: he thinks that if we can *practice* moral reasoning without contradiction, the theoretical underpinnings don't matter. He treats the Frege–Geach problem as a demand for metaphysical reassurance that expressivists should reject.

  Clara argues like a semanticist: she recognizes that a theory of meaning must explain how complex sentences are built from simple ones and why inferences hold regardless of psychological state.

  David's defense relies on two weak pillars:
  1.  **The Parity Claim:** That realists face the same problems. This is false regarding compositionality. Truth-conditional semantics handles embedding naturally; expressivism requires complex, non-standard logic (like Blackburn's logic of attitudes) to mimic it.
  2.  **The Deflationary Claim:** That logical structure is "metaphysical decoration." This undermines the normativity of logic itself. If validity is just psychological consistency, then logic becomes a branch of anthropology or psychology, which is counter-intuitive to how we use logical concepts.

  Clara is correct that the Frege–Geach problem is not merely a technical challenge that has been "more or less met." It is a structural deficit. Expressivists can *mimic* realist discourse (which is what quasi-realism does), but they pay a higher theoretical cost to do so. They must construct a logic of attitudes that mirrors the logic of propositions, whereas realists start with the logic of propositions.

  David wins on *motivation* (avoiding queer metaphysical entities), but Clara wins on *explanation*. Since the debate was about whether the problem is fatal or merely technical, Clara is right: it is a structural problem that forces expressivism into complex, non-uniform semantic accounts that realists do not need. The problem is not "fatal" in that expressivism is impossible, but it is fatal to the claim that expressivism is *simpler* or *more parsimonious* than realism. David's attempt to wave this away as "decoration" fails to engage with the semantic rigor Clara demands.

  **Winner: Clara.**
