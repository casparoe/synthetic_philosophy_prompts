      *   *Final Conclusion:* Clara is right that it's a structural deficit, not just metaphysical decoration.

  5.  **Refining the Verdict (Self-Correction/Nuance):**
      *   *Wait, is David completely wrong?* Quasi-realism *does* allow expressivists to talk *as if* there are truth conditions. So, in practice, David is right that we can do moral reasoning. But the question is about the *underlying theory*. Clara is asking about the *explanation* of validity. David is saying the *practice* is enough.
