          *   *David:* Tu quoque/Parity argument. Realists define validity via rational incoherence (accepting premises/rejecting conclusion). Expressivists can do the same with attitudes.
          *   *Assessment:* Clara states the classic problem accurately. David attempts a deflationary move. However, David's move is the *start* of the quasi-realist project (Blackburn/Gibbard). Is it successful *yet*? Clara's point about equivocation is the hard logical hurdle. David's response is promising but needs to show *how* the attitudes compose, not just assert they do.
          *   *Verdict:* Clara scores the initial point on the *logical* gap, but David identifies the *strategy* for solution. Let's look closer. Actually, David's claim that realists appeal to "impossibility of accepting premises..." is a bit of a conflation of semantics and epistemology, but standard in this debate. Clara's point about equivocation is the stronger logical objection *at this stage*.

      *   **Round 2: Validity vs. Consistency.**
          *   *Clara:* Distinguishes logical validity (structure of claims, mind-independent) from psychological consistency (clash of attitudes).
          *   *David:* Calls "logical structure of claims" mysterious realist posits. Blackburn's "clash of commitments" is sufficient for moral reasoning.
          *   *Assessment:* This is the crux. Clara is defending a robust notion of logic. David is defending a pragmatic/expressive notion. The weakness in David's position here is that logic *seems* to outstrip psychology. We can say an argument is valid even if no one exists to hold the attitudes. Clara captures the intuition that validity is normative in a way that isn't reduced to psychological discomfort. However, David is right that realists struggle to explain *why* logical relations hold between propositions without just stipulating them. But Clara's distinction is the standard objection to quasi-realism: it explains the *practice* of logic, but not the *truth* of logic.
          *   *Verdict:* Clara has the stronger philosophical intuition here. Validity *is* distinct from psychological inconsistency. David's reduction feels like a category error.

      *   **Round 3: Recursion/Complex Embedding.**
          *   *Clara:* The problem recurses. Higher-order conditionals require higher-order attitudes. No uniform account of "wrong."
          *   *David:* Compositionality problem affects everyone. Realists use propositions/worlds without explaining composition either.
          *   *Assessment:* Clara raises the "negation problem" or "complex embedding problem" (Schroeder's point). This is technically very difficult for expressivists (specifying the mental state for complex sentences). David's response is a deflection. Realists *do* have a standard model for composition (function from worlds to truth values, etc.). Expressivists do not have a consensus on the mental state composition. David's claim that realists "haven't solved it either" is weak; truth-conditional semantics has a robust mathematical framework for composition. Expressivism struggles to specify the *type* of mental state for "If A then B" without collapsing into realism.
          *   *Verdict:* Clara lands a heavy blow here. The recursion issue is the modern form of Frege-Geach (Schroeder), and David's parity argument fails because truth-conditional semantics *does* handle compositionality better than expressivist semantics.

  3.  **Synthesize the Overall Position:**
