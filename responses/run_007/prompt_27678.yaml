      *   *Current State of Play:* The literature generally acknowledges that expressivists have made huge strides (Blackburn, Gibbard, Schroeder). However, the "really new problem" (Schroeder) regarding the specification of mental states for complex sentences remains a significant technical burden that realists don't share. Realists take propositions for granted; expressivists must construct them out of attitudes.
      *   *Decision:* While David captures the *motivation* for expressivism (avoiding metaphysical queerness), Clara wins on the *technical semantic* front. The Frege-Geach problem is not "solved" in the sense of being dissolved; it's managed at high technical cost. Clara's insistence on the distinction between validity and consistency is philosophically sharper. David's parity argument regarding compositionality is factually weak (truth-conditional semantics is more compositional).
      *   *Verdict:* Clara wins. The problem remains a significant theoretical cost, even if not "fatal" in the sense of making the view impossible. But the prompt asks who had the better of the *exchange*. Clara's objections are the ones that force the expressivist into increasingly complex contortions (higher-order attitudes), whereas David's defenses rely on claiming the realist has problems too (which they arguably don't to the same degree).

