answer: |-
  # Q&A Prep Sheet: The Utility Monster & Act-Utilitarianism

  **Context:** Moral Philosophy Workshop (Non-Consequentialist Heavy)
  **Thesis:** Act-Utilitarianism (AU) survives the Utility Monster; the objection relies on biological revulsion, not moral insight; Diminishing Marginal Utility (DMU) handles realistic cases; "Yes, and?" is the correct methodological stance.

  ---

  ### 1. The "Reasonable Rejection" Objection (Scanlonian)
  **Who:** The Scanlon-ish Contractualist
  **Phrasing:** "You claim the victim's intuition is just biological revulsion. But on my view, morality is about justification to each person. Can you honestly look the victim in the eye and justify their sacrifice to the monster by saying 'his capacity for pleasure is larger'? That seems to fail the test of reasonable rejection. The victim can say, 'I am being used as a resource,' and no appeal to aggregate totals answers that."

  **Two-Minute Reply:**
  "I grant that the justification sounds cold to the victim. But Scanlon's framework asks what principles no one could *reasonably* reject from an impartial standpoint. The principle 'maximize total well-being' benefits everyone ex-ante, including the victim, because it ensures resources go where they do the most good over a lifetime. The victim isn't being used as a *mere* resource; their well-being is counted fully (as one). The tragedy is that their well-being is outweighed, not that it is ignored. If we reject aggregation here, we lose the ability to justify saving many lives over one in standard rescue cases. The 'resource' charge only sticks if you assume individuals have a pre-moral claim to resources independent of the good those resources produce, which begs the question against utilitarianism."

  **Where the Reply is Soft:**
  Scanlonians explicitly reject ex-ante/veil-of-ignorance justifications for *individual* transactions. They care about the specific transaction's justifiability to the loser *now*. You are smuggling in Harsanyi/Rule-Utilitarian logic into an Act-Utilitarian defense.

  ### 2. The "Interpersonal Comparison" Objection (Economist)
  **Who:** The Welfare Economist
  **Phrasing:** "Your defense relies on Diminishing Marginal Utility to solve the realistic cases. But DMU presupposes we can measure and compare utility cardinally across persons. If utility is just ordinal preference satisfaction, the 'Monster' is technically incoherent. If you assume cardinality to make the Monster work, you're assuming a very strong, controversial informational base that social choice theory suggests we don't have. Isn't the Monster actually an objection to your informational assumptions, not your aggregation rule?"

  **Two-Minute Reply:**
  "That's a fair epistemic challenge, but it misses the moral point of the thought experiment. The Monster is designed to test our moral commitments *assuming* we know the utility facts. If we grant the premise that the Monster *does* get more utility, does the distribution follow? My paper argues 'yes.' Regarding DMU: I'm not relying on precise cardinal measurement for policy. I'm relying on the robust empirical generalization that a starving person gains more from a loaf of bread than a sated one. We don't need a full social welfare function to accept that. The Monster objection is moral, not epistemic; it claims even if we *knew* the utility facts, the sacrifice would be wrong. I'm saying it isn't."

  **Where the Reply is Soft:**
  You are wavering between "ideal theory" (assuming perfect knowledge) and "non-ideal theory" (DMU handles real life). If the Monster is impossible due to measurement problems, the objection dissolves, but so does your claim that AU is action-guiding in complex cases.

  ### 3. The "Priority to the Worse Off" Objection (Prioritarian)
  **Who:** The Prioritarian
  **Phrasing:** "You say the revulsion tracks biology, not morality. But isn't the revulsion actually tracking a legitimate moral concern for the *distribution* of well-being? Prioritarianism captures the intuition that benefits to the worse off matter more without needing side-constraints. If you accept DMU does the work in practice, why not just build that sensitivity into the moral view via weighting? Why insist on the 'Yes, and?' for the theoretical case where DMU fails?"

  **Two-Minute Reply:**
  "Because prioritarianism is theoretically unstable. It says we should weight the worse off, but it offers no non-arbitrary stopping point. Why weight them twice? Ten times? Lexically? Utilitarianism has a clear stopping point: marginal utility equals zero. The Monster case isolates the variable of 'capacity for well-being' from 'current level of well-being.' The Prioritarian wants to help the starving because they are starving. The Utilitarian helps them because the food does more good there. If the Monster is starving *and* has high capacity, the Prioritarian and Utilitarian agree. If the Monster is sated *but* has high capacity, the Prioritarian says 'feed the human,' I say 'feed the Monster.' I argue the Prioritarian is just projecting DMU heuristics onto a case where they don't apply. We should follow the good, not the heuristic."

  **Where the Reply is Soft:**
  Prioritarians will argue *they* are the ones following the good, properly understood (telic prioritarianism). Accusing them of arbitrariness might bounce off; they see the 'weighting' as intrinsic to value, not an arbitrary add-on.

  ### 4. The "Dignity and Respect" Objection (Kantian)
  **Who:** The Kantian
  **Phrasing:** "You say the victim is counted as one. But by sacrificing them for the Monster's hedonic state, you are treating their rational agency as a vessel for utility. You are violating the requirement to treat humanity as an end in itself. The Monster case shows that on your view, persons are merely 'locations' of value. If the value can be maximized elsewhere, the person is expendable. How is that compatible with respect?"

  **Two-Minute Reply:**
  "I deny that persons are merely locations of value. Persons are the *source* of value. Well-being matters *because* persons experience it. To respect persons is to take their well-being seriously. If we ignore the Monster's massive gain to protect the victim's modest loss, we are disrespecting the Monster's capacity for value. We are saying their experiences count for less. The Kantian worry assumes there is a form of respect that requires ignoring consequences. I argue respect requires maximizing the fulfillment of those capacities. To do otherwise is to treat the Monster's capacity as morally inert."

  **Where the Reply is Soft:**
  This is a clash of foundational axioms. The Kantian defines "respect" as non-instrumentalization; you define it as maximizing well-being. You aren't answering the objection; you're restating your premise. This risks talking past them.

  ### 5. The Question Nobody Asks (The "Redundancy" Trap)
  **Who:** The Welfare Economist (or a sharp Grad Student)
  **Phrasing:** "You've argued that in the real world, DMU prevents the Monster scenario. You've argued that in the theoretical world, we should bite the bullet. But if DMU is doing all the practical work of protecting individuals, and the theoretical bullet-biting has no practical implications, what work is 'Act-Utilitarianism' actually doing? Why not just adopt a Prioritarian view that matches your practical recommendations but avoids the theoretical bullet? Isn't your view practically redundant and theoretically abhorrent?"

  **Two-Minute Reply:**
  *(This is the hardest one. You must not concede the theory is useless.)*
  "It's not redundant because the *justification* matters for moral progress. If we protect the poor only because of a weighting rule, we might fail to help them when the weighting is unclear. If we help them because it maximizes the good, we have a robust, universal reason. Furthermore, the theoretical bullet ensures we don't fetishize distribution. If we could create a being with immense capacity for joy at low cost, Prioritarianism might forbid it if they aren't 'worse off' enough. Utilitarianism encourages creating high-capacity beings. The theoretical commitment drives long-term moral progress, even if DMU handles short-term distribution."

  **Where the Reply is Soft:**
  This is weak. It admits the view has no *current* practical difference but promises future gains. The audience may view this as admitting the paper solves no actual moral problems we face today.

  ---

  ### Concede/Hold Strategy

  *   **CONCEDE:** Admit that *epistemically*, we rarely know if a "Monster" exists. Admit that in *practice*, DMU makes the Monster scenario vanishingly rare. Admit that the intuition of revulsion is widespread and deeply held.
  *   **HOLD:** Hold that the *moral principle* remains maximizing total well-being. Hold that the revulsion is biological/evolutionary (disgust at inequality or weird biology), not moral insight. Hold that Prioritarianism is theoretically arbitrary compared to strict aggregation. Do **not** slide into Rule-Utilitarianism to save the victim; stay Act-Utilitarian.

  ---

  ### Summary Table

  | Objection (In Their Words) | Who Raises It | Damage (1-10) | Likelihood (1-10) | Concede or Hold | Weakest Point in Reply |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **"Reasonable Rejection":** "Can you justify to the victim they are being used as a resource?" | Scanlonian Contractualist | 9 | 10 | Hold | Relies on ex-ante justification which Contractualists explicitly reject for individual cases. |
  | **"Interpersonal Comparison":** "The Monster is incoherent without cardinal utility, which we don't have." | Welfare Economist | 7 | 9 | Concede (Epistemically) / Hold (Theoretically) | Risks making the theory action-guiding only in idealized worlds. |
  | **"Priority to Worse Off":** "Why not just weight the worse off? It avoids the bullet." | Prioritarian | 8 | 8 | Hold | Accusation of "arbitrariness" may seem question-begging to them. |
  | **"Dignity and Respect":** "You treat persons as vessels for value, not ends." | Kantian | 6 | 7 | Hold | Foundational clash; hard to persuade without accepting their axioms. |
  | **"Redundancy Trap":** "If DMU does the work, why be a Utilitarian at all?" | **Question Nobody Asks** | 10 | 3 | Hold | Admits lack of practical difference; relies on vague "long-term progress" argument. |

  ### Final Advice
  The room will try to push you toward **Prioritarianism** or **Contractualism** as a "sensible middle ground." Your job is to argue that the middle ground is unstable. If you accept the Monster bullet, you must own it without flinching, but frame it as a commitment to taking *all* well-being seriously, not just the well-being of the typical human. Keep the focus on **well-being** as the only intrinsic value. If you start talking about "rules" or "constraints" to appease them, you lose the room's respect for your consistency.
