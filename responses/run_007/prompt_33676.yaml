  so i'm taking a grad seminar on knowing-how versus knowing-that and i have to hand in a one-page "position profile" before next week. i've been reading Ryle alongside the more recent intellectualist stuff, and i keep finding myself wanting to hold all of the following at once. the problem is i genuinly can't tell whether this is a coherent package or just a pile of things i find attractive for different reasons. could you act as a professional philosopher who works on the epistemology of skill and know-how, and give me a proper consistency audit? dont just tell me the whole thing is messy — i want the specific pairs that are in tension, ordered by how severe they are, with an explanation of what would have to give in each case. also flag any pair that only *looks* like a tension and dissolves once you look closer, because i suspect at least one of my commitments seems worse than it is. here's where i've landed:

  (1) knowing how is basically a matter of abilities and dispositions, not the possession of some proposition. you can know how to ride a bike without being able to articulate, or even entertain, the propositions that describe what you're doing.

  (2) but i'm also pretty committed to a knowledge-first picture: knowledge is a factive mental state, and it's the fundamental notion that belief and assertion get explained in terms of.

  (3) i find the linguistic evidence for intellectualism hard to shake: "S knows how to V" seems to have the same structure as "S knows where to V" or "S knows who to ask", so know-how ascriptions look like they report knowledge of a true answer to an embedded question, not merely the possession of a skill.

  (4) know-how comes in degrees: you can half-know how to do something, or know how to do it better than someone else. that doesn't seem true of knowing that something is the case, which feels more binary.

  (5) a concert pianist who loses both arms in an accident still knows how to play the piano, even though she can no longer do it.

  (6) a total novice can come to know how to do something — say, how to execute a particular chess opening — just from a clear piece of verbal instruction, before ever having done it themselves.

  i honestly don't know which of these is the weak link; they all feel independently right. so please work through the pairwise interactions, tell me which commitments are doing the real damage, which ones only appear to conflict, and then tell me the single cheapest revision that would make the set hang together — and what i'd lose by making it. take your time and brainstorm the pairs before you commit to a ranking.
