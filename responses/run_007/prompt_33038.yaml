answer: |-
  **Setting:** *The back corner of The Eagle and Child, Oxford. It is late evening. Two empty pint glasses sit on the table between them. Julian, a lecturer in jurisprudence, leans forward. Margaret, a professor of political theory, swirls the dregs of her ale.*

  **Julian:** It comes down to this, Maggie: there is no victim. Not a single human being is harmed in the making of this material. It is code. It is light on a screen. To criminalise the private consumption of it is to punish a thought, dressed up as an action.

  **Margaret:** Is it? That is the liberal comfort, isn't it? That the private sphere is a vacuum. But Patrick Devlin understood that society is not merely a business arrangement for the protection of life and liberty. It is a community of ideas. If you allow the private normalization of sexual violence—even simulated, even hyper-realistic CGI—you are permitting a rot in the shared moral structure that holds that community together.

  **Julian:** 'Rot' is a metaphor, not a legal standard. Hart was quite clear on this. The law exists to prevent harm to others, not to enforce a particular code of conduct for its own sake. If I sit in my locked room and watch pixels simulate a crime, who is injured? If you cannot point to a victim, you are legislating morality. And whose morality? Yours? Mine? The Home Secretary's?

  **Margaret:** I am not speaking of my morality, or yours. I am speaking of the morality of the 'man on the Clapham Omnibus'. Devlin argued that if a substantial portion of the population feels a profound, intolerable indignation towards a practice, that is evidence that the practice threatens the bonds of society. Most people would find the consumption of realistic depictions of rape to be repugnant. That disgust is not just a whim; it is a signal that a boundary is being crossed.

  **Julian:** But disgust is not a principle. It is a visceral reaction. If we criminalise based on disgust, we are on a slippery slope. In the 1950s, that same 'intolerable indignation' was felt towards homosexuality. Devlin's logic would have upheld the Wolfenden Committee's status quo. Hart saw that we must distinguish between what is sinful and what is criminal. Just because society *feels* threatened doesn't mean it *is* threatened. Where is the empirical evidence that a man watching CGI violence is more likely to commit actual violence?

  **Margaret:** You ask for empirical evidence of physical harm, Julian. But you are defining harm too narrowly. The harm is to the ethical environment. It is the corrosion of the collective attitude towards women and towards consent. The law has an educative function. By banning this, the state declares: 'This is not merely illegal; it is wrong.' If you legalise it, you declare it morally neutral. You are creating a market for the commodification of violence against women, even if no woman is physically present in the server room.

  **Julian:** That is paternalism. You are saying the state must protect us from our own moral degradation. But if the individual is sovereign over his own mind and body, he must be allowed to engage in fantasies that we find abhorrent. To do otherwise is to claim the state owns the citizen's imagination.

  **Margaret:** *(Leaning in)* Here is where I think your Harm Principle falters, Julian. You insist on a bright line between 'harm' and 'morality'. But can you truly draw it? When you argue that this material is harmful, you are inevitably making a moral judgement about what constitutes a healthy human psyche. If you say, 'It damages the consumer's character,' that is a moral claim. If you say, 'It undermines social trust,' that is a moral claim. You cannot escape morality by hiding behind 'harm'. You are simply privileging your liberal morality over my conservative one.

  **Julian:** *(Pauses, tapping his glass)* That is a fair challenge. I will concede that 'harm' is not a value-free concept. However, there is a distinction between preventing tangible setbacks to interests—physical safety, property, liberty—and enforcing a moral orthodoxy. But let me turn that back on you. You speak of preserving the moral fabric of society. But fabrics can be suffocating.

  **Margaret:** How so?

  **Julian:** You argue that society has a right to protect its existing morality from change. But what if that morality is wrong? What if the 'shared morality' of the time includes unjustified beliefs? In the 19th century, the moral fabric included the belief that women were property. In the 1950s, it included the belief that gay men were predators. If Devlin is right, the state should have criminalised the challenges to those beliefs, because they threatened the disintegration of the moral order as it stood then. What makes the current moral fabric worth preserving if it is built on sand?

  **Margaret:** *(Nods slowly)* You are asking me to justify the content of the morality, not just the right to enforce it.

  **Julian:** Precisely. If the 'bond' of society is prejudice, why preserve the bond?

  **Margaret:** Because without a bond, there is no society within which to have the debate. Devlin did not say morality is static. He said it cannot be eroded *too* quickly without causing chaos. But to your point: I would argue that the prohibition against sexual violence is not a prejudice like homophobia. It is foundational. It is not an 'unjustified belief' to hold that sexual violence is abhorrent. If you allow the simulation of it to become a casual consumer product, you are not challenging a prejudice; you are dulling the sword that protects the vulnerable.

  **Julian:** But simulation is not action. By conflating the two, you risk cheapening the reality of actual violence. If watching a CGI depiction is treated with the same legal severity as aiding an actual assault, we lose the ability to distinguish between fantasy and reality. That seems more dangerous to the moral order than allowing the fantasy to exist in the shadows.

  **Margaret:** But it won't stay in the shadows. Technology makes it ubiquitous. It becomes part of the cultural wallpaper. My concern is not the individual sinner in the locked room. It is the society that tolerates the industry. If we say, 'This is permissible provided no one is physically hurt,' we shift the Overton window. We make the idea of sexual violence more thinkable, more discussable, more acceptable.

  **Julian:** And yet, censorship often makes the forbidden more alluring. Moreover, if we accept your premise—that the state must legislate against anything that weakens the moral fabric—we give the state a limitless mandate. Who defines the fabric? Today it is violent porn. Tomorrow it is blasphemy? Or political dissent that 'undermines social cohesion'? Hart's worry was always about the power of the majority to tyrannise the minority.

  **Margaret:** And my worry, Julian, is that the minority tyrannises the majority by dismantling the norms that keep the majority civilised. You worry about the state oppressing the individual. I worry about the individual atomising the society. If everyone retreats into their own private moral universe, consuming whatever fantasies they wish, what is left to bind us?

  **Julian:** Mutual respect. Rational agreement. Not a forced conformity based on disgust.

  **Margaret:** *(Sighs)* Rational agreement is a luxury of stable societies. It is not the foundation of them. We are bound by shared feelings, shared intuitions. If those intuitions say 'this is vile,' the law should listen.

  **Julian:** And if those intuitions say 'this is vile' simply because it is new? Or because it challenges our understanding of sexuality? We must be able to separate the *shock* of the new from actual danger.

  **Margaret:** Perhaps. But in this specific case, the shock is not about novelty. It is about the replication of a profound violation. You ask me what makes the moral fabric worth preserving if it includes unjustified beliefs. I ask you: can a liberal democracy survive if it treats the simulation of the rape of a child—or a woman—as morally equivalent to watching a cartoon? If the law is neutral on that, has the law not already lost its moral authority?

  **Julian:** *(Quietly)* The law's authority comes from its restraint, Maggie. From knowing what it *cannot* do.

  **Margaret:** And I say its authority comes from what it *must* do to protect the community's soul.

  **Julian:** We seem to have reached the impasse Hart and Devlin never quite resolved.

  **Margaret:** *(Raises her empty glass)* To the impasse. At least we are still talking, rather than legislating.

  **Julian:** *(Clinks his glass against hers)* To talking. Though I suspect the Home Office is less interested in our dialogue than in the next consultation paper.

  **Margaret:** Then we must hope they read more than the executive summary. Another pint?

  **Julian:** Please. But nothing too realistic. I prefer my ale traditional.

  **Margaret:** *(Smiles)* A moral boundary I can respect.
