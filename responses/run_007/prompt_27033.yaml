answer: |-
  ### Job Description

  Your conception of the job is correct. The primary task of a theory of chance deference is to provide a **normative bridge** between the metaphysics of objective chance and the epistemology of rational credence. It must articulate how facts about the world's stochastic structure constrain the degrees of belief of a rational agent, thereby validating the use of probabilistic models in scientific inference and rational decision-making. Without this bridge, objective chance remains metaphysically idle, and probabilistic science lacks epistemic justification.

  ---

  ### Phase 1: Brainstorming Candidate Requirements and Motivating Cases

  Before formalizing the list, I will brainstorm the phenomena and cases that any candidate theory must address. This helps distinguish core rational constraints from metaphysical preferences.

  1.  **The Basic Deference Intuition**
      *   *Case:* You are handed a coin known to be objectively fair ($Ch(Heads) = 0.5$). You have no other information.
      *   *Requirement:* Your credence $Cr(Heads)$ must be 0.5.
      *   *Motivation:* If rational credence diverges from known objective chance without specific reason, the concept of "objective chance" loses its normative grip on belief.

  2.  **Uncertainty About Chance Values**
      *   *Case:* You have a coin drawn from an urn containing 50% fair coins ($Ch(H)=0.5$) and 50% biased coins ($Ch(H)=0.9$). You don't know which you have.
      *   *Requirement:* Your credence should be the weighted average (0.7).
      *   *Motivation:* Agents are rarely certain of the true chance theory. The principle must handle distributions over chance hypotheses.

  3.  **Higher-Order Chances**
      *   *Case:* A meta-device sets the chance of a coin being fair. There is a chance that the chance is 0.5.
      *   *Requirement:* The theory must align credence in chance hypotheses with higher-order chances.
      *   *Motivation:* Scientific theories often posit probabilistic laws about parameters (e.g., in quantum mechanics or statistical mechanics).

  4.  **Time-Relativity of Chance**
      *   *Case:* The chance of rain at 2 PM, evaluated at 1 PM, is 0.8. At 3 PM, the event is past.
      *   *Requirement:* The theory must index chances to times ($Ch_t$). $Ch_{3PM}(Rain)$ should be 0 or 1.
      *   *Motivation:* Chances evolve as history unfolds. A static deference rule fails to capture the dynamics of learning and temporal passage.

  5.  **Inadmissible Evidence (The Crystal Ball)**
      *   *Case:* You know $Ch(Heads) = 0.5$, but you also look into a crystal ball that shows Heads.
      *   *Requirement:* Your credence should be 1 (or near 1), not 0.5.
      *   *Motivation:* Direct evidence about the outcome trumps statistical evidence. The deference principle must have an "unless" clause for such evidence.

  6.  **The Undermining Future (Humean Chance)**
      *   *Case:* If chances supervene on the total history of events (Humeanism), there is a possible future sequence of events that is consistent with the current chance theory but, if it occurred, would make that theory false (e.g., a long run of heads that makes a fair coin theory false).
      *   *Requirement:* The theory must not entail a contradiction when the agent knows the chance theory itself.
      *   *Motivation:* Logical consistency. A normative principle cannot require an agent to hold contradictory beliefs.

  7.  **Principled Admissibility**
      *   *Case:* A theorist claims the crystal ball evidence is "inadmissible" to save the principle, but offers no definition of admissibility other than "evidence that violates the principle."
      *   *Requirement:* Admissibility must be defined independently of the deference principle.
      *   *Motivation:* To prevent vacuity. If any counterexample is dismissed as "inadmissible," the theory explains nothing.

  8.  **Bayesian Coherence**
      *   *Case:* An agent updates on new evidence.
      *   *Requirement:* Deference must be compatible with Conditionalization and the Probability Axioms.
      *   *Motivation:* Rational credence must be probabilistically coherent.

  ---

  ### Phase 2: Final List of Desiderata

  I categorize these into **Core Rational Constraints** (non-negotiable for any theory claiming to govern rational belief) and **Metaphysical Constraints** (dependent on one's view of the nature of chance).

  #### A. Core Rational Constraints (Non-Negotiable)

  1.  **Basic Deference:**
      *   *Specification:* For any proposition $A$, time $t$, and admissible evidence $E$, if an agent's total evidence is $E \cdot \langle Ch_t(A) = x \rangle$, then $Cr(A | E \cdot \langle Ch_t(A) = x \rangle) = x$.
      *   *Motivation:* The "Fair Coin" case. Without this, chance does not guide belief.

  2.  **Chance Uncertainty (The Weighted Average):**
      *   *Specification:* If the agent is uncertain between chance theories $T_1, T_2...$, then $Cr(A) = \sum Cr(T_i) \cdot Ch_{T_i}(A)$.
      *   *Motivation:* The "Urn of Coins" case. Rational agents must aggregate uncertainty about laws.

  3.  **Temporal Indexing:**
      *   *Specification:* The deference norm must relate $Cr_t$ to $Ch_t$. It must account for the fact that $Ch_{t'}$ (where $t' > t$) is not necessarily admissible at $t$.
      *   *Motivation:* The "Past Event" case. We do not defer to current chances for past events (which are 0 or 1).

  4.  **Inadmissibility Exception:**
      *   *Specification:* The principle must allow for evidence $E$ such that $Cr(A | E \cdot \langle Ch_t(A) = x \rangle) \neq x$.
      *   *Motivation:* The "Crystal Ball" case. Outcome-revealing evidence overrides chance.

  5.  **Principled Admissibility:**
      *   *Specification:* There must be an independent criterion for what counts as admissible evidence, not defined merely as "evidence that satisfies the principle."
      *   *Motivation:* Non-Vacuity. Without this, the theory is unfalsifiable.

  6.  **Bayesian Consistency:**
      *   *Specification:* The constraints imposed by the principle must not violate the probability axioms or the norm of Conditionalization.
      *   *Motivation:* Coherence. A theory of credence cannot mandate irrational probabilistic incoherence.

  #### B. Metaphysical Constraints (Camp Preferences)

  7.  **Humean Compatibility:**
      *   *Specification:* The theory should function even if objective chances supervene on the total Humean mosaic of particular facts.
      *   *Status:* **Preference.** Required for Humeans (like Lewis), not for Primitivists (like Maudlin).

  8.  **Admissibility of the Chance Theory:**
      *   *Specification:* The complete theory of chance ($T$) should count as admissible evidence for the agent at time $t$.
      *   *Status:* **Preference/Debatable.** Lewis assumed this; Hall argues it fails under Humeanism.

  ---

  ### Phase 3: The Incompatibility Analysis

  There is a well-known trilemma involving three specific requirements from the list above. They cannot be jointly satisfied.

  **The Inconsistent Triad:**
  1.  **Basic Deference (Lewis's Principal Principle):** $Cr(A | T \cdot E) = Ch_T(A)$, where $T$ is the complete theory of chance and $E$ is admissible.
  2.  **Admissibility of $T$:** The theory of chance $T$ itself counts as admissible evidence $E$.
  3.  **Humean Compatibility (Possibility of Undermining):** If Humeanism is true, there exist "undermining futures" $F$ such that $Ch_T(F) > 0$, but $T$ entails $\neg F$ (because if $F$ occurs, $T$ would not be the true theory of chance).

  **The Proof of Collision:**
  Let $F$ be an undermining future relative to theory $T$.
  1.  By **Humean Compatibility**, $Ch_T(F) > 0$ (the current chances allow for a future that undermines the current theory).
  2.  By **Humean Compatibility**, $T \rightarrow \neg F$ (metaphysically, if $T$ is the true theory, the undermining future cannot obtain).
  3.  Therefore, rational credence in $F$ given $T$ must be 0: $Cr(F | T) = 0$.
  4.  By **Admissibility of $T$**, we apply **Basic Deference**: $Cr(F | T) = Ch_T(F)$.
  5.  From (1) and (4), $Cr(F | T) > 0$.
  6.  From (3) and (5), we have a contradiction: $Cr(F | T) = 0$ and $Cr(F | T) > 0$.

  **Options for Relaxation:**
  To resolve this, one of the three legs must be relaxed:

  1.  **Relax Basic Deference (The Hall Solution):** Adopt the **New Principle (NP)**.
      *   *Revision:* $Cr(A | T) = Ch_T(A | T)$.
      *   *Consequence:* Since $T$ entails $\neg F$, $Ch_T(F | T) = 0$. This matches the credence requirement. Deference is no longer to the unconditional chance, but to the chance conditionalized on the theory itself.
  2.  **Relax Admissibility of $T$ (The Lewis/Thau Solution):** Claim $T$ is inadmissible.
      *   *Revision:* $T$ contains information about the future (via the Humean base), so it violates the admissibility criterion.
      *   *Consequence:* Saves the Original PP, but requires a **Principled Admissibility** account that excludes $T$ without being ad hoc. This is difficult because $T$ looks like law-like information, which is typically admissible.
  3.  **Relax Humean Compatibility (The Primitivist Solution):** Reject Humean Supervenience.
      *   *Revision:* Chances are primitive properties that do not supervene on the future mosaic. Therefore, undermining futures are metaphysically impossible.
      *   *Consequence:* $T$ does not entail $\neg F$ in the same way. The contradiction vanishes, but at the cost of a richer, less parsimonious metaphysics.

  ---

  ### Phase 4: The Most Eliminating Requirement

  The requirement that does the most work in eliminating candidate theories is **Principled Admissibility**.

  **Why?**
  Many theories can technically avoid the Undermining Contradiction by simply stipulating that the problematic evidence (like $T$ in the Humean case, or the Crystal Ball in the standard case) is "inadmissible." However, without an independent, principled criterion for admissibility, this move is trivial. It renders the deference principle vacuous: "Defer to chance, unless you shouldn't, in which case don't."

  The demand for a **Principled Admissibility** criterion forces the theorist to explain *why* certain evidence breaks the link between chance and credence.
  *   It eliminates theories that rely on gerrymandered definitions of admissibility to save the Original PP under Humeanism.
  *   It eliminates theories that cannot distinguish between "future-looking" evidence (inadmissible) and "law-looking" evidence (admissible).
  *   It is the primary driver forcing the move from Lewis's Principal Principle to Hall's New Principle, because providing a principled reason why $T$ is inadmissible (while other laws are admissible) proved notoriously difficult for Humeans.

  ---

  ### Phase 5: Scorecard

  Here is how the two major contenders fare against the Core Rational Constraints and the Incompatibility Analysis.

  | Requirement | Lewis's Principal Principle (PP) | Hall's New Principle (NP) |
  | :--- | :--- | :--- |
  | **Basic Deference** | **Pass.** Captures the intuition directly ($Cr = Ch$). | **Pass.** Captures a refined intuition ($Cr = Ch(\cdot|T)$). |
  | **Chance Uncertainty** | **Pass.** Handles distributions over $T$. | **Pass.** Handles distributions over $T$. |
  | **Temporal Indexing** | **Pass.** Explicitly time-indexed. | **Pass.** Explicitly time-indexed. |
  | **Inadmissibility Exception** | **Pass.** Allows for $E$ to override. | **Pass.** Allows for $E$ to override. |
  | **Principled Admissibility** | **Fail (under Humeanism).** Requires $T$ to be inadmissible to avoid contradiction, but no principled reason exists to exclude $T$ while including other laws. | **Pass.** Does not rely on $T$ being inadmissible; builds the conditioning into the principle. |
  | **Bayesian Consistency** | **Fail (under Humeanism).** Entails contradictions given Undermining Futures. | **Pass.** Consistent even with Undermining Futures. |
  | **Humean Compatibility** | **Fail.** Inconsistent with Undermining Futures. | **Pass.** Designed specifically to resolve this. |

  **Verdict:**
  *   **Lewis's PP** is simpler and captures the pre-theoretic intuition better, but it is **logically inconsistent** if one accepts Humean Supervenience and the possibility of undermining futures. It fails the **Bayesian Consistency** requirement in that context.
  *   **Hall's NP** is more complex (requiring agents to conditionalize chance on the chance theory), but it is **robust**. It satisfies **Bayesian Consistency** and **Humean Compatibility** simultaneously.

  For a professional theory intended to underwrite science (which often assumes something like Humeanism or at least requires logical consistency), **Hall's New Principle** is the adequate theory, despite the cost to the simplicity of the Basic Deference intuition.
