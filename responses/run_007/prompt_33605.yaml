  1. **The pattern in the precedents**
  Elena's verdicts track a distinction between compromised agency and intact agency. She excuses individuals whose control is overridden by biology (seizure, tumor, psychosis) or whose moral comprehension is undeveloped or impaired (child, intellectual disability). She assigns blame when agents voluntarily impair themselves (drunk) or act with full capacity (embezzler), and mitigates when freedom is constrained externally (duress). The consistent thread is that resentment requires both behavioral control and a meaningful capacity to grasp the moral stakes. The ambiguity lies in whether intellectual knowledge of rules suffices for responsibility, or if emotional engagement with moral reasons is necessary. The precedents excuse those who lack understanding, but none have tested an agent who understands the rules intellectually yet lacks the emotional capacity to care. This leaves the boundary between cognitive knowledge and moral sensibility unsettled.

  2. **Candidate principles**
  Here are three distinct principles that could generate Elena's pattern of verdicts.
  **Principle 1: Volitional Control.** Blame is appropriate whenever an agent has behavioral control and knows the rules, unless coerced or physically compelled. This fits the seizure (no control), drunk (prior control), and embezzler (full control). It treats the brain tumor and schizophrenia as instances where control was lost to pathology. The ID case is handled by claiming they lack full control over impulses due to cognitive limits. It assumes knowledge of rules plus physical ability equals responsibility.
  **Principle 2: Moral Capacity.** Blame requires the ability to be motivated by moral reasons, not just rule-following. This fits the child and intellectual disability cases (who know rules but lack moral grasp) and the psychosis case (distorted reality). It views the tumor and seizure as removing the capacity for normal moral agency. The drunk is blamed because they voluntarily removed this capacity. Duress is mitigated because the threat compromises the voluntariness of the choice. It assumes moral responsibility requires emotional access to moral values.
  **Principle 3: Authenticity.** Blame is appropriate only if the action stems from the agent's stable identity, not an alien intrusion. This explains the tumor and seizure excuses (external medical interference) versus the embezzler (true self). It handles the child by viewing them as not yet having a formed moral self. The duress case fits because the threat overrides the true self's desires. The drunk case fits because the impairment was self-inflicted, making the subsequent action traceable to the authentic self's prior choice. This principle focuses on whether the action reflects *who they are* at the time of acting.

  3. **The new case under each principle**
  Under **Volitional Control**, the psychopath is fully blameworthy. He had full behavioral control and intellectually understood the rules. The neurological basis does not remove control like a seizure does, so he fits the embezzler model. The lack of empathy is irrelevant if he could have chosen otherwise.
  Under **Moral Capacity**, he is not blameworthy. Like the child or the person with intellectual disability, he lacks the emotional apparatus to grasp the moral wrongness, only the conventional rules. His lack of empathy functions like the ID person's lack of understanding. He cannot access the relevant moral reasons.
  Under **Authenticity**, the verdict is ambiguous but leans toward excuse. If psychopathy is viewed as a pathological intrusion (like the tumor), he is excused. If it is viewed as his stable identity (unlike the tumor's change), he is blamed. However, given the "medical/neurological" framing, Elena might view it as an alien constraint similar to the tumor. The divergence is sharp between Control (blame) and Capacity (excuse), while Authenticity depends on whether she sees the condition as "him" or "it".

  4. **Best prediction**
  Elena would likely say resentment is not appropriate, or at least significantly mitigated. Her verdict on the intellectual disability case is the strongest clue: she excused someone who understood rules but not "why it's wrong." The psychopath is in a parallel position—he knows the rules but cannot feel the moral weight. Additionally, she excuses biological intrusions (tumor, seizure). Since the psychopathy is described as having strong neurological underpinnings, she likely categorizes it as a medical incapacity rather than a choice. Her reasoning style prioritizes the internal conditions of agency over mere behavioral output. She seems to care about whether the person *could* be moral, not just whether they *could* follow rules. The duress case shows she weighs constraints heavily; a neurological constraint should weigh similarly.

  5. **The tiebreaker case**
  Present Elena with a case of a neurotypical person who consciously suppresses their empathy to commit fraud versus a psychopath who lacks empathy entirely. If she blames the suppressor equally to the embezzler but excuses the psychopath, it confirms Moral Capacity is the key rule. If she blames both equally, it confirms Volitional Control. This isolates whether the *lack* of feeling is the excuse, or merely the *choice* to act wrongly. It forces her to distinguish between inability and unwillingness.
