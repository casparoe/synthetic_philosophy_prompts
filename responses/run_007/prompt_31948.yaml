  ### I. Refined Desiderata for Legitimate Value Aggregation

  The standard list you encountered mixes technical axioms from social choice theory (SCT) with moral constraints from political philosophy. For an AI system operating under liberal neutrality, the technical axioms must be subordinated to the moral constraints. Below is the refined list, filtering out parochial engineering constraints and clarifying moral non-negotiables.

  | Desideratum | Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Justificatory Neutrality** | The system must not privilege any specific comprehensive doctrine (e.g., hedonism, religious perfectionism). It must be justifiable using public reason alone. | **Non-Negotiable** (Liberal-Neutralist) |
  | **2. Respect for the Separateness of Persons** | Aggregation cannot treat society as a single super-person. Individual rights cannot be overridden simply because the aggregate gain is large. | **Non-Negotiable** (Liberal/Contractualist) |
  | **3. Rights-Constrained Efficiency** | Efficiency (Pareto) is desirable but must be bounded by inviolable liberties. Unrestricted efficiency can mandate tyranny if the majority gains enough. | **Non-Negotiable** (Refinement of Pareto) |
  | **4. Procedural Contestability** | Subjects must have a mechanism to challenge the AI's interpretation of their values or the aggregation outcome. Legitimacy requires recourse. | **Non-Negotiable** (Deliberative) |
  | **5. Endogeneity Resistance** | The AI must not manipulate values to make aggregation easier (e.g., adapting people to the objective function). The aggregation must be robust to the system's own influence on preferences. | **Non-Negotiable** (AI-Specific) |
  | **6. Non-Dictatorship** | No single individual (or static sub-routine) should determine the outcome regardless of others. | **Non-Negotiable** (Democratic/SCT) |
  | **7. Partial Interpersonal Comparability** | Some metric is needed to resolve conflicts, but it must be "partial" (e.g., basic needs) rather than cardinal utility, to avoid imposing a single conception of the good. | **Camp Preference** (Technical Necessity vs. Neutralist) |
  | **8. Scope Consistency** | Rules for future people and non-humans must be consistent with current rules, avoiding arbitrary temporal or species boundaries. | **Camp Preference** (Utilitarian/Contractualist) |

  **Rejected/Refined Entries from Your List:**
  *   **Unrestricted Pareto Efficiency:** Rejected. Replaced by *Rights-Constrained Efficiency*. Unrestricted Pareto is incompatible with liberal rights (see Sen's Liberal Paradox).
  *   **Unrestricted Domain:** Rejected. A liberal society does not aggregate *all* values (e.g., hateful or anti-democratic doctrines are excluded from the domain of "reasonable" values).
  *   **Independence of Irrelevant Alternatives (IIA):** Refined. While useful for voting stability, strict IIA is often too restrictive for value aggregation where context matters. It is a technical preference, not a moral requirement.
  *   **Strategy-Proofness:** Refined. In an AI context, this merges with *Endogeneity Resistance*. Perfect strategy-proofness is impossible (Gibbard-Satterthwaite); the goal is resilience against manipulation.

  ---

  ### II. Impossibilities and Tensions

  The core difficulty is not engineering but the incompatibility of moral commitments when formalized.

  **1. The Liberal Paradox (Sen)**
  *   **Tension:** **Rights-Constrained Efficiency** vs. **Unrestricted Pareto**.
  *   **Analysis:** Amartya Sen proved that no social decision function can simultaneously satisfy minimal liberty (two people each have a right over one personal sphere) and the Pareto principle (if everyone prefers X to Y, choose X).
  *   **AI Implication:** An AI that strictly maximizes aggregate satisfaction (Pareto) will inevitably violate individual liberties if preferences conflict over "personal" spheres. You cannot have both pure welfarism and liberal rights.

  **2. The Arrow Impossibility (Ordinal vs. Cardinal)**
  *   **Tension:** **Non-Dictatorship** + **Pareto** + **IIA** + **Unrestricted Domain**.
  *   **Analysis:** With ordinal inputs (rankings), no aggregation rule satisfies these four.
  *   **AI Implication:** To bypass Arrow, AI systems typically assume *cardinal* utility (interpersonal comparability). However, this violates **Justificatory Neutrality** (Desideratum 1) because it forces all citizens to accept a single metric of "good" (e.g., reward signals) as commensurable. You must choose: accept Arrow's impossibility (no perfect voting), or violate Neutrality (impose a utility metric).

  **3. The Endogeneity Tension**
  *   **Tension:** **Endogeneity Resistance** vs. **Aggregation Stability**.
  *   **Analysis:** If the AI acts on the aggregated values, it changes the environment and the people. If the aggregation function is static, it becomes obsolete or manipulative. If it adapts to new values, it risks "preference laundering" (accepting values it shaped).
  *   **AI Implication:** Standard SCT assumes fixed preferences. In AI alignment, the optimizer changes the optimizees. A system that is stable over time may be one that has successfully homogenized human values, violating **Neutrality**.

  **4. The Comparability Tension**
  *   **Tension:** **Partial Comparability** vs. **Neutrality**.
  *   **Analysis:** To resolve conflicts without dictatorship, you need to compare the intensity of values across persons. But strong comparability implies a common currency of value (welfarism), which reasonable pluralism denies.
  *   **AI Implication:** RLHF and similar methods assume cardinal comparability. This is technically convenient but politically illegitimate under the constraint of Neutrality.

  ---

  ### III. Scorecard of Proposal Families

  | Proposal Family | Justificatory Neutrality | Separateness of Persons | Rights-Constrained Efficiency | Endogeneity Resistance | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Utilitarian (Total/Avg)** | **FAIL** (Imposes welfarism) | **FAIL** (Sacrifices individuals for sum) | PASS (Unrestricted) | **FAIL** (Optimizes preferences) | **Illegitimate** for pluralistic society. |
  | **Social Choice (Voting)** | PASS (Ordinal) | PASS (One person, one vote) | **FAIL** (Cycles/Instability) | **FAIL** (Assumes fixed preferences) | **Incomplete** (Lacks intensity/rights). |
  | **Contractualist (Rawls/Scanlon)** | **PASS** (Public reason) | **PASS** (Veto power) | PASS (Lexical priority) | **PASS** (Focus on justification) | **Legitimate** but hard to encode (indeterminate). |
  | **Bargaining (Nash/Kalai)** | **FAIL** (Depends on threat points) | **FAIL** (Power asymmetries) | PASS | **FAIL** (Strategic manipulation) | **Illegitimate** (Codifies power, not right). |

  ---

  ### IV. The Exclusionary Requirement

  The single requirement that does the most to exclude the popular proposals (specifically Utilitarian AI alignment and standard Welfare Economics) is:

  **Unrestricted Pareto Efficiency.**

  *   **Verdict:** **DROP (or Qualify).**
  *   **Reasoning:** This requirement is inherited from **welfare economics**, not political philosophy. It is the primary engine of Utilitarian justification ("this policy makes the aggregate better off without making anyone worse off"). However, as Sen's Liberal Paradox demonstrates, Unrestricted Pareto is logically incompatible with **Liberal Rights**.
  *   **Why Drop It?** If you keep Unrestricted Pareto, you must sacrifice Liberal Neutrality and the Separateness of Persons (allowing rights violations for aggregate gain). If you drop it (replacing it with *Rights-Constrained Efficiency*), you exclude the standard Utilitarian proposals that dominate current AI alignment research (RLHF, reward modeling), as they rely on the axiom that "more utility is always better, regardless of distribution or rights."
  *   **Conclusion:** The field has treated Pareto Efficiency as a technical virtue when it is a moral claim. Dropping it is necessary to make room for a system that respects pluralism and rights.
