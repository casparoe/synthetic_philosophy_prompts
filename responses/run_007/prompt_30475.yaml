  The step that goes wrong is **(3)**, but specifically the **inference** drawn within it, not the factual claim you want to preserve.

  You can keep the claim that *"facts about my head aren't facts about arithmetic"* (which is true) without accepting the implication that *"therefore evidence about my head shouldn't move my belief about arithmetic."* (which is false).

  Here is the diagnosis of why (3) fails, how to preserve your intuition, and what it costs.

  ### 1. The Diagnosis: Truth vs. Justification
  Step (3) relies on a hidden premise: **Rational credence should track truth-conditions, not reliability-conditions.**

  *   **The True Claim:** You are right that the *truth* of the mathematical proposition is settled by the numbers, not your brain state. $2+2=4$ regardless of your sleep.
  *   **The False Inference:** You infer from this that your *confidence* (credence) should also be settled only by the numbers.
  *   **The Correction:** Rational credence does not track *truth* directly; it tracks *your access to truth*. Higher-order evidence (HOE) doesn't change the math; it changes the **link** between the math and your belief.

  When you lower your confidence due to sleep deprivation, you are not treating psychology as arithmetic. You are treating psychology as **evidence about the reliability of your arithmetic processing.** You are effectively saying: *"Given the numbers, $P$ is likely true. But given my brain state, my calculation of those numbers is likely flawed. Therefore, my total evidence supports a lower credence in $P$."*

  This dissolves the first horn of the dilemma. You aren't claiming tiredness changes the math; you're claiming tiredness changes the *rationality of holding the belief*.

  ### 2. Stopping the Regress (Step 5)
  Once you fix (3), the regress in (5) becomes benign. The worry in (5) is that if you use your impaired brain to decide to lower confidence, that decision is also impaired, requiring further lowering, ad infinitum.

  However, if you view HOE as **calibration** rather than **undermining**, the regress converges rather than explodes.
  *   **Level 1:** "I calculate $P$." (Impaired)
  *   **Level 2:** "I see I am impaired, so I discount Level 1." (This is a policy rule, not a calculation).
  *   **Level 3:** "Is my policy rule impaired?"

  Unless you have specific evidence that your *policy-making* faculty is impaired (distinct from your *calculating* faculty), the HOE in (1) ("deprivation affects probability estimates") does not automatically apply to the decision to adopt a discounting policy. Most epistemologists (e.g., David Christensen) argue that while the regress is technically possible, it converges quickly to a stable credence where the evidence is fully incorporated. It does not undercut itself into skepticism.

  ### 3. What Does Rejecting This Cost?
  To accept this diagnosis, you must pay three costs:

  1.  **Abandon "Pure Objectivism" about Justification:** You must accept that two agents with the same first-order evidence (the numbers) can rationally hold different credences if their higher-order evidence (their reliability) differs. Rationality is partly a function of your cognitive situation, not just the world.
  2.  **Accept "Epistemic Luck":** It implies that a tired genius and a sober fool might have the same evidence, but the sober fool is more rational. This feels unfair, but it is necessary to explain why the pilot should recheck the fuel.
  3.  **Tolerance for "Akrasia" (Optional):** If you *really* want to keep (3) literally (i.e., refuse to lower confidence), you can adopt a **Level-Splitting View** (defended by philosophers like Maria Lasonen-Aarnio). This allows you to believe *"P is true"* (based on the math) while simultaneously believing *"My belief in P is unreliable"* (based on the tiredness).
      *   *Cost:* This violates the **Rational Reflection Principle** (you shouldn't believe something while believing your belief is irrational). It saves your intuition in (3) but makes your epistemology fragmented.

  ### Recommendation
  The most stable path is to **reject the inference in (3)** while keeping the factual claim.
  *   **Keep:** "Math is mind-independent."
  *   **Drop:** "Therefore, my confidence should be mind-independent."

  This allows you to agree with (7) (the pilot should recheck) without falling into the skepticism of (6). The pilot rechecks not because the fuel math changed, but because their *access* to the math is compromised. That is a fact about the head bearing on the belief, not the arithmetic.

  **Summary:** Step (3) conflates the **metaphysics** of the proposition (which is mind-independent) with the **epistemology** of the belief (which is mind-dependent). Separating them stops the circle.
