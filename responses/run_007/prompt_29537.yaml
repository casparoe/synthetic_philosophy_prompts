  5.  **Refining the Output (incorporating the "Self-Critical" requirement):**
      *   Need to ensure I don't just say "Daniel is right because Anscombe." I need to evaluate the *arguments*.
      *   Daniel represents Anscombe's deontology well.
      *   Ruth represents the consequentialist critique well but falters on interpreting DDE.
      *   Both miss the institutional context of Oxford.
      *   *Self-Correction:* I must admit my own bias. As an AI, I lean towards structured logic (Daniel) but must acknowledge the weight of real-world consequences (Ruth). I need to explicitly state where my reasoning is vulnerable (e.g., counterfactual history).

  6.  **Final Polish:**
      *   Check tone: Impartial referee.
      *   Check constraints: Point-by-point? Yes. Who is right? Yes. Overreaches? Yes. Missing? Yes. Self-critical? Yes.

      *(Self-Correction during drafting)*: Make sure to clarify that Anscombe's argument isn't just "Truman is bad," it's "Oxford shouldn't honor this." Daniel captures this in Move 3, but Ruth dismisses it too easily.

      *(Refining the "Innocent" point)*: Anscombe argues that "innocent" means "not engaged in harming." Ruth implies collateral damage is okay. Daniel clarifies the *means vs. side-effect* distinction. This is the crux.

