answer: |-
  In his 2013 book *Death and the Afterlife*, philosopher Samuel Scheffler develops the "afterlife conjecture," a provocative thesis concerning the relationship between individual meaning and the survival of the human species. Scheffler argues that the badness of human extinction cannot be fully explained by aggregating the badness of the individual deaths involved. Instead, he posits that the confidence that humanity will survive after our own deaths is a crucial, often unacknowledged, precondition for finding value in many of our current activities. To demonstrate this, Scheffler relies on a comparative thought experiment designed to isolate our attitudes toward personal mortality versus collective extinction.

  Scheffler asks us to contrast two scenarios. In the first, you learn that you have a terminal illness and will die exactly thirty days from now, but the rest of humanity will carry on as usual. In the second, you learn that an asteroid will strike the Earth in thirty days, killing you and every other human being. Scheffler observes that our intuitive emotional and practical reactions to these scenarios diverge significantly. In the first scenario (individual death), while we would naturally feel grief and fear, many of our projects might retain their urgency and point. We might still seek to comfort our loved ones, finish a manuscript, or advocate for a political cause, believing these actions have worth. However, in the second scenario (collective extinction), Scheffler suggests we would be overcome by a unique form of demoralization. Most of our projects would seem instantly pointless; there would be no reason to cure a disease, write a book, or build a home if there is no one left to inhabit the world, read the book, or benefit from the cure.

  This divergence reveals a critical insight about the structure of our values. Scheffler argues that while we often claim to value activities for their own sake (intrinsically) or for the immediate satisfaction they provide, the thought experiment suggests these values are actually dependent on a background assumption: that there will be a "collective afterlife." We assume that other people will exist in the future to inherit the world we leave behind. The value of our contributions, our relationships, and our institutions is tethered to the expectation that humanity will persist. Without this future audience or beneficiary class, the normative force of our present commitments collapses.

  This leads to a distinction between what we sincerely avow about our values and what our reactions suggest we actually care about. We often avow a form of individualism or presentism, claiming that we act for our own fulfillment or for the sake of those currently alive. We might deny that we work for "posterity" in any grand sense. However, the devastation we feel at the prospect of human extinction—even when we are already dead in that scenario—indicates that we care deeply about the future of the species in a way we do not explicitly articulate. Our confidence in the collective afterlife is so robust that we rarely notice it, much like a fish notices water only when it is removed. The thought experiment removes that "water," revealing that our sense of meaning is more socially and temporally extended than our explicit beliefs admit.

  A serious objection to Scheffler's argument is the "particular others" objection. Critics argue that the reason the extinction scenario feels worse than the individual death scenario is not because of a concern for abstract humanity or the distant future, but because in the extinction scenario, all the specific people we love (friends, family, contemporaries) also die. In the individual death scenario, our loved ones survive. Therefore, the loss of value in our projects might stem from the loss of these specific social connections, not the end of the human species per se. If I write a book, I want my friends to read it; if they are dead, the book loses value, regardless of whether strangers in the distant future exist.

  Scheffler anticipates this objection and responds by modifying the thought experiment. He asks us to imagine a scenario where you die in thirty days, and your loved ones live out normal lifespans, but humanity becomes infertile and goes extinct one hundred years later. In this case, all your particular contemporaries survive you, yet the species has no long-term future. Scheffler argues that even in this modified case, we would still feel a significant diminution of meaning in our projects. The knowledge that the chain of humanity will be severed a century hence would still undermine our confidence in the value of scientific research, art, or political reform. This suggests that our concern extends beyond particular contemporaries to the indefinite continuity of the human community. While the loss of loved ones is significant, the "collective afterlife" conjecture holds that the sheer existence of future generations is an independent condition for the fullness of our current values.

  \answer{Scheffler's afterlife conjecture posits that the enduring survival of humanity after our own deaths is a necessary background condition for us to find meaning and value in many of our present-day activities and commitments.}
