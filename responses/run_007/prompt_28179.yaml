prompt: |-
  Please explain Samuel Scheffler's "afterlife conjecture" as developed in his book *Death and the Afterlife* (2013). The conjecture holds that the badness of human extinction cannot be reduced to the badness of the individual deaths it would involve — there is a further, distinct kind of loss at stake. Walk through the central thought experiment Scheffler deploys: contrast a scenario in which you learn you will die exactly thirty days from now (but humanity carries on) with one in which you learn that all of humanity will perish thirty days from now (yourself included). What does Scheffler think the divergence in our intuitive reactions to these two scenarios reveals about the structure of our values? In particular, address his claim that many of the activities, projects, and commitments we take to be valuable for their own sake turn out to depend for their value on a background assumption — one we rarely articulate — that humanity will persist long after we are gone. Discuss the distinction he draws between what we might sincerely avow about our values and what the thought experiment suggests we actually care about. Then, present at least one serious objection to the argument — for example, the worry that the thought experiment illicitly trades on our concern for particular other people (friends, family, contemporaries) who would also die in the extinction scenario, rather than on a concern for humanity in the abstract — and explain how Scheffler does or could respond. Conclude your response with a single sentence that captures the core thesis of the afterlife conjecture, enclosed in \answer{...}.
