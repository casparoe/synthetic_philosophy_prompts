  2.  **Deconstruct the Core Philosophical Issue:**
      *   *The Problem of Precedent Autonomy:* Does the "then-me" have the right to dictate the life of the "now-me"?
      *   *Key Thinkers:* Rebecca Dresser (critique of precedent autonomy, emphasis on current interests), John Robertson (defense of advance directives), Derek Parfit (psychological continuity).
      *   *The Dementia Context:* A competent person writes a directive saying "Do not keep me alive if I get dementia." Later, they get dementia but seem happy. Should we honor the directive?
      *   *The *Memento* Context:* Leonard (pre-injury/early injury) sets up a system. Leonard (current, amnesiac) follows it. But is current Leonard the same person? Does he understand the reasons?

  3.  **Deconstruct the Film (*Memento*):**
      *   *Plot:* Leonard Shelby has anterograde amnesia. He uses notes, tattoos, and Polaroids to hunt his wife's killer.
      *   *Twist:* He has already killed the real killer (or thinks he has). He manipulates his own system to keep hunting. He ignores/alters facts to maintain purpose.
      *   *Key Character:* "John G." (the target). Teddy (the cop who helps/manipulates him). Natalie (uses him).
      *   *The System:* Facts vs. Interpretation. "Fact 6: Car license SG13 7IU." "Remember Sammy Jankis."

  4.  **Drafting - Section by Section:**

      *   **Headline/Intro:** Needs to hook both audiences. Start with the visceral image of the tattoos. Introduce the bioethical concept (advance directives) without jargon overload.
      *   **The Parallel (Illumination):** How does the film make the abstract concrete?
          *   *The Experience of the Later Self:* In bioethics, we talk *about* the dementia patient. In *Memento*, we *are* Leonard. We feel the confusion of following orders from a stranger who happens to be you.
          *   *Externalization of Memory:* The tattoos are the ultimate advance directive. Written on the skin. Hard to ignore.
          *   *Faith:* Leonard has to trust "Past Leonard." This mirrors the dementia patient needing to trust "Past Competent Self."
      *   **The Complication (Where the Film Twists the Philosophy):**
          *   *Fallibility:* Standard bioethics assumes the earlier self is competent and rational. Leonard's earlier self might be grieving, irrational, or mistaken.
          *   *Malice/Manipulation:* Teddy and Natalie interfere. Advance directives usually assume a clean chain of custody. *Memento* shows the vulnerability of the system to external actors.
          *   *The Big Twist (Self-Deception):* Leonard *chooses* to ignore the truth. He burns the photo. He writes a false clue. This challenges the idea that the earlier self is the "guardian of truth." Sometimes the earlier self sets a trap for the later self to avoid painful reality.
      *   **The Breakdown (Disanalogies):**
          *   *Anterograde vs. Dementia:* Leonard retains long-term memory of who he is (mostly) and his skills. He doesn't lose *personality* in the same way advanced dementia patients might. He is fragmented, not transformed.
          *   *Happiness:* The dementia debate often hinges on the "happy dementia patient" vs. "prior wish to die." Leonard is *not* happy. He is tormented. This changes the ethical weight.
          *   *Agency:* Leonard actively maintains the system. A dementia patient often loses the capacity to question the directive.
      *   **Conclusion:**
          *   *Film's Contribution:* It highlights the *phenomenology* of the later self. The alienation. The potential for the earlier self to be a tyrant or a liar.
          *   *Philosophy's Contribution:* It reminds us that Leonard is an extreme edge case. Real life involves gradual decline, not a hard reset. We need the nuance of "best interests" vs. "precedent autonomy."
