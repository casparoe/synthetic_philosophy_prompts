  So my sister has gotten really into effective altruism the last couple years and it's honestly been messing with our relationship, which has got me thinking about the whole moral saints thing in a way that isn't just academic anymore. I've been trying to sort out my intuitions by going through cases, and I'm hoping you can help me find the principle behind them — or tell me which verdicts I need to give up.

  Here are my gut reactions:

  - The person who gives 50% of their income to the most cost-effective charities and works a normal job: this feels fine, even admirable. I'd defend this.
  - The person who gives 90%, lives on rice and beans, has no hobbies because they feel guilty spending money on themselves: this feels not fine. Something's wrong here even though they're doing more good.
  - The person who skips their kid's piano recital to volunteer at a soup kitchen because they calculated it does more good: not fine. Like, actively bad parenting.
  - The person who donates a kidney to a stranger: I want to say this is admirable but I also feel weird about it and I'm not sure I'd want my partner to do it.
  - The person who genuinly can't enjoy anything — a sunset, a joke, a meal — because they're thinking about how many people are suffering right now: not fine, this seems like a mental health problem, not moral achievement.
  - The person who forgives a colleague who repeatedly sabotaged them, and keeps forgiving them, and refuses to protect themselves because "holding grudges is wrong": not fine, this is self-erasure dressed up as virtue.

  What principle am I gesturing at? Is there a single principle that captures where I draw the line between admirable moral commitment and something that's gone wrong, or do I have to abandon some of these verdicts? Give me exactly five numbered items, each a sentence or two, no intro or conclusion: the principle (or best candidate), what it says about the kidney case (which I'm least sure about), which of my verdicts it can't accommodate, where your reasoning is most likely to fail, and what would change your mind about the whole thing.
