answer: |-
  The phenomenon you are describing is most commonly referred to in interdisciplinary literature (law, political science, and philosophy) as a **Commitment Race**. In formal game theory and industrial organization, it is typically modeled as a **Pre-emption Game** (or a **Timing Game with First-Mover Advantage**).

  While "first-mover advantage" describes the *payoff structure*, and "pre-commitment" describes the *tactic*, **Commitment Race** captures the *dynamic process* you are interested in: the competitive acceleration of binding oneself to a course of action to deny that opportunity to an opponent.

  Here is a breakdown of the concept, its scope, distinctions, and edge cases.

  ### 1. The Name and Conceptual Lineage
  *   **Commitment Race:** This is the descriptive term that best fits your examples. It highlights the pathological aspect you noted: the race itself consumes resources or creates risks (escalation, polarization) that might outweigh the benefits of the advantage gained. It is frequently used in legal theory (e.g., regarding bankruptcy or contract negotiation) and political philosophy.
  *   **Pre-emption Game:** This is the formal game-theoretic classification. In a pre-emption game, players decide *when* to take an irreversible action. The payoff for acting first is higher than acting second, but acting too early might be costly (e.g., building a factory before demand is certain). The equilibrium often involves "rent dissipation," where the cost of racing to be first eats up the value of the prize.
  *   **Schelling's "Competition in Risk-Taking":** Thomas Schelling, in *The Strategy of Conflict*, described the underlying logic. He noted that in situations like Chicken, parties compete to see who can most convincingly limit their own options. When both try to do this simultaneously, it becomes a race to bind oneself.

  ### 2. Scope and Boundaries
  To determine if a situation counts as a Commitment Race, look for these three necessary conditions:

  **A. Endogenous Timing (The Race)**
  In a standard Stackelberg game, the order of moves is exogenous (Player 1 moves, then Player 2). In a Commitment Race, the order is *endogenous*—the players are fighting to *become* Player 1. If the order were fixed by rule or nature, it would just be a first-mover advantage scenario, not a race.

  **B. Costly Irreversibility (The Lock-In)**
  Does the commitment need to be physically irreversible? **No.** It needs to be **costly to reverse**.
  *   *Physical Irreversibility:* Blowing up a bridge behind your troops.
  *   *Reputational/Political Irreversibility:* Announcing a policy. You *could* reverse it, but the loss of face or credibility makes it prohibitively costly.
  *   *Sunk Costs:* Building the factory. The money is gone even if you exit the market.
  *   *Boundary:* If the commitment is "cheap talk" (costless to reverse), there is no race, because the second mover can simply mimic the first without penalty. The commitment must be a **signal that is costly to fake.**

  **C. Strategic Substitutes (The Exclusion)**
  The benefit of the first move usually relies on reducing the value of the second move for the opponent.
  *   *Market:* If I build the factory, the market is saturated, and your entry is unprofitable.
  *   *Territory:* If I occupy the land, your occupation would be an act of war rather than a claim.
  *   *Boundary:* If both parties can benefit simultaneously (e.g., both firms can profit in a large market), there is no race to pre-empt, only a race to innovate.

  ### 3. Distinctions from Nearest Concepts

  | Concept | Key Difference |
  | :--- | :--- |
  | **Game of Chicken** | Chicken is the *static* payoff matrix (Swerve vs. Straight). A Commitment Race is the *dynamic* process of trying to win Chicken by binding yourself first. In Chicken, the focus is on the collision; in a Commitment Race, the focus is on the timing of the binding. |
  | **War of Attrition** | **Opposite dynamic.** In a War of Attrition, players race to *wait* (to see who blinks first). In a Commitment Race, players race to *act* (to force the other to blink). |
  | **Arms Race** | An arms race is typically a Prisoner's Dilemma or Security Dilemma where both accumulate capacity (more missiles). A Commitment Race is about *deploying* or *locking in* capacity (troops on the ground). An arms race is about potential; a commitment race is about actualization. |
  | **Rent Seeking** | Rent seeking is spending resources to capture existing wealth. A Commitment Race can involve rent dissipation (wasting resources to win), but the core mechanism is the *timing of commitment*, not just the expenditure of resources. |

  ### 4. Edge Cases and Nuances

  **1. The "Bluff" Edge Case**
  What if a party pretends to commit without actually doing so?
  *   *Analysis:* This turns the race into a signaling game. If bluffing is too easy, the race collapses because no one believes the commitments. A true Commitment Race requires that the mechanisms of commitment are observable and sufficiently costly that bluffing is risky.

  **2. The Symmetry Question**
  Does it require symmetric parties?
  *   *Analysis:* No. However, symmetry fuels the intensity of the race. If one party is clearly stronger (e.g., a dominant firm or a superpower), the weaker party may recognize they cannot win the race and may choose to accommodate (let the other be first). The "out-of-control" quality you describe is most prevalent when parties are **roughly symmetric** in capability and stakes.

  **3. The "Simultaneous Crash"**
  What happens if both commit at the exact same time?
  *   *Analysis:* In formal models, this is often treated as a probability. In reality, this results in the "worst outcome" (war, price war, mutual humiliation). The fear of this simultaneous crash is what drives the anxiety of the race, but paradoxically, the fear also drives the acceleration (I must commit *just before* you do).

  **4. Information Asymmetry**
  The race is fueled by uncertainty. If I know for certain you have not yet committed, I can take my time. The race intensifies when I am unsure of your status.
  *   *Boundary:* If there is **perfect information** regarding the timing of moves, the game resolves instantly (the stronger player commits immediately, the weaker yields). The "race" implies a fog of war or market uncertainty.

  ### 5. Confidence and Uncertainty

  **Confidence Level:** **High (85-90%)**
  I am confident that "Commitment Race" is the correct interdisciplinary label and "Pre-emption Game" is the correct formal classification for the dynamic you described. The distinction from Chicken and Wars of Attrition is standard in strategic literature.

  **Point of Least Certainty:**
  I am least certain about the **uniformity of terminology in pure mathematical game theory.** While "Pre-emption Game" is standard in Industrial Organization (e.g., Fudenberg & Tirole), a theorist working strictly on timing games might simply classify this as a **"Timing Game with First-Mover Advantage"** without using the specific label "Pre-emption." Additionally, some security scholars might categorize the territorial example strictly under **"Security Dilemma spirals,"** though that term usually implies defensive postures being misinterpreted, whereas your example implies offensive locking-in. The term "Commitment Race" bridges these fields best, but it is more common in philosophy/law/economics than in pure math departments.

  ### Summary for Your Work
  If you are writing in ethics or political philosophy, **"Commitment Race"** is the most precise and evocative term. It allows you to discuss the normative implications (the waste, the escalation, the loss of flexibility) without getting bogged down in the specific payoff matrices of pre-emption models.

  You can define it as: *A dynamic strategic interaction where multiple agents compete to be the first to incur the costs of irreversible commitment, driven by the incentive to secure a first-mover advantage, often resulting in collectively suboptimal outcomes due to the acceleration of decision-making and the dissipation of resources.*

  This distinguishes it from a simple first-mover advantage (which lacks the competitive racing element) and from Chicken (which lacks the focus on the timing of the binding mechanism).

  **Confidence:** 90%
  **Least Sure Point:** Whether "Pre-emption Game" is the exclusive formal label across all sub-fields of game theory (vs. "Timing Game").
