prompt: |-
  ok so we did the ellsberg paradox in my psycology class and ive gone down a bit of a rabbit hole reading about it. for context: youve got an urn with 90 balls, 30 red and 60 that are black or yellow in unknown proportion. most people prefer betting on red (known 1/3 chance) over black (unknown chance somewhere between 0 and 2/3), and also prefer betting on black-or-yellow over red-or-yellow — which cant both be right under expected utility because youd need probabilities that sum to more than 1 basically. the standard story is that people are ambiguity averse: they prefer known probabilities over unknown ones.

  but every time i read a paper arguing ambiguity aversion is rational its answering a different objection than the one in the next paper arguing its irrational. nobody seems to have sat down and said: heres what a theory of decision under ambiguity actually has to deliver before we even start arguing about whether its rational.

  so thats what i want. write me the desiderata. what does an adequate theory of decision under ambiguity have to get right? which cases must it handle (the ellsberg paradox obviously, but what else?), which distinctions cant it collapse, which results from neighbouring fields cant it contradict? for each requirement give me the case or consideration that motivates it. and tell me which ones are non-negotiable and which are more like preferences of particular camps. if any pair of them cant be jointly satisfied — like if respecting the ellsberg choices and some other plausible requirement turn out to be incompatible — flag that, because thats the bit i most want to understand.

  then briefly: how do the main approaches (maxmin expected utility, the smooth ambiguity model, and whatever the camp is called that says ambiguity aversion is just a mistake) do against the list. but keep the weight on the criteria not the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has studied the Ellsberg Paradox in a psychology class and has been reading deeper into decision theory literature.
      *   **Problem:** They notice a fragmentation in the literature. Papers argue for/against the rationality of ambiguity aversion but often talk past each other because they don't agree on the *criteria* for a successful theory.
      *   **Task:** Create a list of *desiderata* (requirements/criteria) for an adequate theory of decision under ambiguity.
      *   **Specifics:**
          *   What must it get right? (Cases, distinctions, consistency with neighboring fields).
          *   Motivation for each requirement.
          *   Classify as "Non-negotiable" vs. "Camp Preferences."
          *   Flag incompatibilities (trade-offs).
          *   Briefly evaluate main approaches (Maxmin EU, Smooth Ambiguity, Savage/SEU) against these criteria.
          *   **Emphasis:** Weight the response on the *criteria*, not the scorecard.

  2.  **Deconstruct the Subject Matter (Decision Under Ambiguity):**
      *   *Core Concept:* Distinction between Risk (known probabilities) and Ambiguity (unknown/unreliable probabilities).
      *   *The Benchmark:* Savage's Subjective Expected Utility (SEU) is the standard "rational" baseline. Ellsberg violates SEU.
      *   *The Conflict:* Descriptive accuracy (people *do* act this way) vs. Normative rationality (people *should* act this way).
      *   *Key Tensions:* Dynamic consistency, information aversion, learning, state-dependence, reduction of compound lotteries.

  3.  **Drafting the Desiderata (Brainstorming & Categorizing):**

      *   *Requirement 1: Descriptive Adequacy.* It needs to explain Ellsberg. If it can't explain the basic phenomenon, it's not a theory of *ambiguity*, it's just SEU.
      *   *Requirement 2: Normative Coherence (Dutch Book).* Can I be money-pumped? If the theory allows dynamic inconsistency, that's a big hit against rationality.
      *   *Requirement 3: Reduction of Compound Lotteries.* Do I treat a two-stage risk the same as a one-stage risk? SEU says yes. Ambiguity models often say no.
      *   *Requirement 4: Learning/Updating.* If I get new information, how do I change my mind? Bayesian updating is standard. Ambiguity makes updating hard (prior might be a set).
      *   *Requirement 5: Information Preference.* Do I want to know the odds? SEU says info is never negative. Ambiguity aversion suggests I might pay *not* to know (information aversion).
      *   *Requirement 6: State Independence.* My utility shouldn't depend on how the state is described, just the outcome.
      *   *Requirement 7: Continuity/Technical Tractability.* Needs to be mathematically workable.

  4.  **Refining and Classifying the Desiderata:**

      *   *Non-Negotiable (The "Hard" Constraints):*
          *   Internal Consistency (No Dutch Books/Money Pumps in static settings).
          *   Dominance (If A is better than B in every state, pick A).
          *   Descriptive Fit (Must capture Ellsberg patterns, otherwise it's just SEU).
      *   *Camp Preferences / Trade-offs (The "Soft" Constraints):*
          *   Dynamic Consistency (SEU lovers demand this; Ambiguity lovers often sacrifice it).
          *   Reduction of Compound Lotteries (SEU demands this; Ambiguity models often violate it to distinguish risk from ambiguity).
          *   Information Neutrality (SEU says info is good; Ambiguity says info might be bad).
          *   Bayesian Updating (SEU demands it; Ambiguity often requires non-Bayesian rules).

  5.  **Identifying Incompatibilities (The "No-Go" Theorems):**
      *   *The Big One:* You generally cannot have Ellsberg-style ambiguity aversion + Dynamic Consistency + Recursive/Reducible structure.
      *   *Epstein & Schneider / Siniscalchi:* There are impossibility theorems here.
      *   *Key Trade-off:* To allow ambiguity aversion, you usually have to give up either Dynamic Consistency or the Reduction of Compound Lotteries.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's insight (it's a meta-theoretical gap).
      *   **Section 1: The Non-Negotiables (Foundational):** Dominance, Transitivity, Static Coherence.
      *   **Section 2: The Ambiguity-Specific Desiderata:** Capturing the Phenomenon, Distinguishing Risk/Uncertainty.
      *   **Section 3: The Dynamic & Informational Constraints (Where the fights happen):** Dynamic Consistency, Updating, Information Value.
      *   **Section 4: The Incompatibility Theorems:** Explicitly state what can't be held together.
      *   **Section 5: Brief Scorecard:** MEU, Smooth Ambiguity, SEU.
      *   **Conclusion:** Summary of the landscape.

  7.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone:* Academic but accessible, matching the user's "rabbit hole" energy.
      *   *Precision:* Ensure terms like "Dynamic Consistency" and "Reduction of Compound Lotteries" are defined clearly in context.
      *   *Check:* Did I answer the specific prompt about "what a theory has to deliver"? Yes.
      *   *Check:* Did I flag the incompatibilities? Yes, this is crucial.
      *   *Check:* Did I evaluate the models briefly? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just list axioms. I need to explain *why* they are desiderata. For example, why is Dynamic Consistency desirable? Because otherwise, you can be manipulated over time. Why might we drop it? Because preserving ambiguity aversion seems more important to some.
      *(Refining the "Non-Negotiable" list)*: Actually, "Descriptive Fit" isn't non-negotiable for a *normative* theory. A normative theory can say "Ellsberg choices are wrong." So I need to distinguish between a *Descriptive* theory of ambiguity and a *Normative* theory of rationality under ambiguity. The user asks for a theory of "decision under ambiguity," which implies describing the behavior, but the debate is about *rationality*. I should frame the desiderata as "What makes a theory *compelling*," acknowledging the tension between descriptive and normative goals. I will categorize them as "Structural Integrity" (Logic) vs. "Phenomenological Adequacy" (Ellsberg) vs. "Dynamic/Informational Hygiene."

      *(Refining the Incompatibility)*: The most famous tension is between Ambiguity Aversion and Dynamic Consistency (without giving up Reduction). I need to cite the specific tension: Consequentialism + Dynamic Consistency + Ambiguity Aversion is often impossible.

  8.  **Final Polish:** Check against the user's specific request for "motivation for each requirement" and "which ones are non-negotiable." Ensure the distinction between Risk (known) and Ambiguity (unknown) is central.

      *Let's organize the Desiderata into three tiers:*
      1.  **Table Stakes (Logic & Coherence):** Dominance, Transitivity.
      2.  **The Ambiguity Core (Defining the Phenomenon):** Risk/Uncertainty Distinction, Ellsberg Compatibility.
      3.  **The Dynamic/Epistemic Frontier (Where theories break):** Dynamic Consistency, Bayesian Updating, Information Valuation.

      *Incompatibility:* The "Impossible Trinity": Ambiguity Aversion + Dynamic Consistency + Reduction of Compound Lotteries.

      *Models:*
      *   SEU: Fails Ellsberg.
      *   MEU (Maxmin): Handles Ellsberg, struggles with Dynamic Consistency/Updating.
      *   Smooth Ambiguity (Klibanoff et al.): Separates attitudes, handles Ellsberg, but still faces dynamic tensions.

      *Wait, one nuance:* The user asked for "what a theory of decision under ambiguity actually has to deliver." This implies a theory that *accepts* ambiguity as a real category. So SEU is technically a theory that *denies* the category. I should frame SEU as the "Null Hypothesis" that fails the "Ambiguity Core" desideratum.

