answer: |-
  You have hit on the exact meta-theoretical fracture that makes this literature so frustrating. Most papers assume their axioms are self-evidently "rational" without justifying why those specific axioms constitute rationality in the presence of missing information.

  To build a theory of decision under ambiguity that doesn't just talk past its critics, it needs to satisfy a hierarchy of requirements. Some are logical necessities (otherwise the agent is incoherent), some are definitional (otherwise it isn't a theory of *ambiguity*), and some are normative ideals (which often turn out to be incompatible with the definitional ones).

  Here are the desiderata for an adequate theory of decision under ambiguity, categorized by their status.

  ---

  ### I. The Table Stakes (Non-Negotiable Structural Integrity)
  *If a theory fails these, it is logically broken, regardless of how well it fits data.*

  **1. Weak Order (Transitivity and Completeness)**
  *   **Requirement:** If you prefer A to B and B to C, you must prefer A to C. You must be able to compare any two acts.
  *   **Motivation:** Without transitivity, you are susceptible to a "money pump" (trading A for B, B for C, C for A, losing money each time). Without completeness, the theory cannot generate a choice.
  *   **Status:** **Non-Negotiable.** (Though some non-standard logics relax completeness, for standard decision theory, this is the floor).

  **2. State-wise Dominance**
  *   **Requirement:** If Act A yields a better outcome than Act B in every possible state of the world, you must prefer A.
  *   **Motivation:** This is the minimal definition of instrumental rationality. If you reject this, you are actively choosing to make yourself worse off regardless of how reality turns out.
  *   **Status:** **Non-Negotiable.** (Almost no theory violates this explicitly, though some violate it implicitly through framing).

  ---

  ### II. The Ambiguity Core (Definitional Requirements)
  *If a theory fails these, it is not a theory of ambiguity; it is just Expected Utility Theory (EUT) in disguise.*

  **3. The Risk/Uncertainty Distinction (Violation of Reduction)**
  *   **Requirement:** The theory must treat a known probability distribution (Risk) differently from an unknown distribution (Ambiguity). Specifically, it must violate the **Reduction of Compound Lotteries**.
  *   **Motivation:** In EUT, a two-stage lottery (pick a coin, then flip it) is mathematically reduced to a single probability. In ambiguity, the *source* of the probability matters. If your theory reduces all uncertainty to a single subjective prior probability, you cannot model Ellsberg behavior.
  *   **Status:** **Non-Negotiable for an Ambiguity Theory.** (EUT fails this by design).

  **4. Ellsberg Compatibility**
  *   **Requirement:** The model must permit the preference pattern: $Red \succ Black$ and $(Black \cup Yellow) \succ (Red \cup Yellow)$.
  *   **Motivation:** This is the empirical phenomenon that launched the field. A theory of ambiguity that forces agents to be ambiguity-neutral is descriptively inadequate and normatively suspect (since it forbids a preference for robustness).
  *   **Status:** **Non-Negotiable for Descriptive Adequacy;** **Contested for Normative Rationality.** (The "Ambiguity is a Mistake" camp argues a rational agent *should* violate this, but then they aren't offering a theory of ambiguity aversion, they are offering a theory of error).

  ---

  ### III. The Dynamic & Epistemic Frontier (The Battleground)
  *These are the criteria where the "Rationality" wars are fought. You usually cannot satisfy all of them simultaneously.*

  **5. Dynamic Consistency**
  *   **Requirement:** If you plan to choose A tomorrow in a specific state, and tomorrow arrives and nothing new has happened except the passage of time, you must still choose A. Your future self cannot contradict your past self's contingent plans.
  *   **Motivation:** If you violate this, you are "time inconsistent." An external manipulator could exploit you by offering you trades based on your future change of mind. It is essential for strategic planning and game theory.
  *   **Status:** **High Priority Normative Goal,** but often **Sacrificed.**

  **6. Consequentialism (Savage's Sure Thing Principle)**
  *   **Requirement:** Your choice should depend only on the outcomes in the states where the acts differ. If two acts yield the same outcome in state $S_1$, what happens in $S_1$ shouldn't influence your preference between them.
  *   **Motivation:** Sunk costs and irrelevant alternatives shouldn't matter. This is the engine that drives Bayesian updating.
  *   **Status:** **High Priority Normative Goal,** but **Incompatible with Ambiguity Aversion** in dynamic settings.

  **7. Bayesian Updating (Coherent Learning)**
  *   **Requirement:** When new information arrives, beliefs must be updated via Bayes' rule (or a clear generalization of it).
  *   **Motivation:** If you don't update coherently, you ignore information or double-count it. A theory of decision under uncertainty must explain how uncertainty resolves over time.
  *   **Status:** **High Priority,** but **Difficult to Define** when priors are sets or second-order distributions.

  **8. Information Neutrality (Value of Information)**
  *   **Requirement:** Free information should never have negative expected value. You should never pay to *avoid* knowing the odds.
  *   **Motivation:** In EUT, information allows you to condition your act on the state, which can only help. If a theory allows "Information Aversion" (paying to remain ignorant of the true probabilities), it looks like irrational denial.
  *   **Status:** **Contested.** Ambiguity aversion often implies information aversion (I don't want to know the urn is mostly black).

  ---

  ### IV. The Impossible Trinity (The Incompatibility Theorems)

  This is the part you specifically asked to flag. There is a fundamental tension in the mathematics of decision theory. You generally cannot hold the following three positions simultaneously:

  1.  **Ambiguity Aversion** (Ellsberg preferences).
  2.  **Dynamic Consistency** (Your future self agrees with your current self).
  3.  **Consequentialism / Reduction** (You evaluate acts based on final outcomes, not the tree structure).

  **The Trade-off:**
  *   **If you keep Dynamic Consistency + Consequentialism:** You are forced back into Subjective Expected Utility (SEU). You cannot have ambiguity aversion. (This is the argument of the "Ambiguity is a Mistake" camp, e.g., Al-Najjar & Weinstein).
  *   **If you keep Ambiguity Aversion + Consequentialism:** You must accept **Dynamic Inconsistency**. Your preferences will flip as time passes. (This is the standard Maxmin Expected Utility path).
  *   **If you keep Ambiguity Aversion + Dynamic Consistency:** You must violate **Consequentialism/Reduction**. You have to care about *how* the uncertainty resolves (the tree structure), not just the final outcome. (This is the Recursive Utility / Epstein-Schneider path).

  **Why this matters:** Most papers arguing ambiguity aversion is "rational" are implicitly arguing that Dynamic Consistency is less important than Robustness. Most papers arguing it is "irrational" are implicitly arguing that Dynamic Consistency is the definition of rationality. They are arguing past each other because they rank these desiderata differently.

  ---

  ### V. Scorecard: How the Main Approaches Stack Up

  Here is how the major frameworks perform against the desiderata above.

  #### 1. Subjective Expected Utility (SEU) / Savage
  *   **The "Ambiguity is a Mistake" Camp.**
  *   **Performance:**
      *   *Table Stakes:* Passes (Dominance, Transitivity).
      *   *Ambiguity Core:* **Fails.** It collapses risk and ambiguity into a single prior. It cannot generate Ellsberg preferences without assuming the agent is "irrational."
      *   *Dynamic/Epistemic:* Passes everything (Dynamic Consistency, Bayesian Updating, Information Neutrality).
  *   **Verdict:** Logically pristine, descriptively false. It solves the incompatibility by denying the existence of ambiguity.

  #### 2. Maxmin Expected Utility (MEU) / Gilboa-Schmeidler
  *   **The "Robustness" Camp.**
  *   **Mechanism:** The agent has a *set* of priors and maximizes utility based on the worst-case prior in that set.
  *   **Performance:**
      *   *Table Stakes:* Passes.
      *   *Ambiguity Core:* **Passes.** Perfectly captures Ellsberg. Distinguishes risk from uncertainty.
      *   *Dynamic/Epistemic:* **Fails Dynamic Consistency.** Because the "worst case" prior can shift as you move through a decision tree, your future self may contradict your past self. It also struggles with Bayesian updating (how do you update a *set* of priors? usually via prior-by-prior Bayesian updating, which can lead to dilation).
  *   **Verdict:** Great for static robustness, dangerous for dynamic planning.

  #### 3. Smooth Ambiguity Model (Klibanoff, Marinacci, Mukerji - KMM)
  *   **The "Separation" Camp.**
  *   **Mechanism:** Separates the *belief* about probabilities (second-order) from the *attitude* toward ambiguity (a curvature function).
  *   **Performance:**
      *   *Table Stakes:* Passes.
      *   *Ambiguity Core:* **Passes.** Captures Ellsberg while allowing for ambiguity *seeking* in some contexts.
      *   *Dynamic/Epistemic:* **Mixed.** It handles updating better than MEU because it maintains a second-order probability distribution. However, to maintain Dynamic Consistency, it often requires specific functional forms that constrain the ambiguity attitude, effectively pushing it back toward SEU in the long run.
  *   **Verdict:** The most flexible descriptively, but still faces the "Impossible Trinity" in dynamic environments.

  #### 4. Recursive Ambiguity (Epstein-Schneider)
  *   **The "Dynamic Consistency" Camp.**
  *   **Mechanism:** Builds ambiguity aversion directly into the recursive structure of the utility function over time.
  *   **Performance:**
      *   *Table Stakes:* Passes.
      *   *Ambiguity Core:* **Passes.**
      *   *Dynamic/Epistemic:* **Passes Dynamic Consistency.** But it does so by violating **Consequentialism**. The agent cares about the timing of the resolution of uncertainty. They might prefer to know bad news early vs. late, which SEU says shouldn't matter.
  *   **Verdict:** The most sophisticated for dynamic problems, but requires accepting that "how you find out" matters as much as "what you find out."

  ### Summary for your Rabbit Hole
  If you want to evaluate a paper, look for where they sit on the **Impossible Trinity**.
  *   If they say ambiguity aversion is rational, check if they admit their agent will be dynamically inconsistent (MEU) or if they admit their agent cares about the resolution of information (Recursive).
  *   If they say ambiguity aversion is irrational, check if they are assuming Dynamic Consistency is the only definition of rationality (SEU).

  An adequate theory must explicitly state which of the Dynamic/Epistemic desiderata it is willing to sacrifice to preserve the Ambiguity Core. Most of the confusion in the literature comes from authors treating Dynamic Consistency as a "Table Stake" (Non-Negotiable) when it is actually a "Camp Preference" that is mathematically incompatible with the phenomenon they are trying to model.
