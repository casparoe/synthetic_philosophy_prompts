answer: |-
  This is a profound question that cuts to the heart of inductive reasoning. You are right to be skeptical of the "abstract/unexpected" label; it is a placeholder for our ignorance about the mechanism of failure.

  To understand why Bongard problems (BPs) exhibit such a sharp cliff in difficulty, we need to move away from the idea that the solver is merely searching a fixed space of rules. Instead, the solver is engaged in a two-stage process: **vocabulary selection** followed by **rule search**.

  Here is an account of the phenomenon based on concept induction, representation, and the structure of the hypothesis space.

  ### 1. The Hierarchy of Description Languages
  The fundamental error in modeling BP solving is assuming a single, flat space of candidate rules. In reality, there is a hierarchy of **description languages** (or vocabularies).

  *   **Level 0 (Raw Data):** Pixel arrays, edge maps.
  *   **Level 1 (Primitives):** Geometric shapes (circle, triangle), properties (red, large), counts (3 items).
  *   **Level 2 (Relations):** Inside, outside, above, parallel, symmetric.
  *   **Level 3 (Higher-Order):** "The number of sides equals the number of internal dots," "Convexity of the container matches concavity of the content."

  A "rule" is only simple if expressed in the *correct* language.
  *   **Easy BPs:** The rule is expressible in Level 1 or 2 using the solver's *default* vocabulary (e.g., "Left has circles, Right has squares"). The search space is small, and the examples carve out the solution immediately.
  *   **Hard BPs:** The rule requires a vocabulary shift. The solver is trying to find a pattern using Level 1 primitives (e.g., counting shapes), but the actual rule exists at Level 3 (e.g., comparing topological properties).

  ### 2. How Examples Carve the Space
  You asked about the relationship between the candidate space and the examples. In a standard inductive setting, examples act as **constraints** that prune the hypothesis space.

  If your vocabulary is fixed (e.g., "shape type" and "color"), 12 examples will rapidly eliminate all rules inconsistent with the data. However, this assumes the *true rule* is representable in that vocabulary.

  In hard Bongard problems, the examples do not carve the space effectively because **the true rule lies outside the current search space.**
  *   **The Equivalence Class Problem:** The examples partition the space of *possible descriptions* into "consistent" and "inconsistent." If your vocabulary is wrong, the "consistent" set is still enormous and contains no generalization that separates Left from Right meaningfully. You end up with a set of ad-hoc descriptions that fit the data but don't compress it (e.g., "Box 1 has X, Box 2 has Y...").
  *   **The Sharp Cliff:** Difficulty is binary because conceptual spaces are discrete. You are either using a vocabulary that contains the rule (easy) or you are not (hard). There is no gradient. You cannot be "slightly" in the wrong conceptual framework; you are either seeing the objects as "lines" or as "regions." Until you switch, the rule is mathematically invisible, not just hard to find.

  ### 3. Search vs. Representation vs. Abstraction
  To answer your specific triad: **It is primarily a representational problem, mediated by abstraction level selection.**

  *   **Search:** Once the correct representation is chosen, search is trivial. If you describe the images as "sets of nested polygons," checking for "count of nesting levels" is computationally cheap.
  *   **Abstraction:** This is the control knob. The solver must decide whether to treat a cluster of dots as "multiple objects" (low abstraction) or "a texture" (high abstraction).
  *   **Representation:** This is the bottleneck. The solver must construct a symbolic description of the image *before* it can test rules. Hard BPs force the solver to discard the obvious representation (e.g., "these are shapes") and adopt a non-obvious one (e.g., "these are vectors," or "these are shadows").

  **Why the cliff?**
  Because the space of representations is not continuous. You cannot gradient-descend from "seeing shapes" to "seeing topological invariants." You have to make a discrete jump. If your system relies on similarity metrics (like most neural nets), it will fail because the visual similarity between Left and Right boxes might be high, while the conceptual difference is absolute.

  ### 4. The Re-description Phenomenon
  You noted that more examples often don't help, but a single re-description makes the rule obvious. This is the strongest evidence for the **Representational Bottleneck** theory.

  *   **More Examples:** Adding data only helps if you are searching the *right* space. If you are looking for a needle in a haystack, more light helps. If you are looking for a needle in a forest because you think it's a haystack, more light just shows you more trees. In hard BPs, the solver is often optimizing a rule in the wrong language. More examples just reinforce overfitting to that wrong language.
  *   **Re-description:** This changes the **prior probability** of the rules.
      *   *Before:* "Number of vertices" is a high-prior concept. "Parity of enclosed regions" is a low-prior concept.
      *   *After:* If you are told "Look at the spaces between the lines," you have shifted the vocabulary. Suddenly, "Number of enclosed regions" becomes a primitive. The rule, which was previously a complex, low-probability conjunction of many primitives, collapses into a single, high-probability primitive.
      *   **Compression:** A good rule compresses the data. In the wrong vocabulary, the shortest description of the Left/Right difference is just listing the boxes. In the right vocabulary, the description is one word ("Convexity"). Re-description unlocks the compression.

  ### 5. Where This Account Breaks (Uncertainty & Limitations)
  This explanation relies on a "Symbolic/Conceptual Bottleneck" model. Here is where it is most vulnerable:

  **1. The Origin of Primitives (The Grounding Problem)**
  My account assumes the solver has access to a library of concepts (inside, count, parity, etc.) and just needs to select the right ones.
  *   *Weakness:* Where does this library come from? If it's innate, why do humans vary in BP performance? If it's learned, how was it learned without solving BPs first?
  *   *Revision Condition:* If evidence shows that solvers can solve *novel* types of BPs (involving physics or causality) without prior exposure to those concepts, the "fixed vocabulary" model breaks. It would suggest the system can generate *new* primitives on the fly, not just select old ones.

  **2. The Role of Sub-symbolic Processing**
  Recent work in neural-symbolic AI suggests that "re-description" might not be a discrete symbolic jump but a continuous shift in attention weights.
  *   *Weakness:* My account treats representation as discrete (either you see it as lines or regions). It is possible that "aha!" moments are actually the result of slow, continuous parameter tuning that suddenly crosses a threshold.
  *   *Revision Condition:* If a pure end-to-end neural network (with no symbolic module) begins to solve hard BPs reliably and exhibits "sudden" learning curves similar to humans, it would suggest the "representational jump" is an emergent property of high-dimensional optimization, not a symbolic logic switch.

  **3. The "Single Rule" Assumption**
  The premise of BPs is that there is *one* rule.
  *   *Weakness:* In reality, many hard BPs are ambiguous. Humans resolve this using "meta-priors" about what kind of puzzle the designer would make (e.g., "It shouldn't be about pixel counting").
  *   *Revision Condition:* If it turns out that "hard" BPs are actually just under-constrained problems that require social reasoning (Theory of Mind about the puzzle creator) rather than pure induction, then the difficulty isn't about concept space, but about **pragmatics**. The "rule" isn't in the images; it's in the context of the game.

  ### Summary
  The sharp variance in Bongard difficulty is not about the complexity of the rule, but the **distance between the solver's default descriptive vocabulary and the vocabulary required to state the rule compactly.**

  *   **Easy:** Rule is in the default vocabulary. Search is fast.
  *   **Hard:** Rule is in a distant vocabulary. Search is impossible because the target doesn't exist in the current space.
  *   **More Examples:** Fails because it adds data to the wrong model.
  *   **Re-description:** Succeeds because it swaps the model for one where the rule is a primitive.

  The least secure part of this story is the assumption that the "vocabularies" are discrete and pre-existing. If the brain generates new conceptual primitives dynamically during the viewing process, the "search vs. representation" distinction collapses into a single process of **constructive perception**, which we currently have no formal mathematics to describe.
