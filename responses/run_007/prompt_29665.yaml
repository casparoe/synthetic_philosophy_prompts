answer: |-
  ### Essay Question

  **Rousseau insists that the impossibility of the theater serving as a school of morals is not a matter of the plays performed, but of the theatrical situation itself.** In the *Letter to M. d'Alembert*, reconstruct Rousseau's argument for why the structural relationship between spectator and stage inevitably frustrates moral improvement. In your answer, explain the specific work done by **spectator distance** and **amour-propre** in neutralizing the moral content of a play. Finally, demonstrate why this aesthetic critique is unintelligible without reference to the **Genevan political context**, and explain how the **civic festival** functions as the structural antidote to the theater within that specific republic.

  ***

  ### Model Answer

  Rousseau's *Letter to M. d'Alembert* is frequently misread as a Puritanical condemnation of specific immoral plays. However, Rousseau's deeper claim is that theater is structurally incapable of moral edification, regardless of the virtue depicted on stage. The failure lies not in the *content* of the representation, but in the *form* of spectatorship. For Rousseau, the theater creates a psychological and political dynamic that actively undermines the active virtue required of a citizen.

  The core of this structural failure is the distance between the spectator and the action. In the darkness of the auditorium, the spectator is rendered passive. Rousseau argues that natural pity is aroused by suffering, but in the theater, this pity is purged without requiring action. We weep for Hecuba, but we do nothing to save her. This catharsis is politically dangerous because it allows the spectator to feel virtuous without acting virtuously. The sentiment is exhausted in the applause; the tear is the end of the duty, not the beginning. By satisfying our moral impulses through representation, theater disincentivizes moral action in the real world.

  This passivity is fueled by *amour-propre* (inflamed self-love). In the social space of the theater, we do not judge the play solely on its merit, but on how our judgment reflects upon us. We applaud virtue on stage to signal our own sensitivity to virtue. Rousseau notes that we praise characters who resemble us in our good qualities and forgive those who resemble us in our vices. Thus, the theater becomes a mirror of self-congratulation rather than a catalyst for self-correction. The spectator leaves the theater pleased with themselves, having paid the "tax" of their tears, and returns to their private life unchanged. The structure of spectatorship transforms moral duty into an aesthetic commodity consumed for self-satisfaction.

  This aesthetic argument is unintelligible without the Genevan political context. Rousseau is not writing for Paris, a large monarchy where isolation is already the norm. He is writing for Geneva, a small republic that relies on the transparency of manners and the active participation of citizens. In a republic, the "general will" requires that private interests align with the public good. The theater, however, encourages privatization. It gathers people in the dark to focus on a fictional world, drawing them away from the public square. It introduces actors—professional liars paid to feign passion—which undermines the republican value of transparency. For Geneva, where citizenship is a public office, the theater's encouragement of passivity and opacity is a political threat, not merely an aesthetic preference.

  Consequently, Rousseau contrasts the theater with the civic festival. If the theater is defined by separation (stage vs. audience, actors vs. spectators), the festival is defined by dissolution of boundaries. In the festival, there are no spectators; everyone is a participant. There is no stage, only the public square; no darkness, only the light of day. The festival does not represent the community; it *constitutes* it in the moment of celebration. By removing the distance that fuels *amour-propre*, the festival reinforces the social bond. It transforms the passive consumption of virtue into the active experience of unity. Thus, Rousseau's rejection of theater is ultimately a defense of a specific political ontology: a republic cannot survive if its citizens practice virtue only in the dark, while watching others live it for them.

  ***

  ### Marking Scheme

  **Total Points:** 100
  **Grade Thresholds:** A (90-100), B (80-89), C (70-79)

  #### 1. Structural vs. Contingent Analysis (40 Points)
  *This criterion assesses the student's ability to distinguish Rousseau's philosophical argument from moralizing.*

  *   **A Range (36-40 pts):** Explicitly argues that the failure of theater is **structural/formal**, not contingent on the quality of plays. Explains that even "good" plays fail because the *mechanism* of spectatorship neutralizes moral content. Identifies the "purging of pity without action" as a systemic feature of the theater.
  *   **B Range (32-35 pts):** Accurately reports Rousseau's claims that theater does not improve morals. May mention passivity, but treats the failure as a list of negative effects (e.g., "it makes people lazy") rather than a structural inevitability of the spectator/actor divide. Might imply that "better plays" could theoretically help, missing Rousseau's point.
  *   **C Range (<32 pts):** Relies on stock summaries (e.g., "actors are hypocrites," "plays are smutty," "passions are inflamed"). Treats the argument as a moral condemnation of content rather than a political critique of form.

  #### 2. Mechanisms of Spectatorship: Distance and *Amour-Propre* (30 Points)
  *This criterion assesses the psychological reconstruction of the argument.*

  *   **A Range (27-30 pts):** Clearly explains how **distance** creates passivity (the "tax of tears"). Explains **amour-propre** specifically as the spectator's self-congratulation (applauding virtue to feel virtuous oneself) rather than generic "pride." Connects these two: distance allows *amour-propre* to operate unchecked in the dark.
  *   **B Range (24-26 pts):** Defines *amour-propre* and distance correctly but treats them as separate points. Explains that spectators are passive, but misses the nuance of *why* (the exhaustion of sentiment). Definition of *amour-propre* may be generic (vanity) rather than specific to the theatrical context (self-justification).
  *   **C Range (<24 pts):** Vague references to "human nature" or "sin." Fails to explain the psychological mechanism of the spectator.

  #### 3. Political Context and the Civic Festival (30 Points)
  *This criterion assesses the integration of aesthetics and politics.*

  *   **A Range (27-30 pts):** Argues that the aesthetic critique is **dependent** on the Genevan context (Small Republic = need for transparency/activity). Contrasts Theater vs. Festival as **structural opposites** (representation vs. participation, darkness vs. light, separation vs. unity). Shows how the festival solves the structural problem of the theater.
  *   **B Range (24-26 pts):** Mentions Geneva and the Festival. Explains that Geneva is a republic and festivals are "better." However, treats the context as background information rather than essential to the argument. The Festival is described as "fun" or "wholesome" rather than a political antidote to spectatorship.
  *   **C Range (<24 pts):** Genevan context is missing or tacked on at the end. Festival is mentioned but not contrasted structurally with the theater.

  #### Differentiator Note for Graders:
  To award an **A**, the essay must demonstrate that the student understands Rousseau is not saying "Theater makes people bad," but rather "Theater makes moral improvement *impossible* by its very design, which is incompatible with Republican citizenship." A **B** student will accurately summarize *that* Rousseau dislikes theater and *that* he prefers festivals, but will miss the logical necessity connecting the structure of the stage to the structure of the state.
