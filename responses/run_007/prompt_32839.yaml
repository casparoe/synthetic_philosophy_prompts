answer: |-
  Your observation about the inconsistency between our use of sortition for juries and elections for legislatures strikes at the very heart of modern democratic theory, and it is surprising how rarely this tension is examined with the seriousness it deserves. We have normalized a system where we trust a random cross-section of citizens to decide matters of life and death within the judicial sphere, yet we deem that same random cross-section unfit to decide matters of tax policy or war in the legislative sphere. To understand why this is, we have to excavate the implicit theory that undergirds the practice of competitive elections, because the practice is not neutral. It carries a heavy philosophical load regarding legitimacy, competence, and representation, and much of that load is hidden by the sheer familiarity of the ritual.

  When we examine the practice of legislative election, the primary presupposition concerning legitimacy is that political authority derives from explicit consent expressed through choice. In this view, a law is legitimate not because it is wise or just in the abstract, but because it was enacted by officials whom the people chose. This is a theory of authorization. The voter transfers their right to rule to the representative for a fixed term. This stands in contrast to the legitimacy of sortition, which rests on equality of opportunity. In a lottery, legitimacy comes from the fact that every citizen had an equal mathematical chance of being selected, mirroring the democratic ideal of equality rather than the liberal ideal of consent. The electoral practice presupposes that legitimacy requires a moment of active endorsement, whereas sortition presupposes that legitimacy requires a lack of exclusion. This is why the jury feels fair despite lacking campaigning; its fairness is rooted in the equal burden shared by all, whereas the legislature feels legitimate only when we have participated in the hiring process.

  Regarding competence, the practice of election presupposes an aristocratic principle, to use the term in its classical sense. It assumes that political competence is unevenly distributed and that the electoral process is a filter capable of identifying those with superior skill, virtue, or judgment. Campaigns are essentially job interviews where candidates must signal their competence to the electorate. This presupposes that voters can distinguish between better and worse candidates and that the competitive pressure of reelection incentivizes good performance. Sortition, conversely, presupposes that competence is either widely distributed or that it emerges collectively through deliberation. The jury system works on the assumption that twelve random people, when guided by procedure and evidence, can reach a sound verdict together, even if individually they are no experts. The legislative election system rejects this collective epistemology for lawmaking, insisting instead that we need a specialized class of decision-makers. It presupposes that governing is a craft distinct from living, whereas sortition assumes governing is an extension of common sense and shared experience.

  On the question of representation, elections presuppose a formalistic view where the representative stands in for the constituent through authorization, regardless of whether they resemble them. This is often called the trustee model, where the representative is empowered to use their own judgment. Sortition presupposes a descriptive view of representation, where the assembly should be a microcosm of the population. If the legislature is selected by lot, it will statistically mirror the populace in gender, class, and ethnicity. Elections do not guarantee this; in fact, they often systematically filter out marginalized groups. Therefore, the electoral practice presupposes that resemblance is unnecessary for legitimate representation, provided the channel of accountability remains open. We accept that our representative may be nothing like us, so long as we can vote them out. This is a crucial distinction: elections prioritize accountability over resemblance, while sortition prioritizes resemblance over accountability.

  It is important, however, to distinguish what the practice strictly presupposes from what merely fits well with it. Strictly speaking, elections require only that there are differentiated candidates, a mechanism for aggregating preferences, and a consequence for the winner taking office. The practice does not strictly require that voters be well-informed, that money be kept out of politics, or that candidates be virtuous. These are compatible views that make the system work better, but the machinery of election grinds on even when voters are ignorant or candidates are corrupt. The system presupposes choice, not necessarily good choice. Similarly, the system does not strictly require that representatives actually listen to constituents, only that there is a theoretical possibility of removal. In contrast, sortition strictly presupposes that the selected body is large enough to be statistically representative and that there are structures in place to facilitate deliberation among non-experts. If you have a single person selected by lot, sortition fails; it requires a collective body to function, whereas elections can function for a single executive.

  There are also areas where the practice of election is philosophically underdetermined, meaning several rival theories license the practice equally well. For instance, both an elitist theory of democracy, such as Joseph Schumpeter's, and a participatory theory of democracy can endorse elections. Schumpeter viewed elections as a method for selecting leadership elites, where the role of the people is merely to produce a government. A participatory democrat views elections as a means of civic education and expression of the general will. The practice of voting looks the same in both cases, but the justification is entirely different. Similarly, elections are compatible with both a liberal view that prioritizes the protection of minority rights against the majority and a populist view that prioritizes the unfiltered will of the majority. The mechanism of the ballot box does not commit us to one of these ends. This underdetermination allows the practice to persist even as the theoretical consensus fractures, because everyone can project their own theory of legitimacy onto the ritual of voting.

  If we were to replace the presupposed view of elections with the one underlying sortition, the practice of government would change radically, largely because the incentives would shift from persuasion to deliberation. Currently, because legislators must be reelected, their time is dominated by fundraising and campaigning, and their legislative behavior is often signaling to specific constituencies rather than solving problems. If legislators were selected by lot, campaigning would vanish, and with it the need for large-scale fundraising and the influence of donors who seek access to vulnerable incumbents. The concept of a constituency would change from a geographic area to the nation as a whole, or perhaps to no constituency at all, since the legislator represents the public by virtue of being a member of it. Lobbying would likely shift from trying to influence specific committee chairs who hold long-term power to trying to educate a rotating body of citizens who lack entrenched interests.

  Furthermore, the resolution of the inconsistency between juries and legislatures would require us to admit that we do not actually believe lawmaking requires specialized expertise any more than verdict-making does. If we accept the sortition model, we must invest heavily in the infrastructure of deliberation. Randomly selected citizens cannot govern effectively without access to expert testimony, neutral staff, and time to learn the issues, much like jurors are guided by judges and lawyers. This would transform the legislature from a career into a civic duty, similar to jury service. It would also remove the mechanism of retrospective voting as a form of accountability. We could no longer vote out bad actors; instead, accountability would have to be built into the process through transparency, strict rules of conduct, and perhaps the threat of judicial review or recall.

  Ultimately, the inconsistency you have identified suggests that our current system rests on a hybrid theory that we rarely articulate. We treat citizens as competent enough to judge facts in a courtroom and competent enough to choose leaders, but not competent enough to be leaders themselves. Resolving this inconsistency forces a choice. If we stick with elections, we must defend the aristocratic principle that some are fit to rule and others only to choose rulers, and we must accept that our legislature will never descriptively represent the population. If we move toward sortition, we must embrace a more radical equality that trusts the collective wisdom of the populace but sacrifices the direct accountability of the ballot box. The practice of election presupposes that legitimacy flows from below through consent, but sortition suggests legitimacy flows from the structure of the system itself through equality. Until we decide which of these values we prioritize, the wall between the jury box and the legislative seat will remain an unexamined contradiction in the heart of our democracy.
