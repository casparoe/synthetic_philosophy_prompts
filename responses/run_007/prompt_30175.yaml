answer: |-
  Here is the specification sheet for a theory of emotion. These are the phenomena any adequate cognitive science of emotion must accommodate, ranked by their status as hard constraints or theoretical preferences.

  ### The Desiderata List

  **1. The Intentionality Constraint (Aboutness)**
  *   **The Requirement:** The theory must explain how emotions are directed at objects or states of affairs (e.g., fear *of* the dog, anger *at* the insult).
  *   **The Case:** Emotions are not free-floating; they have targets. Moods often lack specific targets; emotions do not.
  *   **Status:** **Non-negotiable.** Without intentionality, you are describing sensations, not emotions.

  **2. The Recalcitrance Constraint**
  *   **The Requirement:** The theory must allow for an emotion to persist despite a contradictory all-things-considered judgment (e.g., fearing flying while judging it safe).
  *   **The Case:** If emotion *were* identical to judgment, recalcitrance would be a logical contradiction (believing P and not-P). Since recalcitrance is common, emotion cannot be identical to judgment.
  *   **Status:** **Non-negotiable.** Denying the existence of recalcitrant emotions contradicts universal phenomenological data.

  **3. The Non-Conceptual Constraint (Evolutionary Continuity)**
  *   **The Requirement:** The theory must account for emotions in infants and non-human animals who lack complex propositional concepts (e.g., "justice," "probability").
  *   **The Case:** A dog can be jealous; an infant can be fearful. If emotion requires high-level cognitive appraisal, these creatures are emotionless, which contradicts behavioral and neurobiological evidence.
  *   **Status:** **Non-negotiable** (for naturalistic cognitive science).

  **4. The Phenomenological Constraint (Feeling)**
  *   **The Requirement:** The theory must explain why emotions feel a certain way (qualia) and why different emotions feel distinct.
  *   **The Case:** There is "something it is like" to be angry that differs from being sad. A theory that reduces emotion to purely functional input-output ignores the internal experience.
  *   **Status:** **Non-negotiable.**

  **5. The Differentiation Constraint (Specificity)**
  *   **The Requirement:** The theory must distinguish between emotions that share physiological profiles (e.g., fear vs. excitement) and those that do not.
  *   **The Case:** As you noted, fear and excitement share arousal (heart rate, etc.). A theory relying solely on bodily feedback (James-Lange) cannot distinguish them without referencing context or cognition.
  *   **Status:** **Non-negotiable.**

  **6. The Motivation Constraint (Action Tendency)**
  *   **The Requirement:** The theory must explain the link between emotion and action (fight, flight, approach, withdraw).
  *   **The Case:** Emotions are not just observations; they are calls to action. Grief slows us; anger mobilizes us.
  *   **Status:** **Non-negotiable.**

  **7. The Normative Constraint (Fittingness)**
  *   **The Requirement:** The theory must explain how emotions can be rational or irrational, appropriate or inappropriate.
  *   **The Case:** We criticize people for being "irrationally angry." Emotions are assessable against standards of correctness, unlike mere sensations (pain isn't "incorrect," but fear can be).
  *   **Status:** **Non-negotiable.**

  **8. The Temporal Structure Constraint**
  *   **The Requirement:** The theory must distinguish between episodes (acute anger), moods (irritability), and traits (irascibility).
  *   **The Case:** These differ in duration, intensity, and intentionality. A monolithic theory of "emotion" fails to capture this architecture.
  *   **Status:** **Camp Preference.** (Some theories treat moods as background emotions; others treat them as distinct categories. The theory just needs to acknowledge the distinction, not necessarily solve it).

  ---

  ### Tensions and Incompatible Pairs

  No theory satisfies all desiderata effortlessly. You will likely have to prioritize one side of these tensions:

  *   **Cognitive Richness vs. Evolutionary Continuity:** To satisfy **Normativity** and **Intentionality**, you want rich cognitive content (Judgment). To satisfy **Infants/Animals**, you want low-level processing (Feeling/Perception). *You cannot have high-concept judgments and infant emotions without positing two different kinds of emotion.*
  *   **Transparency vs. Opacity:** To satisfy **Recalcitrance**, emotions must be somewhat encapsulated (opaque to judgment). To satisfy **Normativity**, they must be responsive to reasons (transparent to judgment).
  *   **Bodily Specificity vs. Cognitive Construction:** To satisfy **Differentiation** (fear vs. excitement), you need cognitive context. To satisfy **Phenomenology**, you often need bodily distinctness. Current evidence suggests bodies are not distinct enough, forcing the burden onto cognition.

  ---

  ### The "Killer" Constraint

  **The Recalcitrance Constraint.**

  This is the single requirement that does the most damage to popular theories.
  *   It logically falsifies **strong Judgment Theories** (you cannot judge *p* and *not-p* simultaneously).
  *   It forces **Feeling Theories** to explain why a mere feeling persists against a judgment (which they usually can't).
  *   It forces **Perceptual Theories** to adopt a complex model of "encapsulated perception" to avoid collapsing back into judgment.
  It is the logical wedge that separates emotion from belief, which is the primary job of a theory of emotion.

  ---

  ### Theory Scorecard

  | Theory | Intentionality | Recalcitrance | Infants/Animals | Phenomenology | Motivation | Normativity | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Feeling** (Somatic) | **FAIL.** Feelings aren't inherently *about* things. | **FAIL.** Hard to explain why feeling overrides safety judgment. | **PASS.** Animals have bodies/feelings. | **PASS.** Core strength. | **WEAK.** Feelings don't inherently drive specific actions. | **FAIL.** Sensations aren't "irrational." | **Eliminated.** Lacks aboutness and reason-responsiveness. |
  | **Judgment** (Cognitive) | **PASS.** Judgments are propositional. | **FAIL.** Makes recalcitrance a logical contradiction. | **FAIL.** Infants lack requisite concepts. | **WEAK.** Judging danger doesn't guarantee feeling fear. | **PASS.** Links well to action plans. | **PASS.** Judgments are assessable. | **Eliminated.** Too intellectual; fails biology and logic. |
  | **Perceptual** (Hybrid) | **PASS.** Perceptions have objects. | **PASS.** Perceptions persist despite contrary belief (illusions). | **PASS.** Perception is non-conceptual. | **PASS.** Perceptual experience has qualia. | **PASS.** Perceptions guide action. | **PASS.** Perceptions can be inaccurate/misfitting. | **Front-Runner.** Best fit, but struggles to define the "sense organ." |

  **Summary:** The Perceptual Theory is currently the only one that clears the **Recalcitrance** and **Infant** hurdles simultaneously, treating emotions like visual illusions (you see the stick is bent even when you know it's straight). However, it pays the price of needing to posit a dedicated "emotional modality" which neuroscience has yet to fully isolate.
