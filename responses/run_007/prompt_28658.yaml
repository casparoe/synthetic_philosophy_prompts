      *   *Point 1: The Property vs. The Sentences.* Deflationism says "truth" isn't a *natural kind*. But it doesn't say all sentences are equal. GR entails specific predictions. PT entails different ones. One set of predictions works, the other doesn't. That difference exists *without* needing a heavy metaphysical property of Truth.
      *   *Point 2: What "Progress" Means.* If I swap PT for GR, I'm not getting "more truth stuff." I'm swapping false sentences for true sentences. Since "false" is also deflated ("$P$ is false" $\equiv$ $\neg P$), progress is just moving from asserting $P$ (where $P$ is the case) to asserting $\neg P$ (where $\neg P$ is the case). Wait, that's clunky. Better: Progress is moving from asserting sentences that don't hold to sentences that do hold.
