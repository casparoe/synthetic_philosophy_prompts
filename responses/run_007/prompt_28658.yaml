answer: |-
  This is one of the most famous and potent objections to deflationism. It's often called the **"Problem of Scientific Progress"** or the **"Explanatory Role of Truth."**

  Your intuition is sharp: if truth isn't a substantive property (like mass or charge) that a theory can "possess" to varying degrees, how can we say science is *getting closer* to it? And doesn't that make Einstein and the Phlogiston theorists equally "truth-claimers"?

  Here is what you are missing: **Deflationism denies that truth is a *substantive* property, but it does not deny that some sentences are true and others are false.**

  Here is how a deflationist untangles the knot you've found.

  ### 1. The "Same Footing" Misunderstanding
  You asked: *Aren't "General Relativity is true" and "Phlogiston theory is true" on exactly the same footing?*

  **The Deflationist Answer:** No. They are on radically different footings, but the difference lies in the **theories**, not in the **truth predicate**.

  According to the disquotation schema:
  *   "General Relativity is true" $\equiv$ General Relativity.
  *   "Phlogiston Theory is true" $\equiv$ Phlogiston Theory.

  So, to ask if they are on the same footing is just to ask: **Is General Relativity on the same footing as Phlogiston Theory?**

  Obviously not. General Relativity yields accurate predictions about light bending and orbital precession. Phlogiston Theory yields failed predictions about combustion and weight gain. The *content* of the theories is different. One set of sentences corresponds to how the world works (in a realist sense, even if the deflationist doesn't use the word "correspondence" as a theory of truth), and the other doesn't.

  The deflationist argues that the word "true" doesn't add any magic sauce to General Relativity. The heavy lifting is done by the physics, not the philosophy. When we say GR is "true," we are just endorsing the physics. When we say Phlogiston is "true," we are endorsing bad physics. The predicate "is true" is transparent; it lets you see the difference in the theories, it doesn't hide it.

  ### 2. What "Progress" Means Without "Truth Stuff"
  Your worry is that if truth isn't a "thing," you can't have "more" of it. You can't progress *toward* it.

  The deflationist replies: **Scientific progress isn't about accumulating a metaphysical substance called Truth.** It's about **replacing less warranted assertions with more warranted assertions.**

  *   **Past:** We asserted "Phlogiston is released during combustion." (This assertion is false, i.e., Phlogiston is not released...)
  *   **Present:** We assert "Oxygen combines during combustion." (This assertion is true, i.e., Oxygen combines...)

  Progress is the move from asserting $P$ to asserting $Q$, where $Q$ allows us to navigate the world successfully and $P$ does not. We don't need a heavy-duty property of "Truth" to explain why $Q$ is better than $P$. We explain why $Q$ is better by pointing to experiments, predictions, and coherence.

  For the deflationist, saying "Science progresses toward the truth" is just a shorthand way of saying: **"Over time, science tends to discard sentences that fail empirical tests and adopt sentences that pass them."** You don't need a robust theory of truth to make that claim; you just need a theory of empirical testing.

  ### 3. The Trap of "Approximate Truth"
  This is where your intuition hits the hardest spot. We often say, "Newtonian physics isn't *strictly* true, but it's *approximately* true."

  If truth is just disquotation, "approximately true" is tricky. You can't disquote "approximately."
  *   "'Newton's laws are approximately true' is true" $\equiv$ "Newton's laws are approximately true."
  *   This just pushes the problem back. What does "approximately true" mean if "true" is thin?

  **Deflationist Strategy:**
  Many deflationists (like Paul Horwich) argue that "approximate truth" isn't really about truth at all. It's about **empirical adequacy** or **limiting cases**.
  To say Newton is "approximately true" is to say: "Newton's equations yield results that are indistinguishable from Einstein's within a certain domain of low velocity and gravity."

  Notice that this explanation doesn't use the word "truth." It uses math and physics. The deflationist argues that whenever "truth" seems to be doing explanatory work (like explaining success), it's actually just a placeholder for the specific details of the theory (e.g., causal mechanisms, mathematical limits).

  ### 4. Why Keep the Word "True" Then?
  If "is true" doesn't denote a real property, why do we use it? Why not just say "Science progresses toward asserting sentences that work"?

  The deflationist (like Quine) says we need the truth predicate for **logic and generalization**, not for metaphysics.
  *   I can't say: "If Einstein said it, then it." (Grammatically nonsense).
  *   I *can* say: "If Einstein said it, then it is **true**."

  The predicate allows me to generalize over an infinite number of sentences without listing them all. It is a logical device, like the quantifier "all." The fact that we use the word "all" doesn't mean "All-ness" is a magical property of the universe. Similarly, the fact that we use "true" doesn't mean "Truth" is a magical property of sentences.

  ### Summary: What You Were Missing
  You were assuming that for science to progress, "Truth" must be a **goal** in the sense of a destination that exerts a pull, or a **substance** that theories accumulate.

  The deflationist says:
  1.  **Truth is not a goal;** successful prediction and explanation are the goals. "Truth" is just the label we slap on the sentences that achieve those goals.
  2.  **GR and Phlogiston are not on the same footing.** The difference is in the *sentences*, not the *predicate*.
  3.  **Progress is real.** It is the historical shift from asserting sentences that fail to asserting sentences that succeed.

  Deflationism doesn't make science look pointless; it just insists that the *philosophy of truth* shouldn't get in the way of the *science*. The science explains why GR is better than Phlogiston. The word "true" just lets us endorse GR without having to repeat the whole theory every time.

  **The Catch:**
  The one thing you *do* lose with strict deflationism is the ability to say "GR is true *because* it corresponds to reality" as a substantive explanation. A deflationist must say "GR corresponds to reality" is just another way of saying "GR is true," which is just another way of saying "GR." For them, the "correspondence" is not an explanation of truth; it is a restatement of it.

  If you feel that science *needs* a robust correspondence relation to explain why it works (i.e., "It works *because* it matches the world"), then you are likely a **Scientific Realist** who cannot accept deflationism. And that is a perfectly respectable position! Many philosophers (like Putnam, at times, or Boyd) argue exactly what you are feeling: that deflationism makes truth *too* thin to explain the "no miracles" argument for realism.

  But if you stay with the deflationist, their answer is: **"The theory explains the success. 'Truth' is just the name we give to the success."**
