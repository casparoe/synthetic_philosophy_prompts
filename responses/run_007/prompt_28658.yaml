prompt: |-
  ok so i've been reading about deflationary theories of truth and i'm stuck on something. if "is true" doesn't denote a real property and the whole point of the truth predicate is just disquotation — like "'snow is white' is true" just gives you back "snow is white" — then what does it even mean to say science makes progress toward truth? like, if truth isn't a thing you can have more or less of, then aren't "general relativity is true" and "phlogiston theory is true" on exactly the same footing? they both just disquote to themselves. it seems like deflationism forces you to say there's no real difference between a successful theory and a discarded one, which can't be right. what am i missing?
