      *   **Problem:** The user sees "deflationism" used as a catch-all bucket, leading to people talking past each other. They want to know the *actual fault lines*.
      *   **Specific Questions:**
          1.  Does 'true' express a property or is it a logical device?
          2.  How do they handle generalizations (e.g., "Everything the Pope says is true")?
          3.  Status of T-sentences (necessary, analytic, contingent)?
          4.  Is Prosententialism a competitor or just notation?
      *   **Target Audience:** Someone who understands the basic equivalence schema ($p \leftrightarrow \text{'p' is true}$) but wants to know the commitments of specific sub-views.
      *   **Constraint:** No survey/reading list. Focus on conceptual machinery and commitments.

  2.  **Deconstruct the Main Views:**
      *   *Disquotationalism (Quine):* Truth is a device of disquotation. Primarily syntactic. Focus on sentences.
      *   *Minimalism (Horwich):* Truth is a logical property defined by the equivalence schema. Focus on propositions.
      *   *Prosententialism (Grover, Camp, Belnap):* 'True' is part of a prosentence (like a pronoun for sentences). Focus on anaphora.
      *   *(Self-Correction/Refinement):* I should also briefly mention *Redundancy Theory* (Ramsey) as the ancestor, but focus on the three requested. I need to make sure I distinguish between *sentence-based* (Disquotationalism) and *proposition-based* (Minimalism) approaches, as that's a huge fault line.

  3.  **Address Question 1: Property vs. Logical Device:**
      *   *Disquotationalism:* 'True' is *not* a genuine property predicate. It's a logical device to remove quotes. It allows us to say what a sentence says without quoting it.
      *   *Minimalism:* 'True' *does* express a property, but it's a "minimal" or "logical" property. It's not a robust natural property (like mass or charge), but Horwich insists it *is* a property constituted by the schema. This is a key distinction.
      *   *Prosententialism:* 'True' is not a predicate at all in the deep structure. It's part of a pro-form. "That is true" $\approx$ "It is raining" (where 'it' refers to the weather, but here the whole phrase refers to the content). Actually, better: "That is true" functions like "He runs" where 'He' is the pronoun. "That is true" $\to$ prosentence. So, no property.

  4.  **Address Question 2: Generalizations:**
      *   *The Problem:* "Everything the Pope says is true." You can't infinite-conjoin all the Pope's sentences.
      *   *Disquotationalism:* Uses substitutional quantification. $\forall p (\text{Pope says } p \to p)$. But this requires quantifying into sentence positions. Quine is okay with this via semantic ascent. The predicate 'true' allows us to generalize over sentences without naming them individually.
      *   *Minimalism:* Quantifies over *propositions*. $\forall x (\text{Pope accepts } x \to x \text{ is true})$. Since the schema applies to propositions, the generalization is an infinite conjunction of instances of the schema. The utility of 'true' is to finite-ly express this infinite conjunction.
      *   *Prosententialism:* 'True' is part of a variable-binding operator. "Everything the Pope says is true" is parsed as a quantified prosentence. It functions like a bound variable ranging over sentence-positions. $\forall x (\text{Pope says } x \to \text{that is true})$. The 'true' is grammatically necessary to make the prosentence work, but logically it's just the anaphoric link.

  5.  **Address Question 3: Status of T-Sentences:**
      *   *Disquotationalism:* The schema is not a definition, but a rule of use. It's often seen as analytic or constitutive of the meaning of 'true'. However, Quine's version is tied to home-language sentences. T-sentences are trivial but essential for the device to work.
      *   *Minimalism:* The instances of the schema are *axioms*. They are not derived from anything deeper. They are implicitly definitional. Horwich argues they are not analytic in the traditional sense but are the *basis* of the concept. They are necessary in virtue of the concept of truth.
      *   *Prosententialism:* The schema isn't the starting point; the anaphoric function is. T-sentences are consequences of the grammatical rules governing prosentences. They are logically true given the grammar.

  6.  **Address Question 4: Prosententialism's Place:**
      *   It's a competitor regarding *grammar/logical form*. Disquotationalists/Minimalists say 'is true' is a predicate. Prosententialists say it looks like a predicate but acts like a pronoun.
      *   It solves the "generalization" issue elegantly by treating 'true' as part of a quantifier-binding structure rather than a property ascriber.
      *   It handles "blind ascriptions" (e.g., "What he said is true") better than pure disquotation which struggles with indexicals/context.

  7.  **Identify the "Fault Lines" (Synthesis):**
      *   *Fault Line 1: Ontology of Truth Bearers.* Sentences (Disquotationalism) vs. Propositions (Minimalism) vs. Grammatical Roles (Prosententialism).
      *   *Fault Line 2: Logical Form.* Predicate (Disq/Min) vs. Pro-form (Prosentential).
