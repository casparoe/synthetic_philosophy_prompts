answer: |-
  This confusion is well-founded. "Deflationism" is often treated as a single position, but the internal architecture varies significantly. The disagreement isn't just terminological; it concerns the **logical form** of truth ascriptions, the **ontology** of truth-bearers, and the **mechanism** of generalization.

  Here is the gears-level breakdown of the fault lines between **Disquotationalism (Quine)**, **Minimalism (Horwich)**, and **Prosententialism (Grover, Camp, & Belnap)**.

  ---

  ### 1. Does 'True' Express a Property?
  This is the primary ontological fault line.

  *   **Disquotationalism (Quine): NO.**
      *   **The Gear:** 'True' is a logical device, not a descriptive predicate. It is a tool for **semantic ascent**. It allows us to move from talking about the world to talking about words, and back again, without ontological commitment.
      *   **Commitment:** To say "'Snow is white' is true" is to say nothing more than "Snow is white." The predicate 'is true' adds no content; it only removes quotation marks. There is no property of truth, just as there is no property of "quotation-removal."
  *   **Minimalism (Horwich): YES (but minimal).**
      *   **The Gear:** Horwich explicitly rejects Quine's view that 'true' isn't a property predicate. He argues 'true' *does* denote a property, but it is a **logical property** constituted entirely by the equivalence schema.
      *   **Commitment:** Truth is a genuine property of propositions, but it is not a *natural* property (like mass) and it does not *explain* anything (e.g., we don't believe $p$ *because* $p$ is true; the concept of truth doesn't do causal work). It is a property only in the sense that it is a valid node in our logical grammar.
  *   **Prosententialism (Grover et al.): NO (it's a pro-form).**
      *   **The Gear:** 'True' is not a predicate at all in deep structure. It is part of a **prosentence** (analogous to a pronoun). Just as "he" stands in for a noun phrase, "that is true" stands in for a sentence.
      *   **Commitment:** In "That is true," the word 'true' is syncategorematic. It doesn't ascribe a property to 'that'; rather, the whole phrase "that is true" functions as a sentence. Therefore, there is no property because there is no predication.

  **The Fault Line:** If you are a Disquotationalist or Prosententialist, you are eliminating truth from your ontology. If you are a Minimalist, you are keeping truth in your ontology but draining it of explanatory power.

  ---

  ### 2. How Do They Handle Generalizations?
  *The Problem:* "Everything the Pope says is true." You cannot infinite-conjoin every sentence the Pope has ever uttered. How does the truth predicate allow this finite statement to do infinite work?

  *   **Disquotationalism: Substitutional Quantification.**
      *   **The Mechanism:** The statement is parsed as: $\forall p (\text{The Pope says } p \to p)$.
      *   **The Gear:** Quine relies on **substitutional quantification**. The variable $p$ ranges over linguistic items (sentences). The truth predicate allows us to quantify into sentence positions without having to name the sentences individually. It is a device to affirm a set of sentences without uttering them.
      *   **Weakness:** It struggles with context-dependent sentences (e.g., "Everything John said yesterday is true"). If John said "It is raining," the disquotation "It is raining is true" loses the indexical context unless you complicate the theory with time-stamped sentences.
  *   **Minimalism: Infinite Conjunction of Propositions.**
      *   **The Mechanism:** The statement is parsed as: $\forall x (\text{The Pope accepts proposition } x \to x \text{ is true})$.
      *   **The Gear:** Horwich shifts from sentences to **propositions**. Propositions are context-independent. The generalization is equivalent to the infinite conjunction of all instances of the equivalence schema for the propositions the Pope accepts. The utility of 'true' is that it allows us to finite-ly express this infinite conjunction.
      *   **Weakness:** Requires commitment to propositions as abstract objects (which Quine wanted to avoid).
  *   **Prosententialism: Anaphoric Binding.**
      *   **The Mechanism:** "Everything the Pope says is true" is a **quantified prosentence**.
      *   **The Gear:** 'True' functions as part of a variable-binding operator. Think of it like: "For all $x$, if the Pope says $x$, then **that is true**." Here, "that is true" is a prosentence bound by the quantifier. The 'true' is grammatically required to make the prosentence function, but logically it acts as an anaphoric link back to the quantifier.
      *   **Advantage:** Handles blind ascriptions and indexicals better. "What he said is true" works like "He is tall"—the reference is fixed by the antecedent, not by disquoting a specific string.

  **The Fault Line:** Disquotationalists quantify over *sentences* (syntactic); Minimalists quantify over *propositions* (semantic); Prosententialists quantify over *sentence-positions* via anaphora (grammatical/logical).

  ---

  ### 3. Status of the T-Sentences (Equivalence Schema)
  *The Schema:* $\langle p \rangle \text{ is true} \leftrightarrow p$

  *   **Disquotationalism: Rules of Use.**
      *   **Status:** The schema is not a set of truths to be believed, but a **rule of inference** or a definition of the device.
      *   **Necessity:** It is analytic in the sense that it defines the word 'true' in the home language.
      *   **Downstream:** You cannot derive the schema from deeper facts. It is the bedrock. However, Quine restricts it to home-language sentences to avoid paradox and translation issues.
  *   **Minimalism: Implicit Definition (Axioms).**
      *   **Status:** The instances of the schema are **axioms**. They are the fundamental theory of truth.
      *   **Necessity:** They are necessary truths, but not because of meaning alone (Horwich rejects traditional analyticity). They are necessary because they constitute the concept of truth.
      *   **Downstream:** This is the biggest divergence. For Horwich, the *only* fact about truth is the collection of these axioms. Any attempt to explain *why* the schema holds (e.g., via correspondence) is a category error.
  *   **Prosententialism: Grammatical Consequences.**
      *   **Status:** The schema is a **theorem** derived from the rules of anaphora.
      *   **Necessity:** It is logically true given the grammatical rules governing prosentences.
      *   **Downstream:** The T-sentence isn't the starting point; the anaphoric function of language is. The equivalence holds because "That is true" and "That" are interchangeable in assertion conditions.

  **The Fault Line:** Is the schema the *definition* (Disquotationalism), the *theory* (Minimalism), or a *consequence of grammar* (Prosententialism)?

  ---

  ### 4. Is Prosententialism a Competitor or Notation?
  It is a **competitor regarding logical form**, but often an ally regarding metaphysics.

  *   **Why it's a competitor:** Disquotationalists and Minimalists treat 'is true' as a predicate (syntax: $Fa$). Prosententialists treat it as part of a pro-sentence (syntax: $S_{pro}$). This matters for paradoxes and logical formalization. If 'true' is a predicate, it can be diagonalized (leading to Liar Paradoxes). If it's a prosentence, the logical form blocks certain formulations of the Liar.
  *   **Why it feels like notation:** It achieves the same metaphysical result as Quinean Disquotationalism (no robust property of truth).
  *   **The Unique Move:** Prosententialism is the only one that takes **anaphora** seriously as the core function.
      *   *Example:* "If the first premise is true, then the conclusion is true."
      *   *Disquotationalist:* Struggles to parse this without reifying sentences.
      *   *Prosententialist:* Parses this easily. "If [prosentence 1], then [prosentence 2]." The 'true' is just the marker that allows the anaphoric reference to function within a conditional.

  ---

  ### Summary of Commitments (The "Signing Up" Sheet)

  | Feature | **Disquotationalism (Quine)** | **Minimalism (Horwich)** | **Prosententialism (Grover/Camp/Belnap)** |
  | :--- | :--- | :--- | :--- |
  | **Truth Bearers** | Sentences (utterances/types) | Propositions | Sentences (via grammatical role) |
  | **Logical Form** | Predicate (but redundant) | Predicate (expressing minimal property) | Pro-form (part of a prosentence) |
  | **Property?** | No (Logical Device) | Yes (Minimal/Logical Property) | No (Grammatical Marker) |
  | **Generalization** | Substitutional Quantification | Infinite Conjunction of Propositions | Quantified Prosentences (Anaphora) |
  | **T-Schema** | Rule of Disquotation | Axioms / Implicit Definition | Consequence of Anaphoric Rules |
  | **Main Vulnerability** | Indexicals / Context dependence | Commitment to Propositions | Complexity of grammatical analysis |

  ### The Real Downstream Disagreements
  If you defend one over the others, here is what you are buying into:

  1.  **If you choose Minimalism:** You must defend the existence of **propositions** as distinct from sentences. You are committed to a platonic(ish) ontology of content, even if you deny a robust property of truth. You also commit to the idea that the T-schema instances are *facts* (axioms), not just rules.
  2.  **If you choose Disquotationalism:** You are committed to **semantic ascent**. You must handle context/indexicals by complicating the relata (e.g., "true-in-context-C"). You avoid propositions but make truth language-relative.
  3.  **If you choose Prosententialism:** You are committing to a specific **logical grammar**. You need to show that 'true' can be eliminated in favor of prosentences in all cases (including "It is true that..." constructions). Your payoff is a better handling of blind ascriptions ("What he said is true") without needing to identify the specific sentence or proposition.

  **The "Talking Past Each Other" Trap:**
  Most debates collapse because Minimalists assume Disquotationalists are denying the *property* in a way that undermines logic, while Disquotationalists assume Minimalists are reifying truth into a *substantive* property. Meanwhile, Prosententialists are often ignored because their grammatical claims require more technical work to cash out, so they are lumped in with Disquotationalists despite the logical form difference.
