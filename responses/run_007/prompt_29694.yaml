prompt: |-
  Can someone give me a gears-level explanation of what actually distinguishes the main versions of deflationism about truth from each other? I keep seeing 'deflationism' used as one big bucket on here, and it seems like alot of the time people are talking past each other. Whenever I try to cash out what a disquotationalist is committed to versus a minimalist versus a prosentential theorist, I end up confused about which disagreements are real and which are just presentation. Specifically: (1) which of these views treat 'true' as a predicate that expresses a property at all, and which treat it as more like a logical device for indirect endorsement? (2) How does each view handle generalizations like 'everything the Pope says is true'? I get that this is the standard job description for the truth predicate, but I dont see how a purely disquotational account pulls it off without secretly quantifying over propositions or sentence types. (3) Do they actually disagree about whether the T-sentences (or their propositional equivalents) are necessary, analytic, or just contingently true, and does that difference matter downstream? (4) Where does the prosentential theory fit — is it a competitor to both, or just a different notation for the same move? I'm not looking for a survey or a reading list; I want the actual fault lines, aimed at someone who already gets the basic equivalence-schema idea but wants to know what they'd be signing up for if they defended one version rather than another.
