      *(Self-Correction during drafting)*: Be careful with Horwich. He says truth *is* a property, but it doesn't *explain* anything. It's crucial to distinguish his "minimal property" from a robust realist property. For Quine, 'true' is *not* a property predicate in the serious sense. For Prosententialists, it's not a predicate at all.

