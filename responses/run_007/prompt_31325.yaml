  Based on the six verdicts you've provided, your friend is not operating on a simple deontological framework (e.g., "Lying is always wrong") or a pure consequentialist one (e.g., "Only outcomes matter"). Her judgments reveal a nuanced hierarchy of values.

  Here are the three candidate rules that fit her track record, their predictions for the party case, and my assessment of her likely verdict.

  ### Candidate Rule 1: The Harm & Necessity Principle (Consequentialism)
  **The Rule:** An action is wrong if it causes net harm or violates a system of trust necessary for society to function. It is fine if it prevents significant harm (starvation, health) or causes negligible harm (feelings, trivial inconvenience).
  *   **Fits the data:** Explains why stealing bread (prevents starvation) is fine, but luxury shoplifting (causes financial loss) is wrong. Explains why the wedding promise can be broken (saves a life) but the coffee promise cannot (only causes annoyance).
