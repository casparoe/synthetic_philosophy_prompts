      *   *Explicit vs. Implicit:* Can the outer message always be made explicit? Hofstadter argues there's an infinite regress problem. To explain the outer message, you need another outer message. Eventually, you hit bedrock: the hardware/biology of the receiver. You cannot make *all* context explicit because the ultimate decoder is the physical system itself.
