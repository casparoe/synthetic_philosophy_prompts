      *   *Is the conclusion true?* "Why treat any observational study as more than an artifact?" This is extreme skepticism. While caution is warranted, dismissing *all* observational science is untenable (e.g., smoking and lung cancer, climate change).
      *   *Key Concepts to Address:* Causal inference, confounding, sensitivity analysis, prior knowledge, DAGs (Directed Acyclic Graphs), robustness, RCTs vs. Observational.

