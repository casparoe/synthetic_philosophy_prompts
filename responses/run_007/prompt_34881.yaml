      *   **Discuss Robustness & Sensitivity:** Scientists test if results hold under different specifications. If a tiny unmeasured variable flips the result, the finding is fragile. If it takes a huge effect to flip it, the finding is robust. (E-values, sensitivity analysis).
      *   **Role of Prior Knowledge/Mechanism:** We don't rely solely on statistics. Biology, physics, and social theory constrain what confounders are plausible. (e.g., Smoking causes cancer; a confounder would need to cause both smoking and cancer independently).
      *   **Converging Evidence:** One study isn't proof. Replication, different methods, and eventually RCTs (where possible) build confidence.
