prompt: |-
  I run a small grantmaking program at a community foundation. We're redesigning our application process, and I've gotten interested in whether costly signaling theory can help us think about which requirements are actually doing useful screening work. The idea, as I understand it: a signal can be honest because it's costly to produce, but only if it's differentially costly — harder for low-quality applicants to produce than for high-quality ones. If a requirement is just expensive for everyone equally, it's a deadweight loss. I want a decision procedure my team can use to audit each piece of our application. For each requirement, the procedure should walk us through: what quality or trait we think it signals, whether the cost is differential, whether there's a cheaper way to get the same signal, and what the procedure recommends (keep, modify, cut, replace). Mark the steps where the theory runs out and we're making a judgment call. Then run it on three of our requirements: the 12-page project narrative, letters of support from partner organizations, and the requirement that applicants have been operating for at least three years. I suspect the procedure might tell us something we don't want to hear about that last one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small grantmaking program at a community foundation.
      *   **Goal:** Redesign the application process using Costly Signaling Theory (CST).
      *   **Core Concept:** Signals are honest if they are *differentially costly* (harder for low-quality applicants than high-quality ones). If equally costly, it's deadweight loss.
      *   **Deliverable 1:** A decision procedure (audit tool) for the team to evaluate requirements.
      *   **Deliverable 2:** Mark steps where theory ends and judgment calls begin.
      *   **Deliverable 3:** Apply the procedure to three specific requirements:
          1.  12-page project narrative.
          2.  Letters of support from partners.
          3.  3-year operating history requirement.
      *   **Tone:** Professional, analytical, practical, slightly academic but accessible.
      *   **Specific Insight:** The user suspects the 3-year rule might not hold up to scrutiny.

  2.  **Deconstruct Costly Signaling Theory (CST) in this Context:**
      *   *Signaler:* Grant applicant.
      *   *Receiver:* Grantmaker.
      *   *Signal:* Application requirement (narrative, letters, history).
      *   *Quality:* Likelihood of successful project execution/impact.
      *   *Cost:* Time, money, effort, social capital.
      *   *Differential Cost:* The key. High-quality orgs find it easier/cheaper to produce the signal than low-quality orgs.
      *   *Deadweight Loss:* Cost incurred by everyone without improving screening (e.g., formatting requirements that take time but don't indicate quality).

  3.  **Drafting the Decision Procedure (The Audit Tool):**
      *   Need a step-by-step flow.
      *   Must explicitly identify the "Theory vs. Judgment" moments.
      *   *Step 1: Identify the Signal.* What is the requirement?
      *   *Step 2: Identify the Trait.* What are we trying to measure? (Theory)
      *   *Step 3: Analyze the Cost.* What does it take to produce? (Theory/Data)
      *   *Step 4: Assess Differential Cost.* Is it harder for "bad" applicants? (Theory + Judgment)
      *   *Step 5: Check for Substitutes.* Is there a cheaper signal? (Judgment/Market knowledge)
      *   *Step 6: Decision.* Keep, Modify, Cut, Replace.

  4.  **Applying the Procedure to the Three Requirements:**

      *   **Requirement 1: 12-Page Project Narrative.**
          *   *Trait:* Planning capacity, clarity of thought, commitment.
          *   *Cost:* Staff time (writing).
          *   *Differential:* Do high-quality orgs write better/faster? Maybe. But often high-quality orgs are *busier*, so the opportunity cost is higher for them. Low-quality orgs might just fluff it.
          *   *Verdict:* Likely deadweight loss. 12 pages is arbitrary. Suggest shortening or focusing on specific questions.

      *   **Requirement 2: Letters of Support.**
          *   *Trait:* Community embeddedness, validation, collaboration.
          *   *Cost:* Social capital, administrative coordination.
          *   *Differential:* High-quality orgs have strong networks (low cost to ask). Low-quality orgs struggle to get them (high cost) or forge them (risk).
          *   *Caveat:* Can privilege well-connected orgs over new/nimble ones.
          *   *Verdict:* Strong signal, but check for equity. Maybe modify to "collaboration plan" or limit number.

      *   **Requirement 3: 3-Year Operating History.**
          *   *Trait:* Stability, sustainability, proven track record.
          *   *Cost:* Time (waiting), survival bias.
          *   *Differential:* This is the tricky one. *Anyone* can wait 3 years. It's not a cost of *effort*, it's a cost of *time*. But does it screen quality? A bad org can survive 3 years. A great new org is excluded.
          *   *CST View:* Is it *differentially costly* to survive 3 years? Yes, bad orgs die. But is it a *signal* produced by the applicant, or a *filter* applied by the funder? It's a filter. CST applies to active signaling.
          *   *Verdict:* Poor signal. High deadweight loss (excludes innovation). User's suspicion is correct.

  5.  **Refining the "Judgment Call" Markers:**
      *   Where does the math stop and the values start?
      *   Defining "Quality."
      *   Assessing "Cost" (especially opportunity cost).
      *   Equity considerations (CST doesn't care about fairness, only efficiency).
