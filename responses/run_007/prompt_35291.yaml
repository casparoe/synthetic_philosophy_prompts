      *   *Critique:* Ensure the "Judgment Call" markers are visible. I'll use a specific icon or bracketed text like `[JUDGMENT CALL]`.

  8.  **Final Polish:** Check tone. Ensure it sounds like a partner in thinking, not just a textbook. (The user is smart; treat them as such).

