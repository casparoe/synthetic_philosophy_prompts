      *   **Tone:** Rigorous, analytical, accessible but deep (magazine feature style).

  2.  **Deconstruct the Meta-Problem:**
      *   David Chalmers coined the term. The idea is: Even if we solve the neural correlates, we still *say* and *feel* there's something extra. Why?
      *   A solution needs to explain the *illusion* (if it is one) or the *cognitive mechanism* generating the judgment.
      *   The prompt asks for the *criteria of success*, not the solutions.

  3.  **Drafting the Desiderata (The Specification):**
