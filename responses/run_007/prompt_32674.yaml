      *   *Deep Tension:* **The Debunking Dilemma.** To solve the meta-problem is often to dissolve the hard problem. But the specification asks for a theory that explains the *conviction*. If the conviction is an error, the theory is debunking. If the conviction is accurate, the theory is metaphysical. Can a theory be neutral?
      *   *Joint Unsatisfiability:* Maybe "Explain the intuition mechanistically" + "Validate the intuition's metaphysical claim" are incompatible.
