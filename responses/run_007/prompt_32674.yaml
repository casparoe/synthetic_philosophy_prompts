answer: |-
  # The Specification: Criteria for a Theory of the Meta-Problem

  **To:** Editorial Board
  **From:** Science Desk
  **Subject:** Evaluation Criteria for the Meta-Problem of Consciousness

  The "Hard Problem" asks how matter becomes mind. The "Meta-Problem" asks why we are so certain that there is a Hard Problem. It is a question about human cognition, not fundamental ontology. It asks: What neural or computational machinery generates the *judgment* that experience is ineffable, private, and non-physical?

  To evaluate proposed solutions, we cannot simply ask if they are plausible. We must ask if they meet the specific burden of explaining the *conviction* of the explanatory gap. Below is the specification for an adequate theory. It distinguishes between non-negotiable requirements (without which the theory fails to address the meta-problem) and contested requirements (where theories diverge based on metaphysical commitments).

  ---

  ## Part I: The Core Desiderata

  ### 1. The Intuition/Report Distinction
  **Requirement:** The theory must explain the *felt intuition* of the gap, not merely the *verbal report* of it.
  **Case:** A subject can be trained to say "I am a physical system" while still *feeling* that their pain is non-physical. A theory that explains only why we use dualistic language (e.g., social convention) fails to explain why the intuition persists in private reflection.
  **Status:** **Non-Negotiable.**
  **Failure Mode:** "Linguistic Relabeling." Theories that attribute the problem to vocabulary mistakes explain why we speak strangely, not why we feel strangely.

  ### 2. The Specificity Constraint
  **Requirement:** The theory must explain why the "hard problem" intuition attaches to *phenomenal experience* (qualia) and not to other opaque internal processes.
  **Case:** We do not marvel at how the liver regulates glucose, nor do we feel an "explanatory gap" regarding our own syntactic processing or immune responses. A general theory of cognitive limitation (e.g., "the brain can't understand itself") is insufficient. It must identify the unique cognitive signature of *experience* that triggers the gap intuition.
  **Status:** **Non-Negotiable.**
  **Failure Mode:** "Overgeneralization." Theories that claim "all complex systems seem magical to themselves" fail to explain why digestion doesn't feel magical.

  ### 3. The Persistence Condition (Epistemic Encapsulation)
  **Requirement:** The theory must explain why the intuition survives the acceptance of physicalist metaphysics.
  **Case:** Neuroscientists who accept physicalism still acknowledge the force of the Hard Problem. If the intuition were merely a lack of information, it would vanish upon learning the neuroscience. The mechanism generating the intuition must be cognitively encapsulated—immune to top-down knowledge.
  **Status:** **Non-Negotiable.**
  **Failure Mode:** "The Ignorance Defense." Theories that claim the intuition is just "not knowing enough neuroscience" are empirically falsified by the persistence of the intuition in experts.

  ### 4. Empirical Fit (Developmental, Clinical, Comparative)
  **Requirement:** The theory must align with the empirical record of when and where the intuition arises.
  **Case:**
  *   **Developmental:** Do children exhibit the intuition before they have a concept of "mind"? (Evidence suggests they distinguish mental from physical early, but the *philosophical* gap may be later).
  *   **Clinical:** Do patients with anosognosia (denial of illness) or depersonalization report altered intuitions about the reality of their experience?
  *   **Comparative:** Do non-human animals exhibit behavior suggesting they model their own experience as distinct from their behavior?
  **Status:** **Contested.**
  **Reason:** The data is sparse. A theory is not falsified by current lack of data, but it must make testable predictions in these domains. A theory that is compatible with *any* empirical outcome is not scientific.

  ---

  ## Part II: The Internal Tension

  This is the critical finding of the specification. There is a structural conflict between two non-negotiable requirements that suggests the list itself may be impossible to fully satisfy.

  ### The Debunking Dilemma
  **The Conflict:**
  1.  **Mechanistic Completeness:** To solve the meta-problem, one must provide a causal, physical account of why the brain generates the "gap intuition." (e.g., "The brain models attention as non-spatial, leading to the judgment of non-physicality").
  2.  **Metaphysical Neutrality:** The meta-problem is ostensibly distinct from the Hard Problem. A solution should explain the *judgment* without necessarily settling whether consciousness *is* physical or non-physical.

  **The Tension:**
  If you provide a fully mechanistic account of the intuition (Requirement 1), you strongly imply that the intuition is a **cognitive error** (an illusion generated by neural architecture). This is the stance of *Illusionism*.
  However, if the intuition is a cognitive error, you have effectively solved the Hard Problem by dissolving it. You have moved from the Meta-Problem back to the Hard Problem.
  Conversely, if you insist the intuition tracks a genuine metaphysical truth (that there *is* a gap), you cannot provide a fully mechanistic account of the intuition, because the intuition is about something *non-mechanistic*.

  **Is this conflict real?**
  Yes. It appears that **Mechanistic Completeness** and **Metaphysical Neutrality** are jointly unsatisfiable.
  *   Any theory that fully explains the intuition in physical terms tends to debunk the intuition (implying Physicalism).
  *   Any theory that preserves the intuition's validity tends to require non-physical causes for the judgment (implying Dualism or Panpsychism), which violates the standard scientific demand for causal closure.

  **The Finding:**
  A theory of the meta-problem cannot be a neutral tool. It will always function as a Trojan Horse for a stance on the Hard Problem. The specification reveals that there is no "pure" meta-problem theory. To explain the judgment is to take a stand on the truth of the judgment.

  ---

  ## Part III: Scorecard of Approaches

  To help the lay reader see where theories stand against this specification, we can map the three dominant approaches. Note how each sacrifices a different part of the specification.

  | Approach | Mechanism for Intuition | Specificity (Why Experience?) | Persistence (Why it stays) | The Cost (Where it breaks) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Illusionism**<br>(e.g., Dennett, Frankish) | Cognitive user-illusion; the brain simplifies its own monitoring. | **Weak.** Struggles to explain why *this* illusion feels different from other errors. | **Strong.** The illusion is hardwired; knowledge doesn't fix it. | **Neutrality.** It solves the meta-problem by denying the Hard Problem exists. |
  | **Realist Physicalism**<br>(e.g., Type Identity) | We lack the concepts to bridge the gap, but the gap isn't real. | **Medium.** Attributes specificity to the unique nature of sensory concepts. | **Medium.** Claims education *should* reduce the intuition, contradicting expert persistence. | **Persistence.** Fails to explain why experts still feel the gap. |
  | **Dualism / Panpsychism**<br>(e.g., Chalmers, Goff) | The intuition is a reliable detection of non-physical properties. | **Strong.** Experience is unique because it *is* unique. | **Strong.** The gap is real, so learning physics won't close it. | **Mechanism.** Violates causal closure (how does the non-physical cause the judgment?). |

  ---

  ## Part IV: Instructions for the Reader

  When evaluating a new theory of the meta-problem, the reader should apply the following diagnostic:

  1.  **Check for Relabeling:** Does the author explain why the intuition *feels* compelling, or only why we *say* it is compelling? If the latter, reject.
  2.  **Check for Specificity:** Does the theory explain why we don't have a "Hard Problem of Digestion"? If the mechanism applies to all internal states, reject.
  3.  **Identify the Trojan Horse:** Ask: "If this explanation of the intuition is true, is the Hard Problem real or fake?"
      *   If the author says "The Hard Problem is real," ask: "How does a non-physical fact cause a physical judgment?"
      *   If the author says "The Hard Problem is fake," acknowledge they have solved the Hard Problem, not just the Meta-Problem.

  **Conclusion:**
  The specification reveals that the Meta-Problem is not a safe haven from the Hard Problem. It is the Hard Problem refracted through cognitive science. An adequate theory must choose: either the intuition is a robust error (Illusionism), or it is a reliable signal (Realism). A theory that claims to do neither is likely doing no work at all. The reader's task is not to find the theory that satisfies all desiderata—for the specification suggests none can—but to identify which requirement the theorist has chosen to relax, and what metaphysical price they are asking us to pay for it.
