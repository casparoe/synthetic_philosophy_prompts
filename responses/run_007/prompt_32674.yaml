          *   Epistemic Stability (Persistence).
          *   Empirical Fit (Data).
      *   **The Tension Analysis:** This is the heart. The "Debunking vs. Vindicating" conflict.
      *   **The Scorecard:** Briefly map Illusionism, Dualism, Physicalism to the criteria to show where they break.
      *   **Conclusion:** The takeaway for the reader.

