prompt: |-
  I'm a PhD student in philosophy of mind, working on a dissertation chapter about cognitive penetration. I need a thought experiment that I can use as a central example — one where I can confidently say the effect is genuinely perceptual and not merely attentional or judgmental. I'd like you to construct one to the following specifications.

  The case should involve a single subject with a specific cognitive state (a belief, a desire, a category-based expectation — pick one and be explicit) that causally influences the phenomenal character of a perceptual experience in vision or audition. The setting should be mundane: a kitchen, a workshop, a street corner, a classroom. No illusions, no clinical populations, no tachistoscopes, no exotic equipment.

  The case must be engineered to withstand the three standard deflationary strategies in the literature:

  1. The attentional-shift strategy: the cognitive state does not merely cause the subject to attend to a different feature or location. If you held attention fixed, the experiential difference would remain.
  2. The judgment account: the effect is not a matter of the subject having the same sensory experience but drawing different inferences from it. The experience itself differs.
  3. The stimulus account: there is no difference in the distal stimulus or the sensory signal reaching the retina or cochlea. The only difference between the conditions is the cognitive state.

  After presenting the scenario, walk me through it: (a) identify the cognitive state and the perceptual experience it penetrates; (b) explain why each of the three deflationary strategies fails for this case — be specific about what the deflationist would have to claim and why it doesn't work; (c) tell me which single feature of the scenario is doing the most work to block the deflationist, and what a committed skeptic — of the kind represented by Firestone and Scholl — would say to try to undermine that feature; (d) classify your case as involving direct cognitive penetration or as going through a mediating mechanism like mental imagery or affective state, and say whether that distinction matters for the dialectical use I want to put the case to.
