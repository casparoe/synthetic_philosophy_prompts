  Achilles: "You don't need a premise to tell you to write! The logic compels you!"

  Tortoise: "Does it? Or does it only compel me if I accept that logic compels me? Surely 'Logic Compels' is a fact about the world. I should write it down."

  Achilles: "No! Logic isn't a fact you observe, it's a rule you *use*! You're trying to put the engine in the trunk!"

  Tortoise: "Ah. So 'One must use logic, not observe it' is the missing link?"

  Achilles: "It's not a link! It's the whole chain!"

  Tortoise: "Then it must be very heavy. Shall I write down 'The Chain Is Heavy' as premise E? I'd hate for it to break under its own weight."

  Achilles: "I give up. You'll never infer anything."

  Tortoise: "Quite right. I prefer to accumulate truths. Inferring sounds like work."
