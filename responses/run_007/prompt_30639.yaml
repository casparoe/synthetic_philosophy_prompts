answer: |-
  ### 1. The Readings

  To resolve your dispute, you must distinguish these six distinct propositions often conflated under Quine's slogan. They range from modest claims about evidence to radical metaphysical denials. Each step increases the metaphysical commitment required.

  1.  **Epistemic Limitation:** This claim asserts that we currently lack sufficient evidence to decide between competing translations, though further investigation might theoretically resolve the ambiguity. It is a claim about our ignorance and practical limitations, not about the nature of meaning itself. It leaves open the possibility that a fact of the matter exists beyond our reach. This is the weakest reading, fully compatible with realism about meaning, suggesting only that linguists are currently stuck.
  2.  **Behavioral Underdetermination:** Here, the claim is that even given all possible observable behavioral evidence, multiple translation manuals remain logically compatible. No amount of data forces a unique choice, though it remains possible that one manual is objectively correct despite our inability to identify it. This mirrors the underdetermination of scientific theory by data, suggesting meaning is like theoretical posits. It is stronger than mere ignorance because it posits a permanent evidential gap.
  3.  **Inscrutability of Reference:** This thesis holds that within any accepted manual, reference itself is unstable; terms like "rabbit" cannot be objectively distinguished from "undetached rabbit part" without background linguistic assumptions that are themselves arbitrary. It targets the objects of reference rather than sentence meaning broadly, suggesting reference is relative to a manual. This undermines the idea that words latch onto specific objects independently of theory, extending underdetermination to ontology.
  4.  **Indeterminacy Proper:** This is the ontological claim that there is no fact of the matter regarding which empirically adequate manual is correct. Meaning is not a hidden entity; if behavioral dispositions don't fix it, nothing does, rendering the question of correctness meaningless. This moves from evidence to metaphysics, denying semantic facts rather than just access to them. It is the core Quinean thesis, asserting that meaning itself is indeterminate. Note that (1) allows realism, while (4) denies it.
  5.  **Meaning Nihilism:** A stronger eliminationist claim suggesting sentences do not possess meanings at all. Talk of meaning is merely a facon de parler; there are no semantic facts whatsoever, even within a home language, because no internal states ground them. It denies the existence of the entities involved in translation, going beyond indeterminacy to eliminativism. This claims not just that facts are indeterminate, but that the domain is empty.
  6.  **Anything Goes:** This reading suggests all empirically adequate manuals are equally true or correct. There are no constraints beyond fitting the evidence, so contradictory translations can simultaneously hold without error, dissolving the notion of correctness entirely. This implies no manual is better than another, even pragmatically, which risks collapsing into incoherence. It is the strongest reading, treating all compatible schemes as equally valid descriptions of reality.

  ### 2. Verdicts

  The **Epistemic Limitation** is a platitude; everyone agrees evidence can be scarce, but this misses Quine's metaphysical point. **Behavioral Underdetermination** is a substantive, defensible thesis widely accepted in philosophy of science; it is genuinely Quinean but often confused with indeterminacy. This is often accepted by realists who believe theory exceeds evidence. **Inscrutability of Reference** is also substantive and Quinean, though it applies more to terms than whole sentences.

  **Indeterminacy Proper** is the core Quinean thesis: substantive but highly controversial. It relies on behaviorism to deny facts beyond evidence. **Meaning Nihilism** is largely a caricature; Quine did not deny meanings exist, but rather redefined them as behavioral dispositions. He was an eliminativist about *meanings as entities*, not semantic discourse itself. He retained meaning talk as useful within a manual. Finally, **Anything Goes** is false and a caricature. Quine insisted manuals must save the evidence; incompatible manuals cannot both be true in a robust sense, only empirically equivalent. They are not equally good; some are simpler. This reading turns Quine into a relativist, which he denied.

  Your friend likely treats the platitude (1) as support for the controversial thesis (4), or conflates the defensible (2) with the nihilist (5). The genuinely Quinean positions are (2), (3), and (4), but only (4) supports the "no fact of the matter" conclusion. The others are either too weak to matter or too strong to be plausible. Distinguishing these prevents arguing past one another about whether linguists are just ignorant versus whether meaning is real. Most critics accept underdetermination but reject indeterminacy proper, arguing that internal states or social norms fix meaning where behavior fails. Thus, calling the thesis a platitude ignores its metaphysical weight, while calling it nihilism ignores Quine's naturalism.

  ### 3. What the Argument Actually Needed

  Your friend's move from the *gavagai* example to the conclusion that there is "no fact of the matter about anyone's words" requires **Indeterminacy Proper** (Reading 4). The *gavagai* example itself only demonstrates **Behavioral Underdetermination** (Reading 2) and **Inscrutability of Reference** (Reading 3). It shows that behavior alone cannot distinguish between "rabbit" and "rabbit part." However, underdetermination does not entail indeterminacy; one could argue that internal neural states or social norms fix the meaning even if behavior doesn't reveal it.

  To bridge this gap, Quine relies on behaviorism: the premise that meaning *consists* in behavioral dispositions. If meaning is nothing over and above behavior, and behavior underdetermines translation, then there is no fact of the matter. Without this premise, the example only proves epistemic limits. Furthermore, extending this to one's own language requires rejecting the idea that introspection provides semantic facts. Quine argues self-knowledge is just internalized linguistic behavior, subject to the same indeterminacy. This universalizes the thesis from field linguistics to home semantics.

  Therefore, the *gavagai* example supports the claim that evidence is insufficient, but not that meaning is unreal. Your friend needs the additional behaviorist premise to justify the ontological conclusion. If you reject behaviorism, the argument stalls at underdetermination. Consequently, the slogan "translation is indeterminate" is doing too much work: it conflates the evidential problem illustrated by the native with the metaphysical conclusion about all speakers. You must force him to defend the behaviorist premise, not just the example. Without it, the jump from "we can't tell" to "there is nothing to tell" is invalid.

  ### 4. Bottom Line

  "You are conflating the claim that we can't know the meaning with the claim that there is no meaning to know. Quine's argument only works if you accept that meaning is nothing over than behavioral dispositions, not just because 'Gavagai' is ambiguous. Unless you can defend that behavior exhausts meaning, the example only proves we are ignorant, not that facts are missing. So, stop citing the native example and tell me why internal states don't count as semantic facts. This shifts the burden of proof."
