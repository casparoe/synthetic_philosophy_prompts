  **A Note on the Framing (Before You Circulate)**

  You asked for pushback on the framing if it seemed off. Here is the crucial distinction you need to hold in mind during the meeting: **Moral Standing $\neq$ Procedural Standing.**

  In the Cohen/Bell framework, standing is about the *interpersonal moral relationship*. If I have sinned, my blame loses its moral force because it is hypocritical; it damages the relationship between you and me. But on the Academic Integrity Board, Maya is not morally blaming Jordan in a personal capacity. She is a *witness* triggering an institutional process. The "victim" of plagiarism is not Maya; it is the University (and the value of the degree).

  If you argue this purely on moral philosophy grounds, you risk conceding that this *is* a moral debate. It isn't. It's an administrative one. The memo below is drafted to acknowledge the philosophical intuition (to validate your colleagues who feel the hypocrisy sting) but firmly pivot to the institutional function. This protects you from the charge that you are importing seminar concepts where they don't belong.

  ***

  **MEMORANDUM**

  **TO:** Academic Integrity Board Members
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #24-09 (Maya v. Jordan)

  **Recommendation**
  I recommend that the Board **proceed with adjudication** of the complaint against Jordan. We should not dismiss the case based on the complainant's prior disciplinary record. However, we must be precise in *why* we are proceeding, to address the legitimate concerns regarding the appearance of fairness.

  **The Standing Objection**
  Two members have argued that Maya lacks standing to file this complaint due to her prior sanction for plagiarism. The intuition here is strong: it feels hypocritical for a student sanctioned for academic dishonesty to police that same dishonesty in others. In moral terms, we might say her "clean hands" are compromised, weakening her moral authority to blame.

  This concern is not trivial. If the Board appears to reward "snitching" by past offenders without addressing the symbolism, we risk undermining the community's trust in our restorative goals. It could look as though we are weaponizing past mistakes rather than treating them as resolved.

  **Why We Must Proceed**
  Despite the symbolic weight, dismissing the complaint is procedurally and practically untenable for three reasons:

  1.  **Institutional vs. Personal Standing:** In moral philosophy, standing to blame depends on the relationship between the blamer and the blamed. In academic integrity procedures, the "injured party" is not Maya; it is the University and the student body collectively. Maya is functioning as a witness, not a prosecutor. Her role is to provide evidence of a violation, not to pass moral judgment. To deny her report based on her character would be to conflate the *messenger* with the *message*.
  2.  **The "Clean Hands" Risk:** If we establish a precedent that only students with perfect records can report violations, we create a perverse incentive structure. It effectively grants immunity to cheaters who manage to avoid detection once; they can cheat with impunity, knowing they cannot report others without exposing themselves. Furthermore, Maya has already served her sanction. To permanently strip her of the right to report violations is to extend her punishment indefinitely, contradicting the goal of rehabilitation.
  3.  **Fact-Based Adjudication:** Our mandate is to determine whether *Jordan* violated the code. Jordan's defense does not deny the copying; it challenges the process. If the evidence of Jordan's plagiarism is verifiable (as it appears to be), dismissing the case would mean allowing a proven violation to stand uncorrected. This harms the integrity of the institution more than Maya's involvement does.

  **Addressing the Counter-Argument**
  The strongest argument for dismissal is symbolic integrity. Colleagues arguing this position are rightly concerned that allowing Maya to complain sends a message that "rules apply to you, but I get to enforce them." It risks making the process look vindictive rather than protective.

  To mitigate this, I propose we proceed with the adjudication but **decouple the complainant from the process** in our communications. In any correspondence with Jordan, we should frame the investigation as "Board-initiated based on received information" rather than "Maya's complaint." This acknowledges the reality that the Board owns the case, not the accuser. It respects the intuition that Maya's moral standing is complicated, without sacrificing the enforcement of the code.

  **Conclusion**
  We cannot allow the prior misconduct of a witness to shield a current violator. We should proceed with the hearing, focus strictly on the evidence regarding Jordan's assignment, and ensure our language reflects that the Board—not Maya—is the agent of accountability.

  ***

  **Strategic Advice for the Meeting**

  *   **If they press the Philosophy:** If a board member says, "But Cohen says hypocritical blame is inappropriate," you can reply: *"Cohen is talking about interpersonal relationships. Here, the relationship is Student-to-Institution. Maya isn't forgiving or blaming Jordan; she's reporting a breach of contract."*
  *   **The "Third Option":** Notice the memo suggests a procedural tweak (framing the investigation as Board-initiated). This is your compromise. It allows the "Dismissal" camp to feel heard (we acknowledge Maya's role is sensitive) without actually dismissing the case.
  *   **Stay Firm on Facts:** Keep returning to the evidence. Jordan *did* copy. If you dismiss, you are knowingly letting plagiarism stand. That is a harder position for them to defend than "Maya is annoying."
