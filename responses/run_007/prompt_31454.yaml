  3.  **Identify the Flaws in the User's Reasoning:**
      *   **Flaw 1: Multiple Equilibria.** Even with CKR, games often have *more than one* Nash Equilibrium. CKR doesn't tell you *which* one to pick. (e.g., Who does the dishes? You or me? Both are equilibria if the other does nothing, but the "best" outcome is sharing).
      *   **Flaw 2: Payoff Ambiguity.** In real life, payoffs are subjective and hidden. Is a clean kitchen worth 5 points or 10 points to the roommate? Do they value leisure more?
      *   **Flaw 3: Bounded Rationality.** People aren't perfectly rational calculators. We get tired, emotional, or forgetful.
      *   **Flaw 4: Dynamic/Repeated Game Issues.** Chores aren't a one-shot game. They are repeated. Reputation, punishment, and grudges enter the mix.
      *   **Flaw 5: Communication vs. Common Knowledge.** CKR is theoretical. In reality, we lack *common knowledge* of the specific situation (e.g., "I know you're busy this week" isn't common knowledge).

