answer: |-
  It is frustrating when the math says "this should work" and your dirty dishes say otherwise. You've hit on one of the biggest gaps between textbook game theory and behavioral reality.

  The short answer is: **No, Common Knowledge of Rationality (CKR) does not guarantee coordination on the best outcome.**

  Here is the breakdown of why the theory fails to save your kitchen, and what is actually messing you up.

  ### 1. The Equilibrium Selection Problem
  This is the biggest theoretical hole in your hypothesis. CKR helps players eliminate strategies that are clearly stupid (iterated elimination of dominated strategies). However, most real-life coordination games have **multiple Nash Equilibria.**

  Imagine a "Battle of the Sexes" scenario applied to chores:
  *   **Outcome A:** You clean the kitchen, roommate cleans the bathroom. (Stable)
  *   **Outcome B:** Roommate cleans the kitchen, you clean the bathroom. (Stable)
  *   **Outcome C:** Neither cleans. (Unstable/Dirty)

  Both Outcome A and Outcome B are rational equilibria. If you both know you are rational, you still don't know *which* equilibrium the other person is aiming for. CKR tells you "we will end up in *an* equilibrium," but it doesn't tell you *which one.* Without a focal point (more on that later), you can end up in a standoff where you're both waiting for the other to pick a lane, resulting in Outcome C (the dirty house).

  ### 2. Payoffs Are Subjective and Hidden
  In a textbook matrix, the payoffs are common knowledge. You know that a clean kitchen is worth +5 points to both of you.

  In reality, payoffs are private information:
  *   **Different Valuations:** You might value a clean floor at +10 utility. Your roommate might value it at +2. To them, "rationality" dictates letting it get dirty because the cost of cleaning (-5 effort) outweighs the benefit (+2 clean). You think they are being irrational; they think you are being obsessive.
  *   **Hidden Costs:** Your roommate might be stressed about work (high mental cost of chores right now). You don't see that cost, so you miscalculate their rationality.

  If the payoff matrix isn't actually common knowledge, CKR breaks down immediately.

  ### 3. Bounded Rationality and "Mental Load"
  Game theory assumes perfect calculators. Humans are bounded rational agents.
  *   **Cognitive Load:** Even if it is rational to coordinate, executing the coordination requires mental energy. Remembering whose turn it is, noticing the trash is full, and initiating the action costs "mental load."
  *   **Emotional Utility:** Real-life utility functions include emotions like spite, pride, or resentment. If you feel like you've done more lately, your utility function might shift to: *"I would rather live in filth than let them win/free-ride."* This turns a coordination game into a Prisoner's Dilemma or a game of Chicken, where the "rational" move becomes destructive.

  ### 4. The Shadow of the Future (Repeated Games)
  Chores aren't a one-shot game; they are an **infinitely repeated game.**
  In a one-shot game, you might cooperate. In a repeated game, strategies like **Tit-for-Tat** emerge.
  *   If you think they slacked off last week, you slack off this week to "punish" them.
  *   They see you slacking and interpret it as a new baseline, so they slack off too.
  *   Now you are in a "defect-defect" loop.

  Even with CKR, if there is noise in the system (e.g., "I didn't see the trash was full" vs. "I ignored the trash"), trust erodes. Once trust is gone, the "rational" strategy shifts from cooperation to defense.

  ### How to Actually Fix It (Applied Game Theory)
  Since CKR isn't enough, you need to introduce **Common Knowledge of Intent** via a **Schelling Point.**

  A Schelling Point is a solution that people tend to choose by default in the absence of communication because it feels "special" or "natural."

  1.  **Create a Focal Point:** Don't rely on vague rationality. Create a rule that acts as a magnet.
      *   *Bad:* "We should both clean more." (Vague, multiple equilibria)
      *   *Good:* "Whoever cooks doesn't clean." (Clear Schelling point)
      *   *Good:* "Trash goes out on Tuesdays." (Time-based focal point)

  2.  **Make Payoffs Common Knowledge:** Have the awkward talk.
      *   "On a scale of 1-10, how much does a dirty dish bother you?"
      *   "I am currently at high stress, so my cost of cleaning is higher."
      *   Aligning the matrix is more important than assuming rationality.

  3.  **Randomization:** If you can't agree on who does what (the Equilibrium Selection problem), outsource the decision to a randomizer. Flip a coin once to decide the permanent schedule. This removes the "who blinks first" standoff.

  ### Summary
  Common Knowledge of Rationality guarantees that you won't play *dominated* strategies (strategies that are always worse). It does **not** guarantee you will find the *best* strategy when multiple good options exist, nor does it account for the fact that you probably don't actually know your roommate's payoff matrix.

  You aren't failing at game theory; you're just playing a game with incomplete information and emotional variables. Treat the roommate dynamic like a contract negotiation, not a logic puzzle.
