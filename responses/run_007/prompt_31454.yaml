  2.  **Evaluate the Game Theory Concepts:**
      *   *Common Knowledge of Rationality (CKR):* This is a strong assumption. It implies infinite recursion of "I know that you know that I know..."
      *   *Coordination Games:* Chore sharing is often a coordination game (e.g., Battle of the Sexes, Stag Hunt) or a Prisoner's Dilemma (free-riding).
      *   *Nash Equilibrium:* CKR helps narrow down strategies, but it doesn't always select a *unique* equilibrium. Multiple equilibria can exist.
