answer: |-
  A most ingenious distinction! I assure you, I admire the elegance of your taxonomy. To separate the bricks from the mortar, so to speak—the premises being the bricks, and the rules of inference being the mortar that binds them—is a conception that would surely please any architect of logic.

  But pray, allow me to indulge my own simplicity for a moment longer. You say this Modus Ponens is a "structural rule" and not a "premise." I am willing to accept that terminology, for I am nothing if not accommodating. However, I must ask: do you hold this rule to be *true*?

  If you do not hold it to be true, then why should I be bound by it? It would be like a law of a country that the citizens do not acknowledge; it may exist on paper, but it holds no sway over my conduct.

  But if you *do* hold it to be true—that is, if you assert that "Whenever $P$ is true, and $P \rightarrow Q$ is true, $Q$ *must* be true"—then have you not merely stated another fact? And is not a fact precisely the sort of thing one enters into a notebook as a premise?

  It seems to me, my good sir, that you have merely renamed the hurdle without jumping over it. You call it a "rule" to suggest it acts of its own accord, but surely it is I who must *apply* the rule. And before I apply it, must I not accept the proposition that "This rule is valid"?

  So, let us not quarrel over labels. Whether you call it a premise or a rule, it appears I must accept it as a condition of moving forward. Shall we be precise? I propose we write this new distinction down. Let us call it Proposition $C$: *"If one accepts $P$ and $P \rightarrow Q$, and one accepts the Rule of Modus Ponens, then one must accept $Q$."*

  I have accepted $P$. I have accepted $P \rightarrow Q$. And now, I am quite willing to accept your distinction that Modus Ponens is a rule. But until I accept Proposition $C$—which links my acceptance of the rule to the conclusion—I fear I remain logically seated. Do you not find this reasonable?
