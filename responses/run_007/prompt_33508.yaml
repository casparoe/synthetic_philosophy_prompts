  1. **The phenomenon named**
  The most established term for this phenomenon is **superrationality**, coined by Douglas Hofstadter in his 1983 essay "Prisoner's Dilemma and Superrationality." It describes agents who recognize that their reasoning processes are identical copies. Consequently, they treat their own decision as logically correlated with others', rather than causally independent. In academic economics and philosophy, this is often formalized as **team reasoning** (Michael Bacharach, Robert Sugden), where players maximize group utility by adopting a "we-frame" instead of an "I-frame." More recently, AI safety researchers label this **logical decision theory**, emphasizing that decisions are outputs of the same algorithm. Regardless of the label, the core definition remains: rational agents acknowledge that choosing an action implies all identical agents choose the same action, altering the expected payoff calculation compared to standard Nash equilibrium analysis. This shifts the focus from best-responding to fixed strategies to selecting the optimal output for the shared reasoning algorithm. The phenomenon arises specifically when common knowledge of rationality includes common knowledge of identicality, creating the "strange loop" where my choice predicts yours not through causation, but through logical necessity. Thus, it represents a distinct class of strategic interaction where symmetry is not just structural but cognitive.

  2. **How it differs from neighbors**
  This phenomenon differs fundamentally from the standard **Prisoner's Dilemma** analysis, which assumes **causal decision theory (CDT)**. In the standard CDT view, my choice cannot causally influence yours; thus, defection dominates regardless of your action. Superrationality assumes **evidential decision theory (EDT)** or logical correlation, where my choice is strong evidence of yours. It also differs from standard **common knowledge of rationality (CKR)**. Typically, CKR leads to Nash equilibrium via iterated elimination of dominated strategies. Here, CKR of *identicality* leads away from Nash toward Pareto-optimal outcomes, because rationality implies choosing the algorithm that yields the best joint output.
  Distinction from **focal points** is crucial. Schelling points rely on cultural salience to coordinate among multiple existing equilibria. Superrationality creates a single logical equilibrium where none existed before; it changes the expected utility calculation by linking probabilities.
  Finally, it is not **correlated equilibrium**, which requires an external signal to correlate actions. Superrationality requires no external signal; the correlation is internal. The boundary lies in the agent's model of counterfactuals: if I imagine defecting, do I imagine you still cooperating (Nash) or you also defecting (Superrational)? If the latter, you are in this territory. This distinguishes it from **team reasoning**, which is often normative (how we *should* reason), whereas superrationality is descriptive of identical agents (how we *must* reason). In standard game theory, symmetry refers to payoffs. Here, symmetry refers to the mind. This is a category error if conflated. A symmetric game with distinct minds yields Nash. A symmetric game with identical minds yields superrationality. This distinction is the hard boundary. Furthermore, unlike cooperative game theory, no binding agreements are made. The cooperation emerges solely from non-cooperative reasoning about logical links.

  3. **What the term covers and what it doesn't**
  The term clearly covers **Newcomb's Problem**, where a predictor simulates your reasoning, and the **Twin Prisoner's Dilemma**, where you face an exact copy of yourself. It also applies to **Volunteer's Dilemmas** with identical agents, where symmetric reasoning risks everyone volunteering or no one volunteering, matching the user's Case One.
  It does not cover asymmetric games where players have different utility functions or information sets. If you know your opponent is irrational or uses a different algorithm, the logical link breaks.
  Borderline cases include **evolutionary stable strategies**. Here, agents behave identically due to selection, not reasoning. Is this superrationality? No, because the mechanism is causal history, not logical deduction.
  Subtypes should distinguish between **strong logical identity** (you are my clone) and **psychological similarity** (we are both humans). The former mandates superrationality; the latter is probabilistic. Another subtype is **one-shot vs. iterated**. In iterated games, reputation creates causal links, muddying the logical link. Pure superrationality applies best to one-shot scenarios with no causal history. The term struggles when agents are nearly identical but have slight noise; does the logical link hold? This ambiguity marks the fuzzy edge of the concept. Furthermore, it does not cover **signaling games**, where actions are taken specifically to convey information rather than as outputs of a shared decision function.

  4. **Open questions**
  The primary contestation is normative: is this reasoning actually rational? Causal decision theorists argue it violates the principle of independence, calling it magical thinking. Evidential theorists argue it correctly accounts for logical correlations.
  Another open question is implementation: how do agents verify identicality? Without perfect knowledge of the other's source code, the degree of correlation is uncertain.
  Finally, there is debate over whether humans naturally reason this way. Experimental game theory shows mixed results; some cooperate based on similarity, others defect. Whether this is a bug or a feature of human cognition remains unsettled.
