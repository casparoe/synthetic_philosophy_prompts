answer: |-
  ### A Preliminary Warning: Dewey vs. The Checklist

  You asked me to say plainly if operationalizing Dewey this way is misguided. Here is the plain truth: **Yes, it is.**

  John Dewey viewed democracy not as a set of institutions or procedures, but as a "mode of associated living" grounded in specific habits of mind (open-mindedness, responsibility, whole-heartedness). For Dewey, inquiry is a responsive, organic process that cannot be fully scripted without killing the very spirit of inquiry. Turning his philosophy into a 15-minute facilitator checklist risks "proceduralism"—following the steps without cultivating the disposition. A group can follow this protocol and still fail to inquire if they treat it as a box-ticking exercise.

  However, you have a practical job to do. You need heuristics that nudge participants toward inquiry rather than debate. What follows is not "Dewey's Method," but a **Dewey-Inspired Inquiry Protocol**. It is a scaffold. It will not guarantee truth, but it will reduce the likelihood of producing incoherent recommendations. Use it as a compass, not a GPS.

  ---

  ### The Inquiry Protocol (For Facilitators)

  **Prep Time:** 15 Minutes
  **Goal:** Move the group from "Opinion Trading" to "Collective Testing."

  #### Phase 1: Frame the Problem (Not the Solution)
  *Deweyan Principle: Inquiry begins with an "indeterminate situation," not a pre-packaged question.*
  *   **The Trap:** The City Council gives you a binary question (e.g., "Should we do X?"). This closes inquiry.
  *   **The Fix:** Reframe the prompt as a **Problem of Consequence**.
  *   **Facilitator Script:** "We are not here to vote Yes/No on a proposal today. We are here to solve [Specific Community Problem]. The proposal on the table is just one hypothesis for solving it. Our job is to test if it works."
  *   **Check:** Does the framing allow for the possibility that *none* of the current options are adequate? If no, rewrite it.

  #### Phase 2: Evidence as Tools, Not Verdicts
  *Deweyan Principle: Data feeds hypothesis-formation; it does not replace judgment.*
  *   **The Trap:** Experts testify, and participants treat them as authorities to be obeyed or attacked.
  *   **The Fix:** Treat expert testimony as **Data for Hypotheses**.
  *   **Facilitator Script:** "When an expert speaks, do not ask 'Do I trust them?' Ask 'If this data is true, what does it allow us to build? If it is false, what breaks?'"
  *   **Action:** If experts contradict each other, do not ask the group to choose a side. Ask the group: "What specific fact would resolve this disagreement? Do we have it? If not, can we proceed without it?"

  #### Phase 3: Consequence Mapping (The "Test")
  *Deweyan Principle: Ideas are warrants for action; their truth is found in their anticipated consequences.*
  *   **The Trap:** Participants argue about values ("Liberty vs. Security") or intentions ("They mean well").
  *   **The Fix:** Map the **Second-Order Consequences**.
  *   **Action:** Have the group draw a timeline.
      1.  **Immediate:** What happens in Month 1?
      2.  **Systemic:** What happens in Year 1? (Who wins? Who loses? What new problems emerge?)
      3.  **Reversibility:** If we are wrong, can we undo this?
  *   **Rule:** A proposal cannot move to a vote until the group has articulated at least three negative consequences they are willing to accept to achieve the positive ones.

  #### Phase 4: The "Stuck" Signal (Vote vs. Inquire)
  *Deweyan Principle: Suspended judgment is a virtue, not a failure.*
  *   **The Trap:** The schedule demands a recommendation by Sunday at 5 PM.
  *   **The Fix:** Use the **Warranted Assertibility Check**.
  *   **Decision Matrix:**
      *   **Vote:** If the group agrees on the facts, agrees on the goals, and disagrees only on the weighting of known risks.
      *   **Do Not Vote:** If the group disagrees on the *facts* (and no expert can resolve it in the room) OR if the *problem definition* itself is contested.
      *   **The "Deweyan Veto":** If the group realizes the City Council asked the wrong question, your recommendation must be: "We cannot answer Question X until Condition Y is met."

  ---

  ### Case Application 1: Participatory Budgeting (The Uncomfortable Outcome)

  **Context:** Residents must allocate $2M between:
  1.  New Library Branch (Cultural/Educational)
  2.  Youth Sports Expansion (Health/Social)
  3.  Stormwater Drainage (Safety/Infrastructure)

  **Standard Facilitation:** Participants pick their favorite, argue values, vote. Result: A split pot or a winner based on who showed up.

  **Deweyan Protocol Application:**
  1.  **Reframe:** "How do we maximize community resilience and well-being with $2M?" (Not "Which project do you want?")
  2.  **Evidence:** The City Engineer says drainage prevents basement flooding (Safety). The Librarian says libraries reduce isolation (Social). The Sports Director says sports reduce crime (Social/Safety).
  3.  **Consequence Mapping:**
      *   Group tests the Library hypothesis: "If we build the library, does it actually reduce isolation? Only if we fund programming, not just bricks."
      *   Group tests the Drainage hypothesis: "If we fix drainage, does it help the poorest residents? Or only homeowners?"
      *   Group tests the Sports hypothesis: "If we expand sports, do we have the staff to run them? If not, the equipment is useless."
  4.  **The Break Point:** During Consequence Mapping, the group realizes they lack data on *maintenance costs* and *operational staffing* for all three. They are being asked to fund *capital* projects without knowing if the city can afford to *operate* them.

  **The Recommendation Your Team Won't Like:**
  The group refuses to allocate the $2M. Instead, they recommend: **"Allocate $200k to a joint planning study to determine operational sustainability for all three sectors. Hold the remaining $1.8M in reserve."**

  **Why this is painful:**
  *   **For the City:** They wanted the money spent (and the photo op) this fiscal year.
  *   **For the Residents:** They wanted to see something built.
  *   **For Your Nonprofit:** It looks like "failure" to deliver a decision.
  *   **Why it is Deweyan:** It recognizes that the situation was truly "indeterminate." Voting without knowing the operational consequences would have been a guess, not inquiry. It prioritizes *warranted assertibility* over *timely closure*.

  ---

  ### Case Application 2: Citizens' Assembly on Rent Stabilization

  **Context:** Polarized group. Landlord experts say it reduces supply; Tenant experts say it prevents displacement. High emotion.

  **Standard Facilitation:** Balance the testimony, find "common ground" (often lowest common denominator), vote.

  **Deweyan Protocol Application:**
  1.  **Reframe:** "How do we ensure housing security for residents while maintaining a functional rental market?" (Moves away from "Pro/Anti Rent Control").
  2.  **Evidence:** Experts contradict on "vacancy decontrol" impacts.
  3.  **The "Stuck" Signal:** Facilitator applies Phase 2. "What fact would resolve this?" The group identifies they need local data on *eviction rates* and *new construction permits* specific to *this* city, not national studies. The City has not provided this.
  4.  **Consequence Mapping:** The group maps the consequence of passing the ordinance *without* the local data. They identify a high risk of unintended litigation that could freeze all housing development.
  5.  **Reframing the Question:** The group realizes the question "Adopt Ordinance Yes/No" forces a binary choice on a complex system.

  **The Recommendation:**
  The group recommends: **"Adopt a moratorium on rent increases for 6 months, contingent on the City commissioning an independent housing impact study. Vote on the Ordinance only after that study is released."**

  **Why this is painful:**
  *   **For the Tenants:** It delays relief they feel they need *now*.
  *   **For the Council:** It looks like the Assembly is usurping legislative authority (issuing a moratorium).
  *   **For Your Nonprofit:** It extends the timeline beyond your contract.
  *   **Why it is Deweyan:** It treats the policy as an experiment. It admits that without specific local data, the "hypothesis" (the ordinance) cannot be tested for validity. It refuses to close inquiry when the conditions for warranted judgment are missing.

  ---

  ### Where This Procedure Will Break

  You need to know where this scaffold collapses so you don't blame yourself (or Dewey) when it happens.

  **1. The Time Horizon Mismatch**
  *   **The Tension:** Deweyan inquiry is open-ended. It lasts as long as the problem requires. Your contract lasts three weekends.
  *   **The Break:** In the Rent Stabilization case, the "right" Deweyan move might be to inquire for six months. Your protocol forces a "Stop Inquiry" decision at the end of Weekend 3.
  *   **Facilitator Judgment:** You will have to decide when "good enough" inquiry substitutes for "complete" inquiry. There is no rule for this. If you push for more time too often, the City will stop hiring you. If you push too little, you produce bad policy.

  **2. The Power Asymmetry**
  *   **The Tension:** Dewey assumes a community of equals engaged in cooperative inquiry. Municipal politics are adversarial. The City Council may have already decided the outcome and is using your assembly for cover.
  *   **The Break:** If the Council rejects the "Planning Study" recommendation in Case 1 and demands a spending vote, your protocol offers no leverage.
  *   **Facilitator Judgment:** You must decide whether to facilitate a process you know is compromised. The protocol cannot protect you from bad-faith stakeholders.

  **3. The "Habit" Gap**
  *   **The Tension:** Dewey believed inquiry requires *virtues* (open-mindedness, etc.). You are installing *rules*.
  *   **The Break:** Participants can game the Consequence Mapping (Phase 3) by listing trivial negatives to kill a proposal they dislike for emotional reasons. They can follow the steps while remaining closed-minded.
  *   **Facilitator Judgment:** You must intervene on *tone* and *disposition*, not just process. This requires skill no checklist can provide. If the group is hostile, the protocol is useless.

  **4. The Expertise Problem**
  *   **The Tension:** Dewey valued expert knowledge but insisted it be subordinated to public judgment.
  *   **The Break:** In highly technical areas (like stormwater engineering or housing economics), laypeople cannot genuinely evaluate competing expert hypotheses in 12 hours. They will default to trusting the expert who aligns with their prior values.
  *   **Facilitator Judgment:** You may have to simplify the science to the point of distortion to make it "inquirable." This violates the integrity of the evidence.

  ### Final Advice

  Use this protocol to **slow down** the rush to judgment. Its greatest value is not in producing better recommendations, but in producing *honest* recommendations—specifically, recommendations that admit uncertainty.

  If your team adopts this, you must prepare your municipal clients for the possibility that the "product" of the assembly might be **"We need to know more before we decide."** If you sell this as a feature (risk mitigation for the Council) rather than a bug (delay), you can survive the tension. If you sell it as a way to get a vote in three weekends, you are lying to them, and to Dewey.
