prompt: |-
  One of my buddies is a physics grad student and every time philosophers get brought up he hits me with "philosophy of science is about as useful to scientists as ornithology is to birds." Last time it was about whether philosophers should have any say in how we interpret quantum mechanics, and he used the line to mean philosophers can be ignored the way a birdwatcher has nothing to teach a bird. I'm not trained in any of this so I can't tell if I'm being unfair to him, but the line feels like its doing a lot of work. Can you lay out the different precise claims that one-liner could actually be making? Like, is it just that scientists don't need to read philosophy to do their daily work, or that philosophy has never made a difference to science, or that philosophy of science is only describing science from outside, or something else? For each version tell me whether it's true or false, which one the bird analogy actually supports, and whether the strong conclusion — philosophers should be ignored when they talk about science — needs a stronger claim than the joke literally says. I want a menu I can bring back to him so I don't end up strawmanning him or caving just because the line lands.
