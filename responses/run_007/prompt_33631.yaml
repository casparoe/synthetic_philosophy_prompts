answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the older sibling. And for those of you who do know me, you know I have a habit of overthinking things. I spend my days studying how human beings make big decisions. How we choose paths when the future is unclear.

  Usually, when we make a choice, we try to imagine the outcome. We weigh the pros and cons. We ask our friends for advice, we look at the data, we try to calculate the best route. We stand on the shore and try to decide if the water is warm enough before we jump.

  But there are some choices in life that don't work that way.

  There are moments where the act of choosing doesn't just take you to a new place; it makes you into a new person. And because it changes *you*, there is no way for the "you" that stands here today to fully know what it will be like to be the "you" on the other side. You can't simulate the experience from the outside. You can't map the territory until you're actually walking on it.

  My sister knows this about me. In fact, when she asked me to speak tonight, she gave me a specific instruction. She said, "Don't tell them marriage is safe. Don't tell them we know exactly what we're getting into. Because we don't."

  And she's right.

  To [Sister's Name] and [Partner's Name]: There is no amount of advice I can give you, no wisdom from our parents, no examples from the couples you admire, that can tell you what it will *feel like* to build a life together. That knowledge is locked behind the door you are about to open.

  Some people might find that terrifying. If you can't know the outcome, how can you be sure it's the right choice?

  But I am standing here tonight to tell you that this uncertainty is not a flaw in the design. It is the design.

  If you could know exactly who you would become, and exactly how you would feel, ten or twenty or fifty years from now, there would be no growth. There would be no discovery. There would be no adventure. You would just be executing a script written by your current selves.

  The beauty of what you are doing is that you are agreeing to be transformed. You are agreeing to let this commitment change your preferences, your habits, your very perspective. You are agreeing that the person you become together will be someone the single versions of yourselves could never have fully anticipated.

  You are not just signing a contract; you are stepping into a story that hasn't been written yet. And the value of that story doesn't come from how well you predicted the plot. It comes from the courage it takes to turn the page without knowing what's on it.

  To the philosophers in the room: You will recognize that I am asking them to make a leap that cannot be justified by standard reasoning.

  To the rest of the room: I am asking them to trust each other more than they trust their own predictions.

  [Sister's Name], I have watched you grow into a woman of incredible insight and courage. I have never seen you more ready to embrace the unknown than I see you today standing next to [Partner's Name]. And [Partner's Name], thank you for being the person she wants to take this leap with. Knowing you, I understand why she feels safe enough to step into the dark.

  So, let's not wish for a marriage where everything goes exactly as planned. Let's wish for a marriage where the changes surprise you. Where the challenges make you stronger. Where the person you become together is someone you couldn't have imagined alone, but wouldn't trade for anything.

  Please raise your glasses.

  To the unknown future, and to the two brave people walking into it together. To [Sister's Name] and [Partner's Name].
