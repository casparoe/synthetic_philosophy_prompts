      *   **Constraint 1 (Content):** Must acknowledge the sister's request: don't avoid the tension. Acknowledge they can't know what marriage will be like, but frame this *not* as hesitation, but as the source of value.
      *   **Constraint 2 (Tone):** Warm, celebratory, not a seminar. No jargon explanations.
