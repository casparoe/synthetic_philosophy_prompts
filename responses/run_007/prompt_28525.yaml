answer: |-
  No beauty hides in colour or in strain,
  It rises in the mind to feel delight.
  Yet we distinguish wrong from what is right,
  And count some masterworks as void and vain.
  If all is but a feeling we retain,
  How can one critic's view outshine the night?
  Or stand above the crowd's unguided flight?
  Why do we seek a standard to maintain?

  It rests on those with delicate, good sense,
  Who practice comparison through all time,
  Unswayed by prejudice, their joint defense,
  Wins a consensus over every clime.
  No checklist can make this standard commence,
  Empirical and slow, not logic's rhyme.

  ***

  **Note on Philosophical Liberties**

  I am reasonably confident in the broad strokes here: Hume's core move is indeed shifting the standard from the object to the *subject* (specifically, the ideal subject), and the five characteristics of the "true judge" (delicacy, practice, comparison, freedom from prejudice, good sense) are accurately listed, if compressed.

  However, I have taken two liberties:
  1.  **Delicacy and Good Sense:** In line 9, I combine "delicate" and "good sense" to fit the meter. Hume treats these as distinct qualifications; "delicacy" is the ability to perceive subtle components, while "good sense" prevents those perceptions from being led astray by fallacy. Merging them risks implying they are the same faculty.
  2.  **The Role of Time:** In lines 10 and 12, I emphasize "time," "consensus," and "clime" to capture the historical convergence of verdicts. While Hume does argue that works surviving across ages are proof of value, his primary definition of the standard is the *joint verdict* of contemporaneous true judges, not merely the test of time itself. The "slow/empirical" framing in the final line is my own synthesis to contrast with deductive logic; Hume would say the standard is empirical because sentiments are facts of human psychology, not because it takes a long time to calculate, though the latter is practically true.

  I am least sure about the implication in line 13 ("No checklist..."). While Hume argues you cannot deduce beauty via rules, he does provide a fairly rigid checklist of qualifications for the judge. The poem suggests the *application* of the standard isn't mechanical, which is true, but a strict reader might argue the *criteria for the judge* are quite mechanical indeed.
