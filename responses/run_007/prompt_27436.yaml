  2.  **Deconstruct Spinoza's Argument (E1P8):**
      *   *Premise 1:* Every substance is necessarily infinite (Goal).
      *   *Step 1:* Substance exists (from E1P7: Existence belongs to the nature of substance).
      *   *Step 2:* Existence must be either finite or infinite (Law of Excluded Middle).
      *   *Step 3:* Assume Finite.
      *   *Step 4:* If Finite, it is limited by another of the same nature (Def 2).
      *   *Step 5:* That other thing must also exist (E1P7).
      *   *Step 6:* Now we have two substances with the same attribute.
