answer: |-
  You have hit on one of the most critical and contentious pressure points in the entire *Ethics*. Your intuition is spot-on: Spinoza *is* smuggling a substantive metaphysical claim into Definition 2, and that claim relies entirely on his commitment to the **Principle of Sufficient Reason (PSR)** and a specific understanding of **determination as negation**.

  If you read Definition 2 naively ("A thing is finite if it can be limited by another"), it sounds like a contingent possibility. But for Spinoza, it is a necessary truth about reality.

  Here is the breakdown of why he makes this move, why a "finite substance" is an oxymoron for him, and why this entails positive infinity rather than just indefinite extension.

  ### 1. The Heavy Lifting of Definition 2
  You asked: *Why can't a substance just be finite without anything else actually limiting it?*

  For Spinoza, **finitude is relational.** To be finite is to have a boundary. But a boundary is not a positive thing; it is a negation. It is the point where a thing *stops* being itself.
  *   **The PSR Constraint:** If a substance stops existing at point X rather than point Y, there must be a **reason** why it stops at X.
  *   **Internal vs. External Reason:** Since the nature of substance involves existence (Prop 7), there is no *internal* reason for it to stop. Its essence pushes toward existence. Therefore, if it stops, the reason must be **external**.
  *   **The "Same Kind" Constraint:** An external cause can only limit a thing if it competes for the same "ontological space." A body limits a body; an idea limits an idea. A substance (defined by its attribute) can only be limited by another substance sharing that attribute.

  So, when Spinoza says in Def 2 that a finite thing is one that *can* be limited by another of the same nature, he isn't saying "sometimes this happens." He is saying: **To be finite just means to be negated by another.** If there is no other to negate it, it is not finite.

  ### 2. The Contradiction of a "Finite Substance"
  This is where Prop 5 and Prop 7 do the work you suspected.

  1.  **Substance is Independent (Def 3):** It is conceived through itself.
  2.  **Substance is Self-Caused (Prop 7):** Its essence entails existence.
  3.  **The Conflict:** If a substance were finite, its existence would be partially determined by a **limiter**.
  4.  **The Dependency:** If its boundary is set by something else, then its existence is *not* fully conceived through itself. It depends on that other thing to define where it ends.
  5.  **The Contradiction:** A substance that depends on another thing for its definition is not a substance.

  Therefore, a "finite substance" is like a "married bachelor." The concept collapses. If it's a substance, it must be independent. If it's independent, nothing else can limit it. If nothing else can limit it, it is infinite.

  ### 3. Why "Infinite" and not just "Not Finite"?
  You asked: *Why does this entitle him to say substance is infinite, rather than just "not known to be finite"?*

  This touches on the distinction between **imagination** and **intellect**.
  *   **Imagination:** Sees things as contingent and limited. It asks, "How big is it?" and expects a number. If it doesn't find a limit, it says "indefinite."
  *   **Intellect:** Sees things through their causes/essences.

  For Spinoza, infinity is not just the absence of a limit (which would be a negative definition); it is a **positive perfection**.
  *   Because existence follows from the *nature* of substance (Prop 7), the quantity of existence is determined by its own power, not by external constraints.
  *   Since there are no external constraints possible (because there are no other substances with the same attribute to constrain it, per Prop 5), the substance expresses its existence **fully**.
  *   To exist fully, without negation, *is* to be infinite.

  In Scholium 1 to Prop 8, Spinoza explicitly addresses this. He says that if you think existence belongs to the nature of substance, you must conclude it is **eternal** and **infinite**. To say it is "finite" would be to deny its own nature. So, "infinite" here means "expressing the full reality of its essence without negation."

  ### 4. Is he smuggling?
  Yes, but he owns it.
  You are correct that Def 2 is not a neutral dictionary definition. It is a metaphysical axiom derived from the PSR.
  *   **Leibniz's Critique:** Later, Leibniz would argue exactly what you are hinting at. He argued that Spinoza begs the question by assuming that finitude *requires* a limiter of the *same nature*. Leibniz thought a thing could be finite simply by virtue of its own essence limiting it (e.g., a triangle is finite not because another triangle stops it, but because its definition limits it).
  *   **Spinoza's Defense:** Spinoza would reply that a triangle is a *mode*, not a *substance*. Modes are limited by other modes. But Substance is *sui generis*. Its essence is existence itself. Existence itself cannot have an internal limit without ceasing to be existence itself.

  ### Summary of the Move
  The argument works like this:
  1.  **Nature of Substance:** To be a substance is to be independent (conceived through itself).
  2.  **Nature of Finitude:** To be finite is to be limited/negated by another of the same kind (Def 2).
  3.  **Incompatibility:** If a substance were finite, it would depend on a limiter for its definition.
  4.  **Result:** It would no longer be independent. It would no longer be a substance.
  5.  **Conclusion:** Therefore, if it is a substance, it cannot be finite. It must be infinite.

  You aren't missing a step; you are identifying the foundational bedrock of Spinoza's rationalism. He is asserting that **reality is plenitude.** There are no "brute facts" or arbitrary limits. If something exists, it exists to the fullest extent possible unless something stops it. Since nothing can stop Substance (because nothing else shares its attribute), Substance exists to the fullest extent possible: **Infinite.**

  If you accept the PSR and the definition of Substance as independent, the move is valid. If you reject the idea that finitude *requires* an external limiter (like Leibniz did), the argument falls apart. But within Spinoza's system, it is airtight.
