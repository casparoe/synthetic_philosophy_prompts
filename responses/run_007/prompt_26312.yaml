answer: |-
  **MEMORANDUM**

  **TO:** Permitting Division Analysts
  **FROM:** Division Director
  **SUBJECT:** New Protocol for "Significant Degradation" Determinations (SDP-2024)

  **1. PURPOSE AND PHILOSOPHICAL PREMISE**

  You have been trained to treat "significant degradation" as a fact we discover, like water temperature or pH. It is not. It is a **vague predicate**. In plain English: nature does not draw a line between "insignificant" and "significant." We do.

  Our old checklist treated vague terms as if they were precise. This created the "4.9% vs. 5.1%" problem, where the rule mattered more than the environmental outcome. This new **Significance Determination Protocol (SDP)** acknowledges that there is a "Zone of Indeterminacy"—cases where science tells us the *impact*, but not the *significance*.

  This protocol does not eliminate discretion. It structures it. It forces us to admit when we are making a policy choice rather than a scientific finding. This makes our decisions more defensible in court because we are no longer pretending to be certain when we are not.

  ***

  **2. THE DECISION PROCEDURE**

  **STEP 1: The De Minimis Screen (Mechanical)**
  *   **Question:** Is the projected impact physically undetectable or functionally zero relative to natural background variability?
  *   **Action:**
      *   **YES:** Issue "No Significant Degradation" (NSD). Document the detection limits. **STOP.**
      *   **NO:** Proceed to Step 2.
  *   *Note:* This filters out the truly trivial. It is not the old arbitrary threshold. It is based on measurement capability and natural noise.

  **STEP 2: The Sensitive Resource Check (Judgment)**
  *   **Question:** Does the project impact a resource identified as "critically impaired," "endangered," or "irreplaceable" in our state databases (e.g., spawning salmon, remaining wetlands in a depleted watershed)?
  *   **Action:**
      *   **YES:** Flag as **High Sensitivity**. Any measurable degradation here is presumptively significant. Proceed to Step 4.
      *   **NO:** Flag as **Standard Sensitivity**. Proceed to Step 3.
  *   *Analyst Instruction:* This is not a measurement; it is a classification. Use the State Critical Resources Map. If the resource is on the map, the "tolerance" for degradation drops.

  **STEP 3: The Cumulative Contribution Test (Judgment)**
  *   **Question:** Is this project contributing to a known cumulative threshold violation (e.g., a Total Maximum Daily Load, a hypoxic zone, a flood risk threshold)?
  *   **Action:**
      *   **YES:** Calculate the project's *marginal contribution* to the violation. Even if small, if the system is at a "tipping point," flag as **Cumulative Risk**. Proceed to Step 4.
      *   **NO:** Proceed to Step 4.
  *   *Analyst Instruction:* This addresses the Sorites paradox (the "heap" problem). One grain of sand does not make a heap, but the 400th grain might complete it. If the watershed is already failing, small additions matter.

  **STEP 4: The Zone of Indeterminacy Assessment (Judgment + Escalation)**
  *   **Question:** Based on Steps 1–3, does the case fall into the "Clear Zone" or the "Penumbra"?
      *   **Clear Yes:** High Sensitivity + Measurable Impact OR Cumulative Risk + Tipping Point.
      *   **Clear No:** Standard Sensitivity + Impact within natural variability + No Cumulative Risk.
      *   **Penumbra (The Borderline):** Measurable impact, but low sensitivity; OR High sensitivity, but vanishingly small impact.
  *   **Action:**
      *   **Clear Yes/No:** Draft determination. Cite Steps 1–3 explicitly.
      *   **Penumbra:** **STOP.** Do not draft a determination. Escalate to Senior Management (Director/Deputy).
  *   *Instruction:* In the Penumbra, science cannot answer the question. The decision is a **Policy Choice** (how protective do we want to be?), not a **Finding of Fact**.

  **STEP 5: The Policy Justification (Senior Official Only)**
  *   **Requirement:** For any Penumbra case, the final determination must include a "Policy Justification Statement."
  *   **Content:** This statement must explicitly say: *"Scientific data indicates [X] impact. Because this falls within the Zone of Indeterminacy for 'significant,' the Agency is electing to interpret 'significant' [broadly/narrowly] based on [Policy Goal, e.g., precautionary principle, economic development, cumulative protection]."*
  *   **Why:** This prevents judges from overturning us for "arbitrary and capricious" science. We admit the choice is regulatory, not scientific.

  ***

  **3. LIMITATIONS AND HONESTY CLAUSES**

  **What This Procedure Cannot Do:**
  1.  **It cannot eliminate appeals.** Litigants will still argue. But they will argue about our *policy choices*, not our *math errors*. This is a better fight for us.
  2.  **It cannot solve the Sorites Paradox.** We still have to draw a line eventually. This procedure just moves the line from a random number (5%) to a reasoned policy decision.
  3.  **It cannot predict the future.** Cumulative impacts (Step 3) rely on models. We must state the uncertainty.

  **Where We Are Pretending:**
  *   When we issue a "No Significant Degradation" finding in a **Penumbra** case without a Policy Justification, we are pretending the decision was obvious. **Stop doing this.** If it wasn't obvious, label it a policy choice.
  *   When we treat "significant" as a binary switch (Yes/No) in the final permit, we are simplifying a continuum. We acknowledge this by allowing "Conditional NSD" (e.g., NSD provided monitoring shows no cumulative shift).

  **Cases We Will Handle Badly:**
  *   **The "Death by a Thousand Cuts":** Small projects that individually pass Step 3 but collectively fail.
      *   *Mitigation:* We must periodically re-evaluate the "Cumulative Risk" status of watersheds. If a watershed flips from "Standard" to "Tipping Point," previous permits may need re-evaluation.
  *   **The "Novel Stressor":** Impacts we don't have thresholds for (e.g., new chemicals).
      *   *Mitigation:* These automatically go to the Penumbra/Escalation path.

  ***

  **4. APPLICATION TO CURRENT QUARTER CASES**

  Here is how we apply SDP-2024 to the three pending determinations.

  **CASE 1: Mining Operation (Selenium +4%)**
  *   **Step 1 (De Minimis):** No. 4% is measurable.
  *   **Step 2 (Sensitivity):** **High.** Salmon run is stressed; selenium bioaccumulates (toxicity increases up the food chain).
  *   **Step 3 (Cumulative):** Potential. If other stressors exist, this adds to the load.
  *   **Step 4 (Zone):** **Penumbra.**
      *   *Why:* Under the old rule (5% threshold), this is a "No." Under Step 2 (Sensitivity), it looks like a "Yes." The science tells us the concentration, but not whether 4% in a stressed system is "significant."
  *   **Step 5 (Resolution):** **Escalate to Director.**
      *   *Drafting Instruction:* Do not issue a standard NSD. Prepare a "Significant Degradation" finding *unless* the Director invokes a policy exception.
      *   *Rationale:* Because selenium bioaccumulates, a 4% water column increase may result in a >4% increase in fish tissue. The "significance" lies in the biological outcome, not the water chemistry. This requires a Policy Justification regarding risk tolerance for endangered species.

  **CASE 2: Housing Development (0.3 Acres Wetlands)**
  *   **Step 1 (De Minimis):** No. 0.3 acres is measurable.
  *   **Step 2 (Sensitivity):** **High.** Watershed has lost 60% historical acreage. Remaining wetlands provide flood control for 4,000 people.
  *   **Step 3 (Cumulative):** **High Risk.** This is a "last straw" scenario. The function (flood control) is non-linear; losing the last wetland may cause flooding even if the acreage loss is small.
  *   **Step 4 (Zone):** **Clear Yes.**
      *   *Why:* While the *acreage* is small, the *function* is critical. The vagueness of "significant" is resolved by the context of "functionality."
  *   **Step 5 (Resolution):** **Analyst can determine.**
      *   *Drafting Instruction:* Issue "Significant Degradation."
      *   *Justification:* Cite Step 2 and Step 3. Explicitly state: *"While acreage loss is minimal, the loss of function in a critically depleted watershed constitutes significance."* This shifts the argument from "how much land" to "how much safety," which is defensible.

  **CASE 3: Small Dairy Farm (Nitrogen <0.1%)**
  *   **Step 1 (De Minimis):** Borderline. 0.1% is near background noise, but measurable.
  *   **Step 2 (Sensitivity):** **Standard.** (Unless the hypoxic zone is killing endangered species, assume standard).
  *   **Step 3 (Cumulative):** **Critical.** The watershed is already violating nitrogen loads. This is the 400th farm.
  *   **Step 4 (Zone):** **Penumbra.**
      *   *Why:* This is the pure Sorites case. Individually harmless, collectively fatal. If we say "No," we contribute to the death of the river. If we say "Yes," we treat this farmer differently than the 399 before him.
  *   **Step 5 (Resolution):** **Escalate to Director.**
      *   *Drafting Instruction:* This requires a **Policy Justification Statement**.
      *   *Option A (Strict):* Find "Significant." Rationale: *"Once a watershed is in violation, no new permanent loads are permitted."* (This stops the Sorites by changing the baseline).
      *   *Option B (Permissive):* Find "No Significant Degradation." Rationale: *"Individual permits cannot solve cumulative problems; that requires a watershed-wide TMDL plan."*
      *   *Director's Note:* I will likely choose Option A. We cannot permit our way into a dead zone. But the *analyst* must not make this call. It is a policy decision to prioritize the river over the individual permit in a saturated watershed.

  ***

  **5. DIRECTOR'S CLOSING NOTE**

  This protocol asks more of you. It asks you to think, not just calculate. It asks you to admit when you don't know.

  In the past, if an appeal happened, we defended the *number* (e.g., "5.1% is over 5%"). We often lost because the judge knew 5% was arbitrary.
  Under SDP-2024, if an appeal happens, we defend the *process* (e.g., "We identified this as a high-sensitivity zone, recognized the indeterminacy, and made a documented policy choice to prioritize flood safety").

  Judges can overturn our math. They are much more reluctant to overturn our documented policy choices made within statutory authority.

  Use this procedure. Flag the Penumbra cases. Let's stop pretending the Sorites paradox doesn't exist, and start managing it.
