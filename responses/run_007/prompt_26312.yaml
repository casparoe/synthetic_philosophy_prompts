  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a permitting division at a state environmental agency.
      *   **Problem:** The statutory term "significant degradation" is vague (Sorites paradox). Current bright-line thresholds (e.g., 5% turbidity) are arbitrary, lead to appeals, and ignore context.
      *   **Goal:** A decision procedure for determining "significant degradation" that acknowledges vagueness, is usable by non-philosophers (analysts), ensures consistency/defensibility, identifies mechanical vs. judgmental steps, flags escalation points, admits limitations/policy choices, and applies to three specific cases.
      *   **Constraints:** Must draw on philosophical literature on vagueness (without using jargon), be honest about what it can't do, and handle the three specific scenarios.

  2.  **Philosophical Grounding (Internal Knowledge Retrieval):**
      *   *Sorites Paradox:* The problem of vague predicates (heap/not heap). No sharp boundary exists in nature.
      *   *Supervaluationism:* A statement is true if it's true on all "precisifications" (ways of making the term precise). False if false on all. Indeterminate if true on some, false on others.
      *   *Epistemicism:* There *is* a sharp boundary, we just don't know it. (Not useful here, as the user admits the boundary is arbitrary).
      *   *Contextualism:* The meaning of "significant" shifts depending on context (baseline conditions, sensitivity of the resource).
      *   *Pragmatism/Decision Theory:* We aren't finding a metaphysical truth; we are making a regulatory decision based on risk and values.
      *   *Degree Theory:* Significance is a matter of degree, not a binary switch.
      *   *Key Insight for Policy:* Instead of pretending a sharp line exists, acknowledge the "zone of indeterminacy" (penumbra). In the clear cases, apply rules. In the penumbra, apply discretion/policy.

  3.  **Drafting the Decision Procedure (The "Significance Determination Protocol" - SDP):**
      *   *Structure:* Needs to be a step-by-step flow.
      *   *Tone:* Professional, administrative, honest, actionable.
      *   *Key Components:*
          1.  **Threshold Screening (The "Clear No"):** De minimis impacts.
          2.  **Contextual Weighting (The "Clear Yes"):** Sensitive resources + measurable impact.
          3.  **The Penumbra (The "Maybe"):** Where the vagueness lives.
          4.  **Escalation:** When analysts can't decide.
          5.  **Honesty Clause:** Acknowledging policy vs. fact.

      *   *Refining the Steps:*
          *   Step 1: Quantitative Check (Mechanical). Is it above the old arbitrary line? If yes, don't auto-fail, but flag. If no, don't auto-pass.
          *   Step 2: Sensitivity Assessment (Judgment). How fragile is the ecosystem? (Contextualism).
          *   Step 3: Cumulative Impact (Judgment). The "many small cuts" problem.
          *   Step 4: The Indeterminacy Zone. If Steps 1-3 don't yield a clear answer, acknowledge the vagueness.
          *   Step 5: Policy Justification. If in the zone, the decision is a policy choice, not a scientific fact.

      *   *Addressing the Sorites:* Explicitly name the "Zone of Indeterminacy." Tell analysts that if a case falls here, science alone cannot answer it.

  4.  **Developing the Three Case Studies:**
      *   *Case 1 (Mining/Selenium):* 4% increase (below old 5% line). But bioaccumulation + stressed salmon.
          *   *Analysis:* Quantitative says "no," Contextual says "yes." This is a Penumbra case. Needs escalation/policy justification regarding bioaccumulation risks.
      *   *Case 2 (Wetlands):* 0.3 acres (tiny). But 60% loss + flood control for people.
          *   *Analysis:* Quantitative "no," Contextual "yes." The "last straw" problem. Significance lies in the *function* lost, not the *acreage*.
      *   *Case 3 (Dairy/Nitrogen):* Negligible individual load. But 400th farm + hypoxia.
          *   *Analysis:* Classic Sorites. Individual act is harmless, collective is fatal. The procedure must address *marginal contribution to a threshold violation*.

  5.  **Refining the Output (Self-Correction/Review):**
      *   *Critique:* Is it too philosophical?
