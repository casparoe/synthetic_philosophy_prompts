  *(Self-Correction during drafting the response)*: I need to make sure I don't just give them a new checklist that *looks* like the old one. The old one was arbitrary thresholds. The new one must be *weighted*. I need to emphasize that the "5% line" is no longer a cliff, but a trigger for deeper review. I also need to make sure the "cumulative impact" issue (Case 3) is handled, as that's the hardest part of the Sorites for regulators. The procedure needs a specific step for "Marginal Contribution to a Tipping Point."

