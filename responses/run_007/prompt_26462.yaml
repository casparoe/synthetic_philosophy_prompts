      *   Check against Hofstadter's specific definition: "Inviolate level... sits outside the loop and enables it without itself being caught up in it."

  8.  **Final Review against Prompt:**
      *   Reading through lens of tangled hierarchy/inviolate level? Yes.
      *   Where does it endorse? (Mechanics, Limbo).
      *   Where does it challenge? (Ending, Emotional Truth).
      *   Specific scenes? (Hotel hallway, The Safe, Limbo, The Spin).
      *   Willing to say where it resists? Yes (The shift from ontology to psychology).

  *(Self-Correction Note)*: I need to be careful not to say Hofstadter is *wrong*, but rather that the film expands the definition of what constitutes "ground." For Hofstadter, the ground is structural/logical. For Nolan/Cobb, the ground can be existential/volitional.

