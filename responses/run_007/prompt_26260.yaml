      *   Use specific Dennettian terminology (Cartesian Theater, Center of Narrative Gravity, Abstract Object, Compatibilism).
      *   Check dates/works: *Consciousness Explained* (1991), *The Self as Center of Narrative Gravity* (1992), *Freedom Evolves* (2003).

  6.  **Self-Correction/Review during drafting:**
