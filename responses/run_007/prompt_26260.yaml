      *   *Correction:* On "socially constructed." Dennett is a naturalist. He sees the narrative arising from evolutionary pressures and social interaction. "Socially constructed" might sound too much like Rorty or postmodernism to some hardline Dennettians, but it's not wrong. I'll nuance that.
      *   *Correction:* On "abandon." The article says abandon the "unified, persisting self... author of actions." Dennett definitely abandons the *Cartesian* author. But he keeps a version of the "author" as the locus of responsibility. I need to be precise here. The *myth* is the Cartesian part, not the functional part.

