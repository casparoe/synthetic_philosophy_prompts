answer: |-
  This is a map of the normative and formal landscape surrounding decision problems with undefined expectations (e.g., the Pasadena game, the Altadena game). The literature does not offer a consensus solution; rather, it offers a menu of trade-offs. The following desiderata outline what a complete theory is expected to handle, categorized by their status in the current debate.

  ### I. Desiderata for a Theory of Undefined Expectations

  #### 1. Extensional Adequacy (The "Verdict" Requirement)
  *   **Requirement:** The theory must deliver a verdict (preference, indifference, or suspension of judgment) for paradigmatic cases where standard Expected Utility Theory (EUT) is silent.
  *   **Cases:** The Pasadena Game (payoffs follow the alternating harmonic series); The St. Petersburg Game (infinite but defined expectation, often used as a boundary condition).
  *   **Principle:** Rational Choice Normativity. A decision theory should guide action, not merely calculate numbers. If EUT crashes, a successor theory should either provide a calculation or a principled reason for silence.
  *   **Distinction:** Must not collapse "undefined value" with "zero value" or "infinite value."
  *   **Status:** **Non-negotiable.** Even if the verdict is "no rational preference," the theory must explicitly validate that verdict rather than failing to compute.

  #### 2. Statewise Dominance Preservation
  *   **Requirement:** If Gamble $A$ yields a strictly higher payoff than Gamble $B$ in every possible state of the world, the theory must rank $A \succ B$.
  *   **Cases:** **Pasadena vs. Altadena.** The Altadena game is identical to the Pasadena game, except every payoff is increased by $1. Since $1$ is added to every outcome, Altadena statewise dominates Pasadena.
  *   **Principle:** Dominance Principle. It is irrational to choose a strictly dominated option.
  *   **Distinction:** Must not collapse "better in expectation" with "better in every state."
  *   **Status:** **Strong Intuition / Contested Application.** Almost all theorists regard this as a hard constraint. However, some formal solutions (e.g., certain summation methods) struggle to preserve this when expectations are undefined, leading some to argue that Dominance may not apply to infinite state spaces in the same way.

  #### 3. Representation Invariance (Order Independence)
  *   **Requirement:** The value of a gamble should not depend on the order in which the outcomes are summed or indexed in the mathematical representation, provided the probability-outcome pairs remain the same.
  *   **Cases:** **Riemann Rearrangement of Pasadena.** Mathematically, the alternating harmonic series can be rearranged to sum to any real number. A decision theory should not imply that the value of the game changes if the agent enumerates the coin toss outcomes in a different order (e.g., by time of occurrence vs. by magnitude of payoff).
  *   **Principle:** Description Invariance. Rational value is a property of the prospect, not the description of the prospect.
  *   **Distinction:** Must not collapse "mathematical summation order" with "causal/temporal order of resolution."
  *   **Status:** **Non-negotiable (Physical), Contested (Formal).** Physically, the game is what it is. However, some theories (e.g., those relying on specific summation methods like Cesàro means) implicitly accept a specific ordering, while others (e.g., Easwaran's Weak Expectation) attempt to bypass the issue.

  #### 4. Finite Additivity / Linearity
  *   **Requirement:** The value of a combination of independent gambles should be the sum of their individual values ($V(A + B) = V(A) + V(B)$).
  *   **Cases:** **Two Pasadena Games.** If an agent plays two independent Pasadena games simultaneously, does the total value equal twice the value of one?
  *   **Principle:** Linearity of Expectation.
  *   **Distinction:** Must not collapse "independent plays" with "single compound gamble."
  *   **Status:** **Preference of the Formalist Camp.** Many decision theorists (e.g., Hájek) view this as essential for a utility theory. However, others (e.g., Colyvan) suggest that in the realm of the undefined, additivity may fail, and insisting on it creates paradoxes.

  #### 5. Consistency with Standard EUT (The Limit Condition)
  *   **Requirement:** In cases where the expected value is absolutely convergent (defined), the new theory must yield the same verdict as standard EUT.
  *   **Cases:** Standard finite lotteries; Modified St. Petersburg games with capped payoffs.
  *   **Principle:** Conservatism. A new theory should not overturn settled results where the old theory works.
  *   **Distinction:** Must not collapse "conditionally convergent" with "absolutely convergent."
  *   **Status:** **Non-negotiable.** Any theory that contradicts standard EUT in finite or absolutely convergent infinite cases is considered extensionally inadequate.

  ---

  ### II. Tensions and Impossibility Results

  The central insight of this literature is that **no theory can satisfy all the above desiderata simultaneously.** The mathematical structure of conditionally convergent series forces a choice between competing normative principles.

  #### 1. The Riemann Trilemma
  The Riemann Rearrangement Theorem demonstrates that for conditionally convergent series (like the Pasadena payoffs), the sum depends on the order of terms. In decision theoretic terms, this creates a tension between **Representation Invariance**, **Standard Expectation**, and **Extensional Adequacy**.

  *   **The Conflict:**
      1.  If you define Value = Standard Expectation ($\sum p_i u_i$), you violate **Representation Invariance** (because the sum changes with rearrangement).
      2.  If you enforce **Representation Invariance**, you cannot use Standard Expectation for these cases (you must use a different valuation metric, like Weak Expectation).
      3.  If you use a different metric, you risk violating **Consistency with Standard EUT** or **Linearity**.

  *   **Impossibility:** You cannot have a value function that is (a) defined for all conditionally convergent gambles, (b) equal to the standard sum, and (c) invariant to state indexing. One must go.

  #### 2. Dominance vs. Expectation (The Altadena Problem)
  While Dominance (Desideratum 2) seems non-negotiable, it creates tension with theories that attempt to assign precise values to undefined expectations.

  *   **The Conflict:** Some summation methods that assign a value to the Pasadena game (e.g., assigning it 0 via specific regularization) struggle to maintain the strict inequality required by the Altadena game without violating **Linearity** or **Representation Invariance**.
  *   **Lauwers & Vallentyne (2004):** Demonstrated that no decision rule can satisfy Dominance, Transitivity, and a weak form of Expectation simultaneously over infinite state spaces.
  *   **Implication:** A theory that preserves Dominance (Altadena $\succ$ Pasadena) often must surrender the idea that these games have a *precise real-number value*. Instead, they may have to be treated as having interval values, or no value at all, with the preference derived relationally.

  #### 3. Weak vs. Strong Expectation (Easwaran's Distinction)
  Kenny Easwaran (2008) proposed distinguishing **Strong Expectation** (standard sum) from **Weak Expectation** (limit of average payoffs over repeated trials).

  *   **The Tension:**
      *   **Strong Expectation** preserves Linearity but fails Existence (undefined for Pasadena) and Invariance (if forced).
      *   **Weak Expectation** exists for Pasadena (it converges to $\ln 2$) and preserves Invariance, but it **violates Linearity** (the weak expectation of a sum is not always the sum of weak expectations).
  *   **Trade-off:** You can save Existence and Invariance, but you must sacrifice Linearity. Or you can save Linearity, but you must accept Undefinedness for Pasadena.

  ---

  ### III. Settled vs. Contested

  To navigate the literature accurately, you must distinguish between mathematical facts, consensus diagnoses, and disputed solutions.

  #### Settled (Consensus)
  1.  **Mathematical Undefinedness:** It is settled that the standard expected value of the Pasadena game is undefined (the series is conditionally convergent, not absolutely convergent).
  2.  **EUT Failure:** It is settled that classical Expected Utility Theory provides no verdict for the Pasadena game.
  3.  **Riemann Implication:** It is settled that any solution relying on the standard sum of the series is vulnerable to order-dependence objections.
  4.  **Altadena Intuition:** There is near-consensus that a rational agent should prefer the Altadena game to the Pasadena game (Dominance). A theory that violates this is widely regarded as suspect, though not strictly logically impossible.

  #### Contested (Disputed)
  1.  **The Normative Significance:**
      *   *Camp A (e.g., Hájek):* The undefined EV is a genuine problem for rationality that requires a new decision rule.
      *   *Camp B (e.g., Smith):* The undefined EV reveals that the agent simply has incomplete preferences. No new calculation is needed; "no verdict" *is* the verdict.
  2.  **Weak Expectation as a Solution:**
      *   *Pro:* Easwaran argues Weak Expectation captures the long-run behavior and solves the Pasadena problem.
      *   *Con:* Critics (e.g., Bartha) argue Weak Expectation violates Linearity and does not capture the value of a *single* play, which is what decision theory usually governs.
  3.  **Relative Expectation:**
      *   *Pro:* Bartha and Colyvan argue we should only compare differences between gambles (Relative Expectation), which allows Altadena $\succ$ Pasadena without assigning absolute values.
      *   *Con:* Critics argue this restricts the domain of decision theory too much (you can't compare a Pasadena game to a sure thing easily).
  4.  **Principle of Indifference:**
      *   Some earlier attempts relied on assigning probabilities to the "order of summation." This is largely contested and often rejected as ad hoc.

  ### Summary of the "Impossible Subset"
  If you are evaluating a proposed solution, check it against this triad. **No theory can satisfy all three:**
  1.  **Precise Valuation:** Assigns a unique real number to the Pasadena game.
  2.  **Order Invariance:** The value is independent of how states are indexed/summed.
  3.  **Linearity:** $V(A+B) = V(A) + V(B)$.

  *   **Standard EUT** keeps (2) and (3) but drops (1) (says value is undefined).
  *   **Easwaran's Weak Expectation** keeps (1) and (2) but drops (3).
  *   **Summation Methods (e.g., Cesàro)** keep (1) and (3) but drop (2) (implicitly rely on specific ordering).
  *   **Relative Expectation** drops (1) (no absolute values) to keep (2) and a modified version of (3).

  A successful evaluation of any new paper in this space consists of identifying which of these three horns the author chooses to impale themselves on, and arguing why that sacrifice is the least costly.
