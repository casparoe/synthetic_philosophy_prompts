      *   *D1: Extensional Adequacy.* (Must handle Pasadena/Altadena).
      *   *D2: Dominance Preservation.* (Altadena > Pasadena).
      *   *D3: Representation Invariance.* (Order of summation shouldn't matter).
      *   *D4: Finite Additivity / Linearity.* (Combining gambles).
      *   *D5: Agreement with Defined EV.* (When EV exists, match it).

