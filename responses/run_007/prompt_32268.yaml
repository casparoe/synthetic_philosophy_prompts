      *   *Desideratum 5: The "Two-Envelope" / Relative Expectation.*
          *   *Requirement:* Comparing two undefined games should sometimes be possible.
          *   *Case:* Pasadena vs. Pasadena (obviously equal), or Pasadena vs. Altadena.
          *   *Status:* Contested. Some say "no comparison possible," others say "relative expectation."

  4.  **Refining the Tensions (The "Riemann" Insight):**
      *   The Riemann Rearrangement Theorem states that a conditionally convergent series can be rearranged to sum to any real number.
      *   In decision theory, "rearranging" corresponds to re-indexing states or considering the order of outcomes.
      *   *The Impossible Trinity:*
          1.  Assign a precise real value to conditionally convergent games (like Pasadena).
          2.  Maintain Linearity/Additivity (Expectation of sum = sum of expectations).
          3.  Maintain Order Invariance (Value doesn't depend on state indexing).
      *   *Actually, the stronger tension is:*
          1.  **Standard Expectation:** Value = $\sum p_i u_i$.
          2.  **Unrestricted Domain:** Applies to Pasadena.
          3.  **Order Invariance:** Value is independent of summation order.
      *   *Mathematical Fact:* You cannot have 1, 2, and 3 simultaneously for conditionally convergent series.
      *   *Decision Theoretic Translation:* You cannot satisfy Dominance (specifically Statewise), Linearity, and Order Invariance simultaneously for these games.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Standard EUT fails here. The EV is mathematically undefined.
      *   *Contested:* Whether rational agents *should* care about undefined EVs. Whether dominance overrides EV. Whether we should use "Weak Expectation" (Easwaran) or "Relative Expectation" (Bartha/Collyvan).
