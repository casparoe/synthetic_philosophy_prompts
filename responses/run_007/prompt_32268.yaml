      *   **Constraint:** Distinguish settled matters from contested ones; do not present contested views as consensus.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Key Games:* St. Petersburg (infinite EV but defined), Pasadena (undefined EV due to conditional convergence), Altadena (Pasadena + constant), St. Petersburg variants.
      *   *Key Problem:* The expectation integral/sum does not converge absolutely. Order of summation matters (Riemann Rearrangement Theorem).
      *   *Key Players/Theories:* Nover & Hájek (Pasadena), Colyvan, Hájek, Smith, Bartha, Lauwers, Gwiazda, Easwaran (weak/strong expectations), decision rules like Dominance, State-wise Dominance, Principle of Indifference (sometimes), Relative Expectation.
      *   *Core Tension:* Standard Expected Utility Theory (EUT) axioms (like Independence, Continuity) vs. the mathematical reality of conditionally convergent series.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Handling the Pasadena Game.*
          *   *Requirement:* The theory must assign *some* verdict or explain why none exists. It can't just crash.
          *   *Case:* Pasadena Game (alternating harmonic series payoffs).
          *   *Status:* Non-negotiable. A decision theory must output a recommendation or a suspension of judgment.

      *   *Desideratum 2: Dominance.*
          *   *Requirement:* If Game A pays more than Game B in every state, A > B.
          *   *Case:* Pasadena vs. Altadena (Altadena = Pasadena + $1).
          *   *Status:* Highly contested. Standard EUT says yes. But with undefined EVs, does dominance hold? Many think it's non-negotiable, but some solutions sacrifice it. Let's mark it as "Strong Intuition / Contested Application."

      *   *Desideratum 3: Invariance to Representation (Order Independence).*
          *   *Requirement:* The value shouldn't depend on how we list the outcomes.
          *   *Case:* Riemann Rearrangement Theorem application to Pasadena.
