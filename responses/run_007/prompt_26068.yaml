answer: |-
  Dear Colleague,

  It is a profound pleasure to engage with you on this intersection of metaethics and evolutionary science, particularly given your background in the latter and your current immersion in Moore. The task you have set is inherently provocative because Moore's entire project in Principia Ethica is built upon the rejection of the very naturalistic reduction you are asking me to perform. He famously argued that defining good in terms of natural properties commits the naturalistic fallacy, yet to satisfy your request, I must willingly commit this fallacy to see what insights emerge from the collision. I will proceed by translating Moore's normative claims into the descriptive language of evolutionary biology, utilizing the toolkit you specified, and then I will assess the residue that remains untranslatable.

  To begin with Moore's claim that the pleasures of human intercourse, specifically friendship and affection, are intrinsic goods, we can map this onto the frameworks of kin selection and reciprocal altruism. In evolutionary terms, the behaviors Moore identifies as good are strategies that maximize inclusive fitness. Affection toward kin is the proximate mechanism driving kin selection, ensuring the propagation of shared genes, while friendship among non-kin operates through reciprocal altruism, where cooperation yields higher survival probabilities than defection. The feeling of pleasure itself is a proximate causation mechanism, a neurochemical reward system involving oxytocin and dopamine that reinforces these adaptive social bonds. Where Moore sees an intrinsic good, evolutionary biology sees an ultimate causation rooted in reproductive success. The value of the friendship is not inherent in the abstract but is instrumental to the stability of the social group and the genetic legacy of the individuals involved. However, Moore insists these are good even if they produce no further consequences. In evolutionary vocabulary, this might be interpreted as a mismatch, where a trait adapted for the environment of evolutionary adaptedness is pursued in a modern context where it no longer yields fitness benefits, yet the proximate reward mechanism remains intact. We pursue friendship because the neural circuitry dictates it is valuable, even if the ultimate causal link to fitness is severed in a specific modern instance.

  Regarding Moore's second great good, the enjoyment of beautiful objects, we can employ sexual selection and signaling theory. The appreciation of beauty often correlates with the detection of honest signals of health and genetic quality, such as symmetry in faces or vitality in landscapes that suggest resource abundance. The enjoyment is the proximate affective state that drives the organism toward these adaptive stimuli. Moore's assertion that the beauty is good in itself translates to the idea that the sensory apparatus is tuned to value certain configurations because they historically correlated with survival. However, Moore also includes art and abstract beauty, which may be better explained as byproducts or spandrels of cognitive adaptations designed for other purposes, such as pattern recognition or status signaling. The consumption of art might function as a supernormal stimulus, hijacking the reward systems evolved for recognizing natural beauty. In this framework, the enjoyment of beauty is a functional interface between the organism and its environment, calibrated by selection pressures to guide behavior toward fitness-enhancing outcomes, even if the conscious experience feels detached from utility.

  Moore's concept of organic unities presents a fascinating challenge for translation. He argues that the value of a whole is not merely the sum of the values of its parts, specifically noting that consciousness of a beautiful object is vastly more valuable than the object alone or the consciousness alone. In evolutionary biology, this finds a counterpart in the concept of emergent properties and synergistic effects within complex systems. The fitness value of a social group or a sensory interaction is not additive; it is multiplicative or synergistic. A signal has no fitness value without a receiver, and a receiver has no fitness value without a signal; the value emerges from the interaction, much like Moore's organic unity. We might describe this using the logic of co-evolution, where the trait and the environment evolve in tandem, creating a fit that cannot be understood by analyzing the organism in isolation. The whole organism-environment system possesses a viability that the parts do not, mirroring Moore's intuition that the conjunction of consciousness and object creates a unique value distinct from its constituents.

  Having attempted this translation, I must now provide the residue report you requested, detailing where the evolutionary framework fails to capture Moore's claims. The claims regarding the behaviors themselves translate cleanly. Friendship maps to reciprocal altruism and kin selection, and the enjoyment of beauty maps to sensory adaptations and signaling. These are descriptive matches. However, the translation begins to distort when we address the modality of value. Moore claims these things are intrinsically good, meaning their value is non-contingent and objective. Evolutionary biology can only describe instrumental value; nothing is good in itself, only good for something, typically survival or reproduction. To translate intrinsic good as ultimate fitness goal is a distortion because evolution has no telos. Fitness is a measure of replication, not a moral end state. Therefore, the claim that these goods are valuable even if they produce no further consequences translates poorly. In evolution, if a trait produces no fitness consequences, it is neutral, not intrinsically good. The evolutionary framework treats the feeling of value as a means to an end, whereas Moore treats the feeling as the end itself.

  The most significant residue, however, lies in Moore's concept of intrinsic goodness itself, which has no expression at all in evolutionary terms. Evolutionary biology is a descriptive science of causes and effects, while Moore's intrinsic good is a normative property. There is no biological counterpart to ought. We can explain why an organism values friendship via proximate mechanisms, but we cannot explain why friendship is objectively good in a universe devoid of observers. This failure of translation does not necessarily indicate a limit of the evolutionary framework, nor does it immediately validate Moore's metaphysics. It may instead highlight a category error. Moore is asking for a justification of value from within the system of nature, while evolutionary biology explains the system of nature without reference to justification. The residue tells us that evolutionary biology can explain the origin of our moral intuitions, including the intuition that some things are good in themselves, but it cannot validate the truth of those intuitions.

  This leads to your final question regarding what this failure implies. If we view the failure as a limit of the evolutionary framework, we might argue that science is methodologically naturalistic and thus incapable of grasping non-natural properties, leaving room for Moore's intuitionism. However, if we view the failure as a limit of Moore's coherence, we might argue that intrinsic goodness is a cognitive illusion, a byproduct of our evolved psychology that projects objective status onto subjective preferences to enforce social cooperation. The fact that we cannot translate intrinsic good suggests that either Moore has identified a real property that lies outside the causal closure of the physical world, or he has reified a subjective feeling into an objective property. Given your expertise, you might lean toward the latter, viewing the sense of intrinsic value as a proximate mechanism so compelling that it masks its ultimate causal origins. The organic unities claim translates better than the intrinsic good claim, suggesting that Moore's phenomenological observations about how value is experienced are accurate, even if his metaphysical explanation of why that value exists is incompatible with a naturalistic worldview. Ultimately, the translation reveals that evolutionary biology can dismantle the genealogy of Moore's ethics, but it remains silent on their validity, leaving the naturalistic fallacy not as a logical error to be avoided, but as the fundamental gap between is and ought that neither framework can bridge alone.

  I hope this exploration serves your reading of Moore as well as it has served my reflection on the boundaries of our respective disciplines.

  Yours sincerely,

  The Assistant
