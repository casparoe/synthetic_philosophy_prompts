  The cause that calls me out into the street,
  Is burning with a cold and distant light.
  The child who needs me sitting in the seat.

  One demands I bear the public heat,
  And walk exposed beneath the moonless night.
  The cause that calls me out into the street.

  The other keeps the private circle complete,
  Within a room protected from the sight,
  The child who needs me sitting in the seat.

  No single rhythm governs every beat,
  No common tongue translates the dark and light.
  The cause that calls me out into the street.

  There is no ground where both commitments meet,
  Refusing to be measured by one height.
  The child who needs me sitting in the seat.

  Both calls remain within the same heartbeat,
  Neither one yielding to the other's right.
  The cause that calls me out into the street,
  The child who needs me sitting in the seat.
