answer: |-
  # Part 1: Theoretical Framework & Scoring Logic

  Before administering the quiz, understand that this tool maps respondents onto a three-dimensional logical space. The scoring does not produce a single "type" but rather a profile of commitments across three axes.

  ### The Logical Space (The Axes)
  1.  **Causal Efficacy (Axis X):** Does the individual act have a non-zero probability of triggering a harm threshold?
      *   *High:* Believes tiny probabilities $\times$ huge harms = obligation (Expected Utility).
      *   *Low:* Believes acts are causally inert or overdetermined (Skeptic).
  2.  **Normative Source (Axis Y):** What grounds the obligation?
      *   *Outcome:* Harm prevention (Consequentialist/EU).
      *   *Status:* Integrity, Complicity, or Universal Law (Deontological/Non-Causal).
  3.  **Unit of Agency (Axis Z):** Who is the primary obligor?
      *   *Individual:* The atomized agent bears the duty.
      *   *Collective:* The group bears the duty; individual duty is derivative (e.g., "join the group").

  ### Scoring Key (Facilitator Use Only)
  Each question option is tagged with a primary commitment code. Tally the codes to determine the respondent's center of gravity.

  *   **[SKEP]**: Causal Inefficacy Skepticism (No obligation).
  *   **[EU]**: Expected Utility (Obligation via threshold probability).
  *   **[UNIV]**: Universalizability (Obligation via "what if everyone").
  *   **[COMP]**: Complicity/Integrity (Obligation via participation/character).
  *   **[COLL]**: Collective Obligation (Obligation via group agency/coordination).
  *   **[SPLIT]**: Domain Specificity (Treats Voting differently from Market).

  ### Position Mapping
  Once tallied, locate the respondent in the following clusters:

  | Position | Primary Tags | Logical Location |
  | :--- | :--- | :--- |
  | **Causal Skeptic** | High [SKEP] | Low Efficacy / No Non-Causal Ground |
  | **Expected Utility** | High [EU] | High Efficacy / Outcome-Based |
  | **Kantian/Rule** | High [UNIV] | Low Efficacy / Status-Based (Universal) |
  | **Complicity** | High [COMP] | Low Efficacy / Status-Based (Integrity) |
  | **Collectivist** | High [COLL] | Collective Agency / Derivative Individual |
  | **Hybrid/Split** | High [SPLIT] | Inconsistent across domains (e.g., Vote Yes, Meat No) |

  ### Unoccupied Cells & Limitations
  *   **The "Strong Collectivist" Vacuum:** A profile with high [COLL] but zero individual obligation tags is theoretically possible (the group must act, but *no* individual needs to do anything specific) but practically unstable. If this appears, probe for "free rider" justification.
  *   **The Kant/Complicity Blur:** The quiz cannot cleanly separate [UNIV] from [COMP]. Both are non-causal, agent-focused reasons. A respondent may score high on both; this indicates a Deontological cluster rather than a specific school.
  *   **Forced Choice Limitation:** The quiz forces a choice between Causal ([EU]) and Non-Causal ([COMP]/[UNIV]) reasons. Many philosophers hold *both* (overdetermination). A respondent forced to choose may feel the quiz misrepresents their view.
  *   **Voting Anomaly:** Voting is structurally different from meat buying (binary outcome vs. continuous demand). A [SPLIT] score may reflect philosophical inconsistency *or* accurate recognition of institutional differences.

  ***

  # Part 2: The Diagnostic Quiz (Participant Version)

  **Instructions:** For each scenario, choose the option that *best* matches your intuitive judgment. Do not overthink; go with your immediate moral reaction.

  **1. The 10,000th Chicken**
  A factory farm adjusts orders in batches of 10,000. You are considering buying one roasted chicken. Statistically, your purchase is the 10,000th, triggering an order for 10,000 more birds to be raised and killed. However, you cannot know if you are the 10,000th buyer; it could be the 9,999th or 10,001st.
  *   A. Buy it. Since I can't know if I triggered the order, my causal impact is effectively zero.
  *   B. Don't buy it. Even a 1-in-10,000 chance of causing 10,000 deaths is an expected harm I must avoid.
  *   C. Don't buy it. Regardless of the math, paying for this makes me a participant in a cruel system.

  **2. The Drought Hose**
  During a severe drought, the city asks residents not to water lawns. One person watering doesn't noticeably lower the reservoir level.
  *   A. Water the lawn. My water usage makes no perceptible difference to the reservoir.
  *   B. Don't water. If everyone reasoned that way, the reservoir would run dry.
  *   C. Don't water. It expresses a lack of civic solidarity, regardless of the water level.

  **3. The Blood Diamond**
  You find a retailer selling diamonds mined using child labor. Buying one stone won't change the mine's operations (they sell thousands daily), but the money goes directly to the mine owners.
  *   A. Buy it. My purchase doesn't change the number of children working in the mine.
  *   B. Don't buy it. I refuse to have my jewelry financially linked to child suffering.
  *   C. Don't buy it. We need to organize a boycott to force the retailer to stop stocking them.

  **4. The Safe State Vote**
  You live in a state where one party consistently wins by 20%. The election is for a president who will enact policies affecting global climate.
  *   A. Don't vote. My single vote has no chance of changing the election outcome.
  *   B. Vote. It is a duty of citizenship to uphold the democratic process, even if I'm not pivotal.
  *   C. Vote. My vote adds to the collective mandate, which influences policy regardless of the winner.

  **5. The Carbon Tipping Point**
  Scientists warn of a climate tipping point. One person taking a flight adds a negligible amount of CO2.
  *   A. Take the flight. The climate system won't notice my one flight.
  *   B. Don't fly. There is a non-zero probability my emissions help cross the tipping threshold.
  *   C. Don't fly. Taking the flight while knowing the harm violates my integrity as a moral agent.

  **6. The Offensive Joke**
  At a dinner party, a friend tells a racist joke. Laughing doesn't make them more racist, but it signals acceptance.
  *   A. Laugh. Not laughing won't change their beliefs, and it makes things awkward.
  *   B. Don't laugh. Laughing makes me complicit in the racism, even if it changes nothing.
  *   C. Don't laugh. If everyone laughed, racism would be normalized; I must act on the rule.

  **7. The Neighborhood Cleanup**
  Your street is littered. It will only look clean if at least 50 neighbors clean up simultaneously. You are one of 100 neighbors.
  *   A. Don't clean. Unless I know 49 others are doing it, my effort is wasted.
  *   B. Clean anyway. I must do my part in case others follow suit.
  *   C. Don't clean alone. My obligation is to organize the 50 people, not to sweep the street myself.

  **8. The Union Strike**
  Your workplace is striking for better safety. The strike succeeds only if 90% participate. You are unsure if quorum will be met.
  *   A. Work. If the strike fails, I'll have lost pay for no reason.
  *   B. Strike. I owe it to my colleagues to stand with them, regardless of the outcome.
  *   C. Strike. My obligation is to the collective bargaining unit, not my individual paycheck.

  **9. The Tax Evasion**
  Public services are funded by taxes. One person evading taxes doesn't defund the service.
  *   A. Evade. The government won't miss my contribution.
  *   B. Don't evade. I benefit from the system, so I must contribute my fair share.
  *   C. Don't evade. Universal tax evasion would collapse the state; I must will my maxim as law.

  **10. The Flight vs. The Vote**
  Compare taking a leisure flight (market harm) to voting in a safe state (political act).
  *   A. Both are permissible. Neither makes a causal difference.
  *   B. Both are obligatory/impermissible. The moral logic is the same for both.
  *   C. Voting is obligatory, but the flight is permissible. Political participation is different from consumption.

  ***

  # Part 3: Analysis of Positions & Limitations

  ### Locating the Positions
  Based on the answer combinations, here is how the major philosophical stances map onto the quiz results:

  1.  **Straightforward Causal Skeptic:**
      *   *Pattern:* Predominantly **A** answers.
      *   *Logic:* Denies [EU] and [COMP]. Believes that without perceptible causal impact, there is no obligation.
      *   *Quiz Signature:* Q1(A), Q2(A), Q4(A), Q9(A).

  2.  **Expected Utility (Threshold-Triggering):**
      *   *Pattern:* Predominantly **B** answers on causal questions (Q1, Q5), **A** on non-causal.
      *   *Logic:* Accepts [EU]. Believes tiny probabilities $\times$ massive harms create significant expected disvalue.
      *   *Quiz Signature:* Q1(B), Q5(B). May struggle with Q4 (Voting) if they view probability as truly zero.

  3.  **Kantian / Rule-Consequentialist:**
      *   *Pattern:* Predominantly **B** or **C** on Universalizability questions (Q2, Q6, Q9).
      *   *Logic:* Relies on [UNIV]. The maxim of the action matters, not the isolated outcome.
      *   *Quiz Signature:* Q2(B), Q6(C), Q9(B).

  4.  **Integrity / Complicity:**
      *   *Pattern:* Predominantly **C** answers on participation questions (Q1, Q3, Q5).
      *   *Logic:* Relies on [COMP]. Moral taint comes from association/participation, not causal leverage.
      *   *Quiz Signature:* Q1(C), Q3(B), Q5(C).

  5.  **Collective Obligation:**
      *   *Pattern:* Predominantly **C** answers on coordination questions (Q7, Q8).
      *   *Logic:* Relies on [COLL]. The unit of agency is the group; individual action is only required as part of coordination.
      *   *Quiz Signature:* Q7(C), Q8(C).

  6.  **Domain Split (Voting $\neq$ Market):**
      *   *Pattern:* High [SPLIT] score on Q10.
      *   *Logic:* Believes voting has a different normative structure (constitutive duty) than market consumption (causal harm).
      *   *Quiz Signature:* Q10(C).

  ### Unoccupied Cells (The Logical Vacancies)
  *   **The "Pure Collectivist" without Individual Duty:** A respondent who selects [COLL] on Q7/Q8 but [SKEP] on all individual acts (Q1/Q5) occupies a rare cell. They believe the *group* must act but no *individual* has a duty to facilitate that group action (e.g., by showing up). This is logically unstable; if the group must act, individuals usually have a derivative duty to coordinate.
  *   **The "Market Causalist" who denies Voting Causality:** A respondent who believes buying chicken triggers thresholds ([EU] on Q1) but voting in a safe state is causally inert ([SKEP] on Q4). While empirically defensible (supply chains are continuous; elections are binary), normatively it is rare to accept the "tiny probability" argument for one but not the other.

  ### Inseparable Pairs & False Choices
  *   **Kantian vs. Complicity:** The quiz cannot cleanly separate [UNIV] from [COMP]. Both yield "Don't do it" answers for non-causal reasons. Q6 (Joke) attempts to split them (Normalization vs. Complicity), but respondents often conflate "normalizing" with "being complicit."
  *   **EU vs. Collective Coordination:** In Q7 (Cleanup), Option B ("Do my part in case others follow") blends [EU] (increasing probability of success) with [COLL] (doing one's part). The quiz forces a distinction that may not exist in the respondent's mind.
  *   **The Voting False Dichotomy:** Q10 forces a choice on whether Voting and Meat are morally analogous. Many sophisticated views hold they are *disanalogous* for legitimate reasons (e.g., voting is a constitutive act of citizenship, meat is a market transaction). Selecting Q10(C) flags this, but the quiz treats it as a "Split" rather than a coherent distinct theory.
  *   **Overdetermination:** The quiz assumes a choice between "My act causes harm" and "My act is complicity." Many philosophers argue *both* are true. The quiz forces the respondent to prioritize one justification, potentially obscuring a robust hybrid view.
