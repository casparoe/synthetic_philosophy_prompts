      *   *Tension B:* (4) vs. (5). (4) says no decoder-independent fact of meaning. (5) says producer intention fixes a *privileged* scheme, making some interpretations *wrong*. Does "privileged" imply a fact of the matter independent of the current decoder?
      *   *Tension C:* (2) vs. (3). (2) says Outer Message is in the token's configuration. (3) says recognizing it requires a disposed decoder and they are fixed holistically. If it's *in* the configuration, why do we need holism to avoid regress? Is it really "in the token" if it requires a specific decoder to exist as a message?
      *   *Tension D:* (5) vs. (6). (5) relies on producer intention. (6) relies on the system's capacity to recognize frames. What if a producer intends a thermostat to convey meaning? (Probably not the main tension, but worth noting).
      *   *Tension E:* (1) vs. (6). (1) defines meaning via interaction. (6) denies meaning to thermostats which *do* have an interaction (input-causes-output). The distinction rests on "recognizing a frame." Does the thermostat interact with the frame?

