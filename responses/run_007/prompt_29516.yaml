      *   (3) *Regress/Holism:* Recognizing Frame requires disposed decoder, but no vicious regress because Token Structure and Decoder Dispositions are fixed holistically.
      *   (4) *No Decoder-Independent Meaning:* Meaning is relative to decoding scheme (anti-realist about intrinsic meaning).
      *   (5) *Intentional Privilege:* For artifacts (novels), producer's intention fixes a *privileged* scheme; some interpretations are wrong (realist/normative constraint).
      *   (6) *Thermostat Distinction:* Thermostats have causal input-output but no interpretation/inner message because they don't recognize frame messages.

