      *   **Tension 1: The Location of the Outer Message (2 vs. 1 & 3).**
          *   (2) claims Outer Message is a feature of the *token's configuration*.
          *   (1) claims Inner Message lives in the *interaction*.
          *   (3) claims Token/Decoder are fixed *holistically*.
          *   *Conflict:* If Outer Message is strictly in the token (2), it sounds intrinsic. But (3) admits you need a disposed decoder to recognize it. If the decoder is necessary for recognition, is the message *in* the token or in the relation? Hofstadter usually argues the "Outer Message" (e.g., "I am a message") is physically instantiated (like the grooves on a record), but its *status* as a message depends on the decoder.
          *   *Severity:* Moderate. It's a categorization issue.
          *   *Resolution:* Clarify that "feature of token's configuration" means "physically instantiated potentiality," not "actualized meaning."

      *   **Tension 2: Relativism vs. Normativity (4 vs. 5).**
          *   (4) No decoder-independent fact of meaning. (Anti-realist/Relational).
          *   (5) Producer intention fixes a *privileged* scheme; some interpretations are *wrong*. (Normative/Realist leanings).
          *   *Conflict:* If meaning is purely relative to the decoding scheme (4), how can a scheme be "wrong"? "Wrong" implies a standard outside the current decoding act. (5) introduces the *Producer* as an external anchor. But is the Producer's intention a "decoder-independent fact"? Yes, historically. But does it fix *meaning* or just *correct usage*?
          *   *Hofstadter's View:* Hofstadter struggles here. He wants meaning to be emergent/relational but also wants to say the DNA *really* codes for proteins. He usually resolves this via "isomorphism." If the isomorphism holds, it's "right." If not, "wrong."
