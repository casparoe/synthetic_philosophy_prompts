      *   **Hofstadter's Argument:** In *Drawing Hands*, there is a causal loop (Hand A draws Hand B, Hand B draws Hand A). This is a tangled hierarchy. Normally, hierarchies are strict (lower levels support higher levels). Here, they support each other. Hofstadter posits that there must be some level *outside* this loop that perceives it as a whole. This external level is the "inviolate level." It is not part of the loop itself.
