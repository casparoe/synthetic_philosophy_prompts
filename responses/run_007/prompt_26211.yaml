      *   *Affine Transformation:* $R'(x) = a R(x) + b$ where $a > 0$. The model is invariant to this regarding policy optimization (since RL optimizes relative advantage or ranking).
      *   *Interpersonal Comparison:* Aggregating reward models from different humans ($R_1, R_2, \dots, R_N$) into a global reward $R_{global}$.
      *   *Summing Utilities:* Weighted sum of reward models $\sum w_i R_i(x)$.
      *   *Pareto Criterion:* Pareto Frontier in multi-objective RL. If policy $\pi'$ improves $R_i$ for all $i$ without hurting any, it's a Pareto improvement.
      *   *Robbins (Ordinalist):* Don't sum. Stick to Pareto improvements only. Comparisons are unscientific/unidentifiable.
      *   *Sen (Capabilities/Partial):* We can make some comparisons, maybe not cardinal sums. Focus on specific dimensions or partial ordering. (This is tricky to map, maybe focus on "partial observability" or "constraint satisfaction").
