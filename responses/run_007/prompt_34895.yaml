  2.  **Deconstruct Al-Ghazālī's Occasionalism:**
      *   *Source:* Primarily *The Incoherence of the Philosophers* (Tahāfut al-Falāsifa).
      *   *Core Claim:* No necessary connection (*ḍarūra*) between what we call causes and effects.
      *   *Mechanism:* God creates every event at every moment. Fire doesn't burn cotton; God creates the burning *concomitant* with the contact of fire and cotton.
      *   *Time:* Discrete moments (atoms of time). The world is recreated at every instant.
      *   *Habit (*ʿĀda*):* Regularity is due to God's consistent will/habit, not natural necessity. This allows for miracles (God can break the habit).
      *   *Agency:* Human agency is complicated (acquisition/*kasb*), but ultimately God is the sole agent of creation.
      *   *Epistemology:* We observe conjunction, not causation.

  3.  **Deconstruct *Arrival* (Film Analysis):**
      *   *Premise:* Linguist Louise Banks learns Heptapod B (logograms).
      *   *Effect:* Learning the language rewires her brain to perceive time non-linearly (Sapir-Whorf hypothesis on steroids).
      *   *Metaphysics:* Block Universe / Eternalism. Past, present, future exist simultaneously.
      *   *Causation:* Teleological. The end determines the beginning. "Knowing the future doesn't change it."
      *   *Key Scenes:* The opening montage (Hannah's life/death), the vision of the future during the present crisis, the final choice to have the child despite knowing the outcome.

  4.  **Drafting the Comparison - Step-by-Step:**

      *   **Introduction:** Acknowledge the creativity of the prompt. Validate the difficulty of teaching occasionalism. Set the stage.

      *   **Part 1: Al-Ghazālī's Core Commitments:**
          *   Need to be precise. It's not just "God does everything." It's about the *denial of necessary connection*.
          *   Key terms: *Tahāfut*, *ʿĀda* (Habit), Atomism of time.
          *   Distinction from Hume: Hume is skeptical/psychological; Ghazālī is ontological/theological.

      *   **Part 2: Where *Arrival* Illuminates Occasionalism:**
          *   *Disruption of Intuitive Causality:* Students think $A \to B$ is necessary. Ghazālī says it's contingent. *Arrival* shows $B$ (future) informing $A$ (present). This breaks the arrow of time, similar to how Ghazālī breaks the *power* of the cause.
          *   *The "Habit" of Time:* Louise sees the "habit" of her life (Hannah's birth, career, death). She sees the pattern. Ghazālī says we see God's habit.
          *   *Moment-by-Moment:* The film's editing (cutting between present negotiation and future memories) mimics the discrete moments of time. The "visions" aren't memories; they are present experiences of future moments. This parallels the idea that every moment is a distinct creation.
          *   *Scene:* The scene where she calls General Shang using future knowledge. She acts *now* based on a "cause" that hasn't happened yet in linear time. This mirrors the occasionalist idea that the "cause" (God's will) is external to the sequence.

      *   **Part 3: Where the Analogy Breaks (Crucial for Academic Rigor):**
          *   *Theism vs. Block Universe:* Ghazālī = God actively willing every moment (Dynamic). *Arrival* = Time is a static block (Static). For Ghazālī, the future is *contingent* on God's will (even if He knows it). For Louise, the future is *fixed*.
