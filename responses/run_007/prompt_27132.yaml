answer: |-
  **DECISION PROCEDURE FOR BYLAW AMENDMENT VALIDITY**

  **Axiom of Circularity:** There is no neutral vantage point outside the bylaws. This procedure applies the *current* bylaws to judge proposals that may change them. Validity is procedural, not philosophical. If the membership votes to accept a violation of this procedure, their will supersedes this checklist, subject to external law.

  **STEP 1: HIERARCHY CHECK (Mechanical)**
  *Question:* Does the proposal conflict with superior authority (state law, corporate charter, or higher-level bylaws)?
  *Sufficient Answer:* No conflict found.
  *Stop Condition:* If **Yes**, rule **Out of Order**. The society cannot vote to violate the law.
  *Note:* This is the only hard limit.

  **STEP 2: NOTICE COMPLIANCE (Mechanical)**
  *Question:* Was previous notice given exactly as required by the *current* amendment rule (e.g., time, method, content)?
  *Sufficient Answer:* Notice matches current bylaw requirements.
  *Stop Condition:* If **No**, rule **Out of Order**. You cannot amend without proper notice unless the rule is suspended (which usually requires unanimity for bylaws).

  **STEP 3: SELF-REFERENCE CONSISTENCY (Mechanical/Judgment)**
  *Question:* Does the proposal follow the *current* amendment process to change the amendment process itself?
  *Sufficient Answer:* The vote threshold and notice meet *current* rules, even if the proposal changes them for the future.
  *Stop Condition:* If the proposal attempts to change the amendment rule *without* meeting the current amendment rule's requirements, rule **Out of Order**.
  *Theory:* A rule validates its own change only if the change follows the rule as it currently stands.

  **STEP 4: ENTRENCHMENT LIMIT (Judgment)**
  *Question:* Does the proposal attempt to bind future meetings (e.g., "never be amended," "permanent")?
  *Sufficient Answer:* No language attempts to restrict future majorities.
  *Stop Condition:* If **Yes**, rule **Out of Order**.
  *Theory:* One assembly cannot bind a subsequent assembly. A clause claiming permanence is null; proposing it is futile and confusing.

  **STEP 5: RETROACTIVITY & RATIFICATION (Judgment)**
  *Question:* Does the proposal take effect retroactively to validate past acts?
  *Sufficient Answer:* The act could have been authorized originally (e.g., budget, contract) and ratification is explicit.
  *Stop Condition:* If the act was illegal (Step 1) or violates member rights (e.g., expelling someone without trial), rule **Out of Order**. Otherwise, **Valid as to Form**.
  *Theory:* Ratification cures procedural defects, not substantive illegality.

  ***

  **APPLICATION TO PROPOSALS**

  **(1) Raise Amendment Threshold (2/3 to 3/4)**
  *   **Step 1:** No conflict with law.
  *   **Step 2:** Notice given per current bylaws.
  *   **Step 3:** Uses current 2/3 rule to change the rule. Consistent.
  *   **Step 4:** Does not claim permanence; future meetings can lower it again.
  *   **Step 5:** Prospective only.
  *   **Ruling:** **Valid.**
  *   **Unpopular Outcome:** Members may dislike making future amendments harder. This procedure cannot protect them from their own vote.

  **(2) Declare Article Permanent/Unrepealable**
  *   **Step 1:** No conflict with law.
  *   **Step 2:** Notice given.
  *   **Step 3:** Uses current rule to change rule.
  *   **Step 4:** **FAIL.** Attempts to bind future assemblies.
  *   **Ruling:** **Out of Order.**
  *   **Reason:** Violates fundamental parliamentary principle. Even if passed, the clause is unenforceable; ruling it out of order prevents confusion.

  **(3) Retroactive Ratification of Budget (No Quorum)**
  *   **Step 1:** Budget itself is legal; lack of quorum was procedural.
  *   **Step 2:** Notice given (if required for bylaw change; if done via motion to ratify, notice rules differ). Assuming bylaw amendment path: Notice ok.
  *   **Step 3:** Consistent with current amendment rule.
  *   **Step 4:** Does not bind future budgets.
  *   **Step 5:** **PASS.** Ratification validates acts done without authority if the act itself was permissible.
  *   **Ruling:** **Valid.**
  *   **Limit:** Cannot ratify acts that were inherently illegal (e.g., spending funds on prohibited items).

  ***

  **LIMITS OF THIS PROCEDURE**

  **What This Cannot Settle:**
  1.  **The Ultimate Circularities:** If the membership votes 100% to ignore Step 4 (Entrenchment), this procedure cannot stop them. It rules on *order*, not *possibility*.
  2.  **Ambiguity:** If the bylaws are unclear on notice, Step 2 becomes a Judgment Call.
  3.  **Values:** This procedure ensures mechanical validity, not wisdom. A valid amendment can be disastrous.

  **Mechanical vs. Judgment:**
  *   **Mechanical:** Steps 1, 2, 3. These rely on text comparison.
  *   **Judgment:** Steps 4, 5. These rely on parliamentary principles (majority rule, ratification scope).

  **Final Warning to Chair:**
  Sign only when Steps 1–3 are clear. For Steps 4–5, append: "Ruling based on standard parliamentary principles regarding future assemblies and ratification. Subject to appeal by the membership." This preserves the membership's sovereign right to interpret their own rules while providing the consistency you require.
