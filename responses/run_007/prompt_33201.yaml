answer: |-
  # Lesson Plan: The Symposiarch's Trial
  **Course:** Upper-Level Seminar on Plato's *Laws*
  **Topic:** *Laws* Book I–II (The Defense of the Drinking Party)
  **Time:** 75 Minutes
  **Students:** 14

  ## I. Learning Objective
  Students will experience the structural logic of the Platonic symposium not as a historical curiosity, but as a **technology of moral diagnosis**. By simulating a "controlled breach" of social protocol, they will feel the tension between *license* (doing what one pleases) and *liberation* (speaking what is true), and understand the necessity of the "sober official" to convert disorder into habituation.

  ## II. Materials
  *   **14 Index Cards:**
      *   **1 Card:** "The Symposiarch" (Instructions below).
      *   **1 Card:** "The Scribe" (Records the final definition on the board).
      *   **6 Cards:** "The Loosened" (Instructions below).
      *   **6 Cards:** "The Sober" (Instructions below).
  *   **A Physical Prop:** A small gavel or bell for the Symposiarch.
  *   **Whiteboard:** Divided into two columns: "Order" and "Disorder."
  *   **Timer:** Visible to all.

  ## III. Timeline & Activity Flow

  ### 0:00–0:10 | Setup & Framing (The "City")
  *   **Action:** Arrange chairs in a tight circle. No tables.
  *   **Instructor Script:** "We are not discussing Plato yet. We are a city council. Your task is to produce a single sentence definition of **Civic Courage**. You have 30 minutes. At the end, we will judge whether the definition is sound and whether the *process* was just."
  *   **Distribution:** Hand out the Index Cards face down. Students open them simultaneously.
  *   **Constraint:** "You must follow the instructions on your card exactly. If you break character, you harm the city."

  ### 0:10–0:25 | Phase I: The Rule of Law (Sober Order)
  *   **Condition:** All students (including "Loosened") must follow strict parliamentary procedure. Raise hand, wait for Symposiarch recognition, speak max 45 seconds.
  *   **Symposiarch Instructions:** "You are the authority. Ensure order. Call on speakers. Keep time. Your goal is efficiency."
  *   **Sober/Loosened Instructions:** "Argue for the definition seriously. Maintain high decorum."
  *   **Goal:** Establish a baseline of "forced virtue." It will feel stiff, safe, and potentially superficial.
  *   **Instructor Role:** Silent observer. Take notes on who speaks, who hesitates, the quality of the emerging definition.

  ### 0:25–0:30 | The Pour (Transition)
  *   **Action:** Instructor interrupts. "The city is under stress. The protocol changes."
  *   **Instruction to Symposiarch:** "Your role shifts. You may **not** silence anyone. You may only use the gavel to *invite* further speech. You cannot say 'no,' only 'more.' You must keep the discussion moving toward truth despite chaos."
  *   **Instruction to 'The Loosened' (6 students):** "You are now 'disinhibited.' You do **not** need to raise your hand. You may interrupt. You may speak over others. **Crucial:** Do not be disruptive for fun. Be disruptive for *honesty*. If you feel a thought is urgent, speak it. Test your own restraint: can you speak freely without becoming vicious?"
  *   **Instruction to 'The Sober' (6 students):** "You must maintain protocol even if others do not. Do not interrupt back. If you are interrupted, yield, then request the floor again. Your task is to hold the line of order."

  ### 0:30–0:50 | Phase II: The Controlled Breach (The Symposium)
  *   **Activity:** The discussion resumes on "Civic Courage."
  *   **Dynamic:** The "Loosened" students will create friction (interruptions, passionate outbursts, topic shifts). The "Sober" students will try to maintain structure. The Symposiarch must weave these together without using veto power.
  *   **Instructor Role:** Watch the Symposiarch closely. Are they panicking? Are they tyrannical? Are they guiding? Watch the "Loosened": Are they revealing insight or just anger?
  *   **Stop Point:** At 0:50, cut the discussion off mid-sentence. "The wine is gone. The session is over."

  ### 0:50–0:55 | Immediate Decompression
  *   **Action:** Students return cards to the center. Silence for 60 seconds.
  *   **Prompt:** "Write down one word for how you felt during Phase II. Not what you thought, but how you *felt* in your body and social standing."

  ### 0:55–1:15 | The Platonic Debrief (Mapping the Experience)
  *   **Instructor-Led Discussion:** Connect the simulation to *Laws* I–II. (See Debrief Script below).

  ---

  ## IV. The Debrief: Mapping Activity to Text
  *Do not start by explaining Plato. Start by asking about their experience.*

  **1. The Initial Objection (The Charge of License)**
  *   **Ask the 'Sober' Students:** "When the 'Loosened' students interrupted you, what was your immediate reaction? Did you feel they were contributing or destroying?"
  *   **Map to Text:** This is Cleinias's initial objection in *Laws* I. Drinking parties seem to make men more aggressive and less obedient to law. It looks like *akolasia* (licentiousness).
  *   **Point:** If we stopped the activity here, we would ban wine.

  **2. The Reply (Wine as *Pharmakon*)**
  *   **Ask the 'Loosened' Students:** "Did having permission to interrupt make you speak *more* truthfully, or just *more*? Did you feel a temptation to be cruel?"
  *   **Map to Text:** The Athenian Stranger argues wine is a drug (*pharmakon*) that induces fearlessness. It strips away the "shame" that hides our true character.
  *   **Point:** The value isn't the liquid; it's the *revelation*. The activity wasn't about getting drunk; it was about making the hidden visible.

  **3. The Function of the Sober Official (The Symposiarch)**
  *   **Ask the Symposiarch:** "You couldn't silence anyone. How did you maintain order? Did you feel more or less powerful than in Phase I?"
  *   **Map to Text:** In *Laws* II, the drinking party requires a wise, sober ruler (the Symposiarch/Lawgiver). Their job isn't to stop the drinking, but to ensure the drinking serves education (*paideia*).
  *   **Point:** Without the Symposiarch, Phase II is a bar fight. With the Symposiarch, it is a *test*. The authority figure converts chaos into a curriculum.

  **4. Courage and Shame (The Goal)**
  *   **Ask the Class:** "Who felt 'braver' in Phase II? Was it real courage?"
  *   **Map to Text:** Plato distinguishes between the false courage of intoxication (fearlessness due to clouded reason) and true courage (resisting fear/pleasure through reason).
  *   **Point:** The symposium is a *simulation* of battle. You practice resisting the "wine" (pleasure/anger) in a safe space so you can resist it in war or politics. It is moral weightlifting.

  ---

  ## V. Predictable Failure Points & Mitigation

  **1. The "Joke" Problem**
  *   **Risk:** Students with "Loosened" cards treat the interruption permission as a chance to be funny or silly, trivializing the "moral technology."
  *   **Mitigation:** In the setup (0:10), use a grave tone. "This is a test of character, not a game. If you use your license for comedy, you fail the assignment."
  *   **Debrief Fix:** If this happens, call it out immediately in the debrief. "The Athenian warns against this exactly. When the drug reveals frivolity rather than truth, the Lawgiver has failed."

  **2. The "Tyrant" Symposiarch**
  *   **Risk:** The student Symposiarch ignores the "no silencing" rule and tries to shut down the "Loosened" students to regain control.
  *   **Mitigation:** Whisper to the Symposiarch during the transition (0:25): "Your power is now *guidance*, not *control*. If you silence them, the experiment ends."
  *   **Debrief Fix:** Use this as a teaching moment. "Plato says the official must be sober. If the official becomes angry and tyrannical, they are also 'drunk' on power. The technology breaks."

  **3. The "Wallflower" Effect**
  *   **Risk:** The "Sober" students stop participating because they keep getting interrupted.
  *   **Mitigation:** Instruct the Symposiarch during the transition: "You must actively protect the Sober speakers. Ask them: 'You were interrupted; what was your point?'"
  *   **Debrief Fix:** Connect this to the concept of *shame*. In Greece, shame was external. If you were silenced, you lost honor. The Symposiarch restores honor by inviting the speech back.

  ---

  ## VI. Limitations & The Instructor's Bridge
  *Be explicit about what the simulation cannot do. This is crucial for intellectual honesty.*

  **1. The Pharmacological Gap**
  *   **Limitation:** No index card can replicate the neurochemical effect of ethanol. Students did not actually lose cognitive control; they *pretended* to have more freedom. They could stop anytime.
  *   **The Bridge:** "Plato knows wine is a physical drug. But he treats it as a *social* technology. We simulated the *social permission* of wine. In the *Laws*, the physical effect is secondary to the social context. The point is that *any* disinhibiting force (power, wealth, wine) requires a sober supervisor."

  **2. The Shame Gap**
  *   **Limitation:** In a modern seminar, "shame" is internal guilt or embarrassment. In Classical Athens, *aidos* (shame) was about public reputation and honor before peers. The stakes here feel low.
  *   **The Bridge:** "You felt mild awkwardness. Imagine this was your reputation in a small city-state where your voting power depended on your perceived self-control. The 'Loosened' card wasn't just permission; it was a risk to your social standing. Plato's system relies on high-stakes social pressure."

  **3. The Virtue Gap**
  *   **Limitation:** 20 minutes of discussion does not build *hexis* (habituated character).
  *   **The Bridge:** "Plato admits one party doesn't make you virtuous. This was a *demonstration* of the gym. Real virtue requires repeating this exposure over a lifetime. We saw the mechanism; the *Laws* asks you to commit to the training."

  ## VII. Closing Assignment
  "For next week, write a 1-page reflection: Identify a 'wine' in your own life (social media, power in a job, stress, fatigue) that disinhibits you. Who or what acts as your 'Symposiarch'? If there isn't one, design one."
