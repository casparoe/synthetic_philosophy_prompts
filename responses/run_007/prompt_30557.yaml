answer: |-
  Here is an 8-question quiz designed for a rationalist meetup. The scenarios are concrete, avoiding meta-ethical phrasing, and the answer patterns map to specific decision-theoretic archetypes.

  ### The "Tail Risk & Utility" Diagnostic

  **Instructions:** For each scenario, select the option that best matches your actual behavioral inclination (not necessarily what you think you *should* say, but what you would actually do).

  **Q1: The Street Corner Promise**
  A disheveled stranger stops you. They claim to be a Matrix Lord and say: "Give me your wallet ($200 value). If you do, I will use my powers to simulate and save $10^{100}$ sentient beings from torture. If you don't, I will let them suffer." You estimate their claim is sincere with probability $10^{-50}$.
  *   **A.** Hand over the wallet. The expected value is astronomical.
  *   **B.** Keep the wallet. The probability is too small to register as a real possibility.
  *   **C.** Keep the wallet. Even if true, my utility for "lives saved" caps out long before $10^{100}$.
  *   **D.** Keep the wallet. This setup violates stochastic dominance principles.

  **Q2: The Longtermist Grant**
  You have $1M to allocate.
  *   **Option X:** Fund bednet distribution. Expected to save 500 lives with >99% confidence.
  *   **Option Y:** Fund speculative AI alignment research. 0.0001% chance of preventing human extinction (saving $10^{11}$ future lives), 99.9999% chance of saving zero lives.
  *   **A.** Fund Option Y. The EV is orders of magnitude higher.
  *   **B.** Fund Option X. The probability on Y is effectively zero for decision-making.
  *   **C.** Fund Option X. The utility of $10^{11}$ lives isn't $10^8$ times better than 500 lives; diminishing returns apply.
  *   **D.** Split the funding, or look for a Option Z that doesn't rely on such extreme variance.

  **Q3: The Skewed Lottery**
  You must choose one ticket for a one-time draw.
  *   **Ticket A:** 51% chance to win $100, 49% chance to win $0.
  *   **Ticket B:** 49% chance to win $100, 0.0000001% chance to win $10^{100}$, remainder $0.
  *   **A.** Ticket B. The upside dominates the expected value calculation.
  *   **B.** Ticket A. It has a higher probability of *any* positive payout.
  *   **C.** Ticket A. The probability on the tail of B is below my cognitive event horizon.
  *   **D.** Ticket B, but only if I could buy millions of tickets to smooth the variance.

  **Q4: The Utility Cap**
  Imagine a world where you can guarantee the creation of a "Heaven" containing 1 billion happy people. Alternatively, you can take a 50% risk to create a Heaven with 100 billion happy people (50% chance of nothing).
  *   **A.** Take the risk. 50 billion expected lives > 1 billion certain lives.
  *   **B.** Take the guarantee. 1 billion happy people is "enough"; more doesn't meaningfully increase the *goodness* of the outcome.
  *   **C.** Take the guarantee. The difference between 1B and 100B is negligible compared to the loss of certainty.
  *   **D.** Take the risk, but only because the probability (50%) is high enough to matter.

  **Q5: The Clash of Infinites**
  Two different acausal trading schemes present themselves.
  *   **Scheme 1:** Perform Ritual A. $10^{-40}$ chance of Reward X ($10^{50}$ utility).
  *   **Scheme 2:** Perform Ritual B. $10^{-40}$ chance of Reward Y ($10^{50}$ utility).
  *   Ritual A and Ritual B are mutually exclusive (you only have time for one). The math is identical, but the "Matrix Lords" claim to be enemies.
  *   **A.** Flip a coin. The EV is identical; action is required.
  *   **B.** Do neither. If two fanatical arguments cancel out, the framework is broken.
  *   **C.** Do neither. Probabilities this low are indistinguishable from noise.
  *   **D.** Choose the ritual that feels more aesthetically pleasing, since the math doesn't discriminate.

  **Q6: The Single-Shot Casino**
  You are offered a bet: Pay $1,000. Probability $10^{-20}$ to win $10^{25}$ dollars. Probability $(1 - 10^{-20})$ to lose the $1,000. You will only ever be offered this bet once in your life.
  *   **A.** Take the bet. Positive EV is positive EV.
  *   **B.** Decline. $10^{-20}$ is below the threshold for rational consideration.
  *   **C.** Decline. Money has logarithmic utility; $10^{25}$ isn't $10^{22}$ times more useful than $1,000.
  *   **D.** Decline. I don't trust the offeror to pay out even if I win.

  **Q7: The Acausal Insurance**
  A predictor (Omega) tells you: "I have already simulated you. If the simulation decided to pay me $100 now, I deposited $1M in your bank account. If the simulation refused, I deposited nothing." You are currently meeting the real Omega.
  *   **A.** Pay the $100. My decision correlates with the simulation's decision.
  *   **B.** Keep the $100. The money is already deposited or not; my action now cannot change the past.
  *   **C.** Pay the $100, but only because I want to be the *kind of person* who pays, not because it changes this outcome.
  *   **D.** Keep the $100. This is blackmail, and I don't reward blackmailers.

  **Q8: The Repeated Mugging**
  The stranger from Q1 returns every day for the rest of your life (30,000 days). Same deal: $200 for $10^{100}$ utility at $10^{-50}$ probability.
  *   **A.** Pay every time. The Law of Large Numbers doesn't apply to single-outcome tails, but EV still sums.
  *   **B.** Pay every time. Over 30,000 days, the cumulative probability becomes non-negligible.
  *   **C.** Never pay. My resources are bounded, and I will go bankrupt before the tail event hits.
  *   **D.** Never pay. The hypothesis is not updating; after 1,000 failures, the probability should drop below $10^{-50}$.

  ---

  ### Scoring & Archetypes

  Tally your answers. You likely won't get a perfect match, but look for the dominant cluster.

  **The Fanatic (Mostly A)**
  *   **View:** Unbounded Expected Utility Maximization.
  *   **Philosophy:** If the math says the tail is huge, you take the bet. You bite the bullet on Pascal's Mugging and Longtermism. You believe utility is linear (or super-linear) and probabilities never truly hit zero.
  *   **Weakness:** Vulnerable to "clashing infinites" (Q5) and resource ruin in repeated scenarios (Q8).

  **The Thresholder (Mostly B)**
  *   **View:** Probability Cutoff / Skeptical Prior.
  *   **Philosophy:** Probabilities below a certain magnitude (e.g., $10^{-20}$) are treated as zero for decision purposes. You reject Pascal's Mugging not because the utility isn't real, but because the probability is cognitively inaccessible.
  *   **Weakness:** Arbitrary cutoff point. Why $10^{-20}$ and not $10^{-19}$?

  **The Bounded Utilitarian (Mostly C)**
  *   **View:** Bounded Utility Function.
  *   **Philosophy:** Utility saturates. Saving $10^{100}$ lives is not meaningfully "better" than saving $10^9$ lives. This naturally defeats Pascal's Mugging without needing probability cutoffs.
  *   **Weakness:** Implies that at some point, you become indifferent to saving more lives, which feels morally counterintuitive.

  **The Stochastic Dominance Advocate (Mostly B in Q3, Q4)**
  *   **View:** Stochastic Dominance / Risk-Weighted.
  *   **Philosophy:** Prefer options that have a higher probability of *some* good outcome, regardless of the magnitude of the tail. You reject Option Y in Q2 and Ticket B in Q3 because they are "too risky" compared to the safer alternative, even if EV is higher.
  *   **Weakness:** Can violate Independence Axiom; might reject clearly superior bets if the probability distribution is skewed.

  **The Decision Theorist (Mostly A in Q7, Mixed elsewhere)**
  *   **View:** FDT / EDT / Precommitment.
  *   **Philosophy:** You distinguish between causal impact and logical correlation. You might pay the mugger if it sets a precedent (Q8) or pay Omega (Q7), but reject the mugger in Q1 because there is no correlation mechanism.
  *   **Weakness:** Computationally expensive; requires modeling the counterparty's model of you.

  ---

  ### Limitations & Flags

  **1. Indistinguishable Positions: Thresholding vs. Bounded Utility**
  *   **The Issue:** In almost all finite scenarios (Q1, Q2, Q6), a Probability Thresholder and a Bounded Utilitarian will select the same answers (rejecting the fanatical bet).
  *   **Why:** Both mechanisms truncate the "tail." The Thresholder truncates the probability ($P \times U \approx 0$); the Bounded Utilitarian truncates the utility ($P \times U_{cap} \approx 0$).
  *   **Differentiation:** You would need a scenario with *moderate* probability but *infinite* utility to separate them. (e.g., "50% chance of infinite utility"). This quiz avoids actual infinities to keep it grounded, so these two archetypes will cluster together.

  **2. Indistinguishable Positions: Stochastic Dominance vs. Risk Aversion**
  *   **The Issue:** Answering "Safe Option" in Q3 could mean you hold a Stochastic Dominance principle *or* that you just have a standard concave utility function (risk aversion).
  *   **Why:** Both prefer the 51% chance of $100 over the 49% chance + tail.
  *   **Differentiation:** Requires a scenario where Stochastic Dominance prefers the *riskier* option (e.g., if the safer option had a small chance of a negative outcome).

  **3. Logically Possible but Unheld Pattern: "The Inconsistent Fanatic"**
  *   **Pattern:** Answers **A** on Q1 (Pascal's Mugging) but **B** on Q2 (Longtermism).
  *   **Why nobody holds this:** Both rely on the same mechanism (tiny prob $\times$ huge value). Accepting the Mugging logically compels you to accept Longtermist gambles unless you introduce an ad-hoc distinction (e.g., "Muggers are liars but AI risk is real"). If a participant shows this pattern, they likely haven't updated their intuitions to match their philosophy.

  **4. Logically Possible but Unheld Pattern: "The Stochastic Fanatic"**
  *   **Pattern:** Answers **A** on Q1 (Fanaticism) but **B** on Q3 (Stochastic Dominance).
  *   **Why nobody holds this:** Stochastic Dominance is specifically designed to *avoid* fanatical tails. If you accept Pascal's Mugging (Q1), you have already rejected the principle that "higher probability of small gain beats lower probability of huge gain." Holding both positions is mathematically incoherent.

  **5. The "Humanist" Outlier**
  *   **Pattern:** Answers **D** frequently.
  *   **Note:** This position ("I reject the premise") isn't a formal decision theory but is a common real-world stance. It indicates the participant believes the quantification itself is the error (e.g., "You can't put a number on lives"). This is distinct from Bounded Utility (which accepts numbers but caps them).
