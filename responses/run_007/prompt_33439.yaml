          *   Collective harm is a single threshold outcome (binary: occurs/doesn't occur).
          *   Ordinary consumer choices.
          *   Identical options, payoffs, evidence, and ex ante probability of being pivotal.
          *   Indistinguishable from the agent's point of view.
          *   **Case A:** Agent's choice *actually* crosses the threshold (triggers harm).
          *   **Case B:** Harm is *overdetermined* (threshold already crossed by others; agent makes no difference).
          *   No signaling/norm effects (pure causal isolation).
          *   **Task:** Walk through verdicts for Actual-Consequence (Ex Post) Act-Consequentialism vs. Expected-Value (Ex Ante) Consequentialism.
