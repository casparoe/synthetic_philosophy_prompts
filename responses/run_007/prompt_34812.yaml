  **A:** The space needn't be perfect, just sufficiently expressive to capture instrumental convergence (e.g., resource acquisition). The penalty triggers on shifting *power*, not satisfying specific preferences. Even a rough approximation prevents catastrophic power shifts without requiring precise value loading. It's a safety brake, not a steering wheel. We avoid solving alignment by only preventing worst-case power shifts, not optimizing for good ones.
