  **A:** AUP penalizes *unnecessary* reduction in attainable utility. If an action increases utility for some goals without decreasing others (Pareto), the penalty is low. We block lock-in, not progress. The economic analogy is preserving capital rather than prohibiting spending. Change is allowed if it doesn't burn bridges. We measure the opportunity cost, not the outcome.
