answer: |-
  The pattern presupposes that political judgment is fundamentally about adjudicating conflicting values and interests rather than solving technical problems, rendering equal inclusion necessary for legitimacy regardless of individual competence.

  This distinction rests on a strict presupposition that political legitimacy derives from the consent of the governed rather than the objective correctness of policy outcomes. In engineering or medicine, there is an external standard of truth—a bridge stands or falls, a patient recovers or dies—allowing competence to be measured against reality. In politics, there is no such independent metric; policies create winners and losers based on distributive choices and moral values, meaning the "right" answer is determined by the preferences of those affected. Therefore, the franchise functions primarily as a mechanism for self-protection and conflict resolution among equals, not as a tool for optimizing societal efficiency. The exclusion of children and felons is consistent with this view because it targets legal agency and contract violation rather than knowledge; children lack the capacity for consent, and felons have breached the social contract, whereas an ignorant adult retains both agency and a stake in the outcome.

  Ideas that ordinary voters are secretly competent or that aggregation mechanisms like Condorcet's Jury Theorem compensate for individual ignorance are compatible with this practice but not strictly presupposed by it. The system remains logically coherent even if voters are largely ignorant, provided the principle holds that no adult should be subject to laws they had no hand in authorizing. These compatible ideas serve as defenses against epistocratic critique rather than foundational requirements of universal suffrage.

  If we took the epistemic view seriously, practice would shift from equal suffrage to weighted voting or exclusionary testing. We would implement mandatory civics or policy literacy exams akin to professional licensing, restrict voting rights based on educational attainment, or grant plural votes to the knowledgeable. This would redefine citizenship from a status of equal standing to a hierarchy of demonstrated capability, fundamentally altering how laws are legitimized and shifting the burden of proof from the state justifying exclusion to the voter proving competence.
