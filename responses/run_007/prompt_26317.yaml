answer: |-
  1. **The procedure**

  To assess whether a proposed norm has the structure to become a Lewisian convention, apply this five-step audit. A "No" answer halts the process or signals that the intervention requires enforcement rather than nudging. Each step operationalizes a specific condition from David Lewis's *Convention: A Philosophical Study*.

  1.  **Is the interaction recurrent?**
      *Question:* Does this behavior occur frequently enough for expectations to stabilize over time?
      *Evidence:* Platform logs showing high frequency of the underlying action (e.g., reposting, commenting, tagging). Look for consistent volume over weeks, not spikes.
      *Consequence:* If No, expectations cannot form. Conventions require repetition to become self-sustaining. Abort.

  2.  **Is there a coordination problem?**
      *Question:* Do users share a common interest in matching behaviors, rather than having conflicting interests?
      *Evidence:* Qualitative research indicating mutual benefit from alignment. Both parties should prefer the outcome where behaviors match over mismatched behaviors.
      *Consequence:* If No, this is a conflict or Prisoner's Dilemma, not a coordination game. Lewisian conventions cannot solve conflict without external enforcement.

  3.  **Is there an alternative regularity?**
      *Question:* Could a different behavior solve the coordination problem equally well?
      *Evidence:* Judgment call. Is the proposed norm arbitrary (e.g., driving on the right vs. left) or morally/technically necessary?
      *Consequence:* If No, the norm is not a convention but a requirement. Conventions must be arbitrary solutions to coordination; if only one solution works, it is not a convention.

  4.  **Is preference conditional on expectations?**
      *Question:* Will a user prefer to follow the norm *only if* they expect others to do so?
      *Evidence:* A/B testing or surveys showing compliance drops when users believe others are non-compliant. The payoff must depend on reciprocity.
      *Consequence:* If No, the behavior is either intrinsic (always preferred) or deviant (never preferred). Conventions rely on conditional payoff structures.

  5.  **Can compliance become common knowledge?**
      *Question:* Can users see that others are following the norm, and see that others see this?
      *Evidence:* Interface design allowing public visibility of compliance (e.g., visible tags, public counters, threaded visibility).
      *Consequence:* If No, expectations cannot align. Without common knowledge, the convention cannot self-sustain because users cannot verify the regularity.

  This procedure filters out norms lacking the game-theoretic structure required for organic emergence, saving resources for interventions that match the underlying social physics.

  2. **Worked example: a norm that should work**

  **Proposed Norm:** "Use Content Warnings (CW) for spoilers."

  1.  **Recurrence:** Yes. Media discussion is daily. Evidence shows high volume of posts tagged with show titles immediately after airing. The interaction is frequent enough for habits to form.
  2.  **Coordination:** Yes. Viewers want to avoid narrative ruin; posters want to discuss plot points. Both benefit from a signaling system that allows selective engagement. There is a common interest in reducing friction.
  3.  **Alternative:** Yes. We could use blur-boxes, separate spoiler threads, or no warnings at all. The specific signal (the text "CW") is arbitrary. Any consistent signal would solve the coordination problem.
  4.  **Conditional Preference:** Yes. Posters only bother tagging if they expect viewers to respect the tag (otherwise, tagging reduces engagement for no gain). Viewers only look for tags if they expect posters to use them (otherwise, looking is wasted effort). If one side defects, the system collapses.
  5.  **Common Knowledge:** Yes. The tag is public. Users see others using CWs and see others avoiding spoiled content. The interface makes the regularity visible to all participants.

  **Result:** Pass. This norm has the structure of a convention. Nudges (like autocompleting "CW") work here because they jumpstart the expectation equilibrium. Once users expect others to tag, they prefer to tag themselves to ensure their content is consumed appropriately. The system becomes self-sustaining because the payoff relies on mutual compliance.

  3. **Worked example: a norm that should fail**

  **Proposed Norm:** "Don't reply to new users with sarcasm."

  1.  **Recurrence:** Yes. New users post often, and replies are frequent.
  2.  **Coordination:** **No.** This fails at Step 2.
      **Reasoning:** This is not a coordination problem; it is a norm against harm. The sarcastic user often gains status, amusement, or engagement regardless of what others do. There is no mutual benefit to "matching" sarcasm levels. The victim does not coordinate; they suffer. The sarcastic user does not need others to be non-sarcastic to enjoy being sarcastic.
      **Intervention:** Since Lewisian conditions fail, nudges will not create a self-sustaining convention. You cannot rely on mutual expectations because the incentive structure is misaligned. Instead, you need enforcement (moderation queues removing sarcastic replies) or incentive redesign (downvotes hiding sarcastic replies to remove the status gain).
      **Lewisian Insight:** The framework reveals why "community pressure" fails here. Without a coordination payoff, there is no equilibrium to stabilize. You are asking users to sacrifice utility for others without reciprocal benefit. Lewis's theory tells us that conventions emerge from shared interest in coordination, not from altruism or moral duty. Therefore, treating this as a convention is a category error. The platform must act as a governor, not a nudger, because the underlying game is not cooperative.

  4. **Where the procedure breaks**

  The procedure fails where Lewis's assumptions break. First, moral norms. Norms against harassment aren't arbitrary; they aren't conventions but moral constraints. Lewis assumes common interest; harm involves conflicting interests. The procedure might flag "conditional preference," but misses the coercion.

  Second, status hierarchies. If a norm encodes power (e.g., "newbies must salute veterans"), it's not a coordination solution but a dominance display. The procedure might pass this if veterans benefit from matching, but it ignores the inequity.

  Third, algorithmic opacity. Lewis requires common knowledge. If feeds are personalized, users cannot see the global regularity. The procedure assumes users can see the "population" behavior, which algorithms often obscure, breaking the feedback loop required for convention.

  Finally, the procedure substitutes designer judgment for user preference in Step 4. You may believe a preference is conditional, but users might not feel that way. The framework is structurally blind to power dynamics and non-cooperative conflicts.
