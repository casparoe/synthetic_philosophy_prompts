answer: |-
  This is a slick argument. It effectively weaponizes computational complexity theory against normative realism, and it's valid *if* you accept a few hidden assumptions about what rationality and obligation consist in.

  However, the conclusion (7) is indeed absurd. If normative requirements collapsed into "do whatever is efficiently computable," then a sociopath who efficiently computes how to harm others would be acting normatively correctly, provided the calculation was polynomial-time.

  You can keep Premise (1) (**Ought Implies Can**), but you must reject the inference from **(4) to (5)** and challenge the definition of **"Can"** embedded in the argument.

  Here is the breakdown of where the argument fails, what you have to give up to fix it, and how to preserve (1).

  ### 1. The Primary Error: The "Optimization" Equivocation (Step 4 → 5)

  The friend's argument relies on a **Straw Man of Rationality**. It assumes that the normative requirement for agents is *Global Optimization* (finding the mathematically best solution).

  *   **The Friend's View:** Rationality = Maximize Utility. Since Max Utility is NP-hard, and Ought Implies Can, you can't be required to Maximize Utility. Therefore, you are only required to do what is easy (efficient).
  *   **The Correction:** Rationality = **Procedural Reasonableness**.

  Most normative theories (Kantian, Virtue Ethics, even sophisticated Consequentialism) do not demand that you find the *global optimum* of the universe. They demand that you employ *reasonable procedures* given your constraints.

  **Why reject the move to (5)?**
  If the normative requirement is "Use a reasonable heuristic" rather than "Find the optimal solution," then the NP-hardness of the *problem* is irrelevant.
  *   **Can** you use a reasonable heuristic? **Yes.** (Heuristics are usually polynomial-time).
  *   **Ought** you use a reasonable heuristic? **Yes.**
  *   **Result:** Ought Implies Can is satisfied without collapsing normativity into mere efficiency.

  **What you give up:** You must abandon the idea that rationality/morality is fundamentally about *outcome optimization*. You have to accept a **procedural** account of rationality (associated with Herbert Simon's "Bounded Rationality"). You aren't required to be a god; you are required to be a diligent human.

  ### 2. The Secondary Error: Worst-Case vs. Average-Case (Premise 4)

  Premise (4) claims ordinary decisions *are* NP-hard problems. This is a category error between **formal worst-case complexity** and **real-world distributions**.

  *   **Complexity Theory:** NP-hardness is defined by *worst-case* scenarios. It means there *exist* instances that are intractable.
  *   **Real World:** Real-world instances of scheduling or routing are rarely the pathological worst-case instances. They usually have structure (locality, sparsity, regularity) that makes them solvable by approximation algorithms or heuristics very quickly.

  **Why challenge (4)?**
  Just because a problem class is NP-hard doesn't mean every *instance* an agent faces is intractable. In fact, most real-world instances of TSP (Traveling Salesperson) or Knapsack problems are solved routinely by logistics software.

  **What you give up:** You give up the idea that computational complexity classes map neatly onto lived experience. You have to acknowledge that the world is computationally "kinder" than the worst-case bounds suggest.

  ### 3. Preserving Premise (1): Refining "Can"

  You want to keep **(1) Ought Implies Can**. You can, but you must fight your friend on the definition of **"Can."**

  The friend is smuggling a specific definition of "Can" into (1):
  *   **Friend's "Can":** "Can compute the optimal solution in polynomial time."
  *   **Standard "Can":** "Can physically and logically perform the action."

  If you accept the friend's definition, (1) becomes **"Ought Implies P"** (Ought implies Polynomial-time). This is not a conceptual truth; it is a substantive empirical claim.

  **How to keep (1) safely:**
  Interpret "Can" as **"Can implement a rational procedure."**
  *   I *cannot* calculate the perfect route in 5 seconds.
  *   I *can* look at a map and pick a route that looks good in 5 seconds.
  *   Therefore, I am not obligated to calculate the perfect route.
  *   I *am* obligated to look at the map.

  This preserves OIC without collapsing normativity. The "Can" refers to the *effort of the procedure*, not the *optimality of the outcome*.

  ### 4. Why the Conclusion (7) Doesn't Follow

  Even if we grant that we can't optimize, the jump to (7) ("Normativity = Efficient Computability") is a **Non-Sequitur**.

  *   **Efficiency $\neq$ Normativity:** I can efficiently compute a route that drives off a cliff. It is polynomial-time. It is "efficient." It is not "ought."
  *   **The Missing Constraint:** Normativity requires *alignment with values/goals*, not just computational feasibility.

  The friend argues:
  1.  We can't Optimize.
  2.  Therefore, we ought to do what is Efficient.

  The Missing Premise is: **"Efficiency is the only remaining normative standard."**
  There is no reason to believe this. The standard could be "Reasonableness," "Diligence," or "Adherence to Heuristics known to track truth/goodness."

  ### Summary: How to Respond in Seminar

  If I were you, I would structure the objection like this:

  1.  **Accept (1) but refine "Can":** "I agree Ought Implies Can. But 'Can' refers to the capacity to execute a *procedure*, not the capacity to guarantee an *optimal outcome*. I can execute a heuristic; I cannot guarantee optimality. Therefore, my obligation is to the heuristic, not the optimum."
  2.  **Reject the move from (4) to (5):** "You assume the normative bar is Global Optimization. It isn't. It's Procedural Rationality. Since reasonable heuristics *are* computable, the normative requirement stands without collapse."
  3.  **Point out the Collapse Fallacy:** "Even if we can't optimize, 'efficiently computable' is not a normative category. A Nazi calculation can be efficient. Normativity requires a link to the Good/True, not just the Fast."

  **The Cost:**
  To defeat this argument, you must give up **Perfect Rationality**. You have to admit that humans are not expected to be utility maximizers in the strict economic sense. But this is a feature, not a bug; it's the standard view in modern philosophy of action (e.g., Cherniak, Simon, Gigerenzer).

  **Verdict:** The argument is **valid** but **unsound**. It fails because it defines rationality as something no agent could ever be (optimization), and then acts surprised when Ought Implies Can rules it out. Reject the definition of rationality, keep OIC, and the collapse vanishes.
