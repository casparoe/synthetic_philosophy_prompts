answer: |-
  This is a strong position to be in, philosophically. Epistemicism (championed most rigorously by Timothy Williamson) is often the "love it or hate it" view in vagueness seminars. You are right that supervaluationism often feels like it preserves classical logic only by sacrificing the connection between truth and assertibility in a way that many find dishonest.

  However, your suspicion is also correct: epistemicism is often defended via *via negativa* (logic is classical, therefore bivalence holds) rather than positive evidence for sharp boundaries. To defend it positively, you need to know exactly where the bodies are buried.

  Here is a breakdown of the defeaters for epistemicism, sorted from **existential threats** (fatal if true) to **theoretical costs** (awkward but absorbable), followed by a straight answer on unfalsifiability.

  ---

  ### 1. The Defeaters: Sorted by Severity

  #### **Fatal / Existential Threats**
  *These are arguments that, if successful, destroy the coherence of the view, not just its plausibility.*

  **A. The "Meaning is Use" Challenge (The Semantic Constraint)**
  *   **The Objection:** If meaning is constituted by linguistic usage (as Wittgensteinians or use-theorists argue), and usage is inherently indeterminate in borderline cases, then there *cannot* be a sharp boundary. A sharp boundary requires a fact of the matter that outruns use.
  *   **Why it's fatal:** Epistemicism posits semantic facts (the location of the cut-off) that are not determined by the totality of linguistic behavior. If you accept a use-theory of meaning, epistemicism is metaphysically impossible.
  *   **Epistemicist Absorption:** You must reject strict use-theory. Williamson argues that meaning is determined by causal-historical factors and externalist reference fixing, which can be sharp even if our *grasp* of them is fuzzy.
  *   **Verdict:** This is the only truly fatal objection. If your seminar leans heavily on verificationism or strict use-theory, you are in trouble. If you allow externalist semantics, you survive.

  **B. The Collapse of the Margin for Error**
  *   **The Objection:** Epistemicism relies on "safety" conditions for knowledge (you can't know $p$ if you could easily have been wrong). Williamson argues we can't know the boundary because our discriminative abilities aren't sharp enough to satisfy safety. However, critics argue that if the boundary is semantic, it should be knowable by reflection on meaning. If it is *in principle* unknowable, it looks like a non-fact.
  *   **Why it's fatal:** If you cannot explain *why* the boundary is unknowable without implying it doesn't exist, the view collapses into nihilism.
  *   **Epistemicist Absorption:** Williamson's *Vagueness* is dedicated to this. He argues the unknowability is a result of the instability of meaning (semantic plasticity) across close possible worlds.
  *   **Verdict:** Survivable, but requires buying into a specific, complex epistemology.

  #### **Severe Costs (The "Bullet-Biting" Zone)**
  *These don't prove the view false, but they require you to claim that common sense is systematically wrong.*

  **A. The Error Theory of Competence (Speaker Attitudes)**
  *   **The Objection:** You mentioned this: competent speakers reject "Patch $n$ is red" and reject "Patch $n$ is not red," yet accept the disjunction. Epistemicism says they are wrong to reject the conjuncts. One of them is true.
  *   **The Cost:** You are committed to an **error theory**. You are telling native speakers they are mistaken about the truth conditions of their own language in specific cases. This is highly counter-intuitive.
  *   **Epistemicist Absorption:** "Competence does not imply infallibility." Speakers confuse *truth* with *knowability*. They think because they can't know it, it isn't true.
  *   **Verdict:** This is the biggest PR problem for epistemicism. It's not logically fatal, but it makes the view unpopular because it disenfranchises the speaker's intuition.

  **B. The "Last Red Patch" (Arbitrariness)**
  *   **The Objection:** In a Sorites series, there is a specific patch $n$ that is red, and $n+1$ which is not. The difference between them is imperceptible. Why does $n$ get to be the last red one? It seems metaphysically magical or arbitrary.
  *   **The Cost:** You must accept brute, arbitrary semantic facts.
  *   **Epistemicist Absorption:** It's not arbitrary; it's determined by the complex totality of usage. It just *looks* arbitrary to us because the determining factors are too complex to compute.
  *   **Verdict:** Awkward, but consistent with externalism.

  #### **Moderate / Awkward Costs**
  *These are technical hurdles that epistemicists generally claim to have solved.*

  **A. Higher-Order Vagueness**
  *   **The Objection:** If there is a sharp boundary between red and not-red, is there a sharp boundary between "red" and "borderline red"? Epistemicism says yes. This leads to sharp boundaries between "knowable" and "unknowable."
  *   **The Cost:** It creates a hierarchy of sharp boundaries that feels increasingly absurd.
  *   **Epistemicist Absorption:** Williamson models this using iterated modal operators. There is a sharp boundary between $Kp$ (known) and $\neg Kp$. It's complex, but formally consistent.
  *   **Verdict:** Absorbed. Most epistemicists consider this a feature, not a bug, as it preserves classical logic at every order.

  **B. Modifiers and Comparatives ("Very", "Redder than")**
  *   **The Objection:** If "red" has a sharp cut-off, does "very red" have a sharper one? Does "redder than" imply a precise real-number scale of redness?
  *   **The Cost:** It forces a precise metric onto qualitative properties.
  *   **Epistemicist Absorption:** Contextualism. The cut-off shifts depending on the context and the modifier. "Very" tightens the margin for error.
  *   **Verdict:** Manageable. This is standard terrain for semantic theory regardless of vagueness.

  ---

  ### 2. The Unfalsifiability Worry

  You asked: *If the boundary is unknowable in principle, is there any conceivable result that could tell against epistemicism? Is that worse for semantics than metaphysics?*

  **Is it unfalsifiable?**
  Strictly speaking, **no**, but it is insulated.
  1.  **Logical Falsification:** If you can demonstrate a contradiction within the epistemicist model of knowledge (e.g., showing that "safety" conditions cannot coexist with bivalence), the view dies.
  2.  **Empirical Falsification:** If cognitive science showed that human categorization *literally* lacks sharp boundaries (e.g., neural networks that genuinely output 0.5 truth values with no underlying binary state), this would pressure the epistemicist. However, the epistemicist can reply that the *neural implementation* is fuzzy, but the *semantic content* is sharp.
  3.  **The "In Principle" Clause:** Williamson does not claim the boundary is unknowable by *any* being. He claims it is unknowable by *us* given our cognitive limitations and the instability of meaning. A being with perfect knowledge of all usage facts and causal histories could know the boundary. Therefore, it is not unknowable *in principle*, only *in practice*. This saves it from strict unfalsifiability.

  **Is this worse for Semantics than Metaphysics?**
  **Yes.** Here is the straight talk:
  *   **Metaphysics:** It is acceptable for metaphysical facts to outrun verification (e.g., realism about the external world). We expect reality to be bigger than our access to it.
  *   **Semantics:** Semantics is the study of *meaning*. Meaning is inherently tied to **communication** and **use**. If a semantic fact (the location of the boundary) makes absolutely no difference to how the word is used, how it is learned, or how it is verified, critics argue it is not a *semantic* fact at all. It becomes a "ghost in the machine."
  *   **The Danger:** If epistemicism posits semantic facts that are undetectable in principle by any user of the language, it risks severing the link between meaning and mind. This is the "Magical Theory of Meaning" objection. If the theory implies that I can mean RED without there being any possible way for me (or my community) to determine what falls under RED, have I really meant RED?

  ### 3. How to Defend Epistemicism Positively

  Since you want to move beyond poking holes in supervaluationism, here are the positive arguments you should lean on:

  1.  **The Argument from Logic:** Classical logic (especially *Excluded Middle* and *Conditional Proof*) is incredibly robust. Supervaluationism saves bivalence but breaks Conditional Proof (you can't always infer $A \to B$ from a derivation of $B$ from $A$). Epistemicism saves the whole system. The cost of changing logic is higher than the cost of accepting sharp boundaries.
  2.  **The Argument from Simplicity:** Epistemicism requires no new truth values, no supervaluations, no degree theories. It treats "is red" exactly like "is prime." The vagueness is moved to epistemology, which is where ignorance belongs.
  3.  **The Sorites Solution:** Epistemicism is one of the few views that simply denies the inductive premise of the Sorites paradox ("If $n$ is red, $n+1$ is red"). It says this premise is **false**. There is a specific $n$ where it fails. This is a clean, deductive solution.
  4.  **Semantic Stability:** If boundaries were truly fuzzy (ontically), communication should break down more often than it does. The fact that we communicate successfully suggests there is a stable core of reference, even if we can't pinpoint the edge.

  ### Summary Advice for the Seminar

  *   **On Unfalsifiability:** Concede that it is hard to test, but insist it is not *in principle* unknowable, just unknowable by humans due to cognitive limits (Margin for Error). Acknowledge that this is a bigger cost for semantics than metaphysics, but argue that externalist semantics allows meaning to outrun immediate verification.
  *   **On Speaker Intuitions:** Don't try to explain away why speakers feel the way they do. Own the error theory. "Speakers confuse truth with warrant. That is a psychological fact, not a semantic one."
  *   **On the "Last Patch":** Frame this as a consequence of the **discreteness of truth**. If truth is binary, and the world is (at some level) discrete, boundaries must be sharp. The "weirdness" is just the shock of realizing how precise language actually is.

  Epistemicism is a high-cost, high-reward view. It saves logic and simplicity at the price of intuition and an error theory of competence. If you are willing to pay that price, the view is coherent. Your job is to show that the price supervaluationism charges (breaking logic or assertibility norms) is higher.
