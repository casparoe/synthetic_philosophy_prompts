prompt: |-
  I'm a backend engineer and I've been trying to read some stuff outside my usual lane, and I stumbled onto this passage from Alfred North Whitehead's *The Aims of Education* (1929) that's been bugging me for a week. It's from the very first essay, and it goes:

  "In training a child to activity of thought, above all things we must beware of what I will call 'inert ideas'—that is to say, ideas that are merely received into the mind without being utilised, or tested, or thrown into fresh combinations. In the history of education, the most striking phenomenon is that schools of learning, which at one epoch are alive with a ferment of genius, in a succeeding generation exhibit merely pedantry and routine. The reason is, that they are overladen with inert ideas. Education with inert ideas is not only useless: it is, above all things, harmful—Corruptio optimi, pessima."

  I get the basic idea that he's against rote learning and that ideas need to be "used" to count as real education. But the more I think about it the less I understand where the line is. When I learned to code, I spent a ton of time just absorbing concepts—syntax, data structures, design patterns—before I could do anything "fresh" with them. Was that whole phase just accumulating inert ideas? And if so, was it actually *harmful*, like he says? That seems like a crazy strong claim. Why would having unused ideas sitting in your head be worse than just not having them? Also he throws in that Latin phrase at the end—"the corruption of the best is the worst"—and I can't tell if he's saying that a mind full of inert ideas is somehow *more* corrupted than a mind that was never educated at all, or if he's talking about institutions, or what. Can you help me unpack what exactly he means by "harmful" here and whether the coding bootcamp model of "learn all the things first, apply them later" is basically the poster child for what he's warning against?
