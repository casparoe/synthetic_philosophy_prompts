answer: |-
  You have described a phenomenon that is increasingly discussed but, you are correct, lacks a single settled name. It sits at the intersection of human-computer interaction (HCI), cognitive psychology, and the philosophy of technology.

  While there is no single canonical term like "gravity," there are three established concepts that, when combined, map precisely to what you are describing. If you are looking for the closest technical term, it is the **"Out-of-the-Loop (OOTL) Performance Problem."** If you are looking for the psychological mechanism, it is **"Scaffolded Illusion of Competence."**

  Here is a breakdown of the nearest concepts, why they are near-misses, and how to define the boundaries of the phenomenon you've identified.

  ### 1. The Closest Technical Term: "Out-of-the-Loop" (OOTL)
  In aviation and automation literature (pioneered by Mica Endsley), the **Out-of-the-Loop Performance Problem** describes what happens when an automated system performs a task so well that the human operator loses situational awareness and the ability to intervene.

  *   **Why it fits:** It specifically addresses the *loss of ability to supervise*, not just the failure to supervise. It captures the transition from "monitoring" to "passive observing" to "unable to understand."
  *   **Why it's not quite it:** OOTL is usually framed around *situational awareness* (knowing what the system is doing right now) rather than *long-term skill decay* (forgetting how to do it yourself over months/years). It is also usually tied to safety-critical systems (planes, nuclear plants) rather than cognitive labor (writing, diagnosing).

  ### 2. The Psychological Mechanism: "Illusion of Competence" via "Cognitive Offloading"
  In educational psychology, the **Illusion of Competence** occurs when learners mistake the *fluency* of information for the *retention* of knowledge (e.g., re-reading notes feels like learning). When applied to tools, this is **Cognitive Offloading**.

  *   **The Mechanism:** You are describing a specific heuristic failure: the **Fluency Heuristic**. Because the output is fluent (high quality, grammatically correct, medically plausible), your brain attributes that fluency to your own cognitive process.
  *   **The Mask:** The tool provides **Performance Scaffolding**. As long as the scaffolding is in place, the building stands. The illusion is believing the building is self-supporting.
  *   **Why it's not quite it:** "Illusion of Competence" is usually temporary (e.g., studying for a test). Your description is structural and permanent (a change in professional identity).

  ### 3. The Philosophical Frame: "The Device Paradigm"
  Philosopher Albert Borgmann, in *Technology and the Character of Contemporary Life*, described the **Device Paradigm**. A "device" delivers a commodity (the result) while hiding the machinery or process (the means).

  *   **Why it fits:** This captures the *existential* shift you noticed. The doctor no longer engages with the "focal practice" of diagnosis; they engage with the device that delivers "health outcomes." The skill isn't just lost; it is rendered irrelevant by the design of the technology.
  *   **The Epistemic Cost:** This leads to **Epistemic Opacity** (a term used by Paul Humphreys). You cannot see inside the process, so you cannot verify the logic, only the output.

  ---

  ### Proposed Terminology: "Cryptic Deskilling"
  Since no single term captures the *loss*, the *masking*, and the *false confidence* simultaneously, the literature is currently converging around descriptive phrases. The most precise neologism for what you are describing is **Cryptic Deskilling**.

  *   **Cryptic:** Hidden. The decay is invisible because the output remains high-fidelity.
  *   **Deskilling:** The actual reduction in human capacity.

  Alternatively, in philosophy of mind, this is sometimes called **Scaffolded Epistemic Confidence**.

  ### Defining the Boundaries
  To separate this from the concepts you mentioned, here is how you should draw the lines:

  #### vs. Deskilling / Skill Atrophy
  *   **Deskilling** is the *loss*.
  *   **Cryptic Deskilling** is the *loss + the mask*.
  *   *Boundary:* If a typesetter loses their typesetting skill when computers arrive, that is deskilling. They *know* they lost it. If a programmer loses their ability to write algorithms but believes they are still a programmer because Copilot writes the code, that is Cryptic Deskilling.

  #### vs. Automation Complacency
  *   **Complacency** is *volitional*. It is "I *could* check this, but I trust the machine so I *won't*." It implies negligence.
  *   **Your Phenomenon** is *structural*. It is "I *think* I am checking this, but I no longer possess the baseline knowledge required to verify the logic." It implies incapacity.
  *   *Boundary:* A pilot ignoring a warning light is complacent. A pilot who no longer understands the flight control system well enough to know the warning light is wrong is experiencing the OOTL/Cryptic Deskilling phenomenon.

  #### vs. Dunning-Kruger Effect
  *   **Dunning-Kruger** is a *metacognitive deficit*. Incompetent people lack the skill to recognize incompetence. It is usually static.
  *   **Your Phenomenon** is a *feedback loop failure*. These people *were* competent. The tool severed the link between *error* and *correction*. Because the tool prevents errors, the person never receives the signal that their skill is decaying.
  *   *Boundary:* Dunning-Kruger is "I don't know enough to know I'm wrong." Your phenomenon is "The system prevents me from being wrong, so I never learn that I don't know."

  #### vs. Extended Mind (The Counter-Argument)
  It is worth noting that philosophers of cognitive science (like Andy Clark) might argue **this isn't skill loss at all**. Under the **Extended Mind Thesis**, if the tool is reliably integrated into your workflow, the tool *is* part of your cognitive system.
  *   **The Counter:** From this view, the doctor + AI *is* the competent unit. The "skill" hasn't left the system; it has been redistributed.
  *   **Your Rebuttal:** Your observation relies on **Internalism**. You are measuring the skill of the *biological human*, not the *human-tool cyborg*. The risk you identify is **Fragility**: if the tool is removed, the internal component fails.

  ### Summary for Your Use
  If you need to reference this in writing or conversation, the most rigorous way to frame it is:

  > "This is **Cryptic Deskilling** driven by **Performance Scaffolding**. It differs from **Automation Complacency** because the operator loses the *capacity* to monitor, not just the *will*. It differs from **Dunning-Kruger** because the confidence is not baseless; it is historically earned and currently reinforced by high-quality outputs, creating a **Metacognitive Miscalibration** where the user attributes the tool's fluency to their own understanding."

  You are noticing the transition from **Tool Use** (I use a hammer) to **Tool Dependence** (I cannot build without this specific nail gun) to **Tool Symbiosis** (I believe the nail gun's precision is my own steadiness). The literature is only just catching up to that final stage.
