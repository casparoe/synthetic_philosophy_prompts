prompt: |-
  I'm a curator at a mid-sized contemporary art museum, and we're overhalling our acquisition process. We've been burned — buying pieces that critics loved for five years then everyone decided were mediocre, and passing on things that later turned out to be important. I've read that Hume had this idea of a standard of taste: that even though judgments of beauty are subjective, the verdicts of ideal critics (people with delicacy of taste, practice, comparison, good sense, and freedom from prejudice) converge over time. Turn that into an actual acquisition procedure my committee can follow. Step-by-step: what questions to ask, what evidence to gather, where the procedure stops and says "wait and see," and where it hands off to a human judgment call. Be honest about which steps are just Hume's aesthetics dressed up as procedure and which are real operationalizations. Then run it on two hypothetical acquisitions: a technically brilliant but emotionally cold video installation by a young artist, and a painterly but derivative canvas by an artist in their 70s who's been overlooked their whole career.
reasoning: |-
  Here's a thinking process that leads to the suggested acquisition procedure:

  1.  **Analyze the Request:**
      *   **User:** Curator at a mid-sized contemporary art museum.
      *   **Problem:** Inconsistent acquisition outcomes (buying trendy duds, missing future classics).
      *   **Theoretical Framework:** David Hume's "Of the Standard of Taste" (ideal critics, convergence over time, specific qualities of the critic).
      *   **Task:** Create a step-by-step acquisition procedure based on Hume's theory.
      *   **Requirements:**
          *   Step-by-step guide (questions, evidence, stop/go points).
          *   Distinguish between "Hume dressed up" (theoretical) and "real operationalizations" (practical).
          *   Test the procedure on two hypothetical cases (Young Video Artist vs. Older Overlooked Painter).
          *   Tone: Professional, honest, critical, practical.

  2.  **Deconstruct Hume's "Standard of Taste":**
      *   *Core Thesis:* Sentiment is subjective, but there is a standard based on the joint verdict of true judges.
      *   *Qualities of the "True Judge" (Ideal Critic):*
          1.  **Delicacy of Taste:** Ability to perceive subtle elements.
          2.  **Practice:** Experience in evaluating art.
          3.  **Comparison:** Exposure to a wide range of works/genres.
          4.  **Good Sense:** Reason overriding prejudice/fashion.
          5.  **Freedom from Prejudice:** No bias regarding the artist's background, era, or style.
      *   *The Test of Time:* True art survives changes in fashion.

  3.  **Translate Theory into Procedure (The "Humean Acquisition Protocol"):**
      *   *Challenge:* Hume talks about *critics*, not *committees*. A committee is a proxy for the "joint verdict."
      *   *Challenge:* Hume talks about *time*. Museums need to buy *now*.
      *   *Solution:* Simulate the conditions of the ideal critic and the test of time within the bureaucratic constraints.

      *   *Step 1: Composition of the Committee (The "True Judges").* Are the members qualified? Do they have delicacy, practice, comparison?
      *   *Step 2: Blind/Contextual Review (Freedom from Prejudice).* Remove market hype and artist identity initially.
      *   *Step 3: Comparative Analysis (Comparison).* Place the work against historical benchmarks, not just contemporaries.
      *   *Step 4: The "Good Sense" Check (Reason vs. Fashion).* Is this buying because it's hot or because it holds up?
      *   *Step 5: The "Wait and See" Threshold.* If consensus isn't reached among the "ideal critics," pause.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Honesty Check:* I need to explicitly state where this is just aesthetic philosophy masquerading as bureaucracy. Hume's "delicacy" is hard to measure. "Freedom from prejudice" is impossible to fully guarantee.
      *   *Operationalization:* How do we measure "practice"? CVs. How do we measure "comparison"? Requiring specific reference lists.

  5.  **Developing the Two Case Studies:**
      *   *Case A: Young Video Artist (Technically brilliant, emotionally cold).*
          *   Humean view: Does it engage the sentiment? Or is it just technical delicacy without soul?
          *   Procedure outcome: Likely "Wait and See" due to lack of emotional resonance (Good Sense) despite technical skill.
      *   *Case B: Older Painter (Painterly, derivative, overlooked).*
          *   Humean view: "Derivative" hurts Comparison. "Overlooked" suggests potential Prejudice against them previously, or maybe they just aren't good.
          *   Procedure outcome: Likely "Pass" unless the "derivative" nature is re-framed as mastery of tradition (Practice/Comparison).

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the Humean framework and its limitations in a bureaucratic setting.
      *   **The Protocol (HAP):** Step-by-step.
      *   **The "Hume vs. Ops" Audit:** A section explicitly calling out the theoretical vs. practical tension.
      *   **Case Studies:** Applying the protocol.
      *   **Conclusion:** Final advice on the limits of the system.

  7.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Keep the language actionable for a committee. Use terms like "Rubric" and "Voting."
      *   *Critique:* Hume emphasizes the *test of time*. How do we do that now?
      *   *Fix:* Introduce a "Probationary Acquisition" or "Loan-to-Own" phase, or simply a hard "No" if the time test can't be simulated. Let's suggest a "Watchlist" category.
      *   *Critique:* Hume's "Prejudice" includes bias against the artist's identity.
      *   *Fix:* Ensure the procedure includes a blind review phase to mitigate market/identity bias.

  8.  **Final Polish:** Check tone. Ensure it sounds like it's written for a curator (professional, slightly weary of trends, seeking rigor). Make sure the distinction between Hume's philosophy and operational reality is sharp. (e.g., You can't measure "delicacy" objectively, so we use peer review as a proxy).

  9.  *(Self-Correction on Case B)*: If the painter is "derivative," Hume would likely reject them based on "Comparison." A true judge knows the originals. Being a copyist, even a good one, lacks the genius Hume associates with lasting art. I need to make sure the procedure reflects this.

  10. *(Self-Correction on Case A)*: "Emotionally cold" violates the purpose of art for Hume (to move the sentiment). Technical brilliance is "Delicacy," but without moving the audience, it fails "Good Sense."

  11. **Final Review against constraints:** Step-by-step? Yes. Questions/Evidence? Yes. Stop/Go points? Yes. Hume vs. Ops audit? Yes. Two cases? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated challenge. You are asking to operationalize an 18th-century philosophical essay into a 21st-century bureaucratic workflow. Hume's *Of the Standard of Taste* is not a checklist; it is an argument about the *conditions* under which consensus emerges.

  To make this work, we must treat your Acquisition Committee not as a board of directors, but as a proxy for Hume's "Joint Verdict of True Judges." The goal is to simulate the *test of time* within the constraints of a fiscal year.

  Here is the **Humean Acquisition Protocol (HAP)**, followed by an audit of its theoretical vs. operational reality, and the two case studies.

  ---

  ### The Humean Acquisition Protocol (HAP)

  #### Phase 1: Constituting the "True Judges" (Committee Composition)
  Hume argues that the standard of taste resides in the verdict of ideal critics. If your committee lacks the five qualities of the true judge, the procedure fails before it begins.

  *   **Operational Step:** Before reviewing art, review the committee.
  *   **The 5-Point Audit:** For every voting member, verify:
      1.  **Delicacy:** Can they perceive subtle nuances? (Evidence: Past writing, curatorial track record).
      2.  **Practice:** Have they evaluated art consistently over time? (Evidence: Years in field).
      3.  **Comparison:** Do they know art history broadly, not just their niche? (Evidence: Required reading list or presentation on a non-specialist genre).
      4.  **Good Sense:** Can they separate reason from fleeting emotion? (Evidence: Peer review of past decisions).
      5.  **Freedom from Prejudice:** Are they free from bias regarding the artist's market value, identity, or trendiness?
  *   **Stop/Go:** If >30% of the committee fails the "Comparison" or "Practice" audit (e.g., they are solely collectors or solely theorists), **STOP**. Recruit external advisors to balance the "Joint Verdict."

  #### Phase 2: The Blind Sentiment Check (Freedom from Prejudice)
  Hume argues prejudice perverts sentiment. We often buy because of the *name*, not the *work*.

  *   **Operational Step:** Initial review is conducted without artist identity, gallery representation, or price.
  *   **Evidence Gathered:** High-res images/video, material specs, dimensions. No CV, no press clippings, no auction records.
  *   **Question to Ask:** "If this were found in an attic with no signature, would it move you?"
  *   **Stop/Go:** If the work fails to generate a positive sentiment in 50% of the committee anonymously, **STOP**. (Do not proceed to context).

  #### Phase 3: The Comparative Test (Practice & Comparison)
  A true judge compares the work to the best of its kind, not just its contemporaries.

  *   **Operational Step:** The proposing curator must submit a "Lineage Memo."
  *   **Evidence Gathered:** The memo must identify three historical precedents (one contemporary, one from 50+ years ago, one canonical).
  *   **Question to Ask:** "Does this work sustain the conversation started by the precedents, or does it merely mimic them?"
  *   **Stop/Go:** If the work is deemed "derivative" without adding new sentiment, **STOP**. If it is deemed "innovative" but lacks technical control, **PAUSE** (See Phase 5).

  #### Phase 4: The Good Sense Interrogation (Reason vs. Fashion)
  Hume distinguishes between the "flash of fashion" and "lasting beauty."

  *   **Operational Step:** The "Five-Year Silence" Simulation.
  *   **Evidence Gathered:** Market data, press buzz volume, social media metrics.
  *   **Question to Ask:** "If this artist disappeared from the press for five years tomorrow, would we still want this in the collection?"
  *   **Stop/Go:** If the primary justification relies on current market trajectory or critical buzz, **STOP**.

  #### Phase 5: The Consensus Threshold (The Joint Verdict)
  Hume believes consensus among true judges is the standard. Unanimity is rare, but strong convergence is required.

  *   **Operational Step:** Weighted Voting.
  *   **Procedure:**
      *   **Green Light:** 80% approval *including* the Director and Head Curate.
      *   **Yellow Light (The Humean Wait):** 50-79% approval.
      *   **Red Light:** <50% approval.
  *   **Operational Outcome:**
      *   **Green:** Proceed to purchase.
      *   **Yellow:** Place on "Probationary Watchlist." Fund a solo exhibition or loan instead of acquisition. Re-evaluate in 3 years.
      *   **Red:** Reject.

  ---

  ### The "Hume vs. Ops" Audit
  *Be honest about what is philosophy and what is bureaucracy.*

  | Procedure Step | Humean Theory | Operational Reality | The Lie We Tell Ourselves |
  | :--- | :--- | :--- | :--- |
  | **Committee Audit** | "True Judges" possess innate delicacy and practice. | We check CVs and years of employment. | We assume a long CV equals "delicacy of taste." It often just equals "longevity." |
  | **Blind Review** | "Freedom from Prejudice" regarding the artist's reputation. | Removing names from PDFs. | We cannot remove prejudice about *style*. If it looks "trendy," we know the market even without the name. |
  | **Lineage Memo** | "Comparison" to the best works of all time. | Listing 3 influence references. | Curators will cherry-pick comparisons that make the work look good. It's a justification exercise, not a true test. |
  | **5-Year Silence** | The "Test of Time." | A hypothetical question. | We are predicting the future. Hume says time decides, not a committee meeting. This is just risk management dressed as aesthetics. |
  | **Consensus Vote** | The "Joint Verdict" establishes the standard. | 80% Majority Rule. | Politics often dictate votes. A powerful donor on the committee sways "sentiment" more than "good sense." |

  **Where the Procedure Hands Off to Human Judgment:**
  The protocol stops at **Phase 5, Yellow Light**. Hume acknowledges that even true judges can disagree on the *degree* of merit, even if they agree on the *kind*. If the committee is split, the procedure cannot solve it. This is where the Director must exercise **Stewardship**: betting on the artist's potential vs. the museum's risk tolerance. No rubric solves this.

  ---

  ### Case Study Run-Throughs

  #### Case 1: The Young Video Artist
  *   **Work:** *Static Drift*. 4-channel video installation. Technically flawless, 8K resolution, immersive sound.
  *   **Context:** Artist is 26, represented by a hot gallery, featured in *Artforum* twice this year.
  *   **Critique:** Critics call it "precise." Visitors call it "cold."

  **HAP Application:**
  1.  **Committee Audit:** Pass. Committee includes a media conservator and a film historian (Practice/Comparison).
  2.  **Blind Sentiment:** **FAIL.** Without the artist's name or the gallery's prestige, 60% of the committee find it "boring" or "sterile." It fails to move the sentiment.
  3.  **Comparative Test:** **WARNING.** Lineage Memo cites Bill Viola and Bruce Nauman. Committee agrees the technique matches them, but the *emotional resonance* does not.
  4.  **Good Sense:** **FAIL.** The "Five-Year Silence" question reveals everyone is buying because the artist is "hot."
  5.  **Consensus:** 40% approval.

  **Verdict:** **RED LIGHT (Reject).**
  *Humean Reasoning:* Technical delicacy without the ability to move the passions is not art; it is craft. The "Joint Verdict" of the blind test revealed the sentiment was driven by prejudice (market hype), not the object itself.
  *Operational Outcome:* Do not buy. Consider a loan for a group show to test audience reaction over time.

  #### Case 2: The Overlooked Painter
  *   **Work:** *Untitled (Landscape 4)*. Oil on canvas.
  *   **Context:** Artist is 74. Paints in a figurative style common in the 1980s. Never had a solo show. Works in obscurity.
  *   **Critique:** Technically masterful brushwork. Derivative of Diebenkorn and Freud.

  **HAP Application:**
  1.  **Committee Audit:** Pass.
  2.  **Blind Sentiment:** **PASS.** Without knowing the artist is unknown/old, 70% respond positively to the material quality and presence.
  3.  **Comparative Test:** **MIXED.** The "Derivative" flag is raised. However, the "Practice" members note that the handling of light adds a specific regional nuance absent in the predecessors.
  4.  **Good Sense:** **PASS.** No market hype. No press buzz. The desire to buy is based solely on the object's merit.
  5.  **Consensus:** 65% approval (Yellow Light).

  **Verdict:** **YELLOW LIGHT (Probationary Watchlist).**
  *Humean Reasoning:* The work has "delicacy" and "practice" behind it, but the "Comparison" test is weak (it is derivative). Hume values genius over imitation. However, the "Freedom from Prejudice" test worked in reverse here: the artist was prejudiced *against* by the market for being obscure.
  *Operational Outcome:* Do not acquire yet. Fund a small retrospective or catalogue raisonné contribution. If the work sustains interest after being shown (simulating the start of the "test of time"), revisit acquisition in 3 years. This mitigates the risk of buying "mediocre traditionalism" while correcting for the prejudice of overlooking a career.

  ### Final Curatorial Advice

  Hume's system relies on the idea that **time reveals truth**. Your museum operates in **quarterly time**.

  The most honest operationalization of Hume is not the checklist, but the **Yellow Light Protocol**. Most museums treat acquisitions as Binary (Buy/Don't Buy). Hume suggests a third state: **Acknowledged Merit, Unproven Longevity.**

  Use the HAP to identify the "Yellow Light" works. Dedicate 15% of your acquisition budget to a "Time Fund." Buy these works, but classify them as "Study Collection" rather than "Permanent Collection" for 5 years. If they survive the 5-year shift in taste, they graduate. This is the only way to truly operationalize the Test of Time without bankrupting the institution on mistakes.
