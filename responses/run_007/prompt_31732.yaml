      *   **Nicholas Bulstrode:** The cautionary tale. Religious language used for self-justification. When exposed, he collapses. Shows the danger of mixing spiritual authority with earthly power without genuine humility.
      *   **Edward Farebrother:** The via media. A clergyman who doubts but serves. He loves Mary Garth but steps aside. He represents the *institution* accommodating human frailty. He is "good" without being dogmatic.
