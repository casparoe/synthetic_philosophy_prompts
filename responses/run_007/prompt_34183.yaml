answer: |-
  The summary correctly outlines Scanlon's core formula and his rejection of aggregation in the Transmitter Case, but it is fundamentally incorrect to claim that Scanlon accepts a coin-flip result in one-versus-five rescue scenarios. Scanlon's considered position in *What We Owe to Each Other* explicitly argues that you ought to save the five, and he achieves this without abandoning contractualism by drawing a sharp distinction between aggregating different kinds of claims and counting identical claims. In the Transmitter Case you described, the harms are unequal: one person faces severe injury while the millions face minor boredom. Scanlon argues that no number of minor inconveniences can aggregate to outweigh a single severe harm because the individual with the severe harm has a complaint that no one else can match in strength. However, in the one-versus-five rescue case, the harm is identical for everyone: death. Here, Scanlon argues that numbers do count, not because we sum the value of the lives saved, but because a principle requiring you to save the one rather than the five is reasonably rejectable by five distinct individuals, whereas a principle requiring you to save the five rather than the one is rejectable by only one. Since the strength of each individual complaint is equal, the principle that generates more distinct reasonable rejections is the one we must discard. A careful Scanlonian would reply that this avoids utilitarian aggregation because we are not treating the five as a container of value greater than the one; rather, we are acknowledging that more separate persons have a veto against the principle that lets them die. The cost of this distinction is theoretical complexity, as Scanlon must explain why counting heads in rescue cases does not collapse into the very aggregation he rejects in the Transmitter Case, leading some critics to argue that his view relies on an unstable distinction between counting persons and summing benefits.
