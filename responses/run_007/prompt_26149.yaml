prompt: |-
  You have been asked to deliver the commencement address at a university's college of social science. You are a behavioral economist whose research has centered on bounded rationality and satisficing — the thesis, associated most famously with Herbert Simon, that human decision-makers do not and cannot optimize in the way classical rational-choice theory supposes. Instead, they search sequentially through options and stop when they find one that meets an aspiration threshold: they satisfice rather than maximize.

  The graduating class and their families have just sat through a series of addresses urging them to maximize their potential, pursue excellence without compromise, and never settle for anything less than the best. You are the final speaker.

  Write the address. It must be genuinely moving and inspiring to a general audience — parents and graduates who have never encountered the term "satisficing" — while remaining intellectually honest to the commitments of your own research program. You cannot simply fall back on the same optimization rhetoric dressed in slightly different language; the speech must do the harder work of making a case that a life built around "good enough" is not a life of diminished ambition but one animated by a different, and perhaps deeper, kind of wisdom. Aim for roughly eight to ten minutes when spoken aloud.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Role:** Behavioral Economist specializing in bounded rationality and satisficing (Herbert Simon's thesis).
      *   **Context:** Commencement address at a College of Social Science.
      *   **Audience:** Graduates, families, faculty. Many have just heard speeches about "maximizing potential," "excellence without compromise," "never settle."
      *   **Constraint:** Must be genuinely moving/inspiring to a general audience (no jargon without explanation). Must remain intellectually honest to the research (cannot just say "maximizing is good" in disguise). Must argue that "good enough" is wise, not diminished.
      *   **Length:** 8-10 minutes spoken (approx. 1,000 - 1,300 words).

  2.  **Deconstruct the Core Concept (Satisficing vs. Maximizing):**
      *   *Maximizing:* Searching all options, finding the absolute best, high regret, high cognitive load, often leads to paralysis or dissatisfaction (the "paradox of choice").
      *   *Satisficing:* Setting an aspiration level, searching until met, stopping, acting. It acknowledges limits (time, information, cognitive capacity).
      *   *The Twist:* The previous speakers told them to maximize. I need to tell them it's okay (and actually better) to satisfice.
      *   *The Challenge:* How to make "good enough" sound inspiring, not lazy?
      *   *The Angle:* "Good enough" frees you to live. It allows for commitment. It acknowledges human limits with grace. It's about sustainability and happiness, not just output.

  3.  **Determine the Tone:**
      *   Warm, empathetic, slightly contrarian but respectful of the previous speakers.
      *   Intellectual but accessible.
      *   Hopeful.

  4.  **Outline the Speech:**
      *   **Introduction:** Acknowledge the previous speeches. Validate their message (ambition is good). Introduce the counter-intuitive idea (the economics of "enough").
      *   **The Problem with Maximizing:** Explain the burden of "the best." The paralysis. The regret. The exhaustion. Connect this to the students' current anxiety.
      *   **Introducing Satisficing (The Core Concept):** Define it simply (Herbert Simon). Use a metaphor (searching for an apartment, a partner, a job). Explain *why* we do it (bounded rationality).
      *   **Reframing "Good Enough":** It's not settling for mediocrity. It's setting a threshold of *sufficiency* to allow for *action*. It's about freedom.
      *   **The Human Element:** Relationships, happiness, mental health. Maximizing kills joy; satisficing nurtures it.
      *   **Call to Action:** Go forth and be satisficers. Set high standards, but know when to stop searching and start building.
      *   **Conclusion:** A blessing for the future.

  5.  **Drafting - Section by Section:**

      *   *Intro:* Start with the tension. "You've heard 'reach for the stars.' I'm here to talk about landing." Acknowledge the Social Science context (understanding human behavior).
      *   *The Maximizing Trap:* Describe the modern pressure. LinkedIn, social media. The fear of missing out (FOMO). The economic term: "Opportunity cost" becoming a burden.
      *   *The Simon Moment:* Introduce Herbert Simon. He didn't say humans are irrational; he said we are *bounded*. We have limited time and brainpower.
      *   *The Definition:* "Satisfice." It sounds clunky. Explain it. "Good enough to proceed."
      *   *The Argument:* Why is this better? Because life isn't a multiple-choice test. It's a series of commitments. You can't optimize a marriage or a career path perfectly because the variables change.
      *   *The Emotional Core:* Regret. Maximizers look back. Satisficers look forward.
      *   *The "Aspiration Level":* This is key. It's not low standards. It's *clear* standards. Know what matters to you.
      *   *Closing:* Permission to be human.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I use too much jargon? *Correction:* Explain "bounded rationality" simply as "human limits."
      *   *Check:* Is it too negative about ambition? *Correction:* Clarify that satisficing requires ambition to set the threshold, just not to find the *global maximum*.
      *   *Check:* Is it moving? *Correction:* Add personal anecdotes or universal experiences (choosing a major, finding a partner).
      *   *Check:* Timing? *Correction:* Keep sentences rhythmic. Ensure pauses are built in. Aim for ~1200 words.

  7.  **Final Review against Constraints:**
      *   8-10 minutes? (At 130-150 words per minute, 1200 words is roughly 8-9 mins).
      *   Intellectually honest? Yes, sticks to Simon's theory.
      *   Inspiring? Focuses on freedom and mental peace.

  8.  **Final Polish:** (Writing the speech with attention to cadence and rhetorical devices.) *Self-correction: Make sure to explicitly mention that the previous speakers weren't "wrong," but that there is another side to the coin.*

  **(Drafting the content based on the above thought process...)**
  *   *Opening:* "President, Faculty, Families, and the Class of 2024..."
  *   *Hook:* The fatigue of the previous speeches.
  *   *Body:* The definition of Satisficing. The relief it offers.
  *   *Conclusion:* The permission slip.

  9.  **Final Word Count Check:** Ensure it's not too short. Expand on the emotional resonance of "stopping the search."

  *(Proceeds to generate output)*
answer: |-
  President, Faculty, Distinguished Guests, Families, and most importantly, the Graduating Class of 2024.

  It is an honor to stand here. I have listened intently to the speakers who preceded me. They have been magnificent. They have told you to dream without limits. They have told you to optimize your trajectory, to leverage your assets, and to never, ever settle. They have painted a picture of your future as a straight line ascending toward a singular peak of Excellence.

  And as a behavioral economist, I find myself in a delicate position. My entire career has been dedicated to studying how human beings actually make decisions, rather than how theoretical models say we *should*. And what I have found, and what I want to share with you today, is a secret that the models often miss.

  The speakers before me have asked you to be Maximizers. They have asked you to search every option, weigh every variable, and select the absolute best path possible. It is a noble charge. But I am here to offer you a different kind of permission. I am here to suggest that the secret to a life well-lived is not found in maximizing, but in what my field calls "satisficing."

  Now, I know what you're thinking. "Satisficing?" It sounds like a typo. It sounds like "satisfying" and "sacrificing" had a child and forgot to give it a name. It was coined by the Nobel laureate Herbert Simon, a giant of social science, and it is a portmanteau of "satisfy" and "suffice."

  To satisfice is to recognize that the world is too complex, and our minds are too limited, to find the perfect answer. Instead of searching for the *best* possible option, a satisficer sets a threshold of what is *good enough* to meet their needs. And when they find an option that meets that threshold, they stop searching. They choose. They act.

  I can see the anxiety in the room. To a room full of high-achievers, "good enough" sounds like a consolation prize. It sounds like mediocrity. It sounds like settling.

  But I want to argue to you today that satisficing is not the philosophy of the lazy. It is the philosophy of the wise. It is not about lowering your standards; it is about understanding your humanity.

  Classical economics assumes we are infinite beings. It assumes we have infinite time to research every career path, infinite emotional energy to weigh every relationship, and infinite information to predict every outcome. It assumes we can calculate the "opportunity cost" of every road not taken.

  But you are not infinite. You are bounded. You have bounded time. You have bounded energy. You have bounded knowledge. This is what we call "Bounded Rationality." And if you try to maximize within a world of limits, you will not find excellence. You will find paralysis. You will find exhaustion. You will find yourself standing at the altar of Opportunity, terrified to say "I do" to one path because it means saying "I don't" to a thousand others.

  The maximizer buys the perfect pair of jeans after visiting twenty stores, only to spend the next year wondering if the jeans at store twenty-one were better. The satisficer buys the jeans that fit, that are comfortable, that they can afford, and then they go out and live their life in those jeans.

  Who is freer?

  The maximizer looks backward, haunted by the ghost of the option they didn't choose. The satisficer looks forward, empowered by the choice they did make.

  I am not telling you to abandon ambition. Satisficing requires ambition. It requires you to know yourself well enough to set an aspiration level that is meaningful. You must decide what matters. Is it a salary that pays the bills and allows for travel? Is it a workplace that values your mental health? Is it a partner who makes you laugh and treats you with kindness?

  Once you set that threshold, you pursue it with vigor. But when you find it? You stop. You commit.

  This is the harder work. It is easy to keep searching. It is easy to keep optimizing. It is hard to stop. It is hard to say, "This is sufficient. This is good. I will build my life here."

  Because life is not a multiple-choice test where there is one correct answer hidden in the back of the book. Life is a design project. The quality of your life does not depend on finding the pre-existing "best" option. It depends on what you build *after* you choose.

  A marriage is not successful because you found the statistically perfect partner. It is successful because you chose someone who meets your threshold for love and respect, and then you spent thirty years building something beautiful together. A career is not fulfilling because it was the highest-paying option on the market. It is fulfilling because you found work that met your threshold for purpose, and then you poured your talent into it until it became excellent.

  Optimization is about selection. Satisficing is about creation.

  I know the world outside these gates will try to turn you back into maximizers. Algorithms are designed to keep you searching. Social media is designed to show you the highlight reels of others, making your "good enough" feel like "not enough." The economy is designed to treat your attention as a commodity to be mined.

  In that context, choosing to satisfice is an act of rebellion. It is a declaration that your time belongs to you, not to the search engine. It is a declaration that your happiness is not a variable to be optimized, but an experience to be inhabited.

  There is a profound grace in admitting that we cannot know everything. There is a profound strength in admitting that we cannot do everything. When you accept your bounds, you stop fighting against the architecture of your own mind. You stop wasting energy on the impossible task of certainty.

  So, my charge to you is this: Do not spend your life looking for the best. Spend your life looking for the *right*.

  Set your standards high, but make them human. Ask yourself: What do I need to be safe? What do I need to be loved? What do I need to be useful? When you find the job, the home, the community, or the partner that answers "yes" to those questions, have the courage to close the catalog. Have the courage to put down the map.

  Stop searching. Start building.

  The maximizer wants to be the best in the world. The satisficer wants to be fully in the world.

  I want you to have the energy to love your families, so don't spend your evenings optimizing your resume. I want you to have the clarity to serve your communities, so don't spend your weekends agonizing over the perfect volunteer opportunity. I want you to have the peace to sleep at night, so don't spend your mornings calculating the regret of the path not taken.

  You have spent four years, and perhaps sixteen years before that, learning how to choose the right answer. Today, I am giving you permission to stop choosing, and start living.

  The world does not need you to be perfect. It needs you to be present. It does not need you to maximize your utility. It needs you to maximize your humanity.

  So, go forth. Set your sights on what is good and true and sufficient. And when you find it, hold onto it with both hands. Build a life that doesn't require you to be a machine. Build a life that allows you to be a person.

  Congratulations, Class of 2024. You are ready. You are enough.

  Thank you.
