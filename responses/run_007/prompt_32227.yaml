answer: |-
  I completely share your frustration, and I think your intuition is spot on that the slogan is doing too much heavy lifting in your seminar. It has become a kind of philosophical shibboleth that signals membership in the post-1970s externalist club, but exactly what membership entails varies wildly from speaker to speaker. When someone drops "meaning ain't in the head" to dismiss the brain-in-a-vat scenario, they are often conflating a specific semantic claim with a global metaphysical one, and unpacking that conflation is crucial if you want to move the discussion forward. At its most modest and historically precise, the slogan refers specifically to Hilary Putnam's original argument concerning natural kind terms like water or gold. On this narrow reading, the claim is that the extension of such terms is fixed not by an internal description or concept held by the speaker, but by the actual physical structure of the stuff in the environment that the speaker is causally connected to. This thesis is substantively controversial in the sense that it overturned the descriptivist orthodoxy of the mid-twentieth century, but today it is widely accepted as plausible for natural kinds. However, even if we grant this narrow reading, it does not fully settle the brain-in-a-vat question on its own. It tells us that if the vat duplicate lacks a causal history with H2O, their term water does not refer to H2O, but it leaves open whether their term refers to something else, like vat-liquid, or whether it fails to refer at all. Using the slogan here to shut down the question assumes we already know the causal theory of reference is correct and universally applicable, which is precisely what the brain-in-a-vat thought experiment is often designed to test or complicate.

  Pushing beyond natural kinds, the slogan is often used to express a broader semantic externalism that applies to all referring expressions, including proper names and indexicals. This view, bolstered by Kripke and Burge, suggests that reference is never determined solely by internal states but always depends on external causal chains or social practices. This is more controversial than the natural kind restriction because it faces challenges from cases where speakers seem to have authoritative knowledge of their own meanings that outstrips their knowledge of the external world. If this broader semantic thesis is what your classmates have in mind, then yes, it implies the brain-in-a-vat cannot mean water because they lack the requisite causal or social link to our community or our environment. Yet, invoking the slogan here risks begging the question against internalist semantics, which argues that reference is mediated by internal conceptual roles. To say meaning ain't in the head is to assert the conclusion of that debate, not to provide an argument against the internalist interpretation of the vat scenario.

  Things get even stickier when the slogan shifts from semantics to psychology, claiming that the content of mental states themselves is not individuated by what is in the head. This is the move from semantic externalism to psychological externalism, where beliefs and desires are said to have wide content. On this reading, the brain-in-a-vat does not just fail to refer to water with their words; they literally do not have the belief that water is wet because that belief type is constituted partly by the external environment. This is highly controversial and was fiercely resisted by philosophers like Jerry Fodor, who argued for methodological solipsism in psychology. If your seminar peers are relying on this psychological reading, they are making a much stronger claim than Putnam originally defended. It is not trivially true, and it certainly does not settle the brain-in-a-vat question without significant argumentation, because the vat scenario is often used precisely to probe whether mental content can be narrow. Using the slogan to dismiss the possibility of narrow content in the vat case is circular, as it assumes the falsity of the very hypothesis the vat scenario is meant to explore.

  There is also a radical reading that denies the existence of narrow content altogether, suggesting that there is no residue of meaning left once you strip away the external relations. This global externalism implies that a molecule-for-molecule duplicate shares no meaningful mental states with you whatsoever. This is the most aggressive version of the slogan and is far from plausible to many contemporary philosophers who advocate for two-factor theories of content, where meaning has both a wide component determined by the world and a narrow component determined by functional role. If someone uses the slogan to imply this radical thesis, they are effectively denying the intuition that the vat duplicate is cognitively identical to you in some important respect. This reading is substantively controversial and certainly not a settled fact that can be used to close down discussion. In fact, relying on it ignores the explanatory utility of narrow content in accounting for behavioral similarities between you and your duplicate.

  Finally, there is a normative or social reading influenced by later Wittgenstein and Tyler Burge, where meaning is constituted by participation in a linguistic community and adherence to normative standards of use. On this view, meaning ain't in the head because it is in the practice. The brain-in-a-vat, isolated from a community of interpreters and correctors, might fail to mean anything at all, or at least fail to mean what we mean. This is a robust and defensible position, but it is distinct from the causal-historical view Putnam originally championed. Invoking the slogan without distinguishing between causal externalism and social normative externalism creates confusion, as the reasons the vat fails to mean water differ significantly in each case. In the causal view, it is a lack of physical contact; in the normative view, it is a lack of social entanglement.

  So when you hear the slogan used to dismiss the brain-in-a-vat question, you are likely encountering a rhetorical shortcut that masks these distinct layers. It is being used as a conversation stopper because it sounds like a settled result of twentieth-century philosophy, but in reality, it is a cluster of distinct claims with varying degrees of plausibility and controversy. The narrow semantic claim is plausible but doesn't cover all meanings. The psychological claim is controversial and directly contested by the vat scenario. The radical claim is likely false. To push back effectively, you should ask which specific thesis they are invoking. If they mean the narrow semantic point, ask whether it applies to non-natural kind terms in the vat scenario. If they mean the psychological point, ask them to defend psychological externalism against the intuition of cognitive equivalence. If they mean the radical point, ask them to explain how we account for the behavioral symmetry between you and the duplicate. The slogan itself is not an argument, and treating it as one prevents the seminar from doing the actual work of figuring out why externalism might be true and what its limits are. You are right to feel that the discussion is being short-circuited, and pointing out that the slogan packs multiple contentious claims into one pithy sentence is the best way to reopen the debate.
