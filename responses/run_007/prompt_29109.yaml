answer: |-
  It is a pleasure to engage with a colleague who brings the disciplined skepticism of an experimentalist to metaphysical questions. Your intuition is sharp: the stalemate you observe in the personal identity literature is not a temporary failure of argumentation but a structural feature of the debate itself.

  As a philosopher working in this field, I can confirm that your hypothesis—that the disagreement stems from competing criteria that cannot be non-circularly justified—is widely shared among meta-metaphysicians, though it remains controversial among first-order theorists. To give you a rigorous answer, I will proceed as you suggested: first by classifying types of philosophical disagreement, then by reconstructing the opposing positions charitably, and finally by diagnosing the impasse and outlining what genuine progress would look like.

  ### I. A Taxonomy of Philosophical Disagreement

  In science, when two theories predict the same observables, we often invoke **underdetermination** or dismiss the difference as **notational variance**. In metaphysics, the landscape is more complex. We generally distinguish disagreements along the following axes:

  1.  **Verbal Disagreements:** The parties agree on the underlying reality but use words differently (e.g., "Is a tomato a fruit?" depends on whether we are using a botanical or culinary definition).
  2.  **Substantive/Factual Disagreements:** The parties agree on meanings and concepts but disagree about how the world is arranged (e.g., "Is there a God?").
  3.  **Conceptual Disagreements:** The parties disagree about the boundaries or application conditions of a concept (e.g., "Does knowledge require certainty?").
  4.  **Meta-Ontological Disagreements:** The parties disagree about what it *means* to exist or what kind of answer is possible. This includes debates over whether existence is univocal or whether ontological questions are framework-relative (Carnap) or objective (Quine/Sider).
  5.  **Pragmatic/Conceptual Ethics:** The disagreement is not about what is *true* but about which conceptual scheme is most *useful* for our ethical, legal, or practical purposes.

  Your suspicion is that the personal identity debate looks like Type 1 (Verbal) or Type 5 (Pragmatic), but the participants treat it as Type 2 (Substantive). Let us see if that holds up.

  ### II. Charitable Reconstruction of the Competing Views

  To diagnose the impasse, we must ensure we are not fighting straw men. Both sides are sophisticated and aware of the standard thought experiments.

  #### 1. The Biological Continuity View (Animalism)
  *Proponents: Eric Olson, Paul Snowdon, David DeGrazia.*

  *   **Core Claim:** You are essentially a biological organism (*Homo sapiens*). You are not a mind, a soul, or a psychological pattern inhabiting an animal; you *are* the animal.
  *   **Criteria for Identity:** Numerical identity is preserved so long as the biological life functions of the organism continue.
  *   **The Gradual Replacement Argument:** If you replace neurons with silicon chips, you are replacing biological tissue with non-biological artifacts. At some point, the biological organism ceases to exist. Even if a thinking entity emerges that remembers your life, *you* (the organism) have died. The successor is a psychological duplicate, not you.
  *   **Motivation:** This view aligns with our evolutionary history and avoids the "fission problem" (if you split your brain in two, biological continuity says you die or one is you; psychological continuity struggles to say which one is you without arbitrariness). It treats "person" as a phase an animal goes through, not what the animal *is*.

  #### 2. The Psychological Continuity View (Lockean/Parfitian)
  *Proponents: Derek Parfit, Marya Schechtman, Sydney Shoemaker (historically).*

  *   **Core Claim:** You are essentially a "person," defined by psychological capacities (memory, rationality, self-consciousness). The biological substrate is contingent.
  *   **Criteria for Identity:** Numerical identity (or what matters in survival) is preserved so long as there is overlapping chain of psychological connectedness (memories, intentions, character).
  *   **The Gradual Replacement Argument:** Since function is preserved at every step, there is no point at which "you" cease. The substrate change is irrelevant, just as replacing the wood in a ship is irrelevant to the ship's identity if the structure and function remain.
  *   **Motivation:** This view captures our intuitive sense of *anticipation*. We care about the future because we expect to experience it. If a future being has my memories and character, I anticipate its experiences. To say "that's not you" seems to fetishize biology over the very consciousness that makes life valuable.

  ### III. Diagnosis: The Structure of the Impasse

  You asked: *Is it verbal? Is it a clash of bedrock intuitions? Is there a hidden factual question?*

  Here is the diagnosis from a contemporary meta-metaphysical perspective:

  #### 1. It is not a Hidden Factual Question
  There is no empirical test that could settle this. Neuroscience can tell us *how* the replacement happens, but it cannot tell us *who* survives. Identity is not a physical property like mass or charge; it is a metaphysical relation. To expect a factual resolution here is a category error similar to asking, "At what exact grain of sand does a heap cease to be a heap?" The physics of the sand is known; the boundary of the concept "heap" is not a physical fact.

  #### 2. It is Not Merely Verbal (in the trivial sense)
  If this were merely a dispute over the definition of the word "person," we could stipulate definitions and move on. But the stakes are existential. When an Animalist says "You die," they mean *your existence ceases*. When a Psychological Continuity theorist says "You survive," they mean *your existence continues*. They are not just labeling the same phenomenon differently; they are making competing claims about the persistence conditions of the entity referring to itself as "I."

  #### 3. It is a Clash of Sortals (Conceptual Frameworks)
  The disagreement arises because "identity" is sortal-relative. To ask "Is X the same as Y?" is incomplete. One must ask "Is X the same *F* as Y?" (Same *organism*? Same *person*? Same *mind*?).
  *   The Animalist insists the relevant sortal is **Organism**.
  *   The Psychological Continuity theorist insists the relevant sortal is **Person**.

  The impasse persists because neither side can prove their chosen sortal is the *correct* one without begging the question.
  *   If you ask the Animalist, "Why am I essentially an organism?" they appeal to the fact that you were born as a biological entity.
  *   If you ask the Psychological theorist, "Why am I essentially a mind?" they appeal to the fact that you identify with your consciousness, not your cells.

  Both appeals are circular. They presuppose the very identity conditions they are trying to justify.

  #### 4. The "Further Fact" Illusion
  This is the crux of the matter, articulated best by Derek Parfit. The debate assumes there is a **Further Fact** of identity—a metaphysical glue that holds the self together over and above physical and psychological continuity.
  *   **Realism:** There is a fact of the matter (Yes/No) about survival independent of our descriptions.
  *   **Reductionism (Parfit):** There is no further fact. There are only physical and psychological relations. The question "Is it me?" is empty once all the physical and psychological facts are specified.

  The stalemate exists because both sides are Realists about identity. They believe there *must* be a true answer. Your experimentalist intuition is pointing toward **Reductionism**: the question is ill-posed because it demands a binary truth value for a phenomenon that is actually a matter of degree and description.

  ### IV. What Would Count as Progress?

  If the question is ill-posed in its traditional form, does that mean philosophy has failed? No. It means the question needs to be reframed. Progress in personal identity is not moving toward a "True Theory of Identity," but toward **Conceptual Ethics**.

  Here is how we move forward:

  #### 1. Abandon the "All or Nothing" Assumption
  Traditional identity is transitive and one-to-one. But gradual replacement and fission cases show that what matters in survival (psychological connectedness) comes in degrees and can branch.
  *   **Progress:** Adopting a view where "survival" is not a binary metaphysical switch but a measure of *what matters*. Parfit argued we should stop asking "Will it be me?" and start asking "Will there be someone who is psychologically continuous with me, and who will carry out my intentions?"
  *   **Resolution:** We accept that in a gradual replacement scenario, the relation between Pre-Upload and Post-Upload is not strict identity, but a relation of *survival* that is sufficient for practical purposes (responsibility, anticipation, love).

  #### 2. Shift from Ontology to Pragmatics (Conceptual Ethics)
  Since neither "Organism" nor "Person" carves nature at the joints (in the sense of being a fundamental physical category), we must choose our criteria based on our values.
  *   **Legal/Moral Progress:** We should ask: "For the purposes of criminal responsibility, property rights, and medical consent, which criterion serves justice best?"
      *   If we hold the uploaded entity responsible for the biological predecessor's crimes, we are implicitly adopting Psychological Continuity.
      *   If we deny the uploaded entity inheritance rights because the biological body died, we are adopting Animalism.
  *   **Resolution:** We may end up with a **pluralistic** account. You are an organism for medical law (death = biological cessation) but a person for moral law (survival = psychological continuity). This isn't a contradiction; it's recognizing that different social practices require different sortals.

  #### 3. Formalizing the Vagueness
  The "spectrum argument" (replacing neurons one by one) relies on the Sorites paradox. Progress can be made by formally modeling identity as a vague predicate rather than a precise relation.
  *   **Progress:** Developing a logic of identity that accommodates indeterminacy. In a gradual replacement scenario, there may be no fact of the matter about *exactly* when you cease to exist. Accepting ontic vagueness dissolves the pressure to find a sharp boundary.

  ### V. Conclusion: Validating Your Hypothesis

  You wrote: *"My working hypothesis... is that the two sides are simply using different criteria for personal identity, and that neither side's criterion can be justified without presupposing what is in dispute."*

  As a professional philosopher, I endorse this hypothesis. It aligns with the most mature meta-ontological views in the field (specifically Carnapian pragmatism and Parfitian reductionism).

  The reason the debate has run for decades without movement is not that philosophers are less clever than molecular biologists. It is that they are trying to solve a **normative/conceptual problem** using **descriptive/metaphysical tools**. They are looking for a fact of the matter where there is only a choice of framework.

  **The Illusion of the Well-Posed Question:**
  The question feels well-posed because our language forces us into a subject-predicate structure ("*I* survive"). Our cognitive architecture is built to track agents. We feel there *must* be an answer because the stakes (death vs. survival) feel absolute. But just as quantum mechanics forced physics to abandon determinate trajectories for probability distributions, personal identity metaphysics is being forced to abandon determinate identity for relations of continuity and pragmatic convention.

  **Recommendation for Your Further Reading:**
  If you wish to see this diagnosis articulated philosophically, I recommend:
  1.  **Derek Parfit, *Reasons and Persons* (Part III):** The classic argument for Reductionism.
  2.  **Eli Hirsch, *Quantifier Variance and Realism*:** For the meta-ontological view that existence claims can be framework-relative.
  3.  **Amie Thomasson, *Ontology Made Easy*:** Argues that ontological questions are often trivial once we understand the usage rules of our concepts.
  4.  **David Chalmers, *Verbal Disputes*:** For a rigorous analysis of when disagreements are merely verbal and when they are not.

  You have correctly identified that the lack of convergence is a signal, not noise. In science, underdetermination suggests we need better data. In metaphysics, underdetermination often suggests we need better questions. The question "Do I survive?" should be replaced by "What kind of continuity do we value enough to call survival?" That is a question science cannot answer, but one that retired scientists and philosophers can tackle together.
