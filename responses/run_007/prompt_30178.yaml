answer: |-
  This is a remarkably sharp diagnosis, and you are in good company. Several contemporary meta-ethicists and value theorists (most notably Roger Crisp and, in a different way, Fred Feldman) have pushed back against the heterogeneity objection along precisely these lines.

  Your intuition is that the **Heterogeneity Problem** is often a metaphysical dressing for an **Epistemic/Aggregation Problem**. You are asking: *If the diversity of pleasures didn't prevent us from summing them up and comparing them, would we care that they feel different?*

  The short answer is: **You have correctly identified where the objection gets its practical force, but you may be underestimating a residual metaphysical worry that survives even if measurement were solved.**

  Here is a breakdown of why your collapse is partially correct, but why keeping the distinction alive might still be theoretically useful for your seminar.

  ### 1. The Case for Collapse: The Aggregation Imperative
  Your argument rests on the function of hedonism. Hedonism is not merely a taxonomy of mental states; it is a theory of *value* intended to guide action or evaluate lives. To do this, it must allow for trade-offs (e.g., "Is the pleasure of the bath worth the pain of the hangover?").

  If phenomenological diversity prevented aggregation, then the theory is practically dead. In this sense, you are right: the reason heterogeneity *matters* to a critic is that it seems to entail **incommensurability**.
  *   **The Critic's Logic:** Diverse feelings $\rightarrow$ No common unit $\rightarrow$ No aggregation $\rightarrow$ Hedonism fails as a decision procedure.
  *   **Your Diagnosis:** If we grant the common unit (the hedonometer), the diversity becomes irrelevant. Therefore, the diversity wasn't the problem; the lack of a unit was.

  This aligns with **Broad Hedonism** (or "preference hedonism"). If we define pleasure functionally as "that which is sought for its own sake," the phenomenological diversity is irrelevant. We don't need the experiences to *feel* alike; we only need them to play the same functional role. If your hedonometer measures that functional role, the heterogeneity objection dissolves.

  ### 2. The Case for Distinction: The Natural Kind Worry
  However, there is a reason philosophers keep the problems distinct. It concerns the **ontology of value**, not just the measurement of it.

  Even if we had a magic hedonometer that assigned real numbers to the bath, the proof, and the voice, a metaphysical worry remains: **What property is the hedonometer tracking?**

  *   **Scenario A (Unified Property):** The hedonometer detects a specific qualitative "glow" (a sensation) present in all three.
      *   *Result:* Heterogeneity is empirically false. (This is the Bentham/Mill view, though Mill complicates it with quality).
  *   **Scenario B (Disjunctive Property):** The hedonometer detects $P_1$ in the bath, $P_2$ in the proof, and $P_3$ in the voice, and sums them.
      *   *Result:* We can measure, but "pleasure" is not a **natural kind**. It is a gerrymandered disjunction ($P_1 \lor P_2 \lor P_3 \dots$).

  If Scenario B is true, hedonism risks becoming trivial or circular. If "pleasure" is just a label for "whatever states we have decided to put on the positive side of the ledger," then the claim "pleasure is the good" reduces to "the good is the good."

  The Heterogeneity Problem, in its strongest form, argues that there is **no non-evaluative commonality** between the bath and the proof. If you solve the measurement problem by stipulating a scale, you haven't shown that pleasure is a unified *source* of value; you've just imposed a metric on disparate things. The objection is that Hedonism claims to ground value in a specific *kind* of experience. If there is no such kind, the theory lacks a foundation, even if we can pragmatically measure the outcomes.

  ### 3. The Attitudinal Escape Hatch
  This distinction becomes vital when discussing **Attitudinal Hedonism** (e.g., Fred Feldman). Feldman explicitly concedes the Heterogeneity Problem regarding *sensations*. He agrees: there is no common "feeling" between reading poetry and eating oysters.

  However, he argues there is a common *attitude*: taking pleasure *in* something (a pro-attitude).
  *   **Measurement:** We can measure the intensity/duration of the attitude.
  *   **Heterogeneity:** The *objects* of the attitude are heterogeneous, but the *attitude itself* is unified.

  If you collapse the problems as you suggest, Feldman's move looks like a cheat. But if you keep them distinct, you see that Feldman solves the **Metaphysical Heterogeneity** problem (by locating unity in the attitude, not the sensation) which then allows him to bypass the **Measurement** problem (because attitudes are arguably easier to scale than raw qualia).

  ### 4. Pedagogical Utility
  For your seminar, I would suggest validating your students' suspicion (it shows deep engagement) but pushing them on the "Natural Kind" issue.

  You might frame it this way:
  > "You are right that if we could measure it, the practical problem vanishes. But does the ability to measure prove the existence of a unified property? I can assign a 'score' to a collection of apples, oranges, and bricks based on their weight. But 'weight' is not the *essence* of those objects. If hedonism says pleasure is the *essence* of the good, does a hedonometer prove that essence exists, or does it just impose a grid on disparate phenomena?"

  ### Conclusion
  You have correctly identified that the **rhetorical force** of the heterogeneity objection relies on its implications for measurement and aggregation. In a pragmatic sense, they stand or fall together.

  However, they are not identical.
  1.  **Measurement** is an epistemic/structural problem (Can we calculate the good?).
  2.  **Heterogeneity** is a metaphysical problem (Is there a 'good-making' property there to calculate?).

  If you solve measurement without solving heterogeneity, you have a working calculus but perhaps no substantive theory of *why* those states are good. If you solve heterogeneity (e.g., via Attitudinal Hedonism) without solving measurement, you have a true theory that is useless for decision-making.

  So, while the heterogeneity objection draws its blood from the measurement wound, the underlying infection is metaphysical. Keeping them distinct helps diagnose whether a hedonist needs a better scale (Measurement) or a better definition of pleasure (Heterogeneity).
