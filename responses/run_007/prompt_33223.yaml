answer: |-
  It is genuinely refreshing to hear a writer asking this kind of question because most people stop at how to describe a feeling rather than asking what the feeling actually is. You are right to suspect that your underlying theory of emotion is going to dictate where your camera points when you are drafting a scene. If you treat emotions as judgments, you are essentially writing philosophy or law inside your character's head. The practical upshot here is that your interior monologue needs to be argumentative. If anger is a judgment that a wrong has been committed, then to write anger convincingly under this model, you have to show the character weighing evidence, recalling precedents, and coming to a verdict. You would focus on the narrative they are constructing about the event rather than the heat in their blood. You might leave out the trembling hands or the flushed face because, in this view, those are just side effects, not the emotion itself. The danger with committing too hard to this view is that you risk making your characters feel overly rational or cold. It becomes very hard to write a scene where someone loses control, because judgments are things we hold, not things that sweep over us. If your character is supposed to be overwhelmed by grief, but you only write their judgments about the loss, it might read like they are processing a tax audit rather than mourning a death. This view makes instinctive, visceral characters nearly impossible to write without them sounding like they are constantly analyzing themselves.

  On the other hand, if you lean into the perception view, where emotions are a way of seeing the world, your writing shifts from the internal monologue to the external environment. Here, the emotion isn't just inside the character; it is painted onto the room they are standing in. If a character is afraid, you do not write that they feel fear; you write that the shadows in the hallway look like they are reaching out, or that the silence feels heavy and predatory. The emotion is in the texture of the experience. This is incredibly powerful for atmosphere and for showing rather than telling, because you are describing the world as it appears to the character rather than labeling their internal state. What you leave out here is the explanation. You do not need to tell the reader why they are afraid, because the perceived threat in the environment does the work for you. The trap with this approach is that it can become vague or overly poetic if you are not careful. It also makes it difficult to write scenes where the character is emotionally mistaken. If emotion is perception, it is hard to show a character who feels angry but is actually just hungry, because their perception would be colored by anger regardless. You also risk slowing down the pace of action scenes because you are stopping to describe the qualitative shift in the world rather than letting the character react.

  Then you have the physiological view, the idea that the emotion is the bodily sensation itself. This is the most common default for writers because it is concrete. If you commit to this, your drafting process becomes an exercise in somatic awareness. You are looking for the specific tightness in the chest, the acid in the stomach, the change in breathing. You show the reader the machinery of the body reacting before the mind catches up. This is excellent for immediacy and for moments of shock or trauma where language fails. What you leave out is the reasoning. You do not explain why the heart is pounding; you just let it pound. The risk here, as you probably know, is the cliché. Clenched fists and racing hearts are the deadest metaphors in fiction because everyone uses them. If you stick strictly to this view, you also run into the problem of ambiguity. A racing heart can be fear, love, or exertion. Without the context of judgment or perception, the body alone cannot always tell the reader what specific emotion is happening. This view makes it very hard to write complex, nuanced emotions like nostalgia or schadenfreude, which do not have distinct, universal bodily signatures. You might find your characters all feeling the same way physically even when their emotional lives are different.

  The reality is that you do not have to choose one of these as the absolute truth for your book, and in fact, relying on only one will likely limit your range. The most convincing interior lives usually weave all three together, but knowing which lens you are using at any given moment can help you troubleshoot when a scene feels flat. If a scene feels too intellectual and cold, you might be stuck in the judgment view and need to drop down into the body to find the heat. If a scene feels melodramatic or vague, you might be floating in the perception view and need to ground it in a specific judgment about what is happening. If a scene feels generic, you might be relying on stock physiological responses and need to sharpen the character's unique perception of the situation. There is no single theory that makes a scene impossible, but sticking rigidly to one will blind you to certain tools. For example, if you refuse to acknowledge the physiological component, you will struggle to write panic. If you refuse to acknowledge the judgment component, you will struggle to write guilt.

  So my advice is to treat these theories as diagnostic tools rather than rules. When you are drafting, let yourself be messy and use whatever works to get the feeling on the page. But when you are revising, look at a passage where the emotion isn't landing and ask yourself which component is missing. Are you telling me what they decided about the situation without showing me how their body reacted? Are you showing me their sweating palms without showing me what they think those palms mean? You want the reader to experience the emotion as a whole event that involves the body, the mind, and the world simultaneously. The goal isn't to be philosophically consistent; it is to be psychologically true. Sometimes the truth is a gut punch, sometimes it is a cold calculation, and sometimes it is the world turning gray. Let the character and the moment dictate which theory holds the most weight, and do not worry about whether the academics would agree with your classification. They are trying to define the thing, but you are trying to make the reader live it.
