          *   *Risk:* Can feel too intellectual, cold, or rationalized. Hard to write visceral moments.
      *   **Perception View (Intentional/Phenomenological):** Emotions are ways of seeing the world, coloring experience (e.g., anger = seeing the world as offensive).
          *   *Writing Implication:* Focus on the *texture* of the experience, the shift in perspective. The world looks different. Metaphor and sensory detail tied to meaning.
          *   *Risk:* Can become abstract or overly poetic if not grounded.
      *   **Physiological View (Somatic/James-Lange):** Emotions are bodily sensations (e.g., anger = racing heart, heat).
          *   *Writing Implication:* Focus on the *body*, visceral reactions, involuntary responses. Show, don't tell.
          *   *Risk:* Can become clichéd (clenched fists, pounding hearts) if overused. Doesn't explain *what* the emotion is about.

