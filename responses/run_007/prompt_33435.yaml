      *   **Agreement:** Everyone agrees on the basic textual claims (Peirce = community/long run, James = works/expedient).
      *   **User's Hypothesis:** It might be a disagreement about the *function* of a theory of truth (ideal condition vs. live criterion).
      *   **Request:** A structural diagnosis of the disagreement (Verbal? Substantive? Explanatory Desiderata? Underdetermined Interpretation?). And: Can it be moved, or is clarity the best outcome?
      *   **Constraint:** No survey of secondary literature. Focus on the *structure* of the disagreement.

  2.  **Deconstruct the Disagreement:**
      *   *Peirce's Position:* Truth is normative and teleological. It's about where inquiry *ought* to go and where it *would* end up ideally. It's realist (there's a reality constraining inquiry).
      *   *James's Position:* Truth is instrumental and psychological/experiential. It's about the *process* of verification and the benefit to the believer. It's more nominalist/humanist (truth is made).
      *   *The Conflict:* Is "what works" (James) the *definition* of truth, or is it the *sign* of truth (Peirce)?
      *   *The Group's Split:*
          *   Camp A (Distortion): James collapses the distinction between *being true* and *being verified/useful*. He loses the normative "ought."
          *   Camp B (Operationalization): Peirce's "ideal limit" is empty without James's "working." James provides the mechanism for Peirce's goal.

  3.  **Evaluate Potential Diagnoses:**
      *   *Verbal Disagreement?* No. They agree on the definitions. They disagree on whether Definition A is compatible with Definition B. It's not just semantics; it's about philosophical commitment.
      *   *Substantive Disagreement (One side wrong)?* Possible, but unlikely to be resolved textually because both Peirce and James are ambiguous at points. Peirce hated James's interpretation, but James claimed fidelity. Relying on "who is right" stalls the group.
      *   *Explanatory Desiderata?* This is the user's hypothesis ("what a theory of truth is supposed to *do*"). This is very strong. Peirce wants a logic of science (normative). James wants a philosophy of life (existential/practical).
      *   *Underdetermined Interpretation?* Also strong. Peirce's texts allow for both a strict realist reading and a more pragmatic reading. James's texts allow for both a crude instrumentalism and a nuanced process view.

  4.  **Develop the Structural Diagnosis:**
      *   It's not *just* one of these. It's a **Category Mismatch regarding the Locus of Normativity.**
      *   Peirce locates normativity in the *end* (the ideal limit).
      *   James locates normativity in the *means* (the process of verification).
      *   The disagreement is about **Temporal Scope and Agency.**
      *   *Camp A* sees Truth as a *Regulative Ideal* (Peirce).
      *   *Camp B* sees Truth as a *Tool for Navigation* (James).
      *   Therefore, the disagreement is about **Explanatory Desiderata** (User's hunch is right) *combined with* **Metaphysical Commitments** (Realism vs. Humanism).
      *   *Crucial Insight:* It's a disagreement about whether "Truth" is a property of *propositions relative to reality* (Peirce) or *experiences relative to agents* (James).

  5.  **Formulate the Diagnosis (The "What Kind" Question):**
      *   It is primarily a disagreement about **Explanatory Desiderata** (What job is the concept doing?).
      *   But it is *fueled* by an **Underdetermined Interpretation** of the link between "utility" and "convergence."
      *   It is *not* merely verbal.
      *   It is *not* easily resolvable as "one side is wrong" because Peirce and James themselves diverged on this.

  6.  **Develop the Path Forward (The "Can it Move" Question):**
      *   If it's about desiderata, arguing texts won't work.
      *   Need to shift the question from "Did James betray Peirce?" to "What problem is each trying to solve?"
      *   *Strategy 1:* Introduce the "Good for Whom?" question. (Peirce: Community/Science. James: Individual/Life).
      *   *Strategy 2:* Introduce the "Time Horizon" question. (Peirce: Infinite long run. James: Specious present/near future).
      *   *Strategy 3:* Test the limits. When does "working" fail to be "true"? (Peirce: Eventually. James: Maybe never, if it keeps working).
      *   *Recommendation:* Stop trying to reconcile them. Treat the tension as the feature, not the bug. The "Pragmatic Maxim" itself is the object of study, not just the truth definition.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the sophistication:* This is a classic problem (the Peirce-James split), but the user's group has hit the *structural* wall, not just the historical one.
      *   *Validate the User's Hypothesis:* Yes, it is about explanatory desiderata.
      *   *Refine the Diagnosis:* Call it a **Conflict of Normative Horizons.**
      *   *Camp A (Distortion):* Prioritizes *Objectivity/Constraint*. Truth must be independent of what I want now.
