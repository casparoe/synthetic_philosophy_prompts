answer: |-
  This is a sophisticated stalemate, and your intuition is correct: this is not a disagreement about what the texts *say*, nor is it merely verbal. It is a **disagreement about explanatory desiderata**, specifically concerning the **locus of normativity** and the **temporal horizon** of truth.

  Here is the structural diagnosis of why your group is stuck, followed by a suggestion on how to proceed.

  ### 1. The Diagnosis: A Conflict of Normative Horizons

  Your group is stuck because they are treating "Truth" as a single variable that Peirce and James are trying to solve for, when in fact they are solving for two different variables using the same label.

  **Camp A (The Distortion View)** prioritizes **Constraint**.
  For them, a theory of truth must explain how belief is answerable to something *outside* the believer. If truth is just "what works," what prevents a comforting delusion from being true? They need Peirce's "ideal limit" to preserve the *normativity* of truth—the idea that we can be wrong even if we feel right. For Camp A, the function of a truth theory is to secure the **objectivity** of inquiry.

  **Camp B (The Operationalization View)** prioritizes **Accessibility**.
  For them, a theory of truth must explain how we actually *navigate* the world. If truth is locked away in the "end of inquiry" (an infinite future), it is useless to us now. They need James's "cash value" to make truth a live tool. For Camp B, the function of a truth theory is to secure the **agency** of the inquirer.

  **The Structural Fault Lines:**
  This manifests in two specific structural mismatches that keep the conversation circling:

  1.  **Temporality (The "When"):**
      *   **Peirce:** Truth is *eschatological*. It exists in the future perfect tense (what *will have been* agreed upon).
      *   **James:** Truth is *present-tense*. It happens *now* in the process of verification.
      *   *The Stalemate:* Camp A says James ignores the future constraint; Camp B says Peirce ignores the present experience. Neither can convince the other because they value different time horizons for epistemic warrant.

  2.  **The Definition/Criterion Confusion:**
      *   **Peirce:** Offers a *definition* of truth (convergence) but admits we rarely have a *criterion* to know when we have it.
      *   **James:** Offers a *criterion* for truth (utility) and collapses it into the *definition*.
      *   *The Stalemate:* Camp B argues that a definition without a criterion is empty (metaphysical hand-waving). Camp A argues that a criterion without a distinct definition is circular (truth is what works, working is defined by truth). They are arguing about whether a theory of truth should be **ontological** (what truth *is*) or **methodological** (how we *find* it).

  ### 2. Is it Verbal, Substantive, or Underdetermined?

  *   **It is not Verbal:** They aren't just using words differently; they are committed to incompatible philosophical priorities (Objectivity vs. Agency).
  *   **It is not Textually Underdetermined:** Peirce explicitly rejected James's interpretation later in life (coining "pragmaticism" to distance himself). The texts *do* support the idea that they diverged.
  *   **It is Substantive, but about Desiderata:** This is the key. It is a substantive disagreement about **what work the concept of truth is supposed to perform.**
      *   If the job of "truth" is to anchor science against relativism, Peirce wins (Camp A).
      *   If the job of "truth" is to validate religious/moral belief in a scientific age, James wins (Camp B).

  Your group is stuck because they are trying to resolve a **teleological disagreement** (what is the *purpose* of truth?) using **textual evidence** (what did they *say*?). The texts won't resolve it because Peirce and James themselves had this teleological disagreement.

  ### 3. Can This Debate Be Moved?

  You cannot resolve this by reading more Peirce or James. They will simply feed the two camps respectively. However, you can move the debate from "Who is right?" to "What are the costs of each choice?"

  To break the circle, you need to force the group to inhabit the **consequences** of each position rather than the **definitions**.

  **Strategy 1: The "Comforting Lie" Test**
  Ask the group to evaluate a specific proposition: *"A dying patient believes they will recover, and this belief significantly improves their quality of life in their final days, though they will not recover."*
  *   **Jamesian Analysis:** Is this belief true? (It works; it has cash value; it leads to beneficial experiential outcomes.)
  *   **Peircean Analysis:** Is this belief true? (It does not converge with reality; investigation would falsify it.)
  *   **The Move:** Ask Camp B if they are willing to call this "true." Ask Camp A if they are willing to call this "false" despite its utility. This forces Camp B to confront the relativism charge and Camp A to confront the coldness of their realism.

  **Strategy 2: The "Idle Fact" Test**
  Ask the group to evaluate a proposition: *"There is an even number of blades of grass on the lawn."* (Assume this is factually the case, but no one knows, and it matters to no one).
  *   **Peircean Analysis:** Is this true? (Yes, reality is independent of what we know; inquiry would eventually reveal it.)
  *   **Jamesian Analysis:** Is this true? (If it makes no difference to experience, is it a live hypothesis? Does truth "happen" to it?)
  *   **The Move:** Ask Camp A how we access this truth if it never impacts experience. Ask Camp B if they are willing to say some facts are neither true nor false until they matter. This forces Camp A to defend metaphysical realism and Camp B to defend anti-realism.

  ### 4. Recommendation for the Group

  Stop trying to reconcile Peirce and James. The tension *is* the pragmatisms.

  Propose to the group that the "structural problem" they are feeling is actually the central problem of the tradition. Peirce represents the **Logic of Science** wing (truth as a regulatory ideal for communities), and James represents the **Philosophy of Life** wing (truth as a vital tool for individuals).

  **The Pivot:**
  Shift the reading group's question from *"Did James distort Peirce?"* to *"Can a single theory of truth satisfy both the need for scientific constraint and the need for human meaning?"*

  If you want to move forward textually, read **Dewey**. He explicitly tried to solve this exact structural problem by shifting the focus from "Truth" (a static property) to "Warranted Assertibility" (a status earned through inquiry). Dewey accepts James's focus on the present situation but tries to reintroduce Peirce's communal normativity.

  **Summary:**
  Your diagnosis was right. It is a disagreement about **explanatory desiderata**. One side wants truth to protect us from ourselves (Peirce); the other wants truth to empower us in the world (James). Acknowledge that this is an irreconcilable tension within pragmatism itself, and use that tension as the engine for the next phase of the group.
