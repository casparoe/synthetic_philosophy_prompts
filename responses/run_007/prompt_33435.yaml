      *   *Is it resolvable?* No, not in the sense of one side winning. Peirce himself thought James ruined it.
      *   *How to move:* Shift from "Who is right about Truth?" to "What are the costs of each choice?"
      *   *Specific Exercise:* Ask the group to identify a belief that "works" but might not be "true" in Peirce's sense (e.g., a comforting lie that functions well socially). Or a belief that is "true" in Peirce's sense but currently "useless" (e.g., obscure scientific fact).
      *   *Conclusion:* The stalemate *is* the lesson. Pragmatism isn't a monolith.

  8.  **Final Polish:** Ensure tone is respectful of faculty-level discussion. Avoid jargon where possible, but use precise philosophical terms (normativity, regulative ideal, instrumentalism). Ensure the distinction between "definition" and "criterion" is highlighted, as that's often the crux. (Self-Correction: Make sure not to slip into secondary lit survey. Keep it structural).

