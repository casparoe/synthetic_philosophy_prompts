      *(Refining the "Move" section)*: Suggest reading Dewey? No, that might just add more text. Suggest *applying* the theories to a concrete case. That forces the structural difference to reveal itself.

      *(Final thought)*: The user suspects it's about "what a theory of truth is supposed to do." I need to confirm this is the deepest layer. Yes, it's a teleological disagreement.

