answer: |-
  Hi there,

  This is a fantastic puzzle, and you are right to feel that something is off in the reasoning. You have correctly identified a tension that keeps decision theorists up at night, specifically regarding how we index preferences to time and information. If I were to step in and try to save the money pump argument from dissolving into triviality, I would reject premise three. The error lies in treating preferences held at different times under different information states as members of a single preference relation that can be tested for transitivity.

  When we formalize decision theory, we do not say that an agent simply prefers A to B. We say that an agent prefers A to B relative to an information set or a belief state. Let us call your information state at 2pm I1 and your information state at 2:01pm I2. At I1, you prefer chicken to tuna. At I2, you prefer tuna to chicken. This is not intransitivity. Intransitivity requires that within a single information state, you prefer A to B, B to C, and C to A. What you have described in your example is preference change driven by Bayesian updating. You have two different conditional preference relations, not one intransitive relation. The money pump argument relies on the agent having a stable valuation structure that leads them to trade in a circle without gaining new information that would justify reversing the trade. If you learn the tuna is fresh, the object of your choice has effectively changed. You are no longer choosing between Chicken-Old and Tuna-Unknown, but between Chicken-Old and Tuna-Fresh. Since the options themselves are different, no cycle exists.

  However, your worry in premise five is the deeper threat, and it requires more care. You ask why we cannot hold A greater than B at t1, B greater than C at t2, and C greater than A at t3, thereby avoiding the pump simply by never holding all three simultaneously. This is the problem of dynamic inconsistency. If your underlying values are intransitive, but you only entertain them pairwise over time, can you avoid the pump? The answer is that you can avoid the pump only if you are naive. If you are a sophisticated agent, you anticipate that your future self will make a choice that undermines your current goals. To avoid being money pumped, you must bind your future self or adopt a resolute choice policy where you stick to a plan even when your local preferences shift.

  This is where the cost comes in. If we reject premise three and insist that preferences are indexed to information, we save the money pump from condemning belief updating. But to answer your worry in premise five, we must accept that rationality requires diachronic coherence, not just synchronic consistency. The money pump argument does not just rule out having contradictory attitudes in a single moment of reflection. It rules out having a decision-making architecture that allows local preferences to override global plans without justification. If you have underlying intransitive values, you can only avoid the pump by imposing a transitive structure on your plans. You must treat your future selves as agents you need to negotiate with or command.

  So the move I am making is to insist that the preference relation relevant for rationality is the one held fixed over the duration of the decision problem, conditional on a fixed information state. The cost of this move is that it makes the concept of preference much heavier than mere episodic desire. It means that to be rational is not just to have consistent snaps shots of desire, but to maintain a coherent policy over time. It implies that rationality is partly constitutive of agency across time. You cannot simply say I prefer A to B now and B to A later without a reason; if you do so without new information, you are not just changing your mind, you are violating a norm of diachronic stability.

  If you accept this, the money pump remains a powerful tool. It shows that if you lack diachronic coherence, you are vulnerable to exploitation. The triviality you fear only arises if we treat preferences as ephemeral mental events rather than stable dispositions to choose under specified conditions. By rejecting premise three, we clarify that the money pump targets the structure of these dispositions, not the natural evolution of taste based on evidence. The cost is that we must view rational agents as planners who constrain their future choices, rather than mere sequences of momentary optimizers. This is a significant commitment, but it is one most decision theorists are willing to pay to keep the normativity of transitivity intact.

  I hope this helps you untangle the corner you are in. It is a subtle distinction, but it is the standard way to preserve the force of the argument without condemning learning.

  Best wishes
