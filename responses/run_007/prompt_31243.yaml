  It secures your verdict that the flourishing world beats the barely-living one and that adding suffering is wrong, but it rejects your intuition that a tiny drop in quality is acceptable for a large population increase.

  4. This principle asserts that moral value is determined primarily by minimizing suffering rather than maximizing happiness or total welfare.
  It aligns with your strong conviction that adding a suffering person makes a world worse, but it implies that adding happy people or accepting lower quality for more lives adds little to no value.

  5. This principle asserts that one outcome can only be better than another if it is better for at least one specific person who exists in both scenarios.
  It supports your claim that adding a suffering person is worse and that the trillions aren't better than the billion, but it implies that adding happy people is neutral rather than good because it isn't better for the original inhabitants.
