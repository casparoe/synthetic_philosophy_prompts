answer: |-
  This is one of the most enduring stalemates in the philosophy of social science, and your intuition that it is "stuck" is correct. It has persisted for 70 years because it is not a single disagreement. It is a **hybrid disagreement** composed of three distinct layers that are frequently conflated: a normative layer (goals), an empirical layer (stability), and a semantic layer (what "assumption" means).

  If you treat it as only one of these, you will talk past the other side. Here is the diagnosis of the disagreement, followed by an assessment of whether resolution is possible.

  ### 1. The Diagnosis: A Three-Layer Cake

  #### Layer A: The Normative/Teleological Disagreement (Goals)
  At the deepest level, the two sides disagree on the **loss function** of economics.
  *   **The Friedman Camp** optimizes for **predictive accuracy**. Their implicit view is that economics is an engineering discipline. If the bridge stands, the physics doesn't matter.
  *   **The Critics** optimize for **causal understanding** or **policy robustness**. Their view is that economics is a diagnostic discipline. If you don't know *why* the bridge stands, you can't know if it will stand when a hurricane hits.

  This is not resolvable by evidence because it is a value judgment about what science is *for*. However, it is often disguised as an epistemic claim. Friedman claims prediction is the *only* test of a theory; critics claim understanding is a *prerequisite* for reliable prediction.

  #### Layer B: The Hidden Empirical Claim (Stability)
  Buried inside the philosophy is a crucial empirical claim about the nature of social systems.
  *   **Friedman's Empirical Bet:** Social regularities are sufficiently stable that surface-level correlations will hold even if the underlying micro-mechanisms are misspecified. He assumes the system is **ergodic** or at least structurally stable over the relevant time horizon.
  *   **The Critics' Empirical Bet:** Social systems are **reflexive** and **non-stationary**. Agents learn, policies change incentives, and structures shift. Therefore, a model that fits past data via false assumptions (curve-fitting) will fail when the regime changes.

  This is the heart of the **Lucas Critique** (1976), which is essentially the killer app for the anti-Friedman position. Lucas showed that if you model agent behavior based on past policy regimes (false assumptions about expectations), your predictions will fail immediately when policy changes.
  *   **Resolution Potential:** This *is* empirically testable. We can ask: "Do models with realistic micro-foundations outperform black-box models during structural breaks?" The evidence is mixed, but in policy contexts, the critics generally win. In high-frequency trading (where the rules don't change), Friedman wins.

  #### Layer C: The Semantic Disagreement (What is an "Assumption"?)
  As Alan Musgrave (1981) famously argued, Friedman conflates three different types of assumptions:
  1.  **Negligibility Assumptions:** "Gravity doesn't matter for this billiard shot." (The factor exists but is irrelevant).
  2.  **Domain Assumptions:** "This model applies only to vacuum conditions." (The assumption defines where the model works).
  3.  **Heuristic Assumptions:** "Let's assume a sphere to make the math solvable, we'll add friction later." (A simplification to be relaxed).

  Friedman treats all unrealistic assumptions as **Negligibility** claims (i.e., "transaction costs don't matter"). Critics attack them as **Domain** violations (i.e., "you are applying a vacuum model to an atmosphere").
  *   **The Talking-Past Element:** When Friedman says "assumptions don't need to be real," he means "we can ignore second-order factors." When critics hear this, they think "he is saying we can ignore first-order causal mechanisms." They are using the same word to describe different mathematical operations.

  ### 2. Is it a Verbal Dispute?
  Partially. If both sides agreed on Musgrave's taxonomy, 30% of the heat would vanish. Friedman could say, "I am making a negligibility claim about transaction costs," and the critic could reply, "I have empirical evidence that transaction costs are not negligible in this domain."

  However, it is not *purely* verbal. Even if we clarify the definitions, the Normative (Layer A) and Empirical (Layer B) disagreements remain.

  ### 3. Is it Normative and Unsettled?
  Yes, but with a caveat. It is normative regarding the *priority* of goals, but the goals themselves constrain the methods.
  *   If your goal is **Prediction** (e.g., forecasting inflation next quarter), Friedman is right. Deep structural truth is not required for short-term correlation.
  *   If your goal is **Intervention** (e.g., designing a tax code), the Critics are right. You need to know how agents will react to the new incentives (the "deep parameters").

  The conflict arises because economists often claim their models are for *understanding* while using them for *policy*, or claim they are for *prediction* while using them to justify ideological positions about human nature.

  ### 4. The "Rationalist" Diagnosis: Bias-Variance and Map-Territory
  Since you mentioned the rationalist blogosphere, it is useful to frame this via the **Bias-Variance Tradeoff**.
  *   **Friedman Models:** High Bias (false assumptions), Low Variance (simple, robust to noise). They risk underfitting the complexity of reality but are less prone to overfitting specific datasets.
  *   **Realist Models:** Low Bias (complex, realistic), High Variance (hard to estimate, prone to noise). They risk overfitting but capture the causal structure.

  The stalemate exists because neither side admits they are optimizing for different parts of the error curve. Friedman acts as if Bias doesn't matter; Critics act as if Variance doesn't matter.

  Furthermore, regarding **Map vs. Territory**: Friedman argues that a map is only good if it gets you to the destination, even if it depicts dragons where there are none. Critics argue that if the map depicts dragons, you won't know where you can build a road. Both are right, depending on whether you are navigating or building.

  ### 5. What Would Resolve It? (Or Should We Accept Divergence?)

  We should not expect philosophical convergence, but we can achieve **methodological peace** through **Problem-Relative Pluralism**.

  **The Resolution Path:**
  1.  **Stop asking "Is the model true?"** Start asking "What is the model *for*?"
      *   If the goal is **Prediction** (finance, short-term forecasting): Adopt Instrumentalism. Use ML, reduced-form econometrics, and Friedman-style models. Don't worry if agents are "rational," worry if the loss function is minimized.
      *   If the goal is **Policy/Welfare** (antitrust, tax, development): Adopt Structural Realism. You *must* identify deep parameters and causal mechanisms because you are changing the system. The Lucas Critique applies here.

  2.  **Force Explicit Domain Claims:**
      *   Require Friedman-style modelers to explicitly state the **domain of validity**. "This model assumes zero transaction costs; therefore, it applies only to high-liquidity markets." This turns a philosophical defense into an empirical risk.

  3.  **Acknowledge the Empirical Bet:**
      *   Admit that using unrealistic assumptions is a bet on **structural stability**. If the environment is volatile (e.g., crypto markets, wartime economies), the Friedman bet fails. If the environment is stable (e.g., consumer packaged goods), the Friedman bet pays off.

  **Conclusion:**
  The debate is stuck because both sides are trying to claim a **monopoly on scientific legitimacy**.
  *   Friedman wants to say: "Because my assumptions are false, I am still doing science."
  *   Critics want to say: "Because your assumptions are false, you are not doing science."

  The way out is to reject the monopoly. Economics is not one thing. It is a toolkit. A hammer (Friedman) is not "worse" than a screwdriver (Realism) unless you are trying to drive a screw. The disagreement persists because economists keep trying to drive screws with hammers while arguing that hammers are the only true tools.

  **Verdict:** It is a **normative disagreement about goals** disguised as an **epistemic disagreement about truth**, compounded by **semantic ambiguity**. Resolution requires abandoning the quest for a single "correct" methodology and adopting **contextual pluralism**: specify the use-case, then choose the assumptions. If someone refuses to specify the use-case, they are likely doing ideology, not science.
