answer: |-
  # The Ontology of Mechanistic Interpretability: A Decision Tree

  ## Introduction: Discovery vs. Imposition

  Mechanistic interpretability (MI) operates on a tacit premise: that inside the weight matrices and activation patterns of a neural network, there are *things* to be found. We speak of "feature detectors," "circuits," and "representations." But what is the metaphysical status of these entities?

  When you run a linear probe or visualize a feature, are you acting like a neuroanatomist dissecting a brain (discovering pre-existing structures) or like a cartographer drawing borders on a cloud (imposing useful structure on a continuous field)?

  This decision tree maps the logical space of answers to this question. It is designed to bypass terminology and focus on **commitments about truth, determinacy, and dependence**. The goal is not to catalogue every label in the literature, but to identify the fault lines that determine what interpretability research can claim to achieve.

  ---

  ## The Decision Tree

  Answer the following four questions in order. Your path determines your philosophical position.

  ### Q1: The Eliminativist Challenge
  **Claim:** *"The term 'representation' imports folk-psychological assumptions (about agents, beliefs, and goals) that do not apply to matrix multiplications. We should describe networks solely in terms of weights, activations, and gradients, without semantic gloss."*

  *   **Do you accept this claim?**
      *   **YES:** You believe representation talk is actively misleading and should be purged from rigorous science.
          *   ➔ **Position: Eliminativism**
      *   **NO:** You believe representation talk captures a real or useful aspect of the system that purely mechanistic description misses.
          *   ➔ **Go to Q2.**

  ### Q2: The Truth Condition
  **Claim:** *"When we say 'Neuron 452 represents a curve,' this statement is literally **true** (in the same way 'this wire carries 5 volts' is true), not merely a useful fiction that helps us predict the network's behavior."*

  *   **Do you accept this claim?**
      *   **NO:** You believe representational descriptions are *false* strictly speaking (the network has no semantics), but they are indispensable tools for engineering and explanation.
          *   ➔ **Position: Instrumentalism**
      *   **YES:** You believe representational descriptions can be true, though perhaps only under certain conditions.
          *   ➔ **Go to Q3.**

  ### Q3: The Determinacy of Content
  **Claim:** *"There is a unique, stance-independent fact of the matter about **what** a specific circuit represents. For example, it is either true or false that a circuit represents 'dog' rather than 'furry quadruped' or 'image patch with high frequency in quadrant 3,' regardless of how an interpreter chooses to describe it."*

  *   **Do you accept this claim?**
      *   **YES:** You believe the content is fixed by the causal role or internal structure of the network itself.
          *   ➔ **Position: Strong Realism**
      *   **NO:** You believe content is underdetermined by the physical substrate; multiple incompatible semantic descriptions can be equally valid depending on context.
          *   ➔ **Go to Q4.**

  ### Q4: The Locus of Structure
  **Claim:** *"Even if semantic content is relative, the **geometric structure** of the representation (e.g., the existence of linear subspaces, orthogonality between features, or topology of the activation manifold) is intrinsic to the network and discoverable independently of any interpretive goals."*

  *   **Do you accept this claim?**
      *   **YES:** You believe the mathematical structure of the representation is mind-independent, even if the labeling of that structure is not.
          *   ➔ **Position: Structural Realism**
      *   **NO:** You believe that even the identification of 'structure' (e.g., what counts as a 'feature' vs. 'noise') depends on the **interpretive stance** (the goals and predicates) adopted by the observer.
          *   ➔ **Position: Dennett-style Intentional Stance Realism**

  ---

  ## Mapping the Positions

  Here is how the five required positions locate within the tree, along with the core commitments that define them.

  ### 1. Eliminativism (Q1: YES)
  *   **Core Commitment:** Representation is a contaminant.
  *   **View on MI:** Mechanistic interpretability should rename itself "circuit analysis." We should talk about "activation directions" and "causal paths," never "features" or "concepts."
  *   **Motivation:** Avoids the hard problem of grounding semantics in syntax. Aligns with a strict physicalist ontology.
  *   **Key Proponents:** Often implicit in low-level engineering papers; philosophically aligned with Churchland-style neurophilosophy.

  ### 2. Instrumentalism (Q1: NO, Q2: NO)
  *   **Core Commitment:** Representations are useful fictions.
  *   **View on MI:** When we find a "curve detector," we haven't found a thing in the network; we've found a *handle* that lets us manipulate the network. The statement is false (the network doesn't *know* what a curve is), but denying it makes engineering impossible.
  *   **Motivation:** Preserves the utility of MI without committing to controversial metaphysics about machine content.
  *   **Key Proponents:** Common among pragmatists and some ML practitioners who view models as black-box approximators.

  ### 3. Strong Realism (Q1: NO, Q2: YES, Q3: YES)
  *   **Core Commitment:** Representations are natural kinds.
  *   **View on MI:** There is a fact of the matter about what the network represents, waiting to be discovered. If two interpreters disagree on whether a neuron represents "cat" or "animal," one of them is objectively wrong.
  *   **Motivation:** Treats MI as a natural science analogous to biology or chemistry.
  *   **Key Proponents:** Early optimism in MI; aligns with "platonic" views of feature spaces.

  ### 4. Structural Realism (Q1: NO, Q2: YES, Q3: NO, Q4: YES)
  *   **Core Commitment:** The geometry is real; the semantics are not.
  *   **View on MI:** The fact that activations form a linear subspace is an objective property of the weights (like the shape of a key). However, calling that subspace "gender" or "smile" is underdetermined. The *relations* are real; the *labels* are not.
  *   **Motivation:** Avoids the indeterminacy of translation (Quine) while preserving the objective reality of the mechanism.
  *   **Key Proponents:** Those focusing on representation geometry (e.g., Gurnee et al.) over semantic labeling.

  ### 5. Dennett-style Intentional Stance Realism (Q1: NO, Q2: YES, Q3: NO, Q4: NO)
  *   **Core Commitment:** Representations are real patterns, but only relative to a stance.
  *   **View on MI:** There is no "view from nowhere." A feature is real *if* adopting the stance that the network has that feature allows for successful prediction and compression. However, unlike Instrumentalism, this view claims the pattern is *real* within that stance, not just a fiction.
  *   **Motivation:** Reconciles the reality of high-level patterns with the lack of low-level determinacy.
  *   **Key Proponents:** Philosophers influenced by Dennett's *The Intentional Stance*; some contemporary AI safety theorists.

  ---

  ## Analysis of Logical Space

  ### Unoccupied Regions

  **1. The "Determinately False" Region (Q2: NO, Q3: YES)**
  *   *Description:* One might claim representational statements are strictly false (Instrumentalism), but that there is nonetheless a unique fact about what they are *trying* to describe.
  *   *Status:* **Incoherent.** If there is a unique, stance-independent fact about the content (Q3: YES), then a description matching that fact would be true. To say the fact exists but the truth is impossible collapses into Strong Realism (if we can access it) or Skepticism (if we can't). In the context of MI, if the structure determines the content uniquely, denying truth is merely verbal pedantry.

  **2. The "Intrinsic Content, Extrinsic Structure" Region (Q3: YES, Q4: NO)**
  *   *Description:* The semantic content is fixed by the network, but the geometric structure used to identify it depends on the observer.
  *   *Status:* **Unattractive/Unstable.** In neural networks, content is typically inferred from structure (e.g., linear probes). If the structure is stance-dependent, it is difficult to argue the content derived from it is stance-independent. This view requires a magical theory of content that bypasses the vehicle. It is logically possible but lacks a mechanistic account of how content is grounded.

  ### Collapses and Red Herrings

  **1. Pragmatic Realism vs. Instrumentalism**
  *   Many researchers claim to be "Pragmatic Realists" (representations are real *because* they work).
  *   **Collapse:** If "real because they work" means "true," they are Realists (go to Q3). If it means "useful to treat as true," they are Instrumentalists (Q2: NO). There is no stable middle ground where a statement is *false* but *ontologically robust*. I have forced this distinction at Q2. If you cannot say the statement is literally true, you are an Instrumentalist.

  **2. Epistemic Humility vs. Structural Realism**
  *   One might say, "We can't know the true content, but it exists."
  *   **Distinction:** This is **Epistemic Humility**, not Structural Realism. Structural Realism makes a metaphysical claim: content is *indeterminate*, not just unknown.
  *   **Tree Handling:** Q3 asks if there is a *fact of the matter*, not if we can *know* it. Strong Realists can be humble about our current ability to find the fact. Structural Realists deny the fact exists.

  **3. "Feature" vs. "Circuit"**
  *   Some argue circuits are real but features are not.
  *   **Red Herring:** In MI, circuits are defined by their effect on features, and features are defined by their activation in circuits. If you are a Realist about one, you are generally committed to Realism about the other. The tree treats "representation" as covering both vehicles (features) and mechanisms (circuits).

  ---

  ## Defense of the Fault Lines

  I have constructed this tree to prioritize **Ontological Commitment** (Q1/Q2) over **Epistemic Access**. This is a deliberate choice. Much of the current debate confuses "We can't find the features yet" (Epistemic) with "The features aren't there" (Ontological).

  ### Why Q2 (Truth vs. Utility) is the Primary Split
  The most dangerous confusion in MI is treating successful prediction as proof of ontological reality. Instrumentalists and Realists often agree on *methods* (probing, ablation) but disagree on *what success means*.
  *   For the **Instrumentalist**, a successful probe is like a successful weather prediction using folk terms ("red sky at night"): it works, but the atmosphere doesn't contain "nights" or "skies" in the propositional sense.
  *   For the **Realist**, a successful probe is like finding a gene: the function exists regardless of the probe.
  Separating these at Q2 prevents the "It works, therefore it's real" fallacy.

  ### Why Q4 (Structure vs. Stance) Distinguishes Structural from Dennett
  This is the finest cut in the tree. Both Structural Realists and Dennett-style Realists agree that content is not determinate (Q3: NO). They diverge on the **vehicle**.
  *   **Structural Realists** believe the activation space has a geometry (e.g., a specific orthogonal basis) that exists like a crystal lattice. We just don't know how to name the axes.
  *   **Dennett-style Realists** believe the geometry itself is a product of the stance. If we treated the network as a heat-generator rather than a classifier, the "features" would disappear entirely, replaced by thermodynamic descriptions. The structure is not intrinsic; it is *emergent relative to the goal*.
  This distinction matters for MI research goals. If Structural Realism is true, we should search for the "one true basis" of the activation space. If Dennett is true, we should search for the "most useful basis for safety."

  ### Why Eliminativism is a Distinct Leaf
  It is tempting to treat Eliminativism as extreme Instrumentalism. It is not.
  *   **Instrumentalism:** "Use the map, but don't think the territory looks like the map."
  *   **Eliminativism:** "Burn the map. There is no territory that corresponds to 'representation'."
  Eliminativism demands a rewriting of MI's scientific language. Instrumentalism permits the language as a *façon de parler*. This is a practical difference in how papers should be written and reviewed.

  ## Conclusion: What This Tree Buys You

  By locating your position on this tree, you clarify the stakes of your interpretability research.

  *   If you are a **Strong Realist**, your failure to find a feature is a technical failure.
  *   If you are a **Structural Realist**, your failure to name a feature is expected; your success in mapping the geometry is the victory.
  *   If you are an **Instrumentalist**, your success is measured purely by downstream engineering tasks (e.g., does editing this 'feature' actually change output?).
  *   If you are a **Dennett-style Realist**, you must justify your interpretive stance (e.g., "Why are we looking for deceptive features rather than efficiency features?").
  *   If you are an **Eliminativist**, you must propose new vocabulary to replace "representation."

  Most current MI literature oscillates unstably between **Strong Realism** (in the abstract) and **Instrumentalism** (in practice). This tree forces a choice. You cannot claim to be discovering "the truth" about the network while simultaneously admitting that the features are defined by your probing tools. Choose your leaf, and defend the logic that leads to it.
