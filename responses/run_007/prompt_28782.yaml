      *Let's adjust Q3/Q4 to capture Structural vs. Dennett.*
      *   Q3: Is there a fact of the matter about content? (Yes -> Strong). (No -> Go to Q4).
      *   Q4: Is the *structural vehicle* (e.g., linear subspace) intrinsic to the network, or does it only exist relative to an interpretive goal?
          *   Intrinsic -> Structural Realism.
          *   Relative -> Dennett.

      *Wait, is Dennett distinct from Instrumentalism?* Yes. Instrumentalism says "It's false." Dennett says "It's real relative to the stance." It's a form of realism, just not *absolute* realism.
      *   So Q2 needs to separate Instrumentalism (False) from Realisms (True in some sense).

      *Revised Plan:*
      1.  Should we keep the term "representation"? (Eliminativism vs. Others).
      2.  Is representational talk *true* or *useful fiction*? (Realisms vs. Instrumentalism).
      3.  Is the *content* determinate? (Strong Realism vs. Others).
