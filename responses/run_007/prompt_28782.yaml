      *   Need to ensure technical terms (activation space, linear probe) are used correctly but the focus remains on metaphysics.
      *   Need to justify *why* I'm collapsing certain distinctions. For example, some might argue "Pragmatic Realism" is distinct from "Instrumentalism." I need to argue they collapse if they agree on truth conditions.

  7.  **Finalizing the Tree Structure (Iterative Polish):**
      *   *Node 1:* Ontological Commitment (Eliminativism vs. Retention).
      *   *Node 2:* Truth Conditions (Realism vs. Instrumentalism).
      *   *Node 3:* Determinacy (Strong vs. Weak/Relative).
      *   *Node 4:* Locus of Structure (Intrinsic vs. Stance-Dependent).

      *Wait, I need to make sure Structural Realism and Dennett-style are distinct.*
      *   Structural Realism: The *geometry* is the representation. The geometry is intrinsic.
      *   Dennett: The *intentionality* is the representation. The intentionality is extrinsic (stance).
      *   So the split is: Is the *vehicle* (geometry) sufficient for representation, or do we need the *interpretation* (stance)?
      *   Actually, a better split for the leaves provided:
          *   Strong Realism: Content + Structure Intrinsic.
