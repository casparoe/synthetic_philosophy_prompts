      *Structural Assumption:* The assumption is **Temporal Neutrality of Preferences** (or the idea that rational agency requires a stable utility function over time). Parfit calls this the "Requirement of Equal Concern" or challenges the "Self-Interest Theory." I will phrase it as the assumption of **Preference Stability as a Condition of Rational Agency**.

      *Let's finalize the text.*

      *(Self-Correction on "Unified Rational-Agent Reply"):* A sophisticated CDT (Causal Decision Theory) or EDT (Evidential Decision Theory) proponent might argue that if you *can* change your preferences, you should, but once changed, you act rationally on new ones. The challenge is whether the *original* self can claim the later self acted irrationally. The reply will likely argue that rationality is always indexed to the *current* mental state, so the later action wasn't irrational *simpliciter*, just relative to a ghost. I need to frame the reply to defend the unity of the agent against the "split" implied by the case.

