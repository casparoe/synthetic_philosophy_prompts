answer: |-
  Julian, a pragmatic startup founder whose sole metric of success is net worth, requires a substantial, unsecured bridge loan from a skeptical investor, Ms. Vance, to survive a cash-flow crisis. Vance knows that once Julian is solvent, a purely wealth-maximizing agent would logically divert funds to a high-yield speculative venture rather than repaying her interest-free loan immediately, and legal recourse is too slow to deter this. Recognizing that his current rationality makes him untrustworthy, Julian spends six months undergoing intensive cognitive conditioning and immersing himself in a community with a rigid honor code, successfully rewiring his psychology until the mere thought of defaulting triggers visceral panic and shame. Vance, convinced by this transformation, grants the loan. When the speculative venture later opens up, offering returns that would double Julian's net worth at the cost of delaying repayment, the conditioned Julian repays Vance immediately, forgoing the profit to alleviate his psychological distress.

  (a) **Later Irrationality:** At the moment of repayment, the action is irrational relative to Julian's *original* values because it violates the principle of wealth maximization that defined his agency at the start; he incurs a tangible financial loss (the forgone investment returns) solely to satisfy an artificially induced psychological aversion that his original self viewed as a bug, not a feature.

  (b) **Earlier Rationality:** The decision to undergo conditioning is rational at the moment it is made because, calculated from the original perspective, the expected utility of securing the loan (business survival and future solvency) vastly outweighs the future cost of the forgone investment; it is a strategic sacrifice of future flexibility to secure present existence.

  (c) **Failure of Ordinary Precommitment:** Legal contracts are insufficient because enforcement is costly and slow, allowing Julian to hide assets in the speculative venture; reputation is ineffective because this is a high-stakes, one-off interaction where the temptation to defect outweighs future market access; and a mere promise is "cheap talk" because Vance knows Julian's original rationality compels him to break it once the money is in hand. Only an intrinsic change in disposition provides the necessary causal guarantee.

  (d) **Unified Rational-Agent Reply:** A defender of unified agency might argue that rationality is always indexed to the agent's *current* mental states; therefore, at the moment of repayment, Julian is acting perfectly rationally according to his *current* preferences (avoiding shame). They would claim there is no "irrationality" here, only a predictable evolution of preferences, and that the "original self" has no normative authority to judge the "later self" as irrational once the psychological change has occurred.

  **Structural Assumption Pressured:**
  The case most directly pressures the assumption of **Preference Stability**—the notion that a rational agent must maintain a consistent utility function over time to be considered a single, coherent locus of rationality.
