      *   **Task:** Construct a thought experiment where an agent deliberately makes themselves irrational (changes beliefs/preferences/dispositions) to secure a benefit, such that the later action is irrational by original standards but the earlier self-manipulation is rational by original standards.
      *   **Constraints:** Realistic, ordinary-life scenario (no bandits, lie detectors, sci-fi). One paragraph for the scenario.
      *   **Analysis Components:**
          *   (a) Why the later action is irrational *at the time*.
          *   (b) Why the earlier decision is rational *at the time*.
