answer: |-
  You have hit on one of the most frustrating and fascinating realities of aesthetics. Your observation is spot on: the debate over the definition of art is not progressing like a science. In physics, paradigms shift and old models are discarded. In the philosophy of art, the theories from the 1950s (Institutional Theory, Historical Definition, Aesthetic Functionalism) are still the main players, just with updated footnotes.

  To answer your question directly: **This is not a verbal dispute, nor is it purely about data. It is a *normative* disagreement disguised as a *descriptive* one, compounded by the fact that "art" is likely an "open concept."**

  Here is the diagnosis of the stalemate and the prognosis for whether it can be broken.

  ### 1. The Diagnosis: What kind of disagreement is this?

  You offered three options: verbal, data-based, or bedrock intuitions. The reality is a hybrid of all three, but weighted heavily toward the normative.

  **A. It is not merely verbal (Semantic)**
  If this were just a verbal dispute, we could solve it by stipulation. I could say, "By 'art,' I mean 'objects with aesthetic value,'" and you could say, "By 'art,' I mean 'objects displayed in a gallery,'" and we would agree we are talking about different things.
  But we don't do that. We fight over whether Duchamp's *Fountain* *really* is art. This suggests that "art" is an **honorific term**. To call something "art" is to grant it a certain status, protection, funding, and intellectual attention. The disagreement is about **gatekeeping**, not just dictionary definitions. When a theorist defines art, they are often arguing for what *ought* to be valued, not just describing what *is*.

  **B. It is a disagreement about "Extensional Adequacy" (The Data)**
  In philosophy, a good definition must match our intuitions about specific cases (the "extension" of the concept).
  *   **Theory A (Formalism):** Art requires form/beauty.
      *   *Data Point:* Duchamp's *Fountain*.
      *   *Result:* Theory A says "Not Art." Intuition says "Art." Theory A fails.
  *   **Theory B (Institutional):** Art is what the Artworld says is art.
      *   *Data Point:* A child's drawing in a museum.
      *   *Result:* Theory B says "Art." Intuition says "Wait, really?"
  The stalemate exists because every theory sacrifices some intuitions to save others. The "data" isn't objective facts; the data *is* the intuition itself. Since people have different intuitions (based on culture, education, temperament), they disagree on the data.

  **C. It is Bedrock Intuition (The "Wittgensteinian" Turn)**
  In 1956, the philosopher **Morris Weitz** wrote a paper called *"The Role of Theory in Aesthetics."* He argued that the stalemate is inevitable because **art is an "open concept."**
  Weitz applied Wittgenstein's idea of "family resemblances" to art. He argued that art has no necessary and sufficient conditions. Instead, new art is created by *breaking* the old rules.
  *   If you define art as "representation," photography breaks it.
  *   If you define art as "craft," Duchamp breaks it.
  *   If you define art as "novelty," AI art challenges it.
  Weitz argued that seeking a closed definition is actually **anti-art**, because it limits what artists can do in the future. The stalemate isn't a failure of philosophy; it's a feature of the concept.

  ### 2. Why the Stalemate Persists

  The reason nobody budges is that the competing theories are answering different questions while pretending to answer the same one.

  1.  **The Aesthetic Theorist** is asking: "What provides a profound sensory experience?"
  2.  **The Expression Theorist** is asking: "What communicates human emotion?"
  3.  **The Institutional Theorist (Dickie/Danto)** is asking: "What functions socially as art within our current cultural framework?"

  They aren't talking past each other exactly; they are prioritizing different *functions* of art. The Institutional theorist knows *Fountain* isn't beautiful, but they care about its *status*. The Aesthetic theorist knows *Fountain* is in a museum, but they care about its *experience*. They are talking about the same word, but they value different aspects of the phenomenon.

  ### 3. Can the Stalemate Be Broken?

  If your goal is a single, timeless, necessary-and-sufficient definition (like H₂O is to water), then **yes, the project is doomed.**

  However, if you change the goal, there are ways out of the circle.

  **Option A: Accept Historical Definitions (The Levinson/Danto Move)**
  Jerold Levinson and Arthur Danto argued that art is defined **historically**. Something is art if it relates in the right way to *past* art.
  *   *Why it helps:* It explains Duchamp. *Fountain* is art because it references the tradition of art while challenging it. It requires a history to rebel against.
  *   *The Catch:* It makes art circular (Art is what relates to Art) and makes it hard for "first art" (what made the first cave painting art?) to exist.

  **Option B: Cluster Concepts (Berys Gaut)**
  Instead of looking for one condition, we look for a cluster. To be art, an object needs to possess *some* of these properties (beauty, expression, complexity, institutional acceptance, etc.), but no single one is required.
  *   *Why it helps:* It accommodates the messiness.
  *   *The Catch:* It's vague. How many properties are enough? It doesn't give a sharp boundary.

  **Option C: Pluralism (The "Let It Go" Approach)**
  This is the most mature philosophical position. We accept that "Art" is used in different contexts for different purposes.
  *   **Legal Art:** What qualifies for tax exemptions? (Defined by government).
  *   **Sociological Art:** What do galleries display? (Defined by institutions).
  *   **Aesthetic Art:** What provides deep experience? (Defined by phenomenology).
  When a philosopher says "This is not art," they usually mean "This is not *good* art" or "This is not *aesthetic* art." If we separate the **classification** (is it in the museum?) from the **evaluation** (is it good?), the tension eases.

  ### The Verdict

  The debate is stuck because it is trying to solve a **normative** problem (what should we value?) with a **descriptive** tool (a definition).

  *   **Is it verbal?** No, because the stakes are real (money, prestige, culture).
  *   **Is it about data?** Yes, but the data is subjective intuition.
  *   **Is it bedrock?** Yes, because "art" is an open concept that evolves faster than definitions can capture.

  **Is there a way out?**
  Only by admitting that "What is art?" is the wrong question. The better questions are:
  1.  "Under what conditions do we *treat* something as art?" (Sociological)
  2.  "Why does it matter if we call this art?" (Normative)
  3.  "How does this object function in a historical tradition?" (Historical)

  The stalemate won't break because the philosophers aren't trying to break it; they are trying to protect their specific intuition about what matters most in human culture. The value of your class wasn't finding the answer; it was realizing that the *struggle* to define it is actually the engine that drives art history forward. Every time a definition is solidified, an artist comes along to break it, and the philosophers have to start over. That isn't a bug; it's the ecosystem.
