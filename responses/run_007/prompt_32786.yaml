  I'm in a political theory course and we've been reading Kant's Perpetual Peace. The instructor keeps saying the post-1945 international order — the UN Charter, the human rights regime, the spread of constitutional democracies — is basically Kant's foedus pacificum with better PR. I want to test that against the actual institution, not the brochure. Take the founding and early operation of the United Nations as the episode, and analyze it through Kants scheme: the preliminary articles (peace treaties with secret reservations for future war are invalid, standing armies should eventually be abolished, no state may forcibly interfere in another's constitution, no acts of war that make future mutual trust impossible, and so on), the definitive articles (a republican civil constitution in every state, a federation of free states rather than a world state, and cosmopolitan right limited to universal hospitality), plus his claim that peace is not a natural condition but something that has to be actively established. For each piece, say whether the UN system realizes it, approximates it, or quietly contradicts it — the Security Council veto, the membership including plenty of non-republics, the Genocide Convention, the treatment of refugees, whatever you think are the right test cases. Then give me a committed verdict: does the UN episode vindicate Kant's bet about how peace gets institutionalized, refute it, or show that the institution was never a serious attempt at the foedus in the first place? And say what the episode does to the democratic peace thesis, if anything. I want you to actually pick a side and defend it, not lay out the options and hand them back to me.
