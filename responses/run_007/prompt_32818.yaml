      *   *Consistency:* $H$ says they process it, but the *motor/output* pathway is blocked. So no P300 is consistent.
      *   *Disconfirmation:* However, $H$ suggests that if deep processing occurs, we *usually* see *some* electrical signature (like an N400). The absence of P300 is fine, but the *specific pattern* of silence in $E$ is unlikely under $H$ compared to the Standard Model ($T$) which says "No processing = No signal."
      *   *Refinement:* This is getting close. Let's make it about **parameter values**.

      *   *Final Choice:* **Cosmology/Astrophysics is too abstract. Genetics is good.**
      *   *Let's go with Population Genetics.*
      *   **Evidence ($E$):** A 2011 census of a specific isolated island bird population. Allele Frequency of Gene G is 0.50 (exactly balanced).
      *   **Background ($T$):** Hardy-Weinberg Equilibrium + Drift. Explains 0.50 as a stable point or coincidence.
      *   **New Hypothesis ($H$):** A 2024 proposal of "Frequency-Dependent Selection."
