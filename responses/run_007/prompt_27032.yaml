          *   Expectations/Disappointment (Scanlon).
          *   Voluntary Transfer of Right/Assurance (Rights-based/Relational).
      *   **Key Scenes:** The Trial Scene (Bond) and the Ring Scenes (Belmont).
      *   **Core Questions:**
          *   What theory of promising does the play dramatize?
          *   Where does binding force come from (words, expectations, relationships/virtue)?
          *   Does a monstrous promise bind? (Void ab initio vs. enforced then evaded).
          *   How does the ring subplot fit? (Counterexample or comic relief?)
      *   **Constraint:** No bibliography/citations. Careful reading taking both philosophy and play seriously. Willingness to say when the play resists the theory.

  2.  **Deconstruct the Play's Treatment of Promises:**

      *   **The Bond (Shylock/Antonio):**
          *   *Nature:* Legal contract, voluntary, explicit words.
          *   *Venetian View:* It *must* be binding, or trade collapses (Hume/Rawls angle). The Duke says he can't deny the course of law.
          *   *Shylock's View:* It's his right, his humor, his revenge. He insists on the *letter* (words).
          *   *Portia's Resolution:* She doesn't say "This is immoral so it's void." She says "It binds, *but*..." (Hyper-literalism). She upholds the sanctity of the bond to trap Shylock.
          *   *Implication:* The play seems to support a strict formalist view *until* it conflicts with a higher law (Christian mercy/Natural law), but even then, it uses legalistic trickery rather than moral nullification.

      *   **The Rings (Portia/Bassanio, Gratiano/Nerissa):**
          *   *Nature:* Romantic vow, symbolic, seemingly absolute ("never part with it").
          *   *Violation:* Bassanio gives it to the "lawyer" (Portia in disguise).
          *   *Resolution:* Revealed as a test/joke. Forgiveness is immediate upon revelation.
          *   *Implication:* Promises here are subordinate to the relationship/truth behind them. The *intent* matters more than the *word*.

  3.  **Map to Philosophical Theories:**

      *   **Convention/Practice (Hume/Rawls):** Venice runs on this. If bonds aren't kept, commerce dies. The Duke fears the precedent. The play validates this *structurally* but questions it *morally*.
      *   **Expectations (Scanlon):** Shylock relies on Antonio's expectation of death? No, Shylock relies on his *own* expectation of revenge. Antonio expects to die. But Portia disrupts the expectation. The Ring subplot is pure Scanlon: Bassanio creates an expectation of fidelity regarding the ring, disappoints Portia, but the "principle of fidelity" is waived because the context changed (she was the lawyer).
      *   **Voluntary Transfer/Assurance:** Shylock argues he bought a right. Portia agrees he has the right, just not the blood. This suggests the *transfer* happened, but the *object* was impossible/illegal.
      *   **Virtue/Mercy:** Portia's "Quality of Mercy" speech argues that obligation isn't just about law/words; it's about a higher divine/relational standard. This resists the purely secular contract theories.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the richness of the pairing. State the thesis: The play doesn't pick one theory but stages a conflict between *Legal Formalism* (Venice) and *Relational Intent* (Belmont), ultimately suggesting that promissory force depends on the *community of value* in which the promise is made.
      *   **The Bond (Venice):** Focus on the "Practice" theory. Venice is a trade hub. The bond *must* hold for the system to work. Shylock is the ultimate formalist. Portia's trick isn't to void the promise but to enforce it so strictly it breaks. *Key Point:* The play suggests a promise to do something monstrous *does* bind in a legal sense, but the law contains internal escape hatches (impossibility/technicality) rather than moral overrides.
      *   **Mercy vs. Obligation:** Address the "Quality of Mercy." This is the resistance to theory. Mercy is supererogatory (beyond obligation). The play argues strict obligation is insufficient for human flourishing.
      *   **The Rings (Belmont):** Contrast with the bond. Here, the promise is symbolic. Breaking it is a breach of trust, but the *intent* (saving Antonio) justifies the breach. This aligns more with a relational/expectation view where the *purpose* of the promise trumps the *words*.
      *   **Synthesis/Conflict:** Where does the play resist the theories?
          *   It resists Scanlon: Bassanio disappoints Portia, but it's not treated as a deep moral wrong, just a comic misunderstanding.
          *   It resists Hume: The social practice of Venice is shown to be cold and potentially cruel.
          *   It resists Rights Transfer: Shylock loses his right not because he didn't have it, but because of his identity/religion (the alien statute).
      *   **Conclusion:** The play dramatizes the *danger* of isolating promissory obligation from human context.

