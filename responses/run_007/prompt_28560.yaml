  # JOINT STATEMENT ON HARSANYI'S AGGREGATION THEOREM

  **Signatories:**
  *   **Proponent:** A proponent of Harsanyi-style Rule Utilitarianism.
  *   **Critic:** A proponent of Prioritarian/Egalitarian social ethics.

  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Normative Implications of Social Choice Theory

  ## PART I: AGREED CLAIMS

  We, the undersigned, having engaged in good-faith dialogue regarding John Harsanyi's Aggregation Theorem, agree upon the following technical and philosophical claims. These claims delineate the logical boundaries of the theorem and distinguish mathematical necessity from normative interpretation.

  1.  **The Logical Core of the Theorem:** Harsanyi's Aggregation Theorem proves that if (a) every individual's preferences satisfy the von Neumann–Morgenstern (vNM) axioms, (b) the social preference relation satisfies the vNM axioms, and (c) the social preference satisfies Pareto Indifference (if all individuals are indifferent between two lotteries, society is indifferent), then the social utility function $W$ is an affine transformation of a weighted sum of individual utility functions: $W = \sum a_i U_i + b$.
      *   *Philosophical Import:* This is a representation theorem, not a moral proof. It establishes a structural relationship between preferences that satisfy specific consistency conditions; it does not, on its own, validate those conditions as morally binding.

  2.  **The Limits of vNM Representation:** The vNM representation theorem establishes that if an agent's preferences satisfy completeness, transitivity, continuity, and independence, those preferences can be represented by a utility function unique up to a positive affine transformation (scaling and shifting).
      *   *Philosophical Import:* vNM utility measures the *intensity of preference* regarding risk, not necessarily the *magnitude of well-being*. A higher vNM utility indicates a preferred outcome, but the difference between utilities does not inherently represent a morally significant difference in welfare without further assumptions.

  3.  **The Role of Pareto Indifference:** Pareto Indifference requires that if every individual assigns the same expected utility to lottery $L_1$ and lottery $L_2$, the social evaluator must also be indifferent.
      *   *Philosophical Import:* This condition respects individual sovereignty over self-regarding preferences but remains silent on how to resolve conflicts of interest. It rules out social preferences that contradict unanimous individual agreement but does not dictate how to trade off one person's gain against another's loss.

  4.  **Silence on Interpersonal Comparability:** The theorem treats individual utility functions $U_i$ as given inputs. Because each $U_i$ is unique only up to an affine transformation, the equation $W = \sum a_i U_i$ is mathematically indeterminate unless the scales and zero-points of the $U_i$ are fixed relative to one another.
      *   *Philosophical Import:* The theorem does not solve the problem of interpersonal comparison of utility (ICU). To use the theorem for policy, one must adopt a separate normative or empirical methodology to calibrate the scales (e.g., deciding what counts as a "unit" of utility for Person A vs. Person B).

  5.  **Silence on Weight Determination:** The theorem guarantees the existence of weights $a_i$, and Strong Pareto implies $a_i \geq 0$ (with at least one $a_i > 0$). However, the theorem does not derive the specific values of these weights from the axioms alone.
      *   *Philosophical Import:* The theorem does not prove that weights must be equal. A society could satisfy the theorem while assigning vastly different moral weights to different individuals, provided their preferences remain consistent. Egalitarianism requires an argument external to the aggregation theorem to justify equal weights.

  6.  **The Normative Status of Social Rationality:** The theorem *assumes* that the social preference relation satisfies the vNM axioms (including Independence). It does not prove that a social evaluator *ought* to satisfy these axioms.
      *   *Philosophical Import:* Whether a collective entity (the state, the moral observer) is the sort of thing that can or should be "rational" in the vNM sense is a philosophical question, not a mathematical one. The theorem shows what follows *if* society is vNM-rational, not *that* society must be.

  ***

  ## PART II: DISAGREEMENTS TABLE

  While we agree on the logic above, we disagree on the normative implications drawn from it. The following table isolates our residual disagreements, the cruxes separating us, and the concrete cases that test those cruxes.

  | Issue | Proponent's Claim (Harsanyi-Utilitarian) | Critic's Claim (Prioritarian/Egalitarian) | The Crux | Concrete Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Social Independence Axiom** | The Independence axiom is a requirement of rationality for any agent, including a social evaluator. If society prefers $A$ to $B$, it must prefer a lottery $pA + (1-p)C$ to $pB + (1-p)C$. To violate this is to allow irrelevant alternatives to dictate moral value, leading to dynamic inconsistency and money-pump vulnerabilities. | The Independence axiom is a consistency condition for *individual* preference under risk, not a normative requirement for *social* justice. A social evaluator may rationally violate Independence to account for ex-ante fairness or the distribution of chances, which are morally relevant features ignored by expected utility summation. | **Is "rationality" for a social evaluator purely procedural (consistency) or does it include substantive values (fairness) that may conflict with consistency?** | **Case:** A single benefit is available for Person A or Person B. Society is indifferent between giving it to A (Certain) or B (Certain). <br><br>**Option 1:** Give to A (Certain).<br>**Option 2:** Fair Lottery (50% A, 50% B).<br><br>**Proponent Prediction:** If Society is indifferent between "Give A" and "Give B", Independence requires Society be indifferent between "Give A" and the "Lottery" (since the Lottery is a probabilistic mix of the two indifferent outcomes). Preferring the Lottery violates Independence and is irrational.<br><br>**Critic Prediction:** Society can strictly prefer the Lottery. This expresses a value for *ex-ante equality of opportunity* that is not captured in the final outcomes. This preference is rational and moral, proving Independence is not a binding social norm. |
  | **2. Interpersonal Comparability & Weights** | The "Impartial Observer" argument supplements the theorem to derive weights. If a rational observer behind a veil of ignorance (equal probability of being anyone) maximizes expected utility, they must assign equal weights to all individuals. Thus, comparability and equal weights are derived from rationality + empathy, not presupposed. | The Impartial Observer construction presupposes the very comparability it claims to derive. To calculate expected utility behind the veil, one must already assume that "utility units" are comparable across identities. The theorem takes the $U_i$ functions as inputs; it does not generate the scale required to sum them meaningfully. | **Does the framework *derive* the metric for interpersonal comparison, or does it *smuggle it in* as a precondition for the math to work?** | **Case:** Two individuals have identical preferences but different scales. $U_1(x) = x$, $U_2(x) = 10x$. <br><br>**Proponent Prediction:** Rational constraints on the Impartial Observer (e.g., acceptance of objective probabilities of identity) force the normalization of these scales. The observer would not treat $U_2$'s units as ten times more valuable simply due to scaling; rationality dictates equal weighting of *persons*, not *utility units*.<br><br>**Critic Prediction:** The math alone cannot distinguish between "Person 2 feels 10x stronger" and "Person 2's scale is arbitrarily larger." Choosing to normalize them requires a prior normative commitment to egalitarianism. The theorem is silent on this; the moral work is done by the commitment, not the theorem. |
  | **3. The Nature of Social Preference** | Social preference is the aggregation of individual rational preferences. If individuals are vNM rational, and we respect Pareto, the social preference *must* look like weighted utilitarianism. Any other form (e.g., prioritarianism) violates Pareto or Independence. | Social preference is a distinct normative construct that evaluates *states of affairs*, not just the satisfaction of preferences. Prioritarianism (weighting gains to the worse off more heavily) can satisfy Pareto but violates Independence. This is a feature, not a bug, as it captures the diminishing moral value of utility. | **Is the social welfare function a mirror of individual preference structure, or an independent moral metric that assesses distributions?** | **Case:** A policy gives +10 utility to a well-off person vs. +10 utility to a worse-off person.<br><br>**Proponent Prediction:** If individuals are risk-neutral over their own utility, society should be indifferent. Prioritizing the worse-off implies a social risk-aversion that contradicts the individuals' own risk profiles (violating the spirit of Pareto).<br><br>**Critic Prediction:** Society is right to prefer helping the worse-off. This reflects "social risk aversion" which is morally distinct from individual risk aversion. The theorem forces us to ignore this moral distinction if we accept its axioms. |

  ***

  ## PART III: NOTE ON VERBAL VS. SUBSTANTIVE DISAGREEMENTS

  Upon review, we identify that some portion of our disagreement is **verbal**, specifically regarding the definition of "rationality." The Proponent uses "rational" to mean *internally consistent according to vNM axioms*. The Critic uses "rational" to mean *responsive to all relevant moral reasons*, including fairness. If we agree to distinguish *consistency* from *normative correctness*, we can agree that the social evaluator might be "consistent" (vNM compliant) or "morally correct" (prioritarian), but not necessarily both.

  However, the core disagreements are **substantive**. Specifically:
  1.  **The Normative Force of Independence:** Even if we clarify terms, we disagree on whether a social evaluator *should* satisfy the Independence axiom. The Critic believes fairness sometimes requires violating it; the Proponent believes violating it leads to unacceptable irrationality in policy selection.
  2.  **The Source of Weights:** We disagree on whether the Impartial Observer device solves the scaling problem. The Proponent believes rationality constraints fix the weights; the Critic believes this relies on a hidden normative premise.

  **Movement:** If the crux regarding **Independence** were settled (e.g., if it were proven that violating Independence leads to dynamically inconsistent social policies that harm everyone), the Critic would have to abandon standard Prioritarianism in favor of a form of Utilitarianism that accounts for fairness within the utility function. Conversely, if the Proponent accepted that social choice allows for distribution-sensitive violations of Independence, the Aggregation Theorem would cease to be a proof of Utilitarianism, moving the Proponent toward a pluralistic view. Until then, the theorem remains a conditional tool: it tells us what follows *if* we accept its axioms, but not *that* we must.
