prompt: |-
  In my just war theory seminar people keep invoking the moral equality of combatants as if it settles things, but it gets used to shut down different arguments. Most recently someone used it to dismiss the claim that a soldier fighting for an unjust cause is doing something wrong just by fighting. I can see there's a legal convention (jus in bello treats both sides symmetrically), but people seem to mean something moral by it, and I can't tell what. Can you lay out the distinct precise claims that slogan could be making — legal equality versus moral equality, equal liability to attack versus equal permissibility versus equal blameworthiness, an epistemic claim about what soldiers can know, an excuse-based claim — and for each say whether it's plausible and whether it actually get's you the conclusion that the unjust-side soldier isn't doing wrong? I want a menu of readings, not just one, because the guy in my seminar is definitely running one particular reading and I suspect it's the weakest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A Just War Theory (JWT) seminar.
      *   **Problem:** Peers are invoking "Moral Equality of Combatants" (MEC) to shut down arguments, specifically the claim that soldiers fighting for an unjust cause are doing something wrong *just by fighting*.
      *   **Observation:** The user distinguishes between legal convention (*jus in bello* symmetry) and something "moral," but is unsure what the moral claim entails.
      *   **Task:** Lay out distinct, precise claims hidden under the "MEC" slogan.
      *   **Specific Categories to Cover:** Legal vs. Moral, Equal Liability vs. Equal Permissibility vs. Equal Blameworthiness, Epistemic Claims, Excuse-based Claims.
      *   **Evaluation:** For each claim, assess plausibility and whether it actually supports the conclusion that the unjust-side soldier *isn't doing wrong*.
      *   **Goal:** Provide a "menu of readings" so the user can identify which specific argument their seminar peer is making (and potentially critique it).

  2.  **Deconstruct "Moral Equality of Combatants" (MEC):**
      *   *Origin:* Michael Walzer is the big name here (*Just and Unjust Wars*). He argues for symmetry in *jus in bello* regardless of *jus ad bellum*.
      *   *Revisionist Critique:* Jeff McMahan (*Killing in War*) is the primary critic. He argues MEC is false morally, even if useful legally.
      *   *The Core Tension:* If I'm fighting an unjust war, am I morally permitted to kill enemy soldiers who are fighting a just war? Walzer says yes (mostly). McMahan says no (they are liable, I am not).

  3.  **Drafting the Menu of Readings (Iterative Process):**

      *   *Reading 1: The Legal/Conventional Claim.*
          *   Content: International Humanitarian Law (IHL) treats combatants equally.
          *   Plausibility: True as a matter of law.
          *   Does it prove moral innocence? No. Law $\neq$ Morality. (Nuremberg defense issue).
          *   *Refinement:* Make sure to distinguish this clearly as the "Walzerian Conventionalism" vs. "Revisionism" debate.

      *   *Reading 2: Equal Liability to Attack.*
          *   Content: Both sides can be legitimately targeted.
          *   Plausibility: Controversial. Revisionists say unjust combatants aren't liable because they aren't threatening unjustly (or are excused). Traditionalists say they are liable because they are threats.
          *   Does it prove moral innocence? No. You can be liable to be killed even if you aren't morally blameworthy (e.g., innocent threats), OR you can be liable because you are doing wrong. Actually, if I am liable, it usually implies I've done something to forfeit rights. But the claim is usually "Both are *equally* liable."
          *   *Correction:* The user wants to know if it proves the soldier *isn't doing wrong*. If I am liable to be killed, does that mean my killing isn't wrong? Not necessarily. But MEC usually implies "It is permissible for the enemy to kill me."
          *   *Focus:* Does "Equal Liability" mean "Equal Wrongdoing"? No.

      *   *Reading 3: Equal Permissibility (The Action-Guiding Claim).*
          *   Content: It is morally permissible for *both* sides to shoot at each other.
          *   Plausibility: This is the strong Walzerian claim. Revisionists deny this.
          *   Does it prove the soldier isn't doing wrong? Yes, if true. If it's permissible, it's not wrong.
          *   *Critique:* This is the most controversial moral claim. It requires severing *ad bellum* from *in bello*.

      *   *Reading 4: Equal Blameworthiness (The Culpability Claim).*
          *   Content: Soldiers on both sides are equally praiseworthy/blameworthy.
          *   Plausibility: Low. Intuitively, defending your country vs. invading seems different.
          *   Does it prove the soldier isn't doing wrong? No. They could be *equally* blameworthy (both doing wrong). Or equally innocent.
          *   *Nuance:* Usually, MEC proponents don't claim equal *blame*, they claim equal *status*.

      *   *Reading 5: The Epistemic Claim (Invincible Ignorance).*
          *   Content: Soldiers can't know if their war is just.
          *   Plausibility: High for rank-and-file, lower for officers.
          *   Does it prove the soldier isn't doing wrong? It proves they might be *excused*, not that the act is *permissible*. (Objective wrong vs. Subjective blame).
          *   *Key Distinction:* Objective permissibility vs. Subjective culpability.

      *   *Reading 6: The Excuse-Based Claim (Duress/Coercion).*
          *   Content: Soldiers are coerced (conscription, social pressure, prison).
          *   Plausibility: Varies by regime.
          *   Does it prove the soldier isn't doing wrong? No, it proves they aren't *blameworthy* for the wrong. The act remains objectively wrong.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that "MEC" is often a conversation-stopper that conflates distinct issues. Mention Walzer vs. McMahan as the theoretical backdrop.
      *   **The Menu (The Core):** Use clear headings for each "Reading."
          *   *Claim:* What is it?
          *   *Plausibility:* Is it defensible?
          *   *Does it work?* Does it prove the soldier isn't doing wrong?
      *   **Synthesis/Strategy:** How to use this in the seminar. Identify the "Is/Ought" gap and the "Permissibility/Blame" gap.
      *   **Conclusion:** Encouragement.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address "Equal Liability"?
      *   *Adjustment:* Make sure to explain that liability is about the *target's* rights, not the *shooter's* morality. If unjust combatants are liable, it doesn't mean shooting is permissible for them.
      *   *Check:* Did I distinguish Legal vs. Moral clearly?
      *   *Adjustment:* Emphasize that Legal Equality is a pragmatic convention, not a moral truth.
      *   *Check:* The user specifically asked about the claim "soldier... is doing something wrong just by fighting."
      *   *Adjustment:* Ensure every section answers: "Does this reading defeat the claim that fighting is objectively wrong?"

  6.  **Final Polish:**
      *   Tone: Academic but accessible, empathetic to the seminar frustration.
      *   Terminology: Use standard JWT terms (*jus ad bellum*, *jus in bello*, liability, culpability, epistemic limitations).
      *   Formatting: Bold key terms, use bullet points for readability.

  7.  **Final Review against constraints:**
      *   Menu of readings? Yes.
      *   Legal vs. Moral? Yes.
      *   Liability/Permissibility/Blameworthiness? Yes.
      *   Epistemic/Excuse? Yes.
      *   Plausibility + Conclusion check for each? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a classic friction point in contemporary Just War Theory (JWT). You are encountering the clash between **Traditionalism** (largely associated with Michael Walzer) and **Revisionism** (largely associated with Jeff McMahan).

  The slogan "Moral Equality of Combatants" (MEC) is often used as a trump card, but it is conceptually slippery. It conflates the status of the soldier as a *target* with the status of the soldier as an *agent*.

  Here is a menu of six distinct readings of what your seminar peer might mean by MEC. For each, I have broken down the claim, its plausibility, and crucially, whether it actually supports the conclusion that the unjust-side soldier is **not doing something wrong**.

  ---

  ### 1. The Legal-Conventional Claim
  *   **The Claim:** International Humanitarian Law (IHL) and the laws of armed conflict treat combatants symmetrically. A soldier is a legitimate target regardless of which side they fight for, and they commit no war crime simply by shooting at enemy combatants.
  *   **Plausibility:** **High (as a matter of fact).** This is how the Geneva Conventions work. It is a pragmatic convention designed to limit war's horrors by separating *jus in bello* (conduct in war) from *jus ad bellum* (justice of war).
  *   **Does it prove the soldier isn't doing wrong?** **No.**
      *   **Why:** Legal permissibility does not entail moral permissibility. If it did, there could be no such thing as an unjust war crime. A soldier might be legally immune from prosecution but still morally complicit in aggression. This reading changes the subject from morality to positive law.

  ### 2. The Equal Liability Claim
  *   **The Claim:** Combatants on both sides are equally **liable to be attacked**. By putting on a uniform and carrying a weapon, both the just and unjust soldier forfeit their right not to be killed.
  *   **Plausibility:** **Contested.** Traditionalists say yes (you are a threat). Revisionists say no (unjust combatants are not liable because they are not threatening *unjustly*; or, just combatants are not liable because they are acting in self/other-defense).
  *   **Does it prove the soldier isn't doing wrong?** **No.**
      *   **Why:** Liability is about the *target's* rights, not the *shooter's* morality. Even if an unjust soldier is liable to be killed (i.e., it is permissible for the just enemy to shoot them), it does not follow that it is permissible for the *unjust soldier* to shoot back. I can be liable to be harmed without having the right to harm you in return (e.g., an innocent aggressor).

  ### 3. The Equal Permissibility Claim (Strong MEC)
  *   **The Claim:** It is objectively morally permissible for soldiers on both sides to use lethal force against one another. The justice of the cause (*ad bellum*) does not infect the morality of the fighting (*in bello*).
  *   **Plausibility:** **Low (Philosophically).** This is the hardest claim to defend. It requires arguing that a soldier fighting for genocide has the same moral right to kill as a soldier stopping genocide. Most revisionists argue this is incoherent; you cannot have a right to kill in service of an unjust end.
  *   **Does it prove the soldier isn't doing wrong?** **Yes (if true).**
      *   **Why:** If the act is objectively permissible, then by definition the soldier is not doing wrong. However, this is the most vulnerable claim in your seminar. If your peer is relying on this, they need to explain how *ad bellum* injustice magically disappears once shooting starts.

  ### 4. The Epistemic Claim (Invincible Ignorance)
  *   **The Claim:** Individual soldiers cannot reasonably be expected to know whether their war is just. The information is classified, the propaganda is thick, and the decision-making is remote. Therefore, we must treat them *as if* they are equal because they don't know better.
  *   **Plausibility:** **High (for rank-and-file).** It is unreasonable to expect a private to conduct a geopolitical moral audit before following orders.
  *   **Does it prove the soldier isn't doing wrong?** **No.**
      *   **Why:** This confuses **objective wrongness** with **subjective blame**.
      *   *Analogy:* If I give you a glass of water that I secretly poisoned, you do me no wrong by drinking it (you didn't know). But if *I* drink the poisoned water thinking it's safe, I am still doing something objectively harmful, even if I am not blameworthy.
      *   This claim shows the soldier is not *culpable*, not that the act of fighting is *permissible*.

  ### 5. The Excuse-Based Claim (Duress/Coercion)
  *   **The Claim:** Soldiers are under immense coercive pressure (conscription, threat of imprisonment, social ostracization, economic necessity). Therefore, they are excused for fighting even if the war is unjust.
  *   **Plausibility:** **Variable.** Depends on the regime. High for conscripts in totalitarian states; lower for volunteers in professional armies.
  *   **Does it prove the soldier isn't doing wrong?** **No.**
      *   **Why:** Like the Epistemic Claim, this is an **excuse**, not a **justification**.
      *   *Justification:* "What I did was right/permissible."
      *   *Excuse:* "What I did was wrong, but I shouldn't be punished/blamed for it."
      *   If your peer uses this, they are conceding that the soldier *is* doing something wrong, but arguing they shouldn't be held responsible for it.

  ### 6. The Functional/Role Obligation Claim
  *   **The Claim:** Soldiers have a specific professional duty to serve the state. Their moral obligation is to follow lawful orders and protect their comrades, not to adjudicate national policy. To demand they judge the war is to undermine the military function.
  *   **Plausibility:** **Moderate.** It appeals to the division of moral labor in society.
  *   **Does it prove the soldier isn't doing wrong?** **No.**
      *   **Why:** Role obligations cannot override fundamental moral prohibitions (the "Nuremberg Defense" problem). A soldier has a role obligation to follow orders, but not if the orders are manifestly immoral. If the war itself is manifestly aggressive, the role obligation dissolves.

  ---

  ### How to Use This in Seminar

  Your peer is likely conflating **Category 4 or 5 (Excuses/Epistemics)** with **Category 3 (Permissibility)**.

  **The Diagnostic Move:**
  Ask them: *"Are you arguing that the unjust soldier is **permitted** to kill (justification), or that they are **not blameworthy** for killing (excuse)?"*

  *   **If they say Permitted:** Push on **Reading #3**. Ask: *"Does a soldier invading a peaceful country have the same moral right to kill as the defender? If the cause is unjust, where does the right to kill come from?"*
  *   **If they say Not Blameworthy:** Push on **Reading #4 or #5**. Concede that they might not be *culpable*, but insist that this doesn't mean the act isn't *wrong*.
      *   *Script:* "I agree they might be excused due to ignorance or coercion. But an excuse admits the act is objectively wrong. So MEC doesn't settle the question of whether fighting is wrong; it only settles whether we should punish the soldier."

  **The "Shutdown" Counter:**
  When they say "MEC settles this," you can reply:
  > "MEC is a conclusion, not a premise. Walzer argues for it based on the separation of *ad bellum* and *in bello*, but McMahan and revisionists show that separation is morally untenable. You can't invoke MEC to prove the soldier isn't doing wrong, because whether MEC is true *depends* on whether the soldier is doing wrong."

  This forces them to defend the underlying moral architecture rather than hiding behind the slogan.
