answer: |-
  This is an excellent observation. The slogan "You can't just take someone else's word for it on moral questions" is the standard shorthand for **Moral Testimony Pessimism**, but as you've noticed, it conflates psychological, normative, and epistemic distinct claims. In the literature (e.g., work by Alison Hills, Paul Bloomfield, Sarah McGrath, and Robert Hopkins), this ambiguity is often the source of stalemates.

  To help you structure your next class session, here is a taxonomy of five distinct interpretations of that slogan, arranged from the most modest (psychological) to the most ambitious (metaphysical/epistemic). For each, I evaluate its plausibility and whether it succeeds in showing that moral testimony is *epistemically defective* in a way ordinary testimony is not.

  ---

  ### 1. The Psychological Claim (Descriptive)
  **The Thesis:** Human beings are psychologically incapable of forming sincere moral beliefs solely on the basis of testimony. We are wired to demand independent access to the reasons.
  *   **Plausibility:** **Low.** Empirical observation suggests people do this constantly (e.g., children believing hitting is wrong because parents say so; religious adherents adopting moral codes from authorities). While they might *feel* like they understand the reasons, the belief formation is often deferential.
  *   **Epistemic Defect?** **No.** Even if this were true, it would be a fact about our cognitive architecture, not a normative rule about justification. Furthermore, it doesn't distinguish moral testimony from complex scientific testimony (most of us believe "quantum entanglement exists" solely on testimony, despite not understanding the math).
  *   **Verdict:** This reading makes the slogan empirically false and philosophically uninteresting.

  ### 2. The Agency Claim (Normative/Moral Worth)
  **The Thesis:** Acting on moral testimony deprives an action of **moral worth**. To be a virtuous agent, one must act from one's own understanding of the right-making features, not merely from deference.
  *   **Plausibility:** **Moderate/High.** This is a Kantian intuition. If you don't steal only because your guru told you not to, you lack moral autonomy. You are a "moral follower," not a moral agent.
  *   **Epistemic Defect?** **No.** This claim is about *action* and *character*, not *belief* or *knowledge*. One could theoretically *know* the truth via testimony (epistemically sound) but fail to get credit for the action (morally deficient).
  *   **Verdict:** This supports the idea that moral deference is *practically* or *virtuously* defective, but it does not support the claim that it is *epistemically* defective. It fails to distinguish moral testimony from, say, a doctor following a specialist's protocol without understanding the biochemistry (which is often prudent, not vicious).

  ### 3. The Understanding Claim (Epistemic Value)
  **The Thesis:** Moral testimony can transmit true belief, but it cannot transmit **moral understanding**. In the moral domain, understanding (grasping *why* something is right) is required for full moral competence, whereas in ordinary domains, mere knowledge (knowing *that* something is true) is often sufficient.
  *   **Plausibility:** **High.** This is Alison Hills' prominent view. There is a strong intuition that moral maturity requires grasping reasons.
  *   **Epistemic Defect?** **Nuanced.** It admits testimony provides *justification* and *knowledge*, but argues it provides an inferior epistemic good (belief without understanding).
  *   **Comparison to Ordinary Testimony:** This is the sticky point. In history or geography, mere knowledge is fine. In science, we also value understanding. The pessimist must argue that moral understanding is *more* essential to the domain than scientific understanding is to science.
  *   **Verdict:** This is a strong candidate for what the student meant. It concedes testimony works but argues it is inadequate for the specific demands of the moral domain.

  ### 4. The "No Knowledge" Claim (Strong Pessimism)
  **The Thesis:** Moral testimony cannot transmit **knowledge** at all. Even if the testifier knows the truth and is trustworthy, the recipient does not acquire knowledge, only true belief.
  *   **Plausibility:** **Controversial/Low.** This requires a specific mechanism for why moral knowledge is "sticky." Proponents (like McGrath) argue that moral knowledge requires a sensitivity to reasons that testimony bypasses.
  *   **Epistemic Defect?** **Yes.** This asserts a genuine epistemic defect.
  *   **Comparison to Ordinary Testimony:** This creates a sharp discontinuity. In ordinary cases (e.g., "The meeting is at 4 PM"), testimony generates knowledge. In moral cases, it does not.
  *   **Verdict:** This is the most ambitious claim. It is hard to defend without a robust theory of why moral properties are inaccessible via testimony (e.g., a specific kind of non-naturalism or sentimentalism). If the student holds this, they need to explain *why* moral knowledge is harder to transmit than mathematical knowledge (where we also rely on testimony).

  ### 5. The "Defeater" Claim (Contextual Pessimism)
  **The Thesis:** The fact that a belief is based on testimony acts as a **defeater** for moral beliefs in a way it does not for empirical beliefs. You are permitted to believe on testimony *unless* you realize it is testimony, at which point you lose justification.
  *   **Plausibility:** **Moderate.** This captures the feeling of "shame" or "hesitation" when caught deferring on morals.
  *   **Epistemic Defect?** **Yes.** It suggests the *source* of the belief undermines the belief's status specifically in ethics.
  *   **Comparison to Ordinary Testimony:** This claims a unique asymmetry. In law or medicine, "An expert told me" is a strengthener. In morals, "An expert told me" can be a weaken-er (implying you lack moral insight).
  *   **Verdict:** Plausible, but risks collapsing into Claim #3 (Understanding). Why is it a defeater? Usually because we think you ought to have understood the reasons yourself.

  ---

  ### Strategic Analysis for Your Discussion

  When you return to class, you can use this taxonomy to diagnose the student's position. Here is a suggested approach:

  **1. Isolate the "Can't":**
  Ask the student: "When you say 'can't,' do you mean it is psychologically impossible, morally impermissible, or epistemically invalid?"
  *   If **Psychologically**: Point out that children and adults do this constantly.
  *   If **Morally**: Concede that it might reduce moral worth (Claim #2), but ask if it makes the *belief* false or unjustified. (It doesn't).
  *   If **Epistemically**: Press them on Claim #4 vs. Claim #3.

  **2. The "Ordinary Matters" Challenge:**
  The slogan relies on the contrast with "ordinary empirical matters." You should press this comparison.
  *   *Ask:* "If I ask a physicist if climate change is real, and I believe them without checking the data, I have ordinary testimony. If I ask an ethicist if euthanasia is permissible, and I believe them without checking the arguments, why is the second epistemically defective but the first isn't?"
  *   *The Trap:* If they say "Because you need to understand the reasons in ethics," ask: "Don't citizens need to understand the reasons for voting on scientific policy? Don't we value understanding in history?"
  *   *The Goal:* Force them to articulate **why** the moral domain is unique. Is it because moral truths are motivationally internal? Is it because moral properties are non-natural? Without a metaphysical story, the epistemic claim looks like an intuition pump.

  **3. The "Triviality" Worry:**
  You mentioned the slogan might collapse into something uninteresting. This happens if the claim is simply: **"You shouldn't believe things without reasons."**
  *   If that is all they mean, then moral testimony is no different from scientific testimony. We shouldn't believe scientific claims without reasons either (though we often defer to experts who *have* the reasons).
  *   If they agree with this, then the slogan is true but doesn't prove moral testimony is *special*.
  *   If they insist moral testimony is *special*, they must defend Claim #4 or #5.

  ### Summary Table for Handout/Notes

  | Interpretation | Core Claim | Plausible? | Shows Epistemic Defect? | Distinguishes Moral from Empirical? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Psychological** | We can't mentally do it. | No (we do). | No. | No. |
  | **2. Agency** | It reduces moral worth. | Yes. | No (practical, not epistemic). | Maybe (moral action is special). |
  | **3. Understanding** | It blocks understanding. | Yes. | Partially (knowledge OK, understanding not). | Debatable (science values understanding too). |
  | **4. No Knowledge** | It blocks knowledge entirely. | Controversial. | Yes. | Yes (Strong asymmetry). |
  | **5. Defeater** | Awareness of deference kills justification. | Moderate. | Yes. | Yes. |

  **Recommendation:** The most philosophically fruitful reading is usually **#3 (The Understanding Claim)**. It acknowledges that we *can* learn moral truths from others (avoiding the absurdity of Claim #4) but maintains that there is a distinctive epistemic failing in relying *only* on testimony (preserving the student's intuition). However, you should challenge them to explain why this deficit is unique to morality and not present in complex empirical domains like medicine or law.
