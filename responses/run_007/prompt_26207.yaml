      *   *Refinement:* Ensure I mention key names in the literature (Hills, Hopkins, McGrath) so the user can look them up.
      *   *Refinement:* Make sure to address the "ordinary empirical matters" comparison for each.

  7.  **Final Polish:** Organize with clear headings. Use bold text for key distinctions. Ensure the "Verdict" for each is clear. (Proceed to generate output based on this structure).

  8.  *(Final thought before generating)*: The user mentioned the slogan might collapse into something "true but uninteresting." I should explicitly address the "Triviality" worry (e.g., "You shouldn't believe without reasons" applies to math and science too).

  9.  **Structure:**
      *   Intro: Validate the ambiguity.
      *   Taxonomy of Claims (1-5).
      *   For each: Definition, Plausibility, Epistemic Defect verdict.
      *   The "Comparison Problem" (Why moral vs. empirical?).
      *   Strategic advice for class.

