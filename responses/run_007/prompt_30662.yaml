answer: |-
  This is a classic move in everyday argumentation, often called "epistemic policing." Your roommate is invoking what philosophers call the **Norms of Assertion**. While it feels like a conversational trump card, the philosophical landscape behind it is nuanced.

  The phrase "you shouldn't assert what you don't know" is ambiguous. It can range from a trivial warning about lying to a heavy metaphysical claim about the nature of speech. Below is a breakdown of the specific claims hidden in that sentence, evaluated by plausibility, their ability to justify your roommate's move, and their status in the philosophical literature.

  ### 1. The Moral/Deceptive Reading ("Don't Lie")
  *   **The Claim:** You should not assert $P$ if you believe $P$ is false.
  *   **Plausibility:** **Trivial/High.** Almost everyone agrees lying is morally impermissible.
  *   **Does it support your roommate?** **No.** You admitted you thought the story was likely true based on a reliable source. You weren't lying; you were uncertain. This norm condemns deception, not uncertainty.
  *   **Literature Status:** **Settled.** This is the baseline. No serious philosopher argues you *should* lie.

  ### 2. The Gricean/Conversational Reading ("Don't Mislead")
  *   **The Claim:** By asserting $P$, you conversationally *implicate* that you know $P$. If you assert without knowing, you are misleading your listener about your epistemic state, even if $P$ turns out to be true.
  *   **Plausibility:** **High.** In standard conversation, if I say "The store is open," I imply I have good reason to believe that. If I'm just guessing, I am technically misleading you about how sure I am.
  *   **Does it support your roommate?** **Partially.** It justifies his criticism of your *manner* of speaking (you sounded too sure), but it does not prove the *content* of your claim is false. It suggests you should have used hedging language ("I heard that..." vs. "Here's what happened").
  *   **Literature Status:** **Settled (mostly).** Paul Grice's theory of conversational implicature is a cornerstone of pragmatics. It is widely accepted that assertion carries an implicature of knowledge or justification.

  ### 3. The Knowledge Norm of Assertion (KNA)
  *   **The Claim:** Knowledge is the **constitutive norm** of assertion. Just as you cannot make a "move" in chess that violates the rules, you cannot make a proper assertion without knowledge. To assert without knowledge is to violate the very definition of the act.
  *   **Plausibility:** **Contested.** This is the "philosophically heavy" version your roommate is likely channeling (associated with Timothy Williamson). It claims knowledge is the *only* thing that makes an assertion proper.
  *   **Does it support your roommate?** **Only if KNA is true.** If this norm holds, you acted improperly. However, even if you acted improperly, it doesn't mean the politician didn't do the thing. It only means you shouldn't have said it *yet*.
  *   **Literature Status:** **Highly Contested.**
      *   *Pro:* Explains why "I don't know" feels like a Moore's Paradox ("$P$, but I don't know $P$").
      *   *Con:* Critics (like Jennifer Lackey) argue that in some cases (e.g., a doctor advising a patient based on strong but non-conclusive evidence), assertion is proper even without strict "knowledge." Many argue for a **Justification Norm** instead (you need strong evidence, not necessarily knowledge).

  ### 4. The Certainty/Infallibility Reading ("Don't Guess")
  *   **The Claim:** You should not assert $P$ unless you are certain (infallible) about $P$.
  *   **Plausibility:** **Low.** This sets the bar too high. We assert things about the external world constantly without Cartesian certainty. If this were the rule, we would never be allowed to speak about politics, history, or science.
  *   **Does it support your roommate?** **No.** This is an unfair standard. If your roommate is invoking this, he is moving the goalposts to an impossible level of proof.
  *   **Literature Status:** **Rejected.** Very few contemporary epistemologists defend infallibilism as a requirement for ordinary assertion.

  ### 5. The Accountability/Responsibility Reading ("Back It Up")
  *   **The Claim:** When you assert $P$, you undertake a commitment to defend $P$ or compensate others if $P$ is false. If you can't verify it, you are taking a risk you shouldn't take with someone else's beliefs.
  *   **Plausibility:** **High.** This is a social/ethical norm. Asserting makes you responsible for the information's spread.
  *   **Does it support your roommate?** **Yes, pragmatically.** He is warning you that you are taking responsibility for a claim you can't defend if challenged. It shuts down the argument by shifting the burden of proof entirely onto you.
  *   **Literature Status:** **Moderately Settled.** This is often associated with Robert Brandom's "scorekeeping" model. It is less about "knowledge" and more about "commitment."

  ---

  ### The Critical Flaw in Your Roommate's Move

  Even if we grant the strongest version of his claim (The Knowledge Norm), there is a logical gap in how he used it to "settle" the argument.

  **1. Propriety vs. Truth**
  The norm "You shouldn't assert what you don't know" is a norm about the **act of speaking**, not the **truth of the proposition**.
  *   *Scenario:* You assert "Politician X took a bribe." You don't know this for a fact (no firsthand verification).
  *   *Roommate's Inference:* "You don't know it, therefore you shouldn't say it, therefore we should disregard the claim."
  *   *The Error:* Even if you violated the norm of assertion, the politician might still have taken the bribe. Your roommate conflated **epistemic propriety** (was it okay to say?) with **factual accuracy** (is it true?). He used a rule about *speech* to dismiss a claim about *reality*.

  **2. The Genetic Fallacy**
  By focusing on the source of your belief (hearsay vs. firsthand) rather than the content of the belief, he is committing a version of the genetic fallacy. The reliability of a "reliable source" is an evidentiary matter, not a binary switch between "knowledge" and "ignorance."

  ### Summary: Settled vs. Contested

  To ensure you don't walk away with a false sense of consensus, here is the state of the debate:

  | Claim | Status in Literature | Notes |
  | :--- | :--- | :--- |
  | **There are norms of assertion.** | **Settled.** | Assertion is not a free-for-all; it is governed by rules (moral, conversational, or constitutive). |
  | **Lying is impermissible.** | **Settled.** | Asserting what you believe false is wrong. |
  | **Assertion implies knowledge (Gricean).** | **Settled.** | Listeners reasonably assume speakers know what they say. |
  | **Knowledge is the *only* proper norm (KNA).** | **Contested.** | Williamson says yes; Lackey, Douven, and others argue for Justification or Truth norms. |
  | **Violating the norm makes the claim false.** | **Rejected.** | No serious philosopher argues that improper assertion entails falsehood. |

  ### Verdict on the Argument
  Your roommate invoked a **contested philosophical thesis (KNA)** as if it were a **settled conversational rule**, and then used it to commit a **logical fallacy** (conflating the propriety of the speech act with the truth of the content).

  **How to respond:**
  You can concede the norm without conceding the argument.
  > "You're right that I shouldn't state it as a fact if I haven't verified it myself. That's a fair criticism of my phrasing. But saying I shouldn't *assert* it doesn't mean the story is false. It just means I need to qualify it as 'reports indicate' rather than 'this happened.' The truth of the claim is separate from my warrant to say it."

  This acknowledges the epistemic norm (saving face for him) while preventing him from using it to dismiss the actual topic (saving the argument).
