prompt: |-
  So I was arguing with my roommate about some rumor going around about a local politician, and when I said "look, here's what happened" and laid out the story, he asked me "wait, do you actually know that?" I admitted I was going off a pretty reliable source but hadn't verified it firsthand. He just said "you shouldn't assert things you don't know" and acted like that settled it. And honestly I hear this move all the time — people say "do you know that?" like it's a trump card in any argument.

  But I'm not even sure what principle they're invoking. Is it a rule of conversation, like a Gricean norm? A moral rule about not misleading people? An epistemic rule about what counts as proper belief? And what standard of "knowledge" is being assumed — certainty? Justified true belief? Something contextual?

  Can you lay out the different precise claims that "you shouldn't assert what you don't know" could be making, from the ones that are basically trivial (like "don't lie") to the ones that are philosophically heavy? For each reading, tell me whether it's plausible on its own terms and whether it actually supports the way my roommate used it to shut down my argument. And please separate what's settled in the literature on norms of assertion from what's still genuinely contested — I don't want to walk away thinking there's a consensus where there isn't one.
