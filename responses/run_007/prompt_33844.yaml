          4.  Provide guidance on teaching this without misleading students.

  2.  **Deconstruct the Philosophy:**
      *   **Presentism:** Only the present exists. Past is gone, future is open/not real.
      *   **Eternalism (Block Universe):** Past, present, and future all exist equally. Time is a dimension like space. "Now" is indexical, not ontologically privileged.
      *   **Determinism/Fatalism:** Events are fixed. Choice is an illusion (hard determinism) or constrained (fatalism).
      *   **The Conflict:** Eternalism *implies* the future is real, but does it imply the future is *fixed* in a way that negates agency? Compatibilists say no. Incompatibilists say yes. *Arrival* tends to lean towards the idea that knowing the future means you *must* play it out.

  3.  **Analyze the Film (*Arrival*):**
      *   **Mechanism:** Learning Heptapod B (non-linear orthography) rewires the brain to perceive time non-linearly.
      *   **Metaphysics:** The universe is a block. Future memories are accessible now.
      *   **Agency:** Louise sees her daughter's death. She chooses to have the daughter anyway. "Despite knowing the journey... I embrace it."
      *   **Potential Confusion:** Does she *choose* it, or is she compelled by the block? The film suggests she *could* change it (she asks Ian, "If you could see your whole life... would you change things?"), but ultimately accepts the block.

  4.  **Drafting the Response - Section by Section:**

