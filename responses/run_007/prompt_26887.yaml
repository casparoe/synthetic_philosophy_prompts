answer: |-
  You mistake the logical problem for the economic one. Lange has indeed shown that one can construct a set of equations consistent with equilibrium under socialism, just as a mathematician can describe a state of rest. But economics is not about assuming all data are given to a single mind; it is about how society utilizes knowledge which is never given to anyone in its totality. The relevant facts—the slight variations in demand, the availability of a substitute material, the idle capacity in a specific machine—exist only as dispersed bits of incomplete and frequently contradictory knowledge which all the separate individuals possess. By the time a shortage is visible enough for your Central Board to observe and record, the waste has already occurred. The problem is not how to calculate given data, but how to ensure the best use of resources known only to men on the spot.

  The price system is not merely a device for recording past errors, as your trial-and-error suggests. It is a mechanism for communicating new information instantly and anonymously. When a tin supply becomes scarce, the price rises, and users economize without knowing *why* the tin is scarce. They act on the signal, not the cause. Your Board must wait for reports, aggregate them, and issue new directives. In the time it takes your planners to adjust the price, the market has already adjusted itself through the decentralized actions of entrepreneurs who know their own circumstances. You have solved the equations, perhaps, but you have silenced the telephone.
