  2. an LLM is asked "is there a largest prime number?" and it says no, gives Euclid's proof correctly, and when you push it with "but what about..." objections it handles them fine. gut says: it understands the proof.

  3. an LLM translates a passage from japanese to english, including a sentence that relies on the particle 'wa' marking topic rather than subject, and it gets the emphasis right in english by restructuring the sentence. gut says: it understands japanese.

  4. an LLM is asked how many 'r's are in the word 'strawberry' and it says two. gut says: this genuinely doesn't bother me for the understanding question. this feels like a weird perceptual or tokenization thing, not a language-understanding failure.

  5. an LLM is asked to summarize a research paper it's given in the prompt, and it does a solid job except it attributes a claim to the authors that they never made — it hallucinates a finding. gut says: this really bothers me. it feels like it doesn't understand what it means to report what someone else said.

  6. an LLM passes the U.S. medical licensing exam. gut says: it understands a lot of medicine.

  7. an LLM is asked "what's heavier, a pound of feathers or a pound of lead?" and it says "they weigh the same, but people think lead is heavier because it's denser" — which is exactly right. gut says: it understands the trick and the concept.

  8. an LLM is asked to explain a joke, and it gives a technically correct breakdown of the incongruity-resolution structure, but it's never found anything funny. gut says: this is where i get tangled. it understands the joke in the sense that it can analyze it, but it doesn't understand it in the sense that matters for humor. i don't know which sense i care about for the bigger question.

  9. an LLM is asked "are you conscious?" and it gives a careful, hedged answer about how it doesn't have subjective experience but can reason about the question. gut says: i have no idea what to make of this. it could be sophisticated pattern-matching that happens to produce the right answer, or it could be... something else.

  10. an LLM consistently fails at simple arithmetic with large numbers (like multiplying two five-digit numbers). gut says: this is orthogonal. arithmetic isn't what i mean by understanding language.

