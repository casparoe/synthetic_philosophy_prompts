  - "principle": the account of understanding you settle on, stated as precisely as you can
  - "verdicts": an array of objects, each with fields "case_label" (a short string matching my numbering), "my_verdict" (my original take, summarized), "principle_verdict" (what the principle says about it), and "match" (boolean)
  - "overturned": an array of case labels where your principle says my original verdict was wrong
  - "weakest_point": the consideration or empirical finding most likely to overturn the principle
  - "further_prediction": what the principle says about the grief paragraph case, and about one other case i didn't list
