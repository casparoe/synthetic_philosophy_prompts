prompt: |-
  I'm in a reading group on formal epistemology and we each have to write down our current views on higher-order evidence and epistemic akrasia so the others can pressure-test them. Here's where I've landed:

  (1) Epistemic akrasia is always irrational. You cannot rationally believe P while also believing that your total evidence does not support P.

  (2) Higher-order evidence — evidence about the quality of your own evidence or reasoning — can make it rational to abandon a belief even when your first-order evidence, correctly evaluated, decisively supports that belief.

  (3) In peer disagreement cases where you and your peer share the same first-order evidence and are equally competent, you should conciliate by moving your credence significantly toward theirs.

  (4) Higher-order evidence is not a different kind of thing from first-order evidence; it's just evidence. What you ought to believe is determined by your total evidence, and there is no principled epistemic divide between the two levels.

  (5) What it is rational for you to believe supervenes on your mental states — it doesn't depend on facts about the world that are inaccessible to you.

  I'd like to know whether this set hangs together. Go through these and identify which pairs or combinations are in tension and how badly. For each tension, say whether it's a genuine conflict or merely apparent, and what the least costly revision would be. Also flag any pairs that might look like they're in tension but actually aren't. Please rank the tensions by severity, and say how confident you are in your assessment, singling out the point you're least sure of.
