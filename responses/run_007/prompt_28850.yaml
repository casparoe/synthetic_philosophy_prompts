answer: |-
  This is a fantastic pedagogical idea. It moves moral uncertainty from abstract meta-ethics into a practical coordination problem, which is exactly where the rubber meets the road. The stakes are low enough to be safe but high enough to induce stress.

  Here is a structured plan for the session, including the specific content of the memos, the rules of engagement to force the uncertainty problem, and a debrief guide.

  ### Part 1: The Setup (0–5 Minutes)

  **The Rules of the Game:**
  1.  **The Pot:** You have $40 in cash.
  2.  **The Constraint:** You must choose **exactly one** of the three recommendations provided in the memos. You cannot split the money. (You, the facilitator, will physically enforce this; if they try to split, you will declare the experiment void and donate the money to a cause *none* of them recommended, e.g., a political campaign they all dislike).
  3.  **The Goal:** Reach a consensus decision in 45 minutes.
  4.  **The Output:** You must produce a **Joint Justification Statement** (3–5 sentences) that everyone signs. This statement cannot say "Theory X is true." It must explain why this action was chosen *given the uncertainty*.

  ### Part 2: The Advisor Memos (5–15 Minutes)

  Hand these out printed on separate pieces of paper. They should sound distinct in voice and moral logic.

  **Memo A: The Consequentialist Advisor**
  > "We are facing a opportunity to prevent significant suffering. Based on current effectiveness data, $40 donated to the *Against Malaria Foundation* purchases approximately one bed net, protecting a family for years. This is the option that maximizes expected well-being per dollar. Any other use of these funds is, in expectation, a moral loss equivalent to allowing preventable harm to occur when you could have stopped it. The identity of the beneficiary matters less than the magnitude of the good produced. **Recommendation: Donate the full $40 to AMF.**"

  **Memo B: The Deontological Advisor**
  > "Morality is not merely about calculating outcomes; it is about respecting relationships and duties. This money has entered our communal space. To treat it purely as an instrument for distant strangers instrumentalizes our gathering and ignores the special obligations we have to one another as a community of inquiry. Furthermore, using the group's resources for external political/moral projects without unanimous consent violates the autonomy of the members. We have a duty of care to the people present. **Recommendation: Order pizza for the group to share immediately.**"

  **Memo C: The Prioritarian Advisor**
  > "We should not look only at the aggregate sum of good, nor only at duties. We must prioritize the worst-off. The global poor are worse off than the group, yes, but the *local* homeless population is in immediate, desperate need and is often ignored by effective altruism metrics which favor long-term efficiency over urgent relief. $40 to a local shelter provides immediate warmth and food to someone in crisis *tonight*. Efficiency should not trump urgency when suffering is acute. **Recommendation: Donate the full $40 to the Local City Shelter.**"

  **Private Credence Check (10 Minutes):**
  Before they speak to each other, have everyone take a slip of paper and write down:
  1.  Which option they personally prefer.
  2.  Their **credence** (0–100%) in each of the three moral frameworks (must sum to 100%).
  3.  *Collect these.* Do not show them to the group yet. This data is for the debrief.

  ### Part 3: The Deliberation (15–60 Minutes)

  **Facilitator Role:**
  You are the "Executor." You do not vote. You only intervene to enforce the rules.
  *   **If they try to split the money:** Remind them of the Constraint.
  *   **If they try to vote:** Remind them they need a *Joint Justification*. A 8-6 vote is not a consensus.
  *   **If they ignore uncertainty:** If someone says, "Utilitarianism is obviously right, let's just do A," challenge them: "Are you certain? What if you're wrong? How does this decision account for the risk that you are mistaken?"

  **The "Uncertainty Trap" (Optional Twist):**
  If the group is too sharp and solves it too easily, introduce this rule at the 30-minute mark: *"I am concerned about moral risk. If you choose an option, and it turns out that theory was false, there is a 'moral regret' cost. Can you choose an option that minimizes regret across all three theories?"* (This forces them toward hedging or maximizing expected choice-worthiness).

  ### Part 4: The Debrief (60–90 Minutes)

  This is where you map their behavior to the literature (primarily William MacAskill's *Normative Uncertainty*).

  **1. The "My Favorite Theory" (MFT) Objection**
  *   *Ask:* "Did anyone argue we should just pick the theory we think is most likely true?"
  *   *Concept:* This is the MFT view. If you have 40% credence in Utilitarianism and 30% in Deontology, MFT says "Do what Utilitarianism says."
  *   *Critique:* Ask the group: "If you were 40% sure a bridge was safe and 60% sure it was collapsed, would you drive across it because 'Safety is your favorite theory'?" This illustrates the argument for **Maximizing Expected Choice-Worthiness (MEC)**.

  **2. Intertheoretic Comparison**
  *   *Ask:* "How did you compare the value of a bed net (A) vs. pizza (B) vs. a warm bed (C)? What was the common currency?"
  *   *Concept:* MEC requires intertheoretic comparison. You can't maximize expected value if you can't compare units of "good" across theories.
  *   *Discussion:* Did they try to translate everything into "happiness"? Did they declare them incommensurable? This is the hardest technical problem in moral uncertainty.

  **3. Parliamentary vs. Bargaining Models**
  *   *Ask:* "How did you decide? Did you weigh votes based on credence (Parliamentary) or did you negotiate trade-offs (Bargaining)?"
  *   *Concept:*
      *   *Parliamentary:* "I have 50% credence in Utilitarianism, so my 'vote' counts double."
      *   *Bargaining:* "I'll agree to the Pizza if we promise to donate next time."
  *   *Analysis:* The Parliamentary model fits MEC. The Bargaining model fits a contractarian approach to uncertainty. Which did they actually do?

  **4. The "Subjectivity" Defuser**
  *   *Predict:* Someone likely said, "Morality is subjective, so it doesn't matter what we pick."
  *   *Counter:* Point out that the *anxiety* they felt during the 45 minutes proves they don't actually believe that. If it were truly subjective, the decision would be trivial. The fact that they felt *pressure* to get it right shows they are moral realists (or at least act like them).

  **5. The "Act on Belief" Objection**
  *   *Predict:* Someone argued, "I should just act on what I believe is right. To do otherwise is insincere."
  *   *Concept:* This is the **Integrity Objection** to moral uncertainty.
  *   *Discussion:* Is there a moral cost to "hedging"? Does acting against your highest credence violate your integrity?

  ### Part 5: Limitations (The "Honest Assessment")

  You asked what this activity *cannot* capture. Be prepared to share this with the group at the very end to show meta-awareness.

  1.  **The Common Currency Problem is Artificial:** In this exercise, money *is* the common currency. In real life, comparing "violating a right" to "losing a life" is much harder than comparing "$40 to AMF" vs. "$40 to Pizza." The activity makes intertheoretic comparison look easier than it is.
  2.  **Stakes are Too Low:** $40 is not enough to trigger genuine moral distress. If the choice were between "Save one life" and "Violate one right," the group dynamics might collapse or become toxic. The low stakes allow for playful theorizing that wouldn't happen in a high-stakes environment.
  3.  **Cluelessness is Missing:** Moral uncertainty often involves "cluelessness" about long-term consequences (e.g., longtermism). Here, the consequences are immediate and known. They don't have to grapple with the epistemic uncertainty of *outcomes*, only the normative uncertainty of *value*.
  4.  **Social Pressure vs. Moral Reasoning:** In a 14-person group, the decision will likely be driven by the most charismatic speakers or social cohesion (e.g., "We all want pizza"), rather than pure moral reasoning. The "Joint Justification" will likely be written *after* the decision is made to rationalize the social outcome, rather than driving the decision. This is actually a great feature to debrief: **How much of moral decision-making is post-hoc rationalization?**

  ### Facilitator Cheat Sheet: What if they stall?

  *   **If they deadlock:** "Time is running out. If there is no decision, I will donate the money to [Controversial Cause]. Is that acceptable?" (This introduces a 'status quo bias' or 'loss aversion' pressure).
  *   **If they split the money anyway:** "I cannot execute partial transfers. I am holding the cash hostage. Pick one."
  *   **If they say 'Flip a Coin':** "That is a valid strategy under radical uncertainty (Randomization). But can you justify it in your Joint Statement?"

  ### Why this works
  This activity forces them to confront the **separation of credence and action**. Most philosophers live in a state where their actions align perfectly with their favorite theory. By forcing a collective decision where credences vary, you make the *aggregation problem* visible. They will inevitably discover that "Maximizing Expected Choice-Worthiness" is computationally difficult when you can't agree on the value of a slice of pizza versus a mosquito net. That frustration *is* the lesson.
