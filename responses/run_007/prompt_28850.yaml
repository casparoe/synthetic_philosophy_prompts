      *   Deliberation: 45 mins.
      *   Debrief: 30 mins.
      *   *Adjustment:* The prompt says 45 mins for decision, remaining for debrief. So 45/45 split.
      *   *Revised Flow:*
          *   0-5: Setup & Rules.
          *   5-15: Read Memos & Private Credence.
          *   15-60: Deliberation.
          *   60-90: Debrief.

  8.  **Addressing the "Splitting" Issue:**
      *   Make the options logically incompatible.
      *   Option A: Wire transfer to AMF (Needs bank info, takes time).
      *   Option B: Pizza order (Needs to be placed now for arrival at end of session).
      *   Option C: Cash handover to specific local shelter rep (Needs physical handoff).
      *   *Actually, simpler:* Just declare as the Facilitator: "I hold the cash. I will execute *one* of these three actions. I will not split it. If you don't agree on one, I keep it/donate it to something random."

  9.  **Addressing the "Inhabit the Problem" Goal:**
      *   To stop them from just picking their favorite theory, introduce **The Uncertainty Penalty**.
      *   Tell them: "If you choose the option recommended by the theory that turns out to be *false*, there is a moral cost. Your goal is to minimize 'moral regret'."
      *   Better: Give them a handout on **Expected Choice-Worthiness**. Ask them to calculate it.
      *   *Problem:* They can't calculate it without intertheoretic comparison.
      *   *Solution:* That's the point! Let them struggle with the comparison.
      *   *Instruction:* "You must justify your choice not by saying which theory is *true*, but by explaining how you weighed the theories given your uncertainty."

  10. **Final Polish:**
      *   Ensure the memos are punchy.
      *   Ensure the debrief questions are specific.
      *   Ensure the limitations section is honest.

