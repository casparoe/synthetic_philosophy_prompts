      *   **Topic:** Moral Uncertainty (Normative Ethics).
      *   **Goal:** Move beyond lecture/discussion to *inhabiting* the problem. Make a real collective decision under uncertainty.
      *   **Proposed Mechanism:** $40 cash, 3 "advisor memos" (Utilitarian, Deontologist, Prioritarian), incompatible recommendations.
      *   **Constraints:** 45 minutes for decision, 45 minutes for debrief. Must prevent easy compromises (splitting the money). Must force engagement with uncertainty (not just picking favorite theory).
      *   **Debrief Goals:** Map to formal concepts (expected choice-worthiness, intertheoretic comparison, parliamentary vs. bargaining models, "my favorite theory" objection).
      *   **Critical Analysis:** Identify limitations of the activity.

  2.  **Develop the Three Recommendations (The "Memos"):**
      *   *Constraint:* They must be incompatible and concrete. Splitting the money ($13.33 each) must be ruled out or rendered meaningless.
      *   *Constraint:* They need to represent distinct moral logics that clash under uncertainty.
      *   *Idea 1 (Utilitarian):* Maximize aggregate good. $40 to effective charity (e.g., AMF).
      *   *Idea 2 (Deontologist):* Rights/Constraints. Don't use money instrumentally if it violates a duty. Maybe return it? Or give it to someone who has a *claim* to it? Or buy a gift for a specific person to honor a promise? Let's go with: *Return the money to the source* (if it was found) OR *Give it to a specific individual who was wronged*. To make it fit the "bring $40" setup, let's say the money is "unearned windfall." A deontologist might say: *Keep it in the group fund for administrative integrity* OR *Give it to the person in the room who is poorest* (as a matter of specific duty, not aggregate good). Actually, a stronger deontological constraint: *Destroy the money* (to prevent instrumentalization) is too extreme. How about: *Donate to a cause that respects rights even if less effective*? No, that's too close to Utilitarianism.
      *   *Refinement:* Let's make the options mutually exclusive *actions*.
          *   Option A (Utilitarian): Donate to Against Malaria Foundation (maximize QALYs).
          *   Option B (Deontological): Buy dinner/pizza for the group *right now*. Why? Because there is a duty of special obligation to those present/community, or perhaps the money was budgeted for "group sustenance" and using it otherwise violates a procedural duty. Better: *Return the money to the department/admin*. Why? Because accepting windfalls creates bad incentives/dependency (rule utilitarian/deontological mix). Let's go stronger: *Give the $40 to the single poorest person in the room.* This creates a specific duty to a specific individual, violating the impartiality of utilitarianism.
          *   Option C (Prioritarian/Rawlsian): *Burn it/Donate to a political advocacy group.* No, let's make it about the worst off globally vs locally.
      *   *Better Approach for Incompatibility:* The *same* pot of money cannot be split.
          *   Memo 1 (Utilitarian): Donate to high-impact charity (e.g., AMF). Rationale: Saves ~0.01 lives.
          *   Memo 2 (Deontologist): Buy pizza for the group. Rationale: Special obligations to community/promise-keeping (maybe the money came from a "snack fund"). Or, give it to a specific person in the room who was harmed previously. Let's go with: *Give the $40 to the undergraduate with the highest financial need in the room.* (Specific duty vs. aggregate).
          *   Memo 3 (Virtue Ethics/Integrity): *Keep the money in a locked box for emergencies.* Rationale: Cultivating prudence, not acting impulsively.
      *   *Critique:* Splitting is still possible ($13 to AMF, $13 to Pizza, $13 to Student).
      *   *Fix:* The recommendations must be *all-or-nothing* regarding the *same* resource, or the resource is indivisible.
      *   *Revised Idea:* The $40 is for a *single* auction/bid.
      *   *Revised Idea 2 (Simpler):* The three memos recommend three *different recipients*, but the condition is the money must go to *one* recipient to have maximum impact/meaning.
          *   Memo 1 (Utilitarian): Effective Charity (AMF). Impact: High global good.
          *   Memo 2 (Deontologist): The Person in the Room (Specific Duty). Impact: Honors local obligation.
          *   Memo 3 (Prioritarian): A Local Shelter (Worst Off Nearby). Impact: Helps worst off, but less efficiently than AMF.
      *   *Preventing Splitting:* The facilitator (me) must impose a rule: "The advisors insist their plan requires the full $40 to be viable/effective. Splitting undermines the moral point of each." (e.g., AMF needs min $40 for a net? No. Pizza needs $40 for everyone? Yes. Student needs $40 for a bill? Yes.)
      *   *Final Selection:*
          1.  **Utilitarian:** Donate to Against Malaria Foundation (Global aggregate good).
          2.  **Deontologist:** Buy Pizza for the Group *now* (Special obligation to community/present company).
          3.  **Prioritarian:** Give to the "Hardest Hit" person in the room (identified via sealed note beforehand) OR a local homeless shelter. Let's go with *Local Homeless Shelter* (Priority to worst-off, even if less efficient than AMF).
          *   *Constraint:* Must choose ONE. Splitting dilutes the moral signal.

  3.  **Structure the Deliberation (Forcing Uncertainty):**
      *   *Problem:* People will just vote for their favorite theory.
      *   *Solution:* Assign roles or impose epistemic constraints.
      *   *Idea:* Don't let them know which memo matches which theory initially? No, they need to know the theories to discuss uncertainty.
      *   *Idea:* "Veil of Ignorance" regarding their own credences? Too hard.
      *   *Idea:* **Credence Betting.** Before deciding, they must assign a probability to each theory being true. Then they have to justify the decision based on those probabilities.
      *   *Idea:* **The "Veto" Power.** Give each sub-group (assigned to a theory) veto power? No, that leads to stalemate.
      *   *Best Mechanism:* **The Parliamentary Model Simulation.** Divide the room into 3 factions based on their *actual* credences (or assign them). Give them voting power proportional to their credence. But wait, the prompt wants them to grapple with *uncertainty*, not just aggregate credences.
      *   *Refined Mechanism:* **Two-Stage Process.**
          1.  **Credence Calibration (10 mins):** Everyone writes down private credences: How likely is Utilitarianism true? Deontology? Prioritarianism? (Must sum to 100%).
          2.  **Deliberation (35 mins):** They must decide. *Crucial Twist:* They are not allowed to vote. They must reach consensus. If they can't, the money is destroyed (or donated to a neutral third party they all dislike, e.g., a controversial political fund). This creates a "cost of disagreement."
          3.  **The "Hedge" Constraint:** Explicitly forbid splitting the money. The facilitator acts as the "Executor" who will only enact *one* of the three options.
      *   *To force engagement with uncertainty:* Require that the final justification *cannot* appeal to "Theory X is true." It must appeal to "Given our uncertainty, we chose..."

  4.  **Drafting the Memos:**
      *   Need to sound distinct.
      *   Memo 1 (Consequentialist): Focus on outcomes, numbers, scale.
      *   Memo 2 (Deontological): Focus on duties, rights, constraints, "do not use people."
      *   Memo 3 (Prioritarian): Focus on the bottom, urgency of suffering, not just aggregate.

  5.  **Debrief Plan:**
      *   Connect behavior to MacAskill's *Normative Uncertainty*.
      *   Did they maximize expected choice-worthiness (MEC)?
      *   Did they try to find a "common currency" (intertheoretic comparison)?
      *   Did they use a Parliamentary model (voting by credence) or Bargaining model (negotiating outcomes)?
      *   Address the "Moral Subjectivism" defuser.
      *   Address the "My Favorite Theory" (MFT) objection.

  6.  **Limitations (Critical Analysis):**
      *   Stakes are too low ($40).
      *   Theories are caricatures.
      *   Intertheoretic comparison is artificially solvable (money is the common currency).
      *   No "cluelessness" (long-term effects).
      *   Group dynamics override philosophical reasoning (social pressure).

  7.  **Refining the Activity Flow:**
      *   *Intro (5 mins):* Set stakes, rules (no splitting, one choice).
      *   *Reading (10 mins):* Read memos silently.
      *   *Credence Check (5 mins):* Private writing of probabilities.
      *   *Deliberation (40 mins):* The core struggle.
      *   *Decision (5 mins):* Finalize.
      *   *Debrief (25 mins):* Philosophy mapping.
      *   *Wait, total time is 90 mins.*
