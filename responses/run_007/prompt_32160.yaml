answer: |-
  - **The candidate rules**
  Two principles plausibly unify the colleague's eight verdicts. First, the **Causal Means Principle**: it is impermissible to cause harm if that harm is causally necessary to produce the good outcome. In permissible cases (Switch, Strategic Bomber, Hysterectomy, Morphine), the good result occurs via the action itself (diverting, bombing, removing), while death is a side effect. In impermissible cases (Footbridge, Terror Bomber, Craniotomy, Euthanasia), the victim's destruction is the mechanism of salvation.

  Second, the **Intentional Means Principle**: it is impermissible only if the agent *intends* the harm as part of their plan. This fits the same eight cases because, traditionally, causal means are also intended means. However, this rule focuses on the agent's mental state rather than physical causality. In the permissible cases, the agent intends the rescue, merely foreseeing the death. In the impermissible cases, the agent must intend the harm to succeed (e.g., intending the man's impact to stop the trolley). Both rules perfectly accommodate the existing record, but they diverge on the metaphysics of action in complex causal chains.

  - **Predictions for the loop case**
  Under the **Causal Means Principle**, the verdict is **impermissible**. In the loop variant, the single person's body is physically required to stop the trolley; without their death, the five die. The harm is causally instrumental to the rescue, structurally identical to Footbridge and Craniotomy, regardless of the lever-pulling action.

  Under the **Intentional Means Principle**, the verdict could be **permissible**. The agent's primary intention is merely to divert the trolley onto a different track. The fact that the body stops the trolley is a foreseen consequence of the diversion, not necessarily an intended goal. If the agent describes their plan as "redirecting the threat" rather than "using the man," this rule permits the action, aligning it with Switch.

  - **Best guess and reasoning**
  My best prediction is that she will judge the loop variant **impermissible**. While the Intentional Means Principle offers a route to permissibility, the colleague's track record suggests a commitment to the Causal Means Principle, particularly given the medical cases. The distinction between *Hysterectomy* (permissible) and *Craniotomy* (impermissible) is the strongest evidence. In *Craniotomy*, the fetus's destruction is the direct physical means to clear the path, much like the loop victim's body stopping the trolley. In *Hysterectomy*, the death is a side effect of removing a pathological organ.

  Since she rejects *Craniotomy*, she likely prioritizes the physical causal role of the victim over the agent's descriptive intention. The *Strategic Bomber* case further supports this: bombing a factory is permissible not because of intention alone, but because civilian deaths are not the causal mechanism of victory. Therefore, she will likely view the loop victim as a means, rendering the action impermissible.

  - **The decisive further case**
  The **Human Dam** case would cleanly discriminate between these rules. A flood threatens five people. You can divert the water into a channel where one person is standing; their body will block the flow enough to save the five, though they will drown.

  The **Causal Means Principle** verdicts this **impermissible**, as the victim's body is causally required to stop the water (identical to Loop/Craniotomy). The **Intentional Means Principle** could verdict this **permissible**, provided the agent intends only to "divert the water" and treats the blocking as a foreseen side effect of the diversion. If she judges this impermissible, it confirms she follows Causal Means. If permissible, it confirms she follows Intentional Means/Description. This isolates the causal necessity from the "redirecting existing threat" intuition found in Switch.
