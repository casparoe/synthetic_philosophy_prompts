          3.  Cruxes (Sub-questions that would move minds).
          4.  Concrete Cases/Arguments for each Crux (with pre-registered predictions).
          5.  Verbal/Deflationary Analysis (If any part dissolves).
      *   **Constraint:** No transcript, no ruling on who is right.

  2.  **Deconstruct the Subject Matter (Anthropic Reasoning):**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of *actually existing* observers in your reference class. (Key intuition: You shouldn't expect to be special *within* the world, but your existence doesn't tell you much about *how many* worlds/observers exist).
      *   **SIA (Self-Indication Assumption):** Reason as if you are a random sample from the set of *possible* observers. (Key intuition: The fact that you exist is evidence that there are more observers, because you are more likely to exist in a world with more observers).
      *   **Key Cases:**
          *   *God's Coin Toss:* Heads = 1 person, Tails = 2 people. You wake up. What's P(Heads)? SSA says 1/2. SIA says 1/3.
          *   *Doomsday Argument:* If humanity lasts long, there are many humans. If short, few. You are early-ish. SSA says this is evidence for "short future." SIA cancels this out (being early is balanced by the higher probability of existing in a large population).
          *   *Presumptuous Philosopher:* Physicists say Theory A (1 trillion observers) or Theory B (1 trillion trillion observers). Philosopher says B is vastly more likely just because. SIA bites the bullet. SSA says no, physics shouldn't depend on observer counts like that.

