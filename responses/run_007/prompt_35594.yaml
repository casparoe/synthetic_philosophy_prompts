          *   SIA phrasing: Focus on "random sample from possibles," "existence favors populous worlds."
          *   *Issue 1:* The weight of existence.
          *   *Issue 2:* The reference class definition.
          *   *Issue 3:* The Presumptuous Philosopher verdict.

      *   **Section 3: Cruxes:**
          *   What would change their minds?
          *   *Crux 1:* Is existence evidence? (The core metaphysical/epistemic split).
