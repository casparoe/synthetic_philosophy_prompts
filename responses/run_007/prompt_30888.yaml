answer: |-
  # Standard Operating Procedure: Voting Rule Viability Assessment
  **Document ID:** GOV-VOTE-004  
  **Owner:** Voting Module Maintenance Team  
  **Subject:** Pre-Sign-off Theoretical Compliance Checklist  
  **Basis:** Social Choice Theory (Gibbard–Satterthwaite, May's Theorem, Gibbard 1978)

  ## Purpose
  To prevent the adoption of voting rules that are mathematically incapable of meeting the Governance Committee's "strategy-proof" requirement. This procedure identifies when a proposal violates the Gibbard–Satterthwaite (G-S) impossibility theorem or qualifies for a valid theoretical escape route.

  ## Procedure

  ### Step 1: Define Input Structure
  **Action:** Identify the data each voter submits.
  *   **Check:** Is the input a strict **ordinal ranking** (e.g., A > B > C), **cardinal rating** (e.g., Approval/Score), or **single choice**?
  *   **Mechanical Check:** If Ordinal Ranking → Proceed to Step 2 (G-S applies directly).
  *   **Judgment Call:** If Cardinal/Approval → Flag as "G-S does not strictly apply, but manipulation risks remain." (Note: No voting system is immune to tactical voting in all contexts, but G-S specifically targets ordinal rankings).

  ### Step 2: Count Alternatives ($N$)
  **Action:** Count the maximum number of distinct winning outcomes possible in a single election.
  *   **Mechanical Check:** Is $N \ge 3$?
      *   **YES:** Proceed to Step 3.
      *   **NO ($N=2$):** **FLAG: "Theorem Doesn't Apply."** (May's Theorem applies; strategy-proofness is possible). Stop.

  ### Step 3: Determine Determinism
  **Action:** Assess if the rule produces a unique winner for a fixed set of ballots.
  *   **Mechanical Check:** Does the rule involve coin flips, random sampling, or lottery tie-breakers?
      *   **NO (Deterministic):** Proceed to Step 4.
      *   **YES (Randomized):** **FLAG: "Theorem Doesn't Apply (Randomization Escape)."** (Proceed to Step 7 for Gibbard 1978 analysis).

  ### Step 4: Verify Universal Domain
  **Action:** Check if voters are allowed to submit *any* logical preference ordering.
  *   **Mechanical Check:** Are there restrictions on how voters can rank candidates (e.g., cannot rank C last if A is first)?
      *   **YES (Restricted):** **FLAG: "Theorem Doesn't Apply (Domain Restriction)."** (Verify if preferences are genuinely single-peaked in practice).
      *   **NO (Universal):** Proceed to Step 5.

  ### Step 5: Verify Surjectivity (Onto)
  **Action:** Check if every candidate has a non-zero probability of winning.
  *   **Mechanical Check:** Is there any candidate who is mathematically excluded from winning regardless of votes (e.g., a "spoiler" who can never win)?
      *   **YES (Not Surjective):** **FLAG: "Theorem Doesn't Apply (Range Restriction)."**
      *   **NO (Surjective):** Proceed to Step 6.

  ### Step 6: The Gibbard–Satterthwaite Verdict
  **Action:** Apply the theorem conditions.
  *   **Condition:** If Steps 2, 3, 4, and 5 are all **YES/NO** as indicated above (i.e., $N \ge 3$, Deterministic, Universal Domain, Surjective):
  *   **Verdict:** **FLAG: "IMPOSSIBLE UNLESS DICTATORIAL."**
  *   **Action:** The rule **cannot** be strategy-proof. Any claim otherwise is mathematically false. Identify the specific manipulation vector (e.g., monotonicity failure, burial).

  ### Step 7: Analyze Escape Routes (If Flagged in Steps 2, 3, or 4)
  **Action:** If the theorem doesn't apply, validate the escape route.
  *   **Randomization:** If Step 3 was YES, note that while G-S doesn't apply, Gibbard (1978) proves only **Random Dictatorships** are fully strategy-proof.
  *   **Two Options:** If Step 2 was NO, confirm Simple Majority is used for optimal fairness.
  *   **Restricted Domain:** If Step 4 was YES, require empirical evidence that voter preferences align with the restriction (e.g., left-right spectrum).

  ### Step 8: Final Recommendation
  **Action:** Synthesize findings for the Committee.
  *   **Judgment Call:** Distinguish between *theoretical manipulability* and *practical exploitability*. (A rule may be manipulable in theory but too complex to game in practice).
  *   **Output:** "Approved," "Approved with Warnings," or "Rejected (Theoretical Violation)."

  ---

  ## Application of Procedure to Current Proposals

  ### Proposal 1: Instant-Runoff Voting (IRV)
  *Marketing Claim: "Strategy-proof alternative to Plurality."*

  1.  **Input:** Ordinal Ranking. (G-S Applies).
  2.  **Alternatives:** $N \ge 3$ (Typical co-op elections have multiple board seats/candidates). **Condition Met.**
  3.  **Determinism:** Yes. **Condition Met.**
  4.  **Universal Domain:** Yes, voters can rank anyone anywhere. **Condition Met.**
  5.  **Surjectivity:** Yes, any candidate can win. **Condition Met.**
  6.  **Verdict:** **FLAG: "IMPOSSIBLE UNLESS DICTATORIAL."**
      *   *Analysis:* IRV is not a dictatorship. Therefore, per G-S, it **must** be manipulable.
      *   *Specific Flaw:* IRV fails monotonicity. Voting for a candidate can cause them to lose; voting against them can cause them to win. Tactical "burial" of strong rivals is possible.
  7.  **Escape Routes:** None applicable.
  8.  **Recommendation:** **REJECT.**
      *   *Committee Impact:* **High Friction.** This directly contradicts the vendor/governance claim that IRV is "strategy-proof." We must inform the Committee that this claim is mathematically false.

  ### Proposal 2: "Random Voter is Dictator" Tiebreak
  *Marketing Claim: "Unbiased resolution mechanism."*

  1.  **Input:** Ordinal Ranking (implied).
  2.  **Alternatives:** $N \ge 3$.
  3.  **Determinism:** **NO.** The outcome depends on a random selection of a voter.
      *   **FLAG: "Theorem Doesn't Apply (Randomization Escape)."**
  4.  **Analysis:** Proceed to Step 7 (Randomization).
      *   *Theory:* Gibbard (1978) extends impossibility to random rules. The *only* strategy-proof random social choice function is a **Random Dictatorship** (pick one voter at random, adopt their top choice).
      *   *Mechanism Check:* If the proposal is literally "Pick one voter at random, their top choice wins," it **is** strategy-proof. If it is "Run Plurality, then pick a random voter to break ties," it remains manipulable because the main rule is manipulable.
      *   *Assumption:* Assuming the proposal is a full Random Dictatorship mechanism.
  5.  **Recommendation:** **APPROVED (Theoretically) / REJECT (Politically).**
      *   *Committee Impact:* **Mixed.** While it satisfies the "strategy-proof" requirement, the term "Dictator" is toxic in a worker co-op federation. It violates norms of deliberation and consensus, even if fair in expectation.

  ### Proposal 3: Simple Majority Between Two Candidates
  *Marketing Claim: "Standard democratic practice."*

  1.  **Input:** Single Choice (equivalent to ordinal ranking of 2 items).
  2.  **Alternatives:** $N = 2$.
      *   **FLAG: "Theorem Doesn't Apply."** (Step 2 Failure).
  3.  **Analysis:** G-S requires 3 or more outcomes. With 2 outcomes, truth-telling is a dominant strategy.
      *   *Theory:* May's Theorem applies. This rule is anonymous, neutral, and positively responsive.
  4.  **Recommendation:** **APPROVED.**
      *   *Committee Impact:* **Low Friction.** This is the only proposal that is both strategy-proof and politically palatable, but it is limited to binary decisions (e.g., Yes/No, Candidate A vs B).

  ## Summary for Governance Committee
  *   **IRV:** Cannot be certified as strategy-proof. The math proves tactical voting exists. **Do not market as honest.**
  *   **Random Dictator:** Mathematically honest, but politically incompatible with co-op values.
  *   **Simple Majority:** Mathematically honest, but limited to binary choices.

  **Maintainer Note:** If the Committee insists on a "strategy-proof" rule for $N \ge 3$ candidates that is deterministic and democratic, they are requesting a mathematical impossibility. We must document this refusal in the meeting minutes.
