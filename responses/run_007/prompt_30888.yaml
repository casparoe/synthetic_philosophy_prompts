  I maintain the voting module for a federation of worker co-ops, and every quarter a governance committee asks us to add some method that's billed as "strategy-proof"—instant-runoff, approval, a Borda variant, you name it—for binding internal votes. I need a reusable checklist my team can run on any proposed voting rule before it goes to the committee for sign-off, grounded in what social choice theory actually proves (I'm thinking of the Gibbard–Satterthwaite theorem). Please write it as an ordered procedure: what counts as the input, whether all rankings are allowed, whether every option can in principle win, whether the rule is deterministic, and where the procedure must flag "impossible unless dictatorial" versus "the theorem doesn't apply." Be explicit about the escape routes (only two options, restricted preferences like single-peakedness, randomization) and about which steps are judgment calls rather than mechanical checks. Then run it on three proposals: instant-runoff marketed as strategy-proof, a "random voter is dictator" tiebreak, and simple majority between two candidates. Make sure at least one result is one the committee wont like.
