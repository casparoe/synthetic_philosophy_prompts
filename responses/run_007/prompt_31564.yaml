answer: |-
  This is a wonderful moment to capture in a novel. The scene you describe recreates one of the most dramatic intellectual confrontations of the early twentieth century, often personified by the clash between David Hilbert (the classical formalist) and L.E.J. Brouwer (the intuitionist/constructivist). When your friend said, "the law of excluded middle doesn't hold," he was invoking a slogan that carries a tremendous amount of philosophical baggage.

  To a classical mathematician, the Law of Excluded Middle (LEM) is as obvious as breathing: for any proposition $P$, either $P$ is true or $\neg P$ is true ($P \lor \neg P$). To a constructivist, however, this principle is not a logical truth but a substantive assumption about the nature of mathematics that they reject.

  The proof you described is a **non-constructive existence proof**. It shows that it is impossible for the object *not* to exist, but it provides no method to find or construct the object. For a constructivist, "existence" means "constructibility."

  Here are four distinct readings of your friend's one-liner, arranged from the modest/technical to the substantive/ontological.

  ### 1. The Formalist Reading (System-Relative)
  **The Claim:** "In the formal system of Intuitionistic Logic, the formula $P \lor \neg P$ is not a theorem, and the rule of Double Negation Elimination ($\neg \neg P \to P$) is not derivable."

  *   **Plausibility:** Trivially true. It is a matter of definition. Intuitionistic logic is simply classical logic minus these specific principles.
  *   **Contentiousness:** None. A classical logician agrees that these rules are absent from intuitionistic systems; they just disagree that we *ought* to use that system exclusively.
  *   **Does it license rejecting the proof?** Yes, but only conditionally. It means: "If we agree to play by the rules of intuitionistic logic, your proof is invalid." It does not say the proof is wrong in absolute terms, only that it is illegal in this specific game.
  *   **Novelist's Note:** This is the dry, technical version. Your friend likely meant more than this, but this is the bedrock upon which the other claims stand.

  ### 2. The Methodological Reading (Normative)
  **The Claim:** "Mathematicians *ought not* to use the Law of Excluded Middle because proofs relying on it are less useful than constructive proofs."

  *   **Plausibility:** Plausible, depending on the goal of mathematics. If the goal is to compute values or build physical models, constructive proofs are superior because they provide an algorithm. If the goal is merely to map the landscape of truth, classical proofs are efficient.
  *   **Contentiousness:** Moderate. Most working mathematicians today are "methodological classicalists"—they prefer constructive proofs when they have them but accept classical proofs as valid knowledge.
  *   **Does it license rejecting the proof?** Yes, as a matter of professional standards. It treats the proof as "bad practice" rather than "false." It suggests the proof fails to deliver the commodity (a method of construction) that a proof of existence should promise.
  *   **Novelist's Note:** This turns the dispute into a pragmatic one. It frames the constructivist not as a denier of truth, but as a consumer advocate for higher-quality mathematical goods.

  ### 3. The Semantic Reading (Truth-Conditional)
  **The Claim:** "Mathematical propositions do not possess a determinate truth value independent of our ability to verify them. Therefore, for some $P$, it is not the case that ($P$ is true or $P$ is false)."

  *   **Plausibility:** Highly contentious. This challenges the realist view that mathematical truths exist "out there" waiting to be discovered. It introduces "truth-value gaps."
  *   **Contentiousness:** High. This is a direct assault on the Platonic view held by most classical mathematicians.
  *   **Does it license rejecting the proof?** Yes, fundamentally. If $P \lor \neg P$ is not always true, then a proof that relies on the dichotomy of "either it exists or it doesn't" is unsound. The proof assumes a bivalent world (true/false) when the constructivist claims the mathematical world is not bivalent.
  *   **Novelist's Note:** This is where the metaphysics kicks in. It suggests that until a mathematician has constructed a proof, the statement is neither true nor false—it is indeterminate.

  ### 4. The Ontological Reading (Existential)
  **The Claim:** "To say a mathematical object exists is to say that a mental construction of it has been completed. Since your proof provides no construction, the statement 'the object exists' has no meaning."

  *   **Plausibility:** This is the core tenet of Brouwer's Intuitionism. It redefines the verb "to exist."
  *   **Contentiousness:** Extremely high. It redefines the subject matter of mathematics itself.
  *   **Does it license rejecting the proof?** Yes, decisively. Under this reading, your proof doesn't just fail to prove existence; it proves something else entirely (namely, that the *assumption of non-existence* leads to a contradiction). But since "existence" requires a witness, you haven't proved existence. You have proved $\neg \neg \exists x$, which is not the same as $\exists x$.
  *   **Novelist's Note:** This is the most passionate reading. For the early 20th-century constructivist, mathematics was a languageless activity of the mind. A proof that didn't construct the object was literally nonsense.

  ---

  ### Which reading was your friend relying on?

  Given that your friend has "constructivist sympathies" and interrupted you "as if that settled the matter," he was most likely relying on a blend of **Reading 2 (Methodological)** and **Reading 4 (Ontological)**.

  He was not merely telling you that your proof is invalid in a specific formal system (Reading 1); he was implying that the proof is **defective as a piece of mathematics**. For a sympathizer, the failure of LEM is not just a technical rule; it is a safeguard against empty rhetoric.

  When he said "LEM doesn't hold," he was shorthand for: *"You cannot infer existence from the impossibility of non-existence, because existence requires presentation, not just consistency."*

  ### Did that reading do the work he wanted it to do?

  **Internally:** Yes. Within the constructivist framework, his objection is fatal to your proof. The proof establishes that the non-existence of the object is contradictory, but it does not produce the object. If "to exist" means "to be constructed," the proof fails.

  **Externally:** No. If you are a classical mathematician (or a realist), his objection begs the question. You believe LEM *does* hold because you believe mathematical truths are objective and bivalent. To you, his claim that "LEM doesn't hold" sounds like saying, "I don't believe in your conclusion, so I won't accept your rules of inference."

  ### Historical Context for Your Novel

  Since you are writing about the early twentieth century, this distinction is vital. In the 1920s, this was not a polite disagreement; it was a crisis.

  *   **Hermann Weyl**, a prominent mathematician, famously defected to Brouwer's camp for a time, describing classical mathematics as "built on sand" and non-constructive existence proofs as "paper money" not backed by the "gold" of construction.
  *   **David Hilbert**, defending classical mathematics, said that banning LEM would be like "prohibiting the boxer from using his fists" or "wanting to forbid the astronomer the use of a telescope."

  When your logician friend says "LEM doesn't hold," he is echoing Brouwer. When you feel confused about why that settles the matter, you are echoing Hilbert (or the majority of modern mathematicians).

  For your character, the tension lies here: The classical mathematician sees the proof as a map of a territory that exists regardless of whether we have walked it. The constructivist sees the proof as a claim to have built a house, and points out that you have only proved that the land is not empty, without laying a single brick. Both are logically consistent within their own definitions of "truth" and "existence," but they are talking past one another. That misunderstanding is fertile ground for a novel.
