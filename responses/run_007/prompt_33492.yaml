answer: |-
  This is a fantastic question. You have correctly identified that the literature on the paradox of self-amendment (often called the "Ross Paradox" or the "Amendment Paradox") has reached a reflective equilibrium where the arguments are well-known, entrenched, and mutually unconvincing.

  To diagnose this: **This is not a substantive logical question that can be settled by a better formal argument, nor is it merely a verbal dispute.** It is a **clash of ontological models** regarding the nature of legal systems.

  The stalemate exists because the two sides are making different category errors about what law *is*. One side treats law as a closed logical system (where the paradox is fatal); the other treats law as a dynamic social practice (where the paradox is irrelevant).

  Here is a breakdown of why the debate is frozen, what kind of disagreement it actually is, and whether there is any path forward.

  ### 1. The Diagnosis: Ontology, Not Logic

  If this were purely a logical problem, deontic logic (the logic of obligation and permission) would have solved it by now. In the 1960s and 70s, logicians like Von Wright tried to formalize this. They found that you *can* model self-amendment without contradiction if you introduce temporal operators or distinguish between the *act* of amending and the *norm* being amended.

  However, legal theorists like Ross and Suber aren't satisfied with those solutions, and practitioners like Hart (implicitly) ignore them. Why?

  **The disagreement is about the source of normative validity.**
  *   **The Ross/Suber Camp (Logical Coherence):** They assume that for a legal rule to be valid, it must be derivable from a prior valid rule without a logical gap. They view the legal system as a **static hierarchy of norms**. If the bridge (the amendment clause) is burned while you are crossing it, you fall. To them, the paradox reveals that legal validity cannot be purely self-referential.
  *   **The Hart/Kelsen Camp (Social Fact/Continuity):** They assume that legal validity is ultimately grounded in social fact (Hart's *Rule of Recognition*) or a presupposed basic norm (Kelsen's *Grundnorm*). To them, the legal system is a **dynamic process**. The "validity" of the new amendment rule doesn't come from the old rule's logical permission; it comes from the fact that the legal community *accepts* the change as valid.

  **The Freeze:** The debate is frozen because the "Logical" side demands a justification that the "Social" side says is unnecessary, and the "Social" side offers an explanation the "Logical" side says is question-begging.
  *   Ross asks: "By what *right* does the new rule exist?"
  *   Hart answers: "By the *fact* that everyone treats it as existing."
  *   Ross replies: "That explains efficacy, not validity."
  *   Hart replies: "In law, efficacy *constitutes* validity at the foundational level."

  They are talking past each other because they define "validity" differently. For Ross, validity is **logical derivability**. For Hart, validity is **systemic acceptance**.

  ### 2. Is it a Verbal Dispute?

  Partially, but not trivially. The word "validity" is doing too much work.
  *   If validity means "logically consistent with prior norms," Ross wins. Self-amendment is logically suspect.
  *   If validity means "binding within the social system," the critics win. Self-amendment happens constantly and is binding.

  However, calling it "merely verbal" dismisses the stakes. The stakes are about **revolution vs. continuity**.
  *   If Ross is right, every time a constitution amends its own amendment procedure, it is technically a **legal revolution**. The old system died, and a new one began. There is a discontinuity.
  *   If Hart is right, it is **legal continuity**. The system persists through the change.

  This isn't just semantics; it determines how we judge the legitimacy of constitutional transformations. If you are a originalist or a strict formalist, Ross's view is terrifying because it suggests the "chain of title" for the constitution is logically broken. If you are a living constitutionalist, Hart's view is comforting because it allows the system to evolve without "dying."

  ### 3. Why Formal Arguments Won't Settle It

  You asked if someone could settle this with the "right formal argument." The answer is almost certainly no.

  Formal systems (like Dynamic Deontic Logic) *can* model self-amendment without contradiction. For example, you can posit a "super-rule" that validates changes to sub-rules, including itself. But this just pushes the paradox back one step (who validates the super-rule?).

  Suber's great contribution in *The Paradox of Self-Amendment* was to show that you can construct logical systems where self-amendment is valid, but they require axioms that legal systems don't actually possess. Conversely, you can construct systems where it's invalid, but they don't match reality.

  **The formal tools are sufficient; the premises are the problem.** No amount of logic can force a legal positivist to admit that social fact isn't the ultimate ground of law, and no amount of sociology can force a logician to admit that "is" implies "ought."

  ### 4. Is There a Path Forward?

  The debate is frozen in *mainstream* jurisprudence because the mainstream accepted Hart's solution: **Law is not a closed logical system.** Most theorists decided the paradox was a "pseudoproblem" created by treating law like math.

  However, there are three avenues that could unfreeze it, though none promise a "solution" in the traditional sense:

  **A. The Institutional Theory of Law (MacCormick & Weinberger)**
  This approach argues that law is an "institutional fact." It bridges the gap between logic and reality. It suggests that legal rules create "institutional realities" that persist even if their logical foundation shifts. This doesn't solve the paradox but dissolves it by changing the ontology. It's the most sophisticated version of the Hartian response.

  **B. Experimental Jurisprudence**
  Instead of arguing about what validity *should* mean, we could ask what legal actors *think* it means. Do judges feel they need logical continuity? Empirical work on how courts reason through amendment cases could show whether the "paradox" exerts any psychological or rhetorical pressure. (Spoiler: It usually doesn't, which supports Hart, but doesn't refute Ross's normative concern).

  **C. Accepting the "Revolutionary" Thesis**
  Some modern theorists (like Akhil Amar in the US context, or certain European constitutionalists) have started to embrace the Rossian implication. They argue that major amendments *are* quasi-revolutionary acts that rely on "popular sovereignty" rather than the prior text. This moves the debate from "Is this logically possible?" to "Where does the extra-legal authority come from?" This is perhaps the most productive shift: admitting the logic breaks and asking where the political power comes from to bridge the gap.

  ### Conclusion

  The disagreement is a **deep methodological clash** disguised as a logical puzzle.
  *   **Ross/Suber** are asking: "Can a system justify itself purely internally?" (Answer: No.)
  *   **Hart/Critics** are asking: "Do legal systems function successfully despite lacking pure internal justification?" (Answer: Yes.)

  **Will it move?**
  It will not be "solved." It is like the mind-body problem in philosophy of mind. You can be a dualist (Ross) or a materialist (Hart), but you can't prove the other wrong because you start from different first principles.

  The only way to move it is to stop asking "Is self-amendment logically valid?" and start asking "What are the political and normative costs of treating self-amendment as a logical break vs. a continuous process?" That shifts the debate from **logic** to **legitimacy**, which is where the actual action is.

  If you are writing on this, the most fertile ground isn't trying to solve the paradox, but analyzing *why* legal systems work so hard to hide the paradox (e.g., by drafting amendment clauses that look continuous even when they aren't). The paradox isn't a bug in legal theory; it's a feature of legal authority that relies on a "noble lie" of continuity.
