      *   **Audience:** 25 philosophers.
          *   ~12-13: Mainstream physicalists/functionalists (skeptical of panpsychism, care about empirical distinguishability).
          *   3-4: Metaphysicians (grounding/fundamentality experts, sympathetic to apparatus but skeptical of application).
          *   2: Dualists (think panpsychism = physicalism + extra problems).
          *   1: Philosopher of Physics (cares about "fundamental entities" and QFT compatibility).
