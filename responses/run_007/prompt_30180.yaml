answer: |-
  This is a classic interpretive crux in Hume scholarship. The tension you identify is central to understanding Hume's contribution to monetary theory: he is simultaneously articulating the Quantity Theory of Money (which implies long-run neutrality) while describing a transmission mechanism that relies on short-run *non*-neutrality.

  To answer your specific question: Hume is **not** arguing for literal, instantaneous neutrality in this sentence. He is making a claim about **comparative statics in long-run equilibrium** to refute the Mercantilist identification of money with wealth. However, to see why, we must disentangle the rhetorical work of the analogies from the theoretical claim.

  Here are two possible readings of that third sentence, followed by an analysis of which best fits Hume's broader project.

  ### Reading 1: The Strong Neutrality (Veil) Interpretation
  On this reading, Hume is asserting that money is a pure veil. The phrase "prices of commodities are *always* proportioned to the plenty of money" is taken temporally literally.

  *   **The Claim:** An increase in the money stock leads to an immediate, proportional increase in prices. There is no lag, no "interval," and no effect on real variables (output, employment, industry) at any stage.
  *   **The Work of the Analogies:**
      *   **Oil-and-Wheels:** This suggests money is purely passive. Just as adding more oil to a machine does not make the machine produce more work (it merely reduces friction), adding more money does not increase real wealth.
      *   **Harry VII Example:** This serves as empirical proof. Since a crown then bought what a pound buys now, the *nominal* amount is irrelevant; only real purchasing power matters.
  *   **Implication for Adjustment:** On this reading, the adjustment process is instantaneous. The "no consequence" claim applies to the transition period as much as the end state.

  ### Reading 2: The Long-Run Equilibrium (Comparative Statics) Interpretation
  On this reading, Hume is distinguishing between the *absolute level* of the money stock and the *dynamics* of its change. He is arguing that once the economy settles, the absolute quantity of money is irrelevant to real wealth, but he is not denying that the *process* of reaching that settlement has real effects.

  *   **The Claim:** The "no consequence" claim applies to the *state* of having more money, not the *act* of increasing it. The word "always" refers to the structural relationship between money and prices in equilibrium, not the temporal speed of adjustment.
  *   **The Work of the Analogies:**
      *   **Oil-and-Wheels:** This defines the *function* of money (facilitation of exchange), distinguishing it from capital (the wheels). It argues money is not a factor of production. It does not necessarily dictate the *dynamics* of fluid flow (which could be turbulent or slow).
      *   **Harry VII Example:** This is a comparison of two distinct historical equilibria. It illustrates that a high-price economy (1750s) can be just as wealthy as a low-price economy (1500s), provided real output is similar.
  *   **Implication for Adjustment:** This reading allows for the "interval" Hume famously discusses later in the essay. The "no consequence" claim is a boundary condition: once prices have fully adjusted, the extra money has done no good.

  ### Analysis and Verdict

  **Reading 2 is the correct interpretation.**

  While Reading 1 captures the surface grammar of "always proportioned," it renders the rest of *Of Money* (and *Of the Balance of Trade*) incoherent. If Hume believed in Reading 1, his famous argument regarding the influx of gold stimulating industry would be impossible. He explicitly writes later in *Of Money*:

  > "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the encreasing quantity of gold and silver is favourable to industry."

  If Reading 1 were true, this "interval" would not exist. Therefore, the third sentence of the opening paragraph must be read as establishing the **long-run neutrality of money** to clear the ground for his argument about **short-run non-neutrality**.

  Here is precisely how the components of the argument function on Reading 2:

  **1. The Oil-and-Wheels Analogy**
  This does the work of **categorization**, not **dynamics**. Hume is attacking the Mercantilist error of treating money as a "wheel of trade" (i.e., capital or wealth itself). By calling it "oil," he is saying money is a social technology for reducing transaction costs.
  *   *Why this supports Reading 2:* Oil facilitates motion, but the *amount* of oil in the reservoir doesn't determine the speed of the wheels (that is determined by the engine/labor). Similarly, the *stock* of money doesn't determine real wealth (that is determined by labor/commodities). This establishes that money is not a real resource, which is a prerequisite for long-run neutrality.

  **2. The "Prices Always Proportioned" Claim**
  This does the work of **equilibrium definition**. When Hume says "always," he means "systematically" or "in the nature of the relation," not "instantaneously."
  *   *Why this supports Reading 2:* He is invoking the Quantity Theory as a law of equilibrium. He is arguing that you cannot fool the economy forever. If you double the money, prices will *eventually* double. The Harry VII comparison confirms he is thinking in terms of historical epochs (long-run states), not daily market fluctuations.

  **3. The "No Consequence" Claim**
  This is the specific target of your inquiry. On Reading 2, "no consequence" means **no permanent consequence for real wealth.**
  *   Hume is arguing against the idea that a nation with more money is inherently richer than a nation with less money *ceteris paribus*.
  *   He is *not* arguing that an *injection* of money has no consequence. In fact, his later argument relies on the injection having a *positive* consequence (stimulating industry) before the "no consequence" equilibrium (higher prices) sets in.

  ### Connection to *Of the Balance of Trade*

  This interpretation is vital for linking *Of Money* to *Of the Balance of Trade*. In the latter essay, Hume develops the specie-flow mechanism. The mechanism relies on the premise established in Reading 2:
  1.  Money influx raises domestic prices (Long-run neutrality/Quantity Theory).
  2.  Higher prices make exports uncompetitive.
  3.  Money flows out until prices equalize with neighbors.

  If Hume held Reading 1 (instantaneous adjustment), the specie-flow mechanism would still work, but the *political* lesson would be different. The political lesson Hume wants to teach is that while you *can't* permanently hoard money (Reading 1/2 overlap), the *attempt* to do so or the *flow* itself stimulates industry in the short run (Reading 2 exclusive).

  ### Conclusion

  Hume is making a **narrower claim about the irrelevance of the absolute size of the money stock once prices have adjusted.**

  He uses the **oil analogy** to strip money of its status as "wealth" (refuting Mercantilism), and the **Harry VII example** to illustrate that price levels are relative and historical, not absolute indicators of prosperity. The phrase "prices... are always proportioned" is a statement of the long-run equilibrium condition, not a denial of the short-run transmission lag. He establishes this long-run neutrality precisely so he can highlight the significance of the short-run deviation in the paragraphs that follow.
