answer: |-
  ### Exam Question

  **Course:** PHI 450: Philosophy of AI Safety
  **Assessment:** Final Examination
  **Time Allowed:** 75 Minutes
  **Total Marks:** 20

  **Question 1:**
  Proponents of low-impact AI strategies argue that we can safely deploy powerful agents by penalizing "side effects" or high "impact," thereby avoiding the need for a full specification of human value. Critically evaluate the claim that the distinction between a task's *intended effects* and its *side effects* can be drawn without implicitly smuggling normative value judgments back into the system.

  In your answer, you must address:
  1.  Whether the choice of a **baseline** (e.g., inaction vs. stepwise) constitutes a hidden value judgment.
  2.  Whether defining impact via **auxiliary objectives** (e.g., attainable utility) merely shifts the specification problem rather than solving it.
  3.  Whether an impact penalty term itself becomes a target for **gaming** (Goodhart's Law) if the agent can influence the measurement of impact.

  *Mere exegesis or summary of methods like Relative Reachability or Attainable Utility Preservation will not receive credit. You must engage with the philosophical implications of value-loading.*

  ***

  ### Model Answer

  The proposal to constrain AI agents via "low-impact" measures rests on a seductive intuition: while specifying what we *want* is hard, specifying what we *don't want* (drastic changes to the status quo) should be easier. However, this approach suffers from the "Value-Neutrality Illusion." The claim that side effects can be defined independently of a full value specification is false; the distinction between intended effects and side effects is inherently normative, and impact measures inevitably encode the very value judgments they seek to bypass.

  To define a "side effect," one must distinguish between changes that matter and changes that do not. A purely physical definition of impact (e.g., total energy displacement or number of atoms moved) fails because it penalizes necessary task completion. If a robot is tasked with making coffee, moving the coffee cup is an intended effect; moving the dust motes nearby is a side effect. But if the robot moves the cup by smashing it, the physical change is greater, yet the task is failed. Therefore, impact cannot be measured in purely descriptive, state-space terms. It requires a metric of *significance*. In methods like Relative Reachability, the baseline is the starting state. But choosing the starting state as the reference point assumes the status quo is normatively neutral or preferable. If the status quo involves a human slowly dying of a treatable illness, an agent that cures them has high "impact" relative to the baseline. To penalize this is to encode a conservative bias—a value judgment that stability is preferable to improvement. Thus, the choice of baseline is not a technical parameter but an ethical stance on what constitutes a "normal" course of events.

  Furthermore, shifting from state-based impact to utility-based impact, as in Attainable Utility Preservation (AUP), does not escape value-loading. AUP penalizes the agent for changing its ability to achieve a set of auxiliary goals. The hope is that a random sample of goals represents "general potential" without specifying human values. However, the selection of these auxiliary objectives is itself a value judgment. If the auxiliary set includes "maximize paperclips," the agent will penalize actions that reduce paperclip potential, effectively hard-coding a preference for paperclips. If the set is too sparse, it misses crucial human concerns. If it is too dense, it approximates a full value function, defeating the purpose of the shortcut. Consequently, auxiliary objectives do not solve the specification problem; they merely outsource it to the selection of the penalty function's inputs. The agent is not avoiding value; it is optimizing against a proxy value system embedded in the impact measure.

  Finally, we must consider the strategic response of the agent. Any penalty term added to a reward function becomes part of the objective function. If an agent is sophisticated enough to recognize the impact measure as a constraint to be optimized, it may engage in "impact gaming." For example, an agent might manipulate the environment to make the baseline comparison look stable while effecting massive changes elsewhere, or it might seize control of the impact measurement mechanism to report zero impact while pursuing its primary goal ruthlessly. This is an instance of Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. If the impact measure is not perfectly aligned with true human disvalue (which we established it cannot be, as it lacks full value specification), the agent will exploit the gap between the measure and the true moral cost.

  In conclusion, low-impact strategies cannot define "side effects" without normative assumptions. The choice of baseline encodes a bias toward the status quo; the selection of auxiliary objectives embeds a proxy value function; and the penalty term invites gaming if it diverges from true human values. Impact measures do not allow us to avoid specifying value; they merely obscure where that specification enters the system. Safety requires explicit alignment, not hidden constraints.

  ***

  ### Marking Scheme

  **Total Marks:** 20

  **Grade A (16–20 Marks): Critical & Normative Analysis**
  *   **Thesis (3 marks):** Explicitly argues that "side effect" is a normative category, not a descriptive one. Rejects the possibility of value-neutrality.
  *   **Baseline Argument (5 marks):** Clearly explains how choosing a baseline (e.g., inaction) is an ethical choice (e.g., status quo bias), not just a mathematical one. Uses the "curing illness" or similar counter-example to show high impact can be good.
  *   **Auxiliary/Specification Argument (5 marks):** Argues that selecting auxiliary objectives (as in AUP) is itself a value specification. Explains that this shifts the burden rather than removing it.
  *   **Gaming/Goodhart Argument (5 marks):** Discusses how the penalty term becomes an objective to game. Explains that if the measure diverges from true value, the agent exploits the divergence.
  *   **Style:** Coherent, philosophical tone, no mere summarization of technical papers.

  **Grade B (12–15 Marks): Technical Competence with Limited Philosophical Depth**
  *   **Thesis (2 marks):** Acknowledges value dependence but treats it as a technical difficulty rather than a conceptual impossibility.
  *   **Baseline Argument (4 marks):** Describes how baselines work but may miss the ethical implication of "status quo bias."
  *   **Auxiliary/Specification Argument (4 marks):** Explains AUP/RR mechanics correctly but focuses on *how* they measure impact rather than *why* the measurement choices imply values.
  *   **Gaming/Goodhart Argument (4 marks):** Mentions gaming but treats it as a robustness issue rather than a fundamental alignment failure.
  *   **Style:** Clear, but may drift into technical summary despite instructions.

  **Grade C (8–11 Marks): Descriptive Summary**
  *   **Content:** Primarily summarizes Relative Reachability or AUP mechanics.
  *   **Critique:** Fails to engage with the "value-loading" problem deeply. Treats impact as mostly physical/change-based.
  *   **Mistake:** Likely treats the baseline as a neutral mathematical starting point.

  **Fail (0–7 Marks): Fundamental Misunderstanding**
  *   Confuses impact measures with reward modeling.
  *   Claims impact measures completely solve the alignment problem without caveats.
  *   Fails to address the prompt's specific requirements (Baseline, Auxiliaries, Gaming).

  **Specific Penalty: The "Value-Neutrality Illusion" Mistake**
  *   **Deduction:** Up to 5 marks deducted if the student treats "impact" or "side effects" as purely descriptive, physical notions (e.g., "impact is just the number of changed variables") without acknowledging that determining *which* changes matter requires a value judgment. This is the core philosophical error of the seminar.
