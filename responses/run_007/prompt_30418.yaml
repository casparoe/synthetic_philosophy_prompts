      *   *Step 5: The Hierarchy/Location Check.* Does it move rules between sections with different statuses?
      *   *Step 6: The Judgment Handoff.* Where do we stop and ask a lawyer/member?

      *Refining Step 3 (The Bootstrapping):* This is the hardest part for non-lawyers. The key insight from Nomic/legal theory is that the *current* rule governs the change. You cannot use the *new* rule to enact the *new* rule unless the *current* rule allows you to switch tracks. If the current rule says "2/3 vote", you need 2/3 vote to change it to "majority". You cannot use a "suspension by majority" rule to bypass the specific amendment rule unless the amendment rule itself says "unless suspended". Usually, specific amendment rules trump general suspension rules.
      *Refining Step 4 (Entrenchment):* If the constitution says "Any rule may be amended by 2/3", then a clause saying "This rule may never be amended" is logically void unless the 2/3 rule has an exception. The procedure needs to catch this contradiction.
      *Refining Step 5 (Renumbering):* If Rule 12 (amendments) moves to Rule 2 (Purposes), and Rule 2 is entrenched, does the amendment process become entrenched? This is a judgment call on intent vs. text.

  4.  **Developing the Reasoning/Background:**
      *   Explain *why* each step exists based on self-reference paradoxes.
