answer: |-
  # CONSTITUTIONAL AMENDMENT DECISION PROCEDURE

  **Instructions:** Run these steps in order. If any step results in a "STOP," the proposal must not be placed on the ballot without external legal review or revision. If a step results in "HANDOFF," the committee must vote on whether to consult external counsel or defer to the membership with a warning.

  ### STEP 1: The Contradiction Check
  **Question:** Does the text of the proposal explicitly state something that is logically impossible to comply with alongside existing, unamended text? (Example: Proposal says "Meet in January" while existing text says "Meet in July" without repealing the existing text.)
  *   **If YES:** **STOP.** Reject the proposal. It creates immediate invalidity.
  *   **If NO:** Proceed to Step 2.

  ### STEP 2: The Self-Amendment Loop (The Bootstrapping Check)
  **Question:** Does this proposal change the rules for how amendments are made (e.g., voting thresholds, notice periods, who can vote)?
  *   **If NO:** Proceed to Step 3.
  *   **If YES:** Ask the follow-up: **Does the method used to adopt this proposal meet the *current* amendment requirements, ignoring any general "suspension" rules?**
      *   *Instruction:* Do not count a general rule allowing "suspension by majority vote" as sufficient to bypass a specific "amendment by 2/3 vote" requirement.
      *   **If NO (it relies on suspension or the new lower threshold to pass itself):** **STOP.** Reject the proposal. A rule cannot use a shortcut to change the rule that forbids shortcuts.
      *   **If YES (it meets the current, higher threshold):** Proceed to Step 3.

  ### STEP 3: The Entrenchment Check
  **Question:** Does this proposal declare any clause (including itself) to be unamendable, permanent, or immune to repeal?
  *   **If NO:** Proceed to Step 4.
  *   **If YES:** Ask the follow-up: **Does the *current* constitution explicitly allow for unamendable clauses?**
      *   *Instruction:* Check the existing amendment article. If it says "Any article may be amended," you do not have the power to create an unamendable one.
      *   **If NO (current constitution allows amendment of all parts):** **STOP.** Reject the proposal. A majority cannot bind a future majority unless the current rules explicitly allow them to do so.
      *   **If YES (current constitution allows entrenchment):** Proceed to Step 4.

  ### STEP 4: The Relocation Check **[JUDGMENT CALL]**
  **Question:** Does this proposal move text from one section of the constitution to another section that has a different legal status (e.g., moving an operational rule into a "Statement of Purposes" section that is traditionally treated as foundational or entrenched)?
  *   **If NO:** Proceed to Step 5.
  *   **If YES:** **HANDOFF.** The committee must decide if this is cosmetic or substantive.
      *   *Reasoning:* Moving a rule does not usually change its legal effect, but moving it into a protected section creates ambiguity about whether it inherits that protection. This is not a mechanical check; it requires interpreting intent.

  ### STEP 5: The Supremacy Check **[JUDGMENT CALL]**
  **Question:** Does this proposal insert a clause stating it "prevails over anything inconsistent" or similar supremacy language?
  *   **If NO:** **PASS.** Recommend for ballot.
  *   **If YES:** **HANDOFF.** The committee must decide if this creates a hierarchy conflict.
      *   *Reasoning:* Supremacy clauses are standard, but if a new clause claims supremacy over the amendment process itself without following the amendment process, it is a paradox. If it merely claims supremacy over operational bylaws, it is likely safe. This requires judgment on scope.

  ***

  # REASONING BEHIND THE STEPS

  This procedure is grounded in the logic of self-referential systems (like the game Nomic) and legal theory regarding the "Rule of Recognition." The core problem is that a constitution is a machine that builds itself. If you hand the machine a blueprint to rebuild itself, you must ensure the machine uses its current operating instructions to read the blueprint, not the instructions on the blueprint itself.

  **Step 1 (Contradiction):** This addresses basic logical consistency. A constitution that says "X" and "Not X" simultaneously is voidable. Non-lawyers can spot explicit textual conflicts.

  **Step 2 (Self-Amendment Loop):** This is the critical defense against "bootstrapping." In legal theory, the validity of an amendment derives from the *existing* constitution, not the proposed one. If the current constitution requires a 2/3 vote to amend, you cannot use a 1/2 vote suspension rule to change the requirement to 1/2. If you could, any faction could seize the constitution by simply proposing a lower threshold and passing it with a simple majority. This step enforces the principle that the *old* rule governs the birth of the *new* rule.

  **Step 3 (Entrenchment):** This addresses the paradox of sovereignty. A current majority cannot bind a future majority unless the current rules explicitly allow them to surrender that power. If the current constitution says "Any article may be amended," the power to amend is unlimited. A proposal saying "This article may never be amended" contradicts the unlimited power granted by the current text. It is logically void because the authority creating the clause (the amendable constitution) does not have the authority to create unamendable clauses.

  **Step 4 (Relocation):** This is marked as a **Judgment Call** because text moving does not always change legal effect, but context matters. In some societies, the "Purposes" section is treated as sacred. Moving the amendment rule there might be an attempt to implicitly entrench it without saying so. The procedure cannot mechanically determine intent, so it flags this for human judgment.

  **Step 5 (Supremacy):** This is marked as a **Judgment Call** because supremacy clauses are common and often necessary to resolve conflicts. However, a clause that claims supremacy over the *constitution itself* is a paradox (it tries to stand above the document it is inside). The committee must judge whether the supremacy claim is limited to lower-level bylaws (acceptable) or attempts to override the amendment process (unacceptable).

  ***

  # WHAT THE PROCEDURE CANNOT SETTLE

  1.  **Implicit Entrenchment:** If a proposal does not say "unamendable" but makes amendment practically impossible (e.g., requiring 99% vote), Step 3 may not catch it. This requires political judgment.
  2.  **Ambiguous Text:** If the proposal is poorly drafted but not logically contradictory, this procedure will pass it. It checks logic, not clarity.
  3.  **External Law:** This procedure checks internal consistency only. It cannot detect if the amendment violates state nonprofit law or federal regulations.
  4.  **Intent vs. Effect:** As noted in Steps 4 and 5, the procedure cannot determine if a relocation or supremacy clause is a good-faith cleanup or a power grab. It flags them for judgment but does not resolve them.

  ***

  # WORKED APPLICATIONS

  ### Case 1: The Threshold Lowering via Suspension
  **Proposal:** Lower amendment threshold from 2/3 to Simple Majority.
  **Method:** Enactment via standing rule allowing convention to suspend any rule by Simple Majority.
  **Committee Preference:** Supports the change.

  *   **Step 1 (Contradiction):** Pass. No explicit textual contradiction in the final state.
  *   **Step 2 (Self-Amendment Loop):**
      *   *Question:* Does this change how amendments are made? **YES.**
      *   *Follow-up:* Does the method meet *current* amendment requirements, ignoring suspension? **NO.**
      *   *Analysis:* The current amendment rule requires 2/3. The proposal uses a general suspension rule (Majority) to bypass the specific amendment rule. According to Step 2 instructions, general suspension cannot override specific amendment requirements.
      *   *Result:* **STOP. REJECT.**
      *   *Reasoning:* The procedure correctly identifies the bootstrapping paradox. You cannot use the new threshold (or a shortcut to it) to enact the new threshold. You must use the 2/3 vote required *now* to change the rule to majority.

  ### Case 2: The Unamendable Supremacy Clause
  **Proposal:** New clause stating it may never be amended/repealed and any inconsistent rule is void.
  **Current Constitution:** States "Any article of this Constitution may be amended by a 2/3 vote."

  *   **Step 1 (Contradiction):** Pass.
  *   **Step 2 (Self-Amendment Loop):** Pass (Does not change threshold).
  *   **Step 3 (Entrenchment):**
      *   *Question:* Does it declare itself unamendable? **YES.**
      *   *Follow-up:* Does current constitution allow unamendable clauses? **NO.**
      *   *Analysis:* The current constitution says "Any article... may be amended." This grants unlimited amendment power. The proposal tries to limit that power.
      *   *Result:* **STOP. REJECT.**
      *   *Reasoning:* The procedure catches the logical contradiction. A rule derived from a sovereign power ("We can change anything") cannot be used to destroy that sovereign power ("You can't change this") unless the sovereign power explicitly allowed for its own destruction in the first place.

  ### Case 3: The Renumbering Relocation
  **Proposal:** Renumber rules so Amendment Rule (currently Rule 12) moves to Rule 2 slot. Rule 2 is titled "Statement of Purposes" and is historically treated as foundational.
  **Current Constitution:** Rule 2 has no explicit legal entrenchment, but members treat it as sacred. Rule 12 contains the amendment process.

  *   **Step 1 (Contradiction):** Pass.
  *   **Step 2 (Self-Amendment Loop):** Pass.
  *   **Step 3 (Entrenchment):** Pass (No explicit "unamendable" language).
  *   **Step 4 (Relocation):**
      *   *Question:* Does this move text to a section with different status? **YES.**
      *   *Analysis:* It moves the operational amendment rule into the "Purposes" slot.
      *   *Result:* **HANDOFF.**
      *   *Reasoning:* The procedure cannot mechanically decide if moving the amendment rule into the "Purposes" slot implicitly entrenches it. Does Rule 12 keep its nature (amendable by 2/3) or inherit Rule 2's nature (sacred/foundational)? This is a judgment call on member intent and potential future confusion. The committee must vote on whether to allow this ambiguity or demand clarification.
