      *   **Entrenchment:** Can a rule bind the future? (e.g., "This clause can never be changed"). Legally/Logically, a future majority can usually ignore this unless the current constitution explicitly allows for unamendable clauses. If the constitution allows amendments to *any* part, an "unamendable" clause is self-contradictory.
      *   **Supremacy:** Can a clause declare itself supreme over inconsistencies? This is standard (supremacy clause), but if it claims supremacy over the *amendment process* itself without following the amendment process, it's problematic.
      *   **Renumbering/Location:** Does moving a rule change its status? If Rule 12 (amendments) moves to Rule 2 (Purposes, entrenched), does it inherit the entrenchment? Or does it carry its own procedure? This is a conflict of rules.

