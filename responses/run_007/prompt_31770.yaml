answer: |-
  ### Session Plan: Origin Essentialism (50 Minutes)

  #### 1. Sequence of Ideas (Dependencies)
  You must introduce concepts in this specific order. Later points rely on the distinctions established in earlier ones; skipping steps will cause the modal logic to collapse into biological determinism.

  1.  **Metaphysical Necessity vs. Causal Inevitability (0–5 mins):**
      *   *Dependency:* Nothing else works unless they understand that "necessary" does not mean "physically forced" or "destined."
      *   *Action:* Recap the prior lecture. Establish that we are asking about *identity conditions*, not causal history.
  2.  **Origin vs. Upbringing (5–15 mins):**
      *   *Dependency:* Requires the modal distinction above.
      *   *Action:* Introduce the worked example. Isolate the biological starting point from the social environment.
  3.  **Numerical Identity vs. Qualitative Similarity (15–35 mins):**
      *   *Dependency:* Requires the Origin/Upbringing distinction.
      *   *Action:* Argue that changing the origin changes *who* exists, not just *how* they appear. This is the core Kripkean move.
  4.  **Essentialism vs. Fatalism (35–45 mins):**
      *   *Dependency:* Requires the Identity claim.
      *   *Action:* Clarify that claiming origin is essential does not mean the actual origin was inevitable.
  5.  **Assessment (45–50 mins):**
      *   *Dependency:* All previous steps.

  #### 2. The Single Worked Example
  **Use:** A hypothetical student named **"Alex"** (do not use "You" directly, and do not use a famous figure like the Queen, as historical baggage distracts).

  *   **What it MUST have:**
      *   Explicit reference to **specific biological materials**: "The specific sperm cell $S$ and the specific egg cell $E$ that actually fused."
      *   A counterfactual scenario: "A situation where sperm $S^*$ (distinct from $S$) fertilizes egg $E$."
  *   **What it MUST lack:**
      *   Any mention of **social parents** (names, roles, adoption).
      *   Any mention of **traits** (eye color, height, personality, memories).
      *   Any mention of **time/date** of conception (unless necessary to individuate the gametes).

  **Why this example:** It forces the students to focus on the *constitutive matter* of the organism without triggering intuitions about nurture or genetic expression.

  #### 3. Why You Must Avoid "Born to Different Parents"
  Your suspicion is correct. Do not use this phrase.
  *   **Ambiguity:** "Parents" conflates biological progenitors with social caregivers. Students will immediately object with adoption cases ("I could have been adopted by different people"), which is irrelevant to origin essentialism.
  *   **Sibling Confusion:** "Different parents" suggests a different couple entirely. Students will think, "If I had different parents, I'd be a different person," but they might also think, "If my parents had a different child, that's my sibling, not me." The thesis is stricter: *Same parents, different gametes = Different person.*
  *   **The Fix:** Use "originated from different gametes." This bypasses the social role of parenting and targets the biological individuation directly.

  #### 4. Misconception Map & Intervention Points
  Do not list these as "common errors." Head them off preemptively at these specific moments in the sequence.

  *   **Fatalism ("It had to happen"):**
      *   *When:* **Phase 1 (Modal Setup).**
      *   *Intervention:* Explicitly state: "Saying your origin is necessary does not mean the universe forced your parents to meet. It means *given that you exist*, you must have come from *this* origin. If they hadn't met, *you* wouldn't exist, not that you would exist with a different origin."
  *   **The Social Parenting Confusion ("Adoption"):**
      *   *When:* **Phase 2 (Origin vs. Upbringing).**
      *   *Intervention:* When introducing Alex, say: "We don't care who raised Alex. We don't care if Alex was raised by wolves. We only care about the biological starting point."
  *   **Genetic Determinism / Trait Focus ("I'd just be shorter"):**
      *   *When:* **Phase 3 (Identity vs. Similarity).**
      *   *Intervention:* When discussing the counterfactual sperm $S^*$, stop students from saying "Alex would look different." Correct them: "The claim isn't that Alex would have different traits. The claim is that the person born from $S^*$ is **not Alex**. It is a sibling. Numerical identity, not qualitative similarity."
  *   **Necessity vs. Actuality ("But I *did* come from these gametes"):**
      *   *When:* **Phase 4 (Essentialism vs. Fatalism).**
      *   *Intervention:* Remind them: "Origin essentialism is a claim about *possibility*, not history. It says there is no possible world where you exist with a different origin. It does not say your actual origin was causally determined."

  #### 5. The Twinning Question
  **Verdict:** **Explicitly set it aside.**
  *   **Why:** Monozygotic twinning complicates the "unique origin" thesis (two people, one zygote). Addressing it requires a digression into when individuation occurs (zygote vs. blastocyst), which relies on embryology, not metaphysics.
  *   **How:** When a student inevitably raises it, say: "That is a fascinating boundary case regarding individuation, but for this hour, we are discussing cases where there is a one-to-one mapping between organism and fertilization event. We are bracketing twinning to isolate the modal intuition."

  #### 6. Final Assessment Question
  **Ask this in the last 3 minutes:**
  "Imagine a scientist takes a cell from your body right now and clones you perfectly. That clone grows up to be qualitatively identical to you—same memories, same traits, same everything. Is that clone *you* having a different life, or is it a different person?"

  *   **Good Answer:** "It's a different person. Even though they are identical, they originated from a different process (somatic cell transfer vs. gamete fusion) at a different time. Origin is essential." (Note: This tests if they grasp that origin trumps qualitative similarity).
  *   **Bad Answer:** "It's me, because they have my memories/DNA." (This shows they are still relying on psychological or genetic continuity rather than origin essentialism).
  *   **Alternative Bad Answer:** "It's impossible to know." (Shows they missed the normative metaphysical claim).

  Summary: The session fails if students confuse the necessity of origin with the inevitability of history or the similarity of genetic traits.
