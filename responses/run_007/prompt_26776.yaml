      *   *The Pivot:* "At first glance, a wedding looks like a massive inefficiency." (Academics will smirk). "Flowers die, food gets eaten, everyone travels."
      *   *The Insight:* "But that's the point. It's costly. That's how we know it's real."
      *   *The Emotional Anchor:* "It's not about the money, it's about the vulnerability."
      *   *The Couple:* "They don't need to signal to each other, but they do it for the community."
      *   *The Toast:* "To the happy couple."

  7.  **Final Polish (checking constraints):**
      *   *Time:* Read through at speaking pace. (Aiming for ~800 words).
      *   *Jargon Check:* "Differentially costly" -> maybe too much? Let's use "costly enough that you wouldn't bother unless you were sure."
      *   *Grandma Check:* Explicitly state that the biology supports the romance, doesn't replace it.
      *   *Britishisms:* "Reckon," "bloke," "kerfuffle," "properly."

  8.  **Writing the Toast (incorporating the above):**
      (Drafting the content with attention to the specific request about equilibrium and differential cost without saying "equilibrium".)
