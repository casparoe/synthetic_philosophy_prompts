prompt: |-
  I'm giving the best man's toast at my brother's wedding next month. He's an evolutionary biologist who works on costly signalling and the handicap principle — Zahavi, Grafen, honest signals, the lot — and his new wife is a behavioural ecologist, so about half the room will be people who'd catch any slip about whether the signal has to be costly at equilibrium or just differentially costly. The other half are my parents' friends and our cousins, who wont have any idea what any of that means. Write me the toast. It should be built around the handicap principle and it should actually use it: the idea that a wedding — the expense, the public vows, everyone travelling to be here — looks like a pointless waste unless you see it as an honest signal, and thats exactly why it matters. I want it to land as genuinely affectionate, not cynical, and not as a seminar. If my grandmother thinks for one second that I've said marriage is just a peacock's tail, she'll never forgive me. Five minutes, and please write it in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Best Man (brother of the groom).
      *   **Audience:** Mixed. 50% academics (evolutionary biologists/behavioural ecologists) who know the theory deeply (Zahavi, Grafen, costly signalling, equilibrium). 50% laypeople (parents' friends, cousins, grandmother) who need to understand and not be alienated.
      *   **Theme:** The Handicap Principle / Costly Signalling Theory applied to marriage/weddings.
      *   **Key Argument:** A wedding looks like a waste (expense, travel, vows), but that *is* the point. It's an honest signal because it is costly.
      *   **Tone:** Genuinely affectionate, not cynical, not a lecture/seminar. Must avoid reducing marriage to *just* biology (Grandma test).
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).
      *   **Language:** British English.

  2.  **Deconstruct the Science (for accuracy):**
      *   *Handicap Principle (Zahavi):* Signals must be costly to be honest. A peacock's tail is heavy and attracts predators; only a fit male can afford it.
      *   *Differential Cost:* It's not just that it's costly, but that it's *more* costly for a low-quality signaller to produce than a high-quality one.
      *   *Equilibrium:* The signal stabilizes because cheating (signalling without the quality) is too expensive.
      *   *Application to Wedding:* Money, time, emotional vulnerability, public commitment. These are "costs." They prove the commitment is real because faking it would be too "expensive" (socially, financially, emotionally).
      *   *Pitfall to Avoid:* Don't imply the love is *only* a biological trick. The signal *reflects* the underlying quality (love/commitment).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, welcome everyone. Set the scene. Address the split audience immediately but gently.
      *   **The Hook (The Science):** Introduce the brother's work without jargon overload. Use the peacock analogy but pivot quickly to humans.
      *   **The Core Argument (The Wedding as Signal):** Explain *why* we do weddings. It's not just a party; it's a proof of work.
      *   **Addressing the "Grandma Test":** Ensure the emotional core is clear. The signal isn't the love; the signal *proves* the love.
      *   **The Couple:** Connect the theory to [Groom] and [Bride]. Why are they good at this? Their "quality" is high.
      *   **Closing:** Traditional best man wish/toast.

      *   *Self-Correction on Tone:* I need to make sure I don't sound like I'm saying "Marriage is a biological trap." It needs to be "Marriage is so important we built a massive ritual to prove we mean it."
      *   *Self-Correction on Jargon:* Use "costly signalling" but explain it simply. Mention Zahavi/Grafen as a nod to the academics but don't dwell on the math.
      *   *British English:* Check spelling (colour, honour), idioms (knackered, rubbish, bloke), and general cadence.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My brother studies peacocks. He says big tails show you're fit. Weddings are like big tails. We spent a lot of money. That shows we are serious. If we didn't care, we wouldn't spend the money. But don't worry Grandma, we love each other. They are great together. Cheers.
      *Critique:* Too blunt. Too cynical. Needs more warmth and nuance.

  5.  **Drafting - Iteration 2 (Adding Nuance & Warmth):**
      Start with the brother's job. He studies how animals prove they are good mates. Peacocks have heavy tails. It's a handicap. Humans do weddings. It's expensive and stressful. Why? Because it's hard. If it were easy, anyone could do it. The cost makes it honest. But for [Groom] and [Bride], the cost is worth it because their love is real. The science explains the ritual, but the feeling is human.
      *Critique:* Better. Need to ensure the "differential cost" idea is there for the boffins but invisible to the rest. Need to make sure the Grandma line is addressed implicitly by emphasizing emotion over biology.

  6.  **Drafting - Iteration 3 (Refining the Language - British & Affectionate):**
      *   *Opening:* "For those who don't know me..."
