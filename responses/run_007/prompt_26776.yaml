answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s brother.

  Standing here, looking around this room, I'm struck by the sheer logistical effort it took to get us all here. Some of you have flown across continents; others have navigated the M25 on a Friday afternoon, which is arguably more dangerous. We have flowers that will wilt in a week, food that will be eaten in an hour, and a dress that [Groom] is frankly relieved he doesn't have to wear.

  Now, if you asked my brother to explain this rationally, he might hesitate. As many of you know, [Groom] is an evolutionary biologist. He spends his days thinking about why animals do seemingly wasteful things. Specifically, he works on something called the Handicap Principle.

  For the biologists in the room, you know the name Zahavi. For everyone else, think of a peacock. The peacock's tail is heavy, it attracts predators, and it makes flying difficult. It is, by all accounts, a terrible design flaw. Unless you understand that the tail *is* the point. It is a costly signal. It tells the world, "I am so fit, so healthy, and so genetically robust that I can survive *despite* this ridiculous burden."

  It's an honest signal because it is expensive. A weak bird cannot afford the tail.

  And I realised, looking at the spreadsheets for this wedding, that human marriage is the ultimate expression of the same idea.

  From a purely economic standpoint, a wedding is inefficient. But from a signalling standpoint, it is perfect. Because if marriage were easy, if it required no public vow, no gathering of witnesses, no investment of time and resources, then it would be cheap to fake. Anyone could claim commitment without bearing the cost.

  But we don't do that. We make it hard. We make it public. We make it expensive. Not to drain your bank accounts, but to ensure that the signal is honest. The "waste" is actually the value. The fact that [Groom] and [Bride] were willing to organise this kerfuffle, to stand up in front of their community and say, "I am choosing this person above all others," is the proof. It is costly enough that you wouldn't bother unless you were absolutely sure.

  Now, I can hear my grandmother thinking from the back row. She's worrying that I'm saying her grandson's love is just some biological trick, like a peacock showing off.

  Let me be clear: the science explains the ritual, but it doesn't explain the feeling. The Handicap Principle explains why we build the stage, but it doesn't write the script. That part is entirely human.

  The biology suggests that a signal must be differentially costly—that it must be harder for someone *without* the commitment to make the vow than for someone *with* it. And watching [Groom] and [Bride] together, it is obvious that for them, this isn't a burden. It's a privilege.

  [Groom], you have spent your career studying how organisms prove their quality to the world. You know better than anyone that a signal is only as good as the truth behind it. You can't bluff equilibrium. And today, you haven't bluff. You have put your cards on the table.

  [Bride], you are a behavioural ecologist, so you know exactly what he's doing here. You know that he is trying to demonstrate his fitness as a mate by organising a room full of his relatives without crying. I think he's done rather well. But more importantly, you know that while the wedding is the signal, the marriage is the underlying quality. The signal lasts a day; the quality has to last a lifetime.

  To the academics: yes, this is a costly signalling equilibrium.
  To the rest of the family: yes, this is a bloody lovely party.
  And to [Groom] and [Bride]: May your signal remain honest, may your costs be shared, and may your happiness be far greater than the sum of its parts.

  Please raise your glasses. To the happy couple.
