      *   *Mechanism:* Color is suppressed/removed genetically and environmentally.
      *   *Jonas's Experience:* He starts seeing the apple "change." The Giver transmits memories (snow, sunlight, color).
      *   *Nature of Transmission:* It's telepathic/empathic memory transfer, not direct sensory perception of the external world (initially). He sees color *in* the memories first, then starts seeing it in reality.
      *   *Theme:* Choice, pain vs. pleasure, individuality vs. security.

  4.  **Synthesize: The Analogy (Jonas as Mary):**
      *   *Similarities:* Both lack color experience. Both gain something that feels like knowledge/experience beyond facts. Both realize their previous world was incomplete.
      *   *Differences:*
          *   Mary knows *physics*; Jonas knows *nothing* (history/science is suppressed).
