      *   **Where it Breaks (The Nuance):**
          *   *Fact vs. Suppression:* Mary lacks experience but has facts. Jonas lacks both. This makes his revelation bigger but philosophically "messier."
          *   *Memory vs. Perception:* Jonas gets second-hand qualia. Mary gets first-hand. This changes the epistemology.
          *   *The Moral Weight:* For Mary, it's about metaphysics. For Jonas, color is tied to *choice* and *pain*. Seeing color leads to seeing the horror of "Release."
