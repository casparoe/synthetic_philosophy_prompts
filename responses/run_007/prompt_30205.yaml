      *   *Premise:* Mary knows all physical facts about color vision but has lived in a black-and-white room.
      *   *Event:* She leaves and sees red.
      *   *Conclusion (Jackson's original intent):* She learns something new (what it's *like* to see red). Therefore, physicalism is false (there are non-physical facts/qualia).
      *   *Counter-arguments (for balance):* Ability hypothesis (she gains an ability, not knowledge), representationalism, etc.

  3.  **Deconstruct the Literary Text (*The Giver*):**
