answer: |-
  # Decision-Tree Taxonomy: Responses to the Situationist Challenge

  **Instructions:** Start at **Q1**. Answer based on your own assessment of the evidence and the theory, not on which philosopher you think you're supposed to agree with. Follow the branch that matches your view until you reach a **Leaf**.

  ---

  ### Q1: The Empirical Threshold
  **Do the situationist experiments (Milgram, Good Samaritan, etc.) successfully demonstrate that normal adult behavior lacks cross-situational consistency?**
  *(i.e., Is the situationist interpretation of the data correct?)*

  *   **NO:** You believe the data is flawed, meta-analyses show higher consistency than situationists claim, or the experiments are ecologically invalid.
      *   ⬇ **Debate Status:** **Genuinely Contested.** In psychology, the "person-situation debate" is ongoing. While interactionism is the consensus, the *degree* of consistency is still argued. In philosophy, many virtue ethicists (e.g., Fowers) argue the situationists underestimate consistency.
      *   ➡ **LEAF 1: The Empirical Denial.** (Virtue ethics stands because the empirical attack fails.)

  *   **YES:** You accept the situationist diagnosis: most people do not behave consistently across diverse situations.
      *   ⬇ **Debate Status:** **Genuinely Contested.** Many philosophers accept this for the sake of argument, but a significant number of psychologists and philosophers reject the strength of the claim.
      *   ⬇ **Go to Q2.**

  ---

  ### Q2: The Normative Stakes
  **Does Virtue Ethics cease to be a viable normative theory if its psychological assumptions (about character) are empirically false?**
  *(i.e., Must virtues actually exist in human psychology for VE to be true?)*

  *   **NO:** You believe VE is about ideals, norms, or concepts of flourishing, regardless of whether humans currently possess the psychology to match.
      *   ⬇ **Debate Status:** **Genuinely Contested.** This divides "psychological naturalists" (VE must match science) from "ideal theorists" or certain MacIntyreans (VE is a tradition of inquiry, not a psych hypothesis).
      *   ➡ **LEAF 2: Normative Insulation.** (Virtue ethics is insulated from empirical falsification.)

  *   **YES:** You believe VE makes a claim about human nature that must be empirically possible.
      *   ⬇ **Debate Status:** **Largely Settled.** Most contemporary virtue ethicists agree VE must be psychologically realistic to be action-guiding.
      *   ⬇ **Go to Q3.**

  ---

  ### Q3: The Trait Requirement
  **Does Virtue Ethics require the existence of *global* traits (consistent across all situations), or can it function with *local* or *complex* traits?**
  *(i.e., Is "cross-situational consistency" a defining feature of virtue?)*

  *   **REQUIRES GLOBAL:** You think a "virtue" by definition must be robust across diverse situations (e.g., courage in war *and* courage in social settings).
      *   ⬇ **Debate Status:** **Genuinely Contested.** This is an interpretive debate about Aristotle and the definition of "virtue."
      *   ⬇ **Go to Q4.**

  *   **CAN FUNCTION WITH LOCAL/COMPLEX:** You think VE can be revised to accept fragmented, local, or internally complex psychological structures.
      *   ⬇ **Debate Status:** **Genuinely Contested.** This is the core of the "revisionist" response.
      *   ⬇ **Go to Q5.**

  ---

  ### Q4: The Global Verdict
  **If VE requires global traits, and the evidence shows they are rare or non-existent, what follows?**

  *   **VE IS FALSE:** If the required psychology doesn't exist, the theory is disconfirmed.
      *   ⬇ **Debate Status:** **Mostly Unoccupied.** Very few professional ethicists occupy this leaf; it is mostly held by situationist critics (e.g., Harman) rather than virtue ethicists.
      *   ➡ **LEAF 3: Capitulation.** (Virtue ethics as traditionally understood must be abandoned.)

  *   **VE IS TRUE BUT TRAITS ARE RARE:** The traits exist, but only in a few exemplary individuals (saints, sages), not the experimental subjects.
      *   ⬇ **Debate Status:** **Genuinely Contested.** This saves the theory but risks making it elitist or irrelevant to ordinary moral life.
      *   ➡ **LEAF 4: The Rarity Claim.** (Virtues are real but statistically rare.)

  ---

  ### Q5: The Psychological Mechanism
  **If we are revising the psychological model of virtue, what best explains the behavior?**

  *   **LOCAL FRAGMENTS:** Behavior is driven by narrow, situation-specific traits (e.g., "honesty-in-the-workplace") rather than global character.
      *   ⬇ **Debate Status:** **Genuinely Contested.** This is John Doris's specific proposal. It saves moral evaluation but fragments the agent.
      *   ➡ **LEAF 5: The Local-Traits View.** (Doris)

  *   **COMPLEX INTERNAL SYSTEMS:** Behavior is driven by complex Cognitive-Affective Personality Systems (CAPS) that are robust but not simple behavioral predictors.
      *   ⬇ **Debate Status:** **Genuinely Contested.** Proposed by Nancy Snow. It argues situationists measure the wrong variables.
      *   ➡ **LEAF 6: Cognitive-Affective Framework.** (Snow)

  *   **INTELLIGENT CAPACITIES:** Behavior is driven by reason-responsive capacities; inconsistency arises because subjects weren't engaging practical reason, not because traits don't exist.
      *   ⬇ **Debate Status:** **Genuinely Contested.** Proposed by Rachana Kamtekar. Distinct from Snow by focusing on *rationality* rather than *personality structure*.
      *   ➡ **LEAF 7: Intelligent Capacity View.** (Kamtekar)

  *   **SKILL ACQUISITION:** Virtues are like skills (e.g., piano playing); inconsistency is expected in learners, but expertise yields consistency.
      *   ⬇ **Debate Status:** **Genuinely Contested.** Proposed by Julia Annas. Focuses on the *developmental process* rather than the end-state structure.
      *   ➡ **LEAF 8: The Skill Model.** (Annas)

  ---

  ### Map Analysis: Unoccupied Regions & Overlaps

  #### 1. Unoccupied or Incoherent Regions
  *   **Empirical Denial + Capitulation:** *Incoherent.* If you believe the evidence against traits is false (Denial), there is no reason to abandon Virtue Ethics (Capitulation).
  *   **Normative Insulation + Local Traits:** *Unstable.* If you claim VE is insulated from empirical psychology (Insulation), there is little motivation to adopt a specific psychological view like Local Traits. Usually, Insulation stops the inquiry at Q2.
  *   **Capitulation (as a Virtue Ethicist):** *Rare.* This region is mostly occupied by critics of VE. Few philosophers identify as virtue ethicists while holding that VE is empirically false.

  #### 2. Positions the Tree Cannot Cleanly Separate
  *   **The Skill Model (Annas) vs. The Rarity Claim:** Both rely on the idea that full virtue is an "expert" state that most people lack. The tree separates them based on *mechanism* (skill acquisition vs. statistical rarity), but in practice, these views often overlap. A student might reasonably end up at either leaf.
  *   **Cognitive-Affective (Snow) vs. Intelligent Capacity (Kamtekar):** Both argue that situationists use a too-simple model of psychology. Snow focuses on *personality systems* (psychology-heavy); Kamtekar focuses on *reason-responsiveness* (philosophy-heavy). A student who thinks "virtues are complex reason-responsive systems" might find the split between Leaf 6 and Leaf 7 artificial.
  *   **Local Traits (Doris) vs. Capitulation:** Doris argues we should keep moral evaluation but use local traits. Critics argue this changes the subject so much it amounts to Capitulation. The tree treats them as distinct, but the boundary is thin.

  #### 3. Debate Status Key
  *   **Genuinely Contested:** Active literature exists on both sides; no consensus among experts.
  *   **Largely Settled:** Most experts agree on this premise, even if they disagree on the conclusion.
  *   **Mostly Unoccupied:** Few philosophers hold this specific combination of views.
