  Based on the verdicts and reasoning your teacher has provided, she is almost certainly applying a strict interpretation of the **"Genuine Waste" Rule** (Rule 1), rather than the broader "Differential Affordability" Rule (Rule 2).

  Here is the breakdown of the logic, the prediction for the fish nest, and a test case to confirm it.

  ### 1. The Two Competing Rules

  *   **Rule 1: The "Genuine Waste" Principle (Zahavian Strict)**
      *   **Definition:** A signal counts as a handicap only if the cost is a net survival *disadvantage* with no utilitarian payoff. The signal must be "wasteful" to prove that the individual is so high-quality they can afford the waste. If the trait provides a direct survival benefit (to the signaler, the mate, or the offspring), it is classified as **Parental Investment** or **Utilitarian**, not a Handicap.
      *   **Key Evidence from Class:**
          *   *Peacock:* "Serves **no function beyond** attracting mates."
          *   *Stotting:* "**Wastes energy**."
          *   *Courtship Feeding:* "Direct material benefit, **not** a signal of quality through **waste**."

  *   **Rule 2: The "Differential Affordability" Principle (Biological Broad)**
      *   **Definition:** A signal counts as a handicap if it is costly and that cost is harder for low-quality individuals to bear. The trait *can* have other functions (like protection or fighting) as long as the cost reliably signals quality.
      *   **Key Evidence from Class:**
          *   *Stag's Antlers:* Verdict **Yes**, even though antlers are weapons (utilitarian).
          *   *Fish Nest (Hypothetical):* Would be **Yes** because it is costly and only healthy males can build big ones.

  ### 2. Which Rule is Your Teacher Using?

  Your teacher is using **Rule 1 (Genuine Waste)**.

  While the *Stag's Antlers* case seems to contradict the "No Function" rule (since antlers are weapons), her reasoning ("used in **display** to signal") suggests she classifies them based on their signaling cost rather than their combat utility. In many biology curricula, antlers are treated as handicaps because the *growth and carrying cost* is a burden, distinct from their use as weapons.

  However, the **Courtship Feeding** verdict is the "smoking gun." Under Rule 2, courtship feeding *is* a costly signal of quality (only good hunters can bring food). Your teacher explicitly ruled it **No** because it is a "direct material benefit" and not "waste." This establishes that **utility/benefit disqualifies a trait from being a Handicap** in her framework.

  ### 3. Prediction for the Fish Nest

  The fish nest case is the perfect splitter between these two rules.

  *   **Under Rule 1 (Genuine Waste):** **Verdict: NO.**
      *   **Reasoning:** Like courtship feeding, the nest provides a **direct material benefit** (protection) to the offspring/female. It is not "waste"; it is **Parental Investment**. The cost buys safety, not just information. Because it serves a function "beyond attracting mates" (specifically, egg survival), it fails the Peacock test ("no function beyond").
  *   **Under Rule 2 (Differential Affordability):** **Verdict: YES.**
      *   **Reasoning:** The nest is energetically demanding, and only healthier males can build larger ones. The fact that it also protects eggs is secondary; the honesty of the signal is guaranteed by the differential cost.

  **My Prediction:** Your teacher will likely rule this **NO**. She will classify it as **Parental Effort** or **Extended Phenotype**, distinguishing it from a pure Handicap signal because the cost results in a tangible survival asset for the offspring, similar to how courtship feeding results in a survival asset for the female.

  ### 4. The Decisive Test Case

  If the fish nest verdict is ambiguous (e.g., if she argues that protection is an "indirect" benefit unlike food), the definitive case to settle the question is the **Bowerbird**.

  **The Case:**
  Male Bowerbirds build elaborate structures (bowers) decorated with shells, berries, and objects. Females choose mates based on the complexity of the bower. Building the bower is energetically costly and only high-quality males can maintain the best ones.
  *   **Crucial Detail:** The bower is **not a nest**. The female lays her eggs in a separate, simple nest elsewhere. The bower serves **no function** other than courtship display.

  **How it Settles the Question:**

  *   **If she rules Bowerbird = YES and Fish Nest = NO:**
      *   She is using **Rule 1 (Genuine Waste)**.
      *   *Logic:* The Bower is "waste" (pure signal), so it counts. The Fish Nest is "useful" (protection), so it doesn't count.
  *   **If she rules Bowerbird = YES and Fish Nest = YES:**
      *   She is using **Rule 2 (Differential Affordability)**.
      *   *Logic:* Both are costly and differentially affordable; the utility of the nest doesn't disqualify it.

  **Why this works:** The Bowerbird isolates the "Construction Cost" variable from the "Utility" variable. Since the structure is built by the male and judged by the female (just like the nest), any difference in verdict must be due to the **lack of function** in the bower versus the **protective function** of the nest. This directly tests whether "Waste" is a required condition for her definition of a Handicap.
