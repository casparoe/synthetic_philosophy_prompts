  As for your worry that this reduces relief to mere dating, you're missing the indexical nature of the emotion. Relief isn't just "pain exists at t1"; it's "pain exists at t1, and I am here at t2." It doesn't transfer to anyone else's pain because it's fundamentally self-locating. It's rational because it tracks the causal structure of the block universe: the pain is fixed in the past, it cannot causally affect your current state except through memory, and your current state is one of health. You're relieved that the pain is *there* rather than *here*, and that distinction is objective even if the "now" isn't.
