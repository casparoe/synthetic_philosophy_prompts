answer: |-
  This is a brilliant observation, and it cuts right to the bone of why literary theory often feels disconnected from the actual experience of reading. You've identified a phenomenon that philosophers of language might call "pragmatic coherence despite semantic inconsistency."

  If we treat everyday literary discourse (book clubs, reviews, bar talk) not as a failed attempt at philosophy, but as a functional system in its own right, we can reverse-engineer the implicit theory of meaning it relies on.

  Here is the reconstruction of the **Implicit Theory of Everyday Literary Discourse.**

  ### 1. The Ontology: Meaning as Event, Not Object
  To answer your core question: **No, the practice does not presuppose that meaning has a single location.**

  If the practice presupposed a single location (e.g., "Meaning is objectively in the text"), then the move "To me it meant Y" would be categorized as an error, like saying "This red ball is green." But we don't treat it as an error. We treat it as data.

  Conversely, if the practice presupposed meaning was *only* in the reader, the move "The book is about X" would be seen as a category mistake. But we use it constantly.

  Therefore, the implicit ontology of book-talk is **Meaning-as-Event.** The practice commits us to the view that meaning is not a substance stored in the text, the author, or the reader, but an *energy discharge that happens when the three collide.*

  When you switch between "The book is about..." (Text), "I felt..." (Reader), and "She wanted..." (Author), you are not triangulating a single static point. You are describing the *voltage* of the encounter from three different contact points. The practice presupposes that meaning is **relational**. It exists in the *between*.

  ### 2. Triangulation vs. Negotiation
  You asked if we are triangulating a single truth or negotiating a social reality. The practice rules out hard triangulation.

  In true triangulation, if you have three lines of sight, they should converge on one coordinate. If they don't, someone is wrong. In book clubs, if they don't converge, **the book is richer.**

  The implicit theory here is **Stereoscopic.** You need the distance between the Author's intent, the Text's structure, and the Reader's reception to create the "depth" of the work. If you collapse the distance (e.g., "The Author said X, so that's it"), the image flattens into a statement. The "whiplash" you describe isn't a bug; it's the mechanism that keeps the object three-dimensional.

  So, the practice presupposes that meaning is **negotiated socially**, but with a constraint: the negotiation must respect the *resistance* of the other two poles.
  *   If you ignore the Text, you're projecting (therapy, not reading).
  *   If you ignore the Author, you're unmoored (anything goes).
  *   If you ignore the Reader, you're dead (archival work, not living art).

  ### 3. Does the Practice Rule Out Hardline Views?
  Yes. The everyday practice is inherently hostile to philosophical purity.

  *   **Hard Intentionalism:** If a book club member says, "I don't care what the author said, look at what's on the page," the group accepts this. If someone insists, "We can't say it's about class anxiety because the author said it's about love," they are seen as boring or pedantic. The practice rules out the **Author as Tyrant.**
  *   **Hard Textualism (New Criticism):** If someone says, "Your personal feeling about the ending is irrelevant to the text's structure," they are seen as cold or missing the point. The practice rules out the **Text as Tomb.**
  *   **Hard Subjectivism:** If someone says, "This book is about space aliens," and the text clearly shows it's about a marriage, the group will push back. "Where do you see that?" The practice rules out the **Reader as God.**

  The practice commits us to a **Constitutional Monarchy of Meaning.** All three parties have veto power, but none have absolute rule.

  ### 4. Is the Practice Consistent?
  Logically? No. Pragmatically? Yes.

  We are absolutely papering over a real tension, but that tension is the engine of the conversation. If we resolved the tension—if we agreed once and for all that "Meaning is 100% in the Reader"—the conversation would end. There would be nothing to discuss but our own psyches.

  The "whiplash" is a **feature of the social technology.** It allows us to do two contradictory things simultaneously:
  1.  **Honor the Object:** We treat the book as something external that can teach us, surprise us, or correct us (Text/Author focus).
  2.  **Honor the Subject:** We treat the book as a mirror for our own experience and identity (Reader focus).

  If we committed to one location and dropped the others, the discourse would change radically:
  *   **Commit to Author:** Discourse becomes biography or journalism. "What did she mean?" becomes "What did she say in her diary?" Criticism dies; hagiography begins.
  *   **Commit to Text:** Discourse becomes linguistics or forensics. We stop talking about "truth" and start talking about "syntax" and "pattern." Empathy dies; analysis remains.
  *   **Commit to Reader:** Discourse becomes therapy. "This book made me feel sad" is the beginning and end of the sentence. Shared reality dies; isolation remains.

  The "messiness" is the price of admission for art that is both *shared* (public) and *felt* (private).

  ### 5. Mapping Hofstadter: Frame, Outer, Inner
  This is where your intuition is sharpest. Let's apply Hofstadter's *Gödel, Escher, Bach* distinction to the *conversation about the book*, not just the book itself.

  *   **The Frame Message ("This is a message"):**
      *   *In Theory:* The signal that tells the receiver how to process the signal.
      *   *In Practice:* "This is a Novel." "This is Fiction."
      *   *The Blur:* In everyday discourse, the Frame is usually fixed ("We are discussing a novel"), **but** it is frequently contested in subtle ways. When someone says, "I think this is actually satire," they are trying to shift the Frame. If the Frame shifts, the rules for the Inner Message change entirely. The practice allows us to renegotiate the Frame mid-conversation ("Wait, are we reading this literally or ironically?").

  *   **The Outer Message ("How to decode this"):**
      *   *In Theory:* The code or language used.
      *   *In Practice:* Literary conventions, cultural codes, genre expectations.
      *   *The Blur:* This is where the "whiplash" happens. When you say "To me it was about class anxiety," you are proposing a specific *Outer Message* (a decoding key). When someone else says "It's about the impossibility of connection," they are proposing a different decoding key. The practice presupposes that the Outer Message is **shared but flexible.** We assume we mostly speak the same "literary language," but we allow for dialect differences.

  *   **The Inner Message ("The content"):**
      *   *In Theory:* The payload.
      *   *In Practice:* The "Aboutness."
      *   *The Blur:* In strict communication, the Inner Message is the goal. In literary discourse, **the Inner Message is the bait.** We argue about the Inner Message (What is it about?) to actually negotiate the Outer Message (How do we read?) and reinforce the Frame (What kind of community are we?).

  **The Crucial Insight:**
  In normal communication (e.g., a stop sign), the Frame, Outer, and Inner are locked.
  *   Frame: Traffic signal.
  *   Outer: Red octagon = Stop.
  *   Inner: Halt vehicle.
  *   *Result:* No debate.

  In literary discourse, the practice presupposes that **the Inner Message cannot be accessed without negotiating the Outer and Frame.**
  When you ask "What was the author trying to say?", you are asking to stabilize the Outer Message (Author's Code).
  When you say "To me it meant...", you are asserting your right to supply the Outer Message (Reader's Code).
  When you say "The book is...", you are pretending the Outer Message is inherent to the object (Text's Code).

  ### Summary: The Implicit Theory
  The everyday practice of talking about books commits us to a theory of **Distributed Meaning.**

  It presupposes that:
  1.  **Meaning is not a noun, it's a verb.** It is the act of translation between Author, Text, and Reader.
  2.  **Contradiction is capacity.** If two readings contradict, the book is not "confused"; it is "capacious."
  3.  **The "Truth" is the Conversation.** The goal of the discourse is not to locate the meaning, but to sustain the tension that generates it.

  If we cleaned up the philosophy, we would kill the conversation. The "whiplash" is the sensation of the text breathing. As a novelist, you might find it comforting to know that your readers are not failing to find the "real" meaning; they are collaboratively building the only kind of meaning a novel can actually hold: a shared, unstable, living thing.
