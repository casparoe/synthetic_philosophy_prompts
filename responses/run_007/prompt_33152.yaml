answer: |-
  Your suspicions are well-founded. Your friend is taking a precise, technical result from decision theory and stretching it into a broad philosophical imperative that the math does not support. This is a classic case of "physics envy" in philosophy: taking a theorem that holds under specific, idealized conditions and applying it to the messy real world as if those conditions still held.

  Here is a breakdown of what I. J. Good's Theorem (1967) actually says, followed by a claim-by-claim analysis of your friend's argument.

  ### What Good's Theorem Actually Says

  In his paper *"On the Principle of Total Evidence,"* I. J. Good proved that for a **Bayesian expected-utility maximizer**, the **expected value** of **cost-free** information is **non-negative**.

  To unpack that:
  1.  **Expected Value (Ex-Ante):** This is the crucial mathematical constraint. The theorem says that *before* you see the information, your calculation of how useful it *might* be is positive (or zero). It does **not** guarantee that *after* you see the information (ex-post), you will be better off. You might receive devastating news that limits your options. The theorem only says that having the *option* to know was valuable beforehand.
  2.  **Cost-Free:** The information must not cost anything to acquire or process. This includes resource costs (money, time) and, critically, **psychological costs**.
  3.  **Instrumental Value:** The theorem treats information as a tool for making decisions. It assumes the value of information lies in its ability to help you choose actions that yield higher utility. It does not account for the intrinsic pleasure or pain of holding a belief.
  4.  **Fixed Utility Function:** It assumes your goals don't change upon receiving the information, only your beliefs about how to achieve them.

  ### Claim-by-Claim Breakdown

  Here is where your friend's reconstruction slides from mathematical fact into overstatement.

  #### Claim 1: "Good proved... that a rational agent can never be made worse off by acquiring new information."
  *   **Verdict:** **False.**
  *   **The Math:** Good proved that the *expected* utility *prior* to observation is non-negative.
  *   **The Reality:** You can absolutely be made worse off *after* acquiring information. If you buy a lottery ticket and then learn you lost, you are worse off than if you had remained ignorant (assuming ignorance spared you the disappointment). Good's theorem accounts for this possibility in the *expectation* calculation (the chance of winning info outweighs the chance of losing info), but it does not prevent the actual outcome from being negative.
  *   **The Conflation:** Your friend is conflating **ex-ante expectation** (beforehand) with **ex-post reality** (afterward). The theorem licenses seeking information, not a guarantee of a good outcome.

  #### Claim 2: "So any rational person should always want more evidence, even about painful things..."
  *   **Verdict:** **Overstated / Context-Dependent.**
  *   **The Math:** This holds only if the information is **cost-free**.
  *   **The Reality:** "Painful things" implies a cost. If knowing the date of your death causes you anxiety that reduces your quality of life, that anxiety is a **cost**. In decision theory terms, if $Cost(Information) > Benefit(Better Decisions)$, a rational agent should decline the information.
  *   **The Conflation:** Your friend is assuming that the only utility involved is the outcome of decisions. He is ignoring the **direct utility of belief states**. If believing "I will die soon" causes suffering independent of any decisions I make, that is a negative utility input that Good's theorem (in its standard form) does not automatically override.

  #### Claim 3: "...and should never prefer ignorance."
  *   **Verdict:** **False.**
  *   **The Math:** Good's theorem applies when information is relevant to a decision.
  *   **The Reality:** There are many scenarios where ignorance is preferred by rational agents:
      1.  **No Action Possible:** If you cannot change the outcome (e.g., the date of your death is fixed and unavoidable), the instrumental value of the information is zero. If there is *any* emotional cost to knowing, the net value is negative. Rationality dictates remaining ignorant.
      2.  **Bounded Rationality:** Processing information takes cognitive energy. If the information is complex and the decision is trivial, the cost of processing exceeds the benefit.
      3.  **Strategic Ignorance:** Sometimes, not knowing allows you to maintain a credible threat or promise (e.g., a negotiator who refuses to look at their bottom line until the last minute).
  *   **The Conflation:** He is treating information as intrinsically good, rather than instrumentally good.

  #### Claim 4: "Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend."
  *   **Verdict:** **Logical Leap / Ad Hominem.**
  *   **The Math:** The theorem says nothing about the *defensibility* of your current mind state.
  *   **The Reality:** Refusing to find out can be perfectly rational for the reasons listed above (emotional cost, lack of agency, processing cost).
  *   **The Conflation:** This is a psychological guess masquerading as math. Your friend is suggesting that the only reason to avoid info is "fear of being wrong." But the reason might be "fear of being sad." A rational agent can value happiness over accuracy. If I know my book reviews are bad, and the book is already published, knowing won't help me write a better book. It will only hurt my feelings. Refusing to read them is utility-maximizing.

  ### The Specific Examples

  Your friend's examples actually highlight where his application of the theorem fails.

  **1. "I don't want to know the date of my death."**
  *   **Good's Theorem Analysis:** Does this information help you make a decision that improves your expected outcome?
      *   If the date is fixed and unavoidable: **No.** The instrumental value is zero.
      *   Does knowing cause pain? **Yes.**
      *   **Net Value:** Negative.
      *   **Conclusion:** A rational expected-utility maximizer should **not** want to know. Your friend is wrong here.

  **2. "I don't want to read the reviews of my own book."**
  *   **Good's Theorem Analysis:**
      *   If the book is published and cannot be changed: The information has no instrumental value for *this* book.
      *   If reading reviews causes depression or writer's block for the *next* book: There is a future cost.
      *   **Net Value:** Potentially negative.
      *   **Conclusion:** It is rational to decline.

  ### The "Jump" You Suspected

  You wrote: *"I'm especially suspicious of the jump from 'not worse off in expectation beforehand' to 'never worse off, and irrational to decline.'"*

  **You are exactly right.** This is the critical error.

  1.  **Expectation vs. Reality:** Good's theorem is about the **value of the option**. It says having the *ability* to look is valuable. It does not say that *looking* will always yield a positive result. It's like saying "Buying a lottery ticket has a positive expected value" (hypothetically). It doesn't mean you will win; it means the *gamble* was rational. But if the "cost" of losing the gamble is emotional devastation, the gamble itself becomes irrational.
  2.  **Risk Neutrality:** The theorem assumes the agent cares only about the mathematical expectation. Real humans are often risk-averse regarding emotional states. We might prefer a guaranteed "okay" state (ignorance) over a "mostly great, sometimes devastating" state (knowledge), even if the mathematical average of the latter is higher.
  3.  **The Definition of "Rational":** Your friend is using a very narrow definition of rationality (coherence with Expected Utility Theory). Even within that theory, his conclusion fails because he is failing to input the **cost of distress** into the utility function. If you include "peace of mind" as a variable in the utility function, Good's theorem often supports *remaining ignorant*.

  ### Summary for Your Friend

  You can tell your friend that he is committing the **Mind-Projection Fallacy**. He is projecting his own utility function (where accuracy is the highest good) onto the theorem.

  Good's Theorem proves that **information has instrumental value**. It does not prove that **truth has intrinsic value**.

  *   If knowing the truth helps you act better, seek it.
  *   If knowing the truth costs you peace of mind and changes nothing you can act upon, Good's Theorem (properly calculated with emotional costs included) suggests you should **remain ignorant.**

  Your friend's stance isn't a mathematical necessity; it's a personal value judgment that he is trying to dress up as a theorem. Refusing to know painful, unchangeable facts is not irrational; it is often the most rational way to protect one's utility.

  **The Verdict:** Your friend is overstating the theorem, ignoring the cost of emotional distress, conflating expectation with outcome, and misapplying instrumental rationality to intrinsic values. You are right to push back.
