prompt: |-
  Last week a friend of mine got very excited about something called Good's theorem after reading a blog post on it, and now he brining it up every time anyone says they'd rather not know something. His summary, as best I can reconstruct it, is this: "Good proved mathematically that a rational agent can never be made worse off by acquiring new information. So any rational person should always want more evidence, even about painful things, and should never prefer ignorance. Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend." He's used this on everything from "I don't want to know the date of my death" to "I don't want to read the reviews of my own book." I gather there is a real theorem by I. J. Good and that the actual claim is something narrower, about the expected value of cost-free information being non-negative for an expected-utility maximizer. But I don't know enough decision theory to see exactly where my friend's version slides from that into his much stronger practical conclusion. Could you go through his summary claim by claim and tell me what the theorem actually licenses, where he's overstating or conflating, and whether "you should always want to know" follows from anything true in the theorem? I'm especially suspicious of the jump from "not worse off in expectation beforehand" to "never worse off, and irrational to decline," but I'd like to know whether those are the right places to push.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's friend is obsessively citing "Good's Theorem" to argue that rational agents should *always* seek new information, even if painful (e.g., date of death, book reviews).
      *   **Friend's Claim:** "Good proved mathematically that a rational agent can never be made worse off by acquiring new information... Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend."
      *   **User's Suspicion:** The user suspects the friend is overstating the theorem. They know it's about "expected value of cost-free information being non-negative for an expected-utility maximizer" but want a detailed breakdown of where the friend's interpretation diverges from the math.
      *   **Task:** Go through the friend's summary claim-by-claim, explain what the theorem actually says, identify overstatements/conflations, and evaluate whether "you should always want to know" follows. Specifically address the jump from "expected value" to "never worse off."

  2.  **Recall/Research Good's Theorem (1967):**
      *   **Source:** I. J. Good, "On the Principle of Total Evidence."
      *   **Core Result:** For a Bayesian expected-utility maximizer, the expected value of free information is non-negative. In other words, *before* you see the data, having the option to see it is at least as good as not having the option.
      *   **Key Assumptions:**
          *   Bayesian updating (conditionalization).
          *   Expected utility maximization.
          *   **Cost-free** information (no resource cost to acquire/process).
          *   **Instrumental** value (information helps make decisions).
          *   The utility function is fixed (information doesn't change what you value, only your beliefs about how to achieve it).
      *   **Limitations:**
          *   It's about *ex-ante* expectation, not *ex-post* reality. You might get bad news that hurts your feelings or limits options, but *beforehand*, having the chance was valuable.
          *   It assumes information is relevant to a decision. If there's no decision to make, the theorem doesn't apply directly.
          *   It ignores "emotional utility" or direct disutility from the state of knowledge itself (unless modeled into the utility function).
          *   It ignores computational costs (bounded rationality).

  3.  **Deconstruct the Friend's Claims:**

      *   *Claim 1: "Good proved mathematically that a rational agent can never be made worse off by acquiring new information."*
          *   **Critique:** False. You can be made worse off *ex-post* (after receiving the info). The theorem says the *expected* value *ex-ante* is non-negative. Also, if information has a cost (emotional or resource), the net value can be negative.
      *   *Claim 2: "So any rational person should always want more evidence, even about painful things..."*
          *   **Critique:** Overgeneralization. "Painful" implies direct disutility. If the pain enters the utility function, the cost might outweigh the decision-improving benefit. Also, if the info doesn't affect a decision, its instrumental value is zero.
      *   *Claim 3: "...and should never prefer ignorance."*
          *   **Critique:** False. Ignorance can be preferred if knowledge causes direct suffering (modeled as negative utility) that outweighs decision benefits.
      *   *Claim 4: "Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend."*
          *   **Critique:** Ad hominem/psychological leap. Refusing can be rational if the cost of knowing (emotional distress) exceeds the benefit of better decision-making. Or if the info is irrelevant to any action.

  4.  **Structure the Response:**
      *   **Introduction:** Validate the user's suspicion. The friend is indeed misapplying a technical result to a broad philosophical claim.
      *   **What Good's Theorem Actually Says:** Define the theorem clearly (Ex-ante expected value, cost-free, decision-focused).
      *   **Claim-by-Claim Breakdown:**
          1.  "Never be made worse off" (Ex-ante vs. Ex-post).
          2.  "Always want more evidence" (Costs and Utility functions).
          3.  "Never prefer ignorance" (Direct utility of belief states).
          4.  "Refusing is irrational" (Bounded rationality and irrelevant info).
      *   **The Specific Examples:** Address "Date of Death" and "Book Reviews" using the theorem's logic.
      *   **The "Jump" (Expectation vs. Reality):** Explain the risk neutrality/expectation distinction.
      *   **Conclusion:** Summarize the verdict.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the "Worse Off" point:* I need to make sure I distinguish between *decision payoff* and *psychological state*. Good's theorem is about decision payoffs. If knowing the date of death causes depression which lowers utility, that's a cost. The friend assumes information is only instrumentally valuable, not intrinsically good/bad.
      *   *Refining the "Rationality" point:* The friend defines rationality narrowly (Expected Utility Maximizer). But even within that framework, if $U(Know) < U(Not Know)$ due to emotional costs, then not knowing is rational. The friend is smuggling in a specific utility function where knowledge has no direct cost.
      *   *The "Change your mind" accusation:* This is a classic "motivated blindness" argument. It's not necessarily true. I might know the info will change my mind (e.g., "Your book is bad"), and I know acting on that knowledge won't help (book is already published), so I avoid the pain. That's consistent with EU maximization if pain is a cost.

  6.  **Final Review against User Query:**
