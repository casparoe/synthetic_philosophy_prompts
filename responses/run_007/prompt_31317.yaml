answer: |-
  Yes, this vulnerability in practical reasoning is formally recognized in decision theory and philosophy as **Pascal's Mugging**.

  Coined by Eliezer Yudkowsky in 2007, the concept isolates a specific failure mode of expected utility maximization when applied to unbounded utility functions and Bayesian priors. Its boundary is distinct from the St. Petersburg paradox because it does not rely on an infinite series of outcomes to generate infinite expected value; instead, it exploits the linear relationship between probability and utility in a single transaction, showing that any non-zero probability can be overwhelmed by a sufficiently large stake. It differs from Pascal's Wager because the Wager traditionally relies on infinite utility (eternal salvation), whereas the Mugging demonstrates that the problem persists even with arbitrarily large finite numbers, removing the need to defend the coherence of actual infinities.

  The problem does not conflate distinct issues but rather highlights a tension between two plausible principles: that we should maximize expected value and that we should not act on hypotheses lacking empirical evidence proportional to their claims. The vulnerability arises specifically when an agent's probability distribution does not decay fast enough to counterbalance the growth of their utility function as hypotheses become more complex or extreme. Consequently, the boundaries of the problem are drawn by the proposed solutions: adopting a **bounded utility function** prevents the stakes from ever becoming large enough to dominate the calculation, while applying a **complexity prior** (such as Solomonoff induction) ensures that the probability of a hypothesis shrinks exponentially with its description length, theoretically outpacing any plausible utility claim.

  This framing correctly identifies that the issue is not a paradox in the strict logical sense but a vulnerability in normative decision theory. It is not a Dutch book because it does not require a sequence of bets to expose inconsistency; it is a single-point failure of intuition versus calculation. Philosophers generally agree that standard expected utility theory requires modification or restriction to handle these tail risks, meaning the difficulty in articulating why the threat is absurd stems from the fact that standard formal tools lack a built-in mechanism for dismissing low-probability, high-stakes claims without arbitrary cutoffs. The term "Pascal's Mugging" captures this specific dynamic without collapsing into general skepticism, as it targets the decision-theoretic implication rather than the epistemic possibility of the threat itself, distinguishing it from broader worries about simulation hypotheses which concern the nature of reality rather than the weighting of reasons for action.
