answer: |-
  You have identified a structural flaw that is pervasive in contemporary ethics, particularly in domains where the object of moral concern is difficult to observe directly (sentience, consciousness, suffering). While there is no single canonical Latin name for this specific maneuver in the philosophical lexicon, it is a recognized composite of several well-known errors.

  The most precise label for this phenomenon is **The Surrogate Criterion Fallacy** (borrowed from medical ethics' "surrogate endpoint" problem), though in philosophy of science and metrics, it is often discussed under **Operationalist Drift** or **The Reification of Proxies**.

  Here is a precise carving of the phenomenon, its distinctions from related concepts, and an analysis of when the move might be defensible.

  ### 1. Conceptual Anatomy: The Normative/Epistemic Slide

  To carve this precisely, we must distinguish between the **Normative Ground** and the **Epistemic Proxy**.

  *   **The Normative Ground ($G$):** The property that actually confers moral status (e.g., capacity for suffering, phenomenal consciousness, autonomy). This is usually metaphysically "thick" and difficult to measure directly.
  *   **The Epistemic Proxy ($P$):** A measurable variable correlated with $G$ (e.g., neuron count, brain-to-body ratio, benchmark scores).
  *   **The Slide:** The arguer asserts that $G$ is the moral ground. When challenged on the exclusion of a system with low $P$ but potential $G$, they retreat to the claim that $P$ is merely evidence for $G$. However, in practice, they treat $P$ as *constitutive* of $G$.

  The logical error is an **equivocation between correlation and constitution**. The arguer enjoys the philosophical safety of claiming to care about $G$ (which sounds morally serious) while enjoying the practical convenience of ruling by $P$ (which allows for clean rankings and hard numbers).

  ### 2. Established Terms and Related Concepts

  While "Surrogate Criterion Fallacy" captures the ethics-specific nature, you can map this move onto three existing frameworks:

  **A. Operationalism (The Philosophical Root)**
  In the philosophy of science, **operationalism** is the doctrine that a concept is *defined* by the operations used to measure it.
  *   *Honest Operationalism:* "Consciousness *is* a neuron count of $N$."
  *   *The Slide:* "Consciousness is *indicated by* $N$," followed by acting as if "Consciousness *is* $N$."
  The move you describe is a **covert operationalism**. It hides behind realism about $G$ to avoid the criticism that operationalism is reductionist, while retaining the computational ease of operationalism.

  **B. Goodhart's Law (The Systems Root)**
  In economics and systems theory, **Goodhart's Law** states: "When a measure becomes a target, it ceases to be a good measure."
  *   In your examples, the moral ranking *targets* the proxy. Once the proxy determines the moral status, evolutionary or engineering pressure may decouple the proxy from the ground (e.g., an AI optimized for benchmark scores that lacks internal states, or a species with high neuron density but low integration). The arguer ignores this decoupling risk.

  **C. Reification (The Metaphysical Root)**
  This is a specific instance of **reification** (or the fallacy of misplaced concreteness). The abstract moral property ($G$) is replaced by the concrete physical metric ($P$). The metric is treated as the "real" thing because it is manipulable and comparable, while the actual moral property is left as a vague aura surrounding the metric.

  ### 3. Distinctions from Related Charges

  You asked how this differs from ordinary operational definitions, substantive claims, and charges of bias.

  **Vs. Honest Operational Definition**
  *   *Operationalist:* "I define moral standing *as* having >10 billion neurons. If you find a being with 9 billion that suffers, my theory says they don't count, and I accept that consequence."
  *   *The Slide:* "I care about suffering. But since we can't measure suffering, we use neurons. So the 9-billion being doesn't count."
  *   *Difference:* Transparency about the definition. The slide obscures the possibility of false negatives (beings with low $P$ but high $G$).

  **Vs. Substantive Claim ($P$ is the Ground)**
  *   *Substantivist:* "Neuron count is intrinsically valuable, regardless of consciousness."
  *   *The Slide:* "Neuron count matters *because* it tracks consciousness."
  *   *Difference:* Ontological commitment. The substantivist owns the reduction; the slider disowns it when pressed but relies on it when judging.

  **Vs. Speciesism/Chauvinism**
  *   *Speciesism:* "Humans matter more because they are human."
  *   *The Slide:* "Humans matter more because they have higher $P$ (which tracks $G$)."
  *   *Difference:* Speciesism is a bias about *identity*. The Surrogate Criterion Fallacy is a structural error about *measurement*. However, the slide is often the **mechanism** by which speciesism is rationalized. It allows the arguer to claim objectivity ("It's just the numbers!") while selecting proxies that conveniently align with pre-existing hierarchies (e.g., choosing metrics where humans and whales win, and insects or AI lose).

  ### 4. Is There a Defensible Version?

  The slide is not *always* a mistake, but it becomes a fallacy when it obscures uncertainty. A defensible version of relying on proxies exists under **Decision Theory under Uncertainty**.

  **The Defensible Move: The Precautionary Proxy**
  It is rational to use a proxy $P$ for a ground $G$ if:
  1.  **High Correlation:** There is strong empirical evidence that $P$ tracks $G$ in the relevant domain.
  2.  **Epistemic Humility:** The arguer explicitly acknowledges that $P$ is imperfect and that false negatives/positives are possible.
  3.  **Asymmetric Error Cost:** The proxy is chosen to minimize the worst moral error.
      *   *Example:* "We cannot measure pain directly. We will use neural nociception as a proxy. We know this might miss some pain (false negative) or flag non-pain (false positive). Given the stakes, we will err on the side of over-inclusion."

  **Why the "Slide" is Usually Indefensible**
  The phenomenon you observe is rarely this careful. It is usually indefensible because:
  *   **It suppresses the margin of error:** It treats the proxy as a bright line rather than a probability distribution.
  *   **It avoids the burden of proof:** By keeping $G$ vague, the arguer cannot be falsified. If a system with low $P$ demonstrates $G$, the arguer says "$P$ was just a proxy." If a system with high $P$ demonstrates no $G$, the arguer says "$P$ is usually reliable." The theory becomes unfalsifiable.
  *   **It creates Moral Lazy Evaluation:** It allows the moral agent to stop inquiring about $G$ once $P$ is measured. This is dangerous in AI and animal ethics, where the relationship between structure ($P$) and experience ($G$) is exactly what is in dispute.

  ### Summary Recommendation

  If you need a term for your work, **"The Surrogate Criterion Fallacy"** is the most precise ethical label. If you are writing for a philosophy of science audience, **"Covert Operationalism"** or **"Operationalist Drift"** captures the methodological sleight of hand.

  The core of the error is the **conflation of epistemic access with ontological ground**. The arguer claims $P$ gives us *access* to $G$, but treats $P$ as the *boundary* of $G$. A defensible position must maintain the gap between the map (the metric) and the territory (the moral status), acknowledging that the map is incomplete.
