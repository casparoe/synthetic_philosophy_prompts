answer: |-
  ### Occasionalism and the Lisbon Earthquake: An Analytical Application

  Applying al-Ghazālī's occasionalism to the 1755 Lisbon earthquake debate requires suspending the early modern assumption that created things possess inherent causal powers. In the *Incoherence of the Philosophers*, al-Ghazālī argues that what we perceive as cause and effect is merely a habitual sequence (*'ādah*) ordained by God, who is the sole agent. When fire touches cotton, God creates the burning; when an earthquake strikes a city, God creates the collapse. Using this framework as a lens for the Voltaire-Rousseau-Leibniz exchange does not historically reconstruct their views but rather tests the metaphysical coherence of their arguments against a radical theocentric ontology.

  **(1) Assessment of Voltaire, Rousseau, and Leibniz**
  Through an occasionalist lens, the disagreement between Voltaire, Rousseau, and Leibniz appears fundamentally mis-posed because all three parties largely accept the existence of secondary causality, whether natural or human. Voltaire argues that nature is cruel or indifferent, treating the earthquake as a counterexample to benevolent design. Occasionalism agrees that nature has no benevolence of its own, but it rejects Voltaire's implication that the event is blind; for the occasionalist, the earthquake is not an impersonal natural force but a specific, direct act of a personal God. Rousseau attempts to defend providence by shifting causal responsibility to human choices (urban density, construction), but occasionalism undermines this move metaphysically. Since human choices are themselves created by God at every moment, Rousseau cannot successfully exonerate God by blaming humans, as God is the creator of the choice to build densely just as much as the tectonic shift. Leibniz's optimism relies on the idea that God established general laws for the best possible whole, allowing specific evils to be byproducts. Occasionalism rejects the independence of these laws—God wills every specific detail directly—yet it retains the claim that the world is exactly as God wills, though without Leibniz's rationalist constraint that this *must* be the logically best of all possible worlds. Thus, occasionalism reframes the debate from a dispute over which created cause is responsible to a confrontation with the totality of divine will.

  **(2) The Problem of Evil and Human Agency**
  The interaction between occasionalism and the problem of evil in this context is fraught. On one hand, occasionalism seems to exacerbate the problem of evil compared to Leibnizianism. In Leibniz's framework, God creates a system of laws where earthquakes are possible but not individually micromanaged; in occasionalism, God directly creates the crushing of every specific victim. There is no buffer of "natural law" to absorb the moral shock; God is the immediate agent of the destruction. This interacts destructively with Rousseau's argument. Rousseau posits that human freedom creates a zone of responsibility distinct from divine agency. However, in the occasionalist framework, human freedom is not the power to originate action but the acquisition (*kasb*) of an action created by God. If God creates the human decision not to evacuate, and God creates the earthquake that kills those who stayed, Rousseau's distinction between "natural evil" and "moral evil" collapses. The occasionalist must assert that while humans are held accountable by divine command, metaphysically, God is the sole author of the sequence leading to death. This makes theodicy more difficult, as one cannot argue that God merely "permitted" the evil via secondary causes; God actively created it.

  **(3) Features Illuminated and Missed**
  Occasionalism illuminates two specific features of the Lisbon debate well. First, it clarifies the theological stakes of attributing independent power to nature, highlighting why Voltaire's fear of blind necessity could be viewed as a form of idolatry (*shirk*) by granting nature autonomy belonging only to God. Second, it exposes the metaphysical inconsistency in Rousseau's attempt to separate natural events from divine agency while maintaining human free will, showing that one cannot easily partition God's sovereignty. However, the framework misdescribes or remains silent on two other features. It offers no practical guidance for disaster prevention, as it treats engineering and evacuation as merely occasional triggers rather than genuine causes that can be manipulated to change outcomes. Furthermore, it struggles to account for the persistent moral intuition that humans are responsible for their choices, even if those choices are divinely created, leaving a gap between metaphysical truth and ethical experience.

  **(4) Verdict on Occasionalism**
  Treating the Lisbon earthquake as a test case reveals that occasionalism is a position of immense metaphysical consistency regarding divine sovereignty but significant practical limitation regarding theodicy. It succeeds in protecting the absolute power and knowledge of God against any dilution by created causes, ensuring that nothing happens outside of God's direct will. However, it fails to provide a satisfying moral explanation for suffering, as it makes God the direct agent of every tragedy without the mitigating appeal to general laws or human autonomy. Ultimately, the episode suggests that occasionalism is a powerful tool for piety and metaphysical purity, but it lacks the resources to resolve the moral tensions of evil in a way that satisfies human ethical intuition.

