prompt: |-
  I've spent the past several months researching whether to send my daughter to a progressive or a traditional elementary school. I've read the major studies on both approaches, visited half a dozen schools, interviewed teachers and parents, and I've reached a firm conclusion: the progressive model is better for her. I don't mean I'm leaning that way — I mean I'm convinced. The evidence feels overwhelming.

  Last week I mentioned this to a friend who happens to be an education researcher. She said, "I've published on this, and I think you're wrong. There are findings you haven't seen that point the other way." She didn't tell me what they are, and I haven't looked them up yet.

  Here's what's bothering me. On the one hand, I feel like I should lower my confidence. If someone who knows more than I do disagrees, and there's evidence out there I haven't examined, shouldn't that shake my conviction? On the other hand, I've already looked at the evidence carefully and reached a conclusion. If I'm right, then whatever she's referring to must be misleading in some way — so why should merely knowing that unexamined counterevidence exists make me less sure?

  I can't tell whether I'm being rational or stubborn. What should I do with my belief while I haven't yet looked at her sources?

  Start with your bottom-line answer in the first sentence, then walk me through your reasoning. Don't restate my question or include any preamble.
