answer: |-
  The fog on the Graveyard Flats didn't just hide the horizon; it hid the future.

  Elias sat in the wheelhouse of the *Iron Lung*, his hands wrapped around a mug of coffee that had gone cold an hour ago. Outside, the gray water slapped against the hull. He was trawling for silver-fin, the only thing keeping the coastal towns fed during the drought. The Flats were unregulated. No coast guard, no quotas, no laws. Just the ocean and the other boats hidden in the mist.

  The problem was simple. If you found a school of fish, you could radio the location. If others came, the catch was split, but the work was safer—more eyes on the sonar, more hands to haul if the nets snagged. But if you radioed and no one came back the favor, you'd starved while your neighbors feasted.

  Most captains played it lone. The odds of meeting the same boat twice in the vast, shifting fog were low. Maybe one in three. In game theory terms, the shadow of the future was too short. Defection was the only rational move. Take what you can, silence the radio, run.

  Then there was Mara on the *Salvage Queen*.

  Elias watched her on the radar blip. She was idling near a thermal upwelling. He drifted closer, engine cut, listening on the open channel.

  "Found a cluster," Mara's voice crackled, static-laced. "Sector Four. Need a tow if the net bursts."

  Elias tightened his grip on the mug. *Sector Four.* That was prime. If he went there alone, he could drain it dry. If he went to help her, he'd burn fuel and split the profit. But if he helped, maybe she'd call him next time.

  *Maybe.* That was the gamble. The fog might swallow her forever. She might sink tomorrow.

  Elias throttled up. He moved toward Sector Four. Not to take, but to help.

  He wasn't the first. Over the last few months, a strange thing had been happening. It started with small things. A captain leaves a buoy marker intact instead of cutting it loose for scrap. Another shares fuel during a calm. No treaties were signed. No meetings held. It was just... drift.

  Elias remembered Old Man Vance. Vance was the smartest captain on the Flats. Pure logic. Vance never shared coordinates. He stole fuel when anchors were left unattended. He maximized every single day. For a year, Vance's hold was always full. Elias and the others scraped by.

  Then, two months ago, Vance's engine blew. A common enough occurrence. He put out a distress call on the emergency frequency.

  Silence.

  Not malicious silence. Just... static. The other boats were there. Elias knew *three* of them were within five miles. They heard him. But Vance had burned the bridge so many times that helping him offered no future return. He was a dead end. Investing fuel in Vance was a loss.

  Vance drifted for four days before a commercial tanker picked him up. He lost his season. His boat was towed back to port, rusting.

  Elias watched the *Salvage Queen* now. He pulled alongside. Mara was wrestling with a snagged net.

  "Need a hand?" Elias called out.

  Mara looked up, surprised. She wiped grease from her forehead. "You're the *Lung*. You usually run north."

  "Changing patterns," Elias lied.

  They worked for an hour. The net held. They hauled the silver-fin aboard. It was a good catch, split two ways. Less than Elias could have made alone, but enough.

  "Thanks, Elias," Mara said as they parted. "I got a ping on a deep school near the Ridge tomorrow. Morning. I'll call it in."

  She didn't say *if* you show up. She said *I'll call it in.*

  Elias returned to his wheelhouse. He felt a strange lightness. It wasn't altruism. He didn't care about Mara's welfare. He cared about his own fuel bills and the safety of his crew. But somewhere in the fog, the math had shifted.

  The cluster of boats on the Flats had tightened. Routes overlapped more often. The drought was pushing everyone into the same shrinking pockets of water. The probability of meeting again had crept up. From one in three, to one in two. Maybe higher.

  The shadow of the future had lengthened, just enough to cross the threshold.

  A week later, a new boat arrived. The *Raptor*. Young captain, aggressive. He saw the *Lung* and the *Queen* trading coordinates on the open channel.

  "Soft," the *Raptor* captain radioed. "You're giving away profit."

  Elias ignored him.

  The *Raptor* tried to play Vance's game. He took the info Mara broadcasted, showed up at the Ridge, and then tried to crowd them out, flashing his lights, cutting across their bow to claim the school. He defected.

  Elias didn't argue. He didn't fight. He just turned the *Lung* away. He radioed Mara. "Moving to Sector Nine. Quiet."

  Mara followed. The rest of the regulars—the *Kestrel*, the *Blue Heron*—followed too. They didn't organize a boycott. They just stopped broadcasting where *they* were going. They stopped answering the *Raptor's* calls.

  The *Raptor* fished alone.

  In the short term, the *Raptor* did fine. He took what he found. But the Flats were dangerous. Shoals shifted. Storms rolled in without warning. When the *Raptor* got tangled in a ghost net three days later, his distress call went out.

  Elias heard it. He was five miles out.

  He looked at the radio. The rational choice was to keep going. The *Raptor* was a defector. Helping him offered no guarantee of return. The shadow of the future was still fuzzy.

  But Elias looked at Mara's boat on the horizon. She was turning toward the distress signal.

  If Elias didn't follow, he broke the chain. He became like Vance. He became an island. And islands sank.

  It wasn't a moral choice. It was maintenance. He was maintaining the system that kept him alive.

  Elias throttled up. The *Lung* moved through the fog toward the *Raptor*.

  When they cut the net free, the *Raptor* captain looked confused. "Why? I tried to steal your spot."

  "Yeah," Elias said, wiping his hands on a rag. "But you're still here tomorrow."

  He didn't explain the math. He didn't need to. The *Raptor* would figure it out. Either he'd learn to radio back, or he'd drift until the fuel ran out.

  Elias went back to the wheelhouse. The fog was still thick. The future was still uncertain. You could never be sure you'd see the same face again. But as he looked at the cluster of lights bobbing in the gray distance, holding position against the tide, he realized the shadow was long enough.

  They weren't friends. They were just prisoners who had realized the sentence was indefinite. And so, they kept the peace.
