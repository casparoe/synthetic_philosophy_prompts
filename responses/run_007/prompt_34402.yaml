answer: |-
  # The Consensus Convergence Protocol (CCP)

  **Purpose:** To transform analyst disagreement from a contest of will into a structured audit of information and logic.
  **Timebox:** 90 minutes maximum.
  **Participants:** Two analysts (Analyst A, Analyst B). No facilitator.
  **Philosophy:** Based loosely on Aumann's Agreement Theorem. The core intuition is that disagreement stems from either **different information** or **different processing rules**. If you share all information and align your rules, you should converge. If you don't converge, you must identify exactly which assumption prevents it.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Independent Calibration (15 Minutes)
  *Do not talk yet.*
  1.  **Write the Number:** Each analyst writes their specific forecast (point estimate or probability) on a sticky note.
  2.  **Write the "Why":** Beneath the number, list the top three drivers of that forecast. (e.g., "Q3 consumer spending," "Senate vote count," "Oil price volatility").
  3.  **Write the "Kill Switch":** Identify one piece of evidence that, if it appeared tomorrow, would force you to change your number by at least 20%.
  4.  **Swap:** Exchange notes. Read silently. No commentary yet.

  ### Phase 2: Information Audit (30 Minutes)
  *Goal: Eliminate private information asymmetries.*
  1.  **The Data Gap:** Analyst A asks Analyst B: "Which of my three drivers do you think is based on data you haven't seen?" Analyst B answers. Then swap.
  2.  **Source Swap:** If a data gap exists, share the source immediately (email the report, show the model tab, share the contact notes).
  3.  **Re-Estimate:** If new information was shared, both analysts silently update their numbers.
      *   *Decision Point:* Did the numbers converge within 5% (or 5 percentage points for probabilities)?
      *   **Yes:** Move to Phase 4 (Documentation).
      *   **No:** Move to Phase 3.

  ### Phase 3: Model & Prior Alignment (30 Minutes)
  *Goal: Identify processing differences.*
  1.  **The Logic Walkthrough:** Analyst A walks through their mental model connecting the drivers to the number. Analyst B listens only to ask clarifying questions (no arguing yet). Swap.
  2.  **The Prior Check:** Discuss the "Kill Switch" from Phase 1.
      *   Ask: "Why does this evidence move your needle more than mine?"
      *   This exposes **priors** (e.g., "I assume markets are efficient" vs. "I assume markets are prone to panic").
  3.  **Isolate the Delta:** Explicitly state the remaining disagreement.
      *   *Format:* "We agree on X and Y. We disagree on Z because Analyst A weights Z at 40% and Analyst B weights Z at 10%."

  ### Phase 4: Resolution of Residual Disagreement (15 Minutes)
  *Goal: Handle the reality that Aumann's assumptions often fail.*
  If you still disagree after Phase 3, you have identified a **Fundamental Model Divergence**. Do not split the difference blindly. Choose one of the following paths:

  *   **Path A (The Range):** Publish the forecast as a range (Low-High) with a footnote explaining the specific variable causing the spread.
  *   **Path B (The Weighted Average):** Average the numbers, but weight them based on track record accuracy for *this specific type* of forecast (not seniority).
  *   **Path C (The Scenario Split):** Publish two numbers labeled "Scenario 1 (Bull/Base)" and "Scenario 2 (Bear/Risk)" if the disagreement represents a genuine binary risk.

  **Sign-off:** Both analysts sign the forecast sheet. If you chose Path B or C, you must append a one-sentence "Dissent Note" explaining the unresolved variable.

  ---

  ## Part 2: Worked Examples

  ### Example 1: GDP Growth Forecast (Quantitative)
  **Context:** Forecasting Q3 GDP growth.
  **Analyst A:** 2.1% growth.
  **Analyst B:** 0.8% growth.

  **Phase 1 (Calibration):**
  *   A's drivers: Consumer spending, Inventory buildup, Export demand.
  *   B's drivers: Consumer spending, Interest rate lag, Inventory buildup.
  *   *Observation:* They agree on two drivers. The delta is "Export demand" (A) vs. "Interest rate lag" (B).

  **Phase 2 (Information Audit):**
  *   A asks B: "Do you have data on interest rates I don't?"
  *   B shares a proprietary model showing a 6-month lag effect on commercial lending. A hadn't seen this specific internal model.
  *   A reviews it. A updates forecast to 1.5%.
  *   B reviews A's export data. B updates forecast to 1.2%.
  *   *Decision Point:* Gap is now 0.3%. Within tolerance? Yes.
  *   **Result:** Consensus reached at 1.35%.

  **Phase 3 (Skipped due to convergence).**

  **Phase 4 (Documentation):**
  *   Forecast published at 1.4%. Note added: "Consensus reflects new data on commercial lending lags."

  ***

  **Aumann Violation Alert:** In Phase 2, the assumption of **Common Priors** was mostly held (both trust economic data), but **Common Knowledge** was violated initially (B had a model A didn't). The protocol fixed this by forcing a source swap.

  ---

  ### Example 2: Legislation Probability (Qualitative/Political)
  **Context:** Probability that the "Clean Energy Subsidy Bill" passes the Senate.
  **Analyst A:** 75% (Likely).
  **Analyst B:** 30% (Unlikely).

  **Phase 1 (Calibration):**
  *   A's drivers: Whip count, Public opinion, Party leadership commitment.
  *   B's drivers: Whip count, Filibuster risk, Hidden opposition in caucus.
  *   *Kill Switch:* A says "If 3 moderates publicly oppose." B says "If leadership postpones the vote."

  **Phase 2 (Information Audit):**
  *   They compare whip counts. They match. No private info on vote counts.
  *   Gap remains large (45 points). Move to Phase 3.

  **Phase 3 (Model & Prior Alignment):**
  *   **Logic Walkthrough:** A argues leadership commitment guarantees votes. B argues leadership commitment crumbles under filibuster threats.
  *   **The Prior Check:** They discuss the "Kill Switch."
      *   A asks: "Why does postponing the vote signal failure to you?"
      *   B answers: "Because in my experience (prior), leadership only delays when they know they lack votes. You seem to assume they delay to build hype."
  *   **Isolate the Delta:** "We agree on the vote count. We disagree on the *reliability* of leadership signals. A assigns 90% credibility to leadership statements; B assigns 40%."

  **Phase 4 (Resolution):**
  *   They cannot agree on the credibility of leadership. This is a **Prior Violation** (different beliefs about human behavior).
  *   **Choice:** Path C (Scenario Split).
  *   **Result:** Published as "Base Case: 75% (Leadership holds); Risk Case: 30% (Leadership folds)."

  ***

  **Aumann Violation Alert:** In Phase 3, the assumption of **Rationality/Common Priors** failed. A and B have different "priors" on political honesty based on past experience. The theorem says they should update until they agree, but in practice, deep heuristic differences persist. The protocol forces them to *name* the prior difference rather than hide it behind a number.

  ---

  ## Part 3: Where the Assumptions Break (And What to Do)

  Aumann's theorem relies on strict mathematical conditions that do not exist in a think tank. Here is where the protocol acknowledges reality:

  | Aumann Assumption | Real-World Violation | Protocol Mitigation |
  | :--- | :--- | :--- |
  | **Common Priors** | Analysts have different worldviews (e.g., one is a market hawk, one is a dove). | **Phase 3 (Prior Check):** Force them to articulate the worldview difference. If it remains, use **Path C (Scenario Split)**. |
  | **Honesty/Rationality** | Analysts may be motivated by ego, career safety, or pleasing a donor. | **Phase 4 (Sign-off):** Require signatures. The "Dissent Note" creates accountability. If someone is acting in bad faith, the paper trail exposes it. |
  | **Common Knowledge** | One analyst knows something the other doesn't (or pretends to). | **Phase 2 (Source Swap):** Require physical/digital evidence, not verbal claims. "Show me the tab." |
  | **Unlimited Computation** | Humans can't perfectly update Bayesian probabilities. | **Timebox:** Limit to 90 mins. Accept "good enough" convergence (within 5%) rather than perfect identity. |

  ---

  ## Part 4: Limitations (Where CCP Will Fail)

  Do not use this procedure for the following types of disagreements. It will waste your time.

  1.  **Value Judgments Masquerading as Forecasts:**
      *   *Example:* "Will this policy be *good* for the country?"
      *   *Why it fails:* This is not a forecast; it's a normative claim. Aumann applies to beliefs about truth, not preferences about outcomes.
      *   *Fix:* Separate the forecast (what will happen) from the policy recommendation (what we should do).

  2.  **Unknown Unknowns (Black Swans):**
      *   *Example:* Disagreement based on a gut feeling about a geopolitical shock.
      *   *Why it fails:* You cannot audit information that doesn't exist yet.
      *   *Fix:* Use **Path A (The Range)** immediately. Acknowledge the uncertainty explicitly.

  3.  **Power Imbalances:**
      *   *Example:* A Junior Analyst vs. a Senior VP.
      *   *Why it fails:* The Junior Analyst will not honestly challenge the Senior VP's priors in Phase 3. The "Common Knowledge" step becomes a performance.
      *   *Fix:* If seniority gaps are large, this protocol requires a neutral facilitator (you, the team lead), or the numbers must be submitted anonymously before the meeting.

  4.  **Ideological Incommensurability:**
      *   *Example:* One analyst believes inflation is always monetary; the other believes it's always structural.
      *   *Why it fails:* Their models are fundamentally incompatible. They speak different languages.
      *   *Fix:* Do not force a consensus number. Publish the divergence as a research finding: "The field is currently split on the driver of inflation."

  ## Final Note to the Team Lead

  This protocol will not make your analysts rational machines. It will not guarantee the forecast is right. What it *will* do is ensure that when you publish a number, you know *why* it is that number.

  When the protocol works, you get a better number. When it fails, you get a clear map of *why* the future is uncertain. Both are valuable products for a think tank. The enemy is not disagreement; it is unexamined disagreement.
