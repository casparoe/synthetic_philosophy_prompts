      *   **Goal:** Create a step-by-step conversation protocol based on Aumann's Agreement Theorem (intuitively, not mathematically).
      *   **Constraints:**
          *   Two analysts, 1-2 hours, no facilitator.
          *   Surface real sources of disagreement (evidence/assumptions), not just conclusions.
          *   Handle persistent disagreement (what to do at the end).
