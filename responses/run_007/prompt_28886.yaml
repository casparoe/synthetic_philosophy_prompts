answer: |-
  # Joint Statement on Program Equilibrium and One-Shot Cooperation

  **Authors:** Dr. Elena Vance (Optimist) and Dr. Marcus Thorne (Skeptic)
  **Date:** October 26, 2023
  **Context:** Workshop on Foundations of Game Theory and AI Alignment

  ## 1. Accepted Claims

  Both parties agree on the following formal and methodological premises:

  1.  **Formal Validity:** Program Equilibrium (PE) is a mathematically well-defined solution concept. In a meta-game where players submit programs that read each other's source code before playing a base game (e.g., Prisoner's Dilemma), profiles such as `CliqueBot` (cooperate iff source codes are identical) or `PrudentBot` (cooperate iff there is a proof the opponent cooperates) constitute Nash Equilibria.
  2.  **Standard Game Theory:** The standard analysis of the one-shot Prisoner's Dilemma (PD) with fixed action spaces {Cooperate, Defect} correctly identifies (Defect, Defect) as the unique Nash Equilibrium. Program Equilibrium does not refute this; it alters the game structure by expanding the strategy space to include conditional programs.
  3.  **Pareto Dominance:** In the Prisoner's Dilemma, the cooperative Program Equilibria Pareto-dominate the defective Program Equilibrium (where both programs defect unconditionally). Both parties agree that, *ceteris paribus*, Pareto-superior equilibria are theoretically preferable.
  4.  **Relation to Folk Theorem:** Program Equilibrium achieves in a one-shot setting what the Folk Theorem achieves in repeated settings (sustaining cooperation via conditional threats/promises). However, unlike repeated games, PE does not rely on temporal discounting or history; it relies on logical correlation and transparency.
  5.  **Requirements for Resolution:** A satisfactory resolution to the problem of cooperation must address not only the *existence* of cooperative equilibria but also the *selection* mechanism. It must account for implementation constraints, including bounded computational resources, imperfect information, and the stability of equilibria under perturbation.

  ## 2. Disagreements Table

  | Proposition | Optimist's Position (Vance) | Skeptic's Position (Thorne) |
  | :--- | :--- | :--- |
  | **P1: Attainability of Cooperation** | The existence of cooperative PE demonstrates that individual rationality is compatible with mutual cooperation in one-shot games, provided source-code transparency is maintained. | The existence of cooperative PE demonstrates only that cooperation is *possible*, not that it is *rationally mandated*, as the meta-game retains a coordination problem equivalent to the base game. |
  | **P2: Robustness to Perturbation** | Cooperative equilibria are robust if agents use logical uncertainty and modal logic rather than exact string matching; slight variations in code need not trigger defection. | Cooperative equilibria are fragile under realistic conditions; any opacity, obfuscation, or bounded proof-search capability reintroduces the incentive to defect, collapsing the equilibrium. |
  | **P3: Normative Force** | The normative burden is satisfied by showing a rational path to cooperation exists; agents ought to converge on Pareto-superior equilibria via Schelling points in program space. | The normative burden is not met because the choice of program space and similarity metric is arbitrary; without a unique prior, recommending a specific cooperative program is question-begging. |
  | **P4: Complexity of Meta-Game** | The meta-game of program selection is computationally and conceptually simpler than the base game because logical dependencies are explicit in the source code. | The meta-game is strictly harder than the base game because it requires reasoning over an infinite space of Turing machines rather than a finite set of actions. |

  ## 3. Cruxes and Empirical/Theoretical Tests

  The following sub-questions represent the primary points of divergence. Settling these would necessitate a revision of at least one party's view.

  ### Crux 1: Natural Priors in Program Space
  *   **Question:** Is there a language-independent "natural prior" over programs that makes cooperative programs (like `PrudentBot`) more focal than defective or unstable programs?
  *   **Acceptable Evidence:** A formal derivation of a universal prior over Turing machines (e.g., based on Kolmogorov complexity) showing that cooperative strategies have significantly higher prior probability than defectors in a multi-agent learning context.
  *   **Optimist Prediction:** Simple cooperative programs have lower Kolmogorov complexity than complex exploitative ones, making them natural Schelling points.
  *   **Skeptic Prediction:** Complexity is language-relative; for every simple cooperative program, there exists a simple program that defects against it, yielding no unique focal point.
  *   **Concession Condition:** If a unique, language-invariant prior is proven, the Skeptic must concede P3. If no such prior exists, the Optimist must concede that PE lacks normative force without external coordination.

  ### Crux 2: Bounded Rationality and Proof Search
  *   **Question:** Can bounded agents reliably find the proofs required for logical cooperation (e.g., in Modal UDT or PrudentBot) within reasonable time limits against novel opponents?
  *   **Acceptable Evidence:** Complexity bounds on proof search for cooperative equilibria against a distribution of opponent algorithms, or simulation results of bounded agents in a tournament setting.
  *   **Optimist Prediction:** Bounded agents will approximate logical cooperation sufficiently often to sustain higher-than-baseline cooperation rates.
  *   **Skeptic Prediction:** Proof search is intractable for non-trivial opponents; bounded agents will default to defection to avoid the " Lobster trap" (infinite loops or timeout defections).
  *   **Concession Condition:** If proof search is shown to be tractable for relevant classes of AI, the Skeptic must concede P2. If it is shown to be systematically intractable, the Optimist must concede P1.

  ### Crux 3: The "Availability" vs. "Selection" Distinction
  *   **Question:** Does the term "available equilibrium" imply mere mathematical existence, or does it imply reachability via a plausible dynamic process?
  *   **Clarification:** This is partly semantic but maps to a substantive dispute about the definition of rationality.
  *   **Acceptable Evidence:** A consensus definition of "rational selection" in static games with multiple equilibria.
  *   **Optimist Stance:** An equilibrium is "available" if it is a Nash Equilibrium and Pareto-superior. Rational agents can coordinate on it without a dynamic process.
  *   **Skeptic Stance:** An equilibrium is "available" only if there is a dynamic (evolutionary, learning, or deliberative) that converges to it with high probability.
  *   **Resolution Requirement:** For the verbal component to dissolve, the **Optimist** must concede that existence does not guarantee convergence without a selection theory. The **Skeptic** must concede that if a selection theory *were* found (see Crux 1), PE would constitute a solution. The substantive disagreement remains whether such a selection theory is possible without begging the question.

  \answer{The residual substantive disagreement concerns whether the meta-game coordination required to select a specific cooperative program from an infinite space is substantively easier than the original action-game coordination problem.}
