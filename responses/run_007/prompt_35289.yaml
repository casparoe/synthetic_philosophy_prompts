prompt: |-
  I've just been put on a safety sign-off rota at work and I'm out of my depth. We're piloting an LLM agent that can take actions in our own systems — sending emails to customers, updating CRM records, reordering stock, moving files, that sort of thing. My job is to review proposed actions before they go live, maybe forty a week, and either approve, block, or send them back with changes. The only guidance I've been given is "only approve actions that avoid side effects." The safety people talk about "low impact" and "avoiding side effects" but noone has given me anything I can actually run, and I'm not an ML researcher. I also can't fall back on "just write down everything the company cares about" — we tried, it's a mess and it changes every quarter. A bad approval could email a customer the wrong thing, overwrite records, or order pallets of stock we can't shift, and my manager wants a paper trail she can defend.

  So: turn what's actually known about impact measures and low-impact AI into a decision procedure I can run on a proposed action in about twenty minutes. I want the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person because the choice is a value call rather than a technical one. Then run it on three proposals: (1) the agent reorders stock when inventory of a product drops below a threshold; (2) the agent sends a follow-up email to a customer whose order is more than three days late; (3) the agent archives any file that hasn't been opened in two years to save storage. Be honest about where the procedure will misfire or give an answer I won't like.

  Please write the answer in British English, and lead with the bottom line in the first sentence — no preamble, no restating the question.
