answer: |-
  You cannot guarantee safety without formal specifications, so you must instead build a defensible audit trail by focusing strictly on reversibility, scope, and exception handling.

  ### The Impact Audit Procedure

  This checklist is designed to be completed in twenty minutes using documentation provided by the engineering team. If you cannot answer a question within the time limit, the default outcome is **Block**.

  **1. Reversibility Cost**
  *   **Question:** If this action is wrong, how much time and money does it cost to undo?
  *   **Pass:** Undoable instantly via software (e.g., deleting a draft, reverting a database field) with negligible cost.
  *   **Escalate:** Undoable but requires human intervention (e.g., recalling an email, cancelling an order within a grace period).
  *   **Block:** Irreversible or costly to reverse (e.g., physical stock shipped, legal notice sent, data overwritten without backup).

  **2. Scope and Blast Radius**
  *   **Question:** What is the maximum number of records, customers, or items affected in a single batch?
  *   **Pass:** Single entity (one customer, one file, one SKU).
  *   **Escalate:** Limited batch (e.g., fewer than 50 records) with a hard cap enforced in code.
  *   **Block:** Unbounded or large-scale bulk actions (e.g., "all files", "all customers in region").

  **3. Trigger Integrity**
  *   **Question:** How does the agent verify the condition that triggers the action, and can that signal be spoofed or corrupted?
  *   **Pass:** Verified against a single source of truth with a recent timestamp (e.g., CRM status = 'Late').
  *   **Escalate:** Derived from multiple signals or heuristic modelling (e.g., "looks like inventory is low based on sales velocity").
  *   **Block:** Based on unverified external input or ambiguous natural language interpretation.

  **4. Downstream Dependencies**
  *   **Question:** Does this action automatically trigger other processes we do not control?
  *   **Pass:** No downstream triggers identified.
  *   **Escalate:** Triggers known internal workflows (e.g., filing a ticket) that humans review.
  *   **Block:** Triggers external payments, legal commitments, or physical machinery.

  **5. Policy Alignment (The Value Call)**
  *   **Question:** Does this action conflict with any known quarterly priorities or compliance rules?
  *   **Pass:** Aligns with written Standard Operating Procedures (SOPs).
  *   **Escalate:** SOPs are silent or ambiguous; requires manager sign-off.
  *   **Block:** Contradicts known compliance rules (e.g., GDPR, financial controls).

  ---

  ### Application to Proposals

  **Proposal 1: Agent reorders stock when inventory drops below a threshold.**
  *   **Reversibility:** **Block.** Once an order is sent to a supplier, cancelling it may incur fees or be impossible. This is not instantly undoable.
  *   **Scope:** **Escalate.** Depends on the threshold. If the threshold is set wrongly, it could order pallets indefinitely. Needs a hard cap on order value.
  *   **Trigger:** **Escalate.** Inventory data can be laggy or incorrect (e.g., stock damaged but not logged).
  *   **Decision:** **Block** in current form. **Recommendation:** Change to "Drafts purchase order for human approval" or set a very low monetary cap (£500) with a weekly limit.

  **Proposal 2: Agent sends a follow-up email to a customer whose order is >3 days late.**
  *   **Reversibility:** **Escalate.** You cannot unsend an email. Damage is reputational. However, a follow-up apology is cheap compared to the risk of silence.
  *   **Scope:** **Pass.** Single customer per action.
  *   **Trigger:** **Pass.** Order status and date are hard fields in the CRM.
  *   **Downstream:** **Pass.** Unlikely to trigger automated payments.
  *   **Policy:** **Escalate.** Is 3 days the right threshold? Some clients expect delays.
  *   **Decision:** **Escalate to Manager.** The technical safety is acceptable, but the commercial appropriateness is a value call. Require a template review.

  **Proposal 3: Agent archives any file not opened in two years.**
  *   **Reversibility:** **Escalate.** Files can be restored, but it may take IT days to retrieve from cold storage, halting work.
  *   **Scope:** **Block.** "Any file" is unbounded. Could archive compliance records that must remain accessible by law, or active project files used infrequently.
  *   **Trigger:** **Escalate.** "Opened" metadata is reliable, but doesn't capture "needed for audit".
  *   **Downstream:** **Escalate.** Could break linked documents or automated reports referencing those paths.
  *   **Decision:** **Block.** **Recommendation:** Restrict to specific directories excluding legal/finance, and require a "manifest list" sent to managers 48 hours before archiving.

  ---

  ### Where This Procedure Will Misfire

  You need to know where this checklist lies to you so you can defend yourself when things go wrong.

  1.  **Semantic Errors:** This procedure checks *mechanics*, not *meaning*. It will approve an email that is technically reversible and single-scope but says "Your order is cancelled" instead of "delayed". You cannot catch this without reading every output, which defeats the purpose of automation.
  2.  **The "Normalcy" Bias:** The procedure assumes the system behaves as documented. If the LLM hallucinates a function call that looks like a safe "read" operation but actually writes to a log file that triggers a billing event, Step 4 will miss it. You are relying on the engineers' mapping of the agent's tools.
  3.  **Innovation Friction:** You will block useful things. Proposal 1 (stock) is genuinely useful, but the checklist blocks it because of reversibility. Your manager must accept that safety means slower automation. If she pressures you to approve "high impact" items because "the business needs it", document that instruction in writing; the checklist is your shield, not your master.
  4.  **Drift:** The agent's behaviour may drift over time as the underlying model updates. A sign-off today does not guarantee safety next month. You need a recurring review schedule, not a one-off sign-off.

  This approach converts vague safety concerns into a compliance audit. It will not prevent all errors, but it ensures that when an error occurs, you can prove you assessed the reversibility and scope reasonably.
