answer: |-
  # The Classification Audit: An Editorial Procedure

  **Purpose:** To determine whether a medical or psychiatric classification change should be framed as a **Scientific Discovery** (Naturalist: nature revealed a boundary) or a **Policy Decision** (Normativist: society drew a line).
  **Time Budget:** 90 minutes.
  **User:** General assignment reporter (no medical training required).
  **Sources:** Diagnostic manual prefaces, press releases, committee voting records, two expert interviews (one pro-change, one skeptic), insurance coding documents.

  ---

  ## The Procedure

  Run these five questions in order. Record the answer as **Yes**, **No**, or **Mixed/Unknown**.

  ### Q1: The Mechanism Test
  **Question:** Does the proposing body cite a specific, identifiable biological or psychological *mechanism* (e.g., a pathogen, a lesion, a specific neural pathway, a genetic marker) that causes the condition, distinct from the symptoms themselves?
  *   **Look here:** The "Etiology" or "Pathophysiology" section of the manual entry or the primary press release.
  *   **Sufficient Answer for "Yes":** A named mechanism accepted by a majority of independent researchers (not just the committee members).
  *   **Sufficient Answer for "No":** The condition is defined solely by a checklist of behaviors, feelings, or self-reports (symptom clusters).
  *   **Framing Outcome:**
      *   If **Yes**: Stop. Frame as **Discovery**.
      *   If **No**: Go to Q2.
      *   *Note to Reporter:* This is a judgement call dressed as a test. Correlation is not causation. If the "mechanism" is just "low serotonin" without proof of *why* it is low, count this as **No**.

  ### Q2: The Boundary Test
  **Question:** Is the line between "having the condition" and "not having it" drawn at a specific statistical cut-off (e.g., "symptoms lasting more than 6 months," "score above 15 on scale X") where people just below the line are functionally identical to people just above it?
  *   **Look here:** The diagnostic criteria list. Look for time durations or severity scores.
  *   **Sufficient Answer for "Yes":** The criteria rely on arbitrary time limits or severity thresholds without a "bright line" biological shift.
  *   **Sufficient Answer for "No":** There is a qualitative difference (e.g., presence vs. absence of a tumor), not just a quantitative one.
  *   **Framing Outcome:**
      *   If **Yes**: Strong indicator of **Decision-and-Values**. Go to Q3 to confirm.
      *   If **No**: Go to Q3.

  ### Q3: The Harm Test
  **Question:** Is the primary justification for the classification the *distress* or *disability* it causes, rather than the *dysfunction* of a bodily system?
  *   **Look here:** The "Diagnostic Features" or "Prevalence" section. Does it say "causes clinically significant distress" or "impairs social/occupational functioning"?
  *   **Sufficient Answer for "Yes":** The definition explicitly requires that the patient be suffering or impaired. (If you can have the biology without the suffering, and it's not called a disease, this is a Yes).
  *   **Sufficient Answer for "No":** The condition is considered pathological even if the patient feels fine (e.g., early-stage hypertension or cancer).
  *   **Framing Outcome:**
      *   If **Yes**: Strong indicator of **Decision-and-Values**. Go to Q4.
      *   If **No**: Go to Q4.
      *   *Note to Reporter:* This is the core normativist check. If "suffering" is required for the label, the label encodes a value judgment that suffering is bad, not just that a mechanism is broken.

  ### Q4: The Consensus Test
  **Question:** Was the inclusion/removal of the condition decided by a committee vote or consensus process where empirical data was acknowledged as insufficient?
  *   **Look here:** Meeting minutes, preface to the manual, or interviews with task force members. Look for phrases like "clinical utility," "field trials," or "expert consensus."
  *   **Sufficient Answer for "Yes":** Public records show a vote was taken, or task force members admit data was thin but action was needed.
  *   **Sufficient Answer for "No":** The change was automatic based on the publication of a definitive study (rare).
  *   **Framing Outcome:**
      *   If **Yes**: Frame as **Decision-and-Values**.
      *   If **No**: Go to Q5.

  ### Q5: The Evidence Gap Clause
  **Question:** Is the empirical evidence regarding the validity of this category thin, contested, or unavailable?
  *   **Look here:** Search for editorials or dissenting opinions published alongside the proposal.
  *   **Sufficient Answer for "Yes":** Significant dissent exists in the literature, or the manual itself labels the criteria as "provisional" or "needs further study."
  *   **Framing Outcome:**
      *   If **Yes**: **Hand-off to Editor.** (See below).
      *   If **No**: Frame as **Discovery**.

  ---

  ## Decision Matrix & Hand-Off Protocol

  *   **Mostly "No" on Q1, Q2, Q3, Q4:** Frame as **Discovery**. (Medicine found something).
  *   **Mostly "Yes" on Q2, Q3, Q4:** Frame as **Decision-and-Values**. (Medicine drew a line).
  *   **Mixed Results or "Yes" on Q5:** **Hand-off to Editor.**
      *   *Why:* This indicates a "Hybrid" case. The science is real but incomplete, and values are filling the gap.
      *   *Instruction:* Do not write the headline yet. Bring the Q1-Q5 sheet to the editor. The decision on framing is now an ethical/policy choice, not a factual one. We must decide whether to privilege the *hope* of discovery or the *reality* of the decision.

  ---

  ## Application to Cases

  ### Case A: The New Consensus Condition
  **Scenario:** A condition (e.g., *Prolonged Grief Disorder*) is added to a major manual. It is defined by symptom duration and severity. Experts agree it causes suffering, but biomarkers are disputed. Task force minutes show a vote was taken because field trials were inconclusive.

  **Audit:**
  *   **Q1 (Mechanism):** **No.** Defined by symptom checklist (yearning, preoccupation), not biology.
  *   **Q2 (Boundary):** **Yes.** Distinguished from normal grief by a 6-month or 12-month time limit.
  *   **Q3 (Harm):** **Yes.** Requires "clinically significant distress."
  *   **Q4 (Consensus):** **Yes.** Added via committee vote despite inconclusive field trials.
  *   **Q5 (Evidence Gap):** **Yes.** Dissent exists regarding pathologizing grief.

  **Verdict:** **Decision-and-Values.**
  **Editorial Resistance:** My editors will likely resist this. They prefer the headline "New Mental Disorder Identified" because it drives clicks and sounds authoritative. This procedure forces the headline "Committee Votes to Classify Grief as Disorder." The procedure holds: Q1 and Q4 are decisive. The "Discovery" frame would be misleading because the "discovery" is social, not biological.

  ### Case B: The Retired Diagnosis
  **Scenario:** A professional body proposes removing a long-standing diagnosis (e.g., *Gender Incongruence* moving from Mental Disorders to Sexual Health conditions in ICD-11). The argument is that the state is not inherently dysfunctional but is only medicalized due to social stigma/barriers.

  **Audit:**
  *   **Q1 (Mechanism):** **No.** No biological dysfunction identified; previously defined by distress regarding assigned sex.
  *   **Q2 (Boundary):** **N/A.** (Removing the boundary).
  *   **Q3 (Harm):** **Mixed.** Previously required distress; new classification acknowledges distress is caused by *lack of access* to care, not the state itself.
  *   **Q4 (Consensus):** **Yes.** Driven by human rights considerations and expert consensus on stigma.
  *   **Q5 (Evidence Gap):** **No.** Evidence on stigma is robust.

  **Verdict:** **Decision-and-Values.**
  **Weighted Questions:** Q3 carries the most weight here. The shift acknowledges that the "disease" label was encoding a social value (conformity to birth sex) rather than a biological dysfunction.
  **Hand-off:** None. The procedure clearly indicates a value shift (de-pathologization). The story is about changing social values, not new biological data.

  ### Case C: The Patient-Led Campaign
  **Scenario:** A patient group campaigns for "Burnout" to be recognized as a distinct disease entity for insurance funding. It is statistically common and distressing. The WHO (ICD-11) includes it as an "occupational phenomenon," but not a medical condition. Biological markers are non-specific (cortisol levels vary).

  **Audit:**
  *   **Q1 (Mechanism):** **No.** No specific biological signature distinct from depression or anxiety.
  *   **Q2 (Boundary):** **Yes.** Distinction from "normal stress" is based on self-report and duration.
  *   **Q3 (Harm):** **Yes.** The entire justification is suffering and economic incapacity.
  *   **Q4 (Consensus):** **Mixed.** Patient groups say "Yes," insurance actuaries say "No."
  *   **Q5 (Evidence Gap):** **Yes.** High contention on whether it is a distinct entity or just depression in a workplace context.

  **Verdict:** **Hand-off to Editor.**
  **Why:** Q1 and Q2 point to **Decision-and-Values**, but Q3 involves high stakes for patient welfare. If we frame this purely as "Values," we risk undermining patient claims to funding (insurers will say "it's not real"). If we frame as "Discovery," we lie about the biology.
  **Procedure Declines Verdict:** This is the "Hybrid" zone. The reporter must bring this to the desk. The question is no longer "What is this?" but "What is our responsibility to the patients vs. the truth?" The procedure flags this tension but cannot resolve the ethical trade-off.

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **It cannot validate suffering.** A "Decision-and-Values" framing does not mean the patient's pain is fake. It means the *label* is a tool, not a map of nature. This procedure cannot prevent readers from conflating "social construct" with "imaginary." You must write that distinction explicitly in the copy; the checklist won't do it for you.
  2.  **It cannot resolve the "Hybrid" cases.** As seen in Case C, when biology is thin but harm is high, the procedure forces a hand-off. It identifies the conflict between scientific rigor and social utility but offers no algorithm to solve it. That remains your editorial burden.
  3.  **It relies on transparency.** If the diagnostic manual hides its voting records or obscures the lack of biomarkers (Q1/Q4), this procedure will fail. It assumes the institutions are honest about their uncertainty. When they are not, this tool will yield a false "Discovery" result.
  4.  **It is static.** Medicine moves fast. A "Decision" today (e.g., HIV/AIDS definition) may become a "Discovery" tomorrow (viral load testing). This procedure captures the status *at the moment of publication*, not the ultimate truth.

  **Final Note to Desk:** This tool is not a truth machine. It is a bias detector. It prevents us from accidentally dressing up policy decisions as laws of nature. Use it to check our own language before we check the subject's.
