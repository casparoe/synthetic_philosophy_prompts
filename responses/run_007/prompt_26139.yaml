      *   *Step 2 (Thursday):* If Friday is eliminated, and it hasn't happened by Wednesday night, I know it's Thursday. So it can't be a surprise.
      *   *Flaw:* The elimination of Friday depends on the assumption that the exam *must* happen. But the "surprise" condition makes the "must happen" condition contingent on their knowledge state.
