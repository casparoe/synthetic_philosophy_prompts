      *   *Step 4: Treatment Utility.* Does labeling it help or hurt? (Pragmatic check).
      *   *Step 5: Community Consensus.* Do the people *with* the condition accept the label? (Crucial for neurodiversity, etc.).

      *Refining the Steps for Speed & Clarity:*
