      *   Ensure the distinction between "Disease" (biological), "Disorder" (functional/social), "Syndrome" (cluster), "Risk" (probability), "Variation" (neutral) is clear in the outputs.

      *(Self-Correction during drafting Case 3 - Autism)*: Be careful not to take a side myself, but show how the procedure weighs the "Identity Check." The procedure should prioritize the community's self-definition if harm is debatable.

      *(Self-Correction during drafting Case 2 - Osteoporosis)*: Make sure the "unlikeable" part is clear. The journalist wants to write "Risk," but the procedure might say "Technically Disease by metrics, but Harm is absent. You must choose based on audience impact." Actually, better: The procedure forces a halt at "Value Judgment" because the facts are contradictory (Statistical abnormality vs. No current symptoms). This denies the journalist the "safe" factual cover.

      *Let's refine the "Unlikeable Answer".* The prompt asks for a case where the procedure returns an answer the user *will not like*. A journalist wants a definitive label. If the procedure says "This is a Value Judgment, you decide," that is frustrating. Or, if the procedure says "Call it a Disease" when the journalist wants to be nuanced. Let's go with the latter for Osteoporosis. Guidelines define it as disease. The procedure respects guidelines for consistency. The journalist *wants* to call it a risk state to avoid overtreatment anxiety. The procedure forces "Disease." That's a good conflict.
