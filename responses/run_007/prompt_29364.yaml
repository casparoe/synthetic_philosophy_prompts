answer: |-
  # JOINT STATEMENT ON THE METAPHYSICS OF DISPOSITIONS
  **Signed:** The Counterfactual Analysis Working Group (CAWG) & The Primitivist Powers Consortium (PPC)
  **Date:** October 26, 2023
  **Subject:** Findings following Adversarial Collaboration on Dispositional Ontology

  ## I. SUBSTANTIVE AGREEMENTS
  *We, the undersigned, having reviewed the standard literature on finks, masks, antidotes, and mimics, agree upon the following claims as the baseline for further inquiry. These are not merely linguistic conventions but commitments regarding the phenomena.*

  1.  **Failure of the Simple Conditional Analysis (SCA):** We agree that the biconditional "x is disposed to manifest M in response to S iff x would manifest M if x were to undergo S" is false. Counterexamples involving finks (extrinsic removal of the disposition upon stimulation) and masks (extrinsic prevention of manifestation despite the disposition remaining) are decisive against the SCA.
  2.  **Reality of the Phenomena:** We agree that objects possess stable properties that justify dispositional ascriptions (e.g., "fragile," "conductive") even in contexts where the associated counterfactuals are false due to extrinsic interference. The packed glass *is* fragile; the finked wire *is* live.
  3.  **Connection to Base Properties:** We agree that dispositional ascriptions supervene upon (or are grounded in) the intrinsic structural/categorical properties of the object (the "base") combined with the laws of nature. A change in disposition requires a change in the base, the laws, or the relevant extrinsic conditions.
  4.  **Explanatory Role:** We agree that dispositional properties play an indispensable role in scientific and everyday explanation. To say "the glass broke because it was fragile" is not merely a placeholder for a causal history; it captures a modal feature of the object that distinguishes it from non-fragile objects.
  5.  **Context Sensitivity:** We agree that the truth conditions of dispositional ascriptions are sensitive to context. Specifically, the set of "relevant possible worlds" or "normal conditions" invoked when evaluating a disposition shifts depending on pragmatic factors, though we disagree on whether this shift is semantic or metaphysical.
  6.  **Non-Circularity Goal:** We agree that a successful theory must avoid explicit circularity. Defining "fragility" explicitly in terms of "breaking" is acceptable; defining it in terms of "the property that causes breaking" is not, unless the causal relation is independently specified.

  ## II. RESIDUAL DISAGREEMENTS
  *While we agree on the data, we diverge on the metaphysical structure required to accommodate it. The following table isolates the precise points of contention.*

  | Topic | Counterfactual Analyst (CA) Formulation | Primitivist (PD) Formulation |
  | :--- | :--- | :--- |
  | **1. The Status of the Conditional** | The conditional (repaired with ceteris paribus clauses) provides the **truth conditions** for the dispositional ascription. The disposition *just is* the fact that the conditional holds (plus the base property). | The conditional is a **symptom** or reliable indicator of the disposition. The disposition is a primitive modal property that *makes* the conditional true (in normal conditions), not vice versa. |
  | **2. The "No Interference" Clause** | The clause "absent interfering factors" can be cashed out non-circularly by reference to **laws and base properties** alone, without presupposing the disposition being analyzed. | The clause "absent interfering factors" inevitably smuggles in reference to the **manifestation** itself (i.e., factors that prevent M). Thus, the analysis is circular and fails to reduce the modal force. |
  | **3. Direction of Grounding** | **Humean/Neo-Humean:** The laws of nature and the distribution of categorical properties ground the truth of the counterfactuals, which in ground the dispositional ascriptions. | **Dispositional Essentialist:** The dispositions (powers) are fundamental. They may ground the laws of nature (via Dispositional Essentialism) or exist alongside them as irreducible modalities. |
  | **4. Intrinsicness** | Dispositions are not strictly intrinsic. Whether an object has a disposition depends on extrinsic factors (like the absence of finks) because the truth of the conditional depends on extrinsic factors. | Dispositions are intrinsic properties. The finked wire *retains* the intrinsic power of conductivity; the fink merely prevents its exercise. The conditional fails because the world is hostile, not because the power is lost. |

  ## III. CRUXES AND TEST CASES
  *We have identified three specific sub-questions ("Cruxes") where settling the matter would significantly shift confidence toward one view. For each, we propose a case or argument we agree is relevant, and record our divergent predictions/interpretations in advance.*

  ### Crux 1: The Specification of "Normal Conditions"
  **The Question:** Can the "ceteris paribus" (no interference) clause be specified without referencing the manifestation *M*?
  **The Test Case:** *The Permanent Mask.* Imagine a glass permanently encased in a molecularly bonded forcefield that cannot be broken by any physically possible stimulus. The glass will never break, nor would it break if struck.
  *   **CA Prediction:** In this world, the ascription "fragile" becomes false or indeterminate. Since the conditional "if struck, it would break" is false in all accessible worlds, and the "no interference" clause must be defined via physical laws (which include the forcefield), the analysis correctly outputs "not fragile." The intuition that it remains fragile is a pragmatic error.
  *   **PD Prediction:** The ascription "fragile" remains true. The glass retains its intrinsic structure. The forcefield is an extrinsic blocker. If the analysis outputs "not fragile," the analysis is false, because it conflates the *possession* of a power with the *opportunity* to exercise it.

  ### Crux 2: The Direction of Explanation in Laws
  **The Question:** Do laws of nature explain why dispositions yield counterfactuals, or do dispositions explain the laws?
  **The Test Case:** *The Alien Law.* Consider a possible world with the same particle types (same base properties) but different laws of nature such that electrons do not repel each other.
  *   **CA Prediction:** In this world, electrons lack the disposition to repel. The disposition is contingent on the laws. Therefore, the conditional analysis holds: "If brought near, they would repel" is false, so the disposition is absent. The laws explain the disposition.
  *   **PD Prediction:** In this world, electrons retain the *power* to repel, but the power is "masked" by the alien laws. Alternatively, if powers ground laws, this world is metaphysically impossible. If it is possible, the disposition is intrinsic and the laws are derivative. The conditional fails to track the property.

  ### Crux 3: The "Vacuous Truth" Problem
  **The Question:** If an object is destroyed before it can ever be stimulated, does it possess the disposition?
  **The Test Case:** *The Short-Lived Isotope.* An isotope exists for 1 nanosecond and decays. It has a structural base identical to a stable isotope that is radioactive (disposed to decay). It never decays (it is destroyed first).
  *   **CA Prediction:** We must evaluate the counterfactual "If it were stimulated (or time allowed), it would manifest." If the closest possible world where it survives is too distant or violates laws, the conditional may be vacuous. The disposition ascription relies on the similarity of base properties to other objects that *do* manifest.
  *   **PD Prediction:** The isotope possessed the disposition essentially in virtue of its base property. The counterfactual is true *because* it had the power, even if the antecedent is impossible given its lifespan. The power is ontologically prior to the truth of the conditional.

  ## IV. NOTE ON VERBAL DISPUTE
  *We acknowledge a remaining suspicion that part of our disagreement is verbal.*

  *   **CA Suspicion:** The Primitivist is using "disposition" to refer to the **intrinsic base property** itself, while the Analyst is using "disposition" to refer to the **modal profile** of the object. If PD means "base property," CA agrees it is intrinsic and primitive. If CA means "modal profile," PD agrees it depends on extrinsic conditions.
  *   **PD Rebuttal:** We deny this is merely verbal. We claim there is a distinct ontological category—*modality*—that is not reducible to categorical base properties plus Humean laws. The dispute is about whether modality is fundamental, not just about how we use the word "fragile."

