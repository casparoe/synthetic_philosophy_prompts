  hey, i'm a software engineer working on a little side project — basically a clickable flowchart website that helps people figure out what they actually believe about the whole "future contingents" thing, you know, aristotle's sea battle: if it's true right now that there'll be a naval battle tomorrow, does that mean the thing is already fated? i've read a bunch of blog posts and watched some youtube videos on it but i have zero formal philosophy background, so i'm probably missing some distinctions.

  what i want from you is a taxonomy of the positions on whether statements about future contingent events have truth values. structure it as a decision tree where each branch point is a yes/no question about a concrete claim, and each leaf is a named position. the questions need to be things a normal curious person can answer without knowing the jargon — i want to actually put this on a website where people click through based on what they think about the cases, not based on which label sounds cool.

  here's the flow i'm imagining. the tree starts from the classic sea battle case: tomorrow there will either be a naval battle or there won't. the first question is something like: is the statement "there will be a sea battle tomorrow" already true or false right now, before the day arrives? then depending on the answer you hit the next splitting question, and so on until you land on a leaf with a position name.

  a few specific things i need. for each branch, label it with the exact claim that splits the positions at that point — not a vague topic area, the actual proposition someone is accepting or rejecting. for any combination of answers that no one actually defends, tell me explicitly and say why that cell is empty: is it because the combination is incoherent, or just unattractive, or simply unexplored? and if there are positions your tree genuinely cannot separate no matter how you cut it, flag them and give me a sentence on what distinguishes them even though the tree can't capture it.

  i don't need every obscure view in the literature. but i do want the main ones covered: the aristotelian view where future contingents are neither true nor false, the fatalist or logical determinist view, the ockhamist view that says they have truth values but that doesn't entail determinism, and whatever else you think belongs. i also want the tree to hit the question of whether the law of excluded middle can survice the failure of bivalence — that seems like an important fork that people might not think to ask about.

  oh and please write the whole thing as plain continuous prose, no bullet points, no headings, no bold, no tables. just like you're writing me an email walking through the taxonomy. my brain parses that way better than formatted outlines.
