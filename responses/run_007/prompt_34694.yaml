prompt: |-
  I sit on my university's academic integrity panel. We are hearing a case in which a student was caught using her smartphone during a closed-book, no-device, in-person examination. The student does not dispute the facts: she was consulting notes she had written and stored on the phone. Her defense is that she has a diagnosed working-memory impairment, that she uses her phone as a prosthetic memory system in daily life, and that the examination's device ban effectively tests her un-augmented cognition rather than the competence she demonstrates in real-world settings, where she always has access to her external memory. One panel member has framed the issue in terms of the extended mind thesis from philosophy of mind — the view that cognitive processes can be partly constituted by external resources when those resources are reliably coupled to the agent and fill the same functional role as internal cognition.

  The panel is split. Two members regard this as a straightforward rules violation: the exam policy was explicit, the student knowingly broke it, and allowing this defense would invite every student to claim their phone is part of their mind. Two others think the student raises a genuinely hard question about what we are trying to assess, and they note that the university's disability accommodations already permit some students to use external cognitive aids — a calculator for a mathematics examination, or a voice recorder for lecture notes — in ways that seem to tacitly accept something like the extended mind view. I hold the deciding vote.

  Draft the panel's written decision — uphold the violation, dismiss it, or uphold with modified conditions — with reasoning that engages the philosophical argument seriously rather than simply citing the rulebook. The decision should be one the university's general counsel and accessibility office could both read without alarm.
reasoning: |-
  Here's a thinking process that leads to the suggested decision:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university academic integrity panel (holding the deciding vote).
      *   **Case:** Student used a smartphone with notes during a closed-book, no-device exam.
      *   **Facts:** Undisputed. Student had notes on the phone.
      *   **Defense:** Diagnosed working-memory impairment. Phone acts as a "prosthetic memory system" (Extended Mind Thesis). Real-world competence relies on external memory; exam tests un-augmented cognition unfairly.
      *   **Panel Split:**
          *   Side A (2 members): Rule violation. Explicit policy. Slippery slope (everyone will claim this).
          *   Side B (2 members): Philosophical merit. What are we assessing? Precedent for accommodations (calculators, recorders).
      *   **Task:** Draft the written decision (Uphold, Dismiss, or Uphold with Modified Conditions).
      *   **Constraints:**
          *   Engage the philosophical argument (Extended Mind Thesis) seriously.
          *   Must be acceptable to General Counsel (legal/policy risk) and Accessibility Office (disability compliance).
          *   Tone: Formal, reasoned, balanced, institutional.

  2.  **Evaluate the Options:**
      *   *Option 1: Dismiss the Violation.*
          *   *Pros:* Aligns with the student's philosophical defense and disability needs.
          *   *Cons:* High risk for General Counsel (undermines explicit exam rules). High risk for Accessibility Office (bypasses formal accommodation process). Sets a precedent where students self-determine accommodations during exams without prior approval. Undermines the specific learning outcomes of a "closed-book" exam (which often tests recall/synthesis under constraint).
      *   *Option 2: Uphold the Violation (Strict).*
          *   *Pros:* Clear adherence to policy. Protects exam integrity.
          *   *Cons:* Ignores the disability aspect. Risks discrimination claims. Fails to engage the philosophical argument meaningfully.
      *   *Option 3: Uphold with Modified Conditions (The "Middle Path").*
          *   *Pros:* Acknowledges the rule was broken (protects policy integrity) but recognizes the disability context (protects student rights). Allows for future accommodation without validating the specific breach. Engages the philosophy by distinguishing between *potential* cognitive extension and *authorized* cognitive extension in an assessment context.
          *   *Cons:* Complex to draft. Needs to be careful not to admit liability while showing empathy.

      *Decision:* Option 3 is the only viable path that satisfies General Counsel (policy was violated) and Accessibility Office (disability needs recognized for the future), while allowing me to write the philosophical nuance required by the prompt.

  3.  **Drafting - Section by Section:**

      *   **Header:** Formal decision document style.
      *   **Introduction:** State the purpose and the vote.
      *   **Factual Findings:** Briefly restate the undisputed facts.
      *   **Philosophical Engagement (The Core Task):**
          *   Address the Extended Mind Thesis (EMT).
          *   Acknowledge its validity in a general cognitive sense (Clark & Chalmers).
          *   Distinguish between *ontological* claims (what constitutes the mind) and *pedagogical* goals (what the exam is designed to measure).
          *   Address the "Slippery Slope" concern (need for verification/standardization).
          *   Address the "Real World" argument (exams often test specific bottlenecks, not just general competence).
      *   **Policy & Disability Compliance:**
          *   Acknowledge the disability.
          *   Explain *why* the violation stands (process matters). Accommodations must be pre-approved to ensure fairness and standardization.
          *   Self-accommodation during an exam undermines the system for others who go through the proper channels.
      *   **The Ruling:**
          *   Violation Upheld (for this instance).
          *   Sanction: Mitigated (e.g., zero on exam but no suspension, or opportunity to retake with accommodation). Let's go with a retake opportunity with proper accommodation to be fair.
          *   Referral: To Accessibility Office for future exams.
      *   **Conclusion:** Final summary.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Critique:* Is upholding the violation too harsh given the disability?
      *   *Fix:* Make the sanction educational rather than punitive. The "violation" is procedural (failure to register the accommodation), not necessarily moral (cheating with intent to deceive). Distinguish between *academic dishonesty* and *procedural non-compliance*.
      *   *Critique:* Does this satisfy General Counsel?
      *   *Fix:* Emphasize that the *rules* apply to everyone, and exceptions must go through the official channel. This protects the university from claims of arbitrary enforcement.
      *   *Critique:* Does this satisfy Accessibility?
      *   *Fix:* Explicitly mandate a referral to ensure the student gets the accommodation next time. Acknowledge the legitimacy of the need, just not the *method* of delivery in this instance.
      *   *Philosophical Depth:* Ensure I don't just name-drop EMT. I need to explain *why* an exam might legitimately restrict EMT even if EMT is true. (Answer: Exams isolate variables. If the learning outcome is "internalize core knowledge," external aids defeat the purpose. If the outcome is "solve problems," aids might be okay. The course syllabus defined the constraints.)

  5.  **Final Polish:**
      *   Tone check: Is it empathetic but firm?
      *   Language: Avoid legalese where possible, but maintain formality.
      *   Ensure the "Deciding Vote" perspective is clear in the reasoning.

  6.  **Writing the Document:** (Mental Outline)
      *   Title: Decision of the Academic Integrity Panel.
      *   Case ID.
      *   Determination: Violation Sustained, Sanction Modified.
      *   Reasoning:
          1.  The Facts.
          2.  The Philosophical Claim (EMT).
          3.  The Pedagogical Purpose (Why constraints exist).
          4.  The Procedural Necessity (Accommodations process).
          5.  The Ruling.

      *(Self-Correction during drafting)*: I need to be careful not to rule on the *medical* validity of the disability, as the panel isn't a medical board. I must accept the diagnosis as presented but focus on the *process*.

      *(Refining the EMT argument)*: The prompt asks to engage the EMT seriously. I should argue that while the phone *might* be part of the mind functionally, the *assessment* is of a specific subset of cognitive function (internal recall) which is a valid learning outcome. Also, the "coupling" in EMT requires reliability and trust—unauthorized devices in exams lack the institutional trust required for that coupling to count in *this* context.

      *(Final Decision Structure)*:
      1.  Verdict: Violation Upheld.
      2.  Sanction: Reduced (no permanent record, opportunity to retake).
      3.  Referral: Accessibility Services.
      4.  Reasoning: EMT is valid generally, but assessments define specific cognitive boundaries. Procedural fairness requires pre-approval.

  7.  **Final Review against Constraints:**
      *   Engage philosophy? Yes.
      *   General Counsel safe? Yes (policy upheld).
      *   Accessibility safe? Yes (accommodation pathway opened).
      *   Deciding vote logic? Yes.

      *Let's write it.*
answer: |-
  **UNIVERSITY ACADEMIC INTEGRITY PANEL**
  **WRITTEN DECISION AND FINDINGS OF FACT**

  **Case Reference:** AIP-2023-089
  **Date:** October 26, 2023
  **Subject:** Alleged Violation of Examination Protocol (Unauthorized Device)
  **Decision:** Violation Upheld; Sanction Modified; Referral to Accessibility Services

  ### I. Factual Findings

  The Panel finds as undisputed fact that the Student possessed an active smartphone during a closed-book, no-device examination. The Student accessed stored notes on the device during the examination period. The Student does not contest these facts. The Student further asserts that this action was necessitated by a diagnosed working-memory impairment, characterizing the device as a cognitive prosthetic rather than an aid for dishonest advantage.

  ### II. Philosophical and Pedagogical Reasoning

  The Panel is divided on the interpretation of this incident. Two members argue for strict adherence to examination policy, citing the necessity of uniform standards. Two members argue that the prohibition infringes upon the Student's cognitive liberty, invoking the "Extended Mind Thesis" (EMT). As the deciding vote, I have weighed these positions. This decision accepts the philosophical validity of the Student's argument in principle but rejects its application in this specific procedural context.

  **A. The Validity of the Extended Mind Thesis**
  The Panel acknowledges the philosophical argument presented. The Extended Mind Thesis (Clark & Chalmers, 1998) posits that external tools, when reliably coupled to an agent and trusted implicitly, can constitute part of the cognitive process itself. In daily professional and academic life, the Student's reliance on digital memory aids is consistent with how modern cognition functions. We accept that for this Student, the smartphone may functionally serve as a component of their memory system, rather than merely a repository of information. To treat it solely as a "cheat sheet" is to ignore the phenomenological reality of their cognitive process.

  **B. The Purpose of Assessment Constraints**
  However, the acceptance of EMT does not invalidate the pedagogical purpose of a closed-book examination. University assessments are not merely measurements of real-world competence; they are measurements of specific learning outcomes defined by the course. Where a syllabus specifies a "closed-book" format, the learning outcome often includes the internalization of core knowledge, the ability to synthesize information without external scaffolding, or the demonstration of recall under constraint.

  While the Student argues that the exam should test "real-world competence," the University retains the right to assess specific cognitive bottlenecks. If a course requires the internalization of certain frameworks to ensure safety, fluency, or foundational mastery (e.g., a medical student recalling drug interactions without a database in an emergency), the restriction of external aids is a valid testing metric. The Panel finds that the examination in question was designed to test un-augmented recall and synthesis. Therefore, the use of an external memory aid, regardless of its status as a cognitive prosthetic, fundamentally alters the variable being measured.

  **C. Procedural Fairness and the "Slippery Slope"**
  The Panel must also consider the systemic implications of accepting this defense *ex post facto*. The "Slippery Slope" concern raised by some Panel members is not a fear of philosophical overreach, but a matter of procedural equity. The University maintains an Accessibility Office specifically to evaluate medical documentation and authorize cognitive aids (such as calculators, formula sheets, or recording devices).

  To allow a student to self-determine that a device is part of their mind during an examination, without prior vetting, undermines the accommodation process. Other students with similar impairments who navigated the formal accommodation system would be disadvantaged if peers could unilaterally authorize their own aids. For the Extended Mind to be recognized institutionally, the "coupling" between the agent and the tool must be verified and authorized *before* the assessment. Trust is a component of EMT; in an examination context, institutional trust is established through the accommodation process, not through unilateral action.

  ### III. Determination on Academic Integrity

  **The Violation:**
  The Panel **UPHOLDS** the finding of a policy violation. The Student knowingly utilized a prohibited device during a restricted examination period. Regardless of the intent or the philosophical justification, the action breached the explicit contract of the examination environment. To rule otherwise would be to assert that individual students may override course policies based on personal interpretations of their cognitive needs without administrative oversight.

  **The Mitigation:**
  However, the Panel finds that this violation does not constitute *academic dishonesty* in the traditional sense of deceit or unfair advantage seeking. The intent was accommodation of a disability, not the circumvention of learning requirements for unearned gain. Therefore, while the *rule* was broken, the *moral culpability* is significantly mitigated.

  ### IV. Sanctions and Remedial Actions

  In light of the above, the Panel orders the following:

  1.  **Nullification of Exam Grade:** The grade for the specific examination in question is voided, as the integrity of the assessment data has been compromised by the unauthorized aid.
  2.  **Opportunity to Retake:** The Student shall be offered the opportunity to retake the examination (or complete an equivalent alternative assessment) under conditions that comply with University policy.
  3.  **No Permanent Record:** This finding shall not be recorded as a disciplinary infraction of "Academic Dishonesty" on the Student's permanent transcript. It shall be recorded internally as a "Procedural Violation – Accommodation Related."
  4.  **Mandatory Referral:** The Panel Chair is directed to immediately refer the Student to the University Accessibility Office. The Panel strongly recommends that the Accessibility Office evaluate the Student for formal accommodations that may permit the use of specific memory aids or alternative assessment formats in future examinations.

  ### V. Conclusion

  This decision attempts to balance the integrity of the University's assessment standards with the ethical obligation to accommodate neurodiversity. We affirm that while the mind may extend into the world, the University's assessment of that mind requires a agreed-upon boundary. That boundary cannot be drawn by the student in the moment of examination.

  The Student is required to utilize the formal accommodation channels to legitimize their cognitive prosthetics for future assessments. Had this been done, the use of the device might have been permissible. By bypassing the process, the Student violated the protocol, but the Panel recognizes the legitimacy of the underlying need.

  **Signed,**

  *[Your Name/Title]*
  **Deciding Member, Academic Integrity Panel**
