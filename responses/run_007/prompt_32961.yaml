prompt: |-
  I'm taking a module on moral psychology and we've been deep in the situationist critique of virtue ethics for weeks now — you know, the argument from social psychology that people don't have stable character traits, so virtue ethics is built on sand. My professor has a very specific position on this but she won't just come out and state it; she's one of those who thinks you learn more by working through cases. So all term she's been giving verdicts on whether particular behavioural patterns count as evidence for or against possessing a virtue, and we're meant to reverse-engineer her underlying view. The exam will have a new case, and I want to be ready.

  Here are the verdicts I've collected from her (I've been keeping notes):

  1. A person who is honest in every domain of life except when lying would spare them serious embarrassment. She says this person doesn't have the virtue of honesty. Embarrassment isn't a strong enough countervailing factor.

  2. A person who is kind to everyone — friends, strangers, colleagues — when they're in a good mood, but consistently rude to everyone when they're in a bad mood (about thirty percent of the time). She says this person does have the virtue of kindness, though it's imperfect. The bad-mood lapses don't cancel the attribution; they just mean the virtue isn't fully stable.

  3. A person who is scrupulously fair in their professional life but shows clear favouritism toward their own children. She says this person has the local virtue of justice-in-the-workplace, but not the global virtue of justice.

  4. A person who helps a stranger in distress when they're not in a hurry, but walks straight past when they are. She says this pattern doesn't tell us much either way about compassion. Time pressure is a powerful situational factor that swamps dispositional differences — it's the wrong kind of test.

  5. A person who consistently donates to charity and volunteers, but whose motivation (on careful examination) is entirely about looking good to others. She says this person doesn't have the virtue of generosity. The reasons are all wrong.

  6. A person who is honest about everything except their taxes, which they've been cheating on for years. She says this doesn't look like a local virtue of honesty-in-most-domains. The tax domain is too central to cordon off — it's not some exotic, isolated failure. So they don't have the virtue of honesty.

  Now, the case she's hinted will be on the exam is this: a person who is consistently generous toward friends and family — gives time, money, emotional support, across a wide range of moods and situations — but is almost never generous toward strangers, even when the cost would be trivial. When asked why, they say they simply don't feel any pull to help people they don't know; they're not hostile to strangers, just indifferent. The generosity toward intimates is genuine, not performative, and it's quite stable.

  I'm trying to work out what she'll say. It seems to me there are at least two different principles she could be running that are broadly consistent with her track record — maybe something about the scope of the reasons that count as the right ones, maybe something about which domains are "central" enough that a failure there defeats the attribution, maybe something about excusing conditions. I'd like you to lay out the leading candidate rules, say what each predicts for the exam case, and give your best guess about which one she's actually committed to — with your reasoning. And if you could identify the further case that would most cleanly distinguish the candidates, that would be brilliant. Also, I'd be curious to know what would change your mind about which rule she's using — which of her verdicts is doing the heaviest lifting in your analysis, and whether you might be reading too much into it.
