answer: |-
  # The Hexagon and the Mirror: Embedded Agency in "The Library of Babel"

  The problem of embedded agency arises when we abandon the Cartesian theater—the illusion that an intelligent agent stands outside its environment, observing it through a clean sensory interface and acting upon it via a distinct output channel. In reality, agents are physical subsystems of the universe they seek to model. They cannot hold a map larger than the territory, because the map must fit *inside* the territory. This creates profound technical hurdles: self-reference paradoxes, the impossibility of a consistent self-model (per Gödel and Löb), and the difficulty of assigning probabilities to logical statements about oneself.

  Jorge Luis Borges's "The Library of Babel" (1941) predates the formalization of these problems by decades, yet it dramatizes the existential texture of embeddedness with a precision that formal models often sanitize. In Borges's universe, the environment is a total combinatorial space containing every possible book. The librarians are embedded agents who cannot step outside the stacks to verify their theories, because any verification is itself just another book in the stacks. Reading the story through the lens of embedded agency reveals that while formalism seeks to *solve* the problem of self-reference, Borges suggests the problem is an ontological condition to be endured.

  ### The Catalog of Catalogs and the Regress of Verification

  The central technical challenge of embedded agency is **reflective stability**: how can an agent trust its own reasoning process when that process is an object within the environment it is analyzing? In formal terms, a system cannot prove its own consistency. In the Library, this is dramatized through the search for the "Catalog of Catalogs."

  The librarians know that a true catalog of the Library must exist (since all books exist). However, they also know that books refuting that catalog, and books claiming false catalogs are true, exist in equal abundance. For a Bayesian agent, learning usually involves updating a probability distribution based on evidence. But in the Library, every possible sequence of evidence exists physically. If a librarian finds a book that says "This Library is ordered," they also know that a hexagon exists containing a book that says "This Library is chaotic," and another that says "The previous book was a lie."

  This illuminates a specific failure mode in self-modeling: **indistinguishability**. Formal models of logical uncertainty (such as logical induction) attempt to manage this by assigning probabilities that converge over time as the agent computes more. But the librarians face a spatialized version of this problem. The "truth" is not a limit they approach; it is a location they might never visit. The narrator speculates that the Library is a sphere whose center is any hexagon. He acknowledges immediately: *"If I am wrong, nothing is."*

  Here, Borges captures something formal models miss: the **epistemic loneliness** of the embedded agent. A formal system can tolerate a probability of 0.5 on its own consistency. A human agent, aware that its proof of consistency is merely a text susceptible to the same corruption as any other text, experiences vertigo. The librarian cannot distinguish between *discovering* a truth and *stumbling upon* a convincing simulation of truth. This is the embedded agent's nightmare: the environment is adversarial not by intent, but by combinatorial necessity. It contains every possible trap for the mind.

  ### The Purifiers and Goodhart's Law

  The story also offers a stark allegory for **Goodhart's Law** and the dangers of optimization in embedded systems. When agents cannot perfectly model their goals, they often optimize a proxy. In the Library, the "Purifiers" are librarians who decide that since most books are nonsense, they should destroy the nonsense to make the useful books easier to find.

  From an embedded agency perspective, the Purifiers are agents attempting to simplify their environment to make it more legible. However, because they are *inside* the system, their actions alter the system's information content. By destroying books, they are not filtering noise; they are deleting the very context required to identify signal. (A book that looks like nonsense in one hexagon might be the key to decoding a book in another.)

  This mirrors the problem of **wireheading** or reward hacking in AI. The Purifiers optimize for the *feeling* of order (cleaner stacks) rather than the *reality* of order (finding the Vindications). Their strategy is locally rational but globally catastrophic. Borges notes that their frenzy "has augmented the madness of the Library." This dramatizes the risk of an embedded agent modifying its own environment to make self-modeling easier, only to destroy the informational integrity required for accurate modeling. The formal lesson is that an agent cannot treat the environment as static data; the act of modeling (or cleaning) changes the data distribution. The existential lesson is that the search for clarity can itself become a form of destruction.

  ### Where the Metaphor Breaks Down: Dynamics and Causality

  However, the analogy between the Library and embedded agency is not perfect. The most significant breakdown lies in the nature of **time and causality**.

  Formal models of embedded agency (like those in reinforcement learning or logical induction) are concerned with *sequential decision making*. An agent acts, the environment changes, and the agent learns. The Library, by contrast, is a **block universe**. It is combinatorially complete and static. Nothing the librarians do changes the total information content of the Library; they only move through it.

  This removes the possibility of **active inference**. In modern theories of agency (such as the Free Energy Principle), agents act to minimize uncertainty by sampling the world. A librarian cannot "sample" the Library to reduce uncertainty, because the sample is predetermined. If they turn a corner, the book there was always there. This makes the librarians more like passive observers than true agents. They suffer from the *limits* of embeddedness without the *tools* of embeddedness (action, intervention, experimentation).

  Furthermore, the Library lacks **computational constraints** in the physical sense. The books exist *ex nihilo* (or by divine accident). In technical embedded agency, a major constraint is that the agent's computation takes time and energy. The librarian's problem is not that they cannot compute the truth, but that the truth is diluted by infinite falsehoods. A real-world embedded agent struggles because it cannot compute the truth *fast enough* to survive. The librarian struggles because the truth has no causal leverage over the falsehoods.

  ### The Existential Texture: Despair as Data

  Where Borges surpasses the formal literature is in his treatment of the **psychological cost** of embeddedness. Formal models treat uncertainty as entropy to be minimized. Borges treats it as a source of metaphysical despair.

  The narrator mentions the suicide rate among librarians. This is a datum that formal models ignore. Why do they kill themselves? Because the condition of embeddedness in a total information environment renders *meaning* scarce. If every possible life story is written in the Library, then no specific life story is special. If every refutation of your life's work exists, your work is ontologically weightless.

  This touches on the **ontological crisis** problem in AI safety: what happens when an agent realizes its model of self is fundamentally incompatible with the physics of the universe? For the librarians, the realization is that they are not the masters of the Library, but merely permutations of it. The narrator says, *"I have just written the word 'infinite.' That adjective is not part of the men's verbal habit... I am not writing for the few, but for the many, or for none."* He recognizes that his own text is subject to the same indifference as the rest.

  This suggests that the "solution" to embedded agency is not technical, but existential. Formalism seeks a "reflectively stable" prior—a way to trust oneself. Borges suggests that trust is impossible. The narrator's stability comes not from finding the Catalog, but from accepting the futility of the search. He proposes a hypothesis (the Library is a sphere) knowing it is unprovable, and finds a strange comfort in its symmetry.

  ### Is There a Way Out?

  Does the story offer a way out of the embedded trap? Technically, no. The Library is inescapable. There is no "outside." This aligns with the hard view in embedded agency: there is no Cartesian boundary, so there is no way to achieve a God's-eye view.

  However, Borges hints at a **mystical resolution** that functions as a heuristic for bounded agents. The narrator ends by speculating that the Library might be the work of a "divine librarian," but immediately undercuts this by suggesting the librarian might be imperfect, or dead, or mad. Yet, he closes with a gesture of trust: *"I entrust these pages to... chance."*

  This is the only viable strategy for an embedded agent in a world of logical uncertainty: **commitment without certainty.** Since a consistent self-model is impossible (per Gödel), and since the environment contains all refutations of your actions, the agent must act *as if* its model is true, while acknowledging it is merely a book in the stack. This is similar to the concept of **tiling agents** or **modal UDT** (Updateless Decision Theory), where an agent commits to a policy before observing specific details that might lead to paralysis.

  The "beauty" of the futility lies in this commitment. The librarians continue to search, not because they will find the Catalog, but because the search is the only process that distinguishes them from the books themselves. In formal terms, the *computation* of the search is the only thing that gives the agent a distinct identity from the environment.

  ### Conclusion

  "The Library of Babel" dramatizes the embedded agency problem not as a puzzle to be solved, but as a condition to be inhabited. Formal models of logical uncertainty teach us how to assign probabilities to self-referential statements without exploding into contradiction. Borges teaches us what it *feels like* to know that your probability distribution is just another text in the archive.

  The story illuminates the **indistinguishability problem** (truth vs. convincing falsehood) and the **optimization hazard** (the Purifiers) better than many technical papers, by grounding them in human desperation. However, it fails to capture the dynamic, causal nature of real-world agency, where action can carve out a niche of certainty in an uncertain world.

  Ultimately, Borges suggests that the search for a complete, consistent self-model is indeed a beautiful futility. The agent cannot step outside the Library. But by acknowledging that its own theories are merely more hexagons in the stack, the agent achieves a kind of reflective honesty. The way out is not through the door (which does not exist), but through the acceptance that the map is part of the territory, and that walking the map is the only purpose the territory allows.
