prompt: |-
  I am a novelist at work on a book set in Britain during the years around the 2016 referendum on membership in the European Union. My characters disagree about the vote itself, but the question my research keeps turning over is prior to that: who was entitled to a say in the first place. The franchise, as I understand it, was restricted to British, Irish, and qualifying Commonwealth citizens resident in the United Kingdom, together with British citizens living abroad who had been on the electoral register within the previous fifteen years. It therefore excluded most citizens of other EU member states who were living and working in the UK, excluded British citizens who had lived abroad for more than fifteen years, and excluded sixteen- and seventeen-year-olds. Several of my central characters are among the excluded — a Polish care worker in the Midlands, a retired couple from Yorkshire who have lived in Spain for twenty years — and I find I cannot write their situation honestly without first understanding the structure of the question itself.

  I would like you to analyze this referendum as a case study for the boundary problem in democratic theory: the problem of determining who should constitute the demos for a given decision. I am aware that the literature offers several standard answers — the all-affected-interests principle, the all-subjected principle, a stakeholder view, and the view that the demos is simply the historically given political community — and I want a disciplined mapping rather than a rehearsal of slogans. For each position, tell me where it would have drawn the boundary of the franchise, how it would judge the franchise that was actually used, and which features of the episode it handles well. Then say plainly where the theory runs out: which aspects of the referendum it misdescribes, ignores, or can accommodate only by stretching its own terms. Finally, tell me what the episode shows about the theory itself — whether it vindicates one of the standard positions, exposes a flaw in the way the question is usually posed, or reveals something the theory never anticipated. I want the analysis to run in both directions: the theory illuminating the case, and the case putting pressure on the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** A novelist writing about the 2016 UK EU Referendum (Brexit).
      *   **Core Question:** The "boundary problem" in democratic theory (who constitutes the *demos*?).
      *   **Specific Exclusions:** Polish care worker (EU citizen, resident), British expats in Spain (>15 years), 16-17 year olds.
      *   **Task:** Analyze the referendum as a case study using four standard democratic theories (All-Affected, All-Subjected, Stakeholder, Historical/Political Community).
      *   **Requirements for each theory:**
          1.  Where would it draw the boundary?
          2.  How would it judge the actual franchise?
          3.  What features does it handle well?
          4.  Where does it run out/fail/stretch?
      *   **Conclusion:** What does the episode show about the theory itself? (Vindication, flaw exposure, unanticipated revelation).
      *   **Tone:** Disciplined, analytical, not slogan-heavy, bidirectional (theory $\leftrightarrow$ case).

  2.  **Initial Fact-Check & Contextualization:**
      *   *Franchise Rules:* UK/Irish/Commonwealth citizens resident in UK + UK citizens abroad (<15 years). Excluded: Other EU nationals (e.g., Poles), UK expats (>15 years), 16-17 year olds (included in Scottish IndyRef, not UK EU Ref).
      *   *The Decision:* Leave or Remain in the EU.
      *   *The Consequence:* Profound economic, social, legal, and constitutional change for the UK and implications for the EU/relations.

  3.  **Drafting the Analysis - Theory by Theory:**

      *   **Theory 1: All-Affected Interests Principle (AAI)**
          *   *Concept:* Anyone whose interests are affected by the decision should vote.
          *   *Boundary:* Extremely wide. Includes EU citizens in UK (jobs, status), UK expats in EU (pensions, healthcare), future generations (16-17s), even EU citizens in Europe (trade, security).
          *   *Judgment:* The actual franchise was too narrow.
          *   *Strengths:* Captures the moral intuition behind the Polish care worker and the expats. Acknowledges interdependence.
          *   *Weaknesses:* "Affected" is vague. Is a slight economic ripple an "interest"? If *everyone* is affected, the demos becomes global (the "boundary problem" becomes infinite). It struggles with *degree* of affectedness.
          *   *Case Pressure:* The referendum showed that "affectedness" is often retrospective. People *felt* affected differently than objective metrics suggested.

      *   **Theory 2: All-Subjected Principle (ASP)**
          *   *Concept:* Anyone subject to the coercive authority of the laws resulting from the decision.
          *   *Boundary:* Those bound by UK law. Includes EU citizens in UK (subject to UK immigration law post-Brexit). Excludes UK expats in Spain (subject to Spanish/EU law, not UK law, mostly). Excludes 16-17s (still subject to UK law, so should be in).
          *   *Judgment:* Mixed. Better on EU residents, worse on expats. 16-17 exclusion is hard to justify here.
          *   *Strengths:* Links voting to legal obligation/coercion. Good for the Polish care worker argument.
          *   *Weaknesses:* "Subject to" is tricky. Expats are still subject to some UK laws (tax, treason). Also, the decision *changes* who is subjected. It's circular.
          *   *Case Pressure:* The referendum was advisory (technically) but treated as binding. Who was "subject" to the advice?

      *   **Theory 3: Stakeholder Citizenship (or "All-At-Stake")**
          *   *Concept:* Those with a genuine stake in the future of the polity, usually defined by enduring ties/contribution, not just presence.
          *   *Boundary:* Focuses on membership and long-term commitment. Might include 16-17s (future stakeholders). Might exclude short-term EU migrants (transient?). Might include expats if they maintain ties (taxes, property).
          *   *Judgment:* Nuanced. Could justify excluding some EU nationals if seen as transient, but unfair to long-term residents like the care worker. Could justify including expats if ties remain.
          *   *Strengths:* Handles the "community" aspect better than AAI. Explains why tourists don't vote.
          *   *Weaknesses:* Who defines a "stake"? Prone to nativist interpretation ("real Brits"). Hard to operationalize.
          *   *Case Pressure:* The campaign rhetoric ("take back control") was essentially a stakeholder argument against the AAI logic of open borders.

      *   **Theory 4: The Historically Given Political Community (The "Demos as Pre-Political" View)**
          *   *Concept:* The demos is not decided by theory but by existing constitutional/legal history. It's the "we" that already exists.
          *   *Boundary:* Exactly what the law said (UK/Irish/Commonwealth + 15yr rule).
          *   *Judgment:* The franchise was legitimate because it followed established precedent (General Elections).
          *   *Strengths:* Practical, stable, avoids infinite regress. Explains *why* the rules were what they were (path dependence).
          *   *Weaknesses:* Conservative/Status Quo bias. Doesn't answer the *normative* question of whether it *should* have been that way. Ignores the specific nature of a constitutional referendum vs. a general election.
          *   *Case Pressure:* This was the actual justification used by the government. But the unique nature of Brexit (constitutional change) made the "General Election" standard feel inadequate to critics.

  4.  **Synthesizing the Conclusion (What the case shows the theory):**
      *   *The "Second-Order" Problem:* The referendum was about the rules of the game (sovereignty), not just policy. Democratic theory struggles when the vote decides the boundary of the democracy itself.
      *   *The Temporal Problem:* Theories are static; the event was dynamic. Interests shifted during the campaign.
      *   *The Emotional/Identity Factor:* Theory assumes rational interests. The vote was driven by identity, belonging, and affect. The "Historical Community" view won because it resonated emotionally, not because it was theoretically robust.
      *   *The "Constituent Power" Paradox:* The people voted to limit their own future power (or change the structure).

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, or define it clearly.
      *   Keep the novelist's characters in mind (the Polish worker, the expats).
      *   Ensure the "bidirectional" requirement is met (Theory $\to$ Case, Case $\to$ Theory).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the 15-year rule for expats? *Yes, under ASP and Historical.*
      *   *Check:* Did I address the 16-17 year olds? *Yes, under AAI and Stakeholder.*
      *   *Check:* Did I address the Polish care worker? *Yes, under AAI and ASP.*
      *   *Critique:* Make sure I don't just list them but show the *tension*. The prompt asks for "where the theory runs out." I need to be sharp on the failures.
      *   *Refinement:* The "All-Affected" principle is often criticized as leading to a global demos. I need to make sure I explain *why* that's a problem for a national referendum.
      *   *Refinement:* The "Historical" view isn't really a *normative* theory, it's a descriptive one. I need to frame it as "Constitutional Positivism" or similar to treat it as a theoretical stance. Let's call it "The Constitutional Status Quo."

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion ties the threads together regarding the nature of democratic theory itself. (Proceed to generate output based on this structure).

  *(Self-Correction Note during drafting)*: I need to be careful with the "All-Subjected" principle regarding expats. Are they subject to UK law? Generally, no, unless they return or commit specific crimes. But they are subject to the *consequences* of the treaty change. I need to distinguish between being subject to the *law made* vs. the *decision made*. The decision changed the treaty, which changed the law. This is a key complexity.

  *(Another Note)*: The 15-year rule is arbitrary. The Historical view accepts it; others reject it. I must highlight that arbitrariness.

  *(Final thought)*: The prompt asks what the episode shows about the *theory*. I need to conclude that democratic theory often assumes a stable container (the state) which the referendum itself threatened to break. This is the "Boundary Problem" in action.

  8.  **Final Output Structure:**
      *   Introduction: Acknowledge the novelist's premise and the centrality of the boundary problem.
      *   Section 1: All-Affected Interests.
      *   Section 2: All-Subjected.
      *   Section 3: Stakeholder Citizenship.
      *   Section 4: The Constitutional Status Quo (Historical Community).
      *   Conclusion: What the Brexit Referendum reveals about Democratic Theory.

  (Proceeding to write response).
answer: |-
  This is a profound question for a novel to grapple with, because the 2016 referendum did not merely test political preferences; it tested the container in which those preferences are counted. In democratic theory, this is the *boundary problem* (or the *problem of the unit*): before you can vote, you must decide who votes. As you have noted, the 2016 franchise was not derived from first principles of justice for that specific vote, but was largely inherited from the rules for UK General Elections, with minor adjustments.

  Here is an analysis of the four standard theoretical approaches to the *demos*, mapped against the specific exclusions you have identified (the Polish care worker, the long-term expats, the 16–17-year-olds), followed by an assessment of what the episode reveals about the theories themselves.

  ---

  ### 1. The All-Affected Interests Principle (AAI)

  **The Theory:** Everyone whose interests are significantly affected by a decision should have a say in making it.

  **Where it draws the boundary:**
  This principle casts the widest net.
  *   **The Polish Care Worker:** Included. Her right to reside, work, and access services is directly determined by the outcome.
  *   **The Expats in Spain:** Included. Their healthcare, pension rights, and residency status are contingent on the UK-EU relationship.
  *   **16–17-Year-Olds:** Included. They will live with the economic and geopolitical consequences longer than any other cohort.
  *   **The Extension:** Logically, AAI struggles to stop at the UK border. EU citizens residing in Europe are affected by trade barriers and security cooperation. Depending on the severity of the economic fallout, citizens of trading partners outside the EU could claim an interest.

  **Judgment of the Actual Franchise:**
  Severely deficient. The actual franchise was arbitrary and morally unjust because it excluded those with the most tangible stakes in the outcome (resident EU nationals) while including those with potentially weaker stakes (e.g., a Commonwealth citizen with no intention of settling in the UK).

  **What it handles well:**
  It captures the moral intuition behind your Polish character. It articulates why it feels unjust that a decision determining her future was made without her input. It also highlights the intergenerational inequity regarding the younger voters.

  **Where the theory runs out:**
  *   **The Problem of Degree:** "Affected" is a spectrum, not a binary. Is a 1% drop in GDP an "interest"? If so, the demos becomes global. If not, who sets the threshold? The theory offers no mechanism for trimming the boundary to a manageable size.
  *   **Retrospective Clarity:** Interests are often only knowable after the fact. During the campaign, it was unclear whether leaving would harm or help the care worker's interests. The theory requires a knowledge of consequences that voters themselves did not possess.
  *   **The "Everything is Political" Trap:** If everyone affected votes, distinct political communities dissolve. It cannot explain why we have *national* elections rather than global plebiscites on every issue.

  ---

  ### 2. The All-Subjected Principle (ASP)

  **The Theory:** Everyone who is subject to the coercive authority of the laws resulting from the decision should have a say. This is often distinguished from AAI by focusing on legal obligation rather than general welfare.

  **Where it draws the boundary:**
  *   **The Polish Care Worker:** Included. She is subject to UK immigration and employment law, which the referendum outcome would alter.
  *   **The Expats in Spain:** Excluded (mostly). Once resident abroad, they are subject primarily to Spanish and EU law, not UK law. They are not coerced by the UK state in their daily lives.
  *   **16–17-Year-Olds:** Included. They are subject to UK criminal and civil law.
  *   **The Nuance:** This principle hinges on whether the referendum result is seen as *law* or *advice*. Since the vote was technically advisory (requiring Parliament to enact Article 50), one could argue no one was immediately "subjected" by the vote itself, only by the subsequent legislation.

  **Judgment of the Actual Franchise:**
  Mixed. It vindicates the inclusion of the Polish care worker (who is subject to UK coercion) but struggles to justify the exclusion of 16–17-year-olds (who are also subject to UK coercion). It offers a stronger justification for excluding the Spanish expats than AAI does, as they are outside the UK's coercive jurisdiction.

  **Where the theory runs out:**
  *   **The Circularity of Sovereignty:** The referendum was about *who* subjects the UK to law (the EU or Westminster). The ASP assumes a stable sovereign authority to determine who is "subject." But the vote was about changing the sovereign structure itself.
  *   **The 15-Year Rule:** ASP cannot explain the arbitrary 15-year limit for expats. A British citizen in Spain for 16 years is no less subject to the *consequences* of the treaty change than one there for 14 years, yet the latter could vote.
  *   **Advisory Status:** Because the referendum was not legally binding in itself, the ASP struggles to find a "subject" at the moment of voting. It conflates the vote with the legislation that followed.

  ---

  ### 3. The Stakeholder Citizenship View

  **The Theory:** The *demos* should consist of those with a genuine, enduring stake in the future of the polity, defined by membership, contribution, and long-term commitment, rather than mere presence or affectedness.

  **Where it draws the boundary:**
  *   **The Polish Care Worker:** Contingent. If she is viewed as a long-term contributor integrating into society, she is a stakeholder. If viewed as a transient economic migrant, she is not. This view is vulnerable to the rhetoric of the campaign itself.
  *   **The Expats in Spain:** Contingent. If they pay UK taxes, hold property, or intend to return, they are stakeholders. If they have fully integrated into Spain, their stake in the UK's future is diminished.
  *   **16–17-Year-Olds:** Included. They are the primary stakeholders in the long-term future of the nation.

  **Judgment of the Actual Franchise:**
  Nuanced but unstable. It criticizes the exclusion of the young (future stakeholders) and potentially the long-term EU residents (social stakeholders). However, it could theoretically justify excluding the Polish worker if her presence is framed as "temporary," which mirrors the rhetoric used by Leave campaigners.

  **What it handles well:**
  It captures the intuition that voting is about stewardship of a shared project, not just protecting individual interests. It explains why tourists don't vote, even if they are "affected" by a terrorist attack.

  **Where the theory runs out:**
  *   **Who Defines the Stake?** This is the critical failure. In the Brexit context, the definition of a "stakeholder" became the very thing being fought over. Was a stakeholder someone who wanted global trade (Leave) or someone who valued EU integration (Remain)? The theory requires a pre-agreed conception of the "polity's future," which was exactly what was in dispute.
  *   **Nativist Drift:** It risks collapsing into an ethnic or cultural definition of belonging. It struggles to distinguish between a "stake" and "blood and soil" without importing external liberal norms.

  ---

  ### 4. The Constitutional Status Quo (The Historical Community)

  **The Theory:** The *demos* is not determined by abstract moral principles but by existing constitutional history and legal precedent. The "people" is the entity that already exists as a legal corporation.

  **Where it draws the boundary:**
  *   **Exactly where the law drew it.** British, Irish, and qualifying Commonwealth citizens resident in the UK, plus the 15-year expat rule.
  *   **Rationale:** This is the franchise used for General Elections. Since the referendum was authorized by an Act of Parliament, it inherited the parliamentary franchise.

  **Judgment of the Actual Franchise:**
  Legitimate. On this view, the franchise was valid because it followed the established rules of the game. To change the franchise would have required a prior democratic decision, leading to an infinite regress.

  **What it handles well:**
  *   **Stability:** It avoids the paralysis of trying to calculate "affected interests" for every vote.
  *   **Explanation:** It is the only theory that accurately *describes* why the franchise was what it was. It explains the 15-year rule (an arbitrary legacy of previous legislation) not as justice, but as path dependence.

  **Where the theory runs out:**
  *   **Normative Silence:** It cannot answer the question "Was this fair?" It can only answer "Was this legal?" For your characters, this is unsatisfying. It tells the Polish worker she was excluded because of a historical accident, not a moral reason.
  *   **Category Error:** It treats a constitutional referendum (changing the structure of the state) the same as a General Election (choosing a government within that structure). Many theorists argue that when the *rules of the game* are up for grabs, the *players* should be re-evaluated. The Status Quo view ignores the higher stakes of the decision.

  ---

  ### Conclusion: What the Episode Shows About the Theory

  The 2016 referendum does not vindicate any single one of these positions. Instead, it exposes a structural flaw in how democratic theory usually poses the boundary problem.

  **1. The Paradox of Constituent Power**
  Democratic theory usually assumes a stable container (the State) within which democracy operates. The Brexit referendum was a moment of *constituent power*—the people acting to change the container itself.
  *   **The Revelation:** You cannot use the rules of the existing *demos* to decide the boundaries of the new *demos* without circularity. The UK Parliament (representing the old *demos*) decided who could vote on whether to limit the power of the UK Parliament.
  *   **For the Novel:** This creates a dramatic irony. The characters are arguing about the vote using rules that the vote itself was meant to validate or invalidate. The Polish worker is excluded by a sovereignty that claims to derive from "the people," but she is part of the people who live there.

  **2. The Temporal Mismatch**
  Theories like AAI and Stakeholder are static; they take a snapshot of "interests" or "stakes" at the moment of voting.
  *   **The Revelation:** The referendum showed that interests are dynamic and constructed *during* the campaign. The Polish care worker's "interest" changed as the rhetoric shifted from economics to identity. The expats' "stake" changed as the pound fell.
  *   **For the Novel:** Your characters' exclusion is not just a legal fact; it is a temporal one. They were frozen out of a moment that redefined their future. The theory fails to account for the *time* of the decision—the fact that a single day's vote locked in consequences for decades.

  **3. The Victory of the "Historical Community" via Populism**
  While the Historical/Status Quo view is theoretically weak (it offers no moral justification), it won the day politically.
  *   **The Revelation:** Democratic theory underestimates the power of *existing* boundaries. The "People" is not a philosophical category; it is a story people tell themselves. The Leave campaign successfully mobilized the "Historical Community" view ("Take Back Control" implies a pre-existing control that was lost).
  *   **For the Novel:** This suggests that for your excluded characters, the tragedy is not that the theory was misunderstood, but that a narrower, more exclusionary theory of democracy (the historical/ethnic nation) defeated a broader one (the cosmopolitan/affected community).

  **Final Assessment for the Writer**
  The episode suggests that the boundary problem is not a puzzle to be solved by better theory, but a conflict to be managed by power. The franchise was not "wrong" according to one theory and "right" according to another; it was a political choice that prioritized the *past* (Commonwealth ties, existing electoral rolls) over the *future* (young voters, resident EU nationals).

  For your novel, the honesty you seek lies in acknowledging that no theory perfectly covers your characters' situations.
  *   The **Polish worker** is the victim of the **All-Subjected** principle being ignored in favor of the **Historical** one.
  *   The **Expats** are the victims of the **Stakeholder** view being arbitrarily limited by a 15-year cliff-edge.
  *   The **Teenagers** are the victims of the **All-Affected** principle being overruled by paternalism.

  The referendum reveals that the *demos* is not a discovery of justice, but an assertion of authority. Your characters are not just excluded from a vote; they are excluded from the definition of "us" that the vote was designed to protect. That is the dramatic tension: they are fighting not just for a result, but for the right to be counted as part of the entity deciding the result.
