answer: |-
  You have put your finger on the exact nerve that makes the Common Prior Assumption (CPA) so controversial. Your intuition that it oscillates between "trivial tautology" and "empirically false" is shared by many of the sharpest critics and defenders of the framework.

  The confusion you feel stems from the fact that the CPA is doing three different jobs simultaneously, and proponents often slide between them without signaling the switch. To give you the conceptual map you want, we need to disentangle these three roles: the **Ontological** (what rationality *is*), the **Methodological** (how we *model* interaction), and the **Epistemic** (how we *handle* disagreement).

  Here is the map.

  ---

  ### 1. The Ontological Claim: Is there a "Unique Rational Prior"?

  This is the version you identified as "trivially true or clearly false." It asks: *Is there one specific probability distribution over the world that a perfectly rational agent must start with?*

  **The Argument For (Objective Bayesianism):**
  The strongest argument here is the **Principle of Indifference** (or Maximum Entropy). If two agents are truly "ideally rational," they are essentially identical logic machines. If they are presented with the same state space and the same background logic, and they have *no* information, there is no rational basis for one to assign probability 0.3 to an event and the other 0.7. To do so would be to introduce arbitrary noise into the system.
  *   **The Claim:** Differences in belief *must* be traceable to differences in evidence. If you strip away all evidence, only one "view from nowhere" remains.
  *   **The Implication:** If you and I disagree, and we know we have seen the same evidence, one of us is literally miscalculating. Rationality is convergent.

  **The Argument Against (Subjective Bayesianism):**
  The strongest counter-argument comes from **underdetermination** and **bounded architecture**.
  *   **The "Grue" Problem:** As Goodman showed, there are infinite ways to carve up hypothesis space. A prior is essentially a weighting of which hypotheses are "natural." There is no logical proof that "green" is a more natural kind than "grue." Different weightings are not logical errors; they are different *languages*.
  *   **Computational Feasibility:** A "rational" prior for a human is not a Solomonoff prior (which is uncomputable). It is a set of heuristics. Different heuristics (e.g., "trust sensory data" vs. "trust testimonial authority") are adaptive strategies, not logical truths.
  *   **The Triviality Trap:** If you allow *any* prior to count as rational, the CPA becomes vacuous. I can explain *any* crazy belief by saying, "Oh, they just have a crazy prior." To prevent this, Objective Bayesians say, "No, only *this* prior is rational." But they cannot derive *which* prior that is without smuggling in assumptions.

  **Verdict:** The ontological claim is likely false. There is no God's-eye prior. However, treating it *as if* it were true serves a specific purpose, which leads us to the second role.

  ---

  ### 2. The Methodological Claim: The Harsanyi Doctrine

  This is where the CPA gets its mileage in economics and game theory. John Harsanyi didn't necessarily believe all humans share a psychological prior. He proposed the CPA as a **constraint on the modeler**, not necessarily on the agents.

  **The Argument For (Explainable Disagreement):**
  In game theory, if you allow agents to have different priors, you can explain *anything*. If Player A attacks and Player B retreats, you can say, "A thought war was likely, B thought peace was likely." End of story. The model has no predictive power.
  *   **The Constraint:** By imposing a Common Prior, the modeler is forced to find the **informational asymmetry** that drives the behavior. "A attacked because A saw a signal B didn't see."
  *   **The Payoff:** This yields the **No-Trade Theorem**. If we have common priors and common knowledge of each other's positions, we cannot speculate against each other. I won't sell you a stock for \$100 if I know that you, a rational agent with my prior, are willing to buy it for \$100 (implying you know something I don't).
  *   **Why it matters:** It prevents "agreement to disagree" from being a lazy explanation. It forces the theory to locate the specific piece of private information causing the divergence.

  **The Argument Against (The Morris Critique):**
  Stephen Morris and others have argued that this is a **restriction on imagination**, not a law of nature.
  *   **Fundamental Uncertainty:** Sometimes disagreement isn't about private info; it's about **different models of the world**. If I believe the economy works according to Keynesian models and you believe it works according to Austrian models, we don't just have different data; we have different state spaces. A common prior assumes we agree on what *could* happen, just not how likely it is.
  *   **Empirical Failure:** In financial markets, speculative trade *does* happen. Massive amounts of it. The No-Trade theorem is empirically false. Therefore, the CPA (as a description of markets) is false. Agents *do* agree to disagree, and they bet on it.

  **Verdict:** The CPA is a useful **regulative ideal** for modeling. It forces clarity. But it is a bad **descriptive hypothesis** for complex systems where agents operate with different mental models, not just different data.

  ---

  ### 3. The Epistemic Claim: How Should You Update?

  This is the part that matters for your actual life. If the CPA is ontologically false but methodologically useful, how do you handle peer disagreement?

  **Scenario:** You and I are peers. We have the same data. We disagree.

  **Option A: Strict Conciliationism (CPA holds)**
  If you assume the CPA is true (we *should* have the same prior), then our disagreement is proof that at least one of us is processing the data incorrectly.
  *   **Action:** Split the difference. If I'm 80% sure and you're 20% sure, we should both move to 50%.
  *   **Risk:** This leads to "spinelessness." If I meet a conspiracy theorist who is my "peer" in IQ but has a different prior, conciliationism suggests I should move toward conspiracy theories.

  **Option B: Steadfastness (CPA fails)**
  If you assume priors can legitimately differ (Subjective Bayesianism), then my differing belief is just evidence that your "machine" weights evidence differently.
  *   **Action:** Stay put. Your prior is part of your cognitive identity. I am not required to adopt your cognitive identity.
  *   **Risk:** This leads to dogmatism. It insulates beliefs from social correction.

  **Option C: The "Common Likelihood" Compromise (The Real Solution)**
  The most sophisticated view (championed by philosophers like David Christensen and Adam Elga, though they debate the details) suggests we should distinguish between **Priors** and **Likelihood Functions**.
  *   **The Insight:** Maybe we don't share a prior, but we should share a **likelihood function** (how we update given evidence).
  *   **The Test:** Ask: *Is our disagreement due to how we started (prior), or how we process new info (likelihood)?*
      *   If I think vaccines cause autism because of a prior distrust of pharma, and you don't, that's a prior difference.
      *   If I look at the same study and think it's flawed methodology, and you think it's robust, that's a likelihood difference.
  *   **Action:**
      1.  **Check for Hidden Information:** Assume the CPA *methodologically* first. Ask: "What do you know that I don't?" (This is the Harsanyi move).
      2.  **Check for Model Mismatch:** If we have the same info, ask: "Are we using different causal models?" If yes, the CPA doesn't apply. We aren't peers in the relevant sense; we are speaking different languages.
      3.  **Update on the Fact of Disagreement:** Even if priors differ, the *fact* that a peer disagrees is itself evidence. If I trust my own rationality 90% and yours 90%, and we disagree, I must lower my confidence somewhat, but not necessarily to the midpoint. I update on the probability that *I* am the one who made the error this time.

  ---

  ### 4. Reframing the Confusion

  You asked if the question is messy. It is. Here is the reframe that clears the fog:

  **The Common Prior Assumption is not a claim about psychology; it is a claim about common knowledge of rationality.**

  When Aumann's theorem says "rational agents with common priors cannot agree to disagree," it is actually saying: *"If we both know that we are both Bayesian updaters, and we know we started from the same place, then our posteriors reveal our private information."*

  The breakdown happens when we drop the "started from the same place" clause.
  *   **If CPA is True:** Disagreement is a **signal**. It points to asymmetric information.
  *   **If CPA is False:** Disagreement is **noise** (or structural diversity). It points to asymmetric cognitive architecture.

  **The Synthesis:**
  Treat the CPA as a **heuristic for charity**, not a law of nature.
  1.  **Presume Common Priors first.** When you disagree, assume the other person is a rational version of *you* who has seen something you haven't. This forces you to hunt for their evidence. This is the "mileage" economists get from it.
  2.  **Revoke the Presumption second.** If you exhaust the search for hidden evidence and the disagreement persists, acknowledge that you have **divergent priors/models**.
  3.  **Do not average blindly.** If you determine the divergence is due to deep prior differences (e.g., fundamental values, metaphysical commitments), you are not rationally required to conciliate. You are allowed to be steadfast, provided you acknowledge that *they* are also allowed to be steadfast.

  ### Summary for Action

  *   **Don't** believe the CPA is ontologically true. Humans have different inductive biases.
  *   **Do** use the CPA as a discipline. When you disagree, act *as if* the CPA is true to force yourself to find the missing information.
  *   **If you find the info:** Update.
  *   **If you don't:** Acknowledge the prior difference. You can remain stubborn, but you must concede that your stubbornness is a feature of your specific cognitive architecture, not a universal rational requirement. You lose the right to claim the other person is *irrational*, only that they are *different*.

  The CPA is best understood as a **demand for transparency**. It says: "Don't hide behind 'we just see things differently.' Show me the data, or admit that you are running a different algorithm." That is the real work it does.
