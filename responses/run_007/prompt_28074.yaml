      *   *Problem:* "Function" still relies on a goal (survival/reproduction). Is that a value?
      *   *Verdict:* The crude machine analogy fails because it relies on an intelligent designer to ground "function." The sophisticated naturalist view (Evolutionary/Etiological) is better but still struggles with the "normative" leap from "statistically atypical" to "bad." The friend's argument is too strong; values enter at the stage of deciding *which* functions matter.

  6.  **Finding a Better Analogy (Requirement 5):**
      *   *Machine:* Too rigid.
      *   *Ecosystem:* Too loose, no clear "disease."
