          *   **Normativity:** A broken car is bad *for the owner*. A diseased heart is bad *for whom*? The organism? The genes? Society?
          *   **Boundaries:** Where does the machine end? Where does the body end? (Microbiome, environment).
          *   **Variation:** Machines are meant to be identical. Organisms vary. Is variation disease or just difference? (e.g., height, neurodiversity).
          *   **Values:** We value cars for *our* purposes. Do we value bodies for *their* purposes or *ours*?

  4.  **Identifying Hidden Imports (Requirement 3):**
      *   The machine analogy smuggles in a **Designer**. Without a designer, "function" is metaphorical.
      *   It smuggles in a **Fixed Standard**. Machines have a tolerance range. Organisms have homeostatic ranges that shift (plasticity).
      *   It smuggles in **External Purpose**. A car is for driving. A body is for... living? But what counts as "living well"?
