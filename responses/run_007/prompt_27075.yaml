  **(Self-Correction during drafting feedback):** I initially thought about telling them to separate HCH and Factored Cognition more. But for a short essay, treating them as a cluster is okay *if* they acknowledge the distinction. I should advise them to make that distinction explicit early on to avoid annoying experts.
  I also need to make sure they don't imply SE believes in perfect modularity. SE knows about "leaky abstractions." The argument should be that HCH *requires* a level of modularity that SE knows is impossible, or at least very hard.

  12. **Final Review against User Questions:**
