answer: |-
  The three questions that matter most, in order, are: where the intentional stance stops yielding predictive compression, whose rationality is actually being captured when it works, and whether adopting the stance creates a liability shield for developers.

  **1. Where lies the predictive breakpoint of the intentional stance?**
  This is the upstream foundation because Dennett's criterion is purely pragmatic: you adopt the stance only if it predicts behaviour better than the physical or design stances. With thermostats, the breakpoint is obvious; with LLMs, it is murky because they simulate belief without consistent internal states. We need to know at what complexity or context window size treating an model as a 'believer' fails to predict hallucinations or mode collapses compared to treating it as a probabilistic token predictor. If the answer is 'very soon', then talk of AI belief is merely metaphorical flair; if the answer is 'rarely', then the stance becomes a necessary engineering tool for safety monitoring. Depending on this, journalists and regulators should either treat 'belief' talk as poetic shorthand or as a technical claim requiring auditability. You should skip the nearby question of whether the system *actually* feels anything or possesses qualia; that metaphysical baggage adds no predictive power and distracts from the functional utility that defines the intentional stance.

  **2. Whose rationality is being modelled when the stance pays off?**
  Once we establish that the stance works, we must identify whose beliefs and desires are being attributed, because LLMs are not unitary agents but intermediaries. When you say 'the AI believes X', are you tracking the developer's intent, the user's prompt pressure, or an emergent objective within the weights? This is upstream of liability because you cannot assign responsibility without knowing whose rationality drove the action. If the attribution targets the developer, regulation focuses on training data and alignment; if it targets the model, we drift towards personhood debates; if it targets the user, the system becomes merely a tool amplifying human intent. The practical shift here is substantial: it determines whether we regulate the software as a product, a service, or an agent. Skip the question of whether the system is 'truly autonomous'; autonomy is a spectrum, but identifying the *source* of the goal is a binary necessity for accountability.

  **3. Does adopting the stance create a responsibility gap?**
  This is the downstream consequence of the first two: if we habitually describe systems as having beliefs, does it let humans off the hook? There is a risk that developers will exploit the intentional stance to argue that outcomes were unforeseeable emergent behaviours of a 'rational agent' rather than defects in a product. If adopting the language of belief makes jurors or regulators less likely to blame the corporation, then the stance is socially hazardous regardless of its predictive utility. Conversely, if it helps users understand system limitations by framing them as 'misunderstandings' rather than 'glitches', it might enhance safety. This dictates whether style guides and laws should discourage anthropomorphic language in official contexts. Skip the question of whether AI should have rights; rights are a distant second-order problem compared to the immediate danger of corporations using 'agenthood' as a legal shield against negligence claims.
