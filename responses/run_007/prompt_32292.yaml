prompt: |-
  ok so i've been going in circles on hofstadter's superrationality stuff — the platonia dilemma and the luring lottery — and before i read any more arguments about whether superrationality is "really" rational, i want the full spec. write the desiderata for a theory of what an individual player should do in symmetric, one-shot, no-communication games like these. by "theory" i mean a rule that, for a given payoff structure and a given assumption about who you're up against, tells each player what to do and says why that's the rational move, not just an equilibrium.

  make it cover at least these, but add anything you think is genuinely required and cut anything you think is a red herring:

  - the platonia dilemma: 20 people, one telegram, a billion if exactly one person sends, nothing otherwise, no communication. why "everyone should send" and "no one should send" both look wrong, and what an adequate theory has to say instead.
  - the fact that any deterministic symmetric rule seems to gaurantee either 0 or 20 senders, so the theory has to say something about mixed strategies — and what could justify one particular probability rather than another.
  - the luring lottery: you can submit as many entries as you like on one postcard; the prize, one million dollars divided by the total number of entries, is awarded to a randomly drawn entry. naive expected-value reasoning makes your best response a moving target that runs away to unbounded entries, while the superrational prescription is finite and depends on how many other players you expect.
  - the distinction between players who reason exactly like you (so you know they'll land on the same answer), players who are just "rational" in the usual game-theoretic sense, and a mixed population of ordinary humans — who, in the actual luring lottery, submitted numbers like a googolplex.
  - the constraint that there's no communication and no causal influence between players, so the theory can't let your choice make anyone else's choice.

  for each desideratum give the case or consideration that makes it a requirement, and say which ones are non-negotiable and which are more like commitments of one camp. then give me a definite verdict, not a survey: which single desideratum does the most work seperating superrationality from standard game theory, and do you think any pair of the desiderata can't be jointly satisfied? if the whole superrationality program is just sneaking in a false assumption about identical reasoners, say so and show where it breaks.
