answer: |-
  The legal practice of advance directives (ADs) presents a striking philosophical puzzle. It permits a past self to bind a future self in matters of life and death, even when the future self appears to dissent, while simultaneously prohibiting self-binding in contexts like slavery or long-term labor contracts. To analyze this, we must disentangle the metaphysical assumptions about personal identity from the normative assumptions about autonomy, and then test these against the broader legal landscape.

  ### I. The Implicit Theory of Identity and Autonomy

  The practice of advance directives does not rest on a single, monolithic philosophical theory, but rather a pragmatic amalgam of legal identity and a specific conception of autonomy.

  **1. Personal Identity: Biological Continuity over Psychological Continuity**
  Strictly speaking, the law presupposes **biological and legal continuity**, not necessarily deep psychological continuity. Legally, the incapacitated patient is the same entity as the signer because they occupy the same body and hold the same legal rights. The law does not require that the demented patient remember signing the document, nor that they retain the same values or personality traits.

  However, for the directive to be *morally* justified (rather than just legally valid), the practice leans on a theory of **psychological continuity regarding critical interests**. It assumes that the values held at $T_1$ (competence) are the "true" values of the person at $T_2$ (incapacity), even if the psychological machinery required to access or articulate those values is broken. If the law assumed the incapacitated patient were a metaphysically distinct person (a "new" self created by brain injury), enforcing the AD would be akin to enforcing one person's will upon a stranger. Thus, while the law relies on biological identity for enforcement, it borrows from **Lockean psychological continuity** for justification: the person persists insofar as their critical life-values persist, even if their current consciousness cannot access them.

  **2. Autonomy: Precedent Autonomy and Critical Interests**
  The dominant theory of autonomy here is **Precedent Autonomy**, most famously articulated by Ronald Dworkin. This view distinguishes between:
  *   **Experiential Interests:** What the patient feels in the moment (e.g., avoiding pain, the immediate desire to live).
  *   **Critical Interests:** What makes a life good overall according to the person's enduring values (e.g., "I do not want to live in a vegetative state").

  The AD practice presupposes that **critical interests outweigh experiential interests**. When a patient cries out against treatment withdrawal, the law interprets this as an expression of experiential interest (instinctual survival), which is overridden by the precedent autonomy of the competent self who weighed the quality of life against mere existence.

  Alternatively, this fits well with a **Narrative View of Autonomy** (e.g., Marya Schechtman). On this view, a life is an unfolding story. Autonomy is not just about discrete choices but about authoring the coherence of the whole narrative. The AD allows the "author" to ensure the ending of the story aligns with the themes of the beginning, preventing the "character" in the final chapter (the incapacitated self) from hijacking the plot due to a compromised mental state.

  ### II. Strict Presuppositions vs. Philosophical Fits

  To understand the legal logic, we must distinguish what the practice *requires* from what merely *supports* it.

  **Strict Presuppositions (What the law *must* assume):**
  1.  **Numerical Identity:** The signer and the patient are the same legal subject.
  2.  **Capacity Threshold:** There is a binary or threshold distinction between "competent" and "incompetent." The prior self had it; the later self lacks it.
  3.  **Non-Autonomy of the Incapacitated:** The current expressions of the incapacitated patient (crying, struggling) are not treated as valid exercises of autonomy. They are treated as symptoms of a condition, not choices.
  4.  **Validity of Prior Consent:** A decision made while competent retains its normative force after competence is lost, provided it was not revoked while competent.

  **Good Fits (What aligns well but isn't strictly required):**
  1.  **Deep Psychological Continuity:** The law enforces ADs even if the patient's personality changes radically (e.g., a formerly stoic person becomes cheerful in dementia). The law does not strictly require the values to persist, only the *instruction*. Thus, the practice fits psychological continuity theories but does not presuppose them.
  2.  **Narrative Coherence:** While a narrative view justifies ADs nicely, the law does not require the patient to have a coherent "life plan." A simple instruction ("No tubes") suffices without a broader narrative context.

  **Philosophically Underdetermined Areas:**
  1.  **The Status of the Incapacitated Self:** The law does not decide whether the incapacitated self is a "different person" metaphysically. It treats them as the *same person* with *diminished rights*. It leaves open whether the current suffering matters intrinsically or only instrumentally.
  2.  **The Source of Authority:** It is unclear whether the authority of the AD comes from the *liberty interest* of the past self (right to refuse) or the *best interest* of the future self (protection from unwanted suffering). The law conflates these, but philosophically they are distinct.

  ### III. Reconciling the Inconsistency: Self-Binding and Inalienable Rights

  The central tension remains: Why can I bind my future self to die (via AD) but not to work (contract) or to serve (slavery)? If the earlier self can override the later self in medicine, why not in labor?

  **1. Negative vs. Positive Liberty**
  The reconciliation lies in the distinction between negative and positive liberty.
  *   **Advance Directives** are primarily exercises of **negative liberty** (freedom *from* bodily intrusion). They are shields. The law allows you to bind your future self to *refuse* intervention because bodily integrity is an inalienable right. You cannot be forced to accept treatment you previously rejected.
  *   **Slavery/Long-term Contracts** involve **positive liberty** (freedom *to* act) and the alienation of future agency. They create obligations to *perform*. The law prohibits binding the future self here because it views the capacity to choose as an ongoing public good that cannot be permanently surrendered.

  **2. The Capacity Trigger**
  ADs are unique because they are **conditional on the loss of capacity**. A Ulysses contract (binding oneself while competent) is enforceable in medicine only because the enforcement trigger is the *absence* of the ability to choose otherwise.
  *   In slavery or employment, the individual retains capacity but is legally barred from changing their mind.
  *   In ADs, the individual *lacks* the capacity to change their mind. The law is not silencing a competent dissent; it is managing the affairs of a legally non-autonomous entity based on prior instructions.

  **3. Irreversibility and Harm**
  The law treats bodily integrity and life as unique goods. Violating an AD results in irreversible bodily violation or the prolongation of an existence the person deemed intolerable. Breaching an employment contract causes financial harm, which is reparable. The law is more willing to enforce self-binding where the cost of *not* enforcing it is the irreversible violation of the self's critical interests (bodily integrity).

  ### IV. Does the Practice Require Revising Other Doctrines?

  If we take the theory of **Precedent Autonomy** seriously, does it demand we allow other forms of self-binding?

  **The Argument for Revision:**
  If autonomy is about governing one's life according to a plan (Narrative View), then preventing someone from signing a 20-year irrevocable contract is paternalistic. It privileges the "momentary self" over the "planning self." If the past self can decide the medical fate of the future self, why can it not decide the economic fate?

  **The Argument for Consistency (Status Quo):**
  However, the practice of ADs does not necessarily require revising other doctrines if we accept the **Protection of Basic Agency** principle.
  *   The law allows self-binding in ADs because the future self *cannot* exercise agency (due to incapacity).
  *   The law forbids self-binding in contracts/slavery because the future self *can* exercise agency, and the law prioritizes keeping that agency free from past encumbrances.

  Therefore, the inconsistency is superficial. The underlying principle is: **You can bind your future self only when that future self lacks the capacity to be bound by anything else.**

  **Conclusion**
  The practice of advance directives presupposes a **biological-legal identity** coupled with a **precedent autonomy** model that prioritizes critical interests over experiential ones. It is philosophically underdetermined regarding the metaphysical status of the incapacitated self, treating them as the same person but one whose current preferences are legally inert.

  The apparent inconsistency with other self-binding doctrines is reconcilable. The law distinguishes between binding a future self that *cannot choose* (ADs) versus binding a future self that *can choose* (contracts/slavery). Furthermore, ADs protect negative liberty (bodily integrity), whereas other self-binding doctrines restrict positive liberty. The law does not need to revise its reluctance to enforce irrevocable contracts; rather, it recognizes that medical directives are not truly "binding" the future self in the same way, but rather extending the protective shield of the competent self over a vulnerable successor who shares their body and legal identity. The practice is not a commitment to the absolute sovereignty of the past self, but a specific exception made for the unique vulnerability of the incapacitated body.
