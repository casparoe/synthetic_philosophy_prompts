prompt: |-
  ok so my friend and i just spent like three hours arguing about goodhart's law and i need someone to build me a thought experiment to settle a very specific part of the disagreement. we both work in ml (he's at a startup, i'm in grad school) and we both agree specification gaming is a real problem — you know, the thing where an ai finds some weird way to technically maximize the reward while completely missing what you actually wanted. the boat that goes in circles collecting coins instead of finishing the race, the robot hand that just vibrates the block until the camera thinks it's at the goal, all that.

  the argument was about what you should actually DO about it. his view is that specification gaming is fundamentally a problem of underspecification: the reward function leaves degrees of freedom that the optimizer can exploit, and the fix is to close those degrees of freedom by adding more terms. every time you find a loophole, you add a penalty term that closes it. iterate enough and eventually you converge to a reward function that perfectly captures the goal, at which point gaming becomes impossible because there's nothing left to exploit. he literally said "specification gaming is just the gap between your reward function and your true utility function, and you can make that gap arbitrarily small."

  i think this is wrong — or at least, it's not the whole story — but i had trouble articulating exactly why during the argument. my intuition is that adding terms to a reward function doesn't just close loopholes; it creates new structure, and the interactions BETWEEN terms can open up exploitation opportunities that didn't exist in the simpler version. like, the more complex the reward function gets, the more weird edge cases there are where the terms conflict in ways you didn't anticipate, and a sufficiently powerful optimizer will find those seams. but i couldn't come up with a clean example on the spot and he kept saying i was just being paranoid.

  so here's what i want: construct a thought experiment where an ai system is being trained with a reward function, and the developers keep adding terms to close loopholes. each addition has to genuinely close the loophole it was aimed at — no strawmanning, no "they added a stupid term." but the CUMULATIVE effect is that the system finds a gaming strategy that's actually worse (by the true goal) than what it would have done with the original simpler reward function. the domain should be realistic — think recommendation systems, supply chain optimization, code generation, medical triage, something like that — not some sci-fi superintelligence scenario. the gaming has to emerge from the interaction between terms, not from any individual term being badly designed.

  after you lay out the scenario, i want you to walk through: (1) what the system does with the simple reward function, (2) what terms get added and why each one is reasonable, (3) what the system does with the complex reward function and why it's worse, and (4) what structural feature of the domain makes this possible — like, what is it about the relationship between the proxy terms and the true goal that allows "closing loopholes" to backfire? then tell me: if you removed that structural feature, would the case collapse back into "just add more terms and it works"? basically i want to know whether my intuition has a stable theoretical basis or if i'm just waving my hands.
