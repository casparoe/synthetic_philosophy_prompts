  Based on the pattern of verdicts your friend has provided, I predict she will judge **The Loop** case to be **impermissible**.

  While this might surprise you given that the case involves pulling a lever (as in the Standard Switch), the structural role of the single victim in The Loop aligns more closely with the Footbridge case than the Switch. Below, I outline the reasoning behind this prediction, the rival principles at play, and a sixth case designed to distinguish between them.

  ### The Implicit Principle: Non-Instrumentalisation

  Your friend's verdicts on the first four cases map neatly onto a distinction often discussed in moral philosophy as the **Doctrine of Double Effect**, or more simply, the **Means Principle**.

  *   **The Pattern:** In the *Standard Switch* and *Hospital Wing*, the death of the one person is a foreseen but unintended side effect of diverting a threat. The threat (the tram or trolley) is redirected away from the five; the fact that it subsequently hits the one is regrettable, but their body is not *required* to stop the threat. The siding would function safely even if the one person were not there.
  *   **The Contrast:** In the *Footbridge* and *Transplant* cases, the one person is used as a **means** to an end. In the Footbridge, the man's mass is the mechanism that stops the tram. In the Transplant, the visitor's organs are the resource that saves the patients. Your friend rejects these because they involve treating an innocent person as a tool or obstacle to be exploited.

  In **The Loop**, the single person on the track serves as a human buffer. As you noted, if the loop were empty, the tram would circle back and kill the five. Therefore, the presence and destruction of the one person are *necessary* to save the five. Their body is doing the work of the brake. If your friend's rejection of the Footbridge case stems from a deep-seated intuition that we must not use innocent people as instruments, she should find The Loop impermissible for the exact same reason, regardless of whether she uses her hands or a lever to initiate the sequence.

  ### The Rival Principle: Threat Redirection

  There is, however, a rival principle that fits the first four verdicts just as well but yields the opposite conclusion for The Loop. This is the **Threat Redirection Principle**.

  This rule states that it is permissible to redirect an *existing* threat away from a greater number of people towards a lesser number, provided you do not introduce a *new* threat.
  *   **Fits Cases 1–4:** In the *Switch* and *Hospital*, you redirect an existing threat (Permissible). In the *Footbridge* and *Transplant*, you initiate a new causal sequence (pushing a man, killing a visitor) to stop the threat (Impermissible).
  *   **Prediction for The Loop:** Under this rule, The Loop is **permissible**. You are merely pulling a lever to divert the existing tram onto a different track. The fact that the track loops back or that the person stops the tram is a detail of the geography, not a change in the moral nature of your act (redirecting vs. creating).

  ### Why I Believe She Uses the Means Principle

  I predict your friend will side with the **Means Principle** (judging The Loop impermissible) rather than the Threat Redirection Principle.

  While both principles explain the first four cases, the *Footbridge* case is usually the emotional anchor for laypeople. When non-philosophers explain why pushing the man is wrong, they rarely say, "I initiated a new causal sequence." They say, "You can't use him," or "It's not his job to stop the tram." This language points to the status of the victim, not the mechanics of the threat.

  In The Loop, the victim's status is compromised in a way that does not occur in the Standard Switch. In the Switch, the victim is unfortunately in the way. In the Loop, the victim is *part of the safety mechanism*. Given that your friend has spent a year refining these intuitions, she has likely honed in on the moral weight of the victim's role. The lever is a distraction; the instrumentalisation is the core issue.

  ### The Decisive Sixth Case

  To test whether she is truly following the **Means Principle** or the **Threat Redirection Principle**, you need a case where one principle says "Permissible" and the other says "Impermissible," without relying on the specific mechanics of The Loop.

  I propose **The Turntable Case**:

  > **The Turntable.** Five people are standing on one side of a large, rotating turntable. A single person is standing on the other side. A runaway boulder is rolling directly towards the five. You cannot stop the boulder, but you can press a button to rotate the turntable. If you do, the five will move out of the path of the boulder, but the single person will rotate *into* the path and be killed.

  **How this distinguishes the rules:**

  1.  **If she follows the Means Principle:** She should judge this **permissible**. You are not using the single person as a tool or a shield; you are simply moving the potential victims. The single person is not *stopping* the boulder; they are merely unfortunate enough to be moved into its path. Their body performs no function in saving the five. This aligns with her verdict on the *Standard Switch* (saving the five is the goal, the one's death is a side effect).
  2.  **If she follows the Threat Redirection Principle:** She should judge this **impermissible**. You have not redirected the *threat* (the boulder is still rolling on the same line); you have moved the *victims*. This violates the strict condition of redirecting an existing threat, aligning more closely with her verdict on the *Footbridge* (intervening on the people rather than the threat).

  If she says The Loop is impermissible (as I predict) but The Turntable is permissible, she is consistently applying the **Means Principle**. If she says both are impermissible, she is likely following **Threat Redirection**. This sixth case should provide the clarity you seek in your correspondence.
