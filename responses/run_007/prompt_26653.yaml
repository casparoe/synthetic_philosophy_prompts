prompt: |-
  I direct a small foundation's grantmaking program, and every quarter I sit on renewal decisions for multi-year grants. I have read enough rationalist writing on sunk costs — the Concorde fallacy, the escalation-of-commitment literature, the standard one-line rule — to know both the standard answer and its limits. The one-line rule is that past spending should not influence the decision and only forward-looking costs and benefits count. That rule is clearly right about something, but as a standing policy for an institution that funds risky work it is also clearly incomplete. I want the sophisticated version turned into something my team can actually run.

  Write a decision procedure for whether to continue funding a project that has missed its milestones. These decisions involve several years of funding, people's livelihoods, and our credibility with other funders. The procedure should be a sequence of questions, and for each question it should specify: what counts as a sufficient answer, which part of the underlying theory the question operationalizes, and the most likely way a non-specialist will misapply it. It should say where the procedure stops with a no, where it hands the decision to a person because the residual question is one of values rather than facts, and what the procedure cannot settle. It must be runnable by a program officer without formal training in decision theory in under an hour, and its output should be a memo that can go to our board.

  The procedure needs to be honest about the following. Some things that look like sunk-cost reasoning are forward-looking in disguise: past spending can be evidence about project quality or about our own calibration; a half-built intervention can make the next phase cheaper than starting over; abandoning a project can destroy relationship-specific capacity, break promises to partners, or demoralize a field we want to keep working in; and a reputation for pulling funding at the first bad result can make future grantees unwilling to propose the very kind of risky work we exist to fund. Other things are genuinely the fallacy but still real as psychological and organizational costs, and I need to know how the procedure treats those — which it counts, which it discounts, and which it labels irrelevant. And the naive rule has its own failure mode: applied mechanically, it can amount to a policy of never updating on the fact that we chose badly, and it can be dynamically inconsistent with the commitment we would have wanted to make before the bad news arrived.

  Run the procedure on three cases: (a) a project whose midpoint results are weak in absolute terms but exactly what the project's theory predicted, so the results are not bad news about the project; (b) a project that has built specialized infrastructure and staff capacity that would be lost if we walked away; and (c) a project we continue only because the board member who championed it does not want to admit failure. At least one case should come out the opposite of what the naive sunk-cost rule would say, and at least one should come out the opposite of what we would prefer to hear. Flag any case the procedure cannot settle and say what additional fact or value judgment would settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Director of a small foundation's grantmaking program.
      *   **Task:** Create a decision procedure for renewing multi-year grants when milestones are missed.
      *   **Context:** High stakes (livelihoods, credibility, risky work).
      *   **Core Tension:** The standard "sunk cost fallacy" rule (ignore past spending) vs. the reality of institutional funding (relationships, signaling, capacity building, calibration).
      *   **Requirements:**
          *   Sequence of questions.
          *   For each question: Sufficient answer, underlying theory operationalized, common misapplication.
          *   Stop conditions (No, Hand-off to Human/Values, Unsettled).
          *   Runnable by a program officer (PO) in <1 hour.
          *   Output: Memo-ready.
          *   Must address specific nuances: Past spending as evidence, completion costs, relationship/reputation costs, psychological/organizational costs, dynamic inconsistency.
          *   **Test Cases:** Run on three specific scenarios (a, b, c).
          *   **Outcome Constraints:** At least one case contradicts naive sunk-cost rule, at least one contradicts preference, flag unsettled cases.

  2.  **Theoretical Framework & Nuance Integration:**

      *   *Sunk Cost Fallacy:* Don't throw good money after bad *just* because you spent money.
      *   *Informational Value of Past Spend:* If we spent \$1M and got nothing, maybe the team is incompetent (bad signal). If we spent \$1M and learned the theory is wrong, that's valuable data (good signal).
      *   *Switching Costs:* Is it cheaper to finish than restart? (Economic efficiency).
      *   *Reputational/Relational Capital:* Will cutting funding hurt our ability to attract top risk-takers? (Game theory/Signaling).
      *   *Internal Psychology:* Are we keeping this just to save face? (Bias check).
      *   *Dynamic Consistency:* Would we have funded this *ex-ante* knowing what we know now? (Pre-commitment).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Needs to be linear, clear, and actionable.
      *   *Step 1: The Counterfactual (The "Ex-Ante" Test).* This addresses dynamic inconsistency. If we knew then what we know now, would we start this today?
      *   *Step 2: The Information Value.* Addresses "past spending as evidence." Did we learn something valuable, even if the goal wasn't met?
      *   *Step 3: The Completion Cost.* Addresses "half-built intervention." Is the marginal cost to finish lower than starting a new bet?
      *   *Step 4: The Ecosystem Signal.* Addresses "reputation for pulling funding." Does cutting this hurt future deal flow?
      *   *Step 5: The Internal Bias Check.* Addresses "board member champion." Are *we* the problem?
      *   *Step 6: The Values Hand-off.* Where facts end and values begin.

      *Refining the Questions:* Make them specific enough to avoid vague "yes/no" but simple enough for a PO.
      *Refining the Theory:* Explicitly link to Rationalist concepts (Sunk Cost, Signal Updating, Switching Costs, Reputational Equilibrium).
      *Refining Misapplications:* Anticipate where a PO might game the system or misunderstand.

  4.  **Developing the Test Cases:**

      *   *Case A (Weak results, predicted):* Naive rule says "Stop (no progress)." Sophisticated rule should say "Continue (validation of theory)." -> *Contradicts Naive Rule.*
      *   *Case B (Infrastructure/Capacity):* Naive rule says "Stop (milestones missed)." Sophisticated rule says "Continue (high switching cost/capacity loss)." -> *Contradicts Naive Rule.* (Wait, I need one to contradict *preference* too).
      *   *Case C (Board Champion):* Naive rule says "Stop (waste of money)." Sophisticated rule says "Stop (Internal Bias)." -> *Contradicts Preference (we want to keep board happy).*
      *   *Wait, let's adjust:* I need one case where the procedure says "Stop" even though we *want* to continue (Case C fits this). I need one case where the procedure says "Continue" even though the naive rule says "Stop" (Case A or B fits this).
      *   *Let's ensure Case B is nuanced.* Maybe the infrastructure is specific but the theory is dead. Then the procedure might say "Stop" despite the infrastructure. That would be a "Contradicts Preference" (we hate wasting capacity).
      *   *Let's stick to the prompt's specific descriptions:*
          *   (a) Weak results, predicted. (Should likely Continue).
          *   (b) Specialized infrastructure. (Should likely Continue, unless theory is dead).
          *   (c) Board champion. (Should likely Stop).
      *   *Requirement:* "At least one case should come out the opposite of what the naive sunk-cost rule would say." (Case A or B).
      *   *Requirement:* "At least one should come out the opposite of what we would prefer to hear." (Case C).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Set the tone (rigorous but humane).
      *   **The Procedure:** 5 Questions + Final Hand-off.
          *   Q1: The Fresh-Eye Test (Dynamic Consistency).
          *   Q2: The Learning Yield (Information Value).
          *   Q3: The Switching Cost (Completion vs. Restart).
          *   Q4: The Signal to the Field (Reputational Equilibrium).
          *   Q5: The Internal Motive Audit (Bias Check).
      *   **Decision Logic:** How to aggregate answers.
      *   **The Test Cases:** Apply the logic rigorously.
      *   **Limitations:** What this doesn't solve.

  6.  **Refining the "Misapplication" and "Theory" columns:**

      *   *Q1 Theory:* Ex-ante rationality / Dynamic Consistency. *Misapplication:* Hindsight bias (judging past decision as stupid because it failed, rather than based on info available then).
      *   *Q2 Theory:* Value of Information. *Misapplication:* Counting "busy work" as learning.
      *   *Q3 Theory:* Transaction/Switching Costs. *Misapplication:* Ignoring the opportunity cost of the *new* money.
      *   *Q4 Theory:* Repeated Game Theory / Signaling. *Misapplication:* Overweighting one relationship vs. the whole portfolio reputation.
      *   *Q5 Theory:* Agency Costs / Motivated Reasoning. *Misapplication:* Projecting internal politics onto external reasons.

  7.  **Review against Constraints:**

      *   *Runnable in <1 hour?* Yes, if the PO has the files.
      *   *Memo output?* The structure supports this.
      *   *Honest about limits?* Yes, include a "Unsettled" section.
      *   *Case outcomes:*
          *   Case A: Continue (Naive says Stop).
          *   Case B: Continue (Naive says Stop). *Wait, I need to make sure one contradicts preference.*
          *   Case C: Stop (Preference says Continue).
          *   *Correction:* I need to make sure the procedure is robust. If Case B has dead theory but good infrastructure, the procedure should say Stop. That contradicts the desire to save the infrastructure. Let's tweak Case B in the execution to ensure it tests the "Infrastructure vs. Theory" tension. Actually, the prompt defines Case B as "built specialized infrastructure... that would be lost." It implies the value is in the capacity. I will interpret this as "Theory still viable, but milestones missed due to setup time." If theory is dead, infrastructure doesn't matter. So Case B = Continue.
          *   Case C = Stop.
          *   So A & B contradict Naive Rule. C contradicts Preference. This works.

  8.  **Final Polish:**

      *   Ensure tone is professional, not academic.
      *   Check that "Sunk Cost" is treated correctly (distinguishing real economic switching costs from psychological attachment).
      *   Make sure the "Hand-off" point is clear (Values vs. Facts).

  9.  **Self-Correction during drafting:** I initially thought about making a scoring system. But scoring systems often hide value judgments. A sequence of "Gates" is better. If you fail Gate 1 (Fresh Eye), you stop unless Gate 2 (Learning) or Gate 4 (Signal) overrides. Actually, a weighted checklist is more "memo-ready." Let's go with a **Gatekeeper Model with Override Conditions**.
      *   *Gate 1:* Viability (Fresh Eye). If No -> Stop, *unless* Override.
      *   *Overrides:* High Learning Value, High Switching Cost, High Reputational Damage.
      *   *Veto:* Internal Bias.
      *   This structure allows the "Sophisticated" exceptions to the "Naive" rule to be explicit.

      *Wait, simpler is better for <1 hour.* Let's do 5 Questions where 3 "No"s usually means Stop, but specific "Yes"s trigger a Values Hand-off.
      *Actually, the prompt asks for a sequence where it says "where the procedure stops with a no."* Okay, a Flowchart logic in text form.
      *   Q1: Ex-Ante Viability. (If No -> Go to Q2).
      *   Q2: Information Value. (If High -> Continue).
      *   Q3: Switching Costs. (If High -> Continue).
      *   Q4: Reputational Signal. (If Negative -> Continue).
      *   Q5: Internal Bias. (If Yes -> Stop).
      *   *Refinement:* Let's make it a "Scorecard" that leads to a recommendation, but with hard stops.
      *   *Better:* A Sequential Filter.
          1.  Is the core thesis still viable? (If No, default Stop).
          2.  Are there exceptional forward-looking reasons to continue despite #1? (Learning, Switching Costs, Reputation).
          3.  Is the motivation to continue contaminated by sunk cost bias? (If Yes, Stop).
      *   *Let's follow the prompt's request for "Sequence of questions... specify sufficient answer... theory... misapplication."* I will structure it as a numbered list of queries.

      *Let's refine the "Stop" logic.*
      *   If Q1 is No AND Q2/Q3/Q4 are Low -> Stop.
      *   If Q5 is Yes -> Stop (Hard Veto).
      *   If Q1 is No BUT Q2/Q3/Q4 are High -> Hand-off to Values (Board).

      *Okay, let's write it.*

      *(Self-Correction on Case B)*: The prompt says "project that has built specialized infrastructure... that would be lost." It doesn't explicitly say the theory is still viable. I need to make an assumption to run the case. I will assume the theory is *uncertain* but the capacity is high. This creates the tension. If the theory is dead, capacity is irrelevant (Sunk Cost). If the theory is alive, capacity is a Switching Cost. I will clarify this distinction in the case run. To make it interesting, I will assume the theory is *weakened* but the capacity is *critical*. This forces the trade-off.

      *(Self-Correction on Case C)*: "Continue only because board member..." This is pure Sunk Cost/Political Cost. The procedure must identify this as an Internal Bias (Q5) and recommend Stop, even if it hurts.

      *(Self-Correction on Case A)*: "Results weak... exactly what predicted." This is high Information Value. Naive rule says Stop (no output). Sophisticated says Continue (validation).

      *Final check on "Opposite of Preference":* Case C is the obvious one. We prefer to keep the board member happy. Procedure says Stop.
      *Final check on "Opposite of Naive Rule":* Case A is the obvious one. Naive says Stop (no results). Procedure says Continue (learning).

      *Let's finalize the Procedure Structure.*
      1.  **The Fresh-Eye Viability Test** (Dynamic Consistency)
      2.  **The Information Yield Test** (Value of Information)
      3.  **The Switching Cost Test** (Economic Efficiency)
      4.  **The Ecosystem Signal Test** (Reputational Equilibrium)
      5.  **The Internal Motive Audit** (Bias Detection)

      *Decision Matrix:*
      *   If Q1 = Yes -> Continue (Subject to Q5).
      *   If Q1 = No -> Check Q2, Q3, Q4.
      *   If Any of Q2, Q3, Q4 = High -> Hand-off to Board (Values).
      *   If All Q2, Q3, Q4 = Low -> Stop.
      *   If Q5 = Contaminated -> Stop (Hard Veto).

      *Wait, one more thing:* "What the procedure cannot settle." I need a section on that. (e.g., How much is reputation worth? How much pain can the field take?)

      *Okay, ready to write.*
answer: |-
  # The Renewal Decision Procedure (RDP)

  **Purpose:** To determine whether to renew multi-year funding for a project that has missed milestones, distinguishing between rational commitment and sunk-cost fallacy.
  **User:** Program Officer (PO).
  **Time Required:** < 60 minutes (assuming file access).
  **Output:** A recommendation memo section for the Board Investment Committee.

  ---

  ## Part I: The Decision Sequence

  Answer the following five questions in order. Do not proceed to the next question if a **Hard Stop** is triggered.

  ### Q1: The Fresh-Eye Viability Test
  **Question:** If we had not funded this project previously, and this proposal landed on our desk today with its *current* track record and *current* theory of change, would we fund it as a new grant?
  *   **Sufficient Answer for "Yes":** We would write a new check today based on the forward-looking expected value, ignoring our prior relationship.
  *   **Underlying Theory:** **Dynamic Consistency / Ex-Ante Rationality.** This tests whether the decision is driven by current expected utility rather than past commitment. It prevents "throwing good money after bad" simply to justify the initial decision.
  *   **Common Misapplication:** **Hindsight Bias.** Judging the *past* decision as stupid because it failed, rather than judging the *future* potential based on current information. Do not penalize the project for bad luck that was ex-ante unforecastable.
  *   **Decision Logic:**
      *   **YES:** Proceed to Q5 (Internal Motive Audit).
      *   **NO:** Proceed to Q2 (Search for Override Conditions).

  ### Q2: The Information Yield Test
  **Question:** Has the money spent so far purchased critical information that reduces uncertainty for *future* grants (ours or the field's), even if this specific project fails?
  *   **Sufficient Answer for "Yes":** The "failure" validates or invalidates a core assumption in our strategy, preventing larger future losses or unlocking a new path. The value of this data exceeds the cost of the next funding tranche.
  *   **Underlying Theory:** **Value of Information (VoI).** Past spending is not a cost to be recovered, but an investment in data. If the data is valuable, continued funding is an investment in *analysis/completion*, not the original goal.
  *   **Common Misapplication:** **Busywork as Learning.** Counting "we learned the team is slow" as valuable information. The learning must be about the *problem space* or *intervention type*, not just the grantee's competence (unless competence was the variable being tested).
  *   **Decision Logic:**
      *   **HIGH YIELD:** Flag as **Override Condition A**. Proceed to Q5.
      *   **LOW YIELD:** Proceed to Q3.

  ### Q3: The Switching Cost Test
  **Question:** Is there a specific, non-recoverable asset (infrastructure, community trust, specialized staff) built by past funding that makes the *marginal cost* of finishing this project significantly lower than starting a new, equivalent bet?
  *   **Sufficient Answer for "Yes":** Abandoning the project destroys capital that would cost >2x to rebuild elsewhere. The "sunk cost" is actually a "pre-paid switching cost."
  *   **Underlying Theory:** **Transaction & Switching Costs.** Economic efficiency dictates that if completion is cheaper than restart, completion is rational, provided the end-goal is still valuable.
  *   **Common Misapplication:** **Emotional Attachment to Assets.** Valuing a lab or staff because "we paid for them" rather than because they are uniquely positioned to solve the problem cheaper than anyone else. If the asset has no alternative use, its value is zero.
  *   **Decision Logic:**
      *   **HIGH SWITCHING COST:** Flag as **Override Condition B**. Proceed to Q5.
      *   **LOW SWITCHING COST:** Proceed to Q4.

  ### Q4: The Ecosystem Signal Test
  **Question:** Will terminating this grant materially damage our reputation with the *specific class of partners* we need for high-risk work in the future?
  *   **Sufficient Answer for "Yes":** Termination will signal that we do not tolerate the inherent risk of the work we claim to fund, causing high-quality risk-takers to self-select out of applying to us.
  *   **Underlying Theory:** **Reputational Equilibrium / Signaling.** In repeated games, your payout depends on other players' trust. If "cutting losses" is interpreted as "risk aversion," your future deal flow degrades.
  *   **Common Misapplication:** **Overweighting One Relationship.** Confusing "this grantee will be mad" with "the field will lose trust." One angry grantee is a cost; a chilled market is an existential threat.
  *   **Decision Logic:**
      *   **HIGH SIGNAL RISK:** Flag as **Override Condition C**. Proceed to Q5.
      *   **LOW SIGNAL RISK:** Proceed to Decision Matrix.

  ### Q5: The Internal Motive Audit (Hard Veto)
  **Question:** Is the primary argument for continuing the grant driven by a desire to avoid internal embarrassment, protect a specific donor/board relationship, or justify a past hiring decision?
  *   **Sufficient Answer for "No":** The argument rests entirely on external impact (Q1–Q4).
  *   **Underlying Theory:** **Agency Costs / Motivated Reasoning.** Organizational self-preservation is a genuine cost, but it is not a *mission* cost. Funding to save face is a diversion of charitable assets.
  *   **Common Misapplication:** **Strategic Masking.** Dressing up political needs (e.g., "we need to keep Board Member X happy") as strategic needs (e.g., "we need to maintain stakeholder trust"). Be brutally honest here.
  *   **Decision Logic:**
      *   **YES (Motives Contaminated):** **HARD STOP. RECOMMEND TERMINATION.**
      *   **NO (Motives Clean):** Proceed to Decision Matrix.

  ---

  ## Part II: The Decision Matrix

  Combine the results from Q1–Q5 to generate the recommendation.

  | Q1 (Viability) | Override Conditions (Q2, Q3, Q4) | Q5 (Internal Motive) | **Recommendation** | **Rationale** |
  | :--- | :--- | :--- | :--- | :--- |
  | **YES** | Any | **CLEAN** | **RENEW** | Project stands on its own merits. |
  | **YES** | Any | **CONTAMINATED** | **STOP** | **Hard Veto.** Do not fund to save face, even if project is viable. Find a way to renew that isolates the bias. |
  | **NO** | **NONE** | **CLEAN** | **STOP** | **Naive Rule Applies.** No forward value, no switching costs, no signal risk. Cut losses. |
  | **NO** | **1+ HIGH** | **CLEAN** | **HAND-OFF TO BOARD** | **Values Judgment.** Facts support stopping, but strategic/ethical overrides exist. Board must weigh mission vs. efficiency. |
  | **NO** | **1+ HIGH** | **CONTAMINATED** | **STOP** | **Hard Veto.** Strategic overrides are negated by internal bias. High risk of organizational capture. |

  ---

  ## Part III: What This Procedure Cannot Settle

  This procedure identifies *facts* (viability, switching costs) and *biases* (internal motives). It cannot settle the following **Value Judgments**, which must be explicit in the Board Memo:

  1.  **The Price of Reputation:** How much mission efficiency are we willing to sacrifice to maintain a "risk-tolerant" brand? (e.g., Is funding a dead project worth $500k to keep the field warm?)
  2.  **The Pain Threshold:** How much hardship can we inflict on a partner community before the reputational damage outweighs the waste of funds?
  3.  **The Definition of "Learning":** At what point does "gathering data" become "funding a research project" rather than "funding an intervention"?

  ---

  ## Part IV: Test Cases

  Here is the procedure applied to the three scenarios provided.

  ### Case A: The Validated Failure
  **Scenario:** A project aimed to test a novel policy intervention. Midpoint results are weak in absolute terms (no impact on beneficiaries), but exactly match the project's theory (the theory predicted no impact under these conditions).
  *   **Q1 (Viability):** **NO.** A new proposal showing "no impact" would not be funded as an intervention.
  *   **Q2 (Info Yield):** **HIGH.** The "failure" validates the theory. This prevents the foundation from scaling a无效 approach elsewhere. This is high-value negative data.
  *   **Q3 (Switching Cost):** Low.
  *   **Q4 (Signal Risk):** Moderate. Stopping a "learning" grant is expected.
  *   **Q5 (Motive):** Clean.
  *   **Matrix Result:** Q1=No + Override A (Info) + Q5=Clean → **HAND-OFF TO BOARD.**
  *   **Recommendation:** **Renew for "Closing & Analysis" only.**
  *   **Contradiction:** **Opposite of Naive Rule.** The naive rule says "Stop, no impact." The sophisticated rule says "Continue, because the *point* was learning, and we learned."
  *   **Memo Note:** "We are not funding success; we are funding the verification of failure. This requires Board approval to classify as a strategic win."

  ### Case B: The Specialized Capacity
  **Scenario:** A project building a specialized regional hub. Milestones missed due to regulatory delays. The hub is 80% built. Staff are hired and trained. If we stop, the staff disperse and the lease is lost. Restarting elsewhere would cost 3x.
  *   **Q1 (Viability):** **NO.** Given the delays and regulatory risk, a fresh proposal might be too risky.
  *   **Q2 (Info Yield):** Low. We knew regulations were hard.
  *   **Q3 (Switching Cost):** **HIGH.** Destroying the hub wastes the specific capital built. Marginal cost to finish is low compared to restart.
  *   **Q4 (Signal Risk):** High. This partner is a key infrastructure player.
  *   **Q5 (Motive):** Clean.
  *   **Matrix Result:** Q1=No + Override B & C + Q5=Clean → **HAND-OFF TO BOARD.**
  *   **Recommendation:** **Renew.**
  *   **Contradiction:** **Opposite of Naive Rule.** Naive rule sees missed milestones and says "Stop." Sophisticated rule sees *economic efficiency* (switching costs) and says "Finish what we started."
  *   **Unsettled Value:** The Board must decide if the *goal* of the hub is still worth the cost, now that we know the regulatory environment. The procedure settles the *efficiency* of finishing, not the *value* of the goal.

  ### Case C: The Board Champion
  **Scenario:** A project is underperforming. Theory is shaky. However, a powerful Board Member championed it and views termination as a personal critique of their judgment.
  *   **Q1 (Viability):** **NO.** Would not fund today.
  *   **Q2 (Info Yield):** Low.
  *   **Q3 (Switching Cost):** Low.
  *   **Q4 (Signal Risk):** Low (External field doesn't know about internal politics).
  *   **Q5 (Motive):** **CONTAMINATED.** The primary reason to continue is to avoid admitting failure to the Board Member.
  *   **Matrix Result:** Q5=Contaminated → **HARD STOP. RECOMMEND TERMINATION.**
  *   **Recommendation:** **Terminate.**
  *   **Contradiction:** **Opposite of Preference.** The organization *prefers* to keep the Board Member happy (organizational self-preservation). The procedure flags this as an agency cost and vetoes it.
  *   **Memo Note:** "Continuation is driven by internal relationship management, not mission impact. Per RDP Q5, this is a termination event. Recommendation: Engage Board Chair to manage donor relationship separately from grant decision."

  ---

  ## Part V: Implementation Notes for the Program Officer

  1.  **Evidence Standard:** For Q2 and Q3, you need written evidence. Do not accept "we think" for Switching Costs. Require a budget comparison (Finish vs. Restart).
  2.  **The "Hand-Off" Memo:** When the matrix says "Hand-Off to Board," your memo must explicitly state: *"The facts suggest termination, but strategic overrides exist. We are requesting a values judgment on whether [Reputation/Capacity] is worth $X."* Do not hide the trade-off.
  3.  **Dynamic Inconsistency Check:** If you find yourself answering "Yes" to Q1 only because "we've come so far," you have failed Q1. Reset and answer as if you are a stranger to the project.
  4.  **Psychological Safety:** This procedure will recommend terminating projects you like. This is a feature, not a bug. It protects you from the accusation of bias by anchoring the decision in the RDP framework.

  ---

  ### Limitations & Unsettled Questions
  *   **The "Zombie" Problem:** The procedure may recommend continuing a project with high switching costs (Case B) even if the ultimate probability of success is low (e.g., 10%). It prioritizes *efficiency of loss* over *probability of gain*. The Board must set a minimum probability threshold for "Hand-Off" cases.
  *   **Field Morale Quantification:** Q4 relies on the PO's assessment of "Signal Risk." This is subjective. If possible, triangulate with external advisors to validate if termination would actually chill the field.
  *   **Staff Livelihoods:** This procedure treats staff capacity as an asset (Q3). It does not explicitly weigh the moral cost of layoffs. If the foundation has a "do no harm" value regarding partners' staff, this must be added as a explicit Value Judgment in the Board Memo.
