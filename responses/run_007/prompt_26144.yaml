answer: |-
  This is a request for the structural blueprint of metaethics. You are asking for the "data" that any theory must fit, distinguished from the "theories" themselves, along with an analysis of whether the data is consistent.

  Below is a specification of the job description for any account of the is-ought relationship. I have divided the desiderata into **Non-Negotiable Constraints** (phenomena any account must explain to be plausible) and **Parochial Commitments** (theoretical preferences often disguised as data). I conclude with the **Incompatibility Thesis**, demonstrating that the non-negotiable constraints form a trilemma that no extant theory satisfies perfectly.

  ---

  ### I. Non-Negotiable Constraints (The Hard Data)
  These are features of moral discourse and practice that are pre-theoretically robust. An account that denies these must provide an error theory explaining why we are systematically misled.

  #### 1. Semantic Embeddability (The Frege-Geach Constraint)
  *   **The Requirement:** Moral sentences must function logically like descriptive sentences. They must be truth-apt enough to appear in conditionals, negations, and disjunctions without changing meaning.
  *   **The Argument:** Consider the argument:
      1. If stealing is wrong, then getting your little brother to steal is wrong.
      2. Stealing is wrong.
      3. Therefore, getting your little brother to steal is wrong.
      This is a valid argument (Modus Ponens). For it to be valid, the phrase "stealing is wrong" must have the same semantic content in premise 1 (unasserted) and premise 2 (asserted). If moral sentences merely express emotions (like "Boo stealing!"), premise 1 becomes "If Boo stealing!, then Boo getting brother to steal!," which is not a proposition that can be true or false, rendering the logic invalid.
  *   **Status:** **Non-Negotiable.** Any account that makes moral logic unintelligible fails.

  #### 2. The Supervenience of the Normative on the Descriptive
  *   **The Requirement:** There can be no moral difference without a underlying natural/descriptive difference.
  *   **The Argument:** If Act A and Act B are identical in every natural respect (consequences, intentions, context, psychological states), it is impossible for A to be "good" and B to be "bad." To claim otherwise would make moral properties "ungrounded" or magical. If you ask *why* an act is wrong, the answer must cite some natural feature (e.g., "it caused pain").
  *   **Status:** **Non-Negotiable.** Denying this renders moral judgment arbitrary and inexplicable.

  #### 3. The Phenomenology of Objective Disagreement
  *   **The Requirement:** An account must explain why moral disagreement feels like factual disagreement, not merely a clash of preferences.
  *   **The Argument:** When two people disagree about whether ice cream is tasty, they can agree ("I like vanilla, you like chocolate") and walk away. When two people disagree about whether genocide is wrong, they do not treat it as a mere difference in taste; they argue as if one is *mistaken* about the world. The discourse aims at convergence in a way that taste discourse does not.
  *   **Status:** **Non-Negotiable.** An account that reduces morality to mere preference (simple subjectivism) fails to capture the *normative force* of the disagreement.

  #### 4. Fallibility and Corrigibility
  *   **The Requirement:** It must be possible for a moral agent to be wrong about their moral judgments, even if they are sincere and consistent.
  *   **The Argument:** We routinely say, "I used to think X was right, but I was mistaken." If moral judgments were simply reports of one's own attitudes (e.g., "I disapprove of X"), one could never be wrong about them, just as one cannot be wrong about having a headache. The possibility of moral error is central to moral deliberation.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Parochial Commitments (Theoretical Bets)
  These are often presented as desiderata but are actually commitments of specific metaphysical or epistemological traditions. Demanding them as pre-theoretical constraints begs the question against rival views.

  #### 1. Motivational Internalism (The Humean/Expressivist Bet)
  *   **The Claim:** Sincerely judging that "I ought to $\phi$" necessarily provides *some* motivation to $\phi$.
  *   **Why it is Parochial:** This is often treated as data, but it is a theoretical commitment. While many feel a connection between judgment and motivation, we can conceive of the "amoralist"—someone who says "I know I ought to help, but I simply don't care."
      *   *If you make this a non-negotiable constraint:* You rule out Moral Realism (unless it posits queer properties) and force an Expressivist or Humean psychology.
      *   *If you reject it:* You must explain why morality is practical (Externalism).
  *   **Verdict:** **Parochial.** It is a constraint only for those who prioritize the practical nature of ethics over the cognitive nature of judgment.

  #### 2. Metaphysical Naturalism (The Scientific Bet)
  *   **The Claim:** Moral properties must be identical to or constituted by natural properties discoverable by empirical science.
  *   **Why it is Parochial:** This assumes that the ontology of science is the *only* ontology. It rules out Non-Natural Realism (Moore, Parfit) by fiat. While we should avoid "spooky" entities, defining "natural" so broadly that it includes normative properties (as some Cornell Realists do) risks making the term vacuous.
      *   *Argument against as constraint:* If moral truths are *sui generis* (like mathematical truths), demanding they be "natural" is like demanding numbers be made of atoms.
  *   **Verdict:** **Parochial.** It is a metaphysical preference, not a linguistic or phenomenological datum.

  #### 3. The Autonomy of Ethics (The Kantian/Non-Naturalist Bet)
  *   **The Claim:** Normative truths cannot be derived from or reduced to non-normative truths (The Is-Ought Gap as a metaphysical barrier).
  *   **Why it is Parochial:** This treats Hume's Law as a metaphysical boundary rather than a logical or semantic one. Naturalists argue that if "good" *just means* "conducive to flourishing," then deriving ought from is is no more mysterious than deriving "water is H2O" from "this is water."
      *   *Argument against as constraint:* Demanding autonomy presupposes that the normative is a distinct *kind* of property, which is exactly what Naturalists deny.
  *   **Verdict:** **Parochial.** It is the conclusion of Non-Naturalism, not a premise for all metaethics.

  ---

  ### III. The Incompatibility Thesis (The Trilemma)
  You asked if a subset of these desiderata cannot be jointly satisfied. **Yes.** This is the central result of contemporary metaethics, often formalized as **Michael Smith's "Moral Problem."**

  The following three claims are individually plausible but jointly inconsistent:

  1.  **Cognitivism:** Moral judgments express beliefs (required for *Semantic Embeddability* and *Objective Disagreement*).
  2.  **Motivational Internalism:** Moral judgments are necessarily motivational (required for the *Practicality of Morals*).
  3.  **Humean Theory of Motivation:** Beliefs alone cannot motivate; desire + belief is required (a standard result in philosophy of mind/psychology).

  **The Tension:**
  *   If (1) and (3) are true, moral judgments (beliefs) cannot motivate on their own. This contradicts (2).
  *   If (2) and (3) are true, moral judgments cannot be beliefs. This contradicts (1).
  *   If (1) and (2) are true, the Humean Theory of Motivation is false. This contradicts a dominant view in neighboring fields (philosophy of action).

  **Why this matters for the Is-Ought Gap:**
  This trilemma explains why the "gap" persists.
  *   **Non-Naturalists** keep (1) and (2) but reject (3), positing that moral beliefs have a unique motivational power (risking "queerness").
  *   **Expressivists** keep (2) and (3) but reject (1), arguing moral judgments are desires/plans (risking the *Frege-Geach* problem).
  *   **Naturalists** keep (1) and (3) but reject (2), arguing motivation is contingent on the agent's desires (risking the loss of *Normative Force*).

  **A Second Tension: Supervenience vs. Autonomy**
  *   If moral properties **supervene** on natural properties (Desideratum I.2), there must be a metaphysical explanation for *why* this supervenience holds.
  *   If ethics is **autonomous** (Parochial Commitment II.3), there can be no reductive explanation.
  *   **Result:** Non-Naturalists face the "Ban on Brute Modal Connections." If moral properties are distinct from natural properties, why is it *impossible* for the natural properties to exist without the moral ones? To assert this connection without identity looks like a brute, inexplicable necessity.

  ---

  ### IV. Critique of Commonly Demanded Features
  You asked to flag question-begging moves. Two major ones stand out:

  **1. "Compatibility with a Scientific Worldview"**
  *   **Critique:** This is often used to bludgeon Non-Naturalism. However, mathematics and logic are also not "discoverable by empirical science" in the way physics is, yet we accept them. If one demands ethics fit into physics but exempts logic, one is engaging in *scientism*, not neutral theorizing.
  *   **Judgment:** Not a genuine desideratum. The constraint should be "Metaphysical Coherence," not "Scientific Reducibility."

  **2. "Vindicating the Is-Ought Gap"**
  *   **Critique:** Many ask for a theory that "respects" the gap. But the gap might be an illusion caused by confusing semantic distinctness with metaphysical distinctness. "Water is H2O" is an identity statement, but "This is water" does not logically entail "This is H2O" without the bridge principle. Demanding the gap be preserved assumes the bridge principle is impossible.
  *   **Judgment:** Not a genuine desideratum. The goal should be to explain the *intuition* of the gap, not necessarily to preserve it as a metaphysical reality.

  ---

  ### V. Scorecard: How the Families Fare
  No theory gets a perfect score. Each solves one part of the Trilemma by sacrificing another desideratum.

  | Theory | Semantic Embedding (Logic) | Motivational Internalism (Force) | Metaphysical Parsimony (Naturalism) | Supervenience | Primary Failure Mode |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Non-Natural Realism** (Moore, Parfit) | **Pass** (Cognitivist) | **Pass** (Intuitionist Internalism) | **Fail** (Ontologically "Queer") | **Struggle** (Brute Connections) | Metaphysical extravagance; epistemic access mystery. |
  | **Naturalistic Realism** (Cornell, Foot) | **Pass** (Cognitivist) | **Fail** (Externalist) | **Pass** (Fits Science) | **Pass** (Identity) | Loses the "grip" of morality; amoralist is rational. |
  | **Expressivism** (Ayer, Blackburn, Gibbard) | **Struggle** (Quasi-Realism) | **Pass** (Non-Cognitive) | **Pass** (No moral properties) | **Pass** (Consistency of attitudes) | Logic is simulated, not real; complex embedding issues. |
  | **Error Theory** (Mackie, Joyce) | **Pass** (Cognitivist) | **Fail** (No motivation, no truth) | **Pass** (No moral properties) | **N/A** (No moral facts) | Eliminates morality; contradicts phenomenology of truth. |
  | **Hybrid Views** (Barker, Ridge) | **Pass** | **Pass** | **Mixed** | **Pass** | Complexity; risks collapsing into one of the above. |

  ### VI. Conclusion: The Job Description as a Result
  The "job description" you requested reveals that the Is-Ought gap is not a single problem but a symptom of the **Moral Trilemma**.

  1.  **If you prioritize Logic and Metaphysics** (Naturalism/Realism), you must explain why morality moves us (sacrificing Internalism).
  2.  **If you prioritize Motivation and Metaphysics** (Expressivism), you must explain why morality obeys logic (sacrificing Cognitivism).
  3.  **If you prioritize Logic and Motivation** (Non-Naturalism), you must explain how these properties fit into reality (sacrificing Parsimony).

  Therefore, an "adequate account" cannot deliver *all* the desiderata. It must offer a **cost-benefit analysis** of which constraint to relax. The most successful theories are not those that claim to bridge the gap perfectly, but those that most honestly admit which phenomenological cost they are willing to pay. The "gap" persists because the features that make moral language *logical* (cognitive) are in tension with the features that make it *moral* (action-guiding).
