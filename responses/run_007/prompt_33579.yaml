prompt: |-
  Before reading further in the secondary literature on Kant's Formula of Universal Law, I want to fix the standard by which an interpretation of the universalizability test should be judged. Please write the desiderata: what any adequate interpretation of the Formula of Universal Law (or the Formula of the Law of Nature) must deliver.

  The list should include, for each requirement, the case or consideration that motivates it. Mark which requirements are non-negotiable for any interpretation that claims to be Kant's own view (as opposed to a revisionary Kantian proposal), and which are preferences of particular interpretive camps. If any pair of desiderata cannot be jointly satisfied — given the structure of the test, the texts, or the cases — flag that and explain the tension.

  Among the things I expect the list to address: Kant's own four examples from the Groundwork (perfect and imperfect duties to self and to others), the distinction between contradiction in conception and contradiction in will, the maxim-formulation problem (how the level of generality at which an agent's maxim is described is to be fixed), the problem of false positives and false negatives, and the question of why a contradiction uncovered by the test should carry normative force for a rational agent.

  Optionally, briefly indicate how the main interpretive approaches — the logical-contradiction reading, the practical-contradiction reading, and the teleological reading — fare against the list. But the weight of the response should be on the criteria themselves and their justification, not on the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for interpreting Kant's Formula of Universal Law (FUL):

  1.  **Analyze the Request:**
      *   **Task:** Create a list of desiderata (criteria/standards) for judging interpretations of Kant's Formula of Universal Law (FUL) / Formula of the Law of Nature (FLN).
      *   **Components:**
          *   Each requirement must have a motivating case/consideration.
          *   Mark requirements as "Non-negotiable" (textually faithful to Kant) vs. "Interpretive Preferences" (specific camps).
          *   Flag tensions/incompatibilities between desiderata if they exist.
          *   Address specific topics: Kant's four examples (Groundwork), CI vs. CW (Contradiction in Conception/Will), Maxim Formulation Problem, False Positives/Negatives, Normative Force.
          *   Optionally: Briefly assess main approaches (Logical, Practical, Teleological).
      *   **Focus:** Weight should be on the criteria and justification, not the scorecard.
      *   **Tone:** Scholarly, precise, philosophical.

  2.  **Deconstruct the Subject Matter (Kant's FUL/FLN):**
      *   *The Formula:* "Act only according to that maxim whereby you can at the same time will that it should become a universal law." (FUL) / "...as if it were to hold through your will as a universal law of nature." (FLN)
      *   *The Test:* Universalize the maxim. Check for contradiction.
      *   *The Output:* Perfect Duty (Contradiction in Conception - CI) vs. Imperfect Duty (Contradiction in Will - CW).
      *   *The Problems:* How specific is the maxim? Why does contradiction imply immorality? Do the examples actually work?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Textual Fidelity (The Four Examples).*
          *   *Motivation:* Kant gives four specific cases in *Groundwork* II. An interpretation claiming to be *Kant's* must make sense of these.
          *   *Status:* Non-negotiable.
          *   *Tension:* Some examples (especially the deposit example) are notoriously tricky to make work without tweaking the maxim.

      *   *Desideratum 2: The CI/CW Distinction.*
          *   *Motivation:* Kant explicitly distinguishes perfect vs. imperfect duties based on two types of contradiction.
          *   *Status:* Non-negotiable.
          *   *Tension:* It's hard to define "contradiction in will" without slipping into consequentialism or empirical desire.

      *   *Desideratum 3: Maxim Specificity (The Formulation Problem).*
          *   *Motivation:* "I will lie" fails; "I will lie to save my life" might pass. The test needs a rule for describing maxims.
          *   *Status:* Non-negotiable (Kant talks about maxims), but the *solution* is interpretive.
          *   *Tension:* Too specific = trivializes test (false negatives). Too general = overgenerates duties (false positives).

      *   *Desideratum 4: Normative Force (Why care about contradiction?).*
          *   *Motivation:* Why does a logical or practical contradiction bind a rational will?
          *   *Status:* Non-negotiable (must explain the "ought").
          *   *Tension:* Logical readings struggle here (is morality logic?). Practical readings risk instrumental rationality.

      *   *Desideratum 5: Avoiding False Positives/Negatives.*
          *   *Motivation:* The test shouldn't condemn innocuous acts (positives) or permit heinous acts (negatives).
          *   *Status:* Interpretive Preference (Philosophical Plausibility). Kant might accept counter-intuitive results, but modern interpreters usually want the test to be robust.
          *   *Tension:* Often conflicts with Textual Fidelity (e.g., the lying promise example works, but does a lying promise to a murderer at the door work?).

      *   *Desideratum 6: Agency and Autonomy.*
          *   *Motivation:* The Categorical Imperative is about self-legislation, not external nature.
          *   *Status:* Non-negotiable.
          *   *Tension:* Teleological readings (Law of Nature) risk making it about natural purposes rather than rational willing.

  4.  **Refining and Categorizing:**
      *   I need to make sure the distinction between "Non-negotiable" (Exegetical) and "Preference" (Systematic/Revisionary) is clear.
      *   I need to highlight the tensions explicitly.

      *   *Refinement on Maxim Formulation:* This is the biggest flashpoint. I should make this a central desideratum.
      *   *Refinement on Normative Force:* Distinguish between "Logical Incoherence" and "Volitional Incoherence."

  5.  **Addressing the Interpretive Approaches (Optional but requested):**
      *   *Logical Contradiction:* Good for CI, bad for CW, bad on Normative Force.
      *   *Practical Contradiction:* Good for Normative Force, risks instrumentalism.
      *   *Teleological:* Good for FLN text, risks metaphysical baggage.

  6.  **Structuring the Response:**
      *   **Introduction:** Set the stage (Groundwork II, the centrality of FUL).
      *   **The Desiderata List:** Numbered, with Motivation, Status, and Tension notes.
      *   **Section on Tensions:** Explicitly discuss where criteria clash (e.g., Rigor vs. Plausibility).
      *   **Brief Assessment:** How the three main schools stack up.
      *   **Conclusion:** Summary of the challenge.

  7.  **Drafting Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate FUL and FLN too much, though they are usually treated together in this context. I will treat them as the "Universalizability Test."
      *   *Correction:* Ensure the "False Positive/Negative" criterion is framed carefully. Kant himself might not care about our modern intuitions, but an *adequate interpretation* for a contemporary audience usually demands it. I will label this as a "Systematic Desideratum" rather than strictly "Exegetical."
      *   *Check:* Did I cover the four examples? Yes, under Textual Adequacy.
      *   *Check:* Did I cover CI/CW? Yes, under Structural Discrimination.
      *   *Check:* Did I cover Normative Force? Yes, under Bindingness.

  8.  **Final Polish:** Check tone (academic, authoritative but open). Ensure clear formatting (bolding, lists). (Self-correction: Ensure the distinction between "Non-negotiable" and "Preference" is visually distinct).

  9.  **Final Review against constraints:**
      *   List desiderata? Yes.
      *   Motivating case for each? Yes.
      *   Mark Non-negotiable vs. Preference? Yes.
      *   Flag tensions? Yes.
      *   Address specific topics (examples, CI/CW, maxims, false pos/neg, normative force)? Yes.
      *   Briefly indicate interpretive approaches? Yes.
      *   Weight on criteria? Yes.

  (Proceed to generate output based on this plan.)
answer: |-
  Below is a structured set of desiderata for evaluating interpretations of Kant's Formula of Universal Law (FUL) and Formula of the Law of Nature (FLN). These criteria distinguish between **Exegetical Non-Negotiables** (requirements for an interpretation to count as *Kant's* view) and **Systematic Preferences** (requirements for the theory to be philosophically robust by contemporary standards).

  ---

  ### I. Exegetical Non-Negotiables
  *These requirements must be met for an interpretation to claim fidelity to Kant's text in the Groundwork and the Critique of Practical Reason.*

  #### 1. Structural Discrimination (The CI/CW Distinction)
  *   **Requirement:** The interpretation must explicate a clear structural difference between a **Contradiction in Conception (CI)** and a **Contradiction in Will (CW)**. It must explain why CI generates perfect duties (strict prohibition) while CW generates imperfect duties (meritorious latitude).
  *   **Motivation:** Kant explicitly divides the four *Groundwork* examples along this line. An interpretation that collapses the two contradictions into one type of failure cannot explain the distinction between justice and virtue in Kant's system.
  *   **Tension Flag:** **High.** It is notoriously difficult to define CW without smuggling in empirical desires (which Kant forbids) or collapsing it back into CI. Many interpreters argue CW is actually just a disguised CI regarding necessary ends of rational agency.

  #### 2. Textual Adequacy (The Four Examples)
  *   **Requirement:** The interpretation must successfully reconstruct the invalidity of Kant's own four illustrative maxims:
      1.  False promising (Perfect duty to others).
      2.  Suicide from self-love (Perfect duty to self).
      3.  Neglect of talent (Imperfect duty to self).
      4.  Refusal of aid (Imperfect duty to others).
  *   **Motivation:** These are Kant's own control cases. If an interpretation renders Kant's own examples as passing the test (false negatives) or failing for the wrong reasons, it fails as an exegesis of Kant's specific procedure.
  *   **Tension Flag:** **Medium.** The suicide example is particularly recalcitrant for logical readings (is it logically impossible for everyone to commit suicide?). Saving the example often requires tweaking the maxim description, which risks violating Desideratum #3.

  #### 3. The Source of Normativity (Autonomy, not Heteronomy)
  *   **Requirement:** The interpretation must explain why the contradiction binds the agent without appealing to empirical consequences, divine command, or natural teleology independent of the will. The "law" must be self-legislated by pure practical reason.
  *   **Motivation:** Kant's core project is to ground morality in autonomy. If the test works only because universalizing a maxim leads to bad *consequences* (e.g., trust breaks down), the view becomes consequentialist or hypothetical, violating the categorical nature of the imperative.
  *   **Tension Flag:** **High.** This creates friction with Systematic Preference #2 (False Negatives). Avoiding consequentialism often makes the test seem overly formal and unable to condemn acts that have disastrous outcomes but are logically universalizable.

  #### 4. Maxim Subjectivity (The Agent's Principle)
  *   **Requirement:** The input of the test must be a "maxim" understood as the agent's subjective principle of volition, not an external rule imposed by the interpreter.
  *   **Motivation:** Kant defines a maxim as a subjective principle. If the interpreter dictates the maxim rather than reconstructing the agent's reasoning, the test ceases to be a test of the agent's rationality and becomes a test of the interpreter's moral intuitions.
  *   **Tension Flag:** **Critical.** This is the locus of the **Maxim Formulation Problem** (see Systematic Preference #1). Respecting agent subjectivity often leads to false negatives (agents can describe maxims so specifically they pass the test).

  ---

  ### II. Systematic Preferences
  *These requirements are not strictly textual but are necessary for the FUL to function as a viable moral theory in contemporary discourse. Interpretations may sacrifice these to preserve Exegetical Non-Negotiables (revisionary Kantianism).*

  #### 5. Maxim Determinacy (Solving the Formulation Problem)
  *   **Requirement:** The interpretation must provide a non-arbitrary rule for determining the correct level of generality at which a maxim is described.
  *   **Motivation:** Without this, the test is manipulable.
      *   *Too General:* "I will kill" (Clearly fails, but perhaps too broad).
      *   *Too Specific:* "I will kill this person, at this time, with this gun, to save my inheritance" (May pass universalization because the universe isn't crowded enough for a contradiction to arise).
  *   **Tension Flag:** **Critical.** There is a direct tension between **Maxim Subjectivity (#4)** and **Maxim Determinacy**. If we let the agent define the maxim (Subjectivity), they can game the test. If we impose a standard description (Determinacy), we risk violating the autonomy constraint and imposing the interpreter's morality.

  #### 6. Extensional Accuracy (Avoiding False Positives/Negatives)
  *   **Requirement:** The test should not condemn morally permissible acts (False Positives) nor permit morally heinous acts (False Negatives).
  *   **Motivation:** Philosophical plausibility. For example, a "False Positive" might be a universalizable maxim of "always wear blue socks on Tuesdays" being deemed a duty. A "False Negative" might be a specific discriminatory practice that passes because it relies on contingent facts about the world.
  *   **Tension Flag:** **High.** Kant's own examples (e.g., the duty not to lie even to a murderer at the door) suggest Kant might accept counter-intuitive results. An interpretation that prioritizes Extensional Accuracy may have to be revisionary regarding Textual Adequacy (#2).

  #### 7. Volitional Coherence (The "Why Care?" Question)
  *   **Requirement:** The interpretation must explain why a rational agent *cannot* will the universalized maxim without contradicting themselves, in a way that feels normative rather than merely psychological.
  *   **Motivation:** Mere logical inconsistency (e.g., "I promise and I do not promise") applies to statements, not actions. The interpretation must bridge the gap between logical contradiction and practical irrationality.
  *   **Tension Flag:** **Medium.** Logical readings satisfy Exegetical Non-Negotiable #1 easily but fail this requirement (why does logic bind the will?). Practical readings satisfy this but risk violating Exegetical Non-Negotiable #3 (Autonomy) by relying on what agents *happen* to will.

  ---

  ### III. Key Tensions and Incompatibilities

  **1. The Rigor vs. Plausibility Tension**
  *   **Conflict:** Between **Textual Adequacy (#2)** and **Extensional Accuracy (#6)**.
  *   **Explanation:** Kant's own application of the test yields results many modern readers find implausible (e.g., the strict prohibition on lying). An interpretation that "fixes" the test to allow lying to murderers (to satisfy Plausibility) arguably fails to interpret Kant's own view (violating Textual Adequacy). One must choose: Is the goal to explain what Kant *thought*, or to build a working Kantian *tool*?

  **2. The Formalism vs. Content Tension**
  *   **Conflict:** Between **Source of Normativity (#3)** and **Maxim Determinacy (#5)**.
  *   **Explanation:** To avoid heteronomy (#3), the test must remain purely formal. However, purely formal tests struggle to generate specific content without a rule for maxim description (#5). Providing a rule for maxim description often requires importing substantive values (e.g., "describe the maxim in terms of human needs"), which threatens the purity of the formal test.

  **3. The Conception vs. Will Tension**
  *   **Conflict:** Between **Structural Discrimination (#1)** and **Volitional Coherence (#7)**.
  *   **Explanation:** It is easy to show a logical contradiction in conception (a world without promises is incoherent). It is very hard to show a *contradiction in will* (a world without charity) without appealing to empirical facts about human vulnerability. If the contradiction in will relies on empirical facts, it threatens the a priori status of the moral law.

  ---

  ### IV. Brief Assessment of Interpretive Approaches

  | Approach | Primary Strength | Primary Weakness | Verdict on Desiderata |
  | :--- | :--- | :--- | :--- |
  | **Logical Contradiction** (e.g., early 20th c. readings) | **Structural Discrimination (#1).** Clearly distinguishes CI (logical impossibility) from CW. | **Normative Force (#7) & False Negatives (#6).** Fails to explain why logical inconsistency is *immoral*. Fails the "deposit" example (a world where everyone breaks deposits is logically possible, just chaotic). | Fails Exegetical Non-Negotiable #2 (Examples). |
  | **Practical Contradiction** (e.g., Korsgaard) | **Normative Force (#7).** Explains bindingness via the agent's own purposes. If universalized, the action becomes ineffective for the agent's end. | **Source of Normativity (#3).** Risks instrumental rationality (Hypothetical Imperative). If I don't care about the end, the contradiction vanishes. | Strong on Systematic Preferences, weak on Exegetical Non-Negotiable #3. |
  | **Teleological / Law of Nature** (e.g., Wood, Denis) | **Textual Adequacy (#2).** Respects the FLN phrasing ("law of nature") and natural purposes. | **Source of Normativity (#3).** Risks heteronomy by grounding duty in natural teleology rather than pure reason. | Strong on Exegetical Non-Negotiable #2, weak on Exegetical Non-Negotiable #3. |

  ### Summary Recommendation for the Reader
  When evaluating secondary literature, check where the author places their weight.
  *   If they prioritize **Exegetical Non-Negotiables**, they will likely defend the "hard" results of Kant's examples but struggle with the Maxim Formulation Problem.
  *   If they prioritize **Systematic Preferences**, they will likely offer a robust solution to maxim description and false negatives, but you must check if they have surreptitiously turned the Categorical Imperative into a Hypothetical one.
  *   **The Critical Juncture:** Pay closest attention to how they solve the **Maxim Formulation Problem**. This is the hinge upon which the success of the entire test rests. If they leave it vague, the test is indeterminate; if they fix it rigidly, the test is heteronomous.
