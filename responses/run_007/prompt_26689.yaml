  Let's finalize the "One Analogy." I'll recommend the **"API Contract"** analogy. It's close to distributed systems but focuses on *guarantees* rather than *state*. Asserting P is like returning a 200 OK; saying "I don't believe P" is like returning a 500 Error in the body. It's a protocol violation, not a data error. This bridges the gap better.

