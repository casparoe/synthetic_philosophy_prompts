prompt: |-
  I'm a journalist who covers science and ideas, and I've been reading around the philosophy of mind lately. One thing that keeps surfacing is the so-called combination problem for panpsychism — roughly, the difficulty of explaining how micro-level subjects of experience (if there are such things) could compose to yield the macro-level unified consciousness that you and I actually enjoy. The problem strikes me as having a family resemblance to questions that arise in complex systems theory: how do micro-level properties compose to yield macro-level phenomena, when is the whole more than the sum of its parts, what does emergence actually amount to, and so on.

  I'd like you to do something quite specific. Restate the panpsychist's combination problem — in its strongest and most careful formulations — using the conceptual vocabulary of complex systems theory and the philosophy of emergence. I mean terms like weak and strong emergence, downward causation, phase transitions, coarse-graining, order parameters, mereological supervenience, causal closure, and the like. I am reasonably fluent in this vocabulary; you needn't define the basics.

  Then I want the residue report. Which parts of the combination problem translate cleanly into this vocabulary, and which parts require distortion or fudging? Are there claims made by panpsychists about the combination of subjects that simply have no counterpart in how complex systems theorists talk about the composition of macro-level properties from micro-level ones? And — this is what I'm most curious about — does the residue point to something the complex-systems vocabulary is missing, or does it suggest that the combination problem, once stripped of its phenomenological dressing, is less philosophically distinctive than its proponents tend to suppose?

  Please write your answer in British English.
