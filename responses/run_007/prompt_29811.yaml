answer: |-
  Your intuitions are remarkably consistent. You haven't just stumbled on a bag of tricks; you've independently reconstructed a robust decision-theoretic framework. The "knobs" you identified (number of actors, stakes, reversibility, competence) are not separate principles. They are all parameters of a single underlying principle.

  The coherent principle that unifies your verdicts is **The Reference-Class Generalization Test.**

  ### The Principle
  **"Act only if the action would yield positive expected value if performed by all other agents who share your competence, information access, and capacity for harm."**

  This is a specific application of Rule Utilitarianism to the Unilateralist's Curse. It solves the problem by shifting the question from *"Is this action right for me?"* to *"Is this a right rule for my type of agent in this context?"*

  Here is how this single principle turns your "knobs" into a unified system, and where it challenges one of your verdicts.

  ---

  ### 1. How the Principle Unifies Your Cases

  **The Security Hole (Solo vs. 20 Independent)**
  *   **Solo:** Your reference class is "sole discoverer." If all sole discoverers acted on 55% confidence, the net result is positive (bugs get fixed faster than false alarms cause panic). **Verdict: Act.**
  *   **20 Independent:** Your reference class is "one of twenty independent discoverers." If all twenty acted on 55% confidence, you would almost certainly get multiple false alarms before a true one. The system floods. **Verdict: Don't Act (Coordinate).**
  *   **20 Pooled:** Once they pool evidence, they are no longer 20 independent agents. They are *one* collective agent. The reference class is "collective body." If all collective bodies acted on 55% pooled confidence, the error rate is low. **Verdict: Act.**

  **The Stakes (Accusation vs. Preprint)**
  *   **Accusation:** Your reference class includes the *cost of error*. If all accusers acted on 55% confidence, the societal cost of ruined reputations (False Positives) vastly outweighs the benefit of catching poisoners (True Positives). The "rule" fails. **Verdict: Raise Bar.**
  *   **Preprint:** If all researchers posted drafts on 55% confidence, errors are corrected quickly. The cost of a false positive is low. The "rule" holds. **Verdict: Keep Bar Low.**

  **The Line Between 2 and 20**
  *   There is no hard line. The principle relies on the **probability of redundant action.**
  *   With $N=2$, the chance that *both* are wrong and act is $0.45 \times 0.45 \approx 20\%$.
  *   With $N=20$, the chance that *at least one* is wrong and acts is $1 - 0.55^{20} \approx 99.99\%$.
  *   The principle says: Adjust your threshold until the "Generalized Rule" works. As $N$ rises, the individual threshold must rise to compensate, unless you coordinate (which effectively lowers $N$ to 1).

  ### 2. The Expert vs. Novices Case (The Stress Test)

  This is where your intuition might need a slight adjustment.

  **Your Verdict:** The Expert (55%) should post; the Novices should not.
  **The Principle's Analysis:**
  You defined the reference class by **competence**.
  *   *Reference Class A (Experts):* If all experts posted on 55% private confidence, is that good? Yes.
  *   *Reference Class B (Novices):* If all novices posted on 55% private confidence, is that good? No.

  So, the principle supports your verdict **only if** the novices are rational agents who recognize they belong to Reference Class B and refrain from acting.

  **The Correction:**
  If the novices are *capable* of posting (even if they shouldn't), the Expert faces a strategic dilemma. If the Expert posts, does that *prevent* the novices from posting?
  *   **If Yes:** The Expert should post immediately to "claim" the discovery and crowd out the noise. This is **preemptive stewardship.**
  *   **If No:** If the novices are going to post their own 55% guesses anyway, the Expert posting adds to the noise. In this case, the Expert's duty under the Generalization Test is to **coordinate the novices**, not just post.

  **Verdict to Revisit:** You shouldn't just say "She should post." You should say, "She should post *authoritatively* to signal that the matter is resolved, or coordinate the group to suppress novice posts." If she posts and 19 novices also post, the curse is realized regardless of her expertise.

  ### 3. Irreversible/Low-Stakes and High-Stakes/Reversible

  You asked how the principle handles these combinations. The principle handles them by adjusting the **Expected Value (EV)** calculation within the Generalization Test.

  *   **Irreversible + Low-Stakes:** (e.g., Deleting a temporary log file that can't be recovered but doesn't matter).
      *   *Generalization:* If everyone deleted logs on 55% confidence, would the cumulative loss be high? No, because the stakes are low.
      *   *Result:* Low threshold. Irreversibility only matters insofar as it contributes to the *cost* of error.
  *   **High-Stakes + Reversible:** (e.g., Evacuating a city for a false bomb threat, but you can let them back in).
      *   *Generalization:* If everyone evacuated cities on 55% confidence, the economic cost and panic (even if reversible) are massive.
      *   *Result:* High threshold. "Reversible" does not mean "Costless." The cost of the reversal process counts as the stake.

  ### 4. Summary of the Coherent Principle

  You don't need a list of knobs. You need to define your **Reference Class** correctly.

  When you feel the Unilateralist's Curse, ask:
  1.  **Who else can do this?** (Defines $N$)
  2.  **How similar is their judgment to mine?** (Defines Independence/Competence)
  3.  **What happens if *all* of us do this on *my* current threshold?** (The Generalization Test)

  If the answer to #3 is "Chaos" or "Net Harm," you are under a Unilateralist Curse. You must either:
  *   **Raise your threshold** (so the generalized rule works);
  *   **Lower $N$** (by coordinating/pooling);
  *   **Change the Reference Class** (e.g., "Only experts act," which requires a mechanism to enforce that distinction).

  ### Which Verdict to Give Up?

  I suggest refining the **Expert/Novice** verdict.
  Your intuition is that the Expert acts because she is an Expert. But the Unilateralist's Curse is a *systemic* failure mode. If the system allows 19 novices to act unilaterally, one Expert acting unilaterally doesn't fix the system; it just adds one more actor.
  **Revised Verdict:** The Expert should act *only if* her action credibly signals to the novices that they should stand down. If the novices are uncoordinated and untrusting, the Expert should prioritize **coordination** over **action**, even if she is right. The curse isn't about being wrong; it's about *redundant, uncoordinated action*.

  ### Final Takeaway
  Your gut is working perfectly. You are naturally performing a **Rule-Utilitarian calculation adjusted for epistemic independence.** The "principle" you are looking for is simply to make that calculation explicit: **Don't ask if you are right. Ask if a world where everyone like you acted on this evidence would be a better world.**
