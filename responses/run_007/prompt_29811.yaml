      *   *Standard Solution:* Lower individual thresholds based on $N$ (e.g., if you need 95% confidence solo, you need higher confidence when 100 others can act). OR, coordinate before acting.
      *   *User's Twist:* The user distinguishes between *private* 55% (don't act in groups) vs. *pooled* 55% (act). This is key. It suggests the issue isn't the confidence level per se, but the *independence of error*.

