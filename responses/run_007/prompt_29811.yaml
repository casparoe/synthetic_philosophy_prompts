          *   *Principle:* **Expected Value of the First Action.** You aren't deciding if *you* should act in a vacuum; you are deciding if *anyone* should act. If you act, you preempt others. If you are likely wrong, you cause harm before the right person acts.

      *   *Intuition 2 (Pooled Evidence):* Group discusses, reaches 55% collective, then Act.
