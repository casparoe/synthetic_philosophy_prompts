      *   *Key Insight for Markets:* A market price represents a probability. If two sentences $\phi$ and $\psi$ are logically equivalent ($\phi \iff \psi$), their prices *must* converge to the same value to prevent Dutch books (arbitrage). However, if the equivalence is unknown or computationally intractable, the market cannot enforce this immediately.
      *   *The "Logical Non-Omniscience" Constraint:* We cannot know all logical consequences instantly. Therefore, we cannot guarantee perfect consistency across all markets at all times. We can only guarantee consistency relative to *known* or *easily verifiable* logical relationships.
      *   *Implication for Procedure:* We must distinguish between *syntactic equivalence* (easy), *trivial semantic equivalence* (undergrad level), and *deep mathematical equivalence* (requires research). We can only merge on the first two. For the third, we must treat them as distinct assets, acknowledging the risk of future arbitrage if the link is proven.

