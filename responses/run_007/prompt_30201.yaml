answer: |-
  # Decision Procedure for Mathematical and Theoretical Markets

  **To:** Question-Review Team
  **From:** Head of Question-Review
  **Subject:** Standard Operating Procedure for Logical Markets (v1.0)

  ## 1. Theoretical Grounding
  This procedure is grounded in the framework of **Logical Induction** (Garrabrant et al., 2016). In a prediction market, prices represent probabilities. In empirical markets, probabilities reflect physical uncertainty. In mathematical markets, they reflect *logical uncertainty*.

  A logical inductor assigns probabilities to sentences without being omniscient. It respects logical relationships *as they are discovered*, not as they exist in platonic truth. Crucially, **if a logical relationship is computationally expensive or currently unknown to the community, the market is not required to enforce consistency across those sentences yet.**

  Our goal is not to prevent all future arbitrage (which is impossible without omniscience) but to prevent *trivial* arbitrage that exploits sloppy question design. We merge markets only when the equivalence is **definitional** or **computationally trivial** for our reviewers. We keep markets separate when the equivalence relies on **non-trivial theorems** or **human behavioral contingencies** (e.g., publication events).

  ## 2. The Decision Procedure
  **Time Budget:** 20 Minutes per Question
  **Reviewer Profile:** Undergraduate Math/CS

  ### Step 1: Syntactic and Trivial Semantic Check (5 Minutes)
  **Action:** Run the automated script. Then, read the proposed question against existing markets.
  **Ask:**
  1.  Is this a synonym substitution? (e.g., "colour" vs. "color", "programme" vs. "program")
  2.  Is this a double negation? (e.g., "Will it fail to be false?" vs. "Will it be true?")
  3.  Is one phrasing the *definition* of the other? (e.g., "Will a counterexample be found?" vs. "Will the conjecture be disproved?")

  **Decision:**
  *   **YES:** **MERGE.** Treat as the same asset. Adjust liquidity to the older market.
  *   **NO:** Proceed to Step 2.

  ### Step 2: The "Resolution Event" Check (5 Minutes)
  **Action:** Identify exactly what physical or digital event resolves the market to **YES**.
  **Ask:**
  1.  Does the resolution depend on a *truth value* (e.g., "Is P=NP?") or a *publication event* (e.g., "Will a paper be published?")?
  2.  If both are "publication events," could one happen without the other?

  **Decision:**
  *   **If one is Truth and one is Publication:** **DO NOT MERGE.** (A theorem can be true before it is published, or published incorrectly). List as separate.
  *   **If both are Publication:** Could Person A publish Algorithm X without publishing Algorithm Y, even if X implies Y?
      *   **YES:** **DO NOT MERGE.** (See Case 1 below).
      *   **NO:** Proceed to Step 3.

  ### Step 3: The "Undergrad Reduction" Check (5 Minutes)
  **Action:** Assess the logical link between the claims.
  **Ask:**
  1.  Is the equivalence a standard result taught in an undergraduate curriculum? (e.g., 3-SAT is NP-Complete).
  2.  Can the equivalence be verified in under 20 minutes using standard references (e.g., Wikipedia, textbooks) without deriving a new proof?
  3.  Is the link conditional on an open problem? (e.g., "These are equivalent *if* P=NP").

  **Decision:**
  *   **Equivalence is Definitional/Standard:** **MERGE.** (See Case 2 below).
  *   **Equivalence requires a Non-Trivial Theorem:** **DO NOT MERGE.** List as correlated assets. Add a "Related Market" link in the description. (See Case 3 below).
  *   **Equivalence is Conditional on Open Problem:** **DO NOT MERGE.** The logical link is not currently active.

  ### Step 4: The "Dutch Book" Stress Test (3 Minutes)
  **Action:** Imagine a trader trying to exploit the two markets.
  **Ask:**
  1.  If I buy "YES" on Market A and "YES" on Market B, is there a scenario where one pays out and the other does not?
  2.  If I buy "YES" on A and "NO" on B, is there a scenario where I win both?

  **Decision:**
  *   **If a scenario exists (even unlikely):** **DO NOT MERGE.**
  *   **If no scenario exists:** **MERGE.**

  ### Step 5: Human Judgment Flag (2 Minutes)
  **Action:** If the reviewer is unsure after Step 3.
  **Ask:**
  1.  Am I guessing about the math, or do I know it?
  2.  Is the risk of a "stale market" (no liquidity) worse than the risk of "arbitrage"?

  **Decision:**
  *   **If guessing:** **REJECT** the proposed question as "Ambiguous Logical Structure." It is better to have no market than a exploitable one.
  *   **If liquidity is critical:** **LIST SEPARATELY** with a prominent disclaimer: *"Note: This market is logically related to [Market X], but resolution criteria differ."*

  ---

  ## 3. Application to Test Cases

  ### Case 1: Poly-time Hamiltonian Path (HP) vs. Poly-time 3-SAT
  *   **Proposed:** "Will a polynomial-time algorithm for the Hamiltonian path problem be published by 2035?"
  *   **Existing:** "Will a polynomial-time algorithm for 3-SAT be published by 2035?"
  *   **Analysis:**
      *   **Step 1:** Not syntactic duplicates.
      *   **Step 2:** Both are *publication events*.
      *   **Step 3:** They are equivalent *only if* P=NP. However, even if P=NP, a researcher might publish a 3-SAT solver without explicitly writing out the HP reduction, or vice versa. The *publication event* is not logically identical, even if the *complexity class implication* is.
      *   **Step 4:** Scenario: A team publishes a 3-SAT solver in 2034. The market resolves YES. No one ever publishes an HP solver explicitly. The HP market resolves NO.
  *   **Procedure Verdict:** **DO NOT MERGE.** List as separate markets.
  *   **Why you will not like this:** These feel like the same bet on P=NP. Merging them would concentrate liquidity. However, merging them creates a resolution nightmare. If a 3-SAT algo is found but no HP algo is explicitly published, do we pay out both? If we do, we are resolving based on *implication*, not the *question text*. This violates the market contract. We must treat them as distinct assets that will likely correlate highly.

  ### Case 2: Goldbach Disproved vs. Counterexample Exhibited
  *   **Proposed:** "Will someone exhibit an even integer greater than 2 that is not the sum of two primes by 2040?"
  *   **Existing:** "Will Goldbach's conjecture be disproved by 2040?"
  *   **Analysis:**
      *   **Step 1:** Not syntactic duplicates.
      *   **Step 2:** Resolution Event. To disprove a universal claim ($\forall n, P(n)$) in number theory, one *must* exhibit a counterexample ($\exists n, \neg P(n)$). There is no other way to resolve "Disproved" to YES.
      *   **Step 3:** This is a definitional equivalence, standard undergraduate logic.
      *   **Step 4:** No scenario exists where one pays YES and the other NO.
  *   **Procedure Verdict:** **MERGE.**
  *   **Reasoning:** This is a trivial logical identity. Keeping them separate would allow immediate arbitrage (buy low on one, sell high on the other) with zero risk.

  ### Case 3: Equivalence via Non-Trivial Theorem
  *   **Proposed:** A question equivalent to an existing one under a theorem the team cannot verify in 20 minutes (e.g., a specific consequence of the Classification of Finite Simple Groups).
  *   **Analysis:**
      *   **Step 3:** The equivalence relies on a "black box" theorem. Reviewers cannot verify the link within the time budget.
      *   **Logical Induction Principle:** The market represents *current community knowledge*. If the link is not common knowledge or easily verifiable, the market prices are allowed to diverge. Forcing a merge assumes omniscience we do not possess.
  *   **Procedure Verdict:** **LIST SEPARATELY.** Add a disclaimer: *"Mathematically related to [Market X] via [Theorem Name], but traded as distinct assets."*
  *   **Reasoning:** If we merge and the theorem turns out to have a caveat we missed, we face a resolution crisis. If we list separately, traders who know the theorem can arbitrage the gap, which is a feature of the market (price discovery), not a bug.

  ---

  ## 4. Limitations and The "Uncomfortable Truth"

  You asked for a procedure that guarantees consistency. **I cannot give you that.** Here is what this procedure cannot do, grounded in the limits of Logical Induction:

  **1. We Cannot Prevent All Arbitrage**
  Logical Induction proves that a market can be efficient against polynomial-time traders *without* being logically omniscient. This means there *will* be logical relationships that exist but are too expensive for our reviewers (or the market) to compute instantly.
  *   **The Consequence:** Smart traders with better math knowledge *will* find pairs of markets that are logically linked but priced differently. They will exploit this.
  *   **The Trade-off:** If we try to prevent this by merging everything that *might* be linked, we will merge questions that are actually distinct (like Case 1), leading to wrongful resolutions and lawsuits. We must accept some arbitrage risk to ensure resolution integrity.

  **2. The "Publication" vs. "Truth" Gap**
  In Case 1, I instructed you not to merge. This creates a market inefficiency. Users want to bet on "P=NP," but we are forcing them to bet on "Paper A" vs. "Paper B."
  *   **The Consequence:** Liquidity will be fragmented. Prices may diverge temporarily.
  *   **The Fix:** We cannot fix this procedurally. We can only fix it by changing our product. If you want unified P=NP markets, you must phrase questions as "Will P=NP be officially settled by the Clay Institute by 2035?" rather than asking about specific algorithms.

  **3. Judgment Calls Dressed as Procedure**
  Step 3 ("Undergrad Reduction") is the danger zone. What counts as "standard knowledge"?
  *   **The Risk:** One reviewer thinks the Prime Number Theorem is standard; another thinks it requires lookup.
  *   **Mitigation:** Maintain a "Whitelist of Standard Equivalences" (e.g., NP-Complete reductions, De Morgan's Laws). If it's not on the whitelist, default to **Do Not Merge**. It is safer to have two correlated markets than one incorrectly merged market.

  **Summary Instruction:**
  When in doubt, **do not merge.** A duplicate market costs us liquidity. A wrongly merged market costs us solvency. Logical uncertainty is a feature of our platform, not a bug to be eliminated. Let the traders discover the logical links; our job is only to ensure the resolution criteria are unambiguous.
