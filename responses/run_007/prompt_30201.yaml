      *   *Logical Induction Principle:* Prices reflect *current* logical knowledge, not *ideal* logical knowledge. Therefore, if the link isn't "known" (in the public consensus sense), the prices are allowed to diverge.
      *   *Decision:* Merge only on *definitional* equivalence. Reject on *contradiction*. List separately on *conditional* or *reduction-based* equivalence.

