  ### The Setup

  **Object:** A standard soda-lime **glass vial**, sealed and empty.
  **Disposition:** **Fragility** (the tendency to undergo structural failure/shatter).
  **Stimulus:** A sharp mechanical **impact** (e.g., struck by a steel ball bearing at 5 m/s).
  **Manifestation:** **Shattering** (catastrophic propagation of cracks through the silicate lattice).

  **The Apparatus:** The vial sits inside a test rig equipped with a piezoelectric impact sensor and a high-speed aerosol nozzle aimed directly at the vial. The system is calibrated to trigger the nozzle the instant the sensor detects the shockwave of the impact, firing before the cracks can propagate (milliseconds).

  ### The Variants

  The two variants differ by exactly one physical detail: **the molecular size of the polymer in the aerosol spray.**

  **Variant A (The Fink): Small Molecules.**
  The spray contains a low-viscosity monomer with molecules small enough to **penetrate the microscopic surface flaws** of the glass instantly upon contact. Upon entering the lattice micro-fractures initiated by the impact, the monomer flash-cures and cross-links with the silicate structure.
  *   **Mechanics:** The intervention alters the intrinsic tensile strength of the glass *during* the stimulus. The glass physically becomes tougher than it was at $t_0$.
  *   **Outcome:** The vial does not shatter. It remains intact.

  **Variant B (The Mask): Large Molecules.**
  The spray contains a high-viscosity polymer with molecules too large to penetrate the glass surface. Instead, it instantly envelops the vial in a tight, high-tension **exoskeleton sheath**.
  *   **Mechanics:** The intervention applies external compressive force that counteracts the tensile stress of the impact. The glass lattice *attempts* to fail (cracks initiate), but the external pressure prevents the cracks from opening and propagating. The intrinsic structure of the glass remains unchanged.
  *   **Outcome:** The vial does not shatter. It remains intact.

  ---

  ### The Check

  **Simple Conditional Analysis (SCA):**
  $x$ is disposed to $M$ when $S$ iff, were $S$ to occur, $x$ would $M$.
  *(The vial is fragile iff, were it struck, it would shatter.)*

  #### Variant A (Fink) Analysis
  *   **SCA Prediction:** In the closest world where the impact occurs, the spray fires, the glass hardens, and it does *not* shatter. The conditional "If struck, would shatter" is **False**.
  *   **SCA Verdict:** The vial is **Not Fragile**.
  *   **Real Dispositional Verdict:** The vial **Was Fragile** at the moment of impact ($t_0$). The disposition existed but was removed by the stimulus process before manifestation.
  *   **Failing Direction:** **Left-to-Right** ($D \rightarrow (S \square \rightarrow M)$). The disposition is present, but the conditional is false.

  #### Variant B (Mask) Analysis
  *   **SCA Prediction:** In the closest world where the impact occurs, the spray fires, the sheath holds, and it does *not* shatter. The conditional "If struck, would shatter" is **False**.
  *   **SCA Verdict:** The vial is **Not Fragile**.
  *   **Real Dispositional Verdict:** The vial **Is Fragile**. The disposition is present and persists through the stimulus, but the manifestation is physically blocked.
  *   **Failing Direction:** **Left-to-Right** ($D \rightarrow (S \square \rightarrow M)$). The disposition is present, but the conditional is false.

  **Observation:** Both cases fail the same direction of the biconditional. This is interesting because it reveals that the SCA is **blind to the persistence of the base property**. It only cares about the input-output match ($S \rightarrow M$). Whether the failure of $M$ is caused by the *loss of power* (Fink) or the *interference with output* (Mask) is invisible to the simple conditional. Both look like "non-fragile" objects to the SCA.

  ---

  ### The Single Detail

  **The Detail:** **Polymer Permeability** (Small vs. Large Molecules).

  **If You Delete It:**
  If you remove the polymer entirely (no spray), both variants collapse into a **boring case**:
  *   Impact occurs.
  *   No intervention.
  *   Vial shatters.
  *   SCA Conditional: "If struck, would shatter" is **True**.
  *   SCA Verdict: Fragile.
  *   Real Verdict: Fragile.
  *   **Result:** The analysis gets it right. The distinction between Fink and Mask vanishes because there is no intervention to distinguish *how* the manifestation is prevented.

  **If You Blur It:**
  If the polymer is *partially* permeable, you get a hybrid case where the glass is partially reinforced and partially constrained. The SCA still fails L-to-R, but the ontological classification becomes muddy. The sharpness of the permeability detail is what carves the clean joint between "changing the object" (Fink) and "constraining the object" (Mask).

  ---

  ### Steelmanning the Conditional Analyst

  The conditional analyst is not without recourse. Their least ad-hoc repair is the **Intrinsicness Constraint**.

  **The Repair:**
  " $x$ is disposed to $M$ when $S$ iff, were $S$ to occur, $x$ would $M$, **holding fixed the intrinsic properties of $x$**."

  **Does it handle both?**
  *   **Variant B (Mask):** The repair **works**. The mask (exoskeleton sheath) is extrinsic. If we hold the intrinsic properties of the glass fixed (its lattice structure, tensile strength), we must imagine the sheath away in the counterfactual evaluation. Without the sheath, the glass shatters. The conditional becomes True. The verdict is "Fragile." Correct.
  *   **Variant A (Fink):** The repair **fails** (or requires further tweaking). In the Fink case, the intrinsic properties *change* as part of the causal chain of the stimulus. If we hold intrinsic properties fixed *through time*, we are essentially stipulating that the Fink mechanism cannot fire (because firing it changes the intrinsics). If we stipulate the Fink mechanism doesn't fire, the glass shatters, and the verdict is "Fragile." Correct.

  **The Tension:**
  To fix the Mask, we need to hold intrinsics fixed *at the time of stimulus*. To fix the Fink, we need to hold intrinsics fixed *through the duration of the stimulus*.
  *   If we fix intrinsics only at $t_0$: The Fink still works (intrinsics change at $t_1$), so SCA still says "Not Fragile."
  *   If we fix intrinsics for all $t$: We are effectively banning Finks by definition.

  **Better Repair:** The **Ceteris Paribus (Normal Conditions)** clause.
  " $x$ is disposed to $M$ when $S$ iff, were $S$ to occur **in normal conditions**, $x$ would $M$."
  *   **Mask:** A protective sheath is not a "normal condition" for a glass vial. Exclude it. Conditional True.
  *   **Fink:** A self-hardening spray is not a "normal condition." Exclude it. Conditional True.

  **Verdict on the Repair:** The Ceteris Paribus clause handles both variants with a single patch, but it risks vacuity. What counts as "normal"? If Finks are physically possible (as my rig demonstrates), are they "normal"? The analyst must define "normal" as "absence of disposition-removing interferers," which looks suspiciously like just saying "absence of Finks."

  ---

  ### Conclusion: Do They Carve a Joint?

  **Yes, they carve a real joint, but not in the counterfactuals—in the metaphysics of the base property.**

  The fact that the SCA fails in the *same direction* for both cases suggests that, logically, Finks and Masks are symptoms of the same brittleness in counterfactual logic: **Counterfactuals are sensitive to the entire causal chain, while dispositions are supposed to be local properties.**

  However, the **single detail (Permeability)** proves they are ontologically distinct:
  1.  **Masks** are **Extrinsic Interferences**. The disposition remains intact; the path to manifestation is blocked. The repair is to exclude extrinsic factors.
  2.  **Finks** are **Intrinsic Volatilities**. The disposition itself is the casualty. The repair is to restrict dispositions to stable intrinsic bases.

  If you treat them as the same symptom, you miss the solution. You fix Masks by looking *outside* the object (remove the sheath). You fix Finks by looking *inside* the object (stabilize the lattice). The SCA fails both because it refuses to look inside; it only watches the input and output. The "Fink/Mask" distinction is the philosophical demand to open the black box.
