answer: |-
  ### 1. Dependency Structure
  Before the Formula of Universal Law (FUL) can function as a test, three conceptual prerequisites must be secured. Do not proceed to the test until these are checked.

  1.  **The Maxim (The Input):** Students must understand that the test evaluates a *principle of volition*, not an isolated act or a vague intention.
      *   *Required Definition:* A maxim is a subjective policy: "I will do [Action] in [Circumstances] for [Purpose]."
      *   *Check:* Ask a student to convert "I want to cheat" into a maxim. If they say "Cheating," correct them. It must be "I will cheat *when* I want a higher grade *to* avoid studying."
  2.  **Universal Law (The Mechanism):** Students must understand "universalizing" as legislating a *law of nature*, not merely predicting frequency.
      *   *Required Distinction:* It is not "What if everyone *happened* to do this?" (empirical prediction). It is "What if everyone *were compelled by natural law* to do this?" (conceptual necessity).
  3.  **Contradiction (The Failure Condition):** Students must understand that the test fails only if the universalized maxim generates an incoherence, not merely an inconvenience.
      *   *Required Distinction:* A contradiction is a breakdown in the *possibility* of the action or the *rationality* of the will, not a clash of preferences.

  ### 2. Why Empirical Consequences Are the Wrong Currency
  You must explicitly sever the link between "bad outcomes" and "moral wrongness" before they run the test.
  *   **The Explanation:** Tell them Kant is not asking, "Would the world be worse?" He is asking, "Would the *rule* make sense?"
  *   **The Analogy:** Use the "Traffic Light" analogy. If everyone ran red lights, accidents would happen (bad consequence). But Kant's point is deeper: If everyone *necessarily* ran red lights (as a law of nature), the concept of a "red light" (a signal to stop) would cease to exist. The action becomes *impossible*, not just dangerous.
  *   **The Currency:** The currency of the test is **Rational Coherence**, not **Happiness** or **Welfare**. If the world is miserable but the maxim is logically consistent, Kant permits it. If the world is happy but the maxim is self-contradictory, Kant forbids it.

  ### 3. The One Worked Example: "The Money Scenario"
  Use a single scenario context to minimize cognitive load, but vary the *maxim* within it to generate the CC/CW distinction.

  *   **The Scenario:** A person needs money and considers asking for a loan.
  *   **What it Must Have:**
      *   A reliance on a social institution (promising/lending).
      *   A clear self-interested purpose (getting cash).
      *   A clear conditional structure (I will do X *if* I need Y).
  *   **What it Must Lack:**
      *   Emotional stakes (e.g., starving family). Keep it sterile to prevent utilitarian calculation.
      *   Complex side effects (e.g., "the bank will crash"). Focus on the *concept* of promising, not the economic fallout.
  *   **Execution:**
      1.  **Maxim A (False Promise):** "I will borrow money by promising to repay, knowing I cannot, to solve my financial problem."
      2.  **Maxim B (Non-Beneficence):** "I will never lend money to anyone in distress, to protect my own assets." (Keep the money context to maintain the "one example" feel).

  ### 4. Sequence: Making the Duty Divide Emerge
  Do not announce "Perfect" and "Imperfect" duties. Let them discover the difference in *how* the test fails.

  1.  **Run Maxim A (False Promise):**
      *   Universalize: A world where everyone necessarily makes false promises when in need.
      *   Identify Contradiction: The institution of promising collapses. No one believes promises.
      *   Result: The action (promising to get money) becomes **impossible**.
      *   *Label:* "The action destroys itself."
  2.  **Run Maxim B (Non-Beneficence):**
      *   Universalize: A world where everyone necessarily refuses to lend/help.
      *   Identify Contradiction: The institution of lending still *exists* (logically possible), but the agent *cannot will* this. Why? Because the agent might need help later. To will a world where help is impossible contradicts their own will to be helped.
      *   Result: The action is **possible**, but the **will is at war with itself**.
      *   *Label:* "The will contradicts its own interests."
  3.  **Emerge the Distinction:**
      *   Ask: "In Case A, could you do the act? In Case B, could you do the act?" (Answer: No vs. Yes).
      *   Ask: "So which rule is stricter?" (Case A).
      *   *Now* introduce the terms: Case A = Perfect Duty (Strict prohibition). Case B = Imperfect Duty (Constraint on the will, allows latitude).

  ### 5. Misconception Mapping
  Here is where the errors will form and how to intercept them.

  | Misconception | Likely Formation Point | Interception Strategy |
  | :--- | :--- | :--- |
  | **"Maxim = Intention/Action"** | **Minute 0-5 (Setup)** | **Stop them.** If a student says "The action is lying," correct immediately: "The action is 'making a statement.' The *maxim* is 'making a statement *I know is false*.' The test is on the rule, not the movement." |
  | **"Universalizing = Frequency"** | **Minute 10 (Universalization Step)** | **Rephrase.** When they say "If everyone did this...", interrupt: "Don't imagine a crowd. Imagine a *law of nature*. Imagine if gravity forced everyone to lie when in need. Does the concept of 'truth' survive?" |
  | **"Test = Golden Rule"** | **Minute 15 (The Test)** | **Contrast.** "The Golden Rule asks: 'Would you *like* this done to you?' Kant asks: 'Can you *consistently will* this as a law?' You might *like* being the only cheater. Kant asks if you can be a *universal* cheater." |
  | **"Contradiction = Clash of Desires"** | **Minute 25 (CW Analysis)** | **Isolate the Will.** "It's not that you *want* help and *don't want* to give it. It's that by willing a no-help world, you destroy the *possibility* of your own goal (being helped). It is a practical contradiction, like willing to speak without a language." |
  | **"Bad Outcome = Forbidden"** | **Minute 35 (Consequences)** | **The Green Socks Test.** (See Closing Question). Explicitly state: "If everyone wore green socks, the world might be ugly. But is it contradictory? No. So it is permitted." |

  ### 6. What to Explicitly Leave Out
  To survive the 50-minute limit, you must omit the following. If students ask, park them for office hours.
  *   **The Formula of Humanity:** Do not mention "treating people as ends." It confuses the mechanism of the FUL test at this stage.
  *   **Noumenal/Phenomenal Distinction:** Do not discuss metaphysics or freedom. Treat the test as a procedure for rational agents.
  *   **Counter-examples to FUL:** Do not introduce the "Inquiring Murderer" or "Polite Lies" objections. They undermine the confidence in the test before they understand how it works.
  *   **Kant's Biography/History:** No need for Königsberg or the Enlightenment context today.

  ### 7. Closing Question
  Do not ask them to recite the definition. Ask them to apply the *logic of the failure condition* to a neutral case.

  **The Question:**
  > "Imagine a maxim: 'I will always wear green socks on Tuesdays.' If everyone universalized this, the world might be visually monotonous and people might dislike it. But does Kant's test forbid it? Why or why not?"

  **What a Correct Answer Looks Like:**
  *   They must identify that while the *outcome* is undesirable (empirical consequence), there is no **contradiction in conception** (promising still works) and no **contradiction in will** (I do not logically need others to wear green socks for me to wear them).
  *   *Key phrase to listen for:* "It's not contradictory," or "The action is still possible," or "Kant doesn't care about the outcome, only the consistency."

  **What a Memorized/False Answer Looks Like:**
  *   "It's bad because everyone would hate it." (Consequentialism).
  *   "It's wrong because you wouldn't want others to do it to you." (Golden Rule).
  *   "It's an imperfect duty." (Guessing terminology without grasping the logic).
