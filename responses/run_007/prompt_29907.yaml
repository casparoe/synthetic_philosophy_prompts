prompt: |-
  I'm a graduate TA, and in one fifty-minute section I need to introduce first-year students to Kant's Formula of Universal Law. Don't explain it to me; plan how I should explain it. I need the dependency structure: what has to be in place before the test itself makes sense, why empirical consequences are the wrong currency, the one worked example that should carry the section and what it must have and lack, and a sequence for the contradiction-in-conception versus contradiction-in-will distinction so that the perfect/imperfect duty divide emerges rather than being announced. I expect these misconceptions: that the test is just the Golden Rule, that universalizing means imagining a world where everyone does the act and asking whether you would like the outcome, that a maxim is just an intention or just the action, and that a contradiction here is a clash of desires. Tell me where in the sequence each is likely to form and how to head it off, what to explicitly leave out at this level, and one closing question whose answer would show whether they have grasped the test itself rather than memorized the false-promise case.
