      *   *Claim 4:* "Landauer proved that erasing a single bit of information at temperature T unavoidably dissipates at least kT ln 2 of heat into the environment."
      *   *Claim 5:* "That dissipated heat carries enough entropy to settle the second law's account: the sorting lowers the entropy of the gas, but the erasure raises the entropy of the surroundings by at least as much, so the total entropy of gas-plus-demon-plus-environment never decreases."
      *   *Claim 6:* "Bennett later showed that the measurement itself can in principle be carried out reversibly, which is why the thermodynamic cost falls on erasure rather than on observation."
