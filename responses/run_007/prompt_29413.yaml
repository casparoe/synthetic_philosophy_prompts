answer: |-
  The microscope slide was labeled *Meiosis I*, but all Leo could see was a graveyard.

  Mr. Henderson was droning on about chromosomal crossover, about how the shuffle of DNA meant that every sperm and every egg was a unique lottery ticket. "Statistically," Henderson said, tapping the whiteboard, "the version of you sitting in that chair is a one-in-four-hundred-trillion chance. If your parents had conceived you five minutes later, on a different night, with a different sperm… you wouldn't be you. You'd be someone else. Or, more accurately, you wouldn't be at all."

  The class laughed. It sounded like a parlor trick. *Of course I'm me,* Leo thought. *Who else would I be?*

  But the seed took root. That night, Leo lay in bed staring at the glow-in-the-dark stars on his ceiling, wondering if he was just a ghost haunting a specific arrangement of atoms. He tried to imagine himself coming from a different sperm. He tried to picture a brother who looked like him, had his name, but wasn't *him*. It gave him a headache, a specific kind of nausea that felt like falling in an elevator.

  The obsession deepened a week later when he found the envelope in the junk drawer. It was tucked behind old tax returns, a thick manila folder labeled *St. Jude's Fertility Clinic*.

  Leo knew he wasn't adopted. He had his dad's nose and his mom's anxiety. But as he flipped through the pages, the dates stopped making sense. There were invoices for *In Vitro Fertilization*. There were records of stimulation cycles. And there, on a printed sheet with a grainy black-and-white photo, were two circles labeled *Embryo A* and *Embryo B*.

  *Embryo A: Transferred.*
  *Embryo B: Cryopreserved.*

  He kept reading. *Embryo B: Donated to anonymous recipient.*

  Leo sat on the linoleum floor of the kitchen, the paper trembling in his hand. He wasn't a lottery ticket. He was a choice. His parents had rolled the dice twice, created two distinct lives, and then picked one. They picked him.

  But who was Embryo B?

  It wasn't just a sibling. It was the *Other*. It was the life that almost happened. If the doctor's hand had twitched, if the tray had been rotated ten degrees to the left, Embryo B would be in his mother's womb. Embryo B would be sleeping in this bed. Embryo B would be named Leo.

  That night, the dream started.

  It wasn't a normal dream. It had the texture of reality, but the lighting was always slightly off—too yellow, like old streetlamps. Leo would wake up in his bed, in his room, but the air felt heavier. He would sit up, and there, in the desk chair where he did his homework, sat a boy.

  He looked like Leo. He had the same messy brown hair, the same scar on his chin from falling off a bike at age seven. He was wearing Leo's hoodie.

  "Who are you?" Dream-Leo asked.

  The boy in the chair spun around. He smiled, but it didn't reach his eyes. "I'm Leo."

  "No," Dream-Leo said, his voice tight. "I'm Leo."

  "You're the one they kept," the boy said. He sounded calm, resigned. "I'm the one who should have been here. They almost picked me, you know. The doctor said Embryo B had better cell division. I was the stronger one."

  "That's not true," Dream-Leo said, though he didn't know if it was. "I'm here. That makes me real."

  "Are you?" The boy stood up and walked over to the mirror. He touched the glass. "If they had implanted me, you would be dust. You wouldn't be dreaming. You wouldn't be feeling scared. You would be nothing. So why do you think you have the right to this life?"

  Leo would wake up gasping, his sheets soaked in sweat.

  It happened three times a week for a month. The scenario never changed. Same room, same yellow light, same boy in the chair claiming his name.

  Leo stopped sleeping. He started avoiding his parents. How could he look at them and not wonder if they missed the other one? Did they look at him and see a consolation prize? Or did they look at him and see the specific miracle he was supposed to be?

  He brought it up in philosophy club, vaguely. "If someone else was born in your place," he asked the group, "would it be you?"

  "Obviously," said Sarah, a senior. "If they have your memories and your personality, it's you."

  "But what if they don't have your memories yet?" Leo pressed. "What if it's just about where you started? The cell?"

  "Who cares about the cell?" Sarah laughed. "That's just biology. You're your mind."

  Leo didn't laugh. He felt a cold knot in his stomach. If Sarah was right, then the boy in the dream was him. If identity was just about the pattern of the mind, then the boy in the chair was the real Leo, and Leo was the imposter.

  But the dream felt wrong. It felt like a violation.

  The breakthrough came on a Tuesday. Leo was studying for a chemistry test, exhausted, when he drifted off at his desk.

  The yellow light flooded the room. The boy was in the chair again. But today, he was holding Leo's phone. He was scrolling through Leo's photos.

  "Stop that," Leo said.

  "It's my phone," the boy said. "In my timeline, I took these pictures. I remember taking them."

  "No, you don't."

  "I do," the boy insisted. He stood up and walked toward Leo. "I remember the smell of this room. I remember the way the floorboard creaks. I remember your mom's cooking. If I had been implanted, I would have lived this life. I would be you."

  The boy reached out to touch Leo's shoulder.

  And that was when Leo felt it.

  It wasn't fear. It was a sudden, absolute certainty. A snap of recognition that hit him harder than any biology lesson.

  When the boy's fingers brushed his arm, Leo didn't feel a connection. He felt a void. He realized that if the boy in front of him was the one who had been born, *Leo* wouldn't be standing there to be touched. There would be no consciousness to observe the room. There would be no one to feel the cold, no one to miss the sun.

  The boy in the dream wasn't a version of Leo. He was a stranger wearing Leo's face. He was a simulation.

  "You're not me," Leo whispered.

  The boy frowned. "I have your genes. I have your parents."

  "You have *their* genes," Leo said, the realization blooming in his chest. "You're Embryo B. You're my brother. You're a different person entirely."

  "I could have been you."

  "No," Leo said. And for the first time, he understood what Mr. Henderson had meant. It wasn't about the genes. It wasn't about the name. It was about the thread. "If they picked you, I don't exist. I don't go somewhere else. I don't become you. I just… don't happen. This," Leo tapped his own chest, "this specific awareness? It's tied to *that* specific cell. Embryo A. Not B. If you were born, there would be a person here. But it wouldn't be me. It would be you. And I would be gone."

  The boy in the chair looked confused. The yellow light flickered. "But we're the same."

  "We're not," Leo said. "I'm not a pattern. I'm an origin. I'm the thing that happened when *that* sperm hit *that* egg. If you change the start, you don't get a different version of the story. You get a different book."

  The boy opened his mouth to argue, but the room began to dissolve. The yellow light turned white, then bright, then blinding.

  Leo woke up at his desk. His cheek was stuck to the chemistry textbook. The sun was actually shining through the window, real and white and sharp.

  He sat there for a long time, listening to the house settle. He heard his mom in the kitchen, humming a song she always hummed. He heard the specific creak of the floorboard in the hallway.

  He walked to the bathroom and looked in the mirror. He looked tired. He looked exactly like himself.

  He thought about the other embryo, the one donated to strangers. He hoped that kid was happy. He hoped that kid had a name he loved and parents who cherished him. But he knew, with a cold and comforting clarity, that he would never meet him. Not really. Because if he stood in a room with that kid, they would be two different people. Two different origins. Two different miracles.

  There was no timeline where Leo was born from Embryo B. There was only this timeline. There was only this beginning.

  Leo turned off the bathroom light. He walked downstairs to find his mom. He needed to hear her voice, not because it proved he had memories, but because it proved he was here. He was not a ghost haunting a life he could have lost. He was the life that was won.

  "Mom?" he called out.

  "In here, Leo," she answered.

  He walked toward the sound. He didn't wonder if she was calling to the right son. He just walked, one foot in front of the other, existing in the only place he could ever possibly be.
