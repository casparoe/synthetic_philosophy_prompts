answer: |-
  Here are 10 questions with follow-ups, tailored for a formal epistemology/philosophy of language audience. They are designed to be technically precise, referencing the specific literature (Lewis, Adams, Bradley, McGee) while preventing the speaker from isolating her view from the triviality landscape.

  ### (a) Embedding and Logic

  **1. The Negation Problem**
  "On your view, 'If A, C' lacks a truth value, so standard negation shouldn't apply. Yet speakers confidently assert 'It is not the case that if A, C' and seem to assign probabilities to these negations. If the embedded conditional has no truth conditions, what semantic content does the negation operator operate on? Are you forced to say that negated conditionals are systematically ambiguous or semantically defective?"

  *   **Follow-up:** "If you say they are defective, you face a problem with the probability calculus. We routinely assign high probability to $\neg(A \to C)$ when $P(C|A)$ is low. If $A \to C$ has no probability (only assertability), how do you validate the intuition that $P(\neg(A \to C)) = 1 - P(A \to C)$ without reintroducing a propositional proxy that would be vulnerable to Lewis's result all over again?"

  **2. Antecedents and McGee's Counterexamples**
  "Consider McGee's counterexamples to Modus Ponens involving nested conditionals: 'If a Republican wins, then if it's not Reagan, it's Anderson.' To evaluate this, we seem to suppose the antecedent conditional is true. But if conditionals aren't the kind of thing that can be true, how do we 'suppose' them in the antecedent of a higher-order conditional? Does your view require us to deny that natural language actually allows conditionals in antecedents, or do you posit a covert propositional surrogate?"

  *   **Follow-up:** "If you posit a surrogate (e.g., a set of pairs or a context change potential) to handle the embedding, doesn't that surrogate end up playing the exact functional role of a proposition? If so, when we run triviality results on the *surrogate's* probability function, don't we get the collapse regardless of whether the surface grammar has truth conditions?"

  ### (b) Attitudes: Belief, Disagreement, and Updating

  **3. The Object of Conditional Belief**
  "If 'If A, C' expresses no proposition, there is no proposition to be the object of my belief when I believe that if A, C. Is the mental state simply a disposition to infer C upon learning A? If so, how do you distinguish between *believing* the conditional and merely being *disposed* to accept the consequent given the antecedent, given that I can be disposed to accept C given A without endorsing the conditional (e.g., in cases of misleading evidence)?"

  *   **Follow-up:** "You might say the belief *is* the conditional credence. But if two agents disagree—one asserts 'If A, C' and the other 'If A, not C'—what is the normative conflict? If there is no truth-apt content they are both aiming at, does their disagreement reduce to a clash of policies? If so, why does it feel like a factual dispute where one party is objectively mistaken?"

  **4. Updating on Testimony**
  "Suppose I learn 'If A, C' from your testimony. In a standard Bayesian framework, I update by conditionalizing on a proposition I've learned to be true. Since you deny the conditional is a proposition, I cannot conditionalize on it. Do you propose a distinct update rule for conditionals? If so, how do you ensure this rule commutes with learning factual information, or are you committed to a fragmented epistemology where conditionals and facts update via incommensurable mechanisms?"

  *   **Follow-up:** "If you suggest I update by directly setting my $P(C|A)$ to match yours, doesn't this presuppose that your assertion conveyed a constraint on my probability function that is itself truth-evaluable? In other words, isn't the claim 'Your $P(C|A)$ ought to be $x$' itself a truth-apt normative proposition that your account struggles to locate?"

  ### (c) The Norm Itself

  **5. Justifying Adams's Thesis**
  "You take Adams's Thesis as the norm of assertion. Why is the norm tied to conditional probability $P(C|A)$ rather than the probability of the material conditional $P(\neg A \lor C)$, which is also high in many assertable cases? Is this norm a primitive brute fact about English, or can it be derived from a decision-theoretic framework? If derived, doesn't the derivation typically assume that the conditional has some truth-like value in the utility function?"

  *   **Follow-up:** "If you say it's primitive, you risk making the view stipulative. But you've presented this as a discovery about the semantics of English. If it's a semantic discovery, there must be data that could falsify it. If it's a pragmatic norm, why does it bind so tightly that violations feel like semantic errors rather than just infelicitous speech acts?"

  **6. Stating the Norm without Truth**
  "To state your norm, you say: 'Assert "If A, C" iff $P(C|A)$ is high.' But in formalizing this, aren't you implicitly treating the conditional as a variable that can take a probability value on the LHS of an equation? If the conditional has no probability because it has no truth value, is 'Assertability' just a placeholder for 'Probability of Truth' in disguise? If not, what is the metric of assertability measured in, if not probability?"

  *   **Follow-up:** "If you insist assertability is distinct from probability, you need to explain why the logic of assertability mirrors the probability calculus so closely (e.g., in probabilistic validity). If the mirroring is perfect, what theoretical work is the 'no truth-value' claim actually doing, other than insulating the view from Lewis's result?"

  ### (d) The Wider Triviality Landscape

  **7. Bradley's Representation Theorems**
  "Lewis's result assumes conditionals are propositions. But Richard Bradley's results (2000, 2007) derive triviality from assumptions about *credence* and *desirability* (or acceptance conditions) without assuming truth conditions. Specifically, if we accept Import-Export and certain constraints on how preferences track probabilities, we still get collapse. Since your view relies on Adams's Thesis, which links credences to conditionals, doesn't Bradley's result bite your view even if you deny propositions?"

  *   **Follow-up:** "Your likely reply is to reject Import-Export. But Import-Export is highly intuitive for indicatives. If you sacrifice it to save Adams's Thesis, aren't you admitting that the 'no truth-value' move isn't enough to save the thesis? You still have to sacrifice core logical principles, suggesting the triviality problem is about the *thesis*, not just the *propositional status*."

  **8. Hájek's Triviality for Acceptance**
  "Alan Hájek has argued that triviality results can be run on 'acceptance' functions directly, without passing through truth conditions. If your view treats conditionals as objects of acceptance governed by $P(C|A)$, doesn't Hájek's argument show that your acceptance function must be trivial unless it violates standard probability axioms? Which axiom are you willing to violate: the additivity of acceptance, or the link between acceptance and probability?"

  *   **Follow-up:** "If you say you violate additivity, you lose the ability to model reasoning with compounds of conditionals probabilistically. If you say you keep additivity, you seem vulnerable to the triviality. Is there a third option where the probability function is context-sensitive in a way that blocks the triviality proof, and if so, doesn't that make the truth of the conditional context-relative after all?"

  **9. Completeness vs. Refutation**
  "Proponents of the propositional view (like Stalnaker) read triviality results as showing that $P(\text{If } A \text{ then } C) \neq P(C|A)$. You read them as showing conditionals aren't propositions. But given the generalized results we just discussed, isn't there a third reading: that Adams's Thesis itself is only approximately true or holds only in limited contexts? Why prefer the radical semantic revision (no truth values) over the modest epistemic revision (Adams's Thesis is not a universal norm)?"

  *   **Follow-up:** "If you stick with the universal norm, you have to explain away the cases where intuition diverges from $P(C|A)$ (e.g., Gibbardian cases). If you explain them away by appealing to pragmatic interference, how do you distinguish a failure of the semantic theory from a failure of the pragmatic story? At what point does the pragmatic cushion become large enough to swallow the semantic claim?"

  ### (e) Falsification Conditions

  **10. Empirical and Linguistic Counterevidence**
  "Finally, you present this as a discovery about the semantics of English indicatives, not a stipulative framework for idealized reasoning. What specific linguistic or empirical data would count against your view? For example, if we found a class of indicatives that embed perfectly under negation and allow for Modus Ponens without context-shift, would that force you to concede they have truth conditions? Or is the 'no truth-value' claim insulated from empirical refutation by design?"

  *   **Follow-up:** "If your answer is that no data could refute it because any problematic data can be explained away as 'pragmatic' or 'non-literal,' then aren't you effectively treating the no-truth-value claim as a methodological stance rather than a semantic hypothesis? If it's methodological, why should we think it reveals the nature of conditionals rather than just the limits of a specific formal modeling choice?"
