      *   *Refining the Diagnosis:* The user mentioned "two projects wearing one label." I should validate this but deepen it. It's not just two projects; it's one label trying to bridge the **Is-Ought gap** in a specific institutional context (Medicine). The impasse is that "Disease" is a **Deontic Marker**. It triggers obligations (to treat, to accommodate). Naturalists try to ground the deontic in the descriptive. Normativists say the deontic *constitutes* the descriptive.
      *   *Key Insight:* The disagreement is about **Conceptual Authority**. Who gets to decide? Biology or Society? The stalemate exists because both sides are right about *part* of the practice of medicine, but wrong that one definition can capture the whole practice.
      *   *Progress:* Move from **Monism** (What is *The* Definition?) to **Functional Pluralism** (What work is this classification doing *here*?).

  6.  **Final Polish:**
