answer: |-
  Dear friend, I understand why this sentence in Kant's On a Supposed Right to Lie from Philanthropy has caused you difficulty, as it sits at the crux of one of the most controversial arguments in his moral philosophy. To grasp the precise argument behind the claim that a lie vitiates the very source of right, we must first distinguish between an empirical reading and a formal reading of the text. It is tempting to read Kant as making an empirical claim about the erosion of trust, suggesting that if people lie, society will eventually collapse because no one will believe anyone else. However, this utilitarian-style argument is inconsistent with Kant's critical method, which seeks a priori grounds for duty rather than empirical generalizations. When Kant says that a lie harms humanity by vitiating the source of right, he is making a formal point about the conditions under which any right could be instituted. For Kant, rights regarding property and contracts depend upon the validity of declarations. If a declaration is not assumed to be truthful by default, the very institution of promising or contracting becomes impossible, because a contract relies on the mutual assurance that the parties are stating their will truthfully. Therefore, a lie does not just harm a specific person empirically; it attacks the formal validity of the mechanism by which humans establish rights with one another.

  This formal reading helps explain the asymmetry you noted between telling the truth to the murderer and lying to him. Kant is not arguing that the consequences of truth-telling are better than the consequences of lying, nor is he saying that the benevolent intention behind the lie makes it permissible. Instead, he is arguing about imputability and the chain of causality within a legal and moral framework. When you tell the truth to the murderer, you are fulfilling a strict duty of right. You have done everything that is incumbent upon you, and therefore any evil consequences that follow, such as the death of the victim, are caused solely by the murderer's free action and cannot be imputed to you. You are not the author of the murderer's deed. However, when you lie, you have committed a wrongful act that violates the formal condition of right. By stepping outside the bounds of lawful conduct, you enter a chain of causality where you become responsible for the outcomes of your unlawful action. If you lie and the murderer finds the victim anyway, or kills someone else, you are answerable for those consequences because they flowed from your initial violation of duty. The asymmetry lies not in the physical outcomes, which are contingent and unforeseeable, but in the juridical status of the agent who either remains within the bounds of right or steps outside them.

  Regarding your question about whether this is a claim about public justice or ethics, the best reading is that Kant is primarily discussing a duty of right, which forms the basis for public justice, though it has ethical implications. In this specific essay, Kant is responding to Benjamin Constant regarding a supposed right to lie, which frames the discussion in juridical terms. He distinguishes this from duties of virtue, which might allow for more nuance regarding intentions, but he insists that truthfulness in declarations is a perfect duty that admits no exceptions. If it were merely an ethical duty of benevolence, one might weigh it against the duty to save a life. But because Kant classifies it as a duty of right, it is strict and coercible in principle, meaning it cannot be weighed against consequences. Therefore, the passage is best read as a claim that a lie is wrong independently of consequences because it undermines the formal structure of communication required for rights, while truthfulness is a perfect duty that, when performed, insulates the agent from responsibility for the evil acts of others. This explains why the truthfully given answer does no wrong even if the result is fatal, whereas the lie incurs liability regardless of the intention.

  I am highly confident in this interpretation of the text, particularly regarding the distinction between the formal validity of declarations and empirical consequences, as this aligns with Kant's broader critical project in the Metaphysics of Morals. However, the point I am least sure of is the precise extent to which Kant successfully maintains the distinction between juridical duty and ethical duty in this specific pamphlet, as some scholars argue that he conflates the strictness of legal obligation with moral obligation here in a way that he clarifies more carefully in his later works. Despite this potential ambiguity in his late period classification, the core argument regarding the source of right remains consistent with his formalist ethics.
