      *   **Core Problem:** The "which-computations-matter-morally" problem (moral patienthood/sentience grounding).
      *   **Critique of Existing Literature:** Too anecdotal (picking one case like insects or WBEs and building up), vague on internal causal structure (waving at IIT or self-models without pinning them down), collapsing important distinctions.
      *   **Specific Task:**
          1.  Provide a "full spec" / requirements list for an adequate theory of moral patienthood/sentience grounding.
          2.  Include specific test cases (Lookup Table, Feedforward Damage Avoidance, Compressed Model vs. Original, Unhooked Pain Sim, WBE Granularity).
