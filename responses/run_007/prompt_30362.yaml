prompt: |-
  I'm a PhD student in computational neuroscience, and I keep running into the which-computations-matter-morally problem from the AI-safety and philosophy-of-mind side, but everyone I read picks one case — a feedforward classifier, an insect, a whole-brain emulation — and builds the whole theory from that one example. Before I read any more of the actual theories I want the full spec first: what does a theory of which computations ground moral patienthood (or sentience, or whatever the right primitive turns out to be) have to get right to count as adequate? I don't mean a theory of moral status in general, with rights and tradeoffs and aggregation; I mean the narrower question of which physical or computational systems, if any, have the kind of states that make them count morally in the first place, and how much the internal causal structure matters for that — its the part people wave at with phrases like integrated information or a self-model but never actually pin down.

  Give me the requirements list with the case or consideration behind each. It should at least handle: a giant lookup table that reproduces a human's input-output behavior for an hour; a feedforward network trained to detect and avoid damage but with no recurrence or self-model; two systems with identical I/O but very different internal causal structure, one of them a compressed model that predicts the other's outputs; a high-fidelity simulation of a pain state that isn't hooked up to nociception or anything motivational; and a whole-brain emulation run at different levels of spatial and temporal grain. Keep the distinctions I can't afford to collapse — having any moral weight vs how much weight, being a patient vs having welfare, sentience vs valence, intrinsic vs merely derived significance — and don't let the theory contradict whatever's actually solid about anesthesia, blindsight, or split-brain data unless you give me a reason to re-read it. Mark which requirements are non-negotiable and which are just camp preferences. Then do the part I actually want: flag the pairs of desiderata that probably can't be jointly satisfied, because I suspect the field is quietly demanding all of them at once. And tell me which single requirement does the most work eliminating the popular candidate views — briefly, a paragraph, not a survey. A table for the requirements is fine if that's cleaner.
