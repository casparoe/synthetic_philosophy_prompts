          8.  Format: Table for requirements is okay/cleaner.

  2.  **Deconstruct the Requirements (The "Spec"):**
      *   I need to translate philosophical intuitions into computational/neuroscientific constraints.
      *   *Distinction 1: Existence vs. Magnitude.* Does it count at all? vs. How much does it count?
      *   *Distinction 2: Patienthood vs. Welfare.* Being a subject of experience vs. having things that are good/bad for you.
      *   *Distinction 3: Sentience vs. Valence.* Being aware vs. feeling pain/pleasure.
      *   *Distinction 4: Intrinsic vs. Derived.* Does the computation matter because of what it *is* or what it *does* for an observer?
      *   *Test Cases:*
          *   *Lookup Table (Blockhead):* Functionalism vs. Structuralism.
          *   *Feedforward Damage Avoidance:* Reflex vs. Experience.
          *   *Compressed Model:* Isomorphism vs. Efficiency.
          *   *Unhooked Pain Sim:* Qualia vs. Functional Role.
          *   *WBE Granularity:* Substrate dependence vs. Abstract computation.
      *   *Empirical Constraints:* Anesthesia (loss of consciousness without loss of structure?), Blindsight (processing without awareness), Split-Brain (unity of subject).

  3.  **Drafting the Requirements Table:**
      *   Need columns: Requirement, Rationale/Case, Status (Non-Negotiable/Preference).
      *   *Req 1: Non-Trivial Causal Structure.* (Blocks Lookup Tables).
      *   *Req 2: Functional Integration/Unity.* (Handles Split-Brain).
