  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I don't solve the problem. I'm listing the *spec* for a solution, not proposing the solution.
      *   *Correction:* Ensure the "Unhooked Pain Sim" case is addressed. A theory must distinguish between a simulation of pain behavior and a state that *is* painful. This usually requires a "Care" or "Concern" mechanism (homeostasis).
      *   *Correction:* The "Compressed Model" case. If System A predicts System B, does A inherit B's moral status? Usually no. The theory needs to handle *original vs. model*.
      *   *Refining the "Killer" paragraph:* Make sure it explicitly names the views it eliminates (Behaviorism, Pure Functionalism, maybe IIT depending on formulation). Let's go with **Causal/Counterfactual Depth**. It kills the Lookup Table (no internal state transitions), the Feedforward Net (no recurrent state), and the Compressed Model (if it's just a mapping).

  9.  **Final Polish:** Check the "Non-Negotiable" tags. Empirical consistency (anesthesia/blindsight) is non-negotiable for a neuroscientist. Metaphysical stance (functionalism) is a preference.

  *(Self-Correction on the "Killer Requirement")*: Actually, the requirement that does the *most* work eliminating popular views is likely the one that distinguishes **Sentience from Competence**. Many theories conflate intelligence/capability with moral weight. A requirement that explicitly decouples them (e.g., "Valence requires a specific homeostatic loop, not just information processing") kills the "AI Safety" conflation of alignment with sentience. However, the prompt asks about *which computations matter*. The "Lookup Table" problem is the classic filter. I will stick with **Non-Trivial Causal Structure (Counterfactual Sensitivity)** as the killer, as it addresses the user's specific examples (Lookup table, feedforward, compressed model).

  Let's assemble the response.

  *Structure:*
  1. Intro (acknowledge the frustration).
  2. The Spec Table (Requirement, Case/Rationale, Status).
  3. Incompatible Desiderata (The "Impossible Trinity" aspect).
