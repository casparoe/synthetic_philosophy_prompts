      *   *Alternative:* The "Non-Trivial Causal Power" requirement. This kills Lookup Tables and simple Feedforward nets.
      *   *Decision:* The "Non-Trivial Causal Power / Counterfactual Sensitivity" requirement is the biggest filter. It eliminates the Lookup Table (Blockhead), the Feedforward Net (reflex), and potentially the Compressed Model if it's just a cache. It forces the theory to care about *how* the output is generated, not just *that* it is generated.

  6.  **Refining the Content for a Computational Neuroscientist:**
