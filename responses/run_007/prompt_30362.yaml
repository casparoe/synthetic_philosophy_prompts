      *Refining Status:* As a neutral spec, I need to distinguish what *must* be true for the theory to be scientifically respectable vs. what is philosophical bias.
      *   *Non-Negotiable:* Consistency with anesthesia/blindsight (empirical), Non-collapsing of distinctions (logical coherence).
      *   *Preference:* Functionalism vs. Substratism, Grading vs. Binary.

  4.  **Identifying Incompatible Desiderata (The "Trade-offs"):**
      *   This is the core insight the user wants. Where does the tension lie?
      *   *Tension 1:* Substrate Independence vs. Causal Specificity. If you demand specific causal dynamics (like IIT), you limit substrate independence. If you demand pure functionalism, you allow Lookup Tables.
      *   *Tension 2:* Phenomenal Opacity vs. Operationalizability. We want the theory to match "what it feels like" (private) but also be measurable (public).
      *   *Tension 3:* Gradedness vs. Thresholds. Neuroscience suggests gradients (anesthesia), morality often demands thresholds (rights).
      *   *Selection:* The strongest tension is between **Functional Equivalence** (saving the intuition that WBEs count) and **Causal Non-Triviality** (saving the intuition that Lookup Tables don't count). This is the "Blockhead" problem.

