      *   **Address Case 3 (OCD):** This is the key. Distinguish between *ontological freedom* (consciousness can always negate) and *practical freedom* (physical/psychological ability). Bad faith is denying ontological freedom. OCD limits practical freedom. Acknowledging that limit is *not* bad faith.
      *   **Address Case 5 (Friend):** This is the "Spirit of Seriousness." Treating values as external things rather than chosen projects.
      *   **Address Case 6 (Caste):** This is the "Essence" trap. Existence precedes essence. To say "I am a [Caste]" is to claim an essence. That is Bad Faith. But acknowledge the material danger of challenging it.
