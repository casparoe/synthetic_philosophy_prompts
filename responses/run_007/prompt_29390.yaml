          *   Development: Needs nurturing/cultivation. Can be lost if environment is bad (Ox Mountain analogy).
          *   Key Example: Child falling into a well -> immediate alarm/distress (not calculated).
      *   **Xunzi:**
          *   Core claim: *Xing* (nature) is bad/evil (self-interested, chaotic).
          *   Mechanism: Desires are innate; following them leads to conflict.
          *   Development: Virtue is *wei* (artifice/activity). Requires teachers, rituals (li), and conscious effort to reshape nature.
          *   Key Analogy: Warped wood needs straightening; dull metal needs grinding.

  3.  **Map to Developmental Psychology Vocabulary:**
      *   *Innate constraints:* Biologically fixed limitations or predispositions.
      *   *Canalization:* Developmental pathways buffered against environmental variation.
      *   *Prepared learning:* Ease of learning specific associations due to evolutionary history.
      *   *Sensitive periods:* Windows of time where input is crucial for specific development.
      *   *Default developmental trajectories:* What happens without intervention.
      *   *Starting-state capacities vs. Mature phenotype:* Initial state at birth vs. adult functioning.

      *   *Mapping Mencius:*
