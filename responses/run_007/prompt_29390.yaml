prompt: |-
  I'm a developmental psychologist who works on moral development — stuff like when kids start showing helping behavior, inequity aversion, the emergence of prosocial lying, that kind of thing. I keep hearing references to the old Mencius vs. Xunzi debate on human nature but I've never read either of them directly.

  Restate the Mencius vs. Xunzi debate in the vocabulary I actually use: innate constraints, canalization, prepared learning, sensitive periods, default developmental trajectories, and the distinction between starting-state capacities and the mature phenotype. My understanding is that Mencius thinks we're born with sprouts of virtue (like the famous child-at-the-well example) and Xunzi thinks our raw nature is self-interested and virtue is entirely artifice imposed from outside.

  Do the translation as honestly as you can — don't just map Mencius onto "nativism" and Xunzi onto "empiricism" and call it a day, because I suspect it's more interesting than that. Then give me the residue report: what translates cleanly, what gets distorted, and what has no counterpart in my vocabulary at all. The thing I most want to know: is there a genuine empirical disagreement here that my field could in principle adjudicate, or are they using "nature" (xing) in such different ways that the translation dissolves the apparent conflict?
