      *   *Mapping Xunzi:*
          *   Starting state: Domain-general drives (survival, desire) that are antisocial in a group context.
          *   Trajectory: Default leads to conflict/chaos.
          *   Mechanism: Heavy reliance on external scaffolding (ritual/teachers). Not "prepared" for virtue; virtue is a cognitive override or restructuring.
          *   Risk: Without intense external regulation, the phenotype remains "uncultured."

  4.  **Drafting the Translation (Iterative Process):**
