      *   *Critique 2:* Better, but Xunzi acknowledges innate *desires*. It's about the *direction* of the innate stuff.
      *   *Refinement:* Focus on the *starting-state capacities*. Mencius: Starting state includes proto-moral affective responses. Xunzi: Starting state includes proto-social drives that are dysregulated. Focus on *canalization*. Mencius: Moral development is canalized (robust). Xunzi: Moral development is labile (requires specific input).

