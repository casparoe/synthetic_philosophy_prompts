      *   *No Counterpart:* Normativity (ought vs. is), Consciousness/Qualia (the "feeling" of running code), First-person perspective. The system doesn't "know" it's running.
      *   *The "Hard" Problem:* Why does it feel like something to be the CPU? (Engineering doesn't care, philosophy does).

  5.  **Formulating the Verdict:**
