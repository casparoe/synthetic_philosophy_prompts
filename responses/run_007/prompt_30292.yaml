      *   *Premise 1 (Physical Causal Closure):* Every physical event has a sufficient physical cause.
      *   *Premise 2 (No Overdetermination):* Events aren't systematically caused twice (once physically, once mentally) unless it's a rare fluke.
      *   *Premise 3 (Distinctness):* Mental states are not identical to physical states (Non-reductive physicalism).
      *   *Conclusion:* Mental states cause nothing. They are epiphenomenal.
      *   *The Tension:* We want mental states to be real and causal, but the physics seems to do all the work.

  3.  **Drafting the Translation (Systems Engineering Vocabulary):**
      *   *Physical Base:* Silicon, electrons, registers, machine code execution.
      *   *Mental State:* High-level logic, application state, variable values, algorithmic intent.
      *   *Causal Closure:* The hardware is deterministic. The next state of the CPU is fully determined by the current state of the CPU + inputs. No "magic" jumps from the logic layer directly to the electron layer without going through the compilation/execution mechanism.
      *   *Distinctness:* The source code (logic) is distinct from the binary (physical). You can change the source without changing the compiler.
      *   *Multiple Realizability:* Same source code compiles to x86, ARM, RISC-V.
