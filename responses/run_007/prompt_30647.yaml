answer: |-
  You have identified a genuine gap in how the "Sunk Cost Fallacy" is popularly taught versus how it functions in complex decision theory. The short answer is: **There is no single, universally standardized term for this distinction,** but economists and game theorists handle it by separating the *cost itself* from the *structural consequences of having incurred it.*

  The "textbook" definition of the Sunk Cost Fallacy applies to **accounting irrelevance**. Your examples describe **structural or strategic relevance**.

  Here is the carve you are looking for, the terminology that exists around it, and the litmus test to distinguish them.

  ### 1. The Core Distinction: Cost vs. Consequence

  The Sunk Cost Fallacy occurs when you treat a past expenditure as a **debt** that future utility must repay.
  *   *Logic:* "I spent $X, so I must extract $X worth of value."
  *   *Error:* The money is gone. Future value cannot change the past balance sheet.

  Your examples describe cases where the past expenditure altered the **future payoff structure**.
  *   *Logic:* "Because I spent $X, the cost/benefit ratio of my *next* action has changed."
  *   *Validity:* The money is gone, but the *contract* or *information state* it created remains.

  #### Case A: The Gym (Marginal Cost Adjustment)
  This is not a sunk cost argument; it is a **marginal cost** argument.
  *   **The Fallacy Version:** "I must go to the gym to get my money's worth." (Trying to recover the past).
  *   **The Rational Version:** "Because I prepaid, the marginal cost of this specific visit is $0. If I hadn't prepaid, the marginal cost would be $20."
  *   **The Carve:** The sunk payment purchased a **price structure**. You aren't justifying the past; you are responding to a cheaper present. In microeconomics, this is simply **rational response to fixed vs. variable costs.** The sunk cost created a subsidy for future behavior.

  #### Case B: The Clinical Trial (Signaling & Reputation)
  This is a **game theoretic** argument, specifically regarding **signaling** and **second-order rationality**.
  *   **The Fallacy Version:** "We spent $10M on this trial, so the drug must work." (Believing spending creates value).
  *   **The Rational Version:** "If we stop now, the market will *infer* the drug doesn't work, raising our future capital costs. Continuing buys us time to manage that signal."
  *   **The Carve:** Here, the sunk cost matters only because **other actors are irrational.** If investors were perfectly rational, they would ignore the sunk cost and judge the trial solely on current probability of success. Because investors *commit the sunk cost fallacy*, it becomes rational for the company to cater to that bias.
  *   **Term:** This is often called **"Rational Escalation"** or **"Strategic Commitment."** You are not throwing good money after bad to recover the past; you are spending new money to protect a **reputational asset** that would be damaged by abandonment.

  ### 2. Is There a Name for This?

  While there isn't one magic word, there are three concepts that cover this territory:

  1.  **Real Options:** In finance, an initial investment often buys the *option* (but not the obligation) to make further investments. Continuing the clinical trial might be framed as "exercising an option" to keep the intellectual property alive, rather than "recovering sunk costs."
  2.  **Endogenous Sunk Costs:** In Industrial Organization economics, this refers to sunk costs that a firm chooses to incur to alter the competitive environment (e.g., spending on R&D to raise barriers to entry). The cost is sunk, but its *existence* changes the game.
  3.  **Escalation of Commitment:** This is the broader psychological term. It encompasses both the fallacy (irrational escalation) and the strategic version (rational escalation to save face or signal strength).

  ### 3. The Litmus Test: The "Magic Eraser"

  To distinguish the fallacy from the rational exception, use this thought experiment:

  **"If I could magically erase my memory of the money spent, but keep all contracts, reputations, and physical assets intact, would my decision change?"**

  *   **The Gym:**
      *   *Erase Memory:* You forget you paid $500.
      *   *Keep Contracts:* You still hold a card that says "Entry is free for members."
      *   *Decision:* You still go, because entry is free.
      *   *Verdict:* **Rational.** The decision relies on the *contract*, not the memory of the payment.

  *   **The Movie (Classic Fallacy):**
      *   *Erase Memory:* You forget you paid $15.
      *   *Keep Contracts:* You are still in the seat.
      *   *Decision:* You leave, because the movie sucks and staying costs you time.
      *   *Verdict:* **Fallacy.** If you forgot the price, you wouldn't stay. Therefore, the price is the only reason you are staying.

  *   **The Clinical Trial:**
      *   *Erase Memory:* You forget you spent $10M.
      *   *Keep Reputation:* Investors *still remember* you spent $10M and will judge you on quitting.
      *   *Decision:* You continue, to avoid the reputational hit.
      *   *Verdict:* **Rational (Strategic).** You are responding to the *investors'* memory, not your own.

  ### 4. The Borderline: Where It Gets Dangerous

  The danger zone is where **Strategic Commitment** disguises itself as **Rational Escalation**. This is the borderline you asked about.

  In the Clinical Trial case, the reasoning holds only if the "signal" is real.
  *   **Rational:** "Investors are irrational; they will punish us for quitting. We must spend $1M more to smooth the transition."
  *   **Fallacy:** "Investors might be irrational, but also, maybe the drug *will* work if we just spend $1M more."

  The borderline is crossed when the **cost of the signal exceeds the cost of the truth.**
  If stopping the trial raises your cost of capital by 1%, but continuing the trial burns cash at a rate equivalent to 5% of your capital, you are no longer managing a signal; you are bleeding out to save face.

  ### Summary of the Carve

  | Feature | Sunk Cost Fallacy | Rational "Sunk" Consideration |
  | :--- | :--- | :--- |
  | **Focus** | Recovering past value. | Optimizing future constraints. |
  | **Mechanism** | Psychological accounting ("Debt"). | Structural change (Contracts, Signals). |
  | **Dependency** | Depends on *remembering* the cost. | Depends on *consequences* of the cost. |
  | **Economic Term** | Concorde Fallacy. | Marginal Analysis / Signaling / Real Options. |
  | **Key Question** | "How do I make this worth it?" | "How does this change my next step's price?" |

  **The Verdict:**
  You are correct that the standard advice is often oversimplified. The money is always irrelevant, but the **situation the money bought** is often highly relevant.
  *   In the **Gym**, the money bought a **lower marginal price**.
  *   In the **Trial**, the money bought a **reputational position**.

  If you need a label for your notes, call it **"Consequential Sunk Costs"** versus **"Accounting Sunk Costs."** The former acknowledges that while the *dollars* are gone, the *state of the world* they created remains.
